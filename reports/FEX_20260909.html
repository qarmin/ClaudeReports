{"id":"LOGIC_107","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In Module.cpp HandleSyscallImpl(), the return address is read from the guest stack as '*(uint32_t*)(Frame->State.gregs[REG_RSP])' (line 439). This casts a uint64_t guest virtual address to a host pointer and dereferences it without any safety check. If the JIT maps guest memory via identity mapping this works, but the assumption is implicit and undocumented. If RSP holds an unmapped or out-of-range address, this causes a host segfault or memory corruption.","fix":"This is inherent to the WOW64 architecture and likely intentional (the JIT maps guest memory at its native address). Add a comment explaining the identity-mapping assumption to prevent future confusion.","locations":[{"ref":"Source/Windows/WOW64/Module.cpp:453-454","code":"  453 |     const uint64_t ReturnRIP = *(uint32_t*)(Frame->State.gregs[FEXCore::X86State::REG_RSP]); // Return address from the stack\n  454 |     uint64_t ReturnRSP = Frame->State.gregs[FEXCore::X86State::REG_RSP] + 4;                 // Stack pointer after popping return address","lines":2,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Windows/WOW64/Module.cpp#L453-L454"}]},
{"id":"LOGIC_108","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In Module.cpp BTCpuThreadTerm(), after acquiring ThreadCreationMutex and erasing the thread from Threads, the code releases the mutex before calling CTX->DestroyThread(ThreadState). Between mutex release and DestroyThread, another thread could concurrently iterate Threads and attempt to use ThreadState (e.g. in BTCpuSuspendLocalThread which locks ThreadCreationMutex and then accesses TLS.ThreadState()). DestroyThread should either be called while the mutex is held, or ThreadState should be nulled in TLS before releasing the mutex.","fix":"Either call CTX->DestroyThread(ThreadState) inside the scoped_lock block before it releases, or null out TLS.ThreadState() before releasing the mutex so other threads see a consistent state.","locations":[{"ref":"Source/Windows/WOW64/Module.cpp:671-692","code":"  671 |   {\n  672 |     std::scoped_lock Lock(ThreadCreationMutex);\n  673 |     auto it = Threads.find(ThreadTID);\n  674 |     if (it == Threads.end()) {\n  675 |       // Thread already terminated\n  676 |       return;\n  677 |     }\n  678 | \n  679 |     Threads.erase(it);\n  680 |     if (StatAllocHandler) {\n  681 |       StatAllocHandler->DeallocateSlot(TLS.ThreadState()->ThreadStats);\n  682 |     }\n  683 |   }\n  684 |   auto ThreadState = TLS.ThreadState();\n  685 | \n  686 |   delete GetFrontendThreadData(ThreadState);\n  687 | \n  688 |   // GDT and LDT are mirrored, only free one.\n  689 |   delete[] ThreadState->CurrentFrame->State.segment_arrays[FEXCore::Core::CPUState::SEGMENT_ARRAY_INDEX_GDT];\n  690 | \n  691 |   FEX::Windows::CallRetStack::DestroyThread(ThreadState);\n  692 |   CTX->DestroyThread(ThreadState);","lines":22,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Windows/WOW64/Module.cpp#L671-L692"}]},
{"id":"LOGIC_109","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `AnalysisAction::ParseInterface`, `param_idx` is validated with `param_idx >= function->getNumParams() || param_idx < -1` (line 256), but a value of `-1` is explicitly treated as the return-value index throughout the code.\nThe lower bound check `param_idx < -1` should be `param_idx < -1`, which is correct, but the upper bound is compared against `getNumParams()` using `>=`, so an index equal to `getNumParams()` (which is out of bounds for 0-indexed params) is caught.\nHowever the type is `getSExtValue()` from an `IntegerLiteral`, which means a value of `INT64_MIN` would also slip past `< -1` and be used as an `unsigned` param index downstream, causing undefined behavior or a crash.","fix":"Tighten the lower bound: `param_idx < -1 || param_idx > (int)function->getNumParams() - 1` and also reject large negative values explicitly.","locations":[{"ref":"ThunkLibs/Generator/analysis.cpp:256-257","code":"  256 |         if (param_idx >= function->getNumParams() || param_idx < -1) {\n  257 |           throw report_error(GetTemplateArgLocation(decl, 1), \"Out-of-bounds parameter index passed to fex_gen_param\");","lines":2,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/Generator/analysis.cpp#L256-L257"}]},
{"id":"LOGIC_110","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`CoverReferencedTypes` iterates over `types` (an `unordered_map`) while potentially inserting into it during the same pass (`types.emplace(member_type, ...)`).\nAlthough the code resets `next_type_it` to the newly inserted element when `inserted == true`, the standard explicitly states that inserting into `std::unordered_map` invalidates all iterators in the worst case (when a rehash occurs).\nUsing `type_it` after such an insert is therefore undefined behavior.","fix":"Collect newly discovered types into a separate local vector, then merge them back into `types` after the full iteration loop completes.","locations":[{"ref":"ThunkLibs/Generator/analysis.cpp:543-595","code":"  543 |   for (bool changed = true; std::exchange(changed, false);) {\n  544 |     for (auto next_type_it = types.begin(), type_it = next_type_it; type_it != types.end(); type_it = next_type_it) {\n  545 |       ++next_type_it;\n  546 |       const auto& [type, type_repack_info] = *type_it;\n  547 |       if (!type->isStructureType()) {\n  548 |         continue;\n  549 |       }\n  550 | \n  551 |       if (type_repack_info.assumed_compatible) {\n  552 |         // If assumed compatible, we don't need the member definitions\n  553 |         continue;\n  554 |       }\n  555 | \n  556 |       for (auto* member : type->getAsStructureType()->getDecl()->fields()) {\n  557 |         auto member_type = member->getType().getTypePtr();\n  558 |         if (type_repack_info.UsesCustomRepackFor(member) && member_type->isPointerType() && member_type->getPointeeType()->isStructureType()) {\n  559 |           continue;\n  560 |         }\n  561 | \n  562 |         while (member_type->isArrayType()) {\n  563 |           member_type = member_type->getArrayElementTypeNoTypeQual();\n  564 |         }\n  565 |         while (member_type->isPointerType()) {\n  566 |           member_type = member_type->getPointeeType().getTypePtr();\n  567 |         }\n  568 | \n  569 |         if (!member_type->isBuiltinType()) {\n  570 |           member_type = context.getCanonicalType(member_type);\n  571 |         }\n  572 |         if (types.contains(member_type) && types.at(member_type).pointers_only) {\n  573 |           if (member_type == context.getCanonicalType(member->getType().getTypePtr())) {\n  574 |             throw std::runtime_error(\n  575 |               fmt::format(\"\\\"{}\\\" references opaque type \\\"{}\\\" via non-pointer member \\\"{}\\\"\", clang::QualType {type, 0}.getAsString(),\n  576 |                           clang::QualType {member_type, 0}.getAsString(), member->getNameAsString()));\n  577 |           }\n  578 |           continue;\n  579 |         }\n  580 |         if (member_type->isUnionType() && !types.contains(member_type) && !type_repack_info.UsesCustomRepackFor(member)) {\n  581 |           throw std::runtime_error(fmt::format(\"\\\"{}\\\" has unannotated member \\\"{}\\\" of union type \\\"{}\\\"\", clang::QualType {type, 0}.getAsString(),\n  582 |                                                member->getNameAsString(), clang::QualType {member_type, 0}.getAsString()));\n  583 |         }\n  584 | \n  585 |         if (!member_type->isStructureType() && !(member_type->isBuiltinType() && !member_type->isVoidType()) && !member_type->isEnumeralType()) {\n  586 |           continue;\n  587 |         }\n  588 | \n  589 |         auto [new_type_it, inserted] = types.emplace(member_type, RepackedType {});\n  590 |         if (inserted) {\n  591 |           changed = true;\n  592 |           next_type_it = new_type_it;\n  593 |         }\n  594 |       }\n  595 |     }","lines":53,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/Generator/analysis.cpp#L543-L595"}]},
{"id":"LOGIC_111","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`get_type_name` in `analysis.h` extracts the filename for unnamed types using `rfind(\"/\")` which finds the last `/`, then takes `substr` of that result starting at index 1 to strip the `/`.\nHowever if the path contains no `/` at all, `rfind` returns `std::string::npos` (which is `SIZE_MAX`), and `substr(SIZE_MAX)` on a short string throws `std::out_of_range`, crashing the generator on unusual include paths.","fix":"Guard against `npos`:\n```cpp\nauto pos = filename.rfind('/');\nif (pos != std::string::npos) { filename = filename.substr(pos + 1); }\n```","locations":[{"ref":"ThunkLibs/Generator/analysis.h:183-184","code":"  183 |       filename = std::move(filename).substr(filename.rfind(\"/\"));\n  184 |       filename = std::move(filename).substr(1);","lines":2,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/Generator/analysis.h#L183-L184"}]},
{"id":"LOGIC_112","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `DataLayoutCompareAction::GetTypeCompatibility`, when a guest struct member is found to be missing from the host struct, only a `TypeCompatibility::None` entry is pushed and then `break` is executed immediately.\nThis means the member_compat vector has fewer entries than the struct's members.\nThe final reduction logic at lines 380-388 operates correctly on this shorter vector (it will find `None` and downgrade), but the early break silently skips checking the remaining host members for extra fields, so the check at line 301 (\"Also detect host members that are missing from the guest struct\") mentioned in the TODO is never performed and incompatible types could be misclassified as Repackable instead of None.","fix":"After the break, iterate the host struct's fields to detect members present in host but absent in guest; push TypeCompatibility::None for each and set compat = TypeCompatibility::None.","locations":[{"ref":"ThunkLibs/Generator/data_layout.cpp:299-304","code":"  299 |       if (!host_member_field) {\n  300 |         // No corresponding host struct member\n  301 |         // TODO: Also detect host members that are missing from the guest struct\n  302 |         member_compat.push_back(TypeCompatibility::None);\n  303 |         break;\n  304 |       }","lines":6,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/Generator/data_layout.cpp#L299-L304"},{"ref":"ThunkLibs/Generator/data_layout.cpp:380-388","code":"  380 |     if (std::all_of(member_compat.begin(), member_compat.end(), [](auto compat) { return compat == TypeCompatibility::Full; })) {\n  381 |       // TypeCompatibility::Full or ::Repackable\n  382 |     } else if (std::none_of(member_compat.begin(), member_compat.end(), [](auto compat) { return compat == TypeCompatibility::None; })) {\n  383 |       // Downgrade to Repackable\n  384 |       compat = TypeCompatibility::Repackable;\n  385 |     } else {\n  386 |       // Downgrade to None\n  387 |       compat = TypeCompatibility::None;\n  388 |     }","lines":9,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/Generator/data_layout.cpp#L380-L388"}]},
{"id":"LOGIC_113","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `gen.cpp` the `format_decl` lambda searches for a `(*` sequence to locate where to insert a function-pointer variable name, but the search advances with `++needle` inside the loop body (line 371) and then the outer `for` also increments `needle` with `++it`, so the actual scanning is inconsistent and may skip characters or go out of bounds for complex pointer-to-function-pointer signatures like `void (***fn)()`.\nAdditionally the sentinel check `needle == signature.end()` is placed after the inner `while (*++needle == '*')` loop, meaning `needle` may be dereferenced past end when `*` characters run to the end of the string.","fix":"Rewrite the scan loop to track position cleanly without double-advancement, and add a bounds check before each dereference inside the inner `while` loop.","locations":[{"ref":"ThunkLibs/Generator/gen.cpp:362-376","code":"  362 |       auto signature = type.getAsString();\n  363 | \n  364 |       // Search for strings like (*), (**), or (*****). Insert the\n  365 |       // variable name before the closing parenthesis\n  366 |       auto needle = signature.begin();\n  367 |       for (; needle != signature.end(); ++needle) {\n  368 |         if (signature.end() - needle < 3 || std::string_view {&*needle, 2} != \"(*\") {\n  369 |           continue;\n  370 |         }\n  371 |         while (*++needle == '*') {}\n  372 |         if (*needle == ')') {\n  373 |           break;\n  374 |         }\n  375 |       }\n  376 |       if (needle == signature.end()) {","lines":15,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/Generator/gen.cpp#L362-L376"}]},
{"id":"LOGIC_114","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `main.cpp` line 85, `argv[6]` is accessed unconditionally with `argv[6] == std::string_view {\"-for-32bit-guest\"}`.\nThe argument count check at line 36 (`argc != 6 && argc != 7`) ensures there are either 6 or 7 arguments before the `--` separator.\nHowever when `argc == 6`, `argv[6]` points to the null terminator element `argv[argc]`, which is technically valid C++ (it is a null pointer), so the `std::string_view` comparison will correctly return false.\nThis is fragile: the code relies on `argv[argc]` being null (guaranteed by the C++ standard for main), but the intent is clearly to check if argv[6] was provided. The implicit null-argv[6] comparison is confusing and error-prone.","fix":"Use an explicit check: `const bool is_32bit_guest = (argc == 7 && argv[6] == std::string_view{\"-for-32bit-guest\"});`","locations":[{"ref":"ThunkLibs/Generator/main.cpp:85","code":"   85 |   const bool is_32bit_guest = (argv[6] == std::string_view {\"-for-32bit-guest\"});","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/Generator/main.cpp#L85"}]},
{"id":"LOGIC_115","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"GuestToHostConnection always connects to the default X display (passing nullptr to xcb_connect) regardless of what display the guest connection targets. If a guest uses a non-default X display (e.g., :1 or a remote display), the host-side xcb connection will use the wrong display, causing rendering or event handling to go to the wrong server.","fix":"Derive the display string from the guest connection if possible. One approach: store the display name when a guest Display is first registered and use it for the xcb connection.","locations":[{"ref":"ThunkLibs/include/common/X11Manager.h:32-47","code":"   32 |   xcb_connection_t* GuestToHostConnection(xcb_connection_t* GuestConnection) {\n   33 |     std::unique_lock lock(mutex);\n   34 |     auto [it, inserted] = connections.emplace(GuestConnection, nullptr);\n   35 |     if (inserted) {\n   36 |       // NOTE: There's no easy way to query the display name from the guest, so just connect to the default display.\n   37 |       static void* libxcb = dlopen(\"libxcb.so.1\", RTLD_LAZY);\n   38 |       static auto ptr_xcb_connect = (decltype(&xcb_connect))dlsym(libxcb, \"xcb_connect\");\n   39 |       static auto ptr_xcb_connection_has_error = (decltype(&xcb_connection_has_error))dlsym(libxcb, \"xcb_connection_has_error\");\n   40 |       it->second = ptr_xcb_connect(nullptr, nullptr);\n   41 |       if (ptr_xcb_connection_has_error(it->second)) {\n   42 |         fprintf(stderr, \"ERROR: Could not open xcb connection\\n\");\n   43 |         std::abort();\n   44 |       }\n   45 |     }\n   46 |     return it->second;\n   47 |   }","lines":16,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/include/common/X11Manager.h#L32-L47"}]},
{"id":"LOGIC_116","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"GuestToHostDisplay in X11Manager calls GuestXSync(GuestDisplay, 0) before taking the mutex, without checking whether GuestXSync is null. GuestXSync is a function pointer initialized to nullptr and set only via the GL_SetGuestXSync callback during GL library init. If GuestToHostDisplay is called before that init completes (e.g., if another library triggers a Display lookup first), the null pointer call will crash.","fix":"Add a null check before calling: if (GuestXSync) { GuestXSync(GuestDisplay, 0); }","locations":[{"ref":"ThunkLibs/include/common/X11Manager.h:52-68","code":"   52 |   _XDisplay* GuestToHostDisplay(_XDisplay* GuestDisplay) {\n   53 |     // Flush event queue to make effects of the guest-side connection visible\n   54 |     GuestXSync(GuestDisplay, 0);\n   55 | \n   56 |     std::unique_lock lock(mutex);\n   57 |     auto [it, inserted] = displays.emplace(GuestDisplay, nullptr);\n   58 |     if (inserted) {\n   59 |       auto host_display = HostXOpenDisplay(GuestXDisplayString(GuestDisplay));\n   60 |       fprintf(stderr, \"Opening host-side X11 display: %p -> %p\\n\", GuestDisplay, host_display);\n   61 |       if (!host_display) {\n   62 |         fprintf(stderr, \"ERROR: Could not open X display\\n\");\n   63 |         std::abort();\n   64 |       } else {\n   65 |         it->second = host_display;\n   66 |       }\n   67 |     }\n   68 |     return it->second;","lines":17,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/include/common/X11Manager.h#L52-L68"}]},
{"id":"LOGIC_117","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"glXEnumerateVideoDevicesNV is registered in libGL_interface.cpp with a plain (non-custom) host impl (comment says 'TODO: Custom host impl'). The function returns a host-allocated unsigned int* array. Without a custom impl that relocates the array to the guest heap (like glXChooseFBConfig / glXGetFBConfigs do), the raw host pointer is returned to the 32-bit guest, where it would be silently truncated to 32 bits and become unusable, and the host-allocated memory is never freed.","fix":"Add a custom_host_impl for glXEnumerateVideoDevicesNV that calls fexldr_ptr_libGL_glXEnumerateVideoDevicesNV, then passes the result through RelocateArrayToGuestHeap(*nelements) to copy the array to the guest heap and free the host copy.","locations":[{"ref":"ThunkLibs/libGL/libGL_Host.cpp:156","code":"  156 | // TODO: unsigned int *glXEnumerateVideoDevicesNV (Display *dpy, int screen, int *nelements);","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/libGL/libGL_Host.cpp#L156"},{"ref":"ThunkLibs/libGL/libGL_interface.cpp:6446","code":" 6446 | struct fex_gen_config<glXEnumerateVideoDevicesNV> {}; // TODO: Custom host impl","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/libGL/libGL_interface.cpp#L6446"}]},
{"id":"LOGIC_118","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In RelocateArrayToGuestHeap, the return value of GuestMalloc is stored directly into GuestData.data without checking for null (allocation failure / OOM). If GuestMalloc returns nullptr, GuestData.data is set to 0 and the subsequent GuestData.get_pointer()[Index] dereference at the loop on the next line writes through a null pointer, causing undefined behavior / crash.","fix":"Check the result of GuestMalloc: if it returns null (i.e., GuestData.data == 0), call HostXFree(Data) to avoid leaking the host allocation and return the null guest layout immediately, just as the !Data early-return does.","locations":[{"ref":"ThunkLibs/libGL/libGL_Host.cpp:299-303","code":"  299 |   guest_layout<T*> GuestData;\n  300 |   GuestData.data = reinterpret_cast<uintptr_t>(GuestMalloc(sizeof(guest_layout<T>) * NumItems));\n  301 |   for (int Index = 0; Index < NumItems; ++Index) {\n  302 |     GuestData.get_pointer()[Index] = to_guest(to_host_layout(Data[Index]));\n  303 |   }","lines":5,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/libGL/libGL_Host.cpp#L299-L303"}]},
{"id":"LOGIC_119","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In glGetUniformIndices (32-bit thunk path), the alloca for HostNames uses sizeof(GLintptr) instead of sizeof(const GLchar*). All analogous functions (glShaderSource, glCompileShaderIncludeARB, glCreateShaderProgramv, glShaderSourceARB) correctly use sizeof(const char*). On the 64-bit host both sizes are equal (8), so there is no runtime corruption today, but the type used is wrong and would silently underallocate if the sizes ever diverged.","fix":"Change `alloca(Count * sizeof(GLintptr))` to `alloca(Count * sizeof(const GLchar*))` to match all other similar pointer-array alloca calls in the same file.","locations":[{"ref":"ThunkLibs/libGL/libGL_Host.cpp:446","code":"  446 |   auto HostNames = (const GLchar**)alloca(Count * sizeof(GLintptr));","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/libGL/libGL_Host.cpp#L446"}]},
{"id":"LOGIC_120","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"SDL_sscanf and SDL_vsscanf stubs ignore the input string, format string, and all output arguments entirely, then return the printf return value. Any caller that relies on SDL_sscanf to parse values will silently get no output filled in and a wrong return value (should be number of items matched; will be ~19).","fix":"Implement real wrappers: int SDL_sscanf(const char* text, const char* fmt, ...) { va_list ap; va_start(ap, fmt); int r = vsscanf(text, fmt, ap); va_end(ap); return r; } and similarly for SDL_vsscanf.","locations":[{"ref":"ThunkLibs/libSDL2/libSDL2_Guest.cpp:34-36","code":"   34 | int SDL_sscanf(const char*, const char*, ...) {\n   35 |   return printf(\"SDL2: SDL_sscanf\\n\");\n   36 | }","lines":3,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/libSDL2/libSDL2_Guest.cpp#L34-L36"},{"ref":"ThunkLibs/libSDL2/libSDL2_Guest.cpp:71-73","code":"   71 | int SDL_vsscanf(const char*, const char*, __va_list_tag*) {\n   72 |   return printf(\"SDL2: SDL_vsscanf\\n\");\n   73 | }","lines":3,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/libSDL2/libSDL2_Guest.cpp#L71-L73"}]},
{"id":"LOGIC_121","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"SDL_SetError stub returns the return value of printf (a positive number, typically ~19), but the SDL2 API contract requires SDL_SetError to always return -1. Callers that check the return value of SDL_SetError will observe an incorrect positive result.","fix":"Change the stub to: int SDL_SetError(const char*, ...) { printf(\"SDL2: SDL_SetError\\n\"); return -1; }","locations":[{"ref":"ThunkLibs/libSDL2/libSDL2_Guest.cpp:61-63","code":"   61 | int SDL_SetError(const char*, ...) {\n   62 |   return printf(\"SDL2: SDL_SetError\\n\");\n   63 | }","lines":3,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/libSDL2/libSDL2_Guest.cpp#L61-L63"}]},
{"id":"LOGIC_122","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In Emitter.h, the LONG_ADDRESS_GEN label fixup uses ADR with a truncated 15-bit immediate:\n\n  adr(DestReg, static_cast<uint32_t>(ImmInstThree) & 0x7FFF);\n\nADR has a 21-bit signed PC-relative immediate (range -1MB to +1MB-4).  Masking to 15 bits\nsilently truncates offsets larger than 32KB, generating the wrong address without any\ndiagnostic.  The same truncation appears for ADRP.","fix":"Pass the full 21-bit range to adr/adrp; remove the 0x7FFF mask or expand it to 0x1FFFFF.","locations":[{"ref":"CodeEmitter/CodeEmitter/Emitter.h:758-770","code":"  758 |         // If within ADR range from the third instruction, then we can emit NOP+NOP+ADR\n  759 |         nop();\n  760 |         nop();\n  761 |         adr(DestReg, static_cast<uint32_t>(ImmInstThree) & 0x7FFF);\n  762 |       } else if (IsADRPRange(ImmInstTwo)) {\n  763 | \n  764 |         // If within ADRP range from the first instruction, then we are /definitely/ in range for the second instruction.\n  765 |         // First check if we are in non-offset range for second instruction.\n  766 |         if (IsADRPAligned(reinterpret_cast<uint64_t>(CurrentAddress))) {\n  767 |           // We can emit nop + nop + adrp\n  768 |           nop();\n  769 |           nop();\n  770 |           adrp(DestReg, static_cast<uint32_t>(ImmInstThree >> 12) & 0x7FFF);","lines":13,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/CodeEmitter/CodeEmitter/Emitter.h#L758-L770"}]},
{"id":"LOGIC_123","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In JITSymbols::Register (buffered, both overloads) and RegisterNamedRegion (buffered), after\na forced flush of the buffer the function recurses unconditionally to retry.  If the single\nentry to be written is larger than BUFFER_SIZE (e.g. an extremely long Name), the retry will\nagain fail to fit, trigger another forced flush of an empty buffer, and recurse infinitely\nuntil a stack overflow.","fix":"After the forced flush, check whether the entry fits; if not, fall back to a direct write(fd, ...) rather than recursing.","locations":[{"ref":"FEXCore/Source/Common/JitSymbols.cpp:70-76","code":"   70 |   if (FMTResult.out >= &Buffer->Buffer[Buffer->BUFFER_SIZE]) {\n   71 |     // Couldn't fit, need to force a write.\n   72 |     WriteBuffer(Buffer, true);\n   73 |     // Rerun\n   74 |     Register(Buffer, HostAddr, GuestAddr, CodeSize);\n   75 |     return;\n   76 |   }","lines":7,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Common/JitSymbols.cpp#L70-L76"},{"ref":"FEXCore/Source/Common/JitSymbols.cpp:95-100","code":"   95 |   if (FMTResult.out >= &Buffer->Buffer[Buffer->BUFFER_SIZE]) {\n   96 |     // Couldn't fit, need to force a write.\n   97 |     WriteBuffer(Buffer, true);\n   98 |     // Rerun\n   99 |     Register(Buffer, HostAddr, CodeSize, Name, Offset);\n  100 |     return;","lines":6,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Common/JitSymbols.cpp#L95-L100"},{"ref":"FEXCore/Source/Common/JitSymbols.cpp:119-125","code":"  119 |   if (FMTResult.out >= &Buffer->Buffer[Buffer->BUFFER_SIZE]) {\n  120 |     // Couldn't fit, need to force a write.\n  121 |     WriteBuffer(Buffer, true);\n  122 |     // Rerun\n  123 |     RegisterNamedRegion(Buffer, HostAddr, CodeSize, Name);\n  124 |     return;\n  125 |   }","lines":7,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Common/JitSymbols.cpp#L119-L125"}]},
{"id":"LOGIC_124","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In SoftFloat.h FCMP, the nan detection relies on a secondary extF80_le call:\n\n  bool gt = !(*eq) && !(*lt) && extF80_le(state, rhs, lhs);\n  *nan = !(*eq) && !(*lt) && !gt;\n\nIf either operand is NaN, extF80_le returns false (unordered), so gt is false, and *nan is\nset correctly.  However calling extF80_le when both operands are the same QNaN may raise the\ninvalid-operation flag a second time inside softfloat, potentially setting exceptionFlags\nspuriously.  The existing comment claims this approach is \"more reliable than custom NaN\ndetection\" but it silently modifies state->exceptionFlags as a side-effect of comparison.","fix":"Use the IsNan() helper to detect NaN before calling comparison functions, avoiding the side-effecting extF80_le on NaN inputs.","locations":[{"ref":"FEXCore/Source/Common/SoftFloat.h:309-318","code":"  309 |   FEXCORE_PRESERVE_ALL_ATTR static void\n  310 |   FCMP(softfloat_state* state, const X80SoftFloat& lhs, const X80SoftFloat& rhs, bool* eq, bool* lt, bool* nan) {\n  311 |     *eq = extF80_eq(state, lhs, rhs);\n  312 |     *lt = extF80_lt(state, lhs, rhs);\n  313 | \n  314 |     // Use IEEE 754 semantics: unordered if neither <, =, nor > is true\n  315 |     // This is more reliable than custom NaN detection\n  316 |     bool gt = !(*eq) && !(*lt) && extF80_le(state, rhs, lhs);\n  317 |     *nan = !(*eq) && !(*lt) && !gt;\n  318 |   }","lines":10,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Common/SoftFloat.h#L309-L318"}]},
{"id":"LOGIC_125","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In CodeMap::ParseCodeMap, the check for read failure after reading ExternalLibraryInfo (line 102) is missing. If File.read(&Info, ...) fails (e.g. truncated file), Info contains uninitialized garbage. The code then calls std::getline to read a filename and stores Ret[Info.ExternalFileId].Filename with a valid key derived from garbage data. The failure check only comes after the filename read (line 110). This can insert a bogus entry into the result map before detecting the error.","fix":"Add 'if (!File) break;' immediately after the File.read(&Info, sizeof(Info)) call at line 102, before reading the filename.","locations":[{"ref":"FEXCore/Source/Interface/Core/CodeCache.cpp:101-113","code":"  101 |       ExternalLibraryInfo Info;\n  102 |       File.read(reinterpret_cast<char*>(&Info), sizeof(Info));\n  103 | \n  104 |       fextl::string Filename;\n  105 |       std::getline(File, Filename, '\\0');\n  106 | \n  107 |       // Align to 4-byte boundary\n  108 |       char Null[4];\n  109 |       File.read(Null, AlignUp(Filename.size() + 1, 4) - Filename.size() - 1);\n  110 |       if (!File) {\n  111 |         break;\n  112 |       }\n  113 |       Ret[Info.ExternalFileId].Filename = std::move(Filename);","lines":13,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/CodeCache.cpp#L101-L113"}]},
{"id":"LOGIC_126","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In CodeMapWriter::IsWriteEnabled, the check 'if (CodeMapFD == -1) return false' (line 152) correctly rejects the 'denied' state. But then 'if (CodeMapFD) return true' (line 161) will also be true when CodeMapFD holds -1, because std::optional::operator bool() returns true for any contained value. The earlier early-return prevents this from being a run-time bug in isolation, but the logic order makes the guard fragile: if the -1 check is ever removed or reordered, the 'if (CodeMapFD)' gate would pass for a denied FD, then Flush would call write(-1, ...) which is an invalid fd write.","fix":"Replace 'if (CodeMapFD)' with 'if (CodeMapFD.has_value() && *CodeMapFD != -1)' to make the semantics self-contained and independent of ordering.","locations":[{"ref":"FEXCore/Source/Interface/Core/CodeCache.cpp:157-169","code":"  157 | bool CodeMapWriter::IsWriteEnabled(const ExecutableFileSectionInfo& Section) {\n  158 |   if (CodeMapFD == -1) {\n  159 |     return false;\n  160 |   }\n  161 | \n  162 |   // PV libraries can't yet be read by FEXServer, so skip dumping them\n  163 |   if (Section.FileInfo.Filename.starts_with(\"/run/pressure-vessel\")) {\n  164 |     return false;\n  165 |   }\n  166 | \n  167 |   if (CodeMapFD) {\n  168 |     return true;\n  169 |   }","lines":13,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/CodeCache.cpp#L157-L169"}]},
{"id":"LOGIC_127","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In EmitF64Scale the range check at lines 1278-1281 limits src2 (truncated to integer n) to [-1022, 1023]. However FSCALE on x87 is defined for any integer src2 that produces a result in the representable range; the restriction to normal-number exponents silently falls back for subnormal results (n in [-1074, -1023]) and for large n > 1023 that could still produce finite results via multiplication by a subnormal scale factor. This may cause unexpected fallback overhead for valid edge-case inputs that the inline path could handle.","fix":"Extend the fast path to handle subnormal-scaled results or document the range restriction.","locations":[{"ref":"FEXCore/Source/Interface/Core/Dispatcher/Dispatcher.cpp:1278-1281","code":" 1278 |   cmn(ARMEmitter::Size::i64Bit, TMP1, 1022);\n 1279 |   (void)b(ARMEmitter::Condition::CC_LT, &Fallback);\n 1280 |   cmp(ARMEmitter::Size::i64Bit, TMP1, 1023);\n 1281 |   (void)b(ARMEmitter::Condition::CC_GT, &Fallback);","lines":4,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/Dispatcher/Dispatcher.cpp#L1278-L1281"}]},
{"id":"LOGIC_128","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"PSADBWOpImpl for the 256-bit case (lines 3967-3977) extracts the upper 128-bit halves from\nAbsResult_Low and AbsResult_High (the widened 256-bit absolute-difference results) using _VDupElement on\nthe 256-bit AbsResult vectors. For VPSADBW 256-bit, the upper lane should be computed from the upper\n128-bit halves of Src1 and Src2 independently. The current code re-processes parts of already-widened\nintermediate results rather than properly computing the upper lane, risking incorrect sum-of-absolute\ndifferences for the upper 128-bit lane.","fix":"For the 256-bit path, extract upper-lane sources explicitly before widening:\nRef HighSrc1 = _VDupElement(Size, OpSize::i128Bit, Src1, 1);\nRef HighSrc2 = _VDupElement(Size, OpSize::i128Bit, Src2, 1);\nthen compute AbsResult_High from HighSrc1/HighSrc2 the same way as AbsResult_Low is computed from Src1/Src2.","locations":[{"ref":"FEXCore/Source/Interface/Core/OpcodeDispatcher/Vector.cpp:3951-3988","code":" 3951 | Ref OpDispatchBuilder::PSADBWOpImpl(IR::OpSize Size, Ref Src1, Ref Src2) {\n 3952 |   // The documentation is actually incorrect in how this instruction operates\n 3953 |   // It strongly implies that the `abs(dest[i] - src[i])` operates in 8bit space\n 3954 |   // but it actually operates in more than 8bit space\n 3955 |   // This can be seen with `abs(0 - 0xFF)` returning a different result depending\n 3956 |   // on bit length\n 3957 |   const auto Is128Bit = Size == OpSize::i128Bit;\n 3958 | \n 3959 |   if (Size == OpSize::i64Bit) {\n 3960 |     auto AbsResult = _VUABDL(Size << 1, OpSize::i8Bit, Src1, Src2);\n 3961 | \n 3962 |     // Now vector-wide add the results for each\n 3963 |     return _VAddV(Size << 1, OpSize::i16Bit, AbsResult);\n 3964 |   }\n 3965 | \n 3966 |   auto AbsResult_Low = _VUABDL(Size, OpSize::i8Bit, Src1, Src2);\n 3967 |   auto AbsResult_High = _VUABDL2(Size, OpSize::i8Bit, Src1, Src2);\n 3968 | \n 3969 |   Ref Result_Low = _VAddV(OpSize::i128Bit, OpSize::i16Bit, AbsResult_Low);\n 3970 |   Ref Result_High = _VAddV(OpSize::i128Bit, OpSize::i16Bit, AbsResult_High);\n 3971 |   auto Low = _VZip(OpSize::i128Bit, OpSize::i64Bit, Result_Low, Result_High);\n 3972 | \n 3973 |   if (Is128Bit) {\n 3974 |     return Low;\n 3975 |   }\n 3976 | \n 3977 |   Ref HighSrc1 = _VDupElement(Size, OpSize::i128Bit, AbsResult_Low, 1);\n 3978 |   Ref HighSrc2 = _VDupElement(Size, OpSize::i128Bit, AbsResult_High, 1);\n 3979 | \n 3980 |   Ref HighResult_Low = _VAddV(OpSize::i128Bit, OpSize::i16Bit, HighSrc1);\n 3981 |   Ref HighResult_High = _VAddV(OpSize::i128Bit, OpSize::i16Bit, HighSrc2);\n 3982 |   Ref High = _VZip(OpSize::i128Bit, OpSize::i64Bit, HighResult_Low, HighResult_High);\n 3983 | \n 3984 |   Ref AmendedHigh = _VInsElement(OpSize::i128Bit, OpSize::i64Bit, 0, 1, High, Low);\n 3985 |   Ref AmendedLow = _VInsElement(OpSize::i128Bit, OpSize::i64Bit, 1, 0, Low, High);\n 3986 | \n 3987 |   return _VInsElement(Size, OpSize::i128Bit, 1, 0, AmendedLow, AmendedHigh);\n 3988 | }","lines":38,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/OpcodeDispatcher/Vector.cpp#L3951-L3988"}]},
{"id":"LOGIC_129","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In IREmitter.cpp `ReplaceAllUsesWithRange`, when a match is found the function\nchecks `Node->NumUses == 0` (line 113) and returns early. However, it is\npossible that the same instruction uses `Node` more than once in different\nargument slots. In that case, the early return exits before updating the second\noccurrence in the same IROp, leaving a stale NodeOffset referencing the old\nnode while its use count has been decremented already. This could cause\nuse-count mismatches.","fix":"Only break out of the inner `for` loop over args, not the whole function, when NumUses reaches zero. Replace `return` with `break` and let the outer iterator advance; add a final `return` after the loop.","locations":[{"ref":"FEXCore/Source/Interface/IR/IREmitter.cpp:106-114","code":"  106 |       if (IROp->Args[i].ID() == NodeId) {\n  107 |         Node->RemoveUse();\n  108 |         NewNode->AddUse();\n  109 |         IROp->Args[i].NodeOffset = NewNode->Wrapped(ListBegin).NodeOffset;\n  110 | \n  111 |         // We can stop searching once all uses of the node are gone.\n  112 |         if (Node->NumUses == 0) {\n  113 |           return;\n  114 |         }","lines":9,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/IR/IREmitter.cpp#L106-L114"}]},
{"id":"LOGIC_130","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In RegisterAllocationPass.cpp `SpillReg()`, the `NextUse` priority is\nadjusted by adding 100000 for rematerializable nodes to prefer spilling them\n(lines 299-302). However, the comparison at line 303 is `if (NextUse < BestDistance)`\nlooking for the *smallest* NextUse (furthest from end of block). Adding 100000\nto a rematerializable node makes it a *worse* candidate to spill (its NextUse\nis larger, so it ranks lower). This means constants - which are cheap to\nrematerialize - are *avoided* for spilling in favour of more expensive\nvalues that actually need a stack slot. The comment says \"prioritize remat\nover spilling\" (line 296) but the logic does the opposite: it makes remat nodes\nless likely to be selected as spill candidates, which would be correct if the\ngoal is to minimize spills, but the comment direction is backwards.","fix":"Clarify the intent in the comment. If the goal is to *prefer* spilling remat nodes (since they can be re-emitted without a stack slot), the condition should be `NextUse > BestDistance` (i.e. look for the furthest next-use to evict). Review the entire spill selection heuristic direction.","locations":[{"ref":"FEXCore/Source/Interface/IR/Passes/RegisterAllocationPass.cpp:305-316","code":"  305 |         // Prioritize remat over spilling. It is typically cheaper to remat a\n  306 |         // constant multiple times than to spill a single value.\n  307 |         if (!Rematerializable(IR->GetOp<IROp_Header>(Node))) {\n  308 |           NextUse += 100000;\n  309 |         }\n  310 | \n  311 |         if (NextUse < BestDistance) {\n  312 |           BestDistance = NextUse;\n  313 |           BestReg = i;\n  314 |           Candidate = Node;\n  315 |         }\n  316 |       }","lines":12,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/IR/Passes/RegisterAllocationPass.cpp#L305-L316"}]},
{"id":"LOGIC_131","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In x87StackOptimizationPass.cpp `RotateRight8()` (line 492-494):\n\n    return IREmit->_Lshr(OpSize::i32Bit, GetConstant(V | (V << 8)), Amount);\n\nThe intent is a byte-level rotate-right by Amount bits in an 8-bit value.\nThe `V | (V << 8)` trick works only when V fits in 8 bits and Amount is < 8.\nHowever V is a `uint32_t` parameter and can hold values beyond 8 bits. If a\ncaller ever passes a mask with more than 8 significant bits the duplication\ninto the upper byte would produce incorrect rotation results. The current\ncallers (`ValidMask` and `InvalidMask`) are computed as 8-bit byte masks\nand are correctly bounded, but the function has no assertion to document or\nenforce this precondition.","fix":"Add `LOGMAN_THROW_A_FMT(V <= 0xFF, \"RotateRight8: V must fit in 8 bits\");` at the start of the function.","locations":[{"ref":"FEXCore/Source/Interface/IR/Passes/x87StackOptimizationPass.cpp:490-492","code":"  490 | inline Ref X87StackOptimization::RotateRight8(uint32_t V, Ref Amount) {\n  491 |   return IREmit->_Lshr(OpSize::i32Bit, GetConstant(V | (V << 8)), Amount);\n  492 | }","lines":3,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/IR/Passes/x87StackOptimizationPass.cpp#L490-L492"}]},
{"id":"LOGIC_132","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In Allocator.cpp `GetHostVABits()` (line 124), the comparison uses the old\nsentinel value `(void*)~0ULL` for `mmap` failure:\n\n    if (Ptr != (void*)~0ULL) {\n\nThe standard `mmap` failure sentinel is `MAP_FAILED` which is `(void*)-1`,\nequivalent to `(void*)~0ULL` on 64-bit systems. However, using the raw\nconstant instead of `MAP_FAILED` makes the intent less clear and is\ntechnically wrong on systems where `MAP_FAILED` is defined differently.","fix":"Replace `(void*)~0ULL` with `MAP_FAILED` throughout this function.","locations":[{"ref":"FEXCore/Source/Utils/Allocator.cpp:124-128","code":"  124 |     if (Ptr != (void*)~0ULL) {\n  125 |       ::munmap(Ptr, FEXCore::Utils::FEX_PAGE_SIZE);\n  126 |     }\n  127 |     if (Ptr != (void*)~0ULL || errno == EEXIST) {\n  128 |       HostVABits = Bits;","lines":5,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Utils/Allocator.cpp#L124-L128"}]},
{"id":"LOGIC_133","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"ThreadPoolAllocator::ClaimBufferImpl selects which expired unclaimed buffer to free using `UsedTime > LRUTime` (tracking the MAXIMUM LastUsed timestamp), but the variable is named 'LRUTime' and the intent (evict 'oldest' / least-recently-used) requires tracking the MINIMUM. As a result, the most recently expired buffer is freed while older/larger buffers remain alive. This is suboptimal memory behaviour but not a correctness bug.","fix":"Initialize `LRUTime` to `ClockType::time_point::max()` and change the comparison from `UsedTime > LRUTime` to `UsedTime < LRUTime` to correctly select the least-recently-used expired buffer.","locations":[{"ref":"FEXCore/include/FEXCore/Utils/ThreadPoolAllocator.h:264-279","code":"  264 |       {\n  265 |         std::chrono::time_point<ClockType> LRUTime {};\n  266 |         ContainerType::iterator LastUsed = BuffersEnd;\n  267 | \n  268 |         // Walk all the allocations and find a buffer to erase\n  269 |         for (auto it = UnclaimedBuffers.begin(); it != UnclaimedBuffers.end(); ++it) {\n  270 |           // Ensure that the LRU value is past our duration threshold and isn't the one we are claiming\n  271 |           // Also only select a single memory region\n  272 |           if (it != BestFit) {\n  273 |             auto UsedTime = (*it)->LastUsed.load(std::memory_order_relaxed);\n  274 |             if ((Now - UsedTime) >= DURATION && UsedTime > LRUTime) {\n  275 |               LastUsed = it;\n  276 |               LRUTime = UsedTime;\n  277 |             }\n  278 |           }\n  279 |         }","lines":16,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/include/FEXCore/Utils/ThreadPoolAllocator.h#L264-L279"}]},
{"id":"LOGIC_134","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In StringArgumentParser.h ParseArgumentsFromString(), when ArgEnd reaches End (end of string), the line 'Begin = ArgEnd + 1' advances Begin one past End. On the next iteration the while condition 'ArgEnd != End && Begin != End' catches the 'Begin != End' case only if Begin moved past End. However, since ArgEnd == End already from the previous std::find, the first condition 'ArgEnd != End' is false and the loop exits correctly. This is safe but the iterator 'Begin = ArgEnd + 1' computes a past-the-end+1 pointer, which is technically UB for a string_view iterator (only one past the end is valid). The loop condition should be checked before advancing Begin.","fix":"Move 'Begin = ArgEnd + 1' to be guarded by 'if (ArgEnd != End)' before updating, or restructure the loop to avoid computing Begin past End+1.","locations":[{"ref":"FEXHeaderUtils/FEXHeaderUtils/StringArgumentParser.h:24-36","code":"   24 |   while (ArgEnd != End && Begin != End) {\n   25 |     // The end of an argument ends with a space or the end of the interpreter line.\n   26 |     ArgEnd = std::find(Begin, End, ' ');\n   27 | \n   28 |     if (Begin != ArgEnd) {\n   29 |       const auto View = std::string_view(Begin, ArgEnd - Begin);\n   30 |       if (!View.empty()) {\n   31 |         Arguments.emplace_back(View);\n   32 |       }\n   33 |     }\n   34 | \n   35 |     Begin = ArgEnd + 1;\n   36 |   }","lines":13,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXHeaderUtils/FEXHeaderUtils/StringArgumentParser.h#L24-L36"}]},
{"id":"LOGIC_135","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In DefinitionExtract.py HandleVarDeclElements(), when the annotation is 'fex-match' the code sets 'VarDecl.ExpectedFEXMatch = True' (line 294) using the attribute name 'ExpectedFEXMatch'. However the VarDeclDefinition class defines the field as 'ExpectFEXMatch' (line 97). This creates a new attribute on the instance rather than setting the intended one, so the fex-match annotation is silently ignored. StructPackVerifier.py does not have this bug (it correctly uses 'ExpectFEXMatch' on line 266).","fix":"Change 'VarDecl.ExpectedFEXMatch = True' to 'VarDecl.ExpectFEXMatch = True'.","locations":[{"ref":"Scripts/DefinitionExtract.py:294","code":"  294 |                 VarDecl.ExpectedFEXMatch = True","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Scripts/DefinitionExtract.py#L294"}]},
{"id":"LOGIC_136","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In ExportSyscallDefines() in GenerateSyscallNumbers.py, on line 221 the code appends 'Def.name' (lowercase attribute) to AlreadyExported instead of 'Def.Name' (uppercase property). Since the dataclass defines both as the same underlying field, this works but is inconsistent with the rest of the code which uses Def.Name. If the property accessor were ever changed this silent inconsistency could become a bug.","fix":"Use 'Def.Name' consistently: 'AlreadyExported.append(Def.Name)'.","locations":[{"ref":"Scripts/GenerateSyscallNumbers.py:221","code":"  221 |                 AlreadyExported.append(Def.name)","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Scripts/GenerateSyscallNumbers.py#L221"}]},
{"id":"LOGIC_137","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In NeedDisabledSVE.py, GetCPUFeatures() can return None if '/proc/cpuinfo' contains no line with the word 'Features'. The caller in main() then does 'if \"sve\" in Features' which would raise TypeError: argument of type 'NoneType' is not iterable.","fix":"Add a fallback return at the end of GetCPUFeatures: 'return []', or check 'if Features and \"sve\" in Features' in main().","locations":[{"ref":"Scripts/NeedDisabledSVE.py:11-19","code":"   11 | def GetCPUFeatures():\n   12 |     File = open(\"/proc/cpuinfo\", \"r\")\n   13 |     Lines = File.readlines()\n   14 |     File.close()\n   15 | \n   16 |     for Line in Lines:\n   17 |         if \"Features\" in Line:\n   18 |             Features = Line.split(\":\")[1].strip().split(\" \")\n   19 |             return Features","lines":9,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Scripts/NeedDisabledSVE.py#L11-L19"},{"ref":"Scripts/NeedDisabledSVE.py:63-64","code":"   63 |     # If SVE is reported from cpuinfo just return.\n   64 |     if \"sve\" in Features:","lines":2,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Scripts/NeedDisabledSVE.py#L63-L64"}]},
{"id":"LOGIC_138","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In guest_test_runner.py DoesFEXSupportAVX(), the loop 'for line in output' iterates over the characters of the string 'output' (which is a str from subprocess, not a list of lines), not over lines. The condition 'if \"flags\" in line' would match single characters against the string \"flags\", never finding a match. The fix requires splitting output into lines.","fix":"Change 'for line in output:' to 'for line in output.splitlines():'.","locations":[{"ref":"Scripts/guest_test_runner.py:19-22","code":"   19 |     for line in output:\n   20 |         if 'flags' in line:\n   21 |             flags = line.split(':')[1].strip().split(' ')\n   22 |             return 'avx' in flags and 'avx2' in flags","lines":4,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Scripts/guest_test_runner.py#L19-L22"}]},
{"id":"LOGIC_139","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In Async.h async_read_until callback, after the predicate match the code calls 'Buffers.Data.resize(EndPos)' to shrink the buffer to the actual received size. However, EndPos was accumulated across multiple reads and may point past the match location. The UserCallback receives 'BeginPos' as the match position, but the buffer may contain additional bytes past EndPos if a prior read returned more than expected. The comment states 'Data past the match returned from the last read data will also be included' which is by design, but the resize to EndPos could truncate data that arrived in the same recvmsg call beyond the end position.","fix":"Review whether truncating to EndPos is correct given that BeginPos is updated to the predicate match position, not EndPos.","locations":[{"ref":"Source/Common/Async.h:337-340","code":"  337 |           UserCallback(error::success, BeginPos);\n  338 |           return;\n  339 |         }\n  340 |       }","lines":4,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Common/Async.h#L337-L340"}]},
{"id":"LOGIC_140","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In FEXServerClient.cpp StartServer(), the SIGCHLD handler is installed to SIG_IGN before fork() and then restored after both parent and child code paths. However, in the child path the code calls execvp and then exit(1) on failure - neither of which returns. The sigaction restore on line 364 is in the parent-only path (after the if/else block), but because the if/else fully covers both pid==0 and pid!=0, the restore is only reachable by the parent. This is correct, but the code structure is slightly confusing as the restore appears to be at function scope after the if/else.","fix":"No functional change needed; add a comment clarifying the restore is parent-only.","locations":[{"ref":"Source/Common/FEXServerClient.cpp:286-364","code":"  286 |   struct sigaction action {};\n  287 |   action.sa_handler = SIG_IGN;\n  288 |   sigaction(SIGCHLD, &action, &action);\n  289 | \n  290 |   pid_t pid = fork();\n  291 |   if (pid == 0) {\n  292 |     // Child\n  293 |     close(fds[0]); // Close read end of pipe\n  294 | \n  295 |     const char* argv[6];\n  296 | \n  297 |     auto pipe_string = fextl::fmt::format(\"{}\", fds[1]);\n  298 |     auto watch_fd_string = fextl::fmt::format(\"{}\", watch_fd);\n  299 |     size_t arg_count {};\n  300 |     argv[arg_count++] = FEXServerPath.c_str();\n  301 |     argv[arg_count++] = \"--wait_pipe\";\n  302 |     argv[arg_count++] = pipe_string.c_str();\n  303 | \n  304 |     if (watch_fd != -1) {\n  305 |       argv[arg_count++] = \"--watch_fd\";\n  306 |       argv[arg_count++] = watch_fd_string.c_str();\n  307 |     }\n  308 | \n  309 |     argv[arg_count++] = nullptr;\n  310 | \n  311 |     if (execvp(argv[0], (char* const*)argv) == -1) {\n  312 |       // Let the parent know that we couldn't execute for some reason\n  313 |       uint64_t error {1};\n  314 |       write(fds[1], &error, sizeof(error));\n  315 | \n  316 |       // Give a hopefully helpful error message for users\n  317 |       LogMan::Msg::EFmt(\"Couldn't execute: {}\", argv[0]);\n  318 |       LogMan::Msg::EFmt(\"This means the squashFS rootfs won't be mounted.\");\n  319 |       LogMan::Msg::EFmt(\"Expect errors!\");\n  320 |       // Destroy this fork\n  321 |       exit(1);\n  322 |     }\n  323 | \n  324 |     FEX_UNREACHABLE;\n  325 |   } else {\n  326 |     // Parent\n  327 |     // Wait for the child to exit so we can check if it is mounted or not\n  328 |     close(fds[1]); // Close write end of the pipe\n  329 | \n  330 |     // Wait for a message from FEXServer\n  331 |     pollfd PollFD;\n  332 |     PollFD.fd = fds[0];\n  333 |     PollFD.events = POLLIN | POLLOUT | POLLRDHUP | POLLERR | POLLHUP | POLLNVAL;\n  334 | \n  335 |     // Wait for a result on the pipe that isn't EINTR\n  336 |     while (poll(&PollFD, 1, -1) == -1 && errno == EINTR)\n  337 |       ;\n  338 | \n  339 |     // Check if child signaled an error\n  340 |     uint64_t error = 0;\n  341 |     ssize_t bytes_read = read(fds[0], &error, sizeof(error));\n  342 |     close(fds[0]);\n  343 |     if (bytes_read > 0 && error != 0) {\n  344 |       return -1;\n  345 |     }\n  346 | \n  347 |     for (size_t i = 0; i < 5; ++i) {\n  348 |       LocalServerFD = ConnectToServer(ConnectionOption::Default);\n  349 | \n  350 |       if (LocalServerFD != -1) {\n  351 |         break;\n  352 |       }\n  353 | \n  354 |       std::this_thread::sleep_for(std::chrono::seconds(1));\n  355 |     }\n  356 | \n  357 |     if (LocalServerFD == -1) {\n  358 |       // Still couldn't connect to the socket.\n  359 |       LogMan::Msg::EFmt(\"Couldn't connect to FEXServer socket after launching the process\");\n  360 |     }\n  361 |   }\n  362 | \n  363 |   // Restore the original SIGCHLD handler if it existed.\n  364 |   sigaction(SIGCHLD, &action, nullptr);","lines":79,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Common/FEXServerClient.cpp#L286-L364"}]},
{"id":"LOGIC_141","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In ServerManager.cpp, get_pipe() calls pipe(&pipes.read_pipe) but the PipesType struct has 'read_pipe' and 'write_pipe' as adjacent int members. pipe() fills an int[2] array: [0]=read end, [1]=write end. Because the struct lays out read_pipe then write_pipe contiguously, this happens to work by accident of layout, but it relies on the undefined behavior of treating a struct as an array. The return also leaves write_pipe uninitialized if pipe() fails (return value is not checked).","fix":"Use int fds[2]; pipe(fds); and assign pipes.read_pipe = fds[0]; pipes.write_pipe = fds[1]; Also check the return value of pipe().","locations":[{"ref":"Source/Steam/ServerManager.cpp:36-40","code":"   36 | PipesType get_pipe() {\n   37 |   PipesType pipes {};\n   38 |   pipe(&pipes.read_pipe);\n   39 |   return pipes;\n   40 | }","lines":5,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Steam/ServerManager.cpp#L36-L40"}]},
{"id":"LOGIC_142","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"ELFParser::ReadElf() calls lseek(fd, 0, SEEK_END) to get the file size then\nlseek(fd, 0, SEEK_SET) to reset. The comment above notes this function must\nnot modify file offsets because the FD may be a guest-tracked FD. The two\nlseek calls do modify the file offset, which violates the documented contract.\nThe same concern that motivated using pread (not adjusting the file position)\napplies to lseek. The fix used for GetELFType (fstat instead of lseek) would\nbe appropriate here.","fix":"Replace the lseek calls with fstat to obtain file size without modifying the FD's file offset.","locations":[{"ref":"Source/Tools/CommonTools/Linux/Utils/ELFParser.h:44-53","code":"   44 |     off_t Size = lseek(fd, 0, SEEK_END);\n   45 | \n   46 |     if (Size < 4) {\n   47 |       // Likely invalid can't fit header\n   48 |       return false;\n   49 |     }\n   50 | \n   51 |     // Reset to beginning\n   52 |     if (lseek(fd, 0, SEEK_SET) == -1) {\n   53 |       return false;","lines":10,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/CommonTools/Linux/Utils/ELFParser.h#L44-L53"}]},
{"id":"LOGIC_143","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"ELFParser::ReadElf(const fextl::string& file) opens the file with O_RDONLY\n(no O_CLOEXEC). If the ELFParser object outlives an exec() call or the fd\nis inherited by a child process, the guest program can see FEX's internal fd.\nAll other open() calls in the codebase use O_CLOEXEC.","fix":"Change `O_RDONLY` to `O_RDONLY | O_CLOEXEC`.","locations":[{"ref":"Source/Tools/CommonTools/Linux/Utils/ELFParser.h:238","code":"  238 |     int NewFD = ::open(file.c_str(), O_RDONLY);","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/CommonTools/Linux/Utils/ELFParser.h#L238"}]},
{"id":"LOGIC_144","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"FEXBash.cpp EnchantedPS1(): `PS1 += &PS1Env[strlen(\"PS1=\")]` assumes PS1Env\nstarts with \"PS1=\" (4 characters). The caller checks `strstr(envp[i], \"PS1=\") == envp[i]`\nwhich guarantees this. However if strlen(\"PS1=\") somehow equals the length of\nPS1Env (empty value after \"PS1=\"), advancing the pointer by 4 is safe (null\nterminator), but reading with += on a string_view constructed default-style from\na char* past the string still works. This is actually fine as-is, but the\nfunction accepts a possibly-null PS1Env pointer checked only by the `if (PS1Env)`\nguard at line 35 - the issue is that if PS1Env does not start with \"PS1=\", the\noffset arithmetic skips 4 arbitrary bytes. The caller guarantees the prefix but\nthe function itself does not assert it.","fix":"Add an assertion or early return in EnchantedPS1 if PS1Env does not start with \"PS1=\", making the invariant explicit.","locations":[{"ref":"Source/Tools/FEXBash/FEXBash.cpp:36","code":"   36 |     PS1 += &PS1Env[strlen(\"PS1=\")];","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/FEXBash/FEXBash.cpp#L36"}]},
{"id":"LOGIC_145","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"FEXConfig/Main.cpp: HostLibsModel::setData() uses std::next(HostLibsDB.begin(), index.row())\nto address a map entry by a visual row index. std::next on a std::map iterator\nis O(n). More importantly, the QStandardItemModel row order may not match the\niteration order of the fextl::unordered_map (which is a hash map with\nunspecified ordering). A mismatch means setData() can silently update the wrong\nlibrary's enabled state.","fix":"Store the library name in the QStandardItem's data (e.g. Qt::UserRole) and look it up by name in setData() rather than by index.","locations":[{"ref":"Source/Tools/FEXConfig/Main.cpp:268-271","code":"  268 | bool HostLibsModel::setData(const QModelIndex& index, const QVariant& value, int role) {\n  269 |   std::next(HostLibsDB.begin(), index.row())->second = value.toBool();\n  270 |   return QStandardItemModel::setData(index, value, role);\n  271 | }","lines":4,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/FEXConfig/Main.cpp#L268-L271"}]},
{"id":"LOGIC_146","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"FEXInterpreter.cpp: DebugServer.reset() is called twice (lines 619 and 629).\nThe second reset is a no-op after the first, but it is dead code that may\nconfuse readers and tools. If DebugServer is moved between calls this could\nbecome a real bug.","fix":"Remove the duplicate DebugServer.reset() call at line 629.","locations":[{"ref":"Source/Tools/FEXInterpreter/FEXInterpreter.cpp:637","code":"  637 |   DebugServer.reset();","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/FEXInterpreter/FEXInterpreter.cpp#L637"},{"ref":"Source/Tools/FEXInterpreter/FEXInterpreter.cpp:637","code":"  637 |   DebugServer.reset();","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/FEXInterpreter/FEXInterpreter.cpp#L637"}]},
{"id":"LOGIC_147","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"FEXOfflineCompiler/Main.cpp AggregateCodeMaps(): `IncomingCodeMap.at(Dependency)`\nis called for each dependency at line 746. If a code map references a dependency\nFileId that is not present in IncomingCodeMap (e.g. a corrupted or cross-session\ncode map), std::map::at() throws std::out_of_range, aborting aggregation of all\nremaining code maps. A find() with a graceful skip would be safer.","fix":"Use IncomingCodeMap.find(Dependency) and skip missing entries instead of at().","locations":[{"ref":"Source/Tools/FEXOfflineCompiler/Main.cpp:749","code":"  749 |       Dependencies.emplace(nullptr, Dependency, IncomingCodeMap.at(Dependency).Filename);","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/FEXOfflineCompiler/Main.cpp#L749"}]},
{"id":"LOGIC_148","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In DistroQuery::GetDistroInfo, the VERSION_ID value from /etc/os-release is stripped of\nsurrounding quotes with:\n  Value = Value.substr(1, Value.size() - 2);\nIf Value is empty or a single character (malformed /etc/os-release), Value.size() - 2\nwraps to SIZE_MAX-1 (unsigned underflow), and substr(1, SIZE_MAX-1) throws\nstd::out_of_range because pos=1 > size=0.","fix":"Guard with: if (Value.size() >= 2) { Value = Value.substr(1, Value.size() - 2); } else { Value.clear(); }","locations":[{"ref":"Source/Tools/FEXRootFSFetcher/Main.cpp:436","code":"  436 |         Value = Value.substr(1, Value.size() - 2);","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/FEXRootFSFetcher/Main.cpp#L436"}]},
{"id":"LOGIC_149","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In EmulatedFiles.cpp, GenerateCPUInfo computes the CPU frequency from CPUID leaf 15h:\n  double Frequency = 1.0 / (res_15.eax / (res_15.ebx * res_15.ecx));\nIf any of res_15.eax, res_15.ebx, or res_15.ecx is zero (TSC enumeration not supported),\nthe calculation produces infinity or NaN (IEEE 754 double division by zero does not trap).\nThe resulting FrequencyString and BogomipsString would be \"inf\" or \"nan\" in /proc/cpuinfo,\nwhich can confuse applications that parse cpu MHz numerically.","fix":"Guard the frequency calculation: if res_15.eax == 0 || res_15.ebx == 0 || res_15.ecx == 0, fall back to a reasonable default frequency (e.g., query the host or use a fixed estimate like 1000.0 MHz).","locations":[{"ref":"Source/Tools/LinuxEmulation/LinuxSyscalls/EmulatedFiles/EmulatedFiles.cpp:453-460","code":"  453 |   const double Frequency = 1.0 / (static_cast<double>(res_15.eax) / (static_cast<double>(res_15.ebx) * static_cast<double>(res_15.ecx)));\n  454 |   const double FrequencyMhz = Frequency / HzInMhz;\n  455 |   const double FrequencyKhz = Frequency / HzInKhz;\n  456 |   const double Bogomips = FrequencyKhz / BogoMipsDivisor;\n  457 |   // Generate the cycle counter frequency string in the format expected by cpuinfo.\n  458 |   // ex: `4000.000`\n  459 |   const auto FrequencyString = fextl::fmt::format(\"{:.3f}\", FrequencyMhz);\n  460 |   const auto BogomipsString = fextl::fmt::format(\"{:.2f}\", Bogomips);","lines":8,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/LinuxEmulation/LinuxSyscalls/EmulatedFiles/EmulatedFiles.cpp#L453-L460"}]},
{"id":"LOGIC_150","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"BPFEmitter::JITFilter allocates `FuncSize` bytes for the JIT buffer (line 385) but the size estimate does\nnot account for alignment padding emitted by `Align()` before the constant pool (line 402). `Align(4)` can\ninsert up to 3 bytes of NOP padding. If any alignment padding is needed, the emitter writes beyond the\nallocated buffer size. In practice this stays within the same mmap'd page (mmap allocates whole pages),\nso it rarely causes visible corruption, but it is technically undefined behavior.","fix":"Add an alignment margin to `CalculatedSize` in the size estimation pass: add 3 bytes (or `alignof(uint32_t) - 1`) to account for worst-case Align() padding before the constant pool.","locations":[{"ref":"Source/Tools/LinuxEmulation/LinuxSyscalls/Seccomp/BPFEmitter.cpp:365-385","code":"  365 |     CalculatedSize += ConstPool.size() * 4;\n  366 | \n  367 |     // Size calculation could have added constants and jump labels. Erase them now.\n  368 |     ConstPool.clear();\n  369 |     JumpLabels.clear();\n  370 | \n  371 |     return CalculatedSize;\n  372 |   }\n  373 | \n  374 |   return 0;\n  375 | }\n  376 | \n  377 | uint64_t BPFEmitter::JITFilter(uint32_t flags, const sock_fprog* prog) {\n  378 |   FuncSize = HandleEmission<true, SizeErrorCheck>(flags, prog);\n  379 | \n  380 |   if (FuncSize == ~0ULL) {\n  381 |     // Buffer size calculation found invalid code.\n  382 |     return -EINVAL;\n  383 |   }\n  384 | \n  385 |   SetBuffer((uint8_t*)FEXCore::Allocator::mmap(nullptr, FuncSize, PROT_READ | PROT_WRITE, MAP_PRIVATE | MAP_ANONYMOUS, -1, 0), FuncSize);","lines":21,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/LinuxEmulation/LinuxSyscalls/Seccomp/BPFEmitter.cpp#L365-L385"}]},
{"id":"LOGIC_151","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"HandleNewClone with CLONE_THREAD flag tracks the original parent thread again instead of the\nnewly created thread object.\n\nWhen CLONE_THREAD is set (lines 187-201 in Thread.cpp), a new ThreadStateObject is allocated\nvia TM.CreateThread() and assigned to NewThread. CreatedNewThreadObject is set true.\nLater at line 243: `FEX::HLE::_SyscallHandler->TM.TrackThread(Thread)` passes the original\nparent Thread object, not NewThread. This would double-track the parent and leak NewThread.\n\nIn practice this code path is currently unreachable: HasUnhandledFlags + CLONE_THREAD falls\nthrough to the log-only path at line 675 and then uses CreateNewThread (not HandleNewClone).\nHowever the dead but incorrect code is dangerous if the call graph is ever extended.","fix":"Change `TM.TrackThread(Thread)` to `TM.TrackThread(NewThread)`.","locations":[{"ref":"Source/Tools/LinuxEmulation/LinuxSyscalls/Syscalls/Thread.cpp:241-243","code":"  241 |   if (CreatedNewThreadObject) {\n  242 |     FEX::HLE::_SyscallHandler->TM.TrackThread(Thread);\n  243 |   }","lines":3,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/LinuxEmulation/LinuxSyscalls/Syscalls/Thread.cpp#L241-L243"}]},
{"id":"LOGIC_152","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In CopySigInfo (Signals.cpp), SIGFPE and SIGILL signal faults zero out\n_sigfault.addr instead of translating the faulting instruction pointer from\nthe host siginfo. The comment acknowledges this limitation. For SIGFPE/SIGILL,\nthe host si_addr contains the address of the faulting instruction, which the\nemulator could translate back to the guest PC (available via the CPU state\nframe). Passing addr=0 causes debuggers and signal handlers that inspect\nsi_addr for SIGFPE/SIGILL to receive incorrect information.","fix":"Use the guest EIP from the CPU state frame to fill in _sigfault.addr for SIGFPE/SIGILL, similar to how SIGSEGV/SIGBUS translate si_addr.","locations":[{"ref":"Source/Tools/LinuxEmulation/LinuxSyscalls/x32/Signals.cpp:51-56","code":"   51 |     case SIGFPE:\n   52 |     case SIGILL:\n   53 |       // Can't really give a real result here. This is the RIP causing a sigill or sigfpe\n   54 |       // Claim at RIP 0 for now\n   55 |       Info->_sifields._sigfault.addr = 0;\n   56 |       break;","lines":6,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/LinuxEmulation/LinuxSyscalls/x32/Signals.cpp#L51-L56"}]},
{"id":"LOGIC_153","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"x32 Thread.cpp nanosleep: when `rem` is non-null and `req` is null (lines 102-114),\nthe code reads from `rem` (`rem64 = *rem`) even though the kernel will reject the\ncall with EFAULT (req is required for nanosleep). This wastes a user-memory read\nand may trigger a misleading VerifyIsReadable fault. The read of `rem` before\ncalling nanosleep with a null req is dead code.","fix":"Only read from `rem` when `req` is non-null, since nanosleep with a null req will always return EFAULT without ever writing the remainder.","locations":[{"ref":"Source/Tools/LinuxEmulation/LinuxSyscalls/x32/Time.cpp:98-122","code":"   98 |   REGISTER_SYSCALL_IMPL_X32(nanosleep, [](FEXCore::Core::CpuStateFrame* Frame, const timespec32* req, timespec32* rem) -> uint64_t {\n   99 |     struct timespec rem64 {};\n  100 |     struct timespec* rem64_ptr {};\n  101 | \n  102 |     if (rem) {\n  103 |       FaultSafeUserMemAccess::VerifyIsReadable(rem, sizeof(*rem));\n  104 |       rem64 = *rem;\n  105 |       rem64_ptr = &rem64;\n  106 |     }\n  107 | \n  108 |     uint64_t Result = 0;\n  109 |     if (req) {\n  110 |       FaultSafeUserMemAccess::VerifyIsReadable(req, sizeof(*req));\n  111 |       const struct timespec req64 = *req;\n  112 |       Result = ::nanosleep(&req64, rem64_ptr);\n  113 |     } else {\n  114 |       Result = ::nanosleep(nullptr, rem64_ptr);\n  115 |     }\n  116 | \n  117 |     if (rem) {\n  118 |       FaultSafeUserMemAccess::VerifyIsWritable(rem, sizeof(*rem));\n  119 |       *rem = rem64;\n  120 |     }\n  121 |     SYSCALL_ERRNO();\n  122 |   });","lines":25,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/LinuxEmulation/LinuxSyscalls/x32/Time.cpp#L98-L122"}]},
{"id":"LOGIC_154","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"x32 Time.cpp utimensat: line 196 verifies `sizeof(timeval32) * 2` bytes but the\narray element type is `timespec32`, not `timeval32`. Both structs happen to be 8\nbytes (int32_t tv_sec + int32_t tv_nsec/tv_usec), so the calculated size (16) is\naccidentally correct. However the wrong type name in the verify call is misleading.","fix":"Change `sizeof(timeval32) * 2` to `sizeof(timespec32) * 2` to match the actual type being accessed.","locations":[{"ref":"Source/Tools/LinuxEmulation/LinuxSyscalls/x32/Time.cpp:210","code":"  210 |       FaultSafeUserMemAccess::VerifyIsReadable(times, sizeof(timeval32) * 2);","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/LinuxEmulation/LinuxSyscalls/x32/Time.cpp#L210"}]},
{"id":"LOGIC_155","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"VDSO_Emulation.cpp: for x86-64 mode, VDSODefinitions[3] has SHA256 hash\n`sha256(libVDSO:clock_gettime64)` but is assigned the handler\n`FEX::VDSO::x64::Handler_clock_gettime` (the ordinary clock_gettime handler) on\nline 864. This is a copy-paste error - it duplicates the index-2 assignment. On\nx86-64, clock_gettime64 is a 32-bit-only syscall and won't be called from 64-bit\nguests, so this is functionally harmless today. However, if the guest VDSO library\never does export a clock_gettime64 thunk for 64-bit, the wrong handler would be\ninvoked (64-bit clock_gettime instead of a potential 64-bit clock_gettime64 variant).","fix":"Either assign an appropriate x64 clock_gettime64 handler to VDSODefinitions[3] for 64-bit mode, or add a comment clarifying that this is intentionally the same as index 2 since clock_gettime64 is unused on x86-64.","locations":[{"ref":"Source/Tools/LinuxEmulation/VDSO_Emulation.cpp:865-866","code":"  865 |     VDSODefinitions[2].ThunkFunction = FEX::VDSO::x64::Handler_clock_gettime;\n  866 |     VDSODefinitions[3].ThunkFunction = FEX::VDSO::x64::Handler_clock_gettime;","lines":2,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/LinuxEmulation/VDSO_Emulation.cpp#L865-L866"}]},
{"id":"LOGIC_156","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In Module.cpp GetThreadCPUArea (line 151-155), if NtQueryInformationThread fails\n(Err is non-zero), the function still constructs a ThreadCPUArea from an\nuninitialized Info.TebBaseAddress (since NtQueryInformationThread did not\npopulate Info on failure). The returned pair contains a valid-looking ThreadCPUArea\nwith a garbage TEB pointer. The caller at line 1000 checks `if (Err) { return Err; }`\nbefore using CPUArea, so the garbage pointer is never dereferenced - but the\nconstruction itself is undefined behavior.","fix":"Either initialize Info = {} before the call so TebBaseAddress is nullptr,\nor return a default-constructed ThreadCPUArea on failure. The former is simpler:\n`THREAD_BASIC_INFORMATION Info {};`","locations":[{"ref":"Source/Windows/ARM64EC/Module.cpp:156-160","code":"  156 | std::pair<NTSTATUS, ThreadCPUArea> GetThreadCPUArea(HANDLE Thread) {\n  157 |   THREAD_BASIC_INFORMATION Info;\n  158 |   const NTSTATUS Err = NtQueryInformationThread(Thread, ThreadBasicInformation, &Info, sizeof(Info), nullptr);\n  159 |   return {Err, ThreadCPUArea(reinterpret_cast<_TEB*>(Info.TebBaseAddress))};\n  160 | }","lines":5,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Windows/ARM64EC/Module.cpp#L156-L160"}]},
{"id":"LOGIC_157","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In Module.cpp FillNtDllLUTs (line 183), NtDllRedirectionLUTSize is computed\nas `std::prev(RedirectionTableEnd)->Source + 1`. This assumes the entries are\nsorted by Source in ascending order and the last entry has the highest Source\nvalue. There is no assertion or comment establishing this assumption. If the\ntable is not sorted, NtDllRedirectionLUTSize could be underestimated and the\nloop at line 188-190 would write NtDllRedirectionLUT[It->Source] at indices\nbeyond the allocated size, causing a heap buffer overflow.","fix":"Either assert the table is sorted, or compute NtDllRedirectionLUTSize as the\nmaximum Source value across all entries rather than just the last entry.","locations":[{"ref":"Source/Windows/ARM64EC/Module.cpp:188-195","code":"  188 |   NtDllRedirectionLUTSize = std::prev(RedirectionTableEnd)->Source + 1;\n  189 | \n  190 |   SIZE_T AllocSize = NtDllRedirectionLUTSize * sizeof(uint32_t);\n  191 |   NtAllocateVirtualMemoryNative(NtCurrentProcess(), reinterpret_cast<void**>(&NtDllRedirectionLUT), 0, &AllocSize, MEM_COMMIT | MEM_RESERVE,\n  192 |                                 PAGE_READWRITE);\n  193 |   for (auto It = RedirectionTableBegin; It != RedirectionTableEnd; It++) {\n  194 |     NtDllRedirectionLUT[It->Source] = It->Destination;\n  195 |   }","lines":8,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Windows/ARM64EC/Module.cpp#L188-L195"}]},
{"id":"LOGIC_158","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In Module.cpp ParseWineSyscallNumbers (line 237), a fixed-size stack array of\n0x200 (512) entries is used for SyscallTable. If NtDll exports more than 512\nNt* functions (excluding NtGetTickCount), the loop at line 242-247 will write\npast the end of the array. Windows 11 NtDll has well over 400 Nt* exports, and\nfuture versions could exceed 512. This would be a stack buffer overflow with\nundefined behavior.","fix":"Add a bound check before `*SyscallTableEnd++`: if SyscallTableEnd == SyscallTable.end()\nbreak or use a dynamic container. Or increase the array size with a static_assert\nagainst a known upper bound.","locations":[{"ref":"Source/Windows/ARM64EC/Module.cpp:242-252","code":"  242 |   std::array<SyscallEntry, 0x200> SyscallTable;\n  243 |   auto SyscallTableEnd = SyscallTable.begin();\n  244 | \n  245 |   // Windows/Wine orders syscalls in memory by their ID, take advantage of that to find the syscall indices for those\n  246 |   // which we need to manually issue. Note that all functions starting with Nt besides NtGetTickCount are syscalls.\n  247 |   for (uint32_t Idx = 0; Idx < Exports->NumberOfNames; Idx++) {\n  248 |     const char* Name = reinterpret_cast<const char*>(NtDllBase + NameTable[Idx]);\n  249 |     if (Name[0] == 'N' && Name[1] == 't' && strcmp(Name, \"NtGetTickCount\") != 0) {\n  250 |       *SyscallTableEnd++ = {Name, FunctionTable[OrdinalTable[Idx]]};\n  251 |     }\n  252 |   }","lines":11,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Windows/ARM64EC/Module.cpp#L242-L252"}]},
