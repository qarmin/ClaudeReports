<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"UAF_1","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"medium","description":"TriggerGuestLibWrapperCodeCacheLoad dereferences FindVMAEntry result without checking for end().\n\nLine 423 calls VMATracking.FindVMAEntry(AnyAddr) and immediately accesses\nVMAEntry->second.Resource->FirstVMA without verifying VMAEntry != VMAs.end() or that\nVMAEntry->second.Resource is non-null.\n\nIf AnyAddr is not in any tracked VMA (possible if the address is from an untracked mapping),\nFindVMAEntry returns VMAs.end() and the access is undefined behaviour (likely a crash).\nSimilarly, if the VMA is an anonymous private mapping, Resource is nullptr and\n->FirstVMA dereferences null.\n\nThis function is called from FEXCore's code-cache path when guest-wrapping libraries are loaded.","fix":"Add guards:\n  if (VMAEntry == VMATracking.VMAs.end() || !VMAEntry->second.Resource) return;\nbefore accessing VMAEntry->second.Resource->FirstVMA.","locations":[{"ref":"Source/Tools/LinuxEmulation/LinuxSyscalls/SyscallsSMCTracking.cpp:424","code":"  424 |   for (auto* VMA = VMAEntry->second.Resource->FirstVMA; VMA; VMA = VMA->ResourceNextVMA) {","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/LinuxEmulation/LinuxSyscalls/SyscallsSMCTracking.cpp#L424"}]},
{"id":"UAF_2","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"easy","description":"In RelocateArrayToGuestHeap (ThunkLibs/libGL/libGL_Host.cpp), if GuestMalloc returns null (allocation failure), GuestData.data is set to 0 and the subsequent loop attempts to write to get_pointer()[Index] which dereferences address 0 (crash/UB). Additionally, HostXFree(Data) is called to free the original host array even when the guest allocation failed, leaving no valid pointer in the returned GuestData.","fix":"Add a null check after GuestMalloc: if (!GuestData.data) { x11_manager.HostXFree(Data); return guest_layout<T*>{.data = 0}; }","locations":[{"ref":"ThunkLibs/libGL/libGL_Host.cpp:294-306","code":"  294 | guest_layout<T*> RelocateArrayToGuestHeap(T* Data, int NumItems) {\n  295 |   if (!Data) {\n  296 |     return guest_layout<T*> {.data = 0};\n  297 |   }\n  298 | \n  299 |   guest_layout<T*> GuestData;\n  300 |   GuestData.data = reinterpret_cast<uintptr_t>(GuestMalloc(sizeof(guest_layout<T>) * NumItems));\n  301 |   for (int Index = 0; Index < NumItems; ++Index) {\n  302 |     GuestData.get_pointer()[Index] = to_guest(to_host_layout(Data[Index]));\n  303 |   }\n  304 |   x11_manager.HostXFree(Data);\n  305 |   return GuestData;\n  306 | }","lines":13,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/ThunkLibs/libGL/libGL_Host.cpp#L294-L306"}]},
{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"easy","description":"In GDBJIT.cpp, when GDBJITRegister() registers a JIT code entry it allocates\na `jit_code_entry` with `new` and a raw `malloc`-ed `info` block, but never\nfrees them when the entry is unregistered (there is no unregister path at all).\nMore subtly, on every call the code appends to `__jit_debug_descriptor.relevant_entry`\nbut then overwrites `relevant_entry` with the new entry, leaving the previous\nentry's `next_entry` pointer dangling (it is never set) if this is not the first\ncall. The linked-list update is incomplete: `entry->next_entry` is never set,\nso the GDB list is broken after the second registration.","fix":"Set `entry->next_entry = nullptr` after allocating the entry (it is zero-initialised\nvia the brace initialiser so this is fine, but the previous `relevant_entry->next_entry`\nis never updated to point to the new entry - add\n`__jit_debug_descriptor.relevant_entry->next_entry = entry;`\nBEFORE updating `relevant_entry`. Also provide an unregister path that calls\n`__jit_debug_register_code()` with `JIT_UNREGISTER_FN` and frees the memory,\nto avoid the long-running leak.","locations":[{"ref":"FEXCore/Source/Interface/GDBJIT/GDBJIT.cpp:96-110","code":"   96 |     auto entry = new jit_code_entry {0, 0, 0, 0};\n   97 | \n   98 |     entry->symfile_addr = (const char*)info;\n   99 |     entry->symfile_size = size;\n  100 | \n  101 |     if (__jit_debug_descriptor.first_entry) {\n  102 |       __jit_debug_descriptor.relevant_entry->next_entry = entry;\n  103 |       entry->prev_entry = __jit_debug_descriptor.relevant_entry;\n  104 |     } else {\n  105 |       __jit_debug_descriptor.first_entry = entry;\n  106 |     }\n  107 | \n  108 |     __jit_debug_descriptor.relevant_entry = entry;\n  109 |     __jit_debug_descriptor.action_flag = JIT_REGISTER_FN;\n  110 |     __jit_debug_register_code();","lines":15,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/GDBJIT/GDBJIT.cpp#L96-L110"}]},
{"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"medium","description":"fextl::move_only_function::operator=(move_only_function&&): the condition `!other && internal_destructor` only cleans up 'this' when: (a) 'other' is empty AND (b) 'this' has a non-trivial destructor. Two cases are missed. Case B: 'other' is empty but 'this' holds a large trivially-destructible object (storage != nullptr, internal_destructor == nullptr) - the existing storage allocation is overwritten with nullptr without being freed (memory leak). Case C: both 'other' and 'this' are non-empty - the `if` is skipped entirely, causing 'this->storage' to be leaked and 'this->internal_destructor' to never be called. The test suite at fextl_function.cpp only covers the empty-to-non-empty direction and nullptr assignment, missing both failure cases.","fix":"Replace the guarded `if (!other && internal_destructor)` block with an unconditional cleanup of 'this': call `internal_destructor(this)` if non-null, then `Dealloc(storage)`, then reset `storage` and `internal_destructor` to nullptr before exchanging from 'other'. Alternatively, delegate to `this->~move_only_function()` whenever `storage != nullptr || internal_destructor != nullptr`.","locations":[{"ref":"FEXCore/include/FEXCore/fextl/functional.h:76-84","code":"   76 |   move_only_function& operator=(move_only_function&& other) noexcept {\n   77 |     if (!other && internal_destructor) {\n   78 |       this->~move_only_function();\n   79 |     }\n   80 |     internal = std::exchange(other.internal, nullptr);\n   81 |     internal_destructor = std::exchange(other.internal_destructor, nullptr);\n   82 |     storage = std::exchange(other.storage, nullptr);\n   83 |     return *this;\n   84 |   }","lines":9,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/include/FEXCore/fextl/functional.h#L76-L84"}]},
{"id":"MEM_3","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"easy","description":"In CPUFeatures.cpp FetchHostFeatures, the registry key opened on line 60 is\nnot explicitly closed before checking for failure with ERROR_AND_DIE_FMT, and\nis never closed in the early-success path on the last iteration of the loop.\nThe loop on line 72 calls RegCloseKey for every iteration it runs, but the\ninitial Key opened on line 60 (CPU 0) is re-used as the loop-initializer\nvariable and closed inside the loop as `Key = OpenProcessorKey(++Idx)`. The\nfirst key opened on line 60 is passed to `CPUFeaturesFromRegistry Features(Key)`\nbut the loop starts with `Key = OpenProcessorKey(1)`, meaning the Key for CPU\nindex 0 is never closed.","fix":"Store the result of OpenProcessorKey(0) into a temporary, then close it after\nconstructing CPUFeaturesFromRegistry. Alternatively, include index 0 in the\nloop so RegCloseKey is called for it too.","locations":[{"ref":"Source/Windows/Common/CPUFeatures.cpp:60-75","code":"   60 |   HKEY Key = OpenProcessorKey(0);\n   61 |   if (!Key) {\n   62 |     ERROR_AND_DIE_FMT(\"Couldn't detect CPU features\");\n   63 |   }\n   64 | \n   65 |   CPUFeaturesFromRegistry Features(Key);\n   66 | \n   67 |   uint64_t CTR = ReadRegU64(Key, \"CP 5801\");\n   68 |   uint64_t MIDR = ReadRegU64(Key, \"CP 4000\");\n   69 | \n   70 |   FEXCore::HostFeatures HostFeatures = {};\n   71 | \n   72 |   for (uint32_t Idx = 0; Key; Key = OpenProcessorKey(++Idx)) {\n   73 |     // Truncate to 32-bits, top 32-bits are all reserved in MIDR\n   74 |     HostFeatures.CPUMIDRs.push_back(static_cast<uint32_t>(ReadRegU64(Key, \"CP 4000\")));\n   75 |     RegCloseKey(Key);","lines":16,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Windows/Common/CPUFeatures.cpp#L60-L75"}]},
{"id":"MEM_4","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"In Exec::ExecAndWaitForResponseText, fd[0] (the read end of the pipe) is only closed inside\nthe WIFEXITED branch. If the child process is killed by a signal (WIFSIGNALED) or stops\n(WIFSTOPPED), fd[0] is never closed, leaking the file descriptor. The function returns an\nempty string in this case without closing fd[0].","fix":"Close fd[0] unconditionally before the return {} at line 210, or restructure with RAII. Move close(fd[0]) outside the WIFEXITED check.","locations":[{"ref":"Source/Tools/FEXRootFSFetcher/Main.cpp:196-210","code":"  196 |     while (size_t Size = read(fd[0], Buffer, sizeof(Buffer))) {\n  197 |       Output += std::string_view(Buffer, Size);\n  198 |     }\n  199 | \n  200 |     int32_t Status {};\n  201 |     while (waitpid(pid, &Status, 0) == -1 && errno == EINTR)\n  202 |       ;\n  203 |     if (WIFEXITED(Status)) {\n  204 |       // Return what we've read\n  205 |       close(fd[0]);\n  206 |       return Output;\n  207 |     }\n  208 |   }\n  209 | \n  210 |   return {};","lines":15,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/FEXRootFSFetcher/Main.cpp#L196-L210"}]},
{"id":"MEM_5","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"In CheckUnsquashfs, fdopen(fd, \"r\") wraps the memfd and assigns it to FILE* fp.\nAfter fclose(fp) (which closes the underlying fd), close(fd) is called again at line 291.\nThis is a double-close: the second close(fd) closes whatever file descriptor the kernel\nhas reassigned to that number since fclose released it, potentially closing an unrelated fd.","fix":"Remove the close(fd) at line 291. fclose(fp) already closes the underlying fd.","locations":[{"ref":"Source/Tools/FEXRootFSFetcher/Main.cpp:265-291","code":"  265 |     FILE* fp = fdopen(fd, \"r\");\n  266 |     char* Line {nullptr};\n  267 |     size_t Len;\n  268 | \n  269 |     bool ReadingDecompressors = false;\n  270 |     bool SupportsZSTD = false;\n  271 |     while (getline(&Line, &Len, fp) != -1) {\n  272 |       if (!ReadingDecompressors) {\n  273 |         if (strstr(Line, \"Decompressors available\")) {\n  274 |           ReadingDecompressors = true;\n  275 |         }\n  276 |       } else {\n  277 |         if (strstr(Line, \"zstd\")) {\n  278 |           SupportsZSTD = true;\n  279 |         }\n  280 |       }\n  281 |     }\n  282 | \n  283 |     free(Line);\n  284 |     fclose(fp);\n  285 | \n  286 |     // Disable unsquashfs if it doesn't support ZSTD\n  287 |     if (!SupportsZSTD) {\n  288 |       Has_Unsquashfs = false;\n  289 |     }\n  290 |   }\n  291 |   close(fd);","lines":27,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/FEXRootFSFetcher/Main.cpp#L265-L291"}]},
{"id":"MEM_6","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"The `Relocations` field of `DebugData` (type `fextl::vector<FEXCore::CPU::Relocation>*`) is a raw owning pointer. In DebugData.h the struct has no destructor that deletes this pointer. If the caller allocates a vector and assigns it here, it will never be freed when DebugData is destroyed, creating a memory leak.","fix":"Change `Relocations` to a `fextl::unique_ptr<fextl::vector<FEXCore::CPU::Relocation>>`, or ensure all allocation sites transfer ownership and callers free it explicitly.","locations":[{"ref":"FEXCore/Source/Interface/Core/JIT/DebugData.h:29-35","code":"   29 | struct DebugData : public FEXCore::Allocator::FEXAllocOperators {\n   30 |   uint64_t HostCodeSize; ///< The size of the code generated in the host JIT\n   31 |   fextl::vector<DebugDataSubblock> Subblocks;\n   32 |   fextl::vector<DebugDataGuestOpcode> GuestOpcodes;\n   33 |   fextl::vector<FEXCore::CPU::Relocation>* Relocations;\n   34 | };\n   35 | } // namespace FEXCore::Core","lines":7,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/JIT/DebugData.h#L29-L35"}]},
{"id":"MEM_7","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"TestDisassembler constructor allocates a 2MB region via mmap but the destructor never calls munmap. Only the tmpfile fp is closed. The mmap'd buffer leaks for the lifetime of the test process.","fix":"Track the buffer pointer and size as member variables and call munmap in the destructor.","locations":[{"ref":"FEXCore/unittests/Emitter/TestDisassembler.h:14-24","code":"   14 |   TestDisassembler() {\n   15 |     fp = tmpfile();\n   16 |     Disasm = std::make_unique<vixl::aarch64::PrintDisassembler>(fp);\n   17 |     // 2MB code size.\n   18 |     const size_t CodeSize = 2 * 1024 * 1024;\n   19 |     SetBuffer(reinterpret_cast<uint8_t*>(mmap(nullptr, CodeSize, PROT_READ | PROT_WRITE, MAP_PRIVATE | MAP_ANONYMOUS, -1, 0)), CodeSize);\n   20 |     BufferBegin = GetCursorAddress<const vixl::aarch64::Instruction*>();\n   21 |   }\n   22 |   ~TestDisassembler() {\n   23 |     fclose(fp);\n   24 |   }","lines":11,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/unittests/Emitter/TestDisassembler.h#L14-L24"}]},
{"id":"MEM_8","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"Logger::StartLogThread calls pipe2(LogClientQueuePipe, 0) with flags=0, creating a\npipe without O_CLOEXEC. FEXServer later forks child processes (squashfuse/erofsfuse,\nFEXOfflineCompiler). These children inherit LogClientQueuePipe[0] and [1], keeping\nthe log pipe open even after Logger::Shutdown() closes LogClientQueuePipe[1] in the\nparent. This prevents the log thread from ever seeing EOF on its pipe end.","fix":"Change pipe2(LogClientQueuePipe, 0) to pipe2(LogClientQueuePipe, O_CLOEXEC).","locations":[{"ref":"Source/Tools/FEXServer/Logger.cpp:95","code":"   95 |   pipe2(LogClientQueuePipe, 0);","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/FEXServer/Logger.cpp#L95"}]},
{"id":"MEM_9","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"In SquashFS::MountRootFSImagePath, after fork(), the parent process never closes fds[1]\n(the write end of the error-notification pipe). The child closes fds[0] and execvpe()\ncauses fds[1] to be inherited by squashfuse (since pipe2 is called with flags=0, no\nO_CLOEXEC). As a result, fds[1] is leaked in both the parent (FEXServer) and the\nsquashfuse child process, preventing the pipe from ever reaching EOF naturally.","fix":"After fork() in the parent branch, add close(fds[1]) before or after the waitpid call. Change pipe2(fds, 0) to pipe2(fds, O_CLOEXEC) so execvpe automatically closes fds[1] in the child, and explicitly close it in the parent.","locations":[{"ref":"Source/Tools/FEXServer/SquashFS.cpp:129-183","code":"  129 |   pipe2(fds, 0);\n  130 | \n  131 |   int pid = fork();\n  132 |   if (pid == 0) {\n  133 |     // Child\n  134 |     close(fds[0]); // Close read side\n  135 |     const char* argv[4];\n  136 |     argv[0] = EroFS ? \"erofsfuse\" : \"squashfuse\";\n  137 |     argv[1] = SquashFS.c_str();\n  138 |     argv[2] = MountFolder.c_str();\n  139 |     argv[3] = nullptr;\n  140 | \n  141 |     // Try and execute {erofsfuse, squashfuse} to mount our rootfs\n  142 |     if (execvpe(argv[0], (char* const*)argv, environ) == -1) {\n  143 |       // Give a hopefully helpful error message for users\n  144 |       LogMan::Msg::EFmt(\"[FEXServer] '{}' Couldn't execute for some reason: {} {}\\n\", argv[0], errno, strerror(errno));\n  145 |       LogMan::Msg::EFmt(\"[FEXServer] To mount squashfs rootfs files you need {} installed\\n\", argv[0]);\n  146 |       LogMan::Msg::EFmt(\"[FEXServer] Check your FUSE setup.\\n\");\n  147 | \n  148 |       // Let the parent know that we couldn't execute for some reason\n  149 |       uint64_t error {1};\n  150 |       write(fds[1], &error, sizeof(error));\n  151 | \n  152 |       // End the child\n  153 |       exit(1);\n  154 |     }\n  155 |   } else {\n  156 |     FuseMountPID = pid;\n  157 |     // Parent\n  158 |     // Wait for the child to exit\n  159 |     // This will happen with execvpe of squashmount or exit on failure\n  160 |     while (waitpid(pid, nullptr, 0) == -1 && errno == EINTR)\n  161 |       ;\n  162 | \n  163 |     // Check the child pipe for messages\n  164 |     pollfd PollFD;\n  165 |     PollFD.fd = fds[0];\n  166 |     PollFD.events = POLLIN;\n  167 | \n  168 |     int Result = poll(&PollFD, 1, 0);\n  169 | \n  170 |     if (Result == 1 && PollFD.revents & POLLIN) {\n  171 |       // Child couldn't execvpe for whatever reason\n  172 |       // Remove the mount path and leave Just in case it was created\n  173 |       rmdir(MountFolderStr);\n  174 | \n  175 |       // Close the pipe now\n  176 |       close(fds[0]);\n  177 | \n  178 |       LogMan::Msg::EFmt(\"[FEXServer] Couldn't mount squashfs\\n\");\n  179 |       return false;\n  180 |     }\n  181 | \n  182 |     // Close the pipe now\n  183 |     close(fds[0]);","lines":55,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/FEXServer/SquashFS.cpp#L129-L183"}]},
{"id":"MEM_10","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"In Module.cpp ProcessInit (line 624), X64ReturnInstr is allocated with\nVirtualAlloc but is never freed (there is no corresponding VirtualFree in\nProcessTerm). This is a minor leak on process exit, acceptable in practice but\nworth noting.","fix":"Add VirtualFree(X64ReturnInstr, 0, MEM_RELEASE) in ProcessTerm.","locations":[{"ref":"Source/Windows/ARM64EC/Module.cpp:633","code":"  633 |   X64ReturnInstr = ::VirtualAlloc(nullptr, FEXCore::Utils::FEX_PAGE_SIZE, MEM_COMMIT | MEM_TOP_DOWN, PAGE_EXECUTE_READWRITE);","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Windows/ARM64EC/Module.cpp#L633"},{"ref":"Source/Windows/ARM64EC/Module.cpp:657","code":"  657 | void ProcessTerm(HANDLE Handle, BOOL After, NTSTATUS Status) {}","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Windows/ARM64EC/Module.cpp#L657"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"IntrusiveArenaAllocator::do_allocate (IntrusiveArenaAllocator.h line 123) computes the\nloop upper bound as (Size - NumberPages) where both are unsigned (size_t). If\nNumberPages > Size (requested allocation larger than arena), unsigned subtraction wraps\nto a huge value. The loop condition 'CurrentPage <= huge_value' is always true, so the\nallocator spins forever (infinite loop) accessing out-of-bounds bit indices in UsedPages.","fix":"Add a guard before the loop: if (NumberPages > Size) return nullptr; Alternatively check NumberPages <= Size - LastAllocatedPageOffset.","locations":[{"ref":"FEXCore/Source/Utils/Allocator/IntrusiveArenaAllocator.h:123","code":"  123 |     for (uintptr_t CurrentPage = LastAllocatedPageOffset; CurrentPage <= (Size - NumberPages);) {","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Utils/Allocator/IntrusiveArenaAllocator.h#L123"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"HarnessHelpers.h ConfigLoader::GetEnvironmentOptions(): DataOffset is a\nuintptr_t derived from the untrusted config file field OptionEnvOptionOffset.\nFor each environment entry, Key.size() and Value.size() are computed from\nstd::string_view constructed by reading directly into RawConfigFile starting\nat DataOffset. If OptionEnvOptionOffset or the accumulated offsets exceed the\nbuffer size, std::string_view will silently read past the end of RawConfigFile\n(whose backing memory extends only to its allocated size), causing an OOB read\nand undefined string lengths. There is no bounds check before forming the\nstring_views or advancing DataOffset.","fix":"Validate DataOffset < RawConfigFile.size() before each std::string_view\nconstruction, and ensure DataOffset + Key.size() + 1 + Value.size() + 1 <=\nRawConfigFile.size() before advancing.","locations":[{"ref":"Source/Tools/CommonTools/HarnessHelpers.h:106-113","code":"  106 |     uintptr_t DataOffset = BaseConfig.OptionEnvOptionOffset;\n  107 |     for (unsigned i = 0; i < BaseConfig.OptionEnvOptionCount; ++i) {\n  108 |       // Environment variables are null terminated strings\n  109 |       std::string_view Key = RawConfigFile.data() + DataOffset;\n  110 |       std::string_view Value = RawConfigFile.data() + DataOffset + Key.size() + 1;\n  111 |       DataOffset += Key.size() + Value.size() + 2;\n  112 |       Env.emplace_back(Key, Value);\n  113 |     }","lines":8,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/CommonTools/HarnessHelpers.h#L106-L113"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"HarnessHelpers.h ConfigLoader::CompareStates(): NameIndex is computed as\n`FEXCore::FindFirstSetBit(RegData->RegKey) - 1`. OffsetArrayAVX and\nOffsetArraySSE both have exactly 43 elements (indices 0-42). The assert only\nchecks RegFlags.count() == 1 (exactly one bit set), but RegData->RegKey comes\nfrom the untrusted config file. If a bit >= 44 is set, FindFirstSetBit returns\na value >= 44, NameIndex >= 43, and the subsequent array access at\nOffsetArrayAVX[NameIndex] or OffsetArraySSE[NameIndex] is out of bounds.","fix":"Add a bounds check: assert or LOGMAN_THROW that NameIndex < OffsetArrayAVX.size() after computing it.","locations":[{"ref":"Source/Tools/CommonTools/HarnessHelpers.h:222-223","code":"  222 |         size_t NameIndex = FEXCore::FindFirstSetBit(RegData->RegKey) - 1;\n  223 |         auto Offset = SupportsAVX ? OffsetArrayAVX[NameIndex] : OffsetArraySSE[NameIndex];","lines":2,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/CommonTools/HarnessHelpers.h#L222-L223"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"HarnessHelpers.h ConfigLoader::LoadMemory(): DataOffset starts at\nOptionMemDataOffset (from the config file) and for each entry a\nMemDataStructBase* is reinterpret_cast from RawConfigFile.data() + DataOffset.\nNeither OptionMemDataOffset itself nor the incremented DataOffset is validated\nagainst RawConfigFile.size(), so a crafted or corrupted config file can cause\nDataOffset to exceed the buffer, resulting in an out-of-bounds read when\nconstructing MemData and subsequently an arbitrary write via memcpy to any\naddress (MemData->address is attacker-controlled).","fix":"Verify DataOffset + sizeof(MemDataStructBase) <= RawConfigFile.size() and DataOffset + sizeof(MemDataStructBase) + MemData->length <= RawConfigFile.size() before each access.","locations":[{"ref":"Source/Tools/CommonTools/HarnessHelpers.h:286-291","code":"  286 |     uintptr_t DataOffset = BaseConfig.OptionMemDataOffset;\n  287 |     for (unsigned i = 0; i < BaseConfig.OptionMemDataCount; ++i) {\n  288 |       MemDataStructBase* MemData = reinterpret_cast<MemDataStructBase*>(RawConfigFile.data() + DataOffset);\n  289 |       memcpy(reinterpret_cast<void*>(MemData->address), &MemData->data, MemData->length);\n  290 |       DataOffset += sizeof(MemDataStructBase) + MemData->length;\n  291 |     }","lines":6,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/CommonTools/HarnessHelpers.h#L286-L291"}]},
{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"ELFContainer::LoadELF_32() and LoadELF_64() call RawFile.at(Header._32.e_shoff)\nand RawFile.at(Header._64.e_shoff) (respectively), and likewise for e_phoff.\nThe e_shoff/e_phoff values come directly from the ELF header with no validation\nthat the offset plus the array size fits within RawFile. The std::vector::at()\nwill throw std::out_of_range if e_shoff >= RawFile.size(), but there is no\ncheck that e_shoff + e_shnum * sizeof(Elf32_Shdr) <= RawFile.size(). Pointer\narithmetic RawShdrs[i] for i up to e_shnum - 1 can then access memory past the\nend of the vector's backing buffer.","fix":"After the at() calls, verify that the offset + (count * entry_size) <= RawFile.size() before iterating the section/program header arrays.","locations":[{"ref":"Source/Tools/CommonTools/Linux/Utils/ELFContainer.cpp:194-198","code":"  194 |   Elf32_Shdr* RawShdrs = reinterpret_cast<Elf32_Shdr*>(&RawFile.at(Header._32.e_shoff));\n  195 |   Elf32_Phdr* RawPhdrs = reinterpret_cast<Elf32_Phdr*>(&RawFile.at(Header._32.e_phoff));\n  196 | \n  197 |   for (uint32_t i = 0; i < Header._32.e_shnum; ++i) {\n  198 |     SectionHeaders[i]._32 = &RawShdrs[i];","lines":5,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/CommonTools/Linux/Utils/ELFContainer.cpp#L194-L198"},{"ref":"Source/Tools/CommonTools/Linux/Utils/ELFContainer.cpp:232-237","code":"  232 |   Elf64_Shdr* RawShdrs = reinterpret_cast<Elf64_Shdr*>(&RawFile.at(Header._64.e_shoff));\n  233 |   Elf64_Phdr* RawPhdrs = reinterpret_cast<Elf64_Phdr*>(&RawFile.at(Header._64.e_phoff));\n  234 | \n  235 |   for (uint32_t i = 0; i < Header._64.e_shnum; ++i) {\n  236 |     SectionHeaders[i]._64 = &RawShdrs[i];\n  237 |   }","lines":6,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/CommonTools/Linux/Utils/ELFContainer.cpp#L232-L237"}]},
{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"ELFContainer::CalculateSymbols() reads StrTab[Symbol->st_name] and\nDynStrTab[Symbol->st_name] without checking that st_name is within the\nbounds of the string table section. Symbol->st_name is a 32-bit unsigned\noffset from an untrusted ELF file. A malformed or adversarial ELF with a\nlarge st_name can cause OOB reads on the StrTab pointer.","fix":"Check Symbol->st_name < StringTableHeader->sh_size (or equivalent) before indexing StrTab.","locations":[{"ref":"Source/Tools/CommonTools/Linux/Utils/ELFContainer.cpp:417","code":"  417 |         const char* Name = &StrTab[Symbol->st_name];","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/CommonTools/Linux/Utils/ELFContainer.cpp#L417"},{"ref":"Source/Tools/CommonTools/Linux/Utils/ELFContainer.cpp:438","code":"  438 |         const char* Name = &DynStrTab[Symbol->st_name];","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/CommonTools/Linux/Utils/ELFContainer.cpp#L438"},{"ref":"Source/Tools/CommonTools/Linux/Utils/ELFContainer.cpp:541","code":"  541 |         const char* Name = &StrTab[Symbol->st_name];","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/CommonTools/Linux/Utils/ELFContainer.cpp#L541"},{"ref":"Source/Tools/CommonTools/Linux/Utils/ELFContainer.cpp:562","code":"  562 |         const char* Name = &DynStrTab[Symbol->st_name];","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/CommonTools/Linux/Utils/ELFContainer.cpp#L562"}]},
{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"In CodeCache::SaveData, the lseek() call at lines 352 and 366 returns off_t. If lseek() fails, it returns -1 as off_t. This -1 is then passed to AlignUp() which treats it as a very large unsigned value (likely UINT64_MAX or similar), causing ftruncate() to attempt to allocate terabytes of disk space (which will fail with EFBIG or ENOSPC) and lseek() to jump to an invalid position. Subsequent writes will then corrupt the file or fail silently.","fix":"Check the return value of lseek() before passing it to AlignUp(). If lseek() returns -1, return false from SaveData.","locations":[{"ref":"FEXCore/Source/Interface/Core/CodeCache.cpp:358-360","code":"  358 |     auto AlignedSize = AlignUp(lseek(fd, 0, SEEK_CUR), Utils::FEX_PAGE_SIZE);\n  359 |     ::ftruncate(fd, AlignedSize);\n  360 |     lseek(fd, AlignedSize, SEEK_SET);","lines":3,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/CodeCache.cpp#L358-L360"},{"ref":"FEXCore/Source/Interface/Core/CodeCache.cpp:373-375","code":"  373 |     auto PaddedSize = AlignUp(lseek(fd, 0, SEEK_CUR), Utils::FEX_PAGE_SIZE);\n  374 |     ::ftruncate(fd, PaddedSize);\n  375 |     lseek(fd, PaddedSize, SEEK_SET);","lines":3,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/CodeCache.cpp#L373-L375"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"critical","difficulty":"easy","description":"memset in DecodeInstructionImpl uses sizeof(DecodedInst) where DecodeInst is a pointer (FEXCore::X86Tables::DecodedInst*), so sizeof() returns 8 (pointer size) instead of the struct size (56+ bytes). Only the first 8 bytes of the DecodedInst entry are zeroed; all other fields (Dest, Src, TableInfo, Flags, OP, ModRM, SIB, InstSize, REXIndex) retain stale values from the previous instruction decode. This can cause silently incorrect instruction decoding, wrong operand register mappings, or flag mismatches.","fix":"Change sizeof(DecodedInst) to sizeof(*DecodeInst) or sizeof(FEXCore::X86Tables::DecodedInst).","locations":[{"ref":"FEXCore/Source/Interface/Core/Frontend.cpp:864","code":"  864 |   memset(DecodeInst, 0, sizeof(DecodedInst));","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/Frontend.cpp#L864"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"critical","difficulty":"easy","description":"QueueSignal uses SIG_BLOCK (how=0) when it should use SIG_SETMASK (how=2) to unmask/remask the target signal.\n\nLine 864: `::syscall(SYS_rt_sigprocmask, 0, &ThreadSignalMask, &ThreadSignalMask, 8)` with how=0 (SIG_BLOCK)\nblocks ALL signals in ThreadSignalMask (the current set minus the target bit). This does NOT unblock the\ntarget signal - it just re-blocks whatever was already blocked. The intent is to temporarily unblock the\nsignal so that rt_tgsigqueueinfo delivers it; using SIG_BLOCK to do that is wrong.\n\nLine 871: `::syscall(SYS_rt_sigprocmask, 0, &ThreadSignalMask, nullptr, 8)` similarly uses SIG_BLOCK when\nSIG_SETMASK is needed to restore the original mask.\n\nSIG_BLOCK=0, SIG_UNBLOCK=1, SIG_SETMASK=2. The correct how value to set the full mask is SIG_SETMASK=2.\nAs a result, SECCOMP_RET_TRAP, GDB signal delivery, and any other path using QueueSignal may fail to\nactually deliver the signal if it is currently masked.","fix":"Change the `how` argument from 0 to SIG_SETMASK (2) on lines 864 and 871. On line 864 the intent is to set the mask to (current & ~SignalMask); on line 871 the intent is to restore the original mask. Both require SIG_SETMASK.","locations":[{"ref":"Source/Tools/LinuxEmulation/LinuxSyscalls/SignalDelegator.cpp:853-866","code":"  853 |   ::syscall(SYS_rt_sigprocmask, 0, nullptr, &ThreadSignalMask, 8);\n  854 |   if (ThreadSignalMask & SignalMask) {\n  855 |     WasMasked = true;\n  856 | \n  857 |     // Signal currently masked, unmask\n  858 |     ThreadSignalMask &= ~SignalMask;\n  859 |     ::syscall(SYS_rt_sigprocmask, 0, &ThreadSignalMask, &ThreadSignalMask, 8);\n  860 |   }\n  861 | \n  862 |   ::syscall(SYSCALL_DEF(rt_tgsigqueueinfo), tgid, tid, Signal, info);\n  863 | \n  864 |   if (WasMasked) {\n  865 |     // Mask again\n  866 |     ::syscall(SYS_rt_sigprocmask, 0, &ThreadSignalMask, nullptr, 8);","lines":14,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/LinuxEmulation/LinuxSyscalls/SignalDelegator.cpp#L853-L866"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"BiDirectionalLabel::Bind has an inverted guard for the backward label.  The code reads:\n\n  if (!Label->Backward.Location) {\n    Bound &= Bind(&Label->Backward);\n  }\n\nThis binds the backward label only when its Location is nullptr (i.e. not yet set), and\nskips binding when it IS set to a real address.  The correct logic is the opposite: skip if\nnot set, bind if it holds a real address.  The condition should be\n`if (Label->Backward.Location)`.","fix":"Change `if (!Label->Backward.Location)` to `if (Label->Backward.Location)`.","locations":[{"ref":"CodeEmitter/CodeEmitter/Emitter.h:810-818","code":"  810 |   [[nodiscard]] bool Bind(BiDirectionalLabel* Label) {\n  811 |     bool Bound = true;\n  812 |     if (!Label->Backward.Location) {\n  813 |       Bound &= Bind(&Label->Backward);\n  814 |     }\n  815 |     Bound &= Bind(&Label->Forward);\n  816 | \n  817 |     return Bound;\n  818 |   }","lines":9,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/CodeEmitter/CodeEmitter/Emitter.h#L810-L818"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"In cephes_f128_ldexpl, when the input is a denormal (exponent field == 0) and pw2 < 0 (meaning we need to right-shift / divide by 2), the code executes `u.y = f128_sub(&state, u.y, f_0_p5)` (line 296) - it subtracts 0.5 from the denormal value. Since the denormal is astronomically small (magnitude around 2^-16382 or less), subtracting 0.5 produces approximately -0.5, which is completely wrong. The correct operation to halve the value is `f128_mul(&state, u.y, f_0_p5)`. The identical bug appears at line 326 in the output-denormal adjustment loop, where the same subtraction-instead-of-multiply error occurs.","fix":"Replace `u.y = f128_sub(&state, u.y, f_0_p5);` with `u.y = f128_mul(&state, u.y, f_0_p5);` at both line 296 and line 326. Multiplying by 0.5 correctly halves the denormal, whereas subtracting 0.5 produces a large negative result.","locations":[{"ref":"External/cephes/src/128bit/floorll.c:292-298","code":"  292 |                 }\n  293 |         if( pw2 < 0 )\n  294 |                 {\n  295 |                 if( pw2 < -113 )\n  296 |                         return zero;\n  297 |                 u.y = f128_sub(&state, u.y, f_0_p5);\n  298 |                 pw2 += 1;","lines":7,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/External/cephes/src/128bit/floorll.c#L292-L298"},{"ref":"External/cephes/src/128bit/floorll.c:322-328","code":"  322 |         if( e < -113 )\n  323 |                 return zero;\n  324 |         u.sh[EXPOFS] |= 1;\n  325 |         while( e < 1 )\n  326 |                 {\n  327 |                 u.y = f128_sub(&state, u.y, f_0_p5);\n  328 |                 e += 1;","lines":7,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/External/cephes/src/128bit/floorll.c#L322-L328"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"JITSymbols::WriteBuffer uses a negated duration comparison to decide whether to skip writing:\n\n  (Buffer->LastWrite - Now) < Buffer->MAXIMUM_THRESHOLD\n\n`LastWrite` is a time_point in the past; `Now` is the current time.  Subtracting a later\npoint from an earlier one (LastWrite - Now) gives a negative duration.  A negative duration\nis always less than any positive MAXIMUM_THRESHOLD, so the condition is always true, meaning\nthe buffer is NEVER flushed on the time-based path (only on the distance-based path or forced\nflush).  The comparison should be `(Now - Buffer->LastWrite) < Buffer->MAXIMUM_THRESHOLD`.","fix":"Replace `(Buffer->LastWrite - Now)` with `(Now - Buffer->LastWrite)`.","locations":[{"ref":"FEXCore/Source/Common/JitSymbols.cpp:134","code":"  134 |     if (((Buffer->LastWrite - Now) < Buffer->MAXIMUM_THRESHOLD) && Buffer->Offset < Buffer->NEEDS_WRITE_DISTANCE) {","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Common/JitSymbols.cpp#L134"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"ContainsRange in TrackingPossible iterates backward from `Set.lower_bound(Ptr)` using `--it` in a standard for-loop increment. When the smallest element in the set is >= Ptr+Size (outside the query range), the loop body executes once (neither break condition fires), then `--it` decrements a begin() iterator, which is undefined behavior. This is a debug-only code path (guarded by BLOCK_DEBUGGING=false) so it currently has no runtime impact, but any future enablement will trigger UB.","fix":"Iterate forward instead: `for (auto it = Set.lower_bound(Ptr); it != Set.end() && *it < Ptr + Size; ++it) { if (*it >= Ptr) return true; }`. The current backward iteration is also logically incorrect - lower_bound already gives the first candidate >= Ptr, so going backward finds only elements < Ptr.","locations":[{"ref":"FEXCore/Source/Interface/Context/Context.h:329-341","code":"  329 |     static bool ContainsRange(const fextl::set<uint64_t>& Set, uint64_t Ptr, size_t Size) {\n  330 |       for (auto it = Set.lower_bound(Ptr); it != Set.end(); --it) {\n  331 |         auto Watch = *it;\n  332 |         if (Watch < Ptr) {\n  333 |           break;\n  334 |         }\n  335 |         if (Watch >= Ptr && Watch < (Ptr + Size)) {\n  336 |           return true;\n  337 |         }\n  338 |       }\n  339 | \n  340 |       return false;\n  341 |     }","lines":13,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Context/Context.h#L329-L341"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In EmitF64Tan the double-angle denominator has the wrong sign before the conditional swap. Line 1195 computes VTMP2 = tan^2(r) - 1 (not 1 - tan^2(r)). For an even quadrant index (bit 0 of TMP1 clear) the swap path negates the numerator and swaps, producing fdiv(VTMP2=-2t, VTMP1=t^2-1) which equals 2t/(1-t^2) - correct. For an odd quadrant index (SkipSwap taken) the final fdiv(VTMP1.D(), VTMP2.D(), VTMP1.D()) computes (t^2-1)/(2t). The odd-quadrant result should be -(1-t^2)/(2t) = (t^2-1)/(2t) for the half-period complement, so the result is numerically correct in that specific sense. However the sign convention for tbnz vs tbz determines which quadrant gets which formula, and a swap of these conditions would silently invert the output sign for one half of the input range. The current tbnz (skip when odd) needs careful verification against the reference.","fix":"Verify the parity/swap assignment against a reference implementation. If tbnz and tbz are swapped, change tbnz to tbz (or vice versa) at line 1198.","locations":[{"ref":"FEXCore/Source/Interface/Core/Dispatcher/Dispatcher.cpp:1191-1207","code":" 1191 |   // Double-angle reconstruction: tan(2x) = 2*tan(x) / (1 - tan^2(x)).\n 1192 |   fadd(VTMP1.D(), Accum.D(), Accum.D());\n 1193 |   fmul(VTMP2.D(), Accum.D(), Accum.D());\n 1194 |   fmov(ARMEmitter::ScalarRegSize::i64Bit, Accum, 1.0f);\n 1195 |   fsub(VTMP2.D(), VTMP2.D(), Accum.D());\n 1196 | \n 1197 |   ARMEmitter::ForwardLabel SkipSwap;\n 1198 |   (void)tbnz(TMP1, 0, &SkipSwap);\n 1199 | \n 1200 |   fneg(Accum.D(), VTMP1.D());\n 1201 |   fmov(VTMP1.D(), VTMP2.D());\n 1202 |   fmov(VTMP2.D(), Accum.D());\n 1203 | \n 1204 |   (void)Bind(&SkipSwap);\n 1205 | \n 1206 |   // result = numerator / denominator -> VTMP1.\n 1207 |   fdiv(VTMP1.D(), VTMP2.D(), VTMP1.D());","lines":17,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/Dispatcher/Dispatcher.cpp#L1191-L1207"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"Missing sign extension of 16-bit displacement in DecodeModRM_16. For DisplacementSize == 1 the code explicitly sign-extends via static_cast<int8_t>(Literal), but for DisplacementSize == 2 (the 16-bit case) there is no sign extension. A negative 16-bit displacement such as 0xFF00 is stored as the positive value 65280 in the int64_t SIB.Offset field. This produces wrong effective addresses for any 16-bit memory operand that uses a negative displacement.","fix":"After the existing Bytes==1 sign-extension block, add: else if (DisplacementSize == 2) { Literal = static_cast<int16_t>(Literal); }","locations":[{"ref":"FEXCore/Source/Interface/Core/Frontend.cpp:207-218","code":"  207 |   if (DisplacementSize) {\n  208 |     bool IsRelocation = false;\n  209 |     std::tie(Literal, IsRelocation) = ReadData(DisplacementSize);\n  210 |     LOGMAN_THROW_A_FMT(!IsRelocation, \"1/2 byte relocations unsupported\");\n  211 |     if (DisplacementSize == 1) {\n  212 |       Literal = static_cast<int8_t>(Literal);\n  213 |     }\n  214 |   }\n  215 | \n  216 |   Operand->Type = DecodedOperand::OpType::SIB;\n  217 |   Operand->Data.SIB.Scale = 1;\n  218 |   Operand->Data.SIB.Offset = Literal;","lines":12,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/Frontend.cpp#L207-L218"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"HandleEqualEach in VectorFallbacks.h produces wrong aggregation bits for positions in the range [min_valid+1 .. max_valid] when the two strings have different lengths. Intel's spec requires these positions to be forced to 1 (since at least one string is invalid there). The code initializes result with (1U << (upper_limit - max_valid)) - 1 shifted left by (max_valid - min_valid), intending those 1s for the 'both-invalid' region. But after (min_valid+1) more left-shifts from the comparison loop, those 1s land in positions [max_valid+1 .. upper_limit], leaving positions [min_valid+1 .. max_valid] as 0. Example: LHS empty (valid_lhs=-1), RHS has 1 char (valid_rhs=0) - the code returns 0xFFFE (bit 0 = 0) instead of the correct 0xFFFF.","fix":"Initialize result to all-ones for all positions beyond min_valid before the loop, e.g., result = (2U << upper_limit) - 1 to preset all bits, then let the loop overwrite the bits for positions 0..min_valid. Alternatively, separately set the bits for positions min_valid+1..max_valid to 1 as a second initial mask.","locations":[{"ref":"FEXCore/Source/Interface/Core/Interpreter/Fallbacks/VectorFallbacks.h:266-287","code":"  266 |   HandleEqualEach(const __uint128_t& lhs, int32_t valid_lhs, const __uint128_t& rhs, int32_t valid_rhs, uint16_t control) {\n  267 |     const auto upper_limit = (16 >> (control & 1)) - 1;\n  268 |     const auto max_valid = std::max(valid_lhs, valid_rhs);\n  269 |     const auto min_valid = std::min(valid_lhs, valid_rhs);\n  270 | \n  271 |     // All values past the end of string must be forced to true.\n  272 |     // (See 4.1.6 Valid/Invalid Override of Comparisons in the Intel Software Development Manual)\n  273 |     // So we can calculate this part of the mask ahead of time and set all those to-be bits to true\n  274 |     // and then progressively shift them into place over the course of execution.\n  275 |     uint32_t result = (1U << (upper_limit - max_valid)) - 1;\n  276 |     result <<= (max_valid - min_valid);\n  277 | \n  278 |     for (int i = min_valid; i >= 0; i--) {\n  279 |       const int lhs_element = GetElement(lhs, i, control);\n  280 |       const int rhs_element = GetElement(rhs, i, control);\n  281 | \n  282 |       result <<= 1;\n  283 |       result |= static_cast<uint32_t>(lhs_element == rhs_element);\n  284 |     }\n  285 | \n  286 |     return result;\n  287 |   }","lines":22,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/Interpreter/Fallbacks/VectorFallbacks.h#L266-L287"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"In DEF_OP(ExitFunction), when `Op->Hint == BranchHint::Return`, the shadow stack pop is unconditional: `ldp<POST>(TMP1, TMP2, REG_CALLRET_SP, 0x10)`. This pops the shadow call-ret stack even if the check that follows fails (sub+cbnz). If the guest RIP does not match the shadow stack top (TMP1 != RipReg after sub), the code falls through to the L1 cache lookup, but the shadow stack has already been permanently popped. Repeated cache misses will drain the shadow stack one entry per miss. On a shadow stack underflow the exception handler is supposed to reset the stack, but the pop-before-check pattern still loses one valid entry on every miss.","fix":"Load the shadow stack top into TMP1/TMP2 without popping (use OFFSET indexing), check the match, and only commit the post-index pop when the check succeeds. Or use `ldp<OFFSET>` + conditional `add REG_CALLRET_SP, REG_CALLRET_SP, 0x10` on match.","locations":[{"ref":"FEXCore/Source/Interface/Core/JIT/BranchOps.cpp:197-202","code":"  197 |     if (Op->Hint == IR::BranchHint::Return) {\n  198 |       // First try to pop from the call-ret stack, otherwise follow the normal path (but ending in a ret)\n  199 |       ldp<ARMEmitter::IndexType::POST>(TMP1, TMP2, REG_CALLRET_SP, 0x10);\n  200 |       sub(TMP1, TMP1, RipReg.X());\n  201 |       (void)cbz(ARMEmitter::Size::i64Bit, TMP1, &SkipFullLookup);\n  202 |     }","lines":6,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/JIT/BranchOps.cpp#L197-L202"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"Five AVX128 AES handlers (AVX128_VAESImc, AVX128_VAESEnc, AVX128_VAESEncLast, AVX128_VAESDec, AVX128_VAESDecLast) are missing the SupportsAES host-feature guard. They delegate directly to AES IR ops that require hardware support; on a non-AES host this produces invalid code or crashes.","fix":"Add at the top of each function: if (!CTX->HostFeatures.SupportsAES) { UnimplementedOp(Op); return; }","locations":[{"ref":"FEXCore/Source/Interface/Core/OpcodeDispatcher/AVX_128.cpp:1217-1220","code":" 1217 | void OpDispatchBuilder::AVX128_VAESImc(OpcodeArgs) {\n 1218 |   ///< 128-bit only.\n 1219 |   AVX128_VectorUnaryImpl(Op, OpSize::i128Bit, OpSize::i128Bit, [this](IR::OpSize, Ref Src) { return _VAESImc(Src); });\n 1220 | }","lines":4,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/OpcodeDispatcher/AVX_128.cpp#L1217-L1220"},{"ref":"FEXCore/Source/Interface/Core/OpcodeDispatcher/AVX_128.cpp:1222-1225","code":" 1222 | void OpDispatchBuilder::AVX128_VAESEnc(OpcodeArgs) {\n 1223 |   AVX128_VectorTrinaryImpl(Op, OpSizeFromDst(Op), OpSize::i128Bit, LoadZeroVector(OpSize::i128Bit),\n 1224 |                            [this](IR::OpSize, Ref Src1, Ref Src2, Ref Src3) { return _VAESEnc(OpSize::i128Bit, Src1, Src2, Src3); });\n 1225 | }","lines":4,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/OpcodeDispatcher/AVX_128.cpp#L1222-L1225"},{"ref":"FEXCore/Source/Interface/Core/OpcodeDispatcher/AVX_128.cpp:1227-1230","code":" 1227 | void OpDispatchBuilder::AVX128_VAESEncLast(OpcodeArgs) {\n 1228 |   AVX128_VectorTrinaryImpl(Op, OpSizeFromDst(Op), OpSize::i128Bit, LoadZeroVector(OpSize::i128Bit),\n 1229 |                            [this](IR::OpSize, Ref Src1, Ref Src2, Ref Src3) { return _VAESEncLast(OpSize::i128Bit, Src1, Src2, Src3); });\n 1230 | }","lines":4,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/OpcodeDispatcher/AVX_128.cpp#L1227-L1230"},{"ref":"FEXCore/Source/Interface/Core/OpcodeDispatcher/AVX_128.cpp:1232-1235","code":" 1232 | void OpDispatchBuilder::AVX128_VAESDec(OpcodeArgs) {\n 1233 |   AVX128_VectorTrinaryImpl(Op, OpSizeFromDst(Op), OpSize::i128Bit, LoadZeroVector(OpSize::i128Bit),\n 1234 |                            [this](IR::OpSize, Ref Src1, Ref Src2, Ref Src3) { return _VAESDec(OpSize::i128Bit, Src1, Src2, Src3); });\n 1235 | }","lines":4,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/OpcodeDispatcher/AVX_128.cpp#L1232-L1235"},{"ref":"FEXCore/Source/Interface/Core/OpcodeDispatcher/AVX_128.cpp:1237-1240","code":" 1237 | void OpDispatchBuilder::AVX128_VAESDecLast(OpcodeArgs) {\n 1238 |   AVX128_VectorTrinaryImpl(Op, OpSizeFromDst(Op), OpSize::i128Bit, LoadZeroVector(OpSize::i128Bit),\n 1239 |                            [this](IR::OpSize, Ref Src1, Ref Src2, Ref Src3) { return _VAESDecLast(OpSize::i128Bit, Src1, Src2, Src3); });\n 1240 | }","lines":4,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/OpcodeDispatcher/AVX_128.cpp#L1237-L1240"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"Four VEX-encoded VAES functions (VAESEncOp, VAESEncLastOp, VAESDecOp, VAESDecLastOp) are missing the SupportsAES host-feature guard that all four non-VEX counterparts correctly have. On a host lacking AES hardware these functions attempt to emit AES IR ops and crash or produce invalid code instead of falling back to UnimplementedOp.","fix":"Add as the first statement of each function: if (!CTX->HostFeatures.SupportsAES) { UnimplementedOp(Op); return; }","locations":[{"ref":"FEXCore/Source/Interface/Core/OpcodeDispatcher/Crypto.cpp:217-240","code":"  217 | void OpDispatchBuilder::VAESEncOp(OpcodeArgs) {\n  218 |   const auto DstSize = OpSizeFromDst(Op);\n  219 |   const auto Is256Bit = DstSize == OpSize::i256Bit;\n  220 | \n  221 |   Ref State = LoadSourceFPR(Op, Op->Src[0], Op->Flags);\n  222 |   Ref Key = LoadSourceFPR(Op, Op->Src[1], Op->Flags);\n  223 |   Ref ZeroVec = LoadZeroVector(DstSize);\n  224 | \n  225 |   Ref Result {};\n  226 |   if (Is256Bit) {\n  227 |     // TODO: Handle as one operation once vixl supports it.\n  228 |     auto UpperState = _VDupElement(DstSize, OpSize::i128Bit, State, 1);\n  229 |     auto UpperKey = _VDupElement(DstSize, OpSize::i128Bit, Key, 1);\n  230 | \n  231 |     auto Lower = _VAESEnc(OpSize::i128Bit, State, Key, ZeroVec);\n  232 |     auto Upper = _VAESEnc(OpSize::i128Bit, UpperState, UpperKey, ZeroVec);\n  233 | \n  234 |     Result = _VInsElement(DstSize, OpSize::i128Bit, 1, 0, Lower, Upper);\n  235 |   } else {\n  236 |     Result = _VAESEnc(DstSize, State, Key, ZeroVec);\n  237 |   }\n  238 | \n  239 |   StoreResultFPR(Op, Result);\n  240 | }","lines":24,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/Core/OpcodeDispatcher/Crypto.cpp#L217-L240"},{"ref":"FEXCore/Source/Interface/Core/OpcodeDispatcher/Crypto.cpp:253-276","code":"  253 | void OpDi {"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In RegisterAllocationPass.cpp `HasSource()` (line 152-172), when checking\nSSA sources (non-immediate args, lines 162-168), the code clears the kill bit\nfrom V and then checks `SSAToReg[V.ID().Value] == Reg`. However, SSAToReg\nis only resized to `IR->GetSSACount()` at the start of `Run()` (line 575).\nDuring block iteration, new IR nodes may have been inserted (fills/spills)\nand their IDs exceed the original SSA count, causing out-of-bounds access\non `SSAToReg`. `IsValidArg()` filters out inline constants and inline entry\npoint offsets but not these newly inserted nodes whose IDs are beyond\nSSAToReg.size().","fix":"In `HasSource()`, guard the SSAToReg access with a bounds check: `if (V.ID().Value < SSAToReg.size() && SSAToReg[V.ID().Value] == Reg)`. Also consider growing SSAToReg as new nodes are inserted.","locations":[{"ref":"FEXCore/Source/Interface/IR/Passes/RegisterAllocationPass.cpp:170-176","code":"  170 |         // pretty obscure.\n  171 |         auto V = I->Args[s];\n  172 |         V.ClearKill();\n  173 | \n  174 |         if (IsValidArg(V) && SSAToReg[V.ID().Value] == Reg) {\n  175 |           return true;\n  176 |         }","lines":7,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/IR/Passes/RegisterAllocationPass.cpp#L170-L176"},{"ref":"FEXCore/Source/Interface/IR/Passes/RegisterAllocationPass.cpp:582-583","code":"  582 |   PreferredReg.resize(IR->GetSSACount(), PhysicalRegister::Invalid());\n  583 |   SSAToReg.resize(IR->GetSSACount(), PhysicalRegister::Invalid());","lines":2,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Interface/IR/Passes/RegisterAllocationPass.cpp#L582-L583"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"In AllocatorOverride.cpp, posix_memalign_ptr and malloc_usable_size_ptr are initialized\nto ::posix_memalign and ::malloc_usable_size respectively (lines 63-64). However, those\nsymbols are aliased in the same translation unit via GLIBC_ALIAS_FUNCTION to\nfault_posix_memalign and fault_malloc_usable_size. When fault_posix_memalign is called it\ninvokes posix_memalign_ptr, which points back to fault_posix_memalign, causing infinite\nrecursion and a stack overflow. Compare with calloc_ptr, free_ptr, malloc_ptr, etc., all\nof which correctly use the __libc_* internal glibc symbols. The __posix_memalign and\n__malloc_usable_size declarations already exist (lines 39, 42) but are not used.","fix":"Change: auto posix_memalign_ptr = ::posix_memalign; -> auto posix_memalign_ptr = __posix_memalign; and auto malloc_usable_size_ptr = ::malloc_usable_size; -> auto malloc_usable_size_ptr = __malloc_usable_size;","locations":[{"ref":"FEXCore/Source/Utils/AllocatorOverride.cpp:39-64","code":"   39 | extern int __posix_memalign(void**, size_t, size_t);\n   40 | int posix_memalign(void**, size_t, size_t) GLIBC_ALIAS_FUNCTION(fault_posix_memalign);\n   41 | \n   42 | extern size_t __malloc_usable_size(void*);\n   43 | size_t malloc_usable_size(void*) GLIBC_ALIAS_FUNCTION(fault_malloc_usable_size);\n   44 | \n   45 | // Reuse __libc_memalign\n   46 | void* aligned_alloc(size_t, size_t) GLIBC_ALIAS_FUNCTION(fault_aligned_alloc);\n   47 | }\n   48 | \n   49 | namespace FEXCore::Allocator {\n   50 | // Enable or disable allocation faulting globally.\n   51 | static bool GlobalEvaluate {};\n   52 | \n   53 | // Enable or disable allocation faulting per-thread.\n   54 | static thread_local uint64_t SkipEvalForThread {};\n   55 | \n   56 | // Internal memory allocation hooks to allow non-faulting allocations through.\n   57 | auto calloc_ptr = __libc_calloc;\n   58 | auto free_ptr = __libc_free;\n   59 | auto malloc_ptr = __libc_malloc;\n   60 | auto memalign_ptr = __libc_memalign;\n   61 | auto realloc_ptr = __libc_realloc;\n   62 | auto valloc_ptr = __libc_valloc;\n   63 | auto posix_memalign_ptr = ::posix_memalign;\n   64 | auto malloc_usable_size_ptr = ::malloc_usable_size;","lines":26,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Utils/AllocatorOverride.cpp#L39-L64"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"InterruptableConditionVariable (Windows): when Wait() is called without a timeout (Timeout==nullptr), TimeoutMS is set to 0 instead of INFINITE. WaitOnAddress() with dwMilliseconds=0 returns immediately without waiting (per MSDN). The outer while(true) loop therefore spins at 100% CPU instead of blocking, defeating the entire purpose of the condition variable on Windows builds.","fix":"Change `Timeout ? ... : 0` to `Timeout ? ... : INFINITE`. INFINITE (0xFFFFFFFF) is already defined via the included <synchapi.h>/<winerror.h> in the WIN32 path.","locations":[{"ref":"FEXCore/include/FEXCore/Utils/InterruptableConditionVariable.h:106-109","code":"  106 |       const uint32_t TimeoutMS = Timeout ? Timeout->tv_sec * 1000 + (Timeout->tv_nsec / 1000000) : 0;\n  107 | \n  108 |       // WaitOnAddress returns when the value at `Address` differs from the value at `CompareAddress`.\n  109 |       bool Result = WaitOnAddress(&Mutex, &Desired, 4, TimeoutMS);","lines":4,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/include/FEXCore/Utils/InterruptableConditionVariable.h#L106-L109"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"In CI_FetchRootFS.py FindBestImageFit(), the comparisons 'DistroName == None' and 'DistroVersion == None' on lines 52-57 are dead code and will never be true. The values come from f.readline().strip(), which always returns a str, never None. The intent was probably to treat an empty string as a wildcard match, but '\"\" == None' is always False in Python. As a result, only exact name/version matches accumulate FitRate points from the second condition, and the wildcard/fallback logic is silently broken.","fix":"Replace 'DistroName == None' with 'DistroName == \"\"' (and similarly for DistroVersion) to correctly treat blank lines as wildcards, or use 'not DistroName'.","locations":[{"ref":"Scripts/CI_FetchRootFS.py:52-57","code":"   52 |             if (DistroName == Distro[0] or\n   53 |                 DistroName == None):\n   54 |                 FitRate += 1\n   55 | \n   56 |             if (DistroVersion == Distro[1] or\n   57 |                 DistroVersion == None):","lines":6,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Scripts/CI_FetchRootFS.py#L52-L57"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"mutable_buffer::operator+= uses 'this->Data.size_bytes()' on line 256 instead of 'Current->Data.size_bytes()'. During the while-loop iteration, Current advances through the chain but NumBytes is decremented by this->Data (which never changes). If the chain has buffers of different sizes, the wrong amount is subtracted each iteration, causing incorrect advancement through the buffer chain and potential data corruption in subsequent reads/writes.","fix":"Change 'NumBytes -= Data.size_bytes();' to 'NumBytes -= Current->Data.size_bytes();'.","locations":[{"ref":"Source/Common/Async.h:259","code":"  259 |       NumBytes -= Data.size_bytes();","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Common/Async.h#L259"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"CopyToUser and CopyFromUser on ARM64 return 0 on success (via 'mov x0, 0; ret' in the asm stub).\nHowever, callers in x64/Thread.cpp check the return value against the expected byte count:\n  if (FaultSafeUserMemAccess::CopyToUser(ptr, data, N) != N)  // lines 36, 46, 61\nOn ARM64 the function always returns 0 (success), so 0 != N is always true for N > 0,\ncausing read_ldt and write_default_ldt to always return -EFAULT on ARM64 hosts.\nThe x86 fallback (lines 173-177) correctly returns Size, making the callers work only on x86.","fix":"Either change the ARM64 CopyToUser/CopyFromUser to return Size on success ('mov x0, x2; ret' before zeroing x2, or track size separately), or change the callers to check for 0 (success) rather than expecting the byte-count return.","locations":[{"ref":"Source/Tools/LinuxEmulation/LinuxSyscalls/FaultSafeUserMemAccess.cpp:6-22","code":"    6 | __attribute__((naked)) size_t CopyFromUser(void* Dest, const void* Src, size_t Size) {\n    7 |   __asm volatile(R\"(\n    8 |   // Early exit if a memcpy of size zero.\n    9 |   cbz x2, 2f;\n   10 | \n   11 |   1:\n   12 |   .globl CopyFromUser_FaultInst\n   13 |   CopyFromUser_FaultInst:\n   14 |     ldrb w3, [x1], 1; // <- This line can fault.\n   15 |     strb w3, [x0], 1;\n   16 |     sub x2, x2, 1;\n   17 |     cbnz x2, 1b;\n   18 | 2:\n   19 |     mov x0, 0;\n   20 |     ret;\n   21 |   )\" ::\n   22 |                    : \"memory\");","lines":17,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/LinuxEmulation/LinuxSyscalls/FaultSafeUserMemAccess.cpp#L6-L22"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"SECCOMP_RET_KILL_PROCESS should kill the entire process group with SIGKILL per Linux spec, but in filter\nmode (SECCOMP_SET_MODE_FILTER) the code calls `GetKillSignal()` which returns `CurrentKillSignal`.\n`CurrentKillSignal` defaults to SIGSYS and is only set to SIGKILL in `SetModeStrict` (line 530).\n\nSo when a filter installed via SECCOMP_SET_MODE_FILTER returns SECCOMP_RET_KILL_PROCESS, FEX sends SIGSYS\ninstead of SIGKILL. This gives the process a chance to catch/ignore SIGSYS (via a guest signal handler)\nand continue executing, rather than being unconditionally killed. This differs from Linux kernel behavior\nwhere SECCOMP_RET_KILL_PROCESS always sends SIGKILL.","fix":"In the SECCOMP_RET_KILL_PROCESS case, always use SIGKILL instead of GetKillSignal(). The CurrentKillSignal / GetKillSignal() mechanism is only meaningful for KILL_THREAD. Update the switch arm to hardcode `kill(0, SIGKILL)` directly.","locations":[{"ref":"Source/Tools/LinuxEmulation/LinuxSyscalls/Seccomp/SeccompEmulator.cpp:414-420","code":"  414 |   case SECCOMP_RET_KILL_PROCESS: {\n  415 |     const int KillSignal = GetKillSignal();\n  416 |     // Ignores signal handler and sigmask\n  417 |     uint64_t Mask = 1ULL << (KillSignal - 1);\n  418 |     SignalDelegation->GuestSigProcMask(Thread, SIG_UNBLOCK, &Mask, nullptr);\n  419 |     SignalDelegation->UninstallHostHandler(KillSignal);\n  420 |     kill(0, KillSignal);","lines":7,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/LinuxEmulation/LinuxSyscalls/Seccomp/SeccompEmulator.cpp#L414-L420"},{"ref":"Source/Tools/LinuxEmulation/LinuxSyscalls/Seccomp/SeccompEmulator.h:83","code":"   83 |   int CurrentKillSignal {SIGSYS};","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/LinuxEmulation/LinuxSyscalls/Seccomp/SeccompEmulator.h#L83"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"ChangeProtectionFlags crashes with ERROR_AND_DIE when mprotect spans multiple non-contiguous VMAs\nwhere the first VMA encountered (iterating backwards from Top) is fully contained inside [Base, Top).\n\nThe loop at line 329 breaks when `Current->Base + Current->Length < Top` (VMA ends before Top),\nleaving MappingIter pointing at a VMA with CurrentBase > Base and CurrentTop < Top.\nThe after-loop code at lines 414-535 only handles cases where CurrentTop <= Base (no-op),\nCurrentBase == Base (strategies 1 and 2), or CurrentBase < Base (strategy 3).\nNone of these match the CurrentBase > Base && CurrentTop < Top case, so the else branch calls\nERROR_AND_DIE_FMT at line 534.\n\nReproducer: a guest calls mmap to create [0x10000, 0x20000), then a separate mmap creates\n[0x30000, 0x40000), then calls mprotect([0x00000, 0x50000), PROT_READ). The backwards iteration\nfrom upper_bound(0x50000) lands on [0x30000, 0x40000): CurrentBase(0x30000) > Base(0) and\nCurrentTop(0x40000) < Top(0x50000), so the loop breaks, then the after-loop terminates with ERROR_AND_DIE.\n\nThe fix is to handle the fully-contained case in the loop body (change protection flags and\ncontinue iterating) rather than breaking, or to change the second break condition to\n`CurrentTop <= Base` and add a fully-contained merge strategy to the after-loop code.","fix":"In the loop body, before the strategy-4 comment block, add a third case:\n  if VMA is fully inside the protect range (CurrentBase > Base && CurrentTop <= Top):\n    just set Current->Prot = NewProt and continue the loop\n  else if strategy 4 (CurrentTop > Top): existing code\n\nOr alternatively, remove the second break condition and add a \"fully inside\" strategy to the\nafter-loop dispatch.","locations":[{"ref":"Source/Tools/LinuxEmulation/LinuxSyscalls/SyscallsVMATracking.cpp:329","code":"  329 |     if (Current->Base <= Base || Current->Base + Current->Length < Top) {","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/LinuxEmulation/LinuxSyscalls/SyscallsVMATracking.cpp#L329"},{"ref":"Source/Tools/LinuxEmulation/LinuxSyscalls/SyscallsVMATracking.cpp:533-534","code":"  533 |   } else {\n  534 |     ERROR_AND_DIE_FMT(\"Unexpected {} Merge strategy! [0x{:x}, 0x{:x}) Versus [0x{:x}, 0x{:x})\\n\", __func__, CurrentBase, CurrentTop, Base, Top);","lines":2,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/LinuxEmulation/LinuxSyscalls/SyscallsVMATracking.cpp#L533-L534"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"VMA resource linked-list corrupted in ChangeProtectionFlags merge strategy 3 (after-loop, HasTailData case).\n\nMerge strategy 3 (CurrentBase < Base && CurrentTop >= Top) in the after-loop code first inserts a\nMiddleVMA at address Base with ListInsertAfter(Current, &MiddleVMA). This call modifies\n`Current->ResourceNextVMA` to point to &MiddleVMA.\n\nThen, if HasTailData (CurrentTop > Top), a TailVMA is inserted at Top with:\n  ResourcePrevVMA = Current  (should be &MiddleVMA, the just-inserted node)\n  ResourceNextVMA = Current->ResourceNextVMA  (now points to &MiddleVMA, not the original next!)\n\nListInsertAfter(Current, &TailVMA) is then called. The assertions pass because TailVMA->ResourcePrevVMA\n== Current and TailVMA->ResourceNextVMA == Current->ResourceNextVMA (which is &MiddleVMA). However\nListInsertAfter then sets Current->ResourceNextVMA = &TailVMA, overwriting the pointer to MiddleVMA.\n\nThe resulting list order is: Current -> TailVMA -> (whatever MiddleVMA pointed to next)\nwhile MiddleVMA is orphaned (it still has its own ResourceNextVMA but nobody points to it).\n\nThis causes SMC tracking to miss shared-mapping mirrors and can lead to incorrect code cache\ninvalidation after an mprotect that splits a VMA into three parts.","fix":"Capture the MiddleVMA iterator before its inner scope ends, then use it for the tail insert:\n\n  VMAEntry* MiddleVMAPtr = nullptr;\n  {\n    auto [Iter, Inserted] = VMAs.emplace(Base, ...);\n    // ...\n    if (Current->Resource) ListInsertAfter(Current, &Iter->second);\n    MiddleVMAPtr = &Iter->second;\n  }\n\n  if (HasTailData) {\n    auto OriginalNext = MiddleVMAPtr->ResourceNextVMA;\n    auto [Iter, Inserted] = VMAs.emplace(Top, VMAEntry {\n      .ResourcePrevVMA = MiddleVMAPtr,\n      .ResourceNextVMA = OriginalNext, ...});\n    if (Current->Resource) ListInsertAfter(MiddleVMAPtr, &Iter->second);\n  }","locations":[{"ref":"Source/Tools/LinuxEmulation/LinuxSyscalls/SyscallsVMATracking.cpp:486-502","code":"  486 |       auto [Iter, Inserted] = VMAs.emplace(Base, VMAEntry {.Resource = Current->Resource,\n  487 |                                                            .ResourcePrevVMA = Current,\n  488 |                                                            .ResourceNextVMA = Current->ResourceNextVMA,\n  489 |                                                            .Base = Base,\n  490 |                                                            .Offset = NewOffset,\n  491 |                                                            .Length = NewLength,\n  492 |                                                            .Flags = CurrentFlags,\n  493 |                                                            .Prot = NewProt});\n  494 | \n  495 |       if (!Inserted) [[unlikely]] {\n  496 |         // We can't recover from this.\n  497 |         // Shouldn't ever happen.\n  498 |         ERROR_AND_DIE_FMT(\"{}:{}: VMA tracking error\", __func__, __LINE__);\n  499 |       }\n  500 | \n  501 |       if (Current->Resource) {\n  502 |         ListInsertAfter(Current, &Iter->second);","lines":17,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/LinuxEmulation/LinuxSyscalls/SyscallsVMATracking.cpp#L486-L502"},{"ref":"Source/Tools/LinuxEmulation/LinuxSyscalls/SyscallsVMATracking.cpp:514-530","code":"  514 |       auto [Iter, Inserted] = VMAs.emplace(Top, VMAEntry {.Resource = Current->Resource,\n  515 |                                                           .ResourcePrevVMA = Current,\n  516 |                                                           .ResourceNextVMA = Current->ResourceNextVMA,\n  517 |                                                           .Base = Top,\n  518 |                                                           .Offset = NewOffset,\n  519 |
