xpected;\n  489 | \n  490 |         // Set up desired\n  491 |         TmpDesired = TmpExpected;\n  492 |         TmpDesired &= NegMask;\n  493 |         TmpDesired |= Desired;\n  494 | \n  495 |         bool CASResult = Atomic128.compare_exchange_strong(TmpExpected, TmpDesired);\n  496 |         if (CASResult) {\n  497 |           // Successful, so we are done\n  498 |           return true;\n  499 |         } else {\n  500 |           // Not successful\n  501 |           // Now we need to check the results to see if we need to try again\n  502 |           __uint128_t FailedResultOurBits = TmpExpected & Mask;\n  503 |           __uint128_t FailedResultNotOurBits = TmpExpected & NegMask;\n  504 | \n  505 |           __uint128_t FailedDesiredNotOurBits = TmpDesired & NegMask;\n  506 |           if ((FailedResultNotOurBits ^ FailedDesiredNotOurBits) != 0) {\n  507 |             // If the bits changed that weren't part of our regular CAS then we need to try again\n  508 |             continue;\n  509 |           }\n  510 | \n  511 |           // This happens in the case that between Load and CAS that something has store our desired in to the memory location\n  512 |           // This means our CAS fails because what we wanted to store was already stored\n  513 |           uint64_t FailedResult = FailedResultOurBits >> (Alignment * 8);\n  514 |           GPRs[ExpectedReg1] = FailedResult & ~0U;\n  515 |           GPRs[ExpectedReg2] = FailedResult >> 32;\n  516 |           return true;\n  517 |         }\n  518 |       }\n  519 |     }\n  520 |   }\n  521 |   return false;\n  522 | }","lines":185,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/Source/Utils/ArchHelpers/Arm64.cpp#L338-L522"}]},
{"id":"LOGIC_61","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Event destructor calls NotifyAll() without waiting for all waiters to fully exit. After NotifyAll() sends the notification and the destructor returns, the Event object (including its std::mutex and std::condition_variable members) is destroyed. A waiting thread woken by notify_all() re-acquires the mutex inside std::condition_variable::wait() before checking the predicate and returning. If the event owner destroys the Event between notify_all() and the waiter re-acquiring the mutex, the waiter accesses a destroyed mutex, which is undefined behavior per the C++ standard.","fix":"Remove NotifyAll() from the destructor, or add a mechanism (e.g., an atomic waiter count) so that the destructor can wait until all threads have left Wait() before destroying the object. Alternatively, document that the Event must outlive all threads that may call Wait().","locations":[{"ref":"FEXCore/include/FEXCore/Utils/Event.h:28-30","code":"   28 |   ~Event() {\n   29 |     NotifyAll();\n   30 |   }","lines":3,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/include/FEXCore/Utils/Event.h#L28-L30"}]},
{"id":"LOGIC_62","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"ForkableUniqueMutex::check_lock_owned_by_self() calls pthread_mutex_lock() on a PTHREAD_MUTEX_INITIALIZER (normal/default) mutex and expects EDEADLK to be returned. EDEADLK is only returned by PTHREAD_MUTEX_ERRORCHECK type mutexes. On a normal mutex the second pthread_mutex_lock() from the same thread will deadlock (infinite block) rather than returning EDEADLK. The function therefore hangs instead of detecting the precondition violation. The same issue applies to ForkableSharedMutex::check_lock_owned_by_self_as_write() with pthread_rwlock_wrlock(). These are called from production code in SyscallsVMATracking.cpp.","fix":"Initialize Mutex with a PTHREAD_MUTEX_ERRORCHECK type: use pthread_mutex_init(&Mutex, ...) with a pthread_mutexattr_t set to PTHREAD_MUTEX_ERRORCHECK. Alternatively, replace these functions with a try_lock-based check: `bool got_it = (pthread_mutex_trylock(&Mutex) == 0); LOGMAN_THROW_A_FMT(!got_it, ...); if (got_it) pthread_mutex_unlock(&Mutex);`.","locations":[{"ref":"FEXCore/include/FEXCore/Utils/SignalScopeGuards.h:52-55","code":"   52 |   void check_lock_owned_by_self() {\n   53 |     const auto Result = pthread_mutex_lock(&Mutex);\n   54 |     LOGMAN_THROW_A_FMT(Result == EDEADLK, \"User of unique lock must have already locked mutex as write!\");\n   55 |   }","lines":4,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/include/FEXCore/Utils/SignalScopeGuards.h#L52-L55"},{"ref":"FEXCore/include/FEXCore/Utils/SignalScopeGuards.h:100-103","code":"  100 |   void check_lock_owned_by_self_as_write() {\n  101 |     const auto Result = pthread_rwlock_wrlock(&Mutex);\n  102 |     LOGMAN_THROW_A_FMT(Result == EDEADLK, \"User of rwlock must have already locked mutex as write!\");\n  103 |   }","lines":4,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXCore/include/FEXCore/Utils/SignalScopeGuards.h#L100-L103"}]},
{"id":"LOGIC_63","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In Filesystem.h sendfile() call (line 219), the return value is compared to buf.st_size which is of type off_t (signed). sendfile() returns ssize_t (signed). If the file is larger than SSIZE_MAX the size comparison is between a negative ssize_t and a positive off_t, which would incorrectly indicate failure even on success. Additionally, sendfile() is not guaranteed to transfer all bytes in one call on all kernel versions - a short transfer is not an error, requiring a retry loop.","fix":"Use a loop that calls sendfile() until all bytes are transferred or an error occurs, checking for partial transfers (return value > 0 but < requested). Also handle the EINTR case.","locations":[{"ref":"FEXHeaderUtils/FEXHeaderUtils/Filesystem.h:219","code":"  219 |     bool Result = sendfile(DestinationFD, SourceFD, nullptr, buf.st_size) == buf.st_size;","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXHeaderUtils/FEXHeaderUtils/Filesystem.h#L219"}]},
{"id":"LOGIC_64","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In Filesystem.h CopyFile() (Linux branch), when Options == CopyOptions::NONE and the destination does not exist, the function calls rename() to move the source file to the destination (line 227). This destroys the source file, which is unexpected behavior for a 'copy' operation with no options. If the caller still needs the source after the call, it is silently gone.","fix":"For CopyOptions::NONE with no existing destination, use sendfile (or open/read/write) instead of rename, consistent with the OVERWRITE_EXISTING branch above. The current rename-based path is a functional bug that destroys the source.","locations":[{"ref":"FEXHeaderUtils/FEXHeaderUtils/Filesystem.h:225-228","code":"  225 |   if (!DestExists) {\n  226 |     // If the destination doesn't exist then just use rename.\n  227 |     return rename(From.c_str(), To.c_str()) == 0;\n  228 |   }","lines":4,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXHeaderUtils/FEXHeaderUtils/Filesystem.h#L225-L228"}]},
{"id":"LOGIC_65","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In Filesystem.h LexicallyNormal(), the alloca-based buffer size is computed as '(sizeof(std::string_view) + sizeof(void*) * 2) * (SeparatorCount + 2)'. std::pmr::list nodes contain more than just a string_view and two pointers - they also include allocator bookkeeping and alignment padding. On most implementations a std::pmr::list node is 48-64 bytes, not sizeof(string_view)+16. If the fixed_size_monotonic_buffer_resource runs out of space it falls back to the upstream allocator (heap), which works correctly but defeats the stack-allocation optimization and may cause unexpected heap allocations in a hot path.","fix":"Use a larger safety multiplier or query the actual node size via std::pmr::polymorphic_allocator::resource()->do_allocate to size the buffer correctly. Alternatively, use a std::pmr::vector<std::string_view> instead of list, since only push_back/erase-at-iterator is needed, and the node size is exactly sizeof(string_view).","locations":[{"ref":"FEXHeaderUtils/FEXHeaderUtils/Filesystem.h:250-254","code":"  250 |   size_t DataSize = (sizeof(std::string_view) + sizeof(void*) * 2) * (SeparatorCount + 2);\n  251 |   void* Data = alloca(DataSize);\n  252 |   fextl::pmr::fixed_size_monotonic_buffer_resource mbr(Data, DataSize);\n  253 |   std::pmr::polymorphic_allocator<std::byte> pa {&mbr};\n  254 |   std::pmr::list<std::string_view> Parts {pa};","lines":5,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/FEXHeaderUtils/FEXHeaderUtils/Filesystem.h#L250-L254"}]},
{"id":"LOGIC_66","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In CI_FetchRootFS.py main(), if sys.version_info[0] < 3, the code calls 'logging.critical(...)' but the 'logging' module is never imported. The script imports 'os', 'shutil', 'subprocess', 'sys', and 'xxhash', but not 'logging'. This guard would raise a NameError instead of printing the intended error message. The same pattern repeats in several other scripts (GenerateSyscallNumbers.py, InstructionCountParser.py, etc.) where the version guard calls logging.critical without importing logging.","fix":"Either add 'import logging' to CI_FetchRootFS.py, or replace 'logging.critical(...)' with 'print(..., file=sys.stderr); sys.exit(1)' since logging is not set up at that point anyway.","locations":[{"ref":"Scripts/CI_FetchRootFS.py:162-163","code":"  162 |     if sys.version_info[0] < 3:\n  163 |         logging.critical (\"Python 3 or a more recent version is required.\")","lines":2,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Scripts/CI_FetchRootFS.py#L162-L163"},{"ref":"Scripts/GenerateSyscallNumbers.py:265-266","code":"  265 |     if sys.version_info[0] < 3:\n  266 |         logging.critical (\"Python 3 or a more recent version is required.\")","lines":2,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Scripts/GenerateSyscallNumbers.py#L265-L266"},{"ref":"Scripts/InstructionCountParser.py:235","code":"  235 |         logging.critical (\"Python 3 or a more recent version is required.\")","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Scripts/InstructionCountParser.py#L235"},{"ref":"Scripts/UpdateInstructionCountJson.py:42-43","code":"   42 |     if sys.version_info[0] < 3:\n   43 |         logging.critical (\"Python 3 or a more recent version is required.\")","lines":2,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Scripts/UpdateInstructionCountJson.py#L42-L43"},{"ref":"Scripts/StructPackVerifier.py:611-612","code":"  611 |     if sys.version_info[0] < 3:\n  612 |         logging.critical (\"Python 3 or a more recent version is required.\")","lines":2,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Scripts/StructPackVerifier.py#L611-L612"}]},
{"id":"LOGIC_67","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In DefinitionExtract.py HandleStructElements(), when a child has kind ANNOTATE_ATTR and spelling 'fex-match', the code sets 'Struct.ExpectedFEXMatch = True' (line 366). The StructDefinition class defines the field as 'ExpectFEXMatch' (line 78), not 'ExpectedFEXMatch'. This silently creates a new attribute rather than setting the intended flag, so fex-match annotations on struct elements are ignored. The same bug exists at line 366. StructPackVerifier.py uses the correct field name 'Struct.ExpectFEXMatch = True' on line 339.","fix":"Change 'Struct.ExpectedFEXMatch = True' to 'Struct.ExpectFEXMatch = True'.","locations":[{"ref":"Scripts/DefinitionExtract.py:366","code":"  366 |                 Struct.ExpectedFEXMatch = True","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Scripts/DefinitionExtract.py#L366"}]},
{"id":"LOGIC_68","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In DefinitionExtract.py HandleTypeDefDecl(), the first 'elif' branch checks 'Child.kind == CursorKind.UNION_DECL' on line 428, but that same condition is also the very first 'if' branch on line 427 (which does 'pass'). The second UNION_DECL check (line 432) is therefore unreachable dead code - it can never be entered because the first identical condition already matched and did 'pass'. This same copy-paste error appears identically in StructPackVerifier.py HandleTypeDefDecl() at lines 400-405.","fix":"Remove the first 'if Child.kind == CursorKind.UNION_DECL: pass' branch and make the second one the primary 'if' branch, so the union case is actually handled by calling HandleUnionDeclCursor.","locations":[{"ref":"Scripts/DefinitionExtract.py:427-432","code":"  427 |         if (Child.kind == CursorKind.UNION_DECL):\n  428 |             pass\n  429 |         elif (Child.kind == CursorKind.STRUCT_DECL):\n  430 |             Arch = HandleStructDeclCursor(Arch, Child, Name)\n  431 |         elif (Child.kind == CursorKind.UNION_DECL):\n  432 |             Arch = HandleUnionDeclCursor(Arch, Child, Name)","lines":6,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Scripts/DefinitionExtract.py#L427-L432"},{"ref":"Scripts/StructPackVerifier.py:400-405","code":"  400 |         if (Child.kind == CursorKind.UNION_DECL):\n  401 |             pass\n  402 |         elif (Child.kind == CursorKind.STRUCT_DECL):\n  403 |             Arch = HandleStructDeclCursor(Arch, Child, Name)\n  404 |         elif (Child.kind == CursorKind.UNION_DECL):\n  405 |             Arch = HandleUnionDeclCursor(Arch, Child, Name)","lines":6,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Scripts/StructPackVerifier.py#L400-L405"}]},
{"id":"LOGIC_69","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In DefinitionExtract.py HandleCursor(), when Cursor.kind.is_invalid() is True, the function accesses the global 'TU' (line 446: 'Diags = TU.diagnostics') which is a local variable in GetDB(), not a module-level global. This would raise NameError at runtime. The same bug exists in StructPackVerifier.py HandleCursor() at line 419.","fix":"Pass 'TU' as a parameter to HandleCursor, or store it as a module-level global or as part of Arch (Arch.TU is already set). Use 'Arch.TU.diagnostics' instead of 'TU.diagnostics'.","locations":[{"ref":"Scripts/DefinitionExtract.py:444-451","code":"  444 | def HandleCursor(Arch, Cursor):\n  445 |     if (Cursor.kind.is_invalid()):\n  446 |         Diags = TU.diagnostics\n  447 |         for Diag in Diags:\n  448 |             logging.warning (Diag.format())\n  449 | \n  450 |         Arch.Parsed = False\n  451 |         return","lines":8,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Scripts/DefinitionExtract.py#L444-L451"},{"ref":"Scripts/StructPackVerifier.py:417-424","code":"  417 | def HandleCursor(Arch, Cursor):\n  418 |     if (Cursor.kind.is_invalid()):\n  419 |         Diags = TU.diagnostics\n  420 |         for Diag in Diags:\n  421 |             logging.warning (Diag.format())\n  422 | \n  423 |         Arch.Parsed = False\n  424 |         return","lines":8,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Scripts/StructPackVerifier.py#L417-L424"}]},
{"id":"LOGIC_70","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In InstallFEX.py, the function InstallPackages is defined twice: once at line 211 (taking 'PackagesToInstall') and once at line 265 (taking 'Packages'). The second definition silently shadows the first. The function called by CheckAndInstallPackageUpdates at line 252 is the first definition, but after Python processes the module the name 'InstallPackages' refers to the second definition. Any subsequent call to InstallPackages (e.g. at line 401) uses the second definition. Since both implementations do the same thing (run apt-get install), this is currently harmless but indicates a copy-paste error.","fix":"Remove the duplicate definition at line 211 (the first 'InstallPackages' that takes 'PackagesToInstall' and prints 'Packages updated'/'failed to update') and keep only the second definition which is more informative.","locations":[{"ref":"Scripts/InstallFEX.py:211-226","code":"  211 | def InstallPackages(PackagesToInstall):\n  212 |     DidInstall = False\n  213 |     try:\n  214 |         CmdResult = subprocess.run([\"sudo\", \"apt-get\", \"-y\", \"install\"] + PackagesToInstall)\n  215 |         DidInstall = CmdResult.returncode == 0\n  216 |     except KeyboardInterrupt:\n  217 |         print (\"Keyboard interrupt\")\n  218 |         DidInstall = False\n  219 |         pass\n  220 | \n  221 |     if DidInstall:\n  222 |         print(\"Packages updated\")\n  223 |     else:\n  224 |         print(\"Packages failed to update\")\n  225 | \n  226 |     return DidInstall","lines":16,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Scripts/InstallFEX.py#L211-L226"},{"ref":"Scripts/InstallFEX.py:265-282","code":"  265 | def InstallPackages(Packages):\n  266 |     print(\"Installing packages: {}\".format(Packages))\n  267 | \n  268 |     DidInstall = False\n  269 |     try:\n  270 |         CmdResult = subprocess.run([\"sudo\", \"apt-get\", \"-y\", \"install\"] + Packages)\n  271 |         DidInstall = CmdResult.returncode == 0\n  272 |     except KeyboardInterrupt:\n  273 |         print (\"Keyboard interrupt\")\n  274 |         DidInstall = False\n  275 |         pass\n  276 | \n  277 |     if DidInstall:\n  278 |         print(\"Packages installed\")\n  279 |     else:\n  280 |         print(\"Packages failed to install\")\n  281 | \n  282 |     return DidInstall","lines":18,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Scripts/InstallFEX.py#L265-L282"}]},
{"id":"LOGIC_71","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In NeedDisabledSVE.py, the set-addition idiom 'cpuinfo += {tuple([current_implementer, current_part])}' (line 51) is used, but 'cpuinfo' is a list (initialized as '[]' on line 40). Adding a set to a list with '+=' is equivalent to 'cpuinfo.extend(set_items)', which works but silently converts the set to a sequence. This same pattern appears in aarch64_fit_native.py line 126. The same code in NeedDisabledSVE.py also has a subtler issue: if two CPU cores share the same (implementer, part) tuple the tuple is added multiple times to the list, so 'for core in cpuinfo' might check the same tuple multiple times. This is harmless but inconsistent with intent (which appears to be a set of unique core IDs).","fix":"Initialize cpuinfo as a set: 'cpuinfo = set()' and use 'cpuinfo.add(tuple([...]))' for deduplication, or keep it as a list but document the intent.","locations":[{"ref":"Scripts/NeedDisabledSVE.py:51","code":"   51 |                 cpuinfo += {tuple([current_implementer, current_part])}","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Scripts/NeedDisabledSVE.py#L51"},{"ref":"Scripts/aarch64_fit_native.py:134","code":"  134 |             cpuinfo += {tuple([current_implementer, current_part])}","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Scripts/aarch64_fit_native.py#L134"}]},
{"id":"LOGIC_72","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In Threaded_Lockstep_Runner.py, 'MaxRunnerSlots' is computed as 'min(32, multiprocessing.cpu_count() / 2)'. In Python 3, '/' is true division and returns a float (e.g. 4.0 on an 8-core machine). The subsequent 'if RunnerSlot == MaxRunnerSlots' comparison then compares an int to a float, which works coincidentally in CPython but is conceptually wrong and would fail if MaxRunnerSlots were ever used as an index or slice. More importantly, 'RunnerSlots = [None] * MaxRunnerSlots' on line 71 would raise TypeError if MaxRunnerSlots is a float (it actually does since list replication requires an integer).","fix":"Use integer division: 'MaxRunnerSlots = min(32, multiprocessing.cpu_count() // 2)'.","locations":[{"ref":"Scripts/Threaded_Lockstep_Runner.py:70-71","code":"   70 | MaxRunnerSlots = min(32, multiprocessing.cpu_count() / 2)\n   71 | RunnerSlots = [None] * MaxRunnerSlots","lines":2,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Scripts/Threaded_Lockstep_Runner.py#L70-L71"}]},
{"id":"LOGIC_73","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In json_ir_config_parse.py, when processing config lines the code checks 'if (line[0] != ';')' on line 23, but at that point 'line' has already had its leading/trailing whitespace stripped by 'line.strip()'. If the original config contains a blank line between CONFIG and endif, strip() produces an empty string and line[0] raises IndexError.","fix":"Add a check for empty lines before accessing line[0]: 'if not line: continue' before the semicolon check.","locations":[{"ref":"Scripts/json_ir_config_parse.py:22-23","code":"   22 |                 if (line[0] != ';'):\n   23 |                     sys.exit(\"Config line needs to start with a comment character ;\")","lines":2,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Scripts/json_ir_config_parse.py#L22-L23"}]},
{"id":"LOGIC_74","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In Async.h run_one(), the loop iterates PollFDs checking revents, and uses 'if (Result-- == 0) break;' to stop after processing all ready FDs. However, the check is done AFTER the revents != 0 guard, so if revents is non-zero but Result reaches 0 at that FD, processing stops correctly. But if a FD reports both POLLIN and POLLHUP simultaneously, both branches execute (lines 133 and 155). In the POLLIN branch the callback is consumed from the map via std::move; then in the POLLHUP branch a second std::move(callbacks[fd]) retrieves an empty/moved-from function and calls it with error::eof - which is a null callback call. The Callback null check in the POLLHUP branch prevents a crash but silently drops the EOF notification.","fix":"After handling POLLIN, clear revents or use else-if so that POLLHUP is only checked if POLLIN was not also handled. Alternatively, merge both conditions into a single callback invocation.","locations":[{"ref":"Source/Common/Async.h:136-165","code":"  136 |           if (ActiveFD.revents & POLLIN) {\n  137 |             // NOTE: For sockets, this is triggered on close, too. Pipes only report POLLHUP, however.\n  138 |             CurrentFD = ActiveFD.fd;\n  139 | \n  140 |             auto Callback = std::move(callbacks[ActiveFD.fd]);\n  141 |             if (!Callback) {\n  142 |               ERROR_AND_DIE_FMT(\"Data available for reading on FD {} but no read callback registered\", ActiveFD.fd);\n  143 |             }\n  144 |             auto Ret = Callback(error::success);\n  145 |             if (Ret == post_callback::repeat) {\n  146 |               callbacks[ActiveFD.fd] = std::move(Callback);\n  147 |             } else if (Ret == post_callback::drop) {\n  148 |               // If no new callback was registered, drop the FD from the list and skip any remaining events\n  149 |               if (!callbacks.contains(ActiveFD.fd)) {\n  150 |                 QueuedEvents.push_back(Event {.FD = {.fd = ActiveFD.fd}, .Erase = true});\n  151 |                 ActiveFD.revents = 0;\n  152 |               }\n  153 |             } else if (Ret == post_callback::stop_reactor) {\n  154 |               is_stopped = true;\n  155 |             }\n  156 |             CurrentFD.reset();\n  157 |           }\n  158 |           if (ActiveFD.revents & (POLLHUP | POLLERR | POLLNVAL | POLLRDHUP)) {\n  159 |             auto Callback = std::move(callbacks[ActiveFD.fd]);\n  160 |             if (Callback) {\n  161 |               is_stopped |= (Callback(error::eof) == post_callback::stop_reactor);\n  162 |             }\n  163 |             // Error or hangup, erase the socket from our list\n  164 |             QueuedEvents.push_back(Event {.FD = {.fd = ActiveFD.fd}, .Erase = true});\n  165 |           }","lines":30,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Common/Async.h#L136-L165"}]},
{"id":"LOGIC_75","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"mutable_buffer::operator+= returns '*Current' (a reference to the node found in the chain), but the method is declared to return 'mutable_buffer&'. After '*this = *Current' the local 'this' object has already been updated to hold Current's data. The returned reference is to the node inside the chain (which may be this object itself after the copy), which is confusing. More importantly, the caller receives a reference to the found node rather than to *this, making the semantics inconsistent with typical operator+= which should return *this.","fix":"Return '*this' instead of '*Current'.","locations":[{"ref":"Source/Common/Async.h:267","code":"  267 |     return *Current;","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Common/Async.h#L267"}]},
{"id":"LOGIC_76","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In FindUserHomeThroughUID (Config.cpp), the /etc/passwd field parsing skips one too many fields before reading uid. The format is 'name:password:uid:gid:comment:home:shell'. After the three initial increments the iterator points at index 3 (gid), not index 2 (uid). The comment '// comment' on the third increment is wrong - that third advance skips uid. So uid_s reads the gid field as if it were uid, and the comparison 'element_uid == uid' will never match for most users, silently falling back to an empty home directory.","fix":"Remove one of the three pre-uid increments. The correct sequence is: skip name (++iter), skip password (++iter), then read uid_s = *iter, then ++iter to advance past uid, then skip gid (++iter), then read home_s = *iter.","locations":[{"ref":"Source/Common/Config.cpp:551-560","code":"  551 |     auto iter = elements.begin();\n  552 |     ++iter; // name\n  553 |     ++iter; // password hash\n  554 |     ++iter; // comment\n  555 |     // uid\n  556 |     const auto uid_s = *iter;\n  557 |     ++iter;\n  558 |     ++iter; // gid\n  559 |     // home\n  560 |     const auto home_s = *iter;","lines":10,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Common/Config.cpp#L551-L560"}]},
{"id":"LOGIC_77","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In SHMStats.cpp AllocateSlot(), the free-slot search loop iterates up to TotalSlotsFromSize() entries but if all slots are occupied (which shouldn't happen since RemainingSlots is checked first, but AllocateMoreSlots may fail partway), AllocatedSlot will be left pointing to the last Stats entry (which is occupied with TID != 0). The loop has no sentinel for 'not found': if a free slot genuinely isn't found, it falls through and proceeds to use the last iterated slot regardless. This could corrupt an in-use slot.","fix":"Add a 'found' flag or check AllocatedSlot->TID after the loop, and return nullptr if no free slot was found.","locations":[{"ref":"Source/Common/SHMStats.cpp:52-58","code":"   52 |   FEXCore::SHMStats::ThreadStats* AllocatedSlot {};\n   53 |   for (size_t i = 0; i < TotalSlotsFromSize(); ++i) {\n   54 |     AllocatedSlot = &Stats[i];\n   55 |     if (AllocatedSlot->TID.load(std::memory_order_relaxed) == 0) {\n   56 |       break;\n   57 |     }\n   58 |   }","lines":7,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Common/SHMStats.cpp#L52-L58"}]},
{"id":"LOGIC_78","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"ELFContainer::WriteLoadableSections() calls RawFile.at(hdr->p_offset) for both\nPT_LOAD and PT_TLS segments, but p_offset is an untrusted value from the ELF\nheader. There is no check that p_offset + p_filesz <= RawFile.size(). The\nat() guards only against p_offset itself being out of range; reading p_filesz\nbytes starting there can extend past the end of the vector.","fix":"Verify hdr->p_offset + hdr->p_filesz <= RawFile.size() before calling Writer.","locations":[{"ref":"Source/Tools/CommonTools/Linux/Utils/ELFContainer.cpp:261","code":"  261 |         Writer(&RawFile.at(hdr->p_offset), Offset + hdr->p_paddr, hdr->p_filesz);","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/CommonTools/Linux/Utils/ELFContainer.cpp#L261"},{"ref":"Source/Tools/CommonTools/Linux/Utils/ELFContainer.cpp:265","code":"  265 |         Writer(&RawFile.at(hdr->p_offset), Offset + hdr->p_paddr, hdr->p_filesz);","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/CommonTools/Linux/Utils/ELFContainer.cpp#L265"},{"ref":"Source/Tools/CommonTools/Linux/Utils/ELFContainer.cpp:272","code":"  272 |         Writer(&RawFile.at(hdr->p_offset), Offset + hdr->p_paddr, hdr->p_filesz);","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/CommonTools/Linux/Utils/ELFContainer.cpp#L272"},{"ref":"Source/Tools/CommonTools/Linux/Utils/ELFContainer.cpp:275","code":"  275 |       if (hdr->p_type == PT_TLS) {","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/CommonTools/Linux/Utils/ELFContainer.cpp#L275"}]},
{"id":"LOGIC_79","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"ELFContainer::CalculateSymbols() accesses SectionHeaders.at(Header._32.e_shstrndx)\nand SectionHeaders.at(Header._64.e_shstrndx) without checking that e_shstrndx\nis within the range [0, SectionHeaders.size()). Per the ELF spec e_shstrndx may\nequal SHN_XINDEX (0xffff) in which case the real index is stored in section 0's\nsh_link; no such handling is present. An out-of-range e_shstrndx causes\nstd::vector::at() to throw, crashing the process.","fix":"Validate e_shstrndx < SectionHeaders.size() (and handle SHN_XINDEX) before calling SectionHeaders.at().","locations":[{"ref":"Source/Tools/CommonTools/Linux/Utils/ELFContainer.cpp:455","code":"  455 |     const Elf32_Shdr* StrHeader = SectionHeaders.at(Header._32.e_shstrndx)._32;","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/CommonTools/Linux/Utils/ELFContainer.cpp#L455"},{"ref":"Source/Tools/CommonTools/Linux/Utils/ELFContainer.cpp:579","code":"  579 |     const Elf64_Shdr* StrHeader = SectionHeaders.at(Header._64.e_shstrndx)._64;","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/CommonTools/Linux/Utils/ELFContainer.cpp#L579"}]},
{"id":"LOGIC_80","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"ELFContainer::CalculateSymbols() (both 32-bit and 64-bit branches): the\n.eh_frame_hdr unwind table calculation uses\n`uintptr_t Entry = (uintptr_t)(Table[f].pc + hdr->sh_offset)`.\nTable[f].pc is a signed 32-bit PC-relative offset from the start of the\ntable entry; hdr->sh_offset is the file offset of the section. The correct\ncomputation for the VA of a PC-relative address would be relative to the\nposition of the entry in the file/memory, not just added to sh_offset.\nMixing a relative displacement with a file offset produces wrong unwind\nentry addresses, which will cause the AOT generator to seed incorrect\nbranch targets.","fix":"The entry address should be the VA of the table entry plus the pc field:\n  uintptr_t EntryVA = hdr->sh_addr + 12 + f * sizeof(entry);\n  uintptr_t Target = EntryVA + Table[f].pc;","locations":[{"ref":"Source/Tools/CommonTools/Linux/Utils/ELFContainer.cpp:477","code":"  477 |             uintptr_t Entry = (uintptr_t)(Table[f].pc + hdr->sh_offset);","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/CommonTools/Linux/Utils/ELFContainer.cpp#L477"},{"ref":"Source/Tools/CommonTools/Linux/Utils/ELFContainer.cpp:601","code":"  601 |             uintptr_t Entry = (uintptr_t)(Table[f].pc + hdr->sh_offset);","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/CommonTools/Linux/Utils/ELFContainer.cpp#L601"}]},
{"id":"LOGIC_81","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"ELFContainer::HasTLS() checks TLSHeader._64 != nullptr regardless of the ELF\nmode. For a 32-bit ELF the relevant field is TLSHeader._32, not _64. Since\nboth pointers live in a union, TLSHeader._32 and TLSHeader._64 have the same\naddress and size on a 64-bit host, so the check works accidentally - but only\nbecause the pointers are the same word. This is still a semantic bug: if the\nhost were 32-bit (or the union layout changed), a 32-bit ELF with a TLS\nsegment whose pointer happened to truncate differently could give wrong results.\nGetTLSBase() correctly checks GetMode(), but HasTLS() does not.","fix":"Check TLSHeader._32 or _64 depending on Mode, mirroring the GetTLSBase() pattern.","locations":[{"ref":"Source/Tools/CommonTools/Linux/Utils/ELFContainer.h:106-108","code":"  106 |   bool HasTLS() const {\n  107 |     return TLSHeader._64 != nullptr;\n  108 |   }","lines":3,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/CommonTools/Linux/Utils/ELFContainer.h#L106-L108"}]},
{"id":"LOGIC_82","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"ELFParser::ReadElf() bounds-checks `ehdr.e_phoff` against the file size but\nuses a 16-bit e_phnum cap: `ehdr.e_phnum > 65536 / ehdr.e_phentsize`. For a\n64-bit ELF e_phentsize == 56, so the cap is 1170. For a 32-bit ELF it is 2048.\nThis is a very high (and oddly derived) upper bound; legitimate ELFs never have\nmore than a few dozen program headers. More importantly, for the 32-bit\nconversion path the read is `sizeof(Elf32_Phdr) * ehdr.e_phnum` bytes, but the\nprior bounds check used `ehdr.e_phentsize * ehdr.e_phnum`. If the malformed\n32-bit ELF has e_phentsize set to something other than sizeof(Elf32_Phdr) (the\ncheck at line 85 catches this), the two quantities would diverge. The check at\nline 85 catches the mismatch, but the relationship between the bounds check and\nthe actual read size is implicit and fragile.","fix":"Use sizeof(Elf32_Phdr)/sizeof(Elf64_Phdr) directly in the bounds check instead of e_phentsize, since e_phentsize equality has already been verified.","locations":[{"ref":"Source/Tools/CommonTools/Linux/Utils/ELFParser.h:150-158","code":"  150 |     if (ehdr.e_phnum < 1 || ehdr.e_phnum > 65536 / ehdr.e_phentsize) {\n  151 |       LogMan::Msg::EFmt(\"Too many program headers '{}'\", fd);\n  152 |       return false;\n  153 |     }\n  154 | \n  155 |     // sanity check program header offset size.\n  156 |     if (ehdr.e_phoff > Size || (ehdr.e_phentsize * ehdr.e_phnum) > (Size - ehdr.e_phoff)) {\n  157 |       LogMan::Msg::EFmt(\"Program headers exceeds size of program\");\n  158 |       return false;","lines":9,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/CommonTools/Linux/Utils/ELFParser.h#L150-L158"},{"ref":"Source/Tools/CommonTools/Linux/Utils/ELFParser.h:162-167","code":"  162 |       fextl::vector<Elf32_Phdr> phdrs32(ehdr.e_phnum);\n  163 | \n  164 |       if (pread(fd, phdrs32.data(), sizeof(Elf32_Phdr) * ehdr.e_phnum, ehdr.e_phoff) == -1) {\n  165 |         LogMan::Msg::EFmt(\"Failed to read phdr32 from '{}'\", fd);\n  166 |         return false;\n  167 |       }","lines":6,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/CommonTools/Linux/Utils/ELFParser.h#L162-L167"}]},
{"id":"LOGIC_83","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"ELFParser::EnsureSectionHeadersLoaded() reads section headers without\nvalidating that ehdr.e_shoff + ehdr.e_shnum * sizeof(Elf64_Shdr/Elf32_Shdr)\ndoes not exceed the file size. A malformed ELF with a large e_shoff or e_shnum\nwill cause pread to return -1 (handled), or - if e_shoff is valid but the array\nextends past EOF - pread may return a short read which is treated as success,\nleaving the section headers partially populated with undefined data.","fix":"After computing the read size, verify that ehdr.e_shoff + read_size <= file_size (obtained via fstat); treat a short pread return as failure.","locations":[{"ref":"Source/Tools/CommonTools/Linux/Utils/ELFParser.h:428-456","code":"  428 |     if (type == ::ELFLoader::ELFContainer::TYPE_X86_64) {\n  429 |       shdrs.emplace(ehdr.e_shnum);\n  430 |       if (pread(fd, shdrs->data(), sizeof(Elf64_Shdr) * ehdr.e_shnum, ehdr.e_shoff) == -1) {\n  431 |         shdrs->clear();\n  432 |         return false;\n  433 |       }\n  434 |     } else {\n  435 |       fextl::vector<Elf32_Shdr> shdrs32(ehdr.e_shnum);\n  436 |       if (pread(fd, shdrs32.data(), sizeof(Elf32_Shdr) * ehdr.e_shnum, ehdr.e_shoff) == -1) {\n  437 |         shdrs.emplace();\n  438 |         return false;\n  439 |       }\n  440 | \n  441 |       shdrs.emplace(ehdr.e_shnum);\n  442 |       for (int i = 0; i < ehdr.e_shnum; i++) {\n  443 | #define COPY(name) (*shdrs)[i].name = shdrs32[i].name\n  444 |         COPY(sh_name);\n  445 |         COPY(sh_type);\n  446 |         COPY(sh_flags);\n  447 |         COPY(sh_addr);\n  448 |         COPY(sh_offset);\n  449 |         COPY(sh_size);\n  450 |         COPY(sh_link);\n  451 |         COPY(sh_info);\n  452 |         COPY(sh_addralign);\n  453 |         COPY(sh_entsize);\n  454 | #undef COPY\n  455 |       }\n  456 |     }","lines":29,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/CommonTools/Linux/Utils/ELFParser.h#L428-L456"}]},
{"id":"LOGIC_84","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"ELFCodeLoader::SetupStack() accesses ApplicationArgs[0] at line 863 and 906\nwithout guarding against an empty ApplicationArgs vector. If the constructor\nerased the only element (lines 303-305 in the binfmt_misc path when argc==1),\nApplicationArgs can be empty and the index operator causes UB.","fix":"Check ApplicationArgs.empty() before accessing ApplicationArgs[0], and handle the empty case gracefully (e.g. use an empty string).","locations":[{"ref":"Source/Tools/FEXInterpreter/ELFCodeLoader.h:863","code":"  863 |     TotalArgumentMemSize += ApplicationArgs[0].size() + 1;","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/FEXInterpreter/ELFCodeLoader.h#L863"},{"ref":"Source/Tools/FEXInterpreter/ELFCodeLoader.h:906","code":"  906 |     strncpy(InvocationName, ApplicationArgs[0].c_str(), ApplicationArgs[0].size() + 1);","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/FEXInterpreter/ELFCodeLoader.h#L906"}]},
{"id":"LOGIC_85","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In Exec::ExecAndWaitForResponseText, the read loop uses 'size_t Size' to capture the return\nvalue of read():\n  while (size_t Size = read(fd[0], Buffer, sizeof(Buffer)))\nread() returns ssize_t (-1 on error). Assigning -1 to size_t converts it to SIZE_MAX via\nunsigned wrap. The condition is truthy (SIZE_MAX != 0), so the loop continues and\nstring_view(Buffer, SIZE_MAX) is constructed with a pathological size, causing\nundefined behavior (likely crash or massive heap allocation) when appended to Output.\nEINTR is also not handled - a signal during read() would terminate the loop prematurely.","fix":"Use 'ssize_t Size = read(...)' and check 'while (Size > 0)' in a do-while or restructured loop. Add an EINTR retry for signals.","locations":[{"ref":"Source/Tools/FEXRootFSFetcher/Main.cpp:196-198","code":"  196 |     while (size_t Size = read(fd[0], Buffer, sizeof(Buffer))) {\n  197 |       Output += std::string_view(Buffer, Size);\n  198 |     }","lines":3,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/FEXRootFSFetcher/Main.cpp#L196-L198"}]},
{"id":"LOGIC_86","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In Zenity::ValidateCheckExists (and the equivalent TTY::ValidateCheckExists), when the user\nselects \"Overwrite\" (Result == 0), the code hashes the existing file and if the hash matches\nthe expected hash, it skips the download (returns false). This is inverted: the user explicitly\nasked to overwrite, but the function cancels the download when the file is valid.\nOnly when the hash does NOT match does the download proceed (falls through to return true).\nThe \"Validate\" branch (Result == 1) has the correct semantics.","fix":"For the Overwrite case (Result == 0), unconditionally return true to always proceed with\nthe download, regardless of the hash check result. The hash check is only meaningful when\nthe user wants to validate the existing file.","locations":[{"ref":"Source/Tools/FEXRootFSFetcher/Main.cpp:755-773","code":"  755 |     auto Res = XXFileHash::HashFile(PathName);\n  756 |     if (Result == 0) {\n  757 |       if (Res == ExpectedHash) {\n  758 |         fextl::string Text = fextl::fmt::format(\"{} matches expected hash. Skipping download\", filename);\n  759 |         ExecWithInfo(Text);\n  760 |         return false;\n  761 |       }\n  762 |     } else if (Result == 1) {\n  763 |       if (Res != ExpectedHash) {\n  764 |         return AskForConfirmation(\"RootFS doesn't match hash!\\nDo you want to redownload?\");\n  765 |       } else {\n  766 |         fextl::string Text = fextl::fmt::format(\"{} matches expected hash\", filename);\n  767 |         ExecWithInfo(Text);\n  768 |         return false;\n  769 |       }\n  770 |     }\n  771 |   }\n  772 | \n  773 |   return true;","lines":19,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/FEXRootFSFetcher/Main.cpp#L755-L773"},{"ref":"Source/Tools/FEXRootFSFetcher/Main.cpp:914-928","code":"  914 |     if (Result == 0) {\n  915 |       if (Res == ExpectedHash) {\n  916 |         fmt::print(\"{} matches expected hash. Skipping downloading\\n\", filename);\n  917 |         return false;\n  918 |       }\n  919 |     } else if (Result == 1) {\n  920 |       if (Res != ExpectedHash) {\n  921 |         fmt::print(\"RootFS doesn't match hash!\\n\");\n  922 |         return AskForConfirmation(\"Do you want to redownload?\");\n  923 |       } else {\n  924 |         fmt::print(\"{} matches expected hash\\n\", filename);\n  925 |         return false;\n  926 |       }\n  927 |     }\n  928 |   }","lines":15,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/FEXRootFSFetcher/Main.cpp#L914-L928"}]},
{"id":"LOGIC_87","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In Logger::HandleLogData, the packet-parsing loop lacks bounds checks before\ndereferencing packet fields. The loop condition is only 'CurrentOffset < CurrentRead',\nbut does not verify that CurrentOffset + sizeof(PacketHeader) <= CurrentRead before\nreading Header->PacketType, or that CurrentOffset + sizeof(PacketMsg) <= CurrentRead\nbefore reading Msg->MessageLength. A truncated packet at the end of a buffer would\ncause reads of stale or uninitialized vector bytes.\nAdditionally, Msg->MessageLength is read without validating that\nCurrentOffset + sizeof(PacketMsg) + Msg->MessageLength <= CurrentRead,\nso a malformed MessageLength could advance CurrentOffset past CurrentRead on the\nnext iteration (non-crashing but skips data incorrectly).","fix":"Add bounds checks: before reading Header->PacketType verify (CurrentOffset + sizeof(PacketHeader) <= CurrentRead); before advancing via MessageLength verify (CurrentOffset + sizeof(PacketMsg) + Msg->MessageLength <= CurrentRead); break or return on violation.","locations":[{"ref":"Source/Tools/FEXServer/Logger.cpp:44-56","code":"   44 |   size_t CurrentOffset {};\n   45 |   while (CurrentOffset < CurrentRead) {\n   46 |     FEXServerClient::Logging::PacketHeader* Header = reinterpret_cast<FEXServerClient::Logging::PacketHeader*>(&Data[CurrentOffset]);\n   47 |     if (Header->PacketType == FEXServerClient::Logging::PacketTypes::TYPE_MSG) {\n   48 |       FEXServerClient::Logging::PacketMsg* Msg = reinterpret_cast<FEXServerClient::Logging::PacketMsg*>(&Data[CurrentOffset]);\n   49 |       const char* MsgText = reinterpret_cast<const char*>(&Data[CurrentOffset + sizeof(FEXServerClient::Logging::PacketMsg)]);\n   50 |       Logging::ClientMsgHandler(Socket, Msg, MsgText);\n   51 | \n   52 |       CurrentOffset += sizeof(FEXServerClient::Logging::PacketMsg) + Msg->MessageLength;\n   53 |     } else {\n   54 |       CurrentOffset = CurrentRead;\n   55 |     }\n   56 |   }","lines":13,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/FEXServer/Logger.cpp#L44-L56"}]},
{"id":"LOGIC_88","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"The hexstring() function (GdbServer.cpp:138-153) does not check for stream EOF when the delimiter is -1\n(meaning \"read until end of stream\"). If the hex-encoded data has an odd number of nibbles, `ss.read(hexString, 2)`\non the last iteration will read only 1 byte but leave `hexString[1]` with its value from the PREVIOUS\niteration (only the initial `{0,0,0}` initializer zeroes both bytes). This produces a garbage decoded byte\nfor the last character when the input is malformed.\n\nAlso, if the delimiter character never appears in the stream (e.g., because the packet is truncated),\nthe loop may spin until `ss.peek()` returns EOF (-1). If `delm` is any non-(-1) value, the loop condition\n`ss.peek() != delm` will eventually become `EOF != delm` which is true (infinite loop) if -1 != delm.\nActually peek() returns EOF as an int (-1), and ss enters a fail state, so the read() calls become no-ops\nbut the loop keeps spinning on a failed stream - effectively an infinite loop.","fix":"Add an EOF/fail check to the loop: `while (!ss.fail() && ss.peek() != delm)`. Also zero out hexString[1] at the start of each iteration before read(), or memset the buffer each time.","locations":[{"ref":"Source/Tools/LinuxEmulation/LinuxSyscalls/GdbServer.cpp:138-153","code":"  138 | static fextl::string hexstring(fextl::istringstream& ss, int delm) {\n  139 |   fextl::string ret;\n  140 | \n  141 |   char hexString[3] = {0, 0, 0};\n  142 |   while (ss.peek() != delm) {\n  143 |     ss.read(hexString, 2);\n  144 |     int c = std::strtoul(hexString, nullptr, 16);\n  145 |     ret.push_back((char)c);\n  146 |   }\n  147 | \n  148 |   if (delm != -1) {\n  149 |     ss.get();\n  150 |   }\n  151 | \n  152 |   return ret;\n  153 | }","lines":16,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/LinuxEmulation/LinuxSyscalls/GdbServer.cpp#L138-L153"}]},
{"id":"LOGIC_89","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"Munmap in MemAllocator32Bit rejects non-page-aligned lengths with -EINVAL (line 260), but the Linux\nkernel accepts any length for munmap and internally rounds it up to the next page boundary. Guest code\nthat calls munmap with a non-page-aligned length (valid per POSIX) will receive -EINVAL from FEX when\nit should succeed. This divergence can cause subtle guest misbehavior.","fix":"Remove the `length & ~FEX_PAGE_MASK` check. Instead, compute PagesLength from AlignUp(length, PAGE_SIZE) as already done on line 248, which handles unaligned lengths correctly.","locations":[{"ref":"Source/Tools/LinuxEmulation/LinuxSyscalls/LinuxAllocator.cpp:260-262","code":"  260 |   if (length & ~FEXCore::Utils::FEX_PAGE_MASK) {\n  261 |     return -EINVAL;\n  262 |   }","lines":3,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/LinuxEmulation/LinuxSyscalls/LinuxAllocator.cpp#L260-L262"}]},
{"id":"LOGIC_90","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"Mremap in MemAllocator32Bit has a resource leak and bitmap inconsistency when the fallback path fails.\n\nWhen neither MREMAP_FIXED nor in-place extension works, the code (lines 363-390):\n1. Calls `this->Mmap(nullptr, new_size, ...)` which allocates a placeholder region AND marks those pages\n   as used in MappedPages.\n2. Then calls `::mremap(old_address, old_size, new_size, flags | MREMAP_FIXED | MREMAP_MAYMOVE, MappedPtr)`.\n\nIf mremap fails at step 2, the placeholder mapping from step 1 is still live in memory AND is still\ntracked as used in MappedPages. There is no cleanup: `Munmap` is never called on `MappedPtr`, so those\npages are permanently leaked (both the actual mapping and the bitmap slots).\n\nThere is also a time-of-check/time-of-use race: the `AllocMutex` is released after `Mmap` returns and\nre-acquired at line 364, leaving a window where another thread can allocate the same bitmap region.","fix":"If `::mremap` at line 372 fails, call `this->Munmap(MappedPtr, new_size)` to release the placeholder\nbefore returning. Also consider holding `AllocMutex` across the entire fallback sequence by refactoring\n`Mmap` into a lock-free inner helper.","locations":[{"ref":"Source/Tools/LinuxEmulation/LinuxSyscalls/LinuxAllocator.cpp:362-390","code":"  362 |   // First, try and allocate a region the size of the new size\n  363 |   void* MappedPtr = this->Mmap(nullptr, new_size, PROT_NONE, MAP_PRIVATE | MAP_ANONYMOUS, -1, 0);\n  364 |   std::scoped_lock<std::mutex> lk {AllocMutex};\n  365 |   if (FEX::HLE::HasSyscallError(MappedPtr)) {\n  366 |     // Couldn't find a region that fit our space\n  367 |     return MappedPtr;\n  368 |   }\n  369 | \n  370 |   // Good news, we found a region\n  371 |   // This will overwrite the previous mmap if it succeeds\n  372 |   MappedPtr = ::mremap(old_address, old_size, new_size, flags | MREMAP_FIXED | MREMAP_MAYMOVE, MappedPtr);\n  373 | \n  374 |   if (MappedPtr != MAP_FAILED) {\n  375 |     if (!(flags & MREMAP_DONTUNMAP) && MappedPtr != old_address) {\n  376 |       // If we have both MREMAP_DONTUNMAP not set and the new pointer is at a new location\n  377 |       // Make sure to clear the old mapping\n  378 |       uintptr_t OldAddr = reinterpret_cast<uintptr_t>(old_address);\n  379 |       SetFreePages(OldAddr >> FEXCore::Utils::FEX_PAGE_SHIFT, OldPagesLength);\n  380 |     }\n  381 | \n  382 |     // Map the new pages\n  383 |     size_t NewPagesLength = FEXCore::AlignUp(new_size, FEXCore::Utils::FEX_PAGE_SIZE) >> FEXCore::Utils::FEX_PAGE_SHIFT;\n  384 |     uintptr_t NewAddr = reinterpret_cast<uintptr_t>(MappedPtr);\n  385 |     SetUsedPages(NewAddr >> FEXCore::Utils::FEX_PAGE_SHIFT, NewPagesLength);\n  386 |     return MappedPtr;\n  387 |   }\n  388 | \n  389 |   // Failed\n  390 |   return reinterpret_cast<void*>(-errno);","lines":29,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/LinuxEmulation/LinuxSyscalls/LinuxAllocator.cpp#L362-L390"}]},
{"id":"LOGIC_91","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"RegisterGuestSigAltStack incorrectly reports the old alt stack as SS_DISABLE when the stack exists but\nis not currently being used (line 1163).\n\nWhen the guest calls sigaltstack(ss, old_ss) and an alt stack is configured but the thread is not currently\non it, the code does `old_ss->ss_flags |= SS_DISABLE`. However, the Linux kernel only sets SS_DISABLE in\nold_ss when the alt stack is actually disabled (i.e., ss_flags had SS_DISABLE set). If the alt stack is\nconfigured but just not active, old_ss->ss_flags should reflect the stored flags, not have SS_DISABLE added.\n\nPrograms that inspect old_ss->ss_flags to check for a configured alt stack will incorrectly conclude that\nno alt stack is installed.","fix":"Remove the `else { old_ss->ss_flags |= SS_DISABLE; }` branch. The else branch is wrong - it sets SS_DISABLE\neven when a valid alt stack is configured. The line `*old_ss = Thread->SignalInfo.GuestAltStack;` already\ncopies the real ss_flags. Only add SS_ONSTACK when UsingAltStack is true.","locations":[{"ref":"Source/Tools/LinuxEmulation/LinuxSyscalls/SignalDelegator.cpp:1154-1160","code":" 1154 |     if (UsingAltStack) {\n 1155 |       // We are currently operating on the alt stack\n 1156 |       // Let the guest know\n 1157 |       old_ss->ss_flags |= SS_ONSTACK;\n 1158 |     } else {\n 1159 |       old_ss->ss_flags |= SS_DISABLE;\n 1160 |     }","lines":7,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/LinuxEmulation/LinuxSyscalls/SignalDelegator.cpp#L1154-L1160"}]},
{"id":"LOGIC_92","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"GenerateMap index file is opened with O_APPEND instead of O_TRUNC, causing corruption on retry.\n\nWhen generating the sourcecode index file, the file is opened with:\n  O_CREAT | O_WRONLY | O_APPEND | O_CLOEXEC\nwithout O_TRUNC. If the `goto DoGenerate` path is hit (e.g., the existing index had invalid\nmagic on line 1004), the file already exists and data is appended after the old (invalid) content.\nThe resulting file has old data followed by new data; subsequent reads will parse the old\ninvalid header instead of the freshly written one, causing every subsequent load attempt to\nfail and re-generate, producing a permanently corrupted and growing index file.","fix":"Replace O_APPEND with O_TRUNC: `O_CREAT | O_WRONLY | O_TRUNC | O_CLOEXEC`.","locations":[{"ref":"Source/Tools/LinuxEmulation/LinuxSyscalls/Syscalls.cpp:1096","code":" 1096 |     int IndexStream = ::open(GuestIndexFile.c_str(), O_CREAT | O_WRONLY | O_APPEND | O_CLOEXEC, USER_PERMS);","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/LinuxEmulation/LinuxSyscalls/Syscalls.cpp#L1096"}]},
{"id":"LOGIC_93","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"timerfd_settime dereferences the 'new_value' pointer without first calling\nFaultSafeUserMemAccess::VerifyIsReadable. Line 777 does\n'new_value_host = *new_value;' unconditionally, but if new_value points to\nunmapped or read-protected guest memory, this will fault the emulator process\nrather than returning EFAULT to the guest. Every other time-conversion\nsyscall in the same file (timerfd_gettime, ppoll, io_getevents, etc.) calls\nVerifyIsReadable before dereferencing.","fix":"Add 'FaultSafeUserMemAccess::VerifyIsReadable(new_value, sizeof(*new_value));' before line 777.","locations":[{"ref":"Source/Tools/LinuxEmulation/LinuxSyscalls/x32/FD.cpp:691","code":"  691 |                               new_value_host = *new_value;","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/LinuxEmulation/LinuxSyscalls/x32/FD.cpp#L691"}]},
{"id":"LOGIC_94","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"x32 wait4: the rusage parameter is output-only (the kernel fills it in), but the\nimplementation incorrectly reads from it before the syscall. Line 319 calls\n`FaultSafeUserMemAccess::VerifyIsReadable(rusage, sizeof(*rusage))` and then\n`usage64 = *rusage` to initialize usage64. This read is unnecessary because wait4\nonly writes to rusage; reading it before calling the kernel copies uninitialized\nuser data. The correct pre-call check should be VerifyIsWritable, not VerifyIsReadable,\nand the initial copy should be removed.","fix":"Remove the VerifyIsReadable and `usage64 = *rusage` lines. Only call `VerifyIsWritable(rusage, sizeof(*rusage))` after the syscall returns successfully, as is already done on line 325.","locations":[{"ref":"Source/Tools/LinuxEmulation/LinuxSyscalls/x32/Thread.cpp:318-321","code":"  318 |     if (rusage) {\n  319 |       FaultSafeUserMemAccess::VerifyIsReadable(rusage, sizeof(*rusage));\n  320 |       usage64 = *rusage;\n  321 |       usage64_p = &usage64;","lines":4,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/LinuxEmulation/LinuxSyscalls/x32/Thread.cpp#L318-L321"}]},
{"id":"LOGIC_95","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In pidof.cpp IteratePids (line 181-189), the exe symlink is read into exe_link\nbefore checking the error code. When std::filesystem::read_symlink sets `ec`,\nthe string exe_link may already contain garbage or a partial path.\nMore importantly, the code processes `exe_link` for the \"(deleted)\" suffix on\nline 183 before checking if `ec` is set on line 189. If the symlink read failed,\n`exe_link` is a default-constructed empty string, the deleted-suffix check\nis harmless, but the `continue` at line 190 should logically come before\nthe string manipulation - this is a logic ordering issue.","fix":"Move the `if (ec) { continue; }` check immediately after `read_symlink` on\nline 181, before the \"(deleted)\" string processing.","locations":[{"ref":"Source/Tools/pidof/pidof.cpp:181-190","code":"  181 |     std::string exe_link = std::filesystem::read_symlink(ExePath, ec);\n  182 | \n  183 |     auto deleted_pos = exe_link.find(\" (deleted)\");\n  184 |     if (deleted_pos != std::string::npos) {\n  185 |       exe_link = exe_link.substr(0, deleted_pos);\n  186 |     }\n  187 | \n  188 |     // Couldn't read exe path? skip.\n  189 |     if (ec) {\n  190 |       continue;","lines":10,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/pidof/pidof.cpp#L181-L190"}]},
{"id":"LOGIC_96","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In pidof.cpp main (line 327), the guard `ProgramArg >= Args.size()` compares\na signed int32_t against an unsigned size_t. When ProgramArg is -1 (which is\nchecked first in the same condition), the unsigned comparison would wrap to\na large value, making the guard always true for ProgramArg == -1. However,\nbecause of short-circuit evaluation (ProgramArg == -1 is checked first), this\nis not currently a bug. But if the check order were ever changed or ProgramArg\nis set to other negative values, the implicit signed-to-unsigned conversion\nwould cause the size_t comparison to evaluate incorrectly.","fix":"Use explicit cast: `(size_t)ProgramArg >= Args.size()` or make ProgramArg size_t with a sentinel value.","locations":[{"ref":"Source/Tools/pidof/pidof.cpp:327","code":"  327 |     if (ProgramArg == -1 || ProgramArg >= Args.size()) {","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Tools/pidof/pidof.cpp#L327"}]},
{"id":"LOGIC_97","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In Module.cpp NotifyMemoryAlloc / NotifyMemoryFree / NotifyMemoryProtect, the\nmutex ThreadCreationMutex is locked in the !After branch and unlocked in the\nAfter branch. However, if the BT interface calls the !After callback but then\nexperiences an error (e.g. the memory operation fails and the After callback is\nnever called, or the After callback returns early due to InvalidationTracker\nbeing null), the mutex will remain locked permanently, deadlocking the process\non the next memory notification. The After paths check `!InvalidationTracker ||\n!GetCPUArea().ThreadState()` and return early without unlocking.","fix":"Either ensure the early-return paths in the After branch always unlock the mutex\n(the !After path should only lock if the full pair is guaranteed), or refactor\nto use std::unique_lock with deferred lock and explicit unlock, making the\npairing robust to early returns.","locations":[{"ref":"Source/Windows/ARM64EC/Module.cpp:790-804","code":"  790 | void NotifyMemoryAlloc(void* Address, SIZE_T Size, ULONG Type, ULONG Prot, BOOL After, NTSTATUS Status) {\n  791 |   if (!InvalidationTracker || !GetCPUArea().ThreadState()) {\n  792 |     return;\n  793 |   }\n  794 | \n  795 |   if (!After) {\n  796 |     ThreadCreationMutex.lock();\n  797 |   } else {\n  798 |     // MEM_RESET(_UNDO) ignores the passed permissions\n  799 |     if (!Status && !(Type & (MEM_RESET | MEM_RESET_UNDO))) {\n  800 |       InvalidationTracker->HandleMemoryProtectionNotification(reinterpret_cast<uint64_t>(Address), static_cast<uint64_t>(Size), Prot);\n  801 |     }\n  802 |     ThreadCreationMutex.unlock();\n  803 |   }\n  804 | }","lines":15,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Windows/ARM64EC/Module.cpp#L790-L804"},{"ref":"Source/Windows/ARM64EC/Module.cpp:806-819","code":"  806 | void NotifyMemoryFree(void* Address, SIZE_T Size, ULONG FreeType, BOOL After, NTSTATUS Status) {\n  807 |   if (!InvalidationTracker || !GetCPUArea().ThreadState()) {\n  808 |     return;\n  809 |   }\n  810 | \n  811 |   if (!After) {\n  812 |     ThreadCreationMutex.lock();\n  813 |   } else {\n  814 |     if (!Status) {\n  815 |       InvalidationTracker->InvalidateAlignedInterval(reinterpret_cast<uint64_t>(Address), static_cast<uint64_t>(Size), true);\n  816 |     }\n  817 |     ThreadCreationMutex.unlock();\n  818 |   }\n  819 | }","lines":14,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Windows/ARM64EC/Module.cpp#L806-L819"},{"ref":"Source/Windows/ARM64EC/Module.cpp:821-834","code":"  821 | void NotifyMemoryProtect(void* Address, SIZE_T Size, ULONG NewProt, BOOL After, NTSTATUS Status) {\n  822 |   if (!InvalidationTracker || !GetCPUArea().ThreadState()) {\n  823 |     return;\n  824 |   }\n  825 | \n  826 |   if (!After) {\n  827 |     ThreadCreationMutex.lock();\n  828 |   } else {\n  829 |     if (!Status) {\n  830 |       InvalidationTracker->HandleMemoryProtectionNotification(reinterpret_cast<uint64_t>(Address), static_cast<uint64_t>(Size), NewProt);\n  831 |     }\n  832 |     ThreadCreationMutex.unlock();\n  833 |   }\n  834 | }","lines":14,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Windows/ARM64EC/Module.cpp#L821-L834"}]},
{"id":"LOGIC_98","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In Module.cpp ThreadTerm (line 991), `ThreadTID` is cast from a 64-bit pointer\nvalue (Info.ClientId.UniqueThread) to uint64_t, but then compared against\nGetCurrentThreadId() which returns DWORD (32-bit). On 64-bit Windows,\nUniqueThread in a THREAD_BASIC_INFORMATION struct is a pointer-sized value\nrepresenting the thread identifier. If the thread ID ever exceeds 32 bits in\nvalue (unlikely but possible in theory), the comparison `ThreadTID == GetCurrentThreadId()`\nwould fail even for the current thread. More concretely, the map `Threads` is\nkeyed by DWORD (32-bit), but ThreadTID is uint64_t. The lookup at line 1007\n`Threads.find(ThreadTID)` will work correctly due to implicit narrowing, but\nthe Self check at line 991 compares the 64-bit value against DWORD, which\nshould be safe on real Windows (TIDs fit in 32 bits) but is a latent type\nmismatch that could confuse readers.","fix":"Cast UniqueThread to DWORD for consistency with the Threads map key type.","locations":[{"ref":"Source/Windows/ARM64EC/Module.cpp:1027-1028","code":" 1027 |   const auto ThreadTID = reinterpret_cast<uint64_t>(Info.ClientId.UniqueThread);\n 1028 |   bool Self = ThreadTID == GetCurrentThreadId();","lines":2,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Windows/ARM64EC/Module.cpp#L1027-L1028"}]},
{"id":"LOGIC_99","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In CRT/IO.cpp, the GetFile() function at line 100-103 takes a FileHandle\ninteger and indexes directly into OpenFileTable without bounds checking or\nverifying the entry is non-null. If a caller passes an invalid or already-closed\nFileHandle, this produces an out-of-bounds vector access or a null pointer\ndereference. The same issue affects RemoveFile (line 105-108). Several callers\n(e.g. _lseeki64, _read, _write) call GetFile without validating the file handle.","fix":"Add bounds checking: if FileHandle < 0 or FileHandle >= (int)OpenFileTable.size()\nor !OpenFileTable[FileHandle], return an error. Acquire FileTableLock before\nchecking.","locations":[{"ref":"Source/Windows/Common/CRT/IO.cpp:101-104","code":"  101 | FILE* GetFile(int FileHandle) {\n  102 |   std::scoped_lock Lock {FileTableLock};\n  103 |   return OpenFileTable[FileHandle].get();\n  104 | }","lines":4,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Windows/Common/CRT/IO.cpp#L101-L104"},{"ref":"Source/Windows/Common/CRT/IO.cpp:106-109","code":"  106 | void RemoveFile(int FileHandle) {\n  107 |   std::scoped_lock Lock {FileTableLock};\n  108 |   OpenFileTable[FileHandle].reset();\n  109 | }","lines":4,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Windows/Common/CRT/IO.cpp#L106-L109"},{"ref":"Source/Windows/Common/CRT/IO.cpp:230-234","code":"  230 | int64_t _lseeki64(int FileHandle, int64_t Offset, int Origin) {\n  231 |   LARGE_INTEGER Res;\n  232 |   SetFilePointerEx(GetFile(FileHandle)->Handle, LARGE_INTEGER {.QuadPart = Offset}, &Res, OriginToMoveMethod(Origin));\n  233 |   return Res.QuadPart;\n  234 | }","lines":5,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Windows/Common/CRT/IO.cpp#L230-L234"},{"ref":"Source/Windows/Common/CRT/IO.cpp:252-255","code":"  252 | DLLEXPORT_FUNC(int, _read, (int FileHandle, void* DstBuf, unsigned int MaxCharCount)) {\n  253 |   DWORD Read;\n  254 |   ReadFile(GetFile(FileHandle)->Handle, DstBuf, MaxCharCount, &Read, nullptr);\n  255 |   return static_cast<int>(Read);","lines":4,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Windows/Common/CRT/IO.cpp#L252-L255"}]},
{"id":"LOGIC_100","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In CRT/IO.cpp _sopen (line 188), when _O_CREAT is set it calls\n`_wopen(FilenameW.Buffer, OpenFlag, ShareFlag, PermMode)` - but _wopen's\nsignature (line 164) is `(const wchar_t* Filename, int OpenFlag, ...)`. The\nthird positional argument to _wopen is the variadic PermMode, but here\nShareFlag is passed as the variadic argument and PermMode as the fourth. This\nmeans _wopen receives ShareFlag as PermMode and PermMode is silently dropped,\nso the create permission mode is incorrectly set to the share-mode value.","fix":"The call should pass PermMode as the third variadic argument and ignore ShareFlag,\nmatching the _O_CREAT path of _open which correctly omits ShareFlag:\n  ret = _wopen(FilenameW.Buffer, OpenFlag, PermMode);","locations":[{"ref":"Source/Windows/Common/CRT/IO.cpp:188-190","code":"  188 |     va_end(VA);\n  189 |     ret = _wopen(FilenameW.Buffer, OpenFlag, ShareFlag, PermMode);\n  190 |   } else {","lines":3,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Windows/Common/CRT/IO.cpp#L188-L190"}]},
{"id":"LOGIC_101","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In CRT/IO.cpp fread (line 364-368), the element count arithmetic `ElementSize * Count`\ncan silently overflow if ElementSize and Count are both large (each is size_t).\nThe result is passed as nNumberOfBytesToRead (DWORD, 32-bit) to ReadFile, which\nwould truncate to the low 32 bits and read far less than intended. The caller\nwould then see a short read but interpret it as element-count success.\nSimilarly in fwrite (line 370-377), `Size * Count` may overflow.","fix":"Use DWORD-saturating arithmetic or split the read/write into chunks when\nElementSize * Count exceeds MAXDWORD. At minimum, add an assertion.","locations":[{"ref":"Source/Windows/Common/CRT/IO.cpp:365-369","code":"  365 | size_t fread(void* __restrict__ DstBuf, size_t ElementSize, size_t Count, FILE* __restrict__ File) {\n  366 |   DWORD Read;\n  367 |   ReadFile(File->Handle, DstBuf, ElementSize * Count, &Read, nullptr);\n  368 |   return static_cast<size_t>(Read);\n  369 | }","lines":5,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Windows/Common/CRT/IO.cpp#L365-L369"},{"ref":"Source/Windows/Common/CRT/IO.cpp:371-378","code":"  371 | size_t fwrite(const void* __restrict__ Str, size_t Size, size_t Count, FILE* __restrict__ File) {\n  372 |   DWORD Written;\n  373 |   if (File->Append) {\n  374 |     SetFilePointerEx(File->Handle, LARGE_INTEGER {}, nullptr, FILE_END);\n  375 |   }\n  376 |   WriteFile(File->Handle, Str, Size * Count, &Written, nullptr);\n  377 |   return static_cast<size_t>(Written);\n  378 | }","lines":8,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Windows/Common/CRT/IO.cpp#L371-L378"}]},
{"id":"LOGIC_102","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In CRT/Misc.cpp InitEnv (line 23-25), the environment block size counter\n`SizeW` starts at 4 and increments by 2 for each wchar_t. The termination\ncondition is `It[0] != 0 || It[1] != 0` (double-null detection). However\nSizeW is initialized to 4 (not 0), adding an extra 2 wchars to the measured\nsize before any iteration. This means the final SizeW may be 4 bytes larger\nthan the actual environment block size, causing RtlUnicodeToMultiByteSize\nand RtlUnicodeToMultiByteN to operate on 2 extra wchar_t characters (the\ndouble-null terminator) beyond the real content. This results in a spurious\nempty string being included in the environment conversion, but the subsequent\nparsing loop correctly stops at the first null byte so it is mostly harmless.\nHowever, the extra bytes passed to Rtl functions technically point outside\nthe logical environment block.","fix":"Initialize SizeW to 0 and update the loop to count wchar_t units correctly,\nor initialize SizeW to 2 to account for the double-null terminator that\nneeds to be included in the buffer size passed to conversion functions.","locations":[{"ref":"Source/Windows/Common/CRT/Misc.cpp:23-30","code":"   23 |   DWORD SizeW = 4;\n   24 |   // The PEB environment is terminated by two null wchars.\n   25 |   for (wchar_t* It = EnvW; It[0] != 0 || It[1] != 0; It++, SizeW += 2)\n   26 |     ;\n   27 |   DWORD Size;\n   28 |   RtlUnicodeToMultiByteSize(&Size, EnvW, SizeW);\n   29 |   Env = reinterpret_cast<char*>(RtlAllocateHeap(GetProcessHeap(), 0, Size + 1));\n   30 |   RtlUnicodeToMultiByteN(Env, Size + 1, nullptr, EnvW, SizeW);","lines":8,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Windows/Common/CRT/Misc.cpp#L23-L30"}]},
{"id":"LOGIC_103","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In InvalidationTracker.cpp InvalidateAlignedInterval (line 203-204), the\nAlignedSize computation is:\n  std::max(Size, (Address - AlignedBase + Size + FEXCore::Utils::FEX_PAGE_SIZE - 1) & FEXCore::Utils::FEX_PAGE_MASK)\n\nThe FEX_PAGE_MASK is used here as an alignment mask (e.g. ~0xFFF), not as the\npage size. This means it rounds down, not up. When Address is already aligned\nand Size is exactly a multiple of page size, the `& FEX_PAGE_MASK` expression\ncorrectly produces Size. But when Size is 0 (which can happen when it equals\nstd::numeric_limits<uint64_t>::max() from the null-Address path two lines above),\nthe expression `0 + 0 + 0xFFF & ~0xFFF` evaluates to 0 - the std::max picks\nthe original Size = UINT64_MAX, which is correct. However for a small non-zero\nunaligned range, the rounding logic is `(offset + Size + 0xFFF) & ~0xFFF` which\nrounds up correctly, but the outer std::max(Size, ...) means if the aligned size\nis accidentally smaller than Size (impossible here but fragile), Size is used.\nThe actual bug: FEX_PAGE_MASK should be `~(FEX_PAGE_SIZE - 1)` and is indeed\nused as such elsewhere. As long as that definition is consistent this is fine,\nbut the naming is confusing and differs from what is used in HandleMemoryProtectionNotification.","fix":"This is at minimum a clarity issue. Verify FEX_PAGE_MASK is consistently defined\nas ~(FEX_PAGE_SIZE - 1) and not as the page size itself. The std::max wrapper\nshould be removed because it can only be larger than the aligned size when the\nalignment rounds down, which should not happen with correct mask alignment.","locations":[{"ref":"Source/Windows/Common/InvalidationTracker.cpp:204","code":"  204 |   const auto AlignedSize = std::max(Size, (Address - AlignedBase + Size + FEXCore::Utils::FEX_PAGE_SIZE - 1) & FEXCore::Utils::FEX_PAGE_MASK);","lines":1,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Windows/Common/InvalidationTracker.cpp#L204"}]},
{"id":"LOGIC_104","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In OvercommitTracker.h HandleAccessViolation (line 40-42), the Wine path\ncomputes CommitSize as the full region from AllocationBase to the end of the\ncurrent VirtualQuery region. This could commit a very large range when a small\nfault occurs far from the beginning of the reserved region. Furthermore,\nVirtualAlloc is called with the result of an Info struct whose BaseAddress may\nbe nullptr on query failure (since the return value of NtQueryVirtualMemory\nis not checked), leading to a VirtualAlloc(nullptr, ..., MEM_COMMIT, ...) call\nthat would instead try to allocate a new region.","fix":"Check that NtQueryVirtualMemory succeeds before using the Info struct. Also\nconsider whether committing from AllocationBase is always the correct choice\nrather than committing only the faulting page.","locations":[{"ref":"Source/Windows/Common/OvercommitTracker.h:39-43","code":"   39 |         MEMORY_BASIC_INFORMATION Info;\n   40 |         NtQueryVirtualMemory(NtCurrentProcess(), reinterpret_cast<void*>(FaultAddress), MemoryBasicInformation, &Info, sizeof(Info), nullptr);\n   41 |         const auto CommitSize = reinterpret_cast<SIZE_T>(Info.BaseAddress) + Info.RegionSize - reinterpret_cast<SIZE_T>(Info.AllocationBase);\n   42 |         VirtualAlloc(reinterpret_cast<void*>(Info.AllocationBase), CommitSize, MEM_COMMIT, PAGE_READWRITE);\n   43 |       } else {","lines":5,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Windows/Common/OvercommitTracker.h#L39-L43"}]},
{"id":"LOGIC_105","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In WinAPI/IO.cpp CreateFileW (line 106), all files are opened with an extra\n`GENERIC_READ` access OR'd in unconditionally: `dwDesiredAccess | GENERIC_READ | SYNCHRONIZE`.\nThis means files opened write-only (_O_WRONLY) will also receive read access.\nThis violates the documented behavior of CreateFile and can cause access denied\nerrors when creating files on directories where only write permission is granted.","fix":"Do not add GENERIC_READ unconditionally. If needed for FILE_SYNCHRONOUS_IO_NONALERT,\nadd only SYNCHRONIZE:\n  NtCreateFile(&Handle, dwDesiredAccess | SYNCHRONIZE, ...)","locations":[{"ref":"Source/Windows/Common/WinAPI/IO.cpp:105-107","code":"  105 |   NTSTATUS Status =\n  106 |     NtCreateFile(&Handle, dwDesiredAccess | GENERIC_READ | SYNCHRONIZE, &ObjAttributes, &IOSB, nullptr, OpenFlagsToNT(dwFlagsAndAttributes),\n  107 |                  dwShareMode, CreateDispositionToNT(dwCreationDisposition), FILE_SYNCHRONOUS_IO_NONALERT, nullptr, 0);","lines":3,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Windows/Common/WinAPI/IO.cpp#L105-L107"}]},
{"id":"LOGIC_106","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In Module.cpp LockJITContext(), the compare_exchange_weak loop uses std::memory_order::relaxed for both the success and failure cases (line 362). After the loop, std::atomic_signal_fence(seq_cst) is used to enforce ordering. However, atomic_signal_fence only provides ordering against signal handlers on the same thread - it does not provide ordering against accesses from other threads. The correct primitive for cross-thread ordering is std::atomic_thread_fence. This means the WOW_CPU_AREA_DIRTY flag read on line 366 may observe a stale value from another thread's write.","fix":"Replace 'std::atomic_signal_fence(std::memory_order::seq_cst)' with 'std::atomic_thread_fence(std::memory_order::acquire)' after the CAS loop to ensure the subsequent dirty-flag check sees writes from other threads.","locations":[{"ref":"Source/Windows/WOW64/Module.cpp:358-372","code":"  358 |   uint32_t Expected = TLS.ControlWord().load(), New;\n  359 | \n  360 |   // Spin until PAUSED is unset, setting IN_JIT when that occurs\n  361 |   do {\n  362 |     Expected = Expected & ~ControlBits::PAUSED;\n  363 |     New = (Expected | ControlBits::IN_JIT) & ~ControlBits::WOW_CPU_AREA_DIRTY;\n  364 |   } while (!TLS.ControlWord().compare_exchange_weak(Expected, New, std::memory_order::relaxed));\n  365 |   std::atomic_signal_fence(std::memory_order::seq_cst);\n  366 | \n  367 |   // If the CPU area is dirty, flush it to the JIT context before reentry\n  368 |   if (Expected & ControlBits::WOW_CPU_AREA_DIRTY) {\n  369 |     WOW64_CONTEXT* WowContext;\n  370 |     RtlWow64GetCurrentCpuArea(nullptr, reinterpret_cast<void**>(&WowContext), nullptr);\n  371 |     Context::LoadStateFromWowContext(TLS.ThreadState(), GetWowTEB(NtCurrentTeb()), WowContext);\n  372 |   }","lines":15,"link":"https://github.com/FEX-Emu/FEX/blob/208e9c31eaa30d7bcbcb808151eadaa2d79d852b/Source/Windows/WOW64/Module.cpp#L358-L372"}]},
