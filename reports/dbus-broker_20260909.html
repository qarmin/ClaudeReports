{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"service_start_transient_unit() unconditionally dereferences service->active_data->argv[0] when building the ExecStart array. service_activate() only sets is_transient (the path leading here) when active_data->argc > 0, so in practice argv[0] exists; however there is no assert or guard at this call site, and the surrounding code treats argc==0 as a valid 'self-activating' service elsewhere. If the invariant is ever broken (e.g. future change to activation flow), this is an out-of-bounds read of argv[0].","fix":"Add c_assert(service->active_data->argc > 0) at the top of service_start_transient_unit(), or guard the argv[0] access explicitly.","locations":[{"ref":"src/launch/service.c:494-495","code":"  494 |                                                 r = sd_bus_message_append(method_call, \"s\", service->active_data->argv[0]);\n  495 |                                                 if (r < 0)","lines":2,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/launch/service.c#L494-L495"},{"ref":"src/launch/service.c:936-955","code":"  936 |         } else if (service->active_data->argc > 0) {\n  937 |                 r = sd_bus_get_unique_name(launcher->bus_regular, &unique_name);\n  938 |                 if (r < 0)\n  939 |                         return error_origin(r);\n  940 | \n  941 |                 r = systemd_escape_unit(&escaped_name, service->name);\n  942 |                 if (r)\n  943 |                         return error_fold(r);\n  944 | \n  945 |                 r = asprintf(\n  946 |                         &service->active_unit,\n  947 |                         \"dbus-%s-%s@%\"PRIu64\".service\",\n  948 |                         unique_name,\n  949 |                         escaped_name,\n  950 |                         service->instance++\n  951 |                 );\n  952 |                 if (r < 0)\n  953 |                         return error_origin(-errno);\n  954 | \n  955 |                 service->is_transient = true;","lines":20,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/launch/service.c#L936-L955"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"policy-denial log_commitf() calls pass message->metadata.fields.interface and .member (and .path/.destination) directly as %s arguments with no NULL guard. For a method_call the interface field is optional and may be NULL, and broadcasts have a NULL destination; elsewhere in the codebase (diag_append_message) these are always guarded with `?: \"<missing>\"`. Passing NULL to %s is undefined behavior; glibc prints \"(null)\" but this is fragile and inconsistent with the rest of the code.","fix":"Guard each optional field, e.g. `message->metadata.fields.interface ?: \"<missing>\"`, matching diag_append_message().","locations":[{"ref":"src/bus/peer.c:801-805","code":"  801 |                         r = log_commitf(receiver->bus->log, \"A security policy denied %s to receive %s %s:%s.%s from :1.%llu.\",\n  802 |                                         message->metadata.fields.destination,\n  803 |                                         message->header->type == DBUS_MESSAGE_TYPE_METHOD_CALL ? \"method call\" : \"signal\",\n  804 |                                         message->metadata.fields.path, message->metadata.fields.interface, message->metadata.fields.member,\n  805 |                                         sender_id);","lines":5,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/bus/peer.c#L801-L805"},{"ref":"src/bus/peer.c:837-841","code":"  837 |                         r = log_commitf(receiver->bus->log, \"A security policy denied :1.%llu to send %s %s:%s.%s to %s.\",\n  838 |                                         sender_id,\n  839 |                                         message->header->type == DBUS_MESSAGE_TYPE_METHOD_CALL ? \"method call\" : \"signal\",\n  840 |                                         message->metadata.fields.path, message->metadata.fields.interface, message->metadata.fields.member,\n  841 |                                         message->metadata.fields.destination);","lines":5,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/bus/peer.c#L837-L841"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"policy_import_verdict() computes priority as 'UINT64_MAX / _CONFIG_POLICY_N * context + ++policy->i_priority'. i_priority is an unbounded incrementing counter; with enough policy records (per-context band width is UINT64_MAX/7) the additive term can spill into the next context's priority band, inverting the intended priority ordering between policy contexts. Not reachable with realistic config sizes (needs ~2.6e18 records), but the math has no guard.","fix":"Either document/assert an upper bound on i_priority well below the band width, or clamp/saturate the per-context counter so it cannot exceed the band size.","locations":[{"ref":"src/launch/policy.c:239-243","code":"  239 |         record->verdict = (cnode->type == CONFIG_NODE_ALLOW);\n  240 |         record->priority = UINT64_MAX / _CONFIG_POLICY_N *\n  241 |                            cnode->parent->policy.context +\n  242 |                            ++policy->i_priority;\n  243 | }","lines":5,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/launch/policy.c#L239-L243"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"metrics_compile() fills client->buffer via asprintf() but never sets client->n_buffer. Since the struct was calloc()'d, n_buffer stays 0. In metrics_client_dispatch() the EPOLLOUT path then calls send(fd, buffer + i_buffer, n_buffer - i_buffer = 0, ...), which returns 0, and the immediately following check `i_buffer (0) >= n_buffer (0)` is true, so the client is hung up. The metrics payload is therefore never actually transmitted to any client - the metrics endpoint is effectively non-functional.","fix":"After asprintf succeeds, set client->n_buffer to the returned length: `client->n_buffer = r;` (and keep client->i_buffer == 0).","locations":[{"ref":"src/bus/metrics.c:119-132","code":"  119 | static int metrics_compile(MetricsClient *client) {\n  120 |         int r;\n  121 | \n  122 |         c_assert(!client->buffer);\n  123 | \n  124 |         r = asprintf(\n  125 |                 (void *)&client->buffer,\n  126 |                 \"# EOF\"\n  127 |         );\n  128 |         if (r < 0)\n  129 |                 return error_origin(-errno);\n  130 | \n  131 |         return 0;\n  132 | }","lines":14,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/bus/metrics.c#L119-L132"},{"ref":"src/bus/metrics.c:41-79","code":"   41 |         } else if (events & EPOLLOUT) {\n   42 |                 ssize_t len;\n   43 | \n   44 |                 len = send(\n   45 |                         client->socket_fd,\n   46 |                         client->buffer + client->i_buffer,\n   47 |                         client->n_buffer - client->i_buffer,\n   48 |                         MSG_DONTWAIT | MSG_NOSIGNAL\n   49 |                 );\n   50 |                 if (len < 0) {\n   51 |                         switch (errno) {\n   52 |                         case EAGAIN:\n   53 |                                 dispatch_file_clear(file, EPOLLOUT);\n   54 |                                 break;\n   55 |                         case ECOMM:\n   56 |                         case ECONNABORTED:\n   57 |                         case ECONNRESET:\n   58 |                         case EHOSTDOWN:\n   59 |                         case EHOSTUNREACH:\n   60 |                         case EIO:\n   61 |                         case ENOBUFS:\n   62 |                         case ENOMEM:\n   63 |                         case EPIPE:\n   64 |                         case EPROTO:\n   65 |                         case EREMOTEIO:\n   66 |                         case ESHUTDOWN:\n   67 |                         case ETIMEDOUT:\n   68 |                                 hup = true;\n   69 |                                 break;\n   70 |                         default:\n   71 |                                 return error_origin(-errno);\n   72 |                         }\n   73 |                 } else {\n   74 |                         client->i_buffer += len;\n   75 |                         if (client->i_buffer >= client->n_buffer)\n   76 |                                 hup = true;\n   77 |                         else\n   78 |                                 dispatch_file_clear(file, EPOLLOUT);\n   79 |                 }","lines":39,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/bus/metrics.c#L41-L79"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"driver_method_get_adt_audit_session_data() performs a peer lookup\n(bus_find_peer_by_name) and stores the result in `connection`, which is then\nnever used; the function unconditionally returns DRIVER_E_ADT_NOT_SUPPORTED. The\nlookup's only purpose is to return DRIVER_E_PEER_NOT_FOUND for a nonexistent\nname, but this leaks whether a name exists before reporting the feature\nunsupported, and the dead `connection` assignment is confusing. The reference\ndbus-daemon returns the not-supported error without first probing name\nexistence.","fix":"Either drop the peer lookup entirely and just return DRIVER_E_ADT_NOT_SUPPORTED, or mark the lookup's intent clearly; remove the unused `connection` result.","locations":[{"ref":"src/bus/driver.c:1485-1506","code":" 1485 | static int driver_method_get_adt_audit_session_data(Peer *peer, const char *path, CDVar *in_v, uint32_t serial, CDVar *out_v) {\n 1486 |         Peer *connection;\n 1487 |         const char *name;\n 1488 |         int r;\n 1489 | \n 1490 |         c_dvar_read(in_v, \"(s)\", &name);\n 1491 | \n 1492 |         r = driver_end_read(in_v);\n 1493 |         if (r)\n 1494 |                 return error_trace(r);\n 1495 | \n 1496 |         if (strcmp(name, \"org.freedesktop.DBus\")) {\n 1497 |                 connection = bus_find_peer_by_name(peer->bus, NULL, name);\n 1498 |                 if (!connection)\n 1499 |                         return DRIVER_E_PEER_NOT_FOUND;\n 1500 |         }\n 1501 | \n 1502 |         /*\n 1503 |          * ADT Audit Session Data is not supported on Linux\n 1504 |          */\n 1505 |         return DRIVER_E_ADT_NOT_SUPPORTED;\n 1506 | }","lines":22,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/bus/driver.c#L1485-L1506"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"config_parser_attrs_* handlers report invalid attribute values via CONFIG_ERR (which only prints to stderr) and then continue/return 0 as if successful, leaving the corresponding node field at its default. For example an invalid send_type/recv_type/limit-name value just logs and proceeds, so a typo in a security policy attribute is not fatal and yields a policy different from what the admin wrote. dbus-daemon(1) compatibility may justify this, but the failure mode (silently weakened policy) is worth flagging.","fix":"Confirm this lenient behavior is intended for compatibility; if not, escalate invalid security-relevant attribute values to a CONFIG_E_INVALID so the bad config is rejected rather than silently misinterpreted.","locations":[{"ref":"src/launch/config.c:478-488","code":"  478 |                 } else if (!strcmp(k, \"send_type\")) {\n  479 |                         if (!strcmp(v, \"method_call\"))\n  480 |                                 node->allow_deny.send_type = DBUS_MESSAGE_TYPE_METHOD_CALL;\n  481 |                         else if (!strcmp(v, \"method_return\"))\n  482 |                                 node->allow_deny.send_type = DBUS_MESSAGE_TYPE_METHOD_RETURN;\n  483 |                         else if (!strcmp(v, \"signal\"))\n  484 |                                 node->allow_deny.send_type = DBUS_MESSAGE_TYPE_SIGNAL;\n  485 |                         else if (!strcmp(v, \"error\"))\n  486 |                                 node->allow_deny.send_type = DBUS_MESSAGE_TYPE_ERROR;\n  487 |                         else\n  488 |                                 CONFIG_ERR(state, \"Invalid value\", \": %s=\\\"%s\\\"\", k, v);","lines":11,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/launch/config.c#L478-L488"},{"ref":"src/launch/config.c:347-408","code":"  347 | static int config_parser_attrs_limit(ConfigState *state, ConfigNode *node, const XML_Char **attrs) {\n  348 |         const char *k, *v;\n  349 | \n  350 |         while (*attrs) {\n  351 |                 k = *(attrs++);\n  352 |                 v = *(attrs++);\n  353 | \n  354 |                 if (!strcmp(k, \"name\")) {\n  355 |                         if (!strcmp(v, \"max_incoming_bytes\"))\n  356 |                                 node->limit.name = CONFIG_LIMIT_MAX_INCOMING_BYTES;\n  357 |                         else if (!strcmp(v, \"max_incoming_unix_fds\"))\n  358 |                                 node->limit.name = CONFIG_LIMIT_MAX_INCOMING_UNIX_FDS;\n  359 |                         else if (!strcmp(v, \"max_outgoing_bytes\"))\n  360 |                                 node->limit.name = CONFIG_LIMIT_MAX_OUTGOING_BYTES;\n  361 |                         else if (!strcmp(v, \"max_outgoing_unix_fds\"))\n  362 |                                 node->limit.name = CONFIG_LIMIT_MAX_OUTGOING_UNIX_FDS;\n  363 |                         else if (!strcmp(v, \"max_message_size\"))\n  364 |                                 node->limit.name = CONFIG_LIMIT_MAX_MESSAGE_SIZE;\n  365 |                         else if (!strcmp(v, \"max_message_unix_fds\"))\n  366 |                                 node->limit.name = CONFIG_LIMIT_MAX_MESSAGE_UNIX_FDS;\n  367 |                         else if (!strcmp(v, \"service_start_timeout\"))\n  368 |                                 node->limit.name = CONFIG_LIMIT_SERVICE_START_TIMEOUT;\n  369 |                         else if (!strcmp(v, \"auth_timeout\"))\n  370 |                                 node->limit.name = CONFIG_LIMIT_AUTH_TIMEOUT;\n  371 |                         else if (!strcmp(v, \"pending_fd_timeout\"))\n  372 |                                 node->limit.name = CONFIG_LIMIT_PENDING_FD_TIMEOUT;\n  373 |                         else if (!strcmp(v, \"max_completed_connections\"))\n  374 |                                 node->limit.name = CONFIG_LIMIT_MAX_COMPLETED_CONNECTIONS;\n  375 |                         else if (!strcmp(v, \"max_incomplete_connections\"))\n  376 |                                 node->limit.name = CONFIG_LIMIT_MAX_INCOMPLETE_CONNECTIONS;\n  377 |                         else if (!strcmp(v, \"max_connections_per_user\"))\n  378 |                                 node->limit.name = CONFIG_LIMIT_MAX_CONNECTIONS_PER_USER;\n  379 |                         else if (!strcmp(v, \"max_pending_service_starts\"))\n  380 |                                 node->limit.name = CONFIG_LIMIT_MAX_PENDING_SERVICE_STARTS;\n  381 |                         else if (!strcmp(v, \"max_names_per_connection\"))\n  382 |                                 node->limit.name = CONFIG_LIMIT_MAX_NAMES_PER_CONNECTION;\n  383 |                         else if (!strcmp(v, \"max_match_rules_per_connection\"))\n  384 |                                 node->limit.name = CONFIG_LIMIT_MAX_MATCH_RULES_PER_CONNECTION;\n  385 |                         else if (!strcmp(v, \"max_replies_per_connection\"))\n  386 |                                 node->limit.name = CONFIG_LIMIT_MAX_REPLIES_PER_CONNECTION;\n  387 |                         else if (!strcmp(v, \"max_containers_per_user\"))\n  388 |                                 node->limit.name = CONFIG_LIMIT_MAX_CONTAINERS_PER_USER;\n  389 |                         else if (!strcmp(v, \"max_containers\"))\n  390 |                                 node->limit.name = CONFIG_LIMIT_MAX_CONTAINERS;\n  391 |                         else if (!strcmp(v, \"max_connections_per_container\"))\n  392 |                                 node->limit.name = CONFIG_LIMIT_MAX_CONNECTIONS_PER_CONTAINER;\n  393 |                         else if (!strcmp(v, \"max_container_metadata_bytes\"))\n  394 |                                 node->limit.name = CONFIG_LIMIT_MAX_CONTAINER_METADATA_BYTES;\n  395 |                         else if (!strcmp(v, \"reply_timeout\"))\n  396 |                                 node->limit.name = CONFIG_LIMIT_REPLY_TIMEOUT;\n  397 |                         else\n  398 |                                 CONFIG_ERR(state, \"Invalid value\", \": %s=\\\"%s\\\"\", k, v);\n  399 |                 } else {\n  400 |                         CONFIG_ERR(state, \"Unknown attribute\", \": %s=\\\"%s\\\"\", k, v);\n  401 |                 }\n  402 |         }\n  403 | \n  404 |         if (!node->limit.name)\n  405 |                 CONFIG_ERR(state, \"Required attribute 'name' missing\", \"\");\n  406 | \n  407 |         return 0;\n  408 | }","lines":62,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/launch/config.c#L347-L408"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"nss_cache_get_uid()/nss_cache_get_gid() treat a numeric name as an id only when 'id < UINT32_MAX'. This excludes the value 4294967295 (UINT32_MAX) from ever being resolved by-id; such an input falls through to a name lookup (getpwnam(\"4294967295\")) which will fail. While UINT32_MAX is the (uint32_t)-1 'invalid' sentinel and is unlikely to be a real uid, the boundary should be '<= UINT32_MAX' or explicitly documented, since dbus-daemon accepts the full 32-bit range for numeric ids.","fix":"Use 'id <= UINT32_MAX' (with the existing -1 sentinel handled separately), or add a comment explaining the deliberate exclusion of UINT32_MAX.","locations":[{"ref":"src/launch/nss-cache.c:336-338","code":"  336 |         id = strtoull(name, &end, 10);\n  337 |         if (end != name && *end == '\\0' && errno == 0 && id < UINT32_MAX)\n  338 |                 by_id = true;","lines":3,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/launch/nss-cache.c#L336-L338"},{"ref":"src/launch/nss-cache.c:425-426","code":"  425 |         id = strtoull(name, &end, 10);\n  426 |         if (end != name && *end == '\\0' && errno == 0 && id < UINT32_MAX)","lines":2,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/launch/nss-cache.c#L425-L426"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"policy_import_connect() rejects a record when '(cnode->allow_deny.user == cnode->allow_deny.group)'. Because policy_import() only routes to policy_import_connect() when user||group is set, the both-false case never occurs here, so this is effectively 'reject when user && group both set'. That intent is fine, but the comparison is obscure and silently 'returns 0' (success) after printing to stderr, so a malformed '<allow user=.. group=..>' rule is dropped without any non-zero result the caller can act on. Combined with the wrong-id copy-paste bug above, the connect-policy import path is fragile.","fix":"Make the condition explicit (e.g. 'if (cnode->allow_deny.user && cnode->allow_deny.group)') and add a comment; consider whether such malformed rules should be a hard config error rather than a silently-dropped rule.","locations":[{"ref":"src/launch/policy.c:283-304","code":"  283 |         if ((cnode->allow_deny.user == cnode->allow_deny.group) ||\n  284 |             cnode->allow_deny.own ||\n  285 |             cnode->allow_deny.own_prefix ||\n  286 |             cnode->allow_deny.send_interface ||\n  287 |             cnode->allow_deny.send_member ||\n  288 |             cnode->allow_deny.send_error ||\n  289 |             cnode->allow_deny.send_destination ||\n  290 |             cnode->allow_deny.send_path ||\n  291 |             cnode->allow_deny.send_type ||\n  292 |             cnode->allow_deny.send_broadcast ||\n  293 |             cnode->allow_deny.send_requested_reply ||\n  294 |             cnode->allow_deny.recv_interface ||\n  295 |             cnode->allow_deny.recv_member ||\n  296 |             cnode->allow_deny.recv_error ||\n  297 |             cnode->allow_deny.recv_sender ||\n  298 |             cnode->allow_deny.recv_path ||\n  299 |             cnode->allow_deny.recv_type ||\n  300 |             cnode->allow_deny.recv_requested_reply) {\n  301 |                 fprintf(stderr, \"Invalid policy attribute combination in %s +%lu\\n\",\n  302 |                         cnode->file, cnode->lineno);\n  303 |                 return 0;\n  304 |         }","lines":22,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/launch/policy.c#L283-L304"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"selinux.c bus_selinux_log_fn() is registered via selinux_set_callback() and may be invoked from inside libselinux at any time, including before bus_selinux_log is set or after bus_selinux_deinit_global() sets it back to NULL. It dereferences bus_selinux_log only under a NULL check (good), but it also calls util_audit_log()/getuid() unconditionally for AVC/POLICYLOAD/SETENFORCE types; if the callback fires during deinit teardown after util_audit_deinit_global() already ran, util_audit_log() returns UTIL_AUDIT_E_UNAVAILABLE and then tries bus_selinux_log which may be NULL -> message silently dropped. Ordering of deinit (audit vs selinux) is a latent coupling: if selinux is destroyed after audit, late callbacks lose their record.","fix":"Ensure avc_destroy()/selinux callback removal happens before util_audit_deinit_global(), or clear the SELINUX_CB_LOG callback at the start of bus_selinux_deinit_global().","locations":[{"ref":"src/util/selinux.c:311-383","code":"  311 | static int bus_selinux_log_fn(int type, const char *fmt, ...) {\n  312 |         _c_cleanup_(c_freep) char *message = NULL;\n  313 |         const char *loghdr = NULL;\n  314 |         va_list ap;\n  315 |         int r, loglvl = 0;\n  316 | \n  317 |         va_start(ap, fmt);\n  318 |         r = vasprintf(&message, fmt, ap);\n  319 |         va_end(ap);\n  320 |         if (r < 0)\n  321 |                 return r;\n  322 | \n  323 |         switch (type) {\n  324 |         case SELINUX_AVC:\n  325 |                 /* XXX: we don't have access to any context, so can't find\n  326 |                  * the right UID to use, follow dbus-daemon(1) and use our\n  327 |                  * own. */\n  328 |                 r = util_audit_log(UTIL_AUDIT_TYPE_AVC, message, getuid());\n  329 |                 if (r == UTIL_AUDIT_E_UNAVAILABLE) {\n  330 |                         loghdr = \"selinux/avc\";\n  331 |                         loglvl = LOG_INFO;\n  332 |                 } else if (r) {\n  333 |                         return error_fold(r);\n  334 |                 }\n  335 | \n  336 |                 break;\n  337 |         case SELINUX_POLICYLOAD:\n  338 |                 r = util_audit_log(UTIL_AUDIT_TYPE_POLICYLOAD, message, getuid());\n  339 |                 if (r == UTIL_AUDIT_E_UNAVAILABLE) {\n  340 |                         loghdr = \"selinux/policyload\";\n  341 |                         loglvl = LOG_INFO;\n  342 |                 } else if (r) {\n  343 |                         return error_fold(r);\n  344 |                 }\n  345 | \n  346 |                 break;\n  347 |         case SELINUX_SETENFORCE:\n  348 |                 r = util_audit_log(UTIL_AUDIT_TYPE_MAC_STATUS, message, getuid());\n  349 |                 if (r == UTIL_AUDIT_E_UNAVAILABLE) {\n  350 |                         loghdr = \"selinux/macstatus\";\n  351 |                         loglvl = LOG_INFO;\n  352 |                 } else if (r) {\n  353 |                         return error_fold(r);\n  354 |                 }\n  355 | \n  356 |                 break;\n  357 |         case SELINUX_ERROR:\n  358 |                 loghdr = \"selinux/error\";\n  359 |                 loglvl = LOG_ERR;\n  360 |                 break;\n  361 |         case SELINUX_WARNING:\n  362 |                 loghdr = \"selinux/warning\";\n  363 |                 loglvl = LOG_WARNING;\n  364 |                 break;\n  365 |         case SELINUX_INFO:\n  366 |                 loghdr = \"selinux/info\";\n  367 |                 loglvl = LOG_INFO;\n  368 |                 break;\n  369 |         default:\n  370 |                 loghdr = \"selinux/unknown\";\n  371 |                 loglvl = LOG_WARNING;\n  372 |                 break;\n  373 |         }\n  374 | \n  375 |         if (loghdr && bus_selinux_log) {\n  376 |                 log_append_here(bus_selinux_log, loglvl, 0, NULL);\n  377 |                 r = log_commitf(bus_selinux_log, \"%s: %s\", loghdr, message);\n  378 |                 if (r)\n  379 |                         return error_fold(r);\n  380 |         }\n  381 | \n  382 |         return 0;\n  383 | }","lines":73,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/util/selinux.c#L311-L383"},{"ref":"src/util/selinux.c:453-468","code":"  453 | void bus_selinux_deinit_global(void) {\n  454 |         if (!is_selinux_enabled())\n  455 |                 return;\n  456 | \n  457 |         if (bus_selinux_status_open) {\n  458 |                 selinux_status_close();\n  459 |                 bus_selinux_status_open = false;\n  460 |         }\n  461 | \n  462 |         if (bus_selinux_avc_open) {\n  463 |                 avc_destroy();\n  464 |                 bus_selinux_avc_open = false;\n  465 |         }\n  466 | \n  467 |         bus_selinux_log = NULL;\n  468 | }","lines":16,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/util/selinux.c#L453-L468"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"In the METHOD_RETURN log branch the reply-serial field is emitted as 'MESSAGE_REPLY_SERIAL' while every other field uses the 'DBUS_BROKER_MESSAGE_*' namespace (the ERROR branch correctly uses 'DBUS_BROKER_MESSAGE_REPLY_SERIAL'). The inconsistent key makes log filtering/parsing miss the field for method-return messages.","fix":"Rename the key to 'DBUS_BROKER_MESSAGE_REPLY_SERIAL' for consistency with the rest of the log schema.","locations":[{"ref":"src/dbus/message.c:684-689","code":"  684 |         case DBUS_MESSAGE_TYPE_METHOD_RETURN:\n  685 |                 log_appendf(log,\n  686 |                             \"DBUS_BROKER_MESSAGE_TYPE=method_return\\n\"\n  687 |                             \"MESSAGE_REPLY_SERIAL=%\"PRIu32\"\\n\",\n  688 |                             message->metadata.fields.reply_serial);\n  689 |                 break;","lines":6,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/dbus/message.c#L684-L689"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"medium","description":"log_journal_send() out_drop path: on the memfd-send branch it consumes log->mem_fd (sets to -1) and munmaps before sealing/sending. If misc_memfd_add_seals() or log_fd_send() fails it returns an error, but log->map is already MAP_FAILED and log->mem_fd is -1, so the next log_alloc() will re-allocate a fresh memfd (mem_fd was moved into local mfd and closed by cleanup). State is consistent. However, the inflight-memfd accounting note (lines 410-417) warns clients must never trigger this path; there is no runtime guard preventing a peer from inducing oversized log messages, relying entirely on callers not logging attacker-sized data. Documented risk, not enforced.","fix":"No code change strictly required; ensure callers never format attacker-controlled unbounded data into peer-triggered log messages (enforced by convention only).","locations":[{"ref":"src/util/log.c:437-461","code":"  437 |         if (log->lossy || log->mem_fd < 0)\n  438 |                 goto out_drop;\n  439 | \n  440 |         mfd = log->mem_fd;\n  441 |         log->mem_fd = -1;\n  442 |         munmap(log->map, log->map_size);\n  443 |         log->map = MAP_FAILED;\n  444 | \n  445 |         r = ftruncate(mfd, log->offset);\n  446 |         if (r < 0)\n  447 |                 return error_origin(-errno);\n  448 | \n  449 |         r = misc_memfd_add_seals(\n  450 |                 mfd,\n  451 |                 MISC_F_SEAL_SEAL | MISC_F_SEAL_SHRINK |\n  452 |                 MISC_F_SEAL_GROW | MISC_F_SEAL_WRITE\n  453 |         );\n  454 |         if (r < 0)\n  455 |                 return error_origin(-errno);\n  456 | \n  457 |         r = log_fd_send(log->log_fd, mfd);\n  458 |         if (r < 0)\n  459 |                 return error_trace(r);\n  460 | \n  461 |         return 0;","lines":25,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/util/log.c#L437-L461"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"medium","description":"user_charge_check() computes `users + 1` in unsigned int without overflow check before passing to __builtin_mul_overflow. If users (User.n_usages) ever reached UINT_MAX, users+1 wraps to 0, the multiply yields 0 with no overflow flagged, and the subsequent sub_overflow(0, share) underflows and is caught -> USER_E_QUOTA. So the failure mode is safe (denies). Reachability requires ~4 billion distinct UIDs pinning one user's resources, which is not practically attainable.","fix":"Optionally guard users == UINT_MAX explicitly; practically unreachable so low priority.","locations":[{"ref":"src/util/user.c:131-162","code":"  131 | static int user_charge_check(unsigned int remaining,\n  132 |                              unsigned int users,\n  133 |                              unsigned int share,\n  134 |                              unsigned int charge) {\n  135 |         unsigned int limit;\n  136 | \n  137 |         /*\n  138 |          * For a given allocation scheme `A(users)`, a single allocation is\n  139 |          * allowed to request anything less than, or equal to:\n  140 |          *\n  141 |          *               remaining + share\n  142 |          *     charge <= ~~~~~~~~~~~~~~~~~ - share\n  143 |          *                   A(users)\n  144 |          *\n  145 |          * We want to avoid a division, so instead we modify the equation to\n  146 |          * end up as:\n  147 |          *\n  148 |          *     A(users) * (charge + share) - share <= remaining\n  149 |          *\n  150 |          * Note that currently we use an allocator with polynomial guarantees:\n  151 |          *\n  152 |          *     A(users) = users + 1\n  153 |          */\n  154 | \n  155 |         if (!__builtin_add_overflow(share, charge, &limit) &&\n  156 |             !__builtin_mul_overflow(limit, users + 1, &limit) &&\n  157 |             !__builtin_sub_overflow(limit, share, &limit) &&\n  158 |             limit <= remaining)\n  159 |                 return 0;\n  160 | \n  161 |         return USER_E_QUOTA;\n  162 | }","lines":32,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/util/user.c#L131-L162"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"medium","description":"In metrics_client_new_with_fd(), after initializing the per-client dispatch file (client->socket_file), the code calls dispatch_file_select(&metrics->socket_file, EPOLLHUP | EPOLLOUT) on the parent listener's socket_file instead of the newly created client's socket_file. This selects EPOLLOUT on the listening socket (wrong object) and fails to arm output-readiness wakeups on the client connection. The client's events were only set via dispatch_file_init's mask argument; the explicit select targets the wrong file.","fix":"Select on the client file: `dispatch_file_select(&client->socket_file, EPOLLHUP | EPOLLOUT);`.","locations":[{"ref":"src/bus/metrics.c:89-117","code":"   89 | static int metrics_client_new_with_fd(MetricsClient **clientp, Metrics *metrics, int fd) {\n   90 |         _c_cleanup_(metrics_client_freep) MetricsClient *client = NULL;\n   91 |         int r;\n   92 | \n   93 |         client = calloc(1, sizeof(*client));\n   94 |         if (!client)\n   95 |                 return error_origin(-ENOMEM);\n   96 | \n   97 |         c_list_link_tail(&metrics->client_list, &client->metrics_link);\n   98 |         client->socket_fd = -1;\n   99 | \n  100 |         r = dispatch_file_init(\n  101 |                 &client->socket_file,\n  102 |                 metrics->socket_file.context,\n  103 |                 metrics_client_dispatch,\n  104 |                 fd,\n  105 |                 EPOLLHUP | EPOLLOUT,\n  106 |                 EPOLLOUT\n  107 |         );\n  108 |         if (r)\n  109 |                 return error_fold(r);\n  110 | \n  111 |         client->socket_fd = fd;\n  112 |         dispatch_file_select(&metrics->socket_file, EPOLLHUP | EPOLLOUT);\n  113 | \n  114 |         *clientp = client;\n  115 |         client = NULL;\n  116 |         return 0;\n  117 | }","lines":29,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/bus/metrics.c#L89-L117"}]},
{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"diag_append_message() logs DBUS_BROKER_MESSAGE_TYPE=method_return for messages of type DBUS_MESSAGE_TYPE_ERROR. The ERROR branch is a copy of the METHOD_RETURN branch and was not updated, so error messages are mislabeled as method returns in diagnostic logs, which can confuse policy/quota debugging.","fix":"Change the ERROR branch format string to `DBUS_BROKER_MESSAGE_TYPE=error\\n`.","locations":[{"ref":"src/bus/diag.c:110-119","code":"  110 |         case DBUS_MESSAGE_TYPE_ERROR:\n  111 |                 log_appendf(\n  112 |                         log,\n  113 |                         \"DBUS_BROKER_MESSAGE_TYPE=method_return\\n\"\n  114 |                         \"DBUS_BROKER_MESSAGE_ERROR_NAME=%s\\n\"\n  115 |                         \"DBUS_BROKER_MESSAGE_REPLY_SERIAL=%\"PRIu32\"\\n\",\n  116 |                         message->metadata.fields.error_name,\n  117 |                         message->metadata.fields.reply_serial\n  118 |                 );\n  119 |                 break;","lines":10,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/bus/diag.c#L110-L119"}]},
{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"In the structured log output, the DBUS_MESSAGE_TYPE_ERROR case emits 'DBUS_BROKER_MESSAGE_TYPE=method_return' instead of 'error'. This is a copy-paste from the METHOD_RETURN branch and produces misleading audit/journal logs that mislabel error replies as method returns.","fix":"Change the type string for the ERROR case to 'DBUS_BROKER_MESSAGE_TYPE=error'.","locations":[{"ref":"src/dbus/message.c:690-697","code":"  690 |         case DBUS_MESSAGE_TYPE_ERROR:\n  691 |                 log_appendf(log,\n  692 |                             \"DBUS_BROKER_MESSAGE_TYPE=method_return\\n\"\n  693 |                             \"DBUS_BROKER_MESSAGE_ERROR_NAME=%s\\n\"\n  694 |                             \"DBUS_BROKER_MESSAGE_REPLY_SERIAL=%\"PRIu32\"\\n\",\n  695 |                             message->metadata.fields.error_name,\n  696 |                             message->metadata.fields.reply_serial);\n  697 |                 break;","lines":8,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/dbus/message.c#L690-L697"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"medium","description":"launcher_reload_config() sends sd_notifyf(\"RELOADING=1\") at the top, and the 'out:' label re-sends \"READY=1\". But several error paths use bare 'return error_trace(r)' / 'return error_fold(r)' instead of 'goto out': the at_console resolve failure (1281-1282), the apparmor_apply failure (1294-1295), and the CONFIG_APPARMOR_REQUIRED branch (1296-1301). Taking any of these paths leaves systemd believing the unit is permanently in the 'reloading' state (READY=1 is never sent), which can block dependent jobs and the service-manager state machine. The CONFIG_APPARMOR_REQUIRED path additionally calls sd_event_exit() but still skips READY=1.","fix":"Replace the bare 'return' statements in the reload flow with 'goto out' (storing the error in r) so the READY=1 notification is always re-sent after a RELOADING=1 was issued.","locations":[{"ref":"src/launch/launcher.c:1262-1304","code":" 1262 |         r = sd_notifyf(/* unset_environment = */ false,\n 1263 |                        \"RELOADING=1\\n\"\n 1264 |                        \"MONOTONIC_USEC=%\" NSEC_PRI,\n 1265 |                        nsec_to_usec(nsec_now(CLOCK_MONOTONIC)));\n 1266 |         if (r < 0)\n 1267 |                 return error_origin(r);\n 1268 | \n 1269 |         c_rbtree_for_each_entry(service, &launcher->services, rb)\n 1270 |                 service->reload_tag = false;\n 1271 | \n 1272 |         r = nss_cache_populate(&nss_cache);\n 1273 |         if (r)\n 1274 |                 goto out;\n 1275 | \n 1276 |         r = launcher_parse_config(launcher, &root, &nss_cache);\n 1277 |         if (r)\n 1278 |                 goto out;\n 1279 | \n 1280 |         if (launcher->at_console) {\n 1281 |                 r = nss_cache_resolve_system_console_users(&nss_cache,\n 1282 |                                                            &system_console_users,\n 1283 |                                                            &n_system_console_users);\n 1284 |                 if (r)\n 1285 |                         return error_trace(r);\n 1286 |         }\n 1287 | \n 1288 |         r = launcher_load_services(launcher, root, &nss_cache);\n 1289 |         if (r)\n 1290 |                 goto out;\n 1291 | \n 1292 |         r = launcher_load_policy(launcher, root, &policy);\n 1293 |         if (r)\n 1294 |                 goto out;\n 1295 | \n 1296 |         r = launcher_apparmor_apply(&policy.apparmor_mode);\n 1297 |         if (r < 0)\n 1298 |                 return error_fold(r);\n 1299 |         if (policy.apparmor_mode == CONFIG_APPARMOR_REQUIRED) {\n 1300 |                 r = sd_event_exit(launcher->event, 0);\n 1301 |                 if (r < 0)\n 1302 |                         return error_fold(r);\n 1303 |                 return 0;\n 1304 |         }","lines":43,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/launch/launcher.c#L1262-L1304"},{"ref":"src/launch/launcher.c:1318-1323","code":" 1318 | out:\n 1319 |         res = sd_notify(false, \"READY=1\");\n 1320 |         if (res < 0)\n 1321 |                 return error_origin(res);\n 1322 | \n 1323 |         return error_trace(r);","lines":6,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/launch/launcher.c#L1318-L1323"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"driver_method_get_connection_credentials() builds the reply containing the\npeer's pidfd. cred.pid_fd is the *original* peer fd (from peer->pid_fd). It is\npassed to driver_send_reply_with_fds() which calls fdlist_new_dup_fds() to dup\nit, so the original is not consumed - good. However, if message_new_outgoing()\nor fdlist_new_dup_fds() fails after c_dvar_end_write() succeeds, the function\nreturns a folded fatal error and the broker treats the whole dispatch as fatal.\nThat is the intended \"fatal on reply-build failure\" contract, but note the fd is\nnever explicitly closed here because it is borrowed; this is correct only as\nlong as peer->pid_fd lifetime is owned elsewhere. Flagging for confirmation that\npeer->pid_fd is never closed by this path on error.","fix":"Confirm peer->pid_fd ownership stays with the Peer (it does, since only a dup is queued); add a comment documenting that pid_fd is borrowed and must not be closed here, to prevent a future double-close/use-after-free.","locations":[{"ref":"src/bus/driver.c:1465-1480","code":" 1465 |         driver_fetch_credentials(peer->bus, connection, &cred);\n 1466 |         n_fds_expected = (cred.pid_fd >= 0) ? 1 : 0;\n 1467 |         driver_write_reply_header(out_v, peer, serial, driver_type_out_apsv, n_fds_expected);\n 1468 | \n 1469 |         c_dvar_write(out_v, \"(\");\n 1470 |         driver_append_credentials(out_v, &cred, &n_fds);\n 1471 |         c_dvar_write(out_v, \")\");\n 1472 | \n 1473 |         c_assert(n_fds == n_fds_expected);\n 1474 | \n 1475 |         if (n_fds == 1)\n 1476 |                 r = driver_send_reply_with_fds(peer, out_v, serial, &cred.pid_fd, n_fds);\n 1477 |         else\n 1478 |                 r = driver_send_reply(peer, out_v, serial);\n 1479 |         if (r)\n 1480 |                 return error_trace(r);","lines":16,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/bus/driver.c#L1465-L1480"},{"ref":"src/bus/driver.c:530-534","code":"  530 |         if (n_fds > 0) {\n  531 |                 r = fdlist_new_dup_fds(&message->fds, fds, n_fds);\n  532 |                 if (r)\n  533 |                         return error_fold(r);\n  534 |         }","lines":5,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/bus/driver.c#L530-L534"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"launcher_apparmor_apply() prints 'AppArmor required, but not supported. Exiting.' for the CONFIG_APPARMOR_REQUIRED case but returns 0 and leaves *apparmor_mode == CONFIG_APPARMOR_REQUIRED. The caller in launcher_run() then returns 0 (success) on this path (line 1432-1433), so the launcher exits with status 0 despite a fatal 'required AppArmor missing' condition. A required-but-unavailable security feature should cause a non-zero/visible failure, not a silent clean exit.","fix":"Return a distinct error (or set an explicit failure flag) from launcher_apparmor_apply() in the REQUIRED-but-unsupported case and propagate a non-zero exit, rather than relying on the ambiguous mode value and returning 0.","locations":[{"ref":"src/launch/launcher.c:1242-1247","code":" 1242 |         } else if (*apparmor_mode == CONFIG_APPARMOR_REQUIRED) {\n 1243 |                 if (enabled && supported)\n 1244 |                         *apparmor_mode = CONFIG_APPARMOR_ENABLED;\n 1245 |                 else\n 1246 |                         fprintf(stderr, \"AppArmor required, but not supported. Exiting.\\n\");\n 1247 |         }","lines":6,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/launch/launcher.c#L1242-L1247"},{"ref":"src/launch/launcher.c:1432-1436","code":" 1432 |         r = launcher_apparmor_apply(&policy.apparmor_mode);\n 1433 |         if (r < 0)\n 1434 |                 return error_fold(r);\n 1435 |         if (policy.apparmor_mode == CONFIG_APPARMOR_REQUIRED)\n 1436 |                 return 0;","lines":5,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/launch/launcher.c#L1432-L1436"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"broker_run() returns early via MAIN_EXIT when connection_open() reports CONNECTION_E_EOF (broker.c:168-169) without restoring the signal mask saved into sigold and without running the peer_registry_flush()/diag_dispatch_stats() teardown that the normal exit path performs (broker.c:183-189). The leaked block mask is benign because the process exits shortly after, but the early return also skips the final statistics dispatch, which is a behavioral inconsistency with the normal exit path.","fix":"Use a goto to a common teardown label (restore sigmask, flush peers, dispatch stats) for both the early-EOF return and the normal loop exit, or at minimum restore the signal mask before returning MAIN_EXIT.","locations":[{"ref":"src/broker/broker.c:160-195","code":"  160 | int broker_run(Broker *broker) {\n  161 |         sigset_t signew, sigold;\n  162 |         int r, k;\n  163 | \n  164 |         sigemptyset(&signew);\n  165 |         sigaddset(&signew, SIGTERM);\n  166 |         sigaddset(&signew, SIGINT);\n  167 | \n  168 |         sigprocmask(SIG_BLOCK, &signew, &sigold);\n  169 | \n  170 |         r = connection_open(&broker->controller.connection);\n  171 |         if (r == CONNECTION_E_EOF)\n  172 |                 return MAIN_EXIT;\n  173 |         else if (r)\n  174 |                 return error_fold(r);\n  175 | \n  176 |         do {\n  177 |                 r = dispatch_context_dispatch(&broker->dispatcher);\n  178 |                 if (r == DISPATCH_E_EXIT)\n  179 |                         r = MAIN_EXIT;\n  180 |                 else if (r == DISPATCH_E_FAILURE)\n  181 |                         r = MAIN_FAILED;\n  182 |                 else\n  183 |                         r = error_fold(r);\n  184 |         } while (!r);\n  185 | \n  186 |         peer_registry_flush(&broker->bus.peers);\n  187 | \n  188 |         k = diag_dispatch_stats(&broker->bus, LOG_PROVENANCE_HERE);\n  189 |         if (k)\n  190 |                 r = error_fold(k);\n  191 | \n  192 |         sigprocmask(SIG_SETMASK, &sigold, NULL);\n  193 | \n  194 |         return r;\n  195 | }","lines":36,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/broker/broker.c#L160-L195"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"metrics_client_dispatch() EPOLLOUT send() success path treats a short or zero-length send as completion: after `i_buffer += len`, if `i_buffer >= n_buffer` it hups. With the n_buffer bug this always fires, but even after fixing n_buffer, a send() returning 0 (peer closed) is indistinguishable from completion only because the >= happens to hup anyway; more importantly EAGAIN handling clears EPOLLOUT but the send loop does not retry within the same dispatch, relying on re-arm. This is acceptable but the success branch lacks a retry loop, so each writable event sends at most one chunk.","fix":"Optional: loop on send() until EAGAIN or completion within a single dispatch to reduce wakeups; at minimum ensure n_buffer is set so the completion check is meaningful.","locations":[{"ref":"src/bus/metrics.c:73-79","code":"   73 |                 } else {\n   74 |                         client->i_buffer += len;\n   75 |                         if (client->i_buffer >= client->n_buffer)\n   76 |                                 hup = true;\n   77 |                         else\n   78 |                                 dispatch_file_clear(file, EPOLLOUT);\n   79 |                 }","lines":7,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/bus/metrics.c#L73-L79"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"service_watch_unit_load_handler() calls service_reset_activation() on the error path (when LoadUnit returned a bus error) but discards its return value, then returns 1. Every other caller of service_reset_activation() checks and propagates its result. A failure here (e.g. the controller bus call inside reset failing) is silently swallowed, potentially leaving a pending activation un-reset.","fix":"Capture the return value: r = service_reset_activation(...); if (r) return error_trace(r);","locations":[{"ref":"src/launch/service.c:796-799","code":"  796 |         if (sd_bus_message_get_error(message)) {\n  797 |                 service_reset_activation(service, CONTROLLER_NAME_ERROR_UNIT_FAILURE);\n  798 |                 return 1;\n  799 |         }","lines":4,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/launch/service.c#L796-L799"}]},
{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"misc_memfd() only retries with the EXEC/NOEXEC flags stripped when the first memfd_create() fails with EINVAL. On kernels lacking memfd_create() entirely the syscall fails with ENOSYS, which is returned verbatim. log_alloc() in turn only treats -EINVAL as 'memfd unavailable, use anonymous mmap fallback' (log.c:241); an ENOSYS from a very old kernel is treated as a hard log error instead of triggering the anonymous-memory fallback, contradicting the comment at log.c:237-240 that claims the fallback covers 'memfd_create() is not available'.","fix":"In log_alloc(), treat both -EINVAL and -ENOSYS (and -EOPNOTSUPP) from misc_memfd() as 'unavailable' and fall back to anonymous mmap.","locations":[{"ref":"src/util/misc.c:96-102","code":"   96 |         fd = syscall_memfd_create(name, flags);\n   97 |         if (fd < 0 && errno == EINVAL) {\n   98 |                 flags &= ~(MISC_MFD_EXEC | MISC_MFD_NOEXEC_SEAL);\n   99 |                 fd = syscall_memfd_create(name, flags);\n  100 |         }\n  101 |         if (fd < 0)\n  102 |                 return error_origin(-errno);","lines":7,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/util/misc.c#L96-L102"},{"ref":"src/util/log.c:239-254","code":"  239 |         if (mem_fd < 0) {\n  240 |                 /*\n  241 |                  * In case of EINVAL, memfd_create() is not available. We then\n  242 |                  * use normal anonymous memory as backing.\n  243 |                  */\n  244 |                 if (mem_fd != -EINVAL) {\n  245 |                         log->error = error_fold(mem_fd);\n  246 |                         return false;\n  247 |                 }\n  248 |                 mem_fd = -1;\n  249 | \n  250 |                 p = mmap(NULL, log->map_size, PROT_READ | PROT_WRITE, MAP_PRIVATE | MAP_ANONYMOUS, -1, 0);\n  251 |                 if (p == MAP_FAILED) {\n  252 |                         log->error = error_origin(-errno);\n  253 |                         return false;\n  254 |                 }","lines":16,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/util/log.c#L239-L254"}]},
{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"bus_selinux_log_fn() returns negative error codes (via error_fold) into libselinux, which is a void/int callback whose nonzero return is generally ignored by libselinux; more importantly vasprintf failure path `return r` (line 318) returns a raw negative errno without error_origin() wrapping, inconsistent with the codebase error-tracing convention and bypassing the trace hook.","fix":"Wrap the vasprintf failure return in error_origin(-errno) for consistent tracing; note libselinux ignores the return value anyway.","locations":[{"ref":"src/util/selinux.c:318-321","code":"  318 |         r = vasprintf(&message, fmt, ap);\n  319 |         va_end(ap);\n  320 |         if (r < 0)\n  321 |                 return r;","lines":4,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/util/selinux.c#L318-L321"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"dispatch_context_poll() sizes the event buffer with alloca(n) where n = ctx->n_files * sizeof(struct epoll_event), and passes ctx->n_files as maxevents to epoll_wait(). When n_files is 0 (no files registered) this calls alloca(0) (implementation-defined pointer) and epoll_wait(..., events, 0, ...) which returns EINVAL; the EINTR special-case does not cover this, so a poll with zero files yields error_origin(-EINVAL). More importantly, alloca() of an attacker-influenced size up to ~128KiB is on the stack with no guard; the 128KiB threshold switches to malloc, but 128KiB of alloca is still a large stack allocation that can collide with the stack guard on constrained stacks.","fix":"Guard against n_files == 0 (return 0 early). Consider lowering the alloca threshold substantially or always using a small fixed on-stack buffer plus heap for the remainder.","locations":[{"ref":"src/util/dispatch.c:264-288","code":"  264 | int dispatch_context_poll(DispatchContext *ctx, int timeout) {\n  265 |         _c_cleanup_(c_freep) void *buffer = NULL;\n  266 |         struct epoll_event *events, *e;\n  267 |         DispatchFile *f;\n  268 |         size_t n;\n  269 |         int r;\n  270 | \n  271 |         n = ctx->n_files * sizeof(*events);\n  272 |         if (n > 128UL * 1024UL) {\n  273 |                 buffer = malloc(n);\n  274 |                 if (!buffer)\n  275 |                         return error_origin(-ENOMEM);\n  276 | \n  277 |                 events = buffer;\n  278 |         } else {\n  279 |                 events = alloca(n);\n  280 |         }\n  281 | \n  282 |         r = epoll_wait(ctx->epoll_fd, events, ctx->n_files, timeout);\n  283 |         if (r < 0) {\n  284 |                 if (errno == EINTR)\n  285 |                         return 0;\n  286 | \n  287 |                 return error_origin(-errno);\n  288 |         }","lines":25,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/util/dispatch.c#L264-L288"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"connection_init_server() dereferences user->uid to pass it to sasl_server_init(), but socket_init()/connection_init() accept a NULL user (socket_init does user_ref(NULL)). If a NULL user is ever passed for a server connection this is a NULL dereference. The contract that server connections always have a non-NULL user is implicit and unchecked.","fix":"Add 'c_assert(user)' in connection_init_server() (or document/enforce the non-NULL precondition) to make the requirement explicit.","locations":[{"ref":"src/dbus/connection.c:46-65","code":"   46 | int connection_init_server(Connection *c,\n   47 |                            DispatchContext *dispatch_ctx,\n   48 |                            DispatchFn dispatch_fn,\n   49 |                            User *user,\n   50 |                            const char *guid,\n   51 |                            int fd) {\n   52 |         int r;\n   53 | \n   54 |         r = connection_init(c,\n   55 |                             dispatch_ctx,\n   56 |                             dispatch_fn,\n   57 |                             user,\n   58 |                             fd);\n   59 |         if (r)\n   60 |                 return error_trace(r);\n   61 | \n   62 |         c->server = true;\n   63 |         sasl_server_init(&c->sasl_server, user->uid, guid);\n   64 |         return 0;\n   65 | }","lines":20,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/dbus/connection.c#L46-L65"}]},
{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"proc_get_seclabel() uses fixed `char path[64]` with sprintf(\"/proc/%u/attr/current\", (uint32_t)pid). Max length is `/proc/` (6) + 10 digits + `/attr/current` (13) + NUL = 30, so no overflow today. proc_resolve_pidfd() likewise uses path[64] with sprintf(\"/proc/self/fdinfo/%d\", pidfd) (max ~30). These are safe but rely on unchecked sprintf into fixed buffers; a future format change could overflow silently.","fix":"Use snprintf with sizeof(path) (and assert the result < sizeof(path)) to make the bound explicit and overflow-proof against future edits.","locations":[{"ref":"src/util/proc.c:153-162","code":"  153 | int proc_get_seclabel(pid_t pid, char **labelp, size_t *n_labelp) {\n  154 |         _c_cleanup_(c_fclosep) FILE *f = NULL;\n  155 |         char path[64], buffer[LINE_MAX] = {}, *c, *label;\n  156 | \n  157 |         if (pid == PROC_PID_SELF)\n  158 |                 strcpy(path, \"/proc/self/attr/current\");\n  159 |         else if (pid > 0)\n  160 |                 sprintf(path, \"/proc/%\"PRIu32\"/attr/current\", (uint32_t)pid);\n  161 |         else\n  162 |                 return error_origin(-EINVAL);","lines":10,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/util/proc.c#L153-L162"},{"ref":"src/util/proc.c:192-199","code":"  192 | int proc_resolve_pidfd(int pidfd, pid_t *pidp) {\n  193 |         _c_cleanup_(c_freep) char *data = NULL, *field = NULL;\n  194 |         _c_cleanup_(c_closep) int fd = -1;\n  195 |         char path[64];\n  196 |         int r;\n  197 | \n  198 |         sprintf(path, \"/proc/self/fdinfo/%d\", pidfd);\n  199 |         fd = open(path, O_RDONLY | O_CLOEXEC);","lines":8,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/util/proc.c#L192-L199"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"driver_write_bytes() marshals a byte array one element at a time, issuing a\nseparate c_dvar_write(var, \"y\", ...) call per byte. For LinuxSecurityLabel\n(driver_append_credentials) and GetConnectionSELinuxSecurityContext this is\nproportional to the seclabel length; for arbitrary attacker-influenceable byte\nblobs this is an O(n) sequence of formatted-write calls instead of a bulk array\nwrite. Minor, but on a hot path (GetStats iterates every peer and writes each\npeer's seclabel this way).","fix":"Use the c-dvar bulk array-append API (e.g. c_dvar_write with an array of bytes) instead of a per-byte loop, if available in the c-dvar version in use.","locations":[{"ref":"src/bus/driver.c:243-248","code":"  243 | static void driver_write_bytes(CDVar *var, const char *bytes, size_t n_bytes) {\n  244 |         c_dvar_write(var, \"[\");\n  245 |         for (size_t i = 0; i < n_bytes; ++i)\n  246 |                 c_dvar_write(var, \"y\", bytes[i]);\n  247 |         c_dvar_write(var, \"]\");\n  248 | }","lines":6,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/bus/driver.c#L243-L248"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"Linear dispatch over method tables using strcmp per entry. Each controller method dispatch (controller_dispatch_controller/name/listener/metrics) scans its small static array calling strcmp for every candidate (controller-dbus.c:535-542 and the three analogous loops). The tables are tiny (1-3 entries) so this is not a real hot path, but it is O(n*strlen) per call where a length-prefixed or first-char comparison would short-circuit faster.","fix":"Acceptable as-is given table sizes; if ever extended, consider a first-character switch or perfect hash. No action strictly required.","locations":[{"ref":"src/broker/controller-dbus.c:538-545","code":"  538 |         for (size_t i = 0; i < C_ARRAY_SIZE(methods); i++) {\n  539 |                 if (strcmp(methods[i].name, method) != 0)\n  540 |                         continue;\n  541 | \n  542 |                 return controller_handle_method(&methods[i], controller, path, serial, signature, message);\n  543 |         }\n  544 | \n  545 |         return CONTROLLER_E_UNEXPECTED_METHOD;","lines":8,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/broker/controller-dbus.c#L538-L545"},{"ref":"src/broker/controller-dbus.c:554-561","code":"  554 |         for (size_t i = 0; i < C_ARRAY_SIZE(methods); i++) {\n  555 |                 if (strcmp(methods[i].name, method) != 0)\n  556 |                         continue;\n  557 | \n  558 |                 return controller_handle_method(&methods[i], controller, path, serial, signature, message);\n  559 |         }\n  560 | \n  561 |         return CONTROLLER_E_UNEXPECTED_METHOD;","lines":8,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/broker/controller-dbus.c#L554-L561"},{"ref":"src/broker/controller-dbus.c:570-577","code":"  570 |         for (size_t i = 0; i < C_ARRAY_SIZE(methods); i++) {\n  571 |                 if (strcmp(methods[i].name, method) != 0)\n  572 |                         continue;\n  573 | \n  574 |                 return controller_handle_method(&methods[i], controller, path, serial, signature, message);\n  575 |         }\n  576 | \n  577 |         return CONTROLLER_E_UNEXPECTED_METHOD;","lines":8,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/broker/controller-dbus.c#L570-L577"},{"ref":"src/broker/controller-dbus.c:585-592","code":"  585 |         for (size_t i = 0; i < C_ARRAY_SIZE(methods); i++) {\n  586 |                 if (strcmp(methods[i].name, method) != 0)\n  587 |                         continue;\n  588 | \n  589 |                 return controller_handle_method(&methods[i], controller, path, serial, signature, message);\n  590 |         }\n  591 | \n  592 |         return CONTROLLER_E_UNEXPECTED_METHOD;","lines":8,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/broker/controller-dbus.c#L585-L592"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"driver_method_list_names() and driver_method_list_activatable_names() walk the\nentire peer and name rbtrees writing each name into the reply. For ListNames\nthis is two full tree traversals (peers + names) on every call; for a bus with\nmany connections this is O(n) work driven by any unprivileged client. This is\ninherent to the API but worth noting as an unauthenticated amplification vector\n(client sends a tiny request, broker serializes a potentially large reply).","fix":"No code change required for correctness; ensure send-quota accounting bounds the reply size so a client cannot cheaply force unbounded serialization work.","locations":[{"ref":"src/bus/driver.c:1109-1141","code":" 1109 | static int driver_method_list_names(Peer *peer, const char *path, CDVar *in_v, uint32_t serial, CDVar *out_v) {\n 1110 |         Peer *p;\n 1111 |         Name *name;\n 1112 |         int r;\n 1113 | \n 1114 |         c_dvar_read(in_v, \"()\");\n 1115 | \n 1116 |         r = driver_end_read(in_v);\n 1117 |         if (r)\n 1118 |                 return error_trace(r);\n 1119 | \n 1120 |         c_dvar_write(out_v, \"([\");\n 1121 |         c_dvar_write(out_v, \"s\", \"org.freedesktop.DBus\");\n 1122 |         c_rbtree_for_each_entry(p, &peer->bus->peers.peer_tree, registry_node) {\n 1123 |                 if (!peer_is_registered(p))\n 1124 |                         continue;\n 1125 | \n 1126 |                 driver_dvar_write_unique_name(out_v, p);\n 1127 |         }\n 1128 |         c_rbtree_for_each_entry(name, &peer->bus->names.name_tree, registry_node) {\n 1129 |                 if (!name_primary(name))\n 1130 |                         continue;\n 1131 | \n 1132 |                 c_dvar_write(out_v, \"s\", name->name);\n 1133 |         }\n 1134 |         c_dvar_write(out_v, \"])\");\n 1135 | \n 1136 |         r = driver_send_reply(peer, out_v, serial);\n 1137 |         if (r)\n 1138 |                 return error_trace(r);\n 1139 | \n 1140 |         return 0;\n 1141 | }","lines":33,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/bus/driver.c#L1109-L1141"},{"ref":"src/bus/driver.c:1143-1168","code":" 1143 | static int driver_method_list_activatable_names(Peer *peer, const char *path, CDVar *in_v, uint32_t serial, CDVar *out_v) {\n 1144 |         Name *name;\n 1145 |         int r;\n 1146 | \n 1147 |         c_dvar_read(in_v, \"()\");\n 1148 | \n 1149 |         r = driver_end_read(in_v);\n 1150 |         if (r)\n 1151 |                 return error_trace(r);\n 1152 | \n 1153 |         c_dvar_write(out_v, \"([\");\n 1154 |         c_dvar_write(out_v, \"s\", \"org.freedesktop.DBus\");\n 1155 |         c_rbtree_for_each_entry(name, &peer->bus->names.name_tree, registry_node) {\n 1156 |                 if (!name->activation)\n 1157 |                         continue;\n 1158 | \n 1159 |                 c_dvar_write(out_v, \"s\", name->name);\n 1160 |         }\n 1161 |         c_dvar_write(out_v, \"])\");\n 1162 | \n 1163 |         r = driver_send_reply(peer, out_v, serial);\n 1164 |         if (r)\n 1165 |                 return error_trace(r);\n 1166 | \n 1167 |         return 0;\n 1168 | }","lines":26,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/bus/driver.c#L1143-L1168"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"policy_type is computed at runtime into a global on first use rather than being a compile-time constant, as the in-file XXX comment explains. This is a minor architectural wart (mutable global, runtime cost on startup) acknowledged by the authors.","fix":"If/when compiler limits allow, encode POLICY_TYPE as a static const CDVarType[] via C_DVAR_T_INIT, removing the runtime computation and the mutable global.","locations":[{"ref":"src/bus/policy.c:87-103","code":"   87 | /*\n   88 |  * XXX: This should be a compile-time static type, rather than computed at\n   89 |  *      runtime!\n   90 |  *\n   91 |  * Preferably, what we would want here is:\n   92 |  *\n   93 |  *     static const CDVarType policy_type[] = {\n   94 |  *             C_DVAR_T_INIT(POLICY_TYPE)\n   95 |  *     };\n   96 |  *\n   97 |  * However, the type is so big, the `C_DVAR_T_*` macros end up producing too\n   98 |  * big of an output and compilers fall over if they run on low-end machines.\n   99 |  * Hence, we compute the type at runtime for now. This is not a big issue,\n  100 |  * since this is fast, anyway. However, it feels wrong to do this at runtime,\n  101 |  * so we should find a better way to encode this at compile-time.\n  102 |  */\n  103 | static const CDVarType *policy_type = NULL;","lines":17,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/bus/policy.c#L87-L103"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"Self-acknowledged in a code comment: policy_snapshot_check_xmit() performs a red-black-tree lookup for the empty catch-all name (\"\") on every single send and receive policy decision, for every batch in the snapshot. On hot message paths this repeated lookup is redundant since the catch-all entry pointer could be cached per batch.","fix":"Cache a pointer to the catch-all PolicyBatchName (empty name) inside PolicyBatch at import time and use it directly instead of policy_batch_find_name(batch, \"\") on every check.","locations":[{"ref":"src/bus/policy.c:987-1001","code":"  987 |          *\n  988 |          * XXX: Maybe we should cache the pointer to the catch-all entry, since\n  989 |          *      doing the lookup on all messages seems rather expensive just\n  990 |          *      for the sake of simplicity.\n  991 |          */\n  992 |         policy_snapshot_check_xmit_name(batch,\n  993 |                                         is_send,\n  994 |                                         verdict,\n  995 |                                         \"\",\n  996 |                                         interface,\n  997 |                                         method,\n  998 |                                         path,\n  999 |                                         type,\n 1000 |                                         broadcast,\n 1001 |                                         n_fds);","lines":15,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/bus/policy.c#L987-L1001"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"In the includedir handling and service-dir handling, strlen(suffix) is recomputed multiple times per loop iteration inside the filter (suffix is a fixed string literal). Minor, but in directories with many entries this is needless repeated work; the compiler may or may not fold it since suffix is a local array.","fix":"Hoist 'const size_t n_suffix = strlen(suffix);' out of the loop and reuse it.","locations":[{"ref":"src/launch/config.c:1109-1114","code":" 1109 |                         n = strlen(de->d_name);\n 1110 | \n 1111 |                         if (n <= strlen(suffix))\n 1112 |                                 continue;\n 1113 |                         if (strcmp(de->d_name + n - strlen(suffix), suffix))\n 1114 |                                 continue;","lines":6,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/launch/config.c#L1109-L1114"},{"ref":"src/launch/launcher.c:809-813","code":"  809 |                 n = strlen(de->d_name);\n  810 |                 if (n <= strlen(suffix))\n  811 |                         continue;\n  812 |                 if (strcmp(de->d_name + n - strlen(suffix), suffix))\n  813 |                         continue;","lines":5,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/launch/launcher.c#L809-L813"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"fs_dirlist_push() recomputes strnlen over d_name on every push and grows the array by doubling (good), but fs_dir_list() always calls fs_dirlist_new(&list, 0) which clamps to 8, ignoring any size hint; for very large directories this causes log2(N/8) reallocations. Minor.","fix":"Optionally pass an estimated capacity hint when known; negligible impact in practice.","locations":[{"ref":"src/util/fs.c:168-175","code":"  168 | int fs_dir_list(DIR *dir, FsDirlist **listp, unsigned int flags) {\n  169 |         _c_cleanup_(fs_dirlist_freep) FsDirlist *list = NULL;\n  170 |         struct dirent *de;\n  171 |         int r;\n  172 | \n  173 |         r = fs_dirlist_new(&list, 0);\n  174 |         if (r)\n  175 |                 return error_fold(r);","lines":8,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/util/fs.c#L168-L175"},{"ref":"src/util/fs.c:30-49","code":"   30 | int fs_dirlist_new(FsDirlist **listp, size_t n_allocated) {\n   31 |         _c_cleanup_(fs_dirlist_freep) FsDirlist *list = NULL;\n   32 | \n   33 |         if (n_allocated < 8)\n   34 |                 n_allocated = 8;\n   35 | \n   36 |         list = calloc(1, sizeof(*list));\n   37 |         if (!list)\n   38 |                 return error_origin(-ENOMEM);\n   39 | \n   40 |         list->entries = calloc(n_allocated, sizeof(*list->entries));\n   41 |         if (!list->entries)\n   42 |                 return error_origin(-ENOMEM);\n   43 | \n   44 |         list->n_allocated = n_allocated;\n   45 | \n   46 |         *listp = list;\n   47 |         list = NULL;\n   48 |         return 0;\n   49 | }","lines":20,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/util/fs.c#L30-L49"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"DRIVER_E_UNEXPECTED_ENVIRONMENT_UPDATE is defined, given a human-readable string\n(line 349) and handled in the driver_dispatch() switch (line 2810), but it is\nnever returned anywhere. driver_method_update_activation_environment() returns\nDRIVER_E_PEER_NOT_PRIVILEGED for the unauthorized case instead, so the dedicated\nerror code and its message (\"User is not authorized to update environment\nvariables\") are unreachable.","fix":"Either return DRIVER_E_UNEXPECTED_ENVIRONMENT_UPDATE from the privilege check in driver_method_update_activation_environment(), or remove the unused enum value, its string, and its switch case.","locations":[{"ref":"src/bus/driver.c:352","code":"  352 |                 [DRIVER_E_UNEXPECTED_ENVIRONMENT_UPDATE]        = \"User is not authorized to update environment variables\",","lines":1,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/bus/driver.c#L352"},{"ref":"src/bus/driver.c:2813","code":" 2813 |         case DRIVER_E_UNEXPECTED_ENVIRONMENT_UPDATE:","lines":1,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/bus/driver.c#L2813"},{"ref":"src/bus/driver.c:1241-1242","code":" 1241 |         if (!peer_is_privileged(peer))\n 1242 |                 return DRIVER_E_PEER_NOT_PRIVILEGED;","lines":2,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/bus/driver.c#L1241-L1242"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"CONTROLLER_E_UNEXPECTED_MESSAGE_TYPE is handled in the post-dispatch switch of controller_dbus_dispatch (controller-dbus.c:699-701, grouped with UNEXPECTED_PATH to send AccessDenied) but no code path in the audited dispatch routines ever returns this error code (unknown message types are mapped to CONTROLLER_E_PROTOCOL_VIOLATION at controller-dbus.c:691). The case is dead.","fix":"Remove the unreachable CONTROLLER_E_UNEXPECTED_MESSAGE_TYPE case, or document/route an actual code path to it if it was intended to be used.","locations":[{"ref":"src/broker/controller-dbus.c:702-705","code":"  702 |         case CONTROLLER_E_UNEXPECTED_MESSAGE_TYPE:\n  703 |         case CONTROLLER_E_UNEXPECTED_PATH:\n  704 |                 r = controller_send_error(connection, message_read_serial(message), \"org.freedesktop.DBus.Error.AccessDenied\");\n  705 |                 break;","lines":4,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/broker/controller-dbus.c#L702-L705"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"The comment at line 825 in driver_name_activated() reads \"in case the name is\ndropped again in the future, we should request it again\" to justify setting\nactivation->pending = 0. The phrasing is misleading: setting pending to 0 marks\nthe activation as no longer pending (so a future drop CAN re-trigger\nactivation); it does not itself \"request it again\". A reader could misread this\nas scheduling a re-request here.","fix":"Reword to e.g. \"clear the pending flag so a future loss of the name can trigger a fresh activation request\".","locations":[{"ref":"src/bus/driver.c:828-829","code":"  828 |         /* in case the name is dropped again in the future, we should request it again */\n  829 |         activation->pending = 0;","lines":2,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/bus/driver.c#L828-L829"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"Many exported functions carry placeholder doc-comments of the form \"function() - XXX\" with no actual description (e.g. controller_name_free, controller_name_reset, controller_name_activate, controller_reload_completed, controller_add_name/listener/metrics, controller_request_reload, the find_* helpers, and controller_dbus_send_activation/environment/reload). These provide no information and are stale documentation stubs.","fix":"Either fill in the doc-comments with real descriptions of behavior, ownership, and error semantics, or remove the empty XXX stubs.","locations":[{"ref":"src/broker/controller.c:32-34","code":"   32 | /**\n   33 |  * controller_name_free() - XXX\n   34 |  */","lines":3,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/broker/controller.c#L32-L34"},{"ref":"src/broker/controller.c:70-72","code":"   70 | /**\n   71 |  * controller_name_reset() - XXX\n   72 |  */","lines":3,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/broker/controller.c#L70-L72"},{"ref":"src/broker/controller.c:83-85","code":"   83 | /**\n   84 |  * controller_name_activate() - XXX\n   85 |  */","lines":3,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/broker/controller.c#L83-L85"},{"ref":"src/broker/controller-dbus.c:755-757","code":"  755 | /**\n  756 |  * controller_dbus_send_activation() - XXX\n  757 |  */","lines":3,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/broker/controller-dbus.c#L755-L757"},{"ref":"src/broker/controller-dbus.c:799-801","code":"  799 | /**\n  800 |  * controller_dbus_send_environment() - XXX\n  801 |  */","lines":3,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/broker/controller-dbus.c#L799-
