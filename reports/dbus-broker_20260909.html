{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"Several public API functions carry placeholder doc comments with only `- XXX` as the description (match_rule_user_ref/unref, match_rule_link/unlink, match_owner_* , policy_batch_new, policy_registry_*, policy_snapshot_*, peer_new, peer_free, activation_init/deinit, metrics/listener init). These provide no documentation and should either be filled in or removed.","fix":"Replace `XXX` placeholder doc-comment bodies with real descriptions, or drop the stub comments.","locations":[{"ref":"src/bus/match.c:772-789","code":"  772 | /**\n  773 |  * match_rule_user_ref() - XXX\n  774 |  */\n  775 | MatchRule *match_rule_user_ref(MatchRule *rule) {\n  776 |         if (!rule)\n  777 |                 return NULL;\n  778 | \n  779 |         c_assert(rule->n_user_refs > 0);\n  780 | \n  781 |         ++rule->n_user_refs;\n  782 | \n  783 |         return rule;\n  784 | }\n  785 | \n  786 | /**\n  787 |  * match_rule_user_unref() - XXX\n  788 |  */\n  789 | MatchRule *match_rule_user_unref(MatchRule *rule) {","lines":18,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/bus/match.c#L772-L789"},{"ref":"src/bus/policy.c:203-205","code":"  203 | /**\n  204 |  * policy_batch_new() - XXX\n  205 |  */","lines":3,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/bus/policy.c#L203-L205"},{"ref":"src/bus/peer.c:249-251","code":"  249 | /**\n  250 |  * peer_new() - XXX\n  251 |  */","lines":3,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/bus/peer.c#L249-L251"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"The SASLServer.ok_response buffer sizing literal contains a typo: 'OK 0123456789abcdef0123456789abdcef' (note 'abdcef'). The length is unaffected (sizeof of the two strings is identical), so there is no functional bug, but the literal is misleading to future readers who assume it documents the real GUID hex layout.","fix":"Fix the typo to 'OK 0123456789abcdef0123456789abcdef' so the sizing literal matches the documented format.","locations":[{"ref":"src/dbus/sasl.h:63","code":"   63 |         char ok_response[sizeof(\"OK 0123456789abcdef0123456789abdcef\") - 1];","lines":1,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/dbus/sasl.h#L63"}]},
{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"Numerous public functions are documented with placeholder Doxygen-style comments whose body is literally 'XXX' (config_path_new, config_path_ref, config_path_unref, config_node_new, config_node_free, config_root_new, config_root_free, config_parser_init/deinit/read, all policy_record_new_* and policy_import/optimize/export). These convey no information and several describe non-trivial ownership/refcount semantics that genuinely need documentation (e.g. config_path_unref recursively unrefs the parent chain).","fix":"Replace the 'XXX' placeholders with real descriptions, especially the refcount/ownership behavior of config_path_ref/unref and the lifetime contracts of config_parser_read.","locations":[{"ref":"src/launch/config.c:35-38","code":"   35 | /**\n   36 |  * config_path_new() - XXX\n   37 |  */\n   38 | int config_path_new(ConfigPath **filep, ConfigPath *parent, const char *prefix, const char *path) {","lines":4,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/launch/config.c#L35-L38"},{"ref":"src/launch/policy.c:19-22","code":"   19 | /**\n   20 |  * policy_record_new_connect() - XXX\n   21 |  */\n   22 | int policy_record_new_connect(PolicyRecord **recordp) {","lines":4,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/launch/policy.c#L19-L22"},{"ref":"src/launch/config.c:94-96","code":"   94 | /**\n   95 |  * config_path_ref() - XXX\n   96 |  */","lines":3,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/launch/config.c#L94-L96"}]},
{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"The comment on main_max_outgoing_bytes claims '127MiB' but the value is '8 * 1024 * 1024' (8 MiB). The parenthetical is meant to show the dbus-daemon(1) equivalent; either way the stated 127MiB does not match the 8MiB literal and is misleading to a reader auditing the limits.","fix":"Correct the comment to reflect the actual 8MiB value (and/or clearly mark the parenthetical as the dbus-daemon default it is being compared against).","locations":[{"ref":"src/launch/launcher.c:44","code":"   44 | static const uint64_t main_max_outgoing_bytes = 8 * 1024 * 1024; /* 127MiB */","lines":1,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/launch/launcher.c#L44"}]},
{"id":"CMT_7","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"bus_apparmor_is_enabled() doc-comment refers to setting `@enabledp` to false/true, but the parameter is named `enabledp` while the prose in dbus_supported() mirror uses `@supportedp`; minor doc/parameter naming drift. Also the comment 'set @enabledp to ...' is fine but the kdoc @-tag in is_enabled is `@enabled` (line 29) not `@enabledp`, mismatching the actual parameter name `enabledp`.","fix":"Rename the kdoc tag from @enabled to @enabledp to match the parameter.","locations":[{"ref":"src/util/apparmor.c:32-40","code":"   32 | /**\n   33 |  * bus_apparmor_is_enabled() - checks if AppArmor is currently enabled\n   34 |  * @enabled:            return argument telling if AppArmor is enabled\n   35 |  *\n   36 |  * If the AppArmor module is not loaded, or AppArmor is disabled in the\n   37 |  * kernel, set @enabledp to 'false', otherwise set it to 'true'.\n   38 |  *\n   39 |  * Returns: 0 if check succeeded, or negative error code on failure.\n   40 |  */","lines":9,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/util/apparmor.c#L32-L40"}]},
{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"negligible","difficulty":"medium","description":"The socket-validation idiom (getsockopt SO_DOMAIN + SO_TYPE, then check AF_UNIX/SOCK_STREAM and map EBADF/ENOTSOCK to an invalid-fd error) is copy-pasted in four places with only the returned error code differing: AddListener (controller-dbus.c:267-275), AddMetrics (controller-dbus.c:309-317), and the log/controller fd checks in parse_argv (main.c:188-202, 210-224). Divergence between copies is a maintenance hazard.","fix":"Extract a helper such as util_fd_is_unix_stream(int fd) (and a DGRAM-allowing variant for the log fd) that performs the two getsockopt calls and returns a normalized result, then call it from all four sites.","locations":[{"ref":"src/broker/controller-dbus.c:270-278","code":"  270 |         n = sizeof(v1);\n  271 |         r = getsockopt(listener_fd, SOL_SOCKET, SO_DOMAIN, &v1, &n);\n  272 |         n = sizeof(v2);\n  273 |         r = r ?: getsockopt(listener_fd, SOL_SOCKET, SO_TYPE, &v2, &n);\n  274 | \n  275 |         if (r < 0)\n  276 |                 return (errno == EBADF || errno == ENOTSOCK) ? CONTROLLER_E_LISTENER_INVALID_FD : error_origin(-errno);\n  277 |         if (v1 != AF_UNIX || v2 != SOCK_STREAM)\n  278 |                 return CONTROLLER_E_LISTENER_INVALID_FD;","lines":9,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/broker/controller-dbus.c#L270-L278"},{"ref":"src/broker/controller-dbus.c:312-320","code":"  312 |         n = sizeof(v1);\n  313 |         r = getsockopt(metrics_fd, SOL_SOCKET, SO_DOMAIN, &v1, &n);\n  314 |         n = sizeof(v2);\n  315 |         r = r ?: getsockopt(metrics_fd, SOL_SOCKET, SO_TYPE, &v2, &n);\n  316 | \n  317 |         if (r < 0)\n  318 |                 return (errno == EBADF || errno == ENOTSOCK) ? CONTROLLER_E_METRICS_INVALID_FD : error_origin(-errno);\n  319 |         if (v1 != AF_UNIX || v2 != SOCK_STREAM)\n  320 |                 return CONTROLLER_E_METRICS_INVALID_FD;","lines":9,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/broker/controller-dbus.c#L312-L320"},{"ref":"src/broker/main.c:192-228","code":"  192 |                 n = sizeof(v1);\n  193 |                 r = getsockopt(main_arg_log, SOL_SOCKET, SO_DOMAIN, &v1, &n);\n  194 |                 n = sizeof(v2);\n  195 |                 r = r ?: getsockopt(main_arg_log, SOL_SOCKET, SO_TYPE, &v2, &n);\n  196 | \n  197 |                 if (r < 0) {\n  198 |                         if (errno != EBADF && errno != ENOTSOCK)\n  199 |                                 return error_origin(-errno);\n  200 | \n  201 |                         fprintf(stderr, \"%s: log file-descriptor not a socket -- '%d'\\n\", program_invocation_name, main_arg_log);\n  202 |                         return MAIN_FAILED;\n  203 |                 } else if (v1 != AF_UNIX || (v2 != SOCK_DGRAM && v2 != SOCK_STREAM)) {\n  204 |                         fprintf(stderr, \"%s: socket type of log file-descriptor not supported -- '%d'\\n\", program_invocation_name, main_arg_log);\n  205 |                         return MAIN_FAILED;\n  206 |                 }\n  207 |         }\n  208 | \n  209 |         /* verify controller-fd is STREAM */\n  210 |         {\n  211 |                 socklen_t n;\n  212 |                 int v1, v2;\n  213 | \n  214 |                 n = sizeof(v1);\n  215 |                 r = getsockopt(main_arg_controller, SOL_SOCKET, SO_DOMAIN, &v1, &n);\n  216 |                 n = sizeof(v2);\n  217 |                 r = r ?: getsockopt(main_arg_controller, SOL_SOCKET, SO_TYPE, &v2, &n);\n  218 | \n  219 |                 if (r < 0) {\n  220 |                         if (errno != EBADF && errno != ENOTSOCK)\n  221 |                                 return error_origin(-errno);\n  222 | \n  223 |                         fprintf(stderr, \"%s: controller file-descriptor not a socket -- '%d'\\n\", pr {"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"medium","difficulty":"medium","description":"driver_dispatch() is a single ~75-line switch that re-derives the wire error\nname (org.freedesktop.DBus.Error.*) for every internal DRIVER_E_* code, and the\nmapping is maintained by hand far away from where each error is raised. Adding a\nnew DRIVER_E_* code requires remembering to add it to BOTH driver_error_to_string()\n(or c_assert at line 367 aborts the broker) AND this switch (or the error is\nsilently dropped via the `default:` case with no reply sent to the client). This\ncoupling has already produced a latent inconsistency (see the unused\nDRIVER_E_UNEXPECTED_ENVIRONMENT_UPDATE finding) and is fragile for a\nsecurity-critical dispatcher.","fix":"Drive the error-name + human string from a single table keyed by DRIVER_E_* code, and make the default case in driver_dispatch() emit a generic org.freedesktop.DBus.Error.Failed reply (or assert) instead of silently dropping the error.","locations":[{"ref":"src/bus/driver.c:2794-2870","code":" 2794 | int driver_dispatch(Peer *peer, Message *message) {\n 2795 |         int r;\n 2796 | \n 2797 |         if (peer_is_monitor(peer))\n 2798 |                 return DRIVER_E_MONITOR_READ_ONLY;\n 2799 | \n 2800 |         r = driver_dispatch_internal(peer, message);\n 2801 |         switch (r) {\n 2802 |         case DRIVER_E_PEER_NOT_REGISTERED:\n 2803 |                 return r;\n 2804 |         case DRIVER_E_UNIMPLEMENTED:\n 2805 |         case DRIVER_E_PEER_ALREADY_REGISTERED:\n 2806 |         case DRIVER_E_UNEXPECTED_FDS:\n 2807 |                 r = driver_send_error(peer, message_read_serial(message), \"org.freedesktop.DBus.Error.Failed\", driver_error_to_string(r));\n 2808 |                 break;\n 2809 |         case DRIVER_E_PEER_NOT_YET_REGISTERED:\n 2810 |         case DRIVER_E_UNEXPECTED_PATH:\n 2811 |         case DRIVER_E_UNEXPECTED_MESSAGE_TYPE:\n 2812 |         case DRIVER_E_UNEXPECTED_   r = driver_send_error(peer, message_read_serial(message), \"org.freedesktop.DBus.Error.LimitsExceeded\", driver_error_to_string(r));\n 2843 |                 break;\n 2844 |         case DRIVER_E_PEER_NOT_FOUND:\n 2845 |         case DRIVER_E_NAME_NOT_FOUND:\n 2846 |         case DRIVER_E_NAME_OWNER_NOT_FOUND:\n 2847 |         case DRIVER_E_DESTINATION_NOT_FOUND:\n 2848 |                 r = driver_send_error(peer, message_read_serial(message), \"org.freedesktop.DBus.Error.NameHasNoOwner\", driver_error_to_string(r));\n 2849 |                 break;\n 2850 |         case DRIVER_E_NAME_NOT_ACTIVATABLE:\n 2851 |                 r = driver_send_error(peer, message_read_serial(message), \"org.freedesktop.DBus.Error.ServiceUnknown\", driver_error_to_string(r));\n 2852 |                 break;\n 2853 |         case DRIVER_E_MATCH_INVALID:\n 2854 |                 r = driver_send_error(peer, message_read_serial(message), \"org.freedesktop.DBus.Error.MatchRuleInvalid\", driver_error_to_string(r));\n 2855 |                 break;\n 2856 |         case DRIVER_E_MATCH_NOT_FOUND:\n 2857 |                 r = driver_send_error(peer, message_read_serial(message), \"org.freedesktop.DBus.Error.MatchRuleNotFound\", driver_error_to_string(r));\n 2858 |                 break;\n 2859 |         case DRIVER_E_ADT_NOT_SUPPORTED:\n 2860 |                 r = driver_send_error(peer, message_read_serial(message), \"org.freedesktop.DBus.Error.AdtAuditDataUnknown\", driver_error_to_string(r));\n 2861 |                 break;\n 2862 |         case DRIVER_E_SELINUX_NOT_SUPPORTED:\n 2863 |                 r = driver_send_error(peer, message_read_serial(message), \"org.freedesktop.DBus.Error.SELinuxSecurityContextUnknown\", driver_error_to_string(r));\n 2864 |                 break;\n 2865 |         default:\n 2866 |                 break;\n 2867 |         }\n 2868 | \n 2869 |         return error_trace(r);\n 2870 | }","lines":77,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea70 {"id":"OTHER_1","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"Race window between signalfd creation and signal blocking. broker_new() creates the signalfd for SIGTERM/SIGINT (broker.c:115-119) but the signals are only blocked with sigprocmask in broker_run() (broker.c:165), which runs after broker_new() returns. If a SIGTERM or SIGINT is delivered to the broker process during this window (after the fd exists but before the signals are blocked), the kernel applies the default disposition (process termination) instead of queueing the signal on the signalfd, so the graceful-exit path (broker_dispatch_signals -> DISPATCH_E_EXIT -> clean shutdown / stats dispatch) is bypassed. Whether the window is actually open depends on the inherited signal mask from the launcher exec, which is not guaranteed.","fix":"Block SIGTERM/SIGINT with sigprocmask(SIG_BLOCK, ...) before calling signalfd() in broker_new(), or move the sigprocmask call to before broker_new() in the startup path so the signals are guaranteed blocked before the signalfd is installed.","locations":[{"ref":"src/broker/broker.c:118-144","code":"  118 |         sigemptyset(&sigmask);\n  119 |         sigaddset(&sigmask, SIGTERM);\n  120 |         sigaddset(&sigmask, SIGINT);\n  121 | \n  122 |         broker->signals_fd = signalfd(-1, &sigmask, SFD_CLOEXEC | SFD_NONBLOCK);\n  123 |         if (broker->signals_fd < 0)\n  124 |                 return error_origin(-errno);\n  125 | \n  126 |         r = dispatch_file_init(&broker->signals_file,\n  127 |                                &broker->dispatcher,\n  128 |                                broker_dispatch_signals,\n  129 |                                broker->signals_fd,\n  130 |                                EPOLLIN,\n  131 |                                0);\n  132 |         if (r)\n  133 |                 return error_fold(r);\n  134 | \n  135 |         dispatch_file_select(&broker->signals_file, EPOLLIN);\n  136 | \ rt(type[12].element == ')');\n  271 |         c_assert(type[13].element == ')');\n  272 |         c_assert(type[14].element == '(');\n  273 |         c_assert(type[type->length - 2].element == ')');\n  274 |         c_assert(type[type->length - 1].element == ')');\n  275 | \n  276 |         for (unsigned int i = strlen(\"((yyyyuua(yv))(\"), j = 0; i < type->length - strlen(\"))\"); i++, j++)\n  277 |                 signature[j] = type[i].element;\n  278 | \n  279 |         signature[type->length - strlen(\"((yyyyuua(yv))())\")] = '\\0';\n  280 | \n  281 |         c_dvar_write(var, \"g\", signature);\n  282 | }","lines":29,"link":"https://github.com/bus1/dbus-broker/blob/2956b5d381deeea709c53d02f10e799e50e44f4b/src/bus/driver.c#L254-L282"}]},

const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Render a "**Label:** value" line. GitHub/CommonMark only recognizes a
// ``` fence when it starts at the beginning of a line, so if the value
// itself opens with a fence, put it on its own line instead of right
// after the inline label - otherwise the fence marker gets glued onto
// "**Label:** ```" and never renders as a code block.
function mdField(label, value) {
  value = value || '';
  return /^```/.test(value.trim())
    ? '**' + label + ':**\n\n' + value
    : '**' + label + ':** ' + value;
}

// Render the "**Locations:**" block. When a location has a commit-pinned
// permalink (GitHub/GitLab), just paste the bare URL on its own line -
// GitHub/GitLab auto-expand a line-range blob link into an inline code
// preview, so re-pasting the snippet as a fenced block would duplicate it.
// Forges without a detected permalink shape (or missing commit/repo info)
// fall back to the fenced ref+snippet so the location is still readable.
function mdLocations(locations) {
  if (!locations.length) return '';
  let out = '**Locations:**\n\n';
  for (const l of locations) {
    if (l.link)               out += l.link + '\n\n';
    else if (l.code != null)  out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
    else                      out += '- `' + l.ref + '` _(file not found)_\n\n';
  }
  return out;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += mdField('Description', f.description) + '\n\n';
      out += mdLocations(f.locations);
      out += mdField('Fix', f.fix) + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build a [project] header block from embedded PROJECT_INFO, so the exported
// findings.toml is self-contained (doesn't depend on a sibling project-info.toml
// that a second, separately-triggered download could silently fail to save).
// '' when there is no project info at all.
function buildProjectToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = PROJECT_INFO || {};
  if (!Object.keys(pi).length) return '';
  const lines = ['[project]'];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n\n';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return buildProjectToml() + chunks.join('\n\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += mdField('Description', f.description) + '\n\n';
  out += mdLocations(f.locations);
  out += mdField('Fix', f.fix) + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystacks per finding (cleared on full re-render).
// Two variants: everything (default), and file/folder paths only - for when a
// search term (e.g. a directory name like 'dlls/abc') also happens to appear
// inside description/fix prose and you only want path matches.
const _hay = new Map();
const _hayLoc = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}
function hayLocOf(f) {
  if (!_hayLoc.has(f.id)) {
    _hayLoc.set(f.id, f.locations.map(l => l.ref).join(' ').toLowerCase());
  }
  return _hayLoc.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (S.searchScope === 'locations') {
      if (!hayLocOf(f).includes(q)) return false;
    } else if (!hayOf(f).includes(q) && !st.includes(q)) {
      return false;
    }
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  _hayLoc.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    // Single download (was two) - a second auto-triggered download is commonly
    // blocked by the browser unless the user explicitly allows it, which silently
    // drops project-info.toml. Embedding [project] in findings.toml itself avoids
    // that failure mode entirely.
    downloadText(buildFindingsToml(), 'findings.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});
document.getElementById('search-scope').addEventListener('click', e => {
  S.searchScope = S.searchScope === 'locations' ? 'all' : 'locations';
  e.currentTarget.classList.toggle('active', S.searchScope === 'locations');
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
