{"id":"PANIC_86","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"RawImage::calc_black_levels() has a hard assert 'assert_eq!(cfa.width * cfa.height, 4)' which panics for any non-2x2 CFA (e.g., X-Trans 6x6 sensors). This assert is also noted with a TODO comment, confirming it is a known limitation that can crash at runtime for valid inputs.","fix":"Return None or an error for non-4-cell CFA patterns rather than panicking, and remove or generalize the assert.","locations":[{"ref":"rawler/src/rawimage.rs:313-314","code":"  313 |       assert_eq!(cfa.width * cfa.height, 4);\n  314 |       Some(BlackLevel::new(&[blacklevels[0], blacklevels[1], blacklevels[2], blacklevels[3]], 2, 2, 1))","lines":2,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/rawimage.rs#L313-L314"}]},
{"id":"PANIC_87","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"RawImage::new() and new_with_data() call unwrap_or_else(|| panic!('Need whitelevel in config: ...')) when the camera has no whitelevel configured. This panics at runtime for any camera definition missing a whitelevel, with no recovery path for the decoder caller.","fix":"Return Result<RawImage, RawlerError> from the constructors so the error can be propagated.","locations":[{"ref":"rawler/src/rawimage.rs:376","code":"  376 |       .unwrap_or_else(|| panic!(\"Need whitelevel in config: {}\", cam.clean_model));","lines":1,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/rawimage.rs#L376"}]},
{"id":"PANIC_88","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"IntoTilesIter::next() calls assert!(self.count <= self.tile_count()) which panics if the iterator is over-consumed. However, ExactSizeIterator is implemented, which implies the caller can trust size_hint. If tile_count() is ever wrong (e.g., non-multiple-of-tile total), the assert fires mid-iteration.","fix":"Replace the assert with 'if self.count > self.tile_count() { return None; }' for defensive behavior.","locations":[{"ref":"rawler/src/tiles.rs:205","code":"  205 |     assert!(self.count <= self.tile_count());","lines":1,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/tiles.rs#L205"}]},
{"id":"PANIC_89","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"update_from_toml() panics on every unknown TOML key with `panic!(\"Unknown key: {}\", key)`. This means any future key added to cameras.toml that this code is not aware of will crash on startup.","fix":"Log a warning instead of panicking on unknown keys.","locations":[{"ref":"rawler/src/decoders/camera.rs:244-246","code":"  244 |         key => {\n  245 |           panic!(\"Unknown key: {}\", key);\n  246 |         }","lines":3,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/camera.rs#L244-L246"}]},
{"id":"PANIC_90","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In Cr2Decoder::get_firmware(), `v.parse().expect(\"Only digits here\")` panics if the firmware string produces an empty component (e.g. a trailing dot '1.0.'). The filter keeps only digits and dots, so a trailing dot yields an empty split segment which parse::<u8>() fails on.","fix":"Replace .expect() with proper error handling, or filter out empty segments: `.filter(|s| !s.is_empty()).map(|v| v.parse::<u8>().unwrap_or(0))`","locations":[{"ref":"rawler/src/decoders/cr2.rs:518","code":"  518 |           let v: Vec<u8> = str.split('.').map(|v| v.parse().expect(\"Only digits here\")).collect();","lines":1,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/cr2.rs#L518"}]},
{"id":"PANIC_91","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In CrwDecoder::create_hufftable(), `htable.initialize().expect(\"failed to initialize CRW Huffman table\")` panics. Since the input tables are compile-time constants this is unlikely in practice, but the expect hides any future table corruption.","fix":"Propagate the error up through decode_compressed() -> raw_image() instead of panicking.","locations":[{"ref":"rawler/src/decoders/crw.rs:174","code":"  174 |     htable.initialize().expect(\"failed to initialize CRW Huffman table\");","lines":1,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/crw.rs#L174"}]},
{"id":"PANIC_92","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"SensorType::from_cfa() calls unimplemented!() for CFA patterns that are neither 2x2 nor 6x6. Any future sensor format or corrupted CFA will panic the process.","fix":"Return an Option<SensorType> or Result<SensorType, _> instead.","locations":[{"ref":"rawler/src/imgop/sensor/mod.rs:43-46","code":"   43 |     } else {\n   44 |       unimplemented!()\n   45 |     }\n   46 |   }","lines":4,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/imgop/sensor/mod.rs#L43-L46"}]},
{"id":"PANIC_93","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"WhiteLevel::new_bits panics if bits > 32 via an explicit panic!, but the level is computed as ((1_u64 << bits) - 1) as u32. If bits == 32, (1_u64 << 32) - 1 == 4294967295 which fits u32 correctly, but if the panic guard were not present at bits == 33, the cast would silently truncate. The guard is correct but uses a panic rather than returning an error.","fix":"Return Result<WhiteLevel, Error> to allow callers to recover instead of aborting.","locations":[{"ref":"rawler/src/rawimage.rs:44-48","code":"   44 |     if bits > 32 {\n   45 |       panic!(\"Whitelevel can only be calculated for max. 32 bits, but {} bits given\", bits);\n   46 |     }\n   47 |     let level: u32 = ((1_u64 << bits) - 1) as u32;\n   48 |     Self(vec![level; cpp])","lines":5,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/rawimage.rs#L44-L48"}]},
{"id":"RES_1","type":"resource_leak","type_label":"Resource Leak","severity":"low","difficulty":"medium","description":"rawdb::write_atomic() creates a temporary .part file and then renames it to final_path. If io::copy or sync_all fails after the file is created, the .part file is left on disk with no cleanup. The file handle is dropped (closing it) but the .part path is never deleted on error.","fix":"On error from io::copy or sync_all, delete the .part file with fs::remove_file before returning the error.","locations":[{"ref":"rawler/src/devtools/rawdb.rs:139-149","code":"  139 | fn write_atomic(final_path: &Path, mut reader: impl io::Read) -> io::Result<()> {\n  140 |   let mut tmp = final_path.as_os_str().to_owned();\n  141 |   tmp.push(\".part\");\n  142 |   let tmp = PathBuf::from(tmp);\n  143 |   {\n  144 |     let mut f = fs::File::create(&tmp)?;\n  145 |     io::copy(&mut reader, &mut f)?;\n  146 |     f.sync_all()?;\n  147 |   }\n  148 |   fs::rename(&tmp, final_path)\n  149 | }","lines":11,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/devtools/rawdb.rs#L139-L149"}]},
{"id":"RES_2","type":"resource_leak","type_label":"Resource Leak","severity":"low","difficulty":"medium","description":"In convert_raw_file(), if internal_convert() returns an error after the original_compress_thread has been spawned but before the thread is joined, the JoinHandle is dropped without joining. The spawned thread continues running in the background and its resources (file handle clone, CPU) are never reclaimed until the process exits.","fix":"Join the thread (ignoring its result) in an error path, or use a scoped thread.","locations":[{"ref":"rawler/src/dng/convert.rs:162-169","code":"  162 |   let original_compress_thread = if params.embedded {\n  163 |     let orig_source = rawfile.clone();\n  164 |     Some(std::thread::spawn(move || OriginalCompressed::compress(&mut orig_source.reader())))\n  165 |   } else {\n  166 |     None\n  167 |   };\n  168 | \n  169 |   internal_convert(&rawfile, dng, original_filename, original_compress_thread, params)","lines":8,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/dng/convert.rs#L162-L169"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"extend_binary_floating_point() decrements wide_exponent in a loop for subnormal numbers: 'wide_exponent -= 1'. If the input narrow subnormal has enough leading zeros in the wide_fraction, this can underflow to u32::MAX (wrapping subtraction, because u32 arithmetic in Rust is checked in debug, panicking). Specifically, if WIDE::FRACTION_WIDTH is 23 and the narrow fraction is 1 (single bit), the loop runs up to 23 times, and the starting wide_exponent = (1 - NARROW::BIAS + WIDE::BIAS) can be zero for certain NARROW/WIDE combinations.","fix":"Add an underflow guard: break or return a zero/flush-to-zero result when wide_exponent reaches 0.","locations":[{"ref":"rawler/src/bits.rs:344-349","code":"  344 |       wide_exponent = (1 - NARROW::BIAS + WIDE::BIAS) as u32;\n  345 |       while 0 == (wide_fraction & (1 << WIDE::FRACTION_WIDTH)) {\n  346 |         wide_exponent -= 1;\n  347 |         wide_fraction <<= 1;\n  348 |       }\n  349 |       wide_fraction &= (1 << WIDE::FRACTION_WIDTH) - 1;","lines":6,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/bits.rs#L344-L349"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"In decode_segment(), `bits + (j ^ 8)` where j iterates 0, 8, 16, 24 means the shifts applied to input bytes are 8, 0, 24, 16. For j=16 the shift is 24, and for j=24 the shift is 16. These are XOR-based byte reordering. Combined with the accumulation into `bitbuf: u64`, if `bits` starts at 0 and grows by 8 each step but j^8 can be 0 or 24 simultaneously, overflow in the intermediate `bits + (j^8)` as usize is theoretically possible if bits is large.","fix":"Add a comment explaining the XOR-shuffle intent and verify that bits+j^8 stays within u32 shift range.","locations":[{"ref":"rawler/src/decoders/dcr.rs:153-155","code":"  153 |         for j in (0..32).step_by(8) {\n  154 |           bitbuf += (input.get_u8() as u64) << (bits + (j ^ 8));\n  155 |         }","lines":3,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/dcr.rs#L153-L155"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"In NefDecoder::raw_image(), the total strip size is computed as 'let full_size: u32 = data.iter().copied().sum()'. The elements are u32 and the accumulator is inferred as u32, so summing many large strips silently overflows in release builds, causing a smaller-than-expected buffer subview and potential subsequent panics or corrupted decode.","fix":"Sum into u64: let full_size: u64 = data.iter().map(|&x| x as u64).sum(); and update the subsequent type usage.","locations":[{"ref":"rawler/src/decoders/nef.rs:220-221","code":"  220 |       let full_size: u32 = match fetch_tiff_tag!(raw, TiffCommonTag::StripByteCounts) {\n  221 |         Value::Long(data) => data.iter().copied().sum(),","lines":2,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/nef.rs#L220-L221"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"In NefDecoder::get_wb() (WB version 0x204/0x205) and lensdata::from_makernote(), version bytes are parsed as 'buf[i] - b'0'' where b'0' is 48. If any of the first 4 bytes is less than 48 (malformed file), the subtraction wraps/panics in debug mode (u8 underflow). The same pattern appears in do_decode for v0/v1.","fix":"Validate that each byte is in b'0'..=b'9' before subtracting, or use a checked subtraction and return an error on invalid input.","locations":[{"ref":"rawler/src/decoders/nef.rs:449","code":"  449 |         version = (version << 4) + (levels.get_data()[i] - b'0') as u32;","lines":1,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/nef.rs#L449"},{"ref":"rawler/src/decoders/nef/lensdata.rs:62","code":"   62 |       version = (version << 4) + (buf[i] - b'0') as u32;","lines":1,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/nef/lensdata.rs#L62"}]},
{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"preview_image(): `image.width() - x - borders[3] as u32` and `image.height() - y - borders[1] as u32` perform unsigned subtraction on u32. If the border values exceed the image dimensions the result wraps around, producing a huge width/height and an out-of-bounds crop.","fix":"Use checked_sub or clamp to avoid unsigned underflow before calling crop_imm.","locations":[{"ref":"rawler/src/decoders/pef.rs:179-181","code":"  179 |         let width = image.width() - x - borders[3] as u32;\n  180 |         let height = image.height() - y - borders[1] as u32;\n  181 |         return Ok(Some(image.crop_imm(x, y, width, height)));","lines":3,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/pef.rs#L179-L181"}]},
{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"In SrwDecoder::decode_srw3(), diff_bits_mode values can underflow (saturate to u32::MAX) in release mode when a diff-flag of 2 is applied and the current mode value is 0. The underflowed value then triggers the 'too many bits' panic check at line 436 - but in debug builds the underflow panics first with a less informative message.","fix":"Use saturating_sub(1) instead of plain subtraction: diff_bits[i] = diff_bits_mode[colornum][0].saturating_sub(1);","locations":[{"ref":"rawler/src/decoders/srw.rs:427","code":"  427 |                 diff_bits[i] = diff_bits_mode[colornum][0] - 1;","lines":1,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/srw.rs#L427"},{"ref":"rawler/src/decoders/srw.rs:436","code":"  436 |             if diff_bits[i] > bit_depth + 1 {","lines":1,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/srw.rs#L436"}]},
{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"In cr3.rs integrate_cfa(), the col_offset is computed as `tile_col_idx * codec.tile_width` (line 737) while the row_offset as `tile_row_idx * codec.tile_width` (line 735). The row_offset should use tile_height, not tile_width. For non-square tile configurations this produces incorrect row offsets, writing plane data to wrong CFA positions.","fix":"Change line 735 to `let row_offset = tile_row_idx * codec.tile_height;`","locations":[{"ref":"rawler/src/decompressors/crx/decoder.rs:735-736","code":"  735 |   let row_offset = tile_row_idx * codec.tile_width;\n  736 |   // Offset from left","lines":2,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decompressors/crx/decoder.rs#L735-L736"}]},
{"id":"OVF_8","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"In iquant.rs, the `q_scale` calculation `Q_STEP_TBL[...] * (1 << (param.q_param / 6 + 26))` at line 103 can overflow a u32 in release mode when `param.q_param / 6 >= 6`. The comment at iquant.rs:150-158 in make_qstep acknowledges this exact problem for make_qstep but the same overflow exists in decode_line_with_iquantization for the older version (None branch) and is not fixed there.","fix":"Apply the same wrapping_shl fix used in make_qstep (line 158): `Q_STEP_TBL[...].wrapping_shl(param.q_param / 6 + 26)`","locations":[{"ref":"rawler/src/decompressors/crx/iquant.rs:103","code":"  103 |           Q_STEP_TBL[param.q_param as usize % 6] * (1 << (param.q_param / 6 + 26))","lines":1,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decompressors/crx/iquant.rs#L103"}]},
{"id":"OVF_9","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"In rice.rs predict_k_param_max(), `new_k -= 1` is performed on a u32 without a zero-check. If new_k is already 0, this subtraction wraps to u32::MAX in release builds (debug builds panic). k_param is then used as a shift amount, causing large bit-reads.","fix":"Use saturating_sub(1): `new_k = new_k.saturating_sub(1);`","locations":[{"ref":"rawler/src/decompressors/crx/rice.rs:102-103","code":"  102 |     if value < ((1 << prev_k) >> 1) {\n  103 |       new_k -= 1;","lines":2,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decompressors/crx/rice.rs#L102-L103"}]},
{"id":"OVF_10","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"rect_to_dng_area() in dng/mod.rs casts usize coordinates to u16 without range checking. For images larger than 65535 pixels in any dimension (common in modern sensors), the cast silently truncates, producing wrong ActiveArea / DefaultCropOrigin / DefaultCropSize values in the output DNG.","fix":"Return [u32; 4] (DNG supports 32-bit coordinates) or add explicit range assertions before casting.","locations":[{"ref":"rawler/src/dng/mod.rs:22-38","code":"   22 | pub fn rect_to_dng_area(area: &Rect) -> [u16; 4] {\n   23 |   [\n   24 |     area.p.y as u16,\n   25 |     area.p.x as u16,\n   26 |     area.p.y as u16 + area.d.h as u16,\n   27 |     area.p.x as u16 + area.d.w as u16,\n   28 |   ]\n   29 |   /*\n   30 |   [\n   31 |     image.crops[0] as u16, // top\n   32 |     image.crops[3] as u16, // left\n   33 |     //(image.height-image.crops[0]-image.crops[2]) as u16, // bottom\n   34 |     //(image.width-image.crops[1]-image.crops[3]) as u16, // Right\n   35 |     (image.height - (image.crops[2])) as u16, // bottom coord\n   36 |     (image.width - (image.crops[1])) as u16,  // Right coord\n   37 |   ]\n   38 |   */","lines":17,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/dng/mod.rs#L22-L38"}]},
{"id":"OVF_11","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"In dng/writer.rs write_rawimage(), DefaultCropOrigin and DefaultCropSize are written as [u16; 2]. For sensors wider/taller than 65535, the subtraction `crop.p.x - active_area.p.x` is computed in usize and then cast to u16, silently truncating for any coordinate > 65535.","fix":"Use u32 tags (DNG spec allows it) or validate that coordinates fit in u16 and return an error otherwise.","locations":[{"ref":"rawler/src/dng/writer.rs:201-215","code":"  201 |         self.ifd_mut().add_tag(\n  202 |           DngTag::DefaultCropOrigin,\n  203 |           [(crop.p.x - active_area.p.x) as u16, (crop.p.y - active_area.p.y) as u16],\n  204 |         );\n  205 |         self.ifd_mut().add_tag(DngTag::DefaultCropSize, [crop.d.w as u16, crop.d.h as u16]);\n  206 |       }\n  207 |       CropMode::Best => {\n  208 |         let crop = rawimage.crop_area.unwrap_or(active_area);\n  209 |         assert!(crop.p.x >= active_area.p.x);\n  210 |         assert!(crop.p.y >= active_area.p.y);\n  211 |         self.ifd_mut().add_tag(\n  212 |           DngTag::DefaultCropOrigin,\n  213 |           [(crop.p.x - active_area.p.x) as u16, (crop.p.y - active_area.p.y) as u16],\n  214 |         );\n  215 |         self.ifd_mut().add_tag(DngTag::DefaultCropSize, [crop.d.w as u16, crop.d.h as u16]);","lines":15,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/dng/writer.rs#L201-L215"}]},
{"id":"OVF_12","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"entry.rs parse() computes bytesize as (count as usize) << DATASHIFTS[compat_typ as usize]. For a count near usize::MAX / 8 with shift 3 (RATIONAL/SRATIONAL/DOUBLE/LONG), this left-shift overflows on 32-bit targets, leading to an allocation of a tiny buffer and then an out-of-bounds read.","fix":"Use checked_shl or saturating_shl and return an error on overflow.","locations":[{"ref":"rawler/src/formats/tiff/entry.rs:90","code":"   90 |     let bytesize: usize = (count as usize) << DATASHIFTS[compat_typ as usize];","lines":1,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/formats/tiff/entry.rs#L90"}]},
{"id":"OVF_13","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"entry.rs parse() counts Rational entries as count * 2 u32 values (line 147: vec![0; count as usize * 2]). If count is close to usize::MAX / 2 this multiplication overflows on 32-bit platforms, causing a mis-sized allocation.","fix":"Use count.checked_mul(2).ok_or(...)? before allocating.","locations":[{"ref":"rawler/src/formats/tiff/entry.rs:147","code":"  147 |         let mut tmp = vec![0; count as usize * 2]; // Rational is 2x u32","lines":1,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/formats/tiff/entry.rs#L147"}]},
{"id":"OVF_14","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"reader.rs EndianReader::position() also casts stream_position() from u64 to u32 (line 285). Same truncation risk for large files or embedded TIFFs at high offsets.","fix":"Use u32::try_from and return an error.","locations":[{"ref":"rawler/src/formats/tiff/reader.rs:290-292","code":"  290 |   pub fn position(&mut self) -> Result<u32> {\n  291 |     Ok(self.inner.stream_position().map(|v| v as u32)?)\n  292 |   }","lines":3,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/formats/tiff/reader.rs#L290-L292"}]},
{"id":"OVF_15","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"writer.rs TiffWriter::position() casts stream_position() from u64 to u32 with a plain 'as' cast (line 137). For files larger than 4 GiB this silently truncates the offset, causing all subsequent seeks and offset records to be wrong. This affects all TIFF files written by this code.","fix":"Use u32::try_from(pos).map_err(|_| TiffError::Overflow(...))? and propagate the error.","locations":[{"ref":"rawler/src/formats/tiff/writer.rs:137","code":"  137 |     Ok(self.writer.stream_position().map(|v| v as u32)?) // TODO: try_from?","lines":1,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/formats/tiff/writer.rs#L137"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In `client.rs` `stor()`, the path-traversal check `invalid_path(&path)` (line 628) operates on the *relative* path supplied by the client, before joining it with `self.cwd`. However, the actual file is written at `self.server_root.join(path.iter().skip(1))` inside `put_file` (line 656), which only strips the first component. If the client first uses CWD to navigate to a deep directory and then sends `STOR ../../../etc/passwd`, the relative `path` passed to `invalid_path` might not contain `..` but the joined path can still escape. Additionally `invalid_path` only checks for `Component::ParentDir` in the path itself, not in `self.cwd`.","fix":"After constructing the full server filesystem path in `put_file`, call `canonicalize` on the parent and verify it still starts with `server_root`, analogous to `complete_path`.","locations":[{"ref":"embedftp/src/client.rs:626-653","code":"  626 |   async fn stor(&mut self, path: PathBuf) -> Result<()> {\n  627 |     self.initiate_data_connection().await?;\n  628 |     if self.data_reader.is_some() {\n  629 |       if invalid_path(&path) {\n  630 |         return Err(Error::Io(io::ErrorKind::PermissionDenied.into()));\n  631 |       }\n  632 |       let path = self.cwd.join(path);\n  633 |       self\n  634 |         .send(Answer::new(ResultCode::DataConnectionAlreadyOpen, \"Starting to send file...\"))\n  635 |         .await?;\n  636 |       let data = self.receive_data().await?;\n  637 |       info!(\"Received file: {:?}, {} bytes\", path, data.len());\n  638 |       self.close_data_connection();\n  639 |       match self.put_file(path, Arc::new(data)).await {\n  640 |         Ok(_) => {\n  641 |           self.send(Answer::new(ResultCode::ClosingDataConnection, \"Transfer done\")).await?;\n  642 |         }\n  643 |         Err(e) => {\n  644 |           error!(\"Failed STOR command: {:?}\", e);\n  645 |           self.send(Answer::new(ResultCode::LocalErrorInProcessing, \"Failed to store the file\")).await?;\n  646 |         }\n  647 |       }\n  648 |     } else {\n  649 |       warn!(\"No opened data connection\");\n  650 |       self.send(Answer::new(ResultCode::ConnectionClosed, \"No opened data connection\")).await?;\n  651 |     }\n  652 |     Ok(())\n  653 |   }","lines":28,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/embedftp/src/client.rs#L626-L653"},{"ref":"embedftp/src/client.rs:709-717","code":"  709 | /// Check if the path contains \"..\"\n  710 | fn invalid_path(path: &Path) -> bool {\n  711 |   for component in path.components() {\n  712 |     if let Component::ParentDir = component {\n  713 |       return true;\n  714 |     }\n  715 |   }\n  716 |   false\n  717 | }","lines":9,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/embedftp/src/client.rs#L709-L717"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In colordata.rs, the Undefined value branch at line 47 returns an error for any version other than -4 and -3 ('Unknown2 COLORDATA version'). However, the same versions -4 and -3 are also handled identically in the Short branch below (lines 97-99). If Canon cameras produce Short-type entries for these models, they fall through to version matching and work fine. But for Undefined-type entries of any other version (which real cameras do produce), the function fails when it could fall through to the commented-out length-based matching. The Undefined branch is therefore incomplete and will reject valid data.","fix":"Extend the Undefined branch match to include all other known versions (1, 2, 3, ..., 48, 64, 65, 66), mirroring the Short branch logic.","locations":[{"ref":"rawler/src/decoders/cr2/colordata.rs:41-48","code":"   41 |       Ok(match version {\n   42 |         // -4 (M100/M5/M6)\n   43 |         -4 => ColorData::new(data, version, 0x47, Some(0x14d), Some(0x0569), Some(0x056a)),\n   44 |         // -3 (M10/M3)\n   45 |         -3 => ColorData::new(data, version, 0x47, Some(0x108), None, None),\n   46 | \n   47 |         _ => return Err(format!(\"Unknown2 COLORDATA version: {}\", data[0]).into()),\n   48 |       })","lines":8,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/cr2/colordata.rs#L41-L48"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In rotate_image(), the comment on line 606 acknowledges a bug: `active_area[2]` and `active_area[3]` are used in reverse order for cropheight. The code subtracts active_area[3] (which should be top/bottom) from height, but active_area is [left, top, right, bottom] by convention, so cropheight should use active_area[3] not active_area[2].","fix":"Verify the active_area layout. If it is [left, top, right, bottom] then: cropwidth = width - active_area[2] - active_area[0]; cropheight = height - active_area[3] - active_area[1].","locations":[{"ref":"rawler/src/decoders/raf.rs:594-598","code":"  594 |     if let Some(active_area) = self.camera.active_area {\n  595 |       let x = active_area[0];\n  596 |       let y = active_area[1];\n  597 |       let cropwidth = width - active_area[2] - x;\n  598 |       let cropheight = height - active_area[3] - y; // TODO: bug, invalid order of crop index","lines":5,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/raf.rs#L594-L598"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In decode_panasonic(), raw_format values 3 and 4 both call decode_panasonic_v4 (lines 360-361). This is almost certainly a copy-paste bug: format 3 and format 4 are treated identically. If they differ in behavior, one branch is wrong.","fix":"Verify the Panasonic format specification to determine if format 3 and format 4 actually use the same decoder.","locations":[{"ref":"rawler/src/decoders/rw2.rs:372-374","code":"  372 |     Ok(match raw_format {\n  373 |       3 => decode_panasonic_v4(buf, width, height, split, dummy),\n  374 |       4 => decode_panasonic_v4(buf, width, height, split, dummy),","lines":3,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/rw2.rs#L372-L374"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`JpegXLDecompressor::decompress` contains broken `skip_rows` logic. The outer loop does\n`for line in lines.skip(skip_rows)` which skips `skip_rows` entries from the *output*\niterator, leaving those output rows uninitialised. Meanwhile, the inner `while skip_rows\n> 0` loop consumes rows from the JXL stream to discard them, but only runs during the\n*first* output line (because `skip_rows` reaches 0 after the first iteration). The result\nis that the output rows at indices 0..skip_rows-1 are never filled, and the remaining\noutput rows receive incorrect data from the stream.\n\nThis is currently latent because `can_skip_rows()` returns `false`, so `decode_strips`\nalways calls with `skip_rows=0`. However, if `can_skip_rows` is ever changed to `true`,\nor if the function is called directly with non-zero `skip_rows`, the bug activates.","fix":"Consume and discard `skip_rows` rows from the stream *before* the output loop, without using `lines.skip()`. For example: `for _ in 0..skip_rows { stream.write_to_buffer(&mut tmp); }` followed by a plain `for line in lines` loop.","locations":[{"ref":"rawler/src/decompressors/jpegxl.rs:62-88","code":"   62 |       8 => {\n   63 |         let mut tmp = vec![0_u8; line_width];\n   64 | \n   65 |         for line in lines.skip(skip_rows) {\n   66 |           while skip_rows > 0 {\n   67 |             let written = stream.write_to_buffer(&mut tmp);\n   68 |             assert_eq!(line.len(), written);\n   69 |             skip_rows -= 1;\n   70 |           }\n   71 |           let written = stream.write_to_buffer(&mut tmp);\n   72 |           assert_eq!(line.len(), written);\n   73 |           for (p, x) in line.iter_mut().zip(tmp.iter()) {\n   74 |             *p = *x as u16; // Only change storage format, you MUST NOT scale up!\n   75 |           }\n   76 |         }\n   77 |       }\n   78 |       9..=16 => {\n   79 |         for line in lines.skip(skip_rows) {\n   80 |           while skip_rows > 0 {\n   81 |             let written = stream.write_to_buffer(line);\n   82 |             assert_eq!(line.len(), written);\n   83 |             skip_rows -= 1;\n   84 |           }\n   85 |           let written = stream.write_to_buffer(line);\n   86 |           assert_eq!(line.len(), written);\n   87 |         }\n   88 |       }","lines":27,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decompressors/jpegxl.rs#L62-L88"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"entry.rs parse() does not seek past the inline data when bytesize <= 4. For inline (embedded) entries, it calls reader.goto(base + offset) where offset = reader.position() - base (the current stream position minus base). This correctly points to the inline data bytes, reads them, then seeks to pos + 12 to advance. However, when bytesize <= 4 and the entry type is unknown (the x arm, lines 228-236), it also reads from the inline position, which is correct. The real issue is that reader.goto(base + offset) when offset = reader.position() - base means it seeks back to exactly the current position - so no actual seek occurs for inline data. This is correct by accident but the comment \"offset for reader\" is misleading.","fix":"Rename or document the embedded field more clearly to reflect its dual role (inline data value vs. file offset for large data).","locations":[{"ref":"rawler/src/formats/tiff/entry.rs:91-95","code":"   91 |     let offset: u32 = if bytesize <= 4 {\n   92 |       reader.position()? - base\n   93 |     } else {\n   94 |       apply_corr(reader.read_u32()?, corr)\n   95 |     };","lines":5,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/formats/tiff/entry.rs#L91-L95"},{"ref":"rawler/src/formats/tiff/entry.rs:33-35","code":"   33 |   // Embedded value for writer, offset for reader\n   34 |   // This is only None when building an IFD for writing.\n   35 |   pub embedded: Option<u32>, // TODO: rename it","lines":3,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/formats/tiff/entry.rs#L33-L35"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"ResolutionUnit::extract() reads from TiffCommonTag::Predictor instead of TiffCommonTag::ResolutionUnit. This means calling ResolutionUnit::extract() on an IFD will silently return the Predictor tag value (or None if Predictor is absent), never the actual resolution unit.","fix":"Change the tag in ResolutionUnit::extract() from TiffCommonTag::Predictor to TiffCommonTag::ResolutionUnit.","locations":[{"ref":"rawler/src/formats/tiff/mod.rs:166-175","code":"  166 |     let tag = TiffCommonTag::Predictor;\n  167 |     if let Some(entry) = ifd.get_entry(tag) {\n  168 |       let x = entry.value.force_u16(0);\n  169 |       Ok(Some(\n  170 |         Self::n(x).ok_or_else(|| TiffError::General(format!(\"Unknown value {} for {:?}\", x, tag)))?,\n  171 |       ))\n  172 |     } else {\n  173 |       Ok(None)\n  174 |     }\n  175 |   }","lines":10,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/formats/tiff/mod.rs#L166-L175"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `extract.rs` `get_original_name()`, the function indexes `orig_name.strings()[0]` without checking if the strings slice is non-empty. If the DNG tag exists but has an empty ASCII value array, this will panic.","fix":"Use `.strings().first().cloned()` and return `None` when the slice is empty.","locations":[{"ref":"bin/dnglab/dnglab-lib/src/extract.rs:138-148","code":"  138 | fn get_original_name(file: &GenericTiffReader) -> Option<String> {\n  139 |   if let Some(Entry {\n  140 |     value: Value::Ascii(orig_name),\n  141 |     ..\n  142 |   }) = file.get_entry(DngTag::OriginalRawFileName)\n  143 |   {\n  144 |     Some(orig_name.strings()[0].clone())\n  145 |   } else {\n  146 |     None\n  147 |   }\n  148 | }","lines":11,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/bin/dnglab/dnglab-lib/src/extract.rs#L138-L148"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `makedng.rs` `makedng()` (lines 44-53), when `makedng_internal` fails, the code attempts to remove `dest_path`. However `makedng_internal` creates and opens `dest_path` with `File::create` (line 78) and may have written partial data. The cleanup attempt calls `remove_file(dest_path)` and logs any error but returns the original error. If `makedng_internal` fails *before* creating the file (e.g. argument validation), `remove_file` will fail on a non-existent path and log a spurious error.","fix":"Only attempt cleanup if the file actually exists, or track whether the file was created inside `makedng_internal`.","locations":[{"ref":"bin/dnglab/dnglab-lib/src/makedng.rs:57-66","code":"   57 |   match makedng_internal(options, dest_path).await {\n   58 |     Ok(_) => Ok(()),\n   59 |     Err(err) => {\n   60 |       if let Err(err) = remove_file(dest_path) {\n   61 |         log::error!(\"Failed to delete DNG file after decompress error: {:?}\", err);\n   62 |       }\n   63 |       Err(err)\n   64 |     }\n   65 |   }\n   66 | }","lines":10,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/bin/dnglab/dnglab-lib/src/makedng.rs#L57-L66"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `makedng.rs`, when a 16-bit RGB input image is used and no linearization table is specified, the WhiteLevel tag is set to `[u16::MAX, u16::MAX, u16::MAX]` (line 148). This is the correct value, but the comment on line 146 still reads 'so from 8 bit image there is a maximum white level of 255', copied from the 8-bit branch directly above it. The comment is wrong and misleading.","fix":"Update the comment to say '16 bit image, maximum white level is 65535 (u16::MAX)'.","locations":[{"ref":"bin/dnglab/dnglab-lib/src/makedng.rs:157-162","code":"  157 |             frame.ifd_mut().add_tag(DngTag::LinearizationTable, linear_table_input);\n  158 |           } else {\n  159 |             // We have no linearization table, so from 8 bit image there is a maximum\n  160 |             // white level of 255.\n  161 |             frame.ifd_mut().add_tag(DngTag::WhiteLevel, [u16::MAX, u16::MAX, u16::MAX]);\n  162 |           }","lines":6,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/bin/dnglab/dnglab-lib/src/makedng.rs#L157-L162"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `client.rs` `epsv()`, when the parameter is the literal string `\"ALL\"` the method sets `self.data_writer = None` and returns `Ok(())` without sending any response to the client. Per RFC 2428 the server must reply with code 229 after `EPSV ALL` (or 200/502). Returning silently breaks the FTP protocol handshake.","fix":"Send an appropriate reply (e.g. `ResultCode::Ok` or `ResultCode::CommandNotImplemented`) before returning.","locations":[{"ref":"embedftp/src/client.rs:521-525","code":"  521 |     if let Some(proto) = proto {\n  522 |       if proto.to_uppercase().eq(\"ALL\") {\n  523 |         self.data_writer = None;\n  524 |         return Ok(());\n  525 |       }","lines":5,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/embedftp/src/client.rs#L521-L525"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"LookupTable::new() computes base = center - ((upper - lower + 2) / 4). Since all values are u16, the subtraction 'center - ...' wraps if the result would be negative, silently producing a large base value and a corrupted dither output instead of clamping to zero.","fix":"Use saturating_sub: let base = center.saturating_sub((upper - lower + 2) / 4);","locations":[{"ref":"rawler/src/bits.rs:222-223","code":"  222 |       let base = if center == 0 { 0 } else { center - ((upper - lower + 2) / 4) };\n  223 |       let delta = upper - lower;","lines":2,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/bits.rs#L222-L223"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"CFA::color_at() and cfa_color_at() use (row + 48) % 48 and (col + 48) % 48 to index into the pattern array. This only works when row < 96 and col < 96. For rows or columns >= 96, (row + 48) overflows modular arithmetic and returns the wrong pattern cell. The comment says 'designed to be fast for inner loops' but the modulo trick silently gives wrong results for large coordinates.","fix":"Use row % self.height and col % self.width (with early return for empty CFA), or row % 48 and col % 48 which is correct for the 48x48 pre-expanded table without the +48 bias.","locations":[{"ref":"rawler/src/cfa.rs:167-176","code":"  167 |   pub fn color_at(&self, row: usize, col: usize) -> usize {\n  168 |     self.pattern[(row + 48) % 48][(col + 48) % 48] as usize\n  169 |   }\n  170 | \n  171 |   /// from inner loops without performance issues.\n  172 |   pub fn cfa_color_at(&self, row: usize, col: usize) -> CFAColor {\n  173 |     (self.pattern[(row + 48) % 48][(col + 48) % 48])\n  174 |       .try_into()\n  175 |       .expect(\"invalid CFA color value in pattern\")\n  176 |   }","lines":10,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/cfa.rs#L167-L176"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"CFA::unique_colors() iterates over all 48x48 cells of the pre-expanded pattern array rather than just the self.height x self.width repeating tile. For a 2x2 RGGB pattern it still counts duplicates from 2304 cells, which accidentally still gives the correct unique count, but the implementation intent is misleading and wastes work. For an empty CFA (width == 0 or height == 0) the full array is scanned, returning up to 256 unique zeros which would be reported as 1.","fix":"Iterate only over pattern[..self.height][..self.width] and handle the empty case explicitly.","locations":[{"ref":"rawler/src/cfa.rs:191-193","code":"  191 |   pub fn unique_colors(&self) -> usize {\n  192 |     self.pattern.iter().flatten().unique().count()\n  193 |   }","lines":3,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/cfa.rs#L191-L193"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"char_slice_to_string() always returns Some(...) even for an empty slice (it would return Some(\"\")). The caller at line 35 uses unwrap_or(\"\") unnecessarily. More importantly, if the buf does not contain a null terminator within 30 bytes the entire 30-byte slice is used as the model name without truncation.","fix":"The function is correct (it stops at null), but the comment about its behavior should be added. Also check: if the buffer has no null, chars past legitimate data are included.","locations":[{"ref":"rawler/src/decoders/ari.rs:35","code":"   35 |     let model = String::from_utf8_lossy(buffer).split_terminator('\\0').next().unwrap_or(\"\").to_string();","lines":1,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/ari.rs#L35"},{"ref":"rawler/src/decoders/ari.rs:102-104","code":"  102 | fn char_slice_to_string(buf: &[u8]) -> Option<String> {\n  103 |   Some(buf.iter().take_while(|&&c| c != 0).map(|&c| char::from(c)).collect())\n  104 | }","lines":3,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/ari.rs#L102-L104"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In crw.rs get_wb(), when CiffTag::ColorInfo1 is found and the camera has the wb_mangle hint, the green channel (index 1) and blue channel (index 2) are assigned the same value: `cinfo.get_force_u16(off + 0) ^ key[0]`. Index 0 is used for both channels 1 and 2. This is likely a copy-paste error; channel 2 should use a different offset (probably off+1 swapped with off+0 in a different order).","fix":"Verify against libraw/dcraw reference: channels 1 and 2 should use distinct offsets. Likely fix is `cinfo.get_force_u16(off + 1) ^ key[0]` for channel 2 or similar.","locations":[{"ref":"rawler/src/decoders/crw.rs:150-153","code":"  150 |         (cinfo.get_force_u16(off + 1) ^ key[1]) as f32,\n  151 |         (cinfo.get_force_u16(off + 0) ^ key[0]) as f32,\n  152 |         (cinfo.get_force_u16(off + 0) ^ key[0]) as f32,\n  153 |         (cinfo.get_force_u16(off + 2) ^ key[0]) as f32,","lines":4,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/crw.rs#L150-L153"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In decode_segment(), `lens[i + 1]` is accessed when i iterates 0..size with step_by(2), so the maximum i is size - 2 (for even size) or size - 1 (for odd size). However `lens[i]` uses peek_u8() and `lens[i+1]` uses get_u8(). When `size` is odd and `i == size - 1`, `lens[i+1]` writes to `lens[size]` which is in-bounds (lens is size 256), but the loop condition `i..size step_by 2` only runs i up to size-1 for odd size, so i+1 == size which would be out-of-bounds if size > 255.","fix":"Verify the maximum size value passed and add a bounds check on `size <= 255`.","locations":[{"ref":"rawler/src/decoders/dcr.rs:138-141","code":"  138 |     for i in (0..size).step_by(2) {\n  139 |       lens[i] = (input.peek_u8() & 15) as usize;\n  140 |       lens[i + 1] = (input.get_u8() >> 4) as usize;\n  141 |     }","lines":4,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/dcr.rs#L138-L141"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"get_wb() accesses levels.get_data() at byte offsets 48 and 50, which assumes at least 52 bytes of data in the EpsonWB tag. The count check only verifies count == 256 (entries), but does not check the byte size of the tag data. If the tag stores 8-bit values, 256 entries is only 256 bytes, but BEu16 reads 2-byte values and offset 50 reads entry at index 25.","fix":"Add a check that the raw data slice is at least 52 bytes long before accessing it.","locations":[{"ref":"rawler/src/decoders/erf.rs:96-103","code":"   96 |     let levels = fetch_tiff_tag!(self.makernote, TiffCommonTag::EpsonWB);\n   97 |     if levels.count() != 256 {\n   98 |       Err(RawlerError::DecoderFailed(\"ERF: Levels count is off\".to_string()))\n   99 |     } else {\n  100 |       let r = BEu16(levels.get_data(), 48) as f32;\n  101 |       let b = BEu16(levels.get_data(), 50) as f32;\n  102 |       Ok([r * 508.0 * 1.078 / 65536.0, 1.0, b * 382.0 * 1.173 / 65536.0, f32::NAN])\n  103 |     }","lines":8,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/erf.rs#L96-L103"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In decode_compressed_sv2(), the error-recovery path (lines 1144-1157) re-uses the pump savepoint, but `prev_pix_value` is not reset before the re-decode loop. This means the recovery path computes deltas using the corrupted values from the first (failed) pass, producing incorrect pixel values.","fix":"Save and restore prev_pix_value along with the pump savepoint.","locations":[{"ref":"rawler/src/decoders/iiq.rs:1143-1157","code":" 1143 |               warn!(\"Error in IIQ Sv2 decompressor, run error recovery\");\n 1144 |               // restore pump\n 1145 |               pump = pump_savepoint;\n 1146 |               for i in 0..8 {\n 1147 |                 let value = if bit_check[i & 1] == 9 {\n 1148 |                   // Just get the value straight out the bit pump\n 1149 |                   pump.get_bits(14)\n 1150 |                 } else {\n 1151 |                   // Otherwise reconstruct the value\n 1152 |                   let tmp = prev_pix_value[i & 1] as i32 + (pump.get_bits(nbits) << corr[i & 1]) as i32 - diff[i & 1] as i32;\n 1153 |                   clamp(tmp as i32, 0, 0x3FFF) as u32\n 1154 |                 };\n 1155 |                 cluster[i] = (value as u16) << value_shift;\n 1156 |                 prev_pix_value[i & 1] = value;\n 1157 |               }","lines":15,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/iiq.rs#L1143-L1157"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In get_decoder(), the JFIF branch only dispatches to MrwDecoder for 'Konica Minolta Photo Imaging, Inc.' make. Other makes within JFIF containers are silently ignored with only a warning log. This means files from other makes that embed RAW data in JFIF containers are not decoded.","fix":"Either document that only Minolta MRW-in-JFIF is supported, or dispatch to other decoders.","locations":[{"ref":"rawler/src/decoders/mod.rs:935-951","code":"  935 |     if jfif::is_exif(rawfile) {\n  936 |       let exif = jfif::Jfif::new(rawfile)?;\n  937 |       if let Some(make) = exif\n  938 |         .exif_ifd()\n  939 |         .and_then(|ifd| ifd.get_entry(TiffCommonTag::Make))\n  940 |         .and_then(|entry| entry.value.as_string().map(|s| s.as_str().trim_end()))\n  941 |       {\n  942 |         match make {\n  943 |           \"Konica Minolta Photo Imaging, Inc.\" => {\n  944 |             let dec = Box::new(mrw::MrwDecoder::new_jfif(rawfile, exif, self)?);\n  945 |             return Ok(dec as Box<dyn Decoder>);\n  946 |           }\n  947 |           _ => {\n  948 |             log::warn!(\"Unknown make for EXIF file: {}\", make);\n  949 |           }\n  950 |         }\n  951 |       }","lines":17,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/mod.rs#L935-L951"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"xmp_tag() parses XMP with naive string searching using xmp.find(). The start index is computed as `start + tag.len() + 7` where 7 is the length of `<tiff:>`. This calculation is correct only for single-char tag names. For longer names the calculation `start + tag.len() + 7` should give the position after `<tiff:{tag}>`, i.e., start + 7 + tag.len(). Since that is what the code computes, it may be correct, but the end boundary `end` points to the `<` of the closing tag, so the substring `xmp[start + tag.len() + 7..end]` would start after the opening tag and end before the closing tag. However, this only works if there is no whitespace or attributes in the tag. Corner cases will silently return wrong data.","fix":"Use a proper XMP/XML parser or add better boundary validation.","locations":[{"ref":"rawler/src/decoders/mos.rs:110-118","code":"  110 |   fn xmp_tag(tiff: &GenericTiffReader, tag: &str) -> Result<String> {\n  111 |     let xmp_bytes = fetch_tiff_tag!(tiff, TiffCommonTag::Xmp).get_data();\n  112 |     let xmp = String::from_utf8_lossy(xmp_bytes);\n  113 |     let error = format!(\"MOS: Couldn't find XMP tag {}\", tag);\n  114 |     let start = xmp.find(&format!(\"<tiff:{}>\", tag)).ok_or_else(|| error.clone())?;\n  115 |     let end = xmp.find(&format!(\"<\/tiff:{}>\", tag)).ok_or(error)?;\n  116 | \n  117 |     Ok(xmp[start + tag.len() + 7..end].to_string())\n  118 |   }","lines":9,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/mos.rs#L110-L118"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In get_mly_wb(), the MLY scanning loop reads 16-bit words from the full raw file buffer until `buf.position() < data_offset`. It uses a heuristic pattern match (wb[1]==256 && wb[3]==256 && ...) which is inherently fragile. Any random data matching this pattern would be accepted as a valid WB.","fix":"Document the known-good offset range or add additional validation to reduce false positives.","locations":[{"ref":"rawler/src/decoders/mrw.rs:84-100","code":"   84 |         let mut cam_mul = [1_u16; 4];\n   85 | \n   86 |         while buf.position() < data_offset {\n   87 |           wb[0] = wb[2];\n   88 |           wb[2] = wb[1];\n   89 |           wb[1] = wb[3];\n   90 |           wb[3] = match buf.read_u16::<byteorder::BigEndian>() {\n   91 |             Ok(val) => val,\n   92 |             Err(_) => break,\n   93 |           };\n   94 |           if wb[1] == 256 && wb[3] == 256 && wb[0] > 256 && wb[0] < 640 && wb[2] > 256 && wb[2] < 640 {\n   95 |             cam_mul.copy_from_slice(&wb);\n   96 |             cam_mul.swap(2, 3);\n   97 |             log::debug!(\"Found WB match: {:?}\", cam_mul);\n   98 |           }\n   99 |         }\n  100 |         return Ok(cam_mul);","lines":17,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/mrw.rs#L84-L100"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In get_focal_len(), focal[1] is used as the focal length but focal[0] is the conventional storage slot. The comment says \"get(1)\" which skips the first rational numerator and uses a denominator or a second value. This is likely a copy-paste from ORF-specific behavior but is unverified.","fix":"Verify against real samples whether index 0 or 1 is the correct focal-length value.","locations":[{"ref":"rawler/src/decoders/orf.rs:432-434","code":"  432 |       {\n  433 |         return Ok(focal.get(1).map(|v| Rational::new(*v as u32, 1)));\n  434 |       }","lines":3,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/orf.rs#L432-L434"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In do_decode(), the Huffman 'find smallest' loop (lines 293-303) writes the index of the smallest-valued element to htable.huffval[i], but v2[sm_num as usize] is set to 0xffffffff only after the outer loop body. If two elements share the minimum value, the second occurrence is always chosen over the first, producing an incorrect (non-canonical) Huffman table.","fix":"Change the inner comparison to strict less-than (`v2[j] < sm_val`) so that the first minimum is always selected.","locations":[{"ref":"rawler/src/decoders/pef.rs:293-304","code":"  293 |       for i in 0..depth {\n  294 |         let mut sm_val: u32 = 0xfffffff;\n  295 |         let mut sm_num: u32 = 0xff;\n  296 |         for j in 0..depth {\n  297 |           if v2[j] <= sm_val {\n  298 |             sm_num = j as u32;\n  299 |             sm_val = v2[j];\n  300 |           }\n  301 |         }\n  302 |         htable.huffval[i] = sm_num;\n  303 |         v2[sm_num as usize] = 0xffffffff;\n  304 |       }","lines":12,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/pef.rs#L293-L304"}]},
{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In decompress_quicktake_100(), `pix` is a statically sized 2D array of `[[0x80_i16; 644]; 484]`. The loops use `height + 2` as the row bound and `width + 2` as the column bound. If width > 642 or height > 482 the inner indexing like `pix[row + 2][col + 2]` will index out of bounds.","fix":"Add an upfront check that width <= 640 and height <= 480 before entering the decode loops.","locations":[{"ref":"rawler/src/decoders/qtk.rs:170-227","code":"  170 |     let mut pix = [[0x80_i16; 644]; 484];\n  171 | \n  172 |     for row in 2..(height + 2) {\n  173 |       let cstart = 2 + (row & 1);\n  174 |       let mut val = 0;\n  175 |       for col in (cstart..(width + 2)).step_by(2) {\n  176 |         val = (((pix[row - 1][col - 1] + 2 * pix[row - 1][col + 1] + pix[row][col - 2]) >> 2) + GSTEP[pump.get_bits(4) as usize]).clamp(0, 255);\n  177 |         pix[row][col] = val;\n  178 |         if col < 4 {\n  179 |           pix[row][col - 2] = val;\n  180 |           pix[row + 1][(!row) & 1] = val;\n  181 |         }\n  182 |         if row == 2 {\n  183 |           pix[row - 1][col + 1] = val;\n  184 |           pix[row - 1][col + 3] = val;\n  185 |         }\n  186 |       }\n  187 |       pix[row][width + 2 + (row & 1)] = val; // last column\n  188 |     }\n  189 | \n  190 |     for rb in 0..2 {\n  191 |       for row in ((2 + rb)..(height + 2)).step_by(2) {\n  192 |         for col in ((3 - (row & 1))..(width + 2)).step_by(2) {\n  193 |           let sharp = if row < 4 || col < 4 {\n  194 |             2\n  195 |           } else {\n  196 |             let val = (pix[row - 2][col] - pix[row][col - 2]).abs() as i32\n  197 |               + (pix[row - 2][col] - pix[row - 2][col - 2]).abs() as i32\n  198 |               + (pix[row][col - 2] - pix[row - 2][col - 2]).abs() as i32;\n  199 |             match val {\n  200 |               0..4 => 0,\n  201 |               4..8 => 1,\n  202 |               8..16 => 2,\n  203 |               16..32 => 3,\n  204 |               32..48 => 4,\n  205 |               _ => 5,\n  206 |             }\n  207 |           };\n  208 | \n  209 |           let val = (((pix[row - 2][col] + pix[row][col - 2]) >> 1) + RSTEP[sharp][pump.get_bits(2) as usize]).clamp(0, 255);\n  210 | \n  211 |           pix[row][col] = val;\n  212 |           if row < 4 {\n  213 |             pix[row - 2][col + 2] = val;\n  214 |           };\n  215 |           if col < 4 {\n  216 |             pix[row + 2][col - 2] = val;\n  217 |           };\n  218 |         }\n  219 |       }\n  220 |     }\n  221 | \n  222 |     for row in 2..(height + 2) {\n  223 |       for col in ((3 - (row & 1))..(width + 2)).step_by(2) {\n  224 |         let val = ((pix[row][col - 1] + (pix[row][col] << 2) + pix[row][col + 1]) >> 1) - 0x100;\n  225 |         pix[row][col] = val.clamp(0, 255);\n  226 |       }\n  227 |     }","lines":58,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/qtk.rs#L170-L227"}]},
{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"decode_dbp() hardcodes `n_tiles = 8` and derives `tile_width = width / n_tiles`. If width is not evenly divisible by 8, the tile_width calculation truncates and the total decoded pixels will be less than width * height. The remaining columns are left uninitialised.","fix":"Assert or check that width % 8 == 0, or handle the remainder columns.","locations":[{"ref":"rawler/src/decoders/raf/dbp.rs:15-16","code":"   15 |   let n_tiles = 8;\n   16 |   let tile_width = width / n_tiles;","lines":2,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/raf/dbp.rs#L15-L16"}]},
{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In get_crop(), the crop Rect is built using `crop_right - crop_left` for width and `crop_bottom - crop_top` for height (subtraction). If crop_right < crop_left or crop_bottom < crop_top due to malformed metadata, this underflows (usize arithmetic). The result would be a nonsensical huge rectangle.","fix":"Use checked_sub or validate that crop_right >= crop_left and crop_bottom >= crop_top before computing the difference.","locations":[{"ref":"rawler/src/decoders/rw2.rs:334-341","code":"  334 |       let crop_right = fetch_tiff_tag!(self.tiff, PanasonicTag::CropRight).force_usize(0);\n  335 |       let crop_bottom = fetch_tiff_tag!(self.tiff, PanasonicTag::CropBottom).force_usize(0);\n  336 |       Ok(Some(Rect::new(\n  337 |         Point::new(crop_left, crop_top),\n  338 |         Dim2::new(crop_right - crop_left, crop_bottom - crop_top),\n  339 |       )))\n  340 |     } else {\n  341 |       Ok(None)","lines":8,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/rw2.rs#L334-L341"}]},
{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In get_active_area(), similarly, sensor_right - sensor_left and sensor_bottom - sensor_top can underflow if sensor values are inconsistent in the file.","fix":"Add validation or use saturating_sub.","locations":[{"ref":"rawler/src/decoders/rw2.rs:345-357","code":"  345 |   fn get_active_area(&self) -> Result<Option<Rect>> {\n  346 |     if self.tiff.has_entry(PanasonicTag::SensorLeftBorder) {\n  347 |       let sensor_left = fetch_tiff_tag!(self.tiff, PanasonicTag::SensorLeftBorder).force_usize(0);\n  348 |       let sensor_top = fetch_tiff_tag!(self.tiff, PanasonicTag::SensorTopBorder).force_usize(0);\n  349 |       let sensor_right = fetch_tiff_tag!(self.tiff, PanasonicTag::SensorRightBorder).force_usize(0);\n  350 |       let sensor_bottom = fetch_tiff_tag!(self.tiff, PanasonicTag::SensorBottomBorder).force_usize(0);\n  351 |       Ok(Some(Rect::new(\n  352 |         Point::new(sensor_left, sensor_top),\n  353 |         Dim2::new(sensor_right - sensor_left, sensor_bottom - sensor_top),\n  354 |       )))\n  355 |     } else {\n  356 |       Ok(None)\n  357 |     }","lines":13,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/rw2.rs#L345-L357"}]},
{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In decode_strip(), the col & 3 ordering for the 4-pixel group is: col & 3 == 0 writes destpixel[0], col & 3 == 2 writes destpixel[1], col & 3 == 1 writes destpixel[2], col & 3 == 3 writes destpixel[3]. The interleaved ordering (0, 2, 1, 3 mod-4 sequence) suggests the pixels within a group are decoded non-sequentially, which may be intentional but is confusing and could indicate an indexing error.","fix":"Add a comment explaining the non-sequential RGRG interleave layout, or verify against the reference C++ implementation.","locations":[{"ref":"rawler/src/decoders/rw2/v8decompressor.rs:449-463","code":"  449 |       let destpixel = &mut linebuf[col & !0x3..];\n  450 | \n  451 |       if col & 3 == 2 {\n  452 |         let val = state.current_base.coeff[1] as i32 + delta;\n  453 |         destpixel[1] = clamp(val, 0, state.datamax) as u16;\n  454 |       } else if col & 3 == 1 {\n  455 |         let val = state.current_base.coeff[2] as i32 + delta;\n  456 |         destpixel[2] = clamp(val, 0, state.datamax) as u16;\n  457 |       } else if col & 3 != 0 {\n  458 |         let val = state.current_base.coeff[3] as i32 + delta;\n  459 |         destpixel[3] = clamp(val, 0, state.datamax) as u16;\n  460 |       } else {\n  461 |         let val = state.current_base.coeff[0] as i32 + delta;\n  462 |         destpixel[0] = clamp(val, 0, state.datamax) as u16;\n  463 |       }","lines":15,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/rw2/v8decompressor.rs#L449-L463"}]},
{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In idwt.rs getline(), the index expression `(self.flt_tap_h as i32 - self.cur_h as i32 + 5) as usize % 5 + 3` can produce a negative intermediate when cast - if flt_tap_h < cur_h and the difference is greater than 5, the addition of 5 may not recover the sign, producing a large usize value that indexes out of bounds into line_buf (len 8). The debug_assert on line 81 only catches cur_h == 0 but not the index range.","fix":"Use modular arithmetic that handles negative values: `((self.flt_tap_h as i32 - self.cur_h as i32).rem_euclid(5)) as usize + 3`","locations":[{"ref":"rawler/src/decompressors/crx/idwt.rs:80","code":"   80 |     let result = &self.line_buf[(self.flt_tap_h as i32 - self.cur_h as i32 + 5) as usize % 5 + 3];","lines":1,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decompressors/crx/idwt.rs#L80"}]},
{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In iquant.rs get_subband_row(), line 334: `row - self.row_end_addon` is used in the middle branch, but the condition is `row < self.height - self.row_end_addon`. The subtrahend in the return should be `self.row_start_addon`, not `self.row_end_addon`, to correctly compute the row index into the QStep table. Using row_end_addon as offset produces wrong row indices for multi-tile images with non-zero row_start_addon.","fix":"Change the return to `row - self.row_start_addon`.","locations":[{"ref":"rawler/src/decompressors/crx/mdat.rs:334","code":"  334 |       row - self.row_end_addon","lines":1,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decompressors/crx/mdat.rs#L334"}]},
{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"rawdb::retry_delay() for attempt == 2 computes 60u64.saturating_mul(1u64 << (2 - 2)) == 60 * 1 == 60s, and for attempt == 3 gives 60 * 2 == 120s. However, for attempt == 4 and beyond (should MAX_RETRIES ever increase), the shift 1u64 << (n - 2) can overflow if n >= 66, causing saturating_mul to still be very large but the shift itself is well-defined in Rust only up to 63 for u64.","fix":"Cap the retry delay at a maximum duration to avoid potential overflow for large n, or clamp (n - 2) to at most 63.","locations":[{"ref":"rawler/src/devtools/rawdb.rs:114-118","code":"  114 | fn retry_delay(attempt: u32) -> Duration {\n  115 |   match attempt {\n  116 |     1 => Duration::from_secs(10),\n  117 |     n => Duration::from_secs(60u64.saturating_mul(1u64 << (n - 2))),\n  118 |   }","lines":5,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/devtools/rawdb.rs#L114-L118"}]},
{"id":"LOGIC_33","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In write_to_stream() the index table stores (chunks.len() + 1) offsets: one for the start of chunk 0, then one end-offset per chunk. The new() reader, however, reads (raw_fork_blocks + 1) offsets - where raw_fork_blocks = raw_fork_size.div_ceil(COMPRESS_BLOCK_SIZE). If compression produces a different number of chunks than div_ceil predicts (e.g. for very small inputs), the reader and writer disagree on how many index entries exist, leading to corrupt reads.","fix":"Store the actual chunk count in the header, or make both sides use the same formula.","locations":[{"ref":"rawler/src/dng/original.rs:39-61","code":"   39 |     let raw_fork_blocks: u32 = raw_fork_size.div_ceil(COMPRESS_BLOCK_SIZE); // (raw_fork_size + (COMPRESS_BLOCK_SIZE - 1)) / COMPRESS_BLOCK_SIZE\n   40 | \n   41 |     let mut index_list: Vec<u32> = Vec::with_capacity(raw_fork_blocks as usize + 1);\n   42 | \n   43 |     for _ in 0..raw_fork_blocks + 1 {\n   44 |       let idx = stream.read_u32::<BigEndian>()?;\n   45 |       index_list.push(idx);\n   46 |     }\n   47 | \n   48 |     let mut chunks = Vec::with_capacity(index_list.len());\n   49 |     let mut iter = index_list.into_iter().map(u64::from);\n   50 | \n   51 |     if let Some(mut offset) = iter.next() {\n   52 |       stream.seek(SeekFrom::Start(start + offset))?;\n   53 |       for end in iter {\n   54 |         let len = end\n   55 |           .checked_sub(offset)\n   56 |           .ok_or_else(|| io::Error::new(io::ErrorKind::InvalidInput, \"Offset underflow\"))?;\n   57 |         let mut chunk = vec![0; len as usize];\n   58 |         stream.read_exact(&mut chunk)?;\n   59 |         chunks.push(ForkBlock::new(chunk));\n   60 |         offset = end;\n   61 |       }","lines":23,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/dng/original.rs#L39-L61"},{"ref":"rawler/src/dng/original.rs:118-126","code":"  118 |     let chunks_start: u32 = (size_of::<u32>() + (self.chunks.len() + 1) * size_of::<u32>()) as u32;\n  119 |     // Offset of first chunk\n  120 |     stream.write_all(&chunks_start.to_be_bytes())?;\n  121 |     // Write all other end offsets.\n  122 |     for end in self.chunks.iter().map(ForkBlock::len).scan(chunks_start, |end, len| {\n  123 |       *end += len as u32;\n  124 |       Some(*end)\n  125 |     }) {\n  126 |       stream.write_all(&end.to_be_bytes())?;","lines":9,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/dng/original.rs#L118-L126"}]},
{"id":"LOGIC_34","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In original.rs compress(), the compressed chunks are produced in parallel via par_iter(), but the ordering of results from rayon's parallel flat_map is not guaranteed to match the input order. If chunks arrive out of order, the written index table will be wrong and decompression will return corrupt data.","fix":"Use par_iter().map(...).collect::<Result<Vec<_>>>() (which preserves order) instead of par_iter().flat_map(). Rayon's parallel collect preserves element order; flat_map on a parallel iterator does not guarantee it.","locations":[{"ref":"rawler/src/dng/original.rs:104","code":"  104 |     let chunks = forks.par_iter().flat_map(ForkBlock::compress).collect();","lines":1,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/dng/original.rs#L104"}]},
{"id":"LOGIC_35","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In dng/writer.rs write_rawimage(), the matrix selection prefers Illuminant::A twice: `remove_entry(&Illuminant::A).or_else(|| available_matrices.remove_entry(&Illuminant::A))`. The second fallback is identical to the first and will never match anything the first did not, making it dead code. This was likely meant to be a different illuminant.","fix":"Replace one of the duplicate `Illuminant::A` entries with the intended illuminant (e.g. Illuminant::Tungsten or another standard).","locations":[{"ref":"rawler/src/dng/writer.rs:160-163","code":"  160 |         let first_matrix = available_matrices\n  161 |           .remove_entry(&Illuminant::A)\n  162 |           .or_else(|| available_matrices.remove_entry(&Illuminant::A))\n  163 |           .or_else(|| available_matrices.remove_entry(&first_key))","lines":4,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/dng/writer.rs#L160-L163"}]},
{"id":"LOGIC_36","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"ftyp.rs brand_count calculation is (header.size - 16) / 4. If header.size < 16 this underflows to a huge u64, leading to an enormous allocation and read attempt. header.size of 0 is valid for extended boxes (size==0 means \"to EOF\") but the ftyp check (header.size % 4 != 0) does not catch size < 16.","fix":"Check header.size >= 16 before the subtraction.","locations":[{"ref":"rawler/src/formats/bmff/ftyp.rs:26-29","code":"   26 |     if header.size % 4 != 0 {\n   27 |       return Err(BmffError::Parse(\"invalid ftyp size\".into()));\n   28 |     }\n   29 |     let brand_count = (header.size - 16) / 4; // header + major + minor","lines":4,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/formats/bmff/ftyp.rs#L26-L29"}]},
{"id":"LOGIC_37","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"bmff/mod.rs BoxHeader::parse() reads size as u32 and casts to u64, then reads a u64 if size == 1 (extended box). It does NOT handle size == 0, which per the BMFF spec means the box extends to the end of file. end_offset() would then return 0, causing all child-box parsers to immediately exit their while loops.","fix":"Handle size == 0 by computing end_offset as the file size.","locations":[{"ref":"rawler/src/formats/bmff/mod.rs:72-76","code":"   72 |     let mut size = reader.read_u32::<BigEndian>()? as u64;\n   73 |     let typ = reader.read_u32::<BigEndian>()?.into();\n   74 |     if size == 1 {\n   75 |       size = reader.read_u64::<BigEndian>()?;\n   76 |     }","lines":5,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/formats/bmff/mod.rs#L72-L76"},{"ref":"rawler/src/formats/bmff/mod.rs:94-96","code":"   94 |   pub fn end_offset(&self) -> u64 {\n   95 |     self.offset + self.size\n   96 |   }","lines":3,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/formats/bmff/mod.rs#L94-L96"}]},
{"id":"LOGIC_38","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"bmff/mod.rs FileBox::parse() calls file.seek(SeekFrom::End(0)) to get the file size, but uses the return value of this seek (which is the resulting position, i.e. file size) as the sentinel for the outer loop. If the file is empty this returns 0 and the loop body is never entered, silently producing a parse error from the ok_or_else() calls - which is fine. However, the returned size from seek(End(0)) is used as-is while current starts at 0 (from seek(Start(0))). If the file has a box whose size field is larger than the actual file, child parsers will seek past EOF without error (Seek past EOF on a File typically succeeds on many platforms), then fail on subsequent reads.","fix":"Validate each box header's size against the remaining file length.","locations":[{"ref":"rawler/src/formats/bmff/mod.rs:140-191","code":"  140 |     let size = file.seek(SeekFrom::End(0))?;\n  141 |     let mut current = file.seek(SeekFrom::Start(0))?;\n  142 | \n  143 |     let mut ftyp = None;\n  144 |     let mut moov = None;\n  145 |     let mut mdat = None;\n  146 |     let mut vendors = Vec::new();\n  147 |     let mut cr3xpacket = None;\n  148 | \n  149 |     while current < size {\n  150 |       // get box?\n  151 | \n  152 |       let header = BoxHeader::parse(&mut file)?;\n  153 | \n  154 |       //let ftyp = Some(FtypBox::read_box(&mut file, header)?);\n  155 | \n  156 |       match header.typ {\n  157 |         FtypBox::TYP => {\n  158 |           debug!(\"Found ftyp box\");\n  159 |           ftyp = Some(FtypBox::read_box(&mut file, header)?);\n  160 |         }\n  161 |         MoovBox::TYP => {\n  162 |           debug!(\"Found moov box\");\n  163 |           moov = Some(MoovBox::read_box(&mut file, header)?);\n  164 |         }\n  165 |         MdatBox::TYP => {\n  166 |           debug!(\"Found mdat box\");\n  167 |           mdat = Some(MdatBox::read_box(&mut file, header)?);\n  168 |         }\n  169 |         _ => {\n  170 |           if let Some(uuid) = header.uuid {\n  171 |             if uuid == Uuid::from_bytes(Cr3XpacketBox::UUID) {\n  172 |               cr3xpacket = Some(Cr3XpacketBox::read_box(&mut file, header)?);\n  173 |             } else {\n  174 |               debug!(\"Vendor box found in filebox: {:?}\", header.typ);\n  175 |               let vendor = VendorBox::read_box(&mut file, header)?;\n  176 |               vendors.push(vendor);\n  177 |             }\n  178 |           } else {\n  179 |             debug!(\"Vendor box found in filebox: {:?}\", header.typ);\n  180 |             let vendor = VendorBox::read_box(&mut file, header)?;\n  181 |             vendors.push(vendor);\n  182 |           }\n  183 |         }\n  184 |       }\n  185 |       if file.stream_position()? != current {\n  186 |         current = file.stream_position()?;\n  187 |       } else {\n  188 |         // If parsing has not moved cursor, we probably have a corrupt file or it's not a BMFF at all.\n  189 |         return Err(BmffError::Parse(\"Unable to find valid BMFF box, corrupt file?\".into()));\n  190 |       }\n  191 |     }","lines":52,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/formats/bmff/mod.rs#L140-L191"}]},
{"id":"LOGIC_39","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"jfif.rs App1::read_segment() returns Err when the EXIF IFD parse fails (line 170) but has already advanced the reader past the APP1 segment payload. The Jfif::parse() loop catches this with a continue (line 233-237) but then re-reads from the wrong position, potentially misidentifying subsequent segments.","fix":"Seek to pos + len before returning the error, so the stream position is always consistent regardless of parse outcome.","locations":[{"ref":"rawler/src/formats/jfif.rs:163-170","code":"  163 |         if let Ok(ifd) = ifd {\n  164 |           return Ok(Self {\n  165 |             len,\n  166 |             payload: Payload::Exif(ifd),\n  167 |           });\n  168 |         }\n  169 | \n  170 |         return Err(JfifError::General(\"Failed to read exif\".into()));","lines":8,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/formats/jfif.rs#L163-L170"}]},
{"id":"LOGIC_40","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"jfif.rs Jfif::parse() continues without pushing a Segment on a failed APP1 parse (line 233-237), which means sym still holds the old value. However, pos is re-read from stream_position at the bottom of the loop only after the segment is pushed. The continue skips both the push and the sym re-read, so pos is stale on the next iteration.","fix":"Update pos after every segment regardless of success/failure, or restructure to always seek to a known position.","locations":[{"ref":"rawler/src/formats/jfif.rs:231-237","code":"  231 |         0xFFE1 => match App1::read_segment(&mut reader, symbol) {\n  232 |           Ok(app1) => Segment::APP1 { offset: pos, app1 },\n  233 |           Err(err) => {\n  234 |             log::warn!(\"Failed to read APP1 (EXIF) segement, maybe corrupt: {:?}\", err);\n  235 |             continue;\n  236 |           }\n  237 |         },","lines":7,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/formats/jfif.rs#L231-L237"},{"ref":"rawler/src/formats/jfif.rs:256-259","code":"  256 |         break; // EOI reached\n  257 |       }\n  258 |       pos = reader.stream_position()?;\n  259 |       sym = reader.read_u16::<BigEndian>().ok();","lines":4,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/formats/jfif.rs#L256-L259"}]},
