{"id":"LOGIC_41","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"ifd.rs new_root_with_correction() applies apply_corr to next_ifd at line 79, then passes that corrected value to IFD::new() which internally does NOT apply corr again. But inside the while loop at line 87, it applies corr again to what is already a corrected next_ifd (ifd.next_ifd was already corrected in IFD::new() at line 223). This double-correction is a latent bug that only does not manifest because corr is typically 0.","fix":"Decide whether offsets stored in next_ifd are pre-corrected or raw; apply corr in exactly one place.","locations":[{"ref":"rawler/src/formats/tiff/ifd.rs:79-98","code":"   79 |     next_ifd = apply_corr(next_ifd, corr);\n   80 |     let mut root = IFD::new(reader, next_ifd, base, corr, endian, &multi_sub_tags)?;\n   81 |     if root.entries.is_empty() {\n   82 |       return Err(TiffError::General(\"TIFF is invalid, IFD must contain at least one entry\".to_string()));\n   83 |     }\n   84 |     next_ifd = root.next_ifd;\n   85 | \n   86 |     while next_ifd != 0 {\n   87 |       next_ifd = apply_corr(next_ifd, corr);\n   88 |       let ifd = IFD::new(reader, next_ifd, base, corr, endian, &multi_sub_tags)?;\n   89 |       if ifd.entries.is_empty() {\n   90 |         return Err(TiffError::General(\"TIFF is invalid, IFD must contain at least one entry\".to_string()));\n   91 |       }\n   92 |       next_ifd = ifd.next_ifd;\n   93 |       root.chain.push(ifd);\n   94 | \n   95 |       if root.chain.len() > max_chain && max_chain > 0 {\n   96 |         break;\n   97 |       }\n   98 |     }","lines":20,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/formats/tiff/ifd.rs#L79-L98"},{"ref":"rawler/src/formats/tiff/ifd.rs:219-228","code":"  219 |     Ok(IFD {\n  220 |       offset,\n  221 |       base,\n  222 |       corr,\n  223 |       next_ifd: if next_ifd == 0 { 0 } else { apply_corr(next_ifd, corr) },\n  224 |       entries,\n  225 |       endian,\n  226 |       sub,\n  227 |       chain: vec![],\n  228 |     })","lines":10,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/formats/tiff/ifd.rs#L219-L228"}]},
{"id":"LOGIC_42","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"ifd.rs Value::Unknown arm in sub-IFD offset handling (line 156-158) accesses offsets[0] directly without checking that the byte vector has at least 4 bytes. A 0-length Unknown entry would panic.","fix":"Use offsets.get(0..4) and parse with checked conversion, returning a warning if too short.","locations":[{"ref":"rawler/src/formats/tiff/ifd.rs:156-158","code":"  156 |               Value::Unknown(tag, offsets) => {\n  157 |                 sub_ifd_offsets.insert(*tag, vec![offsets[0] as u32]);\n  158 |               }","lines":3,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/formats/tiff/ifd.rs#L156-L158"}]},
{"id":"LOGIC_43","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"ifd.rs new() reads the next-IFD pointer after iterating entries (line 192-201), but at that point reader.position() may point anywhere because Entry::parse() seeks around the file. The comment on line 190 admits this. The position is supposed to be restored via the goto(next_pos) mechanism in the loop, but if an entry read fails the next_pos advance still happens, desynchronizing the next-IFD pointer read.","fix":"Explicitly seek to the end of the IFD directory (offset + 2 + entry_count * 12) before reading the next-IFD pointer.","locations":[{"ref":"rawler/src/formats/tiff/ifd.rs:190-201","code":"  190 |     // Some TIFF writers skip the next ifd pointer\n  191 |     // If we get an I/O error, we fallback to 0, signaling the end of IFD chains.\n  192 |     let next_ifd = match reader.read_u32() {\n  193 |       Ok(ptr) => ptr,\n  194 |       Err(e) => {\n  195 |         debug!(\n  196 |           \"TIFF IFD reader failed to get next IFD pointer, fallback to 0 and continue. Original error was: {}\",\n  197 |           e\n  198 |         );\n  199 |         0\n  200 |       }\n  201 |     };","lines":12,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/formats/tiff/ifd.rs#L190-L201"}]},
{"id":"LOGIC_44","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In develop.rs develop_intermediate(), the CropDefault step checks `intermediate.dim().w == rawimage.active_area.map(|area| area.d).unwrap_or(rawimage.dim()).w / 2` to detect superpixel debayer. Integer division by 2 discards the remainder, so an odd-width image that has nothing to do with superpixel could accidentally satisfy the condition and apply a spurious 0.5x crop scale.","fix":"Track whether superpixel demosaicing was actually used with a boolean flag rather than inferring it from dimension ratios.","locations":[{"ref":"rawler/src/imgop/develop.rs:301-305","code":"  301 |         if intermediate.dim().w == rawimage.active_area.map(|area| area.d).unwrap_or(rawimage.dim()).w / 2 {\n  302 |           // Superpixel debayer used\n  303 |           crop.scale(0.5);\n  304 |           log::debug!(\"Scale crop to 0.5: {:?}\", crop);\n  305 |         }","lines":5,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/imgop/develop.rs#L301-L305"}]},
{"id":"LOGIC_45","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"Dim2::is_empty() returns true only when BOTH w and h are zero. An image with w=0 but h>0 (or vice versa) is also empty / degenerate, but is_empty() returns false, leading callers to treat it as a valid non-empty image.","fix":"Change the condition to `self.w == 0 || self.h == 0`.","locations":[{"ref":"rawler/src/imgop/mod.rs:63-65","code":"   63 |   pub fn is_empty(&self) -> bool {\n   64 |     self.w == 0 && self.h == 0\n   65 |   }","lines":3,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/imgop/mod.rs#L63-L65"}]},
{"id":"LOGIC_46","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"spline.rs prepare() computes alpha[i] but never uses it. The algorithm on the Wikipedia page linked in the comment uses alpha in subsequent Gaussian elimination to compute mu and z. Skipping this step means mu and z are never set to their correct values (they stay at zero), so all c, b, d coefficients will be wrong.","fix":"Implement the full tridiagonal solve: after computing alpha, compute mu and z via forward sweep, then back-substitute to get c, then derive b and d.","locations":[{"ref":"rawler/src/imgop/spline.rs:36-53","code":"   36 |     for i in 1..self.num_segments {\n   37 |       let sp = &self.segments[i - 1];\n   38 |       let s = &self.segments[i];\n   39 |       let sn = &self.segments[i + 1];\n   40 | \n   41 |       alpha[i] = (3. / h[i]) * (sn.a - s.a) - (3. / h[i - 1]) * (s.a - sp.a);\n   42 |     }\n   43 | \n   44 |     mu[0] = 1.0;\n   45 |     z[0] = 0.0;\n   46 | \n   47 |     for i in (0..self.num_segments).rev() {\n   48 |       let sn = self.segments[i + 1].clone();\n   49 |       let s = &mut self.segments[i];\n   50 |       s.c = z[i] - mu[i] * sn.c;\n   51 |       s.b = (sn.a - s.a) / h[i] - h[i] * (sn.c + 2. * s.c) / 3.;\n   52 |       s.d = (sn.c - s.c) / (3. * h[i]);\n   53 |     }","lines":18,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/imgop/spline.rs#L36-L53"}]},
{"id":"LOGIC_47","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"BlackLevel::shift() clones the struct, then overwrites trans.levels in place - but the inner loop reads from self.levels and writes to trans.levels. This is correct for a simple copy, but the intermediate writes into trans could alias reads for multi-row patterns if (yn, xn) and (ys, xs) refer to the same cell (when y % h == 0 and x % w == 0). In that degenerate case the function is a no-op, which is correct, but not obviously safe. More importantly, if called with x >= w or y >= h (which is valid since % is used), the function works correctly; however this is not validated or documented.","fix":"Add a comment explaining why the clone + in-place write is safe; document that x and y may be >= pattern dimension.","locations":[{"ref":"rawler/src/rawimage.rs:146-162","code":"  146 |   pub fn shift(&self, x: usize, y: usize) -> Self {\n  147 |     if self.sample_count() == 1 {\n  148 |       self.clone()\n  149 |     } else {\n  150 |       let mut trans = self.clone();\n  151 |       let (w, h, cpp) = (trans.width, trans.height, trans.cpp);\n  152 |       for yn in 0..h {\n  153 |         for xn in 0..w {\n  154 |           let ys = (yn + y) % h;\n  155 |           let xs = (xn + x) % w;\n  156 |           trans.levels[yn * w * cpp + xn * cpp..yn * w * cpp + xn * cpp + cpp]\n  157 |             .copy_from_slice(&self.levels[ys * w * cpp + xs * cpp..ys * w * cpp + xs * cpp + cpp]);\n  158 |         }\n  159 |       }\n  160 |       trans\n  161 |     }\n  162 |   }","lines":17,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/rawimage.rs#L146-L162"}]},
{"id":"LOGIC_48","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `convert.rs` `generate_job()`, when the `index` argument cannot be parsed as `usize`, `unwrap_or(0)` silently falls back to index 0. An unparseable non-'all' value like '2x' is treated as index 0 without any warning to the user.","fix":"Return an `Err(AppError::InvalidCmdSwitch(...))` when parsing fails rather than silently defaulting.","locations":[{"ref":"bin/dnglab/dnglab-lib/src/convert.rs:105-114","code":"  105 |   let (do_batch, index) = match options.get_one::<String>(\"index\") {\n  106 |     Some(index) => {\n  107 |       if index.to_lowercase().eq(\"all\") {\n  108 |         (true, 0)\n  109 |       } else {\n  110 |         (false, index.parse::<usize>().unwrap_or(0))\n  111 |       }\n  112 |     }\n  113 |     None => (false, 0),\n  114 |   };","lines":10,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/bin/dnglab/dnglab-lib/src/convert.rs#L105-L114"}]},

{"id":"LOGIC_50","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `jobs/raw2dng.rs` the `duration` field of a successfully converted `JobResult` is also hardcoded to `0.0` (line 96-97).","fix":"Same fix as for the other job types.","locations":[{"ref":"bin/dnglab/dnglab-lib/src/jobs/raw2dng.rs:111-116","code":"  111 |         drop(file);\n  112 |         Ok(JobResult {\n  113 |           job: self.clone(),\n  114 |           duration: 0.0,\n  115 |           error: None,\n  116 |         })","lines":6,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/bin/dnglab/dnglab-lib/src/jobs/raw2dng.rs#L111-L116"}]},
{"id":"LOGIC_51","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The same silent `unwrap_or(0)` fallback for unparseable index values exists in `process_raw.rs` `generate_job()`.","fix":"Return an error on parse failure instead of silently defaulting to 0.","locations":[{"ref":"bin/dnglab/dnglab-lib/src/process_raw.rs:99-108","code":"   99 |   let (do_batch, index) = match options.get_one::<String>(\"index\") {\n  100 |     Some(index) => {\n  101 |       if index.to_lowercase().eq(\"all\") {\n  102 |         (true, 0)\n  103 |       } else {\n  104 |         (false, index.parse::<usize>().unwrap_or(0))\n  105 |       }\n  106 |     }\n  107 |     None => (false, 0),\n  108 |   };","lines":10,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/bin/dnglab/dnglab-lib/src/process_raw.rs#L99-L108"}]},
{"id":"LOGIC_52","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `process_raw.rs` `generate_job()`, the `thumbnail` field of `RawProcessingParams` is hardcoded to `true` with a comment `//options.get_flag(\"thumbnail\")` (line 120). The user has no way to disable thumbnail generation from the CLI even though the comment implies it was once configurable.","fix":"Either add a `--thumbnail` CLI argument for the `process-raw` subcommand and wire it up, or remove the dead comment.","locations":[{"ref":"bin/dnglab/dnglab-lib/src/process_raw.rs:120","code":"  120 |       thumbnail: true, //options.get_flag(\"thumbnail\"),","lines":1,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/bin/dnglab/dnglab-lib/src/process_raw.rs#L120"}]},
{"id":"LOGIC_53","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `client.rs` `nlst()`, when `path` is absolute (line 408-413) the server sends a 501 error response and then calls `self.close_data_connection()`, but it never sends a `ClosingDataConnection` reply. The FTP client may wait indefinitely for the transfer-complete acknowledgement.","fix":"After sending the error reply, also send a `ResultCode::ClosingDataConnection` or skip the close-data-connection step and let the outer code handle it.","locations":[{"ref":"embedftp/src/client.rs:409-416","code":"  409 |         let pattern = if let Some(p) = path {\n  410 |           if p.is_absolute() {\n  411 |             self\n  412 |               .send(Answer::new(ResultCode::InvalidParameterOrArgument, \"No such file or directory\"))\n  413 |               .await?;\n  414 |             self.close_data_connection();\n  415 |             return Ok(());\n  416 |           }","lines":8,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/embedftp/src/client.rs#L409-L416"}]},
{"id":"LOGIC_54","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `client.rs` `add_file_info()`, the file path string is split on '/' to get the filename. On Windows, path separators are '\\', so `split('/')` would return the full path instead of just the filename, sending an incorrect listing entry to the client.","fix":"Use `path.file_name()` from the `Path` type instead of splitting on '/' manually. The same pattern appears in `add_file_info_nlst` at line 779-785.","locations":[{"ref":"embedftp/src/client.rs:746-752","code":"  746 |   let path = match path.to_str() {\n  747 |     Some(path) => match path.split('/').next_back() {\n  748 |       Some(path) => path,\n  749 |       _ => return,\n  750 |     },\n  751 |     _ => return,\n  752 |   };","lines":7,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/embedftp/src/client.rs#L746-L752"}]},
{"id":"LOGIC_55","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `config.rs`, `Config::new()` accepts a file path parameter `_file_path` but ignores it entirely. The function always returns the same hard-coded default configuration. The parameter name is suppressed with a leading underscore, but the API surface implies it reads from a config file.","fix":"Either implement reading from the file, or change the API to a `Config::default()` / builder pattern so callers are not misled.","locations":[{"ref":"embedftp/src/config.rs:37-49","code":"   37 |   pub fn new<P: AsRef<Path>>(_file_path: P) -> Option<Config> {\n   38 |     Some(Self {\n   39 |       server_port: 8054,\n   40 |       server_addr: \"::1\".parse().expect(\"Failed to parse IPv6 addr\"),\n   41 |       users: vec![User {\n   42 |         name: \"anonymous\".into(),\n   43 |         password: \"anonymous@example.com\".into(),\n   44 |       }],\n   45 |       anonymous: true,\n   46 |       greeting: String::from(\"Welcome to this FTP server!\"),\n   47 |     })\n   48 |   }\n   49 | }","lines":13,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/embedftp/src/config.rs#L37-L49"}]},
{"id":"LOGIC_56","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `error.rs` the `cause()` method is implemented on the `Error` type (line 46-55). The `cause()` method was deprecated in Rust 1.33 in favour of `source()`. The implementation delegates to `source()` semantically but uses the deprecated API.","fix":"Replace `fn cause()` with `fn source()` (from `std::error::Error`) and remove the deprecated implementation.","locations":[{"ref":"embedftp/src/error.rs:46-55","code":"   46 |   fn cause(&self) -> Option<&dyn error::Error> {\n   47 |     let cause: &dyn error::Error = match *self {\n   48 |       FromUtf8(ref error) => error,\n   49 |       Io(ref error) => error,\n   50 |       Utf8(ref error) => error,\n   51 |       Msg(_) => return None,\n   52 |     };\n   53 |     Some(cause)\n   54 |   }\n   55 | }","lines":10,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/embedftp/src/error.rs#L46-L55"}]},
{"id":"LOGIC_57","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"CFA::try_from(char) maps both 'E' and 'C' to CFAColor::CYAN. The character 'E' is documented in the CFA string format as representing CYAN, but 'C' already exists as the canonical representation. There is no color for 'E' independently. This means that if 'C' is mistakenly used in a 4-color Fuji pattern where 'E' is expected, no error is raised.","fix":"Verify the intended usage and either remove 'E' as a synonym or add a dedicated CFAColor variant for it. Document the mapping.","locations":[{"ref":"rawler/src/cfa.rs:41-54","code":"   41 |     Ok(match value {\n   42 |       'R' => Self::RED,\n   43 |       'G' => Self::GREEN,\n   44 |       'B' => Self::BLUE,\n   45 |       'E' => Self::CYAN,\n   46 |       'M' => Self::MAGENTA,\n   47 |       'Y' => Self::YELLOW,\n   48 |       'C' => Self::CYAN,\n   49 |       _ => {\n   50 |         return Err(format!(\"Unknown CFA color \\\"{}\\\"\", value));\n   51 |       }\n   52 |     })\n   53 |   }\n   54 | }","lines":14,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/cfa.rs#L41-L54"}]},
{"id":"LOGIC_58","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"raw_metadata() reads a header at 0x0a98 (2712) bytes, but ExposureTime is at offset 0x018C (396), LensFocalLen at 0x037C (892), LensModel at 0x0398 (920). All are within the buffer. However, ExposureIndexASA is at 0x0074 (116), which is also within range. The buffer read of 0x0a98 bytes seems unnecessarily large.","fix":"Minor: reduce the buffer size to the actual maximum tag offset used.","locations":[{"ref":"rawler/src/decoders/ari.rs:65","code":"   65 |     let buffer = file.subview(0, 0x0a98)?; // max header","lines":1,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/ari.rs#L65"}]},
{"id":"LOGIC_59","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In cr2.rs normalize_wb(), when raw_wb[1] (G1) is 0.0 or subnormal, the division `*v /= div` produces infinity or NaN for non-zero channels. The check `v.is_normal()` skips the division for subnormal/zero values but the divisor `div` itself (raw_wb[1]) is not checked. If div is exactly 0.0 (not subnormal), all channels get NaN or infinity.","fix":"Guard with `if div.is_normal()` before the normalization loop, returning raw values unchanged or a fallback.","locations":[{"ref":"rawler/src/decoders/cr2.rs:800-811","code":"  800 | fn normalize_wb(raw_wb: [f32; 4]) -> [f32; 4] {\n  801 |   debug!(\"CR2 raw wb: {:?}\", raw_wb);\n  802 |   // We never have more then RGB colors so far (no RGBE etc.)\n  803 |   // So we combine G1 and G2 to get RGB wb.\n  804 |   let div = raw_wb[1]; // G1 should be 1024 and we use this as divisor\n  805 |   let mut norm = raw_wb;\n  806 |   norm.iter_mut().for_each(|v| {\n  807 |     if v.is_normal() {\n  808 |       *v /= div\n  809 |     }\n  810 |   });\n  811 |   [norm[0], (norm[1] + norm[2]) / 2.0, norm[3], f32::NAN]","lines":12,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/cr2.rs#L800-L811"}]},
{"id":"LOGIC_60","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In cr3.rs, the `iad1_box()` method (line 129) directly indexes `self.bmff.filebox.moov.traks[trak_idx]` without bounds checking. If trak_idx is out of range for the traks vector, this panics. The caller does not always verify the index is valid before calling this method.","fix":"Use `.get(trak_idx)` and propagate None/error instead of direct indexing.","locations":[{"ref":"rawler/src/decoders/cr3.rs:129","code":"  129 |     let trak = &self.bmff.filebox.moov.traks[trak_idx];","lines":1,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/cr3.rs#L129"}]},
{"id":"LOGIC_61","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In cr3.rs Ctmd::new(), when a CTMD block tag is encountered a second time (double tag), the code hits `assert_eq!(rec.blocks.contains_key(&tag), false, \"Double tag found?!\")` which panics. This could be triggered by a malformed or future-format CR3 file containing duplicate block tags.","fix":"Replace the assert_eq! with a log warning and skip or overwrite the duplicate entry.","locations":[{"ref":"rawler/src/decoders/cr3.rs:678","code":"  678 |               assert_eq!(rec.blocks.contains_key(&tag), false, \"Double tag found?!\");","lines":1,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/cr3.rs#L678"}]},
{"id":"LOGIC_62","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In new_makernote(), the tag type 2 is labeled 'Short values' in the comment but is stored as Value::Long (a u32 vector), not Value::Short. This could cause incorrect value interpretations downstream if callers expect Short values.","fix":"Either store as Value::Short or correct the comment.","locations":[{"ref":"rawler/src/decoders/iiq.rs:214-216","code":"  214 |       2 => {\n  215 |         entries.insert(tag, (byte_count, tiff::Value::Long(vec![data as u32])));\n  216 |       }","lines":3,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/iiq.rs#L214-L216"}]},
{"id":"LOGIC_63","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In decode_tiles(), the error message says 'trying to decode {} tiles from {} offsets' but the context refers to tile count vs. the length of the offset table. The wording is confusing because both values describe the tile-related counts.","fix":"Clarify: 'expected {} tiles ({}cols x {}rows) but found {} offsets'.","locations":[{"ref":"rawler/src/decoders/mod.rs:792-793","code":"  792 |   if coltiles * rowtiles != tiles_src.len() as usize {\n  793 |     return Err(format_args!(\"DNG: trying to decode {} tiles from {} offsets\", coltiles * rowtiles, tiles_src.len()).into());","lines":2,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/mod.rs#L792-L793"}]},
{"id":"LOGIC_64","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In RawLoader::new(), naked cameras (filesize-matched) are only populated from the last camera with that filesize because `naked.insert` overwrites earlier entries. If two cameras share the same raw filesize, one is silently dropped.","fix":"Either add a warning when a collision occurs, or store a Vec of cameras per filesize and pick the best match.","locations":[{"ref":"rawler/src/decoders/mod.rs:892-898","code":"  892 |     let mut naked = HashMap::new();\n  893 |     for cam in cams {\n  894 |       map.insert((cam.make.clone(), cam.model.clone(), cam.mode.clone()), cam.clone());\n  895 |       if cam.filesize > 0 {\n  896 |         naked.insert(cam.filesize, cam);\n  897 |       }\n  898 |     }","lines":7,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/mod.rs#L892-L898"}]},
{"id":"LOGIC_65","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In MrwDecoder::new_jfif(), the WB swapped case at line 220 in raw_image(): `wb_vals[0]` is used twice for the green channels (`self.wb_vals[2] as f32, self.wb_vals[0] as f32, self.wb_vals[0] as f32`). The second and third fields should be G1 and G2 or G and G, using the same index twice appears correct only if G1==G2, but using wb_vals[2] for the G value is suspicious.","fix":"Verify the swapped_wb hint behavior is correct for the cameras that use it.","locations":[{"ref":"rawler/src/decoders/mrw.rs:219-222","code":"  219 |     let wb_coeffs = if self.camera.find_hint(\"swapped_wb\") {\n  220 |       [self.wb_vals[2] as f32, self.wb_vals[0] as f32, self.wb_vals[0] as f32, self.wb_vals[1] as f32]\n  221 |     } else {\n  222 |       [self.wb_vals[0] as f32, self.wb_vals[1] as f32, self.wb_vals[2] as f32, self.wb_vals[3] as f32]","lines":4,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/mrw.rs#L219-L222"}]},
{"id":"LOGIC_66","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"normalize_wb() averages norm[1] and norm[2] to form the single G channel. norm[2] is always the raw value that was passed as the fourth element (wb[3]), which in get_wb() is always the blue multiplier OlympusBlueMul or wbs.force_f32(1). Using it as a second green channel is semantically wrong; the return from get_wb() already stores blue at index 3 and green at index 1, leaving indices 2 and 3 undefined.","fix":"Align the wb array layout: ensure exactly two green values are populated before averaging, or change the normalization to use [norm[0], norm[1], norm[3], NAN] without averaging.","locations":[{"ref":"rawler/src/decoders/orf.rs:456-466","code":"  456 | fn normalize_wb(raw_wb: [f32; 4]) -> [f32; 4] {\n  457 |   log::debug!(\"ORF raw wb: {:?}\", raw_wb);\n  458 |   let div = raw_wb[1];\n  459 |   let mut norm = raw_wb;\n  460 |   norm.iter_mut().for_each(|v| {\n  461 |     if v.is_normal() {\n  462 |       *v /= div\n  463 |     }\n  464 |   });\n  465 |   [norm[0], (norm[1] + norm[2]) / 2.0, norm[3], f32::NAN]\n  466 | }","lines":11,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/orf.rs#L456-L466"},{"ref":"rawler/src/decoders/orf.rs:439-453","code":"  439 |   fn get_wb(&self) -> Result<[f32; 4]> {\n  440 |     let redmul = self.makernote.get_entry(OrfMakernotes::OlympusRedMul);\n  441 |     let bluemul = self.makernote.get_entry(OrfMakernotes::OlympusBlueMul);\n  442 |     match (redmul, bluemul) {\n  443 |       (Some(redmul), Some(bluemul)) => Ok([redmul.force_u32(0) as f32, 256.0, 256.0, bluemul.force_u32(0) as f32]),\n  444 |       _ => {\n  445 |         let ifd = self.makernote.find_ifds_with_tag(OrfImageProcessing::OrfBlackLevels);\n  446 |         if ifd.is_empty() {\n  447 |           return Err(RawlerError::DecoderFailed(\"ORF: Couldn't find ImgProc IFD\".to_string()));\n  448 |         }\n  449 |         let wbs = fetch_tiff_tag!(ifd[0], OrfImageProcessing::WB_RBLevels);\n  450 |         Ok([wbs.force_f32(0), 256.0, 256.0, wbs.force_f32(1)])\n  451 |       }\n  452 |     }\n  453 |   }","lines":15,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/orf.rs#L439-L453"}]},
{"id":"LOGIC_67","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In RafDecoder::new(), the camera lookup error branch does `rawloader.check_supported(&ifd)?` again with the same IFD, which is identical to the first call that already failed. The comment 'trying without mode' is misleading because both calls use mode=''.","fix":"Remove the duplicate call or implement a genuine fallback.","locations":[{"ref":"rawler/src/decoders/raf.rs:233-239","code":"  233 |     let camera = match rawloader.check_supported(&ifd) {\n  234 |       Ok(camera) => camera,\n  235 |       Err(err) => {\n  236 |         log::debug!(\"Camera not found, trying without mode: {:?}\", err);\n  237 |         rawloader.check_supported(&ifd)?\n  238 |       }\n  239 |     };","lines":7,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/raf.rs#L233-L239"}]},
{"id":"LOGIC_68","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In decode_panasonic_v6(), the 14-bit path reads only 14 values into pixelbuffer[0..13] but pixels_per_block is 11. Only indices 0..10 are consumed by the next_pixel() closure. Indices 11, 12, 13 are read from the bitstream but never used, wasting 3 reads and misaligning the stream for subsequent blocks.","fix":"Verify the correct number of raw values to read per block for 14-bit mode.","locations":[{"ref":"rawler/src/decoders/rw2/v6decompressor.rs:63-79","code":"   63 |           14 => {\n   64 |             // We fill from reverse, because bitstream is reversed\n   65 |             pump.get_bits(4); // padding bits, ignore it\n   66 |             pixelbuffer[13] = pump.get_bits(10) as u16;\n   67 |             pixelbuffer[12] = pump.get_bits(10) as u16;\n   68 |             pixelbuffer[11] = pump.get_bits(10) as u16;\n   69 |             pixelbuffer[10] = pump.get_bits(2) as u16;\n   70 |             pixelbuffer[9] = pump.get_bits(10) as u16;\n   71 |             pixelbuffer[8] = pump.get_bits(10) as u16;\n   72 |             pixelbuffer[7] = pump.get_bits(10) as u16;\n   73 |             pixelbuffer[6] = pump.get_bits(2) as u16;\n   74 |             pixelbuffer[5] = pump.get_bits(10) as u16;\n   75 |             pixelbuffer[4] = pump.get_bits(10) as u16;\n   76 |             pixelbuffer[3] = pump.get_bits(10) as u16;\n   77 |             pixelbuffer[2] = pump.get_bits(2) as u16;\n   78 |             pixelbuffer[1] = pump.get_bits(14) as u16;\n   79 |             pixelbuffer[0] = pump.get_bits(14) as u16;","lines":17,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/rw2/v6decompressor.rs#L63-L79"}]},
{"id":"LOGIC_69","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"calc_gamma() at line 319 computes idx as `(((x as u64 | 0x5_00000000u64) - ...) >> 32) as usize` for the case where x >= gamma_slopes[4]. The 0x5_00000000 magic constant is undocumented. If the subtraction underflows in u64, the shift produces an unexpected large index which could be used as an array index into gamma_points[idx] without bounds checking on the next lines.","fix":"Add bounds check on idx before indexing into gamma_points and gamma_slopes arrays, or document the invariant.","locations":[{"ref":"rawler/src/decoders/rw2/v8decompressor.rs:319-326","code":"  319 |         if x >= (0xFFFF & gamma_slopes[4]) {\n  320 |           idx = (((x as u64 | 0x5_00000000u64) - (0xFFFF & gamma_slopes[5]) as u64) >> 32) as usize;\n  321 |         }\n  322 |       }\n  323 |     }\n  324 |   }\n  325 | \n  326 |   let point = gamma_points[idx];","lines":8,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/rw2/v8decompressor.rs#L319-L326"}]},
{"id":"LOGIC_70","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In cr2.rs decode_top_line_rounded() (line 506), the remaining==1 branch reads a bit code and applies rounding to p.line_buf[1][p.line_pos], but the line at 503-506 uses `p.line_buf[1][p.line_pos] += ...` without first initializing line_buf[1][p.line_pos] (unlike decode_top_line() which explicitly sets it to p.coeff_a() first). The buffer content is whatever was left from the previous decode iteration, causing potential corruption of the last pixel in rounded top-line decoding.","fix":"Initialize the pixel before accumulating: add `p.line_buf[1][p.line_pos] = 0;` (or the appropriate predictor) before the `+=` at line 506.","locations":[{"ref":"rawler/src/decompressors/crx/decoder.rs:503-506","code":"  503 |     if remaining == 1 {\n  504 |       let bit_code = p.rice.adaptive_rice_decode(true, PREDICT_K_ESCAPE, PREDICT_K_ESCBITS, PREDICT_K_MAX)?;\n  505 |       let code = error_code_signed(bit_code);\n  506 |       p.line_buf[1][p.line_pos] += p.rounded_bits_mask * 2 * code + (code >> 31);","lines":4,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decompressors/crx/decoder.rs#L503-L506"}]},
{"id":"LOGIC_71","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `decode_ljpeg_420` (the standard, non-Sony version), the first block's Y samples are\npredicted as a chain: `y1 = base + diff`, `y2 = y1 + diff`, `y3 = y2 + diff`, `y4 = y3\n+ diff` (lines 218-221). However, in subsequent blocks (inside the loop at lines 238-241),\nthe same chain is used: `y3 = y2 + diff` (predictor is the in-row left sample). This is\ninconsistent with the Sony version where `y3` always refers to a different row's sample.\nThe standard 420 predictor chain means y1/y2 and y3/y4 are predicted as a single\nsequential chain rather than two independent pairs from different rows, which may produce\nincorrect results for some cameras implementing standard LJPEG 4:2:0.","fix":"Verify against the LJPEG 4:2:0 specification whether y3 should predict from y1 (vertical/inter-row predictor) or from y2 (intra-row chain). Add a comment documenting the chosen behaviour.","locations":[{"ref":"rawler/src/decompressors/ljpeg/decompressors.rs:217-220","code":"  217 |   let y1 = base_prediction + htable1.huff_decode(&mut pump)?;\n  218 |   let y2 = y1 + htable1.huff_decode(&mut pump)?;\n  219 |   let y3 = y2 + htable1.huff_decode(&mut pump)?;\n  220 |   let y4 = y3 + htable1.huff_decode(&mut pump)?;","lines":4,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decompressors/ljpeg/decompressors.rs#L217-L220"},{"ref":"rawler/src/decompressors/ljpeg/decompressors.rs:237-240","code":"  237 |       let y1 = (py as i32) + htable1.huff_decode(&mut pump)?;\n  238 |       let y2 = (y1 as i32) + htable1.huff_decode(&mut pump)?;\n  239 |       let y3 = (y2 as i32) + htable1.huff_decode(&mut pump)?;\n  240 |       let y4 = (y3 as i32) + htable1.huff_decode(&mut pump)?;","lines":4,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decompressors/ljpeg/decompressors.rs#L237-L240"}]},
{"id":"LOGIC_72","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `LjpegDecompressor::decode`, line 345 uses an explicit `return` keyword for the\n`decode_ljpeg_422` branch while all other branches (lines 343, 348, 349, 350) use\nimplicit tail expressions. This inconsistency suggests a copy-paste from a different\ncontext and makes the control flow harder to read, though it is not a semantic bug.","fix":"Remove the `return` keyword on line 345 to match the implicit-return style used throughout the function.","locations":[{"ref":"rawler/src/decompressors/ljpeg/mod.rs:343-351","code":"  343 |       decode_ljpeg_420(self, out, width, height)\n  344 |     } else if self.sof.components[0].super_h == 2 && self.sof.components[0].super_v == 1 {\n  345 |       return decode_ljpeg_422(self, out, width, height);\n  346 |     } else if self.sof.components[0].super_h == 1 && self.sof.components[0].super_v == 1 {\n  347 |       match self.predictor {\n  348 |         1 | 2 | 3 | 4 | 5 | 6 | 7 => decode_ljpeg(self, out, x, stripwidth, width, height),\n  349 |         8 => decode_hasselblad(self, out, width),\n  350 |         p => Err(format!(\"ljpeg: predictor {} not supported\", p)),\n  351 |       }","lines":9,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decompressors/ljpeg/mod.rs#L343-L351"}]},
{"id":"LOGIC_73","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In dng/writer.rs as_shot_neutral(), only the numerator of wb[0] is checked for non-zero. If wb[0] is a valid ratio but wb[1] or wb[2] is zero (e.g. from a degenerate camera profile), the tag is written with invalid entries that will confuse DNG readers.","fix":"Validate all WB rationals before writing the tag.","locations":[{"ref":"rawler/src/dng/writer.rs:389-393","code":"  389 |     // Only write tag if wb is valid\n  390 |     if wb.as_ref()[0].n != 0 {\n  391 |       self.root_ifd.add_tag(DngTag::AsShotNeutral, wb.as_ref());\n  392 |     }\n  393 |   }","lines":5,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/dng/writer.rs#L389-L393"}]},
{"id":"LOGIC_74","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"Exif::extend_from_ifd() silently discards EXIF tags whose value type does not match the expected variant. For example, if ISOSpeedRatings arrives as Value::Long instead of Value::Short, it is silently dropped and logged only at debug level. This can lead to missing metadata with no user-visible warning.","fix":"Upgrade the log level to warn for unexpected tag types, or attempt a type coercion before discarding.","locations":[{"ref":"rawler/src/exif.rs:172-175","code":"  172 |           (tag, _value) => {\n  173 |             log::debug!(\"Ignoring EXIF tag: {:?}\", tag);\n  174 |           }\n  175 |         }","lines":4,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/exif.rs#L172-L175"}]},
{"id":"LOGIC_75","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"mdhd.rs always stores the language field as the literal string \"FIXME\" (line 48), ignoring the parsed language_code. Any consumer of MdhdBox::language will receive wrong data.","fix":"Implement language_string() to decode the packed 15-bit ISO-639-2/T code and use it.","locations":[{"ref":"rawler/src/formats/bmff/mdhd.rs:46-48","code":"   46 |     let _language_code = reader.read_u16::<BigEndian>()?;\n   47 |     //let language = language_string(language_code); // TODO\n   48 |     let language = String::from(\"FIXME\");","lines":3,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/formats/bmff/mdhd.rs#L46-L48"}]},
{"id":"LOGIC_76","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"stsc.rs first_sample calculation for subsequent entries (line 65) uses (entry.first_chunk - holdback.first_sample) * holdback.samples_per_chunk. The formula should use holdback.first_chunk, not holdback.first_sample. The number of chunks in the holdback run is (entry.first_chunk - holdback.first_chunk), so the correct formula is: holdback.first_sample + (entry.first_chunk - holdback.first_chunk) * holdback.samples_per_chunk.","fix":"Change (entry.first_chunk - holdback.first_sample) to (entry.first_chunk - holdback.first_chunk).","locations":[{"ref":"rawler/src/formats/bmff/stsc.rs:65","code":"   65 |         entry.first_sample = holdback.first_sample + ((entry.first_chunk - holdback.first_sample) * holdback.samples_per_chunk);","lines":1,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/formats/bmff/stsc.rs#L65"}]},
{"id":"LOGIC_77","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"ciff/mod.rs CiffIFD::new_file() calls file.as_vec() to load the entire file into memory. For very large CR2 files this is wasteful and may OOM. The rest of the CIFF parser then indexes into this Vec by raw offsets, which is fine for correctness but not for memory.","fix":"Consider streaming or memory-mapping instead, consistent with how RawSource is used elsewhere.","locations":[{"ref":"rawler/src/formats/ciff/mod.rs:50","code":"   50 |     let data = file.as_vec().map_err(|err| format!(\"Failed to read whole file: {:?}\", err))?;","lines":1,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/formats/ciff/mod.rs#L50"}]},
{"id":"LOGIC_78","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"jfif.rs Unknown segment handler subtracts 2 from len when seeking (line 246: SeekFrom::Current(len as i64 - 2)). The JFIF segment length field includes the two length bytes themselves, so subtracting 2 is correct. But if len < 2 (malformed file) the cast to i64 produces a large negative, seeking backward and potentially looping forever.","fix":"Check len >= 2 before computing the seek offset.","locations":[{"ref":"rawler/src/formats/jfif.rs:246","code":"  246 |           reader.seek(SeekFrom::Current(len as i64 - 2))?;","lines":1,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/formats/jfif.rs#L246"}]},
{"id":"LOGIC_79","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"ifd.rs extend_sub_ifds() calls new_root_with_correction() for each sub-IFD offset (line 298). This re-reads the TIFF header (byte-order marker and magic) at the given offset, which is wrong: sub-IFDs do not have their own TIFF header. IFD::new() should be called instead.","fix":"Replace new_root_with_correction() with IFD::new() so sub-IFDs are parsed without expecting a TIFF header.","locations":[{"ref":"rawler/src/formats/tiff/ifd.rs:297-300","code":"  297 |           for off in offsets {\n  298 |             let ifd = Self::new_root_with_correction(reader, *off, self.base, self.corr, 10, &[])?;\n  299 |             subs.push(ifd);\n  300 |           }","lines":4,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/formats/tiff/ifd.rs#L297-L300"}]},
{"id":"LOGIC_80","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"ifd.rs tile_data() does not apply self.base to the tile offsets (line 568: rawsource.subview(*offset as u64, ...)). strip_data() (line 541) correctly adds self.base. The missing base addition means tile data is read from the wrong file offset when base != 0.","fix":"Change *offset as u64 to (self.base + *offset) as u64 to match strip_data().","locations":[{"ref":"rawler/src/formats/tiff/ifd.rs:567-569","code":"  567 |     offsets.iter().zip(byte_counts.iter()).for_each(|(offset, size)| {\n  568 |       tile_slices.push(rawsource.subview(*offset as u64, *size as u64).map_err(TiffError::Io));\n  569 |     });","lines":3,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/formats/tiff/ifd.rs#L567-L569"}]},
{"id":"LOGIC_81","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"reader.rs GenericTiffReader::is_tiff() checks only the first byte (buffer[0] == 0x49 || buffer[0] == 0x4d) and the comment says TODO. A file starting with 'I' or 'M' but not being a TIFF would pass this check. The second byte and magic number are not validated.","fix":"Check at least the first two bytes (0x4949 or 0x4d4d) and ideally the magic word 42.","locations":[{"ref":"rawler/src/formats/tiff/reader.rs:213-216","code":"  213 |   pub fn is_tiff<T: AsRef<[u8]>>(buffer: T) -> bool {\n  214 |     let buffer = buffer.as_ref();\n  215 |     buffer[0] == 0x49 || buffer[0] == 0x4d // TODO\n  216 |   }","lines":4,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/formats/tiff/reader.rs#L213-L216"}]},
{"id":"LOGIC_82","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"value.rs TiffAscii::count() returns the sum of string lengths plus one NUL per string. But TiffAscii::byte_size() (called from Value::byte_size()) uses this count as the stored byte length. If the raw data was stored in plain (the field set by new_from_raw), the plain field length can differ from count(), making byte_size() inaccurate for the purpose of deciding whether data fits inline in a TIFF IFD entry.","fix":"Ensure count() always reflects the actual wire-format byte count, or store it explicitly.","locations":[{"ref":"rawler/src/formats/tiff/value.rs:1030-1032","code":" 1030 |   pub fn count(&self) -> usize {\n 1031 |     self.strings.iter().map(|s| s.len() + 1).sum::<usize>()\n 1032 |   }","lines":3,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/formats/tiff/value.rs#L1030-L1032"},{"ref":"rawler/src/formats/tiff/value.rs:822","code":"  822 |       Self::Ascii(v) => v.count(),","lines":1,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/formats/tiff/value.rs#L822"}]},
{"id":"LOGIC_83","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"value.rs TiffAscii::new_from_raw() has a commented-out multi-string loop (lines 1048-1053). It only parses the first null-terminated string, silently discarding any subsequent strings in the raw bytes. The TODO comment acknowledges this.","fix":"Implement proper multi-string parsing by looping until the end of the raw slice.","locations":[{"ref":"rawler/src/formats/tiff/value.rs:1047-1053","code":" 1047 |     // TODO: fixme multiple strings\n 1048 |     //while nul_range_end < raw.len() {\n 1049 |     nul_range_end = raw[nul_range_end..].iter().position(|&c| c == b'\\0').unwrap_or(raw.len()); // default to length if no `\\0` present\n 1050 |     let s = ::std::str::from_utf8(&raw[0..nul_range_end]).unwrap_or(\"!!!INVALID UTF8!!!\");\n 1051 |     strings.push(String::from(s));\n 1052 |     //nul_range_end += 1;\n 1053 |     // }","lines":7,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/formats/tiff/value.rs#L1047-L1053"}]},
{"id":"LOGIC_84","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In clip() in imgop/mod.rs the NaN check is placed after the p > max and p < min guards. Because NaN comparisons always return false, a NaN value falls through all guards and reaches the final else branch, returning the NaN unchanged instead of the intended min. The #[allow(clippy::if_same_then_else)] attribute is a sign the author noticed something odd here.","fix":"Move the NaN check before the other comparisons, or use f32::clamp() with explicit NaN handling.","locations":[{"ref":"rawler/src/imgop/mod.rs:69-80","code":"   69 | #[allow(clippy::if_same_then_else)]\n   70 | pub fn clip(p: f32, min: f32, max: f32) -> f32 {\n   71 |   if p > max {\n   72 |     max\n   73 |   } else if p < min {\n   74 |     min\n   75 |   } else if p.is_nan() {\n   76 |     min\n   77 |   } else {\n   78 |     p\n   79 |   }\n   80 | }","lines":12,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/imgop/mod.rs#L69-L80"}]},
{"id":"LOGIC_85","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"scale_double_to_u16() and scale_double_to_u8() use x.abs() before scaling, silently treating negative f32 values as positive. Negative pixel values should probably be clamped to zero or flagged as an error, not reflected into the positive range.","fix":"Clamp x to 0.0 before scaling, or add an assertion that x >= 0.0.","locations":[{"ref":"rawler/src/imgop/mod.rs:239-249","code":"  239 | pub fn scale_double_to_u16(x: f32) -> u16 {\n  240 |   (x.abs() * u16::MAX as f32) as u16\n  241 | }\n  242 | \n  243 | pub fn scale_u8_to_double(x: u8) -> f32 {\n  244 |   x as f32 / u8::MAX as f32\n  245 | }\n  246 | \n  247 | pub fn scale_double_to_u8(x: f32) -> u8 {\n  248 |   (x.abs() * u8::MAX as f32) as u8\n  249 | }","lines":11,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/imgop/mod.rs#L239-L249"}]},
{"id":"LOGIC_86","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In convert_to_f32_scaled(), when black != T::default(), each pixel is computed as `(x - black) / (white - black)`. If any pixel value x is less than black the subtraction wraps around (or panics in debug mode) for unsigned integer types that do not implement saturating subtraction.","fix":"Use saturating_sub or clamp the pixel value to black before subtracting to avoid unsigned underflow.","locations":[{"ref":"rawler/src/imgop/mod.rs:295-302","code":"  295 |     pix\n  296 |       .iter()\n  297 |       .copied()\n  298 |       .map(|x| x - black)\n  299 |       .map(f32::from)\n  300 |       .map(|x| x / f32::from(white - black))\n  301 |       .collect()\n  302 |   }","lines":8,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/imgop/mod.rs#L295-L302"}]},
{"id":"LOGIC_87","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"correct_blacklevel_cfa() uses par_chunks_exact_mut(width * 2), which silently discards the last row if the image height is odd. The old commented-out assertions for even width/height were removed without being replaced by proper handling.","fix":"Handle the remainder row (the case where height is odd) explicitly, or re-add the assertion and document the constraint.","locations":[{"ref":"rawler/src/imgop/raw.rs:165-190","code":"  165 | pub fn correct_blacklevel_cfa(raw: &mut [f32], width: usize, _height: usize, blacklevel: &[f32; 4], whitelevel: &[f32; 4]) {\n  166 |   //assert_eq!(width % 2, 0, \"width is {}\", width);\n  167 |   //assert_eq!(height % 2, 0, \"height is {}\", height);\n  168 |   // max value can be pre-computed for all channels.\n  169 |   let max = [\n  170 |     whitelevel[0] - blacklevel[0],\n  171 |     whitelevel[1] - blacklevel[1],\n  172 |     whitelevel[2] - blacklevel[2],\n  173 |     whitelevel[3] - blacklevel[3],\n  174 |   ];\n  175 |   let clip = |v: f32| {\n  176 |     if v.is_sign_negative() { 0.0 } else { v }\n  177 |   };\n  178 |   // Process two bayer lines at once.\n  179 |   raw.par_chunks_exact_mut(width * 2).for_each(|lines| {\n  180 |     // It's bayer data, so we have two lines for sure.\n  181 |     let (line0, line1) = lines.split_at_mut(width);\n  182 |     //line0.array_chunks_mut::<2>().zip(line1.array_chunks_mut::<2>()).for_each(|(a, b)| {\n  183 |     line0.chunks_exact_mut(2).zip(line1.chunks_exact_mut(2)).for_each(|(a, b)| {\n  184 |       a[0] = clip(a[0] - blacklevel[0]) / max[0];\n  185 |       a[1] = clip(a[1] - blacklevel[1]) / max[1];\n  186 |       b[0] = clip(b[0] - blacklevel[2]) / max[2];\n  187 |       b[1] = clip(b[1] - blacklevel[3]) / max[3];\n  188 |     });\n  189 |   });\n  190 | }","lines":26,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/imgop/raw.rs#L165-L190"}]},
{"id":"LOGIC_88","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In the Bilinear4Channel demosaic (bayer/bilinear.rs), corner and border pixels are set by directly writing specific CFA channel values (e.g. ch(0,1), ch(1,0)) into the pixel at (0,0). When multiple CFA positions map to the same channel index, some channels are written twice (the second write wins) and others remain zero. This gives incorrect results for CFA patterns where the 2x2 neighbourhood around a corner holds two pixels of the same color.","fix":"Accumulate and average neighbor values per channel for border/corner pixels rather than blindly copying individual sample positions.","locations":[{"ref":"rawler/src/imgop/sensor/bayer/bilinear.rs:46-64","code":"   46 |     out.at_mut(0, 0)[ch(0, 0)] = *pixels.at(0, 0);\n   47 |     out.at_mut(0, 0)[ch(0, 1)] = *pixels.at(0, 1);\n   48 |     out.at_mut(0, 0)[ch(1, 0)] = *pixels.at(1, 0);\n   49 |     out.at_mut(0, 0)[ch(1, 1)] = *pixels.at(1, 1);\n   50 | \n   51 |     out.at_mut(0, dim.w - 1)[ch(0, dim.w - 1)] = *pixels.at(0, dim.w - 1);\n   52 |     out.at_mut(0, dim.w - 1)[ch(0, dim.w - 2)] = *pixels.at(0, dim.w - 2);\n   53 |     out.at_mut(0, dim.w - 1)[ch(1, dim.w - 1)] = *pixels.at(1, dim.w - 1);\n   54 |     out.at_mut(0, dim.w - 1)[ch(1, dim.w - 2)] = *pixels.at(1, dim.w - 2);\n   55 | \n   56 |     out.at_mut(dim.h - 1, 0)[ch(dim.h - 1, 0)] = *pixels.at(dim.h - 1, 0);\n   57 |     out.at_mut(dim.h - 1, 0)[ch(dim.h - 1, 1)] = *pixels.at(dim.h - 1, 1);\n   58 |     out.at_mut(dim.h - 1, 0)[ch(dim.h - 2, 0)] = *pixels.at(dim.h - 2, 0);\n   59 |     out.at_mut(dim.h - 1, 0)[ch(dim.h - 2, 1)] = *pixels.at(dim.h - 2, 1);\n   60 | \n   61 |     out.at_mut(dim.h - 1, dim.w - 1)[ch(dim.h - 1, dim.w - 1)] = *pixels.at(dim.h - 1, dim.w - 1);\n   62 |     out.at_mut(dim.h - 1, dim.w - 1)[ch(dim.h - 1, dim.w - 2)] = *pixels.at(dim.h - 1, dim.w - 2);\n   63 |     out.at_mut(dim.h - 1, dim.w - 1)[ch(dim.h - 2, dim.w - 1)] = *pixels.at(dim.h - 2, dim.w - 1);\n   64 |     out.at_mut(dim.h - 1, dim.w - 1)[ch(dim.h - 2, dim.w - 2)] = *pixels.at(dim.h - 2, dim.w - 2);","lines":19,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/imgop/sensor/bayer/bilinear.rs#L46-L64"}]},
{"id":"LOGIC_89","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"Pix2D::new_uninit creates a Vec with only capacity reserved but no elements (len == 0), then sets initialized = false. However all methods that access data use debug_assert!(self.initialized) as the guard. In release builds, calling pixels(), row(), at() etc. on an uninit Pix2D will not panic but will instead index into the empty Vec, causing real out-of-bounds panics. The 'initialized' flag provides safety only in debug builds.","fix":"Either document that all data-access methods have a precondition of initialized == true and enforce it in release builds too, or use MaybeUninit.","locations":[{"ref":"rawler/src/pixarray.rs:76-84","code":"   76 |   pub fn new_uninit(width: usize, height: usize) -> Self {\n   77 |     let data = Vec::with_capacity(width * height);\n   78 |     Self {\n   79 |       data,\n   80 |       width,\n   81 |       height,\n   82 |       initialized: false,\n   83 |     }\n   84 |   }","lines":9,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/pixarray.rs#L76-L84"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"`decompress_10le_lsb16` reports the wrong function name in its error message. The error\nstring says `\"decompress_10be(): buffer too short\"` but the enclosing function is\n`decompress_10le_lsb16`. This makes diagnosing buffer-overrun errors misleading.","fix":"Change the error string to `\"decompress_10le_lsb16(): buffer too short\"`.","locations":[{"ref":"rawler/src/decompressors/packed.rs:435","code":"  435 |     return Err(format!(\"decompress_10be(): buffer too short ({} < {})\", buf.len(), need));","lines":1,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decompressors/packed.rs#L435"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"In cr3.rs Ctmd::get_as_tiff(), when a record or block is not found the function emits a warn!() at line 689 and returns Ok(None). In read_cr3_metadata(), the callers at lines 541-574 silently accept None for mandatory records like record 8 (COLORDATA). If the CTMD is present but record 8 is missing, WB/blacklevel/whitelevel all remain None and the image decodes with fallback values without any user-visible error.","fix":"Distinguish between 'record not present at all' and 'record present but block missing'. Only warn when the record exists but the expected block is absent.","locations":[{"ref":"rawler/src/decoders/cr3.rs:701-707","code":"  701 |   pub fn get_as_tiff(&self, record: u16, tag: u16) -> Result<Option<GenericTiffReader>> {\n  702 |     if let Some(block) = self.records.get(&record).and_then(|rec| rec.blocks.get(&tag)) {\n  703 |       Ok(Some(GenericTiffReader::new_with_buffer(block, 0, 0, Some(0))?))\n  704 |     } else {\n  705 |       warn!(\"Unable to find CTMD record {}, tag 0x{:X}\", record, tag);\n  706 |       Ok(None)\n  707 |     }","lines":7,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/cr3.rs#L701-L707"},{"ref":"rawler/src/decoders/cr3.rs:563-586","code":"  563 |       if let Some(rec8) = ctmd.get_as_tiff(8, CR3_CTMD_BLOCK_MAKERNOTES)? {\n  564 |         if let Some(colordata) = rec8.get_entry(Cr3MakernoteTag::ColorData) {\n  565 |           let colordata = cr2::parse_colordata(colordata)?;\n  566 |           //rec8.root_ifd().dump::<TiffCommonTag>(10).iter().for_each(|line| eprintln!(\"MKD: {}\", line));\n  567 |           md.wb = Some(normalize_wb(colordata.wb));\n  568 |           md.blacklevels = colordata.blacklevel;\n  569 |           md.whitelevel = colordata.specular_whitelevel;\n  570 |           /*\n  571 |           if let crate::formats::tiff::Value::Short(v) = &levels.value {\n  572 |             if let Some(offset) = self.camera.param_usize(\"colordata_wbcoeffs\") {\n  573 |               let raw_wb = [v[offset] as f32, v[offset + 1] as f32, v[offset + 2] as f32, v[offset + 3] as f32];\n  574 |               md.wb = Some(normalize_wb(raw_wb));\n  575 |             }\n  576 |             if let Some(offset) = self.camera.param_usize(\"colordata_blacklevel\") {\n  577 |               debug!(\"Blacklevel offset: {:x}\", offset);\n  578 |               md.blacklevels = Some([v[offset], v[offset + 1], v[offset + 2], v[offset + 3]]);\n  579 |             }\n  580 |             if let Some(offset) = self.camera.param_usize(\"colordata_whitelevel\") {\n  581 |               md.whitelevel = Some(v[offset]);\n  582 |             }\n  583 |           }\n  584 |            */\n  585 |         }\n  586 |         md.ctmd_rec8 = Some(rec8);","lines":24,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/cr3.rs#L563-L586"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"In cr3.rs, Ctmd::new() calls data.get_bytes(size as usize - 12) where `size` comes from get_u32(). If a malformed file provides a size smaller than 12, the subtraction underflows (u32 wraps to a huge value) and get_bytes attempts to read gigabytes of data.","fix":"Check that `size >= 12` before the subtraction and break/skip on invalid records.","locations":[{"ref":"rawler/src/decoders/cr3.rs:659","code":"  659 |         blocks: HashMap::new(),","lines":1,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/cr3.rs#L659"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In `client.rs` `stor()`, the entire uploaded file is read into a `Vec<u8>` in memory (`receive_data`) before being written to disk. For large RAW files (potentially hundreds of MB) this doubles the peak memory usage.","fix":"Stream the incoming data directly to the destination (file or callback) rather than buffering the complete payload.","locations":[{"ref":"embedftp/src/client.rs:626-653","code":"  626 |   async fn stor(&mut self, path: PathBuf) -> Result<()> {\n  627 |     self.initiate_data_connection().await?;\n  628 |     if self.data_reader.is_some() {\n  629 |       if invalid_path(&path) {\n  630 |         return Err(Error::Io(io::ErrorKind::PermissionDenied.into()));\n  631 |       }\n  632 |       let path = self.cwd.join(path);\n  633 |       self\n  634 |         .send(Answer::new(ResultCode::DataConnectionAlreadyOpen, \"Starting to send file...\"))\n  635 |         .await?;\n  636 |       let data = self.receive_data().await?;\n  637 |       info!(\"Received file: {:?}, {} bytes\", path, data.len());\n  638 |       self.close_data_connection();\n  639 |       match self.put_file(path, Arc::new(data)).await {\n  640 |         Ok(_) => {\n  641 |           self.send(Answer::new(ResultCode::ClosingDataConnection, \"Transfer done\")).await?;\n  642 |         }\n  643 |         Err(e) => {\n  644 |           error!(\"Failed STOR command: {:?}\", e);\n  645 |           self.send(Answer::new(ResultCode::LocalErrorInProcessing, \"Failed to store the file\")).await?;\n  646 |         }\n  647 |       }\n  648 |     } else {\n  649 |       warn!(\"No opened data connection\");\n  650 |       self.send(Answer::new(ResultCode::ConnectionClosed, \"No opened data connection\")).await?;\n  651 |     }\n  652 |     Ok(())\n  653 |   }","lines":28,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/embedftp/src/client.rs#L626-L653"},{"ref":"embedftp/src/client.rs:665-671","code":"  665 |   /// Receive data from a data connection and take out the reader\n  666 |   async fn receive_data(&mut self) -> Result<Vec<u8>> {\n  667 |     let mut reader = self.data_reader.take().ok_or_else(|| Error::from(\"No data reader\"))?;\n  668 |     let mut buf = Vec::new();\n  669 |     tokio::io::copy(&mut reader, &mut buf).await?;\n  670 |     Ok(buf)\n  671 |   }","lines":7,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/embedftp/src/client.rs#L665-L671"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In `codec.rs` `encode()`, response data is written to a temporary `Vec<u8>` buffer and then extended into the target `BytesMut`. This incurs an extra allocation per response. Writing directly into `BytesMut` using a `Writer` wrapper would eliminate the intermediate allocation.","fix":"Use `buf.writer()` (from `bytes::BufMut`) to write directly into the `BytesMut` buffer.","locations":[{"ref":"embedftp/src/codec.rs:33-52","code":"   33 |   fn encode(&mut self, answer: Answer, buf: &mut BytesMut) -> io::Result<()> {\n   34 |     let mut buffer = vec![];\n   35 |     if !answer.lines.is_empty() {\n   36 |       write!(buffer, \"{}- {}\\r\\n\", answer.code as u32, answer.message)?;\n   37 |       for line in answer.lines {\n   38 |         if let Some(true) = line.chars().next().map(|c| c.is_ascii_digit()) {\n   39 |           write!(buffer, \" {}\\r\\n\", line)?;\n   40 |         } else {\n   41 |           write!(buffer, \"{}\\r\\n\", line)?;\n   42 |         }\n   43 |       }\n   44 |       write!(buffer, \"{} end\\r\\n\", answer.code as u32)?;\n   45 |     } else if answer.message.is_empty() {\n   46 |       write!(buffer, \"{}\\r\\n\", answer.code as u32)?;\n   47 |     } else {\n   48 |       write!(buffer, \"{} {}\\r\\n\", answer.code as u32, answer.message)?;\n   49 |     }\n   50 |     buf.extend(&buffer);\n   51 |     Ok(())\n   52 |   }","lines":20,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/embedftp/src/codec.rs#L33-L52"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In cr2.rs convert_to_rgb(), `self.get_wb(rawfile, cam)` and `self.get_sraw_wb(rawfile, cam)` are each called once for debug logging at lines 702-703, and then get_sraw_wb is called again at line 717 for actual use. The double call parses the COLORDATA tag twice.","fix":"Store the result of get_sraw_wb at line 702 in a variable and reuse it at line 717.","locations":[{"ref":"rawler/src/decoders/cr2.rs:701-702","code":"  701 |     debug!(\"YUV2RGB: Regular WB: {:?}\", self.get_wb(rawfile, cam));\n  702 |     debug!(\"YUV2RGB: SRAW WB: {:?}\", self.get_sraw_wb(rawfile, cam));","lines":2,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/cr2.rs#L701-L702"},{"ref":"rawler/src/decoders/cr2.rs:716","code":"  716 |     let coeffs = self.get_sraw_wb(rawfile, cam)?;","lines":1,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/cr2.rs#L716"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In cr3.rs, read_cr3_metadata() is called twice in raw_image() (lines 266 and 295 implicitly via cr3md.wb etc.), but also once for raw_metadata(), xpacket(), etc. Each call that misses the cache re-parses the entire CTMD section and resolves lens data. The DecoderCache is keyed by RawDecodeParams (including image_index). For the common single-image case this means two cache hits after the first call, but for callers that invoke multiple trait methods the first call per method pays full parsing cost.","fix":"This is acceptable given the cache. No critical fix needed, but ensure cache invalidation semantics are correct when image_index changes.","locations":[{"ref":"rawler/src/decoders/cr3.rs:497-607","code":"  497 |   fn read_cr3_metadata(&self, rawfile: &RawSource, params: &RawDecodeParams) -> Result<Cr3Metadata> {\n  498 |     if let Some(md) = self.md_cache.get(params) {\n  499 |       return Ok(md);\n  500 |     }\n  501 |     let mut md = Cr3Metadata::default();\n  502 | \n  503 |     if let Some(Entry {\n  504 |       value: crate::formats::tiff::Value::Byte(v),\n  505 |       ..\n  506 |     }) = self.cmt3.get_entry(Cr3MakernoteTag::ImgUniqueID)\n  507 |     {\n  508 |       if v.len() == 16 {\n  509 |         debug!(\"CR3 makernote ImgUniqueID: {:x?}\", v);\n  510 |         md.image_unique_id = Some(\n  511 |           v.as_slice()\n  512 |             .try_into()\n  513 |             .map_err(|_| RawlerError::DecoderFailed(\"Invalid ImgUniqueID slice size\".into()))?,\n  514 |         );\n  515 |       }\n  516 |     }\n  517 | \n  518 |     if let Some(entry) = self.cmt3.get_entry(0x0001) {\n  519 |       let quality = match entry.force_u16(3) {\n  520 |         4 => \"RAW\",\n  521 |         5 => \"Superfine\",\n  522 |         7 => \"CRAW\",\n  523 |         130 => \"LightRaw\",\n  524 |         131 => \"StandardRaw\",\n  525 |         _ => \"unknown\",\n  526 |       };\n  527 |       debug!(\"Canon quality mode: {}\", quality);\n  528 |     }\n  529 | \n  530 |     if let Some(entry) = self.cmt3.get_entry(0x4026) {\n  531 |       let clog = match entry.force_u32(11) {\n  532 |         0 => \"OFF\",\n  533 |         1 => \"CLog1\",\n  534 |         2 => \"CLog2\",\n  535 |         3 => \"CLog3\",\n  536 |         _ => \"unknown\",\n  537 |       };\n  538 |       debug!(\"Canon CLog mode: {}\", clog);\n  539 |     }\n  540 | \n  541 |     if let Some(xpacket_box) = self.bmff.filebox.cr3xpacket.as_ref() {\n  542 |       let offset = xpacket_box.header.offset + xpacket_box.header.header_len;\n  543 |       let size = xpacket_box.header.size - xpacket_box.header.header_len;\n  544 |       let buf = rawfile\n  545 |         .subview(offset, size)\n  546 |         .map_err(|e| RawlerError::with_io_error(\"CR3: failed to read XPACKET\", rawfile.path(), e))?;\n  547 |       md.xpacket = Some(buf.to_vec());\n  548 |     }\n  549 | \n  550 |     if let Some(ctmd) = self.read_ctmd(rawfile, params.image_index as u32)? {\n  551 |       if let Some(rec5) = ctmd.exposure_info()? {\n  552 |         debug!(\"CTMD Rec(5): {:?}\", rec5);\n  553 |         md.ctmd_exposure = Some(rec5);\n  554 |       }\n  555 |       md.ctmd_focallen = ctmd.focal_len()?;\n  556 | \n  557 |       if let Some(rec7) = ctmd.get_as_tiff(7, CR3_CTMD_BLOCK_EXIFIFD)? {\n  558 |         md.ctmd_rec7_exif = Some(rec7);\n  559 |       }\n  560 |       if let Some(rec7) = ctmd.get_as_tiff(7, CR3_CTMD_BLOCK_MAKERNOTES)? {\n  561 |         md.ctmd_rec7_makernotes = Some(rec7);\n  562 |       }\n  563 |       if let Some(rec8) = ctmd.get_as_tiff(8, CR3_CTMD_BLOCK_MAKERNOTES)? {\n  564 |         if let Some(colordata) = rec8.get_entry(Cr3MakernoteTag::ColorData) {\n  565 |           let colordata = cr2::parse_colordata(colordata)?;\n  566 |           //rec8.root_ifd().dump::<TiffCommonTag>(10).iter().for_each(|line| eprintln!(\"MKD: {}\", line));\n  56 vel: {:?}\", md.whitelevel);\n  604 | \n  605 |     self.md_cache.set(params, md.clone());\n  606 |     Ok(md)\n  607 |   }","lines":111,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decoders/cr3.rs#L497-L607"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In dng/writer.rs dng_put_raw_ljpeg(), tile_offsets and tile_sizes are built by a sequential for loop over lj92_data after the parallel compression step. Using a sequential loop to write tiles is fine, but the collect into tile_offsets/tile_sizes could be expressed more directly.","fix":"Minor style issue; no functional impact. Cosmetic only.","locations":[{"ref":"rawler/src/dng/writer.rs:622-629","code":"  622 |   let mut tile_offsets: Vec<u32> = Vec::new();\n  623 |   let mut tile_sizes: Vec<u32> = Vec::new();\n  624 | \n  625 |   for tile in lj92_data.iter() {\n  626 |     let offs = subframe.writer.dng.write_data(tile)?;\n  627 |     tile_offsets.push(offs);\n  628 |     tile_sizes.push((tile.len() * size_of::<u8>()) as u32);\n  629 |   }","lines":8,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/dng/writer.rs#L622-L629"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"writer.rs write_strips_lzw() uses rayon to compress strips in parallel but then collects into a Vec and writes them sequentially. If the number of strips is small (dim.h <= 256 uses a single strip) the rayon overhead is pure cost.","fix":"Use plain iterators when there is only one strip; conditionally apply par_chunks.","locations":[{"ref":"rawler/src/formats/tiff/writer.rs:65-71","code":"   65 |       .par_chunks(cpp * dim.w * strip_lines)\n   66 |       .map(|strip| {\n   67 |         let mut encoder = weezl::encode::Encoder::with_tiff_size_switch(weezl::BitOrder::Msb, 8);\n   68 |         encoder.encode(strip.as_bytes())\n   69 |       })\n   70 |       .collect::<std::result::Result<Vec<Vec<u8>>, LzwError>>()\n   71 |       .map_err(|err| TiffError::General(err.to_string()))?;","lines":7,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/formats/tiff/writer.rs#L65-L71"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"LensResolver::resolve_internal() iterates over the entire LENSES_DB vector three separate times for nikon_id, olympus_id, and the general filter chain. Each scan is O(N). For a large lens database this is fine, but the nikon_id and olympus_id lookups clone Option<String> on every iteration unnecessarily.","fix":"Use a HashMap keyed on nikon_id and olympus_id for O(1) lookup, built once at startup alongside LENSES_DB.","locations":[{"ref":"rawler/src/lens.rs:212-220","code":"  212 |     if let Some(nikon_id) = &self.nikon_id {\n  213 |       if let Some(db_entry) = LENSES_DB.iter().find(|entry| entry.identifiers.nikon_id == Some(nikon_id.clone())) {\n  214 |         return Some(db_entry);\n  215 |       }\n  216 |     }\n  217 | \n  218 |     // Olympus lens IDs are special, try this next\n  219 |     if let Some(olympus_id) = &self.olympus_id {\n  220 |       if let Some(db_entry) = LENSES_DB.iter().find(|entry| entry.identifiers.olympus_id == Some(olympus_id.clone())) {","lines":9,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/lens.rs#L212-L220"}]},
{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"RawImage::calc_black_levels() divides each sample sum by count as f32 in a map at the end. If any blackarea color cell was never sampled (count == 0), the division yields NaN, which is then stored silently as a blacklevel, corrupting subsequent image processing.","fix":"Guard against count == 0 before dividing: use 0.0 as the fallback, or return None for uncovered cells.","locations":[{"ref":"rawler/src/rawimage.rs:309","code":"  309 |       let blacklevels: Vec<f32> = samples.into_iter().map(|s| s.avg / s.count as f32).collect();","lines":1,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/rawimage.rs#L309"}]},

{"id":"DEAD_12","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"`decompress_14le_unpacked_padded` is defined in `packed.rs` but has no callers anywhere\nin the codebase. Additionally the function name says `le` (little-endian) but the doc\ncomment describes big-endian words and the implementation uses `u16::from_be_bytes`.\nThe name/implementation mismatch means that if the function were ever wired up, it would\nsilently produce wrong output for a caller expecting little-endian data.","fix":"Either remove the function (it is unused), or fix the name to `decompress_14be_unpacked_padded` and update the error string accordingly.","locations":[{"ref":"rawler/src/decompressors/packed.rs:1152-1185","code":" 1152 | /// Unpacks 14-bit pixel values stored in 16-bit big-endian words with a\n 1153 | /// custom row stride.\n 1154 | ///\n 1155 | /// Each pixel occupies a full 16-bit BE word with the upper 2 bits unused.\n 1156 | /// The value is masked to 14 bits. Row offset is `stripsize` bytes.\n 1157 | ///\n 1158 | /// ```text\n 1159 | ///  Byte 0    Byte 1          (one 16-bit BE word per pixel)\n 1160 | /// [76543210][76543210]\n 1161 | /// [00AAAAAA][AAAAAAAA]\n 1162 | ///  |---- P0 ----|\n 1163 | ///\n 1164 | /// P0 = u16::from_be(B0:B1) & 0x3FFF\n 1165 | /// ```\n 1166 | #[multiversion(targets(\"x86_64+avx+avx2+fma\", \"x86+sse\", \"aarch64+neon\"))]\n 1167 | pub(crate) fn decompress_14le_unpacked_padded(buf: &[u8], width: usize, height: usize, stripsize: usize, dummy: bool) -> std::result::Result<PixU16, String> {\n 1168 |   let need = height * stripsize;\n 1169 |   if buf.len() < need {\n 1170 |     return Err(format!(\"decompress_14le_unpacked_padded(): buffer too short ({} < {})\", buf.len(), need));\n 1171 |   }\n 1172 |   decompress_lines_fn(\n 1173 |     width,\n 1174 |     height,\n 1175 |     dummy,\n 1176 |     &(|out: &mut [u16], row| {\n 1177 |       let inb = &buf[(row * stripsize)..];\n 1178 | \n 1179 |       for (i, bytes) in (0..width).zip(inb.as_chunks::<2>().0) {\n 1180 |         out[i] = u16::from_be_bytes(*bytes) & 0x3fff;\n 1181 |       }\n 1182 |       Ok(())\n 1183 |     }),\n 1184 |   )\n 1185 | }","lines":34,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decompressors/packed.rs#L1152-L1185"}]},

{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"In `decode_ljpeg` the `match` arm `(row @ 0, _)` shadows the outer `row` variable with a\nbound named `row` at value 0 for the `p` computation in predictor-1. The arm comment\n(line 40: \"All other cases use the two previous pixels in the same line\") is misleading\nbecause the case `(row @ 0, _)` is the first-row special case, not an \"other\" case. The\nfirst `_` wildcard matches any predictor for row 0, making the layout confusing compared\nto the explicit `(row, 1)` arm that handles predictor-1 for subsequent rows.","fix":"Clarify the comment: separate the row==0 logic from the predictor-1 logic, or restructure the match to make the intent explicit.","locations":[{"ref":"rawler/src/decompressors/ljpeg/decompressors.rs:39-43","code":"   39 |           // All other cases use the two previous pixels in the same line\n   40 |           match (row, ljpeg.predictor) {\n   41 |             (row @ 0, _) | (row, 1) => {\n   42 |               let a = out[row * stripwidth + (col - ncomp) + c] as i32;\n   43 |               a","lines":5,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decompressors/ljpeg/decompressors.rs#L39-L43"}]},

{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"BitPumpMSB32::refill has a comment saying 'Refill internal bit buffer - Little-Endian' but the struct is named BitPumpMSB32 and its peek_bits stores data MSB-first. The comment is copied from BitPumpLSB and is factually incorrect.","fix":"Change the comment to accurately describe the MSB32 byte-swap logic.","locations":[{"ref":"rawler/src/pumps.rs:21-25","code":"   21 |   /// Refill internal bit buffer - Little-Endian\n   22 |   ///\n   23 |   /// For fast refill, we can simply take a whole u32 value out.\n   24 |   /// For slow refill, there may be 1, 2 or 3 bytes left in buffer. We need\n   25 |   /// to collect them manually.","lines":5,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/pumps.rs#L21-L25"}]},
{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"In idwt.rs, the assertion on line 237 `assert!(level > 0)` is immediately followed by a comment on line 238-240 explaining the code is not called from paths where level is 0. If that invariant is true, the assert is logically redundant. If false, the assert is the only check. Either the comment or the code is misleading.","fix":"Remove the dead `if level == 0 { return Ok(()); }` branch since it is already covered by the assert, or remove the assert and keep only the guard.","locations":[{"ref":"rawler/src/decompressors/crx/idwt.rs:237-240","code":"  237 |     assert!(level > 0);\n  238 |     if level == 0 {\n  239 |       // This code is not called from pathes where level is 0. But we keep this check.\n  240 |       return Ok(());","lines":4,"link":"https://github.com/dnglab/dnglab/blob/ae01bcb2d0f8a74f9dfbb9f7b5c7e315c8e668b7/rawler/src/decompressors/crx/idwt.rs#L237-L240"}]},
