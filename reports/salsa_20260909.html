<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"In `src/function/execute.rs` line 224-226, the code panics with no recovery if a query has\nnon-empty cycle heads, does NOT depend on itself, yet has no outer cycle:\n\n```\npanic!(\"cycle participant with non-empty cycle heads and that doesn't depend on itself must have\nan outer cycle responsible to finalize the query later...\")\n```\n\nThis is reachable through subtle multi-threaded scenarios where cycle topology changes between\niterations (for instance, if a conditional dependency causes a query to drop out of a cycle\nbetween two iterations). Although the cycle algorithm is designed to prevent this, any regression\nin the cycle-head tracking (e.g., a missing `collect_recursive` case) would surface here as a\nhard panic rather than a graceful error, with no information about what specific inputs or\nconfiguration triggered the situation.","fix":"Add more context to the panic message, including the specific cycle_heads contents and the current query's iteration state, to simplify debugging when this invariant is violated.","locations":[{"ref":"src/function/execute.rs:452-457","code":"  452 |     if !depends_on_self {\n  453 |         let Some(outer_cycle) = outer_cycle else {\n  454 |             panic!(\n  455 |                 \"cycle participant with non-empty cycle heads and that doesn't depend on itself must have an outer cycle responsible to finalize the query later (query: {database_key_index:?}, cycle heads: {cycle_heads:?}).\"\n  456 |             );\n  457 |         };","lines":6,"link":"https://github.com/salsa-rs/salsa/blob/e021c01d4939408c89c9325ad2426660117a8b32/src/function/execute.rs#L452-L457"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"In `src/function/execute.rs`, `collect_all_cycle_heads` -> `collect_recursive` at line 546 contains:\n`assert!(provisional_status.is_provisional());`\nThis panics with no user-facing message if a cycle head that was expected to still be provisional\nhas already been finalized (e.g., because another thread finalized it while the current thread\nwas in the middle of fixpoint iteration). The error message would be just the default assertion\nfailure with no explanation of which head became final unexpectedly. Although the comment at\nline 543-545 explains the invariant, the assertion carries no diagnostic message, making failures\nvery hard to debug.","fix":"Replace `assert!(provisional_status.is_provisional())` with `assert!(provisional_status.is_provisional(), \"expected cycle head {current_head:?} to still be provisional but it is {:?}\", provisional_status)` or similar to include the relevant key and status in the panic message.","locations":[{"ref":"src/function/execute.rs:673-676","code":"  673 |         // A query should only ever depend on other heads that are provisional.\n  674 |         // If this invariant is violated, it means that this query participates in a cycle,\n  675 |         // but it wasn't executed in the last iteration of said cycle.\n  676 |         assert!(provisional_status.is_provisional());","lines":4,"link":"https://github.com/salsa-rs/salsa/blob/e021c01d4939408c89c9325ad2426660117a8b32/src/function/execute.rs#L673-L676"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"During persistence deserialization, DeserializeIngredients::visit_map temporarily removes each ingredient with zalsa.take_ingredient(index) (which is Vec::remove), passes &mut zalsa to the ingredient's deserialize method, then restores it with zalsa.replace_ingredient(index, ingredient) (which is Vec::insert). If the ingredient's deserialize implementation panics or returns an error after take_ingredient, the ingredient is dropped permanently and ingredients_vec is left shorter by one, corrupting all subsequent index lookups for ingredients at positions > index. Error paths from access.next_value_seed return Err without restoring the ingredient.","fix":"Use a scopeguard or manually catch-and-restore: store the ingredient in a local, and ensure it is reinserted into ingredients_vec regardless of whether deserialize succeeds or fails (e.g., use std::panic::catch_unwind around the call, or restructure the borrow to avoid needing take/replace at all).","locations":[{"ref":"src/database.rs:348-368","code":"  348 |         fn visit_map<M>(self, mut access: M) -> Result<Self::Value, M::Error>\n  349 |         where\n  350 |             M: serde::de::MapAccess<'de>,\n  351 |         {\n  352 |             let DeserializeIngredients(zalsa) = self;\n  353 | \n  354 |             while let Some(index) = access.next_key::<u32>()? {\n  355 |                 let index = IngredientIndex::new(index);\n  356 | \n  357 |                 // Remove the ingredient temporarily, to avoid holding an overlapping mutable borrow\n  358 |                 // to the ingredient as well as the database.\n  359 |                 let mut ingredient = zalsa.take_ingredient(index);\n  360 | \n  361 |                 // Deserialize the ingredient.\n  362 |                 access.next_value_seed(DeserializeIngredient(&mut *ingredient, zalsa))?;\n  363 | \n  364 |                 zalsa.replace_ingredient(index, ingredient);\n  365 |             }\n  366 | \n  367 |             Ok(())\n  368 |         }","lines":21,"link":"https://github.com/salsa-rs/salsa/blob/e021c01d4939408c89c9325ad2426660117a8b32/src/database.rs#L348-L368"},{"ref":"src/zalsa.rs:426-435","code":"  426 |     pub fn take_ingredient(&mut self, index: IngredientIndex) -> Box<dyn Ingredient> {\n  427 |         self.ingredients_vec.remove(index.as_u32() as usize)\n  428 |     }\n  429 | \n  430 |     /// **NOT SEMVER STABLE**\n  431 |     #[doc(hidden)]\n  432 |     pub fn replace_ingredient(&mut self, index: IngredientIndex, ingredient: Box<dyn Ingredient>) {\n  433 |         self.ingredients_vec\n  434 |             .insert(index.as_u32() as usize, ingredient);\n  435 |     }","lines":10,"link":"https://github.com/salsa-rs/salsa/blob/e021c01d4939408c89c9325ad2426660117a8b32/src/zalsa.rs#L426-L435"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"Multiple `.unwrap()` calls in `dependency_graph.rs` assume the invariant that every entry in\n`transferred` has a matching entry in `transferred_dependents` and vice versa. Specifically:\n- Line 179: `self.transferred_dependents.get_mut(&owner).unwrap()`\n- Line 190: `self.transferred_dependents.get_mut(&owner).unwrap()`\n- Lines 274, 305, 317: similar patterns inside `transfer_lock`\nIf this invariant is violated due to a race, a bug in the complex cycle-detection code, or\nany future maintenance change, these will panic with \"None\" inside code that holds the\n`dependency_graph` mutex, which may stall other threads indefinitely (the mutex will be\npoisoned or never unlocked cleanly depending on the sync backend).","fix":"Replace each `.unwrap()` with `.expect(\"invariant violated: transferred entry missing from transferred_dependents\")` to provide a clearer panic message, or use `if let Some(...)` guards and log/return an error if a missing entry can be tolerated.","locations":[{"ref":"src/runtime/dependency_graph.rs:177-180","code":"  177 |             self.transferred_dependents\n  178 |                 .get_mut(&owner)\n  179 |                 .unwrap()\n  180 |                 .remove(&database_key);","lines":4,"link":"https://github.com/salsa-rs/salsa/blob/e021c01d4939408c89c9325ad2426660117a8b32/src/runtime/dependency_graph.rs#L177-L180"},{"ref":"src/runtime/dependency_graph.rs:187-191","code":"  187 |         if let Some((_, owner)) = self.transferred.remove(&database_key) {\n  188 |             self.transferred_dependents\n  189 |                 .get_mut(&owner)\n  190 |                 .unwrap()\n  191 |                 .remove(&database_key);","lines":5,"link":"https://github.com/salsa-rs/salsa/blob/e021c01d4939408c89c9325ad2426660117a8b32/src/runtime/dependency_graph.rs#L187-L191"},{"ref":"src/runtime/dependency_graph.rs:272-275","code":"  272 |                 dg.transferred_dependents\n  273 |                     .get_mut(&old_owner)\n  274 |                     .unwrap()\n  275 |                     .remove(&query);","lines":4,"link":"https://github.com/salsa-rs/salsa/blob/e021c01d4939408c89c9325ad2426660117a8b32/src/runtime/dependency_graph.rs#L272-L275"},{"ref":"src/runtime/dependency_graph.rs:303-306","code":"  303 |                         dg.transferred_dependents\n  304 |                             .get_mut(&query)\n  305 |                             .unwrap()\n  306 |                             .remove(&source);","lines":4,"link":"https://github.com/salsa-rs/salsa/blob/e021c01d4939408c89c9325ad2426660117a8b32/src/runtime/dependency_graph.rs#L303-L306"},{"ref":"src/runtime/dependency_graph.rs:315-318","code":"  315 |                             dg.transferred_dependents\n  316 |                                 .get_mut(&old_owner)\n  317 |                                 .unwrap()\n  318 |                                 .push(source);","lines":4,"link":"https://github.com/salsa-rs/salsa/blob/e021c01d4939408c89c9325ad2426660117a8b32/src/runtime/dependency_graph.rs#L315-L318"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"PageIndex::new and SlotIndex::new use debug_assert for their bounds checks, so the checks are compiled out in release builds. make_id then casts PageIndex.0 (a usize) to u32 with as u32, which silently truncates on 64-bit systems if the page count ever exceeds u32::MAX (impossible with MAX_PAGES = 4M, but the truncation cast is present). More importantly, if the debug_assert for MAX_PAGES is the only guard, the Id encoding would be silently wrong in release if page count logic drifts. The Id::from_index call itself also uses a debug_assert.","fix":"Replace debug_assert with assert in PageIndex::new and SlotIndex::new, or add a release-mode check in make_id before the cast.","locations":[{"ref":"src/table.rs:133-138","code":"  133 | impl PageIndex {\n  134 |     #[inline]\n  135 |     fn new(idx: usize) -> Self {\n  136 |         debug_assert!(idx < MAX_PAGES);\n  137 |         Self(idx)\n  138 |     }","lines":6,"link":"https://github.com/salsa-rs/salsa/blob/e021c01d4939408c89c9325ad2426660117a8b32/src/table.rs#L133-L138"},{"ref":"src/table.rs:149-155","code":"  149 | impl SlotIndex {\n  150 |     #[inline]\n  151 |     fn new(idx: usize) -> Self {\n  152 |         debug_assert!(idx < PAGE_LEN);\n  153 |         Self(idx)\n  154 |     }\n  155 | }","lines":7,"link":"https://github.com/salsa-rs/salsa/blob/e021c01d4939408c89c9325ad2426660117a8b32/src/table.rs#L149-L155"},{"ref":"src/table.rs:598-603","code":"  598 | fn make_id(page: PageIndex, slot: SlotIndex) -> Id {\n  599 |     let page = page.0 as u32;\n  600 |     let slot = slot.0 as u32;\n  601 |     // SAFETY: `slot` is guaranteed to be small enough that the resulting Id won't be bigger than `Id::MAX_U32`\n  602 |     unsafe { Id::from_index((page << PAGE_LEN_BITS) | slot) }\n  603 | }","lines":6,"link":"https://github.com/salsa-rs/salsa/blob/e021c01d4939408c89c9325ad2426660117a8b32/src/table.rs#L598-L603"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`pop_active_query` in `QueryStack` (src/active_query.rs line 421) decrements `self.len`\nprotected only by a `debug_assert_ne!(self.len, 0, ...)` which is stripped in release\nbuilds. A mismatched push/pop would cause `self.len` (a `usize`) to wrap to `usize::MAX`,\nfollowed by an out-of-bounds index `self.stack[usize::MAX]` which panics with a different,\nharder-to-diagnose message than the original intent.","fix":"Replace `debug_assert_ne!` with a release-mode `assert_ne!`, or use `self.len.checked_sub(1).expect(\"too many pops\")` to catch the underflow clearly.","locations":[{"ref":"src/active_query.rs:442-449","code":"  442 |         #[cfg(debug_assertions)]\n  443 |         assert_eq!(push_len, self.len(), \"unbalanced push/pop\");\n  444 |         debug_assert_ne!(self.len, 0, \"too many pops\");\n  445 |         self.len -= 1;\n  446 |         let active_query = &mut self.stack[self.len];\n  447 |         debug_assert_eq!(active_query.database_key_index, key, \"unbalanced push/pop\");\n  448 |         active_query\n  449 |     }","lines":8,"link":"https://github.com/salsa-rs/salsa/blob/e021c01d4939408c89c9325ad2426660117a8b32/src/active_query.rs#L442-L449"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`Revision::next()` in `src/revision.rs` (line 49) computes `self.generation.get() + 1`\nusing a plain addition. In debug builds this panics on overflow at `usize::MAX` revisions.\nIn release builds the addition wraps to 0 and then `Self::from(0)` immediately panics\nbecause `NonZeroUsize::new(0).unwrap()` fails. While `usize::MAX` revisions is\nunreachable in practice, the addition is not guarded. `new_revision` (runtime.rs:286)\ncalls `r_old.next()` without checking for overflow.","fix":"Add an overflow check in `new_revision` or in `Revision::next`, for example: `Self::from(self.generation.get().checked_add(1).expect(\"revision counter overflow\"))`.","locations":[{"ref":"src/runtime.rs:297-302","code":"  297 |         let r_old = self.current_revision();\n  298 |         let r_new = r_old.next();\n  299 |         self.revisions[0] = r_new;\n  300 |         *self.cancellation_count.get_mut() = 0;\n  301 |         crate::tracing::info!(\"new_revision: {r_old:?} -> {r_new:?}\");\n  302 |         r_new","lines":6,"link":"https://github.com/salsa-rs/salsa/blob/e021c01d4939408c89c9325ad2426660117a8b32/src/runtime.rs#L297-L302"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"Zalsa::ingredient_index_for_memo performs two unchecked slice indexing operations. If called with a struct_ingredient_index that has no entry in memo_ingredient_indices, or with a memo_ingredient_index that is out of bounds for that entry, it panics. These panics are reachable if an ingredient is queried with a mismatched memo index, which can happen during deserialization or when a tracked function from one database is applied to an id from another.","fix":"Return an Option<IngredientIndex> and let callers handle the missing-index case, or add an explicit bounds check with a descriptive panic message.","locations":[{"ref":"src/zalsa.rs:277-284","code":"  277 |     pub(crate) fn ingredient_index_for_memo(\n  278 |         &self,\n  279 |         struct_ingredient_index: IngredientIndex,\n  280 |         memo_ingredient_index: MemoIngredientIndex,\n  281 |     ) -> IngredientIndex {\n  282 |         self.memo_ingredient_indices[struct_ingredient_index.as_u32() as usize]\n  283 |             [memo_ingredient_index.as_usize()]\n  284 |     }","lines":8,"link":"https://github.com/salsa-rs/salsa/blob/e021c01d4939408c89c9325ad2426660117a8b32/src/zalsa.rs#L277-L284"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`DisambiguatorMap::disambiguate` (tracked_struct.rs line 459) increments the `Disambiguator(u32)`\ncounter with `disambiguator.0 += 1`. In release mode this wraps silently on overflow. If a single\nquery creates more than 2^32 tracked structs with the same `IdentityHash`, the disambiguator wraps\nto 0, producing an `Identity` that collides with a previously created struct. The colliding struct\nwould be silently reused rather than having a fresh slot allocated, yielding incorrect field values\nfrom the stale struct. In debug mode the overflow panics instead. The value 2^32 is unrealistic in\npractice but the absence of a check makes the silent corruption unbounded.","fix":"Use `disambiguator.0 = disambiguator.0.wrapping_add(1)` with an explicit note, or `checked_add` with a panic/error on overflow.","locations":[{"ref":"src/tracked_struct.rs:462","code":"  462 |         disambiguator.0 += 1;","lines":1,"link":"https://github.com/salsa-rs/salsa/blob/e021c01d4939408c89c9325ad2426660117a8b32/src/tracked_struct.rs#L462"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"IngredientIndex::successor does no bounds checking. It computes self.0 + 1 + index as u32 with unchecked arithmetic. In release builds this wraps silently on overflow. The cast of the usize argument to u32 also silently truncates on 64-bit targets when index > u32::MAX. Any code path that adds many field-successor ingredients to a struct approaching MAX_INDEX will produce a corrupted ingredient index that silently aliases an existing ingredient.","fix":"Add bounds checking: assert that self.0.checked_add(1 + index as u32).unwrap() <= Self::MAX_INDEX, or use saturating/checked arithmetic and return Result.","locations":[{"ref":"src/zalsa.rs:102-104","code":"  102 |     pub fn successor(self, index: usize) -> Self {\n  103 |         IngredientIndex(self.0 + 1 + index as u32)\n  104 |     }","lines":3,"link":"https://github.com/salsa-rs/salsa/blob/e021c01d4939408c89c9325ad2426660117a8b32/src/zalsa.rs#L102-L104"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `components/salsa-macros/src/debug.rs`, the `dump_tokens` function (lines 19-43)\nspawns `rustfmt` with a piped stdin, writes the token string to stdin, then calls\n`wait_with_output()` - but the stdin `Write` handle is still alive inside the closure\nat the point `wait_with_output()` is called. `rustfmt` may block waiting for EOF on\nstdin while this process blocks in `wait_with_output()`. This creates a potential\ndeadlock or hang during macro expansion when `SALSA_DEBUG_MACRO` is set. The issue\noccurs because the `take()`-returned stdin value is not explicitly dropped before\n`wait_with_output`.","fix":"Drop stdin explicitly before waiting:\n  let mut stdin_handle = rustfmt.stdin.take().unwrap();\n  stdin_handle.write_all(token_string.as_bytes())?;\n  drop(stdin_handle);\n  rustfmt.wait_with_output()","locations":[{"ref":"components/salsa-macros/src/debug.rs:27-34","code":"   27 |             .and_then(|mut rustfmt| {\n   28 |                 rustfmt\n   29 |                     .stdin\n   30 |                     .take()\n   31 |                     .unwrap()\n   32 |                     .write_all(token_string.as_bytes())?;\n   33 |                 rustfmt.wait_with_output()\n   34 |             })","lines":8,"link":"https://github.com/salsa-rs/salsa/blob/e021c01d4939408c89c9325ad2426660117a8b32/components/salsa-macros/src/debug.rs#L27-L34"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `tracked_fn.rs`, the cycle_recovery match arm `(_, _, Some(_))` calls\n`self.args.cycle_initial.as_ref().unwrap()` to get the span for the error message,\nbut `cycle_initial` can be `None` when the pattern is `(Some(cycle_fn), None, Some(cycle_result))`.\nIn that case, `.unwrap()` panics inside the proc-macro at compile time instead of\nemitting a proper diagnostic. The user sees a proc-macro panic rather than a friendly error.","fix":"Use `self.args.cycle_fn.as_ref().or(self.args.cycle_initial.as_ref()).unwrap()` or attach the error to `self.args.cycle_result.as_ref().unwrap()` (which is always `Some` in this arm) instead.","locations":[{"ref":"components/salsa-macros/src/tracked_fn.rs:302-305","code":"  302 |             (_, _, Some(_)) => Err(syn::Error::new_spanned(\n  303 |                 self.args.cycle_initial.as_ref().unwrap(),\n  304 |                 \"must provide either `cycle_result` or `cycle_fn` & `cycle_initial`, not both\",\n  305 |             )),","lines":4,"link":"https://github.com/salsa-rs/salsa/blob/e021c01d4939408c89c9325ad2426660117a8b32/components/salsa-macros/src/tracked_fn.rs#L302-L305"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`add_untracked_read` in `ActiveQuery` (line 141) assigns `self.changed_at = changed_at`\nunconditionally instead of using `self.changed_at = self.changed_at.max(changed_at)`.\nIf a tracked read with a high revision was already recorded and then an untracked read is\nreported, the `changed_at` could be lowered to `current_revision` of an earlier point in the\nsame query. In practice every caller passes `zalsa.current_revision()` which is always\nmonotonically increasing, so the assignment never lowers the value today. However the\nfunction's contract does not document this assumption, making the behavior fragile if a\ncaller ever passes a non-current revision.","fix":"Change the assignment to `self.changed_at = self.changed_at.max(changed_at);` to match the pattern used in `add_read` and `add_read_simple`.","locations":[{"ref":"src/active_query.rs:162-166","code":"  162 |     pub(super) fn add_untracked_read(&mut self, changed_at: Revision) {\n  163 |         self.untracked_read = true;\n  164 |         self.durability = Durability::MIN;\n  165 |         self.changed_at = changed_at;\n  166 |     }","lines":5,"link":"https://github.com/salsa-rs/salsa/blob/e021c01d4939408c89c9325ad2426660117a8b32/src/active_query.rs#L162-L166"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"MemoTableTypes::set calls Vec::insert(index, value) instead of Vec::push(value). Because next_memo_ingredient_index always hands out indices equal to the current length of the vector, using Vec::insert is functionally identical to push when called in order. However, if called out of order (index > len), Vec::insert panics. Using push would be both clearer and avoids a latent panic when the calling order assumption is violated. The method is named 'set' implying idempotent slot assignment, but Vec::insert shifts existing elements rather than overwriting a slot.","fix":"Replace self.types.insert(memo_ingredient_index.as_usize(), memo_type) with self.types.push(memo_type) and add a debug_assert that memo_ingredient_index.as_usize() == self.types.len() before the push.","locations":[{"ref":"src/table/memo.rs:275-282","code":"  275 |     pub(crate) fn set(\n  276 |         &mut self,\n  277 |         memo_ingredient_index: MemoIngredientIndex,\n  278 |         memo_type: MemoEntryType,\n  279 |     ) {\n  280 |         self.types\n  281 |             .insert(memo_ingredient_index.as_usize(), memo_type);\n  282 |     }","lines":8,"link":"https://github.com/salsa-rs/salsa/blob/e021c01d4939408c89c9325ad2426660117a8b32/src/table/memo.rs#L275-L282"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`IngredientImpl<C>::memory_usage` in `src/tracked_struct.rs` (lines 1043-1052) iterates\n`self.entries(db.zalsa())` and calls `entry.value.memory_usage(...)` on each entry without\nacquiring the per-value read lock (`acquire_read_lock` / `lock_fields`). Reading `value.fields`\nand `value.memos` while another thread could be inside `update()` (which swaps `updated_at` to\n`None` and writes to `fields`) is unsound even with field-level atomics, because `C::Fields<'_>`\nis not necessarily composed of atomics. The analogous `memory_usage` in `src/interned.rs`\ncorrectly acquires all shard locks before iterating (lines 982-999). This inconsistency is a data\nrace in the salsa_unstable feature that can produce garbage reads or memory-safety violations when\nthe database is used concurrently.","fix":"Either restrict memory_usage to single-threaded contexts (take &mut self or require &mut Zalsa), or call `acquire_read_lock` for each entry before accessing its fields.","locations":[{"ref":"src/tracked_struct.rs:1056-1065","code":" 1056 |     fn memory_usage(&self, db: &dyn crate::Database) -> Option<Vec<crate::database::SlotInfo>> {\n 1057 |         let memory_usage = self\n 1058 |             .entries(db.zalsa())\n 1059 |             // SAFETY: The memo table belongs to a value that we allocated, so it\n 1060 |             // has the correct type.\n 1061 |             .map(|entry| unsafe { entry.value.memory_usage(&self.memo_table_types) })\n 1062 |             .collect();\n 1063 | \n 1064 |         Some(memory_usage)\n 1065 |     }","lines":10,"link":"https://github.com/salsa-rs/salsa/blob/e021c01d4939408c89c9325ad2426660117a8b32/src/tracked_struct.rs#L1056-L1065"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `components/salsa-macro-rules/src/setup_tracked_fn.rs` (lines 158-160), the\ngenerated `SalsaStructInDb::lookup_ingredient_index` implementation for `InternedData`\nreturns `IngredientIndices::empty()`. This is used when `needs_interner` is true,\ni.e. for tracked functions with multiple arguments that intern their inputs. The\n`IngredientIndices::empty()` result is never used in `create_ingredients` (that branch\nuses `first_index.successor(0).into()` directly), but the `SalsaStructInDb` contract\nimplies `lookup_ingredient_index` should return the ingredient indices that correspond\nto this struct type. Returning `empty()` breaks any external code that relies on\n`SalsaStructInDb::lookup_ingredient_index` for `InternedData` (e.g., supertype enum\nmerging). Since `InternedData` is private and only used internally this is low risk,\nbut the contract violation is still present.","fix":"Return the actual intern ingredient index: `$zalsa::IngredientIndices::from(zalsa.lookup_jar_by_type::<$fn_name>().successor(0))`, or add a comment explaining why `empty()` is intentional and safe for this specific internal use.","locations":[{"ref":"components/salsa-macro-rules/src/setup_tracked_fn.rs:167-169","code":"  167 |                         fn lookup_ingredient_index(aux: &$zalsa::Zalsa) -> $zalsa::IngredientIndices {\n  168 |                             $zalsa::IngredientIndices::empty()\n  169 |                         }","lines":3,"link":"https://github.com/salsa-rs/salsa/blob/e021c01d4939408c89c9325ad2426660117a8b32/components/salsa-macro-rules/src/setup_tracked_fn.rs#L167-L169"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `options.rs`, the `id` option parser (line 482) silently overwrites a previously\nset value with `options.id = Some(path)` rather than returning a duplicate-option error.\nEvery other option in the same parser uses `replace(...)` and returns an error when\na duplicate is found (e.g. `returns`, `no_eq`, `cycle_fn`, etc.). The `id` option is the\nonly one that silently accepts a second specification without complaint, making user typos\nharder to detect.","fix":"Replace `options.id = Some(path)` with `if let Some(old) = options.id.replace(path) { return Err(syn::Error::new(old.span(), \"option `id` provided twice\")); }` to match all other options.","locations":[{"ref":"components/salsa-macros/src/options.rs:473-483","code":"  473 |             } else if ident == \"id\" {\n  474 |                 if A::ID {\n  475 |                     let _eq = Equals::parse(input)?;\n  476 |                     let path = syn::Path::parse(input)?;\n  477 |                     options.id = Some(path);\n  478 |                 } else {\n  479 |                     return Err(syn::Error::new(\n  480 |                         ident.span(),\n  481 |                         \"`id` option not allowed here\",\n  482 |                     ));\n  483 |                 }","lines":11,"link":"https://github.com/salsa-rs/salsa/blob/e021c01d4939408c89c9325ad2426660117a8b32/components/salsa-macros/src/options.rs#L473-L483"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`IngredientImpl::from_zalsa` in `src/accumulator.rs` is declared to return\n`Option<&Self>` but never actually returns `None`. Internally it calls\n`zalsa.lookup_jar_by_type::<JarImpl<A>>()` which panics if the accumulator is not\nregistered, and then `assert_type::<Self>()` which panics on type mismatch. The only\npossible return value is `Some(ingredient)`. The misleading signature causes the call\nsite in `function/accumulated.rs:34` to handle a dead `None` branch with `return vec![]`.","fix":"Change the return type to `&Self` and remove the `Some()` wrapping, or add an actual `None` path by using a fallible lookup. Update the call site accordingly.","locations":[{"ref":"src/accumulator.rs:66-70","code":"   66 |     pub fn from_zalsa(zalsa: &Zalsa) -> Option<&Self> {\n   67 |         let index = zalsa.lookup_jar_by_type::<JarImpl<A>>();\n   68 |         let ingredient = zalsa.lookup_ingredient(index).assert_type::<Self>();\n   69 |         Some(ingredient)\n   70 |     }","lines":5,"link":"https://github.com/salsa-rs/salsa/blob/e021c01d4939408c89c9325ad2426660117a8b32/src/accumulator.rs#L66-L70"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `attach.rs`, the `None` branch of `attach_allow_change`'s inner `DbGuard::new`\nperforms a redundant double-write to the cell. `Cell::replace(Some(db))` on line 111\nalready sets the cell to `Some(db)` and returns the old value. When the old value is\n`None`, line 130 then calls `attached.database.set(Some(db))` again, re-writing the\nsame value that `replace` already stored. This is harmless but confusing.","fix":"Remove line 130 (`attached.database.set(Some(db));`). The `replace` call on line 111 already set the value correctly.","locations":[{"ref":"src/attach.rs:128-135","code":"  128 |                     // No database is attached, attach the new one.\n  129 |                     None => {\n  130 |                         attached.database.set(Some(db));\n  131 |                         Self {\n  132 |                             state: Some(attached),\n  133 |                             prev: None,\n  134 |                         }\n  135 |                     }","lines":8,"link":"https://github.com/salsa-rs/salsa/blob/e021c01d4939408c89c9325ad2426660117a8b32/src/attach.rs#L128-L135"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `src/function/execute.rs`, `try_complete_cycle_head` at lines 656-660, the `metadata_converged`\ncheck compares `durability`, `changed_at`, and `is_derived_untracked`. However, it does NOT\naccount for changes in the `tracked_struct_ids` set. If a cycle head produces different tracked\nstructs in two consecutive iterations (same values, same durability, same changed_at, but different\ntracked struct id assignments), `metadata_converged` would be `true` and convergence would be\ndeclared even though the tracked struct identity has changed. In practice, tracked struct ids are\nseeded across iterations (see `execute_query` line 376) to preserve identity, so the ids should\nbe stable. But if the seeding fails to cover a struct that is conditionally created, the cycle\ncould terminate with an incorrect id assignment. This is a potential correctness concern rather\nthan a confirmed bug.","fix":"Document why `tracked_struct_ids` differences do not need to be part of the convergence check, or add a `debug_assert` that tracked struct ids are stable after convergence is declared.","locations":[{"ref":"src/function/execute.rs:786-790","code":"  786 |     let metadata_converged = last_provisional_revisions.durability\n  787 |         == completed_query.revisions.durability\n  788 |         && last_provisional_revisions.changed_at == completed_query.revisions.changed_at\n  789 |         && last_provisional_revisions.is_derived_untracked()\n  790 |             == completed_query.revisions.is_derived_untracked();","lines":5,"link":"https://github.com/salsa-rs/salsa/blob/e021c01d4939408c89c9325ad2426660117a8b32/src/function/execute.rs#L786-L790"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"medium","description":"In `src/nonce.rs`, the rollover assertion on line 29 checks `value != 0` where\n`value` is the value fetched BEFORE the increment (i.e. the value returned by\n`fetch_add`). The counter starts at 1 and is incremented. When the counter wraps\nfrom `u32::MAX` to 0 via wrapping arithmetic, the `fetch_add` returns `u32::MAX`\n(the pre-increment value). That call succeeds, returning a valid `Nonce(u32::MAX)`.\nOnly on the NEXT call is 0 returned, and `NonZeroU32::new(0).unwrap()` will panic\nBEFORE the assertion can fire. In debug builds overflow is checked by the Rust\nruntime. In release builds the code panics in a slightly different place than\nintended. The assertion is therefore redundant in the wrong-direction panic sense.","fix":"Add an assertion `assert!(value < u32::MAX, \"nonce about to roll over\")` before returning, or assert `value != u32::MAX` to catch the final valid nonce before wrapping. The current assertion never fires when it's needed because the `.unwrap()` panics first.","locations":[{"ref":"src/nonce.rs:26-32","code":"   26 |     pub(crate) fn nonce(&self) -> Nonce<T> {\n   27 |         let value = self.value.fetch_add(1, Ordering::Relaxed);\n   28 | \n   29 |         assert!(value != 0, \"nonce rolled over\");\n   30 | \n   31 |         Nonce(NonZeroU32::new(value).unwrap(), self.phantom)\n   32 |     }","lines":7,"link":"https://github.com/salsa-rs/salsa/blob/e021c01d4939408c89c9325ad2426660117a8b32/src/nonce.rs#L26-L32"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`IdentityMap::is_active` (tracked_struct.rs lines 314-322) performs a full O(n) linear scan\nover all tracked-struct entries to find one by `(id, ingredient_index)`. The hash table is\nkeyed on `Identity` (ingredient_index + hash + disambiguator), not on `Id`, so the lookup\ncannot use the hash index. This is called from `is_tracked_struct_of_active_query` (zalsa_local.rs:296)\non every read of a tracked struct that was created in the current query. For queries that create\nmany tracked structs the cost is O(n) per tracked-struct field access, making the overall cost O(n^2).","fix":"Maintain a secondary `HashMap<(IngredientIndex, Id), bool>` inside `IdentityMap` or store the active flag in a `HashSet<DatabaseKeyIndex>` to allow O(1) lookup.","locations":[{"ref":"src/tracked_struct.rs:317-325","code":"  317 |     pub(crate) fn is_active(&self, key: DatabaseKeyIndex) -> bool {\n  318 |         self.table\n  319 |             .iter()\n  320 |             .find(|entry| {\n  321 |                 entry.id == key.key_index()\n  322 |                     && entry.identity.ingredient_index() == key.ingredient_index()\n  323 |             })\n  324 |             .is_some_and(|entry| entry.active)\n  325 |     }","lines":9,"link":"https://github.com/salsa-rs/salsa/blob/e021c01d4939408c89c9325ad2426660117a8b32/src/tracked_struct.rs#L317-L325"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In `src/function/execute.rs`, `complete_cycle_query` (lines 784-817) takes the `FLATTEN_MAPS`\nthread-local pool on entry and returns it on successful exit (line 815). If `flatten_cycle_dependencies`\npanics (e.g., due to an unexpected internal error or OOM during `reserve`), the `flattened` and\n`seen` sets are dropped without being returned to the pool. The `seen` set is explicitly cleared\nat line 803 before `pop_completion`, but `flattened` is in the middle of being populated when a\npanic could occur. After a `catch_unwind`, the thread-local pool slot is permanently empty for\nthat thread. For threads that participate in many cycles, this causes repeated heap allocations\nfor these maps instead of reusing the pooled allocations.","fix":"Use a guard struct (similar to `PoisonProvisionalIfPanicking`) that clears and returns both maps\nto the pool in its `Drop` implementation, even on panic:\n\n```rust\nstruct FlattenMapsGuard {\n    maps: Option<(FxIndexSet<QueryEdge>, FxHashSet<DatabaseKeyIndex>)>,\n}\nimpl Drop for FlattenMapsGuard {\n    fn drop(&mut self) {\n        if let Some((mut f, mut s)) = self.maps.take() {\n            f.clear(); s.clear();\n            FLATTEN_MAPS.set(Some((f, s)));\n        }\n    }\n}\n```","locations":[{"ref":"src/function/execute.rs:929-962","code":"  929 | fn complete_cycle_query(\n  930 |     zalsa: &Zalsa,\n  931 |     active_query: ActiveQueryGuard<'_>,\n  932 |     iteration: IterationStamp,\n  933 | ) -> CompletedQuery {\n  934 |     let (mut flattened, mut seen) = FLATTEN_MAPS.take().unwrap_or_default();\n  935 | \n  936 |     debug_assert!(flattened.is_empty());\n  937 |     debug_assert!(seen.is_empty());\n  938 | \n  939 |     let detached_query = active_query.detach();\n  940 |     flattened.reserve(detached_query.input_outputs().len());\n  941 |     flatten_cycle_dependencies(\n  942 |         zalsa,\n  943 |         detached_query.input_outputs(),\n  944 |         &mut flattened,\n  945 |         &mut seen,\n  946 |     );\n  947 | \n  948 |     seen.clear();\n  949 |     let completion = detached_query.pop_completion(iteration, true);\n  950 |     let completed_query = completion.finish(flattened.drain(..));\n  951 |     #[cfg(feature = \"accumulator\")]\n  952 |     assert!(\n  953 |         completed_query\n  954 |             .revisions\n  955 |             .accumulated_inputs\n  956 |             .load()\n  957 |             .is_empty(),\n  958 |         \"Fixpoint iteration doesn't support accumulated values because it doesn't preserve the original query dependency tree.\"\n  959 |     );\n  960 |     FLATTEN_MAPS.set(Some((flattened, seen)));\n  961 |     completed_query\n  962 | }","lines":34,"link":"https://github.com/salsa-rs/salsa/blob/e021c01d4939408c89c9325ad2426660117a8b32/src/function/execute.rs#L929-L962"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`Edges::depends_on` (src/runtime/dependency_graph.rs lines 457-467) walks the edge chain\nas a singly-linked list. Each call is O(depth) and the function is called in several hot\npaths (cycle detection, transfer-lock logic). Under deep blocking chains this becomes O(n)\nper check. Additionally, the function has no cycle guard - if the invariant that edges form\na DAG is ever violated, it will loop forever while holding the `dependency_graph` mutex,\ndeadlocking all other threads.","fix":"Consider adding a visited-set or depth limit as a safety guard to avoid a potential infinite loop if the DAG invariant is violated. For the performance concern, the current design is inherent to the lock-based blocking structure.","locations":[{"ref":"src/runtime/dependency_graph.rs:456-466","code":"  456 |     fn depends_on(&self, from_id: ThreadId, to_id: ThreadId) -> bool {\n  457 |         let mut p = from_id;\n  458 |         while let Some(q) = self.0.get(&p).map(|edge| edge.blocked_on_id) {\n  459 |             if q == to_id {\n  460 |                 return true;\n  461 |             }\n  462 | \n  463 |             p = q;\n  464 |         }\n  465 |         p == to_id\n  466 |     }","lines":11,"link":"https://github.com/salsa-rs/salsa/blob/e021c01d4939408c89c9325ad2426660117a8b32/src/runtime/dependency_graph.rs#L456-L466"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In `src/views.rs`, `add()` (lines 107-137) performs a linear scan of `self.view_casters`\non every call to check whether a downcaster for `DbView` already exists. Similarly,\n`downcaster_for()` (lines 144-160) also scans linearly. These are called during DB\nview registration, which can occur per-query when registering view casters for\ntrait impls. With many database view traits the cost grows as O(n) per registration.","fix":"Replace the `boxcar::Vec<ViewCaster>` with a concurrent `HashMap<TypeId, ViewCaster>` (or similar) to make lookups O(1). The existing linear scan is tolerable with few view traits but scales poorly.","locations":[{"ref":"src/views.rs:107-137","code":"  107 |     pub fn add<Concrete: 'static, DbView: ?Sized + Any>(\n  108 |         &self,\n  109 |         func: fn(NonNull<Concrete>) -> NonNull<DbView>,\n  110 |     ) -> &DatabaseDownCaster<DbView> {\n  111 |         assert_eq!(\n  112 |             self.source_type_id,\n  113 |             TypeId::of::<Concrete>(),\n  114 |             \"mismatched source type\"\n  115 |         );\n  116 |         let target_type_id = TypeId::of::<DbView>();\n  117 |         if let Some((_, caster)) = self\n  118 |             .view_casters\n  119 |             .iter()\n  120 |             .find(|(_, u)| u.target_type_id == target_type_id)\n  121 |         {\n  122 |             // SAFETY: The type-erased function pointer is guaranteed to be valid for `DbView`\n  123 |             return unsafe { &*(&raw const *caster).cast::<DatabaseDownCaster<DbView>>() };\n  124 |         }\n  125 | \n  126 |         // SAFETY: We are type erasing the function pointer for storage, and we will unerase it\n  127 |         // before we call it.\n  128 |         let caster = unsafe {\n  129 |             mem::transmute::<fn(NonNull<Concrete>) -> NonNull<DbView>, DatabaseDownCasterSig<DbView>>(\n  130 |                 func,\n  131 |             )\n  132 |         };\n  133 |         let caster = ViewCaster::new::<DbView>(caster);\n  134 |         let idx = self.view_casters.push(caster);\n  135 |         // SAFETY: The type-erased function pointer is guaranteed to be valid for `DbView`\n  136 |         unsafe { &*(&raw const self.view_casters[idx]).cast::<DatabaseDownCaster<DbView>>() }\n  137 |     }","lines":31,"link":"https://github.com/salsa-rs/salsa/blob/e021c01d4939408c89c9325ad2426660117a8b32/src/views.rs#L107-L137"},{"ref":"src/views.rs:144-160","code":"  144 |     pub fn downcaster_for<DbView: ?Sized + Any>(&self) -> &DatabaseDownCaster<DbView> {\n  145 |         let view_type_id = TypeId::of::<DbView>();\n  146 |         for (_, view) in self.view_casters.iter() {\n  147 |             if view.target_type_id == view_type_id {\n  148 |                 // SAFETY: We are unerasing the type erased function pointer having made sure the\n  149 |                 // TypeId matches.\n  150 |                 return unsafe {\n  151 |                     &*((view as *const ViewCaster).cast::<DatabaseDownCaster<DbView>>())\n  152 |                 };\n  153 |             }\n  154 |         }\n  155 | \n  156 |         panic!(\n  157 |             \"No downcaster registered for type `{}` in `Views`\",\n  158 |             std::any::type_name::<DbView>(),\n  159 |         );\n  160 |     }","lines":17,"link":"https://github.com/salsa-rs/salsa/blob/e021c01d4939408c89c9325ad2426660117a8b32/src/views.rs#L144-L160"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"`IngredientImpl::<C>::reset` in `src/interned.rs` (lines 804-811) is a `pub` method\nthat is never called. The `Ingredient` trait has a `reset_for_new_revision` hook but the\n`Ingredient` impl for `IngredientImpl<C>` does not override `requires_reset_for_new_revision`\nto return `true`, so the hook is never triggered. No other caller exists in the codebase.\nAdditionally, the implementation is incorrect: it clears `key_map` but not the `lru` linked list,\nleaving `UnsafeRef<Value<C>>` pointers in the LRU that refer to slots still tracked by the table -\nif anyone were to call `reset` and then trigger GC, the LRU would yield values whose `key_map`\nentries have been removed, causing `find_entry(...).expect(...)` on line 543 to panic.","fix":"Remove the method, or implement it correctly by also draining `shard.lru` and then hook it into the `Ingredient` trait via `requires_reset_for_new_revision`.","locations":[{"ref":"src/interned.rs:1007-1014","code":" 1007 |     pub fn reset(&mut self, zalsa_mut: &mut Zalsa) {\n 1008 |         _ = zalsa_mut;\n 1009 | \n 1010 |         for shard in self.shards.iter_mut() {\n 1011 |             // We can clear the key maps now that we have cancelled all other handles.\n 1012 |             shard.get_mut().key_map.clear();\n 1013 |         }\n 1014 |     }","lines":8,"link":"https://github.com/salsa-rs/salsa/blob/e021c01d4939408c89c9325ad2426660117a8b32/src/interned.rs#L1007-L1014"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"Inside the `Serialize` impl for `CycleHeads` (feature `persistence`), the loop `for e in self` iterates using `CycleHeadsIterator`, which already skips entries where `removed == true`. The explicit guard `if e.removed.load(Ordering::Relaxed) { continue; }` on line 370 can never be true and is therefore unreachable dead code.","fix":"Remove the `if e.removed ... { continue; }` block inside the serialize loop.","locations":[{"ref":"src/cycle.rs:373-376","code":"  373 |         for e in self {\n  374 |             if e.removed.load(Ordering::Relaxed) {\n  375 |                 continue;\n  376 |             }","lines":4,"link":"https://github.com/salsa-rs/salsa/blob/e021c01d4939408c89c9325ad2426660117a8b32/src/cycle.rs#L373-L376"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"In `src/tracing.rs`, the `info_span!` macro is defined (lines 35-39) with an\n`#[expect(unused_macros)]` attribute, indicating it is never used anywhere in the\ncodebase. It is exported via `pub(crate) use` at line 68. The macro exists but\nproduces no value to the codebase.","fix":"Either remove `info_span!` if it is truly not needed, or remove the `#[expect(unused_macros)]` suppress once it is actually used somewhere.","locations":[{"ref":"src/tracing.rs:43-47","code":"   43 | macro_rules! info_span {\n   44 |     ($($x:tt)*) => {\n   45 |         crate::tracing::span!(INFO, $($x)*)\n   46 |     };\n   47 | }","lines":5,"link":"https://github.com/salsa-rs/salsa/blob/e021c01d4939408c89c9325ad2426660117a8b32/src/tracing.rs#L43-L47"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"In `src/cancelled.rs` lines 5-9, the doc comment for the `Cancelled` enum has three\nempty bullet points:\n    /// *\n    /// *\n    /// *\nThe intended reasons for cancellation are never filled in, leaving users with an\nuninformative API doc.","fix":"Fill in the bullet points with the actual cancellation reasons, e.g.: local cancellation via CancellationToken, pending write to a new revision, and propagated panic from another thread.","locations":[{"ref":"src/cancelled.rs:5-9","code":"    5 | ///\n    6 | /// This can occur for a few reasons:\n    7 | /// *\n    8 | /// *\n    9 | /// *","lines":5,"link":"https://github.com/salsa-rs/salsa/blob/e021c01d4939408c89c9325ad2426660117a8b32/src/cancelled.rs#L5-L9"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"In `src/function/execute.rs` line 512, the doc comment for `collect_all_cycle_heads` says\n\"It doesn't know that it's part of the outer cycle `X`.\" but `X` is NOT the outer cycle in the\nexample - `E` is (the example shows `E -> C -> D -> E (cycle)`). The sentence should read\n\"It doesn't know that it's part of the outer cycle `E`.\"\nAdditionally, line 516 ends with an unclosed backtick: the string \"`[B, C, D, E]\" is missing the\nclosing backtick, leaving the doc comment malformed.","fix":"Change 'outer cycle `X`' to 'outer cycle `E`' on line 512. Add the missing closing backtick on line 516: \"`[B, C, D, E]`\".","locations":[{"ref":"src/function/execute.rs:628-632","code":"  628 | /// Note how `X` only depends on `A`. It doesn't know that it's part of the outer cycle `X`.\n  629 | /// An old implementation resolved the cycle heads 1-level deep but that's not enough, because\n  630 | /// `X` then completes with `[B, C, D]` as it's heads. But `B`, `C`, and `D` are no longer on the stack\n  631 | /// when `X` completes (which is the real outermost cycle). That's why we need to resolve all cycle heads\n  632 | /// recursively, so that `X` completes with `[B, C, D, E]","lines":5,"link":"https://github.com/salsa-rs/salsa/blob/e021c01d4939408c89c9325ad2426660117a8b32/src/function/execute.rs#L628-L632"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The comment on lines 99-104 (and duplicated verbatim on lines 158-163) inside `try_claim` and `peek_claim` says 'NB: Ordering::Relaxed is sufficient here ...' and goes on to explain atomic memory-order semantics. The field being set (`anyone_waiting`) is a plain `bool` inside a `Mutex`-protected `FxHashMap`, not an atomic. Atomic ordering is irrelevant here. The comment appears to have been copied from an earlier version of the code where the field was atomic.","fix":"Remove or replace the comment with one that simply explains why setting `anyone_waiting = true` under the mutex is sufficient to coordinate with `ClaimGuard::release`.","locations":[{"ref":"src/function/sync.rs:140-145","code":"  140 |                 // NB: `Ordering::Relaxed` is sufficient here,\n  141 |                 // as there are no loads that are \"gated\" on this\n  142 |                 // value. Everything that is written is also protected\n  143 |                 // by a lock that must be acquired. The role of this\n  144 |                 // boolean is to decide *whether* to acquire the lock,\n  145 |                 // not to gate future atomic reads.","lines":6,"link":"https://github.com/salsa-rs/salsa/blob/e021c01d4939408c89c9325ad2426660117a8b32/src/function/sync.rs#L140-L145"},{"ref":"src/function/sync.rs:140-145","code":"  140 |                 // NB: `Ordering::Relaxed` is sufficient here,\n  141 |                 // as there are no loads that are \"gated\" on this\n  142 |                 // value. Everything that is written is also protected\n  143 |                 // by a lock that must be acquired. The role of this\n  144 |                 // boolean is to decide *whether* to acquire the lock,\n  145 |                 // not to gate future atomic reads.","lines":6,"link":"https://github.com/salsa-rs/salsa/blob/e021c01d4939408c89c9325ad2426660117a8b32/src/function/sync.rs#L140-L145"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"In `ClaimGuard::transfer`, the `panic!` message on line 411 reads `\"new owner to be a locked query\"`, which is a grammatically incomplete sentence. The intended meaning is clearly `\"expected new owner to be a locked query\"`.","fix":"Change to `panic!(\"expected new owner to be a locked query\")`.","locations":[{"ref":"src/function/sync.rs:476","code":"  476 |             panic!(\"new owner to be a locked query\")","lines":1,"link":"https://github.com/salsa-rs/salsa/blob/e021c01d4939408c89c9325ad2426660117a8b32/src/function/sync.rs#L476"}]},
{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The comment in `src/hash.rs` lines 12-13 states that `TypeId` is a \"128-bit hash\ninternally, and it's `Hash` implementation writes the lower 64-bits.\" Both claims are\nimplementation details of the Rust standard library that are not guaranteed by any\npublic contract. The internal representation and hash behavior of `TypeId` could\nchange across Rust versions. If `TypeId::Hash` ever switches to calling `write`\n(byte slice) or `write_u128`, the `unreachable!()` on line 19 would panic at runtime.","fix":"Either remove the inaccurate comment about internals, or add a defensive implementation for `write` and `write_u128` that falls back to re-hashing, to avoid a hard runtime panic if the TypeId hashing changes.","locations":[{"ref":"src/hash.rs:12-19","code":"   12 | // `TypeId` is a 128-bit hash internally, and it's `Hash` implementation\n   13 | // writes the lower 64-bits. Hashing it again would be unnecessary.\n   14 | #[derive(Default)]\n   15 | pub(crate) struct TypeIdHasher(u64);\n   16 | \n   17 | impl Hasher for TypeIdHasher {\n   18 |     fn write(&mut self, _: &[u8]) {\n   19 |         unreachable!(\"`TypeId` calls `write_u64`\");","lines":8,"link":"https://github.com/salsa-rs/salsa/blob/e021c01d4939408c89c9325ad2426660117a8b32/src/hash.rs#L12-L19"}]},
{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"In the persistence `impl serde::Serialize for Value<C>` in `src/interned.rs`, line 1535,\nthe struct name passed to `serializer.serialize_struct` is `\"Value,\"` (with a trailing\ncomma) instead of `\"Value\"`. The corresponding `DeserializeValue` struct at line 1677 is\nannotated `#[serde(rename = \"Value\")]`. Self-describing serde formats that verify struct\nnames (e.g. RON, some custom JSON visitors) will fail to round-trip because the serialized\nname and the expected deserialized name differ. Binary formats (bincode) ignore the name, so\nthis is currently latent in most practical uses.","fix":"Change `\"Value,\"` to `\"Value\"` to match the rename attribute on `DeserializeValue`.","locations":[{"ref":"src/interned.rs:1807","code":" 1807 |             let mut value = serializer.serialize_struct(\"Value,\", 3)?;","lines":1,"link":"https://github.com/salsa-rs/salsa/blob/e021c01d4939408c89c9325ad2426660117a8b32/src/interned.rs#L1807"}]},
{"id":"CMT_7","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"Two `tracing::trace!` log strings contain an opening parenthesis that is never closed:\n- Line 171: `\"unblock_runtimes_blocked_on_transferred_queries_owned_by({database_key:?}\"`\n- Line 412: `\"update_transferred_edges({query:?}\"`\nBoth strings are missing the closing `)` that should terminate the function-call-style\nformat. The log output will be visually malformed.","fix":"Add the missing `)` to both format strings: `\"unblock_runtimes_blocked_on_transferred_queries_owned_by({database_key:?})\"` and `\"update_transferred_edges({query:?})\"`.","locations":[{"ref":"src/runtime/dependency_graph.rs:171","code":"  171 |             \"unblock_runtimes_blocked_on_transferred_queries_owned_by({database_key:?}\"","lines":1,"link":"https://github.com/salsa-rs/salsa/blob/e021c01d4939408c89c9325ad2426660117a8b32/src/runtime/dependency_graph.rs#L171"},{"ref":"src/runtime/dependency_graph.rs:412","code":"  412 |             tracing::trace!(\"update_transferred_edges({query:?}\");","lines":1,"link":"https://github.com/salsa-rs/salsa/blob/e021c01d4939408c89c9325ad2426660117a8b32/src/runtime/dependency_graph.rs#L412"}]},

{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"The `Occupied`+`Thread` branch inside `try_claim` (lines 97-113) and the identical branch inside `peek_claim` (lines 156-172) are byte-for-byte duplicates: both lock the entry, destructure `anyone_waiting`, set it to `true`, and call `zalsa.runtime().block(...)` with identical arms. That is ~17 lines of near-identical logic in two places. The same structural duplication appears between `try_claim_transferred` and `peek_claim_transferred`, which share the `ImTheOwner+Deny` and `OwnedBy` arms (roughly 10 more lines). Total duplicated logic exceeds 25 lines across the two method pairs.","fix":"Extract the block-on-occupied-thread logic into a private helper that takes the `OccupiedEntry`, the `SyncGuard`, and the `Zalsa` reference, returning a `ClaimResult<()>` or `BlockResult`. Both `try_claim` and `peek_claim` can then call this helper and handle only the `Vacant` arm separately.","locations":[{"ref":"src/function/sync.rs:138-154","code":"  138 |                 let SyncState { anyone_waiting, .. } = occupied_entry.into_mut();\n  139 | \n  140 |                 // NB: `Ordering::Relaxed` is sufficient here,\n  141 |                 // as there are no loads that are \"gated\" on this\n  142 |                 // value. Everything that is written is also protected\n  143 |                 // by a lock that must be acquired. The role of this\n  144 |                 // boolean is to decide *whether* to acquire the lock,\n  145 |                 // not to gate future atomic reads.\n  146 |                 *anyone_waiting = true;\n  147 |                 match zalsa.runtime().block(\n  148 |                     DatabaseKeyIndex::new(self.ingredient, key_index),\n  149 |                     id,\n  150 |                     write,\n  151 |                 ) {\n  152 |                     BlockResult::Running(blocked_on) => ClaimResult::Running(blocked_on)
