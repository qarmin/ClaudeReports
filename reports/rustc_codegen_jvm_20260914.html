{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`RuntimeSupport.unixEpochMillis` silently clamps any negative result from `System.currentTimeMillis()` to `0`. `System.currentTimeMillis()` is documented to return milliseconds since the epoch and can be negative for dates before 1970-01-01 (some JVMs/host clocks do produce this for misconfigured system clocks or explicit clock manipulation). Clamping to `0` instead of propagating the real (negative) value silently corrupts the reported wall-clock time instead of surfacing the actual value to Rust's `SystemTime` machinery, which is fully capable of representing pre-epoch times.","fix":"Return the raw value instead of clamping it:\n\n```java\n// before\npublic static long unixEpochMillis() {\n    return Math.max(0L, System.currentTimeMillis());\n}\n\n// after\npublic static long unixEpochMillis() {\n    return System.currentTimeMillis();\n}\n```","locations":[{"ref":"runtime/src/RuntimeSupport.java:204-206","code":"  204 |     public static long unixEpochMillis() {\n  205 |         return Math.max(0L, System.currentTimeMillis());\n  206 |     }","lines":3,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/runtime/src/RuntimeSupport.java#L204-L206"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`scalar_int_to_oomir_constant` (`src/lower1/operand/const_eval.rs:2897-2971`) has a `TyKind::Str => oomir::Constant::Str(scalar_int.to_u64().to_string())` arm at line 2961. `str` is unsized and can never actually be backed by a `ScalarInt` in valid MIR (string constants always arrive as `ConstValue::Slice`/`ConstValue::Indirect` and are handled by `read_slice_constant`/`read_string_from_allocation` elsewhere), so this arm is unreachable in practice - but if it is ever hit (e.g. because of a future `rustc` change or an unforeseen `TyKind::Pat`-wrapped case reaching this function), it silently manufactures a bogus `oomir::Constant::Str` containing the decimal text of the scalar's raw bits (e.g. `\"12345\"`) instead of surfacing an error, masking what would otherwise be a loud, diagnosable bug with quietly-wrong string data baked into the compiled program.","fix":"Drop the `TyKind::Str` arm and let it fall through to the existing catch-all error case, matching how every other genuinely-unreachable-but-defensive branch in this function is handled. Change:\n```\n        TyKind::Str => oomir::Constant::Str(scalar_int.to_u64().to_string()),\n        TyKind::RawPtr(..) | TyKind::Ref(..) => {\n```\nto:\n```\n        TyKind::RawPtr(..) | TyKind::Ref(..) => {\n```\nso a scalar `str` constant now falls into `_ => return Err(format!(\"Unsupported type for ScalarInt conversion: {ty:?}\"))` at the bottom of the match instead of producing fabricated data.","locations":[{"ref":"src/lower1/operand/const_eval.rs:2907","code":" 2907 |         TyKind::Str => oomir::Constant::Str(scalar_int.to_u64().to_string()),","lines":1,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/src/lower1/operand/const_eval.rs#L2907"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`FunctionTranslator::store_result` (`src/lower2/translator.rs:2744-2751`) handles zero-sized-value types (`!ty.has_jvm_value()`) by inserting `(dest_var, ty)` into `self.typed_local_var_map` with the value `self.next_local_index` - the *current* value of the not-yet-incremented next-slot counter - rather than a slot actually reserved for that variable. The identical pattern is repeated for `OI::GetField` on a zero-sized field type at `5327-5331`. Because `self.next_local_index` is exactly the slot the *next* real `assign_local`/`get_or_assign_local` call will hand out, this phantom mapping can end up numerically equal to a genuinely-assigned slot for an unrelated variable created shortly afterward. When `debug_info.local_variables` is enabled, `debug_variable_local` (`1401-1417`) can resolve this phantom slot for a debug variable whose type has no JVM value, and the later `LocalVariableTable` construction (`1748-1841`) checks `is_materialized` by scanning for *any* instruction that reads/writes that slot number (`optimise2::instruction_uses_local`) - which can spuriously match the unrelated real variable that now occupies the same numeric slot, producing an incorrect `LocalVariableTable` entry (wrong name bound to another variable's slot/PC range) in the generated class file's debug info.","fix":"Use a sentinel that can never collide with a real slot (e.g. `u16::MAX`, or a dedicated `Option<u16>` \"no JVM slot\" representation for zero-sized locals) instead of reusing the live `next_local_index` counter, and make `debug_variable_local`/the `LocalVariableTable` builder explicitly skip entries whose recorded slot is that sentinel rather than relying on the coincidental non-collision of the current counter value.","locations":[{"ref":"src/lower2/translator.rs:2749-2756","code":" 2749 |     fn store_result(&mut self, dest_var: &str, ty: &oomir::Type) -> {"id":"PERF_3","type":"performance","type_label":"Performance","severity":"medium","difficulty":"easy","description":"`PanicSupport.foreignFailureMessage` and `PanicSupport.foreignFailureMessageLength`\n(`runtime/src/PanicSupport.java:69-76`) each independently call `describe(caughtThrowable(...))`,\nwhich runs `failure.printStackTrace(new PrintWriter(trace))` and re-encodes the whole stack trace\nto UTF-8. Callers are expected to call the length method first (to size a buffer) and then the\nmessage method (to fill it) — the same pattern used for `lastErrorMessageLength`/\n`copyLastErrorMessage` and `hostnameLength`/`copyHostname` in `NetworkSupport.java`, which cache the\ncomputed value in a `ThreadLocal` between the two calls. Here, no such caching exists, so the full\nstack-trace formatting work is done twice for what is conceptually a single \"describe this\nthrowable\" operation.","fix":"Cache the last `describe(...)` result (and/or its UTF-8 bytes) in a `ThreadLocal`, populated by whichever of the two methods runs first, mirroring the `LAST_ERROR`/`LAST_HOSTNAME` pattern in `NetworkSupport.java`.","locations":[{"ref":"runtime/src/PanicSupport.java:77-84","code":"   77 |     public static Pointer foreignFailureMessage(Pointer caughtException) {\n   78 |         byte[] message = describe(caughtThrowable(caughtException)).getBytes(StandardCharsets.UTF_8);\n   79 |         return Pointer.array(message, 0, 1);\n   80 |     }\n   81 | \n   82 |     public static long foreignFailureMessageLength(Pointer caughtException) {\n   83 |         return describe(caughtThrowable(caughtException)).getBytes(StandardCharsets.UTF_8).length;\n   84 |     }","lines":8,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/runtime/src/PanicSupport.java#L77-L84"},{"ref":"runtime/src/PanicSupport.java:102-106","code":"  102 |     private static String describe(Throwable failure) {\n  103 |         StringWriter trace = new StringWriter( {"id":"PERF_4","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`Pointer.align_offset(long alignment)` (`runtime/src/Pointer.java:7061-7073`) computes the result with a brute-force loop that tries up to `alignment` candidate offsets:\n```java\nlong attempts = viewSize == 0 ? 1 : alignment;\nfor (long elements = 0; elements < attempts; elements++) {\n    if ((current + (long) elements * viewSize) % alignment == 0) {\n        return elements;\n    }\n}\nreturn -1;\n```\nSince `alignment` must be a power of two but can legitimately be large (page-size alignments such as 4096/65536, or large `#[repr(align(N))]` types), this is `O(alignment)` instead of the `O(1)` closed-form solution real Rust uses. For a caller passing an alignment like `1 << 24` or larger, this turns a single pointer query into tens of millions of iterations, effectively hanging the calling thread.","fix":"Replace the loop with a closed-form computation using modular arithmetic: since `alignment` is a power of two, `align_offset` can be solved by computing the offset via the modular inverse of `viewSize` mod `alignment` restricted to the odd part of `viewSize` (or by returning `-1` early when `gcd(viewSize, alignment)` does not divide `-current mod alignment`), matching the algorithm `core::ptr::align_offset` uses in the Rust standard library, which runs in `O(1)`/`O(log alignment)`.","locations":[{"ref":"runtime/src/Pointer.java:7313-7325","code":" 7313 |     public long align_offset(long alignment) {\n 7314 |         if (alignment <= 0 || (alignment & (alignment - 1)) != 0) {\n 7315 |             throw new IllegalArgumentException(\"Rust pointer alignment must be a power of two\");\n 7316 |         }\n 7317 |         long current = numericAddress();\n 7318 |         long attempts = viewSize == 0 ? 1 : alignment;\n 7319 |         for (long elements = 0; elements < attempts; elements++) {\n 7320 |             if ((current + (long) elements * view {"id":"PERF_5","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`RuntimeSupport.copyFromPointer` (lines 256-263) and `RuntimeSupport.copyBytes` (lines 265-276), along with `readStdin` (lines 219-238), copy buffers one byte at a time through the generic `Pointer` API: each iteration calls `source.add(index).getI8()` or `destination.add(index).set(Byte.valueOf(...))`. This means every byte of every `writeStdout`/`writeStderr`/`readStdin`/argument/environment copy pays for a virtual dispatch through `Pointer.add`, a get/set call, and (on the write side) `Byte` autoboxing. For large I/O buffers (e.g. large stdout writes or reading big files via `CStr`/stdin) this multiplies the cost of what should be a single bulk `System.arraycopy`-style operation by the buffer length.","fix":"Add a bulk byte-array read/write entry point to `Pointer` (e.g. `Pointer.readBytes(Pointer, int, byte[])`/`Pointer.writeBytes(Pointer, byte[], int)`) that copies directly against the underlying backing array (with a fallback loop only for pointer views that are not backed by a plain `byte[]`), and have `copyFromPointer`/`copyBytes`/`readStdin` call that instead of looping index-by-index with boxed `Byte` values.","locations":[{"ref":"runtime/src/RuntimeSupport.java:219-238","code":"  219 |     public static long readStdin(Pointer destination, long length) {\n  220 |         int checkedLength = Math.toIntExact(length);\n  221 |         if (checkedLength == 0) {\n  222 |             return 0;\n  223 |         }\n  224 |         byte[] copy = new byte[checkedLength];\n  225 |         final int read;\n  226 |         try {\n  227 |             read = System.in.read(copy);\n  228 |         } catch (IOException error) {\n  229 |             return -1;\n  230 |         }\n  231 |         if (read < 0) {\n  232 |             return 0;\n  233 |         }\n  234 |         for (int index = 0; index < read; index++) {\n  235 |             destination.ad {"id":"PERF_6","type":"performance","type_label":"Performance","severity":"medium","difficulty":"hard","description":"`mono_owner_class` (`src/lower1/naming.rs:47-74`) routes every \"external runtime generic\" instance (any non-local, monomorphization-requiring `core`/`alloc`/`std` instance when compiling against precompiled core, per `is_external_runtime_generic`) into one of only 16 owner classes: `bucket = super::types::short_hash(&instance_key, 1)` (line 56) produces a single hex digit, so the resulting class name is one of `MonoBucket_0` .. `MonoBucket_f`. Every generic function from `core`/`alloc`/`std` that gets monomorphized anywhere in a large program (which can easily be in the thousands for a program that uses generic collections, iterators, formatting, etc.) is hashed into one of these 16 classes. This risks producing pathologically large `.class` files (JVM per-class method-count and constant-pool limits are a hard ceiling) as program size grows, with no configurability or fallback to further split an overloaded bucket.","fix":"Either widen the bucket hash (e.g. 2-3 hex digits) so class size is bounded more predictably as program size grows, or make the bucket count adaptive (e.g. derived from a rough count of expected instances, or split further once a shard is observed to be over some method-count threshold during emission) rather than a hardcoded single hex digit.","locations":[{"ref":"src/lower1/naming.rs:158-185","code":"  158 | pub fn mono_owner_class<'tcx>(tcx: TyCtxt<'tcx>, instance: Instance<'tcx>) -> String {\n  159 |     let def_id = instance.def_id();\n  160 |     let external_runtime_generic = is_external_runtime_generic(tcx, instance);\n  161 |     if external_runtime_generic {\n  162 |         // Synthetic helpers can reference an instance without adding it to\n  163 |         // the current crate's mono-item set. Give every runtime instance one\n  164 |         // definition-crate owner so all downstream callers and exporters\n  165 | {"id":"PERF_7","type":"performance","type_label":"Performance","severity":"medium","difficulty":"hard","description":"`block_cost` (`src/lower2/large_methods.rs:1011-1025`) measures a basic block's \"cost\" purely as its OOMIR instruction count (minus a few metadata-only variants), and `MAX_CHUNK_COST` (`src/lower2/large_methods.rs:11`, value `900`) is the sole threshold used both to decide whether a function needs outlining at all (`src/lower2/large_methods.rs:65`) and how big each resulting chunk may be (`src/lower2/large_methods.rs:84-101`). This instruction count has no calibrated relationship to the actual emitted JVM bytecode byte size, which is the real quantity the JVM's 65536-byte method-size limit constrains. Instructions vary enormously in the number of bytecode bytes they expand to (e.g. `ConstructObject` with many fields, multi-argument `InvokeStatic`/`InvokeRustStatic`, or `ArrayFill` for a large aggregate can each emit dozens of bytecode instructions), so a chunk that is \"under budget\" by this 900-instruction heuristic can still legitimately expand to more than 64KB of real bytecode, with nothing downstream (see the sibling finding on missing size validation) to catch it.","fix":"Either weight `block_cost` per-instruction-kind by an estimate of its typical emitted bytecode length (e.g. give `ConstructObject`/`InvokeStatic`/`ArrayFill`/`Cast` a higher weight than `Add`/`Move`), or - more robustly - run this splitting pass after a real bytecode-length estimate is available and re-split/re-check chunks whose actual generated `Code` attribute exceeds the JVM limit, emitting a clear compiler error rather than an invalid class file if a single chunk still cannot be brought under the limit.","locations":[{"ref":"src/lower2/large_methods.rs:11","code":"   11 | const MAX_CHUNK_COST: usize = 900;","lines":1,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/src/lower2/large_methods.rs#L11"},{"ref":"src/low {"id":"PERF_8","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`TcpStream::read_vectored`/`write_vectored` (`std/overlay/std/src/sys/net/connection/jvm.rs:237-269`) implement scatter/gather I/O by creating a native `IoVector` handle (`create_io_vector`, line 830-832), issuing one `jvm_add_io_vector_buffer` FFI call per buffer (lines 242-246, 263-267), performing the actual `jvm_tcp_read_vectored`/`jvm_tcp_write_vectored` call, and then closing the vector via `IoVector`'s `Drop` (lines 181-185). For `N` buffers this is `N + 3` separate native calls per vectored I/O operation, instead of a single call that hands the JVM runtime an array of `(pointer, length)` pairs directly. For code paths that rely on vectored I/O for efficiency (e.g. `std::io::Write::write_fmt` buffering, TLS record batching, HTTP header assembly via `IoSlice`), this design defeats much of the benefit vectored I/O is meant to provide.","fix":"Consider replacing the incremental \"create vector, add buffer, add buffer, ...\" protocol with a single FFI call that takes a packed array describing all buffers at once (for example, an array of `{ptr: u64, len: u64}` structs allocated on the Rust side and passed as one `(*const u8, usize)` pair), so a vectored read/write costs a constant number of native calls regardless of buffer count.","locations":[{"ref":"std/overlay/std/src/sys/net/connection/jvm.rs:179-185","code":"  179 | struct IoVector(u64);\n  180 | \n  181 | impl Drop for IoVector {\n  182 |     fn drop(&mut self) {\n  183 |         unsafe { jvm_close_io_vector(self.0) };\n  184 |     }\n  185 | }","lines":7,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/std/overlay/std/src/sys/net/connection/jvm.rs#L179-L185"},{"ref":"std/overlay/std/src/sys/net/connection/jvm.rs:237-269","code":"  237 |     pub fn read_vectored(&self, buffers: &mut [IoSliceMut<'_>]) -> io::Result<usize> {\n  238 | {"id":"PERF_11","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`create_constant_factory` in `src/lower2.rs` special-cases `Constant::Array`, `Constant::Instance`, and `Constant::StaticCall` so that nested constants are only recursively wrapped in their own synthetic factory method when `constant_instruction_cost(...)` exceeds `MAX_INLINE_CONSTANT_INSTRUCTIONS` (see the `.map(|element| if constant_instruction_cost(element) > MAX_INLINE_CONSTANT_INSTRUCTIONS { create_constant_factory(...) } else { Ok(element.clone()) })` pattern). The `Constant::SliceRef { backing, .. }` and `Constant::InternedPointer { value, .. }` arms, however, unconditionally call `create_constant_factory(cp, owner_class, backing, ...)` / `create_constant_factory(cp, owner_class, value, ...)` with no cost check at all. This means every `SliceRef`/`InternedPointer` that itself needed factoring also forces its `backing`/`value` into its own separate synthetic static method and an extra `invokestatic` indirection, even when that inner constant is trivially small (e.g. a two-element backing array), unlike the sibling `Array`/`Instance`/`StaticCall` handling.","fix":"Gate the recursive calls the same way the `Instance`/`StaticCall` arms already do, e.g.:\n\n```rust\noomir::Constant::SliceRef { backing, element_type, offset, length } => oomir::Constant::SliceRef {\n    backing: if constant_instruction_cost(backing) > MAX_INLINE_CONSTANT_INSTRUCTIONS {\n        Box::new(create_constant_factory(cp, owner_class, backing, methods, next_factory)?)\n    } else {\n        backing.clone()\n    },\n    element_type: element_type.clone(),\n    offset: *offset,\n    length: *length,\n},\n```\n\nand similarly for `InternedPointer.value`.","locations":[{"ref":"src/lower2.rs:393-409","code":"  393 |         oomir::Constant::SliceRef {\n  394 |             backing,\n  395 |             element_type,\n  396 |             offset,\n  397 |             length,\n  398 | {"id":"PERF_12","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`get_float_const_instr` in `src/lower2/consts.rs` always emits `Instruction::Ldc_w(index)` for non-immediate float constants, even when `index` fits in a `u8`. Every other constant loader in the same file (`get_int_const_instr`, and the `OC::Str`/`OC::String` cases in `load_constant`) checks `u8::try_from(index)` first and emits the 2-byte `Ldc` form when possible, only falling back to the 3-byte `Ldc_w` form when the index doesn't fit. Skipping that check for floats means every non-trivial `f32` constant (any value other than `0.0`, `1.0`, `2.0`) costs one extra bytecode byte compared to what the JVM format allows, for no reason.","fix":"Mirror the pattern already used by `get_int_const_instr`:\n\n```rust\nlet index = cp.add_float(val).expect(\"Failed to add float to constant pool\");\nif let Ok(idx8) = u8::try_from(index) {\n    Instruction::Ldc(idx8)\n} else {\n    Instruction::Ldc_w(index)\n}\n```","locations":[{"ref":"src/lower2/consts.rs:79-95","code":"   79 | // Helper to get the appropriate float constant loading instruction\n   80 | pub fn get_float_const_instr(cp: &mut InternedConstantPool, val: f32) -> Instruction {\n   81 |     if val.to_bits() == 0.0f32.to_bits() {\n   82 |         Instruction::Fconst_0\n   83 |     } else if val == 1.0 {\n   84 |         Instruction::Fconst_1\n   85 |     } else if val == 2.0 {\n   86 |         Instruction::Fconst_2\n   87 |     } else {\n   88 |         // Add the float value to the constant pool.\n   89 |         let index = cp\n   90 |             .add_float(val)\n   91 |             .expect(\"Failed to add float to constant pool\");\n   92 |         // Ldc2_w is used for long/double constants and always takes a u16 index.\n   93 |         Instruction::Ldc_w(index)\n   94 |     }\n   95 | }","lines":17,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9 {"id":"PERF_13","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`compact_stack_frame` (`src/lower2/stackmaps.rs:326-378`) only ever emits the \"extended\" `StackMapTable` frame kinds - `SameFrameExtended` (tag 251), `SameLocals1StackItemFrameExtended` (tag 247), and `FullFrame` (tag 255) - each of which encodes an explicit 2-byte `offset_delta`. The JVM spec's compact `SameFrame` (tags 0-63, where the tag itself *is* the offset delta) and `SameLocals1StackItemFrame` (tags 64-127, `tag - 64` is the offset delta) forms, which need zero extra bytes for the delta, are never produced even when `offset_delta < 64` (or `< 64` for the one-stack-item case). Every generated class file's `StackMapTable` attribute is therefore a few bytes larger than necessary per frame, which adds up for methods with many basic blocks (exactly the large, block-heavy methods this codegen backend tends to produce).","fix":"When `locals == previous_locals` and `stack.is_empty()` and `offset_delta <= 63`, emit `StackFrame::SameFrame { frame_type: offset_delta as u8 }` instead of `SameFrameExtended`; similarly when `stack.len() == 1` and `offset_delta <= 63`, emit `StackFrame::SameLocals1StackItemFrame { frame_type: 64 + offset_delta as u8, stack }` instead of the extended variant. Fall back to the existing extended forms only when `offset_delta > 63`.","locations":[{"ref":"src/lower2/stackmaps.rs:328-352","code":"  328 | fn compact_stack_frame(\n  329 |     offset_delta: u16,\n  330 |     previous_locals: &[VerificationType],\n  331 |     locals: &[VerificationType],\n  332 |     stack: Vec<VerificationType>,\n  333 | ) -> StackFrame {\n  334 |     if locals == previous_locals {\n  335 |         return match stack.len() {\n  336 |             0 => StackFrame::SameFrameExtended {\n  337 |                 frame_type: 251,\n  338 |                 offset_delta,\n  339 |             },\n  340 |             1 => StackFrame::SameLocals1StackItemFrameExtended {\n  341 |                 frame_type: 247,\n  342 |                 offset_delta,\n  343 |                 stack,\n  344 |             },\n  345 |             _ => StackFrame::FullFrame {\n  346 |                 frame_type: 255,\n  347 |                 offset_delta,\n  348 |                 locals: locals.to_vec(),\n  349 |                 stack,\n  350 |             },\n  351 |         };\n  352 |     }","lines":25,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/src/lower2/stackmaps.rs#L328-L352"}]},
{"id":"PERF_14","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`direct_cell_projections` (`src/lower2/translator.rs:6747-6857`), `direct_field_projections` (`6938-7136`), and their shared \"invalidate on redefinition/invalid-use\" cleanup loops each run a `loop { ... if !changed/!removed { break; } }` fixed-point iteration over *all* basic blocks and *all* instructions. Inside the innermost loop of the cleanup passes (e.g. `6836-6851` and `7113-7130`), `let names = projections.keys().cloned().collect::<Vec<_>>();` re-allocates and clones the *entire* current projection key set for *every single instruction* of *every* block, on *every* outer iteration - i.e. this allocation happens `O(blocks * instructions_per_block)` times per fixed-point pass, and the whole thing repeats until no more projections are removed. For functions with many candidate pointer projections and many instructions, this is quadratic-ish redundant work and allocation churn purely for what is effectively a straightforward per-name liveness/validity check.","fix":"Hoist the `projections.keys().cloned().collect::<Vec<_>>()` snapshot outside the per-instruction loop (it only needs to be taken once per outer pass, since keys are only removed, never added, inside that inner loop), or restructure as a proper worklist algorithm that tracks, per projection name, the set of instructions that mention it, so invalidation is checked once per (name, instruction) pair, not re-scanned across the whole function on every fixed-point round.","locations":[{"ref":"src/lower2/translator.rs:6902-6923","code":" 6902 |     loop {\n 6903 |         let mut removed = false;\n 6904 |         for block in function.body.basic_blocks.values() {\n 6905 |             for instruction in &block.instructions {\n 6906 |                 let names = projections.keys().cloned().collect::<Vec<_>>();\n 6907 |                 for name in names {\n 6908 |                     let redefined = instruction_destination(instruction) == Some(name.as_str())\n 6909 |                         && !is_direct_cell_definition(instruction, &name, &projections);\n 6910 |                     let invalid_use = instruction_uses_name(instruction, &name)\n 6911 |                         && !is_allowed_direct_cell_use(instruction, &name, &projections);\n 6912 |                     if redefined || invalid_use {\n 6913 |                         projections.remove(&name);\n 6914 |                         removed = true;\n 6915 |                     }\n 6916 |                 }\n 6917 |             }\n 6918 |         }\n 6919 |         if !removed {\n 6920 |             break;\n 6921 |         }\n 6922 |     }\n 6923 |     projections","lines":22,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/src/lower2/translator.rs#L6902-L6923"},{"ref":"src/lower2/translator.rs:7179-7202","code":" 7179 |     loop {\n 7180 |         let mut removed = false;\n 7181 |         for block in function.body.basic_blocks.values() {\n 7182 |             for instruction in &block.instructions {\n 7183 |                 let names = projections.keys().cloned().collect::<Vec<_>>();\n 7184 |                 for name in names {\n 7185 |                     let is_own_definition =\n 7186 |                         is_direct_field_definition(instruction, &name, &projections);\n 7187 |                     let redefined = instruction_destination(instruction) == Some(name.as_str())\n 7188 |                         && !is_own_definition;\n 7189 |                     let invalid_use = instruction_uses_name(instruction, &name)\n 7190 |                         && !is_allowed_direct_field_use(instruction, &name, &projections);\n 7191 |                     if redefined || invalid_use {\n 7192 |                         projections.remove(&name);\n 7193 |                         removed = true;\n 7194 |                     }\n 7195 |                 }\n 7196 | {"id":"PERF_15","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`Type::get_class_name` in `src/oomir.rs` (lines 1399-1417) unconditionally calls `breadcrumbs::log!(LogLevel::Info, \"class_name_fetching\", format!(\"Fetching class name for type: {:?}\", self))` on every invocation, eagerly building a `format!` string (including recursive `Debug` formatting for nested `Type`s such as `Array`/`Pointer`/`Reference`) regardless of whether that log level/target is even enabled. `get_class_name` is a small getter used throughout method-dispatch codegen, so this pays string-formatting cost on a likely hot path purely for logging that is probably filtered out in normal builds.","fix":"Remove the log call (it does not add diagnostic value over a debugger/trace at the call sites) or guard it so the `format!` is only evaluated when the log level is actually active:\n```rust\n// before\npub fn get_class_name(&self) -> Option<&str> {\n    breadcrumbs::log!(\n        LogLevel::Info,\n        \"class_name_fetching\",\n        format!(\"Fetching class name for type: {:?}\", self)\n    );\n    match self {\n\n// after\npub fn get_class_name(&self) -> Option<&str> {\n    match self {\n```","locations":[{"ref":"src/oomir.rs:1566-1584","code":" 1566 |     /// Gets the name of the class to call methods on, if applicable.\n 1567 |     pub fn get_class_name(&self) -> Option<&str> {\n 1568 |         breadcrumbs::log!(\n 1569 |             LogLevel::Info,\n 1570 |             \"class_name_fetching\",\n 1571 |             format!(\"Fetching class name for type: {:?}\", self)\n 1572 |         );\n 1573 |         match self {\n 1574 |             Type::Class(name) | Type::Interface(name) => Some(name),\n 1575 |             Type::Str => Some(UTF8_VIEW_CLASS),\n 1576 |             Type::Array(inner) | Type::MutableReference(inner) | Type::Reference(inner) => {\n 1577 |                 inner.get_class_name()\n 1578 |             }\n 1579 | {"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`MyBackend::join_codegen` wraps its entire body in `std::panic::catch_unwind(std::panic::AssertUnwindSafe(|| { ... })).expect(\"Could not join_codegen\")`. If the closure panics, `catch_unwind` correctly catches it and returns `Err(payload)`, but the very next call, `.expect(\"Could not join_codegen\")`, immediately turns that `Err` back into a panic. The net effect is identical to not calling `catch_unwind` at all (the panic still propagates out of `join_codegen`), except the panic's original location/backtrace context is now hidden behind a fresh panic raised from the `.expect` call site, and the boxed panic payload (`Box<dyn Any + Send>`) is not useful in the new message. This adds `catch_unwind`'s runtime overhead (landing-pad setup) for no functional benefit and makes debugging a `join_codegen` panic slightly harder rather than easier.","fix":"Either remove the `catch_unwind`/`expect` wrapper entirely and let the panic propagate naturally:\n\n```rust\nfn join_codegen(&self, ...) -> (...) {\n    let (generated_classes, _) = *ongoing_codegen\n        .downcast::<(Vec<(String, PathBuf)>, String)>()\n        .expect(\"in join_codegen: ongoing_codegen is not a generated-class list\");\n    // ... rest of body, no catch_unwind wrapper ...\n}\n```\n\nor, if the intent really was to convert a panic into a normal `Result`/diagnostic instead of re-panicking, change the `.expect(...)` to actually inspect and report the caught payload (e.g. downcast to `&str`/`String` and emit a proper compiler error) rather than re-raising it as a new panic.","locations":[{"ref":"src/lib.rs:1838-1898","code":" 1838 |         std::panic::catch_unwind(std::panic::AssertUnwindSafe(|| {\n 1839 |             let (generated_classes, _) = *ongoing_codegen\n 1840 |                 .downcast::<(Vec<(String, PathBuf)>, String)>()\n 1841 |                 .expect(\"in join_codegen: ongoing_codegen is not a generated-class list\");\n 1842 | \n 1843 |             let temporary_directories: HashSet<_> = generated_classes\n 1844 |                 .iter()\n 1845 |                 .filter_map(|(_, path)| path.parent().map(Path::to_path_buf))\n 1846 |                 .collect();\n 1847 | \n 1848 |             let mut compiled_modules = Vec::new();\n 1849 |             if !generated_classes.is_empty() {\n 1850 |                 let cgu_name = \"jvm_class_bundle\".to_string();\n 1851 |                 let file_path = outputs.temp_path_ext_for_cgu(\"jvmbundle\", &cgu_name);\n 1852 |                 if let Some(parent) = file_path.parent() {\n 1853 |                     std::fs::create_dir_all(parent).unwrap_or_else(|e| {\n 1854 |                         panic!(\n 1855 |                             \"Could not create class output directory {}: {}\",\n 1856 |                             parent.display(),\n 1857 |                             e\n 1858 |                         )\n 1859 |                     });\n 1860 |                 }\n 1861 | \n 1862 |                 combine_class_bundles(&file_path, &generated_classes).unwrap_or_else(|e| {\n 1863 |                     panic!(\n 1864 |                         \"Could not write generated class bundle {}: {}\",\n 1865 |                         file_path.display(),\n 1866 |                         e\n 1867 |                     )\n 1868 |                 });\n 1869 |                 compiled_modules.push(CompiledModule {\n 1870 |                     name: cgu_name,\n 1871 |                     kind: ModuleKind::Regular,\n 1872 |                     object: Some(file_path),\n 1873 |                     global_asm_object: None,\n 1874 |                     bytecode: None,\n 1875 |                     dwarf_object: None,\n 1876 |                     llvm_ir: None,\n 1877 |                     links_from_incr_cache: Vec::new(),\n 1878 |                     assembly: None,\n 1879 |                 });\n 1880 |             }\n 1881 |             for temporary_directory in temporary_directories {\n 1882 |                 std::fs::remove_dir_all(&temporary_directory).unwrap_or_else(|error| {\n 1883 |                     panic!(\n 1884 |                         \"Could not remove temporary class directory {}: {}\",\n 1885 |                         temporary_directory.display(),\n 1886 |                         error\n 1887 |                     )\n 1888 |                 });\n 1889 |             }\n 1890 | \n 1891 |             let compiled_modules = CompiledModules {\n 1892 |                 modules: compiled_modules,\n 1893 |                 allocator_module: None,\n 1894 |             };\n 1895 |             (compiled_modules, UnordMap::default())\n 1896 |         }))\n 1897 |         .expect(\"Could not join_codegen\")\n 1898 |     }","lines":61,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/src/lib.rs#L1838-L1898"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"In the `TerminatorKind::Assert` handling, `panic_message` is unconditionally built with `format!(...)` for every `AssertKind` variant (`src/lower1/control_flow.rs:7487-7532`), including two stale `// TODO` comments on lines `7489` and `7493` about improving the message. But the later `panic` match (`src/lower1/control_flow.rs:7547-7590`) resolves `BoundsCheck`, `Overflow`, `OverflowNeg`, `DivisionByZero`, and `RemainderByZero` (i.e. every branch that isn't already `None`) to `Some((lang_item, args))`, and `panic_message` is only read in the `else` branch that runs when `panic` is `None` (`src/lower1/control_flow.rs:7603-7607`). Since `BoundsCheck`/`Overflow`/`OverflowNeg`/`DivisionByZero`/`RemainderByZero` - the most common runtime checks Rust code generates (every array index and every checked arithmetic op) - always take the `Some(...)` path, the `format!` result computed for them at lines `7488-7495` is always discarded. The `TODO`s are effectively dead: improving that message can never have any observable effect for those variants.","fix":"Only compute `panic_message` for the `AssertKind` variants that actually reach the `else` branch (`ResumedAfterReturn`, `ResumedAfterPanic`, `MisalignedPointerDereference`, `NullPointerDereference`, `NullReferenceConstructed`, `ResumedAfterDrop`, `InvalidEnumConstruction`), e.g. by merging the two `match &**msg` blocks into one that returns either a lang-item panic or a fallback message, so the `BoundsCheck`/`Overflow` arms stop building a `String` that is thrown away, and drop or resolve the stale `TODO` comments.","locations":[{"ref":"src/lower1/control_flow.rs:7800-7845","code":" 7800 |                 let panic_message = match &**msg {\n 7801 |                     rustc_middle::mir::AssertKind::BoundsCheck { len, index } => {\n 7802 |                         // TODO: More sophisticated message generation using len ng()\n 7835 |                     }\n 7836 |                     rustc_middle::mir::AssertKind::NullReferenceConstructed => {\n 7837 |                         \"NullReferenceConstructed\".to_string()\n 7838 |                     }\n 7839 |                     rustc_middle::mir::AssertKind::ResumedAfterDrop(_) => {\n 7840 |                         \"ResumedAfterDrop\".to_string()\n 7841 |                     }\n 7842 |                     rustc_middle::mir::AssertKind::InvalidEnumConstruction(_) => {\n 7843 |                         \"InvalidEnumConstruction\".to_string()\n 7844 |                     }\n 7845 |                 };","lines":46,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/src/lower1/control_flow.rs#L7800-L7845"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`emit_checked_arithmetic_oomir_instructions` in `src/lower1/control_flow/checked_ops.rs:4-59` computes `tmp_result` and `tmp_overflow` (lines 18-19, via `format!`) and returns them as part of its `(Vec<Instruction>, String, String, String)` tuple (line 58), but neither name is ever used to build an instruction inside the function - only `tmp_pair` is used as the `InvokeStatic` destination (lines 44-57). Both call sites discard these two return values with `_`: `src/lower1/control_flow/rvalue.rs:5491` (`let (checked_instructions, tmp_pair_var, _tmp_result_var, _tmp_overflow_var) = ...`) and `src/lower1/control_flow.rs:3001` (`let (generated, pair, _, _) = ...`). The two `format!` calls and the two extra `String`s in the return type are pure overhead that exists only to be thrown away, and the wide return-tuple signature obscures which value callers actually need.","fix":"Drop the unused `tmp_result`/`tmp_overflow` locals and shrink the return type to just `(Vec<Instruction>, String)`. For example, change:\n```\nlet tmp_pair = format!(\"{}_{}_chk_pair_{}\", dest_base_name, operation, unique_id);\nlet tmp_result = format!(\"{}_{}_chk_res_{}\", dest_base_name, operation, unique_id);\nlet tmp_overflow = format!(\"{}_{}_chk_ovf_{}\", dest_base_name, operation, unique_id);\n...\n(generated_instructions, tmp_pair, tmp_result, tmp_overflow)\n```\nto:\n```\nlet tmp_pair = format!(\"{}_{}_chk_pair_{}\", dest_base_name, operation, unique_id);\n...\n(generated_instructions, tmp_pair)\n```\nand update both call sites to destructure a 2-tuple instead of ignoring two trailing fields.","locations":[{"ref":"src/lower1/control_flow/checked_ops.rs:4-59","code":"    4 | pub fn emit_checked_arithmetic_oomir_instructions(\n    5 |     dest_base_name: &str,\n    6 |     op1: &Operand,\n    7 |     op2: &Operand,\n    8 |     op_ty: &Type,\n    9 |     operation: &str, {"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"In `FunctionTranslator::translate_comparison_op` (`src/lower2/translator.rs`), five match arms each start with a validation check that is a complete no-op:\n```rust\nif ![\"eq\", \"ne\", \"lt\", \"le\", \"gt\", \"ge\"].contains(&comp_op) { /* error */ }\n```\nat lines `3416` (`I8`/`I16`/`I32`/`Char`/`Boolean` case), `3429` (`I64`), `3443` (`F32`), `3464` (`F64`), and `3483` (`I128`/`U128` class case). The comment `/* error */` suggests the intent was to return an error for an unsupported `comp_op`, but the `if` body is empty, so nothing happens - the check has no effect at all. If `comp_op` is ever invalid (e.g. from a bug in a caller passing something other than `\"eq\"|\"ne\"|\"lt\"|\"le\"|\"gt\"|\"ge\"`), execution falls through to `branch_constructor = Box::new(move |offset| match comp_op { ... _ => unreachable!() })`, and the resulting `unreachable!()` panic (lines `3425`, `3439`, `3460`, `3479`, `3501`) is only triggered later, inside `materialize_boolean_from_branch`, with a much less informative panic message than a proper `jvm::Error::VerificationError` would have given.","fix":"Either delete the dead no-op checks (since `comp_op` is always one of the six valid strings by construction from `OI::Eq`/`Ne`/`Lt`/`Le`/`Gt`/`Ge` call sites) or make them actually return an error, e.g.:\n```rust\nif ![\"eq\", \"ne\", \"lt\", \"le\", \"gt\", \"ge\"].contains(&comp_op) {\n    return Err(jvm::Error::VerificationError {\n        context: format!(\"Function {}\", self.oomir_func.name),\n        message: format!(\"Unsupported comparison operator '{comp_op}'\"),\n    });\n}\n```","locations":[{"ref":"src/lower2/translator.rs:3421","code":" 3421 |                 if ![\"eq\", \"ne\", \"lt\", \"le\", \"gt\", \"ge\"].contains(&comp_op) { /* error */ }","lines":1,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/ {"id":"DUP_5","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"easy","description":"The runtime JAR version string `\"0.1.0\"` is duplicated as a magic literal in multiple independent places: `build.py`'s `Config.RUNTIME_VERSION`, the hardcoded `runtime-0.1.0.jar` path in `cargo-jvm/src/lib.rs`'s `Backend::discover`, plus `config.toml.template` and the test harness Python modules. Bumping the runtime version requires editing several unrelated files in lockstep; missing one silently breaks `Backend::validate` (which looks for the exact hardcoded filename) or the generated Cargo config.","fix":"Introduce a single source of truth for the runtime version (e.g. a version file or environment variable emitted by `build.py` and read by `cargo-jvm`), or drop the version suffix from the JAR filename entirely so the path does not need to encode it.","locations":[{"ref":"build.py:33","code":"   33 |     RUNTIME_VERSION = \"0.1.0\"","lines":1,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/build.py#L33"},{"ref":"cargo-jvm/src/lib.rs:69-72","code":"   69 |                 .join(\"runtime\")\n   70 |                 .join(\"build\")\n   71 |                 .join(\"libs\")\n   72 |                 .join(\"runtime-0.1.0.jar\"),","lines":4,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/cargo-jvm/src/lib.rs#L69-L72"}]},
{"id":"DUP_6","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"very_easy","description":"`PanicSupport.raise` manually re-implements the exact byte-by-byte pointer-to-array copy loop that\nalready exists as the package-private `RuntimeSupport.copyFromPointer(Pointer, long)` helper,\ninstead of calling it. Both loops do the identical `array[index] = pointer.add(index).getI8();`.","fix":"Before:\n```java\nbyte[] utf8 = new byte[(int) length];\nfor (int index = 0; index < utf8.length; index++) {\n    utf8[index] = message.add(index).getI8();\n}\nString detail = new String(utf8, StandardCharsets.UTF_8);\n```\nAfter:\n```java\nbyte[] utf8 = RuntimeSupport.copyFromPointer(message, length);\nString detail = new String(utf8, StandardCharsets.UTF_8);\n```\n(`RuntimeSupport.copyFromPointer` is package-private and already visible from `PanicSupport`, both being in `org.rustlang.runtime`.)","locations":[{"ref":"runtime/src/PanicSupport.java:36-47","code":"   36 |     public static void raise(Pointer message, long length) {\n   37 |         if (length < 0 || length > Integer.MAX_VALUE) {\n   38 |             throw new IllegalArgumentException(\"invalid Rust panic message length: \" + length);\n   39 |         }\n   40 | \n   41 |         byte[] utf8 = new byte[(int) length];\n   42 |         for (int index = 0; index < utf8.length; index++) {\n   43 |             utf8[index] = message.add(index).getI8();\n   44 |         }\n   45 |         String detail = new String(utf8, StandardCharsets.UTF_8);\n   46 |         raiseTracked(new RustPanic(detail.isEmpty() ? \"Rust panic\" : \"Rust panic: \" + detail));\n   47 |     }","lines":12,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/runtime/src/PanicSupport.java#L36-L47"}]},
{"id":"DUP_7","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"easy","description":"`closure_class_for_args` (`src/lower1/jvm_names.rs:85-116`) and `coroutine_class_for_args` (`src/lower1/jvm_names.rs:118-149`) are line-for-line identical apart from `args.as_closure()` vs `args.as_coroutine()`, the `\"Closure\"`/`\"Coroutine\"` prefix literal passed to `crate::stable_hash::readable_or_hashed_name`, and the log-line name. Both build `data_types`, collect `generic_tokens` from `parent_args()` via `readable_rust_generic_arg_name`/`sanitize_name_token`, compute an `identity` via `stable_instance_key`, and format the final `\"{crate_root}/{name}\"` string identically. Maintaining two ~32-line copies means any future fix to this name-generation logic (such as the ambiguous `\"_\"`-join collision described in the separate finding covering these same line ranges) has to be applied twice, and the two functions can silently drift out of sync.","fix":"Extract a single generic helper, e.g. `fn coroutine_or_closure_class_for_args<'tcx>(tcx, def_id, parent_args: impl Iterator<Item = GenericArg<'tcx>>, instance_context, prefix: &str) -> String`, and have `closure_class_for_args` call it with `args.as_closure().parent_args()` and `\"Closure\"`, and `coroutine_class_for_args` call it with `args.as_coroutine().parent_args()` and `\"Coroutine\"`.","locations":[{"ref":"src/lower1/jvm_names.rs:85-149","code":"   85 | pub fn closure_class_for_args<'tcx>(\n   86 |     tcx: TyCtxt<'tcx>,\n   87 |     def_id: DefId,\n   88 |     args: GenericArgsRef<'tcx>,\n   89 |     instance_context: Instance<'tcx>,\n   90 | ) -> String {\n   91 |     let base = disambiguated_def_path_token(tcx, def_id);\n   92 |     let mut data_types = rustc_hash::FxHashMap::default();\n   93 |     let generic_tokens = args\n   94 |         .as_closure()\n   95 |         .parent_args()\n   96 |         .iter()\n   97 |         .copied()\n   98 |         .filter_map(|arg| {\n   99 | {"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"high","difficulty":"hard","description":"In `outline_function` (`src/lower2/large_methods.rs:58-104`), when bin-packing strongly-connected components into chunks, a single component whose own cost already exceeds `MAX_CHUNK_COST` is pushed as its own isolated chunk with no further subdivision (`src/lower2/large_methods.rs:84-90`: `component_chunks.push(vec![component]); continue;`). Because components are computed by SCC (blocks that are mutually reachable, i.e. contain a cycle/loop), this means an oversized *single loop* (or any other cyclic subgraph) that alone exceeds the 900-instruction budget is emitted verbatim as one JVM method with no splitting at all - defeating the entire purpose of this file, which is to keep generated methods under the JVM's 65536-byte code-length limit. There is no downstream size check anywhere in the codebase (`grep -rn \"65536\\|Code too large\\|CodeTooLarge\"` over `src/` returns nothing), so such a method would only fail much later, either as a hard-to-diagnose bytecode-writer failure or a corrupt/invalid `.class` file, with no diagnostic pointing back to the oversized loop.","fix":"Either (a) detect this case explicitly and return a clear `jvm::Error::VerificationError` (via the existing `verification_error` helper) naming the offending function so users get an actionable compiler diagnostic instead of a corrupt class file, or (b) implement intra-component splitting (e.g. loop rotation/duplication of the loop header, or reachability-based cuts inside the SCC with carrier-array state passing, reusing the same trampoline mechanism already built for inter-chunk edges) so oversized cyclic regions can also be split.","locations":[{"ref":"src/lower2/large_methods.rs:58-104","code":"   58 | fn outline_function(function: Function, owner: &str) -> jvm::Result<Vec<Function>> {\n   59 |     let total_cost = function\n   60 |         .body\n   61 |         .basic_blo {"id":"ARCH_4","type":"architecture","type_label":"Architecture","severity":"medium","difficulty":"medium","description":"`checked_intrinsic_registry.rs` stores the set of \"needed\" checked-arithmetic intrinsics in a process-global `static NEEDED_INTRINSICS: Lazy<Mutex<HashSet<...>>>` (`src/lower1/control_flow/checked_intrinsic_registry.rs:10-11`). `register_intrinsic` is called deep inside per-instance MIR lowering (via `checked_ops::emit_checked_arithmetic_oomir_instructions`, see `src/lower1/control_flow/checked_ops.rs:41`), while `take_needed_intrinsics` drains the whole global set once per OOMIR shard in `prepare_oomir_shard` (`src/lib.rs:1186-1206`), which itself runs synchronously in the same loop that calls `lower_codegen_unit_items` for each shard (`src/lib.rs:1362-1385`) - i.e. correctness currently depends on the undocumented invariant that MIR lowering for different shards never runs concurrently. The neighboring `emit_oomir_shard` step for bytecode emission is explicitly parallelized across a worker-thread pool (`src/lib.rs:1294-1330`), so the file already lives in a codebase that is willing to parallelize codegen stages. If lowering itself is ever parallelized across codegen units (a natural follow-up optimization), this global registry would silently misattribute intrinsics registered by one shard's lowering to whichever shard happens to call `take_needed_intrinsics` first, producing shards that reference a `RustcCodegenJVMIntrinsics` member the emitted class never defines (a JVM verification failure at runtime), or shards that redundantly regenerate the same intrinsic.","fix":"Either (a) thread the intrinsic registry through as an explicit parameter (e.g. a `&mut HashSet<...>` passed alongside `data_types`/`instructions` into the lowering calls, scoped per shard) so the compiler enforces the single-shard-at-a-time invariant, or (b) if the global design is kept for convenience, add a loud comment on `NEEDED_INTRINSICS` stating that MIR lowering for different shards must never run concurrently with each other or with `take_needed_intrinsics`, so a future parallelization of the `lower1` phase does not silently reintroduce a data race.","locations":[{"ref":"src/lower1/control_flow/checked_intrinsic_registry.rs:8-29","code":"    8 | /// Global registry of needed checked arithmetic intrinsics.\n    9 | /// Format: (operation, type, result tuple class), e.g. (\"add\", \"i32\", \"test/Tuple_i32_bool\").\n   10 | static NEEDED_INTRINSICS: Lazy<Mutex<HashSet<(String, String, String)>>> =\n   11 |     Lazy::new(|| Mutex::new(HashSet::default()));\n   12 | \n   13 | /// Register that a checked arithmetic intrinsic is needed\n   14 | pub fn register_intrinsic(operation: &str, ty: &str, result_tuple_class: &str) {\n   15 |     let mut registry = NEEDED_INTRINSICS.lock().unwrap();\n   16 |     registry.insert((\n   17 |         operation.to_string(),\n   18 |         ty.to_string(),\n   19 |         result_tuple_class.to_string(),\n   20 |     ));\n   21 | }\n   22 | \n   23 | /// Get all registered intrinsics and clear the registry\n   24 | pub fn take_needed_intrinsics() -> Vec<(String, String, String)> {\n   25 |     let mut registry = NEEDED_INTRINSICS.lock().unwrap();\n   26 |     let intrinsics: Vec<_> = registry.iter().cloned().collect();\n   27 |     registry.clear();\n   28 |     intrinsics\n   29 | }","lines":22,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/src/lower1/control_flow/checked_intrinsic_registry.rs#L8-L29"},{"ref":"src/lib.rs:1580-1600","code":" 1580 | fn prepare_oomir_shard(shard_name: &str, mut oomir_module: oomir::Module) -> oomir::Module {\n 1581 |     // Intrinsic use is registered while MIR is lowered. Drain the registry per\n 1582 |     // shard so no crate-wide OOMIR state has to remain alive.\n 1583 |     let needed_intrinsics = lower1::control_flow::take_needed_intrinsics();\n 1584 |     if !needed_intrinsics.is_empty() {\n 1585 | {"id":"ARCH_5","type":"architecture","type_label":"Architecture","severity":"medium","difficulty":"hard","description":"`collect_union_writebacks` (`src/lower1/place.rs:539-612`) reconstructs which pending union-field writebacks are needed by re-scanning the flat `Vec<Instruction>` already emitted for the base place (`get_instructions`), pattern-matching for `Instruction::InvokeVirtual` calls whose `class_name`/`method_name` happen to match the union getter naming convention (`union_getter_method_name`), and advancing a manual `instruction_cursor` through the list to keep per-projection lookups from re-matching an earlier instruction (lines 572-592). If no matching instruction is found it `panic!`s (lines 586-591) rather than returning a typed error. This couples `collect_union_writebacks` tightly to the exact instruction shape and ordering that `emit_instructions_to_get_recursive`'s union-field branch (`src/lower1/place.rs:1012-1054`) happens to emit today; any future change to how union field reads are lowered (a different instruction kind, an extra instruction inserted before the getter call, or a change to `union_getter_method_name`'s naming scheme) would silently break this reverse-engineering step, either by panicking at codegen time on real user code or - if the mismatch is subtle enough to still \"find\" a match - by picking the wrong instruction's operand/dest as the writeback target.","fix":"Have the read-side union-field lowering in `emit_instructions_to_get_recursive` return the `UnionWriteback` records directly alongside the instructions it emits (e.g. via an out-parameter `Vec<UnionWriteback>` or by returning a richer struct instead of a bare `Vec<Instruction>`), so `emit_instructions_to_set_value` no longer needs to reverse-engineer writeback state by pattern-matching the instruction stream after the fact.","locations":[{"ref":"src/lower1/place.rs:541-614","code":"  541 | fn collect_union_writebacks<'tcx>(\n  542 |     base_place: &Place<'tcx>,\n  543   580 |                     Instruction::InvokeVirtual {\n  581 |                         dest: Some(_),\n  582 |                         class_name: owner,\n  583 |                         method_name,\n  584 |                         ..\n  585 |                     } if owner == &class_name && method_name == &getter_name\n  586 |                 )\n  587 |             })\n  588 |         else {\n  589 |             panic!(\n  590 |                 \"Could not locate generated getter for nested union field {}.{}\",\n  591 |                 class_name, field_name\n  592 |             );\n  593 |         };\n  594 |         instruction_cursor += relative_index + 1;\n  595 |         let Instruction::InvokeVirtual {\n  596 |             dest: Some(value_name),\n  597 |             method_ty,\n  598 |             operand,\n  599 |             ..\n  600 |         } = getter\n  601 |         else {\n  602 |             unreachable!();\n  603 |         };\n  604 |         writebacks.push(UnionWriteback {\n  605 |             class_name,\n  606 |             field_name,\n  607 |             receiver: operand.clone(),\n  608 |             value_name: value_name.clone(),\n  609 |             value_ty: method_ty.ret.as_ref().clone(),\n  610 |         });\n  611 |     }\n  612 | \n  613 |     writebacks\n  614 | }","lines":74,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/src/lower1/place.rs#L541-L614"},{"ref":"src/lower1/place.rs:1045-1087","code":" 1045 |                 if let Some((adt_def, _substs)) = union_parts_from_ty(base_rust_ty) {\n 1046 |                     let owner_class_name =\n 1047 |                         match ty_to_oomir_type(base_rust_ty, tcx, data_types, instance) {\n 1048 |                             oomir::Type::Class(name) => name,\n 1049 |                             oomir::Type::Reference(inner)\n 1050 |                                 if matches!(inner.as_ref(), oomir::Type::Class(_)) =>\n {"id":"ARCH_6","type":"architecture","type_label":"Architecture","severity":"medium","difficulty":"hard","description":"`src/stable_hash.rs::readable_or_hashed_name` (lines 58-75) falls back to `short_hash(&complete_identity, 10)` (40 bits of FNV-1a) whenever the human-readable generated name would exceed `max_len`. This truncated hash is used directly as (part of) a generated JVM class/method name with no collision check and no fallback if the resulting name is already taken. FNV-1a is not a cryptographic hash and 40 bits is small enough that, across a large program with many long generic instantiations/closures (exactly the case that triggers this fallback), two distinct identities can plausibly collide. A collision here means two different generated symbols get assigned the *same* JVM name, which is not merely a build failure risk - since these names key `FunctionKey`/interned constant lookups elsewhere, it can silently cause one specialization's bytecode to be reused for a call site that meant to invoke a different one.","fix":"Track already-issued hashed names in a registry (per-module or per-compilation-session) and, on collision, append a disambiguating suffix (e.g. an incrementing counter) before accepting the generated name, rather than trusting the raw hash to be unique.","locations":[{"ref":"src/stable_hash.rs:26-39","code":"   26 | pub(crate) fn short_hash_bytes(input: &[u8], length: usize) -> String {\n   27 |     assert!(\n   28 |         length <= 16,\n   29 |         \"FNV-1a identifier hashes are at most 16 hex digits\"\n   30 |     );\n   31 | \n   32 |     let mut hash = 0xcbf29ce484222325u64;\n   33 |     for byte in input {\n   34 |         hash ^= u64::from(*byte);\n   35 |         hash = hash.wrapping_mul(0x100000001b3);\n   36 |     }\n   37 | \n   38 |     format!(\"{hash:016x}\")[..length].to_string()\n   39 | }","lines":14,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/src/stable_hash.rs#L26-L39"},{"ref":"src/stable_hash.rs:64-81","code":"   64 | pub(crate) fn readable_or_hashed_name(\n   65 |     prefix: &str,\n   66 |     readable_suffix: &str,\n   67 |     identity: &str,\n   68 |     max_len: usize,\n   69 | ) -> String {\n   70 |     let readable = if readable_suffix.is_empty() {\n   71 |         prefix.to_string()\n   72 |     } else {\n   73 |         format!(\"{prefix}_{readable_suffix}\")\n   74 |     };\n   75 |     if readable.len() <= max_len {\n   76 |         readable\n   77 |     } else {\n   78 |         let complete_identity = format!(\"{identity}\\0{readable_suffix}\");\n   79 |         format!(\"{prefix}_{}\", short_hash(&complete_identity, 10))\n   80 |     }\n   81 | }","lines":18,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/src/stable_hash.rs#L64-L81"}]},
{"id":"ARCH_7","type":"architecture","type_label":"Architecture","severity":"medium","difficulty":"medium","description":"Both `stdlib_overlay.py:prepare_stdlib_source` (lines 59-117) and `stdlib_test_harness.py:prepare_suite_source` (lines 168-251), as well as `test_harness.py:prepare_shared_cache` (lines 125-164), build a shared, content-addressed cache directory by checking whether the destination already exists, and if not, copying/patching into a temporary directory and then doing `shutil.rmtree(destination)` followed by `temporary.rename(destination)` with **no cross-process locking**. For example in `stdlib_overlay.py`:\n\n```python\nif destination.parent.exists():\n    shutil.rmtree(destination.parent)\ntemporary.rename(destination.parent)\n```\n\nIf two processes race to prepare the same (commit, overlay-hash) or (commit, source-hash, patch-hash) destination concurrently -- which is plausible since `stdlib_test_harness.py` and `test_harness.py` are both meant to be invoked per-suite and could run in parallel in CI -- both will pass the initial \"does it already exist\" check, both build their own temporary copy, and then race on the `rmtree`/`rename` pair. This can leave one process removing a destination that the other process just renamed into place, or fail with `OSError` when the destination directory reappears between the `exists()` check and the `rmtree`/`rename` calls, causing spurious CI failures that are very hard to reproduce.","fix":"Serialize preparation of each shared cache directory across processes, for example by acquiring an OS-level advisory lock (`fcntl.flock` / `msvcrt.locking` or the `filelock` package) keyed on the destination path before checking whether it exists and before the final rename, releasing it only after the marker file has been written. Alternatively, make the final publish step atomic without requiring a pre-existing-destination removal, by always renaming into a location that does not yet exist (this is already partly done via the `.tmp-{pid}` naming, but the `rmtree` + `rename` of the *destination itself* is still unprotected).","locations":[{"ref":"stdlib_overlay.py:59-117","code":"   59 | def prepare_stdlib_source(sysroot: Path, commit: str) -> tuple[Path, str]:\n   60 |     installed = sysroot / \"lib\" / \"rustlib\" / \"src\" / \"rust\" / \"library\"\n   61 |     if not (installed / \"Cargo.toml\").exists() or not (installed / \"Cargo.lock\").exists():\n   62 |         raise RuntimeError(\n   63 |             f\"standard-library sources were not found at {installed}; install them with \"\n   64 |             \"`rustup component add rust-src`\"\n   65 |         )\n   66 | \n   67 |     overlay_hash = stdlib_overlay_digest()\n   68 |     destination = (\n   69 |         STDLIB_BUILD_ROOT / \"rust-src\" / f\"{commit[:12]}-{overlay_hash[:12]}\" / \"library\"\n   70 |     )\n   71 |     marker = destination.parent / \"overlay.json\"\n   72 |     expected_marker = {\n   73 |         \"schema_version\": 1,\n   74 |         \"rustc_commit\": commit,\n   75 |         \"overlay_sha256\": overlay_hash,\n   76 |     }\n   77 |     if destination.is_dir() and marker.is_file():\n   78 |         try:\n   79 |             if json.loads(marker.read_text(encoding=\"utf-8\")) == expected_marker:\n   80 |                 return destination, overlay_hash\n   81 |         except json.JSONDecodeError:\n   82 |             pass\n   83 | \n   84 |     temporary = destination.parent.with_name(destination.parent.name + f\".tmp-{os.getpid()}\")\n   85 |     shutil.rmtree(temporary, ignore_errors=True)\n   86 |     temporary_library = temporary / \"library\"\n   87 |     temporary.parent.mkdir(parents=True, exist_ok=True)\n   88 |     try:\n   89 |         shutil.copytree(installed, temporary_library)\n   90 |         shutil.copytree(STDLIB_OVERLAY_ROOT, temporary_library, dirs_exist_ok=True)\n   91 |         patch_directory = temporary_library.relative_to(ROOT)\n   92 |         for patch in sorted(STDLIB_PATCH_ROOT.glob(\"*.patch\")):\n   93 |             applied = run(\n   94 |                 [\n   95 |                     \"git\",\n   96 |                     \"apply\",\n   97 |                     \"--whitespace=nowarn\",\n   98 |                     f\"--directory={patch_directory}\",\n   99 |                     str(patch.resolve()),\n  100 |                 ]\n  101 |             )\n  102 |             if applied.returncode != 0:\n  103 |                 raise RuntimeError(\n  104 |                     f\"JVM std overlay patch {patch.name} does not apply to rustc {commit}:\\n\"\n  105 |                     + applied.stdout\n  106 |                     + applied.stderr\n  107 |                 )\n  108 |         (temporary / \"overlay.json\").write_text(\n  109 |             json.dumps(expected_marker, indent=2) + \"\\n\", encoding=\"utf-8\"\n  110 |         )\n  111 |         if destination.parent.exists():\n  112 |             shutil.rmtree(destination.parent)\n  113 |         temporary.rename(destination.parent)\n  114 |     except Exception:\n  115 |         shutil.rmtree(temporary, ignore_errors=True)\n  116 |         raise\n  117 |     return destination, overlay_hash","lines":59,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/stdlib_overlay.py#L59-L117"},{"ref":"stdlib_test_harness.py:168-251","code":"  168 | def prepare_suite_source(\n  169 |     config: SuiteConfig,\n  170 |     sysroot: Path,\n  171 |     commit: str,\n  172 | ) -> tuple[Path, str, str, Path]:\n  173 |     library = sysroot / \"lib\" / \"rustlib\" / \"src\" / \"rust\" / \"library\"\n  174 |     installed = library / config.source_directory\n  175 |     manifest = installed / \"Cargo.toml\"\n  176 |     library_lockfile = library / \"Cargo.lock\"\n  177 |     if not manifest.exists() or not library_lockfile.exists():\n  178 |         raise RuntimeError(\n  179 |             f\"{config.name} was not found at {installed}; instal
