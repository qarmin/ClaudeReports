<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"medium","difficulty":"hard","description":"`get_int_const_instr`, `get_long_const_instr`, `get_float_const_instr`, and `get_double_const_instr` in `src/lower2/consts.rs` all call `.expect(...)` on the `Result` returned by `InternedConstantPool::add_integer`/`add_long`/`add_float`/`add_double`. If the underlying JVM constant pool ever fails to accept a new entry (most notably, once a class's constant pool would exceed the classfile format's 65535-entry limit), these calls panic and crash the whole compiler instead of surfacing a `jvm::Error` that could be turned into a normal compile error. The rest of the module clearly anticipates constant-pool/method-size pressure (see `MAX_INLINE_CONSTANT_INSTRUCTIONS` chunking and `create_chunked_array_factory` in `src/lower2.rs`), but these four numeric-constant helpers are not part of that defensive design and can still be reached from ordinary, very constant-heavy user code (e.g. functions with huge numbers of distinct literal integers/floats/doubles).","fix":"Change `get_int_const_instr`, `get_long_const_instr`, `get_float_const_instr`, and `get_double_const_instr` to return `jvm::Result<Instruction>` instead of `Instruction`, propagate the `?` from `add_integer`/`add_long`/`add_float`/`add_double` instead of `.expect(...)`, and update all ~60 call sites (in `src/lower2.rs`, `src/lower2/jvm_gen.rs`, `src/lower2/helpers.rs`, and the translator) to propagate the error with `?`. This turns a hard compiler crash on pathological input into a normal `jvm::Error::VerificationError` that the existing error-reporting path already knows how to surface.","locations":[{"ref":"src/lower2/consts.rs:28-39","code":"   28 | pub fn get_int_const_instr(cp: &mut InternedConstantPool, val: i32) -> Instruction {\n   29 |     immediate_int_const_instr(val).unwrap_or_else(|| {\n   30 |         let index = cp\n   31 |             .add_integer(val)\n   32 |             .expect(\"Failed to add integer to constant pool\");\n   33 |         if let Ok(idx8) = u8::try_from(index) {\n   34 |             Instruction::Ldc(idx8)\n   35 |         } else {\n   36 |             Instruction::Ldc_w(index)\n   37 |         }\n   38 |     })\n   39 | }","lines":12,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/src/lower2/consts.rs#L28-L39"},{"ref":"src/lower2/consts.rs:64-77","code":"   64 | pub fn get_long_const_instr(cp: &mut InternedConstantPool, val: i64) -> Instruction {\n   65 |     match val {\n   66 |         0 => Instruction::Lconst_0,\n   67 |         1 => Instruction::Lconst_1,\n   68 |         _ => {\n   69 |             // Add the long value to the constant pool.\n   70 |             let index = cp\n   71 |                 .add_long(val)\n   72 |                 .expect(\"Failed to add long to constant pool\");\n   73 |             // Ldc2_w is used for long/double constants and always takes a u16 index.\n   74 |             Instruction::Ldc2_w(index)\n   75 |         }\n   76 |     }\n   77 | }","lines":14,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/src/lower2/consts.rs#L64-L77"},{"ref":"src/lower2/consts.rs:80-95","code":"   80 | pub fn get_float_const_instr(cp: &mut InternedConstantPool, val: f32) -> Instruction {\n   81 |     if val.to_bits() == 0.0f32.to_bits() {\n   82 |         Instruction::Fconst_0\n   83 |     } else if val == 1.0 {\n   84 |         Instruction::Fconst_1\n   85 |     } else if val == 2.0 {\n   86 |         Instruction::Fconst_2\n   87 |     } else {\n   88 |         // Add the float value to the constant pool.\n   89 |         let index = cp\n   90 |             .add_float(val)\n   91 |             .expect(\"Failed to add float to constant pool\");\n   92 |         // Ldc2_w is used for long/double constants and always takes a u16 index.\n   93 |         Instruction::Ldc_w(index)\n   94 |     }\n   95 | }","l {"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`FunctionTranslator::materialize_boolean_from_branch` (`src/lower2/translator.rs:3536-3571`) uses `self.jvm_instructions.len().try_into().unwrap()` twice, at lines `3557` and `3563`, to convert the current instruction count to a `u16` label index. Every other place in this file that performs the same usize-to-u16 conversion on `jvm_instructions.len()` (e.g. `OI::Label` at `4380-4386`, and `translate()`'s per-block `start_instr_index` at `1450-1455`) uses `.map_err(...)` to turn a too-large function into a graceful `jvm::Error::VerificationError`. Here, if a single OOMIR instruction's translation pushes the instruction count from just under `65536` past it (this helper alone pushes up to 4 instructions), the `.unwrap()` panics instead of surfacing the same \"Function exceeds the JVM's 65,535-instruction limit\" error the rest of the codebase is careful to report.","fix":"Replace both `unwrap()` calls with the same `map_err` pattern used elsewhere in this file, e.g.:\n```rust\nlet true_instr_index: u16 = self.jvm_instructions.len().try_into().map_err(|_| {\n    jvm::Error::VerificationError {\n        context: format!(\"Function {}\", self.oomir_func.name),\n        message: \"Function exceeds the JVM's 65,535-instruction limit\".to_string(),\n    }\n})?;\n```\n(and the same for `after_instr_index` at line `3563`).","locations":[{"ref":"src/lower2/translator.rs:3546-3570","code":" 3546 |         let instr_idx_if = self.jvm_instructions.len();\n 3547 |         let label_true = format!(\"_comparison_true_{}\", instr_idx_if);\n 3548 |         let label_after = format!(\"_comparison_after_{}\", instr_idx_if);\n 3549 | \n 3550 |         // Emit branch instruction (using the constructor decided above)\n 3551 |         self.jvm_instructions.push(branch_constructor(0)); // Placeholder offset\n 3552 |         self.branch_fixups.push((instr_idx_if, label_true.clone()));\n 3553 | \n 3554 |         // False case: push 0\n 3555 |         self.jvm_instructions.push(Instruction::Iconst_0);\n 3556 |         let instr_idx_goto_after = self.jvm_instructions.len();\n 3557 |         self.jvm_instructions.push(Instruction::Goto(0)); // Placeholder offset\n 3558 |         self.branch_fixups\n 3559 |             .push((instr_idx_goto_after, label_after.clone()));\n 3560 | \n 3561 |         // True case: record label, push 1\n 3562 |         let true_instr_index: u16 = self.jvm_instructions.len().try_into().unwrap();\n 3563 |         self.label_to_instr_index\n 3564 |             .insert(label_true, true_instr_index);\n 3565 |         self.jvm_instructions.push(Instruction::Iconst_1);\n 3566 | \n 3567 |         // After branch: record label\n 3568 |         let after_instr_index: u16 = self.jvm_instructions.len().try_into().unwrap();\n 3569 |         self.label_to_instr_index\n 3570 |             .insert(label_after, after_instr_index);","lines":25,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/src/lower2/translator.rs#L3546-L3570"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`std/overlay/std/src/sys/fs/jvm.rs::Clone for FileKey` (lines 281-287) converts a fallible native operation (`jvm_duplicate_file_key`, which can presumably fail under resource exhaustion, e.g. an OS file-handle-table limit) into a hard `assert!(handle > 0, \"the JVM returned an invalid file-key handle\")` panic, because `Clone::clone` cannot return a `Result`. Any ordinary consumer of `fs::Metadata`/`FileKey` (e.g. via the public `MetadataExt::file_key` in `std/overlay/std/src/os/jvm/fs.rs`) that clones a `FileKey` when the host is out of native handle resources will abort the whole process instead of getting a recoverable `io::Error`, which is a much harsher failure mode than the rest of this file (which otherwise consistently threads errors through `io::Result`).","fix":"If handle duplication can genuinely fail in practice (not just as a defensive check), avoid relying on eager `Clone` for `FileKey`: e.g. make the underlying handle reference-counted on the Rust side (`Arc`) instead of requiring a native duplicate call per clone, so `Clone` is infallible by construction.","locations":[{"ref":"std/overlay/std/src/sys/fs/jvm.rs:281-287","code":"  281 | impl Clone for FileKey {\n  282 |     fn clone(&self) -> Self {\n  283 |         let handle = unsafe { jvm_duplicate_file_key(self.0) };\n  284 |         assert!(handle > 0, \"the JVM returned an invalid file-key handle\");\n  285 |         FileKey(handle as u64)\n  286 |     }\n  287 | }","lines":7,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/std/overlay/std/src/sys/fs/jvm.rs#L281-L287"},{"ref":"std/overlay/std/src/sys/fs/jvm.rs:872-879","code":"  872 |             file_key_handle => {\n  873 |                 assert!(\n  874 |                     file_key_handle > 0,\n  875 |                     \"the JVM returned an invalid file-key handle\"\n  876 | {"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"hard","description":"Exposing a pointer's address via `Pointer.address()` / `expose_provenance()` publishes an `ExposedTarget` into the static `EXPOSED_ADDRESSES` map (`Map<Long, ExposedTarget>`, declared at `runtime/src/Pointer.java:251`) and records the allocation in `ALLOCATION_EXPOSED_ADDRESSES` (a plain, strongly-referencing `IdentityHashMap`, declared at `runtime/src/Pointer.java:258-259`). `ExposedTarget.allocation` (`runtime/src/Pointer.java:4607`) is a normal strong field, not a `WeakReference`. The only code path that ever removes entries from these two maps is `Pointer.deallocateBytes` (`runtime/src/Pointer.java:5690-5735`), which is exclusively used for byte-array allocations created by the Rust global allocator (`Pointer.allocateBytes`/`GlobalAlloc`).\n\nPointers backed by `Cell`, `ReceiverCell`, or `FieldCell` -- i.e. ordinary Rust references to stack locals, struct fields, or `&mut self` receivers -- are never passed to `deallocateBytes`. Any common Rust idiom that turns such a reference into an integer (`&x as *const _ as usize`, pointer hashing such as `HashMap<*const T, V>`, logging an address, an FFI callback context pointer, etc.) calls `registerExposedTarget` (`runtime/src/Pointer.java:7505-7525`) through `address()` (`runtime/src/Pointer.java:7802-7826`), which permanently retains the backing `Cell`/ `ReceiverCell`/`FieldCell` (and therefore the Rust value it wraps) for the remaining lifetime of the JVM process, even though in real Rust that local's storage is reclaimed the moment its stack frame returns. This is a much larger scope of retention than the class's own comment justifies (\"retain its backing object conservatively\" is intended for heap allocations whose Rust lifetime is unbounded until an explicit `dealloc`, not for every stack local whose address is ever taken).","fix":"Give `Cell`/`ReceiverCell`/`FieldCell`-backed `ExposedTarget` entrie {"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"hard","description":"`std/overlay/std/src/sys/args/jvm.rs::args` (line 25), `std/overlay/std/src/sys/env/jvm.rs::os_string` (line 81), and `std/overlay/std/src/sys/fs/jvm.rs::os_string`/`last_error` (lines 1042, 1067) all build a Rust `String`/`OsString` from raw bytes copied out of the JVM runtime via `String::from_utf8_unchecked`, without validating the bytes are actually valid UTF-8. `from_utf8_unchecked`'s safety contract requires the caller to guarantee valid UTF-8; violating it is immediate undefined behavior for any subsequent `&str`-typed access (comparisons, hashing, slicing on non-char-boundaries, etc.), not merely a logic bug.\n\nThis is safe only if the JVM-side native bridge always encodes these strings as strict UTF-8. That is a real risk area for JVM/JNI interop: JNI's own `GetStringUTFChars` produces \"Modified UTF-8\" (a different, non-standard encoding for the NUL byte and for characters outside the BMP), and native OS environment variables/arguments are not guaranteed to be valid UTF-8 to begin with on POSIX systems (that is precisely why Rust's `OsStr` exists to preserve raw, possibly non-UTF-8 bytes rather than going through `String`). None of the four call sites validate or document why the incoming bytes are guaranteed to be well-formed UTF-8.","fix":"Either use the fallible `String::from_utf8` (or `str::from_utf8` + lossy conversion, matching how `panic_unwind/jvm.rs::cleanup` already uses `String::from_utf8_lossy` for foreign failure messages) and handle the error explicitly, or add a `debug_assert!(core::str::from_utf8(&bytes).is_ok())` at each call site plus a comment documenting the exact guarantee made by the JVM-side runtime bridge (e.g. \"the runtime always re-encodes via `new String(bytes, StandardCharsets.UTF_8)`, never JNI modified-UTF-8\") so the invariant is checked in debug builds and discoverable by future maintainers.","locations":[{"ref":"std/overlay/std/src/sys/args/jvm.rs:17-29","code":"   17 | pub fn args() -> Args {\n   18 |     let count = unsafe { argument_count() };\n   19 |     let mut arguments = Vec::with_capacity(count);\n   20 |     for index in 0..count {\n   21 |         let length = unsafe { argument_length(index) };\n   22 |         let mut bytes = Vec::with_capacity(length);\n   23 |         bytes.resize(length, 0);\n   24 |         unsafe { copy_argument(index, bytes.as_mut_ptr()) };\n   25 |         let argument = unsafe { String::from_utf8_unchecked(bytes) };\n   26 |         arguments.push(OsString::from(argument));\n   27 |     }\n   28 |     Args::new(arguments)\n   29 | }","lines":13,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/std/overlay/std/src/sys/args/jvm.rs#L17-L29"},{"ref":"std/overlay/std/src/sys/env/jvm.rs:80-82","code":"   80 | fn os_string(bytes: Vec<u8>) -> OsString {\n   81 |     OsString::from(unsafe { String::from_utf8_unchecked(bytes) })\n   82 | }","lines":3,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/std/overlay/std/src/sys/env/jvm.rs#L80-L82"},{"ref":"std/overlay/std/src/sys/fs/jvm.rs:1038-1044","code":" 1038 | fn last_error() -> io::Error {\n 1039 |     let length = unsafe { jvm_last_error_message_length() };\n 1040 |     let mut bytes = vec![0; length];\n 1041 |     unsafe { jvm_copy_last_error_message(bytes.as_mut_ptr()) };\n 1042 |     let message = unsafe { String::from_utf8_unchecked(bytes) };\n 1043 |     io::Error::new(error_kind(unsafe { jvm_last_error_kind() }), message)\n 1044 | }","lines":7,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/std/overlay/std/src/sys/fs/jvm.rs#L1038-L1044"},{"ref":"std/overlay/std/src/sys/fs/jvm.rs:1066-1068","code":" 1066 | fn os_string(bytes: Vec<u8>) -> OsString {\n 1067 |     OsString::from(unsafe { String::from_utf8_unchecked(bytes) } {"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"`emit_checked_arithmetic_intrinsic`'s `mul` overflow detection in `src/lower1/control_flow/checked_intrinsics.rs:141-224` uses the standard `result / b != a` test, plus a special case for the `MIN * -1` corner case where wrapped division coincidentally equals the original operand. That special case (computing `mul_a_min`/`mul_b_minus_one`/`mul_min_times_minus_one` and OR-ing it into `overflow`) is only applied in the `else` branch at `src/lower1/control_flow/checked_intrinsics.rs:188-211`, which is reached only when `!is_unsigned(ty) && !matches!(ty, Type::I8 | Type::I16)` (line 183). For `Type::I8` and `Type::I16`, the code instead takes the branch at lines 183-187, which sets `overflow` to plain `quotient_differs` with no special case at all:\n```\nif is_unsigned(ty) || matches!(ty, Type::I8 | Type::I16) {\n    instrs.push(Instruction::Move {\n        dest: overflow.into(),\n        src: variable(quotient_differs, &Type::Boolean),\n    });\n}\n```\nThis is wrong for `i8`/`i16`: `translate_binary_op` in `src/lower2/translator.rs:2802-2819` computes `Mul`/`Div` for `I8`/`I16` using 32-bit `Imul`/`Idiv` and then narrows the result back down via `normalize_integer_result` (`I2b`/`I2s`, `src/lower2/translator.rs:2821-2830`). For `a = i8::MIN` (`-128`), `b = -1`: the wrapped `result` narrows to `-128` (same as `a`), and `quotient = result / b` narrows to `-128` too (`128` truncated through `I2b`), so `quotient == a` and `quotient_differs` is `false` even though `-128 * -1 = 128` overflows `i8`'s range. The same failure mode applies to `i16::MIN.checked_mul(-1)`. The generated intrinsic therefore returns `Some(i8::MIN)`/`Some(i16::MIN)` instead of `None` for `checked_mul`/`overflowing_mul` on these two corner-case inputs, silently corrupting overflow-checked arithmetic that user code relies on for correctness (e.g. bounds checks, safety invar {"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"`FunctionTranslator::assign_local` (`src/lower2/translator.rs:665-683`) computes a new local-variable slot with plain, unchecked `u16` arithmetic: `let index = self.next_local_index; let size = get_type_size(ty); self.next_local_index += size;`. The same unchecked pattern appears in `pointer_offset_slots` (`685-696`, `self.next_local_index += 4;`), `direct_cell_slot` (`1244-1253`, `self.next_local_index += get_type_size(...)`), and the constructor's deferred-pointer-parameter setup (`283-292`, `translator.next_local_index += 4;`). None of these guard against `next_local_index` (a `u16`, JVM-limited to `65535`) overflowing. A function with enough distinct locals/temporaries (helped along by synthetic names like `_switch_discr_temp_*`, `$rcj$representation_*`, and the extra 4 slots reserved per deferred pointer for `element_offset`/`byte_offset` tracking) to push `next_local_index` past `65535` will silently wrap around in a release build (no `overflow-checks`), causing two unrelated variables to alias the same JVM local slot - a silent miscompilation rather than a caught error.","fix":"Use `checked_add`/`checked_mul` for the `next_local_index`/`max_locals_used` updates and propagate a `jvm::Error::VerificationError` (matching the existing style used elsewhere in this file, e.g. the `u16::try_from(...)` guards in `emit_unwind_handlers`) instead of a plain `+=`. For example in `assign_local`:\n```rust\nlet index = self.next_local_index;\nlet size = get_type_size(ty);\nself.next_local_index = self.next_local_index.checked_add(size).ok_or_else(|| {\n    jvm::Error::VerificationError {\n        context: format!(\"Function {}\", self.oomir_func.name),\n        message: \"function exceeds the JVM's 65,535 local-variable limit\".to_string(),\n    }\n})?;\n```\nThis requires threading the `Result` through `assign_local`'s (and its callers') signatures.","locations":[{"ref":"src/lower2/translator.rs:664-682","code":"  664 |     fn assign_local(&mut self, var_name: &str, ty: &oomir::Type) -> u16 {\n  665 |         let key = (var_name.to_string(), ty.clone());\n  666 |         if let Some(index) = self.typed_local_var_map.get(&key).copied() {\n  667 |             self.local_var_map.insert(var_name.to_string(), index);\n  668 |             self.local_var_types\n  669 |                 .insert(var_name.to_string(), ty.clone());\n  670 |             return index;\n  671 |         }\n  672 | \n  673 |         let index = self.next_local_index;\n  674 |         let size = get_type_size(ty);\n  675 |         self.next_local_index += size;\n  676 |         self.max_locals_used = self.max_locals_used.max(index + size);\n  677 |         self.typed_local_var_map.insert(key, index);\n  678 |         self.local_var_map.insert(var_name.to_string(), index);\n  679 |         self.local_var_types\n  680 |             .insert(var_name.to_string(), ty.clone());\n  681 |         index\n  682 |     }","lines":19,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/src/lower2/translator.rs#L664-L682"},{"ref":"src/lower2/translator.rs:684-695","code":"  684 |     fn pointer_offset_slots(&mut self, pointer_slot: u16) -> (u16, u16) {\n  685 |         if let Some(slots) = self.pointer_offset_slots.get(&pointer_slot).copied() {\n  686 |             return slots;\n  687 |         }\n  688 |         let element_offset = self.next_local_index;\n  689 |         let byte_offset = element_offset + 2;\n  690 |         self.next_local_index += 4;\n  691 |         self.max_locals_used = self.max_locals_used.max(self.next_local_index);\n  692 |         self.pointer_offset_slots\n  693 |             .insert(pointer_slot, (element_offset, byte_offset));\n  694 |         (element_offset, byte_offset)\n  695 |     }","lines":12,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645 {"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"Several `NewArray`/constant-size sites cast a `usize` byte size directly with `as i32` without any bounds check, e.g. `oomir::Constant::I32(size.max(1) as i32)` at `src/lower1/types.rs:3232`, `size as i32`/`size.max(1) as i32` at `src/lower1/types.rs:3947` and `3952`, `union_size as i32` at `src/lower1/types.rs:4259` and `6024`, `source_size as i32`/`source_size.max(1) as i32` at `src/lower1/types.rs:4906` and `4911`, and `layout.size as i32`/`layout.size.max(1) as i32` at `src/lower1/types.rs:5240`, `5245`, and `5324`. Elsewhere in the very same file (e.g. `src/lower1/types.rs:2953`, `3021`, `3179`, `3335`, `3408`, `3898`, `5712`) the equivalent conversion is done with `i32::try_from(...).map_err(...)`/`.expect(...)`, propagating a clear error (or an explicit panic message) instead of silently truncating. If a Rust type's layout size (a `usize`) ever exceeds `i32::MAX`, the unchecked sites would silently wrap into a negative `i32`, which is then used as a JVM array-allocation length, producing a `NegativeArraySizeException` at runtime instead of a clear compile-time diagnostic.","fix":"For consistency with the checked sites elsewhere in the file, replace the bare `as i32` casts on size values with `i32::try_from(size).map_err(|_| \"...\".to_string())?` (or `.expect(...)` where the surrounding function is infallible), so an oversized Rust type produces the same graceful \"unsupported\" error path as the pointer-encoding code already does, rather than a wrapped negative array length.","locations":[{"ref":"src/lower1/types.rs:3542","code":" 3542 |             size: oomir::Operand::Constant(oomir::Constant::I32(size.max(1) as i32)),","lines":1,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/src/lower1/types.rs#L3542"},{"ref":"src/lower1/types.rs:4257-4262","code":" 4257 |             size: oomir::Operand::Constant(oomir::Constant::I32(size as i32)),\n 4258 |         });\n 4259 |         instructions.push(oomir::Instruction::NewArray {\n 4260 |             dest: nested_objects.clone(),\n 4261 |             element_type: oomir::Type::Class(\"java/lang/Object\".to_string()),\n 4262 |             size: oomir::Operand::Constant(oomir::Constant::I32(size.max(1) as i32)),","lines":6,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/src/lower1/types.rs#L4257-L4262"},{"ref":"src/lower1/types.rs:4569","code":" 4569 |                 size: oomir::Operand::Constant(oomir::Constant::I32(union_size as i32)),","lines":1,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/src/lower1/types.rs#L4569"},{"ref":"src/lower1/types.rs:5225-5230","code":" 5225 |                 size: oomir::Operand::Constant(oomir::Constant::I32(source_size as i32)),\n 5226 |             },\n 5227 |             oomir::Instruction::NewArray {\n 5228 |                 dest: objects_name.clone(),\n 5229 |                 element_type: oomir::Type::Class(\"java/lang/Object\".to_string()),\n 5230 |                 size: oomir::Operand::Constant(oomir::Constant::I32(source_size.max(1) as i32)),","lines":6,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/src/lower1/types.rs#L5225-L5230"},{"ref":"src/lower1/types.rs:5559-5564","code":" 5559 |             size: oomir::Operand::Constant(oomir::Constant::I32(layout.size as i32)),\n 5560 |         },\n 5561 |         oomir::Instruction::NewArray {\n 5562 |             dest: \"_objects\".to_string(),\n 5563 |             element_type: oomir::Type::Class(\"java/lang/Object\".to_string()),\n 5564 |             size: oomir::Operand::Constant(oomir::Constant::I32(layout.size.max(1) as i32)),","lines":6,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa49 {"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"In `load_constant` (`src/lower2/consts.rs`), the `OC::Slice`/`OC::Array` branches cast the element count directly with `elements.len() as i32` (line 401) and `array_len as i32` (line 430) with no bounds check. Every other place in this module/`lower2.rs` that turns a `usize` length into a JVM `i32` (e.g. `append_empty_array` in `src/lower2.rs`, and the offset conversion in the `OC::SliceRef` branch a few lines below at line 418) uses `i32::try_from(...).map_err(...)` to fail gracefully instead of silently truncating. A constant array/slice with more than `i32::MAX` elements would silently wrap to a negative length here, producing a corrupt `Newarray`/`Anewarray` size instead of a compiler error.","fix":"Replace `elements.len() as i32` and `array_len as i32` with `i32::try_from(elements.len())`/`i32::try_from(array_len)` mapped to a `jvm::Error::VerificationError`, matching the pattern already used a few lines below for the `SliceRef` offset and in `append_empty_array`.","locations":[{"ref":"src/lower2/consts.rs:389-403","code":"  389 |         OC::Slice(element_type, elements) => {\n  390 |             let class_index = cp.add_class(oomir::SLICE_VIEW_CLASS)?;\n  391 |             let constructor =\n  392 |                 cp.add_method_ref(class_index, \"<init>\", \"(Ljava/lang/Object;II)V\")?;\n  393 |             instructions_to_add.push(JI::New(class_index));\n  394 |             instructions_to_add.push(JI::Dup);\n  395 |             load_constant(\n  396 |                 &mut instructions_to_add,\n  397 |                 cp,\n  398 |                 &OC::Array(element_type.clone(), elements.clone()),\n  399 |             )?;\n  400 |             instructions_to_add.push(JI::Iconst_0);\n  401 |             instructions_to_add.push(get_int_const_instr(cp, elements.len() as i32));\n  402 |             instructions_to_add.push(JI::Invokes {"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"critical","difficulty":"easy","description":"In `src/optimise1/dataflow.rs`, `process_block_instructions` handles every `Instruction` variant by either updating or removing its destination's entry in `current_state` (the constant-propagation map) so that stale constants never survive a redefinition. Every instruction that can redefine a variable does this correctly (`Add`, `Sub`, `Move`, `ArrayGet`, `GetField`, `Cast`, `CallIndirect`, `InvokeStatic`, `InvokeRustStatic`, ...) except `Instruction::InvokeVirtual` (lines 1163-1192) and `Instruction::InvokeInterface` (lines 1282-1310). Both arms rewrite `args`/`operand` using propagated constants but never call `current_state.remove(dest)` for their own `dest`, and never run the conservative \"invalidate potentially-mutated constants\" pass that `InvokeStatic`/`InvokeRustStatic` (lines 1216-1260) and `CallIndirect` (lines 847-870) perform.\n\nConcretely: if a JVM local name is reused as the destination of an `InvokeVirtual`/`InvokeInterface` call after previously holding a known constant (e.g. it was constant-folded earlier in the same block, or the same variable name is reassigned by a virtual dispatch whose actual return is not constant), `current_state` keeps the *old* stale constant value for that name. Any later instruction in the block (or a successor block, since this state is exported as the block's out-state and merged into successor in-states) that reads that variable will have it folded to the wrong, stale constant. Given `InvokeVirtual`/`InvokeInterface` are the codegen path for essentially every trait/dyn method call and ordinary virtual method call, this is a real miscompilation risk, not just a missed optimization.\n\nThis is also inconsistent with `src/optimise1/copyprop.rs`'s `instruction_def`, which correctly treats `InvokeVirtual`/`InvokeInterface`'s `dest` as a definition - confirming the omission in `dataflow.rs` is an oversight rather than intentional.","fix":"Mirror the `InvokeStatic`/`InvokeRustStatic` handling: invalidate `dest` and conservatively drop non-primitive constants from `current_state` when the call could mutate aliased state. For example, in the `InvokeVirtual` arm:\n```rust\nInstruction::InvokeVirtual { dest, class_name, method_name, method_ty, args, operand } => {\n    let new_args: Vec<Operand> = args.iter()\n        .map(|arg| lookup_const(arg, &current_state).map_or(arg.clone(), Operand::Constant))\n        .collect();\n    let new_operand = lookup_const(operand, &current_state).map_or(operand.clone(), Operand::Constant);\n\n    if let Some(dest) = dest {\n        current_state.remove(dest);\n    }\n    // same conservative retain(...) as the InvokeStatic arm, since `operand`/args\n    // may be mutable references, slices, or trait objects.\n\n    optimised_instruction = Instruction::InvokeVirtual { dest: dest.clone(), class_name: class_name.clone(), method_name: method_name.clone(), method_ty: method_ty.clone(), args: new_args, operand: new_operand };\n    keep_original_instruction = true;\n}\n```\nApply the same pattern to `InvokeInterface`.","locations":[{"ref":"src/optimise1/dataflow.rs:1228-1257","code":" 1228 |             Instruction::InvokeVirtual {\n 1229 |                 dest,\n 1230 |                 class_name,\n 1231 |                 method_name,\n 1232 |                 method_ty,\n 1233 |                 args,\n 1234 |                 operand,\n 1235 |             } => {\n 1236 |                 // can't do any pre-eval or folding - yet. will add this later\n 1237 |                 // for now if args (Vec<Operand>) or Operand contain a variable that we've made constant, we need to update it to use the constant instead\n 1238 |                 // cause the variable doesn't exisit anymore\n 1239 | \n 1240 |                 let new_args: Vec<Operand> = args\n 1241 |                     .iter()\n 1242 |                     .map(|arg| {\n 1243 | {"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"hard","description":"`disambiguated_def_path_token` in `src/lower1/jvm_names.rs:75-83` builds a JVM identifier by mapping every `DefPath` component through `jvm_identifier` (which only ever produces `[A-Za-z0-9_]` and freely keeps existing underscores) and then joining the per-component strings with `\"_\"` via `.join(\"_\")`. Because `\"_\"` is both the join separator and a character `jvm_identifier` happily lets through unchanged, two structurally different `DefPath`s can collapse onto the exact same token: a two-segment path `[\"foo_bar\", \"baz\"]` and a two-segment path `[\"foo\", \"bar_baz\"]` both yield `\"foo_bar_baz\"`. This function is the sole input to the class name of every closure and coroutine (`closure_class_for_args`/`coroutine_class_for_args` in `src/lower1/jvm_names.rs:85-149`, which place the result directly under `crate_root` with no further per-function owner-class nesting), and it is also used as the mono-function base name for items nested in `DefKind::Fn | DefKind::AssocFn | DefKind::Closure` parents (`src/lower1/naming.rs:398-403`). The same ambiguous-join hazard is repeated for generic-argument tokens: `generic_tokens.join(\"_\")` in `src/lower1/naming.rs:281`, `src/lower1/naming.rs:420-424`, `src/lower1/jvm_names.rs:108-111` and `src/lower1/jvm_names.rs:141-144` joins `sanitize_name_token` outputs (which themselves may already contain underscores, e.g. `\"Vec_i32\"`) with the same separator used to join the different generic positions. Since `crate::stable_hash::readable_or_hashed_name` (see the separate finding on `src/stable_hash.rs:58-75`) discards its `identity` disambiguator whenever the readable name already fits under `max_len`, two genuinely different closures/coroutines/generic instantiations whose component strings differ but whose `\"_\"`-joined concatenation coincides will silently receive the identical JVM class or method name - th {"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In `src/optimise1/dataflow.rs`, the `CallIndirect` handler (lines 807-879) decides whether an indirect call could mutate aliased state by checking `has_potential_side_effect_arg` (lines 832-845), which only matches `Type::Array(_) | Type::Class(_)`. The equivalent check for `InvokeStatic`/`InvokeRustStatic` a few hundred lines later (`may_mutate_referenced_state`, lines 1220-1233) additionally matches `Type::Slice(_)`, `Type::MutableReference(_)`, and `Type::Interface(_)`.\n\nBecause `CallIndirect` is missing these three types, an indirect call (through a function pointer) that takes a `&mut T`, `&[T]`, or `dyn Trait` argument will not trigger the conservative invalidation of non-primitive constants in `current_state`, even though the callee could mutate the referenced data through that argument. Any other variable in `current_state` that (indirectly) aliases the same object keeps its previously known constant value across the call, which can later be folded into code, producing a miscompilation if the callee actually mutated that state.","fix":"Make the `CallIndirect` side-effect check match the `InvokeStatic` one:\n```rust\n// before\nif let Some(ty) = arg_type {\n    if matches!(ty, Type::Array(_) | Type::Class(_)) {\n        has_potential_side_effect_arg = true;\n        break;\n    }\n}\n\n// after\nif let Some(ty) = arg_type {\n    if matches!(\n        ty,\n        Type::Array(_) | Type::Slice(_) | Type::MutableReference(_) | Type::Class(_) | Type::Interface(_)\n    ) {\n        has_potential_side_effect_arg = true;\n        break;\n    }\n}\n```","locations":[{"ref":"src/optimise1/dataflow.rs:832-845","code":"  832 |                 // Determine if any argument could potentially have side effects\n  833 |                 let mut has_potential_side_effect_arg = false;\n  834 |                 for arg_operand in &new_args {\n  835 | {"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `cargo-jvm/src/lib.rs`, `run_java` propagates `RUST_BACKTRACE` to the JVM test process like this:\n```rust\nif test {\n    command.env(\n        \"RUST_BACKTRACE\",\n        env::var_os(\"RUST_BACKTRACE\").unwrap_or_default(),\n    );\n}\n```\nWhen the caller's environment does not have `RUST_BACKTRACE` set, `env::var_os` returns `None`, and `unwrap_or_default()` turns that into an empty `OsString`. The code then unconditionally calls `command.env(\"RUST_BACKTRACE\", \"\")`, setting the child's `RUST_BACKTRACE` to the empty string. Rust's standard library treats \"unset\" and \"0\" as disabling backtraces, but treats *any other value, including the empty string*, as enabling them (`v != \"0\"`). So every `cargo jvm test` invocation silently forces backtraces on for the test binary, even when the user never requested `RUST_BACKTRACE`, contradicting the apparent intent of \"pass through the user's setting.\"","fix":"Only set the variable when it is actually present, e.g.:\n```rust\nif test && let Some(value) = env::var_os(\"RUST_BACKTRACE\") {\n    command.env(\"RUST_BACKTRACE\", value);\n}\n```\nThis leaves the child's `RUST_BACKTRACE` unset (disabling backtraces, the default) when the user did not opt in, instead of forcing it to an empty string that `std` interprets as enabled.","locations":[{"ref":"cargo-jvm/src/lib.rs:1132-1147","code":" 1132 | fn run_java(jar: &Path, options: &JavaOptions, test: bool) -> DynResult<i32> {\n 1133 |     let mut command = Command::new(env::var_os(\"JAVA\").unwrap_or_else(|| OsString::from(\"java\")));\n 1134 |     command\n 1135 |         .arg(format!(\"-Xss{}\", options.stack))\n 1136 |         .args(&options.java_args)\n 1137 |         .arg(\"-jar\")\n 1138 |         .arg(jar)\n 1139 |         .args(&options.program_args);\n 1140 |     if test {\n 1141 |         command.env(\n 1142 |             \"RUST_BACKTRACE\",\n 1143 |             env::var_os(\"RUST_BACKTRACE\").unwrap_or_default(),\n 1144 |         );\n 1145 |     }\n 1146 |     Ok(command.status()?.code().unwrap_or(1))\n 1147 | }","lines":16,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/cargo-jvm/src/lib.rs#L1132-L1147"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `runtime/src/FileSystemSupport.java`, `open()` handles `creationMode >= 0` (an explicit POSIX permission mode was requested, e.g. via `OpenOptionsExt::mode`) on a filesystem that does not expose a `PosixFileAttributeView` (typically Windows, FAT/exFAT mounts, or some container filesystems):\n```java\n} else if (create && !createNew) {\n    Set<OpenOption> existingOptions = new HashSet<>(nioOptions);\n    existingOptions.remove(StandardOpenOption.CREATE);\n    try {\n        channel = FileChannel.open(path, existingOptions);\n    } catch (NoSuchFileException error) {\n        throw unsupportedCreationMode(path);\n    }\n} else {\n    throw unsupportedCreationMode(path);\n}\n```\nIf the target file does not already exist, this throws `UnsupportedOperationException` (surfaced to Rust as `ERROR_UNSUPPORTED`) instead of creating the file with the platform's default permissions and simply ignoring the requested mode bits (which is what real Unix/Windows implementations do when POSIX modes are meaningless for a filesystem). The `create_new` case (`createNew == true`) never even attempts the fallback open and always throws. The practical effect is that any `File::create`/`OpenOptionsExt::mode` call that targets a new file on a non-POSIX filesystem unconditionally fails, instead of succeeding with default permissions.","fix":"When the filesystem lacks a POSIX attribute view, fall back to creating the file with the plain `CREATE`/`CREATE_NEW` option set (ignoring the requested mode) instead of throwing `unsupportedCreationMode`, matching how other platforms silently ignore unsupported permission bits.","locations":[{"ref":"runtime/src/FileSystemSupport.java:230-253","code":"  230 |             if (creationMode >= 0 && (create || createNew)) {\n  231 |                 if ((creationMode & ~0777) != 0) {\n  232 |                     throw new IllegalArgumen ava:456-466","code":"  456 |     public static short expf16(short value) { return half(Math.exp(halfValue(value))); }\n  457 |     public static float expf32(float value) { return (float) Math.exp(value); }\n  458 |     public static double expf64(double value) { return Math.exp(value); }\n  459 |     public static F128 expf128(F128 value) { return F128.fromF64(Math.exp(value.castToF64())); }\n  460 | \n  461 |     public static short exp2f16(short value) { return half(Math.pow(2.0, halfValue(value))); }\n  462 |     public static float exp2f32(float value) { return (float) Math.pow(2.0, value); }\n  463 |     public static double exp2f64(double value) { return Math.pow(2.0, value); }\n  464 |     public static F128 exp2f128(F128 value) {\n  465 |         return F128.fromF64(Math.pow(2.0, value.castToF64()));\n  466 |     }","lines":11,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/runtime/src/Intrinsics.java#L456-L466"},{"ref":"runtime/src/Intrinsics.java:486-493","code":"  486 |     public static short sinf16(short value) { return half(Math.sin(halfValue(value))); }\n  487 |     public static float sinf32(float value) { return (float) Math.sin(value); }\n  488 |     public static double sinf64(double value) { return Math.sin(value); }\n  489 |     public static F128 sinf128(F128 value) { return F128.fromF64(Math.sin(value.castToF64())); }\n  490 |     public static short cosf16(short value) { return half(Math.cos(halfValue(value))); }\n  491 |     public static float cosf32(float value) { return (float) Math.cos(value); }\n  492 |     public static double cosf64(double value) { return Math.cos(value); }\n  493 |     public static F128 cosf128(F128 value) { return F128.fromF64(Math.cos(value.castToF64())); }","lines":8,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/runtime/src/Intrinsics.java#L486-L493"},{"ref":"runtime/src/Intrinsics.java:500-502","c {"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`NetworkSupport.tcpPeek` allocates a fixed-size peek buffer sized to whatever `length` was\nrequested on the *first* call that establishes `state.peeked` (see the `if (state.peekLength == 0)`\nblock). A later `tcpPeek` call with a larger `length` does not re-read from the socket; it just\nreturns `Math.min(checkedLength, state.peekLength)` bytes bounded by the old, smaller buffer,\neven though more data may already be available on the wire. This means a caller that first peeks\nwith a small buffer and then peeks again with a larger buffer (a legitimate pattern for\n`std::net::TcpStream::peek`) can silently get fewer bytes than are actually available instead of\nthe larger buffer's worth of data, differing from real OS-level `MSG_PEEK` semantics.","fix":"When `state.peekLength` is non-zero but smaller than `checkedLength`, top up the existing\n`state.peeked` buffer with an additional non-blocking/blocking read for the remaining\n`checkedLength - state.peekLength` bytes (growing `state.peeked`) before computing `count`,\ninstead of only reading fresh data when `state.peekLength == 0`.","locations":[{"ref":"runtime/src/NetworkSupport.java:452-481","code":"  452 |     public static long tcpPeek(long handle, Pointer destination, long length) {\n  453 |         try {\n  454 |             TcpState state = tcp(handle);\n  455 |             int checkedLength = checkedLength(length);\n  456 |             if (checkedLength == 0) {\n  457 |                 return 0;\n  458 |             }\n  459 |             byte[] result = new byte[checkedLength];\n  460 |             int count;\n  461 |             synchronized (state.readLock) {\n  462 |                 if (state.peekLength == 0) {\n  463 |                     byte[] peeked = new byte[checkedLength];\n  464 |                     ByteBuffer buffer = ByteBuffer.wrap(peeked);\n  465 |                     int read = readTcp(state, buffer);\n  466 |                     if (read == 0) {\n  467 |                         return 0;\n  468 |                     }\n  469 |                     state.peeked = peeked;\n  470 |                     state.peekOffset = 0;\n  471 |                     state.peekLength = read;\n  472 |                 }\n  473 |                 count = Math.min(checkedLength, state.peekLength);\n  474 |                 System.arraycopy(state.peeked, state.peekOffset, result, 0, count);\n  475 |             }\n  476 |             RuntimeSupport.copyBytes(result, count, destination);\n  477 |             return count;\n  478 |         } catch (Exception error) {\n  479 |             return fail(error);\n  480 |         }\n  481 |     }","lines":30,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/runtime/src/NetworkSupport.java#L452-L481"}]},

{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `emit_rust_drop_value`'s `Box` handling (`src/lower1/control_flow.rs:686-728`), the loop that unwraps `Box`'s internal carrier structs (`Box` -> `Unique<T>` -> `NonNull<T>` -> raw pointer/slice/str) is hardcoded to at most `for depth in 0..3` iterations, with no assertion afterwards that `pointer_ty` actually ended up as `oomir::Type::Pointer`/`Slice`/`Str`. The loop happens to work today because the current `Box` representation is exactly three struct layers deep, so it \"gets lucky\" and lands on the wanted carrier type right as the iteration budget runs out. If the generated `Box` representation ever gains one more wrapping layer (e.g. an extra newtype for FFI or niche optimization), this loop would silently stop one field short: `pointer_ty` would still be an intermediate wrapper-struct type, and the code below (`src/lower1/control_flow.rs:729-756`) would build `pointee_signature`/`dropBoxWithCleanup` arguments using that wrong non-pointer type, producing a JVM method call with a mismatched descriptor (verification error or `ClassCastException` at runtime) instead of a compile-time diagnostic pointing at the real cause.","fix":"After the loop, assert the invariant explicitly, e.g. `assert!(matches!(pointer_ty, oomir::Type::Pointer(_) | oomir::Type::Slice(_) | oomir::Type::Str), \"Box pointer carrier unwrapping did not reach a raw pointer after {depth} levels: {pointer_ty:?}\")`, or better, replace the fixed `0..3` bound with a `loop` that keeps unwrapping until `pointer_ty` matches `Pointer`/`Slice`/`Str` (with a sane upper bound purely as a safety net against malformed input, e.g. `32`), so a future representation change fails loudly during codegen instead of producing bad bytecode.","locations":[{"ref":"src/lower1/control_flow.rs:739-781","code":"  739 |                     for depth in 0..3 {\n  740 |                         if matches!(\n  741 |                             pointer_ty,\n  742 |                             oomir::Type::Pointer(_) | oomir::Type::Slice(_) | oomir::Type::Str\n  743 |                         ) {\n  744 |                             break;\n  745 |                         }\n  746 |                         let class_name = pointer_ty\n  747 |                             .get_class_name()\n  748 |                             .expect(\"Box pointer carrier must be a JVM class\")\n  749 |                             .to_string();\n  750 |                         let TyKind::Adt(carrier_def, carrier_args) = pointer_rust_ty.kind() else {\n  751 |                             panic!(\"Box pointer carrier {pointer_rust_ty:?} is not a struct\");\n  752 |                         };\n  753 |                         let field = carrier_def\n  754 |                             .variant(rustc_abi::VariantIdx::from_usize(0))\n  755 |                             .fields\n  756 |                             .iter()\n  757 |                             .next()\n  758 |                             .expect(\"Box pointer carrier must have a field\");\n  759 |                         let field_name = field.ident(tcx).to_string();\n  760 |                         let field_rust_ty = field.ty(tcx, carrier_args).skip_norm_wip();\n  761 |                         let field_ty = super::types::ty_to_oomir_type(\n  762 |                             field_rust_ty,\n  763 |                             tcx,\n  764 |                             data_types,\n  765 |                             instance,\n  766 |                         );\n  767 |                         let dest = format!(\"{temp_prefix}_box_pointer_{depth}\");\n  768 |                         instructions.push(oomir::Instruction::GetField {\n  769 |                             dest: dest.clone(),\n  770 |                             object: pointer,\n  771 |                             field_name,\n  772 |                             field_ty: field_ty.clone(),\n  773 |                             owner_class: class_name,\n  774 |                         });\n  775 |                         pointer = oomir::Operand::Variable {\n  776 |                             name: dest,\n  777 |                             ty: field_ty.clone(),\n  778 |                         };\n  779 |                         pointer_ty = field_ty;\n  780 |                         pointer_rust_ty = field_rust_ty;\n  781 |                     }","lines":43,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/src/lower1/control_flow.rs#L739-L781"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `handle_constant_enum`'s `TagEncoding::Direct` handling (`src/lower1/operand/const_eval.rs:2639-2665`), the loop that matches the read tag bits against every variant's discriminant is supposed to detect an ambiguous match (two variants sharing the same masked discriminant) via `if found_idx.is_some() { return Err(...) }`. However the loop `break`s immediately after setting `found_idx = Some(v_idx)` on the very first match (line 2660), so the loop never runs a second iteration with `found_idx` already `Some(_)` - the `found_idx.is_some()` check at line 2656 can never be true, and `return Err(format!(\"Ambiguous match found for enum variant\"))` at line 2657 is dead code. If a layout ever produced two variants with colliding masked discriminants, this code would silently pick whichever variant happens to be iterated first instead of erroring out as intended.","fix":"Remove the early `break` so the loop keeps scanning after finding a match, which lets the `found_idx.is_some()` guard actually detect a second, colliding match. Change:\n```\n                    let mut found_idx = None;\n                    for (v_idx, v_discr) in adt_def.discriminants(tcx) {\n                        ...\n                        if read_tag_bits == canonical_discr_val_masked {\n                            if found_idx.is_some() {\n                                return Err(format!(\"Ambiguous match found for enum variant\"));\n                            }\n                            found_idx = Some(v_idx);\n                            break;\n                        }\n                    }\n```\nto:\n```\n                    let mut found_idx = None;\n                    for (v_idx, v_discr) in adt_def.discriminants(tcx) {\n                        ...\n                        if read_tag_bits == canonical_discr_val_masked {\n                            if found_idx.is_some() {\n                                return Err(\"Ambiguous match found for enum variant\".to_string());\n                            }\n                            found_idx = Some(v_idx);\n                        }\n                    }\n```\n(also drop the now-useless `format!` in favor of `.to_string()`, since the string has no interpolation).","locations":[{"ref":"src/lower1/operand/const_eval.rs:2637-2663","code":" 2637 |                     let mut found_idx = None;\n 2638 |                     for (v_idx, v_discr) in adt_def.discriminants(tcx) {\n 2639 |                         let mask = if tag_size.bits() == 128 {\n 2640 |                             u128::MAX\n 2641 |                         } else {\n 2642 |                             (1u128 << tag_size.bits()) - 1\n 2643 |                         };\n 2644 |                         let canonical_discr_val_masked = v_discr.val & mask;\n 2645 |                         breadcrumbs::log!(\n 2646 |                             breadcrumbs::LogLevel::Info,\n 2647 |                             \"const-eval\",\n 2648 |                             format!(\n 2649 |                                 \"Debug: Comparing read_tag_bits {:#x} with variant {:?} discriminant {:#x} (masked: {:#x})\",\n 2650 |                                 read_tag_bits, v_idx, v_discr.val, canonical_discr_val_masked\n 2651 |                             )\n 2652 |                         );\n 2653 |                         if read_tag_bits == canonical_discr_val_masked {\n 2654 |                             if found_idx.is_some() {\n 2655 |                                 return Err(format!(\"Ambiguous match found for enum variant\"));\n 2656 |                             }\n 2657 |                             found_idx = Some(v_idx);\n 2658 |                             break;\n 2659 |                         }\n 2660 |                     }\n 2661 |                     active_variant_idx =\n 2662 |                         found_idx.ok_or_else(|| \"No matching variant found\".to_string())?;\n 2663 |                 } // End Direct Encoding","lines":27,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/src/lower1/operand/const_eval.rs#L2637-L2663"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`outline_function` unconditionally skips outlining whenever `function.name == \"<init>\"` (`src/lower2/large_methods.rs:65`: `if total_cost <= MAX_CHUNK_COST || function.name == \"<init>\" { return Ok(vec![function]); }`), with no comment explaining why and no fallback diagnostic. Any Rust constructor path (`fn new`, `Default::default()`, large struct/array literal initialization, etc.) that lowers to a JVM `<init>` method large enough to need splitting will silently bypass the size-limit safety net this file exists to provide, and can still exceed the JVM's 65536-byte method-length limit with no earlier, actionable error - failing only much later during bytecode emission.","fix":"At minimum, when `total_cost > MAX_CHUNK_COST && function.name == \"<init>\"`, return a `verification_error` explaining that the constructor is too large to compile for the JVM target (constructors cannot currently be split because outlined chunks would observe `this` before the required `super()`/`this()` call), so the failure surfaces at a well-defined point with a clear message instead of downstream during bytecode writing. Longer-term, consider allowing constructors to be split for the portion of the body *after* the mandatory `super`/`this` call, which is where oversized initialization logic (e.g. large field initializer chains) actually lives.","locations":[{"ref":"src/lower2/large_methods.rs:65","code":"   65 |     if total_cost <= MAX_CHUNK_COST || function.name == \"<init>\" {","lines":1,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/src/lower2/large_methods.rs#L65"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`Module::insert_function` in `src/oomir.rs` (lines 60-67) uses `self.functions.entry(key).or_insert(function)`, so if a second `Function` is ever inserted under a `FunctionKey` (owner class + method name + descriptor) that already exists in the map, it is silently dropped with no log, warning, or assertion. If two genuinely different lowered functions ever collide on the same key (a lowering bug, a hash/name-collision, or two crates producing the same synthetic helper with different bodies), the compiler will silently keep whichever definition happened to be inserted first and discard the other, which can produce a working-but-wrong binary rather than a build error.","fix":"Log a warning (or, in debug builds, assert the two `Function` bodies are identical) when `insert_function` finds an existing entry for the same `FunctionKey`, so unexpected collisions are visible instead of silently resolved by first-write-wins.","locations":[{"ref":"src/oomir.rs:73-80","code":"   73 |     pub fn insert_function(&mut self, function: Function) {\n   74 |         let key = FunctionKey::new(\n   75 |             function.owner_class.as_deref().unwrap_or(&self.name),\n   76 |             &function.name,\n   77 |             &function.signature,\n   78 |         );\n   79 |         self.functions.entry(key).or_insert(function);\n   80 |     }","lines":8,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/src/oomir.rs#L73-L80"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`src/oomir.rs` derives `PartialEq` for `Constant` (line 618-619) but then adds `impl Eq for Constant {}` unconditionally (line 736). Because `Constant` contains `F32(f32)`/`F64(f64)` variants, the derived `PartialEq` uses IEEE-754 comparison, under which `NaN != NaN`, i.e. `a == a` is not always true. This violates the `Eq` contract (which requires reflexivity), while the manual `Hash` impl (lines 762-929) hashes floats via `to_bits()`, so two bit-identical NaN constants hash identically but compare unequal.\n\nThis is not just theoretical: `Instruction`/`Operand` both derive `Hash + Eq` and recursively contain `Constant`, and `src/optimise1/reorganisation.rs::eliminate_duplicate_basic_blocks` uses `HashMap<Vec<Instruction>, Vec<String>>` to detect and merge duplicate basic blocks. Two basic blocks that are otherwise byte-for-byte identical but contain a NaN float constant will land in the same hash bucket (same hash) but fail the equality check used to merge them into one dedup group, silently defeating deduplication for those blocks. It is not a miscompilation today (the redundant block is simply kept), but the `Eq`/`Hash` contract violation is a latent hazard for any future code that relies on `Constant`/`Operand`/`Instruction` set/map semantics assuming a lawful `Eq`.","fix":"Give `Constant`'s float variants a total-order-respecting equality (e.g. compare via `f32::to_bits`/`f64::to_bits`, matching how they are already hashed, similar to the pattern used by the `ordered-float` crate) instead of deriving `PartialEq` directly, so `Eq`'s reflexivity actually holds and `Hash`/`Eq` stay consistent for NaN payloads.","locations":[{"ref":"src/oomir.rs:748-749","code":"  748 | #[derive(Debug, Clone, PartialEq)]\n  749 | pub enum Constant {","lines":2,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9 {"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `src/optimise1/dataflow.rs`, the `Sub` handler's \"a - a = 0\" special case (lines 219-229) and the `Div` handler's \"a / a = 1\" special case (lines 394-406) both guard the fold with `Constant::zero_for_operand(&new_op1)` / `Constant::one_for_operand(&new_op1)`. Both helpers (`src/oomir.rs:983-1010`) only return `Some(..)` when the operand is already `Operand::Constant(..)`; for a plain `Operand::Variable` (the actual \"same variable used twice\" case the comments describe, e.g. literal `x - x` or `x / x` in source) they return `None`, so the fold silently never fires.\n\nThis makes the branch effectively dead code for its stated purpose (the comments \"careful with float\" / \"Again, careful with float, identity vs value. Assume ok for now.\" show the author was aware this needs to special-case NaN-producing floats but never actually wired up a variable-based fold). It happens to be safe today only because the guard is coincidentally always false for the variable case, and because IEEE754 float constants also never compare equal to themselves as NaN (so even the reachable Constant-vs-Constant path can't misfire on NaN). A future maintainer \"fixing\" `zero_for_operand`/`one_for_operand` to also derive a zero/one from an `Operand::Variable`'s type (to make the optimization actually work as commented) would silently reintroduce a real correctness bug: `x - x` and `x / x` are not always `0`/`1` when `x` is a NaN float at runtime.","fix":"Either remove the dead `new_op1 == new_op2` branches (since they never fire for the variable case and are subsumed by the final constant-folding branch for the constant case), or explicitly implement the variable case with a type check that excludes `Type::F32`/`Type::F64` (and any i128/u128 float-adjacent types) before assuming `x - x == 0` / `x / x == 1`, and add a comment explaining why floats must be excluded so a future edit does not regress this silently.","locations":[{"ref":"src/optimise1/dataflow.rs:219-229","code":"  219 |                 } else if new_op1 == new_op2 {\n  220 |                     // a - a = 0 (Check operand equality - careful with float)\n  221 |                     if let Some(zero_const) = Constant::zero_for_operand(&new_op1) {\n  222 |                         // Get zero of the correct type\n  223 |                         optimised_instruction = Instruction::Move {\n  224 |                             dest: dest.clone(),\n  225 |                             src: Operand::Constant(zero_const.clone()),\n  226 |                         };\n  227 |                         current_state.insert(dest.clone(), zero_const);\n  228 |                         simplified_algebraically = true;\n  229 |                     }","lines":11,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/src/optimise1/dataflow.rs#L219-L229"},{"ref":"src/optimise1/dataflow.rs:394-406","code":"  394 |                 } else if new_op1 == new_op2 {\n  395 |                     // a / a = 1 (where a != 0)\n  396 |                     // Again, careful with float, identity vs value. Assume ok for now.\n  397 |                     if let Some(one_const) = Constant::one_for_operand(&new_op1) {\n  398 |                         // Get one of the correct type\n  399 |                         optimised_instruction = Instruction::Move {\n  400 |                             dest: dest.clone(),\n  401 |                             src: Operand::Constant(one_const.clone()),\n  402 |                         };\n  403 |                         current_state.insert(dest.clone(), one_const);\n  404 |                         simplified_algebraically = true;\n  405 |                     }\n  406 |                 }","lines":13,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/src/optimi {"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`futex_wait` in `std/overlay/std/src/sys/pal/jvm/futex.rs:21-26` collapses two different conditions into the same sentinel value. The timeout is computed with:\n\n```rust\nlet timeout_nanos = timeout\n    .and_then(|duration| i64::try_from(duration.as_nanos()).ok())\n    .unwrap_or(-1);\n```\n\n`unwrap_or(-1)` fires both when `timeout` is `None` (caller wants to block forever, which is the documented meaning of `-1` on the JVM side) and when `timeout` is `Some(duration)` but `duration.as_nanos()` does not fit in an `i64` (roughly any `Duration` longer than about 292 years). In `runtime/src/ThreadSupport.java`'s `futexWait`, `timeoutNanos < 0` is treated as \"wait with no timeout\" (`monitor.wait()` with no arguments). So a caller that explicitly requested a very large but finite timeout (for example via `Condvar::wait_timeout` or a saturating duration built from arithmetic) silently gets an unbounded wait instead of one that eventually expires, violating the documented contract of `futex_wait`'s `timeout` parameter.","fix":"Only use `-1` for the `None` case; clamp an out-of-range `Some(duration)` to `i64::MAX` instead of silently treating it as infinite:\n\n```rust\nlet timeout_nanos = match timeout {\n    None => -1,\n    Some(duration) => i64::try_from(duration.as_nanos()).unwrap_or(i64::MAX),\n};\n```","locations":[{"ref":"std/overlay/std/src/sys/pal/jvm/futex.rs:21-26","code":"   21 | pub fn futex_wait(futex: &Atomic<u32>, expected: u32, timeout: Option<Duration>) -> bool {\n   22 |     let timeout_nanos = timeout\n   23 |         .and_then(|duration| i64::try_from(duration.as_nanos()).ok())\n   24 |         .unwrap_or(-1);\n   25 |     unsafe { jvm_futex_wait(futex.as_ptr(), expected, timeout_nanos) }\n   26 | }","lines":6,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/std/overlay/std/src/sys/pal/jvm/futex.rs#L21-L26"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`Thread::join` in `std/overlay/std/src/sys/thread/jvm.rs:55-64` consumes `self` by value but never prevents the ordinary `Drop::drop` glue from running afterward:\n\n```rust\npub fn join(self) {\n    unsafe { jvm_join(self.handle) };\n}\n```\n\nBecause `self` is not moved out or wrapped in `ManuallyDrop`/`mem::forget`, when `join` returns, `self` is dropped at the end of the function, which invokes `impl Drop for Thread { fn drop(&mut self) { unsafe { jvm_detach(self.handle) } } }`. So every call to `join()` is followed by an unconditional call to `jvm_detach` on the same handle. Upstream `std` (e.g. the pthread implementation) explicitly guards against this with `mem::forget(self)` in `into_id()` precisely because calling `detach` on an already-joined thread handle is invalid in general. Here it happens to be harmless only because `ThreadSupport.detach` in `runtime/src/ThreadSupport.java:151-165` does `THREADS.remove(id)` and no-ops when the id is already absent (which it is, since `join` already removed it via `THREADS.remove(id, record)`). This is a fragile coincidence rather than an intentional contract: it wastes a native call plus a `ConcurrentHashMap` lookup on every `join()`, and it would become a real bug (double-free-like reuse of a \"detach\" affecting the wrong thread record, or a thrown exception on an unexpected double-remove) if the Java-side `detach` implementation is ever tightened to assert the id is still live.","fix":"Mirror upstream's pattern: skip the `Drop` impl when the handle has already been joined, e.g.:\n\n```rust\npub fn join(self) {\n    let this = mem::ManuallyDrop::new(self);\n    unsafe { jvm_join(this.handle) };\n}\n```\n\nThis avoids the redundant `jvm_detach` call and matches the safety assumption that a handle is consumed exactly once by either `join` or `drop`.","locations":[{"ref":"std/overlay/std/src/sys/thre {"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`Intrinsics.simdCompare` (`runtime/src/Intrinsics.java:225-268`) takes an `operation` `String`\nparameter but the lane-comparison result only ever distinguishes `\"simd_ne\"` from everything else:\n`setMaskLane(result, lane, operation.equals(\"simd_ne\") ? !equal : equal);` (line 261). Any operation\nstring other than `\"simd_ne\"` (including a typo, or a future `\"simd_lt\"`/`\"simd_gt\"`/`\"simd_le\"`/\n`\"simd_ge\"` caller) is silently treated as `\"simd_eq\"` instead of raising an error. Today this is\nonly reachable via `simd_eq`/`simd_ne` per the caller-side gate in\n`src/lower1/control_flow.rs:5022`, but the Java method itself has no validation, so it fails silent\nand wrong (producing an equality mask) rather than fast and loud if that calling contract is ever\nbroadened.","fix":"Validate `operation` explicitly (`if (!operation.equals(\"simd_eq\") && !operation.equals(\"simd_ne\")) throw new IllegalArgumentException(...)`) instead of implicitly treating every non-`\"simd_ne\"` value as equality.","locations":[{"ref":"runtime/src/Intrinsics.java:225-268","code":"  225 |     public static Object simdCompare(\n  226 |             String operation,\n  227 |             Object leftVector,\n  228 |             Object rightVector,\n  229 |             String resultClassName) {\n  230 |         if (leftVector.getClass() != rightVector.getClass()) {\n  231 |             throw new IllegalArgumentException(\"SIMD comparison requires matching vector types\");\n  232 |         }\n  233 |         SimdPlan inputPlan = SIMD_PLANS.get(leftVector.getClass());\n  234 |         Object left = inputPlan.lanes(leftVector);\n  235 |         Object right = inputPlan.lanes(rightVector);\n  236 |         int length = java.lang.reflect.Array.getLength(left);\n  237 |         if (length != java.lang.reflect.Array.getLength(right)) {\n  238 |             throw new IllegalA
