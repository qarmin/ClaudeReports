{"id":"OTHER_1","type":"other","type_label":"Other","severity":"high","difficulty":"medium","description":"`CONSTANT_ALLOCATION_IDENTITIES` (`src/lower1/operand/const_eval.rs:31-32`) is a process-global `static LazyLock<Mutex<HashMap<(String, AllocId), String>>>` that memoizes the canonical identity string assigned to a given `(crate_name, AllocId)` pair via `canonical_allocation_identity` (lines 34-42, `.entry(key).or_insert(candidate)`). Unlike the sibling per-compilation caches in `src/lower1/types.rs` (`TYPE_LOWERING_CACHE`/`ENUM_TYPES_IN_PROGRESS`, both `thread_local!` and explicitly cleared by `reset_type_lowering_cache()`, which `src/lib.rs:1172` calls at the start of building each new `oomir::Module`/crate), this map is never cleared anywhere in the codebase. `AllocId` values are small integers allocated fresh from each `TyCtxt`'s interner and are expected to be reused/restart across separate compilation sessions in the same process (this is precisely why `TYPE_LOWERING_CACHE`, which is also keyed by raw interned addresses, needs an explicit reset). If the codegen backend's process ever compiles more than one crate/session with the same `LOCAL_CRATE` name (e.g. an embedding driver that reuses the process for multiple `rustc_interface::run_compiler` calls, or a test harness compiling many fixtures under the same crate name), a stale `(crate_name, AllocId)` entry from a previous, unrelated compilation can be returned via `or_insert` for a completely different allocation in the new session, silently mislabeling constants and corrupting the identity used to intern/deduplicate constant backing storage (`preserve_slice_allocation`, `interned_pointer_for_full_allocation`, `interned_pointer_for_memory_view`, `anonymous_memory_pointer_constant` all rely on this identity being correct for the current session).","fix":"Give `CONSTANT_ALLOCATION_IDENTITIES` a reset function analogous to `reset_type_lowering_cache()` (e.g. `pub(crate) fn reset_constant_allocation_identities() { CONSTANT_ALLOCATION_IDENTITIES.lock().expect(...).clear(); }`) and call it from the same place `src/lib.rs` calls `lower1::types::reset_type_lowering_cache()` at the start of each compilation/module. Consider also switching it to a `thread_local!` `RefCell` like `TYPE_LOWERING_CACHE` if cross-thread sharing within one compilation is not actually required, which would make the per-compilation lifetime explicit and remove the `Mutex` poisoning `.expect(...)` panic risk at line 38 as a side benefit.","locations":[{"ref":"src/lower1/operand/const_eval.rs:31-42","code":"   31 | static CONSTANT_ALLOCATION_IDENTITIES: LazyLock<Mutex<HashMap<(String, AllocId), String>>> =\n   32 |     LazyLock::new(|| Mutex::new(HashMap::default()));\n   33 | \n   34 | fn canonical_allocation_identity(tcx: TyCtxt<'_>, alloc_id: AllocId, candidate: String) -> String {\n   35 |     let key = (tcx.crate_name(LOCAL_CRATE).to_string(), alloc_id);\n   36 |     CONSTANT_ALLOCATION_IDENTITIES\n   37 |         .lock()\n   38 |         .expect(\"constant allocation identity cache was poisoned\")\n   39 |         .entry(key)\n   40 |         .or_insert(candidate)\n   41 |         .clone()\n   42 | }","lines":12,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/src/lower1/operand/const_eval.rs#L31-L42"}]},
{"id":"OTHER_2","type":"other","type_label":"Other","severity":"high","difficulty":"hard","description":"`topological_components` in `src/lower2/large_methods.rs:903-1009` computes reachability and a topological order over strongly-connected components using two *recursive* DFS helpers: the inner `fn visit` (`src/lower2/large_methods.rs:907-922`), which recurses once per successor edge over the raw basic-block graph, and the inner `fn topo_visit` (`src/lower2/large_methods.rs:982-995`), which recurses over the component DAG. Neither has any depth bound, and the recursion is not tail-recursive (each frame does work - `order.push(...)` - after the recursive calls return), so Rust cannot optimize it into a loop. `outline_function` is only invoked for functions whose OOMIR cost already exceeds `MAX_CHUNK_COST` (900), i.e. functions with many basic blocks by construction; a common source of many basic blocks in generated Rust code is implicit bounds-check/overflow-check/drop-glue branches inserted around otherwise straight-line statements, which produces long near-linear chains in the CFG. A sufficiently long chain (a few thousand blocks, easily reached in a single large generated function such as the one in `tests/binary/large_methods/src/main.rs`) will recurse `visit` once per block on the native stack with no explicit stack-size adjustment anywhere in the codebase (confirmed via `grep -rn \"stack_size\\|with_stack\"` over `src/`), risking a real stack overflow (process abort/crash) in exactly the scenario this module exists to handle safely.","fix":"Rewrite both `visit` and `topo_visit` as iterative post-order traversals using an explicit `Vec`-backed work stack (the classic \"push node, then push unvisited children, track a second visited-children marker\" pattern, or a two-phase stack of `(node, child_iterator_index)` frames) instead of native recursion. This preserves the exact same post-order/topological semantics (including the `targets.sort()` / `BTreeSet` iteration order already used for determinism) while bounding stack usage by the heap-allocated work stack rather than the OS thread stack.","locations":[{"ref":"src/lower2/large_methods.rs:911-926","code":"  911 |     fn visit(\n  912 |         node: &str,\n  913 |         successors: &HashMap<String, Vec<String>>,\n  914 |         visited: &mut HashSet<String>,\n  915 |         order: &mut Vec<String>,\n  916 |     ) {\n  917 |         if !visited.insert(node.to_string()) {\n  918 |             return;\n  919 |         }\n  920 |         let mut targets = successors[node].clone();\n  921 |         targets.sort();\n  922 |         for target in targets {\n  923 |             visit(&target, successors, visited, order);\n  924 |         }\n  925 |         order.push(node.to_string());\n  926 |     }","lines":16,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/src/lower2/large_methods.rs#L911-L926"},{"ref":"src/lower2/large_methods.rs:986-999","code":"  986 |     fn topo_visit(\n  987 |         component: usize,\n  988 |         dag: &[BTreeSet<usize>],\n  989 |         visited: &mut HashSet<usize>,\n  990 |         order: &mut Vec<usize>,\n  991 |     ) {\n  992 |         if !visited.insert(component) {\n  993 |             return;\n  994 |         }\n  995 |         for successor in &dag[component] {\n  996 |             topo_visit(*successor, dag, visited, order);\n  997 |         }\n  998 |         order.push(component);\n  999 |     }","lines":14,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/src/lower2/large_methods.rs#L986-L999"}]},
{"id":"OTHER_3","type":"other","type_label":"Other","severity":"high","difficulty":"hard","description":"`std/overlay/std/src/sys/fs/jvm.rs::last_error` (lines 1038-1044) reconstructs an `io::Error` from three separate FFI calls - `jvm_last_error_kind()`, `jvm_last_error_message_length()`, `jvm_copy_last_error_message()` - each independently reading what appears to be a single shared \"last error\" slot on the JVM side (`FileSystemSupport`). This function is called from essentially every fallible filesystem operation in the file (`result_code`, `result_count`, `result_position`, `result_handle`, `try_lock_result`, `exists`, ...). Rust programs compiled by this backend can use real OS threads (`std::thread`); if the JVM-side \"last error\" state is a plain static field rather than being thread-local, two threads performing filesystem operations concurrently can race on it: thread A's failing call sets the error, thread B's failing (or even successful, if it clears/overwrites the slot) call runs before thread A reads it back, and thread A ends up constructing an `io::Error` describing thread B's failure (wrong `ErrorKind` and wrong message) instead of its own. This is a classic non-thread-local-errno bug pattern and, if present on the runtime side, silently corrupts error reporting under concurrency rather than crashing, making it hard to notice.","fix":"Verify (or make) the JVM-side `FileSystemSupport` last-error state thread-local (e.g. backed by a `ThreadLocal<LastError>` in the runtime support class) so each Rust OS thread observes only its own most recent filesystem error; if it is already thread-local, add a comment here documenting that invariant so it is not accidentally broken later.","locations":[{"ref":"std/overlay/std/src/sys/fs/jvm.rs:1038-1044","code":" 1038 | fn last_error() -> io::Error {\n 1039 |     let length = unsafe { jvm_last_error_message_length() };\n 1040 |     let mut bytes = vec![0; length];\n 1041 |     unsafe { jvm_copy_last_error_message(bytes.as_mut_ptr()) };\n 1042 |     let message = unsafe { String::from_utf8_unchecked(bytes) };\n 1043 |     io::Error::new(error_kind(unsafe { jvm_last_error_kind() }), message)\n 1044 | }","lines":7,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/std/overlay/std/src/sys/fs/jvm.rs#L1038-L1044"},{"ref":"std/overlay/std/src/sys/fs/jvm.rs:1030-1036","code":" 1030 | fn try_lock_result(code: i32) -> Result<(), TryLockError> {\n 1031 |     match code {\n 1032 |         0 => Ok(()),\n 1033 |         1 => Err(TryLockError::WouldBlock),\n 1034 |         _ => Err(TryLockError::Error(last_error())),\n 1035 |     }\n 1036 | }","lines":7,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/std/overlay/std/src/sys/fs/jvm.rs#L1030-L1036"},{"ref":"std/overlay/std/src/sys/fs/jvm.rs:984-1015","code":"  984 | fn result_code(code: i32) -> io::Result<()> {\n  985 |     if code < 0 {\n  986 |         Err(last_error())\n  987 |     } else {\n  988 |         Ok(())\n  989 |     }\n  990 | }\n  991 | \n  992 | fn result_count(value: i64) -> io::Result<usize> {\n  993 |     if value < 0 {\n  994 |         Err(last_error())\n  995 |     } else {\n  996 |         usize::try_from(value)\n  997 |             .map_err(|_| io::Error::new(io::ErrorKind::InvalidData, \"JVM byte count overflow\"))\n  998 |     }\n  999 | }\n 1000 | \n 1001 | fn result_position(value: i64) -> io::Result<u64> {\n 1002 |     if value < 0 {\n 1003 |         Err(last_error())\n 1004 |     } else {\n 1005 |         Ok(value as u64)\n 1006 |     }\n 1007 | }\n 1008 | \n 1009 | fn result_handle(value: i64) -> io::Result<u64> {\n 1010 |     if value <= 0 {\n 1011 |         Err(last_error())\n 1012 |     } else {\n 1013 |         Ok(value as u64)\n 1014 |     }\n 1015 | }","lines":32,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/std/overlay/std/src/sys/fs/jvm.rs#L984-L1015"}]},
{"id":"OTHER_4","type":"other","type_label":"Other","severity":"medium","difficulty":"easy","description":"`Tester.py`'s `terminate_process_tree` is named and used as if it kills an entire process tree, but on POSIX it only kills the single `java` process:\n```python\ndef terminate_process_tree(process: subprocess.Popen[bytes]) -> None:\n    if os.name == \"nt\":\n        subprocess.run([\"taskkill\", \"/PID\", str(process.pid), \"/T\", \"/F\"], ...)\n    else:\n        try:\n            process.kill()\n        except ProcessLookupError:\n            pass\n```\nOn Windows, `taskkill /T` kills the whole tree; on POSIX there is no equivalent (`os.killpg`/process-group kill), so if a timed-out `java` process has spawned children, they are left running and orphaned after the test harness moves on. Over a CI run with many timeouts this can leak runaway JVM/child processes.","fix":"On POSIX, start the `java` process in its own process group (e.g. `Popen(..., start_new_session=True)`) and kill the group with `os.killpg(os.getpgid(process.pid), signal.SIGKILL)` in `terminate_process_tree`, so the behavior actually matches the function's name on both platforms.","locations":[{"ref":"Tester.py:133-145","code":"  133 | def terminate_process_tree(process: subprocess.Popen[bytes]) -> None:\n  134 |     if os.name == \"nt\":\n  135 |         subprocess.run(\n  136 |             [\"taskkill\", \"/PID\", str(process.pid), \"/T\", \"/F\"],\n  137 |             stdout=subprocess.DEVNULL,\n  138 |             stderr=subprocess.DEVNULL,\n  139 |             check=False,\n  140 |         )\n  141 |     else:\n  142 |         try:\n  143 |             process.kill()\n  144 |         except ProcessLookupError:\n  145 |             pass","lines":13,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/Tester.py#L133-L145"}]},
{"id":"OTHER_5","type":"other","type_label":"Other","severity":"medium","difficulty":"medium","description":"`RuntimeSupport.environmentValueLength` (lines 85-88) and `RuntimeSupport.copyEnvironmentValue` (lines 90-98) implement the classic length-then-copy protocol: Rust first calls `environmentValueLength` to size a buffer, then calls `copyEnvironmentValue` to fill it. Both calls independently invoke the synchronized helper `environmentValue(key)` (lines 116-124), but nothing keeps the two calls atomic with respect to each other. If another thread calls `setEnvironment` (line 100) or `removeEnvironment` (line 109) between the two calls, the value read by `copyEnvironmentValue` can be a different length than what `environmentValueLength` reported. `copyEnvironmentValue` then calls `copyBytes(value.getBytes(...), destination)` (line 97) which writes the *actual* value's full length into a `destination` buffer that Rust sized for the *previously observed* length, causing an out-of-bounds write into the Rust-allocated buffer.\n\nThe codebase already solves this exact problem correctly elsewhere via `beginEnvironmentSnapshot`/`endEnvironmentSnapshot` (lines 126-141, 163-167), which take an atomic point-in-time snapshot for bulk environment iteration - but the single-key lookup path was never given the same treatment.","fix":"Give single-key lookups the same atomic-snapshot treatment as `beginEnvironmentSnapshot`: e.g. add a `synchronized` method that returns both the length and bytes together (or a snapshot handle) in one call, so Rust never has to trust a length obtained from an earlier, now possibly-stale call. For example, expose:\n\n```java\npublic static synchronized byte[] snapshotEnvironmentValue(Pointer keyBytes, long keyLength) {\n    String key = utf8(keyBytes, keyLength);\n    String value = environmentValue(key);\n    return value == null ? null : value.getBytes(StandardCharsets.UTF_8);\n}\n```\n\nand have the Rust side call this once, cache the returned byte array/length pair, and copy from that cached array - removing the two-call TOCTOU window entirely.","locations":[{"ref":"runtime/src/RuntimeSupport.java:85-124","code":"   85 |     public static long environmentValueLength(Pointer keyBytes, long keyLength) {\n   86 |         String value = environmentValue(utf8(keyBytes, keyLength));\n   87 |         return value == null ? -1 : value.getBytes(StandardCharsets.UTF_8).length;\n   88 |     }\n   89 | \n   90 |     public static void copyEnvironmentValue(\n   91 |             Pointer keyBytes, long keyLength, Pointer destination) {\n   92 |         String key = utf8(keyBytes, keyLength);\n   93 |         String value = environmentValue(key);\n   94 |         if (value == null) {\n   95 |             throw new IllegalStateException(\"environment variable disappeared: \" + key);\n   96 |         }\n   97 |         copyBytes(value.getBytes(StandardCharsets.UTF_8), destination);\n   98 |     }\n   99 | \n  100 |     public static synchronized void setEnvironment(\n  101 |             Pointer keyBytes, long keyLength, Pointer valueBytes, long valueLength) {\n  102 |         String key = utf8(keyBytes, keyLength);\n  103 |         String value = utf8(valueBytes, valueLength);\n  104 |         validateEnvironmentKey(key);\n  105 |         ENVIRONMENT_OVERRIDES.put(key, value);\n  106 |         REMOVED_ENVIRONMENT.remove(key);\n  107 |     }\n  108 | \n  109 |     public static synchronized void removeEnvironment(Pointer keyBytes, long keyLength) {\n  110 |         String key = utf8(keyBytes, keyLength);\n  111 |         validateEnvironmentKey(key);\n  112 |         ENVIRONMENT_OVERRIDES.remove(key);\n  113 |         REMOVED_ENVIRONMENT.add(key);\n  114 |     }\n  115 | \n  116 |     private static synchronized String environmentValue(String key) {\n  117 |         if (ENVIRONMENT_OVERRIDES.containsKey(key)) {\n  118 |             return ENVIRONMENT_OVERRIDES.get(key);\n  119 |         }\n  120 |         if (REMOVED_ENVIRONMENT.contains(key)) {\n  121 |             return null;\n  122 |         }\n  123 |         return System.getenv(key);\n  124 |     }","lines":40,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/runtime/src/RuntimeSupport.java#L85-L124"}]},
{"id":"OTHER_6","type":"other","type_label":"Other","severity":"medium","difficulty":"medium","description":"`static TUPLE_ABIS_BY_READABLE_NAME: LazyLock<Mutex<HashMap<String, Vec<oomir::Type>>>>` (`src/lower1/types.rs:7308-7309`) is a process-wide registry used by `generate_tuple_jvm_class_name` to detect ABI-incompatible tuple name collisions across compilation shards. It is accessed via `.lock().expect(\"tuple ABI name registry lock was poisoned\")` at `src/lower1/types.rs:7772-7774`. If any thread panics while holding this lock (e.g. during a codegen-unit crash triggered by some other bug while `generate_tuple_jvm_class_name` is on the stack), the `Mutex` becomes poisoned and every other codegen thread that later calls `generate_tuple_jvm_class_name` (which is on the hot path for any tuple type) will itself panic with `\"tuple ABI name registry lock was poisoned\"` instead of the original error, turning one isolated panic into a cascading failure across all parallel codegen units.","fix":"Recover from poisoning instead of propagating it, e.g. replace the `.expect(...)` with `.unwrap_or_else(|poisoned| poisoned.into_inner())` so a panic on one codegen thread does not prevent every other thread from generating tuple names:\n\n```rust\nlet mut tuple_abis = TUPLE_ABIS_BY_READABLE_NAME\n    .lock()\n    .unwrap_or_else(|poisoned| poisoned.into_inner());\n```","locations":[{"ref":"src/lower1/types.rs:7767-7768","code":" 7767 | static TUPLE_ABIS_BY_READABLE_NAME: LazyLock<Mutex<HashMap<String, Vec<oomir::Type>>>> =\n 7768 |     LazyLock::new(|| Mutex::new(HashMap::default()));","lines":2,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/src/lower1/types.rs#L7767-L7768"},{"ref":"src/lower1/types.rs:8230-8241","code":" 8230 |         let crate_incompatible_collision = {\n 8231 |             let mut tuple_abis = TUPLE_ABIS_BY_READABLE_NAME\n 8232 |                 .lock()\n 8233 |                 .expect(\"tuple ABI name registry lock was poisoned\");\n 8234 |             match tuple_abis.get(&readable_name) {\n 8235 |                 Some(existing) => existing != &oomir_element_types,\n 8236 |                 None => {\n 8237 |                     tuple_abis.insert(readable_name.clone(), oomir_element_types.clone());\n 8238 |                     false\n 8239 |                 }\n 8240 |             }\n 8241 |         };","lines":12,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/src/lower1/types.rs#L8230-L8241"}]},
{"id":"OTHER_7","type":"other","type_label":"Other","severity":"medium","difficulty":"medium","description":"`std/overlay/std/src/sys/alloc/jvm.rs::alloc_zeroed` (lines 23-26) does not zero memory itself; it just calls the same `allocate_bytes` FFI function as `alloc`, relying entirely on the comment's claim that \"JVM arrays are zero-initialized\". `GlobalAlloc::alloc_zeroed`'s contract requires the returned memory be zeroed, and Rust code (e.g. `Vec`/`Box` zeroed-allocation fast paths, `calloc`-style APIs) can rely on that without redundantly zeroing. If the JVM-side `Pointer:allocateBytes` implementation is ever changed to pool/reuse previously-deallocated backing arrays for performance (a very natural future optimization for an allocator), this function silently starts returning non-zeroed memory, which is undefined behavior from Rust's perspective with no compiler or test signal pointing at this file.","fix":"Add a debug-only assertion (or a runtime-side contract test) verifying `allocateBytes` really returns zeroed memory, and leave a comment on the JVM-side implementation stating that this Rust code depends on that guarantee never regressing (e.g. no buffer pooling without an explicit zero-fill).","locations":[{"ref":"std/overlay/std/src/sys/alloc/jvm.rs:23-26","code":"   23 | pub unsafe fn alloc_zeroed(layout: Layout) -> *mut u8 {\n   24 |     // JVM arrays are zero-initialized.\n   25 |     unsafe { allocate_bytes(layout.size(), layout.align()) }\n   26 | }","lines":4,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/std/overlay/std/src/sys/alloc/jvm.rs#L23-L26"}]},
{"id":"OTHER_8","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"`build.py`'s `generate_config_files` implements templating via a literal string replacement keyed on the exact substring `\"../../../\"`:\n```python\nreplacements = {\n    \"../../../\": Config.ROOT_DIR.as_posix() + \"/\",\n    \"@RUST_BACKEND_DYLIB@\": Config.RUST_BACKEND_DYLIB.name,\n}\nfor template_path in Config.ROOT_DIR.glob(\"*.template\"):\n    content = template_path.read_text()\n    for old, new in replacements.items():\n        content = content.replace(old, new)\n```\nUsing a placeholder-looking token (`@RUST_BACKEND_DYLIB@`) for one substitution but a plain relative-path string (`\"../../../\"`) for the other is inconsistent and fragile: any future `*.template` file that legitimately needs the literal text `../../../` for an unrelated purpose (e.g. inside a comment or an actually-relative path meant to stay relative) would be silently mangled.","fix":"Use a single consistent placeholder convention for every substitution (e.g. `@ROOT_DIR@` and `@RUST_BACKEND_DYLIB@`), and update `config.toml.template`/`jvm-unknown-jvm.json.template` to use the new placeholder instead of a bare relative path fragment.","locations":[{"ref":"build.py:265-284","code":"  265 | def generate_config_files():\n  266 |     \"\"\"Generates config.toml and jvm-unknown-jvm.json from templates.\"\"\"\n  267 |     print(f\"{Colors.CYAN}🛠️  Generating configuration files from templates...{Colors.RESET}\")\n  268 | \n  269 |     # Logic from GenerateFiles.py is now integrated here\n  270 |     replacements = {\n  271 |         \"../../../\": Config.ROOT_DIR.as_posix() + \"/\",\n  272 |         \"@RUST_BACKEND_DYLIB@\": Config.RUST_BACKEND_DYLIB.name,\n  273 |     }\n  274 | \n  275 |     for template_path in Config.ROOT_DIR.glob(\"*.template\"):\n  276 |         content = template_path.read_text()\n  277 |         for old, new in replacements.items():\n  278 |             content = content.replace(old, new)\n  279 |         \n  280 |         target_path = template_path.with_suffix(\"\") # Removes .template\n  281 |         target_path.write_text(content)\n  282 |         shutil.copymode(template_path, target_path)\n  283 |         print(f\"   Generated {target_path.name}\")\n  284 |     print(f\"{Colors.GREEN}   Configuration files generated.{Colors.RESET}\")","lines":20,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/build.py#L265-L284"}]},
{"id":"OTHER_9","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"`cargo-jvm/build.rs` parses `.cargo_vcs_info.json` with hand-rolled string splitting instead of a JSON parser:\n```rust\nfn json_value(contents: &str, key: &str) -> Option<String> {\n    let value = contents.split_once(&format!(\"\\\"{key}\\\"\"))?.1;\n    let value = value.split_once(':')?.1.trim_start();\n    if let Some(value) = value.strip_prefix('\"') {\n        return Some(value.split_once('\"')?.0.to_string());\n    }\n    ...\n}\n```\n`split_once` finds the *first* textual occurrence of `\"key\"` anywhere in the file, and the string-value branch does not handle JSON escape sequences (e.g. a `\\\"` inside the value would be treated as the closing quote). Since this only reads Cargo-generated `.cargo_vcs_info.json` files the format is fairly stable in practice, but the parser is fragile and would silently produce a truncated or wrong git hash if the format ever gains an escaped character or a duplicated key name before the real one.","fix":"Depend on `serde_json` (already a dependency of the `cargo-jvm` binary) in `build.rs` as a build-dependency and parse `.cargo_vcs_info.json` properly instead of manual substring splitting.","locations":[{"ref":"cargo-jvm/build.rs:76-90","code":"   76 | fn json_value(contents: &str, key: &str) -> Option<String> {\n   77 |     let value = contents.split_once(&format!(\"\\\"{key}\\\"\"))?.1;\n   78 |     let value = value.split_once(':')?.1.trim_start();\n   79 |     if let Some(value) = value.strip_prefix('\"') {\n   80 |         return Some(value.split_once('\"')?.0.to_string());\n   81 |     }\n   82 |     Some(\n   83 |         value\n   84 |             .split(|character: char| {\n   85 |                 character == ',' || character == '}' || character.is_whitespace()\n   86 |             })\n   87 |             .next()?\n   88 |             .to_string(),\n   89 |     )\n   90 | }","lines":15,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/cargo-jvm/build.rs#L76-L90"}]},
{"id":"OTHER_10","type":"other","type_label":"Other","severity":"low","difficulty":"very_easy","description":"In `runtime/src/FileSystemSupport.java`, `errorKind` normalizes a `FileSystemException` reason with `reason.toLowerCase()` (no `Locale` argument). `String.toLowerCase()` without an explicit locale is locale-sensitive and can produce unexpected results under certain default locales (the classic Turkish-`I` problem), which is a well-known Java pitfall even though the specific substrings checked here (`\"cross-device\"`, `\"different file system\"`) happen not to contain an uppercase `I` today.","fix":"Use `reason.toLowerCase(Locale.ROOT)` (and add the `java.util.Locale` import) to make the comparison locale-independent.","locations":[{"ref":"runtime/src/FileSystemSupport.java:1205","code":" 1205 |                 String normalized = reason.toLowerCase();","lines":1,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/runtime/src/FileSystemSupport.java#L1205"}]},
{"id":"OTHER_11","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"Every outlined tail-chunk method produced by `outline_function` gets an empty `debug_variables` list (`src/lower2/large_methods.rs:337-341`: only `chunk_index == 0` keeps `debug_variables.take().unwrap_or_default()`; every other chunk gets `Vec::new()`). This means as soon as a function is large enough to be split (which is exactly the functions most likely to benefit from debugging support, being the largest/most complex ones), all code running in any outlined chunk beyond the first permanently loses local-variable-table debug info (variable names visible to a debugger), even though the original function's variables were tracked. This is a real, silent degradation of debuggability for split functions with no accompanying comment explaining the trade-off.","fix":"Partition the original `function.debug_variables` by which chunk each variable's declaring block(s) belong to (using the same `block_to_chunk` map already computed at `src/lower2/large_methods.rs:108-119`) and attach the relevant subset (renamed through the same parameter/carrier naming scheme used for the chunk's live variables) to each outlined chunk's `debug_variables`, instead of dropping it entirely for chunks after the first.","locations":[{"ref":"src/lower2/large_methods.rs:333-346","code":"  333 |         result.push(Function {\n  334 |             name: chunk.name.clone(),\n  335 |             owner_class: owner_class.clone(),\n  336 |             signature: chunk.signature.clone(),\n  337 |             debug_variables: if chunk_index == 0 {\n  338 |                 debug_variables.take().unwrap_or_default()\n  339 |             } else {\n  340 |                 Vec::new()\n  341 |             },\n  342 |             body: CodeBlock {\n  343 |                 entry,\n  344 |                 basic_blocks,\n  345 |             },\n  346 |         });","lines":14,"link":"https://github.com/Integr {"id":"OTHER_12","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"`Intrinsics.halfValue(short)` (`runtime/src/Intrinsics.java:406`) is declared to return `double`\neven though it just forwards to `Numbers.f16ToF32`, which returns `float`. Several call sites then\nimmediately cast the result back down to `float` (`(float) halfValue(left)` in `maximumf16`,\n`minimumf16`, `maximum_number_nsz_f16`, and `minimum_number_nsz_f16`), producing a pointless\nfloat -> double -> float round trip and making the intent of the helper less clear than if it\nsimply returned `float`.","fix":"Before:\n```java\nprivate static double halfValue(short value) { return Numbers.f16ToF32(value); }\n...\nreturn half(maximum((float) halfValue(left), (float) halfValue(right)));\n```\nAfter:\n```java\nprivate static float halfValue(short value) { return Numbers.f16ToF32(value); }\n...\nreturn half(maximum(halfValue(left), halfValue(right)));\n```","locations":[{"ref":"runtime/src/Intrinsics.java:406","code":"  406 |     private static double halfValue(short value) { return Numbers.f16ToF32(value); }","lines":1,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/runtime/src/Intrinsics.java#L406"},{"ref":"runtime/src/Intrinsics.java:585-587","code":"  585 |     public static short maximumf16(short left, short right) {\n  586 |         return half(maximum((float) halfValue(left), (float) halfValue(right)));\n  587 |     }","lines":3,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aaaa491919ae9ae5/runtime/src/Intrinsics.java#L585-L587"},{"ref":"runtime/src/Intrinsics.java:595-597","code":"  595 |     public static short minimumf16(short left, short right) {\n  596 |         return half(minimum((float) halfValue(left), (float) halfValue(right)));\n  597 |     }","lines":3,"link":"https://github.com/IntegralPilot/rustc_codegen_jvm/blob/5a2645e2874cc8e45f8f8f35aa (function(){
'use strict';

// Data
const FINDINGS     = JSON.parse(document.getElementById('D').textContent);
const PROJECT_INFO = JSON.parse(document.getElementById('PI').textContent);
const SEVS     = ['critical','high','medium','low','negligible'];
const STATUSES = ['open','fixed','wont-fix','false-positive'];
const ALL_TYPES = [...new Set(FINDINGS.map(f => f.type))].sort(cmpTypes);
// Build lookup map for O(1) access
const FINDING_BY_ID = new Map(FINDINGS.map(f => [f.id, f]));
// Only severities actually present in the report — the filter bar hides the rest.
const PRESENT_SEVS = SEVS.filter(s => FINDINGS.some(f => (f.severity || 'medium') === s));
// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.
const DIFFICULTY_ORDER = ['very_easy','easy','medium','hard'];
const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};
const PRESENT_DIFFS = DIFFICULTY_ORDER.filter(d => FINDINGS.some(f => f.difficulty === d));
const HAS_DIFFICULTY = PRESENT_DIFFS.length > 0;
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State
const S = {
  search: '', searchScope: 'all', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenDiff: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(),
};
const statuses = {};

// Persistence
function loadStatuses() {
  try { Object.assign(statuses, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch {}
}
function saveStatuses() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(statuses)); } catch {}
}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;
function syncHash() {
  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));
    if (S.search)            p.set('q',   S.search);
    if (S.searchScope !== 'all') p.set('qs', S.searchScope);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('qs'))  { S.searchScope = p.get('qs'); }
  document.getElementById('search-scope').classList.toggle('active', S.searchScope === 'locations');
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }
function isCustom(t)  { return String(t).toLowerCase() === 'custom'; }
function typeCls(t)   { return 'type-badge' + (isCustom(t) ? ' custom-type' : ''); }
// 'custom' findings are the user's own externally-sourced ones; pin them first
// everywhere types are listed so they never blend into the audit's own categories.
function cmpTypes(a, b) {
  if (isCustom(a) !== isCustom(b)) return isCustom(a) ? -1 : 1;
  return String(a).localeCompare(String(b));
}

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Render a "**Label:** value" line. GitHub/CommonMark only recognizes a
// ``` fence when it starts at the beginning of a line, so if the value
// itself opens with a fence, put it on its own line instead of right
// after the inline label - otherwise the fence marker gets glued onto
// "**Label:** ```" and never renders as a code block.
function mdField(label, value) {
  value = value || '';
  return /^```/.test(value.trim())
    ? '**' + label + ':**\n\n' + value
    : '**' + label + ':** ' + value;
}

// Render the "**Locations:**" block. When a location has a commit-pinned
// permalink (GitHub/GitLab), just paste the bare URL on its own line -
// GitHub/GitLab auto-expand a line-range blob link into an inline code
// preview, so re-pasting the snippet as a fenced block would duplicate it.
// Forges without a detected permalink shape (or missing commit/repo info)
// fall back to the fenced ref+snippet so the location is still readable.
function mdLocations(locations) {
  if (!locations.length) return '';
  let out = '**Locations:**\n\n';
  for (const l of locations) {
    if (l.link)               out += l.link + '\n\n';
    else if (l.code != null)  out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
    else                      out += '- `' + l.ref + '` _(file not found)_\n\n';
  }
  return out;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort(cmpTypes);

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += mdField('Description', f.description) + '\n\n';
      out += mdLocations(f.locations);
      out += mdField('Fix', f.fix) + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build a [project] header block from embedded PROJECT_INFO, so the exported
// findings.toml is self-contained (doesn't depend on a sibling project-info.toml
// that a second, separately-triggered download could silently fail to save).
// '' when there is no project info at all.
function buildProjectToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = PROJECT_INFO || {};
  if (!Object.keys(pi).length) return '';
  const lines = ['[project]'];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n\n';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    // Pin the id so re-rendering this export - or filtering it down later - can't
    // renumber findings that were already referenced by id elsewhere.
    if (f.id && f.id !== '?') lns.push(pad('id') + '= ' + tomlStr(f.id));
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return buildProjectToml() + chunks.join('\n\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += mdField('Description', f.description) + '\n\n';
  out += mdLocations(f.locations);
  out += mdField('Fix', f.fix) + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'folder') {
    if (!f.locations.length) return '(no location)';
    const path = f.locations[0].ref.replace(/:.*/,'');
    const idx = path.lastIndexOf('/');
    return idx === -1 ? '(root)' : path.slice(0, idx);
  }
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystacks per finding (cleared on full re-render).
// Two variants: everything (default), and file/folder paths only - for when a
// search term (e.g. a directory name like 'dlls/abc') also happens to appear
// inside description/fix prose and you only want path matches.
const _hay = new Map();
const _hayLoc = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}
function hayLocOf(f) {
  if (!_hayLoc.has(f.id)) {
    _hayLoc.set(f.id, f.locations.map(l => l.ref).join(' ').toLowerCase());
  }
  return _hayLoc.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (S.searchScope === 'locations') {
      if (!hayLocOf(f).includes(q)) return false;
    } else if (!hayOf(f).includes(q) && !st.includes(q)) {
      return false;
    }
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  if (S.groupBy === 'type') return [...keys].sort(cmpTypes);
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge ' + typeCls(f.type) + '" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge ' + typeCls(t) + '" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  _hayLoc.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    // Single download (was two) - a second auto-triggered download is commonly
    // blocked by the browser unless the user explicitly allows it, which silently
    // drops project-info.toml. Embedding [project] in findings.toml itself avoids
    // that failure mode entirely.
    downloadText(buildFindingsToml(), 'findings.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});
document.getElementById('search-scope').addEventListener('click', e => {
  S.searchScope = S.searchScope === 'locations' ? 'all' : 'locations';
  e.currentTarget.classList.toggle('active', S.searchScope === 'locations');
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
