{"id":"OVF_18","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`ccalloc` computes the allocation size as `n *= size` with no overflow check before calling `_cmalloc (sizeof_cygheap (n))`. If a caller passes `n`/`size` derived from external data (e.g. group/passwd counts), the `size_t` multiplication can wrap to a small value, producing a buffer far smaller than the `n*size` the caller believes it received. Note `memset` uses the same wrapped `n`, so the zero-fill is self-consistent, but the caller then writes `n*size` bytes into the undersized block, corrupting the cygheap. (This mirrors the classic `calloc` overflow and matches upstream, hence low given current internal callers.)","fix":"Detect overflow before allocating, e.g. `if (size && n > (size_t)-1 / size) return creturn (x, NULL, 0, fn);` (or use `__builtin_mul_overflow (n, size, &n)`), then proceed with the validated `n`.","locations":[{"ref":"winsup/cygwin/mm/cygheap.cc:521-529","code":"  521 | inline static void *\n  522 | ccalloc (cygheap_types x, size_t n, size_t size, const char *fn)\n  523 | {\n  524 |   cygheap_entry *c;\n  525 |   n *= size;\n  526 |   c = (cygheap_entry *) _cmalloc (sizeof_cygheap (n));\n  527 |   if (c)\n  528 |     memset (c->data, 0, n);\n  529 |   return creturn (x, c, n, fn);","lines":9,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/mm/cygheap.cc#L521-L529"}]},
{"id":"OVF_19","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"In the pre-initialization branch of `strace::vsprntf`, the program name is copied into `WCHAR progname[NAME_MAX]` via `pe = wcpncpy (progname, p, pe - p)` followed by `*pe = L'\\0'`. `pe - p` is the filename component length (up to `NAME_MAX` = 255 wchars) and is used unbounded; when it equals `NAME_MAX`, `wcpncpy` fills indices `0..254` and `*pe` writes `progname[255]`, a one-wchar stack overflow. Unlike the primary branch (which uses `sys_mbstowcs (..., NAME_MAX, ...)` and is bounded), this path has no length clamp.","fix":"Clamp the copy length to `NAME_MAX - 1`, e.g. compute `len = MIN (pe - p, NAME_MAX - 1)` and use `wcpncpy (progname, p, len); progname[len] = L'\\0';`.","locations":[{"ref":"winsup/cygwin/strace.cc:174-181","code":"  174 | \t  PWCHAR p = wcsrchr (global_progname, L'\\\\');\n  175 | \t  ++p;\n  176 | \t  PWCHAR pe = wcsrchr (p, '.');\n  177 | \t  if (!pe || wcscasecmp (pe, L\".exe\"))\n  178 | \t    pe = wcsrchr (p, L'\\0');\n  179 | \t  pe = wcpncpy (progname, p, pe - p);\n  180 | \t  *pe = L'\\0';\n  181 | \t  pn = progname;","lines":8,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/strace.cc#L174-L181"}]},
{"id":"OVF_20","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`rename_append_suffix` reads `path + len - 4` in the two `ascii_strcasematch (path + len - 4, ...)` calls without verifying `len >= 4`. `len` is `nlen`/`olen` (the caller's `strlen (newpath)`), and for a rename target shorter than 4 characters (e.g. `rename (\"x.exe\", \"ab\")`, which reaches the `.exe`/`.lnk` append paths), `path + len - 4` points before the start of the buffer, an out-of-bounds read of up to 4 bytes on the caller-owned `newpath` string. In the improbable case the preceding bytes happen to spell `.lnk`/`.exe`, `len -= 4` underflows `size_t`, and the subsequent `stpncpy (buf, path, len)` with the huge length overflows the VLA `buf`.","fix":"Guard the suffix comparison with a length check, e.g. only test `path + len - 4` when `len >= 4`: `if (len >= 4 && (ascii_strcasematch (path + len - 4, \".lnk\") || ascii_strcasematch (path + len - 4, \".exe\"))) len -= 4;`","locations":[{"ref":"winsup/cygwin/syscalls.cc:2219-2230","code":" 2219 | static void\n 2220 | rename_append_suffix (path_conv &pc, const char *path, size_t len,\n 2221 | \t\t      const char *suffix)\n 2222 | {\n 2223 |   char buf[len + 5];\n 2224 | \n 2225 |   if (ascii_strcasematch (path + len - 4, \".lnk\")\n 2226 |       || ascii_strcasematch (path + len - 4, \".exe\"))\n 2227 |     len -= 4;\n 2228 |   stpcpy (stpncpy (buf, path, len), suffix);\n 2229 |   pc.check (buf, PC_SYM_NOFOLLOW);\n 2230 | }","lines":12,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/syscalls.cc#L2219-L2230"}]},
{"id":"OVF_21","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"negligible","difficulty":"very_easy","description":"`dumper_init` computes `cmd_len` to size the `dumper_command` heap buffer, budgeting `... + 1 /*progname close-quote*/ + 10 /*PID digits*/ + 1 /*NUL*/`. The PID is later appended by `exec_prepared_command` via `__small_swprintf (dbg_end, L\" %u\", ...)`, which writes a leading space plus up to 10 digits plus NUL. The leading space separator is not accounted for in `cmd_len`, so a maximal 10-digit `DWORD` PID (>= 1000000000) would write one `WCHAR` past the end of the allocation. Windows PIDs are effectively never 10 digits, so this is a theoretical off-by-one.","fix":"Account for the separating space:\n```\n// before\nint cmd_len = 1 + wcslen(dll_dir) + 11 + 5 + 1 + wcslen(global_progname) + 1 + 10 + 1;\n// after (extra +1 for the ' ' before the PID)\nint cmd_len = 1 + wcslen(dll_dir) + 11 + 5 + 1 + wcslen(global_progname) + 1 + 1 + 10 + 1;\n```","locations":[{"ref":"winsup/cygwin/exceptions.cc:151-170","code":"  151 |   /* Calculate the length of the command, allowing for an appended DWORD PID and\n  152 |      terminating null */\n  153 |   int cmd_len = 1 + wcslen(dll_dir) + 11 + 5 + 1 + wcslen(global_progname) + 1 + 10 + 1;\n  154 |   if (cmd_len > 32767)\n  155 |     {\n  156 |       /* If this comes to more than the 32,767 characters CreateProcess() can\n  157 |            accept, we can't work, so don't set dumper_command */\n  158 |       return;\n  159 |     }\n  160 | \n  161 |   dumper_command = (PWCHAR) malloc(cmd_len * sizeof (WCHAR));\n  162 | \n  163 |   PWCHAR cp = dumper_command;\n  164 |   cp = wcpcpy (cp, L\"\\\"\");\n  165 |   cp = wcpcpy (cp, dll_dir);\n  166 |   cp = wcpcpy (cp, L\"\\\\dumper.exe\");\n  167 |   cp = wcpcpy (cp, L\"\\\" -n \");\n  168 |   cp = wcpcpy (cp, L\"\\\"\");\n  169 |   cp = wcpcpy (cp, global_progname);\n  170 |   wcscat (cp, L\"\\\"\");","lines":20,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/exceptions.cc#L151-L170"},{"ref":"winsup/cygwin/exceptions.cc:504-505","code":"  504 |   PWCHAR dbg_end = wcschr (command, L'\\0');\n  505 |   __small_swprintf (dbg_end, L\" %u\", GetCurrentProcessId ());","lines":2,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/exceptions.cc#L504-L505"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In `dtable::dup3`, the invalid-flags check `if ((flags & ~O_CLOEXEC) != 0)` does `return -1;` directly instead of `goto done;`. Every other error path in this function jumps to the `done:` label, which calls `unlock ()`. This path takes the fdtab `lock ()` acquired at the top of the function and never releases it. A user program calling `dup3 (fd1, fd2, badflag)` with any flag other than `O_CLOEXEC` (e.g. `O_NONBLOCK`) returns `EINVAL` but leaves the cygheap fd-table muto permanently held, deadlocking all subsequent file-descriptor operations from other threads (and leaving `res` correctly `-1` only by luck). Reachable directly from userspace and trivially triggers a process-wide fd-table deadlock.","fix":"Replace the bare `return -1;` with `goto done;` so the lock is released (res is already -1):\n\nBefore:\n```\n      set_errno (EINVAL);\n      return -1;\n```\nAfter:\n```\n      set_errno (EINVAL);\n      goto done;\n```","locations":[{"ref":"winsup/cygwin/dtable.cc:772-777","code":"  772 |   if ((flags & ~O_CLOEXEC) != 0)\n  773 |     {\n  774 |       syscall_printf (\"invalid flags value %y\", flags);\n  775 |       set_errno (EINVAL);\n  776 |       return -1;\n  777 |     }","lines":6,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/dtable.cc#L772-L777"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"In `vsyslog`, the same `va_list ap` is walked twice: the two-pass `for (pass_number ...)` loop calls `pass.print_va (message, ap)` in pass 0 (measuring length via `vfprintf` to `/dev/null`) and again in pass 1 (formatting via `vsprintf` into an `alloca (n)` buffer sized from pass 0). Reusing a consumed `va_list` without `va_copy` is undefined behavior on x86_64: after pass 0 the argument pointer is exhausted, so pass 1 reads garbage arguments. Because the measured length `n` (from correct args) and the actually-written length (from garbage args) can differ, any `syslog`/`vsyslog` call whose message contains user format specifiers (e.g. `%s`, `%d`) can produce a longer string in pass 1 than `n`, overflowing the `alloca` stack buffer. Note the `%m` tokens are pre-expanded before the loop, but all other varargs are consumed twice.","fix":"Take a fresh copy of `ap` for each pass. Add `va_list ap_copy; va_copy (ap_copy, ap);` inside the loop before `pass.print_va (message, ap_copy)` and `va_end (ap_copy)` after, so each `vfprintf`/`vsprintf` walks an un-consumed copy.","locations":[{"ref":"winsup/cygwin/syslog.cc:392-417","code":"  392 |   pass_handler pass;\n  393 |   for (int pass_number = 0; pass_number < 2; ++pass_number)\n  394 |     {\n  395 |       int n = pass.initialize (pass_number);\n  396 |       if (n == -1)\n  397 | \treturn;\n  398 |       else if (n > 0)\n  399 | \tpass.set_message ((char *) alloca (n));\n  400 | \n  401 |       /* Deal with ident_string */\n  402 |       if (syslog_globals.process_ident != NULL)\n  403 | \t{\n  404 | \t  if (pass.print (\"%ls: \", syslog_globals.process_ident) == -1)\n  405 | \t    return;\n  406 | \t}\n  407 |       if (syslog_globals.process_logopt & LOG_PID)\n  408 | \t{\n  409 | \t  if (pass.print (\"PID %u: \", getpid ()) == -1)\n  410 | \t    return;\n  411 | \t}\n  412 | \n  413 |       /* Print out the variable part */\n  414 |       if (pass.print_va (message, ap) == -1)\n  415 | \treturn;\n  416 | \n  417 |     }","lines":26,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/syslog.cc#L392-L417"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`clk_process_t::now` calls `OpenProcess (PROCESS_QUERY_LIMITED_INFORMATION, 0, p->dwProcessId)` and immediately uses the returned `hProcess` in `NtQueryInformationProcess` without checking it for `NULL`, and it ignores the `NTSTATUS` returned by `NtQueryInformationProcess`. The sibling `clk_thread_t::now` correctly checks `if (!hThread)`. When `OpenProcess` fails (returns `NULL`, e.g. insufficient rights for another pid's `CLOCK_PROCESS_CPUTIME_ID`), the query fails and the on-stack `KERNEL_USER_TIMES kut` is left uninitialized; `x = kut.KernelTime.QuadPart + kut.UserTime.QuadPart` then reads uninitialized stack and reports garbage times as success, and `CloseHandle (NULL)` is called. Should fail with `EINVAL` like the thread variant.","fix":"After `OpenProcess`, add `if (!hProcess) { set_errno (EINVAL); return -1; }` and check the result of `NtQueryInformationProcess` with `NT_SUCCESS`, returning `-1`/`set_errno` on failure, mirroring `clk_thread_t::now`.","locations":[{"ref":"winsup/cygwin/clock.cc:94-102","code":"   94 |   hProcess = OpenProcess (PROCESS_QUERY_LIMITED_INFORMATION, 0,\n   95 | \t\t\t  p->dwProcessId);\n   96 |   NtQueryInformationProcess (hProcess, ProcessTimes,\n   97 | \t\t\t     &kut, sizeof kut, NULL);\n   98 | \n   99 |   x = kut.KernelTime.QuadPart + kut.UserTime.QuadPart;\n  100 |   ts->tv_sec = x / NS100PERSEC;\n  101 |   ts->tv_nsec = (x % NS100PERSEC) * (NSPERSEC/NS100PERSEC);\n  102 |   CloseHandle (hProcess);","lines":9,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/clock.cc#L94-L102"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `pg_ent::nss_db_enum_tdom`, the loop that walks the trusted-domain list `enum_tdoms` uses `td = wcschr (td, L'\\0')` as its advance expression, without the required `+ 1`. `enum_tdoms` is built in `uinfo.cc` as a REG_MULTI_SZ-style, double-NUL-terminated list of wide strings (spaces are replaced by `L'\\0'`, see `uinfo.cc` around lines 706-709). `wcschr (td, L'\\0')` returns a pointer to the terminating NUL of the *current* domain, so after the first iteration `td` points at that inner NUL, the loop condition `td && *td` sees `*td == L'\\0'` and the loop exits. As a result only the FIRST configured trusted domain is ever compared against `domain`; every additional domain in a multi-domain `db_enum: tdom(A,B,...)` nsswitch configuration is silently ignored during `getpwent`/`getgrent` enumeration (reached via `enumerate_ad`, e.g. `passwd.cc:597`). To advance to the next string in the double-NUL list the code must skip past the NUL.","fix":"Advance past the embedded NUL to reach the next string in the `REG_MULTI_SZ`-style list. Before: `for (PCWSTR td = enum_tdoms; td && *td; td = wcschr (td, L'\\0'))` After: `for (PCWSTR td = enum_tdoms; td && *td; td = wcschr (td, L'\\0') + 1)`","locations":[{"ref":"winsup/cygwin/local_includes/pwdgrp.h:214-217","code":"  214 |       for (PCWSTR td = enum_tdoms; td && *td; td = wcschr (td, L'\\0'))\n  215 |         if (!wcscasecmp (td, domain))\n  216 |           return true;\n  217 |       return false;","lines":4,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/local_includes/pwdgrp.h#L214-L217"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `gethostby_helper` the local `complen` is declared `unsigned`, but it stores the return value of `dn_skipname()` which returns `int` (`-1` on a corrupted/compressed name). The subsequent corruption checks `(complen = dn_skipname (...)) < 0` at lines 1072 and 1080 are therefore ALWAYS FALSE (unsigned can never be `< 0`). On a malformed DNS answer `dn_skipname` returns `-1`, `complen` becomes `0xFFFFFFFF`, the `goto corrupted` is skipped, and `ptr += complen + NS_QFIXEDSZ` / `curptr = (record *)(ptr + complen)` produce a wild pointer that is then dereferenced (`ntohs(curptr->type)`), causing an out-of-bounds read / crash. This defeats the anti-corruption logic on remote name-server input.","fix":"Make the variable signed so the error checks work:\n```\n-  unsigned complen;\n+  int complen;\n```\n(The `record::complen` 16-bit bitfield assignment at line 1091 and the `name()` subtraction remain valid.)","locations":[{"ref":"winsup/cygwin/net.cc:1065","code":" 1065 |   unsigned complen;","lines":1,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/net.cc#L1065"},{"ref":"winsup/cygwin/net.cc:1072","code":" 1072 |   if ((complen = dn_skipname (ptr, eomsg)) < 0)","lines":1,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/net.cc#L1072"},{"ref":"winsup/cygwin/net.cc:1080","code":" 1080 |       if ((complen = dn_skipname (ptr, eomsg)) < 0)","lines":1,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/net.cc#L1080"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`facl (GETACL, ...)` returns `int` and yields `-1` on error, but its result is stored into an `uint16_t` (`cnt` / `cnt_from_file`) and then checked with `if (cnt < 0)` / `if (cnt_from_file < 0)`. Because the variable is unsigned, the comparison is always false, so `facl` failure is never detected. On failure the value becomes `65535` and execution continues: in `fhandler_disk_file::acl_get` for a directory the loop `for (access_cnt = 0; access_cnt < cnt; ++access_cnt)` reads `aclbufp[access_cnt].a_type` far past the `NT_MAX_PATH` `tp.c_get ()` buffer, and for a non-dir `acl_init (access_cnt)` + `memcpy (..., _ENTRY_SIZE (access_cnt))` copies ~786 KB out of a 32 KB buffer. The same broken check exists in `fhandler_disk_file::acl_set`. This turns a clean error into an out-of-bounds read / access violation (only masked by the surrounding `__except`).","fix":"Capture the `facl` result in a signed `int` and test it before narrowing, e.g. `int fcnt = facl (GETACL, MAX_ACL_ENTRIES, aclbufp); if (fcnt < 0) __leave; cnt = fcnt;` (likewise `cnt_from_file`).","locations":[{"ref":"winsup/cygwin/sec/posixacl.cc:579-599","code":"  579 |       uint16_t cnt, access_cnt;\n  580 | \n  581 |       if (!pc.has_acls ())\n  582 | \t{\n  583 | \t  set_errno (ENOTSUP);\n  584 | \t  __leave;\n  585 | \t}\n  586 |       if (type == ACL_TYPE_DEFAULT && !pc.isdir ())\n  587 | \t{\n  588 | \t  set_errno (ENOTDIR);\n  589 | \t  __leave;\n  590 | \t}\n  591 |       aclbufp = (aclent_t *) tp.c_get ();\n  592 |       if (!get_handle ())\n  593 | \t{\n  594 | \t  query_open (query_read_control);\n  595 | \t  if (!(oret = open (O_BINARY, 0)))\n  596 | \t    __leave;\n  597 | \t}\n  598 |       cnt = facl (GETACL, MAX_ACL_ENTRIES, aclbufp);\n  599 |       if (cnt < 0)","lines":21,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/sec/posixacl.cc#L579-L599"},{"ref":"winsup/cygwin/sec/posixacl.cc:721-746","code":"  721 |       uint16_t cnt, cnt_from_file, access_cnt;\n  722 | \n  723 |       if (!pc.has_acls ())\n  724 | \t{\n  725 | \t  set_errno (ENOTSUP);\n  726 | \t  __leave;\n  727 | \t}\n  728 |       if (type == ACL_TYPE_DEFAULT && !pc.isdir ())\n  729 | \t{\n  730 | \t  set_errno (ENOTDIR);\n  731 | \t  __leave;\n  732 | \t}\n  733 |       if (acl->count > MAX_ACL_ENTRIES)\n  734 | \t{\n  735 | \t  set_errno (EINVAL);\n  736 | \t  __leave;\n  737 | \t}\n  738 |       aclbuf_from_file = (aclent_t *) tp.c_get ();\n  739 |       if (!get_handle ())\n  740 | \t{\n  741 | \t  query_open (query_write_dac);\n  742 | \t  if (!(oret = open (O_BINARY, 0)))\n  743 | \t    __leave;\n  744 | \t}\n  745 |       cnt_from_file = facl (GETACL, MAX_ACL_ENTRIES, aclbuf_from_file);\n  746 |       if (cnt_from_file < 0)","lines":26,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/sec/posixacl.cc#L721-L746"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`geterrno_from_nt_status` accepts a `deferrno` parameter (defaulting to `EACCES`) but silently drops it: it calls `geterrno_from_win_error (RtlNtStatusToDosError (status))` without forwarding `deferrno`, so `geterrno_from_win_error` uses its own default (`EACCES`, 13) instead of the caller-supplied fallback. Upstream Cygwin forwards `deferrno`. Any caller that maps an unrecognized `NTSTATUS` and passes a non-default `deferrno` would get `EACCES` instead of the requested errno. All current in-tree callers happen to use the single-argument (default) form, so the effect is currently masked, but the parameter is dead and the behavior diverges from the declared contract.","fix":"Forward the parameter:\n```\n// before\nreturn geterrno_from_win_error (RtlNtStatusToDosError (status));\n// after\nreturn geterrno_from_win_error (RtlNtStatusToDosError (status), deferrno);\n```","locations":[{"ref":"winsup/cygwin/errno.cc:210-214","code":"  210 | int\n  211 | geterrno_from_nt_status (NTSTATUS status, int deferrno)\n  212 | {\n  213 |   return geterrno_from_win_error (RtlNtStatusToDosError (status));\n  214 | }","lines":5,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/errno.cc#L210-L214"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In the legacy console `char_command()` handler for `'T'` (SR / scroll down), `n = con.b.srWindow.Top + con.args[0] ?: 1;` binds as `(con.b.srWindow.Top + con.args[0]) ?: 1` because `+` has higher precedence than `?:`. The intent (mirroring case `'S'`'s `con.args[0] ?: 1`) was to default the argument to 1 before adding the window top; as written, when `con.args[0]==0` the result is `srWindow.Top` (not `srWindow.Top + 1`), and it becomes `1` only in the unlikely case `srWindow.Top + args[0] == 0`.","fix":"Parenthesize the default:\n```\n// before\nn = con.b.srWindow.Top + con.args[0] ?: 1;\n// after\nn = con.b.srWindow.Top + (con.args[0] ?: 1);\n```","locations":[{"ref":"winsup/cygwin/fhandler/console.cc:3488","code":" 3488 |       n = con.b.srWindow.Top + con.args[0] ?: 1;","lines":1,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/fhandler/console.cc#L3488"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `format_proc_loadavg`, the loop passes the loop index `i` to `get_process_state (i)` instead of the process's Windows PID `pids[i]->dwProcessId`. `get_process_state` compares its argument against `SYSTEM_PROCESS_INFORMATION::UniqueProcessId` (a real Windows PID), so passing the small sequential index almost never matches a Cygwin process. As a result the `running` count in `/proc/loadavg` is essentially always wrong (near zero).","fix":"Pass the Windows PID:\n```c\n// before\n    switch (get_process_state (i)) {\n// after\n    switch (get_process_state (pids[i]->dwProcessId)) {\n```","locations":[{"ref":"winsup/cygwin/fhandler/proc.cc:444-445","code":"  444 |   for (unsigned i = 0; i < pids.npids; i++)\n  445 |     switch (get_process_state (i)) {","lines":2,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/fhandler/proc.cc#L444-L445"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`fhandler_registry::exists` compares the tail of `path` against `VIRT_CLASSES_KEY` via `strcasecmp (path + strlen (path) - sizeof (VIRT_CLASSES_KEY) + 1, VIRT_CLASSES_KEY)` without first verifying that `strlen (path) >= sizeof (VIRT_CLASSES_KEY) - 1`. `sizeof (VIRT_CLASSES_KEY)` is 39, so for a short path such as `HKEY_CLASSES_ROOT` (which reaches this branch because `open_key` succeeds), the pointer underflows to `path - 21`, i.e. before the start of the `get_name ()` allocation, and `strcasecmp` performs an out-of-bounds read. It rarely matches so the read is short, but it is a genuine reachable OOB read (e.g. `stat`/`open` of `/proc/registry/HKEY_CLASSES_ROOT`). The same underflow-prone idiom appears in `fill_filebuf` (`get_name ()` tail vs `VIRT_CLASSES_KEY`) and `readdir` (`path` tail vs `VIRT_CLASSES_KEY_PREFIX`).","fix":"Guard the length before subtracting, e.g. compute `size_t plen = strlen (path);` and only run the compare when `plen + 1 >= sizeof (VIRT_CLASSES_KEY)` (and analogously for the `VIRT_CLASSES_KEY_PREFIX` case), otherwise treat it as no match.","locations":[{"ref":"winsup/cygwin/fhandler/registry.cc:360-362","code":"  360 | \t  if (!strcasecmp (path + strlen (path)\n  361 | \t\t\t   - sizeof (VIRT_CLASSES_KEY) + 1,\n  362 | \t\t\t   VIRT_CLASSES_KEY))","lines":3,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/fhandler/registry.cc#L360-L362"},{"ref":"winsup/cygwin/fhandler/registry.cc:937-939","code":"  937 | \t      && !strcasecmp (get_name () + strlen (get_name ())\n  938 | \t\t\t      - sizeof (VIRT_CLASSES_KEY) + 1,\n  939 | \t\t\t      VIRT_CLASSES_KEY))","lines":3,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/fhandler/registry.cc#L937-L939"},{"ref":"winsup/cygwin/fhandler/registry.cc:693-696","code":"  693 |   else if (!strcasecmp (de->d_name, \"Classes\")\n  694 | \t   && !strcasecmp (path + strlen (path)\n  695 | \t\t\t   - sizeof (VIRT_CLASSES_KEY_PREFIX) + 1,\n  696 | \t\t\t   VIRT_CLASSES_KEY_PREFIX))","lines":4,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/fhandler/registry.cc#L693-L696"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `mtinfo_drive::get_pos`, `partition` is set to `(int32_t) p - 1` where `p` is a partition number reported by the tape driver via `GetTapePosition`, with no upper bound check. `part (int num)` returns `&_part[num]` into a fixed `mtinfo_part _part[MAX_PARTITION_NUM]` (64 entries) with no bounds checking. Several callers use `part (partition)` immediately after `get_pos` without guarding (e.g. `read`, `write`, and `get_status` at lines ~825-828 do `part (partition)->file`/`->fblock`), whereas other sites explicitly guard with `partition < MAX_PARTITION_NUM` (e.g. `open`, `set_partition`, `write_marks`). A drive reporting a partition index >= `MAX_PARTITION_NUM` therefore causes an out-of-bounds `_part[]` access.","fix":"Clamp `partition` in `get_pos` after computing it, e.g. `if (partition >= MAX_PARTITION_NUM) partition = 0;` (mirroring the defensive checks already present at `open`/`set_partition`/`write_marks`), so all downstream `part (partition)` uses stay in range.","locations":[{"ref":"winsup/cygwin/fhandler/tape.cc:379-393","code":"  379 |   if (!lasterr)\n  380 |     {\n  381 |       if (p > 0)\n  382 | \tpartition = (int32_t) p - 1;\n  383 |       block = (int64_t) b.QuadPart;\n  384 |       if (ppartition)\n  385 | \t*ppartition= partition;\n  386 |       if (pblock)\n  387 | \t*pblock = block;\n  388 |     }\n  389 |   else\n  390 |     {\n  391 |       partition = 0;\n  392 |       block = -1;\n  393 |     }","lines":15,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/fhandler/tape.cc#L379-L393"},{"ref":"winsup/cygwin/fhandler/tape.cc:823-828","code":"  823 |   if (!notape)\n  824 |     {\n  825 |       get->mt_resid = (partition & 0xffff)\n  826 | \t\t      | ((mp ()->PartitionCount & 0xffff) << 16);\n  827 |       get->mt_fileno = part (partition)->file;\n  828 |       get->mt_blkno = part (partition)->fblock;","lines":6,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/fhandler/tape.cc#L823-L828"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `find_end_of_posix_list`, the loop condition tests `!in_string` where `in_string` is a non-null `int*` parameter, so `!in_string` is always `false` (it checks the pointer, not the value it points to). The intent was clearly `!*in_string` (i.e. \"not currently inside a quoted string\"). The effect happens to be benign today because when `*in_string == 0` the remaining term `**to != *in_string` degenerates to `**to != 0`, but the code is misleading and a latent bug if the terminator value ever changes.","fix":"Dereference the pointer. Before:\n```\nfor (; **to != '\\0' && (!in_string || **to != *in_string); ++*to) {\n```\nAfter:\n```\nfor (; **to != '\\0' && (!*in_string || **to != *in_string); ++*to) {\n```","locations":[{"ref":"winsup/cygwin/msys2_path_conv.cc:203-210","code":"  203 | void find_end_of_posix_list(const char** to, int* in_string) {\n  204 |     for (; **to != '\\0' && (!in_string || **to != *in_string); ++*to) {\n  205 |     }\n  206 | \n  207 |     if (**to == *in_string) {\n  208 |         *in_string = 0;\n  209 |     }\n  210 | }","lines":8,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/msys2_path_conv.cc#L203-L210"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"Multiple `wchar_t` alignment adjustments use `% 1`, which is always `0`, so the intended 2-byte alignment fix-up never executes. Compare line 827 in the same file, which correctly uses `% 2`. The result is that `wchar_t` pointers handed back to newlib (`wmon`, `wX_fmt`, `wyesexpr`, etc.) may end up on odd addresses. The sizing and write pointers use the same broken test symmetrically, so there is no buffer overflow, but the alignment code is dead and the returned wide strings are misaligned (a latent portability/UB bug that only happens to work on x86/x64).","fix":"Use a 2-byte modulus, e.g.:\n```\n-  if ((uintptr_t) *ptr % 1)\n+  if ((uintptr_t) *ptr % 2)\n    ++*ptr;\n```\n(and likewise `len % 2` at line 1102 and `(uintptr_t) c % 2` at line 1127).","locations":[{"ref":"winsup/cygwin/nlsfuncs.cc:364","code":"  364 |   if ((uintptr_t) *ptr % 1)","lines":1,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/nlsfuncs.cc#L364"},{"ref":"winsup/cygwin/nlsfuncs.cc:377","code":"  377 |   if ((uintptr_t) *ptr % 1)","lines":1,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/nlsfuncs.cc#L377"},{"ref":"winsup/cygwin/nlsfuncs.cc:425","code":"  425 |   if ((uintptr_t) *ptr % 1)","lines":1,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/nlsfuncs.cc#L425"},{"ref":"winsup/cygwin/nlsfuncs.cc:1102","code":" 1102 |       if (len % 1)","lines":1,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/nlsfuncs.cc#L1102"},{"ref":"winsup/cygwin/nlsfuncs.cc:1127","code":" 1127 |       if ((uintptr_t) c % 1)","lines":1,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/nlsfuncs.cc#L1127"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `check_path`, an empty `name` (`name[0] == '\\0'`) passes the leading-slash test because `strchr (\"/\\\\\", name[0])` matches the NUL terminator of the literal `\"/\\\\\"` and returns a non-NULL pointer. Execution then falls through to `if (!name[1])`, reading `name[1]` one byte past the end of the (1-byte) empty string, and to `strpbrk (name + 1, ...)` / `__small_sprintf (..., name + 1)`, all operating past the terminator. Reachable from `shm_open`/`mq_open`/`sem_open`/`shm_unlink`/`mq_unlink`/`sem_unlink` with `name == \"\"`.","fix":"Reject the empty name explicitly before dereferencing further:\n```c\n// before\nif (!name || !strchr (\"/\\\\\", name[0]))\n// after\nif (!name || !name[0] || !strchr (\"/\\\\\", name[0]))\n```","locations":[{"ref":"winsup/cygwin/posix_ipc.cc:73-84","code":"   73 |   if (!name || !strchr (\"/\\\\\", name[0]))\n   74 |     {\n   75 |       debug_printf (\"Invalid %s name '%s'\", ipc_names[type].description, name);\n   76 |       set_errno (EINVAL);\n   77 |       return false;\n   78 |     }\n   79 |   /* Name must not consist of just a single slash (or backslash) */\n   80 |   if (!name[1])\n   81 |     {\n   82 |       debug_printf (\"Invalid %s name '%s'\", ipc_names[type].description, name);\n   83 |       set_errno (ENOENT);\n   84 |       return false;","lines":12,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/posix_ipc.cc#L73-L84"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`reg_key::get_string` handles a NULL `def` inconsistently. In the `key_is_invalid` branch it guards the fallback copy with `if (def != NULL) wcpncpy (dst, def, max);`, showing NULL `def` is an expected input. But in the valid-key branch, when `NtQueryValueKey` fails or the value type is not `REG_SZ`, it calls `wcpncpy (dst, def, max)` unconditionally. If a caller passes `def == NULL` and the value is missing/wrong-typed, `wcpncpy` dereferences a NULL source and crashes. (No current in-tree caller passes NULL, so this is latent, but the asymmetry is a real defect.)","fix":"Guard the fallback copy the same way as the invalid branch:\n```\n      if (status != STATUS_SUCCESS || vbuf->Type != REG_SZ)\n\twcpncpy (dst, def, max);\n```\n->\n```\n      if (status != STATUS_SUCCESS || vbuf->Type != REG_SZ)\n\t{\n\t  if (def != NULL)\n\t    wcpncpy (dst, def, max);\n\t}\n```","locations":[{"ref":"winsup/cygwin/registry.cc:184-187","code":"  184 |       if (status != STATUS_SUCCESS || vbuf->Type != REG_SZ)\n  185 | \twcpncpy (dst, def, max);\n  186 |       else\n  187 | \twcpncpy (dst, (PWCHAR) vbuf->Data, max);","lines":4,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/registry.cc#L184-L187"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `sched_rr_get_interval`, the foreground-window test is inverted. `GetForegroundWindow ()` returns NULL when there is no foreground window, yet the code calls `GetWindowThreadProcessId (forwin, &forprocid)` precisely in the `!forwin` case (passing a NULL window, which does not populate `forprocid`), and sets `forprocid = 0` when a valid window exists. Consequently `forprocid` is left uninitialized (garbage) whenever a foreground window is present, and the later comparison `pi->dwProcessId == forprocid` reads that uninitialized value, producing a wrong `qindex`/time-quantum result.","fix":"Invert the condition:\n```\n  forwin = GetForegroundWindow ();\n  if (!forwin)\n    GetWindowThreadProcessId (forwin, &forprocid);\n  else\n    forprocid = 0;\n```\n->\n```\n  forwin = GetForegroundWindow ();\n  if (forwin)\n    GetWindowThreadProcessId (forwin, &forprocid);\n  else\n    forprocid = 0;\n```","locations":[{"ref":"winsup/cygwin/sched.cc:162-166","code":"  162 |   forwin = GetForegroundWindow ();\n  163 |   if (!forwin)\n  164 |     GetWindowThreadProcessId (forwin, &forprocid);\n  165 |   else\n  166 |     forprocid = 0;","lines":5,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/sched.cc#L162-L166"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `__acltotext` the buffer-space check for the USER name branch is `_CHK (strlen (pw->pw_name + 1))`, which measures the string starting at the second character (length - 1) rather than the space actually written by `__small_sprintf (bufp, \"%s:\", pw->pw_name)` (name length + 1 for the colon). This under-estimates required space by two bytes. Not exploitable in practice given the `2 * NT_MAX_PATH` buffer and short account names, but it is a clear typo (the parallel GROUP branch uses `strlen (gr->gr_name)`).","fix":"Correct the argument:\n```\n-              _CHK (strlen (pw->pw_name + 1));\n+              _CHK (strlen (pw->pw_name) + 1);\n```","locations":[{"ref":"winsup/cygwin/sec/acl.cc:1770","code":" 1770 | \t      _CHK (strlen (pw->pw_name + 1));","lines":1,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/sec/acl.cc#L1770"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`acl_delete_def_file` allocates a `struct __acl_t` with `alloca` and only sets `count`, `max_count`, and `next` to 0, leaving `magic`, `deleted`, and `entry` uninitialized. `fhandler_disk_file::acl_set` subsequently reads `acl->deleted` (in `acl->count - acl->deleted + access_cnt > MAX_ACL_ENTRIES`), so an uninitialized field feeds a size/range check (works today only because `count == 0`). Additionally the `if (!acl) return -1;` NULL check is both dead (alloca never returns NULL) and placed *after* `acl` is already dereferenced on the previous line.","fix":"Zero the whole structure before use (e.g. `memset (acl, 0, sizeof (struct __acl_t))` or brace-initialize), set `acl->magic = ACL_MAGIC`, and drop the misplaced/dead `if (!acl)` check.","locations":[{"ref":"winsup/cygwin/sec/posixacl.cc:874-882","code":"  874 | extern \"C\" int\n  875 | acl_delete_def_file (const char *path_p)\n  876 | {\n  877 |   acl_t acl = (acl_t) alloca (sizeof (struct __acl_t));\n  878 |   acl->count = acl->max_count = acl->next = 0;\n  879 |   if (!acl)\n  880 |     return -1;\n  881 |   return acl_set_file(path_p, ACL_TYPE_DEFAULT, acl);\n  882 | }","lines":9,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/sec/posixacl.cc#L874-L882"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"The trailing debug print in `siginterrupt` has three conversion specifiers (`%R`, `%d`, `%y`) but passes only two arguments (`sig`, `flag`). `%R` consumes `sig`, `%d` consumes `flag`, and `%y` reads an undefined `va_arg` off the stack (undefined behavior; also prints the wrong return value since `res` is never passed).","fix":"Pass the missing return value:\n```\n// before\nsyscall_printf (\"%R = siginterrupt(%d, %y)\", sig, flag);\n// after\nsyscall_printf (\"%R = siginterrupt(%d, %y)\", res, sig, flag);\n```","locations":[{"ref":"winsup/cygwin/signal.cc:604","code":"  604 |   syscall_printf (\"%R = siginterrupt(%d, %y)\", sig, flag);","lines":1,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/signal.cc#L604"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"In `dev_console::save_restore()` the clamp of the save-buffer height writes to the wrong `COORD` member. The idiom `if ((save_bufsize.Y = dwEnd.Y + 1) > b.dwSize.Y) save_bufsize.X = b.dwSize.Y;` is meant to clamp `save_bufsize.Y` to the console buffer height, but it assigns `b.dwSize.Y` to `save_bufsize.X` instead. When the cursor/end row exceeds the buffer height, `save_bufsize.Y` is left uncapped and `save_bufsize.X` is corrupted to the buffer *height*, so `screen_size = sizeof(CHAR_INFO) * save_bufsize.X * save_bufsize.Y` and the subsequent `ReadConsoleOutputWrapper`/`WriteConsoleOutputW` region are computed with the wrong width, corrupting the DECSC/`ESC[?47h` save/restore screen area.","fix":"Assign the clamped value to `save_bufsize.Y`, not `.X`:\n```\n// before\nif ((save_bufsize.Y = dwEnd.Y + 1) > b.dwSize.Y)\n  save_bufsize.X = b.dwSize.Y;\n// after\nif ((save_bufsize.Y = dwEnd.Y + 1) > b.dwSize.Y)\n  save_bufsize.Y = b.dwSize.Y;\n```","locations":[{"ref":"winsup/cygwin/fhandler/console.cc:2724-2726","code":" 2724 |       save_bufsize.X = b.dwSize.X;\n 2725 |       if ((save_bufsize.Y = dwEnd.Y + 1) > b.dwSize.Y)\n 2726 | \tsave_bufsize.X = b.dwSize.Y;","lines":3,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/fhandler/console.cc#L2724-L2726"}]},
{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"In the `%B`/`%b`/`%h` (locale month name) case, `__strptime` parses the month into `tm->tm_mon` via `find_string` but records the wrong completeness flag: it sets `ymd |= SET_WDAY` instead of `ymd |= SET_MON`. The numeric `%m` case at line 571 correctly uses `SET_MON`. Because of this, a format that uses a textual month (e.g. `strptime(\"2020 March 15\", \"%Y %B %d\", &tm)`) never satisfies `(ymd & SET_YMD) == SET_YMD`, so the post-processing that derives `tm_yday` (and `tm_wday`) from year/month/day is skipped, and `%B` spuriously flags a weekday as present. Confirmed as a long-standing copy-paste bug (git blame shows it predates the `strptime_l` change).","fix":"Change the flag from `SET_WDAY` to `SET_MON`:\n```\n\t\t\tbp = find_string(bp, &tm->tm_mon, _ctloc(month),\n\t\t\t\t\t_ctloc(mon), 12, locale);\n\t\t\tLEGAL_ALT(0);\n-\t\t\tymd |= SET_WDAY;\n+\t\t\tymd |= SET_MON;\n\t\t\tcontinue;\n```","locations":[{"ref":"winsup/cygwin/libc/strptime.cc:488","code":"  488 | \t\t\tymd |= SET_WDAY;","lines":1,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/libc/strptime.cc#L488"}]},
{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"The local `aclent_t` work array `lacl` is cleared with `memset (lacl, 0, MAX_ACL_ENTRIES * sizeof (aclent_t *))`, using the size of a *pointer* (8 bytes) instead of `sizeof (aclent_t)` (12 bytes). This only zeroes `2730 * 8 = 21840` of the required `2730 * 12 = 32760` bytes, leaving entries with index >= ~1820 uninitialized (the `tp.c_get ()` buffer is reused, not zeroed). In `get_posix_access` this corrupts free-slot detection via `searchace (..., 0)`; in `__aclfromtext` it corrupts `lacl[pos].a_type |= ...` for high `pos`, producing garbage ACL entry types. Both occurrences are the same typo.","fix":"Change `sizeof (aclent_t *)` to `sizeof (aclent_t)`:\n```\n-  memset (lacl, 0, MAX_ACL_ENTRIES * sizeof (aclent_t *));\n+  memset (lacl, 0, MAX_ACL_ENTRIES * sizeof (aclent_t));\n```","locations":[{"ref":"winsup/cygwin/sec/acl.cc:760","code":"  760 |   memset (lacl, 0, MAX_ACL_ENTRIES * sizeof (aclent_t *));","lines":1,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/sec/acl.cc#L760"},{"ref":"winsup/cygwin/sec/acl.cc:1887","code":" 1887 |   memset (lacl, 0, MAX_ACL_ENTRIES * sizeof (aclent_t *));","lines":1,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/sec/acl.cc#L1887"}]},
{"id":"CPY_4","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In the `mount()` syscall wrapper's `MOUNT_BIND` branch, on failure of `conv_to_win32_path` or when the converted path is too long it does `return true;`. The function returns `int`, so this returns `1` (not `-1`), bypasses `syscall_printf`, and leaves `errno` unset - a POSIX `mount()` is expected to return `-1` and set `errno` on error. This is a copy-paste from `from_fstab_line` (which legitimately returns `bool true` to mean \"keep going\"), where the semantics differ.","fix":"Return the error sentinel instead. Before:\n```\nif (error || strlen (w32_path) >= MAX_PATH)\n  return true;\n```\nAfter:\n```\nif (error || strlen (w32_path) >= MAX_PATH)\n  {\n    set_errno (error ?: ENAMETOOLONG);\n    return res; /* res == -1 */\n  }\n```","locations":[{"ref":"winsup/cygwin/mount.cc:1979-1980","code":" 1979 | \t      if (error || strlen (w32_path) >= MAX_PATH)\n 1980 | \t\treturn true;","lines":2,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/mount.cc#L1979-L1980"}]},
{"id":"CPY_5","type":"copy_paste","type_label":"Copy Paste","severity":"negligible","difficulty":"very_easy","description":"The `AF_UNIX_PKT_DATA` macro declares its local as a value `af_unix_pkt_hdr_t _p = phdr;` instead of a pointer, unlike every sibling macro (`AF_UNIX_PKT_NAME`, `AF_UNIX_PKT_CMSG`, `AF_UNIX_PKT_OFFSETOF_DATA`) which all use `af_unix_pkt_hdr_t *_p = phdr;`. Assigning a pointer `phdr` to a value object would not even compile, and the subsequent `(PBYTE)(_p)` cast is nonsensical for a value. The macro is currently unused so the latent bug is dormant (and the whole file is behind the undefined `__WITH_AF_UNIX`), but it is a genuine copy-paste error.","fix":"Change `af_unix_pkt_hdr_t _p = phdr;` to `af_unix_pkt_hdr_t *_p = phdr;`:\n```c\n#define AF_UNIX_PKT_DATA(phdr) \\\n\t({ \\\n\t   af_unix_pkt_hdr_t *_p = phdr; \\\n\t   (void *)(((PBYTE)(_p)) + AF_UNIX_PKT_OFFSETOF_DATA (_p)); \\\n\t})\n```","locations":[{"ref":"winsup/cygwin/fhandler/socket_unix.cc:129-133","code":"  129 | #define AF_UNIX_PKT_DATA(phdr) \\\n  130 | \t({ \\\n  131 | \t   af_unix_pkt_hdr_t _p = phdr; \\\n  132 | \t   (void *)(((PBYTE)(_p)) + AF_UNIX_PKT_OFFSETOF_DATA (_p)); \\\n  133 | \t})","lines":5,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/fhandler/socket_unix.cc#L129-L133"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"very_easy","description":"In `fhandler_pipe::open`, the object pointed to by `fh` (which is always `fhr` or `fhw`, returned by `p->pipe_fhandler()`) is allocated on the cygwin heap via `cmalloc_abort (HEAP_COMMUNE, n)` (see `commune_request` in `pinfo.cc`). The success path correctly releases it with `cfree (fh)` (line 191), but the error `out:` path releases it with the C library `free (fh)`. Freeing a cygheap allocation with `free()` mixes two different heaps and corrupts the C heap. This path is reachable: when `DuplicateHandle` fails at line 183, `fh` is non-NULL and `goto out` runs `free (fh)`.","fix":"Use the matching cygheap deallocator:\n```c\n// before\n  if (fh)\n    free (fh);\n// after\n  if (fh)\n    cfree (fh);\n```","locations":[{"ref":"winsup/cygwin/fhandler/pipe.cc:197-198","code":"  197 |   if (fh)\n  198 |     free (fh);","lines":2,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/fhandler/pipe.cc#L197-L198"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"In `timer_tracker::thread_func`, the loop body holds `srwlock` from `AcquireSRWLockExclusive (&srwlock)` (line 135). In the `SIGEV_THREAD` case, if `pthread_create` fails the code does `return 0;` (line 208) directly, without `ReleaseSRWLockExclusive (&srwlock)` and without reaching the `out:` label that calls `_my_tls._ctinfo->auto_release ()`. This both permanently leaks the per-timer SRW lock (deadlocking future timer operations) and fails to return the `cygthread` to the pool.","fix":"Replace `return 0;` on the `pthread_create` failure path with releasing the lock and jumping to the shared exit: change\n```\n\tif (rc)\n\t  {\n\t    debug_printf (\"thread creation failed, %E\");\n\t    return 0;\n\t  }\n```\nto\n```\n\tif (rc)\n\t  {\n\t    debug_printf (\"thread creation failed, %E\");\n\t    ReleaseSRWLockExclusive (&srwlock);\n\t    goto out;\n\t  }\n```","locations":[{"ref":"winsup/cygwin/posix_timer.cc:203-209","code":"  203 | \t    int rc = pthread_create (&notify_thread, attr,\n  204 | \t\t\t\t     notify_thread_wrapper, this);\n  205 | \t    if (rc)\n  206 | \t      {\n  207 | \t\tdebug_printf (\"thread creation failed, %E\");\n  208 | \t\treturn 0;\n  209 | \t      }","lines":7,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/posix_timer.cc#L203-L209"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"In `timer_tracker::settime`, the SRW lock is acquired at `AcquireSRWLockExclusive (&srwlock)` (line 281), but several error paths execute `__leave` without releasing it. The `NtCreateEvent`/`NtCreateEvent`/`NtCreateTimer` failure blocks and the `NtSetTimer` failure block set `ret` and call `__leave` while the lock is still held. `__leave` jumps past the `ReleaseSRWLockExclusive (&srwlock)` at line 397 straight to `__except (EFAULT) {}`, so the per-timer `srwlock` is left permanently locked. Any subsequent `timer_settime`/`timer_gettime`/`cancel`/`~timer_tracker` on that timer then deadlocks. (The `is_timer_tracker()` check at line 282 correctly releases before its `__leave`; only the resource-creation failure paths are broken.)","fix":"Release the lock on each failing path before `__leave`, i.e. add `ReleaseSRWLockExclusive (&srwlock);` immediately before every `__leave` inside the `else` block after line 281 (the `NtCreateEvent`, `NtCreateEvent`, `NtCreateTimer` and `NtSetTimer` failure branches), or restructure to a single cleanup label that releases the lock once.","locations":[{"ref":"winsup/cygwin/posix_timer.cc:307-337","code":"  307 | \t  if (!timer)\n  308 | \t    {\n  309 | \t      OBJECT_ATTRIBUTES attr;\n  310 | \n  311 | \t      InitializeObjectAttributes (&attr, NULL, 0, NULL, NULL);\n  312 | \t      status = NtCreateEvent (&cancel_evt, EVENT_ALL_ACCESS, &attr,\n  313 | \t\t\t\t      NotificationEvent, FALSE);\n  314 | \t      if (!NT_SUCCESS (status))\n  315 | \t\t{\n  316 | \t\t  ret = -geterrno_from_nt_status (status);\n  317 | \t\t  __leave;\n  318 | \t\t}\n  319 | \t      status = NtCreateEvent (&sync_thr, EVENT_ALL_ACCESS, &attr,\n  320 | \t\t\t\t      NotificationEvent, FALSE);\n  321 | \t      if (!NT_SUCCESS (status))\n  322 | \t\t{\n  323 | \t\t  NtClose (cancel_evt);\n  324 | \t\t  cancel_evt = NULL;\n  325 | \t\t  ret = -geterrno_from_nt_status (status);\n  326 | \t\t  __leave;\n  327 | \t\t}\n  328 | \t      status = NtCreateTimer (&timer, TIMER_ALL_ACCESS, &attr,\n  329 | \t\t\t\t      SynchronizationTimer);\n  330 | \t      if (!NT_SUCCESS (status))\n  331 | \t\t{\n  332 | \t\t  NtClose (cancel_evt);\n  333 | \t\t  NtClose (sync_thr);\n  334 | \t\t  cancel_evt = sync_thr = NULL;\n  335 | \t\t  ret = -geterrno_from_nt_status (status);\n  336 | \t\t  __leave;\n  337 | \t\t}","lines":31,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/posix_timer.cc#L307-L337"},{"ref":"winsup/cygwin/posix_timer.cc:385-394","code":"  385 | \t  status = NtSetTimer (timer, &DueTime, NULL, NULL, Resume, Period,\n  386 | \t\t\t       NULL);\n  387 | \t  if (!NT_SUCCESS (status))\n  388 | \t    {\n  389 | \t      memset (&time_spec, 0, sizeof time_spec);\n  390 | \t      interval = 0;\n  391 | \t      exp_ts = 0;\n  392 | \t      ret = -geterrno_from_nt_status (status);\n  393 | \t      __leave;\n  394 | \t    }","lines":10,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/posix_timer.cc#L385-L394"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`linebuf::operator wchar_t * ()` calls `malloc (sizeof (wchar_t) * n)` and passes the result straight into `wcs (wbuf, n)` with no NULL check. `wcs` immediately dereferences the buffer (`wbuf[0] = L'\\0'` or `sys_mbstowcs (wbuf, n, buf)`), so on allocation failure the code performs a NULL-pointer write/read and crashes. `n` derives from `ix + 1`, i.e. the assembled Windows command line length (up to `MAXWINCMDLEN`), so the size is influenced by argv/environment content. The sibling `wcs (wchar_t *wbuf)` overload is called by callers who own the buffer, but this operator is the one that allocates and therefore must validate the result.","fix":"Check `wbuf` before use, e.g. `wchar_t *wbuf = (wchar_t *) malloc (sizeof (wchar_t) * n); return wbuf ? wcs (wbuf, n) : NULL;` and have callers handle a NULL return.","locations":[{"ref":"winsup/cygwin/local_includes/winf.h:88-95","code":"   88 |   operator wchar_t * ()\n   89 |   {\n   90 |     size_t n = ix + 1;\n   91 |     /* Note that this malloc'ed buffer is not freed by the destructor.\n   92 |        It is up to the caller to do (or not do) that. */\n   93 |     wchar_t *wbuf = (wchar_t *) malloc (sizeof (wchar_t) * n);\n   94 |     return wcs (wbuf, n);\n   95 |   }","lines":8,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/local_includes/winf.h#L88-L95"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `sigaltstack`, the fault handler `__except (EFAULT) { return EFAULT; }` returns the positive value `EFAULT` (14) instead of `-1`, and does not call `set_errno`. On a genuine bad `ss`/`oss` pointer, callers see a return value of 14 rather than the POSIX-mandated `-1` with `errno == EFAULT`.","fix":"Set errno and return the failure sentinel: `__except (EFAULT) { set_errno (EFAULT); return -1; }`.","locations":[{"ref":"winsup/cygwin/signal.cc:802-806","code":"  802 |   __except (EFAULT)\n  803 |     {\n  804 |       return EFAULT;\n  805 |     }\n  806 |   __endtry","lines":5,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/signal.cc#L802-L806"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In the non-Cygwin argv conversion, `char *tmpbuf = (char *) malloc (newargvlen + 1)` is used immediately by `memcpy (tmpbuf, newargv[i], newargvlen + 1)` without a NULL check. On allocation failure this dereferences NULL (write to `tmpbuf`), crashing instead of failing the spawn cleanly.","fix":"Check `tmpbuf` for NULL after `malloc` and bail out with `set_errno (ENOMEM); res = -1; __leave;` (or skip conversion for that arg) before the `memcpy`.","locations":[{"ref":"winsup/cygwin/spawn.cc:399-400","code":"  399 | \t      char *tmpbuf = (char *)malloc (newargvlen + 1);\n  400 | \t      memcpy (tmpbuf, newargv[i], newargvlen + 1);","lines":2,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/spawn.cc#L399-L400"}]},
{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `timerfd_tracker::settime`, the result of `arm_timer (flags, new_value)` (and `disarm_timer ()`) is stored in `ret`, but the very next statement unconditionally overwrites it with `ret = 0`. Thus a failure inside `arm_timer` (e.g. `NtSetTimer` failing, which returns `-geterrno_from_nt_status (status)`) is silently discarded and `timerfd_settime` reports success even though the timer was never armed.","fix":"Remove the trailing `ret = 0;` at line 645 so the value returned by `arm_timer`/`disarm_timer` is preserved (they already return `0` on success).","locations":[{"ref":"winsup/cygwin/timerfd.cc:640-645","code":"  640 |       if (new_value->it_value.tv_sec == 0 && new_value->it_value.tv_nsec == 0)\n  641 | \tret = disarm_timer ();\n  642 |       else\n  643 | \tret = arm_timer (flags, new_value);\n  644 |       leave_critical_section ();\n  645 |       ret = 0;","lines":6,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/timerfd.cc#L640-L645"}]},
{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"negligible","difficulty":"very_easy","description":"In `mknod`, when the path is too long the code does `if (strlen (path) >= PATH_MAX) __leave;` without setting `errno`, so the function returns -1 with a stale/unrelated `errno` instead of the expected `ENAMETOOLONG`.","fix":"Set the errno before leaving. Before:\n```\n      if (strlen (path) >= PATH_MAX)\n\t__leave;\n```\nAfter:\n```\n      if (strlen (path) >= PATH_MAX)\n\t{\n\t  set_errno (ENAMETOOLONG);\n\t  __leave;\n\t}\n```","locations":[{"ref":"winsup/cygwin/syscalls.cc:3451-3452","code":" 3451 |       if (strlen (path) >= PATH_MAX)\n 3452 | \t__leave;","lines":2,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/syscalls.cc#L3451-L3452"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"very_easy","description":"`has_ansi_escape_sequences` opens the terminfo file with `CreateFileW` and checks the result with `if (h == NULL)`. `CreateFileW` returns `INVALID_HANDLE_VALUE` (not `NULL`) on failure, so a missing/unreadable terminfo file (common, e.g. `TERM=dumb` or no terminfo installed) is not detected. Execution then falls through to `ReadFile (INVALID_HANDLE_VALUE, terminfo, sizeof (terminfo), &n, 0)`, which fails and leaves `n` uninitialized and `terminfo` (an uninitialized 4096-byte stack array) unfilled. The subsequent parser dereferences `terminfo + n` and computes offsets like `str_idx[cursor_home]` / `str_table + str_idx[cursor_home]` from garbage, producing out-of-bounds reads that can crash or return a bogus pcon-capability verdict.","fix":"Before:\n```c\n  h = CreateFileW (wtinfo, GENERIC_READ, FILE_SHARE_READ,\n                   NULL, OPEN_EXISTING, 0, NULL);\n  if (h == NULL)\n    return false;\n```\nAfter:\n```c\n  h = CreateFileW (wtinfo, GENERIC_READ, FILE_SHARE_READ,\n                   NULL, OPEN_EXISTING, 0, NULL);\n  if (h == INVALID_HANDLE_VALUE)\n    return false;\n```\n(Also initialize `n = 0;` and bail out if `ReadFile` fails.)","locations":[{"ref":"winsup/cygwin/fhandler/pty.cc:3987-3994","code":" 3987 |   h = CreateFileW (wtinfo, GENERIC_READ, FILE_SHARE_READ,\n 3988 | \t\t   NULL, OPEN_EXISTING, 0, NULL);\n 3989 |   if (h == NULL)\n 3990 |     return false;\n 3991 |   char terminfo[4096];\n 3992 |   DWORD n;\n 3993 |   ReadFile (h, terminfo, sizeof (terminfo), &n, 0);\n 3994 |   CloseHandle (h);","lines":8,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/fhandler/pty.cc#L3987-L3994"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"very_easy","description":"The `OpenOptions` argument to `NtOpenFile` is `FILE_OPEN_NO_RECALL | FILE_OPEN_FOR_BACKUP_INTENT | pc.is_known_reparse_point () ? FILE_OPEN_REPARSE_POINT : 0`. In C, `|` binds tighter than `?:`, so this parses as `(FILE_OPEN_NO_RECALL | FILE_OPEN_FOR_BACKUP_INTENT | pc.is_known_reparse_point ()) ? FILE_OPEN_REPARSE_POINT : 0`. Since `FILE_OPEN_NO_RECALL` is a nonzero constant, the condition is always true and the computed options are *always exactly* `FILE_OPEN_REPARSE_POINT`, unconditionally dropping `FILE_OPEN_NO_RECALL` and `FILE_OPEN_FOR_BACKUP_INTENT` and always opening the reparse point itself. This affects the security-descriptor reopen fallback in both `get_file_sd` and `set_file_sd`: backup/restore privileges are not applied and, for a symlink, the SD of the link rather than the target is fetched/set.","fix":"Parenthesize the conditional flag:\n```\n-               | pc.is_known_reparse_point ()\n-               ? FILE_OPEN_REPARSE_POINT : 0);\n+               | (pc.is_known_reparse_point ()\n+                  ? FILE_OPEN_REPARSE_POINT : 0));\n```","locations":[{"ref":"winsup/cygwin/sec/base.cc:63-66","code":"   63 | \t\t\t   FILE_OPEN_NO_RECALL\n   64 | \t\t\t   | FILE_OPEN_FOR_BACKUP_INTENT\n   65 | \t\t\t   | pc.is_known_reparse_point ()\n   66 | \t\t\t   ? FILE_OPEN_REPARSE_POINT : 0);","lines":4,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/sec/base.cc#L63-L66"},{"ref":"winsup/cygwin/sec/base.cc:232-235","code":"  232 | \t\t\t       FILE_OPEN_NO_RECALL\n  233 | \t\t\t       | FILE_OPEN_FOR_BACKUP_INTENT\n  234 | \t\t\t       | pc.is_known_reparse_point ()\n  235 | \t\t\t       ? FILE_OPEN_REPARSE_POINT : 0);","lines":4,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/sec/base.cc#L232-L235"}]},
{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"`partition_to_label_or_uuid()` formats a 64-bit NTFS volume serial number (`nvdb->VolumeSerialNumber.QuadPart`, a `LONGLONG`) with `__small_sprintf (name, \"%016X\", ...)`. `%X` in Cygwin's `__small_sprintf` consumes a 32-bit `unsigned int`, so only the low 32 bits are printed (zero-padded to 16 digits), truncating the serial and defeating the intended 64-bit uniqueness of `/dev/disk/by-uuid/...`. The rest of this file uses the 64-bit specifier `_X` (e.g. line 186).","fix":"Use the 64-bit hex specifier:\n```\n// before\n__small_sprintf (name, \"%016X\", nvdb->VolumeSerialNumber.QuadPart);\n// after\n__small_sprintf (name, \"%016_X\", nvdb->VolumeSerialNumber.QuadPart);\n```","locations":[{"ref":"winsup/cygwin/fhandler/dev_disk.cc:311","code":"  311 |       __small_sprintf (name, \"%016X\", nvdb->VolumeSerialNumber.QuadPart);","lines":1,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/fhandler/dev_disk.cc#L311"}]},
{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"In `_ioctl`, the `SNDCTL_DSP_SETFMT`, `SNDCTL_DSP_SPEED` and `SNDCTL_DSP_CHANNELS` handlers call `close_audio_out ()` / `close_audio_in ()` (which set `audio_out_`/`audio_in_` to `NULL`) and then immediately invoke `audio_out_->query (...)` / `audio_in_->query (...)` on the now-NULL pointer (also NULL when no read/write happened yet). It works today only because `Audio_out::query`/`Audio_in::query` never dereference `this` (they operate solely on locals via `fillFormat`/`waveOutOpen`). This is undefined behavior: a compiler may assume the pointer is non-NULL after the call, and any future change to `query` that touches a member will crash.","fix":"Make `query` (and `fillFormat`, `blockSize`) `static` so the intent (no `this` access) is explicit and the NULL-object calls are well-defined, or re-query without going through the freed object (e.g. use a static/free helper for `WAVE_FORMAT_QUERY`).","locations":[{"ref":"winsup/cygwin/fhandler/dsp.cc:1294-1295","code":" 1294 | \t    close_audio_out ();\n 1295 | \t    if (audio_out_->query (audiofreq_, nBits, audiochannels_))","lines":2,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/fhandler/dsp.cc#L1294-L1295"},{"ref":"winsup/cygwin/fhandler/dsp.cc:1308-1309","code":" 1308 | \t    close_audio_in ();\n 1309 | \t    if (audio_in_->query (audiofreq_, nBits, audiochannels_))","lines":2,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/fhandler/dsp.cc#L1308-L1309"},{"ref":"winsup/cygwin/fhandler/dsp.cc:1326-1327","code":" 1326 | \t    close_audio_out ();\n 1327 | \t    if (audio_out_->query (*intbuf, audiobits_, audiochannels_))","lines":2,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/fhandler/dsp.cc#L1326-L1327"},{"ref":"winsup/cygwin/fhandler/dsp.cc:1337-1338","code":" 1337 | \t    close_audio_in ();\n 1338 | \t    if (audio_in_->query (*intbuf, audiobits_, audiochannels_))","lines":2,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/fhandler/dsp.cc#L1337-L1338"},{"ref":"winsup/cygwin/fhandler/dsp.cc:1362-1363","code":" 1362 | \t    close_audio_out ();\n 1363 | \t    if (audio_out_->query (audiofreq_, audiobits_, nChannels))","lines":2,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/fhandler/dsp.cc#L1362-L1363"},{"ref":"winsup/cygwin/fhandler/dsp.cc:1373-1374","code":" 1373 | \t    close_audio_in ();\n 1374 | \t    if (audio_in_->query (audiofreq_, audiobits_, nChannels))","lines":2,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/fhandler/dsp.cc#L1373-L1374"}]},
{"id":"API_5","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"In `mtinfo_drive::get_status`, `buf` is an `alloca`'d buffer sized for exactly 10 `DEVICE_MEDIA_INFO` entries. The code proceeds into the parse loop not only on success but also when `DeviceIoControl (IOCTL_STORAGE_GET_MEDIA_TYPES_EX)` returns `ERROR_MORE_DATA`, which means the buffer was too small. In that case `gmt->MediaInfoCount` reflects the true (larger) count, and `for (DWORD i = 0; i < gmt->MediaInfoCount; ++i) ... &gmt->MediaInfo[i]` reads past the end of the 10-entry stack buffer. The loop only breaks early if a `MEDIA_CURRENTLY_MOUNTED` entry is found among the entries that actually fit.","fix":"On the `ERROR_MORE_DATA` branch, cap the iteration count to the number of entries that actually fit in the allocated `size` (i.e. `MIN (gmt->MediaInfoCount, (size - sizeof (GET_MEDIA_TYPES)) / sizeof (DEVICE_MEDIA_INFO) + 1)`), or re-issue the IOCTL with a buffer sized from the returned `size`.","locations":[{"ref":"winsup/cygwin/fhandler/tape.cc:797-821","code":"  797 |   DWORD size = sizeof (GET_MEDIA_TYPES) + 10 * sizeof (DEVICE_MEDIA_INFO);\n  798 |   void *buf = alloca (size);\n  799 |   if (DeviceIoControl (mt, IOCTL_STORAGE_GET_MEDIA_TYPES_EX,\n  800 | \t\t       NULL, 0, buf, size, &size, NULL)\n  801 |       || GetLastError () == ERROR_MORE_DATA)\n  802 |     {\n  803 |       PGET_MEDIA_TYPES gmt = (PGET_MEDIA_TYPES) buf;\n  804 |       for (DWORD i = 0; i < gmt->MediaInfoCount; ++i)\n  805 | \t{\n  806 | \t  PDEVICE_MEDIA_INFO dmi = &gmt->MediaInfo[i];\n  807 | \t  get->mt_type = dmi->DeviceSpecific.TapeInfo.MediaType;\n  808 | #define TINFO DeviceSpecific.TapeInfo\n  809 | \t  if (dmi->TINFO.MediaCharacteristics & MEDIA_CURRENTLY_MOUNTED)\n  810 | \t    {\n  811 | \t      get->mt_type = dmi->DeviceSpecific.TapeInfo.MediaType;\n  812 | \t      if (dmi->TINFO.BusType == BusTypeScsi)\n  813 | \t\tget->mt_dsreg |=\n  814 | \t\t  (dmi->TINFO.BusSpecificData.ScsiInformation.DensityCode\n  815 | \t\t   << MT_ST_DENSITY_SHIFT)\n  816 | \t\t  & MT_ST_DENSITY_MASK;\n  817 | \t      break;\n  818 | \t    }\n  819 | #undef TINFO\n  820 | \t}\n  821 |     }","lines":25,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/fhandler/tape.cc#L797-L821"}]},
{"id":"API_6","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"`getloadavg` clamps `nelem` only from above (`if (nelem > 3) nelem = 3;`) and never rejects negative values. A negative `nelem` flows into `loadavginfo::fetch`, where `memcpy (_loadavg, loadavg, nelem * sizeof(double))` promotes the negative count to a huge `size_t`, causing an out-of-bounds copy / crash. POSIX/BSD `getloadavg` is specified to return -1 for a negative `nelem`.","fix":"Reject non-positive counts before use:\n```\n getloadavg (double loadavg[], int nelem)\n {\n+  if (nelem < 0)\n+    return -1;\n   if (nelem > 3)\n     nelem = 3;\n```","locations":[{"ref":"winsup/cygwin/loadavg.cc:212-221","code":"  212 | extern \"C\" int\n  213 | getloadavg (double loadavg[], int nelem)\n  214 | {\n  215 |   /* The maximum number of samples is 3 */\n  216 |   if (nelem > 3)\n  217 |     nelem = 3;\n  218 | \n  219 |   /* Return the samples and number of samples retrieved */\n  220 |   return cygwin_shared->loadavg.fetch(loadavg, nelem);\n  221 | }","lines":10,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/loadavg.cc#L212-L221"}]},
{"id":"API_7","type":"api_misuse","type_label":"Api Misuse","severity":"negligible","difficulty":"easy","description":"`posix_memalign` only rejects non-power-of-two alignments via `(alignment & (alignment - 1)) != 0`. POSIX additionally requires `alignment` to be a multiple of `sizeof (void *)`; values like `1`, `2`, or `4` (on LP64) are powers of two but not valid and should return `EINVAL`. Here they are accepted and passed to `dlmemalign`. No memory-safety impact (dlmalloc bumps to its minimum alignment), only a conformance deviation.","fix":"Tighten the check, e.g. `if ((alignment & (alignment - 1)) != 0 || alignment < sizeof (void *)) return EINVAL;`","locations":[{"ref":"winsup/cygwin/mm/malloc_wrapper.cc:153-154","code":"  153 |   if ((alignment & (alignment - 1)) != 0)\n  154 |     return EINVAL;","lines":2,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/mm/malloc_wrapper.cc#L153-L154"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"In `find_path_start_and_type` the local `path_type result` is initialized to `NONE` at line 408 and is never assigned any other value anywhere in the function. Consequently the branches `if (result != NONE) return result;` at lines 465-467 and 533-535 are unreachable dead code, and the sub-condition `result == NONE` at line 502 is always true. This looks like an incomplete refactor that silently disabled intended logic (the `*src = it;` update at line 534 never runs). The helper `move()` at lines 334-337 is likewise defined but never called.","fix":"Either remove the dead `result` variable and its unreachable branches (and the unused `move()` helper), or restore the missing assignments that were presumably intended to set `result` so the branches become live and the parse type is tracked correctly.","locations":[{"ref":"winsup/cygwin/msys2_path_conv.cc:408","code":"  408 |     path_type result = NONE;","lines":1,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/msys2_path_conv.cc#L408"},{"ref":"winsup/cygwin/msys2_path_conv.cc:465-467","code":"  465 |         if (result != NONE) {\n  466 |             return result;\n  467 |         }","lines":3,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/msys2_path_conv.cc#L465-L467"},{"ref":"winsup/cygwin/msys2_path_conv.cc:533-535","code":"  533 |     if (result != NONE) {\n  534 |         *src = it;\n  535 |         return result;","lines":3,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/msys2_path_conv.cc#L533-L535"},{"ref":"winsup/cygwin/msys2_path_conv.cc:334-337","code":"  334 | const char** move(const char** p, int count) {\n  335 |     *p += count;\n  336 |     return p;\n  337 | }","lines":4,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/msys2_path_conv.cc#L334-L337"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `cygwin_exception::open_stackdumpfile`, the outer guard already requires `myself->progname[0]` to be non-zero before entering the block, so the inner `if (!myself->progname[0]) p = L\"unknown\";` branch is unreachable dead code. Harmless but misleading.","fix":"Drop the dead `if (!myself->progname[0]) p = L\"unknown\";` branch (or hoist the `\"unknown\"` fallback out of the guarded block if the intent was to still dump for unnamed programs).","locations":[{"ref":"winsup/cygwin/exceptions.cc:179-188","code":"  179 |   if (myself->progname[0] && cygheap->cwd.get_handle ())\n  180 |     {\n  181 |       const WCHAR *p;\n  182 |       /* write to progname.stackdump if possible */\n  183 |       if (!myself->progname[0])\n  184 | \tp = L\"unknown\";\n  185 |       else if ((p = wcsrchr (myself->progname, L'\\\\')))\n  186 | \tp++;\n  187 |       else\n  188 | \tp = myself->progname;","lines":10,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/exceptions.cc#L179-L188"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `init_cygheap::find_tls (_cygtls *tls)` the `if (!threadlist[ix].thread->tid || !threadlist[ix].thread->initialized)` test has an empty `;` body and no `else`, so it computes a condition and discards it - a copy-paste leftover from the `find_tls (int sig, ...)` variant where the same test guards an `else if` chain. It is harmless but misleading (a reader may think uninitialized threads are skipped when they are not).","fix":"Delete the dead no-op:\n```\n-      if (!threadlist[ix].thread->tid\n-\t  || !threadlist[ix].thread->initialized)\n-\t;\n       if (threadlist[ix].thread == tls)\n```","locations":[{"ref":"winsup/cygwin/mm/cygheap.cc:726-729","code":"  726 |       if (!threadlist[ix].thread->tid\n  727 | \t  || !threadlist[ix].thread->initialized)\n  728 | \t;\n  729 |       if (threadlist[ix].thread == tls)","lines":4,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/mm/cygheap.cc#L726-L729"}]},
{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `readlink`, `buflen` is a `size_t` (unsigned), so the guard `if (buflen < 0)` is always false and the intended `ENAMETOOLONG` rejection of a negative length can never fire. The comparison is dead code.","fix":"Remove the always-false check (it compiles away and never guards anything):\n```c\n// before\nif (buflen < 0)\n  {\n    set_errno (ENAMETOOLONG);\n    return -1;\n  }\n// after\n// (removed; size_t buflen can never be < 0)\n```","locations":[{"ref":"winsup/cygwin/path.cc:3962-3966","code":" 3962 |   if (buflen < 0)\n 3963 |     {\n 3964 |       set_errno (ENAMETOOLONG);\n 3965 |       return -1;\n 3966 |     }","lines":5,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/path.cc#L3962-L3966"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The `spenvs[]` table carries the comment \"Keep this list in upper case and sorted\", but the entries are not sorted (`PATH=` precedes `MSYSTEM=`). The table is only ever scanned linearly (`for i < SPENVS_SIZE` in `build_env`), never `bsearch`ed, so the ordering does not matter - but the comment is now inaccurate and could mislead a future maintainer into assuming a binary search is safe.","fix":"Either re-sort the array (move `MSYSTEM=` before `PATH=`) or update the comment to state that the list is scanned linearly and order is irrelevant.","locations":[{"ref":"winsup/cygwin/environ.cc:1011-1028","code":" 1011 | /* Keep this list in upper case and sorted */\n 1012 | static NO_COPY spenv spenvs[] =\n 1013 | {\n 1014 | #ifdef DEBUGGING\n 1015 |   {NL (\"CYGWIN_DEBUG=\"), false, true, NULL},\n 1016 | #endif\n 1017 |   {NL (\"HOMEDRIVE=\"), false, false, &cygheap_user::env_homedrive},\n 1018 |   {NL (\"HOMEPATH=\"), false, false, &cygheap_user::env_homepath},\n 1019 |   {NL (\"LOGONSERVER=\"), false, false, &cygheap_user::env_logsrv},\n 1020 |   {NL (\"PATH=\"), false, true, NULL},\n 1021 |   {NL (\"MSYSTEM=\"), true, true, NULL},\n 1022 |   {NL (\"SYSTEMDRIVE=\"), false, true, NULL},\n 1023 |   {NL (\"SYSTEMROOT=\"), true, true, &cygheap_user::env_systemroot},\n 1024 |   {NL (\"USERDOMAIN=\"), false, false, &cygheap_user::env_domain},\n 1025 |   {NL (\"USERNAME=\"), false, false, &cygheap_user::env_name},\n 1026 |   {NL (\"USERPROFILE=\"), false, false, &cygheap_user::env_userprofile},\n 1027 |   {NL (\"WINDIR=\"), true, true, &cygheap_user::env_systemroot}\n 1028 | };","lines":18,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/environ.cc#L1011-L1028"}]},
{"id":"OTHER_1","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"`storprop_to_id_name()` computes a hash over the `STORAGE_DEVICE_UNIQUE_IDENTIFIER` by iterating `for (ULONG i = 0; i < id->Size; i++) hash = ioctl_buf[i] + ...`, where `id->Size` is a length field taken directly from the IOCTL result and `ioctl_buf` is only `NT_MAX_PATH` bytes. `bytes_read` from `DeviceIoControl` is ignored, so a driver reporting a `Size` larger than the returned/buffer size causes an out-of-bounds read of `ioctl_buf`.","fix":"Clamp the loop bound to the actually returned data, e.g. iterate `min(id->Size, bytes_read)` (and ensure that is `<= NT_MAX_PATH`) instead of trusting `id->Size` unconditionally.","locations":[{"ref":"winsup/cygwin/fhandler/dev_disk.cc:181-187","code":"  181 |   debug_printf (\"STORAGE_DEVICE_UNIQUE_IDENTIFIER.Size: %u\", id->Size);\n  182 | \n  183 |    __int128 hash = 0;\n  184 |    for (ULONG i = 0; i < id->Size; i++)\n  185 |       hash = ioctl_buf[i] + (hash << 6) + (hash << 16) - hash;\n  186 |   __small_sprintf (cp, \"_%016_Y%016_X\", (unsigned long long) (hash >> 64),\n  187 | \t\t   (unsigned long long) hash);","lines":7,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/fhandler/dev_disk.cc#L181-L187"}]},
{"id":"OTHER_2","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"`shm_open`, `shm_unlink`, `mq_open`, `mq_unlink`, `sem_open` and `sem_unlink` allocate a stack VLA sized `ipc_names[...].prefix_len + len` where `len = strlen (name)` is fully caller-controlled, and only afterwards does `check_path` enforce the `NAME_MAX` bound (`if (len > NAME_MAX - ...)`). A pathologically long `name` therefore triggers an unbounded stack allocation (guard-page crash / stack exhaustion DoS) before the length is ever validated.","fix":"Validate `len` against `NAME_MAX` (plus the semaphore/prefix allowance) before allocating the buffer, or use a fixed-size buffer of `prefix_len + NAME_MAX + 1` and have `check_path` reject over-long names first.","locations":[{"ref":"winsup/cygwin/posix_ipc.cc:136-139","code":"  136 |   size_t len = strlen (name);\n  137 |   char shmname[ipc_names[shmem].prefix_len + len];\n  138 | \n  139 |   if (!check_path (shmname, shmem, name, len))","lines":4,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/posix_ipc.cc#L136-L139"},{"ref":"winsup/cygwin/posix_ipc.cc:157-160","code":"  157 |   size_t len = strlen (name);\n  158 |   char shmname[ipc_names[shmem].prefix_len + len];\n  159 | \n  160 |   if (!check_path (shmname, shmem, name, len))","lines":4,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/posix_ipc.cc#L157-L160"},{"ref":"winsup/cygwin/posix_ipc.cc:181-184","code":"  181 |   size_t len = strlen (name);\n  182 |   char mqname[ipc_names[mqueue].prefix_len + len];\n  183 | \n  184 |   if (!check_path (mqname, mqueue, name, len))","lines":4,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/posix_ipc.cc#L181-L184"},{"ref":"winsup/cygwin/posix_ipc.cc:348-351","code":"  348 |   size_t len = strlen (name);\n  349 |   char mqname[ipc_names[mqueue].prefix_len + len];\n  350 | \n  351 |   if (!check_path (mqname, mqueue, name, len))","lines":4,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/posix_ipc.cc#L348-L351"},{"ref":"winsup/cygwin/posix_ipc.cc:385-388","code":"  385 |   size_t len = strlen (name);\n  386 |   char semname[ipc_names[semaphore].prefix_len + len];\n  387 | \n  388 |   if (!check_path (semname, semaphore, name, len))","lines":4,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/posix_ipc.cc#L385-L388"},{"ref":"winsup/cygwin/posix_ipc.cc:526-529","code":"  526 |   size_t len = strlen (name);\n  527 |   char semname[ipc_names[semaphore].prefix_len + len];\n  528 | \n  529 |   if (!check_path (semname, semaphore, name, len))","lines":4,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/posix_ipc.cc#L526-L529"}]}
