<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"In `fhandler_netdrive::opendir`, the return value `dir` of `fhandler_virtual::opendir (fd)` is dereferenced (`dir->__handle = ...`) *before* the `if (dir && ...)` NULL check on the next line. `fhandler_virtual::opendir` can legitimately return NULL (on `ENAMETOOLONG`, `ENOMEM`, or fd-allocation/open failure), so this is a NULL-pointer dereference. Note `fhandler_proc::opendir` does the equivalent assignment correctly inside a `if (dir && ...)` guard.","fix":"Guard the assignment on a non-NULL `dir`:\n```c\n// before\n  dir = fhandler_virtual::opendir (fd);\n  dir->__handle = (char *) new dir_cache ();\n  if (dir && (ret = create_thread_and_wait (dir)))\n// after\n  dir = fhandler_virtual::opendir (fd);\n  if (dir)\n    dir->__handle = (char *) new dir_cache ();\n  if (dir && (ret = create_thread_and_wait (dir)))\n```","locations":[{"ref":"winsup/cygwin/fhandler/netdrive.cc:626-628","code":"  626 |   dir = fhandler_virtual::opendir (fd);\n  627 |   dir->__handle = (char *) new dir_cache ();\n  628 |   if (dir && (ret = create_thread_and_wait (dir)))","lines":3,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/fhandler/netdrive.cc#L626-L628"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`dn_expand` follows DNS name-compression pointers (`len >= 128+64`) with only a forward bound check (`if (comp_dn >= eomorig) goto expand_fail;`). There is no detection of compression-pointer loops: a crafted message where two offsets each contain a pointer to the other (no labels in between) causes the `while ((len = *comp_dn++) != 0)` loop to jump back and forth forever - the pointer-following branch never decrements `length` and never advances `exp_dn`, so nothing bounds the iteration. Since `dn_expand` is a public exported function used to parse DNS responses (untrusted network data via `res_query`/`res_search`), this is a remotely triggerable infinite-loop/hang (DoS). `dn_length1` has the identical unbounded pointer-following pattern.","fix":"Add compression-loop protection: require each followed pointer to point strictly *backwards* (to an offset before the current position), or cap the total number of pointer indirections/bytes consumed (e.g. bound by `eomorig - msg`). Reject with `goto expand_fail;` when the bound is exceeded. Apply the same fix in `dn_length1`.","locations":[{"ref":"winsup/cygwin/libc/minires.c:845-884","code":"  845 | int dn_expand(const unsigned char *msg, const unsigned char *eomorig,\n  846 | \t      const unsigned char *comp_dn, char *exp_dn, int length)\n  847 | {\n  848 |   unsigned int len, complen = 0;\n  849 |   const unsigned char *comp_dn_orig = comp_dn;\n  850 | \n  851 |   if (comp_dn >= eomorig)\n  852 |     goto expand_fail;\n  853 |   if ((len = *comp_dn++) == 0)       /* Weird case */\n  854 |     exp_dn++;\n  855 |   else do {\n  856 |     if (len <= MAXLABEL) {\n  857 |       if ((length -= (len + 1)) >= 0 /* Need space for final . */\n  858 | \t  && comp_dn + len <= eomorig) {\n  859 | \tdo { *exp_dn++ = *comp_dn++; } while (--len != 0);\n  860 | \t*exp_dn++ = '.';\n  861 |       }\n  862 |       else\n  863 | \tgoto expand_fail;\n  864 |     }\n  865 |     else if (len >= (128+64)) {\n  866 |       if (!complen)   /* Still in the original field? */\n  867 | \tcomplen = (comp_dn - comp_dn_orig) + 1;\n  868 |       comp_dn = msg + (((len & ~(128+64)) << 8) + *comp_dn);\n  869 |       if (comp_dn >= eomorig)\n  870 | \tgoto expand_fail;\n  871 |     }\n  872 |     else\n  873 |       goto expand_fail;\n  874 |   } while ((len = *comp_dn++) != 0);\n  875 |   /* Replace last . with a 0 */\n  876 |   *(--exp_dn) = 0;\n  877 |   if (!complen)\n  878 |     complen = comp_dn - comp_dn_orig;\n  879 | /*  fprintf(stderr, \"dn_expand %s\\n\", exp_start); */\n  880 |   return complen;\n  881 | \n  882 | expand_fail:\n  883 |   errno = EINVAL;\n  884 |   return -1;","lines":40,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/libc/minires.c#L845-L884"},{"ref":"winsup/cygwin/libc/minires.c:1005-1031","code":" 1005 | int dn_length1(const unsigned char *msg, const unsigned char *eomorig,\n 1006 | \t       const unsigned char *comp_dn)\n 1007 | {\n 1008 |   unsigned int len, length = 0;\n 1009 | \n 1010 |   errno = EINVAL;\n 1011 |   if (comp_dn >= eomorig)\n 1012 |     goto expand_fail;\n 1013 |   else while ((len = *comp_dn++) != 0) {\n 1014 |     if (len <= MAXLABEL) {\n 1015 |       if ((comp_dn += len) <= eomorig)\n 1016 | \tlength += len + 1;\n 1017 |       else\n 1018 | \tgoto expand_fail;\n 1019 |     }\n 1020 |     else if (len >= (128+64)) {\n 1021 |       comp_dn = msg + (((len & ~(128+64)) << 8) + *comp_dn);\n 1022 |       if (comp_dn >= eomorig)\n 1023 | \tgoto expand_fail;\n 1024 |     }\n 1025 |     else\n 1026 |       goto expand_fail;\n 1027 |   }\n 1028 |   return length;\n 1029 | \n 1030 | expand_fail:\n 1031 |   return -1;","lines":27,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/libc/minires.c#L1005-L1031"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"`cygheap_root::set` allocates `m` with `ccalloc` (the non-aborting variant, which returns `NULL` and sets `ENOMEM` on failure) but never checks the result before dereferencing it in `strcpy (m->posix_path, posix)`. On heap exhaustion this is a `NULL`-pointer dereference / crash. Every other allocation in this file that must not fail uses the `*_abort` variant.","fix":"Use the aborting allocator so allocation failure is handled uniformly:\n```\n-  if (!m)\n-    m = (struct cygheap_root_mount_info *) ccalloc (HEAP_MOUNT, 1, sizeof (*m));\n+  if (!m)\n+    m = (struct cygheap_root_mount_info *) ccalloc_abort (HEAP_MOUNT, 1, sizeof (*m));\n```","locations":[{"ref":"winsup/cygwin/mm/cygheap.cc:596-598","code":"  596 |   if (!m)\n  597 |     m = (struct cygheap_root_mount_info *) ccalloc (HEAP_MOUNT, 1, sizeof (*m));\n  598 |   strcpy (m->posix_path, posix);","lines":3,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/mm/cygheap.cc#L596-L598"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`parse_services_line` reads the port token with `port = strtok_r (NULL, SPACE, &lasts)` and immediately does `protocol = strchr (port, '/'); *protocol++ = '\\0';` with no NULL checks. A services line containing only a name (no port field) makes `port == NULL`, so `strchr(NULL, '/')` dereferences NULL and crashes. A line whose second token has no `/` (e.g. `foo 80`) makes `protocol == NULL`, so `*protocol++ = '\\0'` writes through NULL and crashes. Any call to `getservent`/`getservbyname` against such a malformed services file crashes the process.","fix":"Guard against a missing port and a missing `/`:\n```\nport = strtok_r (NULL, SPACE, &lasts);\nprotocol = port ? strchr (port, '/') : NULL;\nif (!protocol)\n  {\n    free (line);\n    continue;\n  }\n*protocol++ = '\\0';\n```","locations":[{"ref":"winsup/cygwin/netdb.cc:188-190","code":"  188 |       port = strtok_r (NULL, SPACE, &lasts);\n  189 |       protocol = strchr (port, '/');\n  190 |       *protocol++ = '\\0';","lines":3,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/netdb.cc#L188-L190"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"`pass_handler::initialize` calls `setbuf (fp_, NULL)` before checking `fp_ == NULL`. If `fopen (\"/dev/null\", \"wb\")` fails (returns `NULL`), `setbuf` dereferences the `NULL` `FILE *` and crashes, so the `if (fp_ == NULL)` guard on the next line is never reached.","fix":"Move the NULL check before `setbuf`:\n```\n    fp_ = fopen (\"/dev/null\", \"wb\");\n    if (fp_ == NULL)\n      {\n\tdebug_printf (\"failed to open /dev/null\");\n\treturn -1;\n      }\n    setbuf (fp_, NULL);\n```","locations":[{"ref":"winsup/cygwin/syslog.cc:141-147","code":"  141 |     fp_ = fopen (\"/dev/null\", \"wb\");\n  142 |     setbuf (fp_, NULL);\n  143 |     if (fp_ == NULL)\n  144 |       {\n  145 | \tdebug_printf (\"failed to open /dev/null\");\n  146 | \treturn -1;\n  147 |       }","lines":7,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/syslog.cc#L141-L147"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`get_era_info` dereferences `ei` after a failed `realloc`. On the first loop iteration `ei` is `NULL` and `num` becomes 1; if `realloc(ei, num * sizeof(era_info_t))` fails, `tmp` is `NULL` and the error branch executes `ei->num = cur;` with `ei == NULL`, causing a NULL-pointer write/crash. (Same pattern is safe on later iterations but the first-iteration case is a genuine NULL deref on allocation failure.)","fix":"Guard the cleanup for the `ei == NULL` case, e.g. `if (!tmp) { if (ei) { ei->num = cur; free_era_info (ei); } return NULL; }`.","locations":[{"ref":"winsup/cygwin/libc/strptime.cc:117-123","code":"  117 |       era_info_t *tmp = (era_info_t *) realloc (ei, num * sizeof (era_info_t));\n  118 |       if (!tmp)\n  119 | \t{\n  120 | \t  ei->num = cur;\n  121 | \t  free_era_info (ei);\n  122 | \t  return NULL;\n  123 | \t}","lines":7,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/libc/strptime.cc#L117-L123"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`parse_protocol_line` reads `protocol = strtok_r (NULL, SPACE, &lasts)` and then `pep->p_proto = atoi (protocol)` without checking for NULL. A protocol-database line containing only a name (no protocol number) makes `protocol == NULL`, and `atoi(NULL)` dereferences a NULL pointer, crashing any caller of `getprotoent`/`getprotobyname`.","fix":"Skip the line if the protocol number token is missing:\n```\nprotocol = strtok_r (NULL, SPACE, &lasts);\nif (!protocol)\n  {\n    free (line);\n    continue;\n  }\npep->p_name = strdup (name);\n...\npep->p_proto = atoi (protocol);\n```","locations":[{"ref":"winsup/cygwin/netdb.cc:309-312","code":"  309 |       protocol = strtok_r (NULL, SPACE, &lasts);\n  310 |       pep->p_name = strdup (name);\n  311 |       paranoid_printf (\"pep->p_name strdup %p\", pep->p_name);\n  312 |       pep->p_proto = atoi (protocol);","lines":4,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/netdb.cc#L309-L312"}]},
{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"In `fhandler_registry::fill_filebuf`, `tmpbuf` is allocated with `cmalloc_abort (HEAP_BUF, size)` but is never released with `cfree`. On the normal success path (after copying into `filebuf` and setting `filesize = bufalloc`, execution falls through to `return true;`) and on the error path at the second `RegQueryValueExW` failure, `tmpbuf` is leaked from the cygwin heap. Every read of a `/proc/registry` value file leaks `size` bytes; recursively traversing/reading the registry filesystem leaks unboundedly. Additionally, the error path at that second query does `seterrno_from_win_error (...); return true;` - returning `true` (success) after a failed read leaves `filebuf` unset while the caller (`open`) treats it as success.","fix":"Free `tmpbuf` on all exits from the `handle != HKEY_PERFORMANCE_DATA` block: add `cfree (tmpbuf);` before `return true;` at the end of the block and before returning on the second-`RegQueryValueExW` error, and change that error path to `return false;` so a failed read is reported as failure rather than success.","locations":[{"ref":"winsup/cygwin/fhandler/registry.cc:953-960","code":"  953 |       PBYTE tmpbuf = (PBYTE) cmalloc_abort (HEAP_BUF, size);\n  954 |       error =\n  955 | \tRegQueryValueExW (handle, value_name, NULL, NULL, tmpbuf, &size);\n  956 |       if (error != ERROR_SUCCESS)\n  957 | \t{\n  958 | \t  seterrno_from_win_error (__FILE__, __LINE__, error);\n  959 | \t  return true;\n  960 | \t}","lines":8,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/fhandler/registry.cc#L953-L960"},{"ref":"winsup/cygwin/fhandler/registry.cc:976-1001","code":"  976 |       else\n  977 | \tmemcpy (filebuf, tmpbuf, bufalloc);\n  978 |       filesize = bufalloc;\n  979 |     }\n  980 |   else\n  981 |     {\n  982 |       bufalloc = 0;\n  983 |       do\n  984 | \t{\n  985 | \t  bufalloc += 16 * 1024;\n  986 | \t  filebuf = (char *) crealloc_abort (filebuf, bufalloc);\n  987 | \t  size = bufalloc;\n  988 | \t  error = RegQueryValueExW (handle, value_name, NULL, &type,\n  989 | \t\t\t\t    (PBYTE) filebuf, &size);\n  990 | \t  if (error != ERROR_SUCCESS && error != ERROR_MORE_DATA)\n  991 | \t    {\n  992 | \t      seterrno_from_win_error (__FILE__, __LINE__, error);\n  993 | \t      return false;\n  994 | \t    }\n  995 | \t}\n  996 |       while (error == ERROR_MORE_DATA);\n  997 |       filesize = size;\n  998 |       /* RegQueryValueEx () opens HKEY_PERFORMANCE_DATA.  */\n  999 |       RegCloseKey (handle);\n 1000 |     }\n 1001 |   return true;","lines":26,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/fhandler/registry.cc#L976-L1001"}]},
{"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"very_easy","description":"`quotactl` opens a filesystem handle with `NtOpenFile (&fh, ...)` (line 119) but never closes `fh`. There is no `NtClose (fh)` anywhere in the function - every successful call leaks one kernel file handle. Over repeated `quotactl` invocations this exhausts the process handle table.","fix":"Close the handle before returning. Inside the `if (NT_SUCCESS (status))` scope (or guarded), add `NtClose (fh);` before `return ret;`. E.g. after the outer `switch` completes and before/within the final status check, close the handle that `NtOpenFile` produced.","locations":[{"ref":"winsup/cygwin/quotactl.cc:119-330","code":"  119 |   status = NtOpenFile (&fh, access, &attr, &io, FILE_SHARE_VALID_FLAGS, 0);\n  120 |   if (NT_SUCCESS (status))\n  121 |     switch (subcmd)\n  122 |       {\n  123 |       case Q_SYNC:\n  124 | \t/* No sync, just report success. */\n  125 | \tstatus = STATUS_SUCCESS;\n  126 | \tbreak;\n  127 |       case Q_QUOTAON:\n  128 |       case Q_QUOTAOFF:\n  129 | \t/* Ignore filename in addr. */\n  130 | \tstatus = NtQueryVolumeInformationFile (fh, &io, &ffci, sizeof ffci,\n  131 | \t\t\t\t\t       FileFsControlInformation);\n  132 | \tif (!NT_SUCCESS (status))\n  133 | \t  break;\n  134 | \tffci.FileSystemControlFlags &= ~FILE_VC_QUOTA_ENFORCE\n  135 | \t\t\t\t       & ~FILE_VC_QUOTA_TRACK\n  136 | \t\t\t\t       & ~FILE_VC_QUOTAS_INCOMPLETE\n  137 | \t\t\t\t       & ~FILE_VC_QUOTAS_REBUILDING;\n  138 | \tif (subcmd == Q_QUOTAON)\n  139 | \t  ffci.FileSystemControlFlags |= FILE_VC_QUOTA_ENFORCE;\n  140 | \tstatus = NtSetVolumeInformationFile (fh, &io, &ffci, sizeof ffci,\n  141 | \t\t\t\t\t     FileFsControlInformation);\n  142 | \tbreak;\n  143 |       case Q_GETFMT:\n  144 | \t__try\n  145 | \t  {\n  146 | \t    uint32_t *retval = (uint32_t *) addr;\n  147 | \n  148 | \t    /* Always fake the latest format. */\n  149 | \t    *retval = Q {"id":"MEM_3","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"The msys2-specific argv-conversion loop replaces every argument for non-Cygwin targets via `newargv.replace (i, tmpbuf)`. `av::replace` does `argv[i] = cstrdup1 (arg)` (a cygheap allocation) but never increments `calloced`. For a plain native executable (not a script), `calloced` stays `0` after `av::setup` (the `MZ` branch `break`s without calling `dup_all`/`replace0_maybe`), so `~av` frees nothing (`for (i = 0; i < calloced; i++) cfree (argv[i])`). Every argument copy therefore leaks on the cygheap. Since `worker` returns normally for `_P_WAIT`/`_P_SYSTEM`/`_P_NOWAIT`, each `system()`/`spawnvp()` of a Windows program leaks `argc` allocations, growing unboundedly across repeated calls.","fix":"After the conversion loop, take ownership of all copies so the destructor frees them, e.g. add `newargv.all_calloced ();` once the loop completes (and/or have `replace` `cfree` any previously-owned `argv[i]` and track ownership), so the `cstrdup1` copies are released in `~av`.","locations":[{"ref":"winsup/cygwin/spawn.cc:395-406","code":"  395 | \t  for (int i = 0; i < newargv.argc; i++)\n  396 | \t    {\n  397 | \t      //convert argv to win32\n  398 | \t      int newargvlen = strlen (newargv[i]);\n  399 | \t      char *tmpbuf = (char *)malloc (newargvlen + 1);\n  400 | \t      memcpy (tmpbuf, newargv[i], newargvlen + 1);\n  401 | \t      tmpbuf = arg_heuristic_with_exclusions(tmpbuf, msys2_arg_conv_excl, msys2_arg_conv_excl_count);\n  402 | \t      debug_printf(\"newargv[%d] = %s\", i, newargv[i]);\n  403 | \t      newargv.replace (i, tmpbuf);\n  404 | \t      free (tmpbuf);\n  405 | \t    }\n  406 | \t}","lines":12,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/spawn.cc#L395-L406"},{"ref":"winsup/cygwin/local_includes/winf.h:59-62","code":"   59 |   void replace (int i, const char *arg)\n   60 |   {\n   61 |     argv[i] = cstrdup1 (arg);\n   62 |   }","lines":4,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/local_includes/winf.h#L59-L62"}]},
{"id":"MEM_4","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"very_easy","description":"In `open()`'s `O_TMPFILE` handling, `new_path` is allocated with `malloc()` and passed to `build_fh_name (new_path, opt, NULL)`. `build_fh_name` constructs a `path_conv` that *copies* the string (it never takes ownership of the pointer, as confirmed in `dtable.cc:443`). `new_path` is only `free()`d in the failure branch; on the success path the code does `delete fh; fh = fh_file;` and then the enclosing block ends, so `new_path` goes out of scope and is leaked. This leaks on every successful `O_TMPFILE` open, including every `tmpfile()` call, so it accumulates over the process lifetime.","fix":"Free `new_path` after it is no longer needed. Before:\n```\n\t      delete fh;\n\t      fh = fh_file;\n\t    }\n```\nAfter:\n```\n\t      delete fh;\n\t      fh = fh_file;\n\t      free (new_path);\n\t    }\n```","locations":[{"ref":"winsup/cygwin/syscalls.cc:1528-1549","code":" 1528 | \t  new_path = (char *) malloc (strlen (fh->get_name ())\n 1529 | \t\t\t\t      + 1  /* slash */\n 1530 | \t\t\t\t      + 10 /* prefix */\n 1531 | \t\t\t\t      + 16 /* 64 bit unique id as hex*/\n 1532 | \t\t\t\t      + 16 /* 64 bit random number as hex */\n 1533 | \t\t\t\t      + 1  /* trailing NUL */);\n 1534 | \t  if (!new_path)\n 1535 | \t    __leave;\n 1536 | \t  fh->set_unique_id ();\n 1537 | \t  RtlGenRandom (&rnd, sizeof rnd);\n 1538 | \t  __small_sprintf (new_path, \"%s/%s%016X%016X\",\n 1539 | \t\t\t   fh->get_name (), \".cyg_tmp_\",\n 1540 | \t\t\t   fh->get_unique_id (), rnd);\n 1541 | \n 1542 | \t  if (!(fh_file = build_fh_name (new_path, opt, NULL)))\n 1543 | \t    {\n 1544 | \t      free (new_path);\n 1545 | \t      __leave;\t\t/* errno already set */\n 1546 | \t    }\n 1547 | \t  delete fh;\n 1548 | \t  fh = fh_file;\n 1549 | \t}","lines":22,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/syscalls.cc#L1528-L1549"}]},
{"id":"MEM_5","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"`fhandler_dev_dsp::open` unconditionally creates `select_sem = CreateSemaphore (...)` even when the open has already failed (`err` set to `ENXIO`/`EINVAL`, or `open_null` returned `-1`). On a failed `open`, the fhandler is destroyed without `close ()` being called, so the just-created semaphore handle is never closed. Each failed `/dev/dsp` open (e.g. when no wave device is present, a common case) leaks one semaphore handle.","fix":"Only create `select_sem` on the success path, e.g. move the `CreateSemaphore` call into the `else` branch after `ret = open_null (flags);` (guarded by `ret >= 0`), or `CloseHandle (select_sem)` before returning when `ret < 0`.","locations":[{"ref":"winsup/cygwin/fhandler/dsp.cc:1093-1104","code":" 1093 |   if (err)\n 1094 |     set_errno (err);\n 1095 |   else\n 1096 |     ret = open_null (flags);\n 1097 | \n 1098 |   select_sem = CreateSemaphore (sec_none_cloexec (mode), 0, INT32_MAX, NULL);\n 1099 | \n 1100 |   debug_printf (\"ACCMODE=%y audio_in=%d audio_out=%d, err=%d, ret=%d\",\n 1101 | \t\tflags & O_ACCMODE, num_in, num_out, err, ret);\n 1102 |   if (ret >= 0)\n 1103 |     being_closed = false;\n 1104 |   return ret;","lines":12,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/fhandler/dsp.cc#L1093-L1104"}]},
{"id":"MEM_6","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"In `fhandler_netdrive::opendir`, when `create_thread_and_wait (dir)` fails, the cleanup frees `dir->__d_dirname`, `dir->__d_dirent` and `dir`, but never deletes the `dir_cache` object that was allocated with `new dir_cache ()` and stored in `dir->__handle`. Since `closedir` (the only place that runs `delete &DIR_cache`) is never reached for a failed `opendir`, the `dir_cache` (and its `wcsdup`'d entries) leaks on every failed network enumeration.","fix":"Before freeing `dir`, `delete (dir_cache *) dir->__handle;` (or `delete &DIR_cache;`) in the error branch so the `dir_cache` allocated at line 627 is released.","locations":[{"ref":"winsup/cygwin/fhandler/netdrive.cc:628-637","code":"  628 |   if (dir && (ret = create_thread_and_wait (dir)))\n  629 |     {\n  630 |       free (dir->__d_dirname);\n  631 |       free (dir->__d_dirent);\n  632 |       free (dir);\n  633 |       dir = NULL;\n  634 |       set_errno (ret);\n  635 |       syscall_printf (\"%p = opendir (%s)\", dir, get_name ());\n  636 |     }\n  637 |   return dir;","lines":10,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/fhandler/netdrive.cc#L628-L637"}]},
{"id":"MEM_7","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"In `fhandler_pipe::open`, both `fhr` (line 166) and `fhw` (line 171) are separately `cmalloc`'d by `p->pipe_fhandler()`, but only the selected `fh` is ever released. When opening the write side (`O_WRONLY`) while the remote read-side fhandler also exists, `fhr` is non-NULL yet `fh` is set to `fhw`, so `fhr` leaks on both the success path (`cfree (fh)` frees only `fhw`) and the `out:` path. Symmetrically, when neither matches the requested access mode, `fh` is NULL and the `out:` cleanup's `if (fh)` frees nothing, leaking whichever of `fhr`/`fhw` was allocated. These are cygheap leaks on each such `/proc/<pid>/fd/pipe:[...]` open.","fix":"Track and `cfree` both allocations independently, e.g. free `fhr` when it is non-NULL and not adopted as `fh`, and free `fhw` likewise, on every exit path (success and `out:`).","locations":[{"ref":"winsup/cygwin/fhandler/pipe.cc:166-201","code":"  166 |   fhr = p->pipe_fhandler (uniq_id, size);\n  167 |   if (fhr && rwflags == O_RDONLY)\n  168 |     fh = fhr;\n  169 |   else\n  170 |     {\n  171 |       fhw = p->pipe_fhandler (uniq_id + 1, size);\n  172 |       if (fhw && rwflags == O_WRONLY)\n  173 | \tfh = fhw;\n  174 |     }\n  175 |   if (!fh)\n  176 |     {\n  177 |       /* Too bad, but Windows only allows the same access mode when dup'ing\n  178 | \t the pipe. */\n  179 |       set_errno (fhr || fhw ? EACCES : ENOENT);\n  180 |       goto out;\n  181 |     }\n  182 |   inh = !(flags & O_CLOEXEC);\n  183 |   if (!DuplicateHandle (proc, fh->get_handle (), GetCurrentProcess (),\n  184 | \t\t\t&nio_hdl, 0, inh, DUPLICATE_SAME_ACCESS))\n  185 |     {\n  186 |       __seterrno ();\n  187 |       goto out;\n  188 |     }\n  189 |   init (nio_hdl, fh->get_access (), mode & O_TEXT ?: O_BINARY,\n  190 | \tfh->get_plain_ino ());\n  191 |   cfree (fh);\n  192 |   CloseHandle (proc);\n  193 |   return 1;\n  194 | out:\n  195 |   if (nio_hdl)\n  196 |     CloseHandle (nio_hdl);\n  197 |   if (fh)\n  198 |     free (fh);\n  199 |   if (proc)\n  200 |     CloseHandle (proc);\n  201 |   return 0;","lines":36,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/fhandler/pipe.cc#L166-L201"}]},
{"id":"MEM_8","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"In `lf_setlock`, every `return ENOLCK` path abandons the freshly allocated `lock` (`lockf_t` from `cmalloc`, created in `fhandler_base::lock`). On these paths `lock` has neither been linked into the inode's lock list nor pushed onto `*clean` (unlike the `EAGAIN`/`EINTR`/`ECANCELED` paths which do `lock->lf_next = *clean; *clean = lock;`). Back in `fhandler_base::lock`, the cleanup loop reuses the same variable via `for (lock = clean; ...)`, overwriting the original pointer, so the abandoned `lockf_t` is never freed. Each `F_SETLK` (or `F_SETLKW`) that hits the `MAX_LOCKF_CNT` guard leaks one `lockf_t`; a program that repeatedly requests locks against a file already holding near-`MAX_LOCKF_CNT` locks leaks cygheap memory on every call, a slow resource-exhaustion vector. The six `return ENOLCK` sites are at `flock.cc:1409`, `1423`, `1449`, `1467`, `1496`, and `1514`; all occur while `lock` is still unlinked (`needtolink` true or the case-1/case-2 duplicate case), so pushing it to `clean` is safe.","fix":"Before each `return ENOLCK;` in `lf_setlock`, splice `lock` onto the clean list so the caller frees it, mirroring the other early-return paths, e.g. replace `return ENOLCK;` with `{ lock->lf_next = *clean; *clean = lock; return ENOLCK; }`. Alternatively, restructure so `lf_setlock` always routes `lock` to `*clean` on failure.","locations":[{"ref":"winsup/cygwin/flock.cc:1405-1526","code":" 1405 | \tcase 0: /* no overlap */\n 1406 | \t  if (needtolink)\n 1407 | \t    {\n 1408 | \t      if (lock_cnt > MAX_LOCKF_CNT - room_for_clearlock)\n 1409 | \t\treturn ENOLCK;\n 1410 | \t      *prev = lock;\n 1411 | \t      lock->lf_next = overlap;\n 1412 | \t      lock->create_lock_obj ();\n 1413 | \t    }\n 1414 | \t    break;\n 1415 | \n 1416 | \tcase 1: /* overlap == lock */\n 1417 | \t  /*\n 1418 | \t   * If downgrading lock, others may be\n 1419 | \t   * able to acquire it.\n 1420 | \t   * Cygwin: Always wake lock.\n 1421 | \t   */\n 1422 | \t  if (lock_cnt > MAX_LOCKF_CNT - room_for_clearlock)\n 1423 | \t    return ENOLCK;\n 1424 | \t  /* Do not create a lock here. It should be done after all\n 1425 | \t     overlaps have been removed. */\n 1426 | \t  lf_wakelock (overlap, fhdl);\n 1427 | \t  *prev = overlap->lf_next;\n 1428 | \t  overlap->lf_next = *clean;\n 1429 | \t  *clean = overlap;\n 1430 | \t  /* We may have multiple versions (lf_ver) having same lock range.\n 1431 | \t     Therefore, we need to find overlap repeatedly. (originally,\n 1432 | \t     just 'break' here. */\n 1433 | \t  continue;\n 1434 | \n 1435 | \tcase 2: /* overlap contains lock */\n 1436 | \t  /*\n 1437 | \t   * Check for common starting point and different types.\n 1438 | \t   */\n 1439 | \t  if (overlap->lf_type == lock->lf_type)\n 1440 | \t    {\n 1441 | \t      lock->lf_next = *clean;\n 1442 | \t      *clean = lock;\n 1443 | \t      break;\n 1444 | \t    }\n 1445 | \t  if (overlap->lf_start < lock->lf_start\n 1446 | \t      && overlap->lf_end > lock->lf_end)\n 1447 | \t    lock_cnt++;\n 1448 | \t  if (lock_cnt > MAX_LOCKF_CNT - room_for_clearlock)\n 1449 | \t    return ENOLCK;\n 1450 | \t  if (overlap->lf_start == lock->lf_start)\n 1451 | \t    {\n 1452 | \t      *prev = lock;\n 1453 | \t      lock->lf_next = overlap;\n 1454 | \t      overlap->lf_start = lock->lf_end + 1;\n 1455 | \t    }\n 1456 | \t  else\n 1457 | \t    lf_split (overlap, lock, clean);\n 1458 | \t  lf_wakelock (overlap, fhdl);\n 1459 | \t  overlap->create_lock_obj ();\n 1460 | \t  lock->create_lock_obj ();\n 1461 | \t  if (lock->lf_next && !lock->lf_next->lf_obj)\n 1462 | \t    lock->lf_next->create_lock_obj ();\n 1463 | \t  break;\n 1464 | \n 1465 | \tcase 3: /* lock contains overlap */\n 1466 | \t  if (needtolink && lock_cnt > MAX_LOCKF_CNT - room_for_clearlock)\n 1467 | \t    return ENOLCK;\n 1468 | \t  /*\n 1469 | \t   * If downgrading lock, others may be able to\n 1470 | \t   * acquire it, otherwise take the list.\n 1471 | \t   * Cygwin: Always wake old lock and create new lock.\n 1472 | \t   */\n 1473 | \t  lf_wakelock (overlap, fhdl);\n 1474 | \t  /*\n 1475 | \t   * Add the new lock if necessary and delete the overlap.\n 1476 | \t   */\n 1477 | \t  if (needtolink)\n 1478 | \t    {\n 1479 | \t      *prev = lock;\n 1480 | \t      lock->lf_next = overlap->lf_next;\n 1481 | \t      prev = &lock->lf_next;\n 1482 | \t      lock->create_lock_obj ();\n 1483 | \t      needtolink = 0;\n 1484 | \t    }\n 1485 | \t  else\n 1486 | \t    *prev = overlap->lf_next;\n 1487 | \t  overlap->lf_next = *clean;\n 1488 | \t  *clean = overlap;\n 1489 | \t  continue;\n 1490 | \n 1491 | \tcase 4: /* overlap starts before lock */\n 1492 | \t  /*\n 1493 | \t   * Add lock after overlap on the list.\n 1494 | \t   */\n 1495 | \t  if (lock_cnt > MAX_LOCKF_CNT - room_for_clearlock)\n 1496 | \t    return ENOLCK;\n 1497 | \t  lock->lf_next = overlap->lf_next;\n 1498 | \t  overlap->lf_next = lock;\n 1499 | \t  overlap->lf_end = lock->lf_start - 1;\n 1500 | \t  prev = &lock->lf_next;\n 1501 | \t  lf_wakelock (overlap, fhdl);\n 1502 | \t  overlap->create_lock_obj ();\n 1503 | \t  lock->create_lock_obj ();\n 1504 | \t  needtolink = 0;\n 1505 | \t  continue;\n 1506 | \n 1507 | \tcase 5: /* overlap ends after lock */\n 1508 | \t  /*\n 1509 | \t   * Add the new lock before overlap.\n 1510 | \t   */\n 1511 | \t  if (needtolink)\n 1512 | \t    {\n 1513 | \t      if (lock_cnt > MAX_LOCKF_CNT - room_for_clearlock)\n 1514 | \t\treturn ENOLCK;\n 1515 | \t      *prev = lock;\n 1516 | \t      lock->lf_next = overlap;\n 1517 | \t      lock->create_lock_obj ();\n 1518 | \t    }\n 1519 | \t  overlap->lf_start = lock->lf_end + 1;\n 1520 | \t  lf_wakelock (overlap, fhdl);\n 1521 | \t  overlap->create_lock_obj ();\n 1522 | \t  break;\n 1523 | \t}\n 1524 |       break;\n 1525 |     }\n 1526 |   return 0;","lines":122,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/flock.cc#L1405-L1526"},{"ref":"winsup/cygwin/flock.cc:1179-1185","code":" 1179 |   for (lock = clean; lock != NULL; )\n 1180 |     {\n 1181 |       lockf_t *n = lock->lf_next;\n 1182 |       lock->del_lock_obj (get_handle (), a_op == F_UNLCK);\n 1183 |       delete lock;\n 1184 |       lock = n;\n 1185 |     }","lines":7,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/flock.cc#L1179-L1185"}]},
{"id":"MEM_9","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"very_easy","description":"In the rfc2307 branch of `remap_uid` (and identically `remap_gid`), `mbname` is allocated by `sys_wcstombs_alloc(&mbname, HEAP_NOTHEAP, name)` but never freed on any path - neither after a successful `internal_getpwnam`/`internal_getgrnam` nor when it fails. Every uid/gid remap via the rfc2307 path leaks a small heap allocation.","fix":"Free `mbname` after use. Before (in `remap_uid`):\n```c\n      char *mbname = NULL;\n      sys_wcstombs_alloc (&mbname, HEAP_NOTHEAP, name);\n      if ((pw = internal_getpwnam (mbname)))\n\treturn pw->pw_uid;\n```\nAfter:\n```c\n      char *mbname = NULL;\n      sys_wcstombs_alloc (&mbname, HEAP_NOTHEAP, name);\n      pw = internal_getpwnam (mbname);\n      free (mbname);\n      if (pw)\n\treturn pw->pw_uid;\n```\nApply the analogous change in `remap_gid`.","locations":[{"ref":"winsup/cygwin/ldap.cc:683-689","code":"  683 |   else if ((name = fetch_unix_name_from_rfc2307 (uid, false)))\n  684 |     {\n  685 |       char *mbname = NULL;\n  686 |       sys_wcstombs_alloc (&mbname, HEAP_NOTHEAP, name);\n  687 |       if ((pw = internal_getpwnam (mbname)))\n  688 | \treturn pw->pw_uid;\n  689 |     }","lines":7,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/ldap.cc#L683-L689"},{"ref":"winsup/cygwin/ldap.cc:707-713","code":"  707 |   else if ((name = fetch_unix_name_from_rfc2307 (gid, true)))\n  708 |     {\n  709 |       char *mbname = NULL;\n  710 |       sys_wcstombs_alloc (&mbname, HEAP_NOTHEAP, name);\n  711 |       if ((gr = internal_getgrnam (mbname)))\n  712 | \treturn gr->gr_gid;\n  713 |     }","lines":7,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/ldap.cc#L707-L713"}]},
{"id":"MEM_10","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"`mtx_init` initializes a local `pthread_mutexattr_t attr` with `pthread_mutexattr_init` but never calls `pthread_mutexattr_destroy`. On Cygwin/MSYS2 `pthread_mutexattr_t` is a pointer to a heap-allocated object, so each `mtx_init` call leaks the attribute object (the successful path and every early-return-after-init path).","fix":"Call `pthread_mutexattr_destroy(&attr)` before returning once `pthread_mutexattr_init` has succeeded (on both the success and the `pthread_mutex_init` failure paths), e.g. store the `pthread_mutex_init` result, destroy the attr, then return `thrd_error`/`thrd_success`.","locations":[{"ref":"winsup/cygwin/libc/mtx.c:46-72","code":"   46 | int\n   47 | mtx_init(mtx_t *mtx, int type)\n   48 | {\n   49 | \tpthread_mutexattr_t attr;\n   50 | \tint mt;\n   51 | \n   52 | \tswitch (type) {\n   53 | \tcase mtx_plain:\n   54 | \tcase mtx_timed:\n   55 | \t\tmt = PTHREAD_MUTEX_NORMAL;\n   56 | \t\tbreak;\n   57 | \tcase mtx_plain | mtx_recursive:\n   58 | \tcase mtx_timed | mtx_recursive:\n   59 | \t\tmt = PTHREAD_MUTEX_RECURSIVE;\n   60 | \t\tbreak;\n   61 | \tdefault:\n   62 | \t\treturn (thrd_error);\n   63 | \t}\n   64 | \n   65 | \tif (pthread_mutexattr_init(&attr) != 0)\n   66 | \t\treturn (thrd_error);\n   67 | \tif (pthread_mutexattr_settype(&attr, mt) != 0)\n   68 | \t\treturn (thrd_error);\n   69 | \tif (pthread_mutex_init(mtx, &attr) != 0)\n   70 | \t\treturn (thrd_error);\n   71 | \treturn (thrd_success);\n   72 | }","lines":27,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/libc/mtx.c#L46-L72"}]},
{"id":"MEM_11","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"In `unlink_nt`, inside the `STATUS_DIRECTORY_NOT_EMPTY` retry loop, the reopen (`NtClose (fh)` + `NtOpenFile (&fh, ...)`) only happens when `!reopened` (i.e. `reopened == 0`). For `reopened >= 1`, `status2` stays `STATUS_SUCCESS` (its initializer) and `fh` remains the still-open handle from the earlier `NtOpenFile`. When `reopened` reaches 20 the first branch `if (NT_SUCCESS (status2) && reopened < 20)` is false, so control falls into `else if (status2 != STATUS_OBJECT_PATH_NOT_FOUND && status2 != STATUS_OBJECT_NAME_NOT_FOUND)` (true, since `status2 == STATUS_SUCCESS`), which sets `fh = NULL`. This discards a still-valid open handle without closing it (the later `if (fh) NtClose (fh)` is skipped), leaking the handle until process exit. The `fh = NULL` is only correct in the `reopened == 0` case where `fh` was already closed by the failed reopen.","fix":"Only null `fh` when it was actually closed by a failed reopen (i.e. when `!reopened` performed the `NtClose`). Guard the `fh = NULL;` assignment with the reopen condition, otherwise leave `fh` intact so it is closed by the `if (fh) NtClose (fh)` cleanup at the end of the function.","locations":[{"ref":"winsup/cygwin/syscalls.cc:1023-1029","code":" 1023 | \t  else if (status2 != STATUS_OBJECT_PATH_NOT_FOUND\n 1024 | \t\t   && status2 !=  STATUS_OBJECT_NAME_NOT_FOUND)\n 1025 | \t    {\n 1026 | \t      fh = NULL;\n 1027 | \t      debug_printf (\"Opening dir %S for check_dir_not_empty failed, \"\n 1028 | \t\t\t    \"status = %y\", pc.get_nt_native_path (), status2);\n 1029 | \t    }","lines":7,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/syscalls.cc#L1023-L1029"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"`fhandler_dev_disk::init_dev_disk()` copies the trailing path component (the requested `by-*/LINK` name) into the fixed-size stack buffer `by_id_entry key` with an unchecked `strcpy (key.name, path + dirlen + 1)`. `key.name` is only `char[NAME_MAX + 1]` (256 bytes). `loc_is_link` is set whenever the remainder after the `by-...` directory contains no further `/`, so the entire remainder is treated as one component regardless of length. A lookup such as `open(\"/dev/disk/by-id/AAAA...\")` with a component longer than `NAME_MAX` (virtual paths are not length-limited to `NAME_MAX` per component before reaching here) overflows the stack buffer.","fix":"Bound the copy: reject over-long names before copying, e.g. `if (strlen (path + dirlen + 1) > NAME_MAX) { loc = invalid_loc; return; }` prior to the `strcpy`, or use a bounded copy (`strlcpy (key.name, path + dirlen + 1, sizeof key.name)`) and treat truncation as `invalid_loc`.","locations":[{"ref":"winsup/cygwin/fhandler/dev_disk.cc:723-724","code":"  723 |   by_id_entry key;\n  724 |   strcpy (key.name, path + dirlen + 1);","lines":2,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/fhandler/dev_disk.cc#L723-L724"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"very_easy","description":"In `fhandler_mqueue::_mqinfo`, the stack buffer `WCHAR buf[NAME_MAX + sizeof (\"mqueue/XXX\")]` (266 WCHARs) is filled with `__small_swprintf (buf, L\"mqueue/mtx%s\", get_name ())`. The `%s` conversion (see `smallprint.cc:609-615`) widens the *entire* narrow string, and `get_name ()` returns the full posix path `/dev/mqueue/<name>` (confirmed by `valid_path` which reads the basename at `get_name () + MQ_LEN`, and `MQ_PATH=\"/dev/mqueue/\"`). The written content is therefore `\"mqueue/mtx\"` (10) + `\"/dev/mqueue/\"` (`MQ_LEN`=12) + `<name>` + NUL = `23 + namelen` WCHARs. `valid_path` accepts `namelen` up to `NAME_MAX` (255), so any mqueue name of 244-255 characters overflows `buf` by up to 12 WCHARs (24 bytes) of program-controlled data on the stack. The buffer was clearly sized for the basename only (`NAME_MAX + sizeof (\"mqueue/XXX\")` exactly fits `\"mqueue/XXX\"`+`NAME_MAX`+NUL), but the code passes the full path.","fix":"Enlarge the buffer to account for the `MQ_LEN`-byte `/dev/mqueue/` prefix that `get_name ()` contributes.\nBefore:\n```c\n  WCHAR buf[NAME_MAX + sizeof (\"mqueue/XXX\")];\n```\nAfter:\n```c\n  WCHAR buf[MQ_LEN + NAME_MAX + sizeof (\"mqueue/XXX\")];\n```\n(Alternatively pass `get_name () + MQ_LEN` to keep the object name basename-only, but that changes the object naming scheme.)","locations":[{"ref":"winsup/cygwin/fhandler/mqueue.cc:161-174","code":"  161 |   WCHAR buf[NAME_MAX + sizeof (\"mqueue/XXX\")];\n  162 |   UNICODE_STRING uname;\n  163 |   OBJECT_ATTRIBUTES oa;\n  164 |   NTSTATUS status;\n  165 |   LARGE_INTEGER fsiz = { QuadPart: (LONGLONG) filesize };\n  166 |   PVOID mptr = NULL;\n  167 | \n  168 |   /* Set sectsize prior to using filesize in NtMapViewOfSection.  It will\n  169 |      get pagesize aligned, which breaks the next NtMapViewOfSection in fork. */\n  170 |   mqinfo ()->mqi_sectsize = filesize;\n  171 |   mqinfo ()->mqi_mode = mode;\n  172 |   set_nonblocking (flags & O_NONBLOCK);\n  173 | \n  174 |   __small_swprintf (buf, L\"mqueue/mtx%s\", get_name ());","lines":14,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/fhandler/mqueue.cc#L161-L174"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"In `fhandler_pty_master::write`, when the foreground app is non-cygwin, the pseudo console is activated (`pcon_activated && pty_input_state == tty::to_nat`), and `term_code_page == CP_UTF8`, the code takes the `else` branch `memcpy (buf, ptr, nlen)` where `nlen` was set to the caller-supplied `len` at `size_t nlen = len;`. `buf` comes from `tp.c_get ()`, a fixed `NT_MAX_PATH` (32768) byte TLS buffer. `len` is the unbounded byte count passed to `write()` by whoever holds the pty master fd (e.g. a terminal emulator pasting a large block). If `len > NT_MAX_PATH`, `memcpy` overruns the TLS path buffer, corrupting adjacent memory. The `convert_mb_str` branch is safe because it caps output to `nlen = NT_MAX_PATH`, but the raw-`memcpy` branch has no such cap.","fix":"Cap the copy length to the buffer size, e.g. `size_t nlen = MIN (len, (size_t) NT_MAX_PATH);` and use that as the `memcpy` length (`memcpy (buf, ptr, nlen);`), or loop/chunk the write. Note `len` is later reused, so ensure the reduced count is handled (return `orig_len` only after all bytes are actually forwarded).","locations":[{"ref":"winsup/cygwin/fhandler/pty.cc:2379-2389","code":" 2379 |       size_t nlen = len;\n 2380 |       if (get_ttyp ()->term_code_page != CP_UTF8)\n 2381 | \t{\n 2382 | \t  static mbstate_t mbp;\n 2383 | \t  nlen = NT_MAX_PATH;\n 2384 | \t  convert_mb_str (CP_UTF8, buf, &nlen,\n 2385 | \t\t\t  get_ttyp ()->term_code_page, (const char *) ptr, len,\n 2386 | \t\t\t  &mbp);\n 2387 | \t}\n 2388 |       else\n 2389 | \tmemcpy (buf, ptr, nlen);","lines":11,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/fhandler/pty.cc#L2379-L2389"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"`cygheap_root::set` copies the incoming `posix` and `native` strings into `m->posix_path` and `m->native_path`, which are fixed `char[CYG_MAX_PATH]` (260) buffers, using unbounded `strcpy`. The only caller, `chroot()` in `syscalls.cc:3832`, passes `path.get_posix()` and `path.get_win32()`, both of which come from a `path_conv` and can be as long as `NT_MAX_PATH` (32K), far exceeding 260. Because `chroot()` is deliberately NOT privileged here (see its `FIXME: Not privileged`), any process can call `chroot(dir)` on an existing directory whose resolved POSIX/Win32 path is >= 260 chars and smash the heap-allocated `cygheap_root_mount_info` struct (and adjacent cygheap data). This is a reachable heap buffer overflow.","fix":"Validate lengths before copying and fail (or truncate safely) instead of `strcpy`. E.g. after computing `strlen(posix)`/`strlen(native)`, if either `>= CYG_MAX_PATH` set `errno` and make `set`/`chroot` report failure, or store the paths in dynamically sized cygheap allocations (`cstrdup`) instead of fixed `CYG_MAX_PATH` arrays. Replace the raw `strcpy` calls with bounded copies (`*stpncpy`/`strlcpy`) guarded by the length check.","locations":[{"ref":"winsup/cygwin/mm/cygheap.cc:598-606","code":"  598 |   strcpy (m->posix_path, posix);\n  599 |   m->posix_pathlen = strlen (posix);\n  600 |   if (m->posix_pathlen >= 1 && m->posix_path[m->posix_pathlen - 1] == '/')\n  601 |     m->posix_path[--m->posix_pathlen] = '\\0';\n  602 | \n  603 |   strcpy (m->native_path, native);\n  604 |   m->native_pathlen = strlen (native);\n  605 |   if (m->native_pathlen >= 1 && m->native_path[m->native_pathlen - 1] == '\\\\')\n  606 |     m->native_path[--m->native_pathlen] = '\\0';","lines":9,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/mm/cygheap.cc#L598-L606"}]},
{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"In `symlink_info::check_shortcut`, the device-file branch does an unbounded `strcpy (contents, cp)` where `contents` is the fixed-size member `char contents[SYMLINK_MAX + 1]` (`SYMLINK_MAX == PATH_MAX - 1`, i.e. ~4 KB) and `cp` points into `buf`, which holds the raw `.lnk` file content and may be up to `4 * 65536` bytes (see the size cap and `alloca (fsi.EndOfFile.LowPart + 1)` at the top of the function). The description length is taken from a file-controlled `unsigned short len`, but the device branch ignores `len` entirely and copies until a NUL. A crafted shortcut whose description begins with `:\\` and is longer than `SYMLINK_MAX` (or is not NUL-terminated within `buf`) overflows `contents`, which lives inside the stack-allocated `symlink_info sym` of `path_conv::check`. This is triggerable during ordinary path resolution (stat/open/readlink) of any attacker-controlled read-only `.lnk` file, giving a stack buffer overflow. Note the related unguarded over-read at `*(unsigned short *) (cp + len)` on line 2688 and the `cp += *(unsigned short *) cp + 2` IDLIST skip on line 2678, both of which can also index past `buf`. Every other branch of this function correctly enforces `SYMLINK_MAX`; only the device branch is unchecked.","fix":"Bound the device-file copy like the other branches, e.g. reject when `strnlen (cp, SYMLINK_MAX + 1) > SYMLINK_MAX` (or when `cp + len` exceeds `buf + fsi.EndOfFile.LowPart`) before copying, and use a length-limited copy into `contents`. Also validate that `cp` and `cp + len` stay within `buf + fsi.EndOfFile.LowPart` before dereferencing.","locations":[{"ref":"winsup/cygwin/path.cc:2683-2684","code":" 2683 |   if (strncmp (cp, \":\\\\\", 2) == 0)\n 2684 |     res = strlen (strcpy (contents, cp)); /* Don't mess with device files */","lines":2,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/path.cc#L2683-L2684"},{"ref":"winsup/cygwin/path.cc:2688-2689","code":" 2688 |       unsigned short relpath_len = *(unsigned short *) (cp + len);\n 2689 |       if (cp + len + 2 + relpath_len < buf + fsi.EndOfFile.LowPart)","lines":2,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/path.cc#L2688-L2689"}]},
{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"In `__aclfromtext` the parse loop (`for (bufp = strtok_r (...); bufp; ...)`) writes into `lacl[pos]` and does `++pos` on every parsed entry with no `pos < MAX_ACL_ENTRIES` bound check. `lacl` is a `tp.c_get ()` buffer of `NT_MAX_PATH` (32768) bytes, holding at most `MAX_ACL_ENTRIES` (2730) `aclent_t` (12 bytes each = 32760 bytes). The input `buf = tp.t_get ()` accepts a string up to `2 * NT_MAX_PATH - 1` (65535) chars, and a minimal short-form entry such as `o::r,` is only 5 chars, so a caller-supplied text can yield ~13000 entries. Writing `lacl[pos].a_type`, `lacl[pos].a_id`, `lacl[pos].a_perm` for `pos` far beyond 2730 overruns the 32768-byte TLS buffer into adjacent `tls_pbuf` storage. Reachable via the public `acl_from_text ()` / `aclfromtext ()` APIs.","fix":"Add a bounds guard at the top of the loop body, e.g. `if (pos >= MAX_ACL_ENTRIES) { set_errno (EINVAL); return NULL; }`, before writing `lacl[pos]`.","locations":[{"ref":"winsup/cygwin/sec/acl.cc:1912-1994","code":" 1912 |   for (bufp = strtok_r (buf, delim, &lasts);\n 1913 |        bufp;\n 1914 |        bufp = strtok_r (NULL, delim, &lasts))\n 1915 |     {\n 1916 |       /* Handle default acl entries only for Solaris ACLs. */\n 1917 |       if (!posix && _CMP (default_s))\n 1918 | \t{\n 1919 | \t  lacl[pos].a_type |= ACL_DEFAULT;\n 1920 | \t  bufp += acl_part[default_s].len;\n 1921 | \t}\n 1922 |       lacl[pos].a_id = ACL_UNDEFINED_ID;\n 1923 |       for (acl_type = user_s; acl_type < none_s; ++acl_type)\n 1924 | \tif (_CMP (acl_type))\n 1925 | \t  break;\n 1926 |       if (acl_type == none_s)\n 1927 | \t{\n 1928 | \t  set_errno (EINVAL);\n 1929 | \t  return NULL;\n 1930 | \t}\n 1931 |       bufp += acl_part[acl_type].len;\n 1932 |       switch (acl_type)\n 1933 | \t{\n 1934 | \tcase user_s:\n 1935 | \tcase group_s:\n 1936 | \t  qualifier = bufp;\n 1937 | \t  bufp = strchrnul (bufp, ':');\n 1938 | \t  *bufp++ = '\\0';\n 1939 | \t  /* No qualifier?  USER_OBJ or GROUP_OBJ */\n 1940 | \t  if (!*qualifier)\n 1941 | \t    {\n 1942 | \t      lacl[pos].a_type |= (acl_type == user_s) ? USER_OBJ : GROUP_OBJ;\n 1943 | \t      break;\n 1944 | \t    }\n 1945 | \t  /* Some qualifier, USER or GROUP */\n 1946 | \t  lacl[pos].a_type |= (acl_type == user_s) ? USER : GROUP;\n 1947 | \t  if (isdigit (*qualifier))\n 1948 | \t    {\n 1949 | \t      char *ep;\n 1950 | \n 1951 | \t      id_t id = strtol (qualifier, &ep, 10);\n 1952 | \t      if (*ep == '\\0')\n 1953 | \t\t{\n 1954 | \t\t  lacl[pos].a_id = id;\n 1955 | \t\t  break;\n 1956 | \t\t}\n 1957 | \t    }\n 1958 | \t  if (acl_type == user_s)\n 1959 | \t    {\n 1960 | \t      struct passwd *pw = internal_getpwnam (qualifier, &cldap);\n 1961 | \t      if (pw)\n 1962 | \t\tlacl[pos].a_id = pw->pw_uid;\n 1963 | \t    }\n 1964 | \t  else\n 1965 | \t    {\n 1966 | \t      struct group *gr = internal_getgrnam (qualifier, &cldap);\n 1967 | \t      if (gr)\n 1968 | \t\tlacl[pos].a_id = gr->gr_gid;\n 1969 | \t    }\n 1970 | \t  if (lacl[pos].a_id == ACL_UNDEFINED_ID)\n 1971 | \t    {\n 1972 | \t      set_errno (EINVAL);\n 1973 | \t      return NULL;\n 1974 | \t    }\n 1975 | \t  break;\n 1976 | \tcase mask_s:\n 1977 | \tcase other_s:\n 1978 | \t  if (*bufp++ != ':')\n 1979 | \t    {\n 1980 | \t      set_errno (EINVAL);\n 1981 | \t      return NULL;\n 1982 | \t    }\n 1983 | \t  lacl[pos].a_type |= (acl_type == mask_s) ? CLASS_OBJ : OTHER_OBJ;\n 1984 | \t  break;\n 1985 | \t}\n 1986 |       /* In posix long mode, the next char after the permissions may be a tab\n 1987 | \t followed by effective permissions we can ignore here. */\n 1988 |       if ((lacl[pos].a_perm = permfromstr (bufp, *delim == '\\n')) == 01000)\n 1989 | \t{\n 1990 | \t  set_errno (EINVAL);\n 1991 | \t  return NULL;\n 1992 | \t}\n 1993 |       ++pos;\n 1994 |     }","lines":83,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/sec/acl.cc#L1912-L1994"}]},
{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"very_easy","description":"In `av::setup`'s shebang parser, after skipping leading whitespace with `strspn`, `len = strcspn (ptr, \"\\r\\n\")` can be `0` while the byte before `ptr` is whitespace. The unguarded trailing-whitespace trim `while (ptr[len - 1] == ' ' || ptr[len - 1] == '\\t') len--;` then underflows the `size_t len` to `SIZE_MAX`. Pointer arithmetic `ptr[SIZE_MAX-1]` wraps back to `ptr-2` (`'!'`), so the loop stops with `len` a huge value. Execution reaches `alloca (len + 1)` (which wraps to `alloca (0)`) followed by `memcpy (namebuf, ptr, len)` copying `~SIZE_MAX` bytes, crashing the process. This is reachable by exec'ing any file whose contents start with `#!` followed only by spaces/tabs and a newline (e.g. `\"#!  \\n\"`).","fix":"Guard the loop against `len == 0`:\n```\n// before\nsize_t len = strcspn (ptr, \"\\r\\n\");\nwhile (ptr[len - 1] == ' ' || ptr[len - 1] == '\\t')\n  len--;\n// after\nsize_t len = strcspn (ptr, \"\\r\\n\");\nwhile (len > 0 && (ptr[len - 1] == ' ' || ptr[len - 1] == '\\t'))\n  len--;\n```","locations":[{"ref":"winsup/cygwin/spawn.cc:1250-1258","code":" 1250 | \t    ptr += strspn (ptr, \" \\t\");\n 1251 | \t    size_t len = strcspn (ptr, \"\\r\\n\");\n 1252 | \t    while (ptr[len - 1] == ' ' || ptr[len - 1] == '\\t')\n 1253 | \t      len--;\n 1254 | \t    if (len)\n 1255 | \t      {\n 1256 | \t\tchar *namebuf = (char *) alloca (len + 1);\n 1257 | \t\tmemcpy (namebuf, ptr, len);\n 1258 | \t\tnamebuf[len] = '\\0';","lines":9,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/spawn.cc#L1250-L1258"}]},
{"id":"OVF_8","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"very_easy","description":"In `__assert_func`, when there is no console (CreateFile `CONOUT$` fails), the message buffer is sized with `alloca ((100 + strlen (failedexpr)) * sizeof (WCHAR))`, but the subsequent `__small_swprintf` formats `L\"Failed assertion\\n\\t%s\\nat line %d of file %s%s%s\"` which also writes `file` and `func` (via narrow `%s`). Neither `strlen (file)` nor `strlen (func)` is accounted for in the allocation. `__small_swprintf` is unbounded, so a long `__FILE__` path and/or `__func__` name overflows the stack `alloca` buffer, corrupting the stack on an assertion-failure path in a windowed (no-console) process.","fix":"Include the file and func lengths in the allocation:\n\nBefore:\n```\n      PWCHAR buf = (PWCHAR) alloca ((100 + strlen (failedexpr))\n\t\t\t\t    * sizeof (WCHAR));\n```\nAfter:\n```\n      PWCHAR buf = (PWCHAR) alloca ((100 + strlen (failedexpr)\n\t\t\t\t     + strlen (file)\n\t\t\t\t     + (func ? strlen (func) : 0))\n\t\t\t\t    * sizeof (WCHAR));\n```","locations":[{"ref":"winsup/cygwin/assert.cc:36-42","code":"   36 |       PWCHAR buf = (PWCHAR) alloca ((100 + strlen (failedexpr))\n   37 | \t\t\t\t    * sizeof (WCHAR));\n   38 |       __small_swprintf (buf,\n   39 | \t\t\tL\"Failed assertion\\n\\t%s\\nat line %d of file %s%s%s\",\n   40 | \t\t\tfailedexpr, line, file,\n   41 | \t\t\tfunc ? \"\\nin function \" : \"\", func ? func : \"\");\n   42 |       MessageBoxW (NULL, buf, NULL, MB_OK | MB_ICONERROR | MB_TASKMODAL);","lines":7,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/assert.cc#L36-L42"}]},
{"id":"OVF_9","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"In `cons_master_thread()` writeback-fix logic, after re-reading all currently available console input records into `input_tmp` (loop that sets `n`), the code does `for (DWORD ofs = n - total_read; ofs > 0; ofs--)`. `n` and `total_read` are unsigned `DWORD`. The earlier guard `if (n < min (total_read, inrec_size)) break;` validates the *peeked* count, not this freshly re-read `n`. Because concurrent readers can consume input without holding `input_mutex` (explicitly acknowledged by the nearby ConEmu comment), the re-read `n` can be smaller than `total_read`, making `n - total_read` wrap to a huge value; `inrec_eq (input_rec, input_tmp + ofs, total_read)` then reads far out of bounds of `input_tmp`.","fix":"Guard the subtraction, e.g. only enter the fix loop when `n >= total_read` (`if (n >= total_read) for (DWORD ofs = n - total_read; ...)`), and otherwise fall back to the giving-up path that rewrites `input_tmp`.","locations":[{"ref":"winsup/cygwin/fhandler/console.cc:629-642","code":"  629 | \t      bool fixed = false;\n  630 | \t      for (DWORD ofs = n - total_read; ofs > 0; ofs--)\n  631 | \t\t{\n  632 | \t\t  if (inrec_eq (input_rec, input_tmp + ofs, total_read))\n  633 | \t\t    {\n  634 | \t\t      memcpy (input_rec + total_read, input_tmp,\n  635 | \t\t\t      m::bytes (ofs));\n  636 | \t\t      memcpy (input_rec + total_read + ofs,\n  637 | \t\t\t      input_tmp + total_read + ofs,\n  638 | \t\t\t      m::bytes (n - ofs - total_read));\n  639 | \t\t      fixed = true;\n  640 | \t\t      break;\n  641 | \t\t    }\n  642 | \t\t}","lines":14,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/fhandler/console.cc#L629-L642"}]},
{"id":"OVF_10","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"very_easy","description":"In `setproctitle`, `len` is set from `snprintf(buf, sizeof buf, \"%s: \", getprogname())`. Per C99, `snprintf` returns the number of characters that *would* have been written, which can be `>= sizeof buf` (260, `MAX_PATH`). `getprogname()` returns `__progname`, the basename of `argv[0]`, which on Cygwin/MSYS2 can be arbitrarily long. When the program name is long enough that `len >= sizeof buf`, the subsequent `vsnprintf(buf + len, sizeof buf - len, fmt, ap)` writes past the end of the stack buffer `buf`: `buf + len` points beyond the array and `sizeof buf - len` underflows to a huge `size_t`, so `vsnprintf` is told it has a near-unbounded destination. This is a stack buffer overflow driven by an externally controlled program name.","fix":"Clamp `len` to the buffer size after the `snprintf`. Before:\n```c\n\t  else /* Print program name heading for grep. */\n\t\tlen = snprintf (buf, sizeof buf, \"%s: \", getprogname ());\n```\nAfter:\n```c\n\t  else /* Print program name heading for grep. */\n\t\t{\n\t\t  len = snprintf (buf, sizeof buf, \"%s: \", getprogname ());\n\t\t  if (len < 0 || (size_t) len >= sizeof buf)\n\t\t    len = sizeof buf - 1;\n\t\t}\n```","locations":[{"ref":"winsup/cygwin/libc/bsdlib.cc:283-285","code":"  283 | \tlen = snprintf (buf, sizeof buf, \"%s: \", getprogname ());\n  284 |       va_start (ap, fmt);\n  285 |       vsnprintf (buf + len, sizeof buf - len, fmt, ap);","lines":3,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/libc/bsdlib.cc#L283-L285"}]},
{"id":"OVF_11","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"`token()` copies a `.netrc` token into the fixed static buffer `static char tokval[100]` with no bounds check: both the quoted-string loop and the unquoted loop do `*cp++ = c;` until a delimiter/EOF is reached. A `.netrc` containing any token (machine name, login, password, account) longer than 99 characters overflows `tokval`, corrupting adjacent static storage. `ruserpass` is reached from `cygwin_rexec` with a `.netrc` whose contents may be attacker-influenced.","fix":"Bound both copy loops to the buffer size, e.g. keep a `char *end = tokval + sizeof(tokval) - 1;` and only store when `cp < end`, discarding (or erroring on) the overflow, before writing `*cp = 0;`.","locations":[{"ref":"winsup/cygwin/libc/rexec.cc:126-142","code":"  126 | \tcp = tokval;\n  127 | \tif (c == '\"') {\n  128 | \t\twhile ((c = getc(cfile)) != EOF && c != '\"') {\n  129 | \t\t\tif (c == '\\\\')\n  130 | \t\t\t\tc = getc(cfile);\n  131 | \t\t\t*cp++ = c;\n  132 | \t\t}\n  133 | \t} else {\n  134 | \t\t*cp++ = c;\n  135 | \t\twhile ((c = getc(cfile)) != EOF\n  136 | \t\t    && c != '\\n' && c != '\\t' && c != ' ' && c != ',') {\n  137 | \t\t\tif (c == '\\\\')\n  138 | \t\t\t\tc = getc(cfile);\n  139 | \t\t\t*cp++ = c;\n  140 | \t\t}\n  141 | \t}\n  142 | \t*cp = 0;","lines":17,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/libc/rexec.cc#L126-L142"}]},
{"id":"OVF_12","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`ruserpass` copies a `macdef` name into the fixed 9-byte field `macros[macnum].mac_name` (`char mac_name[9]`). It writes the first character with `*tmp++ = c`, then loops `for (i=0; i < 8 && ... ; ++i) *tmp++ = c;`, which can write up to 8 more characters, advancing `tmp` to `mac_name + 9` (one past the array). The subsequent `*tmp = '\\0'` then writes to `mac_name[9]`, a one-byte out-of-bounds write that corrupts the adjacent `mac_start` pointer in the same `struct macel`. Triggered by a `.netrc` whose macdef name is 9 or more non-whitespace characters.","fix":"Reserve room for the terminator by limiting the loop to `i < 7` (so at most 8 chars total including the first) instead of `i < 8`, e.g. change `for (i=0; i < 8 && (c=getc(cfile)) != EOF && !isspace(c); ++i)` to `for (i=0; i < 7 && ...; ++i)`, or size `mac_name` to hold `1 + 8 + 1` bytes.","locations":[{"ref":"winsup/cygwin/libc/rexec.cc:253-263","code":"  253 | \t\t\ttmp = macros[macnum].mac_name;\n  254 | \t\t\t*tmp++ = c;\n  255 | \t\t\tfor (i=0; i < 8 && (c=getc(cfile)) != EOF &&\n  256 | \t\t\t    !isspace(c); ++i) {\n  257 | \t\t\t\t*tmp++ = c;\n  258 | \t\t\t}\n  259 | \t\t\tif (c == EOF) {\n  260 | \t\t\t\tprintf(\"Macro definition missing null line terminator.\\n\");\n  261 | \t\t\t\tgoto bad;\n  262 | \t\t\t}\n  263 | \t\t\t*tmp = '\\0';","lines":11,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/libc/rexec.cc#L253-L263"}]},
{"id":"OVF_13","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"very_easy","description":"In `posix_to_win32_path`, the POSIX path segment `[from, to)` is copied into a fixed `tmp_pathbuf` buffer `one_path` of size `NT_MAX_PATH` (32768 bytes) with no length check: `strncpy (one_path, from, to-from); one_path[to-from] = '\\0';`. When the segment length `to - from` is `>= NT_MAX_PATH`, `strncpy` writes past the end of `one_path` and the terminator store `one_path[to-from]` writes even further, corrupting adjacent per-thread TLS path buffers. The input reaches here from `arg_heuristic`/`convert` on arbitrary argv/env strings; the guard is entirely absent so any caller feeding a rooted path segment at or beyond `NT_MAX_PATH` overflows.","fix":"Clamp the copy length to the buffer size. Before:\n```\nstrncpy(one_path, from, to-from);\none_path[to-from] = '\\0';\n```\nAfter:\n```\nsize_t len = to - from;\nif (len >= NT_MAX_PATH)\n  len = NT_MAX_PATH - 1;\nstrncpy(one_path, from, len);\none_path[len] = '\\0';\n```","locations":[{"ref":"winsup/cygwin/msys2_path_conv.cc:688-708","code":"  688 | void posix_to_win32_path(const char* from, const char* to, char** dst, const char* dstend) {\n  689 |     if ( from != to ) {\n  690 |         tmp_pathbuf tp;\n  691 |         char *one_path = tp.c_get();\n  692 |         strncpy(one_path, from, to-from);\n  693 |         one_path[to-from] = '\\0';\n  694 | \n  695 |         path_conv conv (one_path, PC_NOFULL);\n  696 |         if (conv.error)\n  697 |         {\n  698 |           set_errno(conv.error);\n  699 |           copy_to_dst(one_path, NULL, dst, dstend);\n  700 |         } else {\n  701 |           char* win32_path = tp.c_get();\n  702 |           stpcpy (win32_path, conv.get_win32 ());\n  703 |           for (; (*win32_path != '\\0') && (*dst != dstend); ++win32_path, ++(*dst)) {\n  704 |              **dst = (*win32_path == '\\\\') ? '/' : *win32_path;\n  705 |           }\n  706 |         }\n  707 |     }\n  708 | }","lines":21,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/msys2_path_conv.cc#L688-L708"}]},
{"id":"OVF_14","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"very_easy","description":"`inet_ntop4` uses `if (strlen(tmp) > size)` as its bounds check, but then does `strcpy(dst, tmp)` which writes `strlen(tmp) + 1` bytes (including the NUL). When the caller supplies a buffer whose `size` equals `strlen(tmp)` exactly, the check passes and `strcpy` writes one byte past the end of `dst`. The sibling function `inet_ntop6` (line 2749) correctly compares the full NUL-inclusive length `(tp - tmp) > size`, confirming this is an off-by-one. Reachable via the public `inet_ntop`/`cygwin_inet_ntop` with a caller-controlled `dst`/`size`.","fix":"Reject when the NUL doesn't fit as well:\n```\n-  if (strlen(tmp) > size)\n+  if (strlen(tmp) >= size)\n```","locations":[{"ref":"winsup/cygwin/net.cc:2639","code":" 2639 |   if (strlen(tmp) > size)","lines":1,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/net.cc#L2639"}]},
{"id":"OVF_15","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"In `conv_path_list`, the `env_cvt` quote-stripping code assumes a path-list element that begins with `\"` also ends with `\"`. For an element consisting of a single `\"` (or `\"` with no closing quote), `len` is 1, and after `++srcpath; *--s = '\\0'; len -= 2;` the `size_t len` underflows to `SIZE_MAX-1`. The subsequent `while (len && s[-1] == '\\\\') { *--s = '\\0'; --len; }` then walks backwards from the start of `srcbuf`, performing out-of-bounds reads of `s[-1]` and, whenever a `\\\\` byte is encountered in the memory preceding the buffer, out-of-bounds writes of `'\\0'`. `srcbuf` is a `tmp_pathbuf` (`tp.w_get ()`), so this corrupts adjacent memory. Reachable via `env_PATH_to_posix`/`cygwin_conv_path_list` (ENV_CVT) with a malformed quoted element in an environment path list.","fix":"Only strip quotes when the element is properly quoted at both ends and has length >= 2, e.g. `if (*srcpath == '\"' && len >= 2 && s[-1] == '\"') { ++srcpath; *--s = '\\0'; len -= 2; }`, and guard the trailing-backslash loop so it cannot decrement `s`/`len` below `srcpath`.","locations":[{"ref":"winsup/cygwin/path.cc:1684-1697","code":" 1684 |       if (env_cvt && len)\n 1685 | \t{\n 1686 | \t  if (*srcpath == '\"')\n 1687 | \t    {\n 1688 | \t      ++srcpath;\n 1689 | \t      *--s = '\\0';\n 1690 | \t      len -= 2;\n 1691 | \t    }\n 1692 | \t  while (len && s[-1] == '\\\\')\n 1693 | \t    {\n 1694 | \t      *--s = '\\0';\n 1695 | \t      --len;\n 1696 | \t    }\n 1697 | \t}","lines":14,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/path.cc#L1684-L1697"}]},
{"id":"OVF_16","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"In `getwinenveq`, the stack VLA is declared `WCHAR name0[namelen - 1];`. `namelen` (from the `NL` macro) counts the variable name including the trailing `=`, e.g. for `\"PATH=\"` `namelen == 5`, so the array has 4 elements. The code then converts the name without the `=` (`namelen - 1 == 4` chars, `\"PATH\"`) and writes a terminating NUL at `name0[sys_mbstowcs (...)]` i.e. `name0[4]` - one element past the end of the 4-element VLA. Also note `sizeof name0` (bytes) is passed where `sys_mbstowcs` expects a wchar count for `dlen`, but the `nms` argument (`namelen - 1`) bounds the conversion so only the NUL write overflows. In practice this is benign because AMD64 rounds the tiny VLA up to 16-byte alignment and `valbuf` follows, but it is a genuine out-of-bounds stack write on a hot path (runs for PATH/SYSTEMROOT/etc. on every process spawn).","fix":"Size the array to hold the name plus its NUL:\n```\n// before\nWCHAR name0[namelen - 1];\n// after\nWCHAR name0[namelen];\n```","locations":[{"ref":"winsup/cygwin/environ.cc:974-977","code":"  974 |   WCHAR name0[namelen - 1];\n  975 |   WCHAR valbuf[32768]; /* Max size of an env.var including trailing '\\0'. */\n  976 | \n  977 |   name0[sys_mbstowcs (name0, sizeof name0, name, namelen - 1)] = L'\\0';","lines":4,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/environ.cc#L974-L977"}]},
{"id":"OVF_17","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"In `grab_admin_pkg` and `recv_peer_info`, packet length fields (`name_len`, `cmsg_len`) come straight off the wire from the peer, but the packet is read into a fixed-size buffer (`alloca (MAX_PATH)` in `grab_admin_pkg`; `alloca (sizeof *packet + sizeof *un + CMSG_SPACE (sizeof (struct ucred)))` in `recv_peer_info`). The code then does `alloca (packet->cmsg_len)` and `memcpy (cmsg, AF_UNIX_PKT_CMSG (packet), packet->cmsg_len)` (and `peer_sun_path (AF_UNIX_PKT_NAME (packet), packet->name_len)`) using those unvalidated lengths. A peer supplying a large `cmsg_len` (up to 65535) or `name_len` causes `memcpy` to read past the end of the actually-read buffer (OOB stack read), and `alloca` of an attacker-controlled size risks stack exhaustion. This is defense-relevant since the peer is a separate process. The file is behind the undefined `__WITH_AF_UNIX`, so it is not compiled in this build.","fix":"Validate the header length fields against the number of bytes actually read (`io.Information` / peek `ret_len`) before using them: reject or clamp packets where `sizeof (af_unix_pkt_hdr_t) + name_len + cmsg_len` exceeds the received byte count, and bound `cmsg_len` to `CMSG_SPACE (sizeof (struct ucred))` before `alloca`/`memcpy`.","locations":[{"ref":"winsup/cygwin/fhandler/socket_unix.cc:727-737","code":"  727 | \t  if (packet->name_len > 0)\n  728 | \t    peer_sun_path (AF_UNIX_PKT_NAME (packet), packet->name_len);\n  729 | \t  if (packet->cmsg_len > 0)\n  730 | \t    {\n  731 | \t      struct cmsghdr *cmsg = (struct cmsghdr *)\n  732 | \t\t\t\t     alloca (packet->cmsg_len);\n  733 | \t      memcpy (cmsg, AF_UNIX_PKT_CMSG (packet), packet->cmsg_len);\n  734 | \t      if (cmsg->cmsg_level == SOL_SOCKET\n  735 | \t\t  && cmsg->cmsg_type == SCM_CREDENTIALS)\n  736 | \t\tpeer_cred ((struct ucred *) CMSG_DATA(cmsg));\n  737 | \t    }","lines":11,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/fhandler/socket_unix.cc#L727-L737"},{"ref":"winsup/cygwin/fhandler/socket_unix.cc:794-803","code":"  794 |       if (packet->name_len > 0)\n  795 | \tpeer_sun_path (AF_UNIX_PKT_NAME (packet), packet->name_len);\n  796 |       if (packet->cmsg_len > 0)\n  797 | \t{\n  798 | \t  struct cmsghdr *cmsg = (struct cmsghdr *) alloca (packet->cmsg_len);\n  799 | \t  memcpy (cmsg, AF_UNIX_PKT_CMSG (packet), packet->cmsg_len);\n  800 | \t  if (cmsg->cmsg_level == SOL_SOCKET\n  801 | \t      && cmsg->cmsg_type == SCM_CREDENTIALS)\n  802 | \t    peer_cred ((struct ucred *) CMSG_DATA(cmsg));\n  803 | \t}","lines":10,"link":"https://github.com/msys2/msys2-runtime/blob/da84778cbc92590c1996c02c68c5a3d3c49e00af/winsup/cygwin/fhandler/socket_unix.cc#L794-L803"}]},
