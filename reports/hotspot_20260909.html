<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"critical","difficulty":"medium","description":"In decompressIfNeeded(), the extractArchive lambda sets m_decompressed only when extractFromArchive() succeeds. If the archive opens successfully but contains no recognizable file (extractFromArchive returns nullptr), extracted is null, m_decompressed is NOT updated, and the unconditional dereference m_decompressed->fileName() on the next line crashes. On the first call m_decompressed is always null, so any archive that opens but yields no matching file triggers a null-pointer dereference.","fix":"Guard the dereference: if (!extracted) { return path; } m_decompressed = std::move(extracted); return m_decompressed->fileName();","locations":[{"ref":"src/parsers/perf/perfparser.cpp:2194-2198","code":" 2194 |         auto extracted = extractFromArchive(archive);\n 2195 |         if (extracted) {\n 2196 |             m_decompressed = std::move(extracted);\n 2197 |         }\n 2198 |         return m_decompressed->fileName();","lines":5,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/parsers/perf/perfparser.cpp#L2194-L2198"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"In check_kallsyms.py, if the address is larger than every symbol in the file, `prevLine` and `prevStart` remain None. The final print statements then crash with `AttributeError: 'NoneType' object has no attribute 'rstrip'` and `TypeError` on the arithmetic. Likewise if no symbol has a start address strictly greater than addr, `nextLine`/`nextStart` are None and the second print crashes.","fix":"Guard both print statements: check `if prevLine is not None` and `if nextLine is not None` before printing, and handle the not-found case explicitly.","locations":[{"ref":"scripts/check_kallsyms.py:37-38","code":"   37 | print(\"best match sym:\", prevLine.rstrip(), \"diff is:\", hex(addr - prevStart))\n   38 | print(\"next sym is:\", nextLine.rstrip(), \"diff is:\", hex(nextStart - addr))","lines":2,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/scripts/check_kallsyms.py#L37-L38"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"DisassemblyModel::findIndexWithOffset unconditionally accesses m_data.disassemblyLines[0] without checking whether the vector is empty. If this method is called on an empty model (e.g. after clear()), it will index out of bounds and cause undefined behaviour / crash.","fix":"Add a guard at the top of the function: `if (m_data.disassemblyLines.isEmpty()) return {};`","locations":[{"ref":"src/models/disassemblymodel.cpp:30-42","code":"   30 | QModelIndex DisassemblyModel::findIndexWithOffset(int offset)\n   31 | {\n   32 |     const auto address = m_data.disassemblyLines[0].addr + offset;\n   33 | \n   34 |     const auto& found =\n   35 |         std::find_if(m_data.disassemblyLines.begin(), m_data.disassemblyLines.end(),\n   36 |                      [address](const DisassemblyOutput::DisassemblyLine& line) { return line.addr == address; });\n   37 | \n   38 |     if (found != m_data.disassemblyLines.end()) {\n   39 |         return createIndex(std::distance(m_data.disassemblyLines.begin(), found), DisassemblyColumn);\n   40 |     }\n   41 |     return {};\n   42 | }","lines":13,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/models/disassemblymodel.cpp#L30-L42"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"ProcessModel::clear passes the wrong last-row index to beginRemoveRows. It passes m_data.count() (the size) instead of m_data.count() - 1 (the last valid row index). Qt's MVC contract requires the second argument to be the last row index, so this is off by one and can cause assertion failures or assertion-less corruption in attached views.","fix":"Change `beginRemoveRows(QModelIndex(), 0, m_data.count())` to `beginRemoveRows(QModelIndex(), 0, m_data.count() - 1)`. Guard against an already-empty model with `if (m_data.isEmpty()) return;`.","locations":[{"ref":"src/models/processmodel.cpp:81","code":"   81 |     beginRemoveRows(QModelIndex(), 0, m_data.count());","lines":1,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/models/processmodel.cpp#L81"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"In PerfOutputWidgetKonsole::clear(), if m_konsolePart is non-null the code calls m_konsoleFile->deleteLater() but m_konsoleFile was allocated with m_konsolePart as parent (addPartToLayout line 149). When m_konsolePart->deleteLater() fires, Qt deletes its children including m_konsoleFile, which by then has already been scheduled for deletion. More critically, if addPartToLayout() returned early (open failed, line 150-152), m_konsoleFile is non-null but backed by a file that was never opened, yet clear() dereferences it unconditionally inside the 'if (m_konsolePart)' block. If addPartToLayout() failed, subsequent addOutput() calls write to an un-opened file producing silent data loss.","fix":"Remove the m_konsoleFile->deleteLater() call since it is owned by the parent. In addPartToLayout(), if open() fails, delete m_konsoleFile and reset it to nullptr to prevent later use.","locations":[{"ref":"src/perfoutputwidgetkonsole.cpp:123-126","code":"  123 |     if (m_konsolePart) {\n  124 |         m_konsoleFile->deleteLater();\n  125 |         m_konsolePart->deleteLater();\n  126 |     }","lines":4,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/perfoutputwidgetkonsole.cpp#L123-L126"},{"ref":"src/perfoutputwidgetkonsole.cpp:148-152","code":"  148 |     Q_ASSERT(!m_konsoleFile);\n  149 |     m_konsoleFile = new QTemporaryFile(m_konsolePart);\n  150 |     if (!m_konsoleFile->open()) {\n  151 |         qWarning() << \"failed to open temporary file\" << m_konsoleFile->fileName() << m_konsoleFile->errorString();\n  152 |         return;","lines":5,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/perfoutputwidgetkonsole.cpp#L148-L152"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"PerfOutputWidgetKonsole::addPartToLayout() calls m_konsolePart->widget()->focusWidget()->installEventFilter(this) without checking whether focusWidget() returns null. If the konsole part's widget has no focused child widget, focusWidget() returns null and the dereference crashes. Similarly, the terminalInterface pointer cast on line 155 is not checked for null before being dereferenced on line 156; if a freshly created part no longer implements TerminalInterface the cast returns null.","fix":"Check terminalInterface != nullptr before use. Check focusWidget() != nullptr before calling installEventFilter.","locations":[{"ref":"src/perfoutputwidgetkonsole.cpp:155-158","code":"  155 |     const auto terminalInterface = qobject_cast<TerminalInterface*>(m_konsolePart);\n  156 |     terminalInterface->startProgram(tailExe(), {tailExe(), QStringLiteral(\"-f\"), m_konsoleFile->fileName()});\n  157 | \n  158 |     m_konsolePart->widget()->focusWidget()->installEventFilter(this);","lines":4,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/perfoutputwidgetkonsole.cpp#L155-L158"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"In check_mmaps.py the regex `r\"\\[(0x[a-z0-9]+)((0x[a-z0-9]+)\\)\"` is malformed. The intended capture groups appear to be the start address and the length (two hex numbers), but the pattern has no separator between them - it reads `(0x...)(0x...)` without any whitespace or comma, so it will never match a real perf mmap line. Additionally, group 2 starts where group 3 starts, meaning `m[2]` (used as `length`) actually captures the same text as `m[3]`. The result is that `length` is always misread and `end` is wrong.","fix":"Correct the regex to actually match the perf output format, e.g. `r\"\\[(0x[a-z0-9]+)\\(0x([a-z0-9]+)\\)\"` with a literal `(` between the two addresses and fix the group indices accordingly.","locations":[{"ref":"scripts/check_mmaps.py:12","code":"   12 | prog = re.compile(r\"\\[(0x[a-z0-9]+)((0x[a-z0-9]+)\\)\")","lines":1,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/scripts/check_mmaps.py#L12"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In FlameGraph::eventFilter, after a left-click selects an item, `m_selectedItem` is set to `m_selectionHistory.size()` (the old size, before push_back) and then the item is appended. This is correct. However the access on line 917 `m_selectionHistory.at(m_selectedItem)` uses the current `m_selectedItem` which at that moment still holds the index from the previous selection. If `m_selectedItem` was previously set to a stale index (e.g. -1 during initialisation or after setData clears the history and sets it to 0 while rootItem is null), accessing `m_selectionHistory.at(m_selectedItem)` with index -1 is undefined behavior / an out-of-bounds QVector access that asserts/crashes in debug builds.","fix":"Initialise `m_selectedItem` to 0 everywhere consistently and add a bounds check before `m_selectionHistory.at(m_selectedItem)`. In setData, when rootItem is null the history is cleared to `[nullptr]` and `m_selectedItem` is 0, which is fine, but other callers should not leave it at -1.","locations":[{"ref":"src/flamegraph.cpp:917","code":"  917 |             if (item && item != m_selectionHistory.at(m_selectedItem)) {","lines":1,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/flamegraph.cpp#L917"},{"ref":"src/flamegraph.h:84","code":"   84 |     int m_selectedItem = -1;","lines":1,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/flamegraph.h#L84"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"filterOutBySymbol action reads data from the wrong action. The triggered lambda for filterOutBySymbol calls m_actions.filterInBySymbol->data() instead of m_actions.filterOutBySymbol->data(). This means the symbol that was set on the 'filter out' action is never used; instead the 'filter in' symbol is read, causing filterOutBySymbol to silently filter-in the wrong symbol.","fix":"Change `m_actions.filterInBySymbol->data()` to `m_actions.filterOutBySymbol->data()` in the filterOutBySymbol lambda.","locations":[{"ref":"src/models/filterandzoomstack.cpp:49-52","code":"   49 |     connect(m_actions.filterOutBySymbol, &QAction::triggered, this, [this]() {\n   50 |         const auto data = m_actions.filterInBySymbol->data();\n   51 |         Q_ASSERT(data.canConvert<Data::Symbol>());\n   52 |         filterOutBySymbol(data.value<Data::Symbol>());","lines":4,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/models/filterandzoomstack.cpp#L49-L52"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"filterOutByBinary action reads data from the wrong action. The triggered lambda for filterOutByBinary calls m_actions.filterInByBinary->data() instead of m_actions.filterOutByBinary->data(). Same copy-paste bug as the symbol case: the user's intended 'filter out by binary' action silently reads the 'filter in' binary instead.","fix":"Change `m_actions.filterInByBinary->data()` to `m_actions.filterOutByBinary->data()` in the filterOutByBinary lambda.","locations":[{"ref":"src/models/filterandzoomstack.cpp:65-68","code":"   65 |     connect(m_actions.filterOutByBinary, &QAction::triggered, this, [this]() {\n   66 |         const auto data = m_actions.filterInByBinary->data();\n   67 |         Q_ASSERT(data.canConvert<QString>());\n   68 |         filterOutByBinary(data.value<QString>());","lines":4,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/models/filterandzoomstack.cpp#L65-L68"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"In TreeModel::index(), the guard condition uses 'row > rowCount(parent)' instead of 'row >= rowCount(parent)'. This allows creating an index with row == rowCount(parent), which is one past the last valid row. Any code that then calls itemFromIndex() on such an index will read out of bounds from the children vector (index.row() >= parent->children.size() check on line 181 catches some but not all paths, especially in simplify mode where the loop iterates without bounds check).","fix":"Change 'row > rowCount(parent)' to 'row >= rowCount(parent)'.","locations":[{"ref":"src/models/treemodel.h:88","code":"   88 |         if (row < 0 || column < 0 || column >= numColumns() || row > rowCount(parent)) {","lines":1,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/models/treemodel.h#L88"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"In fillEventSourceComboBox, setItemData uses the cost-type loop index `i` as the combo box row index, but items are only added when costs.totalCost(i) is nonzero. If any earlier cost type has zero total cost it is skipped, so the combo box has fewer items than `i`, and setItemData writes the tooltip to the wrong row or a nonexistent row.","fix":"Track the combo box item count separately: call `combo->setItemData(combo->count() - 1, ...)` after each `addItem` call instead of using `i`.","locations":[{"ref":"src/resultsutil.cpp:207-213","code":"  207 |     for (int i = 0, c = costs.numTypes(); i < c; ++i) {\n  208 |         if (!costs.totalCost(i)) {\n  209 |             continue;\n  210 |         }\n  211 |         const auto& typeName = costs.typeName(i);\n  212 |         combo->addItem(typeName, QVariant::fromValue(i));\n  213 |         combo->setItemData(i, tooltipTemplate.arg(typeName), Qt::ToolTipRole);","lines":7,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/resultsutil.cpp#L207-L213"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"keyPressEvent compares event->modifiers() (a QFlags<Qt::KeyboardModifier> bitmask) against Qt::Key_Control (a Qt::Key enum value, 0x01000021). Qt::ControlModifier is 0x04000000, so these two constants have entirely different values. The intent is to allow Ctrl+Enter to close the dialog, but as written the condition is almost always true (Qt::Key_Control == 0x01000021 will virtually never equal the modifiers bitmask), causing the early return to fire even when Ctrl is held. The CTRL+Enter shortcut documented in the comment therefore never works.","fix":"Replace `event->modifiers() != Qt::Key_Control` with `event->modifiers() != Qt::ControlModifier`.","locations":[{"ref":"src/settingsdialog.cpp:256-258","code":"  256 |     if (event->modifiers() != Qt::Key_Control && (event->key() == Qt::Key_Enter || event->key() == Qt::Key_Return)) {\n  257 |         return;\n  258 |     }","lines":3,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/settingsdialog.cpp#L256-L258"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `resultsToDot` (callgraphgenerator.cpp line 62), `results.entries[symbol]` uses `QHash::operator[]` which default-constructs and inserts a new entry if the key is absent. This silently creates a spurious empty entry in the `results` hash for every symbol that has no entry - for example nodes added via recursion where the symbol does not appear as a key in CallerCalleeResults. The caller passes `results` by const reference, but `QHash::operator[]` is non-const, which would be a compile error - however the const-ness may be dropped because the local `entry` is a copy. In any case the default-constructed entry means callers/callees will be empty maps, which is harmless, but the intent is clearly to do a read-only lookup.","fix":"Use `results.entries.value(symbol)` (const, returns default-constructed value without insertion) instead of `results.entries[symbol]`.","locations":[{"ref":"src/callgraphgenerator.cpp:62","code":"   62 |     const auto entry = results.entries[symbol];","lines":1,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/callgraphgenerator.cpp#L62"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `resultsToDot`, the threshold comparison on line 80 divides by `totalCost` which is `results.selfCosts.totalCost(0)`. If the recording contains no samples for cost type 0 (totalCost == 0), this is a division by zero, producing NaN. The NaN comparison `NaN < thresholdPercent` is always false, so all nodes pass the filter and the graph is generated with incorrect (infinity/NaN) relative costs driving the threshold logic.","fix":"Guard against `totalCost == 0` before dividing: if totalCost is zero, either skip all nodes or treat their relative cost as 0.","locations":[{"ref":"src/callgraphgenerator.cpp:75-80","code":"   75 |     const auto totalCost = results.selfCosts.totalCost(0);\n   76 |     auto map = direction == Direction::Callee ? entry.callees : entry.callers;\n   77 | \n   78 |     for (auto it = map.begin(); it != map.end(); it++) {\n   79 |         const auto cost = it.value()[0];\n   80 |         if (static_cast<double>(cost) / totalCost < thresholdPercent) {","lines":6,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/callgraphgenerator.cpp#L75-L80"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"CallgraphWidget::eventFilter (callgraphwidget.cpp line 119) checks `m_graphview->widget()->geometry().contains(e->pos())`. However `e->pos()` is the mouse position relative to the widget that received the event, while `geometry()` returns the geometry of `m_graphview->widget()` in its parent's coordinate space. Since the event filter is installed on `qApp` and intercepts events from any widget, `e->pos()` is in the coordinate space of the event's target widget, not of `m_graphview->widget()`'s parent. This geometry check is therefore unreliable - it may falsely accept or reject clicks depending on which widget was under the mouse.","fix":"Use `m_graphview->widget()->rect().contains(m_graphview->widget()->mapFromGlobal(e->globalPos()))` to correctly convert to widget-local coordinates.","locations":[{"ref":"src/callgraphwidget.cpp:119","code":"  119 |         if (m_graphview->widget()->geometry().contains(e->pos())) {","lines":1,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/callgraphwidget.cpp#L119"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `costRatioBrush` (flamegraph.cpp line 429), `totalCost` is a `quint32` parameter with a default of 1. When called from `brush()` with the default `totalCost = 1` (which happens when `costRatioBrush` is invoked indirectly via `updateFlameGraphColorScheme` where no cost/totalCost are passed since the default arguments are used), the ratio will always be computed against 1, yielding meaningless colors. Additionally, if somehow `totalCost` is 0, division by zero occurs. The brush() function has default `cost=0, totalCost=1`, so when called from `updateFlameGraphColorScheme` on line 646 (which passes `item->cost()` and `totalCost` correctly), this is fine - but the parameters are `quint32` and the cast to float may lose precision for very large costs.","fix":"Add a guard for `totalCost == 0` in `costRatioBrush`. Consider making the default arguments explicit rather than relying on implicit defaults.","locations":[{"ref":"src/flamegraph.cpp:429-436","code":"  429 | QBrush costRatioBrush(quint32 cost, quint32 totalCost)\n  430 | {\n  431 |     // interpolate between red and yellow\n  432 |     // where yellow = 0% and red = 100%\n  433 |     const float ratio = (1 - (static_cast<float>(cost) / totalCost));\n  434 |     const int hue = ratio * ratio * 60;\n  435 |     return QColor::fromHsv(hue, 230, 200, 125);\n  436 | }","lines":8,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/flamegraph.cpp#L429-L436"},{"ref":"src/flamegraph.cpp:438","code":"  438 | QBrush brush(const Data::Symbol& entry, const BrushConfig& brushConfig, quint32 cost = 0, quint32 totalCost = 1)","lines":1,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/flamegraph.cpp#L438"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In FlameGraph::setTooltipItem the cursor is always set to PointingHandCursor in the else branch (line 1105), even when `item` is non-null and nothing special was selected. The intent is: if item is null and there is a selected item, show ArrowCursor (we restored the tooltip to the selected item); otherwise PointingHandCursor. But if `item` is non-null the else branch also runs and shows PointingHandCursor, which is correct. The real bug is the inverted condition: when `item` is null AND `m_selectedItem == -1` (or the history entry is null), `m_view->setCursor(Qt::PointingHandCursor)` is set even though nothing is being pointed at.","fix":"Add an else branch for the null-item / no-selection case that restores ArrowCursor, and only set PointingHandCursor when item is actually non-null.","locations":[{"ref":"src/flamegraph.cpp:1099-1106","code":" 1099 | void FlameGraph::setTooltipItem(const FrameGraphicsItem* item)\n 1100 | {\n 1101 |     if (!item && m_selectedItem != -1 && m_selectionHistory.at(m_selectedItem)) {\n 1102 |         item = m_selectionHistory.at(m_selectedItem);\n 1103 |         m_view->setCursor(Qt::ArrowCursor);\n 1104 |     } else {\n 1105 |         m_view->setCursor(Qt::PointingHandCursor);\n 1106 |     }","lines":8,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/flamegraph.cpp#L1099-L1106"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In FrequencyPage::updateGraphs (frequencypage.cpp line 149), `sumCost / numEntries` is computed even when `numEntries` is 0. This happens when `m_results.cores` is empty, or all cores have no cost data matching `selectedCost`. The result is NaN, and `m_upperWithoutOutliers = NaN * 1.1` remains NaN. Passing NaN to `setRangeUpper` produces undefined plot behavior.","fix":"Guard: `if (numEntries > 0) { m_upperWithoutOutliers = (sumCost / numEntries) * 1.1; }`","locations":[{"ref":"src/frequencypage.cpp:149-150","code":"  149 |         const auto avgCost = sumCost / numEntries;\n  150 |         m_upperWithoutOutliers = avgCost * 1.1;","lines":2,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/frequencypage.cpp#L149-L150"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"CostDelegate::paint divides by totalCost without checking for zero. When totalCost is 0 (which is valid when no events are recorded for a cost type), the division on line 34 produces a NaN or infinity for fraction, and the subsequent rect width and color calculations produce garbage or trigger UB.","fix":"After fetching totalCost, return early (delegating to QStyledItemDelegate::paint) if totalCost == 0.","locations":[{"ref":"src/models/costdelegate.cpp:33-34","code":"   33 |     const auto totalCost = index.data(m_totalCostRole).toULongLong();\n   34 |     const auto fraction = std::abs(static_cast<float>(cost) / totalCost);","lines":2,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/models/costdelegate.cpp#L33-L34"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Location::operator< has a self-comparison bug in the RHS tuple. The third element of the RHS tuple is `fileLine` (referring to `this->fileLine`) rather than `rhs.fileLine`. This means the third field of the RHS is always equal to the LHS field, effectively making the comparison ignore the fileLine field entirely, causing incorrect ordering and potential logic errors in sorted containers.","fix":"Change `std::tie(rhs.address, rhs.relAddr, fileLine)` to `std::tie(rhs.address, rhs.relAddr, rhs.fileLine)` in the RHS tuple.","locations":[{"ref":"src/models/data.h:160-163","code":"  160 |     bool operator<(const Location& rhs) const\n  161 |     {\n  162 |         return std::tie(address, relAddr, fileLine) < std::tie(rhs.address, rhs.relAddr, fileLine);\n  163 |     }","lines":4,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/models/data.h#L160-L163"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"DisassemblyModel::headerData has an off-by-one: the guard `section >= m_numTypes + COLUMN_COUNT` correctly rejects out-of-range sections, but the inner check `section - COLUMN_COUNT <= m_numTypes` allows section == COLUMN_COUNT + m_numTypes (one past the end) to reach typeName(), which would access m_results.selfCosts with index == m_numTypes - an out-of-bounds index. The correct check should be `< m_numTypes`.","fix":"Change `section - COLUMN_COUNT <= m_numTypes` to `section - COLUMN_COUNT < m_numTypes`.","locations":[{"ref":"src/models/disassemblymodel.cpp:81-82","code":"   81 |     if (section - COLUMN_COUNT <= m_numTypes)\n   82 |         return m_results.selfCosts.typeName(section - COLUMN_COUNT);","lines":2,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/models/disassemblymodel.cpp#L81-L82"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In disassemblyoutput.cpp, the source-file / line-number parsing branch uses colonIndex (set by the outer scan at the top of the loop) to split the filename from the line number. For dot-relative paths like `././test.cpp` there may be no colon at all, so colonIndex == -1. `asmLine.left(-1)` returns the full string for currentSourceFileName, and `asmLine.length() - (-1) - 1 == asmLine.length()` picks the entire string as the line number. The `toInt` call will then fail (ok=false) and sourceCodeLine is left at its previous stale value, silently associating the wrong line number with subsequent disassembly lines.","fix":"Before using colonIndex in this branch, check `if (colonIndex == -1)` and skip the line-number extraction in that case (keep currentSourceFileName = asmLine, leave sourceCodeLine unchanged).","locations":[{"ref":"src/models/disassemblyoutput.cpp:200-221","code":"  200 |         } else if (asmLine.startsWith(QLatin1Char('/')) || asmLine.startsWith(QLatin1Char('.'))) {\n  201 |             // extract source code line info\n  202 |             // these look like this:\n  203 |             // - /usr/include/c++/11.2.0/bits/stl_tree.h:2083 (discriminator 1)\n  204 |             // - /usr/include/c++/11.2.0/bits/stl_tree.h:3452\n  205 |             // - ././test.cpp\n  206 | \n  207 |             currentSourceFileName = asmLine.left(colonIndex);\n  208 |             if (sourceFileName.isEmpty()) {\n  209 |                 sourceFileName = currentSourceFileName;\n  210 |             }\n  211 | \n  212 |             auto lineNumber = QStringView(asmLine).right(asmLine.length() - colonIndex - 1);\n  213 |             const auto spaceIndex = lineNumber.indexOf(QLatin1Char(' '));\n  214 |             if (spaceIndex != -1) {\n  215 |                 lineNumber = lineNumber.left(spaceIndex);\n  216 |             }\n  217 |             bool ok = false;\n  218 |             const auto number = lineNumber.toInt(&ok);\n  219 |             if (ok) {\n  220 |                 sourceCodeLine = number;\n  221 |             }","lines":22,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/models/disassemblyoutput.cpp#L200-L221"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"FrequencyModel::rowCount uses parent.column() / 2 to index into m_frequencyData when parent.isValid() is false (the flat-table case). At that point parent is a default-constructed QModelIndex whose column() returns 0, so this always returns m_frequencyData[0].values.size(), ignoring all other frequency series. All series are expected to share the same row count in practice, but this is still a semantic error and will silently break if series differ in length.","fix":"For a flat (non-tree) table model the row count should be independent of columns. Return the size of the first series or an appropriate maximum, and document the assumption that all series are the same length. Alternatively, redesign so the row count reflects the union across all series.","locations":[{"ref":"src/models/frequencymodel.cpp:23","code":"   23 |     return m_frequencyData[parent.column() / 2].values.size();","lines":1,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/models/frequencymodel.cpp#L23"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"AnsiHighlightingImplementation::formatLine assumes that the character immediately after the ESC is always '[' (checked via Q_ASSERT at line 194) and that the two-character color code follows at escapeIt+2. This is an assertion, not a hard check, so in release builds malformed ANSI sequences (missing '[', single-char color codes, sequences longer than 2 digits, etc.) will silently produce iterator arithmetic on invalid positions, potentially going past the end of the string.","fix":"Replace the Q_ASSERTs with proper bounds checks and early-exit/skip logic so malformed ANSI input does not cause out-of-bounds iterator access in release builds.","locations":[{"ref":"src/models/highlightedtext.cpp:194-219","code":"  194 |             Q_ASSERT(*(escapeIt + 1) == QLatin1Char('['));\n  195 | \n  196 |             offset += std::distance(lastToken, escapeIt);\n  197 | \n  198 |             // escapeIt + 2 points to the first color code character\n  199 |             auto color = QStringView {escapeIt + 2, colorCodeLength};\n  200 |             bool ok = false;\n  201 |             const uint8_t colorCode = color.toUInt(&ok);\n  202 |             if (ok) {\n  203 |                 // only support the 8 default colors\n  204 |                 Q_ASSERT(colorCode >= 30 && colorCode <= 37);\n  205 | \n  206 |                 format.start = offset;\n  207 |                 const auto colorRole = static_cast<KColorScheme::ForegroundRole>(colorCode - 30);\n  208 |                 format.format.setForeground(m_colorScheme.foreground(colorRole));\n  209 | \n  210 |                 std::advance(escapeIt, setColorSequenceLength);\n  211 |             } else {\n  212 |                 // make sure we have a reset sequence\n  213 |                 Q_ASSERT(color == QStringLiteral(\"0m\"));\n  214 |                 format.length = offset - format.start;\n  215 |                 if (format.length) {\n  216 |                     formats.push_back(format);\n  217 |                 }\n  218 | \n  219 |                 std::advance(escapeIt, resetColorSequenceLength);","lines":26,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/models/highlightedtext.cpp#L194-L219"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"TimeLineData is constructed with xMultiplicator = w / time.delta() and yMultiplicator = h / maxCost. Both are floating-point divisions that produce infinity (or NaN) when the divisor is zero. time.delta() == 0 when a single event is present (start == end), and maxCost == 0 when no costs have been recorded. mapXToTime() then divides by xMultiplicator (infinity -> 0 result), and mapTimeToX() multiplies by infinity, causing all coordinates to map to INT_MAX or zero, breaking tooltip positioning and selection rectangles.","fix":"Guard against zero divisors: set xMultiplicator and yMultiplicator to 0 when the divisor is 0, and add early-return guards in mapTimeToX/mapXToTime/mapCostToY when the multiplicator is 0.","locations":[{"ref":"src/models/timelinedelegate.cpp:40-41","code":"   40 |     , xMultiplicator(static_cast<double>(w) / time.delta())\n   41 |     , yMultiplicator(static_cast<double>(h) / maxCost)","lines":2,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/models/timelinedelegate.cpp#L40-L41"},{"ref":"src/models/timelinedelegate.cpp:50-53","code":"   50 | quint64 TimeLineData::mapXToTime(int x) const\n   51 | {\n   52 |     return static_cast<quint64>(static_cast<double>(x) / xMultiplicator) + time.start;\n   53 | }","lines":4,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/models/timelinedelegate.cpp#L50-L53"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In addSample(), line 1179 uses 'attributes.value(event.type)' to look up the AttributesDefinition for a tracepoint check. However event.type is a costId (returned by attributeIdsToCostIds.value(sampleCost.attributeId, -1)), not an attributeId. The attributes QVector is indexed by attributeId. When multiple perf attributes share the same name (and hence the same costId), costId and attributeId diverge, causing the wrong AttributesDefinition to be fetched and the tracepoint type check to produce incorrect results.","fix":"Use sampleCost.attributeId to look up the attribute: 'const auto attribute = attributes.value(sampleCost.attributeId);'","locations":[{"ref":"src/parsers/perf/perfparser.cpp:1173-1179","code":" 1173 |             event.type = attributeIdsToCostIds.value(sampleCost.attributeId, -1);\n 1174 |             event.stackId = internStack(sample.frames);\n 1175 |             event.cpuId = sample.cpu;\n 1176 |             thread->events.push_back(event);\n 1177 |             cpu.events.push_back(event);\n 1178 | \n 1179 |             const auto attribute = attributes.value(event.type);","lines":7,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/parsers/perf/perfparser.cpp#L1173-L1179"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In RecordHost::setClientApplication, the block that auto-sets the working directory from the application path (lines 295-297) runs unconditionally after the validity checks. When the application is invalid (not found, not a file, not executable), this block still calls setCurrentWorkingDirectory with a path derived from the invalid QFileInfo. If that cwd validation succeeds, it emits errorOccurred({}) which clears the error the caller just set, hiding the real error from the user.","fix":"Move the `if (m_cwd.isEmpty())` block inside the `else` branch (successful validation only), so it only runs when the application is actually valid.","locations":[{"ref":"src/recordhost.cpp:273-298","code":"  273 | void RecordHost::setClientApplication(const QString& clientApplication)\n  274 | {\n  275 |     Q_ASSERT(QThread::currentThread() == thread());\n  276 | \n  277 |     if (isLocal()) {\n  278 |         QFileInfo application(KShell::tildeExpand(clientApplication));\n  279 |         if (!application.exists()) {\n  280 |             application.setFile(QStandardPaths::findExecutable(clientApplication));\n  281 |         }\n  282 | \n  283 |         if (!application.exists()) {\n  284 |             emit errorOccurred(tr(\"Application file cannot be found: %1\").arg(clientApplication));\n  285 |         } else if (!application.isFile()) {\n  286 |             emit errorOccurred(tr(\"Application file is not valid: %1\").arg(clientApplication));\n  287 |         } else if (!application.isExecutable()) {\n  288 |             emit errorOccurred(tr(\"Application file is not executable: %1\").arg(clientApplication));\n  289 |         } else {\n  290 |             emit errorOccurred({});\n  291 |             m_clientApplication = clientApplication;\n  292 |             emit clientApplicationChanged(m_clientApplication);\n  293 |         }\n  294 | \n  295 |         if (m_cwd.isEmpty()) {\n  296 |             setCurrentWorkingDirectory(application.dir().absolutePath());\n  297 |         }\n  298 |         return;","lines":26,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/recordhost.cpp#L273-L298"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In BranchDelegate::paint, ymid is calculated as `(top + option.rect.height()) / 2`. This is wrong: option.rect.height() is the height of the cell, not the bottom coordinate. The correct midpoint is `(top + bottom) / 2` or equivalently `top + option.rect.height() / 2`. For a cell at top=10 with height=20, the code gives ymid=15 rather than the correct 20, so all horizontal branch lines and arrowheads are drawn in the wrong vertical position.","fix":"Change to `const auto ymid = top + option.rect.height() / 2;` (or equivalently `(top + bottom) / 2`).","locations":[{"ref":"src/resultsdisassemblypage.cpp:98","code":"   98 |         const auto ymid = (top + option.rect.height()) / 2;","lines":1,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/resultsdisassemblypage.cpp#L98"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In ResultsUtil::setupContextMenu the 'View Caller/Callee' action is enabled only when symbol.canDisassemble() is true. canDisassemble() requires a non-empty path, nonzero relAddr and size, and no inline. Caller/callee navigation only needs a symbol name, so this incorrectly disables it for many valid symbols that lack binary path or address info.","fix":"Enable 'View Caller/Callee' when `!symbol.symbol.isEmpty()` rather than `symbol.canDisassemble()`.","locations":[{"ref":"src/resultsutil.cpp:125-131","code":"  125 |             if (actions.testFlag(CallbackAction::ViewCallerCallee)) {\n  126 |                 auto* viewCallerCallee =\n  127 |                     contextMenu.addAction(QCoreApplication::translate(\"Util\", \"View Caller/Callee\"));\n  128 |                 QObject::connect(viewCallerCallee, &QAction::triggered, &contextMenu,\n  129 |                                  [symbol, callback]() { callback(CallbackAction::ViewCallerCallee, symbol); });\n  130 |                 viewCallerCallee->setEnabled(symbol.canDisassemble());\n  131 |             }","lines":7,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/resultsutil.cpp#L125-L131"}]},
{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The pathsChanged signal connection in addFlamegraphPage (line 277) refills the flamegraph path widgets from Settings whenever the signal fires, including when the dialog itself triggers the change via the accepted handler (line 284-285). This creates a feedback loop: accepting the dialog calls setPaths which emits pathsChanged which calls clear()+insertStringList on the widgets that were just read - harmless now only because the signal fires synchronously and the accepted handler has already run, but it is still a redundant re-entrant update that masks the fact that the dialog is not the single source of truth for the widget state.","fix":"Remove the pathsChanged signal connection from addFlamegraphPage (or guard it with a flag to skip when the dialog itself is the source). The initial population (lines 274-275) already correctly seeds the widgets; the signal connection is only needed if an external source can change paths while the dialog is open.","locations":[{"ref":"src/settingsdialog.cpp:277-286","code":"  277 |     connect(Settings::instance(), &Settings::pathsChanged, this, [this] {\n  278 |         flamegraphPage->userPaths->clear();\n  279 |         flamegraphPage->systemPaths->clear();\n  280 |         flamegraphPage->userPaths->insertStringList(Settings::instance()->userPaths());\n  281 |         flamegraphPage->systemPaths->insertStringList(Settings::instance()->systemPaths());\n  282 |     });\n  283 | \n  284 |     connect(buttonBox(), &QDialogButtonBox::accepted, this, [this] {\n  285 |         Settings::instance()->setPaths(flamegraphPage->userPaths->items(), flamegraphPage->systemPaths->items());\n  286 |     });","lines":10,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/settingsdialog.cpp#L277-L286"}]},
{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The same feedback-loop problem exists in addDebuginfodPage: connecting debuginfodUrlsChanged to re-populate the urls widget (line 300-303) means that when the user accepts the dialog, setDebuginfodUrls emits the signal, which calls clear()+insertStringList on the widget that was just read. As with the paths case this is currently benign but architecturally wrong - the dialog should own its widget state while open and only push to Settings on accept.","fix":"Remove the debuginfodUrlsChanged connection from addDebuginfodPage for the same reasons as above.","locations":[{"ref":"src/settingsdialog.cpp:300-306","code":"  300 |     connect(Settings::instance(), &Settings::debuginfodUrlsChanged, this, [this] {\n  301 |         debuginfodPage->urls->clear();\n  302 |         debuginfodPage->urls->insertStringList(Settings::instance()->debuginfodUrls());\n  303 |     });\n  304 | \n  305 |     connect(buttonBox(), &QDialogButtonBox::accepted, this,\n  306 |             [this] { Settings::instance()->setDebuginfodUrls(debuginfodPage->urls->items()); });","lines":7,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/settingsdialog.cpp#L300-L306"}]},
{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"addSourcePathPage does not populate the sourcePaths list widget with the current value from Settings on dialog open. The other pages (flamegraph, debuginfod) call insertStringList immediately after setupUi. Here the widget is only updated when the sourceCodePathsChanged signal fires, which means the list is empty when the dialog is first shown unless something else triggers that signal. The accepted handler then joins an empty list and writes an empty string back, silently erasing the stored source paths.","fix":"After line 350 (setupMultiPath call), add: `disassemblyPage->sourcePaths->setItems(settings->sourceCodePaths().split(colon, Qt::SkipEmptyParts));`","locations":[{"ref":"src/settingsdialog.cpp:335-368","code":"  335 | void SettingsDialog::addSourcePathPage()\n  336 | {\n  337 |     auto page = new QWidget(this);\n  338 |     auto item = addPage(page, tr(\"Disassembly\"));\n  339 |     item->setHeader(tr(\"Disassembly Settings\"));\n  340 |     item->setIcon(QIcon::fromTheme(QStringLiteral(\"preferences-system-windows-behavior\")));\n  341 | \n  342 |     disassemblyPage->setupUi(page);\n  343 | \n  344 |     auto settings = Settings::instance();\n  345 | \n  346 |     const auto colon = QLatin1Char(':');\n  347 |     connect(settings, &Settings::sourceCodePathsChanged, this,\n  348 |             [this, colon](const QString& paths) { disassemblyPage->sourcePaths->setItems(paths.split(colon)); });\n  349 | \n  350 |     setupMultiPath(disassemblyPage->sourcePaths, disassemblyPage->label, buttonBox()->button(QDialogButtonBox::Ok));\n  351 | \n  352 |     disassemblyPage->lineEditObjdump->setText(settings->objdump());\n  353 |     disassemblyPage->showBranches->setChecked(settings->showBranches());\n  354 |     disassemblyPage->showHexdump->setChecked(settings->showHexdump());\n  355 |     disassemblyPage->tabWidth->setValue(settings->tabWidth());\n  356 | \n  357 |     connect(buttonBox(), &QDialogButtonBox::accepted, this, [this, colon, settings] {\n  358 |         settings->setSourceCodePaths(disassemblyPage->sourcePaths->items().join(colon));\n  359 |         settings->setShowBranches(disassemblyPage->showBranches->isChecked());\n  360 |         settings->setShowHexdump(disassemblyPage->showHexdump->isChecked());\n  361 |         settings->setTabWidth(disassemblyPage->tabWidth->value());\n  362 |     });\n  363 | \n  364 |     for (auto field : {disassemblyPage->lineEditObjdump}) {\n  365 |         connect(field, &KUrlRequester::textEdited, m_configs, &MultiConfigWidget::updateCurrentConfig);\n  366 |         connect(field, &KUrlRequester::urlSelected, m_configs, &MultiConfigWidget::updateCurrentConfig);\n  367 |     }\n  368 | }","lines":34,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/settingsdialog.cpp#L335-L368"}]},
{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `split-clang-tidy-fixits.py`, the deduplication logic on line 52 initializes `seenFixits[diagnostic]` as `set(stringified)` (a set of individual characters of the string) instead of `{stringified}` (a set containing the full string as one element). As a result, the first fixit for each diagnostic is always added to `groupedFixits` correctly, but when checking subsequent fixits on line 53, `stringified in seenGroup` checks whether the entire YAML string is a member of a character-set, which is always False for strings longer than 1 character. This means duplicate detection never fires for any diagnostic after the first entry.","fix":"Change `set(stringified)` to `{stringified}` to create a one-element set containing the full string.","locations":[{"ref":"scripts/split-clang-tidy-fixits.py:52","code":"   52 |             seenFixits[diagnostic] = set(stringified)","lines":1,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/scripts/split-clang-tidy-fixits.py#L52"}]},
{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `hoverStack` (flamegraph.cpp line 583), the condition `(stack.size() - 1) == depth` uses unsigned arithmetic. `stack.size()` returns `qsizetype` (signed in Qt6) or `int`, so if the stack is empty `stack.size() - 1` is -1 and `depth` starts at 0, so the condition is false. But then `stack.size() <= depth` (line 586) with size=0 and depth=0 is `0 <= 0` which is true, so the function correctly returns false. The first check on line 583 also uses `stack.constFirst()` which would crash on an empty stack if that branch were reached - but since the guard works it is only a latent issue. In Qt5 where size() returns int, `stack.size() - 1 == depth` with size=0 gives `-1 == 0` = false, also harmless.","fix":"Add an explicit early return for empty stack to clarify intent: `if (stack.isEmpty()) return false;`","locations":[{"ref":"src/flamegraph.cpp:583","code":"  583 |     if ((stack.size() - 1) == depth && item->symbol() == stack.constFirst()) {","lines":1,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/flamegraph.cpp#L583"}]},
{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In extractLinkedFunction, the offset parsing unconditionally skips two characters with `function.name.mid(plusIndex + 3)` on the assumption that the offset is prefixed with '0x'. If the offset does not have a '0x' prefix (e.g. a decimal offset or just no prefix), mid(plusIndex + 3) silently drops the first two significant digits of the offset, producing a wrong numeric value without any diagnostic.","fix":"Check that the two characters after '+' are indeed '0' and 'x' before skipping them; otherwise parse from plusIndex + 1.","locations":[{"ref":"src/models/disassemblyoutput.cpp:70","code":"   70 |                 const auto& offsetStr = function.name.mid(plusIndex + 3);","lines":1,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/models/disassemblyoutput.cpp#L70"}]},
{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In disassemblyoutput.cpp the readyRead lambda captures disassemblyOutput by reference and appends standard-error output using a round-trip through std::string: `QString::fromStdString(asmProcess.readAllStandardError().toStdString())`. The correct Qt idiom is `QString::fromLocal8Bit(...)`. The std::string conversion can corrupt non-ASCII bytes (e.g. non-ASCII filenames in error messages) depending on the locale.","fix":"Replace `QString::fromStdString(asmProcess.readAllStandardError().toStdString())` with `QString::fromLocal8Bit(asmProcess.readAllStandardError())`.","locations":[{"ref":"src/models/disassemblyoutput.cpp:336","code":"  336 |         disassemblyOutput.errorMessage += QString::fromStdString(asmProcess.readAllStandardError().toStdString());","lines":1,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/models/disassemblyoutput.cpp#L336"}]},
{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"EventModel::setData computes m_totalOnCpuTime by subtracting offCpuTime from thread->time.delta() without checking for underflow. If offCpuTime > time.delta() (which can happen with imprecise kernel timestamps), the subtraction wraps around to a huge quint64 value, corrupting the on-CPU-time percentage display in tooltips.","fix":"Cap the subtraction: `const auto onCpu = thread.offCpuTime <= thread.time.delta() ? thread.time.delta() - thread.offCpuTime : 0; m_totalOnCpuTime += onCpu;`","locations":[{"ref":"src/models/eventmodel.cpp:299","code":"  299 |             m_totalOnCpuTime += thread.time.delta() - thread.offCpuTime;","lines":1,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/models/eventmodel.cpp#L299"}]},
{"id":"LOGIC_33","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In processlist_unix.cpp the /proc-based processList() reads /proc/<pid>/stat and splits by single space. The process name field (field 1) is enclosed in parentheses and can itself contain spaces, causing data.at(2) to pick up part of the process name rather than the actual state character when the name contains spaces. This corrupts proc.state for any process whose name includes a space.","fix":"Find the last ')' in the stat line to correctly delimit the process name field before splitting the remaining fields, instead of blindly splitting on space.","locations":[{"ref":"src/models/processlist_unix.cpp:116-124","code":"  116 |         const QStringList data = QString::fromLocal8Bit(file.readAll()).split(QLatin1Char(' '));\n  117 |         ProcData proc;\n  118 |         proc.ppid = procId;\n  119 |         proc.name = data.at(1);\n  120 |         if (proc.name.startsWith(QLatin1Char('(')) && proc.name.endsWith(QLatin1Char(')'))) {\n  121 |             proc.name.truncate(proc.name.size() - 1);\n  122 |             proc.name.remove(0, 1);\n  123 |         }\n  124 |         proc.state = data.at(2);","lines":9,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/models/processlist_unix.cpp#L116-L124"}]},
{"id":"LOGIC_34","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"SourceCodeModel::data checks `index.row() > m_numLines` but the valid rows are [0, m_numLines] inclusive (rowCount returns m_numLines + 1). The check should be `index.row() >= m_numLines + 1`, i.e. strictly greater-than should be greater-than-or-equal-to rowCount(). In practice hasIndex() is checked first and should gate this, but the explicit guard is still logically inconsistent with rowCount().","fix":"Change `index.row() > m_numLines` to `index.row() >= rowCount()` (or equivalently `>= m_numLines + 1`) for clarity and correctness.","locations":[{"ref":"src/models/sourcecodemodel.cpp:158","code":"  158 |     if (index.row() > m_numLines || index.row() < 0)","lines":1,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/models/sourcecodemodel.cpp#L158"}]},
{"id":"LOGIC_35","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In PerfOutputWidgetKonsole::eventFilter(), the Key_Delete handler removes the last byte from m_inputBuffer when the buffer may be empty, yielding a remove(-1, 1) call. QByteArray::remove() with a negative position is a no-op in Qt6, but the handler is also semantically wrong: in a terminal, Delete removes the character after the cursor while Backspace removes before it. The intended 'undo last character typed' behavior should use Key_Backspace, not Key_Delete.","fix":"Change Qt::Key_Delete to Qt::Key_Backspace and add a guard: if (!m_inputBuffer.isEmpty()) m_inputBuffer.chop(1);","locations":[{"ref":"src/perfoutputwidgetkonsole.cpp:87-88","code":"   87 |             } else if (key == Qt::Key_Delete) {\n   88 |                 m_inputBuffer.remove(m_inputBuffer.size() - 1, 1);","lines":2,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/perfoutputwidgetkonsole.cpp#L87-L88"}]},
{"id":"LOGIC_36","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"perfrecord.cpp runPerf() disconnects signals from m_perfRecordProcess before killing it (lines 68-71). This prevents the finished-signal lambda from running, so m_perfControlFifo.close() is never called for the old process. The subsequent m_perfControlFifo.requestStop() / m_perfControlFifo.close() on lines 69 and 72 do close it, but only after kill(), leaving a small window if kill() fails.","fix":"Call m_perfControlFifo.close() before disconnecting signals, or call it unconditionally after the disconnect block instead of relying on it being closed by a disconnected signal.","locations":[{"ref":"src/perfrecord.cpp:67-73","code":"   67 |     if (m_perfRecordProcess) {\n   68 |         disconnect(m_perfRecordProcess, nullptr, this, nullptr);\n   69 |         m_perfControlFifo.requestStop();\n   70 |         m_perfRecordProcess->kill();\n   71 |         delete m_perfRecordProcess;\n   72 |         m_perfControlFifo.close();\n   73 |     }","lines":7,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/perfrecord.cpp#L67-L73"}]},
{"id":"LOGIC_37","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In resultsdisassemblypage.cpp, after the source-code context menu adds an 'Open in Editor' action (line 316-318), it calls menu->addAction(openEditorAction) again on line 319. This adds the same QAction to the menu twice, so it appears twice in the right-click menu.","fix":"Remove the redundant `menu->addAction(openEditorAction)` on line 319; the action was already added by `menu->addAction(tr(\"Open in Editor\"))` on line 316.","locations":[{"ref":"src/resultsdisassemblypage.cpp:313-320","code":"  313 |     createContextMenu(ui->sourceCodeView, m_sourceCodeModel, [this](QMenu* menu, const QModelIndex& index) {\n  314 |         const auto fileLine = index.data(SourceCodeModel::FileLineRole).value<Data::FileLine>();\n  315 |         if (fileLine.isValid()) {\n  316 |             auto* openEditorAction = menu->addAction(tr(\"Open in Editor\"));\n  317 |             QObject::connect(openEditorAction, &QAction::triggered, this,\n  318 |                              [this, fileLine]() { emit navigateToCode(fileLine.file, fileLine.line, -1); });\n  319 |             menu->addAction(openEditorAction);\n  320 |         }","lines":8,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/resultsdisassemblypage.cpp#L313-L320"}]},
{"id":"LOGIC_38","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In ResultsDisassemblyPage, when the user clicks the stack-back button and m_stackIndex would go below zero, it wraps to m_symbolStack.size()-1 (line 366). Similarly the forward button wraps to 0. This implements ring-buffer navigation semantics for the disassembly history stack, which is unexpected - back/forward navigation should stop at the ends rather than wrapping around.","fix":"Remove the wrap-around: let the buttons just clamp at 0 and m_symbolStack.size()-1, matching the enable/disable logic already applied to the buttons.","locations":[{"ref":"src/resultsdisassemblypage.cpp:363-376","code":"  363 |     connect(ui->stackBackButton, &QPushButton::pressed, this, [this] {\n  364 |         m_stackIndex--;\n  365 |         if (m_stackIndex < 0)\n  366 |             m_stackIndex = m_symbolStack.size() - 1;\n  367 | \n  368 |         emit stackChanged();\n  369 |     });\n  370 | \n  371 |     connect(ui->stackNextButton, &QPushButton::pressed, this, [this] {\n  372 |         m_stackIndex++;\n  373 |         if (m_stackIndex >= m_symbolStack.size())\n  374 |             m_stackIndex = 0;\n  375 | \n  376 |         emit stackChanged();","lines":14,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/resultsdisassemblypage.cpp#L363-L376"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"easy","description":"In the context menu construction for 'Filter In On Selection', the condition checks 'filter.time.end != timeSlice.start || filter.time.end != timeSlice.end'. Both comparisons use filter.time.end rather than the start/end pair. The intent is to avoid showing the filter action when the filter is already identical to the selected time slice. The first comparison should use filter.time.start. As written, the condition is always true when timeSlice.start != timeSlice.end (i.e. any real selection), so the de-duplication check is broken.","fix":"Change to: (!isFiltered || filter.time.start != timeSlice.start || filter.time.end != timeSlice.end)","locations":[{"ref":"src/models/timelinedelegate.cpp:485-486","code":"  485 |         if (isTimeSpanSelected\n  486 |             && (!isFiltered || filter.time.end != timeSlice.start || filter.time.end != timeSlice.end)) {","lines":2,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/models/timelinedelegate.cpp#L485-L486"}]},
{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"easy","description":"In the context menu construction for 'Filter By Time Of Thread', the condition checks 'filter.time.end != threadStartTime && filter.time.end != threadEndTime'. Both comparisons use filter.time.end instead of comparing the full range. The first comparison should use filter.time.start. The intent is to suppress the action when the filter already covers exactly this thread's time range. As written the check is incorrect for any thread whose start time != end time.","fix":"Change to: (isFiltered && filter.time.start != threadStartTime && filter.time.end != threadEndTime)","locations":[{"ref":"src/models/timelinedelegate.cpp:492-493","code":"  492 |             if ((!isFiltered && !isMainThread)\n  493 |                 || (isFiltered && filter.time.end != threadStartTime && filter.time.end != threadEndTime)) {","lines":2,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/models/timelinedelegate.cpp#L492-L493"}]},
{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"easy","description":"Settings::loadFromFile calls setShowBranches twice instead of calling setShowHexdump for the hexdump setting. Line 252 reads 'showHexdump' from config but passes it to setShowBranches, overwriting the just-loaded showBranches value and leaving m_showHexdump at its default (false) forever regardless of what was saved.","fix":"Change line 252 from `setShowBranches(...)` to `setShowHexdump(sharedConfig->group(QStringLiteral(\"Disassembly\")).readEntry(\"showHexdump\", false));`.","locations":[{"ref":"src/settings.cpp:247-255","code":"  247 |     setShowBranches(sharedConfig->group(QStringLiteral(\"Disassembly\")).readEntry(\"showBranches\", true));\n  248 |     connect(this, &Settings::showBranchesChanged, [sharedConfig](bool showBranches) {\n  249 |         sharedConfig->group(QStringLiteral(\"Disassembly\")).writeEntry(\"showBranches\", showBranches);\n  250 |     });\n  251 | \n  252 |     setShowBranches(sharedConfig->group(QStringLiteral(\"Disassembly\")).readEntry(\"showHexdump\", false));\n  253 |     connect(this, &Settings::showHexdumpChanged, [sharedConfig](bool showHexdump) {\n  254 |         sharedConfig->group(QStringLiteral(\"Disassembly\")).writeEntry(\"showHexdump\", showHexdump);\n  255 |     });","lines":9,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/settings.cpp#L247-L255"}]},
{"id":"CPY_4","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"In the compression combo box setup, levels 2-21 are all added with data value 0 instead of the actual level number. This means selecting any of those levels produces `-z` (default compression) instead of `--compression-level=N`.","fix":"Change the loop body from `addItem(tr(\"Level %1\").arg(i), 0)` to `addItem(tr(\"Level %1\").arg(i), i)` so each entry stores its actual compression level.","locations":[{"ref":"src/recordpage.cpp:172-173","code":"  172 |     for (int i = 2; i <= 21; ++i)\n  173 |         ui->compressionComboBox->addItem(tr(\"Level %1\").arg(i), 0);","lines":2,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/recordpage.cpp#L172-L173"}]},
{"id":"CPY_5","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"Data::Symbol constructor applies std::move twice in sequence to the `binary` parameter: `std::move(std::move(binary))`. The inner move is redundant (the outer move already casts to rvalue). This is harmless at runtime but signals a copy-paste or editing mistake.","fix":"Remove the outer std::move, leaving just `std::move(binary)`.","locations":[{"ref":"src/models/data.h:35","code":"   35 |         , binary(std::move(std::move(binary)))","lines":1,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/models/data.h#L35"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"In CallgraphWidget constructor (callgraphwidget.cpp line 59-61), if `m_graphFile->open()` fails only a warning is logged and execution continues. All subsequent `QTextStream stream(m_graphFile)` writes and `openUrl` calls will silently operate on a file that was never opened, producing empty/corrupted graph files and potentially confusing the kgraphviewer part.","fix":"If open() fails, the widget should enter a disabled/error state and avoid calling generateCallgraph, or propagate the error up to createCallgraphWidget so a null is returned.","locations":[{"ref":"src/callgraphwidget.cpp:59-61","code":"   59 |     if (!m_graphFile->open()) {\n   60 |         qWarning() << \"failed to open temporary file:\" << m_graphFile->fileName() << m_graphFile->errorString();\n   61 |     }","lines":3,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/callgraphwidget.cpp#L59-L61"}]},

{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In disassemblyoutput.cpp, canVisualizeJumps and canUseSyntaxHighlighting each independently invoke objdumpHelp (spawning and waiting for an objdump process) for the same processPath. Both calls happen unconditionally on every disassemble() invocation, meaning objdump is launched twice just to query --help output. On systems where disassembly is triggered repeatedly this doubles the process-spawn overhead.","fix":"Call objdumpHelp once, store the result, and pass it to both canVisualizeJumps and canUseSyntaxHighlighting, or cache the capability flags per objdump path.","locations":[{"ref":"src/models/disassemblyoutput.cpp:350-358","code":"  350 |     if (canVisualizeJumps(processPath))\n  351 |         arguments.append(QStringLiteral(\"--visualize-jumps\"));\n  352 |     else\n  353 |         qCInfo(disassemblyoutput) << \"objdump binary does not support `--visualize-jumps`:\" << processPath;\n  354 | \n  355 |     if (canUseSyntaxHighlighting(processPath)) {\n  356 |         arguments.append(QStringLiteral(\"--disassembler-color=color\"));\n  357 |     } else {\n  358 |         qCInfo(disassemblyoutput) << \"objdump binary does not support `--disassembler-color`:\" << processPath;","lines":9,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/models/disassemblyoutput.cpp#L350-L358"}]},

{"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"JobTracker in jobtracker.h stores a raw pointer `&m_currentJobId` captured in lambdas that are dispatched to ThreadWeaver worker threads. `m_isRunning` (a plain bool, not atomic) is also written from the main thread in `startJob` and read from a lambda that calls `setData` also on the main thread via `QMetaObject::invokeMethod`. While the final write to `m_isRunning = false` happens in the queued callback (main thread), the check `isJobRunning()` can race if called from another thread since `m_isRunning` is not atomic. Additionally, the captured raw pointer `currentJobId = &m_currentJobId` in the worker lambda accesses the atomic uint from a different thread, which is safe for atomics, but the JobTracker object could be destroyed before the worker completes if its owner is deleted.","fix":"Make `m_isRunning` atomic, or document that JobTracker must only be used from the main thread. Consider capturing a shared_ptr or weak_ptr to ensure the atomics remain valid across the worker lambda's lifetime.","locations":[{"ref":"src/jobtracker.h:32-56","code":"   32 |         auto jobCancelled = [context = m_context, jobId, currentJobId = &m_currentJobId]() {\n   33 |             return !context || jobId != (*currentJobId);\n   34 |         };\n   35 |         auto maybeSetData = [jobCancelled, setData = std::forward<SetData>(setData),\n   36 |                              isRunning = &m_isRunning](auto&& results) {\n   37 |             if (!jobCancelled()) {\n   38 |                 *isRunning = false;\n   39 |                 setData(std::forward<decltype(results)>(results));\n   40 |             }\n   41 |         };\n   42 | \n   43 |         m_isRunning = true;\n   44 |         stream() << make_job([context = m_context, job = std::forward<Job>(job), maybeSetData = std::move(maybeSetData),\n   45 |                               jobCancelled = std::move(jobCancelled)]() mutable {\n   46 |             auto results = job(jobCancelled);\n   47 |             if (jobCancelled())\n   48 |                 return;\n   49 | \n   50 |             QMetaObject::invokeMethod(\n   51 |                 context.data(),\n   52 |                 [results = std::move(results), maybeSetData = std::move(maybeSetData)]() mutable {\n   53 |                     maybeSetData(std::move(results));\n   54 |                 },\n   55 |                 Qt::QueuedConnection);\n   56 |         });","lines":25,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/jobtracker.h#L32-L56"}]},
{"id":"ARCH_2","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"The callgraphPage member is declared as std::unique_ptr<Ui::CallgraphSettingsPage> in the header (settingsdialog.h:59) without any #if KGraphViewerPart_FOUND guard, while in the .cpp constructor it is only initialized inside #if KGraphViewerPart_FOUND (settingsdialog.cpp:68-70). When KGraphViewerPart is not found, callgraphPage holds a null unique_ptr. Any future code path that dereferences callgraphPage without re-checking the compile guard will crash. The inconsistency between header and implementation makes the contract unclear.","fix":"Wrap the callgraphPage member in settingsdialog.h with #if KGraphViewerPart_FOUND / #endif to match the .cpp, making the conditional presence explicit and preventing accidental misuse.","locations":[{"ref":"src/settingsdialog.cpp:68-70","code":"   68 | #if KGraphViewerPart_FOUND\n   69 |     , callgraphPage(new Ui::CallgraphSettingsPage)\n   70 | #endif","lines":3,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/settingsdialog.cpp#L68-L70"},{"ref":"src/settingsdialog.h:59","code":"   59 |     std::unique_ptr<Ui::CallgraphSettingsPage> callgraphPage;","lines":1,"link":"https://github.com/KDAB/hotspot/blob/6188ec8db6efc2bcdea5f0a8753264a42c57f245/src/settingsdialog.h#L59"}]}
