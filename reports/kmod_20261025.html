{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `kmod_module_get_size()`, when `coresize` opens fine but `read_str_long()` fails, an error is logged but `size` keeps its initial value `-ENOENT`, so the caller gets a misleading 'no such entry' instead of the real read error.","fix":"Capture the return of `read_str_long()` and, if negative, set `size = err` before `goto done`.","locations":[{"ref":"libkmod/libkmod-module.c:1532-1538","code":" 1532 | \tcfd = openat(dfd, \"coresize\", O_RDONLY | O_CLOEXEC);\n 1533 | \tif (cfd >= 0) {\n 1534 | \t\tif (read_str_long(cfd, &size, 10) < 0)\n 1535 | \t\t\tERR(mod->ctx, \"failed to read coresize from %s\\n\", line);\n 1536 | \t\tclose(cfd);\n 1537 | \t\tgoto done;\n 1538 | \t}","lines":7,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/libkmod/libkmod-module.c#L1532-L1538"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"`sleep_until_msec()` checks `clock_nanosleep(...) < 0 && errno != EINTR`. `clock_nanosleep()` returns the error number directly (positive) and does not set `errno`. The `< 0` test is never true, so errors are never reported and the function always returns 0. The caller in `modprobe.c` therefore busy-loops or retries without sleeping on a real failure, for example `EINVAL`.","fix":"Before:\n```c\nif (clock_nanosleep(CLOCK_MONOTONIC, TIMER_ABSTIME, &ts, NULL) < 0 &&\n    errno != EINTR)\n\treturn -errno;\n```\nAfter:\n```c\nint r = clock_nanosleep(CLOCK_MONOTONIC, TIMER_ABSTIME, &ts, NULL);\nif (r != 0 && r != EINTR)\n\treturn -r;\n```","locations":[{"ref":"shared/util.c:524-533","code":"  524 | int sleep_until_msec(unsigned long long msec)\n  525 | {\n  526 | \tstruct timespec ts = msec_ts(msec);\n  527 | \n  528 | \tif (clock_nanosleep(CLOCK_MONOTONIC, TIMER_ABSTIME, &ts, NULL) < 0 &&\n  529 | \t    errno != EINTR)\n  530 | \t\treturn -errno;\n  531 | \n  532 | \treturn 0;\n  533 | }","lines":10,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/shared/util.c#L524-L533"},{"ref":"tools/modprobe.c:399-410","code":"  399 | \t\t\tuntil_msec = get_backoff_delta_msec(tend_msec, &interval_msec);\n  400 | \t\t\terr = sleep_until_msec(until_msec);\n  401 | \n  402 | \t\t\t/* Error out if now_msec() fails */\n  403 | \t\t\tif (tend_msec == wait_msec)\n  404 | \t\t\t\terr = -ENOTSUP;\n  405 | \n  406 | \t\t\tif (err < 0) {\n  407 | \t\t\t\tERR(\"Failed to sleep: %s\\n\", strerror(-err));\n  408 | \t\t\t\terr = -EAGAIN;\n  409 | \t\t\t\tbreak;\n  410 | \t\t\t}","lines":12,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/tools/modprobe.c#L399-L410"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`depmod_load_modules()` returns 0 from the middle of the loop when `array_append` fails for alias, softdep or weakdep values. The remaining modules never get their info or dependency symbols loaded, but depmod continues and writes incomplete `modules.dep` and `modules.alias` files while reporting success.","fix":"Return `-ENOMEM` (or the negative `array_append` result) instead of 0, so `depmod_load()` fails.","locations":[{"ref":"tools/depmod.c:1620-1648","code":" 1620 | load_info:\n 1621 | \t\tkmod_module_get_info(mod->kmod, &mod->info_list);\n 1622 | \t\tkmod_list_foreach(l, mod->info_list) {\n 1623 | \t\t\tconst char *key = kmod_module_info_get_key(l);\n 1624 | \n 1625 | \t\t\tif (streq(key, \"alias\")) {\n 1626 | \t\t\t\tconst char *value = kmod_module_info_get_value(l);\n 1627 | \n 1628 | \t\t\t\tif (array_append(&mod->alias_values, value) < 0)\n 1629 | \t\t\t\t\treturn 0;\n 1630 | \t\t\t\tcontinue;\n 1631 | \t\t\t}\n 1632 | \t\t\tif (streq(key, \"softdep\")) {\n 1633 | \t\t\t\tconst char *value = kmod_module_info_get_value(l);\n 1634 | \n 1635 | \t\t\t\tif (array_append(&mod->softdep_values, value) < 0)\n 1636 | \t\t\t\t\treturn 0;\n 1637 | \t\t\t\tcontinue;\n 1638 | \t\t\t}\n 1639 | \t\t\tif (streq(key, \"weakdep\")) {\n 1640 | \t\t\t\tconst char *value = kmod_module_info_get_value(l);\n 1641 | \n 1642 | \t\t\t\tif (array_append(&mod->weakdep_values, value) < 0)\n 1643 | \t\t\t\t\treturn 0;\n 1644 | \t\t\t\tcontinue;\n 1645 | \t\t\t}\n 1646 | \t\t}\n 1647 | \t\tkmod_module_get_dependency_symbols(mod->kmod, &mod->dep_sym_list);\n 1648 | \t\tkmod_module_unref(mod->kmod);","lines":29,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/tools/depmod.c#L1620-L1648"}]},
{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`command_do()` tests only `WEXITSTATUS(ret)` after `system()`. A command killed by a signal has `WEXITSTATUS == 0`, so the install/remove command is reported as successful and the function returns the nonzero raw `ret`. Callers test `err < 0`, so a positive `ret` is also treated as success.","fix":"Treat `!WIFEXITED(ret) || WEXITSTATUS(ret) != 0` as failure and return a negative errno or negated status.","locations":[{"ref":"tools/modprobe.c:352-359","code":"  352 | \tsetenv(\"MODPROBE_MODULE\", modname, 1);\n  353 | \tret = system(cmd);\n  354 | \tunsetenv(\"MODPROBE_MODULE\");\n  355 | \tif (ret == -1 || WEXITSTATUS(ret)) {\n  356 | \t\tLOG(\"Error running %s command for %s\\n\", type, modname);\n  357 | \t\tif (ret != -1)\n  358 | \t\t\tret = -WEXITSTATUS(ret);\n  359 | \t}","lines":8,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/tools/modprobe.c#L352-L359"},{"ref":"tools/modprobe.c:516-519","code":"  516 | \t} else\n  517 | \t\terr = command_do(mod, \"remove\", cmd, NULL);\n  518 | \n  519 | \tif (err < 0)","lines":4,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/tools/modprobe.c#L516-L519"}]},
{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `insmod()`, `show_modversions()` and `show_exports()`, `err` is overwritten on each loop iteration with the result for the latest module. A failure for an earlier module in the alias list is lost when a later module succeeds, so `modprobe` exits 0 although part of the work failed. `rmmod()` breaks on the first error, so the behaviour is inconsistent.","fix":"Keep the first or any negative result, for example `int r = ...; if (r < 0) err = r;` with `err` initialised to 0.","locations":[{"ref":"tools/modprobe.c:675-687","code":"  675 | \t/* If module is loaded from path */\n  676 | \tif (mod != NULL) {\n  677 | \t\terr = insmod_insert(mod, flags, extra_options);\n  678 | \t\tkmod_module_unref(mod);\n  679 | \t} else {\n  680 | \t\tkmod_list_foreach(l, list) {\n  681 | \t\t\tmod = kmod_module_get_module(l);\n  682 | \t\t\terr = insmod_insert(mod, flags, extra_options);\n  683 | \t\t\tkmod_module_unref(mod);\n  684 | \t\t}\n  685 | \t\tkmod_module_unref_list(list);\n  686 | \t}\n  687 | \treturn err;","lines":13,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/tools/modprobe.c#L675-L687"},{"ref":"tools/modprobe.c:254-266","code":"  254 | \t/* If module is loaded from path */\n  255 | \tif (mod != NULL) {\n  256 | \t\terr = print_modversions(mod);\n  257 | \t\tkmod_module_unref(mod);\n  258 | \t} else {\n  259 | \t\tkmod_list_foreach(l, list) {\n  260 | \t\t\tmod = kmod_module_get_module(l);\n  261 | \t\t\terr = print_modversions(mod);\n  262 | \t\t\tkmod_module_unref(mod);\n  263 | \t\t}\n  264 | \t\tkmod_module_unref_list(list);\n  265 | \t}\n  266 | \treturn err;","lines":13,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/tools/modprobe.c#L254-L266"},{"ref":"tools/modprobe.c:296-308","code":"  296 | \t/* If module is loaded from path */\n  297 | \tif (mod != NULL) {\n  298 | \t\terr = print_exports(mod);\n  299 | \t\tkmod_module_unref(mod);\n  300 | \t} else {\n  301 | \t\tkmod_list_foreach(l, list) {\n  302 | \t\t\tmod = kmod_module_get_module(l);\n  303 | \t\t\terr = print_exports(mod);\n  304 | \t\t\tkmod_module_unref(mod);\n  305 | \t\t}\n  306 | \t\tkmod_module_unref_list(list);\n  307 | \t}\n  308 | \treturn err;","lines":13,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/tools/modprobe.c#L296-L308"}]},
{"id":"ERR_9","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`do_static_nodes()` ignores the return value of `format->write()` and of `fclose(out)`. Write errors (disk full, closed pipe) are silently dropped and the command exits `EXIT_SUCCESS`. The `write_*` helpers explicitly compute `EXIT_FAILURE` for this case, but the caller discards it. `fgets` with a `PATH_MAX` buffer also splits an overlong line into pieces that are then parsed as separate bogus entries.","fix":"Use `if (format->write(...) != EXIT_SUCCESS) ret = EXIT_FAILURE;` and check `fclose(out) != 0` (or `ferror`) at `finish`.","locations":[{"ref":"tools/static-nodes.c:248-267","code":"  248 | \twhile (fgets(buf, sizeof(buf), in) != NULL) {\n  249 | \t\tchar modname[PATH_MAX];\n  250 | \t\tchar devname[PATH_MAX];\n  251 | \t\tchar type;\n  252 | \t\tunsigned int maj, min;\n  253 | \t\tint matches;\n  254 | \n  255 | \t\tif (buf[0] == '#')\n  256 | \t\t\tcontinue;\n  257 | \n  258 | \t\tmatches =\n  259 | \t\t\tsscanf(buf, \"%s %s %c%u:%u\", modname, devname, &type, &maj, &min);\n  260 | \t\tif (matches != 5 || (type != 'c' && type != 'b')) {\n  261 | \t\t\tfprintf(stderr, \"Error: invalid devname entry: %s\", buf);\n  262 | \t\t\tret = EXIT_FAILURE;\n  263 | \t\t\tcontinue;\n  264 | \t\t}\n  265 | \n  266 | \t\tformat->write(out, modname, devname, type, maj, min);\n  267 | \t}","lines":20,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/tools/static-nodes.c#L248-L267"},{"ref":"tools/static-nodes.c:269-274","code":"  269 | finish:\n  270 | \tif (in)\n  271 | \t\tfclose(in);\n  272 | \tif (out)\n  273 | \t\tfclose(out);\n  274 | \treturn ret;","lines":6,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/tools/static-nodes.c#L269-L274"}]},
{"id":"ERR_10","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"negligible","difficulty":"easy","description":"`output_builtin_bin()` ignores the return value of `path_to_modname(line, modname, NULL)`. If it returns NULL (empty basename), `modname` is uninitialised and passed to `index_insert()`.","fix":"```c\nif (path_to_modname(line, modname, NULL) == NULL) {\n\tERR(\"Invalid modules.builtin line: %s\\n\", line);\n\tcontinue;\n}\n```","locations":[{"ref":"tools/depmod.c:2395-2403","code":" 2395 | \twhile (fgets(line, sizeof(line), in) != NULL) {\n 2396 | \t\tif (!isalpha(line[0])) {\n 2397 | \t\t\tERR(\"Invalid modules.builtin line: %s\\n\", line);\n 2398 | \t\t\tcontinue;\n 2399 | \t\t}\n 2400 | \n 2401 | \t\tpath_to_modname(line, modname, NULL);\n 2402 | \t\tindex_insert(idx, modname, \"\", 0);\n 2403 | \t}","lines":9,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/tools/depmod.c#L2395-L2403"},{"ref":"shared/util.c:162-171","code":"  162 | char *path_to_modname(const char *path, char buf[static PATH_MAX], size_t *len)\n  163 | {\n  164 | \tconst char *modname;\n  165 | \n  166 | \tmodname = basename(path);\n  167 | \tif (modname == NULL || modname[0] == '\\0')\n  168 | \t\treturn NULL;\n  169 | \n  170 | \treturn modname_normalize(modname, buf, len);\n  171 | }","lines":10,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/shared/util.c#L162-L171"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`kmod_elf_get_dependency_symbols()` calls `kmod_elf_crc_find()` for every undefined symbol, and each call linearly scans the whole `__versions` table with `strnlen` and `streq`. That is O(symbols x versions), which gets slow for large modules with thousands of imports. `kmod_elf_crc_find()` also logs `symbol name ... too long` for every non-matching entry, because the length check and the name comparison share one condition.","fix":"Build a hash or sorted index of `__versions` names once, and split the too-long check from the mismatch `continue`.","locations":[{"ref":"libkmod/libkmod-elf.c:935-956","code":"  935 | static int kmod_elf_crc_find(const struct kmod_elf *elf, uint64_t off,\n  936 | \t\t\t     uint64_t versionslen, const char *name, uint64_t *crc)\n  937 | {\n  938 | \tsize_t namlen, verlen, crclen;\n  939 | \tuint64_t i;\n  940 | \n  941 | \telf_get_modversion_lengths(elf, &verlen, &crclen, &namlen);\n  942 | \n  943 | \tfor (i = 0; i < versionslen; i += verlen) {\n  944 | \t\tconst char *symbol = elf_get_mem(elf, off + i + crclen);\n  945 | \t\tif (strnlen(symbol, namlen) == namlen || !streq(name, symbol)) {\n  946 | \t\t\tELFDBG(elf, \"symbol name at index %\" PRIu64 \" too long\\n\", i);\n  947 | \t\t\tcontinue;\n  948 | \t\t}\n  949 | \t\t*crc = elf_get_uint(elf, off + i, crclen);\n  950 | \t\treturn i / verlen;\n  951 | \t}\n  952 | \n  953 | \tELFDBG(elf, \"could not find crc for symbol '%s'\\n\", name);\n  954 | \t*crc = 0;\n  955 | \treturn -1;\n  956 | }","lines":22,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/libkmod/libkmod-elf.c#L935-L956"},{"ref":"libkmod/libkmod-elf.c:1099-1103","code":" 1099 | \t\tname = elf_get_mem(elf, str_off + name_off);\n 1100 | \t\tif (name[0] == '\\0') {\n 1101 | \t\t\tELFDBG(elf, \"empty symbol name at index %zu\\n\", i);\n 1102 | \t\t\tcontinue;\n 1103 | \t\t}","lines":5,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/libkmod/libkmod-elf.c#L1099-L1103"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"In `depmod_modules_search()`, the loop over external dirs does `if (err < 0 && err == -ENOENT) continue;` as the only use of `err`, so the check is a no-op. Every other error is silently ignored too, and the function always returns 0. The conditional suggests error handling that does not exist.","fix":"Either log or return errors other than `-ENOENT`, or drop the dead conditional and the unused `err`.","locations":[{"ref":"tools/depmod.c:1440-1454","code":" 1440 | \tint err;\n 1441 | \tstruct cfg_external *ext;\n 1442 | \n 1443 | \terr = depmod_modules_search_path(depmod, depmod->cfg->dirname);\n 1444 | \tif (err < 0)\n 1445 | \t\treturn err;\n 1446 | \n 1447 | \tfor (ext = depmod->cfg->externals; ext != NULL; ext = ext->next) {\n 1448 | \t\terr = depmod_modules_search_path(depmod, ext->path);\n 1449 | \t\tif (err < 0 && err == -ENOENT)\n 1450 | \t\t\t/* ignore external dir absence */\n 1451 | \t\t\tcontinue;\n 1452 | \t}\n 1453 | \n 1454 | \treturn 0;","lines":15,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/tools/depmod.c#L1440-L1454"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`kmod_cmd_insert` and `kmod_cmd_remove` are declared `extern` in `kmod.h` but defined nowhere in the tools. They are stale declarations.","fix":"Before: `extern const struct kmod_cmd kmod_cmd_insert;` ... `extern const struct kmod_cmd kmod_cmd_remove;`\nAfter: delete both lines.","locations":[{"ref":"tools/kmod.h:25-28","code":"   25 | extern const struct kmod_cmd kmod_cmd_insert;\n   26 | extern const struct kmod_cmd kmod_cmd_list;\n   27 | extern const struct kmod_cmd kmod_cmd_static_nodes;\n   28 | extern const struct kmod_cmd kmod_cmd_remove;","lines":4,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/tools/kmod.h#L25-L28"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The comment `/* In-memory index (depmod only) */` on `index_file_open()` and friends is inaccurate: this stdio-backed reader is not in memory and is also used by libkmod itself (`libkmod.c` `kmod_lookup_alias_from_alias_bin()`, `index_dump`) as the non-mmap fallback.","fix":"Before:\n```\n/* In-memory index (depmod only) */\n```\nAfter:\n```\n/* File-backed (stdio) index reader */\n```","locations":[{"ref":"libkmod/libkmod-index.h:17-22","code":"   17 | /* In-memory index (depmod only) */\n   18 | struct index_file;\n   19 | struct index_file *index_file_open(const char *filename);\n   20 | void index_file_close(struct index_file *idx);\n   21 | char *index_search(struct index_file *idx, const char *key);\n   22 | void index_dump(struct index_file *in, int fd, bool alias_prefix);","lines":6,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/libkmod/libkmod-index.h#L17-L22"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The doc comment of `kmod_unload_resources()` says `Returns: 0 on success or < 0 otherwise.` but the function returns `void`.","fix":"Remove the ` * Returns: 0 on success or < 0 otherwise.` line (and the blank ` *` before it) from the `kmod_unload_resources` doc block.","locations":[{"ref":"libkmod/libkmod.h:104-121","code":"  104 | /**\n  105 |  * kmod_unload_resources:\n  106 |  * @ctx: kmod library context\n  107 |  *\n  108 |  * Unload all the indexes. This will free the resources to maintain the index\n  109 |  * open and all subsequent searches will need to open and close the index.\n  110 |  *\n  111 |  * User is free to call kmod_load_resources() and kmod_unload_resources() as\n  112 |  * many times as wanted during the lifecycle of @ctx. For example, if a daemon\n  113 |  * knows that when starting up it will lookup a lot of modules, it could call\n  114 |  * kmod_load_resources() and after the first burst of searches is gone, it\n  115 |  * could free the resources by calling kmod_unload_resources().\n  116 |  *\n  117 |  * Returns: 0 on success or < 0 otherwise.\n  118 |  *\n  119 |  * Since: 1\n  120 |  */\n  121 | void kmod_unload_resources(struct kmod_ctx *ctx);","lines":18,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/libkmod/libkmod.h#L104-L121"}]},

{"id":"OTHER_1","type":"other","type_label":"Other","severity":"low","difficulty":"very_easy","description":"`kmod_file_open()` returns `ret` without closing `file->fd` when `lseek(file->fd, 0, SEEK_CUR)` fails (non-seekable input such as a pipe or FIFO). `_cleanup_free_` frees only the struct, so the descriptor leaks. The `pread_str_safe` failure path just below does call `close()`. `ret` is also an `int` holding an `off_t` result, and the function returns `ret` (which is -1) instead of `-errno`, so callers get `-EPERM` rather than `-ESPIPE`.","fix":"```\nif (lseek(file->fd, 0, SEEK_CUR) < 0) {\n\tret = -errno;\n\tclose(file->fd);\n\treturn ret;\n}\n```","locations":[{"ref":"libkmod/libkmod-file.c:84-89","code":"   84 | \t/*\n   85 | \t * Bail out if underlying fd is not seekable  - that is not supported\n   86 | \t */\n   87 | \tret = lseek(file->fd, 0, SEEK_CUR);\n   88 | \tif (ret < 0)\n   89 | \t\treturn ret;","lines":6,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/libkmod/libkmod-file.c#L84-L89"}]},
{"id":"OTHER_2","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"In `depmod_modules_search_file()`, `relpath = path + depmod->cfg->dirnamelen + 1` is computed unconditionally. For modules found in `external` directories, `path` does not start with `cfg->dirname` and may be shorter than `dirnamelen + 1`, so the pointer lies beyond the string. It is then read by the `%s` in two `DBG` calls (lines 1287 and 1298) when debug logging is on, which is an out-of-bounds read.","fix":"Only compute `relpath` when `strncmp(path, cfg->dirname, cfg->dirnamelen) == 0 && path[cfg->dirnamelen] == '/'`; otherwise use `path` for the debug output.","locations":[{"ref":"tools/depmod.c:1286-1298","code":" 1286 | \trelpath = path + depmod->cfg->dirnamelen + 1;\n 1287 | \tDBG(\"try %s (%s)\\n\", relpath, modname);\n 1288 | \n 1289 | \tmod = hash_find(depmod->modules_by_name, modname);\n 1290 | \tif (mod == NULL)\n 1291 | \t\tgoto add;\n 1292 | \n 1293 | \tif (depmod_module_is_higher_priority(depmod, mod, baselen, modnamelen, path)) {\n 1294 | \t\tDBG(\"Ignored lower priority: %s, higher: %s\\n\", path, mod->path);\n 1295 | \t\treturn 0;\n 1296 | \t}\n 1297 | \n 1298 | \tDBG(\"Replace lower priority %s with new module %s\\n\", mod->relpath, relpath);","lines":13,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/tools/depmod.c#L1286-L1298"}]},
{"id":"OTHER_3","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"`depmod_symbol_find()` strips a leading `.` and then does `if (name[0] == cfg->sym_prefix) name++`. The default `sym_prefix` is `'\\0'`, so a symbol named exactly `.` (as an undefined symbol in a crafted module) becomes `\"\"`, then `name[0] == '\\0'` matches and `name` is advanced past the terminator. `hash_find` then reads out-of-bounds. `depmod_symbol_add()` has the same pattern with `name[0] == sym_prefix`, and so does `depmod_load_system_map()` with `p[0] == sym_prefix`.","fix":"Guard the prefix skip with `depmod->cfg->sym_prefix != '\\0' &&` (or `name[0] != '\\0'`) before incrementing.","locations":[{"ref":"tools/depmod.c:1584-1591","code":" 1584 | static struct symbol *depmod_symbol_find(const struct depmod *depmod, const char *name)\n 1585 | {\n 1586 | \tif (name[0] == '.') /* PPC64 needs this: .foo == foo */\n 1587 | \t\tname++;\n 1588 | \tif (name[0] == depmod->cfg->sym_prefix)\n 1589 | \t\tname++;\n 1590 | \treturn hash_find(depmod->symbols, name);\n 1591 | }","lines":8,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/tools/depmod.c#L1584-L1591"},{"ref":"tools/depmod.c:1556-1563","code":" 1556 | \tsize_t namelen;\n 1557 | \tint err;\n 1558 | \tstruct symbol *sym;\n 1559 | \n 1560 | \tif (!prefix_skipped && (name[0] == depmod->cfg->sym_prefix))\n 1561 | \t\tname++;\n 1562 | \n 1563 | \tnamelen = strlen(name) + 1;","lines":8,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/tools/depmod.c#L1556-L1563"},{"ref":"tools/depmod.c:2736-2738","code":" 2736 | \t\t/* skip prefix */\n 2737 | \t\tif (p[0] == depmod->cfg->sym_prefix)\n 2738 | \t\t\tp++;","lines":3,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/tools/depmod.c#L2736-L2738"}]}

<script>
(function(){
'use strict';

// Data
// ALL_FINDINGS is everything the TOML held; FINDINGS is what the report draws.
// A finding with a non-empty `ignore` ("False Positive", ...) was dismissed by hand:
// it is dropped from FINDINGS - so it is never drawn, counted, grouped, filtered or
// exported to Markdown - but kept in ALL_FINDINGS so the TOML export round-trips the
// marker instead of silently deleting it. Ids were already assigned (python side)
// over the FULL list, so dismissing one never renumbers the rest.
const ALL_FINDINGS = JSON.parse(document.getElementById('D').textContent);
const OPTS         = JSON.parse(document.getElementById('OPT').textContent);
const PROJECT_INFO = JSON.parse(document.getElementById('PI').textContent);
const FINDINGS     = OPTS.show_ignored ? ALL_FINDINGS : ALL_FINDINGS.filter(f => !f.ignore);
const SEVS     = ['critical','high','medium','low','negligible'];
const STATUSES = ['open','fixed','wont-fix','false-positive'];
const ALL_TYPES = [...new Set(FINDINGS.map(f => f.type))].sort(cmpTypes);
// Build lookup map for O(1) access
const FINDING_BY_ID = new Map(FINDINGS.map(f => [f.id, f]));
// Only severities actually present in the report — the filter bar hides the rest.
const PRESENT_SEVS = SEVS.filter(s => FINDINGS.some(f => (f.severity || 'medium') === s));
// Which difficulties occur at all — the "Quick wins" filter row is hidden otherwise.
const DIFFICULTY_ORDER = ['very_easy','easy','medium','hard'];
const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};
const PRESENT_DIFFS = DIFFICULTY_ORDER.filter(d => FINDINGS.some(f => f.difficulty === d));
const HAS_DIFFICULTY = PRESENT_DIFFS.length > 0;
// Key on the document identity (origin+path), NOT location.href: the latter
// includes the filter hash this report writes via history.replaceState, so the
// same report opened/shared under a different #hash would otherwise get a
// SEPARATE status store and the fixed/won't-fix marks would appear to vanish.
const DOC_KEY = location.origin + location.pathname;
const STORE_KEY = 'audit-status:' + DOC_KEY;
const PREFS_KEY = 'audit-prefs:' + DOC_KEY;
// Status (open/fixed/wont-fix/false-positive) is only meaningful if it can be
// PERSISTED. In a sandboxed iframe / opaque origin (some report servers, artifact
// viewers) localStorage access throws, so the toggle would silently never save.
// When we can't write, hide the whole status feature (resolved% + per-finding
// status), rather than showing a control that quietly does nothing.
const STATUS_ENABLED = (() => {
  try { const k = '__audit_probe__'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; }
  catch { return false; }
})();

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State
const S = {
  search: '', searchScope: 'all', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenDiff: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(),
};
const statuses = {};

// Persistence
function loadStatuses() {
  try { Object.assign(statuses, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch {}
}
function saveStatuses() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(statuses)); } catch {}
}
function statusOf(id) { return statuses[id] || 'open'; }

// UI preferences (e.g. wide layout) - persisted locally only, best-effort. On a
// sandboxed/read-only origin these silently no-op, exactly like the status store.
function loadPrefs() { try { return JSON.parse(localStorage.getItem(PREFS_KEY) || '{}'); } catch { return {}; } }
function savePrefs(p) { try { localStorage.setItem(PREFS_KEY, JSON.stringify(p)); } catch {} }
const PREFS = loadPrefs();

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;
function syncHash() {
  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));
    if (S.search)            p.set('q',   S.search);
    if (S.searchScope !== 'all') p.set('qs', S.searchScope);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('qs'))  { S.searchScope = p.get('qs'); }
  document.getElementById('search-scope').classList.toggle('active', S.searchScope === 'locations');
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }
function isCustom(t)  { return String(t).toLowerCase() === 'custom'; }
function typeCls(t)   { return 'type-badge' + (isCustom(t) ? ' custom-type' : ''); }
// 'custom' findings are the user's own externally-sourced ones; pin them first
// everywhere types are listed so they never blend into the audit's own categories.
function cmpTypes(a, b) {
  if (isCustom(a) !== isCustom(b)) return isCustom(a) ? -1 : 1;
  return String(a).localeCompare(String(b));
}

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Render a "**Label:** value" line. GitHub/CommonMark only recognizes a
// ``` fence when it starts at the beginning of a line, so if the value
// itself opens with a fence, put it on its own line instead of right
// after the inline label - otherwise the fence marker gets glued onto
// "**Label:** ```" and never renders as a code block.
function mdField(label, value) {
  value = value || '';
  return /^```/.test(value.trim())
    ? '**' + label + ':**\n\n' + value
    : '**' + label + ':** ' + value;
}

// Render the "**Locations:**" block. When a location has a commit-pinned
// permalink (GitHub/GitLab), just paste the bare URL on its own line -
// GitHub/GitLab auto-expand a line-range blob link into an inline code
// preview, so re-pasting the snippet as a fenced block would duplicate it.
// Forges without a detected permalink shape (or missing commit/repo info)
// fall back to the fenced ref+snippet so the location is still readable.
function mdLocations(locations) {
  if (!locations.length) return '';
  let out = '**Locations:**\n\n';
  for (const l of locations) {
    if (l.link)               out += l.link + '\n\n';
    else if (l.code != null)  out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
    else                      out += '- `' + l.ref + '` _(file not found)_\n\n';
  }
  return out;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort(cmpTypes);

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += mdField('Description', f.description) + '\n\n';
      out += mdLocations(f.locations);
      out += mdField('Fix', f.fix) + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build a [project] header block from embedded PROJECT_INFO, so the exported
// findings.toml is self-contained (doesn't depend on a sibling project-info.toml
// that a second, separately-triggered download could silently fail to save).
// '' when there is no project info at all.
function buildProjectToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = PROJECT_INFO || {};
  if (!Object.keys(pi).length) return '';
  const lines = ['[project]'];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n\n';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  // ALL_FINDINGS, not FINDINGS: the export is the data file, so hand-dismissed
  // findings and their `ignore` reason must survive it - exporting only what is
  // drawn would quietly delete every dismissal on the next round-trip.
  for (const f of ALL_FINDINGS) {
    const lns = ['[[finding]]'];
    // Pin the id so re-rendering this export - or filtering it down later - can't
    // renumber findings that were already referenced by id elsewhere.
    if (f.id && f.id !== '?') lns.push(pad('id') + '= ' + tomlStr(f.id));
    if (f.ignore) lns.push(pad('ignore') + '= ' + tomlStr(f.ignore));
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return buildProjectToml() + chunks.join('\n\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += mdField('Description', f.description) + '\n\n';
  out += mdLocations(f.locations);
  out += mdField('Fix', f.fix) + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'folder') {
    if (!f.locations.length) return '(no location)';
    const path = f.locations[0].ref.replace(/:.*/,'');
    const idx = path.lastIndexOf('/');
    return idx === -1 ? '(root)' : path.slice(0, idx);
  }
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystacks per finding (cleared on full re-render).
// Two variants: everything (default), and file/folder paths only - for when a
// search term (e.g. a directory name like 'dlls/abc') also happens to appear
// inside description/fix prose and you only want path matches.
const _hay = new Map();
const _hayLoc = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    f.ignore ? 'ignored ' + f.ignore : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}
function hayLocOf(f) {
  if (!_hayLoc.has(f.id)) {
    _hayLoc.set(f.id, f.locations.map(l => l.ref).join(' ').toLowerCase());
  }
  return _hayLoc.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (S.searchScope === 'locations') {
      if (!hayLocOf(f).includes(q)) return false;
    } else if (!hayOf(f).includes(q) && !st.includes(q)) {
      return false;
    }
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  if (S.groupBy === 'type') return [...keys].sort(cmpTypes);
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + (f.ignore ? ' ignored' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge ' + typeCls(f.type) + '" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (f.ignore ? '<span class="badge ign-badge" style="cursor:default" title="Ignored: ' + esc(f.ignore) + '">✗ ignored: ' + esc(f.ignore) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    (STATUS_ENABLED ? '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' : '') +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge ' + typeCls(t) + '" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row filter-row-status"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  _hayLoc.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'toggle-width') {
    const wide = document.body.classList.toggle('wide');
    b.textContent = wide ? '⤢ Narrow' : '⤢ Wide';
    PREFS.wide = wide; savePrefs(PREFS);
  }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    // Single download (was two) - a second auto-triggered download is commonly
    // blocked by the browser unless the user explicitly allows it, which silently
    // drops project-info.toml. Embedding [project] in findings.toml itself avoids
    // that failure mode entirely.
    downloadText(buildFindingsToml(), 'findings.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});
document.getElementById('search-scope').addEventListener('click', e => {
  S.searchScope = S.searchScope === 'locations' ? 'all' : 'locations';
  e.currentTarget.classList.toggle('active', S.searchScope === 'locations');
  scheduleRender();
});

// Init
if (!STATUS_ENABLED) { try { document.body.classList.add('no-status'); } catch {} }
if (PREFS.wide) {
  try {
    document.body.classList.add('wide');
    const wb = document.querySelector('[data-action="toggle-width"]');
    if (wb) wb.textContent = '⤢ Narrow';
  } catch {}
}
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
