<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
body.wide .app{max-width:none}
.no-status #progress-bar,.no-status #progress-text,.no-status .filter-row-status{display:none}
.no-status .copy-btn{margin-left:auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.ign-badge{background:#1f1b16;color:#a8a29e;border-color:#57534e;max-width:22rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card.ignored{opacity:.5;border-left:3px solid #57534e}
.card.ignored:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`kmod_elf_new()` takes `e_shstrndx` and `e_shnum` straight from the ELF header and passes them to `elf_get_section_info()`, which calls `elf_get_section_header_offset()`. That function has `assert(idx != SHN_UNDEF)` and `assert(idx < elf->header.section.count)` ahead of its graceful range check. The build does not define `NDEBUG`, so a crafted module with `e_shstrndx == 0`, `e_shstrndx >= e_shnum` or `e_shnum == 0` aborts the process instead of returning `-EINVAL`. The same asserts are reachable from `kmod_elf_get_section()` and `kmod_elf_save_sections()` only with already-valid indices, so the header path is the exploitable one.","fix":"In `kmod_elf_new()`, reject `elf->header.strings.section == SHN_UNDEF || elf->header.strings.section >= elf->header.section.count` with `goto invalid` before calling `elf_get_section_info()`. Alternatively drop the two `assert()` calls in `elf_get_section_header_offset()` and keep the existing runtime check.","locations":[{"ref":"libkmod/libkmod-elf.c:209-220","code":"  209 | static uint64_t elf_get_section_header_offset(const struct kmod_elf *elf, uint16_t idx)\n  210 | {\n  211 | \tassert(idx != SHN_UNDEF);\n  212 | \tassert(idx < elf->header.section.count);\n  213 | \tif (idx == SHN_UNDEF || idx >= elf->header.section.count) {\n  214 | \t\tELFDBG(elf, \"invalid section number: %\" PRIu16 \", last=%\" PRIu16 \"\\n\",\n  215 | \t\t       idx, elf->header.section.count);\n  216 | \t\treturn 0;\n  217 | \t}\n  218 | \treturn elf->header.section.offset +\n  219 | \t       (uint64_t)(idx * elf->header.section.entry_size);\n  220 | }","lines":12,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/libkmod/libkmod-elf.c#L209-L220"},{"ref":"libkmod/libkmod-elf.c:376-381","code":"  376 | \tif (elf_get_section_info(elf, elf->header.strings.section,\n  377 | \t\t\t\t &elf->header.strings.offset, &elf->header.strings.size,\n  378 | \t\t\t\t &name) < 0) {\n  379 | \t\tELFDBG(elf, \"could not get strings section\\n\");\n  380 | \t\tgoto invalid;\n  381 | \t} else {","lines":6,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/libkmod/libkmod-elf.c#L376-L381"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`cfg_files_insert_sorted()` with `name == NULL` computes `dirlen -= namelen + 1` after `name = basename(dir)`. When `-C` is given a plain relative file name without a slash (e.g. `depmod -C my.conf`), `basename()` returns the whole string, so `dirlen` becomes `SIZE_MAX`. The `malloc` size wraps to a small value and the following `memcpy(f->path, dir, dirlen)` crashes. `case 'C'` in `do_depmod()` stores `optarg` unchanged, so this is reachable from the command line.","fix":"Compute the split explicitly and handle the no-slash case, for example:\n```c\nconst char *slash = strrchr(dir, '/');\nname = slash ? slash + 1 : dir;\nnamelen = strlen(name);\ndirlen = slash ? (size_t)(slash - dir) : 0;\n```\nFor `dirlen == 0` either store `.` as the directory part or build `f->path` without the leading `/`.","locations":[{"ref":"tools/depmod.c:802-809","code":"  802 | \n  803 | \tdirlen = strlen(dir);\n  804 | \tif (name != NULL)\n  805 | \t\tnamelen = strlen(name);\n  806 | \telse {\n  807 | \t\tname = basename(dir);\n  808 | \t\tnamelen = strlen(name);\n  809 | \t\tdirlen -= namelen + 1;","lines":8,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/tools/depmod.c#L802-L809"},{"ref":"tools/depmod.c:823-849","code":"  823 | \n  824 | \tf = malloc(sizeof(struct cfg_file) + dirlen + namelen + 2);\n  825 | \tif (f == NULL) {\n  826 | \t\tERR(\"files insert sorted: out of memory\\n\");\n  827 | \t\treturn -ENOMEM;\n  828 | \t}\n  829 | \n  830 | \ttmp = realloc(files, sizeof(struct cfg_file *) * (n_files + 1));\n  831 | \tif (tmp == NULL) {\n  832 | \t\tERR(\"files insert sorted: out of memory\\n\");\n  833 | \t\tfree(f);\n  834 | \t\treturn -ENOMEM;\n  835 | \t}\n  836 | \t*p_files = files = tmp;\n  837 | \n  838 | \tif (i < n_files) {\n  839 | \t\tmemmove(files + i + 1, files + i,\n  840 | \t\t\tsizeof(struct cfg_file *) * (n_files - i) {"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"The cycle-reporting stack in `depmod_report_cycles()` is allocated with `n_r` entries (the number of modules that still have users). `depmod_report_cycles_from_root()` pushes one `vertex` per dependency edge, with no visited check on push, so the number of simultaneously live entries can exceed the number of modules. For example, a dense 3-module cycle where each module depends on the other two overflows a stack of 3: the second push after the third level trips `assert(is < stack_size)`. With NDEBUG the same code writes out of bounds. Depmod therefore aborts instead of printing the cycle report.","fix":"Size the stack by total edge count (sum of `deps.count` over the roots), or grow it dynamically. Alternatively, skip pushing already visited non-root modules.","locations":[{"ref":"tools/depmod.c:1829-1922","code":" 1829 | static int depmod_report_cycles_from_root(struct mod *root_mod, struct kmod_list **roots,\n 1830 | \t\t\t\t\t  void **stack, size_t stack_size,\n 1831 | \t\t\t\t\t  struct hash *loop_set)\n 1832 | {\n 1833 | \tstruct kmod_list *free_list = NULL; /* struct vertex */\n 1834 | \tstruct kmod_list *l;\n 1835 | \tstruct vertex *root;\n 1836 | \tstruct vertex *vertex;\n 1837 | \tstruct vertex *v;\n 1838 | \tstruct mod *m;\n 1839 | \tstruct mod **itr, **itr_end;\n 1840 | \tsize_t is;\n 1841 | \tint ret = -ENOMEM;\n 1842 | \n 1843 | \troot = vertex_new(root_mod, NULL);\n 1844 | \tif (root == NULL) {\n 1845 | \t\tERR(\"No memory to report cycles\\n\");\n 1846 | \t\tgoto out;\n 1847 | \t}\n 1848 | \n 1849 | \tl = kmod_list_append(free_list, root);\n 1850 | \tif (l == NULL) {\n 1851 | \t\tERR(\"No memory to report cycles\\n\");\n 1852 | \t\tfree(root);\n 1853 | \t\tgoto out;\n 1854 | \t}\n 1855 | \tfree_list = l;\n 1856 | \n 1857 | \tis = 0;\n 1858 | \tstack[is++] = (void *)root;\n 1859 | \n 1860 | \twhile (is > 0) {\n 1861 | \t\tvertex = stack[--is];\n 1862 | \t\tm = vertex->mod;\n 1863 | \t\t/*\n 1864 | \t\t * because of the topological sort we can start only\n 1865 | \t\t * from part of a loop or from a branch after a loop\n 1866 | \t\t */\n 1867 | \t\tif (m->visited && m == root->mod) {\n 1868 | \t\t\tint rc;\n 1869 | \t\t\trc = depmod_report_one_cycle(vertex, roots, loop_set);\n 1870 | \t\t\tif (rc != 0) {\n 1871 | \t\t\t\tret = rc;\n 1872 | \t\t\t\tgoto out;\n 1873 | \t\t\t}\n 1874 | \t\t\tcontinue;\n 1875 | \t\t}\n 1876 | \n 1877 | \t\tm->visited = true;\n 1878 | \t\tif (m->deps.count == 0) {\n 1879 | \t\t\t/*\n 1880 | \t\t\t * boundary condition: if there is more than one\n 1881 | \t\t\t * single node branch (not a loop), it is\n 1882 | \t\t\t * recognized as a loop by the code above:\n 1883 | \t\t\t * m->visited because more then one,\n 1884 | \t\t\t * m == root->mod since it is a single node.\n 1885 | \t\t\t * So, prevent deeping into the branch second\n 1886 | \t\t\t * time.\n 1887 | \t\t\t */\n 1888 | \t\t\tdepmod_list_remove_data(roots, m);\n 1889 | \n 1890 | \t\t\tcontinue;\n 1891 | \t\t}\n 1892 | \n 1893 | \t\titr = (struct mod **)m->deps.array;\n 1894 | \t\titr_end = itr + m->deps.count;\n 1895 | \t\tfor (; itr < itr_end; itr++) {\n 1896 | \t\t\tstruct mod *dep = *itr;\n 1897 | \t\t\tv = vertex_new(dep, vertex);\n 1898 | \t\t\tif (v == NULL) {\n 1899 | \t\t\t\tERR(\"No memory to report cycles\\n\");\n 1900 | \t\t\t\tgoto out;\n 1901 | \t\t\t}\n 1902 | \t\t\tassert(is < stack_size);\n 1903 | \t\t\tstack[is++] = v;\n 1904 | \n 1905 | \t\t\tl = kmod_list_append(free_list, v);\n 1906 | \t\t\tif (l == NULL) {\n 1907 | \t\t\t\tERR(\"No memory to report cycles\\n\");\n 1908 | \t\t\t\tfree(v);\n 1909 | \t\t\t\tgoto out;\n 1910 | \t\t\t}\n 1911 | \t\t\tfree_list = l;\n 1912 | \t\t}\n 1913 | \t}\n 1914 | \tret = 0;\n 1915 | \n 1916 | out:\n 1917 | \tkmod_list_release(free_list, free);\n 1918 | \n 1919 | \treturn ret;\n 1920 | }\n 1921 | \n 1922 | static void depmod_report_cycles(struct depmod *depmod, uint16_t n_mods, uint16_t *users)","lines":94,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/tools/depmod.c#L1829-L1922"},{"ref":"tools/depmod.c:1948-1952","code":" 1948 | \t_clang_suppress_alloc_ stack = malloc(n_r * sizeof(void *));\n 1949 | \tif (stack == NULL) {\n 1950 | \t\tERR(\"No memory to report cycles\\n\");\n 1951 | \t\tgoto out_list;\n 1952 | \t}","lines":5,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/tools/depmod.c#L1948-L1952"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`kmod_elf_get_modinfo_strings()` evaluates `strings[i] == '\\0'` before the bound check `i < size` in `while (strings[i] == '\\0' && i < size)`. When the last byte of `.modinfo` is NUL, this reads `strings[size]`, one byte past the section. If the section ends at the end of the file mapping, that is an out-of-bounds read.","fix":"```\nwhile (i < size && strings[i] == '\\0')\n\ti++;\n```","locations":[{"ref":"libkmod/libkmod-elf.c:460-470","code":"  460 | \tfor (i = 0, count = 0; i < size;) {\n  461 | \t\tif (strings[i] != '\\0') {\n  462 | \t\t\ti++;\n  463 | \t\t\tcontinue;\n  464 | \t\t}\n  465 | \n  466 | \t\twhile (strings[i] == '\\0' && i < size)\n  467 | \t\t\ti++;\n  468 | \n  469 | \t\tcount++;\n  470 | \t}","lines":11,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/libkmod/libkmod-elf.c#L460-L470"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"Symbol names taken from `.strtab` are used with `strstartswith()` and `streq()`, and are later stored and `strlen`'d by callers, without checking that `.strtab` ends in NUL. Only `name_off < strtablen` is checked. A crafted module whose `.strtab` ends in a non-NUL byte at the end of the mapped file causes an out-of-bounds read in `kmod_elf_get_symbols()` and `kmod_elf_get_dependency_symbols()`. The `__ksymtab_strings` fallback and the `.shstrtab` path do check for a terminator.","fix":"Before using `.strtab`, reject it if `strtablen == 0` or the last byte `elf_get_mem(elf, str_sec_off)[strtablen - 1] != '\\0'` (fall back or return `-EINVAL`).","locations":[{"ref":"libkmod/libkmod-elf.c:862-874","code":"  862 | \t\tif (name_off >= strtablen) {\n  863 | \t\t\tELFDBG(elf,\n  864 | \t\t\t       \".strtab is %\" PRIu64\n  865 | \t\t\t       \" bytes, but .symtab entry %zu wants to access offset %\" PRIu32\n  866 | \t\t\t       \".\\n\",\n  867 | \t\t\t       strtablen, i, name_off);\n  868 | \t\t\tgoto fallback;\n  869 | \t\t}\n  870 | \n  871 | \t\tname = elf_get_mem(elf, str_off + name_off);\n  872 | \n  873 | \t\tif (!strstartswith(name, crc_str))\n  874 | \t\t\tcontinue;","lines":13,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/libkmod/libkmod-elf.c#L862-L874"},{"ref":"libkmod/libkmod-elf.c:1083-1097","code":" 1083 | \t\t\t */\n 1084 | \t\t\tif (type == STT_REGISTER)\n 1085 | \t\t\t\tcontinue;\n 1086 | \t\t}\n 1087 | \n 1088 | \t\tif (name_off >= strtablen) {\n 1089 | \t\t\tELFDBG(elf,\n 1090 | \t\t\t       \".strtab is %\" PRIu64\n 1091 | \t\t\t       \" bytes, but .symtab entry %zu wants to access offset %\" PRIu32\n 1092 | \t\t\t       \".\\n\",\n 1093 | \t\t\t       strtablen, i, name_off);\n 1094 | \t\t\tfree(visited_versions);\n 1095 | \t\t\tfree(symcrcs);\n 1096 | \t\t\treturn -EINVAL;\n 1097 | \t\t}","lines":15,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/libkmod/libkmod-elf.c#L1083-L1097"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"The mmap-based reader trusts offsets and strings inside the index file. `index_mm_read_node()` only checks that the node offset is `< idx->size`; `read_chars_mm()` uses an unbounded `strlen()` (file is not guaranteed NUL terminated), the `children` array (`sizeof(uint32_t) * child_count`) and `value_count`/value strings are never bounds-checked against `idx->size`, and `index_mm_search_node()` does `strdup(p + 4)` unbounded. A truncated or malicious `modules.dep.bin`/`modules.alias.bin` causes out-of-bounds reads. Child offsets forming a cycle also cause unbounded recursion in `index_mm_dump_node()`/`index_mm_searchwild_all()` (stack overflow).","fix":"Pass `idx->size` into the read helpers and validate that prefix NUL, children array, value_count entries and strings lie within `[mm, mm + size)`; add a depth limit to the recursive dump/searchwild.","locations":[{"ref":"libkmod/libkmod-index.c:677-740","code":"  677 | static inline const char *read_chars_mm(const void **p, size_t *rlen)\n  678 | {\n  679 | \tconst char *addr = *(const char **)p;\n  680 | \tsize_t len = *rlen = strlen(addr);\n  681 | \t*p = addr + len + 1;\n  682 | \treturn addr;\n  683 | }\n  684 | \n  685 | static inline void read_value_mm(const void **p, struct index_mm_value *v)\n  686 | {\n  687 | \tv->priority = read_u32_mm(p);\n  688 | \tv->value = read_chars_mm(p, &v->len);\n  689 | }\n  690 | \n  691 | /* reads node into given node struct and returns its address on success or NULL on error. */\n  692 | static struct index_mm_node *index_mm_read_node(const struct index_mm *idx,\n  693 | \t\t\t\t\t\tuint32_t offset,\n  694 | \t\t\t\t\t\tstruct index_mm_node *node)\n  695 | {\n  696 | \tconst void *p;\n  697 | \n  698 | \tif ((offset & INDEX_NODE_MASK) == 0 || (offset & INDEX_NODE_MASK) >= idx->size)\n  699 | \t\treturn NULL;\n  700 | \n  701 | \tp = (const char *)idx->mm + (offset & INDEX_NODE_MASK);\n  702 | \n  703 | \tif (offset & INDEX_NODE_PREFIX) {\n  704 | \t\tsize_t len;\n  705 | \t\tnode->prefix = read_chars_mm(&p, &len);\n  706 | \t} else {\n  707 | \t\tnode->prefix = \"\";\n  708 | \t}\n  709 | \n  710 | \tif (offset & INDEX_NODE_CHILDS) {\n  711 | \t\tsize_t child_count;\n  712 | \n  713 | \t\tnode->first = read_char_mm(&p);\n  714 | \t\tnode->last = read_char_mm(&p);\n  715 | \n  716 | \t\tif (node->first > node->last || node->first >= INDEX_CHILDMAX ||\n  717 | \t\t    node->last >= INDEX_CHILDMAX)\n  718 | \t\t\treturn NULL;\n  719 | \n  720 | \t\tnode->children = p;\n  721 | \n  722 | \t\tchild_count = node->last - node->first + 1;\n  723 | \t\tp = (const char *)p + sizeof(uint32_t) * child_count;\n  724 | \t} else {\n  725 | \t\tnode->first = INDEX_CHILDMAX;\n  726 | \t\tnode->last = 0;\n  727 | \t\tnode->children = NULL;\n  728 | \t}\n  729 | \n  730 | \tif (offset & INDEX_NODE_VALUES) {\n  731 | \t\tnode->value_count = read_u32_mm(&p);\n  732 | \t\tnode->values = p;\n  733 | \t} else {\n  734 | \t\tnode->value_count = 0;\n  735 | \t\tnode->values = NULL;\n  736 | \t}\n  737 | \n  738 | \tnode->idx = idx;\n  739 | \n  740 | \treturn node;","lines":64,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/libkmod/libkmod-index.c#L677-L740"},{"ref":"libkmod/libkmod-index.c:906-940","code":"  906 | static char *index_mm_search_node(struct index_mm_node *node, const char *key)\n  907 | {\n  908 | \tchar *value;\n  909 | \tint j;\n  910 | \n  911 | \twhile (node) {\n  912 | \t\tfor (j = 0; node->prefix[j]; j++) {\n  913 | \t\t\tuint8_t ch = node->prefix[j];\n  914 | \n  915 | \t\t\tif (ch != key[j])\n  916 | \t\t\t\treturn NULL;\n  917 | \t\t}\n  918 | \n  919 | \t\tkey += j;\n  920 | \n  921 | \t\tif (*key == '\\0') {\n  922 | \t\t\tif (node->value_count > 0) {\n  923 | \t\t\t\tconst char *p = node->values;\n  924 | \n  925 | \t\t\t\t/* return first value without priority */\n  926 | \t\t\t\tp += sizeof(uint32_t);\n  927 | \t\t\t\tvalue = strdup(p);\n  928 | \t\t\t} else {\n  929 | \t\t\t\tvalue = NULL;\n  930 | \t\t\t}\n  931 | \n  932 | \t\t\treturn value;\n  933 | \t\t}\n  934 | \n  935 | \t\tnode = index_mm_readchild(node, *key, node);\n  936 | \t\tkey++;\n  937 | \t}\n  938 | \n  939 | \treturn NULL;\n  940 | }","lines":35,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/libkmod/libkmod-index.c#L906-L940"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"`module_options_concat()` does not check the result of `malloc()`; on allocation failure it immediately `memcpy()`s / writes through a NULL pointer. It is called for every module in `kmod_module_probe_insert_module()`.","fix":"Before:\n```\nr = malloc(optlen + xoptlen + 2);\n\nif (opt != NULL) {\n```\nAfter:\n```\nr = malloc(optlen + xoptlen + 2);\nif (r == NULL)\n\treturn NULL;\n\nif (opt != NULL) {\n```\n(and make the caller treat NULL with non-empty inputs as -ENOMEM).","locations":[{"ref":"libkmod/libkmod-module.c:888-912","code":"  888 | static char *module_options_concat(const char *opt, const char *xopt)\n  889 | {\n  890 | \t// TODO: we might need to check if xopt overrides options on opt\n  891 | \tsize_t optlen = opt == NULL ? 0 : strlen(opt);\n  892 | \tsize_t xoptlen = xopt == NULL ? 0 : strlen(xopt);\n  893 | \tchar *r;\n  894 | \n  895 | \tif (optlen == 0 && xoptlen == 0)\n  896 | \t\treturn NULL;\n  897 | \n  898 | \tr = malloc(optlen + xoptlen + 2);\n  899 | \n  900 | \tif (opt != NULL) {\n  901 | \t\tmemcpy(r, opt, optlen);\n  902 | \t\tr[optlen] = ' ';\n  903 | \t\toptlen++;\n  904 | \t}\n  905 | \n  906 | \tif (xopt != NULL)\n  907 | \t\tmemcpy(r + optlen, xopt, xoptlen);\n  908 | \n  909 | \tr[optlen + xoptlen] = '\\0';\n  910 | \n  911 | \treturn r;\n  912 | }","lines":25,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/libkmod/libkmod-module.c#L888-L912"}]},
{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"very_easy","description":"`kmod_elf_get_modversions()` sets `*array = a = malloc(...)` and then returns `-EINVAL` from inside the loop when a symbol name is too long (`nlen == namlen`). The caller `kmod_module_get_versions()` returns immediately when `count < 0` and never frees `versions`, so the allocation leaks for every malformed `__versions` section.","fix":"```\nif (nlen == namlen) {\n\tELFDBG(elf, \"symbol name at index %zu too long\\n\", i);\n\tfree(a);\n\t*array = NULL;\n\treturn -EINVAL;\n}\n```","locations":[{"ref":"libkmod/libkmod-elf.c:559-571","code":"  559 | \t*array = a = malloc(sizeof(struct kmod_modversion) * count);\n  560 | \tif (*array == NULL)\n  561 | \t\treturn -ENOMEM;\n  562 | \n  563 | \tfor (i = 0, off = sec_off; i < count; i++, off += verlen) {\n  564 | \t\tuint64_t crc = elf_get_uint(elf, off, crclen);\n  565 | \t\tconst char *symbol = elf_get_mem(elf, off + crclen);\n  566 | \t\tsize_t nlen = strnlen(symbol, namlen);\n  567 | \n  568 | \t\tif (nlen == namlen) {\n  569 | \t\t\tELFDBG(elf, \"symbol name at index %zu too long\\n\", i);\n  570 | \t\t\treturn -EINVAL;\n  571 | \t\t}","lines":13,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/libkmod/libkmod-elf.c#L559-L571"},{"ref":"libkmod/libkmod-module.c:2095-2097","code":" 2095 | \tcount = kmod_elf_get_modversions(mod->elf, &versions);\n 2096 | \tif (count < 0)\n 2097 | \t\treturn count;","lines":3,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/libkmod/libkmod-module.c#L2095-L2097"}]},
{"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"In `index_read()` the error path `err:` frees `prefix` and `node` but not `node->values`. If reading the value list fails midway (truncated or corrupt index file: `read_u32()` or `getdelim()` fails after one or more `add_value()` calls), the already-built `index_value` chain leaks. Also, `node->values` is only initialised at line 308, so a generic fix must set `node->values = NULL` right after each `malloc()` (before any `goto err`).","fix":"Set `node->values = NULL` immediately after both `malloc()` calls, and in the `err:` label call `if (node) index_values_free(node->values);` before `free(node);`.","locations":[{"ref":"libkmod/libkmod-index.c:308-334","code":"  308 | \tnode->values = NULL;\n  309 | \tif (offset & INDEX_NODE_VALUES) {\n  310 | \t\tuint32_t value_count;\n  311 | \t\tuint32_t priority;\n  312 | \n  313 | \t\tif (!read_u32(fp, &value_count))\n  314 | \t\t\tgoto err;\n  315 | \n  316 | \t\twhile (value_count--) {\n  317 | \t\t\tssize_t n;\n  318 | \n  319 | \t\t\tif (!read_u32(fp, &priority))\n  320 | \t\t\t\tgoto err;\n  321 | \t\t\tn = getdelim(&idx->tmp, &idx->tmp_size, '\\0', fp);\n  322 | \t\t\tif (n < 0)\n  323 | \t\t\t\tgoto err;\n  324 | \t\t\tadd_value(&node->values, idx->tmp, n, priority);\n  325 | \t\t}\n  326 | \t}\n  327 | \n  328 | \tnode->prefix = prefix;\n  329 | \tnode->idx = idx;\n  330 | \treturn node;\n  331 | err:\n  332 | \tfree(prefix);\n  333 | \tfree(node);\n  334 | \treturn NULL;","lines":27,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/libkmod/libkmod-index.c#L308-L334"}]},
{"id":"MEM_3","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"very_easy","description":"In `kmod_module_new()` `m->ctx = kmod_ref(ctx)` is taken before `kmod_pool_add_module()`. If the hash insertion fails (ENOMEM) the code does `free(m)` without releasing the context reference, so the ctx refcount is leaked and the context can never be destroyed.","fix":"Before:\n```\nif (err < 0) {\n\tfree(m);\n\treturn err;\n}\n```\nAfter:\n```\nif (err < 0) {\n\tkmod_unref(m->ctx);\n\tfree(m);\n\treturn err;\n}\n```","locations":[{"ref":"libkmod/libkmod-module.c:264-281","code":"  264 | \tm->ctx = kmod_ref(ctx);\n  265 | \tm->name = (char *)m + sizeof(*m);\n  266 | \tmemcpy(m->name, key, keylen + 1);\n  267 | \tif (alias == NULL) {\n  268 | \t\tm->hashkey = m->name;\n  269 | \t\tm->alias = NULL;\n  270 | \t} else {\n  271 | \t\tm->name[namelen] = '\\0';\n  272 | \t\tm->alias = m->name + namelen + 1;\n  273 | \t\tm->hashkey = m->name + keylen + 1;\n  274 | \t\tmemcpy(m->hashkey, key, keylen + 1);\n  275 | \t}\n  276 | \n  277 | \tm->refcount = 1;\n  278 | \terr = kmod_pool_add_module(ctx, m, m->hashkey);\n  279 | \tif (err < 0) {\n  280 | \t\tfree(m);\n  281 | \t\treturn err;","lines":18,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/libkmod/libkmod-module.c#L264-L281"}]},
{"id":"MEM_4","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"very_easy","description":"In `kmod_new()`, when `hash_new()` fails after `kmod_config_new()` succeeded, the `fail` path does not release `ctx->config`, so the config leaks (OOM path only). The `fail` label also calls `free(ctx->modules_by_name)` on a `struct hash *` instead of `hash_free()`. This is harmless today only because the pointer is always NULL there.","fix":"```\nfail:\n-\tfree(ctx->modules_by_name);\n+\thash_free(ctx->modules_by_name);\n+\tif (ctx->config)\n+\t\tkmod_config_free(ctx->config);\n \tfree(ctx->dirname);\n \tfree(ctx);\n```","locations":[{"ref":"libkmod/libkmod.c:250-270","code":"  250 | \t\tconfig_paths = default_config_paths;\n  251 | \terr = kmod_config_new(ctx, &ctx->config, config_paths);\n  252 | \tif (err < 0) {\n  253 | \t\tERR(ctx, \"could not create config\\n\");\n  254 | \t\tgoto fail;\n  255 | \t}\n  256 | \n  257 | \tctx->modules_by_name = hash_new(KMOD_HASH_SIZE, NULL);\n  258 | \tif (ctx->modules_by_name == NULL) {\n  259 | \t\tERR(ctx, \"could not create by-name hash\\n\");\n  260 | \t\tgoto fail;\n  261 | \t}\n  262 | \n  263 | \tINFO(ctx, \"ctx %p created\\n\", ctx);\n  264 | \tDBG(ctx, \"log_priority=%d\\n\", ctx->log_priority);\n  265 | \n  266 | \treturn ctx;\n  267 | \n  268 | fail:\n  269 | \tfree(ctx->modules_by_name);\n  270 | \tfree(ctx->dirname);","lines":21,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/libkmod/libkmod.c#L250-L270"}]},
{"id":"MEM_5","type":"memory_leak","type_label":"Memory Leak","severity":"negligible","difficulty":"easy","description":"`depmod_report_one_cycle()` returns early with `return rc` when `array_append` or `hash_add` fails inside the loop. The `reverse` array, initialised with `array_init` and already holding allocated storage, is leaked. The `out:` label that calls `array_free_array(&reverse)` is bypassed.","fix":"Replace `return rc;` in both branches with `goto out;`.","locations":[{"ref":"tools/depmod.c:1784-1796","code":" 1784 | \tarray_init(&reverse, 3);\n 1785 | \n 1786 | \tsz = 0;\n 1787 | \tfor (v = vertex->parent, n = 0; v != NULL; v = v->parent, n++) {\n 1788 | \t\tsz += v->mod->modnamesz - 1;\n 1789 | \t\trc = array_append(&reverse, v);\n 1790 | \t\tif (rc < 0)\n 1791 | \t\t\treturn rc;\n 1792 | \t\trc = hash_add(loop_set, v->mod->modname, NULL);\n 1793 | \t\tif (rc != 0)\n 1794 | \t\t\treturn rc;\n 1795 | \t\t/* the hash will be freed where created */\n 1796 | \t}","lines":13,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/tools/depmod.c#L1784-L1796"},{"ref":"tools/depmod.c:1823-1826","code":" 1823 | out:\n 1824 | \tarray_free_array(&reverse);\n 1825 | \n 1826 | \treturn rc;","lines":4,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/tools/depmod.c#L1823-L1826"}]},
{"id":"MEM_6","type":"memory_leak","type_label":"Memory Leak","severity":"negligible","difficulty":"easy","description":"In `do_depmod()`, failures of `depmod_load_symvers()` and `depmod_load_system_map()` jump to `cmdline_failed`. At that point `depmod_init()` has succeeded and `ctx` was set to NULL because it is owned by `depmod`. `depmod_shutdown()` is skipped, leaking the hashes and the kmod context.","fix":"Use `goto cmdline_modules_failed;` for these two error paths, so `depmod_shutdown()` runs.","locations":[{"ref":"tools/depmod.c:3047-3058","code":" 3047 | \tif (module_symvers != NULL) {\n 3048 | \t\terr = depmod_load_symvers(&depmod, module_symvers);\n 3049 | \t\tif (err < 0) {\n 3050 | \t\t\tCRIT(\"could not load %s: %s\\n\", module_symvers, strerror(-err));\n 3051 | \t\t\tgoto cmdline_failed;\n 3052 | \t\t}\n 3053 | \t} else if (system_map != NULL) {\n 3054 | \t\terr = depmod_load_system_map(&depmod, system_map);\n 3055 | \t\tif (err < 0) {\n 3056 | \t\t\tCRIT(\"could not load %s: %s\\n\", system_map, strerror(-err));\n 3057 | \t\t\tgoto cmdline_failed;\n 3058 | \t\t}","lines":12,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/tools/depmod.c#L3047-L3058"},{"ref":"tools/depmod.c:3122-3129","code":" 3122 | cmdline_modules_failed:\n 3123 | \tdepmod_shutdown(&depmod);\n 3124 | depmod_init_failed:\n 3125 | \tif (ctx != NULL)\n 3126 | \t\tkmod_unref(ctx);\n 3127 | cmdline_failed:\n 3128 | \tcfg_free(&cfg);\n 3129 | \treturn EXIT_FAILURE;","lines":8,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/tools/depmod.c#L3122-L3129"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`index_read()` accepts any `first <= last` read from the file (up to 255), unlike `index_mm_read_node()` which rejects `last >= INDEX_CHILDMAX`. The loops `for (uint8_t ch = node->first; ch <= node->last; ch++)` in `index_dump_node()` and `index_searchwild__all()` never terminate when `node->last == 255`, since a `uint8_t` is always `<= 255`; the counter wraps and the function loops forever (re-reading nodes and growing the strbuf). A corrupt `modules.*.bin` read via the non-mmap `index_file` path triggers an infinite loop.","fix":"In `index_read()` reject `last >= INDEX_CHILDMAX` (same as the mm reader), or use an `unsigned int ch` loop variable and cast to `uint8_t` when calling `index_readchild()`.","locations":[{"ref":"libkmod/libkmod-index.c:280-298","code":"  280 | \tif (offset & INDEX_NODE_CHILDS) {\n  281 | \t\tint first = read_char(fp);\n  282 | \t\tint last = read_char(fp);\n  283 | \n  284 | \t\tif (first == EOF || last == EOF || first > last)\n  285 | \t\t\tgoto err;\n  286 | \n  287 | \t\tchild_count = last - first + 1;\n  288 | \n  289 | \t\tnode = malloc(sizeof(struct index_node_f) +\n  290 | \t\t\t      sizeof(uint32_t) * child_count);\n  291 | \t\tif (node == NULL)\n  292 | \t\t\tgoto err;\n  293 | \n  294 | \t\tnode->first = (uint8_t)first;\n  295 | \t\tnode->last = (uint8_t)last;\n  296 | \n  297 | \t\tif (!read_u32s(fp, node->children, child_count))\n  298 | \t\t\tgoto err;","lines":19,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/libkmod/libkmod-index.c#L280-L298"},{"ref":"libkmod/libkmod-index.c:414-424","code":"  414 | \tfor (uint8_t ch = node->first; ch <= node->last; ch++) {\n  415 | \t\tstruct index_node_f *child = index_readchild(node, ch);\n  416 | \n  417 | \t\tif (!child)\n  418 | \t\t\tcontinue;\n  419 | \n  420 | \t\tif (strbuf_pushchar(buf, ch)) {\n  421 | \t\t\tindex_dump_node(child, buf, wbuf);\n  422 | \t\t\tstrbuf_popchar(buf);\n  423 | \t\t}\n  424 | \t}","lines":11,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/libkmod/libkmod-index.c#L414-L424"},{"ref":"libkmod/libkmod-index.c:523-533","code":"  523 | \tfor (uint8_t ch = node->first; ch <= node->last; ch++) {\n  524 | \t\tstruct index_node_f *child = index_readchild(node, ch);\n  525 | \n  526 | \t\tif (!child)\n  527 | \t\t\tcontinue;\n  528 | \n  529 | \t\tif (strbuf_pushchar(buf, ch)) {\n  530 | \t\t\tindex_searchwild__all(child, 0, buf, subkey, out);\n  531 | \t\t\tstrbuf_popchar(buf);\n  532 | \t\t}\n  533 | \t}","lines":11,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/libkmod/libkmod-index.c#L523-L533"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`softdep_to_char()` joins the `pre:` and `post:` parts without a separator. After the pre block, `itr` points at the copied NUL terminator, and the next `memcpy(itr, \"post: \", ...)` overwrites that NUL. A softdep with both lists is therefore rendered as `pre: a bpost: c`. The buffer is sized with no slot for a separating space. This string is returned by `kmod_config_iter_get_value()` for softdeps (used by `modprobe -c` and similar callers).","fix":"Add 1 to `sz` when both lists are present, and after the pre loop write a space at `itr` before copying `post: `: `*itr++ = ' ';`","locations":[{"ref":"libkmod/libkmod-config.c:541-593","code":"  541 | \tif (dep->n_pre > 0) {\n  542 | \t\tstart = dep->pre[0];\n  543 | \t\tend = dep->pre[dep->n_pre - 1] + strlen(dep->pre[dep->n_pre - 1]);\n  544 | \t\tsz_pre = end - start;\n  545 | \t\tsz += sz_pre + strlen(\"pre: \");\n  546 | \t} else\n  547 | \t\tsz_pre = 0;\n  548 | \n  549 | \tif (dep->n_post > 0) {\n  550 | \t\tstart = dep->post[0];\n  551 | \t\tend = dep->post[dep->n_post - 1] + strlen(dep->post[dep->n_post - 1]);\n  552 | \t\tsz_post = end - start;\n  553 | \t\tsz += sz_post + strlen(\"post: \");\n  554 | \t} else\n  555 | \t\tsz_post = 0;\n  556 | \n  557 | \titr = s = malloc(sz);\n  558 | \tif (s == NULL)\n  559 | \t\treturn NULL;\n  560 | \n  561 | \tif (sz_pre) {\n  562 | \t\tchar *p;\n  563 | \n  564 | \t\tmemcpy(itr, \"pre: \", strlen(\"pre: \"));\n  565 | \t\titr += strlen(\"pre: \");\n  566 | \n  567 | \t\t/* include last '\\0' */\n  568 | \t\tmemcpy(itr, dep->pre[0], sz_pre + 1);\n  569 | \t\tfor (p = itr; p < itr + sz_pre; p++) {\n  570 | \t\t\tif (*p == '\\0')\n  571 | \t\t\t\t*p = ' ';\n  572 | \t\t}\n  573 | \t\titr = p;\n  574 | \t}\n  575 | \n  576 | \tif (sz_post) {\n  577 | \t\tchar *p;\n  578 | \n  579 | \t\tmemcpy(itr, \"post: \", strlen(\"post: \"));\n  580 | \t\titr += strlen(\"post: \");\n  581 | \n  582 | \t\t/* include last '\\0' */\n  583 | \t\tmemcpy(itr, dep->post[0], sz_post + 1);\n  584 | \t\tfor (p = itr; p < itr + sz_post; p++) {\n  585 | \t\t\tif (*p == '\\0')\n  586 | \t\t\t\t*p = ' ';\n  587 | \t\t}\n  588 | \t\titr = p;\n  589 | \t}\n  590 | \n  591 | \t*itr = '\\0';\n  592 | \n  593 | \treturn s;","lines":53,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/libkmod/libkmod-config.c#L541-L593"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`kmod_elf_get_build_id()` does not validate `namesz`. `name` is compared with `streq(name, \"GNU\")` without confirming `namesz == 4`, so the read can run past the note when `namesz < 4`. `3 * sizeof(uint32_t) + namesz + descsz` can also wrap on 32-bit `size_t`, because both values come from the file. `off += namesz` gives the hash offset without any alignment handling.","fix":"Require `namesz == sizeof(\"GNU\")` before the `streq`, and do the size check in `uint64_t` (`(uint64_t)namesz + descsz + 12 > size`).","locations":[{"ref":"libkmod/libkmod-elf.c:1285-1307","code":" 1285 | \tnamesz = elf_get_u32(elf, off);\n 1286 | \toff += sizeof(uint32_t);\n 1287 | \tdescsz = elf_get_u32(elf, off);\n 1288 | \toff += sizeof(uint32_t);\n 1289 | \ttype = elf_get_u32(elf, off);\n 1290 | \toff += sizeof(uint32_t);\n 1291 | \n 1292 | \tif (size < 3 * sizeof(uint32_t) + namesz + descsz) {\n 1293 | \t\tELFDBG(elf, \"build-id section is too small: %\" PRIu64 \"\\n\", size);\n 1294 | \t\treturn -EINVAL;\n 1295 | \t}\n 1296 | \n 1297 | \tname = elf_get_mem(elf, off);\n 1298 | \n 1299 | \tif (type != NT_GNU_BUILD_ID || !streq(name, \"GNU\")) {\n 1300 | \t\tELFDBG(elf, \"Invalid build-id section: type %\" PRIu32 \", name %.3s\\n\",\n 1301 | \t\t       type, name);\n 1302 | \t\treturn -EINVAL;\n 1303 | \t}\n 1304 | \n 1305 | \toff += namesz;\n 1306 | \t*hash = elf_get_mem(elf, off);\n 1307 | \t*hash_len = descsz;","lines":23,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/libkmod/libkmod-elf.c#L1285-L1307"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`kmod_list_remove_data()` returns `node->next` of the removed element as the new list head. When the removed element is not the head, the head moves to the removed element's successor and the list is silently rotated, so iteration order changes (elements before the removed one now come last). Its only in-tree user (`depmod_list_remove_data()` on `roots`) assigns the result back, so order of roots changes. Existing test `test_list_remove_data` only checks length and absence, not order or head.","fix":"Return `list` unchanged when `itr != list` (only return the successor when the head itself is removed), and extend `test_list_remove_data` to assert order is preserved.","locations":[{"ref":"libkmod/libkmod-list.c:179-199","code":"  179 | struct kmod_list *kmod_list_remove_data(struct kmod_list *list, const void *data)\n  180 | {\n  181 | \tstruct kmod_list *itr;\n  182 | \tstruct list_node *node;\n  183 | \n  184 | \tfor (itr = list; itr != NULL; itr = kmod_list_next(list, itr)) {\n  185 | \t\tif (itr->data == data)\n  186 | \t\t\tbreak;\n  187 | \t}\n  188 | \n  189 | \tif (itr == NULL)\n  190 | \t\treturn list;\n  191 | \n  192 | \tnode = list_node_remove(&itr->node);\n  193 | \tfree(itr);\n  194 | \n  195 | \tif (node == NULL)\n  196 | \t\treturn NULL;\n  197 | \n  198 | \treturn container_of(node, struct kmod_list, node);\n  199 | }","lines":21,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/libkmod/libkmod-list.c#L179-L199"},{"ref":"libkmod/libkmod-list.c:32-41","code":"   32 | static inline struct list_node *list_node_remove(struct list_node *node)\n   33 | {\n   34 | \tif (node->prev == node || node->next == node)\n   35 | \t\treturn NULL;\n   36 | \n   37 | \tnode->prev->next = node->next;\n   38 | \tnode->next->prev = node->prev;\n   39 | \n   40 | \treturn node->next;\n   41 | }","lines":10,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/libkmod/libkmod-list.c#L32-L41"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`module_do_install_commands()` expands `$CMDLINE_OPTS` with `while ((p = strstr(cmd, \"$CMDLINE_OPTS\")) != NULL)` always rescanning from the start of the already-substituted string. If `options` itself contains the text `$CMDLINE_OPTS` (e.g. `options foo $CMDLINE_OPTS` in config or user-supplied extra options), the substitution re-matches its own output and loops forever, growing the buffer until OOM.","fix":"Continue the search after the inserted text: keep a `search_from` offset (`prefixlen + options_len`) and call `strstr(cmd + search_from, ...)` instead of `strstr(cmd, ...)`.","locations":[{"ref":"libkmod/libkmod-module.c:861-878","code":"  861 | \twhile ((p = strstr(cmd, \"$CMDLINE_OPTS\")) != NULL) {\n  862 | \t\tsize_t prefixlen = p - cmd;\n  863 | \t\tsize_t suffixlen = cmdlen - prefixlen - varlen;\n  864 | \t\tsize_t slen = cmdlen - varlen + options_len;\n  865 | \t\tchar *suffix = p + varlen;\n  866 | \t\t_clang_suppress_alloc_ char *s = malloc(slen + 1);\n  867 | \t\tif (!s)\n  868 | \t\t\treturn -ENOMEM;\n  869 | \n  870 | \t\tmemcpy(s, cmd, p - cmd);\n  871 | \t\tmemcpy(s + prefixlen, options, options_len);\n  872 | \t\tmemcpy(s + prefixlen + options_len, suffix, suffixlen);\n  873 | \t\ts[slen] = '\\0';\n  874 | \n  875 | \t\tfree(cmd);\n  876 | \t\tcmd = s;\n  877 | \t\tcmdlen = slen;\n  878 | \t}","lines":18,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/libkmod/libkmod-module.c#L861-L878"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`x509_name_to_str()` never returns NULL when no commonName entry exists. `nid` holds the NID of the last iterated entry, so `nid == -1` is only true for an empty name. For an issuer without a CN, the data of the last RDN entry is returned and reported as the signer, instead of leaving the signer empty.","fix":"Check the loop result instead of `nid`:\n```\n-\tint nid = -1;\n...\n-\tfor (i = 0; i < sym_X509_NAME_entry_count(name); i++) {\n+\tfor (i = 0; i < sym_X509_NAME_entry_count(name); i++) {\n \t\te = ...;\n \t\tnid = sym_OBJ_obj2nid(o);\n \t\tif (nid == NID_commonName)\n \t\t\tbreak;\n \t}\n-\tif (nid == -1)\n+\tif (nid != NID_commonName)\n \t\treturn NULL;\n```","locations":[{"ref":"libkmod/libkmod-signature-openssl.c:64-84","code":"   64 | static const char *x509_name_to_str(X509_NAME *name)\n   65 | {\n   66 | \tint i;\n   67 | \tX509_NAME_ENTRY *e;\n   68 | \tASN1_STRING *d;\n   69 | \tASN1_OBJECT *o;\n   70 | \tint nid = -1;\n   71 | \tconst char *str;\n   72 | \n   73 | \tfor (i = 0; i < sym_X509_NAME_entry_count(name); i++) {\n   74 | \t\te = sym_X509_NAME_get_entry(name, i);\n   75 | \t\to = sym_X509_NAME_ENTRY_get_object(e);\n   76 | \t\tnid = sym_OBJ_obj2nid(o);\n   77 | \t\tif (nid == NID_commonName)\n   78 | \t\t\tbreak;\n   79 | \t}\n   80 | \tif (nid == -1)\n   81 | \t\treturn NULL;\n   82 | \n   83 | \td = sym_X509_NAME_ENTRY_get_data(e);\n   84 | \tstr = (const char *)sym_ASN1_STRING_get0_data(d);","lines":21,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/libkmod/libkmod-signature-openssl.c#L64-L84"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`strbuf_pushmem()` returns 0 both for failure (allocation failure or overflow) and for the successful no-op `sz == 0`. `strbuf_pushchars()` forwards this, and `tools/delete_module.c` uses `!strbuf_pushchars(...)` as the error test. Pushing an empty string is therefore reported as an allocation failure, and callers that ignore the result cannot tell a failed push from an empty one.","fix":"Make the empty-push case unambiguous, for example return `bool` (true on success, including `sz == 0`), or return `(size_t)-1` on failure. Then update the callers in `testsuite/delete_module.c` and `tools/modinfo.c`.","locations":[{"ref":"shared/strbuf.c:84-100","code":"   84 | size_t strbuf_pushmem(struct strbuf *buf, const char *src, size_t sz)\n   85 | {\n   86 | \tassert(src != NULL);\n   87 | \tassert(buf != NULL);\n   88 | \n   89 | \tif (sz == 0)\n   90 | \t\treturn 0;\n   91 | \n   92 | \tif (!strbuf_reserve_extra(buf, sz))\n   93 | \t\treturn 0;\n   94 | \n   95 | \tmemcpy(buf->bytes + buf->used, src, sz);\n   96 | \tbuf->used += sz;\n   97 | \n   98 | \treturn sz;\n   99 | }\n  100 | ","lines":17,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/shared/strbuf.c#L84-L100"},{"ref":"shared/strbuf.h:63-67","code":"   63 | bool strbuf_pushchar(struct strbuf *buf, char ch);\n   64 | size_t strbuf_pushmem(struct strbuf *buf, const char *src, size_t sz);\n   65 | static inline size_t strbuf_pushchars(struct strbuf *buf, const char *str)\n   66 | {\n   67 | \treturn strbuf_pushmem(buf, str, strlen(str));","lines":5,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/shared/strbuf.h#L63-L67"},{"ref":"libkmod/libkmod-builtin.c:100-104","code":"  100 | \t\tif (!strbuf_pushchars(buf, dot + 1) || !strbuf_pushchar(buf, '\\0')) {\n  101 | \t\t\tcount = -ENOMEM;\n  102 | \t\t\tERR(info->ctx, \"failed to append modinfo string\\n\");\n  103 | \t\t\treturn count;\n  104 | \t\t}","lines":5,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/libkmod/libkmod-builtin.c#L100-L104"},{"ref":"testsuite/delete_module.c:195-198","code":"  195 | \tif (!strbuf_pushchars(&buf, \"/sys/module/\") || !strbuf_pushchars(&buf, modname)) {\n  196 | \t\terrno = ENOMEM;\n  197 | \t\treturn -1;\n  198 | \t}","lines":4,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/testsuite/delete_module.c#L195-L198"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`depmod_module_add()` sets `mod->sort_idx = depmod->modules.count + 1`, but `depmod->modules` is only populated later by `depmod_modules_build_array()`. During discovery `count` is therefore always 0, so every module gets `sort_idx == 1`. The intended insertion-order tiebreak is lost, and modules not listed in `modules.order` are ordered by the unstable `qsort` over hash iteration order. This is the observable sort behaviour: `depmod_modules_sort()` also returns early without sorting if `modules.order` is missing or corrupted.","fix":"Use a monotonically increasing counter on `struct depmod` (for example `depmod->n_added++`) for `sort_idx`, and always run the sort even if `modules.order` is absent.","locations":[{"ref":"tools/depmod.c:1097","code":" 1097 | \tmod->sort_idx = depmod->modules.count + 1;","lines":1,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/tools/depmod.c#L1097"},{"ref":"tools/depmod.c:1456-1481","code":" 1456 | \n 1457 | static int mod_cmp(const void *pa, const void *pb)\n 1458 | {\n 1459 | \tconst struct mod *a = *(const struct mod **)pa;\n 1460 | \tconst struct mod *b = *(const struct mod **)pb;\n 1461 | \treturn a->sort_idx - b->sort_idx;\n 1462 | }\n 1463 | \n 1464 | static int depmod_modules_build_array(struct depmod *depmod)\n 1465 | {\n 1466 | \tstruct hash_iter module_iter;\n 1467 | \tconst void *v;\n 1468 | \tint err;\n 1469 | \n 1470 | \thash_iter_init(depmod->modules_by_name, &module_iter);\n 1471 | \twhile (hash_iter_next(&module_iter, NULL, &v)) {\n 1472 | \t\tstruct mod *mod = (struct mod *)v;\n 1473 | \t\tmod->idx = depmod->modules.count;\n 1474 | \t\terr = array_append(&depmod->modules, mod);\n 1475 | \t\tif (err < 0)\n 1476 | \t\t\treturn err;\n 1477 | \t}\n 1478 | \tif (depmod->modules.count >= UINT16_MAX)\n 1479 | \t\treturn -ERANGE;\n 1480 | \n 1481 | \treturn 0;","lines":26,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/tools/depmod.c#L1456-L1481"},{"ref":"tools/depmod.c:1510-1551","code":" 1510 | static void depmod_modules_sort(struct depmod *depmod)\n 1511 | {\n 1512 | \tchar line[PATH_MAX];\n 1513 | \tconst char *order_file = \"modules.order\";\n 1514 | \tFILE *fp;\n 1515 | \tsize_t idx = 0;\n 1516 | \t// all sorted modules shall have precedence\n 1517 | \tint i = -(int)depmod->modules.count;\n 1518 | \n 1519 | \tfp = dfdopen(depmod->cfg->dirname, order_file, O_RDONLY, \"r\");\n 1520 | \tif (fp == NULL)\n 1521 | \t\treturn;\n 1522 | \n 1523 | \twhile (fgets(line, sizeof(line), fp) != NULL) {\n 1524 | \t\tstruct mod *mod;\n 1525 | \t\tsize_t len = strlen(line);\n 1526 | \t\tidx++;\n 1527 | \t\tif (len == 0)\n 1528 | \t\t\tcontinue;\n 1529 | \t\tif (line[len - 1] != '\\n') {\n 1530 | \t\t\tERR(\"%s/%s:%zu corrupted line misses '\\\\n'\\n\",\n 1531 | \t\t\t    depmod->cfg->dirname, order_file, idx);\n 1532 | \t\t\tgoto corrupted;\n 1533 | \t\t}\n 1534 | \t\tline[len - 1] = '\\0';\n 1535 | \t\tmod = hash_find(depmod->modules_by_uncrelpath, line);\n 1536 | \t\tif (mod == NULL || mod->sort_idx < 0)\n 1537 | \t\t\tcontinue;\n 1538 | \t\tmod->sort_idx = i++;\n 1539 | \t}\n 1540 | \n 1541 | \tif (depmod->modules.count > 1) {\n 1542 | \t\tarray_sort(&depmod->modules, mod_cmp);\n 1543 | \t\tfor (idx = 0; idx < depmod->modules.count; idx++) {\n 1544 | \t\t\tstruct mod *m = depmod->modules.array[idx];\n 1545 | \t\t\tm->idx = idx;\n 1546 | \t\t}\n 1547 | \t}\n 1548 | \n 1549 | corrupted:\n 1550 | \tfclose(fp);\n 1551 | }","lines":42,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/tools/depmod.c#L1510-L1551"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`flush_stream_to()` reads a character before testing `i < dst_sz`. When the buffer fills, the consumed character is dropped and the function returns 0, unless that character happens to equal `endchar`. In that exact-fit case, the length is wrongly decremented and a spurious truncation warning is printed. The rest of the overlong token is not discarded, so the parser in `output_builtin_alias_bin()` desynchronises and interprets the tail of one token as the next field. `flush_stream()` has a dead `size_t i = 0` that makes it always return 0.","fix":"Test `i < dst_sz - 1` before storing, discard the rest of the token up to `endchar` or `'\\0'` on overflow, and return a distinct truncated result. Remove the unused `i` in `flush_stream()` or make it return a meaningful value.","locations":[{"ref":"tools/depmod.c:2412-2439","code":" 2412 | static int flush_stream(FILE *in, int endchar)\n 2413 | {\n 2414 | \tsize_t i = 0;\n 2415 | \tint c;\n 2416 | \n 2417 | \tfor (c = fgetc(in); c != EOF && c != endchar && c != '\\0'; c = fgetc(in))\n 2418 | \t\t;\n 2419 | \n 2420 | \treturn c == endchar ? i : 0;\n 2421 | }\n 2422 | \n 2423 | static int flush_stream_to(FILE *in, int endchar, char *dst, size_t dst_sz)\n 2424 | {\n 2425 | \tsize_t i = 0;\n 2426 | \tint c;\n 2427 | \n 2428 | \tfor (c = fgetc(in); c != EOF && c != endchar && c != '\\0' && i < dst_sz;\n 2429 | \t     c = fgetc(in))\n 2430 | \t\tdst[i++] = c;\n 2431 | \n 2432 | \tif (i == dst_sz) {\n 2433 | \t\tWRN(\"Could not flush stream: %d. Partial content: %.*s\\n\", ENOSPC,\n 2434 | \t\t    (int)dst_sz, dst);\n 2435 | \t\ti--;\n 2436 | \t}\n 2437 | \n 2438 | \treturn c == endchar ? i : 0;\n 2439 | }","lines":28,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/tools/depmod.c#L2412-L2439"},{"ref":"tools/depmod.c:2463-2482","code":" 2463 | \t\tchar modname[PATH_MAX];\n 2464 | \t\tchar value[PATH_MAX];\n 2465 | \t\tsize_t len;\n 2466 | \n 2467 | \t\tlen = flush_stream_to(in, '.', modname, sizeof(modname));\n 2468 | \t\tmodname[len] = '\\0';\n 2469 | \t\tif (!len)\n 2470 | \t\t\tcontinue;\n 2471 | \n 2472 | \t\tlen = flush_stream_to(in, '=', value, sizeof(value));\n 2473 | \t\tvalue[len] = '\\0';\n 2474 | \t\tif (!streq(value, \"alias\")) {\n 2475 | \t\t\tflush_stream(in, '\\0');\n 2476 | \t\t\tcontinue;\n 2477 | \t\t}\n 2478 | \n 2479 | \t\tlen = flush_stream_to(in, '\\0', value, sizeof(value));\n 2480 | \t\tvalue[len] = '\\0';\n 2481 | \t\tif (!len)\n 2482 | \t\t\tcontinue;","lines":20,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/tools/depmod.c#L2463-L2482"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `depmod_output()`, `tmpfile_publish()` is called before `ferr` (write or close error) is checked. A truncated index is therefore atomically published over the previous good file, and only then reported as an error. The temporary file should be released instead of published when `ferr` is set.","fix":"Check `ferr` right after `fclose` and call `tmpfile_release(&file)` instead of `tmpfile_publish()` when it is set. Only publish when both `r >= 0` and `!ferr`.","locations":[{"ref":"tools/depmod.c:2614-2637","code":" 2614 | \n 2615 | \t\tferr = ferror(fp) | fclose(fp);\n 2616 | \n 2617 | \t\tif (r < 0) {\n 2618 | \t\t\ttmpfile_release(&file);\n 2619 | \n 2620 | \t\t\tERR(\"Could not write index '%s': %s\\n\", itr->name, strerror(-r));\n 2621 | \t\t\terr = r;\n 2622 | \t\t\tbreak;\n 2623 | \t\t}\n 2624 | \n 2625 | \t\terr = tmpfile_publish(&file, itr->name);\n 2626 | \t\tif (err != 0) {\n 2627 | \t\t\tCRIT(\"publish temporary from %s to %s\\n\", file.tmpname, itr->name);\n 2628 | \t\t\tbreak;\n 2629 | \t\t}\n 2630 | \n 2631 | \t\tif (ferr) {\n 2632 | \t\t\terr = -ENOSPC;\n 2633 | \t\t\tERR(\"Could not create index '%s'. Output is truncated: %s\\n\",\n 2634 | \t\t\t    itr->name, strerror(-err));\n 2635 | \t\t\tbreak;\n 2636 | \t\t}\n 2637 | \t}","lines":24,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/tools/depmod.c#L2614-L2637"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`prepend_options_from_env()` emits a spurious empty-string argument after every quoted token that is followed by a space. After the closing quote of a token that starts with a quote (`quote == str`), `str` is set to `s + 1`, which is the following space. The next iteration then sees `*s == ' '` and stores `new_argv[i] = str`, which is `\"\"`. With `MODPROBE_OPTIONS='-C \"/a b\" -v'` the resulting argv is `-C`, `/a b`, `\"\"`, `-v`, `x` (reproduced with an extracted copy of the function). getopt treats `\"\"` as a non-option, so it becomes a module name and `modprobe x` is run with an extra empty module argument. Consecutive spaces in the variable also produce empty arguments.","fix":"After closing a quoted token, skip the separator space that follows (for example `if (s[1] == ' ') s++;` after `str = s + 1`). Also skip tokens where `s == str` when `*s == ' '`, so repeated spaces do not create empty arguments.","locations":[{"ref":"tools/modprobe.c:749-783","code":"  749 | \tquote = NULL;\n  750 | \tfor (i = 1, s = str; *s != '\\0'; s++) {\n  751 | \t\tif (quote == NULL) {\n  752 | \t\t\tif (*s == ' ') {\n  753 | \t\t\t\tnew_argv[i] = str;\n  754 | \t\t\t\ti++;\n  755 | \t\t\t\t*s = '\\0';\n  756 | \t\t\t\tstr = s + 1;\n  757 | \t\t\t} else if (*s == '\"' || *s == '\\'')\n  758 | \t\t\t\tquote = s;\n  759 | \t\t} else {\n  760 | \t\t\tif (*s == *quote) {\n  761 | \t\t\t\tif (quote == str) {\n  762 | \t\t\t\t\tnew_argv[i] = str + 1;\n  763 | \t\t\t\t\ti++;\n  764 | \t\t\t\t\t*s = '\\0';\n  765 | \t\t\t\t\tstr = s + 1;\n  766 | \t\t\t\t} else {\n  767 | \t\t\t\t\tchar *it;\n  768 | \t\t\t\t\tfor (it = quote; it < s - 1; it++)\n  769 | \t\t\t\t\t\tit[0] = it[1];\n  770 | \t\t\t\t\tfor (it = s - 1; it < str_end - 2; it++)\n  771 | \t\t\t\t\t\tit[0] = it[2];\n  772 | \t\t\t\t\tstr_end -= 2;\n  773 | \t\t\t\t\t*str_end = '\\0';\n  774 | \t\t\t\t\ts -= 2;\n  775 | \t\t\t\t}\n  776 | \t\t\t\tquote = NULL;\n  777 | \t\t\t}\n  778 | \t\t}\n  779 | \t}\n  780 | \tif (str < s) {\n  781 | \t\tnew_argv[i] = str;\n  782 | \t\ti++;\n  783 | \t}","lines":35,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/tools/modprobe.c#L749-L783"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"In `output_deps_bin()`, the `continue` after a failed `strbuf_pushchar` or `strbuf_pushchars` inside the inner `for (j...)` loop only skips one dependency. The module's truncated, incomplete dependency line is still inserted into the index. The error message implies the module is skipped.","fix":"On failure set a flag and `break`, then skip `index_insert()` for that module (or use `goto next_module`).","locations":[{"ref":"tools/depmod.c:2180-2192","code":" 2180 | \n 2181 | \t\tfor (j = 0; j < array.count; j++) {\n 2182 | \t\t\tconst struct mod *d = array.array[j];\n 2183 | \t\t\tconst char *dp = mod_get_compressed_path(d);\n 2184 | \n 2185 | \t\t\tif (!strbuf_pushchar(&sbuf, ' ') || !strbuf_pushchars(&sbuf, dp)) {\n 2186 | \t\t\t\tERR(\"could not write dependencies of %s\\n\", p);\n 2187 | \t\t\t\tcontinue;\n 2188 | \t\t\t}\n 2189 | \t\t}\n 2190 | \t\tline = strbuf_str(&sbuf);\n 2191 | \n 2192 | \t\tduplicate = index_insert(idx, mod->modname, line, mod->idx);","lines":13,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/tools/depmod.c#L2180-L2192"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"In `do_modprobe()`, `-w` is parsed with `strtoul`, which accepts a leading `-` and wraps (`-w -1` gives `ULONG_MAX`) without setting `errno`. `wait_msec` is then used in `tend_msec = now_msec() + wait_msec`, which can wrap and make the deadline already expired, so the wait is skipped. The only guard is the `ERANGE` check.","fix":"Reject values starting with `-` and clamp `wait_msec` so that `now_msec() + wait_msec` cannot overflow.","locations":[{"ref":"tools/modprobe.c:834-844","code":"  834 | \t\tcase 'w': {\n  835 | \t\t\tchar *endptr = NULL;\n  836 | \t\t\terrno = 0;\n  837 | \t\t\twait_msec = strtoul(optarg, &endptr, 0);\n  838 | \t\t\tif (!*optarg || *endptr || errno == ERANGE) {\n  839 | \t\t\t\tERR(\"unexpected wait value '%s'.\\n\", optarg);\n  840 | \t\t\t\terr = -1;\n  841 | \t\t\t\tgoto done;\n  842 | \t\t\t}\n  843 | \t\t\tbreak;\n  844 | \t\t}","lines":11,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/tools/modprobe.c#L834-L844"},{"ref":"tools/modprobe.c:394-397","code":"  394 | \t\t\tif (!tend_msec) {\n  395 | \t\t\t\ttend_msec = now_msec() + wait_msec;\n  396 | \t\t\t\tinterval_msec = 1;\n  397 | \t\t\t}","lines":4,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/tools/modprobe.c#L394-L397"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"In `depmod_output()`, when `tmpfile_openat()` fails, the code logs an error and does `continue` without setting `err`. If every file fails, or only some do, the function still returns 0 and `do_depmod()` exits with `EXIT_SUCCESS` even though some `modules.*` files were not written or updated.","fix":"Set `err = -errno;` (saved right after the failed call) before `continue`, or `break` out of the loop, so the failure is propagated to the exit status.","locations":[{"ref":"tools/depmod.c:2601-2609","code":" 2601 | \t\tif (fp == NULL) {\n 2602 | \t\t\tmode_t mode = 0644;\n 2603 | \n 2604 | \t\t\tfp = tmpfile_openat(dfd, mode, &file);\n 2605 | \t\t\tif (fp == NULL) {\n 2606 | \t\t\t\tERR(\"Could not create temporary file at '%s'\\n\", dname);\n 2607 | \t\t\t\tcontinue;\n 2608 | \t\t\t}\n 2609 | \t\t}","lines":9,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/tools/depmod.c#L2601-L2609"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `kmod_config_parse()`, the return values of `kmod_config_add_alias/blacklist/options/command/mask/softdep/weakdep` are ignored. An `-ENOMEM` or `-EINVAL` is silently dropped (for example a softdep with too many entries) and the config is loaded incompletely with `kmod_config_new()` still returning 0. `kcmdline_parse_result()` does the same.","fix":"Propagate or at least log a non-zero return from each `kmod_config_add_*` call (for example `err = ...; if (err < 0) ERR(...)`).","locations":[{"ref":"libkmod/libkmod-config.c:830-893","code":"  830 | \t\tif (streq(cmd, \"alias\")) {\n  831 | \t\t\tchar *alias = strtok_r(NULL, \"\\t \", &saveptr);\n  832 | \t\t\tchar *modname = strtok_r(NULL, \"\\t \", &saveptr);\n  833 | \n  834 | \t\t\tif (underscores(alias) < 0 || underscores(modname) < 0)\n  835 | \t\t\t\tgoto syntax_error;\n  836 | \n  837 | \t\t\tkmod_config_add_alias(config, alias, modname);\n  838 | \t\t} else if (streq(cmd, \"blacklist\")) {\n  839 | \t\t\tchar *modname = strtok_r(NULL, \"\\t \", &saveptr);\n  840 | \n  841 | \t\t\tif (underscores(modname) < 0)\n  842 | \t\t\t\tgoto syntax_error;\n  843 | \n  844 | \t\t\tkmod_config_add_blacklist(config, modname);\n  845 | \t\t} else if (streq(cmd, \"options\")) {\n  846 | \t\t\tchar *modname = strtok_r(NULL, \"\\t \", &saveptr);\n  847 | \t\t\tchar *options = strtok_r(NULL, \"\\0\", &saveptr);\n  848 | \n  849 | \t\t\tif (underscores(modname) < 0 || options == NULL)\n  850 | \t\t\t\tgoto syntax_error;\n  851 | \n  852 | \t\t\tkmod_config_add_options(config, modname, options);\n  853 | \t\t} else if (streq(cmd, \"install\")) {\n  854 | \t\t\tchar *modname = strtok_r(NULL, \"\\t \", &saveptr);\n  855 | \t\t\tchar *installcmd = strtok_r(NULL, \"\\0\", &saveptr);\n  856 | \n  857 | \t\t\tif (underscores(modname) < 0 || installcmd == NULL)\n  858 | \t\t\t\tgoto syntax_error;\n  859 | \n  860 | \t\t\tkmod_config_add_command(config, modname, installcmd, cmd,\n  861 | \t\t\t\t\t\t&config->install_commands);\n  862 | \t\t} else if (streq(cmd, \"mask\")) {\n  863 | \t\t\tchar *modname = strtok_r(NULL, \"\\t \", &saveptr);\n  864 | \n  865 | \t\t\tif (underscores(modname) < 0)\n  866 | \t\t\t\tgoto syntax_error;\n  867 | \n  868 | \t\t\tkmod_config_add_mask(config, modname);\n  869 | \t\t} else if (streq(cmd, \"remove\")) {\n  870 | \t\t\tchar *modname = strtok_r(NULL, \"\\t \", &saveptr);\n  871 | \t\t\tchar *removecmd = strtok_r(NULL, \"\\0\", &saveptr);\n  872 | \n  873 | \t\t\tif (underscores(modname) < 0 || removecmd == NULL)\n  874 | \t\t\t\tgoto syntax_error;\n  875 | \n  876 | \t\t\tkmod_config_add_command(config, modname, removecmd, cmd,\n  877 | \t\t\t\t\t\t&config->remove_commands);\n  878 | \t\t} else if (streq(cmd, \"softdep\")) {\n  879 | \t\t\tchar *modname = strtok_r(NULL, \"\\t \", &saveptr);\n  880 | \t\t\tchar *softdeps = strtok_r(NULL, \"\\0\", &saveptr);\n  881 | \n  882 | \t\t\tif (underscores(modname) < 0 || softdeps == NULL)\n  883 | \t\t\t\tgoto syntax_error;\n  884 | \n  885 | \t\t\tkmod_config_add_softdep(config, modname, softdeps);\n  886 | \t\t} else if (streq(cmd, \"weakdep\")) {\n  887 | \t\t\tchar *modname = strtok_r(NULL, \"\\t \", &saveptr);\n  888 | \t\t\tchar *weakdeps = strtok_r(NULL, \"\\0\", &saveptr);\n  889 | \n  890 | \t\t\tif (underscores(modname) < 0 || weakdeps == NULL)\n  891 | \t\t\t\tgoto syntax_error;\n  892 | \n  893 | \t\t\tkmod_config_add_weakdep(config, modname, weakdeps);","lines":64,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/libkmod/libkmod-config.c#L830-L893"},{"ref":"libkmod/libkmod-config.c:646-662","code":"  646 | \t\t\tchar *t = strsep(&value, \",\");\n  647 | \t\t\tif (t == NULL)\n  648 | \t\t\t\tbreak;\n  649 | \n  650 | \t\t\tif (underscores(t) < 0)\n  651 | \t\t\t\tcontinue;\n  652 | \n  653 | \t\t\tif (is_blacklist)\n  654 | \t\t\t\tkmod_config_add_blacklist(config, t);\n  655 | \t\t\telse\n  656 | \t\t\t\tkmod_config_add_mask(config, t);\n  657 | \t\t}\n  658 | \t} else {\n  659 | \t\tif (underscores(modname) < 0) {\n  660 | \t\t\tERR(config->ctx,\n  661 | \t\t\t    \"Ignoring bad option on kernel command line while parsing module name: '%s'\\n\",\n  662 | \t\t\t    modname);","lines":17,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/libkmod/libkmod-config.c#L646-L662"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"The return value of `add_value()` (which returns -1 on `malloc()` failure) is ignored in `index_read()`, `index_searchwild__allvalues()` and `index_mm_searchwild_allvalues()`. On OOM values are silently dropped, so lookups return incomplete results (or a node is returned with missing values) and the failure cannot be distinguished from 'no match'.","fix":"Check the result of `add_value()`; in `index_read()` `goto err`, and in the searchwild helpers propagate an error (or at least log it).","locations":[{"ref":"libkmod/libkmod-index.c:321-325","code":"  321 | \t\t\tn = getdelim(&idx->tmp, &idx->tmp_size, '\\0', fp);\n  322 | \t\t\tif (n < 0)\n  323 | \t\t\t\tgoto err;\n  324 | \t\t\tadd_value(&node->values, idx->tmp, n, priority);\n  325 | \t\t}","lines":5,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/libkmod/libkmod-index.c#L321-L325"},{"ref":"libkmod/libkmod-index.c:504-510","code":"  504 | \tstruct index_value *v;\n  505 | \n  506 | \tfor (v = node->values; v != NULL; v = v->next)\n  507 | \t\tadd_value(out, v->value, v->len, v->priority);\n  508 | \n  509 | \tindex_close(node);\n  510 | }","lines":7,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b231be35c76b7fe/libkmod/libkmod-index.c#L504-L510"},{"ref":"libkmod/libkmod-index.c:960-972","code":"  960 | static void index_mm_searchwild_allvalues(struct index_mm_node *node,\n  961 | \t\t\t\t\t  struct index_value **out)\n  962 | {\n  963 | \tconst void *p;\n  964 | \tsize_t i;\n  965 | \n  966 | \tfor (i = 0, p = node->values; i < node->value_count; i++) {\n  967 | \t\tstruct index_mm_value v;\n  968 | \n  969 | \t\tread_value_mm(&p, &v);\n  970 | \t\tadd_value(out, v.value, v.len, v.priority);\n  971 | \t}\n  972 | }","lines":13,"link":"https://github.com/kmod-project/kmod/blob/692c5a0f731f31c1da49cce12b23
