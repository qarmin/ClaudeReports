<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`wxFTP::GetOutputStream()` never checks the pointers returned by `GetPort()` and `AcceptIfActive()` for `nullptr`, unlike its sibling `GetInputStream()` which guards both. `GetPort()` returns `nullptr` when `GetPassivePort()`/`GetActivePort()` fail, and `AcceptIfActive()` returns `nullptr` in active mode when `WaitForAccept()` times out (it calls `wxDELETE(sock)` and returns the now-null pointer). The resulting `nullptr` is then passed to `new wxOutputFTPStream(this, sock)`, whose base ctor `wxSocketOutputStream(*sock)` dereferences it. In active mode behind a firewall (a common real scenario) this is a straightforward null dereference / crash.","fix":"After `wxSocketBase *sock = GetPort();` add `if ( !sock ) { m_lastError = wxPROTO_NETERR; return nullptr; }`, and after `sock = AcceptIfActive(sock);` add `if ( !sock ) { m_lastError = wxPROTO_CONNERR; return nullptr; }` before setting `m_streaming = true`, mirroring `GetInputStream()`.","locations":[{"ref":"src/common/ftp.cpp:807-822","code":"  807 |     wxSocketBase *sock = GetPort();\n  808 | \n  809 |     wxString tmp_str = wxT(\"STOR \") + path;\n  810 |     if ( !CheckCommand(tmp_str, '1') )\n  811 |     {\n  812 |         delete sock;\n  813 | \n  814 |         return nullptr;\n  815 |     }\n  816 | \n  817 |     sock = AcceptIfActive(sock);\n  818 | \n  819 |     m_streaming = true;\n  820 | \n  821 |     m_lastError = wxPROTO_NOERR;\n  822 |     return new wxOutputFTPStream(this, sock);","lines":16,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/ftp.cpp#L807-L822"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"In `wxIFFDecoder::ReadIFF`, for `ILBM_24BIT` (and `ILBM_HAM8`) images the palette-conversion block at lines 528-565 is skipped because it only runs for `ILBM_NORMAL`/`ILBM_EHB`/`ILBM_HAM`. A genuine 24-bit ILBM normally carries no `CMAP` chunk, so `m_image->pal` is still `nullptr`. At line 574 `byte *pal = m_image->pal;` then aliases that null pointer, and inside the `if (fmt == ILBM_HAM || fmt == ILBM_HAM8 || fmt == ILBM_24BIT)` decode loop the per-line initialization `byte rval = pal[0]; byte gval = pal[1]; byte bval = pal[2];` (lines 591-593) dereferences the null pointer, crashing on a perfectly valid palette-less 24-bit IFF file. `ILBM_HAM8` without a `CMAP` also indexes `pal[3*c+...]` from null.","fix":"Guard the palette access when `pal` may be null, e.g. replace lines 591-593 with `byte rval = pal ? pal[0] : 0; byte gval = pal ? pal[1] : 0; byte bval = pal ? pal[2] : 0;` and similarly guard the `pal[3*c + ...]` reads in the `ILBM_HAM`/`ILBM_HAM8` cases with a `pal &&` check (24-bit does not need a palette at all).","locations":[{"ref":"src/common/imagiff.cpp:574-593","code":"  574 |         byte *pal = m_image->pal;\n  575 |         int lineskip = ((bmhd_width + 15) >> 4) << 1;\n  576 |             int height = chunkLen / (lineskip * bmhd_bitplanes);\n  577 | \n  578 |         if (bmhd_height < height) {\n  579 |             height = bmhd_height;\n  580 |         }\n  581 | \n  582 |         if (fmt == ILBM_HAM || fmt == ILBM_HAM8 || fmt == ILBM_24BIT) {\n  583 |         byte *pic = picptr;\n  584 |         const byte *workptr = bodyptr;\n  585 | \n  586 |         for (int i=0; i < height; i++) {\n  587 |             byte bitmsk = 0x80;\n  588 |             const byte *workptr2 = workptr;\n  589 | \n  590 |             // at start of each line, init RGB values to background\n  591 |             byte rval = pal[0];\n  592 |             byte gval = pal[1];\n  593 |             byte bval = pal[2];","lines":20,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/imagiff.cpp#L574-L593"},{"ref":"src/common/imagiff.cpp:629-633","code":"  629 |                 case 0x00: if (c >= 0 && c < colors) {\n  630 |                         rval = pal[3*c + 0];\n  631 |                         gval = pal[3*c + 1];\n  632 |                         bval = pal[3*c + 2];\n  633 |                     }","lines":5,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/imagiff.cpp#L629-L633"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"In `wxPNMHandler::LoadFile()` the header field `maxval` (type `wxUint16`, read directly from the untrusted file at `text_stream >> maxval`) is never validated to be non-zero, yet it is used as a divisor: `value = (255 * value)/maxval;` in the P2/P3/P5 loops and `ptr[i] = (255 * ptr[i])/maxval;` in the P6 branch. A PNM file declaring a maxval of `0` (or a truncated header where `operator>>` yields `0`) causes an integer division by zero (SIGFPE / crash) on this untrusted input.","fix":"After reading `maxval`, reject invalid values before creating the image, e.g. add:\n```cpp\ntext_stream >> maxval;\nif ( maxval == 0 || maxval > 255 )\n{\n    if (verbose) wxLogError(_(\"PNM: Invalid maximum value.\"));\n    return false;\n}\n```","locations":[{"ref":"src/common/imagpnm.cpp:80-83","code":"   80 |     text_stream >> maxval;\n   81 | \n   82 |     //cout << line << \" \" << width << \" \" << height << \" \" << maxval << endl;\n   83 |     image->Create( width, height );","lines":4,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/imagpnm.cpp#L80-L83"},{"ref":"src/common/imagpnm.cpp:102-103","code":"  102 |             if ( maxval != 255 )\n  103 |                 value = (255 * value)/maxval;","lines":2,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/imagpnm.cpp#L102-L103"},{"ref":"src/common/imagpnm.cpp:166-169","code":"  166 |         if ( maxval != 255 )\n  167 |         {\n  168 |             for ( unsigned i = 0; i < 3*width*height; i++ )\n  169 |                 ptr[i] = (255 * ptr[i])/maxval;","lines":4,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/imagpnm.cpp#L166-L169"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"In `ReadTGA()`, the `alpha` pointer is only allocated (`image->SetAlpha()` / `alpha = image->GetAlpha()`) for MAPPED images when `palettebpp == 16 || palettebpp == 32` (see lines 279-286). However, the 16-bpp indexed decode paths dereference `*(alpha++)` unconditionally, unlike the 8-bpp paths which correctly guard with `if (alpha)`. A crafted TGA that is MAPPED with a 24-bit palette (`palettebpp == 24`, which passes the format check at line 274) and `imageType == 1` (or `9`) with `bpp == 16` reaches `case 16:` where `alpha` is `nullptr`, causing a null-pointer write and crash.","fix":"Guard the alpha write in the 16-bpp indexed cases exactly as the 8-bpp cases do, e.g. change `*(alpha++) = (imageData[index + 1] & 0x80) ? 0 : 255;` to only run `if ( alpha )`, or reject the file as `wxTGA_INVFORMAT` when a 16-bpp indexed image has no alpha-capable palette.","locations":[{"ref":"src/common/imagtga.cpp:445-456","code":"  445 |                 case 16:\n  446 |                 {\n  447 |                     for (unsigned long index = 0; index < imageSize; index += pixelSize)\n  448 |                     {\n  449 |                         Palette_GetRGB(palette.get(), paletteLength,\n  450 |                             imageData[index], &r, &g, &b);\n  451 | \n  452 |                         *(dst++) = r;\n  453 |                         *(dst++) = g;\n  454 |                         *(dst++) = b;\n  455 |                         *(alpha++) = (imageData[index + 1] & 0x80) ? 0 : 255;\n  456 |                     }","lines":12,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/imagtga.cpp#L445-L456"},{"ref":"src/common/imagtga.cpp:656-668","code":"  656 |                 case 16:\n  657 |                 {\n  658 |                     for (unsigned long index = 0; index < imageSize; index += pixelSize)\n  659 |                     {\n  660 |                         Palette_GetRGB(palette.get(), paletteLength,\n  661 |                             imageData[index], &r, &g, &b);\n  662 | \n  663 |                         *(dst++) = r;\n  664 |                         *(dst++) = g;\n  665 |                         *(dst++) = b;\n  666 |                         *(alpha++) = (imageData[index + 1] & 0x80) ? 0 : 255;\n  667 |                     }\n  668 |                 }","lines":13,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/imagtga.cpp#L656-L668"},{"ref":"src/common/imagtga.cpp:302-309","code":"  302 |     unsigned char* alpha = nullptr;\n  303 |     if ((colorType != wxTGA_MAPPED && (bpp == 16 || bpp == 32)) ||\n  304 |         (colorType == wxTGA_MAPPED && (palettebpp == 16 || palettebpp == 32)))\n  305 |     {\n  306 |         image->SetAlpha();\n  307 | \n  308 |         alpha = image->GetAlpha();\n  309 |     }","lines":8,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/imagtga.cpp#L302-L309"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`wxComboEditWndProc` looks up the combobox owning the edit control with `wxWindow *win = wxFindWinFromHandle((WXHWND)hwndCombo);`. When `message` is one of the forwarded messages (`WM_KEYUP`, `WM_SETFOCUS`, `WM_KILLFOCUS`, etc.), the code does `wxComboBox *combo = wxDynamicCast(win, wxComboBox); if ( !combo ) { if ( !win->IsBeingDeleted() ) { wxFAIL_MSG(...); } }`. The comment claims this handles the case where `win` still exists but \"doesn't look like a combobox any longer\", but `win` can in fact be `nullptr`: `wxComboBox::MSWRecreate()` (used e.g. by `wxBitmapComboBox` to force `WM_MEASUREITEM` recalculation, see `src/msw/bmpcbox.cpp:126`) calls `DissociateHandle()` on the combobox HWND (which unregisters the HWND-to-`wxWindow` mapping) and then directly calls `::DestroyWindow(hwnd)`. While the native `DestroyWindow()` is tearing down the child edit control (which still has `wxComboEditWndProc` installed as its window procedure), Windows can send it `WM_KILLFOCUS`/`WM_SETFOCUS` if the edit control currently has the input focus. At that point `wxFindWinFromHandle(hwndCombo)` returns `nullptr` because the mapping was already removed, so `win` is `nullptr` and `win->IsBeingDeleted()` is a null-pointer dereference that crashes the application. Note the `WM_GETDLGCODE` branch just below correctly guards against this with `wxCHECK_MSG( win, 0, ... )`, showing the forwarded-message branch is missing the equivalent check.","fix":"Guard against `win` being `nullptr` before calling `IsBeingDeleted()` on it, mirroring the `WM_GETDLGCODE` branch below:\n\n```cpp\nwxComboBox *combo = wxDynamicCast(win, wxComboBox);\nif ( !combo )\n{\n    // we can get WM_KILLFOCUS while our parent is already half\n    // destroyed (or even fully unregistered, e.g. during\n    // wxComboBox::MSWRecreate()) and hence doesn't look like a\n    // combobox any longer, check for it to avoid bogus assert failures\n    if ( win && !win->IsBeingDeleted() )\n    {\n        wxFAIL_MSG( wxT(\"should have combo as parent\") );\n    }\n}\n```","locations":[{"ref":"src/msw/combobox.cpp:121-158","code":"  121 | LRESULT APIENTRY\n  122 | wxComboEditWndProc(HWND hWnd, UINT message, WPARAM wParam, LPARAM lParam)\n  123 | {\n  124 |     HWND hwndCombo = ::GetParent(hWnd);\n  125 |     wxWindow *win = wxFindWinFromHandle((WXHWND)hwndCombo);\n  126 | \n  127 |     if ( ShouldForwardFromEditToCombo(message) )\n  128 |     {\n  129 |         wxComboBox *combo = wxDynamicCast(win, wxComboBox);\n  130 |         if ( !combo )\n  131 |         {\n  132 |             // we can get WM_KILLFOCUS while our parent is already half\n  133 |             // destroyed and hence doesn't look like a combobx any\n  134 |             // longer, check for it to avoid bogus assert failures\n  135 |             if ( !win->IsBeingDeleted() )\n  136 |             {\n  137 |                 wxFAIL_MSG( wxT(\"should have combo as parent\") );\n  138 |             }\n  139 |         }\n  140 |         else if ( combo->MSWProcessEditMsg(message, wParam, lParam) )\n  141 |         {\n  142 |             // handled by parent\n  143 |             return 0;\n  144 |         }\n  145 |     }\n  146 |     else if ( message == WM_GETDLGCODE )\n  147 |     {\n  148 |         wxCHECK_MSG( win, 0, wxT(\"should have a parent\") );\n  149 | \n  150 |         if ( win->GetWindowStyle() & wxTE_PROCESS_ENTER )\n  151 |         {\n  152 |             // need to return a custom dlg code or we'll never get it\n  153 |             return DLGC_WANTMESSAGE;\n  154 |         }\n  155 |     }\n  156 | \n  157 |     return ::CallWindowProc(CASTWNDPROC gs_wndprocEdit, hWnd, message, wParam, lParam);\n  158 | }","lines":38,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/combobox.cpp#L121-L158"},{"ref":"src/msw/combobox.cpp:440-480","code":"  440 | void wxComboBox::MSWRecreate()\n  441 | {\n  442 |     wxString value = GetValue();\n  443 |     int selection = GetSelection();\n  444 |     wxPoint pos = GetPosition();\n  445 |     wxSize size = GetSize();\n  446 |     size.y = GetBestSize().y;\n  447 |     const wxArrayString strings = GetStrings();\n  448 |     const unsigned numItems = strings.size();\n  449 |     unsigned i;\n  450 | \n  451 |     // Save the client data pointers before clearing the control, if any.\n  452 |     const wxClientDataType clientDataType = GetClientDataType();\n  453 |     wxVector<wxClientData*> objectClientData;\n  454 |     wxVector<void*> voidClientData;\n  455 |     switch ( clientDataType )\n  456 |     {\n  457 |         case wxClientData_None:\n  458 |             break;\n  459 | \n  460 |         case wxClientData_Object:\n  461 |             objectClientData.reserve(numItems);\n  462 |             for ( i = 0; i < numItems; ++i )\n  463 |                 objectClientData.push_back(GetClientObject(i));\n  464 |             break;\n  465 | \n  466 |         case wxClientData_Void:\n  467 |             voidClientData.reserve(numItems);\n  468 |             for ( i = 0; i < numItems; ++i )\n  469 |                 voidClientData.push_back(GetClientData(i));\n  470 |             break;\n  471 |     }\n  472 | \n  473 |     wxComboBox::DoClear();\n  474 | \n  475 |     HWND hwnd = GetHwnd();\n  476 |     DissociateHandle();\n  477 |     ::DestroyWindow(hwnd);\n  478 | \n  479 |     if ( !MSWCreateControl(wxT(\"COMBOBOX\"), wxEmptyString, pos, size) )\n  480 |         return;","lines":41,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/combobox.cpp#L440-L480"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`wxConnectionBase::GetBufferAtLeast()` returns `nullptr` when a connection was constructed with a fixed, caller-supplied buffer (`wxDDEConnection(void *buffer, size_t size)`, which sets `m_deletebufferwhendone = false`) and the incoming DDE payload is larger than that buffer. In `wxDDEConnection::Request()` and in three cases of `_DDECallback()` (`XTYP_EXECUTE`, `XTYP_POKE`, `XTYP_ADVDATA`), this possible `nullptr` is only checked with `wxASSERT_MSG(data != nullptr, ...)`, which compiles to nothing in release builds (`wxDEBUG_LEVEL == 0`). The code then unconditionally calls `DdeGetData(returned_data/hData, (LPBYTE)data, len, 0)`, writing `len` bytes through a `nullptr` pointer, and in `_DDECallback` cases also passes the same null `data` on to `connection->OnExecute()`/`OnPoke()`. Since the incoming DDE data size is controlled by whatever DDE client/server the connection talks to, a peer sending a payload larger than the app's fixed buffer crashes the process in release builds.","fix":"Check the result of `GetBufferAtLeast()`/`connection->GetBufferAtLeast()` for `nullptr` in all four places and bail out gracefully instead of relying on a debug-only assert, e.g. in `Request()`:\n\n```cpp\nvoid *data = GetBufferAtLeast(len);\nif ( !data )\n{\n    wxLogError(wxT(\"Buffer too small in wxDDEConnection::Request\"));\n    (void) DdeFreeDataHandle(returned_data);\n    return nullptr;\n}\n```\n\nand analogously return `(DDERETURN)DDE_FNOTPROCESSED` (freeing `hData` first) from the `XTYP_EXECUTE`/`XTYP_POKE`/`XTYP_ADVDATA` cases in `_DDECallback()` when `connection->GetBufferAtLeast(len)` returns `nullptr`.","locations":[{"ref":"src/msw/dde.cpp:626-631","code":"  626 |     DWORD len = DdeGetData(returned_data, nullptr, 0, 0);\n  627 | \n  628 |     void *data = GetBufferAtLeast(len);\n  629 |     wxASSERT_MSG(data != nullptr,\n  630 |                  wxT(\"Buffer too small in wxDDEConnection::Request\") );\n  631 |     (void) DdeGetData(returned_data, (LPBYTE)data, len, 0);","lines":6,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/dde.cpp#L626-L631"},{"ref":"src/msw/dde.cpp:846-852","code":"  846 |                     DWORD len = DdeGetData(hData, nullptr, 0, 0);\n  847 | \n  848 |                     void *data = connection->GetBufferAtLeast(len);\n  849 |                     wxASSERT_MSG(data != nullptr,\n  850 |                                  wxT(\"Buffer too small in _DDECallback (XTYP_EXECUTE)\") );\n  851 | \n  852 |                     DdeGetData(hData, (LPBYTE)data, len, 0);","lines":7,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/dde.cpp#L846-L852"},{"ref":"src/msw/dde.cpp:923-929","code":"  923 |                     DWORD len = DdeGetData(hData, nullptr, 0, 0);\n  924 | \n  925 |                     void *data = connection->GetBufferAtLeast(len);\n  926 |                     wxASSERT_MSG(data != nullptr,\n  927 |                                  wxT(\"Buffer too small in _DDECallback (XTYP_POKE)\") );\n  928 | \n  929 |                     DdeGetData(hData, (LPBYTE)data, len, 0);","lines":7,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/dde.cpp#L923-L929"},{"ref":"src/msw/dde.cpp:1010-1016","code":" 1010 |                     DWORD len = DdeGetData(hData, nullptr, 0, 0);\n 1011 | \n 1012 |                     char* const data = (char *)connection->GetBufferAtLeast(len);\n 1013 |                     wxASSERT_MSG(data != nullptr,\n 1014 |                                  wxT(\"Buffer too small in _DDECallback (XTYP_ADVDATA)\") );\n 1015 | \n 1016 |                     DdeGetData(hData, (LPBYTE)data, len, 0);","lines":7,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/dde.cpp#L1010-L1016"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"In `wxDialUpManagerMSW::EnableAutoCheckOnlineStatus()`, if `m_data->hEventQuit.Create(...)` fails (`src/msw/dialup.cpp:1034-1046`) or `wxCreateHiddenWindow(...)` fails (`src/msw/dialup.cpp:1048-1066`), the code calls `CleanUpThreadData()` and sets `ok = false`. `CleanUpThreadData()` unconditionally runs `wxDELETE(m_data)` (see `src/msw/dialup.cpp:526-545`), which deletes `m_data` and sets it to `nullptr` even though `m_hThread` is still `0` at this point. Execution then falls through to the unconditional line `m_data->hWnd = ms_hwndRas;` at `src/msw/dialup.cpp:1068`, which is **not** guarded by `if ( ok )`, dereferencing the now-null `m_data` and crashing.","fix":"Guard the assignment with the same `ok` flag that guards every other use of `m_data` in this function:\n\n```cpp\nif ( ok )\n    m_data->hWnd = ms_hwndRas;\n```\n\nNote that `m_data->hWnd` is also needed by the thread-creation block below, so either move the assignment inside the `if ( ok )` block that creates the thread, or bail out early (e.g. `if ( !ok ) return ...;`) right after the event/window creation checks, before touching `m_data` again.","locations":[{"ref":"src/msw/dialup.cpp:1028-1068","code":" 1028 |     if ( ok )\n 1029 |     {\n 1030 |         // create the event we use to quit the thread: using a manual event\n 1031 |         // here avoids problems with missing the event if wxDialUpManagerMSW\n 1032 |         // is created and destroyed immediately, before wxRasStatusWindowProc\n 1033 |         // starts waiting on the event\n 1034 |         if ( !m_data->hEventQuit.Create\n 1035 |                              (\n 1036 |                                 wxWinAPI::Event::ManualReset,\n 1037 |                                 wxWinAPI::Event::Nonsignaled\n 1038 |                              ) )\n 1039 |         {\n 1040 |             wxLogLastError(wxT(\"CreateEvent(RasThreadQuit)\"));\n 1041 | \n 1042 |             CleanUpThreadData();\n 1043 | \n 1044 |             ok = false;\n 1045 |         }\n 1046 |     }\n 1047 | \n 1048 |     if ( ok && !ms_hwndRas )\n 1049 |     {\n 1050 |         // create a hidden window to receive notification about connections\n 1051 |         // status change\n 1052 |         ms_hwndRas = wxCreateHiddenWindow\n 1053 |                      (\n 1054 |                         &gs_classForDialUpWindow,\n 1055 |                         wxMSWDIALUP_WNDCLASSNAME,\n 1056 |                         wxRasStatusWindowProc\n 1057 |                      );\n 1058 |         if ( !ms_hwndRas )\n 1059 |         {\n 1060 |             wxLogLastError(wxT(\"CreateWindow(RasHiddenWindow)\"));\n 1061 | \n 1062 |             CleanUpThreadData();\n 1063 | \n 1064 |             ok = false;\n 1065 |         }\n 1066 |     }\n 1067 | \n 1068 |     m_data->hWnd = ms_hwndRas;","lines":41,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/dialup.cpp#L1028-L1068"},{"ref":"src/msw/dialup.cpp:526-545","code":"  526 | void wxDialUpManagerMSW::CleanUpThreadData()\n  527 | {\n  528 |     if ( m_hThread )\n  529 |     {\n  530 |         if ( m_data->hEventQuit.Set() )\n  531 |         {\n  532 |             // sent quit request to the background thread\n  533 | \n  534 |             // the thread still needs m_data so we can't free it here, rather\n  535 |             // let the thread do it itself\n  536 |             m_data = nullptr;\n  537 |         }\n  538 | \n  539 |         CloseHandle(m_hThread);\n  540 | \n  541 |         m_hThread = 0;\n  542 |     }\n  543 | \n  544 |     wxDELETE(m_data);\n  545 | }","lines":20,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/dialup.cpp#L526-L545"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"high","difficulty":"very_easy","description":"In `wxD2DHwndRenderTargetResourceHolder::DoAcquireResource`, when `m_factory->CreateHwndRenderTarget(...)` fails, the code only calls `wxFAIL_MSG(\"Could not create Direct2D render target\")` (`src/msw/graphicsd2d.cpp:3528`) - an assertion, not a control-flow statement - and then falls straight through to `renderTarget->SetTransform(D2D1::Matrix3x2F::Identity());` (line 3531) and `m_nativeResource = renderTarget;` (line 3533), even though `renderTarget` is still null. This dereferences a null pointer and crashes whenever the HWND render target cannot be created (e.g. no GPU/driver available, a remote desktop session, or a device-removed condition). Contrast this with the sibling `wxD2DDCRenderTargetResourceHolder::DoAcquireResource` (`src/msw/graphicsd2d.cpp:3766-3772`), which correctly does `if (FAILED(hr)) { return; }` after the equivalent failure.","fix":"Add an early return after the failure branch, mirroring `wxD2DDCRenderTargetResourceHolder`:\n\n```\nif (FAILED(result))\n{\n    wxFAIL_MSG(\"Could not create Direct2D render target\");\n    return;\n}\n```","locations":[{"ref":"src/msw/graphicsd2d.cpp:3504-3536","code":" 3504 |     void DoAcquireResource() override\n 3505 |     {\n 3506 |         wxCOMPtr<ID2D1HwndRenderTarget> renderTarget;\n 3507 | \n 3508 |         HRESULT result;\n 3509 | \n 3510 |         RECT clientRect = wxGetClientRect(m_hwnd);\n 3511 | \n 3512 |         D2D1_SIZE_U size = D2D1::SizeU(\n 3513 |             clientRect.right - clientRect.left,\n 3514 |             clientRect.bottom - clientRect.top);\n 3515 | \n 3516 |         // We explicitly specify 96 DPI (a.k.a. 100% scaling) because otherwise\n 3517 |         // D2D would perform pixel scaling on its own, while we want to do it\n 3518 |         // ourselves, for consistency with wxDC.\n 3519 |         result = m_factory->CreateHwndRenderTarget(\n 3520 |             D2D1::RenderTargetProperties(\n 3521 |                     D2D1_RENDER_TARGET_TYPE_DEFAULT,\n 3522 |                     D2D1::PixelFormat(),\n 3523 |                     96.f,\n 3524 |                     96.f),\n 3525 |             D2D1::HwndRenderTargetProperties(m_hwnd, size),\n 3526 |             &renderTarget);\n 3527 | \n 3528 |         if (FAILED(result))\n 3529 |         {\n 3530 |             wxFAIL_MSG(\"Could not create Direct2D render target\");\n 3531 |         }\n 3532 | \n 3533 |         renderTarget->SetTransform(D2D1::Matrix3x2F::Identity());\n 3534 | \n 3535 |         m_nativeResource = renderTarget;\n 3536 |     }","lines":33,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/graphicsd2d.cpp#L3504-L3536"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"In `wxComboCtrlBase::OnPopupKey`, the code takes the popup window's child list and unconditionally dereferences the first iterator: `wxWindowList::iterator node = children.begin(); wxWindow* child = (wxWindow*)*node;`. If the popup window has no children (e.g. a key event arrives before the popup control has been created/attached, or a custom popup that leaves the window empty), `children.begin() == children.end()` and dereferencing it yields a null/invalid node, so `child->GetEventHandler()` dereferences a bad pointer and crashes. Additionally `wxWindowList children = ...` needlessly copies the whole list by value.","fix":"Use a reference and guard against an empty list before dereferencing:\n```\nvoid wxComboCtrlBase::OnPopupKey( wxKeyEvent& event )\n{\n    // Relay keyboard event to the main child controls\n    const wxWindowList& children = GetPopupWindow()->GetChildren();\n    if ( children.empty() )\n        return;\n    wxWindow* child = children.front();\n    child->GetEventHandler()->ProcessEvent(event);\n}\n```\nThis both avoids the copy of `children` and prevents dereferencing `end()`.","locations":[{"ref":"src/common/combocmn.cpp:455-462","code":"  455 | void wxComboCtrlBase::OnPopupKey( wxKeyEvent& event )\n  456 | {\n  457 |     // Relay keyboard event to the main child controls\n  458 |     wxWindowList children = GetPopupWindow()->GetChildren();\n  459 |     wxWindowList::iterator node = children.begin();\n  460 |     wxWindow* child = (wxWindow*)*node;\n  461 |     child->GetEventHandler()->ProcessEvent(event);\n  462 | }","lines":8,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/combocmn.cpp#L455-L462"}]},
{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`wxBackingFileImpl::GetLength()` dereferences `m_stream` whenever `m_parenterror != wxSTREAM_EOF`. However `ReadAt()` deletes `m_stream` (via `wxDELETE`, nulling it) while setting `m_parenterror = wxSTREAM_READ_ERROR` on the backing-file write-failure path. After such a failure (e.g. temp backing file write fails on a full disk), `m_stream` is null but `m_parenterror` is `wxSTREAM_READ_ERROR` (not `wxSTREAM_EOF`), so the `if (m_parenterror != wxSTREAM_EOF)` branch is taken and `m_stream->GetLength()` dereferences a null pointer. This is reachable via `wxBackedInputStream::GetLength()`/`FindLength()`/`OnSysSeek()`.","fix":"Guard the dereference on `m_stream`, e.g. `if (m_stream && m_parenterror != wxSTREAM_EOF)` and fall back to returning `m_filelen + m_buflen` (or `wxInvalidOffset`) when `m_stream` is null, so the read-error state doesn't crash.","locations":[{"ref":"src/common/fileback.cpp:210-217","code":"  210 | wxFileOffset wxBackingFileImpl::GetLength() const\n  211 | {\n  212 |     if (m_parenterror != wxSTREAM_EOF) {\n  213 |         wxLogNull nolog;\n  214 |         return m_stream->GetLength();\n  215 |     }\n  216 |     return m_filelen + m_buflen;\n  217 | }","lines":8,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/fileback.cpp#L210-L217"},{"ref":"src/common/fileback.cpp:166-174","code":"  166 |                     if (count < m_buflen) {\n  167 |                         wxDELETE(m_stream);\n  168 |                         if (count > 0) {\n  169 |                             wxDELETEA(m_buf);\n  170 |                             m_buflen = 0;\n  171 |                         }\n  172 |                         m_parenterror = wxSTREAM_READ_ERROR;\n  173 |                         return m_parenterror;\n  174 |                     }","lines":9,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/fileback.cpp#L166-L174"}]},
{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"In `wxHTTP::BuildRequest`, after confirming the response line contains `\"HTTP/\"`, the code tokenizes on spaces and unconditionally uses the second token: `tmp_str2 = token.NextToken();` then `switch ( tmp_str2[0u].GetValue() )`. A malformed/malicious server response line such as `\"HTTP/1.1\"` with no status code produces an empty `tmp_str2`, so `tmp_str2[0u]` indexes position 0 of an empty `wxString` (out-of-range access / undefined behavior). Reachable from any remote server.","fix":"Guard against an empty status token before indexing, e.g.:\n```cpp\ntoken.NextToken();\ntmp_str2 = token.NextToken();\nif ( tmp_str2.empty() )\n{\n    m_lastError = wxPROTO_PROTERR;\n    RestoreState();\n    return false;\n}\nm_http_response = wxAtoi(tmp_str2);\nswitch ( tmp_str2[0u].GetValue() )\n```","locations":[{"ref":"src/common/http.cpp:389-398","code":"  389 |     wxStringTokenizer token(tmp_str,wxT(' '));\n  390 |     wxString tmp_str2;\n  391 |     bool ret_value;\n  392 | \n  393 |     token.NextToken();\n  394 |     tmp_str2 = token.NextToken();\n  395 | \n  396 |     m_http_response = wxAtoi(tmp_str2);\n  397 | \n  398 |     switch ( tmp_str2[0u].GetValue() )","lines":10,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/http.cpp#L389-L398"}]},
{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`Skip_Comment()` recurses once per consecutive comment line: it constructs a `wxTextInputStream`, reads one line, then calls itself again. Because each stack frame holds a `wxTextInputStream` local with a destructor, the recursion is not tail-call-optimizable, so a PNM file (untrusted input) with a large number of consecutive `#` comment lines produces recursion depth proportional to the number of comment lines and can exhaust the stack, crashing the process.","fix":"Rewrite `Skip_Comment()` iteratively, e.g. `while (stream.Peek() == wxT('#')) { wxTextInputStream(stream).ReadLine(); }`, so comment skipping uses bounded stack space.","locations":[{"ref":"src/common/imagpnm.cpp:32-42","code":"   32 | static\n   33 | void Skip_Comment(wxInputStream &stream)\n   34 | {\n   35 |     wxTextInputStream text_stream(stream);\n   36 | \n   37 |     if (stream.Peek()==wxT('#'))\n   38 |     {\n   39 |         text_stream.ReadLine();\n   40 |         Skip_Comment(stream);\n   41 |     }\n   42 | }","lines":11,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/imagpnm.cpp#L32-L42"}]},
{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"In the `wxWebViewChromium` destructor, once `m_clientHandler` is non-null it unconditionally calls `m_clientHandler->GetHost()->CloseBrowser(forceClose)`. `GetHost()` returns a null `CefRefPtr` whenever `m_browser` is null, which is the case if browser creation never succeeded: on non-GTK platforms `DoCreateBrowser()` can fail (returns `false`, so `Create()` returns `false`) after `m_clientHandler` was already assigned, and on GTK the browser is created lazily in `GTKHandleRealized()`, so a webview created and destroyed before realization also has a null browser/host. Dereferencing the null host crashes; the same path then dereferences `m_actualClient` (also null on the GTK-before-realize path) at `m_actualClient->Release()`.","fix":"Guard the shutdown sequence on the host being present, e.g. `auto host = m_clientHandler->GetHost(); if ( host ) { host->CloseBrowser(forceClose); ... }` and skip the wait/`Release()` logic (or handle it separately) when no browser was ever created.","locations":[{"ref":"src/common/webview_chromium.cpp:966-979","code":"  966 | wxWebViewChromium::~wxWebViewChromium()\n  967 | {\n  968 |     if (m_clientHandler)\n  969 |     {\n  970 |         wxLogTrace(TRACE_CEF, \"closing browser\");\n  971 | \n  972 |         const auto handle = m_clientHandler->GetWindowHandle();\n  973 | \n  974 |         constexpr bool forceClose = true;\n  975 |         m_clientHandler->GetHost()->CloseBrowser(forceClose);\n  976 | \n  977 |         // We need to destroy the client handler used by the browser to allow\n  978 |         // it to close.\n  979 |         m_actualClient->Release();","lines":14,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/webview_chromium.cpp#L966-L979"}]},
{"id":"PANIC_14","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"In `wxObjectXmlReader::ReadComponent` delegate handling, `wxClassInfo* sinkClassInfo = GetObjectClassInfo( sinkOid )` can return `nullptr` (it logs and returns null for null/invalid/unknown ids, e.g. a forward or bogus reference in the XML content). The result is immediately dereferenced via `sinkClassInfo->FindHandlerInfo(handlerName.c_str())`, causing a null-pointer crash on crafted/malformed XML.","fix":"Check the result before use: `wxClassInfo* sinkClassInfo = GetObjectClassInfo( sinkOid ); if ( sinkClassInfo ) callbacks->SetConnect( objectID, classInfo, pi, sinkClassInfo, sinkClassInfo->FindHandlerInfo(handlerName.c_str()), sinkOid ); else wxLogError(...);`","locations":[{"ref":"src/common/xtixml.cpp:471-474","code":"  471 |                             wxClassInfo* sinkClassInfo = GetObjectClassInfo( sinkOid );\n  472 | \n  473 |                             callbacks->SetConnect( objectID, classInfo, pi, sinkClassInfo,\n  474 |                                 sinkClassInfo->FindHandlerInfo(handlerName.c_str()),  sinkOid );","lines":4,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/xtixml.cpp#L471-L474"}]},
{"id":"PANIC_15","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"On wxQT, `~wxCairoContext()` and `wxCairoContext::Flush()` dereference `m_qtPainter` guarded only by `m_context`. The `wxCairoContext(renderer, cairo_t*)` constructor explicitly sets `m_qtPainter = nullptr` while installing a non-null `m_context` (via `cairo_reference`). Such a context is created by `CreateContextFromNativeContext()` on Qt, so destroying it (or calling `Flush()`) evaluates `m_qtPainter->isActive()` on a null pointer, crashing.","fix":"Add a null check for the painter, i.e. use `if ( m_context && m_qtPainter && m_qtPainter->isActive() )` in both the destructor and `Flush()`.","locations":[{"ref":"src/generic/graphicc.cpp:2524-2531","code":" 2524 |     if ( m_context && m_qtPainter->isActive() )\n 2525 |     {\n 2526 |         // draw the internal buffered image to the widget\n 2527 |         cairo_surface_flush( cairo_get_target(m_context) );\n 2528 |         m_qtPainter->drawImage( 0,0, m_qtImage );\n 2529 |         m_qtPainter->setWorldMatrixEnabled(true);\n 2530 |     }\n 2531 | #endif","lines":8,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/graphicc.cpp#L2524-L2531"},{"ref":"src/generic/graphicc.cpp:2870-2876","code":" 2870 | #ifdef __WXQT__\n 2871 |     if ( m_context && m_qtPainter->isActive() )\n 2872 |     {\n 2873 |         cairo_surface_flush( cairo_get_target(m_context) );\n 2874 |         m_qtPainter->drawImage( 0,0, m_qtImage );\n 2875 |     }\n 2876 | #endif","lines":7,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/graphicc.cpp#L2870-L2876"}]},
{"id":"PANIC_16","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`wxGridCellEnumRenderer::GetString` indexes `m_choices[ choiceno ]` where `choiceno = table->GetValueAsLong(row, col)` comes from the (externally supplied) cell data, with no bounds check. If the underlying table returns a number that is negative or `>= m_choices.size()` (e.g. stale/invalid data), `wxArrayString::operator[]` triggers a failed assertion in debug and out-of-bounds access (undefined behavior) in release while drawing the cell.","fix":"Validate the index before use, e.g. `if ( choiceno >= 0 && (size_t)choiceno < m_choices.size() ) text.Printf(\"%s\", m_choices[choiceno]); else text = table->GetValue(row, col);`.","locations":[{"ref":"src/generic/gridctrl.cpp:313-330","code":"  313 | wxString wxGridCellEnumRenderer::GetString(const wxGrid& grid, int row, int col)\n  314 | {\n  315 |     wxGridTableBase *table = grid.GetTable();\n  316 |     wxString text;\n  317 |     if ( table->CanGetValueAs(row, col, wxGRID_VALUE_NUMBER) )\n  318 |     {\n  319 |         int choiceno = table->GetValueAsLong(row, col);\n  320 |         text.Printf(wxT(\"%s\"), m_choices[ choiceno ] );\n  321 |     }\n  322 |     else\n  323 |     {\n  324 |         text = table->GetValue(row, col);\n  325 |     }\n  326 | \n  327 | \n  328 |     //If we faild to parse string just show what we where given?\n  329 |     return text;\n  330 | }","lines":18,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/gridctrl.cpp#L313-L330"}]},
{"id":"PANIC_17","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"In the `wxID_HTML_UPNODE` handler the search loop `while (ind >= 0 && it->level != level) { ind--; it = &m_Data->GetContentsArray()[ind]; }` decrements `ind` and then indexes the array *before* the loop condition is re-evaluated. When `ind` reaches `0` with a level mismatch, the body executes `ind--` making `ind == -1`, and then evaluates `&m_Data->GetContentsArray()[-1]`. `operator[](size_t)` receives `(size_t)-1`, i.e. a huge index - an out-of-bounds access (debug assert / undefined behaviour in release) that can happen for any page whose parent level is never found while scrolling to the top of the contents.","fix":"Guard the index computation, e.g.:\n```cpp\nwhile (ind >= 0)\n{\n    const wxHtmlHelpDataItem* it = &m_Data->GetContentsArray()[ind];\n    if (it->level == level) break;\n    ind--;\n}\nif (ind >= 0) { ... }\n```","locations":[{"ref":"src/html/helpwnd.cpp:1419-1434","code":" 1419 |                     int level =\n 1420 |                         m_Data->GetContentsArray()[ha->m_Index].level - 1;\n 1421 |                     int ind = ha->m_Index - 1;\n 1422 | \n 1423 |                     const wxHtmlHelpDataItem *it =\n 1424 |                         &m_Data->GetContentsArray()[ind];\n 1425 |                     while (ind >= 0 && it->level != level)\n 1426 |                     {\n 1427 |                         ind--;\n 1428 |                         it = &m_Data->GetContentsArray()[ind];\n 1429 |                     }\n 1430 |                     if (ind >= 0)\n 1431 |                     {\n 1432 |                         if (!it->page.empty())\n 1433 |                             m_HtmlWin->LoadPage(it->GetFullPath());\n 1434 |                     }","lines":16,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/html/helpwnd.cpp#L1419-L1434"}]},
{"id":"PANIC_18","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"In the `wxID_HTML_DOWN` handler, `size_t idx = ha->m_Index + 1; while (contents[idx].GetFullPath() == page) idx++;` has no upper bound. If the trailing contents items all resolve to the same full path as the current `page`, `idx` runs past `contents.size()`, indexing out of bounds; even in the normal case the post-loop access `contents[idx]` can be `contents[size()]`. This is an out-of-bounds read triggered by the Next-page toolbar button.","fix":"Bound the loop: `while (idx < contents.size() && contents[idx].GetFullPath() == page) idx++;` and check `idx < contents.size()` before dereferencing `contents[idx]`.","locations":[{"ref":"src/html/helpwnd.cpp:1447-1456","code":" 1447 |                 const wxHtmlHelpDataItems& contents = m_Data->GetContentsArray();\n 1448 |                 if (ha && ha->m_Index < (int)contents.size() - 1)\n 1449 |                 {\n 1450 |                     size_t idx = ha->m_Index + 1;\n 1451 | \n 1452 |                     while (contents[idx].GetFullPath() == page) idx++;\n 1453 | \n 1454 |                     if (!contents[idx].page.empty())\n 1455 |                         m_HtmlWin->LoadPage(contents[idx].GetFullPath());\n 1456 |                 }","lines":10,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/html/helpwnd.cpp#L1447-L1456"}]},
{"id":"PANIC_19","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`wxFileDialogBase::SetFilterIndex()` (`include/wx/filedlg.h:112`) stores `m_filterIndex` with no range validation at all: `virtual void SetFilterIndex(int filterIndex) { m_filterIndex = filterIndex; }`. Both `wxFileDialog::ShowCommFileDialog()` and `wxFileDialog::ShowIFileDialog()` in `src/msw/filedlg.cpp` then index into filter arrays derived from the wildcard string using this unchecked value: the legacy path walks `maxFilter = (int)(of.nFilterIndex*2L) - 1` null-terminated tokens forward through `filterBuffer` (`src/msw/filedlg.cpp:1471-1478`), and the `IFileDialog` path does `wildFilters[m_filterIndex]` where `wildFilters` is a `wxArrayString` sized to `nWildcards` (`src/msw/filedlg.cpp:1649-1650`). If application code calls `SetFilterIndex()` with a value at or beyond the number of filters actually parsed from the wildcard string (an easy off-by-one for callers, since the number of filters isn't otherwise exposed), both paths read past the end of their respective buffers/arrays instead of failing gracefully.","fix":"Clamp/validate `m_filterIndex` against the actual number of parsed wildcards before using it, e.g. in `ShowModal()` right after `wxParseCommonDialogsFilter()` is called in each path:\n\n```cpp\nconst UINT nWildcards = wxParseCommonDialogsFilter(m_wildCard, wildDescriptions, wildFilters);\nwxCHECK_MSG( m_filterIndex >= 0 && (UINT)m_filterIndex < nWildcards, wxID_CANCEL,\n             \"wxFileDialog::SetFilterIndex() called with an out of range index\" );\n```\n\nor clamp defensively with `m_filterIndex = wxMin(m_filterIndex, (int)nWildcards - 1)` if silently correcting is preferred over asserting.","locations":[{"ref":"src/msw/filedlg.cpp:1470-1484","code":" 1470 |     {\n 1471 |         const wxChar* extension = filterBuffer.t_str();\n 1472 |         int maxFilter = (int)(of.nFilterIndex*2L) - 1;\n 1473 | \n 1474 |         for( int j = 0; j < maxFilter; j++ )           // get extension\n 1475 |             extension = extension + wxStrlen( extension ) + 1;\n 1476 | \n 1477 |         // use dummy name a to avoid assert in AppendExtension\n 1478 |         defextBuffer = AppendExtension(wxT(\"a\"), extension);\n 1479 |         if (defextBuffer.StartsWith(wxT(\"a.\")))\n 1480 |         {\n 1481 |             defextBuffer = defextBuffer.Mid(2); // remove \"a.\"\n 1482 |             of.lpstrDefExt = defextBuffer.c_str();\n 1483 |         }\n 1484 |     }","lines":15,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/filedlg.cpp#L1470-L1484"},{"ref":"src/msw/filedlg.cpp:1624-1651","code":" 1624 |     const UINT nWildcards = wxParseCommonDialogsFilter(m_wildCard,\n 1625 |                                                        wildDescriptions,\n 1626 |                                                        wildFilters);\n 1627 |     if ( nWildcards )\n 1628 |     {\n 1629 |         wxVector<COMDLG_FILTERSPEC> filterSpecs(nWildcards);\n 1630 |         for ( UINT n = 0; n < nWildcards; ++n )\n 1631 |         {\n 1632 |             filterSpecs[n].pszName = wildDescriptions[n].wc_str();\n 1633 |             filterSpecs[n].pszSpec = wildFilters[n].wc_str();\n 1634 |         }\n 1635 | \n 1636 |         hr = fileDialog->SetFileTypes(nWildcards, &filterSpecs[0]);\n 1637 |         if ( FAILED(hr) )\n 1638 |             wxLogApiError(wxS(\"IFileDialog::SetFileTypes\"), hr);\n 1639 | \n 1640 |         hr = fileDialog->SetFileTypeIndex(m_filterIndex + 1);\n 1641 |         if ( FAILED(hr) )\n 1642 |             wxLogApiError(wxS(\"IFileDialog::SetFileTypeIndex\"), hr);\n 1643 | \n 1644 |         // We need to call SetDefaultExtension() to make the file dialog append\n 1645 |         // the selected extension by default. It will append the correct\n 1646 |         // extension depending on the current file type choice if we call this\n 1647 |         // function, but won't do anything at all without it, so find the first\n 1648 |         // extension associated with the selected filter and use it here.\n 1649 |         wxString defExt =\n 1650 |             wildFilters[m_filterIndex].BeforeFirst(';').AfterFirst('.');\n 1651 |         if ( !defExt.empty() && defExt != wxS(\"*\") )","lines":28,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/filedlg.cpp#L1624-L1651"}]},
{"id":"PANIC_20","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"In `wxFrame::HandleCommand()`, when handling a thumbnail-toolbar button click (`cmd == wxTHBN_CLICKED`), `tbButton->GetThumbBarButtonByIndex(id)` is dereferenced without a null check: `wxThumbBarButton * const thumbBarButton = tbButton->GetThumbBarButtonByIndex(id); wxCommandEvent event(wxEVT_BUTTON, thumbBarButton->GetID());`. `wxTaskBarButtonImpl::GetThumbBarButtonByIndex()` (`src/msw/taskbarbutton.cpp:944-950`) explicitly returns `nullptr` when `index >= m_thumbBarButtons.size()`. The `id` here comes straight from the `WM_COMMAND` notification generated by the shell (`explorer.exe`) for a thumbbar button click, so it reflects the button indices at the time the toolbar was last synced. If the application removes a thumb-bar button (shrinking `m_thumbBarButtons` via `RemoveThumbBarButton()`) while a click notification for a since-removed, higher-indexed button is still in flight, `GetThumbBarButtonByIndex()` returns `nullptr` and the subsequent `thumbBarButton->GetID()` call crashes.","fix":"Add a null check before dereferencing the result:\n\n```cpp\nif ( cmd == wxTHBN_CLICKED && m_taskBarButton )\n{\n    wxTaskBarButtonImpl * const\n        tbButton = reinterpret_cast<wxTaskBarButtonImpl*>(m_taskBarButton);\n    wxThumbBarButton * const\n        thumbBarButton = tbButton->GetThumbBarButtonByIndex(id);\n    if ( !thumbBarButton )\n        return false;\n\n    wxCommandEvent event(wxEVT_BUTTON, thumbBarButton->GetID());\n    event.SetEventObject(thumbBarButton);\n    return ProcessEvent(event);\n}\n```","locations":[{"ref":"src/msw/frame.cpp:812-824","code":"  812 | #if wxUSE_TASKBARBUTTON\n  813 |     if ( cmd == wxTHBN_CLICKED && m_taskBarButton )\n  814 |     {\n  815 |         wxTaskBarButtonImpl * const\n  816 |             tbButton = reinterpret_cast<wxTaskBarButtonImpl*>(m_taskBarButton);\n  817 |         // we use the index as id when adding thumbnail toolbar button.\n  818 |         wxThumbBarButton * const\n  819 |             thumbBarButton = tbButton->GetThumbBarButtonByIndex(id);\n  820 |         wxCommandEvent event(wxEVT_BUTTON, thumbBarButton->GetID());\n  821 |         event.SetEventObject(thumbBarButton);\n  822 |         return ProcessEvent(event);\n  823 |     }\n  824 | #endif // wxUSE_TASKBARBUTTON","lines":13,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/frame.cpp#L812-L824"}]},
{"id":"PANIC_21","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"In `wxD2DConvertRegionToGeometry`, `geometries[0]`/`geometries[i]` are initialized to `nullptr` (`src/msw/graphicsd2d.cpp:1045` and `:1065`) and only get a real value if `direct2dFactory->CreateRectangleGeometry(...)` succeeds; the returned `HRESULT` is passed only to the no-op `wxFAILED_HRESULT_MSG(hr)` (see the related `incorrect_error_handling` finding), so a failure is never detected. Regardless of whether creation succeeded, the cleanup loop at `src/msw/graphicsd2d.cpp:1091-1094` unconditionally executes `geometries[i]->Release();` for every entry in the array. If `CreateRectangleGeometry` ever fails (e.g. under low memory or a lost D2D device), this dereferences a null pointer and crashes the process.","fix":"Check the `HRESULT` from `CreateRectangleGeometry` explicitly and either bail out immediately (releasing any geometries already created) or guard the cleanup loop against null entries, e.g.:\n\n```\nfor (i = 0; i < rectCount; ++i)\n{\n    if (geometries[i])\n        geometries[i]->Release();\n}\n```","locations":[{"ref":"src/msw/graphicsd2d.cpp:1040-1052","code":" 1040 |     if ( region.IsEmpty() )\n 1041 |     {\n 1042 |         // Empty region is skipped by iterator\n 1043 |         // so we have to create it in a special way.\n 1044 |         rectCount = 1;\n 1045 |         geometries = new ID2D1Geometry*[rectCount];\n 1046 | \n 1047 |         geometries[0] = nullptr;\n 1048 |         hr = direct2dFactory->CreateRectangleGeometry(\n 1049 |                         D2D1::RectF(0.0F, 0.0F, 0.0F, 0.0F),\n 1050 |                         (ID2D1RectangleGeometry**)(&geometries[0]));\n 1051 |         wxFAILED_HRESULT_MSG(hr);\n 1052 |     }","lines":13,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/graphicsd2d.cpp#L1040-L1052"},{"ref":"src/msw/graphicsd2d.cpp:1093-1096","code":" 1093 |     for (i = 0; i < rectCount; ++i)\n 1094 |     {\n 1095 |         geometries[i]->Release();\n 1096 |     }","lines":4,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/graphicsd2d.cpp#L1093-L1096"}]},
{"id":"PANIC_22","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`wxD2DPathData`'s constructor calls `m_direct2dfactory->CreatePathGeometry(&m_pathGeometry)` and immediately calls `m_pathGeometry->Open(&m_geometrySink)` on the very next line without ever checking the returned `HRESULT`. If `CreatePathGeometry` fails (e.g. the D2D factory is out of resources or the device was removed), `m_pathGeometry` stays `nullptr` and `Open()` is called through a null pointer, crashing the app. Every other resource-creation call in this file is guarded with `wxCHECK_HRESULT_RET`/`wxCHECK2_HRESULT_RET`, but this constructor has none.","fix":"Capture and check the `HRESULT` before using the geometry:\n\n```\nHRESULT hr = m_direct2dfactory->CreatePathGeometry(&m_pathGeometry);\nwxCHECK_RET(SUCCEEDED(hr), \"Failed to create path geometry\");\nhr = m_pathGeometry->Open(&m_geometrySink);\nwxCHECK_RET(SUCCEEDED(hr), \"Failed to open geometry sink\");\n```","locations":[{"ref":"src/msw/graphicsd2d.cpp:1400-1416","code":" 1400 | wxD2DPathData::wxD2DPathData(wxGraphicsRenderer* renderer, ID2D1Factory* d2dFactory) :\n 1401 |     wxGraphicsPathData(renderer),\n 1402 |     m_direct2dfactory(d2dFactory),\n 1403 |     m_currentPointSet(false),\n 1404 |     m_currentPoint(D2D1::Point2F(0.0f, 0.0f)),\n 1405 |     m_figureOpened(false),\n 1406 |     m_figureStart(D2D1::Point2F(0.0f, 0.0f)),\n 1407 |     m_figureLogStartSet(false),\n 1408 |     m_figureLogStart(D2D1::Point2F(0.0f, 0.0f)),\n 1409 |     m_geometryWritable(true),\n 1410 |     m_fillMode(D2D1_FILL_MODE_ALTERNATE)\n 1411 | {\n 1412 |     m_direct2dfactory->CreatePathGeometry(&m_pathGeometry);\n 1413 |     // To properly initialize path geometry there is also\n 1414 |     // necessary to open at least once its geometry sink.\n 1415 |     m_pathGeometry->Open(&m_geometrySink);\n 1416 | }","lines":17,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/graphicsd2d.cpp#L1400-L1416"}]},
{"id":"PANIC_23","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`wxD2DPathData::Clone()` calls `m_direct2dfactory->CreateTransformedGeometry(...)` for every stored transformed geometry and only guards the result with `wxASSERT_MSG(SUCCEEDED(hr), wxFAILED_HRESULT_MSG(hr))` (`src/msw/graphicsd2d.cpp:1458`) - an assertion that is compiled out entirely in release builds - then unconditionally does `newPathData->m_pTransformedGeometries.push_back(pTransformedGeometry);` (line 1459) even when `pTransformedGeometry` is still `nullptr` because the call failed. `~wxD2DPathData()` (`src/msw/graphicsd2d.cpp:1416-1423`) later calls `m_pTransformedGeometries[i]->Release();` unconditionally for every stored pointer, and `GetFullGeometry` (`src/msw/graphicsd2d.cpp:1574-1596`) feeds the same array straight into `CreateGeometryGroup`. In a release build, a failed `CreateTransformedGeometry` call therefore results in a null-pointer dereference the next time the cloned path is destroyed or its full geometry is queried.","fix":"Replace the assertion with a real, always-effective check, e.g. `wxCHECK2_HRESULT_RET(hr, nullptr)` to abort the clone on failure, or skip pushing a null pointer into `m_pTransformedGeometries` and guard every subsequent `->Release()` call on that vector with a null check.","locations":[{"ref":"src/msw/graphicsd2d.cpp:1418-1425","code":" 1418 | wxD2DPathData::~wxD2DPathData()\n 1419 | {\n 1420 |     Flush();\n 1421 |     for( size_t i = 0; i < m_pTransformedGeometries.size(); i++ )\n 1422 |     {\n 1423 |         m_pTransformedGeometries[i]->Release();\n 1424 |     }\n 1425 | }","lines":8,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/graphicsd2d.cpp#L1418-L1425"},{"ref":"src/msw/graphicsd2d.cpp:1452-1462","code":" 1452 |     // Copy the collection of transformed geometries.\n 1453 |     ID2D1TransformedGeometry* pTransformedGeometry;\n 1454 |     for ( size_t i = 0; i < m_pTransformedGeometries.size(); i++ )\n 1455 |     {\n 1456 |         pTransformedGeometry = nullptr;\n 1457 |         hr = m_direct2dfactory->CreateTransformedGeometry(\n 1458 |                     m_pTransformedGeometries[i],\n 1459 |                     D2D1::Matrix3x2F::Identity(), &pTransformedGeometry);\n 1460 |         wxASSERT_MSG( SUCCEEDED(hr), wxFAILED_HRESULT_MSG(hr) );\n 1461 |         newPathData->m_pTransformedGeometries.push_back(pTransformedGeometry);\n 1462 |     }","lines":11,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/graphicsd2d.cpp#L1452-L1462"}]},

wxLogLastError(wxT(\"Header_GetOrderArray\"));\n  541 |     }\n  542 | \n  543 |     m_colIndices = order;\n  544 | }","lines":26,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/headerctrl.cpp#L519-L544"}]},
{"id":"PANIC_25","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"`wxConvAuto::GetMBNulLen()` dereferences `m_conv` unconditionally, but `m_conv` is `nullptr` until the first call to `ToWChar()`/`FromWChar()` (see `Init()` which sets `m_conv = nullptr`, and the class comment: \"conversion object which we really use, null until the first call\"). The sibling override `IsUTF8()` correctly guards with `m_conv && ...`, so the asymmetry shows `GetMBNulLen()` can be reached with `m_conv == nullptr` (e.g. calling `GetMBNulLen()` on a freshly-constructed `wxConvAuto` before any conversion), causing a null-pointer dereference.","fix":"Guard the dereference like `IsUTF8()` does:\n```cpp\nvirtual size_t GetMBNulLen() const override { return m_conv ? m_conv->GetMBNulLen() : 1; }\n```\ninstead of `return m_conv->GetMBNulLen();`.","locations":[{"ref":"include/wx/convauto.h:79-81","code":"   79 |     virtual size_t GetMBNulLen() const override { return m_conv->GetMBNulLen(); }\n   80 | \n   81 |     virtual bool IsUTF8() const override { return m_conv && m_conv->IsUTF8(); }","lines":3,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/convauto.h#L79-L81"},{"ref":"include/wx/convauto.h:106-114","code":"  106 |     void Init()\n  107 |     {\n  108 |         // We don't initialize m_encDefault here as different ctors do it\n  109 |         // differently.\n  110 |         m_conv = nullptr;\n  111 |         m_bomType = wxBOM_Unknown;\n  112 |         m_ownsConv = false;\n  113 |         m_consumedBOM = false;\n  114 |     }","lines":9,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/convauto.h#L106-L114"}]},
{"id":"PANIC_26","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`wxAuiNotebook::GetDropIndex()` uses `insert_idx = dest_tabs->GetPageCount();` in the `else` branch when the point is not over any tab, then immediately does `dest_tabs->GetPage(insert_idx - 1).kind`. If `dest_tabs` has zero pages, `insert_idx - 1` becomes `(size_t)-1`, indexing the underlying array out of bounds (crash / UB). While normal drag flows keep tab controls non-empty, `GetDropIndex()` performs no guard against an empty destination.","fix":"Guard the empty case, e.g. `if (dest_tabs->GetPageCount() == 0) return insert_idx = 0;` before dereferencing, or check `insert_idx > 0` before evaluating `dest_tabs->GetPage(insert_idx - 1).kind`.","locations":[{"ref":"src/aui/auibook.cpp:2926-2933","code":" 2926 |     else // Append the tab if there is no existing tab under it.\n 2927 |     {\n 2928 |         insert_idx = dest_tabs->GetPageCount();\n 2929 | \n 2930 |         // When appending we need just a single test.\n 2931 |         if ( dest_tabs->GetPage(insert_idx - 1).kind < page_info.kind )\n 2932 |             return wxNOT_FOUND;\n 2933 |     }","lines":8,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/aui/auibook.cpp#L2926-L2933"}]},
{"id":"PANIC_27","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`wxArtProvider::GetDIPSizeHint()` dereferences `sm_providers` via `sm_providers->empty()` without a null check, unlike every other static accessor here (`GetBitmap`, `GetBitmapBundle`, `DoGetIconBundle`, `Pop`, `Remove`) which all guard with `wxCHECK_MSG( sm_providers, ... )`. If called when no provider stack exists (before `wxArtProviderModule::OnInit()` runs, or in a build where neither a native nor std/tango provider is compiled in, leaving `sm_providers` null), this is a null-pointer dereference.","fix":"Guard the access like the other methods, e.g. `if ( sm_providers && !sm_providers->empty() ) return sm_providers->front()->DoGetSizeHint(client);` then fall through to `return GetNativeDIPSizeHint(client);`.","locations":[{"ref":"src/common/artprov.cpp:620-626","code":"  620 | /*static*/ wxSize wxArtProvider::GetDIPSizeHint(const wxArtClient& client)\n  621 | {\n  622 |     if ( !sm_providers->empty() )\n  623 |         return sm_providers->front()->DoGetSizeHint(client);\n  624 | \n  625 |     return GetNativeDIPSizeHint(client);\n  626 | }","lines":7,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/artprov.cpp#L620-L626"}]},
{"id":"PANIC_28","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`wxCommandProcessor::Store()` trims the history with `if ( (int)m_commands.GetCount() == m_maxNoCommands )` and then dereferences `m_commands.GetFirst()` via `firstNode->GetData()`. If a `wxCommandProcessor` is created with `maxCommands == 0` (a legal, if unusual, value; the default is -1 meaning unlimited), then on the first `Submit()`/`Store()` the list is empty, `GetCount() == 0 == m_maxNoCommands` is true, `GetFirst()` returns a null iterator and `firstNode->GetData()` dereferences it, crashing.","fix":"Guard the trim against an empty list / non-positive limit, e.g. `if ( m_maxNoCommands > 0 && (int)m_commands.GetCount() >= m_maxNoCommands )` and verify `firstNode` is valid before dereferencing it.","locations":[{"ref":"src/common/cmdproc.cpp:128-139","code":"  128 |     if ( (int)m_commands.GetCount() == m_maxNoCommands )\n  129 |     {\n  130 |         wxList::compatibility_iterator firstNode = m_commands.GetFirst();\n  131 | \n  132 |         // Make sure m_lastSavedCommand won't point to freed memory\n  133 |         if ( m_lastSavedCommand && m_lastSavedCommand == firstNode )\n  134 |             m_lastSavedCommand = wxList::compatibility_iterator();\n  135 | \n  136 |         wxCommand *firstCommand = (wxCommand *)firstNode->GetData();\n  137 |         delete firstCommand;\n  138 |         m_commands.Erase(firstNode);\n  139 |     }","lines":12,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/cmdproc.cpp#L128-L139"}]},
{"id":"PANIC_29","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`wxColourBase::GetAsString()` calls `wxTheColourDatabase->FindName(...)` whenever the `wxC2S_NAME` flag is set and the colour is opaque, without checking that `wxTheColourDatabase` is non-null. The sibling function `wxColourBase::FromString()` explicitly guards the same global (`else if (wxTheColourDatabase)`), showing this pointer can legitimately be null (e.g. early during startup or during shutdown). Calling `GetAsString(wxC2S_NAME)` in such a state dereferences a null pointer.","fix":"Add a null check before using the database:\n```cpp\nif ( (flags & wxC2S_NAME) && isOpaque && wxTheColourDatabase )\n{\n    colName = wxTheColourDatabase->FindName(\n                static_cast<const wxColour &>(*this)).MakeLower();\n}\n```","locations":[{"ref":"src/common/colourcmn.cpp:229-233","code":"  229 |         if ( (flags & wxC2S_NAME) && isOpaque )\n  230 |         {\n  231 |             colName = wxTheColourDatabase->FindName(\n  232 |                         static_cast<const wxColour &>(*this)).MakeLower();\n  233 |         }","lines":5,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/colourcmn.cpp#L229-L233"}]},

{"id":"PANIC_31","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"`wxUpdateUIEvent::CanUpdate()` explicitly guards against a null `win` at the first `if (win && ...)` test, but then unconditionally dereferences `win` in `win->GetParent()` a few lines later. If `win` is null the function crashes. The two current in-tree callers pass `this`, so it is not reachable today, but the inconsistent null handling is a latent defect (either the earlier guard is misleading or this deref is unsafe).","fix":"Guard the second use too:\n```\n    if ( win && win->GetParent() && !win->GetParent()->IsShownOnScreen() )\n        return false;\n```","locations":[{"ref":"src/common/event.cpp:509-519","code":"  509 |     if (win &&\n  510 |        (GetMode() == wxUPDATE_UI_PROCESS_SPECIFIED &&\n  511 |        ((win->GetExtraStyle() & wxWS_EX_PROCESS_UI_UPDATES) == 0)))\n  512 |         return false;\n  513 | \n  514 |     // Don't update children of the hidden windows: this is useless as any\n  515 |     // change to their state won't be seen by the user anyhow. Notice that this\n  516 |     // argument doesn't apply to the hidden windows (with visible parent)\n  517 |     // themselves as they could be shown by their EVT_UPDATE_UI handler.\n  518 |     if ( win->GetParent() && !win->GetParent()->IsShownOnScreen() )\n  519 |         return false;","lines":11,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/event.cpp#L509-L519"}]},
{"id":"PANIC_32","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In `wxJPEGHandler::LoadFile` the `setjmp` recovery block calls `(cinfo.src->term_source)(&cinfo);` unconditionally. `cinfo.src` is only initialized by `wx_jpeg_io_src` (called after `jpeg_create_decompress`). If `error_exit` fires from within `jpeg_create_decompress` itself (e.g. a libjpeg header/ABI version mismatch or allocation failure during creation), the `longjmp` lands here while `cinfo.src` still holds uninitialized stack garbage, and dereferencing `term_source` crashes.","fix":"Guard the call, e.g. `if (cinfo.src) (cinfo.src->term_source)(&cinfo);`, or initialize `cinfo.src = nullptr;` before `jpeg_create_decompress` so the check is meaningful.","locations":[{"ref":"src/common/imagjpeg.cpp:252-265","code":"  252 |     /* Establish the setjmp return context for wx_error_exit to use. */\n  253 |     if (setjmp(jerr.setjmp_buffer)) {\n  254 |       /* If we get here, the JPEG code has signaled an error.\n  255 |        * We need to clean up the JPEG object, close the input file, and return.\n  256 |        */\n  257 |       if (verbose)\n  258 |       {\n  259 |         wxLogError(_(\"JPEG: Couldn't load - file is probably corrupted.\"));\n  260 |       }\n  261 |       (cinfo.src->term_source)(&cinfo);\n  262 |       jpeg_destroy_decompress(&cinfo);\n  263 |       if (image->IsOk()) image->Destroy();\n  264 |       return false;\n  265 |     }","lines":14,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/imagjpeg.cpp#L252-L265"}]},

{"id":"PANIC_35","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`wxMemoryInputStream::CanRead()` unconditionally dereferences `m_i_streambuf` (`return m_i_streambuf->GetIntPosition() != m_length;`). However, when a `wxMemoryInputStream` is constructed from a `wxMemoryOutputStream` (or via `InitFromStream()`) whose length is `wxInvalidOffset`, the constructor sets `m_i_streambuf = nullptr` and returns early. Calling `CanRead()` (a public method) on such a not-OK stream then dereferences a null pointer and crashes. `Peek()` and `OnSysRead()` have the same unguarded dereference.","fix":"Guard against the null buffer, e.g. `return m_i_streambuf && m_i_streambuf->GetIntPosition() != m_length;` in `CanRead()`, and add analogous `if ( !m_i_streambuf ) return ...;` checks in `Peek()`/`OnSysRead()`.","locations":[{"ref":"src/common/mstream.cpp:98-101","code":"   98 | bool wxMemoryInputStream::CanRead() const\n   99 | {\n  100 |     return m_i_streambuf->GetIntPosition() != m_length;\n  101 | }","lines":4,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/mstream.cpp#L98-L101"},{"ref":"src/common/mstream.cpp:53-72","code":"   53 | wxMemoryInputStream::wxMemoryInputStream(const wxMemoryOutputStream& stream)\n   54 | {\n   55 |     const wxFileOffset lenFile = stream.GetLength();\n   56 |     if ( lenFile == wxInvalidOffset )\n   57 |     {\n   58 |         m_i_streambuf = nullptr;\n   59 |         m_lasterror = wxSTREAM_EOF;\n   60 |         return;\n   61 |     }\n   62 | \n   63 |     const size_t len = wx_truncate_cast(size_t, lenFile);\n   64 |     wxASSERT_MSG( len == lenFile + size_t(0), wxT(\"huge files not supported\") );\n   65 | \n   66 |     m_i_streambuf = new wxStreamBuffer(wxStreamBuffer::read);\n   67 |     m_i_streambuf->SetBufferIO(len); // create buffer\n   68 |     stream.CopyTo(m_i_streambuf->GetBufferStart(), len);\n   69 |     m_i_streambuf->SetIntPosition(0); // {"id":"PANIC_36","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`wxSocketBase::Peek()` dereferences `m_impl` (`m_impl->m_fd == INVALID_SOCKET`) without first checking it for null, unlike the read/write paths (`DoRead`/`DoWrite` use `wxCHECK_MSG( m_impl, ... )`). A `wxSocketClient` that was constructed but never (successfully) connected has `m_impl == nullptr` (the ctor only sets buffer sizes; `m_impl` is created in `DoConnect`). Calling `Peek()` on such a socket dereferences a null pointer and crashes.","fix":"Guard against a null implementation at the top of `Peek()`, e.g. add `wxCHECK_MSG( m_impl, *this, \"socket must be valid\" );` (matching the checks used in `DoRead`/`DoWrite`) before dereferencing `m_impl->m_fd`.","locations":[{"ref":"src/common/socket.cpp:1152-1160","code":" 1152 | wxSocketBase& wxSocketBase::Peek(void* buffer, wxUint32 nbytes)\n 1153 | {\n 1154 |     // If we're already closed, don't try switching the invalid socket into\n 1155 |     // non-blocking mode, but still use the already read data, if any.\n 1156 |     if ( m_impl->m_fd == INVALID_SOCKET )\n 1157 |     {\n 1158 |         m_lcount = GetPushback(buffer, nbytes, true);\n 1159 |         return *this;\n 1160 |     }","lines":9,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/socket.cpp#L1152-L1160"}]},
