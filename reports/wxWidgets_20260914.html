{"id":"OVF_14","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"In `wxSVGBitmapEmbedHandler::ProcessBitmap()` the Base64 line-wrapping loop uses the unsigned comparison `i < data.size() - WRAP`. When `data.size()` is smaller than `WRAP` (76), the subtraction `data.size() - WRAP` underflows to a huge `size_t`, so the condition is always true and the `else` branch that appends the closing `\"\\n  />\\n` is never taken. The result is a truncated, malformed `<image>` element (missing closing quote and `/>`). The same happens if `data` is empty (e.g. the PNG conversion produced no bytes), where the opening `xlink:href=\"data:image/png;base64,\\n` is written but never closed.","fix":"Avoid the unsigned underflow, e.g. compare with the remaining length: `if (i + WRAP < data.size())` for the non-final line, or guard the whole loop for `data.size() <= WRAP` / empty data and always emit the closing sequence once after the loop. For example:\n```\nfor ( size_t i = 0; i < data.size(); i += WRAP )\n{\n    if ( i + WRAP < data.size() )\n        s += data.substr(i, WRAP) + \"\\n\";\n    else\n        s += data.substr(i) + \"\\\"\\n  />\\n\";\n}\n```","locations":[{"ref":"src/common/dcsvg.cpp:428-435","code":"  428 |     constexpr unsigned WRAP = 76;\n  429 |     for ( size_t i = 0; i < data.size(); i += WRAP )\n  430 |     {\n  431 |         if (i < data.size() - WRAP)\n  432 |             s += data.substr(i, WRAP) + \"\\n\";\n  433 |         else\n  434 |             s += data.substr(i) + \"\\\"\\n  />\\n\"; // last line\n  435 |     }","lines":8,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/dcsvg.cpp#L428-L435"}]},
{"id":"OVF_15","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"In `wxFTP::GetPassivePort()` the host address is assembled with `(wxUint16)a[2] << 24 | ...`. Each `a[i]` is an `int` in the range 0-255; casting to `wxUint16` still undergoes integer promotion to `int` before the shift, so `(wxUint16)a[2] << 24` can produce a value up to `255 << 24 == 0xFF000000`, which overflows the sign bit of a 32-bit signed `int` (undefined behavior). The intended type for a 32-bit address build is `wxUint32`.","fix":"Cast each octet to `wxUint32` before shifting: `wxUint32 hostaddr = (wxUint32)a[2] << 24 | (wxUint32)a[3] << 16 | (wxUint32)a[4] << 8 | a[5];`.","locations":[{"ref":"src/common/ftp.cpp:643-647","code":"  643 |     wxUint32 hostaddr = (wxUint16)a[2] << 24 |\n  644 |                         (wxUint16)a[3] << 16 |\n  645 |                         (wxUint16)a[4] << 8 |\n  646 |                         a[5];\n  647 |     wxUint16 port = (wxUint16)(a[0] << 8 | a[1]);","lines":5,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/ftp.cpp#L643-L647"}]},
{"id":"OVF_16","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"In `wxImageFloodFill` the queue size `long qSz = height * width * 2;` (both `wxFLOOD_SURFACE` and `wxFLOOD_BORDER` branches) computes `height * width * 2` entirely in `int` arithmetic before widening to `long`. For a large DC/bitmap (roughly > 46000x46000, e.g. a big memory or printer DC) the `int` product overflows, yielding a negative or wrapped `qSz`, which is then passed to `new size_t[qSz]` and used as the circular-queue bound, leading to a bad allocation or a corrupted queue. Even without overflow the queue is over-sized at 16 bytes per pixel.","fix":"Compute the size in a wide type, e.g. `long qSz = (long)height * width * 2;` (or `size_t`), so the multiplication does not overflow `int`.","locations":[{"ref":"src/common/imagfill.cpp:89-91","code":"   89 |         //queue size (physical)\n   90 |         long qSz= height * width * 2;\n   91 |         qst = new size_t [qSz];","lines":3,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/imagfill.cpp#L89-L91"},{"ref":"src/common/imagfill.cpp:184-186","code":"  184 |         //queue size (physical)\n  185 |         long qSz= height * width * 2;\n  186 |         qst = new size_t [qSz];","lines":3,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/imagfill.cpp#L184-L186"}]},
{"id":"OVF_17","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"In `wxConnectionBase::GetTextFromData()` for `wxIPC_UNICODETEXT`, when `size` is non-zero but smaller than `sizeof(wchar_t)` (e.g. a malformed IPC buffer with `size == 2` on a platform where `wchar_t` is 4 bytes), `size /= sizeof(wchar_t)` yields `0` and the subsequent `size--` underflows to `SIZE_MAX`. The `wxASSERT_MSG` above only fires in debug builds; in release the huge length is passed to `wxString(const wchar_t*, size)`, reading far out of bounds and crashing.","fix":"Only decrement after confirming there is at least one full unit, e.g.:\n```cpp\nsize /= sizeof(wchar_t);\nif ( size )\n    size--;\n```\nand bail out (return empty string) when the byte size is not a whole multiple of `sizeof(wchar_t)`.","locations":[{"ref":"src/common/ipcbase.cpp:83-92","code":"   83 |         case wxIPC_UNICODETEXT:\n   84 |             wxASSERT_MSG( !(size % sizeof(wchar_t)), \"invalid buffer size\" );\n   85 |             if ( size )\n   86 |             {\n   87 |                 size /= sizeof(wchar_t);\n   88 |                 size--;\n   89 |             }\n   90 | \n   91 |             s = wxString(static_cast<const wchar_t *>(data), size);\n   92 |             break;","lines":10,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/ipcbase.cpp#L83-L92"}]},
{"id":"OVF_18","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`wxString::EndsWith()` computes `int start = length() - suffix.length();` where both operands are `size_t`. The subtraction is done in unsigned arithmetic and the result is then truncated to `int`. For a string longer than `INT_MAX` (>2GB) that legitimately ends with the suffix, `length() - suffix.length()` exceeds `INT_MAX` and the conversion to `int` yields an implementation-defined (typically negative) value, so `start < 0` incorrectly returns `false` even though the string does end with the suffix. The rest-extraction `rest->assign(*this, 0, start)` would also receive a wrong length.","fix":"Avoid the signed truncation, e.g. compare lengths first and use `size_t` throughout:\n```cpp\nconst size_t lenStr = length(), lenSuffix = suffix.length();\nif ( lenSuffix > lenStr || compare(lenStr - lenSuffix, npos, suffix) != 0 )\n    return false;\nconst size_t start = lenStr - lenSuffix;\n```","locations":[{"ref":"src/common/string.cpp:1068-1082","code":" 1068 | bool wxString::EndsWith(const wxString& suffix, wxString *rest) const\n 1069 | {\n 1070 |     int start = length() - suffix.length();\n 1071 | \n 1072 |     if ( start < 0 || compare(start, npos, suffix) != 0 )\n 1073 |         return false;\n 1074 | \n 1075 |     if ( rest )\n 1076 |     {\n 1077 |         // put the rest of the string into provided pointer\n 1078 |         rest->assign(*this, 0, start);\n 1079 |     }\n 1080 | \n 1081 |     return true;\n 1082 | }","lines":15,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/string.cpp#L1068-L1082"}]},
{"id":"OVF_19","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`wxVariantDataLong::Write(wxOutputStream&)` serializes the `long` value with `s.Write32((size_t)m_value)`, which writes only 32 bits, and `Read(wxInputStream&)` reads it back via `Read32()`. On platforms where `long` is 64-bit (e.g. 64-bit Linux/macOS), any value outside the 32-bit range is silently truncated on a stream round-trip, corrupting the data. The cast to `size_t` is also misleading (it does not preserve sign and is unrelated to the 32-bit wire size). Note the sibling `wxVariantDataLongLong` correctly writes both halves.","fix":"Either write the value as a 64-bit quantity (two `Write32`/`Read32` calls like `wxVariantDataLongLong`), or at minimum drop the misleading `(size_t)` cast and use an explicit `(wxUint32)` cast while documenting the 32-bit limitation. Preferred is preserving full width so large `long` values survive the round-trip.","locations":[{"ref":"src/common/variant.cpp:312-325","code":"  312 | bool wxVariantDataLong::Write(wxOutputStream& str) const\n  313 | {\n  314 |     wxTextOutputStream s(str);\n  315 | \n  316 |     s.Write32((size_t)m_value);\n  317 |     return true;\n  318 | }\n  319 | \n  320 | bool wxVariantDataLong::Read(wxInputStream& str)\n  321 | {\n  322 |    wxTextInputStream s(str);\n  323 |    m_value = s.Read32();\n  324 |    return true;\n  325 | }","lines":14,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/variant.cpp#L312-L325"}]},
{"id":"OVF_20","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`wxWebViewHandlerRequest::GetDataString()` assigns `size_t length = data->GetLength();`. `GetLength()` returns a signed `wxFileOffset` and yields `wxInvalidOffset` (-1) for streams whose length is unknown/non-seekable. Truncating -1 to `size_t` produces `SIZE_MAX`, and the subsequent `buffer.GetWriteBuf(length)` then attempts a gigantic allocation (crash / bad_alloc). The return value of `ReadAll()` is also ignored, so a short read is not detected.","fix":"Check the length before using it: `wxFileOffset len = data->GetLength(); if (len == wxInvalidOffset) return wxString(); size_t length = static_cast<size_t>(len);` and check the `ReadAll()` result before constructing the string.","locations":[{"ref":"src/common/webview.cpp:115-118","code":"  115 |     size_t length = data->GetLength();\n  116 |     wxMemoryBuffer buffer;\n  117 |     data->ReadAll(buffer.GetWriteBuf(length), length);\n  118 |     wxString dataStr(static_cast<const char*>(buffer.GetData()), conv, length);","lines":4,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/webview.cpp#L115-L118"}]},
{"id":"OVF_21","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"The Android fallback `android_mbstowcs()` and `android_wcstombs()` write a terminating `'\\0'` unconditionally after the copy loop `while (outlen-- && *in) *out++ = ...;`. When the input is at least `outlen` characters long the loop writes `outlen` characters and then `*out = '\\0'` writes a `(outlen+1)`-th element, overflowing the caller-supplied buffer by one; when `outlen == 0` the loop body never runs but `*out = '\\0'` still writes to `out[0]`. The standard `mbstowcs`/`wcstombs` contract does not null-terminate when exactly `n` units are produced, so callers sizing buffers to that contract get an out-of-bounds write. Android-only path, hence low severity.","fix":"Stop the loop at `outlen - 1` (reserving one slot) and only write the terminating null when there is room, or don't append a null when the buffer was filled exactly to `outlen`, matching the standard conversion-function semantics.","locations":[{"ref":"src/common/wxcrt.cpp:1248-1268","code":" 1248 | WXDLLEXPORT size_t android_mbstowcs(wchar_t * out, const char * in, size_t outlen)\n 1249 | {\n 1250 |     if (!out)\n 1251 |     {\n 1252 |         size_t outsize = 0;\n 1253 |         while(*in++)\n 1254 |             outsize++;\n 1255 |         return outsize;\n 1256 |     }\n 1257 | \n 1258 |     const char* origin = in;\n 1259 | \n 1260 |     while (outlen-- && *in)\n 1261 |     {\n 1262 |         *out++ = (wchar_t) *in++;\n 1263 |     }\n 1264 | \n 1265 |     *out = '\\0';\n 1266 | \n 1267 |     return in - origin;\n 1268 | }","lines":21,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/wxcrt.cpp#L1248-L1268"},{"ref":"src/common/wxcrt.cpp:1270-1290","code":" 1270 | WXDLLEXPORT size_t android_wcstombs(char * out, const wchar_t * in, size_t outlen)\n 1271 | {\n 1272 |     if (!out)\n 1273 |     {\n 1274 |         size_t outsize = 0;\n 1275 |         while(*in++)\n 1276 |             outsize++;\n 1277 |         return outsize;\n 1278 |     }\n 1279 | \n 1280 |     const wchar_t* origin = in;\n 1281 | \n 1282 |     while (outlen-- && *in)\n 1283 |     {\n 1284 |         *out++ = (char) *in++;\n 1285 |     }\n 1286 | \n 1287 |     *out = '\\0';\n 1288 | \n 1289 |     return in - origin;\n 1290 | }","lines":21,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/wxcrt.cpp#L1270-L1290"}]},
{"id":"OVF_22","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"When deleting the first (`itemPosInNode == 0`) top-level item in `wxDV_VARIABLE_LINE_HEIGHT` mode, `GetRowByItem(parent)` returns `-1` (the parent is the invisible root, for which `GetRowByItem` returns `-1`). The expression `GetRowByItem(parent) + itemPosInNode` then evaluates to `-1`, which is passed to `HeightCache::Remove(unsigned int)` as `0xFFFFFFFF`. `Remove()` invalidates rows `>= row`, so `Remove(UINT_MAX)` invalidates nothing and the row-height cache is left stale, producing incorrect row positions/heights after the deletion. For any deeper parent the same expression is off by one (`GetRowByItem(parent)` is the parent row, the child's row is `parent + 1 + itemPosInNode`), which merely over-invalidates and is harmless, but the top-level case underflows.","fix":"Change `m_rowHeightCache->Remove(GetRowByItem(parent) + itemPosInNode);` to `m_rowHeightCache->Remove(GetRowByItem(parent) + 1 + itemPosInNode);` so that a root parent (`-1`) yields the correct top-level row `itemPosInNode` and no unsigned underflow occurs.","locations":[{"ref":"src/generic/datavgen.cpp:3296-3297","code":" 3296 |         if ( m_rowHeightCache )\n 3297 |             m_rowHeightCache->Remove(GetRowByItem(parent) + itemPosInNode);","lines":2,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/datavgen.cpp#L3296-L3297"}]},
{"id":"OVF_23","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"`GetLastFullyVisibleRow()` returns `wxMax(0, row - 1)` where `row` is `unsigned int`. `wxMax` is a macro expanding to `((0) > (row - 1) ? 0 : (row - 1))`; the `0` is converted to `unsigned` for the comparison, so when `row == 0` (the only visible row is row 0 and it is taller than the client area, so it is not *fully* visible), `row - 1` underflows to `UINT_MAX` and that huge value is returned instead of the intended `0`. Callers such as `EnsureVisibleRowCol()` and the accessibility `GetState()` OFFSCREEN check then misbehave.","fix":"Replace `return wxMax(0, row - 1);` with `return row == 0 ? 0 : row - 1;`","locations":[{"ref":"src/generic/datavgen.cpp:3593-3604","code":" 3593 | unsigned int wxDataViewMainWindow::GetLastFullyVisibleRow()\n 3594 | {\n 3595 |     unsigned int row = GetLastVisibleRow();\n 3596 | \n 3597 |     int bottom = GetLineStart(row) + GetLineHeight(row);\n 3598 |     m_owner->CalcScrolledPosition(-1, bottom, nullptr, &bottom);\n 3599 | \n 3600 |     if ( bottom > GetClientSize().y )\n 3601 |         return wxMax(0, row - 1);\n 3602 |     else\n 3603 |         return row;\n 3604 | }","lines":12,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/datavgen.cpp#L3593-L3604"}]},
{"id":"OVF_24","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"In `wxGenericPrintSetupDialog::Init`, the third token from parsing `lpstat -v` output is indexed as `tmp[tmp.length()-1]` without first checking that `tmp` is non-empty. `wxStringTokenizer::GetNextToken` returns an empty string when there are no more tokens, so if the `lpstat` output line ends right after the `for` token, `tmp.length()-1` underflows to `SIZE_MAX` and `operator[]` performs an out-of-bounds access (assert in debug, UB in release). The input is external (subprocess output).","fix":"Guard against an empty token before indexing:\n```cpp\n    tmp = tok.GetNextToken();          // \"hp_deskjet930c:\"\n    if ( !tmp.empty() && tmp[tmp.length()-1] == wxT(':') )\n        tmp.Remove(tmp.length()-1,1);\n```","locations":[{"ref":"src/generic/prntdlgg.cpp:533-535","code":"  533 |             tmp = tok.GetNextToken();          // \"hp_deskjet930c:\"\n  534 |             if (tmp[tmp.length()-1] == wxT(':'))\n  535 |                 tmp.Remove(tmp.length()-1,1);","lines":3,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/prntdlgg.cpp#L533-L535"}]},
{"id":"OVF_25","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"In `wxSlider::SetRange()` the page increment is computed as `(maxValue - minValue + 9) / 10` using `int` arithmetic. For a large valid range (e.g. `SetRange(0, INT_MAX)` or `SetRange(INT_MIN, INT_MAX)`), `maxValue - minValue` and/or the `+ 9` overflow signed `int`, which is undefined behavior and yields a garbage increment.","fix":"Compute the difference in a wider type, e.g. `gtk_range_set_increments(GTK_RANGE(m_scale), 1, (double(maxValue) - double(minValue) + 9) / 10);` (or clamp/use `wxLongLong`).","locations":[{"ref":"src/gtk/slider.cpp:505","code":"  505 |     gtk_range_set_increments(GTK_RANGE (m_scale), 1, (maxValue - minValue + 9) / 10);","lines":1,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/gtk/slider.cpp#L505"}]},
{"id":"OVF_26","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"In `wxDbgHelpDLL::DumpUDT()`, `dwChildrenCount` is a `DWORD` that stays `0` when `DoGetTypeInfo(pSym, TI_GET_CHILDRENCOUNT, &dwChildrenCount)` fails or when the type genuinely has no children. The allocation size is computed as `sizeof(TI_FINDCHILDREN_PARAMS) + (dwChildrenCount - 1)*sizeof(ULONG)`. When `dwChildrenCount == 0`, `dwChildrenCount - 1` underflows to `0xFFFFFFFF`, turning the `malloc()` request into an unreasonably huge size (multiple GB). The subsequent `if ( !children ) return s;` check happens to save this from becoming a real overflow/crash because such a huge `malloc()` predictably fails, but the practical effect is that every UDT with zero (or unreadable) children silently returns just its bare type name instead of an (empty) `{ }` body, due to an unsigned underflow rather than an intentional early-out.","fix":"Guard against the zero case before subtracting, e.g.:\n\n```cpp\nDWORD dwChildrenCount = 0;\nDoGetTypeInfo(pSym, TI_GET_CHILDRENCOUNT, &dwChildrenCount);\n\nTI_FINDCHILDREN_PARAMS *children = (TI_FINDCHILDREN_PARAMS *)\n    malloc(sizeof(TI_FINDCHILDREN_PARAMS) +\n                (dwChildrenCount > 0 ? dwChildrenCount - 1 : 0)*sizeof(ULONG));\n```","locations":[{"ref":"src/msw/debughlp.cpp:471-480","code":"  471 |     // Determine how many children this type has.\n  472 |     DWORD dwChildrenCount = 0;\n  473 |     DoGetTypeInfo(pSym, TI_GET_CHILDRENCOUNT, &dwChildrenCount);\n  474 | \n  475 |     // Prepare to get an array of \"TypeIds\", representing each of the children.\n  476 |     TI_FINDCHILDREN_PARAMS *children = (TI_FINDCHILDREN_PARAMS *)\n  477 |         malloc(sizeof(TI_FINDCHILDREN_PARAMS) +\n  478 |                     (dwChildrenCount - 1)*sizeof(ULONG));\n  479 |     if ( !children )\n  480 |         return s;","lines":10,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/debughlp.cpp#L471-L480"}]},
{"id":"OVF_27","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`wxJoystick::GetButtonState(unsigned id)` computes `1 << id` where `id` can be up to `31` (guarded only by `id >= sizeof(int) * 8`, i.e. `32`). `1 << 31` shifts a `1` bit into the sign bit of a signed `int`, which is undefined behaviour prior to C++20 (and only well-defined as `INT_MIN` from C++20 on). Since `wxJS_MAX_BUTTONS` is `32`, a joystick that reports the maximum supported button count can legitimately trigger `id == 31`.","fix":"Use an unsigned shift: `return (GetButtonState() & (1u << id)) != 0;` so the shift result is well-defined for `id` up to `31`.","locations":[{"ref":"src/msw/joystick.cpp:254-260","code":"  254 | bool wxJoystick::GetButtonState(unsigned id) const\n  255 | {\n  256 |     if (id >= sizeof(int) * 8)\n  257 |         return false;\n  258 | \n  259 |     return (GetButtonState() & (1 << id)) != 0;\n  260 | }","lines":7,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/joystick.cpp#L254-L260"}]},
{"id":"OVF_28","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"negligible","difficulty":"very_easy","description":"In `wxLog::OnLog(wxLogLevel, const wxString&, time_t)` the millisecond timestamp is computed as `info.timestampMS = 1000*t;`. `1000` is an `int`, so on platforms where `time_t` is a 32-bit type the multiplication is performed in 32-bit arithmetic and overflows for any realistic timestamp (t larger than ~2.1 million seconds), producing a garbage `timestampMS` even though the destination is 64-bit.","fix":"Force 64-bit arithmetic:\n```\n// before\ninfo.timestampMS = 1000*t;\n// after\ninfo.timestampMS = 1000LL*t;\n```","locations":[{"ref":"src/common/log.cpp:342-343","code":"  342 |     wxLogRecordInfo info;\n  343 |     info.timestampMS = 1000*t;","lines":2,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/log.cpp#L342-L343"}]},
{"id":"OVF_29","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"negligible","difficulty":"easy","description":"In `touch_callback()` the `GDK_TOUCH_END`/`GDK_TOUCH_CANCEL` branch unconditionally does `data->m_touchCount--;`, and `m_touchCount` is an `unsigned int`. If an end/cancel event ever arrives without a matching prior begin (e.g. an end delivered right after gesture data was re-initialized, or a lost/duplicated event), the counter underflows from `0` to `UINT_MAX`, after which the `== 1` / `!m_touchCount` checks in this branch misbehave until the count happens to wrap back.","fix":"Guard the decrement, e.g. `if (data->m_touchCount) data->m_touchCount--;`, so the unsigned counter cannot wrap below zero.","locations":[{"ref":"src/gtk/window.cpp:3958-3961","code":" 3958 |         case GDK_TOUCH_END:\n 3959 |         case GDK_TOUCH_CANCEL:\n 3960 |             wxEmulateLeftUpEvent(widget, gdk_event, win);\n 3961 |             data->m_touchCount--;","lines":4,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/gtk/window.cpp#L3958-L3961"}]},
{"id":"OVF_30","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"negligible","difficulty":"very_easy","description":"`wxHtmlTag::GetParamAsInt()` parses the parameter with `ToLong()` into a `long` and then does an unchecked `*clr = (int)i;`. On platforms where `long` is 64-bit, attribute values larger than `INT_MAX` (or smaller than `INT_MIN`) are silently truncated to an arbitrary `int`. Note the sibling `GetParamAsIntOrPercent()` (lines 632-633) explicitly guards against this with `if ( lValue > INT_MAX || lValue < INT_MIN ) return false;`, so the missing check here is inconsistent.","fix":"Add the same range guard used in `GetParamAsIntOrPercent`: `if ( i > INT_MAX || i < INT_MIN ) return false;` before `*clr = (int)i;`.","locations":[{"ref":"src/html/htmltag.cpp:589-600","code":"  589 | bool wxHtmlTag::GetParamAsInt(const wxString& par, int *clr) const\n  590 | {\n  591 |     if ( !HasParam(par) )\n  592 |         return false;\n  593 | \n  594 |     long i;\n  595 |     if ( !GetParam(par).ToLong(&i) )\n  596 |         return false;\n  597 | \n  598 |     *clr = (int)i;\n  599 |     return true;\n  600 | }","lines":12,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/html/htmltag.cpp#L589-L600"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In `wxRealPoint`, the integer overloads of `operator/=` and `operator*=` have swapped bodies: `operator/=(int i)` does `x *= i; y *= i;` (multiplies) while `operator*=(int i)` does `x /= i; y /= i;` (divides). This is the exact inverse of the intended semantics, and contradicts both the correct `double` overloads immediately below (`operator/=(double f)` divides, `operator*=(double f)` multiplies) and the analogous `wxPoint` integer operators (`wxPoint::operator/=(int i)` divides, `wxPoint::operator*=(int i)` multiplies). Any code doing `wxRealPoint p; p *= 2;` will actually halve the coordinates, and `p /= 2;` will double them; additionally `p *= 0;` now performs a division by zero instead of zeroing the point.","fix":"Swap the two bodies so they match their operators (and the `double` overloads):\n```cpp\n    wxRealPoint& operator/=(int i) { x /= i; y /= i; return *this; }\n    wxRealPoint& operator*=(int i) { x *= i; y *= i; return *this; }\n```","locations":[{"ref":"include/wx/gdicmn.h:477-478","code":"  477 |     wxRealPoint& operator/=(int i) { x *= i; y *= i; return *this; }\n  478 |     wxRealPoint& operator*=(int i) { x /= i; y /= i; return *this; }","lines":2,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/gdicmn.h#L477-L478"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In `wxDateTime::ParseFormat`, the `%w` (weekday as number 0-6) case validates the wrong variable. It checks `(wday > 6)` where `wday` is the stale weekday value (initialized to `Inv_WeekDay`, which equals 7), instead of the freshly parsed `num`. Because `wday` starts as `Inv_WeekDay == 7`, the condition `wday > 6` is always true on a fresh parse, so `GetNumericToken` succeeds but the function immediately returns `false`. As a result any format containing `%w` (e.g. parsing `\"3\"` with format `\"%w\"`) always fails. Additionally, `num` is never range-checked, so if a prior `%a`/`%A` set `wday` to a valid value, an out-of-range `num` (e.g. 99) would be cast into `wday = (WeekDay)num` unchecked.","fix":"Validate the parsed number, not the previous weekday. Change:\n```cpp\ncase wxT('w'):       // weekday as a number (0-6), Sunday = 0\n    if ( !GetNumericToken(width, input, end, &num) ||\n            (wday > 6) )\n```\nto:\n```cpp\ncase wxT('w'):       // weekday as a number (0-6), Sunday = 0\n    if ( !GetNumericToken(width, input, end, &num) ||\n            (num > 6) )\n```","locations":[{"ref":"src/common/datetimefmt.cpp:1428-1438","code":" 1428 |             case wxT('w'):       // weekday as a number (0-6), Sunday = 0\n 1429 |                 if ( !GetNumericToken(width, input, end, &num) ||\n 1430 |                         (wday > 6) )\n 1431 |                 {\n 1432 |                     // no match\n 1433 |                     return false;\n 1434 |                 }\n 1435 | \n 1436 |                 haveWDay = true;\n 1437 |                 wday = (WeekDay)num;\n 1438 |                 break;","lines":11,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/datetimefmt.cpp#L1428-L1438"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"`wxMouseEvent::Assign()` copies most members but omits `m_clickCount` and `m_synthesized`. Both the copy constructor `wxMouseEvent(const wxMouseEvent&)` and `operator=` route through `Assign()`, and neither initializes these two members otherwise (the copy ctor only initializes the base classes `wxEvent`/`wxMouseState`). Since neither field has a default member initializer, a copied mouse event has *indeterminate* `m_clickCount` and `m_synthesized`. This matters because `Clone()` does `new wxMouseEvent(*this)` and posted/queued mouse events are cloned, so `GetClickCount()` (double/triple-click detection) and `IsSynthesized()` return garbage on any cloned/posted mouse event (reading uninitialized memory is UB).","fix":"Add the missing copies to `Assign()`:\n```\n    m_wheelAxis = event.m_wheelAxis;\n\n    m_magnification = event.m_magnification;\n    m_clickCount = event.m_clickCount;\n    m_synthesized = event.m_synthesized;\n}\n```","locations":[{"ref":"src/common/event.cpp:607-629","code":"  607 | void wxMouseEvent::Assign(const wxMouseEvent& event)\n  608 | {\n  609 |     wxEvent::operator=(event);\n  610 |     wxMouseState::operator=(event);\n  611 | \n  612 |     m_x = event.m_x;\n  613 |     m_y = event.m_y;\n  614 | \n  615 |     m_leftDown = event.m_leftDown;\n  616 |     m_middleDown = event.m_middleDown;\n  617 |     m_rightDown = event.m_rightDown;\n  618 |     m_aux1Down = event.m_aux1Down;\n  619 |     m_aux2Down = event.m_aux2Down;\n  620 | \n  621 |     m_wheelRotation = event.m_wheelRotation;\n  622 |     m_wheelDelta = event.m_wheelDelta;\n  623 |     m_wheelInverted = event.m_wheelInverted;\n  624 |     m_linesPerAction = event.m_linesPerAction;\n  625 |     m_columnsPerAction = event.m_columnsPerAction;\n  626 |     m_wheelAxis = event.m_wheelAxis;\n  627 | \n  628 |     m_magnification = event.m_magnification;\n  629 | }","lines":23,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/event.cpp#L607-L629"},{"ref":"include/wx/event.h:1809-1814","code":" 1809 |     wxMouseEvent(const wxMouseEvent& event)\n 1810 |         : wxEvent(event),\n 1811 |           wxMouseState(event)\n 1812 |     {\n 1813 |         Assign(event);\n 1814 |     }","lines":6,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/event.h#L1809-L1814"},{"ref":"include/wx/event.h:1920-1925","code":" 1920 |     wxMouseEvent& operator=(const wxMouseEvent& event)\n 1921 |     {\n 1922 |         if (&event != this)\n 1923 |             Assign(event);\n 1924 |         return *this;\n 1925 |     }","lines":6,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/event.h#L1920-L1925"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"`wxUString::assignFromAscii(const char *str, size_type n)` computes `len`, allocates `buffer`, copies the characters into it, but then does `return *this;` instead of `return assign( buffer );`. The buffer is never assigned to the string, so the whole function is a no-op: the `wxUString` is left unchanged (empty). Contrast with the single-argument overload at line 37 which correctly does `return assign( buffer );`.","fix":"Replace the final `return *this;` with `return assign( buffer );` so the filled buffer is actually stored:\n```cpp\n   return assign( buffer );\n```","locations":[{"ref":"src/common/ustring.cpp:40-62","code":"   40 | wxUString &wxUString::assignFromAscii( const char *str, size_type n )\n   41 | {\n   42 |    size_type len = 0;\n   43 |    const char *s = str;\n   44 |    while (len < n && *s)\n   45 |    {\n   46 |        len++;\n   47 |        s++;\n   48 |    }\n   49 | \n   50 |    wxU32CharBuffer buffer( len );\n   51 |    wxChar32 *ptr = buffer.data();\n   52 | \n   53 |    size_type i;\n   54 |    for (i = 0; i < len; i++)\n   55 |    {\n   56 |        *ptr = *str;\n   57 |        ptr++;\n   58 |        str++;\n   59 |    }\n   60 | \n   61 |    return *this;\n   62 | }","lines":23,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/ustring.cpp#L40-L62"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In `wxFileListCtrl::OnListEndLabelEdit`, the branch that detects the target name already exists shows the `File name exists already.` dialog and calls `event.Veto()`, but is missing a `return;`. Execution falls straight through to `if (wxRenameFile(fd->GetFilePath(), new_name))`. Since `wxRenameFile` defaults to `overwrite = true`, the pre-existing file is silently overwritten (data loss) despite the warning and the veto, also leaving the list in an inconsistent state (label edit vetoed visually while the file was actually renamed).","fix":"Add a `return;` after `event.Veto();` in the `if (wxFileExists(new_name))` block:\n```cpp\n    if (wxFileExists(new_name))\n    {\n        wxMessageDialog dialog(this, _(\"File name exists already.\"), _(\"Error\"), wxOK | wxICON_ERROR );\n        dialog.ShowModal();\n        event.Veto();\n        return;\n    }\n```","locations":[{"ref":"src/generic/filectrlg.cpp:764-771","code":"  764 |     if (wxFileExists(new_name))\n  765 |     {\n  766 |         wxMessageDialog dialog(this, _(\"File name exists already.\"), _(\"Error\"), wxOK | wxICON_ERROR );\n  767 |         dialog.ShowModal();\n  768 |         event.Veto();\n  769 |     }\n  770 | \n  771 |     if (wxRenameFile(fd->GetFilePath(),new_name))","lines":8,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/filectrlg.cpp#L764-L771"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`wxPowerResource::Acquire()` returns `false` for a *successful* acquisition whenever the system resource is already held. The guard `if ( !g_powerResourceAcquired++ )` only enters (and only `return true`) when the counter was 0; on any subsequent call the counter is incremented but control falls through to the final `return false`. `wxPowerResourceBlocker` stores this result in `m_acquired` and only calls `Release()` in its destructor when `m_acquired` is `true` (see `include/wx/power.h:129,137`). So with two nested blockers: first ctor -> count=1, returns true; second ctor -> count=2, returns false (m_acquired=false, so its dtor never Releases); second dtor -> no Release (count stays 2); first dtor -> Release decrements count to 1, and since `!--g_powerResourceAcquired` is false, `StopInhibit()` is never called. The inhibit file descriptor is leaked and the system remains permanently prevented from sleeping/shutting down.","fix":"Return `true` when the resource is already acquired instead of falling through to `return false`:\n```\ncase wxPOWER_RESOURCE_SYSTEM:\n    if ( g_powerResourceAcquired++ )\n        return true; // already inhibited\n    if ( !g_proxyLoginManager )\n        g_proxyLoginManager.reset(new wxGDBusLoginManagerProxy);\n    if ( g_proxyLoginManager->StartInhibit(reason, blockKind) )\n        return true;\n    g_powerResourceAcquired--;\n    break;\n```","locations":[{"ref":"src/gtk/power.cpp:309-323","code":"  309 |         case wxPOWER_RESOURCE_SYSTEM:\n  310 |             if ( !g_powerResourceAcquired++ )\n  311 |             {\n  312 |                 if ( !g_proxyLoginManager )\n  313 |                     g_proxyLoginManager.reset(new wxGDBusLoginManagerProxy);\n  314 | \n  315 |                 if ( g_proxyLoginManager->StartInhibit(reason, blockKind) )\n  316 |                     return true;\n  317 | \n  318 |                 g_powerResourceAcquired--;\n  319 |             }\n  320 |             break;\n  321 |     }\n  322 | \n  323 |     return false;","lines":15,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/gtk/power.cpp#L309-L323"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`wxGUIEventLoop::DoYieldFor()` removes messages it doesn't want to dispatch immediately from the queue with `::GetMessage(&msg, nullptr, 0, 0);` (`src/msw/evtloop.cpp:387`) and saves them in `msgsToProcess` to \"put back\" afterwards. When putting them back, it calls `PostThreadMessage(id, m.message, m.wParam, m.lParam)` (`src/msw/evtloop.cpp:401`), silently dropping the original `m.hwnd`. Per the Win32 message-queue semantics, a message retrieved via `GetMessage`/`PeekMessage` after being posted with `PostThreadMessage` always has `msg.hwnd == nullptr`; `DispatchMessage()` does not call any window procedure for such a message and simply returns 0. This means every deferred window-targeted message (mouse clicks, key presses, `WM_COMMAND`, etc. -- exactly the categories excluded by `eventsToProcess`) that goes through this \"save and repost\" path is effectively lost once it's re-dispatched, instead of being delivered to the originally targeted window.","fix":"Preserve the original target window when reposting, only falling back to a genuine thread message when there was none:\n\n```cpp\nDWORD id = GetCurrentThreadId();\nfor ( const auto& m : msgsToProcess )\n{\n    if ( m.hwnd )\n        ::PostMessage(m.hwnd, m.message, m.wParam, m.lParam);\n    else\n        ::PostThreadMessage(id, m.message, m.wParam, m.lParam);\n}\n```","locations":[{"ref":"src/msw/evtloop.cpp:383-392","code":"  383 |         else\n  384 |         {\n  385 |             // remove the message from the queue to ensure that we don't loop\n  386 |             // forever here in any case\n  387 |             ::GetMessage(&msg, nullptr, 0, 0);\n  388 | \n  389 |             // and perhaps save it for processing later\n  390 |             if ( processLater )\n  391 |                 msgsToProcess.push_back(msg);\n  392 |         }","lines":10,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/evtloop.cpp#L383-L392"},{"ref":"src/msw/evtloop.cpp:397-403","code":"  397 |     // put back unprocessed events in the queue\n  398 |     DWORD id = GetCurrentThreadId();\n  399 |     for ( const auto& m : msgsToProcess )\n  400 |     {\n  401 |         PostThreadMessage(id, m.message, m.wParam, m.lParam);\n  402 |     }\n  403 | }","lines":7,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/evtloop.cpp#L397-L403"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In `wxIOCPThread::ProcessNativeEvents()`, when a native event's mapped flags don't match what the watch was asked for (`if (!(flags & watch->GetFlags()))`), the code does `return;` instead of `continue;`. Since this is inside a `for` loop iterating over all `events` extracted from one `ReadDirectoryChangesW` buffer, hitting one filtered-out/ignored event (e.g. any `FILE_ACTION_RENAMED_NEW_NAME`, which `Native2WatcherFlags()` always maps to `0`, or any change type the caller didn't subscribe to) causes the function to return immediately and silently drop every remaining event still pending in that batch, instead of just skipping the one that didn't match.","fix":"Replace the early `return;` with `continue;` so only the current (non-matching) event is skipped and the rest of the batch is still processed:\n\n```cpp\nconst int flags = Native2WatcherFlags(e.Action);\n// filter out ignored events (with flags == 0) and those not asked for.\nif (!(flags & watch->GetFlags()))\n{\n    continue;\n}\n```","locations":[{"ref":"src/msw/fswatcher.cpp:318-367","code":"  318 | void wxIOCPThread::ProcessNativeEvents(wxVector<wxEventProcessingData>& events)\n  319 | {\n  320 |     wxVector<wxEventProcessingData>::iterator it = events.begin();\n  321 |     for ( ; it != events.end(); ++it )\n  322 |     {\n  323 |         const FILE_NOTIFY_INFORMATION& e = *(it->nativeEvent);\n  324 |         const wxFSWatchEntryMSW* watch = it->watch;\n  325 | \n  326 |         wxLogTrace( wxTRACE_FSWATCHER, \"[iocp] %s\",\n  327 |                     FileNotifyInformationToString(e));\n  328 | \n  329 |         const int flags = Native2WatcherFlags(e.Action);\n  330 |         // filter out ignored events (with flags == 0) and those not asked for.\n  331 |         if (!(flags & watch->GetFlags()))\n  332 |         {\n  333 |             return;\n  334 |         }\n  335 | \n  336 |         // rename case\n  337 |         if (e.Action == FILE_ACTION_RENAMED_OLD_NAME)\n  338 |         {\n  339 |             wxFileName oldpath = GetEventPath(*watch, e);\n  340 |             wxFileName newpath;\n  341 | \n  342 |             // newpath should be in the next entry. what if there isn't?\n  343 |             ++it;\n  344 |             if ( it != events.end() )\n  345 |             {\n  346 |                 newpath = GetEventPath(*(it->watch), *(it->nativeEvent));\n  347 |             }\n  348 |             wxFileSystemWatcherEvent event(flags, oldpath, newpath);\n  349 |             SendEvent(event);\n  350 |             if ( it == events.end() )\n  351 |                 break;\n  352 |         }\n  353 |         // all other events\n  354 |         else\n  355 |         {\n  356 |             // CHECK I heard that returned path can be either in short on long\n  357 |             // form...need to account for that!\n  358 |             wxFileName path = GetEventPath(*watch, e);\n  359 |             // For files, check that it matches any filespec\n  360 |             if ( m_service->MatchesFilespec(path, watch->GetFilespec()) )\n  361 |             {\n  362 |                 wxFileSystemWatcherEvent event(flags, path, path);\n  363 |                 SendEvent(event);\n  364 |             }\n  365 |         }\n  366 |     }\n  367 | }","lines":50,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/fswatcher.cpp#L318-L367"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"The Solaris implementation of `wxAtomicInc` is declared with return type `void` while every other platform variant (`HAVE_GCC_ATOMIC_BUILTINS`, `__WINDOWS__`, `__DARWIN__`, non-threads) returns `wxUint32`. Its body `return atomic_add_32_nv((uint32_t*)&value, 1);` is itself ill-formed because it returns a non-void expression from a `void` function. Worse, the generic proxy `inline wxInt32 wxAtomicInc(wxInt32 &value) { return wxAtomicInc((wxUint32&)value); }` at line 144 tries to `return` the result of this `void` function inside a `wxInt32`-returning function, so any wxWidgets code using `wxAtomicInc` on Solaris with `wxUSE_THREADS` will fail to compile. The companion `wxAtomicDec` on Solaris is correctly declared to return `wxUint32`, confirming the `void` on `wxAtomicInc` is a copy/typo mistake.","fix":"Change the Solaris `wxAtomicInc` return type from `void` to `wxUint32` to match all other variants:\n```cpp\ninline wxUint32 wxAtomicInc (wxUint32 &value)\n{\n    return atomic_add_32_nv ((uint32_t*)&value, 1);\n}\n```","locations":[{"ref":"include/wx/atomic.h:74-82","code":"   74 | inline void wxAtomicInc (wxUint32 &value)\n   75 | {\n   76 |     return atomic_add_32_nv ((uint32_t*)&value, 1);\n   77 | }\n   78 | \n   79 | inline wxUint32 wxAtomicDec (wxUint32 &value)\n   80 | {\n   81 |     return atomic_add_32_nv ((uint32_t*)&value, (uint32_t)-1);\n   82 | }","lines":9,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/atomic.h#L74-L82"},{"ref":"include/wx/atomic.h:144-145","code":"  144 | inline wxInt32 wxAtomicInc(wxInt32 &value) { return wxAtomicInc((wxUint32&)value); }\n  145 | inline wxInt32 wxAtomicDec(wxInt32 &value) { return wxAtomicDec((wxUint32&)value); }","lines":2,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/atomic.h#L144-L145"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`wxBaseObjectArray::Index(const T& item, bool bFromEnd)` never examines element index `0` when searching from the end. The `do { ... ui--; } while ( ui != 0 )` loop runs its body for `ui = size()-1` down to `ui = 1`; once `ui` is decremented to `0` the `while ( ui != 0 )` condition is false and the body is skipped, so an item stored at index `0` returns `wxNOT_FOUND` even though it is present. The forward branch (`bFromEnd == false`) checks all indices correctly, so the two branches disagree.","fix":"Rewrite the reverse scan so index `0` is included. Replace\n```cpp\nif ( size() > 0 )\n{\n    size_t ui = size() - 1;\n    do\n    {\n        if ( base::operator[](ui) == &item )\n            return static_cast<int>(ui);\n        ui--;\n    }\n    while ( ui != 0 );\n}\n```\nwith\n```cpp\nsize_t ui = size();\nwhile ( ui-- > 0 )\n{\n    if ( base::operator[](ui) == &item )\n        return static_cast<int>(ui);\n}\n```","locations":[{"ref":"include/wx/dynarray.h:359-385","code":"  359 |     int Index(const T& item, bool bFromEnd = false) const\n  360 |     {\n  361 |         if ( bFromEnd )\n  362 |         {\n  363 |             if ( size() > 0 )\n  364 |             {\n  365 |                 size_t ui = size() - 1;\n  366 |                 do\n  367 |                 {\n  368 |                     if ( base::operator[](ui) == &item )\n  369 |                         return static_cast<int>(ui);\n  370 |                     ui--;\n  371 |                 }\n  372 |                 while ( ui != 0 );\n  373 |             }\n  374 |         }\n  375 |         else\n  376 |         {\n  377 |             for ( size_t ui = 0; ui < size(); ++ui )\n  378 |             {\n  379 |                 if( base::operator[](ui) == &item )\n  380 |                     return static_cast<int>(ui);\n  381 |             }\n  382 |         }\n  383 | \n  384 |         return wxNOT_FOUND;\n  385 |     }","lines":27,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/dynarray.h#L359-L385"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"The single-flag constructor `wxBitset(const T el)` uses `m_data |= 1 << el;` but `m_data` is a raw `unsigned long` member that is *not* initialized before this compound-assignment. Unlike the default ctor (`wxBitset() { m_data = 0; }`) and the `unsigned long` ctor (`m_data = val;`), this constructor reads the uninitialized `m_data` and OR's into it, so a `wxBitset<T> b = someEnumValue;` produces a bitset with garbage extra bits set (undefined behaviour, reading an indeterminate value). It should assign, not OR.","fix":"Initialize the member instead of OR-ing into an indeterminate value:\n```cpp\nwxBitset(const T el) { m_data = 1 << el; }\n```\ninstead of\n```cpp\nwxBitset(const T el) { m_data |= 1 << el; }\n```","locations":[{"ref":"include/wx/flags.h:36","code":"   36 |     wxBitset(const T el) { m_data |= 1 << el; }","lines":1,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/flags.h#L36"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`wxRect2DInt::Scale(wxInt32 num, wxInt32 denum)` scales each coordinate by `((wxInt32)num)/((wxInt32)denum)`, which is integer division computed *before* multiplying. So `Scale(3, 2)` multiplies by `1` (since `3/2 == 1`) and `Scale(1, 2)` multiplies by `0`, collapsing the rectangle to the origin. The sibling `wxRect2DDouble::Scale(num, denum)` correctly casts to `wxDouble` first (`((wxDouble)num)/((wxDouble)denum)`), so this is a copy-paste of the double version where `wxDouble` was blindly replaced by `wxInt32`, silently breaking fractional scaling. The `(wxInt32)` casts are also no-ops since `num`/`denum` are already `wxInt32`.","fix":"Compute the product before dividing so the ratio isn't truncated first:\n```cpp\ninline void Scale( wxInt32 num , wxInt32 denum )\n    { m_x = m_x * num / denum; m_y = m_y * num / denum;\n        m_width = m_width * num / denum; m_height = m_height * num / denum;}\n```","locations":[{"ref":"include/wx/geometry.h:789-791","code":"  789 |         inline void Scale( wxInt32 num , wxInt32 denum )\n  790 |             { m_x *= ((wxInt32)num)/((wxInt32)denum); m_y *= ((wxInt32)num)/((wxInt32)denum);\n  791 |                 m_width *= ((wxInt32)num)/((wxInt32)denum); m_height *= ((wxInt32)num)/((wxInt32)denum);}","lines":3,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/geometry.h#L789-L791"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`AutoSystemDpiAware`'s destructor restores the thread DPI awareness context unconditionally whenever the static function pointer `ms_pfnSetThreadDpiAwarenessContext` has been resolved, but the constructor may have returned early (when `Needed()` is `false`) without ever changing the context. In that case `m_prevContext` is left at its initial sentinel value `WXDPI_AWARENESS_CONTEXT_UNAWARE` (`(WXDPI_AWARENESS_CONTEXT)-1`), so the destructor calls `ms_pfnSetThreadDpiAwarenessContext(WXDPI_AWARENESS_CONTEXT_UNAWARE)` and actively forces the thread into UNAWARE mode that it never touched. The `ms_pfn... != (SetThreadDpiAwarenessContext_t)-1` guard only protects the very first use: once any earlier `Needed()==true` instance has loaded the pointer, every later `Needed()==false` instance corrupts the thread's DPI awareness on scope exit, breaking DPI scaling for subsequent native dialogs on that thread.","fix":"Track whether the context was actually changed rather than reusing the sentinel. E.g. add a `bool m_changed = false;` member, set it to `true` right after a successful `ms_pfnSetThreadDpiAwarenessContext(...)` call in the ctor, and guard the dtor with `if ( m_changed ) ms_pfnSetThreadDpiAwarenessContext(m_prevContext);`. Alternatively initialize `m_prevContext` to `nullptr` and only restore when it is non-null and different from the sentinel.","locations":[{"ref":"include/wx/msw/private/dpiaware.h:37-69","code":"   37 |     AutoSystemDpiAware()\n   38 |         : m_prevContext(WXDPI_AWARENESS_CONTEXT_UNAWARE)\n   39 |     {\n   40 |         if ( !Needed() )\n   41 |             return;\n   42 | \n   43 |         if ( ms_pfnSetThreadDpiAwarenessContext == (SetThreadDpiAwarenessContext_t)-1)\n   44 |         {\n   45 |             wxLoadedDLL dllUser32(\"user32.dll\");\n   46 |             wxDL_INIT_FUNC(ms_pfn, SetThreadDpiAwarenessContext, dllUser32);\n   47 |         }\n   48 | \n   49 |         if ( ms_pfnSetThreadDpiAwarenessContext )\n   50 |         {\n   51 |             m_prevContext = ms_pfnSetThreadDpiAwarenessContext(\n   52 |                                     WXDPI_AWARENESS_CONTEXT_UNAWARE_GDISCALED);\n   53 |             if ( !m_prevContext )\n   54 |             {\n   55 |                 m_prevContext = ms_pfnSetThreadDpiAwarenessContext(\n   56 |                                     WXDPI_AWARENESS_CONTEXT_SYSTEM_AWARE);\n   57 |             }\n   58 |         }\n   59 | \n   60 |     }\n   61 | \n   62 |     ~AutoSystemDpiAware()\n   63 |     {\n   64 |         if ( ms_pfnSetThreadDpiAwarenessContext &&\n   65 |                 ms_pfnSetThreadDpiAwarenessContext != (SetThreadDpiAwarenessContext_t)-1 )\n   66 |         {\n   67 |             ms_pfnSetThreadDpiAwarenessContext(m_prevContext);\n   68 |         }\n   69 |     }","lines":33,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/msw/private/dpiaware.h#L37-L69"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `misc/scripts/png2c.py`, the filename-validation regex `r = re.compile(\"^([a-zA-Z._][a-zA-Z._0-9]*)[.][pP][nN][gG]$\")` allows literal `.` characters inside the captured group `m.group(1)`, which is then used verbatim as part of a generated C identifier (`%s%s_png`). For any input PNG whose basename contains more than one dot (e.g. `my.icon.png`, or the real repository file `tests/image/toucan_hsv_0.538_-0.41_-0.259.png`), `m.group(1)` becomes `my.icon` / `toucan_hsv_0.538__0.41__0.259`, producing an invalid C identifier such as `static const unsigned char my.icon_png[] = { ... };`. The script does not detect this and silently emits broken, non-compilable C source instead of skipping the file or sanitizing the dots like it already does for `-` and `@` via `sanitize = str.maketrans('-@', '__')`.","fix":"Also translate/strip `.` from the basename before matching (except the trailing `.png` extension), e.g. sanitize `-`, `@`, and internal `.` the same way: `sanitize = str.maketrans('-@.', '___')` applied only to `os.path.splitext(filename)[0]`, then re-append `.png` before matching. Alternatively, tighten the regex so the capture group cannot contain `.`, e.g. `re.compile(r\"^([a-zA-Z_][a-zA-Z_0-9]*)\\.[pP][nN][gG]$\")`, and reject/warn on filenames with extra dots instead of silently emitting invalid identifiers.","locations":[{"ref":"misc/scripts/png2c.py:26-44","code":"   26 | r = re.compile(\"^([a-zA-Z._][a-zA-Z._0-9]*)[.][pP][nN][gG]$\")\n   27 | \n   28 | # Automatically replace some symbols in the filenames.\n   29 | sanitize = str.maketrans('-@', '__')\n   30 | \n   31 | with_size = 0\n   32 | size_suffix = ''\n   33 | for path in sys.argv[1:]:\n   34 |         if path == '-s':\n   35 |             with_size = 1\n   36 |             continue\n   37 | \n   38 |         filename = os.path.basename(path).translate(sanitize)\n   39 |         m = r.match(filename)\n   40 | \n   41 |         # Allow only filenames that make sense as C variable names\n   42 |         if not(m):\n   43 |                 print(\"Skipped file (unsuitable filename): \" + filename, file=sys.stderr)\n   44 |                 continue","lines":19,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/misc/scripts/png2c.py#L26-L44"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`wxArtProviderCache::Clear()` clears `m_bitmapsHash` and `m_iconBundlesHash` but forgets to clear `m_bitmapsBundlesHash`. `Clear()` is the cache-invalidation hook called from `CommonAddingProvider()`, `Push()`, `Pop()` and `Remove()` whenever the provider stack changes. Because the bitmap-bundle cache is never flushed, `wxArtProvider::GetBitmapBundle()` keeps returning stale `wxBitmapBundle` objects produced by providers that have since been pushed on top, popped, or removed, so art requested after a provider change silently returns the wrong image.","fix":"Add the missing clear so all three caches are invalidated together:\n```cpp\nvoid wxArtProviderCache::Clear()\n{\n    m_bitmapsHash.clear();\n    m_bitmapsBundlesHash.clear();\n    m_iconBundlesHash.clear();\n}\n```","locations":[{"ref":"src/common/artprov.cpp:119-123","code":"  119 | void wxArtProviderCache::Clear()\n  120 | {\n  121 |     m_bitmapsHash.clear();\n  122 |     m_iconBundlesHash.clear();\n  123 | }","lines":5,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/artprov.cpp#L119-L123"},{"ref":"src/common/artprov.cpp:497-527","code":"  497 |     if ( !sm_cache->GetBitmapBundle(hashId, &bitmapbundle) )\n  498 |     {\n  499 |         for (const auto& provider : *sm_providers)\n  500 |         {\n  501 |             bitmapbundle = provider->CreateBitmapBundle(id, client, size);\n  502 |             if ( bitmapbundle.IsOk() )\n  503 |                 break;\n  504 | \n  505 |             // Try creating the bundle from individual bitmaps returned by the\n  506 |             // provider because they can be available in more than one size,\n  507 |             // i.e. it's better to return a custom bundle returning them in the\n  508 |             // size closest to the requested one rather than a simple bundle\n  509 |             // just containing the single bitmap in the specified size.\n  510 |             //\n  511 |             // Note that we do this here rather than outside of this loop\n  512 |             // because we consider that a simple bitmap defined in a higher\n  513 |             // priority provider should override a bitmap bundle defined in a\n  514 |             // lower priority one: even if this means that the bitmap will be\n  515 |             // scaled, at least we'll be using the expected bitmap rather than\n  516 |             // potentially using a bitmap of a different style.\n  517 |             const wxBitmap& bitmap = provider->CreateBitmap(id, client, size);\n  518 |             if ( bitmap.IsOk() )\n  519 |             {\n  520 |                 bitmapbundle = wxBitmapBundle::FromImpl(\n  521 |                         new wxBitmapBundleImplArt(bitmap, id, client, size)\n  522 |                     );\n  523 |                 break;\n  524 |             }\n  525 |         }\n  526 | \n  527 |         sm_cache->PutBitmapBundle(hashId, bitmapbundle);","lines":31,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/artprov.cpp#L497-L527"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `wxBitmapBundle::FromFiles()`, the third naming scheme is documented as `2.0x/image.png` (original file name inside a `2.0x` subdirectory), but the code reaches this branch only after the second scheme already called `fn.SetName(wxString::Format(\"%s_%dx\", filename, dpiFactor))`. The name is therefore still `image_2x` when `fn.AppendDir(wxString::Format(\"%d.0x\", dpiFactor))` runs, so it actually looks for `2.0x/image_2x.png` instead of `2.0x/image.png`. The high-DPI file placed under a `2.0x` subfolder with its original name will never be found.","fix":"Reset the base name before appending the subdirectory. Change:\n```cpp\nif ( !found && dpiFactor != 1 )\n{\n    // try yet another alternative naming scheme (2.0x/image.png)\n    fn.AppendDir(wxString::Format(\"%d.0x\", dpiFactor));\n    found = fn.FileExists();\n}\n```\nto:\n```cpp\nif ( !found && dpiFactor != 1 )\n{\n    // try yet another alternative naming scheme (2.0x/image.png)\n    fn.SetName(filename);\n    fn.AppendDir(wxString::Format(\"%d.0x\", dpiFactor));\n    found = fn.FileExists();\n}\n```","locations":[{"ref":"src/common/bmpbndl.cpp:594-599","code":"  594 |         if ( !found && dpiFactor != 1 )\n  595 |         {\n  596 |             // try yet another alternative naming scheme (2.0x/image.png)\n  597 |             fn.AppendDir(wxString::Format(\"%d.0x\", dpiFactor));\n  598 |             found = fn.FileExists();\n  599 |         }","lines":6,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/bmpbndl.cpp#L594-L599"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `wxMimeTypesManager::GetFileTypeFromExtension()` the leading dot is stripped into `extWithoutDot` and that is passed to `m_impl->GetFileTypeFromExtension(extWithoutDot)`, but the fallback loop matches against the original `ext` via `fallback.GetExtensions().Index(ext)`. Fallback extensions are stored without a leading dot, so when the caller passes an extension with a dot (e.g. `\".txt\"`), the primary lookup uses `\"txt\"` while the fallback lookup uses `\".txt\"` and never matches, silently missing a fallback file type that should have been found. The fallback comparison should use `extWithoutDot` for consistency.","fix":"Use `extWithoutDot` when searching the fallbacks so both lookups are consistent: change `if ( fallback.GetExtensions().Index(ext) != wxNOT_FOUND )` to `if ( fallback.GetExtensions().Index(extWithoutDot) != wxNOT_FOUND )`.","locations":[{"ref":"src/common/mimecmn.cpp:565-596","code":"  565 | wxFileType *\n  566 | wxMimeTypesManager::GetFileTypeFromExtension(const wxString& ext)\n  567 | {\n  568 |     EnsureImpl();\n  569 | \n  570 |     wxString::const_iterator i = ext.begin();\n  571 |     const wxString::const_iterator end = ext.end();\n  572 |     wxString extWithoutDot;\n  573 |     if ( i != end && *i == '.' )\n  574 |         extWithoutDot.assign(++i, ext.end());\n  575 |     else\n  576 |         extWithoutDot = ext;\n  577 | \n  578 |     wxCHECK_MSG( !ext.empty(), nullptr, wxT(\"extension can't be empty\") );\n  579 | \n  580 |     wxFileType *ft = m_impl->GetFileTypeFromExtension(extWithoutDot);\n  581 | \n  582 |     if ( !ft ) {\n  583 |         // check the fallbacks\n  584 |         //\n  585 |         // TODO linear search is potentially slow, perhaps we should use a\n  586 |         //       sorted array?\n  587 |         for ( const auto& fallback : m_fallbacks ) {\n  588 |             if ( fallback.GetExtensions().Index(ext) != wxNOT_FOUND ) {\n  589 |                 ft = new wxFileType(fallback);\n  590 | \n  591 |                 break;\n  592 |             }\n  593 |         }\n  594 |     }\n  595 | \n  596 |     return ft;","lines":32,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/mimecmn.cpp#L565-L596"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`wxRegExImpl::Replace()` can loop forever on a pattern that matches the empty string. Inside the `while` loop, after a successful match `matchStart` is advanced only by `start` and `len` (`matchStart += start; ... matchStart += len;`). If the regex matches an empty substring (`start == 0` and `len == 0`) at the current position - which happens for common patterns like `a*`, `.*`, `x?`, etc. - `matchStart` never moves forward, `Matches()` finds the same zero-length match again, and with the default `maxMatches == 0` (no limit) the loop never terminates. A plain call such as `wxRegEx(\"a*\").Replace(&s, \"X\")` hangs the calling thread.","fix":"Detect zero-length matches and force progress. After computing `start`/`len` for the match, if `len == 0` copy one character verbatim and advance: e.g. after `matchStart += start;` handle the empty case by appending `textstr[matchStart]` to `result`, doing `matchStart++`, and `continue`-ing the loop (taking care not to read past `textlen`). Alternatively bail out of the loop when a zero-length match repeats at the same `matchStart`.","locations":[{"ref":"src/common/regex.cpp:1135-1222","code":" 1135 |     while ( (!maxMatches || countRepl < maxMatches) &&\n 1136 |              Matches(textstr + matchStart,\n 1137 |                      countRepl ? wxRE_NOTBOL : 0,\n 1138 |                      textlen - matchStart) )\n 1139 |     {\n 1140 |         // the string possibly contains back references: we need to calculate\n 1141 |         // the replacement text anew after each match\n 1142 |         if ( mayHaveBackrefs )\n 1143 |         {\n 1144 |             mayHaveBackrefs = false;\n 1145 |             textNew.clear();\n 1146 |             textNew.reserve(replacement.length());\n 1147 | \n 1148 |             for ( const wxChar *p = replacement.c_str(); *p; p++ )\n 1149 |             {\n 1150 |                 size_t index = (size_t)-1;\n 1151 | \n 1152 |                 if ( *p == wxT('\\\\') )\n 1153 |                 {\n 1154 |                     if ( wxIsdigit(*++p) )\n 1155 |                     {\n 1156 |                         // back reference\n 1157 |                         wxChar *end;\n 1158 |                         index = (size_t)wxStrtoul(p, &end, 10);\n 1159 |                         p = end - 1; // -1 to compensate for p++ in the loop\n 1160 |                     }\n 1161 |                     else if ( !*p )\n 1162 |                     {\n 1163 |                         // trailing backslash: keep it verbatim and stop here so\n 1164 |                         // the loop's p++ doesn't read past the terminating NUL\n 1165 |                         textNew += wxT('\\\\');\n 1166 |                         break;\n 1167 |                     }\n 1168 |                     //else: backslash used as escape character\n 1169 |                 }\n 1170 |                 else if ( *p == wxT('&') )\n 1171 |                 {\n 1172 |                     // treat this as \"\\0\" for compatbility with ed and such\n 1173 |                     index = 0;\n 1174 |                 }\n 1175 | \n 1176 |                 // do we have a back reference?\n 1177 |                 if ( index != (size_t)-1 )\n 1178 |                 {\n 1179 |                     // yes, get its text\n 1180 |                     size_t start, len;\n 1181 |                     if ( !GetMatch(&start, &len, index) )\n 1182 |                     {\n 1183 |                         wxFAIL_MSG( wxT(\"invalid back reference\") );\n 1184 | \n 1185 |                         // just eat it...\n 1186 |                     }\n 1187 |                     else\n 1188 |                     {\n 1189 |                         textNew += wxString(textstr + matchStart + start, len);\n 1190 | \n 1191 |                         mayHaveBackrefs = true;\n 1192 |                     }\n 1193 |                 }\n 1194 |                 else // ordinary character\n 1195 |                 {\n 1196 |                     textNew += *p;\n 1197 |                 }\n 1198 |             }\n 1199 |         }\n 1200 | \n 1201 |         size_t start, len;\n 1202 |         if ( !GetMatch(&start, &len) )\n 1203 |         {\n 1204 |             // we did have match as Matches() returned true above!\n 1205 |             wxFAIL_MSG( wxT(\"internal logic error in wxRegEx::Replace\") );\n 1206 | \n 1207 |             return wxNOT_FOUND;\n 1208 |         }\n 1209 | \n 1210 |         // an insurance against implementations that don't grow exponentially\n 1211 |         // to ensure building the result takes linear time\n 1212 |         if (result.capacity() < result.length() + start + textNew.length())\n 1213 |             result.reserve(2 * result.length());\n 1214 | \n 1215 |         result.append(wxString(textstr + matchStart, start));\n 1216 |         matchStart += start;\n 1217 |         result.append(textNew);\n 1218 | \n 1219 |         countRepl++;\n 1220 | \n 1221 |         matchStart += len;\n 1222 |     }","lines":88,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/regex.cpp#L1135-L1222"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `wxUniChar::AsUTF8()` the 3-byte UTF-8 range is tested with `else if ( code < 0xFFFF )`, which is exclusive of `0xFFFF`. Per the encoding table in the same function (`0000 0800 - 0000 FFFF | 1110xxxx 10xxxxxx 10xxxxxx`) the 3-byte range must include `U+FFFF`. Because the 1- and 2-byte branches use inclusive tests (`code <= 0x7F`, `code <= 0x07FF`), the code point `U+FFFF` is not handled by the 3-byte branch and instead falls through to the 4-byte branch `else if ( code <= 0x10FFFF )`. This encodes `U+FFFF` as the 4-byte sequence `F0 8F BF BF`, which is an overlong/invalid UTF-8 sequence (`F0` requires a second byte in `90..BF`, but `8F` is produced). This malformed output is exactly what `wxStringOperationsUtf8::IsValidUtf8String()` in this very file rejects, so encoding a string containing `U+FFFF` in a UTF-8 build produces corrupt bytes and can trigger UTF-8 validation asserts.","fix":"Make the 3-byte boundary inclusive of `0xFFFF`, matching the other branches. Change:\n```cpp\n    else if ( code < 0xFFFF )\n```\nto:\n```cpp\n    else if ( code <= 0xFFFF )\n```\n(equivalently `code < 0x10000`).","locations":[{"ref":"src/common/stringops.cpp:262-268","code":"  262 |     else if ( code < 0xFFFF )\n  263 |     {\n  264 |         out[3] = 0;\n  265 |         out[2] = 0x80 | (code & 0x3F);  code >>= 6;\n  266 |         out[1] = 0x80 | (code & 0x3F);  code >>= 6;\n  267 |         out[0] = 0xE0 | code;\n  268 |     }","lines":7,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/stringops.cpp#L262-L268"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `wxTreeCtrlBase::SetItemState`, the `wxTREE_ITEMSTATE_PREV` branch wraps a state index of `-1` (decrementing from state `0`) to `m_imagesState.GetImageCount()`, which is one past the last valid image index. Valid state-image indices are `0 .. GetImageCount()-1`, as confirmed by the `NEXT` branch which wraps `count` back to `0`. So decrementing from the first state yields an out-of-range index instead of the last image.","fix":"Wrap to the last valid index:\n```cpp\n        if ( state == -1 )\n            state = m_imagesState.GetImageCount() - 1;\n```","locations":[{"ref":"src/common/treebase.cpp:190-198","code":"  190 |     else if ( state == wxTREE_ITEMSTATE_PREV )\n  191 |     {\n  192 |         int current = GetItemState(item);\n  193 |         if ( current == wxTREE_ITEMSTATE_NONE )\n  194 |             return;\n  195 |         state = current - 1;\n  196 |         if ( state == -1 )\n  197 |             state = m_imagesState.GetImageCount();\n  198 |     }","lines":9,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/treebase.cpp#L190-L198"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`WebRequestModule::OnExit()` is documented as the module \"ensuring all global/singleton objects are destroyed on shutdown\", but it only closes `gs_defaultSession` and forgets the second global session singleton `gs_defaultSessionSync` (declared at line 966 and lazily created in `wxWebSessionSync::GetDefault()`). As a result the synchronous default session's backend impl (which can own native network handles, e.g. a CURL/WinHTTP session) is not released during wxWidgets shutdown and only gets torn down at static-destruction time, after the module/library cleanup has already run - a resource leak and a potential crash-on-exit depending on the backend. This looks like a copy-paste omission mirroring the async session handling.","fix":"Close the sync default session too:\n```cpp\n    virtual void OnExit() override\n    {\n        gs_factoryMap.clear();\n        gs_defaultSession.Close();\n        gs_defaultSessionSync.Close();\n    }\n```","locations":[{"ref":"src/common/webrequest.cpp:1263-1267","code":" 1263 |     virtual void OnExit() override\n 1264 |     {\n 1265 |         gs_factoryMap.clear();\n 1266 |         gs_defaultSession.Close();\n 1267 |     }","lines":5,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/webrequest.cpp#L1263-L1267"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `wxWebViewChromiumHandlerRequest::SetData()` the write `offset` into `m_buffer` is initialized to `0` and never incremented, while `size` accumulates across POST-data elements. When a request has more than one `PDE_TYPE_BYTES` element, every element after the first is written with `element->GetBytes(read_size, m_buffer.data() + offset)` at `offset == 0`, overwriting the previously copied bytes instead of appending. The resulting `wxMemoryInputStream` contains corrupted POST data (only the last element's bytes at the front, followed by uninitialized/garbage capacity).","fix":"Advance `offset` after each copy so subsequent elements are appended. Before:\n```cpp\n                read_size = element->GetBytesCount();\n                size += read_size;\n                m_buffer.resize(size);\n                element->GetBytes(read_size, m_buffer.data() + offset);\n```\nAfter:\n```cpp\n                read_size = element->GetBytesCount();\n                size += read_size;\n                m_buffer.resize(size);\n                element->GetBytes(read_size, m_buffer.data() + offset);\n                offset += read_size;\n```","locations":[{"ref":"src/common/webview_chromium.cpp:1994-2011","code":" 1994 |         CefPostData::ElementVector elements;\n 1995 |         int offset = 0;\n 1996 |         int read_size = 0;\n 1997 |         int size = 0;\n 1998 | \n 1999 |         m_buffer.clear();\n 2000 |         data->GetElements(elements);\n 2001 |         for ( const auto& element : elements )\n 2002 |         {\n 2003 |             if ( element->GetType() == PDE_TYPE_BYTES )\n 2004 |             {\n 2005 |                 read_size = element->GetBytesCount();\n 2006 |                 size += read_size;\n 2007 |                 m_buffer.resize(size);\n 2008 |                 element->GetBytes(read_size, m_buffer.data() + offset);\n 2009 |             }\n 2010 |         }\n 2011 |         m_data.reset(new wxMemoryInputStream(m_buffer.data(), m_buffer.size()));","lines":18,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/webview_chromium.cpp#L1994-L2011"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `wxObjectXmlReader::ReadComponent`, when parsing constructor (create) parameters, `pi = classInfo->FindPropertyInfo(paramName)` may return `nullptr`. The code only logs an error (`wxLogError(_(\"Unknown Property %s\"),paramName)`) but does not `return` or skip, so it then unconditionally dereferences `pi` at `pi->GetTypeInfo()->IsObjectType()` (both in the `if (propiter != propertyNodes.end())` branch and in the `else` branch). This is a null-pointer dereference crash whenever a declared create-param has no matching property (e.g. inconsistent/mis-declared RTTI).","fix":"After `if ( pi == 0 ) { wxLogError(...); }` add a guard that skips this parameter, e.g. `if ( pi == nullptr ) { wxLogError(...); createParamOids[i] = wxInvalidObjectID; createClassInfos[i] = nullptr; continue; }`, so `pi` is never dereferenced when null.","locations":[{"ref":"src/common/xtixml.cpp:313-373","code":"  313 |         const wxPropertyInfo* pi = classInfo->FindPropertyInfo( paramName );\n  314 |         if ( pi == 0 )\n  315 |         {\n  316 |             wxLogError( wxString::Format(_(\"Unknown Property %s\"),paramName) );\n  317 |         }\n  318 |         // if we don't have the value of a create param set in the xml\n  319 |         // we use the default value\n  320 |         if ( propiter != propertyNodes.end() )\n  321 |         {\n  322 |             wxXmlNode* prop = propiter->second;\n  323 |             if ( pi->GetTypeInfo()->IsObjectType() )\n  324 |             {\n  325 |                 createParamOids[i] = ReadComponent( prop, callbacks );\n  326 |                 createClassInfos[i] =\n  327 |                     wx_dynamic_cast(const wxClassTypeInfo*, pi->GetTypeInfo())->GetClassInfo();\n  328 |             }\n  329 |             else\n  330 |             {\n  331 |                 createParamOids[i] = wxInvalidObjectID;\n  332 |                 createParams[i] = ReadValue( prop, pi->GetTypeInfo() );\n  333 |                 if( pi->GetFlags() & wxPROP_ENUM_STORE_LONG )\n  334 |                 {\n  335 |                     const wxEnumTypeInfo *eti =\n  336 |                         wx_dynamic_cast(const wxEnumTypeInfo*, pi->GetTypeInfo() );\n  337 |                     if ( eti )\n  338 |                     {\n  339 |                         long realval;\n  340 |                         eti->ConvertToLong( createParams[i], realval );\n  341 |                         createParams[i] = wxAny( realval );\n  342 |                     }\n  343 |                     else\n  344 |                     {\n  345 |                         wxLogError( _(\"Type must have enum - long conversion\") );\n  346 |                     }\n  347 |                 }\n  348 |                 createClassInfos[i] = nullptr;\n  349 |             }\n  350 | \n  351 |             for ( size_t j = 0; j < propertyNames.size(); ++j )\n  352 |             {\n  353 |                 if ( propertyNames[j] == paramName )\n  354 |                 {\n  355 |                     propertyNames[j].clear();\n  356 |                     break;\n  357 |                 }\n  358 |             }\n  359 |         }\n  360 |         else\n  361 |         {\n  362 |             if ( pi->GetTypeInfo()->IsObjectType() )\n  363 |             {\n  364 |                 createParamOids[i] = wxNullObjectID;\n  365 |                 createClassInfos[i] =\n  366 |                     wx_dynamic_cast(const wxClassTypeInfo*, pi->GetTypeInfo())->GetClassInfo();\n  367 |             }\n  368 |             else\n  369 |             {\n  370 |                 createParams[i] = pi->GetDefaultValue();\n  371 |                 createParamOids[i] = wxInvalidObjectID;\n  372 |             }\n  373 |         }","lines":61,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/xtixml.cpp#L313-L373"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`wxDFBDCImpl::DoSetDeviceClippingRegion()` converts the region's `width` and `height` (which are *dimensions*, i.e. relative values) using the absolute coordinate mappers `DeviceToLogicalX`/`DeviceToLogicalY` instead of the relative mappers `DeviceToLogicalXRel`/`DeviceToLogicalYRel`. The absolute mappers subtract the device origin (which is non-zero for client/window DCs, since `InitForWin()` calls `SetDeviceOrigin()`), so the resulting clip width/height are wrong by the device-origin offset. Only `x`/`y` should use the absolute mappers.","fix":"Use `rect.width = DeviceToLogicalXRel(rect.width);` and `rect.height = DeviceToLogicalYRel(rect.height);` while keeping `DeviceToLogicalX`/`DeviceToLogicalY` for `rect.x`/`rect.y`.","locations":[{"ref":"src/dfb/dc.cpp:96-99","code":"   96 |     rect.x = DeviceToLogicalX(rect.x);\n   97 |     rect.y = DeviceToLogicalY(rect.y);\n   98 |     rect.width = DeviceToLogicalX(rect.width);\n   99 |     rect.height = DeviceToLogicalY(rect.height);","lines":4,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/dfb/dc.cpp#L96-L99"}]},
{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `wxTopLevelWindowDFB::ShowFullScreen()`, the `wxFULLSCREEN_NOBORDER` branch does `m_windowStyle = wxSIMPLE_BORDER;`, which overwrites the *entire* window style with a single flag. This discards every other style bit, including the `wxCAPTION` clearing that the immediately preceding `wxFULLSCREEN_NOCAPTION` branch just performed, as well as all frame-type and behaviour flags. The wxUniversal reference implementation (`src/univ/topluniv.cpp`) correctly uses `m_windowStyle |= wxSIMPLE_BORDER;`.","fix":"Change `m_windowStyle = wxSIMPLE_BORDER;` to `m_windowStyle |= wxSIMPLE_BORDER;` so that only the border flag is added rather than replacing all style bits.","locations":[{"ref":"src/dfb/toplevel.cpp:90-93","code":"   90 |         if ( style & wxFULLSCREEN_NOCAPTION )\n   91 |             m_windowStyle &= ~wxCAPTION;\n   92 |         if ( style & wxFULLSCREEN_NOBORDER )\n   93 |             m_windowStyle = wxSIMPLE_BORDER;","lines":4,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/dfb/toplevel.cpp#L90-L93"}]},
