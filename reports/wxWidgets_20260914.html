{"id":"PANIC_38","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In `wxMBConv_iconv::FromWChar()` the byte-swap temp buffer is allocated with `tmpbuf = (wchar_t *)malloc(inbuflen);` and then immediately written in the loop `tmpbuf[i] = WC_BSWAP(src[i]);` without checking `tmpbuf` for null. `inbuflen == srcLen * SIZEOF_WCHAR_T` is externally influenced, so a large/failed allocation causes a null-pointer write and crash.","fix":"Check the allocation before use: after `tmpbuf = (wchar_t *)malloc(inbuflen);` add `if ( !tmpbuf ) return wxCONV_FAILED;` before the byte-swapping loop.","locations":[{"ref":"src/common/strconv.cpp:2505-2510","code":" 2505 |         tmpbuf = (wchar_t *)malloc(inbuflen);\n 2506 |         for ( size_t i = 0; i < srcLen; i++ )\n 2507 |             tmpbuf[i] = WC_BSWAP(src[i]);\n 2508 | \n 2509 |         src = tmpbuf;\n 2510 |     }","lines":6,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/strconv.cpp#L2505-L2510"}]},

{"id":"PANIC_40","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In the UTF-8 build, `wxString::find_last_of(const wxChar*, size_t nStart, size_t n)` and `find_last_not_of(...)` only special-case `nStart == npos`; otherwise they only `wxASSERT_MSG( nStart <= len )`. When `nStart == len` (which the assert permits, and which is a value `std::string::find_last_of` accepts and clamps to `size-1`), the reverse-iterator initializer `rbegin() + (len - nStart - 1)` evaluates `len - len - 1 == (size_t)-1`, advancing the reverse iterator far past the end, which is out-of-bounds/undefined behavior. The `wxUniChar` overloads `find_last_not_of(wxUniChar, size_t)` share the same pattern.","fix":"Clamp `nStart` for the `>= len` case as std::string does, e.g. treat `nStart == npos || nStart >= len` by setting `nStart = len - 1` (and returning `npos` immediately when `len == 0`), so the `len - nStart - 1` offset can never underflow.","locations":[{"ref":"src/common/string.cpp:754-776","code":"  754 | size_t wxString::find_last_of(const wxChar* sz, size_t nStart, size_t n) const\n  755 | {\n  756 |     size_t len = length();\n  757 | \n  758 |     if ( nStart == npos )\n  759 |     {\n  760 |         nStart = len - 1;\n  761 |     }\n  762 |     else\n  763 |     {\n  764 |         wxASSERT_MSG( nStart <= len, wxT(\"invalid index\") );\n  765 |     }\n  766 | \n  767 |     size_t idx = nStart;\n  768 |     for ( const_reverse_iterator i = rbegin() + (len - nStart - 1);\n  769 |           i != rend(); --idx, ++i )\n  770 |     {\n  771 |         if ( wxTmemchr(sz, *i, n) )\n  772 |             return idx;\n  773 |     }\n  774 | \n  775 |     return npos;\n  776 | }","lines":23,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/string.cpp#L754-L776"},{"ref":"src/common/string.cpp:778-800","code":"  778 | size_t wxString::find_last_not_of(const wxChar* sz, size_t nStart, size_t n) const\n  77 {"id":"PANIC_41","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In `wxMsgCatalogFile::LoadData()`, the pointer for the translated header string `header = StringAtOfs(m_pTransTable, 0)` is used directly by `strstr(header, ...)` at the charset extraction and again for the Plural-Forms extraction without a null check. `StringAtOfs()` can return `nullptr` for a corrupt catalog (its bounds check on `ofsString + nLen` fails). While the original string `headerData` is null-checked, `header` (from the translation table) is not, so a maliciously/accidentally corrupt .mo whose first translated entry has an out-of-range offset causes a null-pointer dereference in `strstr`.","fix":"Guard the translated header pointer before using it, e.g. `const char * const header = StringAtOfs(m_pTransTable, 0); if ( header ) { ... }` wrapping the charset and Plural-Forms extraction (or `if (!header) return false;`).","locations":[{"ref":"src/common/translation.cpp:974-999","code":"  974 |     const char* headerData = StringAtOfs(m_pOrigTable, 0);\n  975 |     if ( headerData && headerData[0] == '\\0' )\n  976 |     {\n  977 |         // Extract the charset:\n  978 |         const char * const header = StringAtOfs(m_pTransTable, 0);\n  979 |         const char *\n  980 |             cset = strstr(header, \"Content-Type: text/plain; charset=\");\n  981 |         if ( cset )\n  982 |         {\n  983 |             cset += 34; // strlen(\"Content-Type: text/plain; charset=\")\n  984 | \n  985 |             const char * const csetEnd = strchr(cset, '\\n');\n  986 |             if ( csetEnd )\n  987 |             {\n  988 |                 m_charset = wxString(cset, csetEnd - cset);\n  989 |                 if ( m_charset == wxS(\"CHARSET\") )\n  990 |                 {\n  991 |                     // \"CHARSET\" is not valid charset, but lazy translator\n  992 |                     m_charset.clear();\n  993 |                 }\n  994 |             }\n  995 {"id":"PANIC_42","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`wxVariantDataChar::Read(wxString& str)` unconditionally reads `str[0u]` without checking that `str` is non-empty. When deserializing a char variant from an empty string, this indexes past the end of the `wxString` (asserts in debug, undefined/garbage read in release). Every other `Read(wxString&)` overload in this file guards or tolerates its input; this one does not.","fix":"Guard against an empty string, e.g.:\n```cpp\nbool wxVariantDataChar::Read(wxString& str)\n{\n    if ( str.empty() )\n        return false;\n    m_value = str[0u];\n    return true;\n}\n```","locations":[{"ref":"src/common/variant.cpp:769-773","code":"  769 | bool wxVariantDataChar::Read(wxString& str)\n  770 | {\n  771 |     m_value = str[0u];\n  772 |     return true;\n  773 | }","lines":5,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/variant.cpp#L769-L773"}]},
{"id":"PANIC_43","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`SchemeHandler::ReadResponse()` obtains `wxInputStream* stream = handlerResponse->GetData();` and immediately dereferences it with `stream->CanRead()` without a null check. `GetData()` returns null when the response has no data object, or when the stored response data's `GetStream()` returns null (e.g. a `wxFSFile` whose stream is null). This is a null dereference crash in the resource-read path.","fix":"Guard against a null stream: `if ( stream && stream->CanRead() ) { ... }` and return `false`/`bytes_read == 0` when there is no readable stream.","locations":[{"ref":"src/common/webview_chromium.cpp:2132-2137","code":" 2132 |     wxWebViewChromiumHandlerResponse* handlerResponse = GetHandlerResponse();\n 2133 |     wxInputStream* stream = handlerResponse->GetData();\n 2134 | \n 2135 |     if ( stream->CanRead() )\n 2136 |     {\n 2137 |         stream->Read(data_out, bytes_to_read);","lines":6,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/webview_chromium.cpp#L2132-L2137"}]},
{"id":"PANIC_44","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In `wxWrapSizer::CalcMinFromMinor()`, the extension-size loop dereferences `lines[ix+1]->m_first->GetMinSizeWithBorder()`. `m_first` is only assigned when a line accumulates non-zero major width (`if ( line->m_width && !line->m_first ) line->m_first = item;`), so a line whose only/first shown item has zero major size (e.g. a zero-width spacer) leaves `m_first == nullptr`, causing a null-pointer dereference. Additionally `lines[ix+1]` assumes `lines.size() >= nrLines + 1`, which is only justified by a comment rather than enforced, so an out-of-bounds `wxVector` access is also possible if that assumption does not hold. Both require somewhat unusual item geometry to hit, hence low severity.","fix":"Guard the access: skip lines where `lines[ix+1]->m_first` is null (or treat their extension as 0), and verify `ix+1 < lines.size()` before indexing, rather than relying on the invariant asserted only in a comment.","locations":[{"ref":"src/common/wrapsizer.cpp:435-453","code":"  435 |         if ( tailSize )\n  436 |         {\n  437 |             // Now look how much we need to extend our size\n  438 |             // We know we must have at least one more line than nrLines\n  439 |             // (otherwise no tail size).\n  440 |             int bestExtSize = 0; // Minimum extension width for current tailSize\n  441 |             for ( int ix=0; ix<nrLines; ix++ )\n  442 |             {\n  443 |                 // Take what is not used on this line, see how much extension we get\n  444 |                 // by adding first item on next line.\n  445 |                 int size = lineSize-lines[ix]->m_width; // Left over at end of this line\n  446 |                 int extSize = GetSizeInMajorDir(lines[ix+1]->m_first->GetMinSizeWithBorder()) - size;\n  447 |                 if ( (extSize>=tailSize && (extSize<bestExtSize || bestExtSize<tailSize)) ||\n  448 | {"id":"PANIC_45","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In `wxObjectRuntimeReaderCallback::SetConnect`, `delegateTypeInfo` comes from `wx_dynamic_cast(const wxEventSourceTypeInfo*, delegateInfo->GetTypeInfo())` and may be `nullptr`. The first branch guards it (`if( delegateTypeInfo && delegateTypeInfo->GetLastEventType() == -1 )`), but when `delegateTypeInfo` is null the `else` branch is taken and dereferences it immediately in `delegateTypeInfo->GetEventType()`, causing a null-pointer dereference.","fix":"Handle the null case explicitly, e.g. wrap the whole `if/else` in `if ( delegateTypeInfo ) { ... }` (and optionally log an error otherwise) so `GetEventType()`/`GetLastEventType()` are never called on a null pointer.","locations":[{"ref":"src/common/xtistrm.cpp:610-627","code":"  610 |         const wxEventSourceTypeInfo *delegateTypeInfo =\n  611 |             wx_dynamic_cast(const wxEventSourceTypeInfo*,delegateInfo->GetTypeInfo());\n  612 |         if( delegateTypeInfo && delegateTypeInfo->GetLastEventType() == -1 )\n  613 |         {\n  614 |             ehsource->Connect( -1, delegateTypeInfo->GetEventType(),\n  615 |                 handlerInfo->GetEventFunction(), nullptr /*user data*/,\n  616 |                 ehsink );\n  617 |         }\n  618 |         else\n  619 |         {\n  620 |             for ( wxEventType iter = delegateTypeInfo->GetEventType();\n  621 |                   iter <= delegateTypeInfo->GetLastEventType(); ++iter )\n  622 |             {\n  623 |                 ehsource->Connect( -1, iter,\n  624 |                     handlerInfo->GetEventFunction(), nullptr /*user data*/,\n  625 |                     ehsink );\n  626 |             }\n  627 |         }","lines":18,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/xtistrm.cpp#L610-L627"}]},
{"id":"PANIC_46","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In `wxButtonToolBar::OnPaint()` the label is drawn using `tool->GetButton()->GetSize().y`, but `GetButton()` is only non-null for button tools; for separators and control tools it stays `nullptr` (set in the ctors and only assigned in `DoLayout()` for `IsButton()` tools). The guarding condition is only `m_labelHeight > 0 && !tool->GetShortHelp().empty()`, so a non-button tool that has a short help set (e.g. via `SetToolShortHelp()`) while `wxTB_TEXT` is enabled dereferences a null `wxBitmapButton*` and crashes.","fix":"Add a null check before dereferencing, e.g. `if (m_labelHeight > 0 && tool->GetButton() && !tool->GetShortHelp().empty())`, and only use `tool->GetButton()->GetSize().y` inside that guard.","locations":[{"ref":"src/generic/buttonbar.cpp:516-520","code":"  516 |         if (m_labelHeight > 0 && !tool->GetShortHelp().empty())\n  517 |         {\n  518 |             int x = tool->m_x;\n  519 |             dc.DrawText(tool->GetShortHelp(), x, tool->m_y + tool->GetButton()->GetSize().y + m_labelMargin);\n  520 |         }","lines":5,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/buttonbar.cpp#L516-L520"}]},
{"id":"PANIC_47","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`OnItemActivated` dereferences the result of `GetItemData(treeid)` (`data->m_isDir`) without checking for `nullptr` or `treeid.IsOk()`, unlike sibling handlers such as `OnTreeSelected` (which guards with `item.IsOk()`) and `wxGenericDirDialog::OnTreeSelected` (which null-checks `data`). If an activation event ever arrives for an item lacking `wxDirItemData`, this crashes. Every item created by this control currently has data, so it is rarely (if ever) reached, but the missing guard is inconsistent with the rest of the file.","fix":"Guard before dereferencing: `if (!treeid.IsOk()) { event.Skip(); return; } const wxDirItemData *data = GetItemData(treeid); if (!data) { event.Skip(); return; }` and only then test `data->m_isDir`.","locations":[{"ref":"src/generic/dirctrlg.cpp:582-587","code":"  582 | void wxGenericDirCtrl::OnItemActivated(wxTreeEvent &event)\n  583 | {\n  584 |     wxTreeItemId treeid = event.GetItem();\n  585 |     const wxDirItemData *data = GetItemData(treeid);\n  586 | \n  587 |     if (data->m_isDir)","lines":6,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/dirctrlg.cpp#L582-L587"}]},
{"id":"PANIC_48","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`wxGridCellEnumEditor::BeginEdit` sets `Combo()->SetSelection(m_index)` where `m_index` is a `long` obtained from `table->GetValueAsLong(row, col)` (or parsed from the cell text) without any range check against the number of combo choices. An out-of-range positive value passed to `wxItemContainer::SetSelection` violates its contract (index must be valid) and asserts/misbehaves. Only `-1` (clear selection) is a safe out-of-list value.","fix":"Clamp/validate `m_index` before calling `SetSelection`, e.g. only call it when `m_index >= 0 && m_index < (long)Combo()->GetCount()`, otherwise fall back to `-1`.","locations":[{"ref":"src/generic/grideditors.cpp:1652-1671","code":" 1652 |     wxGridTableBase *table = grid->GetTable();\n 1653 | \n 1654 |     if ( table->CanGetValueAs(row, col, wxGRID_VALUE_NUMBER) )\n 1655 |     {\n 1656 |         m_index = table->GetValueAsLong(row, col);\n 1657 |     }\n 1658 |     else\n 1659 |     {\n 1660 |         wxString startValue = table->GetValue(row, col);\n 1661 |         if (startValue.IsNumber() && !startValue.empty())\n 1662 |         {\n 1663 |             startValue.ToLong(&m_index);\n 1664 |         }\n 1665 |         else\n 1666 |         {\n 1667 |             m_index = -1;\n 1668 |         }\n 1669 |     }\n 1670 | \n 1671 |     Combo()->SetSelection(m_index);","lines":20,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/grideditors.cpp#L1652-L1671"}]},
{"id":"PANIC_49","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In `wxTabView::SetTabSelection`, `control` is obtained from `FindTabControlForId(sel)` and then immediately dereferenced with `control->GetId()` when `sel == 0`, before the later `if (control)` null-check. `FindTabControlForId(0)` returns the first tab, but returns `nullptr` when there are no tabs at all (the documented case: this function is called with `sel == 0` while deleting a page). Deleting the last page can therefore dereference a null `control`.","fix":"Guard the dereference, e.g. `if (sel == 0 && control) sel = control->GetId();`, so the existing `if (control)` / `else if (sel != -1)` logic below handles the no-tab case safely.","locations":[{"ref":"src/generic/tabg.cpp:1015-1023","code":" 1015 |   wxTabControl *control = FindTabControlForId(sel);\n 1016 |   if (sel == 0) sel=control->GetId();\n 1017 |   wxTabControl *oldControl = FindTabControlForId(m_tabSelection);\n 1018 | \n 1019 |   if (!OnTabPreActivate(sel, oldSel))\n 1020 |     return;\n 1021 | \n 1022 |   if (control)\n 1023 |     control->SetSelected((sel != -1)); // TODO ??","lines":9,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/tabg.cpp#L1015-L1023"}]},
{"id":"PANIC_50","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`wxPanelTabView::ShowWindowForTab` dereferences `newWindow` via `newWindow->Show(true)` and `newWindow->Refresh()` without checking for null, even though `GetTabWindow(id)` returns `nullptr` for an unknown id. The analogous `OnTabActivate` does guard its `newWindow` pointer, so this is an inconsistent omission: passing an id with no registered window (and with `m_currentWindow` non-null so the early `return` is not taken) crashes.","fix":"Add a null check before use, e.g. `if (!newWindow) return;` after `wxWindow *newWindow = GetTabWindow(id);`, or wrap the `Show(true)`/`Refresh()` calls in `if (newWindow)`.","locations":[{"ref":"src/generic/tabg.cpp:1256-1265","code":" 1256 | void wxPanelTabView::ShowWindowForTab(int id)\n 1257 | {\n 1258 |   wxWindow *newWindow = GetTabWindow(id);\n 1259 |   if (newWindow == m_currentWindow)\n 1260 |     return;\n 1261 |   if (m_currentWindow)\n 1262 |     m_currentWindow->Show(false);\n 1263 |   newWindow->Show(true);\n 1264 |   newWindow->Refresh();\n 1265 | }","lines":10,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/tabg.cpp#L1256-L1265"}]},
{"id":"PANIC_51","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`wxBitmapDataObject::SetData()` (and `DoConvertToPng()`) call `malloc(m_pngSize)` and immediately `memcpy()` into the result without checking for `nullptr`. In `SetData()`, `m_pngSize` comes directly from the externally-supplied `size` argument (clipboard/drag-and-drop data), so a very large or corrupt size makes `malloc` return `nullptr` and the following `memcpy(m_pngData, buf, m_pngSize)` dereferences a null pointer and crashes.","fix":"Check the result of `malloc` (or use `wxCHECK_MSG`/`return false`) before the `memcpy`, e.g. `m_pngData = malloc(m_pngSize); wxCHECK_MSG(m_pngData, false, \"out of memory\");`.","locations":[{"ref":"src/gtk/dataobj.cpp:403-406","code":"  403 |     m_pngSize = size;\n  404 |     m_pngData = malloc(m_pngSize);\n  405 | \n  406 |     memcpy(m_pngData, buf, m_pngSize);","lines":4,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/gtk/dataobj.cpp#L403-L406"},{"ref":"src/gtk/dataobj.cpp:433-436","code":"  433 |     m_pngSize = count.GetSize() + 100; // sometimes the size seems to vary ???\n  434 |     m_pngData = malloc(m_pngSize);\n  435 | \n  436 |     wxMemoryOutputStream mstream((char*) m_pngData, m_pngSize);","lines":4,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/gtk/dataobj.cpp#L433-L436"}]},
{"id":"PANIC_52","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In `gtk_wx_cell_editor_bin_cell_editable_start_editing()` the loop descends into the editor's children with `win = win->GetChildren().front();` when the editor widget itself is not a `GtkCellEditable`. `wxWindowList::front()` on an empty list is undefined behavior (dereferencing an empty container). If a custom editor control's top-level widget is neither `GTK_IS_CELL_EDITABLE` nor has any child windows, this crashes. The common single-control case (e.g. `wxTextCtrl`, whose `GtkEntry` is cell-editable) avoids it, so the crash is limited to composite/custom editors with no children.","fix":"Check the child list before taking `front()`:\n```cpp\nif ( win == bin->editor )\n{\n    if ( win->GetChildren().empty() )\n        break;\n    win = win->GetChildren().front();\n}\nelse\n    win = win->GetNextSibling();\n```","locations":[{"ref":"src/gtk/dataview.cpp:1388-1401","code":" 1388 |     for ( wxWindow* win = bin->editor; win; )\n 1389 |     {\n 1390 |         GtkWidget* const widget = win->m_widget;\n 1391 |         if ( GTK_IS_CELL_EDITABLE(widget) )\n 1392 |         {\n 1393 |             gtk_cell_editable_start_editing(GTK_CELL_EDITABLE(widget), event);\n 1394 |             break;\n 1395 |         }\n 1396 | \n 1397 |         if ( win == bin->editor )\n 1398 |             win = win->GetChildren().front();\n 1399 |         else\n 1400 |             win = win->GetNextSibling();\n 1401 |     }","lines":14,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/gtk/dataview.cpp#L1388-L1401"}]},
{"id":"PANIC_53","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`wxDirDialog::GTKAccept()` reads `m_paths.Last()` after populating `m_paths` from `gtk_file_chooser_get_filenames()`. If the returned list is empty (which is possible when the chooser reports ACCEPT with no selection), `m_paths` stays empty and `m_paths.Last()` accesses element of an empty array (assertion in debug, out-of-bounds read in release). This affects both the `wxDD_CHANGE_DIR` branch and the single-selection `m_path = m_paths.Last()` line.","fix":"Guard the `Last()` accesses with `if ( !m_paths.empty() )` (or return early when no directory was selected) before using `m_paths.Last()`.","locations":[{"ref":"src/gtk/dirdlg.cpp:184-204","code":"  184 |     while ( fnamesi )\n  185 |     {\n  186 |         wxString dir(wxString::FromUTF8(static_cast<gchar *>(fnamesi->data)));\n  187 |         m_paths.Add(dir);\n  188 | \n  189 |         g_free(fnamesi->data);\n  190 |         fnamesi = fnamesi->next;\n  191 |     }\n  192 | \n  193 |     g_slist_free(fnames);\n  194 | \n  195 |     // change to the directory where the user went if asked\n  196 |     if (HasFlag(wxDD_CHANGE_DIR))\n  197 |     {\n  198 |         wxSetWorkingDirectory(m_paths.Last());\n  199 |     }\n  200 | \n  201 |     if (!HasFlag(wxDD_MULTIPLE))\n  202 |     {\n  203 |         m_path = m_paths.Last();\n  204 |     }","lines":21,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/gtk/dirdlg.cpp#L184-L204"}]},
{"id":"PANIC_54","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`wxChmTools` constructor calls `chmd = mspack_create_chm_decompressor(nullptr)` and then immediately dereferences it via `chmd->open(chmd, ...)` without checking for `nullptr`. `mspack_create_chm_decompressor` can return `nullptr` (e.g. out of memory), in which case this is a null-pointer dereference / crash rather than a graceful error.","fix":"After `chmd = mspack_create_chm_decompressor(nullptr);` add `if (!chmd) { m_lasterror = MSPACK_ERR_NOMEMORY; return; }` before using `chmd->open`.","locations":[{"ref":"src/html/chm.cpp:113-142","code":"  113 |     // Create decompressor\n  114 |     chmd =  mspack_create_chm_decompressor(nullptr);\n  115 |     m_decompressor = (struct mschm_decompressor *) chmd;\n  116 | \n  117 |     // NB: we must make a copy of the string because chmd->open won't call\n  118 |     //     strdup() [libmspack-20030726], which would cause crashes in\n  119 |     //     Unicode build when mb_str() returns temporary buffer\n  120 |     m_chmFileNameANSI = strdup((const char*)m_chmFileName.mb_str(wxConvFile));\n  121 | \n  122 |     // Open the archive and store it in class:\n  123 |     if ( (chmh = chmd->open(chmd, (char*)m_chmFileNameANSI)) )\n  124 |     {\n  125 |         m_archive = chmh;\n  126 | \n  127 |         // Create Filenamearray\n  128 |         m_fileNames = new wxArrayString;\n  129 | \n  130 |         // Store Filenames in array\n  131 |         for (file = chmh->files; file; file = file->next)\n  132 |         {\n  133 |             m_fileNames->Add(wxString::FromAscii(file->filename));\n  134 |         }\n  135 |     }\n  136 |     else\n  137 |     {\n  138 |         wxLogError(_(\"Failed to open CHM archive '%s'.\"),\n  139 |                    archive.GetFullPath());\n  140 |         m_lasterror = (chmd->last_error(chmd));\n  141 |         return;\n  142 |     }","lines":30,"link":"https://github.com/wxWidgets/wxWi
