{"id":"PANIC_55","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"In `wxDialUpManagerMSW::GetISPNames()`, `RASENTRYNAME *rasEntries = (RASENTRYNAME *)malloc(size);` is not checked for `nullptr` before the very next line dereferences it: `rasEntries->dwSize = sizeof(RASENTRYNAME);`. Every other `malloc`/`realloc` call in this same file (e.g. `FindActiveConnection()` at `src/msw/dialup.cpp:456-461` and the `realloc` a few lines below in this very function at `src/msw/dialup.cpp:653-658`) is properly null-checked, making this omission an inconsistency rather than a deliberate choice.","fix":"Check the allocation before using it, consistent with the rest of the function:\n\n```cpp\nDWORD size = sizeof(RASENTRYNAME);\nRASENTRYNAME *rasEntries = (RASENTRYNAME *)malloc(size);\nif ( !rasEntries )\n    return 0;\nrasEntries->dwSize = sizeof(RASENTRYNAME);\n```","locations":[{"ref":"src/msw/dialup.cpp:630-635","code":"  630 | size_t wxDialUpManagerMSW::GetISPNames(wxArrayString& names) const\n  631 | {\n  632 |     // fetch the entries\n  633 |     DWORD size = sizeof(RASENTRYNAME);\n  634 |     RASENTRYNAME *rasEntries = (RASENTRYNAME *)malloc(size);\n  635 |     rasEntries->dwSize = sizeof(RASENTRYNAME);","lines":6,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/dialup.cpp#L630-L635"}]},
{"id":"PANIC_56","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`PrintStatistics()` unconditionally calls `list.RemoveLast()` twice to strip the trailing `\", \"` separator. If there are no undocumented classes (`undoc == 0`), `list` is an empty string and `RemoveLast()` on an empty `wxString` underflows the position computation (`length()-n`), triggering an assertion in debug builds and undefined behavior in release builds.","fix":"Guard the trimming, e.g.:\n```cpp\nif ( undoc > 0 )\n{\n    list.RemoveLast();\n    list.RemoveLast();\n}\n```","locations":[{"ref":"utils/ifacecheck/src/ifacecheck.cpp:669-682","code":"  669 |     wxString list;\n  670 |     int undoc = 0;\n  671 |     const wxClassArray& arr = m_gccInterface.GetClasses();\n  672 |     for (unsigned int i=0; i<arr.GetCount(); i++) {\n  673 |         if (m_doxyInterface.FindClass(arr[i].GetName()) == nullptr) {\n  674 |             list += arr[i].GetName() + \", \";\n  675 |             undoc++;\n  676 |         }\n  677 |     }\n  678 | \n  679 |     list.RemoveLast();\n  680 |     list.RemoveLast();\n  681 | \n  682 |     wxLogMessage(\"the list of the %d undocumented wx classes is: %s\", undoc, list);","lines":14,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/utils/ifacecheck/src/ifacecheck.cpp#L669-L682"}]},
{"id":"PANIC_57","type":"panic","type_label":"Panic","severity":"negligible","difficulty":"easy","description":"`wxFileCtrlEvent::GetFile()` dereferences the result of `wxDynamicCast( GetEventObject(), wxFileCtrl )` inside `wxASSERT_MSG` without a null check. If the event object is null or not a `wxFileCtrl`, `wxDynamicCast` returns `nullptr` and `->HasMultipleFileSelection()` dereferences it. This only triggers in debug builds (asserts compile out in release), so impact is limited.","fix":"Guard the pointer before dereferencing, e.g. `wxFileCtrl* const fc = wxDynamicCast(GetEventObject(), wxFileCtrl); wxASSERT_MSG( fc && !fc->HasMultipleFileSelection(), ... );`","locations":[{"ref":"src/common/filectrlcmn.cpp:87-96","code":"   87 | wxString wxFileCtrlEvent::GetFile() const\n   88 | {\n   89 |     wxASSERT_MSG( !wxDynamicCast( GetEventObject(), wxFileCtrl )->HasMultipleFileSelection(),\n   90 |                   wxT( \"Please use GetFiles() to get all files instead of this function\" ) );\n   91 | \n   92 |     wxString string;\n   93 |     if (m_files.Count() != 0)\n   94 |         string = m_files[0];\n   95 |     return string;\n   96 | }","lines":10,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/filectrlcmn.cpp#L87-L96"}]},
{"id":"PANIC_58","type":"panic","type_label":"Panic","severity":"negligible","difficulty":"easy","description":"In `wxWindowBase::PushEventHandler()`, the debug-only consistency check walks the handler chain with `while ( pLast && pLast != this ) pLast = pLast->GetNextHandler();` and then unconditionally dereferences `pLast->GetNextHandler()`. The loop condition explicitly allows `pLast` to become `nullptr` (chain terminates without containing `this`), after which the following `pLast->GetNextHandler()` is a null dereference. Under correct invariants the chain always ends at `this`, and the code is compiled only when `wxDEBUG_LEVEL` is enabled, so severity is negligible, but the guard-then-deref pattern is unsafe.","fix":"Assert/check that `pLast != nullptr` (i.e. that `this` was actually found in the chain) before calling `pLast->GetNextHandler()`.","locations":[{"ref":"src/common/wincmn.cpp:1455-1460","code":" 1455 |     wxEvtHandler* pLast = handlerToPush;\n 1456 |     while ( pLast && pLast != this )\n 1457 |         pLast = pLast->GetNextHandler();\n 1458 |     wxASSERT_MSG( pLast->GetNextHandler() == nullptr,\n 1459 |         \"the last handler of the wxWindow stack should \"\n 1460 |         \"have this window as next handler\" );","lines":6,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/wincmn.cpp#L1455-L1460"}]},
{"id":"UAF_1","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"easy","description":"In `wxMSWFileSystemWatcher::Init()`, when `m_service->Init()` fails, the code does `delete m_service;` but never resets `m_service` back to `nullptr`. The base class `wxFileSystemWatcherBase` (see `src/common/fswatchercmn.cpp:84-88`) keeps `m_service` as a live member and both its destructor (`delete m_service;`) and any subsequent `Add()`/`AddTree()`/`Remove()` call dereference `m_service` unconditionally (`m_service->Add(watch)`, `m_service->Remove(watch)`, `m_service->RemoveAll()`) with no null check. So if `wxFSWatcherImplMSW::Init()` fails (e.g. the IOCP worker thread fails to `Create()` or `Run()`), the very next use of the watcher dereferences a dangling pointer, and the eventual destructor performs a double `delete` on the same already-freed object.","fix":"After the failed `Init()`, reset `m_service` to `nullptr` so later code sees a well-defined \"not initialized\" state:\n\n```cpp\nbool wxMSWFileSystemWatcher::Init()\n{\n    m_service = new wxFSWatcherImplMSW(this);\n    bool ret = m_service->Init();\n    if (!ret)\n    {\n        delete m_service;\n        m_service = nullptr;\n    }\n\n    return ret;\n}\n```\n\nCallers of `Add()`/`AddTree()`/etc. in `wxFileSystemWatcherBase` should also guard against `m_service == nullptr` (currently they assume it is always valid).","locations":[{"ref":"src/msw/fswatcher.cpp:443-453","code":"  443 | bool wxMSWFileSystemWatcher::Init()\n  444 | {\n  445 |     m_service = new wxFSWatcherImplMSW(this);\n  446 |     bool ret = m_service->Init();\n  447 |     if (!ret)\n  448 |     {\n  449 |         delete m_service;\n  450 |     }\n  451 | \n  452 |     return ret;\n  453 | }","lines":11,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/fswatcher.cpp#L443-L453"}]},
{"id":"UAF_2","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"medium","description":"`wxMetafileRefData` stores a raw `WXHANDLE m_metafile` (an `HMETAFILE`) and its destructor calls `DeleteMetaFile((HMETAFILE) m_metafile)` to release it (`src/msw/metafile.cpp:67-74`). However `wxMetafile::CloneGDIRefData()` creates the \"unshared\" copy with `new wxMetafileRefData(*static_cast<const wxMetafileRefData *>(data))`, and since `wxMetafileRefData` never declares a copy constructor, the compiler-generated one performs a plain member-wise (shallow) copy of `m_metafile`. The result is two independent `wxMetafileRefData` instances (the original, shared elsewhere, and the freshly \"unshared\" clone) that both hold the *same* native `HMETAFILE` value. When both are eventually destroyed, `DeleteMetaFile()` is called twice on the same handle: the second call is a double-free of a GDI object, and if the OS has meanwhile reused that handle value for an unrelated GDI object, the second `DeleteMetaFile()` call destroys that unrelated object instead. Any other copy of the metafile that outlives the first destruction is left holding a dangling handle (use-after-free) if it calls `Play()`, `GetHMETAFILE()`, etc. Note that elsewhere in the same file (`wxMetafileDataObject::GetDataHere`), the code correctly calls Win32's `CopyMetaFile()` to duplicate the native handle before handing it out, showing the intended pattern that `CloneGDIRefData()` fails to follow.","fix":"Give `wxMetafileRefData` an explicit copy constructor that duplicates the native handle with `CopyMetaFile()` instead of relying on the shallow, compiler-generated one:\n\n```cpp\nwxMetafileRefData::wxMetafileRefData(const wxMetafileRefData& other)\n    : m_metafile(other.m_metafile ? (WXHANDLE)CopyMetaFile((HMETAFILE)other.m_metafile, nullptr) : 0),\n      m_windowsMappingMode(other.m_windowsMappingMode),\n      m_width(other.m_width),\n      m_height(other.m_height)\n{\n}\n```\n\nDeclare it in `wx/msw/metafile.h` next to the default constructor/destructor so `CloneGDIRefData()` in `src/msw/metafile.cpp:99-102` produces a genuinely independent `HMETAFILE` and each `wxMetafileRefData` instance owns exactly one native handle.","locations":[{"ref":"src/msw/metafile.cpp:99-102","code":"   99 | wxGDIRefData *wxMetafile::CloneGDIRefData(const wxGDIRefData *data) const\n  100 | {\n  101 |     return new wxMetafileRefData(*static_cast<const wxMetafileRefData *>(data));\n  102 | }","lines":4,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/metafile.cpp#L99-L102"},{"ref":"src/msw/metafile.cpp:67-74","code":"   67 | wxMetafileRefData::~wxMetafileRefData()\n   68 | {\n   69 |     if (m_metafile)\n   70 |     {\n   71 |         DeleteMetaFile((HMETAFILE) m_metafile);\n   72 |         m_metafile = 0;\n   73 |     }\n   74 | }","lines":8,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/metafile.cpp#L67-L74"}]},
{"id":"UAF_3","type":"use_after_free","type_label":"Use After Free","severity":"medium","difficulty":"easy","description":"The `wxDataViewEvent` copy constructor copies the raw pointer `m_dataBuffer` but does NOT copy the `wxMemoryBuffer m_dataBuf` that actually owns the drag-and-drop payload. In `InitData()` (`src/common/datavcmn.cpp`) the buffer is filled and `SetDataBuffer(m_dataBuf.GetData())` makes `m_dataBuffer` point *into* `m_dataBuf`'s heap storage. After `Clone()` (or any copy), the copy's `m_dataBuffer` still points into the *original* event's `m_dataBuf`; the copy's own `m_dataBuf` is default-constructed and empty. Once the original event is destroyed (e.g. the copy is queued via `wxQueueEvent` and the source event goes out of scope), the cloned event's `GetDataBuffer()` returns a dangling pointer, and `GetDataSize()` still reports the old size, leading to a use-after-free read of the drop data.","fix":"Add `m_dataBuf` to the copy-constructor initializer list so the (ref-counted) `wxMemoryBuffer` storage is shared/kept alive, and re-point `m_dataBuffer` into the copy's own buffer. E.g. add `, m_dataBuf(event.m_dataBuf)` to the init list and, in the body, `if ( m_dataBuffer ) m_dataBuffer = m_dataBuf.GetData();` so `m_dataBuffer` no longer aliases the source object's storage.","locations":[{"ref":"include/wx/dataview.h:886-906","code":"  886 |     wxDataViewEvent(const wxDataViewEvent& event)\n  887 |         : wxNotifyEvent(event),\n  888 |         m_item(event.m_item),\n  889 |         m_col(event.m_col),\n  890 |         m_model(event.m_model),\n  891 |         m_value(event.m_value),\n  892 |         m_column(event.m_column),\n  893 |         m_pos(event.m_pos),\n  894 |         m_cacheFrom(event.m_cacheFrom),\n  895 |         m_cacheTo(event.m_cacheTo),\n  896 |         m_editCancelled(event.m_editCancelled)\n  897 | #if wxUSE_DRAG_AND_DROP\n  898 |         , m_dataObject(event.m_dataObject),\n  899 |         m_dataFormat(event.m_dataFormat),\n  900 |         m_dataBuffer(event.m_dataBuffer),\n  901 |         m_dataSize(event.m_dataSize),\n  902 |         m_dragFlags(event.m_dragFlags),\n  903 |         m_dropEffect(event.m_dropEffect),\n  904 |         m_proposedDropIndex(event.m_proposedDropIndex)\n  905 | #endif\n  906 |         { }","lines":21,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/dataview.h#L886-L906"},{"ref":"include/wx/dataview.h:986","code":"  986 |     wxMemoryBuffer      m_dataBuf;","lines":1,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/dataview.h#L986"},{"ref":"src/common/datavcmn.cpp:1839-1855","code":" 1839 | void wxDataViewEvent::InitData(wxDataObjectComposite* obj, wxDataFormat format)\n 1840 | {\n 1841 |     SetDataFormat(format);\n 1842 | \n 1843 |     SetDataObject(obj->GetObject(format));\n 1844 | \n 1845 |     const size_t size = obj->GetDataSize(format);\n 1846 |     SetDataSize(size);\n 1847 | \n 1848 |     if ( size )\n 1849 |     {\n 1850 |         obj->GetDataHere(format, m_dataBuf.GetWriteBuf(size));\n 1851 |         m_dataBuf.UngetWriteBuf(size);\n 1852 | \n 1853 |         SetDataBuffer(m_dataBuf.GetData());\n 1854 |     }\n 1855 | }","lines":17,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/datavcmn.cpp#L1839-L1855"}]},
{"id":"UAF_4","type":"use_after_free","type_label":"Use After Free","severity":"medium","difficulty":"easy","description":"In `wxGridSelection::SetSelectionMode()` the loop binds `block` as a reference into the vector (`const wxGridBlockCoords& block = m_selection[n];`, line 141), then calls `m_selection.erase(m_selection.begin() + n)` (line 171), and *afterwards* still uses `block.GetTopLeft()`/`block.GetBottomRight()` at line 179. `erase()` invalidates all references at and after position `n`, so `block` is a dangling reference: it now aliases the shifted-down element (or, when `n` was the last index, a logically out-of-range slot). Reading it is undefined behavior and yields wrong coordinates for `RefreshBlock()`, causing an incorrect/garbage refresh region. The sibling method `ClearSelection()` (lines 440-446) does this correctly by copying `coords1`/`coords2` before `erase()`.","fix":"Copy the corners before erasing, e.g.:\n```cpp\nif ( !valid )\n{\n    const wxGridCellCoords topLeft = block.GetTopLeft();\n    const wxGridCellCoords bottomRight = block.GetBottomRight();\n    m_selection.erase(m_selection.begin() + n);\n\n    if ( m_grid->UsesOverlaySelection() )\n        ComputeSelectionShape();\n    else if ( !m_grid->GetBatchCount() )\n        m_grid->RefreshBlock(topLeft, bottomRight);\n}\n```\nThis mirrors the correct pattern already used in `ClearSelection()`.","locations":[{"ref":"src/generic/gridsel.cpp:141-181","code":"  141 |             const wxGridBlockCoords& block = m_selection[n];\n  142 |             const int topRow = block.GetTopRow();\n  143 |             const int leftCol = block.GetLeftCol();\n  144 |             const int bottomRow = block.GetBottomRow();\n  145 |             const int rightCol = block.GetRightCol();\n  146 | \n  147 |             bool valid = false;\n  148 |             switch ( selmode )\n  149 |             {\n  150 |                 case wxGrid::wxGridSelectCells:\n  151 |                 case wxGrid::wxGridSelectNone:\n  152 |                     wxFAIL_MSG(\"unreachable\");\n  153 |                     break;\n  154 | \n  155 |                 case wxGrid::wxGridSelectRows:\n  156 |                     valid = leftCol == 0 && rightCol == lastCol;\n  157 |                     break;\n  158 | \n  159 |                 case wxGrid::wxGridSelectColumns:\n  160 |                     valid = topRow == 0 && bottomRow == lastRow;\n  161 |                     break;\n  162 | \n  163 |                 case wxGrid::wxGridSelectRowsOrColumns:\n  164 |                     valid = (leftCol == 0 && rightCol == lastCol) ||\n  165 |                             (topRow == 0 && bottomRow == lastRow);\n  166 |                     break;\n  167 |             }\n  168 | \n  169 |             if ( !valid )\n  170 |             {\n  171 |                 m_selection.erase(m_selection.begin() + n);\n  172 | \n  173 |                 if ( m_grid->UsesOverlaySelection() )\n  174 |                 {\n  175 |                     ComputeSelectionShape();\n  176 |                 }\n  177 |                 else if ( !m_grid->GetBatchCount() )\n  178 |                 {\n  179 |                     m_grid->RefreshBlock(block.GetTopLeft(), block.GetBottomRight());\n  180 |                 }\n  181 |             }","lines":41,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/gridsel.cpp#L141-L181"}]},
{"id":"UAF_5","type":"use_after_free","type_label":"Use After Free","severity":"medium","difficulty":"easy","description":"In `wxAboutBox()` the modeless `GtkAboutDialog` is cached in `gs_aboutDialog` and reused across calls (`if ( !gs_aboutDialog )`), but the `\"response\"` signal handler `wxGtkAboutDialogOnClose` is connected *unconditionally* on every call (line 263), as are the `\"activate-link\"` handlers (lines 194/214). If `wxAboutBox()` is called again while the previous dialog is still open (e.g. user re-triggers Help->About), the `\"response\"` handler is connected a second time. When the dialog is finally closed both handlers fire: the first calls `icon->UnRef()` and `gtk_widget_destroy(about)` and clears `gs_aboutDialog`, then the second runs `icon->UnRef()` again (double UnRef of the same icon) and `gtk_widget_destroy()` on the already-destroyed widget, risking a crash / use-after-free.","fix":"Only connect the persistent signals when the dialog is first created, i.e. move the `g_signal_connect(dlg, \"response\", ...)` (and the `\"activate-link\"` connections) inside the `if ( !gs_aboutDialog )` creation block, or disconnect any previous handler with `g_signal_handlers_disconnect_by_func()` before reconnecting.","locations":[{"ref":"src/gtk/aboutdlg.cpp:263-264","code":"  263 |     g_signal_connect(dlg, \"response\",\n  264 |                         G_CALLBACK(wxGtkAboutDialogOnClose), &s_icon);","lines":2,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/gtk/aboutdlg.cpp#L263-L264"},{"ref":"src/gtk/aboutdlg.cpp:149-153","code":"  149 | void wxAboutBox(const wxAboutDialogInfo& info, wxWindow* parent)\n  150 | {\n  151 |     // don't create another dialog if one is already present\n  152 |     if ( !gs_aboutDialog )\n  153 |         gs_aboutDialog = GTK_ABOUT_DIALOG(gtk_about_dialog_new());","lines":5,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/gtk/aboutdlg.cpp#L149-L153"}]},
{"id":"UAF_6","type":"use_after_free","type_label":"Use After Free","severity":"medium","difficulty":"medium","description":"`wxDialUpManagerMSW::CleanUpThreadData()` only sets `m_data = nullptr` (thereby skipping the final `wxDELETE(m_data)`'s effect on the still-running thread's data) when `m_data->hEventQuit.Set()` succeeds. If `Set()` fails (a real, if rare, possibility for any Win32 API), `m_data` is left pointing at the same object that the still-running `wxRasMonitorThread` (in `src/msw/dialup.cpp:1179-1229`) uses via `data->hEventRas`, `data->hEventQuit` and `data->hWnd`. Since the quit event was never actually signalled in this failure case, the background thread keeps waiting on/using `hEventRas`/`hEventQuit`, but `wxDELETE(m_data)` at the end of `CleanUpThreadData()` (`src/msw/dialup.cpp:544`) destroys the `wxRasThreadData` object (and the `wxWinAPI::Event` handles it owns) regardless, leaving the background thread waiting on handles that have just been closed out from under it.","fix":"Only delete `m_data` when it is safe to do so, i.e. when the thread has actually been told to quit (or has been confirmed to have exited):\n\n```cpp\nvoid wxDialUpManagerMSW::CleanUpThreadData()\n{\n    if ( m_hThread )\n    {\n        if ( m_data->hEventQuit.Set() )\n        {\n            // the thread owns m_data now, don't touch or free it here\n            m_data = nullptr;\n        }\n        else\n        {\n            wxLogLastError(wxT(\"SetEvent(RasThreadQuit)\"));\n            // don't free m_data: the thread may still be using it\n        }\n\n        CloseHandle(m_hThread);\n        m_hThread = 0;\n    }\n\n    wxDELETE(m_data);\n}\n```\n\n(and additionally decide what to do about the leaked/zombie thread handle in that failure case, e.g. log it clearly as already noted elsewhere in this file).","locations":[{"ref":"src/msw/dialup.cpp:526-545","code":"  526 | void wxDialUpManagerMSW::CleanUpThreadData()\n  527 | {\n  528 |     if ( m_hThread )\n  529 |     {\n  530 |         if ( m_data->hEventQuit.Set() )\n  531 |         {\n  532 |             // sent quit request to the background thread\n  533 | \n  534 |             // the thread still needs m_data so we can't free it here, rather\n  535 |             // let the thread do it itself\n  536 |             m_data = nullptr;\n  537 |         }\n  538 | \n  539 |         CloseHandle(m_hThread);\n  540 | \n  541 |         m_hThread = 0;\n  542 |     }\n  543 | \n  544 |     wxDELETE(m_data);\n  545 | }","lines":20,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/dialup.cpp#L526-L545"}]},
{"id":"UAF_7","type":"use_after_free","type_label":"Use After Free","severity":"low","difficulty":"very_easy","description":"`wxBitmapDataObject::Clear()` calls `free(m_pngData)` but leaves `m_pngData` pointing at the freed block (and `m_pngSize` unchanged). This is safe only as long as every caller immediately reassigns `m_pngData`. However `wxBitmapDataObject::SetData()` in `src/gtk/dataobj.cpp` calls `Clear()` first and then hits a `wxCHECK_MSG` that returns `false` *before* reassigning `m_pngData`/`m_pngSize` (when no PNG image handler is registered). After that early return the object holds a dangling `m_pngData` together with a non-zero `m_pngSize`: a later `GetDataHere()` does `memcpy(buf, m_pngData, m_pngSize)` (use-after-free) and the destructor's `Clear()` does `free(m_pngData)` again (double free). Resetting the pointer in `Clear()` fixes both, and the redundant `ClearAll()` (`Clear(); Init();`) stays correct.","fix":"Make `Clear()` reset the freed pointer so it can never dangle. Change:\n```cpp\n    void Clear() { free(m_pngData); }\n```\nto:\n```cpp\n    void Clear() { free(m_pngData); Init(); }\n```\n(`Init()` sets both `m_pngData = nullptr` and `m_pngSize = 0`.)","locations":[{"ref":"include/wx/gtk/dataobj2.h:51-52","code":"   51 |     void Clear() { free(m_pngData); }\n   52 |     void ClearAll() { Clear(); Init(); }","lines":2,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/gtk/dataobj2.h#L51-L52"}]},
{"id":"UAF_8","type":"use_after_free","type_label":"Use After Free","severity":"low","difficulty":"medium","description":"`m_items` is a `wxBaseObjectArray` that heap-allocates each item and deletes it on `RemoveAt`/`Clear`. The persistent member pointers `m_actionItem` and `m_tipItem` point into these items, but `Clear()` (which calls `m_items.Clear()`), `DeleteByIndex()` (`m_items.RemoveAt(idx)`), and `DestroyToolByIndex()` never reset them. After deleting the tool that `m_actionItem`/`m_tipItem` referenced, a subsequent mouse handler (`OnLeftUp`, `OnMotion`, `DoRightOrMiddleUp`) can dereference the freed object.","fix":"In `Clear()` and `DeleteByIndex()`/`DestroyToolByIndex()`, reset the dangling pointers, e.g. add `m_actionItem = nullptr; m_tipItem = nullptr;` (and clear `m_actionPos`) after mutating `m_items` so stale pointers into removed items are never dereferenced.","locations":[{"ref":"src/aui/auibar.cpp:1172-1176","code":" 1172 | void wxAuiToolBar::Clear()\n 1173 | {\n 1174 |     m_items.Clear();\n 1175 |     m_sizerElementCount = 0;\n 1176 | }","lines":5,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/aui/auibar.cpp#L1172-L1176"},{"ref":"src/aui/auibar.cpp:1183-1193","code":" 1183 | bool wxAuiToolBar::DeleteByIndex(int idx)\n 1184 | {\n 1185 |     if (idx >= 0 && idx < (int)m_items.GetCount())\n 1186 |     {\n 1187 |         m_items.RemoveAt(idx);\n 1188 |         Realize();\n 1189 |         return true;\n 1190 |     }\n 1191 | \n 1192 |     return false;\n 1193 | }","lines":11,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/aui/auibar.cpp#L1183-L1193"}]},
{"id":"UAF_9","type":"use_after_free","type_label":"Use After Free","severity":"negligible","difficulty":"medium","description":"`wxHtmlWindow::DoSetPage()` deletes all cells (`wxDELETE(m_Cell)` / re-parse) and resets `m_tmpSelFromCell`, but it does not reset the mouse-helper's cached pointers `m_tmpLastCell` / `m_tmpLastLink` (members of the `wxHtmlWindowMouseHelper` base, set in `HandleIdle`). After a page reload these hold addresses of freed cells. They are only ever compared by pointer identity (never dereferenced) in `HandleIdle`, so there is no true UAF crash, but if a newly allocated cell happens to reuse the same address, the stale comparison can suppress a cursor/status-bar update. It is a latent dangling-pointer that should be cleared alongside `m_tmpSelFromCell`.","fix":"In `DoSetPage()`, next to `m_tmpSelFromCell = nullptr;`, also clear the mouse-helper state, e.g. add `m_tmpLastCell = nullptr; m_tmpLastLink = nullptr;` (or expose a helper reset method), so no pointer into deleted cells survives the reparse.","locations":[{"ref":"src/html/htmlwin.cpp:458-465","code":"  458 | bool wxHtmlWindow::DoSetPage(const wxString& source)\n  459 | {\n  460 |     wxString newsrc(source);\n  461 | \n  462 |     wxDELETE(m_selection);\n  463 | \n  464 |     // we will soon delete all the cells, so clear pointers to them:\n  465 |     m_tmpSelFromCell = nullptr;","lines":8,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/html/htmlwin.cpp#L458-L465"}]},
{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"very_easy","description":"`wxGtkVariant::operator=(wxGtkVariant&&)` overwrites `m_variant` without first releasing the `GVariant` this object may already own. Because `wxGtkVariant` is an owning RAII wrapper whose destructor calls `g_variant_unref(m_variant)`, move-assigning into a non-empty wrapper (e.g. `v = GetSomeVariant();` where `v` already holds a value) leaks the previously held `GVariant`. The move constructor is fine (target starts empty), but the assignment operator is not.","fix":"Release the current variant before taking ownership of the other one:\n```cpp\nwxGtkVariant& operator=(wxGtkVariant&& other) noexcept\n{\n    if ( this != &other )\n    {\n        if ( m_variant )\n            g_variant_unref(m_variant);\n        m_variant = other.m_variant;\n        other.m_variant = nullptr;\n    }\n    return *this;\n}\n```","locations":[{"ref":"include/wx/gtk/private/variant.h:30-39","code":"   30 |     wxGtkVariant& operator=(wxGtkVariant&& other) noexcept\n   31 |     {\n   32 |         if ( this != &other )\n   33 |         {\n   34 |             m_variant = other.m_variant;\n   35 |             other.m_variant = nullptr;\n   36 |         }\n   37 | \n   38 |         return *this;\n   39 |     }","lines":10,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/gtk/private/variant.h#L30-L39"}]},
{"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"very_easy","description":"In `wxPostScriptPrinter::Print`, the device context `dc` is allocated (via `PrintDialog(parent)` or `new wxPostScriptDC(...)`) and is known to be non-null and valid by line 98. When `GetPagesInfo` reports `maxPage == 0`, the function returns `false` without deleting `dc`, leaking the device context (every other exit path does `delete dc`).","fix":"Delete the DC before returning:\n```cpp\n    if (maxPage == 0)\n    {\n        wxEndBusyCursor();\n        delete dc;\n        sm_lastError = wxPRINTER_ERROR;\n        return false;\n    }\n```","locations":[{"ref":"src/generic/printps.cpp:119-124","code":"  119 |     if (maxPage == 0)\n  120 |     {\n  121 |         sm_lastError = wxPRINTER_ERROR;\n  122 |         wxEndBusyCursor();\n  123 |         return false;\n  124 |     }","lines":6,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/printps.cpp#L119-L124"}]},
{"id":"MEM_3","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"In `wxChmInputStream::CreateHHPStream()`, each #SYSTEM entry's raw payload is read into `buf = malloc(len); i->Read(buf, len);` and then written with `out->Write(buf, strlen((char*)buf))`. The buffer holds raw archive bytes and is not guaranteed to be NUL-terminated within `len` bytes, so `strlen((char*)buf)` reads past the end of the `malloc(len)` allocation - a heap buffer over-read (potential crash / info leak) driven by the contents of the CHM file. The `malloc` return value is also never checked.","fix":"Do not use `strlen` on the raw buffer; write exactly the bytes that were read up to the first NUL bounded by `len`, e.g. compute `size_t n = 0; while (n < len && ((char*)buf)[n]) n++;` and `out->Write(buf, n);`. Also check `buf != nullptr` after `malloc`.","locations":[{"ref":"src/html/chm.cpp:604-662","code":"  604 |             // data\n  605 |             buf = malloc(len);\n  606 |             i->Read(buf, len);\n  607 | \n  608 |             switch (code)\n  609 |             {\n  610 |                 case 0: // CONTENTS_FILE\n  611 |                     if (len)\n  612 |                     {\n  613 |                         tmp = \"Contents file=\";\n  614 |                         hhc=true;\n  615 |                     }\n  616 |                     break;\n  617 |                 case 1: // INDEX_FILE\n  618 |                     tmp = \"Index file=\";\n  619 |                     hhk = true;\n  620 |                     break;\n  621 |                 case 2: // DEFAULT_TOPIC\n  622 |                     tmp = \"Default Topic=\";\n  623 |                     break;\n  624 |                 case 3: // TITLE\n  625 |                     tmp = \"Title=\";\n  626 |                     break;\n  627 |                 //       case 6: // COMPILED_FILE\n  628 |                 //         tmp = \"Compiled File=\";\n  629 |                 //         break;\n  630 |                 case 7: // COMPILED_FILE\n  631 |                     tmp = \"Binary Index=YES\\r\\n\";\n  632 |                     out->Write( (const void *) tmp, strlen(tmp));\n  633 |                     tmp = nullptr;\n  634 |                     break;\n  635 |                 case 4: // STRUCT SYSTEM INFO\n  636 |                     tmp = nullptr ;\n  637 |                     if ( len >= 28 )\n  638 |                     {\n  639 |                         char *structptr = (char*) buf ;\n  640 |                         // LCID at position 0\n  641 |                         wxUint32 dummy = *((wxUint32 *)(structptr+0)) ;\n  642 |                         wxUint32 lcid = wxUINT32_SWAP_ON_BE( dummy ) ;\n  643 |                         char msg[64];\n  644 |                         int len = sprintf(msg, \"Language=0x%X\\r\\n\", lcid) ;\n  645 |                         if (len > 0)\n  646 |                             out->Write(msg, len) ;\n  647 |                     }\n  648 |                     break ;\n  649 |                 default:\n  650 |                     tmp=nullptr;\n  651 |             }\n  652 | \n  653 |             if (tmp)\n  654 |             {\n  655 |                 out->Write((const void *) tmp, strlen(tmp));\n  656 |                 out->Write(buf, strlen((char*)buf));\n  657 |                 out->Write(\"\\r\\n\", 2);\n  658 |             }\n  659 | \n  660 |             free(buf);\n  661 |             buf=nullptr;\n  662 |         }","lines":59,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/html/chm.cpp#L604-L662"}]},
{"id":"MEM_4","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"`wxImageList::Create()` only guards against being called on an already-created list with `wxASSERT_MSG( m_hImageList == nullptr, ... )`, which is compiled out in release builds. If `Create()` is invoked a second time on the same `wxImageList` instance in a release build, `m_hImageList` is silently overwritten with the new `HIMAGELIST` returned by `ImageList_Create()` and the previous native image list handle is never passed to `ImageList_Destroy()`, leaking the associated GDI/USER resources for the process lifetime.","fix":"Turn the debug-only check into an always-enforced guard, e.g. destroy the previous list before recreating: \n```cpp\nbool wxImageList::Create(int width, int height, bool mask, int initial)\n{\n    if ( m_hImageList )\n    {\n        wxFAIL_MSG(\"Recreating existing wxImageList?\");\n        Destroy();\n    }\n    ...\n}\n```","locations":[{"ref":"src/msw/imaglist.cpp:66-101","code":"   66 | bool wxImageList::Create(int width, int height, bool mask, int initial)\n   67 | {\n   68 |     wxASSERT_MSG( m_hImageList == nullptr, \"Recreating existing wxImageList?\" );\n   69 | \n   70 |     // Prevent from storing negative dimensions\n   71 |     m_size = wxSize(wxMax(width, 0), wxMax(height, 0));\n   72 |     UINT flags = 0;\n   73 | \n   74 |     // as we want to be able to use 32bpp bitmaps in the image lists, we always\n   75 |     // use ILC_COLOR32, even if the display resolution is less -- the system\n   76 |     // will make the best effort to show the bitmap if we do this resulting in\n   77 |     // quite acceptable display while using a lower depth ILC_COLOR constant\n   78 |     // (e.g. ILC_COLOR16) shows completely broken bitmaps\n   79 |     flags |= ILC_COLOR32;\n   80 | \n   81 |     m_useMask = mask;\n   82 | \n   83 |     // For comctl32.dll < 6 always use masks as it doesn't support alpha.\n   84 |     //\n   85 |     // We also have to use masks when we don't have wxImage and wxDIB that are\n   86 |     // needed to handle alpha.\n   87 | #if wxUSE_WXDIB && wxUSE_IMAGE\n   88 |     if ( wxApp::GetComCtl32Version() < 600 )\n   89 | #endif\n   90 |         flags |= ILC_MASK;\n   91 | \n   92 |     // Grow by 1, I guess this is reasonable behaviour most of the time\n   93 |     m_hImageList = (WXHIMAGELIST) ImageList_Create(width, height, flags,\n   94 |                                                    initial, 1);\n   95 |     if ( !m_hImageList )\n   96 |     {\n   97 |         wxLogLastError(wxT(\"ImageList_Create()\"));\n   98 |     }\n   99 | \n  100 |     return m_hImageList != 0;\n  101 | }","lines":36,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/imaglist.cpp#L66-L101"}]},
{"id":"MEM_5","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"`wxModalEventLoop` allocates `m_windowDisabler = new wxWindowDisabler(winModal)` in its ctor and only frees it in `OnExit()`. `OnExit()` is invoked when the loop actually runs and terminates, but the class has no destructor of its own. If a `wxModalEventLoop` object is created and then destroyed without `Run()` ever being called (e.g. an early return / error path after construction but before running), `m_windowDisabler` is leaked because the base `~wxGUIEventLoop()` does not know about it.","fix":"Add a destructor that deletes the disabler if still owned, e.g. `~wxModalEventLoop() { delete m_windowDisabler; }` (safe because `OnExit()` already nulls the pointer after deleting it), or wrap it in a smart pointer / `wxScopedPtr`.","locations":[{"ref":"include/wx/evtloop.h:377-396","code":"  377 | class WXDLLIMPEXP_CORE wxModalEventLoop : public wxGUIEventLoop\n  378 | {\n  379 | public:\n  380 |     wxModalEventLoop(wxWindow *winModal)\n  381 |     {\n  382 |         m_windowDisabler = new wxWindowDisabler(winModal);\n  383 |     }\n  384 | \n  385 | protected:\n  386 |     virtual void OnExit() override\n  387 |     {\n  388 |         delete m_windowDisabler;\n  389 |         m_windowDisabler = nullptr;\n  390 | \n  391 |         wxGUIEventLoop::OnExit();\n  392 |     }\n  393 | \n  394 | private:\n  395 |     wxWindowDisabler *m_windowDisabler;\n  396 | };","lines":20,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/evtloop.h#L377-L396"}]},
{"id":"MEM_6","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"`wxAppConsoleBase::GetTraits()` creates a traits object with `CreateTraits()` and only stores it in `m_traits` when `m_fullyConstructed` is true. If `GetTraits()` is called before the app object is fully constructed, the newly allocated `traits` is returned to the caller but never stored and never deleted, so every such call leaks one traits object (the caller does not own it and the app never records it for deletion).","fix":"Either delete the temporary traits after use, or cache it in a separate member so it can be freed later (e.g. keep it in a scoped pointer that is released into `m_traits` once `m_fullyConstructed` becomes true), rather than allocating and discarding it on each pre-construction call.","locations":[{"ref":"src/common/appbase.cpp:342-364","code":"  342 | wxAppTraits *wxAppConsoleBase::GetTraits()\n  343 | {\n  344 |     // If we already have valid traits, just return them.\n  345 |     if ( m_traits )\n  346 |         return m_traits;\n  347 | \n  348 |     // Otherwise, create a new traits object as it would be unexpected (and\n  349 |     // backwards incompatible) to return a null pointer from this function.\n  350 |     auto* const traits = CreateTraits();\n  351 | \n  352 |     // But only remember it if we're fully constructed to prevent using wrong\n  353 |     // traits object later: if m_fullyConstructed is false, it means that the\n  354 |     // object of the user-defined wxApp-derived class hasn't been fully\n  355 |     // constructed yet, and so its possibly overridden CreateTraits() wasn't\n  356 |     // called above, so make sure we do call it the next time GetTraits() is\n  357 |     // called.\n  358 |     if ( m_fullyConstructed )\n  359 |         m_traits = traits;\n  360 | \n  361 |     wxASSERT_MSG( traits, wxT(\"wxApp::CreateTraits() failed?\") );\n  362 | \n  363 |     return traits;\n  364 | }","lines":23,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/appbase.cpp#L342-L364"}]},
{"id":"MEM_7","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"very_easy","description":"The `wxClipboard` constructor creates and realizes three top-level GTK popup windows: `m_targetsWidget` (line 457), `m_targetsWidgetAsync` (line 464) and `m_clipboardWidget` (line 471). Each is created with `gtk_window_new(GTK_WINDOW_POPUP)` + `gtk_widget_realize`, so each must be explicitly destroyed with `gtk_widget_destroy`. The destructor (`~wxClipboard`) destroys only `m_clipboardWidget` and `m_targetsWidget`, so `m_targetsWidgetAsync` (and its realized GDK resources) is leaked. `m_targetsWidgetAsync` is confirmed to have no other destruction site (only referenced in the ctor and in `IsSupportedAsync`).","fix":"Add a `gtk_widget_destroy(m_targetsWidgetAsync);` call in the destructor.\n\nBefore:\n```cpp\n    gtk_widget_destroy( m_clipboardWidget );\n    gtk_widget_destroy( m_targetsWidget );\n```\nAfter:\n```cpp\n    gtk_widget_destroy( m_clipboardWidget );\n    gtk_widget_destroy( m_targetsWidget );\n    gtk_widget_destroy( m_targetsWidgetAsync );\n```","locations":[{"ref":"src/gtk/clipbrd.cpp:487-493","code":"  487 | wxClipboard::~wxClipboard()\n  488 | {\n  489 |     Clear();\n  490 | \n  491 |     gtk_widget_destroy( m_clipboardWidget );\n  492 |     gtk_widget_destroy( m_targetsWidget );\n  493 | }","lines":7,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/gtk/clipbrd.cpp#L487-L493"},{"ref":"src/gtk/clipbrd.cpp:464","code":"  464 |     m_targetsWidgetAsync = gtk_window_new( GTK_WINDOW_POPUP );","lines":1,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/gtk/clipbrd.cpp#L464"}]},
{"id":"MEM_8","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"very_easy","description":"The hatch pixmap cleanup loop in `wxDCModule::OnExit()` is off-by-one and never frees the last hatch. The array is declared as `hatches[wxBRUSHSTYLE_LAST_HATCH - wxBRUSHSTYLE_FIRST_HATCH + 1]` (valid indices `0`..`N` where `N = wxBRUSHSTYLE_LAST_HATCH - wxBRUSHSTYLE_FIRST_HATCH`), and `GetHatch()` stores into index `style - wxBRUSHSTYLE_FIRST_HATCH`, so index `N` is used for `wxBRUSHSTYLE_LAST_HATCH`. The loop `for (int i = N; i--; )` runs its body for `i = N-1 .. 0`, so the pixmap at index `N` is never passed to `g_object_unref()` and leaks. Impact is small (a single `GdkPixmap` leaked once at program exit), but it is a genuine off-by-one.","fix":"Iterate over all `N+1` entries, e.g. change the loop start to include the last index: `for (int i = wxBRUSHSTYLE_LAST_HATCH - wxBRUSHSTYLE_FIRST_HATCH + 1; i--; )`.","locations":[{"ref":"src/gtk/dcclient.cpp:2249-2253","code":" 2249 |     for (int i = wxBRUSHSTYLE_LAST_HATCH - wxBRUSHSTYLE_FIRST_HATCH; i--; )\n 2250 |     {\n 2251 |         if (hatches[i])\n 2252 |             g_object_unref(hatches[i]);\n 2253 |     }","lines":5,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/gtk/dcclient.cpp#L2249-L2253"},{"ref":"src/gtk/dcclient.cpp:47","code":"   47 | static GdkPixmap* hatches[wxBRUSHSTYLE_LAST_HATCH - wxBRUSHSTYLE_FIRST_HATCH + 1];","lines":1,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/gtk/dcclient.cpp#L47"}]},
{"id":"MEM_9","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"For a `wxRB_SINGLE` radio button, `wxRadioButton::Create()` creates `m_hiddenButton = gtk_radio_button_new(nullptr)` to allow the visible button to be toggled off. This widget starts with a GTK floating reference; it is never added to a container, never `g_object_ref_sink()`'d, and `wxRadioButton` has no destructor (confirmed in `include/wx/gtk/radiobut.h`, only `m_hiddenButton` field). GTK radio-group membership does not own a reference, so when the visible `m_widget` is destroyed the hidden button is orphaned with its floating reference and leaks. One `GtkRadioButton` is leaked per `wxRB_SINGLE` control.","fix":"Take ownership of the hidden button (e.g. `g_object_ref_sink(m_hiddenButton)` after creation) and add a destructor `~wxRadioButton()` that does `if (m_hiddenButton) gtk_widget_destroy(m_hiddenButton);` (and drops the reference), so it is destroyed with the control.","locations":[{"ref":"src/gtk/radiobut.cpp:98-105","code":"   98 |     if (HasFlag(wxRB_SINGLE))\n   99 |     {\n  100 |         m_hiddenButton = gtk_radio_button_new( nullptr );\n  101 |         m_widget = gtk_radio_button_new_with_label_from_widget( GTK_RADIO_BUTTON(m_hiddenButton), label.utf8_str() );\n  102 |         // Since this is the second button in the group, we need to ensure it\n  103 |         // is active by default and not the first hidden one.\n  104 |         gtk_toggle_button_set_active( GTK_TOGGLE_BUTTON(m_widget), TRUE );\n  105 |     }","lines":8,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/gtk/radiobut.cpp#L98-L105"}]},
{"id":"MEM_10","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"In `wxChmInputStream::CreateFileStream()` the early-return path `fin = new wxFileInputStream(tmpfile); if (!fin->IsOk()) return false;` leaks the heap-allocated `fin` object and also leaves the extracted temporary file on disk (the `wxRemoveFile(tmpfile)` only runs on the success path). Repeated failures leak both memory and temp files.","fix":"Clean up before returning:\n```cpp\nfin = new wxFileInputStream(tmpfile);\nif (!fin->IsOk())\n{\n    delete fin;\n    wxRemoveFile(tmpfile);\n    return false;\n}\n```","locations":[{"ref":"src/html/chm.cpp:724-727","code":"  724 |         // Open a filestream to extracted file\n  725 |         fin = new wxFileInputStream(tmpfile);\n  726 |         if (!fin->IsOk())\n  727 |             return false;","lines":4,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/html/chm.cpp#L724-L727"}]},
{"id":"MEM_11","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"In the `wxMask` copy constructor, two device contexts are created via `CreateCompatibleDC(0)` (`srcDC` and `destDC`) *before* the `::GetObject()` call that validates the source mask bitmap. If `::GetObject()` returns 0 (failure), the function does `wxFAIL_MSG(...)` and `return;` immediately, leaking both `srcDC` and `destDC` HDCs. On the success path both DCs are correctly deleted at the end, but the early-return path skips all cleanup.","fix":"Delete the DCs before returning on the failure path, e.g.:\n```cpp\nif (::GetObject((HGDIOBJ)mask.m_maskBitmap, sizeof(bmp), &bmp) == 0)\n{\n    wxFAIL_MSG(wxT(\"Cannot retrieve the dimensions of the wxMask to copy\"));\n    DeleteDC(srcDC);\n    DeleteDC(destDC);\n    return;\n}\n```\nAlternatively, move the `CreateCompatibleDC` calls to after the `GetObject` validation.","locations":[{"ref":"src/msw/bitmap.cpp:1512-1523","code":" 1512 |     BITMAP bmp;\n 1513 | \n 1514 |     HDC srcDC = CreateCompatibleDC(0);\n 1515 |     HDC destDC = CreateCompatibleDC(0);\n 1516 | \n 1517 |     // GetBitmapDimensionEx won't work if SetBitmapDimensionEx wasn't used\n 1518 |     // so we'll use GetObject() API here:\n 1519 |     if (::GetObject((HGDIOBJ)mask.m_maskBitmap, sizeof(bmp), &bmp) == 0)\n 1520 |     {\n 1521 |         wxFAIL_MSG(wxT(\"Cannot retrieve the dimensions of the wxMask to copy\"));\n 1522 |         return;\n 1523 |     }","lines":12,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/bitmap.cpp#L1512-L1523"}]},
{"id":"MEM_12","type":"memory_leak","type_label":"Memory Leak","severity":"negligible","difficulty":"easy","description":"`OnPaintEvent` allocates the DC with `new` (either `wxPaintDC` or `wxAutoBufferedPaintDC`) and only frees it via `delete dcPtr;` at the very end of the function. If any call in between (e.g. `m_popupInterface->PaintComboControl`, `DrawButton`, or a `wxDC` operation) throws, the DC object leaks and, worse, the paint DC is not destroyed which can leave the platform paint state inconsistent. The raw new/delete is also unnecessary.","fix":"Use a stack object or a smart pointer instead of raw `new`/`delete`, e.g. wrap in `std::unique_ptr<wxDC> dcPtr(...)` (or select between two stack-allocated DCs) so the DC is destroyed on every exit path including exceptions.","locations":[{"ref":"src/generic/combog.cpp:234-330","code":"  234 |     wxDC* dcPtr;\n  235 |     if ( HasTransparentBackground() )\n  236 |         dcPtr = new wxPaintDC(this);\n  237 |     else\n  238 |         dcPtr = new wxAutoBufferedPaintDC(this);\n  239 |     wxDC& dc = *dcPtr;\n  240 | \n  241 |     wxSize sz = GetClientSize();\n  242 |     const wxRect& butRect = m_btnArea;\n  243 |     wxRect tcRect = m_tcArea;\n  244 |     wxRect fullRect(0, 0, sz.x, sz.y);\n  245 | \n  246 |     // artificial simple border\n  247 |     if ( m_widthCustomBorder )\n  248 |     {\n  249 |         int customBorder = m_widthCustomBorder;\n  250 | \n  251 |         // Set border colour\n  252 | #ifdef __WXMAC__\n  253 |         wxPen pen1( wxColour(133,133,133),\n  254 |                     customBorder,\n  255 |                     wxPENSTYLE_SOLID );\n  256 | #else\n  257 |         wxPen pen1( wxSystemSettings::GetColour(wxSYS_COLOUR_GRAYTEXT),\n  258 |                     customBorder,\n  259 |                     wxPENSTYLE_SOLID);\n  260 | #endif\n  261 |         dc.SetPen( pen1 );\n  262 | \n  263 |         // area around both controls\n  264 |         wxRect rect2(fullRect);\n  265 |         if ( m_iFlags & wxCC_IFLAG_BUTTON_OUTSIDE )\n  266 |         {\n  267 |             rect2 = tcRect;\n  268 |             if ( customBorder == 1 )\n  269 |             {\n  270 |                 rect2.Inflate(1);\n  271 |             }\n  272 |             else\n  273 |             {\n  274 |             #ifdef __WXGTK__\n  275 |                 rect2.x -= 1;\n  276 |                 rect2.y -= 1;\n  277 |             #else\n  278 |                 rect2.x -= customBorder;\n  279 |                 rect2.y -= customBorder;\n  280 |             #endif\n  281 |                 rect2.width += 1 + customBorder;\n  282 |                 rect2.height += 1 + customBorder;\n  283 |             }\n  284 |         }\n  285 | \n  286 |         dc.SetBrush( *wxTRANSPARENT_BRUSH );\n  287 |         dc.DrawRectangle(rect2);\n  288 |     }\n  289 | \n  290 |     // Clear the main background if the system doesn't do it by itself\n  291 |     if ( !HasTransparentBackground() &&\n  292 |          (tcRect.x > 0 || tcRect.y > 0) )\n  293 |     {\n  294 |         wxColour winCol = GetParent()->GetBackgroundColour();\n  295 |         dc.SetBrush(winCol);\n  296 |         dc.SetPen(winCol);\n  297 | \n  298 |         dc.DrawRectangle(fullRect);\n  299 |     }\n  300 | \n  301 |     if ( !m_btn )\n  302 |     {\n  303 |         // Standard button rendering\n  304 |         DrawButton(dc, butRect);\n  305 |     }\n  306 | \n  307 |     // paint required portion on the control\n  308 |     if ( !m_text || m_widthCustomPaint )\n  309 |     {\n  310 |         wxASSERT( m_widthCustomPaint >= 0 );\n  311 | \n  312 |         // Clear the text-control area background\n  313 |         wxColour tcCol = GetBackgroundColour();\n  314 |         dc.SetBrush(tcCol);\n  315 |         dc.SetPen(tcCol);\n  316 |         dc.DrawRectangle(tcRect);\n  317 | \n  318 |         // this is intentionally here to allow drawn rectangle's\n  319 |         // right edge to be hidden\n  320 |         if ( m_text )\n  321 |             tcRect.width = m_widthCustomPaint;\n  322 | \n  323 |         dc.SetClippingRegion(tcRect);\n  324 |         if ( m_popupInterface )\n  325 |             m_popupInterface->PaintComboControl(dc, tcRect);\n  326 |         else\n  327 |             wxComboPopup::DefaultPaintComboControl(this, dc, tcRect);\n  328 |     }\n  329 | \n  330 |     delete dcPtr;","lines":97,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/combog.cpp#L234-L330"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"`wxHtmlHelpWindow::CreateContents()` uses fixed stack arrays `wxTreeItemId roots[MAX_ROOTS]` and `bool imaged[MAX_ROOTS]` with `MAX_ROOTS == 64`, then indexes them with `roots[it->level + 1]`, `roots[it->level]`, `imaged[it->level]` and `imaged[it->level + 1]` where `it->level` comes directly from the parsed/cached help book with **no bounds check**. (Note that `UpdateMergedIndex()` does assert `item.level < 128` for its `history[128]` array, but no such guard exists here for the smaller 64-element arrays.) A help book with a nesting `level >= 63` writes past the end of these stack arrays - a stack buffer overflow / memory corruption triggered by a malformed or maliciously crafted `.hhp`/`.hhc`/`.cached` file.","fix":"Clamp or reject levels exceeding the array bound, e.g. add `if (it->level + 1 >= MAX_ROOTS) continue;` (or `wxCHECK`) inside the loop before using `roots[it->level + 1]`, and/or raise `MAX_ROOTS` and validate `level` when loading. Ideally validate `item.level` in `LoadCachedBook`/`HandleTag` where the data enters.","locations":[{"ref":"src/html/helpwnd.cpp:947-993","code":"  947 |     const int MAX_ROOTS = 64;\n  948 |     wxTreeItemId roots[MAX_ROOTS];\n  949 |     // VS: this array holds information about whether we've set item icon at\n  950 |     //     given level. This is necessary because m_Data has a flat structure\n  951 |     //     and there's no way of recognizing if some item has subitems or not.\n  952 |     //     We set the icon later: when we find an item with level=n, we know\n  953 |     //     that the last item with level=n-1 was afolder with subitems, so we\n  954 |     //     set its icon accordingly\n  955 |     bool imaged[MAX_ROOTS];\n  956 |     m_ContentsBox->DeleteAllItems();\n  957 | \n  958 |     roots[0] = m_ContentsBox->AddRoot(_(\"(Help)\"));\n  959 |     imaged[0] = true;\n  960 | \n  961 |     for (size_t i = 0; i < cnt; i++)\n  962 |     {\n  963 |         wxHtmlHelpDataItem *it = &contents[i];\n  964 |         // Handle books:\n  965 |         if (it->level == 0)\n  966 |         {\n  967 |             if (m_hfStyle & wxHF_MERGE_BOOKS)\n  968 |                 // VS: we don't want book nodes, books' content should\n  969 |                 //    appear under tree's root. This line will create a \"fake\"\n  970 |                 //    record about book node so that the rest of this look\n  971 |                 //    will believe there really _is_ a book node and will\n  972 |                 //    behave correctly.\n  973 |                 roots[1] = roots[0];\n  974 |             else\n  975 |             {\n  976 |                 roots[1] = m_ContentsBox->AppendItem(roots[0],\n  977 |                                          it->name, IMG_Book, -1,\n  978 |                                          new wxHtmlHelpTreeItemData(i));\n  979 |                 m_ContentsBox->SetItemBold(roots[1], true);\n  980 |             }\n  981 |             imaged[1] = true;\n  982 |         }\n  983 |         // ...and their contents:\n  984 |         else\n  985 |         {\n  986 |             roots[it->level + 1] = m_ContentsBox->AppendItem(\n  987 |                                      roots[it->level], it->name, IMG_Page,\n  988 |                                      -1, new wxHtmlHelpTreeItemData(i));\n  989 |             imaged[it->level + 1] = false;\n  990 |         }\n  991 | \n  992 |         m_PagesHash->Put(it->GetFullPath(),\n  993 |                          new wxHtmlHelpHashData(i, roots[it->level + 1]));","lines":47,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/html/helpwnd.cpp#L947-L993"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`wxFontsManager::GetDefaultFacename()` indexes the fixed-size array `m_defaultFacenames` directly with the `family` argument, but the array is declared as `wxString m_defaultFacenames[wxFONTFAMILY_MAX]` (size 77, valid indices `wxFONTFAMILY_DEFAULT`=70 .. `wxFONTFAMILY_TELETYPE`=76). Since `wxFONTFAMILY_UNKNOWN == wxFONTFAMILY_MAX` (== 77), passing `wxFONTFAMILY_UNKNOWN` reads one element past the end of the array. This is reachable: `wxFontsManagerBase::GetBundleForFont()` calls `GetDefaultFacename((wxFontFamily)font.GetFamily())`, and the `wxFontFamily` enum comment explicitly notes that an existing font's family `may be unknown`, so `GetFamily()` can legitimately return `wxFONTFAMILY_UNKNOWN`.","fix":"Guard the index or enlarge the array. Either size it as `wxString m_defaultFacenames[wxFONTFAMILY_MAX + 1];`, or bounds-check in the accessor:\n```cpp\nvirtual wxString GetDefaultFacename(wxFontFamily family) const\n{\n    if ( family < 0 || family >= wxFONTFAMILY_MAX )\n        return wxString();\n    return m_defaultFacenames[family];\n}\n```","locations":[{"ref":"include/wx/dfb/private/fontmgr.h:66-69","code":"   66 |     virtual wxString GetDefaultFacename(wxFontFamily family) const\n   67 |     {\n   68 |         return m_defaultFacenames[family];\n   69 |     }","lines":4,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/dfb/private/fontmgr.h#L66-L69"},{"ref":"include/wx/dfb/private/fontmgr.h:80","code":"   80 |     wxString m_defaultFacenames[wxFONTFAMILY_MAX];","lines":1,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/dfb/private/fontmgr.h#L80"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"In `wxANIDecoder::Load()` the frame/image counts are read straight from an untrusted ANI file into signed `wxInt32` fields (`header.cSteps`, `header.cFrames`) and used to size containers without sign or upper-bound validation. `m_nFrames = header.cSteps` assigns to an `unsigned int`, so a negative or very large `cSteps` becomes a huge count; `m_info.resize(m_nFrames)` and `m_images.reserve(header.cFrames)` then try to allocate gigabytes, throwing `std::length_error`/`std::bad_alloc` which is not caught here or in the image-loading callers, aborting the program. The only guard is `if ( m_nFrames == 0 ) return false;`, which does not catch large or negative values, so a malformed ANI file causes a crash/DoS.","fix":"Validate the header counts before use, e.g. reject the file if `header.cSteps <= 0`, `header.cFrames <= 0`, or if either exceeds a sane maximum (bounded by how many icon chunks the stream can plausibly contain), before `m_info.resize()` / `m_images.reserve()`; alternatively wrap those calls in try/catch so a bogus count returns `false` instead of throwing.","locations":[{"ref":"src/common/anidecod.cpp:259-276","code":"  259 |             struct wxANIHeader header;\n  260 |             if (!stream.Read(&header, sizeof(wxANIHeader)))\n  261 |                 return false;\n  262 |             header.AdjustEndianness();\n  263 | \n  264 |             // we should have a global frame size\n  265 |             m_szAnimation = wxSize(header.cx, header.cy);\n  266 | \n  267 |             // save interesting info from the header\n  268 |             m_nFrames = header.cSteps;   // NB: not cFrames!!\n  269 |             if ( m_nFrames == 0 )\n  270 |                 return false;\n  271 | \n  272 |             globaldelay = header.JifRate * 1000 / 60;\n  273 | \n  274 |             m_images.reserve(header.cFrames);\n  275 |             m_info.resize(m_nFrames);\n  276 |         }","lines":18,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/anidecod.cpp#L259-L276"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"In `EllipsizeCalculator`, when `wxELLIPSIZE_FLAGS_PROCESS_MNEMONICS` is set and the input string ends with a lone `&`, `wxControl::RemoveMnemonics(s)` drops that trailing `&`, so `m_charOffsetsPx` ends up with only `len-1` entries (the code even acknowledges this in the `#if wxDEBUG_LEVEL` branch by decrementing `expectedOffsetsCount`, and no offset is inserted for it). However the rest of the ellipsization math assumes `m_charOffsetsPx` has exactly `len` entries: e.g. in `IsShortEnough()` the access `m_charOffsetsPx[GetLastRemoved()]` (and `m_charOffsetsPx[m_initialCharToRemove - 1]`) can use index `len-1`, which is out of bounds for an array of size `len-1`. In debug builds this is caught by the `wxASSERT` at line 350, but in release builds `wxArrayInt::operator[]` performs no bounds check, so this is an out-of-bounds/uninitialized read producing a garbage width (undefined behavior). Reachable with a malformed but legal label such as `\"File&\"` combined with a `maxFinalWidth` small enough to require ellipsization.","fix":"Make the offsets array consistently have `len` entries even for a trailing mnemonic `&`. In the mnemonic loop, when the last character is a lone `&`, still insert a duplicate cumulative width for it (e.g. append `m_charOffsetsPx.Last()` / `0` for the empty case) instead of only adjusting `expectedOffsetsCount`, so that `m_charOffsetsPx.GetCount() == s.length()` always holds and the `m_charOffsetsPx[GetLastRemoved()]` indexing stays in bounds. Alternatively, clamp `GetLastRemoved()`/`m_initialCharToRemove` accesses to `m_charOffsetsPx.GetCount() - 1`.","locations":[{"ref":"src/common/ctrlcmn.cpp:312-341","code":"  312 |             size_t n = 0;\n  313 |             bool lastWasMnemonic = false;\n  314 |             for ( wxString::const_iterator it = s.begin();\n  315 |                   it != s.end();\n  316 |                   ++it, ++n )\n  317 |             {\n  318 |                 if ( *it == '&' && !lastWasMnemonic )\n  319 |                 {\n  320 |                     if ( (it + 1) != s.end() )\n  321 |                     {\n  322 |                         int w = m_charOffsetsPx[n];\n  323 |                         m_charOffsetsPx.Insert(w, n);\n  324 |                         lastWasMnemonic = true;\n  325 |                     }\n  326 | #if wxDEBUG_LEVEL\n  327 |                     else // Last character is an ampersand.\n  328 |                     {\n  329 |                         // This ampersand is removed by RemoveMnemonics() and\n  330 |                         // won't be displayed when this string is drawn, so we\n  331 |                         // intentionally don't use it for our calculations --\n  332 |                         // just account for this in the assert below.\n  333 |                         expectedOffsetsCount--;\n  334 |                     }\n  335 | #endif // wxDEBUG_LEVEL\n  336 |                 }\n  337 |                 else // Not an ampersand used to introduce a mnemonic.\n  338 |                 {\n  339 |                     lastWasMnemonic = false;\n  340 |                 }\n  341 |             }","lines":30,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/ctrlcmn.cpp#L312-L341"},{"ref":"src/common/ctrlcmn.cpp:417-426","code":"  417 |         int estimatedWidth = m_replacementWidthPx; // length of \"...\"\n  418 | \n  419 |         // length of text before the removed part:\n  420 |         if ( m_initialCharToRemove > 0 )\n  421 |             estimatedWidth += m_charOffsetsPx[m_initialCharToRemove - 1];\n  422 | \n  423 |         // length of text after the removed part:\n  424 | \n  425 |         if ( GetLastRemoved() < m_str.length() )\n  426 |            estimatedWidth += m_charOffsetsPx.Last() - m_charOffsetsPx[GetLastRemoved()];","lines":10,"link":"https:// {"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"`wxDataViewModel::Compare()` breaks ties with `return ascending ? id1 - id2 : id2 - id1;` where `id1`/`id2` are `wxUIntPtr` (pointer-sized unsigned). The unsigned subtraction is then truncated to the `int` return type. On 64-bit platforms two heap `wxDataViewItem` IDs can easily differ by more than `INT_MAX`, so the truncated result has an essentially arbitrary sign, producing an inconsistent (non-transitive) ordering during sorting. `wxDataViewVirtualListModel::Compare()` has the identical `pos1 - pos2` pattern (lower risk there since positions are small row indices).","fix":"Compare the values explicitly instead of subtracting, e.g.:\n```cpp\nif ( id1 != id2 )\n    return (id1 < id2) == ascending ? -1 : 1;\nreturn 0;\n```\nApply the same three-way comparison in `wxDataViewVirtualListModel::Compare()`.","locations":[{"ref":"src/common/datavcmn.cpp:423-427","code":"  423 |     // items must be different\n  424 |     wxUIntPtr id1 = wxPtrToUInt(item1.GetID()),\n  425 |               id2 = wxPtrToUInt(item2.GetID());\n  426 | \n  427 |     return ascending ? id1 - id2 : id2 - id1;","lines":5,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/datavcmn.cpp#L423-L427"},{"ref":"src/common/datavcmn.cpp:665-671","code":"  665 |     unsigned int pos1 = wxPtrToUInt(item1.GetID());  // -1 not needed here\n  666 |     unsigned int pos2 = wxPtrToUInt(item2.GetID());  // -1 not needed here\n  667 | \n  668 |     if (ascending)\n  669 |        return pos1 - pos2;\n  670 |     else\n  671 |        return pos2 - pos1;","lines":7,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/datavcmn.cpp#L665-L671"}]},
{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`SetFromDOS()` and `GetAsDOS()` store the 7-bit DOS year field in a signed `long`. In `SetFromDOS()`, `long year = ddt & 0xFE000000;` produces a value up to `0xFE000000`; on platforms where `long` is 32-bit (all Windows LLP64 builds) this exceeds `LONG_MAX`, becomes negative, and the subsequent arithmetic `year >>= 25` sign-extends, yielding a completely wrong year. Symmetrically, `GetAsDOS()` computes `year <<= 25` where `year = tm_year - 80`; once the year offset reaches 64 (calendar year 2044), `64 << 25 == 0x80000000` overflows the sign bit of a 32-bit signed `long` (undefined behavior). So DOS dates from 2044 onward (a valid range: the format allows year offsets 0-127, i.e. up to 2107) are mis-converted on 32-bit-`long` platforms.","fix":"Use unsigned intermediates so the shifts are well-defined, e.g. in `SetFromDOS()`:\n```cpp\nlong year = (long)((ddt & 0xFE000000u) >> 25);\nyear += 80;\ntm.tm_year = year;\n```\nand in `GetAsDOS()` build the value in an `unsigned long` (`unsigned long year = ((unsigned long)(tm->tm_year - 80)) << 25;` etc.) before OR-ing the fields together into `ddt`.","locations":[{"ref":"src/common/datetime.cpp:1389-1414","code":" 1389 |     long year = ddt & 0xFE000000;\n 1390 |     year >>= 25;\n 1391 |     year += 80;\n 1392 |     tm.tm_year = year;\n 1393 | \n 1394 |     long month = ddt & 0x1E00000;\n 1395 |     month >>= 21;\n 1396 |     month -= 1;\n 1397 |     tm.tm_mon = month;\n 1398 | \n 1399 |     long day = ddt & 0x1F0000;\n 1400 |     day >>= 16;\n 1401 |     tm.tm_mday = day;\n 1402 | \n 1403 |     long hour = ddt & 0xF800;\n 1404 |     hour >>= 11;\n 1405 |     tm.tm_hour = hour;\n 1406 | \n 1407 |     long minute = ddt & 0x7E0;\n 1408 |     minute >>= 5;\n 1409 |     tm.tm_min = minute;\n 1410 | \n 1411 |     long second = ddt & 0x1F;\n 1412 |     tm.tm_sec = second * 2;\n 1413 | \n 1414 |     return Set(mktime(&tm));","lines":26,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/datetime.cpp#L1389-L1414"}]},
{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"hard","description":"In `wxMBConvUTF8::FromWChar()` (the non-strict path with `MAP_INVALID_UTF8_TO_OCTAL`), after `cc = *psz++` the code reads `psz[0]` (backslash-escape branch) and `psz[0]`, `psz[1]`, `psz[2]` (octal-escape branch) without ever checking `psz` against `end`. When called with an explicit `srcLen` and a source buffer that is not NUL-terminated and ends in a backslash, these reads go up to 3 `wchar_t` past the end of the input buffer (out-of-bounds read). The surrogate branch just above does perform the `end ? psz == end` bounds check, so this one is an inconsistent omission.","fix":"Bounds-check before indexing, e.g. only take the escape branches when the required look-ahead characters are still within `[psz, end)` (and, for NUL-terminated input, before the terminating NUL): guard `psz[0]`/`psz[1]`/`psz[2]` accesses with `(!end || psz + k < end)` checks.","locations":[{"ref":"src/common/strconv.cpp:1393-1409","code":" 1393 |         else if ( (m_options & MAP_INVALID_UTF8_TO_OCTAL)\n 1394 |                     && cc == L'\\\\' && psz[0] == L'\\\\' )\n 1395 |         {\n 1396 |             if (buf)\n 1397 |                 *buf++ = (char)cc;\n 1398 |             psz++;\n 1399 |             len++;\n 1400 |         }\n 1401 |         else if ( (m_options & MAP_INVALID_UTF8_TO_OCTAL) &&\n 1402 |                     cc == L'\\\\' &&\n 1403 |                         isoctal(psz[0]) && isoctal(psz[1]) && isoctal(psz[2]) )\n 1404 |         {\n 1405 |             if (buf)\n 1406 |             {\n 1407 |                 *buf++ = (char) ((psz[0] - L'0') * 0100 +\n 1408 |                                  (psz[1] - L'0') * 010 +\n 1409 |                                  (psz[2] - L'0'));","lines":17,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/strconv.cpp#L1393-L1409"}]},
{"id":"OVF_8","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"very_easy","description":"In `wxCairoBitmapData::InitBuffer()` the allocation size `height*stride` is computed in `int` arithmetic. Both `height` and `stride` (`4*width` or `cairo_format_stride_for_width()`) derive from externally-influenced bitmap/image dimensions. For a large-but-valid image (e.g. ~30000x30000) `height*stride` exceeds `INT_MAX` and wraps, producing a negative or small value that is then passed to `new unsigned char[...]`. A wrapped-small value causes a heap under-allocation, and the subsequent per-pixel writes in the `wxBitmap`/`wxImage` copy loops overflow the buffer. Additionally `cairo_format_stride_for_width()` can return `-1` on overflow, which is not checked.","fix":"Compute the size in `size_t` and guard against a negative stride, e.g. change\n```cpp\n    m_buffer = new unsigned char[height*stride];\n```\nto\n```cpp\n    m_buffer = new unsigned char[size_t(height) * size_t(stride)];\n```\nand bail out (return an error / assert) if `stride < 0` after `cairo_format_stride_for_width()`.","locations":[{"ref":"src/generic/graphicc.cpp:1562-1585","code":" 1562 |     int stride;\n 1563 | #if CAIRO_VERSION >= CAIRO_VERSION_ENCODE(1, 6, 0)\n 1564 |     if ( cairo_version() >= CAIRO_VERSION_ENCODE(1, 6, 0) )\n 1565 |     {\n 1566 |         stride = cairo_format_stride_for_width(format, width);\n 1567 | \n 1568 |         // All our code would totally break if stride were not a multiple of 4\n 1569 |         // so ensure this is the case.\n 1570 |         if ( stride % 4 )\n 1571 |         {\n 1572 |             wxFAIL_MSG(\"Unexpected Cairo image surface stride.\");\n 1573 | \n 1574 |             stride += 4 - stride % 4;\n 1575 |         }\n 1576 |     }\n 1577 |     else\n 1578 | #endif\n 1579 |         stride = 4*width;\n 1580 | \n 1581 |     m_width = width;\n 1582 |     m_height = height;\n 1583 |     m_buffer = new unsigned char[height*stride];\n 1584 | \n 1585 |     return stride;","lines":24,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/graphicc.cpp#L1562-L1585"}]},
{"id":"OVF_9","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`wxListBox::GetString()` calls `int len = ListBox_GetTextLen(GetHwnd(), n);` and uses it directly as `wxStringBuffer(result, len + 1)` without checking whether `len` is `LB_ERR` (`-1`), which the `LB_GETTEXTLEN` message can legitimately return (e.g. under low-memory conditions) even for a valid index already checked by `IsValid(n)`. If that happens, `len + 1` evaluates to `0`, a zero-sized string buffer is allocated, and the subsequent `ListBox_GetText()` call writes the actual item text into it, overflowing the buffer.","fix":"Check for the error return before allocating the buffer:\n```cpp\nint len = ListBox_GetTextLen(GetHwnd(), n);\nif ( len == LB_ERR )\n    return wxEmptyString;\n```","locations":[{"ref":"src/msw/listbox.cpp:441-453","code":"  441 | wxString wxListBox::GetString(unsigned int n) const\n  442 | {\n  443 |     wxCHECK_MSG( IsValid(n), wxEmptyString,\n  444 |                  wxT(\"invalid index in wxListBox::GetString\") );\n  445 | \n  446 |     int len = ListBox_GetTextLen(GetHwnd(), n);\n  447 | \n  448 |     // +1 for terminating NUL\n  449 |     wxString result;\n  450 |     ListBox_GetText(GetHwnd(), n, (wxChar*)wxStringBuffer(result, len + 1));\n  451 | \n  452 |     return result;\n  453 | }","lines":13,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/listbox.cpp#L441-L453"}]},
{"id":"OVF_10","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`wxMemoryBufferData::ResizeIfNeeded()` computes `newSize + wxMemoryBufferData::DefBufSize` (`DefBufSize` == 1024) twice with no overflow check. If `newSize` is within 1024 of `SIZE_MAX` the addition wraps to a small value: `realloc()` then allocates a tiny buffer and `m_size` is set to that wrapped small value, while the caller believes it obtained `newSize` bytes. The realloc-failure guard (`free(release())`) does not help because realloc succeeds for the small wrapped size, so a subsequent write of `newSize` bytes overruns the heap allocation. Reachable via `SetBufSize()`/`GetWriteBuf()`/`GetAppendBuf()` when the requested size is externally influenced and pathologically large.","fix":"Guard the addition against overflow before `realloc`, e.g. when `newSize > SIZE_MAX - wxMemoryBufferData::DefBufSize` treat it like the allocation-failure path (`free(release()); return;`), then use the checked total for both `realloc` and `m_size`.","locations":[{"ref":"include/wx/buffer.h:541-557","code":"  541 |     void ResizeIfNeeded(size_t newSize)\n  542 |     {\n  543 |         if (newSize > m_size)\n  544 |         {\n  545 |             void* const data = realloc(m_data, newSize + wxMemoryBufferData::DefBufSize);\n  546 |             if ( !data )\n  547 |             {\n  548 |                 // It's better to crash immediately dereferencing a null\n  549 |                 // pointer in the function calling us than overflowing the\n  550 |                 // buffer which couldn't be made big enough.\n  551 |                 free(release());\n  552 |                 return;\n  553 |             }\n  554 | \n  555 |             m_data = data;\n  556 |             m_size = newSize + wxMemoryBufferData::DefBufSize;\n  557 |         }","lines":17,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/buffer.h#L541-L557"}]},
{"id":"OVF_11","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`wxPoint2DInt::GetVectorLength()` computes `m_x*m_x + m_y*m_y` entirely in 32-bit `wxInt32` arithmetic and only casts the *result* to `wxDouble`. For moderately large coordinates (e.g. > ~46340) the squares and their sum overflow `wxInt32`, yielding a wrong (possibly negative) value passed to `sqrt`. `GetDistanceSquare()` correctly casts to `wxDouble` before multiplying, so the fix pattern already exists in this file.","fix":"Cast operands to `wxDouble` before squaring: `return sqrt( (wxDouble)m_x*m_x + (wxDouble)m_y*m_y );`","locations":[{"ref":"include/wx/geometry.h:178-181","code":"  178 | inline wxDouble wxPoint2DInt::GetVectorLength() const\n  179 | {\n  180 |     return sqrt( static_cast<wxDouble>(m_x*m_x + m_y*m_y) );\n  181 | }","lines":4,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/geometry.h#L178-L181"}]},
{"id":"OVF_12","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`wxHtmlEntitiesParser::GetCharForCode(unsigned code)` returns `(wxChar)code` directly. On platforms where `wxChar` is 16-bit (e.g. `wchar_t` on Windows), any numeric character reference above U+FFFF (e.g. `&#128512;`) is silently truncated to the wrong BMP character instead of being encoded as a surrogate pair, so astral-plane entities in HTML are rendered incorrectly.","fix":"Return a `wxString` (or otherwise handle code points > 0xFFFF via surrogate encoding) instead of casting a possibly-out-of-range `unsigned` straight to a single `wxChar`, so supplementary-plane code points survive on 16-bit `wxChar` builds.","locations":[{"ref":"include/wx/html/htmlpars.h:280","code":"  280 |     wxChar GetCharForCode(unsigned code) const { return (wxChar)code; }","lines":1,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/html/htmlpars.h#L280"}]},
{"id":"OVF_13","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"`CInvokable::AddRef()` and `CInvokable::Release()` must satisfy the COM `IUnknown` ABI, which requires them to return `ULONG` (32-bit), but the backing counter `m_nRefCount` is `std::atomic<size_t>` (64-bit on Win64). `return ++m_nRefCount;` and `size_t ret = --m_nRefCount; ... return ret;` both silently truncate the 64-bit result to `ULONG` on return, which is a real (if currently harmless, since ref counts never approach 2^32) type mismatch that most compilers will flag with a narrowing/truncation warning.","fix":"Declare the counter with the same width as the COM return type, e.g. `std::atomic<ULONG> m_nRefCount;`, so `AddRef()`/`Release()` no longer implicitly truncate:\n\n```cpp\nprivate:\n    std::atomic<ULONG> m_nRefCount;\n```","locations":[{"ref":"include/wx/msw/wrl/event.h:36-46","code":"   36 |     ULONG STDMETHODCALLTYPE AddRef() override\n   37 |     {\n   38 |         return ++m_nRefCount;\n   39 |     }\n   40 |     ULONG STDMETHODCALLTYPE Release() override\n   41 |     {\n   42 |         size_t ret = --m_nRefCount;\n   43 |         if (ret == 0)\n   44 |             delete this;\n   45 |         return ret;\n   46 |     }","lines":11,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/msw/wrl/event.h#L36-L46"}]},
