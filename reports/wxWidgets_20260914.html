{"id":"LOGIC_70","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `wxZipEndRec::Read`, after reading the end-of-central-directory record (which consumes `END_SIZE-4` bytes plus `commentLen` comment bytes) the code seeks back to find the ZIP64 locator with `stream.SeekI(-(END_SIZE+Z64_LOC_SIZE), wxFromCurrent)`. This offset ignores `commentLen`: the ZIP64 end-of-central-directory locator sits immediately before the regular EOCD record regardless of comment, so when an archive comment is present the seek lands `commentLen` bytes off and `dsLoc.Read32() == Z64_LOC_MAGIC` fails, so ZIP64 sizes/offsets are never read and a valid ZIP64 archive that also has a comment is misread.","fix":"Account for the comment when seeking back, e.g. `stream.SeekI(-(wxFileOffset(END_SIZE) + Z64_LOC_SIZE + commentLen), wxFromCurrent);` (or seek relative to the saved start-of-EOCD position).","locations":[{"ref":"src/common/zipstrm.cpp:1526-1529","code":" 1526 |     // Look for zip64 end record\n 1527 |     stream.SeekI(-(END_SIZE+Z64_LOC_SIZE), wxFromCurrent);\n 1528 |     wxZipHeader dsLoc(stream, Z64_LOC_SIZE);\n 1529 |     if ( dsLoc && dsLoc.Read32() == Z64_LOC_MAGIC )","lines":4,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/zipstrm.cpp#L1526-L1529"}]},
{"id":"LOGIC_71","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"The automatic alternate-row colour is chosen with `int alpha = bgColour.GetRGB() > 0x808080 ? 97 : 110;`. `wxColour::GetRGB()` returns the packed value `red | (green << 8) | (blue << 16)`, so comparing the whole packed integer against `0x808080` is dominated by the blue channel rather than perceived brightness. For a dark but blue-heavy background (e.g. pure blue `(0,0,255)` -> `0xFF0000` packed, which is `> 0x808080`) the row is darkened as if the background were light, giving the wrong contrast direction. The intent (per the adjacent comment) is to darken light backgrounds and brighten dark ones, which requires a luminance test.","fix":"Base the decision on luminance instead of the packed RGB value, e.g. compute `(r*77 + g*151 + b*28) >> 8` (or use an existing brightness helper) and compare that against a mid-gray threshold to pick `97` vs `110`.","locations":[{"ref":"src/generic/datavgen.cpp:2616-2628","code":" 2616 |         wxColour altRowColour = m_owner->m_alternateRowColour;\n 2617 |         if ( !altRowColour.IsOk() )\n 2618 |         {\n 2619 |             // Determine the alternate rows colour automatically from the\n 2620 |             // background colour.\n 2621 |             const wxColour bgColour = m_owner->GetBackgroundColour();\n 2622 | \n 2623 |             // Depending on the background, alternate row color\n 2624 |             // will be 3% more dark or 10% brighter -- because 3% brighter\n 2625 |             // would be unnoticeable.\n 2626 |             int alpha = bgColour.GetRGB() > 0x808080 ? 97 : 110;\n 2627 |             altRowColour = bgColour.ChangeLightness(alpha);\n 2628 |         }","lines":13,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/datavgen.cpp#L2616-L2628"}]},
{"id":"LOGIC_72","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"The header-selection guard uses `#ifdef wxUSE_FFILE` but `wxUSE_FFILE` is always *defined* (as `0` or `1`) in `setup.h`, so this preprocessor branch is always taken and `wx/file.h` is never included. Meanwhile the actual usage site at line 446 correctly uses `#if wxUSE_FFILE`. If a build sets `wxUSE_FFILE 0` (with `wxUSE_FILE 1`), `OnView()` falls into the `#elif wxUSE_FILE` branch and uses `wxFile`, but `wx/file.h` was never included, causing a compile error. The two macro tests must be consistent.","fix":"Use a value test to match line 446:\n```cpp\n#if wxUSE_FFILE\n    #include \"wx/ffile.h\"\n#else\n    #include \"wx/file.h\"\n#endif\n```","locations":[{"ref":"src/generic/dbgrptg.cpp:37-41","code":"   37 | #ifdef wxUSE_FFILE\n   38 |     #include \"wx/ffile.h\"\n   39 | #else\n   40 |     #include \"wx/file.h\"\n   41 | #endif","lines":5,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/dbgrptg.cpp#L37-L41"}]},
{"id":"LOGIC_73","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`DoDrawEllipse` computes its automatic bounding box as `CalcBoundingBox( x - width, y - height, x + width, y + height )`, but the ellipse is centered at `(x + width/2, y + height/2)` with radii `width/2`/`height/2`, so it actually spans `[x, x+width] x [y, y+height]`. Passing `x - width` / `y - height` extends the recorded bounding box a full `width`/`height` too far to the left and top. Contrast with `DoDrawRectangle` (uses `wxPoint(x, y), wxSize(width, height)`) and `DoDrawArc` (uses the correct `xc-radius`..`xc+radius`). This yields an incorrect (oversized, asymmetric) bounding box for documents/EPS.","fix":"Use the same correct extent as `DoDrawRectangle`: replace both `CalcBoundingBox( x - width, y - height, x + width, y + height )` calls with `CalcBoundingBox( wxPoint(x, y), wxSize(width, height) )`.","locations":[{"ref":"src/generic/dcpsg.cpp:931-932","code":"  931 |         if ( AreAutomaticBoundingBoxUpdatesEnabled() )\n  932 |             CalcBoundingBox( x - width, y - height, x + width, y + height );","lines":2,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/dcpsg.cpp#L931-L932"},{"ref":"src/generic/dcpsg.cpp:948-949","code":"  948 |         if ( AreAutomaticBoundingBoxUpdatesEnabled() )\n  949 |             CalcBoundingBox( x - width, y - height, x + width, y + height );","lines":2,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/dcpsg.cpp#L948-L949"}]},
{"id":"LOGIC_74","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In the non-`wxFSVOLUME` branch of `wxGetAvailableDrives`, `drive` is a `char` iterating from `'A'` to `'Z'`, so the test `drive <= 2` compares a character code (e.g. `'A'` == 65) against the integer `2` and is *always false*. As a result the floppy icon (`wxFileIconsTable::floppy`) is never assigned and drives A: and B: always get the generic hard-drive icon. This branch is reachable on Windows built with `wxUSE_FSVOLUME==0`. The intended check was almost certainly `drive <= 'B'`.","fix":"Change the comparison to use the character literal:\n```cpp\nicon_ids.Add(drive <= 'B' ? wxFileIconsTable::floppy\n                          : wxFileIconsTable::drive);\n```","locations":[{"ref":"src/generic/dirctrlg.cpp:148-149","code":"  148 |             icon_ids.Add(drive <= 2 ? wxFileIconsTable::floppy\n  149 |                                     : wxFileIconsTable::drive);","lines":2,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/dirctrlg.cpp#L148-L149"}]},
{"id":"LOGIC_75","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `wxCairoPenData::Init()` for `wxPENSTYLE_USER_DASH`, `m_count` is set from `info.GetDashes()` unconditionally, but `m_lengths` is only allocated when `wxdashes != nullptr && m_count > 0`. If the API returns a positive count with a null pointer, `m_lengths` stays null while `m_count > 0`, and the later dash-adjustment loop `for (int i = 0; i < m_count; i++) m_lengths[i] ...` dereferences a null pointer.","fix":"Reset `m_count = 0` whenever the allocation is skipped, e.g. add an `else { m_count = 0; }` to the `if ((wxdashes != nullptr) && (m_count > 0))` block so the subsequent loop cannot run with a null `m_lengths`.","locations":[{"ref":"src/generic/graphicc.cpp:957-970","code":"  957 |     case wxPENSTYLE_USER_DASH :\n  958 |         {\n  959 |             wxDash *wxdashes ;\n  960 |             m_count = info.GetDashes( &wxdashes ) ;\n  961 |             if ((wxdashes != nullptr) && (m_count > 0))\n  962 |             {\n  963 |                 m_lengths = new double[m_count];\n  964 |                 for ( int i = 0 ; i < m_count ; ++i )\n  965 |                 {\n  966 |                     m_lengths[i] = wxdashes[i];\n  967 |                 }\n  968 |             }\n  969 |         }\n  970 |         break;","lines":14,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/graphicc.cpp#L957-L970"},{"ref":"src/generic/graphicc.cpp:992-1003","code":"  992 |     const double dashUnit = wxMax(m_width, 1.0);\n  993 |     for (int i = 0; i < m_count; i++)\n  994 |     {\n  995 |         if (m_cap != CAIRO_LINE_CAP_BUTT)\n  996 |         {\n  997 |             // Rounded/projecting cap will extend 0.5 on either side of \"on\" segment,\n  998 |             // increase \"off\" length, decrease \"on\" to account for this.\n  999 |             // Note that 0-length \"on\" is valid.\n 1000 |             m_lengths[i] += (i & 1) ? 1 : -1;\n 1001 |         }\n 1002 |         m_lengths[i] *= dashUnit;\n 1003 |     }","lines":12,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/graphicc.cpp#L992-L1003"}]},
{"id":"LOGIC_76","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"The assertion in `wxGridCellAttr::SetSize()` is effectively a no-op because it ORs three negated, mutually-exclusive clauses. The clauses `(num_rows>0 && num_cols<=0)`, `(num_rows<=0 && num_cols>0)` and `(num_rows==0 && num_cols==0)` can never all be true at once, so at least two of the negations are always `true`, making the whole `||` expression always `true`. The assert therefore never fires, even for the invalid mixed-sign inputs it is supposed to catch (the comment says only two positive values or negative/zero values are accepted).","fix":"Combine the negated invalid-case clauses with `&&` (and drop the contradictory `(0,0)` clause) so the assertion actually holds only for valid inputs:\n```cpp\nwxASSERT_MSG( !((num_rows > 0) && (num_cols <= 0)) &&\n              !((num_rows <= 0) && (num_cols > 0)),\n              wxT(\"wxGridCellAttr::SetSize only takes two positive values or negative/zero values\"));\n```","locations":[{"ref":"src/generic/grid.cpp:694-697","code":"  694 |     wxASSERT_MSG( (!((num_rows > 0) && (num_cols <= 0)) ||\n  695 |                   !((num_rows <= 0) && (num_cols > 0)) ||\n  696 |                   !((num_rows == 0) && (num_cols == 0))),\n  697 |                   wxT(\"wxGridCellAttr::SetSize only takes two positive values or negative/zero values\"));","lines":4,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/grid.cpp#L694-L697"}]},
{"id":"LOGIC_77","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `wxGridCellAccessible::GetState()` the `wxACC_STATE_SYSTEM_OFFSCREEN` flag is set when the cell IS visible, which is inverted. `wxGrid::IsVisible(m_coords, false)` returns `true` when the cell is (at least partly) visible, so the code reports a cell as off-screen precisely when it is on-screen (and never reports genuinely scrolled-out cells as off-screen). This feeds wrong state information to assistive technologies.","fix":"Negate the condition so the flag is set only when the cell is not visible:\n```cpp\nif ( !grid->IsVisible(m_coords, false) )\n    st |= wxACC_STATE_SYSTEM_OFFSCREEN;\n```","locations":[{"ref":"src/generic/grid.cpp:12938-12939","code":"12938 |         if ( grid->IsVisible(m_coords, false) )\n12939 |             st |= wxACC_STATE_SYSTEM_OFFSCREEN;","lines":2,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/grid.cpp#L12938-L12939"}]},
{"id":"LOGIC_78","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`wxGenericImageList::Add(const wxBitmap&)` rejects (returns -1) any bitmap whose width is smaller than the image-list width: the `else` at line 158 is reached when `bitmapSize.x < m_size.x` and the scale factor is 1.0. However `GetImageListBitmap()` explicitly supports up-scaling smaller bitmaps (its final `else` branch, lines 99-110) and `Replace()` happily uses that path for smaller bitmaps. So a bitmap smaller than the list size can be used with `Replace()` but not with `Add()`, an inconsistency that silently drops the image and returns an invalid index.","fix":"Treat the `bitmapSize.x < m_size.x` case like the equal case by falling through to `m_images.push_back(GetImageListBitmap(bitmap));` (which resizes as needed), reserving the multi-image chopping only for the `bitmapSize.x > m_size.x` branch, so `Add()` and `Replace()` behave consistently for undersized bitmaps.","locations":[{"ref":"src/generic/imaglist.cpp:144-160","code":"  144 |     if ( bitmapSize.x == m_size.x || bitmap.GetScaleFactor() != 1.0 )\n  145 |     {\n  146 |         m_images.push_back(GetImageListBitmap(bitmap));\n  147 |     }\n  148 |     else if ( bitmapSize.x > m_size.x )\n  149 |     {\n  150 |         const int numImages = bitmapSize.x / m_size.x;\n  151 |         for (int subIndex = 0; subIndex < numImages; subIndex++)\n  152 |         {\n  153 |             wxRect rect(m_size.x * subIndex, 0, m_size.x, m_size.y);\n  154 |             m_images.push_back(GetImageListBitmap(bitmap.GetSubBitmap(rect)));\n  155 |         }\n  156 |     }\n  157 |     else\n  158 |     {\n  159 |         return -1;\n  160 |     }","lines":17,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/imaglist.cpp#L144-L160"}]},
{"id":"LOGIC_79","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The loop in `wxInfoBarGeneric::GetButtonId()` uses the condition `node != items.GetFirst() || node != items.GetLast()`, which is a tautology for any list with more than one item (it is false only when `node` equals both the first and the last, i.e. a single-element list). The loop therefore relies entirely on the internal `return` to terminate. When walking forward (after `foundSpacer` becomes true), if the loop ever fails to `return` before advancing past `items.GetLast()`, `node` becomes a null/end iterator and the next iteration dereferences it via `node->GetData()`, crashing. The current invariants (custom buttons always follow the sizer, and `idx < GetButtonCount()`) happen to prevent this, but the condition does not express the intended termination and is a latent null-dereference.","fix":"Replace the bogus condition with a real validity check, e.g. `for ( ...; node; )` and terminate/return explicitly, or restructure to two straightforward loops (one backward to find the spacer/sizer, one forward to count buttons) so the iterator can never be advanced past the end.","locations":[{"ref":"src/generic/infobar.cpp:355-383","code":"  355 |     for ( wxSizerItemList::compatibility_iterator node = items.GetLast();\n  356 |           node != items.GetFirst() || node != items.GetLast();\n  357 |           )\n  358 |     {\n  359 |         const wxSizerItem * const item = node->GetData();\n  360 | \n  361 |         if ( item->IsSpacer() || item->IsSizer() )\n  362 |             foundSpacer = true;\n  363 | \n  364 |         if ( foundSpacer )\n  365 |         {\n  366 |             if ( !item->IsSpacer() && !item->IsSizer() )\n  367 |             {\n  368 |                 if ( count == idx )\n  369 |                 {\n  370 |                   if ( item->GetWindow() != m_button )\n  371 |                     return item->GetWindow()->GetId();\n  372 |                 }\n  373 | \n  374 |                 ++count;\n  375 |             }\n  376 | \n  377 |             node = node->GetNext();\n  378 |         }\n  379 |         else\n  380 |         {\n  381 |             node = node->GetPrevious();\n  382 |         }\n  383 |     }","lines":29,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/infobar.cpp#L355-L383"}]},
{"id":"LOGIC_80","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `wxListMainWindow::GetSubItemRect`, the `wxLIST_RECT_LABEL` branch advances the label rectangle by only the image width `ix` (`rect.x += ix; rect.width -= ix;`), but `DrawInReportMode` places the label at `ICON_OFFSET_X + ix + IMAGE_MARGIN_IN_REPORT_MODE` (it does `ix += IMAGE_MARGIN_IN_REPORT_MODE; xOld += ix;`). The adjacent comment even states this rect \"includes the margin between icon and label (`IMAGE_MARGIN_IN_REPORT_MODE`)\", but the code omits `IMAGE_MARGIN_IN_REPORT_MODE`. So the returned label rectangle for an item with an image is out of sync with the actual drawing (off by `IMAGE_MARGIN_IN_REPORT_MODE` pixels), contradicting the \"needs to be kept in sync with `DrawInReportMode()`\" note.","fix":"Add the missing margin so the label rect matches drawing, e.g. `rect.x += ix + IMAGE_MARGIN_IN_REPORT_MODE; rect.width -= ix + IMAGE_MARGIN_IN_REPORT_MODE;` (or fix the comment if the current geometry is intended).","locations":[{"ref":"src/generic/listctrl.cpp:3912-3917","code":" 3912 |                         else // wxLIST_RECT_LABEL\n 3913 |                         {\n 3914 |                             // this includes the margin between icon and label (IMAGE_MARGIN_IN_REPORT_MODE)\n 3915 |                             rect.x += ix;\n 3916 |                             rect.width -= ix;\n 3917 |                         }","lines":6,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/listctrl.cpp#L3912-L3917"}]},
{"id":"LOGIC_81","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`wxVarScrollHelperBase::DoScrollPages()` loops over multiple pages but assigns instead of accumulating the result: `didSomething = DoScrollToUnit(unit);` overwrites the flag every iteration. If an earlier iteration scrolls (returns `true`) but the final iteration is a no-op (e.g. already at the end, returns `false`), the function returns `false` even though it did scroll, misreporting whether anything happened.","fix":"Accumulate the result across iterations:\n```cpp\n        didSomething |= DoScrollToUnit(unit);\n```\ninstead of `didSomething = DoScrollToUnit(unit);`","locations":[{"ref":"src/generic/vscroll.cpp:679-703","code":"  679 | bool wxVarScrollHelperBase::DoScrollPages(int pages)\n  680 | {\n  681 |     bool didSomething = false;\n  682 | \n  683 |     while ( pages )\n  684 |     {\n  685 |         int unit;\n  686 |         if ( pages > 0 )\n  687 |         {\n  688 |             unit = GetVisibleEnd();\n  689 |             if ( unit )\n  690 |                 --unit;\n  691 |             --pages;\n  692 |         }\n  693 |         else // pages < 0\n  694 |         {\n  695 |             unit = FindFirstVisibleFromLast(GetVisibleEnd());\n  696 |             ++pages;\n  697 |         }\n  698 | \n  699 |         didSomething = DoScrollToUnit(unit);\n  700 |     }\n  701 | \n  702 |     return didSomething;\n  703 | }","lines":25,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/vscroll.cpp#L679-L703"}]},
{"id":"LOGIC_82","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`wxDataViewCtrlInternal::drag_data_get()` dereferences `m_dragDataObject` (`m_dragDataObject->IsSupported(target)`, `m_dragDataObject->GetDataSize(target)`, `m_dragDataObject->GetDataHere(...)`) without any null check. `m_dragDataObject` is only set to a non-null value in `row_draggable()` on the success path; it is reset to null at the top of `row_draggable()` and stays null if the drag begin event was vetoed or produced no data object. If GTK ever invokes `drag_data_get` while `m_dragDataObject` is null (e.g. an unexpected/interrupted drag sequence), this is a null-pointer dereference crash.","fix":"Add a defensive check at the top of the function:\n```cpp\nif ( !m_dragDataObject )\n    return FALSE;\n```\nright after obtaining the item, before calling `m_dragDataObject->IsSupported(target)`.","locations":[{"ref":"src/gtk/dataview.cpp:3846-3875","code":" 3846 | gboolean wxDataViewCtrlInternal::drag_data_get( GtkTreeDragSource *WXUNUSED(drag_source),\n 3847 |     GtkTreePath *path, GtkSelectionData *selection_data )\n 3848 | {\n 3849 |     wxDataViewItem item(GetOwner()->GTKPathToItem(path));\n 3850 |     if ( !item )\n 3851 |         return FALSE;\n 3852 | \n 3853 |     GdkAtom target = gtk_selection_data_get_target(selection_data);\n 3854 |     if (!m_dragDataObject->IsSupported(target))\n 3855 |         return FALSE;\n 3856 | \n 3857 |     size_t size = m_dragDataObject->GetDataSize(target);\n 3858 |     if (size == 0)\n 3859 |         return FALSE;\n 3860 | \n 3861 |     void *buf = malloc( size );\n 3862 | \n 3863 |     gboolean res = FALSE;\n 3864 |     if (m_dragDataObject->GetDataHere(target, buf))\n 3865 |     {\n 3866 |         res = TRUE;\n 3867 | \n 3868 |         gtk_selection_data_set(selection_data, target,\n 3869 |             8, (const guchar*) buf, size );\n 3870 |     }\n 3871 | \n 3872 |     free( buf );\n 3873 | \n 3874 |     return res;\n 3875 | }","lines":30,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/gtk/dataview.cpp#L3846-L3875"}]},
{"id":"LOGIC_83","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `wxStaticBox::DoCreate()`, when a label *window* (rather than a string) is used, the code both removes the label widget from its container and then calls `gtk_widget_unparent()` on it:\n```cpp\nGtkWidget* const oldParent = gtk_widget_get_parent(labelWidget);\ngtk_container_remove(GTK_CONTAINER(oldParent), labelWidget);\ngtk_widget_unparent(labelWidget);\n```\n`gtk_container_remove()` already unparents the child (it internally calls `gtk_widget_unparent()`). The subsequent `gtk_widget_unparent(labelWidget)` therefore runs on a widget whose parent is now `nullptr`, tripping GTK's `g_return_if_fail(priv->parent != NULL)` and emitting a GLib CRITICAL warning to stderr on every static box created with a label window. (A use-after-free is avoided only because wx holds its own extra ref on the widget.)","fix":"Drop the redundant `gtk_widget_unparent(labelWidget);` call (line 97); `gtk_container_remove()` already unparents. If defensiveness against a non-container parent is desired, guard it: only call `gtk_widget_unparent()` when `gtk_widget_get_parent(labelWidget)` is still non-null after the remove.","locations":[{"ref":"src/gtk/statbox.cpp:95-97","code":"   95 |         GtkWidget* const oldParent = gtk_widget_get_parent(labelWidget);\n   96 |         gtk_container_remove(GTK_CONTAINER(oldParent), labelWidget);\n   97 |         gtk_widget_unparent(labelWidget);","lines":3,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/gtk/statbox.cpp#L95-L97"}]},
{"id":"LOGIC_84","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `wxTextMeasure::DoGetTextExtent()`, when `m_context` is null (e.g. the window has no Pango context yet because it isn't realized, so `BeginMeasuring()` left `m_context`/`m_layout` null) the function sets `*width`/`*height` to 0 and returns early without touching `descent` or `externalLeading`. The base-class contract only guarantees `width`/`height` are non-null; `descent` and `externalLeading` are forwarded straight from the caller and are left uninitialized on this path, so a caller passing an uninitialized `wxCoord descent;` reads garbage.","fix":"Initialize the optional outputs in the early-return branch, e.g. before `return;` add `if (descent) *descent = 0; if (externalLeading) *externalLeading = 0;`.","locations":[{"ref":"src/gtk/textmeasure.cpp:116-124","code":"  116 |     if ( !m_context )\n  117 |     {\n  118 |         if ( width )\n  119 |             *width = 0;\n  120 | \n  121 |         if ( height )\n  122 |             *height = 0;\n  123 |         return;\n  124 |     }","lines":9,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/gtk/textmeasure.cpp#L116-L124"},{"ref":"src/gtk/textmeasure.cpp:143-155","code":"  143 |     if (descent)\n  144 |     {\n  145 |         PangoLayoutIter *iter = pango_layout_get_iter(m_layout);\n  146 |         int baseline = pango_layout_iter_get_baseline(iter);\n  147 |         pango_layout_iter_free(iter);\n  148 |         *descent = *height - PANGO_PIXELS(baseline);\n  149 |     }\n  150 | \n  151 |     if (externalLeading)\n  152 |     {\n  153 |         // No support for MSW-like \"external leading\" in Pango.\n  154 |         *externalLeading = 0;\n  155 |     }","lines":13,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/gtk/textmeasure.cpp#L143-L155"}]},
{"id":"LOGIC_85","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`AdjustEventButtonState()` inverts the button-down flag for LEFT/MIDDLE/RIGHT on DOWN, DCLICK and UP events (to undo GDK reporting the *old* button state), but for the AUX buttons it only handles `wxEVT_AUX1_DOWN`/`wxEVT_AUX1_DCLICK` (and AUX2) by forcing the flag to `true`; it never handles `wxEVT_AUX1_UP`/`wxEVT_AUX2_UP`. Since `WindowButtonReleaseCallback()` calls this for release events and GDK still reports the button as pressed in the state mask, an `AUX1_UP`/`AUX2_UP` event ends up with `m_aux1Down`/`m_aux2Down` incorrectly set to `true` instead of `false`, inconsistent with the LEFT/MIDDLE/RIGHT handling.","fix":"Handle the AUX up events too, e.g. add cases that set `event.m_aux1Down = false;` for `wxEVT_AUX1_UP` and `event.m_aux2Down = false;` for `wxEVT_AUX2_UP` (or mirror the invert-based approach used for the other buttons).","locations":[{"ref":"src/gtk/window.cpp:1602-1614","code":" 1602 |     if ((event.GetEventType() == wxEVT_AUX1_DOWN) ||\n 1603 |         (event.GetEventType() == wxEVT_AUX1_DCLICK))\n 1604 |     {\n 1605 |         event.m_aux1Down = true;\n 1606 |         return;\n 1607 |     }\n 1608 | \n 1609 |     if ((event.GetEventType() == wxEVT_AUX2_DOWN) ||\n 1610 |         (event.GetEventType() == wxEVT_AUX2_DCLICK))\n 1611 |     {\n 1612 |         event.m_aux2Down = true;\n 1613 |         return;\n 1614 |     }","lines":13,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/gtk/window.cpp#L1602-L1614"}]},
{"id":"LOGIC_86","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `wxHtmlTableCell`, `CELLSPACING` (and `CELLPADDING`) are read via `tag.GetParamAsInt()` with no lower-bound check, so a crafted `<table cellspacing=\"-1\">` makes `m_Spacing = -1` (with the default `m_Border == 0`). In `Layout()`, `ypos[0]` is initialized to `m_Spacing + m_Border`, which then equals `-1`. But `-1` is the sentinel used to mark unset rows: the loop `if (ypos[actrow] == -1) ypos[actrow] = ypos[actrow-1];` runs for `actrow == 0`, reading `ypos[-1]`, one `int` before the heap allocation `new int[m_NumRows + 1]`. This is an out-of-bounds read (undefined behavior) driven directly by untrusted HTML input (wxHTML is used to render help files, e-mail, etc.).","fix":"Clamp the parsed spacing/padding to be non-negative after reading them, e.g. after line 143 add `if (m_Spacing < 0) m_Spacing = 0; if (m_Padding < 0) m_Padding = 0;`. Alternatively, guard the sentinel loop with `actrow > 0` so `ypos[-1]` can never be read: `if (actrow > 0 && ypos[actrow] == -1) ypos[actrow] = ypos[actrow-1];`.","locations":[{"ref":"src/html/m_tables.cpp:138-143","code":"  138 |     if (!tag.GetParamAsInt(wxT(\"CELLSPACING\"), &m_Spacing))\n  139 |         m_Spacing = 2;\n  140 |     if (!tag.GetParamAsInt(wxT(\"CELLPADDING\"), &m_Padding))\n  141 |         m_Padding = 3;\n  142 |     m_Spacing = (int)(m_PixelScale * (double)m_Spacing);\n  143 |     m_Padding = (int)(m_PixelScale * (double)m_Padding);","lines":6,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/html/m_tables.cpp#L138-L143"},{"ref":"src/html/m_tables.cpp:611-621","code":"  611 |         int *ypos = new int[m_NumRows + 1];\n  612 | \n  613 |         int actcol, actrow;\n  614 |         int fullwid;\n  615 |         wxHtmlContainerCell *actcell;\n  616 | \n  617 |         ypos[0] = m_Spacing + m_Border;\n  618 |         for (actrow = 1; actrow <= m_NumRows; actrow++) ypos[actrow] = -1;\n  619 |         for (actrow = 0; actrow < m_NumRows; actrow++)\n  620 |         {\n  621 |             if (ypos[actrow] == -1) ypos[actrow] = ypos[actrow-1];","lines":11,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/html/m_tables.cpp#L611-L621"}]},
{"id":"LOGIC_87","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `SetPFDForAttributes()`, the `WGL_SWAP_METHOD_ARB` case reads the attribute value with `attrsListWGL[arg++]` in the `if` branch (which post-increments `arg` past the value), but the `else if` branch then reads `attrsListWGL[arg]` again - at this point `arg` already points to the *next* attribute key, not the swap-method value that was just consumed. So `WGL_SWAP_COPY_ARB` is compared against the wrong array element and `PFD_SWAP_COPY` is essentially never set correctly (and, depending on what happens to be at that next slot, can spuriously match).","fix":"Save the value once instead of re-reading the array at a stale/incorrect index:\n\n```cpp\ncase WGL_SWAP_METHOD_ARB:\n    {\n        const int method = attrsListWGL[arg++];\n        if ( method == WGL_SWAP_EXCHANGE_ARB )\n            pfd.dwFlags |= PFD_SWAP_EXCHANGE;\n        else if ( method == WGL_SWAP_COPY_ARB )\n            pfd.dwFlags |= PFD_SWAP_COPY;\n    }\n    break;\n```","locations":[{"ref":"src/msw/glcanvas.cpp:955-960","code":"  955 |             case WGL_SWAP_METHOD_ARB:\n  956 |                 if ( attrsListWGL[arg++] == WGL_SWAP_EXCHANGE_ARB )\n  957 |                     pfd.dwFlags |= PFD_SWAP_EXCHANGE;\n  958 |                 else if ( attrsListWGL[arg] == WGL_SWAP_COPY_ARB )\n  959 |                     pfd.dwFlags |= PFD_SWAP_COPY;\n  960 |                 break;","lines":6,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/glcanvas.cpp#L955-L960"}]},
{"id":"LOGIC_88","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `SetPFDForAttributes()`, the `WGL_NUMBER_UNDERLAYS_ARB` case ORs the raw attribute value into `pfd.bReserved` masked with `240` (`0xF0`, i.e. bits 4-7) without shifting it into position first: `pfd.bReserved |= attrsListWGL[arg++] & 240;`. Per the `PIXELFORMATDESCRIPTOR` docs, bits 4-7 of `bReserved` encode the underlay-plane count, but that count must be shifted left by 4 bits before being placed there. For any realistic underlay count (1-15), `value & 240` evaluates to `0`, so the underlay count is silently dropped instead of being encoded. Compare with the `WGL_NUMBER_OVERLAYS_ARB` case just above it, which correctly masks bits 0-3 with `& 15` because no shift is needed there.","fix":"Shift the value into bits 4-7 before masking:\n\n```cpp\ncase WGL_NUMBER_UNDERLAYS_ARB:\n    // Bits 4-7\n    pfd.bReserved |= (attrsListWGL[arg++] << 4) & 240;\n    break;\n```","locations":[{"ref":"src/msw/glcanvas.cpp:962-970","code":"  962 |             case WGL_NUMBER_OVERLAYS_ARB:\n  963 |                 // Bits 0-3\n  964 |                 pfd.bReserved |= attrsListWGL[arg++] & 15;\n  965 |                 break;\n  966 | \n  967 |             case WGL_NUMBER_UNDERLAYS_ARB:\n  968 |                 // Bits 4-7\n  969 |                 pfd.bReserved |= attrsListWGL[arg++] & 240;\n  970 |                 break;","lines":9,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/glcanvas.cpp#L962-L970"}]},
{"id":"LOGIC_89","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `wxSystemThemedControlBase::DoEnableSystemTheme()`, the update of `m_systemThemeDisabled = !enable;` is nested entirely inside the `if ( wxUxThemeIsActive() )` block (`src/msw/systhemectrl.cpp:20-34`). This means that if `wxUxThemeIsActive()` returns `false` (e.g. Windows Classic theme, or theming disabled/unavailable), a call to `EnableSystemTheme(false)` silently fails to record that the caller explicitly disabled the system theme: `m_systemThemeDisabled` keeps its previous value instead of becoming `true`. Later code that consults `IsSystemThemeDisabled()` (e.g. `wxListCtrl`'s custom-draw workaround in `src/msw/listctrl.cpp` for bug #17988) then behaves as if the system theme were still enabled, even though the user explicitly disabled it, purely because theming happened to be inactive at the moment the call was made.","fix":"Update the tracked state unconditionally, and only gate the native `SetWindowTheme()` call on `wxUxThemeIsActive()`:\n\n```cpp\nvoid wxSystemThemedControlBase::DoEnableSystemTheme(bool enable, wxWindow* window)\n{\n    m_systemThemeDisabled = !enable;\n\n    if ( wxUxThemeIsActive() )\n    {\n        if ( window->GetHandle() )\n        {\n            const wchar_t* const sysThemeId = enable ? L\"EXPLORER\" : nullptr;\n            ::SetWindowTheme(GetHwndOf(window), sysThemeId, nullptr);\n        }\n    }\n}\n```","locations":[{"ref":"src/msw/systhemectrl.cpp:20-34","code":"   20 | void wxSystemThemedControlBase::DoEnableSystemTheme(bool enable, wxWindow* window)\n   21 | {\n   22 |     if ( wxUxThemeIsActive() )\n   23 |     {\n   24 |         // It's possible to call EnableSystemTheme(false) before creating the\n   25 |         // window, just don't do anything in this case.\n   26 |         if ( window->GetHandle() )\n   27 |         {\n   28 |             const wchar_t* const sysThemeId = enable ? L\"EXPLORER\" : nullptr;\n   29 |             ::SetWindowTheme(GetHwndOf(window), sysThemeId, nullptr);\n   30 |         }\n   31 | \n   32 |         m_systemThemeDisabled = !enable;\n   33 |     }\n   34 | }","lines":15,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/systhemectrl.cpp#L20-L34"}]},
{"id":"LOGIC_90","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The `--Style` argument handling in `OnInit` is effectively unreachable in normal use because of the ordering of the `else if` chain. A `--Style...` argument does not match a book extension nor `--server`, so it falls into the `else if ( !hasService )` branch first and is silently consumed as the IPC service name (also setting `createServer = true`). Only when both `hasService` and `hasWindowName` are already set (i.e. `--Style` is the 3rd-or-later non-book/non-server positional argument) does the `argStr.Find(wxT(\"--Style\")) >= 0` branch run. So a user passing just `--Style0x400` gets it misinterpreted as a service name rather than a window style.","fix":"Check for `--Style` before the generic `!hasService` / `!hasWindowName` fallbacks, e.g. move the `else if ( argStr.Find( wxT(\"--Style\") ) >= 0 )` block (or a `argStr.StartsWith(wxT(\"--Style\"))` test) up to right after the `--server` check so it is recognized regardless of positional order.","locations":[{"ref":"utils/helpview/src/helpview.cpp:100-123","code":"  100 |         else if ( !hasService )\n  101 |         {\n  102 |             service = argStr;\n  103 |             hasService = true;\n  104 |             createServer = true;\n  105 |         }\n  106 |         else if ( !hasWindowName )\n  107 |         {\n  108 |             windowName = argStr;\n  109 |             hasWindowName = true;\n  110 |         }\n  111 |         else if ( argStr.Find( wxT(\"--Style\") )  >= 0 )\n  112 |         {\n  113 |             long style;\n  114 |             wxString numb = argStr.AfterLast(wxT('e'));\n  115 |             if ( !(numb.ToLong(&style) ) )\n  116 |             {\n  117 |                 wxLogError( wxT(\"Integer conversion failed for --Style\") );\n  118 |             }\n  119 |             else\n  120 |             {\n  121 |                 istyle = style;\n  122 |             }\n  123 |         }","lines":24,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/utils/helpview/src/helpview.cpp#L100-L123"}]},
{"id":"LOGIC_91","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `hvConnection::OnExec`, the `--intstring` command is unreachable/broken. The guard `if ( data == \"--intstring\" )` requires `data` to equal the literal `--intstring` exactly, but then it tries to extract a number from that same string via `numb = argStr.AfterLast(wxT('g'))`. Since `--intstring` ends in `g`, `AfterLast('g')` always returns an empty string, so `numb.ToLong(&i)` always fails and `Display(int(i))` is never called - the branch only ever logs `Integer conversion failed`. The intent is clearly that the client sends `--intstring<number>`, so the check must be a prefix match, not equality.","fix":"Use a prefix test so the appended number survives. Change:\n```cpp\n    if ( data == \"--intstring\" )\n```\nto:\n```cpp\n    if ( data.StartsWith(\"--intstring\") )\n```\n(`AfterLast('g')` then correctly yields the trailing digits, e.g. `--intstring123` -> `123`.)","locations":[{"ref":"utils/helpview/src/helpview.cpp:402-415","code":"  402 |     if ( data == \"--intstring\" )\n  403 |     {\n  404 |         long i;\n  405 |         wxString argStr = data;\n  406 |         wxString numb = argStr.AfterLast(wxT('g'));\n  407 |         if ( !(numb.ToLong(&i) ) )\n  408 |         {\n  409 |             wxLogError( wxT(\"Integer conversion failed for --intstring\") );\n  410 |         }\n  411 |         else\n  412 |         {\n  413 |             wxGetApp().GetHelpController()->Display(int(i));\n  414 |         }\n  415 |     }","lines":14,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/utils/helpview/src/helpview.cpp#L402-L415"}]},
{"id":"LOGIC_92","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`wxRemoteHtmlHelpController::AddBook()` returns `false` on its success path. When connected (`isconn_1`), it pokes `--AddBook` and then unconditionally `return false;` even when `Poke()` succeeded; when NOT connected it `return true;`. So the case where nothing was sent reports success and the case where the book was actually added reports failure. This is inconsistent with the sibling methods `DisplayContents()`/`KeywordSearch()`, which return `true` on success and `false` only on `Poke()` failure. Callers checking the return value get an inverted result.","fix":"Return `false` only when `Poke()` actually fails and `true` otherwise, e.g.:\n```cpp\nif( isconn_1 ) {\n    if (!m_connection->Poke( wxT(\"--AddBook\"), (char*)book.c_str() ) ) {\n        wxLogError(wxT(\"wxRemoteHtmlHelpController - AddBook Failed\"));\n        return false;\n    }\n}\nreturn true;\n```","locations":[{"ref":"utils/helpview/src/remhelp.cpp:343-358","code":"  343 | bool wxRemoteHtmlHelpController::AddBook(const wxString& book, bool show_wait_msg)\n  344 | {\n  345 |     //ignore show_wait_msg - there shouldn't be a delay in this step\n  346 |     //show_wait_msg = true could be transmitted with ++AddBook\n  347 |     m_book = book;\n  348 | \n  349 |     if( isconn_1 ) {\n  350 |         if (!m_connection->Poke( wxT(\"--AddBook\"), (char*)book.c_str() ) )\n  351 |         {\n  352 |             wxLogError(wxT(\"wxRemoteHtmlHelpController - AddBook Failed\"));\n  353 |         }\n  354 |         return false;\n  355 |     }\n  356 | \n  357 |     return true;\n  358 | }","lines":16,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/utils/helpview/src/remhelp.cpp#L343-L358"}]},
{"id":"LOGIC_93","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `CompareClasses()`, when the real headers contain one or more overloads with a different signature (`overloads.GetCount() != 0`), `count` is incremented twice: once inside the `else` branch after `wxLogWarning(warning)` and again unconditionally at the end of the `if (proceed)` block. When there are no overloads (`overloads.GetCount()==0`) `count` is incremented only once. This double counts mismatched methods and inflates the `mcount` statistic reported by `Compare()` (`\"%d ... methods ... do not exist in the real headers\"`).","fix":"Remove the redundant `count++;` inside the `else` branch (line 397) and keep only the single `count++;` at the end of the `if (proceed)` block, or vice versa, so every unmatched method is counted exactly once.","locations":[{"ref":"utils/ifacecheck/src/ifacecheck.cpp:396-422","code":"  396 |                     wxLogWarning(warning);\n  397 |                     count++;\n  398 | \n  399 |                     if (overloads.GetCount()>1)\n  400 |                     {\n  401 |                         // TODO: decide which of these overloads is the most \"similar\" to m\n  402 |                         //       and eventually modify it\n  403 |                         if (m_modify)\n  404 |                         {\n  405 |                             wxLogWarning(\"\\tmanual fix is required\");\n  406 |                         }\n  407 |                     }\n  408 |                     else\n  409 |                     {\n  410 |                         wxASSERT(overloads.GetCount() == 1);\n  411 | \n  412 |                         if (m_modify || m.IsCtor())\n  413 |                         {\n  414 |                             wxLogWarning(\"\\tfixing it...\");\n  415 | \n  416 |                             // try to modify it!\n  417 |                             FixMethod(iface->GetHeader(), &m, overloads[0]);\n  418 |                         }\n  419 |                     }\n  420 |                 }\n  421 | \n  422 |                 count++;","lines":27,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/utils/ifacecheck/src/ifacecheck.cpp#L396-L422"}]},
{"id":"LOGIC_94","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`getMemberIDs()` parses a `_id1 _id2 _id3` style token list by requiring every parsed ID (including the last one) to be immediately followed by a literal space character: `if ( *nexttoken != ' ' || errno == ERANGE || errno == EINVAL ) return false;`. If the `members` XML attribute does not end with a trailing space after the final ID (i.e. the last token is terminated by `\\0` rather than `' '`), the function rejects the entire, otherwise valid, member-ID list for that `<Class>` node, causing `wxXmlGccInterface::Parse()` to abort with `\"Invalid member IDs for ... class node\"` even though the data was parseable.","fix":"Accept end-of-string as a valid terminator for the last token, e.g. `if ( (*nexttoken != ' ' && *nexttoken != '\\0') || errno == ERANGE || errno == EINVAL ) return false;` and break out of the loop when `*nexttoken == '\\0'`.","locations":[{"ref":"utils/ifacecheck/src/xmlparser.cpp:759-795","code":"  759 | bool getMemberIDs(wxClassMemberIdHashMap* map, wxClass* p, const wxString& str)\n  760 | {\n  761 |     const wxStringCharType * const start = str.wx_str();\n  762 | #if wxUSE_UNICODE_WCHAR\n  763 |     size_t len = wcslen(start);\n  764 | #else\n  765 |     size_t len = strlen(start);\n  766 | #endif\n  767 | \n  768 |     if (len == 0 || start[0] != '_')\n  769 |         return false;\n  770 | \n  771 |     const wxStringCharType *curpos = start,\n  772 |                            *end = start + len;\n  773 |     wxStringCharType *nexttoken;\n  774 | \n  775 |     while (curpos < end)\n  776 |     {\n  777 |         // curpos always points to the underscore of the next token to parse:\n  778 | #if wxUSE_UNICODE_WCHAR\n  779 |         unsigned long id = wcstoul(curpos+1, &nexttoken, GCCXML_BASE);\n  780 | #else\n  781 |         unsigned long id = strtoul(curpos+1, &nexttoken, GCCXML_BASE);\n  782 | #endif\n  783 |         if ( *nexttoken != ' ' || errno == ERANGE || errno == EINVAL )\n  784 |             return false;\n  785 | \n  786 |         // advance current position\n  787 |         curpos = nexttoken + 1;\n  788 | \n  789 |         // add this ID to the hashmap\n  790 |         wxClassMemberIdHashMap::value_type v(id, p);\n  791 |         map->insert(v);\n  792 |     }\n  793 | \n  794 |     return true;\n  795 | }","lines":37,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/utils/ifacecheck/src/xmlparser.cpp#L759-L795"}]},
{"id":"LOGIC_95","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"very_easy","description":"`GetToolSticky` is declared to return `bool` but returns the integer literal `0` on the not-found path instead of `false`, an inconsistent/sloppy return.","fix":"Return a bool:\n```cpp\n    if (!item)\n        return false;\n```","locations":[{"ref":"src/aui/auibar.cpp:1394-1401","code":" 1394 | bool wxAuiToolBar::GetToolSticky(int tool_id) const\n 1395 | {\n 1396 |     wxAuiToolBarItem* item = FindTool(tool_id);\n 1397 |     if (!item)\n 1398 |         return 0;\n 1399 | \n 1400 |     return item->m_sticky;\n 1401 | }","lines":8,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/aui/auibar.cpp#L1394-L1401"}]},
{"id":"LOGIC_96","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"`wxPalette::GetPixel` returns `closest` (initialized to `0`) even when the palette has no entries, reporting pixel index 0 for an empty palette instead of `wxNOT_FOUND`, unlike the `!m_refData` guard just above which does return `wxNOT_FOUND`. The adjacent comment `// max. dist is 256` is also slightly wrong (the maximum weighted distance is 255).","fix":"Return `wxNOT_FOUND` when `M_PALETTEDATA->m_entries` is empty, and fix the comment to `// max. dist is 255`.","locations":[{"ref":"src/generic/paletteg.cpp:92-114","code":"   92 | int wxPalette::GetPixel( unsigned char red,\n   93 |                          unsigned char green,\n   94 |                          unsigned char blue ) const\n   95 | {\n   96 |     if (!m_refData) return wxNOT_FOUND;\n   97 | \n   98 |     int closest = 0;\n   99 |     double d,distance = 1000.0; // max. dist is 256\n  100 | \n  101 |     int i = 0;\n  102 |     for ( const wxPaletteEntry& e : M_PALETTEDATA->m_entries )\n  103 |     {\n  104 |         if ((d = 0.299 * abs(red - e.red) +\n  105 |                  0.587 * abs(green - e.green) +\n  106 |                  0.114 * abs(blue - e.blue)) < distance) {\n  107 |             distance = d;\n  108 |             closest = i;\n  109 |         }\n  110 | \n  111 |         ++i;\n  112 |     }\n  113 |     return closest;\n  114 | }","lines":23,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/paletteg.cpp#L92-L114"}]},
{"id":"LOGIC_97","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"very_easy","description":"In `wxCursor::InitFromImage()` the hot-spot clamping uses `> w` / `> h`, allowing the values `hotSpotX == w` and `hotSpotY == h`, which are one past the last valid pixel index (`0..w-1`/`0..h-1`). The equivalent code in `InitFromBitmap()` correctly uses `>= width` / `>= height`. The inconsistency is a latent off-by-one for hot spots placed exactly on the far edge.","fix":"Match `InitFromBitmap()`:\n```cpp\n// before\nif (hotSpotX < 0 || hotSpotX > w) hotSpotX = 0;\nif (hotSpotY < 0 || hotSpotY > h) hotSpotY = 0;\n// after\nif (hotSpotX < 0 || hotSpotX >= w) hotSpotX = 0;\nif (hotSpotY < 0 || hotSpotY >= h) hotSpotY = 0;\n```","locations":[{"ref":"src/gtk/cursor.cpp:326-327","code":"  326 |     if (hotSpotX < 0 || hotSpotX > w) hotSpotX = 0;\n  327 |     if (hotSpotY < 0 || hotSpotY > h) hotSpotY = 0;","lines":2,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/gtk/cursor.cpp#L326-L327"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"very_easy","description":"In `wxUString::utf8_str()` the size-counting loop and the encoding loop are duplicated logic, but they were edited inconsistently for the 3-byte range. Counting uses `else if ( code <= 0xFFFF ) utf8_length += 3;` while encoding uses `else if ( code < 0xFFFF )`. For the code point `U+FFFF` the counting loop reserves 3 bytes but the encoding loop falls through to the `code <= 0x10FFFF` branch and writes 4 bytes, overflowing the allocated `wxCharBuffer` by one byte per `U+FFFF` character. With two consecutive `U+FFFF` code points this is a genuine out-of-bounds heap write (e.g. `out[7]` into a 7-byte buffer). `U+FFFF` is reachable from externally supplied data via `assignFromUTF8`/`assignFromUTF16` (`0xEF 0xBF 0xBF`).","fix":"Change the encoding branch to match the counting loop:\n```cpp\n        else if ( code <= 0xFFFF )\n```\ninstead of `else if ( code < 0xFFFF )`.","locations":[{"ref":"src/common/ustring.cpp:441","code":"  441 |         else if ( code < 0xFFFF )","lines":1,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/ustring.cpp#L441"}]},
{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"very_easy","description":"In `wxGUIAppTraits::GetToolkitVersion()` the minor-version branch writes to `*verMaj` instead of `*verMin`. As a result the caller's `verMin` output is never filled in, and if the caller passes a non-null `verMin` its `verMaj` value is silently overwritten with the *minor* version number. This is a classic copy-paste slip from the line above.","fix":"Change line 36 from `if ( verMin ) *verMaj = DIRECTFB_MINOR_VERSION;` to `if ( verMin ) *verMin = DIRECTFB_MINOR_VERSION;`.","locations":[{"ref":"src/dfb/utils.cpp:35-37","code":"   35 |     if ( verMaj ) *verMaj = DIRECTFB_MAJOR_VERSION;\n   36 |     if ( verMin ) *verMaj = DIRECTFB_MINOR_VERSION;\n   37 |     if ( verMicro ) *verMicro = DIRECTFB_MICRO_VERSION;","lines":3,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/dfb/utils.cpp#L35-L37"}]},
{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"In `wxMirrorDCImpl::DoBlit()` the last argument passed to the forwarded `m_dc.DoBlit()` uses `GetX(xsrcMask, ysrcMask)` for both the `xsrcMask` and the `ysrcMask` parameters. The `ysrcMask` parameter must instead be computed with `GetY(xsrcMask, ysrcMask)`. As written, the y-coordinate of the mask source is wrong in both cases: when `m_mirror` is false `GetX(xsrcMask, ysrcMask)` returns `xsrcMask`, so `ysrcMask` receives `xsrcMask`; when `m_mirror` is true it returns `ysrcMask` for both, so the coordinates are not properly exchanged. This produces incorrect mask alignment whenever `useMask` is true and the mask source x/y offsets differ (the default `wxDefaultCoord` for both hides the bug).","fix":"Change the final argument from `GetX` to `GetY`:\n```\n        return m_dc.DoBlit(GetX(xdest, ydest), GetY(xdest, ydest),\n                           GetX(w, h), GetY(w, h),\n                           source, GetX(xsrc, ysrc), GetY(xsrc, ysrc),\n                           rop, useMask,\n                           GetX(xsrcMask, ysrcMask), GetY(xsrcMask, ysrcMask));\n```","locations":[{"ref":"include/wx/dcmirror.h:208-213","code":"  208 |         return m_dc.DoBlit(GetX(xdest, ydest), GetY(xdest, ydest),\n  209 |                            GetX(w, h), GetY(w, h),\n  210 |                            source, GetX(xsrc, ysrc), GetY(xsrc, ysrc),\n  211 |                            rop, useMask,\n  212 |                            GetX(xsrcMask, ysrcMask), GetX(xsrcMask, ysrcMask));\n  213 |     }","lines":6,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/dcmirror.h#L208-L213"}]},
{"id":"CPY_4","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"The public accessors `GetRowLabelMinimalSize()` and `GetColLabelMinimalSize()` return each other's backing member. `GetRowLabelMinimalSize()` returns `m_colLabelMinHeight` and `GetColLabelMinimalSize()` returns `m_rowLabelMinWidth`, but the corresponding setters store the opposite: `SetRowLabelMinimalSize(int width)` writes `m_rowLabelMinWidth` and `SetColLabelMinimalSize(int height)` writes `m_colLabelMinHeight` (see `src/generic/grid.cpp:9350-9360`). The internal operations classes also use the correct members (`private/grid.h:807` returns `m_colLabelMinHeight` for columns, `private/grid.h:962` returns `m_rowLabelMinWidth` for rows). Consequently, after calling `SetRowLabelMinimalSize(w)`, calling `GetRowLabelMinimalSize()` returns the column-label value instead of `w` (and vice-versa).","fix":"Swap the returned members so the getters match the setters:\n```cpp\nint      GetRowLabelMinimalSize() const { return m_rowLabelMinWidth;  }\n...\nint      GetColLabelMinimalSize() const { return m_colLabelMinHeight; }\n```","locations":[{"ref":"include/wx/generic/grid.h:1920-1923","code":" 1920 |     int      GetRowLabelMinimalSize() const { return m_colLabelMinHeight;  }\n 1921 |     int      GetDefaultColLabelSize() const { return FromDIP(WXGRID_DEFAULT_COL_LABEL_HEIGHT); }\n 1922 |     int      GetColLabelSize() const { return m_colLabelHeight; }\n 1923 |     int      GetColLabelMinimalSize() const { return m_rowLabelMinWidth; }","lines":4,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/generic/grid.h#L1920-L1923"}]},
{"id":"CPY_5","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"In `wxFileConfig::GetLocalDir()` the traditional-home branch tests the wrong flag: the inner `if ( style & wxCONFIG_USE_HOME )` is identical to the enclosing condition and is therefore always true, so `stdp.AppendAppInfo(dir)` is applied unconditionally. Comparing with the XDG branch above (which correctly gates `AppendAppInfo()` on `wxCONFIG_USE_SUBDIR`) makes clear this was meant to be `wxCONFIG_USE_SUBDIR`. As written, when `wxCONFIG_USE_HOME` is set without `wxCONFIG_USE_SUBDIR`, the app-info subdirectory is wrongly appended, so the local config file ends up at e.g. `~/appname/.appname` instead of the intended `~/.appname`, breaking the traditional home layout.","fix":"Change the inner condition to gate on the sub-directory flag:\n```cpp\n    if ( style & wxCONFIG_USE_HOME )\n    {\n        wxString dir = wxGetHomeDir();\n\n        if ( style & wxCONFIG_USE_SUBDIR )   // was: wxCONFIG_USE_HOME\n            dir = stdp.AppendAppInfo(dir);\n\n        return dir;\n    }\n```","locations":[{"ref":"src/common/fileconf.cpp:264-274","code":"  264 |     if ( style & wxCONFIG_USE_HOME )\n  265 |     {\n  266 |         // When traditional layout is requested, don't use wxStandardPaths as\n  267 |         // it could be using XDG layout.\n  268 |         wxString dir = wxGetHomeDir();\n  269 | \n  270 |         if ( style & wxCONFIG_USE_HOME )\n  271 |             dir = stdp.AppendAppInfo(dir);\n  272 | \n  273 |         return dir;\n  274 |     }","lines":11,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/fileconf.cpp#L264-L274"}]},
{"id":"CPY_6","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"In `wxGLAPI::glEnd()` (the `wxUSE_OPENGL_EMULATION` path) the client-state arrays are saved into `formerColors`, `formerNormals` and `formerTexCoords`, but when restoring, both the `GL_NORMAL_ARRAY` and `GL_TEXTURE_COORD_ARRAY` restore calls pass `formerColors` instead of `formerNormals`/`formerTexCoords`. This restores the wrong previous enable-state for the normal and texture-coordinate client arrays, corrupting GL client state across `glBegin`/`glEnd` blocks.","fix":"```\n    if ( s_normalsUsed != formerNormals )\n        RestoreState( GL_NORMAL_ARRAY, formerNormals );\n\n    if ( s_texCoordsUsed != formerTexCoords )\n        RestoreState( GL_TEXTURE_COORD_ARRAY, formerTexCoords );\n```\nreplacing the two erroneous `formerColors` arguments.","locations":[{"ref":"src/common/glcmn.cpp:562-569","code":"  562 |     if ( s_colorsUsed != formerColors )\n  563 |         RestoreState( GL_COLOR_ARRAY, formerColors );\n  564 | \n  565 |     if ( s_normalsUsed != formerNormals )\n  566 |         RestoreState( GL_NORMAL_ARRAY, formerColors );\n  567 | \n  568 |     if ( s_texCoordsUsed != formerTexCoords )\n  569 |         RestoreState( GL_TEXTURE_COORD_ARRAY, formerColors );","lines":8,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/glcmn.cpp#L562-L569"}]},
{"id":"CPY_7","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"In the `ILBM_HAM8` decode of `wxIFFDecoder::ReadIFF`, the `case 0xc0:` branch is meant to update the green channel but preserves the low two bits of the wrong channel: `gval = (rval & 3) | (c << 2);` uses `rval` where the blue (`0x40`) and red (`0x80`) cases correctly use `bval`/`rval`. This is a copy/paste slip that corrupts green values in HAM8 images.","fix":"```\ncase 0xc0: gval = (gval & 3) | (c << 2);\n```\ninstead of\n```\ncase 0xc0: gval = (rval & 3) | (c << 2);\n```","locations":[{"ref":"src/common/imagiff.cpp:636-643","code":"  636 |                 case 0x40: bval = (bval & 3) | (c << 2);\n  637 |                     break;\n  638 | \n  639 |                 case 0x80: rval = (rval & 3) | (c << 2);\n  640 |                     break;\n  641 | \n  642 |                 case 0xc0: gval = (rval & 3) | (c << 2);\n  643 |                 }","lines":8,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/imagiff.cpp#L636-L643"}]},
{"id":"CPY_8","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"In `wxIndividualLayoutConstraint::SatisfyConstraint()`, the `wxCentreX` / `wxUnconstrained` case computes the centre from the right edge and width, but the second branch (guarded by `constraints->right.GetDone() && constraints->width.GetDone()`) mistakenly reads `constraints->left.GetValue()` instead of `constraints->right.GetValue()`. Because this branch is only taken when `left` is NOT done, `left.GetValue()` returns a stale/undetermined value, so the computed centre X is wrong. The analogous `wxCentreY` code correctly uses `bottom`/`top`, confirming this is a copy-paste error.","fix":"Change `value = (int)(constraints->left.GetValue() - (constraints->width.GetValue()/2) + margin);` to `value = (int)(constraints->right.GetValue() - (constraints->width.GetValue()/2) + margin);`","locations":[{"ref":"src/common/layout.cpp:534-539","code":"  534 |                     else if (constraints->right.GetDone() && constraints->width.GetDone())\n  535 |                     {\n  536 |                         value = (int)(constraints->left.GetValue() - (constraints->width.GetValue()/2) + margin);\n  537 |                         done = true;\n  538 |                         return true;\n  539 |                     }","lines":6,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/layout.cpp#L534-L539"}]},
{"id":"CPY_9","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"In `wxTarInputStream::GetNextEntry()` the group id is read from the wrong header field: `entry->SetGroupId(GetHeaderNumber(TAR_UID))` passes `TAR_UID` where it should pass `TAR_GID`. As a result the entry's group id is always set to the uid value, and the actual gid stored in the tar header is silently discarded. This is a classic inconsistently-edited duplicate of the preceding line.","fix":"Change the group id line to read from the group id field. Before:\n```cpp\n    entry->SetUserId(GetHeaderNumber(TAR_UID));\n    entry->SetGroupId(GetHeaderNumber(TAR_UID));\n```\nAfter:\n```cpp\n    entry->SetUserId(GetHeaderNumber(TAR_UID));\n    entry->SetGroupId(GetHeaderNumber(TAR_GID));\n```","locations":[{"ref":"src/common/tarstrm.cpp:672-674","code":"  672 |     entry->SetUserId(GetHeaderNumber(TAR_UID));\n  673 |     entry->SetGroupId(GetHeaderNumber(TAR_UID));\n  674 |     entry->SetSize(GetHeaderNumber(TAR_SIZE));","lines":3,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/tarstrm.cpp#L672-L674"}]},
{"id":"CPY_10","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"In `wxTextAttr::Combine()`, when falling back to the default attributes for the left indent, the sub-indent is taken from the wrong object: `newAttr.SetLeftIndent(attrDef.GetLeftIndent(), attr.GetLeftSubIndent())` reads the main indent from `attrDef` but the sub-indent from `attr`. Since this branch is only reached when `attr` does NOT have a left indent set, `attr.GetLeftSubIndent()` returns a stale/uninitialized sub-indent instead of the default's. It should read `attrDef.GetLeftSubIndent()`.","fix":"Read the sub-indent from `attrDef` in the else-if branch. Before:\n```cpp\n    else if (attrDef.HasLeftIndent())\n        newAttr.SetLeftIndent(attrDef.GetLeftIndent(), attr.GetLeftSubIndent());\n```\nAfter:\n```cpp\n    else if (attrDef.HasLeftIndent())\n        newAttr.SetLeftIndent(attrDef.GetLeftIndent(), attrDef.GetLeftSubIndent());\n```","locations":[{"ref":"src/common/textcmn.cpp:811-819","code":"  811 |     if (attr.HasLeftIndent())\n  812 |         newAttr.SetLeftIndent(attr.GetLeftIndent(), attr.GetLeftSubIndent());\n  813 |     else if (attrDef.HasLeftIndent())\n  814 |         newAttr.SetLeftIndent(attrDef.GetLeftIndent(), attr.GetLeftSubIndent());\n  815 | \n  816 |     if (attr.HasRightIndent())\n  817 |         newAttr.SetRightIndent(attr.GetRightIndent());\n  818 |     else if (attrDef.HasRightIndent())\n  819 |         newAttr.SetRightIndent(attrDef.GetRightIndent());","lines":9,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/textcmn.cpp#L811-L819"}]},
{"id":"CPY_11","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"In `wxWrapSizer::CalcMinFromMinor()`, the running \"widest item\" accumulator `maxMajor` is updated using a comparison against the wrong variable `maxMinor`. The block reads `if ( SizeInMajorDir(sz)>maxMinor ) maxMajor = SizeInMajorDir(sz);` - it compares the item's major size to `maxMinor` (the max minor/line-height seen so far) instead of to `maxMajor`. As a result `maxMajor` never correctly tracks the widest item: it only gets set when an item's major size happens to exceed the running minor maximum, so it ends up being an essentially meaningless value (often 0 or too small). `maxMajor` is then used at line 381 (`if ( lineSize<maxMajor ) lineSize = maxMajor;`) to guarantee each line is at least as wide as the widest element, so a too-small `maxMajor` produces an incorrect (too small) computed minimum size for the sizer in the known-minor-direction layout path.","fix":"Compare against `maxMajor`, not `maxMinor`:\n```cpp\nif ( SizeInMajorDir(sz)>maxMinor )\n    maxMajor = SizeInMajorDir(sz);\n```\nshould be:\n```cpp\nif ( SizeInMajorDir(sz)>maxMajor )\n    maxMajor = SizeInMajorDir(sz);\n```","locations":[{"ref":"src/common/wrapsizer.cpp:354-358","code":"  354 |             totMajor += SizeInMajorDir(sz);\n  355 |             if ( SizeInMinorDir(sz)>maxMinor )\n  356 |                 maxMinor = SizeInMinorDir(sz);\n  357 |             if ( SizeInMajorDir(sz)>maxMinor )\n  358 |                 maxMajor = SizeInMajorDir(sz);","lines":5,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/wrapsizer.cpp#L354-L358"},{"ref":"src/common/wrapsizer.cpp:381-382","code":"  381 |     if ( lineSize<maxMajor )     // At least as wide as the widest element\n  382 |         lineSize = maxMajor;","lines":2,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/wrapsizer.cpp#L381-L382"}]},
{"id":"CPY_12","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"In the `wxTabView` constructor, `m_tabViewRect.x` is assigned twice (`20` then `300`) while `m_tabViewRect.height` is never initialized. This is a copy-paste error: line 504 should set `m_tabViewRect.height`, not `m_tabViewRect.x` again. As a result the view rectangle has an uninitialized (0) height and a wrong x-origin of `300` instead of `20`, breaking tab layout and drawing for any `wxTabView` used before `SetViewRect()` is called.","fix":"Change line 504 from `  m_tabViewRect.x = 300;` to `  m_tabViewRect.height = 300;` so the rect is initialized to `{x=20, y=20, width=300, height=300}`.","locations":[{"ref":"src/generic/tabg.cpp:501-504","code":"  501 |   m_tabViewRect.x = 20;\n  502 |   m_tabViewRect.y = 20;\n  503 |   m_tabViewRect.width = 300;\n  504 |   m_tabViewRect.x = 300;","lines":4,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/tabg.cpp#L501-L504"}]},
{"id":"CPY_13","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"In `wxGtkPrinterDCImpl::DoDrawEllipticArc()` the `cairo_translate()` call transforms the Y coordinate with `LogicalToDeviceX()` instead of `LogicalToDeviceY()`:\n```\ncairo_translate( m_cairo, LogicalToDeviceX((wxCoord) (x + w / 2.)), LogicalToDeviceX((wxCoord) (y + h / 2.)) );\n```\nThe sibling function `DoDrawEllipse()` (line 1648) correctly uses `LogicalToDeviceY()` for the Y argument. Because the printer DC can have different X/Y scales and device origins (`m_scaleX`/`m_scaleY`, `m_deviceOriginX`/`m_deviceOriginY`), applying the X transform to a Y value mispositions elliptic arcs whenever the axes differ.","fix":"Change the second argument to use the Y transform:\n```\ncairo_translate( m_cairo, LogicalToDeviceX((wxCoord) (x + w / 2.)), LogicalToDeviceY((wxCoord) (y + h / 2.)) );\n```","locations":[{"ref":"src/gtk/print.cpp:1450","code":" 1450 |     cairo_translate( m_cairo, LogicalToDeviceX((wxCoord) (x + w / 2.)), LogicalToDeviceX((wxCoord) (y + h / 2.)) );","lines":1,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/gtk/print.cpp#L1450"}]},
{"id":"CPY_14","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"In `wxRendererGTK::DrawTreeItemButton()` (GTK3 branch) the vertical center of the expander is computed from `rect.width` instead of `rect.height`:\n```\nconst int x = rect.x + (rect.width - expander_size) / 2;\nconst int y = rect.y + (rect.width - expander_size) / 2;\n```\nThe `y` line should use `rect.height`. The GTK2 branch (line 374) correctly centers vertically with `rect.height / 2`. For non-square rectangles the expander icon is drawn at the wrong vertical position.","fix":"Use the height for the Y coordinate:\n```\nconst int y = rect.y + (rect.height - expander_size) / 2;\n```","locations":[{"ref":"src/gtk/renderer.cpp:344-345","code":"  344 |     const int x = rect.x + (rect.width - expander_size) / 2;\n  345 |     const int y = rect.y + (rect.width - expander_size) / 2;","lines":2,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/gtk/renderer.cpp#L344-L345"}]},
{"id":"CPY_15","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"In the `wxGDIPlusBitmapData(wxGraphicsRenderer*, const wxBitmap&)` constructor, the `else` branch (bitmap without a mask) declares `static BitmapData data;` while the earlier, near-identical branch (bitmap with a mask, a few lines above) declares a plain, non-static `BitmapData data;`. Making this local `static` means every call to this constructor from any thread shares the exact same `BitmapData` struct while it is filled in by `m_helper->LockBits(&bounds, ImageLockModeRead, m_helper->GetPixelFormat(), &data)` and consumed by `new Bitmap(data.Width, data.Height, data.Stride, PixelFormat32bppPARGB, (BYTE*)data.Scan0)`. Two threads constructing `wxGDIPlusBitmapData` from alpha bitmaps concurrently will race on this shared struct, potentially building a `Bitmap` from another thread's `Width`/`Stride`/`Scan0`, causing memory corruption or a crash. There is no functional reason for it to be `static` - it is only used within this single constructor call.","fix":"Remove the stray `static` so each call gets its own instance, matching the equivalent branch above it:\n\n```cpp\nBitmapData data;   // was: static BitmapData data;\n\nm_helper = image ;\nimage = nullptr ;\nm_helper->LockBits(&bounds, ImageLockModeRead,\n    m_helper->GetPixelFormat(),&data);\n```","locations":[{"ref":"src/msw/graphics.cpp:1331-1347","code":" 1331 |         if ( bmp.HasAlpha() && GetPixelFormatSize(image->GetPixelFormat()) == 32 )\n 1332 |         {\n 1333 |             size_t width = image->GetWidth();\n 1334 |             size_t height = image->GetHeight();\n 1335 |             Rect bounds(0,0,width,height);\n 1336 |             static BitmapData data ;\n 1337 | \n 1338 |             m_helper = image ;\n 1339 |             image = nullptr ;\n 1340 |             m_helper->LockBits(&bounds, ImageLockModeRead,\n 1341 |                 m_helper->GetPixelFormat(),&data);\n 1342 | \n 1343 |             image = new Bitmap(data.Width, data.Height, data.Stride,\n 1344 |                 PixelFormat32bppPARGB , (BYTE*) data.Scan0);\n 1345 | \n 1346 |             m_helper->UnlockBits(&data);\n 1347 |         }","lines":17,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/graphics.cpp#L1331-L1347"}]},
{"id":"CPY_16","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In the SWIG/wxPython `%pythoncode` block, four event binder names are written with a doubled underscore (`EVT__AUINOTEBOOK_...`) instead of the single-underscore form used everywhere else (`EVT_AUINOTEBOOK_...`). This copy/paste typo produces Python binder names inconsistent with the documented `EVT_AUINOTEBOOK_TAB_MIDDLE_DOWN` etc., so the intended `EVT_AUINOTEBOOK_TAB_MIDDLE_DOWN`/`_UP`/`_RIGHT_DOWN`/`_RIGHT_UP` bindings are not created under their expected names.","fix":"Remove the extra underscore, e.g. change `EVT__AUINOTEBOOK_TAB_MIDDLE_DOWN = wx.PyEventBinder( wxEVT_AUINOTEBOOK_TAB_MIDDLE_DOWN, 1 )` to `EVT_AUINOTEBOOK_TAB_MIDDLE_DOWN = wx.PyEventBinder( wxEVT_AUINOTEBOOK_TAB_MIDDLE_DOWN, 1 )`, and likewise for `EVT__AUINOTEBOOK_TAB_MIDDLE_UP`, `EVT__AUINOTEBOOK_TAB_RIGHT_DOWN`, `EVT__AUINOTEBOOK_TAB_RIGHT_UP`.","locations":[{"ref":"include/wx/aui/auibook.h:833-836","code":"  833 |     EVT__AUINOTEBOOK_TAB_MIDDLE_DOWN = wx.PyEventBinder( wxEVT_AUINOTEBOOK_TAB_MIDDLE_DOWN, 1 )\n  834 |     EVT__AUINOTEBOOK_TAB_MIDDLE_UP = wx.PyEventBinder( wxEVT_AUINOTEBOOK_TAB_MIDDLE_UP, 1 )\n  835 |     EVT__AUINOTEBOOK_TAB_RIGHT_DOWN = wx.PyEventBinder( wxEVT_AUINOTEBOOK_TAB_RIGHT_DOWN, 1 )\n  836 |     EVT__AUINOTEBOOK_TAB_RIGHT_UP = wx.PyEventBinder( wxEVT_AUINOTEBOOK_TAB_RIGHT_UP, 1 )","lines":4,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/aui/auibook.h#L833-L836"}]},
{"id":"CPY_17","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In the class `wxEventAnyPayloadMixin`, the non-assignability is declared with the wrong class name: `wxDECLARE_NO_ASSIGN_CLASS(wxEventBasicPayloadMixin)` names the *base* class instead of `wxEventAnyPayloadMixin`. The macro expands to `wxEventBasicPayloadMixin& operator=(const wxEventBasicPayloadMixin&) = delete;` declared as a member of `wxEventAnyPayloadMixin`. That is a base-typed conversion-assignment overload, not `wxEventAnyPayloadMixin`'s own copy-assignment operator, so it does not delete/suppress the intended assignment operator of `wxEventAnyPayloadMixin` at all. (In practice the class ends up non-assignable only accidentally, because the base `wxEventBasicPayloadMixin` already deletes its own `operator=`, which implicitly deletes the derived one; the macro line itself is dead/incorrect and misleads any reader relying on it.) Note the base declares it correctly as `wxDECLARE_NO_ASSIGN_DEF_COPY(wxEventBasicPayloadMixin)` on line 1289, confirming this is a copy-paste slip.","fix":"Use the enclosing class name: replace `wxDECLARE_NO_ASSIGN_CLASS(wxEventBasicPayloadMixin);` with `wxDECLARE_NO_ASSIGN_CLASS(wxEventAnyPayloadMixin);`.","locations":[{"ref":"include/wx/event.h:1314","code":" 1314 |     wxDECLARE_NO_ASSIGN_CLASS(wxEventBasicPayloadMixin);","lines":1,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/event.h#L1314"}]},
{"id":"CPY_18","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `wxANIHandler::SaveFile()` the unused-parameter macro is applied to `verbose=true`, i.e. `bool WXUNUSED(verbose=true)`. Because `WXUNUSED(identifier)` always expands to `/* identifier */`, the whole token `verbose=true` is commented out and the parameter becomes an unnamed `bool` with no default here (the default is inherited from the base `wxImageHandler::SaveFile`). It compiles, but the `=true` was clearly meant to be `WXUNUSED(verbose)` and the misplaced default inside the macro is a copy/paste typo not present in any sibling handler.","fix":"Move the default out / drop it since this is an override. Change `virtual bool SaveFile( wxImage *WXUNUSED(image), wxOutputStream& WXUNUSED(stream), bool WXUNUSED(verbose=true) ) override{return false ;}` to `virtual bool SaveFile( wxImage *WXUNUSED(image), wxOutputStream& WXUNUSED(stream), bool WXUNUSED(verbose) ) override { return false; }`.","locations":[{"ref":"include/wx/imagbmp.h:143","code":"  143 |     virtual bool SaveFile( wxImage *WXUNUSED(image), wxOutputStream& WXUNUSED(stream), bool WXUNUSED(verbose=true) ) override{return false ;}","lines":1,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/imagbmp.h#L143"}]},
{"id":"CPY_19","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `htmlhelp.h` the two function prototypes preceding the `#define HtmlHelp WINELIB_NAME_AW(HtmlHelp)` are identical: both declare `HtmlHelpA(HWND,LPCSTR,UINT,DWORD)`. The second line was clearly meant to declare the wide-char version `HtmlHelpW(HWND,LPCWSTR,UINT,DWORD)`. As written, `HtmlHelpA` is declared twice (a redundant redeclaration) and `HtmlHelpW` is never declared. Since `#define HtmlHelp WINELIB_NAME_AW(HtmlHelp)` resolves to `HtmlHelpW` in Unicode builds (which is how wxWidgets always builds), any use of the `HtmlHelp` macro against this fallback header would reference an undeclared `HtmlHelpW`. This is dormant in practice only because `helpchm.cpp` loads `\"HtmlHelpW\"` dynamically via its own `GetProcAddress` typedef and because the Windows SDK's own `htmlhelp.h` (same include guard `__HTMLHELP_H__`) usually wins, but the source defect is real.","fix":"Change line 416 to declare the wide version instead of duplicating the ANSI one:\n```c\nHWND WINAPI HtmlHelpA(HWND,LPCSTR,UINT,DWORD);\nHWND WINAPI HtmlHelpW(HWND,LPCWSTR,UINT,DWORD);\n#define HtmlHelp WINELIB_NAME_AW(HtmlHelp)\n```","locations":[{"ref":"include/wx/msw/htmlhelp.h:415-417","code":"  415 | HWND WINAPI HtmlHelpA(HWND,LPCSTR,UINT,DWORD);\n  416 | HWND WINAPI HtmlHelpA(HWND,LPCSTR,UINT,DWORD);\n  417 | #define HtmlHelp WINELIB_NAME_AW(HtmlHelp)","lines":3,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/msw/htmlhelp.h#L415-L417"}]},
{"id":"CPY_20","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `HDCMapModeChanger`'s constructor, when `::SetMapMode()` fails the error is logged as `wxLogLastError(wxT(\"SelectClipRgn\"))`. This is a copy-paste leftover from `HDCClipper` above; the call that actually failed is `SetMapMode`, so the diagnostic names the wrong Win32 function and would mislead anyone debugging a map-mode failure.","fix":"Change the message to name the correct function:\n```cpp\nm_modeOld = ::SetMapMode(hdc, mm);\nif ( !m_modeOld )\n{\n    wxLogLastError(wxT(\"SetMapMode\"));\n}\n```","locations":[{"ref":"include/wx/msw/private.h:719-724","code":"  719 |             m_modeOld = ::SetMapMode(hdc, mm);\n  720 |             if ( !m_modeOld )\n  721 |             {\n  722 |                 wxLogLastError(wxT(\"SelectClipRgn\"));\n  723 |             }\n  724 |         }","lines":6,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/msw/private.h#L719-L724"}]},
