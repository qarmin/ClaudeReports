{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"The `families` array is allocated with 6 entries (`Roman`, `Decorative`, `Modern`, `Script`, `Swiss`, `Teletype`), but `m_familyChoice` is created passing a count of only `5`, so `families[5]` (`Teletype`) is never added to the choice. Consequently `m_familyChoice->SetStringSelection(wxFontFamilyIntToString(...))` fails to select a teletype font, and the user can never pick the `Teletype` family from the dialog even though `wxFontFamilyStringToInt` supports it.","fix":"Pass the real element count `6` to the `wxChoice` ctor:\n```cpp\n// before\nm_familyChoice = new wxChoice( this, wxID_FONT_FAMILY, wxDefaultPosition, wxDefaultSize, 5, families, 0 );\n// after\nm_familyChoice = new wxChoice( this, wxID_FONT_FAMILY, wxDefaultPosition, wxDefaultSize, 6, families, 0 );\n```","locations":[{"ref":"src/generic/fontdlgg.cpp:310-318","code":"  310 |     wxString *families = new wxString[6],\n  311 |              *styles = new wxString[3],\n  312 |              *weights = new wxString[3];\n  313 |     families[0] =  _(\"Roman\");\n  314 |     families[1] = _(\"Decorative\");\n  315 |     families[2] = _(\"Modern\");\n  316 |     families[3] = _(\"Script\");\n  317 |     families[4] = _(\"Swiss\" );\n  318 |     families[5] = _(\"Teletype\" );","lines":9,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/fontdlgg.cpp#L310-L318"},{"ref":"src/generic/fontdlgg.cpp:364","code":"  364 |     m_familyChoice = new wxChoice( this, wxID_FONT_FAMILY, wxDefaultPosition, wxDefaultSize, 5, families, 0 );","lines":1,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/fontdlgg.cpp#L364"}]},
{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `wxListMainWindow::SetColumnWidth`, the block that expands the last column to fill the client area (guarded by `width == wxLIST_AUTOSIZE_USEHEADER && col == GetColumnCount() - 1`) is dead: `width` was already overwritten at line 3494 with `calculator.GetMaxWidth() + AUTOSIZE_COL_MARGIN`, a positive pixel value, so it can never equal `wxLIST_AUTOSIZE_USEHEADER` (which is `-2`). The condition was clearly meant to test the *original* requested width, not the recomputed one. As a result the documented MSW-mimicking behaviour of stretching the last column when it is sized with `wxLIST_AUTOSIZE_USEHEADER` never happens.","fix":"Capture the caller's requested width before it is overwritten and test that instead. For example add `const int widthRequested = width;` near the top of the `if ( width == wxLIST_AUTOSIZE_USEHEADER || width == wxLIST_AUTOSIZE )` block and change line 3505 to `if ( (widthRequested == wxLIST_AUTOSIZE_USEHEADER) && (col == GetColumnCount() - 1) )`.","locations":[{"ref":"src/generic/listctrl.cpp:3494-3513","code":" 3494 |         width = calculator.GetMaxWidth() + AUTOSIZE_COL_MARGIN;\n 3495 | \n 3496 |         if ( col == 0 && HasCheckBoxes() )\n 3497 |         {\n 3498 |             // also account for the space needed by the checkbox\n 3499 |             width += wxRendererNative::Get().GetCheckBoxSize(this).x\n 3500 |                         + 2*MARGIN_AROUND_CHECKBOX;\n 3501 |         }\n 3502 | \n 3503 |         // expand the last column to fit the client size\n 3504 |         // only for AUTOSIZE_USEHEADER to mimic MSW behaviour\n 3505 |         if ( (width == wxLIST_AUTOSIZE_USEHEADER) && (col == GetColumnCount() - 1) )\n 3506 |         {\n 3507 |             int margin = GetClientSize().GetX();\n 3508 |             for ( int i = 0; i < col && margin > 0; ++i )\n 3509 |                 margin -= m_columns.at(i).GetWidth();\n 3510 | \n 3511 |             if ( margin > width )\n 3512 |                 width = margin;\n 3513 |         }","lines":20,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/listctrl.cpp#L3494-L3513"}]},
{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `wxNumberEntryDialog::OnOK`, the branches that call `EndModal(wxID_CANCEL)` are not followed by `return`, so control always falls through to the final `EndModal(wxID_OK)`. Calling `EndModal` twice means the last call (`wxID_OK`) wins, so the dialog never actually reports cancellation. In the `!wxUSE_SPINCTRL` build, when `wxSscanf` fails to parse a number, `m_value` keeps its previous (initial) value and the dialog returns `wxID_OK`, so `wxGetNumberFromUser` returns the stale initial value instead of the `-1` failure sentinel. The out-of-range branch also incorrectly ends as `wxID_OK` (it happens to set `m_value = -1` first, masking the defect). In the default `wxUSE_SPINCTRL` build the spin control clamps the value, so the bug is only observable with the text-control fallback.","fix":"Add `return;` after each `EndModal(wxID_CANCEL);` call, e.g. change the out-of-range block to:\n```cpp\n    if ( m_value < m_min || m_value > m_max )\n    {\n        // not a number or out of range\n        m_value = -1;\n        EndModal(wxID_CANCEL);\n        return;\n    }\n\n    EndModal(wxID_OK);\n```\nand likewise make the `wxSscanf` failure branch `return` after `EndModal(wxID_CANCEL);`.","locations":[{"ref":"src/generic/numdlgg.cpp:134-152","code":"  134 | void wxNumberEntryDialog::OnOK(wxCommandEvent& WXUNUSED(event))\n  135 | {\n  136 | #if !wxUSE_SPINCTRL\n  137 |     wxString tmp = m_spinctrl->GetValue();\n  138 |     if ( wxSscanf(tmp, wxT(\"%ld\"), &m_value) != 1 )\n  139 |         EndModal(wxID_CANCEL);\n  140 |     else\n  141 | #else\n  142 |     m_value = m_spinctrl->GetValue();\n  143 | #endif\n  144 |     if ( m_value < m_min || m_value > m_max )\n  145 |     {\n  146 |         // not a number or out of range\n  147 |         m_value = -1;\n  148 |         EndModal(wxID_CANCEL);\n  149 |     }\n  150 | \n  151 |     EndModal(wxID_OK);\n  152 | }","lines":19,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/numdlgg.cpp#L134-L152"}]},
{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`wxRegionGeneric::DoSubtract` passes its arguments to `XSubtractRegion` in the wrong order. `XSubtractRegion(Region regM, Region regS, Region regD)` is documented (and implemented) as `regD = regM - regS` (minuend `regM` minus subtrahend `regS`). The call `REGION::XSubtractRegion(M_REGIONDATA_OF(region), M_REGIONDATA, M_REGIONDATA)` sets `regM = region`, `regS = this`, so it computes `region - this` and stores it in `this`, whereas `wxRegion::Subtract` must compute `this - region`. For example, if `this` is empty (and `region` non-empty, so the early `region.IsEmpty()` guard is not taken), the trivial-reject path `miRegionCopy(regD, regM)` copies `region` into `this`, leaving `this == region` instead of the correct empty result. Compare the commutative `DoUnionWithRegion`/`DoIntersect` which use the same ordering harmlessly, but subtraction is not commutative.","fix":"Swap the first two arguments so `this` is the minuend: `return REGION::XSubtractRegion(M_REGIONDATA, M_REGIONDATA_OF(region), M_REGIONDATA);` (see also the `AllocExclusive()` finding for the same function).","locations":[{"ref":"src/generic/regiong.cpp:349-358","code":"  349 | bool wxRegionGeneric::DoSubtract(const wxRegion& region)\n  350 | {\n  351 |     if ( region.IsEmpty() )\n  352 |     {\n  353 |         // nothing to do\n  354 |         return true;\n  355 |     }\n  356 | \n  357 |     return REGION::XSubtractRegion(M_REGIONDATA_OF(region),M_REGIONDATA,M_REGIONDATA);\n  358 | }","lines":10,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/regiong.cpp#L349-L358"}]},
{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `wxToolbook::OnToolSelected`, when the page change is vetoed the code tries to revert the toolbar radio button state with `GetToolBar()->ToggleTool(m_selection, false)`. This is wrong in two ways: (1) `m_selection` is a page index, but `wxToolBar::ToggleTool` expects a tool id (every other method here converts via `PageToToolId`, e.g. `UpdateSelectedPage` calls `ToggleTool(PageToToolId(newsel), true)`), so it toggles a tool whose id happens to equal a page index (usually a no-op); (2) it passes `false`, whereas restoring the previous selection requires toggling the previous page's tool back on. The clicked tool (whose radio group already selected it) stays visually selected while the displayed page reverts, leaving the toolbar inconsistent with the content.","fix":"Convert the page index to a tool id and toggle it on so the previously-selected radio tool is restored:\n```cpp\n    if (m_selection != page)\n    {\n        GetToolBar()->ToggleTool(PageToToolId(m_selection), true);\n    }\n```","locations":[{"ref":"src/generic/toolbkg.cpp:391-394","code":"  391 |     if (m_selection != page)\n  392 |     {\n  393 |         GetToolBar()->ToggleTool(m_selection, false);\n  394 |     }","lines":4,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/toolbkg.cpp#L391-L394"}]},
{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `wxWizard::ShowPage()` the local `wxBitmap bmp;` is declared at line 613 *inside* the `#if wxUSE_STATBMP ... #endif` block (the `#endif` is at line 629), but `bmp` is then used unconditionally at lines 663-666 in the `if (GetBitmapPlacement() && m_statbmp)` block which is *outside* that preprocessor guard. When the library is built with `wxUSE_STATBMP == 0` this is a compile error (use of undeclared identifier `bmp`), breaking a supported build configuration. `bmpPrev` (declared at line 546) is fine because it is outside the guard, but `bmp` is not.","fix":"Either declare `wxBitmap bmp;` outside the `#if wxUSE_STATBMP` block (next to `bmpPrev` at line 546), or wrap the entire `if (GetBitmapPlacement() && m_statbmp) { ResizeBitmap(bmp); ... }` block at lines 661-670 in `#if wxUSE_STATBMP ... #endif` so that `bmp` is only referenced where it is declared.","locations":[{"ref":"src/generic/wizard.cpp:611-670","code":"  611 | #if wxUSE_STATBMP\n  612 |     // update the bitmap if:it changed\n  613 |     wxBitmap bmp;\n  614 |     if ( m_statbmp )\n  615 |     {\n  616 |         bmp = m_page->GetBitmap();\n  617 |         if ( !bmp.IsOk() )\n  618 |             bmp = m_bitmap.GetBitmapFor(this);\n  619 | \n  620 |         if ( !bmpPrev.IsOk() )\n  621 |             bmpPrev = m_bitmap.GetBitmapFor(this);\n  622 | \n  623 |         if (!GetBitmapPlacement())\n  624 |         {\n  625 |             if ( !bmp.IsSameAs(bmpPrev) )\n  626 |                 m_statbmp->SetBitmap(bmp);\n  627 |         }\n  628 |     }\n  629 | #endif // wxUSE_STATBMP\n  630 | \n  631 | \n  632 |     // and update the buttons state\n  633 |     m_btnPrev->Enable(m_page != m_firstpage);\n  634 | \n  635 |     const bool hasNext = HasNextPage(m_page);\n  636 |     const wxString& label = hasNext ? m_nextLabel : m_finishLabel;\n  637 |     if ( label != m_btnNext->GetLabel() )\n  638 |         m_btnNext->SetLabel(label);\n  639 | \n  640 |     m_btnNext->SetDefault();\n  641 | \n  642 | \n  643 |     // send the change event to the new page now\n  644 |     wxWizardEvent event(wxEVT_WIZARD_PAGE_CHANGED, GetId(), goingForward, m_page);\n  645 |     (void)m_page->GetEventHandler()->ProcessEvent(event);\n  646 | \n  647 |     // and finally show it\n  648 |     m_page->Show();\n  649 |     m_page->SetFocus();\n  650 | \n  651 |     if ( !m_usingSizer )\n  652 |         m_sizerBmpAndPage->Layout();\n  653 | \n  654 |     if ( !m_started )\n  655 |     {\n  656 |         m_started = true;\n  657 | \n  658 |         DoWizardLayout();\n  659 |     }\n  660 | \n  661 |     if (GetBitmapPlacement() && m_statbmp)\n  662 |     {\n  663 |         ResizeBitmap(bmp);\n  664 | \n  665 |         if ( !bmp.IsSameAs(bmpPrev) )\n  666 |             m_statbmp->SetBitmap(bmp);\n  667 | \n  668 |         if (m_usingSizer)\n  669 |             m_sizerPage->RecalcSizes();\n  670 |     }","lines":60,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/wizard.cpp#L611-L670"}]},
{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `wxDataViewCtrlInternal::iter_children()`, the virtual-list-model branch unconditionally returns `TRUE` and sets `iter->user_data = (gpointer) 1` (i.e. index 0) whenever `parent` is null, without ever checking that the model actually contains any rows. GTK calls this function from `gtk_tree_model_get_iter_first()` (via `gtk_tree_model_iter_children(model, iter, NULL)`). For an empty `wxDataViewVirtualListModel` (`GetCount() == 0`) this reports that a first child row exists, so GTK will then call `wxgtk_tree_model_get_value()` for a nonexistent row 0, invoking the user model's `GetValue()` with an out-of-range index and potentially crashing or asserting. Every other virtual-list accessor here (`get_iter`, `iter_nth_child`, `iter_n_children`) correctly bounds-checks against `GetCount()`; this one does not.","fix":"Guard against an empty model before returning `TRUE`:\n```cpp\nif (m_wx_model->IsVirtualListModel())\n{\n    if (parent)\n        return FALSE;\n\n    wxDataViewVirtualListModel* wx_model = (wxDataViewVirtualListModel*) m_wx_model;\n    if (wx_model->GetCount() == 0)\n        return FALSE;\n\n    iter->stamp = m_gtk_model->stamp;\n    iter->user_data = (gpointer) 1;\n    return TRUE;\n}\n```","locations":[{"ref":"src/gtk/dataview.cpp:4248-4258","code":" 4248 |     if (m_wx_model->IsVirtualListModel())\n 4249 |     {\n 4250 |         // this is a list, nodes have no children\n 4251 |         if (parent)\n 4252 |             return FALSE;\n 4253 | \n 4254 |         iter->stamp = m_gtk_model->stamp;\n 4255 |         iter->user_data = (gpointer) 1;\n 4256 | \n 4257 |         return TRUE;\n 4258 |     }","lines":11,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/gtk/dataview.cpp#L4248-L4258"}]},
{"id":"LOGIC_33","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `wxDisplayImplGTK::GetRawPPI()` the guard against invalid monitor sizes uses `&&`: `if ( widthInMM <= 0 && heightInMM <= 0 )`. If a monitor reports a valid value for one dimension but `0` (or negative) for the other, the guard is skipped and the code computes `geometry.width * 25.4 / widthInMM` (or the `heightInMM` variant), i.e. a division by zero. The resulting `double` is infinity and `wxRound(inf)` yields an undefined/garbage integer PPI that then propagates into DPI/layout calculations. GDK does return `0` for `gdk_screen_get_monitor_width_mm`/`height_mm` on some drivers, so this is reachable.","fix":"Fall back to the standard PPI whenever either dimension is invalid.\n\n```cpp\n// before\nif ( widthInMM <= 0 && heightInMM <= 0 )\n    return wxDisplay::GetStdPPI();\n// after\nif ( widthInMM <= 0 || heightInMM <= 0 )\n    return wxDisplay::GetStdPPI();\n```","locations":[{"ref":"src/gtk/display.cpp:372","code":"  372 |     if ( widthInMM <= 0 && heightInMM <= 0 )","lines":1,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/gtk/display.cpp#L372"}]},
{"id":"LOGIC_34","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`FindMenuItemRecursive()` returns the result of recursing into the *first* submenu item it encounters unconditionally, even when that recursion returns `wxNOT_FOUND`. Because of the `return FindMenuItemRecursive(...)` inside the loop, all submenu siblings after the first (and any regular items following the first submenu) are never searched. As a result, `wxMenuBar::FindMenuItem(menuString, itemString)` fails to find items that live in the second or later submenu of a menu whose first child happens to be a submenu.","fix":"Only return when the recursive call actually found something, otherwise keep iterating:\n```cpp\nif (item->IsSubMenu())\n{\n    int res = FindMenuItemRecursive(item->GetSubMenu(), menuString, itemString);\n    if (res != wxNOT_FOUND)\n        return res;\n}\n```","locations":[{"ref":"src/gtk/menu.cpp:423-433","code":"  423 |     wxMenuItemList::compatibility_iterator node = menu->GetMenuItems().GetFirst();\n  424 |     while (node)\n  425 |     {\n  426 |         wxMenuItem *item = node->GetData();\n  427 |         if (item->IsSubMenu())\n  428 |             return FindMenuItemRecursive(item->GetSubMenu(), menuString, itemString);\n  429 | \n  430 |         node = node->GetNext();\n  431 |     }\n  432 | \n  433 |     return wxNOT_FOUND;","lines":11,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/gtk/menu.cpp#L423-L433"}]},
{"id":"LOGIC_35","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`wxToolBar::SetToolNormalBitmap()` unconditionally calls `tool->SetImage()`, but `wxToolBarTool::SetImage()` does `WX_GTK_IMAGE(gtk_tool_button_get_icon_widget(...))->Set(bitmap)`. When the toolbar was created with `wxTB_NOICONS`, no icon widget was ever attached in `DoInsertTool()` (the icon-creation block is guarded by `if (!HasFlag(wxTB_NOICONS))`), so `gtk_tool_button_get_icon_widget()` returns `NULL`. `WX_GTK_IMAGE(NULL)` (a `G_TYPE_CHECK_INSTANCE_CAST`) yields `NULL`, and the subsequent `->Set(bitmap)` dereferences a null pointer, crashing. `SetImage()` performs no null check unlike the guarded call site in `DoInsertTool()`.","fix":"Guard against a missing icon widget in `SetImage()`:\n```cpp\nvoid wxToolBarTool::SetImage()\n{\n    GtkWidget* image = gtk_tool_button_get_icon_widget(GTK_TOOL_BUTTON(m_item));\n    if ( image )\n        WX_GTK_IMAGE(image)->Set(GetNormalBitmap());\n}\n```\nor skip the call in `SetToolNormalBitmap()` when `HasFlag(wxTB_NOICONS)` is set.","locations":[{"ref":"src/gtk/toolbar.cpp:263-269","code":"  263 | void wxToolBarTool::SetImage()\n  264 | {\n  265 |     const wxBitmap& bitmap = GetNormalBitmap();\n  266 | \n  267 |     GtkWidget* image = gtk_tool_button_get_icon_widget(GTK_TOOL_BUTTON(m_item));\n  268 |     WX_GTK_IMAGE(image)->Set(bitmap);\n  269 | }","lines":7,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/gtk/toolbar.cpp#L263-L269"},{"ref":"src/gtk/toolbar.cpp:807-817","code":"  807 | void wxToolBar::SetToolNormalBitmap( int id, const wxBitmapBundle& bitmap )\n  808 | {\n  809 |     wxToolBarTool* tool = static_cast<wxToolBarTool*>(FindById(id));\n  810 |     if ( tool )\n  811 |     {\n  812 |         wxCHECK_RET( tool->IsButton(), wxT(\"Can only set bitmap on button tools.\"));\n  813 | \n  814 |         tool->SetNormalBitmap(bitmap);\n  815 |         tool->SetImage();\n  816 |     }\n  817 | }","lines":11,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/gtk/toolbar.cpp#L807-L817"}]},
{"id":"LOGIC_36","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `wxChmFSHandler::FindFirst()` the statement `wxString m_found = m_chm->Find(m_pattern);` declares a **local** variable named `m_found` that shadows the class member `m_found` (declared in the private section). The member is therefore never assigned. `wxChmFSHandler::FindNext()` calls `m_chm->Find(m_pattern, m_found)` using the (empty) member, so it can never resume the enumeration after the position of the previously found file - it always searches from an empty `startfrom`. This silently breaks CHM archive file enumeration.","fix":"Remove the type so the member is assigned instead of a local being created:\n```cpp\nm_found = m_chm->Find(m_pattern);\n```","locations":[{"ref":"src/html/chm.cpp:868-879","code":"  868 |     wxString m_found = m_chm->Find(m_pattern);\n  869 | \n  870 |     // now fake around hhp-files which are not existing in projects...\n  871 |     if (m_found.empty() &&\n  872 |         m_pattern.Contains(wxT(\".hhp\")) &&\n  873 |         !m_pattern.Contains(wxT(\".hhp.cached\")))\n  874 |     {\n  875 |         m_found.Printf(wxT(\"%s#chm:%s.hhp\"),\n  876 |                        left, m_pattern.BeforeLast(wxT('.')));\n  877 |     }\n  878 | \n  879 |     return m_found;","lines":12,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/html/chm.cpp#L868-L879"},{"ref":"src/html/chm.cpp:885-891","code":"  885 | wxString wxChmFSHandler::FindNext()\n  886 | {\n  887 |     if (m_pattern.empty())\n  888 |         return wxEmptyString;\n  889 |     else\n  890 |         return m_chm->Find(m_pattern, m_found);\n  891 | }","lines":7,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/html/chm.cpp#L885-L891"},{"ref":"src/html/chm.cpp:769","code":"  769 |     wxString m_found;","lines":1,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/html/chm.cpp#L769"}]},
{"id":"LOGIC_37","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`ScaleAndReverseBitmap()` (used by `CreateReverseCursor()` to synthesize `wxCURSOR_RIGHT_ARROW` by mirroring the standard arrow cursor) computes a scaled size `cs(bmp.bmWidth * scale, bmp.bmHeight * scale)` but never actually resizes the underlying `HBITMAP`: it selects the *original-sized* bitmap into a memory DC and does an in-place `StretchBlt` into a destination rectangle of the scaled size `cs`. When `scale > 1` (i.e. the monitor under the mouse has a higher PPI than the primary display used by `wxGetDisplayPPI()`), the destination rectangle extends beyond the bitmap's actual bounds, so GDI silently clips the extra pixels: the \"reversed\" cursor bitmap ends up truncated/incorrectly scaled instead of being a properly enlarged mirror image. The caller then also computes `info.xHotspot`/`info.yHotspot` using the scaled `cs.x`, which is inconsistent with the actual (unscaled) bitmap dimensions used by `::CreateIconIndirect(&info)`, producing a cursor with a wrong hotspot on any secondary monitor that has a different PPI from the main display.","fix":"When `scale != 1`, create new bitmaps of the actual scaled size and blit into those instead of writing beyond the original bitmap bounds, e.g. create a compatible bitmap sized `cs.x x cs.y`, select that into the destination DC, and `StretchBlt` from the original (unscaled) bitmap into it; then store the newly created bitmap back into `info.hbmMask`/`info.hbmColor` (freeing the old one) so `CreateIconIndirect()` and the hotspot calculation both use consistent, correctly-scaled dimensions.","locations":[{"ref":"src/msw/cursor.cpp:232-265","code":"  232 | wxSize ScaleAndReverseBitmap(HBITMAP& bitmap, float scale)\n  233 | {\n  234 |     BITMAP bmp;\n  235 |     if ( !::GetObject(bitmap, sizeof(bmp), &bmp) )\n  236 |         return wxSize();\n  237 |     wxSize cs(bmp.bmWidth * scale, bmp.bmHeight * scale);\n  238 | \n  239 |     MemoryHDC hdc;\n  240 |     SelectInHDC selBitmap(hdc, bitmap);\n  241 |     if ( scale != 1 )\n  242 |         ::SetStretchBltMode(hdc, HALFTONE);\n  243 |     ::StretchBlt(hdc, cs.x - 1, 0, -cs.x, cs.y, hdc, 0, 0, bmp.bmWidth, bmp.bmHeight, SRCCOPY);\n  244 | \n  245 |     return cs;\n  246 | }\n  247 | \n  248 | HCURSOR CreateReverseCursor(HCURSOR cursor)\n  249 | {\n  250 |     AutoIconInfo info;\n  251 |     if ( !info.GetFrom(cursor) )\n  252 |         return nullptr;\n  253 | \n  254 |     const unsigned displayID = (unsigned)wxDisplay::GetFromPoint(wxGetMousePosition());\n  255 |     wxDisplay disp(displayID == 0u || displayID < wxDisplay::GetCount() ? displayID : 0u);\n  256 |     const float scale = (float)disp.GetPPI().y / wxGetDisplayPPI().y;\n  257 | \n  258 |     wxSize cursorSize = ScaleAndReverseBitmap(info.hbmMask, scale);\n  259 |     if ( info.hbmColor )\n  260 |         ScaleAndReverseBitmap(info.hbmColor, scale);\n  261 |     info.xHotspot = (DWORD)(cursorSize.x - 1 - info.xHotspot * scale);\n  262 |     info.yHotspot = (DWORD)(info.yHotspot * scale);\n  263 | \n  264 |     return ::CreateIconIndirect(&info);\n  265 | }","lines":34,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/cursor.cpp#L232-L265"}]},
{"id":"LOGIC_38","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`mfPLACEABLEHEADER` (`src/msw/metafile.cpp:323-330`) is written to disk with `fwrite((void *)&header, 1, sizeof(mfPLACEABLEHEADER), fHandle);` at `src/msw/metafile.cpp:377`, relying on `sizeof(mfPLACEABLEHEADER)` matching the on-disk placeable-WMF header layout, which must be exactly 22 bytes (`DWORD key` + `short hmf` + 4 `short` bbox fields + `WORD inch` + `DWORD reserved` + `WORD checksum`). Because the struct has no `#pragma pack(1)` (or equivalent) and its natural alignment is 4 bytes (due to the `DWORD` members), the compiler inserts 2 bytes of trailing padding after `checksum`, so `sizeof(mfPLACEABLEHEADER)` is actually 24, not 22 (verified: `offsetof(checksum) == 20`, struct size == 24 with standard alignment rules). The `fwrite()` therefore writes 2 extra, uninitialized/padding bytes into the output file immediately before the `METAHEADER` record, shifting every subsequent metafile record by 2 bytes and producing a placeable metafile that other applications (and Windows itself) cannot parse correctly.","fix":"Force the struct to be packed with no padding, e.g. using MSVC/MinGW's pack pragmas around the two struct definitions:\n\n```cpp\n#pragma pack(push, 1)\nstruct RECT32\n{\n  short left;\n  short top;\n  short right;\n  short bottom;\n};\n\nstruct mfPLACEABLEHEADER {\n    DWORD    key;\n    short    hmf;\n    RECT32    bbox;\n    WORD    inch;\n    DWORD    reserved;\n    WORD    checksum;\n};\n#pragma pack(pop)\n```\n\nAlternatively, serialize the 22 required bytes field-by-field with individual `fwrite()` calls instead of writing `sizeof(mfPLACEABLEHEADER)` bytes of the in-memory struct.","locations":[{"ref":"src/msw/metafile.cpp:315-330","code":"  315 | struct RECT32\n  316 | {\n  317 |   short left;\n  318 |   short top;\n  319 |   short right;\n  320 |   short bottom;\n  321 | };\n  322 | \n  323 | struct mfPLACEABLEHEADER {\n  324 |     DWORD    key;\n  325 |     short    hmf;\n  326 |     RECT32    bbox;\n  327 |     WORD    inch;\n  328 |     DWORD    reserved;\n  329 |     WORD    checksum;\n  330 | };","lines":16,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/metafile.cpp#L315-L330"},{"ref":"src/msw/metafile.cpp:377","code":"  377 |     fwrite((void *)&header, 1, sizeof(mfPLACEABLEHEADER), fHandle);","lines":1,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/metafile.cpp#L377"}]},
{"id":"LOGIC_39","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`wxClipboardLocker::operator!()` dereferences `m_clipboard` unconditionally, but both the constructor and destructor guard every use of `m_clipboard` with `if ( m_clipboard )`. This asymmetry shows the author considers `m_clipboard` (set to `clipboard ? clipboard : wxTheClipboard`, where `wxTheClipboard` is `wxClipboard::Get()` which can return `nullptr`) potentially null. In the null case the idiomatic `wxClipboardLocker locker; if ( !locker ) return;` guard dereferences a null pointer and crashes instead of reporting failure.","fix":"Guard the dereference like the ctor/dtor do:\n```cpp\nbool operator!() const { return m_clipboard ? !m_clipboard->IsOpened() : true; }\n```","locations":[{"ref":"include/wx/clipbrd.h:179","code":"  179 |     bool operator!() const { return !m_clipboard->IsOpened(); }","lines":1,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/clipbrd.h#L179"}]},
{"id":"LOGIC_40","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`wxDfbPtr::operator=(const wxDfbPtr& ptr)` is not self-assignment safe. It calls `Reset()` first, which releases and sets `m_ptr = nullptr`, and only then calls `InitFrom(ptr)`. On self-assignment (`p = p`), `Reset()` has already nulled `ptr.m_ptr` (since `ptr` aliases `*this`), so `InitFrom` copies a `nullptr` and, worse, the interface's reference count was decremented (and possibly the object destroyed) even though the caller intended no change. The pointer ends up null after assigning it to itself.","fix":"Add a self-assignment guard before releasing:\n```cpp\nwxDfbPtr& operator=(const wxDfbPtr& ptr)\n{\n    if ( this != &ptr )\n    {\n        Reset();\n        InitFrom(ptr);\n    }\n    return *this;\n}\n```","locations":[{"ref":"include/wx/dfb/dfbptr.h:87-92","code":"   87 |     wxDfbPtr& operator=(const wxDfbPtr& ptr)\n   88 |     {\n   89 |         Reset();\n   90 |         InitFrom(ptr);\n   91 |         return *this;\n   92 |     }","lines":6,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/dfb/dfbptr.h#L87-L92"}]},
{"id":"LOGIC_41","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In the non-STL `wxDList` (wxUSE_STD_CONTAINERS==0), `erase(first, last)` returns the wrong iterator, deviating from `std::list::erase(first,last)` semantics. It computes `iterator next = last; ++next;` and returns `next`, then deletes the half-open range `[first, last)` (via `DeleteNodes`, whose loop is `while (node != last)` and thus does not delete `last`). Standard semantics require returning the iterator to the element following the last removed element, which is `last` itself; returning `++last` skips one live element past `last`.","fix":"Return `last` rather than its successor:\n```cpp\niterator erase(const iterator& first, const iterator& last)\n{\n    DeleteNodes(first.m_node, last.m_node);\n    return last;\n}\n```","locations":[{"ref":"include/wx/dlist.h:814-819","code":"  814 |     iterator erase(const iterator& first, const iterator& last)\n  815 |     {\n  816 |         iterator next = last; ++next;\n  817 |         DeleteNodes(first.m_node, last.m_node);\n  818 |         return next;\n  819 |     }","lines":6,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/dlist.h#L814-L819"},{"ref":"include/wx/dlist.h:535-544","code":"  535 |     void DeleteNodes(nodetype* first, nodetype* last)\n  536 |     {\n  537 |         nodetype * node = first;\n  538 |         while (node != last)\n  539 |         {\n  540 |             nodetype* next = node->GetNext();\n  541 |             DeleteNode(node);\n  542 |             node = next;\n  543 |         }\n  544 |     }","lines":10,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/dlist.h#L535-L544"}]},
{"id":"LOGIC_42","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`wxBaseObjectArray::operator=` is not self-assignment safe. It calls `Empty()` (which frees and clears all owned pointers of `*this`) before `DoCopy(src)`. When `src` is `*this`, `Empty()` has already destroyed all elements and emptied the container, so `DoCopy` copies from a now-empty `src`, silently leaving the array empty and losing all data.","fix":"Guard against self-assignment, e.g. `if ( this == &src ) return *this;` at the top of `operator=` before calling `Empty()`.","locations":[{"ref":"include/wx/dynarray.h:322-328","code":"  322 |     wxBaseObjectArray& operator=(const wxBaseObjectArray& src)\n  323 |     {\n  324 |         Empty();\n  325 |         DoCopy(src);\n  326 | \n  327 |         return *this;\n  328 |     }","lines":7,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/dynarray.h#L322-L328"},{"ref":"include/wx/dynarray.h:489-494","code":"  489 |     void DoCopy(const wxBaseObjectArray& src)\n  490 |     {\n  491 |         reserve(src.size());\n  492 |         for ( size_t n = 0; n < src.size(); ++n )\n  493 |             Add(src[n]);\n  494 |     }","lines":6,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/dynarray.h#L489-L494"}]},
{"id":"LOGIC_43","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`wxRect2DDouble` and `wxRect2DInt` both document the rectangle as a half-open interval (`left <= x < right and top <= y < bottom`), but their `GetOutCode()` implementations disagree. `wxRect2DInt::GetOutCode` uses `pt.m_x >= m_x + m_width` / `pt.m_y >= m_y + m_height` (matching the documented half-open contract, so a point on the right/bottom edge is *outside*), while `wxRect2DDouble::GetOutCode` uses strictly `pt.m_x > m_x + m_width` / `pt.m_y > m_y + m_height` (a point exactly on the right/bottom edge is reported as *inside*). Consequently `Contains()` gives inconsistent results for the two rectangle types for edge points, and the double version contradicts its own class comment.","fix":"Make the two consistent with the documented half-open interval by using `>=` for the right/bottom comparisons in `wxRect2DDouble::GetOutCode` as well (or explicitly document the intended difference if the inclusive behavior is deliberate for floating-point rects).","locations":[{"ref":"include/wx/geometry.h:618-622","code":"  618 |     inline wxOutCode GetOutCode( const wxPoint2DDouble &pt ) const\n  619 |         { return (wxOutCode) (( ( pt.m_x < m_x ) ? wxOutLeft : 0 ) +\n  620 |                      ( ( pt.m_x > m_x + m_width ) ? wxOutRight : 0 ) +\n  621 |                      ( ( pt.m_y < m_y ) ? wxOutTop : 0 )  +\n  622 |                      ( ( pt.m_y > m_y + m_height ) ? wxOutBottom : 0 )); }","lines":5,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/geometry.h#L618-L622"},{"ref":"include/wx/geometry.h:753-757","code":"  753 |         inline wxOutCode GetOutCode( const wxPoint2DInt &pt ) const\n  754 |             { return (wxOutCode) (( ( pt.m_x < m_x ) ? wxOutLeft : 0 ) +\n  755 |                      ( ( pt.m_x >= m_x + m_width ) ? wxOutRight : 0 ) +\n  756 |                      ( ( pt.m_y < m_y ) ? wxOutTop : 0 )  +\n  757 |                      ( ( pt.m_y >= m_y + m_height ) ? wxOutBottom : 0 )); }","lines":5,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/geometry.h#L753-L757"}]},
{"id":"LOGIC_44","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `wxHtmlCell` every other geometry member is given an in-class initializer (`m_Width = 0`, `m_Height = 0`, `m_Descent = 0`) but `m_PosX` and `m_PosY` are declared without one. Since the class has a defaulted default constructor (`wxHtmlCell() = default;`), a freshly constructed cell has indeterminate `m_PosX`/`m_PosY`, so `GetPosX()`/`GetPosY()` (and `GetAbsPos()`/`GetRect()` which sum them) return garbage if queried before `Layout()`/`SetPos()` runs. This is an inconsistency that looks like an oversight.","fix":"Give them initializers to match the siblings: change `    int m_PosX, m_PosY;` to `    int m_PosX = 0, m_PosY = 0;`.","locations":[{"ref":"include/wx/html/htmlcell.h:418-419","code":"  418 |     // position where the fragment is drawn:\n  419 |     int m_PosX, m_PosY;","lines":2,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/html/htmlcell.h#L418-L419"}]},
{"id":"LOGIC_45","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `wxDateTimePrinter.to_string()`, the invalid/NONE sentinel test `if msec == 0x8000000000000000` compares a value cast to signed `long long` (whose bit pattern `0x8000000000000000` represents `-9223372036854775808`) against the positive Python integer `9223372036854775808`. These are not numerically equal, so the sentinel for an invalid `wxDateTime` is generally never detected and such values fall through to `datetime.datetime.fromtimestamp()` instead of printing `NONE`.","fix":"Compare against the signed value of the sentinel, e.g. `if int(msec) == -0x8000000000000000:` (or mask/compare as unsigned consistently) so the wxLongLong minimum used as the invalid marker is recognized.","locations":[{"ref":"misc/gdb/print.py:51-55","code":"   51 |         msec = self.val['m_time'].cast(gdb.lookup_type('long long'))\n   52 |         if msec == 0x8000000000000000:\n   53 |             return 'NONE'\n   54 |         sec = int(msec / 1000)\n   55 |         return datetime.datetime.fromtimestamp(sec).isoformat(' ')","lines":5,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/misc/gdb/print.py#L51-L55"}]},
{"id":"LOGIC_46","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `misc/scripts/bin2c.py`, the filename-validation regex `r = re.compile(\"^([a-zA-Z._][a-zA-Z._0-9]*)[.]([a-zA-Z_0-9]+)$\")` includes a literal `.` inside the character classes used for the first capture group (the identifier prefix). Because of this, for any input filename containing more than one dot (e.g. `my.icon.png`), the regex still matches: `m.group(1)` greedily captures `my.icon` and `m.group(2)` captures `png`, so the `if not(m): ... continue` \"unsuitable filename\" guard never rejects it. The generated C array name, built as `\"%s_%s_data\" % (m.group(1), m.group(2))`, then embeds a literal dot (e.g. `my.icon_png_data`), which is not a valid C identifier and breaks compilation of the generated header for any multi-dot input filename.","fix":"Disallow `.` from the first capture group so multi-dot filenames are correctly rejected instead of producing an invalid identifier:\n\n```python\nr = re.compile(\"^([a-zA-Z_][a-zA-Z_0-9]*)\\.([a-zA-Z_0-9]+)$\")\n```\n\nWith this change, `my.icon.png` no longer matches and is reported as `Skipped file (unsuitable filename): my.icon.png`, instead of silently generating `my.icon_png_data`, which fails to compile.","locations":[{"ref":"misc/scripts/bin2c.py:17-25","code":"   17 | r = re.compile(\"^([a-zA-Z._][a-zA-Z._0-9]*)[.]([a-zA-Z_0-9]+)$\")\n   18 | for path in sys.argv[1:]:\n   19 |         filename = os.path.basename(path).replace('-','_')\n   20 |         m = r.match(filename)\n   21 | \n   22 |         # Allow only filenames that make sense as C variable names\n   23 |         if not(m):\n   24 |                 print(\"Skipped file (unsuitable filename): \" + filename)\n   25 |                 continue","lines":9,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/misc/scripts/bin2c.py#L17-L25"},{"ref":"misc/scripts/bin2c.py:32-34","code":"   32 |         text = \"/* %s - %d bytes */\\n\" \\\n   33 |                \"static const unsigned char %s_%s_data[] = {\\n\" % (\n   34 |                     filename, count, m.group(1), m.group(2))","lines":3,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/misc/scripts/bin2c.py#L32-L34"}]},
{"id":"LOGIC_47","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `DrawButton`, `bmpSize` is captured from the un-rotated bitmap at line 303, but for `TopToBottom`/`BottomToTop` the bitmap may be rotated 90 degrees (when `wxAUI_TB_ROTATE_ICON_WITH_TEXT` is set), swapping its drawn width/height. The horizontal centering `bmpX = rect.x + (rect.width - bmpSize.x)/2` uses the original width `bmpSize.x`, while the text offset `textY = bmpY + bmpSize.x + wnd->FromDIP(3)` also uses `bmpSize.x` as the drawn height. For a non-square icon only one of these can be correct: with rotation the drawn width is `bmpSize.y` (so `bmpX` is off), without rotation the drawn height is `bmpSize.y` (so `textY` is off). Icons are misplaced whenever they are non-square.","fix":"Compute the effective drawn size after any rotation (e.g. `wxSize drawnSize = bmp.IsOk() ? bmp.GetLogicalSize() : wxSize(0,0);` recomputed after the `Rotate90` call) and use `drawnSize.x` for horizontal centering and `drawnSize.y` for the vertical text offset instead of reusing the pre-rotation `bmpSize.x` for both.","locations":[{"ref":"src/aui/auibar.cpp:336-358","code":"  336 |         case wxAuiTextDirection::TopToBottom:\n  337 |             if ( bmp.IsOk() && (m_flags & wxAUI_TB_ROTATE_ICON_WITH_TEXT) )\n  338 |                 bmp = wxBitmap(bmp.ConvertToImage().Rotate90(true), -1, bmp.GetScaleFactor());\n  339 | \n  340 |             bmpX = rect.x + (rect.width - bmpSize.x) / 2;\n  341 |             bmpY = rect.y + wnd->FromDIP(3);\n  342 | \n  343 |             textAngle = -90.0;\n  344 |             textX = rect.x + (rect.width + textHeight) / 2;\n  345 |             textY = bmpY + bmpSize.x + wnd->FromDIP(3);\n  346 |             break;\n  347 | \n  348 |         case wxAuiTextDirection::BottomToTop:\n  349 |             if ( bmp.IsOk() && (m_flags & wxAUI_TB_ROTATE_ICON_WITH_TEXT) )\n  350 |                 bmp = wxBitmap(bmp.ConvertToImage().Rotate90(false), -1, bmp.GetScaleFactor());\n  351 | \n  352 |             bmpX = rect.x + (rect.width - bmpSize.x) / 2;\n  353 |             bmpY = rect.y + rect.height - bmpSize.y - wnd->FromDIP(3);\n  354 | \n  355 |             textAngle = 90.0;\n  356 |             textX = rect.x + (rect.width - textHeight) / 2;\n  357 |             textY = bmpY - wnd->FromDIP(3);\n  358 |             break;","lines":23,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/aui/auibar.cpp#L336-L358"}]},
{"id":"LOGIC_48","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`SetWindowStyleFlag()` updates gripper/overflow visibility and text orientation from the new `style`, but it never recomputes `m_orientation` from `GetOrientation(style)` (it only calls `GetOrientation(style)` to trigger the assert and discards the result). `SetArtFlags()` is then called and derives the art orientation flag from the stale `m_orientation`, so changing the orientation-lock bits (`wxAUI_TB_HORIZONTAL`/`wxAUI_TB_VERTICAL`) via this setter has no effect until `SetOrientation()` or `OnIdle` runs. `Create()`, by contrast, does set `m_orientation` from `GetOrientation(style)`.","fix":"After `wxControl::SetWindowStyleFlag(style)`, recompute the orientation when it is locked, e.g. `const wxOrientation o = GetOrientation(style); if (o != wxBOTH) m_orientation = o;` before calling `SetArtFlags()`, and consider calling `Realize()` so the change takes effect immediately.","locations":[{"ref":"src/aui/auibar.cpp:987-1024","code":"  987 | void wxAuiToolBar::SetWindowStyleFlag(long style)\n  988 | {\n  989 |     GetOrientation(style);      // assert if style is invalid\n  990 |     wxCHECK_RET(IsPaneValid(style),\n  991 |                 \"window settings and pane settings are incompatible\");\n  992 | \n  993 |     const auto oldBgStyle = m_windowStyle & wxAUI_TB_PLAIN_BACKGROUND;\n  994 | \n  995 |     wxControl::SetWindowStyleFlag(style);\n  996 | \n  997 |     if (m_art)\n  998 |     {\n  999 |         SetArtFlags();\n 1000 |     }\n 1001 | \n 1002 |     if (m_windowStyle & wxAUI_TB_GRIPPER)\n 1003 |         m_gripperVisible = true;\n 1004 |     else\n 1005 |         m_gripperVisible = false;\n 1006 | \n 1007 | \n 1008 |     if (m_windowStyle & wxAUI_TB_OVERFLOW)\n 1009 |         m_overflowVisible = true;\n 1010 |     else\n 1011 |         m_overflowVisible = false;\n 1012 | \n 1013 |     if (style & wxAUI_TB_HORZ_LAYOUT)\n 1014 |         SetToolTextOrientation(wxAUI_TBTOOL_TEXT_RIGHT);\n 1015 |     else\n 1016 |         SetToolTextOrientation(wxAUI_TBTOOL_TEXT_BOTTOM);\n 1017 | \n 1018 |     wxControl::SetWindowStyleFlag(style);\n 1019 | \n 1020 |     const auto newBgStyle = m_windowStyle & wxAUI_TB_PLAIN_BACKGROUND;\n 1021 | \n 1022 |     if ( newBgStyle != oldBgStyle )\n 1023 |         UpdateBackgroundBitmap(GetClientSize());\n 1024 | }","lines":38,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/aui/auibar.cpp#L987-L1024"}]},
{"id":"LOGIC_49","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `wxAuiTabContainer::Render()`, after the drawing loop `for (i = m_tabOffset; i < page_count; ++i)` may `break` early (line 962) when a tab would be completely off-screen, leaving `i` pointing at the first non-drawn tab. The cleanup loop then starts with `for (++i; ...)`, which skips index `i` itself. That first off-screen tab has just had `UpdateButtonsState(page)` called on it (line 954) which can mark its per-page buttons (e.g. Close/Pin on an active tab) as shown, but since the tab is never drawn its `button.rect` is stale, and its buttons are never hidden. `ButtonHitTest()` can then match a stale, non-hidden button rectangle for a tab that isn't visible.","fix":"Start the cleanup loop at the current index instead of skipping it: change `for (++i; i < m_pages.GetCount(); ++i)` to `for (; i < m_pages.GetCount(); ++i)` so the first off-screen tab's buttons are also hidden.","locations":[{"ref":"src/aui/auibook.cpp:992-997","code":"  992 |     // make sure to deactivate buttons which are off the screen to the right\n  993 |     for (++i; i < m_pages.GetCount(); ++i)\n  994 |     {\n  995 |         for (auto& button : m_pages[i].buttons)\n  996 |             button.curState |= wxAUI_BUTTON_STATE_HIDDEN;\n  997 |     }","lines":6,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/aui/auibook.cpp#L992-L997"},{"ref":"src/aui/auibook.cpp:956-969","code":"  956 |     for (i = m_tabOffset; i < page_count; ++i)\n  957 |     {\n  958 |         wxAuiNotebookPage& page = m_pages.Item(i);\n  959 | \n  960 |         UpdateButtonsState(page);\n  961 | \n  962 |         // Check if this tab is at least partially visible when using a single\n  963 |         // row (otherwise all rows are visible).\n  964 |         if (!IsFlagSet(wxAUI_NB_MULTILINE) && offset >= rightBorder)\n  965 |         {\n  966 |             // This (and, hence, all the subsequent) tab(s) would be completely\n  967 |             // hidden, stop drawing.\n  968 |             break;\n  969 |         }","lines":14,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/aui/auibook.cpp#L956-L969"}]},
{"id":"LOGIC_50","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `wxAuiManager::DoEndResizeAction()`, when accumulating the space used by docks to compute `available_width`/`available_height`, the sash size of every resizable dock is unconditionally added to `used_width` via `if (dock.resizable) used_width += sashSize;`. A resizable TOP/BOTTOM dock has a horizontal sash that consumes vertical space, so its sash should be added to `used_height`, not `used_width`. As written, horizontal resize is over-constrained (available_width too small) and vertical resize is under-constrained (available_height never accounts for any sash) whenever both top/bottom and left/right resizable docks are present.","fix":"Distribute the sash size to the dimension the dock actually spans:\n```\nif (dock.resizable)\n{\n    if (dock.dock_direction == wxAUI_DOCK_TOP ||\n        dock.dock_direction == wxAUI_DOCK_BOTTOM)\n        used_height += sashSize;\n    else\n        used_width += sashSize;\n}\n```\ninstead of `if (dock.resizable) used_width += sashSize;`.","locations":[{"ref":"src/aui/framemanager.cpp:5089-5103","code":" 5089 |         for ( const auto& dock : m_docks )\n 5090 |         {\n 5091 |             if (dock.dock_direction == wxAUI_DOCK_TOP ||\n 5092 |                 dock.dock_direction == wxAUI_DOCK_BOTTOM)\n 5093 |             {\n 5094 |                 used_height += dock.size;\n 5095 |             }\n 5096 |             if (dock.dock_direction == wxAUI_DOCK_LEFT ||\n 5097 |                 dock.dock_direction == wxAUI_DOCK_RIGHT)\n 5098 |             {\n 5099 |                 used_width += dock.size;\n 5100 |             }\n 5101 |             if (dock.resizable)\n 5102 |                 used_width += sashSize;\n 5103 |         }","lines":15,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/aui/framemanager.cpp#L5089-L5103"}]},
{"id":"LOGIC_51","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`wxBookCtrlBase::GetNextPage()` computes the wrapped index as `nSel == 0 ? nMax : nSel - 1` for the backward case. When the control has pages but no current selection (`GetSelection()` returns `wxNOT_FOUND` == -1), the backward branch yields `nSel - 1 == -2`, an invalid page index that is not `wxNOT_FOUND`. Callers (e.g. handling Ctrl+Shift+Tab) will then call `SetSelection(-2)` which fails its bounds check. The forward branch is also affected but happens to produce 0.","fix":"Handle the no-selection case explicitly before wrapping, e.g. treat `nSel == wxNOT_FOUND` as selecting the first (forward) or last (backward) page: after `int nSel = GetSelection();` add `if ( nSel == wxNOT_FOUND ) { nPage = forward ? 0 : nMax; } else { nPage = forward ? ... }`.","locations":[{"ref":"src/common/bookctrl.cpp:436-443","code":"  436 |         int nSel = GetSelection();\n  437 | \n  438 |         // change selection wrapping if it becomes invalid\n  439 |         nPage = forward ? nSel == nMax ? 0\n  440 |                                        : nSel + 1\n  441 |                         : nSel == 0 ? nMax\n  442 |                                     : nSel - 1;\n  443 |     }","lines":8,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/bookctrl.cpp#L436-L443"}]},
{"id":"LOGIC_52","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"On macOS, when `wxCmdLineParser::Parse()` encounters one of the Apple-injected options (`-ApplePersistenceIgnoreState`, `-AppleTextDirection`, `-AppleLocale`, `-AppleLanguages`), it sets `maybeOption = false` and then `continue`s. Setting `maybeOption = false` permanently disables option parsing for all remaining arguments (this is the same flag used to implement the `--` POSIX separator). Any genuine option appearing after an Apple option is therefore misinterpreted as a positional parameter. The `n++` correctly skips the Apple option's value; the `maybeOption = false` assignment appears to be an unintended copy from the `--` handling above.","fix":"Do not clear `maybeOption` for the Apple options; only skip the option and its value:\n```cpp\nif ( arg == wxS(\"-ApplePersistenceIgnoreState\") || ... )\n{\n    n++;        // skip the following value\n    continue;\n}\n```","locations":[{"ref":"src/common/cmdline.cpp:821-832","code":"  821 | #ifdef __WXOSX__\n  822 |         if ( arg == wxS(\"-ApplePersistenceIgnoreState\") ||\n  823 |              arg == wxS(\"-AppleTextDirection\") ||\n  824 |              arg == wxS(\"-AppleLocale\") ||\n  825 |              arg == wxS(\"-AppleLanguages\") )\n  826 |         {\n  827 |             maybeOption = false;\n  828 |             n++;\n  829 | \n  830 |             continue;\n  831 |         }\n  832 | #endif","lines":12,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/cmdline.cpp#L821-L832"}]},
{"id":"LOGIC_53","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"The integer-overflow guard in `wxConfigBase::Read(const wxString&, int*)` and `wxConfigBase::Read(const wxString&, int*, int)` uses `wxASSERT_MSG( l < INT_MAX, ... )`. This is a wrong boundary check in two ways: (1) it fires a false assertion when the stored value is exactly `INT_MAX` (since `INT_MAX < INT_MAX` is false) even though that value fits perfectly in an `int`; (2) it never detects negative overflow, so on LP64 platforms a stored `long` below `INT_MIN` is silently truncated by `(int)l` without any warning.","fix":"Check both bounds inclusively. Replace both occurrences of\n```\n    wxASSERT_MSG( l < INT_MAX, wxT(\"int overflow in wxConfig::Read\") );\n```\nwith\n```\n    wxASSERT_MSG( l >= INT_MIN && l <= INT_MAX, wxT(\"int overflow in wxConfig::Read\") );\n```","locations":[{"ref":"src/common/config.cpp:162-178","code":"  162 | bool wxConfigBase::Read(const wxString& key, int *pi) const\n  163 | {\n  164 |     long l = *pi;\n  165 |     bool r = Read(key, &l);\n  166 |     wxASSERT_MSG( l < INT_MAX, wxT(\"int overflow in wxConfig::Read\") );\n  167 |     *pi = (int)l;\n  168 |     return r;\n  169 | }\n  170 | \n  171 | bool wxConfigBase::Read(const wxString& key, int *pi, int defVal) const\n  172 | {\n  173 |     long l = *pi;\n  174 |     bool r = Read(key, &l, defVal);\n  175 |     wxASSERT_MSG( l < INT_MAX, wxT(\"int overflow in wxConfig::Read\") );\n  176 |     *pi = (int)l;\n  177 |     return r;\n  178 | }","lines":17,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/config.cpp#L162-L178"}]},
{"id":"LOGIC_54","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"hard","description":"`GetWeekOfYear()` computes the US (Sunday-first) week number as `week = (nDayInYear - wdTarget + 7) / 7;` with an ad-hoc `+1` correction only when `wdYearStart == Wed || wdYearStart == Thu`. The code itself carries a `// FIXME: First week is not calculated correctly.` comment, and the formula does not correctly handle the partial first week for all Jan-1 weekdays, returning an off-by-one week number in those cases.","fix":"Replace the heuristic with a proper computation of the week number based on the offset of Jan 1 from the start of the week (mirroring the well-tested `Monday_First` branch below it) so the first partial week is counted consistently for every possible Jan-1 weekday.","locations":[{"ref":"src/common/datetime.cpp:1952-1959","code":" 1952 |     int week;\n 1953 |     if ( flags == Sunday_First )\n 1954 |     {\n 1955 |         // FIXME: First week is not calculated correctly.\n 1956 |         week = (nDayInYear - wdTarget + 7) / 7;\n 1957 |         if ( wdYearStart == Wed || wdYearStart == Thu )\n 1958 |             week++;\n 1959 |     }","lines":8,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/datetime.cpp#L1952-L1959"}]},
{"id":"LOGIC_55","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In the non-`wxHAS_STRFTIME` fallback for the `%p` (AM/PM) specifier in `wxDateTime::Format`, the test `(tmTimeOnly.tm_hour > 12)` classifies 12:00 (noon) as `\"am\"`. Noon should be PM. Only hours strictly greater than 12 are treated as PM, so `tm_hour == 12` is mislabeled.","fix":"Use `>= 12` so noon is PM:\n```cpp\nres += (tmTimeOnly.tm_hour >= 12) ? wxT(\"pm\") : wxT(\"am\");\n```\ninstead of\n```cpp\nres += (tmTimeOnly.tm_hour > 12) ? wxT(\"pm\") : wxT(\"am\");\n```","locations":[{"ref":"src/common/datetimefmt.cpp:637-639","code":"  637 | #else // !wxHAS_STRFTIME\n  638 |                     res += (tmTimeOnly.tm_hour > 12) ? wxT(\"pm\") : wxT(\"am\");\n  639 | #endif // wxHAS_STRFTIME/!wxHAS_STRFTIME","lines":3,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/datetimefmt.cpp#L637-L639"}]},
{"id":"LOGIC_56","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `wxGCDCImpl::DoStretchBlit`, after clipping the source rectangle with `subrect.Intersect(clip)`, only `subrect.width == 0` is tested for early return, but `subrect.height` is not checked. If the intersection yields a rectangle with positive width but zero height (e.g. `ysrc` lands exactly on the source's bottom edge), a zero-height `subrect` is passed to `source->GetAsBitmap(&subrect)`, typically producing an invalid bitmap and triggering the `wxFAIL_MSG(\"Cannot Blit...\")` failure path and returning `false` unnecessarily.","fix":"Also bail out when the clipped height collapses to zero:\n```cpp\nsubrect.Intersect(clip);\nif (subrect.width == 0 || subrect.height == 0)\n    return true;\n```","locations":[{"ref":"src/common/dcgraph.cpp:1083-1085","code":" 1083 |     subrect.Intersect(clip);\n 1084 |     if (subrect.width == 0)\n 1085 |         return true;","lines":3,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/dcgraph.cpp#L1083-L1085"}]},
{"id":"LOGIC_57","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`RemoveTrailingSeparatorsFromPath()` (Windows only) is intended to keep a single trailing separator for paths that would otherwise collapse to nothing (the comment explicitly lists \"turning `\\` into nothing\" as a case to avoid). But for an input consisting entirely of separators, e.g. `\\` or `/`, `find_last_not_of` returns `npos`, so `firstTrailingSeparator` becomes `0`; then `find_last_of(R\"(\\/)\", lastNonSeparator)` with `lastNonSeparator == npos` scans the whole string and returns `0` (not `npos`), so none of the three guard conditions match and control reaches `strPath.erase(firstTrailingSeparator)` i.e. `erase(0)`, which empties the string. The subsequent `GetFileAttributes(\"\")` then fails, so `wxFileName::DirExists(\"\\\")` / `DirExists(\"/\")` erroneously returns false for the drive-root path.","fix":"Handle the all-separators case explicitly, e.g. after computing `lastNonSeparator`, if it is `wxString::npos` keep just the first separator and return (`strPath.erase(1); return;`), instead of falling through to the general `strPath.erase(firstTrailingSeparator)` logic.","locations":[{"ref":"src/common/filename.cpp:625-654","code":"  625 |     const auto lastNonSeparator = strPath.find_last_not_of(R\"(\\/)\");\n  626 | \n  627 |     const auto firstTrailingSeparator =\n  628 |         lastNonSeparator == wxString::npos ? 0 : lastNonSeparator + 1;\n  629 | \n  630 |     if ( firstTrailingSeparator == strPath.length() )\n  631 |     {\n  632 |         // The path doesn't end with a separator, nothing to do.\n  633 |         return;\n  634 |     }\n  635 | \n  636 |     // Check if there any separators would remain if we removed all trailing\n  637 |     // ones, ignoring those that are part of fixed wxMSW_EXTENDED_PATH_PREFIX\n  638 |     // or UNC path prefix.\n  639 |     const auto lastButOneSeparator =\n  640 |         strPath.find_last_of(R\"(\\/)\", lastNonSeparator);\n  641 |     if ( lastButOneSeparator == wxString::npos ||\n  642 |             (lastButOneSeparator == wxMSW_EXTENDED_PATH_PREFIX_LEN - 1 &&\n  643 |              strPath.StartsWith(wxMSW_EXTENDED_PATH_PREFIX)) ||\n  644 |                 (lastButOneSeparator == 1 && IsUNCPath(strPath)) )\n  645 |     {\n  646 |         // The path doesn't contain any other separators, so don't remove all\n  647 |         // of them.\n  648 |         strPath.erase(firstTrailingSeparator + 1);\n  649 |         return;\n  650 |     }\n  651 | \n  652 |     // Remove all trailing separators.\n  653 |     strPath.erase(firstTrailingSeparator);\n  654 | }","lines":30,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/filename.cpp#L625-L654"}]},
{"id":"LOGIC_58","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `wxFontMapperBase::NonInteractiveCharsetToEncoding()` the code that is supposed to \"discard the optional quotes\" only removes the trailing quote and keeps the leading one. `wxString(cs.c_str(), cs.length() - 1)` builds a string from the first `length-1` characters, i.e. it drops the last char (the closing quote) but leaves `cs[0]` (the opening quote) in place. A quoted charset such as `\"UTF-8\"` becomes `\"UTF-8` (leading `\"` retained), so it fails to match any entry in `gs_encodingNames` and the charset is not recognized.","fix":"Strip both quotes by skipping the first character too:\n```cpp\nif ( cs[0u] == wxT('\"') && cs.Last() == wxT('\"') )\n{\n    cs = wxString(cs.c_str() + 1, cs.length() - 2);\n}\n```","locations":[{"ref":"src/common/fmapbase.cpp:626-632","code":"  626 |         if ( !cs.empty() )\n  627 |         {\n  628 |             if ( cs[0u] == wxT('\"') && cs.Last() == wxT('\"') )\n  629 |             {\n  630 |                 cs = wxString(cs.c_str(), cs.length() - 1);\n  631 |             }\n  632 |         }","lines":7,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/fmapbase.cpp#L626-L632"}]},
{"id":"LOGIC_59","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `wxBMPHandler::LoadDib`, every other multi-byte field read into `dbuf` is passed through `wxINT32_SWAP_ON_BE`, but the resolution fields are not: `res.Init(dbuf[2]/100, dbuf[3]/100);` uses the raw little-endian bytes. On a big-endian platform the stored horizontal/vertical resolution is byte-swapped and therefore wrong.","fix":"```cpp\n// before\nres.Init(dbuf[2]/100, dbuf[3]/100);\n// after\nres.Init(wxINT32_SWAP_ON_BE(dbuf[2])/100, wxINT32_SWAP_ON_BE(dbuf[3])/100);\n```","locations":[{"ref":"src/common/imagbmp.cpp:1194","code":" 1194 |         res.Init(dbuf[2]/100, dbuf[3]/100);","lines":1,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/imagbmp.cpp#L1194"}]},
{"id":"LOGIC_60","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `wxQuantize::Quantize`, `paletteShift` is set to `windowsSystemColourCount` (20) whenever `wxQUANTIZE_INCLUDE_WINDOWS_COLOURS` is passed, regardless of platform, but both the clamping of `desiredNoColours` to `256 - windowsSystemColourCount` and the code that actually fills palette entries `[0,20)` with the system colours are guarded by `#ifdef __WXMSW__`. On non-MSW platforms with this flag set, the palette-fill loop `r[i+paletteShift]=...` starts writing at index 20, so entries `r/g/b[0..19]` are left uninitialized (they come from `new unsigned char[256]`), producing garbage palette colours. Worse, because `desiredNoColours` is not clamped off-MSW, if `desiredNoColours > 236` then `r[i+paletteShift]` writes past the end of the 256-byte `r`/`g`/`b` buffers (heap out-of-bounds write). The `data8bit[i] += paletteShift` shift is also MSW-only, so index/palette mapping becomes inconsistent off-MSW.","fix":"Either guard the entire `wxQUANTIZE_INCLUDE_WINDOWS_COLOURS` handling (including `paletteShift`) behind `__WXMSW__`, or clamp `desiredNoColours` to `256 - windowsSystemColourCount` and zero-initialize / fill the first `paletteShift` palette entries on all platforms when the flag is used. Apply the same `#ifdef __WXMSW__` condition to the `paletteShift` assignment as is used for the clamping and the system-colour fill.","locations":[{"ref":"src/common/quantize.cpp:1480-1491","code":" 1480 |     int paletteShift = 0;\n 1481 | \n 1482 |     // Shift the palette up by the number of Windows system colours,\n 1483 |     // if necessary\n 1484 |     if (flags & wxQUANTIZE_INCLUDE_WINDOWS_COLOURS)\n 1485 |         paletteShift = windowsSystemColourCount;\n 1486 | \n 1487 |     // Make room for the Windows system colours\n 1488 | #ifdef __WXMSW__\n 1489 |     if ((flags & wxQUANTIZE_INCLUDE_WINDOWS_COLOURS) && (desiredNoColours > (256 - windowsSystemColourCount)))\n 1490 |         desiredNoColours = 256 - windowsSystemColourCount;\n 1491 | #endif","lines":12,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/quantize.cpp#L1480-L1491"},{"ref":"src/common/quantize.cpp:1556-1593","code":" 1556 | #ifdef __WXMSW__\n 1557 |         // Fill the first 20 entries with Windows system colours\n 1558 |         if (flags & wxQUANTIZE_INCLUDE_WINDOWS_COLOURS)\n 1559 |         {\n 1560 |             HDC hDC = ::GetDC(nullptr);\n 1561 |             PALETTEENTRY* entries = new PALETTEENTRY[windowsSystemColourCount];\n 1562 |             ::GetSystemPaletteEntries(hDC, 0, windowsSystemColourCount, entries);\n 1563 |             ::ReleaseDC(nullptr, hDC);\n 1564 | \n 1565 |             for (i = 0; i < windowsSystemColourCount; i++)\n 1566 |             {\n 1567 |                 r[i] = entries[i].peRed;\n 1568 |                 g[i] = entries[i].peGreen;\n 1569 |                 b[i] = entries[i].peBlue;\n 1570 |             }\n 1571 |             delete[] entries;\n 1572 |         }\n 1573 | #endif\n 1574 | \n 1575 |         for (i = 0; i < desiredNoColours; i++)\n 1576 |         {\n 1577 |             r[i+paletteShift] = palette[i*3 + 0];\n 1578 |             g[i+paletteShift] = palette[i*3 + 1];\n 1579 |             b[i+paletteShift] = palette[i*3 + 2];\n 1580 |         }\n 1581 | \n 1582 |         // Blank out any remaining palette entries\n 1583 |         for (i = desiredNoColours+paletteShift; i < 256; i++)\n 1584 |         {\n 1585 |             r[i] = 0;\n 1586 |             g[i] = 0;\n 1587 |             b[i] = 0;\n 1588 |         }\n 1589 |         *pPalette = new wxPalette(256, r, g, b);\n 1590 |         delete[] r;\n 1591 |         delete[] g;\n 1592 |         delete[] b;\n 1593 |     }","lines":38,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/quantize.cpp#L1556-L1593"}]},
{"id":"LOGIC_61","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`wxRendererNative::Set()` installs a renderer via `renderer.release()` + `renderer.reset(rendererNew)` but never marks the `wxRendererPtr` as initialized (`m_initialized` is only set inside `wxRendererPtr::IsOk()`). If `Set()` is called before any `Get()`/`IsOk()` (i.e. before the singleton was lazily initialized), the next `Get()` call sees `m_initialized == false`, runs `DoInit()`, and calls `reset(traits->CreateRenderer())`, which deletes the just-installed `rendererNew` and silently replaces it with the default renderer. The user's custom renderer set via `Set()` is thus lost.","fix":"Force initialization before mutating the pointer, so the lazy `DoInit()` cannot later clobber the installed renderer, e.g. call `renderer.IsOk();` at the start of `Set()` (before `release()`), or expose a small method on `wxRendererPtr` that sets `m_initialized = true` and call it from `Set()`.","locations":[{"ref":"src/common/rendcmn.cpp:143-153","code":"  143 | /* static */\n  144 | wxRendererNative *wxRendererNative::Set(wxRendererNative *rendererNew)\n  145 | {\n  146 |     wxRendererPtr& renderer = wxRendererPtr::Get();\n  147 | \n  148 |     wxRendererNative *rendererOld = renderer.release();\n  149 | \n  150 |     renderer.reset(rendererNew);\n  151 | \n  152 |     return rendererOld;\n  153 | }","lines":11,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/rendcmn.cpp#L143-L153"}]},
{"id":"LOGIC_62","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `wxStringOutputStream::OnSysWrite()`, when a previous call left an incomplete multibyte sequence in `m_unconv`, the successful conversion consumes `srcLen` bytes (`= m_unconv.GetDataLen()`, which includes the previously buffered bytes plus the current `size`), but `m_pos` is advanced only by `size` (`m_pos += size;`). The earlier failed call returned `size` to the caller without advancing `m_pos`, so those buffered bytes are never counted. Consequently `OnSysTell()` (and thus the reported stream position/length) under-reports by the number of bytes that had been buffered across a multibyte-character split, even though `m_str` contains the full correct data.","fix":"Advance `m_pos` by the number of source bytes actually consumed by the successful conversion rather than only the current call's `size`. On the success branch use `m_pos += srcLen;` (which equals `size` in the common no-buffered-data case) instead of `m_pos += size;`.","locations":[{"ref":"src/common/sstream.cpp:186-213","code":"  186 |     size_t wlen;\n  187 |     wxWCharBuffer wbuf(m_conv.cMB2WC(src, srcLen, &wlen));\n  188 |     if ( wbuf )\n  189 |     {\n  190 |         // conversion succeeded, clear the unconverted buffer\n  191 |         m_unconv = wxMemoryBuffer(0);\n  192 | \n  193 |         m_str->append(wbuf, wlen);\n  194 |     }\n  195 |     else // conversion failed\n  196 |     {\n  197 |         // remember unconverted data if there had been none before (otherwise\n  198 |         // we've already got it in the buffer)\n  199 |         if ( src == p )\n  200 |             m_unconv.AppendData(src, srcLen);\n  201 | \n  202 |         // pretend that we wrote the data anyhow, otherwise the caller would\n  203 |         // believe there was an error and this might not be the case, but do\n  204 |         // not update m_pos as m_str hasn't changed\n  205 |         return size;\n  206 |     }\n  207 | \n  208 |     // update position\n  209 |     m_pos += size;\n  210 | \n  211 |     // return number of bytes actually written\n  212 |     return size;\n  213 | }","lines":28,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/sstream.cpp#L186-L213"}]},
{"id":"LOGIC_63","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `wxStreamBuffer::Truncate()` the `realloc()` result is stored in `new_start`, but the following `wxCHECK_RET` tests `new_size` (which was already proven non-zero by the `if ( !new_size )` early-return above) instead of `new_start`. The failure check is therefore dead and always passes. If `realloc()` returns `nullptr` (permitted even when shrinking), `m_buffer_start` is set to `nullptr`, `m_buffer_end` becomes `nullptr + new_size` (garbage) and the original allocation is leaked, leading to later corruption/crash.","fix":"Check the pointer, not the size:\n```cpp\nchar *new_start = (char *)realloc(m_buffer_start, new_size);\nwxCHECK_RET( new_start, wxT(\"shrinking buffer shouldn't fail\") );\n```\ni.e. replace `wxCHECK_RET( new_size, ... )` with `wxCHECK_RET( new_start, ... )`.","locations":[{"ref":"src/common/stream.cpp:201-206","code":"  201 |     char *new_start = (char *)realloc(m_buffer_start, new_size);\n  202 |     wxCHECK_RET( new_size, wxT(\"shrinking buffer shouldn't fail\") );\n  203 | \n  204 |     m_buffer_start = new_start;\n  205 |     m_buffer_end = m_buffer_start + new_size;\n  206 |     m_buffer_pos = m_buffer_end;","lines":6,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/stream.cpp#L201-L206"}]},
{"id":"LOGIC_64","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `wxTextAttr::EqPartial()` the bullet-text comparison uses `&&` between the text and font checks: `if (HasBulletText() && attr.HasBulletText() && (GetBulletText() != attr.GetBulletText()) && (GetBulletFont() != attr.GetBulletFont())) return false;`. This means the attributes are only considered non-equal when BOTH the bullet text AND the bullet font differ; if only the bullet text differs (fonts equal) the method wrongly reports partial equality. Every other attribute in this function returns false as soon as that single attribute differs, and `operator==` compares bullet text alone, so the `&&` linking two independent differences looks like a mis-edited condition (should be `||`).","fix":"Treat differing bullet text (or font) as a mismatch, e.g. change the joining operator to `||`: `... && ((GetBulletText() != attr.GetBulletText()) || (GetBulletFont() != attr.GetBulletFont())) )` , after confirming the intended semantics of bullet-text/font equality.","locations":[{"ref":"src/common/textcmn.cpp:383-386","code":"  383 |     if (HasBulletText() && attr.HasBulletText() &&\n  384 |         (GetBulletText() != attr.GetBulletText()) &&\n  385 |         (GetBulletFont() != attr.GetBulletFont()))\n  386 |          return false;","lines":4,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/textcmn.cpp#L383-L386"}]},
{"id":"LOGIC_65","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`wxPluralFormsCalculator::evaluate()` clamps the computed plural index with `if (number < 0 || number > m_nplurals) return 0;`. Since `m_nplurals` is the number of plural forms, valid msgstr indices are `0 .. m_nplurals-1`, so the upper bound check is off by one: a (buggy) plural formula returning exactly `m_nplurals` is accepted and returned as an index one past the last valid form. It should be `number >= m_nplurals`.","fix":"Use `>=` for the upper bound: `if (number < 0 || number >= m_nplurals) return 0;` so returned indices are always within `[0, m_nplurals)`.","locations":[{"ref":"src/common/translation.cpp:445-457","code":"  445 | int wxPluralFormsCalculator::evaluate(int n) const\n  446 | {\n  447 |     if (m_plural.get() == nullptr)\n  448 |     {\n  449 |         return 0;\n  450 |     }\n  451 |     wxPluralFormsToken::Number number = m_plural->evaluate(n);\n  452 |     if (number < 0 || number > m_nplurals)\n  453 |     {\n  454 |         return 0;\n  455 |     }\n  456 |     return number;\n  457 | }","lines":13,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/translation.cpp#L445-L457"}]},
{"id":"LOGIC_66","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In the generic `wxDoLaunchDefaultBrowser` fallback, the URL is appended to the command only when the `BROWSER` environment variable is *not* found or empty: `if ( !wxGetEnv(wxT(\"BROWSER\"), &cmd) || cmd.empty() ) cmd << wxT(' ') << params.url;`. When `BROWSER` is set (e.g. to `firefox`), `wxGetEnv` overwrites `cmd` with the browser command and the URL is never appended, so the browser is launched without the URL. When `BROWSER` is unset, `cmd` becomes just ` <url>` (a leading space, no program). The URL append is on the wrong side of the condition.","fix":"Set `cmd` from `BROWSER` (or a default) and then append the URL unconditionally, e.g.:\n```cpp\nif ( !wxGetEnv(wxT(\"BROWSER\"), &cmd) )\n    cmd.clear();\ncmd << wxT(' ') << params.url;\n```","locations":[{"ref":"src/common/utilscmn.cpp:1098-1105","code":" 1098 |     if ( !ok || cmd.empty() )\n 1099 |     {\n 1100 |         // fallback to checking for the BROWSER environment variable\n 1101 |         if ( !wxGetEnv(wxT(\"BROWSER\"), &cmd) || cmd.empty() )\n 1102 |             cmd << wxT(' ') << params.url;\n 1103 |     }\n 1104 | \n 1105 |     ok = ( !cmd.empty() && wxExecute(cmd) );","lines":8,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/utilscmn.cpp#L1098-L1105"}]},
{"id":"LOGIC_67","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`ClientHandler::m_browserId` is declared without an initializer and is only assigned in `OnAfterCreated()`. It is read in `OnBeforeClose()` via `browser->GetIdentifier() == m_browserId`. If `OnBeforeClose()` were ever invoked without a prior `OnAfterCreated()` (e.g. browser fails after client creation), this reads an uninitialized value (undefined behavior). Initializing it removes the latent UB.","fix":"Before:\n```cpp\n    int m_browserId;\n```\nAfter:\n```cpp\n    int m_browserId = 0;\n```","locations":[{"ref":"src/common/webview_chromium.cpp:515","code":"  515 |     int m_browserId;","lines":1,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/webview_chromium.cpp#L515"}]},
{"id":"LOGIC_68","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `wxWebViewChromium::LoadHistoryItem()`, `pos` is set to a valid index in `[0, size)` when the item is found and left as `-1` when not found. The sanity assertion `wxASSERT_MSG(pos != wxSsize(m_historyList), \"invalid history item\")` can never fire because `pos` is never equal to the list size; the intended check is that the item was actually found (`pos != -1`). The assertion is therefore dead and does not catch the invalid case, which then silently stores `m_historyPosition = -1`.","fix":"Before:\n```cpp\n    wxASSERT_MSG(pos != wxSsize(m_historyList), \"invalid history item\");\n```\nAfter:\n```cpp\n    wxASSERT_MSG(pos != -1, \"invalid history item\");\n```","locations":[{"ref":"src/common/webview_chromium.cpp:1258-1268","code":" 1258 |     int pos = -1;\n 1259 |     for ( unsigned int i = 0; i < m_historyList.size(); i++ )\n 1260 |     {\n 1261 |         //We compare the actual pointers to find the correct item\n 1262 |         if(m_historyList[i].get() == item.get())\n 1263 |             pos = i;\n 1264 |     }\n 1265 |     wxASSERT_MSG(pos != wxSsize(m_historyList), \"invalid history item\");\n 1266 |     m_historyLoadingFromList = true;\n 1267 |     LoadURL(item->GetUrl());\n 1268 |     m_historyPosition = pos;","lines":11,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/webview_chromium.cpp#L1258-L1268"}]},
{"id":"LOGIC_69","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`wxStringReadValue(const wxString&, bool&)` reads into the local `intdata` with `wxSscanf` but never initializes it and never checks the `wxSscanf` return value; if the string does not contain a parseable integer, `intdata` is read while uninitialized, giving a nondeterministic `bool` result.","fix":"Initialize and check the result:\n```\ntemplate<> void wxStringReadValue(const wxString &s, bool &data )\n{\n    int intdata = 0;\n    if ( wxSscanf(s, wxT(\"%d\"), &intdata) != 1 )\n        intdata = 0;\n    data = (intdata != 0);\n}\n```","locations":[{"ref":"src/common/xti.cpp:111-116","code":"  111 | template<> void wxStringReadValue(const wxString &s, bool &data )\n  112 | {\n  113 |     int intdata;\n  114 |     wxSscanf(s, wxT(\"%d\"), &intdata );\n  115 |     data = (bool)(intdata != 0);\n  116 | }","lines":6,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/xti.cpp#L111-L116"}]},
