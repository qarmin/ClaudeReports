{"id":"CPY_21","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `include/wx/osx/dcprint.h`, `wxPrinterDCImpl` registers its RTTI info with `wxDECLARE_CLASS(wxPrinterDC)` (the name of the unrelated public `wxDC`-derived wrapper class), instead of `wxDECLARE_CLASS(wxPrinterDCImpl)` (the class it is actually declared inside). The corresponding `.cpp` implementation in `src/osx/carbon/dcprint.cpp` correctly uses `wxIMPLEMENT_ABSTRACT_CLASS(wxPrinterDCImpl, wxGCDCImpl);`, confirming the header's macro argument is the wrong identifier. Sibling ports got this right: `include/wx/msw/dcprint.h` and `include/wx/qt/dcprint.h` both use `wxDECLARE_CLASS(wxPrinterDCImpl)`. When built with `wxUSE_EXTENDED_RTTI` (the `wx/xti.h` macro variant), `wxDECLARE_CLASS(name)` expands to code that references `name::ms_classInfo`, so this mismatch would try to reference `wxPrinterDC::ms_classInfo` from within `wxPrinterDCImpl`, breaking the extended-RTTI class registration for this class.","fix":"Change `wxDECLARE_CLASS(wxPrinterDC);` to `wxDECLARE_CLASS(wxPrinterDCImpl);` on line 44 of `include/wx/osx/dcprint.h`, matching the class it is declared in and the `wxIMPLEMENT_ABSTRACT_CLASS(wxPrinterDCImpl, wxGCDCImpl)` used in `src/osx/carbon/dcprint.cpp`, and consistent with `include/wx/msw/dcprint.h` / `include/wx/qt/dcprint.h`.","locations":[{"ref":"include/wx/osx/dcprint.h:19-46","code":"   19 | class WXDLLIMPEXP_CORE wxPrinterDCImpl: public wxGCDCImpl\n   20 | {\n   21 | public:\n   22 | #if wxUSE_PRINTING_ARCHITECTURE\n   23 | \n   24 |     wxPrinterDCImpl( wxPrinterDC *owner, const wxPrintData& printdata );\n   25 |     virtual ~wxPrinterDCImpl();\n   26 | \n   27 |     virtual bool StartDoc( const wxString& WXUNUSED(message) ) override;\n   28 |     virtual void EndDoc() override;\n   29 |     virtual void StartPage() override;\n   30 |     virtual void EndPage() override;\n   31 | \n   32 |     wxRect GetPaperRect() const override;\n   33 | \n   34 |     wxPrintData& GetPrintData() { return m_printData; }\n   35 |     virtual wxSize GetPPI() const override;\n   36 | \n   37 | protected:\n   38 |     virtual void DoGetSize( int *width, int *height ) const override;\n   39 | \n   40 |     wxPrintData        m_printData ;\n   41 |     wxNativePrinterDC* m_nativePrinterDC ;\n   42 | \n   43 | private:\n   44 |     wxDECLARE_CLASS(wxPrinterDC);\n   45 | #endif // wxUSE_PRINTING_ARCHITECTURE\n   46 | };","lines":28,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/osx/dcprint.h#L19-L46"}]},
{"id":"CPY_22","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"`wxAuiGtkTabArt::Clone()` copies all three fonts from `m_normalFont`: `SetSelectedFont(m_normalFont)` and `SetMeasuringFont(m_normalFont)` should use `m_selectedFont` and `m_measuringFont` (both base-class `wxAuiGenericTabArt` members). As written a clone silently discards any custom selected/measuring font set on the original, unlike the copy-constructor semantics of `wxAuiGenericTabArt::Clone()`.","fix":"Use the corresponding members:\n```cpp\nclone->SetNormalFont(m_normalFont);\nclone->SetSelectedFont(m_selectedFont);\nclone->SetMeasuringFont(m_measuringFont);\n```","locations":[{"ref":"src/aui/tabartgtk.cpp:51-60","code":"   51 | wxAuiTabArt* wxAuiGtkTabArt::Clone()\n   52 | {\n   53 |     wxAuiGtkTabArt* clone = new wxAuiGtkTabArt();\n   54 | \n   55 |     clone->SetNormalFont(m_normalFont);\n   56 |     clone->SetSelectedFont(m_normalFont);\n   57 |     clone->SetMeasuringFont(m_normalFont);\n   58 | \n   59 |     return clone;\n   60 | }","lines":10,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/aui/tabartgtk.cpp#L51-L60"}]},
{"id":"CPY_23","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In the register dump for the crash report, the `ecx` register element is filled with `c.regs.edx` instead of `c.regs.ecx`. The next line correctly writes `edx` from `c.regs.edx`, so the true `ecx` value is never recorded and `edx` is duplicated. This is a classic copy-paste slip in the sequence of `HexElement()` calls.","fix":"Change `HexElement(nodeRegs, wxT(\"ecx\"), c.regs.edx);` to `HexElement(nodeRegs, wxT(\"ecx\"), c.regs.ecx);`. Before:\n```\nHexElement(nodeRegs, wxT(\"ebx\"), c.regs.ebx);\nHexElement(nodeRegs, wxT(\"ecx\"), c.regs.edx);\nHexElement(nodeRegs, wxT(\"edx\"), c.regs.edx);\n```\nAfter:\n```\nHexElement(nodeRegs, wxT(\"ebx\"), c.regs.ebx);\nHexElement(nodeRegs, wxT(\"ecx\"), c.regs.ecx);\nHexElement(nodeRegs, wxT(\"edx\"), c.regs.edx);\n```","locations":[{"ref":"src/common/debugrpt.cpp:417-420","code":"  417 |     HexElement(nodeRegs, wxT(\"eax\"), c.regs.eax);\n  418 |     HexElement(nodeRegs, wxT(\"ebx\"), c.regs.ebx);\n  419 |     HexElement(nodeRegs, wxT(\"ecx\"), c.regs.edx);\n  420 |     HexElement(nodeRegs, wxT(\"edx\"), c.regs.edx);","lines":4,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/debugrpt.cpp#L417-L420"}]},
{"id":"CPY_24","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"The paper-size table entry for `wxPAPER_B6_JIS_ROTATED` is labelled `\"B6 (JIS) Rotated 182 x 128 mm\"` but the width value is `1920` (i.e. 192 mm) instead of `1820` (182 mm). `wxPAPER_B6_JIS` just above is correctly `1280, 1820`, so its rotation must be `1820, 1280`. The `1920` value makes `wxPrintPaperDatabase::GetSize(wxPAPER_B6_JIS_ROTATED)` return a wrong width and contradicts the descriptive string on the same line.","fix":"Change the width from `1920` to `1820`:\n```\n// before\nWXADDPAPER(wxPAPER_B6_JIS_ROTATED,      89,   wxTRANSLATE(\"B6 (JIS) Rotated 182 x 128 mm\"), 1920, 1280);\n// after\nWXADDPAPER(wxPAPER_B6_JIS_ROTATED,      89,   wxTRANSLATE(\"B6 (JIS) Rotated 182 x 128 mm\"), 1820, 1280);\n```","locations":[{"ref":"src/common/paper.cpp:158","code":"  158 |     WXADDPAPER(wxPAPER_B6_JIS_ROTATED,      89,                         wxTRANSLATE(\"B6 (JIS) Rotated 182 x 128 mm\"), 1920, 1280);","lines":1,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/paper.cpp#L158"}]},
{"id":"CPY_25","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In the XTI properties table for `wxSlider`, the `PageSize` property is declared with the setter `SetPageSize` but the getter `GetLineSize` instead of `GetPageSize`. This is a copy-paste from the following `LineSize` line. As a result, XTI-based introspection/serialization of a slider will read back its line size where the page size is expected, silently losing/corrupting the page-size value.","fix":"Use the correct getter for the `PageSize` property:\n```cpp\n    wxPROPERTY( PageSize, int, SetPageSize, GetPageSize, 1, 0 /*flags*/, \\\n                wxT(\"Helpstring\"), wxT(\"group\"))\n```\ni.e. change `GetLineSize` to `GetPageSize` on line 88.","locations":[{"ref":"src/common/slidercmn.cpp:88-91","code":"   88 |     wxPROPERTY( PageSize, int, SetPageSize, GetLineSize, 1, 0 /*flags*/, \\\n   89 |                 wxT(\"Helpstring\"), wxT(\"group\"))\n   90 |     wxPROPERTY( LineSize, int, SetLineSize, GetLineSize, 1, 0 /*flags*/, \\\n   91 |                 wxT(\"Helpstring\"), wxT(\"group\"))","lines":4,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/slidercmn.cpp#L88-L91"}]},
{"id":"CPY_26","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"`wxGmtime_r()` calls `gmtime(ticks)` twice: once into the checked pointer `t`, then again inside the `memcpy` argument, discarding `t`. The result of the second call is not null-checked (unlike the sibling `wxLocaltime_r()` which correctly copies from its verified `t`), and it wastefully re-invokes `gmtime`. If the second call somehow returned null (e.g. after a state change), this would `memcpy` from a null pointer; at minimum it is a redundant call and an inconsistency with `wxLocaltime_r`.","fix":"Copy from the already-obtained and null-checked pointer. Before:\n```cpp\n  const tm * const t = gmtime(ticks);\n  if ( !t )\n      return nullptr;\n\n  memcpy(temp, gmtime(ticks), sizeof(struct tm));\n  return temp;\n```\nAfter:\n```cpp\n  const tm * const t = gmtime(ticks);\n  if ( !t )\n      return nullptr;\n\n  memcpy(temp, t, sizeof(struct tm));\n  return temp;\n```","locations":[{"ref":"src/common/time.cpp:112-117","code":"  112 |   const tm * const t = gmtime(ticks);\n  113 |   if ( !t )\n  114 |       return nullptr;\n  115 | \n  116 |   memcpy(temp, gmtime(ticks), sizeof(struct tm));\n  117 |   return temp;","lines":6,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/time.cpp#L112-L117"}]},
{"id":"CPY_27","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"`wxFFileInputStream`'s file-opening constructor sets `m_lasterror = wxSTREAM_WRITE_ERROR` when the file fails to open, but this is an input stream: its `OnSysRead()` correctly uses `wxSTREAM_READ_ERROR` (line 320) and the analogous `wxFileInputStream` ctor uses `wxSTREAM_READ_ERROR` (line 36). This is a copy-paste from an output stream ctor and reports the wrong error kind to callers inspecting the last error.","fix":"Before:\n```cpp\n    if (!m_file->IsOpened())\n        m_lasterror = wxSTREAM_WRITE_ERROR;\n```\nAfter:\n```cpp\n    if (!m_file->IsOpened())\n        m_lasterror = wxSTREAM_READ_ERROR;\n```","locations":[{"ref":"src/common/wfstream.cpp:277-278","code":"  277 |     if (!m_file->IsOpened())\n  278 |         m_lasterror = wxSTREAM_WRITE_ERROR;","lines":2,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/wfstream.cpp#L277-L278"}]},
{"id":"CPY_28","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `wxGrid::DrawFrozenBorder()`, the external-DC (rendering) branch computes `top` (a Y coordinate) from `renderExtent.x` and `left` (an X coordinate) from `renderExtent.y`, i.e. the X and Y offsets are swapped. The sibling assignments are correct (`bottom` uses `renderExtent.y`, `right` uses `renderExtent.x`), which confirms the mismatch. As a result, when `wxGrid::Render()` draws the frozen row/column border to an external DC (e.g. for printing/export) with frozen rows or columns present, the border line is positioned using the wrong axis offset. `top` is used as the start Y of the vertical frozen-column line and `left` as the start X of the horizontal frozen-row line, so both are mispositioned.","fix":"Swap the offsets so each coordinate uses its own axis:\n```cpp\ntop    = -GetColLabelSize() + renderExtent.y;\nleft   = -GetRowLabelSize() + renderExtent.x;\n```","locations":[{"ref":"src/generic/grid.cpp:7062-7063","code":" 7062 |             top    = -GetColLabelSize() + renderExtent.x;\n 7063 |             left   = -GetRowLabelSize() + renderExtent.y;","lines":2,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/grid.cpp#L7062-L7063"}]},
{"id":"CPY_29","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `wxMSWDCImpl::SetFont()`'s \"reset to invalid font\" branch, the code restores the previous GDI object with `::SelectObject(GetHdc(), (HPEN) m_oldFont)` — casting the saved font handle to `(HPEN)` instead of `(HFONT)`. Likewise in `wxMSWDCImpl::SetBrush()`'s \"reset to invalid brush\" branch, `::SelectObject(GetHdc(), (HPEN) m_oldBrush)` casts the saved brush handle to `(HPEN)` instead of `(HBRUSH)`. Both are clearly copy-pasted from the analogous branch in `wxMSWDCImpl::SetPen()` (which correctly uses `(HPEN) m_oldPen`) without updating the cast type. This happens to be harmless at runtime because `HPEN`/`HFONT`/`HBRUSH`/`HGDIOBJ` are all just `typedef`s of `HANDLE`, so no bits are altered, but the code is misleading and breaks type-safety documentation value for future readers/maintainers.","fix":"Fix the casts to match the actual handle type being restored:\n\n```cpp\n// wxMSWDCImpl::SetFont(), invalid-font branch:\nif ( ::SelectObject(GetHdc(), (HFONT) m_oldFont) == HGDI_ERROR )\n\n// wxMSWDCImpl::SetBrush(), invalid-brush branch:\nif ( ::SelectObject(GetHdc(), (HBRUSH) m_oldBrush) == HGDI_ERROR )\n```","locations":[{"ref":"src/msw/dc.cpp:1535-1548","code":" 1535 |     else // invalid font, reset the current font\n 1536 |     {\n 1537 |         if ( m_oldFont )\n 1538 |         {\n 1539 |             if ( ::SelectObject(GetHdc(), (HPEN) m_oldFont) == HGDI_ERROR )\n 1540 |             {\n 1541 |                 wxLogLastError(wxT(\"SelectObject(old font)\"));\n 1542 |             }\n 1543 | \n 1544 |             m_oldFont = 0;\n 1545 |         }\n 1546 | \n 1547 |         m_font = wxNullFont;\n 1548 |     }","lines":14,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/dc.cpp#L1535-L1548"},{"ref":"src/msw/dc.cpp:1631-1644","code":" 1631 |     else // invalid brush, reset the current brush\n 1632 |     {\n 1633 |         if ( m_oldBrush )\n 1634 |         {\n 1635 |             if ( ::SelectObject(GetHdc(), (HPEN) m_oldBrush) == HGDI_ERROR )\n 1636 |             {\n 1637 |                 wxLogLastError(wxT(\"SelectObject(old brush)\"));\n 1638 |             }\n 1639 | \n 1640 |             m_oldBrush = 0;\n 1641 |         }\n 1642 | \n 1643 |         m_brush = wxNullBrush;\n 1644 |     }","lines":14,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/dc.cpp#L1631-L1644"}]},
{"id":"CPY_30","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"`wxWinHelpController::DisplayBlock()` calls `DisplaySection(block)` but discards its return value and unconditionally returns `true`, so callers can never detect a failed `WinHelp()` call via this entry point. The sibling implementation `wxCHMHelpController::DisplayBlock()` in `helpchm.cpp` does it correctly: `return DisplaySection(block);`. This looks like the `helpwin.cpp` version was written (or left) without propagating the result, an inconsistency between the two otherwise-parallel help controller implementations.","fix":"Propagate the actual result instead of hardcoding `true`:\n\n```cpp\nbool wxWinHelpController::DisplayBlock(long block)\n{\n    return DisplaySection(block);\n}\n```","locations":[{"ref":"src/msw/helpwin.cpp:83-87","code":"   83 | bool wxWinHelpController::DisplayBlock(long block)\n   84 | {\n   85 |     DisplaySection(block);\n   86 |     return true;\n   87 | }","lines":5,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/helpwin.cpp#L83-L87"},{"ref":"src/msw/helpchm.cpp:187-190","code":"  187 | bool wxCHMHelpController::DisplayBlock(long block)\n  188 | {\n  189 |     return DisplaySection(block);\n  190 | }","lines":4,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/helpchm.cpp#L187-L190"}]},
{"id":"CPY_31","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `wxMethod::MatchesExceptForAttributes()`, the diagnostic `wxLogMessage(\"Method '%s' has %d arguments while '%s' has %d arguments\", m_strName, m_args.GetCount(), m_strName, m.m_args.GetCount());` uses `m_strName` for both the first and second `%s`, so the message always names the same method twice (e.g. `\"Method 'Foo' has 2 arguments while 'Foo' has 3 arguments\"`) instead of naming the other method `m` being compared against, whose name is available via `m.GetName()` (used correctly two lines above at `src/../xmlparser.cpp:333` and elsewhere in this same file).","fix":"Use the other method's name for the second placeholder: `wxLogMessage(\"Method '%s' has %d arguments while '%s' has %d arguments\", m_strName, m_args.GetCount(), m.GetName(), m.m_args.GetCount());`","locations":[{"ref":"utils/ifacecheck/src/xmlparser.cpp:338-345","code":"  338 |     if (m_args.GetCount()!=m.m_args.GetCount()) {\n  339 |         if (g_verbose)\n  340 |         {\n  341 |             wxLogMessage(\"Method '%s' has %d arguments while '%s' has %d arguments\",\n  342 |                        m_strName, m_args.GetCount(), m_strName, m.m_args.GetCount());\n  343 |         }\n  344 |         return false;\n  345 |     }","lines":8,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/utils/ifacecheck/src/xmlparser.cpp#L338-L345"}]},
{"id":"CPY_32","type":"copy_paste","type_label":"Copy Paste","severity":"negligible","difficulty":"very_easy","description":"`wxBitmapToggleButton` derives from `wxToggleButton`, yet its private `typedef wxToggleButtonBase base_type;` names the grandparent, evidently copy-pasted from `wxToggleButton` (line 68) where that typedef is correct. `base_type` is otherwise unused here, so it is harmless dead code today, but it is misleading and would produce the wrong type if anyone starts relying on it.","fix":"Change the typedef to `typedef wxToggleButton base_type;` (or remove it, since it is unused).","locations":[{"ref":"include/wx/gtk/tglbtn.h:112-113","code":"  112 | private:\n  113 |     typedef wxToggleButtonBase base_type;","lines":2,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/gtk/tglbtn.h#L112-L113"}]},
{"id":"CPY_33","type":"copy_paste","type_label":"Copy Paste","severity":"negligible","difficulty":"very_easy","description":"The `#endif` trailer comment for the `wxUSE_WINRT` configuration-check block incorrectly reads `/* !defined(wxUSE_ACTIVEX) */`, copy-pasted from the preceding `wxUSE_ACTIVEX` block. It should reference `wxUSE_WINRT`.","fix":"Change `#endif /* !defined(wxUSE_ACTIVEX) */` on the last line of the `wxUSE_WINRT` block to `#endif /* !defined(wxUSE_WINRT) */`.","locations":[{"ref":"include/wx/msw/chkconf.h:32-38","code":"   32 | #ifndef wxUSE_WINRT\n   33 | #    ifdef wxABORT_ON_CONFIG_ERROR\n   34 | #        error \"wxUSE_WINRT must be defined.\"\n   35 | #    else\n   36 | #        define wxUSE_WINRT 0\n   37 | #    endif\n   38 | #endif /* !defined(wxUSE_ACTIVEX) */","lines":7,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/msw/chkconf.h#L32-L38"}]},
{"id":"CPY_34","type":"copy_paste","type_label":"Copy Paste","severity":"negligible","difficulty":"very_easy","description":"The `wxCHECK_RET` diagnostic message inside `wxGenericTreeCtrl::DrawBorder` names the wrong function, `wxGenericTreeCtrl::DrawLine`, evidently copy-pasted from the adjacent `DrawLine` method (which uses the same text at `treectlg.cpp:2967`). A failed check would report a misleading function name.","fix":"Correct the function name in the message:\n```cpp\n    wxCHECK_RET( item.IsOk(), \"invalid item in wxGenericTreeCtrl::DrawBorder\" );\n```","locations":[{"ref":"src/generic/treectlg.cpp:2983","code":" 2983 |     wxCHECK_RET( item.IsOk(), \"invalid item in wxGenericTreeCtrl::DrawLine\" );","lines":1,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/treectlg.cpp#L2983"}]},
{"id":"CPY_35","type":"copy_paste","type_label":"Copy Paste","severity":"negligible","difficulty":"very_easy","description":"In `DrawXPBackground()`'s hot-state colour computation, the `else` branch (for `hsv.value >= 0.5`) writes the clamp result to `hsv.value` instead of `valueHot`: `hsv.value = wxMin(0.05, hsv.value);`. The very next statement unconditionally does `hsv.value = valueHot;`, so this assignment is immediately overwritten and has no effect. The mirror `if` branch correctly clamps `valueHot` (`valueHot = wxMax(0.95, hsv.value);`). The clamp is also currently unreachable (`valueHot = value - 0.2 >= 0.3` when `value >= 0.5`), so there is no visible impact today, but the code is defective and inconsistent with its counterpart.","fix":"Mirror the `if` branch by clamping the local: replace `hsv.value = wxMin(0.05, hsv.value);` with `valueHot = wxMin(0.05, hsv.value);`.","locations":[{"ref":"src/msw/anybutton.cpp:1300-1310","code":" 1300 |             else // Same logic as above, but in reverse.\n 1301 |             {\n 1302 |                 valueHot -= 0.2;\n 1303 | \n 1304 |                 if ( valueHot < 0.05 )\n 1305 |                 {\n 1306 |                     hsv.value = wxMin(0.05, hsv.value);\n 1307 |                 }\n 1308 |             }\n 1309 | \n 1310 |             hsv.value = valueHot;","lines":11,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/anybutton.cpp#L1300-L1310"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"easy","description":"The `wxFAILED_HRESULT_MSG(result)` macro (defined at `src/msw/graphicsd2d.cpp:85-86`) only evaluates `wxString::Format(\"Direct2D failed with HRESULT %x\", (result))` and discards the resulting string - it has no side effect at all (no logging, no assertion, no early return), unlike the very next macro `wxCHECK_HRESULT_RET` (lines 90-91) which actually uses it as the message argument to `wxCHECK_RET`. Despite this, the file uses `wxFAILED_HRESULT_MSG(hr);` as a bare statement - as if it actually reported or handled the failure - in `wxD2DConvertRegionToGeometry` (`src/msw/graphicsd2d.cpp:1049` and `:1074`) and in `wxD2DPathData::GetFullGeometry` (`src/msw/graphicsd2d.cpp:1592`). In all three places a failed `CreateRectangleGeometry`/`CreateGeometryGroup` call is completely silently ignored and execution continues using the (likely null) output pointer, unlike almost every other Direct2D call in this file which is properly guarded with `wxCHECK_HRESULT_RET`/`wxCHECK2_HRESULT_RET`.","fix":"Either give `wxFAILED_HRESULT_MSG` an actual side effect when used standalone (e.g. call `wxLogApiError(...)` inside it), or replace the bare-statement call sites with a real check such as `wxCHECK_HRESULT_RET(hr)` / `wxCHECK2_HRESULT_RET(hr, ...)`, matching the pattern used everywhere else in the file, so a failure is reported and the function actually bails out instead of continuing with an invalid geometry pointer.","locations":[{"ref":"src/msw/graphicsd2d.cpp:86-93","code":"   86 | // Generic error message for a failed direct2d operation\n   87 | #define wxFAILED_HRESULT_MSG(result) \\\n   88 |     wxString::Format(\"Direct2D failed with HRESULT %x\", (result))\n   89 | \n   90 | // Checks a HRESULT value for success, otherwise displays an error message and\n   91 | // returns from the enclosing function.\n   92 | #define wxCHECK_HRESULT_RET(result) \\\n   93 |     wxCHECK_RET(SUCCEEDED(result), wxFAILED_HRESULT_MSG(result))","lines":8,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/graphicsd2d.cpp#L86-L93"},{"ref":"src/msw/graphicsd2d.cpp:1048-1051","code":" 1048 |         hr = direct2dFactory->CreateRectangleGeometry(\n 1049 |                         D2D1::RectF(0.0F, 0.0F, 0.0F, 0.0F),\n 1050 |                         (ID2D1RectangleGeometry**)(&geometries[0]));\n 1051 |         wxFAILED_HRESULT_MSG(hr);","lines":4,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/graphicsd2d.cpp#L1048-L1051"},{"ref":"src/msw/graphicsd2d.cpp:1073-1076","code":" 1073 |             hr = direct2dFactory->CreateRectangleGeometry(\n 1074 |                 wxD2DConvertRect(rect),\n 1075 |                 (ID2D1RectangleGeometry**)(&geometries[i]));\n 1076 |             wxFAILED_HRESULT_MSG(hr);","lines":4,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/graphicsd2d.cpp#L1073-L1076"},{"ref":"src/msw/graphicsd2d.cpp:1084-1090","code":" 1084 |     wxCOMPtr<ID2D1GeometryGroup> resultGeometry;\n 1085 |     hr = direct2dFactory->CreateGeometryGroup(\n 1086 |         D2D1_FILL_MODE_WINDING,\n 1087 |         geometries,\n 1088 |         rectCount,\n 1089 |         &resultGeometry);\n 1090 |     wxFAILED_HRESULT_MSG(hr);","lines":7,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/graphicsd2d.cpp#L1084-L1090"},{"ref":"src/msw/graphicsd2d.cpp:1590-1595","code":" 1590 |     // And use this array as a source to create geometry group.\n 1591 |     m_combinedGeometry.reset();\n 1592 |     HRESULT hr = m_direct2dfactory->CreateGeometryGroup(fillMode,\n 1593 |                                   pGeometries, numGeometries+1, &m_combinedGeometry);\n 1594 |     wxFAILED_HRESULT_MSG(hr);\n 1595 |     delete []pGeometries;","lines":6,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/graphicsd2d.cpp#L1590-L1595"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"easy","description":"`wxBitmapPixelWriteLock`'s constructor discards the `HRESULT` from both `IWICBitmap::GetSize()` and `IWICBitmap::Lock()` (`src/msw/graphicsd2d.cpp:2469` and `:2473`) - unlike every other WIC/D2D call in this file, none of which are checked here. If `Lock()` fails, `m_pixelLock` stays null and `GetLock()` returns `nullptr`. Its only caller, the masked-bitmap branch of `wxD2DBitmapResourceHolder`'s constructor, then calls `lock.GetLock()->GetDataPointer(&bufferSize, &resultBuffer)` (`src/msw/graphicsd2d.cpp:2512`) without checking the returned `hr` either, and unconditionally writes `w * h * 4` bytes through `resultBuffer` (declared uninitialized at line 2501) in the loop at lines 2517-2530. A failed `Lock()` crashes immediately via the null-pointer call to `GetDataPointer`; a failed `GetDataPointer()` call corrupts memory by writing through the still-uninitialized `resultBuffer` pointer.","fix":"Check both HRESULTs. In `wxBitmapPixelWriteLock`:\n\n```\nHRESULT hr = bitmap->Lock(&lockSize, WICBitmapLockWrite, &m_pixelLock);\nwxCHECK_HRESULT_RET(hr);\n```\n\nand in the caller, check the `hr` returned by `GetDataPointer(...)` and bail out (e.g. `wxCHECK_HRESULT_RET(hr);`) before using `resultBuffer`.","locations":[{"ref":"src/msw/graphicsd2d.cpp:2464-2482","code":" 2464 | class wxBitmapPixelWriteLock\n 2465 | {\n 2466 | public:\n 2467 |     wxBitmapPixelWriteLock(IWICBitmap* bitmap)\n 2468 |     {\n 2469 |         // Retrieve the size of the bitmap\n 2470 |         UINT w, h;\n 2471 |         bitmap->GetSize(&w, &h);\n 2472 |         WICRect lockSize = {0, 0, (INT)w, (INT)h};\n 2473 | \n 2474 |         // Obtain a bitmap lock for exclusive write\n 2475 |         bitmap->Lock(&lockSize, WICBitmapLockWrite, &m_pixelLock);\n 2476 |     }\n 2477 | \n 2478 |     IWICBitmapLock* GetLock() { return m_pixelLock; }\n 2479 | \n 2480 | private:\n 2481 |     wxCOMPtr<IWICBitmapLock> m_pixelLock;\n 2482 | };","lines":19,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/graphicsd2d.cpp#L2464-L2482"},{"ref":"src/msw/graphicsd2d.cpp:2501-2533","code":" 2501 |             BYTE* colorBuffer = new BYTE[4 * w * h];\n 2502 |             BYTE* maskBuffer = new BYTE[4 * w * h];\n 2503 |             BYTE* resultBuffer;\n 2504 | \n 2505 |             hr = colorBitmap->CopyPixels(nullptr, w * 4, 4 * w * h, colorBuffer);\n 2506 |             wxCHECK_HRESULT_RET(hr);\n 2507 |             hr = maskBitmap->CopyPixels(nullptr, w * 4, 4 * w * h, maskBuffer);\n 2508 |             wxCHECK_HRESULT_RET(hr);\n 2509 | \n 2510 |             {\n 2511 |                 wxBitmapPixelWriteLock lock(m_srcBitmap);\n 2512 | \n 2513 |                 UINT bufferSize = 0;\n 2514 |                 hr = lock.GetLock()->GetDataPointer(&bufferSize, &resultBuffer);\n 2515 | \n 2516 |                 static const wxPBGRAColor transparentColor(wxTransparentColour);\n 2517 | \n 2518 |                 // Create the result bitmap\n 2519 |                 for ( int i = 0; i < w * h * 4; i += 4 )\n 2520 |                 {\n 2521 |                     wxPBGRAColor color(colorBuffer + i);\n 2522 |                     wxPBGRAColor mask(maskBuffer + i);\n 2523 | \n 2524 |                     if ( mask.IsBlack() )\n 2525 |                     {\n 2526 |                         transparentColor.Write(resultBuffer + i);\n 2527 |                     }\n 2528 |                     else\n 2529 |                     {\n 2530 |                         color.Write(resultBuffer + i);\n 2531 |                     }\n 2532 |                 }\n 2533 |             }","lines":33,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/graphicsd2d.cpp#L2501-L2533"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"easy","description":"In `wxIniConfig::DeleteAll()`, when `GetWindowsDirectory(szBuf, WXSIZEOF(szBuf))` returns `0` (failure) or a value greater than `WXSIZEOF(szBuf)` (buffer too small, contents left undefined by the Win32 API), the code only logs (`wxLogLastError`) or asserts (`wxFAIL_MSG`) but does not `return` from the function. Execution falls through to `wxString strFile = szBuf;`, which reads `szBuf` even though it was never actually filled with a valid, null-terminated path in these error paths, i.e. an out-of-bounds/uninitialized stack read is used to build a file path that is later checked with `wxFile::Exists()`/`wxRemoveFile()`.","fix":"Return early on both error paths:\n```cpp\nif ( nRc == 0 )\n{\n    wxLogLastError(wxT(\"GetWindowsDirectory\"));\n    return false;\n}\nelse if ( nRc > WXSIZEOF(szBuf) )\n{\n    wxFAIL_MSG(wxT(\"buffer is too small for Windows directory.\"));\n    return false;\n}\n```","locations":[{"ref":"src/msw/iniconf.cpp:437-463","code":"  437 | bool wxIniConfig::DeleteAll()\n  438 | {\n  439 |   // first delete our group in win.ini\n  440 |   WriteProfileString(GetVendorName().t_str(), nullptr, nullptr);\n  441 | \n  442 |   // then delete our own ini file\n  443 |   wxChar szBuf[MAX_PATH];\n  444 |   size_t nRc = GetWindowsDirectory(szBuf, WXSIZEOF(szBuf));\n  445 |   if ( nRc == 0 )\n  446 |   {\n  447 |     wxLogLastError(wxT(\"GetWindowsDirectory\"));\n  448 |   }\n  449 |   else if ( nRc > WXSIZEOF(szBuf) )\n  450 |   {\n  451 |     wxFAIL_MSG(wxT(\"buffer is too small for Windows directory.\"));\n  452 |   }\n  453 | \n  454 |   wxString strFile = szBuf;\n  455 |   strFile << '\\\\' << m_strLocalFilename;\n  456 | \n  457 |   if ( wxFile::Exists(strFile) && !wxRemoveFile(strFile) ) {\n  458 |     wxLogSysError(_(\"Can't delete the INI file '%s'\"), strFile);\n  459 |     return false;\n  460 |   }\n  461 | \n  462 |   return true;\n  463 | }","lines":27,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/iniconf.cpp#L437-L463"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"very_easy","description":"`wxMSWImpl::wxIFileDialog::Show()` returns `int` and its documented contract (used throughout `src/msw/dirdlg.cpp`) is to return one of `wxID_OK`, `wxID_CANCEL` or `wxID_NONE` (`wxID_NONE = -3`, `wxID_OK = 5100`, `wxID_CANCEL = 5101`). However, when `m_fileDialog->SetOptions(...)` fails, the function does `return false;` (`src/msw/dirdlg.cpp:335`), i.e. returns `0`, which matches none of the three expected sentinel values. Callers such as `wxDirDialog::ShowModal()` (`src/msw/dirdlg.cpp:160-166`) only fall back to `ShowSHBrowseForFolder()` when `rc == wxID_NONE`, so a `SetOptions()` failure is silently treated as if the dialog had produced result code `0`, which does not correspond to OK, Cancel, or \"try the fallback\", and is propagated as-is out of `wxDirDialog::ShowModal()`/`wxFileDialog`.","fix":"Return one of the documented sentinel values instead of `false`:\n\n```cpp\nhr = m_fileDialog->SetOptions(options | FOS_FORCEFILESYSTEM);\nif ( FAILED(hr) )\n{\n    wxLogApiError(wxS(\"IFileDialog::SetOptions\"), hr);\n    return wxID_NONE; // let the caller fall back to the legacy dialog\n}\n```","locations":[{"ref":"src/msw/dirdlg.cpp:323-336","code":"  323 | int wxIFileDialog::Show(HWND owner, int options,\n  324 |                         wxArrayString* pathsOut, wxString* pathOut)\n  325 | {\n  326 |     wxCHECK_MSG( m_fileDialog, wxID_NONE, wxS(\"shouldn't be called\") );\n  327 | \n  328 |     HRESULT hr;\n  329 | \n  330 |     // allow to select only a file system object\n  331 |     hr = m_fileDialog->SetOptions(options | FOS_FORCEFILESYSTEM);\n  332 |     if ( FAILED(hr) )\n  333 |     {\n  334 |         wxLogApiError(wxS(\"IFileDialog::SetOptions\"), hr);\n  335 |         return false;\n  336 |     }","lines":14,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/dirdlg.cpp#L323-L336"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`wxD2DBitmapResourceHolder::GetSubBitmap()` returns `nullptr` when clipping fails, via `wxCHECK2_HRESULT_RET(hr, nullptr)` (`src/msw/graphicsd2d.cpp:2577`, `:2581`, `:2585`), but its only caller, `wxD2DRenderer::CreateSubBitmap()`, never checks for that: `NativeBitmap natBmp = static_cast<NativeBitmap>(bitmap.GetNativeBitmap())->GetSubBitmap(x, y, w, h);` (`src/msw/graphicsd2d.cpp:5463`) is passed straight into `new wxD2DBitmapData(this, natBmp)` (line 5465) with no null check. Any later use of the resulting `wxGraphicsBitmap` (e.g. `wxD2DBitmapData::GetD2DBitmap()` calling `m_bitmapHolder->GetD2DResource()`) dereferences the null `m_bitmapHolder`.","fix":"Check for `nullptr` and fail gracefully, e.g.:\n\n```\nNativeBitmap natBmp = static_cast<NativeBitmap>(bitmap.GetNativeBitmap())->GetSubBitmap(x, y, w, h);\nif (!natBmp)\n    return wxNullGraphicsBitmap;\n```","locations":[{"ref":"src/msw/graphicsd2d.cpp:5461-5469","code":" 5461 | wxGraphicsBitmap wxD2DRenderer::CreateSubBitmap(const wxGraphicsBitmap& bitmap, wxDouble x, wxDouble y, wxDouble w, wxDouble h)\n 5462 | {\n 5463 |     typedef wxD2DBitmapData::NativeType* NativeBitmap;\n 5464 | \n 5465 |     NativeBitmap natBmp = static_cast<NativeBitmap>(bitmap.GetNativeBitmap())->GetSubBitmap(x, y, w, h);\n 5466 |     wxGraphicsBitmap bmpRes;\n 5467 |     bmpRes.SetRefData(new wxD2DBitmapData(this, natBmp));\n 5468 |     return bmpRes;\n 5469 | }","lines":9,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/graphicsd2d.cpp#L5461-L5469"},{"ref":"src/msw/graphicsd2d.cpp:2575-2590","code":" 2575 |     wxD2DBitmapResourceHolder* GetSubBitmap(wxDouble x, wxDouble y, wxDouble w, wxDouble h) const\n 2576 |     {\n 2577 |         wxCOMPtr<IWICBitmapClipper> clipper;\n 2578 |         HRESULT hr = wxWICImagingFactory()->CreateBitmapClipper(&clipper);\n 2579 |         wxCHECK2_HRESULT_RET(hr, nullptr);\n 2580 | \n 2581 |         WICRect r = { (INT)x, (INT)y, (INT)w, (INT)h };\n 2582 |         hr = clipper->Initialize(m_srcBitmap, &r);\n 2583 |         wxCHECK2_HRESULT_RET(hr, nullptr);\n 2584 | \n 2585 |         wxCOMPtr<IWICBitmap> subBmp;\n 2586 |         hr = wxWICImagingFactory()->CreateBitmapFromSource(clipper, WICBitmapNoCache, &subBmp);\n 2587 |         wxCHECK2_HRESULT_RET(hr, nullptr);\n 2588 | \n 2589 |         return new wxD2DBitmapResourceHolder(subBmp);\n 2590 |     }","lines":16,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/graphicsd2d.cpp#L2575-L2590"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"The backward-compatibility macro `#define wxEVT_COMMAND_AUINOTEBOOK_CANCEL_DRAG wxEVT_AUINOTEBOOK_CANCEL_DRAG` expands to `wxEVT_AUINOTEBOOK_CANCEL_DRAG`, but unlike every other AUI notebook event (`wxEVT_AUINOTEBOOK_PAGE_CLOSE`, `..._BEGIN_DRAG`, `..._END_DRAG`, etc.) there is no `wxDECLARE_EXPORTED_EVENT(WXDLLIMPEXP_AUI, wxEVT_AUINOTEBOOK_CANCEL_DRAG, wxAuiNotebookEvent)` in this header. The event is only defined internally via `wxDEFINE_EVENT` in `src/aui/auibook.cpp`, so it has no visible declaration for library users. Any external code that references `wxEVT_COMMAND_AUINOTEBOOK_CANCEL_DRAG` or `wxEVT_AUINOTEBOOK_CANCEL_DRAG` fails to compile, and there is no `EVT_AUINOTEBOOK_CANCEL_DRAG` binder macro either, making the event effectively unusable and the compat alias dead.","fix":"Add the missing declaration alongside the others, e.g. `wxDECLARE_EXPORTED_EVENT(WXDLLIMPEXP_AUI, wxEVT_AUINOTEBOOK_CANCEL_DRAG, wxAuiNotebookEvent);` in the `wxDECLARE_EXPORTED_EVENT` block (plus a corresponding `EVT_AUINOTEBOOK_CANCEL_DRAG` binder macro), so that `wxEVT_COMMAND_AUINOTEBOOK_CANCEL_DRAG` at line 854 resolves to a declared symbol.","locations":[{"ref":"include/wx/aui/auibook.h:858","code":"  858 | #define wxEVT_COMMAND_AUINOTEBOOK_CANCEL_DRAG       wxEVT_AUINOTEBOOK_CANCEL_DRAG","lines":1,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/aui/auibook.h#L858"},{"ref":"include/wx/aui/auibook.h:752-766","code":"  752 | wxDECLARE_EXPORTED_EVENT(WXDLLIMPEXP_AUI, wxEVT_AUINOTEBOOK_PAGE_CLOSE, wxAuiNotebookEvent);\n  753 | wxDECLARE_EXPORTED_EVENT(WXDLLIMPEXP_AUI, wxEVT_AUINOTEBOOK_PAGE_CHANGED, wxAuiNotebookEvent);\n  754 | wxDECLARE_EXPORTED_EVENT(WXDLLIMPEXP_AUI, wxEVT_AUINOTEBOOK_PAGE_CHANGING, wxAuiNotebookEvent);\n  755 | wxDECLARE_EXPORTED_EVENT(WXDLLIMPEXP_AUI, wxEVT_AUINOTEBOOK_PAGE_CLOSED, wxAuiNotebookEvent);\n  756 | wxDECLARE_EXPORTED_EVENT(WXDLLIMPEXP_AUI, wxEVT_AUINOTEBOOK_BUTTON, wxAuiNotebookEvent);\n  757 | wxDECLARE_EXPORTED_EVENT(WXDLLIMPEXP_AUI, wxEVT_AUINOTEBOOK_BEGIN_DRAG, wxAuiNotebookEvent);\n  758 | wxDECLARE_EXPORTED_EVENT(WXDLLIMPEXP_AUI, wxEVT_AUINOTEBOOK_END_DRAG, wxAuiNotebookEvent);\n  759 | wxDECLARE_EXPORTED_EVENT(WXDLLIMPEXP_AUI, wxEVT_AUINOTEBOOK_DRAG_MOTION, wxAuiNotebookEvent);\n  760 | wxDECLARE_EXPORTED_EVENT(WXDLLIMPEXP_AUI, wxEVT_AUINOTEBOOK_ALLOW_DND, wxAuiNotebookEvent);\n  761 | wxDECLARE_EXPORTED_EVENT(WXDLLIMPEXP_AUI, wxEVT_AUINOTEBOOK_TAB_MIDDLE_DOWN, wxAuiNotebookEvent);\n  762 | wxDECLARE_EXPORTED_EVENT(WXDLLIMPEXP_AUI, wxEVT_AUINOTEBOOK_TAB_MIDDLE_UP, wxAuiNotebookEvent);\n  763 | wxDECLARE_EXPORTED_EVENT(WXDLLIMPEXP_AUI, wxEVT_AUINOTEBOOK_TAB_RIGHT_DOWN, wxAuiNotebookEvent);\n  764 | wxDECLARE_EXPORTED_EVENT(WXDLLIMPEXP_AUI, wxEVT_AUINOTEBOOK_TAB_RIGHT_UP, wxAuiNotebookEvent);\n  765 | wxDECLARE_EXPORTED_EVENT(WXDLLIMPEXP_AUI, wxEVT_AUINOTEBOOK_DRAG_DONE, wxAuiNotebookEvent);\n  766 | wxDECLARE_EXPORTED_EVENT(WXDLLIMPEXP_AUI, wxEVT_AUINOTEBOOK_BG_DCLICK, wxAuiNotebookEvent);","lines":15,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/aui/auibook.h#L752-L766"}]},
{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `WriteEnum()` the `else` branch for an unknown `kind` executes a bare `raise` outside of any `except` block. With no active exception this raises `RuntimeError: No active exception to reraise`, masking the intended \"Unknown kind of generated enum\" error with a misleading one.","fix":"Replace the bare `raise` with an explicit exception carrying the message, e.g. `raise ValueError(\"Unknown kind of generated enum\")`, and drop the separate `print`.","locations":[{"ref":"misc/languages/genlang.py:143-145","code":"  143 |       else:\n  144 |         print(\"Unknown kind of generated enum\")\n  145 |         raise","lines":3,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/misc/languages/genlang.py#L143-L145"}]},
{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `WriteInfoTable()`, when the layout-direction field `i[7]` is neither `\"LTR\"` nor `\"RTL\"`, the `else` branch only calls `print()` and does not assign `ilayout` (and does not `raise`/`sys.exit`). Execution falls through to the format at the next lines that reference `ilayout`, producing a confusing `NameError: name 'ilayout' is not defined` instead of a clean diagnostic, and never actually stopping at the intended error point.","fix":"Make the error terminal, e.g. in the `else` branch print the message and then `sys.exit(1)` (or `raise ValueError(...)`), so the invalid layout value is reported cleanly and processing stops.","locations":[{"ref":"misc/languages/genlang.py:244-251","code":"  244 |        if (i[7] == \"LTR\") :\n  245 |            ilayout = \"wxLayout_LeftToRight\"\n  246 |        elif (i[7] == \"RTL\"):\n  247 |            ilayout = \"wxLayout_RightToLeft\"\n  248 |        else:\n  249 |            print(\"ERROR: Invalid value for the layout direction\")\n  250 |        lngtable += '    { %-60s %-17s, %-28s, %-15s, %-4s, %-4s, %s, %s },\\n' % \\\n  251 |                      ((i[0]+','), ibcp47, ican, icanbase, ilang, isublang, ilayout, i[8])","lines":8,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/misc/languages/genlang.py#L244-L251"}]},
{"id":"ERR_9","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`wxFTP::GetPassivePort()` calls `wxSscanf(straddr, \"%d,%d,%d,%d,%d,%d\", ...)` but ignores the return value. If a malicious or broken FTP server sends a PASV reply with fewer than six numbers inside the parentheses, the corresponding `a[]` entries remain uninitialized and are then used to build `hostaddr`/`port`, connecting to a garbage address. The parsing result should be validated before use.","fix":"Check the count: `if ( wxSscanf(straddr, wxT(\"%d,%d,%d,%d,%d,%d\"), &a[2],&a[3],&a[4],&a[5],&a[0],&a[1]) != 6 ) { m_lastError = wxPROTO_PROTERR; return nullptr; }` before computing `hostaddr` and `port`.","locations":[{"ref":"src/common/ftp.cpp:638-651","code":"  638 |     int a[6];\n  639 |     wxString straddr(m_lastResult, addrStart + 1, addrEnd - (addrStart + 1));\n  640 |     wxSscanf(straddr, wxT(\"%d,%d,%d,%d,%d,%d\"),\n  641 |              &a[2],&a[3],&a[4],&a[5],&a[0],&a[1]);\n  642 | \n  643 |     wxUint32 hostaddr = (wxUint16)a[2] << 24 |\n  644 |                         (wxUint16)a[3] << 16 |\n  645 |                         (wxUint16)a[4] << 8 |\n  646 |                         a[5];\n  647 |     wxUint16 port = (wxUint16)(a[0] << 8 | a[1]);\n  648 | \n  649 |     wxIPV4address addr;\n  650 |     addr.Hostname(hostaddr);\n  651 |     addr.Service(port);","lines":14,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/ftp.cpp#L638-L651"}]},
{"id":"ERR_10","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`wx_empty_output_buffer` calls `dest->stream->Write(dest->buffer, OUTPUT_BUF_SIZE);` but ignores the result and unconditionally returns `TRUE`. If the output stream fails mid-write (e.g. disk full), libjpeg is told the flush succeeded, so `wxJPEGHandler::SaveFile` returns `true` and silently produces a truncated/corrupt JPEG file with no error reported. `wx_term_destination` has the same ignored-error problem.","fix":"Check the write result and signal failure to libjpeg, e.g. compare `dest->stream->Write(...).LastWrite()` against `OUTPUT_BUF_SIZE` and, on mismatch, trigger the error path (`ERREXIT`/`longjmp` via `cinfo->err`) so the caller sees the failure rather than returning `TRUE`.","locations":[{"ref":"src/common/imagjpeg.cpp:378-395","code":"  378 | CPP_METHODDEF(boolean) wx_empty_output_buffer (j_compress_ptr cinfo)\n  379 | {\n  380 |     wx_dest_ptr dest = (wx_dest_ptr) cinfo->dest;\n  381 | \n  382 |     dest->stream->Write(dest->buffer, OUTPUT_BUF_SIZE);\n  383 |     dest->pub.next_output_byte = dest->buffer;\n  384 |     dest->pub.free_in_buffer = OUTPUT_BUF_SIZE;\n  385 |     return TRUE;\n  386 | }\n  387 | \n  388 | CPP_METHODDEF(void) wx_term_destination (j_compress_ptr cinfo)\n  389 | {\n  390 |     wx_dest_ptr dest = (wx_dest_ptr) cinfo->dest;\n  391 |     size_t datacount = OUTPUT_BUF_SIZE - dest->pub.free_in_buffer;\n  392 |     /* Write any data remaining in the buffer */\n  393 |     if (datacount > 0)\n  394 |         dest->stream->Write(dest->buffer, datacount);\n  395 | }","lines":18,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/imagjpeg.cpp#L378-L395"}]},
{"id":"ERR_11","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`wxNow()` calls `char *date = ctime(&now);` and immediately writes `date[24] = '\\0';` without checking for `nullptr`. `ctime()` returns `nullptr` on failure (e.g. a `time_t` that cannot be represented), which would cause a null-pointer write/crash.","fix":"Guard against a null return:\n```cpp\nchar *date = ctime(&now);\nif ( !date )\n    return wxString();\ndate[24] = '\\0';\n```","locations":[{"ref":"src/common/utilscmn.cpp:164-170","code":"  164 | wxString wxNow()\n  165 | {\n  166 |     time_t now = time(nullptr);\n  167 |     char *date = ctime(&now);\n  168 |     date[24] = '\\0';\n  169 |     return wxString::FromAscii(date);\n  170 | }","lines":7,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/utilscmn.cpp#L164-L170"}]},
{"id":"ERR_12","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`wxCRT_StrdupA()` does `strcpy((char *)malloc(strlen(s) + 1), s)` and `wxCRT_StrdupW()` / the `wxChar16` `wxStrdup()` do `malloc(...)` immediately followed by `memcpy(ret, ...)` without checking the allocation result, so an allocation failure leads to a null-pointer dereference / crash inside `strcpy`/`memcpy`. This is inconsistent with the `wxChar32` `wxStrdup()` just below, which correctly guards the `memcpy` with `if ( ret )`. These are only compiled when the platform doesn't already provide the corresponding function, so severity is low.","fix":"Check the `malloc` result before using it in all three helpers, matching the `wxChar32` `wxStrdup()` implementation (return null on allocation failure and only `memcpy`/`strcpy` when the pointer is non-null).","locations":[{"ref":"src/common/wxcrt.cpp:647-650","code":"  647 | WXDLLIMPEXP_BASE char *wxCRT_StrdupA(const char *s)\n  648 | {\n  649 |     return strcpy((char *)malloc(strlen(s) + 1), s);\n  650 | }","lines":4,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/wxcrt.cpp#L647-L650"},{"ref":"src/common/wxcrt.cpp:654-660","code":"  654 | WXDLLIMPEXP_BASE wchar_t * wxCRT_StrdupW(const wchar_t *pwz)\n  655 | {\n  656 |   size_t size = (wxWcslen(pwz) + 1) * sizeof(wchar_t);\n  657 |   wchar_t *ret = (wchar_t *) malloc(size);\n  658 |   memcpy(ret, pwz, size);\n  659 |   return ret;\n  660 | }","lines":7,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/wxcrt.cpp#L654-L660"},{"ref":"src/common/wxcrt.cpp:672-678","code":"  672 | wxChar16* wxStrdup(const wxChar16* s)\n  673 | {\n  674 |   size_t size = (wxStrlen(s) + 1) * sizeof(wxChar16);\n  675 |   wxChar16 *ret = (wxChar16*) malloc(size);\n  676 |   memcpy(ret, s, size);\n  677 |   return ret;\n  678 | }","lines":7,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/wxcrt.cpp#L672-L678"},{"ref":"src/common/wxcrt.cpp:690-697","code":"  690 | wxChar32* wxStrdup(const wxChar32* s)\n  691 | {\n  692 |   size_t size = (wxStrlen(s) + 1) * sizeof(wxChar32);\n  693 |   wxChar32 *ret = (wxChar32*) malloc(size);\n  694 |   if ( ret )\n  695 |       memcpy(ret, s, size);\n  696 |   return ret;\n  697 | }","lines":8,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/wxcrt.cpp#L690-L697"}]},
{"id":"ERR_13","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `TimeStamp`, when `wxStrftime` returns 0 the code only calls `wxFAIL_MSG` (a no-op in release builds) and then constructs `wxString(buf)` from `buf`, which is left with indeterminate, possibly non-null-terminated contents. In a non-debug build this results in reading uninitialized stack memory and a potential out-of-bounds read past `buf`.","fix":"Guarantee termination before use, e.g. initialize `wxChar buf[4096] = { 0 };` and/or explicitly set `buf[0] = wxT('\\0');` in the failure branch before returning, so `wxString(buf)` always reads a valid empty/terminated string.","locations":[{"ref":"src/generic/logg.cpp:77-87","code":"   77 | static wxString TimeStamp(const wxString& format, time_t t)\n   78 | {\n   79 |     wxChar buf[4096];\n   80 |     struct tm tm;\n   81 |     if ( !wxStrftime(buf, WXSIZEOF(buf), format, wxLocaltime_r(&t, &tm)) )\n   82 |     {\n   83 |         // buffer is too small?\n   84 |         wxFAIL_MSG(wxT(\"strftime() failed\"));\n   85 |     }\n   86 |     return wxString(buf);\n   87 | }","lines":11,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/logg.cpp#L77-L87"}]},
{"id":"ERR_14","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In the non-GTK4 branch of `wxInfoBar::GTKAddButton()`, when `label` is empty and `btnid` is not a stock id, `wxGetStockGtkID(btnid)` returns `nullptr`, which is then passed as the button text to `gtk_info_bar_add_button()`. This produces a GTK critical warning, `gtk_info_bar_add_button()` returns null, and the following `wxASSERT_MSG(button, ...)` fires. The generic `wxInfoBarGeneric::AddButton()` handles an empty label by falling back to `wxGetStockLabel()`, so the native version is inconsistent and fragile for non-stock ids.","fix":"Fall back to a real label when the stock lookup fails, mirroring the GTK4 branch, e.g. compute `const char*` text as `label.empty() ? (wxGetStockGtkID(btnid) ? ... : wxConvertMnemonicsToGTK(wxGetStockLabel(btnid)).utf8_str()) : label.utf8_str()`, ensuring a non-null string is always passed.","locations":[{"ref":"src/gtk/infobar.cpp:235-243","code":"  235 |     GtkWidget* button = gtk_info_bar_add_button(GTK_INFO_BAR(m_widget),\n  236 | #ifdef __WXGTK4__\n  237 |         (label.empty() ? wxConvertMnemonicsToGTK(wxGetStockLabel(btnid)) : label).utf8_str(),\n  238 | #else\n  239 |         label.empty() ? wxGetStockGtkID(btnid) : static_cast<const char*>(label.utf8_str()),\n  240 | #endif\n  241 |         btnid);\n  242 | \n  243 |     wxASSERT_MSG( button, \"unexpectedly failed to add button to info bar\" );","lines":9,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/gtk/infobar.cpp#L235-L243"}]},
{"id":"ERR_15","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`wxHtmlListCell::ReallocRows()` calls `realloc()` and assigns the result directly back to `m_RowInfo` without checking for `nullptr`. If `realloc()` fails it returns `nullptr` while leaving the original block allocated: the old buffer is leaked and the very next statements (`m_RowInfo[rows - 1].mark = nullptr;` etc.) dereference the null pointer, crashing. This is the classic self-assigning-realloc anti-pattern.\n```\nm_RowInfo = (wxHtmlListItemStruct*) realloc(m_RowInfo, sizeof(wxHtmlListItemStruct) * rows);\nm_RowInfo[rows - 1].mark = nullptr;   // null deref if realloc failed\n```","fix":"Use a temporary: `wxHtmlListItemStruct* p = (wxHtmlListItemStruct*)realloc(m_RowInfo, sizeof(wxHtmlListItemStruct)*rows); if (!p) return; /* or handle OOM */ m_RowInfo = p;` before writing into `m_RowInfo[rows-1]`.","locations":[{"ref":"src/html/m_list.cpp:162-171","code":"  162 | void wxHtmlListCell::ReallocRows(int rows)\n  163 | {\n  164 |     m_RowInfo = (wxHtmlListItemStruct*) realloc(m_RowInfo, sizeof(wxHtmlListItemStruct) * rows);\n  165 |     m_RowInfo[rows - 1].mark = nullptr;\n  166 |     m_RowInfo[rows - 1].cont = nullptr;\n  167 |     m_RowInfo[rows - 1].minWidth = 0;\n  168 |     m_RowInfo[rows - 1].maxWidth = 0;\n  169 | \n  170 |     m_NumRows = rows;\n  171 | }","lines":10,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/html/m_list.cpp#L162-L171"}]},
{"id":"ERR_16","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `wxDisplayFactoryMSW::MultimonEnumProc()`, when `::GetMonitorInfo(hMonitor, &monInfo)` fails, the code only logs the error via `wxLogLastError` but still proceeds to call `::CreateDC(nullptr, monInfo.szDevice, nullptr, nullptr)` with the zero-initialized (and thus empty) `monInfo.szDevice`, and unconditionally pushes `wxDisplayInfo(hMonitor, monInfo, hdcDepth)` (with a meaningless, all-zero `monInfo`) into `self->m_displays`. This creates a bogus display entry (zero-sized geometry, empty device name) instead of skipping the monitor that couldn't be queried.","fix":"Skip the monitor instead of recording bogus data when `GetMonitorInfo` fails:\n\n```cpp\nWinStruct<MONITORINFOEX> monInfo;\nif ( !::GetMonitorInfo(hMonitor, &monInfo) )\n{\n    wxLogLastError(wxT(\"GetMonitorInfo\"));\n    return TRUE; // skip this monitor, continue enumeration\n}\n```","locations":[{"ref":"src/msw/display.cpp:644-668","code":"  644 | BOOL CALLBACK\n  645 | wxDisplayFactoryMSW::MultimonEnumProc(\n  646 |     HMONITOR hMonitor,              // handle to display monitor\n  647 |     HDC /* hdcMonitor */,           // handle to monitor-appropriate device context:\n  648 |                                     // not set due to our use of EnumDisplayMonitors(nullptr, ...)\n  649 |     LPRECT WXUNUSED(lprcMonitor),   // pointer to monitor intersection rectangle\n  650 |     LPARAM dwData)                  // data passed from EnumDisplayMonitors (this)\n  651 | {\n  652 |     wxDisplayFactoryMSW *const self = (wxDisplayFactoryMSW *)dwData;\n  653 | \n  654 |     WinStruct<MONITORINFOEX> monInfo;\n  655 |     if ( !::GetMonitorInfo(hMonitor, &monInfo) )\n  656 |     {\n  657 |         wxLogLastError(wxT(\"GetMonitorInfo\"));\n  658 |     }\n  659 | \n  660 |     HDC hdcMonitor = ::CreateDC(nullptr, monInfo.szDevice, nullptr, nullptr);\n  661 |     const int hdcDepth = wxGetHDCDepth(hdcMonitor);\n  662 |     ::DeleteDC(hdcMonitor);\n  663 | \n  664 |     self->m_displays.push_back(wxDisplayInfo(hMonitor, monInfo, hdcDepth));\n  665 | \n  666 |     // continue the enumeration\n  667 |     return TRUE;\n  668 | }","lines":25,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/display.cpp#L644-L668"}]},
{"id":"ERR_17","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"`wxD2DPenData::CreateStrokeStyle` calls `direct2dfactory->CreateStrokeStyle(...)` (`src/msw/graphicsd2d.cpp:3114-3117`) and never even stores the returned `HRESULT`, let alone checks it, unlike essentially every other `Create*` call in this file which is wrapped in `wxCHECK_HRESULT_RET`. If it fails, `m_strokeStyle` silently stays null and `wxD2DPenData::GetStrokeStyle()` hands a `nullptr` stroke style into `ID2D1RenderTarget::DrawGeometry`/`DrawRectangle`/`DrawRoundedRectangle`/`DrawEllipse` without any diagnostic ever being produced.","fix":"Capture and check the result:\n\n```\nHRESULT hr = direct2dfactory->CreateStrokeStyle(\n    D2D1::StrokeStyleProperties(capStyle, capStyle, capStyle, lineJoin, 0, dashStyle, 0.0f),\n    dashes, dashCount, &m_strokeStyle);\ndelete[] dashes;\nwxCHECK_HRESULT_RET(hr);\n```","locations":[{"ref":"src/msw/graphicsd2d.cpp:3095-3122","code":" 3095 | void wxD2DPenData::CreateStrokeStyle(ID2D1Factory* const direct2dfactory)\n 3096 | {\n 3097 |     D2D1_CAP_STYLE capStyle = wxD2DConvertPenCap(m_penInfo.GetCap());\n 3098 |     D2D1_LINE_JOIN lineJoin = wxD2DConvertPenJoin(m_penInfo.GetJoin());\n 3099 |     D2D1_DASH_STYLE dashStyle = wxD2DConvertPenStyle(m_penInfo.GetStyle());\n 3100 | \n 3101 |     int dashCount = 0;\n 3102 |     FLOAT* dashes = nullptr;\n 3103 | \n 3104 |     if (dashStyle == D2D1_DASH_STYLE_CUSTOM)\n 3105 |     {\n 3106 |         dashCount = m_penInfo.GetDashCount();\n 3107 |         dashes = new FLOAT[dashCount];\n 3108 | \n 3109 |         for (int i = 0; i < dashCount; ++i)\n 3110 |         {\n 3111 |             dashes[i] = m_penInfo.GetDash()[i];\n 3112 |         }\n 3113 | \n 3114 |     }\n 3115 | \n 3116 |     direct2dfactory->CreateStrokeStyle(\n 3117 |         D2D1::StrokeStyleProperties(capStyle, capStyle, capStyle, lineJoin, 0, dashStyle, 0.0f),\n 3118 |         dashes, dashCount,\n 3119 |         &m_strokeStyle);\n 3120 | \n 3121 |     delete[] dashes;\n 3122 | }","lines":28,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/graphicsd2d.cpp#L3095-L3122"}]},
{"id":"ERR_18","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`wxJoystickThread::Entry()` calls `joyGetPos(m_joystick, &m_joyInfo);` without checking the returned `MMRESULT`. If the device is unplugged or the call otherwise fails, `m_joyInfo` is left with whatever the previous iteration wrote (or the initial zeroed struct) but the loop still treats it as fresh data, comparing it against `m_lastJoyInfo` and potentially firing bogus `wxEVT_JOY_MOVE`/button events, or silently going quiet without ever reporting the device failure.","fix":"Check the `MMRESULT` returned by `joyGetPos()` inside the loop and skip event generation (or stop the thread / notify the app) when it is not `JOYERR_NOERROR`, similar to how `wxJoystick::GetPosition()` and friends already check the result.","locations":[{"ref":"src/msw/joystick.cpp:98-133","code":"   98 | void* wxJoystickThread::Entry()\n   99 | {\n  100 |     joyGetPos(m_joystick, &m_lastJoyInfo);\n  101 | \n  102 |     while (!TestDestroy())\n  103 |     {\n  104 |         Sleep(m_polling);\n  105 |         long ts = GetTickCount();\n  106 | \n  107 |         joyGetPos(m_joystick, &m_joyInfo);\n  108 |         m_buttons = m_joyInfo.wButtons;\n  109 |         UINT delta = m_buttons ^ m_lastJoyInfo.wButtons;\n  110 |         UINT deltaUp = delta & ~m_buttons;\n  111 |         UINT deltaDown = delta & m_buttons;\n  112 | \n  113 |         // Use count trailing zeros to determine which button changed.\n  114 |         // Was using JOYINFOEX.dwButtons, because the docs state this is\n  115 |         // \"Current button number that is pressed.\", but it turns out\n  116 |         // it is the *total* number of buttons pressed.\n  117 |         if (deltaUp)\n  118 |             SendEvent(wxEVT_JOY_BUTTON_UP, ts, deltaUp);\n  119 |         if (deltaDown)\n  120 |             SendEvent(wxEVT_JOY_BUTTON_DOWN, ts, deltaDown);\n  121 | \n  122 |         if ((m_joyInfo.wXpos != m_lastJoyInfo.wXpos) ||\n  123 |             (m_joyInfo.wYpos != m_lastJoyInfo.wYpos) ||\n  124 |             (m_joyInfo.wZpos != m_lastJoyInfo.wZpos)   )\n  125 |         {\n  126 |             SendEvent(wxEVT_JOY_MOVE, ts);\n  127 |         }\n  128 | \n  129 |         m_lastJoyInfo = m_joyInfo;\n  130 |     }\n  131 | \n  132 |     return nullptr;\n  133 | }","lines":36,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/joystick.cpp#L98-L133"}]},
{"id":"ERR_19","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`wxListBox::MSWOnMeasure()` calls `HDC hdc = CreateIC(wxT(\"DISPLAY\"), nullptr, nullptr, 0);` and immediately wraps it in `wxDCTemp dc((WXHDC)hdc);` without checking whether `CreateIC()` returned `nullptr` (which the Win32 API documents as the failure return value, e.g. under GDI handle exhaustion). A null `HDC` is then used for `dc.SetFont()`/`dc.GetCharHeight()`/`dc.GetCharWidth()`, and `DeleteDC(hdc)` is called on it unconditionally afterwards.","fix":"Check `hdc` before using it, e.g. fall back to a reasonable default item height/width or use `wxCHECK_MSG`/`wxLogLastError` when `CreateIC()` returns `nullptr`, and skip `DeleteDC()` in that case.","locations":[{"ref":"src/msw/listbox.cpp:765-785","code":"  765 | bool wxListBox::MSWOnMeasure(WXMEASUREITEMSTRUCT *item)\n  766 | {\n  767 |     // only owner-drawn control should receive this message\n  768 |     wxCHECK( HasFlag(wxLB_OWNERDRAW), false );\n  769 | \n  770 |     MEASUREITEMSTRUCT *pStruct = (MEASUREITEMSTRUCT *)item;\n  771 | \n  772 |     HDC hdc = CreateIC(wxT(\"DISPLAY\"), nullptr, nullptr, 0);\n  773 | \n  774 |     {\n  775 |         wxDCTemp dc((WXHDC)hdc);\n  776 |         dc.SetFont(GetFont());\n  777 | \n  778 |         pStruct->itemHeight = dc.GetCharHeight() + 2 * LISTBOX_EXTRA_SPACE;\n  779 |         pStruct->itemWidth  = dc.GetCharWidth();\n  780 |     }\n  781 | \n  782 |     DeleteDC(hdc);\n  783 | \n  784 |     return true;\n  785 | }","lines":21,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/listbox.cpp#L765-L785"}]},
{"id":"ERR_20","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"negligible","difficulty":"very_easy","description":"In `wxApp::GetRegisteredClassName()`, the second `RegisterClass()` call registers the no-redraw variant (`wndclass.lpszClassName = regClass.regnameNR.t_str();`), but the failure diagnostic logs the wrong name: `wxLogLastError(wxString::Format(wxT(\"RegisterClass(%s)\"), regClass.regname));`. It should reference `regClass.regnameNR`. For the `RegClass_OnlyNR` case `regname` is empty, so the logged message becomes `RegisterClass()` with no class name, making the error report useless.","fix":"Log the actually-failing class name: change `regClass.regname` on line 595 to `regClass.regnameNR`.","locations":[{"ref":"src/msw/app.cpp:592-597","code":"  592 |     if ( !::RegisterClass(&wndclass) )\n  593 |     {\n  594 |         wxLogLastError(wxString::Format(wxT(\"RegisterClass(%s)\"),\n  595 |                        regClass.regname));\n  596 |         ::UnregisterClass(regClass.regname.c_str(), wxGetInstance());\n  597 |         return nullptr;","lines":6,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/app.cpp#L592-L597"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"medium","description":"`wxDataViewCtrl::DeleteColumn()` erases the column from `m_cols` and `m_colsBestWidths` but never updates `m_sortingColumnIdxs`, which stores *view indices* into `m_cols`. If the deleted column was a sort key, its stale index remains in `m_sortingColumnIdxs`; if it was the last column, that index now equals the new `m_cols.size()`. A subsequent `GetSortingColumn()` calls `GetColumn(m_sortingColumnIdxs.front())`, and `GetColumn()` does an unchecked `return m_cols[idx];`, causing an out-of-bounds vector access (UB/crash). Even when not out of range, every sort index `> idx` now points to the wrong column, so the control sorts by the wrong column. The same non-maintenance exists in `PrependColumn()`/`InsertColumn()`, which shift view indices without adjusting stored sort indices. `DeleteColumn()` should call `column->UnsetAsSortKey()` (or otherwise erase `idx` from `m_sortingColumnIdxs`) and decrement all remaining indices greater than `idx`.","fix":"In `DeleteColumn()`, before/after erasing, remove `idx` from `m_sortingColumnIdxs` if present and decrement every remaining stored index that is `> idx`, e.g. call `column->UnsetAsSortKey()` first, then fix up the surviving indices. Correspondingly, `PrependColumn()`/`InsertColumn()` should increment every stored sort index `>= pos`.","locations":[{"ref":"src/generic/datavgen.cpp:6188-6203","code":" 6188 | bool wxDataViewCtrl::DeleteColumn( wxDataViewColumn *column )\n 6189 | {\n 6190 |     const int idx = GetColumnIndex(column);\n 6191 |     if ( idx == wxNOT_FOUND )\n 6192 |         return false;\n 6193 | \n 6194 |     m_colsBestWidths.erase(m_colsBestWidths.begin() + idx);\n 6195 |     m_cols.erase(m_cols.begin() + idx);\n 6196 | \n 6197 |     if ( m_clientArea->GetCurrentColumn() == column )\n 6198 |         m_clientArea->ClearCurrentColumn();\n 6199 | \n 6200 |     OnColumnsCountChanged();\n 6201 | \n 6202 |     return true;\n 6203 | }","lines":16,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/datavgen.cpp#L6188-L6203"},{"ref":"src/generic/datavgen.cpp:6046-6049","code":" 6046 | wxDataViewColumn* wxDataViewCtrl::GetColumn( unsigned int idx ) const\n 6047 | {\n 6048 |     return m_cols[idx];\n 6049 | }","lines":4,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/datavgen.cpp#L6046-L6049"},{"ref":"src/generic/datavgen.cpp:6291-6297","code":" 6291 | wxDataViewColumn *wxDataViewCtrl::GetSortingColumn() const\n 6292 | {\n 6293 |     if ( m_sortingColumnIdxs.empty() )\n 6294 |         return nullptr;\n 6295 | \n 6296 |     return GetColumn(m_sortingColumnIdxs.front());\n 6297 | }","lines":7,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/datavgen.cpp#L6291-L6297"},{"ref":"src/generic/datavgen.cpp:5963-5983","code":" 5963 | bool wxDataViewCtrl::PrependColumn( wxDataViewColumn *col )\n 5964 | {\n 5965 |     if (!wxDataViewCtrlBase::PrependColumn(col))\n 5966 |         return false;\n 5967 | \n 5968 |     m_cols.insert(m_cols.begin(), col);\n 5969 |     m_colsBestWidths.insert(m_colsBestWidths.begin(), CachedColWidthInfo());\n 5970 |     OnColumnsCountChanged();\n 5971 |     return true;\n 5972 | }\n 5973 | \n 5974 | bool wxDataViewCtrl::InsertColumn( unsigned int pos, wxDataViewColumn *col )\n 5975 | {\n 5976 |     if (!wxDataViewCtrlBase::InsertColumn(pos,col))\n 5977 |         return false;\n 5978 | \n 5979 |     m_cols.insert(m_cols.begin() + pos, col);\n 5980 |     m_colsBestWidths.insert(m_colsBestWidths.begin() + pos, CachedColWidthInfo());\n 5981 |     OnColumnsCountChanged();\n 5982 |     return true;\n 5983 | }","lines":21,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/datavgen.cpp#L5963-L5983"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"very_easy","description":"`wxMethod::IsOk()` calls `wxLogError(\"'%s' method has invalid return type: %s\", m_retType.GetAsString());` — the format string has two `%s` conversions but only one argument is passed. Every other `wxLogError` call in this file that uses this exact message pattern (e.g. the very next check at `src/msw/../utils/ifacecheck/src/xmlparser.cpp` line `299`-`300`) passes `m_strName` first. Missing the `m_strName` argument here means the printf-style formatter will read an unrelated value off the stack/registers for the second `%s`, which is undefined behaviour and can crash `ifacecheck` or print garbage when it encounters a method with an invalid return type.","fix":"Pass the missing argument: `wxLogError(\"'%s' method has invalid return type: %s\", m_strName, m_retType.GetAsString());`","locations":[{"ref":"utils/ifacecheck/src/xmlparser.cpp:281-283","code":"  281 |     if (!m_retType.IsOk() && m_retType!=wxEmptyType) {\n  282 |         wxLogError(\"'%s' method has invalid return type: %s\", m_retType.GetAsString());\n  283 |         return false;","lines":3,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/utils/ifacecheck/src/xmlparser.cpp#L281-L283"}]},
{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`wxICOHandler::SaveFile` mutates the caller's input `wxImage` while saving. When the image has a non-black mask colour it calls `image->SetRGB(i, j, 0, 0, 0)` to black out masked pixels of the *original* image (not the temporary `mask`), and it also calls `image->SetOption(wxIMAGE_OPTION_BMP_FORMAT, bppFormat)`. A save operation should not alter the caller's data, but here pixel colours and image options are permanently changed after `SaveFile` returns.","fix":"Operate on a local copy instead of the caller's object, e.g. take `wxImage imageToSave = image->Copy();` at the top of the loop and apply `SetRGB`/`SetOption`/`SaveDib` to `imageToSave` (and its mask) rather than to `*image`.","locations":[{"ref":"src/common/imagbmp.cpp:1436-1445","code":" 1436 |                 for (i = 0; i < mask.GetWidth(); i++)\n 1437 |                 {\n 1438 |                     for (j = 0; j < mask.GetHeight(); j++)\n 1439 |                     {\n 1440 |                         if ((r == mask.GetRed(i, j)) &&\n 1441 |                             (g == mask.GetGreen(i, j))&&\n 1442 |                             (b == mask.GetBlue(i, j)) )\n 1443 |                                 image->SetRGB(i, j, 0, 0, 0 );\n 1444 |                     }\n 1445 |                 }","lines":10,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/imagbmp.cpp#L1436-L1445"},{"ref":"src/common/imagbmp.cpp:1491","code":" 1491 |         image->SetOption(wxIMAGE_OPTION_BMP_FORMAT, bppFormat);","lines":1,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/imagbmp.cpp#L1491"}]},
{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"`wxFileData::GetHint` builds a format string with `wxPLURAL(\"%ld byte\", \"%ld bytes\", m_size)` but passes `wxLongLong(m_size).ToString().c_str()` (a string pointer) as the argument to `wxString::Format`. The `%ld` specifier expects a `long`, not a C string, so this is a format-specifier/argument-type mismatch: in debug builds wxWidgets' type-safe `Format` asserts on the mismatch, and in release builds it interprets the pointer bits as a number, printing garbage instead of the file size. `m_size` is a 64-bit `wxFileOffset`, which is presumably why `ToString()` was introduced, but the format specifier was never updated to `%s`.","fix":"Use `%s` in the (translatable) format strings so they match the string argument, keeping `m_size` as the plural selector, e.g. `wxString::Format(wxPLURAL(\"%s byte\", \"%s bytes\", m_size), wxLongLong(m_size).ToString())`.","locations":[{"ref":"src/generic/filectrlg.cpp:274-276","code":"  274 |     else // plain file\n  275 |         s += wxString::Format(wxPLURAL(\"%ld byte\", \"%ld bytes\", m_size),\n  276 |                               wxLongLong(m_size).ToString().c_str());","lines":3,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/filectrlg.cpp#L274-L276"}]},
{"id":"API_5","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"very_easy","description":"`wxRegionGeneric::DoSubtract` is the only region-mutating method that does not call `AllocExclusive()` before writing into `M_REGIONDATA`. Every sibling mutator (`DoUnionWithRect`, `DoUnionWithRegion`, `DoIntersect`, `DoXor`, `DoOffset` at lines 332, 339, 345, 362, 368) calls `AllocExclusive()` first. `XSubtractRegion` reallocates and overwrites `this`'s `rects`/`extents` in place, so when the copy-on-write `wxGDIRefData` is shared (refcount > 1), the subtraction corrupts the region data seen by all other `wxRegion` copies sharing the same ref data.","fix":"Add `AllocExclusive();` before the `return` in `DoSubtract`, e.g.:\n```cpp\n    AllocExclusive();\n    return REGION::XSubtractRegion(M_REGIONDATA, M_REGIONDATA_OF(region), M_REGIONDATA);\n```","locations":[{"ref":"src/generic/regiong.cpp:349-358","code":"  349 | bool wxRegionGeneric::DoSubtract(const wxRegion& region)\n  350 | {\n  351 |     if ( region.IsEmpty() )\n  352 |     {\n  353 |         // nothing to do\n  354 |         return true;\n  355 |     }\n  356 | \n  357 |     return REGION::XSubtractRegion(M_REGIONDATA_OF(region),M_REGIONDATA,M_REGIONDATA);\n  358 | }","lines":10,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/regiong.cpp#L349-L358"}]},
{"id":"API_6","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"`wxEnumSymbolsCallback()` (the fallback bridge used when `SymEnumSymbolsW` is unavailable and `SymEnumSymbols` must be used instead) builds a `SYMBOL_INFOW` in a heap buffer sized `sizeof(SYMBOL_INFOW) + len*sizeof(WCHAR)` where `len = buf.length()` is the converted wide name's length (excluding its terminating NUL). It then does `wxStrncpy(infoW->Name, buf.data(), len)`, which for `wchar_t` maps to `wcsncpy(dest, src, len)`. Per the C standard, `wcsncpy`/`strncpy` only null-terminates the destination when the source is *shorter* than `n`; here `n == wcslen(src)` exactly, so `wcsncpy` copies exactly `len` characters and writes **no** terminating NUL. `infoW->Name` (and the freshly-`malloc`'d/uninitialized byte right after it) is therefore not a valid NUL-terminated string, even though the buffer does have room for one. Any downstream consumer of `infoW` (the user's `SymEnumSymbols` callback, which receives this struct) that reads `Name` as a C string can read past the allocated `symbolBuffer`, an out-of-bounds heap read.","fix":"Explicitly NUL-terminate after the copy instead of relying on `wxStrncpy`/`wcsncpy` to do it:\n\n```cpp\nwxStrncpy(infoW->Name, buf.data(), len);\ninfoW->Name[len] = L'\\0';\n```\n\n(The buffer is already sized to have room for this extra character, since `sizeof(SYMBOL_INFOW)` includes one `WCHAR` slot beyond `len`.)","locations":[{"ref":"src/msw/debughlp.cpp:825-854","code":"  825 | static BOOL CALLBACK\n  826 | wxEnumSymbolsCallback(PSYMBOL_INFO pSymInfo, ULONG SymbolSize, PVOID UserContext)\n  827 | {\n  828 |     wxEnumSymbolsCallbackBridge&\n  829 |         bridge = *static_cast<wxEnumSymbolsCallbackBridge*>(UserContext);\n  830 | \n  831 |     const wxWCharBuffer buf = wxConvLocal.cMB2WC(pSymInfo->Name);\n  832 |     const size_t len = buf.length();\n  833 | \n  834 |     // Allocate enough space for the wide char version of the struct.\n  835 |     //\n  836 |     // Note that there is no +1 here because sizeof(SYMBOL_INFOW) already\n  837 |     // includes 1 byte of the name.\n  838 |     wxScopedArray<BYTE> symbolBuffer(sizeof(SYMBOL_INFOW) + len*sizeof(WCHAR));\n  839 | \n  840 |     SYMBOL_INFOW* const infoW = (SYMBOL_INFOW*)symbolBuffer.get();\n  841 | \n  842 |     // Copy the original struct contents except for the last byte, which is the\n  843 |     // first byte of its (narrow) name that we don't need.\n  844 |     CopyMemory(infoW, pSymInfo, sizeof(SYMBOL_INFO) - sizeof(CHAR));\n  845 | \n  846 |     // Size is different for narrow and wide variants of the struct, so fix it\n  847 |     // up now.\n  848 |     infoW->SizeOfStruct = sizeof(SYMBOL_INFOW);\n  849 | \n  850 |     // Finally copy the converted name, which is the reason for doing all this.\n  851 |     wxStrncpy(infoW->Name, buf.data(), len);\n  852 | \n  853 |     return (*bridge.m_callback)(infoW, SymbolSize, bridge.m_data);\n  854 | }","lines":30,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/debughlp.cpp#L825-L854"}]},
{"id":"API_7","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"The unary `operator-()` of both `wxTimeSpan` and `wxDateSpan` is non-const and mutates the operand in place (it forwards to `Neg()`, which negates the members and returns `*this`). This violates the usual contract of unary minus, so an innocuous-looking expression like `wxTimeSpan b = -a;` silently negates `a` as a side effect. The non-mutating alternative is the separate `Negate()` method, but the operator form is the natural one users reach for.","fix":"Make unary minus return a negated copy without modifying the operand, e.g. `wxTimeSpan operator-() const { return Negate(); }` and `wxDateSpan operator-() const { return Negate(); }`, keeping `Neg()` for callers that intentionally want in-place negation.","locations":[{"ref":"include/wx/datetime.h:1284-1286","code":" 1284 |     wxTimeSpan& Neg() { m_diff = -GetValue(); return *this; }\n 1285 |         // negate the value of the timespan\n 1286 |     wxTimeSpan& operator-() { return Neg(); }","lines":3,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/datetime.h#L1284-L1286"},{"ref":"include/wx/datetime.h:1520-1522","code":" 1520 |     inline wxDateSpan& Neg();\n 1521 |         // inverse the sign of this timespan\n 1522 |     wxDateSpan& operator-() { return Neg(); }","lines":3,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/datetime.h#L1520-L1522"}]},
{"id":"API_8","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`wxCOMBaseStreamAdapter::Stat()` fills only `pstatstg->type` and `pstatstg->cbSize` and returns `S_OK`, leaving all other `STATSTG` fields (`pwcsName`, `grfMode`, `grfLocksSupported`, `clsid`, `grfStateBits`, timestamps, etc.) uninitialized. A COM client that inspects any of these fields (e.g. reads/frees `pwcsName`, which per the `IStream::Stat` contract must be `nullptr` unless `STATFLAG_NONAME` was passed) will read stack garbage, potentially freeing a wild pointer.","fix":"Zero the whole structure first, e.g. `*pstatstg = STATSTG{};` (or `wxZeroMemory(*pstatstg);`) before setting `type` and `cbSize.QuadPart`, guaranteeing `pwcsName == nullptr` and all other members well-defined.","locations":[{"ref":"include/wx/msw/private/comstream.h:98-104","code":"   98 |     virtual HRESULT STDMETHODCALLTYPE Stat(STATSTG *pstatstg, DWORD WXUNUSED(grfStatFlag)) override\n   99 |     {\n  100 |         pstatstg->type = STGTY_STREAM;\n  101 |         pstatstg->cbSize.QuadPart = m_stream->GetSize();\n  102 | \n  103 |         return S_OK;\n  104 |     }","lines":7,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/msw/private/comstream.h#L98-L104"}]},
{"id":"API_9","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"`printf(utf8Buffer);` passes locale-derived text directly as the format string. Locale display names (e.g. `LOCALE_SNATIVEDISPLAYNAME`) are arbitrary system data and can legitimately contain `%` characters; passing them as a format string is an uncontrolled-format-string bug (`CWE-134`) that reads garbage varargs and can crash (e.g. via `%s`/`%n`). This is a developer utility, so impact is limited, but it is a genuine defect.","fix":"Use an explicit format string:\n```c\nprintf(\"%s\", utf8Buffer);\n```","locations":[{"ref":"misc/languages/util/showlocales.c:63","code":"   63 |       printf(utf8Buffer);","lines":1,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/misc/languages/util/showlocales.c#L63"}]},
