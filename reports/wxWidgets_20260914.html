{"id":"OTHER_1","type":"other","type_label":"Other","severity":"medium","difficulty":"hard","description":"`wxWebViewIE::SetOfflineMode()`/`IsOfflineMode()` are documented and declared right next to an author's own admission that the feature doesn't work: `// FIXME: I seem to be able to access remote webpages even in offline mode...`. This means an application calling `SetOfflineMode(true)` to sandbox the embedded IE control from the network (e.g. to render only local/cached content for privacy or security reasons) gets a false sense of isolation, since remote pages can still be reached in practice.","fix":"Either fix the underlying `IWebBrowser2`/`MSHTML` offline-mode flag handling in the `.cpp` implementation so `SetOfflineMode(true)` actually blocks remote navigation (e.g. by also intercepting `BeforeNavigate2` and vetoing non-local URLs), or update the public API documentation/comment to explicitly warn callers that `SetOfflineMode()` is unreliable and must not be relied upon for security-sensitive isolation.","locations":[{"ref":"include/wx/msw/webview_ie.h:144-146","code":"  144 |     // FIXME: I seem to be able to access remote webpages even in offline mode...\n  145 |     bool IsOfflineMode();\n  146 |     void SetOfflineMode(bool offline);","lines":3,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/msw/webview_ie.h#L144-L146"}]},
{"id":"OTHER_2","type":"other","type_label":"Other","severity":"medium","difficulty":"hard","description":"`wxPaintDCExImpl` is used to wrap an already-open, externally-owned `HDC` (e.g. one supplied by the OS/framework) into a `wxPaintDC`. Its destructor does `m_hDC = 0;` purely `// prevent the base class dtor from ReleaseDC()ing it again`. But C++ destructor order runs the most-derived body first: `~wxPaintDCExImpl()` executes *before* `~wxPaintDCImpl()`. By the time `wxPaintDCImpl::~wxPaintDCImpl()` runs its `if ( m_hDC ) { SelectOldObjects(m_hDC); m_hDC = 0; }` check, `m_hDC` has already been zeroed by the derived dtor, so `SelectOldObjects()` is never called for a `wxPaintDCEx`. Any pen/brush/font/bitmap that was `SelectObject()`-ed into that externally-owned `HDC` during painting is therefore left selected in it after the wrapper object is destroyed: the original GDI objects are never restored, and the wx-owned GDI objects remain \"selected into\" a DC that outlives them, which prevents them from actually being freed by Windows (effectively a GDI handle leak) and corrupts the state the DC's real owner expects to find when it gets the `HDC` back.","fix":"The `m_hDC = 0` trick in `wxPaintDCExImpl::~wxPaintDCExImpl()` runs too early because derived destructors execute before base ones. Instead of nulling `m_hDC` in the derived dtor, add a separate flag that only controls whether `wxMSWDCImpl`'s final release/delete step runs, while always letting `wxPaintDCImpl::~wxPaintDCImpl()` call `SelectOldObjects()`:\n\n```cpp\n// wxMSWDCImpl (or a new field in wxPaintDCInfo/wxPaintDCImpl):\nbool m_ownsHDCForRelease = true;\n\n// wxPaintDCExImpl ctor:\nwxPaintDCExImpl::wxPaintDCExImpl(...) : wxPaintDCImpl(owner)\n{\n    ...\n    m_ownsHDCForRelease = false;   // don't touch m_hDC here\n}\n\n// wxMSWDCImpl::~wxMSWDCImpl(), guarded by the new flag instead of relying\n// on m_hDC being pre-zeroed:\nif ( m_hDC != 0 )\n{\n    SelectOldObjects(m_hDC);\n    if ( m_bOwnsDC )\n        ::DeleteDC(GetHdc());\n    else if ( m_ownsHDCForRelease )\n        ::ReleaseDC(...);\n    // else: externally owned HDC, do nothing further\n}\n```\n\nThis way `SelectOldObjects()` always runs (restoring the caller's previously-selected objects) while the actual release/delete of the externally-owned `HDC` is still skipped.","locations":[{"ref":"src/msw/dcclient.cpp:264-271","code":"  264 | wxPaintDCImpl::~wxPaintDCImpl()\n  265 | {\n  266 |     if ( m_hDC )\n  267 |     {\n  268 |         SelectOldObjects(m_hDC);\n  269 |         m_hDC = 0;\n  270 |     }\n  271 | }","lines":8,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/dcclient.cpp#L264-L271"},{"ref":"src/msw/dcclient.cpp:333-337","code":"  333 | wxPaintDCExImpl::~wxPaintDCExImpl()\n  334 | {\n  335 |     // prevent the base class dtor from ReleaseDC()ing it again\n  336 |     m_hDC = 0;\n  337 | }","lines":5,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/dcclient.cpp#L333-L337"}]},
{"id":"OTHER_3","type":"other","type_label":"Other","severity":"medium","difficulty":"medium","description":"In `wxRasStatusWindowProc()`, the `wxWM_RAS_DIALING_PROGRESS` handler fetches `wxDialUpManagerMSW *dialMan = wxDialUpManagerMSW::GetDialer();` and immediately calls `dialMan->OnDialProgress(...)` without checking `dialMan` for `nullptr` first. `OnDialProgress()` itself starts with `if ( !GetDialer() ) return;` (`src/msw/dialup.cpp:588-593`), which shows the author anticipated `GetDialer()` (i.e. `ms_dialer`) can become `nullptr` concurrently (e.g. after `CancelDialing()` clears `ms_dialer` while a `wxWM_RAS_DIALING_PROGRESS` message posted by the RAS callback thread is still in flight), but the null check happens *inside* the very member function that is invoked through the potentially-null `dialMan` pointer, which is undefined behaviour even though the member function happens not to touch `this` before returning.","fix":"Check for `nullptr` before calling through the pointer, not inside the callee:\n\n```cpp\ncase wxWM_RAS_DIALING_PROGRESS:\n    {\n        wxDialUpManagerMSW *dialMan = wxDialUpManagerMSW::GetDialer();\n        if ( dialMan )\n            dialMan->OnDialProgress((RASCONNSTATE)wParam, lParam);\n    }\n    break;\n```","locations":[{"ref":"src/msw/dialup.cpp:1243-1249","code":" 1243 |         case wxWM_RAS_DIALING_PROGRESS:\n 1244 |             {\n 1245 |                 wxDialUpManagerMSW *dialMan = wxDialUpManagerMSW::GetDialer();\n 1246 | \n 1247 |                 dialMan->OnDialProgress((RASCONNSTATE)wParam, lParam);\n 1248 |             }\n 1249 |             break;","lines":7,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/dialup.cpp#L1243-L1249"},{"ref":"src/msw/dialup.cpp:585-593","code":"  585 | void wxDialUpManagerMSW::OnDialProgress(RASCONNSTATE rasconnstate,\n  586 |                                         DWORD dwError)\n  587 | {\n  588 |     if ( !GetDialer() )\n  589 |     {\n  590 |         // this probably means that CancelDialing() was called and we get\n  591 |         // \"disconnected\" notification\n  592 |         return;\n  593 |     }","lines":9,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/dialup.cpp#L585-L593"}]},
{"id":"OTHER_4","type":"other","type_label":"Other","severity":"medium","difficulty":"very_easy","description":"In `hvApp::OnInit()`, `book` is a fixed-size stack array `wxString book[10]` (line 53), but the loop over command-line arguments appends to it via `book[bookCount] = argStr; bookCount++;` with no bounds check. Passing 11 or more book-like arguments (files whose names contain `.hhp`, `.htb`, or `.zip`) writes past the end of the array, causing a stack out-of-bounds write / corruption. The values come directly from `argv`.","fix":"Guard the append with a bounds check. Change:\n```cpp\n        if ( argStr.Find( wxT(\".hhp\") ) >= 0\n            || argStr.Find( wxT(\".htb\") ) >= 0\n            || argStr.Find( wxT(\".zip\") ) >= 0 )\n        {\n            book[bookCount] = argStr;\n            bookCount++;\n        }\n```\nto:\n```cpp\n        if ( argStr.Find( wxT(\".hhp\") ) >= 0\n            || argStr.Find( wxT(\".htb\") ) >= 0\n            || argStr.Find( wxT(\".zip\") ) >= 0 )\n        {\n            if ( bookCount < (int)WXSIZEOF(book) )\n                book[bookCount++] = argStr;\n        }\n```","locations":[{"ref":"utils/helpview/src/helpview.cpp:53","code":"   53 |     wxString book[10];","lines":1,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/utils/helpview/src/helpview.cpp#L53"},{"ref":"utils/helpview/src/helpview.cpp:82-88","code":"   82 |         if ( argStr.Find( wxT(\".hhp\") ) >= 0\n   83 |             || argStr.Find( wxT(\".htb\") ) >= 0\n   84 |             || argStr.Find( wxT(\".zip\") ) >= 0 )\n   85 |         {\n   86 |             book[bookCount] = argStr;\n   87 |             bookCount++;\n   88 |         }","lines":7,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/utils/helpview/src/helpview.cpp#L82-L88"}]},
{"id":"OTHER_5","type":"other","type_label":"Other","severity":"low","difficulty":"very_easy","description":"`wxGenericStaticBitmap::m_scaleMode` has no in-class initializer and the default constructor is `= default`, so an object created via the default (two-phase) constructor has an uninitialized `m_scaleMode`. `GetScaleMode()` would then return an indeterminate `ScaleMode` value if called before `Create()` (which is what sets it, per `src/generic/statbmpg.cpp:37`). Objects constructed via RTTI (`wxDECLARE_DYNAMIC_CLASS`) go through this default ctor.","fix":"Give the member a default value in its declaration:\n```cpp\n    ScaleMode m_scaleMode = Scale_None;\n```","locations":[{"ref":"include/wx/generic/statbmpg.h:18-57","code":"   18 |     wxGenericStaticBitmap() = default;\n   19 |     wxGenericStaticBitmap(wxWindow *parent,\n   20 |                           wxWindowID id,\n   21 |                           const wxBitmapBundle& bitmap,\n   22 |                           const wxPoint& pos = wxDefaultPosition,\n   23 |                           const wxSize& size = wxDefaultSize,\n   24 |                           long style = 0,\n   25 |                           const wxString& name = wxASCII_STR(wxStaticBitmapNameStr))\n   26 |     {\n   27 |             Create(parent, id, bitmap, pos, size, style, name);\n   28 |     }\n   29 | \n   30 |     bool Create(wxWindow *parent,\n   31 |                 wxWindowID id,\n   32 |                 const wxBitmapBundle& bitmap,\n   33 |                 const wxPoint& pos = wxDefaultPosition,\n   34 |                 const wxSize& size = wxDefaultSize,\n   35 |                 long style = 0,\n   36 |                 const wxString& name = wxASCII_STR(wxStaticBitmapNameStr));\n   37 | \n   38 |     virtual void SetBitmap(const wxBitmapBundle& bitmap) override\n   39 |     {\n   40 |         m_bitmapBundle = bitmap;\n   41 |         InvalidateBestSize();\n   42 |         SetSize(GetBestSize());\n   43 |         Refresh();\n   44 |     }\n   45 | \n   46 |     virtual void SetScaleMode(ScaleMode scaleMode) override\n   47 |     {\n   48 |         m_scaleMode = scaleMode;\n   49 |         Refresh();\n   50 |     }\n   51 | \n   52 |     virtual ScaleMode GetScaleMode() const override { return m_scaleMode; }\n   53 | \n   54 | private:\n   55 |     void OnPaint(wxPaintEvent& event);\n   56 | \n   57 |     ScaleMode m_scaleMode;","lines":40,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/generic/statbmpg.h#L18-L57"}]},
{"id":"OTHER_6","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"Both `wxLongLong::asArray()` and `wxULongLong::asArray()` return a pointer to a function-local `static unsigned char temp[8]`. This buffer is shared across all calls, so it is not reentrant/thread-safe and the returned pointer is silently overwritten by the next `asArray()` call, so a caller cannot hold two results at once. The two function bodies are also byte-for-byte identical duplicates.","fix":"Have callers pass in a buffer (or return a small `std::array<unsigned char,8>` by value) instead of returning a pointer to a shared `static` buffer; factor the shared serialization logic into one helper.","locations":[{"ref":"src/common/longlong.cpp:32-46","code":"   32 | void *wxLongLong::asArray() const\n   33 | {\n   34 |     static unsigned char temp[8];\n   35 | \n   36 |     temp[0] = wx_truncate_cast(unsigned char, ((m_ll >> 56) & 0xFF));\n   37 |     temp[1] = wx_truncate_cast(unsigned char, ((m_ll >> 48) & 0xFF));\n   38 |     temp[2] = wx_truncate_cast(unsigned char, ((m_ll >> 40) & 0xFF));\n   39 |     temp[3] = wx_truncate_cast(unsigned char, ((m_ll >> 32) & 0xFF));\n   40 |     temp[4] = wx_truncate_cast(unsigned char, ((m_ll >> 24) & 0xFF));\n   41 |     temp[5] = wx_truncate_cast(unsigned char, ((m_ll >> 16) & 0xFF));\n   42 |     temp[6] = wx_truncate_cast(unsigned char, ((m_ll >> 8)  & 0xFF));\n   43 |     temp[7] = wx_truncate_cast(unsigned char, ((m_ll >> 0)  & 0xFF));\n   44 | \n   45 |     return temp;\n   46 | }","lines":15,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/longlong.cpp#L32-L46"},{"ref":"src/common/longlong.cpp:48-62","code":"   48 | void *wxULongLong::asArray() const\n   49 | {\n   50 |     static unsigned char temp[8];\n   51 | \n   52 |     temp[0] = wx_truncate_cast(unsigned char, ((m_ll >> 56) & 0xFF));\n   53 |     temp[1] = wx_truncate_cast(unsigned char, ((m_ll >> 48) & 0xFF));\n   54 |     temp[2] = wx_truncate_cast(unsigned char, ((m_ll >> 40) & 0xFF));\n   55 |     temp[3] = wx_truncate_cast(unsigned char, ((m_ll >> 32) & 0xFF));\n   56 |     temp[4] = wx_truncate_cast(unsigned char, ((m_ll >> 24) & 0xFF));\n   57 |     temp[5] = wx_truncate_cast(unsigned char, ((m_ll >> 16) & 0xFF));\n   58 |     temp[6] = wx_truncate_cast(unsigned char, ((m_ll >> 8)  & 0xFF));\n   59 |     temp[7] = wx_truncate_cast(unsigned char, ((m_ll >> 0)  & 0xFF));\n   60 | \n   61 |     return temp;\n   62 | }","lines":15,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/longlong.cpp#L48-L62"}]},
{"id":"OTHER_7","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"`wxLocaleIdent::AddLikelySubtags` accesses `subtags[1]` and `subtags[2]` after `wxSplit(toTag, '-', '\\0')`, relying solely on the comment that matches \"always consist of ... 3 subtags\". If `wxUILocaleImpl::GetLikelySubtags` ever returns a value with fewer than 3 hyphen-separated parts, `subtags[1]`/`subtags[2]` is an out-of-bounds `wxArrayString` access (assert in debug, undefined behavior in release).","fix":"Bail out defensively if the split result is too short, e.g. `if ( subtags.size() < 3 ) return wxLocaleIdent();` before using `subtags[1]`/`subtags[2]`.","locations":[{"ref":"src/common/uilocale.cpp:346-359","code":"  346 |     const wxArrayString& subtags = wxSplit(toTag, '-', '\\0');\n  347 | \n  348 |     // Attribute m_tag needs to be cleared, because it contains the tag value of the original identifier\n  349 |     locId.m_tag.clear();\n  350 | \n  351 |     // Fill in script and region subtags, if they were originally empty\n  352 |     if (script.empty())\n  353 |     {\n  354 |         locId.Script(subtags[1]);\n  355 |     }\n  356 |     if (region.empty())\n  357 |     {\n  358 |         locId.Region(subtags[2]);\n  359 |     }","lines":14,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/uilocale.cpp#L346-L359"}]},
{"id":"OTHER_8","type":"other","type_label":"Other","severity":"low","difficulty":"very_easy","description":"The paper-name string emitted into the PostScript DSC comment `%%DocumentPaperSizes:` for `wxPAPER_QUARTO` is misspelled `\"Quaro\"` instead of `\"Quarto\"`, producing incorrect metadata in generated PostScript output.","fix":"Change `case wxPAPER_QUARTO: paper = wxT(\"Quaro\"); break;` to `case wxPAPER_QUARTO: paper = wxT(\"Quarto\"); break;`","locations":[{"ref":"src/generic/dcpsg.cpp:1697","code":" 1697 |        case wxPAPER_QUARTO: paper = wxT(\"Quaro\"); break;        // Quarto, 215-by-275-millimeter paper","lines":1,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/dcpsg.cpp#L1697"}]},
{"id":"OTHER_9","type":"other","type_label":"Other","severity":"low","difficulty":"very_easy","description":"`wxSlider::Init()` initializes `m_scrollEventType`, `m_needThumbRelease`, `m_blockScrollEvent`, `m_tickFreq` and `m_scale`, but does NOT initialize the `m_pos` member (a `double`). The default constructor `wxSlider::wxSlider()` calls only `Init()`, so after default construction `m_pos` holds an indeterminate value. `GetValue()` returns `wxRound(m_pos)`, so calling `GetValue()` on a default-constructed-but-not-yet-`Create()`d slider reads an uninitialized member (undefined behavior). `Create()` happens to set `m_pos = value` afterwards, masking the issue in the normal path.","fix":"Add `m_pos = 0;` to `wxSlider::Init()` alongside the other member initializations.","locations":[{"ref":"src/gtk/slider.cpp:285-292","code":"  285 | void wxSlider::Init()\n  286 | {\n  287 |     m_scrollEventType = GTK_SCROLL_NONE;\n  288 |     m_needThumbRelease = false;\n  289 |     m_blockScrollEvent = false;\n  290 |     m_tickFreq = 0;\n  291 |     m_scale = nullptr;\n  292 | }","lines":8,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/gtk/slider.cpp#L285-L292"}]},
{"id":"OTHER_10","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"`wxIniConfig::DoReadString()` and `wxIniConfig::IsEmpty()` both read INI values into a fixed-size `wxChar szBuf[1024]` passed to `GetPrivateProfileString()`/`GetProfileString()`. The code even has a `// FIXME: should dynamically allocate memory...` comment acknowledging this. Any value longer than 1023 characters is silently truncated by the Win32 API with no way for the caller to detect the truncation, so `wxIniConfig::Read()` can quietly return a corrupted/incomplete string for long values.","fix":"Retry with a growing buffer (or call `GetPrivateProfileString` once with a large heap buffer, e.g. via `wxCharBuffer`) when the returned length equals `WXSIZEOF(szBuf) - 1`, which is how the Win32 API signals the buffer was too small, instead of relying on a fixed `1024`-`wxChar` stack buffer.","locations":[{"ref":"src/msw/iniconf.cpp:272-297","code":"  272 | bool wxIniConfig::DoReadString(const wxString& szKey, wxString *pstr) const\n  273 | {\n  274 |   wxConfigPathChanger path(this, szKey);\n  275 |   wxString strKey = GetPrivateKeyName(path.Name());\n  276 | \n  277 |   wxChar szBuf[1024]; // FIXME: should dynamically allocate memory...\n  278 | \n  279 |   // first look in the private INI file\n  280 | \n  281 |   // NB: the lpDefault param to GetPrivateProfileString can't be null\n  282 |   GetPrivateProfileString(m_strGroup.t_str(), strKey.t_str(), wxT(\"\"),\n  283 |                           szBuf, WXSIZEOF(szBuf),\n  284 |                           m_strLocalFilename.t_str());\n  285 |   if ( wxIsEmpty(szBuf) ) {\n  286 |     // now look in win.ini\n  287 |     wxString strWinKey = GetKeyName(path.Name());\n  288 |     GetProfileString(m_strGroup.t_str(), strWinKey.t_str(),\n  289 |                      wxT(\"\"), szBuf, WXSIZEOF(szBuf));\n  290 |   }\n  291 | \n  292 |   if ( wxIsEmpty(szBuf) )\n  293 |     return false;\n  294 | \n  295 |   *pstr = szBuf;\n  296 |   return true;\n  297 | }","lines":26,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/iniconf.cpp#L272-L297"},{"ref":"src/msw/iniconf.cpp:251-266","code":"  251 | bool wxIniConfig::IsEmpty() const\n  252 | {\n  253 |     wxChar szBuf[1024];\n  254 | \n  255 |     GetPrivateProfileString(m_strGroup.t_str(), nullptr, wxT(\"\"),\n  256 |                             szBuf, WXSIZEOF(szBuf),\n  257 |                             m_strLocalFilename.t_str());\n  258 |     if ( !wxIsEmpty(szBuf) )\n  259 |         return false;\n  260 | \n  261 |     GetProfileString(m_strGroup.t_str(), nullptr, wxT(\"\"), szBuf, WXSIZEOF(szBuf));\n  262 |     if ( !wxIsEmpty(szBuf) )\n  263 |         return false;\n  264 | \n  265 |     return true;\n  266 | }","lines":16,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/iniconf.cpp#L251-L266"}]},
{"id":"OTHER_11","type":"other","type_label":"Other","severity":"low","difficulty":"very_easy","description":"In `wxMakeMetafilePlaceable()`, `FILE *fd = wxFopen(filename.fn_str(), wxT(\"rb\"));` is opened at `src/msw/metafile.cpp:367`, but the two early `return false;` statements that follow it (`src/msw/metafile.cpp:371-372` when `tempFileBuf` is empty, and `src/msw/metafile.cpp:375-376` when `fHandle` fails to open) return without ever calling `fclose(fd)`. Both paths leak the open `FILE*` handle for `filename`.","fix":"Close `fd` before returning on both early-exit paths:\n\n```cpp\nwxString tempFileBuf = wxFileName::CreateTempFileName(wxT(\"mf\"));\nif (tempFileBuf.empty())\n{\n    fclose(fd);\n    return false;\n}\n\nFILE *fHandle = wxFopen(tempFileBuf.fn_str(), wxT(\"wb\"));\nif (!fHandle)\n{\n    fclose(fd);\n    return false;\n}\n```","locations":[{"ref":"src/msw/metafile.cpp:367-376","code":"  367 |     FILE *fd = wxFopen(filename.fn_str(), wxT(\"rb\"));\n  368 |     if (!fd) return false;\n  369 | \n  370 |     wxString tempFileBuf = wxFileName::CreateTempFileName(wxT(\"mf\"));\n  371 |     if (tempFileBuf.empty())\n  372 |         return false;\n  373 | \n  374 |     FILE *fHandle = wxFopen(tempFileBuf.fn_str(), wxT(\"wb\"));\n  375 |     if (!fHandle)\n  376 |         return false;","lines":10,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/metafile.cpp#L367-L376"}]},
{"id":"OTHER_12","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"`wxListLineData::IsChecked()` is a pure accessor that does not modify state but is not declared `const`, unlike the neighbouring `HasImage()`/`HasText()` accessors, so it cannot be called on a `const wxListLineData&`.","fix":"Declare it const: change `bool IsChecked() { return m_checked; }` to `bool IsChecked() const { return m_checked; }`.","locations":[{"ref":"include/wx/generic/private/listctrl.h:250-251","code":"  250 |     void Check(bool check) { m_checked = check; }\n  251 |     bool IsChecked() { return m_checked; }","lines":2,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/generic/private/listctrl.h#L250-L251"}]},
{"id":"OTHER_13","type":"other","type_label":"Other","severity":"negligible","difficulty":"easy","description":"`wxPoint2DInt::SetVectorLength()` and `wxPoint2DDouble::SetVectorLength()` divide by `before = GetVectorLength()` without guarding against a zero-length vector, producing a division by zero (NaN/Inf, or for the int version undefined behavior via the subsequent `(wxInt32)` cast) when called on a `(0,0)` point, including via `Normalize()`.","fix":"Guard against `before == 0` (e.g. return early leaving the point at the origin) before dividing in both `SetVectorLength` implementations.","locations":[{"ref":"include/wx/geometry.h:183-193","code":"  183 | inline void wxPoint2DInt::SetVectorLength( wxDouble length )\n  184 | {\n  185 |     wxDouble before = GetVectorLength();\n  186 |     m_x = (wxInt32)(m_x * length / before);\n  187 |     m_y = (wxInt32)(m_y * length / before);\n  188 | }\n  189 | \n  190 | inline void wxPoint2DInt::Normalize()\n  191 | {\n  192 |     SetVectorLength( 1 );\n  193 | }","lines":11,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/geometry.h#L183-L193"},{"ref":"include/wx/geometry.h:431-441","code":"  431 | inline void wxPoint2DDouble::SetVectorLength( wxDouble length )\n  432 | {\n  433 |     wxDouble before = GetVectorLength() ;\n  434 |     m_x = (m_x * length / before) ;\n  435 |     m_y = (m_y * length / before) ;\n  436 | }\n  437 | \n  438 | inline void wxPoint2DDouble::Normalize()\n  439 | {\n  440 |     SetVectorLength( 1 );\n  441 | }","lines":11,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/geometry.h#L431-L441"}]},
{"id":"OTHER_14","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"The `// Name:` header comment gives the wrong path. `webview_webkit.h` claims `include/gtk/wx/webview.h` and `webviewhistoryitem_webkit.h` claims `include/wx/gtk/webviewhistoryitem.h`; both differ from the real file names, which is mildly misleading for anyone grepping by the recorded name.","fix":"Correct the `Name:` lines to the actual paths `wx/gtk/webview_webkit.h` and `wx/gtk/webviewhistoryitem_webkit.h`.","locations":[{"ref":"include/wx/gtk/webview_webkit.h:2","code":"    2 | // Name:        include/gtk/wx/webview.h","lines":1,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/gtk/webview_webkit.h#L2"},{"ref":"include/wx/gtk/webviewhistoryitem_webkit.h:2","code":"    2 | // Name:        include/wx/gtk/webviewhistoryitem.h","lines":1,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/gtk/webviewhistoryitem_webkit.h#L2"}]},
{"id":"OTHER_15","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"The loop counter `i` is declared `int` and compared against `sizeof(winLocaleTypes) / sizeof(winLocaleTypes[0])`, which has unsigned type `size_t`, producing a signed/unsigned comparison mismatch (compiler warning). It is harmless here because the count is small and positive, but the mismatch is a real lint defect.","fix":"Declare the counter as unsigned, e.g. `size_t i;` (or `for (size_t i = 0; ...)`), matching the type of the sizeof expression.","locations":[{"ref":"misc/languages/util/showlocales.c:50-53","code":"   50 |   int i;\n   51 | \n   52 |   // Loop through all specified LCTYPES and do GetLocaleInfoEx on them\n   53 |   for (i = 0; i < sizeof(winLocaleTypes) / sizeof(winLocaleTypes[0]); i++)","lines":4,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/misc/languages/util/showlocales.c#L50-L53"}]}

<div id="hidden-bar"></div>
<div id="content"></div>
</div>
<script>
(function(){
'use strict';

// Data
const FINDINGS     = JSON.parse(document.getElementById('D').textContent);
const PROJECT_INFO = JSON.parse(document.getElementById('PI').textContent);
const SEVS     = ['critical','high','medium','low','negligible'];
const STATUSES = ['open','fixed','wont-fix','false-positive'];
const ALL_TYPES = [...new Set(FINDINGS.map(f => f.type))].sort(cmpTypes);
// Build lookup map for O(1) access
const FINDING_BY_ID = new Map(FINDINGS.map(f => [f.id, f]));
// Only severities actually present in the report — the filter bar hides the rest.
const PRESENT_SEVS = SEVS.filter(s => FINDINGS.some(f => (f.severity || 'medium') === s));
// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.
const DIFFICULTY_ORDER = ['very_easy','easy','medium','hard'];
const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};
const PRESENT_DIFFS = DIFFICULTY_ORDER.filter(d => FINDINGS.some(f => f.difficulty === d));
const HAS_DIFFICULTY = PRESENT_DIFFS.length > 0;
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State
const S = {
  search: '', searchScope: 'all', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenDiff: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(),
};
const statuses = {};

// Persistence
function loadStatuses() {
  try { Object.assign(statuses, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch {}
}
function saveStatuses() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(statuses)); } catch {}
}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;
function syncHash() {
  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));
    if (S.search)            p.set('q',   S.search);
    if (S.searchScope !== 'all') p.set('qs', S.searchScope);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('qs'))  { S.searchScope = p.get('qs'); }
  document.getElementById('search-scope').classList.toggle('active', S.searchScope === 'locations');
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }
function isCustom(t)  { return String(t).toLowerCase() === 'custom'; }
function typeCls(t)   { return 'type-badge' + (isCustom(t) ? ' custom-type' : ''); }
// 'custom' findings are the user's own externally-sourced ones; pin them first
// everywhere types are listed so they never blend into the audit's own categories.
function cmpTypes(a, b) {
  if (isCustom(a) !== isCustom(b)) return isCustom(a) ? -1 : 1;
  return String(a).localeCompare(String(b));
}

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Render a "**Label:** value" line. GitHub/CommonMark only recognizes a
// ``` fence when it starts at the beginning of a line, so if the value
// itself opens with a fence, put it on its own line instead of right
// after the inline label - otherwise the fence marker gets glued onto
// "**Label:** ```" and never renders as a code block.
function mdField(label, value) {
  value = value || '';
  return /^```/.test(value.trim())
    ? '**' + label + ':**\n\n' + value
    : '**' + label + ':** ' + value;
}

// Render the "**Locations:**" block. When a location has a commit-pinned
// permalink (GitHub/GitLab), just paste the bare URL on its own line -
// GitHub/GitLab auto-expand a line-range blob link into an inline code
// preview, so re-pasting the snippet as a fenced block would duplicate it.
// Forges without a detected permalink shape (or missing commit/repo info)
// fall back to the fenced ref+snippet so the location is still readable.
function mdLocations(locations) {
  if (!locations.length) return '';
  let out = '**Locations:**\n\n';
  for (const l of locations) {
    if (l.link)               out += l.link + '\n\n';
    else if (l.code != null)  out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
    else                      out += '- `' + l.ref + '` _(file not found)_\n\n';
  }
  return out;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort(cmpTypes);

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += mdField('Description', f.description) + '\n\n';
      out += mdLocations(f.locations);
      out += mdField('Fix', f.fix) + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build a [project] header block from embedded PROJECT_INFO, so the exported
// findings.toml is self-contained (doesn't depend on a sibling project-info.toml
// that a second, separately-triggered download could silently fail to save).
// '' when there is no project info at all.
function buildProjectToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = PROJECT_INFO || {};
  if (!Object.keys(pi).length) return '';
  const lines = ['[project]'];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n\n';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    // Pin the id so re-rendering this export - or filtering it down later - can't
    // renumber findings that were already referenced by id elsewhere.
    if (f.id && f.id !== '?') lns.push(pad('id') + '= ' + tomlStr(f.id));
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return buildProjectToml() + chunks.join('\n\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += mdField('Description', f.description) + '\n\n';
  out += mdLocations(f.locations);
  out += mdField('Fix', f.fix) + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'folder') {
    if (!f.locations.length) return '(no location)';
    const path = f.locations[0].ref.replace(/:.*/,'');
    const idx = path.lastIndexOf('/');
    return idx === -1 ? '(root)' : path.slice(0, idx);
  }
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystacks per finding (cleared on full re-render).
// Two variants: everything (default), and file/folder paths only - for when a
// search term (e.g. a directory name like 'dlls/abc') also happens to appear
// inside description/fix prose and you only want path matches.
const _hay = new Map();
const _hayLoc = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}
function hayLocOf(f) {
  if (!_hayLoc.has(f.id)) {
    _hayLoc.set(f.id, f.locations.map(l => l.ref).join(' ').toLowerCase());
  }
  return _hayLoc.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (S.searchScope === 'locations') {
      if (!hayLocOf(f).includes(q)) return false;
    } else if (!hayOf(f).includes(q) && !st.includes(q)) {
      return false;
    }
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  if (S.groupBy === 'type') return [...keys].sort(cmpTypes);
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge ' + typeCls(f.type) + '" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge ' + typeCls(t) + '" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  _hayLoc.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    // Single download (was two) - a second auto-triggered download is commonly
    // blocked by the browser unless the user explicitly allows it, which silently
    // drops project-info.toml. Embedding [project] in findings.toml itself avoids
    // that failure mode entirely.
    downloadText(buildFindingsToml(), 'findings.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});
document.getElementById('search-scope').addEventListener('click', e => {
  S.searchScope = S.searchScope === 'locations' ? 'all' : 'locations';
  e.currentTarget.classList.toggle('active', S.searchScope === 'locations');
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
