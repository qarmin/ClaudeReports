{"id":"DEAD_18","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `wxAuiMSWTabArt::DrawButton()` a local `btnRect` is built from `rect` and its width reduced by `wnd->FromDIP(1)`, but the following `hTheme.DrawBackground(...)` passes `rect`, not `btnRect`. `btnRect` is never used, so the intended 1-DIP width reduction has no effect and the variable is dead.","fix":"Either draw with the adjusted rectangle or drop the dead variable:\n```cpp\n    hTheme.DrawBackground(\n        GetHdcOf(dc.GetTempHDC()),\n        rect,   // was intended to be btnRect\n        part,\n        btnState\n    );\n```","locations":[{"ref":"src/aui/tabartmsw.cpp:406-414","code":"  406 |     wxRect btnRect(rect);\n  407 |     btnRect.width -= wnd->FromDIP(1);\n  408 | \n  409 |     hTheme.DrawBackground(\n  410 |         GetHdcOf(dc.GetTempHDC()),\n  411 |         rect,\n  412 |         part,\n  413 |         btnState\n  414 |     );","lines":9,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/aui/tabartmsw.cpp#L406-L414"}]},
{"id":"DEAD_19","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `wxAcceleratorEntry::ParseAccel()` the local `bool skip` is reset to `false` at the top of every loop iteration; the only place it is set `true` (the `num ` handling) is immediately followed by `continue`, so the `if ( !skip && ... )` test never observes a `true` value. `skip` is effectively dead and misleadingly implies cross-iteration state that does not exist.","fix":"Remove `skip` and its `!skip` guard, `continue` directly in the `num ` branch:\n```cpp\n        else if ( CompareAccelString(current, wxTRANSLATE_IN_CONTEXT(\"keyboard key\", \"num \")) )\n        {\n            current += label[n];\n            continue;\n        }\n```","locations":[{"ref":"src/common/accelcmn.cpp:181-205","code":"  181 |     for ( size_t n = (size_t)posTab; n < label.length(); n++ )\n  182 |     {\n  183 |         bool skip = false;\n  184 |         if ( !skip && ( (label[n] == '+') || (label[n] == '-') ) )\n  185 |         {\n  186 |             if ( CompareAccelString(current, wxTRANSLATE_IN_CONTEXT(\"keyboard key\", \"Ctrl\")) )\n  187 |                 accelFlags |= wxACCEL_CTRL;\n  188 |             else if ( CompareAccelString(current, wxTRANSLATE_IN_CONTEXT(\"keyboard key\", \"Alt\")) )\n  189 |                 accelFlags |= wxACCEL_ALT;\n  190 |             else if ( CompareAccelString(current, wxTRANSLATE_IN_CONTEXT(\"keyboard key\", \"Shift\")) )\n  191 |                 accelFlags |= wxACCEL_SHIFT;\n  192 |             // Note that we don't need to check for translations of \"RawCtrl\",\n  193 |             // this is not something the end user should ever see.\n  194 |             else if ( current.CmpNoCase(\"rawctrl\") == 0 )\n  195 |                 accelFlags |= wxACCEL_RAW_CTRL;\n  196 |             else if ( CompareAccelString(current, wxTRANSLATE_IN_CONTEXT(\"keyboard key\", \"num \")) )\n  197 |             {\n  198 |                 // This isn't really a modifier, but is part of the name of keys\n  199 |                 // that have a =/- in them (e.g. num + and num -)\n  200 |                 // So we want to skip the processing if we see it\n  201 |                 skip = true;\n  202 |                 current += label[n];\n  203 | \n  204 |                 continue;\n  205 |             }","lines":25,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/accelcmn.cpp#L181-L205"}]},
{"id":"DEAD_20","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `wxNativeFontInfo::FromUserString()` the token `wxS(\"semibold\")` is tested twice in the same `if/else if` chain. The first branch (around line 1174) already handles `\"semibold\"`, so the second identical `else if ( token == wxS(\"semibold\") || token == _(\"semibold\") )` block is unreachable dead code (probably a copy/paste that was meant to be a different weight).","fix":"Delete the duplicated unreachable block:\n```cpp\n        else if ( token == wxS(\"semibold\") || token == _(\"semibold\") )\n        {\n            SetWeight(wxFONTWEIGHT_SEMIBOLD);\n            weightfound = true;\n        }\n```\n(the second occurrence at lines 1194-1198).","locations":[{"ref":"src/common/fontcmn.cpp:1174-1178","code":" 1174 |         else if ( token == wxS(\"semibold\") || token == _(\"semibold\") )\n 1175 |         {\n 1176 |             SetWeight(wxFONTWEIGHT_SEMIBOLD);\n 1177 |             weightfound = true;\n 1178 |         }","lines":5,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/fontcmn.cpp#L1174-L1178"},{"ref":"src/common/fontcmn.cpp:1194-1198","code":" 1194 |         else if ( token == wxS(\"semibold\") || token == _(\"semibold\") )\n 1195 |         {\n 1196 |             SetWeight(wxFONTWEIGHT_SEMIBOLD);\n 1197 |             weightfound = true;\n 1198 |         }","lines":5,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/fontcmn.cpp#L1194-L1198"}]},
{"id":"DEAD_21","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `wxStringTokenizer::GetNextToken()`, the assignment `m_lastDelim = (pos == m_stringEnd) ? wxT('\\0') : (wxChar)*pos;` is inside the `else` branch of `if ( pos == m_stringEnd )`, so `pos == m_stringEnd` is always false here and the conditional always evaluates to `(wxChar)*pos`. The ternary is dead code that can mislead a reader into thinking `pos` might equal `m_stringEnd` at this point.","fix":"Simplify the dead conditional. Before:\n```cpp\n            m_lastDelim = (pos == m_stringEnd) ? wxT('\\0') : (wxChar)*pos;\n```\nAfter:\n```cpp\n            m_lastDelim = (wxChar)*pos;\n```","locations":[{"ref":"src/common/tokenzr.cpp:279-293","code":"  279 |         else // we found a delimiter at pos\n  280 |         {\n  281 |             // in wxTOKEN_RET_DELIMS mode we return the delimiter character\n  282 |             // with token, otherwise leave it out\n  283 |             wxString::const_iterator tokenEnd(pos);\n  284 |             if ( m_mode == wxTOKEN_RET_DELIMS )\n  285 |                 ++tokenEnd;\n  286 | \n  287 |             token.assign(m_pos, tokenEnd);\n  288 | \n  289 |             // skip the token and the trailing delimiter\n  290 |             m_pos = pos + 1;\n  291 | \n  292 |             m_lastDelim = (pos == m_stringEnd) ? wxT('\\0') : (wxChar)*pos;\n  293 |         }","lines":15,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/tokenzr.cpp#L279-L293"}]},
{"id":"DEAD_22","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `wxAcceleratorTable::Add()`, `AllocExclusive()` is called first and always guarantees `m_refData` is non-null (it invokes `CreateRefData()` when the pointer is null). The subsequent `if ( !m_refData ) { m_refData = new wxAccelRefData; }` block can therefore never execute and is dead code.","fix":"Remove the redundant `if ( !m_refData ) { m_refData = new wxAccelRefData; }` block; `AllocExclusive()` already ensures `m_refData` is valid.","locations":[{"ref":"src/generic/accel.cpp:107-115","code":"  107 |     AllocExclusive();\n  108 | \n  109 |     if ( !m_refData )\n  110 |     {\n  111 |         m_refData = new wxAccelRefData;\n  112 |     }\n  113 | \n  114 |     M_ACCELDATA->m_accels.emplace_back(entry);\n  115 | }","lines":9,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/accel.cpp#L107-L115"}]},
{"id":"DEAD_23","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"`gtk_dataview_motion_notify_callback()` computes a `path` via `gtk_tree_view_get_path_at_pos()` and then, if a path was found, fills a local `GtkTreeIter iter` via `get_iter(&iter, path)` and immediately discards both `path` and `iter` before returning `FALSE`. Nothing is done with the result, so the whole body is effectively dead code. Worse, `get_iter()` has the side effect of calling `BuildBranch()` on ancestor nodes, so this pointless lookup runs on every mouse-motion event over the control, doing needless work.","fix":"Remove the unused `path`/`iter` lookup (or the entire callback and its `g_signal_connect (m_treeview, \"motion_notify_event\", ...)` registration at line 4825) since it produces no observable effect.","locations":[{"ref":"src/gtk/dataview.cpp:4584-4621","code":" 4584 | static gboolean\n 4585 | gtk_dataview_motion_notify_callback( GtkWidget *WXUNUSED(widget),\n 4586 |                                      GdkEventMotion *gdk_event,\n 4587 |                                      wxDataViewCtrl *dv )\n 4588 | {\n 4589 |     int x = int(gdk_event->x);\n 4590 |     int y = int(gdk_event->y);\n 4591 |     if (gdk_event->is_hint)\n 4592 |     {\n 4593 | #ifdef __WXGTK3__\n 4594 |         gdk_window_get_device_position(gdk_event->window, gdk_event->device, &x, &y, nullptr);\n 4595 | #else\n 4596 |         gdk_window_get_pointer(gdk_event->window, &x, &y, nullptr);\n 4597 | #endif\n 4598 |     }\n 4599 | \n 4600 |     wxGtkTreePath path;\n 4601 |     GtkTreeViewColumn *column = nullptr;\n 4602 |     gint cell_x = 0;\n 4603 |     gint cell_y = 0;\n 4604 |     if (gtk_tree_view_get_path_at_pos(\n 4605 |         GTK_TREE_VIEW(dv->GtkGetTreeView()),\n 4606 |         x, y,\n 4607 |         path.ByRef(),\n 4608 |         &column,\n 4609 |         &cell_x,\n 4610 |         &cell_y))\n 4611 |     {\n 4612 |         if (path)\n 4613 |         {\n 4614 |             GtkTreeIter iter;\n 4615 |             dv->GtkGetInternal()->get_iter( &iter, path );\n 4616 |         }\n 4617 |     }\n 4618 | \n 4619 | \n 4620 |     return FALSE;\n 4621 | }","lines":38,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/gtk/dataview.cpp#L4584-L4621"}]},
{"id":"DEAD_24","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `wxHtmlParser::ExtractCharsetInformation()` the pointer is obtained with a throwing `new` (`new wxMetaTagParser()`), which can never return `nullptr`, yet the code guards it with `if(parser)`. The check is dead: it is always true, and if allocation ever failed an exception would already have unwound past this point.\n```\nwxMetaTagParser *parser = new wxMetaTagParser();\nif(parser)   // always true\n{ ... }\n```","fix":"Drop the `if(parser)` guard (and preferably avoid the heap allocation entirely by constructing `wxMetaTagParser parser;` on the stack), or keep the allocation but remove the redundant null check.","locations":[{"ref":"src/html/htmlpars.cpp:902-908","code":"  902 |     wxMetaTagParser *parser = new wxMetaTagParser();\n  903 |     if(parser)\n  904 |     {\n  905 |         parser->AddTagHandler(new wxMetaTagHandler(&charset));\n  906 |         parser->Parse(markup);\n  907 |         delete parser;\n  908 |     }","lines":7,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/html/htmlpars.cpp#L902-L908"}]},
{"id":"DEAD_25","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"In `wxRemoteHtmlHelpController::Quit()` the local `errorText[]` array is only referenced inside a commented-out `wxLogError` call, so it is dead code (and triggers an unused-variable warning). Likewise the entire `switch ( sig )` block is commented out and `sig` is a hard-coded constant `15`, so the `if ( sig == 0 )` branch is永 never taken. This whole function is stale scaffolding.","fix":"Remove the unused `errorText[]` array and the dead `if ( sig == 0 )` branch, or actually wire the error text into a real `wxLogError` using the `rc` value.","locations":[{"ref":"utils/helpview/src/remhelp.cpp:296-312","code":"  296 |         {\n  297 |             static const wxChar *errorText[] =\n  298 |             {\n  299 |                 wxT(\"\"), // no error\n  300 |                     wxT(\"signal not supported\"),\n  301 |                     wxT(\"permission denied\"),\n  302 |                     wxT(\"no such process\"),\n  303 |                     wxT(\"unspecified error\"),\n  304 |             };\n  305 | \n  306 |             // sig = 3, 6, 9 or 12 all kill server with no apparent problem\n  307 |             // but give error message on MSW - timout?\n  308 |             //\n  309 |             //wxLogError(wxT(\"Failed to kill process %ld with signal %d: %s\"),\n  310 |             //            m_pid, sig, errorText[rc]);\n  311 |         }\n  312 |     }","lines":17,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/utils/helpview/src/remhelp.cpp#L296-L312"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"Several `wxAuiToolBar` members that operate on a positional index declare their parameter as `int toolId`, which misleadingly implies a tool id rather than an index. `DeleteByIndex(int toolId)` and `GetToolFitsByIndex(int toolId)` both name the parameter `toolId` even though the `...ByIndex` suffix and the sibling `DestroyToolByIndex(int idx)`/`FindToolByIndex(int idx)` show the argument is an index. A caller reading the signature could pass a tool id and get wrong results.","fix":"Rename the parameters to `idx` for consistency, e.g. `bool DeleteByIndex(int idx);` and `bool GetToolFitsByIndex(int idx) const;` to match `DestroyToolByIndex(int idx)` and `FindToolByIndex(int idx)`.","locations":[{"ref":"include/wx/aui/auibar.h:555-560","code":"  555 |     bool DestroyToolByIndex(int idx);\n  556 | \n  557 |     // Note that these methods do _not_ delete the associated control, if any.\n  558 |     // Use DestroyTool() or DestroyToolByIndex() if this is wanted.\n  559 |     bool DeleteTool(int toolId);\n  560 |     bool DeleteByIndex(int toolId);","lines":6,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/aui/auibar.h#L555-L560"},{"ref":"include/wx/aui/auibar.h:567","code":"  567 |     bool GetToolFitsByIndex(int toolId) const;","lines":1,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/aui/auibar.h#L567"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The usage example in the header comment shows an obsolete API that no longer compiles against the declared method signatures: it calls `m_dragImage->Move(pt, this)`, `m_dragImage->Show(this)`, `m_dragImage->Hide(this)` and `m_dragImage->EndDrag(this)`, but the current methods take no window argument (`bool Move(const wxPoint& pt)`, `bool Show()`, `bool Hide()`, `bool EndDrag()`). A developer following this example would get compile errors.","fix":"Update the example to match the current signatures, e.g. `m_dragImage->Move(pt)`, `m_dragImage->Show()`, `m_dragImage->Hide()`, `m_dragImage->EndDrag()`.","locations":[{"ref":"include/wx/generic/dragimgg.h:22-82","code":"   22 | /*\n   23 |   To use this class, create a wxDragImage when you start dragging, for example:\n   24 | \n   25 |   void MyTreeCtrl::OnBeginDrag(wxTreeEvent& event)\n   26 |   {\n   27 | #ifdef __WXMSW__\n   28 |     ::UpdateWindow((HWND) GetHWND()); // We need to implement this in wxWidgets\n   29 | #endif\n   30 | \n   31 |     CaptureMouse();\n   32 | \n   33 |     m_dragImage = new wxDragImage(* this, itemId);\n   34 |     m_dragImage->BeginDrag(wxPoint(0, 0), this);\n   35 |     m_dragImage->Move(pt, this);\n   36 |     m_dragImage->Show(this);\n   37 |     ...\n   38 |   }\n   39 | \n   40 |   In your OnMouseMove function, hide the image, do any display updating required,\n   41 |   then move and show the image again:\n   42 | \n   43 |   void MyTreeCtrl::OnMouseMove(wxMouseEvent& event)\n   44 |   {\n   45 |     if (m_dragMode == MY_TREE_DRAG_NONE)\n   46 |     {\n   47 |         event.Skip();\n   48 |         return;\n   49 |     }\n   50 | \n   51 |     // Prevent screen corruption by hiding the image\n   52 |     if (m_dragImage)\n   53 |         m_dragImage->Hide(this);\n   54 | \n   55 |     // Do some updating of the window, such as highlighting the drop target\n   56 |     ...\n   57 | \n   58 | #ifdef __WXMSW__\n   59 |     if (updateWindow)\n   60 |         ::UpdateWindow((HWND) GetHWND());\n   61 | #endif\n   62 | \n   63 |     // Move and show the image again\n   64 |     m_dragImage->Move(event.GetPosition(), this);\n   65 |     m_dragImage->Show(this);\n   66 |  }\n   67 | \n   68 |  Eventually we end the drag and delete the drag image.\n   69 | \n   70 |  void MyTreeCtrl::OnLeftUp(wxMouseEvent& event)\n   71 |  {\n   72 |     ...\n   73 | \n   74 |     // End the drag and delete the drag image\n   75 |     if (m_dragImage)\n   76 |     {\n   77 |         m_dragImage->EndDrag(this);\n   78 |         delete m_dragImage;\n   79 |         m_dragImage = nullptr;\n   80 |     }\n   81 |     ReleaseMouse();\n   82 |  }","lines":61,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/generic/dragimgg.h#L22-L82"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment on `wxLZMAOutputStream::UpdateOutputIfNecessary()` says `Returns false on success or false on error`, which is contradictory: both cases claim `false`. The intended meaning is clearly `true` on success and `false` on error (matching the actual `bool` return convention used by the neighbouring `DoFlush()`/`UpdateOutput()` helpers). This misleads anyone implementing or calling the function.","fix":"Change the comment from:\n```\n    // Write out the current buffer if necessary, i.e. if no space remains in\n    // it, and reinitialize m_stream to point to it. Returns false on success\n    // or false on error, in which case m_lasterror is updated.\n```\nto:\n```\n    // Write out the current buffer if necessary, i.e. if no space remains in\n    // it, and reinitialize m_stream to point to it. Returns true on success\n    // or false on error, in which case m_lasterror is updated.\n```","locations":[{"ref":"include/wx/lzmastream.h:110-113","code":"  110 |     // Write out the current buffer if necessary, i.e. if no space remains in\n  111 |     // it, and reinitialize m_stream to point to it. Returns false on success\n  112 |     // or false on error, in which case m_lasterror is updated.\n  113 |     bool UpdateOutputIfNecessary();","lines":4,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/lzmastream.h#L110-L113"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"In `wxMessageQueue::ReceiveTimeout()` the doc comment states `Setting timeout to 0 is equivalent to an infinite timeout.`, but the implementation does not special-case `timeout == 0`. With `timeout == 0`, `waitUntil = wxGetLocalTimeMillis() + 0`, then `m_conditionNotEmpty.WaitTimeout(0)` returns `wxCOND_TIMEOUT` essentially immediately, after which `now >= waitUntil` is true and the function returns `wxMSGQUEUE_TIMEOUT` at once. So passing `0` yields an immediate timeout, the opposite of an infinite wait. A caller relying on the documented contract to block indefinitely would instead get a spurious timeout.","fix":"Either implement the documented behaviour (treat `timeout == 0` as infinite by falling back to `m_conditionNotEmpty.Wait()`), or fix the comment to describe the real behaviour, e.g. `A timeout of 0 returns (almost) immediately; use Receive() for an infinite wait.`","locations":[{"ref":"include/wx/msgqueue.h:107-141","code":"  107 |     // Wait no more than timeout milliseconds until a message becomes available.\n  108 |     //\n  109 |     // Setting timeout to 0 is equivalent to an infinite timeout. See Receive().\n  110 |     wxMessageQueueError ReceiveTimeout(long timeout, T& msg)\n  111 |     {\n  112 |         wxCHECK( IsOk(), wxMSGQUEUE_MISC_ERROR );\n  113 | \n  114 |         wxMutexLocker locker(m_mutex);\n  115 | \n  116 |         wxCHECK( locker.IsOk(), wxMSGQUEUE_MISC_ERROR );\n  117 | \n  118 |         const wxMilliClock_t waitUntil = wxGetLocalTimeMillis() + timeout;\n  119 |         while ( m_messages.empty() )\n  120 |         {\n  121 |             wxCondError result = m_conditionNotEmpty.WaitTimeout(timeout);\n  122 | \n  123 |             if ( result == wxCOND_NO_ERROR )\n  124 |                 continue;\n  125 | \n  126 |             wxCHECK( result == wxCOND_TIMEOUT, wxMSGQUEUE_MISC_ERROR );\n  127 | \n  128 |             const wxMilliClock_t now = wxGetLocalTimeMillis();\n  129 | \n  130 |             if ( now >= waitUntil )\n  131 |                 return wxMSGQUEUE_TIMEOUT;\n  132 | \n  133 |             timeout = (waitUntil - now).ToLong();\n  134 |             wxASSERT(timeout > 0);\n  135 |         }\n  136 | \n  137 |         msg = std::move(m_messages.front());\n  138 |         m_messages.pop();\n  139 | \n  140 |         return wxMSGQUEUE_NO_ERROR;\n  141 |     }","lines":35,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/msgqueue.h#L107-L141"}]},
{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The comment above `wxMSWWinStyleUpdater` claims it \"updates the extended style\", but the class passes `GWL_STYLE` to the base ctor, i.e. it updates the *normal* window style. The extended-style variant is `wxMSWWinExStyleUpdater` (using `GWL_EXSTYLE`) further down, whose identical comment is correct. This is a copy-paste comment error that misleads readers about which style each class touches.","fix":"Change the comment on line 114 to describe the normal style, e.g. `// A variant of wxMSWWinLongUpdater which updates the (normal) window style.`","locations":[{"ref":"include/wx/msw/private/winstyle.h:114-115","code":"  114 | // A variant of wxMSWWinLongUpdater which updates the extended style.\n  115 | class wxMSWWinStyleUpdater : public wxMSWWinLongUpdater","lines":2,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/msw/private/winstyle.h#L114-L115"}]},
{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The file header banners of `include/wx/osx/core/cfarray.h` and `include/wx/osx/core/cfdictionary.h` still list stale `// Name:` lines: `cfarray.h` says `// Name:        wx/osx/core/cfarrayref.h` and `cfdictionary.h` says `// Name:        wx/osx/core/cfdictionaryref.h`. Neither matches the actual on-disk filename, indicating both files were renamed (dropping the `ref` suffix) without updating the banner comment, which is misleading to anyone grepping/searching by the name in the header.","fix":"Update the `// Name:` banner line in each file to match its actual filename: `// Name:        wx/osx/core/cfarray.h` in `cfarray.h`, and `// Name:        wx/osx/core/cfdictionary.h` in `cfdictionary.h`.","locations":[{"ref":"include/wx/osx/core/cfarray.h:1-2","code":"    1 | /////////////////////////////////////////////////////////////////////////////\n    2 | // Name:        wx/osx/core/cfarrayref.h","lines":2,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/osx/core/cfarray.h#L1-L2"},{"ref":"include/wx/osx/core/cfdictionary.h:1-2","code":"    1 | /////////////////////////////////////////////////////////////////////////////\n    2 | // Name:        wx/osx/core/cfdictionaryref.h","lines":2,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/osx/core/cfdictionary.h#L1-L2"}]},
{"id":"CMT_7","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"In `wxAuiFloatingFrame::SetPaneWindow()` the comment says \"if the frame window's max size is greater than the min size then set the max size to the min size as well\", but the code actually tests `cur_max_size.x < pane.min_size.x || cur_max_size.y < pane.min_size.y` (max smaller than min). The comment states the opposite condition and is misleading. Additionally the condition compares against `pane.min_size` while the value applied is `SetMaxSize(pane_min_size)` where `pane_min_size = pane.window->GetMinSize()`, mixing two different min-size sources.","fix":"Correct the comment to reflect that the max size is being raised to the min size when it is smaller, and make the compared and applied min-size values consistent (use either `pane.min_size` or `pane.window->GetMinSize()` in both the `if` condition and the `SetMaxSize()` call).","locations":[{"ref":"src/aui/floatpane.cpp:147-156","code":"  147 |     // if the frame window's max size is greater than the min size\n  148 |     // then set the max size to the min size as well\n  149 |     wxSize cur_max_size = GetMaxSize();\n  150 |     if (cur_max_size.IsFullySpecified() &&\n  151 |           (cur_max_size.x < pane.min_size.x ||\n  152 |            cur_max_size.y < pane.min_size.y)\n  153 |        )\n  154 |     {\n  155 |         SetMaxSize(pane_min_size);\n  156 |     }","lines":10,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/aui/floatpane.cpp#L147-L156"}]},
{"id":"CMT_8","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"In `wxFileDirPickerCtrlBase::OnFileDirChange()` the comment claims `the wxFilePickerWidget sent us a colour-change notification`, which is copy-pasted from the colour picker code. This handler deals with a file/directory path change (it forwards a `wxFileDirPickerEvent` built from `ev.GetPath()`), not a colour change, so the comment is misleading.","fix":"Replace the comment with an accurate one, e.g.:\n```cpp\n    // the picker widget notified us that the path changed;\n    // forward this event to our parent\n```","locations":[{"ref":"src/common/filepickercmn.cpp:156-157","code":"  156 |     // the wxFilePickerWidget sent us a colour-change notification.\n  157 |     // forward this event to our parent","lines":2,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/filepickercmn.cpp#L156-L157"}]},
{"id":"CMT_9","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"In the XTI property table for `wxCommandLinkButton`, the `Note` property is documented with the description `wxT(\"The link URL\")`. This is a copy-paste error: a command link button's `Note` is the secondary descriptive text shown below the main label, not a URL. The description misleads anyone reading the property metadata (and it is exposed via RTTI/XTI tooling).","fix":"Change the description text from `wxT(\"The link URL\")` to something accurate like `wxT(\"The note\")`:\n```cpp\nwxPROPERTY( Note, wxString, SetNote, GetNote, wxString(), \\\n           0 /*flags*/, wxT(\"The note\"), wxT(\"group\") )\n```","locations":[{"ref":"src/generic/commandlinkbuttong.cpp:64-65","code":"   64 | wxPROPERTY( Note, wxString, SetNote, GetNote, wxString(), \\\n   65 |            0 /*flags*/, wxT(\"The link URL\"), wxT(\"group\") )","lines":2,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/commandlinkbuttong.cpp#L64-L65"}]},
{"id":"CMT_10","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"In the `newWidth` clamping block of `wxSashWindow::OnMouseEvent` the comment refers to the Y (height) pane-size range while the code correctly clamps against the X (width) range members `m_minimumPaneSizeX`/`m_maximumPaneSizeX`. The comment was copy-pasted from the `newHeight` block above and never updated, so it is misleading.","fix":"Change the comment `// make sure it's in m_minimumPaneSizeY..m_maximumPaneSizeY range` to `// make sure it's in m_minimumPaneSizeX..m_maximumPaneSizeX range`.","locations":[{"ref":"src/generic/sashwin.cpp:259-264","code":"  259 |         else\n  260 |         {\n  261 |             // make sure it's in m_minimumPaneSizeY..m_maximumPaneSizeY range\n  262 |             newWidth = wxMax(newWidth, m_minimumPaneSizeX);\n  263 |             newWidth = wxMin(newWidth, m_maximumPaneSizeX);\n  264 |         }","lines":6,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/sashwin.cpp#L259-L264"}]},
{"id":"CMT_11","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The comment claims `sort_callback` returns the \"standard CmpNoCase return value\", but the function actually returns `strcmp(...) >= 0`, i.e. a boolean (0 or 1), not the 3-way `-1/0/+1` value that `GtkTreeIterCompareFunc` (and `CmpNoCase`) is documented to return. It also uses case-sensitive `strcmp` on collate keys, not a case-insensitive comparison. It never returns a negative value and returns `1` for equal keys, violating the comparator contract; it happens to sort ascending correctly today but would silently break if reused for descending sort or if GLib ever depends on the sign/zero distinction.","fix":"Return the actual comparison value and fix the comment, e.g. `return strcmp(wx_tree_entry_get_collate_key(entry1), wx_tree_entry_get_collate_key(entry2));` so it yields a proper negative/zero/positive result.","locations":[{"ref":"src/gtk/listbox.cpp:203-207","code":"  203 |     //We compare collate keys here instead of calling g_utf8_collate\n  204 |     //as it is rather slow (and even the docs recommend this)\n  205 |     return strcmp(wx_tree_entry_get_collate_key(entry1),\n  206 |                   wx_tree_entry_get_collate_key(entry2)) >= 0;\n  207 | }","lines":5,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/gtk/listbox.cpp#L203-L207"}]},
{"id":"CMT_12","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The comment describing the `wxNEEDS_GENERIC_ATOMIC_OPS` fallback is garbled: `// it will result in inclusion if the generic implementation code a bit later in this page`. It is missing a word and reads incorrectly, obscuring the intent (that the generic implementation further down will be included).","fix":"Reword to e.g. `// this will result in inclusion of the generic implementation code a bit later in this file`.","locations":[{"ref":"include/wx/atomic.h:86-87","code":"   86 | // it will result in inclusion if the generic implementation code a bit later in this page\n   87 | #define wxNEEDS_GENERIC_ATOMIC_OPS","lines":2,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/atomic.h#L86-L87"}]},
{"id":"CMT_13","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"Typo in the documentation comment for `m_printPageRanges`: \"If this vector contains more then m_maxPageRanges elements\" uses \"more then\" where \"more than\" is meant.","fix":"Replace `more then m_maxPageRanges` with `more than m_maxPageRanges`.","locations":[{"ref":"include/wx/cmndata.h:298-300","code":"  298 |     // The page ranges to print. If this vector contains more then m_maxPageRanges\n  299 |     // elements, then the maximum number of page ranges that the user can specify\n  300 |     // via the print dialog is the size of this vector.","lines":3,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/cmndata.h#L298-L300"}]},
{"id":"CMT_14","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The `Name:` field in the file header comment of `compositebookctrl.h` reads `wx/custombookctrl.h`, but the actual file is `wx/compositebookctrl.h` (the include guard, class name `wxCompositeBookCtrlBase`, and `#include` path all use \"composite\"). The stale name misleads readers grepping by header name.","fix":"Change the comment from `// Name:        wx/custombookctrl.h` to `// Name:        wx/compositebookctrl.h`.","locations":[{"ref":"include/wx/compositebookctrl.h:1-3","code":"    1 | ///////////////////////////////////////////////////////////////////////////////\n    2 | // Name:        wx/custombookctrl.h\n    3 | // Purpose:     Helper for wxBookCtrlBase subclasses composed of several windows","lines":3,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/compositebookctrl.h#L1-L3"}]},
{"id":"CMT_15","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The doc comment for `GetNumberOfDays(int year, ...)` states the year has \"356 or 355\" days, which is a typo: a year has 366 (leap) or 365 (common) days, not 356/355.","fix":"Change the comment from `// returns the number of days in this year (356 or 355 for Gregorian` to `// returns the number of days in this year (366 or 365 for Gregorian`.","locations":[{"ref":"include/wx/datetime.h:432-434","code":"  432 |         // returns the number of days in this year (356 or 355 for Gregorian\n  433 |         // calendar usually :-)\n  434 |     static wxDateTime_t GetNumberOfDays(int year, Calendar cal = Gregorian);","lines":3,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/datetime.h#L432-L434"}]},
{"id":"CMT_16","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The doc comment for `OnChangedViewList` is grammatically garbled: `deletes the document if this is there are no more views.` The stray `if this is` makes the sentence nonsensical.","fix":"Change\n```cpp\n    // Called after a view is added or removed. The default implementation\n    // deletes the document if this is there are no more views.\n```\nto\n```cpp\n    // Called after a view is added or removed. The default implementation\n    // deletes the document if there are no more views.\n```","locations":[{"ref":"include/wx/docview.h:139-140","code":"  139 |     // Called after a view is added or removed. The default implementation\n  140 |     // deletes the document if this is there are no more views.","lines":2,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/docview.h#L139-L140"}]},
{"id":"CMT_17","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"`wx/features.h` opens with the directive `/* THIS IS A C FILE, DON'T USE C++ FEATURES (IN PARTICULAR COMMENTS) IN IT */`, yet later blocks use C++ `//` line comments (the `wxHAS_EVENT_BIND` note and the `wxHAVE_DPI_INDEPENDENT_PIXELS` synonym note), directly violating the file's own stated contract. If the header is ever included by a strict C89 translation unit these comments are invalid; regardless, the comment is now self-contradictory/misleading.","fix":"Convert the offending `//` comments to C-style `/* ... */` comments, e.g. change `// Previously this symbol wasn't defined ...` and `// This is an older synonym kept only for compatibility` into `/* ... */` blocks, to comply with the C-file directive at the top.","locations":[{"ref":"include/wx/features.h:12","code":"   12 | /* THIS IS A C FILE, DON'T USE C++ FEATURES (IN PARTICULAR COMMENTS) IN IT */","lines":1,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/features.h#L12"},{"ref":"include/wx/features.h:101-105","code":"  101 | // Previously this symbol wasn't defined for all compilers as Bind() couldn't\n  102 | // be implemented for some of them (notably MSVC 6), but this is not the case\n  103 | // any more and Bind() is always implemented when using any currently supported\n  104 | // compiler, so this symbol exists purely for compatibility.\n  105 | #define wxHAS_EVENT_BIND","lines":5,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/features.h#L101-L105"},{"ref":"include/wx/features.h:118-119","code":"  118 |     // This is an older synonym kept only for compatibility\n  119 |     #define wxHAVE_DPI_INDEPENDENT_PIXELS","lines":2,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/features.h#L118-L119"}]},
{"id":"CMT_18","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The closing include-guard comment does not match the actual guard macro: the guard is `_WX_DIRCTRL_H_` (line 13) but the trailing comment reads `// _WX_DIRCTRLG_H_`.","fix":"Change the trailing comment `// _WX_DIRCTRLG_H_` to `// _WX_DIRCTRL_H_`.","locations":[{"ref":"include/wx/generic/dirctrlg.h:328-329","code":"  328 | #endif\n  329 |     // _WX_DIRCTRLG_H_","lines":2,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/generic/dirctrlg.h#L328-L329"}]},
{"id":"CMT_19","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The file header `Purpose:` line says `wxGenericDirCtrl class`, but this file declares `wxGenericDirDialog` (the `wxGenericDirCtrl` class lives in `dirctrlg.h`). The purpose line was copy-pasted from `dirctrlg.h`.","fix":"Change the `Purpose:` line to `wxGenericDirDialog class`.","locations":[{"ref":"include/wx/generic/dirdlgg.h:2-3","code":"    2 | // Name:        wx/generic/dirdlgg.h\n    3 | // Purpose:     wxGenericDirCtrl class","lines":2,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/generic/dirdlgg.h#L2-L3"}]},
{"id":"CMT_20","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The member comment misspells \"hotspot\" as \"hostpot\" for `m_offset`.","fix":"Change `// The hostpot value passed to BeginDrag` to `// The hotspot value passed to BeginDrag`.","locations":[{"ref":"include/wx/generic/dragimgg.h:225","code":"  225 |     wxPoint         m_offset; // The hostpot value passed to BeginDrag","lines":1,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/generic/dragimgg.h#L225"}]},
{"id":"CMT_21","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The header comment contains two typos: `andnot` (should be `and not`) and `if the we're compiling` (should be `if we're compiling`), which garble the explanation of when these log targets are compiled.","fix":"Change `// GUI part (andnot just the base one) of the library` to `// GUI part (and not just the base one) of the library` and `// the following log targets are only compiled in if the we're compiling the` to `// the following log targets are only compiled in if we're compiling the`.","locations":[{"ref":"include/wx/generic/logg.h:19-23","code":"   19 | // ----------------------------------------------------------------------------\n   20 | // the following log targets are only compiled in if the we're compiling the\n   21 | // GUI part (andnot just the base one) of the library, they're implemented in\n   22 | // src/generic/logg.cpp *and not src/common/log.cpp unlike all the rest)\n   23 | // ----------------------------------------------------------------------------","lines":5,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/generic/logg.h#L19-L23"}]},
{"id":"CMT_22","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"Doc comment for `CountTo()` has a typo: `Not that this doesn't include the given row.` should read `Note that this doesn't include the given row.`","fix":"Replace `Not that this doesn't include the given row.` with `Note that this doesn't include the given row.`","locations":[{"ref":"include/wx/generic/private/rowheightcache.h:54-59","code":"   54 |         Returns the number of rows that are in this group before the given row\n   55 |         index.\n   56 | \n   57 |         Not that this doesn't include the given row.\n   58 |     */\n   59 |     unsigned int CountTo(unsigned int row) const;","lines":6,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/generic/private/rowheightcache.h#L54-L59"}]},
{"id":"CMT_23","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"The predicate name `grow_lf70` implies a load-factor growth threshold of 0.70, but the implementation actually grows at a load factor of 0.85 (`>= 0.85f`). The name/documentation is inconsistent with the behavior.","fix":"Either rename the function to reflect 0.85 (e.g. `grow_lf85`) or change the threshold back to `0.70f` to match the name; at minimum add a comment explaining the discrepancy.","locations":[{"ref":"include/wx/gtk/../hashmap.h:432-435","code":"  432 | inline bool grow_lf70( size_t buckets, size_t items )\n  433 | {\n  434 |     return float(items)/float(buckets) >= 0.85f;\n  435 | }","lines":4,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/gtk/../hashmap.h#L432-L435"}]},
{"id":"CMT_24","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The closing `#endif` comment does not match the opening `#if`. The guard at line 15 is `#if wxUSE_WEBVIEW && (wxUSE_WEBVIEW_WEBKIT || wxUSE_WEBVIEW_WEBKIT2) && defined(__WXGTK__)`, but the trailing comment omits `wxUSE_WEBVIEW_WEBKIT2`, which is misleading since the entire header (including the WebKit2-only members) is guarded by the OR condition.","fix":"Update the trailing comment to match: `#endif // wxUSE_WEBVIEW && (wxUSE_WEBVIEW_WEBKIT || wxUSE_WEBVIEW_WEBKIT2) && defined(__WXGTK__)`.","locations":[{"ref":"include/wx/gtk/webview_webkit.h:15","code":"   15 | #if wxUSE_WEBVIEW && (wxUSE_WEBVIEW_WEBKIT || wxUSE_WEBVIEW_WEBKIT2) && defined(__WXGTK__)","lines":1,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/gtk/webview_webkit.h#L15"},{"ref":"include/wx/gtk/webview_webkit.h:255","code":"  255 | #endif // wxUSE_WEBVIEW && wxUSE_WEBVIEW_WEBKIT && defined(__WXGTK__)","lines":1,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/gtk/webview_webkit.h#L255"}]},
{"id":"CMT_25","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"`htmlproc.h` has mismatched identifiers: the header comment names the file `wx/html/htmlprep.h` (actual name is `htmlproc.h`), the include guard is `_WX_HTMLPREP_H_`, but the closing `#endif` comment says `_WX_HTMLPROC_H_`, which does not match the guard actually defined. The stray `#endif` label is a misleading/stale comment.","fix":"Make the labels consistent with the defined guard: change `#endif // _WX_HTMLPROC_H_` to `#endif // _WX_HTMLPREP_H_` (and ideally fix the `Name:` comment to `wx/html/htmlproc.h`).","locations":[{"ref":"include/wx/html/htmlproc.h:2","code":"    2 | // Name:        wx/html/htmlprep.h","lines":1,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/html/htmlproc.h#L2"},{"ref":"include/wx/html/htmlproc.h:9-10","code":"    9 | #ifndef _WX_HTMLPREP_H_\n   10 | #define _WX_HTMLPREP_H_","lines":2,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/html/htmlproc.h#L9-L10"},{"ref":"include/wx/html/htmlproc.h:57","code":"   57 | #endif // _WX_HTMLPROC_H_","lines":1,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/html/htmlproc.h#L57"}]},
{"id":"CMT_26","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"The usage-example comment block at the top of `dragimag.h` shows calls that do not match the actual public API of `wxDragImage`. It shows `m_dragImage->Move(pt, this)`, `m_dragImage->Show(this)` and `m_dragImage->Hide(this)`, but the declared methods take no window argument: `Move(const wxPoint& pt)`, `Show()`, `Hide()`. A developer copying the documented example would get compilation errors.","fix":"Update the example comment to drop the window argument from `Move`, `Show` and `Hide`, e.g. `m_dragImage->Move(pt);`, `m_dragImage->Show();`, `m_dragImage->Hide();`, matching the real signatures declared later in the file.","locations":[{"ref":"include/wx/msw/dragimag.h:37-39","code":"   37 |     m_dragImage->BeginDrag(wxPoint(0, 0), this);\n   38 |     m_dragImage->Move(pt, this);\n   39 |     m_dragImage->Show(this);","lines":3,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/msw/dragimag.h#L37-L39"},{"ref":"include/wx/msw/dragimag.h:55-68","code":"   55 |     if (m_dragImage)\n   56 |         m_dragImage->Hide(this);\n   57 | \n   58 |     // Do some updating of the window, such as highlighting the drop target\n   59 |     ...\n   60 | \n   61 | #ifdef __WXMSW__\n   62 |     if (updateWindow)\n   63 |         ::UpdateWindow((HWND) GetHWND());\n   64 | #endif\n   65 | \n   66 |     // Move and show the image again\n   67 |     m_dragImage->Move(event.GetPosition(), this);\n   68 |     m_dragImage->Show(this);","lines":14,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/msw/dragimag.h#L55-L68"},{"ref":"include/wx/msw/dragimag.h:188-194","code":"  188 |     bool Move(const wxPoint& pt);\n  189 | \n  190 |     // Show the image\n  191 |     bool Show();\n  192 | \n  193 |     // Hide the image\n  194 |     bool Hide();","lines":7,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/msw/dragimag.h#L188-L194"}]},
{"id":"CMT_27","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The `#if` guard on `wxWebViewHistoryItem` is `wxUSE_WEBVIEW && (wxUSE_WEBVIEW_IE || wxUSE_WEBVIEW_EDGE) && defined(__WXMSW__)`, but the matching `#endif` comment still reads `// wxUSE_WEBVIEW && wxUSE_WEBVIEW_IE && defined(__WXMSW__)`, omitting `wxUSE_WEBVIEW_EDGE`. The comment was not updated when Edge support was added to the condition, so it now misleadingly suggests this header is IE-only.","fix":"Update the `#endif` comment to match the actual condition:\n\n```cpp\n#endif // wxUSE_WEBVIEW && (wxUSE_WEBVIEW_IE || wxUSE_WEBVIEW_EDGE) && defined(__WXMSW__)\n```","locations":[{"ref":"include/wx/msw/webviewhistoryitem_ie.h:14-28","code":"   14 | #if wxUSE_WEBVIEW && (wxUSE_WEBVIEW_IE || wxUSE_WEBVIEW_EDGE) && defined(__WXMSW__)\n   15 | \n   16 | class WXDLLIMPEXP_WEBVIEW wxWebViewHistoryItem\n   17 | {\n   18 | public:\n   19 |     wxWebViewHistoryItem(const wxString& url, const wxString& title) :\n   20 |                      m_url(url), m_title(title) {}\n   21 |     wxString GetUrl() { return m_url; }\n   22 |     wxString GetTitle() { return m_title; }\n   23 | \n   24 | private:\n   25 |     wxString m_url, m_title;\n   26 | };\n   27 | \n   28 | #endif // wxUSE_WEBVIEW && wxUSE_WEBVIEW_IE && defined(__WXMSW__)","lines":15,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/msw/webviewhistoryitem_ie.h#L14-L28"}]},
{"id":"CMT_28","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The doc comment for `GetMaxRow()` is a copy-paste of the `GetMaxLayer()` comment and is misleading: it says the function returns \"the highest layer inside the specified dock\", but `GetMaxRow()` actually returns the highest `dock_row` among the panes matching the given `direction` and `layer`.","fix":"Change\n```\n// GetMaxRow() is an internal function which returns\n// the highest layer inside the specified dock\n```\nto\n```\n// GetMaxRow() is an internal function which returns the highest dock row\n// among the panes matching the given direction and layer\n```","locations":[{"ref":"src/aui/framemanager.cpp:222-223","code":"  222 | // GetMaxRow() is an internal function which returns\n  223 | // the highest layer inside the specified dock","lines":2,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/aui/framemanager.cpp#L222-L223"}]},
{"id":"CMT_29","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"Both `DoInsertDockRow()` and `DoInsertPane()` have doc comments that begin with the wrong function name `DoInsertDockLayer()` (copy-paste), and the `DoInsertPane()` comment additionally describes incrementing \"dock row values\" when the function actually increments `dock_pos` values.","fix":"For `DoInsertDockRow()` change the leading `// DoInsertDockLayer()` to `// DoInsertDockRow()`. For `DoInsertPane()` change `// DoInsertDockLayer() is an internal function that inserts a space for\\n// another dock pane by incrementing all existing dock row values by one` to `// DoInsertPane() is an internal function that inserts a space for another\\n// pane by incrementing all existing dock_pos values by one`.","locations":[{"ref":"src/aui/framemanager.cpp:255-256","code":"  255 | // DoInsertDockLayer() is an internal function that inserts a new dock\n  256 | // row by incrementing all existing dock row values by one","lines":2,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/aui/framemanager.cpp#L255-L256"},{"ref":"src/aui/framemanager.cpp:273-274","code":"  273 | // DoInsertDockLayer() is an internal function that inserts a space for\n  274 | // another dock pane by incrementing all existing dock row values by one","lines":2,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/aui/framemanager.cpp#L273-L274"}]},
{"id":"CMT_30","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"Typo in the comment for `wxBitmapBase::UseAlpha()`: it says \"not implemented in the case class\" but means \"base class\".","fix":"Change:\n```cpp\n    // This function is not implemented in the case class, we don't have any\n```\nto:\n```cpp\n    // This function is not implemented in the base class, we don't have any\n```","locations":[{"ref":"src/common/bmpbase.cpp:296-301","code":"  296 | bool wxBitmapBase::UseAlpha(bool WXUNUSED(use))\n  297 | {\n  298 |     // This function is not implemented in the case class, we don't have any\n  299 |     // generic way to make a bitmap use, or prevent it from using, alpha.\n  300 |     return false;\n  301 | }","lines":6,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/bmpbase.cpp#L296-L301"}]},

{"id":"CMT_32","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The `#endif` closing the `#if wxUSE_MDI_ARCHITECTURE` block is annotated with the wrong macro name `wxUSE_DOC_VIEW_ARCHITECTURE`, which is misleading since the guard actually tests `wxUSE_MDI_ARCHITECTURE`.","fix":"Update the trailing comment to match the guard. Before: `#endif // wxUSE_DOC_VIEW_ARCHITECTURE` After: `#endif // wxUSE_MDI_ARCHITECTURE`","locations":[{"ref":"src/common/docmdi.cpp:15-22","code":"   15 | #if wxUSE_MDI_ARCHITECTURE\n   16 | \n   17 | #include \"wx/docmdi.h\"\n   18 | \n   19 | wxIMPLEMENT_CLASS(wxDocMDIParentFrame, wxMDIParentFrame);\n   20 | wxIMPLEMENT_CLASS(wxDocMDIChildFrame, wxMDIChildFrame);\n   21 | \n   22 | #endif // wxUSE_DOC_VIEW_ARCHITECTURE","lines":8,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/docmdi.cpp#L15-L22"}]},
{"id":"CMT_33","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"Several `#endif` closing comments in `framecmn.cpp` name the wrong macro. The block opened by `#if wxUSE_TOOLBAR` in `RemoveChild()` is closed with `#endif // wxUSE_STATUSBAR`, and blocks opened by `#if wxUSE_MENUBAR` are closed with `#endif // wxUSE_MENUS`. The comments contradict the actual guarding macro and mislead readers editing these conditional sections.","fix":"Fix the trailing comments to match the opening guard, e.g. change `#endif // wxUSE_STATUSBAR` at line 283 to `#endif // wxUSE_TOOLBAR`, and `#endif // wxUSE_MENUS` at lines 204/220 to `#endif // wxUSE_MENUBAR`.","locations":[{"ref":"src/common/framecmn.cpp:283","code":"  283 | #endif // wxUSE_STATUSBAR","lines":1,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/framecmn.cpp#L283"},{"ref":"src/common/framecmn.cpp:204","code":"  204 | #endif // wxUSE_MENUS","lines":1,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/framecmn.cpp#L204"},{"ref":"src/common/framecmn.cpp:220","code":"  220 | #endif // wxUSE_MENUS","lines":1,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/framecmn.cpp#L220"}]},
{"id":"CMT_34","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The comment above `wxStringList::Sort()` says \"Sort a list of strings - deallocates old nodes, allocates new\", but the current implementation only reorders the existing node data via `SetData()` (into a temporary `array`) and neither deallocates nor allocates any list nodes, so the comment is outdated/misleading.","fix":"Update the comment to reflect that the data pointers are sorted in place, e.g. `// Sort a list of strings - reorders existing node data in place`.","locations":[{"ref":"src/common/list.cpp:695-696","code":"  695 | // Sort a list of strings - deallocates old nodes, allocates new\n  696 | void wxStringList::Sort()","lines":2,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/list.cpp#L695-L696"}]},
{"id":"CMT_35","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The comment in `wxLogStderr::DoLogText()` is garbled: \"even if we don't have it (e.g. in a Windows GUI application under) it's not a problem\" contains a stray word \"under\" and a mismatched parenthesis, making it read as an incomplete/broken sentence.","fix":"Repair the comment, e.g.:\n```\n// before\n// First send it to stderr, even if we don't have it (e.g. in a Windows GUI\n// application under) it's not a problem to try to use it and it's easier\n// than determining whether we do have it or not.\n// after\n// First send it to stderr, even if we don't have it (e.g. in a Windows GUI\n// application) it's not a problem to try to use it and it's easier\n// than determining whether we do have it or not.\n```","locations":[{"ref":"src/common/log.cpp:849-851","code":"  849 |     // First send it to stderr, even if we don't have it (e.g. in a Windows GUI\n  850 |     // application under) it's not a problem to try to use it and it's easier\n  851 |     // than determining whether we do have it or not.","lines":3,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/log.cpp#L849-L851"}]},
{"id":"CMT_36","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The debug message for an unescaped `>` misplaces the semicolon outside the quoted entity, printing `'>' should be escaped as \"&gt\";` instead of the intended `'>' should be escaped as \"&gt;\"`.","fix":"Move the `;` inside the quotes:\n```\n// before\nwxLogDebug(\"'>' should be escaped as \\\"&gt\\\"; at %zu.\",\n// after\nwxLogDebug(\"'>' should be escaped as \\\"&gt;\\\" at %zu.\",\n```","locations":[{"ref":"src/common/markupparser.cpp:341-342","code":"  341 |                 wxLogDebug(\"'>' should be escaped as \\\"&gt\\\"; at %zu.\",\n  342 |                            it - text.begin());","lines":2,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/markupparser.cpp#L341-L342"}]},
{"id":"CMT_37","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"In `jinit_2pass_quantizer` the comment `/* Make sure color count is acceptable */` precedes code that merely reads `int desired = cinfo->desired_number_of_colors;` and allocates buffers of that size without any validation/clamping. The comment describes a check that does not exist, making it misleading (the original IJG code clamped the value here).","fix":"Remove the misleading comment, or actually clamp `desired` to a sane maximum (e.g. `MAXNUMCOLORS`):\n```\nint desired = cinfo->desired_number_of_colors;\nif ( desired > MAXNUMCOLORS ) desired = MAXNUMCOLORS;\n```","locations":[{"ref":"src/common/quantize.cpp:1352-1361","code":" 1352 |   {\n 1353 |     /* Make sure color count is acceptable */\n 1354 |     int desired = cinfo->desired_number_of_colors;\n 1355 | \n 1356 |     cquantize->sv_colormap = (JSAMPARRAY) malloc(sizeof(JSAMPROW) * 3);\n 1357 |     cquantize->sv_colormap[0] = (JSAMPROW) malloc(sizeof(JSAMPLE) * desired);\n 1358 |     cquantize->sv_colormap[1] = (JSAMPROW) malloc(sizeof(JSAMPLE) * desired);\n 1359 |     cquantize->sv_colormap[2] = (JSAMPROW) malloc(sizeof(JSAMPLE) * desired);\n 1360 | \n 1361 |     cquantize->desired = desired;","lines":10,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/quantize.cpp#L1352-L1361"}]},

{"id":"CMT_44","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The comment on `m_items` in `wxHtmlListBoxCache` says the index is \"only valid if m_cells != nullptr\". `m_cells` is a fixed-size array so `m_cells != nullptr` is always true; the intended condition is per-slot (`m_cells[n] != nullptr`).","fix":"Change `// the index of the currently cached item (only valid if m_cells != nullptr)` to `// the index of the currently cached item (only valid if m_cells[n] != nullptr)`.","locations":[{"ref":"src/generic/htmllbox.cpp:145-146","code":"  145 |     // the index of the currently cached item (only valid if m_cells != nullptr)\n  146 |     size_t m_items[SIZE];","lines":2,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/htmllbox.cpp#L145-L146"}]},
{"id":"CMT_45","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"Several comments contain typos. `logg.cpp` line 900 has `fall fown` (should be `fall down`). `listctrl.cpp` line 723 has `ae aligned` (should be `are aligned`). `listctrl.cpp` line 1858 has `meny items` (should be `many items`). `listctrl.cpp` line 3807 has `remmebers` (should be `remembers`).","fix":"Fix the typos:\n- `logg.cpp:900` `// but check that the dialog won't fall fown from the screen` -> `// but check that the dialog won't fall down from the screen`\n- `listctrl.cpp:723` `// ae aligned in a row` -> `// are aligned in a row`\n- `listctrl.cpp:1858` `// meny items changed state, refresh everything` -> `// many items changed state, refresh everything`\n- `listctrl.cpp:3807` `// virtual controls remmebers all its selections itself` -> `// virtual controls remember all their selections themselves`","locations":[{"ref":"src/generic/logg.cpp:902","code":"  902 |     // but check that the dialog won't fall fown from the screen","lines":1,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/logg.cpp#L902"},{"ref":"src/generic/listctrl.cpp:723","code":"  723 |         // centre the image inside our rectangle, this looks nicer when items","lines":1,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/listctrl.cpp#L723"},{"ref":"src/generic/listctrl.cpp:1858","code":" 1858 |             // meny items changed state, refresh everything","lines":1,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/listctrl.cpp#L1858"},{"ref":"src/generic/listctrl.cpp:3807","code":" 3807 |     // virtual controls remmebers all its selections itself","lines":1,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/listctrl.cpp#L3807"}]},
{"id":"CMT_46","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"In the font button `font-set` callback the comment says `// fire the colour-changed event`, copy-pasted from a colour picker. The code actually constructs and dispatches a `wxFontPickerEvent`, i.e. a font-changed event, so the comment is misleading.","fix":"Change the comment to `// fire the font-changed event`.","locations":[{"ref":"src/gtk/fontpicker.cpp:45-47","code":"   45 |     // fire the colour-changed event\n   46 |     wxFontPickerEvent event(p, p->GetId(), p->GetSelectedFont());\n   47 |     p->HandleWindowEvent(event);","lines":3,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/gtk/fontpicker.cpp#L45-L47"}]},
{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"easy","description":"The full block of `wxHF_*` style-flag macros (`wxHF_TOOLBAR` through `wxHF_DEFAULTSTYLE`, ~19 lines) is defined identically in both `helpwnd.h` and `helpfrm.h`, and `helpfrm.h` already `#include`s `helpwnd.h`. The redefinitions are token-for-token identical so they don't error today, but if anyone edits one copy's value the other becomes a conflicting macro redefinition, and the duplication is pure maintenance hazard.","fix":"Delete the duplicated `#define wxHF_TOOLBAR ... wxHF_DEFAULTSTYLE` block from `helpfrm.h` and rely on the definitions pulled in via `#include \"wx/html/helpwnd.h\"` (or hoist them into a single shared header).","locations":[{"ref":"include/wx/html/helpfrm.h:41-59","code":"   41 | #define wxHF_TOOLBAR                0x0001\n   42 | #define wxHF_CONTENTS               0x0002\n   43 | #define wxHF_INDEX                  0x0004\n   44 | #define wxHF_SEARCH                 0x0008\n   45 | #define wxHF_BOOKMARKS              0x0010\n   46 | #define wxHF_OPEN_FILES             0x0020\n   47 | #define wxHF_PRINT                  0x0040\n   48 | #define wxHF_FLAT_TOOLBAR           0x0080\n   49 | #define wxHF_MERGE_BOOKS            0x0100\n   50 | #define wxHF_ICONS_BOOK             0x0200\n   51 | #define wxHF_ICONS_BOOK_CHAPTER     0x0400\n   52 | #define wxHF_ICONS_FOLDER           0x0000 // this is 0 since it is default\n   53 | #define wxHF_DEFAULT_STYLE          (wxHF_TOOLBAR | wxHF_CONTENTS | \\\n   54 |                                      wxHF_INDEX | wxHF_SEARCH | \\\n   55 |                                      wxHF_BOOKMARKS | wxHF_PRINT)\n   56 | //compatibility:\n   57 | #define wxHF_OPENFILES               wxHF_OPEN_FILES\n   58 | #define wxHF_FLATTOOLBAR             wxHF_FLAT_TOOLBAR\n   59 | #define wxHF_DEFAULTSTYLE            wxHF_DEFAULT_STYLE","lines":19,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea73235 {"id":"DUP_2","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"The RLE4 and RLE8 decoding blocks in `LoadBMPData` are near-identical for ~60 lines each (escape handling for end-of-scanline, end-of-RLE, delta move, absolute mode, and encoded runs), differing only in nibble-vs-byte extraction and the odd-byte padding rule. Duplicated logic like the delta `row`/`column` update and bounds checks must be kept in sync manually, which is error-prone.","fix":"Factor the common RLE escape/run handling into a shared helper parameterized by bits-per-pixel (or a small lambda for pixel emission) so the end-of-line/delta/absolute/encoded logic exists in a single place.","locations":[{"ref":"src/common/imagbmp.cpp:717-830","code":"  717 |                     if ( desc.comp == BI_RLE4 )\n  718 |                     {\n  719 |                         wxUint8 first;\n  720 |                         first = aByte;\n  721 |                         aByte = stream.GetC();\n  722 |                         if ( !stream.IsOk() )\n  723 |                             return false;\n  724 | \n  725 |                         if ( first == 0 )\n  726 |                         {\n  727 |                             // This is an escape sequence with special meaning.\n  728 |                             if ( aByte == 0 )\n  729 |                             {\n  730 |                                 // end of scanline marker\n  731 |                                 // This is ignored if the end-of-line was\n  732 |                                 // implicitly assumed when column==width,\n  733 |                                 // in which case column is now 0.\n  734 |                                 if (column != 0)\n  735 |                                     column = width;\n  736 |                             }\n  737 |                             else if ( aByte == 1 )\n  738 |                             {\n  739 | {"id":"DUP_7","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"`wxWindow::LoadNativeDialog(wxWindow*, wxWindowID id)` (`src/msw/nativdlg.cpp:42-77`) and `wxWindow::LoadNativeDialog(wxWindow*, const wxString& name)` (`src/msw/nativdlg.cpp:79-114`) both contain the same ~29-line body: create the `wxWindowCreationHook`, call `::CreateDialog()`, bail out if `m_hWnd` is null, call `SubclassWin()`, attach to `parent` or `wxTopLevelWindows`, then enumerate all child `HWND`s via `::GetWindow(..., GW_CHILD)`/`GW_HWNDNEXT` and call `CreateWindowFromHWND()` for each. The only difference between the two functions is the resource identifier passed to `::CreateDialog()` (`MAKEINTRESOURCE(id)` vs `name.c_str()`) and the extra `SetName(name)` call in the second overload.","fix":"Factor the shared logic into a private helper taking the already-created `HWND`:\n\n```cpp\nbool wxWindow::MSWFinishCreatingNativeDialog(wxWindow* parent, HWND hwndDlg)\n{\n    if ( !hwndDlg )\n        return false;\n\n    m_hWnd = (WXHWND)hwndDlg;\n    SubclassWin(GetHWND());\n\n    if ( parent )\n        parent->AddChild(this);\n    else\n        wxTopLevelWindows.Append(this);\n\n    HWND hWndNext = ::GetWindow((HWND)m_hWnd, GW_CHILD);\n    if (hWndNext)\n        CreateWindowFromHWND(this, (WXHWND)hWndNext);\n\n    while (hWndNext)\n    {\n        hWndNext = ::GetWindow(hWndNext, GW_HWNDNEXT);\n        if (hWndNext)\n            CreateWindowFromHWND(this, (WXHWND)hWndNext);\n    }\n\n    return true;\n}\n```\n\nand have both `LoadNativeDialog()` overloads build the `HINSTANCE`/resource id or name, call `::CreateDialog()` themselves (or via a small overload), and delegate the rest to this helper.","locations":[{"ref":"src/msw/nativdlg.cpp:42-77","code":"   42 | bool wxWindow::LoadNativeDialog(wxWindow* parent, wxWindowID id)\n   43 | {\n   44 |     m_windowId = id;\n   45 | \n   46 |     wxWindowCreationHook hook(this);\n   47 |     m_hWnd = (WXHWND)::CreateDialog((HINSTANCE)wxGetInstance(),\n   48 |                                     MAKEINTRESOURCE(id),\n   49 |                                     parent ? (HWND)parent->GetHWND() : 0,\n   50 |                                     (DLGPROC) wxDlgProc);\n   51 | \n   52 |     if ( !m_hWnd )\n   53 |         return false;\n   54 | \n   55 |     SubclassWin(GetHWND());\n   56 | \n   57 |     if ( parent )\n   58 |         parent->AddChild(this);\n   59 |     else\n   60 |         wxTopLevelWindows.Append(this);\n   61 | \n   62 |     // Enumerate all children\n   63 |     HWND hWndNext;\n   64 |     hWndNext = ::GetWindow((HWND) m_hWnd, GW_CHILD);\n   65 | \n   66 |     if (hWndNext)\n   67 |         CreateWindowFromHWND(this, (WXHWND) hWndNext);\n   68 | \n   69 |     while (hWndNext != (HWND) nullptr)\n   70 |     {\n   71 |         hWndNext = ::GetWindow(hWndNext, GW_HWNDNEXT);\n   72 |         if (hWndNext)\n   73 |             CreateWindowFromHWND(this, (WXHWND) hWndNext);\n   74 |     }\n   75 | \n   76 |     return true;\n   77 | }","lines":36,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/nativdlg.cpp#L42-L77"},{"ref":"src/msw/nativdlg.cpp:79-114","code":"   79 | bool wxWindow::LoadNativeDialog(wxWindow* parent, const wxString& name)\n   80 | {\n   81 |     SetName(name);\n   82 | \n   83 |     wxWindowCreationHook hook(this);\n   84 |     m_hWnd = (WXHWND)::CreateDialog((HINSTANCE) wxGetInstance(),\n   85 |                                     name.c_str(),\n   86 |                                     parent ? (HWND)parent->GetHWND() : 0,\n   87 |                                     (DLGPROC)wxDlgProc);\n   88 | \n   89 |     if ( !m_hWnd )\n   90 |         return false;\n   91 | \n   92 |     SubclassWin(GetHWND());\n   93 | \n   94 |     if ( parent )\n   95 |         parent->AddChild(this);\n   96 |     else\n   97 |         wxTopLevelWindows.Append(this);\n   98 | \n   99 |     // Enumerate all
