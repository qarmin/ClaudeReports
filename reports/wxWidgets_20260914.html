{"id":"API_10","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`EnableTool()` only sets/clears `wxAUI_BUTTON_STATE_DISABLED` on the item's `m_state`. For `wxITEM_CONTROL` items the actual `wxWindow` (`m_window`) is never disabled and the state bit is not used when drawing controls, so `EnableTool(control_id, false)` has no visible effect. `DoIdleUpdate()` handles control enabling correctly via `item.m_window->Enable(...)`, showing the intended behavior that `EnableTool` fails to replicate.","fix":"In `EnableTool`, when `tool->m_window` is non-null call `tool->m_window->Enable(state)` (in addition to or instead of toggling the state bit) so enabling/disabling a control tool actually affects the embedded window, matching `DoIdleUpdate()`.","locations":[{"ref":"src/aui/auibar.cpp:1691-1702","code":" 1691 | void wxAuiToolBar::EnableTool(int tool_id, bool state)\n 1692 | {\n 1693 |     wxAuiToolBarItem* tool = FindTool(tool_id);\n 1694 | \n 1695 |     if (tool)\n 1696 |     {\n 1697 |         if (state == true)\n 1698 |             tool->m_state &= ~wxAUI_BUTTON_STATE_DISABLED;\n 1699 |         else\n 1700 |             tool->m_state |= wxAUI_BUTTON_STATE_DISABLED;\n 1701 |     }\n 1702 | }","lines":12,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/aui/auibar.cpp#L1691-L1702"}]},
{"id":"API_11","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`wxPluginLibrary::RestoreClasses()` does `ms_classes->erase(ms_classes->find(info->GetClassName()))` for every class in the range, but `UpdateClasses()` only inserted classes for which `info->GetClassName()` is non-null (`if( info->GetClassName() )`). For a class whose name is null (or otherwise absent from the map), `find()` returns `end()` and `erase(end())` is undefined behavior. The insert/erase sides are asymmetric.","fix":"Mirror the guard used in `UpdateClasses()` and check the iterator before erasing:\n```\n        const wxChar* const name = info->GetClassName();\n        if ( name )\n        {\n            const auto it = ms_classes->find(name);\n            if ( it != ms_classes->end() )\n                ms_classes->erase(it);\n        }\n```","locations":[{"ref":"src/common/dynload.cpp:168-184","code":"  168 | void wxPluginLibrary::RestoreClasses()\n  169 | {\n  170 |     // Check if there is a need to restore classes.\n  171 |     if (!ms_classes)\n  172 |         return;\n  173 | \n  174 |     if ( !m_ourFirst )\n  175 |         return;\n  176 | \n  177 |     for ( const wxClassInfo *info = m_ourFirst; ; info = info->GetNext() )\n  178 |     {\n  179 |         ms_classes->erase(ms_classes->find(info->GetClassName()));\n  180 | \n  181 |         if ( info == m_ourLast )\n  182 |             break;\n  183 |     }\n  184 | }","lines":17,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/dynload.cpp#L168-L184"},{"ref":"src/common/dynload.cpp:149-166","code":"  149 | void wxPluginLibrary::UpdateClasses()\n  150 | {\n  151 |     if ( !m_ourFirst )\n  152 |         return;\n  153 | \n  154 |     for ( const wxClassInfo *info = m_ourFirst; ; info = info->GetNext() )\n  155 |     {\n  156 |         if( info->GetClassName() )\n  157 |         {\n  158 |             // Hash all the class names into a local table too so\n  159 |             // we can quickly find the entry they correspond to.\n  160 |             (*ms_classes)[info->GetClassName()] = this;\n  161 |         }\n  162 | \n  163 |         if ( info == m_ourLast )\n  164 |             break;\n  165 |     }\n  166 | }","lines":18,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/dynload.cpp#L149-L166"}]},
{"id":"API_12","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"`wxStringListNode::DeleteData()` frees data that was allocated with `new wxChar[]` (via `MYcopystring()`, which does `new wxChar[...]`) but deletes it through a `char*` cast: `delete [] (char *)GetData();`. In a Unicode build (`wxChar == wchar_t`) this deletes an array through the wrong pointer type, which is undefined behavior (harmless in practice only because `char`/`wchar_t` are trivially destructible and share the allocation address).","fix":"Delete through the correct element type:\n```\n// before\ndelete [] (char *)GetData();\n// after\ndelete [] (wxChar *)GetData();\n```","locations":[{"ref":"src/common/list.cpp:577-580","code":"  577 | void wxStringListNode::DeleteData()\n  578 | {\n  579 |     delete [] (char *)GetData();\n  580 | }","lines":4,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/list.cpp#L577-L580"}]},
{"id":"API_13","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`wxMediaCtrl::DoCreate()` does `m_imp = (wxMediaBackend*)classInfo->CreateObject();` and immediately calls `m_imp->CreateControl(...)` with no null check. In the explicit-backend `Create()` paths, `pClassInfo` comes from `wxClassInfo::FindClass(szBackend)` (a caller-supplied class name) with no `IsKindOf(wxCLASSINFO(wxMediaBackend))` verification (unlike the `NextBackend()` path which does check). If `szBackend` names a class that is not a `wxMediaBackend` (invalid downcast) or is not dynamically creatable (`CreateObject()` returns `nullptr`), the subsequent virtual call is undefined behavior / a null-pointer dereference.","fix":"In `DoCreate()` check `m_imp` after `CreateObject()` and return `false` if null; in the explicit-backend `Create()` paths verify `pClassInfo->IsKindOf(wxCLASSINFO(wxMediaBackend))` before calling `DoCreate()`.","locations":[{"ref":"src/common/mediactrlcmn.cpp:205-223","code":"  205 | bool wxMediaCtrl::DoCreate(const wxClassInfo* classInfo,\n  206 |                             wxWindow* parent, wxWindowID id,\n  207 |                             const wxPoint& pos,\n  208 |                             const wxSize& size,\n  209 |                             long style,\n  210 |                             const wxValidator& validator,\n  211 |                             const wxString& name)\n  212 | {\n  213 |     m_imp = (wxMediaBackend*)classInfo->CreateObject();\n  214 | \n  215 |     if( m_imp->CreateControl(this, parent, id, pos, size,\n  216 |                              style, validator, name) )\n  217 |     {\n  218 |         return true;\n  219 |     }\n  220 | \n  221 |     delete m_imp;\n  222 |     return false;\n  223 | }","lines":19,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/mediactrlcmn.cpp#L205-L223"},{"ref":"src/common/mediactrlcmn.cpp:89-98","code":"   89 |     if(!szBackend.empty())\n   90 |     {\n   91 |         wxClassInfo* pClassInfo = wxClassInfo::FindClass(szBackend);\n   92 | \n   93 |         if(!pClassInfo || !DoCreate(pClassInfo, parent, id,\n   94 |                                     pos, size, style, validator, name))\n   95 |         {\n   96 |             m_imp = nullptr;\n   97 |             return false;\n   98 |         }","lines":10,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/mediactrlcmn.cpp#L89-L98"},{"ref":"src/common/mediactrlcmn.cpp:155-163","code":"  155 |     if(!szBackend.empty())\n  156 |     {\n  157 |         wxClassInfo* pClassInfo = wxClassInfo::FindClass(szBackend);\n  158 |         if(!pClassInfo || !DoCreate(pClassInfo, parent, id,\n  159 |                                     pos, size, style, validator, name))\n  160 |         {\n  161 |             m_imp = nullptr;\n  162 |             return false;\n  163 |         }","lines":9,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/mediactrlcmn.cpp#L155-L163"}]},
{"id":"API_14","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"In `wx_regerror()` the buffer capacity passed to `pcre2_get_error_message()` is `sizeof(buffer)` (a byte count) but that function's third argument is a length expressed in code units. `buffer` is `wxRegErrorChar buffer[256]` where `wxRegErrorChar` is `wchar_t` in UTF-16/UTF-32 builds, so `sizeof(buffer)` overstates the real capacity (`256`) by 2x or 4x, telling PCRE2 it may write more code units than actually fit - a potential out-of-bounds write for a long message. Note the immediately preceding `wxSnprintf` call correctly uses `WXSIZEOF(buffer)`.","fix":"```\n// before\nlen = pcre2_get_error_message(preg->errorcode, (PCRE2_UCHAR*)buffer, sizeof(buffer));\n// after\nlen = pcre2_get_error_message(preg->errorcode, (PCRE2_UCHAR*)buffer, WXSIZEOF(buffer));\n```","locations":[{"ref":"src/common/regex.cpp:231-234","code":"  231 |     if ( errcode == REG_NOERROR )\n  232 |         len = wxSnprintf(buffer, WXSIZEOF(buffer), \"no error\");\n  233 |     else\n  234 |         len = pcre2_get_error_message(preg->errorcode, (PCRE2_UCHAR*)buffer, sizeof(buffer));","lines":4,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/regex.cpp#L231-L234"}]},
{"id":"API_15","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`wxClassInfo::SetProperty`, `GetProperty`, `GetPropertyCollection` and `AddToPropertyCollection` all call `FindAccessor(propertyName)` and then only assert non-null (`wxASSERT(accessor->HasSetter())` etc.) before dereferencing. `FindAccessor` returns `nullptr` for an unknown property; in a release build (asserts compiled out) the subsequent `accessor->SetProperty(...)`/`accessor->GetProperty(...)` is a null-pointer dereference.","fix":"Guard the accessor before use, e.g. `const wxPropertyAccessor *accessor = FindAccessor(propertyName); wxCHECK_RET(accessor, wxT(\"unknown property\")); ...` (and the equivalent `wxCHECK_MSG` for the value-returning variants).","locations":[{"ref":"src/common/xti.cpp:625-666","code":"  625 | void wxClassInfo::SetProperty(wxObject *object, const wxChar *propertyName,\n  626 |                               const wxAny &value) const\n  627 | {\n  628 |     const wxPropertyAccessor *accessor;\n  629 | \n  630 |     accessor = FindAccessor(propertyName);\n  631 |     wxASSERT(accessor->HasSetter());\n  632 |     accessor->SetProperty( object, value );\n  633 | }\n  634 | \n  635 | wxAny wxClassInfo::GetProperty(wxObject *object, const wxChar *propertyName) const\n  636 | {\n  637 |     const wxPropertyAccessor *accessor;\n  638 | \n  639 |     accessor = FindAccessor(propertyName);\n  640 |     wxASSERT(accessor->HasGetter());\n  641 |     wxAny result;\n  642 |     accessor->GetProperty(object,result);\n  643 |     return result;\n  644 | }\n  645 | \n  646 | wxAnyList wxClassInfo::GetPropertyCollection(wxObject *object,\n  647 |                                                    const wxChar *propertyName) const\n  648 | {\n  649 |     const wxPropertyAccessor *accessor;\n  650 | \n  651 |     accessor = FindAccessor(propertyName);\n  652 |     wxASSERT(accessor->HasGetter());\n  653 |     wxAnyList result;\n  654 |     accessor->GetPropertyCollection(object,result);\n  655 |     return result;\n  656 | }\n  657 | \n  658 | void wxClassInfo::AddToPropertyCollection(wxObject *object, const wxChar *propertyName,\n  659 |                                           const wxAny& value) const\n  660 | {\n  661 |     const wxPropertyAccessor *accessor;\n  662 | \n  663 |     accessor = FindAccessor(propertyName);\n  664 |     wxASSERT(accessor->HasAdder());\n  665 |     accessor->AddToPropertyCollection( object, value );\n  666 | }","lines":42,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/xti.cpp#L625-L666"}]},
{"id":"API_16","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`wxLogTrace` is given a `%s` format specifier but passed a `wxTimerTick_t` (i.e. `wxLongLong`, a class type) as the argument. Passing a non-POD class through varargs for a `%s` conversion is undefined behavior (the formatter expects a string pointer). This occurs twice: for `when` at the queue trace and for `desc->shotTime` at the notify trace. It only executes when the `\"timer\"` trace mask is enabled, but then produces garbage/crashes.","fix":"Convert the value to a string, e.g. use `when.ToString()` and `desc->shotTime.ToString()` (both `wxLongLong`) as the `%s` arguments, matching how `wxLongLong` is logged elsewhere in wxWidgets.","locations":[{"ref":"src/generic/timer.cpp:83-85","code":"   83 |     wxLogTrace( wxT(\"timer\"),\n   84 |                 wxT(\"queued timer %p at tick %s\"),\n   85 |                desc->timer,  when);","lines":3,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/timer.cpp#L83-L85"},{"ref":"src/generic/timer.cpp:137-140","code":"  137 |                     wxLogTrace( wxT(\"timer\"),\n  138 |                                 wxT(\"notified timer %p scheduled for %s\"),\n  139 |                                 desc->timer,\n  140 |                                 desc->shotTime );","lines":4,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/timer.cpp#L137-L140"}]},
{"id":"API_17","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"`wxMDIClientWindow::AddChildGTK()` creates the initial tab label with `gtk_label_new(s.mbc_str())`, converting the title to the current-locale multibyte encoding. GTK+ always expects UTF-8 for widget text, so a non-ASCII MDI child title is garbled on any non-UTF-8 locale. Every other title path in this file (e.g. `wxMDIChildFrame::SetTitle` at line 371) correctly uses `utf8_str()`.","fix":"Use UTF-8 like the rest of the code: `GtkWidget *label_widget = gtk_label_new( s.utf8_str() );`","locations":[{"ref":"src/gtk/mdi.cpp:435","code":"  435 |     GtkWidget *label_widget = gtk_label_new( s.mbc_str() );","lines":1,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/gtk/mdi.cpp#L435"}]},
{"id":"API_18","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`wxGDBusLoginManagerProxy::CreateProxyLoginManager()` calls `g_signal_connect(proxyLoginManager, \"g-signal\", ...)` unconditionally, even when `g_dbus_proxy_new_for_bus_sync()` failed and returned `nullptr` (the `if ( error )` branch only logs, it does not return). `g_signal_connect()` on a `nullptr` instance triggers a GLib critical warning (its `G_IS_OBJECT` precondition fails). The returned null is later handled by `StartInhibit()`'s `if ( !m_proxyLoginManager ) return false`, but the spurious critical is emitted whenever the D-Bus connection cannot be opened.","fix":"Return early on error before connecting the signal, e.g.:\n```\nif ( error )\n{\n    wxLogError(...);\n    return nullptr;\n}\ng_signal_connect(proxyLoginManager, \"g-signal\", G_CALLBACK(wx_dbus_login_manager_cb), nullptr);\n```","locations":[{"ref":"src/gtk/power.cpp:185-196","code":"  185 |     if ( error )\n  186 |     {\n  187 |         wxLogError(\n  188 |             _(\"Failed to open D-Bus connection to the login manager: %s\"),\n  189 |             error.GetMessage()\n  190 |         );\n  191 |     }\n  192 | \n  193 |     g_signal_connect(proxyLoginManager, \"g-signal\",\n  194 |                      G_CALLBACK(wx_dbus_login_manager_cb), nullptr);\n  195 | \n  196 |     return proxyLoginManager;","lines":12,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/gtk/power.cpp#L185-L196"}]},
{"id":"API_19","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"`IsDoubleBuffered()` calls `gtk_widget_get_double_buffered(m_wxwindow)` with no null check on `m_wxwindow`. For native controls (e.g. `wxButton`, `wxTextCtrl`) created through their own `Create()` override, `m_wxwindow` is `nullptr` (only windows with a client area created via `wxWindowGTK::Create()` set it). Passing `nullptr` to `gtk_widget_get_double_buffered()` triggers a `Gtk-CRITICAL` `G_TYPE_CHECK_INSTANCE` assertion and returns `FALSE`, so the query both spams the log and returns a wrong/meaningless answer. Note the symmetric `SetDoubleBuffered()` at lines 5986-5996 correctly guards `if ( m_wxwindow )`.","fix":"Guard the widget like the setter does, e.g.:\n```cpp\nbool wxWindowGTK::IsDoubleBuffered() const\n{\n    wxGCC_WARNING_SUPPRESS(deprecated-declarations)\n    return m_wxwindow && gtk_widget_get_double_buffered(m_wxwindow) != 0;\n    wxGCC_WARNING_RESTORE(deprecated-declarations)\n}\n```","locations":[{"ref":"src/gtk/window.cpp:6056-6061","code":" 6056 | bool wxWindowGTK::IsDoubleBuffered() const\n 6057 | {\n 6058 |     wxGCC_WARNING_SUPPRESS(deprecated-declarations)\n 6059 |     return gtk_widget_get_double_buffered( m_wxwindow ) != 0;\n 6060 |     wxGCC_WARNING_RESTORE(deprecated-declarations)\n 6061 | }","lines":6,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/gtk/window.cpp#L6056-L6061"}]},
{"id":"API_20","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`wxHtmlWidgetCell::DrawInvisible()` casts the parent window with an unchecked C-style cast `((wxScrolledWindow*)(m_Wnd->GetParent()))->GetViewStart(&stx, &sty)`, unlike the sibling `wxHtmlWidgetCell::Draw()` which uses `wxDynamicCast` plus `wxCHECK_RET`. If the parent is not actually a `wxScrolledWindow`, this is an invalid downcast leading to undefined behaviour / crash.","fix":"Mirror `Draw()`: use `wxScrolledWindow *scrolwin = wxDynamicCast(m_Wnd->GetParent(), wxScrolledWindow); wxCHECK_RET(scrolwin, ...); scrolwin->GetViewStart(&stx, &sty);`.","locations":[{"ref":"src/html/htmlcell.cpp:1645-1661","code":" 1645 | void wxHtmlWidgetCell::DrawInvisible(wxDC& WXUNUSED(dc),\n 1646 |                                      int WXUNUSED(x), int WXUNUSED(y),\n 1647 |                                      wxHtmlRenderingInfo& WXUNUSED(info))\n 1648 | {\n 1649 |     int absx = 0, absy = 0, stx, sty;\n 1650 |     wxHtmlCell *c = this;\n 1651 | \n 1652 |     while (c)\n 1653 |     {\n 1654 |         absx += c->GetPosX();\n 1655 |         absy += c->GetPosY();\n 1656 |         c = c->GetParent();\n 1657 |     }\n 1658 | \n 1659 |     ((wxScrolledWindow*)(m_Wnd->GetParent()))->GetViewStart(&stx, &sty);\n 1660 |     m_Wnd->SetSize(absx - wxHTML_SCROLL_STEP * stx, absy  - wxHTML_SCROLL_STEP * sty, m_Width, m_Height);\n 1661 | }","lines":17,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/html/htmlcell.cpp#L1645-L1661"},{"ref":"src/html/htmlcell.cpp:1632-1640","code":" 1632 |     wxScrolledWindow *scrolwin =\n 1633 |         wxDynamicCast(m_Wnd->GetParent(), wxScrolledWindow);\n 1634 |     wxCHECK_RET( scrolwin,\n 1635 |                  wxT(\"widget cells can only be placed in wxHtmlWindow\") );\n 1636 | \n 1637 |     scrolwin->GetViewStart(&stx, &sty);\n 1638 |     m_Wnd->SetSize(absx - wxHTML_SCROLL_STEP * stx,\n 1639 |                    absy  - wxHTML_SCROLL_STEP * sty,\n 1640 |                    m_Width, m_Height);","lines":9,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/html/htmlcell.cpp#L1632-L1640"}]},
{"id":"API_21","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"In `wxWindow::CreateWindowFromHWND()`, when the native window class isn't recognized, the code builds a message and calls `wxLogError(msg);` (`src/msw/nativdlg.cpp:292-294`) where `msg` is a `wxString` built from a literal plus the native window class name (`str`, obtained from `wxGetWindowClass(hWnd)`). `wxLogError()` treats its first argument as a `printf`-style format string; passing an unvalidated, dynamically-built string (which could legitimately contain a `%` if a custom control registers a window class name containing one) as the format string with no corresponding variadic arguments can read past the end of the argument list, producing garbage output or, in the worst case, a crash.","fix":"Pass the dynamic text as an argument to a literal `%s` format string instead of using it as the format string itself:\n\n```cpp\nwxLogError(wxT(\"Don't know how to convert from Windows class %s\"), str.c_str());\n```","locations":[{"ref":"src/msw/nativdlg.cpp:290-295","code":"  290 |     else\n  291 |     {\n  292 |         wxString msg(wxT(\"Don't know how to convert from Windows class \"));\n  293 |         msg += str;\n  294 |         wxLogError(msg);\n  295 |     }","lines":6,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/nativdlg.cpp#L290-L295"}]},
{"id":"API_22","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"Both `getID()` and `getMemberIDs()` check `errno == ERANGE || errno == EINVAL` right after calling `wcstoul()`/`strtoul()` without first resetting `errno = 0` before the call. Per the C standard, `strtoul`/`wcstoul` only set `errno` on error and leave it untouched on success, so a leftover `ERANGE`/`EINVAL` from an unrelated earlier CRT call can make a perfectly valid, in-range ID be misreported as a parse failure.","fix":"Set `errno = 0;` immediately before each `wcstoul`/`strtoul` call so the subsequent `errno == ERANGE || errno == EINVAL` check only reflects that call's outcome.","locations":[{"ref":"utils/ifacecheck/src/xmlparser.cpp:737-755","code":"  737 | bool getID(unsigned long *id, const wxString& str)\n  738 | {\n  739 |     const wxStringCharType * const start = str.wx_str()+1;\n  740 |     wxStringCharType *end;\n  741 | #if wxUSE_UNICODE_WCHAR\n  742 |     unsigned long val = wcstoul(start, &end, GCCXML_BASE);\n  743 | #else\n  744 |     unsigned long val = strtoul(start, &end, GCCXML_BASE);\n  745 | #endif\n  746 | \n  747 |     // return true only if scan was stopped by the terminating NUL and\n  748 |     // if the string was not empty to start with and no under/overflow\n  749 |     // occurred:\n  750 |     if ( *end != '\\0' || end == start || errno == ERANGE || errno == EINVAL )\n  751 |         return false;\n  752 | \n  753 |     *id = val;\n  754 |     return true;\n  755 | }","lines":19,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/utils/ifacecheck/src/xmlparser.cpp#L737-L755"},{"ref":"utils/ifacecheck/src/xmlparser.cpp:775-794","code":"  775 |     while (curpos < end)\n  776 |     {\n  777 |         // curpos always points to the underscore of the next token to parse:\n  778 | #if wxUSE_UNICODE_WCHAR\n  779 |         unsigned long id = wcstoul(curpos+1, &nexttoken, GCCXML_BASE);\n  780 | #else\n  781 |         unsigned long id = strtoul(curpos+1, &nexttoken, GCCXML_BASE);\n  782 | #endif\n  783 |         if ( *nexttoken != ' ' || errno == ERANGE || errno == EINVAL )\n  784 |             return false;\n  785 | \n  786 |         // advance current position\n  787 |         curpos = nexttoken + 1;\n  788 | \n  789 |         // add this ID to the hashmap\n  790 |         wxClassMemberIdHashMap::value_type v(id, p);\n  791 |         map->insert(v);\n  792 |     }\n  793 | \n  794 |     return true;","lines":20,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/utils/ifacecheck/src/xmlparser.cpp#L775-L794"}]},
{"id":"API_23","type":"api_misuse","type_label":"Api Misuse","severity":"negligible","difficulty":"very_easy","description":"`wxSpinCtrlDouble::GtkSetEntryWidth()` passes an `unsigned` (`digits`, from `GetDigits()`) for the `%.*f` variable-precision field of `wxString::Format`. The `*` precision specifier consumes an `int` argument via `va_arg`; passing `unsigned` is a varargs type mismatch (technically undefined behavior, though harmless on common ABIs where `int` and `unsigned` share size).","fix":"Cast to `int`: `const int lenMin = wxString::Format(\"%.*f\", int(digits), GetMin()).length();` and likewise for `lenMax`.","locations":[{"ref":"src/gtk/spinctrl.cpp:638-640","code":"  638 |     const unsigned digits = GetDigits();\n  639 |     const int lenMin = wxString::Format(\"%.*f\", digits, GetMin()).length();\n  640 |     const int lenMax = wxString::Format(\"%.*f\", digits, GetMax()).length();","lines":3,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/gtk/spinctrl.cpp#L638-L640"}]},
{"id":"API_24","type":"api_misuse","type_label":"Api Misuse","severity":"negligible","difficulty":"very_easy","description":"`wxEmitTwoFingerTapEvent()` computes the tap centre with `abs(lastX - gdk_event->x)/2` and `abs(lastY - gdk_event->y)/2`, but `lastX`, `lastY`, `gdk_event->x`, `gdk_event->y` are all `double`. With only `<ctype.h>` included and no `using namespace std`, the unqualified `abs` resolves to the integer `::abs(int)` from `<cstdlib>`, so the `double` difference is truncated to `int` before halving, dropping the fractional part of the coordinate delta. The correct function for `double` is `fabs` (or `std::abs`).","fix":"Use `fabs` for the floating-point deltas:\n```cpp\ndouble x = left + fabs(lastX - gdk_event->x)/2;\ndouble y = up + fabs(lastY - gdk_event->y)/2;\n```","locations":[{"ref":"src/gtk/window.cpp:3739-3740","code":" 3739 |     double x = left + abs(lastX - gdk_event->x)/2;\n 3740 |     double y = up + abs(lastY - gdk_event->y)/2;","lines":2,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/gtk/window.cpp#L3739-L3740"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"high","difficulty":"medium","description":"`wxJoystick::wxJoystick(int joystick)` unconditionally creates and `Run()`s a `wxJoystickThread` as soon as a matching device is found, regardless of whether `SetCapture()` is ever called. `wxJoystickThread::Entry()` loops with `Sleep(m_polling)` where `m_polling` defaults to `0` (set in the constructor, only changed by `SetCapture()`), so until the caller opts in to polling, the background thread runs `Sleep(0)` (a bare yield) followed immediately by another `joyGetPos()` call in a tight loop, burning a full CPU core for the entire lifetime of every `wxJoystick` object, even ones only used for one-shot queries like `IsOk()` or `GetPosition()` which don't need the thread at all.","fix":"Don't start the polling thread from the constructor. Create `wxJoystickThread` (or call `Run()`) lazily only inside `SetCapture()`, and/or make `wxJoystickThread::Entry()` sleep a sane minimum interval (e.g. clamp `m_polling` to a non-zero default) instead of spinning on `Sleep(0)` while no window has captured events.","locations":[{"ref":"src/msw/joystick.cpp:98-133","code":"   98 | void* wxJoystickThread::Entry()\n   99 | {\n  100 |     joyGetPos(m_joystick, &m_lastJoyInfo);\n  101 | \n  102 |     while (!TestDestroy())\n  103 |     {\n  104 |         Sleep(m_polling);\n  105 |         long ts = GetTickCount();\n  106 | \n  107 |         joyGetPos(m_joystick, &m_joyInfo);\n  108 |         m_buttons = m_joyInfo.wButtons;\n  109 |         UINT delta = m_buttons ^ m_lastJoyInfo.wButtons;\n  110 |         UINT deltaUp = delta & ~m_buttons;\n  111 |         UINT deltaDown = delta & m_buttons;\n  112 | \n  113 |         // Use count trailing zeros to determine which button changed.\n  114 |         // Was using JOYINFOEX.dwButtons, because the docs state this is\n  115 |         // \"Current button number that is pressed.\", but it turns out\n  116 |         // it is the *total* number of buttons pressed.\n  117 |         if (deltaUp)\n  118 |             SendEvent(wxEVT_JOY_BUTTON_UP, ts, deltaUp);\n  119 |         if (deltaDown)\n  120 |             SendEvent(wxEVT_JOY_BUTTON_DOWN, ts, deltaDown);\n  121 | \n  122 |         if ((m_joyInfo.wXpos != m_lastJoyInfo.wXpos) ||\n  123 |             (m_joyInfo.wYpos != m_lastJoyInfo.wYpos) ||\n  124 |             (m_joyInfo.wZpos != m_lastJoyInfo.wZpos)   )\n  125 |         {\n  126 |             SendEvent(wxEVT_JOY_MOVE, ts);\n  127 |         }\n  128 | \n  129 |         m_lastJoyInfo = m_joyInfo;\n  130 |     }\n  131 | \n  132 |     return nullptr;\n  133 | }","lines":36,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/joystick.cpp#L98-L133"},{"ref":"src/msw/joystick.cpp:146-172","code":"  146 | wxJoystick::wxJoystick(int joystick)\n  147 | {\n  148 |     JOYINFO joyInfo;\n  149 |     int i, maxsticks;\n  150 | \n  151 |     m_thread = nullptr;\n  152 |     maxsticks = joyGetNumDevs();\n  153 |     for( i=0; i<maxsticks; i++ )\n  154 |     {\n  155 |         if( joyGetPos(i, & joyInfo) == JOYERR_NOERROR )\n  156 |         {\n  157 |             if( !joystick )\n  158 |             {\n  159 |                 /* Found the one we want, store actual OS id and return */\n  160 |                 m_joystick = i;\n  161 |                 m_thread = new wxJoystickThread(m_joystick);\n  162 |                 m_thread->Run();\n  163 |                 return;\n  164 |             }\n  165 |             joystick --;\n  166 |         }\n  167 |     }\n  168 | \n  169 |     /* No such joystick, return ID 0 */\n  170 |     m_joystick = 0;\n  171 |     return;\n  172 | }","lines":27,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/joystick.cpp#L146-L172"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`wxSVGGraphicsContext::GetPartialTextExtents()` measures each prefix by calling `m_impl->DoGetTextExtent(text.substr(0, i), ...)` for every `i` from `1` to `text.length()`. Each call re-measures the whole prefix from scratch and each `text.substr(0, i)` allocates a new `wxString`, so the loop is `O(n^2)` in text length with `O(n)` extra heap allocations. For long strings (e.g. measuring a paragraph) this is needlessly quadratic.","fix":"Measure incrementally: track a running width by measuring only the newly added character each iteration (append one glyph at a time, or measure single characters and accumulate), instead of re-measuring `text.substr(0, i)` from the start on every iteration. This reduces the work to `O(n)` measure calls and avoids per-iteration substring allocations.","locations":[{"ref":"src/common/svggc.cpp:1510-1521","code":" 1510 | void wxSVGGraphicsContext::GetPartialTextExtents(const wxString& text,\n 1511 |                                                  wxArrayDouble& widths) const\n 1512 | {\n 1513 |     widths.clear();\n 1514 |     widths.reserve(text.length());\n 1515 |     for ( size_t i = 1; i <= text.length(); ++i )\n 1516 |     {\n 1517 |         wxCoord w = 0, h = 0;\n 1518 |         m_impl->DoGetTextExtent(text.substr(0, i), &w, &h, nullptr, nullptr, &m_currentFont);\n 1519 |         widths.push_back(w);\n 1520 |     }\n 1521 | }","lines":12,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/svggc.cpp#L1510-L1521"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`wxPrinterDCImpl::DoBlit()`'s fallback paths (used whenever the printer driver lacks `RC_STRETCHDIB` support, or always for masked blits since `MaskBlt`/`StretchDIBits` aren't used for masks here) copy a bitmap to the printer one pixel at a time: for every `(x, y)` they call `::GetPixel()` (a full GDI round-trip), `::CreateSolidBrush()`, `::FillRect()` and `::DeleteObject()`. For a bitmap of `width * height` pixels this is `O(width*height)` separate GDI object creations plus at least two `GetPixel()` calls per pixel, which is extremely slow for anything but tiny bitmaps. The masked-blit loop (lines 396-423) additionally lacks the \"draw identical adjacent pixels together\" run-length optimization that the unmasked loop (lines 424-457) already applies, making the masked case even slower than it needs to be for images with repeated pixel colours.","fix":"Apply the same run-length merging used in the unmasked branch to the masked branch (skip runs of identical, identically-masked adjacent pixels in one `FillRect()` call), and consider building a `DIB`/`StretchDIBits`-based masked copy (e.g. pre-multiplying the mask into the pixel data once and using `StretchDIBits()`/`AlphaBlend()`) instead of a manual `GetPixel()`-per-pixel loop, so both fallbacks scale similarly and avoid one `GetPixel()`/`CreateSolidBrush()`/`DeleteObject()` triplet per pixel.","locations":[{"ref":"src/msw/dcprint.cpp:396-423","code":"  396 |     wxMask *mask = useMask ? bmp.GetMask() : nullptr;\n  397 |     if ( mask )\n  398 |     {\n  399 |         // If we are printing source colours are screen colours not printer\n  400 |         // colours and so we need copy the bitmap pixel by pixel.\n  401 |         RECT rect;\n  402 |         HDC dcSrc = GetHdcOf(*msw_impl);\n  403 |         MemoryHDC dcMask(dcSrc);\n  404 |         SelectInHDC selectMask(dcMask, (HBITMAP)mask->GetMaskBitmap());\n  405 | \n  406 |         for (int x = 0; x < width; x++)\n  407 |         {\n  408 |             for (int y = 0; y < height; y++)\n  409 |             {\n  410 |                 COLORREF cref = ::GetPixel(dcMask, x, y);\n  411 |                 if (cref)\n  412 |                 {\n  413 |                     HBRUSH brush = ::CreateSolidBrush(::GetPixel(dcSrc, x, y));\n  414 |                     rect.left = XLOG2DEV(xdest) + x;\n  415 |                     rect.right = rect.left + 1;\n  416 |                     rect.top = YLOG2DEV(ydest) + y;\n  417 |                     rect.bottom = rect.top + 1;\n  418 |                     ::FillRect(GetHdc(), &rect, brush);\n  419 |                     ::DeleteObject(brush);\n  420 |                 }\n  421 |             }\n  422 |         }\n  423 |     }","lines":28,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/dcprint.cpp#L396-L423"},{"ref":"src/msw/dcprint.cpp:424-457","code":"  424 |     else // no mask\n  425 |     {\n  426 |         if ( !(::GetDeviceCaps(GetHdc(), RASTERCAPS) & RC_STRETCHDIB) ||\n  427 |                 !DrawBitmapUsingStretchDIBits(GetHdc(), bmp, XLOG2DEV(xdest), YLOG2DEV(ydest)) )\n  428 |         {\n  429 |             // no support for StretchDIBits\n  430 | \n  431 |             // as we are printing, source colours are screen colours not\n  432 |             // printer colours and so we need copy the bitmap pixel by pixel.\n  433 |             HDC dcSrc = GetHdcOf(*msw_impl);\n  434 |             RECT rect;\n  435 |             for (int y = 0; y < height; y++)\n  436 |             {\n  437 |                 // optimization: draw identical adjacent pixels together.\n  438 |                 for (int x = 0; x < width; x++)\n  439 |                 {\n  440 |                     COLORREF col = ::GetPixel(dcSrc, x, y);\n  441 |                     HBRUSH brush = ::CreateSolidBrush( col );\n  442 | \n  443 |                     rect.left = XLOG2DEV(xdest) + x;\n  444 |                     rect.top = YLOG2DEV(ydest) + y;\n  445 |                     while( (x + 1 < width) &&\n  446 |                                 (::GetPixel(dcSrc, x + 1, y) == col ) )\n  447 |                     {\n  448 |                         ++x;\n  449 |                     }\n  450 |                     rect.right = XLOG2DEV(xdest) + x + 1;\n  451 |                     rect.bottom = rect.top + 1;\n  452 |                     ::FillRect((HDC) m_hDC, &rect, brush);\n  453 |                     ::DeleteObject(brush);\n  454 |                 }\n  455 |             }\n  456 |         }\n  457 |     }","lines":34,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/dcprint.cpp#L424-L457"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"In `wxBMPHandler::LoadDib` the palette buffer is over-allocated by a factor of `paletteEntrySize` (3 or 4). `paletteSize` is a byte count (`paletteEntrySize*desc.ncolors`) but is used as the element count for a `BMPPalette` array: `desc.paletteData.reset(new BMPPalette[paletteSize]);`. Only `desc.ncolors` entries are ever written or read, so 3-4x the needed `BMPPalette` structs are allocated.","fix":"```cpp\n// before\ndesc.paletteData.reset(new BMPPalette[paletteSize]);\n// after\ndesc.paletteData.reset(new BMPPalette[desc.ncolors]);\n```","locations":[{"ref":"src/common/imagbmp.cpp:1272","code":" 1272 |         desc.paletteData.reset(new BMPPalette[paletteSize]);","lines":1,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/imagbmp.cpp#L1272"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`wxClientDCImpl` fully initializes the DC twice: the base `wxWindowDCImpl(owner, win)` constructor calls `InitForWin(win, nullptr)`, which allocates a DirectFB subsurface, calls `DFBInit()`, `SetFont()` and `SetDeviceOrigin()`, and then the `wxClientDCImpl` body immediately calls `InitForWin(win, &rect)` again, recreating the surface and redoing all of that work. This redundant subsurface allocation and font setup happens on every client-area DC creation, which is a hot path (every `wxClientDC`/paint).","fix":"Avoid the double initialization, e.g. give `wxWindowDCImpl` a protected constructor that does not call `InitForWin`, and have `wxClientDCImpl` call `InitForWin` exactly once with the client rect.","locations":[{"ref":"src/dfb/dcclient.cpp:231-238","code":"  231 | wxClientDCImpl::wxClientDCImpl(wxDC *owner, wxWindow *win)\n  232 |               : wxWindowDCImpl(owner, win)\n  233 | {\n  234 |     wxCHECK_RET( win, \"invalid window\" );\n  235 | \n  236 |     wxRect rect = win->GetClientRect();\n  237 |     InitForWin(win, &rect);\n  238 | }","lines":8,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/dfb/dcclient.cpp#L231-L238"},{"ref":"src/dfb/dcclient.cpp:96-100","code":"   96 | wxWindowDCImpl::wxWindowDCImpl(wxDC *owner, wxWindow *win)\n   97 |               : wxDFBDCImpl(owner)\n   98 | {\n   99 |     InitForWin(win, nullptr);\n  100 | }","lines":5,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/dfb/dcclient.cpp#L96-L100"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"The non-GTK path of `GetPartialTextExtents()` is O(n^2): for every character index `i` it rebuilds the substring `text.SubString(0, i)`, re-encodes it to UTF-8, and re-measures the entire prefix with `cairo_text_extents()`. For long strings this repeatedly re-measures the whole prefix instead of accumulating incremental widths.","fix":"Measure each successive character's advance once and accumulate a running total (or measure the whole string once with per-glyph extents) rather than re-measuring the growing prefix on every iteration.","locations":[{"ref":"src/generic/graphicc.cpp:3142-3151","code":" 3142 |     for (size_t i = 0; i < text.length(); i++)\n 3143 |     {\n 3144 |         const wxCharBuffer data = text.SubString(0, i).utf8_str();\n 3145 | \n 3146 |         cairo_text_extents_t te;\n 3147 |         cairo_text_extents(m_context, (const char*)data, &te);\n 3148 | \n 3149 |         widths.push_back(te.width);\n 3150 |     }\n 3151 | #endif","lines":10,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/graphicc.cpp#L3142-L3151"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"In `wxGridSelection::SetSelectionMode()`, when `m_grid->UsesOverlaySelection()` is true, `ComputeSelectionShape()` is invoked once per erased block *inside* the removal loop (line 175). `ComputeSelectionShape()` rebuilds the entire selection polygon from all rectangles each time, so removing K invalid blocks recomputes the whole shape K times. It should be computed a single time after the loop, as is done in `DeselectBlock()` (line 394-397) and `ClearSelection()`.","fix":"Remove the per-iteration `ComputeSelectionShape()` call inside the loop and instead call it once after the loop finishes (guarded by `if ( m_grid->UsesOverlaySelection() )`), matching the pattern in `DeselectBlock()`.","locations":[{"ref":"src/generic/gridsel.cpp:169-185","code":"  169 |             if ( !valid )\n  170 |             {\n  171 |                 m_selection.erase(m_selection.begin() + n);\n  172 | \n  173 |                 if ( m_grid->UsesOverlaySelection() )\n  174 |                 {\n  175 |                     ComputeSelectionShape();\n  176 |                 }\n  177 |                 else if ( !m_grid->GetBatchCount() )\n  178 |                 {\n  179 |                     m_grid->RefreshBlock(block.GetTopLeft(), block.GetBottomRight());\n  180 |                 }\n  181 |             }\n  182 |         }\n  183 | \n  184 |         m_selectionMode = selmode;\n  185 |     }","lines":17,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/gridsel.cpp#L169-L185"}]},
{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"In the non-alpha branch of `wxGenericColourDialog::PaintCustomColour()` a `wxBrush` is needlessly heap-allocated with `new` and immediately `delete`d within the same scope; a stack object is simpler and avoids the allocation and manual delete.","fix":"Replace:\n```\n    wxBrush *brush = new wxBrush(m_colourData.GetColour());\n    dc.SetBrush(*brush);\n\n    dc.DrawRectangle(m_singleCustomColourRect);\n\n    dc.SetBrush(wxNullBrush);\n    delete brush;\n```\nwith:\n```\n    wxBrush brush(m_colourData.GetColour());\n    dc.SetBrush(brush);\n\n    dc.DrawRectangle(m_singleCustomColourRect);\n\n    dc.SetBrush(wxNullBrush);\n```","locations":[{"ref":"src/generic/colrdlgg.cpp:556-564","code":"  556 |     dc.SetPen(*wxBLACK_PEN);\n  557 | \n  558 |     wxBrush *brush = new wxBrush(m_colourData.GetColour());\n  559 |     dc.SetBrush(*brush);\n  560 | \n  561 |     dc.DrawRectangle(m_singleCustomColourRect);\n  562 | \n  563 |     dc.SetBrush(wxNullBrush);\n  564 |     delete brush;","lines":9,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/colrdlgg.cpp#L556-L564"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"In `include/wx/osx/iphone/chkconf.h`, several feature-disabling blocks are duplicated verbatim within the same file. `wxUSE_DRAG_AND_DROP` is unconditionally undef'd/redefined to `0` at lines 53-56 and then the identical guarded block `#if wxUSE_DRAG_AND_DROP / #undef ... / #define wxUSE_DRAG_AND_DROP 0 / #endif` is repeated at lines 68-71; `wxUSE_TASKBARICON` is likewise duplicated at lines 58-61 and again at lines 73-76. Similarly `wxUSE_RICHTEXT` is unconditionally set to `0` at lines 116-117, and then a second, `#if`-guarded copy appears at lines 345-348 - but since the first, unconditional block already forced `wxUSE_RICHTEXT` to `0` earlier in the same translation unit, the second `#if wxUSE_RICHTEXT` guard can never be true, making that whole later block permanently unreachable. These duplications appear to be leftover copy-paste artifacts from merging/editing the file over time.","fix":"Remove the redundant duplicate blocks: keep a single `#if wxUSE_DRAG_AND_DROP / #undef ... / #define wxUSE_DRAG_AND_DROP 0 / #endif` block (delete lines 68-71), a single `wxUSE_TASKBARICON` block (delete lines 73-76), and delete the dead, unreachable `#if wxUSE_RICHTEXT ... #endif` block at lines 345-348 since `wxUSE_RICHTEXT` is already forced to `0` unconditionally at lines 116-117.","locations":[{"ref":"include/wx/osx/iphone/chkconf.h:53-76","code":"   53 | #if wxUSE_DRAG_AND_DROP\n   54 | #undef wxUSE_DRAG_AND_DROP\n   55 | #define wxUSE_DRAG_AND_DROP 0\n   56 | #endif\n   57 | \n   58 | #if wxUSE_TASKBARICON\n   59 | #undef wxUSE_TASKBARICON\n   60 | #define wxUSE_TASKBARICON 0\n   61 | #endif\n   62 | \n   63 | #if wxUSE_TOOLTIPS\n   64 | #undef wxUSE_TOOLTIPS\n   65 | #define wxUSE_TOOLTIPS 0\n   66 | #endif\n   67 | \n   68 | #if wxUSE_DRAG_AND_DROP\n   69 | #undef wxUSE_DRAG_AND_DROP\n   70 | #define wxUSE_DRAG_AND_DROP 0\n   71 | #endif\n   72 | \n   73 | #if wxUSE_TASKBARICON\n   74 | #undef wxUSE_TASKBARICON\n   75 | #define wxUSE_TASKBARICON 0\n   76 | #endif","lines":24,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/osx/iphone/chkconf.h#L53-L76"},{"ref":"include/wx/osx/iphone/chkconf.h:116-117","code":"  116 | #undef wxUSE_RICHTEXT\n  117 | #define wxUSE_RICHTEXT 0","lines":2,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/osx/iphone/chkconf.h#L116-L117"},{"ref":"include/wx/osx/iphone/chkconf.h:345-348","code":"  345 | #if wxUSE_RICHTEXT\n  346 | #undef wxUSE_RICHTEXT\n  347 | #define wxUSE_RICHTEXT 0\n  348 | #endif","lines":4,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/osx/iphone/chkconf.h#L345-L348"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"In `wxAuiTabContainer::RenderButtons()`, `page_count` is set to `m_pages.GetCount()` at the top (line 716) and `m_pages` is never modified inside the function, yet the loop `for (i = page_count; i < m_pages.GetCount(); ++i)` iterates from `page_count` up to `m_pages.GetCount()`. Since these are always equal, the loop body (hiding unused tab buttons) never executes, making the block dead code that fails to accomplish what its comment claims.","fix":"Either remove this dead loop, or fix its intent (the following loop at line 893 correctly hides buttons for tabs before `m_tabOffset`); as written `for (i = page_count; i < m_pages.GetCount(); ++i)` can never run.","locations":[{"ref":"src/aui/auibook.cpp:890-896","code":"  890 |     // update the tab buttons visibility\n  891 |     // make sure tab button entries which aren't used are marked as hidden\n  892 |     for (i = page_count; i < m_pages.GetCount(); ++i)\n  893 |     {\n  894 |         for (auto& button : m_pages[i].buttons)\n  895 |             button.curState |= wxAUI_BUTTON_STATE_HIDDEN;\n  896 |     }","lines":7,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/aui/auibook.cpp#L890-L896"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"In `wxDataViewChoiceByIndexRenderer::GetAccessibleDescription()`, the guard `if ( wxDataViewChoiceRenderer::GetValue(strVal) ) return strVal;` is always taken because `wxDataViewChoiceRenderer::GetValue()` unconditionally `return true;`. Consequently the fallback `return wxString::Format(wxS(\"%li\"), (long)GetChoices().Index(strVal.GetString()));` is unreachable dead code (and would in any case call `Index()` on an already-populated `strVal`, so it never represents the intended index-based description).","fix":"Drop the dead fallback and simply return the string obtained from the base class: `wxVariant strVal; wxDataViewChoiceRenderer::GetValue(strVal); return strVal.GetString();`, or, if an index-based description is actually desired, compute it directly from `m_data`/`GetChoices()` without the always-true guard.","locations":[{"ref":"src/common/datavcmn.cpp:2060-2069","code":" 2060 | #if wxUSE_ACCESSIBILITY\n 2061 | wxString wxDataViewChoiceByIndexRenderer::GetAccessibleDescription() const\n 2062 | {\n 2063 |     wxVariant strVal;\n 2064 |     if ( wxDataViewChoiceRenderer::GetValue(strVal) )\n 2065 |         return strVal;\n 2066 | \n 2067 |     return wxString::Format(wxS(\"%li\"), (long)GetChoices().Index(strVal.GetString()));\n 2068 | }\n 2069 | #endif // wxUSE_ACCESSIBILITY","lines":10,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/datavcmn.cpp#L2060-L2069"}]},
{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`wxImage::Blur` allocates a fresh image with `ret_image.Create(M_IMGDATA->m_width, M_IMGDATA->m_height, false);` and then immediately overwrites `ret_image` with the result of `BlurHorizontal(blurRadius)`, discarding the just-allocated buffer. The `Create` call is wasted work; it also dereferences `M_IMGDATA` without an `IsOk()` check unlike the rest of the class.","fix":"Remove the redundant allocation:\n```\nwxImage wxImage::Blur(int blurRadius) const\n{\n    wxImage ret_image = BlurHorizontal(blurRadius);\n    ret_image = ret_image.BlurVertical(blurRadius);\n    return ret_image;\n}\n```","locations":[{"ref":"src/common/image.cpp:1325-1335","code":" 1325 | wxImage wxImage::Blur(int blurRadius) const\n 1326 | {\n 1327 |     wxImage ret_image;\n 1328 |     ret_image.Create(M_IMGDATA->m_width, M_IMGDATA->m_height, false);\n 1329 | \n 1330 |     // Blur the image in each direction\n 1331 |     ret_image = BlurHorizontal(blurRadius);\n 1332 |     ret_image = ret_image.BlurVertical(blurRadius);\n 1333 | \n 1334 |     return ret_image;\n 1335 | }","lines":11,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/common/image.cpp#L1325-L1335"}]},
{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"In `wxPostScriptPrintPreview::DetermineScaling` the statement `if (paperType == wxPAPER_NONE) paperType = wxPAPER_NONE;` is a no-op: it assigns the value it just compared against. It looks like a copy-paste artifact (a real default, e.g. `wxPAPER_A4`, was probably intended), though the code below already falls back to `wxPAPER_A4` when `FindPaperType` returns null, so the lines are simply dead.","fix":"Remove the dead conditional:\n```cpp\n    wxPaperSize paperType = m_printDialogData.GetPrintData().GetPaperId();\n```\n(delete the `if (paperType == wxPAPER_NONE) paperType = wxPAPER_NONE;` lines).","locations":[{"ref":"src/generic/printps.cpp:304-306","code":"  304 |     wxPaperSize paperType = m_printDialogData.GetPrintData().GetPaperId();\n  305 |     if (paperType == wxPAPER_NONE)\n  306 |         paperType = wxPAPER_NONE;","lines":3,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/generic/printps.cpp#L304-L306"}]},
{"id":"DEAD_6","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`gnome_vfs_mime_set_icon` is declared with `wxDL_METHOD_DEFINE` but `InitializeMethods()` never calls `wxDL_METHOD_LOAD` for it (only `gnome_vfs_init` and `gnome_vfs_shutdown` are loaded), and the function is referenced nowhere else in the tree. The generated method pointer `m_pfngnome_vfs_mime_set_icon` is therefore left uninitialized; because `wxDL_METHOD_DEFINE` only guards the call with `m_ok` (which becomes true after the two real symbols load), any future call to `gnome_vfs_mime_set_icon()` would jump through an uninitialized pointer rather than returning the default. As written it is dead code, but a latent trap.","fix":"Either remove the unused `wxDL_METHOD_DEFINE(... gnome_vfs_mime_set_icon ...)`, or add `wxDL_METHOD_LOAD( m_libGnomeVFS, gnome_vfs_mime_set_icon );` in `InitializeMethods()` so the pointer is actually resolved before use.","locations":[{"ref":"src/gtk/gnome/gvfs.cpp:58-59","code":"   58 |     wxDL_METHOD_DEFINE( GnomeVFSResult, gnome_vfs_mime_set_icon,\n   59 |         (const char *mime_type, const char *filename), (mime_type, filename), GNOME_VFS_OK )","lines":2,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/gtk/gnome/gvfs.cpp#L58-L59"},{"ref":"src/gtk/gnome/gvfs.cpp:85-91","code":"   85 | bool wxGnomeVFSLibrary::InitializeMethods()\n   86 | {\n   87 |     wxDL_METHOD_LOAD( m_libGnomeVFS, gnome_vfs_init );\n   88 |     wxDL_METHOD_LOAD( m_libGnomeVFS, gnome_vfs_shutdown );\n   89 | \n   90 |     return true;\n   91 | }","lines":7,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/gtk/gnome/gvfs.cpp#L85-L91"}]},
{"id":"DEAD_7","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"In `wxChmFSHandler::OpenFile()`, `s = new wxChmInputStream(...)` is followed by `if (s) { return new wxFSFile(...); }` and then `delete s; return nullptr;`. Since `new` never returns null (it throws on failure), the `if (s)` is always true and the trailing `delete s; return nullptr;` is unreachable dead code. Worse, the stream's validity is never checked (`wxChmInputStream` sets `m_lasterror` on failure), so a `wxFSFile` wrapping a failed stream is still returned.","fix":"Check the stream state instead of the pointer, e.g. `if (s->IsOk()) return new wxFSFile(...); delete s; return nullptr;` (relying on `wxInputStream::IsOk()`/`GetLastError()`).","locations":[{"ref":"src/html/chm.cpp:833-845","code":"  833 |     s = new wxChmInputStream(leftFilename.GetFullPath(), right, true);\n  834 | \n  835 |     if ( s )\n  836 |     {\n  837 |         return new wxFSFile(s,\n  838 |                             left + wxT(\"#chm:\") + right,\n  839 |                             wxEmptyString,\n  840 |                             GetAnchor(location),\n  841 |                             wxDateTime(leftFilename.GetModificationTime()));\n  842 |     }\n  843 | \n  844 |     delete s;\n  845 |     return nullptr;","lines":13,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/html/chm.cpp#L833-L845"}]},
{"id":"DEAD_8","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`wxBitmapBundleImplRC::GetPreferredBitmapSizeAtScale()` builds a `wxVector<double> scales(n)` and fills it in a loop, but the `scales` vector is never used: the function returns `DoGetPreferredSize(scale)`, which relies on the virtual `GetNextAvailableScale()` and does not take the vector. The loop is pure dead code and a needless heap allocation on every call.","fix":"Remove the unused vector and loop:\n```cpp\nwxSize wxBitmapBundleImplRC::GetPreferredBitmapSizeAtScale(double scale) const\n{\n    return DoGetPreferredSize(scale);\n}\n```","locations":[{"ref":"src/msw/bmpbndl.cpp:200-210","code":"  200 | wxSize wxBitmapBundleImplRC::GetPreferredBitmapSizeAtScale(double scale) const\n  201 | {\n  202 |     const size_t n = m_resourceInfos.size();\n  203 |     wxVector<double> scales(n);\n  204 |     for ( size_t i = 0; i < n; ++i )\n  205 |     {\n  206 |         scales[i] = m_resourceInfos[i].scale;\n  207 |     }\n  208 | \n  209 |     return DoGetPreferredSize(scale);\n  210 | }","lines":11,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/bmpbndl.cpp#L200-L210"}]},
{"id":"DEAD_9","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"In `wxJoystick::GetButtonState()`, the `#if 0` block spanning lines `235`-`248` is unreachable twice over: it is preprocessed out (`#if 0`) and even if it were compiled in it sits after the unconditional `return joyInfo.wButtons;` on line `234`, so it can never execute.","fix":"Delete the dead `#if 0 ... #endif` block (lines `235`-`248`); it duplicates logic that `return joyInfo.wButtons;` already replaced.","locations":[{"ref":"src/msw/joystick.cpp:234-248","code":"  234 |         return joyInfo.wButtons;\n  235 | #if 0\n  236 |         int buttons = 0;\n  237 | \n  238 |         if (joyInfo.wButtons & JOY_BUTTON1)\n  239 |             buttons |= wxJOY_BUTTON1;\n  240 |         if (joyInfo.wButtons & JOY_BUTTON2)\n  241 |             buttons |= wxJOY_BUTTON2;\n  242 |         if (joyInfo.wButtons & JOY_BUTTON3)\n  243 |             buttons |= wxJOY_BUTTON3;\n  244 |         if (joyInfo.wButtons & JOY_BUTTON4)\n  245 |             buttons |= wxJOY_BUTTON4;\n  246 | \n  247 |         return buttons;\n  248 | #endif","lines":15,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/msw/joystick.cpp#L234-L248"}]},

{"id":"DEAD_12","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"`include/wx/osx/dc.h` is an empty stub containing only an include guard (`_WX_DC_H_`, which differs from the real base header guard `_WX_DC_H_BASE_` in `wx/dc.h`). Nothing includes this file (a repo-wide grep for `osx/dc.h` finds only its own header comment), so it is dead/leftover code that adds confusion (e.g. its guard `_WX_DC_H_` could silently suppress an unrelated header using the same guard name if ever included).","fix":"Remove the unused `include/wx/osx/dc.h` file, or, if it must be kept as a placeholder, give it a unique, correct include guard such as `_WX_OSX_DC_H_` and a comment explaining why it is intentionally empty.","locations":[{"ref":"include/wx/osx/dc.h:1-13","code":"    1 | /////////////////////////////////////////////////////////////////////////////\n    2 | // Name:        wx/osx/dc.h\n    3 | // Purpose:     wxDC class\n    4 | // Author:      Stefan Csomor\n    5 | // Created:     1998-01-01\n    6 | // Copyright:   (c) Stefan Csomor\n    7 | // Licence:     wxWindows licence\n    8 | /////////////////////////////////////////////////////////////////////////////\n    9 | \n   10 | #ifndef _WX_DC_H_\n   11 | #define _WX_DC_H_\n   12 | \n   13 | #endif // _WX_DC_H_","lines":13,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/include/wx/osx/dc.h#L1-L13"}]},

{"id":"DEAD_16","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`SetWindowStyleFlag` calls `wxControl::SetWindowStyleFlag(style)` twice (once at line 995, again at line 1018) with the same argument. The first call is needed so the subsequent reads of `m_windowStyle` see the new style; the second call is redundant.","fix":"Remove the duplicated second call at line 1018:\n```cpp\n    // wxControl::SetWindowStyleFlag(style);  // delete this redundant second call\n\n    const auto newBgStyle = m_windowStyle & wxAUI_TB_PLAIN_BACKGROUND;\n```","locations":[{"ref":"src/aui/auibar.cpp:995-1020","code":"  995 |     wxControl::SetWindowStyleFlag(style);\n  996 | \n  997 |     if (m_art)\n  998 |     {\n  999 |         SetArtFlags();\n 1000 |     }\n 1001 | \n 1002 |     if (m_windowStyle & wxAUI_TB_GRIPPER)\n 1003 |         m_gripperVisible = true;\n 1004 |     else\n 1005 |         m_gripperVisible = false;\n 1006 | \n 1007 | \n 1008 |     if (m_windowStyle & wxAUI_TB_OVERFLOW)\n 1009 |         m_overflowVisible = true;\n 1010 |     else\n 1011 |         m_overflowVisible = false;\n 1012 | \n 1013 |     if (style & wxAUI_TB_HORZ_LAYOUT)\n 1014 |         SetToolTextOrientation(wxAUI_TBTOOL_TEXT_RIGHT);\n 1015 |     else\n 1016 |         SetToolTextOrientation(wxAUI_TBTOOL_TEXT_BOTTOM);\n 1017 | \n 1018 |     wxControl::SetWindowStyleFlag(style);\n 1019 | \n 1020 |     const auto newBgStyle = m_windowStyle & wxAUI_TB_PLAIN_BACKGROUND;","lines":26,"link":"https://github.com/wxWidgets/wxWidgets/blob/feea732352793740a8c0128a4cf5db4e4f91cf16/src/aui/auibar.cpp#L995-L1020"}]},
