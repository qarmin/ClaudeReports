{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"critical","difficulty":"medium","description":"`draw_line_scalar` computes buffer indices with **unsigned** `usize` arithmetic on values that\ncan legitimately be negative, so the address computation overflows *before* the bounds check\nthat is supposed to protect it. `x0i`/`x1i` are `i32` (`x0.floor() as i32`) and are negative\nwhenever the line lies left of the raster origin. The `add_assign_a_idx!` macro guards against\nout-of-bounds with `self.a.get_mut($lhs)`, but `$lhs` is evaluated first: `linestart + x1i as usize`\ncasts a negative `i32` to a near-`usize::MAX` value and then adds `linestart`, which overflows.\n\nOnly the first index is computed safely - line 141 uses `isize` (`linestart as isize + x0i as isize`)\nand is checked at line 142. The three later writes at lines 162, 165 and 167 all use plain\n`usize` arithmetic and are unprotected.\n\nConfirmed reachable through the public safe API:\n\n```rust\nlet mut r = Rasterizer::new(4, 4);\nr.draw_line(point(-3.0, 0.0), point(3.0, 4.0));\n// thread panicked at rasterizer/src/raster.rs:167:35:\n// attempt to add with overflow\n```\n\nIn debug builds this is a hard panic; in release builds the add wraps to a huge index, `get_mut`\nreturns `None`, and the pixel is silently dropped (see the separate `x = xnext` finding for the\nknock-on corruption). The existing regression test `rusttype_156_index_panic` shows this exact\nclass of index panic was patched once already, but the `get_mut` guard does not cover the\narithmetic that produces the index.\n","fix":"Do all index math in `isize` (or clamp `x0i`/`x1i` to `0..width` up front) so no negative value is\never cast to `usize`. Change the macro to take a signed index and reject negatives itself:\n\n```rust\n/// Does `self.a[$lhs] += $rhs` except if `$lhs` is negative or oob `continue` instead of panic.\nmacro_rules! add_assign_a_idx {\n    ($lhs:expr, $rhs:expr) => {\n        match usize::try_from($lhs).ok().and_then(|i| self.a.get_mut(i)) {\n            Some(v) => *v += $rhs,\n            None => continue,\n        };\n    };\n}\n```\n\nthen pass signed expressions at every call site, e.g.\n\n```rust\nlet linestart = (y * self.width) as isize;\n// ...\nadd_assign_a_idx!(linestart + x0i as isize, d - d * xmf);\nadd_assign_a_idx!(linestart + x0i as isize + 1, d * xmf);\n// ...\nadd_assign_a_idx!(linestart + x1i as isize, d * am);\n```\n\nand drop the now-redundant `linestart_x0i < 0` early-`continue`.\n","locations":[{"ref":"rasterizer/src/raster.rs:105-113","code":"  105 |         /// Does `self.a[$lhs] += $rhs` except if $lhs is oob `continue` instead of panic.\n  106 |         macro_rules! add_assign_a_idx {\n  107 |             ($lhs:expr, $rhs:expr) => {\n  108 |                 match self.a.get_mut($lhs) {\n  109 |                     Some(v) => *v += $rhs,\n  110 |                     None => continue,\n  111 |                 };\n  112 |             };\n  113 |         }","lines":9,"link":"https://github.com/alexheretic/ab-glyph/blob/3eb21a592819d9ed78e9a13ad7392d46c60ce39e/rasterizer/src/raster.rs#L105-L113"},{"ref":"rasterizer/src/raster.rs:159-166","code":"  159 |                     for xi in x0i + 2..x1i - 1 {\n  160 |                         add_assign_a_idx!(linestart + xi as usize, d * s);\n  161 |                     }\n  162 |                     let a2 = a1 + (x1i - x0i - 3) as f32 * s;\n  163 |                     add_assign_a_idx!(linestart + (x1i - 1) as usize, d * (1.0 - a2 - am));\n  164 |                 }\n  165 |                 add_assign_a_idx!(linestart + x1i as usize, d * am);\n  166 |             }","lines":8,"link":"https://github.com/alexheretic/ab-glyph/blob/3eb21a592819d9ed78e9a13ad7392d46c60ce39e/rasterizer/src/raster.rs#L159-L166"},{"ref":"rasterizer/src/raster.rs:136-142","code":"  136 |             let x0i = x0floor as i32;\n  137 |             let x1ceil = x1.ceil();\n  138 |             let x1i = x1ceil as i32;\n  139 |             let linestart_x0i = linestart as isize + x0i as isize;\n  140 |             if linestart_x0i < 0 {\n  141 |                 continue;\n  142 |             }","lines":7,"link":"https://github.com/alexheretic/ab-glyph/blob/3eb21a592819d9ed78e9a13ad7392d46c60ce39e/rasterizer/src/raster.rs#L136-L142"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`OutlinedGlyph::draw` derives the rasterizer grid straight from `px_bounds()` with no upper bound,\nthen hands it to `Rasterizer::new`, which does `vec![0.0; width * height + 4]`. Because `px_bounds`\nscales with the caller's `PxScale`, a large scale produces an enormous allocation that aborts the\nprocess. Any application that lets a user pick a font size can be crashed by an absurd value.\n\nMeasured with `Exo2-Light.otf`, glyph `'q'`, `PxScale::from(1.0e6)`:\n\n```\npx_bounds w=353334 h=584167\nwould allocate 206406062778 f32 = 825624251112 bytes   // ~825 GB\n```\n\nOn 32-bit targets the failure comes even earlier: `width * height` overflows `usize` inside\n`Rasterizer::new`, which panics with \"attempt to multiply with overflow\" in debug and silently\nwraps to a far-too-small buffer in release, while `self.width`/`self.height` keep claiming the\nlarge dimensions.\n","fix":"Use checked arithmetic in the rasterizer and give `ab_glyph` a fallible draw path. In\n`Rasterizer::new`/`Rasterizer::reset`:\n\n```rust\nlet len = width\n    .checked_mul(height)\n    .and_then(|n| n.checked_add(4))\n    .expect(\"Rasterizer dimensions overflow usize\");\n```\n\nand add a `try_new(width, height) -> Option<Self>` that returns `None` instead of panicking. Then\nin `OutlinedGlyph::draw`, guard before allocating:\n\n```rust\nlet (w, h) = (\n    self.px_bounds.width() as usize,\n    self.px_bounds.height() as usize,\n);\nlet Some(px_count) = w.checked_mul(h).filter(|&n| n <= MAX_RASTER_PIXELS) else {\n    return; // or expose a `try_draw` returning Result\n};\n```\n","locations":[{"ref":"glyph/src/outlined.rs:107-122","code":"  107 |     pub fn draw<O: FnMut(u32, u32, f32)>(&self, o: O) {\n  108 |         use ab_glyph_rasterizer::Rasterizer;\n  109 |         let h_factor = self.scale_factor.horizontal;\n  110 |         let v_factor = -self.scale_factor.vertical;\n  111 |         let offset = self.glyph.position - self.px_bounds.min;\n  112 |         let (w, h) = (\n  113 |             self.px_bounds.width() as usize,\n  114 |             self.px_bounds.height() as usize,\n  115 |         );\n  116 | \n  117 |         let scale_up = |&Point { x, y }| point(x * h_factor, y * v_factor);\n  118 | \n  119 |         self.outline\n  120 |             .curves\n  121 |             .iter()\n  122 |             .fold(Rasterizer::new(w, h), |mut rasterizer, curve| match curve {","lines":16,"link":"https://github.com/alexheretic/ab-glyph/blob/3eb21a592819d9ed78e9a13ad7392d46c60ce39e/glyph/src/outlined.rs#L107-L122"},{"ref":"rasterizer/src/raster.rs:43-50","code":"   43 |     pub fn new(width: usize, height: usize) -> Self {\n   44 |         Self {\n   45 |             width,\n   46 |             height,\n   47 |             a: vec![0.0; width * height + 4],\n   48 |             draw_line_fn: optimal_draw_line_fn(),\n   49 |         }\n   50 |     }","lines":8,"link":"https://github.com/alexheretic/ab-glyph/blob/3eb21a592819d9ed78e9a13ad7392d46c60ce39e/rasterizer/src/raster.rs#L43-L50"},{"ref":"rasterizer/src/raster.rs:62-67","code":"   62 |     pub fn reset(&mut self, width: usize, height: usize) {\n   63 |         self.width = width;\n   64 |         self.height = height;\n   65 |         self.a.clear();\n   66 |         self.a.resize(width * height + 4, 0.0);\n   67 |     }","lines":6,"link":"https://github.com/alexheretic/ab-glyph/blob/3eb21a592819d9ed78e9a13ad7392d46c60ce39e/rasterizer/src/raster.rs#L62-L67"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`Font::font_data` has a default body of `unimplemented!()`. Any `Font` implementor written before\nthe method was added - exactly the case the comment says it is protecting - panics with\n\"not implemented\" when a caller invokes `font_data()`. This is reachable from safe code with no\nwarning: `FontArc::from(Arc<dyn Font + Send + Sync>)` accepts an arbitrary external implementor,\nand `FontArc::font_data` forwards blindly to it.\n\nThe trait's own doc for `font_data` documents it as a normal accessor with an example, giving no\nhint that it may panic; the only warning is the non-doc `// panic impl prevents ...` comment on the\nline above the `unimplemented!()`.\n","fix":"Document the panic now and remove it at the next breaking change. Minimally, promote the warning\ninto the rustdoc so callers see it:\n\n```rust\n/// # Panics\n/// The default implementation panics. `FontRef`, `FontVec` & `FontArc` override it, but\n/// external `Font` implementors written before this method existed do not.\n#[inline]\nfn font_data(&self) -> &[u8] {\n    unimplemented!(\"`Font::font_data` is not implemented for this font type\")\n}\n```\n\nBetter, change the signature to `fn font_data(&self) -> Option<&[u8]> { None }` (or return `&[]`)\nso the default is merely uninformative rather than fatal.\n","locations":[{"ref":"glyph/src/font.rs:305-322","code":"  305 |     /// Extracts a slice containing the data passed into e.g. [`FontArc::try_from_slice`].\n  306 |     ///\n  307 |     /// # Example\n  308 |     /// ```\n  309 |     /// # use ab_glyph::*;\n  310 |     /// # fn main() -> Result<(), InvalidFont> {\n  311 |     /// # let owned_font_data = include_bytes!(\"../../dev/fonts/Exo2-Light.otf\");\n  312 |     /// let font = FontArc::try_from_slice(owned_font_data)?;\n  313 |     /// assert_eq!(font.font_data(), owned_font_data);\n  314 |     /// # Ok(()) }\n  315 |     /// ```\n {"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"`draw_quad` computes its subdivision count as `1 + (tol * devsq).sqrt().sqrt().floor() as usize`.\nA float-to-integer `as` cast in Rust saturates, so a non-finite or very large `devsq` yields\n`usize::MAX`, and the `1 +` then overflows. `devsq` is derived directly from the caller's control\npoints (`devx * devx + devy * devy`), so any coordinate large enough to square to infinity - for\nexample a `PxScale` big enough that `scale_up` overflows `f32` - triggers it.\n\nConfirmed through the public safe API:\n\n```rust\nlet mut r = Rasterizer::new(4, 4);\nr.draw_quad(point(0.0, 0.0), point(f32::MAX, f32::MAX), point(1.0, 1.0));\n// thread panicked at rasterizer/src/raster.rs:189:17:\n// attempt to add with overflow\n```\n\nIn release builds the add wraps `n` to `0`, and the following `for _i in 0..n - 1` underflows to\n`0..usize::MAX`, turning a single curve into an effectively infinite tessellation loop - a hang\nrather than a panic.\n","fix":"Clamp the segment count instead of relying on the saturating cast. Replace\n\n```rust\nlet tol = 3.0;\nlet n = 1 + (tol * devsq).sqrt().sqrt().floor() as usize;\n```\n\nwith\n\n```rust\nconst MAX_QUAD_SEGMENTS: usize = 1 << 16;\nlet tol = 3.0;\nlet n = ((tol * devsq).sqrt().sqrt().floor() as usize).clamp(0, MAX_QUAD_SEGMENTS - 1) + 1;\n```\n\n`devsq` is already known to be `>= 0.333` at this point (the `< 0.333` case returned early), and\n`NaN as usize` is `0`, so the clamp makes `n` always land in `1..=MAX_QUAD_SEGMENTS`.\n","locations":[{"ref":"rasterizer/src/raster.rs:178-197","code":"  178 |     pub fn draw_quad(&mut self, p0: Point, p1: Point, p2: Point) {\n  179 |         let devx = p0.x - 2.0 * p1.x + p2.x;\n  180 |         let devy = p0.y - 2.0 * p1.y + p2.y;\n  181 |         let devsq = devx * devx + devy * devy;\n  182 |         if devsq < 0.333 {\n  183 |             self.draw_line(p0, p2);\n  184 |             return;\n  185 |         }\n  186 |         let tol = 3.0;\n  187 |         let n = 1 + (tol * devsq).sqrt().sqrt().floor() as usize;\n  188 |         let mut p = p0;\n  189 |         let nrecip = (n as f32).recip();\n  190 |         let mut t = 0.0;\n  191 |         for _i in 0..n - 1 {\n  192 |             t += nrecip;\n  193 |             let pn = lerp(t, lerp(t, p0, p1), lerp(t, p1, p2));\n  194 |             self.draw_line(p, pn);\n  195 |             p = pn;\n  196 |         }\n  197 |         self.draw_line(p, p2);","lines":20,"link":"https://github.com/alexheretic/ab-glyph/blob/3eb21a592819d9ed78e9a13ad7392d46c60ce39e/rasterizer/src/raster.rs#L178-L197"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In `draw_line_scalar` the running x position is advanced by `x = xnext;` as the *last* statement of\nthe `y` loop body, but several paths `continue` before reaching it: the explicit\n`if linestart_x0i < 0 { continue; }` guard, and every `None` arm of the `add_assign_a_idx!` macro\nthat is expanded directly in the loop body (lines 147, 148, 155, 157, 160, 165, 167).\n\nSkipping `x = xnext` desynchronises `x` from the line's actual geometry: the next scanline resumes\nfrom a stale x, so all remaining rows are rasterized along the wrong slope. A line entering the\nraster from the left is the clean example - row 0 is rejected by the `linestart_x0i < 0` guard, and\nrow 1 then re-uses row 0's `x` instead of the advanced one.\n\nThis is a separate defect from the index-arithmetic overflow at the same call sites: even after the\nindices are made safe, dropping an out-of-range *pixel* must not also drop the *x advance*.\n","fix":"Move the state update out of the fallible region. Compute `xnext`, then restructure so the body\ncannot exit without advancing - e.g. wrap the pixel writes in a closure/inner block and advance\nafter it:\n\n```rust\nfor y in y0..self.height.min(p1.y.ceil() as usize) {\n    let linestart = y * self.width;\n    let dy = ((y + 1) as f32).min(p1.y) - (y as f32).max(p0.y);\n    let xnext = x + dxdy * dy;\n    // ... all pixel writes, using `break`/no-op instead of `continue` on oob ...\n    x = xnext;   // unconditionally reached\n}\n```\n\nThe simplest mechanical version is to change the macro's `None` arm from `continue` to a no-op\n(`None => {}`) and replace the `linestart_x0i < 0` `continue` with an `if linestart_x0i >= 0 { ... }`\nblock, leaving `x = xnext;` outside it.\n","locations":[{"ref":"rasterizer/src/raster.rs:105-113","code":"  105 |         /// Does `self.a[$lhs] += $rhs` except if $lhs is oob `continue` instead of panic.\n  106 |         macro_rules! add_assign_a_idx {\n  107 |             ($lhs:expr, $rhs:expr) => {\n  108 |                 match self.a.get_mut($lhs) {\n  109 |                     Some(v) => *v += $rhs,\n  110 |                     None => continue,\n  111 |                 };\n  112 |             };\n  113 |         }","lines":9,"link":"https://github.com/alexheretic/ab-glyph/blob/3eb21a592819d9ed78e9a13ad7392d46c60ce39e/rasterizer/src/raster.rs#L105-L113"},{"ref":"rasterizer/src/raster.rs:140-142","code":"  140 |             if linestart_x0i < 0 {\n  141 |                 continue;\n  142 |             }","lines":3,"link":"https://github.com/alexheretic/ab-glyph/blob/3eb21a592819d9ed78e9a13ad7392d46c60ce39e/rasterizer/src/raster.rs#L140-L142"},{"ref":"rasterizer/src/raster.rs:167-168","code":"  167 |             x = xnext;\n  168 |         }","lines":2,"link":"https://github.com/alexheretic/ab-glyph/blob/3eb21a592819d9ed78e9a13ad7392d46c60ce39e/rasterizer/src/raster.rs#L167-L168"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`draw_line_scalar` clips vertically but never horizontally. The `y` loop is bounded by\n`self.height.min(p1.y.ceil() as usize)`, and `linestart_x0i < 0` rejects indices before the buffer\nstart - but nothing constrains `x0i`/`x1i` to `0..self.width`. Writes such as\n`linestart + xi as usize` and `linestart + x1i as usize` therefore run straight past the end of\nrow `y` and land in row `y + 1`. Since `for_each_pixel` accumulates coverage linearly across the\nwhole grid, that leaked signed area also poisons every pixel after it in the buffer.\n\nConfirmed on a 4x3 grid, drawing a single line that lives entirely on row 0 but extends past the\nright edge:\n\n```rust\nlet mut r = Rasterizer::new(4, 3);\nr.draw_line(point(1.0, 0.2), point(20.0, 0.9));\n// row 1 coverage sum = 0.7368421   (expected ~0)\n```\n\n`ab_glyph`'s own `OutlinedGlyph::draw` mostly avoids this by sizing the grid from `px_bounds`, but\n`Rasterizer` is published as a standalone crate whose documented contract (\"Adds a straight line\nfrom `p0` to `p1` to the outline\") places no in-bounds requirement on the points.\n","fix":"Clamp the x span to the row before emitting any writes, so a segment that runs off the right edge\ndeposits its remaining coverage in the last column instead of the next row:\n\n```rust\nlet width_i = self.width as i32;\nlet x0 = x0.min(width_i as f32);\nlet x1 = x1.min(width_i as f32);\n```\n\nand bound the loop / final writes by the row end:\n\n```rust\nfor xi in x0i + 2..(x1i - 1).min(width_i) { ... }\nadd_assign_a_idx!(linestart + x1i.min(width_i) as usize, d * am);\n```\n\nAlternatively, document `Rasterizer::draw_line`/`draw_quad`/`draw_cubic` as requiring points within\n`0..width` x `0..height` and add debug assertions - but silent cross-row corruption is a poor\ndefault for a safe API.\n","locations":[{"ref":"rasterizer/src/raster.rs:134-166","code":"  134 |             let (x0, x1) = if x < xnext { (x, xnext) } else { (xnext, x) };\n  135 |             let x0floor = x0.floor();\n  136 |             let x0i = x0floor as i32;\n  137 |             let x1ceil = x1.ceil();\n  138 |             let x1i = x1ceil as i32;\n  139 |             let linestart_x0i = linestart as isize + x0i as isize;\n  140 |             if linestart_x0i < 0 {\n  141 |                 continue;\n  142 |             }\n  143 |             if x1i <= x0i + 1 {\n  144 |                 let xmf = 0.5 * (x + xnext) - x0floor;\n  145 |                 add_assign_a_idx!(linestart_x0i as usize, d - d * xmf);\n  146 |                 add_assign_a_idx!(linestart_x0i as usize + 1, d * xmf);\n  147 |             } else {\n  148 |                 let s = (x1 - x0).recip();\n  149 |                 let x0f = x0 - x0floor;\n  150 |                 let a0 = 0.5 * s * (1.0 - x0f) * (1.0 - x0f);\n  151 |                 let x1f = x1 - x1ceil + 1.0;\n  152 |                 let am = 0.5 * s * x1f * x1f;\n  153 |                 add_assign_a_idx!(linestart_x0i as usize, d * a0);\n  154 |                 if x1i == x0i + 2 {\n  155 |                     add_assign_a_idx!(linestart_x0i as usize + 1, d * (1.0 - a0 - am));\n  156 |                 } else {\n  157 |                     let a1 = s * (1.5 - x0f);\n  158 |                     add_assign_a_idx!(linestart_x0i as usize + 1, d * (a1 - a0));\n  159 |                     for xi in x0i + 2..x1i - 1 {\n  160 |                         add_assign_a_idx!(linestart + xi as usize, d * s);\n  161 |                     }\n  162 |                     let a2 = a1 + (x1i - x0i - 3) as f32 * s;\n  163 |                     add_assign_a_idx!(linestart + (x1i - 1) as usize, d * (1.0 - a2 - am));\n  164 |                 }\n  165 |                 add_assign_a_idx!(linestart + x1i as usize, d * am);\n  166 |             }","lines":33,"link":"https://github.com/alexheretic/ab-glyph/blob/3eb21a592819d9ed78e9a13ad7392d46c60ce39e/rasterizer/src/raster.rs#L134-L166"},{"ref":"rasterizer/src/raster.rs:259-268","code":"  259 |     pub fn for_each_pixel<O: FnMut(usize, f32)>(&self, mut px_fn: O) {\n  260 |         let mut acc = 0.0;\n  261 |         self.a[..self.width * self.height]\n  262 |             .iter()\n  263 |             .enumerate()\n  264 |             .for_each(|(idx, c)| {\n  265 |                 acc += c;\n  266 |                 px_fn(idx, acc.abs());\n  267 |             });\n  268 |     }","lines":10,"link":"https://github.com/alexheretic/ab-glyph/blob/3eb21a592819d9ed78e9a13ad7392d46c60ce39e/rasterizer/src/raster.rs#L259-L268"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`ScaleFont::h_scale_factor` and `v_scale_factor` divide by `self.font().height_unscaled()`, which\nis `ascent_unscaled() - descent_unscaled()`, with no zero check. `Font::pt_to_px_scale` likewise\ndivides by `units_per_em()` unguarded. Neither value is validated: `ttf_parser` returns the raw\n`hhea` `ascender`/`descender` fields, so a degenerate or malformed font with `ascender == descender`\n(e.g. both `0`) makes `height_unscaled()` exactly `0.0`.\n\nThe result is a silent `inf`/`NaN` cascade rather than an error - every metric goes non-finite, the\noutline coordinates become `NaN`, `px_bounds` becomes `NaN`, and `width() as usize` saturates to\n`0`, so `OutlinedGlyph::draw` emits zero pixels and the glyph vanishes with no diagnostic.\nReproduced by forcing a `NaN` scale: `px_bounds` is `Rect { min: point(NaN, NaN), max: point(NaN, NaN) }`\nand `draw` yields 0 pixels.\n","fix":"Make the degenerate case explicit rather than letting it propagate as `NaN`. In `scale.rs`:\n\n```rust\n#[inline]\nfn h_scale_factor(&self) -> f32 {\n    let height = self.font().height_unscaled();\n    if height == 0.0 {\n        return 0.0; // degenerate font metrics; avoid inf/NaN propagation\n    }\n    self.scale().x / height\n}\n```\n\n(and the same for `v_scale_factor`). In `pt_to_px_scale`, reject a zero denominator instead of\nreturning a non-finite `PxScale`, which the `Option` return type already allows for:\n\n```rust\nlet units_per_em = self.units_per_em().filter(|u| *u != 0.0)?;\n```\n","locations":[{"ref":"glyph/src/scale.rs:86-96","code":"   86 |     /// Scale factor for unscaled font horizontal values.\n   87 |     #[inline]\n   88 |     fn h_scale_factor(&self) -> f32 {\n   89 |         self.scale().x / self.font().height_unscaled()\n   90 |     }\n   91 | \n   92 |     /// Scale factor for unscaled font vertical values.\n   93 |     #[inline]\n   94 |     fn v_scale_factor(&self) -> f32 {\n   95 |         self.scale().y / self.font().height_unscaled()\n   96 |     }","lines":11,"link":"https://github.com/alexheretic/ab-glyph/blob/3eb21a592819d9ed78e9a13ad7392d46c60ce39e/glyph/src/scale.rs#L86-L96"},{"ref":"glyph/src/font.rs:73-78","code":"   73 |     fn pt_to_px_scale(&self, pt_size: f32) -> Option<PxScale> {\n   74 |         let px_per_em = pt_size * (96.0 / 72.0);\n   75 |         let units_per_em = self.units_per_em()?;\n   76 |         let height = self.height_unscaled();\n   77 |         Some(PxScale::from(px_per_em * height / units_per_em))\n   78 |     }","lines":6,"link":"https://github.com/alexheretic/ab-glyph/blob/3eb21a592819d9ed78e9a13ad7392d46c60ce39e/glyph/src/font.rs#L73-L78"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`OutlineCurveBuilder::close` pushes the closing `OutlineCurve::Line(self.last, m)` but never\nupdates `self.last` to `m`. Every other builder callback (`move_to`, `line_to`, `quad_to`,\n`curve_to`) maintains the `self.last` invariant \"the current pen position\". After `close` the\ninvariant is broken: `self.last` still points at the *end of the last drawn segment*, not at the\ncontour start where the pen actually is.\n\nToday this is latent rather than observable, because `ttf_parser` always emits a `move_to`\nimmediately after `close` (which overwrites `self.last`). But any charstring or future parser\nversion that emits `close` followed directly by `line_to`/`quad_to`/`curve_to` would start that\nsegment from the wrong point, producing a stray line through the glyph.\n","fix":"Restore the pen position when closing. Change\n\n```rust\nfn close(&mut self) {\n    if let Some(m) = self.last_move.take() {\n        self.outline.push(OutlineCurve::Line(self.last, m));\n    }\n}\n```\n\nto\n\n```rust\nfn close(&mut self) {\n    if let Some(m) = self.last_move.take() {\n        self.outline.push(OutlineCurve::Line(self.last, m));\n        self.last = m;\n    }\n}\n```\n","locations":[{"ref":"glyph/src/ttfp/outliner.rs:58-64","code":"   58 |     #[inline]\n   59 |     fn close(&mut self) {\n   60 |         // eprintln!(\"Z\");\n   61 |         if let Some(m) = self.last_move.take() {\n   62 |             self.outline.push(OutlineCurve::Line(self.last, m));\n   63 |         }\n   64 |     }","lines":7,"link":"https://github.com/alexheretic/ab-glyph/blob/3eb21a592819d9ed78e9a13ad7392d46c60ce39e/glyph/src/ttfp/outliner.rs#L58-L64"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"easy","description":"`VariableFont::set_variation` is documented as \"Returns false if there is no such axis tag\", but\nthe two shipped implementations disagree. `FontRef::set_variation` explicitly scans\n`variation_axes()` for a matching tag and returns that result. `FontVec::set_variation` instead\nreturns `self.0.set_variation(...).is_some()` - and `ttf_parser::Face::set_variation` returns\n`Some(())` for *any* variable font, whether or not the tag matched (its inner loop simply finds no\nmatch and falls through to `Some(())`). So `FontVec` reports success for axes the font does not\nhave.\n\nConfirmed with `Cantarell-VF.otf`:\n\n```\nFontRef  wght -> true\nFontRef  foob -> false\nFontVec  wght -> true\nFontVec  foob -> true    // wrong\n```\n\nThe doc-test in `glyph/src/variable.rs` that asserts `!font.set_variation(b\"foob\", 200.0)` only\ncovers `FontRef`, so the `FontVec` divergence is untested. Callers that use the boolean to detect\nunsupported axes (the documented purpose) silently get the wrong answer for owned fonts.\n","fix":"Apply the same existence check `FontRef` uses. Replace the `FontVec` impl body with:\n\n```rust\nfn set_variation(&mut self, axis: &[u8; 4], value: f32) -> bool {\n    let tag = ttfp::Tag::from_bytes(axis);\n    // TODO remove existence check in next breaking version\n    let exists = self\n        .0\n        .as_face_ref()\n        .variation_axes()\n        .into_iter()\n        .any(|axis| axis.tag == tag);\n    if exists {\n        self.0.set_variation(tag, value);\n    }\n    exists\n}\n```\n\nBetter still, factor the shared logic into one generic helper over `AsFaceRef + FaceMut` so the two\nimpls cannot drift again, and extend the doc-test to run against `FontVec` as well as `FontRef`.\n","locations":[{"ref":"glyph/src/ttfp/variable.rs:27-32","code":"   27 | impl VariableFont for FontVec {\n   28 |     fn set_variation(&mut self, axis: &[u8; 4], value: f32) -> bool {\n   29 |         self.0\n   30 |             .set_variation(ttfp::Tag::from_bytes(axis), value)\n   31 |             .is_some()\n   32 |     }","lines":6,"link":"https://github.com/alexheretic/ab-glyph/blob/3eb21a592819d9ed78e9a13ad7392d46c60ce39e/glyph/src/ttfp/variable.rs#L27-L32"},{"ref":"glyph/src/ttfp/variable.rs:6-20","code":"    6 | impl VariableFont for FontRef<'_> {\n    7 |     fn set_variation(&mut self, axis: &[u8; 4], value: f32) -> bool {\n    8 |         let tag = ttfp::Tag::from_bytes(axis);\n    9 |         // TODO remove existence check in next breaking version\n   10 |         let exists = self\n   11 |             .0\n   12 |             .as_face_ref()\n   13 |             .variation_axes()\n   14 |             .into_iter()\n   15 |             .any(|axis| axis.tag == tag);\n   16 |         if exists {\n   17 |             self.0.set_variation(tag, value);\n   18 |         }\n   19 |         exists\n   20 |     }","lines":15,"link":"https://github.com/alexheretic/ab-glyph/blob/3eb21a592819d9ed78e9a13ad7392d46c60ce39e/glyph/src/ttfp/variable.rs#L6-L20"},{"ref":"glyph/src/variable.rs:28","code":"   28 |     fn set_variation(&mut self, tag: &[u8; 4], value: f32) -> bool;","lines":1,"link":"https://github.com/alexheretic/ab-glyph/blob/3eb21a592819d9ed78e9a13ad7392d46c60ce39e/glyph/src/variable.rs#L28"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","difficulty":"easy","description":"`for_each_pixel_2d` derives the `(x, y)` coordinate of every pixel with `idx as u32 % width32` and\n`idx as u32 / width32`. Because `width32` is a runtime value the compiler cannot strength-reduce\nthese into shifts, so each pixel costs two hardware integer divisions - the slowest common integer\nop, typically 20-40 cycles each. This is the only path `OutlinedGlyph::draw` uses, so it runs for\nevery pixel of every rasterized glyph: a 100x100 glyph pays 20,000 divisions purely for index\narithmetic.\n\nThe values are trivially derivable incrementally, since `for_each_pixel` walks the buffer in\nraster order.\n","fix":"Track `x`/`y` with an increment and wrap instead of dividing:\n\n```rust\npub fn for_each_pixel_2d<O: FnMut(u32, u32, f32)>(&self, mut px_fn: O) {\n    let width32 = self.width as u32;\n    let (mut x, mut y) = (0, 0);\n    self.for_each_pixel(|_, alpha| {\n        px_fn(x, y, alpha);\n        x += 1;\n        if x == width32 {\n            x = 0;\n            y += 1;\n        }\n    });\n}\n```\n\nAlternatively iterate rows directly in a dedicated loop over `self.a.chunks_exact(self.width)`,\nkeeping the coverage accumulator across chunks to preserve current semantics.\n","locations":[{"ref":"rasterizer/src/raster.rs:284-287","code":"  284 |     pub fn for_each_pixel_2d<O: FnMut(u32, u32, f32)>(&self, mut px_fn: O) {\n  285 |         let width32 = self.width as u32;\n  286 |         self.for_each_pixel(|idx, alpha| px_fn(idx as u32 % width32, idx as u32 / width32, alpha));\n  287 |     }","lines":4,"link":"https://github.com/alexheretic/ab-glyph/blob/3eb21a592819d9ed78e9a13ad7392d46c60ce39e/rasterizer/src/raster.rs#L284-L287"},{"ref":"rasterizer/src/raster.rs:259-268","code":"  259 |     pub fn for_each_pixel<O: FnMut(usize, f32)>(&self, mut px_fn: O) {\n  260 |         let mut acc = 0.0;\n  261 |         self.a[..self.width * self.height]\n  262 |             .iter()\n  263 |             .enumerate()\n  264 |             .for_each(|(idx, c)| {\n  265 |                 acc += c;\n  266 |                 px_fn(idx, acc.abs());\n  267 |             });\n  268 |     }","lines":10,"link":"https://github.com/alexheretic/ab-glyph/blob/3eb21a592819d9ed78e9a13ad7392d46c60ce39e/rasterizer/src/raster.rs#L259-L268"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`codepoint_ids` builds the `(GlyphId, char)` pairs for each cmap subtable into a `Vec::new()`, which\nstarts with zero capacity and reallocates logarithmically as it grows. A typical Unicode BMP\nsubtable has thousands of codepoints, so this is thousands of pushes across ~10-12 reallocation +\nmemcpy rounds per subtable. `face_ref.number_of_glyphs()` is already being used a few lines above to\nsize the `HashSet`, so a good capacity estimate is free.\n","fix":"Reserve up front. Change\n\n```rust\nlet mut pairs = Vec::new();\n```\n\nto\n\n```rust\nlet mut pairs = Vec::with_capacity(glyph_count);\n```\n\ncapturing `let glyph_count = face_ref.number_of_glyphs() as usize;` alongside the existing\n`used_indices` construction and moving it into the closure.\n","locations":[{"ref":"glyph/src/ttfp.rs:302-322","code":"  302 |                 let inner = Box::new(\n  303 |                     face_ref\n  304 |                         .tables()\n  305 |                         .cmap\n  306 |                         .iter()\n  307 |                         .flat_map(|c| c.subtables)\n  308 |                         .filter(|s| s.is_unicode())\n  309 |                         .flat_map(move |subtable| {\n  310 |                             let mut pairs = Vec::new();\n  311 |                             subtable.codepoints(|c| {\n  312 |                                 if let Ok(ch) = char::try_from(c) {\n  313 |                                     if let Some(idx) = subtable.glyph_index(c).filter(|i| i.0 > 0) {\n  314 |                                         if used_indices.insert(idx.0) {\n  315 |                                             pairs.push((GlyphId(idx.0), ch));\n  316 |                                         }\n  317 |                                     }\n  318 |                                 }\n  319 |                             });\n  320 |                             pairs\n  321 |                         }),\n  322 |                 );","lines":21,"link":"https://github.com/alexheretic/ab-glyph/blob/3eb21a592819d9ed78e9a13ad7392d46c60ce39e/glyph/src/ttfp.rs#L302-L322"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"hard","description":"The runtime SIMD dispatch is per-line, not per-glyph. `Rasterizer::draw_line` is a thin wrapper\naround an indirect call through the `draw_line_fn` field, so every single line segment pays an\nunpredictable-target call. Worse, the indirect call is an optimisation barrier: `draw_quad` and\n`tessellate_cubic` call `self.draw_line(...)` in tight loops (`draw_quad` can emit tens of\nthousands of segments for one curve), and none of those calls can be inlined or have their\nper-segment setup hoisted, despite `draw_line_scalar` being marked `#[inline(always)]`.\n\nSince the chosen implementation is fixed for the whole process after the first `Once::call_once`,\npaying the dispatch once per outline instead of once per segment is free.\n","fix":"Dispatch once at the outline level and let each variant own a monomorphised loop. Give the\nrasterizer internal `draw_*_scalar` methods, then expose target-feature wrappers that cover a whole\nbatch of segments rather than one:\n\n```rust\ntype DrawOutlineFn = unsafe fn(&mut Rasterizer, &[OutlineSegment]);\n\n#[target_feature(enable = \"avx2\")]\nunsafe fn draw_outline_avx2(rast: &mut Rasterizer, segs: &[OutlineSegment]) {\n    for s in segs {\n        match *s {\n            OutlineSegment::Line(p0, p1) => rast.draw_line_scalar(p0, p1),\n            OutlineSegment::Quad(p0, p1, p2) => rast.draw_quad_scalar(p0, p1, p2),\n            OutlineSegment::Cubic(p0, p1, p2, p3) => rast.draw_cubic_scalar(p0, p1, p2, p3),\n        }\n    }\n}\n```\n\nso `draw_quad`/`draw_cubic` recurse into `draw_line_scalar` directly inside the AVX2 region. This\nis a breaking-ish internal restructure and should be benchmarked with the existing\n`dev/benches/rasterize.rs` before/after.\n","locations":[{"ref":"rasterizer/src/raster.rs:99-101","code":"   99 |     pub fn draw_line(&mut self, p0: Point, p1: Point) {\n  100 |         unsafe { (self.draw_line_fn)(self, p0, p1) }\n  101 |     }","lines":3,"link":"https://github.com/alexheretic/ab-glyph/blob/3eb21a592819d9ed78e9a13ad7392d46c60ce39e/rasterizer/src/raster.rs#L99-L101"},{"ref":"rasterizer/src/raster.rs:178-197","code":"  178 |     pub fn draw_quad(&mut self, p0: Point, p1: Point, p2: Point) {\n  179 |         let devx = p0.x - 2.0 * p1.x + p2.x;\n  180 |         let devy = p0.y - 2.0 * p1.y + p2.y;\n  181 |         let devsq = devx * devx + devy * devy;\n  182 |         if devsq < 0.333 {\n  183 |             self.draw_line(p0, p2);\n  184 |             return;\n  185 |         }\n  186 |         let tol = 3.0;\n  187 |         let n = 1 + (tol * devsq).sqrt().sqrt().floor() as usize;\n  188 |         let mut p = p0;\n  189 |         let nrecip = (n as f32).recip();\n  190 |         let mut t = 0.0;\n  191 |         for _i in 0..n - 1 {\n  192 |             t += nrecip;\n  193 |             let pn = lerp(t, lerp(t, p0, p1), lerp(t, p1, p2));\n  194 |             self.draw_line(p, pn);\n  195 |             p = pn;\n  196 |         }\n  197 |         self.draw_line(p, p2);","lines":20,"link":"https://github.com/alexheretic/ab-glyph/blob/3eb21a592819d9ed78e9a13ad7392d46c60ce39e/rasterizer/src/raster.rs#L178-L197"},{"ref":"rasterizer/src/raster.rs:218-243","code":"  218 |     fn tessellate_cubic(&mut self, p0: Point, p1: Point, p2: Point, p3: Point, n: u8) {\n  219 |         // ...I'm not sure either ¯\\_(ツ)_/¯\n  220 |         const OBJSPACE_FLATNESS: f32 = 0.35;\n  221 |         const OBJSPACE_FLATNESS_SQUARED: f32 = OBJSPACE_FLATNESS * OBJSPACE_FLATNESS;\n  222 |         const MAX_RECURSION_DEPTH: u8 = 16;\n  223 | \n  224 |         let longlen = p0.distance_to(p1) + p1.distance_to(p2) + p2.distance_to(p3);\n  225 |         let shortlen = p0.distance_to(p3);\n  226 |         let flatness_squared = longlen * longlen - shortlen * shortlen;\n  227 | \n  228 |         if n < MAX_RECURSION_DEPTH && flatness_squared > OBJSPACE_FLATNESS_SQUARED {\n  229 |             let p01 = lerp(0.5, p0, p1);\n  230 |             let p12 = lerp(0.5, p1, p2);\n  231 |             let p23 = lerp(0.5, p2, p3);\n  232 | \n  233 |             let pa = lerp(0.5, p01, p12);\n  234 |             let pb = lerp(0.5, p12, p23);\n  235 | \n  236 |             let mp = lerp(0.5, pa, pb);\n  237 | \n  238 |             self.tessellate_cubic(p0, p01, pa, mp, n + 1);\n  239 |             self.tessellate_cubic(mp, pb, p23, p3, n + 1);\n  240 |         } else {\n  241 |             self.draw_line(p0, p3);\n  242 |         }\n  243 |     }","lines":26,"link":"https://github.com/alexheretic/ab-glyph/blob/3eb21a592819d9ed78e9a13ad7392d46c60ce39e/rasterizer/src/raster.rs#L218-L243"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"`Font::units_per_em` is documented as \"Returns `None` in case the font unit size exceeds the\nexpected range\", and `Font::pt_to_px_scale` repeats the claim. Neither can happen for any font type\nthe crate ships: the `impl_font!` macro returns `Some(self.0.as_face_ref().units_per_em().into())`\nunconditionally, because `ttf_parser` made `Face::units_per_em` infallible. The\n`// TODO unwrap signature when making next breaking change` comment on the line above confirms the\n`Option` is now vestigial.\n\nCallers reading the docs write `match`/`?` handling for a `None` branch that is dead code for\n`FontRef`, `FontVec` and `FontArc`.\n","fix":"Until the signature can change, say what actually happens:\n\n```rust\n/// Returns \"font units per em\", where 1em is a base unit of font scale\n/// (typically the width of a capital 'M').\n///\n/// Note: the `FontRef`, `FontVec` & `FontArc` implementations always return `Some`.\n/// The `Option` is retained for backwards compatibility and will be removed in the\n/// next breaking release.\nfn units_per_em(&self) -> Option<f32>;\n```\n\nand drop the matching \"Returns `None` in case the [`Font::units_per_em`] unit size exceeds the\nexpected range\" sentence from `pt_to_px_scale`, replacing it with the real failure mode (a custom\n`Font` impl returning `None`).\n","locations":[{"ref":"glyph/src/font.rs:40-49","code":"   40 |     /// Get the size of the font unit\n   41 |     ///\n   42 |     /// This returns \"font units per em\", where 1em is a base unit of font scale\n   43 |     /// (typically the width of a capital 'M').\n   44 |     ///\n   45 |     /// Returns `None` in case the font unit size exceeds the expected range.\n   46 |     /// See [`Face::units_per_em`](https://docs.rs/ttf-parser/latest/ttf_parser/struct.Face.html#method.units_per_em).\n   47 |     ///\n   48 |     /// May be used to calculate [`PxScale`] from pt size, see [`Font::pt_to_px_scale`].\n   49 |     fn units_per_em(&self) -> Option<f32>;","lines":10,"link":"https://github.com/alexheretic/ab-glyph/blob/3eb21a592819d9ed78e9a13ad7392d46c60ce39e/glyph/src/font.rs#L40-L49"},{"ref":"glyph/src/font.rs:51-56","code":"   51 |     /// Converts pt units into [`PxScale`].\n   52 |     ///\n   53 |     /// Note: To handle a screen scale factor multiply it to the `pt_size` argument.\n   54 |     ///\n   55 |     /// Returns `None` in case the [`Font::units_per_em`] unit size exceeds the expected range.\n   56 |     ///","lines":6,"link":"https://github.com/alexheretic/ab-glyph/blob/3eb21a592819d9ed78e9a13ad7392d46c60ce39e/glyph/src/font.rs#L51-L56"},{"ref":"glyph/src/ttfp.rs:185-189","code":"  185 |             #[inline]\n  186 |             fn units_per_em(&self) -> Option<f32> {\n  187 |                 // TODO unwrap signature when making next breaking change\n  188 |                 Some(self.0.as_face_ref().units_per_em().into())\n  189 |             }","lines":5,"link":"https://github.com/alexheretic/ab-glyph/blob/3eb21a592819d9ed78e9a13ad7392d46c60ce39e/glyph/src/ttfp.rs#L185-L189"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"`Font::codepoint_ids` is documented as \"Returns an iterator of all distinct `(GlyphId, char)`\npairs. Not ordered.\" - but the doc-test immediately below asserts an exact sequence:\n\n```rust\nassert_eq!(codepoint_ids.next(), Some((GlyphId(408), '\\r')));\nassert_eq!(codepoint_ids.next(), Some((GlyphId(1), ' ')));\nassert_eq!(codepoint_ids.next(), Some((GlyphId(75), '!')));\n```\n\nThe doc therefore both disclaims and depends on ordering. Since the doc-test is the crate's own\nexample, readers reasonably conclude the order *is* stable; and if the order ever does change\n(a `ttf_parser` cmap iteration change, or the `std`/`no_std` switch between `HashSet` and\n`BTreeSet` for `used_indices`) the crate's documentation test breaks for a behaviour it explicitly\ndoes not guarantee.\n","fix":"Make the example order-independent so it demonstrates only the documented contract - the\n`HashMap` half of the existing example already does this. Replace the three ordered `next()`\nassertions with:\n\n```rust\n/// // Each id appears at most once; order is unspecified.\n/// let map: HashMap<_, _> = font.codepoint_ids().collect();\n/// assert_eq!(map.get(&GlyphId(75)), Some(&'!'));\n/// assert_eq!(map.get(&GlyphId(1)), Some(&' '));\n/// assert_eq!(map.len(), 908);\n```\n","locations":[{"ref":"glyph/src/font.rs:172-193","code":"  172 |     /// Returns an iterator of all distinct `(GlyphId, char)` pairs. Not ordered.\n  173 |     ///\n  174 |     /// # Example\n  175 |     /// ```\n  176 |     /// # use ab_glyph::{Font, FontRef, GlyphId};\n  177 |     /// # use std::collections::HashMap;\n  178 |     /// # fn main() -> Result<(), ab_glyph::InvalidFont> {\n  179 |     /// let font = FontRef::try_from_slice(include_bytes!(\"../../dev/fonts/Exo2-Light.otf\"))?;\n  180 |     ///\n  181 |     /// // Iterate over pairs, each id will appear at most once.\n  182 |     /// let mut codepoint_ids = font.codepoint_ids();\n  183 |     /// assert_eq!(codepoint_ids.next(), Some((GlyphId(408), '\\r')));\n  184 |     /// assert_eq!(codepoint_ids.next(), Some((GlyphId(1), ' ')));\n  185 |     /// assert_eq!(codepoint_ids.next(), Some((GlyphId(75), '!')));\n  186 |     ///\n  187 |     /// // Build a lookup map for all ids\n  188 |     /// let map: HashMap<_, _> = font.codepoint_ids().collect();\n  189 |     /// assert_eq!(map.get(&GlyphId(75)), Some(&'!'));\n  190 |     /// # assert_eq!(map.len(), 908);\n  191 |     /// # Ok(()) }\n  192 |     /// ```\n  193 |     fn codepoint_ids(&self) -> crate::CodepointIdIter<'_>;","lines":22,"link":"https://github.com/alexheretic/ab-glyph/blob/3eb21a592819d9ed78e9a13ad7392d46c60ce39e/glyph/src/font.rs#L172-L193"},{"ref":"glyph/src/ttfp.rs:293-325","code":"  293 |             fn codepoint_ids(&self) -> crate::CodepointIdIter<'_> {\n  294 |                 let face_ref = self.0.as_face_ref();\n  295 | \n  296 |                 #[cfg(feature = \"std\")]\n  297 |                 let mut used_indices =\n  298 |                     std::collections::HashSet::with_capacity(face_ref.number_of_glyphs() as _);\n  299 |                 #[cfg(not(feature = \"std\"))]\n  300 |                 let mut used_indices = alloc::collections::BTreeSet::new();\n  301 | \n  302 |                 let inner = Box::new(\n  303 |                     face_ref\n  304 |                         .tables()\n  305 |                         .cmap\n  306 |                         .iter()\n  307 |                         .flat_map(|c| c.subtables)\n  308 |                         .filter(|s| s.is_unicode())\n  309 |                         .flat_map(move |subtable| {\n  310 |                             let mut pairs = Vec::new();\n  311 |                             subtable.codepoints(|c| {\n  312 |                                 if let Ok(ch) = char::try_from(c) {\n  313 |                                     if let Some(idx) = subtable.glyph_index(c).filter(|i| i.0 > 0) {\n  314 |                                         if used_indices.insert(idx.0) {\n  315 |                                             pairs.push((GlyphId(idx.0), ch));\n  316 |                                         }\n  317 |                                     }\n  318 |                                 }\n  319 |                             });\n  320 |                             pairs\n  321 |                         }),\n  322 |                 );\n  323 | \n  324 |                 crate::CodepointIdIter { inner }\n  325 |             }","lines":33,"link":"https://github.com/alexheretic/ab-glyph/blob/3eb21a592819d9ed78e9a13ad7392d46c60ce39e/glyph/src/ttfp.rs#L293-L325"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"`Outline::bounds` is documented only as \"Unscaled bounding box\", but the value the crate actually\nstores has an inverted y axis: `impl_font!` builds it as\n`min: point(x_min, y_max), max: point(x_max, y_min)`, i.e. `bounds.min.y` holds the font's\n**maximum** y and `bounds.max.y` holds the **minimum**. `Outline::px_bounds` then relies on this by\nmultiplying y by `-scale_factor.vertical` to flip it back into a y-down pixel rect.\n\n`Outline` is a public struct with public fields and `OutlinedGlyph::new` is public, so users\nimplementing a custom `Font` or constructing an `Outline` by hand will populate `bounds` with a\nconventional y-up rect and get inverted, empty (`width()`/`height()` negative, then `as usize`\nsaturating to `0`) pixel bounds with no error. The existing regression test\n`ttf_zero_bounding_box_29` asserts `min.y = 1301.0, max.y = -3.0`, confirming the convention is\nintentional but undocumented.\n","fix":"State the convention on the field:\n\n```rust\npub struct Outline {\n    /// Unscaled bounding box, in font units.\n    ///\n    /// Note: y is stored **inverted** relative to the font's y-up coordinate space -\n    /// `bounds.min.y` is the glyph's `y_max` and `bounds.max.y` is its `y_min`. This matches\n    /// the y-down pixel space produced by [`Outline::px_bounds`], which negates the vertical\n    /// scale factor.\n    pub bounds: Rect,\n    ...\n}\n```\n","locations":[{"ref":"glyph/src/outlined.rs:7-14","code":"    7 | /// A \"raw\" collection of outline curves for a glyph, unscaled & unpositioned.\n    8 | #[derive(Clone, Debug)]\n    9 | pub struct Outline {\n   10 |     /// Unscaled bounding box.\n   11 |     pub bounds: Rect,\n   12 |     /// Unscaled & unpositioned outline curves.\n   13 |     pub curves: Vec<OutlineCurve>,\n   14 | }","lines":8,"link":"https://github.com/alexheretic/ab-glyph/blob/3eb21a592819d9ed78e9a13ad7392d46c60ce39e/glyph/src/outlined.rs#L7-L14"},{"ref":"glyph/src/outlined.rs:20-38","code":"   20 |     pub fn px_bounds(&self, scale_factor: PxScaleFactor, position: Point) -> Rect {\n   21 |         let Rect { min, max } = self.bounds;\n   22 | \n   23 |         // Use subpixel fraction in floor/ceil rounding to eliminate rounding error\n   24 |         // from identical subpixel positions\n   25 |         let (x_trunc, x_fract) = (position.x.trunc(), position.x.fract());\n   26 |         let (y_trunc, y_fract) = (position.y.trunc(), position.y.fract());\n   27 | \n   28 |         Rect {\n   29 |             min: point(\n   30 |                 (min.x * scale_factor.horizontal + x_fract).floor() + x_trunc,\n   31 |                 (min.y * -scale_factor.vertical + y_fract).floor() + y_trunc,\n   32 |             ),\n   33 |             max: point(\n   34 |                 (max.x * scale_factor.horizontal + x_fract).ceil() + x_trunc,\n   35 |                 (max.y * -scale_factor.vertical + y_fract).ceil() + y_trunc,\n   36 |             ),\n   37 |         }\n   38 |     }","lines":19,"link":"https://github.com/alexheretic/ab-glyph/blob/3eb21a592819d9ed78e9a13ad7392d46c60ce39e/glyph/src/outlined.rs#L20-L38"},{"ref":"glyph/src/ttfp.rs:280-283","code":"  280 |                 let bounds = Rect {\n  281 |                     min: point(x_min.into(), y_max.into()),\n  282 |                     max: point(x_max.into(), y_min.into()),\n  283 |                 };","lines":4,"link":"https://github.com/alexheretic/ab-glyph/blob/3eb21a592819d9ed78e9a13ad7392d46c60ce39e/glyph/src/ttfp.rs#L280-L283"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"Commented-out `eprintln!` debug scaffolding is left in two production source files. In\n`outlined.rs` each of the three `OutlineCurve` match arms carries a two-line commented `eprintln!`\nmirroring the call below it; in `ttfp/outliner.rs` every one of the five `OutlineBuilder` callbacks\nopens with a commented single-character trace (`// eprintln!(\"M {x} {y}\");`, `// eprintln!(\"Z\");`,\netc.).\n\nBesides being noise, commented debug code rots: the `outlined.rs` copies duplicate the exact\nargument expressions of the live calls, so any change to `scale_up`/`offset` silently leaves them\nwrong.\n","fix":"Delete the commented lines. If outline tracing is genuinely useful for debugging, make it a real,\ncompiled-away facility instead - e.g. a `trace-outlines` cargo feature:\n\n```rust\nmacro_rules! trace_outline {\n    ($($arg:tt)*) => {\n        #[cfg(feature = \"trace-outlines\")]\n        eprintln!($($arg)*);\n    };\n}\n```\n\nso the statements stay type-checked and cannot drift from the code they describe.\n","locations":[{"ref":"glyph/src/outlined.rs:123-148","code":"  123 |                 OutlineCurve::Line(p0, p1) => {\n  124 |                     // eprintln!(\"r.draw_line({:?}, {:?});\",\n  125 |                     //     scale_up(p0) + offset, scale_up(p1) + offset);\n  126 |                     rasterizer.draw_line(scale_up(p0) + offset, scale_up(p1) + offset);\n  127 |                     rasterizer\n  128 |                 }\n  129 |                 OutlineCurve::Quad(p0, p1, p2) => {\n  130 |                     // eprintln!(\"r.draw_quad({:?}, {:?}, {:?});\",\n  131 |                     //     scale_up(p0) + offset, scale_up(p1) + offset, scale_up(p2) + offset);\n  132 |                     rasterizer.draw_quad(\n  133 |                         scale_up(p0) + offset,\n  134 |                         scale_up(p1) + offset,\n  13 {"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"`impl<F: Font> Font for &F` and `impl Font for FontArc` are two ~85-line blocks of mechanically\nidentical delegation: the same 17 methods in the same order, each an `#[inline]` one-liner\nforwarding to the inner value. The only difference is the receiver expression (`(*self).method()`\nvs `self.0.method()`).\n\nEvery addition to the `Font` trait must be mirrored into both, plus the `impl_font!` macro in\n`ttfp.rs` - and nothing enforces it, since the trait supplies defaults for the newer methods\n(`italic_angle`, `glyph_svg_image`, `font_data`) precisely so that missing overrides compile.\nA forgotten forward is therefore a silent behaviour bug, not a build error: for `FontArc` it would\nmean an inner font's `italic_angle` being replaced by the trait default `0.0`.\n","fix":"Generate both from one macro, as `ttfp.rs` already does for `FontRef`/`FontVec`. Define the\ndelegation once with the accessor as a parameter:\n\n```rust\nmacro_rules! delegate_font {\n    ($ty:ty, |$s:ident| $inner:expr) => {\n        impl Font for $ty {\n            #[inline]\n            fn units_per_em(&self) -> Option<f32> { let $s = self; $inner.units_per_em() }\n            #[inline]\n            fn ascent_unscaled(&self) -> f32 { let $s = self; $inner.ascent_unscaled() }\n            // ... one line per method, written once ...\n        }\n    };\n}\n\ndelegate_font!(FontArc, |s| s.0);\n```\n\nAdding a `Font` method then requires exactly one edit for every delegating wrapper.\n","locations":[{"ref":"glyph/src/font.rs:325-410","code":"  325 | impl<F: Font> Font for &F {\n  326 |     #[inline]\n  327 |     fn units_per_em(&self) -> Option<f32> {\n  328 |         (*self).units_per_em()\n  329 |     }\n  330 | \n  331 |     #[inline]\n  332 |     fn ascent_unscaled(&self) -> f32 {\n  333 |         (*self).ascent_unscaled()\n  334 |     }\n  335 | \n  336 |     #[inline]\ {"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"The `Font` trait's surface is replicated across four independently-maintained sites: the trait\ndefinition with its defaults (`font.rs`), the blanket `&F` forward (`font.rs`), the `FontArc`\ntype-erased forward (`font_arc.rs`), and the `impl_font!` macro that covers `FontRef`/`FontVec`\n(`ttfp.rs`). `ScaleFont` repeats the pattern a fifth time with its own `&SF` forward.\n\nBecause backwards compatibility requires most newer trait methods to carry a default body\n(`italic_angle` returns `0.0`, `glyph_svg_image` returns `None`, `font_data` is\n`unimplemented!()`), the compiler cannot detect a site that was not updated - the default silently\nwins. This is the structural cause of the `FontVec`/`FontRef` `set_variation` divergence reported\nseparately, and it makes correct extension of the trait a matter of remembering four files.\n","fix":"Consolidate delegation into a single macro used by every wrapper (see the `duplicate_code` finding),\nand add a coverage test that fails when a wrapper falls back to a trait default. For example, drive\neach wrapper type through the same assertions:\n\n```rust\nfn assert_font_forwards<F: Font>(f: &F, expect_italic: f32, expect_data: &[u8]) {\n    assert_eq!(f.italic_angle(), expect_italic);   // catches a missing `italic_angle` forward\n    assert_eq!(f.font_data(), expect_data);        // catches a missing `font_data` forward\n}\n\n#[test]\nfn all_wrappers_forward() {\n    let r = FontRef::try_from_slice(ITALIC).unwrap();\n    assert_font_forwards(&r, -12.0, ITALIC);\n    assert_font_forwards(&&r, -12.0, ITALIC);                      // &F blanket impl\n    assert_font_forwards(&FontArc::from(r.clone()), -12.0, ITALIC); // FontArc\n}\n```\n\nLonger term, plan a breaking release that removes the compatibility defaults so omissions become\ncompile errors.\n","locations":[{"ref":"glyph/src/font.rs:325-410","code":"  3 {"id":"OTHER_1","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"`PartialOrd` is derived on several types where the derived ordering has no meaningful semantics:\n`Point` (geometry.rs), `Rect` and `Outline`'s containing module types (outlined.rs), `PxScale` and\n`PxScaleFactor` (scale.rs), and `Glyph` (glyph.rs). The derive produces lexicographic comparison of\nthe fields in declaration order, so `point(0.0, 100.0) < point(1.0, 0.0)` is `true` - an ordering\nwith no geometric meaning that silently enables `<`, `sort()`, `max()` and `clamp()` on values where\nthose operations are almost certainly a bug at the call site.\n\n`Glyph` is the worst case: it orders by `(id, scale, position)`, so sorting a glyph run - a natural\nthing to reach for - reorders by glyph id rather than by layout position.\n","fix":"Drop `PartialOrd` from the derive lists where no ordering is intended, keeping `PartialEq`:\n\n```rust\n#[derive(Clone, Copy, Default, PartialEq)]\npub struct Point { pub x: f32, pub y: f32 }\n```\n\nThis is a breaking change for any downstream code relying on it, so it belongs in the next major\nrelease; in the interim, document that the ordering is field-lexicographic and carries no\ngeometric meaning.\n","locations":[{"ref":"rasterizer/src/geometry.rs:11-15","code":"   11 | #[derive(Clone, Copy, Default, PartialEq, PartialOrd)]\n   12 | pub struct Point {\n   13 |     pub x: f32,\n   14 |     pub y: f32,\n   15 | }","lines":5,"link":"https://github.com/alexheretic/ab-glyph/blob/3eb21a592819d9ed78e9a13ad7392d46c60ce39e/rasterizer/src/geometry.rs#L11-L15"},{"ref":"glyph/src/glyph.rs:53-66","code":"   53 | /// A glyph with pixel scale & position.\n   54 | #[derive(Clone, Debug, PartialEq, PartialOrd)]\n   55 | pub struct Glyph {\n   56 |     /// Glyph id.\n   57 |     pub id: GlyphId,\n   58 |     /// Pixel scale of this glyph.\n   59 |     pub scale: PxScale,\n   60 |     /// Position of this glyph.\n   61 |     ///\n   62 | {"id":"OTHER_2","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"`optimal_draw_line_fn` stores the selected implementation in a function-local `static mut`, read\nthrough `unsafe`. The synchronisation reasoning is correct as written (`Once::call_once` orders the\nsingle write before every read, and on non-x86 or `no_std` targets there is no write at all), but\n`static mut` is the wrong tool: it is lint-flagged under `static_mut_refs`, is being phased out in\nnewer editions, and puts the burden of the argument on a comment rather than the type system. A\nfuture edit - e.g. adding a second feature tier, or re-checking on `reset` - can break the\ninvariant with no compiler complaint.\n","fix":"Express the same thing with an atomic, removing the `unsafe` block entirely:\n\n```rust\nfn optimal_draw_line_fn() -> DrawLineFn {\n    #[cfg(all(feature = \"std\", any(target_arch = \"x86\", target_arch = \"x86_64\")))]\n    {\n        static DRAW_LINE_FN: std::sync::OnceLock<DrawLineFn> = std::sync::OnceLock::new();\n        *DRAW_LINE_FN.get_or_init(|| {\n            if is_x86_feature_detected!(\"avx2\") {\n                draw_line_avx2\n            } else if is_x86_feature_detected!(\"sse4.2\") {\n                draw_line_sse4_2\n            } else {\n                Rasterizer::draw_line_scalar\n            }\n        })\n    }\n    #[cfg(not(all(feature = \"std\", any(target_arch = \"x86\", target_arch = \"x86_64\"))))]\n    {\n        Rasterizer::draw_line_scalar\n    }\n}\n```\n\n`OnceLock` is only available with `std`, which is exactly the configuration that needs a write, so\nthe `no_std` arm reduces to a plain constant.\n","locations":[{"ref":"rasterizer/src/raster.rs:318-342","code":"  318 | /// Return most optimal `DrawLineFn` impl.\n  319 | ///\n  320 | /// With feature `std` on x86/x86_64 will use one-time runtime detection\n  321 | /// to pick the best SIMD impl. Otherwise uses a scalar version.\n  322 | fn optimal_draw_lin (function(){
