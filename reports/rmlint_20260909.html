<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"rm_digest_paranoid_copy() allocates the copy with g_slice_new0() and only sets copy->shadow_hash; it never initializes copy->incoming_twin_candidates (left NULL). rm_digest_paranoid_free(), which is unconditionally invoked on every paranoid digest via rm_digest_free(), calls g_async_queue_unref(paranoid->incoming_twin_candidates) without a NULL check, so freeing any digest produced by rm_digest_copy() on a RM_DIGEST_PARANOID-type digest crashes (NULL passed to a GAsyncQueue API that does not tolerate NULL). The same NULL queue is also used unguarded by rm_digest_paranoid_buffered_update() (g_async_queue_try_pop) and rm_digest_send_match_candidate() (g_async_queue_push) if either is ever invoked on a copied paranoid digest. This is reachable in production: shredder.c's rm_shred_create_rejects() calls rm_digest_copy(group->digest) where group->digest can be RM_DIGEST_PARANOID (used when splitting/rejecting paranoid shred groups).","fix":"In rm_digest_paranoid_copy(), allocate a fresh incoming_twin_candidates queue with g_async_queue_new() (mirroring rm_digest_paranoid_new()), or add NULL guards before g_async_queue_unref/push/try_pop calls in the paranoid helper functions.","locations":[{"ref":"lib/checksum.c:751-757","code":"  751 | static RmParanoid *rm_digest_paranoid_copy(RmParanoid *paranoid) {\n  752 |     RmParanoid *copy = g_slice_new0(RmParanoid);\n  753 |     if(paranoid->shadow_hash != NULL) {\n  754 |         copy->shadow_hash = rm_digest_copy(paranoid->shadow_hash);\n  755 |     }\n  756 |     return copy;\n  757 | }","lines":7,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/lib/checksum.c#L751-L757"},{"ref":"lib/checksum.c:808-809","code":"  808 |     while(!paranoid->twin_candidate && (paranoid->twin_candidate = g_async_queue_try_pop(\n  809 |                                             paranoid->incoming_twin_candidates))) {","lines":2,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/lib/checksum.c#L808-L809"},{"ref":"lib/checksum.c:1125","code":" 1125 |     g_async_queue_push(paranoid->incoming_twin_candidates, candidate);","lines":1,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/lib/checksum.c#L1125"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"remove_color_escapes() in src/rmlint.c crashes with SIGSEGV if a log message contains an ESC byte (0x1b) that is not followed anywhere later in the string by the character 'm'. strchr(src, 'm') returns NULL in that case, src is set to NULL, and the for-loop's post-expression `src++` then executes on a NULL pointer, producing an invalid pointer (e.g. 0x1) that is dereferenced by the loop condition `*src` on the next iteration, causing a segfault. This function is invoked from logging_callback() in src/rmlint.c whenever cfg->with_stderr_color is false, which happens by default whenever stderr is not a tty (e.g. output redirected/piped) or when -W/--no-with-color is passed. Since rmlint logs raw file paths via format strings like \"Can't open directory or file \\\"%s\\\"\", a file name containing a lone/truncated ESC byte (with no subsequent 'm' anywhere in the rest of the message) reaches this code path and crashes the whole process. Verified by reproducing the exact loop logic in a standalone test compiled with ASan/UBSan: confirmed SIGSEGV reading address 0x1.","fix":"After `src = strchr(src, 'm')` returns NULL, break out of the loop immediately instead of letting the for-loop's increment run on a NULL pointer, e.g.: `if(*src == '\\x1b') { src = strchr(src, 'm'); if(!src) break; } else { ... }`.","locations":[{"ref":"lib/logger.c:43-57","code":"   43 | static char *remove_color_escapes(char *message) {\n   44 |     char *dst = message;\n   45 |     for(char *src = message; src && *src; src++) {\n   46 |         if(*src == '\\x1b') {\n   47 |             src = strchr(src, 'm');\n   48 |         } else {\n   49 |             *dst++ = *src;\n   50 |         }\n   51 |     }\n   52 | \n   53 |     if(dst) {\n   54 |         *dst = 0;\n   55 |     }\n   56 |     return message;\n   57 | }","lines":15,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/lib/logger.c#L43-L57"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"rm_trie_build_path_unlocked() copies path elements into the caller-supplied buffer with g_stpcpy(), which performs an unbounded copy. The surrounding while loop only checks the running offset against buf_len *before* each iteration, not before/during the actual copy, so once the check passes near the boundary the subsequent '/' + g_stpcpy of a full path element can write past buf+buf_len. Additionally, reconstructing a path that was originally truncated to exactly PATH_MAX by rm_path_iter_init requires PATH_MAX+1 bytes (one extra leading '/' is prepended on rebuild), which already overflows a PATH_MAX-sized destination buffer by construction (all real callers pass PATH_MAX as buf_len).","fix":"Track remaining space explicitly and use a bounded copy (e.g. g_strlcpy/snprintf with the remaining length) for each element instead of unbounded g_stpcpy; stop or truncate cleanly when an element would not fit.","locations":[{"ref":"lib/pathtricia.c:253-258","code":"  253 |     /* copy collected elements into *buf */\n  254 |     char *buf_ptr = buf;\n  255 |     while(n_elements && (size_t)(buf_ptr - buf) < buf_len) {\n  256 |         *buf_ptr = '/';\n  257 |         buf_ptr = g_stpcpy(buf_ptr + 1, (char *)elements[--n_elements]);\n  258 |     }","lines":6,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/lib/pathtricia.c#L253-L258"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"rm_util_get_groupname() calls getpwuid(geteuid()) and immediately dereferences the result (user->pw_gid) without checking for NULL, unlike the sibling function rm_util_get_username() which does check. If getpwuid() fails (e.g. the effective uid has no passwd entry, common in containers/chroots), this is a NULL pointer dereference and crashes the program.","fix":"Check `if(user == NULL) return NULL;` before calling getgrgid(user->pw_gid), mirroring rm_util_get_username().","locations":[{"ref":"lib/utilities.c:532-540","code":"  532 | char *rm_util_get_groupname(void) {\n  533 |     struct passwd *user = getpwuid(geteuid());\n  534 |     struct group *grp = getgrgid(user->pw_gid);\n  535 |     if(grp) {\n  536 |         return grp->gr_name;\n  537 |     } else {\n  538 |         return NULL;\n  539 |     }\n  540 | }","lines":9,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/lib/utilities.c#L532-L540"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"RingChart._hit() computes `cos = x / xy_abs` where xy_abs = sqrt(x*x + y*y) and x, y are the mouse position relative to the chart's center. If the user moves the mouse (or clicks) on the exact center pixel of the chart, xy_abs is 0.0 and this raises ZeroDivisionError inside the 'motion-notify-event'/'button-press-event' GTK signal handlers (on_motion/on_button_press_event), which propagates as an unhandled exception out of the GTK callback on every such event.","fix":"Guard against xy_abs == 0 (e.g. `if xy_abs == 0: return (True, None)` before computing cos) to treat the exact center as a no-hit / root-segment case.","locations":[{"ref":"gui/shredder/chart.py:461-477","code":"  461 |     def _hit(self, area, event, click_only=False):\n  462 |         \"\"\"Check what segments were hitten by a GdkEvent\"\"\"\n  463 |         alloc = area.get_allocation()\n  464 |         mid_x, mid_y = alloc.width / 2, alloc.height / 2\n  465 | \n  466 |         # Calculate the degree between the vectors\n  467 |         # a = (event.x + m, event.y + m) and (0, 1)\n  468 |         x, y = event.x - mid_x, event.y - mid_y\n  469 |         xy_abs = math.sqrt(x * x + y * y)\n  470 |         cos = x / xy_abs\n  471 | \n  472 |         if y < 0:\n  473 |             # upper half\n  474 |             selected_deg = (2 * math.pi) - math.acos(cos)\n  475 |         else:\n  476 |             # lower half\n  477 |             selected_deg = math.acos(cos)","lines":17,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/gui/shredder/chart.py#L461-L477"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"Runner.replay(allowed_paths=None) documents None as a valid argument ('allowed_paths is a dictionary of paths to booleans') and its own default value is None, but the loop unconditionally executes `point['is_original'] = allowed_paths[path]` once the `allowed_paths is None or path in allowed_paths` condition is true. When allowed_paths is None, this raises TypeError: 'NoneType' object is not subscriptable on the very first data point.","fix":"Use `point['is_original'] = allowed_paths[path] if allowed_paths is not None else True` (or equivalent), matching the documented behavior that None means 'allow everything'.","locations":[{"ref":"gui/shredder/runner.py:346-353","code":"  346 |         for point in data:\n  347 |             path = point['path']\n  348 |             if path is None:\n  349 |                 continue\n  350 | \n  351 |             if allowed_paths is None or path in allowed_paths:\n  352 |                 point['is_original'] = allowed_paths[path]\n  353 |                 results.append(point)","lines":8,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/gui/shredder/runner.py#L346-L353"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"paranoid_interface.update is set to NULL (it has no generic per-byte update function; updates only happen via rm_digest_paranoid_buffered_update()). rm_digest_new(RM_DIGEST_PARANOID, seed) will call `interface->update(digest->state, ...)` through this NULL pointer whenever a non-zero seed is supplied, crashing immediately. All current call sites pass seed=0, but the public API (rm_digest_new takes an RmOff seed for any RmDigestType, and rm_digest_sum()/rm_digest_new() do not special-case or reject RM_DIGEST_PARANOID with a seed) gives no indication this combination is unsafe.","fix":"In rm_digest_new(), skip the seed-update call (or assert/return an error) when type == RM_DIGEST_PARANOID and seed != 0, since paranoid digests cannot be seeded through the generic update path.","locations":[{"ref":"lib/checksum.c:852-860","code":"  852 | static const RmDigestInterface paranoid_interface = {\n  853 |     .name = \"paranoid\",\n  854 |     .bits = 64, /* must match shadow hash length */\n  855 |     .len = NULL,\n  856 |     .new = (RmDigestNewFunc)rm_digest_paranoid_new,\n  857 |     .free = (RmDigestFreeFunc)rm_digest_paranoid_free,\n  858 |     .update = NULL,\n  859 |     .copy = (RmDigestCopyFunc)rm_digest_paranoid_copy,\n  860 |     .steal = (RmDigestStealFunc)rm_digest_paranoid_steal};","lines":9,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/lib/checksum.c#L852-L860"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"rm_digest_hash() asserts `bytes >= sizeof(guint)` after stealing the digest (line 975) and aborts the process if not. For RM_DIGEST_EXT digests, digest->bytes is set from state->len = strlen(hex_checksum)/2, which is fully attacker/user-controlled: it comes directly from the \"checksum\" string field of a replay JSON file (lib/replay.c:313-318) with no minimum-length validation. A replay file with a checksum string shorter than 8 hex characters (4 bytes) makes digest->bytes < 4, and rm_digest_hash() is used as the GHashFunc for a GHashTable in lib/replay.c:871, so simply loading such a (corrupted or maliciously crafted) replay/equal JSON file aborts the whole program via g_assert.","fix":"Replace the g_assert with a graceful fallback (e.g. hash whatever bytes are available, or treat short digests as a fixed low-quality hash) instead of aborting on attacker-controlled input length; alternatively validate/reject overly-short checksum strings when parsing replay JSON.","locations":[{"ref":"lib/checksum.c:1023-1037","code":" 1023 | guint rm_digest_hash(RmDigest *digest) {\n 1024 |     guint8 *buf = NULL;\n 1025 |     gsize bytes = 0;\n 1026 |     guint hash = 0;\n 1027 | \n 1028 |     buf = rm_digest_steal(digest);\n 1029 |     bytes = digest->bytes;\n 1030 | \n 1031 |     if(buf != NULL) {\n 1032 |         g_assert(bytes >= sizeof(guint));\n 1033 |         hash = *(guint *)buf;\n 1034 |         g_slice_free1(bytes, buf);\n 1035 |     }\n 1036 |     return hash;\n 1037 | }","lines":15,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/lib/checksum.c#L1023-L1037"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"rm_mounts_can_reflink() asserts g_assert(dest_part) after a plain g_hash_table_lookup for the dest device in self->part_table. Unlike source (guaranteed present because it was just confirmed to be a key of reflinkfs_table, which is always populated alongside part_table for the same dev), dest has no such guarantee: a caller can pass any dev_t (e.g. for a destination path/subvolume that was never stat'd through rm_mounts_get_disk_id). If dest_part is not found, g_assert aborts the whole process instead of returning an error.","fix":"Replace the g_assert(dest_part) with a graceful `if(!source_part || !dest_part) return false;` check.","locations":[{"ref":"lib/utilities.c:1135-1138","code":" 1135 |             RmPartitionInfo *dest_part =\n 1136 |                 g_hash_table_lookup(self->part_table, GINT_TO_POINTER(dest));\n 1137 |             g_assert(source_part);\n 1138 |             g_assert(dest_part);","lines":4,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/lib/utilities.c#L1135-L1138"}]},
{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"rm_file_lint_type_to_string() clamps the array index with MIN(type, sizeof(LINT_TYPES)/sizeof(const char*)), but the valid index range for an array of N elements is [0, N-1]; when type is N or larger (any out-of-range/corrupted RmLintType), MIN(type, N) yields N, which reads LINT_TYPES[N] - one element past the end of the array. All current callers pass file->lint_type, which is always set to a valid enum constant in this codebase, so the OOB read is not currently reached, but the clamp itself is off-by-one and would misbehave the moment an invalid/corrupted lint_type reaches this function (e.g. via future code paths or memory corruption elsewhere).","fix":"Clamp with MIN(type, sizeof(LINT_TYPES)/sizeof(const char*) - 1) so the maximum index used is the last valid element.","locations":[{"ref":"lib/file.c:214-216","code":"  214 | const char *rm_file_lint_type_to_string(RmLintType type) {\n  215 |     return LINT_TYPES[MIN(type, sizeof(LINT_TYPES) / sizeof(const char *))];\n  216 | }","lines":3,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/lib/file.c#L214-L216"}]},
{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"In rm_hasher_main() (lib/hash-utility.c), when paths are read from stdin (tag.paths == NULL branch), each line is resolved with `realpath(strtok_r(path_buf, \"\\n\", &tokbuf), NULL)` and the result is pushed into the GPtrArray unconditionally, even when realpath() fails and returns NULL (e.g. for a nonexistent path piped on stdin - silently, with no warning to the user). The resulting char** array therefore can contain an embedded NULL in the middle, not just at the very end. Later, g_strv_length(tag.paths) (used to size buf_size for read_succesful/completed_digests_buffer) and the main processing loop `for(int i = 0; tag.paths && tag.paths[i]; ++i)` both stop at the first NULL entry, silently dropping/never-processing every path that came after the failed one. g_strfreev(tag.paths) at the end of rm_hasher_main also stops at the same embedded NULL, so any later valid path strings (and the array tail itself) are leaked. Reproduced the g_strv_length/array truncation behavior with a standalone GLib test confirming len=1 reported for a 3-element array with an embedded NULL, even though a valid string exists at index 2.","fix":"Skip/report failed realpath() calls instead of pushing NULL into the array (e.g. print a warning and `continue`), so the resulting char** stays free of embedded NULLs and only has the real terminator at the end.","locations":[{"ref":"lib/hash-utility.c:178-190","code":"  178 |     if(tag.paths == NULL) {\n  179 |         /* read paths from stdin */\n  180 |         char path_buf[PATH_MAX];\n  181 |         char *tokbuf = NULL;\n  182 |         GPtrArray *paths = g_ptr_array_new();\n  183 | \n  184 |         while(fgets(path_buf, PATH_MAX, stdin)) {\n  185 |             char *abs_path = realpath(strtok_r(path_buf, \"\\n\", &tokbuf), NULL);\n  186 |             g_ptr_array_add(paths, abs_path);\n  187 |         }\n  188 | \n  189 |         tag.paths = (char **)g_ptr_array_free(paths, FALSE);\n  190 |     }","lines":13,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/lib/hash-utility.c#L178-L190"},{"ref":"lib/hash-utility.c:225-249","code":"  225 |     for(int i = 0; tag.paths && tag.paths[i]; ++i) {\n  226 |         /* check it is a regular file */\n  227 | \n  228 |         RmStat stat_buf;\n  229 |         if(rm_sys_stat(tag.paths[i], &stat_buf) == -1) {\n  230 |             rm_log_warning_line(_(\"Can't open directory or file \\\"%s\\\": %s\"),\n  231 |                                 tag.paths[i], strerror(errno));\n  232 |         } else if(S_ISDIR(stat_buf.st_mode)) {\n  233 |             rm_log_warning_line(_(\"Directories are not supported: %s\"), tag.paths[i]);\n  234 |         } else if(S_ISREG(stat_buf.st_mode)) {\n  235 |             RmHasherTask *task = rm_hasher_task_new(hasher, NULL, GINT_TO_POINTER(i));\n  236 |             tag.read_succesful[i] =\n  237 |                 rm_hasher_task_hash(task, tag.paths[i], 0, stat_buf.st_size, FALSE, NULL);\n  238 | \n  239 |             rm_hasher_task_finish(task);\n  240 |             continue;\n  241 |         } else {\n  242 |             rm_log_warning_line(_(\"%s: Unknown file type\"), tag.paths[i]);\n  243 |         }\n  244 | \n  245 |         /* dummy callback for failed paths */\n  246 |         g_free(tag.paths[i]);\n  247 |         tag.paths[i] = NULL;\n  248 |         rm_hasher_callback(hasher, NULL, &tag, GINT_TO_POINTER(i));\n  249 |     }","lines":25,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/lib/hash-utility.c#L225-L249"},{"ref":"lib/hash-utility.c:260","code":"  260 |     g_strfreev(tag.paths);","lines":1,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/lib/hash-utility.c#L260"}]},
{"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"rm_xattr_list() can return NULL when rm_sys_listxattr() fails (line 333-337). Both rm_xattr_is_deduplicated() and rm_xattr_mark_deduplicated() pass this possibly-NULL 'map' straight into g_hash_table_iter_init(&iter, map) and later g_hash_table_destroy(map) without a NULL check. glib's g_return_if_fail guards in these functions will log a CRITICAL warning every call (and abort the process if G_DEBUG=fatal-warnings is set, a common debug/test configuration), instead of the functions failing cleanly.","fix":"Check `if(map == NULL) return false;` (or EXIT_FAILURE for the mark function) immediately after calling rm_xattr_list(), before initializing the iterator or destroying it.","locations":[{"ref":"lib/xattr.c:531-535","code":"  531 |     char *key = NULL, *value = NULL;\n  532 |     GHashTable *map = rm_xattr_list(path, follow_symlinks);\n  533 |     GHashTableIter iter;\n  534 | \n  535 |     g_hash_table_iter_init(&iter, map);","lines":5,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/lib/xattr.c#L531-L535"},{"ref":"lib/xattr.c:438","code":"  438 |         g_hash_table_destroy(map);","lines":1,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/lib/xattr.c#L438"},{"ref":"lib/xattr.c:475-478","code":"  475 |     GHashTable *map = rm_xattr_list(path, follow_symlinks);\n  476 |     GHashTableIter iter;\n  477 | \n  478 |     g_hash_table_iter_init(&iter, map);","lines":4,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/lib/xattr.c#L475-L478"},{"ref":"lib/xattr.c:510","code":"  510 |     g_hash_table_destroy(map);","lines":1,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/lib/xattr.c#L510"}]},
{"id":"MEM_3","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"rm_cmd_size_range_string_to_bytes() in lib/cmdline.c calls g_strsplit(range_spec, \"-\", 2) which, for a range_spec starting with '-' (e.g. \"-100\"), allocates split[0] as an empty string \"\". The very next check `if(*range_spec == '-') { split[0] = g_strdup(\"0\"); }` overwrites that pointer with a newly allocated \"0\" string without freeing the original empty-string allocation first, leaking it. Reproduced with a standalone GLib test: g_strsplit(\"-100\", \"-\", 2) returns split[0]=\"\" (heap-allocated), split[1]=\"100\".","fix":"Free the old split[0] before overwriting it: `g_free(split[0]); split[0] = g_strdup(\"0\");`.","locations":[{"ref":"lib/cmdline.c:127-133","code":"  127 |     range_spec = (const char *)g_strstrip((char *)range_spec);\n  128 |     gchar **split = g_strsplit(range_spec, \"-\", 2);\n  129 | \n  130 |     if(*range_spec == '-') {\n  131 |         /* Act like it was \"0-...\" */\n  132 |         split[0] = g_strdup(\"0\");\n  133 |     }","lines":7,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/lib/cmdline.c#L127-L133"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"rm_cmd_size_string_to_bytes() in lib/cmdline.c computes `fraction = ((double)fraction_num) / pow(10, 1 + ((int)log10(fraction_num)))` whenever a size spec contains a dot followed by digits (e.g. for --size, -q/-Q clamp offsets, --limit-mem, --read-buffer-len, --sweep-size, --sweep-files). If the digits after the dot parse to 0 (e.g. user passes \"5.0\", \"5.00\", or a bare \"5.\" so dot[1] is empty/strtoull returns 0), then log10(0) is -inf, (int)(-inf) is undefined behavior that in practice yields INT_MIN on glibc, `1 + INT_MIN` signed-overflows, and pow(10, huge_negative_exponent) is 0, producing fraction = 0/0 = NaN. NaN then propagates into `(result + fraction) * size_factor`, the overflow guard `fres > nextafter(...)` is false for NaN, so `result = fres` casts NaN to RmOff (implementation-defined/UB), yielding a garbage size threshold silently accepted as valid. Verified end-to-end with a standalone reproduction of the exact arithmetic: log10(0)=-inf, (int)log10(0)=INT_MIN, final fraction=-nan.","fix":"Guard against fraction_num == 0 before calling log10(), e.g. `fraction = (fraction_num == 0) ? 0.0 : ((double)fraction_num) / pow(10, 1 + (int)log10(fraction_num));`.","locations":[{"ref":"lib/utilities.c:202-225","code":"  202 |     char *dot = strchr(size_spec_stripped, '.');\n  203 |     if(dot != NULL) {\n  204 |         need_multiply = true;\n  205 | \n  206 |         // Parse with strtoull since we only accept numbers after the dot.\n  207 |         // (not 1e10 or negative number like strtod would support them)\n  208 |         char *first_error = NULL;\n  209 |         RmOff fraction_num = strtoull(&dot[1], &first_error, 10);\n  210 |         if(first_error != NULL && *first_error != 0) {\n  211 |             g_set_error(error, RM_ERROR_QUARK, 0, _(\"Failed to parse size fraction\"));\n  212 |             return 0;\n  213 |         }\n  214 | \n  215 |         if(fraction_num == ULLONG_MAX && errno == ERANGE) {\n  216 |             g_set_error(error, RM_ERROR_QUARK, 0, _(\"Fraction is too big for uint64\"));\n  217 |             return 0;\n  218 |         }\n  219 | \n  220 |         // Make sure number parsing doesn't see the dot.\n  221 |         *dot = 0;\n  222 | \n  223 |         // Convert the integer (e.g. 523) to a fraction (e.g. 0.523).\n  224 |         fraction = ((double)fraction_num) / pow(10, 1 + ((int)log10(fraction_num)));\n  225 |     }","lines":24,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/lib/utilities.c#L202-L225"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"RmDigestExt.len is a guint8 (max 255), but rm_digest_ext_update() computes `state->len = size / 2` where size is an RmOff (64-bit) derived from strlen() of a JSON-supplied checksum string with no upper bound check. Any checksum string longer than 510 hex characters silently truncates state->len via implicit narrowing conversion, producing a digest of the wrong (truncated) length rather than an error, which can cause incorrect/non-deterministic duplicate matching for replay files with abnormally long checksum fields.","fix":"Validate the parsed checksum string length against a sane maximum (or change RmDigestExt.len to a wider type, e.g. guint16/guint32) before assigning, and reject/log an error for oversized values instead of silently truncating.","locations":[{"ref":"lib/checksum.c:666-669","code":"  666 | typedef struct RmDigestExt {\n  667 |     guint8 len;\n  668 |     guint8 *data;\n  669 | } RmDigestExt;","lines":4,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/lib/checksum.c#L666-L669"},{"ref":"lib/checksum.c:703-708","code":"  703 |     state->len = size / 2;\n  704 |     state->data = g_slice_alloc(state->len);\n  705 | \n  706 |     for(unsigned i = 0; i < state->len; ++i) {\n  707 |         state->data[i] = (CHAR_TO_NUM(data[2 * i]) << 4) + CHAR_TO_NUM(data[2 * i + 1]);\n  708 |     }","lines":6,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/lib/checksum.c#L703-L708"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"rm_hasher_buffered_read() calls `fseek(fd, start_offset, SEEK_SET)` where start_offset is a guint64, but fseek()'s offset parameter is a `long`, which is 32-bit on common 32-bit platforms (rmlint explicitly supports 32-bit builds, see RM_PLATFORM_32 used elsewhere in lib/checksum.c for the murmur hash selection). On such platforms, start_offset values >= 2GiB are truncated, causing the buffered-read path to seek to the wrong file position for large files / large start offsets, silently producing a checksum over the wrong file region. The unbuffered preadv()-based read path does not have this problem since it passes the full 64-bit offset directly to preadv().","fix":"Use fseeko(fd, (off_t)start_offset, SEEK_SET) instead of fseek(), ensuring the build defines _FILE_OFFSET_BITS=64 (or equivalent) so off_t is 64-bit even on 32-bit platforms.","locations":[{"ref":"lib/hasher.c:183-187","code":"  183 |     if(fseek(fd, start_offset, SEEK_SET) == -1) {\n  184 |         rm_log_perror(\"fseek(3) failed\");\n  185 |         fclose(fd);\n  186 |         return FALSE;\n  187 |     }","lines":5,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/lib/hasher.c#L183-L187"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"RunnerView.on_default_action() (triggered by the global Ctrl+Enter accelerator while the runner view is active) calls self._generate_script(trie, trie.root), passing a single PathNode instead of a list/iterable of nodes like every other caller (on_generate_script passes [self.model.trie.root]). _generate_script() does `for node in nodes:`, and PathNode has no __iter__ (see tree.py __slots__), so this raises TypeError: 'PathNode' object is not iterable, crashing the keyboard-shortcut code path.","fix":"Change to `self._generate_script(trie, [trie.root])` to match on_generate_script().","locations":[{"ref":"gui/shredder/views/runner.py:430-434","code":"  430 |     def on_default_action(self):\n  431 |         \"\"\"Called on Ctrl-Enter\"\"\"\n  432 |         if self.actionbar.is_sensitive():\n  433 |             trie = self.model.trie\n  434 |             self._generate_script(trie, trie.root)","lines":5,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/gui/shredder/views/runner.py#L430-L434"},{"ref":"gui/shredder/tree.py:84-108","code":"   84 | class PathNode:\n   85 |     \"\"\"A single node in the PathTrie.\"\"\"\n   86 |     # Save a bit of memory:\n   87 |     __slots__ = [\n   88 |         # Public:\n   89 |         'name', 'parent', 'children', 'row',\n   90 | \n   91 |         # Private:\n   92 |         'is_leaf', 'idx', 'indices', 'depth'\n   93 |     ]\n   94 | \n   95 |     def __init__(self, name, parent, metadata=None, children=None):\n   96 |         # Public:\n   97 |         self.name = name\n   98 |         self.parent = parent\n   99 |         self.children = children or OrderedDict()\n  100 | \n  101 |         # If None probably a directory node, show the bare minimum:\n  102 |         self.row = Column.make_row(metadata or {})\n  103 | \n  104 |         # Private:\n  105 |         self.indices = deque()\n  106 |         self.idx = 0\n  107 |         self.is_leaf = False\n  108 |         self.depth = (parent.depth + 1) if parent else 0","lines":25,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/gui/shredder/tree.py#L84-L108"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"rm_hasher_unbuffered_read() clamps bytes_read with `bytes_read = MIN((gsize)bytes_read, bytes_remaining)`. When the caller requests a whole-file read (bytes_to_read == 0, i.e. read_to_eof is TRUE), bytes_remaining is initialized to bytes_to_read == 0 and is never anything else, so this MIN always yields 0 regardless of how many bytes preadv() actually returned. Every buffer's buffer->len is then computed via CLAMP(0 - i*buf_size, 0, buf_size) == 0, so no data is ever sent to the hash pipe, and the loop immediately exits via the `read_to_eof && bytes_read == 0` branch reporting success. The result is a digest computed over zero bytes for any unbuffered (preadv-based) whole-file read. The sibling function rm_hasher_buffered_read() does not have this bug because it tracks EOF via feof(fd) instead of clamping against bytes_remaining. Currently no caller passes bytes_to_read=0 (both shredder.c and hash-utility.c pass an explicit size), so this is latent, but it directly contradicts the documented API contract in hasher.h (\"pass 0 to read whole file\") and will silently corrupt results for any future/external caller that uses it as documented.","fix":"Track EOF independently of bytes_remaining when read_to_eof is true, e.g. only apply the MIN(bytes_read, bytes_remaining) clamp when !read_to_eof, and detect actual end-of-file by checking the preadv() return value (0 or short read) instead of relying on bytes_remaining reaching 0.","locations":[{"ref":"lib/hasher.c:279","code":"  279 |     guint64 bytes_remaining = bytes_to_read;","lines":1,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/lib/hasher.c#L279"},{"ref":"lib/hasher.c:301-302","code":"  301 |         /* ignore over-reads */\n  302 |         bytes_read = MIN((gsize)bytes_read, bytes_remaining);","lines":2,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/lib/hasher.c#L301-L302"},{"ref":"lib/hasher.c:313-314","code":"  313 |             buffer->len = CLAMP(bytes_read - i * (gint32)hasher->buf_size, 0,\n  314 |                                 (gint32)hasher->buf_size);","lines":2,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/lib/hasher.c#L313-L314"},{"ref":"lib/hasher.c:325-327","code":"  325 |         if(read_to_eof && bytes_read == 0) {\n  326 |             success = TRUE;\n  327 |             break;","lines":3,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/lib/hasher.c#L325-L327"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"rm_shred_group_transfer() decrements source group counters using raw single-file fields (file->is_prefd, !file->is_prefd, !file->is_new) instead of the cluster-aware accessors (rm_file_n_prefd(), rm_file_n_nprefd(), rm_file_n_new()) that were used to increment them in rm_shred_group_push_file(). Two distinct bugs: (1) for hardlink/ext_cksum clusters, the transferred RmFile pointer can represent more than one logical file, so num_files/n_pref/n_npref are under-decremented, leaving the source group's counters too high; (2) n_new is decremented by '!file->is_new' which is the *inverted* and non-aggregated value -- a new file (is_new=true) wrongly leaves n_new unchanged while a non-new file (is_new=false) wrongly decrements n_new. This corrupts the bookkeeping used by rm_shred_group_qualifies() (num_files>=2, n_pref>0, n_npref>0, n_new>0 checks) after --mtime-window or --unmatched-basenames splits a finishing group, which can cause groups to be wrongly reported as duplicates or wrongly dropped, especially when min_mtime (--newer-than) filtering is combined with hardlinks/clusters and either of those two split features.","fix":"In rm_shred_group_transfer(), mirror the increment logic exactly: source->num_files -= rm_file_n_files(file); source->n_pref -= rm_file_n_prefd(file); source->n_npref -= rm_file_n_nprefd(file); source->n_new -= rm_file_n_new(file); (note the sign: subtract the new-count, not its inverse).","locations":[{"ref":"lib/shredder.c:921-930","code":"  921 |         /* update group counters */\n  922 |         shred_group->num_files += rm_file_n_files(file);\n  923 |         shred_group->n_pref += rm_file_n_prefd(file);\n  924 |         shred_group->n_npref += rm_file_n_nprefd(file);\n  925 |         shred_group->n_new += rm_file_n_new(file);\n  926 |         shred_group->n_clusters++;\n  927 |         if(file->ext_cksum == NULL) {\n  928 |             shred_group->n_unhashed_clusters++;\n  929 |         }\n  930 |         shred_group->n_inodes += RM_FILE_INODE_COUNT(file);","lines":10,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/lib/shredder.c#L921-L930"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"on_generate_selection_script() guards with `if not selected_nodes:` but selected_nodes is the return value of PathTreeView.get_selected_nodes(), which is a generator (defined with `yield` in tree.py). A generator object is always truthy regardless of whether it would yield zero or more items, so this guard never triggers and the 'Nothing selected to make script from' branch is dead code. With nothing selected, an empty/no-op script gets silently generated instead of warning the user.","fix":"Materialize the generator first, e.g. `selected_nodes = list(self.treeview.get_selected_nodes())`, then check `if not selected_nodes:`.","locations":[{"ref":"gui/shredder/views/runner.py:419-428","code":"  419 |     def on_generate_selection_script(self, _):\n  420 |         \"\"\"Generate the script only from the current selected dir or files.\"\"\"\n  421 |         model = self.treeview.get_model()\n  422 |         selected_nodes = self.treeview.get_selected_nodes()\n  423 | \n  424 |         if not selected_nodes:\n  425 |             LOGGER.info('Nothing selected to make script from.')\n  426 |             return\n  427 | \n  428 |         self._generate_script(model.trie, selected_nodes)","lines":10,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/gui/shredder/views/runner.py#L419-L428"},{"ref":"gui/shredder/tree.py:856-861","code":"  856 |     def get_selected_nodes(self):\n  857 |         \"\"\"Extra convenience method for getting the currently selected nodes\"\"\"\n  858 |         model, rows = self.get_selection().get_selected_rows()\n  859 |         for tp_path in rows:\n  860 |             node = model.trie.resolve(tp_path.get_indices())\n  861 |             yield node","lines":6,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/gui/shredder/tree.py#L856-L861"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In rm_digest_paranoid_buffered_update(), a rejected twin candidate is only added to paranoid->rejects when `!paranoid->shadow_hash` is true (line 778). However shadow_hash is unconditionally created in rm_digest_paranoid_new() and is only ever freed in rm_digest_paranoid_free() (at which point the whole RmParanoid is being destroyed), so this condition is always false during normal operation. As a result paranoid->rejects is never populated, making the reject-list fast-path in rm_digest_equal() (line 1010: `g_slist_find(pa->rejects, b) || g_slist_find(pb->rejects, a)`) permanently dead, forcing every paranoid digest comparison to fall through to the full buffer-by-buffer walk even for pairs that were already proven not to match. This silently defeats the documented performance optimisation (the comment at lines 772-773 and 779 both states the rejects list exists 'to speed up rm_digest_equal()').","fix":"Remove the `if(!paranoid->shadow_hash)` guard (or replace with the intended condition) so rejected twin candidates are actually appended to paranoid->rejects.","locations":[{"ref":"lib/checksum.c:822-835","code":"  822 |         if(paranoid->twin_candidate && !match) {\n  823 |             /* reject the twin candidate, also add to rejects list to speed up\n  824 |              * rm_digest_equal() */\n  825 | #if _RM_CHECKSUM_DEBUG\n  826 |             rm_log_debug_line(\"Rejected twin candidate %p for %p\",\n  827 |                               paranoid->twin_candidate, paranoid);\n  828 | #endif\n  829 |             if(!paranoid->shadow_hash) {\n  830 |                 /* we use the rejects file to speed up rm_digest_equal */\n  831 |                 paranoid->rejects =\n  832 |                     g_slist_prepend(paranoid->rejects, paranoid->twin_candidate);\n  833 |             }\n  834 |             paranoid->twin_candidate = NULL;\n  835 |             paranoid->twin_candidate_buffer = NULL;","lines":14,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/lib/checksum.c#L822-L835"},{"ref":"lib/checksum.c:1064-1067","code":" 1064 |         /* check if already rejected */\n 1065 |         if(g_slist_find(pa->rejects, b) || g_slist_find(pb->rejects, a)) {\n 1066 |             return false;\n 1067 |         }","lines":4,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/lib/checksum.c#L1064-L1067"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"ScriptSaverDialog.on_file_type_changed() builds the new filename with `path + '.' + self.file_type.get_selected_choice() or ''`. Due to Python operator precedence this parses as `(path + '.' + get_selected_choice()) or ''`, not `path + '.' + (get_selected_choice() or '')` as the code clearly intends. Since `path` is always a non-empty string, the `or ''` fallback is unreachable dead code, and if get_selected_choice() were ever to return None this would raise TypeError instead of falling back to an empty suffix.","fix":"Parenthesize correctly: `path + '.' + (self.file_type.get_selected_choice() or '')`.","locations":[{"ref":"gui/shredder/views/editor.py:385-390","code":"  385 |         else:\n  386 |             try:\n  387 |                 path, _ = current_path.rsplit('.', 1)\n  388 |                 self.set_current_name(\n  389 |                     path + '.' + self.file_type.get_selected_choice() or ''\n  390 |                 )","lines":6,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/gui/shredder/views/editor.py#L385-L390"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"rm_trie_set_value() calls rm_trie_search_node() (which takes/releases self->lock internally) and then mutates find->data *after* the lock has already been released, unlike every other trie mutator (rm_trie_insert, rm_trie_build_path) which hold the lock for the entire read-modify sequence. This is a data race if the trie is used concurrently from multiple threads, which the embedded GMutex implies is a design requirement. Currently dead code (no callers anywhere in the codebase), so impact is latent rather than active, but it would corrupt data the moment it is wired in for concurrent use.","fix":"Hold self->lock for the full lookup+assign, e.g. add an internal locked variant or extend rm_trie_search_node with an unlocked counterpart used under a single lock acquisition in rm_trie_set_value.","locations":[{"ref":"lib/pathtricia.c:227-235","code":"  227 | bool rm_trie_set_value(RmTrie *self, const char *path, void *data) {\n  228 |     RmNode *find = rm_trie_search_node(self, path);\n  229 |     if(find == NULL) {\n  230 |         return false;\n  231 |     } else {\n  232 |         find->data = data;\n  233 |         return true;\n  234 |     }\n  235 | }","lines":9,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/lib/pathtricia.c#L227-L235"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"rm_tm_cluster_up() looks up parent->file_count from self->count_tree using GPOINTER_TO_UINT (treemerge.c:1001), whereas the original, equivalent lookup in rm_tm_feed() uses GPOINTER_TO_INT (treemerge.c:588). count_tree intentionally stores -1 (via GINT_TO_POINTER(-1)) as an error sentinel for invalid directories (see rm_tm_count_art_callback). Reading that same -1 sentinel back with GPOINTER_TO_UINT yields a large positive value (e.g. 4294967295) instead of -1, assigned into the gint64 parent->file_count. This is an inconsistent/incorrect read of the shared error sentinel; it happens to mostly fail-safe today only because dupe_count realistically never reaches that magnitude, but it is a latent correctness bug and inconsistent with the sibling code path.","fix":"Use GPOINTER_TO_INT (matching rm_tm_feed at treemerge.c:588) instead of GPOINTER_TO_UINT when reading count_tree in rm_tm_cluster_up, so the -1 error sentinel round-trips correctly.","locations":[{"ref":"lib/treemerge.c:992-993","code":"  992 |         parent->file_count =\n  993 |             GPOINTER_TO_UINT(rm_trie_search(&self->count_tree, parent_dir));","lines":2,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/lib/treemerge.c#L992-L993"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"rm_hasher_callback() in lib/hash-utility.c uses the wrong index variable in the `print_in_order == false` branch: `session->read_succesful[session->path_index]` should be `session->read_succesful[index]` (matching the correctly-indexed `session->paths[index]` on the very next line). When the user passes -i/--ignore-order to `rmlint --hash`, RmHasherSession.path_index is never initialized (it is only set to 0 inside the `if(tag.print_in_order)` block in rm_hasher_main, which is skipped when print_in_order is false) and is never updated elsewhere, so this reads read_succesful[] at an uninitialized/garbage stack index - an out-of-bounds read whose result controls whether a hash result gets printed at all, and can crash for large garbage index values.","fix":"Change line 102 to `if(session->read_succesful[index])` to match the index used on line 103, and/or zero-initialize the RmHasherSession struct (and path_index specifically) regardless of print_in_order.","locations":[{"ref":"lib/hash-utility.c:103-106","code":"  103 |         } else if(digest) {\n  104 |             if(session->read_succesful[session->path_index]) {\n  105 |                 rm_hasher_print(digest, session->paths[index]);\n  106 |             }","lines":4,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/lib/hash-utility.c#L103-L106"},{"ref":"lib/hash-utility.c:208-212","code":"  208 |     if(tag.print_in_order) {\n  209 |         /* allocate buffer to collect results */\n  210 |         tag.completed_digests_buffer = g_slice_alloc0(buf_size);\n  211 |         tag.path_index = 0;\n  212 |     }","lines":5,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/lib/hash-utility.c#L208-L212"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"have_feature() (application.py), _guess_rmlint_version() (about.py) and show_version() (cmdline.py) all call Gio.Subprocess.new(['rmlint', '--version'], ...) unwrapped in any try/except, unlike _create_rmlint_process() in runner.py which explicitly catches GLib.Error around the same kind of spawnv call (with a dedicated ENOEXEC message for 'rmlint not installed'). If rmlint is missing from PATH, Gio.Subprocess.new raises a GLib.Error here, which is never caught: Application.__init__ crashes with a raw GLib.Error traceback instead of reaching its own intended 'No support for +replay' / sys.exit(-1) graceful-exit message, and the --version CLI flag crashes the same way instead of printing a clean error.","fix":"Wrap the Gio.Subprocess.new(['rmlint', '--version'], ...) calls in all three functions with try/except GLib.Error, logging/printing a clear 'rmlint not found' message and returning a safe fallback (False / '?.?.?' / an error message) instead of letting the exception propagate.","locations":[{"ref":"gui/shredder/application.py:25-39","code":"   25 | def have_feature(feature):\n   26 |     \"\"\"Execute rmlint --version to check for some feature.\n   27 | \n   28 |     --version will print the compile time configuration of rmlint.\n   29 |     If a feature is missing, -somefeature is printed. A + in front else.\n   30 |     \"\"\"\n   31 |     proc = Gio.Subprocess.new(\n   32 |         ['rmlint', '--version'],\n   33 |         Gio.SubprocessFlags.STDERR_PIPE\n   34 |     )\n   35 |     result, _, data = proc.communicate_utf8()\n   36 |     if not result or not data:\n   37 |         return False\n   38 | \n   39 |     return '+' + feature in data","lines":15,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/gui/shredder/application.py#L25-L39"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"rm_trav_buffer_new() calls stat()/lstat() on the user-supplied root path and, on failure, only logs via rm_log_perror() but leaves self->stat_buf as all-zero (from g_new0) and returns the buffer anyway. The caller (rm_traverse_tree) then tests S_ISLNK/S_ISREG/S_ISDIR on this zeroed stat_buf; all three are false for a zeroed st_mode, so the path silently falls into the generic 'block device/fifo/something weird' branch and is dropped with no error counter incremented and no indication to the user that the root path was simply inaccessible (e.g. due to a permissions error or it not existing).","fix":"Have rm_trav_buffer_new() return NULL (or set a flag) on stat failure, and have the caller in rm_traverse_tree() skip the path with a clear error message / increment an error counter instead of silently treating it as 'something weird'.","locations":[{"ref":"lib/traverse.c:52-67","code":"   52 | static RmTravBuffer *rm_trav_buffer_new(RmSession *session, RmPath *rmpath) {\n   53 |     RmTravBuffer *self = g_new0(RmTravBuffer, 1);\n   54 |     self->rmpath = rmpath;\n   55 | \n   56 |     int stat_state;\n   57 |     if(session->cfg->follow_symlinks) {\n   58 |         stat_state = rm_sys_stat(rmpath->path, &self->stat_buf);\n   59 |     } else {\n   60 |         stat_state = rm_sys_lstat(rmpath->path, &self->stat_buf);\n   61 |     }\n   62 | \n   63 |     if(stat_state == -1) {\n   64 |         rm_log_perror(\"Unable to stat file\");\n   65 |     }\n   66 |     return self;\n   67 | }","lines":16,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/lib/traverse.c#L52-L67"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"rm_shred_check_paranoid_mem_alloc() is documented with 'NOTE: group_lock must be held before calling' this function, and the call site in rm_shred_group_push_file() (line 944) correctly holds shred_group->lock. However the call site in rm_shred_reassign_checksum() (line 1584) invokes rm_shred_check_paranoid_mem_alloc(group, 0) before acquiring group->lock (the lock is only taken afterwards, at line 1590, for an unrelated purpose). Inside the function, group->status, group->file_size, group->hash_offset and (transitively, via rm_shred_group_potential_file_count) group->parent->num_pending are all read without the documented lock while other threads can be concurrently mutating those same fields under shred_group->lock in rm_shred_group_push_file/rm_shred_sift. This is a TOCTOU/data-race on shared mutable RmShredGroup state that can cause an incorrect (stale or torn) memory-budget decision for paranoid hashing.","fix":"Acquire group->lock before calling rm_shred_check_paranoid_mem_alloc() in rm_shred_reassign_checksum(), consistent with the function's documented locking contract, or change the contract/implementation to take the lock internally.","locations":[{"ref":"lib/shredder.c:566-579","code":"  566 | /* Governor to limit memory usage by limiting how many RmShredGroups can be\n  567 |  * active at any one time\n  568 |  * NOTE: group_lock must be held before calling rm_shred_check_paranoid_mem_alloc\n  569 |  */\n  570 | static bool rm_shred_check_paranoid_mem_alloc(RmShredGroup *group,\n  571 |                                               int active_group_threshold) {\n  572 |     if(group->status >= RM_SHRED_GROUP_HASHING) {\n  573 |         /* group already committed */\n  574 |         return true;\n  575 |     }\n  576 | \n  577 |     gint64 mem_required =\n  578 |         (rm_shred_group_potential_file_count(group) / 2 + 1) *\n  579 |         MIN(group->file_size - group->hash_offset, SHRED_PARANOID_BYTES);","lines":14,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/lib/shredder.c#L566-L579"},{"ref":"lib/shredder.c:1582-1601","code":" 1582 | static bool rm_shred_reassign_checksum(RmShredTag *main, RmFile *file) {\n 1583 |     RmCfg *cfg = main->session->cfg;\n 1584 |     RmShredGroup *group = file->shred_group;\n 1585 | \n 1586 |     if(group->digest_type == RM_DIGEST_PARANOID) {\n 1587 |         /* check if memory allocation is ok */\n 1588 |         if(!rm_shred_check_paranoid_mem_alloc(group, 0)) {\n 1589 |             return false;\n 1590 |         }\n 1591 | \n 1592 |         /* get the required target offset into group->next_offset, so that\n 1593 |          * we can make the paranoid RmDigest the right size*/\n 1594 |         g_mutex_lock(&group->lock);\n 1595 |         {\n 1596 |             if(group->next_offset == 0) {\n 1597 |                 (void)rm_shred_get_read_size(file, main);\n 1598 |             }\n 1599 |             g_assert(group->hash_offset == file->hash_offset);\n 1600 |         }\n 1601 |         g_mutex_unlock(&group->lock);","lines":20,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/lib/shredder.c#L1582-L1601"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In rm_shred_reassign_checksum(), while holding group->lock, candidate twin digests are sent by first materialising the entire children hash table into a temporary GList via g_hash_table_get_values(), then iterating and freeing each link one at a time with g_list_delete_link(). This allocates and frees an intermediate linked list (proportional to the number of sibling subgroups) on every paranoid-mode file increment, while the group's lock is held, unnecessarily extending the critical section and adding allocator churn in a hot path that already contends with other device threads for the same group lock.","fix":"Use g_hash_table_foreach(group->children, send_candidate_cb, file->digest) to iterate the hash table values directly without building/freeing a temporary GList.","locations":[{"ref":"lib/shredder.c:1608-1623","code":" 1608 |             g_mutex_lock(&group->lock);\n 1609 |             {\n 1610 |                 if(group->children) {\n 1611 |                     GList *children = g_hash_table_get_values(group->children);\n 1612 |                     while(children) {\n 1613 |                         RmShredGroup *child = children->data;\n 1614 |                         rm_digest_send_match_candidate(file->digest, child->digest);\n 1615 |                         children = g_list_delete_link(children, children);\n 1616 |                     }\n 1617 |                 }\n 1618 |                 /* store a reference so the shred group knows where to send any future\n 1619 |                  * twin candidate digests */\n 1620 |                 group->in_progress_digests =\n 1621 |                     g_list_prepend(group->in_progress_digests, file->digest);\n 1622 |             }\n 1623 |             g_mutex_unlock(&group->lock);","lines":16,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/lib/shredder.c#L1608-L1623"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"RmShredTag.lock (a GMutex) and the fields remaining_files/remaining_bytes are declared, and tag.lock is initialised with g_mutex_init() in rm_shred_run(), but the mutex is never locked/unlocked anywhere in the file and the two counter fields are never read or written anywhere. The mutex is also never cleared with g_mutex_clear() before rm_shred_run() returns, unlike tag.hash_mem_mtx which is properly cleared at the end.","fix":"Remove the unused lock/remaining_files/remaining_bytes fields from RmShredTag, or if they're meant for future use, at least pair the g_mutex_init with a g_mutex_clear before rm_shred_run returns.","locations":[{"ref":"lib/shredder.c:314-317","code":"  314 |     GMutex lock;\n  315 | \n  316 |     gint32 remaining_files;\n  317 |     gint64 remaining_bytes;","lines":4,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/lib/shredder.c#L314-L317"},{"ref":"lib/shredder.c:1758","code":" 1758 |     g_mutex_init(&tag.lock);","lines":1,"link":"https://github.com/sahib/rmlint/blob/66ffc8bff3bf0b9108f3425d5d26039a8c6f9eda/lib/shredder.c#L1758"}]},
{"id":"OTHER_1","type":"other","type_label":"Other","severity":"high","difficulty":"easy","description":"rm_fmt_add() clones a registered handler template via g_malloc0+memcpy into new_handler_copy, which is the object actually stored in handler_order/handler_to_file and whose print_mtx is locked/unlocked on every write via RM_FMT_CALLBACK and cleared in rm_fmt_close(). However the g_mutex_init() call right after the memcpy initializes new_handler->print_mtx (the original template handler still sitting in name_to_handler), not new_handler_copy->print_mtx. As a result the mutex that is actually used for locking is never properly initialized - it is a raw memcpy'd bit-pattern of the template's GMutex, which is undefined behavior with GLib's mutex implementation. Additionally, calling rm_fmt_add() more than once for the same formatter name (e.g. `-o json:a.json -o json:b.json`, which is documented/supported usage) re-runs g_mutex_init() on the same already-initialized template mutex without an intervening g_mutex_clear(), which is itself undefined behavior per GLib's contract. rm_fmt_close() later calls g_mutex_clear() on the copy's never-validly-initialized mutex too (line 417).","fix":"Change line 287 from `g_mutex_init(&new_handler->print_mtx);` to `g_mutex_init(&new_handler_copy->print_mtx);` so the mutex that is actually locked/unlocked/cleared is the one that gets initialized.","locations":[{"ref":"lib/formats.c:262-290","code":"  262 |     /* Make a copy of the handler so we can more than one per handler type.\n  263 |      * Plus we have to set the handler specific path.\n  264 |      */\n  265 |     RmFmtHandler *new_handler_copy = g_malloc0(new_handler->size);\n  266 |     memcpy(new_handler_copy, new_handler, new_handler->size);\n  267 |     g_mutex_init(&new_handler->print_mtx);\n  268 | \n  269 |     new_handler_copy->file_existed_already = file_existed_already;\n  270 | \n  271 |     if(needs_full_path == false) {\n  272 |         new_handler_copy->path =
