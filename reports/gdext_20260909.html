{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`subarray_impl` in both `Array` and `AnyArray` clamps an unspecified `end` to `i32::MAX as i64`. Since indices are `usize` and Godot arrays can exceed `i32::MAX` elements (Godot uses `int`/`int64_t` internally for sizes), an unbounded range (`begin..`) on a very large array would be silently truncated to the first ~2.1 billion elements rather than spanning to the true end.","fix":"Default the unspecified `end` to `i64::MAX` (or the actual array length) instead of `i32::MAX as i64`.","locations":[{"ref":"godot-core/src/builtin/collections/array.rs:574-584","code":"  574 |     fn subarray_impl(&self, range: impl SignedRange, step: Option<i32>, deep: bool) -> Self {\n  575 |         assert_ne!(step, Some(0), \"subarray: step cannot be zero\");\n  576 | \n  577 |         let step = step.unwrap_or(1);\n  578 |         let (begin, end) = range.signed();\n  579 |         let end = end.unwrap_or(i32::MAX as i64);\n  580 | \n  581 |         self.as_inner()\n  582 |             .slice(begin, end, step as i64, deep)\n  583 |             .cast_array::<T>()\n  584 |     }","lines":11,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/builtin/collections/array.rs#L574-L584"},{"ref":"godot-core/src/builtin/collections/any_array.rs:253-260","code":"  253 |     fn subarray_impl(&self, range: impl meta::SignedRange, step: Option<i32>, deep: bool) -> Self {\n  254 |         let step = step.unwrap_or(1);\n  255 |         assert_ne!(step, 0, \"subarray: step cannot be zero\");\n  256 |         let (begin, end) = range.signed();\n  257 |         let end = end.unwrap_or(i32::MAX as i64);\n  258 | \n  259 |         self.array.as_inner().slice(begin, end, step as i64, deep)\n  260 |     }","lines":8,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/builtin/collections/any_array.rs#L253-L260"}]},
{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`Transform2D` derives `Default`, which produces an all-zero matrix (a, b, origin all `Vector2::ZERO`) rather than the identity transform — confirmed by the serde roundtrip test expecting all-zero fields. This is inconsistent with `Transform3D`, `Basis`, and `Projection`, which all have `Default == IDENTITY`. A zero `Transform2D` is a degenerate (non-invertible) transform, so an unsuspecting `Transform2D::default()` collapses everything to the origin.","fix":"Implement `Default` manually to return `Self::IDENTITY`, matching the other matrix types (and Godot, where `Transform2D()` is the identity).","locations":[{"ref":"godot-core/src/builtin/matrices/transform2d.rs:52-71","code":"   52 | #[derive(Default, Copy, Clone, PartialEq, Debug)]\n   53 | #[cfg_attr(feature = \"serde\", derive(serde::Serialize, serde::Deserialize))]\n   54 | #[repr(C)]\n   55 | pub struct Transform2D {\n   56 |     /// The first basis vector.\n   57 |     ///\n   58 |     /// _Godot equivalent: `Transform2D.x`_, see [`Basis`][crate::builtin::Basis] for why it's changed\n   59 |     pub a: Vector2,\n   60 | \n   61 |     /// The second basis vector.\n   62 |     ///\n   63 |     /// _Godot equivalent: `Transform2D.y`_, see [`Basis`][crate::builtin::Basis] for why it's changed\n   64 |     pub b: Vector2,\n   65 | \n   66 |     /// The origin of the transform. The coordinate space defined by this transform\n   67 |     /// starts at this point.\n   68 |     ///\n   69 |     /// _Godot equivalent: `Transform2D.origin`_\n   70 |     pub origin: Vector2,\n   71 | }","lines":20,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/builtin/matrices/transform2d.rs#L52-L71"},{"ref":"godot-core/src/builtin/matrices/transform2d.rs:820-827","code":"  820 |     #[cfg(feature = \"serde\")]\n  821 |     #[test]\n  822 |     fn serde_roundtrip() {\n  823 |         let transform = Transform2D::default();\n  824 |         let expected_json = \"{\\\"a\\\":{\\\"x\\\":0.0,\\\"y\\\":0.0},\\\"b\\\":{\\\"x\\\":0.0,\\\"y\\\":0.0},\\\"origin\\\":{\\\"x\\\":0.0,\\\"y\\\":0.0}}\";\n  825 | \n  826 |         crate::builtin::test_utils::roundtrip(&transform, expected_json);\n  827 |     }","lines":8,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/builtin/matrices/transform2d.rs#L820-L827"}]},
{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"Signal::connect() and connect_flags() call track_custom_callable() unconditionally, even when the underlying Godot connect() returned an error (e.g. duplicate connection, ERR_INVALID_PARAMETER). This records a custom-callable connection in the editor registry that may not actually exist, potentially causing stale entries / incorrect hot-reload cleanup.","fix":"Only call track_custom_callable() when `error` indicates success (Error::OK).","locations":[{"ref":"godot-core/src/builtin/signal.rs:74-94","code":"   74 |     pub fn connect(&self, callable: &Callable) -> Error {\n   75 |         let error = self.as_inner().connect(callable, 0i64);\n   76 | \n   77 |         track_custom_callable(self, callable);\n   78 |         Error::from_godot(error as i32)\n   79 |     }\n   80 | \n   81 |     /// Connect signal to a callable, customizing with flags.\n   82 |     ///\n   83 |     /// Optional flags can be also added to configure the connection's behavior (see [`ConnectFlags`](ConnectFlags) constants).\n   84 |     /// You can provide additional arguments to the connected callable by using `Callable::bind`.\n   85 |     ///\n   86 |     /// A signal can only be connected once to the same [`Callable`]. If the signal is already connected, returns [`Error::ERR_INVALID_PARAMETER`]\n   87 |     /// and pushes an error message, unless the signal is connected with [`ConnectFlags::REFERENCE_COUNTED`](ConnectFlags::REFERENCE_COUNTED).\n   88 |     /// To prevent this, check for existing connections with [`is_connected()`][Self::is_connected].\n   89 |     pub fn connect_flags(&self, callable: &Callable, flags: ConnectFlags) -> Error {\n   90 |         let error = self.as_inner().connect(callable, flags.ord() as i64);\n   91 | \n   92 |         track_custom_callable(self, callable);\n   93 |         Error::from_godot(error as i32)\n   94 |     }","lines":21,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/builtin/signal.rs#L74-L94"}]},
{"id":"API_5","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"Gd::instance_id_unchecked() is documented as 'safe and never panics', but it relies on raw.instance_id_unchecked() returning Some via unwrap_unchecked(). The safety argument ('a Gd can only be created from a non-null RawGd') holds only as long as every Gd construction path enforces non-null cached_rtti. RawGd::null() sets cached_rtti = None and try_from_ffi rejects null, but there is no type-level guarantee; a future construction path that bypasses try_from_ffi would turn this into UB (unwrap_unchecked on None).","fix":"Consider a debug_assert or strict_assert on instance_id.is_some() before unwrap_unchecked, to catch invariant violations during development without runtime cost in release.","locations":[{"ref":"godot-core/src/obj/gd.rs:316-322","code":"  316 |     pub fn instance_id_unchecked(&self) -> InstanceId {\n  317 |         let instance_id = self.raw.instance_id_unchecked();\n  318 | \n  319 |         // SAFETY: a `Gd` can only be created from a non-null `RawGd`, meaning `raw.instance_id_unchecked()` will\n  320 |         // always return `Some`.\n  321 |         unsafe { instance_id.unwrap_unchecked() }\n  322 |     }","lines":7,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/obj/gd.rs#L316-L322"}]},
{"id":"API_6","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"Gd::free() only performs the liveness check (is_instance_valid) under cfg!(safeguards_balanced). For a manually-managed type, MemManual::is_ref_counted() always returns Some(false) without consulting liveness, so under the 'disengaged' safeguard level free() on an already-destroyed object skips both checks and proceeds straight to object_destroy(), causing a double-free / use-after-free. The doc comment claims free() 'is safe and effectively prevents double-free', which is untrue at the disengaged level.","fix":"Either keep the liveness guard active regardless of safeguard level for free() (cheap relative to the destroy cost), or amend the doc/safety wording to state that double-free protection requires at least the balanced safeguard level.","locations":[{"ref":"godot-core/src/obj/gd.rs:924-927","code":"  924 |         // If ref_counted returned None, that means the instance was destroyed\n  925 |         if ref_counted != Some(false) || (cfg!(safeguards_balanced) && !self.is_instance_valid()) {\n  926 |             return error_or_panic(\"called free() on already destroyed object\".to_string());\n  927 |         }","lines":4,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/obj/gd.rs#L924-L927"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","difficulty":"easy","description":"Every spawned task is heap-boxed twice. `spawn()` calls `rt.add_task(Box::pin(future))`, passing an already-boxed `Pin<Box<dyn Future>>` as the generic `F`. Inside `add_task<F>()`, the value is boxed again via `Box::pin(future)` (line 446), producing a `Pin<Box<Pin<Box<dyn Future>>>>` that then coerces back to `Pin<Box<dyn Future>>`. The result is an extra heap allocation and an extra pointer indirection per task poll, for the entire lifetime of every async task.","fix":"Either have `spawn()` pass the bare `future` (let `add_task` do the single boxing), or change `add_task` to accept an already-pinned `Pin<Box<dyn Future<Output=()>>>` and remove the inner `Box::pin`. Pick one boxing site.","locations":[{"ref":"godot-core/src/task/async_runtime.rs:164","code":"  164 |         let task_handle = rt.add_task(Box::pin(future));","lines":1,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/task/async_runtime.rs#L164"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`Array::resize` calls `value.to_variant()` inside the loop on every iteration, even though `value` is a single `impl AsArg<T>` argument that yields the same variant each time. For large growth counts this performs N redundant conversions/allocations; Godot's own `fill()` could be used or the variant computed once and cloned.","fix":"Compute `let variant = value.to_variant();` once before the loop and clone it per slot (or use `as_inner_mut().fill()` over the new range).","locations":[{"ref":"godot-core/src/builtin/collections/array.rs:471-485","code":"  471 |         meta::arg_into_ref!(value: T);\n  472 | \n  473 |         // If new_size < original_size then this is an empty iterator and does nothing.\n  474 |         for i in original_size..new_size {\n  475 |             // Exception safety: if to_variant() panics, the array will become inconsistent (filled with non-T nils).\n  476 |             // At the moment (Nov 2024), this can only happen for u64, which isn't a valid Array element type.\n  477 |             // This could be changed to use clone() (if that doesn't panic) or store a variant without moving.\n  478 |             let variant = value.to_variant();\n  479 | \n  480 |             let ptr_mut = self.ptr_mut(i);\n  481 | \n  482 |             // SAFETY: we iterate pointer within bounds; ptr_mut() additionally checks them.\n  483 |             // ptr_mut() lookup could be optimized if we know the internal layout.\n  484 |             unsafe { variant.move_into_var_ptr(ptr_mut) };\n  485 |         }","lines":15,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/builtin/collections/array.rs#L471-L485"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"lpad()/rpad() allocate a fresh single-character GString on every call by going through `GString::from([character].as_slice())` (UTF-32 FFI construction). For code padding many strings in a loop this is a needless per-call allocation + FFI round-trip; the one-char GString could be constructed once by the caller, but the API hides it.","fix":"Document the cost, or offer a variant taking a prebuilt delimiter/character GString; at minimum note that repeated calls re-allocate.","locations":[{"ref":"godot-core/src/builtin/strings/macros.rs:204-218","code":"","lines":15,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/builtin/strings/macros.rs#L204-L218"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`OutParamTuple::with_variant_pointers` round-trips through full `Variant` construction: it calls `with_variants` (which materializes a `[Variant; N]` via `ref_to_variant` for every argument) and then takes `var_sys()` of each. For ptr-style out-calls this builds and immediately drops a Variant per argument. The dedicated `with_type_pointers` path (FFI repr, no Variant) exists for exactly this reason; using the variant path where only pointers are needed adds avoidable allocations/clones on the out-call hot path.","fix":"Where callers only need Variant *pointers* and Variant semantics aren't required, prefer the `with_type_pointers` path; otherwise document why full Variants are mandatory here. At minimum verify this isn't used on perf-critical out-calls that could use type pointers.","locations":[{"ref":"godot-core/src/meta/param_tuple/impls.rs:141-153","code":"  141 |             fn with_variant_pointers<F, R>(self, f: F) -> R\n  142 |             where\n  143 |                 F: FnOnce(&[godot_ffi::GDExtensionConstVariantPtr]) -> R,\n  144 |             {\n  145 |                 self.with_variants(|variants| {\n  146 |                     let sys_args = [\n  147 |                         $(\n  148 |                             Variant::var_sys(&variants[$n]),\n  149 |                         )*\n  150 |                     ];\n  151 |                     f(&sys_args)\n  152 |                 })\n  153 |             }","lines":13,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/meta/param_tuple/impls.rs#L141-L153"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"from_obj_sys_weak() performs an FFI round-trip (object_get_instance_id) for every non-null weak construction. This is on the hot path for every object argument received in ptrcalls (from_arg_ptr -> from_obj_sys -> from_obj_sys_weak) and every object returned from engine APIs. For functions taking/returning many objects, this is a per-object FFI call solely to populate cached_rtti.","fix":"Consider deferring the instance-ID query to first use (lazy rtti) for performance-critical paths, or document that the cost is intentional. At minimum, profile whether the eager query is justified.","locations":[{"ref":"godot-core/src/obj/raw_gd.rs:51-65","code":"   51 |     pub(super) unsafe fn from_obj_sys_weak(obj: sys::GDExtensionObjectPtr) -> Self {\n   52 |         let rtti = if obj.is_null() {\n   53 |             None\n   54 |         } else {\n   55 |             let raw_id = unsafe { interface_fn!(object_get_instance_id)(obj) };\n   56 | \n   57 |             // This happened originally during Variant -> RawGd conversion, but at this point it's too late to detect, and UB has already\n   58 |             // occurred (the Variant holds the object pointer as bytes in an array, which becomes dangling the moment the actual object dies).\n   59 |             let instance_id = InstanceId::try_from_u64(raw_id)\n   60 |                 .expect(\"null instance ID when constructing object; this very likely causes UB\");\n   61 | \n   62 |             // TODO(bromeon): this should query dynamic type of object, which can be different from T (upcast, FromGodot, etc).\n   63 |             // See comment in ObjectRtti.\n   64 |             Some(ObjectRtti::of::<T>(instance_id))\n   65 |         };","lines":15,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/obj/raw_gd.rs#L51-L65"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`try_dynify_object` and `get_dyn_implementor_class_ids` do a linear scan over the `Vec<DynTraitImpl>` for a trait, and `get_dyn_gd` inside calls `object.dynamic_class_string()` (an FFI call) plus a `StringName` comparison per candidate. For each conversion attempt this is O(implementors) FFI calls. The code itself flags this (`// TODO maybe use 2nd hashmap instead of linear search`). For classes with many `#[godot_dyn]` implementors this is a per-conversion cost on a path that can be hot (e.g. property/array deserialization).","fix":"Key the registry by (TypeId, ClassId) so the implementing relation can be looked up directly from the object's dynamic class, avoiding the per-candidate `dynamic_class_string()` FFI call and linear scan.","locations":[{"ref":"godot-core/src/registry/class.rs:398-413","code":"  398 |     // TODO maybe use 2nd hashmap instead of linear search.\n  399 |     // (probably not pair of typeid/classname, as that wouldn't allow the above check).\n  400 |     for relation in relations {\n  401 |         match relation.get_dyn_gd(object) {\n  402 |             Ok(dyn_gd) => return Ok(dyn_gd),\n  403 |             Err(obj) => object = obj,\n  404 |         }\n  405 |     }\n  406 | \n  407 |     let error = FromGodotError::UnimplementedDynTrait {\n  408 |         trait_name,\n  409 |         class_name: object.dynamic_class_string().to_string(),\n  410 |     };\n  411 | \n  412 |     Err((error, object))\n  413 | }","lines":16,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/registry/class.rs#L398-L413"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"RustTy::is_integer calls ty.to_string() (Ident->String allocation) on every invocation just to compare against a fixed set of literals, called per-parameter during codegen via the enum-replacement path. Build-time only and small, hence negligible.","fix":"Compare against the Ident without allocating, or compute the string once.","locations":[{"ref":"godot-codegen/src/models/domain.rs:904-914","code":"  904 |     pub fn is_integer(&self) -> bool {\n  905 |         let RustTy::BuiltinIdent { ty, .. } = self else {\n  906 |             return false;\n  907 |         };\n  908 | \n  909 |         // isize/usize currently not supported (2025-09), but this is more future-proof.\n  910 |         matches!(\n  911 |             ty.to_string().as_str(),\n  912 |             \"i8\" | \"i16\" | \"i32\" | \"i64\" | \"u8\" | \"u16\" | \"u32\" | \"u64\" | \"isize\" | \"usize\"\n  913 |         )\n  914 |     }","lines":11,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-codegen/src/models/domain.rs#L904-L914"}]},
{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`Dictionary::insert` and `Dictionary::get`/`at` perform a `has()` FFI call followed by a separate `get()` FFI call (double round-trip) to fetch the previous/current value. The code's own TODO comments note this. For hot insert/get loops this doubles the FFI cost per operation.","fix":"Use a sentinel-based single-call pattern (e.g. `get(key, unique_sentinel)`) to detect presence and retrieve the value in one FFI call where supported.","locations":[{"ref":"godot-core/src/builtin/collections/dictionary.rs:198-204","code":"  198 |     // TODO(v0.6): avoid double FFI round-trip (has + get); consider using get(key, sentinel) pattern.\n  199 |     /// Gets and removes the old value for a key, if it exists.\n  200 |     fn take_old_value(&self, key_variant: &Variant) -> Option<V> {\n  201 |         self.as_inner()\n  202 |             .has(key_variant)\n  203 |             .then(|| self.get_or_panic(key_variant.clone()))\n  204 |     }","lines":7,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/builtin/collections/dictionary.rs#L198-L204"},{"ref":"godot-core/src/builtin/collections/dictionary.rs:345-358","code":"  345 |     pub fn insert(&mut self, key: impl AsArg<K>, value: impl AsArg<V>) -> Option<V> {\n  346 |         self.balanced_ensure_mutable();\n  347 | \n  348 |         meta::arg_into_ref!(key: K);\n  349 |         meta::arg_into_ref!(value: V);\n  350 | \n  351 |         let key_variant = key.to_variant();\n  352 |         let old_value = self.take_old_value(&key_variant);\n  353 | \n  354 |         // SAFETY: K and V strongly typed.\n  355 |         unsafe { self.set_variant(key_variant, value.to_variant()) };\n  356 | \n  357 |         old_value\n  358 |     }","lines":14,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/builtin/collections/dictionary.rs#L345-L358"}]},
{"id":"PERF_9","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"get_owner_func and get_script_func clone the borrowed Gd (incrementing the refcount for ref-counted objects) only to read obj_sys() and immediately drop the clone (decrementing again). The original &Gd held by the script instance already keeps the object alive, so the clone/drop pair is pure overhead on every engine call to these hooks.","fix":"Return i.get_owner().map(|gd| gd.obj_sys()) / i.get_script().obj_sys() directly without cloning; the reference returned by the user trait method already guarantees liveness for the duration of the call.","locations":[{"ref":"godot-core/src/obj/script.rs:1341-1346","code":" 1341 |         let owner = with_instance(instance, \"get_owner\", |i| i.get_owner().clone());\n 1342 | \n 1343 |         match owner {\n 1344 |             Ok(Some(owner)) => owner.obj_sys(),\n 1345 |             _ => std::ptr::null_mut(),\n 1346 |         }","lines":6,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/obj/script.rs#L1341-L1346"},{"ref":"godot-core/src/obj/script.rs:889-894","code":"  889 |         let script = with_instance(instance, \"get_script\", |i| i.get_script().clone());\n  890 | \n  891 |         match script {\n  892 |             Ok(script) => script.obj_sys(),\n  893 |             Err(_) => std::ptr::null_mut(),\n  894 |         }","lines":6,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/obj/script.rs#L889-L894"}]},
{"id":"PERF_10","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`export_range` builds its hint string with repeated `push_str(&format!(...))`, allocating a throwaway `String` for each appended fragment (the `,{rest}` and `,suffix:{suffix}` parts). Minor, but `write!`/`push_str` on literals avoids the intermediate allocations.","fix":"Use `hint_string.push(',')` + `push_str(&rest)` and `write!(hint_string, \",suffix:{suffix}\")` instead of `push_str(&format!(...))`.","locations":[{"ref":"godot-core/src/registry/property/mod.rs:400-406","code":"  400 |         let mut hint_string = hint_beginning;\n  401 |         if !rest.is_empty() {\n  402 |             hint_string.push_str(&format!(\",{rest}\"));\n  403 |         }\n  404 |         if let Some(suffix) = suffix {\n  405 |             hint_string.push_str(&format!(\",suffix:{suffix}\"));\n  406 |         }","lines":7,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/registry/property/mod.rs#L400-L406"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"In format_one, the (';', _) arm matches every semicolon regardless of state and re-flows the line, so the later arm (c, FormatState::PrevClosingBrace) if c == ';' || c == ',' can never fire for ';'. The accompanying comment 'technically ; is already covered, but it's explicit.' mislabels unreachable dead code as merely explicit.","fix":"Change the guard to `if c == ','` and remove/update the misleading comment.","locations":[{"ref":"godot-codegen/src/formatter/mod.rs:156-161","code":"  156 |             match (c, *state) {\n  157 |                 (';', _) => {\n  158 |                     s.push('\\n');\n  159 |                     s.push_str(indent(level));\n  160 |                     *state = FormatState::Start;\n  161 |                 }","lines":6,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-codegen/src/formatter/mod.rs#L156-L161"},{"ref":"godot-codegen/src/formatter/mod.rs:202-209","code":"  202 |                 (c, FormatState::PrevClosingBrace) if c == ';' || c == ',' => {\n  203 |                     // technically ; is already covered, but it's explicit.\n  204 | \n  205 |                     s.push('\\n');\n  206 |                     s.push_str(indent(level));\n  207 | \n  208 |                     *state = FormatState::Start;\n  209 |                 }","lines":8,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-codegen/src/formatter/mod.rs#L202-L209"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"`Quaternion::from_axis_angle` asserts that `axis.is_normalized()` and then computes `let d = axis.length();` and `let s = sin_angle / d;`. Because the assert guarantees `d ≈ 1.0`, the division by `d` is redundant work that also gives a false impression that non-normalized axes are supported (they are not — the assert rejects them). Godot's original divides by length precisely because it accepts non-normalized axes; here the two are contradictory.","fix":"Either drop the `is_normalized` assert and keep dividing by `d` (to genuinely support arbitrary axes, matching Godot), or keep the assert and remove the redundant `d`/division (`let s = sin_angle;`).","locations":[{"ref":"godot-core/src/builtin/quaternion.rs:52-65","code":"   52 |     pub fn from_axis_angle(axis: Vector3, angle: real) -> Self {\n   53 |         assert!(\n   54 |             axis.is_normalized(),\n   55 |             \"Quaternion axis {axis:?} is not normalized.\"\n   56 |         );\n   57 |         let d = axis.length();\n   58 |         let sin_angle = (angle * 0.5).sin();\n   59 |         let cos_angle = (angle * 0.5).cos();\n   60 |         let s = sin_angle / d;\n   61 |         let x = axis.x * s;\n   62 |         let y = axis.y * s;\n   63 |         let z = axis.z * s;\n   64 |         let w = cos_angle;\n   65 |         Self::new(x, y, z, w)","lines":14,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/builtin/quaternion.rs#L52-L65"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"is_builtin_method_excluded ignores its parameters and always returns false; the entire builtin-method codegen-exclusion path is a no-op kept only for the signature.","fix":"Keep but document prominently, or inline `false` at call sites until a real exclusion is needed.","locations":[{"ref":"godot-codegen/src/special_cases/codegen_special_cases.rs:16-20","code":"   16 | pub(crate) fn is_builtin_method_excluded(_method: &JsonBuiltinMethod) -> bool {\n   17 |     // Prior to Godot 4.2, builtin varargs (method.is_vararg) weren't supported, but that's now our minimum supported version.\n   18 | \n   19 |     false\n   20 | }","lines":5,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-codegen/src/special_cases/codegen_special_cases.rs#L16-L20"}]},
{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"`ErrorPrintLevel::Reduced` is documented as 'Reserved for future use' and is never produced or matched anywhere; `has_error_print_level` only distinguishes Normal vs lower. It is dead today.","fix":"Remove the unused variant until it is actually wired up, or add the call site that sets it.","locations":[{"ref":"godot-core/src/private.rs:59-64","code":"   59 |         Normal = 2,\n   60 |         /// Reserved for future use; intended for `try_` call sites where errors are expected and printing is noisy.\n   61 |         Reduced = 1,\n   62 |         /// No error printing; used during `expect_panic` in tests.\n   63 |         Silent = 0,\n   64 |     }","lines":6,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/private.rs#L59-L64"}]},
{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"`rebuild_gd()` is explicitly marked 'Currently unused' and has no callers; the only reference is a commented-out line in signal_object.rs. Dead code retained speculatively.","fix":"Remove `rebuild_gd` and the stale commented reference, or restore the use site.","locations":[{"ref":"godot-core/src/private.rs:612-618","code":"  612 | // Currently unused; implemented due to temporary need and may come in handy.\n  613 | pub fn rebuild_gd(object_ref: &classes::Object) -> Gd<classes::Object> {\n  614 |     let ptr = object_ref.__object_ptr();\n  615 | \n  616 |     // SAFETY: ptr comes from valid internal API (and is non-null, so unwrap in from_obj_sys won't fail).\n  617 |     unsafe { Gd::from_obj_sys(ptr) }\n  618 | }","lines":7,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/private.rs#L612-L618"},{"ref":"godot-core/src/signal/signal_object.rs:56","code":"   56 |             // SignalObject::Internal { obj_mut } => crate::private::rebuild_gd(*obj_mut),","lines":1,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/signal/signal_object.rs#L56"}]},
{"id":"DEAD_6","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"A large block of commented-out code (`extract_hint_attribute` / `GodotApiHints`) and several commented-out `max_visibility`/`vis_classified` lines remain in the source. The `SignalVisibility` enum + ordering is fully implemented and unit-tested (signal.rs) but its result is discarded (`let Some(_vis_classified) = ...`), only used to validate visibility. This is leftover scaffolding for an abandoned approach, kept around per the comments.","fix":"Remove the dead commented-out code (or move it to a tracked issue/branch) and either use `vis_classified` or drop the unused ordering machinery.","locations":[{"ref":"godot-macros/src/class/data_models/inherent_impl.rs:237-252","code":"  237 | /* Re-enable if we allow controlling declarative macros for signals (base_field_macro, visibility_macros).\n  238 | fn extract_hint_attribute(impl_block: &mut venial:: Impl) -> ParseResult<GodotApiHints> {\n  239 |     // #[hint(has_base_field = BOOL)]\n  240 |     let has_base_field;\n  241 |     if let Some(mut hints) = KvParser::parse_remove(&mut impl_block.attributes, \"hint\")? {\n  242 |         has_base_field = hints.handle_bool(\"has_base_field\")?;\n  243 |     } else {\n  244 |         has_base_field = None;\n  245 |     }\n  246 | \n  247 |     // #[hint(class_visibility = pub(crate))]\n  248 |     // ...\n  249 | \n  250 |     Ok(GodotApiHints { has_base_field })\n  251 | }\n  252 | */","lines":16,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-macros/src/class/data_models/inherent_impl.rs#L237-L252"},{"ref":"godot-macros/src/class/data_models/signal.rs:173-179","code":"  173 |         let Some(_vis_classified) = SignalVisibility::try_parse(vis_marker.as_ref()) else {\n  174 |             return bail!(\n  175 |                 vis_marker,\n  176 |                 \"invalid visibility `{}` for #[signal]; supported are `pub`, `pub(crate)`, `pub(super)` and private (no visibility marker)\",\n  177 |                 vis_marker.to_token_stream().to_string()\n  178 |             );\n  179 |         };","lines":7,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-macros/src/class/data_models/signal.rs#L173-L179"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"Misleading comment in `PackedArray::bsearch`. The comment claims 'bsearch in Godot requires mutable access ... We cast away the const-ness', but the code takes `&self`, obtains `self.as_inner()` (which does not cast away const here), and never performs any const-cast. The comment describes behavior that the code does not implement and may confuse maintainers about aliasing/mutation guarantees.","fix":"Remove or rewrite the comment to reflect that `bsearch` operates through a shared reference and performs no const-cast.","locations":[{"ref":"godot-core/src/builtin/collections/packed_array.rs:327-333","code":"  327 |     pub fn bsearch(&self, value: impl AsArg<T>) -> usize {\n  328 |         // Note: bsearch in Godot requires mutable access but doesn't actually modify the array\n  329 |         // We cast away the const-ness as this is a Godot API limitation\n  330 | \n  331 |         let inner = self.as_inner();\n  332 |         to_usize(T::op_bsearch(inner, value.into_arg(), true))\n  333 |     }","lines":7,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/builtin/collections/packed_array.rs#L327-L333"}]},

{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The destruction-order comment for Rust-triggered drop is truncated mid-sentence: it lists step '1.' then '2.' with no text after it. The reader is left without the intended explanation of the Rust-side destruction order, which is exactly the kind of subtle lifetime detail this comment exists to document.","fix":"Complete the comment, e.g. '2. InstanceStorage drop runs T's destructor (incl. Base<T>, which is ManuallyDrop and a no-op).' Or remove the dangling '2.' if no further steps are intended.","locations":[{"ref":"godot-core/src/obj/base.rs:43-45","code":"   43 |     // When triggered by Rust (Gd::drop on last strong ref), it's as follows:\n   44 |     // 1.   Gd<T>  -- triggers InstanceStorage destruction\n   45 |     // 2.","lines":3,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/obj/base.rs#L43-L45"}]},

t have .as_object_arg().\n  269 |             let FnParamTokens {\n  270 |                 arg_exprs: arg_names_without_asarg,\n  271 |                 ..\n  272 |             } = make_params_exprs(sig.params().iter(), FnKind::DelegateTry);\n  273 | \n  274 |             quote! {\n  275 |                 #maybe_deprecated\n  276 |                 #maybe_specific_doc\n  277 |                 #maybe_godot_doc\n  278 |                 /// # Panics\n  279 |                 /// This is a _varcall_ method, meaning parameters and return values are passed as `Variant`.\n  280 |                 /// It can detect call failures and will panic in such a case.\n  281 |                 #maybe_safety_doc\n  282 |                 #vis #maybe_unsafe fn #primary_fn_name (\n  283 |                     #receiver_param\n  284 |                     #( #params, )*\n  285 |                     varargs: &[Variant]\n  286 |                 ) #return_decl {\n  287 |                     Self::#try_fn_name(self, #( #arg_names_without_asarg, )* varargs)\n  288 |                         .unwrap_or_else(|e| panic!(\"{e}\"))\n  289 |                 }\n  290 | \n  291 |                 #maybe_deprecated\n  292 |                 /// # Return type\n  293 |                 /// This is a _varcall_ method, meaning parameters and return values are passed as `Variant`.\n  294 |                 /// It can detect call failures and will return `Err` in such a case.\n  295 |                 #maybe_safety_doc\n  296 |                 #vis #maybe_unsafe fn #try_fn_name(\n  297 |                     #receiver_param\n  298 |                     #( #params, )*\n  299 |                     varargs: &[Variant]\n  300 |                 ) #try_return_decl {\n  301 |                     #call_sig_decl\n  302 | \n  303 |                     let args = (#( #arg_names, )*);\n  304 | \n  305 |                     unsafe {\n  306 |                         #varcall_invocation\n  307 |                     }\n  308 | {"id":"DUP_4","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"The bounding-box-vs-transform 'apply' and 'apply inverse' algorithms are duplicated nearly verbatim between `Transform2D` (Rect2) and `Transform3D` (Aabb): the min/max accumulation over transformed corners in `Mul<Rect2>`/`XformInv<Rect2>` mirrors `Mul<Aabb>`/`XformInv<Aabb>` with only the extra Z axis and vertex list differing. Same for the per-component `Mul<real>`, `affine_inverse`, `orthonormalized`, `translated*`, `scaled*`, `rotated*` families which are structurally identical across the two transform types.","fix":"Extract a shared generic helper (over a vertex iterator producing min/max) for the AABB/Rect transform routines to remove the parallel implementations and the risk of fixing a bug in one but not the other.","locations":[{"ref":"godot-core/src/builtin/matrices/transform2d.rs:382-431","code":"  382 | impl Mul<Rect2> for Transform2D {\n  383 |     type Output = Rect2;\n  384 | \n  385 |     /// Transforms each coordinate in `rhs.position` and `rhs.end()` individually by this transform, then\n  386 |     /// creates a `Rect2` containing all of them.\n  387 |     fn mul(self, rhs: Rect2) -> Self::Output {\n  388 |         // https://web.archive.org/web/20220317024830/https://dev.theomader.com/transform-bounding-boxes/\n  389 |         let xa = self.a * rhs.position.x;\n  390 |         let xb = self.a * rhs.end().x;\n  391 | \n  392 |         let ya = self.b * rhs.position.y;\n  393 |         let yb = self.b * rhs.end().y;\n  394 | \n  395 |         let position = Vector2::coord_min(xa, xb) + Vector2::coord_min(ya, yb);\n  396 |         let end = Vector2::coord_max(xa, xb) + Vector2::coord_max(ya, yb);\n  397 |         Rect2::new(position + self.origin, end - position)\n  398 |     }\n  399 | }\n  400 | \n  401 | impl XformInv<Rect2> for Transform2D {\n  402 |     /// Inversely transforms (multiplies) the given [`Rect2`] by this [`Transform2D`] transformation matrix, under the assumption that the transformation basis is orthonormal (i.e. rotation/reflection is fine, scaling/skew is not).\n  403 |     ///\n  404 |     /// For transforming by inverse of an affine transformation (e.g. with scaling) `transform.affine_inverse() * vector` can be used instead. See: [`Transform2D::affine_inverse()`].\n  405 |     ///\n  406 |     /// _Godot equivalent: `rect2 * transform` or `transform.inverse() * rect2`_\n  407 |     fn xform_inv(&self, rhs: Rect2) -> Rect2 {\n  408 |         // https://web.archive.org/web/20220317024830/https://dev.theomader.com/transform-bounding-boxes/\n  409 |         // Same as Godot's `Transform2D::xform_inv` but omits unnecessary `Rect2::expand_to`.\n  410 |         // There is probably some more clever way to do that.\n  411 | \n  412 |         // Use the first point initialize our min/max.\n  413 |         let start = self.xform_inv(rhs.position);\n  414 |         // `min` is position of our aabb, `max` is the farthest vertex.\n  415 |         let (mut min, mut max) = (start, start);\n  416 | \n  417 |         let vertices = [\n  418 |             Vector2::new(rhs.position.x, rhs.position.y + rhs.size.y),\n  419 |             rhs.end(),\n  420 |             Vector2::new(rhs.position.x + rhs.size.x, rhs.position.y),\n  421 |         ];\n  422 | \n  423 |         for v in vertices {\n  424 |             let transformed = self.xform_inv(v);\n  425 |             min = Vector2::coord_min(min, transformed);\n  426 |             max = Vector2::coord_max(max, transformed);\n  427 |         }\n  428 | \n  429 |         Rect2::new(min, max - min)\n  430 |     }\n  431 | }","lines":50,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/builtin/matrices/transform2d.rs#L382-L431"},{"ref":"godot-core/src/builtin/matrices/transform3d.rs:331-406","code":"  331 | impl Mul<Aabb> for Transform3D {\n  332 |     type Output = Aabb;\n  333 | \n  3 {"id":"DUP_5","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"TransientStringNameOrd's Ord::cmp implementation duplicates the op_less/Less/Greater/Equal comparison logic already provided generically by impl_builtin_traits_inner!(Ord ...) in macros.rs. The only difference is the extra inconsistency panic in the else branch. This is a ~20-line near-duplicate of the macro body.","fix":"Factor the shared op_less comparison into a reusable helper used by both the macro and TransientStringNameOrd, or generate the body via the macro and only customize the equal/panic tail.","locations":[{"ref":"godot-core/src/builtin/strings/string_name.rs:422-448","code":"  422 | impl Ord for TransientStringNameOrd<'_> {\n  423 |     fn cmp(&self, other: &Self) -> std::cmp::Ordering {\n  424 |         // SAFETY: builtin operator provided by Godot.\n  425 |         let op_less = |lhs, rhs| unsafe {\n  426 |             let mut result = false;\n  427 |             let lifecycle = sys::thread_safe_lifecycle();\n  428 |             (lifecycle.string_name_operator_less)(lhs, rhs, result.sys_mut());\n  429 |             result\n  430 |         };\n  431 | \n  432 |         let self_ptr = self.0.sys();\n  433 |         let other_ptr = other.0.sys();\n  434 | \n  435 |         if op_less(self_ptr, other_ptr) {\n  436 |             std::cmp::Ordering::Less\n  437 |         } else if op_less(other_ptr, self_ptr) {\n  438 |             std::cmp::Ordering::Greater\n  439 |         } else if self.eq(other) {\n  440 |             std::cmp::Ordering::Equal\n  441 |         } else {\n  442 |             panic!(\n  443 |                 \"Godot provides inconsistent StringName ordering for \\\"{}\\\" and \\\"{}\\\"\",\n  444 |                 self.0, other.0\n  445 |             );\n  446 |         }\n  447 |     }\n  448 | }","lines":27,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/builtin/strings/string_name.rs#L422-L448"},{"ref":"godot-core/src/builtin/macros.rs:69-94","code":"   69 |     ( Ord for $Type:ty => $gd_method:ident, $lifecycle:path ) => {\n   70 |         impl Ord for $Type {\n   71 |             #[inline]\n   72 |             fn cmp(&self, other: &Self) -> std::cmp::Ordering {\n   73 |                 let op_less = |lhs, rhs| unsafe {\n   74 |                     let mut result = false;\n   75 |                     ($lifecycle().$gd_method)(lhs, rhs, result.sys_mut());\n   76 |                     result\n   77 |                 };\n   78 | \n   79 |                 if op_less(self.sys(), other.sys()) {\n   80 |                     std::cmp::Ordering::Less\n   81 |                 } else if op_less(other.sys(), self.sys()) {\n   82 |                     std::cmp::Ordering::Greater\n   83 |                 } else {\n   84 |                     std::cmp::Ordering::Equal\n   85 |                 }\n   86 |             }\n   87 |         }\n   88 |         impl PartialOrd for $Type {\n   89 |             #[inline]\n   90 |             fn partial_cmp(&self, other: &Self) -> Option<std::cmp::Ordering> {\n   91 |                 Some(self.cmp(other))\n   92 |             }\n   93 |         }\n   94 |     };","lines":26,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/builtin/macros.rs#L69-L94"}]},
{"id":"DUP_6","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"The object-argument `AsArg` impls duplicate large near-identical blocks. The `IS_SAME_CLASS` transmute-or-clone-upcast `into_arg` body is copy-pasted between `&Gd<T>` and `&DynGd<T,D>` (and their Option variants), and the `into_ffi_arg` bodies are repeated verbatim across at least six impls (`{ let arg = ObjectArg::from_gd(self); FfiArg::FfiObject(arg) }` / the `from_option_gd` variant). This is brittle: a fix to the upcast/transmute logic must be applied in many places.","fix":"Extract shared helpers (e.g. a free fn for the IS_SAME_CLASS transmute-or-upcast, and one for the ObjectArg short-circuit) and call them from each impl, or generate the impls via a macro keyed on Gd/DynGd.","locations":[{"ref":"godot-core/src/meta/args/as_arg.rs:147-207","code":"  147 | impl<T, Base> AsArg<Gd<Base>> for &Gd<T>\n  148 | where\n  149 |     T: Inherits<Base>,\n  150 |     Base: GodotClass,\n  151 | {\n  152 |     //noinspection RsConstantConditionIf - false positive in IDE for `T::IS_SAME_CLASS`.\n  153 |     fn into_arg<'arg>(self) -> CowArg<'arg, Gd<Base>>\n  154 |     where\n  155 |         Self: 'arg,\n  156 |     {\n  157 |         if T::IS_SAME_CLASS {\n  158 |             // SAFETY: T == Base, so &Gd<T> can be treated as &Gd<Base>.\n  159 |             let gd_ref = unsafe { std::mem::transmute::<&Gd<T>, &Gd<Base>>(self) };\n  160 |             CowArg::Borrowed(gd_ref)\n  161 |         } else {\n  162 |             // Different types: clone and upcast. May incur ref-count increment for RefCounted objects, but the common path\n  163 |             // of FFI passing is already optimized.\n  164 |             CowArg::Owned(self.clone().upcast())\n  165 |         }\n  166 |     }\n  167 | \n  168 |     fn into_ffi_arg<'arg>(self) -> FfiArg<'arg, Gd<Base>>\n  169 |     where\n  170 |         Self: 'arg,\n  171 |     {\n  172 |         let arg = ObjectArg::fr {"id":"ARCH_4","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"`derive_godot_class.rs` mixes several distinct responsibilities in one 1000+ line file: struct/field attribute parsing, init-strategy logic, decl-macro generation (visibility/base-field/deny-init), accessor type-checks, and a hardcoded heuristic for editor/virtual-extension base classes (`is_class_virtual_extension`, `is_class_editor_only`). The latter two functions even carry TODO/`Should be moved to godot-codegen` comments. The hardcoded class-name lists also risk drifting out of sync with the engine's actual `api_type` metadata.","fix":"Move the editor-only/virtual-extension classification to godot-codegen (driven by `extension_api.json` `api_type`), as the TODOs note, and split the file's parsing vs. codegen concerns into submodules.","locations":[{"ref":"godot-macros/src/class/derive_godot_class.rs:1042-1067","code":" 1042 | /// Whether a class exists primarily for GDExtension to overload virtual methods.\n 1043 | // See post_validate(). Should be moved to godot-codegen > special_cases.rs.\n 1044 | fn is_class_virtual_extension(godot_class_name: &str) -> bool {\n 1045 |     // Heuristic: suffix, with some exceptions.\n 1046 |     // Generally, a rule might also be \"there is another class without that suffix\", however that doesn't apply to e.g. OpenXRAPIExtension.\n 1047 | \n 1048 |     match godot_class_name {\n 1049 |         \"GDExtension\" => false,\n 1050 | \n 1051 |         _ => godot_class_name.ends_with(\"Extension\"),\n 1052 |     }\n 1053 | }\n 1054 | \n 1055 | /// Whether a class exists primarily as a plugin for the editor.\n 1056 | // See post_validate(). Should be moved to godot-codegen > special_cases.rs.\n 1057 | // TODO: This information is available in extension_api.json under classes.*.api_type and should be taken from there.\n 1058 | fn is_class_editor_only(godot_class_name: &str) -> bool {\n 1059 |     match godot_class_name {\n 1060 |         \"FileSystemDock\" | \"ScriptCreateDialog\" | \"ScriptEditor\" | \"ScriptEditorBase\" => true,\n 1061 |         _ => {\n 1062 |             (godot_class_name.starts_with(\"ResourceImporter\")\n 1063 |                 && godot_class_name != \"ResourceImporter\")\n 1064 |                 || godot_class_name.starts_with(\"Editor\")\n 1065 |         }\n 1066 |     }\n 1067 | }","lines":26,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-macros/src/class/derive_godot_class.rs#L1042-L1067"},{"ref":"godot-macros/src/class/derive_godot_class.rs:1012-1040","code":" 1012 | /// Checks more logical combinations of attributes.\n 1013 | fn post_validate(base_ty: &Ident, is_tool: bool) -> ParseResult<()> {\n 1014 |     // TODO: this should be delegated to either:\n 1015 |     // a) the type system: have a trait IsTool which is implemented when #[class(tool)] is set.\n 1016 |     //    Then, for certain base classes, require a tool bound (e.g. generate method `fn type_check<T: IsTool>()`).\n 1017 |     //    This would also allow moving the logic to godot-codegen.\n 1018 |     // b) a runtime check in class.rs > register_class_raw() and validate_class_constraints().\n 1019 | \n 1020 |     let class_name = base_ty.to_string();\n 1021 | \n 1022 |     let is_class_extension = is_class_virtual_extension(&class_name);\n 1023 |     let is_class_editor = is_class_editor_only(&class_name);\n 1024 | \n 1025 |     if is_class_extension && !is_tool {\n 1026 |         return bail!(\n 1027 |             base_ty,\n 1028 |             \"Base class `{}` is a virtual extension class, which runs in the editor and thus requires #[class(tool)].\",\n 1029 |             base_ty\n 1030 |         );\n 1031 |     } else if is_class_editor && !is_tool {\n 1032 |         return bail!(\n 1033 |             base_ty,\n 1034 |             \"Base class `{}` is an editor-only class and thus requires #[class(tool)].\",\n 1035 |             base_ty\n 1036 |         );\n 1037 |     }\n 1038 | \n 1039 |     Ok(())\n 1040 | }","lines":29,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-macros/src/class/derive_godot_class.rs#L1012-L1040"}]},
{"id":"ARCH_5","type":"architecture","type_label":"Architecture","severity":"negligible","difficulty":"medium","description":"`Array::assume_type` and `Dictionary::assume_type` manually move individual fields and call `mem::forget(self)`. The in-code TODO warns this is fragile: adding a new field requires remembering to move it here, or it silently leaks / is left default-constructed. This is a maintenance landmine for an unsafe FFI type.","fix":"Use `ManuallyDrop<Self>` + `ptr::read` of each field, or make the type `#[repr(C)]` and `transmute`, so adding a field cannot silently break the move.","locations":[{"ref":"godot-core/src/builtin/collections/array.rs:936-952","code":"  936 |     // TODO(v0.6): fragile manual field move + mem::forget; if a field is added, it must be moved here too.\n  937 |     // Consider transmute (requires #[repr(C)]) or ManuallyDrop + ptr::read. Same issue in Dictionary::assume_type.\n  938 |     pub(super) unsafe fn assume_type<U: Element>(self) -> Array<U> {\n  939 |         let result = Array::<U> {\n  940 |             opaque: self.opaque,\n  941 |             _phantom: PhantomData,\n  942 |             cached_element_type: OnceCell::new(),\n  943 |         };\n  944 | \n  945 |         // Transfer cached type to avoid redundant FFI calls.\n  946 |         ElementType::transfer_cache(&self.cached_element_type, &result.cached_element_type);\n  947 | \n  948 |         // Prevent drop of self since we moved opaque.\n  949 |         std::mem::forget(self);\n  950 | \n  951 |         result\n  952 |     }","lines":17,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/builtin/collections/array.rs#L936-L952"}]},
{"id":"ARCH_6","type":"architecture","type_label":"Architecture","severity":"negligible","difficulty":"medium","description":"`varcall_return_checked` takes `Result<R, ()>` with a `// TODO Err should be custom CallError enum` and, on the `Err(())` path, fabricates a generic `GDEXTENSION_CALL_ERROR_INVALID_ARGUMENT` with no contextual information. The error reason is entirely lost, so callers/users get an opaque 'invalid argument' with no clue what failed.","fix":"Replace the `Result<R, ()>` with a real error type carrying a reason (as the TODO notes) so the failure can be surfaced in the `CallError`/Godot error output.","locations":[{"ref":"godot-core/src/meta/signature.rs:518-533","code":"  518 | pub(crate) unsafe fn varcall_return_checked<R: ToGodot>(\n  519 |     ret_val: Result<R, ()>, // TODO Err should be custom CallError enum\n  520 |     ret: sys::GDExtensionVariantPtr,\n  521 |     err: *mut sys::GDExtensionCallError,\n  522 |     call_ctx: &CallContext,\n  523 | ) -> CallResult<()> {\n  524 |     if let Ok(ret_val) = ret_val {\n  525 |         unsafe { varcall_return(ret_val, ret, err, call_ctx)? };\n  526 |     } else {\n  527 |         unsafe {\n  528 |             *err = sys::default_call_error();\n  529 |             (*err).error = sys::GDEXTENSION_CALL_ERROR_INVALID_ARGUMENT;\n  530 |         }\n  531 |     }\n  532 |     Ok(())\n  533 | }","lines":16,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/meta/signature.rs#L518-L533"}]},
{"id":"OTHER_1","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"Generated `FromGodot` impls for derived enums bind a match-arm variable `other` that is never used (the body deliberately uses `via` instead, per the inline comment). The generated `match` therefore emits an `unused_variable: other` warning in downstream user crates. The neighboring `#[allow(unused_parens)]` does not cover this, and no `#[allow(unused_variables)]` is present.","fix":"Rename the binding to `_other` (or `_`) in the generated match arm, or add `#[allow(unused_variables)]` to the generated `try_from_godot` fn.","locations":[{"ref":"godot-macros/src/derive/derive_from_godot.rs:96-102","code":"   96 |                 match via {\n   97 |                     #(\n   98 |                         #ord_variables => Ok(#name::#names),\n   99 |                     )*\n  100 |                     // Pass `via` and not `other`, to retain debug info of original type.\n  101 |                     other => Err(::godot::meta::error::ConvertError::with_error_value(#bad_variant_error, via))\n  102 |                 }","lines":7,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-macros/src/derive/derive_from_godot.rs#L96-L102"},{"ref":"godot-macros/src/derive/derive_from_godot.rs:117-123","code":"  117 |                 match via.to_string().as_str() {\n  118 |                     #(\n  119 |                         #names_str => Ok(#name::#names),\n  120 |                     )*\n  121 |                     // Pass `via` and not `other`, to retain debug info of original type.\n  122 |                     other => Err(::godot::meta::error::ConvertError::with_error_value(#bad_variant_error, via))\n  123 |                 }","lines":7,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-macros/src/derive/derive_from_godot.rs#L117-L123"}]},
{"id":"OTHER_2","type":"other","type_label":"Other","severity":"negligible","difficulty":"easy","description":"Inconsistency between sibling helpers: to_be_words() is `const fn` but its inverse from_be_words() is a plain fn, despite being equally const-able (only shifts/ors on u16/u64). This blocks const use of color->u64 packing for no reason.","fix":"Mark from_be_words() as `const fn` for parity with to_be_words().","locations":[{"ref":"godot-core/src/builtin/color.rs:541-544","code":"  541 | /// Packs four `u16` words into a `u64` in big-endian order.\n  542 | fn from_be_words(words: [u16; 4]) -> u64 {\n  543 |     (words[0] as u64) << 48 | (words[1] as u64) << 32 | (words[2] as u64) << 16 | (words[3] as u64)\n  544 | }","lines":4,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/builtin/color.rs#L541-L544"},{"ref":"godot-core/src/builtin/color.rs:546-556","code":"  546 | /// Unpacks a `u64` into four `u16` words in big-endian order.\n  547 | const fn to_be_words(mut u: u64) -> [u16; 4] {\n  548 |     let w = (u & 0xffff) as u16;\n  549 |     u >>= 16;\n  550 |     let z = (u & 0xffff) as u16;\n  551 |     u >>= 16;\n  552 |     let y = (u & 0xffff) as u16;\n  553 |     u >>= 16;\n  554 |     let x = (u & 0xffff) as u16;\n  555 |     [x, y, z, w]\n  556 | }","lines":11,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/builtin/color.rs#L546-L556"}]},
{"id":"OTHER_3","type":"other","type_label":"Other","severity":"negligible","difficulty":"medium","description":"Minor API inconsistency: GString::len() uses `.try_into().unwrap()` (panics on negative/overflow) while StringName::len() uses `as usize` on the same i64 length, silently wrapping a negative value. Lengths are non-negative in practice, but the two should behave identically; the `as usize` path would hide a contract violation instead of panicking.","fix":"Use the same conversion in both (prefer the checked `.try_into().expect(...)` form used elsewhere in NodePath counts).","locations":[{"ref":"godot-core/src/builtin/strings/gstring.rs:155-157","code":"  155 |     pub fn len(&self) -> usize {\n  156 |         self.as_inner().length().try_into().unwrap()\n  157 |     }","lines":3,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/builtin/strings/gstring.rs#L155-L157"},{"ref":"godot-core/src/builtin/strings/string_name.rs:139-141","code":"  139 |     pub fn len(&self) -> usize {\n  140 |         self.as_inner().length() as usize\n  141 |     }","lines":3,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/builtin/strings/string_name.rs#L139-L141"}]},
{"id":"OTHER_4","type":"other","type_label":"Other","severity":"negligible","difficulty":"medium","description":"static_sname! macro references the bare identifier `StringName` (StringName::__cstr_with_static) without a fully-qualified path, relying on the caller having `StringName` in scope. This is a macro hygiene hazard: the macro will fail to compile at call sites that have not imported StringName, unlike a properly path-qualified `$crate::builtin::StringName`.","fix":"Use `$crate::builtin::StringName::__cstr_with_static(...)` inside the macro instead of the bare `StringName`.","locations":[{"ref":"godot-core/src/builtin/strings/string_name.rs:510-519","code":"  510 | #[macro_export]\n  511 | macro_rules! static_sname {\n  512 |     ($str:literal) => {{\n  513 |         use std::sync::OnceLock;\n  514 | \n  515 |         let c_str: &'static std::ffi::CStr = $str;\n  516 |         static SNAME: OnceLock<StringName> = OnceLock::new();\n  517 |         SNAME.get_or_init(|| StringName::__cstr_with_static(c_str, true))\n  518 |     }};\n  519 | }","lines":10,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/builtin/strings/string_name.rs#L510-L519"}]},
{"id":"OTHER_5","type":"other","type_label":"Other","severity":"negligible","difficulty":"medium","description":"`PropertyInfo::new_from_sys` reads `ptr.hint.to_owned() as i32` while every other site casts `ptr.hint`/`usage` directly (`ptr.usage as u64`). `hint` is a plain `u32` field, so `.to_owned()` is a no-op copy that is inconsistent with the surrounding code and slightly misleading (suggests a borrow that doesn't exist).","fix":"Drop `.to_owned()` and write `PropertyHint::from_ord(ptr.hint as i32)` for consistency.","locations":[{"ref":"godot-core/src/registry/info/property_info.rs:309-313","code":"  309 |                 hint_info: PropertyHintInfo {\n  310 |                     hint: PropertyHint::from_ord(ptr.hint.to_owned() as i32),\n  311 |                     hint_string: GString::new_from_string_sys(ptr.hint_string),\n  312 |                 },\n  313 |                 usage: PropertyUsageFlags::from_ord(ptr.usage as u64),","lines":5,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/registry/info/property_info.rs#L309-L313"}]}
