<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"In the non-lazy make_method_table, when method_init_groups is non-empty, the code does last.method_inits.last().unwrap(). populate_class_methods guards empty groups (only pushes when !method_inits.is_empty()), but populate_builtin_methods pushes a MethodInitGroup unconditionally even when method_inits is empty (a builtin variant with an associated class but zero outbound methods). If such an empty group ends up last, .last().unwrap() panics at build time with no useful message. The class path proves the author knew empty groups must be excluded; the builtin path omits the same guard.","fix":"Guard the builtin group push the same way as classes: only push the group (and bump class_count) when !method_inits.is_empty(), or make the assertion robust against empty trailing groups.","locations":[{"ref":"godot-codegen/src/generator/method_tables.rs:320-328","code":"  320 |     if let Some(last) = method_init_groups.last() {\n  321 |         assert_eq!(\n  322 |             last.method_inits.last().unwrap().index,\n  323 |             method_count - 1,\n  324 |             \"last method should have highest index (table {table_name})\"\n  325 |         );\n  326 |     } else {\n  327 |         assert_eq!(method_count, 0, \"empty method table should have count 0\");\n  328 |     }","lines":9,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-codegen/src/generator/method_tables.rs#L320-L328"},{"ref":"godot-codegen/src/generator/method_tables.rs:604-609","code":"  604 |     table.method_init_groups.push(MethodInitGroup::new(\n  605 |         &builtin_class.name().godot_ty,\n  606 |         None, // load_builtin_method() doesn't need a StringName for the class, as it accepts the VariantType enum.\n  607 |         method_inits,\n  608 |     ));\n  609 |     table.class_count += 1;","lines":6,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-codegen/src/generator/method_tables.rs#L604-L609"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"Parsing a native-structure array-size field slices field_name[index+1 .. field_name.len()-1] assuming the '[' is followed by a matching ']' as the final character. For a malformed field like 'foo[' (index=3, len=4) the range is 4..3 which panics ('slice index starts at 4 but ends at 3'). Non-numeric bracket content silently yields None, which then trips the upstream .expect(\"Could not parse native_structures format field\"). This is parsed JSON whose shape can change across Godot versions.","fix":"Guard with field_name.ends_with(']') / locate the matching ']' via rfind(']'), only slice between brackets, and treat malformed input as a clean parse failure rather than a slice panic.","locations":[{"ref":"godot-codegen/src/generator/native_structures.rs:256-259","code":"  256 |             if let Some(index) = field_name.find('[') {\n  257 |                 array_size = Some(field_name[index + 1..field_name.len() - 1].parse().ok()?);\n  258 |                 field_name.truncate(index);\n  259 |             }","lines":4,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-codegen/src/generator/native_structures.rs#L256-L259"},{"ref":"godot-codegen/src/generator/native_structures.rs:123-124","code":"  123 |     let fields = parse_native_structures_format(&structure.format)\n  124 |         .expect(\"Could not parse native_structures format field\");","lines":2,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-codegen/src/generator/native_structures.rs#L123-L124"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"Godot version components are parsed into `u8`. A version string with a segment > 255 makes the regex-group `from_str::<u8>` fail; in the prebuilt path `version[0].parse().unwrap()` / `version[1].parse().unwrap()` panic directly with no context. Effectively unreachable for real Godot, but `u8` is an unnecessarily tight type for an externally-provided version string and the unwrap gives no diagnostic.","fix":"Widen the version fields to `u16`/`u32`, or replace the `.unwrap()`s with `.expect(\"context\")`.","locations":[{"ref":"godot-bindings/src/godot_version.rs:45-52","code":"   45 |     Ok(GodotVersion {\n   46 |         full_string: caps.get(0).unwrap().as_str().trim().to_string(),\n   47 |         major: cap(&caps, \"major\")?.unwrap(),\n   48 |         minor: cap(&caps, \"minor\")?.unwrap(),\n   49 |         patch: cap(&caps, \"patch\")?.unwrap_or(0),\n   50 |         status: cap(&caps, \"status\")?.unwrap(),\n   51 |         custom_rev: cap(&caps, \"custom_rev\")?,\n   52 |     })","lines":8,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-bindings/src/godot_version.rs#L45-L52"},{"ref":"godot-bindings/src/lib.rs:157-162","code":"  157 |             major: version[0].parse().unwrap(),\n  158 |             minor: version[1].parse().unwrap(),\n  159 |             patch: version\n  160 |                 .get(2)\n  161 |                 .and_then(|patch| patch.parse().ok())\n  162 |                 .unwrap_or(0),","lines":6,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-bindings/src/lib.rs#L157-L162"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`MutGuard::deref`/`deref_mut` assert `self.count == current_mut_count` on every single dereference, calling `CellState::borrow_state` (an unsafe pointer round-trip) and `std::any::type_name` formatting setup each time. This is a hot path (every `*guard` access). The assertion is documented as a best-effort check that 'should never be triggered'; running it on every deref is wasteful, and if a logic bug ever did trip it the guard panics rather than failing gracefully.","fix":"Gate the count assertion behind `debug_assertions` (or a strict-checks cfg) so release builds skip the per-deref overhead.","locations":[{"ref":"godot-cell/src/guards.rs:122-149","code":"  122 | impl<T> Deref for MutGuard<'_, T> {\n  123 |     type Target = T;\n  124 | \n  125 |     fn deref(&self) -> &Self::Target {\n  126 |         // SAFETY: There can't be any other active reference to CellState.\n  127 |         let count = unsafe { CellState::borrow_state(self.state) }.mut_count();\n  128 |         // This is just a best-effort error check. It should never be triggered.\n  129 |         assert_eq!(\n  130 |             self.count,\n  131 |             count,\n  132 |             \"\\\n  133 |             attempted to access a non-current mutable borrow of type: `{}`. \\n\\\n  134 |             current count: {}\\n\\\n  135 |             value pointer: {:p}\\n\\\n  136 |             attempted access count: {}\\n\\\n  137 |             **this is a bug, please report it**\\\n  138 |             \",\n  139 |             std::any::type_name::<T>(),\n  140 |             self.count,\n  141 |             self.value,\n  142 |             count\n  143 |         );\n  144 | \n  145 |         // SAFETY: It is safe to call `as_ref()` on value when we have a `&self` reference because of the\n  146 |         // safety invariants of `new`.\n  147 |         unsafe { self.value.as_ref() }\n  148 |     }\n  149 | }","lines":28,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-cell/src/guards.rs#L122-L149"},{"ref":"godot-cell/src/guards.rs:151-177","code":"  151 | impl<T> DerefMut for MutGuard<'_, T> {\n  152 |     fn deref_mut(&mut self) -> &mut Self::Target {\n  153 |         // SAFETY: There can't be any other active reference to CellState.\n  154 |         let count = unsafe { CellState::borrow_state(self.state) }.mut_count();\n  155 |         // This is just a best-effort error check. It should never be triggered.\n  156 |         assert_eq!(\n  157 |             self.count,\n  158 |             count,\n  159 |             \"\\\n  160 |             attempted to access a non-current mutable borrow of type: `{}`. \\n\\\n  161 |             current count: {}\\n\\\n  162 |             value pointer: {:p}\\n\\\n  163 |             attempted access count: {}\\n\\\n  164 |             **this is a bug, please report it**\\\n  165 |             \",\n  166 |             std::any::type_name::<T>(),\n  167 |             self.count,\n  168 |             self.value,\n  169 |             count\n  170 |         );\n  171 | \n  172 |         // SAFETY:\n  173 |         // It is safe to call `as_mut()` on value when we have a `&mut self` reference because of the safety\n  174 |         // invariants of `new`.\n  175 |         unsafe { self.value.as_mut() }\n  176 |     }\n  177 | }","lines":27,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-cell/src/guards.rs#L151-L177"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"During engine teardown on Godot < 4.5, `FallibleSignalFuture::drop` -> `is_engine_exiting()` calls `Engine::singleton().get_main_loop()` and casts/queries it. This runs inside a `Drop`, on the teardown path, and accesses engine singletons; if the Engine singleton or main loop is already unavailable at that exact moment the singleton/cast access can panic, and a panic escaping `Drop` aborts the process. The newer (4.5+) path uses only an atomic flag and is safe; the pre-4.5 heuristic reintroduces engine access in a destructor.","fix":"Wrap the pre-4.5 `is_engine_exiting()` engine access in `handle_panic` (as the rest of `FallibleSignalFuture::drop` already does for object access), or gate the whole heuristic behind a check that the bindings are still at a usable init level.","locations":[{"ref":"godot-core/src/task/async_runtime.rs:279-291","code":"  279 |     #[cfg(before_api = \"4.5\")]\n  280 |     {\n  281 |         use crate::obj::Singleton as _;\n  282 | \n  283 |         match crate::classes::Engine::singleton().get_main_loop() {\n  284 |             // No main loop: the engine is shutting down (or has not started yet, in which case no signal future can be pending).\n  285 |             None => true,\n  286 |             Some(main_loop) => match main_loop.try_cast::<crate::classes::SceneTree>() {\n  287 |                 Ok(tree) => tree.get_root().is_none(),\n  288 |                 Err(_) => false,\n  289 |             },\n  290 |         }\n  291 |     }","lines":13,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/task/async_runtime.rs#L279-L291"},{"ref":"godot-core/src/task/futures.rs:169-171","code":"  169 |         if crate::task::is_engine_exiting() {\n  170 |             return;\n  171 |         }","lines":3,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/task/futures.rs#L169-L171"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`process_godot_fns` replaces signal items from an impl block via index bookkeeping, but `handle_regular_virtual_fn` in interface_trait_impl.rs uses `panic!(\"unexpected parameter type: {new_params:?}\")` and `.expect(\"parameter had no name\")` / `.expect(\"type had no span\")` when applying the f32->f64 substitution. These are reachable on syntactically unusual but parseable user signatures (e.g. a virtual `process` whose modified parameter is not a plain typed param), producing an ICE-style panic instead of a clean compile error.","fix":"Convert these panics/expects into `bail!` with the function/parameter span so malformed input yields a clean compile_error!.","locations":[{"ref":"godot-macros/src/class/data_models/interface_trait_impl.rs:475-489","code":"  475 |             for (index, new_ty) in signature_info.modified_param_types.iter() {\n  476 |                 let venial::FnParam::Typed(typed) = &mut new_params.inner[*index].0 else {\n  477 |                     panic!(\"unexpected parameter type: {new_params:?}\");\n  478 |                 };\n  479 | \n  480 |                 // Capture original type span before replacing (e.g. the user's `f32`).\n  481 |                 original_ty_span = Some(typed.ty.span());\n  482 | \n  483 |                 typed.ty = new_ty.clone();\n  484 |                 param_name = Some(typed.name.clone());\n  485 |             }\n  486 | \n  487 |             let original_body = &original_method.body;\n  488 |             let param_name = param_name.expect(\"parameter had no name\");\n  489 |             let original_ty_span = original_ty_span.expect(\"type had no span\");","lines":15,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-macros/src/class/data_models/interface_trait_impl.rs#L475-L489"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`format_virtual_method_xml` panics (`panic!(...)`) when a virtual method in an `impl ITrait for MyClass` block is annotated with `@experimental` or `@deprecated` doc tags. This is user-controllable input (a doc comment), so a malformed/unsupported annotation produces an ICE-style proc-macro panic with no span, instead of a clean `compile_error!` pointing at the method.","fix":"Return a `ParseResult`/`bail!` with the method's span (threading the error out of `document_interface_trait_impl`) instead of `panic!`, so the user gets a localized compile error.","locations":[{"ref":"godot-macros/src/docs/extract_docs.rs:318-327","code":"  318 | fn format_virtual_method_xml(method: venial::Function) -> Option<String> {\n  319 |     let XmlParagraphs {\n  320 |         description_content,\n  321 |         deprecated_attr,\n  322 |         experimental_attr,\n  323 |     } = attribute_docs_to_xml_paragraphs(&method.attributes)?;\n  324 | \n  325 |     if !deprecated_attr.is_empty() || !experimental_attr.is_empty() {\n  326 |         panic!(\"Virtual methods can't be documented as neither `@experimental` nor `@deprecated`.\");\n  327 |     }","lines":10,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-macros/src/docs/extract_docs.rs#L318-L327"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"negligible","difficulty":"medium","description":"`ExtendBuffer::push` writes to `self.buf[self.len]` and increments `len` with no check that `len < N`. It relies entirely on callers (the `PackedArray::extend` loop) honoring `is_full()`. A future caller that forgets the `is_full()` guard would write out of bounds of the array (panic via index in debug, but the `MaybeUninit` write itself is the concern). The doc comment says 'Panics if buffer is full' but no such panic is coded for the `len == N` case writing at index N.","fix":"Add a debug assertion `sys::strict_assert!(self.len < N)` before the write, matching the documented contract.","locations":[{"ref":"godot-core/src/builtin/collections/extend_buffer.rs:42-45","code":"   42 |     fn push(&mut self, value: T) {\n   43 |         self.buf[self.len].write(value);\n   44 |         self.len += 1;\n   45 |     }","lines":4,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/builtin/collections/extend_buffer.rs#L42-L45"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"make_extra_constructors allocates Vec::with_capacity(constructors.len() - 2) twice. If ever reached with fewer than 2 constructors, this is an integer underflow (debug panic 'attempt to subtract with overflow'). Today the caller make_construct_fns indexes constructors[1] before calling this (panicking earlier if len<2), so the path is reachable only with len>=2, but the `- 2` is fragile and would produce an opaque panic message rather than a clear one.","fix":"Use constructors.len().saturating_sub(2) for the capacity hints (capacity is only a hint; this avoids a confusing underflow panic).","locations":[{"ref":"godot-codegen/src/generator/lifecycle_builtins.rs:166-167","code":"  166 |     let mut extra_decls = Vec::with_capacity(constructors.len() - 2);\n  167 |     let mut extra_inits = Vec::with_capacity(constructors.len() - 2);","lines":2,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-codegen/src/generator/lifecycle_builtins.rs#L166-L167"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"EnumeratorValue::to_i64 casts a Bitfield(u64) to i64 with `as` (the doc admits it 'may map some bitfield values to negative numbers'). find_index_enum_max_impl guards against bitfields, but to_i64 is also used by unsuffixed_lit, the general path for emitting bitfield literals. A bitfield value with bit 63 set (>= 2^63) would be emitted as a negative literal, generating wrong code. Latent: current Godot bitfields don't use bit 63, but the JSON value is unchecked external input.","fix":"In unsuffixed_lit, emit bitfield values via Literal::u64_unsuffixed(*i) directly rather than routing through to_i64(), so high-bit values aren't silently negated.","locations":[{"ref":"godot-codegen/src/models/domain/enums.rs:148-166","code":"  148 |     /// Converts `self` to an `i64`.\n  149 |     ///\n  150 |     /// This may map some bitfield values to negative numbers.\n  151 |     pub fn to_i64(&self) -> i64 {\n  152 |         // Conversion is safe because i64 is used in the original JSON.\n  153 |         match self {\n  154 |             EnumeratorValue::Enum(i) => *i as i64,\n  155 |             EnumeratorValue::Bitfield(i) => *i as i64,\n  156 |         }\n  157 |     }\n  158 | \n  159 |     /// This method is needed for platform-dependent types like raw `VariantOperator`, which can be `i32` or `u32`.\n  160 |     /// Do not suffix them.\n  161 |     ///\n  162 |     /// See also `BuiltinVariant::unsuffixed_ord_lit()`.\n  163 |     pub fn unsuffixed_lit(&self) -> Literal {\n  164 |         Literal::i64_unsuffixed(self.to_i64())\n  165 |     }\n  166 | }","lines":19,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-codegen/src/models/domain/enums.rs#L148-L166"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"Integer-vector `length()` computes `(self.length_squared() as real).sqrt()`, where `length_squared()` returns `i32` (sum of squares computed in `i32` via glam). For components with large magnitudes (e.g. ~46341 on a single axis, or smaller per-axis values in 3D/4D), the squared sum overflows `i32` and wraps before being cast to `real`, yielding a nonsensical (possibly negative -> NaN) length. `distance_squared_to` for integer vectors has the same exposure.","fix":"Compute integer length via the float glam type (`to_glam_real().length()`) or accumulate squares in `i64`/`real` before the sqrt, to avoid i32 overflow.","locations":[{"ref":"godot-core/src/builtin/vectors/vector_macros.rs:451-465","code":"  451 |             /// Returns the length (magnitude) of this vector.\n  452 |             #[inline]\n  453 |             pub fn length(self) -> real {\n  454 |                 // does the same as glam's length() but also works for integer vectors\n  455 |                 (self.length_squared() as real).sqrt()\n  456 |             }\n  457 | \n  458 |             /// Squared length (squared magnitude) of this vector.\n  459 |             ///\n  460 |             /// Runs faster than [`length()`][Self::length], so prefer it if you need to compare vectors or need the\n  461 |             /// squared distance for some formula.\n  462 |             #[inline]\n  463 |             pub fn length_squared(self) -> $Scalar {\n  464 |                 self.to_glam().length_squared()\n  465 |             }","lines":15,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/builtin/vectors/vector_macros.rs#L451-L465"},{"ref":"godot-core/src/builtin/vectors/vector_macros.rs:555-558","code":"  555 |         #[inline]\n  556 |         pub fn distance_squared_to(self, to: Self) -> i32 {\n  557 |             (to - self).length_squared() as i32\n  558 |         }","lines":4,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/builtin/vectors/vector_macros.rs#L555-L558"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`lower_bound`/`upper_bound` compute `n + 1` for excluded/included bounds on `i64` without overflow guarding. A range whose excluded start or included end is `i64::MAX` (reachable via `wrapped(..=i64::MAX)` or a `usize` range near `i64::MAX` on 64-bit) overflows: it panics in debug and wraps to `i64::MIN` in release, silently corrupting the (from, to) passed to Godot string APIs.","fix":"Use `n.saturating_add(1)` (or `checked_add` with an explicit clamp/error) for the excluded-start and included-end cases.","locations":[{"ref":"godot-core/src/meta/signed_range.rs:42-56","code":"   42 | fn lower_bound(bound: Bound<i64>) -> Option<i64> {\n   43 |     match bound {\n   44 |         Bound::Included(n) => Some(n),\n   45 |         Bound::Excluded(n) => Some(n + 1),\n   46 |         Bound::Unbounded => None,\n   47 |     }\n   48 | }\n   49 | \n   50 | fn upper_bound(bound: Bound<i64>) -> Option<i64> {\n   51 |     match bound {\n   52 |         Bound::Included(n) => Some(n + 1),\n   53 |         Bound::Excluded(n) => Some(n),\n   54 |         Bound::Unbounded => None,\n   55 |     }\n   56 | }","lines":15,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/meta/signed_range.rs#L42-L56"}]},
{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`<GFile as BufRead>::consume(amt)` computes `(self.last_buffer_size - amt) as i64`. If a caller passes `amt > last_buffer_size` (BufRead's contract says amt must not exceed the last `fill_buf` length, but nothing enforces it here), this is a `usize` subtraction that panics in debug and wraps in release, yielding a huge offset and an out-of-range seek. `last_buffer_size` is also stale if `consume` is called without a preceding `fill_buf`.","fix":"Clamp with `let amt = amt.min(self.last_buffer_size);` before computing the offset, and decrement `last_buffer_size` by the consumed amount.","locations":[{"ref":"godot-core/src/tools/gfile.rs:834-840","code":"  834 |     fn consume(&mut self, amt: usize) {\n  835 |         // Cursor is being moved by `FileAccess::get_buffer()` call, so we need to adjust it.\n  836 |         let offset = (self.last_buffer_size - amt) as i64;\n  837 |         let pos = SeekFrom::Current(-offset);\n  838 | \n  839 |         self.seek(pos).expect(\"failed to consume bytes during read\");\n  840 |     }","lines":7,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/tools/gfile.rs#L834-L840"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"make_notification_enum merges a class's notification constants with those of all base classes (extend, no dedup) and emits them both as enum variants with explicit discriminants (`SHOUT = ord`) and as From<i32> match arms. Nothing deduplicates by identifier or ordinal. Two notification constants in a hierarchy that share the same integer value produce duplicate explicit enum discriminants (a hard Rust compile error) and duplicate From<i32> match arms (unreachable_patterns). Whether it triggers depends on the exact extension_api.json for a given Godot version.","fix":"Deduplicate all_constants after merging base-class constants - by identifier, and assert/skip conflicting ordinals - before generating variants and match arms (e.g. order-preserving set keyed on the shout ident).","locations":[{"ref":"godot-codegen/src/generator/notifications.rs:73-92","code":"   73 |     // Collect all notification constants from current and base classes\n   74 |     let mut all_constants = all_constants.clone();\n   75 |     for base_name in all_bases {\n   76 |         if let Some(constants) = ctx.notification_constants(base_name) {\n   77 |             all_constants.extend(constants.iter().cloned());\n   78 |         }\n   79 |     }\n   80 | \n   81 |     let enum_name = ctx.notification_enum_name(class_name).name;\n   82 |     let doc_str = format!(\n   83 |         \"Notification type for class [`{c}`][crate::classes::{c}].\",\n   84 |         c = class_name.rust_ty\n   85 |     );\n   86 | \n   87 |     let mut notification_enumerators_shout = Vec::new();\n   88 |     let mut notification_enumerators_ord = Vec::new();\n   89 |     for (constant_ident, constant_value) in all_constants {\n   90 |         notification_enumerators_shout.push(constant_ident);\n   91 |         notification_enumerators_ord.push(constant_value);\n   92 |     }","lines":20,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-codegen/src/generator/notifications.rs#L73-L92"},{"ref":"godot-codegen/src/generator/notifications.rs:105-128","code":"  105 |         pub enum #enum_name {\n  106 |             #(\n  107 |                 #notification_enumerators_shout = #notification_enumerators_ord,\n  108 |             )*\n  109 | \n  110 |             /// Since Godot represents notifications as integers, it's always possible that a notification outside the known types\n  111 |             /// is received. For example, the user can manually issue notifications through `Object::notify()`.\n  112 |             ///\n  113 |             /// This is also necessary if you develop an extension on a Godot version and want to be forward-compatible with newer\n  114 |             /// versions. If Godot adds new notifications, they will be unknown to your extension, but you can still handle them.\n  115 |             Unknown(i32),\n  116 |         }\n  117 | \n  118 |         impl From<i32> for #enum_name {\n  119 |             /// Always succeeds, mapping unknown integers to the `Unknown` variant.\n  120 |             fn from(enumerator: i32) -> Self {\n  121 |                 match enumerator {\n  122 |                     #(\n  123 |                         #notification_enumerators_ord => Self::#notification_enumerators_shout,\n  124 |                     )*\n  125 |                     other_int => Self::Unknown(other_int),\n  126 |                 }\n  127 |             }\n  128 |         }","lines":24,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-codegen/src/generator/notifications.rs#L105-L128"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Gd::is_dynamic_class() / is_dynamic_class_of() and owned_cast() validate liveness only via check_rtti(), which is a no-op under the 'disengaged' safeguard level. owned_cast() then calls is_dynamic_class_of() -> as_object_ref().is_class() which dereferences the object pointer via FFI. On a dead object at the disengaged level this is a use-after-free with no diagnostic. This is the same class of issue as free(), but reachable through the very common cast()/try_cast() path.","fix":"Document clearly that the disengaged safeguard level removes liveness validation from cast/bind/etc. (making those operations unsafe on stale pointers), or keep a minimal liveness check in cast paths regardless of level.","locations":[{"ref":"godot-core/src/obj/raw_gd.rs:139-160","code":"  139 |     pub(super) fn owned_cast<U>(self) -> Result<RawGd<U>, Self>\n  140 |     where\n  141 |         U: GodotClass,\n  142 |     {\n  143 |         if self.is_null() {\n  144 |             // Null can be cast to anything; ref-count is irrelevant.\n  145 |             return Ok(RawGd::null());\n  146 |         }\n  147 | \n  148 |         // Before Godot API calls, make sure the object is alive (and in Debug mode, of the correct type).\n  149 |         // Current design decision: EVERY cast fails on incorrect type, even if target type is correct. This avoids the risk of violated\n  150 |         // invariants that leak to the Godot implementation. Also, we do not provide a way to recover from bad types -- this is always\n  151 |         // a bug that must be solved by the user.\n  152 |         self.check_rtti(\"cast\");\n  153 | \n  154 |         if self.is_dynamic_class_of::<U>() {\n  155 |             // SAFETY: is_class() confirmed U is a valid type.\n  156 |             Ok(unsafe { self.into_reinterpreted() })\n  157 |         } else {\n  158 |             Err(self)\n  159 |         }\n  160 |     }","lines":22,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/obj/raw_gd.rs#L139-L160"},{"ref":"godot-core/src/obj/raw_gd.rs:412-415","code":"  412 |     #[cfg(not(safeguards_balanced))]\n  413 |     pub(crate) fn check_rtti(&self, _method_name: &'static str) {\n  414 |         // Disengaged level: no-op.\n  415 |     }","lines":4,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/obj/raw_gd.rs#L412-L415"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The `with_singleton` unregister closure calls `T::singleton()` to obtain the instance, then `Engine::unregister_singleton(...)`, then `singleton.free()`. `T::singleton()` goes through `singleton_unchecked_type`, which (balanced+ safeguards) asserts `current_init_level >= T::INIT_LEVEL`. During deinit the current init level is being torn down, so fetching the singleton this way is fragile and, if the singleton was already removed or the level already lowered, can panic or return a stale pointer right before `free()`. Recent history (\"Fix dangling singleton pointer after deinit\") shows this area is bug-prone.","fix":"Capture/free the singleton via the instance ID or the pointer returned by `Engine::get_singleton` defensively (null-check), and avoid relying on `T::singleton()`'s init-level assertion during the deinit path.","locations":[{"ref":"godot-core/src/registry/shard.rs:271-291","code":"  271 |     pub fn with_singleton<T>(mut self) -> Self\n  272 |     where\n  273 |         T: UserSingleton\n  274 |             + Bounds<Memory = bounds::MemManual, Declarer = bounds::DeclUser>\n  275 |             + NewAlloc\n  276 |             + Inherits<classes::Object>,\n  277 |     {\n  278 |         self.register_singleton_fn = Some(|| {\n  279 |             crate::classes::Engine::singleton()\n  280 |                 .register_singleton(&T::class_id().to_string_name(), &T::new_alloc());\n  281 |         });\n  282 | \n  283 |         self.unregister_singleton_fn = Some(|| {\n  284 |             let singleton = T::singleton();\n  285 |             crate::classes::Engine::singleton()\n  286 |                 .unregister_singleton(&T::class_id().to_string_name());\n  287 |             singleton.free();\n  288 |         });\n  289 | \n  290 |         self\n  291 |     }","lines":21,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/registry/shard.rs#L271-L291"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `impl AtomicIntLike for Option<T>`, `from_u8` treats the associated const `u8::MAX` as the sentinel for `None` and `to_u8` maps `None` to `u8::MAX`. The invariant 'Make sure no variant has this value' is unenforced: if an enum used inside `AtomicEnum<Option<E>>` defines a variant with discriminant 255, that variant is silently conflated with `None` on every store/load, with no compile-time or runtime check.","fix":"Add a debug assertion in `Option::<T>::to_u8`/`from_u8` (or a `static_assert!` in the macro) that no real variant equals `u8::MAX`, or document the limitation prominently.","locations":[{"ref":"godot-ffi/src/atomic_enum.rs:64-97","code":"   64 | /// [`atomic_enum!`][crate::atomic_enum] macro.\n   65 | ///\n   66 | /// Automatically implemented for `Option<T>` by mapping `None` to `u8::MAX`. Make sure no variant has this value.\n   67 | pub trait AtomicIntLike: Copy {\n   68 |     /// Raw byte used by [`AtomicEnum::default()`] for `const` (e.g. `static`) initialization.\n   69 |     const DEFAULT_ORD: u8;\n   70 | \n   71 |     /// Convert this value to a `u8`.\n   72 |     fn to_u8(self) -> u8;\n   73 | \n   74 |     /// Convert a `u8` back to this type.\n   75 |     ///\n   76 |     /// # Panics\n   77 |     /// Panics if the value is not a valid discriminant.\n   78 |     fn from_u8(value: u8) -> Self;\n   79 | }\n   80 | \n   81 | impl<T: AtomicIntLike> AtomicIntLike for Option<T> {\n   82 |     const DEFAULT_ORD: u8 = u8::MAX;\n   83 | \n   84 |     fn to_u8(self) -> u8 {\n   85 |         match self {\n   86 |             None => u8::MAX,\n   87 |             Some(inner) => T::to_u8(inner),\n   88 |         }\n   89 |     }\n   90 | \n   91 |     fn from_u8(value: u8) -> Self {\n   92 |         match value {\n   93 |             u8::MAX => None,\n   94 |             inner => Some(T::from_u8(inner)),\n   95 |         }\n   96 |     }\n   97 | }","lines":34,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-ffi/src/atomic_enum.rs#L64-L97"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`since_patch_api` / `before_patch_api` cfgs are emitted via `cargo:rustc-cfg=...` but no matching `cargo:rustc-check-cfg=cfg(since_patch_api, ...)` / `before_patch_api` is ever declared (only `since_api`/`before_api` are declared). Any code referencing `#[cfg(since_patch_api = ...)]` would trip the `unexpected_cfgs` lint complaining the cfg name itself is unknown. Latent today (all `ALL_VERSIONS` patches are 0), but inconsistent with `since_api`/`before_api`.","fix":"Emit `cargo:rustc-check-cfg=cfg(since_patch_api, values(any()))` and the same for `before_patch_api` alongside the other check-cfg declarations.","locations":[{"ref":"godot-bindings/src/lib.rs:194-224","code":"  194 |             println!(r#\"cargo:rustc-check-cfg=cfg(since_api, values(\"4.{minor}\"))\"#);\n  195 |             println!(r#\"cargo:rustc-check-cfg=cfg(before_api, values(\"4.{minor}\"))\"#);\n  196 |         }\n  197 |     }\n  198 | \n  199 |     let GodotVersion {\n  200 |         major: _,\n  201 |         minor,\n  202 |         patch,\n  203 |         ..\n  204 |     } = get_godot_version();\n  205 | \n  206 |     // Emit `rustc-cfg` dependent on current API version.\n  207 |     // Start at 1; checking for \"since/before 4.0\" makes no sense\n  208 |     let upcoming_minor = all_versions.last().unwrap().1;\n  209 |     for m in 1..=minor {\n  210 |         println!(r#\"cargo:rustc-cfg=since_api=\"4.{m}\"\"#);\n  211 |     }\n  212 |     for m in minor + 1..=upcoming_minor {\n  213 |         println!(r#\"cargo:rustc-cfg=before_api=\"4.{m}\"\"#);\n  214 |     }\n  215 | \n  216 |     // The below configuration keys are very rarely needed and should generally not be used.\n  217 |     // Emit #[cfg]s since/before for patch level.\n  218 |     for (_, m, p) in all_versions.iter().copied() {\n  219 |         if (m, p) >= (minor, patch) {\n  220 |             println!(r#\"cargo:rustc-cfg=since_patch_api=\"4.{m}.{p}\"\"#);\n  221 |         } else {\n  222 |             println!(r#\"cargo:rustc-cfg=before_patch_api=\"4.{m}.{p}\"\"#);\n  223 |         }\n  224 |     }","lines":31,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-bindings/src/lib.rs#L194-L224"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`BorrowState::has_accessible` computes `self.mut_count - self.inaccessible_count` with unsigned subtraction. The invariants are supposed to keep `inaccessible_count <= mut_count`, but if a bug ever broke that, this underflows to a huge `usize` (panic in debug, wraps in release) rather than surfacing the invariant violation cleanly. This is the lowest-level predicate that most other checks build on, so a silent wrap in release would corrupt all subsequent borrow accounting.","fix":"Use `self.mut_count.checked_sub(self.inaccessible_count)` and poison/return on `None`, or `saturating_sub`, instead of raw subtraction.","locations":[{"ref":"godot-cell/src/borrow_state.rs:44-54","code":"   44 |     /// Returns `true` if there are any accessible mutable references.\n   45 |     pub fn has_accessible(&self) -> bool {\n   46 |         let count = self.mut_count - self.inaccessible_count;\n   47 | \n   48 |         assert!(\n   49 |             count <= 1,\n   50 |             \"there should never be more than 1 accessible mutable reference\"\n   51 |         );\n   52 | \n   53 |         count == 1\n   54 |     }","lines":11,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-cell/src/borrow_state.rs#L44-L54"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"signals.rs uses tokens_non_null() for EngineClass signal parameters, emitting Gd<T> rather than the conservative Option<Gd<T>> used by virtual methods (make_virtual_param_type). The file's own top-of-file TODO acknowledges this as a bug: signal emit signatures may not match nullable Godot objects, forcing non-null where Godot allows null.","fix":"For RustTy::EngineClass signal params, emit Option<Gd<T>> mirroring make_virtual_param_type, or document why signals are exempt.","locations":[{"ref":"godot-codegen/src/generator/signals.rs:13","code":"   13 | // TODO(v0.6): signal parameters are Gd<T> instead of conservatively Option<Gd<T>>, which is a bug.","lines":1,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-codegen/src/generator/signals.rs#L13"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"Enumerator::from_json picks Bitfield vs Enum solely from the enum-level is_bitfield flag, then for bitfields does try_into::<u64> and panics 'is negative' on failure, while the non-bitfield branch panics on out-of-i32-range. But is_bitfield can be overridden by special_cases::is_enum_bitfield. If a special case forces is_bitfield=true on an enum containing a negative sentinel (e.g. -1), codegen panics; conversely forcing is_bitfield=false on a true bitfield with a value > i32::MAX hits the i32 panic. The representation choice is decoupled from the actual data, making the panics reachable via the special-case table.","fix":"When overriding is_bitfield via special cases, validate that all enumerator values are compatible (non-negative for bitfields, in-i32-range for enums), or document the constraint at the special-case definition site.","locations":[{"ref":"godot-codegen/src/models/domain_mapping.rs:770-771","code":"  770 |         let is_bitfield = special_cases::is_enum_bitfield(surrounding_class, &godot_name)\n  771 |             .unwrap_or(json_is_bitfield);","lines":2,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-codegen/src/models/domain_mapping.rs#L770-L771"},{"ref":"godot-codegen/src/models/domain_mapping.rs:816-836","code":"  816 | impl Enumerator {\n  817 |     pub fn from_json(json: JsonEnumConstant, rust_name: Ident, is_bitfield: bool) -> Self {\n  818 |         let value = if is_bitfield {\n  819 |             let ord = json.value.try_into().unwrap_or_else(|_| {\n  820 |                 panic!(\n  821 |                     \"bitfield value {} = {} is negative; please report this\",\n  822 |                     json.name, json.value\n  823 |                 )\n  824 |             });\n  825 | \n  826 |             EnumeratorValue::Bitfield(ord)\n  827 |         } else {\n  828 |             let ord = json.value.try_into().unwrap_or_else(|_| {\n  829 |                 panic!(\n  830 |                     \"enum value {} = {} is out of range for i32; please report this\",\n  831 |                     json.name, json.value\n  832 |                 )\n  833 |             });\n  834 | \n  835 |             EnumeratorValue::Enum(ord)\n  836 |         };","lines":21,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-codegen/src/models/domain_mapping.rs#L816-L836"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"is_class_method_const applies the get_/is_/has_ -> const heuristic (Some(true)) to ALL classes after a small explicit deny-list (Some(false)) keyed by bare method name. Any future mutating get_* method not added to the deny-list is silently mapped to &self, producing an unsound &self signature on a mutating call. The doc comment acknowledges the heuristic but understates the soundness risk; the deny-list keyed on bare names also risks cross-class collisions.","fix":"Prefer Godot's own is_const flag where available and assert against the heuristic on disagreement; consider an allow-list rather than deny-list for const-ness.","locations":[{"ref":"godot-codegen/src/special_cases/special_cases.rs:789-796","code":"  789 |         // Heuristic: many Godot getters are not const-qualified despite being pure reads. Override get_*/is_*/has_* methods to const.\n  790 |         // Exceptions with actual side effects are listed as explicit Some(false) arms above.\n  791 |         _ if !godot_method.is_const && !godot_method.is_static && !godot_method.is_virtual\n  792 |             && [\"get_\", \"is_\", \"has_\"].iter().any(|p| godot_method.name.starts_with(p))\n  793 |         => Some(true),\n  794 | \n  795 |         _ => None,\n  796 |     }","lines":8,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-codegen/src/special_cases/special_cases.rs#L789-L796"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"get_global_enum_module_path special-cases 'Variant.Type'/'VariantType' to live in crate::builtin, but not 'Variant.Operator'. Yet is_enum_private lists both (None,\"Variant.Type\") and (None,\"Variant.Operator\") as re-exported to crate::builtin. So Variant.Operator resolves to crate::global in get_global_enum_module_path, inconsistent with the private-enum treatment; doc links / module paths for Variant.Operator can be wrong.","fix":"If Variant.Operator lives in crate::builtin, add it (and its 'VariantOperator' spelling) to the builtin arm of get_global_enum_module_path; otherwise document why it differs.","locations":[{"ref":"godot-codegen/src/special_cases/special_cases.rs:1337-1344","code":" 1337 | pub fn get_global_enum_module_path(enum_name: &str) -> &'static str {\n 1338 |     match enum_name {\n 1339 |         \"PropertyHint\" | \"PropertyUsageFlags\" | \"MethodFlags\" => \"crate::registry::info\",\n 1340 |         // Godot's JSON spells `VariantType` as `Variant.Type`; accept both since callers may pass either form.\n 1341 |         \"Corner\" | \"EulerOrder\" | \"Side\" | \"VariantType\" | \"Variant.Type\" => \"crate::builtin\",\n 1342 |         _ => \"crate::global\",\n 1343 |     }\n 1344 | }","lines":8,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-codegen/src/special_cases/special_cases.rs#L1337-L1344"},{"ref":"godot-codegen/src/special_cases/special_cases.rs:1321-1332","code":" 1321 |         | (None, \"Corner\")\n 1322 |         | (None, \"EulerOrder\")\n 1323 |         | (None, \"Side\")\n 1324 |         | (None, \"Variant.Operator\")\n 1325 |         | (None, \"Variant.Type\")\n 1326 | \n 1327 |         // Re-exported to godot::register::info.\n 1328 |         | (None, \"PropertyHint\")\n 1329 |         | (None, \"PropertyUsageFlags\")\n 1330 |         | (None, \"MethodFlags\")\n 1331 | \n 1332 |         => true, _ => false","lines":12,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-codegen/src/special_cases/special_cases.rs#L1321-L1332"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`DictionaryIter::next_key` increments `next_idx` based solely on `self.next_idx < self.dictionary.len()`, even when `new_key` is `None` (iteration finished). This over-counts at the end of iteration, making `size_hint()` (which computes `len - next_idx`) inaccurate. The increment should be tied to whether a key was actually produced.","fix":"Only increment `next_idx` when `new_key.is_some()`, e.g. move the `if self.next_idx < len { self.next_idx += 1; }` block inside the `new_key.is_some()` path.","locations":[{"ref":"godot-core/src/builtin/collections/dictionary.rs:998-1012","code":"  998 |     fn next_key(&mut self) -> Option<Variant> {\n  999 |         let new_key = if self.is_first {\n 1000 |             self.is_first = false;\n 1001 |             Self::call_init(self.dictionary)\n 1002 |         } else {\n 1003 |             Self::call_next(self.dictionary, self.last_key.take()?)\n 1004 |         };\n 1005 | \n 1006 |         if self.next_idx < self.dictionary.len() {\n 1007 |             self.next_idx += 1;\n 1008 |         }\n 1009 | \n 1010 |         self.last_key.clone_from(&new_key);\n 1011 |         new_key\n 1012 |     }","lines":15,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/builtin/collections/dictionary.rs#L998-L1012"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`Quaternion::inverse()` returns the conjugate `(-x, -y, -z, w)`, which equals the true inverse only for unit quaternions. The method has no normalization check and no doc note (unlike most other methods here which panic on non-normalized input). For a non-unit quaternion this returns the conjugate, not the inverse, silently producing a wrong result. Godot's `Quaternion::inverse()` likewise assumes a unit quaternion, but here it is entirely unguarded and undocumented.","fix":"Document that `inverse()` assumes a normalized quaternion (returns the conjugate), or divide the conjugate by `length_squared()` to make it correct for arbitrary quaternions.","locations":[{"ref":"godot-core/src/builtin/quaternion.rs:168-170","code":"  168 |     pub fn inverse(self) -> Self {\n  169 |         Self::new(-self.x, -self.y, -self.z, self.w)\n  170 |     }","lines":3,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/builtin/quaternion.rs#L168-L170"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"Signal::emit() silently does nothing when the signal's object is None (dead or absent), with no indication to the caller. The doc says \"All Callables connected to this signal will be triggered\" and does not mention this silent no-op, which can mask bugs where emit is called on an invalid signal.","fix":"Document the silent no-op behavior on a missing/dead object, or return a status/Result so callers can detect it.","locations":[{"ref":"godot-core/src/builtin/signal.rs:106-112","code":"  106 |     pub fn emit(&self, varargs: &[Variant]) {\n  107 |         let Some(mut object) = self.object() else {\n  108 |             return;\n  109 |         };\n  110 | \n  111 |         object.emit_signal(&self.name(), varargs);\n  112 |     }","lines":7,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/builtin/signal.rs#L106-L112"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`Vector2::aspect()` returns `self.x / self.y` with no guard against `y == 0`. For the float version this yields inf/NaN silently; for integer `Vector2i::aspect()` the components are cast to `real` first so it is also inf/NaN rather than a panic, but the divide-by-zero case is entirely undocumented. Callers cannot distinguish a legitimate large ratio from a degenerate input.","fix":"Document the divide-by-zero behavior of `aspect()` (returns inf/NaN when `y == 0`), or return an `Option`/handle the zero case explicitly.","locations":[{"ref":"godot-core/src/builtin/vectors/vector_macros.rs:871-875","code":"  871 |             /// Returns the aspect ratio of this vector, the ratio of [`Self::x`] to [`Self::y`].\n  872 |             #[inline]\n  873 |             pub fn aspect(self) -> real {\n  874 |                 self.x as real / self.y as real\n  875 |             }","lines":5,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/builtin/vectors/vector_macros.rs#L871-L875"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`suppress_godot_errors()` has a TOCTOU window in its outermost-scope capture. Between `SUPPRESS_DEPTH.fetch_add` returning 0 and the subsequent `SUPPRESS_ORIG_STATE.store(Engine::is_printing_error_messages())`, a second thread can enter, see depth>0, skip capture, and proceed; or two outer scopes can interleave such that the captured 'original' state is already `false` (set by an overlapping scope), causing the guard's `Drop` to restore error printing to `false` permanently. The doc acknowledges 'races are self-healing', but a stuck-`false` restore is not purely cosmetic. Also `Engine::set_print_error_messages` uses the main-thread-asserting binding, so concurrent off-thread use is UB despite the atomics suggesting thread-safety.","fix":"Document this as strictly main-thread-only (the atomics give a false sense of cross-thread safety), or capture/restore under a mutex so the original-state snapshot cannot be clobbered by an overlapping scope.","locations":[{"ref":"godot-core/src/global/print.rs:458-467","code":"  458 | pub fn suppress_godot_errors() -> SuppressGuard {\n  459 |     if SUPPRESS_DEPTH.fetch_add(1, Ordering::AcqRel) == 0 {\n  460 |         SUPPRESS_ORIG_STATE.store(\n  461 |             Engine::singleton().is_printing_error_messages(),\n  462 |             Ordering::Release,\n  463 |         );\n  464 |         Engine::singleton().set_print_error_messages(false);\n  465 |     }\n  466 |     SuppressGuard { _private: () }\n  467 | }","lines":10,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/global/print.rs#L458-L467"},{"ref":"godot-core/src/global/print.rs:438-447","code":"  438 | impl Drop for SuppressGuard {\n  439 |     fn drop(&mut self) {\n  440 |         let prev = SUPPRESS_DEPTH.fetch_sub(1, Ordering::AcqRel);\n  441 |         sys::strict_assert!(prev >= 1, \"suppress_godot_errors: depth underflow\");\n  442 |         if prev == 1 {\n  443 |             let restore = SUPPRESS_ORIG_STATE.load(Ordering::Acquire);\n  444 |             Engine::singleton().set_print_error_messages(restore);\n  445 |         }\n  446 |     }\n  447 | }","lines":10,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/global/print.rs#L438-L447"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The autoload cache stores `Gd<Node>` keyed by name and returns it on subsequent calls without checking whether the cached node is still alive. If the autoload node is freed (e.g. tree teardown, or a custom autoload that frees itself) and the cache is not cleared, `try_get_autoload_by_name` returns/operates on a stale `Gd`. The cached node is only ever validated indirectly inside `cast_autoload` via `get_class()`, which on a dead object follows the usual liveness rules (panic or UB under disengaged safeguards) rather than returning a clean cache-miss.","fix":"On cache hit, verify `cached_node.is_instance_valid()`; if invalid, drop the entry and fall through to the scene-tree lookup path.","locations":[{"ref":"godot-core/src/tools/autoload.rs:92-95","code":"   92 |     let cached = AUTOLOAD_CACHE.with(|cache| cache.borrow().get(autoload_name).cloned());\n   93 | \n   94 |     if let Some(cached_node) = cached {\n   95 |         return cast_autoload(cached_node, autoload_name);","lines":4,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/tools/autoload.rs#L92-L95"},{"ref":"godot-core/src/tools/autoload.rs:157-169","code":"  157 | fn cast_autoload<T>(node: Gd<Node>, autoload_name: &str) -> Result<Gd<T>, ConvertError>\n  158 | where\n  159 |     T: Inherits<Node>,\n  160 | {\n  161 |     node.try_cast::<T>().map_err(|node| {\n  162 |         let expected = T::class_id();\n  163 |         let actual = node.get_class();\n  164 | \n  165 |         ConvertError::new(format!(\n  166 |             \"autoload `{autoload_name}` has wrong type (expected {expected}, got {actual})\",\n  167 |         ))\n  168 |     })\n  169 | }","lines":13,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/tools/autoload.rs#L157-L169"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`is_class_editor_only` returns `true` for *any* class whose name starts with `Editor`, but `parse_struct_attributes` separately rejects user classes starting with `Editor` unless `#[class(internal)]` is set. For a *base* class named like `Editor...` the `post_validate` path additionally forces `#[class(tool)]`. The two name-prefix checks (`starts_with(\"Editor\")` for the user's own class name vs. for the base class) encode the same brittle heuristic in two places and can disagree with Godot's real `api_type`, leading to spurious required-attribute errors for classes that merely happen to start with \"Editor\".","fix":"Centralize the editor-class determination using engine metadata (api_type) rather than two independent `starts_with(\"Editor\")` string heuristics.","locations":[{"ref":"godot-macros/src/class/derive_godot_class.rs:648-655","code":"  648 |             // Godot has an edge case where classes starting with \"Editor\" are implicitly hidden:\n  649 |             // https://github.com/godotengine/godot/blob/ca452113d430cb96de409a297ff5b52389f1c9d9/editor/gui/create_dialog.cpp#L171-L173\n  650 |             if class.name.to_string().starts_with(\"Editor\") {\n  651 |                 return bail!(\n  652 |                     class.name.span(),\n  653 |                     \"Classes starting with `Editor` are implicitly hidden by Godot; use #[class(internal)] to make this explicit\",\n  654 |                 );\n  655 |             }","lines":8,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-macros/src/class/derive_godot_class.rs#L648-L655"},{"ref":"godot-macros/src/class/derive_godot_class.rs:1058-1067","code":" 1058 | fn is_class_editor_only(godot_class_name: &str) -> bool {\n 1059 |     match godot_class_name {\n 1060 |         \"FileSystemDock\" | \"ScriptCreateDialog\" | \"ScriptEditor\" | \"ScriptEditorBase\" => true,\n 1061 |         _ => {\n 1062 |             (godot_class_name.starts_with(\"ResourceImporter\")\n 1063 |                 && godot_class_name != \"ResourceImporter\")\n 1064 |                 || godot_class_name.starts_with(\"Editor\")\n 1065 |         }\n 1066 |     }\n 1067 | }","lines":10,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-macros/src/class/derive_godot_class.rs#L1058-L1067"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"Duplicated i64->i32 'out of range for i32' conversion-and-panic logic with near-identical messages differing only by punctuation ('out of range for i32, please report this' vs 'out of range for i32; please report this'), indicating copy-paste drift. JsonEnumConstant::to_enum_ord already centralizes this conversion.","fix":"Have Enumerator::from_json call json.to_enum_ord() for the enum case, eliminating the duplicate.","locations":[{"ref":"godot-codegen/src/models/api_json.rs:135-143","code":"  135 |     pub fn to_enum_ord(&self) -> i32 {\n  136 |         self.value.try_into().unwrap_or_else(|_| {\n  137 |             panic!(\n  138 |                 \"enum value {} = {} is out of range for i32, please report this\",\n  139 |                 self.name, self.value\n  140 |             )\n  141 |         })\n  142 |     }\n  143 | }","lines":9,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-codegen/src/models/api_json.rs#L135-L143"},{"ref":"godot-codegen/src/models/domain_mapping.rs:828-835","code":"  828 |             let ord = json.value.try_into().unwrap_or_else(|_| {\n  829 |                 panic!(\n  830 |                     \"enum value {} = {} is out of range for i32; please report this\",\n  831 |                     json.name, json.value\n  832 |                 )\n  833 |             });\n  834 | \n  835 |             EnumeratorValue::Enum(ord)","lines":8,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-codegen/src/models/domain_mapping.rs#L828-L835"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`InaccessibleGuard::new` rejects a mismatched reference with the plain error 'wrong reference passed in' and the comment admits 'it is likely not unsound for this to happen, but it's unexpected'. However, `decrement_shared` poisons the whole cell when it detects a shared ref tracked alongside an accessible mutable ref. The two related invariant-violation paths are handled very differently (one soft error, one poison) without a documented rationale, making the poison policy inconsistent and hard to reason about for a soundness-critical type.","fix":"Document the poison policy precisely (which invariant breaks poison vs. soft-error), and make the two sites consistent.","locations":[{"ref":"godot-cell/src/guards.rs:222-241","code":"  222 |         // SAFETY: There can be only one active reference to the cell state at a given time.\n  223 |         let cell_state = unsafe { state.get().as_mut() }.unwrap();\n  224 |         let current_ptr = cell_state.get_ptr();\n  225 |         let new_ptr = NonNull::from(new_ref);\n  226 | \n  227 |         if current_ptr != new_ptr {\n  228 |             // it is likely not unsound for this to happen, but it's unexpected\n  229 |             return Err(\"wrong reference passed in\".into());\n  230 |         }\n  231 | \n  232 |         cell_state.borrow_state.set_inaccessible()?;\n  233 |         let prev_ptr = cell_state.get_ptr();\n  234 |         let stack_depth = cell_state.push_ptr(new_ptr);\n  235 | \n  236 |         Ok(Self {\n  237 |             state,\n  238 |             stack_depth,\n  239 |             prev_ptr,\n  240 |         })\n  241 |     }","lines":20,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-cell/src/guards.rs#L222-L241"},{"ref":"godot-cell/src/borrow_state.rs:140-155","code":"  140 |     pub fn decrement_shared(&mut self) -> Result<usize, BorrowStateErr> {\n  141 |         self.ensure_not_poisoned()?;\n  142 | \n  143 |         if self.shared_count == 0 {\n  144 |             return Err(\"cannot decrement shared counter when no shared reference exists\".into());\n  145 |         }\n  146 | \n  147 |         if self.has_accessible() {\n  148 |             self.poison(\"shared reference tracked while accessible mutable reference exists\")?;\n  149 |         }\n  150 | \n  151 |         // We know `shared_count` isn't 0.\n  152 |         self.shared_count -= 1;\n  153 | \n  154 |         Ok(self.shared_count)\n  155 |     }","lines":16,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-cell/src/borrow_state.rs#L140-L155"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`EngineFromGodot for u64` decodes from Variant via `variant.try_to::<i64>().map(|i| i as u64)`. This is consistent with the bit-reinterpretation policy documented for `u64`, but it silently accepts any i64 and reinterprets the bits, so a Variant carrying a value never intended as the high-bit `u64` is converted without diagnostics. Combined with `engine_to_variant` storing `*self as i64`, large `u64` values round-trip as negative GDScript ints with no warning -- easy to misuse in bitfield-adjacent engine APIs.","fix":"No change needed if the bit-reinterpret contract is intended, but document at the conversion site that this is a reinterpret (not a value-preserving conversion), to prevent silent misuse.","locations":[{"ref":"godot-core/src/meta/godot_convert/impls.rs:362-374","code":"  362 |     fn engine_to_variant(&self) -> Variant {\n  363 |         Variant::from(*self as i64) // Treat as i64.\n  364 |     }\n  365 | }\n  366 | \n  367 | impl meta::EngineFromGodot for u64 {\n  368 |     fn engine_try_from_godot(via: Self::Via) -> Result<Self, ConvertError> {\n  369 |         Ok(via)\n  370 |     }\n  371 | \n  372 |     fn engine_try_from_variant(variant: &Variant) -> Result<Self, ConvertError> {\n  373 |         variant.try_to::<i64>().map(|i| i as u64)\n  374 |     }","lines":13,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/meta/godot_convert/impls.rs#L362-L374"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"script_instance_exists() calls script.bind() to fetch the language. bind() panics if another guard is active or if the object is a placeholder. Since this helper is meant to be called from IScriptExtension::instance_has (an engine callback), a panic here crosses the FFI boundary. It also takes a full bind guard merely to read get_language().","fix":"Guard the bind (e.g. fail gracefully returning false if already bound / placeholder), or fetch the language without binding the user instance if an engine-side path exists.","locations":[{"ref":"godot-core/src/obj/script.rs:418-420","code":"  418 |     let Some(language) = script.bind().get_language() else {\n  419 |         return false;\n  420 |     };","lines":3,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/obj/script.rs#L418-L420"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`TaskHandle::is_pending()` panics via `unreachable!(\"missing future slot\")` when the slot index is out of range, whereas the sibling method `cancel()` deliberately treats a missing slot (runtime deinitialized) as a no-op and returns gracefully. After `task::cleanup()` runs at engine shutdown the runtime is set to `None`, and `with_runtime` itself would `expect`-panic before reaching the `unreachable!`; but the asymmetry means `is_pending()` is far more panic-prone than `cancel()` for the same lifecycle states, and the `unreachable!` message implies an invariant that index validity does not actually guarantee.","fix":"Return `false` for a missing slot (consistent with the id-mismatch branch and with `cancel()`), instead of `unreachable!()`.","locations":[{"ref":"godot-core/src/task/async_runtime.rs:225-241","code":"  225 |     pub fn is_pending(&self) -> bool {\n  226 |         ASYNC_RUNTIME.with_runtime(|rt| {\n  227 |             let slot = rt\n  228 |                 .tasks\n  229 |                 .get(self.index)\n  230 |                 .unwrap_or_else(|| unreachable!(\"missing future slot at index {}\", self.index));\n  231 | \n  232 |             if slot.id != self.id {\n  233 |                 return false;\n  234 |             }\n  235 | \n  236 |             matches!(\n  237 |                 slot.value,\n  238 |                 FutureSlotState::Pending(_) | FutureSlotState::Polling\n  239 |             )\n  240 |         })\n  241 |     }","lines":17,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/task/async_runtime.rs#L225-L241"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`InitLevel::from_sys` maps any unrecognized `GDExtensionInitializationLevel` to `Self::Scene` (after an `eprintln!`). A wrong-but-plausible default here is dangerous: `Scene` drives 'must only be called once per level' method-table loading, so an unknown/future level silently aliasing to `Scene` could trigger table loading at the wrong time. The chosen fallback (`Scene`, not `Core`) is arbitrary and unjustified.","fix":"Panic on an unknown level, or return an `Option`/dedicated 'unknown' variant the caller can skip, rather than aliasing to `Scene`.","locations":[{"ref":"godot-ffi/src/init_level.rs:37-48","code":"   37 |     pub fn from_sys(level: crate::GDExtensionInitializationLevel) -> Self {\n   38 |         match level {\n   39 |             crate::GDEXTENSION_INITIALIZATION_CORE => Self::Core,\n   40 |             crate::GDEXTENSION_INITIALIZATION_SERVERS => Self::Servers,\n   41 |             crate::GDEXTENSION_INITIALIZATION_SCENE => Self::Scene,\n   42 |             crate::GDEXTENSION_INITIALIZATION_EDITOR => Self::Editor,\n   43 |             _ => {\n   44 |                 eprintln!(\"WARNING: unknown initialization level {level}\");\n   45 |                 Self::Scene\n   46 |             }\n   47 |         }\n   48 |     }","lines":12,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-ffi/src/init_level.rs#L37-L48"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`handle_mutually_exclusive_keys` builds a user-facing compile error by `Debug`-formatting a `Vec` of `Result` values: `bail!(parser.span(), \"{errs:?}\")`. When any key check returns an error (e.g. a flag key like `#[rpc(any_peer = 5)]` was given a value), the emitted `compile_error!` text is the raw `Debug` of `vec![Err(venial::Error { ... })]` rather than the actual human-readable message and span. The original error's span and message are discarded.","fix":"Collect the errors with `?`/`try_fold`, or extract the first `Err` and propagate it directly (combining messages), instead of `Debug`-printing the `Vec<Result<...>>`.","locations":[{"ref":"godot-macros/src/lib.rs:1631-1639","code":" 1631 |     let (oks, errs) = keys\n 1632 |         .iter()\n 1633 |         .enumerate()\n 1634 |         .map(|(idx, key)| Ok(parser.handle_alone(key)?.then_some(idx)))\n 1635 |         .partition::<Vec<_>, _>(|result: &ParseResult<Option<usize>>| result.is_ok());\n 1636 | \n 1637 |     if !errs.is_empty() {\n 1638 |         return bail!(parser.span(), \"{errs:?}\");\n 1639 |     }","lines":9,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-macros/src/lib.rs#L1631-L1639"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`Rect2` does not validate non-negative size on operations where its 3D counterpart `Aabb` does. `Aabb::merge/volume/contains_point/intersect/intersects_ray/intersect_segment_inner` all call `assert_nonnegative()`, but `Rect2::merge/intersect/intersects/contains_point` perform no such check despite the type documenting the same soft invariant. This makes the float 2D and 3D bounding-box types behave inconsistently for negative-size inputs (silent wrong results in Rect2 vs panic in Aabb). Note `Rect2i` does assert nonnegative in these methods, so `Rect2` is the odd one out.","fix":"Add `self.assert_nonnegative()` (and for binary ops, also on the argument) to `Rect2::merge`, `intersect`, `intersects`, and `contains_point`, matching `Aabb` and `Rect2i`.","locations":[{"ref":"godot-core/src/builtin/rect2.rs:128-134","code":"  128 |     #[inline]\n  129 |     pub fn merge(self, b: Self) -> Self {\n  130 |         let position = self.position.coord_min(b.position);\n  131 |         let end = self.end().coord_max(b.end());\n  132 | \n  133 |         Self::from_position_end(position, end)\n  134 |     }","lines":7,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/builtin/rect2.rs#L128-L134"},{"ref":"godot-core/src/builtin/rect2.rs:196-200","code":"  196 |     pub fn contains_point(self, point: Vector2) -> bool {\n  197 |         let point = point - self.position;\n  198 | \n  199 |         point.abs() == point && point.x < self.size.x && point.y < self.size.y\n  200 |     }","lines":5,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/builtin/rect2.rs#L196-L200"},{"ref":"godot-core/src/builtin/rect2.rs:225-234","code":"  225 |     #[inline]\n  226 |     pub fn intersects(self, b: Self) -> bool {\n  227 |         let end = self.end();\n  228 |         let end_b = b.end();\n  229 | \n  230 |         self.position.x <= end_b.x\n  231 |             && end.x >= b.position.x\n  232 |             && self.position.y <= end_b.y\n  233 |             && end.y >= b.position.y\n  234 |     }","lines":10,"link":"https://github.com/godot-rust/gdext/blob/d1183d70c71b12816d77de116fc821a4f72bf4f1/godot-core/src/builtin/rect2.rs#L225-L234"}]},
