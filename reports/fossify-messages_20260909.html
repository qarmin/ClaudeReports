<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"renameConversation rebuilds the list with `set(indexOf(conversation), updatedConv)`. `indexOf` uses Conversation.equals (data class), and the `conversation` captured here is the pre-edit instance. If the underlying list was refreshed in the meantime (new message, read-state change) the element no longer equals the captured instance and indexOf returns -1, so `set(-1, updatedConv)` throws IndexOutOfBoundsException / ArrayIndexOutOfBoundsException.","fix":"Locate the target by threadId (indexOfFirst { it.threadId == conversation.threadId }) and guard against -1 before calling set().","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/adapters/ConversationsAdapter.kt:235-248","code":"  235 |     private fun renameConversation(conversation: Conversation) {\n  236 |         RenameConversationDialog(activity, conversation) {\n  237 |             ensureBackgroundThread {\n  238 |                 val updatedConv = activity.renameConversation(conversation, newTitle = it)\n  239 |                 activity.runOnUiThread {\n  240 |                     finishActMode()\n  241 |                     currentList.toMutableList().apply {\n  242 |                         set(indexOf(conversation), updatedConv)\n  243 |                         updateConversations(this as ArrayList<Conversation>)\n  244 |                     }\n  245 |                 }\n  246 |             }\n  247 |         }\n  248 |     }","lines":14,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/adapters/ConversationsAdapter.kt#L235-L248"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"updateLastConversationMessage indexes the result of getConversations(threadId) with `[0]`. getConversations can legitimately return an empty list (e.g. the thread has 0 messages, all recipients are blocked, or the thread no longer exists after the delete trigger above), causing an IndexOutOfBoundsException. It is inside a try/catch that swallows everything, so the failure is silent and the conversation snippet/date simply never updates - but it still aborts the whole loop over `threadIds`, so subsequent threads in the same call are skipped.","fix":"Use getConversations(threadId).firstOrNull()?.let { insertOrUpdateConversation(it) }, and ideally move it out of the broad catch so per-thread failures don't abort the rest of the loop.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/extensions/Context.kt:1192-1199","code":" 1192 |     try {\n 1193 |         contentResolver.delete(uri, selection, null)\n 1194 |         for (threadId in threadIds) {\n 1195 |             val newConversation = getConversations(threadId)[0]\n 1196 |             insertOrUpdateConversation(newConversation)\n 1197 |         }\n 1198 |     } catch (_: Exception) {\n 1199 |     }","lines":8,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/extensions/Context.kt#L1192-L1199"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`readSms` parses untrusted XML backup attributes with non-null-asserting, throwing conversions: `getAttributeValue(null, \"date\").toLong()`, `.toInt()` on `locked`, `read`, `status`, `type`, and `address = getAttributeValue(null, \"address\")` assigned to a non-null `String`. If any of these attributes are missing or malformed in the backup file, `getAttributeValue` returns null and `.toLong()`/`.toInt()` throw NumberFormatException/NullPointerException, or the SmsBackup constructor gets a null `address`. Per-message this is caught in the importXml loop (counted as a failed message), but a missing/empty `date` attribute on a single record silently drops that message rather than handling it gracefully, and the whole-record failure for any single bad attribute is harsh. Use nullable parsing with sensible defaults.","fix":"Use safe parsing: `getAttributeValue(null, \"date\")?.toLongOrNull() ?: 0L`, `getAttributeValue(null, \"type\")?.toIntOrNull() ?: Telephony.Sms.MESSAGE_TYPE_INBOX`, and provide a default empty string for a null address. This keeps individual malformed fields from discarding an otherwise-valid record.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/helpers/MessagesImporter.kt:171-187","code":"  171 |     private fun XmlPullParser.readSms(): SmsBackup {\n  172 |         require(XmlPullParser.START_TAG, null, \"sms\")\n  173 | \n  174 |         return SmsBackup(\n  175 |             subscriptionId = 0,\n  176 |             address = getAttributeValue(null, \"address\"),\n  177 |             body = getAttributeValue(null, \"body\"),\n  178 |             date = getAttributeValue(null, \"date\").toLong(),\n  179 |             dateSent = getAttributeValue(null, \"date\").toLong(),\n  180 |             locked = getAttributeValue(null, \"locked\").toInt(),\n  181 |             protocol = getAttributeValue(null, \"protocol\"),\n  182 |             read = getAttributeValue(null, \"read\").toInt(),\n  183 |             status = getAttributeValue(null, \"status\").toInt(),\n  184 |             type = getAttributeValue(null, \"type\").toInt(),\n  185 |             serviceCenter = getAttributeValue(null, \"service_center\")\n  186 |         )\n  187 |     }","lines":17,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/helpers/MessagesImporter.kt#L171-L187"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"saveAttachments dereferences resultData.data!! (line 1481) before the null guard on the next line (destinationUri = resultData.data ?: return). If data is null the !! throws NPE before the guard can run. Also the non-tree branch uses pendingAttachmentsToSave!!.first() (line 1498) which throws if pendingAttachmentsToSave is null or empty.","fix":"Guard resultData.data once at the top (val uri = resultData.data ?: return) and use it everywhere; guard pendingAttachmentsToSave for null/empty before .first().","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/activities/ThreadActivity.kt:1542-1560","code":" 1542 |         applicationContext.contentResolver.takePersistableUriPermission(\n 1543 |             resultData.data!!, FLAG_GRANT_READ_URI_PERMISSION or FLAG_GRANT_WRITE_URI_PERMISSION\n 1544 |         )\n 1545 |         val destinationUri = resultData.data ?: return\n 1546 |         ensureBackgroundThread {\n 1547 |             try {\n 1548 |                 if (DocumentsContract.isTreeUri(destinationUri)) {\n 1549 |                     val outputDir = DocumentFile.fromTreeUri(this, destinationUri)\n 1550 |                         ?: return@ensureBackgroundThread\n 1551 |                     pendingAttachmentsToSave?.forEach { attachment ->\n 1552 |                         val documentFile = outputDir.createFile(\n 1553 |                             attachment.mimetype,\n 1554 |                             attachment.filename.takeIf { it.isNotBlank() }\n 1555 |                                 ?: attachment.uriString.getFilenameFromPath()\n 1556 |                         ) ?: return@forEach\n 1557 |                         copyToUri(src = attachment.getUri(), dst = documentFile.uri)\n 1558 |                     }\n 1559 |                 } else {\n 1560 |                     copyToUri(pendingAttachmentsToSave!!.first().getUri(), resultData.data!!)","lines":19,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/activities/ThreadActivity.kt#L1542-L1560"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"AutoCompleteTextViewAdapter.getView calls contact.phoneNumbers.first() with no empty check. A SimpleContact with an empty phoneNumbers list (possible for contacts surfaced by name match in the filter, which only checks doesContainPhoneNumber OR name.contains) throws NoSuchElementException during binding of the dropdown row.","fix":"Use phoneNumbers.firstOrNull()?.normalizedNumber.orEmpty().","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/adapters/AutoCompleteTextViewAdapter.kt:42","code":"   42 |                 itemContactNumber.text = contact.phoneNumbers.first().normalizedNumber","lines":1,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/adapters/AutoCompleteTextViewAdapter.kt#L42"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"ThreadAdapter received-message photo click does `message.getSender()!!` then `.phoneNumbers.first()`. getSender() can return null (participants empty), and even when non-null phoneNumbers may be empty, so the click handler can throw NPE or NoSuchElementException.","fix":"Null-check getSender() and use phoneNumbers.firstOrNull() before launching the contact lookup.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/adapters/ThreadAdapter.kt:419-426","code":"  419 |             threadMessageSenderPhoto.setOnClickListener {\n  420 |                 val contact = message.getSender()!!\n  421 |                 activity.getContactFromAddress(contact.phoneNumbers.first().normalizedNumber) {\n  422 |                     if (it != null) {\n  423 |                         activity.startContactDetailsIntent(it)\n  424 |                     }\n  425 |                 }\n  426 |             }","lines":8,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/adapters/ThreadAdapter.kt#L419-L426"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`getSenderOrReceiverPhoneNumbers()` calls `it.phoneNumbers.first().value` for every participant of an outgoing message. `SimpleContact.phoneNumbers` is a list that can be empty (e.g. a group-conversation participant resolved without a phone number), in which case `first()` throws NoSuchElementException and the Message Details dialog crashes.","fix":"Use `it.phoneNumbers.firstOrNull()?.value.orEmpty()` (or skip participants with no number) instead of `it.phoneNumbers.first().value`.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/dialogs/MessageDetailsDialog.kt:47-50","code":"   47 |             participants.joinToString(\", \") {\n   48 |                 formatContactInfo(it.name, it.phoneNumbers.first().value)\n   49 |             }\n   50 |         }","lines":4,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/dialogs/MessageDetailsDialog.kt#L47-L50"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`compressImage` uses several non-null assertions on operations that legitimately return null: `contentResolver.getType(uri)!!` (line 41) and `contentResolver.openInputStream(uri)?.readBytes()!!` (line 43). For an unreadable/unknown URI these throw NPE. They are inside the outer try/catch so the app does not crash, but the catch maps every failure to `callback.invoke(null)`, masking distinct error conditions. More importantly, `openInputStream(uri)?.readBytes()` reads the entire image into memory before compression even begins, defeating the point of compression for very large images and risking OOM.","fix":"Handle null mimeType/stream explicitly and avoid reading the whole file into a byte array; decode bounds first or copy via streams.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/helpers/ImageCompressor.kt:39-46","code":"   39 |                 val fileSize = context.getFileSizeFromUri(uri)\n   40 |                 if (fileSize > compressSize) {\n   41 |                     val mimeType = contentResolver.getType(uri)!!\n   42 |                     if (mimeType.isImageMimeType()) {\n   43 |                         val byteArray = contentResolver.openInputStream(uri)?.readBytes()!!\n   44 |                         var imageFile = File(outputDirectory, System.currentTimeMillis().toString().plus(mimeType.getExtensionFromMimeType()))\n   45 |                         imageFile.writeBytes(byteArray)\n   46 |                         val bitmap = loadBitmap(imageFile)","lines":8,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/helpers/ImageCompressor.kt#L39-L46"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"XmlPullParser.readSms() parses several attributes with non-null `toLong()`/`toInt()` on the result of `getAttributeValue(...)`. If any of the attributes (`date`, `locked`, `read`, `status`, `type`) is missing the value is null and `.toLong()`/`.toInt()` throws NPE, and if present but non-numeric it throws NumberFormatException. These construct the SmsBackup model from arbitrary external XML. The per-`<sms>` try/catch in importXml catches it (counting it as failed), so it is not fatal, but malformed input silently drops every affected message rather than handling it gracefully.","fix":"Use null-safe parsing with defaults, e.g. `getAttributeValue(null, \"date\")?.toLongOrNull() ?: 0L` and `...?.toIntOrNull() ?: 0`.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/helpers/MessagesImporter.kt:174-186","code":"  174 |         return SmsBackup(\n  175 |             subscriptionId = 0,\n  176 |             address = getAttributeValue(null, \"address\"),\n  177 |             body = getAttributeValue(null, \"body\"),\n  178 |             date = getAttributeValue(null, \"date\").toLong(),\n  179 |             dateSent = getAttributeValue(null, \"date\").toLong(),\n  180 |             locked = getAttributeValue(null, \"locked\").toInt(),\n  181 |             protocol = getAttributeValue(null, \"protocol\"),\n  182 |             read = getAttributeValue(null, \"read\").toInt(),\n  183 |             status = getAttributeValue(null, \"status\").toInt(),\n  184 |             type = getAttributeValue(null, \"type\").toInt(),\n  185 |             serviceCenter = getAttributeValue(null, \"service_center\")\n  186 |         )","lines":13,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/helpers/MessagesImporter.kt#L174-L186"}]},
{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"MmsReceiver.handleMmsMessage dereferences `mms.attachment!!.attachments.first()` with a not-null assertion on attachment and `.first()` on the attachments list. A received MMS with no attachment (e.g. text-only MMS, or a notification-only / undownloaded MMS) makes attachment null (NPE) or the attachments list empty (NoSuchElementException). Although the Glide block is wrapped in try/catch (only catching Exception around the .get()), the `mms.attachment!!` and `.first()` evaluation happen inside building the load() argument and would be caught here, but the resulting null bitmap path is fine - the real risk is the attachment!! assertion when attachment is genuinely null.","fix":"Use safe access: `mms.attachment?.attachments?.firstOrNull()?.getUri()` and skip the Glide load when null.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/receivers/MmsReceiver.kt:69-78","code":"   69 |         val glideBitmap = try {\n   70 |             Glide.with(context)\n   71 |                 .asBitmap()\n   72 |                 .load(mms.attachment!!.attachments.first().getUri())\n   73 |                 .centerCrop()\n   74 |                 .into(size, size)\n   75 |                 .get()\n   76 |         } catch (e: Exception) {\n   77 |             null\n   78 |         }","lines":10,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/receivers/MmsReceiver.kt#L69-L78"}]},
{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"In both SmsStatusSentReceiver.updateAppDatabase and SmsStatusDeliveredReceiver.updateAppDatabase, the message id is parsed with `messageUri.lastPathSegment?.toLong() ?: 0L`. String.toLong() throws NumberFormatException if the last path segment is not a valid number. The send/delivery status intent's data URI is constructed in SmsSender as `Uri.parse(\"${Sms.CONTENT_URI}/${messageId}\")`, so normally it is numeric, but any malformed/unexpected URI (or a content URI whose last segment is not the id) will crash the receiver. The `?: 0L` only guards a null segment, not a non-numeric one. Use toLongOrNull().","fix":"Use `messageUri.lastPathSegment?.toLongOrNull() ?: 0L` (and ideally skip processing when 0L).","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/receivers/SmsStatusSentReceiver.kt:44-46","code":"   44 |         val messageUri = intent.data\n   45 |         if (messageUri != null) {\n   46 |             val messageId = messageUri.lastPathSegment?.toLong() ?: 0L","lines":3,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/receivers/SmsStatusSentReceiver.kt#L44-L46"},{"ref":"app/src/main/kotlin/org/fossify/messages/receivers/SmsStatusDeliveredReceiver.kt:89-91","code":"   89 |         val messageUri: Uri? = intent.data\n   90 |         if (messageUri != null) {\n   91 |             val messageId = messageUri.lastPathSegment?.toLong() ?: 0L","lines":3,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/receivers/SmsStatusDeliveredReceiver.kt#L89-L91"}]},
{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"SimpleContact.loadIcon: BitmapFactory.decodeStream can return null (corrupt/unsupported image or null stream), and the null bitmap is then passed to IconCompat.createWithAdaptiveBitmap which throws on a null/invalid bitmap. This is caught by the surrounding catch which falls back to the letter icon, so the behavior is correct, but the success path can silently throw on every decode failure (using exceptions for control flow). Also the stream is closed with stream?.close() outside a finally, so a decode failure leaks the stream until GC.","fix":"Use the stream in a `use { }` block and null-check the decoded bitmap, falling back to the letter icon explicitly instead of via the catch.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/extensions/SimpleContact.kt:39-51","code":"   39 | fun SimpleContact.loadIcon(context: Context): IconCompat {\n   40 |     try {\n   41 |         val stream = context.contentResolver.openInputStream(photoUri.toUri())\n   42 |         val bitmap = BitmapFactory.decodeStream(stream)\n   43 |         stream?.close()\n   44 |         val iconCompat = IconCompat.createWithAdaptiveBitmap(bitmap)\n   45 |         return iconCompat\n   46 |     } catch (e: Exception) {\n   47 |         return IconCompat.createWithAdaptiveBitmap(\n   48 |             SimpleContactsHelper(context).getContactLetterIcon(name)\n   49 |         )\n   50 |     }\n   51 | }","lines":13,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/extensions/SimpleContact.kt#L39-L51"}]},
{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`AttachmentUtils.parseAttachmentNames` parses untrusted SMIL text from MMS parts and offers no exception handling. `parser.nextTag()` / `require(...)` throw XmlPullParserException on malformed SMIL, `parser.getAttributeValue(null, \"src\")` can add null into the names list (the list is `MutableList<String>` so a null src is stored as null), and `skip` throws IllegalStateException if the parser is in an unexpected state. Callers must wrap this; if any caller does not, malformed MMS SMIL crashes.","fix":"Guard against null `src` (filter nulls) and document/ensure all callers handle XmlPullParserException; consider catching parse errors and returning emptyList().","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/helpers/AttachmentUtils.kt:17-69","code":"   17 |     fun parseAttachmentNames(text: String): List<String> {\n   18 |         val parser = Xml.newPullParser()\n   19 |         parser.setFeature(XmlPullParser.FEATURE_PROCESS_NAMESPACES, false)\n   20 |         parser.setInput(text.reader())\n   21 |         parser.nextTag()\n   22 |         return readSmil(parser)\n   23 |     }\n   24 | \n   25 |     private fun readSmil(parser: XmlPullParser): List<String> {\n   26 |         parser.require(XmlPullParser.START_TAG, null, \"smil\")\n   27 |         while (parser.next() != XmlPullParser.END_TAG) {\n   28 |             if (parser.eventType != XmlPullParser.START_TAG) {\n   29 |                 continue\n   30 |             }\n   31 | \n   32 |             if (parser.name == \"body\") {\n   33 |                 return readBody(parser)\n   34 |             } else {\n   35 |                 skip(parser)\n   36 |             }\n   37 |         }\n   38 | \n   39 |         return emptyList()\n   40 |     }\n   41 | \n   42 |     private fun readBody(parser: XmlPullParser): List<String> {\n   43 |         val names = mutableListOf<String>()\n   44 |         parser.require(XmlPullParser.START_TAG, null, \"body\")\n   45 |         while (parser.next() != XmlPullParser.END_TAG) {\n   46 |             if (parser.eventType != XmlPullParser.START_TAG) {\n   47 |                 continue\n   48 |             }\n   49 | \n   50 |             if (parser.name == \"par\") {\n   51 |                 parser.require(XmlPullParser.START_TAG, null, \"par\")\n   52 |                 while (parser.next() != XmlPullParser.END_TAG) {\n   53 |                     if (parser.eventType != XmlPullParser.START_TAG) {\n   54 |                         continue\n   55 |                     }\n   56 | \n   57 |                     if (parser.name in ELEMENT_TAGS) {\n   58 |                         names.add(parser.getAttributeValue(null, \"src\"))\n   59 |                         skip(parser)\n   60 |                     } else {\n   61 |                         skip(parser)\n   62 |                     }\n   63 |                 }\n   64 |             } else {\n   65 |                 skip(parser)\n   66 |             }\n   67 |         }\n   68 |         return names\n   69 |     }","lines":53,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/helpers/AttachmentUtils.kt#L17-L69"}]},
{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"getAttachmentsDir() creates and reuses cacheDir/attachments and launchCapturePhotoIntent / addContactAttachment write temp files (attachment_*.jpg, <contactId>.vcf) there, but nothing ever deletes them. Captured photos and exported vCards accumulate in the cache directory indefinitely (until the OS reclaims cache), wasting storage over time.","fix":"Clean up the attachments cache dir on send/discard (e.g. in clearCurrentMessage or onDestroy), or delete each temp file once it has been consumed.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/activities/ThreadActivity.kt:1413-1428","code":" 1413 |     private fun getAttachmentsDir(): File {\n 1414 |         return File(cacheDir, \"attachments\").apply {\n 1415 |             if (!exists()) {\n 1416 |                 mkdirs()\n 1417 |             }\n 1418 |         }\n 1419 |     }\n 1420 | \n 1421 |     private fun launchCapturePhotoIntent() {\n 1422 |         val imageFile = File.createTempFile(\"attachment_\", \".jpg\", getAttachmentsDir())\n 1423 |         capturedImageUri = getMyFileUri(imageFile)\n 1424 |         val intent = Intent(MediaStore.ACTION_IMAGE_CAPTURE).apply {\n 1425 |             putExtra(MediaStore.EXTRA_OUTPUT, capturedImageUri)\n 1426 |         }\n 1427 |         launchActivityForResult(intent, CAPTURE_PHOTO_INTENT)\n 1428 |     }","lines":16,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/activities/ThreadActivity.kt#L1413-L1428"},{"ref":"app/src/main/kotlin/org/fossify/messages/activities/ThreadActivity.kt:1456-1481","code":" 1456 |     private fun addContactAttachment(contactUri: Uri) {\n 1457 |         ensureBackgroundThread {\n 1458 |             val contact = ContactsHelper(this).getContactFromUri(contactUri)\n 1459 |             if (contact != null) {\n 1460 |                 val outputFile = File(getAttachmentsDir(), \"${contact.contactId}.vcf\")\n 1461 |                 val outputStream = outputFile.outputStream()\n 1462 | \n 1463 |                 VcfExporter().exportContacts(\n 1464 |                     activity = this,\n 1465 |                     outputStream = outputStream,\n 1466 |                     contacts = arrayListOf(contact),\n 1467 |                     showExportingToast = false,\n 1468 |                 ) {\n 1469 |                     if (it == ExportResult.EXPORT_OK) {\n 1470 |                         val vCardUri = getMyFileUri(outputFile)\n 1471 |                         runOnUiThread {\n 1472 |                             addAttachment(vCardUri)\n 1473 |                         }\n 1474 |                     } else {\n 1475 |                         toast(org.fossify.commons.R.string.unknown_error_occurred)\n 1476 |                     }\n 1477 |                 }\n 1478 |             } else {\n 1479 |                 toast(org.fossify.commons.R.string.unknown_error_occurred)\n 1480 |             }\n 1481 |         }","lines":26,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/activities/ThreadActivity.kt#L1456-L1481"}]},
{"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"loadIcon closes the InputStream with `stream?.close()` only on the happy path (line 44). If BitmapFactory.decodeStream throws before reaching the close, the stream is never closed (it is not in a finally/use block), leaking the file descriptor.","fix":"Open the stream with `.use { }` so it is closed even when decoding throws.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/extensions/SimpleContact.kt:40-45","code":"   40 |     try {\n   41 |         val stream = context.contentResolver.openInputStream(photoUri.toUri())\n   42 |         val bitmap = BitmapFactory.decodeStream(stream)\n   43 |         stream?.close()\n   44 |         val iconCompat = IconCompat.createWithAdaptiveBitmap(bitmap)\n   45 |         return iconCompat","lines":6,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/extensions/SimpleContact.kt#L40-L45"}]},
{"id":"MEM_3","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"`compressImage` writes intermediate files into the `cacheDir/compressed` directory (named with `System.currentTimeMillis()`) but never deletes the final returned file or older temp files. `overWrite` deletes the previous iteration's file, but the last surviving compressed file is returned via `getMyFileUri` and left in the cache directory indefinitely. Repeated compression accumulates files in the cache dir.","fix":"Periodically clean the `compressed` cache directory (e.g. on app start or after the attachment is consumed/sent).","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/helpers/ImageCompressor.kt:26-30","code":"   26 |     private val outputDirectory = File(context.cacheDir, \"compressed\").apply {\n   27 |         if (!exists()) {\n   28 |             mkdirs()\n   29 |         }\n   30 |     }","lines":5,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/helpers/ImageCompressor.kt#L26-L30"},{"ref":"app/src/main/kotlin/org/fossify/messages/helpers/ImageCompressor.kt:44-81","code":"   44 |                         var imageFile = File(outputDirectory, System.currentTimeMillis().toString().plus(mimeType.getExtensionFromMimeType()))\n   45 |                         imageFile.writeBytes(byteArray)\n   46 |                         val bitmap = loadBitmap(imageFile)\n   47 |                         val format = if (lossy) {\n   48 |                             Bitmap.CompressFormat.JPEG\n   49 |                         } else {\n   50 |                             imageFile.path.getCompressionFormat()\n   51 |                         }\n   52 | \n   53 |                         // This quality approximation mostly works for smaller images but will fail with larger images.\n   54 |                         val compressionRatio = compressSize / fileSize.toDouble()\n   55 |                         val quality = maxOf((compressionRatio * 100).roundToInt(), minQuality)\n   56 |                         imageFile = overWrite(imageFile, bitmap, format = format, quality = quality)\n   57 | \n   58 |                         // Even the highest quality images start to look ugly if we use 10 as the minimum quality,\n   59 |                         // so we better save some image quality and change resolution instead. This is time consuming\n   60 |                         // and mostly needed for very large images. Since there's no reliable way to predict the\n   61 |                         // required resolution, we'll just iterate and find the best result.\n   62 |                         if (imageFile.length() > compressSize) {\n   63 |                             var scaledWidth = bitmap.width\n   64 |                             var scaledHeight = bitmap.height\n   65 | \n   66 |                             while (imageFile.length() > compressSize) {\n   67 |                                 scaledWidth = (scaledWidth * scaleStepFactor).roundToInt()\n   68 |                                 scaledHeight = (scaledHeight * scaleStepFactor).roundToInt()\n   69 |                                 if (scaledHeight < minResolution && scaledWidth < minResolution) {\n   70 |                                     break\n   71 |                                 }\n   72 | \n   73 |                                 imageFile = decodeSampledBitmapFromFile(imageFile, scaledWidth, scaledHeight).run {\n   74 |                                     determineImageRotation(imageFile, bitmap = this).run {\n   75 |                                         overWrite(imageFile, bitmap = this, format = format, quality = quality)\n   76 |                                     }\n   77 |                                 }\n   78 |                             }\n   79 |                         }\n   80 | \n   81 |                         callback.invoke(context.getMyFileUri(imageFile))","lines":38,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/helpers/ImageCompressor.kt#L44-L81"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"Conversation.date and Message.date store the timestamp as `Int` seconds. `millis()` computes `date * 1000L` and MessageDetailsDialog builds `DateTime(date * 1000L)`. Although `* 1000L` is computed in Long (no multiply overflow), storing the epoch as a 32-bit `Int` of seconds overflows in January 2038 (Int max ~2.1e9 seconds). All date handling for messages/conversations is therefore subject to the Year-2038 problem.","fix":"Migrate the `date` columns to `Long` seconds (or millis). This is a schema change requiring a Room migration.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/models/Message.kt:23","code":"   23 |     @ColumnInfo(name = \"date\") val date: Int,","lines":1,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/models/Message.kt#L23"},{"ref":"app/src/main/kotlin/org/fossify/messages/models/Message.kt:37","code":"   37 |     fun millis() = date * 1000L","lines":1,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/models/Message.kt#L37"},{"ref":"app/src/main/kotlin/org/fossify/messages/models/Conversation.kt:12","code":"   12 |     @ColumnInfo(name = \"date\") var date: Int,","lines":1,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/models/Conversation.kt#L12"},{"ref":"app/src/main/kotlin/org/fossify/messages/dialogs/MessageDetailsDialog.kt:74-76","code":"   74 |     private fun Message.getSentOrReceivedAt(): String {\n   75 |         return DateTime(date * 1000L).toString(\"${activity.config.dateFormat} ${activity.getTimeFormatWithSeconds()}\")\n   76 |     }","lines":3,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/dialogs/MessageDetailsDialog.kt#L74-L76"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"sendScheduledMessage wraps its body in try/catch but the actual work runs inside ensureBackgroundThread {}. The try/catch returns immediately after scheduling the background task, so any exception thrown on the background thread is NOT caught by this catch block and will crash the app. The catch is effectively dead for the real work.","fix":"Move the try/catch inside the ensureBackgroundThread lambda (and post showErrorToast via runOnUiThread), or remove the outer catch and handle errors within the background block.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/activities/ThreadActivity.kt:1642-1674","code":" 1642 |         try {\n 1643 |             ensureBackgroundThread {\n 1644 |                 val messageId = scheduledMessage?.id ?: generateRandomId()\n 1645 |                 val message = buildScheduledMessage(text, subscriptionId, messageId)\n 1646 |                 if (messages.isEmpty()) {\n 1647 |                     // create a temporary thread until a real message is sent\n 1648 |                     threadId = message.threadId\n 1649 |                     createTemporaryThread(message, message.threadId, conversation)\n 1650 |                 }\n 1651 |                 val conversation = conversationsDB.getConversationWithThreadId(threadId)\n 1652 |                 if (conversation != null) {\n 1653 |                     val nowSeconds = (System.currentTimeMillis() / 1000).toInt()\n 1654 |                     conversationsDB.insertOrUpdate(\n 1655 |                         conversation.copy(\n 1656 |                             date = nowSeconds,\n 1657 |                             snippet = message.body\n 1658 |                         )\n 1659 |                     )\n 1660 |                 }\n 1661 |                 scheduleMessage(message)\n 1662 |                 insertOrUpdateMessage(message)\n 1663 | \n 1664 |                 runOnUiThread {\n 1665 |                     clearCurrentMessage()\n 1666 |                     hideScheduleSendUi()\n 1667 |                     scheduledMessage = null\n 1668 |                 }\n 1669 |             }\n 1670 |         } catch (e: Exception) {\n 1671 |             showErrorToast(\n 1672 |                 e.localizedMessage ?: getString(org.fossify.commons.R.string.unknown_error_occurred)\n 1673 |             )\n 1674 |         }","lines":33,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/activities/ThreadActivity.kt#L1642-L1674"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"Conversation selection keys are derived from `Conversation.hashCode()` (a data class with many MUTABLE fields: read, snippet, date, unreadCount, title, etc). The selection machinery stores `it.hashCode()` in `selectedKeys` and later re-resolves items by `currentList.indexOfFirst { it.hashCode() == key }` / `currentList.filter { selectedKeys.contains(it.hashCode()) }`. As soon as any selected conversation's content changes (e.g. a new message arrives, marking read/unread, unreadCount update) its hashCode changes, so the stored key no longer matches and the selection is silently lost or mis-resolved (getItemKeyPosition returns -1). This makes multi-select unreliable across refreshes.","fix":"Use a stable immutable identifier (threadId) as the selection key instead of the mutable data-class hashCode, for both getItemSelectionKey/getItemKeyPosition and the selectedKeys.contains(it.hashCode()) filters.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/adapters/BaseConversationsAdapter.kt:95-103","code":"   95 |     protected fun getSelectedItems() = currentList.filter {\n   96 |         selectedKeys.contains(it.hashCode())\n   97 |     } as ArrayList<Conversation>\n   98 | \n   99 |     override fun getIsItemSelectable(position: Int) = true\n  100 | \n  101 |     override fun getItemSelectionKey(position: Int) = currentList.getOrNull(position)?.hashCode()\n  102 | \n  103 |     override fun getItemKeyPosition(key: Int) = currentList.indexOfFirst { it.hashCode() == key }","lines":9,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/adapters/BaseConversationsAdapter.kt#L95-L103"},{"ref":"app/src/main/kotlin/org/fossify/messages/adapters/ConversationsAdapter.kt:179","code":"  179 |             currentList.filter { selectedKeys.contains(it.hashCode()) } as ArrayList<Conversation>","lines":1,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/adapters/ConversationsAdapter.kt#L179"},{"ref":"app/src/main/kotlin/org/fossify/messages/models/Conversation.kt:9-22","code":"    9 | data class Conversation(\n   10 |     @PrimaryKey @ColumnInfo(name = \"thread_id\") var threadId: Long,\n   11 |     @ColumnInfo(name = \"snippet\") var snippet: String,\n   12 |     @ColumnInfo(name = \"date\") var date: Int,\n   13 |     @ColumnInfo(name = \"read\") var read: Boolean,\n   14 |     @ColumnInfo(name = \"title\") var title: String,\n   15 |     @ColumnInfo(name = \"photo_uri\") var photoUri: String,\n   16 |     @ColumnInfo(name = \"is_group_conversation\") var isGroupConversation: Boolean,\n   17 |     @ColumnInfo(name = \"phone_number\") var phoneNumber: String,\n   18 |     @ColumnInfo(name = \"is_scheduled\") var isScheduled: Boolean = false,\n   19 |     @ColumnInfo(name = \"uses_custom_title\") var usesCustomTitle: Boolean = false,\n   20 |     @ColumnInfo(name = \"archived\") var isArchived: Boolean = false,\n   21 |     @ColumnInfo(name = \"unread_count\") var unreadCount: Int = 0,\n   22 | ) {","lines":14,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/models/Conversation.kt#L9-L22"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"In ScheduledMessageReceiver.handleIntent, after sending a scheduled message the code deletes the temporary conversation row via `context.conversationsDB.deleteThreadId(messageId)`, but it passes the SCHEDULED_MESSAGE_ID instead of the THREAD_ID. ConversationsDao.deleteThreadId(threadId: Long) expects a thread id. The correct `threadId` is already available in the same function (read on the line above). As a result the temporary/dummy conversation created for the scheduled message is never deleted (or, by coincidence of id collision, the wrong conversation is deleted), leaving stale scheduled-conversation entries in the list.","fix":"Pass the thread id: `context.conversationsDB.deleteThreadId(threadId)` instead of `deleteThreadId(messageId)`.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/receivers/ScheduledMessageReceiver.kt:47-69","code":"   47 |     private fun handleIntent(context: Context, intent: Intent) {\n   48 |         val threadId = intent.getLongExtra(THREAD_ID, 0L)\n   49 |         val messageId = intent.getLongExtra(SCHEDULED_MESSAGE_ID, 0L)\n   50 |         val message = try {\n   51 |             context.messagesDB.getScheduledMessageWithId(threadId, messageId)\n   52 |         } catch (e: Exception) {\n   53 |             e.printStackTrace()\n   54 |             return\n   55 |         }\n   56 | \n   57 |         val addresses = message.participants.getAddresses()\n   58 |         val attachments = message.attachment?.attachments ?: emptyList()\n   59 | \n   60 |         try {\n   61 |             Handler(Looper.getMainLooper()).post {\n   62 |                 context.sendMessageCompat(message.body, addresses, message.subscriptionId, attachments)\n   63 |             }\n   64 | \n   65 |             // delete temporary conversation and message as it's already persisted to the telephony db now\n   66 |             context.deleteScheduledMessage(messageId)\n   67 |             context.conversationsDB.deleteThreadId(messageId)\n   68 |             refreshMessages()\n   69 |             refreshConversations()","lines":23,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/receivers/ScheduledMessageReceiver.kt#L47-L69"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"RenameConversationDialog updates the TextView text immediately and renames the conversation\non a background thread, but if conversation is null (the thread was deleted concurrently, or\nloaded for a scheduled-only conversation) the dialog is invoked with conversation!! which\nthrows NPE. setupTextViews is gated only by setupTextViews being called after the background\nload, but conversation can still be null there (getConversationWithThreadId returned null),\nand the click listener force-unwraps conversation!! at lines 156 and 160.","fix":"Guard the rename click listener on conversation != null (disable/hide editing when null), or\nuse conversation?.let { ... } instead of force-unwrapping.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/activities/ConversationDetailsActivity.kt:152-163","code":"  152 |             text = conversation?.title\n  153 |             setOnClickListener {\n  154 |                 RenameConversationDialog(\n  155 |                     this@ConversationDetailsActivity,\n  156 |                     conversation!!\n  157 |                 ) { title ->\n  158 |                     text = title\n  159 |                     ensureBackgroundThread {\n  160 |                         conversation = renameConversation(conversation!!, newTitle = title)\n  161 |                     }\n  162 |                 }\n  163 |             }","lines":12,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/activities/ConversationDetailsActivity.kt#L152-L163"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"setupEmptyRecycleBin() queries messagesDB.getArchivedCount() to populate recycleBinMessages,\nbut onResume() does NOT call setupEmptyRecycleBin() (it is only called once in the onResume\nlist - actually it IS in the list). However recycleBinMessages is read in the click handler;\nafter emptying, recycleBinMessages is reset to 0 on the UI thread BEFORE the background\nemptyMessagesRecycleBin() completes. If emptying fails the displayed count and the in-memory\ncounter are wrong, and a subsequent tap shows 'recycle bin empty' even though messages remain.","fix":"Reset recycleBinMessages and update the label inside the background thread after\nemptyMessagesRecycleBin() returns successfully (via runOnUiThread), rather than\noptimistically before the operation runs.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/activities/SettingsActivity.kt:379-416","code":"  379 |     private fun setupEmptyRecycleBin() = binding.apply {\n  380 |         ensureBackgroundThread {\n  381 |             recycleBinMessages = messagesDB.getArchivedCount()\n  382 |             runOnUiThread {\n  383 |                 settingsEmptyRecycleBinSize.text =\n  384 |                     resources.getQuantityString(\n  385 |                         R.plurals.delete_messages,\n  386 |                         recycleBinMessages,\n  387 |                         recycleBinMessages\n  388 |                     )\n  389 |             }\n  390 |         }\n  391 | \n  392 |         settingsEmptyRecycleBinHolder.setOnClickListener {\n  393 |             if (recycleBinMessages == 0) {\n  394 |                 toast(org.fossify.commons.R.string.recycle_bin_empty)\n  395 |             } else {\n  396 |                 ConfirmationDialog(\n  397 |                     activity = this@SettingsActivity,\n  398 |                     message = \"\",\n  399 |                     messageId = R.string.empty_recycle_bin_messages_confirmation,\n  400 |                     positive = org.fossify.commons.R.string.yes,\n  401 |                     negative = org.fossify.commons.R.string.no\n  402 |                 ) {\n  403 |                     ensureBackgroundThread {\n  404 |                         emptyMessagesRecycleBin()\n  405 |                     }\n  406 |                     recycleBinMessages = 0\n  407 |                     settingsEmptyRecycleBinSize.text =\n  408 |                         resources.getQuantityString(\n  409 |                             R.plurals.delete_messages,\n  410 |                             recycleBinMessages,\n  411 |                             recycleBinMessages\n  412 |                         )\n  413 |                 }\n  414 |             }\n  415 |         }\n  416 |     }","lines":38,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/activities/SettingsActivity.kt#L379-L416"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"isScheduledMessage can be true at send time but if scheduledDateTime was never initialized (lateinit var), sendScheduledMessage reads scheduledDateTime.millis. The flag is only set true from showScheduleMessageDialog which always sets scheduledDateTime first, but launchScheduleSendDialog / setupScheduleSendUi reference scheduledDateTime (lines 1897, 1549, 1867) in contexts where it could still be uninitialized, throwing UninitializedPropertyAccessException.","fix":"Initialize scheduledDateTime to a sane default (e.g. DateTime.now()) or make it nullable and guard each access.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/activities/ThreadActivity.kt:231","code":"  231 |     private lateinit var scheduledDateTime: DateTime","lines":1,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/activities/ThreadActivity.kt#L231"},{"ref":"app/src/main/kotlin/org/fossify/messages/activities/ThreadActivity.kt:1630-1635","code":" 1630 |     private fun sendScheduledMessage(text: String, subscriptionId: Int) {\n 1631 |         if (scheduledDateTime.millis < System.currentTimeMillis() + 1000L) {\n 1632 |             toast(R.string.must_pick_time_in_the_future)\n 1633 |             launchScheduleSendDialog(scheduledDateTime)\n 1634 |             return\n 1635 |         }","lines":6,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/activities/ThreadActivity.kt#L1630-L1635"},{"ref":"app/src/main/kotlin/org/fossify/messages/activities/ThreadActivity.kt:1994-1996","code":" 1994 |             setOnClickListener {\n 1995 |                 launchScheduleSendDialog(scheduledDateTime)\n 1996 |             }","lines":3,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897 {"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"AutoCompleteTextViewAdapter.getView decides whether to reuse convertView based on `listItem.tag != contact?.name?.isNotEmpty()` - i.e. the recycle key is merely a Boolean of 'does the name exist'. Since all real contacts have non-empty names, the tag is almost always `true`, so the branch effectively never re-inflates and convertView is always reused (correct here), but the condition is meaningless/misleading and would force a re-inflate every time a name happens to be empty. The tag carries no useful per-item identity.","fix":"Reuse convertView when non-null unconditionally (just `var listItem = convertView ?: inflate(...)`); drop the meaningless boolean tag.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/adapters/AutoCompleteTextViewAdapter.kt:20-27","code":"   20 |     override fun getView(position: Int, convertView: View?, parent: ViewGroup): View {\n   21 |         val contact = resultList.getOrNull(position)\n   22 |         var listItem = convertView\n   23 |         if (listItem == null || listItem.tag != contact?.name?.isNotEmpty()) {\n   24 |             listItem = ItemContactWithNumberBinding.inflate(LayoutInflater.from(activity), parent, false).root\n   25 |         }\n   26 | \n   27 |         listItem.tag = contact?.name?.isNotEmpty()","lines":8,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/adapters/AutoCompleteTextViewAdapter.kt#L20-L27"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"askConfirmDelete/askConfirmRestore compute the quantity string and the number of items to delete from `selectedKeys.size`, but the actual delete operates on getSelectedItems().filterIsInstance<Message>(). selectedKeys may contain keys that no longer resolve to a Message in the current list (stale selection), so the count shown to the user (itemsCnt) can differ from the number of messages actually deleted.","fix":"Base the count on the resolved selected messages (getSelectedItems().filterIsInstance<Message>().size) rather than selectedKeys.size.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/adapters/ThreadAdapter.kt:273-300","code":"  273 |     private fun askConfirmDelete() {\n  274 |         val itemsCnt = selectedKeys.size\n  275 | \n  276 |         // not sure how we can get UnknownFormatConversionException here, so show the error and hope that someone reports it\n  277 |         val items = try {\n  278 |             resources.getQuantityString(R.plurals.delete_messages, itemsCnt, itemsCnt)\n  279 |         } catch (e: Exception) {\n  280 |             activity.showErrorToast(e)\n  281 |             return\n  282 |         }\n  283 | \n  284 |         val baseString = if (activity.config.useRecycleBin && !isRecycleBin) {\n  285 |             org.fossify.commons.R.string.move_to_recycle_bin_confirmation\n  286 |         } else {\n  287 |             org.fossify.commons.R.string.deletion_confirmation\n  288 |         }\n  289 |         val question = String.format(resources.getString(baseString), items)\n  290 | \n  291 |         DeleteConfirmationDialog(activity, question, activity.config.useRecycleBin && !isRecycleBin) { skipRecycleBin ->\n  292 |             ensureBackgroundThread {\n  293 |                 val messagesToRemove = getSelectedItems()\n  294 |                 if (messagesToRemove.isNotEmpty()) {\n  295 |                     val toRecycleBin = !skipRecycleBin && activity.config.useRecycleBin && !isRecycleBin\n  296 |                     deleteMessages(messagesToRemove.filterIsInstance<Message>(), toRecycleBin, false)\n  297 |                 }\n  298 |             }\n  299 |         }\n  300 |     }","lines":28,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/adapters/ThreadAdapter.kt#L273-L300"},{"ref":"app/src/main/kotlin/org/fossify/messages/adapters/ThreadAdapter.kt:302-324","code":"  302 |     private fun askConfirmRestore() {\n  303 |         val itemsCnt = selectedKeys.size\n  304 | \n  305 |         // not sure how we can get UnknownFormatConversionException here, so show the error and hope that someone reports it\n  306 |         val items = try {\n  307 |             resources.getQuantityString(R.plurals.delete_messages, itemsCnt, itemsCnt)\n  308 |         } catch (e: Exception) {\n  309 |             activity.showErrorToast(e)\n  310 |             return\n  311 |         }\n  312 | \n  313 |         val baseString = R.string.restore_confirmation\n  314 |         val question = String.format(resources.getString(baseString), items)\n  315 | \n  316 |         ConfirmationDialog(activity, question) {\n  317 |             ensureBackgroundThread {\n  318 |                 val messagesToRestore = getSelectedItems()\n  319 |                 if (messagesToRestore.isNotEmpty()) {\n  320 |                     deleteMessages(messagesToRestore.filterIsInstance<Message>(), false, true)\n  321 |                 }\n  322 |             }\n  323 |         }\n  324 |     }","lines":23,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/adapters/ThreadAdapter.kt#L302-L324"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"getSelectedItems() selects any item whose `(it as? Message)?.getSelectionKey() ?: 0` is contained in selectedKeys. The fallback `?: 0` means: if selectedKeys ever contains 0 (a legitimate selection key, e.g. a Message whose getSelectionKey() computes to 0), every non-Message item (ThreadDateTime/ThreadError/ThreadSending/ThreadSent) in the list would also be treated as selected. The downstream filterIsInstance<Message>() masks the worst effects, but selectedKeys.size based counts (askConfirmDelete itemsCnt) and selection state become wrong.","fix":"Only test the key for actual Message items, e.g. filter { it is Message && selectedKeys.contains(it.getSelectionKey()) }, avoiding the `?: 0` collision.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/adapters/ThreadAdapter.kt:341-345","code":"  341 |     private fun getSelectedItems(): ArrayList<ThreadItem> {\n  342 |         return currentList.filter {\n  343 |             selectedKeys.contains((it as? Message)?.getSelectionKey() ?: 0)\n  344 |         } as ArrayList<ThreadItem>\n  345 |     }","lines":5,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/adapters/ThreadAdapter.kt#L341-L345"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"ManageBlockedKeywordsAdapter uses `blockedKeyword.hashCode()` of the String as the selection key. Two distinct blocked keywords with colliding String hashCodes (or, more practically, duplicate keyword strings) map to the same selection key. The overflow-menu path executeItemMenuOperation adds/removes that hashCode in selectedKeys and getSelectedItems() returns blockedKeywords.filter { selectedKeys.contains(it.hashCode()) } - so a popup action on one keyword would act on ALL keywords sharing that hashCode (e.g. duplicates), and copy/delete operate on the wrong/extra items.","fix":"Key selection by stable position/index or a unique id rather than String.hashCode(); deduplicate keywords on input.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/dialogs/ManageBlockedKeywordsAdapter.kt:48-50","code":"   48 |     override fun getItemSelectionKey(position: Int) = blockedKeywords.getOrNull(position)?.hashCode()\n   49 | \n   50 |     override fun getItemKeyPosition(key: Int) = blockedKeywords.indexOfFirst { it.hashCode() == key }","lines":3,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/dialogs/ManageBlockedKeywordsAdapter.kt#L48-L50"},{"ref":"app/src/main/kotlin/org/fossify/messages/dialogs/ManageBlockedKeywordsAdapter.kt:71","code":"   71 |     private fun getSelectedItems() = blockedKeywords.filter { selectedKeys.contains(it.hashCode()) }","lines":1,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/dialogs/ManageBlockedKeywordsAdapter.kt#L71"},{"ref":"app/src/main/kotlin/org/fossify/messages/dialogs/ManageBlockedKeywordsAdapter.kt:121-131","code":"  121 |     private fun executeItemMenuOperation(blockedKeywordId: Int, callback: () -> Unit) {\n  122 |         selectedKeys.add(blockedKeywordId)\n  123 |         callback()\n  124 |         selectedKeys.remove(blockedKeywordId)\n  125 |     }\n  126 | \n  127 |     private fun copyKeywordToClipboard() {\n  128 |         val selectedKeyword = getSelectedItems().firstOrNull() ?: return\n  129 |         activity.copyToClipboard(selectedKeyword)\n  130 |         finishActMode()\n  131 |     }","lines":11,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/dialogs/ManageBlockedKeywordsAdapter.kt#L121-L131"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Inconsistent date units passed from getMessages to getMMS. getMessages receives dateFrom in seconds and uses `dateFrom.toLong() * 1000` for the SMS query (line 133), but then passes the same raw `dateFrom` (seconds) to getMMS (line 197). getMMS treats dateFrom as MMS-native units with no scaling (lines 240/245, with a comment explicitly saying not to multiply by 1000). Since MMS DATE is in seconds this happens to line up, but the SMS and MMS paths are using two different interpretations of the same `dateFrom` argument, which is fragile and undocumented at the call site.","fix":"Document the unit contract of dateFrom explicitly, and make both paths derive their threshold from a single clearly-named seconds/millis value rather than two inline conversions.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/extensions/Context.kt:133-197","code":"  133 |     val rangeQuery = if (dateFrom == -1) \"\" else \"AND ${Sms.DATE} < ${dateFrom.toLong() * 1000}\"\n  134 |     val selection = \"${Sms.THREAD_ID} = ? $rangeQuery\"\n  135 |     val selectionArgs = arrayOf(threadId.toString())\n  136 |     val sortOrder = \"${Sms.DATE} DESC LIMIT $limit\"\n  137 | \n  138 |     val blockStatus = HashMap<String, Boolean>()\n  139 |     val blockedNumbers = getBlockedNumbers()\n  140 |     var messages = ArrayList<Message>()\n  141 |     queryCursor(uri, projection, selection, selectionArgs, sortOrder, showErrors = true) { cursor ->\n  142 |         val senderNumber = cursor.getStringValue(Sms.ADDRESS) ?: return@queryCursor\n  143 |         val isNumberBlocked = blockStatus.getOrPut(senderNumber) { isNumberBlocked(senderNumber, blockedNumbers) }\n  144 |         if (isNumberBlocked) {\n  145 |             return@queryCursor\n  146 |         }\n  147 | \n  148 |         val id = cursor.getLongValue(Sms._ID)\n  149 |         val body = cursor.getStringValue(
