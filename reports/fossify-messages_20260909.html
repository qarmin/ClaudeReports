       senderName = senderName,\n  191 |                 senderPhotoUri = photoUri,\n  192 |                 subscriptionId = subscriptionId\n  193 |             )\n  194 |         messages.add(message)\n  195 |     }\n  196 | \n  197 |     messages.addAll(getMMS(threadId, sortOrder, dateFrom))","lines":65,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/extensions/Context.kt#L133-L197"},{"ref":"app/src/main/kotlin/org/fossify/messages/extensions/Context.kt:238-247","code":"  238 |     if (threadId == null && dateFrom != -1) {\n  239 |         // Should not multiply 1000 here, because date in mms's database is different from sms's.\n  240 |         selection = \"${Sms.DATE} < ${dateFrom.toLong()}\"\n  241 |     } else if (threadId != null && dateFrom == -1) {\n  242 |         selection = \"${Sms.THREAD_ID} = ?\"\n  243 |         selectionArgs = arrayOf(threadId.toString())\n  244 |     } else if (threadId != null) {\n  245 |         selection = \"${Sms.THREAD_ID} = ? AND ${Sms.DATE} < ${dateFrom.toLong()}\"\n  246 |         selectionArgs = arrayOf(threadId.toString())\n  247 |     }","lines":10,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/extensions/Context.kt#L238-L247"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"getThreadSnippet compares SMS DATE against the MMS date with mismatched units. The SMS query uses `${Sms.DATE} > ?` with selectionArgs containing `latestMms?.date?.toString()`. SMS DATE is stored in milliseconds, but Message.date (and thus latestMms.date) is the MMS date which getMMS stores in seconds (line 254, `getLongValue(Mms.DATE).toInt()` with no /1000). So the threshold is ~1000x too small and effectively always matches, meaning the SMS body almost always overrides the MMS snippet regardless of which is actually newer.","fix":"Normalize both to the same unit before comparing (convert the MMS seconds value to milliseconds for the SMS DATE comparison, or compare both in seconds), then pick the newer of the two snippets.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/extensions/Context.kt:572-597","code":"  572 | fun Context.getThreadSnippet(threadId: Long): String {\n  573 |     val sortOrder = \"${Mms.DATE} DESC LIMIT 1\"\n  574 |     val latestMms = getMMS(threadId, sortOrder).firstOrNull()\n  575 |     var snippet = latestMms?.body ?: \"\"\n  576 | \n  577 |     val uri = Sms.CONTENT_URI\n  578 |     val projection = arrayOf(\n  579 |         Sms.BODY\n  580 |     )\n  581 | \n  582 |     val selection = \"${Sms.THREAD_ID} = ? AND ${Sms.DATE} > ?\"\n  583 |     val selectionArgs = arrayOf(\n  584 |         threadId.toString(),\n  585 |         latestMms?.date?.toString() ?: \"0\"\n  586 |     )\n  587 |     try {\n  588 |         val cursor = contentResolver.query(uri, projection, selection, selectionArgs, sortOrder)\n  589 |         cursor?.use {\n  590 |             if (cursor.moveToFirst()) {\n  591 |                 snippet = cursor.getStringValue(Sms.BODY)\n  592 |             }\n  593 |         }\n  594 |     } catch (_: Exception) {\n  595 |     }\n  596 |     return snippet\n  597 | }","lines":26,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/extensions/Context.kt#L572-L597"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`generateRandomId` seeds a new `Random(millis)` with the current epoch millis on every call. Two calls within the same millisecond (e.g. queueing several scheduled messages or failure notifications in a tight loop) produce the same seed and therefore the same \"random\" id, causing id collisions for scheduled messages / notification ids. Seeding Random with a wall-clock value defeats the purpose of randomness.","fix":"Use a shared `Random` instance (or `Random.Default` / `SecureRandom`) instead of re-seeding from `millis` each call.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/helpers/Constants.kt:111-116","code":"  111 | /** Not to be used with real messages persisted in the telephony db. This is for internal use only (e.g. scheduled messages, notification ids etc). */\n  112 | fun generateRandomId(length: Int = 9): Long {\n  113 |     val millis = DateTime.now(DateTimeZone.UTC).millis\n  114 |     val random = abs(Random(millis).nextLong())\n  115 |     return random.toString().takeLast(length).toLong()\n  116 | }","lines":6,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/helpers/Constants.kt#L111-L116"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The Android 14 subscriptionId workaround (resetting `subscriptionId = -1` so messages import on devices with a different SIM, see #191) is applied only in the JSON import path (`importJson`). The XML import path (`readSms`) always hard-codes `subscriptionId = 0` and never applies the isUpsideDownCakePlus() reset. XML-imported messages on Android 14+ can therefore hit the same import failure the workaround was meant to fix.","fix":"Apply the same subscriptionId normalization for XML-imported messages, or set subscriptionId to -1 in readSms when isUpsideDownCakePlus().","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/helpers/MessagesImporter.kt:60-71","code":"   60 |             val messages = if (isUpsideDownCakePlus()) {\n   61 |                 deserializedList.map { message ->\n   62 |                     // workaround for messages not being imported on Android 14 when the device\n   63 |                     // has a different subscriptionId (see #191)\n   64 |                     when (message) {\n   65 |                         is SmsBackup -> message.copy(subscriptionId = -1)\n   66 |                         is MmsBackup -> message.copy(subscriptionId = -1)\n   67 |                     }\n   68 |                 }\n   69 |             } else {\n   70 |                 deserializedList\n   71 |             }","lines":12,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/helpers/MessagesImporter.kt#L60-L71"},{"ref":"app/src/main/kotlin/org/fossify/messages/helpers/MessagesImporter.kt:174-186","code":"  174 |         return SmsBackup(\n  175 |             subscriptionId = 0,\n  176 |             address = getAttributeValue(null, \"address\"),\n  177 |             body = getAttributeValue(null, \"body\"),\n  178 |             date = getAttributeValue(null, \"date\").toLong(),\n  179 |             dateSent = getAttributeValue(null, \"date\").toLong(),\n  180 |             locked = getAttributeValue(null, \"locked\").toInt(),\n  181 |             protocol = getAttributeValue(null, \"protocol\"),\n  182 |             read = getAttributeValue(null, \"read\").toInt(),\n  183 |             status = getAttributeValue(null, \"status\").toInt(),\n  184 |             type = getAttributeValue(null, \"type\").toInt(),\n  185 |             serviceCenter = getAttributeValue(null, \"service_center\")\n  186 |         )","lines":13,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/helpers/MessagesImporter.kt#L174-L186"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"ScheduledMessageReceiver.handleIntent dispatches the actual send onto the main thread via Handler(Looper.getMainLooper()).post { sendMessageCompat(...) }, then immediately proceeds to delete the scheduled message/conversation and refresh, all OUTSIDE that posted block. The deletion therefore runs before (and independently of) the send actually executing, and the try/catch surrounding the block cannot catch exceptions thrown by sendMessageCompat (they occur later on the main thread). If the send fails, the scheduled message has already been deleted, so it is lost with no failed-status record. Posting a blocking send to the main thread is also questionable since the receiver is already on a background thread (ensureBackgroundThread) holding a wakelock.","fix":"Call sendMessageCompat directly on the background thread (no main-thread post), and only delete the scheduled message/conversation after a successful send, so failures are catchable and the message is not lost.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/receivers/ScheduledMessageReceiver.kt:60-77","code":"   60 |         try {\n   61 |             Handler(Looper.getMainLooper()).post {\n   62 |                 context.sendMessageCompat(message.body, addresses, message.subscriptionId, attachments)\n   63 |             }\n   64 | \n   65 |             // delete temporary conversation and message as it's already persisted to the telephony db now\n   66 |             context.deleteScheduledMessage(messageId)\n   67 |             context.conversationsDB.deleteThreadId(messageId)\n   68 |             refreshMessages()\n   69 |             refreshConversations()\n   70 |         } catch (e: Exception) {\n   71 |             context.showErrorToast(e)\n   72 |         } catch (e: Error) {\n   73 |             context.showErrorToast(\n   74 |                 e.localizedMessage ?: context.getString(org.fossify.commons.R.string.unknown_error_occurred)\n   75 |             )\n   76 |         }\n   77 |     }","lines":18,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/receivers/ScheduledMessageReceiver.kt#L60-L77"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"participants is a lateinit var assigned only inside the background thread in onCreate. If the\nbackground work has not completed (or the activity is recreated and onResume runs before the\nbackground block finishes), any code path reaching setupParticipants before assignment would\nthrow UninitializedPropertyAccessException. setupParticipants is only called from inside the\nsame background continuation so it is currently safe, but the lateinit + background assignment\nis fragile.","fix":"Initialize participants to an empty ArrayList by default instead of lateinit, so any\nunexpected early access degrades gracefully.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/activities/ConversationDetailsActivity.kt:41-69","code":"   41 |     private lateinit var participants: ArrayList<SimpleContact>\n   42 | \n   43 |     private val binding by viewBinding(ActivityConversationDetailsBinding::inflate)\n   44 | \n   45 |     override fun onCreate(savedInstanceState: Bundle?) {\n   46 |         super.onCreate(savedInstanceState)\n   47 |         setContentView(binding.root)\n   48 | \n   49 |         setupEdgeToEdge(padBottomSystem = listOf(binding.conversationDetailsNestedScrollview))\n   50 |         setupMaterialScrollListener(\n   51 |             scrollingView = binding.conversationDetailsNestedScrollview,\n   52 |             topAppBar = binding.conversationDetailsAppbar,\n   53 |         )\n   54 | \n   55 |         threadId = intent.getLongExtra(THREAD_ID, 0L)\n   56 |         ensureBackgroundThread {\n   57 |             conversation = conversationsDB.getConversationWithThreadId(threadId)\n   58 |             participants = if (conversation != null && conversation!!.isScheduled) {\n   59 |                 val message = messagesDB.getThreadMessages(conversation!!.threadId).firstOrNull()\n   60 |                 message?.participants ?: arr {"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In setupConversations, sortedConversations is recomputed and passed to updateConversations,\nbut the cached-first-run progress logic uses conversations.isEmpty() while the placeholder\ncallback uses currentList.isEmpty(). The progress vs placeholder decision relies on\nconfig.appRunCount == 1 which is only true for the very first run; on later runs with an\nempty DB and slow telephony load the user sees the 'no conversations found' placeholder\nimmediately instead of a loading state, which can look like data loss.","fix":"Show the loading placeholder whenever a telephony refresh is in progress and the cached list\nis empty, not only when appRunCount == 1.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/activities/MainActivity.kt:402-432","code":"  402 |     private fun setupConversations(\n  403 |         conversations: ArrayList<Conversation>,\n  404 |         cached: Boolean = false,\n  405 |     ) {\n  406 |         val sortedConversations = conversations\n  407 |             .sortedWith(\n  408 |                 compareByDescending<Conversation> {\n  409 |                     config.pinnedConversations.contains(it.threadId.toString())\n  410 |                 }.thenByDescending { it.date }\n  411 |             ).toMutableList() as ArrayList<Conversation>\n  412 | \n  413 |         if (cached && config.appRunCount == 1) {\n  414 |             // there are no cached conversations on the first run so we show the\n  415 |             // loading placeholder and progress until we are done loading from telephony\n  416 |             showOrHideProgress(conversations.isEmpty())\n  417 |         } else {\n  418 |             showOrHideProgress(false)\n  419 |             showOrHidePlaceholder(conversations.isEmpty())\n  420 |         }\n  421 | \n  422 |         try {\n  423 |             getOrCreateConversationsAdapter().apply {\n  424 |                 updateConversations(sortedConversations) {\n  425 |                     if (!cached) {\n  426 |                         showOrHidePlaceholder(currentList.isEmpty())\n  427 |                     }\n  428 |                 }\n  429 |             }\n  430 |         } catch (_: Exception) {\n  431 |         }\n  432 |     }","lines":31,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/activities/MainActivity.kt#L402-L432"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"setupConversations in MainActivity casts sortedWith(...).toMutableList() to\nArrayList<Conversation>. toMutableList() returns an ArrayList in the current stdlib so this\nworks, but the unchecked cast is not guaranteed by contract and the same unchecked cast\npattern is repeated for conversationsDB results (e.g. getNonArchived() as\nArrayList<Conversation>). If the DAO ever returns a non-ArrayList List, this throws\nClassCastException.","fix":"Use ArrayList(list) to construct a concrete ArrayList instead of casting, or change the\nfunction signatures to accept List<Conversation>.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/activities/MainActivity.kt:402-411","code":"  402 |     private fun setupConversations(\n  403 |         conversations: ArrayList<Conversation>,\n  404 |         cached: Boolean = false,\n  405 |     ) {\n  406 |         val sortedConversations = conversations\n  407 |             .sortedWith(\n  408 |                 compareByDescending<Conversation> {\n  409 |                     config.pinnedConversations.contains(it.threadId.toString())\n  410 |                 }.thenByDescending { it.date }\n  411 |             ).toMutableList() as ArrayList<Conversation>","lines":10,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/activities/MainActivity.kt#L402-L411"},{"ref":"app/src/main/kotlin/org/fossify/messages/activities/MainActivity.kt:289-313","code":"  289 |     private fun getCachedConversations() {\n  290 |         ensureBackgroundThread {\n  291 |             val conversations = try {\n  292 |                 conversationsDB.getNonArchived().toMutableList() as ArrayList<Conversation>\n  293 |             } catch (_: Exception) {\n  294 |                 ArrayList()\n  295 |             }\n  296 | \n  297 |             val archi {"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The 'use English' toggle calls exitProcess(0) immediately after persisting config.useEnglish.\nForce-killing the process is a heavy-handed way to apply a locale change and bypasses normal\nactivity teardown; any pending writes (e.g. SharedPreferences applied asynchronously) may be\nfine here because config uses commit, but abruptly killing the process is poor UX and can\nlose other unsaved state in the app.","fix":"Recreate the activity/task or use AppCompatDelegate locale APIs instead of exitProcess(0),\nor at minimum restart the launcher activity rather than killing the process.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/activities/SettingsActivity.kt:178-189","code":"  178 |     private fun setupUseEnglish() = binding.apply {\n  179 |         settingsUseEnglishHolder.beVisibleIf(\n  180 |             (config.wasUseEnglishToggled || Locale.getDefault().language != \"en\")\n  181 |                     && !isTiramisuPlus()\n  182 |         )\n  183 |         settingsUseEnglish.isChecked = config.useEnglish\n  184 |         settingsUseEnglishHolder.setOnClickListener {\n  185 |             settingsUseEnglish.toggle()\n  186 |             config.useEnglish = settingsUseEnglish.isChecked\n  187 |             exitProcess(0)\n  188 |         }\n  189 |     }","lines":12,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/activities/SettingsActivity.kt#L178-L189"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"setupSIMSelector appends discovered SIMs into the activity-level availableSIMCards list without clearing it first (line 1026). setupSIMSelector is called from setupCachedMessages, setupThread, and refreshMessages, so on each refresh the same SIM cards are appended again, duplicating entries and breaking the modulo cycling in the click handler (currentSIMCardIndex = (currentSIMCardIndex + 1) % availableSIMCards.size) and the sim-id label shown.","fix":"Call availableSIMCards.clear() at the start of setupSIMSelector before repopulating.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/activities/ThreadActivity.kt:1073-1081","code":" 1073 |         if (availableSIMs.size > 1) {\n 1074 |             availableSIMs.forEachIndexed { index, subscriptionInfo ->\n 1075 |                 var label = subscriptionInfo.displayName?.toString() ?: \"\"\n 1076 |                 if (subscriptionInfo.number?.isNotEmpty() == true) {\n 1077 |                     label += \" (${subscriptionInfo.number})\"\n 1078 |                 }\n 1079 |                 val simCard = SIMCard(index + 1, subscriptionInfo.subscriptionId, label)\n 1080 |                 availableSIMCards.add(simCard)\n 1081 |             }","lines":9,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/activities/ThreadActivity.kt#L1073-L1081"},{"ref":"app/src/main/kotlin/org/fossify/messages/activities/ThreadActivity.kt:1099-1111","code":" 1099 |             if (availableSIMCards.isNotEmpty()) {\n 1100 |                 binding.messageHolder.threadSelectSimIcon.setOnClickListener {\n 1101 |                     currentSIMCardIndex = (currentSIMCardIndex + 1) % availableSIMCards.size\n 1102 |                     val currentSIMCard = availableSIMCards[currentSIMCardIndex]\n 1103 |                     @SuppressLint {"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"copyNumberToClipboard uses conversation?.phoneNumber?.ifEmpty { ... } ?: return. If conversation is null the whole expression returns early (nothing copied) even though a participant phone number may be available; the participant fallback only fires when conversation is non-null but its phoneNumber is empty. The menu item visibility (copy_number) is gated on participants, not conversation, so a null conversation with valid participants yields a silent no-op.","fix":"Fall back to the participant number when conversation is null: (conversation?.phoneNumber?.ifEmpty { null }) ?: participants.firstOrNull()?.phoneNumbers?.firstOrNull()?.value ?: return.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/activities/ThreadActivity.kt:1233-1238","code":" 1233 |     private fun copyNumberToClipboard() {\n 1234 |         val phoneNumber = conversation?.phoneNumber\n 1235 |             ?.ifEmpty { participants.firstOrNull()?.phoneNumbers?.firstOrNull()?.value }\n 1236 |             ?: return\n 1237 |         copyToClipboard(phoneNumber)\n 1238 |     }","lines":6,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/activities/ThreadActivity.kt#L1233-L1238"}]},

ges/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/activities/ThreadActivity.kt#L1810-L1831"}]},
{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"AttachmentsAdapter performs image compression inside setupMediaPreview (called from onBindViewHolder). It mutates the shared `attachments` list (attachments.find { it.uri == ... }?.isPending = false, attachments.remove/addAttachment) from the Glide/compression callback. Because binding happens per scroll and the callback resolves asynchronously, a recycled holder can complete compression for an item that has since been removed or rebound, and addAttachment(copy(...)) re-submits the list mid-bind, risking duplicate/lost entries and 'cannot call submitList during layout' style inconsistencies.","fix":"Drive compression from the data layer (ViewModel) not from onBindViewHolder; key the result back to the attachment by identity and only mutate the list when the item still exists, off the bind path.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/adapters/AttachmentsAdapter.kt:121-170","code":"  121 |     private fun setupMediaPreview(binding: ItemAttachmentMediaPreviewBinding, attachment: AttachmentSelection) {\n  122 |         binding.apply {\n  123 |             mediaAttachmentHolder.background.applyColorFilter(primaryColor.darkenColor())\n  124 |             mediaAttachmentHolder.setOnClickListener {\n  125 |                 activity.launchViewIntent(attachment.uri, attachment.mimetype, attachment.filename)\n  126 |             }\n  127 | \n  128 |             removeAttachmentButtonHolder.removeAttachmentButton.apply {\n  129 |                 beVisible()\n  130 |                 background.applyColorFilter(primaryColor)\n  131 |                 setOnClickListener {\n  132 |                     removeAttachment(attachment)\n  133 |                 }\n  134 |             }\n  135 | \n  136 |             val compressImage = attachment.mimetype.isImageMimeType() && !attachment.mimetype.isGifMimeType()\n  137 |             if (compressImage && attachment.isPending && config.mmsFileSizeLimit != FILE_SIZE_NONE) {\n  138 |                 thumbnail.beGone()\n  139 |                 compressionProgress.beVisible()\n  140 | \n  141 |                 imageCompressor.compressImage(attachment.uri, config.mmsFileSizeLimit) { compressedUri ->\n  142 |                     activity.runOnUiThread {\n  143 |                         when (compressedUri) {\n  144 |                             attachment.uri -> {\n  145 |                                 attachments.find { it.uri == attachment.uri }?.isPending = false\n  146 |                                 loadMediaPreview(this, attachment)\n  147 |                             }\n  148 | \n  149 |                             null -> {\n  150 |                                 activity.toast(R.string.compress_error)\n  151 |                                 removeAttachment(attachment)\n  152 |                             }\n  153 | \n  154 |                             else -> {\n  155 |                                 attachments.remove(attachment)\n  156 |                                 addAttachment(attachment.copy(uri = compressedUri, isPending = false))\n  157 |                             }\n  158 |                         }\n  159 |                         onReady()\n  160 |                     }\n  161 |                 }\n  162 |             } else {\n  163 |                 if (attachment.isPending) {\n  164 |                     attachments.find { it.uri == attachment.uri }?.isPending = false\n  165 |                     onReady()\n  166 |                 }\n  167 |                 loadMediaPreview(this, attachment)\n  168 |             }\n  169 |         }\n  170 |     }","lines":50,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/adapters/AttachmentsAdapter.kt#L121-L170"}]},
{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"SearchResultsAdapter.updateItems decides whether to refresh by comparing ArrayList.hashCode() of old vs new results. Two different result lists can share a hashCode (or, conversely, equal-content lists differing only in highlight handled separately), so a genuinely changed result set with a colliding hashCode would not refresh. ContactsAdapter.updateContacts has the same hashCode-equality pattern.","fix":"Compare lists with structural equality (newItems != searchResults) or use DiffUtil/ListAdapter instead of hashCode comparison + notifyDataSetChanged.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/adapters/SearchResultsAdapter.kt:57-66","code":"   57 |     fun updateItems(newItems: ArrayList<SearchResult>, highlightText: String = \"\") {\n   58 |         if (newItems.hashCode() != searchResults.hashCode()) {\n   59 |             searchResults = newItems.clone() as ArrayList<SearchResult>\n   60 |             textToHighlight = highlightText\n   61 |             notifyDataSetChanged()\n   62 |         } else if (textToHighlight != highlightText) {\n   63 |             textToHighlight = highlightText\n   64 |             notifyDataSetChanged()\n   65 |         }\n   66 |     }","lines":10,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/adapters/SearchResultsAdapter.kt#L57-L66"},{"ref":"app/src/main/kotlin/org/fossify/messages/adapters/ContactsAdapter.kt:55-62","code":"   55 |     fun updateContacts(newContacts: ArrayList<SimpleContact>) {\n   56 |         val oldHashCode = contacts.hashCode()\n   57 |         val newHashCode = newContacts.hashCode()\n   58 |         if (newHashCode != oldHashCode) {\n   59 |             contacts = newContacts\n   60 |             notifyDataSetChanged()\n   61 |         }\n   62 |     }","lines":8,"link":"https://githu {"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"DiffUtil callbacks compare classes with `oldItem::class.java != newItem::class.java`. For Message (a Room data class) and the ThreadItem subclasses this is fine, but areContentsTheSame for ThreadSending returns `true` unconditionally - two different ThreadSending items (different messageId) that pass areItemsTheSame because messageId matched will never report a content change. That is acceptable for a static 'sending' row but means any future field on ThreadSending will silently never trigger a rebind.","fix":"If ThreadSending gains state, compare it; otherwise leave a comment that the row is intentionally static.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/adapters/ThreadAdapter.kt:656-665","code":"  656 |     override fun areContentsTheSame(oldItem: ThreadItem, newItem: ThreadItem): Boolean {\n  657 |         if (oldItem::class.java != newItem::class.java) return false\n  658 |         return when (oldItem) {\n  659 |             is ThreadSending -> true\n  660 |             is ThreadDateTime -> oldItem.simID == (newItem as ThreadDateTime).simID\n  661 |             is ThreadError -> oldItem.messageText == (newItem as ThreadError).messageText\n  662 |             is ThreadSent -> oldItem.delivered == (newItem as ThreadSent).delivered\n  663 |             is Message -> Message.areContentsTheSame(oldItem, newItem as Message)\n  664 |         }\n  665 |     }","lines":10,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/adapters/ThreadAdapter.kt#L656-L665"}]},
{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"ManageBlockedKeywordsAdapter uses `String.hashCode()` as the stable selection key for each keyword (getItemSelectionKey, getItemKeyPosition, selectedKeys membership checks, getSelectedItems). Two distinct keywords that hash-collide would share a selection key, causing the wrong row(s) to be selected/copied/deleted. getItemKeyPosition also returns the first matching index, so duplicate-hash keywords map to a single position.","fix":"Use a stable unique key (e.g. the item's index/position, or a generated id stored alongside each keyword) instead of String.hashCode().","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/dialogs/ManageBlockedKeywordsAdapter.kt:48-50","code":"   48 |     override fun getItemSelectionKey(position: Int) = blockedKeywords.getOrNull(position)?.hashCode()\n   49 | \n   50 |     override fun getItemKeyPosition(key: Int) = blockedKeywords.indexOfFirst { it.hashCode() == key }","lines":3,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/dialogs/ManageBlockedKeywordsAdapter.kt#L48-L50"},{"ref":"app/src/main/kotlin/org/fossify/messages/dialogs/ManageBlockedKeywordsAdapter.kt:71-76","code":"   71 |     private fun getSelectedItems() = blockedKeywords.filter { selectedKeys.contains(it.hashCode()) }\n   72 | \n   73 |     private fun setupView(view: View, blockedKeyword: String) {\n   74 |         ItemManageBlockedKeywordBinding.bind(view).apply {\n   75 |             root.setupViewBackground(activity)\n   76 |             manageBlockedKeywordHolder.isSelected = selectedKeys.contains(blockedKeyword.hashCode())","lines":6,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/dialogs/ManageBlockedKeywordsAdapter.kt#L71-L76"}]},
{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"ScheduleMessageDialog.validateDateTime() returns `true` when `dateTime` is null, because `dateTime?.isAfterNow == false` is `false` when dateTime is null. So a null date/time is treated as a valid future time. In showPreview the positive button calls `callback(dateTime)` after a passing validation, meaning a null dateTime could be passed to the callback as if it were a valid scheduled time.","fix":"Treat null as invalid, e.g. `return if (dateTime?.isAfterNow == true) true else { activity.toast(R.string.must_pick_time_in_the_future); false }`.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/dialogs/ScheduleMessageDialog.kt:198-205","code":"  198 |     private fun validateDateTime(): Boolean {\n  199 |         return if (dateTime?.isAfterNow == false) {\n  200 |             activity.toast(R.string.must_pick_time_in_the_future)\n  201 |             false\n  202 |         } else {\n  203 |             true\n  204 |         }\n  205 |     }","lines":8,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/dialogs/ScheduleMessageDialog.kt#L198-L205"}]},
{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"getMMS computes `participants` for each row (line 259) and only after building the message does `participants.forEach { contactsMap[it.rawId] = it }` to populate the cache (lines 294-296). But getThreadParticipants is itself called with the same contactsMap and also writes into MessagingCache.participantsCache keyed by threadId. The post-loop population of contactsMap by rawId is redundant with the work already done inside getThreadParticipants for cached threads, and for SMS-derived participants (rawId 0 in some paths) could collide on key 0.","fix":"Rely on getThreadParticipants' own caching, or ensure contactsMap is only populated with genuinely unique rawIds; avoid keying on rawId 0.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/extensions/Context.kt:259-296","code":"  259 |         val participants = getThreadParticipants(threadId, contactsMap)\n  260 | \n  261 |         val isMMS = true\n  262 |         val attachment = getMmsAttachment(mmsId)\n  263 |         val body = attachment.text\n  264 |         var senderNumber = \"\"\n  265 |         var senderName = \"\"\n  266 |         var senderPhotoUri = \"\"\n  267 | \n  268 |         if (type != Mms.MESSAGE_BOX_SENT && type != Mms.MESSAGE_BOX_FAILED) {\n  269 |             senderNumber = getMMSSender(mmsId)\n  270 |             val namePhoto = getNameAndPhotoFromPhoneNumber(senderNumber)\n  271 |             senderName = namePhoto.name\n  272 |             senderPhotoUri = namePhoto.photoUri ?: \"\"\n  273 |         }\n  274 | \n  275 |         val message =\n  276 |             Message(\n  277 |                 id = mmsId,\n  278 |                 body = body,\n  279 |                 type = type,\n  280 |                 status = status,\n  281 |                 participants = participants,\n  282 |                 date = date,\n  283 |                 read = read,\n  284 |                 threadId = threadId,\n  285 |                 isMMS = isMMS,\n  286 |                 attachment = attachment,\n  287 |                 senderPhoneNumber = senderNumber,\n  288 |                 senderName = senderName,\n  289 |                 senderPhotoUri = senderPhotoUri,\n  290 |                 subscriptionId = subscriptionId\n  291 |             )\n  292 |         messages.add(message)\n  293 | \n  294 |         participants.forEach {\n  295 |             contactsMap[it.rawId] = it\n  296 |         }","lines":38,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/extensions/Context.kt#L259-L296"}]},
{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"getConversations recurses into itself after setting config.isArchiveAvailable = false when it hits the 'no such column: archived' SQLiteException (line 452). On the retry, the previously-collected partial `conversations` list is discarded (a fresh recursive call builds a new one), which is correct, but there is no guard against repeated recursion if the condition re-triggers, and the recursive call re-runs getUnreadCountsByThread and getBlockedNumbers (two extra full queries) on every fallback.","fix":"Since config.isArchiveAvailable is now false the retry cannot re-trigger the same branch, but consider passing already-computed blockedNumbers/unreadMap into the retry to avoid redundant queries.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/extensions/Context.kt:446-458","code":"  446 |     } catch (sqliteException: SQLiteException) {\n  447 |         if (\n  448 |             sqliteException.message?.contains(\"no such column: archived\") == true\n  449 |             && archiveAvailable\n  450 |         ) {\n  451 |             config.isArchiveAvailable = false\n  452 |             return getConversations(threadId, privateContacts)\n  453 |         } else {\n  454 |             showErrorToast(sqliteException)\n  455 |         }\n  456 |     } catch (e: Exception) {\n  457 |         showErrorToast(e)\n  458 |     }","lines":13,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/extensions/Context.kt#L446-L458"}]},
{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`importBlockedKeywords` splits the file content on the delimiter without filtering blanks. If the file is empty (after trimEnd) or contains a trailing/leading delimiter, `split(\",\")` yields list entries containing empty strings (e.g. \"\" or \"a,,b\"). These empty strings are then added as blocked keywords. An empty blocked keyword makes `ReceiverUtils.isMessageFilteredOut` match every message (`body.contains(\"\")` is always true), silently blocking all incoming SMS. Also note `keywords.isNotEmpty()` is always true because split never returns an empty list, so the IMPORT_FAIL branch for empty content is unreachable.","fix":"Filter blanks: `.split(DELIMITER).map { it.trim() }.filter { it.isNotEmpty() }`, and treat an empty result as IMPORT_FAIL.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/helpers/BlockedKeywordsImporter.kt:18-30","code":"   18 |             val inputStream = File(path).inputStream()\n   19 |             val keywords = inputStream.bufferedReader().use {\n   20 |                 val content = it.readText().trimEnd().split(BLOCKED_KEYWORDS_EXPORT_DELIMITER)\n   21 |                 content\n   22 |             }\n   23 |             if (keywords.isNotEmpty()) {\n   24 |                 keywords.forEach { keyword: String ->\n   25 |                     activity.config.addBlockedKeyword(keyword)\n   26 |                 }\n   27 |                 ImportResult.IMPORT_OK\n   28 |             } else {\n   29 |                 ImportResult.IMPORT_FAIL\n   30 |             }","lines":13,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/helpers/BlockedKeywordsImporter.kt#L18-L30"},{"ref":"app/src/main/kotlin/org/fossify/messages/helpers/ReceiverUtils.kt:8-16","code":"    8 |     fun isMessageFilteredOut(context: Context, body: String): Boolean {\n    9 |         for (blockedKeyword in context.config.blockedKeywords) {\n   10 |             if (body.contains(blockedKeyword, ignoreCase = true)) {\n   11 |                 return true\n   12 |             }\n   13 |         }\n   14 | \n   15 |         return false\n   16 |     }","lines":9,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/helpers/ReceiverUtils.kt#L8-L16"}]},
{"id":"LOGIC_33","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`determineImageRotation` maps EXIF orientation 8 (ROTATE_270 / 90 CCW) to `postRotate(270f)`. ORIENTATION_ROTATE_270 means the image needs a 270-degree clockwise rotation to display correctly, which this does, but orientation values 2/4/5/7 (the mirrored/flipped variants) are ignored entirely, so flipped images are restored with wrong orientation. The `when` silently passes through unhandled orientations without comment.","fix":"Handle the mirrored EXIF orientation cases (2,4,5,7) with appropriate Matrix.postScale/postRotate, or document that only the common cases are supported.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/helpers/ImageCompressor.kt:124-134","code":"  124 |     private fun determineImageRotation(imageFile: File, bitmap: Bitmap): Bitmap {\n  125 |         val exif = ExifInterface(imageFile.absolutePath)\n  126 |         val orientation = exif.getAttributeInt(ExifInterface.TAG_ORIENTATION, 0)\n  127 |         val matrix = Matrix()\n  128 |         when (orientation) {\n  129 |             6 -> matrix.postRotate(90f)\n  130 |             3 -> matrix.postRotate(180f)\n  131 |             8 -> matrix.postRotate(270f)\n  132 |         }\n  133 |         return Bitmap.createBitmap(bitmap, 0, 0, bitmap.width, bitmap.height, matrix, true)\n  134 |     }","lines":11,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/helpers/ImageCompressor.kt#L124-L134"}]},
{"id":"LOGIC_34","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`isFileXml` only checks whether the first line starts with `<?xml`. A valid XML backup that omits the XML declaration (starts directly with `<smses>`) is misclassified as JSON and handed to `Json.decodeFromStream`, failing the import. Conversely the detection opens a second InputStream just to read one line (the file is then reopened for the actual import), doubling IO.","fix":"Detect XML more robustly (e.g. trim leading whitespace and check for a leading '<') and reuse a single stream where possible.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/helpers/MessagesImporter.kt:210-215","code":"  210 |     private fun isFileXml(uri: Uri): Boolean {\n  211 |         val inputStream = getInputStreamFromUri(uri)\n  212 |         return inputStream?.bufferedReader()?.use { reader ->\n  213 |             reader.readLine()?.startsWith(\"<?xml\") == true\n  214 |         } == true\n  215 |     }","lines":6,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/helpers/MessagesImporter.kt#L210-L215"}]},
{"id":"LOGIC_35","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`smsExist` builds its dedup selection from `smsBackup.address`, but a restored SMS can legitimately have a null/empty address (e.g. some system messages). With a null address the selection arg array contains a non-null String requirement; `arrayOf(..., smsBackup.address, ...)` where address is the non-null model field is fine for SMS (address is non-null in SmsBackup), but the same dedup ignores `body` and `service_center`, so two distinct messages with identical date+address+type (common for split/concatenated SMS arriving in the same second) are treated as duplicates and the second is dropped during import.","fix":"Include body (and ideally dateSent) in the duplicate-detection selection to avoid dropping legitimately distinct messages.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/helpers/MessagesWriter.kt:35-48","code":"   35 |     private fun smsExist(smsBackup: SmsBackup): Boolean {\n   36 |         val uri = Sms.CONTENT_URI\n   37 |         val projection = arrayOf(Sms._ID)\n   38 |         val selection = \"${Sms.DATE} = ? AND ${Sms.ADDRESS} = ? AND ${Sms.TYPE} = ?\"\n   39 |         val selectionArgs = arrayOf(\n   40 |             smsBackup.date.toString(), smsBackup.address, smsBackup.type.toString()\n   41 |         )\n   42 | \n   43 |         var exists = false\n   44 |         context.queryCursor(uri, projection, selection, selectionArgs) {\n   45 |             exists = it.count > 0\n   46 |         }\n   47 |         return exists\n   48 |     }","lines":14,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/helpers/MessagesWriter.kt#L35-L48"}]},
{"id":"LOGIC_36","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`mmsPartExist` and `writeMmsAddress`/`mmsAddressExist` use `.toString()` on nullable fields when building selection args: `mmsPart.contentLocation.toString()` and `mmsPart.contentId.toString()`. When these fields are null, `.toString()` yields the literal string \"null\" rather than a SQL NULL, so the existence check compares the column against the string \"null\" and will not match real NULL rows. This can cause duplicate part insertion for parts whose contentLocation/contentId are null.","fix":"Handle null fields explicitly (use IS NULL clauses) instead of stringifying null into the literal \"null\".","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/helpers/MessagesWriter.kt:165-181","code":"  165 |     private fun mmsPartExist(mmsPart: MmsPart, messageId: Long): Boolean {\n  166 |         val uri = Uri.parse(\"content://mms/${messageId}/part\")\n  167 |         val projection = arrayOf(Mms.Part._ID)\n  168 |         val selection = \"${Mms.Part.CONTENT_LOCATION} = ? AND ${Mms.Part.CONTENT_TYPE} = ? AND ${Mms.Part.MSG_ID} = ? AND ${Mms.Part.CONTENT_ID} = ?\"\n  169 |         val selectionArgs = arrayOf(\n  170 |             mmsPart.contentLocation.toString(),\n  171 |             mmsPart.contentType,\n  172 |             messageId.toString(),\n  173 |             mmsPart.contentId.toString()\n  174 |         )\n  175 | \n  176 |         var exists = false\n  177 |         context.queryCursor(uri, projection, selection, selectionArgs) {\n  178 |             exists = it.count > 0\n  179 |         }\n  180 |         return exists\n  181 |     }","lines":17,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/helpers/MessagesWriter.kt#L165-L181"}]},
{"id":"LOGIC_37","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`showSendingFailedNotification` derives its notificationId from `generateRandomId().hashCode()`. Because `generateRandomId` reseeds Random from current millis (see related finding), and because hashing the truncated id further collapses the range, rapid consecutive send failures can collide on the same notificationId and overwrite each other's failure notification.","fix":"Use a guaranteed-unique id source (atomic counter or full random long) for transient notification ids.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/helpers/NotificationHelper.kt:201","code":"  201 |         val notificationId = generateRandomId().hashCode()","lines":1,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/helpers/NotificationHelper.kt#L201"}]},
{"id":"LOGIC_38","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`getScheduledMessageWithId` returns a non-null `Message` from a query that can match zero rows. Room generates code that throws if the cursor is empty when the return type is non-nullable, so requesting a scheduled message id that no longer exists crashes instead of returning null.","fix":"Declare the return type nullable: `fun getScheduledMessageWithId(threadId: Long, messageId: Long): Message?`.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/interfaces/MessagesDao.kt:50-51","code":"   50 |     @Query(\"SELECT * FROM messages WHERE thread_id = :threadId AND id = :messageId AND is_scheduled = 1\")\n   51 |     fun getScheduledMessageWithId(threadId: Long, messageId: Long): Message","lines":2,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/interfaces/MessagesDao.kt#L50-L51"}]},
{"id":"LOGIC_39","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"SmsSender.sendInternal computes the part id as `if (messageCount <= 1) 0 else i + 1`, used as the requestCode for both the sent and delivered PendingIntents. The same partId is used for the sent intent AND (on the last part) the delivered intent. Because the two intents differ only by action/component, PendingIntent equality differs, so they don't collide with each other; however reusing requestCode 0 for the single-part case across concurrent sends to different messageUris with FLAG_UPDATE_CURRENT means a second concurrent single-part send can overwrite the first send's PendingIntent target (the data URI is part of equality, so different URIs are distinct - this mitigates it). The fragile reliance on URI-in-equality plus a constant requestCode is worth hardening.","fix":"Derive requestCode from a value unique per message (e.g. message id / uri hash) combined with the part index, instead of a constant 0 for single-part messages.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/messaging/SmsSender.kt:66-89","code":"   66 |         for (i in 0 until messageCount) {\n   67 |             // Make pending intents different for each message part\n   68 |             val partId = if (messageCount <= 1) 0 else i + 1\n   69 |             if (requireDeliveryReport && i == messageCount - 1) {\n   70 |                 deliveryIntents.add(\n   71 |                     PendingIntent.getBroadcast(\n   72 |                         app,\n   73 |                         partId,\n   74 |                         getDeliveredStatusIntent(messageUri, subId),\n   75 |                         flags\n   76 |                     )\n   77 |                 )\n   78 |             } else {\n   79 |                 deliveryIntents.add(null)\n   80 |             }\n   81 |             sentIntents.add(\n   82 |                 PendingIntent.getBroadcast(\n   83 |                     app,\n   84 |                     partId,\n   85 |                     getSendStatusIntent(messageUri, subId),\n   86 |                     flags\n   87 |                 )\n   88 |             )\n   89 |         }","lines":24,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/messaging/SmsSender.kt#L66-L89"}]},
{"id":"LOGIC_40","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"Conversation.areContentsTheSame() omits `isScheduled`, `usesCustomTitle` and `isArchived` from the comparison. If a conversation's scheduled/custom-title/archived state changes while snippet/date/read/title/photo/group/phone/unreadCount stay equal, DiffUtil will treat the items as identical and not rebind the row, so the UI can show stale state. Note Message.areContentsTheSame does compare its `isScheduled`, making the two models inconsistent.","fix":"Add `old.isScheduled == new.isScheduled && old.usesCustomTitle == new.usesCustomTitle && old.isArchived == new.isArchived` to areContentsTheSame (whichever of these affect the rendered row).","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/models/Conversation.kt:29-38","code":"   29 |         fun areContentsTheSame(old: Conversation, new: Conversation): Boolean {\n   30 |             return old.snippet == new.snippet &&\n   31 |                 old.date == new.date &&\n   32 |                 old.read == new.read &&\n   33 |                 old.title == new.title &&\n   34 |                 old.photoUri == new.photoUri &&\n   35 |                 old.isGroupConversation == new.isGroupConversation &&\n   36 |                 old.phoneNumber == new.phoneNumber &&\n   37 |                 old.unreadCount == new.unreadCount\n   38 |         }","lines":10,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/models/Conversation.kt#L29-L38"}]},
{"id":"LOGIC_41","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"SmsReceiver reads the subscription id with `intent.getIntExtra(\"subscription\", -1)`. The literal \"subscription\" is the legacy/OEM key and is not guaranteed across devices/Android versions; the platform commonly delivers the subscription via Telephony.Sms.Intents extras / the SubscriptionManager EXTRA. When the extra is absent, subscriptionId defaults to -1 and is then stored on the message and used for SIM attribution, so incoming messages can be attributed to the wrong/unknown SIM on dual-SIM devices.","fix":"Read the subscription id from the documented extra (e.g. \"android.telephony.extra.SUBSCRIPTION_INDEX\") with the legacy \"subscription\" key as fallback.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/receivers/SmsReceiver.kt:59","code":"   59 |                 val subscriptionId = intent.getIntExtra(\"subscription\", -1)","lines":1,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/receivers/SmsReceiver.kt#L59"}]},
{"id":"LOGIC_42","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"HeadlessSmsSendService strips URI scheme prefixes but the mms prefix is `\"mms\"` (no colon) while the others are `\"sms:\"`, `\"smsto:\"`, `\"mmsto:\"`. Stripping the bare `\"mms\"` (rather than `\"mms:\"`) means an `mms:` URI is reduced to `:12345...` (the leading colon remains), producing a malformed number; and a number that legitimately begins with the letters \"mms\" would also be corrupted. Inconsistent with the other prefixes.","fix":"Use `.removePrefix(\"mms:\")` to match the other scheme prefixes.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/services/HeadlessSmsSendService.kt:18","code":"   18 |             val number = Uri.decode(intent.dataString!!.removePrefix(\"sms:\").removePrefix(\"smsto:\").removePrefix(\"mms\").removePrefix(\"mmsto:\").trim())","lines":1,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/services/HeadlessSmsSendService.kt#L18"}]},
{"id":"LOGIC_43","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"medium","description":"getMessages applies `.takeLast(limit)` (line 212) after sorting ascending by date, but the SMS query already applied `LIMIT $limit` and the MMS path is unbounded except via the passed sortOrder. After merging SMS (<=limit), all MMS, and scheduled messages, takeLast(limit) keeps only the newest `limit` items. This means MMS-heavy threads can crowd out the limited SMS set fetched, and the effective fetched window is not exactly `limit` messages of the conversation - the SMS LIMIT and the post-merge takeLast can interact to drop recently-fetched SMS.","fix":"Apply a consistent LIMIT to the MMS query as well (it already accepts sortOrder with LIMIT for some callers), so the merged-then-trimmed window is predictable.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/extensions/Context.kt:197-213","code":"  197 |     messages.addAll(getMMS(threadId, sortOrder, dateFrom))\n  198 | \n  199 |     if (includeScheduledMessages) {\n  200 |         try {\n  201 |             val scheduledMessages = messagesDB.getScheduledThreadMessages(threadId)\n  202 |             messages.addAll(scheduledMessages)\n  203 |         } catch (e: Exception) {\n  204 |             e.printStackTrace()\n  205 |         }\n  206 |     }\n  207 | \n  208 |     messages = messages\n  209 |         .filter { it.participants.isNotEmpty() }\n  210 |         .filterNot { it.isScheduled && it.millis() < System.currentTimeMillis() }\n  211 |         .sortedWith(compareBy<Message> { it.date }.thenBy { it.id })\n  212 |         .takeLast(limit)\n  213 |         .toMutableList() as ArrayList<Message>","lines":17,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/extensions/Context.kt#L197-L213"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"medium","description":"When importing the SMS Backup & Restore XML format, `dateSent` is read from the wrong XML attribute. Both `date` and `dateSent` are parsed from the `\"date\"` attribute; `dateSent` should be parsed from `\"date_sent\"`. As a result every imported SMS loses its real sent timestamp and gets the received timestamp instead. This directly populates the SmsBackup model's `dateSent` field.","fix":"Change line 179 to `dateSent = getAttributeValue(null, \"date_sent\")?.toLongOrNull() ?: 0L,` (and similarly guard the other toLong/toInt calls against missing attributes).","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/helpers/MessagesImporter.kt:178-179","code":"  178 |             date = getAttributeValue(null, \"date\").toLong(),\n  179 |             dateSent = getAttributeValue(null, \"date\").toLong(),","lines":2,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/helpers/MessagesImporter.kt#L178-L179"}]},
{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"medium","description":"In getMessages, when building the participants list for an SMS, each participant's photoUri is set to `photoUri` - the variable holding the *sender's* photo (line 153) - instead of the participant's own photo. The per-participant photo is even computed into `participantPhoto` (line 165) and used for the name, but its `.photoUri` is then ignored. For group SMS this assigns the wrong avatar to every participant.","fix":"Use the per-participant photo: `photoUri = participantPhoto.photoUri ?: \"\"` instead of `photoUri = photoUri`.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/extensions/Context.kt:163-175","code":"  163 |         val participants = senderNumber.split(ADDRESS_SEPARATOR).map { number ->\n  164 |             val phoneNumber = PhoneNumber(number, 0, \"\", number)\n  165 |             val participantPhoto = getNameAndPhotoFromPhoneNumber(number)\n  166 |             SimpleContact(\n  167 |                 rawId = 0,\n  168 |                 contactId = 0,\n  169 |                 name = participantPhoto.name,\n  170 |                 photoUri = photoUri,\n  171 |                 phoneNumbers = arrayListOf(phoneNumber),\n  172 |                 birthdays = ArrayList(),\n  173 |                 anniversaries = ArrayList()\n  174 |             )\n  175 |         }","lines":13,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/extensions/Context.kt#L163-L175"}]},
{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"When importing SMS messages from XML backups (the SMS Backup & Restore format), the `dateSent` field is read from the `date` attribute instead of the `date_sent` attribute. Both `date` and `dateSent` end up holding the same value, so the original \"sent\" timestamp is lost on every XML-imported SMS. This is a classic copy-paste bug: the attribute name was not changed on the second line.","fix":"Read `dateSent` from the correct attribute:\n    date = getAttributeValue(null, \"date\").toLong(),\n    dateSent = getAttributeValue(null, \"date_sent\")?.toLongOrNull() ?: 0L,","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/helpers/MessagesImporter.kt:178-179","code":"  178 |             date = getAttributeValue(null, \"date\").toLong(),\n  179 |             dateSent = getAttributeValue(null, \"date\").toLong(),","lines":2,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/helpers/MessagesImporter.kt#L178-L179"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"medium","description":"HeadlessSmsSendService.onStartCommand wraps the entire send path in `catch (ignored: Exception) {}`, silently swallowing every failure (including the sendMessageCompat send error). This service is the standard entry point used by other apps (e.g. car/Bluetooth, the 'respond via message' dialer flow) to send an SMS via the default messaging app. If anything throws, the message is silently lost with no toast, no failed-message persistence, and no log. Additionally `intent.dataString!!` uses a not-null assertion: a caller that starts the service with a null data URI (intent != null but dataString == null) triggers a NullPointerException - which is then also swallowed, so the failure is invisible.","fix":"Null-check intent.dataString before use, and at minimum log/report the exception instead of swallowing it silently; consider surfacing a failure notification.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/services/HeadlessSmsSendService.kt:12-29","code":"   12 |     override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {\n   13 |         try {\n   14 |             if (intent == null) {\n   15 |                 return START_NOT_STICKY\n   16 |             }\n   17 | \n   18 |             val number = Uri.decode(intent.dataString!!.removePrefix(\"sms:\").removePrefix(\"smsto:\").removePrefix(\"mms\").removePrefix(\"mmsto:\").trim())\n   19 |             val text = intent.getStringExtra(Intent.EXTRA_TEXT)\n   20 |             if (!text.isNullOrEmpty()) {\n   21 |                 val addresses = listOf(number)\n   22 |                 val subId = Settings.DEFAULT_SUBSCRIPTION_ID\n   23 |                 sendMessageCompat(text, addresses, subId, emptyList())\n   24 |             }\n   25 |         } catch (ignored: Exception) {\n   26 |         }\n   27 | \n   28 |         return super.onStartCommand(intent, flags, startId)\n   29 |     }","lines":18,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/services/HeadlessSmsSendService.kt#L12-L29"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"URLDecoder.decode(String) is called with the single-arg overload, which is deprecated and\nuses the platform default charset, and is invoked without a try/catch. A malformed escape\nsequence in the recipient (e.g. a stray '%' not part of a valid %XX) throws\nIllegalArgumentException, crashing the activity when handling a third-party SEND intent.\nThe replace(\"+\", \"%2b\") hack to preserve '+' is also brittle.","fix":"Use URLDecoder.decode(value, \"UTF-8\") wrapped in a try/catch, falling back to the raw\nrecipients string on failure, or avoid URL-decoding phone numbers entirely.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/activities/NewConversationActivity.kt:138-152","code":"  138 |     private fun isThirdPartyIntent(): Boolean {\n  139 |         val result = SmsIntentParser.parse(intent)\n  140 | \n  141 |         if (result != null && (result.first.isNotEmpty() || result.second.isNotEmpty())) {\n  142 |             val (body, recipients) = result\n  143 |             launchThreadActivity(\n  144 |                 phoneNumber = URLDecoder.decode(recipients.replace(\"+\", \"%2b\").trim()),\n  145 |                 name = \"\",\n  146 |                 body = body\n  147 |             )\n  148 |             finish()\n  149 |             return true\n  150 |         }\n  151 |         return false\n  152 |     }","lines":15,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/activities/NewConversationActivity.kt#L138-L152"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"sendNormalMessage catches Error (java.lang.Error) in addition to Exception. Catching Error swallows serious unrecoverable conditions (OutOfMemoryError, StackOverflowError, etc.) and merely toasts them, which can leave the process in an inconsistent state instead of crashing cleanly.","fix":"Catch only Exception (and specific subtypes) here; do not catch Error.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/activities/ThreadActivity.kt:1694-1700","code":" 1694 |         } catch (e: Exception) {\n 1695 |             showErrorToast(e)\n 1696 |         } catch (e: Error) {\n 1697 |             showErrorToast(\n 1698 |                 e.localizedMessage ?: getString(org.fossify.commons.R.string.unknown_error_occurred)\n 1699 |             )\n 1700 |         }","lines":7,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/activities/ThreadActivity.kt#L1694-L1700"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"markMessageRead performs contentResolver.update with no try/catch. Unlike most sibling functions here (deleteMessage, updateConversationArchivedStatus, etc.) it lets exceptions propagate. A provider error (e.g. message already deleted, permission/provider issue) will throw and the caller is typically on a background thread but the throw also skips messagesDB.markRead(id). The function name implies a best-effort operation.","fix":"Wrap the update + DB call in try/catch like the other mutation helpers, or at minimum guard the contentResolver.update.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/extensions/Context.kt:996-1006","code":"  996 | fun Context.markMessageRead(id: Long, isMMS: Boolean) {\n  997 |     val uri = if (isMMS) Mms.CONTENT_URI else Sms.CONTENT_URI\n  998 |     val contentValues = ContentValues().apply {\n  999 |         put(Sms.READ, 1)\n 1000 |         put(Sms.SEEN, 1)\n 1001 |     }\n 1002 |     val selection = \"${Sms._ID} = ?\"\n 1003 |     val selectionArgs = arrayOf(id.toString())\n 1004 |     contentResolver.update(uri, contentValues, selection, selectionArgs)\n 1005 |     messagesDB.markRead(id)\n 1006 | }","lines":11,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/extensions/Context.kt#L996-L1006"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`usePart` swallows all `IOException`s and returns an empty string when a part stream cannot be read. During export this silently produces an MMS part with empty `data` (empty text or empty base64 blob) with no indication anything went wrong, so a backup can quietly contain corrupt/empty attachments. The failure is indistinguishable from a genuinely empty part.","fix":"Log the exception and/or surface a per-part read failure so the export can warn the user rather than silently writing empty attachment data.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/helpers/MessagesReader.kt:253-269","code":"  253 |     @SuppressLint(\"NewApi\")\n  254 |     private fun usePart(partId: Long, block: (InputStream) -> String): String {\n  255 |         val partUri = if (isQPlus()) {\n  256 |             Mms.Part.CONTENT_URI.buildUpon().appendPath(partId.toString()).build()\n  257 |         } else {\n  258 |             Uri.parse(\"content://mms/part/$partId\")\n  259 |         }\n  260 | \n  261 |         try {\n  262 |             val stream = context.contentResolver.openInputStream(partUri) ?: return \"\"\n  263 |             stream.use {\n  264 |                 return block(stream)\n  265 |             }\n  266 |         } catch (e: IOException) {\n  267 |             return \"\"\n  268 |         }\n  269 |     }","lines":17,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/helpers/MessagesReader.kt#L253-L269"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`writeMmsPart` writes the decoded attachment bytes inside a `try { ... } catch (e: Exception) {}` with a completely empty catch block. If `Base64.decode` fails (corrupt/untrusted backup data) or the output stream write fails, the error is silently swallowed: the part row has already been inserted (line 148) but its binary data is missing, leaving a half-written attachment with no error reported and no rollback. The empty catch also hides the `it!!` NPE if openOutputStream returns null.","fix":"Log/propagate the exception so the importer counts the message as failed; consider deleting the orphan part row when the data write fails. Avoid the non-null assertion on the output stream.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/helpers/MessagesWriter.kt:142-162","code":"  142 |     @SuppressLint(\"NewApi\")\n  143 |     private fun writeMmsPart(mmsPart: MmsPart, messageId: Long) {\n  144 |         if (!mmsPartExist(mmsPart, messageId)) {\n  145 |             val uri = Uri.parse(\"content://mms/${messageId}/part\")\n  146 |             val contentValues = mmsPart.toContentValues()\n  147 |             contentValues.put(Mms.Part.MSG_ID, messageId)\n  148 |             val partUri = contentResolver.insert(uri, contentValues)\n  149 |             try {\n  150 |                 if (partUri != null) {\n  151 |                     if (mmsPart.isNonText()) {\n  152 |                         contentResolver.openOutputStream(partUri).use {\n  153 |                             val arr = Base64.decode(mmsPart.data, Base64.DEFAULT)\n  154 |                             it!!.write(arr)\n  155 |                         }\n  156 |                     }\n  157 |                 }\n  158 |             } catch (e: Exception) {\n  159 | \n  160 |             }\n  161 |         }\n  162 |     }","lines":21,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/helpers/MessagesWriter.kt#L142-L162"}]},
{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"MessagingUtils.sendSmsMessage iterates over multiple addresses and, on the first send failure, marks that message FAILED and rethrows, aborting the loop. Any addresses after the failing one are never attempted - their telephony rows were not yet inserted, so for a multi-recipient (non-group) SMS the remaining recipients silently get no message and no failed entry. Combined with the group branch above (which inserts only a single dummy row), partial-failure handling for multi-recipient sends is inconsistent: some recipients are sent, the failing one is marked failed, the rest are dropped.","fix":"Decide on per-recipient semantics: continue the loop and collect failures rather than aborting on the first exception, so each recipient gets an inserted row and an accurate sent/failed status.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/messaging/MessagingUtils.kt:88-124","code":"   88 |     fun sendSmsMessage(\n   89 |         text: String,\n   90 |         addresses: Set<String>,\n   91 |         subId: Int,\n   92 |         requireDeliveryReport: Boolean,\n   93 |         messageId: Long? = null\n   94 |     ) {\n   95 |         if (addresses.size > 1) {\n   96 |             // insert a dummy message for this thread if it is a group message\n   97 |             val broadCastThreadId = context.getThreadId(addresses.toSet())\n   98 |             val mergedAddresses = addresses.joinToString(ADDRESS_SEPARATOR)\n   99 |             insertSmsMessage(\n  100 |                 subId = subId, dest = mergedAddresses, text = text,\n  101 |                 timestamp = System.currentTimeMillis(), threadId = broadCastThreadId,\n  102 |                 status = Sms.Sent.STATUS_COMPLETE, type = Sms.Sent.MESSAGE_TYPE_SENT,\n  103 |                 messageId = messageId\n  104 |             )\n  105 |         }\n  106 | \n  107 |         for (address in addresses) {\n  108 |             val threadId = context.getThreadId(address)\n  109 |             val messageUri = insertSmsMessage(\n  110 |                 subId = subId, dest = address, text = text,\n  111 |                 timestamp = System.currentTimeMillis(), threadId = threadId,\n  112 |                 messageId = messageId\n  113 |             )\n  114 |             try {\n  115 |                 context.smsSender.sendMessage(\n  116 |                     subId = subId, destination = address, body = text, serviceCenter = null,\n  117 |                     requireDeliveryReport = requireDeliveryReport, messageUri = messageUri\n  118 |                 )\n  119 |             } catch (e: Exception) {\n  120 |                 updateSmsMessageSendingStatus(messageUri, Sms.Outbox.MESSAGE_TYPE_FAILED)\n  121 |                 throw e // propagate error to caller\n  122 |             }\n  123 |         }\n  124 |     }","lines":37,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/messaging/MessagingUtils.kt#L88-L124"}]},
{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"MessagingUtils.sendMmsMessage catches and swallows the send failure: `transaction.sendNewMessage(message)` is wrapped in catch (e: Exception) { context.showErrorToast(e) }, returning normally afterwards. Unlike the SMS path (which marks the message FAILED and rethrows), an MMS send failure here only shows a toast; the persisted message is not marked failed and the caller (sendMessageCompat) has no way to know it failed. The attachment-reading block similarly swallows exceptions and then proceeds to send an MMS with no media attached.","fix":"On attachment-read failure, abort the send rather than sending media-less; on send failure, mark the message FAILED (consistent with the SMS path) instead of only toasting.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/messaging/MessagingUtils.kt:160-200","code":"  160 |     @Deprecated(\"TODO: Move/rewrite MMS code into the app.\")\n  161 |     fun sendMmsMessage(\n  162 |         text: String,\n  163 |         addresses: List<String>,\n  164 |         attachment: Attachment?,\n  165 |         settings: Settings,\n  166 |         messageId: Long? = null\n  167 |     ) {\n  168 |         val transaction = Transaction(context, settings)\n  169 |         val message = Message(text, addresses.toTypedArray())\n  170 | \n  171 |         if (attachment != null) {\n  172 |             try {\n  173 |                 val uri = attachment.getUri()\n  174 |                 context.contentResolver.openInputStream(uri)?.use {\n  175 |                     val bytes = it.readBytes()\n  176 |                     val mimeType = if (attachment.mimetype.isPlainTextMimeType()) {\n  177 |                         \"application/txt\"\n  178 |                     } else {\n  179 |                         attachment.mimetype\n  180 |                     }\n  181 |                     val name = attachment.filename\n  182 |                     message.addMedia(bytes, mimeType, name, name)\n  183 |                 }\n  184 |             } catch (e: Exception) {\n  185 |                 context.showErrorToast(e)\n  186 |             } catch (e: Error) {\n  187 |                 context.showErrorToast(e.localizedMessage ?: context.getString(org.fossify.commons.R.string.unknown_error_occurred))\n  188 |             }\n  189 |         }\n  190 | \n  191 |         val mmsSentIntent = Intent(context, MmsSentReceiver::class.java)\n  192 |         mmsSentIntent.putExtra(MmsSentReceiver.EXTRA_ORIGINAL_RESENT_MESSAGE_ID, messageId)\n  193 |         transaction.setExplicitBroadcastForSentMms(mmsSentIntent)\n  194 | \n  195 |         try {\n  196 |             transaction.sendNewMessage(message)\n  197 |         } catch (e: Exception) {\n  198 |             context.showErrorToast(e)\n  199 |         }\n  200 |     }","lines":41,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/messaging/MessagingUtils.kt#L160-L200"}]},
{"id":"ERR_9","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"SmsManager.getSmsManager has confused/over-nested error handling. Inside the `if (subId != DEFAULT_SUBSCRIPTION_ID)` branch it assigns `smsManagerInstance = getSmsManagerForSubscriptionId(...)` inside a try, and on exception only calls e.printStackTrace(). The subsequent expression `smsManagerInstance ?: SmsManager.getDefault()` is then assigned again to smsManagerInstance via the outer `smsManagerInstance = if (...)`. The inner assignment to smsManagerInstance is redundant with the outer one and makes the control flow hard to follow. More importantly, if a previous call had already cached a non-null smsManagerInstance for a different subId and the new lookup throws, the stale instance (`smsManagerInstance ?:`) is silently reused for the wrong subId, sending on the wrong SIM. The cache key check only compares subId, so the fallback path can bind the wrong subscription.","fix":"Use a local variable for the lookup result, don't reassign the shared field inside the try, and on failure fall back to getDefault() rather than reusing a stale cached instance bound to a different subId.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/messaging/SmsManager.kt:9-25","code":"    9 | @Suppress(\"DEPRECATION\")\n   10 | fun getSmsManager(subId: Int): SmsManager {\n   11 |     if (smsManagerInstance == null || subId != associatedSubId) {\n   12 |         smsManagerInstance = if (subId != Settings.DEFAULT_SUBSCRIPTION_ID) {\n   13 |             try {\n   14 |                 smsManagerInstance = SmsManager.getSmsManagerForSubscriptionId(subId)\n   15 |             } catch (e: Exception) {\n   16 |                 e.printStackTrace()\n   17 |             }\n   18 |             smsManagerInstance ?: SmsManager.getDefault()\n   19 |         } else {\n   20 |             SmsManager.getDefault()\n   21 |         }\n   22 |         associatedSubId = subId\n   23 |     }\n   24 |     return smsManagerInstance!!\n   25 | }","lines":17,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/messaging/SmsManager.kt#L9-L25"}]},
