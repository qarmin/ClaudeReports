{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`writeMmsMessage` resolves the thread id and message id through repeated content-provider queries for every single MMS. `getMmsThreadId` calls `Utils.getOrCreateThreadId` (a provider lookup). It is invoked at line 55, again inside `mmsExist` -> `getMmsId` -> `getMmsThreadId` (line 58), and yet again in the direct `getMmsId` call (line 62). So importing one MMS triggers `getOrCreateThreadId` 3+ times plus 2 separate `Mms._ID` lookups. For a large backup (thousands of MMS) this is a large amount of redundant provider IO.","fix":"Compute threadId once in writeMmsMessage and pass it down to getMmsId/mmsExist instead of recomputing it inside each helper.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/helpers/MessagesWriter.kt:50-68","code":"   50 |     fun writeMmsMessage(mmsBackup: MmsBackup) {\n   51 |         // 1. write mms msg, get the msg_id, check if mms exists before writing\n   52 |         // 2. write parts - parts depend on the msg id, check if part exist before writing, write data if it is a non-text part\n   53 |         // 3. write the addresses, address depends on msg id too, check if address exist before writing\n   54 |         val contentValues = mmsBackup.toContentValues()\n   55 |         val threadId = getMmsThreadId(mmsBackup)\n   56 |         if (threadId != INVALID_ID) {\n   57 |             contentValues.put(Mms.THREAD_ID, threadId)\n   58 |             if (!mmsExist(mmsBackup)) {\n   59 |                 modifiedThreadIds.add(threadId)\n   60 |                 contentResolver.insert(Mms.CONTENT_URI, contentValues)\n   61 |             }\n   62 |             val messageId = getMmsId(mmsBackup)\n   63 |             if (messageId != INVALID_ID) {\n   64 |                 mmsBackup.parts.forEach { writeMmsPart(it, messageId) }\n   65 |                 mmsBackup.addresses.forEach { writeMmsAddress(it, messageId) }\n   66 |             }\n   67 |         }\n   68 |     }","lines":19,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/helpers/MessagesWriter.kt#L50-L68"},{"ref":"app/src/main/kotlin/org/fossify/messages/helpers/MessagesWriter.kt:82-103","code":"   82 |     private fun getMmsId(mmsBackup: MmsBackup): Long {\n   83 |         val threadId = getMmsThreadId(mmsBackup)\n   84 |         val uri = Mms.CONTENT_URI\n   85 |         val projection = arrayOf(Mms._ID)\n   86 |         val selection = \"${Mms.DATE} = ? AND ${Mms.DATE_SENT} = ? AND ${Mms.THREAD_ID} = ? AND ${Mms.MESSAGE_BOX} = ?\"\n   87 |         val selectionArgs = arrayOf(\n   88 |             mmsBackup.date.toString(),\n   89 |             mmsBackup.dateSent.toString(),\n   90 |             threadId.toString(),\n   91 |             mmsBackup.messageBox.toString()\n   92 |         )\n   93 |         var id = INVALID_ID\n   94 |         context.queryCursor(uri, projection, selection, selectionArgs) {\n   95 |             id = it.getLongValue(Mms._ID)\n   96 |         }\n   97 | \n   98 |         return id\n   99 |     }\n  100 | \n  101 |     private fun mmsExist(mmsBackup: MmsBackup): Boolean {\n  102 |         return getMmsId(mmsBackup) != INVALID_ID\n  103 |     }","lines":22,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/helpers/MessagesWriter.kt#L82-L103"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"onResume() in MainActivity performs a large amount of color/view work on every resume,\nincluding underlineText(), color filters, fastscroller color updates, and progress bar color\nrecomputation, plus calling getProperTextColor()/getProperPrimaryColor() repeatedly. These\nrecompute colors and touch many views each resume even when nothing changed.","fix":"Cache the proper colors once per resume into locals (getProperPrimaryColor is already cached\ninto properPrimaryColor but getProperTextColor is computed multiple times), and only reapply\nview styling when the relevant config (color/theme) actually changed.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/activities/MainActivity.kt:109-136","code":"  109 |     override fun onResume() {\n  110 |         super.onResume()\n  111 |         updateMenuColors()\n  112 |         refreshMenuItems()\n  113 | \n  114 |         getOrCreateConversationsAdapter().apply {\n  115 |             if (storedTextColor != getProperTextColor()) {\n  116 |                 updateTextColor(getProperTextColor())\n  117 |             }\n  118 | \n  119 |             if (storedFontSize != config.fontSize) {\n  120 |                 updateFontSize()\n  121 |             }\n  122 | \n  123 |             updateDrafts()\n  124 |         }\n  125 | \n  126 |         updateTextColors(binding.mainCoordinator)\n  127 |         binding.searchHolder.setBackgroundColor(getProperBackgroundColor())\n  128 | \n  129 |         val properPrimaryColor = getProperPrimaryColor()\n  130 |         binding.noConversationsPlaceholder2.setTextColor(properPrimaryColor)\n  131 |         binding.noConversationsPlaceholder2.underlineText()\n  132 |         binding.conversationsFastscroller.updateColors(properPrimaryColor)\n  133 |         binding.conversationsProgressBar.setIndicatorColor(properPrimaryColor)\n  134 |         binding.conversationsProgressBar.trackColor = properPrimaryColor.adjustAlpha(LOWER_ALPHA)\n  135 |         checkShortcut()\n  136 |     }","lines":28,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/activities/MainActivity.kt#L109-L136"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"updateBlockedKeywords() creates a brand-new ManageBlockedKeywordsAdapter and assigns it to\nthe RecyclerView on every refresh (including after every add/edit/import). The existing\nadapter is never updated in place, defeating RecyclerView item-level diffing/recycling and\ncausing a full re-layout each time.","fix":"Create the adapter once and call an update method (e.g. updateKeywords) on subsequent\nrefreshes, mirroring the getOrCreateConversationsAdapter pattern used elsewhere.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/activities/ManageBlockedKeywordsActivity.kt:198-217","code":"  198 |     private fun updateBlockedKeywords() {\n  199 |         ensureBackgroundThread {\n  200 |             val blockedKeywords = config.blockedKeywords.sorted().toArrayList()\n  201 |             runOnUiThread {\n  202 |                 ManageBlockedKeywordsAdapter(\n  203 |                     activity = this,\n  204 |                     blockedKeywords = blockedKeywords,\n  205 |                     listener = this,\n  206 |                     recyclerView = binding.manageBlockedKeywordsList\n  207 |                 ) {\n  208 |                     addOrEditBlockedKeyword(it as String)\n  209 |                 }.apply {\n  210 |                     binding.manageBlockedKeywordsList.adapter = this\n  211 |                 }\n  212 | \n  213 |                 binding.manageBlockedKeywordsPlaceholder.beVisibleIf(blockedKeywords.isEmpty())\n  214 |                 binding.manageBlockedKeywordsPlaceholder2.beVisibleIf(blockedKeywords.isEmpty())\n  215 |             }\n  216 |         }\n  217 |     }","lines":20,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/activities/ManageBlockedKeywordsActivity.kt#L198-L217"}]},
{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"isMmsMessage, updateMessageType and checkSendMessageAvailability each call getAttachmentSelections() which walks adapter state; checkSendMessageAvailability calls it up to three times in a single boolean expression (line 1512). These run on every onTextChangeListener keystroke, recomputing attachment lists repeatedly per character typed.","fix":"Cache getAttachmentSelections() in a local val within each function and avoid recomputing it multiple times per call.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/activities/ThreadActivity.kt:1572-1586","code":" 1572 |     private fun checkSendMessageAvailability() {\n 1573 |         binding.messageHolder.apply {\n 1574 |             if (threadTypeMessage.text!!.isNotEmpty() || (getAttachmentSelections().isNotEmpty() && !getAttachmentSelections().any { it.isPending })) {\n 1575 |                 threadSendMessage.isEnabled = true\n 1576 |                 threadSendMessage.isClickable = true\n 1577 |                 threadSendMessage.alpha = 0.9f\n 1578 |             } else {\n 1579 |                 threadSendMessage.isEnabled = false\n 1580 |                 threadSendMessage.isClickable = false\n 1581 |                 threadSendMessage.alpha = 0.4f\n 1582 |             }\n 1583 |         }\n 1584 | \n 1585 |         updateMessageType()\n 1586 |     }","lines":15,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/activities/ThreadActivity.kt#L1572-L1586"},{"ref":"app/src/main/kotlin/org/fossify/messages/activities/ThreadActivity.kt:885-896","code":"  885 |             threadTypeMessage.onTextChangeListener {\n  886 |                 messageToResend = null\n  887 |                 checkSendMessageAvailability()\n  888 |                 val messageString = if (config.useSimpleCharacters) {\n  889 |                     it.normalizeString()\n  890 |                 } else {\n  891 |                     it\n  892 |                 }\n  893 |                 val messageLength = SmsMessage.calculateLength(messageString, false)\n  894 |                 @SuppressLint(\"SetTextI18n\")\n  895 |                 threadCharacterCounter.text = \"${messageLength[2]}/${messageLength[0]}\"\n  896 |             }","lines":12,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/activities/ThreadActivity.kt#L885-L896"}]},
{"id":"PERF_9","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"updateDrafts compares old vs new drafts using HashMap.hashCode() to decide whether to notifyDataSetChanged. HashMap.hashCode collisions are possible (two different draft maps with equal hashCode skip the refresh), and the comparison would be both safer and as cheap with structural equality (drafts != newDrafts).","fix":"Compare with `drafts != newDrafts` (Map.equals) instead of comparing hashCode().","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/adapters/BaseConversationsAdapter.kt:79-91","code":"   79 |     @SuppressLint(\"NotifyDataSetChanged\")\n   80 |     fun updateDrafts() {\n   81 |         ensureBackgroundThread {\n   82 |             val newDrafts = HashMap<Long, String>()\n   83 |             fetchDrafts(newDrafts)\n   84 |             activity.runOnUiThread {\n   85 |                 if (drafts.hashCode() != newDrafts.hashCode()) {\n   86 |                     drafts = newDrafts\n   87 |                     notifyDataSetChanged()\n   88 |                 }\n   89 |             }\n   90 |         }\n   91 |     }","lines":13,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/adapters/BaseConversationsAdapter.kt#L79-L91"}]},

le)\n  189 | \n  190 |             arrayListOf(conversationAddress, conversationBodyShort, conversationDate).forEach {\n  191 |                 it.setTextColor(textColor)\n  192 |             }","lines":8,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/adapters/BaseConversationsAdapter.kt#L185-L192"}]},
{"id":"PERF_11","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"ThreadAdapter.getSelectableItemCount() does currentList.filterIsInstance<Message>().size, allocating a filtered list every call. getSelectableItemCount is called by the selection framework potentially frequently (e.g. on each selection change / select-all).","fix":"Use currentList.count { it is Message } to avoid the intermediate list allocation.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/adapters/ThreadAdapter.kt:156","code":"  156 |     override fun getSelectableItemCount() = currentList.filterIsInstance<Message>().size","lines":1,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/adapters/ThreadAdapter.kt#L156"}]},
{"id":"PERF_12","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"getThreadContactNames constructs a new SimpleContactsHelper(this) inside the forEach loop, once per phone number (line 688), each construction repeating any per-instance setup. getThreadParticipants and getConversations also create SimpleContactsHelper repeatedly. These are called per-conversation during list building.","fix":"Hoist a single `val helper = SimpleContactsHelper(this)` outside the loop and reuse it.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/extensions/Context.kt:694-713","code":"  694 | fun Context.getThreadContactNames(\n  695 |     phoneNumbers: List<String>,\n  696 |     privateContacts: ArrayList<SimpleContact>,\n  697 | ): ArrayList<String> {\n  698 |     val names = ArrayList<String>()\n  699 |     phoneNumbers.forEach { number ->\n  700 |         val name = SimpleContactsHelper(this).getNameFromPhoneNumber(number)\n  701 |         if (name != number) {\n  702 |             names.add(name)\n  703 |         } else {\n  704 |             val privateContact = privateContacts.firstOrNull { it.doesHavePhoneNumber(number) }\n  705 |             if (privateContact == null) {\n  706 |                 names.add(name)\n  707 |             } else {\n  708 |                 names.add(privateContact.name)\n  709 |             }\n  710 |         }\n  711 |     }\n  712 |     return names\n  713 | }","lines":20,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/extensions/Context.kt#L694-L713"}]},
{"id":"PERF_13","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"getSuggestedContacts builds the duplicate-check by mapping the entire `contacts` list and calling trimToComparableNumber() on every existing entry for each new row inside the queryCursor callback (lines 769-770). This is O(n^2) over up to 50 rows and recomputes trimToComparableNumber for the same numbers repeatedly.","fix":"Maintain a HashSet<String> of already-seen trimToComparableNumber() values and check/add against it in O(1).","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/extensions/Context.kt:781-784","code":"  781 |         if (!contacts.map { it.phoneNumbers.first().normalizedNumber.trimToComparableNumber() }\n  782 |                 .contains(senderNumber.trimToComparableNumber())) {\n  783 |             contacts.add(contact)\n  784 |         }","lines":4,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/extensions/Context.kt#L781-L784"}]},
{"id":"PERF_14","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`importBlockedKeywords` adds each keyword with a separate `config.addBlockedKeyword(keyword)` call. Each call does `blockedKeywords = blockedKeywords.plus(keyword)`, which reads the full StringSet from SharedPreferences, copies it, and commits a new write via `prefs.edit().apply()`. For a file with N keywords this is N read-modify-write prefs cycles instead of one.","fix":"Accumulate all keywords and assign once: `activity.config.blockedKeywords = activity.config.blockedKeywords + keywords.toSet()`.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/helpers/BlockedKeywordsImporter.kt:24-26","code":"   24 |                 keywords.forEach { keyword: String ->\n   25 |                     activity.config.addBlockedKeyword(keyword)\n   26 |                 }","lines":3,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/helpers/BlockedKeywordsImporter.kt#L24-L26"},{"ref":"app/src/main/kotlin/org/fossify/messages/helpers/Config.kt:86-88","code":"   86 |     fun addBlockedKeyword(keyword: String) {\n   87 |         blockedKeywords = blockedKeywords.plus(keyword)\n   88 |     }","lines":3,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/helpers/Config.kt#L86-L88"}]},
{"id":"PERF_15","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"SmsReceiver.handleMessageSync opens a MyContacts cursor twice for the same address: once implicitly via nothing, and explicitly at line 107 `context.getMyContactsCursor(...)` to resolve senderName. Additionally getThreadId, getPhotoUriFromPhoneNumber, getNameFromAddress and getNotificationBitmap each do independent contact/provider lookups for the same single incoming message. For the SMS hot path this is several redundant content-provider queries per received message; the contacts cursor in particular could be opened once and reused.","fix":"Open the MyContacts cursor once and pass it to both the existence check and getNameFromAddress; cache the photo/name lookups for the single address.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/receivers/SmsReceiver.kt:89-119","code":"   89 |         val photoUri = SimpleContactsHelper(context).getPhotoUriFromPhoneNumber(address)\n   90 |         val bitmap = context.getNotificationBitmap(photoUri)\n   91 | \n   92 |         val newMessageId = context.insertNewSMS(\n   93 |             address = address,\n   94 |             subject = subject,\n   95 |             body = body,\n   96 |             date = date,\n   97 |             read = read,\n   98 |             threadId = threadId,\n   99 |             type = type,\n  100 |             subscriptionId = subscriptionId\n  101 |         )\n  102 | \n  103 |         context.getConversations(threadId).firstOrNull()?.let { conv ->\n  104 |             runCatching { context.insertOrUpdateConversation(conv) }\n  105 |         }\n  106 | \n  107 |         val senderName = context.getMyContactsCursor(favoritesOnly = false, withPhoneNumbersOnly = true).use {\n  108 |             context.getNameFromAddress(address, it)\n  109 |         }\n  110 | \n  111 |         val participant = SimpleContact(\n  112 |             rawId = 0,\n  113 |             contactId = 0,\n  114 |             name = senderName,\n  115 |             photoUri = photoUri,\n  116 |             phoneNumbers = arrayListOf(PhoneNumber(value = address, type = 0, label = \"\", normalizedNumber = address)),\n  117 |             birthdays = ArrayList(),\n  118 |             anniversaries = ArrayList()\n  119 |         )","lines":31,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/receivers/SmsReceiver.kt#L89-L119"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"The `includeTextOnlyAttachment` parameter of `getMmsMessages` is never passed a non-default value (the only caller, `getMessagesToExport`, calls `getMmsMessages(conversationIds)`). All the branching it controls (the alternate selection / selectionArgs building `TEXT_ONLY = 1`) is dead code.","fix":"Remove the parameter and the dead branches, or actually wire it through if text-only filtering is intended.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/helpers/MessagesReader.kt:99-135","code":"   99 |     private fun getMmsMessages(\n  100 |         threadIds: List<Long>,\n  101 |         includeTextOnlyAttachment: Boolean = false\n  102 |     ): List<MmsBackup> {\n  103 |         val projection = arrayOf(\n  104 |             Mms._ID,\n  105 |             Mms.CREATOR,\n  106 |             Mms.CONTENT_TYPE,\n  107 |             Mms.DELIVERY_REPORT,\n  108 |             Mms.DATE,\n  109 |             Mms.DATE_SENT,\n  110 |             Mms.LOCKED,\n  111 |             Mms.MESSAGE_TYPE,\n  112 |             Mms.MESSAGE_BOX,\n  113 |             Mms.READ,\n  114 |             Mms.READ_REPORT,\n  115 |             Mms.SEEN,\n  116 |             Mms.TEXT_ONLY,\n  117 |             Mms.STATUS,\n  118 |             Mms.SUBJECT,\n  119 |             Mms.SUBJECT_CHARSET,\n  120 |             Mms.SUBSCRIPTION_ID,\n  121 |             Mms.TRANSACTION_ID\n  122 |         )\n  123 |         val selection = if (includeTextOnlyAttachment) {\n  124 |             \"${Mms.THREAD_ID} = ? AND ${Mms.TEXT_ONLY} = ?\"\n  125 |         } else {\n  126 |             \"${Mms.THREAD_ID} = ?\"\n  127 |         }\n  128 |         val mmsList = mutableListOf<MmsBackup>()\n  129 | \n  130 |         threadIds.map { it.toString() }.forEach { threadId ->\n  131 |             val selectionArgs = if (includeTextOnlyAttachment) {\n  132 |                 arrayOf(threadId, \"1\")\ {"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"SmsSender adds the EXTRA_SUB_ID extra to both the sent-status and delivered-status intents (getSendStatusIntent / getDeliveredStatusIntent), but no receiver ever reads SendStatusReceiver.EXTRA_SUB_ID. SmsStatusSentReceiver and SmsStatusDeliveredReceiver never call getIntExtra(EXTRA_SUB_ID, ...). The extra (and arguably the constant) is dead.","fix":"Either consume EXTRA_SUB_ID where the status is processed (e.g. to update the correct subscription), or remove the unused extra.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/messaging/SmsSender.kt:112-122","code":"  112 |     private fun getSendStatusIntent(requestUri: Uri, subId: Int): Intent {\n  113 |         val intent = Intent(SendStatusReceiver.SMS_SENT_ACTION, requestUri, app, SmsStatusSentReceiver::class.java)\n  114 |         intent.putExtra(SendStatusReceiver.EXTRA_SUB_ID, subId)\n  115 |         return intent\n  116 |     }\n  117 | \n  118 |     private fun getDeliveredStatusIntent(requestUri: Uri, subId: Int): Intent {\n  119 |         val intent = Intent(SendStatusReceiver.SMS_DELIVERED_ACTION, requestUri, app, SmsStatusDeliveredReceiver::class.java)\n  120 |         intent.putExtra(SendStatusReceiver.EXTRA_SUB_ID, subId)\n  121 |         return intent\n  122 |     }","lines":11,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/messaging/SmsSender.kt#L112-L122"},{"ref":"app/src/main/kotlin/org/fossify/messages/receivers/SendStatusReceiver.kt:29","code":"   29 |         const val EXTRA_SUB_ID = \"subId\"","lines":1,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/receivers/SendStatusReceiver.kt#L29"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`ExportedMessage` (with Gson `@SerializedName(\"sms\")`/`@SerializedName(\"mms\")`) is never instantiated or referenced anywhere in the codebase. Export serializes a flat `List<MessagesBackup>` directly (MessagesReader.getMessagesToExport returns `smsMessages + mmsMessages`, and ExportMessagesDialog encodes that list), so this class is unused dead code. It also carries Gson annotations that would not work with the kotlinx.serialization pipeline anyway.","fix":"Delete ExportedMessage.kt, or wire it into the export/import pipeline if a grouped {sms:[...], mms:[...]} format is actually intended (with @SerialName instead of @SerializedName).","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/models/ExportedMessage.kt:1-10","code":"    1 | package org.fossify.messages.models\n    2 | \n    3 | import com.google.gson.annotations.SerializedName\n    4 | \n    5 | data class ExportedMessage(\n    6 |     @SerializedName(\"sms\")\n    7 |     val sms: List<SmsBackup>?,\n    8 |     @SerializedName(\"mms\")\n    9 |     val mms: List<MmsBackup>?,\n   10 | )","lines":10,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/models/ExportedMessage.kt#L1-L10"}]},

{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"getThreadContactNames takes a `privateContacts` parameter but in getThreadParticipants and elsewhere the private-contact fallback is duplicated. More directly: in getMessages the local `isMMS = false` (line 176) and the analogous `isMMS = true` in getMMS (line 261) are single-use locals that only add indirection. Minor readability noise.","fix":"Inline the boolean literals into the Message constructor (isMMS = false / isMMS = true).","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/extensions/Context.kt:176-187","code":"  176 |         val isMMS = false\n  177 |         val message =\n  178 |             Message(\n  179 |                 id = id,\n  180 |                 body = body,\n  181 |                 type = type,\n  182 |                 status = status,\n  183 |                 participants = ArrayList(participants),\n  184 |                 date = date,\n  185 |                 read = read,\n  186 |                 threadId = thread,\n  187 |                 isMMS = isMMS,","lines":12,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/extensions/Context.kt#L176-L187"},{"ref":"app/src/main/kotlin/org/fossify/messages/extensions/Context.kt:261-285","code":"  261 |         val isMMS = true\n  262 |         val attachment = getMmsAttachment(mmsId)\n  263 |         val body = attachment.text\n  264 |         var senderNumber = \"\"\n  265 |         var senderName = \"\"\n  266 |         var senderPhotoUri = \"\"\n  267 | \n  268 |         if (type != Mms.MESSAGE_BOX_SENT && type != Mms.MESSAGE_BOX_FAILED) {\n  269 |             senderNumber = getMMSSender(mmsId)\n  270 |             val namePhoto = getNameAndPhotoFromPhoneNumber(senderNumber)\n  271 |             senderName = namePhoto.name\n  272 |             senderPhotoUri = namePhoto.photoUri ?: {"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"The comment 'while SEND_SMS and READ_SMS permissions are mandatory, READ_CONTACTS is\noptional' is accurate, but the code below also chains handleNotificationPermission and treats\na denied READ_CONTACTS as success (it proceeds regardless). That is intended, but the deeply\nnested permission callbacks make the actual control flow (READ_CONTACTS denial does not call\nfinish, but READ_SMS/SEND_SMS denial does) hard to follow and easy to break.","fix":"Consider flattening the nested permission callbacks or adding a short note that a denied\nREAD_CONTACTS intentionally still proceeds to initMessenger().","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/activities/MainActivity.kt:242-274","code":"  242 |     // while SEND_SMS and READ_SMS permissions are mandatory, READ_CONTACTS is optional.\n  243 |     // If we don't have it, we just won't be able to show the contact name in some cases\n  244 |     private fun askPermissions() {\n  245 |         handlePermission(PERMISSION_READ_SMS) {\n  246 |             if (it) {\n  247 |                 handlePermission(PERMISSION_SEND_SMS) {\n  248 |                     if (it) {\n  249 |                         handlePermission(PERMISSION_READ_CONTACTS) {\n  250 |                             handleNotificationPermission { granted ->\n  251 |                                 if (!granted) {\n  252 |                                     PermissionRequiredDialog(\n  253 |                                         activity = this,\n  254 |                                         textId = org.fossify.commons.R.string.allow_notifications_incoming_messages,\n  255 |                                         positiveActionCallback = { openNotificationSettings() })\n  256 |                                 }\n  257 |                             }\n  258 | \n  259 |                             initMessenger()\n  260 |                             bus = EventBus.getDefault()\n  261 |                             try {\n  262 |                                 bus!!.register(this)\n  263 |                             } catch (_: Exception) {\n  264 |                             }\n  265 |                         }\n  266 |                     } else {\n  267 |                         finish()\n  268 |                     }\n  269 |                 }\n  270 |             } else {\n  271 |                 finish()\n  272 |             }\n  273 |         }\n  274 |     }","lines":33,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/activities/MainActivity.kt#L242-L274"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"The comment on line 1444 reads \"is it assumed that images will always be compressed below the max MMS size limit\" - it is grammatically broken (\"is it assumed\" should be \"it is assumed\") and, more importantly, states an assumption that the code then relies on without enforcement: images (non-gif) skip the size-limit check entirely, so an oversized image will silently bypass mmsFileSizeLimit until later sending fails.","fix":"Fix the wording and either enforce/compress image size before attaching, or document where the compression that justifies the skip actually happens.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/activities/ThreadActivity.kt:1505-1513","code":" 1505 |         if (isGif || !isImage) {\n 1506 |             // is it assumed that images will always be compressed below the max MMS size limit\n 1507 |             val fileSize = getFileSizeFromUri(uri)\n 1508 |             val mmsFileSizeLimit = config.mmsFileSizeLimit\n 1509 |             if (mmsFileSizeLimit != FILE_SIZE_NONE && fileSize > mmsFileSizeLimit) {\n 1510 |                 toast(R.string.attachment_sized_exceeds_max_limit, length = Toast.LENGTH_LONG)\n 1511 |                 return\n 1512 |             }\n 1513 |         }","lines":9,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/activities/ThreadActivity.kt#L1505-L1513"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"In getMMS the selection at line 240 uses `Sms.DATE` (the constant) on the Mms.CONTENT_URI query while the comment and surrounding code talk about the MMS date column. Sms.DATE and Mms.DATE both resolve to the string \"date\" so it works, but referencing Sms.* constants in MMS queries (also lines 242, 245) is misleading and a latent bug if those constants ever diverge.","fix":"Use Mms.DATE / Mms.THREAD_ID constants in the MMS selection strings to match the queried URI.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/extensions/Context.kt:238-247","code":"  238 |     if (threadId == null && dateFrom != -1) {\n  239 |         // Should not multiply 1000 here, because date in mms's database is different from sms's.\n  240 |         selection = \"${Sms.DATE} < ${dateFrom.toLong()}\"\n  241 |     } else if (threadId != null && dateFrom == -1) {\n  242 |         selection = \"${Sms.THREAD_ID} = ?\"\n  243 |         selectionArgs = arrayOf(threadId.toString())\n  244 |     } else if (threadId != null) {\n  245 |         selection = \"${Sms.THREAD_ID} = ? AND ${Sms.DATE} < ${dateFrom.toLong()}\"\n  246 |         selectionArgs = arrayOf(threadId.toString())\n  247 |     }","lines":10,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/extensions/Context.kt#L238-L247"}]},

{"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"`MessagesImporter` tracks `messagesImported` / `messagesFailed` as mutable instance fields that are never reset. A single MessagesImporter instance used for more than one import (or where both importXml and restoreMessages run) accumulates counts across runs, producing wrong ImportResult/summary toasts. It currently works only because callers always create a fresh instance per import.","fix":"Make the counters local to each import operation (or reset them at the start of importMessages/restoreMessages).","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/helpers/MessagesImporter.kt:28-29","code":"   28 |     private var messagesImported = 0\n   29 |     private var messagesFailed = 0","lines":2,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/helpers/MessagesImporter.kt#L28-L29"}]},
{"id":"OTHER_1","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"`PATH` for broadcast actions is malformed: `\"org.fossify.org.fossify.messages.action.\"` contains a duplicated/garbled package prefix (`org.fossify.org.fossify.messages`). The resulting action strings (MARK_AS_READ, REPLY) are syntactically valid strings but clearly a typo and do not match the app's package namespace `org.fossify.messages`.","fix":"Correct to `\"org.fossify.messages.action.\"`.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/helpers/Constants.kt:52-54","code":"   52 | private const val PATH = \"org.fossify.org.fossify.messages.action.\"\n   53 | const val MARK_AS_READ = PATH + \"mark_as_read\"\n   54 | const val REPLY = PATH + \"reply\"","lines":3,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/helpers/Constants.kt#L52-L54"}]},
{"id":"OTHER_2","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"SmsSender.getInstance uses a non-synchronized lazy singleton (check-then-create on `instance`). Likewise getSmsManager mutates the module-level smsManagerInstance/associatedSubId without synchronization. These are reached from BroadcastReceivers/services on multiple threads (ensureBackgroundThread pools, RequestWriter queue). Concurrent first-access can create two SmsSender instances, and concurrent getSmsManager calls with different subIds can interleave the cache update and the `return smsManagerInstance!!`, potentially returning a manager for the wrong subscription or a transient null (!! NPE).","fix":"Synchronize the singleton/cache access (e.g. @Synchronized or a lock), or compute the SmsManager per-call without shared mutable state.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/messaging/SmsSender.kt:124-132","code":"  124 |     companion object {\n  125 |         private var instance: SmsSender? = null\n  126 |         fun getInstance(app: Application): SmsSender {\n  127 |             if (instance == null) {\n  128 |                 instance = SmsSender(app)\n  129 |             }\n  130 |             return instance!!\n  131 |         }\n  132 |     }","lines":9,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/messaging/SmsSender.kt#L124-L132"},{"ref":"app/src/main/kotlin/org/fossify/messages/messaging/SmsManager.kt:6-25","code":"    6 | private var smsManagerInstance: SmsManager? = null\n    7 | private var associatedSubId: Int = -1\n    8 | \n    9 | @Suppress(\"DEPRECATION\")\n   10 | fun getSmsManager(subId: Int): SmsManager {\n   11 |     if (smsManagerInstance == null || subId != associatedSubId) {\n   12 |         smsManagerInstance = if (subId != Settings.DEFAULT_SUBSCRIPTION_ID) {\n   13 |             try {\n   14 |                 smsManagerIn <script>
(function(){
'use strict';

// Data
const FINDINGS     = JSON.parse(document.getElementById('D').textContent);
const PROJECT_INFO = JSON.parse(document.getElementById('PI').textContent);
const SEVS     = ['critical','high','medium','low','negligible'];
const STATUSES = ['open','fixed','wont-fix','false-positive'];
const ALL_TYPES = [...new Set(FINDINGS.map(f => f.type))].sort();
// Build lookup map for O(1) access
const FINDING_BY_ID = new Map(FINDINGS.map(f => [f.id, f]));
// Only severities actually present in the report — the filter bar hides the rest.
const PRESENT_SEVS = SEVS.filter(s => FINDINGS.some(f => (f.severity || 'medium') === s));
// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.
const DIFFICULTY_ORDER = ['very_easy','easy','medium','hard'];
const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};
const PRESENT_DIFFS = DIFFICULTY_ORDER.filter(d => FINDINGS.some(f => f.difficulty === d));
const HAS_DIFFICULTY = PRESENT_DIFFS.length > 0;
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State
const S = {
  search: '', searchScope: 'all', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenDiff: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(),
};
const statuses = {};

// Persistence
function loadStatuses() {
  try { Object.assign(statuses, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch {}
}
function saveStatuses() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(statuses)); } catch {}
}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;
function syncHash() {
  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));
    if (S.search)            p.set('q',   S.search);
    if (S.searchScope !== 'all') p.set('qs', S.searchScope);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('qs'))  { S.searchScope = p.get('qs'); }
  document.getElementById('search-scope').classList.toggle('active', S.searchScope === 'locations');
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Render a "**Label:** value" line. GitHub/CommonMark only recognizes a
// ``` fence when it starts at the beginning of a line, so if the value
// itself opens with a fence, put it on its own line instead of right
// after the inline label - otherwise the fence marker gets glued onto
// "**Label:** ```" and never renders as a code block.
function mdField(label, value) {
  value = value || '';
  return /^```/.test(value.trim())
    ? '**' + label + ':**\n\n' + value
    : '**' + label + ':** ' + value;
}

// Render the "**Locations:**" block. When a location has a commit-pinned
// permalink (GitHub/GitLab), just paste the bare URL on its own line -
// GitHub/GitLab auto-expand a line-range blob link into an inline code
// preview, so re-pasting the snippet as a fenced block would duplicate it.
// Forges without a detected permalink shape (or missing commit/repo info)
// fall back to the fenced ref+snippet so the location is still readable.
function mdLocations(locations) {
  if (!locations.length) return '';
  let out = '**Locations:**\n\n';
  for (const l of locations) {
    if (l.link)               out += l.link + '\n\n';
    else if (l.code != null)  out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
    else                      out += '- `' + l.ref + '` _(file not found)_\n\n';
  }
  return out;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += mdField('Description', f.description) + '\n\n';
      out += mdLocations(f.locations);
      out += mdField('Fix', f.fix) + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build a [project] header block from embedded PROJECT_INFO, so the exported
// findings.toml is self-contained (doesn't depend on a sibling project-info.toml
// that a second, separately-triggered download could silently fail to save).
// '' when there is no project info at all.
function buildProjectToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = PROJECT_INFO || {};
  if (!Object.keys(pi).length) return '';
  const lines = ['[project]'];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n\n';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return buildProjectToml() + chunks.join('\n\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += mdField('Description', f.description) + '\n\n';
  out += mdLocations(f.locations);
  out += mdField('Fix', f.fix) + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystacks per finding (cleared on full re-render).
// Two variants: everything (default), and file/folder paths only - for when a
// search term (e.g. a directory name like 'dlls/abc') also happens to appear
// inside description/fix prose and you only want path matches.
const _hay = new Map();
const _hayLoc = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}
function hayLocOf(f) {
  if (!_hayLoc.has(f.id)) {
    _hayLoc.set(f.id, f.locations.map(l => l.ref).join(' ').toLowerCase());
  }
  return _hayLoc.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (S.searchScope === 'locations') {
      if (!hayLocOf(f).includes(q)) return false;
    } else if (!hayOf(f).includes(q) && !st.includes(q)) {
      return false;
    }
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  _hayLoc.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    // Single download (was two) - a second auto-triggered download is commonly
    // blocked by the browser unless the user explicitly allows it, which silently
    // drops project-info.toml. Embedding [project] in findings.toml itself avoids
    // that failure mode entirely.
    downloadText(buildFindingsToml(), 'findings.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});
document.getElementById('search-scope').addEventListener('click', e => {
  S.searchScope = S.searchScope === 'locations' ? 'all' : 'locations';
  e.currentTarget.classList.toggle('active', S.searchScope === 'locations');
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
