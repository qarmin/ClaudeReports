{"id":"ERR_10","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In tryImportBlockedKeywordsFromFile, the 'content' branch opens an InputStream and a\nFileOutputStream but never closes either. copyTo does not close its streams. On exception or\nsuccess the file descriptors leak. Also inputStream!! will NPE (uncaught beyond the local\ncatch) if openInputStream returns null.","fix":"Wrap the streams in use { } blocks (contentResolver.openInputStream(uri)?.use { input ->\nFileOutputStream(tempFile).use { out -> input.copyTo(out) } }) and handle the null input case.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/activities/ManageBlockedKeywordsActivity.kt:120-142","code":"  120 |     private fun tryImportBlockedKeywordsFromFile(uri: Uri) {\n  121 |         when (uri.scheme) {\n  122 |             \"file\" -> importBlockedKeywords(uri.path!!)\n  123 |             \"content\" -> {\n  124 |                 val tempFile = getTempFile(\"blocked\", \"blocked_keywords.txt\")\n  125 |                 if (tempFile == null) {\n  126 |                     toast(org.fossify.commons.R.string.unknown_error_occurred)\n  127 |                     return\n  128 |                 }\n  129 | \n  130 |                 try {\n  131 |                     val inputStream = contentResolver.openInputStream(uri)\n  132 |                     val out = FileOutputStream(tempFile)\n  133 |                     inputStream!!.copyTo(out)\n  134 |                     importBlockedKeywords(tempFile.absolutePath)\n  135 |                 } catch (e: Exception) {\n  136 |                     showErrorToast(e)\n  137 |                 }\n  138 |             }\n  139 | \n  140 |             else -> toast(org.fossify.commons.R.string.invalid_file_format)\n  141 |         }\n  142 |     }","lines":23,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/activities/ManageBlockedKeywordsActivity.kt#L120-L142"}]},
{"id":"ERR_11","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"AttachmentsAdapter.loadMediaPreview's Glide onLoadFailed calls removeAttachment(attachment) and shows a toast. onLoadFailed runs during the load lifecycle which can occur inside a layout/bind pass; removeAttachment calls submitList synchronously, which can collide with the ongoing RecyclerView layout and is a common source of 'Cannot call this method while RecyclerView is computing a layout' crashes.","fix":"Post the removeAttachment to the next frame (recyclerView.post { ... }) rather than mutating the list inside the Glide callback.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/adapters/AttachmentsAdapter.kt:185-198","code":"  185 |             .listener(object : RequestListener<Drawable> {\n  186 |                 override fun onLoadFailed(e: GlideException?, model: Any?, target: Target<Drawable>, isFirstResource: Boolean): Boolean {\n  187 |                     removeAttachment(attachment)\n  188 |                     activity.toast(org.fossify.commons.R.string.unknown_error_occurred)\n  189 |                     return false\n  190 |                 }\n  191 | \n  192 |                 override fun onResourceReady(dr: Drawable, a: Any, t: Target<Drawable>, d: DataSource, i: Boolean): Boolean {\n  193 |                     binding.thumbnail.beVisible()\n  194 |                     binding.playIcon.beVisibleIf(attachment.mimetype.isVideoMimeType())\n  195 |                     binding.compressionProgress.beGone()\n  196 |                     return false\n  197 |                 }\n  198 |             })","lines":14,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/adapters/AttachmentsAdapter.kt#L185-L198"}]},
{"id":"ERR_12","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"ExportMessagesDialog.export() uses a `success` flag, but inside the getMessagesToExport callback the empty-list branch (line 96-100) returns early after calling `dismiss()` without setting success. The `finally` block then runs with `success == false` and tries to `DocumentsContract.deleteDocument(...)` on the user's chosen URI. Choosing an existing document with no messages to export would delete that document even though no real error occurred.","fix":"Set `success = true` (or use a separate flag) in the empty-messages branch before returning, so a deliberately-empty export does not delete the target document.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/dialogs/ExportMessagesDialog.kt:88-123","code":"   88 |     private fun export(uri: Uri) {\n   89 |         ensureBackgroundThread {\n   90 |             var success = false\n   91 |             try {\n   92 |                 MessagesReader(activity).getMessagesToExport(\n   93 |                     getSms = config.exportSms,\n   94 |                     getMms = config.exportMms\n   95 |                 ) { messagesToExport ->\n   96 |                     if (messagesToExport.isEmpty()) {\n   97 |                         activity.toast(org.fossify.commons.R.string.no_entries_for_exporting)\n   98 |                         dismiss()\n   99 |                         return@getMessagesToExport\n  100 |                     }\n  101 |                     val json = Json { encodeDefaults = true }\n  102 |                     activity.contentResolver.openOutputStream(uri)!!.buffered()\n  103 |                         .use { outputStream ->\n  104 |                             json.encodeToStream(messagesToExport, outputStream)\n  105 |                         }\n  106 |                     success = true\n  107 |                     activity.toast(org.fossify.commons.R.string.exporting_successful)\n  108 |                 }\n  109 |             } catch (e: Throwable) {\n  110 |                 activity.showErrorToast(e.toString())\n  111 |             } finally {\n  112 |                 if (!success) {\n  113 |                     // delete the file to avoid leaving behind an empty/corrupt file\n  114 |                     try {\n  115 |                         DocumentsContract.deleteDocument(activity.contentResolver, uri)\n  116 |                     } catch (_: Exception) {\n  117 |                         // ignored because we don't want to show two error messages\n  118 |                     }\n  119 |                 }\n  120 | \n  121 |                 dismiss()\n  122 |             }\n  123 |         }","lines":36,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/dialogs/ExportMessagesDialog.kt#L88-L123"}]},
{"id":"ERR_13","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"markThreadMessagesUnread issues two contentResolver.update calls (SMS and MMS) with no try/catch. If the first update throws (provider failure), the second update and conversationsDB.markUnread are skipped, leaving the unread state half-applied.","fix":"Wrap each provider update in its own try/catch so one failing URI doesn't abort the rest of the operation.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/extensions/Context.kt:1031-1042","code":" 1031 | fun Context.markThreadMessagesUnread(threadId: Long) {\n 1032 |     arrayOf(Sms.CONTENT_URI, Mms.CONTENT_URI).forEach { uri ->\n 1033 |         val contentValues = ContentValues().apply {\n 1034 |             put(Sms.READ, 0)\n 1035 |             put(Sms.SEEN, 0)\n 1036 |         }\n 1037 |         val selection = \"${Sms.THREAD_ID} = ?\"\n 1038 |         val selectionArgs = arrayOf(threadId.toString())\n 1039 |         contentResolver.update(uri, contentValues, selection, selectionArgs)\n 1040 |     }\n 1041 |     conversationsDB.markUnread(threadId)\n 1042 | } ","lines":12,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/extensions/Context.kt#L1031-L1042"}]},
{"id":"ERR_14","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`Json.decodeFromStream<List<MessagesBackup>>` uses the default Json configuration, which does NOT set `ignoreUnknownKeys`. Any backup file produced by a newer app version (with extra fields) or by another tool that includes additional JSON keys will throw SerializationException and the entire import is rejected as \"invalid file format\", even though the known fields are perfectly parseable. This makes backups forward-incompatible.","fix":"Use a configured Json instance: `Json { ignoreUnknownKeys = true }` for decoding backups.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/helpers/MessagesImporter.kt:47-53","code":"   47 |     @OptIn(kotlinx.serialization.ExperimentalSerializationApi::class)\n   48 |     private fun importJson(uri: Uri) {\n   49 |         try {\n   50 |             val deserializedList =\n   51 |                 activity.contentResolver.openInputStream(uri)!!.buffered().use { inputStream ->\n   52 |                     Json.decodeFromStream<List<MessagesBackup>>(inputStream)\n   53 |                 }","lines":7,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/helpers/MessagesImporter.kt#L47-L53"}]},
{"id":"ERR_15","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`importXml` wraps the entire parse loop in a single outer `catch (_: Exception)` that maps any failure to a generic `invalid_file_format` toast and discards the exception. If parsing fails partway after some messages were already written, `refreshConversations()` (line 156) is never reached and the user sees only \"invalid file format\" despite a partial import having occurred, with no detail. The exception is fully swallowed (no logging).","fix":"Log the swallowed exception and reflect partial-import state; move refreshConversations to a finally block so already-written messages are surfaced.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/helpers/MessagesImporter.kt:118-168","code":"  118 |     private fun InputStream.importXml() {\n  119 |         try {\n  120 |             bufferedReader().use { reader ->\n  121 |                 val xmlParser = Xml.newPullParser().apply {\n  122 |                     setInput(reader)\n  123 |                 }\n  124 | \n  125 |                 xmlParser.nextTag()\n  126 |                 xmlParser.require(XmlPullParser.START_TAG, null, \"smses\")\n  127 | \n  128 |                 var depth = 1\n  129 |                 while (depth != 0) {\n  130 |                     when (xmlParser.next()) {\n  131 |                         XmlPullParser.END_TAG -> depth--\n  132 |                         XmlPullParser.START_TAG -> depth++\n  133 |                     }\n  134 | \n  135 |                     if (xmlParser.eventType != XmlPullParser.START_TAG) {\n  136 |                         continue\n  137 |                     }\n  138 | \n  139 |                     try {\n  140 |                         if (xmlParser.name == \"sms\") {\n  141 |                             if (config.importSms) {\n  142 |                                 val message = xmlParser.readSms()\n  143 |                                 messageWriter.writeSmsMessage(message)\n  144 |                                 messagesImported++\n  145 |                             } else {\n  146 |                                 xmlParser.skip()\n  147 |                             }\n  148 |                         } else {\n  149 |                             xmlParser.skip()\n  150 |                         }\n  151 |                     } catch (e: Exception) {\n  152 |                         activity.showErrorToast(e)\n  153 |                         messagesFailed++\n  154 |                     }\n  155 |                 }\n  156 |                 refreshConversations()\n  157 |             }\n  158 |             when {\n  159 |                 messagesFailed > 0 && messagesImported > 0 -> {\n  160 |                     activity.toast(org.fossify.commons.R.string.importing_some_entries_failed)\n  161 |                 }\n  162 | \n  163 |                 messagesFailed > 0 -> activity.toast(org.fossify.commons.R.string.importing_failed)\n  164 |                 else -> activity.toast(org.fossify.commons.R.string.importing_successful)\n  165 |             }\n  166 |         } catch (_: Exception) {\n  167 |             activity.toast(org.fossify.commons.R.string.invalid_file_format)\n  168 |         }","lines":51,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/helpers/MessagesImporter.kt#L118-L168"}]},
{"id":"ERR_16","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"SmsStatusDeliveredReceiver.updateSmsStatusAndDateSent calls resolver.update / resolver.query with no try/catch, unlike the analogous MessagingUtils.updateSmsMessageSendingStatus which guards with try/catch. A SQLite/provider exception here (e.g. revoked permission, deleted row) propagates up through updateAndroidDatabase into the ensureBackgroundThread body of SendStatusReceiver.onReceive, where it is uncaught and crashes that worker (and updateAppDatabase never runs, so the app DB status is never updated).","fix":"Wrap the resolver update/query in try/catch (mirroring updateSmsMessageSendingStatus) so a delivery-report DB failure does not crash the worker or skip updateAppDatabase.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/receivers/SmsStatusDeliveredReceiver.kt:62-86","code":"   62 |     private fun updateSmsStatusAndDateSent(context: Context, messageUri: Uri?, timeSentInMillis: Long = -1L) {\n   63 |         val resolver = context.contentResolver\n   64 |         val values = ContentValues().apply {\n   65 |             if (status != Sms.Sent.STATUS_NONE) {\n   66 |                 put(Sms.Sent.STATUS, status)\n   67 |             }\n   68 |             put(Sms.Sent.DATE_SENT, timeSentInMillis)\n   69 |         }\n   70 | \n   71 |         if (messageUri != null) {\n   72 |             resolver.update(messageUri, values, null, null)\n   73 |         } else {\n   74 |             // mark latest sms as delivered, need to check if this is still necessary (or reliable)\n   75 |             val cursor = resolver.query(Sms.Sent.CONTENT_URI, null, null, null, \"date desc\")\n   76 |             cursor?.use {\n   77 |                 if (cursor.moveToFirst()) {\n   78 |                     @SuppressLint(\"Range\")\n   79 |                     val id = cursor.getString(cursor.getColumnIndex(Sms.Sent._ID))\n   80 |                     val selection = \"${Sms._ID} = ?\"\n   81 |                     val selectionArgs = arrayOf(id.toString())\n   82 |                     resolver.update(Sms.Sent.CONTENT_URI, values, selection, selectionArgs)\n   83 |                 }\n   84 |             }\n   85 |         }\n   86 |     }","lines":25,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/receivers/SmsStatusDeliveredReceiver.kt#L62-L86"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"medium","description":"onNewIntent() calls finish() then startActivity(intent) with the same Intent object that was just delivered. The thread is fully torn down and recreated on every new intent (e.g. tapping a notification while the thread is open), losing scroll position, draft state and any in-memory caches, and causing a visible activity restart flicker. Reusing the activity in-place (re-running loadConversation with the new extras) would be far cheaper and is the conventional singleTop pattern.","fix":"Instead of finish()+startActivity, set intent = intent, update threadId/extras and re-run loadConversation() in place, or only restart when the thread id actually changed.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/activities/ThreadActivity.kt:237-241","code":"  237 |     override fun onNewIntent(intent: Intent) {\n  238 |         super.onNewIntent(intent)\n  239 |         finish()\n  240 |         startActivity(intent)\n  241 |     }","lines":5,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/activities/ThreadActivity.kt#L237-L241"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"medium","description":"SmsStatusSentReceiver.updateAndroidDatabase reads the BroadcastReceiver result code via the property `val resultCode = resultCode` (i.e. BroadcastReceiver.getResultCode()) instead of using the `receiverResultCode` parameter that was explicitly captured for this purpose. updateAndroidDatabase is invoked from inside ensureBackgroundThread{} in the base class SendStatusReceiver.onReceive, which runs AFTER onReceive() has returned. getResultCode() is only valid during onReceive(); once onReceive returns, the receiver's pending-result state is finished and getResultCode() no longer reflects the broadcast's actual result. This can mark a successfully sent SMS as FAILED (or vice-versa) and trigger spurious error toasts. The base class already captures the correct value into `receiverResultCode` precisely to avoid this; updateAppDatabase in the same class correctly uses `receiverResultCode`.","fix":"Use the passed-in parameter: `val resultCode = receiverResultCode` (and drop the property read), matching how updateAppDatabase already uses receiverResultCode.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/receivers/SmsStatusSentReceiver.kt:26-41","code":"   26 |     override fun updateAndroidDatabase(context: Context, intent: Intent, receiverResultCode: Int) {\n   27 |         val messageUri: Uri? = intent.data\n   28 |         val resultCode = resultCode\n   29 |         val messagingUtils = context.messagingUtils\n   30 | \n   31 |         val type = if (resultCode == Activity.RESULT_OK) {\n   32 |             Sms.MESSAGE_TYPE_SENT\n   33 |         } else {\n   34 |             Sms.MESSAGE_TYPE_FAILED\n   35 |         }\n   36 |         messagingUtils.updateSmsMessageSendingStatus(messageUri, type)\n   37 |         messagingUtils.maybeShowErrorToast(\n   38 |             resultCode = resultCode,\n   39 |             errorCode = intent.getIntExtra(EXTRA_ERROR_CODE, NO_ERROR_CODE)\n   40 |         )\n   41 |     }","lines":16,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/receivers/SmsStatusSentReceiver.kt#L26-L41"},{"ref":"app/src/main/kotlin/org/fossify/messages/receivers/SendStatusReceiver.kt:15-21","code":"   15 |     override fun onReceive(context: Context, intent: Intent) {\n   16 |         val resultCode = resultCode\n   17 |         ensureBackgroundThread {\n   18 |             updateAndroidDatabase(context, intent, resultCode)\n   19 |             updateAppDatabase(context, intent, resultCode)\n   20 |         }\n   21 |     }","lines":7,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/receivers/SendStatusReceiver.kt#L15-L21"}]},
{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"EventBus is registered every time the conversations are loaded. loadArchivedConversations()\nis called from both onCreate() and onResume(), and each call executes bus.register(this).\nEventBus.register throws EventBusException if the subscriber is already registered; the\nexception is silently swallowed by the surrounding try/catch, so it 'works' by accident.\nRe-registering on every onResume is fragile and relies on exception-swallowing for\ncorrectness. The same pattern exists in RecycleBinConversationsActivity.","fix":"Register the bus once in onCreate (or guard with EventBus.getDefault().isRegistered(this))\nand keep the data-loading logic separate from registration. Do not rely on a swallowed\nexception to prevent double registration.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/activities/ArchivedConversationsActivity.kt:49-95","code":"   49 |     override fun onResume() {\n   50 |         super.onResume()\n   51 |         setupTopAppBar(binding.archiveAppbar, NavigationIcon.Arrow)\n   52 |         loadArchivedConversations()\n   53 |     }\n   54 | \n   55 |     override fun onDestroy() {\n   56 |         super.onDestroy()\n   57 |         bus?.unregister(this)\n   58 |     }\n   59 | \n   60 |     private fun setupOptionsMenu() {\n   61 |         binding.archiveToolbar.inflateMenu(R.menu.archive_menu)\n   62 |         binding.archiveToolbar.setOnMenuItemClickListener { menuItem ->\n   63 |             when (menuItem.itemId) {\n   64 |                 R.id.empty_archive -> removeAll()\n   65 |                 else -> return@setOnMenuItemClickListener false\n   66 |             }\n   67 |             return@setOnMenuItemClickListener true\n   68 |         }\n   69 |     }\n   70 | \n   71 |     private fun updateOptionsMenu(conversations: ArrayList<Conversation>) {\n   72 |         binding.archiveToolbar.menu.apply {\n   73 |             findItem(R.id.empty_archive).isVisible = conversations.isNotEmpty()\n   74 |         }\n   75 |     }\n   76 | \n   77 |     private fun loadArchivedConversations() {\n   78 |         ensureBackgroundThread {\n   79 |             val conversations = try {\n   80 |                 conversationsDB.getAllArchived().toMutableList() as ArrayList<Conversation>\n   81 |             } catch (e: Exception) {\n   82 |                 ArrayList()\n   83 |             }\n   84 | \n   85 |             runOnUiThread {\n   86 |                 setupConversations(conversations)\n   87 |             }\n   88 |         }\n   89 | \n   90 |         bus = EventBus.getDefault()\n   91 |         try {\n   92 |             bus!!.register(this)\n   93 |         } catch (ignored: Exception) {\n   94 |         }\n   95 |     }","lines":47,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/activities/ArchivedConversationsActivity.kt#L49-L95"},{"ref":"app/src/main/kotlin/org/fossify/messages/activities/RecycleBinConversationsActivity.kt:48-95","code":"   48 |     override fun onResume() {\n   49 |         super.onResume()\n   50 |         setupTopAppBar(binding.recycleBinAppbar, NavigationIcon.Arrow)\n   51 |         loadRecycleBinConversations()\n   52 |     }\n   53 | \n   54 |     override fun onDestroy() {\n   55 |         super.onDestroy()\n   56 |         bus?.unregister(this)\n   57 |     }\n   58 | \n   59 |     private fun setupOptionsMenu() {\n   60 |         binding.recycleBinToolbar.inflateMenu(R.menu.recycle_bin_menu)\n   61 |         binding.recycleBinToolbar.setOnMenuItemClickListener { menuItem ->\n   62 |             when (menuItem.itemId) {\n   63 |                 R.id.empty_recycle_bin -> removeAll()\n   64 |                 else -> return@setOnMenuItemClickListener false\n   65 |             }\n   66 |             return@setOnMenuItemClickListener true\n   67 |         }\n   68 |     }\n   69 | \n   70 |     private fun updateOptionsMenu(conversations: ArrayList<Conversation>) {\n   71 |         binding.recycleBinToolbar.menu.apply {\n   72 |             findItem(R.id.empty_recycle_bin).isVisible = conversations.isNotEmpty()\n   73 |         }\n   74 |     }\n   75 | \n   76 |     private fun loadRecycleBinConversations() {\n   77 |         ensureBackgroundThread {\n   78 |             val conversations = try {\n   79 |                 conversationsDB.getAllWithMessagesInRecycleBin()\n   80 |                     .toMutableList() as ArrayList<Conversation>\n   81 |             } catch (e: Exception) {\n   82 |                 ArrayList()\n   83 |             }\n   84 | \n   85 |             runOnUiThread {\n   86 |                 setupConversations(conversations)\n   87 |             }\n   88 |         }\n   89 | \n   90 |         bus = EventBus.getDefault()\n   91 |         try {\n   92 |             bus!!.register(this)\n   93 |         } catch (ignored: Exception) {\n   94 |         }\n   95 |     }","lines":48,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/activities/RecycleBinConversationsActivity.kt#L48-L95"}]},
{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"getSerializableExtra(THREAD_ATTACHMENT_URIS) is used with an unchecked cast to ArrayList<Uri> (line 932). On Android 13+ the no-Class overload of getSerializableExtra is deprecated, and the cast to a generic ArrayList<Uri> is unchecked - a malformed extra yields ClassCastException at element access, not at the cast.","fix":"Use IntentCompat.getSerializableExtra(intent, key, ArrayList::class.java) and validate element types, or pass a parcelable ArrayList<Uri> via getParcelableArrayListExtra.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/activities/ThreadActivity.kt:959-962","code":"  959 |             } else if (intent.extras?.containsKey(THREAD_ATTACHMENT_URIS) == true) {\n  960 |                 (intent.getSerializableExtra(THREAD_ATTACHMENT_URIS) as? ArrayList<Uri>)?.forEach {\n  961 |                     addAttachment(it)\n  962 |                 }","lines":4,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/activities/ThreadActivity.kt#L959-L962"}]},
{"id":"API_5","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"BaseConversationsAdapter registers an AdapterDataObserver whose onChanged/onItemRangeInserted/onItemRangeMoved restore the saved RecyclerView layout-manager state. State is only saved in updateConversations (saveRecyclerViewState before submitList). Restoring scroll position on every onChanged/insert/move (including inserts triggered by other code paths and the async updateDrafts notifyDataSetChanged) can fight the user's scroll position and snap the list back to a stale saved position, or restore a null/stale Parcelable.","fix":"Restore only once right after the submitList commit callback (tie save/restore to the same update), and avoid restoring on unrelated notifications such as the drafts notifyDataSetChanged.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/adapters/BaseConversationsAdapter.kt:55-62","code":"   55 |         registerAdapterDataObserver(object : RecyclerView.AdapterDataObserver() {\n   56 |             override fun onChanged() = restoreRecyclerViewState()\n   57 |             override fun onItemRangeMoved(fromPosition: Int, toPosition: Int, itemCount: Int) =\n   58 |                 restoreRecyclerViewState()\n   59 | \n   60 |             override fun onItemRangeInserted(positionStart: Int, itemCount: Int) =\n   61 |                 restoreRecyclerViewState()\n   62 |         })","lines":8,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/adapters/BaseConversationsAdapter.kt#L55-L62"},{"ref":"app/src/main/kotlin/org/fossify/messages/adapters/BaseConversationsAdapter.kt:228-234","code":"  228 |     private fun saveRecyclerViewState() {\n  229 |         recyclerViewState = recyclerView.layoutManager?.onSaveInstanceState()\n  230 |     }\n  231 | \n  232 |     private fun restoreRecyclerViewState() {\n  233 |         recyclerView.layoutManager?.onRestoreInstanceState(recyclerViewState)\n  234 |     }","lines":7,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/adapters/BaseConversationsAdapter.kt#L228-L234"}]},
{"id":"API_6","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"VCardViewerAdapter mutates the backing `items` list inside the ViewHolder (expandRow/collapseRow add/remove property rows and call notifyItemRangeInserted/Removed) but never notifies the header row itself that its expand/collapse icon state changed. The icon is updated imperatively on `binding` only for the currently-clicked holder; after recycling, getItemViewType/onBindViewHolder re-derive icon state from item.expanded which is fine, but the structural mutation of a shared list driven by a holder, combined with items.indexOf(vCardWrapper) (object-identity-ish lookup) is fragile: rapid clicks or rebinding while an animation is running can desync positions and lead to inconsistent adapter state (RecyclerView 'inconsistency detected' crashes).","fix":"Drive expansion through a ListAdapter/DiffUtil flattened model rather than mutating a shared MutableList from the holder, or at minimum recompute positions via bindingAdapterPosition and notifyItemChanged the header row.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/adapters/VCardViewerAdapter.kt:117-142","code":"  117 |         private fun expandOrCollapseRow(item: VCardWrapper) {\n  118 |             val properties = item.properties\n  119 |             if (item.expanded) {\n  120 |                 collapseRow(properties, item)\n  121 |             } else {\n  122 |                 expandRow(properties, item)\n  123 |             }\n  124 |         }\n  125 | \n  126 |         private fun expandRow(properties: List<VCardPropertyWrapper>, vCardWrapper: VCardWrapper) {\n  127 |             vCardWrapper.expanded = true\n  128 |             val nextPosition = items.indexOf(vCardWrapper) + 1\n  129 |             items.addAll(nextPosition, properties)\n  130 |             notifyItemRangeInserted(nextPosition, properties.size)\n  131 |             binding.expandCollapseIcon.setImageResource(R.drawable.ic_collapse_up)\n  132 |         }\n  133 | \n  134 |         private fun collapseRow(properties: List<VCardPropertyWrapper>, vCardWrapper: VCardWrapper) {\n  135 |             vCardWrapper.expanded = false\n  136 |             val nextPosition = items.indexOf(vCardWrapper) + 1\n  137 |             repeat(properties.size) {\n  138 |                 items.removeAt(nextPosition)\n  139 |             }\n  140 |             notifyItemRangeRemoved(nextPosition, properties.size)\n  141 |             binding.expandCollapseIcon.setImageResource(R.drawable.ic_expand_down)\n  142 |         }","lines":26,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/adapters/VCardViewerAdapter.kt#L117-L142"}]},
{"id":"API_7","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"The backup models SmsBackup, MmsBackup, MmsAddress and MmsPart annotate every field with Gson's `@SerializedName(...)` (com.google.gson.annotations.SerializedName), but both export and import use kotlinx.serialization, not Gson. Export calls `Json { encodeDefaults = true }.encodeToStream(...)` (ExportMessagesDialog.kt:101-104) and import calls `Json.decodeFromStream<List<MessagesBackup>>(...)` (MessagesImporter.kt:52). kotlinx.serialization ignores `@SerializedName` entirely (it honors `@SerialName`), and no `JsonNamingStrategy` is configured. Therefore the emitted/expected JSON keys are the Kotlin property names (e.g. `subscriptionId`, `dateSent`, `messageType`, `messageBox`, `contentType`, `deliveryReport`, `readReport`, `serviceCenter`) instead of the intended Telephony-style names (`sub_id`, `date_sent`, `m_type`, `msg_box`, `ct_t`, `d_rpt`, `rr`, `service_center`). The app round-trips its own format consistently, but the annotations are dead/misleading and the format does not match what the field names declare (breaking any expected interop and confusing maintainers).","fix":"Replace `com.google.gson.annotations.SerializedName` with `kotlinx.serialization.SerialName` on all four models (e.g. `@SerialName(\"date_sent\") val dateSent: Long`). kotlinx honors `@SerialName` for the JSON key, producing the intended snake_case keys and making import/export match the declared field names.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/models/SmsBackup.kt:11-33","code":"   11 | data class SmsBackup(\n   12 |     @SerializedName(\"sub_id\")\n   13 |     val subscriptionId: Long,\n   14 |     @SerializedName(\"address\")\n   15 |     val address: String,\n   16 |     @SerializedName(\"body\")\n   17 |     val body: String?,\n   18 |     @SerializedName(\"date\")\n   19 |     val date: Long,\n   20 |     @SerializedName(\"date_sent\")\n   21 |     val dateSent: Long,\n   22 |     @SerializedName(\"locked\")\n   23 |     val locked: Int,\n   24 |     @SerializedName(\"protocol\")\n   25 |     val protocol: String?,\n   26 |     @SerializedName(\"read\")\n   27 |     val read: Int,\n   28 |     @SerializedName(\"status\")\n   29 |     val status: Int,\n   30 |     @SerializedName(\"type\")\n   31 |     val type: Int,\n   32 |     @SerializedName(\"service_center\")\n   33 |     val serviceCenter: String?,","lines":23,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/models/SmsBackup.kt#L11-L33"},{"ref":"app/src/main/kotlin/org/fossify/messages/models/MmsBackup.kt:11-48","code":"   11 |     @SerializedName(\"creator\")\n   12 |     val creator: String?,\n   13 |     @SerializedName(\"ct_t\")\n   14 |     val contentType: String?,\n   15 |     @SerializedName(\"d_rpt\")\n   16 |     val deliveryReport: Int,\n   17 |     @SerializedName(\"date\")\n   18 |     val date: Long,\n   19 |     @SerializedName(\"date_sent\")\n   20 |     val dateSent: Long,\n   21 |     @SerializedName(\"locked\")\n   22 |     val locked: Int,\n   23 |     @SerializedName(\"m_type\")\n   24 |     val messageType: Int,\n   25 |     @SerializedName(\"msg_box\")\n   26 |     val messageBox: Int,\n   27 |     @SerializedName(\"read\")\n   28 |     val read: Int,\n   29 |     @SerializedName(\"rr\")\n   30 |     val readReport: Int,\n   31 |     @SerializedName(\"seen\")\n   32 |     val seen: Int,\n   33 |     @SerializedName(\"text_only\")\n   34 |     val textOnly: Int,\n   35 |     @SerializedName(\"st\")\n   36 |     val status: String?,\n   37 |     @SerializedName(\"sub\")\n   38 |     val subject: String?,\n   39 |     @SerializedName(\"sub_cs\")\n   40 |     val subjectCharSet: String?,\n   41 |     @SerializedName(\"sub_id\")\n   42 |     val subscriptionId: Long,\n   43 |     @SerializedName(\"tr_id\")\n   44 |     val transactionId: String?,\n   45 |     @SerializedName(\"addresses\")\n   46 |     val addresses: List<MmsAddress>,\n   47 |     @SerializedName(\"parts\")\n   48 |     val parts: List<MmsPart>,","lines":38,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/models/MmsBackup.kt#L11-L48"},{"ref":"app/src/main/kotlin/org/fossify/messages/models/MmsAddress.kt:11-16","code":"   11 |     @SerializedName(\"address\")\n   12 |     val address: String,\n   13 |     @SerializedName(\"type\")\n   14 |     val type: Int,\n   15 |     @SerializedName(\"charset\")\n   16 |     val charset: Int","lines":6,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/models/MmsAddress.kt#L11-L16"},{"ref":"app/src/main/kotlin/org/fossify/messages/models/MmsPart.kt:11-34","code":"   11 |     @SerializedName(\"cd\")\n   12 |     val contentDisposition: String?,\n   13 |     @SerializedName(\"chset\")\n   14 |     val charset: String?,\n   15 |     @SerializedName(\"cid\")\n   16 |     val contentId: String?,\n   17 |     @SerializedName(\"cl\")\n   18 |     val contentLocation: String?,\n   19 |     @SerializedName(\"ct\")\n   20 |     val contentType: String,\n   21 |     @SerializedName(\"ctt_s\")\n   22 |     val ctStart: String?,\n   23 |     @SerializedName(\"ctt_t\")\n   24 |     val ctType: String?,\n   25 |     @SerializedName(\"fn\")\n   26 |     val filename: String?,\n   27 |     @SerializedName(\"name\")\n   28 |     val name: String?,\n   29 |     @SerializedName(\"seq\")\n   30 |     val sequenceOrder: Int,\n   31 |     @SerializedName(\"text\")\n   32 |     val text: String?,\n   33 |     @SerializedName(\"data\")\n   34 |     val data: String?,","lines":24,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/models/MmsPart.kt#L11-L34"}]},
{"id":"API_8","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"The createNotificationChannel/removeNotificationChannel and the\nSettings.ACTION_CHANNEL_NOTIFICATION_SETTINGS intent use APIs that require API 26+, but there\nis no version guard and no SuppressLint. While the app's minSdk may be >= 26, relying on that\nimplicitly is fragile; also notificationManager.deleteNotificationChannel on a channel id that\nwas never created (toggled off without ever toggling on) is a silent no-op which is fine, but\ntoggling custom notifications creates a channel named after the conversation title that is\nnever deleted if the conversation is later renamed (channel name becomes stale).","fix":"Confirm minSdk >= 26 (channels) and update the notification channel name when the\nconversation is renamed in setupTextViews/RenameConversationDialog, since the channel id is\nthe threadId but the displayed name is captured at channel-creation time.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/activities/ConversationDetailsActivity.kt:107-139","code":"  107 |             customNotificationsButton.setOnClickListener {\n  108 |                 Intent(Settings.ACTION_CHANNEL_NOTIFICATION_SETTINGS).apply {\n  109 |                     putExtra(Settings.EXTRA_APP_PACKAGE, packageName)\n  110 |                     putExtra(Settings.EXTRA_CHANNEL_ID, threadId.toString())\n  111 |                     startActivity(this)\n  112 |                 }\n  113 |             }\n  114 |         }\n  115 |     }\n  116 | \n  117 |     private fun createNotificationChannel() {\n  118 |         val name = conversation?.title\n  119 |         val audioAttributes = AudioAttributes.Builder()\n  120 |             .setUsage(AudioAttributes.USAGE_NOTIFICATION)\n  121 |             .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)\n  122 |             .setLegacyStreamType(AudioManager.STREAM_NOTIFICATION)\n  123 |             .build()\n  124 | \n  125 |         NotificationChannel(threadId.toString(), name, NotificationManager.IMPORTANCE_HIGH).apply {\n  126 |             setBypassDnd(false)\n  127 |             enableLights(true)\n  128 |             setSound(\n  129 |                 RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION),\n  130 |                 audioAttributes\n  131 |             )\n  132 |             enableVibration(true)\n  133 |             notificationManager.createNotificationChannel(this)\n  134 |         }\n  135 |     }\n  136 | \n  137 |     private fun removeNotificationChannel() {\n  138 |         notificationManager.deleteNotificationChannel(threadId.toString())\n  139 |     }","lines":33,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/activities/ConversationDetailsActivity.kt#L107-L139"}]},
{"id":"API_9","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"onActivityResult/startActivityForResult (deprecated) is used for the make-default-SMS-app\nflow instead of the Activity Result API (registerForActivityResult) that the rest of the\ncodebase uses (e.g. SettingsActivity, ManageBlockedKeywordsActivity). This is the legacy\ndeprecated API and is inconsistent with the project's own conventions.","fix":"Migrate the ROLE_SMS / ACTION_CHANGE_DEFAULT request to registerForActivityResult with\nActivityResultContracts.StartActivityForResult, matching the rest of the codebase.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/activities/MainActivity.kt:197-206","code":"  197 |     override fun onActivityResult(requestCode: Int, resultCode: Int, resultData: Intent?) {\n  198 |         super.onActivityResult(requestCode, resultCode, resultData)\n  199 |         if (requestCode == MAKE_DEFAULT_APP_REQUEST) {\n  200 |             if (resultCode == RESULT_OK) {\n  201 |                 askPermissions()\n  202 |             } else {\n  203 |                 finish()\n  204 |             }\n  205 |         }\n  206 |     }","lines":10,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/activities/MainActivity.kt#L197-L206"},{"ref":"app/src/main/kotlin/org/fossify/messages/activities/MainActivity.kt:217-240","code":"  217 |     private fun loadMessages() {\n  218 |         if (isQPlus()) {\n  219 |             val roleManager = getSystemService(RoleManager::class.java)\n  220 |             if (roleManager!!.isRoleAvailable(RoleManager.ROLE_SMS)) {\n  221 |                 if (roleManager.isRoleHeld(RoleManager.ROLE_SMS)) {\n  222 |                     askPermissions()\n  223 |                 } else {\n  224 |                     val intent = roleManager.createRequestRoleIntent(RoleManager.ROLE_SMS)\n  225 |                     startActivityForResult(intent, MAKE_DEFAULT_APP_REQUEST)\n  226 |                 }\n  227 |             } else {\n  228 |                 toast(org.fossify.commons.R.string.unknown_error_occurred)\n  229 |                 finish()\n  230 |             }\n  231 |         } else {\n  232 |             if (Telephony.Sms.getDefaultSmsPackage(this) == packageName) {\n  233 |                 askPermissions()\n  234 |             } else {\n  235 |                 val intent = Intent(Telephony.Sms.Intents.ACTION_CHANGE_DEFAULT)\n  236 |                 intent.putExtra(Telephony.Sms.Intents.EXTRA_PACKAGE_NAME, packageName)\n  237 |                 startActivityForResult(intent, MAKE_DEFAULT_APP_REQUEST)\n  238 |             }\n  239 |         }\n  240 |     }","lines":24,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/activities/MainActivity.kt#L217-L240"}]},
{"id":"API_10","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"getParcelableExtra<Uri>(Intent.EXTRA_STREAM) and getParcelableArrayListExtra<Uri>(...) use\nthe deprecated, type-unsafe overloads. On Android 13+ these are deprecated in favor of the\ntyped IntentCompat overloads; the untyped versions can also silently return mistyped data.","fix":"Use IntentCompat.getParcelableExtra(intent, EXTRA_STREAM, Uri::class.java) and\nIntentCompat.getParcelableArrayListExtra(...) for type-safe, version-aware retrieval.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/activities/NewConversationActivity.kt:278-287","code":"  278 |             if (intent.action == Intent.ACTION_SEND && intent.extras?.containsKey(Intent.EXTRA_STREAM) == true) {\n  279 |                 val uri = intent.getParcelableExtra<Uri>(Intent.EXTRA_STREAM)\n  280 |                 putExtra(THREAD_ATTACHMENT_URI, uri?.toString())\n  281 |             } else if (intent.action == Intent.ACTION_SEND_MULTIPLE && intent.extras?.containsKey(\n  282 |                     Intent.EXTRA_STREAM\n  283 |                 ) == true\n  284 |             ) {\n  285 |                 val uris = intent.getParcelableArrayListExtra<Uri>(Intent.EXTRA_STREAM)\n  286 |                 putExtra(THREAD_ATTACHMENT_URIS, uris)\n  287 |             }","lines":10,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/activities/NewConversationActivity.kt#L278-L287"},{"ref":"app/src/main/kotlin/org/fossify/messages/activities/VCardViewerActivity.kt:33","code":"   33 |         val vCardUri = intent.getParcelableExtra(EXTRA_VCARD_URI) as? Uri","lines":1,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/activities/VCardViewerActivity.kt#L33"}]},
{"id":"API_11","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"saveAttachments calls takePersistableUriPermission with both READ and WRITE flags on resultData.data!!, but for PICK_SAVE_FILE_INTENT (ACTION_CREATE_DOCUMENT single file) the returned uri is a document uri, not a tree uri, and persisting permission on it is unnecessary; more importantly the call happens before the destinationUri null-guard, so a null data crashes. Persistable permission is only meaningful for the tree (directory) case.","fix":"Only take persistable permission in the tree-uri branch, after null-checking the uri.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/activities/ThreadActivity.kt:1541-1545","code":" 1541 |     private fun saveAttachments(resultData: Intent) {\n 1542 |         applicationContext.contentResolver.takePersistableUriPermission(\n 1543 |             resultData.data!!, FLAG_GRANT_READ_URI_PERMISSION or FLAG_GRANT_WRITE_URI_PERMISSION\n 1544 |         )\n 1545 |         val destinationUri = resultData.data ?: return","lines":5,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/activities/ThreadActivity.kt#L1541-L1545"}]},
{"id":"API_12","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"VCardViewerActivity assigns a fresh VCardViewerAdapter to the RecyclerView from parseVCardFromUri's\ncallback via runOnUiThread without checking the activity is still alive (isDestroyed/isFinishing).\nIf parsing completes after the activity is destroyed, touching binding/adapter can crash or leak.\nNewConversationActivity guards similar work with !isDestroyed, but VCardViewerActivity does not.","fix":"Guard the runOnUiThread callback with if (!isDestroyed && !isFinishing) before touching\nbinding/adapter.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/activities/VCardViewerActivity.kt:33-42","code":"   33 |         val vCardUri = intent.getParcelableExtra(EXTRA_VCARD_URI) as? Uri\n   34 |         if (vCardUri != null) {\n   35 |             setupOptionsMenu(vCardUri)\n   36 |             parseVCardFromUri(this, vCardUri) {\n   37 |                 runOnUiThread {\n   38 |                     setupContactsList(it)\n   39 |                 }\n   40 |             }\n   41 |         }\n   42 |     }","lines":10,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/activities/VCardViewerActivity.kt#L33-L42"},{"ref":"app/src/main/kotlin/org/fossify/messages/activities/VCardViewerActivity.kt:67-76","code":"   67 |     private fun setupContactsList(vCards: List<VCard>) {\n   68 |         val items = prepareData(vCards)\n   69 |         val adapter = VCardViewerAdapter(this, items.toMutableList()) { item ->\n   70 |             val property = item as? VCardPropertyWrapper\n   71 |             if (property != null) {\n   72 |                 handleClick(item)\n   73 |             }\n   74 |         }\n   75 |         binding.contactsList.adapter = adapter\n   76 |     }","lines":10,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/activities/VCardViewerActivity.kt#L67-L76"}]},
{"id":"API_13","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"ThreadAdapter.getItemId packs ThreadDateTime's id from `item.date.toLong() shl SIM_BITS` with only 21 bits reserved for the SIM hash and the date shifted left by 21. generateStableId then masks the result with THREAD_KEY_MASK. Date (seconds) shifted left 21 bits can exceed the key mask width, truncating the high bits of the date and producing stable-id collisions between distinct date-time separators, which with setHasStableIds(true) can cause incorrect view animations/recycling.","fix":"Verify date<<21 fits within THREAD_KEY_MASK; if not, hash the (date, simID) pair into the available key bits instead of bit-shifting raw seconds.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/adapters/ThreadAdapter.kt:200-212","code":"  200 |     override fun getItemId(position: Int): Long {\n  201 |         return when (val item = getItem(position)) {\n  202 |             is Message -> item.getStableId()\n  203 |             is ThreadDateTime -> {\n  204 |                 val sim = (item.simID.hashCode().toLong() and SIM_MASK)\n  205 |                 val key = (item.date.toLong() shl SIM_BITS) or sim\n  206 |                 generateStableId(THREAD_DATE_TIME, key)\n  207 |             }\n  208 |             is ThreadError -> generateStableId(THREAD_SENT_MESSAGE_ERROR, item.messageId)\n  209 |             is ThreadSending -> generateStableId(THREAD_SENT_MESSAGE_SENDING, item.messageId)\n  210 |             is ThreadSent -> generateStableId(THREAD_SENT_MESSAGE_SENT, item.messageId)\n  211 |         }\n  212 |     }","lines":13,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/adapters/ThreadAdapter.kt#L200-L212"},{"ref":"app/src/main/kotlin/org/fossify/messages/helpers/Constants.kt:118-121","code":"  118 | fun generateStableId(type: Int, key: Long): Long {\n  119 |     require(type in 0 until (1 shl THREAD_TYPE_BITS))\n  120 |     return (type.toLong() shl THREAD_TYPE_SHIFT) or (key and THREAD_KEY_MASK)\n  121 | }","lines":4,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/helpers/Constants.kt#L118-L121"}]},
{"id":"API_14","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"getFileSizeFromUri calls cursor.moveToFirst() without checking its return value (line 1211). If the cursor is empty, getLong(sizeIndex) is called on an invalid row position and throws; the throw is caught by the inner try/catch returning FILE_SIZE_NONE, so it works, but relying on an exception for the empty-cursor case is fragile and obscures intent.","fix":"Guard with `if (!cursor.moveToFirst()) return@use FILE_SIZE_NONE` before reading the column.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/extensions/Context.kt:1217-1231","code":" 1217 |         return contentResolver.query(uri, arrayOf(OpenableColumns.SIZE), null, null, null)\n 1218 |             ?.use { cursor ->\n 1219 |                 // maybe shouldn't trust ContentResolver for size:\n 1220 |                 // https://stackoverflow.com/questions/48302972/content-resolver-returns-wrong-size\n 1221 |                 val sizeIndex = cursor.getColumnIndex(OpenableColumns.SIZE)\n 1222 |                 if (sizeIndex == -1) {\n 1223 |                     return@use FILE_SIZE_NONE\n 1224 |                 }\n 1225 |                 cursor.moveToFirst()\n 1226 |                 return try {\n 1227 |                     cursor.getLong(sizeIndex)\n 1228 |                 } catch (_: Throwable) {\n 1229 |                     FILE_SIZE_NONE\n 1230 |                 }\n 1231 |             } ?: FILE_SIZE_NONE","lines":15,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/extensions/Context.kt#L1217-L1231"}]},
{"id":"API_15","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"Cursor.rowsToJson handles FIELD_TYPE_INTEGER, FLOAT, STRING and NULL but silently drops FIELD_TYPE_BLOB columns (no branch in the when). A BLOB column simply won't appear in the resulting JSON object, which can produce silently incomplete serialization.","fix":"Add a FIELD_TYPE_BLOB branch (e.g. base64-encode getBlob(i)) or explicitly document/assert that blobs are unsupported.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/extensions/Cursor.kt:12-17","code":"   12 |         when (getType(i)) {\n   13 |             Cursor.FIELD_TYPE_INTEGER -> obj.addProperty(key, getLong(i))\n   14 |             Cursor.FIELD_TYPE_FLOAT -> obj.addProperty(key, getFloat(i))\n   15 |             Cursor.FIELD_TYPE_STRING -> obj.addProperty(key, getString(i))\n   16 |             Cursor.FIELD_TYPE_NULL -> obj.add(key, JsonNull.INSTANCE)\n   17 |         }","lines":6,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/extensions/Cursor.kt#L12-L17"}]},
{"id":"API_16","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`getMessagesWithText` / `getConversationsWithText` take a `text` parameter used directly as the right-hand side of a `LIKE` (`body LIKE :text`). The `%` wildcards must be supplied by the caller, and any user-typed `%` or `_` in a search term is treated as a wildcard (search semantics surprise). Also, callers that forget to wrap the term in `%...%` get exact-match behaviour. Not SQL injection (parameter is bound), but a fragile contract.","fix":"Escape LIKE metacharacters in the search term and add the wildcards inside the query (e.g. `LIKE '%' || :text || '%' ESCAPE '\\\\'`).","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/interfaces/MessagesDao.kt:56-57","code":"   56 |     @Query(\"SELECT * FROM messages WHERE body LIKE :text\")\n   57 |     fun getMessagesWithText(text: String): List<Message>","lines":2,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/interfaces/MessagesDao.kt#L56-L57"},{"ref":"app/src/main/kotlin/org/fossify/messages/interfaces/ConversationsDao.kt:42-43","code":"   42 |     @Query(\"SELECT * FROM conversations WHERE title LIKE :text\")\n   43 |     fun getConversationsWithText(text: String): List<Conversation>","lines":2,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/interfaces/ConversationsDao.kt#L42-L43"}]},
{"id":"API_17","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"Context.cancelScheduleSendPendingIntent recreates the PendingIntent with FLAG_UPDATE_CURRENT before cancelling it. Because the requested PendingIntent may not exist, FLAG_UPDATE_CURRENT will create a brand-new PendingIntent and immediately cancel it, which does not cancel any previously scheduled alarm if the original intent did not exactly match. Also note the original schedule intent carried THREAD_ID/SCHEDULED_MESSAGE_ID extras while this one carries none; extras are not part of PendingIntent equality so matching still works, but the correct flag for a cancel/lookup is FLAG_NO_CREATE so that no spurious PendingIntent is created when none exists.","fix":"Use FLAG_NO_CREATE (or FLAG_NO_CREATE or FLAG_IMMUTABLE) when retrieving the PendingIntent to cancel, and null-check the result before calling cancel().","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/messaging/ScheduledMessage.kt:34-38","code":"   34 | fun Context.cancelScheduleSendPendingIntent(messageId: Long) {\n   35 |     val intent = Intent(this, ScheduledMessageReceiver::class.java)\n   36 |     val flags = PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE\n   37 |     PendingIntent.getBroadcast(this, messageId.toInt(), intent, flags).cancel()\n   38 | }","lines":5,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/messaging/ScheduledMessage.kt#L34-L38"}]},
{"id":"API_18","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"SmsStatusSentReceiver.showSendingFailedNotification posts to the main thread, checks ProcessLifecycleOwner state, then starts another ensureBackgroundThread. This is invoked from within updateAppDatabase which itself already runs inside ensureBackgroundThread (from SendStatusReceiver / its own block). The receiver's goAsync-style pending result is not used here (SendStatusReceiver.onReceive does not call goAsync at all - it just spawns a background thread), meaning the process can be killed before these nested async hops complete, dropping the failed-send notification and the DB update.","fix":"Use goAsync() in SendStatusReceiver.onReceive and finish() the pending result only after the async work completes, so the system keeps the process alive for the status update.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/receivers/SendStatusReceiver.kt:15-21","code":"   15 |     override fun onReceive(context: Context, intent: Intent) {\n   16 |         val resultCode = resultCode\n   17 |         ensureBackgroundThread {\n   18 |             updateAndroidDatabase(context, intent, resultCode)\n   19 |             updateAppDatabase(context, intent, resultCode)\n   20 |         }\n   21 |     }","lines":7,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/receivers/SendStatusReceiver.kt#L15-L21"},{"ref":"app/src/main/kotlin/org/fossify/messages/receivers/SmsStatusSentReceiver.kt:43-75","code":"   43 |     override fun updateAppDatabase(context: Context, intent: Intent, receiverResultCode: Int) {\n   44 |         val messageUri = intent.data\n   45 |         if (messageUri != null) {\n   46 |             val messageId = messageUri.lastPathSegment?.toLong() ?: 0L\n   47 |             ensureBackgroundThread {\n   48 |                 val type = if (receiverResultCode == Activity.RESULT_OK) {\n   49 |                     Sms.MESSAGE_TYPE_SENT\n   50 |                 } else {\n   51 |                     showSendingFailedNotification(context, messageId)\n   52 |                     Sms.MESSAGE_TYPE_FAILED\n   53 |                 }\n   54 | \n   55 |                 context.messagesDB.updateType(messageId, type)\n   56 |                 refreshMessages()\n   57 |                 refreshConversations()\n   58 |             }\n   59 |         }\n   60 |     }\n   61 | \n   62 |     private fun showSendingFailedNotification(context: Context, messageId: Long) {\n   63 |         Handler(Looper.getMainLooper()).post {\n   64 |             if (ProcessLifecycleOwner.get().lifecycle.currentState.isAtLeast(Lifecycle.State.RESUMED)) {\n   65 |                 return@post\n   66 |             }\n   67 |             val privateCursor = context.getMyContactsCursor(favoritesOnly = false, withPhoneNumbersOnly = true)\n   68 |             ensureBackgroundThread {\n   69 |                 val address = context.getMessageRecipientAddress(messageId)\n   70 |                 val threadId = context.getThreadId(address)\n   71 |                 val recipientName = context.getNameFromAddress(address, privateCursor)\n   72 |                 context.notificationHelper.showSendingFailedNotification(recipientName, threadId)\n   73 |             }\n   74 |         }\n   75 |     }","lines":33,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/receivers/SmsStatusSentReceiver.kt#L43-L75"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"high","difficulty":"medium","description":"getThreadItems() performs database writes inside a tight loop over every message: for each unread message it calls markMessageRead() AND conversationsDB.markRead(threadId), and getThreadItems() is itself invoked from many UI-thread paths (insertOrUpdateMessage runs runOnUiThread before/around it, deleteMessages, etc.). conversationsDB.markRead(threadId) is redundantly issued once per unread message instead of once total, producing N identical DB updates. getThreadItems also mutates persistent state (marking read) despite its name implying a pure transform.","fix":"Collect unread message ids in the loop, then issue a single batched markMessagesRead and one conversationsDB.markRead(threadId) after the loop. Move side effects out of getThreadItems into a dedicated function, and ensure it runs off the main thread.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/activities/ThreadActivity.kt:1374-1378","code":" 1374 |             if (!message.read) {\n 1375 |                 hadUnreadItems = true\n 1376 |                 markMessageRead(message.id, message.isMMS)\n 1377 |                 conversationsDB.markRead(threadId)\n 1378 |             }","lines":5,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/activities/ThreadActivity.kt#L1374-L1378"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"getMyContactsCursor() is called on the main thread. getCachedConversations() runs on a\nbackground thread, but switches to runOnUiThread before calling getNewConversations(), and\ngetNewConversations() executes getMyContactsCursor(...) (a ContentResolver query against the\nprivate-contacts provider) directly on the UI thread before it enters ensureBackgroundThread.\nThis blocks the main thread on a cross-process content-provider query.","fix":"Move the getMyContactsCursor() call inside the ensureBackgroundThread block in\ngetNewConversations(), or obtain the cursor while still on the background thread in\ngetCachedConversations() instead of inside runOnUiThread.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/activities/MainActivity.kt:303-316","code":"  303 |             runOnUiThread {\n  304 |                 setupConversations(conversations, cached = true)\n  305 |                 getNewConversations(\n  306 |                     (conversations + archived).toMutableList() as ArrayList<Conversation>\n  307 |                 )\n  308 |             }\n  309 |             conversations.forEach {\n  310 |                 clearExpiredScheduledMessages(it.threadId)\n  311 |             }\n  312 |         }\n  313 |     }\n  314 | \n  315 |     private fun getNewConversations(cachedConversations: ArrayList<Conversation>) {\n  316 |         val privateCursor = getMyContactsCursor(favoritesOnly = false, withPhoneNumbersOnly = true)","lines":14,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/activities/MainActivity.kt#L303-L316"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"launchThreadActivity() calls getThreadId(numbers) on the main thread (it is invoked from\nclick listeners / setupAdapter callbacks on the UI thread). getThreadId() ultimately calls\nTelephony Threads.getOrCreateThreadId(), a synchronous ContentResolver/IPC call that can\nblock the UI thread, especially for new threads that must be created.","fix":"Resolve the thread id on a background thread (ensureBackgroundThread) and then start the\nactivity via runOnUiThread, or pass only the numbers and let ThreadActivity resolve the\nthread id off the main thread.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/activities/NewConversationActivity.kt:268-291","code":"  268 |     private fun launchThreadActivity(phoneNumber: String, name: String, body: String = \"\") {\n  269 |         hideKeyboard()\n  270 |         val numbers = phoneNumber.split(\";\").toSet()\n  271 |         val number = if (numbers.size == 1) phoneNumber else Gson().toJson(numbers)\n  272 |         Intent(this, ThreadActivity::class.java).apply {\n  273 |             putExtra(THREAD_ID, getThreadId(numbers))\n  274 |             putExtra(THREAD_TITLE, name)\n  275 |             putExtra(THREAD_TEXT, body.ifEmpty { intent.getStringExtra(Intent.EXTRA_TEXT) })\n  276 |             putExtra(THREAD_NUMBER, number)\n  277 | \n  278 |             if (intent.action == Intent.ACTION_SEND && intent.extras?.containsKey(Intent.EXTRA_STREAM) == true) {\n  279 |                 val uri = intent.getParcelableExtra<Uri>(Intent.EXTRA_STREAM)\n  280 |                 putExtra(THREAD_ATTACHMENT_URI, uri?.toString())\n  281 |             } else if (intent.action == Intent.ACTION_SEND_MULTIPLE && intent.extras?.containsKey(\n  282 |                     Intent.EXTRA_STREAM\n  283 |                 ) == true\n  284 |             ) {\n  285 |                 val uris = intent.getParcelableArrayListExtra<Uri>(Intent.EXTRA_STREAM)\n  286 |                 putExtra(THREAD_ATTACHMENT_URIS, uris)\n  287 |             }\n  288 | \n  289 |             startActivity(this)\n  290 |         }\n  291 |     }","lines":24,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/activities/NewConversationActivity.kt#L268-L291"},{"ref":"app/src/main/kotlin/org/fossify/messages/extensions/Context.kt:1053-1060","code":" 1053 | @SuppressLint(\"NewApi\")\n 1054 | fun Context.getThreadId(addresses: Set<String>): Long {\n 1055 |     return try {\n 1056 |         Threads.getOrCreateThreadId(this, addresses)\n 1057 |     } catch (_: Exception) {\n 1058 |         0L\n 1059 |     }\n 1060 | }","lines":8,"link":"https://github.com/FossifyOrg/Messages/blob/7af607d6080be4008418711897dc5e83479d1d06/app/src/main/kotlin/org/fossify/messages/extensions/Context.kt#L1053-L1060"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"ThreadAdapter.setupView and setupReceivedMessageView/setupSentMessageView do heavy per-bind work: build a fresh ConstraintSet, clone() the whole layout and applyTo() on every bind; build a SimpleContactsHelper, generate a contact letter icon, build RequestOptions and kick off a Glide load; inflate attachment item views (ItemAttachmentImageBinding/Vcard/Document) and removeAllViews/addView for every attachment. All of this runs in onBindViewHolder on the main thread for each row scrolled, causing scroll jank in long threads.","fix":"Cache/reuse ConstraintSets and SimpleContactsHelper, avoid re-inflating attachment views every bind, and move icon generation off the bind path where possible.","locations":[{"ref":"app/src/main/kotlin/org/fossify/messages/adapters/ThreadAdapter.kt:366-407","code":"  366 |     private fun setupView(holder: ViewHolder, view: View, message: Message) {\n  367 |         ItemMessageBinding.bind(view).apply {\n  368 |             threadMessageHolder.isSelected = selectedKeys.contains(message.getSelectionKey())\n  369 |             threadMessageBody.apply {\n  370 |                 text = message.body\n  371 |                 setTextSize(TypedValue.COMPLEX_UNIT_PX, fontSize)\n  372 |                 beVisibleIf(message.body.isNotEmpty())\n  373 |                 setOnLongClickListener {\n  374 |                     holder.viewLongClicked()\n  375 |                     true\n  376 |                 }\n  377 | \n  378 |                 setOnClickListener {\n  379 |                     holder.viewClicked(message)\n  380 |                 }\n  381 |             }\n  382 | \n  383 |             if (message.isReceivedMessage()) {\n  384 |                 setupReceivedMessageView(messageBinding = this, message = message)\n  385 |             } else {\n  386 |                 setupSentMessageView(messageBinding = this, message = messag
