{"id":"OVF_37","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"parse_tiff_ifd() per-IFD entry length sanity check uses `2 * fsize` and only applies for len > 8: `if (len > 8 && savepos + len > 2 * fsize)`. The factor 2*fsize is far looser than the actual file, and len <= 8 tags are never checked. Combined with the tiff_get overflow above, a tag can point well past EOF; individual tag handlers then fseek/fread beyond the file. The check should be against fsize, not 2*fsize.","fix":"Validate `savepos + (INT64)len > fsize` (and treat len as 64-bit) for all tags, not only len>8.","locations":[{"ref":"src/metadata/tiff.cpp:59-64","code":"   59 |     INT64 savepos = ftell(ifp);\n   60 |     if (len > 8 && savepos + len > 2 * fsize)\n   61 |     {\n   62 |       fseek(ifp, save, SEEK_SET); // Recover tiff-read position!!\n   63 |       continue;\n   64 |     }","lines":6,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/tiff.cpp#L59-L64"}]},
{"id":"OVF_38","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"CR3 0xf00c Fuji RAFData WB parsing indexes rafdata[] with offsets computed from file data without a tight upper bound. `for (...; ofst += 3) { icWBC[...]=rafdata[ofst]; rafdata[ofst+1]; rafdata[ofst+2]; }` only checks the loop counter wb_ind < Fuji_wb_list1.size(), not that ofst+2 stays within lenRAFData. rafdata is allocated with lenRAFData+1 ushorts; ofst starts at fi-15 (fi found by matching), so a crafted RAFData can make ofst+2 exceed the buffer, an OOB read.","fix":"Bound every rafdata access: require ofst+2 < lenRAFData inside the wb_ind loop (as is partially done for the CCT loop at lines 1238-1239).","locations":[{"ref":"src/metadata/tiff.cpp:1213-1223","code":" 1213 | \t\t\t\tif (fi >= 15)\n 1214 | \t\t\t\t{\n 1215 | \t\t\t\t\tfor (int wb_ind = 0, ofst = fi - 15; wb_ind < (int)Fuji_wb_list1.size();\n 1216 | \t\t\t\t\t\twb_ind++, ofst += 3)\n 1217 | \t\t\t\t\t{\n 1218 | \t\t\t\t\t\ticWBC[Fuji_wb_list1[wb_ind]][1] =\n 1219 | \t\t\t\t\t\t\ticWBC[Fuji_wb_list1[wb_ind]][3] = rafdata[ofst];\n 1220 | \t\t\t\t\t\ticWBC[Fuji_wb_list1[wb_ind]][0] = rafdata[ofst + 1];\n 1221 | \t\t\t\t\t\ticWBC[Fuji_wb_list1[wb_ind]][2] = rafdata[ofst + 2];\n 1222 | \t\t\t\t\t}\n 1223 | \t\t\t\t}","lines":11,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/tiff.cpp#L1213-L1223"}]},
{"id":"OVF_39","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"CR3 0xf00c: rafdata Tungsten-search loop bound is off. `for (int fi = 0; fi < int(lenRAFData - 3); fi++)` then reads rafdata[fi], rafdata[fi+1], rafdata[fi+2]; the cast to int of (lenRAFData-3) is fine, but later `fi += 24; fi += 96;` jumps fi forward and the subsequent loop `for (fj = fi; fj < fi+15; fj+=3)` only guards `if (fj > lenRAFData - 3) break;` using a signed/unsigned mixed comparison (lenRAFData is unsigned; fj is int). If lenRAFData < 3 the unsigned subtraction wraps to a huge value, defeating the guard. Reachable because the outer guard at lines 1146-1147 only requires lenRAFData > 3, but the post-jump indices can exceed it.","fix":"Use signed 64-bit comparisons for all rafdata bound checks and validate fi/fj+2 < lenRAFData before each access.","locations":[{"ref":"src/metadata/tiff.cpp:1226-1245","code":" 1226 |                   fi += 24;\n 1227 |                 fi += 96;\n 1228 |                 for (fj = fi; fj < (fi + 15); fj += 3) // looking for the end of the WB table\n 1229 |                 {\n 1230 | \t\t\t\t\tif (fj > libraw_internal_data.unpacker_data.lenRAFData - 3)\n 1231 | \t\t\t\t\t\tbreak;\n 1232 |                   if (rafdata[fj] != rafdata[fi])\n 1233 |                   {\n 1234 |                     fj -= 93;\n 1235 |                     if (is34)\n 1236 |                       fj -= 9;\n 1237 | //printf (\"wb start in DNG: 0x%04x\\n\", fj*2-0x4e);\n 1238 |                     for (int iCCT = 0, ofst = fj; iCCT < 31 \n 1239 | \t\t\t\t\t\t&& ofst < libraw_internal_data.unpacker_data.lenRAFData - 3;\n 1240 |                          iCCT++, ofst += 3)\n 1241 |                     {\n 1242 |                       icWBCCTC[iCCT][0] = float(FujiCCT_K[iCCT]);\n 1243 |                       icWBCCTC[iCCT][1] = rafdata[ofst + 1];\n 1244 |                       icWBCCTC[iCCT][2] = icWBCCTC[iCCT][4] = rafdata[ofst];\n 1245 |                       icWBCCTC[iCCT][3] = rafdata[ofst + 2];","lines":20,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/tiff.cpp#L1226-L1245"}]},
{"id":"OVF_40","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"size is computed as int (iheight*iwidth) and used as malloc element count; the multiply (size*3 + ...) is done in int arithmetic before being passed to malloc. For large but allowed dimensions this can overflow to a small/negative value, under-allocating fimg while the loops index up to size*3, causing heap overflow. The non-OpenMP path caps pixel count at 0x15540000 but still does int math for the malloc size argument.","fix":"Compute size and the allocation byte count in size_t/int64 and validate before malloc; reject oversized inputs.","locations":[{"ref":"src/postprocessing/postprocessing_aux.cpp:50-52","code":"   50 |   size = iheight * iwidth;\n   51 |   fimg = (float *)malloc((size * 3 + iheight + iwidth + 128) * sizeof *fimg);\n   52 |   temp = fimg + size * 3;","lines":3,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/postprocessing/postprocessing_aux.cpp#L50-L52"}]},
{"id":"OVF_41","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"kodak_thumb_loader() allocates imgdata.image with `calloc(S.iheight * S.iwidth, sizeof(*imgdata.image))` where S.iheight/S.iwidth are ushort set from T.theight/T.twidth. The product S.iheight*S.iwidth is computed in int and can overflow for large dimensions before the byte size (*16) is applied; the preceding guards cap twidth/theight at 8192 each and theight*twidth at LIBRAW_MAX_THUMBNAIL_MB*1M, which mitigates but the multiplication itself is still int and relies on those caps being present/consistent. Also `T.thumb = calloc(S.width * S.height, P1.colors)` and `T.tlength = S.width*S.height*P1.colors` (line 212-213) recompute in int with no overflow guard after S.width/S.height were swapped.","fix":"Compute allocation sizes in size_t/INT64 and validate the product against LIBRAW_MAX_THUMBNAIL_MB before calloc; keep the dimension caps.","locations":[{"ref":"src/utils/thumb_utils.cpp:69-70","code":"   69 |   imgdata.image =\n   70 |       (ushort(*)[4])calloc(S.iheight * S.iwidth, sizeof(*imgdata.image));","lines":2,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/utils/thumb_utils.cpp#L69-L70"},{"ref":"src/utils/thumb_utils.cpp:212-213","code":"  212 |   T.thumb = (char *)calloc(S.width * S.height, P1.colors);\n  213 |   T.tlength = S.width * S.height * P1.colors;","lines":2,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/utils/thumb_utils.cpp#L212-L213"}]},
{"id":"OVF_42","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"LibRaw::tiff_get() multiplies `*len * tagtype_dataunit_bytes[...]` (unsigned * int) without overflow check when deciding whether to follow the value offset. A crafted len near UINT_MAX can wrap the product so the `> 4` test is bypassed (or wrongly taken). Combined with get4()+base as the new seek target (also unbounded), parsing proceeds from an attacker-chosen file position. The IOSPACE_CHECK guard is compile-time optional and only checks 12 bytes from current pos.","fix":"Cast to 64-bit (INT64) before multiplying and compare against 4, and bound-check the resulting seek target (get4()+base) against file size.","locations":[{"ref":"src/utils/utils_dcraw.cpp:315-330","code":"  315 | void LibRaw::tiff_get(INT64 base, unsigned *tag, unsigned *type,\n  316 |                       unsigned *len, INT64 *save)\n  317 | {\n  318 | #ifdef LIBRAW_IOSPACE_CHECK\n  319 |   INT64 pos = ftell(ifp);\n  320 |   INT64 fsize = ifp->size();\n  321 |   if (fsize < 12 || (fsize - pos) < 12)\n  322 |     throw LIBRAW_EXCEPTION_IO_EOF;\n  323 | #endif\n  324 |   *tag = get2();\n  325 |   *type = get2();\n  326 |   *len = get4();\n  327 |   *save = ftell(ifp) + 4LL;\n  328 |   if (*len * tagtype_dataunit_bytes[(*type <= LIBRAW_EXIFTAG_TYPE_IFD8) ? *type : 0] > 4)\n  329 |     fseek(ifp, INT64(get4()) + base, SEEK_SET);\n  330 | }","lines":16,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/utils/utils_dcraw.cpp#L315-L330"}]},
{"id":"OVF_43","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"new_huffman_tree allocates HUF_TREE_MAX_NODES(1<<bits) = 28 * (1<<bits) nodes. For the TRUE/CAMF paths bits is hardcoded to 8 (fine), but x3f_load_huffman is called with bits up to whatever the image type dictates and GET_TABLE(HUF->table, GET4, 1<<bits, ...) allocates 1<<bits uint32 plus mapping. bits is fixed (8/10) in current callers so not directly attacker-controlled, but '1 << bits' as a signed int and the node multiply (28 * (1<<bits) * sizeof(node)) are unchecked for overflow should bits ever grow; relies solely on x3f_limited_calloc which has its own overflow bug (see first finding).","fix":"Bound bits explicitly (e.g. <= 12) and compute node count in 64-bit; rely on a corrected x3f_limited_calloc.","locations":[{"ref":"src/x3f/x3f_utils_patched.cpp:210-218","code":"  210 | static void new_huffman_tree(x3f_hufftree_t *HTP, int bits)\n  211 | {\n  212 |   int leaves = 1 << bits;\n  213 | \n  214 |   HTP->free_node_index = 0;\n  215 |   HTP->total_node_index = HUF_TREE_MAX_NODES(leaves);\n  216 |   HTP->nodes = (x3f_huffnode_t *)x3f_limited_calloc(1, HUF_TREE_MAX_NODES(leaves) *\n  217 |                                                sizeof(x3f_huffnode_t));\n  218 | }","lines":9,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/x3f/x3f_utils_patched.cpp#L210-L218"},{"ref":"src/x3f/x3f_utils_patched.cpp:1475-1478","code":" 1475 |   int table_size = 1 << bits;\n 1476 |   int row_offsets_size = ID->rows * sizeof(HUF->row_offsets.element[0]);\n 1477 | \n 1478 |   GET_TABLE(HUF->table, GET4, table_size, uint32_t);","lines":4,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/x3f/x3f_utils_patched.cpp#L1475-L1478"}]},
{"id":"OVF_44","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"In x3f_new_from_file the per-entry bounds check is 'if (DE->input.offset + DE->input.size > fsize * 2) goto _err'. Two problems: (1) offset+size are uint32 and can wrap, and (2) the threshold is fsize*2 rather than fsize, so an entry may legitimately point up to 2x past EOF and still pass, defeating the purpose of the check. Later seeks/reads to these offsets then operate beyond the file.","fix":"Use 64-bit: if ((INT64)DE->input.offset + (INT64)DE->input.size > fsize) goto _err; (compare against fsize, not fsize*2).","locations":[{"ref":"src/x3f/x3f_utils_patched.cpp:435-438","code":"  435 |       GET4(DE->input.offset);\n  436 |       GET4(DE->input.size);\n  437 |       if (DE->input.offset + DE->input.size > fsize * 2)\n  438 |         goto _err;","lines":4,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/x3f/x3f_utils_patched.cpp#L435-L438"}]},
{"id":"OVF_45","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"read_data_block computes 'size = DE->input.size + DE->input.offset - fpos - footer' in uint32 arithmetic. If footer (or fpos) exceeds the remaining bytes, the subtraction underflows to a huge uint32. The guard 'fpos + size > file->size()' can itself overflow (fpos + huge size wraps) and fpos was masked with 0x7fffffff, dropping the high bit of a >2GB tell. A crafted directory entry (small size/offset, large header/footer) can yield a near-4GB size that passes the check and is handed to x3f_limited_malloc / GETN.","fix":"Compute everything in 64-bit (INT64), reject if input.offset+input.size > filesize, if fpos < input.offset, or if footer > (input.offset+input.size - fpos); only then compute size and validate fpos+size <= filesize without overflow.","locations":[{"ref":"src/x3f/x3f_utils_patched.cpp:1264-1278","code":" 1264 | static uint32_t read_data_block(void **data, x3f_info_t *I,\n 1265 |                                 x3f_directory_entry_t *DE, uint32_t footer)\n 1266 | {\n 1267 |   uint32_t fpos = (I->input.file->tell() & 0x7fffffffU) ;\n 1268 |   uint32_t size = DE->input.size + DE->input.offset - fpos - footer;\n 1269 | \n 1270 |   if (fpos + size > I->input.file->size())\n 1271 |     throw LIBRAW_EXCEPTION_IO_CORRUPT;\n 1272 |  \n 1273 |   *data = (void *)x3f_limited_malloc(size);\n 1274 | \n 1275 |   GETN(*data, size);\n 1276 | \n 1277 |   return size;\n 1278 | }","lines":15,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/x3f/x3f_utils_patched.cpp#L1264-L1278"}]},
{"id":"OVF_46","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"canon_load_raw uses 'pixel[(block<<6)+i]' where pixel = raw_image + row*raw_width and nblocks = MIN(8,raw_height-row)*raw_width>>6. For the final partial group of 8 rows the product may not be a multiple of 64; block<<6+i can address up to nblocks*64 entries which can slightly exceed the 8*raw_width pixels of the current band but stays within the global raw_image only because of the +8 row allocation margin. Relies on the allocation margin rather than an explicit bound.","fix":"Bound the write index against raw_width*raw_height (or the band) explicitly instead of relying on the +8 row over-allocation.","locations":[{"ref":"src/decoders/decoders_dcraw.cpp:218-251","code":"  218 |     for (row = 0; row < raw_height; row += 8)\n  219 |     {\n  220 |       checkCancel();\n  221 |       pixel = raw_image + row * raw_width;\n  222 |       nblocks = MIN(8, raw_height - row) * raw_width >> 6;\n  223 |       for (block = 0; block < nblocks; block++)\n  224 |       {\n  225 |         memset(diffbuf, 0, sizeof diffbuf);\n  226 |         for (i = 0; i < 64; i++)\n  227 |         {\n  228 |           leaf = gethuff(huff[i > 0]);\n  229 |           if (leaf == 0 && i)\n  230 |             break;\n  231 |           if (leaf == 0xff)\n  232 |             continue;\n  233 |           i += leaf >> 4;\n  234 |           len = leaf & 15;\n  235 |           if (len == 0)\n  236 |             continue;\n  237 |           diff = getbits(len);\n  238 |           if ((diff & (1 << (len - 1))) == 0)\n  239 |             diff -= (1 << len) - 1;\n  240 |           if (i < 64)\n  241 |             diffbuf[i] = diff;\n  242 |         }\n  243 |         diffbuf[0] += carry;\n  244 |         carry = diffbuf[0];\n  245 |         for (i = 0; i < 64; i++)\n  246 |         {\n  247 |           if (pnum++ % raw_width == 0)\n  248 |             base[0] = base[1] = 512;\n  249 |           if ((pixel[(block << 6) + i] = base[i & 1] += diffbuf[i]) >> 10)\n  250 |             derror();\n  251 |         }","lines":34,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/decoders_dcraw.cpp#L218-L251"}]},
{"id":"OVF_47","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"pentax_4shot_load_raw writes into result[(raw_width)*(row+move_row)+move_col] with dstrow[col][...] for col<raw_width-move_col. The result buffer is alloc_sz = raw_width*(raw_height+16)*4*sizeof(ushort); indexing uses raw_width as the stride for a 4-channel array, consistent, but move_row/move_col come from p4shot_order (user param) and the loop bound 'raw_height - move_row' / 'raw_width - move_col' assume move_* in {0,1}. The +16 row margin covers move_row, but there is no assert that COLOR()/colors indexing stays in [0,3].","fix":"Assert move_row/move_col in {0,1} and colors[] in [0,3]; the +16 margin should be documented as the safety reserve.","locations":[{"ref":"src/decoders/decoders_libraw.cpp:55-126","code":"   55 | void LibRaw::pentax_4shot_load_raw()\n   56 | {\n   57 |   size_t alloc_sz = size_t(imgdata.sizes.raw_width) * (size_t(imgdata.sizes.raw_height) + 16) * 4 * sizeof(ushort);\n   58 |   if (INT64(alloc_sz) > INT64(imgdata.rawparams.max_raw_memory_mb) * INT64(1024 * 1024))\n   59 |     throw LIBRAW_EXCEPTION_TOOBIG;\n   60 | \n   61 | #ifdef LIBRAW_CALLOC_RAWSTORE\n   62 |   ushort *plane = (ushort *)calloc(size_t(imgdata.sizes.raw_width) * size_t(imgdata.sizes.raw_height), sizeof(ushort));\n   63 | #else\n   64 |   ushort *plane = (ushort *)malloc(size_t(imgdata.sizes.raw_width) *\n   65 |                                    size_t(imgdata.sizes.raw_height) * sizeof(ushort));\n   66 | #endif\n   67 | \n   68 |   if (!plane)\n   69 |     throw LIBRAW_EXCEPTION_ALLOC;\n   70 | \n   71 | #ifdef LIBRAW_CALLOC_RAWSTORE\n   72 |   ushort(*result)[4] = (ushort(*)[4])calloc(alloc_sz,1);\n   73 | #else\n   74 |   ushort(*result)[4] = (ushort(*)[4])malloc(alloc_sz);\n   75 | #endif\n   76 |   if(!result)\n   77 |     throw LIBRAW_EXCEPTION_ALLOC;\n   78 | \n   79 |   struct movement_t\n   80 |   {\n   81 |     int row, col;\n   82 |   } _move[4] = {\n   83 |       {1, 1},\n   84 |       {0, 1},\n   85 |       {0, 0},\n   86 |       {1, 0},\n   87 |   };\n   88 | \n   89 |   int tidx = 0;\n   90 |   for (int i = 0; i < 4; i++)\n   91 |   {\n   92 |     int move_row, move_col;\n   93 |     if (imgdata.rawparams.p4shot_order[i] >= '0' &&\n   94 |         imgdata.rawparams.p4shot_order[i] <= '3')\n   95 |     {\n   96 |       move_row = ((imgdata.rawparams.p4shot_order[i] - '0') & 2) ? 1 : 0;\n   97 |       move_col = ((imgdata.rawparams.p4shot_order[i] - '0') & 1) ? 1 : 0;\n   98 |     }\n   99 |     else\n  100 |     {\n  101 |       move_row = _move[i].row;\n  102 |       move_col = _move[i].col;\n  103 |     }\n  104 |     for (; tidx < 16; tidx++)\n  105 |       if (tiff_ifd[tidx].t_width == imgdata.sizes.raw_width &&\n  106 |           tiff_ifd[tidx].t_height == imgdata.sizes.raw_height &&\n  107 |           tiff_ifd[tidx].bps > 8 && tiff_ifd[tidx].samples == 1)\n  108 |         break;\n  109 |     if (tidx >= 16)\n  110 |       break;\n  111 |     imgdata.rawdata.raw_image = plane;\n  112 |     ID.input->seek(tiff_ifd[tidx].offset, SEEK_SET);\n  113 |     imgdata.idata.filters = 0xb4b4b4b4;\n  114 |     libraw_internal_data.unpacker_data.data_offset = tiff_ifd[tidx].offset;\n  115 |     (this->*pentax_component_load_raw)();\n  116 |     for (int row = 0; row < imgdata.sizes.raw_height - move_row; row++)\n  117 |     {\n  118 |       int colors[2];\n  119 |       for (int c = 0; c < 2; c++)\n  120 |         colors[c] = COLOR(row, c);\n  121 |       ushort *srcrow = &plane[imgdata.sizes.raw_width * row];\n  122 |       ushort(*dstrow)[4] =\n  123 |           &result[(imgdata.sizes.raw_width) * (row + move_row) + move_col];\n  124 |       for (int col = 0; col < imgdata.sizes.raw_width - move_col; col++)\n  125 |         dstrow[col][colors[col % 2]] = srcrow[col];\n  126 |     }","lines":72,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/de RAW(row, col + c) = (bitbuf >> c * 10) & 0x3ff;\n  264 |     }\n  265 |   }\n  266 |   free(data);\n  267 | }","lines":20,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/decoders_libraw_dcrdefs.cpp#L248-L267"}]},
{"id":"OVF_49","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"smal_v9_load_raw reads nseg = (uchar)fgetc(ifp) (0..255) then loops 'for (i=0;i<nseg*2;i++) ((unsigned*)seg)[i]=...' into seg[256][2] (512 unsigned). With nseg=255 it writes indices 0..509 (ok) and also writes seg[nseg] = seg[255] (ok). However the per-segment offsets read from the file (get4()) are passed unchecked to smal_decode_segment which fseeks/reads using them; seg[1][0] is clamped to raw_width*raw_height but seg start/positions are otherwise trusted. Worth bounding nseg and validating segment ranges.","fix":"Reject nseg > 255 boundaries explicitly and validate that decoded segment offsets/pixel ranges stay within the file and within raw_width*raw_height before decoding.","locations":[{"ref":"src/decoders/smal.cpp:160-179","code":"  160 | void LibRaw::smal_v9_load_raw()\n  161 | {\n  162 |   unsigned seg[256][2], offset, nseg, holes, i;\n  163 | \n  164 |   fseek(ifp, 67, SEEK_SET);\n  165 |   offset = get4();\n  166 |   nseg = (uchar)fgetc(ifp);\n  167 |   fseek(ifp, offset, SEEK_SET);\n  168 |   for (i = 0; i < nseg * 2; i++)\n  169 |     ((unsigned *)seg)[i] = get4() + unsigned(data_offset & 0xffffffff) * (i & 1);\n  170 |   fseek(ifp, 78, SEEK_SET);\n  171 |   holes = fgetc(ifp);\n  172 |   fseek(ifp, 88, SEEK_SET);\n  173 |   seg[nseg][0] = raw_height * raw_width;\n  174 |   seg[nseg][1] = get4() + unsigned(data_offset & 0xffffffff);\n  175 |   for (i = 0; i < nseg; i++)\n  176 |     smal_decode_segment(seg + i, holes);\n  177 |   if (holes)\n  178 |     fill_holes(holes);\n  179 | }","lines":20,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/smal.cpp#L160-L179"}]},
{"id":"OVF_50","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"parse_fuji() tag 0x2f00 reads nWBs = get4() into a signed int, then nWBs = MIN(nWBs, 6). A crafted value with the high bit set becomes negative; the subsequent loop \"wb_ind < LIBRAW_WBI_Custom1+nWBs\" then does not execute (harmless here), but the unchecked signed/unsigned conversion of a file-controlled count is fragile and the len>=4+16*nWBs guard also breaks for negative nWBs. parseAdobeRAFMakernote() has the analogous MIN(sget4(...),6) pattern.","fix":"Clamp nWBs to [0,6] explicitly, e.g. nWBs = (nWBs < 0) ? 0 : MIN(nWBs, 6), and treat the count as unsigned before comparison.","locations":[{"ref":"src/metadata/fuji.cpp:1302-1306","code":" 1302 |       int nWBs = get4();\n 1303 |       nWBs = MIN(nWBs, 6);\n 1304 |       for (int wb_ind = LIBRAW_WBI_Custom1; wb_ind < LIBRAW_WBI_Custom1+nWBs; wb_ind++) {\n 1305 |         FORC4 icWBC[wb_ind][GRGB_2_RGBG(c)] = get2();\n 1306 |         if ((len >= unsigned(4+16*nWBs)) && average_WBData) {","lines":5,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/fuji.cpp#L1302-L1306"},{"ref":"src/metadata/fuji.cpp:282-287","code":"  282 |         int nWBs = MIN(PrivateMknBuf.sget4(posPrivateMknBuf), 6);\n  283 |         posWB = posPrivateMknBuf + 4;\n  284 |         for (int wb_ind = LIBRAW_WBI_Custom1; wb_ind < LIBRAW_WBI_Custom1+nWBs; wb_ind++) {\n  285 |           FORC4 icWBC[wb_ind][GRGB_2_RGBG(c)] =\n  286 | \t\t\t  PrivateMknBuf.sget2(posWB + (c << 1));\n  287 |           if ((PrivateTagBytes >= unsigned(4+16*nWBs)) && average_WBData) {","lines":6,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/fuji.cpp#L282-L287"}]},
{"id":"OVF_51","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"NOKIARAW branch: `tiff_bps = i * 8 / (width*height)` and `raw_height = height + (top_margin = i/(width*tiff_bps/8) - height)`. width/height are validated to <=16000 and i <= 2*width*height, but width*height is computed as int and 16000*16000 = 256,000,000 fits in int; i*8 (2*256e6*8) overflows 32-bit signed int (~4.1e9) -> UB. Use 64-bit for these products.","fix":"Compute i*8 and width*height as 64-bit (INT64) before the division.","locations":[{"ref":"src/metadata/identify.cpp:657-678","code":"  657 |     i = get4(); // bytes count\n  658 |     width = get2();\n  659 |     height = get2();\n  660 | \n  661 |     // Data integrity check\n  662 |     if (width < 1 || width > 16000 || height < 1 || height > 16000 ||\n  663 |         i < (width * height) || i > (2 * width * height))\n  664 |       throw LIBRAW_EXCEPTION_IO_CORRUPT;\n  665 | \n  666 |     switch (tiff_bps = i * 8 / (width * height))\n  667 |     {\n  668 |     case 8:\n  669 |       load_raw = &LibRaw::eight_bit_load_raw;\n  670 |       break;\n  671 |     case 10:\n  672 |       load_raw = &LibRaw::nokia_load_raw;\n  673 |       break;\n  674 |     case 0:\n  675 |       throw LIBRAW_EXCEPTION_IO_CORRUPT;\n  676 |       break;\n  677 |     }\n  678 |     raw_height = height + (top_margin = i / (width * tiff_bps / 8) - height);","lines":22,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/identify.cpp#L657-L678"}]},
{"id":"OVF_52","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"In parse_minolta, 'order = fgetc(ifp) * 0x101' uses the result of fgetc which can be EOF (-1) on truncated input, setting order to -257 (an invalid byte order) that is then used for all subsequent get2/get4 calls. Earlier fgetc()-'M'/'R' checks can also misbehave on EOF.","fix":"Read the 4 signature/order bytes into a buffer with a checked fread and validate before computing order.","locations":[{"ref":"src/metadata/minolta.cpp:28-31","code":"   28 |   if (fgetc(ifp) || fgetc(ifp) - 'M' || fgetc(ifp) - 'R')\n   29 |     return;\n   30 |   order = fgetc(ifp) * 0x101;\n   31 |   offset = base + get4() + 8;","lines":4,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/minolta.cpp#L28-L31"}]},
{"id":"OVF_53","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"In parse_rollei, data_offset = thumb_offset + thumb_width * thumb_height * 2 is computed from atoi() values taken directly from the file (TX/TY/HDR fields). thumb_width*thumb_height*2 is a signed int multiplication that can overflow, yielding a bogus/negative data_offset later used as a file offset.","fix":"Validate thumb_width/thumb_height ranges and compute the offset in 64-bit with overflow checks before assigning to data_offset.","locations":[{"ref":"src/metadata/misc_parsers.cpp:301-304","code":"  301 |     if (!strcmp(line, \"TX \"))\n  302 |       thumb_width = atoi(val);\n  303 |     if (!strcmp(line, \"TY \"))\n  304 |       thumb_height = atoi(val);","lines":4,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/misc_parsers.cpp#L301-L304"},{"ref":"src/metadata/misc_parsers.cpp:333","code":"  333 |   data_offset = thumb_offset + thumb_width * thumb_height * 2;","lines":1,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/misc_parsers.cpp#L333"}]},
{"id":"OVF_54","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"parseSonyMakernotes tag 0x0114 case 1536/2048: parseSonyLensType2(table_buf[1016], table_buf[1015]) and reads table_buf[153] are only reachable when len is 1536 or 2048 (switch on len), so indices 1015/1016/153 are in range. Reviewed-OK. Tag 0x0001/0x0003 (len>=196) indexes lid up to (0x30<<2)+3 = 0xc3 = 195 which requires len>=196 (the guard) - exactly at the boundary, in range. Tag 0x0004 (len>=227) indexes up to (0x71<<1)+1 = 0xe3 = 227 which requires len>=228 but guard is len>=227: table_buf[227] read when len==227 is 1 byte OOB on the calloc(len) buffer.","fix":"Change the tag 0x0004 guard to `len >= 228` (or bound-check lid+1 < len) since offset 0x71<<1 reads table_buf[0xe2] and table_buf[0xe3]=227.","locations":[{"ref":"src/metadata/sony.cpp:1293-1329","code":" 1293 |   else if ((tag == 0x0004) && // Minolta CameraSettings7D, big endian\n 1294 |            (len >= 227))\n 1295 |   {\n 1296 |     table_buf = (uchar *)calloc(len,1);\n 1297 |     fread(table_buf, len, 1, ifp);\n 1298 | \n 1299 |     lid = 0x0;\n 1300 |     imgdata.shootinginfo.ExposureMode =\n 1301 |         (ushort)table_buf[lid] << 8 | (ushort)table_buf[lid + 1];\n 1302 | \n 1303 |     lid = 0x0e << 1;\n 1304 |     imgdata.shootinginfo.FocusMode = (short)table_buf[lid + 1];\n 1305 |     switch (imgdata.shootinginfo.FocusMode) {\n 1306 |       case 0: case 1: imgdata.shootinginfo.FocusMode += 2; break;\n 1307 |       case 3: imgdata.shootinginfo.FocusMode = LIBRAW_SONY_FOCUSMODE_MF; break;\n 1308 |     }\n 1309 |     lid = 0x10 << 1;\n 1310 |     imgdata.shootinginfo.AFPoint =\n 1311 |         (ushort)table_buf[lid] << 8 | (ushort)table_buf[lid + 1];\n 1312 | \n 1313 |     lid = 0x25 << 1;\n 1314 |     switch ((ushort)table_buf[lid] << 8 | (ushort)table_buf[lid + 1]) {\n 1315 |     case 0:\n 1316 |     case 1:\n 1317 |       imCommon.ColorSpace = LIBRAW_COLORSPACE_sRGB;\n 1318 |       break;\n 1319 |     case 4:\n 1320 |       imCommon.ColorSpace = LIBRAW_COLORSPACE_AdobeRGB;\n 1321 |       break;\n 1322 |     default:\n 1323 |       imCommon.ColorSpace = LIBRAW_COLORSPACE_Unknown;\n 1324 |       break;\n 1325 |     }\n 1326 | \n 1327 |     lid = 0x71 << 1;\n 1328 |     imgdata.shootinginfo.ImageStabilization =\n 1329 |         (ushort)table_buf[lid] << 8 | (ushort)table_buf[lid + 1];","lines":37,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/sony.cpp#L1293-L1329"}]},
{"id":"OVF_55","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"parse_tiff() loop offset uses `int doff = get4()` then `INT64 doff64 = doff;`. get4() returns unsigned; storing into int doff sign-extends high-bit offsets to negative, then doff64 becomes negative and `doff64 + base > ifp->size()` may be true (good) but for some values the negative offset + base could pass the check and fseek to a wrong position. Should read into unsigned.","fix":"Declare doff as unsigned (or read into INT64 directly) to avoid sign extension.","locations":[{"ref":"src/metadata/tiff.cpp:1784-1788","code":" 1784 |   while ((doff = get4()))\n 1785 |   {\n 1786 | \tINT64 doff64 = doff;\n 1787 | \tif (doff64 + base > ifp->size()) break;\n 1788 |     fseek(ifp, doff64 + base, SEEK_SET);","lines":5,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/tiff.cpp#L1784-L1788"}]},
{"id":"OVF_56","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"dsize = T.tlength + mk_exif*(sizeof(exif)+sizeof(tiff_hdr)) is computed as int. T.tlength is bounded by LIBRAW_MAX_THUMBNAIL_MB earlier so practical overflow is unlikely, but dsize is int and used as malloc size and data_size; if LIBRAW_MAX_THUMBNAIL_MB is configured large this can wrap. Minor, but type should be 64-bit/size_t for consistency with the tlength checks.","fix":"Use size_t/INT64 for dsize.","locations":[{"ref":"src/postprocessing/mem_image.cpp:84-87","code":"   84 |     int dsize = T.tlength + mk_exif * (sizeof(exif) + sizeof(tiff_hdr));\n   85 | \n   86 |     libraw_processed_image_t *ret = (libraw_processed_image_t *)::malloc(\n   87 |         sizeof(libraw_processed_image_t) + dsize);","lines":4,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/postprocessing/mem_image.cpp#L84-L87"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"crxSetupImageData does not validate hdr->nPlanes (used as img->nPlanes, an attacker-controlled value from crxParseImageHeader where nPlanes = cmp1TagData[25]>>4, range 0..15). outBufs is a 4-entry array and several code paths assume nPlanes is 1 or 4. crxReadImageHeaders allocates comps/bands sized by nPlanes, but crxConvertPlaneLine and crxLoadDecodeLoop (results[4]) and the cfaLayout switch assume nPlanes<=4. A crafted nPlanes (e.g. 2,3,5..15) leads to inconsistent buffer sizing vs. the >4 results[] write in crxLoadDecodeLoop and mismatched plane handling.","fix":"Reject any nPlanes other than 1 or 4 in crxSetupImageData (crxParseImageHeader checks this for the header it parses, but crxSetupImageData should defensively re-validate) before allocating and before crxLoadDecodeLoop writes results[plane].","locations":[{"ref":"src/decoders/crx.cpp:2518-2525","code":" 2518 |   img->nPlanes = hdr->nPlanes;\n 2519 |   img->nBits = hdr->nBits;\n 2520 |   img->encType = hdr->encType;\n 2521 |   img->samplePrecision = hdr->nBits + IncrBitTable[4 * hdr->encType + 2] + 1;\n 2522 |   img->mdatOffset = mdatOffset + hdr->mdatHdrSize;\n 2523 |   img->mdatSize = mdatSize;\n 2524 |   img->planeBuf = 0;\n 2525 |   img->outBufs[0] = img->outBufs[1] = img->outBufs[2] = img->outBufs[3] = 0;","lines":8,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/crx.cpp#L2518-L2525"},{"ref":"src/decoders/crx.cpp:2623-2643","code":" 2623 | void LibRaw::crxLoadDecodeLoop(void *img, int nPlanes)\n 2624 | {\n 2625 | #ifdef LIBRAW_USE_OPENMP\n 2626 |   int results[4] ={0,0,0,0}; // nPlanes is always <= 4\n 2627 | #pragma omp parallel for\n 2628 |   for (int32_t plane = 0; plane < nPlanes; ++plane)\n 2629 |    try {\n 2630 |     results[plane] = crxDecodePlane(img, plane);\n 2631 |    } catch (...) {\n 2632 |     results[plane] = 1;\n 2633 |    }\n 2634 | \n 2635 |   for (int32_t plane = 0; plane < nPlanes; ++plane)\n 2636 |     if (results[plane])\n 2637 |       derror();\n 2638 | #else\n 2639 |   for (int32_t plane = 0; plane < nPlanes; ++plane)\n 2640 |     if (crxDecodePlane(img, plane))\n 2641 |       derror();\n 2642 | #endif\n 2643 | }","lines":21,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/crx.cpp#L2623-L2643"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"decode_ljpeg_422() unconditionally accesses sof.components[0..2] and dhts[components[i].dc_tbl] but never verifies that sof.cps >= 3. parse_sof() allows cps in 1..4, and decode_sony() dispatches into decode_ljpeg_422 purely on the subsample flags of component[0]; a crafted SOF3 with cps==1 or 2 plus subsample_h==2,subsample_v==1 reaches this function and reads components[1]/components[2] out of bounds of the std::vector.","fix":"At the top of decode_ljpeg_422 verify sof.cps >= 3 (and sof.components.size() >= 3) and return false otherwise.","locations":[{"ref":"src/decompressors/losslessjpeg.cpp:218-220","code":"  218 |   HuffTable &h1 = dhts[sof.components[0].dc_tbl];\n  219 |   HuffTable &h2 = dhts[sof.components[1].dc_tbl];\n  220 |   HuffTable &h3 = dhts[sof.components[2].dc_tbl];","lines":3,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decompressors/losslessjpeg.cpp#L218-L220"},{"ref":"src/decompressors/losslessjpeg.cpp:203-216","code":"  203 | bool LibRaw_LjpegDecompressor::decode_ljpeg_422(std::vector<uint16_t> &_dest, int width, int height)\n  204 | {\n  205 |   if (sof.width * 3u != unsigned(width) || sof.height != unsigned(height))\n  206 |     return false;\n  207 |   if (width % 2 || width % 6 || height % 2)\n  208 |     return false;\n  209 | \n  210 |   if (_dest.size() < size_t(width * height))\n  211 |     return false;\n  212 | \n  213 |   if(width < 1 || height < 1)\n  214 |     return false;\n  215 | \n  216 |   uint16_t *dest = _dest.data();","lines":14,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decompressors/losslessjpeg.cpp#L203-L216"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"parseCR3() reads stsz with `int sample_count = entries; current_track.sample_count = entries;` where entries is `get4()` assigned to a signed int. For fixed sample_size (sample_size != 0) the `entries < 1 || entries > 1000000` validation is SKIPPED entirely (it is inside the else branch). So with sample_size != 0, sample_count is set to an arbitrary 32-bit file value (including negative/huge). selectCRXFrame/selectCRXTrack then use sample_count (e.g. `frameIndex >= hdr->sample_count`, framecounts[i]=d->sample_count) and selectCRXFrame loops over sample_count with sample_sizes possibly NULL (fixed size path), enabling logic errors and large loops.","fix":"Validate entries range (1..1000000) for both fixed and variable sample_size paths before storing into sample_count.","locations":[{"ref":"src/metadata/cr3_parser.cpp:835-844","code":"  835 |         int sample_size = get4();\n  836 |         int entries = get4();\n  837 |         current_track.sample_count = entries;\n  838 | \n  839 |         // if sample size is zero sample size is fixed\n  840 |         if (sample_size)\n  841 |         {\n  842 |            current_track.MediaSize = sample_size;\n  843 |            current_track.sample_size = sample_size;\n  844 |         }","lines":10,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/cr3_parser.cpp#L835-L844"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"x3f_thumb_loader BITMAP branch allocates ID->columns*ID->rows*3 as an int (line 374-375) computed in 32-bit int arithmetic even though the size was checked as INT64. columns/rows are uint32 capped at 65535 in x3f_load_image, so columns*rows*3 can be up to ~1.27e10 which overflows 'int' (the malloc argument 'ID->columns * ID->rows * 3' is int*int) producing a small allocation; the per-row memmove loop then writes rows*columns*3 bytes -> heap overflow. The INT64 alloc_size check earlier does not protect the actual malloc which recomputes the size in int.","fix":"Allocate using the validated INT64 alloc_size (cast to size_t) and use 64-bit for the destination offset 'row * ID->columns * 3'.","locations":[{"ref":"src/x3f/x3f_parse_process.cpp:368-385","code":"  368 |       INT64 alloc_size = INT64(ID->columns) * INT64(ID->rows) * 3LL;\n  369 | \t  if ((alloc_size > 2 * checked_size) ||\n  370 |           (alloc_size > 1024LL * 1024LL * LIBRAW_MAX_THUMBNAIL_MB)) throw LIBRAW_EXCEPTION_TOOBIG;\n  371 |       if (alloc_size < 64LL)\n  372 |         throw LIBRAW_EXCEPTION_IO_CORRUPT;\n  373 | \n  374 |       imgdata.thumbnail.tlength = ID->columns * ID->rows * 3;\n  375 |       imgdata.thumbnail.thumb = (char *)malloc(ID->columns * ID->rows * 3);\n  376 |       char *src0 = (char *)ID->data;\n  377 |       for (int row = 0; row < (int)ID->rows; row++)\n  378 |       {\n  379 |         int offset = row * ID->row_stride;\n  380 |         if (offset + ID->columns * 3 > ID->data_size)\n  381 |           break;\n  382 |         char *dest = &imgdata.thumbnail.thumb[row * ID->columns * 3];\n  383 |         char *src = &src0[offset];\n  384 |         memmove(dest, src, ID->columns * 3);\n  385 |       }","lines":18,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/x3f/x3f_parse_process.cpp#L368-L385"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"trimSpaces() calls isspace() on plain char values (p[l-1], *p) without casting to unsigned char. For inputs with bytes >= 0x80 (common in attacker-controlled make/model/EXIF strings) this is undefined behavior per the C standard and can misbehave on platforms where char is signed. Same unguarded isspace pattern elsewhere uses the (unsigned char) cast (remove_trailing_spaces does), so trimSpaces is inconsistent.","fix":"Cast to (unsigned char) before passing to isspace().","locations":[{"ref":"samples/raw-identify.cpp:172-175","code":"  172 |   while (isspace(p[l - 1]))\n  173 |     p[--l] = 0; /* trim trailing spaces */\n  174 |   while (*p && isspace(*p))\n  175 |     ++p, --l; /* trim leading spaces */","lines":4,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/samples/raw-identify.cpp#L172-L175"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"crxReadSubbandHeaders validates only `*mdatSize < 4` before reading a 2-byte sign and 2-byte size, but then unconditionally reads `(*subbandMdatPtr)[8]` (and for the new header sgetn at +10, +12, +16, +18). The `*mdatSize < hdrSize + 4` check guarantees enough bytes only for the chosen hdrSize, but the curSubband index byte at offset 8 is read before that relationship is rechecked for the old 8-byte header is fine (8+4=12>8), however the code reads offset 8 even when validating; combined with sgetn reads up to +18 for new headers this is correct only because hdrSize==16 ->20 bytes. The genuine bug: when the curSubband mismatch check fails it sets band->dataSize = subbandSize and then returns -1 (dead store on an error path) - a copy/paste leftover that can also leave a partially-initialised band.","fix":"Remove the dead `band->dataSize = subbandSize;` assignment on the error path (or fully initialise the band) since the function returns -1 immediately afterwards.","locations":[{"ref":"src/decoders/crx.cpp:2203-2209","code":" 2203 |     int32_t subbandSize = LibRaw::sgetn(4, *subbandMdatPtr + 4);\n 2204 | \n 2205 |     if (curSubband != ((*subbandMdatPtr)[8] & 0xF0) >> 4)\n 2206 |     {\n 2207 |       band->dataSize = subbandSize;\n 2208 |       return -1;\n 2209 |     }","lines":7,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/crx.cpp#L2203-L2209"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"crxReadImageHeaders reads tile->mdatExtraSize and tile->mdatQPDataSize from the file and later crxDecodePlane computes tileMdatOffset = tile->dataOffset + tile->mdatQPDataSize + tile->mdatExtraSize + planeComp->dataOffset, all 32-bit-ish file values added into a uint64_t and used as a seek/read base for the bitstream. None of these offsets are validated to stay within the mdat region (img->mdatSize), so a crafted file can point the bitstream reader at an arbitrary file offset; combined with subbandDataSize this drives how much is read. Only crxFillBuffer's EOF check stops truly out-of-file reads.","fix":"Validate tileSize, mdatQPDataSize, mdatExtraSize, compSize and subband dataOffset/dataSize cumulatively against img->mdatSize and reject when any offset+size exceeds the declared mdat bounds.","locations":[{"ref":"src/decoders/crx.cpp:2374-2394","code":" 2374 |     tile->tileSize = LibRaw::sgetn(4, dataPtr + 4);\n 2375 |     tile->dataOffset = tileOffset;\n 2376 |     tile->qStep = 0;\n 2377 |     if (hdrSize == 16)\n 2378 |     {\n 2379 |       // extended header data - terminated by 0 bytes\n 2380 |       if (LibRaw::sgetn(2, dataPtr + 18) != 0)\n 2381 |         return -1;\n 2382 |       tile->hasQPData = true;\n 2383 |       tile->mdatQPDataSize = LibRaw::sgetn(4, dataPtr + 12);\n 2384 |       tile->mdatExtraSize = LibRaw::sgetn(2, dataPtr + 16);\n 2385 |     }\n 2386 |     else\n 2387 |     {\n 2388 |       tile->hasQPData = false;\n 2389 |       tile->mdatQPDataSize = 0;\n 2390 |       tile->mdatExtraSize = 0;\n 2391 |     }\n 2392 | \n 2393 |     dataPtr += hdrSize + 4;\n 2394 |     tileOffset += tile->tileSize;","lines":21,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/crx.cpp#L2374-L2394"},{"ref":"src/decoders/crx.cpp:1900-1906","code":" 1900 |       CrxTile *tile = img->tiles + tRow * img->tileCols + tCol;\n 1901 |       CrxPlaneComp *planeComp = tile->comps + planeNumber;\n 1902 |       uint64_t tileMdatOffset = tile->dataOffset + tile->mdatQPDataSize + tile->mdatExtraSize + planeComp->dataOffset;\n 1903 | \n 1904 |       // decode single tile\n 1905 |       if (crxSetupSubbandData(img, planeComp, tile, tileMdatOffset))\n 1906 |         return -1;","lines":7,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/crx.cpp#L1900-L1906"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"X-Trans green-extrema pass has a fragile manual loop-index manipulation that can run out of array bounds. In the loop over row/col (lines 104-147) the body conditionally does row++/col-- (case 1) and col += 2 / row-- (case 2), mutating the loop variables inside the body. The retrycount guard (line 142-143) prevents an infinite loop but the index juggling combined with pix = image + row*width + col (line 113) and pix[hex[c]] (line 122) relies on allhex offsets being in range; if the allhex validation is defeated (see the minh/maxh copy-paste bug) these accesses read out of bounds. Even with valid hex, the col/row rewinding is hard to reason about and not clearly bounded against width/height for every branch.","fix":"Restructure to avoid mutating loop counters in the body, or add explicit bounds assertions on row/col and on pix+hex[c] before each access.","locations":[{"ref":"src/demosaic/xtrans_demosaic.cpp:104-147","code":"  104 |   for (int row = 2; row < height - 2; row++)\n  105 |   {\n  106 |       int col;\n  107 |       ushort min, max;\n  108 |       for (col = 2, max = 0u, min = 0xffffu; col < int(width) - 2; col++)\n  109 |       {\n  110 |           if (fcol(row, col) == 1 && (min = ~(max = 0)))\n  111 |               continue;\n  112 |           ushort(*pix)[4];\n  113 |           pix = image + row * width + col;\n  114 |           short* hex = allhex[row % 3][col % 3][0];\n  115 |           if (!max)\n  116 |           {\n  117 |               int c;\n  118 |               FORC(6)\n  119 |               {\n  120 |                   int val = pix[hex[c]][1];\n  121 |                   if (min > val)\n  122 |                       min = val;\n  123 |                   if (max < val)\n  124 |                       max = val;\n  125 |               }\n  126 |           }\n  127 |           pix[0][1] = min;\n  128 |           pix[0][3] = max;\n  129 |           switch ((row - sgrow) % 3)\n  130 |           {\n  131 |           case 1:\n  132 |               if (row < height - 3)\n  133 |               {\n  134 |                   row++;\n  135 |                   col--;\n  136 |               }\n  137 |               break;\n  138 |           case 2:\n  139 |               if ((min = ~(max = 0)) && (col += 2) < width - 3 && row > 2)\n  140 |               {\n  141 |                   row--;\n  142 |                   if (retrycount++ > width * height)\n  143 |                       throw LIBRAW_EXCEPTION_IO_CORRUPT;\n  144 |               }\n  145 |           }\n  146 |       }\n  147 |   }","lines":44,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/demosaic/xtrans_demosaic.cpp#L104-L147"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"LibRaw_file_datastream::read() uses `nmemb * size` for the byte count (sgetn) but divides by size to get the element count. When size*nmemb overflows size_t, the read is short while the division still yields a large count. Also seek() casts the 64-bit offset to (long) (`f->pubseekoff((long)o, dir)`), truncating offsets >2GB on LLP64/ILP32 platforms, so large-file seeks silently land at a wrong position.","fix":"Validate size*nmemb does not overflow before reading; use std::streamoff/INT64 (not long) for pubseekoff to preserve >2GB offsets.","locations":[{"ref":"src/libraw_datastream.cpp:228-240","code":"  228 | int LibRaw_file_datastream::read(void *ptr, size_t size, size_t nmemb)\n  229 | {\n  230 | /* Visual Studio 2008 marks sgetn as insecure, but VS2010 does not. */\n  231 | #if defined(WIN32SECURECALLS) && (_MSC_VER < 1600)\n  232 |   LR_STREAM_CHK();\n  233 |   return int(f->_Sgetn_s(static_cast<char *>(ptr), nmemb * size, nmemb * size) /\n  234 |              (size > 0 ? size : 1));\n  235 | #else\n  236 |   LR_STREAM_CHK();\n  237 |   return int(f->sgetn(static_cast<char *>(ptr), std::streamsize(nmemb * size)) /\n  238 |              (size > 0 ? size : 1));\n  239 | #endif\n  240 | }","lines":13,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/libraw_datastream.cpp#L228-L240"},{"ref":"src/libraw_datastream.cpp:266","code":"  266 |   return f->pubseekoff((long)o, dir) < 0;","lines":1,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/libraw_datastream.cpp#L266"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"LibRaw_bigfile_buffered_datastream::seek() does not clamp _fpos. SEEK_SET stores o verbatim (negative or beyond EOF), SEEK_CUR adds o with no bounds, SEEK_END computes `_fsize + o`. A negative resulting _fpos is only caught later in fillBufferAt (off<0 returns false) and readAt (Offset built from off, ReadFile fails), but tell() then returns a negative/garbage position and read()'s `_fpos + count > _fsize` arithmetic uses an out-of-range _fpos, making `MAX(0, _fsize - _fpos)` mis-size the fallback read. Other datastream seeks (buffer, file) clamp; this one does not.","fix":"Clamp _fpos to [0, _fsize] after computing it for every whence (matching LibRaw_buffer_datastream::seek), and validate whence.","locations":[{"ref":"src/libraw_datastream.cpp:881-888","code":"  881 | int LibRaw_bigfile_buffered_datastream::seek(INT64 o, int whence)\n  882 | {\n  883 |     LR_BF_CHK();\n  884 |     if (whence == SEEK_SET) _fpos = o;\n  885 |     else if (whence == SEEK_END) _fpos = o > 0 ? _fsize : _fsize + o;\n  886 |     else if (whence == SEEK_CUR) _fpos += o;\n  887 |     return 0;\n  888 | }","lines":8,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/libraw_datastream.cpp#L881-L888"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In parse_exif tag 0x927c ccm parsing, the normalization sum is accumulated from the transposed element cmatrix[c][l] while values are written to cmatrix[l][c]. The inner loop variable c iterates 0..2 with l fixed, so 'num += cmatrix[c][l]' sums a column rather than the row just written; the subsequent FORC3 cmatrix[l][c] /= num then divides by a sum of different elements, producing an incorrect color matrix.","fix":"Accumulate num += cmatrix[l][c] (matching the element being written) instead of cmatrix[c][l].","locations":[{"ref":"src/metadata/exif_gps.cpp:277-294","code":"  277 |               for (l = 0; l < 3; l++) // skip last row\n  278 |               {\n  279 |                 num = 0.0;\n  280 |                 for (c = 0; c < 3; c++)\n  281 |                 {\n  282 |                   cmatrix[l][c] = (float)atoi(pos);\n  283 |                   num += cmatrix[c][l];\n  284 | #ifdef LIBRAW_WIN32_CALLS\n  285 |                   pos = strtok(NULL, \",\");\n  286 | #else\n  287 |                   pos = strtok_r(NULL, \",\", &last);\n  288 | #endif\n  289 |                   if (!pos)\n  290 |                     goto end; // broken\n  291 |                 }\n  292 |                 if (num > 0.01)\n  293 |                     FORC3 cmatrix[l][c] = cmatrix[l][c] / num;\n  294 |               }","lines":18,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/exif_gps.cpp#L277-L294"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"Nikon tag 0x008b lens f-stops: `imgdata.lens.nikon.LensFStops = uc1 * uc2 * (12 / uc3);` uses integer division 12/uc3 which truncates for uc3 not dividing 12 (e.g. uc3=5 -> 12/5=2), producing a wrong/zero result rather than the intended (uc1*uc2*12)/uc3. uc3==0 is correctly guarded. Not a memory-safety bug but a precision/correctness defect inconsistent with the float computation that follows.","fix":"Compute as `(uc1 * uc2 * 12) / uc3` (or in float) to avoid premature truncation.","locations":[{"ref":"src/metadata/nikon.cpp:681-684","code":"  681 |       if (uc3)\n  682 |       {\n  683 |         imgdata.lens.nikon.LensFStops = uc1 * uc2 * (12 / uc3);\n  684 |         ilm.LensFStops = (float)imgdata.lens.nikon.LensFStops / 12.0f;","lines":4,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/nikon.cpp#L681-L684"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"parseSonyLensFeatures early-return condition is a tautology that is almost always false-negative: `if ((ilm.LensMount == LIBRAW_MOUNT_Canon_EF) || (ilm.LensMount != LIBRAW_MOUNT_Sigma_X3F) || !features) return;`. The middle term `LensMount != Sigma_X3F` is true for virtually every mount, so the function returns early for almost all inputs unless LensMount happens to equal Sigma_X3F (in which case the first term is false and middle is false). The intent was almost certainly `&&` between the first two terms (return only when mount is Canon_EF, i.e. not a Sony/Minolta lens). As written, lens-feature parsing is effectively dead for normal Sony lenses.","fix":"Review intended logic; likely `if ((ilm.LensMount == LIBRAW_MOUNT_Canon_EF) || (ilm.LensMount == LIBRAW_MOUNT_Sigma_X3F) || !features) return;` (early-return for adapter mounts), matching the comment semantics.","locations":[{"ref":"src/metadata/sony.cpp:578-580","code":"  578 |   if ((ilm.LensMount == LIBRAW_MOUNT_Canon_EF) ||\n  579 |       (ilm.LensMount != LIBRAW_MOUNT_Sigma_X3F) || !features)\n  580 |     return;","lines":3,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/sony.cpp#L578-L580"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"Signedness mismatch in fread length comparisons: `if (fread(cbuf,1,len,ifp) != (int)len)` (Sinar tag) and several `int items = fread(...); if (items == sony_length)` where sony_length/SR2SubIFDLength are unsigned. fread returns size_t; casting len to int and comparing, or storing the size_t result into int, breaks for len/length >= 2^31 (sign issues) and yields signed/unsigned comparison surprises. The values are bounded (<10240000 / <2560000) so not currently exploitable, but the pattern is fragile.","fix":"Store fread result in size_t and compare against the unsigned length directly.","locations":[{"ref":"src/metadata/tiff.cpp:1043","code":" 1043 |       if (fread(cbuf, 1, len, ifp) != (int)len)","lines":1,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/tiff.cpp#L1043"},{"ref":"src/metadata/tiff.cpp:1634-1635","code":" 1634 |                   int items = fread(buf_SR2, 1, SR2SubIFDLength, ifp);\n 1635 | \t\t\t\t  if (items == SR2SubIFDLength)","lines":2,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/tiff.cpp#L1634-L1635"},{"ref":"src/metadata/tiff.cpp:1747-1748","code":" 1747 |     int items = fread(buf, 1, sony_length, ifp);\n 1748 | \tif (items == sony_length)","lines":2,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/tiff.cpp#L1747-L1748"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"apply_tiff() DNG path: idx = LIM(shot_select,0,ifdc-1); i = (dng_frames[idx]>>8)&0xff then tiff_ifd[i] used. i is reconstructed from a packed value and masked to 0..255, but tiff_ifd has only LIBRAW_IFD_MAXCOUNT entries. dng_frames[] was filled with `(i<<8)&0xff00` so i<=255; if LIBRAW_IFD_MAXCOUNT < 256 and a crafted DNG produced an ifd index that... actually i is bounded by the loop that set it (< tiff_nifds <= LIBRAW_IFD_MAXCOUNT). Lower severity: the extracted i is never re-validated against tiff_nifds before tiff_ifd[i] use; defensive check missing.","fix":"Validate `i < (int)tiff_nifds && i >= 0` after extracting from dng_frames before indexing tiff_ifd[i].","locations":[{"ref":"src/metadata/tiff.cpp:1916-1926","code":" 1916 |       int idx = LIM((int)shot_select, 0, ifdc - 1);\n 1917 |       i = (libraw_internal_data.unpacker_data.dng_frames[idx] >> 8) &\n 1918 |           0xff; // extract frame# back\n 1919 | \n 1920 |       raw_width = tiff_ifd[i].t_width;\n 1921 |       raw_height = tiff_ifd[i].t_height;\n 1922 |       tiff_bps = tiff_ifd[i].bps;\n 1923 |       tiff_compress = tiff_ifd[i].comp;\n 1924 |       tiff_sampleformat = tiff_ifd[i].sample_format;\n 1925 |       data_offset = tiff_ifd[i].offset;\n 1926 |       data_size = tiff_ifd[i].bytes;","lines":11,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/tiff.cpp#L1916-L1926"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"apply_tiff() dereferences tiff_ifd[raw] in the non-DNG is_raw cleanup `tiff_ifd[raw].bytes ...` and the compression switch when raw may be -1. raw is initialised to -1 and only set when a matching IFD is found. The `if (raw >= 0 && !load_raw)` switch is guarded, but the block at lines 2315-2323 (`tiff_samples == 3 && tiff_ifd[raw].bytes ...`) is reached with raw possibly -1, indexing tiff_ifd[-1]. tiff_samples could be nonzero from an earlier IFD while raw stayed -1 (e.g. all candidate IFDs rejected). OOB read of tiff_ifd[-1].","fix":"Guard the entire non-DNG is_raw fixup block with `raw >= 0` before indexing tiff_ifd[raw].","locations":[{"ref":"src/metadata/tiff.cpp:2325-2341","code":" 2325 |   if (!dng_version)\n 2326 |   {\n 2327 |       if (((tiff_samples == 3 && tiff_ifd[raw].bytes &&\n 2328 |           !(tiff_bps == 16 &&\n 2329 |               !strncmp(make, \"Leaf\", 4)) && // Allow Leaf/16bit/3color files\n 2330 | \t\t  !(tiff_ifd[raw].comp == 6 && tiff_ifd[raw].phint == 6 && tiff_bps >= 12 && !strncasecmp(make,\"Sony\",4)) && // Sony YCbCr\n 2331 |           tiff_bps != 14 &&\n 2332 |           (tiff_compress & -16) != 32768) ||\n 2333 |           (tiff_bps == 8 && strncmp(make, \"Phase\", 5) &&\n 2334 |               strncmp(make, \"Leaf\", 4) && !strcasestr(make, \"Kodak\") &&\n 2335 |               !strstr(model2, \"DEBUG RAW\"))) &&\n 2336 |           !strcasestr(model, \"COOLSCAN\") && strncmp(software, \"Nikon Scan\", 10) &&\n 2337 |           is_NikonTransfer != 2)\n 2338 |           is_raw = 0;\n 2339 | \n 2340 |       if (is_raw && raw >= 0 && tiff_ifd[raw].phint == 2 && tiff_ifd[raw].extrasamples > 0 && tiff_ifd[raw].samples > 3)\n 2341 |           is_raw = 0; // SKIP RGB+Alpha IFDs","lines":17,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/tiff.cpp#L2325-L2341"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"convert_to_rgb() writes ICC profile description into oprof using sprintf(prof_desc.data(), ...) sized via snprintf, but then copies it with strcpy((char*)oprof + pbody[5] + 12, prof_desc.data()) guarded only by 'pbody[5]+12+prof_desc.size() < phead[0]'. oprof is calloc(phead[0]=1024). Earlier strcpy at oprof+pbody[2]+8 ('auto-generated by dcraw') and the pbody/oprof[oprof[0]/4] index writes (lines 72-84) assume the fixed pbody layout fits in 1024 bytes; output_color indexes name[output_color-1] with output_color validated to 1..8 at line 55, so that part is safe, but the profile description guard silently drops the description rather than being a hard invariant. Low memory-safety risk but fragile; worth hardening.","fix":"Assert/verify the computed oprof[0] size never exceeds phead[0], and bound all writes into oprof explicitly.","locations":[{"ref":"src/postprocessing/postprocessing_utils_dcrdefs.cpp:61-97","code":"   61 |     prof_desc_len = snprintf(NULL, 0, \"%s gamma %g toe slope %g\", name[output_color - 1],\n   62 |                              floor(1000. / gamm[0] + .5) / 1000., floor(gamm[1] * 1000.0 + .5) / 1000.) +\n   63 |                     1;\n   64 |     prof_desc.resize(prof_desc_len);\n   65 |     sprintf(prof_desc.data(), \"%s gamma %g toe slope %g\", name[output_color - 1], floor(1000. / gamm[0] + .5) / 1000.,\n   66 |             floor(gamm[1] * 1000.0 + .5) / 1000.);\n   67 | \n   68 | \toprof = (unsigned *)calloc(phead[0], 1);\n   69 |     memcpy(oprof, phead, sizeof phead);\n   70 |     if (output_color == 5)\n   71 |       oprof[4] = oprof[5];\n   72 |     oprof[0] = 132 + 12 * pbody[0];\n   73 |     for (i = 0; i < (int)pbody[0]; i++)\n   74 |     {\n   75 |       oprof[oprof[0] / 4] = i ? (i > 1 ? 0x58595a20 : 0x64657363) : 0x74657874;\n   76 |       pbody[i * 3 + 2] = oprof[0];\n   77 |       oprof[0] += (pbody[i * 3 {"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"parse_x3f reads property name/value via utf2char with sizes MIN(maxnsize, sizeof(name)). maxnsize = maxitems - (P[i].name - datap) is in utf16 units while the earlier checks compare noffset against maxitems; but P[i].name/value were set in x3f_load_property_list from name_offset/value_offset that were only bounded by maxoffset = data_size/2 - 2 (which can underflow, see other finding). If that bound is bypassed, P[i].name points outside PL->data and (P[i].name - datap) is negative or huge, making maxnsize negative; MIN with sizeof(name) yields a negative passed as unsigned bufsz to utf2char -> huge copy. The noffset<0 guard catches some but relies on pointer arithmetic that is itself UB when name is outside the array.","fix":"Validate P[i].name/value lie within [datap, datap+maxitems] using integer offsets stored at load time, not pointer subtraction; ensure maxnsize/maxvsize are clamped to >=0 before MIN.","locations":[{"ref":"src/x3f/x3f_parse_process.cpp:140-151","code":"  140 |       for (i = 0; i < (int)PL->num_properties; i++)\n  141 |       {\n  142 |         char name[100], value[100];\n  143 |         int noffset = int(P[i].name - datap);\n  144 |         int voffset = int(P[i].value - datap);\n  145 |         if (noffset < 0 || noffset > (int)maxitems || voffset < 0 ||\n  146 |             voffset > (int)maxitems)\n  147 |           throw LIBRAW_EXCEPTION_IO_CORRUPT;\n  148 |         int maxnsize = maxitems - int(P[i].name - datap);\n  149 |         int maxvsize = maxitems - int(P[i].value - datap);\n  150 |         utf2char(P[i].name, name, MIN(maxnsize, ((int)sizeof(name))));\n  151 |         utf2char(P[i].value, value, MIN(maxvsize, ((int)sizeof(value))));","lines":12,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/x3f/x3f_parse_process.cpp#L140-L151"}]},

{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"true_decode_one_color guards 'if (rows != area->rows || cols < area->columns) throw'. The x3rgb16 buffer is allocated with columns = ID->columns (or Q->plane[0].columns) but for the Quattro plane-2 path 'area' is switched to Q->top16 whose rows/columns come from Q->plane[2] read from the file; the write 'dst += area->channels' over rows*area->columns elements is only safe if the allocation used the same plane[2] dims. The relationship between plane[2].rows/columns and the top16 allocation (which used plane[2] too) holds, but the guard compares against area->columns AFTER possibly switching area, while rows/cols were overwritten from Q->plane[color] - a mismatch between plane[2] and plane[0] dimensions for color==2 vs the buffer is not fully validated. Worth hardening: confirm cols/rows used for the loop never exceed the allocated area extent for every color.","fix":"Explicitly validate, per color, that rows*area->row_stride (or rows, cols vs area->rows/columns/channels) fit the allocated buffer before writing.","locations":[{"ref":"src/x3f/x3f_utils_patched.cpp:991-1037","code":"  991 |   if (ID->type_format == X3F_IMAGE_RAW_QUATTRO ||\n  992 |       ID->type_format == X3F_IMAGE_RAW_SDQ ||\n  993 |       ID->type_format == X3F_IMAGE_RAW_SDQH ||\n  994 |       ID->type_format == X3F_IMAGE_RAW_SDQH2)\n  995 |   {\n  996 |     rows = Q->plane[color].rows;\n  997 |     cols = Q->plane[color].columns;\n  998 | \n  999 |     if (Q->quattro_layout && color == 2)\n 1000 |     {\n 1001 |       area = &Q->top16;\n 1002 |       dst = area->data;\n 1003 |     }\n 1004 |   }\n 1005 |   else\n 1006 |   {\n 1007 |   }\n 1008 | \n 1009 |   if (rows != area->rows || cols < area->columns)\n 1010 |     throw LIBRAW_EXCEPTION_IO_CORRUPT;\n 1011 | \n 1012 |   for (row = 0; row < (int)rows; row++)\n 1013 |   {\n 1014 |     int col;\n 1015 |     bool_t odd_row = row & 1;\n 1016 |     int32_t acc[2];\n 1017 | \n 1018 |     for (col = 0; col < (int)cols; col++)\n 1019 |     {\n 1020 |       bool_t odd_col = col & 1;\n 1021 |       int32_t diff = get_true_diff(&BS, tree);\n 1022 |       int32_t prev = col < 2 ? row_start_acc[odd_row][odd_col] : acc[odd_col];\n 1023 |       int32_t value = prev + diff;\n 1024 | \n 1025 |       acc[odd_col] = value;\n 1026 |       if (col < 2)\n 1027 |         row_start_acc[odd_row][odd_col] = value;\n 1028 | \n 1029 |       /* Discard additional data at the right for binned Quattro plane 2 */\n 1030 |       if (col >= (int)area->columns)\n 1031 |         continue;\n 1032 | \n 1033 |       *dst = value;\n 1034 |       dst += area->channels;\n 1035 |     }\n 1036 |   }\n 1037 | }","lines":47,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/x3f/x3f_utils_patched.cpp#L991-L1037"}]},

 177 |     (_T).size = (_NUM);                                                        \\\n  178 |     (_T).element = (x3f_property_t *)x3f_limited_realloc(                                  \\\n  179 |         (_T).element, (_NUM) * sizeof((_T).element[0]));                       \\\n  180 |     for (_i = 0; _i < (int)(_T).size; _i++)                                         \\\n  181 |     {                                                                          \\\n  182 |       GET4((_T).element[_i].name_offset);                                      \\\n  183 |       GET4((_T).element[_i].value_offset);                                     \\\n  184 |     }                                                                          \\\n  185 |   } while (0)","lines":13,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/x3f/x3f_utils_patched.cpp#L173-L185"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In crxDecodeLineNoRefPrevLine the guard `else if (i > param->subbandWidth) return -1;` (when the leading bit is 0) can never be true at that point because the loop condition is `i < subbandWidth-1`, so i is always < subbandWidth-1 there. This dead/incorrect check suggests the intended bounds guard (i >= subbandWidth) is missing, leaving the subsequent memset(lineBuf1+i+1, ...) and index increments without a proper upper-bound assertion against subbandWidth.","fix":"Replace the impossible `i > subbandWidth` test with a correct bound and verify nSyms cannot push writes past lineBuf1/lineBuf2 allocations (paramLength = 2*subbandWidth+4).","locations":[{"ref":"src/decoders/crx.cpp:612-619","code":"  612 |       else if (i > param->subbandWidth)\n  613 |         return -1;\n  614 | \n  615 |       if (nSyms > 0)\n  616 |       {\n  617 |         memset(param->lineBuf1 + i + 1, 0, nSyms * sizeof(int32_t));\n  618 |         memset(param->lineBuf2 + i, 0, nSyms * sizeof(int32_t));\n  619 |         i += nSyms;","lines":8,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/crx.cpp#L612-L619"}]},

utBufs[3] + 1;\n 2570 |       break;\n 2571 |     case 2:\n 2572 |       // G B\n 2573 |       // R G\n 2574 |       img->outBufs[2] = outBuf;\n 2575 |       img->outBufs[3] = outBuf + 1;\n 2576 |       img->outBufs[0] = outBuf + rowSize;\n 2577 |       img->outBufs[1] = img->outBufs[0] + 1;\n 2578 |       break;\n 2579 |     case 3:\n 2580 |       // B G\n 2581 |       // G R\n 2582 |       img->outBufs[3] = outBuf;\n 2583 |       img->outBufs[2] = outBuf + 1;\n 2584 |       img->outBufs[1] = outBuf + rowSize;\n 2585 |       img->outBufs[0] = img->outBufs[1] + 1;\n 2586 |       break;\n 2587 |     }","lines":40,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/crx.cpp#L2548-L2587"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"ljpeg_start reads 'len = (data[2]<<8 | data[3]) - 2' as a ushort and then fread(data,1,len,ifp). For markers handled later it indexes data[1 + data[0]*2] (0xffda) and data[7]/data[5] (SOF) without verifying that len is large enough to contain those bytes. data[] is a fixed 0x10000 buffer so it is not an OOB of the allocation, but it reads stale/previous bytes when len is short, producing attacker-controllable jh fields (bits, clrs, wide, high, psv) from uninitialized-for-this-tag data.","fix":"Validate len against the minimum required size for each tag before indexing (e.g. SOF needs >=6+..., SOS needs >=1+data[0]*2+1).","locations":[{"ref":"src/decoders/decoders_dcraw.cpp:298-335","code":"  298 |     if (fread(data, 2, 2, ifp) != 2)\n  299 |       return 0;\n  300 |     tag = data[0] << 8 | data[1];\n  301 |     len = (data[2] << 8 | data[3]) - 2;\n  302 |     if (tag <= 0xff00)\n  303 |       return 0;\n  304 |     if (fread(data, 1, len, ifp) != len)\n  305 |       return 0;\n  306 |     switch (tag)\n  307 |     {\n  308 |     case 0xffc3: // start of frame; lossless, Huffman\n  309 |       jh->sraw = ((data[7] >> 4) * (data[7] & 15) - 1) & 3;\n  310 |     case 0xffc1:\n  311 |     case 0xffc0:\n  312 |       jh->algo = tag & 0xff;\n  313 |       jh->bits = data[0];\n  314 |       jh->high = data[1] << 8 | data[2];\n  315 |       jh->wide = data[3] << 8 | data[4];\n  316 |       jh->clrs = data[5] + jh->sraw;\n  317 |       if (len == 9 && !dng_version)\n  318 |         getc(ifp);\n  319 |       break;\n  320 |     case 0xffc4: // define Huffman tables\n  321 |       if (info_only)\n  322 |         break;\n  323 |       for (dp = data; dp < data + len && !((c = *dp++) & -20);)\n  324 |         jh->free[c] = jh->huff[c] = make_decoder_ref(&dp);\n  325 |       break;\n  326 |     case 0xffda: // start of scan\n  327 |       jh->psv = data[1 + data
