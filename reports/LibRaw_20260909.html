{"id":"ERR_26","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In the LAYER thumbnail branch, two calloc() calls (T.thumb and tbuf, each colors*tlength bytes) are not NULL-checked before ID.input->read() writes into tbuf and the reorder loops write into T.thumb. tlength = twidth*theight is bounded by THUMB_SIZE_CHECKWH, but OOM yields a NULL write. Similarly the ROLLEI branch calloc(T.tcolors,tlength) and calloc(2,tlength) are unchecked.","fix":"Check each calloc result and return LIBRAW_NO_THUMBNAIL / throw on failure before using the buffers.","locations":[{"ref":"src/decoders/unpack_thumb.cpp:230-233","code":"  230 |         T.thumb = (char *)calloc(colors, tlength);\n  231 |         unsigned char *tbuf = (unsigned char *)calloc(colors, tlength);\n  232 |         // Avoid OOB of tbuf, should use tlength\n  233 |         ID.input->read(tbuf, colors, tlength);","lines":4,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/unpack_thumb.cpp#L230-L233"},{"ref":"src/decoders/unpack_thumb.cpp:271-272","code":"  271 |         T.thumb = (char *)calloc(T.tcolors, tlength);\n  272 |         unsigned short *tbuf = (unsigned short *)calloc(2, tlength);","lines":2,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/unpack_thumb.cpp#L271-L272"}]},
{"id":"ERR_27","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"CR3 parseCR3 XMP/uuid handling: `xmpdata = calloc(xmplen = szAtom-23, 1); br = fread(xmpdata,1,szAtom-24,ifp); xmpdata[br]=0;` allocates szAtom-23 bytes and writes index br where br <= szAtom-24, so the terminator fits; but calloc return is not NULL-checked before xmpdata[br]=0 and the fread count is trusted. If calloc fails -> NULL deref write. Same pattern for tag 0x02bc xmp in tiff.cpp.","fix":"Check calloc result for NULL before writing the terminator.","locations":[{"ref":"src/metadata/cr3_parser.cpp:562-567","code":"  562 | \t\tif (!memcmp(UIID, UUID_XMP, 16) && szAtom > 24LL && szAtom < 1024000LL)\n  563 | \t\t{\n  564 | \t\t\txmpdata = (char *)calloc(xmplen = unsigned(szAtom - 23),1);\n  565 | \t\t\tunsigned br = fread(xmpdata,1, szAtom - 24, ifp);\n  566 | \t\t\txmpdata[br] = 0;\n  567 | \t\t}","lines":6,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/cr3_parser.cpp#L562-L567"},{"ref":"src/metadata/tiff.cpp:736-738","code":"  736 |         xmpdata = (char *)calloc(xmplen = len + 1,1);\n  737 |         unsigned br = fread(xmpdata,1, len, ifp);\n  738 |         xmpdata[br] = 0;","lines":3,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/tiff.cpp#L736-L738"}]},
{"id":"ERR_28","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"parse_fuji_thumbnail(): xmpdata = (char*)calloc(xmplen+1,1) return value is not checked for NULL before xmpdata[br] = 0 and the subsequent fread into it. A failed allocation (xmplen up to ~65533, but heap could be exhausted) leads to a NULL write / NULL fread target. Other allocation sites in these files (e.g. CanonCameraInfo, AFInfoData, PentaxLensInfo table_buf) share the same unchecked-calloc pattern.","fix":"Check xmpdata for NULL after calloc; if NULL, restore order/seek and return (or throw LIBRAW_EXCEPTION_ALLOC) instead of dereferencing.","locations":[{"ref":"src/metadata/fuji.cpp:1138-1141","code":" 1138 |                   xmplen = len - xmpsz - 2;\n 1139 |                   xmpdata = (char*) calloc(xmplen+1,1);\n 1140 |                   unsigned br = fread(xmpdata, 1, xmplen, ifp);\n 1141 |                   xmpdata[br] = 0;","lines":4,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/fuji.cpp#L1138-L1141"}]},
{"id":"ERR_29","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"parse_sinar_ia reads make with fread(make,64,1,ifp) after fseek to meta_offset+20 but does not validate meta_offset (default 0 if no META entry found) nor the fread result. With a crafted .ia lacking a META record, meta_offset stays 0 and make/model/raw dimensions are read from an arbitrary early file location; raw_width/raw_height (get2) are taken unchecked.","fix":"Bail out when meta_offset was never set (sentinel), and check the fread return before using make.","locations":[{"ref":"src/metadata/misc_parsers.cpp:343-383","code":"  343 | void LibRaw::parse_sinar_ia()\n  344 | {\n  345 |   int entries, off;\n  346 |   char str[8], *cp;\n  347 | \n  348 |   order = 0x4949;\n  349 |   fseek(ifp, 4, SEEK_SET);\n  350 |   entries = get4();\n  351 |   if (entries < 1 || entries > 8192)\n  352 |     return;\n  353 |   fseek(ifp, get4(), SEEK_SET);\n  354 |   while (entries--)\n  355 |   {\n  356 |     off = get4();\n  357 |     get4();\n  358 | \tmemset(str, 0, sizeof(str));\n  359 |     fread(str, 8, 1, ifp);\n  360 |     str[7] = 0; // Ensure end of string\n  361 |     if (!strcmp(str, \"META\"))\n  362 |       meta_offset = off;\n  363 |     if (!strcmp(str, \"THUMB\"))\n  364 |       thumb_offset = off;\n  365 |     if (!strcmp(str, \"RAW0\"))\n  366 |       data_offset = off;\n  367 |   }\n  368 |   fseek(ifp, meta_offset + 20, SEEK_SET);\n  369 |   fread(make, 64, 1, ifp);\n  370 |   make[63] = 0;\n  371 |   if ((cp = strchr(make, ' ')))\n  372 |   {\n  373 |     strcpy(model, cp + 1);\n  374 |     *cp = 0;\n  375 |   }\n  376 |   raw_width = get2();\n  377 |   raw_height = get2();\n  378 |   load_raw = &LibRaw::unpacked_load_raw;\n  379 |   thumb_width = (get4(), get2());\n  380 |   thumb_height = get2();\n  381 |   thumb_format = LIBRAW_INTERNAL_THUMBNAIL_PPM;\n  382 |   maximum = 0x3fff;\n  383 | }","lines":41,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/misc_parsers.cpp#L343-L383"}]},
{"id":"ERR_30","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"parse_broadcom does not check the return value of fread(&header, 1, sizeof(header), ifp). On a truncated file the header struct is left partially/uninitialized and raw_width/raw_height/raw_stride are then derived from indeterminate values (header.uwidth etc.), which feed later allocation/stride math.","fix":"Check the fread return count; bail out (or zero the struct) if fewer than sizeof(header) bytes are read.","locations":[{"ref":"src/metadata/misc_parsers.cpp:487-494","code":"  487 |   header.bayer_order = 0;\n  488 |   fseek(ifp, 0xb0 - 0x20, SEEK_CUR);\n  489 |   fread(&header, 1, sizeof(header), ifp);\n  490 |   raw_stride =\n  491 |       ((((((header.uwidth + header.padding_right) * 5) + 3) >> 2) + 0x1f) &\n  492 |        (~0x1f));\n  493 |   raw_width = width = header.uwidth;\n  494 |   raw_height = height = header.uheight;","lines":8,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/misc_parsers.cpp#L487-L494"}]},
{"id":"ERR_31","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"get_timestamp reads with fread(str, 19, 1, ifp) (or per-char in reversed mode) without checking the return value; on a short read str holds stale/uninitialized data. str[19] is set to 0 but bytes 0..18 may be uninitialized, and sscanf then parses garbage into the timestamp.","fix":"memset(str,0,sizeof(str)) before reading and/or check the fread/fgetc return values, returning on short read.","locations":[{"ref":"src/metadata/misc_parsers.cpp:533-548","code":"  533 | void LibRaw::get_timestamp(int reversed)\n  534 | {\n  535 |   struct tm t;\n  536 |   char str[20];\n  537 |   int i;\n  538 | \n  539 |   str[19] = 0;\n  540 |   if (reversed)\n  541 |     for (i = 19; i--;)\n  542 |       str[i] = fgetc(ifp);\n  543 |   else\n  544 |     fread(str, 19, 1, ifp);\n  545 |   memset(&t, 0, sizeof t);\n  546 |   if (sscanf(str, \"%d:%d:%d %d:%d:%d\", &t.tm_year, &t.tm_mon, &t.tm_mday,\n  547 |              &t.tm_hour, &t.tm_min, &t.tm_sec) != 6)\n  548 |     return;","lines":16,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/misc_parsers.cpp#L533-L548"}]},
{"id":"ERR_32","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"subtract() (dark frame) ignores the fread return value: fread(pixel.data(),2,width,fp) may read fewer rows than width when the PPM is truncated, leaving pixel[] holding stale/previous-row data which is then subtracted from BAYER. Not memory-unsafe (vector is width-sized) but produces silent garbage instead of LIBRAW_WARN_BAD_DARKFRAME_FILE.","fix":"Check fread return == width per row and warn/abort on short read.","locations":[{"ref":"src/preprocessing/ext_preprocess.cpp:118-123","code":"  118 |   for (row = 0; row < height; row++)\n  119 |   {\n  120 |     fread(pixel.data(), 2, width, fp);\n  121 |     for (col = 0; col < width; col++)\n  122 |       BAYER(row, col) = MAX(BAYER(row, col) - ntohs(pixel[col]), 0);\n  123 |   }","lines":6,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/preprocessing/ext_preprocess.cpp#L118-L123"}]},
{"id":"ERR_33","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"Multiple low-level readers ignore fread return values: get2() does `fread(str,1,2,ifp)` and get4()/getreal() (fgetc) proceed regardless of short reads, returning the 0xff-prefilled buffer or EOF (-1 from fgetc, which getreal's default returns as a double). read_shorts() does call derror() on short read, but get2/get4/getreal do not, so truncated files yield silent sentinel values that flow into size/offset computations rather than a clean IO error.","fix":"Check fread/fgetc results in get2/get4/getreal and call derror() (or propagate EOF) on short reads, as read_shorts already does.","locations":[{"ref":"src/utils/read_utils.cpp:46-72","code":"   46 | ushort LibRaw::get2()\n   47 | {\n   48 |   uchar str[2] = {0xff, 0xff};\n   49 |   fread(str, 1, 2, ifp);\n   50 |   return sget2(str);\n   51 | }\n   52 | \n   53 | unsigned LibRaw::sget4(uchar *s)\n   54 | {\n   55 |     return libraw_sget4_static(order, s);\n   56 | }\n   57 | \n   58 | \n   59 | unsigned libraw_sget4_static(short _order, uchar *s)\n   60 | {\n   61 |   if (_order == 0x4949)\n   62 |     return s[0] | s[1] << 8 | s[2] << 16 | s[3] << 24;\n   63 |   else\n   64 |     return s[0] << 24 | s[1] << 16 | s[2] << 8 | s[3];\n   65 | }\n   66 | \n   67 | unsigned LibRaw::get4()\n   68 | {\n   69 |   uchar str[4] = {0xff, 0xff, 0xff, 0xff};\n   70 |   fread(str, 1, 4, ifp);\n   71 |   return sget4(str);\n   72 | }","lines":27,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/utils/read_utils.cpp#L46-L72"}]},
{"id":"ERR_34","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"get_true_diff returns 0 on a NULL branch ('TODO: Shouldn't this be treated as a fatal error?') instead of throwing, unlike get_huffman_diff which throws LIBRAW_EXCEPTION_IO_CORRUPT. A corrupt TRUE/CAMF huffman stream that walks to a missing branch silently yields diff=0 and continues decoding garbage rather than aborting, masking corruption and potentially feeding the unbounded loops elsewhere.","fix":"Throw LIBRAW_EXCEPTION_IO_CORRUPT on the NULL-branch case, consistent with get_huffman_diff.","locations":[{"ref":"src/x3f/x3f_utils_patched.cpp:917-955","code":"  917 | static int32_t get_true_diff(bit_state_t *BS, x3f_hufftree_t *HTP)\n  918 | {\n  919 |   int32_t diff;\n  920 |   x3f_huffnode_t *node = &HTP->nodes[0];\n  921 |   uint8_t bits;\n  922 | \n  923 |   while (node->branch[0] != NULL || node->branch[1] != NULL)\n  924 |   {\n  925 |     uint8_t bit = get_bit(BS);\n  926 |     x3f_huffnode_t *new_node = node->branch[bit];\n  927 | \n  928 |     node = new_node;\n  929 |     if (node == NULL)\n  930 |     {\n  931 |       /* TODO: Shouldn't this be treated as a fatal error? */\n  932 |       return 0;\n  933 |     }\n  934 |   }\n  935 | \n  936 |   bits = node->leaf;\n  937 | \n  938 |   if (bits == 0)\n  939 |     diff = 0;\n  940 |   else\n  941 |   {\n  942 |     uint8_t first_bit = get_bit(BS);\n  943 |     int i;\n  944 | \n  945 |     diff = first_bit;\n  946 | \n  947 |     for (i = 1; i < bits; i++)\n  948 |       diff = (diff << 1) + get_bit(BS);\n  949 | \n  950 |     if (first_bit == 0)\n  951 |       diff -= (1 << bits) - 1;\n  952 |   }\n  953 | \n  954 |   return diff;\n  955 | }","lines":39,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/x3f/x3f_utils_patched.cpp#L917-L955"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"DCB recomputes the same 8-neighbour MIN/MAX clamp ladders repeatedly in hot per-pixel loops (e.g. the 8-deep MIN(...)/MAX(...) nests for channel 0 and channel 2 in dcb_color_full lines 412-450, and again the channel-1 ladder in dcb_refinement lines 621-637 and fbdd_green lines 791-807). These recompute neighbor reads independently for min and max; pairing them or hoisting the eight neighbor loads would roughly halve the memory traffic in the innermost loop.","fix":"Load the eight neighbors once and compute min and max in a single pass (or use a minmax helper).","locations":[{"ref":"src/demosaic/dcb_demosaic.cpp:412-450","code":"  412 |       g1 = MIN(\n  413 |           image[indx + 1 + u][0],\n  414 |           MIN(image[indx + 1 - u][0],\n  415 |               MIN(image[indx - 1 + u][0],\n  416 |                   MIN(image[indx - 1 - u][0],\n  417 |                       MIN(image[indx - 1][0],\n  418 |                           MIN(image[indx + 1][0],\n  419 |                               MIN(image[indx - u][0], image[indx + u][0])))))));\n  420 | \n  421 |       g2 = MAX(\n  422 |           image[indx + 1 + u][0],\n  423 |           MAX(image[indx + 1 - u][0],\n  424 |               MAX(image[indx - 1 + u][0],\n  425 |                   MAX(image[indx - 1 - u][0],\n  426 |                       MAX(image[indx - 1][0],\n  427 |                           MAX(image[indx + 1][0],\n  428 |                               MAX(image[indx - u][0], image[indx + u][0])))))));\n  429 | \n  430 |       image[indx][0] = ULIM(image[indx][0], g2, g1);\n  431 | \n  432 |       g1 = MIN(\n  433 |           image[indx + 1 + u][2],\n  434 |           MIN(image[indx + 1 - u][2],\n  435 |               MIN(image[indx - 1 + u][2],\n  436 |                   MIN(image[indx - 1 - u][2],\n  437 |                       MIN(image[indx - 1][2],\n  438 | {"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"DHT recomputes libraw.COLOR(i,j) for the first 48 columns of every row in several per-line functions (make_hv_dline, make_diag_dline, make_gline, make_rbdiag), and the column-cache pattern is only built once in the constructor but not reused. The constructor itself rebuilds a 48-entry col_cache per row (lines 231-238) even though the CFA pattern repeats with a fixed small period; this is redundant work in the hottest setup loop. Minor but in the pixel-scan hot path.","fix":"Cache the per-(row-parity) color pattern once and index it, rather than rebuilding a 48-wide cache each row.","locations":[{"ref":"src/demosaic/dht_demosaic.cpp:229-252","code":"  229 |   for (int i = 0; i < libraw.imgdata.sizes.iheight; ++i)\n  230 |   {\n  231 |     int col_cache[48];\n  232 |     for (int j = 0; j < 48; ++j)\n  233 |     {\n  234 |       int l = libraw.COLOR(i, j);\n  235 |       if (l == 3)\n  236 |         l = 1;\n  237 |       col_cache[j] = l;\n  238 |     }\n  239 |     for (int j = 0; j < iwidth; ++j)\n  240 |     {\n  241 |       int l = col_cache[j % 48];\n  242 |       unsigned short c = libraw.imgdata.image[i * iwidth + j][l];\n  243 |       if (c != 0)\n  244 |       {\n  245 |         if (channel_maximum[l] < c)\n  246 |           channel_maximum[l] = c;\n  247 |         if (channel_minimum[l] > c)\n  248 |           channel_minimum[l] = c;\n  249 |         nraw[nr_offset(i + nr_topmargin, j + nr_leftmargin)][l] = (float)c;\n  250 |       }\n  251 |     }\n  252 |   }","lines":24,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/demosaic/dht_demosaic.cpp#L229-L252"}]},

{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"Multiple decode setup routines (GET_TRUE_HUFF_TABLE, x3f_load_camf_decode_type4/5, x3f_setup_camf_entries) grow arrays by reallocating one element at a time inside a loop (O(n^2) copying). For large attacker-influenced counts this is both slow and an amplification vector. GET_TRUE_HUFF_TABLE and the CAMF element scans realloc every iteration.","fix":"Grow with a doubling strategy or pre-count entries, then allocate once.","locations":[{"ref":"src/x3f/x3f_utils_patched.cpp:187-202","code":"  187 | #define GET_TRUE_HUFF_TABLE(_T)                                                \\\n  188 |   do                                                                           \\\n  189 |   {                                                                            \\\n  190 |     int _i;                                                                    \\\n  191 |     (_T).element = NULL;                                                       \\\n  192 |     for (_i = 0;; _i++)                                                        \\\n  193 |     {                                                                          \\\n  194 |       (_T).size = _i + 1;                                                      \\\n  195 |       (_T).element = (x3f_true_huffman_element_t *)x3f_limited_realloc(                    \\\n  196 |           (_T).element, (_i + 1) * sizeof((_T).element[0]));                   \\\n  197 |       GET1((_T).element[_i].code_size);                                        \\\n  198 |       GET1((_T).element[_i].code);                                             \\\n  199 |       if ((_T).element[_i].code_size == 0)                                     \\\n  200 |         break;                                                                 \\\n  201 |     }                                                                          \\\n  202 |   } while (0)","lines":16,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/x3f/x3f_utils_patched.cpp#L187-L202"},{"ref":"src/x3f/x3f_utils_patched.cpp:2050-2051","code":" 2050 |     /* TODO: lots of realloc - may be inefficient */\n 2051 |     entry = (camf_entry_t *)x3f_limited_realloc(entry, (i + 1) * sizeof(camf_entry_t));","lines":2,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/x3f/x3f_utils_patched.cpp#L2050-L2051"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"crxFillBuffer is called after every 4-byte/1-byte fetch inside the tight inner loops of crxBitstreamGetZeros/GetBits even when the buffer is far from empty; the function re-checks the same conditions each time. While cheap, the per-symbol call (and the OpenMP critical section / lock acquisition when a refill actually happens) is on the hottest path of the decoder.","fix":"Only invoke the refill path when curPos actually reaches curBufSize; the inline fast path can skip the call when bytes remain.","locations":[{"ref":"src/decoders/crx.cpp:203-226","code":"  203 | static inline void crxFillBuffer(CrxBitstream *bitStrm)\n  204 | {\n  205 |   if (bitStrm->curPos >= bitStrm->curBufSize && bitStrm->mdatSize)\n  206 |   {\n  207 |     bitStrm->curPos = 0;\n  208 |     bitStrm->curBufOffset += bitStrm->curBufSize;\n  209 | #ifdef LIBRAW_USE_OPENMP\n  210 | #pragma omp critical\n  211 | #endif\n  212 |     {\n  213 | #ifndef LIBRAW_USE_OPENMP\n  214 |       bitStrm->input->lock();\n  215 | #endif\n  216 |       bitStrm->input->seek(bitStrm->curBufOffset, SEEK_SET);\n  217 |       bitStrm->curBufSize = bitStrm->input->read(bitStrm->mdatBuf, 1, _min(bitStrm->mdatSize, CRX_BUF_SIZE));\n  218 | #ifndef LIBRAW_USE_OPENMP\n  219 |       bitStrm->input->unlock();\n  220 | #endif\n  221 |     }\n  222 |     if (bitStrm->curBufSize < 1) // nothing read\n  223 |       throw LIBRAW_EXCEPTION_IO_EOF;\n  224 |     bitStrm->mdatSize -= bitStrm->curBufSize;\n  225 |   }\n  226 | }","lines":24,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/crx.cpp#L203-L226"},{"ref":"src/decoders/crx.cpp:246-264","code":"  246 |       while (bitStrm->curPos + 4 <= bitStrm->curBufSize)\n  247 |       {\n  248 |         nextData = _byteswap_ulong(*(uint32_t *)(bitStrm->mdatBuf + bitStrm->curPos));\n  249 |         bitStrm->curPos += 4;\n  250 |         crxFillBuffer(bitStrm);\n  251 |         if (nextData)\n  252 |         {\n  253 |           _BitScanReverse((DWORD *)&nonZeroBit, (DWORD)nextData);\n  254 |           result = bitsLeft + 31 - nonZeroBit;\n  255 |           bitStrm->bitData = uint32_t((nextData << (32 - nonZeroBit))&0xffffffffu);\n  256 |           bitStrm->bitsLeft = nonZeroBit;\n  257 |           return result;\n  258 |         }\n  259 |         bitsLeft += 32;\n  260 |       }\n  261 |       if (bitStrm->curBufSize < bitStrm->curPos + 1)\n  262 |         break; // error\n  263 |       nextData = bitStrm->mdatBuf[bitStrm->curPos++];\n  264 |       crxFillBuffer(bitStrm);","lines":19,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/crx.cpp#L246-L264"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"hasselblad_full_load_raw issues three separate read_shorts() calls of length 1 per pixel (one per channel) inside the height*width loop. This is an enormous number of tiny I/O/decode calls; reading a whole row (or the 3 channels at once) would be far faster.","fix":"Read 3*width shorts per row into a buffer and unpack, instead of three length-1 read_shorts per pixel.","locations":[{"ref":"src/decoders/decoders_libraw.cpp:147-158","code":"  147 | void LibRaw::hasselblad_full_load_raw()\n  148 | {\n  149 |   int row, col;\n  150 | \n  151 |   for (row = 0; row < S.height; row++)\n  152 |     for (col = 0; col < S.width; col++)\n  153 |     {\n  154 |       read_shorts(&imgdata.image[row * S.width + col][2], 1); // B\n  155 |       read_shorts(&imgdata.image[row * S.width + col][1], 1); // G\n  156 |       read_shorts(&imgdata.image[row * S.width + col][0], 1); // R\n  157 |     }\n  158 | }","lines":12,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/decoders_libraw.cpp#L147-L158"}]},

FFFu) & 0x1F;\n  429 |     hufftable2[hindex] = 0xFFFFULL << (64-hlow);\n  430 |     hufftable1[hindex] = (uint64_t)v9 << (64-hlow);\n  431 |   }\n  432 | \n  433 |   if (v7 < 17)\n  434 |   {\n  435 |     if (extrahuff.size() < 0x10000)\n  436 |       extrahuff.resize(0x10000);\n  437 |     uint64_t v17 = 0LL;\n  438 | \n  439 | \tfor (int j = 0LL; j != 0x10000; ++j)\n  440 | \t{\n  441 | \t\textrahuff[j] = uint8_t(GetDBit(v17) & 0xffu);\n  442 | \t\tv17 += 0x1000000000000ULL;\n  443 | \t}\n  444 |   }","lines":56,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/pana8.cpp#L389-L444"}]},

(function(){

// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.
const DIFFICULTY_ORDER = ['very_easy','easy','medium','hard'];
const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};

const HAS_DIFFICULTY = PRESENT_DIFFS.length > 0;
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};

// State

// URL hash — debounced so rapid filter changes don't thrash history

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }

  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Render a "**Label:** value" line. GitHub/CommonMark only recognizes a
// ``` fence when it starts at the beginning of a line, so if the value
// itself opens with a fence, put it on its own line instead of right
// after the inline label - otherwise the fence marker gets glued onto
// "**Label:** ```" and never renders as a code block.
function mdField(label, value) {
  value = value || '';
  return /^```/.test(value.trim())
    ? '**' + label + ':**\n\n' + value
    : '**' + label + ':** ' + value;
}

// Render the "**Locations:**" block. When a location has a commit-pinned
// permalink (GitHub/GitLab), just paste the bare URL on its own line -
// GitHub/GitLab auto-expand a line-range blob link into an inline code
// preview, so re-pasting the snippet as a fenced block would duplicate it.
// Forges without a detected permalink shape (or missing commit/repo info)
// fall back to the fenced ref+snippet so the location is still readable.
function mdLocations(locations) {
  if (!locations.length) return '';
  let out = '**Locations:**\n\n';
  for (const l of locations) {
    if (l.link)               out += l.link + '\n\n';
    else if (l.code != null)  out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
    else                      out += '- `' + l.ref + '` _(file not found)_\n\n';
  }
  return out;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += mdField('Description', f.description) + '\n\n';
      out += mdLocations(f.locations);
      out += mdField('Fix', f.fix) + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build a [project] header block from embedded PROJECT_INFO, so the exported
// findings.toml is self-contained (doesn't depend on a sibling project-info.toml
// that a second, separately-triggered download could silently fail to save).
// '' when there is no project info at all.
function buildProjectToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = PROJECT_INFO || {};
  if (!Object.keys(pi).length) return '';
  const lines = ['[project]'];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n\n';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return buildProjectToml() + chunks.join('\n\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += mdField('Description', f.description) + '\n\n';
  out += mdLocations(f.locations);
  out += mdField('Fix', f.fix) + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystacks per finding (cleared on full re-render).
// Two variants: everything (default), and file/folder paths only - for when a
// search term (e.g. a directory name like 'dlls/abc') also happens to appear
// inside description/fix prose and you only want path matches.
const _hay = new Map();
const _hayLoc = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}
function hayLocOf(f) {
  if (!_hayLoc.has(f.id)) {
    _hayLoc.set(f.id, f.locations.map(l => l.ref).join(' ').toLowerCase());
  }
  return _hayLoc.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (S.searchScope === 'locations') {
      if (!hayLocOf(f).includes(q)) return false;
    } else if (!hayOf(f).includes(q) && !st.includes(q)) {
      return false;
    }
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  _hayLoc.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    // Single download (was two) - a second auto-triggered download is commonly
    // blocked by the browser unless the user explicitly allows it, which silently
    // drops project-info.toml. Embedding [project] in findings.toml itself avoids
    // that failure mode entirely.
    downloadText(buildFindingsToml(), 'findings.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});
document.getElementById('search-scope').addEventListener('click', e => {
  S.searchScope = S.searchScope === 'locations' ? 'all' : 'locations';
  e.currentTarget.classList.toggle('active', S.searchScope === 'locations');
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
