<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"kodak_thumb_loader() allocates t_hist (calloc) and t_curve (calloc) and imgdata.image; if any function called between those allocations and their frees throws (e.g. gamma_curve, flip_index path, or calloc returning NULL leading to deref), t_hist/t_curve are leaked because they are freed only on the straight-line success path (no try/catch around lines 134-235). The earlier load_raw is wrapped in try/catch but the color-conversion / histogram section is not.","fix":"Wrap the post-load section in try/catch (or use RAII) to free t_hist/t_curve/imgdata.image on exception, and check calloc results for NULL.","locations":[{"ref":"src/utils/thumb_utils.cpp:134-235","code":"  134 |   int(*t_hist)[LIBRAW_HISTOGRAM_SIZE] =\n  135 |       (int(*)[LIBRAW_HISTOGRAM_SIZE])calloc(sizeof(*t_hist), 4);\n  136 | \n  137 |   if (imgdata.idata.maker_index == LIBRAW_CAMERAMAKER_Canon) // Skip color conversion for canon PPM tiffs\n  138 |   {\n  139 |     for (img = imgdata.image[0], row = 0; row < S.height; row++)\n  140 |       for (col = 0; col < S.width; col++, img += 4)\n  141 |         for (int c = 0; c < P1.colors; c++)\n  142 |           t_hist[c][img[c] >> 3]++;\n  143 |   }\n  144 |   else\n  145 |   {\n  146 |     float out[3], out_cam[3][4] = {{2.81761312f, -1.98369181f, 0.166078627f, 0},\n  147 |                                    {-0.111855984f, 1.73688626f, -0.625030339f, 0},\n  148 |                                    {-0.0379119813f, -0.891268849f, 1.92918086f, 0}};\n  149 |     \n  150 | \tfor (img = imgdata.image[0], row = 0; row < S.height; row++)\n  151 |       for (col = 0; col < S.width; col++, img += 4)\n  152 |       {\n  153 |         out[0] = out[1] = out[2] = 0;\n  154 |         int c;\n  155 |         for (c = 0; c < 3; c++)\n  156 |         {\n  157 |           out[0] += out_cam[0][c] * img[c];\n  158 |           out[1] += out_cam[1][c] * img[c {"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"In crxDecodeLineWithIQuantization the legacy (qStep==0) path indexes q_step_tbl[band->qParam % 6] and shifts by `6 - band->qParam/6`. band->qParam comes from the file header bits ((bitData>>19)&0xFF, range 0..255) and is further mutated by crxUpdateQparam with signed deltas, so it can be negative or large. Negative qParam gives a negative q_step_tbl index (OOB read); large qParam makes the shift count negative or >=32 (UB); the qParam/6>=6 branch computes `1 << (band->qParam/6 + 26)` which overflows int and is UB.","fix":"Validate band->qParam to a bounded non-negative range after every update (crxUpdateQparam already limits kParam but not qParam) and before indexing q_step_tbl; reject corrupt values.","locations":[{"ref":"src/decoders/crx.cpp:1115-1121","code":" 1115 |     int32_t qScale = q_step_tbl[band->qParam % 6] >> (6 - band->qParam / 6);\n 1116 |     if (band->qParam / 6 >= 6)\n 1117 |       qScale = q_step_tbl[band->qParam % 6] * (1 << (band->qParam / 6 + 26));\n 1118 | \n 1119 |     if (qScale != 1)\n 1120 |       for (int32_t i = 0; i < band->width; ++i)\n 1121 |         bandBuf[i] *= qScale;","lines":7,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/crx.cpp#L1115-L1121"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"crxSetupSubbandData computes compDataSize as a `long` by summing per-subband sizes (width*4) plus wavelet line-buffer sizes (8*4*width), all derived from attacker-controlled tile/subband widths, with no overflow check and no comparison against max_raw_memory_mb before malloc(compDataSize). On 32-bit `long` this can wrap; even on 64-bit a huge value is passed straight to malloc. The subband widths themselves are not validated against the tile dimensions, so band->width can be inconsistent with the later buffer use.","fix":"Accumulate sizes in a 64-bit unsigned type, check each addition for overflow, and compare the total against imgdata.rawparams.max_raw_memory_mb before allocating; bail out on overflow or oversize.","locations":[{"ref":"src/decoders/crx.cpp:1785-1810","code":" 1785 |   for (int32_t subbandNum = 0; subbandNum < toSubbands; subbandNum++)\n 1786 |   {\n 1787 |     subbands[subbandNum].bandSize = subbands[subbandNum].width * sizeof(int32_t); // 4bytes\n 1788 |     compDataSize += subbands[subbandNum].bandSize;\n 1789 |   }\n 1790 | \n 1791 |   if (img->levels)\n 1792 |   {\n 1793 |     int32_t encLevels = img->levels ? img->levels : 1;\n 1794 |     waveletDataOffset = (compDataSize + 7) & ~7;\n 1795 |     compDataSize = (sizeof(CrxWaveletTransform) * encLevels + waveletDataOffset + 7) & ~7;\n 1796 |     compCoeffDataOffset = compDataSize;\n 1797 | \n 1798 |     // calc wavelet line buffer sizes (always at one level up from current)\n 1799 |     for (int level = 0; level < img->levels; ++level)\n 1800 |       if (level < img->levels - 1)\n 1801 |         compDataSize += 8 * sizeof(int32_t) * planeComp->subBands[3 * (level + 1) + 2].width;\n 1802 |       else\n 1803 |         compDataSize += 8 * sizeof(int32_t) * tile->width;\n 1804 |   }\n 1805 |     // buffer allocation\n 1806 |     planeComp->compBuf = (uint8_t *)\n 1807 | #ifdef LIBRAW_CR3_MEMPOOL\n 1808 |                              img->memmgr.\n 1809 | #endif\n 1810 |                          malloc(compDataSize);","lines":26,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/crx.cpp#L1785-L1810"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"Heap OOB write in kodak_thumb_load_raw(): colors is set from `thumb_misc >> 5`, which equals the TIFF SamplesPerPixel value (masked only to 0..7 in tiff.cpp:634). It then does read_shorts(image[row*width+col], colors) into image slots that are ushort[4]. A crafted TIFF/DNG thumbnail IFD with SamplesPerPixel in {5,6,7} (compression=1, bps>8, non-Imacon) routes to LIBRAW_INTERNAL_THUMBNAIL_KODAK_THUMB and writes 5-7 shorts into a 4-short slot, overflowing the heap image buffer by up to 6 bytes per pixel.","fix":"Clamp/validate colors to 1..4 (e.g. `colors = LIM(thumb_misc >> 5, 1, 4);`) before the read loop, or reject thumbnails with samples>4 in kodak_thumb_loader().","locations":[{"ref":"src/decoders/kodak_decoders.cpp:516-526","code":"  516 | void LibRaw::kodak_thumb_load_raw()\n  517 | {\n  518 |   if (!image)\n  519 |     throw LIBRAW_EXCEPTION_IO_CORRUPT;\n  520 |   int row, col;\n  521 |   colors = thumb_misc >> 5;\n  522 |   for (row = 0; row < height; row++)\n  523 |     for (col = 0; col < width; col++)\n  524 |       read_shorts(image[row * width + col], colors);\n  525 |   maximum = (1 << (thumb_misc & 31)) - 1;\n  526 | }","lines":11,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/kodak_decoders.cpp#L516-L526"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"DHT allocation size computed with int arithmetic. nr_height and nr_width are int (iheight/iwidth + 8). The size expression nr_height * nr_width * sizeof(float3) at line 220 (and nr_height * nr_width at line 222, and the loop bound nr_height * nr_width at line 227) is evaluated as int * int before being widened to size_t. For large dimensions (product exceeding INT_MAX) this overflows to a small or negative value, leading to an undersized buffer while the subsequent fill loop and all nr_offset() accesses assume the full size -> heap buffer overflow. nr_offset() (line 58-61) likewise computes row*nr_width+col as int.","fix":"Use size_t for nr_height*nr_width products (e.g. (size_t)nr_height * nr_width * sizeof(float3)) and validate dimensions against a sane maximum before allocating.","locations":[{"ref":"src/demosaic/dht_demosaic.cpp:216-228","code":"  216 | DHT::DHT(LibRaw &_libraw) : libraw(_libraw)\n  217 | {\n  218 |   nr_height = libraw.imgdata.sizes.iheight + nr_topmargin * 2;\n  219 |   nr_width = libraw.imgdata.sizes.iwidth + nr_leftmargin * 2;\n  220 |   nraw = (float3 *)malloc(nr_height * nr_width * sizeof(float3));\n  221 |   int iwidth = libraw.imgdata.sizes.iwidth;\n  222 |   ndir = (char *)calloc(nr_height * nr_width, 1);\n  223 |   channel_maximum[0] = channel_maximum[1] = channel_maximum[2] = 0;\n  224 |   channel_minimum[0] = libraw.imgdata.image[0][0];\n  225 |   channel_minimum[1] = libraw.imgdata.image[0][1];\n  226 |   channel_minimum[2] = libraw.imgdata.image[0][2];\n  227 |   for (int i = 0; i < nr_height * nr_width; ++i)\n  228 |     nraw[i][0] = nraw[i][1] = nraw[i][2] = 0.5;","lines":13,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/demosaic/dht_demosaic.cpp#L216-L228"},{"ref":"src/demosaic/dht_demosaic.cpp:58-61","code":"   58 |   inline int nr_offset(int row, int col) throw()\n   59 |   {\n   60 |     return (row * nr_width + col);\n   61 |   }","lines":4,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/demosaic/dht_demosaic.cpp#L58-L61"}]},
{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"Canon CameraOrientation fallback scan: `for (i = 2; (sget2(CameraInfo+i) != 0xbbbb) && i < (int)maxlen; i++)`. The `&&` short-circuits left-to-right, so sget2(CameraInfo+i) is evaluated BEFORE the `i < maxlen` test. When i == maxlen-1 the 2-byte sget2 reads CameraInfo[maxlen-1] and CameraInfo[maxlen], i.e. 1 byte past the end of the CameraInfo buffer. Untrusted maxlen comes from the tag length.","fix":"Swap the condition order so the bound is checked first: `for (i = 2; i + 1 < (int)maxlen && sget2(CameraInfo+i) != 0xbbbb; i++)`.","locations":[{"ref":"src/metadata/canon.cpp:509","code":"  509 |     for (i = 2; (sget2(CameraInfo+i) != 0xbbbb) && i < (int)maxlen; i++);","lines":1,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/canon.cpp#L509"}]},
{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"Canon CameraOrientation inner loop: `while (i < int(maxlen - 5)) if ((sget4(CameraInfo+i) == 257) && ((c = CameraInfo[i+8]) < 3))`. The guard only ensures i < maxlen-5, but the body reads CameraInfo[i+8]. With i as large as maxlen-6, i+8 == maxlen+2, reading up to 3 bytes past the end of CameraInfo. Out-of-bounds read driven by untrusted tag length/content.","fix":"Tighten the loop bound to guarantee the i+8 access stays in range, e.g. `while (i + 8 < (int)maxlen)`.","locations":[{"ref":"src/metadata/canon.cpp:511-515","code":"  511 |     while (i < int(maxlen - 5))\n  512 |       if ((sget4(CameraInfo+i) == 257) && ((c = CameraInfo[i+8]) < 3)) {\n  513 |         imCanon.MakernotesFlip = \"065\"[c] - '0';\n  514 |         break;\n  515 |       } else i+=4;","lines":5,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/canon.cpp#L511-L515"}]},
{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"selectCRXFrame() reads hdr->stsc_data[stsc_index] and hdr->stsc_data[stsc_index+1] without verifying stsc_index < stsc_count. The while loop `while((stsc_index < hdr->stsc_count) && (i+1 == hdr->stsc_data[stsc_index+1].first))` accesses stsc_data[stsc_index+1] which is OOB when stsc_index+1 == stsc_count. Worse, after the loop, `hdr->stsc_data[stsc_index].count` is dereferenced; if stsc_count is 0 (no stsc atom parsed) stsc_data is NULL, causing a NULL+offset read / crash. chunk_count, sample_count and stsc_count are independently attacker-controlled from separate atoms.","fix":"Guard stsc_data != NULL and stsc_count > 0 before the loop; ensure (stsc_index+1) < stsc_count before reading stsc_data[stsc_index+1]; bound stsc_index < stsc_count before reading stsc_data[stsc_index].count.","locations":[{"ref":"src/metadata/cr3_parser.cpp:42-45","code":"   42 |     while((stsc_index < hdr->stsc_count) && (i+1 == hdr->stsc_data[stsc_index+1].first))\n   43 |       stsc_index++;\n   44 | \n   45 |     for (unsigned j = 0; j < hdr->stsc_data[stsc_index].count; j++)","lines":4,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/cr3_parser.cpp#L42-L45"}]},
{"id":"OVF_8","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"selectCRXFrame() off-by-one out-of-bounds read of hdr->sample_sizes[]. The guard `if (current_sample > hdr->sample_count) return -1;` permits current_sample == sample_count, but sample_sizes[] was allocated with exactly sample_count (== \"entries\") elements in parseCR3 (case stsz). When the loop reaches current_sample == sample_count and sample_size is variable (hdr->sample_size == 0), `hdr->sample_sizes[current_sample]` reads one element past the end of the heap allocation. Attacker-controlled stsc/stsz tables can drive current_sample up to sample_count.","fix":"Use `if (current_sample >= hdr->sample_count) return -1;` and additionally bound-check current_sample < hdr->sample_count before indexing sample_sizes[].","locations":[{"ref":"src/metadata/cr3_parser.cpp:45-50","code":"   45 |     for (unsigned j = 0; j < hdr->stsc_data[stsc_index].count; j++)\n   46 |     {\n   47 |       if (current_sample > hdr->sample_count)\n   48 |         return -1;\n   49 | \n   50 |       sample_size = hdr->sample_size > 0 ? hdr->sample_size : hdr->sample_sizes[current_sample];","lines":6,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/cr3_parser.cpp#L45-L50"}]},
{"id":"OVF_9","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"process_Sony_0x9400() reads buf[0] unconditionally before any length check. The buffer is allocated with calloc(len,1) in parseSonyMakernotes (tag 0x9400) and process_Sony_0x9400 is invoked inline whenever ilm.CamID is set, with no guard on len. A crafted ARW with a zero-length (or len==0) 0x9400 tag yields calloc(0,1) and the immediate buf[0] dereference is an out-of-bounds read on a zero-size allocation. All the subsequent version branches do check len, but the very first read is unguarded.","fix":"Add a length guard at the top of process_Sony_0x9400 (e.g. `if (len < 1) return;`) before reading buf[0], mirroring the other process_Sony_* helpers.","locations":[{"ref":"src/metadata/sony.cpp:931","code":"  931 |   uchar bufx = buf[0];","lines":1,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/sony.cpp#L931"},{"ref":"src/metadata/sony.cpp:1955-1965","code":" 1955 |   else if (tag == 0x9400 && len < 256000)\n 1956 |   {\n 1957 |     table_buf_0x9400 = (uchar *)calloc(len,1);\n 1958 |     table_buf_0x9400_len = len;\n 1959 |     fread(table_buf_0x9400, len, 1, ifp);\n 1960 |     if (ilm.CamID)\n 1961 |     {\n 1962 |       process_Sony_0x9400(table_buf_0x9400, table_buf_0x9400_len, unique_id);\n 1963 |       free(table_buf_0x9400);\n 1964 |       table_buf_0x9400_len = 0;\n 1965 |     }","lines":11,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/sony.cpp#L1955-L1965"}]},
{"id":"OVF_10","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"tiff_get(): integer overflow in the data-size computation `*len * tagtype_dataunit_bytes[...]`. *len is an unsigned read directly from the file via get4() (full 32-bit range) and is multiplied by a per-type unit size (up to 8). The 32-bit unsigned multiply can wrap, so a crafted large len whose product wraps to <= 4 will skip the `fseek(get4()+base)` redirection and leave the file pointer at the inline value, causing later parsers to read len elements from the wrong (small) location, or to mis-handle the tag entirely. The product should be done in 64-bit.","fix":"Compute the size as INT64: `if ((INT64)(*len) * tagtype_dataunit_bytes[idx] > 4)`; also sanity-check *len against file size.","locations":[{"ref":"src/utils/utils_dcraw.cpp:328-329","code":"  328 |   if (*len * tagtype_dataunit_bytes[(*type <= LIBRAW_EXIFTAG_TYPE_IFD8) ? *type : 0] > 4)\n  329 |     fseek(ifp, INT64(get4()) + base, SEEK_SET);","lines":2,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/utils/utils_dcraw.cpp#L328-L329"}]},
{"id":"OVF_11","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"LibRaw::tiff_sget() computes `*tag_dataoffset = sget4(pos) - save` and `*tag_datalen = sget4(pos)` (both unsigned), then checks `(*tag_dataoffset + *tag_datalen) > buf_len`. All operands are unsigned (INT64 tag_dataoffset, unsigned tag_datalen, unsigned buf_len). A malicious tag with sget4 < save makes tag_dataoffset a huge value (or wraps), and `tag_dataoffset + tag_datalen` can overflow/wrap so the bounds check passes while the real offset is out of range; also `*tag_datalen * (*tag_dataunitlen)` (both small ints/unsigned) can overflow. Callers then read at buf + tag_dataoffset. The checked_buffer_t::tiff_sget variant (utils_libraw.cpp:717) has the same pattern against _len.","fix":"Compute in 64-bit signed, validate sget4(pos) >= save, reject if tag_dataoffset < 0 or tag_dataoffset > buf_len or tag_datalen > buf_len or tag_dataoffset + tag_datalen > buf_len (no unsigned wrap), and check tag_datalen * tag_dataunitlen for overflow before comparing with 4.","locations":[{"ref":"src/utils/utils_libraw.cpp:592-611","code":"  592 | short LibRaw::tiff_sget (unsigned save, uchar *buf, unsigned buf_len, INT64 *tag_offset,\n  593 |                          unsigned *tag_id, unsigned *tag_type, INT64 *tag_dataoffset,\n  594 |                          unsigned *tag_datalen, int *tag_dataunitlen) {\n  595 |   uchar *pos = buf + *tag_offset;\n  596 |   if ((((*tag_offset) + 12) > buf_len) || (*tag_offset < 0)) { // abnormal, tag buffer overrun\n  597 |     return -1;\n  598 |   }\n  599 |   *tag_id      = sget2(pos); pos += 2;\n  600 |   *tag_type    = sget2(pos); pos += 2;\n  601 |   *tag_datalen = sget4(pos); pos += 4;\n  602 |   *tag_dataunitlen = tagtype_dataunit_bytes[(*tag_type <= LIBRAW_EXIFTAG_TYPE_IFD8) ? *tag_type : 0];\n  603 |   if ((*tag_datalen * (*tag_dataunitlen)) > 4) {\n  604 |     *tag_dataoffset = sget4(pos) - save;\n  605 |     if ((*tag_dataoffset + *tag_datalen) > buf_len) { // abnormal, tag data buffer overrun\n  606 |       return -2;\n  607 |     }\n  608 |   } else *tag_dataoffset = *tag_offset + 8;\n  609 |   *tag_offset += 12;\n  610 |   return 0;\n  611 | }","lines":20,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/utils/utils_libraw.cpp#L592-L611"},{"ref":"src/utils/utils_libraw.cpp:717-744","code":"  717 | int checked_buffer_t::tiff_sget(unsigned save, INT64 *tag_offset, unsigned *tag_id, unsigned *tag_type, INT64 *tag_dataoffset,\n  718 |               unsigned *tag_datalen, int *tag_dataunitlen)\n  719 | {\n  720 |   if ((((*tag_offset) + 12) > _len) || (*tag_offset < 0))\n  721 |   { // abnormal, tag buffer overrun\n  722 |     return -1;\n  723 |   }\n  724 |   int pos = int(*tag_offset);\n  725 |   *tag_id = sget2(pos);\n  726 |   pos += 2;\n  727 |   *tag_type = sget2(pos);\n  728 |   pos += 2;\n  729 |   *tag_datalen = sget4(pos);\n  730 |   pos += 4;\n  731 |   *tag_dataunitlen = libraw_tagtype_dataunit_bytes(*tag_type);\n  732 |   if ((*tag_datalen * (*tag_dataunitlen)) > 4)\n  733 |   {\n  734 |     *tag_dataoffset = sget4(pos) - save;\n  735 |     if ((*tag_dataoffset + *tag_datalen) > _len)\n  736 |     { // abnormal, tag data buffer overrun\n  737 |       return -2;\n  738 |     }\n  739 |   }\n  740 |   else\n  741 |     *tag_dataoffset = *tag_offset + 8;\n  742 |   *tag_offset += 12;\n  743 |   return 0;\n  744 | }","lines":28,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/utils/utils_libraw.cpp#L717-L744"}]},
{"id":"OVF_12","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"x3f_load_raw computes datasize = S.raw_height * S.raw_width * 3 * sizeof(unsigned short) where raw_height/raw_width are ints (from ID->rows/columns, up to 65535 each). The multiply 'S.raw_height * S.raw_width * 3' is performed in int and can overflow before promotion to size_t, yielding a small datasize; malloc(datasize) then under-allocates and the subsequent memmove(raw_alloc, data, datasize) plus the Quattro/Polaroid copy loops (indexed up to raw_height*raw_width) write/read past the buffer. The source buffers (x3rgb16) were sized in 64-bit so the mismatch is exploitable.","fix":"Compute datasize in size_t/INT64 (cast operands), and validate raw_width*raw_height*3*2 against a sane limit before malloc.","locations":[{"ref":"src/x3f/x3f_parse_process.cpp:621-641","code":"  621 |     size_t datasize = S.raw_height * S.raw_width * 3 * sizeof(unsigned short);\n  622 |     S.raw_pitch = S.raw_width * 3 * sizeof(unsigned short);\n  623 |     if (!(imgdata.rawdata.raw_alloc = malloc(datasize)))\n  624 |       throw LIBRAW_EXCEPTION_ALLOC;\n  625 | \n  626 |     imgdata.rawdata.color3_image = (ushort(*)[3])imgdata.rawdata.raw_alloc;\n  627 |     // swap R/B channels for known old cameras\n  628 |     if (!strcasecmp(P1.make, \"Polaroid\") && !strcasecmp(P1.model, \"x530\"))\n  629 |     {\n  630 |       ushort(*src)[3] = (ushort(*)[3])data;\n  631 |       for (int p = 0; p < S.raw_height * S.raw_width; p++)\n  632 |       {\n  633 |         imgdata.rawdata.color3_image[p][0] = src[p][2];\n  634 |         imgdata.rawdata.color3_image[p][1] = src[p][1];\n  635 |         imgdata.rawdata.color3_image[p][2] = src[p][0];\n  636 |       }\n  637 |     }\n  638 |     else if (HUF)\n  639 |       memmove(imgdata.rawdata.raw_alloc, data, datasize);\n  640 |     else if (TRU && (!Q || !Q->quattro_layout))\n  641 |       memmove(imgdata.rawdata.raw_alloc, data, datasize);","lines":21,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/x3f/x3f_parse_process.cpp#L621-L641"}]},
{"id":"OVF_13","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"x3f_limited_calloc computes the product n*sz in 64-bit BEFORE comparing against the limit, but the multiplication itself can overflow UINT64 (or, more practically, the two file-derived 32-bit values multiply to a value that wraps under the limit while the actual calloc still allocates a small/garbage amount). The check 'sz * n > LIMIT' is performed on the wrapped product, so a crafted (n, sz) pair can pass the limit check yet calloc may either fail to allocate the intended size or, if calloc itself overflows, return a tiny buffer that callers then write past. The limit check must be done on the operands, not on their (overflow-prone) product.","fix":"Check each operand and the product safely, e.g. if (n != 0 && sz > LIMIT_BYTES / n) throw TOOBIG; before multiplying. Or compute the product in a checked manner and compare against the byte limit.","locations":[{"ref":"src/x3f/x3f_utils_patched.cpp:63-71","code":"   63 | static void *x3f_limited_calloc(UINT64 n, UINT64 sz)\n   64 | {\n   65 |   if (sz * n > LIBRAW_X3F_ALLOC_LIMIT_MB * 1024ULL * 1024ULL)\n   66 |     throw LIBRAW_EXCEPTION_TOOBIG;\n   67 |   void *ret = calloc(n, sz);\n   68 |   if (!ret)\n   69 |     throw LIBRAW_EXCEPTION_ALLOC;\n   70 |   return ret;\n   71 | }","lines":9,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/x3f/x3f_utils_patched.cpp#L63-L71"}]},
{"id":"OVF_14","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"x3f_load_camf_decode_type4 and type5 build the huffman element table by walking CAMF->data with 'for (p = CAMF->data; *p != 0; ...) { code_size = *p++; code = *p++; }'. There is no bound tying the scan to CAMF->data_size, so a CAMF data block that contains no zero byte (or whose terminating zero lies after the buffer) walks past the end of the allocated buffer, reading two bytes per iteration out of bounds and reallocating an ever-growing element array until it crashes or hits the alloc limit.","fix":"Pass data_size in and stop the loop when p reaches CAMF->data + CAMF->data_size; throw LIBRAW_EXCEPTION_IO_CORRUPT if no terminator is found within bounds.","locations":[{"ref":"src/x3f/x3f_utils_patched.cpp:1764-1772","code":" 1764 |   for (i = 0, p = (uint8_t *)CAMF->data; *p != 0; i++)\n 1765 |   {\n 1766 |     /* TODO: Is this too expensive ??*/\n 1767 |     element = (x3f_true_huffman_element_t *)x3f_limited_realloc(element,\n 1768 |                                                     (i + 1) * sizeof(*element));\n 1769 | \n 1770 |     element[i].code_size = *p++;\n 1771 |     element[i].code = *p++;\n 1772 |   }","lines":9,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/x3f/x3f_utils_patched.cpp#L1764-L1772"},{"ref":"src/x3f/x3f_utils_patched.cpp:1829-1837","code":" 1829 |   for (i = 0, p = (uint8_t *)CAMF->data; *p != 0; i++)\n 1830 |   {\n 1831 |     /* TODO: Is this too expensive ??*/\n 1832 |     element = (x3f_true_huffman_element_t *)x3f_limited_realloc(element,\n 1833 |                                                     (i + 1) * sizeof(*element));\n 1834 | \n 1835 |     element[i].code_size = *p++;\n 1836 |     element[i].code = *p++;\n 1837 |   }","lines":9,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/x3f/x3f_utils_patched.cpp#L1829-L1837"}]},
{"id":"OVF_15","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"In x3f_load_camf_decode_type4 / type5 the code reads a uint32_t at CAMF->data + 28 (CAMF_T4_DATA_SIZE_OFFSET / decoding_size) and sets decoding_start = CAMF->data + 32, with no check that CAMF->data_size >= 32. CAMF->data_size comes directly from the file (read_data_block). A CAMF section whose data block is smaller than 32 bytes causes an out-of-bounds read at line 1769/1834 and an out-of-bounds decoding_start pointer that the huffman bit reader then dereferences.","fix":"Before reading offsets 28/32, verify CAMF->data_size >= CAMF_T4_DATA_OFFSET (32); throw LIBRAW_EXCEPTION_IO_CORRUPT otherwise. Also bound the huffman element-table scan loop (see separate finding).","locations":[{"ref":"src/x3f/x3f_utils_patched.cpp:1778-1782","code":" 1778 | #define CAMF_T4_DATA_SIZE_OFFSET 28\n 1779 | #define CAMF_T4_DATA_OFFSET 32\n 1780 |   CAMF->decoding_size =\n 1781 |       *(uint32_t *)((unsigned char *)CAMF->data + CAMF_T4_DATA_SIZE_OFFSET);\n 1782 |   CAMF->decoding_start = (uint8_t *)CAMF->data + CAMF_T4_DATA_OFFSET;","lines":5,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/x3f/x3f_utils_patched.cpp#L1778-L1782"},{"ref":"src/x3f/x3f_utils_patched.cpp:1843-1847","code":" 1843 | #define CAMF_T5_DATA_SIZE_OFFSET 28\n 1844 | #define CAMF_T5_DATA_OFFSET 32\n 1845 |   CAMF->decoding_size =\n 1846 |       *(uint32_t *)((uint8_t *)CAMF->data + CAMF_T5_DATA_SIZE_OFFSET);\n 1847 |   CAMF->decoding_start = (uint8_t *)CAMF->data + CAMF_T5_DATA_OFFSET;","lines":5,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/x3f/x3f_utils_patched.cpp#L1843-L1847"}]},
{"id":"OVF_16","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"x3f_setup_camf_text_entry reads text_size = *(uint32*)value_address and sets text = value_address+4 with no check that 4+text_size lies within the entry/decoded_data. Consumers using text_size then read out of bounds. value_address itself (p + value_offset) is also not validated to be inside decoded_data.","fix":"Verify value_offset+4 <= entry_size and value_offset+4+text_size <= entry_size (and value_address within decoded_data) before exposing text/text_size.","locations":[{"ref":"src/x3f/x3f_utils_patched.cpp:1861-1865","code":" 1861 | static void x3f_setup_camf_text_entry(camf_entry_t *entry)\n 1862 | {\n 1863 |   entry->text_size = *(uint32_t *)entry->value_address;\n 1864 |   entry->text = (char *)entry->value_address + 4;\n 1865 | }","lines":5,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/x3f/x3f_utils_patched.cpp#L1861-L1865"}]},
{"id":"OVF_17","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"x3f_setup_camf_property_entry reads num and off from the value buffer (num = *(uint32*)v, off = *(uint32*)(v+4)) and then loops i<num reading two uint32 at v+8+8*i, writing property_name[i]/property_value[i] from e+name_off/e+value_off. num is fully attacker-controlled and unbounded; the calloc 'num * sizeof(uint8_t*)' can integer-overflow (num*8 wraps on 32-bit size computation) yielding a small allocation followed by num out-of-bounds writes, and the loop reads v+8+8*i past the value buffer. name_off/value_off are also unchecked, producing wild pointers stored in the table.","fix":"Validate that 8 + 8*num <= value_size before the loop; use the limited calloc with separate (num, sizeof) args so its own overflow check applies; bound name_off/value_off against the entry size.","locations":[{"ref":"src/x3f/x3f_utils_patched.cpp:1867-1886","code":" 1867 | static void x3f_setup_camf_property_entry(camf_entry_t *entry)\n 1868 | {\n 1869 |   int i;\n 1870 |   uint8_t *e = (uint8_t *)entry->entry;\n 1871 |   uint8_t *v = (uint8_t *)entry->value_address;\n 1872 |   uint32_t num = entry->property_num = *(uint32_t *)v;\n 1873 |   uint32_t off = *(uint32_t *)(v + 4);\n 1874 | \n 1875 |   entry->property_name = (char **)x3f_limited_calloc(num * sizeof(uint8_t *), 1);\n 1876 |   entry->property_value = (uint8_t **)x3f_limited_calloc(num * sizeof(uint8_t *), 1);\n 1877 | \n 1878 |   for (i = 0; i < (int)num; i++)\n 1879 |   {\n 1880 |     uint32_t name_off = off + *(uint32_t *)(v + 8 + 8 * i);\n 1881 |     uint32_t value_off = off + *(uint32_t *)(v + 8 + 8 * i + 4);\n 1882 | \n 1883 |     entry->property_name[i] = (char *)(e + name_off);\n 1884 |     entry->property_value[i] = e + value_off;\n 1885 |   }\n 1886 | }","lines":20,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/x3f/x3f_utils_patched.cpp#L1867-L1886"}]},
{"id":"OVF_18","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"x3f_setup_camf_matrix_entry reads dim from the entry and loops i<dim reading 12 bytes each at v+12+12*i without verifying these stay within the entry/value buffer. dim is attacker-controlled (uint32 from decoded data), so large dim reads far OOB. Additionally totalsize is accumulated as a signed int via 'totalsize *= size' with size unchecked, overflowing to a small or zero value; matrix_estimated_element_size = matrix_used_space / totalsize then divides by zero, and get_matrix_copy allocates size = sizeof(...) * elements (elements = totalsize) which can be a tiny buffer while memcpy/loops copy matrix_data of the real (large) extent -> heap overflow / OOB read of matrix_data.","fix":"Bound dim so that 12+12*dim <= value_size; validate each dentry[i].size; accumulate totalsize in uint64 with overflow check and reject zero/overflow; verify matrix_data region (off .. off + elements*element_size) lies within the entry before get_matrix_copy.","locations":[{"ref":"src/x3f/x3f_utils_patched.cpp:1989-2027","code":" 1989 | static void x3f_setup_camf_matrix_entry(camf_entry_t *entry)\n 1990 | {\n 1991 |   int i;\n 1992 |   int totalsize = 1;\n 1993 | \n 1994 |   uint8_t *e = (uint8_t *)entry->entry;\n 1995 |   uint8_t *v = (uint8_t *)entry->value_address;\n 1996 |   uint32_t type = entry->matrix_type = *(uint32_t *)(v + 0);\n 1997 |   uint32_t dim = entry->matrix_dim = *(uint32_t *)(v + 4);\n 1998 |   uint32_t off = entry->matrix_data_off = *(uint32_t *)(v + 8);\n 1999 |   camf_dim_entry_t *dentry = entry->matrix_dim_entry =\n 2000 |       (camf_dim_entry_t *)x3f_limited_malloc(dim * sizeof(camf_dim_entry_t));\n 2001 | \n 2002 |   for (i = 0; i < (int)dim; i++)\n 2003 |   {\n 2004 |     uint32_t size = dentry[i].size = *(uint32_t *)(v + 12 + 12 * i + 0);\n 2005 |     dentry[i].name_offset = *(uint32_t *)(v + 12 + 12 * i + 4);\n 2006 |     dentry[i].n = *(uint32_t *)(v + 12 + 12 * i + 8);\n 2007 |     dentry[i].name = (char *)(e + dentry[i].name_offset);\n 2008 | \n 2009 |     if ((int)dentry[i].n != i)\n 2010 |     {\n 2011 |     }\n 2012 | \n 2013 |     totalsize *= size;\n 2014 |   }\n 2015 | \n 2016 |   set_matrix_element_info(type, &entry->matrix_element_size,\n 2017 |                           &entry->matrix_decoded_type);\n 2018 |   entry->matrix_data = (void *)(e + off);\n 2019 | \n 2020 |   entry->matrix_elements = totalsize;\n 2021 |   entry->matrix_used_space = entry->entry_size - off;\n 2022 | \n 2023 |   /* This estimate only works for matrices above a certain size */\n 2024 |   entry->matrix_estimated_element_size = entry->matrix_used_space / totalsize;\n 2025 | \n 2026 |   get_matrix_copy(entry);\n 2027 | }","lines":39,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/x3f/x3f_utils_patched.cpp#L1989-L2027"},{"ref":"src/x3f/x3f_utils_patched.cpp:1922-1987","code":" 1922 | static void get_matrix_copy(camf_entry_t *entry)\n 1923 | {\n 1924 |   uint32_t element_size = entry->matrix_element_size;\n 1925 |   uint32_t elements = entry->matrix_elements;\n 1926 |   int i, size = (entry->matrix_decoded_type == M_FLOAT ? sizeof(double)\n 1927 |                                                        : sizeof(uint32_t)) *\n 1928 |                 elements;\n 1929 | \n 1930 |   entry->matrix_decoded = x3f_limited_malloc(size);\n 1931 | \n 1932 |   switch (element_size)\n 1933 |   {\n 1934 |   case 4:\n 1935 |     switch (entry->matrix_decoded_type)\n 1936 |     {\n 1937 |     case M_INT:\n 1938 |     case M_UINT:\n 1939 |       memcpy(entry->matrix_decoded, entry->matrix_data, size);\n 1940 |       break;\n 1941 |     case M_FLOAT:\n 1942 |       for (i = 0; i < (int)elements; i++)\n 1943 |         ((double *)entry->matrix_decoded)[i] =\n 1944 |             (double)((float *)entry->matrix_data)[i];\n 1945 |       break;\n 1946 |     default:\n 1947 |       throw LIB {"id":"OVF_19","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"x3f_setup_camf_entries iterates entries from decoded_data but trusts entry_size and the name/value offsets entirely. entry[i].entry_size is read from the buffer and 'p += entry[i].entry_size' advances the cursor; a zero entry_size makes p never advance (infinite loop / unbounded realloc) and a huge or unaligned entry_size lets the per-type setup functions (property/text/matrix) read far past 'end'. There is no validation that entry header (5 uint32 = 20 bytes) fits before reading *p4++ five times, nor that entry+entry_size stays within decoded_data_size.","fix":"Before reading the 5-word header verify (end - p) >= 20. Validate entry_size >= 20 and p + entry_size <= end. Validate name_offset <= value_offset <= entry_size. Reject (throw) on violation instead of continuing.","locations":[{"ref":"src/x3f/x3f_utils_patched.cpp:2029-2096","code":" 2029 | static void x3f_setup_camf_entries(x3f_camf_t *CAMF)\n 2030 | {\n 2031 |   uint8_t *p = (uint8_t *)CAMF->decoded_data;\n 2032 |   uint8_t *end = p + CAMF->decoded_data_size;\n 2033 |   camf_entry_t *entry = NULL;\n 2034 |   int i;\n 2035 | \n 2036 |   for (i = 0; p < end; i++)\n 2037 |   {\n 2038 |     uint32_t *p4 = (uint32_t *)p;\n 2039 | \n 2040 |     switch (*p4)\n 2041 |     {\n 2042 |     case X3F_CMbP:\n 2043 |     case X3F_CMbT:\n 2044 |     case X3F_CMbM:\n 2045 |       break;\n 2046 |     default:\n 2047 |       goto stop;\n 2048 |     }\n 2049 | \n 2050 |     /* TODO: lots of realloc - may be inefficient */\n 2051 |     entry = (camf_entry_t *)x3f_limited_realloc(entry, (i + 1) * sizeof(camf_entry_t));\n 2052 | \n 2053 |     /* Pointer */\n 2054 |     entry[i].entry = p;\n 2055 | \n 2056 |     /* Header */\n 2057 |     entry[i].id = *p4++;\n 2058 |     entry[i].version = *p4++;\n 2059 |     entry[i].entry_size = *p4++;\n 2060 |     entry[i].name_offset = *p4++;\n 2061 |     entry[i].value_offset = *p4++;\n 2062 | \n 2063 |     /* Compute addresses and sizes */\n 2064 |     entry[i].name_address = (char *)(p + entry[i].name_offset);\n 2065 |     entry[i].value_address = p + entry[i].value_offset;\n 2066 |     entry[i].name_size = entry[i].value_offset - entry[i].name_offset;\n 2067 |     entry[i].value_size = entry[i].entry_size - entry[i].value_offset;\n 2068 | \n 2069 |     entry[i].text_size = 0;\n 2070 |     entry[i].text = NULL;\n 2071 |     entry[i].property_num = 0;\n 2072 |     entry[i].property_name = NULL;\n 2073 |     entry[i].property_value = NULL;\n 2074 |     entry[i].matrix_type = 0;\n 2075 |     entry[i].matrix_dim = 0;\n 2076 |     entry[i].matrix_data_off = 0;\n 2077 |     entry[i].matrix_data = NULL;\n 2078 |     entry[i].matrix_dim_entry = NULL;\n 2079 | \n 2080 |     entry[i].matrix_decoded = NULL;\n 2081 | \n 2082 |     switch (entry[i].id)\n 2083 |     {\n 2084 |     case X3F_CMbP:\n 2085 |       x3f_setup_camf_property_entry(&entry[i]);\n 2086 |       break;\n 2087 |     case X3F_CMbT:\n 2088 |       x3f_setup_camf_text_entry(&entry[i]);\n 2089 |       break;\n 2090 |     case X3F_CMbM:\n 2091 |       x3f_setup_camf_matrix_entry(&entry[i]);\n 2092 |       break;\n 2093 |     }\n 2094 | \n 2095 |     p += entry[i].entry_size;\n 2096 |   }","lines":68,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/x3f/x3f_utils_patched.cpp#L2029-L2096"}]},

[rawLineOffset + 2 * i] = _constrain(val, 0, maxVal);\n 1724 |       // Essentially G2 = round(median + P0 - P2 - 0.164*P1 - 0.571*P3)\n 1725 |       val = (gr - plane2[i] + 1) >> 1;\n 1726 |       img->outBufs[2][rawLineOffset + 2 * i] = _constrain(val, 0, maxVal);\n 1727 |       // Essentially B = round(median + P0 + 1.881*P1)\n 1728 |       val = (median + (plane0[i] << 10) + 1927 * plane1[i] + 512) >> 10;\n 1729 |       img->outBufs[3][rawLineOffset + 2 * i] = _constrain(val, 0, maxVal);\n 1730 |     }","lines":35,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/crx.cpp#L1696-L1730"}]},
{"id":"OVF_21","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"crxMakeQStep allocates `totalHeight * qpWidth * sizeof(uint32_t) + img->levels * sizeof(CrxQStep)` with malloc. totalHeight and qpWidth derive from tile->width/height (up to 0x7FFF each) without an overflow guard or max-memory check. While individual tiles are bounded, the multiplication and the unchecked allocation size are a latent integer/allocation hazard, and the result is not validated against max_raw_memory_mb.","fix":"Compute the allocation size in 64-bit, check for overflow, and validate against the configured memory limit before malloc.","locations":[{"ref":"src/decoders/crx.cpp:1997-2014","code":" 1997 |   int qpWidth = (tile->width >> 3) + ((tile->width & 7) != 0);\n 1998 |   int qpHeight = (tile->height >> 1) + (tile->height & 1);\n 1999 |   int qpHeight4 = (tile->height >> 2) + ((tile->height & 3) != 0);\n 2000 |   int qpHeight8 = (tile->height >> 3) + ((tile->height & 7) != 0);\n 2001 |   uint32_t totalHeight = qpHeight;\n 2002 |   if (img->levels > 1)\n 2003 |     totalHeight += qpHeight4;\n 2004 |   if (img->levels > 2)\n 2005 |     totalHeight += qpHeight8;\n 2006 | \n 2007 |   tile->qStep = (CrxQStep *)\n 2008 | #ifdef LIBRAW_CR3_MEMPOOL\n 2009 |                       img->memmgr.\n 2010 | #endif\n 2011 |                   malloc(totalHeight * qpWidth * sizeof(uint32_t) + img->levels * sizeof(CrxQStep));\n 2012 | \n 2013 |   if (!tile->qStep)\n 2014 |     return -1;","lines":18,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/crx.cpp#L1997-L2014"}]},
{"id":"OVF_22","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"crxProcessSubbands indexes exCoefNumTbl (size 144) via `exCoefNumTbl + 0x30*(img->levels-1) + 6*(tile->width & 7)` and reads rowExCoef[2*level], [2*level+1], up to [2*img->levels-1]. img->levels is validated to 1..3 elsewhere but crxProcessSubbands itself does not assert it; 0x30*(levels-1)+6*7+2*level can reach near the table end. If levels were ever 0 or >3 (e.g. via a path that doesn't go through the validation), or if the table layout assumption is off by the 6*(width&7) term reaching index 0x30*2+6*7+... the read can exceed 144. Defensive bound is missing.","fix":"Assert/validate img->levels in 1..3 at the top of crxProcessSubbands and verify all computed exCoefNumTbl indices are < 144 before dereferencing.","locations":[{"ref":"src/decoders/crx.cpp:2115-2174","code":" 2115 |     int32_t *rowExCoef = exCoefNumTbl + 0x30 * (img->levels - 1) + 6 * (tile->width & 7);\n 2116 |     int32_t *colExCoef = exCoefNumTbl + 0x30 * (img->levels - 1) + 6 * (tile->height & 7);\n 2117 |     for (int level = 0; level < img->levels; ++level)\n 2118 |     {\n 2119 |       int32_t widthOddPixel = bandWidth & 1;\n 2120 |       int32_t heightOddPixel = bandHeight & 1;\n 2121 |       bandWidth = (widthOddPixel + bandWidth) >> 1;\n 2122 |       bandHeight = (heightOddPixel + bandHeight) >> 1;\n 2123 | \n 2124 |       int32_t bandWidthExCoef0 = 0;\n 2125 |       int32_t bandWidthExCoef1 = 0;\n 2126 |       int32_t bandHeightExCoef0 = 0;\n 2127 |       int32_t bandHeightExCoef1 = 0;\n 2128 |       int32_t colStartIdx = 0;\n 2129 |       int32_t rowStartIdx = 0;\n 2130 |       if (tile->tileFlag & E_HAS_TILES_ON_THE_RIGHT)\n 2131 |       {\n 2132 |         bandWidthExCoef0 = rowExCoef[2 * level];\n 2133 |         bandWidthExCoef1 = rowExCoef[2 * level + 1];\n 2134 |       }\n 2135 |       if (tile->tileFlag & E_HAS_TILES_ON_THE_LEFT)\n 2136 |       {\n 2137 |         ++bandWidthExCoef0;\n 2138 |         colStartIdx = 1;\n 2139 |       }\n 2140 | \n 2141 |       if (tile->tileFlag & E_HAS_TILES_ON_THE_BOTTOM)\n 2142 |       {\n 2143 |         bandHeightExCoef0 = colExCoef[2 * level];\n 2144 |         bandHeightExCoef1 = colExCoef[2 * level + 1];\n 2145 |       }\n 2146 |       if (tile->tileFlag & E_HAS_TILES_ON_THE_TOP)\n 2147 |       {\n 2148 |         ++bandHeightExCoef0;\n 2149 |         rowStartIdx = 1;\n 2150 |       }\n 2151 | \n 2152 |       band[0].width = bandWidth + bandWidthExCoef0 - widthOddPixel;\n 2153 |       band[0].height = bandHeight + bandHeightExCoef0 - heightOddPixel;\n 2154 |       crxSetupSubbandIdx(hdr, img, band, level + 1, colStartIdx, bandWidthExCoef0 - colStartIdx, rowStartIdx,\n 2155 |                          bandHeightExCoef0 - rowStartIdx);\n 2156 | \n 2157 |       band[-1].width = bandWidth + bandWidthExCoef1;\n 2158 |       band[-1].height = bandHeight + bandHeightExCoef0 - heightOddPixel;\n 2159 | \n 2160 |       crxSetupSubbandIdx(hdr, img, band - 1, level + 1, 0, bandWidthExCoef1, rowStartIdx,\n 2161 |                          bandHeightExCoef0 - rowStartIdx);\n 2162 | \n 2163 |       band[-2].width = bandWidth + bandWidthExCoef0 - widthOddPixel;\n 2164 |       band[-2].height = bandHeight + bandHeightExCoef1;\n 2165 |       crxSetupSubbandIdx(hdr, img, band - 2, level + 1, colStartIdx, bandWidthExCoef0 - colStartIdx, 0,\n 2166 |                          bandHeightExCoef1);\n 2167 | \n 2168 |       band -= 3;\n 2169 |     }\n 2170 |     bandWidthExCoef = bandHeightExCoef = 0;\n 2171 |     if (tile->tileFlag & E_HAS_TILES_ON_THE_RIGHT)\n 2172 |       bandWidthExCoef = rowExCoef[2 * img->levels - 1];\n 2173 |     if (tile->tileFlag & E_HAS_TILES_ON_THE_BOTTOM)\n 2174 |       bandHeightExCoef = colExCoef[2 * img->levels - 1];","lines":60,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/crx.cpp#L2115-L2174"}]},
{"id":"OVF_23","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"band->dataSize is computed as subbandSize - (bitData & 0x7FFFF) (old header) or subbandSize - sgetn(2,+16) (new header) where subbandSize is a signed 32-bit value read from the file. If the subtracted field exceeds subbandSize, band->dataSize becomes negative; it is stored in an INT64 and later used as mdatSize in the bitstream. A negative mdatSize disables the `&& bitStrm->mdatSize` refill guard logic in unexpected ways and the value flows into _min(mdatSize, CRX_BUF_SIZE) in crxFillBuffer.","fix":"Reject negative or implausible band->dataSize (require 0 <= dataSize <= subbandSize and within mdat bounds) right after computing it.","locations":[{"ref":"src/decoders/crx.cpp:2220-2243","code":" 2220 |       uint32_t bitData = LibRaw::sgetn(4, *subbandMdatPtr + 8);\n 2221 |       band->dataSize = subbandSize - (bitData & 0x7FFFF);\n 2222 |       band->supportsPartial = bitData & 0x8000000;\n 2223 |       band->qParam = (bitData >> 19) & 0xFF;\n 2224 |       band->qStepBase = 0;\n 2225 |       band->qStepMult = 0;\n 2226 |     }\n 2227 |     else\n 2228 |     {\n 2229 |       // new header\n 2230 |       if (LibRaw::sgetn(2, *subbandMdatPtr + 8) & 0xFFF)\n 2231 |         // partial and qParam are not supported\n 2232 |         return -1;\n 2233 |       if (LibRaw::sgetn(2, *subbandMdatPtr + 18))\n 2234 |         // new header terninated by 2 zero bytes\n 2235 |         return -1;\n 2236 |       band->supportsPartial = false;\n 2237 |       band->qParam = 0;\n 2238 |       band->dataSize = subbandSize - LibRaw::sgetn(2, *subbandMdatPtr + 16);\n 2239 |       band->qStepBase = LibRaw::sgetn(4, *subbandMdatPtr + 12);\n 2240 |       ;\n 2241 |       band->qStepMult = LibRaw::sgetn(2, *subbandMdatPtr + 10);\n 2242 |       ;\n 2243 |     }","lines":24,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/crx.cpp#L2220-L2243"},{"ref":"src/decoders/crx.cpp:217-224","code":"  217 |       bitStrm->curBufSize = bitStrm->input->read(bitStrm->mdatBuf, 1, _min(bitStrm->mdatSize, CRX_BUF_SIZE));\n  218 | #ifndef LIBRAW_USE_OPENMP\n  219 |       bitStrm->input->unlock();\n  220 | #endif\n  221 |     }\n  222 |     if (bitStrm->curBufSize < 1) // nothing read\n  223 |       throw LIBRAW_EXCEPTION_IO_EOF;\n  224 |     bitStrm->mdatSize -= bitStrm->curBufSize;","lines":8,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/crx.cpp#L217-L224"}]},
{"id":"OVF_24","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"packed_tiled_dng_load_raw decodes bit-packed pixels into 'pixel' sized tile_width*ntiles*tiff_samples, but the inner loop fills tile_width*tiff_samples entries and adobe_copy_pixel reads tile_width columns; tiff_samples and tile_width come from the file. ntiles is derived as 1 + raw_width/tile_width with only a loose ' ntiles*tile_width > raw_width*2 ' guard, and tiff_samples is not bounded here, so a crafted tile_width/tiff_samples can make the pixel vector too small for the getbits loop writing pixel[col] up to tile_width*tiff_samples.","fix":"Validate tiff_samples (e.g. <=4) and ensure pixel.size() >= tile_width*tiff_samples explicitly before the decode loop.","locations":[{"ref":"src/decoders/decoders_libraw_dcrdefs.cpp:36-66","code":"   36 |     int ntiles = 1 + (raw_width) / tile_width;\n   37 |     if ((unsigned)ntiles * tile_width > raw_width * 2u) throw LIBRAW_EXCEPTION_ALLOC;\n   38 |     pixel.resize(tile_width * ntiles * tiff_samples);\n   39 |   }\n   40 |   catch (...)\n   41 |   {\n   42 |     throw LIBRAW_EXCEPTION_ALLOC; // rethrow\n   43 |   }\n   44 |   try\n   45 |   {\n   46 |       unsigned trow = 0, tcol = 0;\n   47 |       INT64 save;\n   48 |       while (trow < raw_height)\n   49 |       {\n   50 |         checkCancel();\n   51 |         save = ftell(ifp);\n   52 |         if (tile_length < INT_MAX)\n   53 |           fseek(ifp, get4(), SEEK_SET);\n   54 | \n   55 |         for (row = 0; row < tile_length && (row + trow) < raw_height; row++)\n   56 |         {\n   57 |           if (tiff_bps == 16)\n   58 |             read_shorts(pixel.data(), tile_width * tiff_samples);\n   59 |           else\n   60 |           {\n   61 |             getbits(-1);\n   62 |             for (col = 0; col < tile_width * tiff_samples; col++)\n   63 |               pixel[col] = getbits(tiff_bps);\n   64 |           }\n   65 |           for (rp = pixel.data(), col = 0; col < tile_width; col++)\n   66 |             adobe_copy_pixel(trow+row, tcol+col, &rp);","lines":31,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/decoders_libraw_dcrdefs.cpp#L36-L66"}]},
{"id":"OVF_25","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"nikon_coolscan_load_raw computes 'int bufsize = width * clrs * bypp' as a 32-bit int from untrusted width; for large width this can overflow to a negative/small value. calloc(bufsize,1) then allocates a small (or, if negative-promoted, huge) buffer while the per-row loops iterate col<width writing ip[col]/rp[col] and reading buf[col*3+2], overrunning the buffer. The 'fread(...) < bufsize' comparison also mixes size_t and int.","fix":"Use size_t for bufsize, validate width against raw_width and a sane max, and check calloc != NULL.","locations":[{"ref":"src/decoders/decoders_libraw_dcrdefs.cpp:133-147","code":"  133 |   int bypp = tiff_bps <= 8 ? 1 : 2;\n  134 |   int bufsize = width * clrs * bypp;\n  135 |   unsigned char *buf = (unsigned char *)calloc(bufsize,1);\n  136 |   unsigned short *ubuf = (unsigned short *)buf;\n  137 | \n  138 |   if (tiff_bps <= 8)\n  139 |     gamma_curve(1.0 / imgdata.rawparams.coolscan_nef_gamma, 0., 1, 255);\n  140 |   else\n  141 |     gamma_curve(1.0 / imgdata.rawparams.coolscan_nef_gamma, 0., 1, 65535);\n  142 |   fseek(ifp, data_offset, SEEK_SET);\n  143 |   for (int row = 0; row < raw_height; row++)\n  144 |   {\n  145 | \t  if (tiff_bps <= 8)\n  146 | \t  {\n  147 | \t\t  if (fread(buf, 1, bufsize, ifp) < bufsize)","lines":15,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/decoders_libraw_dcrdefs.cpp#L133-L147"}]},
{"id":"OVF_26","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"parse_dht reads length = get_u16() - 2u into a uint16_t. If the marker's declared length field is 0 or 1, the subtraction wraps to 0xFFFE/0xFFFF and the while(length>0) loop proceeds, consuming far more bytes than the segment contains (driven by attacker-controlled bits[] counts). Combined with get_u8 on an exhausted ByteStream this drives over-reads / corrupt-table errors instead of a clean reject.","fix":"Validate the raw 16-bit length is >= 2 before subtracting, and ensure remaining buffer >= length.","locations":[{"ref":"src/decompressors/losslessjpeg.cpp:147-149","code":"  147 |   uint16_t length = buffer.get_u16() - 2u;\n  148 | \n  149 |   while (length > 0)","lines":3,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decompressors/losslessjpeg.cpp#L147-L149"}]},
{"id":"OVF_27","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"AAHD allocation count computed with int arithmetic. calloc(nr_height * nr_width, sizeof(ushort3)*2 + sizeof(int3)*2 + 3) at line 133: nr_height * nr_width is an int multiplication that can overflow to a small/negative value for very large images. calloc would then allocate an undersized buffer; the NULL check at line 135 does not catch the wrong (non-NULL) size, and the pointer slicing at lines 138-143 plus every nr_offset() access then runs out of bounds. nr_offset() also computes row*nr_width+col as int (lines 79-82).","fix":"Compute the element count as size_t ((size_t)nr_height * nr_width) and validate dimensions before allocation.","locations":[{"ref":"src/demosaic/aahd_demosaic.cpp:133-143","code":"  133 |   rgb_ahd[0] = (ushort3 *)calloc(nr_height * nr_width,\n  134 |                                  (sizeof(ushort3) * 2 + sizeof(int3) * 2 + 3));\n  135 |   if (!rgb_ahd[0])\n  136 |     throw LIBRAW_EXCEPTION_ALLOC;\n  137 | \n  138 |   rgb_ahd[1] = rgb_ahd[0] + nr_height * nr_width;\n  139 |   yuv[0] = (int3 *)(rgb_ahd[1] + nr_height * nr_width);\n  140 |   yuv[1] = yuv[0] + nr_height * nr_width;\n  141 |   ndir = (char *)(yuv[1] + nr_height * nr_width);\n  142 |   homo[0] = ndir + nr_height * nr_width;\n  143 |   homo[1] = homo[0] + nr_height * nr_width;","lines":11,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/demosaic/aahd_demosaic.cpp#L133-L143"},{"ref":"src/demosaic/aahd_demosaic.cpp:79-82","code":"   79 |   inline int nr_offset(int row, int col) throw()\n   80 |   {\n   81 |     return (row * nr_width + col);\n   82 |   }","lines":4,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/demosaic/aahd_demosaic.cpp#L79-L82"}]},
{"id":"OVF_28","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"LibRaw_buffer_datastream::read() return-value computation is wrong and over-reports on short reads. After clamping to_read to the bytes available, it returns `(to_read + sz - 1) / sz`. When fewer than nmemb full elements are available it rounds UP, so a partial final element is reported as a full element read. E.g. requesting nmemb=2 of sz=100 with only 150 bytes left returns 2 instead of 1, telling the caller two full elements were read when the second is incomplete. Many callers (read_shorts via fread-style semantics, etc.) treat the count as whole elements; over-reporting masks EOF/truncation and can cause use of uninitialised tail bytes.","fix":"Return the number of *complete* elements: `return int(to_read / (sz > 0 ? sz : 1));` (floor, matching fread semantics).","locations":[{"ref":"src/libraw_datastream.cpp:332-342","code":"  332 | int LibRaw_buffer_datastream::read(void *ptr, size_t sz, size_t nmemb)\n  333 | {\n  334 |   size_t to_read = sz * nmemb;\n  335 |   if (to_read > streamsize - streampos)\n  336 |     to_read = streamsize - streampos;\n  337 |   if (to_read < 1)\n  338 |     return 0;\n  339 |   memmove(ptr, buf + streampos, to_read);\n  340 |   streampos += to_read;\n  341 |   return int((to_read + sz - 1) / (sz > 0 ? sz : 1));\n  342 | }","lines":11,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/libraw_datastream.cpp#L332-L342"}]},
{"id":"OVF_29","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"parseCR3_CTMD(): szItem/lTag arithmetic on attacker data. szItem is `get4()` (unsigned). The check `if (szItem < 1 || ((relpos_inDir + szItem) > track.MediaSize))` can wrap: relpos_inDir + szItem is 32-bit unsigned and can overflow, passing the check while relpos_inDir += szItem then advances by a bogus amount. Similarly `relpos_inBox + 8 < relpos_inDir + szItem` and `relpos_inBox + lTag` use 32-bit unsigned additions that may wrap. MediaSize itself comes from sample_size (file-controlled). Although fseek/ifp->size() guards limit reads, the loop control can be corrupted (potential excessive iteration or skipped bounds).","fix":"Perform all offset/size additions in 64-bit (UINT64) and validate each against MediaSize and ifp->size() without wrap.","locations":[{"ref":"src/metadata/cr3_parser.cpp:261-294","code":"  261 |   while (relpos_inDir + 6 < track.MediaSize)\n  262 |   {\n  263 |     if (track.MediaOffset + relpos_inDir > ifp->size() - 6) // need at least 6 bytes\n  264 |     {\n  265 |         err = -11;\n  266 |         goto ctmd_fin;\n  267 |     }\n  268 |     fseek(ifp, track.MediaOffset + relpos_inDir, SEEK_SET);\n  269 |     szItem = get4();\n  270 |     tItem = get2();\n  271 |     if (szItem < 1 || (  (relpos_inDir + szItem) > track.MediaSize))\n  272 |     {\n  273 |       err = -11;\n  274 |       goto ctmd_fin;\n  275 |     }\n  276 |     if ((tItem == 7) || (tItem == 8) || (tItem == 9))\n  277 |     {\n  278 |       relpos_inBox = relpos_inDir + 12L;\n  279 |       while (relpos_inBox + 8 < relpos_inDir + szItem)\n  280 |       {\n  281 |         if (track.MediaOffset + relpos_inBox > ifp->size() - 8) // need at least 8 bytes\n  282 |         {\n  283 |             err = -11;\n  284 |             goto ctmd_fin;\n  285 |         }\n  286 |         fseek(ifp, track.MediaOffset + relpos_inBox, SEEK_SET);\n  287 |         lTag = get4();\n  288 |         Tag = get4();\n  289 |         if (lTag < 8)\n  290 |         {\n  291 |           err = -12;\n  292 |           goto ctmd_fin;\n  293 |         }\n  294 |         else if ((relpos_inBox + lTag) > (relpos_inDir + szItem))","lines":34,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/cr3_parser.cpp#L261-L294"}]},
{"id":"OVF_30","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"parseCR3 co64: chunk_offsets allocated with `entries` slots and filled in a loop; `current_track.chunk_count` is set to entries, then immediately overwritten with the loop variable i (== entries) - harmless but redundant. More importantly MediaOffset is set from chunk_offsets[0] without verifying entries>=1 separately at use; the entries<1 check exists so OK, but selectCRXFrame later iterates chunk_count chunks each indexing stsc_data[stsc_index] (see other findings). Flagging the dead reassignment `current_track.chunk_count = i;`.","fix":"Remove the redundant `current_track.chunk_count = i;` reassignment (keep the earlier `= entries`).","locations":[{"ref":"src/metadata/cr3_parser.cpp:883-888","code":"  883 |         current_track.chunk_count = entries;\n  884 |         for (i = 0; i < entries; i++)\n  885 |           current_track.chunk_offsets[i] = (((int64_t)get4()) << 32) | get4();\n  886 | \n  887 |         current_track.chunk_count = i;\n  888 |         current_track.MediaOffset =  current_track.chunk_offsets[0];","lines":6,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/cr3_parser.cpp#L883-L888"}]},
{"id":"OVF_31","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"In parseHassyModel, ps = strchr(model, '-') can point at model[0] or model[1] when the (attacker-controlled) model string begins with '-' or 'X-'. The subsequent strncmp(ps-2, \"II-\", 3) then reads 1-2 bytes before the start of the model[] buffer (out-of-bounds read).","fix":"Only test ps-2 when (ps - model) >= 2, e.g. if ((ps - model) >= 2 && !strncmp(ps-2, \"II-\", 3)) ps -= 2;","locations":[{"ref":"src/metadata/hasselblad_model.cpp:197-203","code":"  197 |     ps = strchr(model, '-');\n  198 |     if (ps) {                  // check if model contains both host body and sensor version, resolution, MS info\n  199 |       strncpy(imHassy.SensorUnit, model,63);\n  200 |       memcpy(imHassy.HostBody, model, ps-model);\n  201 |       imHassy.HostBody[ps-model] = 0;\n  202 |       if (!strncmp(ps-2, \"II-\", 3))\n  203 |         ps -=2;","lines":7,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/hasselblad_model.cpp#L197-L203"}]},
{"id":"OVF_32","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"Nikon processNikonLensData: for len in {459,590,509,879} it does memcpy(ilm.Lens, LensData + off, 64) with off in {390,391,680}. LensData_buf is calloc(LensData_len+1,1) so for len==459 reading LensData[390..453] is in range; len==590 off 390 (ok); len==509 off 391 ->454 (ok); len==879 off 680 ->743 (ok). These are internally consistent. But the len==58/108 path reads LensData[0x2c],[0x32],[0x34],[0x38] (max 0x39=57) only after confirming i==17, and the generic small-len path indexes LensData[i..i+7]; for len==16 case i=8 so i+7=15 (ok), len==15 i=7 ->14 (ok), len==9 i=2 ->9 which is LensData[9] but buffer is calloc(9+1)=10 bytes so index 9 is the last valid byte (ok). Reviewed: bounds hold because LensData_len is set from a fixed switch matching each layout. Documented for traceability; a future edit changing LensData_len mapping without updating offsets would overflow.","fix":"No fix needed now; consider adding explicit length asserts tying each offset block to its required LensData_len.","locations":[{"ref":"src/metadata/nikon.cpp:168-216","code":"  168 |     imgdata.lens.nikon.LensIDNumber = LensData[i];\n  169 |     imgdata.lens.nikon.LensFStops = LensData[i + 1];\n  170 |     ilm.LensFStops = (float)imgdata.lens.nikon.LensFStops / 12.0f;\n  171 |     if (fabsf(ilm.MinFocal) < 1.1f)\n  172 |     {\n  173 |       if ((imgdata.lens.nikon.LensType ^ (uchar)0x01) || LensData[i + 2])\n  174 |         ilm.MinFocal =\n  175 |             5.0f * libraw_powf64l(2.0f, (float)LensData[i + 2] / 24.0f);\n  176 |       if ((imgdata.lens.nikon.LensType ^ (uchar)0x01) || LensData[i + 3])\n  177 |         ilm.MaxFocal =\n  178 |             5.0f * libraw_powf64l(2.0f, (float)LensData[i + 3] / 24.0f);\n  179 |       if ((imgdata.lens.nikon.LensType ^ (uchar)0x01) || LensData[i + 4])\n  180 |         ilm.MaxAp4MinFocal =\n  181 |             libraw {"id":"OVF_33","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"process_Sony_0x2010 AspectRatio: `int s = (int)SonySubstitution[buf[ar_offset]];` guarded by `ar_offset != 0 && ar_offset < len`. ar_offset is a fixed per-model value (e.g. 0x1a88). buf is calloc(len,1). The check ar_offset < len is correct for the single byte read. However real_iso_offset/MeteringMode_offset/ExposureProgram_offset/ReleaseMode2_offset reads use mixed guards: real_iso uses `len >= offset+2` (correct for 2-byte read), but MeteringMode/ExposureProgram use `len > offset` (1-byte read, correct), ReleaseMode2 uses `len > offset` (correct). Consistent and bounded. Documented as reviewed-OK; included because the offsets come from a per-camera table indexed by attacker-controlled ModelID and a mismatched table entry could push offset near len, but the explicit < len / +2 checks prevent OOB.","fix":"No change required; offsets are validated against len before each read.","locations":[{"ref":"src/metadata/sony.cpp:687-729","code":"  687 | \tif (ar_offset != 0 && ar_offset<len) {\n  688 | \t\tint s = (int)SonySubstitution[buf[ar_offset]];\n  689 | \t\tif (s == 0) {\n  690 | \t\t\timSony.AspectRatio = LIBRAW_IMAGE_ASPECT_16to9;\n  691 | \t\t} else if (s == 1) {\n  692 | \t\timSony.AspectRatio = LIBRAW_IMAGE_ASPECT_4to3;\n  693 | \t\t}\telse if (s == 2) {\n  694 | \t\timSony.AspectRatio = LIBRAW_IMAGE_ASPECT_3to2;\n  695 | \t\t} else if (s == 3) {\n  696 | \t\timSony.AspectRatio = LIBRAW_IMAGE_ASPECT_1to1;\n  697 | \t\t} else {\n  698 | \t\t\timSony.AspectRatio = (float)s;\n  699 | \t\t}\n  700 | \t}\n  701 | \n  702 |   if ((imSony.real_iso_offset != 0xffff) &&\n  703 |       (len >= (imSony.real_iso_offset + 2)) && (imCommon.real_ISO < 0.1f))\n  704 |   {\n  705 |     uchar s[2];\n  706 |     s[0] = SonySubstitution[buf[imSony.real_iso_offset]];\n  707 |     s[1] = SonySubstitution[buf[imSony.real_iso_offset + 1]];\n  708 |     i {"id":"OVF_34","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"Sony 0x9050 9050a Sony_E InternalBodySerial: reads buf[0x7c..0x7f] guarded by `len <= 0x7f` return (so len>=0x80, indices 0x7c..0x7f valid). Minolta_A path reads buf[0xf0..0xf4] guarded by `len <= 0xf4` (len>=0xf5, ok). The CurAp/LensMount/LensFormat block reads buf[0x3c],[0x3d],[0x105],[0x106] guarded by `len <= 0x106` return. parseSonyLensType2 path reads buf[0x107],[0x108] guarded by `len <= 0x108`. LensFeatures reads buf[0x115..0x117] guarded by `len <= 0x116`/`len <= 0x117`. All bounded. However the 9050b/9050c InternalBodySerial uses start_InternalBodySerial=0x88 (+2 for ILCE_1) and reads +5; guard is `len <= start+5` return - correct. Reviewed-OK overall, but note ImageCount3 read at line 913-918 uses `len >= ImageCount3_offset + 4` while ImageCount3_offset is a 16-bit value from a model table; if offset==0xffff the +4 overflows ushort arithmetic in the comparison context - mitigated because offset==0xffff is the sentinel checked first.","fix":"No fix strictly required; for clarity compute the comparison in unsigned int to avoid any 16-bit overflow ambiguity in `(imSony.ImageCount3_offset + 4)`.","locations":[{"ref":"src/metadata/sony.cpp:916-921","code":"  916 |   if ((imSony.ImageCount3_offset != 0xffff) &&\n  917 |       (len >= (imSony.ImageCount3_offset + 4)))\n  918 |   {\n  919 |     FORC4 s[c] = SonySubstitution[buf[imSony.ImageCount3_offset + c]];\n  920 |     imSony.ImageCount3 = sget4(s);\n  921 |   }","lines":6,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/sony.cpp#L916-L921"}]},
{"id":"OVF_35","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"process_Sony_0x940e: when CameraType is ILCA, nAFPointsUsed is set to MIN(10, sizeof imSony.AFPointsUsed) and then `FORC(nAFPointsUsed) AFPointsUsed[c] = SonySubstitution[buf[0x10 + c]]` reads buf[0x10..0x19]. This is guarded by `len >= 0x0051`, so in range. But the non-ILCA branch reads buf[0x016e + c] for c in 0..3 (up to buf[0x171]) guarded by len >= 0x017e (OK). The earlier unconditional `imSony.AFType = SonySubstitution[buf[0x02]]` (line 1109) is only guarded by the top-level `len < 3` check (len>=3 => buf[0x02] valid). Confirmed safe, but the AFInfoData copy at lines 1117-1119 uses malloc(len) (not calloc) and copies len bytes from buf - buf is exactly len bytes, OK. Documented: malloc (not calloc) leaves AFInfoData non-zero-terminated unlike sibling code paths that calloc(len+1).","fix":"For consistency and to avoid consumers reading an unterminated buffer, allocate calloc(len+1,1) like the other afdata paths.","locations":[{"ref":"src/metadata/sony.cpp:1120-1123","code":" 1120 |     imCommon.afdata[imCommon.afcount].AFInfoData = (uchar *)malloc(imCommon.afdata[imCommon.afcount].AFInfoData_length);\n 1121 |     FORC((int)imCommon.afdata[imCommon.afcount].AFInfoData_length)\n 1122 |       imCommon.afdata[imCommon.afcount].AFInfoData[c] = SonySubstitution[buf[c]];\n 1123 |     imCommon.afcount++;","lines":4,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/sony.cpp#L1120-L1123"}]},
