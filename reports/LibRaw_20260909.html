{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In DecodeC8 (pana8), `bool _extrahuff = (extrahuff.size() >= 0x10000);` and `gammatable` selection use >= comparisons that are fine, but the dead `#ifdef PANA8_FULLY_BUFFERED` branch references `source` which is not a member of the class/function scope; that code path would not compile if the macro were defined. It is effectively dead/unmaintained code carrying a latent build break.","fix":"Remove the PANA8_FULLY_BUFFERED dead branch or fix it to reference a valid buffer; keep only the bufio path.","locations":[{"ref":"src/decoders/pana8.cpp:198-203","code":"  198 | #ifdef PANA8_FULLY_BUFFERED\n  199 |   const uint8_t\t*inputbyteptr = source.data();\n  200 |   uint32_t\tjobsz_in_qwords = source.size() >> 3;\n  201 | #else\n  202 |   uint32_t jobsz_in_qwords = bufio.size() >> 3;\n  203 | #endif","lines":6,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/pana8.cpp#L198-L203"}]},
{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"smal_decode_segment indexes hist[s][bin+5] in the search loop 'for (bin=0; hist[s][bin+5] > count; bin++)'. hist[s] has 13 entries; termination relies on a trailing 0 entry (index 12 for s=0/1, index 8 for s=2) being <= count. If count becomes negative (count is derived from file-driven data/range/high via signed integer division and can be < 0), no hist entry satisfies '<= count' and bin increments until bin+5 reads past hist[s] (stack OOB read), and the later hist[s][i+5] updates then write OOB.","fix":"Clamp count to >= 0 (or bound bin to < 8) before/within the search loop and validate high>>4 != 0 to avoid the division producing an out-of-range count.","locations":[{"ref":"src/decoders/smal.cpp:58-64","code":"   58 |       count = ((((data - range + 1) & 0xffff) << 2) - 1) / (high >> 4);\n   59 |       for (bin = 0; hist[s][bin + 5] > count; bin++)\n   60 |         ;\n   61 |       low = hist[s][bin + 5] * (high >> 4) >> 2;\n   62 |       if (bin)\n   63 |         high = hist[s][bin + 4] * (high >> 4) >> 2;\n   64 |       high -= low;","lines":7,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/smal.cpp#L58-L64"},{"ref":"src/decoders/smal.cpp:76-83","code":"   76 |       if (hist[s][hist[s][1] + 4] - hist[s][hist[s][1] + 5] > 1)\n   77 |       {\n   78 |         if (bin < hist[s][1])\n   79 |           for (i = bin; i < hist[s][1]; i++)\n   80 |             hist[s][i + 5]--;\n   81 |         else if (next <= bin)\n   82 |           for (i = hist[s][1]; i < bin; i++)\n   83 |             hist[s][i + 5]++;","lines":8,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/smal.cpp#L76-L83"}]},
{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In sony_ycbcr_load_raw(), the per-tile compressed-length check `toffsets[i]+tlengths[i] > fsize` adds an INT64 offset and an unsigned length; tlengths[i] comes directly from get4() (untrusted). If toffsets[i] is near INT64_MAX-ish from a crafted file the sum is still INT64 so wrap is unlikely, but there is no lower-bound/sanity check that toffsets[i] >= 0 or that tlengths[i] is non-zero, and toffsets are read with get4() (max ~4G) so practically bounded. Minor: a zero-length tile leads to a 0-byte read and decoder failure rather than a clean message.","fix":"Also validate toffsets[i] >= UD.data_offset (or >=0) and tlengths[i] > 0 before use; reject otherwise.","locations":[{"ref":"src/decoders/sonycc.cpp:255-265","code":"  255 |   for (int i = 0; i < tiles; i++)\n  256 | \t  toffsets[i] = get4();\n  257 | \n  258 |   std::vector<unsigned> tlengths(tiles);\n  259 |   ifp->seek(UD.data_size, SEEK_SET);\n  260 |   for (int i = 0; i < tiles; i++)\n  261 |   {\n  262 | \t  tlengths[i] = get4();\n  263 | \t  if(toffsets[i]+tlengths[i] > fsize)\n  264 |         throw LIBRAW_EXCEPTION_IO_CORRUPT;\n  265 |   }","lines":11,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/sonycc.cpp#L255-L265"}]},
{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In parse_ciff type 0x080a, after fread(make,64,1) and make[63]=0 it does fseek(ifp, strbuflen(make)-63, SEEK_CUR). strbuflen(make) <= 63 so the seek offset is <= 0, i.e. it seeks backward (or not at all) before reading model. This effectively reads 'model' from inside the 'make' field rather than the byte following the 64-byte make region, likely a logic bug in field positioning.","fix":"Recompute the intended offset; if make/model are adjacent fixed 64-byte fields, drop the fseek and read model directly, or seek by the actual consumed length.","locations":[{"ref":"src/metadata/ciff.cpp:123-129","code":"  123 |     else if (type == 0x080a)\n  124 |     {\n  125 |       fread(make, 64, 1, ifp);\n  126 |       make[63] = 0;\n  127 |       fseek(ifp, strbuflen(make) - 63, SEEK_CUR);\n  128 |       fread(model, 64, 1, ifp);\n  129 |       model[63] = 0;","lines":7,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/ciff.cpp#L123-L129"}]},
{"id":"LOGIC_33","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"parseFujiMakernotes() serial parsing (tag 0x0010): ystr[16] is not zero-initialized before the hex-decode loop \"for (j=...) ystr[j/2]=c\". Only even indices are written and then ystr[ynum_len+1]=0 terminates, but if the loop terminates early (sscanf fails) intermediate ystr bytes between the last written index and ynum_len+1 remain uninitialized, and that buffer is then strcpy'd into model2 and embedded via snprintf. Bounded (all indices < 16) but produces nondeterministic output bytes.","fix":"Zero-initialize ystr (char ystr[16] = {0};) before the decode loop.","locations":[{"ref":"src/metadata/fuji.cpp:947-952","code":"  947 |         for (int j = 0; ynum[j] && ynum[j + 1] && sscanf(ynum + j, \"%2x\", &c);\n  948 |              j += 2)\n  949 |           ystr[j / 2] = c;\n  950 |         ynum_len /= 2;\n  951 |         ystr[ynum_len + 1] = 0;\n  952 |         strcpy(model2, ystr);","lines":6,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/fuji.cpp#L947-L952"}]},
{"id":"LOGIC_34","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"remove_caseSubstr() has a dead/contradictory NULL check: the while condition already requires `(found = strcasestr(...))` to be non-NULL, so the immediately-following `if (!found) return;` is dead code. Harmless but misleading.","fix":"Remove the redundant `if (!found) return;` line.","locations":[{"ref":"src/metadata/identify_tools.cpp:118-119","code":"  118 |   while ((found = strcasestr(string,subStr))) {\n  119 |     if (!found) return;","lines":2,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/identify_tools.cpp#L118-L119"}]},
{"id":"LOGIC_35","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In parse_kodak_ifd tag 0x03fc handler, the test '(wbi >= 0) && (wbi < 6) && (wbi != -2)' includes the always-true clause (wbi != -2) since wbi is already constrained to 0..5; this is dead/copy-paste logic that suggests the intended sentinel handling for wbi==-2 is missing or mis-placed.","fix":"Remove the redundant (wbi != -2) clause or implement the intended -2 sentinel semantics explicitly.","locations":[{"ref":"src/metadata/kodak.cpp:228-233","code":"  228 |     else if (tag == 0x03fc) // 1020\n  229 |     {\n  230 |       wbi = getint(type);\n  231 |       if ((wbi >= 0) && (wbi < 6) && (wbi != -2))\n  232 |         wbi = wbtag_dcr[wbi];\n  233 |     }","lines":6,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/kodak.cpp#L228-L233"}]},
{"id":"LOGIC_36","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In parse_mos, recursion 'parse_mos(from)' is called unconditionally on every PKTS chunk before seeking to skip+from. The CR3_Version counter is decremented at function entry and only restored once at the end of the outer call, so deeply nested/self-referential chunk layouts are bounded only by that counter; however the unconditional recursion on each record can still produce O(records^depth) re-parsing of the same regions (performance) on crafted files.","fix":"Only recurse into known container chunk types, and pass/track remaining depth budget into the recursion instead of relying solely on the shared CR3_Version counter.","locations":[{"ref":"src/metadata/mediumformat.cpp:407-409","code":"  407 |   libraw_internal_data.unpacker_data.CR3_Version--;\n  408 |   if (libraw_internal_data.unpacker_data.CR3_Version < 1)\n  409 | \t  throw LIBRAW_EXCEPTION_IO_CORRUPT;","lines":3,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/mediumformat.cpp#L407-L409"},{"ref":"src/metadata/mediumformat.cpp:542-543","code":"  542 |     parse_mos(from);\n  543 |     fseek(ifp, skip + from, SEEK_SET);","lines":2,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/mediumformat.cpp#L542-L543"}]},
{"id":"LOGIC_37","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"normalize_model.cpp Fujifilm alias loop: when fujialias[i] is a non-'@' alias that matches model, it does strcpy(normalized_model, orig). But orig is only updated inside the fujialias loop indirectly - it is the static const char* shared across all maker blocks and is set to fujialias[i]+1 only when a '@' entry is seen. The first table entry \"@DBP for GX680\" sets orig, so a match on the very first data alias works, but the loop relies on orig having been set by the immediately preceding '@' header in the same table; this is correct only because every group starts with '@'. It is a fragile pattern (a leading non-@ entry would copy a stale orig from a previous maker's table). Same shared-orig pattern repeats for nikon/oly/pana/leaf/phase1/samsung/KonicaMinolta alias loops.","fix":"Make orig a local variable per alias loop (or assert the first table entry is always a '@' header) to avoid cross-table stale-pointer copies.","locations":[{"ref":"src/metadata/normalize_model.cpp:406-416","code":"  406 |   static const char *orig;\n  407 | \n  408 |   static const char fujialias[][16] = {\n  409 |     \"@DBP for GX680\", \"DX-2000\",\n  410 |     \"@F500EXR\", \"F505EXR\",\n  411 |     \"@F600EXR\", \"F605EXR\",\n  412 |     \"@F770EXR\", \"F775EXR\",\n  413 |     \"@HS10\", \"HS10 HS11\",\n  414 |     \"@HS20EXR\", \"HS22EXR\",\n  415 |     \"@HS30EXR\", \"HS33EXR\", \"HS35EXR\",\n  416 |     \"@S5100\", \"S5500\",","lines":11,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/normalize_model.cpp#L406-L416"},{"ref":"src/metadata/normalize_model.cpp:802-816","code":"  802 |   else if (makeIs(LIBRAW_CAMERAMAKER_Fujifilm))\n  803 |   {\n  804 |     for (i = 0; i < int(sizeof fujialias / sizeof *fujialias); i++)\n  805 |     {\n  806 |       if (fujialias[i][0] == '@')\n  807 |       {\n  808 |         orig = fujialias[i] + 1;\n  809 |         if (!strcmp(model, orig)) break;\n  810 |       }\n  811 |       else if (!strcmp(model, fujialias[i]))\n  812 |       {\n  813 |         strcpy(normalized_model, orig);\n  814 |         break;\n  815 |       }\n  816 |     }","lines":15,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/normalize_model.cpp#L802-L816"}]},
{"id":"LOGIC_38","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"parseRicohMakernotes() tag 0x0005 fallback: sprintf(BodySerial, \"%02x%02x%02x%02x\", buffer[4], buffer[5], buffer[6], buffer[7]) passes plain char values (buffer is char[17], char is signed on most platforms) to a %02x conversion that expects unsigned int. A byte >= 0x80 is sign-extended to e.g. 0xffffff80 and printed as 8 hex digits (\"ffffff80\") instead of 2, yielding wrong serials. Worst case 4*8+1 = 33 bytes still fits BodySerial[64]/InternalBodySerial[64], so no overflow, but the output is corrupt for any high-bit byte.","fix":"Cast each byte to unsigned char before printing: sprintf(..., (unsigned char)buffer[4], ...) or read buffer as unsigned char[].","locations":[{"ref":"src/metadata/pentax.cpp:560-563","code":"  560 |       sprintf(imgdata.shootinginfo.BodySerial, \"%02x%02x%02x%02x\", buffer[4],\n  561 |               buffer[5], buffer[6], buffer[7]);\n  562 |       sprintf(imgdata.shootinginfo.InternalBodySerial, \"%02x%02x%02x%02x\",\n  563 |               buffer[8], buffer[9], buffer[10], buffer[11]);","lines":4,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/pentax.cpp#L560-L563"}]},
{"id":"LOGIC_39","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"Copy-paste defect in Sony CameraInfo (len==5478) lens aperture parsing: `if (table_buf[4]) ilm.MaxAp4MaxFocal = bcd2dec(table_buf[7]) / 10.0f;` guards the MaxAp4MaxFocal assignment on table_buf[4] (the MaxAp4MinFocal byte) instead of on table_buf[7]. So MaxAp4MaxFocal is computed from byte 7 but gated by byte 4, and is skipped when byte 4 is zero even if byte 7 is valid (and computed from byte 7 when byte 4 nonzero regardless of byte 7).","fix":"Guard on table_buf[7]: `if (table_buf[7]) ilm.MaxAp4MaxFocal = bcd2dec(table_buf[7]) / 10.0f;`.","locations":[{"ref":"src/metadata/sony.cpp:1376-1379","code":" 1376 |           if (table_buf[4])\n 1377 |             ilm.MaxAp4MinFocal = bcd2dec(table_buf[4]) / 10.0f;\n 1378 |           if (table_buf[4])\n 1379 |             ilm.MaxAp4MaxFocal = bcd2dec(table_buf[7]) / 10.0f;","lines":4,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/sony.cpp#L1376-L1379"}]},
{"id":"LOGIC_40","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"parse_tiff_ifd 0xc616 (CFAPlaneColor) / guess_cfa_pc: `colors = len;` with len capped to 4, then `fread(cfa_pc, 1, colors, ifp)`. If colors==0 (len==0 reaching this case is prevented for 0xc616 since the path is only entered via this case, but the guess_cfa_pc label is also jumped to from 0xfd09 where plen is set), FORCC over colors==0 leaves cdesc[c] indexing at c==0 fine. The concern: at the label, `filters = filters<<2 | tab[cfa_pat[i%plen]]` uses tab[] indexed by cfa_pat bytes; tab is only initialised for entries written by `tab[cfa_pc[c]]=c` (FORCC). Unwritten tab[] entries are uninitialised stack (uchar tab[256]) and feed into filters. Uninitialised read affecting filters/CFA.","fix":"memset(tab,0,sizeof(tab)) before populating, so unknown CFA indices map deterministically.","locations":[{"ref":"src/metadata/tiff.cpp:1089-1102","code":" 1089 |     case 0xc616: /* 50710, CFAPlaneColor */\n 1090 |       if (filters == 9)\n 1091 |         break;\n 1092 |       if (len > 4)\n 1093 |         len = 4;\n 1094 |       colors = len;\n 1095 |       fread(cfa_pc, 1, colors, ifp);\n 1096 |     guess_cfa_pc:\n 1097 |       FORCC tab[cfa_pc[c]] = c;\n 1098 |       cdesc[c] = 0;\n 1099 |       for (i = 16; i--;)\n 1100 |         filters = filters << 2 | tab[cfa_pat[i % plen]];\n 1101 |       filters -= !filters;\n 1102 |       tiff_ifd[ifd].t_filters = filters;","lines":14,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/tiff.cpp#L1089-L1102"}]},
{"id":"LOGIC_41","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"dcraw_process() Foveon zero-filtering loop and mix_green loop iterate i over S.height*S.width using int and index imgdata.image[i], but for legacy/foveon the image was allocated at S.iheight*S.iwidth which after raw2image_ex equals height*width only when shrink==0. For shrink!=0 cases S.height*S.width > allocation. In practice foveon/mix_green run with shrink==0, but the bound differs from the allocation basis and relies on that invariant implicitly.","fix":"Iterate using S.iheight*S.iwidth (the allocation basis) to match the buffer size.","locations":[{"ref":"src/postprocessing/dcraw_process.cpp:100-105","code":"  100 |         for (int q = 0; q < S.height * S.width; q++)\n  101 |         {\n  102 |           for (int c = 0; c < 4; c++)\n  103 |             if ((short)imgdata.image[q][c] < 0)\n  104 |               imgdata.image[q][c] = 0;\n  105 |         }","lines":6,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/postprocessing/dcraw_process.cpp#L100-L105"},{"ref":"src/postprocessing/dcraw_process.cpp:206-207","code":"  206 |       for (P1.colors = 3, i = 0; i < S.height * S.width; i++)\n  207 |         imgdata.image[i][1] = (imgdata.image[i][1] + imgdata.image[i][3]) >> 1;","lines":2,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/postprocessing/dcraw_process.cpp#L206-L207"}]},
{"id":"LOGIC_42","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"raw2image_ex Fuji-crop path writes into imgdata.image[((r)>>shrink)*alloc_width + ((c)>>shrink)] where r,c are derived from the Fuji layout transform of cropped row/col, but the buffer was sized from t_alloc_width/t_alloc_height (alloc_width/alloc_height) computed from the pre-crop S.width/S.height. r and c are not clamped against alloc_height/alloc_width here (unlike copy_fuji_uncropped which checks r<S.height && c<S.width), so a crafted crop box combined with fuji_layout could index outside the allocation.","fix":"Bound r and c (after shrink) against alloc_height/alloc_width before writing, or validate the crop-derived geometry.","locations":[{"ref":"src/preprocessing/raw2image.cpp:451-484","code":"  451 |           int row, col;\n  452 |           for (row = 0; row < S.height; row++)\n  453 |           {\n  454 |             for (col = 0; col < S.width; col++)\n  455 |             {\n  456 |               int r, c;\n  457 |               if (libraw_internal_data.unpacker_data.fuji_layout)\n  458 |               {\n  459 |                 r = IO.fuji_width - 1 - col + (row >> 1);\n  460 |                 c = col + ((row + 1) >> 1);\n  461 |               }\n  462 |               else\n  463 |               {\n  464 |                 r = IO.fuji_width - 1 + row - (col >> 1);\n  465 |                 c = row + ((col + 1) >> 1);\n  466 |               }\n  467 | \n  468 |               unsigned short val =\n  469 |                   imgdata.rawdata\n  470 |                       .raw_image[(row + S.top_margin) * S.raw_pitch / 2 +\n  471 |                                  (col + S.left_margin)];\n  472 |               int cc = FCF(row, col);\n  473 |               if (val > cblack[cc])\n  474 |               {\n  475 |                 val -= cblack[cc];\n  476 |                 if (dmax < val)\n  477 |                   dmax = val;\n  478 |               }\n  479 |               else\n  480 |                 val = 0;\n  481 |               imgdata.image[((r) >> IO.shrink) * alloc_width +\n  482 |                             ((c) >> IO.shrink)][cc] = val;\n  483 |             }\n  484 |           }","lines":34,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/preprocessing/raw2image.cpp#L451-L484"}]},
{"id":"LOGIC_43","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"open_bayer(): tiff_bps is derived as `(datalen)*8 / (S.raw_width * S.raw_height)`. S.raw_width*S.raw_height is computed in int from two ushorts; for large dimensions (each up to 65535) the product overflows int (max ~4.29e9 > INT_MAX) producing a negative or wrapped divisor and a bogus tiff_bps used to select the loader and to compute C.maximum = (1<<tiff_bps)-(1<<unused_bits). datalen*8 also overflows unsigned for datalen > ~0.5GB.","fix":"Cast to 64-bit before multiplying/dividing and validate the resulting tiff_bps (and unused_bits < tiff_bps) before using it in shifts.","locations":[{"ref":"src/utils/open.cpp:320-321","code":"  320 |   switch (libraw_internal_data.unpacker_data.tiff_bps =\n  321 |               (datalen)*8 / (S.raw_width * S.raw_height))","lines":2,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/utils/open.cpp#L320-L321"},{"ref":"src/utils/open.cpp:354-355","code":"  354 |   C.maximum =\n  355 |       (1 << libraw_internal_data.unpacker_data.tiff_bps) - (1 << unused_bits);","lines":2,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/utils/open.cpp#L354-L355"}]},
{"id":"LOGIC_44","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"open_bayer() case 10: the `case 10:` block has conditional breaks but if neither android branch is taken (datalen/raw_height*3 < raw_width*4 and load_flags bit0 clear) it falls through into `case 12:`, silently treating 10-bit data as 12-bit packed. The fall-through is likely intentional dcraw heritage but is undocumented and easy to misread as a missing break; worth a comment or explicit handling because it changes the decoder and C.maximum.","fix":"Add an explicit /* fall through */ comment, or handle the 10-bit-without-android case explicitly to avoid accidental misclassification.","locations":[{"ref":"src/utils/open.cpp:326-340","code":"  326 |   case 10:\n  327 |     if ((datalen) / S.raw_height * 3u >= S.raw_width * 4u)\n  328 |     {\n  329 |       load_raw = &LibRaw::android_loose_load_raw;\n  330 |       break;\n  331 |     }\n  332 |     else if (libraw_internal_data.unpacker_data.load_flags & 1)\n  333 |     {\n  334 |       load_raw = &LibRaw::android_tight_load_raw;\n  335 |       break;\n  336 |     }\n  337 |   case 12:\n  338 |     libraw_internal_data.unpacker_data.load_flags |= 128;\n  339 |     load_raw = &LibRaw::packed_load_raw;\n  340 |     break;","lines":15,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/utils/open.cpp#L326-L340"}]},
{"id":"LOGIC_45","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"parse_custom_cameras(): `unsigned val = strtol(start, 0, 10);` stores a signed long into unsigned and is applied to fields like fsize/rw/rh/max with no range validation; negative or out-of-range entries silently wrap. `strncpy(table[index].t_make, start, sizeof-1)` does not NUL-terminate if start is exactly that long (the struct is memset to 0 first per row, so the final byte stays 0 only because size-1 is used; acceptable) but t_model/t_make are never explicitly terminated after strncpy for the truncation case. Minor robustness issue in attacker-influenced custom-camera lists.","fix":"Use strtoul with range checks, and explicitly NUL-terminate t_make/t_model after strncpy.","locations":[{"ref":"src/utils/utils_libraw.cpp:108-152","code":"  108 |       unsigned val = strtol(start, 0, 10);\n  109 |       switch (j)\n  110 |       {\n  111 |       case 0:\n  112 |         table[index].fsize = val;\n  113 |         break;\n  114 |       case 1:\n  115 |         table[index].rw = val;\n  116 |         break;\n  117 |       case 2:\n  118 |         table[index].rh = val;\n  119 |         break;\n  120 |       case 3:\n  121 |         table[index].lm = val;\n  122 |         break;\n  123 |       case 4:\n  124 |         table[index].tm = val;\n  125 |         break;\n  126 |       case 5:\n  127 |         table[index].rm = val;\n  128 |         break;\n  129 |       case 6:\n  130 |         table[index].bm = val;\n  131 |         break;\n  132 |       case 7:\n  133 |         table[index].lf = val;\n  134 |         break;\n  135 |       case 8:\n  136 |         table[index].cf = val;\n  137 |         break;\n  138 |       case 9:\n  139 |         table[index].max = val;\n  140 |         break;\n  141 |       case 10:\n  142 |         table[index].flags = val;\n  143 |         break;\n  144 |       case 11:\n  145 |         strncpy(table[index].t_make, start, sizeof(table[index].t_make) - 1);\n  146 |         break;\n  147 |       case 12:\n  148 |         strncpy(table[index].t_model, start, sizeof(table[index].t_model) - 1);\n  149 |         break;\n  150 |       case 13:\n  151 |         table[index].offset = val;\n  152 |         break;","lines":45,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/utils/utils_libraw.cpp#L108-L152"}]},

{"id":"LOGIC_47","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"x3f_delete uses 'if (DS->num_directory_entries > 50) return X3F_ARGUMENT_ERROR;' to bail out, but in that case it leaks the entire x3f object and directory_entry array (returns without freeing). num_directory_entries was already validated <=50 at parse time, so this branch should not normally trigger, but if it does the cleanup is skipped entirely - a guaranteed leak on the error path.","fix":"Remove the early return or free resources before returning; the >50 case should still free DS->directory_entry and x3f.","locations":[{"ref":"src/x3f/x3f_utils_patched.cpp:563-565","code":"  563 |   DS = &x3f->directory_section;\n  564 |   if (DS->num_directory_entries > 50)\n  565 |     return X3F_ARGUMENT_ERROR;","lines":3,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/x3f/x3f_utils_patched.cpp#L563-L565"}]},
{"id":"LOGIC_48","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"simple_decode_row reads 'uint32_t val = data[col]' for col in 0..ID->columns-1, but the bound check earlier only ensures needed = columns*4 bytes fit within row_stride and within data_size at the row offset. It does not verify row_stride*rows <= data_size for the last row beyond the per-row check - the per-row check is correct, but note the data pointer cast 'ID->data + row * row_stride' uses int 'row * row_stride' which can overflow int for large row/row_stride even though the 64-bit 'offset' was validated; the actual pointer arithmetic uses the 32-bit product.","fix":"Use the already-computed 64-bit 'offset' for the pointer: (unsigned char*)ID->data + offset, not 'row * row_stride' in int.","locations":[{"ref":"src/x3f/x3f_utils_patched.cpp:1166-1174","code":" 1166 |   uint64_t needed = uint64_t(ID->columns) * sizeof(uint32_t);\n 1167 |   uint64_t offset = uint64_t(row) * uint64_t(row_stride);\n 1168 | \n 1169 |   if (row_stride < needed)\n 1170 |     throw LIBRAW_EXCEPTION_IO_CORRUPT;\n 1171 |   if (offset > uint64_t(ID->data_size) || needed > uint64_t(ID->data_size) - offset)\n 1172 |     throw LIBRAW_EXCEPTION_IO_CORRUPT;\n 1173 | \n 1174 |   uint32_t *data = (uint32_t *)((unsigned char *)ID->data + row * row_stride);","lines":9,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/x3f/x3f_utils_patched.cpp#L1166-L1174"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"parse_fuji() tag 0x2f00: the WB-correction block writes to icWBC[LIBRAW_WBI_Custom1 + wb_ind] but wb_ind is itself the loop variable already ranging over LIBRAW_WBI_Custom1..LIBRAW_WBI_Custom1+nWBs (i.e. 90..95). So it reads/writes icWBC[180..185] instead of the entries just filled at icWBC[wb_ind]. The correctly-written sibling code in parseAdobeRAFMakernote() (0x2f00 / get_average_WB) uses icWBC[wb_ind][...] without the extra +LIBRAW_WBI_Custom1. Result is corruption of unrelated WB slots and the correction never applied to the intended slot. (No OOB since icWBC is [256][4], but a clear logic/copy-paste bug; only triggers for S2Pro/S20Pro/F700/S5000/S7000/DBP/DX-2000.)","fix":"Drop the LIBRAW_WBI_Custom1 offset: use icWBC[wb_ind][0] and icWBC[wb_ind][2], matching the indexed form used in parseAdobeRAFMakernote().","locations":[{"ref":"src/metadata/fuji.cpp:1304-1313","code":" 1304 |       for (int wb_ind = LIBRAW_WBI_Custom1; wb_ind < LIBRAW_WBI_Custom1+nWBs; wb_ind++) {\n 1305 |         FORC4 icWBC[wb_ind][GRGB_2_RGBG(c)] = get2();\n 1306 |         if ((len >= unsigned(4+16*nWBs)) && average_WBData) {\n 1307 |           FORC4 icWBC[wb_ind][GRGB_2_RGBG(c)] =\n 1308 |                   (icWBC[wb_ind][GRGB_2_RGBG(c)] +get2()) /2;\n 1309 |         }\n 1310 |         if (use_WBcorr_coeffs) {\n 1311 |           icWBC[LIBRAW_WBI_Custom1 + wb_ind][0] = int(icWBC[LIBRAW_WBI_Custom1 + wb_ind][0] * wbR_corr);\n 1312 |           icWBC[LIBRAW_WBI_Custom1 + wb_ind][2] = int(icWBC[LIBRAW_WBI_Custom1 + wb_ind][2] * wbB_corr);\n 1313 |         }","lines":10,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/fuji.cpp#L1304-L1313"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"easy","description":"malloc_omp_buffers may return buffers whose entries are NULL, and AHD uses them unchecked. malloc_omp_buffers (src/utils/utils_libraw.cpp:644-653) calloc's each per-thread buffer without checking the result and never propagates failure. ahd_interpolate stores the returned array (line 306) and immediately casts/derefs buffer (lines 335-347) inside the tile loop with no NULL check, so a failed per-thread allocation yields a NULL-pointer write into rgb/lab/homo.","fix":"Make malloc_omp_buffers check each calloc and signal failure (return NULL / free partial), and have ahd_interpolate verify buffers and each buffer[i] before use, throwing LIBRAW_EXCEPTION_ALLOC otherwise.","locations":[{"ref":"src/demosaic/ahd_demosaic.cpp:306-347","code":"  306 |     char** buffers = malloc_omp_buffers(buffer_count, buffer_size);\n  307 | \n  308 | #ifdef LIBRAW_USE_OPENMP\n  309 | #pragma omp parallel for schedule(dynamic) default(none) shared(terminate_flag) firstprivate(buffers)\n  310 | #endif\n  311 |     for (int top = 2; top < height - 5; top += LIBRAW_AHD_TILE - 6)\n  312 |     {\n  313 | #ifdef LIBRAW_USE_OPENMP\n  314 |         if (0 == omp_get_thread_num())\n  315 | #endif\n  316 |             if (callbacks.progress_cb)\n  317 |             {\n  318 |                 int rr = (*callbacks.progress_cb)(callbacks.progresscb_data,\n  319 |                     LIBRAW_PROGRESS_INTERPOLATE,\n  320 |                     top - 2, height - 7);\n  321 |                 if (rr)\n  322 |                     terminate_flag = 1;\n  323 |             }\n  324 | \n  325 | #if defined(LIBRAW_USE_OPENMP)\n  326 |         char* buffer = buffers[omp_get_thread_num()];\n  327 | #else\n  328 |         char* buffer = buffers[0];\n  329 | #endif\n  330 | \n  331 |         ushort(*rgb)[LIBRAW_AHD_TILE][LIBRAW_AHD_TILE][3];\n  332 |         short(*lab)[LIBRAW_AHD_TILE][LIBRAW_AHD_TILE][3];\n  333 |         char(*homo)[LIBRAW_AHD_TILE][2];\n  334 | \n  335 |         rgb = (ushort(*)[LIBRAW_AHD_TILE][LIBRAW_AHD_TILE][3])buffer;\n  336 |         lab = (short(*)[LIBRAW_AHD_TILE][LIBRAW_AHD_TILE][3])(\n  337 |             buffer + 12 * LIBRAW_AHD_TILE * LIBRAW_AHD_TILE);\n  338 |         homo = (char(*)[LIBRAW_AHD_TILE][2])(buffer + 24 * LIBRAW_AHD_TILE *\n  339 |             LIBRAW_AHD_TILE);\n  340 | \n  341 |         for (int left = 2; !terminate_flag && (left < width - 5);\n  342 |             left += LIBRAW_AHD_TILE - 6)\n  343 |         {\n  344 |             ahd_interpolate_green_h_and_v(top, left, rgb);\n  345 |             ahd_interpolate_r_and_b_and_convert_to_cielab(top, left, rgb, lab);\n  346 |             ahd_interpolate_build_homogeneity_map(top, left, lab, homo);\n  347 |             ahd_interpolate_combine_homogeneous_pixels(top, left, rgb, homo);","lines":42,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/demosaic/ahd_demosaic.cpp#L306-L347"},{"ref":"src/utils/utils_libraw.cpp:644-652","code":"  644 | char** LibRaw::malloc_omp_buffers(int buffer_count, size_t buffer_size)\n  645 | {\n  646 |     char** buffers = (char**)calloc(sizeof(char*), buffer_count);\n  647 | \n  648 |     for (int i = 0; i < buffer_count; i++)\n  649 |     {\n  650 |         buffers[i] = (char*)calloc(buffer_size,1);\n  651 |     }\n  652 |     return buffers;","lines":9,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/utils/utils_libraw.cpp#L644-L652"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"easy","description":"DHT constructor allocations are unchecked for NULL. nraw = malloc(...) (line 220) and ndir = calloc(...) (line 222) are never tested. On a large/crafted image where the allocation fails, the very next loops dereference nraw (lines 224-228 read image[0] then write nraw[i][0..2]) and later ndir, causing a NULL dereference / crash. All other demosaic allocators in this tree either check (AAHD) or should; DHT does not.","fix":"After each allocation, test for NULL; if either fails (free the other) and throw LIBRAW_EXCEPTION_ALLOC.","locations":[{"ref":"src/demosaic/dht_demosaic.cpp:220-228","code":"  220 |   nraw = (float3 *)malloc(nr_height * nr_width * sizeof(float3));\n  221 |   int iwidth = libraw.imgdata.sizes.iwidth;\n  222 |   ndir = (char *)calloc(nr_height * nr_width, 1);\n  223 |   channel_maximum[0] = channel_maximum[1] = channel_maximum[2] = 0;\n  224 |   channel_minimum[0] = libraw.imgdata.image[0][0];\n  225 |   channel_minimum[1] = libraw.imgdata.image[0][1];\n  226 |   channel_minimum[2] = libraw.imgdata.image[0][2];\n  227 |   for (int i = 0; i < nr_height * nr_width; ++i)\n  228 |     nraw[i][0] = nraw[i][1] = nraw[i][2] = 0.5;","lines":9,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/demosaic/dht_demosaic.cpp#L220-L228"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"easy","description":"X-Trans interpolate uses malloc_omp_buffers result without NULL checks. buffers = malloc_omp_buffers(...) at line 175; the per-thread buffer is cast and dereferenced at lines 193-207 (memcpy into rgb) with no validation. Since malloc_omp_buffers does not check its inner calloc, an allocation failure on a large image leads to a NULL write. buffer_size = LIBRAW_AHD_TILE*LIBRAW_AHD_TILE*(ndir*11+6) is large (>~3MB) so failure is plausible under memory pressure.","fix":"Validate buffers and buffers[thread] for NULL before use; throw LIBRAW_EXCEPTION_ALLOC on failure (and fix malloc_omp_buffers to detect allocation failure).","locations":[{"ref":"src/demosaic/xtrans_demosaic.cpp:174-207","code":"  174 |   size_t buffer_size = LIBRAW_AHD_TILE * LIBRAW_AHD_TILE * (ndir * 11 + 6);\n  175 |   char** buffers = malloc_omp_buffers(buffer_count, buffer_size);\n  176 | \n  177 | #if defined(LIBRAW_USE_OPENMP)\n  178 | # pragma omp parallel for schedule(dynamic) default(none) firstprivate(buffers, allhex, passes, sgrow, sgcol, ndir) shared(dir) \n  179 | #endif\n  180 |     for (int top = 3; top < height - 19; top += LIBRAW_AHD_TILE - 16)\n  181 |     {\n  182 | #if defined(LIBRAW_USE_OPENMP)\n  183 |         char* buffer = buffers[omp_get_thread_num()];\n  184 | #else\n  185 |         char* buffer = buffers[0];\n  186 | #endif\n  187 | \n  188 |         ushort(*rgb)[LIBRAW_AHD_TILE][LIBRAW_AHD_TILE][3], (*rix)[3];\n  189 |         short(*lab)[LIBRAW_AHD_TILE][3], (*lix)[3];\n  190 |         float(*drv)[LIBRAW_AHD_TILE][LIBRAW_AHD_TILE];\n  191 |         char(*homo)[LIBRAW_AHD_TILE][LIBRAW_AHD_TILE];\n  192 | \n  193 |         rgb = (ushort(*)[LIBRAW_AHD_TILE][LIBRAW_AHD_TILE][3])buffer;\n  194 |         lab = (short(*)[LIBRAW_AHD_TILE][3])(\n  195 |             buffer + LIBRAW_AHD_TILE * LIBRAW_AHD_TILE * (ndir * 6));\n  196 |         drv = (float(*)[LIBRAW_AHD_TILE][LIBRAW_AHD_TILE])(\n  197 |             buffer + LIBRAW_AHD_TILE * LIBRAW_AHD_TILE * (ndir * 6 + 6));\n  198 |         homo = (char(*)[LIBRAW_AHD_TILE][LIBRAW_AHD_TILE])(\n  199 |             buffer + LIBRAW_AHD_TILE * LIBRAW_AHD_TILE * (ndir * 10 + 6));\n  200 | \n  201 |         for (int left = 3; left < width - 19; left += LIBRAW_AHD_TILE - 16)\n  202 |         {\n  203 |             int mrow = MIN(top + LIBRAW_AHD_TILE, height - 3);\n  204 |             int mcol = MIN(left + LIBRAW_AHD_TILE, width - 3);\n  205 |             for (int row = top; row < mrow; row++)\n  206 |                 for (int col = left; col < mcol; col++)\n  207 |                     memcpy(rgb[0][row - top][col - left], image[row * width + col], 6);","lines":34,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/demosaic/xtrans_demosaic.cpp#L174-L207"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"easy","description":"Multiple Sony/Canon/Nikon code paths call calloc()/malloc() for makernote tables and immediately fread/index them without checking the allocation result for NULL. Examples: parseSonyMakernotes calloc(len,1) for tag tables (0x9050, 0x9400, etc.), process_Sony_0x940e malloc(len) at line 1117, Canon afdata calloc at canon.cpp:886, Nikon ShotInfo_buf calloc at nikon.cpp:694 and LensData_buf calloc at nikon.cpp:827. On allocation failure these dereference a NULL pointer (crash / DoS) on crafted large or fragmented inputs. len is bounded (<256000 in Sony) but allocation can still fail under memory pressure.","fix":"Check each allocation for NULL and bail out (return / skip tag) before fread/indexing, as is done elsewhere in LibRaw via throw LIBRAW_EXCEPTION_ALLOC.","locations":[{"ref":"src/metadata/sony.cpp:1120-1122","code":" 1120 |     imCommon.afdata[imCommon.afcount].AFInfoData = (uchar *)malloc(imCommon.afdata[imCommon.afcount].AFInfoData_length);\n 1121 |     FORC((int)imCommon.afdata[imCommon.afcount].AFInfoData_length)\n 1122 |       imCommon.afdata[imCommon.afcount].AFInfoData[c] = SonySubstitution[buf[c]];","lines":3,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/sony.cpp#L1120-L1122"},{"ref":"src/metadata/canon.cpp:886-889","code":"  886 |         imCommon.afdata[imCommon.afcount].AFInfoData =\n  887 |             (uchar *)calloc(imCommon.afdata[imCommon.afcount].AFInfoData_length+1, 1);\n  888 |         fread(imCommon.afdata[imCommon.afcount].AFInfoData, imCommon.afdata[imCommon.afcount].AFInfoData_length, 1,\n  889 |               ifp);","lines":4,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/canon.cpp#L886-L889"},{"ref":"src/metadata/nikon.cpp:694-701","code":"  694 |       ShotInfo_buf = (uchar *)calloc(ShotInfo_len+1,1);\n  695 | \n  696 | /* for dump:\n  697 | cj_block = (uchar *)malloc(ShotInfo_len);\n  698 | ck_block = (uchar *)malloc(ShotInfo_len);\n  699 | */\n  700 | \n  701 |       fread(ShotInfo_buf, ShotInfo_len, 1, ifp);","lines":8,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/nikon.cpp#L694-L701"},{"ref":"src/metadata/nikon.cpp:827-828","code":"  827 |         LensData_buf = (uchar *)calloc(LensData_len+1,1);\n  828 |         fread(LensData_buf, LensData_len, 1, ifp);","lines":2,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/nikon.cpp#L827-L828"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"easy","description":"realloc() return value is assigned directly to imgdata.image and then memset() unconditionally. If realloc fails it returns NULL: the original buffer is leaked and memset(NULL, ...) dereferences a null pointer (crash). The calloc branch is also unchecked, so a subsequent NULL imgdata.image is written through in the copy loops. allocate_sz is attacker-controlled via parsed iheight/iwidth, making allocation failure trivially reachable.","fix":"Use a temporary pointer for realloc/calloc, check for NULL, free old buffer and throw LIBRAW_EXCEPTION_ALLOC on failure before any memset/use.","locations":[{"ref":"src/preprocessing/raw2image.cpp:90-97","code":"   90 |     if (imgdata.image)\n   91 |     {\n   92 |       imgdata.image = (ushort(*)[4])realloc(imgdata.image, allocate_sz * sizeof(*imgdata.image));\n   93 |       memset(imgdata.image, 0, allocate_sz * sizeof(*imgdata.image));\n   94 |     }\n   95 |     else\n   96 |       imgdata.image =\n   97 |           (ushort(*)[4])calloc(allocate_sz, sizeof(*imgdata.image));","lines":8,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/preprocessing/raw2image.cpp#L90-L97"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"easy","description":"Same unchecked realloc/calloc + unconditional memset pattern as raw2image(). realloc result stored in imgdata.image then memset without NULL check; calloc result also unchecked. alloc_sz derives from parsed dimensions and crop box, so failure is reachable; result is NULL-deref / leak.","fix":"Use temporary pointer, check NULL, throw LIBRAW_EXCEPTION_ALLOC; do not memset on failure.","locations":[{"ref":"src/preprocessing/raw2image.cpp:411-418","code":"  411 |     if (imgdata.image)\n  412 |     {\n  413 |       imgdata.image = (ushort(*)[4])realloc(imgdata.image,\n  414 |                                             alloc_sz * sizeof(*imgdata.image));\n  415 |       memset(imgdata.image, 0, alloc_sz * sizeof(*imgdata.image));\n  416 |     }\n  417 |     else\n  418 |       imgdata.image = (ushort(*)[4])calloc(alloc_sz, sizeof(*imgdata.image));","lines":8,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/preprocessing/raw2image.cpp#L411-L418"}]},
{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"crxDecodePlane returns 0 (success) from the middle of the nested tile loop when the levels==0 branch finds a subband with no data (dataSize==0). This `return 0` abandons decoding of all remaining tiles/columns/rows for the plane and reports success, leaving the rest of the output buffer undecoded while callers believe the plane decoded fine. It should continue to the next tile, not return.","fix":"Replace `return 0;` with logic that zeroes this tile's band buffer and continues the tile loop (mirror the per-line handling in crxDecodeLineWithIQuantization).","locations":[{"ref":"src/decoders/crx.cpp:1922-1928","code":" 1922 |       {\n 1923 |         // we have the only subband in this case\n 1924 |         if (!planeComp->subBands->dataSize)\n 1925 |         {\n 1926 |           memset(planeComp->subBands->bandBuf, 0, planeComp->subBands->bandSize);\n 1927 |           return 0;\n 1928 |         }","lines":7,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/crx.cpp#L1922-L1928"}]},
{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"Several load_raw helpers calloc a per-row/work buffer and immediately use it without a NULL check, so an allocation failure (size derived from untrusted raw_width) causes a NULL dereference rather than a clean LIBRAW_EXCEPTION_ALLOC.","fix":"Check the result of each calloc/malloc for NULL and throw LIBRAW_EXCEPTION_ALLOC before using the buffer.","locations":[{"ref":"src/decoders/decoders_libraw.cpp:244-256","code":"  244 |   unsigned char *buf = (unsigned char *)calloc(linelen,1);\n  245 |   for (int row = 0; row < S.raw_height; row++)\n  246 |   {\n  247 |     unsigned bytesread =\n  248 |         libraw_internal_data.internal_data.input->read(buf, 1, linelen);\n  249 | \tif (cps == 1)\n  250 | \t{\n  251 | \t\tunsigned short *dest = &imgdata.rawdata.raw_image[pitch * row];\n  252 | \t\t// swab32arr((unsigned *)buf, bytesread / 4);\n  253 | \t\tfor (unsigned int sp = 0, dp = 0;\n  254 | \t\t\tdp < pitch - 3 && sp < linelen - 6 && sp < bytesread - 6;\n  255 | \t\t\tsp += 7, dp += 4)\n  256 | \t\t\tunpack7bytesto4x16_nikon(buf + sp, dest + dp);","lines":13,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/decoders_libraw.cpp#L244-L256"},{"ref":"src/decoders/decoders_libraw.cpp:275-281","code":"  275 |   unsigned char *buf = (unsigned char *)calloc(linelen,1);\n  276 | \n  277 |   for (int row = 0; row < S.raw_height; row++)\n  278 |   {\n  279 |     unsigned bytesread =\n  280 |         libraw_internal_data.internal_data.input->read(buf, 1, linelen);\n  281 |     unsigned short *dest = &imgdata.rawdata.raw_image[pitch * row];","lines":7,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/decoders_libraw.cpp#L275-L281"},{"ref":"src/decoders/decoders_libraw.cpp:543-551","code":"  543 |   unsigned char *iobuf = (unsigned char *)calloc(rowbytes * rowstep,1);\n  544 |   for (int row = 0; row < imgdata.sizes.raw_height - rowstep + 1;\n  545 |        row += rowstep)\n  546 |   {\n  547 |     int rowstoread = MIN(rowstep, imgdata.sizes.raw_height - row);\n  548 |     if (libraw_internal_data.internal_data.input->read(\n  549 |             iobuf, rowbytes, rowstoread) != rowstoread)\n  550 |       throw LIBRAW_EXCEPTION_IO_EOF;\n  551 |     unsigned char *bytes = iobuf;","lines":9,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/decoders_libraw.cpp#L543-L551"},{"ref":"src/decoders/decoders_libraw.cpp:605-608","code":"  605 |   unsigned char *buffer = (unsigned char *)calloc(row_size,2);\n  606 |   for (int row = 0; row < imgdata.sizes.raw_height; row++)\n  607 |   {\n  608 |     read_shorts((ushort *)buffer, imgdata.sizes.raw_width * 2);","lines":4,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/decoders_libraw.cpp#L605-L608"}]},
{"id":"ERR_9","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"calloc() return value is not checked before use. If allocation fails, buf is NULL and the subsequent fread()/RAW() writes dereference NULL. Untrusted raw_width/raw_height drive the allocation size, so a crafted file can request a huge buffer and trigger the failure path.","fix":"After each calloc, check for NULL and throw LIBRAW_EXCEPTION_ALLOC (as nikon_load_sraw already does).","locations":[{"ref":"src/decoders/decoders_libraw_dcrdefs.cpp:237-243","code":"  237 |   data = (uchar *)calloc(bwide,1);\n  238 |   for (row = 0; row < raw_height; row++)\n  239 |   {\n  240 |     if (fread(data, 1, bwide, ifp) < bwide)\n  241 |       derror();\n  242 |     for (dp = data, col = 0; col < raw_width; dp += 5, col += 4)\n  243 |       FORC4 RAW(row, col + c) = (dp[c] << 2) | (dp[4] >> (c << 1) & 3);","lines":7,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/decoders_libraw_dcrdefs.cpp#L237-L243"},{"ref":"src/decoders/decoders_libraw_dcrdefs.cpp:255-263","code":"  255 |   data = (uchar *)calloc(bwide,1);\n  256 |   for (row = 0; row < raw_height; row++)\n  257 |   {\n  258 |     if (fread(data, 1, bwide, ifp) < bwide)\n  259 |       derror();\n  260 |     for (dp = data, col = 0; col < raw_width; dp += 8, col += 6)\n  261 |     {\n  262 |       FORC(8) bitbuf = (bitbuf << 8) | dp[c ^ 7];\n  263 |       FORC(6) RAW(row, col + c) = (bitbuf >> c * 10) & 0x3ff;","lines":9,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/decoders_libraw_dcrdefs.cpp#L255-L263"},{"ref":"src/decoders/decoders_libraw_dcrdefs.cpp:135-147","code":"  135 |   unsigned char *buf = (unsigned char *)calloc(bufsize,1);\n  136 |   unsigned short *ubuf = (unsigned short *)buf;\n  137 | \n  138 |   if (tiff_bps <= 8)\n  139 |     gamma_curve(1.0 / imgdata.rawparams.coolscan_nef_gamma, 0., 1, 255);\n  140 |   else\n  141 |     gamma_curve(1.0 / imgdata.rawparams.coolscan_nef_gamma, 0., 1, 65535);\n  142 |   fseek(ifp, data_offset, SEEK_SET);\n  143 |   for (int row = 0; row < raw_height; row++)\n  144 |   {\n  145 | \t  if (tiff_bps <= 8)\n  146 | \t  {\n  147 | \t\t  if (fread(buf, 1, bufsize, ifp) < bufsize)","lines":13,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/decoders_libraw_dcrdefs.cpp#L135-L147"}]},
{"id":"ERR_10","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"init_fuji_compr allocates params->buf via calloc and never checks for NULL; the pointer is then stored into qt[*].q_table and written by setup_qlut, so an allocation failure yields a NULL/offset write. Allocation size (2 << fuji_bits) is attacker-influenced.","fix":"Check params->buf != NULL after calloc and throw LIBRAW_EXCEPTION_ALLOC.","locations":[{"ref":"src/decoders/fuji_compressed.cpp:151-172","code":"  151 |   size_t q_table_size = 2 << libraw_internal_data.unpacker_data.fuji_bits;\n  152 |   if (libraw_internal_data.unpacker_data.fuji_lossless)\n  153 |     params->buf = calloc(q_table_size, 1);\n  154 |   else\n  155 |     params->buf = calloc(3 * q_table_size, 1);\n  156 | \n  157 |   if (libraw_internal_data.unpacker_data.fuji_raw_type == 16)\n  158 |     params->line_width = (libraw_internal_data.unpacker_data.fuji_block_width * 2) / 3;\n  159 |   else\n  160 |     params->line_width = libraw_internal_data.unpacker_data.fuji_block_width >> 1;\n  161 | \n  162 |   params->min_value = 0x40;\n  163 |   params->max_value = (1 << libraw_internal_data.unpacker_data.fuji_bits) - 1;\n  164 | \n  165 |   // setup qtables\n  166 |   if (libraw_internal_data.unpacker_data.fuji_lossless)\n  167 |   {\n  168 |     // setup main qtable only, zero the rest\n  169 |     memset(params->qt + 1, 0, 3 * sizeof(fuji_q_table));\n  170 |     params->qt[0].q_table = (int8_t *)params->buf;\n  171 |     params->qt[0].q_base = -1;\n  172 |     init_main_qtable(params, 0);","lines":22,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/fuji_compressed.cpp#L151-L172"}]},
{"id":"ERR_11","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"phase_one_flat_field(): the result of calloc(nc * wide, sizeof(float)) into mrow is not checked for NULL before the nested loops dereference mrow[...]. wide derives from file values head[2]/head[4] and nc is 2 or 4; on allocation failure (or pathological huge wide) this is a NULL dereference / OOB. read_shorts(head,8) result and head bounds (other than the divide-by-zero guard) are otherwise trusted.","fix":"Check mrow for NULL after calloc and throw LIBRAW_EXCEPTION_ALLOC; optionally bound `wide`/`high` against raw dimensions.","locations":[{"ref":"src/decoders/load_mfbacks.cpp:148-195","code":"  148 |   mrow = (float *)calloc(nc * wide, sizeof *mrow);\n  149 |   for (y = 0; y < high; y++)\n  150 |   {\n  151 |     checkCancel();\n  152 |     for (x = 0; x < wide; x++)\n  153 |       for (c = 0; c < (unsigned)nc; c += 2)\n  154 |       {\n  155 |         num = is_float ? getrealf(LIBRAW_EXIFTAG_TYPE_FLOAT) : float(get2()) / 32768.f;\n  156 |         if (y == 0)\n  157 |           mrow[c * wide + x] = num;\n  158 |         else\n  159 |           mrow[(c + 1) * wide + x] = (num - mrow[c * wide + x]) / head[5];\n  160 |       }\n  161 |     if (y == 0)\n  162 |       continue;\n  163 |     rend = head[1] + y * head[5];\n  164 |     for (row = rend - head[5];\n  165 |          row < raw_height && row < rend && row < unsigned(head[1] + head[3] - head[5]);\n  166 |          row++)\n  167 |     {\n  168 |       for (x = 1; x < wide; x++)\n  169 |       {\n  170 |         for (c = 0; c < (unsigned)nc; c += 2)\n  171 |         {\n  172 |           mult[c] = mrow[c * wide + x - 1];\n  173 |           mult[c + 1] = (mrow[c * wide + x] - mult[c]) / head[4];\n  174 |         }\n  175 |         cend = head[0] + x * head[4];\n  176 |         for (col = cend - head[4];\n  177 |              col < raw_width && col < cend && col < unsigned(head[0] + head[2] - head[4]);\n  178 |              col++)\n  179 |         {\n  180 |           c = nc > 2 ? FC(row - top_margin, col - left_margin) : 0;\n  181 |           if (!(c & 1))\n  182 |           {\n  183 |             c = unsigned(RAW(row, col) * mult[c]);\n  184 |             RAW(row, col) = LIM(c, 0, 65535);\n  185 |           }\n  186 |           for (c = 0; c < (unsigned)nc; c += 2)\n  187 |             mult[c] += mult[c + 1];\n  188 |         }\n  189 |       }\n  190 |       for (x = 0; x < wide; x++)\n  191 |         for (c = 0; c < (unsigned)nc; c += 2)\n  192 |           mrow[c * wide + x] += mrow[(c + 1) * wide + x];\n  193 |     }\n  194 |   }\n  195 |   free(mrow);","lines":48,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/load_mfbacks.cpp#L148-L195"}]},
{"id":"ERR_12","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"DCB allocations unchecked. dcb_color_full allocates chroma = calloc(width*height, sizeof*chroma) (line 328) and immediately indexes chroma[indx] (line 334) with no NULL check. dcb() allocates image2 (line 855) and image3 (line 858) and uses them directly (dcb_hor/dcb_color2/dcb_ver/...) without checking; fbdd() allocates image2 (line 820) and uses it unchecked. Any of these calloc failures cause NULL-pointer writes. Also width*height is int multiplication that can overflow for large images.","fix":"Check each calloc for NULL and throw/return on failure; compute element counts as size_t.","locations":[{"ref":"src/demosaic/dcb_demosaic.cpp:328-334","code":"  328 |   chroma = (float(*)[2])calloc(width * height, sizeof *chroma);\n  329 | \n  330 |   for (row = 1; row < height - 1; row++)\n  331 |     for (col = 1 + (FC(row, 1) & 1), indx = row * width + col, c = FC(row, col),\n  332 |         d = c / 2;\n  333 |          col < u - 1; col += 2, indx += 2)\n  334 |       chroma[indx][d] = float(image[indx][c] - image[indx][1]);","lines":7,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/demosaic/dcb_demosaic.cpp#L328-L334"},{"ref":"src/demosaic/dcb_demosaic.cpp:854-858","code":"  854 |   float(*image2)[3];\n  855 |   image2 = (float(*)[3])calloc(width * height, sizeof *image2);\n  856 | \n  857 |   float(*image3)[3];\n  858 |   image3 = (float(*)[3])calloc(width * height, sizeof *image3);","lines":5,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/demosaic/dcb_demosaic.cpp#L854-L858"},{"ref":"src/demosaic/dcb_demosaic.cpp:820","code":"  820 |   image2 = (double(*)[3])calloc(width * height, sizeof *image2);","lines":1,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/demosaic/dcb_demosaic.cpp#L820"}]},
{"id":"ERR_13","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"vng_interpolate allocations unchecked. ip = calloc(prow*pcol, 1280) (line 223) is dereferenced immediately via code[row][col] = ip and *ip++ writes (lines 227-263). brow[4] = calloc(width*3, ...) (line 265) is sliced into brow[0..2] (lines 266-267) and written (e.g. line 300 memcpy brow[2][col]) with no NULL check. A failed allocation here causes a NULL-pointer write.","fix":"Check both calloc results for NULL and throw LIBRAW_EXCEPTION_ALLOC (freeing the earlier buffer) before use.","locations":[{"ref":"src/demosaic/misc_demosaic.cpp:225","code":"  225 |   ip = (int *)calloc(prow * pcol, 1280);","lines":1,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/demosaic/misc_demosaic.cpp#L225"},{"ref":"src/demosaic/misc_demosaic.cpp:267-269","code":"  267 |   brow[4] = (ushort(*)[4])calloc(width * 3, sizeof **brow);\n  268 |   for (row = 0; row < 3; row++)\n  269 |     brow[row] = brow[4] + row * width;","lines":3,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/demosaic/misc_demosaic.cpp#L267-L269"}]},
{"id":"ERR_14","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"Canon processCanonCameraInfo tag 0x0012/0x0026/0x003c: AFInfoData is allocated with calloc(AFInfoData_length+1,1) then fread'd, but the calloc return is not checked for NULL before fread, and AFInfoData_length is derived from len * libraw_tagtype_dataunit_bytes(type) (line 873-874) which can overflow unsigned for large len*unit. A multiplication overflow would make AFInfoData_length small, calloc small, then fread reads the (smaller) amount - but the stored AFInfoData_length used by downstream consumers no longer matches the real tag size, and the unchecked calloc can NULL-deref.","fix":"Validate libraw_tagtype_dataunit_bytes(type)*len for overflow against a sane cap and check calloc != NULL before fread.","locations":[{"ref":"src/metadata/canon.cpp:873-890","code":"  873 | \t  imCommon.afdata[imCommon.afcount].AFInfoData_length = len;\n  874 | \t  if (libraw_tagtype_dataunit_bytes(type)) // returns 0 on unknown type\n  875 | \t\t  imCommon.afdata[imCommon.afcount].AFInfoData_length *= libraw_tagtype_dataunit_bytes(type);\n  876 | \n  877 | \t  unsigned datalen = 0;\n  878 | \t  if (tag == 0x0026 || tag == 0x003c) // AFInfo2 bytes 0-1 contains AFSize\n  879 | \t  {\n  880 | \t\t  INT64 here = ftell(ifp);\n  881 | \t\t  datalen = get2();\n  882 | \t\t  fseek(ifp, here, SEEK_SET);\n  883 | \t  }\n  884 | \t  if (!datalen || datalen == imCommon.afdata[imCommon.afcount].AFInfoData_length) // data check not performed or passed\n  885 | \t  {\n  886 |         imCommon.afdata[imCommon.afcount].AFInfoData =\n  887 |             (uchar *)calloc(imCommon.afdata[imCommon.afcount].AFInfoData_length+1, 1);\n  888 |         fread(imCommon.afdata[imCommon.afcount].AFInfoData, imCommon.afdata[imCommon.afcount].AFInfoData_length, 1,\n  889 |               ifp);\n  890 |         imCommon.afcount = 1;","lines":18,"link":"https://github.com/Lib {"id":"ERR_15","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"parse_tiff_ifd() allocations from file-controlled len are unchecked for failure and the loop then writes through the (possibly NULL) pointer. Examples: StripOffsets/StripByteCounts calloc(len,...) then immediate writes (no NULL check); OpcodeList1/2/3 calloc(len,1) followed by fread into a possibly-NULL pointer. calloc returning NULL (len up to ~4M for opcodes, up to 16383*8 for strips) leads to NULL-deref write/read.","fix":"Check each calloc result for NULL before writing; on failure skip the tag (and set count to 0).","locations":[{"ref":"src/metadata/tiff.cpp:98-102","code":"   98 |           tiff_ifd[ifd].strip_offsets = (INT64 *)calloc(len, sizeof(INT64));\n   99 |           tiff_ifd[ifd].strip_offsets_count = len;\n  100 |           for (int ii = 0; ii < (int)len; ii++)\n  101 |             tiff_ifd[ifd].strip_offsets[ii] = get4() + base;\n  102 |           fseek(ifp, sav, SEEK_SET); // restore position","lines":5,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/tiff.cpp#L98-L102"},{"ref":"src/metadata/tiff.cpp:643-647","code":"  643 |         tiff_ifd[ifd].strip_byte_counts = (INT64 *)calloc(len, sizeof(INT64));\n  644 |         tiff_ifd[ifd].strip_byte_counts_count = len;\n  645 |         for (int ii = 0; ii < (int)len; ii++)\n  646 |           tiff_ifd[ifd].strip_byte_counts[ii] = get4();\n  647 |         fseek(ifp, sav, SEEK_SET); // restore position","lines":5,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/tiff.cpp#L643-L647"},{"ref":"src/metadata/tiff.cpp:1702-1707","code":" 1702 | \t  if (len < 4 * 1024 * 1024) // 4M per opcode list limit\n 1703 | \t  {\n 1704 | \t\t  tiff_ifd[ifd].dng_levels.rawopcodes[0].len = len;\n 1705 | \t\t  tiff_ifd[ifd].dng_levels.rawopcodes[0].data = calloc(len,1);\n 1706 | \t\t {"id":"ERR_16","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"fread return values ignored in many metadata reads, so on a short/truncated file the destination buffer keeps uninitialised or stale bytes that are then parsed as valid metadata. Notable cases: ImageDescription `fread(desc,512,1,ifp)`, RawDataUniqueID `fread(...,16,..)`, OpcodeList fread into calloc buffers, CR3 thumb header reads (`fread(xdata,32,1,ifp)`, `fread(xdata,16,1,ifp)`), CMP1/CDI1 reads. While get2/get4 default to 0xff on EOF, direct fread of fixed buffers does not. This is mostly an info-quality / uninitialised-read issue rather than OOB, but should be checked.","fix":"Check fread return counts; on short read, zero-fill remaining bytes or bail with LIBRAW_EXCEPTION_IO_EOF/CORRUPT.","locations":[{"ref":"src/metadata/tiff.cpp:615-616","code":"  615 |       fread(desc, 512, 1, ifp);\n  616 |       desc[511] = 0;","lines":2,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/tiff.cpp#L615-L616"},{"ref":"src/metadata/tiff.cpp:883-884","code":"  883 |       fread(imgdata.color.RawDataUniqueID, 1, 16, ifp);\n  884 |       break;","lines":2,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/tiff.cpp#L883-L884"},{"ref":"src/metadata/cr3_parser.cpp:573","code":"  573 | \t\t\tfread(xdata, 32, 1, ifp);\t","lines":1,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/cr3_parser.cpp#L573"},{"ref":"src/metadata/cr3_parser.cpp:647","code":"  647 | \t\tfread(xdata, 16, 1, ifp);","lines":1,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/metadata/cr3_parser.cpp#L647"},{"ref":"src/metadata/cr3_parser.cpp:774","code":"  774 | \t\t  fread(CMP1, 1, size_t(read_size), ifp);","lines":1,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3f {"id":"ERR_17","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"calloc/malloc results are not checked in scale_colors (img), green_matching (img), recover_highlights (map), fuji_rotate/stretch (img), exp_bef (lut), convert_to_rgb (oprof). These buffers are then written/read in tight loops; on allocation failure (sizes derive from parsed image dimensions) this is a NULL-pointer dereference. green_matching additionally memcpy's into the unchecked calloc result immediately.","fix":"Check each allocation for NULL and throw LIBRAW_EXCEPTION_ALLOC (or return error) before use.","locations":[{"ref":"src/postprocessing/postprocessing_utils.cpp:228","code":"","lines":1,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/postprocessing/postprocessing_utils.cpp#L228"},{"ref":"src/postprocessing/postprocessing_utils.cpp:280-281","code":"","lines":2,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/postprocessing/postprocessing_utils.cpp#L280-L281"},{"ref":"src/postprocessing/postprocessing_aux.cpp:342","code":"  342 |   map = (float *)calloc(high, wide * sizeof *map);","lines":1,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/postprocessing/postprocessing_aux.cpp#L342"},{"ref":"src/postprocessing/aspect_ratio.cpp:41","code":"   41 |   img = (ushort(*)[4])calloc(high, wide * sizeof *img);","lines":1,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/postprocessing/aspect_ratio.cpp#L41"},{"ref":"src/postprocessing/aspect_ratio.cpp:82","code":"   82 |     img = (ushort(*)[4])calloc(width, newdim * sizeof *img);","lines":1,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/postprocessing/aspect_ratio.cpp#L82"},{"ref":"src/postprocessing/aspect_ratio.cpp:98","code":"   98 |     img = (ushort(*)[4])calloc( {"id":"ERR_18","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"apply_profile(): output-profile path reads a 4-byte size then calloc(size,1) and fread(oprof,1,size,fp) with the fread return ignored and calloc result unchecked; size is fully attacker-controlled (file content) so a huge value causes a failed/NULL allocation that is then passed to cmsOpenProfileFromMem, and a short file leaves oprof partly uninitialized. Additionally hTransform = cmsCreateTransform(...) is not checked for NULL before cmsDoTransform, and a pre-existing oprof is leaked by the reassignment.","fix":"Check fread return and calloc result, bound size, free any existing oprof first, and verify hTransform != NULL before cmsDoTransform.","locations":[{"ref":"src/write/apply_profile.cpp:47-68","code":"   47 |   else if ((fp = fopen(output, \"rb\")))\n   48 |   {\n   49 |     fread(&size, 4, 1, fp);\n   50 |     fseek(fp, 0, SEEK_SET);\n   51 |     oprof = (unsigned *)calloc(size = ntohl(size),1);\n   52 |     fread(oprof, 1, size, fp);\n   53 |     fclose(fp);\n   54 |     if (!(hOutProfile = cmsOpenProfileFromMem(oprof, size)))\n   55 |     {\n   56 |       free(oprof);\n   57 |       oprof = 0;\n   58 |     }\n   59 |   }\n   60 |   if (!hOutProfile)\n   61 |   {\n   62 |     imgdata.process_warnings |= LIBRAW_WARN_BAD_OUTPUT_PROFILE;\n   63 |     goto quit;\n   64 |   }\n   65 |   RUN_CALLBACK(LIBRAW_PROGRESS_APPLY_PROFILE, 0, 2);\n   66 |   hTransform = cmsCreateTransform(hInProfile, TYPE_RGBA_16, hOutProfile,\n   67 |                                   TYPE_RGBA_16, INTENT_PERCEPTUAL, 0);\n   68 |   cmsDoTransform(hTransform, image, image, width * height);","lines":22,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/write/apply_profile.cpp#L47-L68"}]},
{"id":"ERR_19","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"x3f_new_from_file's _err / catch cleanup frees DS->directory_entry and x3f, but the per-entry SECp/SECi/SECc handlers may already have allocated nothing here (they only set pointers to NULL), so that is fine; however on the catch path it does NOT call cleanup of any partially built tables and, more importantly, after the directory_entry array is allocated but an exception fires mid-loop, only directory_entry and x3f are freed - acceptable, but the loop also can throw from GETs leaving fields uninitialised that x3f_delete (if ever called on a half-built object) would walk. The real issue: DS->num_directory_entries was already set to the file value before allocation succeeds; if allocation throws, the catch frees directory_entry (NULL) - ok. Minor: inconsistent cleanup paths (_err vs catch) duplicate logic and risk divergence.","fix":"Unify the two cleanup paths into one helper; ensure num_directory_entries is only committed after the array is allocated and zeroed.","locations":[{"ref":"src/x3f/x3f_utils_patched.cpp:523-540","code":"  523 |   _err:\n  524 |     if (x3f)\n  525 |     {\n  526 |       DS = &x3f->directory_section;\n  527 |       if (DS && DS->directory_entry)\n  528 |         free(DS->directory_entry);\n  529 |       free(x3f);\n  530 |     }\n  531 |     return NULL;\n  532 |   }\n  533 |   catch (...)\n  534 |   {\n  535 |     x3f_directory_section_t *DS = &x3f->directory_section;\n  536 |     if (DS && DS->directory_entry)\n  537 |       free(DS->directory_entry);\n  538 |     free(x3f);\n  539 |     return NULL;\n  540 |   }","lines":18,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/x3f/x3f_utils_patched.cpp#L523-L540"}]},
{"id":"ERR_20","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"x3f_setup_camf_entries leaves CAMF->entry_table.size = i and element = entry even when a per-type setup (x3f_setup_camf_matrix/property_entry) threw partway, but those throws propagate out of x3f_load_camf without entry_table being attached to CAMF yet (it is set only after the loop). Therefore on exception the partially-built 'entry' array and any property_name/value/matrix allocations inside the entries are leaked (entry is a local not yet stored in CAMF->entry_table). Memory leak on crafted CAMF that throws mid-setup.","fix":"Store entry into CAMF->entry_table incrementally (or use RAII/try-catch) so x3f_delete can free partially built entries; free 'entry' on the exception path.","locations":[{"ref":"src/x3f/x3f_utils_patched.cpp:2029-2102","code":" 2029 | static void x3f_setup_camf_entries(x3f_camf_t *CAMF)\n 2030 | {\n 2031 |   uint8_t *p = (uint8_t *)CAMF->decoded_data;\n 2032 |   uint8_t *end = p + CAMF->decoded_data_size;\n 2033 |   camf_entry_t *entry = NULL;\n 2034 |   int i;\n 2035 | \n 2036 |   for (i = 0; p < end; i++)\n 2037 |   {\n 2038 |     uint32_t *p4 = (uint32_t *)p;\n 2039 | \n 2040 |     switch (*p4)\n 2041 |     {\n 2042 |     case X3F_CMbP:\n 2043 |     case X3F_CMbT:\n 2044 |     case X3F_CMbM:\n 2045 |       break;\n 2046 |     default:\n 2047 |       goto stop;\n 2048 |     }\n 2049 | \n 2050 |     /* TODO: lots of realloc - may be inefficient */\n 2051 |     entry = (camf_entry_t *)x3f_limited_realloc(entry, (i + 1) * sizeof(camf_entry_t));\n 2052 | \n 2053 |     /* Pointer */\n 2054 |     entry[i].entry = p;\n 2055 | \n 2056 |     /* Header */\n 2057 |     entry[i].id = *p4++;\n 2058 |     entry[i].version = *p4++;\n 2059 |     entry[i].entry_size = *p4++;\n 2060 |     entry[i].name_offset = *p4++;\n 2061 |     entry[i].value_offset = *p4++;\n 2062 | \n 2063 |     /* Compute addresses and size    {\n 2116 |   case 2: /* Older SD9-SD14 */\n 2117 |     x3f_load_camf_decode_type2(CAMF);\n 2118 |     break;\n 2119 |   case 4: /* TRUE ... Merrill */\n 2120 |     x3f_load_camf_decode_type4(CAMF);\n 2121 |     break;\n 2122 |   case 5: /* Quattro ... */\n 2123 |     x3f_load_camf_decode_type5(CAMF);\n 2124 |     break;\n 2125 |   default:\n 2126 |     /* TODO: Shouldn't this be treated as a fatal error? */\n 2127 |     throw LIBRAW_EXCEPTION_IO_CORRUPT;\n 2128 |   }\n 2129 | \n 2130 |   if (CAMF->decoded_data != NULL)\n 2131 |     x3f_setup_camf_entries(CAMF);\n 2132 |   else\n 2133 |     throw LIBRAW_EXCEPTION_IO_CORRUPT;\n 2134 | }","lines":31,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/x3f/x3f_utils_patched.cpp#L2104-L2134"}]},
{"id":"ERR_21","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"crxBitstreamGetZeros and crxBitstreamGetBits have `break; // error` paths when the buffer is exhausted, but instead of signalling an error they fall through and return a value computed from stale/zero data (e.g. _BitScanReverse on nextData==0). _BitScanReverse(__builtin_clzl) with a zero mask is undefined, so a truncated stream that reaches the byte-at-a-time error break with nextData==0 invokes UB and returns garbage rather than throwing.","fix":"On the exhaustion `break` paths, throw LIBRAW_EXCEPTION_IO_EOF (as crxFillBuffer does) instead of falling through to _BitScanReverse on a possibly-zero value.","locations":[{"ref":"src/decoders/crx.cpp:261-272","code":"  261 |       if (bitStrm->curBufSize < bitStrm->curPos + 1)\n  262 |         break; // error\n  263 |       nextData = bitStrm->mdatBuf[bitStrm->curPos++];\n  264 |       crxFillBuffer(bitStrm);\n  265 |       if (nextData)\n  266 |         break;\n  267 |       bitsLeft += 8;\n  268 |     }\n  269 |     _BitScanReverse((DWORD *)&nonZeroBit, (DWORD)nextData);\n  270 |     result = (uint32_t)(bitsLeft + 7 - nonZeroBit);\n  271 |     bitStrm->bitData = uint32_t((nextData << (32 - nonZeroBit)) & 0xffffffffu);\n  272 |     bitStrm->bitsLeft = nonZeroBit;","lines":12,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/crx.cpp#L261-L272"},{"ref":"src/decoders/crx.cpp:299-308","code":"  299 |     do\n  300 |     {\n  301 |       if (bitStrm->curPos >= bitStrm->curBufSize)\n  302 |         break; // error\n  303 |       bitsLeft += 8;\n  304 |       nextByte = bitStrm->mdatBuf[bitStrm->curPos++];\n  305 |       crxFillBuffer(bitStrm);\n  306 |       bitData |= nextByte << (32 - bitsLeft);\n  307 |     } while (bitsLeft < bits);\n  308 |   }","lines":10,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/crx.cpp#L299-L308"}]},

{"id":"ERR_23","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"fuji_compressed_load_raw allocates block_sizes, raw_block_offsets and q_bases with calloc and uses them without NULL checks (read into block_sizes is guarded by size, but the pointers themselves are assumed valid). fuji_total_blocks/fuji_total_lines come from the file header.","fix":"Check each calloc result for NULL and throw LIBRAW_EXCEPTION_ALLOC.","locations":[{"ref":"src/decoders/fuji_compressed.cpp:1103-1125","code":" 1103 |   block_sizes = (unsigned *)calloc(sizeof(unsigned), libraw_internal_data.unpacker_data.fuji_total_blocks);\n 1104 |   raw_block_offsets = (INT64 *)calloc(sizeof(INT64), libraw_internal_data.unpacker_data.fuji_total_blocks);\n 1105 | \n 1106 |   libraw_internal_data.internal_data.input->seek(libraw_internal_data.unpacker_data.data_offset, SEEK_SET);\n 1107 |   int sizesToRead = sizeof(unsigned) * libraw_internal_data.unpacker_data.fuji_total_blocks;\n 1108 |   if (libraw_internal_data.internal_data.input->read(block_sizes, 1, sizesToRead) != sizesToRead)\n 1109 |   {\n 1110 |     free(block_sizes);\n 1111 |     free(raw_block_offsets);\n 1112 |     throw LIBRAW_EXCEPTION_IO_EOF;\n 1113 |   }\n 1114 | \n 1115 |   raw_offset = ((sizeof(unsigned) * libraw_internal_data.unpacker_data.fuji_total_blocks) + 0xF) & ~0xF;\n 1116 | \n 1117 |   // read q bases for lossy\n 1118 |   if (!libraw_internal_data.unpacker_data.fuji_lossless)\n 1119 |   {\n 1120 |     int total_q_bases = libraw_internal_data.unpacker_data.fuji_total_blocks *\n 1121 |                         ((libraw_internal_data.unpacker_data.fuji_total_lines + 0xF) & ~0xF);\n 1122 |     q_bases = (uchar *)calloc(total_q_bases, 1);\n 1123 |     libraw_internal_data.internal_data.input->seek(raw_offset + libraw_internal_data.unpacker_data.data_offset,\n 1124 |                                                    SEEK_SET);\n 1125 |     libraw_internal_data.internal_data.input->read(q_bases, 1, total_q_bases);","lines":23,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/fuji_compressed.cpp#L1103-L1125"}]},
{"id":"ERR_24","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"kodak_jpeg_load_raw(): calloc(data_size,1) into jpg_buf is not NULL-checked, and the return value of fread(jpg_buf, data_size, 1, ifp) is ignored. data_size is bounded against max_raw_memory_mb just above, but a short read leaves uninitialized/garbage tail bytes passed to the JPEG decoder, and an allocation failure NULL-derefs in libraw_swab/jpeg_mem_src.","fix":"Check jpg_buf != NULL (throw LIBRAW_EXCEPTION_ALLOC) and verify fread returns 1, else derror().","locations":[{"ref":"src/decoders/kodak_decoders.cpp:185-190","code":"  185 |   unsigned char *jpg_buf = (unsigned char *)calloc(data_size,1);\n  186 |   std::vector<uchar> pixel_buf(width * 3, 0);\n  187 |   jpeg_create_decompress(&cinfo);\n  188 | \n  189 |   fread(jpg_buf, data_size, 1, ifp);\n  190 |   libraw_swab(jpg_buf, int(data_size));","lines":6,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/kodak_decoders.cpp#L185-L190"}]},
{"id":"ERR_25","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"Several allocations in load_mfbacks.cpp are not NULL-checked before use: phase_one_load_raw() calloc of ph1_cblack/ph1_rblack (then read_shorts into them); phase_one_load_raw_c() calloc of pixel and of ph1_cblack/ph1_rblack; unpacked_load_raw_FujiDBP() calloc of tile; imacon_full_load_raw() malloc of buf. On allocation failure these dereference NULL. Inputs (raw_width/raw_height) are bounded to 65535 at unpack() so sizes are limited, but OOM still yields a crash rather than a clean LIBRAW_EXCEPTION_ALLOC.","fix":"Check each allocation for NULL and throw LIBRAW_EXCEPTION_ALLOC (the surrounding try/catch blocks already free other buffers).","locations":[{"ref":"src/decoders/load_mfbacks.cpp:573-586","code":"  573 |     imgdata.rawdata.ph1_cblack =\n  574 |         (short(*)[2])calloc(raw_height * 2, sizeof(ushort));\n  575 |     imgdata.rawdata.ph1_rblack =\n  576 |         (short(*)[2])calloc(raw_width * 2, sizeof(ushort));\n  577 |     if (ph1.black_col)\n  578 |     {\n  579 |       fseek(ifp, ph1.black_col, SEEK_SET);\n  580 |       read_shorts((ushort *)imgdata.rawdata.ph1_cblack[0], raw_height * 2);\n  581 |     }\n  582 |     if (ph1.black_row)\n  583 |     {\n  584 |       fseek(ifp, ph1.black_row, SEEK_SET);\n  585 |       read_shorts((ushort *)imgdata.rawdata.ph1_rblack[0], raw_width * 2);\n  586 |     }","lines":14,"link":"https://github.com/LibRaw/LibRaw/blob/dde798dd310f54b97e3ff7e5b07412da3310a2db/src/decoders/load_mfbacks.cpp#L573-L586"},{"ref":"src/decoders/load_mfbacks.cpp:646-671","code":"  646 |   pixel = (ushort *)calloc(raw_width * 3 + raw_height * 4, 2);\n  647 |   offset = (int *)(pixel + raw_width);\n  648 |   fseek(ifp, strip_offset, SEEK_SET);\n  649 |   for (row = 0; row < raw_height; row++)\n  650 |     offset[row] = get4();\n  651 |   c_black = (short(*)[2])(offset + raw_height);\n  652 |   fseek(ifp,
