<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`emit_client_hello_for_retry` unwraps `self.next.offered_key_share.unwrap()` (HRR path) and `st.offered_key_share.unwrap()` (server-hello path) relying on the invariant \"we always send a key share when TLS 1.3 is enabled\". These reach the TLS1.3 code paths only after the server selected TLS1.3, which is only offered when TLS1.3 is configured, so the invariant should hold. However these are network-reachable code paths guarded only by an implicit invariant rather than an explicit error; a logic regression elsewhere (e.g. a TLS1.3 ServerHello accepted without a key share having been offered) would turn into a panic instead of a protocol error.","fix":"Replace `.unwrap()` with `.ok_or(Error::Unreachable(\"...\"))?` (or a PeerMisbehaved variant) to convert the invariant violation into a graceful error rather than a panic.","locations":[{"ref":"rustls/src/client/hs.rs:276","code":"  276 |         let offered_key_share = self.next.offered_key_share.unwrap();","lines":1,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/client/hs.rs#L276"},{"ref":"rustls/src/client/tls13.rs:150","code":"  150 |         let our_key_share = st.offered_key_share.unwrap();","lines":1,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/client/tls13.rs#L150"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`prf` (TLS1.2 PRF) and `HkdfExpanderUsingHmac::expand_unchecked` call `out.chunks_mut(chunk_size)`\nwhere `chunk_size = hmac_key.tag_len()` / `self.0.tag_len()`. `slice::chunks_mut(0)` panics. A\ncustom `hmac::Key` implementation returning `tag_len() == 0` therefore panics rather than failing\ngracefully. There is no validation that the configured HMAC tag length is non-zero.","fix":"Assert `tag_len() > 0` (e.g. `debug_assert!`) or document the invariant on the `hmac::Key::tag_len` contract and rely on it explicitly.","locations":[{"ref":"rustls/src/crypto/tls12.rs:98-116","code":"   98 | pub fn prf(out: &mut [u8], hmac_key: &dyn hmac::Key, label: &[u8], seed: &[u8]) {\n   99 |     let mut previous_a: Option<hmac::Tag> = None;\n  100 | \n  101 |     let chunk_size = hmac_key.tag_len();\n  102 |     for chunk in out.chunks_mut(chunk_size) {\n  103 |         let a_i = match previous_a {\n  104 |             // A(0) = HMAC_hash(secret, label + seed)\n  105 |             None => hmac_key.sign(&[label, seed]),\n  106 |             // A(i) = HMAC_hash(secret, A(i - 1))\n  107 |             Some(previous_a) => hmac_key.sign(&[previous_a.as_ref()]),\n  108 |         };\n  109 | \n  110 |         // P_hash[i] = HMAC_hash(secret, A(i) + label + seed)\n  111 |         let p_term = hmac_key.sign(&[a_i.as_ref(), label, seed]);\n  112 |         chunk.copy_from_slice(&p_term.as_ref()[..chunk.len()]);\n  113 | \n  114 |         previous_a = Some(a_i);\n  115 |     }\n  116 | }","lines":19,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/crypto/tls12.rs#L98-L116"},{"ref":"rustls/src/crypto/tls13.rs:16-28","code":"   16 |     fn expand_unchecked(&self, info: &[&[u8]], output: &mut [u8]) {\n   17 |         let mut term = hmac::Tag::new(b\"\");\n   18 | \n   19 |         for (n, chunk) in output\n   20 |             .chunks_mut(self.0.tag_len())\n   21 |             .enumerate()\n   22 |         {\n   23 |             term = self\n   24 |                 .0\n   25 |                 .sign_concat(term.as_ref(), info, &[(n + 1) as u8]);\n   26 |             chunk.copy_from_slice(&term.as_ref()[..chunk.len()]);\n   27 |         }\n   28 |     }","lines":13,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/crypto/tls13.rs#L16-L28"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"negligible","difficulty":"medium","description":"`rewind_epoch` performs `self.common.epoch -= delta as u64`, which underflows (panics in debug) if\n`delta` exceeds the stored epoch. These are `#[doc(hidden)]` test-only helpers, so the blast radius is\nlimited, but the unchecked subtraction is still a latent panic.","fix":"Use `self.common.epoch = self.common.epoch.saturating_sub(delta as u64);`.","locations":[{"ref":"rustls/src/client/mod.rs:202-204","code":"  202 |     pub fn rewind_epoch(&mut self, delta: u32) {\n  203 |         self.common.epoch -= delta as u64;\n  204 |     }","lines":3,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/client/mod.rs#L202-L204"},{"ref":"rustls/src/client/mod.rs:289-291","code":"  289 |     pub fn rewind_epoch(&mut self, delta: u32) {\n  290 |         self.common.epoch -= delta as u64;\n  291 |     }","lines":3,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/client/mod.rs#L289-L291"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`make_tls12_aad` truncates the record length to `u16` via `put_u16(len as u16, ...)`. If `len`\nexceeds 65535 the AAD silently encodes a wrong (truncated) length, which would either cause\nauthentication failures (best case) or, combined with another bug, mis-authenticate a record.\nThere is no debug assertion bounding `len`. In practice records are bounded by fragmentation, but\nthis is a silent narrowing cast in a security-critical AAD construction with no guard.","fix":"Add a `debug_assert!(len <= u16::MAX as usize)` (or return an error) before casting `len` to `u16`.","locations":[{"ref":"rustls/src/crypto/cipher/mod.rs:352-364","code":"  352 | pub fn make_tls12_aad(\n  353 |     seq: u64,\n  354 |     typ: ContentType,\n  355 |     vers: ProtocolVersion,\n  356 |     len: usize,\n  357 | ) -> [u8; TLS12_AAD_SIZE] {\n  358 |     let mut out = [0; TLS12_AAD_SIZE];\n  359 |     put_u64(seq, &mut out[0..]);\n  360 |     out[8] = typ.into();\n  361 |     put_u16(vers.into(), &mut out[9..]);\n  362 |     put_u16(len as u16, &mut out[11..]);\n  363 |     out\n  364 | }","lines":13,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/crypto/cipher/mod.rs#L352-L364"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"On encode, `LengthPrefixedBuffer::drop` only verifies the body length against the\nlength-prefix capacity with `debug_assert!`. In release builds an oversized body is\nsilently truncated by `len as u8` / `len as u16` / `len as u32`, writing a wrong\nlength prefix and producing a corrupt/ambiguous wire message. Combined with the\n`payload_encode` of a handshake message using `ListLength::U24 { max: usize::MAX, .. }`\n(see mod.rs:504-510), a body exceeding 16MB would emit a truncated u24 length with no\nruntime error. This is encode-side (our own data) so impact is limited, but it can\ndesynchronize the peer instead of failing loudly.","fix":"Replace the debug_asserts with checked conversions (e.g. u8::try_from(len)) and either return/propagate an error or panic unconditionally; cap the handshake U24 `max` at the real protocol limit rather than usize::MAX.","locations":[{"ref":"rustls/src/msgs/codec.rs:296-320","code":"  296 |     fn drop(&mut self) {\n  297 |         match self.size_len {\n  298 |             ListLength::NonZeroU8 { .. } => {\n  299 |                 let len = self.buf.len() - self.len_offset - 1;\n  300 |                 debug_assert!(len <= 0xff);\n  301 |                 self.buf[self.len_offset] = len as u8;\n  302 |             }\n  303 |             ListLength::U16 | ListLength::NonZeroU16 { .. } => {\n  304 |                 let len = self.buf.len() - self.len_offset - 2;\n  305 |                 debug_assert!(len <= 0xffff);\n  306 |                 let out: &mut [u8; 2] = (&mut self.buf[self.len_offset..self.len_offset + 2])\n  307 |                     .try_into()\n  308 |                     .unwrap();\n  309 |                 *out = u16::to_be_bytes(len as u16);\n  310 |             }\n  311 |             ListLength::U24 { .. } | ListLength::NonZeroU24 { .. } => {\n  312 |                 let len = self.buf.len() - self.len_offset - 3;\n  313 |                 debug_assert!(len <= 0xff_ffff);\n  314 |                 let len_bytes = u32::to_be_bytes(len as u32);\n  315 |                 let out: &mut [u8; 3] = (&mut self.buf[self.len_offset..self.len_offset + 3])\n  316 |                     .try_into()\n  317 |                     .unwrap();\n  318 |                 out.copy_from_slice(&len_bytes[1..]);\n  319 |             }\n  320 |         }","lines":25,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/msgs/codec.rs#L296-L320"},{"ref":"rustls/src/msgs/mod.rs:505-511","code":"  505 |         let nested = LengthPrefixedBuffer::new(\n  506 |             ListLength::U24 {\n  507 |                 max: usize::MAX,\n  508 |                 error: InvalidMessage::MessageTooLarge,\n  509 |             },\n  510 |             bytes,\n  511 |         );","lines":7,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/msgs/mod.rs#L505-L511"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`hkdf_expand_label_inner` casts the output length, label length, and context length with\n`n as u16` / `(...) as u8` / `context.len() as u8` without checking bounds. These are\nHKDF-Expand-Label `info` length fields. While current callers happen to supply bounded\nlengths (static labels, hash-sized contexts, `SizedPayload<u8>` ticket nonces), the function\nis `pub(crate)` and offers no guard: a future caller passing a context >255 bytes or output\n>65535 would silently truncate the length prefix and derive a wrong (attacker-influenceable)\nkey with no error. Defensive bounds checks belong here since this is the single chokepoint\nfor all label expansion.","fix":"Debug-assert or return an error when `n > u16::MAX`, `LABEL_PREFIX.len()+label.len() > u8::MAX`, or `context.len() > u8::MAX`, rather than silently truncating via `as` casts.","locations":[{"ref":"rustls/src/tls13/key_schedule.rs:1131-1157","code":" 1131 | fn hkdf_expand_label_inner<F, T>(\n 1132 |     expander: &dyn HkdfExpander,\n 1133 |     label: &[u8],\n 1134 |     context: &[u8],\n 1135 |     n: usize,\n 1136 |     f: F,\n 1137 | ) -> T\n 1138 | where\n 1139 |     F: FnOnce(&dyn HkdfExpander, &[&[u8]]) -> T,\n 1140 | {\n 1141 |     const LABEL_PREFIX: &[u8] = b\"tls13 \";\n 1142 | \n 1143 |     let output_len = u16::to_be_bytes(n as u16);\n 1144 |     let label_len = u8::to_be_bytes((LABEL_PREFIX.len() + label.len()) as u8);\n 1145 |     let context_len = u8::to_be_bytes(context.len() as u8);\n 1146 | \n 1147 |     let info = &[\n 1148 |         &output_len[..],\n 1149 |         &label_len[..],\n 1150 |         LABEL_PREFIX,\n 1151 |         label,\n 1152 |         &context_len[..],\n 1153 |         context,\n 1154 |     ];\n 1155 | \n 1156 |     f(expander, info)\n 1157 | }","lines":27,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/tls13/key_schedule.rs#L1131-L1157"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"negligible","difficulty":"easy","description":"In `set_freshness`, the elapsed server-side ticket age in seconds is truncated\nto u32 (`... as u32`) *before* multiplying by 1000, rather than saturating in\nu64 first. `(time_now.as_secs().saturating_sub(creation_time_sec) as u32)\n.saturating_mul(1000)`. For ages above u32::MAX seconds (~136 years) the cast\nwraps, producing a small `server_age_ms` and potentially mis-classifying an\nextremely old ticket as fresh. Not realistically reachable (ticket lifetimes\nare tiny), but the cast-then-multiply ordering defeats the intent of the\nsaturating arithmetic.","fix":"Compute the age in u64 and saturate the multiplication in u64, e.g. `time_now.as_secs().saturating_sub(creation_time_sec).saturating_mul(1000).min(u32::MAX as u64) as u32`.","locations":[{"ref":"rustls/src/server/tls13.rs:1309-1312","code":" 1309 |         let server_age_ms = (time_now\n 1310 |             .as_secs()\n 1311 |             .saturating_sub(self.common.creation_time_sec) as u32)\n 1312 |             .saturating_mul(1000);","lines":4,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/server/tls13.rs#L1309-L1312"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`ClientSessionMemoryCache` stores `kx_hint`, the TLS1.2 session, and all TLS1.3 tickets for a server\nin a single `ServerData` entry keyed by `ClientSessionKey`, inside a `LimitedCache` whose capacity is\n`size / MAX_TLS13_TICKETS_PER_SERVER` (server slots). The cache size argument (e.g. the default 256)\nis documented as \"the maximum number of stored sessions\", but because each server slot can hold up to\n8 TLS1.3 tickets plus a TLS1.2 session, the actual maximum number of stored *sessions* is up to ~8x\nthe configured number, and the number of distinct servers tracked is only `size/8` (32 for the\ndefault 256). This is a mismatch between the documented unit (\"sessions\") and the enforced unit\n(\"servers * up-to-8-tickets\"), which can both surprise memory budgeting and silently evict\nper-server kx hints / TLS1.2 sessions far sooner than a user expects.","fix":"Align documentation and computation: either document `size` as 'number of servers', or track sessions directly so the configured number is the real bound.","locations":[{"ref":"rustls/src/client/handy.rs:71-84","code":"   71 |     pub struct ClientSessionMemoryCache {\n   72 |         servers: Mutex<limited_cache::LimitedCache<ClientSessionKey<'static>, ServerData>>,\n   73 |     }\n   74 | \n   75 |     impl ClientSessionMemoryCache {\n   76 |         /// Make a new ClientSessionMemoryCache.  `size` is the\n   77 |         /// maximum number of stored sessions.\n   78 |         pub fn new(size: usize) -> Self {\n   79 |             let max_servers = size.saturating_add(MAX_TLS13_TICKETS_PER_SERVER - 1)\n   80 |                 / MAX_TLS13_TICKETS_PER_SERVER;\n   81 |             Self {\n   82 |                 servers: Mutex::new(limited_cache::LimitedCache::new(max_servers)),\n   83 |             }\n   84 |         }","lines":14,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/client/handy.rs#L71-L84"},{"ref":"rustls/src/client/config.rs:560-565","code":"  560 |     pub fn in_memory_sessions(num: usize) -> Self {\n  561 |         Self {\n  562 |             store: Arc::new(ClientSessionMemoryCache::new(num)),\n  563 |             tls12_resumption: Tls12Resumption::SessionIdOrTickets,\n  564 |         }\n  565 |     }","lines":6,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/client/config.rs#L560-L565"},{"ref":"rustls/src/client/config.rs:596-600","code":"  596 |     /// Create an in-memory session store resumption with up to 256 server names, allowing\n  597 |     /// a TLS 1.2 session to resume with a session id or RFC 5077 ticket.\n  598 |     fn default() -> Self {\n  599 |         Self::in_memory_sessions(256)\n  600 |     }","lines":5,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/client/config.rs#L596-L600"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`insert_tls13_ticket` bounds the per-server TLS1.3 ticket count using `data.tls13.capacity()`\ninstead of the `MAX_TLS13_TICKETS_PER_SERVER` constant. The number of tickets is controlled by the\nserver (NewSessionTicket messages), and the trait docs explicitly say \"The number of times this is\ncalled is controlled by the server, so implementations of this trait should apply a reasonable\nbound\". `VecDeque::capacity()` is only a *lower bound*: the allocator/`VecDeque` may round the\nrequested capacity (8) up to a larger value (e.g. the next power of two), so the effective per-server\nlimit becomes whatever the allocator chose rather than the intended 8. This lets a malicious or\nmisconfigured server cause the client to retain more tickets per server than documented, undermining\nthe intended memory bound.","fix":"Compare against the `MAX_TLS13_TICKETS_PER_SERVER` constant: `if data.tls13.len() >= MAX_TLS13_TICKETS_PER_SERVER { data.tls13.pop_front(); }`.","locations":[{"ref":"rustls/src/client/handy.rs:126-136","code":"  126 |         fn insert_tls13_ticket(&self, key: ClientSessionKey<'static>, value: Tls13Session) {\n  127 |             self.servers\n  128 |                 .lock()\n  129 |                 .unwrap()\n  130 |                 .get_or_insert_default_and_edit(key, |data| {\n  131 |                     if data.tls13.len() == data.tls13.capacity() {\n  132 |                         data.tls13.pop_front();\n  133 |                     }\n  134 |                     data.tls13.push_back(value);\n  135 |                 });\n  136 |         }","lines":11,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/client/handy.rs#L126-L136"},{"ref":"rustls/src/client/handy.rs:45","code":"   45 |     const MAX_TLS13_TICKETS_PER_SERVER: usize = 8;","lines":1,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/client/handy.rs#L45"},{"ref":"rustls/src/client/handy.rs:62","code":"   62 |                 tls13: VecDeque::with_capacity(MAX_TLS13_TICKETS_PER_SERVER),","lines":1,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/client/handy.rs#L62"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"When ECH was offered and rejected, the client stores the server's retry configs only when `ech_status == EchStatus::Rejected`. But `ech_status` becomes `Rejected` only via `confirm_acceptance` (full handshake) or `confirm_hrr_acceptance`. If the server accepted ECH in ServerHello (status `Accepted`) but then sends an EncryptedExtensions ECH ack with retry_configs, the `(EchStatus::NotOffered | EchStatus::Accepted, Some(_))` arm correctly errors. However the `(EchStatus::Offered, _)` case is not handled by any explicit arm and falls through to `_ => None`, silently discarding any retry configs while leaving status as `Offered`. Status `Offered` should be unreachable at EncryptedExtensions time (it is resolved to Accepted/Rejected in handle_server_hello), but if a future refactor leaves it `Offered`, retry configs would be silently dropped rather than producing a defined error. Worth an explicit guard.","fix":"Add an explicit arm for `(EchStatus::Offered, _)` (or `EchStatus::Grease`) that returns an internal error / unreachable, instead of letting it fall into the catch-all `_ => None`.","locations":[{"ref":"rustls/src/client/tls13.rs:577-590","code":"  577 |         let ech_retry_configs = match (self.ech_status, &exts.encrypted_client_hello_ack) {\n  578 |             // If we didn't offer ECH, or ECH was accepted, but the server sent an ECH encrypted\n  579 |             // extension with retry configs, we must error.\n  580 |             (EchStatus::NotOffered | EchStatus::Accepted, Some(_)) => {\n  581 |                 return Err(PeerMisbehaved::UnsolicitedEchExtension.into());\n  582 |             }\n  583 |             // If we offered ECH, and it was rejected, store the retry configs (if any) from\n  584 |             // the server's ECH extension. We will return them in an error produced at the end\n  585 |             // of the handshake.\n  586 |             (EchStatus::Rejected, ext) => ext\n  587 |                 .as_ref()\n  588 |                 .map(|ext| ext.retry_configs.to_vec()),\n  589 |             _ => None,\n  590 |         };","lines":14,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/client/tls13.rs#L577-L590"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`Nonce::new_inner` silently drops the `path_id` when the IV length is 8, 9, 10 or 11 bytes.\nThe QUIC-multipath branch only writes `path_id` into the buffer when `iv_len >= 12`; for\n`8 <= iv_len < 12` the `path_id` is ignored entirely, so two different paths sharing the same\npacket number produce the *same* nonce. Nonce reuse across paths breaks AEAD security\n(catastrophic for confidentiality/integrity). While the standard QUIC IV is 12 bytes (so this\nis latent), there is no assertion or error for shorter IVs - the failure is silent. A custom\nprovider supplying a shorter IV would silently get nonce collisions instead of an error.","fix":"When `path_id.is_some()` but `iv_len < 12`, return an error or assert, rather than silently producing a nonce that ignores `path_id`.","locations":[{"ref":"rustls/src/crypto/cipher/mod.rs:265-287","code":"  265 |     fn new_inner(path_id: Option<u32>, iv: &Iv, seq: u64) -> Self {\n  266 |         let iv_len = iv.len();\n  267 |         let mut buf = [0u8; Iv::MAX_LEN];\n  268 | \n  269 |         if iv_len >= 8 {\n  270 |             put_u64(seq, &mut buf[iv_len - 8..iv_len]);\n  271 |             if let Some(path_id) = path_id {\n  272 |                 if iv_len >= 12 {\n  273 |                     buf[iv_len - 12..iv_len - 8].copy_from_slice(&path_id.to_be_bytes());\n  274 |                 }\n  275 |             }\n  276 |         } else {\n  277 |             let seq_bytes = seq.to_be_bytes();\n  278 |             buf[..iv_len].copy_from_slice(&seq_bytes[8 - iv_len..]);\n  279 |         }\n  280 | \n  281 |         buf[..iv_len]\n  282 |             .iter_mut()\n  283 |             .zip(iv.as_ref())\n  284 |             .for_each(|(s, iv)| *s ^= *iv);\n  285 | \n  286 |         Self { buf, len: iv_len }\n  287 |     }","lines":23,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/crypto/cipher/mod.rs#L265-L287"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `TicketRotator::maybe_roll`, when rotation occurs the old `current` is moved into\n`previous` only when it is `Some`. However, two rotations occurring within a single\n`lifetime` window (e.g. if `maybe_roll` is invoked with two `now` values both past the\ncurrent expiry but the second after a fresh generation) will overwrite a still-grace-period\n`previous` with the just-demoted `current`, silently dropping the older ticketer. Tickets\nencrypted by the dropped ticketer that are still within their advertised two-`lifetime`\nvalidity window will then fail to decrypt, causing spurious resumption failures. The\nrotation logic assumes at most one rotation per lifetime but does not enforce or document\nthat invariant.","fix":"Either document/enforce that callers must not skip rotation epochs, or track expiry of `previous` and only overwrite it once it is itself out of its grace period; consider chaining demotions so a valid `previous` is not discarded prematurely.","locations":[{"ref":"rustls/src/ticketer.rs:104-147","code":"  104 |     pub(crate) fn maybe_roll(\n  105 |         &self,\n  106 |         now: Instant,\n  107 |     ) -> Option<RwLockReadGuard<'_, TicketRotatorState>> {\n  108 |         // Fast, common, & read-only path in case we do not need to switch\n  109 |         // to the next ticketer yet\n  110 |         {\n  111 |             let read = self.state.read().ok()?;\n  112 |             match &read.current {\n  113 |                 Some(current) if now <= current.expires_at => return Some(read),\n  114 |                 _ => {}\n  115 |             }\n  116 |         }\n  117 | \n  118 |         let mut write = self.state.write().ok()?;\n  119 |         if let Some(current) = &write.current {\n  120 |             if now <= current.expires_at {\n  121 |                 // Another thread beat us to it. Nothing to do.\n  122 |                 drop(write);\n  123 |                 return self.state.read().ok();\n  124 |             }\n  125 |         }\n  126 | \n  127 |         // We need to switch ticketers, and make a new one.\n  128 |         // Generate a potential \"next\" ticketer outside the lock.\n  129 |         let next = (self.generator)()\n  130 |             .ok()\n  131 |             .map(|producer| Generation {\n  132 |                 producer,\n  133 |                 expires_at: now + self.lifetime,\n  134 |             });\n  135 | \n  136 |         // Now we have:\n  137 |         // - confirmed we need rotation\n  138 |         // - confirmed we are the thread that will do it\n  139 |         // - successfully made the replacement ticketer\n  140 |         let prev = mem::replace(&mut write.current, next);\n  141 |         if prev.is_some() {\n  142 |             write.previous = prev;\n  143 |         }\n  144 |         drop(write);\n  145 | \n  146 |         self.state.read().ok()\n  147 |     }","lines":44,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/ticketer.rs#L104-L147"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"On the client `LimitedCache`, capacity is computed as\n`size.saturating_add(MAX_TLS13_TICKETS_PER_SERVER - 1) / MAX_TLS13_TICKETS_PER_SERVER`. When the user\npasses `size == 0` (e.g. intending to effectively disable in-memory caching while still using a\n`ClientSessionMemoryCache`), this yields `7 / 8 == 0`, so `LimitedCache::new(0)` is created. With a\nzero capacity the eviction logic (`oldest.capacity() == oldest.len()`) can permit inserting one entry\nthat is then immediately evicted on the next insert, giving surprising/near-useless behavior rather\nthan a clear contract. Documented default is 256 so this is an edge case, but a `size` of a few\nsessions also rounds oddly (e.g. `1..=8` all collapse to one server slot).","fix":"Document the rounding explicitly and/or clamp `max_servers` to at least 1 when `size > 0`, so a non-zero requested size always yields a usable cache.","locations":[{"ref":"rustls/src/client/handy.rs:78-84","code":"   78 |         pub fn new(size: usize) -> Self {\n   79 |             let max_servers = size.saturating_add(MAX_TLS13_TICKETS_PER_SERVER - 1)\n   80 |                 / MAX_TLS13_TICKETS_PER_SERVER;\n   81 |             Self {\n   82 |                 servers: Mutex::new(limited_cache::LimitedCache::new(max_servers)),\n   83 |             }\n   84 |         }","lines":7,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/client/handy.rs#L78-L84"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"TLS1.2 EMS resumption acceptance condition is redundant and turns a graceful\nfallback into a fatal alert. `check_session` accepts a session for resumption\nwhen `session.extended_ms == using_ems || session.extended_ms && !using_ems`.\nThe second disjunct only adds the case `session.extended_ms == true &&\nusing_ems == false` (a client that previously negotiated Extended Master Secret\nbut is now offering a ClientHello without the EMS extension). For that case\n`start_resumption` immediately returns `PeerMisbehaved::ResumptionAttemptedWithVariedEms`\n(tls12.rs:313-315), aborting the connection with a fatal alert instead of\nfalling back to a full handshake. The extra disjunct should be removed so such\na ticket simply causes a full handshake (the RFC-recommended behaviour),\nmatching how other resumption mismatches are handled (return None).","fix":"Replace the condition with `session.extended_ms == using_ems` so an EMS/non-EMS mismatch yields `(ticket, None)` and a full handshake, instead of being accepted here and then rejected fatally in start_resumption.","locations":[{"ref":"rustls/src/server/tls12.rs:294-297","code":"  294 |         match session.extended_ms == using_ems || session.extended_ms && !using_ems {\n  295 |             true => (ticket, Some(session.into_owned())),\n  296 |             false => (ticket, None),\n  297 |         }","lines":4,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/server/tls12.rs#L294-L297"},{"ref":"rustls/src/server/tls12.rs:316-318","code":"  316 |         if resumedata.extended_ms && !using_ems {\n  317 |             return Err(PeerMisbehaved::ResumptionAttemptedWithVariedEms.into());\n  318 |         }","lines":3,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/server/tls12.rs#L316-L318"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`Generation::in_grace_period` returns `now <= self.expires_at + lifetime`, and `maybe_roll`\nrolls only when `now > current.expires_at` (strictly). At the exact boundary instants the\nticket is still considered usable. The documented contract is \"usable for at least one\n`lifetime`, and at most two `lifetime`s\". `Instant` arithmetic `self.expires_at + lifetime`\ncan panic on overflow if `lifetime` is very large (e.g. near `Duration::MAX`), since\n`Instant + Duration` panics on overflow. A pathological but caller-supplied `lifetime`\npassed to `TicketRotator::new` would make grace-period checks abort.","fix":"Use `Instant::checked_add(lifetime)` and treat overflow as 'not in grace period', or validate `lifetime` in `TicketRotator::new` to a sane upper bound.","locations":[{"ref":"rustls/src/ticketer.rs:183-187","code":"  183 | impl Generation {\n  184 |     fn in_grace_period(&self, now: Instant, lifetime: Duration) -> bool {\n  185 |         now <= self.expires_at + lifetime\n  186 |     }\n  187 | }","lines":5,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/ticketer.rs#L183-L187"},{"ref":"rustls/src/ticketer.rs:31-46","code":"   31 |     pub fn new(\n   32 |         lifetime: Duration,\n   33 |         generator: fn() -> Result<Box<dyn TicketProducer>, Error>,\n   34 |     ) -> Result<Self, Error> {\n   35 |         Ok(Self {\n   36 |             generator,\n   37 |             lifetime,\n   38 |             state: RwLock::new(TicketRotatorState {\n   39 |                 current: Some(Generation {\n   40 |                     producer: generator()?,\n   41 |                     expires_at: Instant::now() + lifetime,\n   42 |                 }),\n   43 |                 previous: None,\n   44 |             }),\n   45 |         })\n   46 |     }","lines":16,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/ticketer.rs#L31-L46"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"medium","description":"`pki_error` maps webpki's `InvalidCertValidity` to `CertificateError::Expired`. In\nrustls-webpki, `InvalidCertValidity` is raised when a certificate's notBefore/notAfter\nrange is itself malformed (e.g. notBefore > notAfter), which is not the same condition as\nthe cert being expired against the current time. The mapping still rejects the certificate\n(it produces an error, so there is no acceptance-of-invalid-cert risk), but it surfaces a\nmisleading `Expired` reason and a `CertificateExpired` alert for a structurally invalid\nvalidity window.","fix":"Map `InvalidCertValidity` to `CertificateError::BadEncoding` (structural problem) or a dedicated variant, rather than `Expired`.","locations":[{"ref":"rustls/src/webpki/mod.rs:61","code":"   61 |         InvalidCertValidity => CertificateError::Expired.into(),","lines":1,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/webpki/mod.rs#L61"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`HashAdapter::finish` and `SecurityDomain::new` both `unwrap()` the result of slicing the hash output\n(`[..8]` / `[..32]`). Correctness depends entirely on the runtime invariant that the selected hash\nprovider outputs >= 32 bytes, enforced only by the `.expect(...)` in `SecurityDomain::new` (line 481).\nIf a custom `CryptoProvider` ever advertised a cipher suite whose hash claimed `output_len() >= 32`\nbut whose `finish()`/`fork_finish()` returned fewer bytes, these `unwrap()`s would panic. This is a\nprovider-trust invariant, but the coupling between `output_len()` and actual output length is not\nchecked.","fix":"Validate that the produced output length matches `output_len()` (or use a checked conversion returning a configuration error) instead of `unwrap()`.","locations":[{"ref":"rustls/src/client/config.rs:304-318","code":"  304 | impl Hasher for HashAdapter<'_> {\n  305 |     fn finish(&self) -> u64 {\n  306 |         // SAFETY: this is private to `SecurityDomain::new`, which guarantees `hash::Output`\n  307 |         // is at least 32 bytes.\n  308 |         u64::from_be_bytes(\n  309 |             self.0.fork_finish().as_ref()[..8]\n  310 |                 .try_into()\n  311 |                 .unwrap(),\n  312 |         )\n  313 |     }\n  314 | \n  315 |     fn write(&mut self, bytes: &[u8]) {\n  316 |         self.0.update(bytes)\n  317 |     }\n  318 | }","lines":15,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/client/config.rs#L304-L318"},{"ref":"rustls/src/client/config.rs:488-516","code":"  488 |         // Use a hash function that outputs at least 32 bytes.\n  489 |         let hash = provider\n  490 |             .iter_cipher_suites()\n  491 |             .map(|cs| cs.hash_provider())\n  492 |             .find(|h| h.output_len() >= 32)\n  493 |             .expect(\"no suitable cipher suite available (with |H| >= 32)\"); // this is -- in practice -- all cipher suites\n  494 | \n  495 |         let mut h = hash.start();\n  496 |         let mut adapter = HashAdapter(h.as_mut());\n  497 | \n  498 |         // Include TypeId of impl, so two different types with different non-configured\n  499 |         // behavior do not collide even if their `hash_config()`s are the same.\n  500 |         client_auth_cert_resolver\n  501 |             .type_id()\n  502 |             .hash(&mut DynHasher(&mut adapter));\n  503 |         client_auth_cert_resolver.hash_config(&mut adapter);\n  504 | \n  505 |         verifier\n  506 |             .type_id()\n  507 |             .hash(&mut DynHasher(&mut adapter));\n  508 |         verifier.hash_config(&mut adapter);\n  509 | \n  510 |         time_provider\n  511 |             .type_id()\n  512 |             .hash(&mut DynHasher(&mut adapter));\n  513 | \n  514 |         let config_hash = h.finish().as_ref()[..32]\n  515 |             .try_into()\n  516 |             .unwrap();","lines":29,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/client/config.rs#L488-L516"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`SharedSecret::strip_leading_zeros` advances `offset` past any leading zero bytes; if the secret\nis all zeros it advances `offset` to `len()`, yielding an empty `secret_bytes()`. For TLS1.2 FFDHE\nthis is the RFC-specified behaviour, but an all-zero (or degenerate) DH shared secret is a sign of\na small-subgroup / invalid peer key; silently producing an empty secret rather than rejecting it\nis fragile. The function relies entirely on the kx implementation having validated the peer key.\nThis is a defense-in-depth observation, not a confirmed vuln.","fix":"Consider treating an all-zero shared secret as an error in `complete_for_tls_version`, since it indicates an invalid/contributory-behaviour-violating key share.","locations":[{"ref":"rustls/src/crypto/kx/mod.rs:614-623","code":"  614 |     fn strip_leading_zeros(&mut self) {\n  615 |         let start = self\n  616 |             .secret_bytes()\n  617 |             .iter()\n  618 |             .enumerate()\n  619 |             .find(|(_i, x)| **x != 0)\n  620 |             .map(|(i, _x)| i)\n  621 |             .unwrap_or_else(|| self.secret_bytes().len());\n  622 |         self.offset += start;\n  623 |     }","lines":10,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/crypto/kx/mod.rs#L614-L623"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`compression_for_impl` releases the cache mutex (line 362 `drop(cache)`) before doing the\nexpensive `compressor.compress(...)`, then re-acquires it to insert. Two concurrent\nconnections that miss on the same key will both compress the identical input and both push\nan entry, producing duplicate cache entries for one logical key (wasting LRU slots and\ndefeating the amortization the cache exists for). The eviction check `if cache.len() == max_size`\nkeeps the total bounded, but the duplicates remain until evicted. This is purely a\nperformance/correctness-of-caching issue, not a memory-safety one.","fix":"After re-acquiring the lock, re-scan for an existing matching entry before pushing the freshly compressed one (return the existing one if a racer inserted it), or hold a per-key in-progress marker.","locations":[{"ref":"rustls/src/compress.rs:351-385","code":"  351 |         let mut cache = entries\n  352 |             .lock()\n  353 |             .map_err(|_| CompressionFailed)?;\n  354 |         for (i, item) in cache.iter().enumerate() {\n  355 |             if item.algorithm == algorithm && item.original == encoding {\n  356 |                 // this item is now MRU\n  357 |                 let item = cache.remove(i).unwrap();\n  358 |                 cache.push_back(item.clone());\n  359 |                 return Ok(item);\n  360 |             }\n  361 |         }\n  362 |         drop(cache);\n  363 | \n  364 |         // do compression:\n  365 |         let uncompressed_len = encoding.len() as u32;\n  366 |         let compressed = compressor.compress(encoding.clone(), CompressionLevel::Amortized)?;\n  367 |         let new_entry = Arc::new(CompressionCacheEntry {\n  368 |             algorithm,\n  369 |             original: encoding,\n  370 |             compressed: CompressedCertificatePayload {\n  371 |                 alg: algorithm,\n  372 |                 uncompressed_len,\n  373 |                 compressed: SizedPayload::from(Payload::new(compressed)),\n  374 |             },\n  375 |         });\n  376 | \n  377 |         // insert into cache\n  378 |         let mut cache = entries\n  379 |             .lock()\n  380 |             .map_err(|_| CompressionFailed)?;\n  381 |         if cache.len() == max_size {\n  382 |             cache.pop_front();\n  383 |         }\n  384 |         cache.push_back(new_entry.clone());\n  385 |         Ok(new_entry)","lines":35,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/compress.rs#L351-L385"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`prepare_read` calls `self.buf.resize(need_capacity, 0)` to grow the read buffer, zero-initializing the newly added bytes on every read that grows the buffer. The bytes are about to be overwritten by `rd.read(&mut self.buf[self.used..])`, so the zeroing is wasted work on the hot receive path. For 4K growth steps this is a memset per read.","fix":"Use `reserve`/`set_len` with care, or track an initialized-length watermark, to avoid re-zeroing buffer space that is immediately filled by the socket read. Alternatively use `Vec::resize` only when genuinely extending past previously-initialized capacity.","locations":[{"ref":"rustls/src/conn/receive.rs:837-843","code":"  837 |         let need_capacity = Ord::min(MAX_HANDSHAKE_SIZE, self.used + READ_SIZE);\n  838 |         if need_capacity > self.buf.len() {\n  839 |             self.buf.resize(need_capacity, 0);\n  840 |         } else if self.used == 0 || self.buf.len() > MAX_HANDSHAKE_SIZE {\n  841 |             self.buf.resize(need_capacity, 0);\n  842 |             self.buf.shrink_to(need_capacity);\n  843 |         }","lines":7,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/conn/receive.rs#L837-L843"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`compressed_exts.clone()` clones the whole vector of to-be-compressed extension types only to assign one copy to `inner_hello.contiguous_extensions` and pass the other (`compressed_exts`) by value to `ech_inner_encoding`. The clone is avoidable since `compressed_exts` is not used after the `ech_inner_encoding` call except via the field already assigned.","fix":"Assign `inner_hello.contiguous_extensions = compressed_exts.clone()` only if needed elsewhere; otherwise set the field and pass a reference, or reorder so a single move suffices.","locations":[{"ref":"rustls/src/client/ech.rs:718","code":"  718 |         inner_hello.contiguous_extensions = compressed_exts.clone();","lines":1,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/client/ech.rs#L718"},{"ref":"rustls/src/client/ech.rs:748","code":"  748 |         let mut encoded_hello = inner_hello.ech_inner_encoding(compressed_exts);","lines":1,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/client/ech.rs#L748"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`HelloRetryRequestExtensions::read` allocates a `Vec` (`order`) on every parse to record\nextension decoding order, even though it is only needed for the rare ECH HRR\nconfirmation round-trip. For the common HRR this is a needless heap allocation in the\nparse path.","fix":"Only build/retain the order vector when ECH/round-trip re-encoding is actually required, or reserve based on a small expected count.","locations":[{"ref":"rustls/src/msgs/handshake.rs:466-486","code":"  466 |     fn read(r: &mut Reader<'a>) -> Result<Self, InvalidMessage> {\n  467 |         let mut out = Self::default();\n  468 | \n  469 |         // we must record order, so re-encoding round trips.  this is needed,\n  470 |         // unfortunately, for ECH HRR confirmation\n  471 |         let mut order = vec![];\n  472 | \n  473 |         let len = usize::from(u16::read(r)?);\n  474 |         let mut sub = r.sub(len)?;\n  475 | \n  476 |         while sub.any_left() {\n  477 |             let typ = out.read_one(&mut sub, |_unk| {\n  478 |                 Err(InvalidMessage::UnknownHelloRetryRequestExtension)\n  479 |             })?;\n  480 | \n  481 |             order.push(typ);\n  482 |         }\n  483 | \n  484 |         out.order = Some(order);\n  485 |         Ok(out)\n  486 |     }","lines":21,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/msgs/handshake.rs#L466-L486"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`ServerSessionMemoryCache::put` allocates a fresh `Vec<u8>` for every stored key via\n`key.as_ref().to_vec()`, and `LimitedCache` itself \"stores keys twice\" (per its own doc comment).\nFor session keys this is unavoidable for ownership, but combined with the double-storage in\n`LimitedCache` it is worth noting that each server-side session insert performs at least two key\nallocations/copies on a hot resumption path.","fix":"Consider an `Arc<[u8]>`-keyed cache or a single-storage LRU to avoid duplicating the key bytes on every put.","locations":[{"ref":"rustls/src/server/handy.rs:54-60","code":"   54 |         fn put(&self, key: ServerSessionKey<'_>, value: Vec<u8>) -> bool {\n   55 |             self.cache\n   56 |                 .lock()\n   57 |                 .unwrap()\n   58 |                 .insert(key.as_ref().to_vec(), value);\n   59 |             true\n   60 |         }","lines":7,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/server/handy.rs#L54-L60"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"`start_resumption` takes `resumption_data: Vec<u8>` by value and clones it via\n`.to_vec()` into the `HandshakeState`, while the original `Vec` is moved into\n`emit_ticket` later. The clone is only needed because the same data is consumed\ntwice; restructuring to clone only when a ticket is actually emitted (the\n`send_ticket && ticketer.is_some()` branch) would avoid an allocation on the\ncommon no-ticket resumption path.","fix":"Move `resumption_data` into HandshakeState directly and clone it into emit_ticket only when a ticket is sent, or vice versa, to avoid the unconditional extra allocation.","locations":[{"ref":"rustls/src/server/tls12.rs:346","code":"  346 |             resumption_data: resumption_data.to_vec(),","lines":1,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/server/tls12.rs#L346"},{"ref":"rustls/src/server/tls12.rs:368-384","code":"  368 |         if send_ticket {\n  369 |             let now = hs.config.current_time()?;\n  370 | \n  371 |             if let Some(ticketer) = hs.config.ticketer.as_deref() {\n  372 |                 emit_ticket(\n  373 |                     &secrets,\n  374 |                     &mut hs.transcript,\n  375 |                     using_ems,\n  376 |                     resumedata.common.peer_identity.as_ref(),\n  377 |                     hs.alpn_protocol.as_ref(),\n  378 |                     hs.sni.as_ref(),\n  379 |                     resumption_data,\n  380 |                     output,\n  381 |                     ticketer,\n  382 |                     now,\n  383 |                 )?;\n  384 |             }","lines":17,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/server/tls12.rs#L368-L384"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`ChunkVecBuffer::len()` recomputes the total byte count by iterating and folding over every chunk on each call. It is invoked on the read hot path (e.g. `is_full`, `apply_limit`, `current_io_state`, `wants_read`). With many small chunks this is O(n) per query. A cached running total updated on append/consume would make these O(1).","fix":"Maintain a cached `total_len` field updated in `append`/`consume`/`pop`/`take`, and return it (minus accounting already folded in) from `len()`.","locations":[{"ref":"rustls/src/vecbuf.rs:34-39","code":"   34 |     pub(crate) fn len(&self) -> usize {\n   35 |         self.chunks\n   36 |             .iter()\n   37 |             .fold(0usize, |acc, chunk| acc + chunk.len())\n   38 |             - self.prefix_used\n   39 |     }","lines":6,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/vecbuf.rs#L34-L39"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`randoms.server` is already filled by `ConnectionRandoms::new(st.input.random, server_hello.random)` (which copies `server_hello.random.0` into the `server` field). The subsequent `clone_from_slice(&server_hello.random.0[..])` copies the exact same bytes again, so it is a redundant no-op.","fix":"Remove the `randoms.server.clone_from_slice(&server_hello.random.0[..]);` statement; `ConnectionRandoms::new` already sets it.","locations":[{"ref":"rustls/src/client/tls12.rs:103-106","code":"  103 |             let mut randoms = ConnectionRandoms::new(st.input.random, server_hello.random);\n  104 |             randoms\n  105 |                 .server\n  106 |                 .clone_from_slice(&server_hello.random.0[..]);","lines":4,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/client/tls12.rs#L103-L106"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"In `VecInput::discard`, the second arm `else if taken >= self.used` is a redundant guard: it is the exact logical negation of the `if taken < self.used` condition, so it is always true when reached. The condition adds a needless branch test and obscures that this is simply the `else` case.","fix":"Replace `} else if taken >= self.used {` with a plain `} else {`.","locations":[{"ref":"rustls/src/conn/receive.rs:763-782","code":"  763 |         if taken < self.used {\n  764 |             /* Before:\n  765 |              * +----------+----------+----------+\n  766 |              * | taken    | pending  |xxxxxxxxxx|\n  767 |              * +----------+----------+----------+\n  768 |              * 0          ^ taken    ^ self.used\n  769 |              *\n  770 |              * After:\n  771 |              * +----------+----------+----------+\n  772 |              * | pending  |xxxxxxxxxxxxxxxxxxxxx|\n  773 |              * +----------+----------+----------+\n  774 |              * 0          ^ self.used\n  775 |              */\n  776 | \n  777 |             self.buf\n  778 |                 .copy_within(taken..self.used, 0);\n  779 |             self.used -= taken;\n  780 |         } else if taken >= self.used {\n  781 |             self.used = 0;\n  782 |         }","lines":20,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/conn/receive.rs#L763-L782"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"`Ord::max(0, max_name_len.saturating_sub(name.as_ref().len()))` is redundant: `saturating_sub` on `usize` already returns a value `>= 0`, so the `Ord::max(0, ...)` wrapper can never change the result. It restates the RFC's `max(0, L - D)` formula but the floor is already guaranteed by the unsigned saturating subtraction.","fix":"Replace with `max_name_len.saturating_sub(name.as_ref().len())` (keep a brief comment referencing the RFC's max(0, L-D) intent).","locations":[{"ref":"rustls/src/client/ech.rs:755-760","code":"  755 |         let name_padding_len = match &inner_hello.server_name {\n  756 |             Some(ServerNamePayload::SingleDnsName(name)) => {\n  757 |                 // name.len() = D\n  758 |                 // max(0, L - D)\n  759 |                 Ord::max(0, max_name_len.saturating_sub(name.as_ref().len()))\n  760 |             }","lines":6,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/client/ech.rs#L755-L760"}]},
{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"`EncodedMessage::<OutboundPlain>::encoded_len` is annotated `#[expect(dead_code)]`, indicating it\nis currently unused. Dead code in the crypto record layer should either be wired up or removed to\navoid maintenance drift and accidental future misuse.","fix":"Remove the unused method, or use it where record length is computed and drop the `#[expect(dead_code)]`.","locations":[{"ref":"rustls/src/crypto/cipher/messages.rs:160-163","code":"  160 |     #[expect(dead_code)]\n  161 |     pub(crate) fn encoded_len(&self, record_layer: &EncryptionState) -> usize {\n  162 |         HEADER_SIZE + record_layer.encrypted_len(self.payload.len())\n  163 |     }","lines":4,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/crypto/cipher/messages.rs#L160-L163"}]},
{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"`EarlyDataState::peek` and `EarlyDataState::pop` on the server are both annotated `#[expect(dead_code)]`\nand are never called. They are carried purely to satisfy lints. Dead code in a security-sensitive crate\nadds maintenance surface and may mask intent.","fix":"Remove `peek` and `pop` unless a near-term caller is planned.","locations":[{"ref":"rustls/src/server/connection.rs:547-561","code":"  547 |     #[expect(dead_code)]\n  548 |     fn peek(&self) -> Option<&[u8]> {\n  549 |         match self {\n  550 |             Self::Accepted { received, .. } => received.peek(),\n  551 |             _ => None,\n  552 |         }\n  553 |     }\n  554 | \n  555 |     #[expect(dead_code)]\n  556 |     fn pop(&mut self) -> Option<Vec<u8>> {\n  557 |         match self {\n  558 |             Self::Accepted { received, .. } => received.pop(),\n  559 |             _ => None,\n  560 |         }\n  561 |     }","lines":15,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/server/connection.rs#L547-L561"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The `coalesce()` doc-comment references functions `requires_coalesce` and `coalesce_one` that do not exist in the codebase. The logic was consolidated into `coalesce()` itself; the worked example narration is stale and misleads readers trying to find the named helpers.","fix":"Reword the example to describe what `coalesce()` actually does (find the first incomplete span, move the following span to be contiguous, re-dissect) instead of naming non-existent `requires_coalesce`/`coalesce_one` helpers.","locations":[{"ref":"rustls/src/msgs/deframer/mod.rs:192-193","code":"  192 |     /// In this case, `requires_coalesce` returns `Some(0)`.  Then\n  193 |     /// `coalesce_one` moves the second range leftwards:","lines":2,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/msgs/deframer/mod.rs#L192-L193"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"The comment in `KeyScheduleEarly::client_early_traffic_secret` (\"If 0-RTT should be rejected,\nthis will be clobbered by ExtensionProcessing before the application can see\") describes\nclient-side behavior, but this same code path is also reached on the server side via\n`KeyScheduleEarlyServer::client_early_traffic_secret`. On the server the QUIC `early_secret`\nslot is populated too, and the comment's claim about `ExtensionProcessing` clobbering only\nmakes sense for the client. The comment is misleading about which side(s) execute it.","fix":"Clarify the comment to state the behavior for both client and server, or move the QUIC early_secret installation so the comment accurately reflects the side it applies to.","locations":[{"ref":"rustls/src/tls13/key_schedule.rs:129-136","code":"  129 |         if let Some(quic) = output.quic() {\n  130 |             // If 0-RTT should be rejected, this will be clobbered by ExtensionProcessing\n  131 |             // before the application can see.\n  132 |             quic.early_secret(Some(client_early_traffic_secret.clone()));\n  133 |         }\n  134 | \n  135 |         client_early_traffic_secret\n  136 |     }","lines":8,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/tls13/key_schedule.rs#L129-L136"},{"ref":"rustls/src/tls13/key_schedule.rs:62-78","code":"   62 |     /// Computes the `client_early_traffic_secret` and installs it as decrypter.\n   63 |     pub(crate) fn client_early_traffic_secret(\n   64 |         &self,\n   65 |         hs_hash: &hash::Output,\n   66 |         key_log: &dyn KeyLog,\n   67 |         client_random: &[u8; 32],\n   68 |         output: &mut dyn Output<'_>,\n   69 |         proof: &HandshakeAlignedProof,\n   70 |     ) {\n   71 |         self.0.ks.set_decrypter(\n   72 |             &self\n   73 |                 .0\n {"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The test is named `tls13_empty_signature_mapping_panics` and its inline comment says\n\"never parsed; panic happens first\", but `verify_tls13_signature` does not panic on an\nempty scheme mapping: line 132-137 uses `.first().ok_or(ApiMisuse::NoSignatureVerificationAlgorithms)`,\nreturning an `Err` rather than panicking. The test body itself asserts `unwrap_err()` equals\nthat error. The name and comment are stale/misleading and could lead a future reader to\nbelieve an empty mapping is a panic hazard (and to \"fix\" it by reintroducing one).","fix":"Rename the test to e.g. `tls13_empty_signature_mapping_errors` and remove the 'panic happens first' comment.","locations":[{"ref":"rustls/src/webpki/verify.rs:206-228","code":"  206 |     #[test]\n  207 |     fn tls13_empty_signature_mapping_panics() {\n  208 |         let supported = WebPkiSupportedAlgorithms {\n  209 |             all: TEST_PROVIDER\n  210 |                 .signature_verification_algorithms\n  211 |                 .all,\n  212 |             mapping: &[(SignatureScheme::ED25519, &[])],\n  213 |         };\n  214 | \n  215 |         let cert = CertificateDer::from(vec![0u8]); // never parsed; panic happens first\n  216 |         let dss = DigitallySignedStruct::new(SignatureScheme::ED25519, vec![]);\n  217 |         let signer = SignerPublicKey::X509(&cert);\n  218 |         let input = SignatureVerificationInput {\n  219 |             message: b\"hello\",\n  220 |             signer: &signer,\n  221 |             signature: &dss,\n  222 |         };\n  223 | \n  224 |         assert_eq!(\n  225 |             verify_tls13_signature(&input, &supported).unwrap_err(),\n  226 |             Error::ApiMisuse(ApiMisuse::NoSignatureVerificationAlgorithms)\n  227 |         );\n  228 |     }","lines":23,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/ru {"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"The comment block (lines 87-93) on `early_data_key_schedule` says \"If this is `None` then we do not support early data.\" but the field type is `Option<(KeyScheduleEarlyClient, bool)>` and is also `None` in the common non-resumption / no-PSK case (see tls13.rs / hs.rs where it is left `None` whenever there is no TLS1.3 PSK to resume), not only when early data is unsupported. The comment overstates the meaning of `None`.","fix":"Reword the comment to: `None` when there is no resumption PSK / early-data key schedule to carry (e.g. full handshake, or early data unsupported).","locations":[{"ref":"rustls/src/client/hs.rs:99-106","code":"   99 |     // The key schedule for sending early data.\n  100 |     //\n  101 |     // If the server accepts the PSK used for early data then\n  102 |     // this is used to compute the rest of the key schedule.\n  103 |     // Otherwise, it is thrown away.\n  104 |     //\n  105 |     // If this is `None` then we do not support early data.\n  106 |     pub(super) early_data_key_schedule: Option<(KeyScheduleEarlyClient, bool)>,","lines":8,"link":"https://github.com/rustls/rustls/blob/9be8fa6bc5e5fcdb164067d0f67cd18a43a3833a/rustls/src/client/hs.rs#L99-L106"}]},

{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"The `LimitedCache` doc comment claims \"This implementation uses all the allocated storage\"\nand the eviction logic keys on `self.oldest.capacity()` rather than the requested\n`capacity_order_of_magnitude`. Because `VecDeque::with_capacity`/`HashMap::with_capacity`\nmay round the capacity up, the effective cache size silently exceeds the value the caller\nasked for (potentially by a large rounding factor for the hash map). This is intentional per\nthe comment, but the divergence between \"requested capacity\" and \"actual capacity\" is a\nsubtle gotcha for callers sizing security-sensitive caches (e.g. session caches) and is not\nflagged at the call sites.","fix":"Document on `new` that the effective capacity may be rounded up, or track and enforce the requested capacity explicitly instead of relying on `oldest.capacity()`.","locations":[{"ref":"rustls/src/limited_cache.rs:8-30","code":"    8 | /// A HashMap-alike, which never gets larger than a specified\n    9 | /// capacity, and evicts the oldest insertion to maintain this.\n   10 | ///\n   11 | /// The requested capacity may be rounded up by the underlying\n   12 | /// collections.  This implementation uses all the allocated\n   13 | /// storage.\n   14 | ///\n   15 | /// This is inefficient: it stores keys twice.\n   16 | pub(crate) struct LimitedCache<K, V> {\n   17 |     map: HashMap<K, V>,\n   18 | \n   19 |     // first item is the oldest key\n   20 |     oldest: VecDeque<K>,\n   21 | }\n   22 | \n   23 | impl<K: Eq + Hash + Clone + Debug, V> LimitedCache<K, V> {\n   24 |     /// Create a new LimitedCache with the given rough capacity.\n   25 |     pub(crate) fn new(capacity_order_of_magnitude: usize) -> Self {\n   26 |         Self {\n   27 |             map: HashMap::with_capacity(capacity_order_of_magnitude),\n   28 |             oldest: VecDeque::with_capacity(capacity_orde <script>
(function(){
'use strict';

// Data
const FINDINGS     = JSON.parse(document.getElementById('D').textContent);

const SEVS     = ['critical','high','medium','low','negligible'];

const PRESENT_SEVS = SEVS.filter(s => FINDINGS.some(f => (f.severity || 'medium') === s));
// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.
const DIFFICULTY_ORDER = ['very_easy','easy','medium','hard'];
const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};
const PRESENT_DIFFS = DIFFICULTY_ORDER.filter(d => FINDINGS.some(f => f.difficulty === d));
const HAS_DIFFICULTY = PRESENT_DIFFS.length > 0;
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State

  search: '', searchScope: 'all', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenDiff: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(),
};
const statuses = {};

// Persistence
function loadStatuses() {

}
function saveStatuses() {

}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;

    const p = new URLSearchParams();

    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));
    if (S.search)            p.set('q',   S.search);
    if (S.searchScope !== 'all') p.set('qs', S.searchScope);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('qs'))  { S.searchScope = p.get('qs'); }
  document.getElementById('search-scope').classList.toggle('active', S.searchScope === 'locations');
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
