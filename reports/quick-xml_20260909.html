<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`Attributes::new(buf, pos)` / `Attributes::html(buf, pos)` panic with an out-of-range\nslice index when `pos > buf.len()`, even though the documentation of both constructors\nexplicitly states: \"If it will be more than the buf length, then the iterator will\nreturn None immediately.\" The first call to `next()` reaches `IterState::next`, which\ndoes `(offset..).zip(slice[offset..].iter())`; with `offset == pos > slice.len()` the\nexpression `slice[offset..]` panics (\"range start index N out of range for slice of\nlength M\"). This was verified to panic at runtime via the public API:\n`Attributes::new(\"ab\", 100).next()` panics at attributes.rs:1115. The same out-of-range\nposition flows in through the public `Attributes::wrap`/`new`/`html` and any code that\nconstructs `BytesStart::from_content(content, name_len)` with `name_len > content.len()`\nand then calls `.attributes()`. Reader-produced events are not affected because the\nreader always supplies a valid `name_len`, but the documented public contract is violated.","fix":"Clamp the starting offset to the slice length (or return `None`) before slicing in\n`IterState::next` / `IterState::recover`, e.g. at the top of `next()`:\n`let offset = self.recover(slice)?; if offset > slice.len() { self.state = State::Done; return None; }`\nand use `slice.get(offset..)` instead of `slice[offset..]`. This restores the documented\n\"return None immediately\" behavior instead of panicking.","locations":[{"ref":"src/events/attributes.rs:1123-1127","code":" 1123 |     pub fn next(&mut self, slice: &[u8]) -> Option<AttrResult> {\n 1124 |         let mut iter = match self.recover(slice) {\n 1125 |             Some(offset) => (offset..).zip(slice[offset..].iter()),\n 1126 |             None => return None,\n 1127 |         };","lines":5,"link":"https://github.com/tafia/quick-xml/blob/2eaa844b4b40117fb7ed4d1f512ede918125aeab/src/events/attributes.rs#L1123-L1127"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"`Fountain::read` calls `buf.copy_from_slice(portion)` where `portion` has length\n`len = buf.len().min(available.len())`. When `buf.len() > available.len()` (the caller's buffer is\nlarger than the remaining unconsumed chunk), `portion` is shorter than `buf` and `copy_from_slice`\npanics because it requires source and destination slices to have equal length. Fountain is a public\ntest/integration helper (utils is `#[doc(hidden)] pub mod utils`) and is documented as a producer of\nan infinite stream, so a caller using a buffer larger than the configured chunk will hit a panic.","fix":"Copy only into the matching prefix of the destination buffer:\n`buf[..len].copy_from_slice(portion);` (and the `split_at`/`portion` binding can be replaced with\n`&available[..len]`).","locations":[{"ref":"src/utils.rs:255-263","code":"  255 | impl<'a> io::Read for Fountain<'a> {\n  256 |     fn read(&mut self, buf: &mut [u8]) -> io::Result<usize> {\n  257 |         let available = &self.chunk[self.consumed..];\n  258 |         let len = buf.len().min(available.len());\n  259 |         let (portion, _) = available.split_at(len);\n  260 | \n  261 |         buf.copy_from_slice(portion);\n  262 |         Ok(len)\n  263 |     }","lines":9,"link":"https://github.com/tafia/quick-xml/blob/2eaa844b4b40117fb7ed4d1f512ede918125aeab/src/utils.rs#L255-L263"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`DecodingReader::set_encoding` panics (via `assert!`) if called after the prefix buffer has been drained. Because the prefix is only `PREFIX_CAP` (64) bytes, an XML declaration longer than 64 bytes (e.g. with extra whitespace or a long `version`/`standalone` spelling) can be consumed past the prefix before the caller has a chance to parse the declaration and call `set_encoding`, turning a legitimate \"switch to declared encoding\" call into a panic. This is reachable from the documented usage pattern (parse `<?xml ... encoding=...?>`, then call `set_encoding`).","fix":"Avoid panicking on untrusted input. Either return a `Result`/error from `set_encoding` instead of asserting, or grow the prefix buffer so it is guaranteed to cover any legal XML declaration, or keep the prefix alive until the first non-declaration event. At minimum, the 64-byte cap should be documented as a hard limit on declaration length and the panic converted to a recoverable error.","locations":[{"ref":"src/encoding.rs:373-387","code":"  373 |     pub fn set_encoding(&mut self, encoding: &'static encoding_rs::Encoding) {\n  374 |         // No-op when the encoding matches - replacing the decoder would discard\n  375 |         // its internal state (e.g. a partial multi-byte sequence), corrupting output.\n  376 |         // This check is safe regardless of prefix state since nothing changes.\n  377 |         if self.decoder.encoding() == encoding {\n  378 |             return;\n  379 |         }\n  380 |         assert!(\n  381 |             self.prefix.is_some(),\n  382 |             \"set_encoding() called after prefix buffer was drained; \\\n  383 |              encoding can only be changed while the prefix is still active\"\n  384 |         );\n  385 |         self.decoder = encoding.new_decoder_without_bom_handling();\n  386 |         self.decoder_finished = false;\n  387 |     }","lines":15,"link":"https://github.com/tafia/quick-xml/blob/2eaa844b4b40117fb7ed4d1f512ede918125aeab/src/encoding.rs#L373-L387"},{"ref":"src/encoding.rs:217-218","code":"  217 | #[cfg(feature = \"encoding\")]\n  218 | const PREFIX_CAP: usize = 64;","lines":2,"link":"https://github.com/tafia/quick-xml/blob/2eaa844b4b40117fb7ed4d1f512ede918125aeab/src/encoding.rs#L217-L218"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`Writer::write_serializable` calls `self.write_indent()` (emitting a newline + current indent)\nbefore serializing, but does not update `indent.should_line_break`. After this call returns, the\nindent state's `should_line_break` retains whatever value the previous `write_event` left it at, so\na subsequent `write_event` (e.g. the closing `End`) may emit an additional, possibly unexpected\nnewline/indent relative to content written directly via events. The documented example happens to\nproduce the intended output, but mixing `write_serializable` with manual events can yield\ninconsistent indentation because the line-break heuristic state is not synchronized.","fix":"After writing the serializable content, set `self.indent`'s `should_line_break` consistently with\nhow a normal element write would leave it (typically `true`), so following events indent predictably.","locations":[{"ref":"src/writer.rs:394-413","code":"  394 |     #[cfg(feature = \"serialize\")]\n  395 |     pub fn write_serializable<T: Serialize>(\n  396 |         &mut self,\n  397 |         tag_name: &str,\n  398 |         content: &T,\n  399 |     ) -> Result<(), SeError> {\n  400 |         use crate::se::{Indent, Serializer};\n  401 | \n  402 |         self.write_indent()?;\n  403 |         let mut fmt = ToFmtWrite(&mut self.writer);\n  404 |         let mut serializer = Serializer::with_root(&mut fmt, Some(tag_name))?;\n  405 | \n  406 |         if let Some(indent) = &mut self.indent {\n  407 |             serializer.set_indent(Indent::Borrow(indent));\n  408 |         }\n  409 | \n  410 |         content.serialize(serializer)?;\n  411 | \n  412 |         Ok(())\n  413 |     }","lines":20,"link":"https://github.com/tafia/quick-xml/blob/2eaa844b4b40117fb7ed4d1f512ede918125aeab/src/writer.rs#L394-L413"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"medium","description":"The HTML5 entity lookup table (`resolve_html5_entity`, behind the `escape-html` feature) contains ~133 corrupted entries spanning the Mathematical Alphanumeric Symbols block. Every `\\u{...}` value in this run has had its final hex digit truncated, turning 5-digit codepoints (U+1D4xx / U+1D5xx) into 4-digit ones. For example `Ascr` maps to `\\u{1D49}` (U+1D49 'ᵉ' MODIFIER LETTER SMALL E) instead of the correct `\\u{1D49C}` ('𝒜' MATHEMATICAL SCRIPT CAPITAL A); `Aopf` maps to `\\u{1D53}` instead of `\\u{1D538}` ('𝔸'); `Afr` maps to `\\u{1D50}` instead of `\\u{1D504}` ('𝔄'). Because the last digit was dropped, many distinct entities now collapse onto the same wrong codepoint (e.g. `Ascr`, `Cscr`, `Dscr` all -> `\\u{1D49}`), so the script/fraktur/double-struck math entities silently decode to completely wrong characters. This is a real correctness bug for any consumer that unescapes HTML5 entities. The values are wrong, not merely large data.","fix":"Regenerate this block from the authoritative source (https://html.spec.whatwg.org/entities.json). Each entry needs its missing trailing hex digit restored, e.g. `b\"Ascr\" => \"\\u{1D49C}\"`, `b\"Aopf\" => \"\\u{1D538}\"`, `b\"Afr\" => \"\\u{1D504}\"`, and so on across the whole U+1D49x..U+1D56x range. The collapsing of multiple distinct keys onto one value confirms the data is corrupt and must be rebuilt rather than hand-patched. Add a test that decodes a handful of these entities and asserts the exact expected character to prevent regressions.","locations":[{"ref":"src/escape.rs:2225-2357","code":" 2225 |         b\"Ascr\" => \"\\u{1D49}\",\n 2226 |         b\"Cscr\" => \"\\u{1D49}\",\n 2227 |         b\"Dscr\" => \"\\u{1D49}\",\n 2228 |         b\"Gscr\" => \"\\u{1D4A}\",\n 2229 |         b\"Jscr\" => \"\\u{1D4A}\",\n 2230 |         b\"Kscr\" => \"\\u{1D4A}\",\n 2231 |         b\"Nscr\" => \"\\u{1D4A}\",\n 2 {"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"hard","description":"The four byte-scanning parsers disagree on what the returned index means, and the DTD\nparser compensates inconsistently. `CommentParser::feed` returns the position AFTER the\n`-->` terminator, while `ElementParser::feed` and `PiParser::feed` return the index OF\nthe `>` byte. In `DtdParser::feed` this is handled with two different advance idioms in\notherwise identical-looking arms: the `InComment` arm does `cur = &cur[i..]` (correct,\nbecause the comment parser already points past `-->`), but the `InPi` and\n`InQuoteSensitive` arms also do `cur = &cur[i..]` even though those parsers return the\nindex of the (still unconsumed) `>`. As a result a `>` byte is left in `cur` and\nre-scanned by the following `InsideOfInternalSubset` state. It is currently harmless\nbecause a stray `>` is not significant inside the internal subset, but the asymmetric\n\"+0 vs +1\" handling of structurally-identical arms is a copy-paste hazard: a future\nchange to comment-parser semantics, or treating `>` as significant, would silently break\none arm but not the others.","fix":"Make all `Parser::feed` implementations agree on a single convention for the returned\nindex (preferably \"position of the byte that ends the construct\", matching\n`ElementParser`/`PiParser`), and adjust `DtdParser`'s arms to consume consistently (e.g.\n`cur = &cur[i + 1..]` for parsers that return the index of `>`). Document the chosen\nconvention on the `Parser` trait so the arms can no longer drift apart.","locations":[{"ref":"src/parser/dtd.rs:165-203","code":"  165 |                 Self::InComment(ref mut parser) => {\n  166 |                     // If comment is ended, return to the main state, otherwise keep in the current state\n  167 |                     if let Some(i) = parser.feed(cur) {\n  168 |                         *self = Self::InsideOfInternalSubset;\n  169 |                         cur = &cur[i..];\n  170 |                         continue;\n  171 |                     }\n  172 |                     break;\n  173 |                 }\n  174 |                 Self::InPi(ref mut parser) => {\n  175 |                     // If processing instruction is ended, return to the main state,\n  176 |                     // otherwise keep in the current state\n  177 |                     if let Some(i) = parser.feed(cur) {\n  178 |                         *self = Self::InsideOfInternalSubset;\n  179 |                         cur = &cur[i..];\n  180 |                         continue;\n  181 |                     }\n  182 |                     break;\n  183 |                 }\n  184 |                 Self::InElementDecl => {\n  185 |                     // `<!ELEMENT >` does not have places where `>` could be escaped\n  186 |                     // so the first occurrence ends that state\n  187 |                     if let Some(i) = memchr::memchr(b'>', cur) {\n  188 |                         *self = Self::InsideOfInternalSubset;\n  189 |                         cur = &cur[i + 1..]; // +1 for `>`\n  190 |                         continue;\n  191 |                     }\n  192 |                     break;\n  193 |                 }\n  194 |                 Self::InQuoteSensitive(ref mut parser) => {\n  195 |                     // If ATTLIST, ENTITY or NOTATION is ended, return to the main state,\n  196 |                     // otherwise keep in the current state\n  197 |                     if let Some(i) = parser.feed(cur) {\n  198 |                         *self = Self::InsideOfInternalSubset;\n  199 |                         cur = &cur[i..];\n  200 |                         continue;\n  201 |                     }\n  202 |                     break;\n  203 |                 }","lines":39,"link":"https://github.com/tafia/quick-xml/blob/2eaa844b4b40117fb7ed4d1f512ede918125aeab/src/parser/dtd.rs#L165-L203"},{"ref":"src/parser/comment.rs:106-115","code":"  106 | #[inline]\n  107 | fn seen0(bytes: &[u8]) -> Option<usize> {\n  108 |     for i in memchr::memchr_iter(b'>', bytes) {\n  109 |         if bytes[..i].ends_with(b\"--\") {\n  110 |             // +1 for `>` which should be included in event\n  111 |             return Some(i + 1);\n  112 |         }\n  113 |     }\n  114 |     None\n  115 | }","lines":10,"link":"https://github.com/tafia/quick-xml/blob/2eaa844b4b40117fb7ed4d1f512ede918125aeab/src/parser/comment.rs#L106-L115"},{"ref":"src/parser/element.rs:54-73","code":"   54 | impl Parser for ElementParser {\n   55 |     /// Returns number of consumed bytes or `None` if `>` was not found in `bytes`.\n   56 |     #[inline]\n   57 |     fn feed(&mut self, bytes: &[u8]) -> Option<usize> {\n   58 |         for i in memchr::memchr3_iter(b'>', b'\\'', b'\"', bytes) {\n   59 |             *self = match (*self, bytes[i]) {\n   60 |                 // only allowed to match `>` while we are in state `Outside`\n   61 |                 (Self::Outside, b'>') => return Some(i),\n   62 |                 (Self::Outside, b'\\'') => Self::SingleQ,\n   63 |                 (Self::Outside, b'\\\"') => Self::DoubleQ,\n   64 | \n   65 |                 // the only end_byte that gets us out if the same character\n   66 |                 (Self::SingleQ, b'\\'') | (Self::DoubleQ, b'\"') => Self::Outside,\n   67 | \n   68 |                 // all other bytes: no state change\n   69 |                 _ => continue,\n   70 |             };\n   71 |         }\n   72 |         None\n   73 |     }","lines":20,"link":"https://github.com/tafia/quick-xml/blob/2eaa844b4b40117fb7ed4d1f512ede918125aeab/src/parser/element.rs#L54-L73"},{"ref":"src/parser/pi.rs:62-73","code":"   62 |     fn feed(&mut self, bytes: &[u8]) -> Option<usize> {\n   63 |         for i in memchr::memchr_iter(b'>', bytes) {\n   64 |             match i {\n   65 |                 0 if self.0 => return Some(0),\n   66 |                 // If the previous byte is `?`, then we found `?>`\n   67 |                 i if i > 0 && bytes[i - 1] == b'?' => return Some(i),\n   68 |                 _ => {}\n   69 |             }\n   70 |         }\n   71 |         self.0 = bytes.last().copied() == Some(b'?');\n   72 |         None\n   73 |     }","lines":12,"link":"https://github.com/tafia/quick-xml/blob/2eaa844b4b40117fb7ed4d1f512ede918125aeab/src/parser/pi.rs#L62-L73"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`TagFilter::Include` stores an entire cloned `BytesStart` (with all its attribute bytes) just to\nlater compare names via `n.name() == start.name()`. The code itself flags this with\n`//TODO: Need to store only name instead of a whole tag`. For sequences of elements with many/long\nattributes this clones and retains far more data than necessary for the lifetime of the seq\ndeserialization. When the event is owned (IoReader path) the clone is a full heap copy of the tag\nbuffer per sequence.","fix":"Store only the tag name needed for comparison (e.g. a `Cow<'de, [u8]>` of `e.name()` or an owned\n`Vec<u8>`/`Box<[u8]>`), not the whole `BytesStart`, in `TagFilter::Include`.","locations":[{"ref":"src/de/map.rs:838-861","code":"  838 | enum TagFilter<'de> {\n  839 |     /// A `SeqAccess` interested only in tags with specified name to deserialize\n  840 |     /// an XML like this:\n  841 |     ///\n  842 |     /// ```xml\n  843 |     /// <...>\n  844 |     ///   <tag/>\n  845 |     ///   <tag/>\n  846 |     ///   <tag/>\n  847 |     ///   ...\n  848 |     /// <\/...>\n  849 |     /// ```\n  850 |     ///\n  851 |     /// The tag name is stored inside (`b\"tag\"` for that example)\n  852 |     Include(BytesStart<'de>), //TODO: Need to store only name instead of a whole tag\n  853 |     /// A `SeqAccess` interested in tags with any name, except explicitly listed.\n  854 |     /// Excluded tags are used as struct field names and therefore should not\n  855 |     /// fall into a `$value` category.\n  856 |     ///\n  857 |     /// The `bool` represents the having of a `$text` special field in fields array.\n  858 |     /// It is used to exclude text events when `$text` fields is defined together with\n  859 |     /// `$value` fieldб and `$value` accepts sequence.\n  860 |     Exclude(&'static [&'static str], bool),\n  861 | }","lines":24,"link":"https://github.com/tafia/quick-xml/blob/2eaa844b4b40117fb7ed4d1f512ede918125aeab/src/de/map.rs#L838-L861"},{"ref":"src/de/map.rs:605-613","code":"  605 |         let filter = if self.fixed_name {\n  606 |             match self.map.de.peek()? {\n  607 |                 // Clone is cheap if event borrows from the input\n  608 |                 DeEvent::Start(e) => TagFilter::Include(e.clone()),\n  609 |                 // SAFETY: we use that deserializer with `fixed_name == true`\n  610 |                 // only from the `ElementMapAccess::next_value_seed` and only when we\n  611 |                 // peeked `Start` event\n  612 |                 _ => unreachable!(),\n  613 |             }","lines":9,"link":"https://github.com/tafia/quick-xml/blob/2eaa844b4b40117fb7ed4d1f512ede918125aeab/src/de/map.rs#L605-L613"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"hard","description":"When `trim_text_start` is enabled, the `InsideText` arm scans the input twice on the hot text path: first `skip_whitespace` performs a full fill/scan of leading whitespace, then `read_text` performs an independent `memchr2(b'<', b'&', ...)` scan over the remaining bytes. For whitespace-heavy documents (e.g. pretty-printed XML) this doubles the bytes touched for every text node when trimming is on. The two passes cannot share state because `skip_whitespace` consumes from the reader before `read_text` starts.","fix":"Consider folding leading-whitespace trimming into `read_text` itself (track whether all bytes seen so far are whitespace and advance the slice start), so a single scan both trims leading whitespace and locates the next `<`/`&`. Alternatively skip the separate `skip_whitespace` call and trim leading whitespace on the already-scanned text slice in `emit_text`.","locations":[{"ref":"src/reader/mod.rs:350-355","code":"  350 |                 ParseState::InsideText => { // Go to InsideMarkup or Done state\n  351 |                     if $self.state.config.trim_text_start {\n  352 |                         $reader.skip_whitespace(&mut $self.state.offset) $(.$await)? ?;\n  353 |                     }\n  354 | \n  355 |                     match $reader.read_text($buf, &mut $self.state.offset) $(.$await)? {","lines":6,"link":"https://github.com/tafia/quick-xml/blob/2eaa844b4b40117fb7ed4d1f512ede918125aeab/src/reader/mod.rs#L350-L355"},{"ref":"src/reader/buffered_reader.rs:312-330","code":"  312 |         #[inline]\n  313 |         $($async)? fn skip_whitespace(&mut self, position: &mut u64) -> io::Result<()> {\n  314 |             loop {\n  315 |                 break match self $(.$reader)? .fill_buf() $(.$await)? {\n  316 |                     Ok(n) => {\n  317 |                         let count = n.iter().position(|b| !is_whitespace(*b)).unwrap_or(n.len());\n  318 |                         if count > 0 {\n  319 |                             self $(.$reader)? .consume(count);\n  320 |                             *position += count as u64;\n  321 |                             continue;\n  322 |                         } else {\n  323 |                             Ok(())\n  324 |                         }\n  325 |                     }\n  326 |                     Err(ref e) if e.kind() == io::ErrorKind::Interrupted => continue,\n  327 |                     Err(e) => Err(e),\n  328 |                 };\n  329 |             }\n  330 |         }","lines":19,"link":"https://github.com/tafia/quick-xml/blob/2eaa844b4b40117fb7ed4d1f512ede918125aeab/src/reader/buffered_reader.rs#L312-L330"},{"ref":"src/reader/slice_reader.rs:405-413","code":"  405 |     fn skip_whitespace(&mut self, position: &mut u64) -> io::Result<()> {\n  406 |         let whitespaces = self\n  407 |             .iter()\n  408 |             .position(|b| !is_whitespace(*b))\n  409 |             .unwrap_or(self.len());\n  410 |         *position += whitespaces as u64;\n  411 |         *self = &self[whitespaces..];\n  412 |         Ok(())\n  413 |     }","lines":9,"link":"https://github.com/tafia/quick-xml/blob/2eaa844b4b40117fb7ed4d1f512ede918125aeab/src/reader/slice_reader.rs#L405-L413"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`ContentSerializer::serialize_str` checks `if !value.is_empty()` before delegating to\n`SimpleTypeSerializer::serialize_str`, but `SimpleTypeSerializer::serialize_str` (simple_type.rs:488)\nalready performs the exact same `if !value.is_empty()` guard before calling `escape_list`. The outer\ncheck is redundant: for an empty string it skips constructing the `SimpleTypeSerializer`, but the\ndelegate would do nothing anyway. The duplicated guard is dead/confusing - it suggests the empty case\nis special here when it is not.","fix":"Drop the redundant `if !value.is_empty()` in `ContentSerializer::serialize_str` and unconditionally\ndelegate: `self.into_simple_type_serializer()?.serialize_str(value)?; Ok(WriteResult::SensitiveText)`.","locations":[{"ref":"src/se/content.rs:230-235","code":"  230 |     fn serialize_str(self, value: &str) -> Result<Self::Ok, Self::Error> {\n  231 |         if !value.is_empty() {\n  232 |             self.into_simple_type_serializer()?.serialize_str(value)?;\n  233 |         }\n  234 |         Ok(WriteResult::SensitiveText)\n  235 |     }","lines":6,"link":"https://github.com/tafia/quick-xml/blob/2eaa844b4b40117fb7ed4d1f512ede918125aeab/src/se/content.rs#L230-L235"},{"ref":"src/se/simple_type.rs:516-521","code":"  516 |     fn serialize_str(mut self, value: &str) -> Result<Self::Ok, Self::Error> {\n  517 |         if !value.is_empty() {\n  518 |             escape_list(&mut self.writer, value, self.target, self.level)?;\n  519 |         }\n  520 |         Ok(self.writer)\n  521 |     }","lines":6,"link":"https://github.com/tafia/quick-xml/blob/2eaa844b4b40117fb7ed4d1f512ede918125aeab/src/se/simple_type.rs#L516-L521"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"hard","description":"`Struct` always buffers all child elements into an owned `String` (`children: String::new()`) and\nonly writes them to the real writer in `end()`. For deeply nested structures this means the same\ntext is copied at every nesting level: a leaf's bytes are copied into its parent's `children`\nbuffer, then that whole buffer is copied into the grandparent's `children`, and so on, giving roughly\nO(depth) re-copies of the content and O(depth) intermediate heap allocations. The buffering exists\nonly to allow attributes (written directly to the outer writer) to precede element children. The\ncode itself acknowledges this is a workaround (see the TODO at element.rs:376-378). This is a real\nperformance cost for large/deep documents.","fix":"Implement the customization point described in the existing TODO: write elements directly to the\nunderlying writer and require attributes to be serialized first (erroring if an attribute follows an\nelement), avoiding the per-level `children` buffer and its repeated copies/allocations.","locations":[{"ref":"src/se/element.rs:373-382","code":"  373 | pub struct Struct<'w, 'k, W: Write> {\n  374 |     ser: ElementSerializer<'w, 'k, W>,\n  375 |     /// Buffer to store serialized elements\n  376 |     // TODO: Customization point: allow direct writing of elements, but all\n  377 |     // attributes should be listed first. Fail, if attribute encountered after\n  378 |     // element. Use feature to configure\n  379 |     children: String,\n  380 |     /// Whether need to write indent after the last written field\n  381 |     write_indent: bool,\n  382 | }","lines":10,"link":"https://github.com/tafia/quick-xml/blob/2eaa844b4b40117fb7ed4d1f512ede918125aeab/src/se/element.rs#L373-L382"},{"ref":"src/se/element.rs:433-464","code":"  433 |     fn write_element<T>(&mut self, key: &str, value: &T) -> Result<(), SeError>\n  434 |     where\n  435 |         T: ?Sized + Serialize,\n  436 |     {\n  437 |         let ser = ContentSerializer {\n  438 |             writer: &mut self.children,\n  439 |             level: self.ser.ser.level,\n  440 |             indent: self.ser.ser.indent.borrow(),\n  441 |             // If previous field does not require indent, do not write it\n  442 |             write_indent: self.write_indent,\n  443 |             text_format: self.ser.ser.text_format,\n  444 |             allow_primitive: true,\n  445 |             empty_element_handling: self.ser.ser.empty_element_handling,\n  446 |         };\n  447 | \n  448 |         if key == TEXT_KEY {\n  449 |             value.serialize(TextSerializer(ser.into_simple_type_serializer()?))?;\n  450 |             // Text was written so we don't need to indent next field\n  451 |             self.write_indent = false;\n  452 |         } else if key == VALUE_KEY {\n  453 |             // If element was written then we need to indent next field unless it is a text field\n  454 |             self.write_indent = value.serialize(ser)?.allow_indent();\n  455 |         } else {\n  456 |             value.serialize(ElementSerializer {\n  457 |                 key: XmlName::try_from(key)?,\n  458 |                 ser,\n  459 |             })?;\n  460 |             // Element was written so we need to indent next field unless it is a text field\n  461 |             self.write_indent = true;\n  462 |         }\n  463 |         Ok(())\n  464 |     }","lines":32,"link":"https://github.com/tafia/quick-xml/blob/2eaa844b4b40117fb7ed4d1f512ede918125aeab/src/se/element.rs#L433-L464"},{"ref":"src/se/element.rs:478-508","code":"  478 |     fn end(mut self) -> Result<Self::Ok, Self::Error> {\n  479 |         self.ser.ser.indent.decrease();\n  480 | \n  481 |         if self.children.is_empty() {\n  482 |             match self.ser.ser.empty_element_handling {\n  483 |                 EmptyElementHandling::SelfClosed => {\n  484 |                     self.ser.ser.writer.write_str(\"/>\")?;\n  485 |                 }\n  486 |                 EmptyElementHandling::SelfClosedWithSpace => {\n  487 |                     self.ser.ser.writer.write_str(\" />\")?;\n  488 |                 }\n  489 |                 EmptyElementHandling::Expanded => {\n  490 |                     self.ser.ser.writer.write_str(\"><\/\")?;\n  491 |                     self.ser.ser.writer.write_str(self.ser.key.0)?;\n  492 |                     self.ser.ser.writer.write_char('>')?;\n  493 |                 }\n  494 |             }\n  495 |         } else {\n  496 |             self.ser.ser.writer.write_char('>')?;\n  497 |             self.ser.ser.writer.write_str(&self.children)?;\n  498 | \n  499 |             if self.write_indent {\n  500 |                 self.ser.ser.indent.write_indent(&mut self.ser.ser.writer)?;\n  501 |             }\n  502 | \n  503 |             self.ser.ser.writer.write_str(\"<\/\")?;\n  504 |             self.ser.ser.writer.write_str(self.ser.key.0)?;\n  505 |             self.ser.ser.writer.write_char('>')?;\n  506 |         }\n  507 |         Ok(WriteResult::Element)\n  508 |     }","lines":31,"link":"https://github.com/tafia/quick-xml/blob/2eaa844b4b40117fb7ed4d1f512ede918125aeab/src/se/element.rs#L478-L508"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`not_in` decodes `start.local_name().into_inner()` to a string on every call and allocates when\nthe name is not UTF-8-borrowable. It is invoked both from `ElementMapAccess::next_key_seed`\n(`not_in(self.fields, e)`) and from `TagFilter::is_suitable`. For the common `$value`-collecting\ncase (`has_value_field`), every child Start triggers this decode+scan even when `fields` is short.\nCombined with the per-element `is_suitable` calls in `MapValueSeqAccess`, this is redundant work\nin the hot sequence path.","fix":"Cache the decoded local name within the loop where both the key check and the filter check need\nit, and reuse it instead of decoding twice; or compare against `fields` using raw bytes where the\nfield names are known ASCII to skip decoding entirely.","locations":[{"ref":"src/de/map.rs:306-317","code":"  306 |                 DeEvent::Start(e) if self.has_value_field && not_in(self.fields, e)? => {\n  307 |                     self.source = ValueSource::Content;\n  308 | \n  309 |                     let de = BorrowedStrDeserializer::<DeError>::new(VALUE_KEY);\n  310 |                     seed.deserialize(de).map(Some)\n  311 |                 }\n  312 |                 DeEvent::Start(e) => {\n  313 |                     self.source = ValueSource::Nested;\n  314 | \n  315 |                     let de = QNameDeserializer::from_elem(e)?;\n  316 |                     seed.deserialize(de).map(Some)\n  317 |                 }","lines":12,"link":"https://github.com/tafia/quick-xml/blob/2eaa844b4b40117fb7ed4d1f512ede918125aeab/src/de/map.rs#L306-L317"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`Map::make_key` takes `&mut self` but never reads or mutates `self`; it only serializes the supplied\n`key` into a fresh `QNameSerializer { writer: String::new() }`. The `&mut self` receiver is\nmisleading (it implies the method depends on map state) and unnecessarily constrains the borrow.","fix":"Make `make_key` an associated function or take `&self` (or no receiver at all), e.g.\n`fn make_key<T: ?Sized + Serialize>(key: &T) -> Result<String, SeError>`, and update the two call\nsites in `serialize_key`/`serialize_entry`.","locations":[{"ref":"src/se/element.rs:538-547","code":"  538 | impl<'w, 'k, W: Write> Map<'w, 'k, W> {\n  539 |     fn make_key<T>(&mut self, key: &T) -> Result<String, SeError>\n  540 |     where\n  541 |         T: ?Sized + Serialize,\n  542 |     {\n  543 |         key.serialize(QNameSerializer {\n  544 |             writer: String::new(),\n  545 |         })\n  546 |     }\n  547 | }","lines":10,"link":"https://github.com/tafia/quick-xml/blob/2eaa844b4b40117fb7ed4d1f512ede918125aeab/src/se/element.rs#L538-L547"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"`Content::as_str` matches `Content::Owned(s, offset)` with `s.split_at(*offset).1`, but inspection\nof `ListIter::next_element_seed` shows that when a `Content::Owned` is consumed it is always\nre-borrowed into a `CowRef::Slice`/`CowRef::Owned` via explicit match arms, and the offset is only\never advanced by `skip + start`/`skip + end`. The `as_str` helper is only used at the top of the\nloop to test emptiness and to find the next delimiter. This is fine, but the `Owned` deserializer\nstorage path (a `String` plus a `usize` offset that is never actually shrunk/reallocated) is only\nexercised by the `encoding` feature; without it, the `Owned` variant of `Content` and the\ncorresponding `AtomicDeserializer` owned arm are effectively unreachable from real input (slice\ninput is always borrowed/UTF-8). Worth confirming the owned path is covered or gating it.","fix":"Confirm via coverage that the `Content::Owned`/`CowRef::Owned` list path is reachable in a\nnon-`encoding` build; if it is only reachable under `feature = \"encoding\"`, consider documenting\nthat or gating the owned arms to avoid carrying logic that cannot be hit in the default build.","locations":[{"ref":"src/de/simple_type.rs:89-98","code":"   89 | impl<'de, 'a> Content<'de, 'a> {\n   90 |     /// Returns string representation of the content\n   91 |     fn as_str(&self) -> &str {\n   92 |         match self {\n   93 |             Content::Input(s) => s,\n   94 |             Content::Slice(s) => s,\n   95 |             Content::Owned(s, offset) => s.split_at(*offset).1,\n   96 |         }\n   97 |     }\n   98 | }","lines":10,"link":"https://github.com/tafia/quick-xml/blob/2eaa844b4b40117fb7ed4d1f512ede918125aeab/src/de/simple_type.rs#L89-L98"},{"ref":"src/de/simple_type.rs:379-384","code":"  379 |                         Content::Owned(s, 0) => seed.deserialize(AtomicDeserializer {\n  380 |                             content: CowRef::Owned(s),\n  381 |                         }),\n  382 |                         Content::Owned(s, offset) => seed.deserialize(AtomicDeserializer {\n  383 |                             content: CowRef::Slice(s.split_at(offset).1),\n  384 |                         }),","lines":6,"link":"https://github.com/tafia/quick-xml/blob/2eaa844b4b40117fb7ed4d1f512ede918125aeab/src/de/simple_type.rs#L379-L384"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"In `ElementWriter::new_line`, the match arms for `AttributeIndent::WriteSpaces(_)` and\n`AttributeIndent::WriteConfigured(_)` are empty no-ops, and the accompanying state diagram in the\ndoc comment on `AttributeIndent` lists transitions (e.g. `WriteSpaces --> WriteSpaces : .new_line()`)\nthat are effectively unreachable in practice because `write_attr` always converts a `Write*` state\ninto its non-`Write*` counterpart before another `new_line` can be observed. The empty arms and the\ndiagram transitions describe states that the public API flow does not actually reach between calls,\nwhich is confusing for maintainers.","fix":"Add a short comment explaining why these arms are no-ops (consecutive `new_line()` calls without an\nintervening `with_attribute()`), or restructure the state machine so the unreachable transitions are\nnot implied by the diagram.","locations":[{"ref":"src/writer.rs:536-544","code":"  536 |                 AttributeIndent::WriteSpaces(_) => {}\n  537 |                 // .new_line() called when .with_attribute() was called at least once.\n  538 |                 // The spaces should be used to indent\n  539 |                 // Plan saved indent\n  540 |                 AttributeIndent::Spaces(indent) => {\n  541 |                     self.state = AttributeIndent::WriteSpaces(indent)\n  542 |                 }\n  543 | \n  544 |                 AttributeIndent::WriteConfigured(_) => {}","lines":9,"link":"https://github.com/tafia/quick-xml/blob/2eaa844b4b40117fb7ed4d1f512ede918125aeab/src/writer.rs#L536-L544"},{"ref":"src/writer.rs:416-448","code":"  416 | /// Track indent inside elements state\n  417 | ///\n  418 | /// ```mermaid\n  419 | /// stateDiagram-v2\n  420 | ///     [*] --> NoneAttributesWritten\n  421 | ///     NoneAttributesWritten --> Spaces : .with_attribute()\n  422 | ///     NoneAttributesWritten --> WriteConfigured : .new_line()\n  423 | ///\n  424 | ///     Spaces --> Spaces : .with_attribute()\n  425 | ///     Spaces --> WriteSpaces : .new_line()\n  426 | ///\n  427 | ///     WriteSpaces --> Spaces : .with_attribute()\n  428 | ///     WriteSpaces --> WriteSpaces : .new_line()\n  429 | ///\n  430 | ///     Configured --> Configured : .with_attribute()\n  431 | ///     Configured --> WriteConfigured : .new_line()\n  432 | ///\n  433 | ///     WriteConfigured --> Configured : .with_attribute()\n  434 | ///     WriteConfigured --> WriteConfigured : .new_line()\n  435 | /// ```\n  436 | #[derive(Debug)]\n  437 | enum AttributeIndent {\n  438 |     /// Initial state. `ElementWriter` was just created and no attributes written yet\n  439 |     NoneAttributesWritten,\n  440 |     /// Write specified count of spaces to indent before writing attribute in `with_attribute()`\n  441 |     WriteSpaces(usize),\n  442 |     /// Keep space indent that should be used if `new_line()` would be called\n  443 |     Spaces(usize),\n  444 |     /// Write specified count of indent characters before writing attribute in `with_attribute()`\n  445 |     WriteConfigured(usize),\n  446 |     /// Keep indent that should be used if `new_line()` would be called\n  447 |     Configured(usize),\n  448 | }","lines":33,"link":"https://github.com/tafia/quick-xml/blob/2eaa844b4b40117fb7ed4d1f512ede918125aeab/src/writer.rs#L416-L448"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The `PiParser` documentation states that `feed` returns \"the position after `?>`\"\n(module/struct doc and the `feed` method doc), but the implementation returns the index\nOF the `>` byte (i.e. one position before the end of `?>`), not the position after it.\nFor input chunk `' inside?>...` the `>` is at index 9 and the function returns `Some(9)`,\nwhich the doctest itself labels as `9` while the prose claims \"position after `?>`\".\nCompare with `CommentParser::feed`, which genuinely returns the position AFTER `-->`\n(`i + 1`), and `ElementParser::feed`, whose doc correctly says it returns \"position of\nfound symbol\". The PI doc wording is therefore inconsistent with both the code and the\nsibling parsers and is misleading to anyone implementing a new `Parser`.","fix":"Change the PI doc text to say it returns the position OF the closing `>` (the index where\nthe instruction's `?>` terminator's `>` is located), matching `ElementParser`'s wording,\nor explicitly note that the caller is expected to add 1 to consume the `>` (as\n`read_with` does). Do not claim \"position after `?>`\".","locations":[{"ref":"src/parser/pi.rs:9-13","code":"    9 | /// To use a parser create an instance of parser and [`feed`] data into it.\n   10 | /// After successful search the parser will return [`Some`] with position where\n   11 | /// processing instruction is ended (the position after `?>`). If search was\n   12 | /// unsuccessful, a [`None`] will be returned. You typically would expect positive\n   13 | /// result of search, so that you should feed new data until you get it.","lines":5,"link":"https://github.com/tafia/quick-xml/blob/2eaa844b4b40117fb7ed4d1f512ede918125aeab/src/parser/pi.rs#L9-L13"},{"ref":"src/parser/pi.rs:47-51","code":"   47 |     /// Determines the end position of a processing instruction in the provided slice.\n   48 |     /// Processing instruction ends on the first occurrence of `?>` which cannot be\n   49 |     /// escaped.\n   50 |     ///\n   51 |     /// Returns position after the `?>` or `None` if such sequence was not found.","lines":5,"link":"https://github.com/tafia/quick-xml/blob/2eaa844b4b40117fb7ed4d1f512ede918125aeab/src/parser/pi.rs#L47-L51"},{"ref":"src/parser/pi.rs:62-73","code":"   62 |     fn feed(&mut self, bytes: &[u8]) -> Option<usize> {\n   63 |         for i in memchr::memchr_iter(b'>', bytes) {\n   64 |             match i {\n   65 |                 0 if self.0 => return Some(0),\n   66 |                 // If the previous byte is `?`, then we found `?>`\n   67 |                 i if i > 0 && bytes[i - 1] == b'?' => return Some(i),\n   68 |                 _ => {}\n   69 |             }\n   70 |         }\n   71 |         self.0 = bytes.last().copied() == Some(b'?');\n   72 |         None\n   73 |     }","lines":12,"link":"https://github.com/tafia/quick-xml/blob/2eaa844b4b40117fb7ed4d1f512ede918125aeab/src/parser/pi.rs#L62-L73"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"`Serializer::set_quote_level` doc comment states `Default: [\\`QuoteLevel::Minimal\\`]`, but both\nconstructors (`Serializer::new` at mod.rs:588 and `Serializer::with_root` at mod.rs:653) initialize\n`level: QuoteLevel::Partial`. The documented default contradicts the actual default, which can\nmislead users about which characters are escaped when they do not call `set_quote_level`.","fix":"Change the doc comment to `Default: [\\`QuoteLevel::Partial\\`]` to match the value used in\n`Serializer::new` and `Serializer::with_root`.","locations":[{"ref":"src/se/mod.rs:824-830","code":"  824 |     /// Set the level of quoting used when writing texts\n  825 |     ///\n  826 |     /// Default: [`QuoteLevel::Minimal`]\n  827 |     pub fn set_quote_level(&mut self, level: QuoteLevel) -> &mut Self {\n  828 |         self.ser.level = level;\n  829 |         self\n  830 |     }","lines":7,"link":"https://github.com/tafia/quick-xml/blob/2eaa844b4b40117fb7ed4d1f512ede918125aeab/src/se/mod.rs#L824-L830"},{"ref":"src/se/mod.rs:585-593","code":"  585 |                 level: QuoteLevel::Partial,\n  586 |                 indent: Indent::None,\n  587 |                 write_indent: false,\n  588 |                 text_format: TextFormat::Text,\n  589 |                 allow_primitive: true,\n  590 |                 empty_element_handling: EmptyElementHandling::SelfClosed,\n  591 |             },\n  592 |             root_tag: None,\n  593 |         }","lines":9,"link":"https://github.com/tafia/quick-xml/blob/2eaa844b4b40117fb7ed4d1f512ede918125aeab/src/se/mod.rs#L585-L593"},{"ref":"src/se/mod.rs:650-658","code":"  650 |             ser: ContentSerializer {\n  651 |                 writer,\n  652 |                 level: QuoteLevel::Partial,\n  653 |                 indent: Indent::None,\n  654 |                 write_indent: false,\n  655 |                 text {"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The `// SAFETY:` comment prefix is used throughout these modules on `unreachable!()` arms in\nordinary safe code (no `unsafe` blocks involved). `SAFETY:` has a specific, established meaning in\nRust (it documents the invariants that make an adjacent `unsafe` operation sound). Using it for\nplain logic invariants is misleading - a reader auditing `unsafe` usage will get false hits, and\nit dilutes the convention. Examples include map.rs (`SAFETY: We set \\`Text\\` only when we seen\n\\`Text\\``) and var.rs.","fix":"Rename these comments from `SAFETY:` to something like `INVARIANT:` or `NOTE:`, reserving\n`SAFETY:` strictly for documenting genuine `unsafe` preconditions.","locations":[{"ref":"src/de/map.rs:354-355","code":"  354 |                 // SAFETY: We set `Text` only when we seen `Text`\n  355 |                 _ => unreachable!(),","lines":2,"link":"https://github.com/tafia/quick-xml/blob/2eaa844b4b40117fb7ed4d1f512ede918125aeab/src/de/map.rs#L354-L355"},{"ref":"src/de/map.rs:610-613","code":"  610 |                 // only from the `ElementMapAccess::next_value_seed` and only when we\n  611 |                 // peeked `Start` event\n  612 |                 _ => unreachable!(),\n  613 |             }","lines":4,"link":"https://github.com/tafia/quick-xml/blob/2eaa844b4b40117fb7ed4d1f512ede918125aeab/src/de/map.rs#L610-L613"},{"ref":"src/de/var.rs:89-90","code":"   89 |             // SAFETY: the other events are filtered in `variant_seed()`\n   90 |             _ => unreachable!(\"Only `Start` or `Text` events are possible here\"),","lines":2,"link":"https://github.com/tafia/quick-xml/blob/2eaa844b4b40117fb7ed4d1f512ede918125aeab/src/de/var.rs#L89-L90"},{"ref":"src/de/mod.rs:2421-2424","code":" 2421 |                 // SAFETY: current_event_is_last_text checks that event is Text, CData, GeneralRef, or DocType\n 2422 | {"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"Doc comment in `MapValueDeserializer` shows the example XML as `<tag>42<tag>` and `<tag>...<tag>`\n(opening tag used as the closing tag) instead of `<tag>42<\/tag>` / `<tag>...<\/tag>`. The same\nmalformed-closing-tag typo appears in the `deserialize_seq`-related doc block. Misleading for\nreaders trying to understand the supported shapes.","fix":"Correct the example closing tags to `<\/tag>`.","locations":[{"ref":"src/de/map.rs:467-480","code":"  467 |     /// ```xml\n  468 |     /// <tag>42<tag>\n  469 |     /// ```\n  470 |     ///\n  471 |     /// could be deserialized into `42usize` without problems, and at the same time\n  472 |     ///\n  473 |     /// ```xml\n  474 |     /// <tag>\n  475 |     ///   <key1/>\n  476 |     ///   <key2/>\n  477 |     ///   <!--...-->\n  478 |     /// <tag>\n  479 |     /// ```\n  480 |     /// could be deserialized to a struct.","lines":14,"link":"https://github.com/tafia/quick-xml/blob/2eaa844b4b40117fb7ed4d1f512ede918125aeab/src/de/map.rs#L467-L480"}]},
{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The doc comment on the `InsideRef` parse state says \"After generating one event the reader moves to the `ClosedTag` state.\" There is no `ClosedTag` variant in `ParseState` (the variants are `Init`, `InsideRef`, `InsideMarkup`, `InsideText`, `InsideEmpty`, `Done`). The `InsideRef` arm in `read_event_impl` actually transitions to `ParseState::InsideText`. The comment references a renamed/removed state name and is stale.","fix":"Replace \"moves to the `ClosedTag` state\" with \"moves to the `InsideText` state\" to match the actual transition performed in the `InsideRef` arm of `read_event_impl`.","locations":[{"ref":"src/reader/mod.rs:603-607","code":"  603 |     /// State after seeing the `&` symbol in textual content. Depending on the next symbol all other\n  604 |     /// events could be generated.\n  605 |     ///\n  606 |     /// After generating one event the reader moves to the `ClosedTag` state.\n  607 |     InsideRef,","lines":5,"link":"https://github.com/tafia/quick-xml/blob/2eaa844b4b40117fb7ed4d1f512ede918125aeab/src/reader/mod.rs#L603-L607"}]},

{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"The three empty-element-handling branches are open-coded twice with the same structure: once in\n`ContentSerializer::write_empty` (content.rs) for a self-closing element, and once in\n`Struct::end` (element.rs) for the no-children case. Both match on `EmptyElementHandling` and emit\n`/>`, ` />`, or `><\/name>`. The two implementations must be kept in sync (they encode the same\nsemantic: how an element with no content is closed). A change to one (e.g. adding a new\n`EmptyElementHandling` variant or altering the spacing) can easily miss the other.","fix":"Factor the `match self.empty_element_handling { ... }` close-tag logic into a single shared helper\n(e.g. on `EmptyElementHandling` or a free function taking the writer and the tag name) and call it\nfrom both `write_empty` and `Struct::end`.","locations":[{"ref":"src/se/content.rs:137-155","code":"  137 |         match self.empty_element_handling {\n  138 |             EmptyElementHandling::SelfClosed => {\n  139 |                 self.writer.write_char('<')?;\n  140 |                 self.writer.write_str(name.0)?;\n  141 |                 self.writer.write_str(\"/>\")?;\n  142 |             }\n  143 |             EmptyElementHandling::SelfClosedWithSpace => {\n  144 |                 self.writer.write_char('<')?;\n  145 |                 self.writer.write_str(name.0)?;\n  146 |                 self.writer.write_str(\" />\")?;\n  147 |             }\n  148 |             EmptyElementHandling::Expanded => {\n  149 |                 self.writer.write_char('<')?;\n  150 |                 self.writer.write_str(name.0)?;\n  151 |                 self.writer.write_str(\"><\/\")?;\n  152 |                 self.writer.write_str(name.0)?;\n  153 |                 self.writer.write_char('>')?;\n  154 |             }\n  155 |         }","lines":19,"link":"https://github.com/tafia/quick-xml/blob/2eaa844b4b4 {"id":"OTHER_1","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"`parse_number` only rejects the NUL codepoint (`0x0`) as an illegal XML character; every other codepoint accepted by `char::from_u32` is allowed. XML 1.0/1.1 forbid most C0 control characters in content (only #x9, #xA, #xD are legal in XML 1.0; XML 1.1 additionally restricts the C1 range), so character references such as `&#x1;`, `&#xB;`, `&#xC;`, `&#x1F;` are accepted and expanded even though they are not permitted XML characters. The doc on `ParseCharRefError::IllegalCharacter` already admits \"Currently, only 0x0 character produces this error\", so this is a known gap rather than an oversight, but it means the unescaper can emit characters that are not valid in well-formed XML.","fix":"Extend the illegal-character check in `parse_number` to reject codepoints that are not Char productions for the targeted XML version (e.g. control chars below 0x20 other than 0x9/0xA/0xD, plus the noncharacters/surrogate ranges already handled by char::from_u32). If version-specific behavior is needed, thread the XML version into the function. At minimum document the accepted set.","locations":[{"ref":"src/escape.rs:2363-2376","code":" 2363 | pub(crate) fn parse_number(num: &str) -> Result<char, ParseCharRefError> {\n 2364 |     let code = if let Some(hex) = num.strip_prefix('x') {\n 2365 |         from_str_radix(hex, 16)?\n 2366 |     } else {\n 2367 |         from_str_radix(num, 10)?\n 2368 |     };\n 2369 |     if code == 0 {\n 2370 |         return Err(ParseCharRefError::IllegalCharacter(code));\n 2371 |     }\n 2372 |     match std::char::from_u32(code) {\n 2373 |         Some(c) => Ok(c),\n 2374 |         None => Err(ParseCharRefError::InvalidCodepoint(code)),\n 2375 |     }\n 2376 | }","lines":14,"link":"https://github.com/tafia/quick-xml/blob/2eaa844b4b40117fb7ed4d1f512ede918125aeab/src/escape.rs#L2363-L2376"}]},
