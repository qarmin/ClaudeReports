{"id":"DUP_3","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"`expo2` (in expo2.rs, used by sinh) and `k_expo2` (in k_expo2.rs, used by cosh) are byte-for-byte identical f64 functions: both compute exp(x)/2 for large x using the same K=2043, the same kln2 bit constant 0x40962066151add8b, and the same scale-squared trick. In musl this is a single shared `__expo2`. Maintaining two copies risks them drifting out of sync. (Note the f32 path `k_expo2f` is genuinely distinct, with K=235.)","fix":"Collapse the two f64 helpers into one shared function (e.g. keep `expo2` and have cosh call it, or vice-versa), deleting the duplicate.","locations":[{"ref":"libm/src/math/expo2.rs:1-14","code":"    1 | use super::{combine_words, exp};\n    2 | \n    3 | /* exp(x)/2 for x >= log(DBL_MAX), slightly better than 0.5*exp(x/2)*exp(x/2) */\n    4 | #[cfg_attr(assert_no_panic, no_panic::no_panic)]\n    5 | pub(crate) fn expo2(x: f64) -> f64 {\n    6 |     /* k is such that k*ln2 has minimal relative error and x - kln2 > log(DBL_MIN) */\n    7 |     const K: i32 = 2043;\n    8 |     let kln2 = f64::from_bits(0x40962066151add8b);\n    9 | \n   10 |     /* note that k is odd and scale*scale overflows */\n   11 |     let scale = combine_words(((0x3ff + K / 2) as u32) << 20, 0);\n   12 |     /* exp(x - k ln2) * 2**(k-1) */\n   13 |     exp(x - kln2) * scale * scale\n   14 | }","lines":14,"link":"https://github.com/rust-lang/compiler-builtins/blob/81d14035f1659202feb650af86ebfbf2a733faf7/libm/src/math/expo2.rs#L1-L14"},{"ref":"libm/src/math/k_expo2.rs:1-14","code":"    1 | use super::exp;\n    2 | \n    3 | /* k is such that k*ln2 has minimal relative error and x - kln2 > log(FLT_MIN) */\n    4 | const K: i32 = 2043;\n    5 | \n    6 | /* expf(x)/2 for x >= log(FLT_MAX), slightly better than 0.5f*expf(x/2)*expf(x/2) */\n    7 | #[cfg_attr(assert_no_panic, no_panic::no_panic)]\n    8 | pub(crate) fn k_expo2(x: f64) -> f64 {\n    9 |     let k_ln2 = f64::from_bits(0x40962066151add8b);\n   10 |     /* note that k is odd and scale*scale overflows */\n   11 |     let scale = f64::from_bits(((((0x3ff + K / 2) as u32) << 20) as u64) << 32);\n   12 |     /* exp(x - k ln2) * 2**(k-1) */\n   13 |     exp(x - k_ln2) * scale * scale\n   14 | }","lines":14,"link":"https://github.com/rust-lang/compiler-builtins/blob/81d14035f1659202feb650af86ebfbf2a733faf7/libm/src/math/k_expo2.rs#L1-L14"}]},
{"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"`mpfloat.rs` is a ~1350-line file consisting of a very large flat `skip: [...]` list inside one `for_each_function!` invocation plus ~15 macros that each expand to many trait impls. The `skip` list (lines 135-354) duplicates, by name, almost every routine that gets a manual impl further down, with no compiler-enforced link between the two; it is hand-maintained and already shows formatting damage from this (e.g. `fabsf16,floor` on one line, `powf,remquo`, `sincos,sincosf`, `truncf16,yn` - entries got concatenated). A missing skip entry silently produces a duplicate/conflicting impl error, and a stale skip entry silently drops MPFR coverage for a function. This is the highest-risk maintainability hotspot in the slice.","fix":"Split mpfloat.rs into submodules (generic, per-type, int ops) and/or generate the skip list from the set of manually-implemented routines so the two cannot drift.","locations":[{"ref":"libm-test/src/mpfloat.rs:132-370","code":"  132 | libm_macros::for_each_function! {\n  133 |     callback: impl_mp_op,\n  134 |     emit_types: [RustFn],\n  135 |     skip: [\n  136 |         // Most of these need a manual implementation\n  137 |         // verify-sorted-start\n  138 |         addf128,\n  139 |         addf16,\n  140 |         addf32,\n  141 |         addf64,\n  142 |         ashl_u128,\n  143 |         ashl_u32,\n  144 |         ashl_u64,\n  145 |         ashr_i128,\n  146 |         ashr_i32,\n  147 |         ashr_i64,\n  148 |         ceil,\n  149 |         ceilf,\n  150 |         ceilf128,\n  151 |         ceilf16,\n  152 |         copysign,\n  153 |         copysignf,\n  154 |         copysignf128,\n  155 |         copysignf16,\n  156 |         divf128,\n  157 |         divf32,\n  158 |         divf64,\n  159 |         eqf128,\n  160 |         eqf16,\n  161 |         eqf32,\n  162 |         eqf64,\n  163 |         extend_f16_f {"id":"ARCH_2","type":"architecture","type_label":"Architecture","severity":"negligible","difficulty":"medium","description":"`binary_long.rs` is ~550 lines of which roughly 400 are large commented-out alternative algorithm implementations (3-instruction restoring, conditional SWAR, non-restoring, mask-based, etc.). While educational and intentional in this ported crate, the volume of dead/commented code makes the single live algorithm hard to locate and the file expensive to maintain.","fix":"Optionally move the alternative-algorithm exposition into a separate doc/markdown file or trim to a short reference, leaving only the live SWAR implementation plus a pointer to the full discussion.","locations":[{"ref":"compiler-builtins/src/int/specialized_div_rem/binary_long.rs:73-549","code":"   73 |             /*\n   74 |             let div_original = div;\n   75 |             let mut shl = $normalization_shift(duo, div, false);\n   76 |             let mut quo = 0;\n   77 |             loop {\n   78 |                 let div_shifted = div << shl;\n   79 |                 let sub = duo.wrapping_sub(div_shifted);\n   80 |                 // it is recommended to use `println!`s like this if functionality is unclear\n   81 |                 /*\n   82 |                 println!(\"duo:{:08b}, div_shifted:{:08b}, sub:{:08b}, quo:{:08b}, shl:{}\",\n   83 |                     duo,\n   84 |                     div_shifted,\n   85 |                     sub,\n   86 |                     quo,\n   87 |                     shl\n   88 |                 );\n   89 |                 */\n   90 |                 if 0 <= (sub as $iX) {\n   91 |                     duo = sub;\n   92 |                     quo += 1 << shl;\n   93 |                     if duo < div_original {\n   94 |                         // this branch is optional\n   95 |                         return (quo, duo)\n   96 |                     }\n   97 |                 }\n   98 |                 if shl == 0 {\n   99 |                     return (quo, duo)\n  100 |                 }\n  101 |                 shl -= 1;\n  102 |             }\n  103 |             */\n  104 | \n  105 |             // This restoring binary long division algorithm reduces the number of operations\n  106 |             // overall via:\n  107 |             // - `pow` can be shifted right instead of recalculating from `shl`\n  108 |             // - starting `div` shifted left and shifting it right for each step instead of\n  109 |             //   recalculating from `shl`\n  110 |             // - The `duo < div_original` branch is used to terminate the algorithm instead of the\n  111 |             //   `shl == 0` branch. This check is strong enough to prevent set bits of `pow` and\n  112 |             //   `div` from being shifted off the end. This check also only occurs on half of steps\n  113 |             //   on average, since it is behind the `(sub as $iX) >= 0` branch.\n  114 |             // - `shl` is now not needed by any aspect of of the loop and thus only 3 variables are\n  115 |             //   being updated between steps\n  116 |             //\n  117 |             // There are many variations of this algorithm, but this encompases the largest number\n  118 |             // of architectures and does not rely on carry flags, add-with-carry, or SWAR\n  119 |             // complications to be decently fast.\n  120 |             /*\n  121 |             let div_original = div;\n  122 |             let shl = $normalization_shift(duo, div, false);\n  123 |             let mut div: $uX = div << shl;\n  124 |             let mut pow: $uX = 1 << shl;\n  125 |             let mut quo: $uX = 0;\n  126 |             loop {\n  127 |                 let sub = duo.wrapping_sub(div);\n  128 |                 if 0 <= (sub as $iX) {\n  129 |                     duo = sub;\n  130 |                     quo |= pow;\n  131 |                     if duo < div_original {\n  132 |                         return (quo, duo)\n  133 |                     }\n  134 |                 }\n  135 |                 div >>= 1;\n  136 |                 pow >>= 1;\n  137 |             }\n  138 |             */\n  139 | \n  140 |             // If the architecture has flags and predicated arithmetic instructions, it is possible\n  141 |             // to do binary long division without branching and in only 3 or 4 instructions. This is\n  142 |             // a variation of a 3 instruction central loop from\n  143 |             // http://www.chiark.greenend.org.uk/~theom/riscos/docs/ultimate/a252div.txt.\n  144 |             //\n  145 |             // What allows doing division in only 3 instructions is realizing that instead of\n  146 |             // keeping `duo` in place and shifting `div` right to align bits, `div` can be kept in\n  147 |             // place and `duo` can be shifted left. This means `div` does not have to be updated,\n  148 |             // but causes edge case problems and makes `duo < div_original` tests harder. Some\n  149 |             // architectures have an option to shift an argument in an arithmetic operation, which\n  150 |             // means `duo` can be shifted left and subtracted from in one instruction. The other two\n  151 |             // instructions are updating `quo` and undoing the subtraction if it turns out things\n  152 |             // were not normalized.\n  153 | \n  154 |             /*\n  155 |             // Perform one binary long division step on the already normalized arguments, because\n  156 |             // the main. Note that this does a full normalization since the central loop needs\n  157 |             // `duo.leading_zeros()` to be at least 1 more than `div.leading_zeros()`. The original\n  158 |             // variation only did normalization to the nearest 4 steps, but this makes handling edge\n  159 |             // cases much harder. We do a full normalization and perform a binary long division\n  160 |             // step. In the edge case where the msbs of `duo` and `div` are set, it clears the msb\n  161 |             // of `duo`, then the edge case handler shifts `div` right and does another long\n  162 |             // division step to always insure `duo.leading_zeros() + 1 >= div.leading_zeros()`.\n  163 |             let div_original = div;\n  164 |             let mut shl = $normalization_shift(duo, div, true);\n  165 |             let mut div: $uX = (div << shl);\n  166 |             let mut quo: $uX = 1;\n  167 |             duo = duo.wrapping_sub(div);\n  168 |             if duo < div_original {\n  169 |                 return (1 << shl, duo);\n  170 |             }\n  171 |             let div_neg: $uX;\n  172 |             if (div as $iX) < 0 {\n  173 |                 // A very ugly edge case where the most significant bit of `div` is set (after\n  174 |                 // shifting to match `duo` when its most significant bit is at the sign bit), which\n  175 |                 // leads to the sign bit of `div_neg` being cut off and carries not happening when\n  176 |                 // they should. This branch performs a long division step that keeps `duo` in place\n  177 |                 // and shifts `div` down.\n  178 |                 div >>= 1;\n  179 |                 div_neg = div.wrapping_neg();\n  180 |                 let (sub, carry) = duo.overflowing_add(div_neg);\n  181 |                 duo = sub;\n  182 |                 quo = quo.wrapping_add(quo).wrapping_add(carry as $uX);\n  183 |                 if !carry {\n  184 |                     duo = duo.wrapping_add(div);\n  185 |                 }\n  186 |                 shl -= 1;\n  187 |             } else {\n  188 |                 div_neg = div.wrapping_neg();\n  189 |             }\n  190 |             // The add-with-carry that updates `quo` needs to have the carry set when a normalized\n  191 |             // subtract happens. Using `duo.wrapping_shl(1).overflowing_sub(div)` to do the\n  192 |             // subtraction generates a carry when an unnormalized subtract happens, which is the\n  193 |             // opposite of what we want. Instead, we use\n  194 |             // `duo.wrapping_shl(1).overflowing_add(div_neg)`, where `div_neg` is negative `div`.\n  195 |             let mut i = shl;\n  196 |             loop {\n  197 |                 if i == 0 {\n  198 |                     break;\n  199 |                 }\n  200 |                 i -= 1;\n  201 |                 // `ADDS duo, div, duo, LSL #1`\n  202 |                 // (add `div` to `duo << 1` and set flags)\n  203 |                 let (sub, carry) = duo.wrapping_shl(1).overflowing_add(div_neg);\n  204 |                 duo = sub;\n  205 |                 // `ADC quo, quo, quo`\n  206 |                 // (add with carry). Effectively shifts `quo` left by 1 and sets the least\n  207 |                 // significant bit to the carry.\n  208 |                 quo = quo.wrapping_add(quo).wrapping_add(carry as $uX);\n  209 |                 // `ADDCC duo, duo, div`\n  210 |                 // (add if carry clear). Undoes the subtraction if no carry was generated.\n  211 |                 if !carry {\n  212 |                     duo = duo.wrapping_add(div);\n  213 |                 }\n  214 |             }\n  215 |             return (quo, duo >> shl);\n  216 |             */\n  217 | \n  218 |             // This is the SWAR (SIMD within in a register) restoring division algorithm.\n  219 |             // This combines several ideas of the above algorithms:\n  220 |             //  - If `duo` is shifted left instead of shifting `div` right like in the 3 instruction\n  221 |             //    restoring division algorithm, some architectures can do the shifting and\n  222 |             //    subtraction step in one instruction.\n  223 |             //  - `quo` can be constructed by adding powers-of-two to it or shifting it left by one\n  224 |             //    and adding one.\n  225 |             //  - Every time `duo` is shifted left, there is another unused 0 bit shifted into the\n  226 |             //    LSB, so what if we use those bits to store `quo`?\n  227 |             // Through a complex setup, it is possible to manage `duo` and `quo` in the same\n  228 |             // register, and perform one step with 2 or 3 instructions. The only major downsides are\n  229 |             // that there is significant setup (it is only saves instructions if `shl` is\n  230 |             // approximately more than 4), `duo < div_original` checks are impractical once SWAR is\n  231 |             // initiated, and the number of division steps taken has to be exact (we cannot do more\n  232 |             // division steps than `shl`, because it introduces edge cases where quotient bits in\n  233 |             // `duo` start to collide with the real part of `div`.\n  234 |             /*\n  235 |             // first step. The quotient bit is stored in `quo` for now\n  236 |             let div_original = div;\n  237 |             let mut shl = $normalization_shift(duo, div, true);\n  238 |             let mut div: $uX = (div << shl);\n  239 |             duo = duo.wrapping_sub(div);\n  240 |             let mut quo: $uX = 1 << shl;\n  241 |             if duo < div_original {\n  242 |                 return (quo, duo);\n  243 |             }\n  244 | \n  245 |             let mask: $uX;\n  246 |             if (div as $iX) < 0 {\n  247 |                 // deal with same edge case as the 3 instruction restoring division algorithm, but\n  248 |                 // the quotient bit from this step also has to be stored in `quo`\n  249 |                 div >>= 1;\n  250 |                 shl -= 1;\n  251 |                 let tmp = 1 << shl;\n  252 |                 mask = tmp - 1;\n  253 |                 let sub = duo.wrapping_sub(div);\n  254 |                 if (sub as $iX) >= 0 {\n  255 |                     // restore\n  256 |                     duo = sub;\n  257 |                     quo |= tmp;\n  258 |                 }\n  259 |                 if duo < div_original {\n  260 |                     return (quo, duo);\n  261 |                 }\n  262 |             } else {\n  263 |                 mask = quo - 1;\n  264 |             }\n  265 |             // There is now room for quotient bits in `duo`.\n  266 | \n  267 |             // Note that `div` is already shifted left and has `shl` unset bits. We subtract 1 from\n  268 |             // `div` and end up with the subset of `shl` bits being all being set. This subset acts\n  269 |             // just like a two's complement negative one. The subset of `div` containing the divisor\n  270 |             // had 1 subtracted from it, but a carry will always be generated from the `shl` subset\n  271 |             // as long as the quotient stays positive.\n  272 |             //\n  273 |             // When the modified `div` is subtracted from `duo.wrapping_shl(1)`, the `shl` subset\n  274 |             // adds a quotient bit to the least significant bit.\n  275 |             // For example, 89 (0b01011001) divided by 3 (0b11):\n  276 |             //\n  277 |             // shl:4, div:0b00110000\n  278 |             // first step:\n  279 |             //       duo:0b01011001\n  280 |             // + div_neg:0b11010000\n  281 |             // ____________________\n  282 |             //           0b00101001\n  283 |             // quo is set to 0b00010000 and mask is set to 0b00001111 for later\n  284 |             //\n  285 |             // 1 is subtracted from `div`. I will differentiate the `shl` part of `div` and the\n  286 |             // quotient part of `duo` with `^`s.\n  287 |             // chars.\n  288 |             //     div:0b00110000\n  289 |             //               ^^^^\n  290 |             //   +     0b11111111\n  291 |             //   ________________\n  292 |             //         0b00101111\n  293 |             //               ^^^^\n  294 |             // div_neg:0b11010001\n  295 |             //\n  296 |             // first SWAR step:\n  297 |             //  duo_shl1:0b01010010\n  298 |             //                    ^\n  299 |             // + div_neg:0b11010001\n  300 |             // ____________________\n  301 |             //           0b00100011\n  302 |             //                    ^\n  303 |             // second:\n  304 |             //  duo_shl1:0b01000110\n  305 |             //                   ^^\n  306 |             // + div_neg:0b11010001\n  307 |             // ____________________\n  308 |             //           0b00010111\n  309 |             //                   ^^\n  310 |             // third:\n  311 |             //  duo_shl1:0b00101110\n  312 |             //                  ^^^\n  313 |             // + div_neg:0b11010001\n  314 |             // ____________________\n  315 |             //           0b11111111\n  316 |             //                  ^^^\n  317 |             // 3 steps resulted in the quotient with 3 set bits as expected, but currently the real\n  318 |             // part of `duo` is negative and the third step was an unnormalized step. The restore\n  319 |             // branch then restores `duo`. Note that the restore branch does not shift `duo` left.\n  320 |             //\n  321 |             //   duo:0b11111111\n  322 |             //              ^^^\n  323 |             // + div:0b00101111\n  324 |             //             ^^^^\n  325 |             // ________________\n  326 |             //       0b00101110\n  327 |             //              ^^^\n  328 |             // `duo` is now back in the `duo_shl1` state it was at in the the third step, with an\n  329 |             // unset quotient bit.\n  330 |             //\n  331 |             // final step (`shl` was 4, so exactly 4 steps must be taken)\n  332 |             //  duo_shl1:0b01011100\n  333 |             //                 ^^^^\n  334 |             // + div_neg:0b11010001\n  335 |             // ____________________\n  336 |             //           0b00101101\n  337 |             //                 ^^^^\n  338 |             // The quotient includes the `^` bits added with the `quo` bits from the beginning that\n  339 |             // contained the first step and potential edge case step,\n  340 |             // `quo:0b00010000 + (duo:0b00101101 & mask:0b00001111) == 0b00011101 == 29u8`.\n  341 |             // The remainder is the bits remaining in `duo` that are not part of the quotient bits,\n  342 |             // `duo:0b00101101 >> shl == 0b0010 == 2u8`.\n  343 |             let div: $uX = div.wrapping_sub(1);\n  344 |             let mut i = shl;\n  345 |             loop {\n  346 |                 if i == 0 {\n  347 |                     break;\n  348 |                 }\n  349 |                 i -= 1;\n  350 |                 duo = duo.wrapping_shl(1).wrapping_sub(div);\n  351 |                 if (duo as $iX) < 0 {\n  352 |                     // restore\n  353 |                     duo = duo.wrapping_add(div);\n  354 |                 }\n  355 |             }\n  356 |             // unpack the results of SWAR\n  357 |             return ((duo & mask) | quo, duo >> shl);\n  358 |             */\n  359 | \n  360 |             // The problem with the conditional restoring SWAR algorithm above is that, in practice,\n  361 |             // it requires assembly code to bring out its full unrolled potential (It seems that\n  362 |             // LLVM can't use unrolled conditionals optimally and ends up erasing all the benefit\n  363 |             // that my algorithm intends. On architectures without predicated instructions, the code\n  364 |             // gen is especially bad. We need a default software division algorithm that is\n  365 |             // guaranteed to get decent code gen for the central loop.\n  366 | \n  367 |             // For non-SWAR algorithms, there is a way to do binary long division without\n  368 |             // predication or even branching. This involves creating a mask from the sign bit and\n  369 |             // performing different kinds of steps using that.\n  370 |             /*\n  371 |             let shl = $normalization_shift(duo, div, true);\n  372 |             let mut div: $uX = div << shl;\n  373 |             let mut pow: $uX = 1 << shl;\n  374 |             let mut quo: $uX = 0;\n  375 |             loop {\n  376 |                 let sub = duo.wrapping_sub(div);\n  377 |                 let sign_mask = !((sub as $iX).wrapping_shr($n - 1) as $uX);\n  378 |                 duo -= div & sign_mask;\n  379 |                 quo |= pow & sign_mask;\n  380 |                 div >>= 1;\n  381 |                 pow >>= 1;\n  382 |                 if pow == 0 {\n  383 |                     break;\n  384 |                 }\n  385 |             }\n  386 |             return (quo, duo);\n  387 |             */\n  388 |             // However, it requires about 4 extra operations (smearing the sign bit, negating the\n  389 |             // mask, and applying the mask twice) on top of the operations done by the actual\n  390 |             // algorithm. With SWAR however, just 2 extra operations are needed, making it\n  391 |             // practical and even the most optimal algorithm for some architectures.\n  392 | \n  393 |             // What we do is use custom assembly for predicated architectures that need software\n  394 |             // division, and for the default algorithm use a mask based restoring SWAR algorithm\n  395 |             // without conditionals or branches. On almost all architectures, this Rust code is\n  396 |             // guaranteed to compile down to 5 assembly instructions or less for each step, and LLVM\n  397 |             // will unroll it in a decent way.\n  398 | \n  399 |             // standard opening for SWAR algorithm with first step and edge case handling\n  400 |             let div_original = div;\n  401 |             let mut shl = $normalization_shift(duo, div, true);\n  402 |             let mut div: $uX = (div << shl);\n  403 |             duo = duo.wrapping_sub(div);\n  404 |             let mut quo: $uX = 1 << shl;\n  405 |             if duo < div_original {\n  406 |                 return (quo, duo);\n  407 |             }\n  408 |             let mask: $uX;\n  409 |             if (div as $iX) < 0 {\n  410 |                 div >>= 1;\n  411 |                 shl -= 1;\n  412 |                 let tmp = 1 << shl;\n  413 |                 mask = tmp - 1;\n  414 |                 let sub = duo.wrapping_sub(div);\n  415 |                 if (sub as $iX) >= 0 {\n  416 |                     duo = sub;\n  417 |                     quo |= tmp;\n  418 |                 }\n  419 |                 if duo < div_original {\n  420 |                     return (quo, duo);\n  421 |                 }\n  422 |             } else {\n  423 |                 mask = quo - 1;\n  424 |             }\n  425 | \n  426 |             // central loop\n  427 |             div = div.wrapping_sub(1);\n  428 |             let mut i = shl;\n  429 |             loop {\n  430 |                 if i == 0 {\n  431 |                     break;\n  432 |                 }\n  433 |                 i -= 1;\n  434 |                 // shift left 1 and subtract\n  435 |                 duo = duo.wrapping_shl(1).wrapping_sub(div);\n  436 |                 // create mask\n  437 |                 let mask = (duo as $iX).wrapping_shr($n - 1) as $uX;\n  438 |                 // restore\n  439 |                 duo = duo.wrapping_add(div & mask);\n  440 |             }\n  441 |             // unpack\n  442 |             return ((duo & mask) | quo, duo >> shl);\n  443 | \n  444 |             // miscellanious binary long division algorithms that might be better for specific\n  445 |             // architectures\n  446 | \n  447 |             // Another kind of long division uses an interesting fact that `div` and `pow` can be\n  448 |             // negated when `duo` is negative to perform a \"negated\" division step that works in\n  449 |             // place of any normalization mechanism. This is a non-restoring division algorithm that\n  450 |             // is very similar to the non-restoring division algorithms that can be found on the\n  451 |             // internet, except there is only one test for `duo < 0`. The subtraction from `quo` can\n  452 |             // be viewed as shifting the least significant set bit right (e.x. if we enter a series\n  453 |             // of negated binary long division steps starting with `quo == 0b1011_0000` and\n  454 |             // `pow == 0b0000_1000`, `quo` will progress like this: 0b1010_1000, 0b1010_0100,\n  455 |             // 0b1010_0010, 0b1010_0001).\n  456 |             /*\n  457 |             let div_original = div;\n  458 |             let shl = $normalization_shift(duo, div, true);\n  459 |             let mut div: $uX = (div << shl);\n  460 |             let mut pow: $uX = 1 << shl;\n  461 |             let mut quo: $uX = pow;\n  462 |             duo = duo.wrapping_sub(div);\n  463 |             if duo < div_original {\n  464 |                 return (quo, duo);\n  465 |             }\n  466 |             div >>= 1;\n  467 |             pow >>= 1;\n  468 |             loop {\n  469 |                 if (duo as $iX) < 0 {\n  470 |                     // Negated binary long division step.\n  471 |                     duo = duo.wrapping_add(div);\n  472 |                     quo = quo.wrapping_sub(pow);\n  473 |                 } else {\n  474 |                     // Normal long division step.\n  475 |                     if duo < div_original {\n  476 |                         return (quo, duo)\n  477 |                     }\n  478 |                     duo = duo.wrapping_sub(div);\n  479 |                     quo = quo.wrapping_add(pow);\n  480 |                 }\n  481 |                 pow >>= 1;\n  482 |                 div >>= 1;\n  483 |             }\n  484 |             */\n  485 | \n  486 |             // This is the Nonrestoring SWAR algorithm, combining the nonrestoring algorithm with\n  487 |             // SWAR techniques that makes the only difference between steps be negation of `div`.\n  488 |             // If there was an architecture with an instruction that negated inputs to an adder\n  489 |             // based on conditionals, and in place shifting (or a three input addition operation\n  490 |             // that can have `duo` as two of the inputs to effectively shift it left by 1), then a\n  491 |             // single instruction central loop is possible. Microarchitectures often have inputs to\n  492 |             // their ALU that can invert the arguments and carry in of adders, but the architectures\n  493 |             // unfortunately do not have an instruction to dynamically invert this input based on\n  494 |             // conditionals.\n  495 |             /*\n  496 |             // SWAR opening\n  497 |             let div_original = div;\n  498 |             let mut shl = $normalization_shift(duo, div, true);\n  499 |             let mut div: $uX = (div << shl);\n  500 |             duo = duo.wrapping_sub(div);\n  501 |             let mut quo: $uX = 1 << shl;\n  502 |             if duo < div_original {\n  503 |                 return (quo, duo);\n  504 |             }\n  505 |             let mask: $uX;\n  506 |             if (div as $iX) < 0 {\n  507 |                 div >>= 1;\n  508 |                 shl -= 1;\n  509 |                 let tmp = 1 << shl;\n  510 |                 let sub = duo.wrapping_sub(div);\n  511 |                 if (sub as $iX) >= 0 {\n  512 |                     // restore\n  513 |                     duo = sub;\n  514 |                     quo |= tmp;\n  515 |                 }\n  516 |                 if duo < div_original {\n  517 |                     return (quo, duo);\n  518 |                 }\n  519 |                 mask = tmp - 1;\n  520 |             } else {\n  521 |                 mask = quo - 1;\n  522 |             }\n  523 | \n  524 |             // central loop\n  525 |             let div: $uX = div.wrapping_sub(1);\n  526 |             let mut i = shl;\n  527 |             loop {\n  528 |                 if i == 0 {\n  529 |                     break;\n  530 |                 }\n  531 |                 i -= 1;\n  532 |                 // note: the `wrapping_shl(1)` can be factored out, but would require another\n  533 |                 // restoring division step to prevent `(duo as $iX)` from overflowing\n  534 |                 if (duo as $iX) < 0 {\n  535 |                     // Negated binary long division step.\n  536 |                     duo = duo.wrapping_shl(1).wrapping_add(div);\n  537 |                 } else {\n  538 |                     // Normal long division step.\n  539 |                     duo = duo.wrapping_shl(1).wrapping_sub(div);\n  540 |                 }\n  541 |             }\n  542 |             if (duo as $iX) < 0 {\n  543 |                 // Restore. This was not needed in the original nonrestoring algorithm because of\n  544 |                 // the `duo < div_original` checks.\n  545 |                 duo = duo.wrapping_add(div);\n  546 |             }\n  547 |             // unpack\n  548 |             return ((duo & mask) | quo, duo >> shl);\n  549 |             */","lines":477,"link":"https://github.com/rust-lang/compiler-builtins/blob/81d14035f1659202feb650af86ebfbf2a733faf7/compiler-builtins/src/int/specialized_div_rem/binary_long.rs#L73-L549"}]},
{"id":"OTHER_1","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"Non-descriptive placeholder identifiers in production code: the closure type param is named `FnFoo` and a meaningful exponent threshold is named `foobar`. `foobar` holds `F::EXP_BIAS + I::Unsigned::BITS - 1`, the shift base used to compute the right-shift amount; the unhelpful name obscures intent in already-dense conversion code.","fix":"Rename `FnFoo` -> `FnInbounds` (or similar) and `foobar` -> `shift_base` / `max_shift`.","locations":[{"ref":"compiler-builtins/src/float/conv.rs:367","code":"  367 | fn float_to_int_inner<F, I, FnFoo, FnOob>(","lines":1,"link":"https://github.com/rust-lang/compiler-builtins/blob/81d14035f1659202feb650af86ebfbf2a733faf7/compiler-builtins/src/float/conv.rs#L367"},{"ref":"compiler-builtins/src/float/conv.rs:375","code":"  375 |     FnFoo: FnOnce(I) -> I,","lines":1,"link":"https://github.com/rust-lang/compiler-builtins/blob/81d14035f1659202feb650af86ebfbf2a733faf7/compiler-builtins/src/float/conv.rs#L375"},{"ref":"compiler-builtins/src/float/conv.rs:383","code":"  383 |     let foobar = F::EXP_BIAS + I::Unsigned::BITS - 1;","lines":1,"link":"https://github.com/rust-lang/compiler-builtins/blob/81d14035f1659202feb650af86ebfbf2a733faf7/compiler-builtins/src/float/conv.rs#L383"},{"ref":"compiler-builtins/src/float/conv.rs:400","code":"  400 |         let s: u32 = (foobar) - u32::cast_from(fbits >> F::SIG_BITS);","lines":1,"link":"https://github.com/rust-lang/compiler-builtins/blob/81d14035f1659202feb650af86ebfbf2a733faf7/compiler-builtins/src/float/conv.rs#L400"}]},
{"id":"OTHER_2","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"`OpScope::path_root` returns `todo!()` for the `LibmPrivate` variant. `ALL_OPERATIONS_NESTED` currently contains no `LibmPrivate` entries, so the `todo!()` is never hit, but `ALL_OPERATIONS` (a `LazyLock`) calls `path_root()` for every op at first access; the moment a `LibmPrivate` op is added, every consumer of `ALL_OPERATIONS` (macros, tests, util) panics at load time with an opaque `not yet implemented`.","fix":"Return a real path root (e.g. `\"libm::math\"` or the private module path) or a descriptive `unimplemented!` message, so adding a private op fails with guidance rather than a bare `todo!`.","locations":[{"ref":"crates/api-list-common/src/lib.rs:27-33","code":"   27 |     pub const fn path_root(self) -> &'static str {\n   28 |         match self {\n   29 |             OpScope::LibmPublic => \"libm\",\n   30 |             OpScope::LibmPrivate => todo!(),\n   31 |             OpScope::BuiltinsPublic => \"crate::builtins_wrapper\",\n   32 |         }\n   33 |     }","lines":7,"link":"https://github.com/rust-lang/compiler-builtins/blob/81d14035f1659202feb650af86ebfbf2a733faf7/crates/api-list-common/src/lib.rs#L27-L33"},{"ref":"crates/api-list-common/src/lib.rs:1526","code":" 1526 |                 path: format!(\"{}::{name}\", op.scope.path_root()),","lines":1,"link":"https://github.com/rust-lang/compiler-builtins/blob/81d14035f1659202feb650af86ebfbf2a733faf7/crates/api-list-common/src/lib.rs#L1526"}]},

<script>
(function(){
'use strict';

// Data
const FINDINGS     = JSON.parse(document.getElementById('D').textContent);
const PROJECT_INFO = JSON.parse(document.getElementById('PI').textContent);
const SEVS     = ['critical','high','medium','low','negligible'];
const STATUSES = ['open','fixed','wont-fix','false-positive'];
const ALL_TYPES = [...new Set(FINDINGS.map(f => f.type))].sort();
// Build lookup map for O(1) access
const FINDING_BY_ID = new Map(FINDINGS.map(f => [f.id, f]));
// Only severities actually present in the report — the filter bar hides the rest.
const PRESENT_SEVS = SEVS.filter(s => FINDINGS.some(f => (f.severity || 'medium') === s));
// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.
const DIFFICULTY_ORDER = ['very_easy','easy','medium','hard'];
const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};
const PRESENT_DIFFS = DIFFICULTY_ORDER.filter(d => FINDINGS.some(f => f.difficulty === d));
const HAS_DIFFICULTY = PRESENT_DIFFS.length > 0;
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State
const S = {
  search: '', searchScope: 'all', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenDiff: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(),
};
const statuses = {};

// Persistence
function loadStatuses() {
  try { Object.assign(statuses, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch {}
}
function saveStatuses() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(statuses)); } catch {}
}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;
function syncHash() {
  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));
    if (S.search)            p.set('q',   S.search);
    if (S.searchScope !== 'all') p.set('qs', S.searchScope);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('qs'))  { S.searchScope = p.get('qs'); }
  document.getElementById('search-scope').classList.toggle('active', S.searchScope === 'locations');
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Render a "**Label:** value" line. GitHub/CommonMark only recognizes a
// ``` fence when it starts at the beginning of a line, so if the value
// itself opens with a fence, put it on its own line instead of right
// after the inline label - otherwise the fence marker gets glued onto
// "**Label:** ```" and never renders as a code block.
function mdField(label, value) {
  value = value || '';
  return /^```/.test(value.trim())
    ? '**' + label + ':**\n\n' + value
    : '**' + label + ':** ' + value;
}

// Render the "**Locations:**" block. When a location has a commit-pinned
// permalink (GitHub/GitLab), just paste the bare URL on its own line -
// GitHub/GitLab auto-expand a line-range blob link into an inline code
// preview, so re-pasting the snippet as a fenced block would duplicate it.
// Forges without a detected permalink shape (or missing commit/repo info)
// fall back to the fenced ref+snippet so the location is still readable.
function mdLocations(locations) {
  if (!locations.length) return '';
  let out = '**Locations:**\n\n';
  for (const l of locations) {
    if (l.link)               out += l.link + '\n\n';
    else if (l.code != null)  out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
    else                      out += '- `' + l.ref + '` _(file not found)_\n\n';
  }
  return out;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += mdField('Description', f.description) + '\n\n';
      out += mdLocations(f.locations);
      out += mdField('Fix', f.fix) + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build a [project] header block from embedded PROJECT_INFO, so the exported
// findings.toml is self-contained (doesn't depend on a sibling project-info.toml
// that a second, separately-triggered download could silently fail to save).
// '' when there is no project info at all.
function buildProjectToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = PROJECT_INFO || {};
  if (!Object.keys(pi).length) return '';
  const lines = ['[project]'];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n\n';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return buildProjectToml() + chunks.join('\n\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += mdField('Description', f.description) + '\n\n';
  out += mdLocations(f.locations);
  out += mdField('Fix', f.fix) + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystacks per finding (cleared on full re-render).
// Two variants: everything (default), and file/folder paths only - for when a
// search term (e.g. a directory name like 'dlls/abc') also happens to appear
// inside description/fix prose and you only want path matches.
const _hay = new Map();
const _hayLoc = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}
function hayLocOf(f) {
  if (!_hayLoc.has(f.id)) {
    _hayLoc.set(f.id, f.locations.map(l => l.ref).join(' ').toLowerCase());
  }
  return _hayLoc.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (S.searchScope === 'locations') {
      if (!hayLocOf(f).includes(q)) return false;
    } else if (!hayOf(f).includes(q) && !st.includes(q)) {
      return false;
    }
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  _hayLoc.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    // Single download (was two) - a second auto-triggered download is commonly
    // blocked by the browser unless the user explicitly allows it, which silently
    // drops project-info.toml. Embedding [project] in findings.toml itself avoids
    // that failure mode entirely.
    downloadText(buildFindingsToml(), 'findings.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});
document.getElementById('search-scope').addEventListener('click', e => {
  S.searchScope = S.searchScope === 'locations' ? 'all' : 'locations';
  e.currentTarget.classList.toggle('active', S.searchScope === 'locations');
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
