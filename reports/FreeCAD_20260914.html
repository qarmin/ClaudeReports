<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"critical","difficulty":"very_easy","description":"`Document::redo(int id)` has no guard against calling it when there is nothing to redo, unlike its sibling `Document::undo(int id)`. In `undo()`, right after committing any pending transaction, there is an explicit `if (mUndoTransactions.empty()) { return false; }` before touching `mUndoTransactions.back()`. In `redo()` the equivalent guard is missing: it only has `assert(mRedoTransactions.size() != 0);`, which is compiled out in release builds (`NDEBUG`). If `redo(0)` is called while `mRedoTransactions` is empty (e.g. a stray call from Python scripting `App.ActiveDocument.redo()`, or a GUI/undo-stack desync bug elsewhere), `mRedoTransactions.back()` is invoked on an empty `std::list`, which is undefined behavior and will typically crash in a release build.","fix":"Mirror the check already present in `Document::undo()` by returning `false` when there is nothing to redo, instead of relying on an `assert` that disappears in release builds:\n\n```cpp\n// before\n    if (d->activeUndoTransaction) {\n        _commitTransaction(true);\n    }\n\n    assert(mRedoTransactions.size() != 0);\n\n    // undo\n    d->activeUndoTransaction = new Transaction(mRedoTransactions.back()->getID());\n\n// after\n    if (d->activeUndoTransaction) {\n        _commitTransaction(true);\n    }\n\n    if (mRedoTransactions.empty()) {\n        return false;\n    }\n\n    // undo\n    d->activeUndoTransaction = new Transaction(mRedoTransactions.back()->getID());\n```","locations":[{"ref":"src/App/Document.cpp:227-274","code":"  227 | bool Document::redo(const int id)\n  228 | {\n  229 |     if (id != 0) {\n  230 |         const auto it = mRedoMap.find(id);\n  231 |         if (it == mRedoMap.end()) {\n  232 |             return false;\n  233 |         }\n  234 |         while (!mRedoTransactions.empty() && mRedoTransactions.back() != it->second) {\n  235 |             redo(0);\n  236 |         }\n  237 |     }\n  238 | \n  239 |     if (d->activeUndoTransaction) {\n  240 |         _commitTransaction(true);\n  241 |     }\n  242 | \n  243 |     assert(mRedoTransactions.size() != 0);\n  244 | \n  245 |     // undo\n  246 |     d->activeUndoTransaction = new Transaction(mRedoTransactions.back()->getID());\n  247 |     d->activeUndoTransaction->Name = mRedoTransactions.back()->Name;\n  248 | \n  249 |     // do the redo\n  250 |     {\n  251 |         Base::FlagToggler<bool> flag(d->undoing);\n  252 |         mRedoTransactions.back()->apply(*this, true);\n  253 | \n  254 |         mUndoMap[d->activeUndoTransaction->getID()] = d->activeUndoTransaction;\n  255 |         mUndoTransactions.push_back(d->activeUndoTransaction);\n  256 |         d->activeUndoTransaction = nullptr;\n  257 |         d->bookedTransaction = 0;\n  258 | \n  259 |         mRedoMap.erase(mRedoTransactions.back()->getID());\n  260 |         delete mRedoTransactions.back();\n  261 |         mRedoTransactions.pop_back();\n  262 |     }\n  263 | \n  264 |     for (const auto& obj : d->objectArray) {\n  265 |         if (obj->testStatus(ObjectStatus::PendingTransactionUpdate)) {\n  266 |             obj->onUndoRedoFinished();\n  267 |             obj->setStatus(ObjectStatus::PendingTransactionUpdate, false);\n  268 |         }\n  269 |     }\n  270 | \n  271 |     signalRedo(*this);\n  272 |     signalBecameStable(*this);\n  273 |     return true;\n  274 | }","lines":48,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/Document.cpp#L227-L274"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`DocumentObjectWeakPtrT::Private::set()` retrieves `App::Document* doc = obj->getDocument();` and then unconditionally dereferences it (`doc->signalNewObject.connect(...)` and `doc->signalDeletedObject.connect(...)`) without checking `doc` for `nullptr`. If `obj` is a valid, non-null `DocumentObject*` that is not currently attached to any document (e.g. constructed but not yet added to a document, or already removed from one), `obj->getDocument()` returns `nullptr` and this crashes. The sibling class `DocumentWeakPtrT::Private` in the very same file handles the analogous situation correctly, only connecting `if (doc) { ... }` in its constructor, which shows this is a copy/paste-style inconsistency rather than an intentional precondition.","fix":"Guard the document dereference the same way `DocumentWeakPtrT::Private` does.\n\nBefore:\n```cpp\n    void set(App::DocumentObject* obj)\n    {\n        object = obj;\n        if (obj) {\n            // NOLINTBEGIN\n            indocument = true;\n            connectApplicationDeletedDocument = App::GetApplication().signalDeleteDocument.connect(\n                std::bind(&Private::deletedDocument, this, sp::_1)\n            );\n            App::Document* doc = obj->getDocument();\n            connectDocumentCreatedObject = doc->signalNewObject.connect(\n                std::bind(&Private::createdObject, this, sp::_1)\n            );\n            connectDocumentDeletedObject = doc->signalDeletedObject.connect(\n                std::bind(&Private::deletedObject, this, sp::_1)\n            );\n            // NOLINTEND\n        }\n    }\n```\nAfter:\n```cpp\n    void set(App::DocumentObject* obj)\n    {\n        object = obj;\n        if (obj) {\n            // NOLINTBEGIN\n            indocument = true;\n            connectApplicationDeletedDocument = App::GetApplication().signalDeleteDocument.connect(\n                std::bind(&Private::deletedDocument, this, sp::_1)\n            );\n            if (App::Document* doc = obj->getDocument()) {\n                connectDocumentCreatedObject = doc->signalNewObject.connect(\n                    std::bind(&Private::createdObject, this, sp::_1)\n                );\n                connectDocumentDeletedObject = doc->signalDeletedObject.connect(\n                    std::bind(&Private::deletedObject, this, sp::_1)\n                );\n            }\n            // NOLINTEND\n        }\n    }\n```","locations":[{"ref":"src/App/DocumentObserver.cpp:818-836","code":"  818 |     void set(App::DocumentObject* obj)\n  819 |     {\n  820 |         object = obj;\n  821 |         if (obj) {\n  822 |             // NOLINTBEGIN\n  823 |             indocument = true;\n  824 |             connectApplicationDeletedDocument = App::GetApplication().signalDeleteDocument.connect(\n  825 |                 std::bind(&Private::deletedDocument, this, sp::_1)\n  826 |             );\n  827 |             App::Document* doc = obj->getDocument();\n  828 |             connectDocumentCreatedObject = doc->signalNewObject.connect(\n  829 |                 std::bind(&Private::createdObject, this, sp::_1)\n  830 |             );\n  831 |             connectDocumentDeletedObject = doc->signalDeletedObject.connect(\n  832 |                 std::bind(&Private::deletedObject, this, sp::_1)\n  833 |             );\n  834 |             // NOLINTEND\n  835 |         }\n  836 |     }","lines":19,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/DocumentObserver.cpp#L818-L836"},{"ref":"src/App/DocumentObserver.cpp:722-752","code":"  722 | class DocumentWeakPtrT::Private\n  723 | {\n  724 | public:\n  725 |     explicit Private(App::Document* doc)\n  726 |         : _document(doc)\n  727 |     {\n  728 |         if (doc) {\n  729 |             // NOLINTBEGIN\n  730 |             connectApplicationDeletedDocument = App::GetApplication().signalDeleteDocument.connect(\n  731 |                 std::bind(&Private::deletedDocument, this, sp::_1)\n  732 |             );\n  733 |             // NOLINTEND\n  734 |         }\n  735 |     }\n  736 | \n  737 |     void deletedDocument(const App::Document& doc)\n  738 |     {\n  739 |         if (_document == &doc) {\n  740 |             reset();\n  741 |         }\n  742 |     }\n  743 |     void reset()\n  744 |     {\n  745 |         connectApplicationDeletedDocument.disconnect();\n  746 |         _document = nullptr;\n  747 |     }\n  748 | \n  749 |     App::Document* _document;\n  750 |     using Connection = fastsignals::scoped_connection;\n  751 |     Connection connectApplicationDeletedDocument;\n  752 | };","lines":31,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/DocumentObserver.cpp#L722-L752"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"high","difficulty":"very_easy","description":"`DocumentObserver::attachDocument(Document* doc)` does not check `doc` for `nullptr`. If it is called with `doc == nullptr` while a document is already attached, the guard `if (_document != doc)` is true (a non-null `_document` differs from `nullptr`), so the function calls `detachDocument()`, then sets `_document = doc` (now `nullptr`), and immediately dereferences it five times in a row (`_document->signalNewObject.connect(...)`, `_document->signalDeletedObject.connect(...)`, etc.), crashing with a null pointer dereference. The class already provides a separate `detachDocument()` for the \"stop observing\" use case, but nothing in `attachDocument()`'s implementation or its header documentation prevents a caller from passing `nullptr` to it directly.","fix":"Guard against a null `doc` before dereferencing it.\n\nBefore:\n```cpp\nvoid DocumentObserver::attachDocument(Document* doc)\n{\n    if (_document != doc) {\n        detachDocument();\n        _document = doc;\n\n        // NOLINTBEGIN\n        this->connectDocumentCreatedObject = _document->signalNewObject.connect(\n            std::bind(&DocumentObserver::slotCreatedObject, this, sp::_1)\n        );\n        ...\n```\nAfter:\n```cpp\nvoid DocumentObserver::attachDocument(Document* doc)\n{\n    if (_document != doc) {\n        detachDocument();\n        if (!doc) {\n            return;\n        }\n        _document = doc;\n\n        // NOLINTBEGIN\n        this->connectDocumentCreatedObject = _document->signalNewObject.connect(\n            std::bind(&DocumentObserver::slotCreatedObject, this, sp::_1)\n        );\n        ...\n```","locations":[{"ref":"src/App/DocumentObserver.cpp:940-964","code":"  940 | void DocumentObserver::attachDocument(Document* doc)\n  941 | {\n  942 |     if (_document != doc) {\n  943 |         detachDocument();\n  944 |         _document = doc;\n  945 | \n  946 |         // NOLINTBEGIN\n  947 |         this->connectDocumentCreatedObject = _document->signalNewObject.connect(\n  948 |             std::bind(&DocumentObserver::slotCreatedObject, this, sp::_1)\n  949 |         );\n  950 |         this->connectDocumentDeletedObject = _document->signalDeletedObject.connect(\n  951 |             std::bind(&DocumentObserver::slotDeletedObject, this, sp::_1)\n  952 |         );\n  953 |         this->connectDocumentChangedObject = _document->signalChangedObject.connect(\n  954 |             std::bind(&DocumentObserver::slotChangedObject, this, sp::_1, sp::_2)\n  955 |         );\n  956 |         this->connectDocumentRecomputedObject = _document->signalRecomputedObject.connect(\n  957 |             std::bind(&DocumentObserver::slotRecomputedObject, this, sp::_1)\n  958 |         );\n  959 |         this->connectDocumentRecomputed = _document->signalRecomputed.connect(\n  960 |             std::bind(&DocumentObserver::slotRecomputedDocument, this, sp::_1)\n  961 |         );\n  962 |         // NOLINTEND\n  963 |     }\n  964 | }","lines":25,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/DocumentObserver.cpp#L940-L964"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`MeasureManager::getMeasureHandler(const App::MeasureSelectionItem& selectionItem)` calls `App::DocumentObject* sub = objT.getSubObject();` and then immediately dereferences it with `sub->isDerivedFrom<App::Link>()` without checking for `nullptr`. `SubObjectT::getSubObject()` (see `src/App/DocumentObserver.cpp`) explicitly returns `nullptr` when the referenced object is missing or the sub-element path cannot be resolved (e.g. a stale/broken selection after document changes), so this is a reachable null-pointer dereference/crash. The same function also calls `sub->getTypeId()` at line 83 after possibly reassigning `sub = link->getLinkedObject(true)`, which can likewise return `nullptr`.","fix":"Guard against a null sub-object before dereferencing:\n```cpp\nApp::DocumentObject* sub = objT.getSubObject();\nif (!sub) {\n    return {};\n}\nif (sub->isDerivedFrom<App::Link>()) {\n    auto link = static_cast<App::Link*>(sub);\n    sub = link->getLinkedObject(true);\n    if (!sub) {\n        return {};\n    }\n}\n```","locations":[{"ref":"src/App/MeasureManager.cpp:72-87","code":"   72 | MeasureHandler MeasureManager::getMeasureHandler(const App::MeasureSelectionItem& selectionItem)\n   73 | {\n   74 |     auto objT = selectionItem.object;\n   75 | \n   76 |     // Resolve App::Link\n   77 |     App::DocumentObject* sub = objT.getSubObject();\n   78 |     if (sub->isDerivedFrom<App::Link>()) {\n   79 |         auto link = static_cast<App::Link*>(sub);\n   80 |         sub = link->getLinkedObject(true);\n   81 |     }\n   82 | \n   83 |     const auto className = sub->getTypeId().getName();\n   84 |     std::string mod = Base::Type::getModuleName(className);\n   85 | \n   86 |     return getMeasureHandler(mod.c_str());\n   87 | }","lines":16,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/MeasureManager.cpp#L72-L87"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`ObjectIdentifier::getStringList()` only pushes onto the local vector `l` when `documentNameSet` or `documentObjectNameSet` is true, but then unconditionally calls `l.back()` whenever `subObjectName` is non-empty:\n```cpp\nif (!result.resolvedProperty || result.resolvedDocumentObject != owner) {\n    if (documentNameSet) { l.push_back(...); }\n    if (documentObjectNameSet) { l.push_back(...); }\n}\nif (!subObjectName.getString().empty()) {\n    l.back() += subObjectName.toString();\n}\n```\n`ObjectIdentifier::setDocumentObjectName(const App::DocumentObject* obj, ...)` forces `force = false` (hence `documentObjectNameSet = false`) whenever `obj == owner`, i.e. for a self-referencing sub-element path (e.g. an object referring to a sub-element of itself, such as `Shape.Face1`). In that case `resolvedDocumentObject == owner` and `resolvedProperty` is typically found, so the outer `if` body never runs and `l` stays empty, while `subObjectName` can still be non-empty (it is set independently of the `force`/`documentObjectNameSet` flag). The subsequent `l.back()` is then undefined behavior on an empty vector.","fix":"Guard the `back()` access, e.g. by ensuring `l` always has an entry to append to:\n```cpp\nif (!subObjectName.getString().empty()) {\n    if (l.empty()) {\n        l.push_back(std::string());\n    }\n    l.back() += subObjectName.toString();\n}\n```","locations":[{"ref":"src/App/ObjectIdentifier.cpp:1127-1153","code":" 1127 | std::vector<std::string> ObjectIdentifier::getStringList() const\n 1128 | {\n 1129 |     std::vector<std::string> l;\n 1130 |     ResolveResults result(*this);\n 1131 | \n 1132 |     if (!result.resolvedProperty || result.resolvedDocumentObject != owner) {\n 1133 |         if (documentNameSet) {\n 1134 |             l.push_back(documentName.toString());\n 1135 |         }\n 1136 | \n 1137 |         if (documentObjectNameSet) {\n 1138 |             l.push_back(documentObjectName.toString());\n 1139 |         }\n 1140 |     }\n 1141 |     if (!subObjectName.getString().empty()) {\n 1142 |         l.back() += subObjectName.toString();\n 1143 |     }\n 1144 |     std::vector<Component>::const_iterator i = components.begin();\n 1145 |     while (i != components.end()) {\n 1146 |         std::ostringstream ss;\n 1147 |         i->toString(ss);\n 1148 |         l.push_back(ss.str());\n 1149 |         ++i;\n 1150 |     }\n 1151 | \n 1152 |     return l;\n 1153 | }","lines":27,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/ObjectIdentifier.cpp#L1127-L1153"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`DocumentObject::isInOutListRecursive()` computes `getDocument()->countObjects() + 2` without checking whether `getDocument()` returns `nullptr`. If this method is invoked on an object that is not currently attached to a document (e.g. a freshly constructed or already-removed `DocumentObject`), `getDocument()` returns `nullptr` and the call crashes with a null pointer dereference. Other DAG traversal helpers in the same file, such as `getInListEx()`/`isInInListRecursive()`, are careful to check `isAttachedToDocument()` before dereferencing related state.","fix":"Guard against a null document, e.g.:\n```cpp\nbool DocumentObject::isInOutListRecursive(DocumentObject* linkTo) const\n{\n    auto doc = getDocument();\n    int maxDepth = (doc ? doc->countObjects() : 0) + 2;\n    return _isInOutListRecursive(this, linkTo, maxDepth);\n}\n```","locations":[{"ref":"src/App/DocumentObject.cpp:733-737","code":"  733 | bool DocumentObject::isInOutListRecursive(DocumentObject* linkTo) const\n  734 | {\n  735 |     int maxDepth = getDocument()->countObjects() + 2;\n  736 |     return _isInOutListRecursive(this, linkTo, maxDepth);\n  737 | }","lines":5,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/DocumentObject.cpp#L733-L737"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"`DocumentObject::getFirstParent()` iterates `getInList()` and calls `obj->hasExtension(...)` without checking `obj` for `nullptr`. The structurally identical loop in `DocumentObject::getParents()`, in the same file, explicitly guards against this with `if (!parent || !parent->isAttachedToDocument()) continue;`, which implies the codebase does not treat `_inList` entries as unconditionally safe to dereference. If `getInList()` ever yields a null or stale entry, `getFirstParent()` crashes with a null pointer dereference, unlike its sibling function.","fix":"Add the same null guard used by `getParents()`.\n\nBefore:\n```cpp\nApp::DocumentObject* DocumentObject::getFirstParent() const\n{\n    for (auto obj : getInList()) {\n        if (obj->hasExtension(App::GroupExtension::getExtensionClassTypeId(), true)) {\n            return obj;\n        }\n    }\n\n    return nullptr;\n}\n```\n\nAfter:\n```cpp\nApp::DocumentObject* DocumentObject::getFirstParent() const\n{\n    for (auto obj : getInList()) {\n        if (obj && obj->hasExtension(App::GroupExtension::getExtensionClassTypeId(), true)) {\n            return obj;\n        }\n    }\n\n    return nullptr;\n}\n```","locations":[{"ref":"src/App/DocumentObject.cpp:1453-1462","code":" 1453 | App::DocumentObject* DocumentObject::getFirstParent() const\n 1454 | {\n 1455 |     for (auto obj : getInList()) {\n 1456 |         if (obj->hasExtension(App::GroupExtension::getExtensionClassTypeId(), true)) {\n 1457 |             return obj;\n 1458 |         }\n 1459 |     }\n 1460 | \n 1461 |     return nullptr;\n 1462 | }","lines":10,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/DocumentObject.cpp#L1453-L1462"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"`DocumentT::DocumentT(Document* doc)` and `DocumentT::operator=(const Document* doc)` dereference `doc` (`doc->getName()`) without any null check. This is inconsistent with the sibling class `DocumentObjectT`'s comparable constructor, `DocumentObjectT(const Document* doc, const std::string& objName)` (same file), which correctly guards with `if (doc && doc->getName())`. Since `DocumentT(Document*)` is deliberately left non-explicit (the code comment even says `// explicit bombs`, i.e. it must stay implicit for call-site convenience), it is very easy for a caller to pass a null `Document*` through an implicit conversion and crash.","fix":"Add null checks, matching the pattern already used by `DocumentObjectT`.\n\nBefore:\n```cpp\nDocumentT::DocumentT(Document* doc)\n    : document {doc->getName()}\n{}\n```\nAfter:\n```cpp\nDocumentT::DocumentT(Document* doc)\n    : document {doc ? doc->getName() : \"\"}\n{}\n```\n\nBefore:\n```cpp\nDocumentT& DocumentT::operator=(const Document* doc)\n{\n    document = doc->getName();\n    return *this;\n}\n```\nAfter:\n```cpp\nDocumentT& DocumentT::operator=(const Document* doc)\n{\n    document = doc ? doc->getName() : \"\";\n    return *this;\n}\n```","locations":[{"ref":"src/App/DocumentObserver.cpp:40-42","code":"   40 | DocumentT::DocumentT(Document* doc)\n   41 |     : document {doc->getName()}\n   42 | {}","lines":3,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/DocumentObserver.cpp#L40-L42"},{"ref":"src/App/DocumentObserver.cpp:74-78","code":"   74 | DocumentT& DocumentT::operator=(const Document* doc)\n   75 | {\n   76 |     document = doc->getName();\n   77 |     return *this;\n   78 | }","lines":5,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/DocumentObserver.cpp#L74-L78"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`LinkBaseExtension::getLinkedChildren()` iterates `_getElementListValue()` and calls `o->hasExtension(...)` without checking `o` for null:\n```cpp\nfor (auto o : _getElementListValue()) {\n    if (!o->hasExtension(GroupExtension::getExtensionClassTypeId(), false)) {\n        ret.push_back(o);\n    }\n}\n```\nEvery other consumer of the same element list in `Link.cpp` (e.g. `LinkBaseExtension::updateGroup()`, which does `if (!o || !o->isAttachedToDocument()) continue;`) defends against null entries, implying the list can legitimately contain them (e.g. after object deletion/undo races). `getLinkedChildren()` is also exposed directly to Python via `LinkBaseExtensionPy::getLinkedChildren()` in `LinkBaseExtensionPyImp.cpp`, which likewise dereferences the returned objects (`o->getPyObject()`) with no null check, so a null entry in the list crashes the interpreter.","fix":"Skip null/detached entries like the other call sites in this file do:\n```cpp\nfor (auto o : _getElementListValue()) {\n    if (o && !o->hasExtension(GroupExtension::getExtensionClassTypeId(), false)) {\n        ret.push_back(o);\n    }\n}\n```","locations":[{"ref":"src/App/Link.cpp:2520-2532","code":" 2520 | std::vector<App::DocumentObject*> LinkBaseExtension::getLinkedChildren(bool filter) const\n 2521 | {\n 2522 |     if (!filter) {\n 2523 |         return _getElementListValue();\n 2524 |     }\n 2525 |     std::vector<App::DocumentObject*> ret;\n 2526 |     for (auto o : _getElementListValue()) {\n 2527 |         if (!o->hasExtension(GroupExtension::getExtensionClassTypeId(), false)) {\n 2528 |             ret.push_back(o);\n 2529 |         }\n 2530 |     }\n 2531 |     return ret;\n 2532 | }","lines":13,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/Link.cpp#L2520-L2532"},{"ref":"src/App/LinkBaseExtensionPyImp.cpp:320-327","code":"  320 | Py::List LinkBaseExtensionPy::getLinkedChildren() const\n  321 | {\n  322 |     Py::List ret;\n  323 |     for (auto o : getLinkBaseExtensionPtr()->getLinkedChildren(true)) {\n  324 |         ret.append(Py::asObject(o->getPyObject()));\n  325 |     }\n  326 |     return ret;\n  327 | }","lines":8,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/LinkBaseExtensionPyImp.cpp#L320-L327"}]},
{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`MappedName::operator[]` in `MappedName.h` clamps an out-of-range `index` to `this->postfix.size() - 1` but then computes the return expression as `this->postfix[index - this->data.size()]`, subtracting `this->data.size()` a second time from a value that has already been rebased into `postfix`-relative terms. For any `index` at or beyond the total `size()` (including the trivial case of calling `operator[](0)` on a default-constructed empty `MappedName`, where both `data.size()` and `postfix.size()` are `0`), this computes a negative index into `postfix`, causing an out-of-bounds/negative-index access on the underlying `QByteArray` (an assertion failure in debug builds, undefined behavior/memory-unsafe read in release builds). This contradicts the documented contract that `operator[]` should return `0` and stay in-bounds when the offset is out of range.","fix":"Do not subtract `this->data.size()` again after the index has already been rebased into `postfix`-relative terms:\n```cpp\nchar operator[](int index) const\n{\n    if (index < 0) {\n        index = 0;\n    }\n    if (index >= this->data.size()) {\n        index -= this->data.size();\n        if (index > this->postfix.size() - 1) {\n            index = this->postfix.size() - 1;\n        }\n        return this->postfix[index];\n    }\n    return this->data[index];\n}\n```","locations":[{"ref":"src/App/MappedName.h:834-846","code":"  834 |     char operator[](int index) const\n  835 |     {\n  836 |         if (index < 0) {\n  837 |             index = 0;\n  838 |         }\n  839 |         if (index >= this->data.size()) {\n  840 |             if (index - this->data.size() > this->postfix.size() - 1) {\n  841 |                 index = this->postfix.size() - 1;\n  842 |             }\n  843 |             return this->postfix[index - this->data.size()];\n  844 |         }\n  845 |         return this->data[index];\n  846 |     }","lines":13,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/MappedName.h#L834-L846"}]},
{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`PropertyExpressionEngine::renameObjectIdentifiers` (`src/App/PropertyExpressionEngine.cpp:920-927`) and `PropertyExpressionEngine::getLinksTo` (`src/App/PropertyExpressionEngine.cpp:1206-1243`, dereference at line 1219) both dereference `it.second.expression` / `expressionInfo.expression` (a `std::shared_ptr<App::Expression>`) without first checking it for null, unlike every other iteration over the `expressions` map in this same file (`hasSetValue`, `onContainerRestored`, `Copy`, `adjustLink`, `onRelabeledDocument`, `getPathsToDocumentObject`, `updateElementReference` all guard with `if (e.second.expression)` before use). `PropertyExpressionEngine::Copy()` explicitly guards against a null `expression` in an `ExpressionInfo`, implying the invariant \"an entry in `expressions` always has a non-null `expression`\" is not something the rest of the class relies on unconditionally. `renameObjectIdentifiers` is reachable from the global signal handlers `onRenameDynamicProperty`/`onMoveDynamicProperty`, which run for every live `PropertyExpressionContainer` in the application (via `_ExprContainers`), so a null `expression` in any one document's expression engine would crash unrelated documents processing the same rename/move event.","fix":"Guard both dereferences the same way the rest of the file does, e.g. in `renameObjectIdentifiers`:\n```cpp\nfor (const auto& it : expressions) {\n    if (!it.second.expression) {\n        continue;\n    }\n    RenameObjectIdentifierExpressionVisitor<PropertyExpressionEngine> v(*this, paths, it.first);\n    it.second.expression->visit(v);\n}\n```\nand similarly skip entries with a null `expressionInfo.expression` in `getLinksTo` before calling `expressionInfo.expression->getDeps(option)`.","locations":[{"ref":"src/App/PropertyExpressionEngine.cpp:920-927","code":"  920 | void PropertyExpressionEngine::renameObjectIdentifiers(\n  921 |     const std::map<ObjectIdentifier, ObjectIdentifier>& paths)\n  922 | {\n  923 |     for (const auto& it : expressions) {\n  924 |         RenameObjectIdentifierExpressionVisitor<PropertyExpressionEngine> v(*this, paths, it.first);\n  925 |         it.second.expression->visit(v);\n  926 |     }\n  927 | }","lines":8,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/PropertyExpressionEngine.cpp#L920-L927"},{"ref":"src/App/PropertyExpressionEngine.cpp:1218-1219","code":" 1218 |     for (auto& [expressionId, expressionInfo] : expressions) {\n 1219 |         const auto& deps = expressionInfo.expression->getDeps(option);","lines":2,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/PropertyExpressionEngine.cpp#L1218-L1219"}]},
{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`Meta::Dependency::Dependency(const XERCES_CPP_NAMESPACE::DOMElement* elem)` dereferences `elem` immediately (`elem->getAttribute(...)`) with no null check, unlike the sibling parsing constructors `Meta::Contact::Contact`, `Meta::License::License`, and `Meta::Url::Url` in the same file, which all guard with `if (!elem) { return; }` before touching the pointer. All current call sites in `Metadata::parseVersion1` happen to pass a non-null, already-`dynamic_cast`-validated element, so it is not exercised today, but the inconsistency is a latent null-pointer-dereference trap for any future or external caller of this constructor.","fix":"Add the same guard used by the other DOM-parsing constructors:\n```cpp\nMeta::Dependency::Dependency(const XERCES_CPP_NAMESPACE::DOMElement* elem)\n{\n    if (!elem) {\n        return;\n    }\n    version_lt = StrXUTF8(elem->getAttribute(XUTF8StrLiteral(\"version_lt\").unicodeForm())).str;\n    ...\n```","locations":[{"ref":"src/App/Metadata.cpp:1079-1114","code":" 1079 | Meta::Dependency::Dependency(const XERCES_CPP_NAMESPACE::DOMElement* elem)\n 1080 | {\n 1081 |     version_lt = StrXUTF8(elem->getAttribute(XUTF8StrLiteral(\"version_lt\").unicodeForm())).str;\n 1082 |     version_lte = StrXUTF8(elem->getAttribute(XUTF8StrLiteral(\"version_lte\").unicodeForm())).str;\n 1083 |     version_eq = StrXUTF8(elem->getAttribute(XUTF8StrLiteral(\"version_eq\").unicodeForm())).str;\n 1084 |     version_gte = StrXUTF8(elem->getAttribute(XUTF8StrLiteral(\"version_gte\").unicodeForm())).str;\n 1085 |     version_gt = StrXUTF8(elem->getAttribute(XUTF8StrLiteral(\"version_gt\").unicodeForm())).str;\n 1086 |     condition = StrXUTF8(elem->getAttribute(XUTF8StrLiteral(\"condition\").unicodeForm())).str;\n 1087 |     std::string opt_string = StrXUTF8(elem->getAttribute(XUTF8StrLiteral(\"optional\").unicodeForm())).str;\n 1088 |     if (opt_string == \"true\"\n 1089 |         || opt_string == \"True\") {  // Support Python capitalization in this one case...\n 1090 |         optional = true;\n 1091 |     }\n 1092 |     else {\n 1093 |         optional = false;\n 1094 |     }\n 1095 |     std::string type_string = StrXUTF8(elem->getAttribute(XUTF8StrLiteral(\"type\").unicodeForm())).str;\n 1096 |     if (type_string == \"automatic\" || type_string.empty()) {\n 1097 |         dependencyType = Meta::DependencyType::automatic;\n 1098 |     }\n 1099 |     else if (type_string == \"addon\") {\n 1100 |         dependencyType = Meta::DependencyType::addon;\n 1101 |     }\n 1102 |     else if (type_string == \"internal\") {\n 1103 |         dependencyType = Meta::DependencyType::internal;\n 1104 |     }\n 1105 |     else if (type_string == \"python\") {\n 1106 |         dependencyType = Meta::DependencyType::python;\n 1107 |     }\n 1108 |     else {\n 1109 |         auto message = std::string(\"Invalid dependency type \\\"\") + type_string + \"\\\"\";\n 1110 |         throw Base::XMLBaseException(message);\n 1111 |     }\n 1112 | \n 1113 |     package = StrXUTF8(elem->getTextContent()).str;\n 1114 | }","lines":36,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/Metadata.cpp#L1079-L1114"}]},
{"id":"UAF_1","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"hard","description":"`Application::openDocuments()` can return a vector containing a dangling `Document*` for a document it was explicitly asked to open. The result slot is only ever written inside the per-pass loop with `if (isMainDoc) res[count] = doc;` (`src/App/Application.cpp:1040-1041`), and `isMainDoc` is computed as `(pass == 0 && count < filenames.size())` (`src/App/Application.cpp:1004`) — i.e. it is only true during the very first pass.\n\nLater in the same call, during post-processing, any document (including one of the requested \"main\" documents) whose `doc->afterRestore(true)` returns `false` (which happens when an externally linked document's timestamp doesn't match, marking the object as touched, see the comment at `src/App/Application.cpp:1131-1137`) is explicitly destroyed: its filename is pushed to `_pendingDocs` for another pass and then `closeDocument(doc->getName())` is called on it (`src/App/Application.cpp:1138-1146`), which deletes the `Document` via `std::unique_ptr` in `Application::closeDocument()`.\n\nWhen the outer `do`/`while` loop runs the next pass to reopen that same document, `pass` is now `>= 1`, so `isMainDoc` is `false` for it and `res[count]` is never updated to point at the freshly-created replacement `Document`. The stale entry in `res` therefore still points at the `Document` object that was just deleted. `Application::openDocuments()` returns this `res` vector unchanged (`src/App/Application.cpp:1168`), and `Application::openDocument()` forwards `docs.front()` straight through (`src/App/Application.cpp:920-926`). Any caller that dereferences the returned pointer — e.g. `ApplicationPy::sOpenDocument()` in `src/App/ApplicationPy.cpp:147-149`, which does `GetApplication().openDocument(...)->getPyObject()` with no null/validity check at all — ends up calling a virtual/member function through a freed `Document`, which is undefined behavior and a likely crash or exploitable memory corruption.","fix":"Track the requested \"main\" documents by stable identity (e.g. `App::DocumentT`, which resolves by document name and safely returns `nullptr` if the document no longer exists) instead of by raw `Document*` captured only during pass 0. For example, keep a `std::vector<DocumentT> resT(filenames.size())` alongside `res`, update `resT[count]` whenever a document for that requested file is (re)created in any pass, and at the very end of `openDocuments()` resolve `res[count] = resT[count].getDocument();` so a document that was closed and reopened for a full reload is reflected correctly instead of leaving a dangling pointer. Additionally, `ApplicationPy::sOpenDocument()` should check the result of `openDocument()` for `nullptr` before calling `->getPyObject()`, the same way `ApplicationPy::sGetDocument()` already does.","locations":[{"ref":"src/App/Application.cpp:1002-1042","code":" 1002 |         for (std::size_t count=0;; ++count) {\n 1003 |             std::string name = std::move(_pendingDocs.front());\n 1004 |             _pendingDocs.pop_front();\n 1005 |             bool isMainDoc = (pass == 0 && count < filenames.size());\n 1006 | \n 1007 |             try {\n 1008 |                 _objCount = -1;\n 1009 |                 std::vector<std::string> objNames;\n 1010 |                 if (_allowPartial) {\n 1011 |                     auto it = _pendingDocMap.find(name);\n 1012 |                     if (it != _pendingDocMap.end()) {\n 1013 |                         if(isMainDoc)\n 1014 |                             it->second.clear();\n 1015 |                         else\n 1016 |                             objNames.swap(it->second);\n 1017 |                         _pendingDocMap.erase(it);\n 1018 |                     }\n 1019 |                 }\n 1020 | \n 1021 |                 DocTiming timing;\n 1022 |                 std::chrono::high_resolution_clock::time_point startTime = std::chrono::high_resolution_clock::now();\n 1023 | \n 1024 |                 const char *path = name.c_str();\n 1025 |                 const char *label = nullptr;\n 1026 |                 if (isMainDoc) {\n 1027 |                     if (paths && paths->size()>count)\n 1028 |                         path = (*paths)[count].c_str();\n 1029 | \n 1030 |                     if (labels && labels->size()>count)\n 1031 |                         label = (*labels)[count].c_str();\n 1032 |                 }\n 1033 | \n 1034 |                 auto doc = openDocumentPrivate(path, name.c_str(), label, isMainDoc, initFlags, std::move(objNames));\n 1035 |                 timing.d1 += std::chrono::duration_cast<std::chrono::duration<double>>(std::chrono::high_resolution_clock::now() - startTime);\n 1036 |                 if (doc) {\n 1037 |                     timings[doc].d1 += timing.d1;\n 1038 |                     newDocs.emplace(doc);\n 1039 |                 }\n 1040 | \n 1041 |                 if (isMainDoc)\n 1042 |                     res[count] = doc;","lines":41,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/Application.cpp#L1002-L1042"},{"ref":"src/App/Application.cpp:1126-1149","code":" 1126 |             // Finalize document restoring with the correct order\n 1127 |             if(doc->afterRestore(true)) {\n 1128 |                 openedDocs.emplace_back(doc);\n 1129 |                 it = docs.erase(it);\n 1130 |             } else {\n 1131 |                 ++it;\n 1132 |                 // Here means this is a partial loaded document, and we need to\n 1133 |                 // reload it fully because of touched objects. The reason of\n 1134 |                 // reloading a partial document with touched object is because\n 1135 |                 // partial document is supposed to be readonly, while a\n 1136 |                 // 'touched' object requires recomputation. And an object may\n 1137 |                 // become touched during restoring if externally linked\n 1138 |                 // document time stamp mismatches with the stamp saved.\n 1139 |                 _pendingDocs.emplace_back(doc->FileName.getValue());\n 1140 |                 _pendingDocMap.erase(doc->FileName.getValue());\n 1141 |             }\n 1142 |             timing.d2 += std::chrono::duration_cast<std::chrono::duration<double>>(std::chrono::high_resolution_clock::now() - startTime);\n 1143 |             seq.next();\n 1144 |         }\n 1145 |         // Close the document for reloading\n 1146 |         for(const auto doc : docs)\n 1147 |             closeDocument(doc->getName());\n 1148 | \n 1149 |     }while(!_pendingDocs.empty());","lines":24,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/Application.cpp#L1126-L1149"},{"ref":"src/App/Application.cpp:1169","code":" 1169 |     return res;","lines":1,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/Application.cpp#L1169"},{"ref":"src/App/ApplicationPy.cpp:120-150","code":"  120 | PyObject* ApplicationPy::sOpenDocument(PyObject* /*self*/, PyObject* args, PyObject* kwd)\n  121 | {\n  122 |     char* Name {};\n  123 |     PyObject* hidden = Py_False;\n  124 |     PyObject* temporary = Py_False;\n  125 |     static const std::array<const char*, 4> kwlist {\"name\", \"hidden\", \"temporary\", nullptr};\n  126 |     if (!Base::Wrapped_ParseTupleAndKeywords(args,\n  127 |                                              kwd,\n  128 |                                              \"et|O!O!\",\n  129 |                                              kwlist,\n  130 |                                              \"utf-8\",\n  131 |                                              &Name,\n  132 |                                              &PyBool_Type,\n  133 |                                              &hidden,\n  134 |                                              &PyBool_Type,\n  135 |                                              &temporary)) {\n  136 |         return nullptr;\n  137 |     }\n  138 |     std::string EncodedName = std::string(Name);\n  139 |     PyMem_Free(Name);\n  140 |     try {\n  141 |         DocumentInitFlags initFlags {\n  142 |             .createView = !Base::asBoolean(hidden),\n  143 |             .temporary = Base::asBoolean(temporary)\n  144 |         };\n  145 | \n  146 |         // return new document\n  147 |         return (GetApplication()\n  148 |                     .openDocument(EncodedName.c_str(), initFlags)\n  149 |                     ->getPyObject());\n  150 |     }","lines":31,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/ApplicationPy.cpp#L120-L150"}]},
{"id":"UAF_2","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"easy","description":"`MeasureManagerPy::addMeasureType` parses a Python object with `PyArg_ParseTuple(args, \"ssO\", &id, &label, &pyobj)`. The `\"O\"` format code yields a *borrowed* reference (no refcount increment). The code then stores this borrowed pointer indefinitely in a heap-allocated `App::MeasureType` that is pushed onto the static `MeasureManager::_mMeasureTypes` registry via `MeasureManager::addMeasureType(new App::MeasureType{id, label, \"\", nullptr, nullptr, true, pyobj})`, without ever calling `Py_INCREF(pyobj)`. If the caller's only reference to that Python object goes out of scope (e.g. it was a temporary expression), the object can be garbage-collected while `MeasureType::pythonClass` still points to it, so later uses (e.g. `MeasureManagerPy::getMeasureTypes` wrapping `it->pythonClass` in a `Py::Object`, or `MeasureManager::getValidMeasureTypes` calling `measurePyClass.callMemberFunction(...)`) operate on a dangling pointer.","fix":"Take ownership of the reference before storing it long-term:\n```cpp\nPyObject* MeasureManagerPy::addMeasureType(PyObject* args)\n{\n    PyObject* pyobj = Py_None;\n    char *id, *label;\n\n    if (!PyArg_ParseTuple(args, \"ssO\", &id, &label, &pyobj)) {\n        return nullptr;\n    }\n\n    Py_INCREF(pyobj);\n    MeasureManager::addMeasureType(\n        new App::MeasureType {id, label, \"\", nullptr, nullptr, true, pyobj});\n\n    Py_Return;\n}\n```","locations":[{"ref":"src/App/MeasureManagerPyImp.cpp:51-64","code":"   51 | PyObject* MeasureManagerPy::addMeasureType(PyObject* args)\n   52 | {\n   53 |     PyObject* pyobj = Py_None;\n   54 |     char *id, *label;\n   55 | \n   56 |     if (!PyArg_ParseTuple(args, \"ssO\", &id, &label, &pyobj)) {\n   57 |         return nullptr;\n   58 |     }\n   59 | \n   60 |     MeasureManager::addMeasureType(\n   61 |         new App::MeasureType {id, label, \"\", nullptr, nullptr, true, pyobj});\n   62 | \n   63 |     Py_Return;\n   64 | }","lines":14,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/MeasureManagerPyImp.cpp#L51-L64"}]},
{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"`MergeDocuments::importObjects` heap-allocates `this->stream = new zipios::ZipInputStream(input);` and only `delete`s it after `appdoc->importObjects(reader)` returns successfully. `importObjects` parses potentially malformed/attacker-controlled XML/zip data and can throw (e.g. on corrupt zip entries or XML parse errors propagated from `XMLMergeReader`/`Base::XMLReader`). If it throws, execution never reaches `delete this->stream;`, leaking the `ZipInputStream`, and `this->stream` is left dangling (non-null, already-destructed `input`-bound stream) since the destructor `~MergeDocuments()` also never deletes `stream`.","fix":"Use RAII (e.g. `std::unique_ptr`) or a try/catch that cleans up before rethrowing:\n```cpp\nstd::vector<App::DocumentObject*> MergeDocuments::importObjects(std::istream& input)\n{\n    this->nameMap.clear();\n    this->stream = new zipios::ZipInputStream(input);\n    try {\n        XMLMergeReader reader(this->nameMap, \"<memory>\", *stream);\n        reader.setVerbose(isVerbose());\n        std::vector<App::DocumentObject*> objs = appdoc->importObjects(reader);\n        delete this->stream;\n        this->stream = nullptr;\n        return objs;\n    }\n    catch (...) {\n        delete this->stream;\n        this->stream = nullptr;\n        throw;\n    }\n}\n```","locations":[{"ref":"src/App/MergeDocuments.cpp:107-119","code":"  107 | std::vector<App::DocumentObject*> MergeDocuments::importObjects(std::istream& input)\n  108 | {\n  109 |     this->nameMap.clear();\n  110 |     this->stream = new zipios::ZipInputStream(input);\n  111 |     XMLMergeReader reader(this->nameMap, \"<memory>\", *stream);\n  112 |     reader.setVerbose(isVerbose());\n  113 |     std::vector<App::DocumentObject*> objs = appdoc->importObjects(reader);\n  114 | \n  115 |     delete this->stream;\n  116 |     this->stream = nullptr;\n  117 | \n  118 |     return objs;\n  119 | }","lines":13,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/MergeDocuments.cpp#L107-L119"}]},
{"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"`PropertyContainerPy::restorePropertyContent` (`src/App/PropertyContainerPyImp.cpp:587-629`) acquires a buffer view with `PyObject_GetBuffer(buffer, &buf, PyBUF_SIMPLE)` but never calls `PyBuffer_Release(&buf)` on any exit path (the \"not contiguous\" error return, the `catch (...)` error return, and the successful `Py_Return` all fall through without releasing `buf`). This leaks the buffer's reference/lock: `PyObject_GetBuffer` increments the exporting object's export count, and per the Python buffer protocol it must be matched with `PyBuffer_Release` or the exporting object can never be resized/deallocated correctly while the stale export count remains. Contrast with the very similar `dumpPropertyContent` a few dozen lines above, which does call `PyBuffer_Release(&buf)` on both its success and exception paths.","fix":"Release the buffer on every exit path, e.g.:\n```cpp\nPy_buffer buf;\nif (PyObject_GetBuffer(buffer, &buf, PyBUF_SIMPLE) < 0) {\n    return nullptr;\n}\n\nif (!PyBuffer_IsContiguous(&buf, 'C')) {\n    PyErr_SetString(PyExc_TypeError, \"Buffer must be contiguous\");\n    PyBuffer_Release(&buf);\n    return nullptr;\n}\n\ntry {\n    using Device = boost::iostreams::basic_array_source<char>;\n    boost::iostreams::stream<Device> stream((char*)buf.buf, buf.len);\n    prop->restoreFromStream(stream);\n}\ncatch (...) {\n    PyBuffer_Release(&buf);\n    PyErr_SetString(PyExc_IOError, \"Unable to restore content\");\n    return nullptr;\n}\n\nPyBuffer_Release(&buf);\nPy_Return;\n```","locations":[{"ref":"src/App/PropertyContainerPyImp.cpp:587-629","code":"  587 | PyObject* PropertyContainerPy::restorePropertyContent(PyObject* args)\n  588 | {\n  589 |     PyObject* buffer {};\n  590 |     char* property {};\n  591 |     if (!PyArg_ParseTuple(args, \"sO\", &property, &buffer)) {\n  592 |         return nullptr;\n  593 |     }\n  594 | \n  595 |     Property* prop = getPropertyContainerPtr()->getPropertyByName(property);\n  596 |     if (!prop) {\n  597 |         PyErr_Format(PyExc_AttributeError, \"Property container has no property '%s'\", property);\n  598 |         return nullptr;\n  599 |     }\n  600 | \n  601 |     // check if it really is a buffer\n  602 |     if (!PyObject_CheckBuffer(buffer)) {\n  603 |         PyErr_SetString(PyExc_TypeError, \"Must be a buffer object\");\n  604 |         return nullptr;\n  605 |     }\n  606 | \n  607 |     Py_buffer buf;\n  608 |     if (PyObject_GetBuffer(buffer, &buf, PyBUF_SIMPLE) < 0) {\n  609 |         return nullptr;\n  610 |     }\n  611 | \n  612 |     if (!PyBuffer_IsContiguous(&buf, 'C')) {\n  613 |         PyErr_SetString(PyExc_TypeError, \"Buffer must be contiguous\");\n  614 |         return nullptr;\n  615 |     }\n  616 | \n  617 |     // check if it really is a buffer\n  618 |     try {\n  619 |         using Device = boost::iostreams::basic_array_source<char>;\n  620 |         boost::iostreams::stream<Device> stream((char*)buf.buf, buf.len);\n  621 |         prop->restoreFromStream(stream);\n  622 |     }\n  623 |     catch (...) {\n  624 |         PyErr_SetString(PyExc_IOError, \"Unable to restore content\");\n  625 |         return nullptr;\n  626 |     }\n  627 | \n  628 |     Py_Return;\n  629 | }","lines":43,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/PropertyContainerPyImp.cpp#L587-L629"}]},
{"id":"MEM_3","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"very_easy","description":"`ApplicationPy::sConfigDump()` leaks a Python reference for every entry in the application's configuration map. `PyDict_SetItemString(dict, It.first.c_str(), PyUnicode_FromString(It.second.c_str()));` passes a freshly created `PyUnicode` object as the `val` argument, but `PyDict_SetItemString()` does not steal a reference to `val` (only the C string `key` is borrowed/copied). Since the `PyUnicode_FromString(...)` return value is never bound to a variable or `Py_DECREF`'d, this leaks one `str` object per config key on every call to `App.ConfigDump()`.","fix":"Bind the new reference to a variable, insert it, then release it:\n\n```cpp\n// before\n    PyObject* dict = PyDict_New();\n    for (const auto& It : Application::Config()) {\n        PyDict_SetItemString(dict, It.first.c_str(), PyUnicode_FromString(It.second.c_str()));\n    }\n    return dict;\n\n// after\n    PyObject* dict = PyDict_New();\n    for (const auto& It : Application::Config()) {\n        PyObject* value = PyUnicode_FromString(It.second.c_str());\n        PyDict_SetItemString(dict, It.first.c_str(), value);\n        Py_DECREF(value);\n    }\n    return dict;\n```","locations":[{"ref":"src/App/ApplicationPy.cpp:433-444","code":"  433 | PyObject* ApplicationPy::sConfigDump(PyObject* /*self*/, PyObject* args)\n  434 | {\n  435 |     if (!PyArg_ParseTuple(args, \"\")) {\n  436 |         return nullptr;\n  437 |     }\n  438 | \n  439 |     PyObject* dict = PyDict_New();\n  440 |     for (const auto& It : Application::Config()) {\n  441 |         PyDict_SetItemString(dict, It.first.c_str(), PyUnicode_FromString(It.second.c_str()));\n  442 |     }\n  443 |     return dict;\n  444 | }","lines":12,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/ApplicationPy.cpp#L433-L444"}]},
{"id":"MEM_4","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"very_easy","description":"`ApplicationPy::sListDocuments()` leaks a Python reference for every document it lists. Inside the loop, `pKey = PyUnicode_FromString(doc->getName());` creates a new reference, and `PyDict_SetItem(pDict, pKey, pValue);` does **not** steal a reference to either argument (unlike `PyDict_SetItemString`/`PyList_SET_ITEM`-style stealing APIs). The code correctly balances `pValue` with `pValue->DecRef();` right after (per the comment), but never calls `Py_DECREF(pKey)`, so each call to this method (`App.listDocuments()`/`App.ListDocuments()` from Python) permanently leaks one `str` object per open document.","fix":"Release the key reference once it has been inserted into the dict, mirroring what is already done for `pValue`:\n\n```cpp\n// before\n        for (auto doc : docs) {\n            pKey = PyUnicode_FromString(doc->getName());\n            // GetPyObject() increments\n            pValue = static_cast<Base::PyObjectBase*>(doc->getPyObject());\n            PyDict_SetItem(pDict, pKey, pValue);\n            // now we can decrement again as PyDict_SetItem also has incremented\n            pValue->DecRef();\n        }\n\n// after\n        for (auto doc : docs) {\n            pKey = PyUnicode_FromString(doc->getName());\n            // GetPyObject() increments\n            pValue = static_cast<Base::PyObjectBase*>(doc->getPyObject());\n            PyDict_SetItem(pDict, pKey, pValue);\n            // now we can decrement again as PyDict_SetItem also has incremented\n            pValue->DecRef();\n            Py_DECREF(pKey);\n        }\n```","locations":[{"ref":"src/App/ApplicationPy.cpp:786-810","code":"  786 |     PY_TRY\n  787 |     {\n  788 |         PyObject* pDict = PyDict_New();\n  789 |         PyObject* pKey {};\n  790 |         Base::PyObjectBase* pValue {};\n  791 | \n  792 |         std::vector<Document*> docs = GetApplication().getDocuments();\n  793 |         ;\n  794 |         if (Base::asBoolean(sort)) {\n  795 |             docs = Document::getDependentDocuments(docs, true);\n  796 |         }\n  797 | \n  798 |         for (auto doc : docs) {\n  799 |             pKey = PyUnicode_FromString(doc->getName());\n  800 |             // GetPyObject() increments\n  801 |             pValue = static_cast<Base::PyObjectBase*>(doc->getPyObject());\n  802 |             PyDict_SetItem(pDict, pKey, pValue);\n  803 |             // now we can decrement again as PyDict_SetItem also has incremented\n  804 |             pValue->DecRef();\n  805 |         }\n  806 | \n  807 |         return pDict;\n  808 |     }\n  809 |     PY_CATCH;\n  810 | }","lines":25,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/ApplicationPy.cpp#L786-L810"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"very_easy","description":"The helper `essentiallyInteger(double a, long &l, int &i)` in `src/App/Expression.cpp` (used by `pyFromQuantity()` to decide how to convert a dimensionless `Quantity` back into a Python `int`/`float`) has an asymmetric copy-paste bug for large positive values. For the \"fits in `long` but not in `int`\" case it does:\n\n```cpp\nelse if (intpart <= static_cast<double>(std::numeric_limits<long>::max())) {\n    l = static_cast<int>(intpart);   // should be static_cast<long>(intpart)\n    return 2;\n}\n```\nCompare this with the symmetric negative-value branch just above it, which correctly does `l = static_cast<long>(intpart);`. Because `intpart` is only reachable here when it has already failed the `intpart <= std::numeric_limits<int>::max()` check, truncating it through `static_cast<int>` first produces implementation-defined/incorrect results (the value silently wraps to whatever a 32-bit truncation gives) before being widened back to `long`. Any dimensionless quantity whose integer value exceeds `INT_MAX` but fits in `long` (e.g. very large counts or lengths in small units) will be reported with a corrupted numeric value instead of the correct large integer.","fix":"Cast directly to `long`, as the sibling branch does:\n\n```cpp\n// before\nelse if (intpart <= static_cast<double>(std::numeric_limits<long>::max())) {\n    l = static_cast<int>(intpart);\n    return 2;\n}\n\n// after\nelse if (intpart <= static_cast<double>(std::numeric_limits<long>::max())) {\n    l = static_cast<long>(intpart);\n    return 2;\n}\n```","locations":[{"ref":"src/App/Expression.cpp:363-366","code":"  363 |         else if (intpart <= static_cast<double>(std::numeric_limits<long>::max())) {\n  364 |             l = static_cast<int>(intpart);\n  365 |             return 2;\n  366 |         }","lines":4,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/Expression.cpp#L363-L366"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"The public `ObjectIdentifier::getSubPathStr(bool toPython) const` builds a fresh `ResolveResults(*this)` and forwards straight into the private `getSubPathStr(std::ostream&, const ResolveResults&, bool)`, which computes `components.begin() + result.propertyIndex + 1` with no bounds check. Other callers of the private overload (`toString()` and `toPersistentString()`) both guard this with `if (result.propertyIndex >= (int)components.size()) return ...;` before calling it, but the public `getSubPathStr(bool)` has no equivalent guard. For an `ObjectIdentifier` with an empty `components` vector (a valid state reachable via the `ObjectIdentifier(const App::PropertyContainer*, bool localProperty)` constructor before any component is appended, or whenever resolution fails to find components), `result.propertyIndex` stays `0` and `components.begin() + 1` on an empty vector is iterator arithmetic past `end()`, which is undefined behavior.","fix":"Add the same bounds check used by `toString()`/`toPersistentString()`:\n```cpp\nstd::string ObjectIdentifier::getSubPathStr(bool toPython) const\n{\n    std::ostringstream ss;\n    ResolveResults result(*this);\n    if (result.propertyIndex >= (int)components.size()) {\n        return ss.str();\n    }\n    getSubPathStr(ss, result, toPython);\n    return ss.str();\n}\n```","locations":[{"ref":"src/App/ObjectIdentifier.cpp:531-550","code":"  531 | void ObjectIdentifier::getSubPathStr(std::ostream& s,\n  532 |                                      const ResolveResults& result,\n  533 |                                      bool toPython) const\n  534 | {\n  535 |     std::vector<Component>::const_iterator i = components.begin() + result.propertyIndex + 1;\n  536 |     while (i != components.end()) {\n  537 |         if (i->isSimple()) {\n  538 |             s << '.';\n  539 |         }\n  540 |         i->toString(s, toPython);\n  541 |         ++i;\n  542 |     }\n  543 | }\n  544 | \n  545 | std::string ObjectIdentifier::getSubPathStr(bool toPython) const\n  546 | {\n  547 |     std::ostringstream ss;\n  548 |     getSubPathStr(ss, ResolveResults(*this), toPython);\n  549 |     return ss.str();\n  550 | }","lines":20,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/ObjectIdentifier.cpp#L531-L550"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`App::ColorField::rebuild()` computes `usStep` and loop-bounds using `colorModel.getCountColors() - 1`, where `getCountColors()` returns `colors.size()` (a `std::size_t`):\n```cpp\nstd::size_t usStep =\n    std::min<std::size_t>(ctColors / (colorModel.getCountColors() - 1), ctColors - 1);\n...\nfor (std::size_t i = 0; i < (colorModel.getCountColors() - 1); i++) {\n    interpolate(colorModel.colors[i], usInd1, colorModel.colors[i + 1], usInd2);\n    ...\n}\n```\nIf a `ColorModel` with fewer than 2 colors (e.g. a default-constructed `ColorModel()` with 0 colors, reachable through the public `ColorField::set()`/`setColorModel()` API) is ever supplied, `getCountColors() - 1` underflows to `SIZE_MAX`. This causes a division that is not the intended one and, more seriously, makes the `for` loop iterate far out of bounds, indexing `colorModel.colors[i]` on an empty/undersized vector - undefined behavior / out-of-bounds read leading to a likely crash. None of the built-in `ColorModel` subclasses in this file have fewer than 2 colors, so the bug is currently latent, but nothing in `ColorField::set()` validates the incoming model's color count before calling `rebuild()`.","fix":"Validate the color count before using it, e.g. in `ColorField::set()`:\n```cpp\nif (colorModel.getCountColors() < 2) {\n    throw Base::ValueError(\"Color model must have at least 2 colors\");\n}\n```\nor guard `rebuild()` itself by returning early / asserting `colorModel.getCountColors() >= 2` before doing the `- 1` arithmetic.","locations":[{"ref":"src/App/ColorModel.cpp:116-137","code":"  116 | void ColorField::rebuild()\n  117 | {\n  118 |     colorField.resize(ctColors);\n  119 | \n  120 |     std::size_t usStep =\n  121 |         std::min<std::size_t>(ctColors / (colorModel.getCountColors() - 1), ctColors - 1);\n  122 |     std::size_t usInd1 = 0;\n  123 |     std::size_t usInd2 = usStep;\n  124 |     for (std::size_t i = 0; i < (colorModel.getCountColors() - 1); i++) {\n  125 |         interpolate(colorModel.colors[i], usInd1, colorModel.colors[i + 1], usInd2);\n  126 |         usInd1 = usInd2;\n  127 |         if ((i + 1) == (colorModel.getCountColors() - 2)) {\n  128 |             usInd2 = ctColors - 1;\n  129 |         }\n  130 |         else {\n  131 |             usInd2 += usStep;\n  132 |         }\n  133 |     }\n  134 | \n  135 |     fAscent = float(ctColors) / (fMax - fMin);\n  136 |     fConstant = -fAscent * fMin;\n  137 | }","lines":22,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/ColorModel.cpp#L116-L137"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`LinkBaseExtension::getArrayIndex()` accumulates the numeric prefix of a subname with `idx = idx * 10 + *c - '0';` into a plain `int`, with no bound or overflow check on the number of digits consumed. A subname containing a sufficiently long run of digits before the first `.` (e.g. from a corrupted or maliciously crafted document) causes signed integer overflow, which is undefined behavior, and yields an arbitrary/wrapped-around index value that is later used to index into element/property lists.","fix":"Bound the number of digits processed (e.g. stop once `idx` would exceed a sane maximum such as `std::numeric_limits<int>::max() / 10`) or accumulate into a wider/unsigned type and clamp before returning, so a pathological subname cannot trigger signed overflow.","locations":[{"ref":"src/App/Link.cpp:1213-1219","code":" 1213 |     int idx = 0;\n 1214 |     for (const char* c = subname; c != dot; ++c) {\n 1215 |         if (!isdigit(*c)) {\n 1216 |             return -1;\n 1217 |         }\n 1218 |         idx = idx * 10 + *c - '0';\n 1219 |     }","lines":7,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/Link.cpp#L1213-L1219"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`Data::ByteArray::operator=(const ByteArray& other)` does not guard against self-assignment:\n```cpp\nByteArray& operator=(const ByteArray& other)\n{\n    bytes.clear();\n    bytes.append(other.bytes.constData(), other.bytes.size());\n    return *this;\n}\n```\nIf `other` refers to the same object as `*this` (e.g. `a = a;`, or a generic algorithm/container operation that self-assigns), `bytes.clear()` empties the underlying `QByteArray` before `other.bytes.constData()`/`other.bytes.size()` are evaluated - but `other.bytes` is the very same `QByteArray` that was just cleared. The result is that self-assignment silently wipes the stored data instead of leaving it unchanged.","fix":"Guard against self-assignment (or use copy-and-swap):\n```cpp\n// before\nByteArray& operator=(const ByteArray& other)\n{\n    bytes.clear();\n    bytes.append(other.bytes.constData(), other.bytes.size());\n    return *this;\n}\n\n// after\nByteArray& operator=(const ByteArray& other)\n{\n    if (this != &other) {\n        bytes.clear();\n        bytes.append(other.bytes.constData(), other.bytes.size());\n    }\n    return *this;\n}\n```","locations":[{"ref":"src/App/ByteArray.h:71-76","code":"   71 |     ByteArray& operator=(const ByteArray& other)\n   72 |     {\n   73 |         bytes.clear();\n   74 |         bytes.append(other.bytes.constData(), other.bytes.size());\n   75 |         return *this;\n   76 |     }","lines":6,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/ByteArray.h#L71-L76"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"`App::ComplexGeoData::resetRestoreFailure()` is documented as resetting the restore-failure flag, but its implementation sets `_restoreFailed = true` instead of `false`. Since `_restoreFailed` is only ever set to `true` (in `ComplexGeoData::restoreStream()` on a caught exception) and starts as `false`, calling `resetRestoreFailure()` can never actually clear the flag. The only caller, `App::PropertyComplexGeoData::afterRestore()` in `src/App/PropertyGeo.cpp`, does:\n```cpp\nif (data && data->isRestoreFailed()) {\n    data->resetRestoreFailure();\n    ...\n}\n```\nexpecting the flag to be cleared after handling the failure once. Because it stays `true` forever, `isRestoreFailed()` keeps reporting failure indefinitely, which can trigger repeated/unwanted recompute-on-restore behavior for the affected object every time `afterRestore()` (or any other code checking `isRestoreFailed()`, e.g. `src/Mod/Part/App/PropertyTopoShape.cpp:537`) runs.","fix":"Set the flag to `false` instead of `true`:\n```cpp\n// before\nvoid resetRestoreFailure() const\n{\n    _restoreFailed = true;\n}\n\n// after\nvoid resetRestoreFailure() const\n{\n    _restoreFailed = false;\n}\n```","locations":[{"ref":"src/App/ComplexGeoData.h:612-621","code":"  612 |     bool isRestoreFailed() const\n  613 |     {\n  614 |         return _restoreFailed;\n  615 |     }\n  616 | \n  617 |     /// Reset the restore failure flag.\n  618 |     void resetRestoreFailure() const\n  619 |     {\n  620 |         _restoreFailed = true;\n  621 |     }","lines":10,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/ComplexGeoData.h#L612-L621"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In the \"large object\" branch of `Document::copyObject()`, the temporary export file is declared `static`: `static Base::FileInfo fi(Application::getTempFileName());`. Because it is a function-local `static`, `Application::getTempFileName()` is evaluated only once for the whole process lifetime, so every subsequent call to `copyObject()` that takes this branch (i.e. whenever the copied object graph is estimated to be >= ~10MB) reuses the exact same file path on disk. Any reentrant or concurrent invocation (e.g. one `copyObject()` triggered as a side effect of another, or two documents copying large object graphs around the same time) will have both calls reading and writing the same file, corrupting each other's export/import stream. The correctly written sibling function `Document::importLinks()` a few dozen lines later creates a fresh non-static `Base::FileInfo fi(Application::getTempFileName())` for each call and explicitly calls `fi.deleteFile()` when done, confirming `copyObject()`'s use of `static` is a mistake rather than intentional. As an additional consequence, the temp file created here is also never deleted (no `deleteFile()` call), unlike in `importLinks()`.","fix":"Remove the erroneous `static` and clean the temp file up afterwards, matching the pattern in `Document::importLinks()`:\n\n```cpp\n// before\n    else {\n        static Base::FileInfo fi(Application::getTempFileName());\n        Base::ofstream ostr(fi, std::ios::out | std::ios::binary);\n        exportObjects(deps, ostr);\n        ostr.close();\n\n        Base::ifstream istr(fi, std::ios::in | std::ios::binary);\n        imported = md.importObjects(istr);\n    }\n\n// after\n    else {\n        Base::FileInfo fi(Application::getTempFileName());\n        Base::ofstream ostr(fi, std::ios::out | std::ios::binary);\n        exportObjects(deps, ostr);\n        ostr.close();\n\n        Base::ifstream istr(fi, std::ios::in | std::ios::binary);\n        imported = md.importObjects(istr);\n        istr.close();\n        fi.deleteFile();\n    }\n```","locations":[{"ref":"src/App/Document.cpp:3646-3717","code":" 3646 | std::vector<DocumentObject*>\n 3647 | Document::copyObject(const std::vector<DocumentObject*>& objs, bool recursive, bool returnAll)\n 3648 | {\n 3649 |     std::vector<DocumentObject*> deps;\n 3650 |     if (!recursive) {\n 3651 |         deps = objs;\n 3652 |     }\n 3653 |     else {\n 3654 |         deps = getDependencyList(objs, DepNoXLinked | DepSort);\n 3655 |     }\n 3656 | \n 3657 |     if (!testStatus(TempDoc) && !isSaved() && PropertyXLink::hasXLink(deps)) {\n 3658 |         throw Base::RuntimeError(\n 3659 |             \"Document must be saved at least once before link to external objects\");\n 3660 |     }\n 3661 | \n 3662 |     MergeDocuments md(this);\n 3663 |     // if not copying recursively then suppress possible warnings\n 3664 |     md.setVerbose(recursive);\n 3665 | \n 3666 |     unsigned int memsize = 1000;  // ~ for the meta-information\n 3667 |     for (auto it : deps) {\n 3668 |         memsize += it->getMemSize();\n 3669 |     }\n 3670 | \n 3671 |     // if less than ~10 MB\n 3672 |     bool use_buffer = (memsize < 0xA00000);\n 3673 |     std::string res;\n 3674 |     try {\n 3675 |         res.reserve(memsize);\n 3676 |     }\n 3677 |     catch (const std::bad_alloc&) {\n 3678 |         use_buffer = false;\n 3679 |     }\n 3680 | \n 3681 |     std::vector<DocumentObject*> imported;\n 3682 |     if (use_buffer) {\n 3683 |         Base::StringOStreambuf obuf(res);\n 3684 |         std::ostream ostr(&obuf);\n 3685 |         exportObjects(deps, ostr);\n 3686 | \n 3687 |         Base::StringIStreambuf ibuf(res);\n 3688 |         std::istream istr(nullptr);\n 3689 |         istr.rdbuf(&ibuf);\n 3690 |         imported = md.importObjects(istr);\n 3691 |     }\n 3692 |     else {\n 3693 |         static Base::FileInfo fi(Application::getTempFileName());\n 3694 |         Base::ofstream ostr(fi, std::ios::out | std::ios::binary);\n 3695 |         exportObjects(deps, ostr);\n 3696 |         ostr.close();\n 3697 | \n 3698 |         Base::ifstream istr(fi, std::ios::in | std::ios::binary);\n 3699 |         imported = md.importObjects(istr);\n 3700 |     }\n 3701 | \n 3702 |     if (returnAll || imported.size() != deps.size()) {\n 3703 |         return imported;\n 3704 |     }\n 3705 | \n 3706 |     std::unordered_map<DocumentObject*, size_t> indices;\n 3707 |     size_t i = 0;\n 3708 |     for (auto o : deps) {\n 3709 |         indices[o] = i++;\n 3710 |     }\n 3711 |     std::vector<DocumentObject*> result;\n 3712 |     result.reserve(objs.size());\n 3713 |     for (auto o : objs) {\n 3714 |         result.push_back(imported[indices[o]]);\n 3715 |     }\n 3716 |     return result;\n 3717 | }","lines":72,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/Document.cpp#L3646-L3717"}]},
