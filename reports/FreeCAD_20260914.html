{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"The exact same bug as in `GroupExtension::recursiveHasObject` is present in\n`GeoFeatureGroupExtension::recursiveGroupPlacement`, which walks up the chain of parent\n`GeoFeatureGroupExtension`s to compute a global placement and uses a `history` set to detect cyclic\nparent/child relationships:\n\n```cpp\nBase::Placement GeoFeatureGroupExtension::recursiveGroupPlacement(\n    GeoFeatureGroupExtension* group,\n    std::unordered_set<GeoFeatureGroupExtension*>& history)\n{\n    history.insert(this);\n    ...\n    return recursiveGroupPlacement(parent, history) * group->placement().getValue();\n```\n\n`recursiveGroupPlacement(parent, history)` is called implicitly on the same `this` throughout the whole\nrecursion (never `parent->recursiveGroupPlacement(...)`), so `history.insert(this)` always inserts the\none fixed starting object rather than the `group`/`parent` currently being visited. The\n`history.contains(parent)` check at `src/App/GeoFeatureGroupExtension.cpp:137` therefore only catches a\ncycle that loops directly back to the very first group, not longer cycles among ancestors. A document\nwith a cyclic `GeoFeatureGroup` nesting (3+ levels) will make `globalGroupPlacement()` recurse without\nbound and crash via stack overflow.","fix":"Insert the group being visited, not `this`:\n\n```cpp\n// before\nhistory.insert(this);\n\n// after\nhistory.insert(group);\n```","locations":[{"ref":"src/App/GeoFeatureGroupExtension.cpp:126-145","code":"  126 | Base::Placement GeoFeatureGroupExtension::recursiveGroupPlacement(\n  127 |     GeoFeatureGroupExtension* group,\n  128 |     std::unordered_set<GeoFeatureGroupExtension*>& history)\n  129 | {\n  130 |     history.insert(this);\n  131 | \n  132 |     auto inList = group->getExtendedObject()->getInList();\n  133 |     for (auto* link : inList) {\n  134 |         auto parent = link->getExtensionByType<GeoFeatureGroupExtension>(true);\n  135 |         if (parent && parent->hasObject(group->getExtendedObject())) {\n  136 |             // Cyclic dependencies detected\n  137 |             if (history.contains(parent)) {\n  138 |                 break;\n  139 |             }\n  140 |             return recursiveGroupPlacement(parent, history) * group->placement().getValue();\n  141 |         }\n  142 |     }\n  143 | \n  144 |     return group->placement().getValue();\n  145 | }","lines":20,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/GeoFeatureGroupExtension.cpp#L126-L145"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"`GroupExtension::recursiveHasObject` is meant to prevent infinite recursion when `Group` links form a\ncycle (e.g. group `A` contains `B`, `B` contains `C`, `C` contains `A` - nothing elsewhere prevents this\nkind of multi-level cycle, only \"object in a single direct group\" is checked in `extensionOnChanged`).\n\nThe cycle-detection history is supposed to record every `GroupExtension` visited so far, but the code\nrecords `this` instead of the `group` parameter that is actually being descended into:\n\n```cpp\nbool GroupExtension::recursiveHasObject(const DocumentObject* obj,\n                                        const GroupExtension* group,\n                                        std::vector<const GroupExtension*> history) const\n{\n    history.push_back(this);\n    ...\n    if (recursiveHasObject(obj, ext, history)) {\n```\n\nBecause the recursive call `recursiveHasObject(obj, ext, history)` is an implicit call on the same\n`this` (it is never invoked as `ext->recursiveHasObject(...)`), `this` is identical at every recursion\ndepth - it is always the very first sub-group found in `GroupExtension::hasObject`. So `history` ends up\ncontaining the same pointer over and over instead of the chain of visited groups, and\n`std::ranges::find(history, ext)` at `src/App/GroupExtension.cpp:272` can never detect a cycle that\ndoes not loop directly back to that first sub-group. For any group cycle of depth 3 or more this makes\n`recursiveHasObject` recurse forever, exhausting the stack and crashing FreeCAD (e.g. triggered by\n`hasObject(..., true)`/`isChildOf()` on a document with a corrupted or hand-edited cyclic `Group` graph).","fix":"Track the group actually being visited, not `this`:\n\n```cpp\n// before\nhistory.push_back(this);\n\n// after\nhistory.push_back(group);\n```","locations":[{"ref":"src/App/GroupExtension.cpp:245-283","code":"  245 | bool GroupExtension::recursiveHasObject(const DocumentObject* obj,\n  246 |                                         const GroupExtension* group,\n  247 |                                         std::vector<const GroupExtension*> history) const\n  248 | {\n  249 | \n  250 |     // the purpose is to prevent infinite recursion when groups form a cyclic graph. To do this\n  251 |     // we store every group we processed on the current leave of the tree, and if we reach an\n  252 |     // already processed group we know that it not really is a tree but a cycle.\n  253 |     history.push_back(this);\n  254 | \n  255 |     // we use hasObject with out recursion to allow override in derived classes\n  256 |     if (group->hasObject(obj, false)) {\n  257 |         return true;\n  258 |     }\n  259 | \n  260 |     // we checked for the searched object already with hasObject and did not find it, now we need to\n  261 |     // do the same for all subgroups\n  262 |     for (auto child : group->Group.getValues()) {\n  263 | \n  264 |         if (!child) {\n  265 |             continue;\n  266 |         }\n  267 | \n  268 |         if (child->hasExtension(GroupExtension::getExtensionClassTypeId())) {\n  269 | \n  270 |             auto ext = child->getExtensionByType<GroupExtension>();\n  271 | \n  272 |             if (std::ranges::find(history, ext) != history.end()) {\n  273 |                 throw Base::RuntimeError(\n  274 |                     \"Cyclic dependencies detected: Search cannot be performed\");\n  275 |             }\n  276 | \n  277 |             if (recursiveHasObject(obj, ext, history)) {\n  278 |                 return true;\n  279 |             }\n  280 |         }\n  281 |     }\n  282 |     return false;\n  283 | }","lines":39,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/GroupExtension.cpp#L245-L283"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`ProjectFile::replaceProjectFile()` renames the original file to a unique backup name (`orig.renameFile(fn.c_str())`), then tries to rename the newly-created replacement file (`name`) onto the original `stdFile` path (`other.renameFile(stdFile.c_str())`). If this second rename fails (e.g. cross-filesystem move, permission error, or `name` no longer existing), the function simply `return false;` -- but by this point the original project file has already been moved away from `stdFile` to the backup path `fn` and is never moved back. The caller is told the operation failed, but the document's `.FCStd` file is now missing from its expected location on disk with no rollback, leaving the project in a corrupted, hard-to-diagnose state.","fix":"On failure of the second rename, roll back the first rename before returning `false`, e.g.:\n```cpp\nBase::FileInfo other(name);\nif (!other.renameFile(stdFile.c_str())) {\n    orig.renameFile(stdFile.c_str()); // restore the original file\n    return false;\n}\n```","locations":[{"ref":"src/App/ProjectFile.cpp:855-883","code":"  855 | bool ProjectFile::replaceProjectFile(const std::string& name, bool keepfile)\n  856 | {\n  857 |     std::string uuid = Base::Uuid::createUuid();\n  858 |     std::string fn = stdFile;\n  859 |     fn += \".\";\n  860 |     fn += uuid;\n  861 | \n  862 |     // Now rename the original file to something unique\n  863 |     Base::FileInfo orig(stdFile);\n  864 |     if (!orig.renameFile(fn.c_str())) {\n  865 |         return false;\n  866 |     }\n  867 |     orig.setFile(fn);\n  868 | \n  869 |     // rename the tmp.file to the original file name\n  870 |     Base::FileInfo other(name);\n  871 |     if (!other.renameFile(stdFile.c_str())) {\n  872 |         return false;\n  873 |     }\n  874 | \n  875 |     // and delete the renamed original file.\n  876 |     if (!keepfile) {\n  877 |         if (!orig.deleteFile()) {\n  878 |             return false;\n  879 |         }\n  880 |     }\n  881 | \n  882 |     return true;\n  883 | }","lines":29,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/ProjectFile.cpp#L855-L883"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In `PropertyData::addProperty()`, the guard around the main body is written as:\n```cpp\n#ifdef FC_DEBUG\n    if(!parentMerged)\n#endif\n    {\n        ... // offset lookup, index.find/emplace, possible throw\n    }\n```\nIn a debug build this expands to `if (!parentMerged) { ... }`, so the body (including the inner `if(parentMerged) throw Base::RuntimeError(\"Cannot add static property\");`) only ever runs when `parentMerged` is false, making that inner `throw` unreachable dead code, and silently skipping index registration (`index.emplace(...)`) whenever a property is added after the container's property data has been merged with its parent's. In a release build (no `FC_DEBUG`), the `#ifdef` leaves just the bare `{ ... }` block, so the body always executes unconditionally regardless of `parentMerged`, meaning the previously-unreachable `throw Base::RuntimeError(\"Cannot add static property\")` now becomes reachable and can fire in release builds under conditions where the debug build would have silently done nothing. This is a real behavioral divergence between debug and release builds for the exact same code path (adding a property after `parentMerged` becomes true), which can hide bugs in debug testing that only surface as crashes/exceptions in release.","fix":"Make the debug and release behavior identical by not conditionally compiling away the guard itself; keep the runtime check in both configurations, e.g.:\n```cpp\nvoid PropertyData::addProperty(...)\n{\n    if (!parentMerged) {\n        short offset = offsetBase.getOffsetTo(Prop);\n        if (offset < 0)\n            throw Base::RuntimeError(\"Invalid static property\");\n        auto &index = impl->propertyData.get<1>();\n        auto it = index.find(PropName);\n        if (it == index.end()) {\n            index.emplace(PropName, PropertyGroup, PropertyDocu, offset, Type);\n        }\n#ifdef FC_DEBUG\n        else if (it->Offset != offset) {\n            FC_ERR(\"Duplicate property '\" << PropName << \"'\");\n        }\n#endif\n    }\n    Prop->syncType(Type);\n    Prop->myName = PropName;\n}\n```\nso that release builds no longer execute the whole offset/index-registration logic (and its `parentMerged`-guarded throw) unconditionally.","locations":[{"ref":"src/App/PropertyContainer.cpp:456-482","code":"  456 | void PropertyData::addProperty(OffsetBase offsetBase,const char* PropName, Property *Prop, const char* PropertyGroup , PropertyType Type, const char* PropertyDocu)\n  457 | {\n  458 | #ifdef FC_DEBUG\n  459 |     if(!parentMerged)\n  460 | #endif\n  461 |     {\n  462 |         short offset = offsetBase.getOffsetTo(Prop);\n  463 |         if(offset < 0)\n  464 |             throw Base::RuntimeError(\"Invalid static property\");\n  465 |         auto &index = impl->propertyData.get<1>();\n  466 |         auto it = index.find(PropName);\n  467 |         if(it == index.end()) {\n  468 |             if(parentMerged)\n  469 |                 throw Base::RuntimeError(\"Cannot add static property\");\n  470 |             index.emplace(PropName, PropertyGroup, PropertyDocu, offset, Type);\n  471 |         } else{\n  472 | #ifdef FC_DEBUG\n  473 |             if(it->Offset != offset) {\n  474 |                 FC_ERR(\"Duplicate property '\" << PropName << \"'\");\n  475 |             }\n  476 | #endif\n  477 |         }\n  478 |     }\n  479 | \n  480 |     Prop->syncType(Type);\n  481 |     Prop->myName = PropName;\n  482 | }","lines":27,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/PropertyContainer.cpp#L456-L482"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`App::ColorGradientProfile::isEqual()` compares `tStyle`, `fMin`, `fMax`, `visibility`, and `tColorModel`, but never compares `ctColors`:\n```cpp\nbool ColorGradientProfile::isEqual(const ColorGradientProfile& cg) const\n{\n    if (tStyle != cg.tStyle) return false;\n    if (fMin != cg.fMin) return false;\n    if (fMax != cg.fMax) return false;\n    if (!visibility.isEqual(cg.visibility)) return false;\n    if (tColorModel != cg.tColorModel) return false;\n    return true;\n}\n```\nTwo profiles that differ only in the number of colors (`ctColors`) are reported as equal. This method is used in `src/Gui/SoFCColorBar.cpp` (`originalProfile.isEqual(dialog.getProfile())`) to decide whether the user changed the color-bar settings; if the user only changes the color count in the settings dialog, the change is not detected as a difference.","fix":"Add the missing comparison:\n```cpp\n// before\nbool ColorGradientProfile::isEqual(const ColorGradientProfile& cg) const\n{\n    if (tStyle != cg.tStyle) {\n        return false;\n    }\n    if (fMin != cg.fMin) {\n        return false;\n    }\n    if (fMax != cg.fMax) {\n        return false;\n    }\n    if (!visibility.isEqual(cg.visibility)) {\n        return false;\n    }\n    if (tColorModel != cg.tColorModel) {\n        return false;\n    }\n    return true;\n}\n\n// after\nbool ColorGradientProfile::isEqual(const ColorGradientProfile& cg) const\n{\n    if (tStyle != cg.tStyle) {\n        return false;\n    }\n    if (fMin != cg.fMin) {\n        return false;\n    }\n    if (fMax != cg.fMax) {\n        return false;\n    }\n    if (ctColors != cg.ctColors) {\n        return false;\n    }\n    if (!visibility.isEqual(cg.visibility)) {\n        return false;\n    }\n    if (tColorModel != cg.tColorModel) {\n        return false;\n    }\n    return true;\n}\n```","locations":[{"ref":"src/App/ColorModel.cpp:163-181","code":"  163 | bool ColorGradientProfile::isEqual(const ColorGradientProfile& cg) const\n  164 | {\n  165 |     if (tStyle != cg.tStyle) {\n  166 |         return false;\n  167 |     }\n  168 |     if (fMin != cg.fMin) {\n  169 |         return false;\n  170 |     }\n  171 |     if (fMax != cg.fMax) {\n  172 |         return false;\n  173 |     }\n  174 |     if (!visibility.isEqual(cg.visibility)) {\n  175 |         return false;\n  176 |     }\n  177 |     if (tColorModel != cg.tColorModel) {\n  178 |         return false;\n  179 |     }\n  180 |     return true;\n  181 | }","lines":19,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/ColorModel.cpp#L163-L181"},{"ref":"src/App/ColorModel.h:391-405","code":"  391 | struct AppExport ColorGradientProfile\n  392 | {\n  393 |     ColorBarStyle tStyle {ColorBarStyle::FLOW};\n  394 |     float fMin {};\n  395 |     float fMax {};\n  396 |     std::size_t ctColors {};\n  397 |     std::size_t tColorModel {};\n  398 |     VisibilityFlags visibility {Visibility::Default};\n  399 | \n  400 |     ColorGradientProfile();\n  401 |     ColorGradientProfile(const ColorGradientProfile&) = default;\n  402 |     ColorGradientProfile& operator=(const ColorGradientProfile&) = default;\n  403 | \n  404 |     bool isEqual(const ColorGradientProfile&) const;\n  405 | };","lines":15,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/ColorModel.h#L391-L405"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `DocumentObject::getSubObject()`, the name-to-object lookup cache `_outListMap` is only rebuilt `if (outList.size() != _outListMap.size())`. This assumes the `OutList` can only change in a way that changes its element count. If a linked object is swapped out for a different one while the total number of links stays the same (e.g. a `PropertyLink` is reassigned from object A to object B, with everything else unchanged), `outList.size()` still equals `_outListMap.size()`, so the stale map is never rebuilt. Subsequent name lookups via `_outListMap.find(name.c_str())` can then return an object that is no longer part of the current `OutList` (possibly one that was already removed from the document), producing an incorrect or dangling `DocumentObject*` from `getSubObject()`.","fix":"Do not use a pure size comparison to decide whether `_outListMap` is stale. Tie its validity to the same invalidation event that clears `_outList`/`_outListCached` in `clearOutListCache()`, for example by adding a dedicated `_outListMapCached` flag that is reset in `clearOutListCache()` and only set once `_outListMap` has actually been rebuilt from the current `outList`:\n```cpp\nif (!_outListMapCached || outList.size() != _outListMap.size()) {\n    _outListMap.clear();\n    for (auto obj : outList) {\n        _outListMap[obj->getDagKey()] = obj;\n    }\n    _outListMapCached = true;\n}\n```\nand reset `_outListMapCached = false;` inside `DocumentObject::clearOutListCache()`.","locations":[{"ref":"src/App/DocumentObject.cpp:1249-1306","code":" 1249 | DocumentObject* DocumentObject::getSubObject(const char* subname,\n 1250 |                                              PyObject** pyObj,\n 1251 |                                              Base::Matrix4D* mat,\n 1252 |                                              bool transform,\n 1253 |                                              int depth) const\n 1254 | {\n 1255 |     DocumentObject* ret = nullptr;\n 1256 |     auto exts = getExtensionsDerivedFromType<App::DocumentObjectExtension>();\n 1257 |     for (auto ext : exts) {\n 1258 |         if (ext->extensionGetSubObject(ret, subname, pyObj, mat, transform, depth)) {\n 1259 |             return ret;\n 1260 |         }\n 1261 |     }\n 1262 | \n 1263 |     std::string name;\n 1264 |     const char* dot = nullptr;\n 1265 |     if (!subname || !(dot = strchr(subname, '.'))) {\n 1266 |         ret = const_cast<DocumentObject*>(this);\n 1267 |     }\n 1268 |     else if (subname[0] == '$') {\n 1269 |         name = std::string(subname + 1, dot);\n 1270 |         for (auto obj : getOutList()) {\n 1271 |             if (name == obj->Label.getValue()) {\n 1272 |                 ret = obj;\n 1273 |                 break;\n 1274 |             }\n 1275 |         }\n 1276 |     }\n 1277 |     else {\n 1278 |         name = std::string(subname, dot);\n 1279 |         const auto& outList = getOutList();\n 1280 |         if (outList.size() != _outListMap.size()) {\n 1281 |             _outListMap.clear();\n 1282 |             for (auto obj : outList) {\n 1283 |                 _outListMap[obj->getDagKey()] = obj;\n 1284 |             }\n 1285 |         }\n 1286 |         auto it = _outListMap.find(name.c_str());\n 1287 |         if (it != _outListMap.end()) {\n 1288 |             ret = it->second;\n 1289 |         }\n 1290 |     }\n 1291 | \n 1292 |     // TODO: By right, normal object's placement does not transform its sub\n 1293 |     // objects (think of the claimed children of a Fusion). But I do think we\n 1294 |     // should change that.\n 1295 |     if (transform && mat) {\n 1296 |         auto pla = freecad_cast<PropertyPlacement*>(getPropertyByName(\"Placement\"));\n 1297 |         if (pla) {\n 1298 |             *mat *= pla->getValue().toMatrix();\n 1299 |         }\n 1300 |     }\n 1301 | \n 1302 |     if (ret && dot) {\n 1303 |         return ret->getSubObject(dot + 1, pyObj, mat, true, depth + 1);\n 1304 |     }\n 1305 |     return ret;\n 1306 | }","lines":58,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/DocumentObject.cpp#L1249-L1306"},{"ref":"src/App/DocumentObject.cpp:1277-1290","code":" 1277 |     else {\n 1278 |         name = std::string(subname, dot);\n 1279 |         const auto& outList = getOutList();\n 1280 |         if (outList.size() != _outListMap.size()) {\n 1281 |             _outListMap.clear();\n 1282 |             for (auto obj : outList) {\n 1283 |                 _outListMap[obj->getDagKey()] = obj;\n 1284 |             }\n 1285 |         }\n 1286 |         auto it = _outListMap.find(name.c_str());\n 1287 |         if (it != _outListMap.end()) {\n 1288 |             ret = it->second;\n 1289 |         }\n 1290 |     }","lines":14,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/DocumentObject.cpp#L1277-L1290"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The element-map restore-time deduplication cache `_idToElementMap` is only ever read, never written, so it can never produce a cache hit and the whole \"restore once, share the rest\" scheme described in the comment above it (lines 28-44 of `src/App/ElementMap.cpp`) is dead.\n\nIn `ElementMap::restore(App::StringHasherRef, std::istream&)` (the 2-arg overload), `auto& map = _idToElementMap[id];` is looked up and checked (`if (map) return map;`), but the freshly-built result of `restore(hasherRef, stream, childMaps, postfixes)` is returned directly at the end without ever being stored back into `map`/`_idToElementMap[id]`.\n\nThe same problem exists in the 4-arg private overload `ElementMap::restore(App::StringHasherRef, std::istream&, std::vector<ElementMapPtr>&, const std::vector<std::string>&)`: `auto& map = _idToElementMap[id];` is checked for an existing entry, but the function's final `return shared_from_this();` never assigns to `map` either.\n\nBecause `_idToElementMap` persists for the whole document-restore operation (cleared only by `signalStartRestoreDocument`/`signalFinishRestoreDocument`), it is meant to let multiple objects that reference the same saved element map (same `id`, per the \"hierarchical element maps ... stored more than once in multiple objects\" comment) share a single `ElementMap` instance instead of re-parsing and re-allocating it for every object. Since the cache is never populated, every object's `ElementMap` (and every nested child map with a repeated `id`) is fully re-parsed and re-allocated from scratch, silently defeating the memory/time savings the mechanism was written for. On documents with many objects that redundantly reference the same underlying shape/element map (a documented, intentional scenario in this file), this multiplies both restore time and memory usage.","fix":"Store the fully constructed map back into the cache entry before returning, in both overloads, e.g.:\n\n```cpp\n// 2-arg overload, replace:\nreturn restore(hasherRef, stream, childMaps, postfixes);\n// with:\nmap = restore(hasherRef, stream, childMaps, postfixes);\nreturn map;\n```\n\n```cpp\n// 4-arg overload, replace:\nreturn shared_from_this();\n// with:\nmap = shared_from_this();\nreturn map;\n```\n\nNote that `map` is a reference obtained from `_idToElementMap[id]`; references into a `std::unordered_map` remain valid across further insertions into the same map (only iterators can be invalidated), so re-using `map` after the recursive calls is safe.","locations":[{"ref":"src/App/ElementMap.cpp:248-251","code":"  248 |     auto& map = _idToElementMap[id];\n  249 |     if (map) {\n  250 |         return map;\n  251 |     }","lines":4,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/ElementMap.cpp#L248-L251"},{"ref":"src/App/ElementMap.cpp:272","code":"  272 |     return restore(hasherRef, stream, childMaps, postfixes);","lines":1,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/ElementMap.cpp#L272"},{"ref":"src/App/ElementMap.cpp:295-303","code":"  295 |     auto& map = _idToElementMap[id];\n  296 |     if (map) {\n  297 |         while (tmp != \"EndMap\") {\n  298 |             if (!std::getline(stream, tmp)) {\n  299 |                 FC_THROWM(Base::RuntimeError, \"unexpected end of child element map\");  // NOLINT\n  300 |             }\n  301 |         }\n  302 |         return map;\n  303 |     }","lines":9,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/ElementMap.cpp#L295-L303"},{"ref":"src/App/ElementMap.cpp:496-501","code":"  496 |     if (!(stream >> tmp) || tmp != \"EndMap\") {\n  497 |         FC_THROWM(Base::RuntimeError, \"unexpected end of child element map\");  // NOLINT\n  498 |     }\n  499 | \n  500 |     return shared_from_this();\n  501 | }","lines":6,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/ElementMap.cpp#L496-L501"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`ProjectFile::restoreObject()` iterates over `Cnt` `Object` elements looking for one whose `name` attribute matches the requested `name`, calling `obj->Restore(reader)` only when a match is found. If no object with the given name exists in the archive (e.g. `name` is misspelled, or corresponds to metadata that never got persisted), the loop simply completes without ever calling `Restore()`, yet the function unconditionally `return true;` at the end. Callers have no way to tell \"the archive was read successfully but the requested object wasn't found\" apart from re-checking `getObjects()`/`getTypeId()` themselves, which is easy to omit and can make a silently-skipped restore look like a success.","fix":"Track whether the object was actually found and restored, and return that instead of an unconditional `true`:\n```cpp\nbool found = false;\nfor (long i = 0; i < Cnt; i++) {\n    reader.readElement(\"Object\");\n    std::string nameAttr = reader.getAttribute<const char*>(\"name\");\n    if (nameAttr == name) {\n        obj->Restore(reader);\n        found = true;\n    }\n    reader.readEndElement(\"Object\");\n}\nreader.readEndElement(\"ObjectData\");\nreader.readFiles(zipstream);\nreturn found;\n```","locations":[{"ref":"src/App/ProjectFile.cpp:474-513","code":"  474 | bool ProjectFile::restoreObject(const std::string& name, App::PropertyContainer* obj, bool verbose)\n  475 | {\n  476 |     Base::FileInfo fi(stdFile);\n  477 |     Base::ifstream file(fi, std::ios::in | std::ios::binary);\n  478 | \n  479 |     zipios::ZipInputStream zipstream(file);\n  480 |     Base::XMLReader reader(stdFile.c_str(), zipstream);\n  481 |     reader.setVerbose(verbose);\n  482 | \n  483 |     if (!reader.isValid()) {\n  484 |         return false;\n  485 |     }\n  486 | \n  487 |     // skip document properties\n  488 |     reader.readElement(\"Properties\");\n  489 |     reader.readEndElement(\"Properties\");\n  490 | \n  491 |     // skip objects\n  492 |     reader.readElement(\"Objects\");\n  493 |     reader.readEndElement(\"Objects\");\n  494 | \n  495 |     reader.readElement(\"ObjectData\");\n  496 |     long Cnt = reader.getAttribute<long>(\"Count\");\n  497 |     for (long i = 0; i < Cnt; i++) {\n  498 |         reader.readElement(\"Object\");\n  499 |         std::string nameAttr = reader.getAttribute<const char*>(\"name\");\n  500 | \n  501 |         if (nameAttr == name) {\n  502 |             // obj->StatusBits.set(4);\n  503 |             obj->Restore(reader);\n  504 |             // obj->StatusBits.reset(4);\n  505 |         }\n  506 |         reader.readEndElement(\"Object\");\n  507 |     }\n  508 |     reader.readEndElement(\"ObjectData\");\n  509 | \n  510 |     reader.readFiles(zipstream);\n  511 | \n  512 |     return true;\n  513 | }","lines":40,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/ProjectFile.cpp#L474-L513"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `PropertyExpressionEngine::updateElementReference` (`src/App/PropertyExpressionEngine.cpp:1009-1033`), the code loops over `expressions` and, for every expression whose visit caused a change, calls `expressionChanged(e.first)` and then immediately calls `v.reset()`. After the loop, it checks `if (feature && v.changed())` to decide whether to call `owner->onUpdateElementReference(this)`.\n\nBecause `v.reset()` sets the visitor's internal `_changed` counter back to `0` right after each detected change inside the loop (see `ExpressionModifier::reset()` in `src/App/Expression.h`), `v.changed()` is guaranteed to be `0` by the time the loop finishes (whether or not any expression actually changed). This makes the final `if (feature && v.changed())` effectively dead code: `owner->onUpdateElementReference(this)` is never invoked from this function, even when one or more expressions were updated in response to an element/feature reference change.\n\nCompare with the equivalent, correctly-written logic in `PropertyLinkSubList::updateElementReference` (`src/App/PropertyLinks.cpp:2779-2826`), which accumulates a separate `touched` boolean across the whole loop (not reset per-iteration) and only afterwards decides whether to call `owner->onUpdateElementReference(this)`.","fix":"Track whether any expression changed in a separate flag that is not reset inside the loop, e.g.:\n```cpp\nbool anyChanged = false;\nfor (auto& e : expressions) {\n    if (e.second.expression) {\n        e.second.expression->visit(v);\n        if (v.changed()) {\n            expressionChanged(e.first);\n            anyChanged = true;\n            v.reset();\n        }\n    }\n}\nif (feature && anyChanged) {\n    auto owner = dynamic_cast<App::DocumentObject*>(getContainer());\n    if (owner) {\n        owner->onUpdateElementReference(this);\n    }\n}\n```","locations":[{"ref":"src/App/PropertyExpressionEngine.cpp:1009-1033","code":" 1009 | void PropertyExpressionEngine::updateElementReference(DocumentObject* feature,\n 1010 |                                                       bool reverse,\n 1011 |                                                       bool notify)\n 1012 | {\n 1013 |     (void)notify;\n 1014 |     if (!feature) {\n 1015 |         unregisterElementReference();\n 1016 |     }\n 1017 |     UpdateElementReferenceExpressionVisitor<PropertyExpressionEngine> v(*this, feature, reverse);\n 1018 |     for (auto& e : expressions) {\n 1019 |         if (e.second.expression) {\n 1020 |             e.second.expression->visit(v);\n 1021 |             if (v.changed()) {\n 1022 |                 expressionChanged(e.first);\n 1023 |                 v.reset();\n 1024 |             }\n 1025 |         }\n 1026 |     }\n 1027 |     if (feature && v.changed()) {\n 1028 |         auto owner = dynamic_cast<App::DocumentObject*>(getContainer());\n 1029 |         if (owner) {\n 1030 |             owner->onUpdateElementReference(this);\n 1031 |         }\n 1032 |     }\n 1033 | }","lines":25,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/PropertyExpressionEngine.cpp#L1009-L1033"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `Application::runApplication()`, the fallback branch that logs an unrecognized `RunMode` uses the `%d` (integer) format specifier but passes `mConfig[\"RunMode\"].c_str()`, which is a `const char*`/string value, not an integer. `Base::Console().log()` ultimately formats arguments with `fmt::sprintf()` (see `Base::ConsoleSingleton::send()` in `src/Base/Console.h`), which is type-checked: a `%d` placeholder fed a string argument raises `fmt::format_error`, which is caught internally and replaced with a generic `\"ERROR: Invalid format string or arguments provided.\"` message. So instead of telling the developer/user which unknown run mode was configured, the diagnostic message is silently replaced by a useless generic error.","fix":"Use the correct `%s` specifier for a string argument:\n\n```cpp\n// before\n    else {\n        Base::Console().log(\"Unknown Run mode (%d) in main()?!?\\n\\n\", mConfig[\"RunMode\"].c_str());\n    }\n\n// after\n    else {\n        Base::Console().log(\"Unknown Run mode (%s) in main()?!?\\n\\n\", mConfig[\"RunMode\"].c_str());\n    }\n```","locations":[{"ref":"src/App/Application.cpp:3224-3226","code":" 3224 |     else {\n 3225 |         Base::Console().log(\"Unknown Run mode (%d) in main()?!?\\n\\n\", mConfig[\"RunMode\"].c_str());\n 3226 |     }","lines":3,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/Application.cpp#L3224-L3226"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`Document::getAvailableRedos(int id)` scans `mRedoTransactions` with `for (auto rit = mRedoTransactions.rbegin(); *rit != it->second; ++rit)` and no `rit != mRedoTransactions.rend()` termination check, only an `assert(i < ...)` afterwards (compiled out in release builds). Its sibling `Document::getAvailableUndos(int id)` (a few lines above) does the equivalent scan correctly with `for (; rit != mUndoTransactions.rend() && *rit != it->second; ++rit)`. As long as `mRedoMap` and `mRedoTransactions` stay perfectly in sync this never triggers, but it is an unguarded dereference of `rbegin()`...`rend()` that will read past `rend()` (undefined behavior) if that invariant is ever violated, silently swallowed by `NDEBUG` builds where `assert` is a no-op.","fix":"Add the same `rend()` guard used in `getAvailableUndos()`:\n\n```cpp\n// before\n        int i = 0;\n        for (auto rit = mRedoTransactions.rbegin(); *rit != it->second; ++rit) {\n            ++i;\n        }\n        assert(i < static_cast<int>(mRedoTransactions.size()));\n        return i + 1;\n\n// after\n        int i = 0;\n        auto rit = mRedoTransactions.rbegin();\n        for (; rit != mRedoTransactions.rend() && *rit != it->second; ++rit) {\n            ++i;\n        }\n        assert(rit != mRedoTransactions.rend());\n        return i + 1;\n```","locations":[{"ref":"src/App/Document.cpp:816-831","code":"  816 | int Document::getAvailableRedos(const int id) const\n  817 | {\n  818 |     if (id != 0) {\n  819 |         const auto it = mRedoMap.find(id);\n  820 |         if (it == mRedoMap.end()) {\n  821 |             return 0;\n  822 |         }\n  823 |         int i = 0;\n  824 |         for (auto rit = mRedoTransactions.rbegin(); *rit != it->second; ++rit) {\n  825 |             ++i;\n  826 |         }\n  827 |         assert(i < static_cast<int>(mRedoTransactions.size()));\n  828 |         return i + 1;\n  829 |     }\n  830 |     return static_cast<int>(mRedoTransactions.size());\n  831 | }","lines":16,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/Document.cpp#L816-L831"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"hard","description":"`DynamicProperty::removeDynamicProperty()` guards against a recursive re-entrant call for the *same* property (the code comment says \"Handle possible recursive calls of removeDynamicProperty\") by checking `prop->myName` after the notification signal fires, so `Property::destroy()`/`index.erase()` are only executed once even if a Python `slotRemoveDynamicProperty` observer re-triggers removal of the same property while the outer call's `GetApplication().signalRemoveDynamicProperty(*prop)` is still being dispatched.\n\nHowever, the guard only protects the destroy/erase step, not the signal emission itself: both the outer and the re-entrant inner call independently execute `Property* prop = it->property; GetApplication().signalRemoveDynamicProperty(*prop);` before either one checks `prop->myName`. So if a slot connected to `signalRemoveDynamicProperty` calls `removeDynamicProperty()` again for the same property (the exact scenario the guard is meant to handle), Python/C++ observers end up being notified of the same property removal twice, even though the property is only actually destroyed and erased once.","fix":"Move/check the re-entrancy guard before emitting the signal as well, e.g. look the property back up (or re-check `it->property->myName`) immediately before calling `GetApplication().signalRemoveDynamicProperty(*prop)`, so a re-entrant call for the same property that has already been (or is already being) removed skips the duplicate `signalRemoveDynamicProperty` emission instead of only skipping the duplicate `Property::destroy`/`index.erase`.","locations":[{"ref":"src/App/DynamicProperty.cpp:335-360","code":"  335 | bool DynamicProperty::removeDynamicProperty(const char* name)\n  336 | {\n  337 |     auto& index = impl->props.get<0>();\n  338 |     auto it = index.find(name);\n  339 |     if (it != index.end()) {\n  340 |         if (it->property->testStatus(Property::LockDynamic)) {\n  341 |             throw Base::RuntimeError(\"property is locked\");\n  342 |         }\n  343 |         else if (!it->property->testStatus(Property::PropDynamic)) {\n  344 |             throw Base::RuntimeError(\"property is not dynamic\");\n  345 |         }\n  346 |         Property* prop = it->property;\n  347 |         GetApplication().signalRemoveDynamicProperty(*prop);\n  348 | \n  349 |         // Handle possible recursive calls of removeDynamicProperty\n  350 |         if (prop->myName) {\n  351 |             Property::destroy(prop);\n  352 |             index.erase(it);\n  353 |             // memory of myName has been freed\n  354 |             prop->myName = nullptr;\n  355 |         }\n  356 |         return true;\n  357 |     }\n  358 | \n  359 |     return false;\n  360 | }","lines":26,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/DynamicProperty.cpp#L335-L360"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`ProgramInformation::getLibraryVersions()` ends with `str << \"PySide \" << fcPysideVersion << '\\n';` followed by `str << \"shiboken \" << fcShibokenVersion << \", \";` starting a new, second line of comma-separated values (`shiboken`, optionally `SMESH`, `xerces-c`, `Clipper2`, and `getIfcInfo()`'s output). That second line is only terminated with `'\\n'` inside the `#if defined(OCC_VERSION_STRING_EXT)` block. When `OCC_VERSION_STRING_EXT` is not defined for a given build, the function returns without ever emitting a trailing newline after `\"...Clipper2 <ver>, \"` (or after whatever `getIfcInfo()` appended), so the very next line written by the caller (`ProgramInformation::getLocale()`'s `\"Locale: ...\"`) gets concatenated onto the same output line in the About/verbose-version dump.","fix":"Always terminate the second line with a newline regardless of whether `OCC_VERSION_STRING_EXT` is defined:\n```cpp\n    getIfcInfo(str);\n#if defined(OCC_VERSION_STRING_EXT)\n    str << \"OCC \" << OCC_VERSION_STRING_EXT << '\\n';\n#else\n    str << '\\n';\n#endif\n```","locations":[{"ref":"src/App/ProgramInformation.cpp:271-300","code":"  271 | void ProgramInformation::getLibraryVersions(std::stringstream& str)\n  272 | {\n  273 |     // report also the version numbers of the most important libraries in FreeCAD\n  274 |     str << \"Python \" << PY_VERSION << \", \";\n  275 |     str << \"Qt \" << QT_VERSION_STR << \", \";\n  276 |     str << \"Coin \" << fcCoin3dVersion;\n  277 |     if (*fcCoin3dSource) {\n  278 |         str << \" (\" << fcCoin3dSource << \")\";\n  279 |     }\n  280 |     str << \", \";\n  281 |     str << \"Pivy \" << fcPivyVersion;\n  282 |     if (*fcPivySource) {\n  283 |         str << \" (\" << fcPivySource << \")\";\n  284 |     }\n  285 |     str << \", \";\n  286 |     str << \"Vtk \" << fcVtkVersion << \", \";\n  287 |     str << \"boost \" << BOOST_LIB_VERSION << \", \";\n  288 |     str << \"Eigen3 \" << fcEigen3Version << \", \";\n  289 |     str << \"PySide \" << fcPysideVersion << '\\n';\n  290 |     str << \"shiboken \" << fcShibokenVersion << \", \";\n  291 | #ifdef SMESH_VERSION_STR\n  292 |     str << \"SMESH \" << SMESH_VERSION_STR << \", \";\n  293 | #endif\n  294 |     str << \"xerces-c \" << fcXercescVersion << \", \";\n  295 |     str << \"Clipper2 \" << fcClipper2Version << \", \";\n  296 |     getIfcInfo(str);\n  297 | #if defined(OCC_VERSION_STRING_EXT)\n  298 |     str << \"OCC \" << OCC_VERSION_STRING_EXT << '\\n';\n  299 | #endif\n  300 | }","lines":30,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/ProgramInformation.cpp#L271-L300"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"very_easy","description":"In `Expression::Component::set()` and `Expression::Component::del()`, the sequence (non-mapping) index path converts the wrong Python object to a `Py_ssize_t`. The intended index value is computed into the local `index` variable via `auto index = e1->getPyValue();`, but the code then calls `PyNumber_AsSsize_t(pyobj.ptr(), PyExc_IndexError)` instead of `PyNumber_AsSsize_t(index.ptr(), PyExc_IndexError)` - it converts the container (`pyobj`, e.g. a `list`) to an integer instead of the index expression's value. The correct pattern is used a few lines above in the sibling function `Expression::Component::get()` (`src/App/Expression.cpp:755`), which this code was clearly copied from without updating the argument.\n\nAs a result, any FreeCAD expression that performs indexed assignment or deletion on a non-mapping sequence (e.g. `List[2] = x` or `del List[2]` style component access used when writing back through an expression) will fail: `PyNumber_AsSsize_t` on a `list`/sequence object raises a `TypeError` (lists do not support the number protocol) instead of correctly extracting the intended index, so the assignment/deletion is effectively broken and raises a `Py::Exception` that gets re-thrown as an `EXPR_PY_THROW`.","fix":"Use the previously computed `index` object instead of `pyobj` when converting to a `Py_ssize_t`, matching the pattern already used in `Expression::Component::get()`:\n\n```cpp\n// before (in both set() and del())\nPy_ssize_t i = PyNumber_AsSsize_t(pyobj.ptr(), PyExc_IndexError);\n\n// after\nPy_ssize_t i = PyNumber_AsSsize_t(index.ptr(), PyExc_IndexError);\n```","locations":[{"ref":"src/App/Expression.cpp:804","code":"  804 |                 Py_ssize_t i = PyNumber_AsSsize_t(pyobj.ptr(), PyExc_IndexError);","lines":1,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/Expression.cpp#L804"},{"ref":"src/App/Expression.cpp:838","code":"  838 |                 Py_ssize_t i = PyNumber_AsSsize_t(pyobj.ptr(), PyExc_IndexError);","lines":1,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/Expression.cpp#L838"}]},
{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"very_easy","description":"In `Metadata::satisfies(const Meta::Dependency& dep)`, the version-comparison branches for `version_lte`, `version_gt`, and `version_gte` all mistakenly compare against `Meta::Version(dep.version_lt)` instead of their own field (`dep.version_lte`, `dep.version_gt`, `dep.version_gte` respectively). Only the first branch (`version_lt`) uses the correct field. This means a `package.xml` dependency that specifies e.g. `version_gte=\"2.0.0\"` is actually checked against `version_lt` (which may be empty, in which case `Meta::Version(\"\")` parses to `0.0.0`), producing wrong `satisfies()` results for any dependency using `version_lte`, `version_gt`, or `version_gte`.","fix":"Use each branch's own dependency field instead of `dep.version_lt`:\n```cpp\nif (!dep.version_lte.empty()) {\n    if (!(_version <= Meta::Version(dep.version_lte))) {\n        return false;\n    }\n}\nif (!dep.version_gt.empty()) {\n    if (!(_version > Meta::Version(dep.version_gt))) {\n        return false;\n    }\n}\nif (!dep.version_gte.empty()) {\n    if (!(_version >= Meta::Version(dep.version_gte))) {\n        return false;\n    }\n}\n```","locations":[{"ref":"src/App/Metadata.cpp:693-712","code":"  693 |     if (!dep.version_lt.empty()) {\n  694 |         if (!(_version < Meta::Version(dep.version_lt))) {\n  695 |             return false;\n  696 |         }\n  697 |     }\n  698 |     if (!dep.version_lte.empty()) {\n  699 |         if (!(_version <= Meta::Version(dep.version_lt))) {\n  700 |             return false;\n  701 |         }\n  702 |     }\n  703 |     if (!dep.version_gt.empty()) {\n  704 |         if (!(_version > Meta::Version(dep.version_lt))) {\n  705 |             return false;\n  706 |         }\n  707 |     }\n  708 |     if (!dep.version_gte.empty()) {\n  709 |         if (!(_version >= Meta::Version(dep.version_lt))) {\n  710 |             return false;\n  711 |         }\n  712 |     }","lines":20,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/Metadata.cpp#L693-L712"}]},
{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"very_easy","description":"`MetadataPy::setFile` calls `getMetadataPtr()->clearTag()` instead of `clearFile()` before repopulating the file list from the passed-in Python list. This means setting the `File` property from Python erroneously wipes out the unrelated `Tag` list (data loss/corruption) while leaving the existing `File` entries in place (so the new files are appended rather than replacing, contrary to the setter's intended \"replace\" semantics).","fix":"Clear the correct list:\n```cpp\nvoid MetadataPy::setFile(Py::List args)\n{\n    PyObject* list = nullptr;\n    if (!PyArg_Parse(args.ptr(), \"O!\", &PyList_Type, &list)) {\n        throw Py::Exception();\n    }\n\n    getMetadataPtr()->clearFile();\n    Py::List files(list);\n    ...\n```","locations":[{"ref":"src/App/MetadataPyImp.cpp:840-853","code":"  840 | void MetadataPy::setFile(Py::List args)\n  841 | {\n  842 |     PyObject* list = nullptr;\n  843 |     if (!PyArg_Parse(args.ptr(), \"O!\", &PyList_Type, &list)) {\n  844 |         throw Py::Exception();\n  845 |     }\n  846 | \n  847 |     getMetadataPtr()->clearTag();\n  848 |     Py::List files(list);\n  849 |     for (const auto& file : files) {\n  850 |         Py::String pyFile(file);\n  851 |         getMetadataPtr()->addFile(pyFile.as_std_string());\n  852 |     }\n  853 | }","lines":14,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/MetadataPyImp.cpp#L840-L853"}]},
{"id":"CPY_4","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"very_easy","description":"`MetadataPy::setContent(Py::Dict arg)` validates its argument with `PyArg_Parse(arg.ptr(), \"O!\", &PyList_Type, &obj)`, checking that the value is a `list`, even though the property is documented and typed as a `Py::Dict` (a dict of lists, as built by `MetadataPy::getContent`). Since `arg.ptr()` is always a `dict` here, this check always fails and `setContent` always raises `Py::Exception`, making the `Content` property write-side completely non-functional from Python.","fix":"Check for `PyDict_Type` instead of `PyList_Type`:\n```cpp\nvoid MetadataPy::setContent(Py::Dict arg)\n{\n    PyObject* obj = nullptr;\n    if (!PyArg_Parse(arg.ptr(), \"O!\", &PyDict_Type, &obj)) {\n        throw Py::Exception();\n    }\n    ...\n```","locations":[{"ref":"src/App/MetadataPyImp.cpp:900-908","code":"  900 | void MetadataPy::setContent(Py::Dict arg)\n  901 | {\n  902 |     PyObject* obj = nullptr;\n  903 |     if (!PyArg_Parse(arg.ptr(), \"O!\", &PyList_Type, &obj)) {\n  904 |         throw Py::Exception();\n  905 |     }\n  906 | \n  907 |     getMetadataPtr()->clearContent();\n  908 |     Py::Dict outerDict(obj);","lines":9,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/MetadataPyImp.cpp#L900-L908"}]},
{"id":"CPY_5","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"`App::ColorField::operator=(const ColorField& rclCF)` only copies the `colorField` member:\n```cpp\nColorField& ColorField::operator=(const ColorField& rclCF)\n{\n    colorField = rclCF.colorField;\n    return *this;\n}\n```\nIt fails to copy `colorModel`, `fMin`, `fMax`, `ctColors`, `fAscent`, and `fConstant`. After using `operator=` to assign one `ColorField` to another, the assigned-to object keeps its old range/model/count metadata while only its computed color table is replaced, leaving the object internally inconsistent (e.g. `getMinValue()`/`getMaxValue()`/`getColorModel()` report stale values that no longer match `colorField`). This is inconsistent with the copy constructor, `ColorField(const ColorField&) = default;`, which correctly copies every member.","fix":"Copy all data members (or simply default the operator like the copy constructor):\n```cpp\nColorField& ColorField::operator=(const ColorField& rclCF)\n{\n    colorModel = rclCF.colorModel;\n    fMin = rclCF.fMin;\n    fMax = rclCF.fMax;\n    fAscent = rclCF.fAscent;\n    fConstant = rclCF.fConstant;\n    ctColors = rclCF.ctColors;\n    colorField = rclCF.colorField;\n    return *this;\n}\n```","locations":[{"ref":"src/App/ColorModel.cpp:90-94","code":"   90 | ColorField& ColorField::operator=(const ColorField& rclCF)\n   91 | {\n   92 |     colorField = rclCF.colorField;\n   93 |     return *this;\n   94 | }","lines":5,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/ColorModel.cpp#L90-L94"},{"ref":"src/App/ColorModel.h:294","code":"  294 |     ColorField& operator=(const ColorField& rclCF);","lines":1,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/ColorModel.h#L294"}]},
{"id":"CPY_6","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"In the `calc()` helper used to evaluate `OperatorExpression` (`src/App/Expression.cpp`), the `MOD` case always calls `PyNumber_InPlaceRemainder`, regardless of whether the operation is in-place or not:\n\n```cpp\ncase OperatorExpression::MOD: {\n    PyObject *res;\n    if (PyUnicode_CheckExact(l.ptr()) && ...)\n        res = PyUnicode_Format(l.ptr(), r.ptr());\n    else if(inplace)\n        res = PyNumber_InPlaceRemainder(l.ptr(),r.ptr());\n    else\n        res = PyNumber_InPlaceRemainder(l.ptr(),r.ptr());   // should be PyNumber_Remainder\n    ...\n}\n```\nEvery other binary operator (`ADD`, `SUB`, `MUL`, `DIV`, `POW`, `UNIT`) correctly dispatches between the in-place and non-in-place variant via the `_BINARY_OP` macro (`PyNumber_InPlaceX` vs `PyNumber_X`), but `MOD` was hand-written and both branches were copy-pasted from the `inplace` case, so the `else` (non-in-place `%` operator) branch never calls the correct `PyNumber_Remainder`. For built-in numeric/string types this is usually unobservable because CPython falls back to `nb_remainder` when `nb_inplace_remainder` is absent, but for any Python object exposed to expressions that implements `__imod__` (e.g. objects from `Proxy` features, numpy-like types, etc.) evaluating a plain `%` expression will incorrectly perform (and rely on) an in-place mutation of the left operand instead of producing a new value.","fix":"Call the non-in-place `PyNumber_Remainder` in the `else` branch:\n\n```cpp\n// before\nelse if(inplace)\n    res = PyNumber_InPlaceRemainder(l.ptr(),r.ptr());\nelse\n    res = PyNumber_InPlaceRemainder(l.ptr(),r.ptr());\n\n// after\nelse if(inplace)\n    res = PyNumber_InPlaceRemainder(l.ptr(),r.ptr());\nelse\n    res = PyNumber_Remainder(l.ptr(),r.ptr());\n```","locations":[{"ref":"src/App/Expression.cpp:1472-1483","code":" 1472 |     case OperatorExpression::MOD: {\n 1473 |         PyObject *res;\n 1474 |         if (PyUnicode_CheckExact(l.ptr()) &&\n 1475 |                 (!PyUnicode_Check(r.ptr()) || PyUnicode_CheckExact(r.ptr())))\n 1476 |             res = PyUnicode_Format(l.ptr(), r.ptr());\n 1477 |         else if(inplace)\n 1478 |             res = PyNumber_InPlaceRemainder(l.ptr(),r.ptr());\n 1479 |         else\n 1480 |             res = PyNumber_InPlaceRemainder(l.ptr(),r.ptr());\n 1481 |         if(!res) EXPR_PY_THROW(expr);\n 1482 |         return Py::asObject(res);\n 1483 |     }","lines":12,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/Expression.cpp#L1472-L1483"}]},
{"id":"CPY_7","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"`MappedName::toConstString(int offset, int& size)` treats the data/postfix boundary inconsistently with the rest of the class: it uses `if (offset > this->data.size())` to decide whether `offset` falls in the postfix, so when `offset == this->data.size()` exactly it takes the \"still inside data\" branch and returns `size = 0` with a pointer into `data` - silently discarding any content actually present in `postfix` at that position. Every other member function performing the same data/postfix split uses the boundary the other way: `appendToBuffer()` uses `startPosition < this->data.size()` to mean \"inside data\" (so `startPosition == data.size()` falls through to the postfix branch), and `toRawBytes()` explicitly uses `offset >= this->data.size()` for \"inside postfix\". `toConstString()` is used by `MappedName::findTagInElementName()` (`MappedName.cpp`) to read the encoded tag/length fields out of an element name, so when the tag happens to start exactly at the data/postfix boundary, tag parsing silently returns an empty string instead of the actual postfix content, corrupting topological-naming history lookups instead of failing loudly.","fix":"Use `>=` instead of `>` so the boundary case is treated as being inside the postfix, matching `toRawBytes()`.\n\nBefore:\n```cpp\nif (offset > this->data.size()) {\n```\n\nAfter:\n```cpp\nif (offset >= this->data.size()) {\n```","locations":[{"ref":"src/App/MappedName.h:623-639","code":"  623 |     const char* toConstString(int offset, int& size) const\n  624 |     {\n  625 |         if (offset < 0) {\n  626 |             offset = 0;\n  627 |         }\n  628 |         if (offset > this->data.size()) {\n  629 |             offset -= this->data.size();\n  630 |             if (offset > this->postfix.size()) {\n  631 |                 size = 0;\n  632 |                 return \"\";\n  633 |             }\n  634 |             size = this->postfix.size() - offset;\n  635 |             return this->postfix.constData() + offset;\n  636 |         }\n  637 |         size = this->data.size() - offset;\n  638 |         return this->data.constData() + offset;\n  639 |     }","lines":17,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/MappedName.h#L623-L639"}]},
{"id":"CPY_8","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"In `Metadata::satisfies`, the `replacements` map used to substitute placeholders in a dependency's `condition` expression inserts `\"$BuildVersionMinor\"` twice (once with `config[\"BuildVersionMinor\"]`, once with `config[\"BuildVersionPoint\"]`) instead of using the key `\"$BuildVersionPoint\"` for the second insertion. Because `std::map::insert` does not overwrite an existing key, the second call is silently dropped, so any `condition` expression referencing `$BuildVersionPoint` is never substituted and is passed through literally to `App::Expression::parse`.","fix":"Change the duplicated key on the third insertion:\n```cpp\nreplacements.insert(std::make_pair(\"$BuildVersionMajor\", config[\"BuildVersionMajor\"]));\nreplacements.insert(std::make_pair(\"$BuildVersionMinor\", config[\"BuildVersionMinor\"]));\nreplacements.insert(std::make_pair(\"$BuildVersionPoint\", config[\"BuildVersionPoint\"]));\nreplacements.insert(std::make_pair(\"$BuildRevision\", config[\"BuildRevision\"]));\n```","locations":[{"ref":"src/App/Metadata.cpp:670-673","code":"  670 |         replacements.insert(std::make_pair(\"$BuildVersionMajor\", config[\"BuildVersionMajor\"]));\n  671 |         replacements.insert(std::make_pair(\"$BuildVersionMinor\", config[\"BuildVersionMinor\"]));\n  672 |         replacements.insert(std::make_pair(\"$BuildVersionMinor\", config[\"BuildVersionPoint\"]));\n  673 |         replacements.insert(std::make_pair(\"$BuildRevision\", config[\"BuildRevision\"]));","lines":4,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/Metadata.cpp#L670-L673"}]},
{"id":"CPY_9","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"`Property::setStatusValue()` masks off a set of \"static\" status bits from the incoming `status` value and re-applies the property's own existing bits for them, so that a saved/loaded status value can't clobber the property's compile-time-declared type flags. The `mask` includes `PropDynamic`, `PropNoRecompute`, `PropReadOnly`, `PropTransient`, `PropOutput`, `PropHidden`, `PropNoPersist`, and `Busy`, but the corresponding `PropInput` bit (also defined in the `Status` enum in `Property.h` and mirrored in `Property::getType()`'s `mapProps` table right next to `PropOutput`) is missing. As a result, restoring a saved `status` attribute (see `PropertyContainer::Restore()`, which calls `prop->setStatusValue(...)`) can silently flip a property's `PropInput` bit to whatever bit 28 happens to be in the file, unlike every other mirrored type bit which is correctly protected.","fix":"Add `PropInput` to the preserved-bits mask, matching its siblings:\n```cpp\n// before\nstatic const unsigned long mask =\n     (1<<PropDynamic)\n    |(1<<PropNoRecompute)\n    |(1<<PropReadOnly)\n    |(1<<PropTransient)\n    |(1<<PropOutput)\n    |(1<<PropHidden)\n    |(1<<PropNoPersist)\n    |(1<<Busy);\n\n// after\nstatic const unsigned long mask =\n     (1<<PropDynamic)\n    |(1<<PropNoRecompute)\n    |(1<<PropReadOnly)\n    |(1<<PropTransient)\n    |(1<<PropOutput)\n    |(1<<PropInput)\n    |(1<<PropHidden)\n    |(1<<PropNoPersist)\n    |(1<<Busy);\n```","locations":[{"ref":"src/App/Property.cpp:327-352","code":"  327 | void Property::setStatusValue(unsigned long status)\n  328 | {\n  329 |     // clang-format off\n  330 |     static const unsigned long mask =\n  331 |          (1<<PropDynamic)\n  332 |         |(1<<PropNoRecompute)\n  333 |         |(1<<PropReadOnly)\n  334 |         |(1<<PropTransient)\n  335 |         |(1<<PropOutput)\n  336 |         |(1<<PropHidden)\n  337 |         |(1<<PropNoPersist)\n  338 |         |(1<<Busy);\n  339 |     // clang-format on\n  340 | \n  341 |     status &= ~mask;\n  342 |     status |= StatusBits.to_ulong() & mask;\n  343 |     unsigned long oldStatus = StatusBits.to_ulong();\n  344 |     StatusBits = decltype(StatusBits)(status);\n  345 | \n  346 |     if (father) {\n  347 |         static unsigned long _signalMask = (1 << ReadOnly) | (1 << Hidden);\n  348 |         if ((status & _signalMask) != (oldStatus & _signalMask)) {\n  349 |             father->onPropertyStatusChanged(*this, oldStatus);\n  350 |         }\n  351 |     }\n  352 | }","lines":26,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/Property.cpp#L327-L352"}]},
{"id":"CPY_10","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `App::Application::closeActiveTransaction()`, the same condition `docNameAndDoc.second->transacting()` is checked twice in a row, with the second check being unreachable dead code because it is already covered by the `||` in the first `if`:\n```cpp\nif(docNameAndDoc.second->isTransactionLocked() || docNameAndDoc.second->transacting()) {\n    FC_LOG(\"pending \" << (abort ? \"abort\" : \"close\") << \" transaction\");\n    currentlyClosingID = 0;\n    return false;\n}\nif(docNameAndDoc.second->transacting()) {\n    FC_LOG(\"pending \" << (abort ? \"abort\" : \"close\") << \" transaction\");\n    currentlyClosingID = 0;\n    return false;\n}\n```\nThe second `if` block can never be entered, since any document for which `transacting()` is true would already have caused the function to return in the first `if`. This looks like a leftover from a refactor and should be removed.","fix":"Remove the redundant, unreachable second check:\n```cpp\nif(docNameAndDoc.second->isTransactionLocked() || docNameAndDoc.second->transacting()) {\n    FC_LOG(\"pending \" << (abort ? \"abort\" : \"close\") << \" transaction\");\n    currentlyClosingID = 0;\n    return false;\n}\ndocsToPoke.push_back(docNameAndDoc.second);\n```","locations":[{"ref":"src/App/AutoTransaction.cpp:192-201","code":"  192 |         if(docNameAndDoc.second->isTransactionLocked() || docNameAndDoc.second->transacting()) {\n  193 |             FC_LOG(\"pending \" << (abort ? \"abort\" : \"close\") << \" transaction\");\n  194 |             currentlyClosingID = 0;\n  195 |             return false;\n  196 |         }\n  197 |         if(docNameAndDoc.second->transacting()) {\n  198 |             FC_LOG(\"pending \" << (abort ? \"abort\" : \"close\") << \" transaction\");\n  199 |             currentlyClosingID = 0;\n  200 |             return false;\n  201 |         }","lines":10,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/AutoTransaction.cpp#L192-L201"}]},
{"id":"CPY_11","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `ElementMap::traceElement()`, the circular-element-mapping diagnostic log calls `obj->getFullName()` twice in a row instead of once, producing a garbled/duplicated log message (`\"<name><name>.<elementName>\"` instead of `\"<name>.<elementName>\"`). This is clearly a copy-paste slip in the stream-insertion chain.","fix":"Remove the duplicated call:\n\n```cpp\n// before\nFC_LOG(\"\\t\" << obj->getFullName() << obj->getFullName() << \".\" << name);\n\n// after\nFC_LOG(\"\\t\" << obj->getFullName() << \".\" << name);\n```","locations":[{"ref":"src/App/ElementMap.cpp:1461-1466","code":" 1461 |                     auto doc = App::GetApplication().getActiveDocument();\n 1462 |                     if (doc) {\n 1463 |                         auto obj = doc->getObjectByID(masterTag);\n 1464 |                         if (obj) {\n 1465 |                             FC_LOG(\"\\t\" << obj->getFullName() << obj->getFullName() << \".\" << name);\n 1466 |                         }","lines":6,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/ElementMap.cpp#L1461-L1466"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"critical","difficulty":"easy","description":"`LinkBaseExtensionPy::configLinkProperty()` is a Python-exposed method that calls `ext->setProperty(v.second.first, v.second.second)`, which can throw a C++ `Base::TypeError` (via the `LINK_THROW` macro in `LinkBaseExtension::setProperty()`, `src/App/Link.cpp`) when a property of the wrong type is supplied. This is directly reachable, and is guaranteed to be reached by the separately-reported `getProperty()` bug, since that bug lets mismatched properties slip through. Unlike every sibling method in this file (`setLink`, `cacheChildLabel`, `flattenSubname`, `expandSubname`, all wrapped in `PY_TRY { ... } PY_CATCH`), `configLinkProperty()` has no `PY_TRY`/`PY_CATCH` wrapping. `PY_CATCH` is what converts a `Base::Exception` into a proper Python exception (see `src/Base/PyObjectBase.h`); PyCXX's own call-handler trampoline (`method_varargs_call_handler`/`method_keyword_call_handler` in PyCXX's `cxx_extensions.cxx`) only catches `Py::BaseException`, not FreeCAD's unrelated `Base::Exception` hierarchy. A `Base::TypeError` thrown inside `configLinkProperty()` therefore escapes uncaught across the CPython C API boundary, which is undefined behavior and in practice crashes the whole application/process from a plain Python script call.","fix":"Wrap the body of `configLinkProperty()` in `PY_TRY { ... } PY_CATCH` like the other Python-exposed methods in this file:\n```cpp\nPyObject* LinkBaseExtensionPy::configLinkProperty(PyObject* args, PyObject* keywds)\n{\n    PY_TRY\n    {\n        auto ext = getLinkBaseExtensionPtr();\n        ...\n        for (auto& v : props) {\n            ext->setProperty(v.second.first, v.second.second);\n        }\n        Py_Return;\n    }\n    PY_CATCH\n}\n```","locations":[{"ref":"src/App/LinkBaseExtensionPyImp.cpp:96-127","code":"   96 | PyObject* LinkBaseExtensionPy::configLinkProperty(PyObject* args, PyObject* keywds)\n   97 | {\n   98 |     auto ext = getLinkBaseExtensionPtr();\n   99 |     const auto& info = ext->getPropertyInfoMap();\n  100 | \n  101 |     PropMap propMap;\n  102 |     ext->getExtendedContainer()->getPropertyMap(propMap);\n  103 | \n  104 |     PropTmpMap props;\n  105 | \n  106 |     if (args && PyTuple_Check(args)) {\n  107 |         for (Py_ssize_t pos = 0; pos < PyTuple_GET_SIZE(args); ++pos) {\n  108 |             auto key = PyTuple_GET_ITEM(args, pos);\n  109 |             if (!getProperty(props, info, propMap, key, key)) {\n  110 |                 return nullptr;\n  111 |             }\n  112 |         }\n  113 |     }\n  114 |     if (keywds && PyDict_Check(keywds)) {\n  115 |         PyObject *key, *value;\n  116 |         Py_ssize_t pos = 0;\n  117 |         while (PyDict_Next(keywds, &pos, &key, &value)) {\n  118 |             if (!getProperty(props, info, propMap, key, value)) {\n  119 |                 return nullptr;\n  120 |             }\n  121 |         }\n  122 |     }\n  123 |     for (auto& v : props) {\n  124 |         ext->setProperty(v.second.first, v.second.second);\n  125 |     }\n  126 |     Py_Return;\n  127 | }","lines":32,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/LinkBaseExtensionPyImp.cpp#L96-L127"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"very_easy","description":"In `LinkBaseExtensionPyImp.cpp`, the static helper `getProperty()` sets a Python `TypeError` via `PyErr_SetString()` when the resolved property is not derived from the expected type, but then falls through instead of returning `false`. The caller `LinkBaseExtensionPy::configLinkProperty()` therefore treats this as a successful lookup: it stores the wrongly-typed `prop` in `props` and later calls `ext->setProperty(v.second.first, v.second.second)` with it, all while a Python exception is already pending from the earlier `PyErr_SetString()` call.","fix":"Add the missing `return false;` so the type mismatch is reported and processing stops immediately, matching the sibling `return false;` a few lines above for the \"cannot find property\" case.\n\nBefore:\n```cpp\nif (!prop->isDerivedFrom(info.type)) {\n    str << \"expect property '\" << keyStr << \"(\" << valStr << \") to be derived from '\"\n        << info.type.getName() << \"', instead of '\" << prop->getTypeId().getName() << \"'\";\n    PyErr_SetString(PyExc_TypeError, str.str().c_str());\n}\n```\n\nAfter:\n```cpp\nif (!prop->isDerivedFrom(info.type)) {\n    str << \"expect property '\" << keyStr << \"(\" << valStr << \") to be derived from '\"\n        << info.type.getName() << \"', instead of '\" << prop->getTypeId().getName() << \"'\";\n    PyErr_SetString(PyExc_TypeError, str.str().c_str());\n    return false;\n}\n```","locations":[{"ref":"src/App/LinkBaseExtensionPyImp.cpp:86-93","code":"   86 |         if (!prop->isDerivedFrom(info.type)) {\n   87 |             str << \"expect property '\" << keyStr << \"(\" << valStr << \") to be derived from '\"\n   88 |                 << info.type.getName() << \"', instead of '\" << prop->getTypeId().getName() << \"'\";\n   89 |             PyErr_SetString(PyExc_TypeError, str.str().c_str());\n   90 |         }\n   91 |     }\n   92 |     props[keyStr] = std::make_pair(info.index, prop);\n   93 |     return true;","lines":8,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/LinkBaseExtensionPyImp.cpp#L86-L93"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"medium","description":"Several `ProjectFile` methods construct a `zipios::ZipFile` directly on the stack, e.g. `zipios::ZipFile project(stdFile);`, without any `try`/`catch`. Per `zipios++`'s own documentation in `src/3rdParty/zipios++/zipfile.h`, the `ZipFile(const string &name, ...)` constructor `@throw`s `FColException` if the file is not a valid zip file and `IOException` on I/O problems. Elsewhere in this same file, `ZipTools::open()` was specifically written to wrap this same constructor in a `try`/`catch` and additionally check `isValid()`, showing the author is aware this constructor can throw/produce an invalid object for malformed or missing project files. But `ProjectFile::containsFile`, `ProjectFile::sizeOfFile`, `ProjectFile::extractInputFile`, `ProjectFile::readInputFileDirect`, `ProjectFile::replaceInputFile`, `ProjectFile::replaceInputFiles`, and `ProjectFile::replacePropertyFiles` all bypass `ZipTools::open` and construct `zipios::ZipFile` unguarded. A corrupt, truncated, or missing `.FCStd` file (or any file path passed to these APIs) will make the exception propagate out of `ProjectFile`, and if the caller up the stack does not happen to catch it, this turns a \"malformed project file\" case into an application crash instead of a clean, handled error.","fix":"Route these methods through the existing `ZipTools::open()` helper (or wrap the `zipios::ZipFile` construction in a `try`/`catch`) the same way `ProjectFile::loadDocument()` and `ProjectFile::parseMetadata()` already do, and return a safe default (`false`/`0`/empty string) instead of letting `FColException`/`IOException` escape, e.g.:\n```cpp\nbool ProjectFile::containsFile(const std::string& name) const\n{\n    auto project = ZipTools::open(stdFile);\n    if (!project) {\n        return false;\n    }\n    auto entry = project->getEntry(name);\n    return entry != nullptr;\n}\n```","locations":[{"ref":"src/App/ProjectFile.cpp:621-626","code":"  621 | bool ProjectFile::containsFile(const std::string& name) const\n  622 | {\n  623 |     zipios::ZipFile project(stdFile);\n  624 |     auto entry = project.getEntry(name);\n  625 |     return entry != nullptr;\n  626 | }","lines":6,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/ProjectFile.cpp#L621-L626"},{"ref":"src/App/ProjectFile.cpp:628-633","code":"  628 | uint32_t ProjectFile::sizeOfFile(const std::string& name) const\n  629 | {\n  630 |     zipios::ZipFile project(stdFile);\n  631 |     auto entry = project.getEntry(name);\n  632 |     return entry == nullptr ? 0 : entry->getSize();\n  633 | }","lines":6,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/ProjectFile.cpp#L628-L633"},{"ref":"src/App/ProjectFile.cpp:690-707","code":"  690 | std::string ProjectFile::extractInputFile(const std::string& name)\n  691 | {\n  692 |     zipios::ZipFile project(stdFile);\n  693 |     std::unique_ptr<std::istream> str(project.getInputStream(name));\n  694 |     if (str) {\n  695 |         // write it to a tmp. file as writing to the string stream\n  696 |         // might take too long\n  697 |         Base::FileInfo fi(Base::FileInfo::getTempFileName());\n  698 |         Base::ofstream file(fi, std::ios::out | std::ios::binary);\n  699 |         std::streambuf* buf = file.rdbuf();\n  700 |         (*str) >> buf;\n  701 |         file.flush();\n  702 |         file.close();\n  703 |         return fi.filePath();\n  704 |     }\n  705 | \n  706 |     return {};\n  707 | }","lines":18,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/ProjectFile.cpp#L690-L707"},{"ref":"src/App/ProjectFile.cpp:722-729","code":"  722 | void ProjectFile::readInputFileDirect(const std::string& name, std::ostream& str) const\n  723 | {\n  724 |     zipios::ZipFile project(stdFile);\n  725 |     std::unique_ptr<std::istream> istr(project.getInputStream(name));\n  726 |     if (istr) {\n  727 |         *istr >> str.rdbuf();\n  728 |     }\n  729 | }","lines":8,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/ProjectFile.cpp#L722-L729"},{"ref":"src/App/ProjectFile.cpp:731-769","code":"  731 | std::string ProjectFile::replaceInputFile(const std::string& name, std::istream& inp)\n  732 | {\n  733 |     // create a new zip file with the name '<zipfile>.<uuid>'\n  734 |     std::string uuid = Base::Uuid::createUuid();\n  735 |     std::string fn = stdFile;\n  736 |     fn += \".\";\n  737 |     fn += uuid;\n  738 |     Base::FileInfo tmp(fn);\n  739 |     Base::ofstream newZip(tmp, std::ios::out | std::ios::binary);\n  740 | \n  741 |     // standard compression\n  742 |     const int compressionLevel = 6;\n  743 |     zipios::ZipOutputStream outZip(newZip);\n  744 |     outZip.setComment(\"FreeCAD Document\");\n  745 |     outZip.setLevel(compressionLevel);\n  746 | \n  747 |     // open the original zip file\n  748 |     zipios::ZipFile project(stdFile);\n  749 |     zipios::ConstEntries files = project.entries();\n  750 |     for (const auto& it : files) {\n  751 |         std::string file = it->getFileName();\n  752 |         outZip.putNextEntry(file);\n  753 |         if (file == name) {\n  754 |             inp >> outZip.rdbuf();\n  755 |         }\n  756 |         else {\n  757 |             std::unique_ptr<std::istream> str(project.getInputStream(file));\n  758 |             if (str) {\n  759 |                 *str >> outZip.rdbuf();\n  760 |             }\n  761 |         }\n  762 |     }\n  763 | \n  764 |     project.close();\n  765 |     outZip.close();\n  766 |     newZip.close();\n  767 | \n  768 |     return fn;\n  769 | }","lines":39,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/ProjectFile.cpp#L731-L769"},{"ref":"src/App/ProjectFile.
