\n  817 |     std::string fn = stdFile;\n  818 |     fn += \".\";\n  819 |     fn += uuid;\n  820 |     Base::FileInfo tmp(fn);\n  821 |     Base::ofstream newZip(tmp, std::ios::out | std::ios::binary);\n  822 | \n  823 |     // open extra scope\n  824 |     {\n  825 |         // standard compression\n  826 |         const int compressionLevel = 6;\n  827 |         Base::ZipWriter writer(newZip);\n  828 |         writer.setComment(\"FreeCAD Document\");\n  829 |         writer.setLevel(compressionLevel);\n  830 | \n  831 |         // open the original zip file\n  832 |         zipios::ZipFile project(stdFile);\n  833 |         zipios::ConstEntries files = project.entries();\n  834 |         for (const auto& it : files) {\n  835 |             std::string file = it->getFileName();\n  836 |             writer.putNextEntry(file.c_str());\n  837 | \n  838 |             auto jt = props.find(file);\n  839 |             if (jt != props.end()) {\n  840 |                 jt->second->SaveDocFile(writer);\n  841 |             }\n  842 |             else {\n  843 |                 std::unique_ptr<std::istream> str(project.getInputStream(file));\n  844 |                 if (str) {\n  845 |                     *str >> writer.Stream().rdbuf();\n  846 |                 }\n  847 |             }\n  848 |         }\n  849 |         project.close();\n  850 |     }\n  851 | \n  852 |     return fn;\n  853 | }","lines":41,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/ProjectFile.cpp#L813-L853"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`Metadata::Metadata(const XERCES_CPP_NAMESPACE::DOMNode* domNode, int format)` silently does nothing if `dynamic_cast<const DOMElement*>(domNode)` fails (i.e. `domNode` is not a `DOMElement`, or is null). Unlike `loadFromInputSource`, which throws `Base::XMLBaseException` on malformed/unsupported input, this constructor leaves the `Metadata` object fully default-constructed (empty) with no exception, no log message, and no way for the caller to detect the parse actually failed.","fix":"Throw on the unexpected-node case, mirroring the other constructors:\n```cpp\nMetadata::Metadata(const DOMNode* domNode, int format)\n    : _dom(nullptr)\n{\n    auto element = dynamic_cast<const DOMElement*>(domNode);\n    if (!element) {\n        throw Base::XMLBaseException(\"Malformed content node: expected an element\");\n    }\n    switch (format) {\n        case 1:\n            parseVersion1(element);\n            break;\n        default:\n            throw Base::XMLBaseException(\n                \"package.xml format version is not supported by this version of FreeCAD\");\n    }\n}\n```","locations":[{"ref":"src/App/Metadata.cpp:109-123","code":"  109 | Metadata::Metadata(const DOMNode* domNode, int format)\n  110 |     : _dom(nullptr)\n  111 | {\n  112 |     auto element = dynamic_cast<const DOMElement*>(domNode);\n  113 |     if (element) {\n  114 |         switch (format) {\n  115 |             case 1:\n  116 |                 parseVersion1(element);\n  117 |                 break;\n  118 |             default:\n  119 |                 throw Base::XMLBaseException(\n  120 |                     \"package.xml format version is not supported by this version of FreeCAD\");\n  121 |         }\n  122 |     }\n  123 | }","lines":15,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/Metadata.cpp#L109-L123"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"In `Document::~Document()`, the call to `clearUndos()` is wrapped in `try { clearUndos(); } catch (const boost::exception&) { }`, silently discarding any `boost::exception` thrown during undo-stack teardown without logging anything. Every other exception handler in this file (e.g. in `_recomputeFeature`, `afterRestore`, `readObjects`) logs via `FC_ERR`/`Base::Console().error` before continuing. Silently swallowing the exception here hides real bugs (e.g. a `Transaction` destructor throwing while destroying document objects) and makes them very hard to diagnose since nothing is printed to the console or log.","fix":"Log the exception instead of discarding it silently:\n\n```cpp\n// before\n    try {\n        clearUndos();\n    }\n    catch (const boost::exception&) {\n    }\n\n// after\n    try {\n        clearUndos();\n    }\n    catch (const boost::exception& e) {\n        std::cerr << \"Exception while clearing undo stack: \" << boost::diagnostic_information(e) << '\\n';\n    }\n```","locations":[{"ref":"src/App/Document.cpp:1055-1065","code":" 1055 | Document::~Document()\n 1056 | {\n 1057 | #ifdef FC_LOGUPDATECHAIN\n 1058 |     Console().log(\"-App::Document: %s %p\\n\", getName(), this);\n 1059 | #endif\n 1060 | \n 1061 |     try {\n 1062 |         clearUndos();\n 1063 |     }\n 1064 |     catch (const boost::exception&) {\n 1065 |     }","lines":11,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/Document.cpp#L1055-L1065"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`ExpressionParser_yyerror()` in `src/App/Expression.cpp`, the bison/flex error callback, silently discards the error message it is given (`(void)errorinfo;`) and does nothing else. Consequently, when parsing an expression fails (e.g. `App::ExpressionParser::parse()`), the caller only ever sees a generic message such as `\"Failed to parse expression '<buffer>'\"` (`src/App/Expression.cpp:3772-3774`) without any indication of what specifically went wrong (unexpected token, expected token, position, etc.) that bison/flex would otherwise have provided through `errorinfo`. This makes malformed spreadsheet/property expressions harder to diagnose for users, since the underlying, more specific parser diagnostic is thrown away.","fix":"Capture `errorinfo` (e.g. into a thread-local/static `std::string` similar to `ScanResult`) and include it in the `ParserError`/`Expression::Exception` thrown by `ExpressionParser::parse()`/`parseUnit()`, instead of only reporting the generic \"Failed to parse expression\" message.","locations":[{"ref":"src/App/Expression.cpp:3531-3539","code":" 3531 | /**\n 3532 |  * @brief Error function for parser.\n 3533 |  *\n 3534 |  * @throws Base::Exception A generic parser error.\n 3535 |  */\n 3536 | void ExpressionParser_yyerror(const char *errorinfo)\n 3537 | {\n 3538 |     (void)errorinfo;\n 3539 | }","lines":9,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/Expression.cpp#L3531-L3539"},{"ref":"src/App/Expression.cpp:3773-3797","code":" 3773 | ExpressionPtr App::ExpressionParser::parse(const App::DocumentObject* owner, const char* buffer)\n 3774 | {\n 3775 |     // parse from buffer\n 3776 |     ExpressionParser::YY_BUFFER_STATE my_string_buffer = ExpressionParser::ExpressionParser_scan_string (buffer);\n 3777 |     ExpressionParser::StringBufferCleaner cleaner(my_string_buffer);\n 3778 | \n 3779 |     initParser(owner);\n 3780 | \n 3781 |     // run the parser\n 3782 |     int result = ExpressionParser::ExpressionParser_yyparse ();\n 3783 | \n 3784 |     if (result != 0) {\n 3785 |         throw ParserError(fmt::format(\"Failed to parse expression '{}'\", buffer));\n 3786 |     }\n 3787 | \n 3788 |     if (!ScanResult) {\n 3789 |         throw ParserError(fmt::format(\"Unknown error in expression '{}'\", buffer));\n 3790 |     }\n 3791 | \n 3792 |     if (!valueExpression) {\n 3793 |         ScanResult.reset();\n 3794 |         throw Expression::Exception(\"Expression can not evaluate to a value.\");\n 3795 |     }\n 3796 |     return std::exchange(ScanResult, nullptr);\n 3797 | }","lines":25,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/Expression.cpp#L3773-L3797"}]},
{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In the `FC_PY_ELEMENT_INIT` macro used by `FeaturePythonImp::init()`, the return value of\n`PyObject_IsTrue()` is used directly without checking for the `-1` error case:\n\n```cpp\nelse {                                                                                     \\\n    _Flags.set(FlagAllowRecursive_##_name, PyObject_IsTrue(pyRecursive));                  \\\n    Py_DECREF(pyRecursive);                                                                \\\n}\n```\n\n`PyObject_IsTrue()` returns `-1` and leaves a Python exception set if evaluating truthiness of\n`pyRecursive` fails (e.g. a custom `__bool__`/`__len__` on whatever object the user assigned to\n`__allow_recursive_<method>` raises). That `-1` is passed straight into `std::bitset::set()`, which\ntreats any nonzero value as `true`, and the pending Python exception is never cleared. The stray\nexception can then be observed and misattributed at an unrelated later point where Python C-API code\nnext checks `PyErr_Occurred()`.","fix":"Check the return value and clear/report the error before continuing, e.g.:\n\n```cpp\nelse {\n    int allow = PyObject_IsTrue(pyRecursive);\n    Py_DECREF(pyRecursive);\n    if (allow < 0) {\n        PyErr_Clear();\n        allow = 0;\n    }\n    _Flags.set(FlagAllowRecursive_##_name, allow);\n}\n```","locations":[{"ref":"src/App/FeaturePython.h:133-145","code":"  133 | #define FC_PY_ELEMENT_INIT(_name)                                                                  \\\n  134 |     FC_PY_GetCallable(pyobj, #_name, py_##_name);                                                  \\\n  135 |     if (!py_##_name.isNone()) {                                                                    \\\n  136 |         PyObject* pyRecursive = PyObject_GetAttrString(pyobj, \"__allow_recursive_\" #_name);        \\\n  137 |         if (!pyRecursive) {                                                                        \\\n  138 |             PyErr_Clear();                                                                         \\\n  139 |             _Flags.set(FlagAllowRecursive_##_name, false);                                         \\\n  140 |         }                                                                                          \\\n  141 |         else {                                                                                     \\\n  142 |             _Flags.set(FlagAllowRecursive_##_name, PyObject_IsTrue(pyRecursive));                  \\\n  143 |             Py_DECREF(pyRecursive);                                                                \\\n  144 |         }                                                                                          \\\n  145 |     }","lines":13,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/FeaturePython.h#L133-L145"}]},
{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `PropertyExpressionEngine::execute` (`src/App/PropertyExpressionEngine.cpp:729-775`) and `PropertyExpressionEngine::updateHiddenReference` (`src/App/PropertyExpressionEngine.cpp:373-393`), an `App::any value;` is declared and only assigned inside the `try` block via `value = expression->getValueAsAny();`. The subsequent `catch (std::bad_cast&)` handler reports the offending type using `value.type().name()`. If the `std::bad_cast` is thrown from inside `getValueAsAny()` itself (the assignment to `value` never completes), `value` is still the default-constructed, empty `App::any`, so the error message reports the wrong/empty type instead of the type that actually caused the cast failure. The message is only accurate when the `bad_cast` originates later, from `prop->setPathValue(*it, value)`.","fix":"Do not rely on the possibly-unassigned outer `value` for the error message; e.g. catch `std::bad_cast` inside the expression-evaluation step separately, or report the exception's own message instead of `value.type().name()`:\n```cpp\ncatch (std::bad_cast& e) {\n    std::ostringstream ss;\n    ss << \"Invalid type in property binding '\" << prop->getFullName() << \"': \" << e.what();\n    throw Base::TypeError(ss.str().c_str());\n}\n```","locations":[{"ref":"src/App/PropertyExpressionEngine.cpp:729-775","code":"  729 |         App::any value;\n  730 |         try {\n  731 |             // Evaluate expression\n  732 |             std::shared_ptr<App::Expression> expression = expressions[*it].expression;\n  733 |             if (expression) {\n  734 |                 value = expression->getValueAsAny();\n  735 | \n  736 |                 // Enable value comparison for all expression bindings to reduce\n  737 |                 // unnecessary touch and recompute.\n  738 |                 //\n  739 |                 // This optimization is necessary for some hidden reference to\n  740 |                 // work because it introduce dependency loop. The repeativtive\n  741 |                 // recompute can be stopped if the expression evaluates the same\n  742 |                 // value.\n  743 |                 //\n  744 |                 // In the future, we can generalize the optimization to all\n  745 |                 // property modification, i.e. do not touch unless value change\n  746 |                 //\n  747 |                 // if (option == ExecuteOnRestore && prop->testStatus(Property::EvalOnRestore))\n  748 |                 {\n  749 |                     if (isAnyEqual(value, prop->getPathValue(*it))) {\n  750 |                         continue;\n  751 |                     }\n  752 |                     if (touched) {\n  753 |                         *touched = true;\n  754 |                     }\n  755 |                 }\n  756 |                 prop->setPathValue(*it, value);\n  757 |             }\n  758 |         }\n  759 |         catch (Base::Exception& e) {\n  760 |             std::ostringstream ss;\n  761 |             ss << e.what() << std::endl << \"in property binding '\" << prop->getFullName() << \"'\";\n  762 |             e.setMessage(ss.str());\n  763 |             throw;\n  764 |         }\n  765 |         catch (std::bad_cast&) {\n  766 |             std::ostringstream ss;\n  767 |             ss << \"Invalid type '\" << value.type().name() << \"'\";\n  768 |             ss << \"\\nin property binding '\" << prop->getFullName() << \"'\";\n  769 |             throw Base::TypeError(ss.str().c_str());\n  770 |         }\n  771 |         catch (std::exception& e) {\n  772 |             std::ostringstream ss;\n  773 |             ss << e.what() << \"\\nin property binding '\" << prop->getFullName() << \"'\";\n  774 |             throw Base::RuntimeError(ss.str().c_str());\n  775 |         }","lines":47,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/PropertyExpressionEngine.cpp#L729-L775"},{"ref":"src/App/PropertyExpressionEngine.cpp:373-393","code":"  373 |         App::any value;\n  374 |         try {\n  375 |             value = it->second.expression->getValueAsAny();\n  376 |             if (!isAnyEqual(value, myProp->getPathValue(var))) {\n  377 |                 myProp->setPathValue(var, value);\n  378 |             }\n  379 |         }\n  380 |         catch (Base::Exception& e) {\n  381 |             e.reportException();\n  382 |             FC_ERR(\"Failed to evaluate property binding \" << myProp->getFullName()\n  383 |                                                           << \" on change of \" << key);\n  384 |         }\n  385 |         catch (std::bad_cast&) {\n  386 |             FC_ERR(\"Invalid type '\" << value.type().name() << \"' in property binding \"\n  387 |                                     << myProp->getFullName() << \" on change of \" << key);\n  388 |         }\n  389 |         catch (std::exception& e) {\n  390 |             FC_ERR(e.what());\n  391 |             FC_ERR(\"Failed to evaluate property binding \" << myProp->getFullName()\n  392 |                                                           << \" on change of \" << key);\n  393 |         }","lines":21,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/PropertyExpressionEngine.cpp#L373-L393"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"Several places call `isdigit()`/`std::isdigit()`/`std::isxdigit()` with a plain `char` value read directly from name/subname data (e.g. `isdigit(name[suffixPosition])` in `IndexedName.cpp`, `isdigit(*c)` / `isdigit(subname[0])` / `isdigit(*txt)` in `Link.cpp`, and `std::isxdigit(name[i])` / `std::isdigit(name[i])` / `std::isdigit(lc)` / `std::isdigit(rc)` in `MappedElement.cpp`). Per the C/C++ standard, passing a negative value other than `EOF` to these `<cctype>` functions (which happens whenever `char` is signed, the default on x86/ARM Linux, and the byte value is `>= 0x80`) is undefined behavior. Element/subnames can contain arbitrary bytes originating from untrusted or corrupted documents, so this is reachable with non-ASCII input.","fix":"Cast the character to `unsigned char` before calling the `<cctype>` functions, e.g. replace `isdigit(name[suffixPosition])` with `isdigit(static_cast<unsigned char>(name[suffixPosition]))`, and likewise for the other call sites listed.","locations":[{"ref":"src/App/IndexedName.cpp:55","code":"   55 |         if (!isdigit(name[suffixPosition])) {","lines":1,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/IndexedName.cpp#L55"},{"ref":"src/App/Link.cpp:1215","code":" 1215 |         if (!isdigit(*c)) {","lines":1,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/Link.cpp#L1215"},{"ref":"src/App/Link.cpp:1242","code":" 1242 |     if (isdigit(subname[0])) {","lines":1,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/Link.cpp#L1242"},{"ref":"src/App/Link.cpp:1274","code":" 1274 |                     if (!isdigit(*txt)) {","lines":1,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/Link.cpp#L1274"},{"ref":"src/App/MappedElement.cpp:66","code":"   66 |         if (!std::isxdigit(name[i])) {","lines":1,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/MappedElement.cpp#L66"},{"ref":"src/App/MappedElement.cpp:84","code":"   84 |         if (std::isdigit(name[i]) == 0) {","lines":1,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/MappedElement.cpp#L84"},{"ref":"src/App/MappedElement.cpp:200-201","code":"  200 |         bool ldigit = std::isdigit(lc);\n  201 |         bool rdigit = std::isdigit(rc);","lines":2,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/MappedElement.cpp#L200-L201"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`ConditionalExpression::simplify()` calls `condition->simplify()` twice when the condition does not fold to a constant number: once to obtain `e` (used only for the `freecad_cast<NumberExpression*>` check), and again inside the `std::make_unique<ConditionalExpression>(...)` call when `v` is null. The second call redundantly repeats the entire simplification work already done and stored (but discarded) in `e`.","fix":"Reuse the already-computed `e` instead of simplifying `condition` a second time:\n\n```cpp\n// before\nExpressionPtr e = condition->simplify();\nNumberExpression * v = freecad_cast<NumberExpression*>(e.get());\n\nif (!v) {\n    return std::make_unique<ConditionalExpression>(\n        owner,\n        condition->simplify().release(),\n        trueExpr->simplify().release(),\n        falseExpr->simplify().release()\n    );\n}\n\n// after\nExpressionPtr e = condition->simplify();\nNumberExpression * v = freecad_cast<NumberExpression*>(e.get());\n\nif (!v) {\n    return std::make_unique<ConditionalExpression>(\n        owner,\n        e.release(),\n        trueExpr->simplify().release(),\n        falseExpr->simplify().release()\n    );\n}\n```","locations":[{"ref":"src/App/Expression.cpp:3228-3240","code":" 3228 | ExpressionPtr ConditionalExpression::simplify() const\n 3229 | {\n 3230 |     ExpressionPtr e = condition->simplify();\n 3231 |     NumberExpression * v = freecad_cast<NumberExpression*>(e.get());\n 3232 | \n 3233 |     if (!v) {\n 3234 |         return std::make_unique<ConditionalExpression>(\n 3235 |             owner,\n 3236 |             condition->simplify().release(),\n 3237 |             trueExpr->simplify().release(),\n 3238 |             falseExpr->simplify().release()\n 3239 |         );\n 3240 |     }","lines":13,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/Expression.cpp#L3228-L3240"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`MeasureManager::getMeasureHandler(const char* module)` iterates `_mMeasureHandlers` by value (`for (MeasureHandler handler : _mMeasureHandlers)`), copying each `MeasureHandler` (a `std::string` plus a `std::function`) on every iteration, and `MeasureManager::getSelectionPy` iterates `selection` by value (`for (auto it : selection)`), copying each `MeasureSelectionItem` (a `SubObjectT`, which itself owns several strings, plus a `Base::Vector3d`). Both loops are read-only and should iterate by `const&` to avoid the needless copies, which matter since these functions run per-selection/per-lookup in interactive measurement code paths.","fix":"Iterate by const reference instead of by value:\n```cpp\nfor (const MeasureHandler& handler : _mMeasureHandlers) { ... }\n...\nfor (const auto& it : selection) { ... }\n```","locations":[{"ref":"src/App/MeasureManager.cpp:62-66","code":"   62 |     for (MeasureHandler handler : _mMeasureHandlers) {\n   63 |         if (!strcmp(handler.module.c_str(), module)) {\n   64 |             return handler;\n   65 |         }\n   66 |     }","lines":5,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/MeasureManager.cpp#L62-L66"},{"ref":"src/App/MeasureManager.cpp:142-152","code":"  142 |     for (auto it : selection) {\n  143 | \n  144 |         Py::Dict sel;\n  145 |         sel.setItem(\"object\", Py::asObject(it.object.getObject()->getPyObject()));\n  146 |         sel.setItem(\"subName\", Py::String(it.object.getSubName()));\n  147 |         sel.setItem(\"pickedPoint\", Py::asObject(new Base::VectorPy(it.pickedPoint)));\n  148 | \n  149 |         selectionPy.setItem(i, sel);\n  150 | \n  151 |         i++;\n  152 |     }","lines":11,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/MeasureManager.cpp#L142-L152"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"medium","difficulty":"medium","description":"`src/App/Application.cpp` still contains a full, ~470-line duplicate implementation of the user/home/config/cache/temp directory discovery logic that was superseded by the `App::ApplicationDirectories` class (see the \"App: Migrate directory handling to helper class\" refactor). Specifically: the anonymous-namespace helpers `getUserHome()`, `getOldGenericDataLocation()`, `getSubDirectories()`, `getOldDataLocation()`, `findUserHomePath()`, `findPath()`, `getCustomPaths()`, `getStandardPaths()`, the unused `operator<<(std::ostream&, const std::vector<T>&)` helper, `Application::ExtractUserPath()`, and all four platform variants of `Application::FindHomePath()` are defined but never called from anywhere in the codebase — `Application::initConfig()` calls `ApplicationDirectories::findHomePath(argv[0])` (`src/App/Application.cpp:2743-2745`) and constructs `App::ApplicationDirectories` (`src/App/Application.cpp:2807`) instead. `grep` across `src/App` confirms zero call sites for `Application::ExtractUserPath` and `Application::FindHomePath` other than their own declarations/definitions. In addition, `Application::PrintInitHelp()` is declared in the header (`src/App/Application.h:1013`) but has no definition anywhere and is never called either. This dead code bloats the translation unit, duplicates security/path-handling logic that must now be kept in sync in two places (or silently rot in the unused copy), and can mislead readers into thinking it is still the live implementation.","fix":"Delete the unused anonymous-namespace helpers, `Application::ExtractUserPath()`, and all `Application::FindHomePath()` overloads from `src/App/Application.cpp` (lines 3354-3826), along with their now-pointless declarations `static void ExtractUserPath();`, `static std::string FindHomePath(const char* sCall);`, and the never-defined `static void PrintInitHelp();` in `src/App/Application.h` (lines 1011-1015). The functionality is already fully covered by `App::ApplicationDirectories::findHomePath()` and `App::ApplicationDirectories`'s directory-configuration methods.","locations":[{"ref":"src/App/Application.cpp:3371-3843","code":" 3371 | // A helper function to simplify the main part.\n 3372 | template<class T>\n 3373 | std::ostream& operator<<(std::ostream& os, const std::vector<T>& v)\n 3374 | {\n 3375 |     copy(v.begin(), v.end(), std::ostream_iterator<T>(std::cout, \" \"));\n 3376 |     return os;\n 3377 | }\n 3378 | \n 3379 | namespace {\n 3380 | \n 3381 | /*!\n 3382 |  * \\brief getUserHome\n 3383 |  * Returns the user's home directory.\n 3384 |  */\n 3385 | QString getUserHome()\n 3386 | {\n 3387 |     QString path;\n 3388 | #if defined(FC_OS_LINUX) || defined(FC_OS_CYGWIN) || defined(FC_OS_BSD) || defined(FC_OS_MACOSX)\n 3389 |     // Default paths for the user specific stuff\n 3390 |     struct passwd pwd;\n 3391 |     struct passwd *result;\n 3392 |     const std::size_t buflen = 16384;\n 3393 |     std::vector<char> buffer(buflen);\n 3394 |     const int error = getpwuid_r(getuid(), &pwd, buffer.data(), buffer.size(), &result);\n 3395 |     Q_UNUSED(error)\n 3396 |     if (!result)\n 3397 |         throw Base::RuntimeError(\"Getting HOME path from system failed!\");\n 3398 |     path = QString::fromUtf8(result->pw_dir);\n 3399 | #else\n 3400 |     path = QStandardPaths::writableLocation(QStandardPaths::HomeLocation);\n 3401 | #endif\n 3402 | \n 3403 |     return path;\n 3404 | }\n 3405 | \n 3406 | /*!\n 3407 |  * \\brief getOldGenericDataLocation\n 3408 |  * Returns a directory location where persistent data shared across applications can be stored.\n 3409 |  * This method returns the old non-XDG-compliant root path where to store config files and application data.\n 3410 |  */\n 3411 | #if defined(FC_OS_WIN32)\n 3412 | QString getOldGenericDataLocation(QString home)\n 3413 | {\n 3414 | #if defined(FC_OS_WIN32)\n 3415 | {"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"In `DocumentObject::printInvalidLinks()`, the local variable `scopenames` is carefully accumulated by iterating `obj->getParents()` (and truncated for readability once it grows past 80 characters), but it is never referenced in the final `Base::Console().warning(...)` call. Only `objnames` is printed, so the diagnostic message never reports the out-of-scope parent objects it was built to describe, and the work done to build `scopenames` is wasted.","fix":"Include `scopenames` in the warning format string, e.g.\n\nBefore:\n```cpp\nBase::Console().warning(\"%s: %s links are out of scope. Out of scope links to: %s\\n\",\n                        getTypeId().getName(),\n                        getNameInDocument(),\n                        objnames.c_str());\n```\n\nAfter:\n```cpp\nBase::Console().warning(\"%s: %s links are out of scope. Out of scope links to: %s (scopes: %s)\\n\",\n                        getTypeId().getName(),\n                        getNameInDocument(),\n                        objnames.c_str(),\n                        scopenames.c_str());\n```","locations":[{"ref":"src/App/DocumentObject.cpp:101-151","code":"  101 | void DocumentObject::printInvalidLinks() const\n  102 | {\n  103 |     try {\n  104 |         // Get objects that have invalid link scope, and print their names.\n  105 |         // Truncate the invalid object list name strings for readability, if they happen to be very\n  106 |         // long.\n  107 |         std::vector<App::DocumentObject*> invalid_linkobjs;\n  108 |         std::string objnames, scopenames;\n  109 |         GeoFeatureGroupExtension::getInvalidLinkObjects(this, invalid_linkobjs);\n  110 |         for (auto& obj : invalid_linkobjs) {\n  111 |             objnames += obj->getNameInDocument();\n  112 |             objnames += \" \";\n  113 |             for (auto& scope : obj->getParents()) {\n  114 |                 if (scopenames.length() > 80) {\n  115 |                     scopenames += \"... \";\n  116 |                     break;\n  117 |                 }\n  118 | \n  119 |                 scopenames += scope.first->getNameInDocument();\n  120 |                 scopenames += \" \";\n  121 |             }\n  122 | \n  123 |             if (objnames.length() > 80) {\n  124 |                 objnames += \"... \";\n  125 |                 break;\n  126 |             }\n  127 |         }\n  128 | \n  129 |         if (objnames.empty()) {\n  130 |             objnames = \"N/A\";\n  131 |         }\n  132 |         else {\n  133 |             objnames.pop_back();\n  134 |         }\n  135 | \n  136 |         if (scopenames.empty()) {\n  137 |             scopenames = \"N/A\";\n  138 |         }\n  139 |         else {\n  140 |             scopenames.pop_back();\n  141 |         }\n  142 | \n  143 |         Base::Console().warning(\"%s: %s links are out of scope. Out of scope links to: %s\\n\",\n  144 |                                 getTypeId().getName(),\n  145 |                                 getNameInDocument(),\n  146 |                                 objnames.c_str());\n  147 |     }\n  148 |     catch (const Base::Exception& e) {\n  149 |         e.reportException();\n  150 |     }\n  151 | }","lines":51,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/DocumentObject.cpp#L101-L151"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`compareNumbers()` in `MappedElement.cpp` is meant to compare the digit run of two `MappedName`s character-by-character once their lengths are known to be equal: `for (i = start; i < leftLength; ++i) { ... left[i] ... right[i] ... }`. But `leftLength` here is a *length* (the digit count returned by `getIntLength()`), not an absolute end index, while `i` starts at `start` (the absolute position of the first digit in the string). For any `start > 0` (the overwhelmingly common case for real element names such as `Edge123`, where the digits follow a non-empty text prefix), the loop condition `i < leftLength` is false on the very first check, so the loop body never executes and the function falls straight through to `compareText(left, right, i)` with `i` unchanged from `start`. The digit-by-digit comparison this loop was written to perform is therefore dead code for every realistic input; the digits end up being compared later only incidentally, inside `compareText()`.","fix":"Bound the loop using the absolute end index, not the raw length: `for (; i < start + leftLength; ++i)`.","locations":[{"ref":"src/App/MappedElement.cpp:159-182","code":"  159 | inline\n  160 | int compareNumbers(const MappedName& left, const MappedName& right, int start)\n  161 | {\n  162 |     int leftLength = getIntLength(left, start);\n  163 |     int rightLength = getIntLength(right, start);\n  164 | \n  165 |     if (leftLength != rightLength) {\n  166 |         // The shorter number is less than the longer one.\n  167 |         return leftLength < rightLength ? -1 : 1;\n  168 |     }\n  169 | \n  170 |     int i = start;\n  171 |     for (; i < leftLength; ++i) {\n  172 |         char lc = left[i];\n  173 |         char rc = right[i];\n  174 | \n  175 |         if (lc != rc) {\n  176 |             return lc < rc ? -1 : 1;\n  177 |         }\n  178 |     }\n  179 | \n  180 |     // If we reach here, the numbers are equal, compare the text part.\n  181 |     return compareText(left, right, i);\n  182 | }","lines":24,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/MappedElement.cpp#L159-L182"}]},
{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`MeasureManager::getValidMeasureTypes` contains the statement `std::pair<int, MeasureType>();` which constructs a temporary `std::pair` and immediately discards it. It has no effect on program state and appears to be leftover debug/scaffolding code.","fix":"Remove the dead statement:\n```cpp\n// Store valid measure types\nstd::vector<MeasureType*> validTypes;\n-std::pair<int, MeasureType>();\n\n```","locations":[{"ref":"src/App/MeasureManager.cpp:167","code":"  167 |     std::pair<int, MeasureType>();","lines":1,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/MeasureManager.cpp#L167"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment on `Property::StatusBits` in `Property.h` says: \"The first 8 bits are used for the base system the rest can be used in descendent classes...\" and lists only bits 0-3. In reality the `Status` enum in the same header defines base-system bits all the way through `DisableNotify = 18`, plus reserved \"static\" type-mirroring bits `PropStaticBegin = 21` through `PropStaticEnd = 29`, before `User1`-`User4` begin at bit 29. The comment is stale relative to the actual bit layout and could mislead a reader into thinking bits 8-31 are free for subclass use, when bits up to 29 are reserved by the base `Property`/`PropertyContainer` framework.","fix":"Update the comment to match the current `Status` enum, e.g. state that the base system uses bits `0`-`18` plus the reserved static-type mirror bits `21`-`29`, and only `29`(`User1`)-`32`(`User4`) are free for descendant classes, or simply point the comment at `Property::Status` as the single source of truth instead of restating (and now mis-stating) bit numbers.","locations":[{"ref":"src/App/Property.h:544-557","code":"  544 | protected:\n  545 |     /** @brief %Status bits of the property.\n  546 |      *\n  547 |      * The first 8 bits are used for the base system the rest can be used in\n  548 |      * descendent classes to mark special statuses on the objects.\n  549 |      * The bits and their meaning are listed below:\n  550 |      * - **0**: object is marked as 'touched'\n  551 |      * - **1**: object is marked as 'immutable'\n  552 |      * - **2**: object is marked as 'read-only' (for property editor)\n  553 |      * - **3**: object is marked as 'hidden' (for property editor)\n  554 |      *\n  555 |      * @see Property::Status that defines the position of the status bits.\n  556 |      */\n  557 |     std::bitset<32> StatusBits;","lines":14,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/Property.h#L544-L557"}]},
{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"`ProjectFile::getObjects()`, `ProjectFile::getObjectsOfType()`, and `ProjectFile::getTypeId()` each independently re-implement the exact same DOM traversal: look up all `Objects` elements, then all `Object` children of each, then fetch the `type`/`name` attributes of each. Likewise, `ProjectFile::findFiles(DOMNode*, std::list<PropertyFile>&)` and `ProjectFile::findFiles(DOMNode*, std::list<std::string>&)` are near-identical recursive tree walks that differ only in what gets pushed into the output list. This duplication means any bug fix or behavior change (e.g. handling malformed/missing attributes) has to be applied in three (or two) separate places, and it is easy to fix one copy while forgetting the others.","fix":"Factor the shared `Objects`/`Object` DOM walk into a single private helper, e.g. `void ProjectFile::forEachObject(const std::function<void(const std::string&, const std::string&)>& cb) const`, and have `getObjects()`, `getObjectsOfType()`, and `getTypeId()` all call it. Similarly, unify the two `findFiles()` overloads into one implementation that always collects `PropertyFile` (with `name`/`type`/`file`), and have the `std::string`-only caller just pull `.file` back out of the result.","locations":[{"ref":"src/App/ProjectFile.cpp:411-441","code":"  411 | std::list<ProjectFile::Object> ProjectFile::getObjects() const\n  412 | {\n  413 |     std::list<Object> names;\n  414 |     if (!xmlDocument) {\n  415 |         return names;\n  416 |     }\n  417 | \n  418 |     DOMNodeList* nodes = xmlDocument->getElementsByTagName(XStrLiteral(\"Objects\").unicodeForm());\n  419 |     for (XMLSize_t i = 0; i < nodes->getLength(); i++) {\n  420 |         DOMNode* node = nodes->item(i);\n  421 |         if (node->getNodeType() == DOMNode::ELEMENT_NODE) {\n  422 |             DOMNodeList* objectList = static_cast<DOMElement*>(node)->getElementsByTagName(\n  423 |                 XStrLiteral(\"Object\").unicodeForm());  // NOLINT\n  424 |             for (XMLSize_t j = 0; j < objectList->getLength(); j++) {\n  425 |                 DOMNode* objectNode = objectList->item(j);\n  426 |                 DOMNode* typeAttr =\n  427 |                     objectNode->getAttributes()->getNamedItem(XStrLiteral(\"type\").unicodeForm());\n  428 |                 DOMNode* nameAttr =\n  429 |                     objectNode->getAttributes()->getNamedItem(XStrLiteral(\"name\").unicodeForm());\n  430 |                 if (typeAttr && nameAttr) {\n  431 |                     Object obj;\n  432 |                     obj.name = StrX(nameAttr->getNodeValue()).c_str();\n  433 |                     obj.type = Base::Type::fromName(StrX(typeAttr->getNodeValue()).c_str());\n  434 |                     names.push_back(obj);\n  435 |                 }\n  436 |             }\n  437 |         }\n  438 |     }\n  439 | \n  440 |     return names;\n  441 | }","lines":31,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/ProjectFile.cpp#L411-L441"},{"ref":"src/App/ProjectFile.cpp:443-472","code":"  443 | std::list<std::string> ProjectFile::getObjectsOfType(const Base::Type& typeId) const\n  444 | {\n  445 |     std::list<std::string> names;\n  446 |     if (!xmlDocument) {\n  447 |         return names;\n  448 |     }\n  449 | \n  450 |     DOMNodeList* nodes = xmlDocument->getElementsByTagName(XStrLiteral(\"Objects\").unicodeForm());\n  451 |     for (XMLSize_t i = 0; i < nodes->getLength(); i++) {\n  452 |         DOMNode* node = nodes->item(i);\n  453 |         if (node->getNodeType() == DOMNode::ELEMENT_NODE) {\n  454 |             DOMNodeList* objectList = static_cast<DOMElement*>(node)->getElementsByTagName(\n  455 |                 XStrLiteral(\"Object\").unicodeForm());  // NOLINT\n  456 |             for (XMLSize_t j = 0; j < objectList->getLength(); j++) {\n  457 |                 DOMNode* {"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"medium","difficulty":"hard","description":"`Document::recompute()` is a roughly 220-line function (`src/App/Document.cpp:2843-3066`) that mixes many independent responsibilities in one place: early-out status checks, topological sorting via `getDependencyList()`, a hand-rolled two-pass recompute loop with its own touched/filter bookkeeping (`std::set<DocumentObject*> filter`, the `idx`/`passes` restart logic), fine-grained vs. coarse-grained dependent-object touching, `Base::SequencerLauncher` progress reporting, recompute-log error printing, and finally a sweep over *every other open document* (`GetApplication().getDocuments()`) to flush their `pendingRemove` queues. Because so much unrelated logic (recompute-order bookkeeping, UI progress, error reporting, and cross-document object removal) lives in a single function with several nested loops and early `break`/`continue`/status-flag interactions, it is hard to reason about, hard to unit test in isolation, and risky to modify (a small change to the pass/idx restart logic can silently break recompute semantics for the whole application).","fix":"Split `Document::recompute()` into smaller, independently testable steps, e.g. a private helper for computing the topologically sorted work list, a helper implementing the two-pass \"recompute with dependency inversion\" loop (returning which objects errored/remained touched), and a separate helper (or a call site outside `recompute()`) for flushing `pendingRemove` queues across documents, so the top-level `recompute()` becomes a short orchestration function.","locations":[{"ref":"src/App/Document.cpp:2855-3078","code":" 2855 | int Document::recompute(const std::vector<DocumentObject*>& objs,\n 2856 |                         bool force,\n 2857 |                         bool* hasError,\n 2858 |                         int options)\n 2859 | {\n 2860 |     ZoneScoped;\n 2861 | \n 2862 |     // Recompute can execute Python-backed features. Keep the GIL for the full\n 2863 |     // recompute so async recompute still serializes Python execution the same\n 2864 |     // way the main-thread path does, preserving compatibility with existing\n 2865 |     // Python-backed objects and addons. Main-thread signal hops such as\n 2866 |     // signalBeforeRecompute() temporarily release it when they need to run\n 2867 |     // Python on the GUI thread to avoid deadlocks.\n 2868 |     Base::PyGILStateLocker locker;\n 2869 | \n 2870 |     if (d->undoing || d->rollback) {\n 2871 |         if (FC_LOG_INSTANCE.isEnabled(FC_LOGLEVEL_LOG)) {\n 2872 |             FC_WARN(\"Ignore document recompute on undo/redo\");\n 2873 |         }\n 2874 |         return 0;\n 2875 |     }\n 2876 | \n 2877 |     int objectCount = 0;\n 2878 |     if (testStatus(Document::PartialDoc)) {\n 2879 |         if (mustExecute()) {\n 2880 |             FC_WARN(\"Please reload partial document '\" << Label.getValue()\n 2881 |                                                        << \"' for recomputation.\");\n 2882 |         }\n 2883 |         return 0;\n 2884 |     }\n 2885 |     if (testStatus(Document::Recomputing)) {\n 2886 |         // this is clearly a bug in the calling instance\n 2887 |         FC_ERR(\"Recursive calling of recompute for document \" << getName());\n 2888 |         return 0;\n 2889 |     }\n 2890 |     // The 'SkipRecompute' flag can be (tmp.) set to avoid too many\n 2891 |     // time expensive recomputes\n 2892 |     if (!force && testStatus(Document::SkipRecompute)) {\n 2893 |         signalSkipRecompute(*this, objs);\n 2894 |         return 0;\n 2895 |     }\n 2896 | \n 2897 |     // delete recompute log\n 2898 |     d->clearRecomputeLog();\n 2899 | \n 2900 |     Base::TimeTracker tracker(\"Document::recompute\");\n 2901 |     std::optional<Base::ObjectStatusLocker<Document::Status, Document>> recomputingStatus;\n 2902 |     recomputingStatus.emplace(Document::Recomputing, this);\ {"id":"ARCH_2","type":"architecture","type_label":"Architecture","severity":"medium","difficulty":"easy","description":"`App::GeometryPython` (`using GeometryPython = FeaturePythonT<GeoFeature>;` in\n`src/App/FeaturePython.h:471`) is the Python-scriptable variant of `App::GeoFeature`, and is actively\nused in the tree (e.g. `Arch_BuildingPart` is created as an `\"App::GeometryPython\"` object in\n`src/Mod/BIM/Arch.py`). `App::GeoFeature::getPyObject()` normally returns a `GeoFeaturePy`-typed wrapper\n(`src/App/GeoFeature.cpp:82-89`), exposing GeoFeature-specific Python API such as\n`getGlobalPlacement()`, `getGlobalPlacementOf()`, `getPropertyOfGeometry()` and\n`getPropertyNameOfGeometry()` (see `src/App/GeoFeaturePyImp.cpp`).\n\nHowever, `App::GeometryPython` never specializes `getPyObject()` (only `getViewProviderName()` is\nspecialized in `src/App/FeaturePython.cpp:783-791`), so it falls back to the generic\n`FeaturePythonT<FeatureT>::getPyObject()` in `src/App/FeaturePython.h:408-415`, which delegates to\n`FeaturePythonImp::getPyObject()`. That helper is hard-coded to `App::DocumentObject`'s Python type\nregardless of `FeatureT`:\n\n```cpp\nPyObject* FeaturePythonImp::getPyObject()\n{\n    // ref counter is set to 1\n    return new FeaturePythonPyT<DocumentObjectPy>(object);\n}\n```\n\nAs a result, every `App::GeometryPython` object (including `Arch_BuildingPart`) gets a Python wrapper of\ntype `FeaturePythonPyT<DocumentObjectPy>` instead of one derived from `GeoFeaturePy`. Any Python code\n(user macro, addon, or `isinstance`/`isDerivedFrom` check against `App.GeoFeaturePy`) that expects a\n`GeoFeature`-Python-scripted object to expose the `GeoFeaturePy` API will get an `AttributeError`\ninstead, silently diverging from what `App::GeoFeature`/`App::GeometryPython`'s documentation implies.","fix":"Give `App::GeometryPython` its own `getPyObject()` specialization that builds a `GeoFeaturePy`-based\nwrapper, the same way `App::FeaturePython` already specializes it for `DocumentObjectPy`\n(`src/App/FeaturePython.cpp:766-774`) and `DocumentObjectGroup` does for `DocumentObjectGroupPy`:\n\n```cpp\nnamespace App\n{\ntemplate<>\nPyObject* App::GeometryPython::getPyObject()\n{\n    if (PythonObject.is(Py::_None())) {\n        // ref counter is set to 1\n        PythonObject = Py::Object(new FeaturePythonPyT<GeoFeaturePy>(this), true);\n    }\n    return Py::new_reference_to(PythonObject);\n}\n}\n```\n(requires including `<App/GeoFeaturePy.h>` in `FeaturePython.cpp`).","locations":[{"ref":"src/App/FeaturePython.cpp:432-436","code":"  432 | PyObject* FeaturePythonImp::getPyObject()\n  433 | {\n  434 |     // ref counter is set to 1\n  435 |     return new FeaturePythonPyT<DocumentObjectPy>(object);\n  436 | }","lines":5,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/FeaturePython.cpp#L432-L436"},{"ref":"src/App/FeaturePython.h:408-415","code":"  408 |     PyObject* getPyObject() override\n  409 |     {\n  410 |         if (FeatureT::PythonObject.is(Py::_None())) {\n  411 |             // ref counter is set to 1\n  412 |             FeatureT::PythonObject = Py::Object(imp->getPyObject(), true);\n  413 |         }\n  414 |         return Py::new_reference_to(FeatureT::PythonObject);\n  415 |     }","lines":8,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/FeaturePython.h#L408-L415"},{"ref":"src/App/FeaturePython.h:470-471","code":"  470 | using FeaturePython = FeaturePythonT<DocumentObject>;\n  471 | using GeometryPython = FeaturePythonT<GeoFeature>;","lines":2,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/FeaturePython.h#L470-L471"}]},
{"id":"ARCH_3","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"`Document::readObjects()` (`src/App/Document.cpp:1559-1755`) is roughly 200 lines and combines several distinct concerns in one function: parsing the partial-load dependency graph from XML (`fcElementObjectDeps`/`fcElementObjectDep` handling and the `loadDeps()` recursion), creating new `DocumentObject` instances and assigning them names/ids while stripping the `@document` suffix used for cross-document imports, restoring touched/error/freeze status flags from XML attributes, and then, in the same function, iterating a second XML section (`ObjectData`) to call `pObj->Restore(reader)` on each object with its own set of five different `catch` clauses. Mixing \"figure out the partial-load object set\", \"instantiate objects\", and \"stream object data into already-instantiated objects\" in one function makes the partial-restore logic (`d->partialLoadObjects`) harder to follow and to test independently of full XML parsing.","fix":"Factor `readObjects()` into at least two functions: one that resolves `d->partialLoadObjects` from the `<ObjectDeps>` section (already close to being self-contained via the free function `loadDeps()`), and one that creates objects from the `<Objects>` section, with the `<ObjectData>` restore loop kept separate so each stage can be reasoned about and tested on its own.","locations":[{"ref":"src/App/Document.cpp:1559-1755","code":" 1559 | std::vector<DocumentObject*> Document::readObjects(Base::XMLReader& reader)\n 1560 | {\n 1561 |     d->touchedObjs.clear();\n 1562 |     bool keepDigits = testStatus(Document::KeepTrailingDigits);\n 1563 |     setStatus(Document::KeepTrailingDigits, !reader.doNameMapping());\n 1564 |     std::vector<DocumentObject*> objs;\n 1565 | \n 1566 | \n 1567 |     // read the object types\n 1568 |     reader.readElement(\"Objects\");\n 1569 |     int Cnt = static_cast<int>(reader.getAttribute<long>(\"Cou               if (!v.second) {\n 1610 |                     setStatus(Document::PartialDoc, true);\n 1611 |                     break;\n 1612 |                 }\n 1613 |             }\n 1614 |             if (!testStatus(Document::PartialDoc)) {\n 1615 |                 d->partialLoadObjects.clear();\n 1616 |             }\n 1617 |         }\n 1618 |     }\n 1619 | \n 1620 |     long lastId = 0;\n 1621 |     for (int i = 0; i < Cnt; i++) {\n 1622 |         reader.readElement(\"Object\");\n 1623 |         std::string type = reader.getAttribute<const char*>(\"type\");\n 1624 |         std::string name = reader.getAttribute<const char*>(\"name\");\n 1625 |         std::string viewType =\n 1626 |             reader.hasAttribute(\"ViewType\") ? reader.getAttribute<const char*>(\"ViewType\") : \"\";\n 1627 | \n 1628 |         bool partial = false;\n 1629 |         if (!d->partialLoadObjects.empty()) {\n 1630 |             auto it = d->partialLoadObjects.find(name);\n 1631 |             if (it == d->partialLoadObjects.end()) {\n 1632 |                 continue;\n 1633 |             }\n 1634 |             partial = !it->second;\n 1635 |         }\n 1636 | \n 1637 |         if (!testStatus(Status::Importing) && reader.hasAttribute(\"id\")) {\n 1638 |             // if not importing, then temporary reset lastObjectId and make the\n 1639 |             // following addObject() generate the correct id for this object.\n 1640 |             d->lastObjectId = reader.getAttribute<long>(\"id\") - 1;\n 1641 |         }\n 1642 | \n 1643 |         // To prevent duplicate name when export/import of objects from\n 1644 |         // external documents, we append those external object name with\n 1645 |         // @<document name>. Before importing (here means we are called by\n 1646 |         // importObjects), we shall strip the postfix. What the caller\n 1647 |         // (MergeDocument) sees is still the unstripped name mapped to a new\n 1648 |         // internal name, and the rest of {"id":"OTHER_1","type":"other","type_label":"Other","severity":"high","difficulty":"hard","description":"`IndexedName::set()` uses a function-local `static std::unordered_set<ByteArray, ByteArrayHasher> NameSet` (declared in `IndexedName.cpp`) that is mutated via `NameSet.insert(...)` on every call made with `allowOthers == true` (the default for the `(const char*, int)` constructor path). There is no mutex or other synchronization protecting this shared, mutable, function-static container. `IndexedName`/`MappedName`/element-naming machinery is used throughout the geometry/recompute pipeline, and FreeCAD's own `MainThreadSignal.h` explicitly documents that \"recompute can run on a worker thread\" while other code executes concurrently. If `IndexedName::set()` is ever invoked concurrently from more than one thread (e.g. parallel shape processing, or a background recompute racing with UI-triggered code that also builds `IndexedName`s), the concurrent, unsynchronized `insert()` calls into the same `std::unordered_set` constitute a data race that can corrupt the hash table and crash or corrupt memory.","fix":"Guard the shared `NameSet` with a mutex (e.g. `std::mutex`) around the `insert()` call in `IndexedName::set()`, or switch to a thread-safe interning structure (e.g. a concurrent hash map, or per-thread caches merged under a lock) so that `IndexedName` construction is safe to call from multiple threads.","locations":[{"ref":"src/App/IndexedName.cpp:82","code":"   82 |     static std::unordered_set<ByteArray, ByteArrayHasher> NameSet;","lines":1,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/IndexedName.cpp#L82"},{"ref":"src/App/IndexedName.cpp:114-121","code":"  114 |     if (allowOthers) {\n  115 |         auto res = NameSet.insert(ByteArray(QByteArray::fromRawData(name, suffixPosition)));\n  116 |         if (res.second /*The insert succeeded (the type was new)*/) {\n  117 |             // Make sure that the data in the set is a unique (unshared) copy of the text\n  118 |             res.first->ensureUnshared();\n  119 |         }\n  120 |         this->type = res.first->bytes.constData();\n  121 |     }","lines":8,"link":"https://github.com/FreeCAD/FreeCAD/blob/6a0f9980ec5f4f807ff14374837107c71538d497/src/App/IndexedName.cpp#L114-L121"}]},
{"id":"OTHER_2","type":"other","type_label":"Other","severity":"medium","difficulty":"medium","description":"`Document::exportObjects()` uses a process-wide `static DocExportStatus exportStatus;` guarded by the RAII helper `DocumentExporting`, whose constructor does `exportStatus.status = Document::Exporting; exportStatus.objs.insert(objs.begin(), objs.end());` and whose destructor unconditionally does `exportStatus.status = Document::NotExporting; exportStatus.objs.clear();`. The accompanying comment even says exports \"from multiple documents at the same time\" are expected to be supported. But because the destructor resets/clears the shared state unconditionally rather than reference-counting or subtracting only its own contribution, any nested or concurrent `exportObjects()` call (e.g. one export triggering another as a side effect of `signalExportObjects`/property `Save()`, or two threads exporting simultaneously) will have the first `DocumentExporting` to be destroyed wipe out `exportStatus` for the still-in-progress outer/other export. Subsequent calls to `Document::isExporting()` from the still-running export will then incorrectly report `NotExporting`, and `exportStatus.objs` will no longer contain the objects that are genuinely still being exported.","fix":"Track nested/concurrent exports with a reference count and only remove this call's own objects instead of clearing everything, e.g. keep a `std::multiset` (or a per-object refcount map) so `~DocumentExporting()` erases only the objects/refs it added and only resets `status` to `Document::NotExporting` when the last outstanding `DocumentExporting` instance is destroyed.","locations":[{"ref":"src/App/Document.cpp:1289-1312","code":" 1289 | struct DocExportStatus\n 1290 | {\n 1291 |     Document::ExportStatus status;\n 1292 |     std::set<const DocumentObject*> objs;\n 1293 | };\n 1294 | \n 1295 | static DocExportStatus exportStatus;\n 1296 | \n 1297 | // Exception-safe exporting status setter\n 1298 | cla {"id":"OTHER_3","type":"other","type_label":"Other","severity":"medium","difficulty":"hard","description":"`MainThreadSignalConfig` stores its `IsMainThreadFn`/`InvokeFn` hooks in plain (non-atomic) function-pointer statics (`isMainThreadSlot()`, `invokeSlot()`), written by `setHooks()` and read by `isMainThread()`/`hasHooks()`/`invoke()` with no synchronization at all. The class's own comment states these signals exist precisely because \"recompute can run on a worker thread\" while GUI code runs concurrently on the main thread, i.e. this is explicitly documented as a multi-threaded usage pattern. A worker thread calling `MainThreadSignal::emit()` (which reads the hooks via `MainThreadSignalConfig::isMainThread()`/`invoke()`) concurrently with `Gui` code calling `setHooks()` (e.g. during startup/shutdown or re-initialization) is a data race on plain pointer variables, which is undefined behavior under the C++ memory model even though it will often appear to \"work\" in practice on strongly-ordered hardware.","fix":"Store the hooks in `std::atomic<IsMainThreadFn>` / `std::atomic<InvokeFn>` and use `load()`/`store()` (e.g. with `memory_order_acquire`/`memory_order_release`) instead of plain pointer reads/writes, so concurrent calls to `setHooks()` and `isMainThread()`/`invoke()` are well-defined.","locations":[{"ref":"src/App/MainThreadSignal.h:51-89","code":"   51 |     static void setHooks(IsMainThreadFn isMainThread, InvokeFn invoke)\n   52 |     {\n   53 |         isMainThreadSlot() = isMainThread;\n   54 |         invokeSlot() = invoke;\n   55 |     }\n   56 | \n   57 |     static inline bool isMainThread()\n   58 |     {\n   59 |         auto* f = isMainThreadSlot();\n   60 |         return f ? f() : true;  // no hooks, treat current thread as \"main\"\n   61 |     }\n   62 | \n   63 |     static inline bool hasHooks()\n   64 |     {\n   65 |         return isMainThreadSlot() && invokeSlot();\n   66 |     }\n   67 | \n   68 |     static inline void invoke(std::
