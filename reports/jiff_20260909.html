{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"A large block of commented-out code for a hypothetical `Date::new_unchecked` constructor (`crates/jiff/src/civil/date.rs:263-281`) is left in the file inside a `/* ... */` comment. It is stale: it references `Date { year, month, day }` struct-literal construction and `b::Year::checkc(...)`/`b::Month::checkc(...)`/`b::Day::checkc(...)` methods, but the actual `Date` struct (declared at `date.rs:171-173`) only has a single field `inner: JDate`, so this code would not even compile if uncommented. Dead, misleading commented-out code like this should be removed rather than kept around as documentation.","fix":"Delete the commented-out `new_unchecked` block entirely (or, if the intent to add such a constructor is still live, replace it with a tracking issue reference instead of stale code that no longer matches the current `Date` struct layout):\n```rust\n    /*\n    /// Like `Date::new`, but does not checking on the values given when\n    ...\n    Date { year, month, day }\n    }\n    */\n```","locations":[{"ref":"crates/jiff/src/civil/date.rs:264-282","code":"  264 |     /*\n  265 |     /// Like `Date::new`, but does not checking on the values given when\n  266 |     /// `debug_assertions` aren't enabled.\n  267 |     ///\n  268 |     /// This is useful in contexts where the values are known to be valid.\n  269 |     ///\n  270 |     /// NOTE: It's important that this is not made public without careful\n  271 |     /// consideration. In particular, if it's public, it probably shouldn't\n  272 |     /// be safe to call so that callers can rely on the ranges of methods\n  273 |     /// like `Date::{year,month,day}`.\n  274 |     #[inline]\n  275 |     const fn new_unchecked(year: i16, month: i8, day: i8) -> Date {\n  276 |         debug_assert!(b::Year::checkc(year as i64).is_ok());\n  277 |         debug_assert!(b::Month::checkc(month as i64).is_ok());\n  278 |         debug_assert!(b::Day::checkc(day as i64).is_ok());\n  279 |         debug_assert!(day <= jcore::civil::days_in_month(year, month));\n  280 |         Date { year, month, day }\n  281 |     }\n  282 |     */","lines":19,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/civil/date.rs#L264-L282"}]},
{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"In `crates/jiff/src/tz/db/mod.rs`, `TimeZoneDatabase::from_dir` (lines 354-367) calls `zoneinfo::Database::from_dir(path)?` and then checks `if db.is_definitively_empty()` to emit a warning (lines 360-365) about not finding zoneinfo data. However, `zoneinfo::Database::from_dir` (in `crates/jiff/src/tz/db/zoneinfo/enabled.rs`, lines 76-80) only ever returns `Ok` after `ZoneInfoNames::new(dir)?` succeeds (line 77), and `ZoneInfoNames::new` (lines 411-418) itself only succeeds when `walk(dir)?` (line 412) returns a non-empty `Vec<ZoneInfoName>` — `walk` (lines 721-841) explicitly returns `Err` whenever it finds zero names (lines 829-833; the function's own doc comment at lines 703-704 states \"`Ok(vec![])` is an impossible result\"). Since `zoneinfo::Database::is_definitively_empty()` (line 193-195) only checks `self.names.is_none()`, and `from_dir` always constructs `Database` with `names: Some(...)` on success, `db.is_definitively_empty()` can never be `true` after a successful `zoneinfo::Database::from_dir` call. The warning branch at lines 360-365 of `db/mod.rs` is therefore dead code that can never execute; any directory without a valid TZif file will already have caused the `?` at line 359 to return an `Err` before this check is even reached.","fix":"Remove the unreachable `is_definitively_empty()` check (or, if the intent was to also warn on a *partially* empty result, that would need to be signaled differently by `zoneinfo::Database::from_dir` itself, since as written the `Result` already fully captures the \"no data found\" case):\n\n```rust\n#[cfg(feature = \"std\")]\npub fn from_dir<P: AsRef<std::path::Path>>(\n    path: P,\n) -> Result<TimeZoneDatabase, Error> {\n    let path = path.as_ref();\n    let db = zoneinfo::Database::from_dir(path)?;\n    Ok(TimeZoneDatabase::new(Kind::ZoneInfo(db)))\n}\n```","locations":[{"ref":"crates/jiff/src/tz/db/mod.rs:354-367","code":"  354 |     #[cfg(feature = \"std\")]\n  355 |     pub fn from_dir<P: AsRef<std::path::Path>>(\n  356 |         path: P,\n  357 |     ) -> Result<TimeZoneDatabase, Error> {\n  358 |         let path = path.as_ref();\n  359 |         let db = zoneinfo::Database::from_dir(path)?;\n  360 |         if db.is_definitively_empty() {\n  361 |             warn!(\n  362 |                 \"could not find zoneinfo data at directory {path}\",\n  363 |                 path = path.display(),\n  364 |             );\n  365 |         }\n  366 |         Ok(TimeZoneDatabase::new(Kind::ZoneInfo(db)))\n  367 |     }","lines":14,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/tz/db/mod.rs#L354-L367"}]},
{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`parse_datetime_offset` starts with `let input = input.as_ref();`, but `input` is already typed `&'i [u8]`, and `<&[u8] as AsRef<[u8]>>::as_ref` on a `&[u8]` just returns the same slice. The call is a no-op rebinding that adds nothing and slightly obscures that `input` never changes type here (every other parsing method in this file takes `&'i [u8]` directly without this extra indirection).","fix":"Drop the redundant call:\n```rust\nfn parse_datetime_offset<'i>(\n    &self,\n    input: &'i [u8],\n) -> Result<Parsed<'i, (DateTime, Offset)>, Error> {\n    let Parsed { value: dt, input } = self.parse_datetime(input)?;\n    ...\n```","locations":[{"ref":"crates/jiff/src/fmt/rfc2822.rs:402-406","code":"  402 |     fn parse_datetime_offset<'i>(\n  403 |         &self,\n  404 |         input: &'i [u8],\n  405 |     ) -> Result<Parsed<'i, (DateTime, Offset)>, Error> {\n  406 |         let input = input.as_ref();","lines":5,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/fmt/rfc2822.rs#L402-L406"}]},
{"id":"DEAD_6","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"In `DateTimeParser::parse_offset_obsolete`, the check `if len == 0 { return Err(Error::from(E::WhitespaceAfterTimeForObsoleteOffset)); }` is unreachable given the invariants established by its only caller, `parse_offset`. `parse_offset` is only ever invoked from `parse_datetime_offset` immediately after `parse_datetime` returns, and `parse_datetime`'s final step (parsing seconds, or the no-seconds branch) always fully consumes any trailing whitespace via `skip_whitespace`/`parse_whitespace` before control reaches `parse_offset`. Inside `parse_offset` itself, an empty remaining input is separately rejected via `input.get(0).copied().ok_or(E::EndOfInputOffset)?` before ever calling `parse_offset_obsolete`. So by the time `parse_offset_obsolete`'s scanning loop runs, `input[0]` is guaranteed to be both present and non-whitespace, meaning the loop body always executes at least once and `len` can never be `0` when the `if len == 0` check is reached. Even without this early check, an empty `letters` slice would still correctly fall through to `Err(E::InvalidObsoleteOffset)` in the trailing `match`, so the branch is both unreachable and functionally redundant.","fix":"Either remove the dead branch (relying on the existing catch-all `Err(E::InvalidObsoleteOffset)` for an empty `name` slice), or, if it is meant as defense-in-depth against future refactors of the caller, add a comment explaining that it currently cannot be hit so a future maintainer doesn't waste time trying to construct a test case for it:\n```rust\n// Currently unreachable: `parse_offset` guarantees `input` is non-empty\n// and does not start with whitespace before calling this function, since\n// `parse_datetime` fully consumes trailing whitespace and `parse_offset`\n// separately handles an empty remainder via `E::EndOfInputOffset`. Kept as\n// a defensive check in case that invariant changes.\nif len == 0 {\n    return Err(Error::from(E::WhitespaceAfterTimeForObsoleteOffset));\n}\n```","locations":[{"ref":"crates/jiff/src/fmt/rfc2822.rs:740-755","code":"  740 |     fn parse_offset_obsolete<'i>(\n  741 |         &self,\n  742 |         input: &'i [u8],\n  743 |     ) -> Result<Parsed<'i, Offset>, Error> {\n  744 |         let mut letters = [0; 5];\n  745 |         let mut len = 0;\n  746 |         while len <= 4\n  747 |             && !input[len..].is_empty()\n  748 |             && !is_whitespace(input[len])\n  749 |         {\n  750 |             letters[len] = input[len].to_ascii_lowercase();\n  751 |             len += 1;\n  752 |         }\n  753 |         if len == 0 {\n  754 |             return Err(Error::from(E::WhitespaceAfterTimeForObsoleteOffset));\n  755 |         }","lines":16,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/fmt/rfc2822.rs#L740-L755"}]},
{"id":"DEAD_7","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`impl<'a> From<&'a Zoned> for BrokenDownTime` in `crates/jiff/src/fmt/strtime/mod.rs:3189` contains a leftover commented-out line `// let offset_info = zdt.time_zone().to_offset_info(zdt.timestamp());` at `crates/jiff/src/fmt/strtime/mod.rs:3190` that is never used and serves no documentation purpose.","fix":"Remove the dead commented-out line `// let offset_info = zdt.time_zone().to_offset_info(zdt.timestamp());`.","locations":[{"ref":"crates/jiff/src/fmt/strtime/mod.rs:3190","code":" 3190 |         // let offset_info = zdt.time_zone().to_offset_info(zdt.timestamp());","lines":1,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/fmt/strtime/mod.rs#L3190"}]},
{"id":"DEAD_8","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `crates/jiff/src/tz/db/zoneinfo/disabled.rs` (the stub used when the `tzdb-zoneinfo` feature is disabled), `Database::none()` (lines 21-23) mirrors the enabled implementation's `none()` constructor, but unlike the enabled version (`crates/jiff/src/tz/db/zoneinfo/enabled.rs:83-88`, whose `none()` is actually called from `from_env` at line 73 as a fallback), nothing in the codebase ever calls `disabled::Database::none()`. `from_env` in `disabled.rs` (lines 7-9) just returns `Database` directly without going through `none()`. This makes `none()` in `disabled.rs` unreachable/unused code, existing only to keep the two `inner` module implementations' surfaces superficially symmetric.","fix":"Either remove the unused `none()` associated function from `disabled.rs`, or, if it's kept purely to mirror the `enabled.rs` API surface intentionally, mark it `#[allow(dead_code)]` with a short comment explaining why it's kept even though it's currently unreachable.","locations":[{"ref":"crates/jiff/src/tz/db/zoneinfo/disabled.rs:21-23","code":"   21 |     pub(crate) fn none() -> Database {\n   22 |         Database\n   23 |     }","lines":3,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/tz/db/zoneinfo/disabled.rs#L21-L23"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"In `crates/jiff-core/src/civil/date.rs`, the doc comments on `ISOWeekDate::MIN` and `ISOWeekDate::MAX` are swapped: `MIN` is documented as `\"The maximum representable ISO week date.\"` and `MAX` is documented as `\"The minimum representable ISO week date.\"`. The field values themselves are correct (`MIN` really is the minimum and `MAX` really is the maximum), only the doc text is backwards, which will mislead anyone reading the generated documentation.","fix":"Swap the two doc comments so each constant's description matches its actual value:\n\n```rust\n/// The minimum representable ISO week date.\npub const MIN: ISOWeekDate = ISOWeekDate {\n    year: b::ISOYear::MIN,\n    week: b::ISOWeek::MIN,\n    weekday: Weekday::Monday,\n};\n\n/// The maximum representable ISO week date.\npub const MAX: ISOWeekDate = ISOWeekDate {\n    year: b::ISOYear::MAX,\n    // Technical max is 52, but 9999 is not a leap year.\n    week: 52,\n    weekday: Weekday::Friday,\n};\n```","locations":[{"ref":"crates/jiff-core/src/civil/date.rs:992-1005","code":"  992 |     /// The maximum representable ISO week date.\n  993 |     pub const MIN: ISOWeekDate = ISOWeekDate {\n  994 |         year: b::ISOYear::MIN,\n  995 |         week: b::ISOWeek::MIN,\n  996 |         weekday: Weekday::Monday,\n  997 |     };\n  998 | \n  999 |     /// The minimum representable ISO week date.\n 1000 |     pub const MAX: ISOWeekDate = ISOWeekDate {\n 1001 |         year: b::ISOYear::MAX,\n 1002 |         // Technical max is 52, but 9999 is not a leap year.\n 1003 |         week: 52,\n 1004 |         weekday: Weekday::Friday,\n 1005 |     };","lines":14,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff-core/src/civil/date.rs#L992-L1005"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comments on `ISOWeekDate::MIN` and `ISOWeekDate::MAX` have their \"minimum\"/\"maximum\" wording swapped, making each comment self-contradictory. `ISOWeekDate::MIN` is documented as \"The maximum representable ISO week date... the maximum [`Date`] value. That is, `-9999-01-01`\", even though `-9999-01-01` is `Date::MIN` (confirmed at `crates/jiff/src/civil/date.rs:182`), not the maximum. Likewise `ISOWeekDate::MAX` is documented as \"The minimum representable ISO week date... the minimum [`Date`] value. That is, `9999-12-31`\", even though `9999-12-31` is `Date::MAX`. The literal date values shown are correct for each constant, only the \"minimum\"/\"maximum\" prose is inverted, which is misleading to anyone reading the rendered docs.","fix":"Swap the \"minimum\"/\"maximum\" wording so it matches the constant being documented and the date value quoted:\n\n```rust\n// Before:\n/// The maximum representable ISO week date.\n///\n/// The maximum corresponds to the ISO week date of the maximum [`Date`]\n/// value. That is, `-9999-01-01`.\npub const MIN: ISOWeekDate = ISOWeekDate { inner: JISOWeekDate::MIN };\n\n/// The minimum representable ISO week date.\n///\n/// The minimum corresponds to the ISO week date of the minimum [`Date`]\n/// value. That is, `9999-12-31`.\npub const MAX: ISOWeekDate = ISOWeekDate { inner: JISOWeekDate::MAX };\n\n// After:\n/// The minimum representable ISO week date.\n///\n/// The minimum corresponds to the ISO week date of the minimum [`Date`]\n/// value. That is, `-9999-01-01`.\npub const MIN: ISOWeekDate = ISOWeekDate { inner: JISOWeekDate::MIN };\n\n/// The maximum representable ISO week date.\n///\n/// The maximum corresponds to the ISO week date of the maximum [`Date`]\n/// value. That is, `9999-12-31`.\npub const MAX: ISOWeekDate = ISOWeekDate { inner: JISOWeekDate::MAX };\n```","locations":[{"ref":"crates/jiff/src/civil/iso_week_date.rs:163-173","code":"  163 |     /// The maximum representable ISO week date.\n  164 |     ///\n  165 |     /// The maximum corresponds to the ISO week date of the maximum [`Date`]\n  166 |     /// value. That is, `-9999-01-01`.\n  167 |     pub const MIN: ISOWeekDate = ISOWeekDate { inner: JISOWeekDate::MIN };\n  168 | \n  169 |     /// The minimum representable ISO week date.\n  170 |     ///\n  171 |     /// The minimum corresponds to the ISO week date of the minimum [`Date`]\n  172 |     /// value. That is, `9999-12-31`.\n  173 |     pub const MAX: ISOWeekDate = ISOWeekDate { inner: JISOWeekDate::MAX };","lines":11,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/civil/iso_week_date.rs#L163-L173"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"In `crates/jiff/src/fmt/buffer.rs`, the doc comments for `BorrowedBuffer::write_int`, `BorrowedBuffer::write_int_pad0` and `BorrowedBuffer::write_int_pad` all say `\"Writes the given `u8` integer ...\"`, but the actual parameter type is `n: impl Into<u64>`, i.e. any integer convertible to `u64` (the crate's own test suite calls `write_int(u64::MAX)`). The corresponding `.expect(...)` panic messages inside these same three functions likewise say `\"u8 integer digits exceeds available buffer space\"`, which is misleading at runtime if the panic is ever triggered by a large (non-`u8`) value. By contrast, the sibling methods `write_int1`, `write_int_pad2`, `write_int_pad2_space` and `write_int_pad4` correctly describe their parameter as just `\"the given integer\"`. This looks like a leftover from an earlier, `u8`-specific version of the API that was generalized to `impl Into<u64>` without updating the docs/panic text.","fix":"Update the three doc comments and their `.expect(...)` messages to not claim the value is a `u8`. For example, for `write_int`:\n\n```rust\n/// Writes the given integer to this buffer. No padding is performed.\n///\n/// # Panics\n///\n/// When the available space is insufficient to encode the number of\n/// digits in the decimal representation of `n`.\npub(crate) fn write_int(&mut self, n: impl Into<u64>) {\n    ...\n    let available = self\n        .available()\n        .get_mut(..remaining_digits)\n        .expect(\"integer digits exceed available buffer space\");\n    ...\n}\n```\n\nApply the same wording fix (doc comment + `.expect(...)` string) to `write_int_pad0` and `write_int_pad`.","locations":[{"ref":"crates/jiff/src/fmt/buffer.rs:246-260","code":"  246 |     /// Writes the given `u8` integer to this buffer. No padding is performed.\n  247 |     ///\n  248 |     /// # Panics\n  249 |     ///\n  250 |     /// When the available space is insufficient to encode the number of\n  251 |     /// digits in the decimal representation of `n`.\n  252 |     #[cfg_attr(feature = \"perf-inline\", inline(always))]\n  253 |     pub(crate) fn write_int(&mut self, n: impl Into<u64>) {\n  254 |         let mut n = n.into();\n  255 |         let digits = digits(n);\n  256 |         let mut remaining_digits = usize::from(digits);\n  257 |         let available = self\n  258 |             .available()\n  259 |             .get_mut(..remaining_digits)\n  260 |             .expect(\"u8 integer digits exceeds available buffer space\");","lines":15,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/fmt/buffer.rs#L246-L260"},{"ref":"crates/jiff/src/fmt/buffer.rs:275-297","code":"  275 |     /// Writes the given `u8` integer to this buffer using the given padding.\n  276 |     ///\n  277 |     /// The maximum allowed padding is `20`. Any values bigger than that are\n  278 |     /// silently clamped to `20`.\n  279 |     ///\n  280 |     /// This always pads with zeroes.\n  281 |     ///\n  282 |     /// # Panics\n  283 |     ///\n  284 |     /// When the available space is insufficient to encode the number of\n  285 |     /// digits in the decimal representation of `n`.\n  286 |     ///\n  287 |     /// This also panics when `pad_byte` is not ASCII.\n  288 |     #[cfg_attr(feature = \"perf-inline\", inline(always))]\n  289 |     pub(crate) fn write_int_pad0(&mut self, n: impl Into<u64>, pad_len: u8) {\n  290 |         let mut n = n.into();\n  291 |         let pad_len = pad_len.min(MAX_INTEGER_LEN);\n  292 |         let digits = pad_len.max(digits(n));\n  293 |         let mut remaining_digits = usize::from(digits);\n  294 |         let available = self\n  295 |             .available()\n  296 |             .get_mut(..remaining_digits)\n  297 |             .expect(\"u8 integer digits exceeds available buffer space\");","lines":23,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/fmt/buffer.rs#L275-L297"},{"ref":"crates/jiff/src/fmt/buffer.rs:312-339","code":"  312 |     /// Writes the given `u8` integer to this buffer using the given padding.\n  313 |     ///\n  314 |     /// The maximum allowed padding is `20`. Any values bigger than that are\n  315 |     /// silently clamped to `20`.\n  316 |     ///\n  317 |     /// # Panics\n  318 |     ///\n  319 |     /// When the available space is insufficient to encode the number of\n  320 |     /// digits in the decimal representation of `n`.\n  321 |     ///\n  322 |     /// This also panics when `pad_byte` is not ASCII.\n  323 |     #[cfg_attr(feature = \"perf-inline\", inline(always))]\n  324 |     pub(crate) fn write_int_pad(\n  325 |         &mut self,\n  326 |         n: impl Into<u64>,\n  327 |         pad_byte: u8,\n  328 |         pad_len: u8,\n  329 |     ) {\n  330 |         assert!(pad_byte.is_ascii(), \"padding byte must be ASCII\");\n  331 | \n  332 |         let mut n = n.into();\n  333 |         let pad_len = pad_len.min(MAX_INTEGER_LEN);\n  334 |         let digits = pad_len.max(digits(n));\n  335 |         let mut remaining_digits = usize::from(digits);\n  336 |         let available = self\n  337 |             .available()\n  338 |             .get_mut(..remaining_digits)\n  339 |             .expect(\"u8 integer digits exceeds available buffer space\");","lines":28,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/fmt/buffer.rs#L312-L339"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The doc comment on the `Repr` struct (`crates/jiff/src/tz/timezone.rs:2097-2101`) says: \"We use the lower 4 bits of a pointer to indicate which variant we have.\" But the actual implementation uses only 3 bits: `const BITS: usize = 0b111;` (line 2107) and `tag()` computes `self.ptr.addr() & Repr::BITS` (line 2309), i.e. a 3-bit mask covering values `0..=7`. The 6 variant tags (`UTC=1`, `UNKNOWN=2`, `FIXED=3`, `STATIC_TZIF=0`, `ARC_TZIF=4`, `ARC_POSIX=5`) all fit in 3 bits. `Repr::ALIGN` is set to `8` (i.e. `2^3`), which is consistent with a 3-bit tag, not a 4-bit one. This is unsafe, pointer-tagging code where precise bit-width reasoning matters for future maintainers; the comment should match the actual `BITS`/`ALIGN` constants used.","fix":"Update the doc comment to say \"the lower 3 bits\" (matching `Repr::BITS = 0b111` and `Repr::ALIGN = 8`), e.g.:\n```rust\n/// We achieve this through pointer tagging and careful use of a strict\n/// provenance polyfill (because of MSRV). We use the lower 3 bits of a\n/// pointer to indicate which variant we have. This is sound because we\n/// require all types that we allocate for to have a minimum alignment of\n/// 8 bytes.\n```","locations":[{"ref":"crates/jiff/src/tz/timezone.rs:2125-2129","code":" 2125 |     /// We achieve this through pointer tagging and careful use of a strict\n 2126 |     /// provenance polyfill (because of MSRV). We use the lower 4 bits of a\n 2127 |     /// pointer to indicate which variant we have. This is sound because we\n 2128 |     /// require all types that we allocate for to have a minimum alignment of\n 2129 |     /// 8 bytes.","lines":5,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/tz/timezone.rs#L2125-L2129"},{"ref":"crates/jiff/src/tz/timezone.rs:2135","code":" 2135 |         const BITS: usize = 0b111;","lines":1,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/tz/timezone.rs#L2135"},{"ref":"crates/jiff/src/tz/timezone.rs:2148","code":" 2148 |         const ALIGN: usize = 8;","lines":1,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/tz/timezone.rs#L2148"}]},
{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The crate-level doc comment in `crates/jiff-diesel/src/lib.rs:68` has a typo: it says `` **sqlite** - Enables `disel/sqlite`. `` instead of `` **sqlite** - Enables `diesel/sqlite`. ``. `disel` is not a real crate/feature name, which could confuse readers of the rustdoc.","fix":"```rust\n// Before:\n/// * **sqlite** - Enables `disel/sqlite`.\n\n// After:\n/// * **sqlite** - Enables `diesel/sqlite`.\n```","locations":[{"ref":"crates/jiff-diesel/src/lib.rs:68","code":"   68 | * **sqlite** - Enables `disel/sqlite`.","lines":1,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff-diesel/src/lib.rs#L68"}]},
{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"Typo in a comment in `crates/jiff-sqlx/src/postgres.rs:110`: `` \"but respects it correctl so\" `` should be `` \"but respects it correctly so\" ``.","fix":"```rust\n// Before:\n// This does swallow the offset (but respects it correctl so\n\n// After:\n// This does swallow the offset (but respects it correctly so\n```","locations":[{"ref":"crates/jiff-sqlx/src/postgres.rs:110","code":"  110 |                 // This does swallow the offset (but respects it correctl so","lines":1,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff-sqlx/src/postgres.rs#L110"}]},
{"id":"CMT_7","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"Doc comments for `Date::days_in_month` and `Date::days_in_year` both contain the duplicated-word typo \"the the\": \"Returns the total number of days in `the the` month in which this date resides.\" and \"Returns the total number of days in `the the` year in which this date resides.\"","fix":"Remove the duplicated word in both doc comments:\n```rust\n/// Returns the total number of days in the month in which this date\n/// resides.\n```\n```rust\n/// Returns the total number of days in the year in which this date\n/// resides.\n```","locations":[{"ref":"crates/jiff/src/civil/date.rs:613","code":"  613 |     /// Returns the total number of days in the the month in which this date","lines":1,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/civil/date.rs#L613"},{"ref":"crates/jiff/src/civil/date.rs:668","code":"  668 |     /// Returns the total number of days in the the year in which this date","lines":1,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/civil/date.rs#L668"}]},
{"id":"CMT_8","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"A doc example in `Time::duration_until`'s documentation has a stray double semicolon: `` let dur = Duration::try_from(t1.duration_until(t2))?;; `` in `crates/jiff/src/civil/time.rs`. It compiles fine (an extra empty statement), but it's a copy-paste artifact that shouldn't be in the published rustdoc example.","fix":"```rust\n// before\n/// let dur = Duration::try_from(t1.duration_until(t2))?;;\n\n// after\n/// let dur = Duration::try_from(t1.duration_until(t2))?;\n```","locations":[{"ref":"crates/jiff/src/civil/time.rs:1358","code":" 1358 |     /// let dur = Duration::try_from(t1.duration_until(t2))?;;","lines":1,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/civil/time.rs#L1358"}]},
{"id":"CMT_9","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"In `SpanPrinter::print_duration_hms` (`crates/jiff/src/fmt/friendly/printer.rs:1539-1546`), three separate `u64` computations are each preceded by the comment `// OK because guaranteed to be bigger than i64::MIN.`:\n```rust\nlet mut secs = udur.as_secs();\n// OK because guaranteed to be bigger than i64::MIN.\nlet hours = secs / (MINS_PER_HOUR * SECS_PER_MIN);\nsecs %= MINS_PER_HOUR * SECS_PER_MIN;\n// OK because guaranteed to be bigger than i64::MIN.\nlet minutes = secs / SECS_PER_MIN;\n// OK because guaranteed to be bigger than i64::MIN.\nsecs = secs % SECS_PER_MIN;\n```\n`secs` here comes from `udur.as_secs()` where `udur: &core::time::Duration`, which is always an unsigned `u64` and can never be negative, so there is no `i64::MIN` overflow concern to guard against in the first place (an unsigned value is trivially \"bigger than `i64::MIN`\"). The comment reads like it was copy-pasted from unrelated code that handles a signed value (e.g. code guarding against negating/absolute-valuing `i64::MIN`), and provides no real justification for the arithmetic actually performed here. It is misleading to future readers trying to understand why these divisions/modulos are safe.","fix":"Remove the misleading comments (the arithmetic is unconditionally safe for unsigned `u64` division/modulo by a nonzero constant and needs no justification), e.g.:\n```rust\nlet mut secs = udur.as_secs();\nlet hours = secs / (MINS_PER_HOUR * SECS_PER_MIN);\nsecs %= MINS_PER_HOUR * SECS_PER_MIN;\nlet minutes = secs / SECS_PER_MIN;\nsecs %= SECS_PER_MIN;\n```","locations":[{"ref":"crates/jiff/src/fmt/friendly/printer.rs:1540-1545","code":" 1540 |         // OK because guaranteed to be bigger than i64::MIN.\n 1541 |         let hours = secs / (MINS_PER_HOUR * SECS_PER_MIN);\n 1542 |         secs %= MINS_PER_HOUR * SECS_PER_MIN;\n 1543 |         // OK because guaranteed to be bigger than i64::MIN.\n 1544 |         let minutes = secs / SECS_PER_MIN;\n 1545 |         // OK because guaranteed to be bigger than i64::MIN.","lines":6,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/fmt/friendly/printer.rs#L1540-L1545"}]},
{"id":"CMT_10","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The doc comment on `DurationUnits::to_unsigned_duration` (crates/jiff/src/fmt/util.rs:472-481) was copy-pasted from `to_signed_duration`'s doc comment and still says the error occurs when the total \"exceeds what can bit in a 96-bit signed integer\", but `to_unsigned_duration` returns an unsigned `core::time::Duration` (a 64-bit unsigned seconds count plus a 32-bit unsigned nanosecond count), not a signed value. The wording is misleading (and also carries the pre-existing \"bit\"/\"fit\" typo from the original comment it was copied from).","fix":"Reword the doc comment to describe `core::time::Duration`'s actual (unsigned) representation, e.g.:\n```rust\n/// If the total number of nanoseconds represented by all units combined\n/// exceeds what can fit in a `core::time::Duration` (a 64-bit unsigned\n/// second count plus a 32-bit nanosecond count), then an error is\n/// returned.\n```","locations":[{"ref":"crates/jiff/src/fmt/util.rs:476-478","code":"  476 |     /// If the total number of nanoseconds represented by all units combined\n  477 |     /// exceeds what can bit in a 96-bit signed integer, then an error is\n  478 |     /// returned.","lines":3,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/fmt/util.rs#L476-L478"}]},
{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"easy","description":"The `error::IntoError` + `From<Error> for error::Error` boilerplate (the `#[cold] #[inline(never)] fn from(err: Error) -> error::Error { error::ErrorKind::Xxx(err).into() }` plus `impl error::IntoError for Error { fn into_error(self) -> error::Error { self.into() } }` pair) is copy-pasted, essentially unchanged apart from the `ErrorKind` variant name, into nearly every error-kind file audited here: `crates/jiff/src/error/civil.rs`, `crates/jiff/src/error/duration.rs`, `crates/jiff/src/error/signed_duration.rs`, `crates/jiff/src/error/span.rs`, `crates/jiff/src/error/timestamp.rs`, `crates/jiff/src/error/fmt/mod.rs`, `crates/jiff/src/error/fmt/friendly.rs`, `crates/jiff/src/error/fmt/offset.rs`, `crates/jiff/src/error/fmt/rfc2822.rs`, `crates/jiff/src/error/fmt/rfc9557.rs`, `crates/jiff/src/error/fmt/temporal.rs`, `crates/jiff/src/error/fmt/util.rs`, `crates/jiff/src/error/fmt/strtime.rs` (three times, for `Error`, `ParseError` and `FormatError`), `crates/jiff/src/error/tz/ambiguous.rs`, and `crates/jiff/src/error/tz/concatenated.rs`. Each occurrence is ~12-13 lines, and there are 17+ occurrences in the audited files alone, well past the 25-line/2-file duplication threshold. Every time a new error kind is added, a contributor must hand-copy this pattern correctly (including the `#[cold]`/`#[inline(never)]` attributes and the matching `ErrorKind::Xxx` arm), which is exactly the kind of mechanical duplication a declarative macro exists to eliminate.","fix":"Extract the pattern into a small `macro_rules!` defined once in `crates/jiff/src/error/mod.rs` and invoke it from every error-kind file instead of hand-writing the impls:\n\n```rust\n// in error/mod.rs\nmacro_rules! impl_error_kind_conversion {\n    ($errty:ty, $variant:ident) => {\n        impl $crate::error::IntoError for $errty {\n            fn into_error(self) -> $crate::error::Error {\n                self.into()\n            }\n        }\n\n        impl From<$errty> for $crate::error::Error {\n            #[cold]\n            #[inline(never)]\n            fn from(err: $errty) -> $crate::error::Error {\n                $crate::error::ErrorKind::$variant(err).into()\n            }\n        }\n    };\n}\npub(crate) use impl_error_kind_conversion;\n```\n\nThen each file collapses to one line, e.g. in `error/civil.rs`:\n\n```rust\ncrate::error::impl_error_kind_conversion!(Error, Civil);\n```\n\nThis removes ~200 duplicated lines and makes adding a new error kind a one-line change instead of a 13-line copy-paste.","locations":[{"ref":"crates/jiff/src/error/civil.rs:18-30","code":"   18 | impl From<Error> for error::Error {\n   19 |     #[cold]\n   20 |     #[inline(never)]\n   21 |     fn from(err: Error) -> error::Error {\n   22 |         error::ErrorKind::Civil(err).into()\n   23 |     }\n   24 | }\n   25 | \n   26 | impl error::IntoError for Error {\n   27 |     fn into_error(self) -> error::Error {\n   28 |         self.into()\n   29 |     }\n   30 | }","lines":13,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/error/civil.rs#L18-L30"},{"ref":"crates/jiff/src/error/duration.rs:10-22","code":"   10 | impl From<Error> for error::Error {\n   11 |     #[cold]\n   12 |     #[inline(never)]\n   13 |     fn from(err: Error) -> error::Error {\n   14 |         error::ErrorKind::Duration(err).into()\n   15 |     }\n   16 | }\n   17 | \n   18 | impl error::IntoError for Error {\n   19 |     fn into_error(self) -> error::Error {\n   20 |         self.into()\n   21 |     }\n   22 | }","lines":13,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/error/duration.rs#L10-L22"},{"ref":"crates/jiff/src/error/signed_duration.rs:11-23","code":"   11 | impl From<Error> for error::Error {\n   12 |     #[cold]\n   13 |     #[inline(never)]\n   14 |     fn from(err: Err {"id":"DUP_2","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"`DateTimePrinter::print_civil_with_offset` (`crates/jiff/src/fmt/rfc2822.rs:1302-1341`) and `DateTimePrinter::print_civil_always_utc` (`crates/jiff/src/fmt/rfc2822.rs:1343-1372`) duplicate the entire negative-year guard (identical 5-line block, comment included, at lines 1309-1314 and 1349-1354) plus a near-identical 14-line sequence writing weekday/day/month/year/hour/minute/second (lines 1316-1329 vs 1356-1369), differing only in whether `day` is zero-padded (`write_int` vs `write_int_pad2`) and whether separators are written via `write_ascii_char` vs `write_str`. Roughly 19 lines of logic are duplicated between the two functions. Because the two copies are not literally identical (day padding differs by design), a future change to one (e.g. fixing a formatting bug, or adding a new field) can easily be applied to only one of the two functions, silently causing the RFC 2822 and RFC 9110 printers to drift out of sync in ways not caught by type-checking.","fix":"Factor the shared prefix into a helper parameterized on the two points of variance (day padding and separator writer), e.g.:\n```rust\nfn print_civil_common(\n    &self,\n    dt: DateTime,\n    pad_day: bool,\n    buf: &mut BorrowedBuffer<'_>,\n) -> Result<(), Error> {\n    if dt.year() < 0 {\n        // RFC 2822 actually says the year must be at least 1900, but\n        // other implementations (like Chrono) allow any positive 4-digit\n        // year.\n        return Err(Error::from(E::NegativeYear));\n    }\n    buf.write_str(weekday_abbrev(dt.weekday()));\n    buf.write_str(\", \");\n    if pad_day {\n        buf.write_int_pad2(dt.day().unsigned_abs());\n    } else {\n        buf.write_int(dt.day().unsigned_abs());\n    }\n    buf.write_ascii_char(b' ');\n    buf.write_str(month_name(dt.month()));\n    buf.write_ascii_char(b' ');\n    buf.write_int_pad4(dt.year().unsigned_abs());\n    buf.write_ascii_char(b' ');\n    buf.write_int_pad2(dt.hour().unsigned_abs());\n    buf.write_ascii_char(b':');\n    buf.write_int_pad2(dt.minute().unsigned_abs());\n    buf.write_ascii_char(b':');\n    buf.write_int_pad2(dt.second().unsigned_abs());\n    buf.write_ascii_char(b' ');\n    Ok(())\n}\n```\nand have `print_civil_with_offset`/`print_civil_always_utc` call it, then append their own offset/`GMT` suffix.","locations":[{"ref":"crates/jiff/src/fmt/rfc2822.rs:1302-1341","code":" 1302 |     #[inline(never)]\n 1303 |     fn print_civil_with_offset(\n 1304 |         &self,\n 1305 |         dt: DateTime,\n 1306 |         offset: Option<Offset>,\n 1307 |         buf: &mut BorrowedBuffer<'_>,\n 1308 |     ) -> Result<(), Error> {\n 1309 |         if dt.year() < 0 {\n 1310 |             // RFC 2822 actually says the year must be at least 1900, but\n 1311 |             // other implementations (like Chrono) allow any positive 4-digit\n 1312 |             // year.\n 1313 |             return Err(Error::from(E::NegativeYear));\n 1314 |         }\n 1315 | \n 1316 |         buf.write_str(weekday_abbrev(dt.weekday()));\n 1317 |         buf.write_str(\", \");\n 1318 |         buf.write_int(dt.day().unsigned_abs());\n 1319 |         buf.write_ascii_char(b' ');\n 1320 |         buf.write_str(month_name(dt.month()));\n 1321 |         buf.write_ascii_char(b' ');\n 1322 |         buf.write_int_pad4(dt.year().unsigned_abs());\n 1323 |         buf.write_ascii_char(b' ');\n 1324 |         buf.write_int_pad2(dt.hour().unsigned_abs());\n 1325 |         buf.write_ascii_char(b':');\n 1326 |         buf.write_int_pad2(dt.minute().unsigned_abs());\n 1327 |         buf.write_ascii_char(b':');\n 1328 |         buf.write_int_pad2(dt.second().unsigned_abs());\n 1329 |         buf.write_ascii_char(b' ');\n 1330 | \n 1331 |         let Some(offset) = offset else {\n 1332 |             buf.write_str(\"-0000\");\n 1333 |             return Ok(());\n 1334 |         };\n 1335 |         buf.write_a {"id":"DUP_3","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"easy","description":"`timestamp::second::Visitor`, `timestamp::millisecond::Visitor`, and `timestamp::microsecond::Visitor` (`crates/jiff/src/fmt/serde.rs:477-586`, `crates/jiff/src/fmt/serde.rs:644-756`, `crates/jiff/src/fmt/serde.rs:814-926`) each explicitly implement `visit_i8`, `visit_u8`, `visit_i16`, `visit_u16`, `visit_i32`, and `visit_u32`, all of which simply widen the value and forward to `visit_i64`/`self.visit_i64(i64::from(v))`. This exactly duplicates the default trait method bodies already provided by `serde_core::de::Visitor` (e.g. `fn visit_i8<E>(self, v: i8) -> Result<Self::Value, E> { self.visit_i64(v as i64) }`), so these ~30 lines per module (about 90 lines total) add no behavior and are pure boilerplate. This is confirmed by `timestamp::nanosecond::Visitor` (`crates/jiff/src/fmt/serde.rs:981-1035`), which only implements `visit_i64`, `visit_u64`, `visit_i128`, and `visit_u128` and correctly relies on the default trait forwarding for the smaller integer types, proving the extra overrides in the other three modules are unnecessary.","fix":"Delete the redundant `visit_i8`/`visit_u8`/`visit_i16`/`visit_u16`/`visit_i32`/`visit_u32` overrides from `second::Visitor`, `millisecond::Visitor`, and `microsecond::Visitor`, and rely on the default `serde_core::de::Visitor` trait methods (which already forward to `visit_i64`/`visit_u64`), the same way `nanosecond::Visitor` already does. This removes about 90 lines without changing behavior.","locations":[{"ref":"crates/jiff/src/fmt/serde.rs:497-606","code":"  497 |         struct Visitor;\n  498 | \n  499 |         impl<'de> de::Visitor<'de> for Visitor {\n  500 |             type Value = crate::Timestamp;\n  501 | \n  502 |             fn expecting(\n  503 |                 &self,\n  504 |                 f: &mut core::fmt::Formatter,\n  505 |             ) -> core::fmt::Result {\n  506 |                 f.wri {"id":"DUP_4","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"easy","description":"The `read()` function is implemented identically (modulo the unused `_db` parameter name) in four separate platform modules — it simply forwards to `super::read_unnamed_tzif_file(path)` and maps the result the same way:\n`crates/jiff/src/tz/system/android.rs:55-63`, `crates/jiff/src/tz/system/wasm_emscripten.rs:79-87`, `crates/jiff/src/tz/system/wasm_js.rs:49-57`, and `crates/jiff/src/tz/system/windows/mod.rs:69-77`. This is the same logic already provided as the generic fallback `read()` in `crates/jiff/src/tz/system/mod.rs:54-65` (the `mod sys { ... }` block used for unsupported platforms). Only `crates/jiff/src/tz/system/unix.rs:28-43` has genuinely different logic (it first tries `read_link_to_zoneinfo` before falling back to the same `read_unnamed_tzif_file` call). Four copies of the same trivial function increase the maintenance surface (e.g. a future change to error handling or logging in this path requires updating four call sites) for no behavioral benefit.","fix":"Factor the shared `read()` body into a single `pub(super) fn read` in `crates/jiff/src/tz/system/mod.rs` (next to `read_unnamed_tzif_file`), and have `android.rs`, `wasm_emscripten.rs`, `wasm_js.rs`, and `windows/mod.rs` either re-export it or simply not define their own `read()` at all (relying on a shared default), keeping only `unix.rs`'s `read()` as the platform-specific override, e.g.:\n\n```rust\n// in system/mod.rs\npub(super) fn read(_db: &TimeZoneDatabase, path: &str) -> Option<TimeZone> {\n    match read_unnamed_tzif_file(path) {\n        Ok(tz) => Some(tz),\n        Err(_err) => {\n            trace!(\"failed to read {path} as unnamed time zone: {_err}\");\n            None\n        }\n    }\n}\n```","locations":[{"ref":"crates/jiff/src/tz/system/android.rs:55-63","code":"   55 | pub(super) fn read(_db: &TimeZoneDatabase, path: &str) -> Option<TimeZone> {\n   56 |     match super::read_unnamed_tzif_file(path) {\n   57 |         Ok(tz) => Some(tz),\n   58 |         Err(_err) => {\n   59 |             trace!(\"failed to read {path} as unnamed time zone: {_err}\");\n   60 |             None\n   61 |         }\n   62 |     }\n   63 | }","lines":9,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/tz/system/android.rs#L55-L63"},{"ref":"crates/jiff/src/tz/system/wasm_emscripten.rs:79-87","code":"   79 | pub(super) fn read(_db: &TimeZoneDatabase, path: &str) -> Option<TimeZone> {\n   80 |     match super::read_unnamed_tzif_file(path) {\n   81 |         Ok(tz) => Some(tz),\n   82 |         Err(_err) => {\n   83 |             trace!(\"failed to read {path} as unnamed time zone: {_err}\");\n   84 |             None\n   85 |         }\n   86 |     }\n   87 | }","lines":9,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/tz/system/wasm_emscripten.rs#L79-L87"},{"ref":"crates/jiff/src/tz/system/wasm_js.rs:49-57","code":"   49 | pub(super) fn read(_db: &TimeZoneDatabase, path: &str) -> Option<TimeZone> {\n   50 |     match super::read_unnamed_tzif_file(path) {\n   51 |         Ok(tz) => Some(tz),\n   52 |         Err(_err) => {\n   53 |             trace!(\"failed to read {path} as unnamed time zone: {_err}\");\n   54 |             None\n   55 |         }\n   56 |     }\n   57 | }","lines":9,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/tz/system/wasm_js.rs#L49-L57"},{"ref":"crates/jiff/src/tz/system/windows/mod.rs:69-77","code":"   69 | pub(super) fn read(_db: &TimeZoneDatabase, path: &str) -> Option<TimeZone> {\n   70 |     match super::read_unnamed_tzif_file(path) {\n   71 |         Ok(tz) => Some(tz),\n   72 |         Err(_err) => {\n   73 |             trace!(\"failed to read {path} as unnamed time zone: {_err}\");\n   74 |             None\n   75 |         }\n   76 |     } {"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"medium","difficulty":"medium","description":"In `crates/jiff/src/tz/db/zoneinfo/enabled.rs`, several code paths perform blocking file-system I/O while holding an exclusive (`write()`) lock that guards *all* concurrent time zone lookups for a `TimeZoneDatabase`:\n1. `Database::get` (lines 143-184) acquires `self.zones.write().unwrap()` at line 143 and then, on a cache miss or failed revalidation, calls `CachedTimeZone::new` (lines 154 and 169), which internally does `File::open` and `file.read_to_end` (lines 270-274) — all while the write lock on the *entire* `zones` cache is held. Any other thread calling `get()` for a *different, already-cached and unexpired* time zone will still block on the `self.zones.read()`/`write()` lock until the disk I/O for the current lookup completes.\n2. `ZoneInfoNames::get` (lines 425-436) and `ZoneInfoNames::available` (lines 440-444) acquire `self.inner.write().unwrap()` and then call `attempt_refresh()` → `refresh()` (lines 480-507), which performs a full recursive directory walk (`walk(&self.dir)`, doing a `read_dir()` syscall per directory) while holding that same write lock.\n3. `ZoneInfoNamesInner::available` (lines 465-472) iterates over every name and calls `is_valid()` (lines 585-601) → `is_valid_impl()` (lines 622-652), which does a `File::open` plus a 4-byte `read_exact` *per file* in the zoneinfo directory (potentially hundreds of files) — and this happens while `ZoneInfoNames::available` is still holding the exclusive write lock on `self.inner` from step 2, blocking every other `get()`/`available()` caller for the duration of scanning the whole database.\nThe author's own comment at lines 135-141 already acknowledges the general shape of this problem (\"it seems like bad juju to do any I/O of any kind while holding any lock at all\") and the `PERF:` comment at line 491 flags the `walk` call specifically, but the fix was never applied, and the `is_valid()` I/O during `available()` (item 3) is an additional, undocumented instance of the same problem.","fix":"Perform the file I/O (`File::open`/`read_to_end` in `CachedTimeZone::new`, the `walk()` directory scan in `refresh()`, and the per-file `is_valid_impl()` checks in `available()`) *before* acquiring the write lock, and only take the lock briefly to install the freshly computed result (e.g. build the new `CachedTimeZone`/`Vec<ZoneInfoName>` outside the lock, then swap it in under a short-lived write lock). This keeps other threads' lookups from blocking on unrelated disk I/O, especially important on slow or network-backed file systems where a single `TimeZoneDatabase::available()` call can otherwise stall every concurrent `TimeZone` lookup on the same database for the entire directory scan.","locations":[{"ref":"crates/jiff/src/tz/db/zoneinfo/enabled.rs:143-184","code":"  143 |         let mut zones = self.zones.write().unwrap();\n  144 |         let ttl = zones.ttl;\n  145 |         match zones.get_zone_index(query) {\n  146 |             Ok(i) => {\n  147 |                 let czone = &mut zones.zones[i];\n  148 |                 if czone.revalidate(&info, ttl) {\n  149 |                     // Metadata on the file didn't change, so we assume the\n  150 |                     // file hasn't either.\n  151 |                     return Some(czone.tz.clone());\n  152 |                 }\n  153 |                 // Revalidation failed. Re-read the TZif data.\n  154 |                 let czone = match CachedTimeZone::new(&info, zones.ttl) {\n  155 |                     Ok(czone) => czone,\n  156 |                     Err(_err) => {\n  157 |                         warn!(\n  158 |                             \"failed to re-cache time zone from file {}: {_err}\",\n  159 |                             info.inner.full.display(),\n  160 |                         );\n  161 |                         return None;\n  162 |                     }\n  163 |                 };\n  164 |                 let tz = czone.tz.clone();\n  165 |                 zones.zones[i] = czone;\n  166 |                 Some(tz)\n  167 |             }\n  168 |             Err(i) => {\n  169 |                 let czone = match CachedTimeZone::new(&info, ttl) {\n  170 |                     Ok(czone) => czone,\n  171 |                     Err(_err) => {\n  172 |                         warn!(\n  173 |                             \"failed to cache time zone from file {}: {_err}\",\n  174 |                             info.inner.full.display(),\n  175 |                         );\n  176 |                         return None;\n  177 |                     }\n  178 |                 };\n  179 |                 let tz = czone.tz.clone();\n  180 |                 zones.zones.insert(i, czone);\n  181 |                 Some(tz)\n  182 |             }\n  183 |         }\n  184 |     }","lines":42,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/tz/db/zoneinfo/enabled.rs#L143-L184"},{"ref":"crates/jiff/src/tz/db/zoneinfo/enabled.rs:425-449","code":"  425 |     fn get(&self, query: &str) -> Option<ZoneInfoName> {\n  426 |         {\n  427 |             let inner = self.inner.read().unwrap();\n  428 |             if let Some(zone_info_name) = inner.get(query) {\n  429 |                 return Some(zone_info_name);\n  430 |             }\n  431 |             drop(inner); // unlock\n  432 |         }\n  433 |         let mut inner = self.inner.write().unwrap();\n  434 |         inner.attempt_refresh();\n  435 |         inner.get(query)\n  436 |     }\n  437 | \n  438 |     /// Returns all available time zone names after attempting a refresh of\n  439 |     /// the underlying data if it's stale.\n  440 |     fn available(&self) -> Vec<String> {\n  441 |         let mut inner = self.inner.write().unwrap();\n  442 |         inner.attempt_refresh();\n  443 |         inner.available()\n  444 |     }\n  445 | \n  446 |     f {"id":"OTHER_1","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"In `Repr::arc_tzif` and `Repr::arc_posix` (`crates/jiff/src/tz/timezone.rs:2186-2206`), after asserting `core::mem::align_of::<T>() >= Repr::ALIGN` (which is `8`), the code runs a second runtime sanity check `assert!(tzif.addr() % 4 == 0)` / `assert!(posix_tz.addr() % 4 == 0)`. Since `Repr::BITS = 0b111` (a 3-bit tag mask), the invariant that actually needs to hold for `tag()`/pointer-untagging to be sound is that the pointer's low 3 bits are zero, i.e. `addr() % 8 == 0` -- not `% 4 == 0`. The `%4` check is a strictly weaker condition than what `ALIGN` (8) implies, so it does not actually validate the invariant the surrounding pointer-tagging scheme depends on; it happens to be masked by the stronger, correct `align_of::<T>() >= Repr::ALIGN` assert immediately above it, but the mismatch between `Repr::ALIGN` and the hardcoded `4` in these checks is misleading in code this safety-critical, and a future edit that removes or weakens the `align_of` assert (while leaving the `%4` check) would silently reintroduce a possible pointer-tag collision.","fix":"Use `Repr::ALIGN` instead of the hardcoded `4` so the assertion actually matches the invariant it's meant to protect:\n```rust\nassert!(tzif.addr() % Repr::ALIGN == 0);\n```\nand similarly for `posix_tz.addr() % Repr::ALIGN == 0`.","locations":[{"ref":"crates/jiff/src/tz/timezone.rs:2220","code":" 2220 |             assert!(tzif.addr() % 4 == 0);","lines":1,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/tz/timezone.rs#L2220"},{"ref":"crates/jiff/src/tz/timezone.rs:2231","code":" 2231 |             assert!(posix_tz.addr() % 4 == 0);","lines":1,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/tz/timezone.rs#L2231"}]},
{"id":"OTHER_2","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"The `quickcheck::Arbitrary` implementation for `Zoned` (used to property-test `Zoned` via `quickcheck` in this crate's test suite) always constructs values with `let tz = TimeZone::UTC;`, annotated with `// TODO: do something better here?` by the author. This means every quickcheck-generated `Zoned` in property tests has a fixed, degenerate `UTC` time zone with a zero, constant offset. Any property bugs that only manifest for non-UTC time zones (DST gaps/folds, non-round offsets, offset transitions affecting arithmetic, rounding, or comparisons) can never be found by quickcheck-based fuzzing of `Zoned`, since the `shrink` implementation likewise always re-wraps in `TimeZone::UTC`.","fix":"Have `Zoned::arbitrary` pick a time zone from a small fixed set of interesting IANA zones (e.g. `America/New_York`, `Pacific/Apia`, `Australia/Lord_Howe`, `Africa/Monrovia`, plus `TimeZone::UTC`) using `quickcheck::Gen`, e.g.:\n```rust\nfn arbitrary(g: &mut quickcheck::Gen) -> Zoned {\n    let timestamp = Timestamp::arbitrary(g);\n    let zones = [\"UTC\", \"America/New_York\", \"Pacific/Apia\", \"Australia/Lord_Howe\"];\n    let tz = crate::tz::db().get(g.choose(&zones).unwrap()).unwrap_or(TimeZone::UTC);\n    Zoned::new(timestamp, tz)\n}\n```\nso that property tests actually exercise DST-aware code paths (gaps, folds, and irregular offsets) instead of only the trivial fixed-UTC case.","locations":[{"ref":"crates/jiff/src/zoned.rs:3959-3975","code":" 3959 | #[cfg(test)]\n 3960 | impl quickcheck::Arbitrary for Zoned {\n 3961 |     fn arbitrary(g: &mut quickcheck::Gen) -> Zoned {\n 3962 |         let timestamp = Timestamp::arbitrary(g);\n 3963 |         let tz = TimeZone::UTC; // TODO: do something better here?\n 3964 |         Zoned::new(timestamp, tz)\n 3965 |     }\n 3966 | \n 3967 |     fn shrink(&self) -> alloc::boxed::Box<dyn Iterator<Item = Self>> {\n 3968 |         let timestamp = self.timestamp();\n 3969 |         alloc::boxed::Box::new(\n 3970 |             timestamp\n 3971 |                 .shrink()\n 3972 |                 .map(|timestamp| Zoned::new(timestamp, TimeZone::UTC)),\n 3973 |         )\n 3974 |     }\n 3975 | }","lines":17,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/zoned.rs#L3959-L3975"}]},
{"id":"OTHER_3","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"The panic messages used in the `Sub`/`SubAssign` operator implementations for `Date` all contain the same copy-pasted typo `\"subing\"` instead of `\"subtracting\"`: `` `expect(\"subing span to date overflowed\")` ``, `` `expect(\"subing signed duration to date overflowed\")` ``, and `` `expect(\"subing unsigned duration to date overflowed\")` ``. These strings are user-visible panic messages (triggered whenever `Date - Span`/`SignedDuration`/`Duration` overflows), so the typo is shown directly to end users debugging a panic.","fix":"Fix the typo in all three panic messages, e.g.:\n```rust\nself.checked_sub(rhs).expect(\"subtracting span from date overflowed\")\n```\n```rust\nself.checked_sub(rhs)\n    .expect(\"subtracting signed duration from date overflowed\")\n```\n```rust\nself.checked_sub(rhs)\n    .expect(\"subtracting unsigned duration from date overflowed\")\n```","locations":[{"ref":"crates/jiff/src/civil/date.rs:2114","code":" 2114 |         self.checked_sub(rhs).expect(\"subing span to date overflowed\")","lines":1,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/civil/date.rs#L2114"},{"ref":"crates/jiff/src/civil/date.rs:2182","code":" 2182 |             .expect(\"subing signed duration to date overflowed\")","lines":1,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/civil/date.rs#L2182"},{"ref":"crates/jiff/src/civil/date.rs:2232","code":" 2232 |             .expect(\"subing unsigned duration to date overflowed\")","lines":1,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/civil/date.rs#L2232"}]},

(function(){

// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.

const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};

const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State

    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Render a "**Label:** value" line. GitHub/CommonMark only recognizes a
// ``` fence when it starts at the beginning of a line, so if the value
// itself opens with a fence, put it on its own line instead of right
// after the inline label - otherwise the fence marker gets glued onto
// "**Label:** ```" and never renders as a code block.
function mdField(label, value) {
  value = value || '';
  return /^```/.test(value.trim())
    ? '**' + label + ':**\n\n' + value
    : '**' + label + ':** ' + value;
}

// Render the "**Locations:**" block. When a location has a commit-pinned
// permalink (GitHub/GitLab), just paste the bare URL on its own line -
// GitHub/GitLab auto-expand a line-range blob link into an inline code
// preview, so re-pasting the snippet as a fenced block would duplicate it.
// Forges without a detected permalink shape (or missing commit/repo info)
// fall back to the fenced ref+snippet so the location is still readable.
function mdLocations(locations) {
  if (!locations.length) return '';
  let out = '**Locations:**\n\n';
  for (const l of locations) {
    if (l.link)               out += l.link + '\n\n';
    else if (l.code != null)  out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
    else                      out += '- `' + l.ref + '` _(file not found)_\n\n';
  }
  return out;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
