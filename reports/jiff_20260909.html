{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`TimeZone::memory_usage` at `crates/jiff/src/tz/timezone.rs:1451-1467` is documented as returning \"the heap memory usage, in bytes, of this timezone\", but for the `ARC_TZIF` variant it only returns `core::mem::size_of::<tzif::MaybeNamedTimeZone>()` plus two `AtomicUsize` for the `Arc` control block. `size_of` only accounts for the top-level struct's own bytes (i.e. the fat pointers/lengths of its fields), not the bytes of any owned heap allocations reachable from it.\n\n`jcore::tz::tzif::TimeZone` (defined in `crates/jiff-core/src/tz/tzif/mod.rs`) contains `designations: MaybeStaticSlice<Abbreviation>`, `types: MaybeStaticSlice<LocalTimeType>`, and a `transitions: Transitions` struct that itself holds four more `MaybeStaticSlice` fields (`timestamps`, `civil_starts`, `civil_ends`, `infos`). When a `TimeZone` is built at runtime from TZif data (the `ARC_TZIF` case, which is the common path for reading `/usr/share/zoneinfo` entries), all of these `MaybeStaticSlice`s are backed by heap-allocated `Box<[T]>` (see `crates/jiff-core/src/util/mod.rs`). Real-world TZif files can have hundreds of transitions, so the actual heap footprint of a loaded time zone can be many times larger than what `memory_usage()` reports. The function silently ignores essentially all of the variable-sized heap data and only reports a small, roughly constant value for `ARC_TZIF`. (The `ARC_POSIX` branch happens to be accurate today because `jcore::tz::posix::TimeZone` has no heap-allocated fields, but that's incidental and not something the code verifies.)\n\nThis is user-visible: `Zoned::memory_usage` (`crates/jiff/src/zoned.rs:3248`) forwards directly to this function, so any caller trying to use it to budget memory (e.g. for a cache or embedded system) will get a value that is off by orders of magnitude for TZif-backed zones.","fix":"Compute the actual heap usage by summing the lengths of the underlying slices, not just `size_of` of the top-level struct. For example, expose a `memory_usage()` helper on `jcore::tz::tzif::TimeZone` (and `jcore::tz::posix::TimeZone` if it has heap-backed fields) that sums:\n```rust\nself.designations.as_slice().len() * size_of::<Abbreviation>()\n    + self.types.as_slice().len() * size_of::<LocalTimeType>()\n    + self.transitions.timestamps.as_slice().len() * size_of::<Timestamp>()\n    + self.transitions.civil_starts.as_slice().len() * size_of::<DateTime>()\n    + self.transitions.civil_ends.as_slice().len() * size_of::<DateTime>()\n    + self.transitions.infos.as_slice().len() * size_of::<TransitionInfo>()\n```\nand have `TimeZone::memory_usage` in `crates/jiff/src/tz/timezone.rs` call that instead of `core::mem::size_of::<tzif::MaybeNamedTimeZone>()`.","locations":[{"ref":"crates/jiff/src/tz/timezone.rs:1451-1467","code":" 1451 |     pub fn memory_usage(&self) -> usize {\n 1452 |         repr::each! {\n 1453 |             &self.repr,\n 1454 |             UTC => 0,\n 1455 |             UNKNOWN => 0,\n 1456 |             FIXED(_offset) => 0,\n 1457 |             STATIC_TZIF(_tzif) => 0,\n 1458 |             ARC_TZIF(_tzif) => {\n 1459 |                 core::mem::size_of::<tzif::MaybeNamedTimeZone>() +\n 1460 |                 (core::mem::size_of::<core::sync::atomic::AtomicUsize>() * 2)\n 1461 |             },\n 1462 |             ARC_POSIX(_posix) => {\n 1463 |                 core::mem::size_of::<posix::TimeZone>() +\n 1464 |                 (core::mem::size_of::<core::sync::atomic::AtomicUsize>() * 2)\n 1465 |             },\n 1466 |         }\n 1467 |     }","lines":17,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/tz/timezone.rs#L1451-L1467"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`SpanParser::parse_suffix_sign` in `crates/jiff/src/fmt/friendly/parser.rs:556-582` silently swallows trailing whitespace even when it is not followed by `ago`, contradicting the module's documented grammar (`direction = ws 'ago'` in `crates/jiff/src/fmt/friendly/mod.rs`), which only permits trailing whitespace immediately before the literal `ago`.\n\nThe function is only called when `input.first()` is whitespace (guarded by the caller in `parse` at lines 340-345). It then unconditionally eats the leading whitespace and any further optional whitespace via `input = self.parse_optional_whitespace(&input[1..]).input;` (line 566) *before* checking for `ago`. When `input.strip_prefix(b\"ago\")` fails, the `else` branch at line 571 returns `(None, input)` using the already-whitespace-trimmed `input`, instead of restoring the original (untrimmed) slice. As a result, bare trailing whitespace with no `ago` is consumed and treated as if it were never there, and the input is accepted as valid.\n\nThis was verified empirically: `\"1h \".parse::<jiff::Span>()`, `\"1h  \".parse::<jiff::Span>()`, `\"1h\\t\".parse::<jiff::Span>()` and `\"1,5s \".parse::<jiff::SignedDuration>()` all succeed silently, whereas the analogous case with `ago` present but followed by extra garbage, e.g. `\"1h ago \"`, is correctly rejected with `unparsed input \" \" remains`. The asymmetry shows the whitespace-eating in `parse_suffix_sign` should only be committed when `ago` is actually found.","fix":"Only consume the leading whitespace when `ago` is actually present; otherwise return the original, untouched `input` so the leftover whitespace is reported as unparsed input by the caller:\n\n```rust\nfn parse_suffix_sign<'i>(\n    &self,\n    prefix_sign: Option<Sign>,\n    input: &'i [u8],\n) -> Result<Parsed<'i, Sign>, Error> {\n    if !input.first().map_or(false, is_whitespace) {\n        let sign = prefix_sign.unwrap_or(Sign::Positive);\n        return Ok(Parsed { value: sign, input });\n    }\n    // Eat any additional whitespace we find before looking for 'ago'.\n    let after_ws = self.parse_optional_whitespace(&input[1..]).input;\n    let (suffix_sign, input) =\n        if let Some(tail) = after_ws.strip_prefix(b\"ago\") {\n            (Some(Sign::Negative), tail)\n        } else {\n            // No `ago` found: don't consume the whitespace, so it is\n            // reported as unparsed input by the caller.\n            (None, input)\n        };\n    let sign = match (prefix_sign, suffix_sign) {\n        (Some(_), Some(_)) => {\n            return Err(Error::from(E::ExpectedOneSign));\n        }\n        (Some(sign), None) => sign,\n        (None, Some(sign)) => sign,\n        (None, None) => Sign::Positive,\n    };\n    Ok(Parsed { value: sign, input })\n}\n```\n\nThis makes `\"1h \"` (and similar bare-trailing-whitespace inputs) fail with an `unparsed input` error, consistent with the documented grammar, instead of being silently accepted.","locations":[{"ref":"crates/jiff/src/fmt/friendly/parser.rs:556-582","code":"  556 |     fn parse_suffix_sign<'i>(\n  557 |         &self,\n  558 |         prefix_sign: Option<Sign>,\n  559 |         mut input: &'i [u8],\n  560 |     ) -> Result<Parsed<'i, Sign>, Error> {\n  561 |         if !input.first().map_or(false, is_whitespace) {\n  562 |             let sign = prefix_sign.unwrap_or(Sign::Positive);\n  563 |             return Ok(Parsed { value: sign, input });\n  564 |         }\n  565 |         // Eat any additional whitespace we find before looking for 'ago'.\n  566 |         input = self.parse_optional_whitespace(&input[1..]).input;\n  567 |         let (suffix_sign, input) =\n  568 |             if let Some(tail) = input.strip_prefix(b\"ago\") {\n  569 |                 (Some(Sign::Negative), tail)\n  570 |             } else {\n  571 |                 (None, input)\n  572 |             };\n  573 |         let sign = match (prefix_sign, suffix_sign) {\n  574 |             (Some(_), Some(_)) => {\n  575 |                 return Err(Error::from(E::ExpectedOneSign));\n  576 |             }\n  577 |             (Some(sign), None) => sign,\n  578 |             (None, Some(sign)) => sign,\n  579 |             (None, None) => Sign::Positive,\n  580 |         };\n  581 |         Ok(Parsed { value: sign, input })\n  582 |     }","lines":27,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/fmt/friendly/parser.rs#L556-L582"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`Numeric`'s `Display` impl in `crates/jiff/src/fmt/offset.rs:254-290` writes a `\":00\"` minutes placeholder independently in both the `seconds` branch (line 270-272) and the `nanoseconds` branch (line 278-280), each guarded only by `self.minutes.is_none()`. If a `Numeric` ever had `minutes: None` together with `seconds: Some(_)` and a non-zero `nanoseconds: Some(_)`, `\":00\"` would be written *twice* (once from the `seconds` branch, once from the `nanoseconds` branch) instead of once, corrupting the formatted offset (e.g. `+05:00:00:30.500` instead of `+05:00:30.500`) and overflowing the fixed-size `ArrayBuffer::<19>` backing the formatter (the 19-byte budget is exactly consumed by `sign(1) + hh(2) + \":mm\"(3) + \":ss\"(3) + \".\"+fraction(9)`, so an extra `\":00\"` (3 bytes) would push a write past capacity, and `BorrowedBuffer` writes panic on insufficient capacity per its own tests).\n\nToday this is unreachable: `parse_numeric` only ever sets `numeric.seconds` after `numeric.minutes` has already been set, and only ever sets `numeric.nanoseconds` after `numeric.seconds` has been set, so the invariant `minutes.is_some() >= seconds.is_some() >= nanoseconds.is_some()` always holds via parsing (and the one place `Numeric` is hand-constructed in tests upholds it too). But this invariant is not encoded in the type and is not asserted anywhere, so any future change to `parse_numeric` (or a new caller constructing `Numeric` directly) could silently reintroduce a buffer-overflow panic in what is documented as purely an error-message formatter (`// This impl is just used for error messages when converting a Numeric to an Offset fails.`).","fix":"Track whether the `:00` minutes/seconds placeholder has already been written with a single piece of state instead of re-deriving it independently in two branches, e.g.:\n```rust\nfn fmt(&self, f: &mut core::fmt::Formatter) -> core::fmt::Result {\n    let mut buf = ArrayBuffer::<19>::default();\n    let mut bbuf = buf.as_borrowed();\n\n    bbuf.write_ascii_char(if self.sign.is_negative() { b'-' } else { b'+' });\n    bbuf.write_int_pad2(self.hours.unsigned_abs());\n\n    let mut wrote_minutes = false;\n    if let Some(minutes) = self.minutes {\n        bbuf.write_ascii_char(b':');\n        bbuf.write_int_pad2(minutes.unsigned_abs());\n        wrote_minutes = true;\n    }\n    let mut wrote_seconds = false;\n    if let Some(seconds) = self.seconds {\n        if !wrote_minutes {\n            bbuf.write_str(\":00\");\n            wrote_minutes = true;\n        }\n        bbuf.write_ascii_char(b':');\n        bbuf.write_int_pad2(seconds.unsigned_abs());\n        wrote_seconds = true;\n    }\n    if let Some(nanos) = self.nanoseconds {\n        if nanos != 0 {\n            if !wrote_minutes {\n                bbuf.write_str(\":00\");\n            }\n            if !wrote_seconds {\n                bbuf.write_str(\":00\");\n            }\n            bbuf.write_ascii_char(b'.');\n            bbuf.write_fraction(None, nanos.unsigned_abs());\n        }\n    }\n    f.write_str(bbuf.filled())\n}\n```\nThis writes the `:00` placeholder at most once per missing component regardless of which later field triggered it, removing the dependence on the currently-implicit \"seconds implies minutes, nanoseconds implies seconds\" invariant.","locations":[{"ref":"crates/jiff/src/fmt/offset.rs:254-290","code":"  254 | impl core::fmt::Display for Numeric {\n  255 |     fn fmt(&self, f: &mut core::fmt::Formatter) -> core::fmt::Result {\n  256 |         let mut buf = ArrayBuffer::<19>::default();\n  257 |         let mut bbuf = buf.as_borrowed();\n  258 | \n  259 |         bbuf.write_ascii_char(if self.sign.is_negative() {\n  260 |             b'-'\n  261 |         } else {\n  262 |             b'+'\n  263 |         });\n  264 |         bbuf.write_int_pad2(self.hours.unsigned_abs());\n  265 |         if let Some(minutes) = self.minutes {\n  266 |             bbuf.write_ascii_char(b':');\n  267 |             bbuf.write_int_pad2(minutes.unsigned_abs());\n  268 |         }\n  269 |         if let Some(seconds) = self.seconds {\n  270 |             if self.minutes.is_none() {\n  271 |                 bbuf.write_str(\":00\");\n  272 |             }\n  273 |             bbuf.write_ascii_char(b':');\n  274 |             bbuf.write_int_pad2(seconds.unsigned_abs());\n  275 |         }\n  276 |         if let Some(nanos) = self.nanoseconds {\n  277 |             if nanos != 0 {\n  278 |                 if self.minutes.is_none() {\n  279 |                     bbuf.write_str(\":00\");\n  280 |                 }\n  281 |                 if self.seconds.is_none() {\n  282 |                     bbuf.write_str(\":00\");\n  283 |                 }\n  284 |                 bbuf.write_ascii_char(b'.');\n  285 |                 bbuf.write_fraction(None, nanos.unsigned_abs());\n  286 |             }\n  287 |         }\n  288 |         f.write_str(bbuf.filled())\n  289 |     }\n  290 | }","lines":37,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/fmt/offset.rs#L254-L290"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`Parser::parse_whitespace` in `crates/jiff/src/fmt/strtime/parse.rs:225-231` is documented as parsing \"an arbitrary (zero or more) amount ASCII whitespace\" and is used to implement both `%n` and `%t`. However, the dispatch loop in `Parser::parse` enforces, *before* any directive-specific parsing function is even called, that the remaining input is non-empty:\n```rust\nif self.inp.is_empty() && self.f() != b'.' {\n    return Err(Error::from(PE::ExpectedNonEmpty {\n        directive: self.f(),\n    }));\n}\n```\nThis check special-cases only `.` (for `%.f`, which can legitimately match the empty string), but not `n`/`t`. So if `%n` or `%t` appears at a point in the format string where the remaining input is already exhausted (i.e. it should match \"zero\" whitespace bytes), parsing fails with `ExpectedNonEmpty` instead of succeeding, contradicting the documented \"zero or more\" semantics of `parse_whitespace`. This is inconsistent with how a literal whitespace byte in the format string is handled by `parse_literal`, which explicitly guards with `if !self.inp.is_empty() { ... }` and never requires non-empty input.\n\nVerified with a temporary test: `BrokenDownTime::parse(\"%H%n\", \"15\")` (input exhausted right where `%n` is expected to match zero whitespace bytes) returns:\n```\nstrptime parsing failed: expected non-empty input for directive `%n`, but found end of input\n```\ninstead of succeeding.","fix":"Exempt `%n` and `%t` from the empty-input check the same way `%.f` is exempted, since both are documented to accept zero whitespace bytes:\n```rust\nif self.inp.is_empty() && !matches!(self.f(), b'.' | b'n' | b't') {\n    return Err(Error::from(PE::ExpectedNonEmpty {\n        directive: self.f(),\n    }));\n}\n```","locations":[{"ref":"crates/jiff/src/fmt/strtime/parse.rs:39-43","code":"   39 |             if self.inp.is_empty() && self.f() != b'.' {\n   40 |                 return Err(Error::from(PE::ExpectedNonEmpty {\n   41 |                     directive: self.f(),\n   42 |                 }));\n   43 |             }","lines":5,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/fmt/strtime/parse.rs#L39-L43"},{"ref":"crates/jiff/src/fmt/strtime/parse.rs:225-231","code":"  225 |     fn parse_whitespace(&mut self) -> Result<(), Error> {\n  226 |         if !self.inp.is_empty() {\n  227 |             while self.i().is_ascii_whitespace() && self.bump_input() {}\n  228 |         }\n  229 |         self.bump_fmt();\n  230 |         Ok(())\n  231 |     }","lines":7,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/fmt/strtime/parse.rs#L225-L231"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`DurationUnits::to_unsigned_duration` (fast path) and `DurationUnits::to_unsigned_duration_general` check `self.sign.is_negative()` directly instead of using `self.get_sign().is_negative()`. The `sign` field can be set to `Sign::Negative` even when all parsed unit values are zero (e.g. the input \"0s ago\" or \"-0s\", where the `ago`/`-` suffix/prefix sets `sign = Sign::Negative` but `any_non_zero_units` stays `false`). `DurationUnits::get_sign` exists specifically to normalize this case back to `Sign::Zero`, and both `to_span` (via `span.sign_unchecked(self.get_sign())`) and `to_signed_duration`/`to_signed_duration_general` (via `get_unit_value`/`get_fraction`, which both call `self.get_sign()`) correctly use it. `to_unsigned_duration`/`to_unsigned_duration_general` are the only conversion routines that bypass `get_sign()` and read the raw `sign` field, so parsing \"0s ago\" into a `core::time::Duration` incorrectly fails with `NotAllowedNegative`, even though `SpanParser::parse_duration(\"0s ago\")` (returns `SignedDuration::ZERO`) and `Span` parsing of the same input both succeed and treat it as zero. Verified with a temporary test: `SpanParser::new().parse_unsigned_duration(\"0s ago\")` and `parse_unsigned_duration(\"-0s\")` both return an `Err` (\"cannot parse negative duration into unsigned `std::time::Duration`\"), while `parse_duration(\"0s ago\")` returns `Ok(SignedDuration::ZERO)`.","fix":"Use `self.get_sign()` instead of the raw `self.sign` field in both places, so an all-zero duration with an explicit negative sign is treated as zero (consistent with `to_span` and `to_signed_duration`):\n\n```rust\n// fast path, around line 506\n|| self.get_sign().is_negative()\n\n// to_unsigned_duration_general, around line 556\nif self.get_sign().is_negative() {\n    return Err(Error::from(E::NotAllowedNegative));\n}\n```","locations":[{"ref":"crates/jiff/src/fmt/util.rs:506","code":"  506 |             || self.sign.is_negative()","lines":1,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/fmt/util.rs#L506"},{"ref":"crates/jiff/src/fmt/util.rs:556-558","code":"  556 |         if self.sign.is_negative() {\n  557 |             return Err(Error::from(E::NotAllowedNegative));\n  558 |         }","lines":3,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/fmt/util.rs#L556-L558"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`Span::to_invariant_duration` (`crates/jiff/src/span.rs:2416-2454`) and `Span::to_invariant_duration_time_only` (`crates/jiff/src/span.rs:2458-2490`) are near-identical functions that each define a compile-time-evaluated `const _FITS_IN_U64: () = { ... };` block whose purpose (per the comment) is to guarantee at compile time that the maximal invariant `Span` balances into a value that fits an `i64` count of seconds, which the subsequent `SignedDuration::from_*(...) + ...` chain relies on (\"OK because we have a compile time assert above...\").\n\nIn `to_invariant_duration`, the invariant is checked with a plain `assert!(...)` (`crates/jiff/src/span.rs:2423-2440`), which is always evaluated. But in `to_invariant_duration_time_only`, the analogous check uses `debug_assert!(...)` (`crates/jiff/src/span.rs:2466-2478`). `debug_assert!` expands using `cfg!(debug_assertions)`, so in a release build (`debug-assertions = false`, the default for `--release`), the condition is never evaluated at all -- the `const` item becomes a no-op. This means the safety net that the subsequent code explicitly relies on via the comment `// OK because we have a compile time assert above that ensures our nanoseconds are in the valid range` is silently disabled in release builds for `to_invariant_duration_time_only`, unlike its sibling function. If the underlying bound constants (`b::SpanHours::MAX`, etc.) were ever changed such that the invariant no longer holds, `to_invariant_duration` would fail to compile everywhere, but `to_invariant_duration_time_only` would silently compile in release mode and only surface the resulting overflow as a runtime panic (via the unchecked `+` chain on `SignedDuration`) or, in debug builds only, a `debug_assert!` failure.","fix":"Change `debug_assert!` to `assert!` in the `const _FITS_IN_U64` block inside `to_invariant_duration_time_only` (`crates/jiff/src/span.rs:2466`), matching the sibling function `to_invariant_duration`, so the invariant is unconditionally checked at compile time in all build profiles:\n```rust\nconst _FITS_IN_U64: () = {\n    assert!(\n        i64::MAX as i128\n            > ((b::SpanHours::MAX as i128 * c::SECS_PER_HOUR as i128)\n                + ...),\n    );\n    ()\n};\n```","locations":[{"ref":"crates/jiff/src/span.rs:2458-2490","code":" 2458 |     #[inline]\n 2459 |     pub(crate) fn to_invariant_duration_time_only(&self) -> SignedDuration {\n 2460 |         // This guarantees, at compile time, that a maximal invariant Span\n 2461 |         // (that is, all units are weeks or lower and all units are set to\n 2462 |         // their maximum values) will still balance out to a number of seconds\n 2463 |         // that fits into a `i64`. This in turn implies that a `SignedDuration`\n 2464 |         // can represent all possible invariant positive spans.\n 2465 |         const _FITS_IN_U64: () = {\n 2466 |             debug_assert!(\n 2467 |                 i64::MAX as i128\n 2468 |                     > ((b::SpanHours::MAX as i128 * c::SECS_PER_HOUR as i128)\n 2469 |                         + (b::SpanMinutes::MAX as i128\n 2470 |                             * c::SECS_PER_MIN as i128)\n 2471 |                         + b::SpanSeconds::MAX as i128\n 2472 |                         + (b::SpanMilliseconds::MAX as i128\n 2473 |                             / c::MILLIS_PER_SEC as i128)\n 2474 |                         + (b::SpanMicroseconds::MAX as i128\n 2475 |                             / c::MICROS_PER_SEC as i128)\n 2476 |                         + (b::SpanNanoseconds::MAX as i128\n 2477 |                             / c::NANOS_PER_SEC as i128)),\n 2478 |             );\n 2479 |             ()\n 2480 |         };\n 2481 | \n 2482 |         // OK because we have a compile time assert above that ensures our\n 2483 |         // nanoseconds are in the valid range of a `SignedDuration`.\n 2484 |         SignedDuration::from_hours32(self.get_hours())\n 2485 |             + SignedDuration::from_mins(self.get_minutes())\n 2486 |             + SignedDuration::from_secs(self.get_seconds())\n 2487 |             + SignedDuration::from_millis(self.get_milliseconds())\n 2488 |             + SignedDuration::from_micros(self.get_microseconds())\n 2489 |             + SignedDuration::from_nanos(self.get_nanoseconds())\n 2490 |     }","lines":33,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/span.rs#L2458-L2490"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `crates/jiff/src/tz/db/zoneinfo/enabled.rs`, `CachedZones::get_zone_index` (lines 227-240) performs a \"fast path\" `binary_search_by` over `zone.name.original().cmp(&query)` (case-sensitive) before falling back to a second `binary_search_by` over `utf8::cmp_ignore_ascii_case(zone.name.lower(), query)` (case-insensitive). However, new entries are only ever inserted at the index returned by the *second* (case-insensitive) search's `Err(i)` result (see the `Err(i) => { ... zones.zones.insert(i, czone); }` branch around line 168-181 in `Database::get`), so the `zones` vector is only guaranteed to be sorted according to the case-insensitive comparator over `lower()`. `binary_search` requires the slice to be sorted according to the *same* comparator being used, so running it with `original().cmp(&query)` (case-sensitive) on a vector that is only sorted by `lower()` (case-insensitive) violates that precondition whenever a pair of real zone names have case-sensitive and case-insensitive orderings that disagree. This is not hypothetical: running this ordering check against a real `/usr/share/zoneinfo` directory shows `Etc/Universal` sorts before `Etc/UTC` case-insensitively (`\"universal\" < \"utc\"`), but case-sensitively `Etc/UTC` sorts before `Etc/Universal` (`'T'` (`0x54`) < `'n'` (`0x6E`)). So once both `Etc/UTC` and `Etc/Universal` are cached, the fast-path case-sensitive `binary_search` is running against an array that is not sorted per its own comparator, which defeats the purpose of the \"fast path\" (it will tend to return `Err` even for cached exact-case matches, forcing the slow case-insensitive path every time for such pairs). The end result is still correct because the second, case-insensitive search always runs whenever the first search doesn't return `Ok`, and that second search's sort invariant is actually maintained — but the \"fast path\" optimization documented in the comment above it (\"The common case is that our query matches the time zone name case sensitively... It's a bit cheaper...\") is silently broken for any zoneinfo directory containing such alias pairs (e.g. `Etc/UTC`/`Etc/Universal`, `Etc/GMT`/`Etc/Greenwich`-style names, etc).","fix":"Either drop the case-sensitive fast path entirely and always search with `utf8::cmp_ignore_ascii_case`, since that is the only comparator the vector is actually guaranteed to be sorted by:\n\n```rust\nfn get_zone_index(&self, query: &str) -> Result<usize, usize> {\n    self.zones.binary_search_by(|zone| {\n        utf8::cmp_ignore_ascii_case(zone.name.lower(), query)\n    })\n}\n```\n\nOr, if the case-sensitive fast path is worth keeping for performance, maintain a second, separately-sorted index (or keep the vector sorted by `original()` and adapt the case-insensitive lookup to a linear scan / different data structure) so that both comparators' sortedness invariants actually hold at the same time.","locations":[{"ref":"crates/jiff/src/tz/db/zoneinfo/enabled.rs:227-240","code":"  227 |     fn get_zone_index(&self, query: &str) -> Result<usize, usize> {\n  228 |         // The common case is that our query matches the time zone name case\n  229 |         // sensitively, so check for that first. It's a bit cheaper than doing\n  230 |         // a case insensitive search.\n  231 |         if let Ok(i) = self\n  232 |             .zones\n  233 |             .binary_search_by(|zone| zone.name.original().cmp(&query))\n  234 |         {\n  235 |             return Ok(i);\n  236 |         }\n  237 |         self.zones.binary_search_by(|zone| {\n  238 |             utf8::cmp_ignore_ascii_case(zone.name.lower(), query)\n  239 |         })\n  240 |     }","lines":14,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/tz/db/zoneinfo/enabled.rs#L227-L240"},{"ref":"crates/jiff/src/tz/db/zoneinfo/enabled.rs:143-184","code":"  143 |         let mut zones = self.zones.write().unwrap();\n  144 |         let ttl = zones.ttl;\n  145 |         match zones.get_zone_index(query) {\n  146 |             Ok(i) => {\n  147 |                 let czone = &mut zones.zones[i];\n  148 |                 if czone.revalidate(&info, ttl) {\n  149 |                     // Metadata on the file didn't change, so we assume the\n  150 |                     // file hasn't either.\n  151 |                     return Some(czone.tz.clone());\n  152 |                 }\n  153 |                 // Revalidation failed. Re-read the TZif data.\n  154 |                 let czone = match CachedTimeZone::new(&info, zones.ttl) {\n  155 |                     Ok(czone) => czone,\n  156 |                     Err(_err) => {\n  157 |                         warn!(\n  158 |                             \"failed to re-cache time zone from file {}: {_err}\",\n  159 |                             info.inner.full.display(),\n  160 |                         );\n  161 |                         return None;\n  162 |                     }\n  163 |                 };\n  164 |                 let tz = czone.tz.clone();\n  165 |                 zones.zones[i] = czone;\n  166 |                 Some(tz)\n  167 |             }\n  168 |             Err(i) => {\n  169 |                 let czone = match CachedTimeZone::new(&info, ttl) {\n  170 |                     Ok(czone) => czone,\n  171 |                     Err(_err) => {\n  172 |                         warn!(\n  173 |                             \"failed to cache time zone from file {}: {_err}\",\n  174 |                             info.inner.full.display(),\n  175 |                         );\n  176 |                         return None;\n  177 |                     }\n  178 |                 };\n  179 |                 let tz = czone.tz.clone();\n  180 |                 zones.zones.insert(i, czone);\n  181 |                 Some(tz)\n  182 |             }\n  183 |         }\n {"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"In `crates/jiff/src/tz/system/windows/mod.rs`, the test `get_time_zone_name_windows_dynamic_time_zone` (lines 128-145) was clearly copy-pasted from the analogous Unix test `get_time_zone_name_etc_localtime` in `crates/jiff/src/tz/system/unix.rs` (lines 99-116), including checking for the existence of `/etc/localtime` (lines 136-138: `let path = std::path::Path::new(\"/etc/localtime\"); if !path.exists() { return; }`) before calling `get(db)`. This file is only compiled on Windows (`#[cfg(windows)] #[path = \"windows/mod.rs\"] mod sys;` in `crates/jiff/src/tz/system/mod.rs`), where `/etc/localtime` never exists. As a result, `path.exists()` is always `false` on Windows, the test always hits the early `return;` at line 138, and `get(db)` — the actual function under test, which queries `GetDynamicTimeZoneInformation` via FFI — is never invoked. The test passes unconditionally on every Windows CI run without exercising any of the Windows-specific system time zone detection logic it's named after.","fix":"Remove the irrelevant `/etc/localtime` existence check copied from the Unix test, since `get()` on Windows doesn't depend on any file path at all:\n\n```rust\n#[test]\nfn get_time_zone_name_windows_dynamic_time_zone() {\n    let _ = crate::logging::Logger::init();\n\n    let db = crate::tz::db();\n    if crate::tz::db().is_definitively_empty() {\n        return;\n    }\n    assert!(get(db).is_some());\n}\n```","locations":[{"ref":"crates/jiff/src/tz/system/windows/mod.rs:124-146","code":"  124 | #[cfg(test)]\n  125 | mod tests {\n  126 |     use super::*;\n  127 | \n  128 |     #[test]\n  129 |     fn get_time_zone_name_windows_dynamic_time_zone() {\n  130 |         let _ = crate::logging::Logger::init();\n  131 | \n  132 |         let db = crate::tz::db();\n  133 |         if crate::tz::db().is_definitively_empty() {\n  134 |             return;\n  135 |         }\n  136 |         let path = std::path::Path::new(\"/etc/localtime\");\n  137 |         if !path.exists() {\n  138 |             return;\n  139 |         }\n  140 |         // It's hard to assert much other than that a time zone could be\n  141 |         // successfully constructed. Presumably this may fail in certain\n  142 |         // environments, but hopefully the `is_definitively_empty` check above\n  143 |         // will filter most out.\n  144 |         assert!(get(db).is_some());\n  145 |     }\n  146 | }","lines":23,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/tz/system/windows/mod.rs#L124-L146"}]},
{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `crates/jiff/src/error/tz/zic.rs`, the `Display` arm for `Error::FailedParseFieldAt` writes `\"failed to parse `NAME` field\"`, which is an exact copy of the message used for the unrelated `Error::FailedParseFieldName` variant. `FailedParseFieldAt` is constructed in `crates/jiff/src/tz/zic.rs:388` specifically when parsing a rule's `AT` field (`at_field.parse::<RuleAtP>().context(E::FailedParseFieldAt)?`), so its error text should mention the `AT` field, not `NAME`. Every other `FailedParseField*` variant in this enum correctly names its own field (`FROM`, `IN`, `LETTERS`, `ON`, `RULES`, `SAVE`, `STDOFF`, `TO`, `UNTIL`), confirming `FailedParseFieldAt` was copy-pasted from `FailedParseFieldName` without updating the field name in the message.","fix":"Change the `FailedParseFieldAt` arm to reference the `AT` field instead of `NAME`:\n\n```rust\nFailedParseFieldAt => {\n    f.write_str(\"failed to parse `AT` field\")\n}\n```","locations":[{"ref":"crates/jiff/src/error/tz/zic.rs:222-224","code":"  222 |                 FailedParseFieldAt => {\n  223 |                     f.write_str(\"failed to parse `NAME` field\")\n  224 |                 }","lines":3,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/error/tz/zic.rs#L222-L224"},{"ref":"crates/jiff/src/error/tz/zic.rs:243-245","code":"  243 |                 FailedParseFieldName => {\n  244 |                     f.write_str(\"failed to parse `NAME` field\")\n  245 |                 }","lines":3,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/error/tz/zic.rs#L243-L245"}]},
{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `Formatter::format_one` in `crates/jiff/src/fmt/strtime/printer.rs`, the `%h` directive arm (line 158) calls `.context(fail(b'b'))` instead of `.context(fail(b'h'))`. This was clearly copy-pasted from the `%b` arm directly above it (line 147: `b'b' => self.fmt_month_abbrev().map(s).context(fail(b'b')),`) without updating the directive byte passed to `fail`. As a result, when formatting `%h` fails (for example, because the `BrokenDownTime` has no month/date, triggering `FE::RequiresDate`), the resulting error message incorrectly reports `%b failed: ...` even though the format string used `%h`.\n\nVerified by adding a temporary test that formats `%h` on a value with no date component:\n```\nstrftime formatting failed: %b failed: requires date to format\n```\ninstead of the expected `%h failed: ...`.","fix":"Change the `%h` arm to use its own directive byte in the error context:\n```rust\nb'h' => self.fmt_month_abbrev().map(s).context(fail(b'h')),\n```","locations":[{"ref":"crates/jiff/src/fmt/strtime/printer.rs:158","code":"  158 |             b'h' => self.fmt_month_abbrev().map(s).context(fail(b'b')),","lines":1,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/fmt/strtime/printer.rs#L158"}]},
{"id":"CPY_4","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `Formatter::format_one` in `crates/jiff/src/fmt/strtime/printer.rs`, the `%I` directive arm (line 159) calls `.context(fail(b'H'))` instead of `.context(fail(b'I'))`. This appears to be a copy-paste from the `%H` arm directly above it (line 157: `b'H' => self.fmt_hour24_zero().map(i).context(fail(b'H')),`) without updating the directive byte. As a result, when formatting `%I` fails (for example, because the `BrokenDownTime` has no time component, triggering `FE::RequiresTime`), the resulting error message incorrectly reports `%H failed: ...` even though the format string used `%I`.\n\nVerified by adding a temporary test that formats `%I` on a value with no time component:\n```\nstrftime formatting failed: %H failed: requires time to format\n```\ninstead of the expected `%I failed: ...`.","fix":"Change the `%I` arm to use its own directive byte in the error context:\n```rust\nb'I' => self.fmt_hour12_zero().map(i).context(fail(b'I')),\n```","locations":[{"ref":"crates/jiff/src/fmt/strtime/printer.rs:159","code":"  159 |             b'I' => self.fmt_hour12_zero().map(i).context(fail(b'H')),","lines":1,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/fmt/strtime/printer.rs#L159"}]},
{"id":"CPY_5","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `DurationUnits::to_unsigned_duration_general` (crates/jiff/src/fmt/util.rs), the error raised when adding the fractional component overflows `core::time::Duration` hardcodes `unit: Unit::Hour`:\n```rust\nsdur = sdur\n    .checked_add(fractional_duration(min, fraction)?.unsigned_abs())\n    .ok_or(E::OverflowForUnitFractional { unit: Unit::Hour })?;\n```\nbut the fraction actually belongs to `min` (the smallest unit that was explicitly parsed, e.g. `Unit::Minute`, `Unit::Second`, `Unit::Millisecond` or `Unit::Microsecond`), not necessarily `Unit::Hour`. The sibling function `to_signed_duration_general` (same file) handles the identical situation correctly with `.ok_or(E::OverflowForUnitFractional { unit: min })?`, confirming this is a copy-paste slip rather than intentional. Verified by parsing \"307445734561825860.5m\" (just past the max whole-minute value representable in an unsigned `core::time::Duration`) via `SpanParser::parse_unsigned_duration`: the resulting error message reads \"... accumulated duration overflowed when adding fractional value to unit hour\" even though the offending unit is minutes.","fix":"Report the actual unit that the fraction belongs to instead of the hardcoded `Unit::Hour`:\n```rust\nif let Some(fraction) = self.get_fraction()? {\n    sdur = sdur\n        .checked_add(fractional_duration(min, fraction)?.unsigned_abs())\n        .ok_or(E::OverflowForUnitFractional { unit: min })?;\n}\n```","locations":[{"ref":"crates/jiff/src/fmt/util.rs:603-609","code":"  603 |         if let Some(fraction) = self.get_fraction()? {\n  604 |             sdur = sdur\n  605 |                 .checked_add(\n  606 |                     fractional_duration(min, fraction)?.unsigned_abs(),\n  607 |                 )\n  608 |                 .ok_or(E::OverflowForUnitFractional { unit: Unit::Hour })?;\n  609 |         }","lines":7,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/fmt/util.rs#L603-L609"}]},
{"id":"CPY_6","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In the `dbg!` macro's zero-argument arm, the format arguments use `$crate::file!()`, `$crate::line!()`, and `$crate::column!()`, whereas the one-argument and variadic arms of the same macro correctly use `std::file!()`, `std::line!()`, `std::column!()`. `file!`, `line!`, and `column!` are compiler built-in macros, not items re-exported from the `jiff` crate root (there is no `pub use core::file;` or similar in `crates/jiff/src/lib.rs`), so `$crate::file!()` does not resolve to anything valid. This is a copy-paste inconsistency between the three match arms of `dbg!`: the `()` arm was apparently written independently of (or before) the other two and never had its `std::` prefixes applied. Because the zero-argument form `dbg!()` is never actually invoked anywhere in the crate (`grep` shows only `dbg!(expr)` call sites in `crates/jiff/src/lib.rs`), this bug is currently dormant: the arm is never macro-expanded, so it never gets type/name-checked, and the crate compiles fine. It would fail to compile the moment anyone writes a bare `dbg!()` call.","fix":"Make the zero-argument arm consistent with the other two arms by using `std::` instead of `$crate::`:\n```rust\nmacro_rules! dbg {\n    () => {\n        std::eprintln!(\n            \"[{}:{}:{}]\",\n            std::file!(),\n            std::line!(),\n            std::column!(),\n        )\n    };\n    ...\n}\n```","locations":[{"ref":"crates/jiff/src/logging.rs:41-48","code":"   41 |     () => {\n   42 |         std::eprintln!(\n   43 |             \"[{}:{}:{}]\",\n   44 |             $crate::file!(),\n   45 |             $crate::line!(),\n   46 |             $crate::column!(),\n   47 |         )\n   48 |     };","lines":8,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/logging.rs#L41-L48"}]},
{"id":"CPY_7","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"`Span::debug` (a `#[cfg(feature = \"alloc\")]`, `#[allow(dead_code)]` helper used only for manual debugging) builds a debug string with `write!(buf, \"Span {{ sign: {:?}, units: {:?}\", ...)` (which correctly uses `{{`/`}}` escaping for the `write!` format string) but then closes the string with `buf.push_str(\" }}\");` at `crates/jiff/src/span.rs:2952`. Since `String::push_str` takes a plain string slice, not a format string, `\" }}\"` is pushed *literally*, i.e. two closing curly braces are appended instead of one. The resulting debug string is malformed, e.g. `Span { sign: Positive, units: {y}, years: 1 }}` instead of the intended `... years: 1 }`.","fix":"Change `buf.push_str(\" }}\");` to `buf.push_str(\" }\");` at `crates/jiff/src/span.rs:2952` so only a single closing brace is emitted, matching the single opening `{{` (which becomes one literal `{`) emitted by the earlier `write!` call.","locations":[{"ref":"crates/jiff/src/span.rs:2916-2953","code":" 2916 |     pub(crate) fn debug(&self) -> alloc::string::String {\n 2917 |         use core::fmt::Write;\n 2918 | \n 2919 |         let mut buf = alloc::string::String::new();\n 2920 |         write!(buf, \"Span {{ sign: {:?}, units: {:?}\", self.sign, self.units)\n 2921 |             .unwrap();\n 2922 |         if self.years != 0 {\n 2923 |             write!(buf, \", years: {:?}\", self.years).unwrap();\n 2924 |         }\n 2925 |         if self.months != 0 {\n 2926 |             write!(buf, \", months: {:?}\", self.months).unwrap();\n 2927 |         }\n 2928 |         if self.weeks != 0 {\n 2929 |             write!(buf, \", weeks: {:?}\", self.weeks).unwrap();\n 2930 |         }\n 2931 |         if self.days != 0 {\n 2932 |             write!(buf, \", days: {:?}\", self.days).unwrap();\n 2933 |         }\n 2934 |         if self.hours != 0 {\n 2935 |             write!(buf, \", hours: {:?}\", {"id":"CPY_8","type":"copy_paste","type_label":"Copy Paste","severity":"negligible","difficulty":"very_easy","description":"`crates/jiff/src/error/fmt/util.rs` interpolates the `{unit}`/`{found}`/`{previous}` placeholders in its error messages with no surrounding punctuation (e.g. `\"converting {unit} to seconds overflows a signed 64-bit integer\"`), whereas every other error-kind file in the crate that formats a `Unit` (or similarly named) value wraps it in single quotes, e.g. `crates/jiff/src/error/span.rs`'s `\"...with largest unit set to '{unit}'\"` and `crates/jiff/src/error/unit.rs`'s `\"'{unit}' not allowed...\"`. This looks like the `fmt/util.rs` variants were written (or later edited) without carrying over the quoting convention used elsewhere, producing user-facing error text that is inconsistent in style from the rest of the crate's error messages.","fix":"Wrap the interpolated unit/value in single quotes to match the convention used in `error/span.rs` and `error/unit.rs`, e.g.:\n\n```rust\n// before\nConversionToSecondsFailed { unit } => write!(\n    f,\n    \"converting {unit} to seconds overflows \\\n     a signed 64-bit integer\",\n    unit = unit.plural(),\n),\n\n// after\nConversionToSecondsFailed { unit } => write!(\n    f,\n    \"converting '{unit}' to seconds overflows \\\n     a signed 64-bit integer\",\n    unit = unit.plural(),\n),\n```\n\nand similarly for the other `{unit}`/`{found}`/`{previous}` interpolations in this file (`FailedValueSet`, `NotAllowedCalendarUnit`, `NotAllowedFractionalUnit`, `OutOfOrderHMS`, `OutOfOrderUnits`, `OverflowForUnit`, `OverflowForUnitFractional`, `SignedOverflowForUnit`).","locations":[{"ref":"crates/jiff/src/error/fmt/util.rs:41-113","code":"   41 |             ConversionToSecondsFailed { unit } => write!(\n   42 |                 f,\n   43 |                 \"converting {unit} to seconds overflows \\\n   44 |                  a signed 64-bit integer\",\n   45 |                 unit = unit.plural(),\n   46 | {"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In `ISOWeekDate::new`, the guard that rejects `weekday` values past `Friday` when `year == ISOYear::MAX && week == 52` reports the failure via `b::WeekdayMondayOne::error()`. That error kind's `Display` message is `\"parameter 'weekday (Monday 1-indexed)' is not in the required range of 1..=7\"`, but the `weekday` argument actually passed in (e.g. `Weekday::Saturday`, whose `to_monday_one_offset()` is `6`) *is* within `1..=7` — the real problem is the combination of `year=9999`, `week=52` and a weekday later than `Friday`, not an out-of-range weekday offset. This is reachable through the public, documented API: `ISOWeekDate::last_of_week()` calls `ISOWeekDate::new(self.year(), self.week(), Weekday::Sunday)` and will surface this same misleading error for any `9999-W52-*` week date.","fix":"Introduce a dedicated `SpecialBoundsError` variant (alongside `DateInvalidDay` / `DateInvalidDayOfYear`) such as `IsoWeekDateInvalidWeekday { year: i16, week: i8 }` with a message like `\"parameter 'weekday' for ISO week 9999-W52 is invalid because it would exceed the maximum representable date; must be Friday or earlier\"`, and use `rbail!(b::SpecialBoundsError::IsoWeekDateInvalidWeekday { year, week })` instead of reusing `b::WeekdayMondayOne::error()`.","locations":[{"ref":"crates/jiff-core/src/civil/date.rs:1046-1052","code":" 1046 |         if year == b::ISOYear::MAX\n 1047 |             && week == 52\n 1048 |             && weekday.to_monday_zero_offset()\n 1049 |                 > Weekday::Friday.to_monday_zero_offset()\n 1050 |         {\n 1051 |             rbail!(b::WeekdayMondayOne::error());\n 1052 |         }","lines":7,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff-core/src/civil/date.rs#L1046-L1052"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `Parser::parse_numeric` (`crates/jiff/src/fmt/offset.rs:525-538`), when `subminute` is disabled, the code deliberately checks for a trailing `:` to detect \"someone tried to supply more precision than is supported\" and raises the specific `E::SubminutePrecisionNotEnabled` error:\n```rust\nreturn if input.get(0).map_or(false, |&b| b == b':') {\n    Err(Error::from(E::SubminutePrecisionNotEnabled))\n} else {\n    Ok(Parsed { value: numeric, input })\n};\n```\nThis check only covers the *extended* (colon-separated) format. In *basic* format (no colons, e.g. `+021234`), oversupplied seconds digits directly follow the minutes with no `:`, so this check never fires; the two extra digits are silently left as unconsumed trailing input instead of producing the intended, specific error message. This is reachable via `crates/jiff/src/fmt/rfc9557.rs:285-286`, which parses time zone offset annotations with `offset::Parser::new().zulu(false).subminute(false)` and default `Colon::Optional`. Parsing an offset annotation like `[+021234]` (basic format, unwanted seconds) does not surface `SubminutePrecisionNotEnabled`; instead the leftover `\"34\"` is passed on to `parse_tz_annotation_close`, which fails with a generic/confusing \"expected closing bracket\" style error instead of clearly stating that subminute precision isn't allowed here.","fix":"Mirror the basic-format two-digit lookahead already used by `parse_separator` (`crates/jiff/src/fmt/offset.rs:642-645`) so the oversupplied-precision check applies to both extended and basic formats:\n```rust\nif !self.subminute {\n    let oversupplied = if extended {\n        input.get(0).map_or(false, |&b| b == b':')\n    } else {\n        input.len() >= 2 && input[..2].iter().all(u8::is_ascii_digit)\n    };\n    return if oversupplied {\n        Err(Error::from(E::SubminutePrecisionNotEnabled))\n    } else {\n        Ok(Parsed { value: numeric, input })\n    };\n}\n```","locations":[{"ref":"crates/jiff/src/fmt/offset.rs:525-538","code":"  525 |         // If subminute resolution is not supported, then we're done here.\n  526 |         if !self.subminute {\n  527 |             // While we generally try to \"stop\" parsing once we're done\n  528 |             // seeing things we expect, in this case, if we see a colon, it\n  529 |             // almost certainly indicates that someone has tried to provide\n  530 |             // more precision than is supported. So we return an error here.\n  531 |             // If this winds up being problematic, we can make this error\n  532 |             // configurable or remove it altogether (unfortunate).\n  533 |             return if input.get(0).map_or(false, |&b| b == b':') {\n  534 |                 Err(Error::from(E::SubminutePrecisionNotEnabled))\n  535 |             } else {\n  536 |                 Ok(Parsed { value: numeric, input })\n  537 |             };\n  538 |         }","lines":14,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/fmt/offset.rs#L525-L538"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"The shared `timestamp::OptionalVisitor::expecting` implementation (`crates/jiff/src/fmt/serde.rs:448-455`) always writes the literal string `\"an integer number of seconds from the Unix epoch or \\`None\\`\"`, even though the same `OptionalVisitor<V>` type is reused for `millisecond`, `microsecond`, and `nanosecond` (see `crates/jiff/src/fmt/serde.rs:633-637`, `crates/jiff/src/fmt/serde.rs:803-807`, `crates/jiff/src/fmt/serde.rs:973-977`, `crates/jiff/src/fmt/serde.rs:1082-1085`). If a `Deserializer` implementation ever needs to report the expected shape at the \"option\" dispatch level (rather than delegating straight to the inner per-unit `Visitor`), the error message would incorrectly say `seconds` for a field that is actually configured for milliseconds, microseconds, or nanoseconds.","fix":"Make `expecting` unit-aware, e.g. by threading a `&'static str` (or delegating to `self.0.expecting(f)` plus `\" or None\"`) into `OptionalVisitor` at construction time, so the message matches the actual unit for `millisecond`/`microsecond`/`nanosecond` instead of always saying `seconds`.","locations":[{"ref":"crates/jiff/src/fmt/serde.rs:468-475","code":"  468 |         fn expecting(\n  469 |             &self,\n  470 |             f: &mut core::fmt::Formatter,\n  471 |         ) -> core::fmt::Result {\n  472 |             f.write_str(\n  473 |                 \"an integer number of seconds from the Unix epoch or `None`\",\n  474 |             )\n  475 |         }","lines":8,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/fmt/serde.rs#L468-L475"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"In `crates/jiff/src/tz/db/zoneinfo/enabled.rs`, `ZoneInfoName::new` (lines 553-565) computes the full path `full = base.join(time_zone_name)` at line 554, but when `iana_name_from_path(time_zone_name)` fails (e.g. because a path component isn't valid UTF-8), the resulting error is tagged with `.path(base)` at line 556 — i.e. the *zoneinfo root directory* (such as `/usr/share/zoneinfo`) rather than the actual offending file (`full`, or at least `time_zone_name`). This makes the emitted error/log message misleading: it will report that `/usr/share/zoneinfo` itself has a problem, rather than pointing at the specific file with the invalid-UTF-8 name that actually caused the failure, making it much harder to diagnose which file needs to be fixed or excluded.","fix":"Tag the error with the actual offending path (`full`) instead of `base`:\n\n```rust\nfn new(base: &Path, time_zone_name: &Path) -> Result<ZoneInfoName, Error> {\n    let full = base.join(time_zone_name);\n    let original = iana_name_from_path(time_zone_name)\n        .map_err(|err| Error::from(err).path(&full))?;\n    ...\n}\n```","locations":[{"ref":"crates/jiff/src/tz/db/zoneinfo/enabled.rs:553-556","code":"  553 |     fn new(base: &Path, time_zone_name: &Path) -> Result<ZoneInfoName, Error> {\n  554 |         let full = base.join(time_zone_name);\n  555 |         let original = iana_name_from_path(time_zone_name)\n  556 |             .map_err(|err| Error::from(err).path(base))?;","lines":4,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/tz/db/zoneinfo/enabled.rs#L553-L556"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"The `maybe_define_main!` macro generates the non-fuzzing replay binary's `main` as `fn main() { let _ = $crate::shim::main(); }`. `shim::main()` returns `Result<(), Box<dyn Error>>` and can fail via the `?` on `fs::read(testcase)?` inside the `for testcase in env::args_os().skip(1)` loop in `fuzz/fuzz_targets/shim.rs` (e.g. a bad/missing path passed on the command line when replaying a fuzz corpus). Because the generated `main` discards the `Result` with `let _ = ...`, any such I/O error is silently swallowed: nothing is printed and the process still exits with status `0`, indistinguishable from a fully successful \"Executed N testcases successfully!\" run. This defeats the purpose of using this tool to replay/triage crash corpora, since a bad invocation looks identical to success.","fix":"Report the error and use a non-zero exit code instead of discarding it, e.g.:\n```rust\nmacro_rules! maybe_define_main {\n    () => {\n        #[cfg(not(fuzzing))]\n        fn main() {\n            if let Err(e) = $crate::shim::main() {\n                eprintln!(\"error: {e}\");\n                std::process::exit(1);\n            }\n        }\n    };\n}\n```","locations":[{"ref":"fuzz/fuzz_targets/shim.rs:40-48","code":"   40 | #[macro_export]\n   41 | macro_rules! maybe_define_main {\n   42 |     () => {\n   43 |         #[cfg(not(fuzzing))]\n   44 |         fn main() {\n   45 |             let _ = $crate::shim::main();\n   46 |         }\n   47 |     };\n   48 | }","lines":9,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/fuzz/fuzz_targets/shim.rs#L40-L48"},{"ref":"fuzz/fuzz_targets/shim.rs:21-38","code":"   21 | pub fn main() -> Result<(), Box<dyn Error>> {\n   22 |     let mut count = 0usize;\n   23 |     unsafe {\n   24 |         let _ = LLVMFuzzerInitialize(ptr::null(), ptr::null());\n   25 |     }\n   26 |     for testcase in env::args_os().skip(1) {\n   27 |         let content = fs::read(testcase)?;\n   28 |         unsafe {\n   29 |             let _ = rust_fuzzer_test_input(&content);\n   30 |         }\n   31 |         count += 1;\n   32 |     }\n   33 |     println!(\"Executed {count} testcases successfully!\");\n   34 |     if count == 0 {\n   35 |         println!(\"Did you mean to specify a testcase?\");\n   36 |     }\n   37 |     Ok(())\n   38 | }","lines":18,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/fuzz/fuzz_targets/shim.rs#L21-L38"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"`Zoned::iso_week_date` takes `self` by value (`pub fn iso_week_date(self) -> ISOWeekDate`) instead of `&self`, even though every other read-only accessor on `Zoned` in this same `impl` block (`weekday`, `day_of_year`, `days_in_month`, `offset`, etc.) takes `&self`. This signature was evidently copied from `civil::Date::iso_week_date` and `civil::DateTime::iso_week_date` (both identical one-line bodies), but unlike `Date`/`DateTime`, `Zoned` is explicitly documented as *not* implementing `Copy` (see the large design-rationale comment on `ZonedInner`) because it embeds a `TimeZone` (an `Arc`-backed, comparatively heavy value). Consuming `self` here forces any caller who still needs the original `Zoned` afterward to `clone()` it first (cloning the `TimeZone`'s `Arc`, i.e. an atomic refcount bump plus a \"chunky memcpy\" per the type's own doc comment), which is pure waste for what is otherwise a cheap read of the date portion.","fix":"Change the signature to borrow instead of consume, consistent with every other accessor on `Zoned`:\n```rust\npub fn iso_week_date(&self) -> ISOWeekDate {\n    self.date().iso_week_date()\n}\n```\nThis is technically a breaking API change (since some callers might rely on `Zoned` being moved out), but it aligns `Zoned::iso_week_date` with the rest of the type's accessor API and avoids an unnecessary `TimeZone` clone for callers who want to keep using the original `Zoned` value.","locations":[{"ref":"crates/jiff/src/zoned.rs:1977-1980","code":" 1977 |     #[inline]\n 1978 |     pub fn iso_week_date(self) -> ISOWeekDate {\n 1979 |         self.date().iso_week_date()\n 1980 |     }","lines":4,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/zoned.rs#L1977-L1980"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"high","difficulty":"medium","description":"`ParsedTimeZone::parse_time_zone_designations` in `parser.rs` has worst-case `O(tzh_typecnt * tzh_charcnt)` behavior when parsing untrusted TZif data, contradicting the module's own documented guarantee (\"safe to pass arbitrary or even untrusted data ... and count on it not panicking or using resources that are not limited to a small constant factor of the size of the data itself\").\n\nFor each of the `self.types.len()` (i.e. `tzh_typecnt`) local time types, the code does:\n```rust\nlet start = usize::from(self.types[type_index].designation);\nlet suffix = designations.get(start..).ok_or(...)?;\nlet len = suffix.find('\\x00').ok_or(...)?;\n```\n`self.types[type_index].designation` is an attacker-controlled raw byte (`chunk[5]` in `parse_local_time_types`, values `0..=255`) and `designations` (from `tzh_charcnt` bytes) can be made arbitrarily large. `tzh_typecnt` is only bounded by `local_time_types_len() = tzh_typecnt * 6` fitting in the remaining input, so `tzh_typecnt` can also be made large (roughly `N/6` for an `N`-byte file).\n\nAn attacker can craft a TZif file where every local time type uses `designation = 0` and the designations block is a long run of non-NUL bytes ending in a single NUL near the end. Each of the `~N/6` types then triggers a `find('\\x00')` scan over almost the entire `~N/2`-byte designations block, yielding `O(N^2)` total work from a file of only a few MB — a CPU-exhaustion DoS when this parser is fed untrusted/attacker-supplied `.tzif` files (e.g. via `TimeZone::parse`).","fix":"Memoize the designation lookup by `start` offset (there are at most 256 distinct values since `designation` is a `u8`), so each distinct offset is scanned for a NUL terminator at most once instead of once per local time type:\n```rust\nlet designations = String::from_utf8(bytes.to_vec())\n    .map_err(|_| TimeZoneDesignatorError::InvalidUtf8)?;\nlet mut resolved: [Option<u8>; 256] = [None; 256];\nfor type_index in 0..self.types.len() {\n    let start = usize::from(self.types[type_index].designation);\n    let designation = if let Some(d) = resolved[start] {\n        d\n    } else {\n        let suffix = designations\n            .get(start..)\n            .ok_or(TimeZoneDesignatorError::InvalidStart)?;\n        let len = suffix\n            .find('\\\\x00')\n            .ok_or(TimeZoneDesignatorError::MissingNul)?;\n        let end = start\n            .checked_add(len)\n            .ok_or(TimeZoneDesignatorError::InvalidLength)?;\n        u8::try_from(end)\n            .map_err(|_| TimeZoneDesignatorError::InvalidEnd)?;\n        let abbreviation = &designations[start..end];\n        let d = self\n            .find_or_create_designation(abbreviation)\n            .expect(\"there are at most 256 local time types\");\n        resolved[start] = Some(d);\n        d\n    };\n    self.types[type_index].designation = designation;\n}\n```\nThis bounds the total work to `O(tzh_typecnt + 256 * tzh_charcnt)`, i.e. linear in the input size, regardless of how attacker-controlled `designation` offsets are chosen.","locations":[{"ref":"crates/jiff-core/src/tz/tzif/parser.rs:299-334","code":"  299 |     fn parse_time_zone_designations<'b>(\n  300 |         &mut self,\n  301 |         header: &Header,\n  302 |         bytes: &'b [u8],\n  303 |     ) -> Result<&'b [u8], TimeZoneDesignatorError> {\n  304 |         let (bytes, rest) = try_split_at(\n  305 |             SplitAtError::TimeZoneDesignations,\n  306 |             bytes,\n  307 |             header.time_zone_designations_len(),\n  308 |         )?;\n  309 |         let designations = String::from_utf8(bytes.to_vec())\n  310 |             .map_err(|_| TimeZoneDesignatorError::InvalidUtf8)?;\n  311 |         for type_index in 0..self.types.len() {\n  312 |             let start = usize::from(self.types[type_index].designation);\n  313 |             let suffix = designations\n  314 |                 .get(start..)\n  315 |                 .ok_or(TimeZoneDesignatorError::InvalidStart)?;\n  316 |             let len = suffix\n  317 |                 .find('\\x00')\n  318 |                 .ok_or(TimeZoneDesignatorError::MissingNul)?;\n  319 |             let end = start\n  320 |                 .checked_add(len)\n  321 |                 .ok_or(TimeZoneDesignatorError::InvalidLength)?;\n  322 |             u8::try_from(end)\n  323 |                 .map_err(|_| TimeZoneDesignatorError::InvalidEnd)?;\n  324 |             let abbreviation = &designations[start..end];\n  325 |             // This unwrap is OK because if this fails, it implies that there\n  326 |             // must be an `end` offset greater than 256. But the error check\n  327 |             // above handles that case.\n  328 |             let designation = self\n  329 |                 .find_or_create_designation(abbreviation)\n  330 |                 .expect(\"there are at most 256 local time types\");\n  331 |             self.types[type_index].designation = designation;\n  332 |         }\n  333 |         Ok(rest)\n  334 |     }","lines":36,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff-core/src/tz/tzif/parser.rs#L299-L334"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`jiff-diesel`'s PostgreSQL `Timestamp::from_sql` (`postgres.rs:39-51`) reconstructs the PostgreSQL epoch on every single decode call via a fallible runtime conversion plus `unwrap()`:\n```rust\nlet epoch =\n    jiff::Timestamp::from_second(POSTGRES_EPOCH_TIMESTAMP).unwrap();\nOk(epoch.checked_add(micros)?.to_diesel())\n```\nwhere `POSTGRES_EPOCH_TIMESTAMP: i64 = 946684800` (`postgres.rs:23`). The sibling `jiff-sqlx` crate implements the exact same conversion (`jiff-sqlx/src/postgres.rs:25-26,101-104`) but computes the epoch once as a compile-time constant:\n```rust\nstatic POSTGRES_EPOCH_TIMESTAMP: jiff::Timestamp =\n    jiff::Timestamp::constant(946684800, 0);\n...\nOk(POSTGRES_EPOCH_TIMESTAMP.checked_add(micros)?.to_sqlx())\n```\nThis is copy-paste drift between the two near-identical wrapper crates: `jiff-diesel` does unnecessary repeated work (and carries an avoidable `unwrap()`) on every row decoded, where `jiff-sqlx` does it correctly once at compile time.","fix":"Mirror `jiff-sqlx`'s approach and make the epoch a compile-time `Timestamp` constant:\n```rust\n// Before:\nstatic POSTGRES_EPOCH_TIMESTAMP: i64 = 946684800;\n...\nimpl FromSql<sql_types::Timestamptz, Pg> for Timestamp {\n    fn from_sql(bytes: PgValue<'_>) -> deserialize::Result<Timestamp> {\n        let PgTimestamp(micros) =\n            FromSql::<sql_types::Timestamptz, Pg>::from_sql(bytes)?;\n        let micros = jiff::SignedDuration::from_micros(micros);\n        let epoch =\n            jiff::Timestamp::from_second(POSTGRES_EPOCH_TIMESTAMP).unwrap();\n        Ok(epoch.checked_add(micros)?.to_diesel())\n    }\n}\n\n// After:\nstatic POSTGRES_EPOCH_TIMESTAMP: jiff::Timestamp =\n    jiff::Timestamp::constant(946684800, 0);\n...\nimpl FromSql<sql_types::Timestamptz, Pg> for Timestamp {\n    fn from_sql(bytes: PgValue<'_>) -> deserialize::Result<Timestamp> {\n        let PgTimestamp(micros) =\n            FromSql::<sql_types::Timestamptz, Pg>::from_sql(bytes)?;\n        let micros = jiff::SignedDuration::from_micros(micros);\n        Ok(POSTGRES_EPOCH_TIMESTAMP.checked_add(micros)?.to_diesel())\n    }\n}\n```","locations":[{"ref":"crates/jiff-diesel/src/postgres.rs:23","code":"   23 | static POSTGRES_EPOCH_TIMESTAMP: i64 = 946684800;","lines":1,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff-diesel/src/postgres.rs#L23"},{"ref":"crates/jiff-diesel/src/postgres.rs:39-51","code":"   39 | impl FromSql<sql_types::Timestamptz, Pg> for Timestamp {\n   40 |     fn from_sql(bytes: PgValue<'_>) -> deserialize::Result<Timestamp> {\n   41 |         // The encoding is the number of *microseconds* since\n   42 |         // POSTGRES_EPOCH_DATETIME.\n   43 |         let PgTimestamp(micros) =\n   44 |             FromSql::<sql_types::Timestamptz, Pg>::from_sql(bytes)?;\n   45 |         let micros = jiff::SignedDuration::from_micros(micros);\n   46 |         // OK because the timestamp is known to be valid and in range.\n   47 |         let epoch =\n   48 |             jiff::Timestamp::from_second(POSTGRES_EPOCH_TIMESTAMP).unwrap();\n   49 |         Ok(epoch.checked_add(micros)?.to_diesel())\n   50 |     }\n   51 | }","lines":13,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff-diesel/src/postgres.rs#L39-L51"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"The `-v`/`--verbose` flag is parsed and stored into `Config.verbose` in `crates/jiff-cli/cmd/generate/crc32.rs`, `crates/jiff-cli/cmd/generate/unit_designator_match.rs`, and `crates/jiff-cli/cmd/generate/windows_zones.rs`, and is advertised in each command's `--help` output, but `config.verbose` (or `self.verbose`) is never read anywhere else in any of the three files, so passing `-v`/`--verbose` to `jiff-cli generate crc32`, `jiff-cli generate unit-designator-match`, or `jiff-cli generate windows-zones` silently has no effect. By contrast, the sibling commands `crates/jiff-cli/cmd/generate/tzdb.rs` and `crates/jiff-cli/cmd/generate/zoneinfo.rs` do check `config.verbose` before printing extra diagnostic output, showing the flag was intended to do something in all five commands.","fix":"Either wire up `config.verbose` in these three commands to print the same kind of diagnostic output that `tzdb.rs` and `zoneinfo.rs` do (e.g. echo the resolved paths/settings being used when `--verbose` is passed), or remove the dead `-v`/`--verbose` option (and its `Usage` entry) from these commands so the `--help` text doesn't advertise a no-op flag.","locations":[{"ref":"crates/jiff-cli/cmd/generate/crc32.rs:66","code":"   66 |     verbose: bool,","lines":1,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff-cli/cmd/generate/crc32.rs#L66"},{"ref":"crates/jiff-cli/cmd/generate/crc32.rs:88-90","code":"   88 |             Arg::Short('v') | Arg::Long(\"verbose\") => {\n   89 |                 self.verbose = true;\n   90 |             }","lines":3,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff-cli/cmd/generate/crc32.rs#L88-L90"},{"ref":"crates/jiff-cli/cmd/generate/unit_designator_match.rs:58","code":"   58 |     verbose: bool,","lines":1,"link":"https://github.com/BurntSushi/ {"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`cargo_fmt` in `crates/jiff-cli/cmd/generate/mod.rs` is defined and marked `#[allow(dead_code)]`, but it is never called anywhere in the `jiff-cli` crate (only `super::rustfmt` is used by every `generate` subcommand). The `#[allow(dead_code)]` attribute exists specifically to suppress the compiler warning that would otherwise flag this as unused.","fix":"Delete the unused function (and its `#[allow(dead_code)]` attribute) entirely:\n\n```rust\n/// Run rustfmt on the given crate.\n///\n/// I'm not sure why, but running `rustfmt` on files directly sometimes\n/// produces different output than running `cargo fmt`. Maybe `rustfmt`\n/// isn't respecting the configuration somehow?\n#[allow(dead_code)]\nfn cargo_fmt(krate: &str) -> anyhow::Result<()> {\n    use std::process::Command;\n\n    let out = Command::new(\"cargo\")\n        .arg(\"fmt\")\n        .arg(\"-p\")\n        .arg(krate)\n        .output()\n        .context(\"`cargo fmt` command failed\")?;\n    anyhow::ensure!(\n        out.status.success(),\n        \"cargo fmt -p {krate}: {}\",\n        bstr::BString::from(out.stderr),\n    );\n    Ok(())\n}\n```\n\nIf `cargo_fmt` is meant to be kept for future use, at least leave a comment explaining why it's retained despite having no call sites; otherwise remove it.","locations":[{"ref":"crates/jiff-cli/cmd/generate/mod.rs:37-58","code":"   37 | /// Run rustfmt on the given crate.\n   38 | ///\n   39 | /// I'm not sure why, but running `rustfmt` on files directly sometimes\n   40 | /// produces different output than running `cargo fmt`. Maybe `rustfmt`\n   41 | /// isn't respecting the configuration somehow?\n   42 | #[allow(dead_code)]\n   43 | fn cargo_fmt(krate: &str) -> anyhow::Result<()> {\n   44 |     use std::process::Command;\n   45 | \n   46 |     let out = Command::new(\"cargo\")\n   47 |         .arg(\"fmt\")\n   48 |         .arg(\"-p\")\n
