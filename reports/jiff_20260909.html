<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`Span::checked_add_invariant_duration` (called from `Span::checked_add_duration`, which backs the public `Span::checked_add`/`Span::checked_sub` when a `SignedDuration` or `std::time::Duration` argument is added without a relative datetime and the span's largest unit is invariant) computes `let sum = self_duration + rhs_duration;` using the `+` operator on `SignedDuration`. `SignedDuration`'s `Add` implementation (`crates/jiff/src/signed_duration.rs:2612-2619`) panics on overflow via `.expect(\"overflow when adding signed durations\")` rather than returning a `Result`.\n\nThe comment above the line claims `// OK because maximal invariant Span is way below maximal SignedDuration. Doubling it can never overflow.` This reasoning only holds when `rhs_duration` is itself derived from another bounded `Span` (as in `checked_add_invariant`, which calls `self.checked_add_invariant_duration(unit, span.to_invariant_duration())`). But `checked_add_invariant_duration` is also called directly from `checked_add_duration` with an arbitrary, caller-supplied `SignedDuration` (e.g. from `span.checked_add(SignedDuration::MAX)` or `span.checked_sub(SignedDuration::MIN)`), which is not bounded by `Span`'s limits at all. When `rhs_duration` is close to `SignedDuration::MAX`/`MIN`, adding even a small `self_duration` (e.g. from `1.hour()`) overflows `SignedDuration`'s internal range and panics.\n\nThis was confirmed to reproduce a real panic:\n```rust\nlet s = jiff::ToSpan::hour(1);\ns.checked_add(jiff::SignedDuration::MAX); // panics: \"overflow when adding signed durations\"\n\nlet s = jiff::ToSpan::hour(-1);\ns.checked_add(jiff::SignedDuration::MIN); // panics: \"overflow when adding signed durations\"\n```\nThis violates the contract of a `checked_*` API, which is documented to return `Result<Span, Error>` on overflow rather than panic.","fix":"Use the checked/fallible form of addition and propagate the error instead of relying on the panicking `Add` impl, e.g.:\n```rust\nfn checked_add_invariant_duration(\n    &self,\n    unit: Unit,\n    rhs_duration: SignedDuration,\n) -> Result<Span, Error> {\n    assert!(unit <= Unit::Week);\n    let self_duration = self.to_invariant_duration();\n    let sum = self_duration\n        .checked_add(rhs_duration)\n        .ok_or_else(|| /* appropriate overflow Error */)?;\n    Span::from_invariant_duration(unit, sum)\n}\n```\nAlso correct or remove the misleading `// OK because ... doubling it can never overflow` comment, since `rhs_duration` is not always bounded like `self_duration` is.","locations":[{"ref":"crates/jiff/src/span.rs:1828-1840","code":" 1828 |     #[inline]\n 1829 |     fn checked_add_invariant_duration(\n 1830 |         &self,\n 1831 |         unit: Unit,\n 1832 |         rhs_duration: SignedDuration,\n 1833 |     ) -> Result<Span, Error> {\n 1834 |         assert!(unit <= Unit::Week);\n 1835 |         let self_duration = self.to_invariant_duration();\n 1836 |         // OK because maximal invariant `Span` is way below maximal\n 1837 |         // `SignedDuration`. Doubling it can never overflow.\n 1838 |         let sum = self_duration + rhs_duration;\n 1839 |         Span::from_invariant_duration(unit, sum)\n 1840 |     }","lines":13,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/span.rs#L1828-L1840"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"medium","difficulty":"hard","description":"In `ZonedDifference::until_with_largest_unit` (used internally by the public, `Result`-returning `Zoned::until` and `Zoned::since`), there are two `panic!` calls guarding a correction step in the day-alignment algorithm, both explicitly marked `// FIXME` by the author with the message `\"this should be an error\"` / `\"this should be an error too\"`. When the largest requested unit is `Unit::Day` or bigger and the two zoned datetimes are in the same time zone, the code computes an intermediate \"mid\" datetime and applies up to one day-correction to align it with the expected `Sign`. If, after that correction, the sign still does not match expectations, the code panics instead of returning an `Err`. Additionally, the two branches are asymmetric: when `sign.is_negative()` (reachable via ordinary calls such as `later.until((Unit::Year, &earlier))`, where `other` occurs before the receiver), the code panics immediately on the very first mismatch without even attempting the day correction that the positive-sign case gets, whereas the positive-sign case gets one correction attempt before its own (unconditional) second `panic!`. Both `Zoned::until` and `Zoned::since` are public, documented as returning `Result<Span, Error>`, and their documentation does not disclose any panicking behavior for non-default configurations (only that an `Err` may be returned) - so a caller following the documented contract cannot anticipate this panic. This was tested against real IANA time zone data across ~100M date/timezone/largest-unit combinations without reproducing the panic, so it appears to be unreachable with current real-world TZif data, but the asymmetric handling of the negative `sign` case and the author's own \"should be an error\" annotations indicate the invariant is not proven, only assumed.","fix":"Replace both `panic!` calls with a proper error return (e.g. a new `E::AmbiguousDifference` or similar variant threaded through `Result<Span, Error>`), matching the surrounding code's `.context(...)?` style instead of `panic!`. Also make the negative-sign branch symmetric with the positive-sign branch (i.e. attempt the same one-step day correction before giving up), for example:\n```rust\nif Sign::from_ordinals(zdt2, &zmid) == -sign {\n    day_correct += 1;\n    mid = dt2\n        .date()\n        .checked_add(Span::new().days(day_correct * -sign))\n        .context(E::AddDays)?\n        .to_datetime(dt1.time());\n    zmid = mid.to_zoned(tz.clone()).context(E::ConvertIntermediateDatetime)?;\n    if Sign::from_ordinals(zdt2, &zmid) == -sign {\n        return Err(Error::from(E::FailedDayAlignment));\n    }\n}\n```\nso that `Zoned::until`/`Zoned::since` never panic regardless of which datetime is earlier.","locations":[{"ref":"crates/jiff/src/zoned.rs:4429-4446","code":" 4429 |         if Sign::from_ordinals(zdt2, &zmid) == -sign {\n 4430 |             if sign.is_negative() {\n 4431 |                 // FIXME\n 4432 |                 panic!(\"this should be an error\");\n 4433 |             }\n 4434 |             day_correct += 1;\n 4435 |             mid = dt2\n 4436 |                 .date()\n 4437 |                 .checked_add(Span::new().days(day_correct * -sign))\n 4438 |                 .context(E::AddDays)?\n 4439 |                 .to_datetime(dt1.time());\n 4440 |             zmid = mid\n 4441 |                 .to_zoned(tz.clone())\n 4442 |                 .context(E::ConvertIntermediateDatetime)?;\n 4443 |             if Sign::from_ordinals(zdt2, &zmid) == -sign {\n 4444 |                 // FIXME\n 4445 |                 panic!(\"this should be an error too\");\n 4446 |             }","lines":18,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/zoned.rs#L4429-L4446"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"low","difficulty":"hard","description":"In `Parser::parse_time_zone_annotation` (`crates/jiff/src/fmt/rfc9557.rs:301-323`), the IANA time zone name slice collected by `mkiana(input)` is converted with `core::str::from_utf8(mkiana(input)).expect(\"ASCII\")` at `crates/jiff/src/fmt/rfc9557.rs:323`. This currently cannot panic because every byte accepted by `parse_tz_annotation_leading_char`/`parse_tz_annotation_char` (and the `/` separator) is restricted to the ASCII set (`_`, `.`, `+`, `-`, `0`-`9`, `A`-`Z`, `a`-`z`, `/`). However, the safety of the `.expect(\"ASCII\")` call is an implicit invariant coupled to those two character-class functions elsewhere in the file; if either character class is ever widened (e.g. to support additional non-ASCII TZ component characters) without updating this call site, `core::str::from_utf8` would fail on malformed/attacker-controlled input and this would panic instead of returning a parse error.","fix":"Replace `.expect(\"ASCII\")` with a proper fallible conversion (e.g. map a `Utf8Error` to the crate's own `Error` type via `core::str::from_utf8(mkiana(input)).map_err(|_| Error::from(...))?`), so that if the ASCII-only invariant is ever broken by a future change to `parse_tz_annotation_leading_char`/`parse_tz_annotation_char`, malformed input produces a normal parse error instead of a panic.","locations":[{"ref":"crates/jiff/src/fmt/rfc9557.rs:323","code":"  323 |         let iana_name = core::str::from_utf8(mkiana(input)).expect(\"ASCII\");","lines":1,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/fmt/rfc9557.rs#L323"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"`ArrayStr::<N>::new` and `ArrayStr::<N>::push_str` in `util/mod.rs` truncate the string length into the `len: u8` field via `len as u8` / `new_len as u8` without ever checking that the length actually fits in a `u8`. The only thing preventing this from truncating is `debug_assert!(N <= u8::MAX as usize, ...)`, which is compiled out in release builds.\n\n`ArrayStr<N>` and `SmallStr<N>` are `pub` types (`pub mod util;` in `lib.rs`), so any downstream crate can legally instantiate e.g. `ArrayStr::<1000>` or `SmallStr::<1000>`. In a release build, calling `ArrayStr::<1000>::new(s)` with a 300-byte `s` passes the `len > N` check (`300 <= 1000`), writes all 300 bytes into `bytes`, then stores `len: 300u8 as u8` which wraps to `44`. `ArrayStr::as_str` (`util/mod.rs:428-447`) then does:\n```rust\nunsafe {\n    core::str::from_utf8_unchecked(core::slice::from_raw_parts(\n        self.bytes.as_ptr(),\n        self.len as usize,\n    ))\n}\n```\ni.e. it reinterprets the first 44 bytes of a valid 300-byte UTF-8 string as a `str`. Since 44 is an arbitrary byte offset, it is not guaranteed to land on a UTF-8 char boundary, so this can produce a `&str` that is not valid UTF-8 — undefined behavior at the `from_utf8_unchecked` call site, and a soundness hole reachable from 100% safe downstream code (no `unsafe` needed by the caller). This is most likely to bite `no_std`/no-`alloc` consumers, who are exactly the ones motivated to pick a large fixed `N` since they have no heap fallback.","fix":"Reject lengths that don't fit in `u8` instead of relying on a `debug_assert!` over `N`:\n```rust\n// Before (ArrayStr::new):\npub const fn new(s: &str) -> Option<ArrayStr<N>> {\n    let len = s.len();\n    if len > N {\n        return None;\n    }\n    ...\n    debug_assert!(N <= u8::MAX as usize, \"size of ArrayStr is too big\");\n    Some(ArrayStr { len: len as u8, bytes })\n}\n\n// After:\npub const fn new(s: &str) -> Option<ArrayStr<N>> {\n    let len = s.len();\n    if len > N || len > u8::MAX as usize {\n        return None;\n    }\n    ...\n    Some(ArrayStr { len: len as u8, bytes })\n}\n```\nAnd similarly in `push_str`:\n```rust\n// Before:\nif new_len > N {\n    return false;\n}\n\n// After:\nif new_len > N || new_len > u8::MAX as usize {\n    return false;\n}\n```","locations":[{"ref":"crates/jiff-core/src/util/mod.rs:372-394","code":"  372 | impl<const N: usize> ArrayStr<N> {\n  373 |     /// Creates a new fixed capacity string.\n  374 |     ///\n  375 |     /// If the given string exceeds `N` bytes, then this returns\n  376 |     /// `None`.\n  377 |     #[inline]\n  378 |     pub const fn new(s: &str) -> Option<ArrayStr<N>> {\n  379 |         let len = s.len();\n  380 |         if len > N {\n  381 |             return None;\n  382 |         }\n  383 |         let mut bytes = [0; N];\n  384 |         let mut i = 0;\n  385 |         while i < s.as_bytes().len() {\n  386 |             bytes[i] = s.as_bytes()[i];\n  387 |             i += 1;\n  388 |         }\n  389 |         // OK because we don't ever use anything bigger than u8::MAX for `N`.\n  390 |         // And we probably shouldn't, because that would be a pretty chunky\n  391 |         // array. If such a thing is needed, please file an issue to discuss.\n  392 |         debug_assert!(N <= u8::MAX as usize, \"size of ArrayStr is too big\");\n  393 |         Some(ArrayStr { len: len as u8, bytes })\n  394 |     }","lines":23,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff-core/src/util/mod.rs#L372-L394"},{"ref":"crates/jiff-core/src/util/mod.rs:402-426","code":"  402 |     /// Append the bytes given to the end of this string.\n  403 |     ///\n  404 |     /// If the capacity would be exceeded, then this is a no-op and `false`\n  405 |     /// is returned. Otherwise, all of `s` is written to this array string and\n  406 |     /// `true` is returned.\n  407 |     #[inline]\n  408 |     pub fn push_str(&mut self, s: &str) -> bool {\n  409 |         let len = self.len as usize;\n  410 |         let Some(new_len) = len.checked_add(s.len()) else { return false };\n  411 |         if new_len > N {\n  412 |             return false;\n  413 |         }\n  414 | \n  415 |         let mut i = len;\n  416 |         while i < new_len {\n  417 |             self.bytes[i] = s.as_bytes()[i - len];\n  418 |             i += 1;\n  419 |         }\n  420 |         // OK because we don't ever use anything bigger than u8::MAX for `N`.\n  421 |         // And we probably shouldn't, because that would be a pretty chunky\n  422 |         // array. If such a thing is needed, please file an issue to discuss.\n  423 |         debug_assert!(N <= u8::MAX as usize, \"size of ArrayStr is too big\");\n  424 |         self.len = new_len as u8;\n  425 |         true\n  426 |     }","lines":25,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff-core/src/util/mod.rs#L402-L426"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`crates/jiff-core/src/bounds.rs` defines `impl Mul<iN> for Sign` / `impl Mul<Sign> for iN` for `N` in `{8,16,32,64,128}` (e.g. `fn mul(self, n: i8) -> i8 { self.as_i8() * n }`). When `self` is `Sign::Negative` (`as_i8() == -1`) and `n` is the primitive type's `MIN` value (e.g. `i8::MIN == -128`), the multiplication `-1 * -128 == 128` overflows the type's range (`i8::MAX == 127`). This panics in debug builds and silently produces the wrong (wrapped) result in release builds. The same class of bug affects the `i16`, `i32`, `i64` and `i128` impls in the same block, since `Sign::Negative * <type>::MIN` always overflows by one for every signed integer width.","fix":"Either document that these operators must not be called with the underlying primitive's `MIN` value, or make the overflow explicit instead of silent, e.g.:\n\n```rust\nimpl core::ops::Mul<i8> for Sign {\n    type Output = i8;\n\n    #[inline]\n    fn mul(self, n: i8) -> i8 {\n        self.as_i8().checked_mul(n).expect(\"Sign multiplication overflowed i8\")\n    }\n}\n```\n\nrepeated for each of `i16`/`i32`/`i64`/`i128`, so the failure is an explicit, documented panic rather than a silent wraparound in release builds.","locations":[{"ref":"crates/jiff-core/src/bounds.rs:1243-1331","code":" 1243 | impl core::ops::Mul<i8> for Sign {\n 1244 |     type Output = i8;\n 1245 | \n 1246 |     #[inline]\n 1247 |     fn mul(self, n: i8) -> i8 {\n 1248 |         self.as_i8() * n\n 1249 |     }\n 1250 | }\n 1251 | \n 1252 | impl core::ops::Mul<Sign> for i8 {\n 1253 |     type Output = i8;\n 1254 | \n 1255 |     #[inline]\n 1256 |     fn mul(self, n: Sign) -> i8 {\n 1257 |         self * n.as_i8()\n 1258 |     }\n 1259 | }\n 1260 | \n 1261 | impl core::ops::Mul<i16> for Sign {\n 1262 |     type Output = i16;\n 1263 | \n 1264 |     #[inline]\n 1265 |     fn mul(self, n: i16) -> i16 {\n 1266 |         self.as_i16() * n\n 1267 |     }\n 1268 | }\n 1269 | \n 1270 | impl core::ops::Mul<Sign> for i16 {\n 1271 |     type Output = i16;\n 1272 | \n 1273 |     #[inline]\n 1274 |     fn mul(self, n: Sign) -> i16 {\n 1275 |         self * n.as_i16()\n 1276 |     }\n 1277 | }\n 1278 | \n 1279 | impl core::ops::Mul<i32> for Sign {\n 1280 |     type Output = i32;\n 1281 | \n 1282 |     #[inline]\n 1283 |     fn mul(self, n: i32) -> i32 {\n 1284 |         self.as_i32() * n\n 1285 |     }\n 1286 | }\n 1287 | \n 1288 | impl core::ops::Mul<Sign> for i32 {\n 1289 |     type Output = i32;\n 1290 | \n 1291 |     #[inline]\n 1292 |     fn mul(self, n: Sign) -> i32 {\n 1293 |         self * n.as_i32()\n 1294 |     }\n 1295 | }\n 1296 | \n 1297 | impl core::ops::Mul<i64> for Sign {\n 1298 |     type Output = i64;\n 1299 | \n 1300 |     #[inline]\n 1301 |     fn mul(self, n: i64) -> i64 {\n 1302 |         self.as_i64() * n\n 1303 |     }\n 1304 | }\n 1305 | \n 1306 | impl core::ops::Mul<Sign> for i64 {\n 1307 |     type Output = i64;\n 1308 | \n 1309 |     #[inline]\n 1310 |     fn mul(self, n: Sign) -> i64 {\n 1311 |         self * n.as_i64()\n 1312 |     }\n 1313 | }\n 1314 | \n 1315 | impl core::ops::Mul<i128> for Sign {\n 1316 |     type Output = i128;\n 1317 | \n 1318 |     #[inline]\n 1319 |     fn mul(self, n: i128) -> i128 {\n 1320 |         self.as_i128() * n\n 1321 |     }\n 1322 | }\n 1323 | \n 1324 | impl core::ops::Mul<Sign> for i128 {\n 1325 |     type Output = i128;\n 1326 | \n 1327 |     #[inline]\n 1328 |     fn mul(self, n: Sign) -> i128 {\n 1329 |         self * n.as_i128()\n 1330 |     }\n 1331 | }","lines":89,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff-core/src/bounds.rs#L1243-L1331"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"`tzif::Timestamp::saturating_add` in `crates/jiff-core/src/tz/tzif/mod.rs` is documented as \"Adds the number of seconds to this timestamp, saturating at the minimum or maximum legal value,\" but the implementation performs a plain, unchecked `i64` addition before comparing against the bounds:\n\n```rust\nconst fn saturating_add(self, seconds: i64) -> Timestamp {\n    let second = self.as_second() + seconds;\n    if second > Timestamp::MAX.as_second() {\n        Timestamp::MAX\n    } else if second < Timestamp::MIN.as_second() {\n        Timestamp::MIN\n    } else {\n        Timestamp { second }\n    }\n}\n```\n\nIf `self.as_second() + seconds` itself overflows `i64` (e.g. `self` near `Timestamp::MAX` and `seconds` close to `i64::MAX`), this is an arithmetic-overflow panic in debug builds, and a silent two's-complement wraparound in release builds that can flip the sign and produce a value that incorrectly passes the subsequent bounds check (defeating the \"saturating\" contract entirely and returning a bogus `Timestamp` instead of clamping to `Timestamp::MIN`/`MAX`). Currently the only call site (`crates/jiff-core/src/tz/tzif/query.rs:207`, `timestamp.saturating_add(1)`) passes a small constant, so this is not exploitable today, but the method is named and documented as if it were safe for arbitrary `seconds`, which is a latent footgun for any future caller.","fix":"Use `i64::saturating_add` (or `checked_add` plus explicit clamping) so the method actually lives up to its name for any input:\n\n```rust\nconst fn saturating_add(self, seconds: i64) -> Timestamp {\n    let second = self.as_second().saturating_add(seconds);\n    if second > Timestamp::MAX.as_second() {\n        Timestamp::MAX\n    } else if second < Timestamp::MIN.as_second() {\n        Timestamp::MIN\n    } else {\n        Timestamp { second }\n    }\n}\n```","locations":[{"ref":"crates/jiff-core/src/tz/tzif/mod.rs:429-438","code":"  429 |     const fn saturating_add(self, seconds: i64) -> Timestamp {\n  430 |         let second = self.as_second() + seconds;\n  431 |         if second > Timestamp::MAX.as_second() {\n  432 |             Timestamp::MAX\n  433 |         } else if second < Timestamp::MIN.as_second() {\n  434 |             Timestamp::MIN\n  435 |         } else {\n  436 |             Timestamp { second }\n  437 |         }\n  438 |     }","lines":10,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff-core/src/tz/tzif/mod.rs#L429-L438"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"critical","difficulty":"very_easy","description":"`DateTimeRound::round` (used by `DateTime::round` and, transitively, by `Zoned::round`) multiplies the day-rollover carry by `Sign::from(dt.date().year())` instead of always applying it as a positive carry. `days` returned from `time_rounded.as_civil_days_with_remainder()` is always `0` or `1` (rounding a non-negative time-of-day can only ever roll forward into the next day, never backward), so multiplying it by the sign of the *year* is nonsensical and corrupts the result for every datetime whose year is `<= 0`:\n- For `year == 0`, `Sign::Zero` forces `days` to `0`, so a rounding operation that should roll over into the next day silently loses the day increment.\n- For `year < 0`, `Sign::Negative` flips `+1` into `-1`, so the code subtracts a day from `start` instead of adding one, landing on the wrong date entirely (two days off from the correct answer).\n\nThis was verified empirically:\n```\ndate(-2024, 6, 19).at(23, 59, 59, 999_999_999).round(Unit::Second)\n  => -002024-06-18T00:00:00   (should be -002024-06-20T00:00:00)\n\ndate(0, 6, 19).at(23, 59, 59, 999_999_999).round(Unit::Second)\n  => 0000-06-19T00:00:00      (should be 0000-06-20T00:00:00, i.e. no rollover happened)\n\ndate(1, 6, 19).at(23, 59, 59, 999_999_999).round(Unit::Second)\n  => 0001-06-20T00:00:00      (correct, since sign is Positive here)\n```\nThis affects `DateTime::round`, and since `crates/jiff/src/civil/datetime.rs:3568` documents that this same routine is reused for `Zoned` rounding, it likely also silently corrupts `Zoned::round` results for zoned datetimes in years `<= 0`.","fix":"Drop the spurious multiplication by `Sign::from(dt.date().year())` entirely; `days` (0 or 1) should be added to `days_len` unmodified, regardless of the sign of the year.\n\n```rust\n// Before:\nlet increment =\n    Increment::for_datetime(self.smallest, self.increment)?;\nlet time_nanos = dt.time().to_duration();\nlet sign = Sign::from(dt.date().year());\nlet time_rounded = increment.round(self.mode, time_nanos)?;\nlet (days, time_nanos) = time_rounded.as_civil_days_with_remainder();\n// OK because `abs(days)` here can never be greater than 1. ...\nlet days = sign * days;\n\n// After:\nlet increment =\n    Increment::for_datetime(self.smallest, self.increment)?;\nlet time_nanos = dt.time().to_duration();\nlet time_rounded = increment.round(self.mode, time_nanos)?;\nlet (days, time_nanos) = time_rounded.as_civil_days_with_remainder();\n// `days` is always 0 or 1 here: rounding a non-negative `time_nanos`\n// (which is always less than one civil day) can only ever roll forward\n// into the next day, never backward. There is no need to adjust it by\n// the sign of the year.\n```\nAlso remove the now-unused `use jcore::bounds::Sign` import if it becomes unused elsewhere in the file after this change (it is still used at `crates/jiff/src/civil/datetime.rs:3287` and `3289`, so the import itself stays, only the `sign` binding in `round` is removed).","locations":[{"ref":"crates/jiff/src/civil/datetime.rs:3578-3589","code":" 3578 |         let increment =\n 3579 |             Increment::for_datetime(self.smallest, self.increment)?;\n 3580 |         let time_nanos = dt.time().to_duration();\n 3581 |         let sign = Sign::from(dt.date().year());\n 3582 |         let time_rounded = increment.round(self.mode, time_nanos)?;\n 3583 |         let (days, time_nanos) = time_rounded.as_civil_days_with_remainder();\n 3584 |         // OK because `abs(days)` here can never be greater than 1. Namely,\n 3585 |         // rounding time increments are limited to values that divide evenly\n 3586 |         // into the corresponding maximal value. And a `day` increment is\n 3587 |         // limited to `1`. So even starting with the maximal `dt.time()` value\n 3588 |         // (the last nanosecond in a civil day), we can never round past 1 day.\n 3589 |         let days = sign * days;","lines":12,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/civil/datetime.rs#L3578-L3589"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`Timestamp::from_nanosecond` in `crates/jiff-core/src/timestamp.rs` is documented as a \"semver guarantee\" that it only returns an `Err` when the given nanosecond value corresponds to an instant outside `Timestamp::MIN..=Timestamp::MAX` (see the equivalent public doc comment in `crates/jiff/src/timestamp.rs` around `from_nanosecond`). However, the actual bounds check only verifies that the derived `secs` value fits inside `i64::MIN..=i64::MAX`:\n\n```rust\nlet secs = nanosecond / NANOS_PER_SEC;\nif !(i64::MIN as i128 <= secs && secs <= i64::MAX as i128) {\n    rbail!(b::SpecialBoundsError::UnixEpochNanoseconds);\n}\nlet secs64 = secs as i64;\n```\n\nThis is far too permissive: `i64`'s range is roughly `+-9.2e18`, while the real valid range for `Timestamp` seconds (`b::UnixEpochSeconds::MIN..=MAX`) is only about `+-3.8e11` (roughly the years -9999..=9999, matching `Timestamp::MIN`/`Timestamp::MAX`). So any `nanosecond` whose corresponding `secs` lies between those two ranges (e.g. `nanosecond = 1_000_000_000_000_000_000_000_000i128`, giving `secs = 1_000_000_000_000_000` - about 31.7 million years) passes the check and is then handed straight to `Timestamp::new_unchecked(secs64, nanosecond)` without ever calling `b::UnixEpochSeconds::checkc`. `new_unchecked`'s own `debug_assert!(b::UnixEpochSeconds::checkc(secs).is_ok())` means this panics in debug builds, and in release builds it silently constructs a `Timestamp` whose `second` field violates its documented invariant. That corrupted value later causes `unwrapr!` panics (e.g. in `Offset::to_datetime` in `crates/jiff-core/src/tz/offset.rs`, via `civil::UnixEpochDay::new(epoch_day)`) as soon as it is formatted or converted to a civil datetime. Since `Timestamp::from_nanosecond` is reachable from fully-safe public API (including `crates/jiff/src/fmt/serde.rs`, which deserializes untrusted nanosecond timestamps), this is a real panic/DoS vector on attacker-controlled input, and it breaks the documented semver contract that only out-of-range inputs cause an error.\n\nCompare with the sibling constructors in the same file: `Timestamp::from_second`, `from_millisecond`, and `from_microsecond` all call the properly-scoped bound check (`b::UnixEpochSeconds::checkc`, `b::UnixEpochMilliseconds::checkc`, `b::UnixEpochMicroseconds::checkc` respectively) before constructing. `from_nanosecond` is the only one that skips this, even though `bounds.rs` already defines a dedicated `SpecialBoundsError::UnixEpochNanoseconds` error variant whose `Display` message describes the *correct* narrow range (`UnixEpochMicroseconds::MIN/MAX * NANOS_PER_MICRO`) - strongly suggesting the intended check was simply never wired up.","fix":"Validate `secs64` against the real `Timestamp` bounds before constructing, the same way `from_second` does:\n\n```rust\npub const fn from_nanosecond(\n    nanosecond: i128,\n) -> Result<Timestamp, RangeError> {\n    const NANOS_PER_SEC: i128 = c::NANOS_PER_SEC as i128;\n    // OK because NANOS_PER_SEC!={-1,0}.\n    let secs = nanosecond / NANOS_PER_SEC;\n    // RUST: Use `i64::try_from` when available in `const`.\n    if !(i64::MIN as i128 <= secs && secs <= i64::MAX as i128) {\n        rbail!(b::SpecialBoundsError::UnixEpochNanoseconds);\n    }\n    let secs64 = secs as i64;\n    // NEW: actually enforce Timestamp's real bounds, not just \"fits in i64\".\n    if b::UnixEpochSeconds::checkc(secs64).is_err() {\n        rbail!(b::SpecialBoundsError::UnixEpochNanoseconds);\n    }\n    // OK because NANOS_PER_SEC!={-1,0}.\n    let nanosecond = (nanosecond % NANOS_PER_SEC) as i32;\n    Ok(Timestamp::new_unchecked(secs64, nanosecond))\n}\n```\n\nAdd a regression test asserting `Timestamp::from_nanosecond(1_000_000_000_000_000_000_000_000).is_err()` (or any nanosecond value whose `secs` falls strictly between `Timestamp::MAX.as_second()` and `i64::MAX`).","locations":[{"ref":"crates/jiff-core/src/timestamp.rs:171-185","code":"  171 |     pub const fn from_nanosecond(\n  172 |         nanosecond: i128,\n  173 |     ) -> Result<Timestamp, RangeError> {\n  174 |         const NANOS_PER_SEC: i128 = c::NANOS_PER_SEC as i128;\n  175 |         // OK because NANOS_PER_SEC!={-1,0}.\n  176 |         let secs = nanosecond / NANOS_PER_SEC;\n  177 |         // RUST: Use `i64::try_from` when available in `const`.\n  178 |         if !(i64::MIN as i128 <= secs && secs <= i64::MAX as i128) {\n  179 |             rbail!(b::SpecialBoundsError::UnixEpochNanoseconds);\n  180 |         }\n  181 |         let secs64 = secs as i64;\n  182 |         // OK because NANOS_PER_SEC!={-1,0}.\n  183 |         let nanosecond = (nanosecond % NANOS_PER_SEC) as i32;\n  184 |         Ok(Timestamp::new_unchecked(secs64, nanosecond))\n  185 |     }","lines":15,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff-core/src/timestamp.rs#L171-L185"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`jiff::fmt::serde::timestamp::nanosecond::optional::deserialize` cannot deserialize legitimate large `Timestamp` values that `jiff::fmt::serde::timestamp::nanosecond::required::deserialize` handles correctly.\n\n`nanosecond::required::deserialize` (`crates/jiff/src/fmt/serde.rs:1053-1057`) hints the deserializer with `de.deserialize_i128(super::Visitor)`, which is necessary because `Timestamp::MAX.as_nanosecond()` (about `2.53 * 10^20`) vastly exceeds both `i64::MAX` (~`9.2 * 10^18`) and `u64::MAX` (~`1.8 * 10^19`).\n\nHowever, `nanosecond::optional::deserialize` (`crates/jiff/src/fmt/serde.rs:1079-1085`) goes through the shared, generic `timestamp::OptionalVisitor<V>` (`crates/jiff/src/fmt/serde.rs:441-471`), whose `visit_some` is hardcoded to call `de.deserialize_i64(self.0)` (`crates/jiff/src/fmt/serde.rs:462`) regardless of which unit submodule (`second`, `millisecond`, `microsecond`, `nanosecond`) it is instantiated for. This `i64` hint is correct for `second`/`millisecond`/`microsecond` (whose `required::deserialize` also use `deserialize_i64`), but wrong for `nanosecond`, which needs the `i128` hint to match its own `required` variant.\n\nThis was empirically verified: with a self-describing format like `serde_json`, deserializing `{\"ts\": 253402207200999999999}` (i.e. `Timestamp::MAX` in nanoseconds) into a struct using `#[serde(with = \"jiff::fmt::serde::timestamp::nanosecond::required\")]` succeeds, while the exact same JSON deserialized into a struct using `#[serde(with = \"jiff::fmt::serde::timestamp::nanosecond::optional\")]` (`Option<Timestamp>` field) fails with `invalid type: floating point 2.53402207201e+20, expected an integer number of nanoseconds from the Unix epoch`. `serde_json` cannot fit the number into `i64`/`u64` under the `deserialize_i64` hint and falls back to representing it as a float, which the visitor rejects.\n\nIn short, `Option<Timestamp>` round-tripping via the nanosecond helper silently narrows the valid input range compared to `Timestamp` round-tripping through the same helper family, for timestamps near the beginning or end of Jiff's supported range.","fix":"Make `OptionalVisitor::visit_some` use the same integer-width hint that the corresponding `required::deserialize` uses, instead of hardcoding `deserialize_i64`. For example, parameterize `OptionalVisitor` (or make it generic per unit) so `nanosecond::optional::deserialize` requests `deserialize_i128`:\n\n```rust\n// e.g. add a trait method or a const/callback so each unit's OptionalVisitor\n// can pick the right deserialize_* hint:\nstruct OptionalVisitor<V> { inner: V, use_i128: bool }\n\nfn visit_some<D: de::Deserializer<'de>>(self, de: D) -> Result<Option<crate::Timestamp>, D::Error> {\n    if self.use_i128 {\n        de.deserialize_i128(self.inner).map(Some)\n    } else {\n        de.deserialize_i64(self.inner).map(Some)\n    }\n}\n```\n\nOr simpler: give `nanosecond` its own dedicated `OptionalVisitor` (mirroring what `nanosecond::Visitor` already does differently from the other three units) whose `visit_some` calls `de.deserialize_i128(self.0)`, and add a regression test that round-trips `Timestamp::MIN`/`Timestamp::MAX` through `nanosecond::optional`.","locations":[{"ref":"crates/jiff/src/fmt/serde.rs:461-491","code":"  461 |     struct OptionalVisitor<V>(V);\n  462 | \n  463 |     impl<'de, V: de::Visitor<'de, Value = crate::Timestamp>> de::Visitor<'de>\n  464 |         for OptionalVisitor<V>\n  465 |     {\n  466 |         type Value = Option<crate::Timestamp>;\n  467 | \n  468 |         fn expecting(\n  469 |             &self,\n  470 |             f: &mut core::fmt::Formatter,\n  471 |         ) -> core::fmt::Result {\n  472 |             f.write_str(\n  473 |                 \"an integer number of seconds from the Unix epoch or `None`\",\n  474 |             )\n  475 |         }\n  476 | \n  477 |         #[inline]\n  478 |         fn visit_some<D: de::Deserializer<'de>>(\n  479 |             self,\n  480 |             de: D,\n  481 |         ) -> Result<Option<crate::Timestamp>, D::Error> {\n  482 |             de.deserialize_i64(self.0).map(Some)\n  483 |         }\n  484 | \n  485 |         #[inline]\n  486 |         fn visit_none<E: de::Error>(\n  487 |             self,\n  488 |         ) -> Result<Option<crate::Timestamp>, E> {\n  489 |             Ok(None)\n  490 |         }\n  491 |     }","lines":31,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/fmt/serde.rs#L461-L491"},{"ref":"crates/jiff/src/fmt/serde.rs:482","code":"  482 |             de.deserialize_i64(self.0).map(Some)","lines":1,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/fmt/serde.rs#L482"},{"ref":"crates/jiff/src/fmt/serde.rs:1073-1077","code":" 1073 |             pub fn deserialize<'de, D: serde_core::Deserializer<'de>>(\n 1074 |                 de: D,\n 1075 |             ) -> Result<crate::Timestamp, D::Error> {\n 1076 |                 de.deserialize_i128(super::Visitor)\n 1077 |             }","lines":5,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/fmt/serde.rs#L1073-L1077"},{"ref":"crates/jiff/src/fmt/serde.rs:1099-1105","code":" 1099 |             pub fn deserialize<'de, D: serde_core::Deserializer<'de>>(\n 1100 |                 de: D,\n 1101 |             ) -> Result<Option<crate::Timestamp>, D::Error> {\n 1102 |                 de.deserialize_option(super::super::OptionalVisitor(\n 1103 |                     super::Visitor,\n 1104 |                 ))\n 1105 |             }","lines":7,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/fmt/serde.rs#L1099-L1105"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`DateTimeParser::parse_time_zone` silently drops trailing input when a POSIX time zone string is followed by whitespace and then more (possibly garbage) bytes, causing malformed/injected time zone strings to be accepted as valid instead of rejected.\n\nIn the \"named vs POSIX\" disambiguation loop, `input` is scanned byte-by-byte until whitespace or end-of-input is found (`crates/jiff/src/fmt/temporal/parser.rs:441-450`), and `consumed` is the sub-slice up to that boundary (`parser.rs:451`). When the scanned token contains a digit, it is handed to `jcore::tz::posix::TimeZone::parse_prefix(consumed)`, which performs a *prefix* parse and returns `(posix_tz, len)` where `len` may be smaller than `consumed.len()`.\n\nOn success, the code returns `Ok(Parsed { value, input: &consumed[len..] })` (`parser.rs:467`). This slices only within `consumed` — the pre-whitespace token — and completely discards whatever came *after* the whitespace boundary in the original input (which was already advanced into the separate `input` variable by the scanning loop). Contrast this with the `mknamed(consumed, input)` fallback on `parser.rs:474`, which correctly passes the post-loop `input` (including the whitespace-and-beyond tail) as the remaining slice.\n\nConcretely, `DateTimeParser::new().parse_time_zone(\"EST5EDT,M3.2.0,M11.1.0 GARBAGE\")` succeeds and returns a `Parsed` whose `input` (leftover, unconsumed bytes) is empty, even though `\" GARBAGE\"` (8 bytes) was never validated or consumed. Verified end-to-end: the public API `DateTimeParser::parse_time_zone(\"EST5EDT,M3.2.0,M11.1.0 GARBAGE\")` (which calls `.into_full()` in `crates/jiff/src/fmt/temporal/mod.rs:985`, and which normally rejects any leftover input) returns `Ok(TimeZone(Posix(EST5EDT,M3.2.0,M11.1.0)))` instead of an error.\n\nThis is reachable from untrusted input: `crates/jiff/src/fmt/serde.rs:1219` calls this same `PARSER.parse_time_zone(value)` when deserializing a `TimeZone` from a string (e.g. JSON), so a caller relying on strict parsing for input validation would silently have trailing bytes stripped rather than rejected. The bug only manifests when the POSIX-recognizable token is immediately followed by ASCII whitespace and then more bytes; without a whitespace separator the bug is masked because the post-loop `input` is already empty (nothing lost).","fix":"Capture the full pre-loop slice and slice the *original* (not the whitespace-truncated `consumed`) buffer by `len` so the whitespace tail is preserved in the returned remaining input:\n\n```rust\nlet mkconsumed = parse::slicer(input);\nlet start_of_token = input; // NEW: remember the slice before any bytes are stripped\nlet mut saw_number = false;\nloop {\n    let Some((&byte, tail)) = input.split_first() else { break };\n    if byte.is_ascii_whitespace() {\n        break;\n    }\n    saw_number = saw_number || byte.is_ascii_digit();\n    input = tail;\n}\nlet consumed = mkconsumed(input);\nif !saw_number {\n    return mknamed(consumed, input);\n}\n#[cfg(not(feature = \"alloc\"))]\n{\n    Err(Error::from(E::AllocPosixTimeZone))\n}\n#[cfg(feature = \"alloc\")]\n{\n    use jcore::tz::posix;\n\n    match posix::TimeZone::parse_prefix(consumed) {\n        Ok((posix_tz, len)) => {\n            let kind = ParsedTimeZoneKind::Posix(posix_tz);\n            let value = ParsedTimeZone { input: original, kind };\n            // FIX: slice `start_of_token` (which still includes the\n            // whitespace-and-beyond tail), not `consumed`.\n            Ok(Parsed { value, input: &start_of_token[len..] })\n        }\n        Err(_) => mknamed(consumed, input),\n    }\n}\n```\n\nAdd a regression test asserting that `DateTimeParser::new().parse_time_zone(\"EST5EDT,M3.2.0,M11.1.0 GARBAGE\")` (and similar `\"<valid-posix-tz> <garbage>\"` inputs) returns an error via `.into_full()` rather than silently truncating.","locations":[{"ref":"crates/jiff/src/fmt/temporal/parser.rs:441-467","code":"  441 |         let mkconsumed = parse::slicer(input);\n  442 |         let mut saw_number = false;\n  443 |         loop {\n  444 |             let Some((&byte, tail)) = input.split_first() else { break };\n  445 |             if byte.is_ascii_whitespace() {\n  446 |                 break;\n  447 |             }\n  448 |             saw_number = saw_number || byte.is_ascii_digit();\n  449 |             input = tail;\n  450 |         }\n  451 |         let consumed = mkconsumed(input);\n  452 |         if !saw_number {\n  453 |             return mknamed(consumed, input);\n  454 |         }\n  455 |         #[cfg(not(feature = \"alloc\"))]\n  456 |         {\n  457 |             Err(Error::from(E::AllocPosixTimeZone))\n  458 |         }\n  459 |         #[cfg(feature = \"alloc\")]\n  460 |         {\n  461 |             use jcore::tz::posix;\n  462 | \n  463 |             match posix::TimeZone::parse_prefix(consumed) {\n  464 |                 Ok((posix_tz, len)) => {\n  465 |                     let kind = ParsedTimeZoneKind::Posix(posix_tz);\n  466 |                     let value = ParsedTimeZone { input: original, kind };\n  467 |                     Ok(Parsed { value, input: &consumed[len..] })","lines":27,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/fmt/temporal/parser.rs#L441-L467"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"hard","description":"`ParsedTimeZone::parse_transitions` in `parser.rs` never validates that the parsed transition timestamps are in strictly increasing order before they are stored in `self.transitions.timestamps` (via `ParsedTransitions::add`/`add_with_type_index`). RFC 8536 requires transition times to be sorted in ascending order, but this parser accepts and stores them in whatever order they appear in the (potentially untrusted/corrupted) TZif file.\n\n`query.rs`, however, relies on this invariant everywhere it does a `binary_search` over `self.timestamps()` / `self.civil_starts()` (`to_local_time_type`, `to_ambiguous_timestamp`, `previous_transition`, `next_transition`). Per `slice::binary_search`'s own contract, \"if the slice is not sorted, the returned result is unspecified and meaningless.\" So a TZif file with out-of-order transitions will not panic (the leading dummy `Timestamp::MIN`/`DateTime::MIN` sentinel happens to make the documented `unreachable!(\"impossible to come before Timestamp::MIN\")` paths genuinely unreachable regardless of sort order), but it can silently make `to_offset`/`to_offset_info`/ambiguous-timestamp resolution return the *wrong* UTC offset, DST flag or abbreviation for a given instant/civil time — a correctness bug in exactly the kind of untrusted-input scenario this module's doc comment says it is designed to handle safely.\n\nAdditionally, `verify_posix_time_zone_consistency` and `fatten`/`fatten_add_transition` both assume `self.transitions.timestamps.last()` is the chronologically last transition, which is also false if the input is unsorted.","fix":"After the transition timestamps have all been parsed in `parse_transitions` (`crates/jiff-core/src/tz/tzif/parser.rs:182-244`), validate that `self.transitions.timestamps` is strictly increasing (skipping the leading `Timestamp::MIN` sentinel, which may legitimately equal the first real transition) and return a new `ParseError` variant (e.g. `TransitionOrderError::NotIncreasing`) if not:\n```rust\nfor pair in self.transitions.timestamps.windows(2) {\n    if pair[0] > pair[1] {\n        return Err(TransitionOrderError::NotIncreasing.into());\n    }\n}\n```\nThis turns malformed/adversarial TZif data into a clean parse error instead of a silent wrong-offset bug, and restores the invariant that `query.rs`'s `binary_search` calls depend on.","locations":[{"ref":"crates/jiff-core/src/tz/tzif/parser.rs:182-244","code":"  182 |     fn parse_transitions<'b>(\n  183 |         &mut self,\n  184 |         header: &Header,\n  185 |         bytes: &'b [u8],\n  186 |     ) -> Result<&'b [u8], ParseError> {\n  187 |         let (bytes, rest) = try_split_at(\n  188 |             SplitAtError::TransitionTimes,\n  189 |             bytes,\n  190 |             header.transition_times_len()?,\n  191 |         )?;\n  192 |         let mut it = bytes.chunks_exact(header.time_size);\n  193 |         // RFC 8536 says: \"If there are no transitions, local time for all\n  194 |         // timestamps is specified by the TZ string in the footer if present\n  195 |         // and nonempty; otherwise, it is specified by time type 0.\"\n  196 |         //\n  197 |         // RFC 8536 also says: \"Local time for timestamps before the first\n  198 |         // transition is specified by the first time type (time type 0).\"\n  199 |         //\n  200 |         // So if there are no transitions, pushing this dummy one will result\n  201 |         // in the desired behavior even when it's the only transition.\n  202 |         // Similarly, since this is the minimum timestamp value, it will\n  203 |         // trigger for any times before the first transition found in the TZif\n  204 |         // data.\n  205 |         self.transitions.add_with_type_index(Timestamp::MIN, 0);\n  206 |         for chunk in &mut it {\n  207 |             let unix_timestamp = if header.is_32bit() {\n  208 |                 i64::from(from_be_bytes_i32(chunk))\n  209 |             } else {\n  210 |                 from_be_bytes_i64(chunk)\n  211 |             };\n  212 |             let timestamp = match Timestamp::from_second(unix_timestamp) {\n  213 |                 Ok(timestamp) => timestamp,\n  214 |                 Err(_) => {\n  215 |                     // We really shouldn't error here just because the Unix\n  216 |                     // timestamp is outside what Jiff supports. Since what Jiff\n  217 |                     // supports is _somewhat_ arbitrary. But Jiff's supported\n  218 |                     // range is good enough for all realistic purposes, so we\n  219 |                     // just clamp an out-of-range Unix timestamp to the Jiff\n  220 |                     // min or max value.\n  221 |                     //\n  222 |                     // This can't result in the sorting order being wrong, but\n  223 |                     // it can result in a transition that is duplicative with\n  224 |                     // the dummy transition we inserted above. This should be\n  225 |                     // fine.\n  226 |                     let clamped =\n  227 |                         if unix_timestamp < Timestamp::MIN.as_second() {\n  228 |                             Timestamp::MIN\n  229 |                         } else {\n  230 |                             Timestamp::MAX\n  231 |                         };\n  232 |                     warn!(\n  233 |                         \"found Unix timestamp `{unix_timestamp}` that is \\\n  234 |                          outside Jiff's supported range, \\\n  235 |                          clamping to `{clamped:?}`\",\n  236 |                     );\n  237 |                     clamped\n  238 |                 }\n  239 |             };\n  240 |             self.transitions.add(timestamp);\n  241 |         }\n  242 |         assert!(it.remainder().is_empty());\n  243 |         Ok(rest)\n  244 |     }","lines":63,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff-core/src/tz/tzif/parser.rs#L182-L244"},{"ref":"crates/jiff-core/src/tz/tzif/parser.rs:638-652","code":"  638 | impl ParsedTransitions {\n  639 |     fn add(&mut self, timestamp: Timestamp) {\n  640 |         self.add_with_type_index(timestamp, 0);\n  641 |     }\n  642 | \n  643 |     fn add_with_type_index(&mut self, timestamp: Timestamp, type_index: u8) {\n  644 |         self.timestamps.push(timestamp);\n  645 |         self.civil_starts.push(DateTime::MIN);\n  646 |         self.civil_ends.push(DateTime::MIN);\n  647 |         self.infos.push(TransitionInfo {\n  648 |             type_index,\n  649 |             kind: TransitionKind::Unambiguous,\n  650 |         });\n  651 |     }\n  652 | }","lines":15,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff-core/src/tz/tzif/parser.rs#L638-L652"},{"ref":"crates/jiff-core/src/tz/tzif/query.rs:62-115","code":"   62 |         let timestamps = self.timestamps();\n   63 |         let last = *timestamps.last().expect(\"non-empty transitions\");\n   64 |         let index = if timestamp > last {\n   65 |             timestamps.len() - 1\n   66 |         } else {\n   67 |             let search = self.timestamps().binary_search(&timestamp);\n   68 |             match search {\n   69 |                 // Since the first transition is always Timestamp::MIN, it's\n   70 |                 // impossible for any timestamp to sort before it.\n   71 |                 Err(0) => {\n   72 |                     unreachable!(\"impossible to come before Timestamp::MIN\")\n   73 |                 }\n   74 |                 Ok(i) => i,\n   75 |                 // i points to the position immediately after the matching\n   76 |                 // timestamp. And since we know that i>0 because of the i==0\n   77 |                 // check above, we can safely subtract 1.\n   78 |                 Err(i) => i.checked_sub(1).expect(\"i is non-zero\"),\n   79 |             }\n   80 |         };\n   81 |         // Our index is always in bounds. The only way it couldn't be is if\n   82 |         // binary search returns an Err(len) for a time greater than the\n   83 |         // maximum transition. But we account for that above by converting\n   84 |         // Err(len) to Err(len-1).\n   85 |         debug_assert!(index < timestamps.len());\n   86 |         // RFC 8536 says: \"Local time for timestamps on or after the last\n   87 |         // transition is specified by the TZ string in the footer (Section 3.3)\n   88 |         // if present and nonempty; otherwise, it is unspecified.\"\n   89 |         //\n   90 |         // Subtracting 1 is OK because we know self.transitions is not empty.\n   91 |         let index = if index < timestamps.len() - 1 {\n   92 |             // This is the typical case in \"fat\" TZif files: we found a\n   93 |             // matching transition.\n   94 |             index\n   95 |         } else {\n   96 |             match self.posix_tz() {\n   97 |                 // This is the typical case in \"slim\" TZif files, where the\n   98 |                 // last transition is, as I understand it, the transition at\n   99 |                 // which a consistent rule started that a POSIX TZ string can\n  100 |                 // fully describe. For example, (as of 2024-03-27) the last\n  101 |                 // transition in the \"fat\" America/New_York TZif file is\n  102 |                 // in 2037, where as in the \"slim\" version it is 2007.\n  103 |                 //\n  104 |                 // This is likely why some things break with the \"slim\"\n  105 |                 // version: they don't support POSIX TZ strings (or don't\n  106 |                 // support them correctly).\n  107 |                 Some(tz) => return Err(tz),\n  108 |                 // This case is technically unspecified, but I think the\n  109 |                 // typical thing to do is to just use the last transition.\n  110 |                 // I'm not 100% sure on this one.\n  111 |                 None => index,\n  112 |             }\n  113 |         };\n  114 |         Ok(self.local_time_type(index))\n  115 |     }","lines":54,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff-core/src/tz/tzif/query.rs#L62-L115"},{"ref":"crates/jiff-core/src/tz/tzif/query.rs:128-196","code":"  128 |     pub fn to_ambiguous_timestamp(&self, dt: DateTime) -> AmbiguousTimestamp {\n  129 |         // This implementation very nearly mirrors `to_local_time_type`\n  130 |         // above in the beginning: we do a binary search to find transition\n  131 |         // applicable for the given datetime. Except, we do it on wall clock\n  132 |         // times instead of timestamps. And in particular, each transition\n  133 |         // begins with a possibly ambiguous range of wall clock times\n  134 |         // corresponding to either a \"gap\" or \"fold\" in time.\n  135 |         let dtt = TzifDateTime::new(dt);\n  136 |         let (starts, ends) = (self.civil_starts(), self.civil_ends());\n  137 |         assert!(!starts.is_empty(), \"transitions is non-empty\");\n  138 |         let this_index = match starts.binary_search(&dtt) {\n  139 |             Err(0) => unreachable!(\"impossible to come before DateTime::MIN\"),\n  140 |             Ok(i) => i,\n  141 |             Err(i) => i.checked_sub(1).expect(\"i is non-zero\"),\n  142 |         };\n  143 |         debug_assert!(this_index < starts.len());\n  144 | \n  145 |         let this_offset = self.local_time_type(this_index).offset;\n  146 |         // This is a little tricky, but we need to check for ambiguous civil\n  147 |         // datetimes before possibly using the POSIX TZ string. Namely, a\n  148 |         // datetime could be ambiguous with respect to the last transition,\n  149 |         // and we should handle that according to the gap/fold determined for\n  150 |         // that transition. We cover this case in tests in tz/mod.rs for the\n  151 |         // Pacific/Honolulu time zone, whose last transition begins with a gap.\n  152 |         match self.transition_kind(this_index) {\n  153 |             TransitionKind::Gap if dtt < ends[this_index] => {\n  154 |                 // A gap/fold can only appear when there exists a previous\n  155 |                 // transition.\n  156 |                 let prev_index = this_index.checked_sub(1).unwrap();\n  157 |                 let prev_offset = self.local_time_type(prev_index).offset;\n  158 |                 return AmbiguousOffset::Gap {\n  159 |                     before: prev_offset,\n  160 |                     after: this_offset,\n  161 |                 }\n  162 |                 .into_ambiguous_timestamp(dt);\n  163 |             }\n  164 |             TransitionKind::Fold if dtt < ends[this_index] => {\n  165 |                 // A gap/fold can only appear when there exists a previous\n  166 |                 // transition.\n  167 |                 let prev_index = this_index.checked_sub(1).unwrap();\n  168 |                 let prev_offset = self.local_time_type(prev_index).offset;\n  169 |                 return AmbiguousOffset::Fold {\n  170 |                     before: prev_offset,\n  171 |                     after: this_offset,\n  172 |                 }\n  173 |                 .into_ambiguous_timestamp(dt);\n  174 |             }\n  175 |             _ => {}\n  176 |         }\n  177 |         // The datetime given is not ambiguous with respect to any of the\n  178 |         // transitions in the TZif data. But, if we matched at or after the\n  179 |         // last transition, then we need to use the POSIX TZ string (which\n  180 |         // could still return an ambiguous offset).\n  181 |         if this_index == starts.len() - 1 {\n  182 |             if let Some(tz) = self.posix_tz() {\n  183 |                 return tz.to_ambiguous_timestamp(dt);\n  184 |             }\n  185 |             // This case is unspecified according to RFC 8536. It means that\n  186 |             // the given datetime exceeds all transitions *and* there is no\n  187 |             // POSIX TZ string. So this can happen in V1 files for example.\n  188 |             // But those should hopefully be essentially non-existent nowadays\n  189 |             // (2024-03). In any case, we just fall through to using the last\n  190 |             // transition, which does seem likely to be wrong ~half the time\n  191 |             // in time zones with DST. But there really isn't much else we can\n  192 |             // do I think.\n  193 |         }\n  194 |         AmbiguousOffset::Unambiguous { offset: this_offset }\n  195 |             .into_ambiguous_timestamp(dt)\n  196 |     }","lines":69,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff-core/src/tz/tzif/query.rs#L128-L196"},{"ref":"crates/jiff-core/src/tz/tzif/query.rs:200-250","code":"  200 |     pub fn previous_transition<'t>(\n  201 |         &'t self,\n  202 |         ts: Timestamp,\n  203 |     ) -> Option<Transition> {\n  204 |         assert!(!self.timestamps().is_empty(), \"transitions is non-empty\");\n  205 |         let mut timestamp = TzifTimestamp::new(ts);\n  206 |         if ts.subsec_nanosecond() != 0 {\n  207 |             timestamp = timestamp.saturating_add(1);\n  208 |         }\n  209 |         let search = self.timestamps().binary_search(&timestamp);\n  210 |         let index = match search {\n  211 |             Ok(i) | Err(i) => i.checked_sub(1)?,\n  212 |         };\n  213 |         let index = if index == 0 {\n  214 |             // The first transition is a dummy that we insert, so if we land on\n  215 |             // it here, treat it as if it doesn't exist.\n  216 |             return None;\n  217 |         } else if index == self.timestamps().len() - 1 {\n  218 |             if let Some(ref posix_tz) = self.posix_tz() {\n  219 |                 // Since the POSIX TZ must be consistent with the last\n  220 |                 // transition, it must be the case that tzif_last <=\n  221 |                 // posix_prev_trans in all cases. So the transition according\n  222 |                 // to the POSIX TZ is always correct here.\n  223 |                 //\n  224 |                 // What if this returns `None` though? I'm not sure in which\n  225 |                 // cases that could matter, and I think it might be a violation\n  226 |                 // of the TZif format if it does.\n  227 |                 //\n  228 |                 // It can return `None`! In the case of a time zone that\n  229 |                 // has eliminated DST, it might have historical time zone\n  230 |                 // transitions but a POSIX time zone without DST. (For example,\n  231 |                 // `America/Sao_Paulo`.) And thus, this would return `None`.\n  232 |                 // So if it does, we pretend as if the POSIX time zone doesn't\n  233 |                 // exist.\n  234 |                 if let Some(trans) = posix_tz.previous_transition(ts) {\n  235 |                     return Some(trans);\n  236 |                 }\n  237 |             }\n  238 |             index\n  239 |         } else {\n  240 |             index\n  241 |         };\n  242 |         let timestamp = self.timestamps()[index];\n  243 |         let typ = self.local_time_type(index);\n  244 |         let info = OffsetInfo {\n  245 |             offset: typ.offset,\n  246 |             abbreviation: self.designation(typ).clone(),\n  247 |             dst: typ.dst,\n  248 |         };\n  249 |         Some(Transition { timestamp: timestamp.to_standard_timestamp(), info })\n  250 |     }","lines":51,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff-core/src/tz/tzif/query.rs#L200-L250"},{"ref":"crates/jiff-core/src/tz/tzif/query.rs:254-307","code":"  254 |     pub fn next_transition<'t>(&'t self, ts: Timestamp) -> Option<Transition> {\n  255 |         assert!(!self.timestamps().is_empty(), \"transitions is non-empty\");\n  256 |         let timestamp = TzifTimestamp::new(ts);\n  257 |         let search = self.timestamps().binary_search(&timestamp);\n  258 |         let index = match search {\n  259 |             Ok(i) => i.checked_add(1)?,\n  260 |             Err(i) => i,\n  261 |         };\n  262 |         let index = if index == 0 {\n  263 |             // The first transition is a dummy that we insert, so if we land on\n  264 |             // it here, treat it as if it doesn't exist.\n  265 |             return None;\n  266 |         } else if index >= self.timestamps().len() {\n  267 |             if let Some(posix_tz) = self.posix_tz() {\n  268 |                 // Since the POSIX TZ must be consistent with the last\n  269 |                 // transition, it must be the case that next.timestamp <=\n  270 |                 // posix_next_tans in all cases. So the transition according to\n  271 |                 // the POSIX TZ is always correct here.\n  272 |                 //\n  273 |                 // What if this returns `None` though? I'm not sure in which\n  274 |                 // cases that could matter, and I think it might be a violation\n  275 |                 // of the TZif format if it does.\n  276 |                 //\n  277 |                 // In the \"previous\" case above, this could return `None` even\n  278 |                 // when there are historical time zone transitions in the case\n  279 |                 // of a time zone eliminating DST (e.g., `America/Sao_Paulo`).\n  280 |                 // But unlike the previous case, if we get `None` here, then\n  281 |                 // that is the real answer because there are no other known\n  282 |                 // future time zone transitions.\n  283 |                 //\n  284 |                 // 2025-05-05: OK, this could return `None` and this is fine.\n  285 |                 // It happens for time zones that had DST but then stopped\n  286 |                 // it at some point in the past. The POSIX time zone has no\n  287 |                 // DST and thus returns `None`. That's fine. But there was a\n  288 |                 // problem: we were using the POSIX time zone even when there\n  289 |                 // was a historical time zone transition after the timestamp\n  290 |                 // given. That was fixed by changing the condition when we get\n  291 |                 // here: it can only happen when the timestamp given comes at\n  292 |                 // or after all historical time zone transitions.\n  293 |                 return posix_tz.next_transition(ts);\n  294 |             }\n  295 |             self.timestamps().len() - 1\n  296 |         } else {\n  297 |             index\n  298 |         };\n  299 |         let timestamp = self.timestamps()[index];\n  300 |         let typ = self.local_time_type(index);\n  301 |         let info = OffsetInfo {\n  302 |             offset: typ.offset,\n  303 |             abbreviation: self.designation(typ).clone(),\n  304 |             dst: typ.dst,\n  305 |         };\n  306 |         Some(Transition { timestamp: timestamp.to_standard_timestamp(), info })\n  307 |     }","lines":54,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff-core/src/tz/tzif/query.rs#L254-L307"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`DateWith::build` validates `month` unconditionally before looking at `self.day`, even though the docs for `DateWith::day_of_year` and `DateWith::day_of_year_no_leap` explicitly state \"any settings for month are ignored since the month is determined by the day of the year.\" Because `let month = match self.month { ... Some(month) => b::Month::check(month)?, ... };` runs and propagates an error via `?` before the `day` match ever inspects `DateWithDay::OfYear`/`DateWithDay::OfYearNoLeap`, calling `.with().month(<out-of-range>).day_of_year(60).build()` incorrectly fails with an invalid-month error instead of succeeding and ignoring the bogus month, contradicting the documented contract.\n\nVerified by running:\n```rust\nlet r = date(2024, 1, 1).with().month(13).day_of_year(60).build();\n// r == Err(\"parameter 'month' is not in the required range of 1..=12\")\n// but per the documented contract for day_of_year, month should be ignored\n// and this should succeed as date(2024, 2, 29).\n```","fix":"Defer month validation until it is known that `month` will actually be used, e.g. compute `day` first and only validate/compute `month` in the fallthrough case that needs it:\n```rust\npub fn build(self) -> Result<Date, Error> {\n    let year = match self.year {\n        None => self.original.year(),\n        Some(DateWithYear::Jiff(year)) => b::Year::check(year)?,\n        Some(DateWithYear::EraYear(year, Era::CE)) => {\n            b::YearCE::check(year)?\n        }\n        Some(DateWithYear::EraYear(year, Era::BCE)) => {\n            let year_bce = b::YearBCE::check(year)?;\n            -year_bce + 1\n        }\n    };\n    // Handle the day-of-year variants first since they ignore `month`\n    // entirely, per the documented contract.\n    match self.day {\n        Some(DateWithDay::OfYear(day)) => {\n            let jdate = JDate::from_day_of_year(year, day)\n                .map_err(Error::jcore_range)?;\n            return Ok(Date::from_jcore(jdate));\n        }\n        Some(DateWithDay::OfYearNoLeap(day)) => {\n            let jdate = JDate::from_day_of_year_no_leap(year, day)\n                .map_err(Error::jcore_range)?;\n            return Ok(Date::from_jcore(jdate));\n        }\n        _ => {}\n    }\n    let month = match self.month {\n        None => self.original.month(),\n        Some(month) => b::Month::check(month)?,\n    };\n    let day = match self.day {\n        None => self.original.day(),\n        Some(DateWithDay::OfMonth(day)) => b::Day::check(day)?,\n        Some(DateWithDay::OfYear(_)) | Some(DateWithDay::OfYearNoLeap(_)) => {\n            unreachable!(\"handled above\")\n        }\n    };\n    Date::new(year, month, day)\n}\n```","locations":[{"ref":"crates/jiff/src/civil/date.rs:2968-2999","code":" 2968 |     pub fn build(self) -> Result<Date, Error> {\n 2969 |         let year = match self.year {\n 2970 |             None => self.original.year(),\n 2971 |             Some(DateWithYear::Jiff(year)) => b::Year::check(year)?,\n 2972 |             Some(DateWithYear::EraYear(year, Era::CE)) => {\n 2973 |                 b::YearCE::check(year)?\n 2974 |             }\n 2975 |             Some(DateWithYear::EraYear(year, Era::BCE)) => {\n 2976 |                 let year_bce = b::YearBCE::check(year)?;\n 2977 |                 -year_bce + 1\n 2978 |             }\n 2979 |         };\n 2980 |         let month = match self.month {\n 2981 |             None => self.original.month(),\n 2982 |             Some(month) => b::Month::check(month)?,\n 2983 |         };\n 2984 |         let day = match self.day {\n 2985 |             None => self.original.day(),\n 2986 |             Some(DateWithDay::OfMonth(day)) => b::Day::check(day)?,\n 2987 |             Some(DateWithDay::OfYear(day)) => {\n 2988 |                 let jdate = JDate::from_day_of_year(year, day)\n 2989 |                     .map_err(Error::jcore_range)?;\n 2990 |                 return Ok(Date::from_jcore(jdate));\n 2991 |             }\n 2992 |             Some(DateWithDay::OfYearNoLeap(day)) => {\n 2993 |                 let jdate = JDate::from_day_of_year_no_leap(year, day)\n 2994 |                     .map_err(Error::jcore_range)?;\n 2995 |                 return Ok(Date::from_jcore(jdate));\n 2996 |             }\n 2997 |         };\n 2998 |         Date::new(year, month, day)\n 2999 |     }","lines":32,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/civil/date.rs#L2968-L2999"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`TimestampSeries::next` (the iterator returned by `Timestamp::series`) silently drops the last valid timestamp (and can yield zero items total) whenever advancing to the *next* value would overflow `Timestamp`'s range. The implementation is:\n\n```rust\nimpl Iterator for TimestampSeries {\n    type Item = Timestamp;\n\n    #[inline]\n    fn next(&mut self) -> Option<Timestamp> {\n        let duration = self.duration?;\n        let this = self.ts;\n        self.ts = self.ts.checked_add_duration(duration).ok()?;\n        Some(this)\n    }\n}\n```\n\n`this` (the current, perfectly valid timestamp that this call is supposed to yield) is saved first, but then `self.ts.checked_add_duration(duration).ok()?` computes the *next* iteration's value and uses `?` to bail out of the whole function with `None` the moment that computation overflows. Since the `?` short-circuits before reaching `Some(this)`, the already-valid `this` is thrown away instead of being returned. This means the iterator ends one element early (or entirely empty) whenever the terminating step is reached, rather than ending after yielding the last valid `Timestamp`.\n\nThis was confirmed by direct testing: `Timestamp::MAX.checked_sub(1.second()).unwrap().series(10.hours()).collect::<Vec<_>>()` (where `start` is `9999-12-30T21:59:59.999999999Z`, well within `Timestamp::MIN..=Timestamp::MAX`) yields an **empty** vector, even though `start` itself is a perfectly valid `Timestamp` that the iterator should yield at least once before stopping. The same bug applies symmetrically near `Timestamp::MIN` with a negative period.\n\nThe doc comment on `TimestampSeries` says \"It is exhausted when the next value would exceed the limits of a `Span` or `Timestamp` value,\" implying the current (in-range) value should still be produced before exhaustion - but the implementation instead discards it.","fix":"Only advance `self.ts` when the addition succeeds, and mark the series as exhausted for the *next* call (e.g. by clearing `self.duration`) instead of using `?` to bail out of the current call before `this` is returned:\n\n```rust\nimpl Iterator for TimestampSeries {\n    type Item = Timestamp;\n\n    #[inline]\n    fn next(&mut self) -> Option<Timestamp> {\n        let duration = self.duration?;\n        let this = self.ts;\n        match self.ts.checked_add_duration(duration) {\n            Ok(next) => self.ts = next,\n            Err(_) => self.duration = None,\n        }\n        Some(this)\n    }\n}\n```\n\nThis guarantees `this` (always valid, since it was produced by a prior successful `checked_add_duration` or is the original starting `Timestamp`) is always returned by the call that computed it, and only the *following* call to `next()` returns `None` once `self.duration` has been cleared.","locations":[{"ref":"crates/jiff/src/timestamp.rs:2799-2809","code":" 2799 | impl Iterator for TimestampSeries {\n 2800 |     type Item = Timestamp;\n 2801 | \n 2802 |     #[inline]\n 2803 |     fn next(&mut self) -> Option<Timestamp> {\n 2804 |         let duration = self.duration?;\n 2805 |         let this = self.ts;\n 2806 |         self.ts = self.ts.checked_add_duration(duration).ok()?;\n 2807 |         Some(this)\n 2808 |     }\n 2809 | }","lines":11,"link":"https://github.com/BurntSushi/jiff/blob/ab6e8c83462e9b6d0dfe33f9cb70583d3d82049b/crates/jiff/src/timestamp.rs#L2799-L2809"}]},
