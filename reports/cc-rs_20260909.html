<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"In try_compile, when cross-compiling C++ to wasm32-unknown-linux (musl), the code calls `self.wasm_musl_sysroot().unwrap()` which panics if the `WASM_MUSL_SYSROOT` env var is not set. The parallel wasi branch just above handles the identical missing-env-var case gracefully with `if let Ok(wasi_sysroot) = self.wasi_sysroot() { ... }` and silently skips emitting metadata. try_compile is documented to return a Result instead of panicking, so this is an inconsistent, undocumented panic path.","fix":"Mirror the wasi branch: use `if let Ok(musl_sysroot) = self.wasm_musl_sysroot() { ... }` instead of `.unwrap()`, so a missing WASM_MUSL_SYSROOT degrades gracefully instead of panicking inside a non-panicking function.","locations":[{"ref":"src/lib.rs:1777-1783","code":" 1777 |                 } else if target.os == \"linux\" {\n 1778 |                     let musl_sysroot = self.wasm_musl_sysroot().unwrap();\n 1779 |                     self.cargo_output.print_metadata(&format_args!(\n 1780 |                         \"cargo:rustc-flags=-L {}/lib -lstatic=c++ -lstatic=c++abi\",\n 1781 |                         Path::new(&musl_sysroot).display(),\n 1782 |                     ));\n 1783 |                 }","lines":7,"link":"https://github.com/rust-lang/cc-rs/blob/527ec73d3be811bebe24eb355e4116bd844942c1/src/lib.rs#L1777-L1783"},{"ref":"src/lib.rs:4567-4576","code":" 4567 |     fn wasm_musl_sysroot(&self) -> Result<OsString, Error> {\n 4568 |         if let Some(musl_sysroot_path) = self.get_env(\"WASM_MUSL_SYSROOT\") {\n 4569 |             Ok(musl_sysroot_path)\n 4570 |         } else {\n 4571 |             Err(Error::new(\n 4572 |                 ErrorKind::EnvVarNotFound,\n 4573 |                 \"Environment variable WASM_MUSL_SYSROOT not defined for wasm32. Download sysroot from GitHub & setup environment variable MUSL_SYSROOT targeting the folder.\",\n 4574 |             ))\n 4575 |         }\n 4576 |     }","lines":10,"link":"https://github.com/rust-lang/cc-rs/blob/527ec73d3be811bebe24eb355e4116bd844942c1/src/lib.rs#L4567-L4576"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"On the wasm32-linux clang path, `self.wasm_musl_sysroot().unwrap()` panics the whole build process with a generic unwrap message if `WASM_MUSL_SYSROOT` is not set, instead of propagating a proper `Error` like the sibling wasi branch a few lines above (which uses `if let Ok(wasi_sysroot) = self.wasi_sysroot()`). Users get an unhelpful panic instead of the descriptive error message `wasm_musl_sysroot()` was designed to produce.","fix":"Replace `self.wasm_musl_sysroot().unwrap()` with proper error propagation, e.g. `let musl_sysroot = self.wasm_musl_sysroot()?;`, matching the established pattern for the wasi sysroot case.","locations":[{"ref":"src/lib.rs:2413","code":" 2413 |                         let musl_sysroot = self.wasm_musl_sysroot().unwrap();","lines":1,"link":"https://github.com/rust-lang/cc-rs/blob/527ec73d3be811bebe24eb355e4116bd844942c1/src/lib.rs#L2413"},{"ref":"src/lib.rs:2294-2298","code":" 2294 |                     if let Ok(wasi_sysroot) = self.wasi_sysroot() {\n 2295 |                         cmd.push_cc_arg(\n 2296 |                             format!(\"--sysroot={}\", Path::new(&wasi_sysroot).display()).into(),\n 2297 |                         );\n 2298 |                     }","lines":5,"link":"https://github.com/rust-lang/cc-rs/blob/527ec73d3be811bebe24eb355e4116bd844942c1/src/lib.rs#L2294-L2298"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"In `apple_deployment_target`, `maybe_cpp_version_baseline` parses each dot-separated component of the deployment target version with `.parse::<u32>().expect(\"integer version\")`. The version can come directly from the user-controlled `MACOSX_DEPLOYMENT_TARGET` or `IPHONEOS_DEPLOYMENT_TARGET` environment variables via `deployment_from_env`. Any non-numeric or empty component (e.g. `MACOSX_DEPLOYMENT_TARGET=14.0-beta`, or an empty string) causes an immediate panic instead of a graceful fallback, even though this code path is only reachable when `self.cpp` is true.","fix":"Replace the `.expect(\"integer version\")` with a fallible parse (e.g. `.ok()?` or default to 0 on parse failure) and fall through to `default_deployment_from_sdk`/the hardcoded fallback instead of panicking on malformed environment input.","locations":[{"ref":"src/lib.rs:4465-4480","code":" 4465 |         let deployment_from_env = |name: &str| -> Option<Arc<str>> {\n 4466 |             self.get_env_overridable(name)?.to_str().map(Arc::from)\n 4467 |         };\n 4468 | \n 4469 |         // Determines if the acquired deployment target is too low to support modern C++ on some Apple platform.\n 4470 |         //\n 4471 |         // A long time ago they used libstdc++, but since macOS 10.9 and iOS 7 libc++ has been the library the SDKs provide to link against.\n 4472 |         // If a `cc`` config wants to use C++, we round up to these versions as the baseline.\n 4473 |         let maybe_cpp_version_baseline = |deployment_target_ver: Arc<str>| -> Option<Arc<str>> {\n 4474 |             if !self.cpp {\n 4475 |                 return Some(deployment_target_ver);\n 4476 |             }\n 4477 | \n 4478 |             let mut deployment_target = deployment_target_ver\n 4479 |                 .split('.')\n 4480 |                 .map(|v| v.parse::<u32>().expect(\"integer version\"));","lines":16,"link":"https://github.com/rust-lang/cc-rs/blob/527ec73d3be811bebe24eb355e4116bd844942c1/src/lib.rs#L4465-L4480"},{"ref":"src/lib.rs:4526-4541","code":" 4526 |             \"macos\" => deployment_from_env(\"MACOSX_DEPLOYMENT_TARGET\")\n 4527 |                 .and_then(maybe_cpp_version_baseline)\n 4528 |                 .or_else(default_deployment_from_sdk)\n 4529 |                 .unwrap_or_else(|| {\n 4530 |                     if target.arch == \"aarch64\" {\n 4531 |                         \"11.0\".into()\n 4532 |                     } else {\n 4533 |                         let default: Arc<str> = Arc::from(\"10.7\");\n 4534 |                         maybe_cpp_version_baseline(default.clone()).unwrap_or(default)\n 4535 |                     }\n 4536 |                 }),\n 4537 | \n 4538 |             \"ios\" => deployment_from_env(\"IPHONEOS_DEPLOYMENT_TARGET\")\n 4539 |                 .and_then(maybe_cpp_version_baseline)\n 4540 |                 .or_else(default_deployment_from_sdk)\n 4541 |                 .unwrap_or_else(|| \"7.0\".into()),","lines":16,"link":"https://github.com/rust-lang/cc-rs/blob/527ec73d3be811bebe24eb355e4116bd844942c1/src/lib.rs#L4526-L4541"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"add_env() calls env::join_paths(new).unwrap() to build the LIB/PATH/INCLUDE environment values. env::join_paths returns an Err if any path component contains the platform path-list separator (';' on Windows), which can occur if the user's pre-existing PATH/LIB/INCLUDE environment variable (read via env_getter.get_env) or a discovered SDK/VS install directory contains a semicolon. The unwrap() turns that recoverable condition into a panic inside what is otherwise an Option-returning, panic-free search routine.","fix":"Propagate the error instead of unwrapping, e.g. change into_tool/add_env to return Option<Tool> and use `env::join_paths(new).ok()?`, or fall back to the new paths only (skipping the unjoinable previous value) with a warning.","locations":[{"ref":"find-msvc-tools/src/find_tools.rs:1038-1050","code":" 1038 |     fn add_env(\n 1039 |         tool: &mut Tool,\n 1040 |         env: &'static str,\n 1041 |         paths: Vec<PathBuf>,\n 1042 |         env_getter: &dyn EnvGetter,\n 1043 |     ) {\n 1044 |         let prev = env_getter.get_env(env);\n 1045 |         let prev = prev.as_ref().map(AsRef::as_ref).unwrap_or_default();\n 1046 |         let prev = env::split_paths(&prev);\n 1047 |         let new = paths.into_iter().chain(prev);\n 1048 |         tool.env\n 1049 |             .push((env.to_string().into(), env::join_paths(new).unwrap()));\n 1050 |     }","lines":13,"link":"https://github.com/rust-lang/cc-rs/blob/527ec73d3be811bebe24eb355e4116bd844942c1/find-msvc-tools/src/find_tools.rs#L1038-L1050"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"try_compile() is documented (\"This will return a result instead of panicking\") yet it calls the panicking `self.get_compiler()` (not `try_get_compiler()`) when resolving the nvcc path for CUDA runtime linking. If compiler resolution fails at this point (e.g. misconfigured target/compiler), it panics via `fail()` instead of returning an `Err`, breaking the function's documented non-panicking contract.","fix":"Replace `self.get_compiler()` with `self.try_get_compiler()?` (or reuse the already-resolved compiler) so failures propagate as `Error` instead of panicking.","locations":[{"ref":"src/lib.rs:1800","code":" 1800 |             if let Some(nvcc) = self.which(&self.get_compiler().path, None) {","lines":1,"link":"https://github.com/rust-lang/cc-rs/blob/527ec73d3be811bebe24eb355e4116bd844942c1/src/lib.rs#L1800"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`is_duplicate_opt_arg` calls `flag.to_str().unwrap()` on the OsString being pushed, which will panic if any optimization flag built from caller-controlled data (e.g. via `Build::flag`/`Build::opt_level` combined with user-provided strings) is not valid UTF-8. The existing-args check on line 354 already defensively uses `to_str().unwrap_or(\"\")`, showing the author was aware OsStrings can be non-UTF8, but the same care was not applied to `flag` itself.","fix":"Use `flag.to_str()` and return false (not a duplicate / skip the check) when conversion fails, instead of unwrapping, mirroring the `unwrap_or(\"\")` pattern already used for the comparison side.","locations":[{"ref":"src/tool.rs:371-393","code":"  371 |     pub(crate) fn is_duplicate_opt_arg(&self, flag: &OsString) -> bool {\n  372 |         let flag = flag.to_str().unwrap();\n  373 |         let mut chars = flag.chars();\n  374 | \n  375 |         // Only duplicate check compiler flags\n  376 |         if self.is_like_msvc() {\n  377 |             if chars.next() != Some('/') {\n  378 |                 return false;\n  379 |             }\n  380 |         } else if (self.is_like_gnu() || self.is_like_clang()) && chars.next() != Some('-') {\n  381 |             return false;\n  382 |         }\n  383 | \n  384 |         // Check for existing optimization flags (-O, /O)\n  385 |         if chars.next() == Some('O') {\n  386 |             return self\n  387 |                 .args()\n  388 |                 .iter()\n  389 |                 .any(|a| a.to_str().unwrap_or(\"\").chars().nth(1) == Some('O'));\n  390 |         }\n  391 | \n  392 |         // TODO Check for existing -m..., -m...=..., /arch:... flags\n  393 |         false","lines":23,"link":"https://github.com/rust-lang/cc-rs/blob/527ec73d3be811bebe24eb355e4116bd844942c1/src/tool.rs#L371-L393"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In the Android-NDK standalone-clang-wrapper rewrite path (Windows + android target only), `path.to_str().unwrap()` will panic if the compiler's file name is not valid UTF-8. This is a narrow edge case but an unwrap on externally-influenced filesystem data inside otherwise carefully error-handled compiler-detection code.","fix":"Use `path.to_str()` with a fallback (e.g. skip the rewrite, or return an `Error::new(ErrorKind::InvalidTarget, ...)`) instead of unwrapping.","locations":[{"ref":"src/lib.rs:3448-3450","code":" 3448 |             if let Some(path) = tool.path.file_name() {\n 3449 |                 let file_name = path.to_str().unwrap().to_owned();\n 3450 |                 let (target, clang) = file_name.split_at(file_name.rfind('-').unwrap());","lines":3,"link":"https://github.com/rust-lang/cc-rs/blob/527ec73d3be811bebe24eb355e4116bd844942c1/src/lib.rs#L3448-L3450"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`custom_wrapper.as_deref().unwrap().to_str().unwrap()` panics if the user sets `CC_KNOWN_WRAPPER_CUSTOM` to a non-UTF-8 value. All other env var paths in this method use lossy/checked conversions; this one will abort the build with an unhelpful unwrap panic instead of a normal cc-rs `Error`.","fix":"Use `custom_wrapper.as_deref().and_then(|w| w.to_str())` and skip pushing into `known_wrappers` (or error out cleanly) when the value isn't valid UTF-8, instead of unwrapping.","locations":[{"ref":"src/lib.rs:3595-3598","code":" 3595 |         let custom_wrapper = self.get_env(\"CC_KNOWN_WRAPPER_CUSTOM\");\n 3596 |         if custom_wrapper.is_some() {\n 3597 |             known_wrappers.push(custom_wrapper.as_deref().unwrap().to_str().unwrap());\n 3598 |         }","lines":4,"link":"https://github.com/rust-lang/cc-rs/blob/527ec73d3be811bebe24eb355e4116bd844942c1/src/lib.rs#L3595-L3598"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"vs15plus_vc_read_version falls back to scanning for `Microsoft.VCToolsVersion.v*.default.txt` files and picks the lexicographically largest file name via plain string comparison (`name > &version_file`). Because the version number embedded in the filename (e.g. v143, v144) is zero-padded to a fixed width, lexicographic comparison happens to match numeric order for the currently-used 3-digit scheme, but is not a true numeric/semantic version comparison and will silently misorder if Microsoft ever changes the digit count.","fix":"Extract and parse the numeric portion of the version token and compare numerically instead of relying on fixed-width lexicographic string ordering, to avoid silent misordering if the format changes.","locations":[{"ref":"find-msvc-tools/src/find_tools.rs:913-928","code":"  913 |             // If the default doesn't exist, search for other version files.\n  914 |             // These are in the form Microsoft.VCToolsVersion.v143.default.txt\n  915 |             // where `143` is any three decimal digit version number.\n  916 |             // This sorts versions by lexical order and selects the highest version.\n  917 |             let mut version_file = String::new();\n  918 |             version_path.pop();\n  919 |             for file in version_path.read_dir().ok()? {\n  920 |                 let name = file.ok()?.file_name();\n  921 |                 let name = name.to_str()?;\n  922 |                 if name.starts_with(\"Microsoft.VCToolsVersion.v\")\n  923 |                     && name.ends_with(\".default.txt\")\n  924 |                     && name > &version_file\n  925 |                 {\n  926 |                     version_file.replace_range(.., name);\n  927 |                 }\n  928 |             }","lines":16,"link":"https://github.com/rust-lang/cc-rs/blob/527ec73d3be811bebe24eb355e4116bd844942c1/find-msvc-tools/src/find_tools.rs#L913-L928"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"The generated LLVM_TARGETS table maps the rustc target name \"x86_64-unknown-motor\" to \"x86_64-unknown-none-elf\", but the actual rustc target (and the one exercised by the test suite in parser.rs at line 507) is \"x86_64-unknown-moturus\". Because llvm_target() does a binary search on the exact rustc_target string, the real \"x86_64-unknown-moturus\" target will never hit this table entry and instead always falls through to the generic triple-construction logic, making the table entry dead/unreachable for the real-world target name.","fix":"Regenerate generated.rs via dev-tools/gen-target-info (or manually fix the entry) so the key is \"x86_64-unknown-moturus\" to match the actual rustc target triple, keeping the table's sort order intact for binary_search_by_key.","locations":[{"ref":"src/target/generated.rs:327","code":"  327 |     (\"x86_64-unknown-motor\", \"x86_64-unknown-none-elf\"),","lines":1,"link":"https://github.com/rust-lang/cc-rs/blob/527ec73d3be811bebe24eb355e4116bd844942c1/src/target/generated.rs#L327"},{"ref":"src/target/parser.rs:512","code":"  512 |             \"x86_64-unknown-moturus\",","lines":1,"link":"https://github.com/rust-lang/cc-rs/blob/527ec73d3be811bebe24eb355e4116bd844942c1/src/target/parser.rs#L512"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `is_duplicate_opt_arg`, the duplicate-optimization check `a.to_str().unwrap_or(\"\").chars().nth(1) == Some('O')` inspects the second character of each existing argument without first verifying the existing argument actually starts with the expected prefix ('-' or '/'). An unrelated two-character argument whose second character happens to be 'O' (e.g. a path or flag like `xO...`) would be misidentified as a duplicate optimization flag.","fix":"Filter existing args to those that start with the same prefix character ('-' or '/') used for `flag` before comparing the second character, e.g. `a.to_str().ok().filter(|s| s.starts_with(prefix)).and_then(|s| s.chars().nth(1)) == Some('O')`.","locations":[{"ref":"src/tool.rs:384-390","code":"  384 |         // Check for existing optimization flags (-O, /O)\n  385 |         if chars.next() == Some('O') {\n  386 |             return self\n  387 |                 .args()\n  388 |                 .iter()\n  389 |                 .any(|a| a.to_str().unwrap_or(\"\").chars().nth(1) == Some('O'));\n  390 |         }","lines":7,"link":"https://github.com/rust-lang/cc-rs/blob/527ec73d3be811bebe24eb355e4116bd844942c1/src/tool.rs#L384-L390"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"medium","description":"In try_compile, when `output` is exactly \"lib.a\" (the minimal string satisfying `starts_with(\"lib\") && ends_with(\".a\")`), `lib_name` becomes the empty string (`output[3..3]`). This produces a malformed `cargo:rustc-link-lib=static=` metadata line with no library name, rather than an error.","fix":"Reject output values that would yield an empty lib_name (e.g. require output.len() > 5 when it has the lib/.a wrapping) and return ErrorKind::InvalidArgument.","locations":[{"ref":"src/lib.rs:1692-1700","code":" 1692 |         let (lib_name, gnu_lib_name) = if output.starts_with(\"lib\") && output.ends_with(\".a\") {\n 1693 |             (&output[3..output.len() - 2], output.to_owned())\n 1694 |         } else {\n 1695 |             let mut gnu = String::with_capacity(5 + output.len());\n 1696 |             gnu.push_str(\"lib\");\n 1697 |             gnu.push_str(output);\n 1698 |             gnu.push_str(\".a\");\n 1699 |             (output, gnu)\n 1700 |         };","lines":9,"link":"https://github.com/rust-lang/cc-rs/blob/527ec73d3be811bebe24eb355e4116bd844942c1/src/lib.rs#L1692-L1700"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"The `cudart()` setter accepts any `&str` without validation and silently stores it. The only place that validates the value is deep inside try_compile()'s linking logic, which calls `panic!(\"unsupported cudart option: {}\", bad)` for any value other than \"shared\"/\"static\" (after the \"none\" check). This means a typo like `.cudart(\"staticc\")` passes silently at config time and only crashes the build script much later, inside a function that should return Result, not panic.","fix":"Validate the cudart value in the `cudart()` setter (returning a Result or storing a typed enum), or replace the `panic!` in try_compile with `return Err(Error::new(ErrorKind::InvalidArgument, ...))`.","locations":[{"ref":"src/lib.rs:899-904","code":"  899 |     pub fn cudart(&mut self, cudart: &str) -> &mut Build {\n  900 |         if self.cuda {\n  901 |             self.cudart = Some(cudart.into());\n  902 |         }\n  903 |         self\n  904 |     }","lines":6,"link":"https://github.com/rust-lang/cc-rs/blob/527ec73d3be811bebe24eb355e4116bd844942c1/src/lib.rs#L899-L904"},{"ref":"src/lib.rs:1839-1843","code":" 1839 |                 let lib = match cudart {\n 1840 |                     \"shared\" => \"cudart\",\n 1841 |                     \"static\" => \"cudart_static\",\n 1842 |                     bad => panic!(\"unsupported cudart option: {}\", bad),\n 1843 |                 };","lines":5,"link":"https://github.com/rust-lang/cc-rs/blob/527ec73d3be811bebe24eb355e4116bd844942c1/src/lib.rs#L1839-L1843"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"In the wait loop, `pendings.retain_mut` only keeps the last failing command's error in `error: Option<Error>`; if multiple parallel compiler invocations fail, all but the final one are silently dropped unless `cargo_output.warnings` is enabled, in which case they are merely printed as `cargo:warning=` lines rather than reported as build errors. A user running without `-vv`/warnings enabled only ever learns about the single last failure, with no indication that other compilation units also failed.","fix":"Always surface that multiple commands failed (e.g. print a fixed warning/diagnostic listing all failures regardless of cargo_output.warnings, or aggregate all errors into a single multi-error type) instead of relying on the optional warnings flag.","locations":[{"ref":"src/parallel/command_runner.rs:116-138","code":"  116 |                 pendings.retain_mut(|(cmd, child, _token)| {\n  117 |                     match try_wait_on_child(cmd, &mut child.0, &mut stdout, &mut child.1) {\n  118 |                         Ok(Some(())) => {\n  119 |                             // Task done, remove the entry\n  120 |                             has_made_progress.set(true);\n  121 |                             false\n  122 |                         }\n  123 |                         Ok(None) => true, // Task still not finished, keep the entry\n  124 |                         Err(err) => {\n  125 |                             // Task fail, remove the entry.\n  126 |                             // Since we can only return one error, log the error to make\n  127 |                             // sure users always see all the compilation failures.\n  128 |                             has_made_progress.set(true);\n  129 | \n  130 |                             if cargo_output.warnings {\n  131 |                                 let _ = writeln!(stdout, \"cargo:warning={}\", err);\n  132 |                             }\n  133 |                             error = Some(err);\n  134 | \n  135 |                             false\n  136 |                         }\n  137 |                     }\n  138 |                 });","lines":23,"link":"https://github.com/rust-lang/cc-rs/blob/527ec73d3be811bebe24eb355e4116bd844942c1/src/parallel/command_runner.rs#L116-L138"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"get_target_specs_from_json, get_targets_msrv, and get_target_spec_from_msrv all panic via cmd.output().unwrap() if rustc/cargo cannot even be spawned (e.g. missing +nightly or +1.63 toolchain), giving a raw 'No such file or directory (os error 2)' or toolchain-not-installed error with no context about which subprocess failed or how to fix it, instead of a clearer message.","fix":"Replace .unwrap() on cmd.output() with .unwrap_or_else(|e| panic!(\"failed to spawn {:?}: {}\", cmd, e)) to surface which rustc invocation failed and why (e.g. missing +1.63/+nightly toolchain).","locations":[{"ref":"dev-tools/gen-target-info/src/read.rs:17","code":"   17 |     let process::Output { status, stdout, .. } = cmd.output().unwrap();","lines":1,"link":"https://github.com/rust-lang/cc-rs/blob/527ec73d3be811bebe24eb355e4116bd844942c1/dev-tools/gen-target-info/src/read.rs#L17"},{"ref":"dev-tools/gen-target-info/src/read.rs:40","code":"   40 |     let process::Output { status, stdout, .. } = cmd.output().unwrap();","lines":1,"link":"https://github.com/rust-lang/cc-rs/blob/527ec73d3be811bebe24eb355e4116bd844942c1/dev-tools/gen-target-info/src/read.rs#L40"},{"ref":"dev-tools/gen-target-info/src/read.rs:60","code":"   60 |     let process::Output { status, stdout, .. } = cmd.output().unwrap();","lines":1,"link":"https://github.com/rust-lang/cc-rs/blob/527ec73d3be811bebe24eb355e4116bd844942c1/dev-tools/gen-target-info/src/read.rs#L60"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"Throughout setup_config.rs and com.rs, COM HRESULT failures are propagated as a bare i32 (Err(err)) with no formatting/decoding, and many call sites in find_tools.rs (vs15plus_instances_using_com, SetupConfiguration::new, etc.) immediately discard the error via `.ok()?`, silently falling through to the vswhere-based fallback or to None. This makes it impossible for a caller of find_tool/find to diagnose why MSVC detection failed (e.g. COM not registered vs. a real registration corruption) since all failure modes collapse to the same None result with no diagnostic trail.","fix":"Consider retaining the last HRESULT/error along the fallback chain (e.g. via a Result-returning internal API or logging) so that find_tool failures can be diagnosed; at minimum this is a usability/debuggability gap rather than a correctness bug.","locations":[{"ref":"find-msvc-tools/src/find_tools.rs:674-681","code":"  674 |     fn vs15plus_instances_using_com() -> Option<VsInstances> {\n  675 |         com::initialize().ok()?;\n  676 | \n  677 |         let config = SetupConfiguration::new().ok()?;\n  678 |         let enum_setup_instances = config.enum_all_instances().ok()?;\n  679 | \n  680 |         Some(VsInstances::ComBased(enum_setup_instances))\n  681 |     }","lines":8,"link":"https://github.com/rust-lang/cc-rs/blob/527ec73d3be811bebe24eb355e4116bd844942c1/find-msvc-tools/src/find_tools.rs#L674-L681"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`com::initialize()` calls `CoInitializeEx` but `CoUninitialize` is never called anywhere in the crate. COM requires every successful `CoInitializeEx` to be matched by a `CoUninitialize` on the same thread; failing to do so leaves the calling thread's COM apartment state initialized indefinitely, which can interfere with other code on that thread (e.g. a long-lived build-script process, or an embedding application that manages its own COM lifecycle) and leaks the implicit apartment reference until thread exit.","fix":"Track whether CoInitializeEx succeeded (and wasn't S_FALSE, i.e. someone else already owns initialization) and call CoUninitialize on the same thread once the COM-based lookups are done, or use a thread-local RAII guard that calls CoUninitialize on drop only when this call was the one that performed the initialization.","locations":[{"ref":"find-msvc-tools/src/com.rs:24-32","code":"   24 | pub fn initialize() -> Result<(), HRESULT> {\n   25 |     let err = unsafe { CoInitializeEx(null(), COINIT_MULTITHREADED.try_into().unwrap()) };\n   26 |     if err != S_OK && err != S_FALSE {\n   27 |         // S_FALSE just means COM is already initialized\n   28 |         Err(err)\n   29 |     } else {\n   30 |         Ok(())\n   31 |     }\n   32 | }","lines":9,"link":"https://github.com/rust-lang/cc-rs/blob/527ec73d3be811bebe24eb355e4116bd844942c1/find-msvc-tools/src/com.rs#L24-L32"},{"ref":"find-msvc-tools/src/find_tools.rs:674-681","code":"  674 |     fn vs15plus_instances_using_com() -> Option<VsInstances> {\n  675 |         com::initialize().ok()?;\n  676 | \n  677 |         let config = SetupConfiguration::new().ok()?;\n  678 |         let enum_setup_instances = config.enum_all_instances().ok()?;\n  679 | \n  680 |         Some(VsInstances::ComBased(enum_setup_instances))\n  681 |     }","lines":8,"link":"https://github.com/rust-lang/cc-rs/blob/527ec73d3be811bebe24eb355e4116bd844942c1/find-msvc-tools/src/find_tools.rs#L674-L681"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`Tool::cflags_env` builds the CFLAGS string by pushing every arg in `self.args` joined with spaces, but does not filter out `self.removed_args` the way `to_command` does (`cmd.args(self.args.iter().filter(|a| !self.removed_args.contains(a)))`). This means flags explicitly marked for removal via `remove_arg` still leak into the `CFLAGS` value returned to configure scripts, inconsistent with what is actually passed to the compiler via `to_command`.","fix":"Filter `self.args` by `!self.removed_args.contains(a)` in `cflags_env` the same way `to_command` does, so the reported CFLAGS matches what is actually invoked.","locations":[{"ref":"src/tool.rs:421","code":"  421 |         cmd.args(self.args.iter().filter(|a| !self.removed_args.contains(a)));","lines":1,"link":"https://github.com/rust-lang/cc-rs/blob/527ec73d3be811bebe24eb355e4116bd844942c1/src/tool.rs#L421"},{"ref":"src/tool.rs:475-484","code":"  475 |     pub fn cflags_env(&self) -> OsString {\n  476 |         let mut flags = OsString::new();\n  477 |         for (i, arg) in self.args.iter().enumerate() {\n  478 |             if i > 0 {\n  479 |                 flags.push(\" \");\n  480 |             }\n  481 |             flags.push(arg);\n  482 |         }\n  483 |         flags\n  484 |     }","lines":10,"link":"https://github.com/rust-lang/cc-rs/blob/527ec73d3be811bebe24eb355e4116bd844942c1/src/tool.rs#L475-L484"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`objects_from_files` calls `file.to_string_lossy()` for both `basename` and `dirname` and then conditionally allocates a `Cow::Owned` for `dirname` via `strip_prefix`, inside a per-file loop. For projects with many source files this performs repeated lossy UTF-8 conversions and string allocations (plus a `format!` and a `DefaultHasher`) per file when a simpler path-based join could avoid some of the intermediate String work, though the impact is minor relative to actual compilation cost.","fix":"Low priority; if optimizing, compute the CARGO_MANIFEST_DIR-relative stripping once outside the loop where possible, and avoid re-deriving `to_string_lossy` results that are only used for hashing by hashing the raw OsStr bytes directly (already partially done via `hasher.write(dirname.as_bytes())`).","locations":[{"ref":"src/command_helpers.rs:283-341","code":"  283 | pub(crate) fn objects_from_files(files: &[Arc<Path>], dst: &Path) -> Result<Vec<Object>, Error> {\n  284 |     let mut objects = Vec::with_capacity(files.len());\n  285 |     for file in files {\n  286 |         let basename = file\n  287 |             .file_name()\n  288 |             .ok_or_else(|| {\n  289 |                 Error::new(\n  290 |                     ErrorKind::InvalidArgument,\n  291 |                     \"No file_name for object file path!\",\n  292 |                 )\n  293 |             })?\n  294 |             .to_string_lossy();\n  295 |         let dirname = file\n  296 |             .parent()\n  297 |             .ok_or_else(|| {\n  298 |                 Error::new(\n  299 |                     ErrorKind::InvalidArgument,\n  300 |                     \"No parent for object file path!\",\n  301 |                 )\n  302 |             })?\n  303 |             .to_string_lossy();\n  304 | \n  305 |         // Hash the dirname. This should prevent conflicts if we have multiple\n  306 |         // object files with the same filename in different subfolders.\n  307 |         let mut hasher = hash_map::DefaultHasher::new();\n  308 | \n  309 |         // Make the dirname relative (if possible) to avoid full system paths influencing the sha\n  310 |         // and making the output system-dependent\n  311 |         let dirname = if let Some(root) = cargo_env_var_os(\"CARGO_MANIFEST_DIR\") {\n  312 |             let root = root.to_string_lossy();\n  313 |             Cow::Borrowed(dirname.strip_prefix(&*root).unwrap_or(&dirname))\n  314 |         } else {\n  315 |             dirname\n  316 |         };\n  317 | \n  318 |         hasher.write(dirname.as_bytes());\n  319 |         if let Some(extension) = file.extension() {\n  320 |             hasher.write(extension.to_string_lossy().as_bytes());\n  321 |         }\n  322 | \n  323 |         let obj = dst\n  324 |             .join(format!(\"{:016x}-{}\", hasher.finish(), basename))\n  325 |             .with_extension(\"o\");\n  326 | \n  327 |         match obj.parent() {\n  328 |             Some(s) => fs::create_dir_all(s)?,\n  329 |             None => {\n  330 |                 return Err(Error::new(\n  331 |                     ErrorKind::InvalidArgument,\n  332 |                     \"dst is an invalid path with no parent\",\n  333 |                 ));\n  334 |             }\n  335 |         };\n  336 | \n  337 |         objects.push(Object::new(file.to_path_buf(), obj));\n  338 |     }\n  339 | \n  340 |     Ok(objects)\n  341 | }","lines":59,"link":"https://github.com/rust-lang/cc-rs/blob/527ec73d3be811bebe24eb355e4116bd844942c1/src/command_helpers.rs#L283-L341"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The PRELUDE string written into the shipped generated file find-msvc-tools/src/windows_sys.rs tells readers to edit 'windows_sys.lst' and run from 'dev-tools/generate-windows-sys/', but the actual file is windows_sys.list and the actual directory is dev-tools/gen-windows-sys-binding/. This stale instruction is committed into a file shipped with the published find-msvc-tools crate, actively misleading anyone trying to regenerate bindings.","fix":"Update the PRELUDE constant to say 'edit windows_sys.list then run: cd dev-tools/gen-windows-sys-binding/ && cargo run', matching the actual filename and directory, then regenerate windows_sys.rs.","locations":[{"ref":"dev-tools/gen-windows-sys-binding/src/lib.rs:14-21","code":"   14 | const PRELUDE: &str = r#\"// This file is autogenerated.\n   15 | //\n   16 | // To add bindings, edit windows_sys.lst then run:\n   17 | //\n   18 | // ```\n   19 | // cd dev-tools/generate-windows-sys/\n   20 | // cargo run\n   21 | // ```\"#;","lines":8,"link":"https://github.com/rust-lang/cc-rs/blob/527ec73d3be811bebe24eb355e4116bd844942c1/dev-tools/gen-windows-sys-binding/src/lib.rs#L14-L21"},{"ref":"find-msvc-tools/src/windows_sys.rs:1-7","code":"    1 | // This file is autogenerated.\n    2 | //\n    3 | // To add bindings, edit windows_sys.lst then run:\n    4 | //\n    5 | // ```\n    6 | // cd dev-tools/generate-windows-sys/\n    7 | // cargo run","lines":7,"link":"https://github.com/rust-lang/cc-rs/blob/527ec73d3be811bebe24eb355e4116bd844942c1/find-msvc-tools/src/windows_sys.rs#L1-L7"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"The doc comments for `get_archiver` and `get_ranlib` are copy-pasted verbatim from `get_compiler`'s doc comment, claiming the method 'will take into account all configuration such as debug information, optimization level, include directories, defines, etc.' None of that applies to archiver/ranlib selection, which only consults environment variables (AR/RANLIB, ARFLAGS/RANLIBFLAGS) and target information.","fix":"Reword the doc comments for get_archiver/get_ranlib to describe only what actually influences archiver/ranlib selection (explicit archiver/ranlib setting, AR/RANLIB env vars, target os/env), removing the misleading references to debug info, optimization level, include dirs, and defines.","locations":[{"ref":"src/lib.rs:3662-3667","code":" 3662 |     /// This method will take into account all configuration such as debug\n 3663 |     /// information, optimization level, include directories, defines, etc.\n 3664 |     /// Additionally, the compiler binary in use follows the standard\n 3665 |     /// conventions for this path, e.g. looking at the explicitly set compiler,\n 3666 |     /// environment variables (a number of which are inspected here), and then\n 3667 |     /// falling back to the default configuration.","lines":6,"link":"https://github.com/rust-lang/cc-rs/blob/527ec73d3be811bebe24eb355e4116bd844942c1/src/lib.rs#L3662-L3667"},{"ref":"src/lib.rs:3662-3667","code":" 3662 |     /// This method will take into account all configuration such as debug\n 3663 |     /// information, optimization level, include directories, defines, etc.\n 3664 |     /// Additionally, the compiler binary in use follows the standard\n 3665 |     /// conventions for this path, e.g. looking at the explicitly set compiler,\n 3666 |     /// environment variables (a number of which are inspected here), and then\n 3667 |     /// falling back to the default configuration.","lines":6,"link":"https://github.com/rust-lang/cc-rs/blob/527ec73d3be811bebe24eb355e4116bd844942c1/src/lib.rs#L3662-L3667"}]},

{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"The doc comment on `NamedTempfile::path` area / `detect_family_inner` claims 'Close the file handle *now*, otherwise the compiler may fail to open it on Windows (#1082)' is accurate, but the surrounding `tmp.take_file().unwrap()` call assumes `NamedTempfile::new` always yields `file: Some(..)`; this isn't documented as an invariant anywhere near `take_file`, so a future change to `NamedTempfile::new` (e.g. lazy file creation) could silently turn this into a panic with no nearby comment explaining why `unwrap()` is safe.","fix":"Add a one-line comment at the `take_file().unwrap()` call site noting that `NamedTempfile::new` always returns a populated `file` field, so future refactors of `tempfile.rs` don't break this invariant silently.","locations":[{"ref":"src/tool.rs:227","code":"  227 |             let mut tmp_file = tmp.take_file().unwrap();","lines":1,"link":"https://github.com/rust-lang/cc-rs/blob/527ec73d3be811bebe24eb355e4116bd844942c1/src/tool.rs#L227"},{"ref":"src/tempfile.rs:47-61","code":"   47 | impl NamedTempfile {\n   48 |     pub(super) fn new(base: &Path, suffix: &str) -> io::Result<Self> {\n   49 |         for _ in 0..10 {\n   50 |             let path = base.join(tmpname(suffix));\n   51 |             match create_named(&path) {\n   52 |                 Ok(file) => {\n   53 |                     return Ok(Self {\n   54 |                         file: Some(file),\n   55 |                         path,\n   56 |                     })\n   57 |                 }\n   58 |                 Err(e) if e.kind() == io::ErrorKind::AlreadyExists => continue,\n   59 |                 Err(e) => return Err(e),\n   60 |             };\n   61 |         }","lines":15,"link":"https://github.com/rust-lang/cc-rs/blob/527ec73d3be811bebe24eb355e4116bd844942c1/src/tempfile.rs#L47-L61"}]},

{"id":"OTHER_1","type":"other","type_label":"Other","severity":"medium","difficulty":"medium","description":"BStr::to_osstring() calls SysStringLen(self.0) and then slice::from_raw_parts(self.0, len) even when self.0 is a null BSTR pointer. COM APIs may legitimately return a NULL BSTR for an empty/absent string on success (S_OK), not just on failure; callers in setup_config.rs only check `err < 0` before unconditionally wrapping the (possibly still-null) BSTR and calling to_osstring(). slice::from_raw_parts requires a non-null, well-aligned pointer even for a zero-length slice, so this is technically UB in Rust despite SysStringLen being documented safe for NULL at the Win32 level.","fix":"In BStr::to_osstring, special-case a null pointer and return an empty OsString without calling from_raw_parts, e.g. `if self.0.is_null() { return OsString::new(); }` before computing len/slice.","locations":[{"ref":"find-msvc-tools/src/com.rs:100-104","code":"  100 |     pub fn to_osstring(&self) -> OsString {\n  101 |         let len = unsafe { SysStringLen(self.0) };\n  102 |         let slice = unsafe { from_raw_parts(self.0, len as usize) };\n  103 |         OsStringExt::from_wide(slice)\n  104 |     }","lines":5,"link":"https://github.com/rust-lang/cc-rs/blob/527ec73d3be811bebe24eb355e4116bd844942c1/find-msvc-tools/src/com.rs#L100-L104"},{"ref":"find-msvc-tools/src/setup_config.rs:214-259","code":"  214 |     pub fn instance_id(&self) -> Result<OsString, i32> {\n  215 |         let mut s = null();\n  216 |         let err = unsafe { self.0.GetInstanceId(&mut s) };\n  217 |         let bstr = unsafe { BStr::from_raw(s) };\n  218 |         if err < 0 {\n  219 |             return Err(err);\n  220 |         }\n  221 |         Ok(bstr.to_osstring())\n  222 |     }\n  223 |     pub fn installation_name(&self) -> Result<OsString, i32> {\n  224 |         let mut s = null();\n  225 |         let err = unsafe { self.0.GetInstallationName(&mut s) };\n  226 |         let bstr = unsafe { => {\n  119 |                             // Task done, remove the entry\n  120 |                             has_made_progress.set(true);\n  121 |                             false\n  122 |                         }\n  123 |                         Ok(None) => true, // Task still not finished, keep the entry\n  124 |                         Err(err) => {\n  125 |                             // Task fail, remove the entry.\n  126 |                             // Since we can only return one error, log the error to make\n  127 |                             // sure users always see all the compilation failures.\n  128 |                             has_made_progress.set(true);\n  129 | \n  130 |                             if cargo_output.warnings {\n  131 |                                 let _ = writeln!(stdout, \"cargo:warning={}\", err);\n  132 |                             }\n  133 |                             error = Some(err);\n  134 | \n  135 |                             false\n  136 |                         }\n  137 |                     }\n  138 |                 });\n  139 |                 pendings_is_empty = pendings.is_empty();\n  140 |                 pendings\n  141 |             });","lines":28,"link":"https://github.com/rust-lang/cc-rs/blob/527ec73d3be811bebe24eb355e4116bd844942c1/src/parallel/command_runner.rs#L114-L141"}]},
