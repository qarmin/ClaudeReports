<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`cargo ndk-test` runs `cargo test` and then unconditionally calls `std::process::exit(0)`, discarding the real exit status. The `.status()` result is `.unwrap()`-ed and thrown away, so the command reports success even when the on-device tests fail. In CI this means failing tests are reported as passing.","fix":"Capture the status: `let status = test_cmd.status()?;` and exit with its code: `std::process::exit(status.code().unwrap_or(1));`. Avoid `.unwrap()` so a spawn failure surfaces as an error instead of a panic.","locations":[{"ref":"src/cli/test.rs:158-173","code":"  158 |     let mut test_cmd = Command::new(\"cargo\");\n  159 |     test_cmd\n  160 |         .args([\"test\", \"--target\", triple])\n  161 |         .args(&args.cargo_args)\n  162 |         .arg(\"--\")\n  163 |         .args(&args.test_args)\n  164 |         .envs(env_vars)\n  165 |         .current_dir(&working_dir);\n  166 | \n  167 |     if let Some(manifest_path) = &args.manifest_path {\n  168 |         test_cmd.arg(\"--manifest-path\").arg(manifest_path);\n  169 |     }\n  170 | \n  171 |     test_cmd.status().unwrap();\n  172 | \n  173 |     std::process::exit(0);","lines":16,"link":"https://github.com/bbqsrc/cargo-ndk/blob/263131b177b2cf1fe0891e6c537dbe64011a6b4a/src/cli/test.rs#L158-L173"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In `ndk-test` the `--manifest-path` argument is appended to the `cargo test` command AFTER the `--` separator and the test args. Everything after `--` is forwarded to the test binary, so `--manifest-path <path>` is passed to the test harness instead of to cargo. The flag is therefore silently ineffective (and may make the test binary error on an unknown argument).","fix":"Add the manifest-path flag to the cargo arguments before the `--` separator: append `.arg(\"--manifest-path\").arg(p)` to the cargo portion of the command, and only then append `.arg(\"--\").args(&args.test_args)`.","locations":[{"ref":"src/cli/test.rs:158-169","code":"  158 |     let mut test_cmd = Command::new(\"cargo\");\n  159 |     test_cmd\n  160 |         .args([\"test\", \"--target\", triple])\n  161 |         .args(&args.cargo_args)\n  162 |         .arg(\"--\")\n  163 |         .args(&args.test_args)\n  164 |         .envs(env_vars)\n  165 |         .current_dir(&working_dir);\n  166 | \n  167 |     if let Some(manifest_path) = &args.manifest_path {\n  168 |         test_cmd.arg(\"--manifest-path\").arg(manifest_path);\n  169 |     }","lines":12,"link":"https://github.com/bbqsrc/cargo-ndk/blob/263131b177b2cf1fe0891e6c537dbe64011a6b4a/src/cli/test.rs#L158-L169"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The output-dir canonicalization fallback checks the wrong variable. On canonicalize failure it returns the raw (possibly relative) `output_dir` only when `out_dir.is_absolute()` is true, where `out_dir` is the cargo `target_directory`, not the user's output directory. Since `target_directory` is essentially always absolute, the guard nearly always passes and a relative `output_dir` is used uncanonicalized - exactly the case the comment says must be avoided because the path is shared with build scripts running in a different cwd.","fix":"Test the user path instead: `if output_dir.is_absolute() { output_dir.clone() } else { std::process::exit(1) }`.","locations":[{"ref":"src/cli/mod.rs:561-578","code":"  561 |     if let Some(output_dir) = args.output_dir.as_ref() {\n  562 |         if let Err(e) = fs::create_dir_all(output_dir) {\n  563 |             shell.error(format!(\"failed to create output dir, {e}\"))?;\n  564 |             std::process::exit(1);\n  565 |         }\n  566 | \n  567 |         // Canonicalize because path is shared with build scripts that can run in a different current_dir.\n  568 |         let output_dir = match dunce::canonicalize(output_dir) {\n  569 |             Ok(p) => p,\n  570 |             Err(e) => {\n  571 |                 shell.error(format!(\"failed to canonicalize output dir, {e}\"))?;\n  572 |                 if out_dir.is_absolute() {\n  573 |                     output_dir.clone()\n  574 |                 } else {\n  575 |                     std::process::exit(1)\n  576 |                 }\n  577 |             }\n  578 |         };","lines":18,"link":"https://github.com/bbqsrc/cargo-ndk/blob/263131b177b2cf1fe0891e6c537dbe64011a6b4a/src/cli/mod.rs#L561-L578"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"When verbosity is not Quiet, `verbosity_arg` is the empty string `\"\"`, and it is still passed as an argument to the test binary on the device. The test binary therefore receives a stray empty argument, which can confuse argument parsers (e.g. libtest treats a positional empty filter).","fix":"Only push the verbosity flag when it is non-empty: push the `-q` argument solely in the Quiet case, instead of always passing `verbosity_arg`.","locations":[{"ref":"src/cli/runner.rs:114-125","code":"  114 |     let verbosity_arg = match verbosity {\n  115 |         Verbosity::Quiet => \"-q\",\n  116 |         _ => \"\",\n  117 |     };\n  118 | \n  119 |     let run_status = Command::new(&adb_path)\n  120 |         .with_serial(adb_serial)\n  121 |         .arg(\"shell\")\n  122 |         .arg(&device_path)\n  123 |         .arg(verbosity_arg)\n  124 |         .args(&args.runner_args)\n  125 |         .status()?;","lines":12,"link":"https://github.com/bbqsrc/cargo-ndk/blob/263131b177b2cf1fe0891e6c537dbe64011a6b4a/src/cli/runner.rs#L114-L125"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`ndk-test` parses `--adb-serial` into `args.adb_serial` but never forwards it. The actual device selection is done by cargo-ndk-runner, which reads `CARGO_NDK_ADB_SERIAL` from its environment. Since the parsed value is not re-exported into the child `cargo test` environment, passing `--adb-serial` on the command line (as opposed to the env var) has no effect.","fix":"After parsing, set the env var on the child process (env key `CARGO_NDK_ADB_SERIAL`) when `args.adb_serial` is `Some`, so the runner observes the CLI-provided serial.","locations":[{"ref":"src/cli/test.rs:34-40","code":"   34 |     #[arg(long, env = \"CARGO_NDK_ADB_SERIAL\")]\n   35 |     /// \"Serial number\" of the device to use for testing (e.g. \"emulator-5554\" or \"0123456789ABCDEF\")\n   36 |     ///\n   37 |     /// You can find the serial number of your device by running `adb devices`.\n   38 |     ///\n   39 |     /// If not set, the first available device will be used.\n   40 |     adb_serial: Option<String>,","lines":7,"link":"https://github.com/bbqsrc/cargo-ndk/blob/263131b177b2cf1fe0891e6c537dbe64011a6b4a/src/cli/test.rs#L34-L40"},{"ref":"src/cli/test.rs:138-165","code":"  138 |     let env_vars = crate::cargo::build_env(\n  139 |         triple,\n  140 |         &ndk_home,\n  141 |         &ndk_version,\n  142 |         &clang_target,\n  143 |         platform,\n  144 |         &target.to_string(),\n  145 |         args.link_builtins,\n  146 |         args.link_cxx_shared,\n  147 |     );\n  148 | \n  149 |     shell.verbose(|shell| {\n  150 |         shell.status_with_color(\n  151 |             \"Building\",\n  152 |             format!(\"test binary for {} ({})\", target, triple),\n  153 |             termcolor::Color::Cyan,\n  154 |         )\n  155 |     })?;\n  156 | \n  157 |     // Now we have the test binary built, we can find it in the output\n  158 |     let mut test_cmd = Command::new(\"cargo\");\n  159 |     test_cmd\n  160 |         .args([\"test\", \"--target\", triple])\n  161 |         .args(&args.cargo_args)\n  162 |         .arg(\"--\")\n  163 |         .args(&args.test_args)\n  164 |         .envs(env_vars)\n  165 |         .current_dir(&working_dir);","lines":28,"link":"https://github.com/bbqsrc/cargo-ndk/blob/263131b177b2cf1fe0891e6c537dbe64011a6b4a/src/cli/test.rs#L138-L165"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`clang_lib_path` selects the clang version directory with `max_by(|a, b| a.file_name().cmp(&b.file_name()))`, i.e. a lexicographic string comparison of directory names. Clang library directories are version numbers (e.g. `14.0.7`, `17.0.2`, `9.0.9`); lexicographically `\"9.0.9\" > \"17.0.2\"`, so if multiple versions are present the older one can be chosen. Reached only when `--link-builtins` is set.","fix":"Parse the directory names as versions (e.g. `semver::Version` like elsewhere in the crate, or split on '.' and compare numerically) and select the maximum by that, falling back gracefully when a name is unparsable.","locations":[{"ref":"src/cargo.rs:48-53","code":"   48 |     let clang_lib_version = std::fs::read_dir(&clang_folder)\n   49 |         .expect(\"Unable to get clang target directory\")\n   50 |         .filter_map(|a| a.ok())\n   51 |         .max_by(|a, b| a.file_name().cmp(&b.file_name()))\n   52 |         .expect(\"Unable to get clang target\")\n   53 |         .path();","lines":6,"link":"https://github.com/bbqsrc/cargo-ndk/blob/263131b177b2cf1fe0891e6c537dbe64011a6b4a/src/cargo.rs#L48-L53"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"medium","description":"Inside the per-target build loop, `CARGO_NDK_ANDROID_PLATFORM` is set to `target.to_string()` (the ABI name, e.g. `arm64-v8a`), and the accompanying log line also labels it `CARGO_NDK_ANDROID_PLATFORM`. Earlier (line 601-603) and in `build_env` the same variable is correctly set to the platform/API level number. This looks like a copy-paste from the `ANDROID_ABI` block: the value/label is wrong. It is masked at runtime only because `build_env` re-sets the variable to the correct value in the child's env map.","fix":"Remove this stray assignment, or fix it to export the intended variable (the ABI belongs in `ANDROID_ABI`, set just below at lines 651-662).","locations":[{"ref":"src/cli/mod.rs:628-637","code":"  628 |             shell.very_verbose(|shell| {\n  629 |                 shell.status_with_color(\n  630 |                     \"Exporting\",\n  631 |                     format!(\"CARGO_NDK_ANDROID_PLATFORM={:?}\", target.to_string()),\n  632 |                     termcolor::Color::Cyan,\n  633 |                 )\n  634 |             })?;\n  635 |             unsafe {\n  636 |                 std::env::set_var(\"CARGO_NDK_ANDROID_PLATFORM\", target.to_string());\n  637 |             }","lines":10,"link":"https://github.com/bbqsrc/cargo-ndk/blob/263131b177b2cf1fe0891e6c537dbe64011a6b4a/src/cli/mod.rs#L628-L637"},{"ref":"src/cli/mod.rs:601-603","code":"  601 |     unsafe {\n  602 |         std::env::set_var(\"CARGO_NDK_ANDROID_PLATFORM\", platform.to_string());\n  603 |     }","lines":3,"link":"https://github.com/bbqsrc/cargo-ndk/blob/263131b177b2cf1fe0891e6c537dbe64011a6b4a/src/cli/mod.rs#L601-L603"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"The per-target loop mutates the parent process environment (`ANDROID_PLATFORM`, `ANDROID_ABI`, `CARGO_NDK_ANDROID_PLATFORM`) via `set_var`, but `crate::cargo::run` -> `build_env` constructs its own `BTreeMap` of env vars that is applied to the child via `cargo_cmd.envs(...)`, overriding all three. Nothing in the parent reads these between iterations, so the loop's `set_var` calls have no effect and only pollute the parent process environment.","fix":"Drop the redundant `set_var` calls in the loop and rely solely on the env map built in `build_env`, which already exports `ANDROID_PLATFORM`, `ANDROID_ABI`, and `CARGO_NDK_ANDROID_PLATFORM`.","locations":[{"ref":"src/cli/mod.rs:635-662","code":"  635 |             unsafe {\n  636 |                 std::env::set_var(\"CARGO_NDK_ANDROID_PLATFORM\", target.to_string());\n  637 |             }\n  638 | \n  639 |             // Set ANDROID_PLATFORM (API level)\n  640 |             shell.very_verbose(|shell| {\n  641 |                 shell.status_with_color(\n  642 |                     \"Exporting\",\n  643 |                     format!(\"ANDROID_PLATFORM={platform}\"),\n  644 |                     termcolor::Color::Cyan,\n  645 |                 )\n  646 |             })?;\n  647 |             unsafe {\n  648 |                 std::env::set_var(\"ANDROID_PLATFORM\", platform.to_string());\n  649 |             }\n  650 | \n  651 |             // Set ANDROID_ABI using the Android-specific target name\n  652 |             let android_abi = target.to_string();\n  653 |             shell.very_verbose(|shell| {\n  654 |                 shell.status_with_color(\n  655 |                     \"Exporting\",\n  656 |                     format!(\"ANDROID_ABI={:?}\", android_abi),\n  657 |                     termcolor::Color::Cyan,\n  658 |                 )\n  659 |             })?;\n  660 |             unsafe {\n  661 |                 std::env::set_var(\"ANDROID_ABI\", &android_abi);\n  662 |             }","lines":28,"link":"https://github.com/bbqsrc/cargo-ndk/blob/263131b177b2cf1fe0891e6c537dbe64011a6b4a/src/cli/mod.rs#L635-L662"},{"ref":"src/cargo.rs:195-204","code":"  195 |         (\n  196 |             \"CARGO_NDK_ANDROID_PLATFORM\".to_string(),\n  197 |             platform.to_string().into(),\n  198 |         ),\n  199 |         (\n  200 |             CARGO_NDK_NDK_VERSION_KEY.to_string(),\n  201 |             ndk_version.to_string().into(),\n  202 |         ),\n  203 |         (\"ANDROID_PLATFORM\".to_string(), platform.to_string().into()),\n  204 |         (\"ANDROID_ABI\".to_string(), android_abi.into()),","lines":10,"link":"https://github.com/bbqsrc/cargo-ndk/blob/263131b177b2cf1fe0891e6c537dbe64011a6b4a/src/cargo.rs#L195-L204"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"After copying an artifact, the modification time of the destination is set from the destination's own freshly-read metadata - it reads `dest`'s mtime and writes the same value back to `dest`, a no-op. The freshness check (`is_fresh`) relies on `dest` mtime being >= `src` mtime, so this almost certainly intended to copy the source's mtime onto the destination.","fix":"Set the destination mtime from the source file's metadata (`file.as_std_path().metadata()`), or remove this block entirely since `fs::copy` already gives the destination a current timestamp.","locations":[{"ref":"src/cli/mod.rs:784-792","code":"  784 |                 filetime::set_file_mtime(\n  785 |                     &dest,\n  786 |                     FileTime::from_last_modification_time(\n  787 |                         &dest\n  788 |                             .metadata()\n  789 |                             .with_context(|| format!(\"failed getting metadata for {dest:?}\"))?,\n  790 |                     ),\n  791 |                 )\n  792 |                 .with_context(|| format!(\"unable to update the modification time of {dest:?}\"))?;","lines":9,"link":"https://github.com/bbqsrc/cargo-ndk/blob/263131b177b2cf1fe0891e6c537dbe64011a6b4a/src/cli/mod.rs#L784-L792"}]},
{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`clang_lib_path` uses `.expect(\"Unable to get clang target directory\")` on `read_dir` and `.expect(\"Unable to get clang target\")` on the `max_by` result. A misconfigured or partial NDK (missing or empty `lib/clang` directory) will panic instead of producing a clean error. Reached when `--link-builtins` is set.","fix":"Return a `Result`/`Option` and surface a descriptive `shell.error(...)` + non-zero exit, rather than panicking, when the clang lib directory is absent or empty.","locations":[{"ref":"src/cargo.rs:48-53","code":"   48 |     let clang_lib_version = std::fs::read_dir(&clang_folder)\n   49 |         .expect(\"Unable to get clang target directory\")\n   50 |         .filter_map(|a| a.ok())\n   51 |         .max_by(|a, b| a.file_name().cmp(&b.file_name()))\n   52 |         .expect(\"Unable to get clang target\")\n   53 |         .path();","lines":6,"link":"https://github.com/bbqsrc/cargo-ndk/blob/263131b177b2cf1fe0891e6c537dbe64011a6b4a/src/cargo.rs#L48-L53"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`build_env` canonicalizes `env::args().next().unwrap()` (argv[0]) with `.expect(...)` to locate sibling helper binaries. If cargo-ndk is invoked in a way where argv[0] is not a resolvable path (e.g. a bare program name found via PATH, or a relative path after a cwd change), canonicalization fails and the process panics. argv[0] is also unwrapped and canonicalized twice for the two helper binaries.","fix":"Resolve the current executable with `std::env::current_exe()` (which is designed for this), handle its error gracefully, and compute the parent directory once for both helper paths.","locations":[{"ref":"src/cargo.rs:123-132","code":"  123 |     let cargo_ndk_path = dunce::canonicalize(env::args().next().unwrap())\n  124 |         .expect(\"Failed to canonicalize absolute path to cargo-ndk\")\n  125 |         .parent()\n  126 |         .unwrap()\n  127 |         .join(\"cargo-ndk\");\n  128 |     let cargo_ndk_runner_path = dunce::canonicalize(env::args().next().unwrap())\n  129 |         .expect(\"Failed to canonicalize absolute path to cargo-ndk-runner\")\n  130 |         .parent()\n  131 |         .unwrap()\n  132 |         .join(\"cargo-ndk-runner\");","lines":10,"link":"https://github.com/bbqsrc/cargo-ndk/blob/263131b177b2cf1fe0891e6c537dbe64011a6b4a/src/cargo.rs#L123-L132"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In the MSYS/Cygwin path-rewriting branch, each env value is converted with `v.into_string().unwrap()`, which panics if any value is not valid UTF-8. Some of these values are filesystem paths derived from the NDK location and user environment, which on Windows can contain non-UTF-8 bytes.","fix":"Use a lossy conversion (`v.to_string_lossy()` then replace backslashes with forward slashes) or operate on the `OsString` bytes, instead of `into_string().unwrap()`.","locations":[{"ref":"src/cargo.rs:258-268","code":"  258 |     if env::var(\"MSYSTEM\").is_ok() || env::var(\"CYGWIN\").is_ok() {\n  259 |         envs = envs\n  260 |             .into_iter()\n  261 |             .map(|(k, v)| {\n  262 |                 (\n  263 |                     k,\n  264 |                     OsString::from(v.into_string().unwrap().replace('\\\\', \"/\")),\n  265 |                 )\n  266 |             })\n  267 |             .collect();\n  268 |     }","lines":11,"link":"https://github.com/bbqsrc/cargo-ndk/blob/263131b177b2cf1fe0891e6c537dbe64011a6b4a/src/cargo.rs#L258-L268"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`env_value` calls `.expect(\"cargo-ndk environment values should be valid UTF-8\")`. The values include NDK paths; on a system where any of those paths is not valid UTF-8, `cargo ndk-env` panics instead of reporting a usable error.","fix":"Handle the non-UTF-8 case explicitly (lossy conversion with a warning, or skip/erroring per variable) rather than panicking on the whole command.","locations":[{"ref":"src/cli/env.rs:57-61","code":"   57 | fn env_value(value: &OsString) -> &str {\n   58 |     value\n   59 |         .to_str()\n   60 |         .expect(\"cargo-ndk environment values should be valid UTF-8\")\n   61 | }","lines":5,"link":"https://github.com/bbqsrc/cargo-ndk/blob/263131b177b2cf1fe0891e6c537dbe64011a6b4a/src/cli/env.rs#L57-L61"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`dunce::canonicalize(output_dir).unwrap()` is called again purely to format the 'Copying libraries to ...' status line, re-doing work already done earlier and panicking if canonicalization fails at this point (e.g. the directory was removed or permissions changed between creation and this call).","fix":"Reuse the already-canonicalized path computed earlier (store it instead of discarding it) and avoid `.unwrap()`; fall back to the raw path for display if needed.","locations":[{"ref":"src/cli/mod.rs:705-714","code":"  705 |     if let Some(output_dir) = args.output_dir.as_ref() {\n  706 |         shell.concise(|shell| {\n  707 |             shell.status(\n  708 |                 \"Copying\",\n  709 |                 format!(\n  710 |                     \"libraries to {}\",\n  711 |                     dunce::canonicalize(output_dir).unwrap().display()\n  712 |                 ),\n  713 |             )\n  714 |         })?;","lines":10,"link":"https://github.com/bbqsrc/cargo-ndk/blob/263131b177b2cf1fe0891e6c537dbe64011a6b4a/src/cli/mod.rs#L705-L714"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`fs::create_dir_all(&arch_output_dir).unwrap()` panics on failure (e.g. permission denied, path component is a file). Every other directory/IO error in this function is reported via `shell.error` with a clean exit; this one is an outlier that crashes with a panic report instead.","fix":"Handle the error like the sibling cases: `if let Err(e) = fs::create_dir_all(&arch_output_dir) { shell.error(...)?; std::process::exit(1); }`.","locations":[{"ref":"src/cli/mod.rs:721-722","code":"  721 |             let arch_output_dir = output_dir.join(target.to_string());\n  722 |             fs::create_dir_all(&arch_output_dir).unwrap();","lines":2,"link":"https://github.com/bbqsrc/cargo-ndk/blob/263131b177b2cf1fe0891e6c537dbe64011a6b4a/src/cli/mod.rs#L721-L722"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`cargo-ndk-runner` derives the on-device path with `args.executable.file_name().unwrap()`, which panics if the executable path has no final component (e.g. ends in `..` or is empty). Since this path comes from cargo's runner invocation it is normally well-formed, but a malformed value would crash rather than error cleanly.","fix":"Handle the `None` case with a descriptive `shell.error` and non-zero exit instead of `.unwrap()`.","locations":[{"ref":"src/cli/runner.rs:64-68","code":"   64 |     // Push binary to device\n   65 |     let device_path = format!(\n   66 |         \"/data/local/tmp/{}\",\n   67 |         args.executable.file_name().unwrap().to_string_lossy()\n   68 |     );","lines":5,"link":"https://github.com/bbqsrc/cargo-ndk/blob/263131b177b2cf1fe0891e6c537dbe64011a6b4a/src/cli/runner.rs#L64-L68"}]},
{"id":"OTHER_1","type":"other","type_label":"Other","severity":"medium","difficulty":"medium","description":"The panic hook dumps the entire process environment (`std::env::vars()`) and full argv to stderr, then asks the user to paste the report into a public GitHub issue. Android build environments commonly contain secrets (signing key passwords, keystore paths, CI tokens, cloud credentials), which would be leaked into public bug reports.","fix":"Do not dump the full environment by default. Either omit env entirely, redact values, or include only an allowlist of cargo-ndk/NDK-relevant variables. Gate any full dump behind an explicit opt-in flag.","locations":[{"ref":"src/cli/mod.rs:255-271","code":"  255 |     let env = std::env::vars()\n  256 |         .map(|(x, y)| format!(\"{x}={y:?}\"))\n  257 |         .collect::<Vec<_>>();\n  258 |     let args = std::env::args().collect::<Vec<_>>();\n  259 | \n  260 |     let lines = vec![\n  261 |         format!(\"location: {location}\"),\n  262 |         format!(\"message: {msg}\"),\n  263 |         format!(\"args: {args:?}\"),\n  264 |         format!(\n  265 |             \"pwd: {}\",\n  266 |             std::env::current_dir()\n  267 |                 .map(|x| x.display().to_string())\n  268 |                 .unwrap_or_else(|_| \"<unknown>\".to_string())\n  269 |         ),\n  270 |         format!(\"env:\\n  {}\", env.join(\"\\n  \")),\n  271 |     ];","lines":17,"link":"https://github.com/bbqsrc/cargo-ndk/blob/263131b177b2cf1fe0891e6c537dbe64011a6b4a/src/cli/mod.rs#L255-L271"},{"ref":"src/cli/mod.rs:235-243","code":"  235 | fn panic_hook(info: &PanicHookInfo<'_>) {\n  236 |     fn _attempt_shell(lines: &[String]) -> Result<(), anyhow::Error> {\n  237 |         let mut shell = Shell::new();\n  238 |         shell.error(\"cargo-ndk panicked! Generating report...\")?;\n  239 |         for line in lines {\n  240 |             println!(\"{line}\");\n  241 |         }\n  242 |         shell.error(\"end of panic report. Please report the above to: <https://github.com/bbqsrc/cargo-ndk/issues>\")?;\n  243 |         Ok(())","lines":9,"link":"https://github.com/bbqsrc/cargo-ndk/blob/263131b177b2cf1fe0891e6c537dbe64011a6b4a/src/cli/mod.rs#L235-L243"}]},
{"id":"OTHER_2","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"`cargo ndk-env` rewrites '-' to '_' in variable names only for the bash `export` output, but not for the `--json` or `--powershell` output. The `cc`-style keys (e.g. `CC_aarch64-linux-android`) are thus emitted with dashes in JSON/PowerShell and underscores in bash, an inconsistency that can lead to differing behavior depending on which output format is consumed.","fix":"Normalize variable names consistently across all three output paths (or none), so the emitted env is identical regardless of `--json`/`--powershell`.","locations":[{"ref":"src/cli/env.rs:104-128","code":"  104 |     if args.json {\n  105 |         println!(\n  106 |             \"{}\",\n  107 |             serde_json::to_string_pretty(\n  108 |                 &env.into_iter()\n  109 |                     .map(|(k, v)| (k, env_value(&v).to_string()))\n  110 |                     .collect::<BTreeMap<_, _>>()\n  111 |             )\n  112 |             .unwrap()\n  113 |         );\n  114 |     } else if args.powershell {\n  115 |         for (k, v) in env {\n  116 |             println!(\"${{env:{k}}}={}\", powershell_quote(&v));\n  117 |         }\n  118 |         println!();\n  119 |         println!(\"# To import with PowerShell:\");\n  120 |         println!(\"#     cargo ndk-env --powershell | Invoke-Expression\");\n  121 |     } else {\n  122 |         for (k, v) in env {\n  123 |             println!(\"export {}={}\", k.replace('-', \"_\"), shell_quote(&v));\n  124 |         }\n  125 |         println!();\n  126 |         println!(\"# To import with bash/zsh/etc:\");\n  127 |         println!(\"#     source <(cargo ndk-env)\");\n  128 |     }","lines":25,"link":"https://github.com/bbqsrc/cargo-ndk/blob/263131b177b2cf1fe0891e6c537dbe64011a6b4a/src/cli/env.rs#L104-L128"}]},
{"id":"OTHER_3","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"The libc++_shared link flag is gated on a different env var name across subcommands: `ndk-test` reads `CARGO_NDK_LINK_CXX_SHARED` while the main build and `ndk-env` read `CARGO_NDK_LINK_LIBCXX_SHARED`. A user who sets `CARGO_NDK_LINK_LIBCXX_SHARED` for builds will find it ignored by `ndk-test`, and vice versa.","fix":"Use a single consistent env var name (e.g. `CARGO_NDK_LINK_LIBCXX_SHARED`) for this flag across all subcommands.","locations":[{"ref":"src/cli/test.rs:26-28","code":"   26 |     /// Links libc++_shared library\n   27 |     #[arg(long, default_value_t = false, env = \"CARGO_NDK_LINK_CXX_SHARED\")]\n   28 |     link_cxx_shared: bool,","lines":3,"link":"https://github.com/bbqsrc/cargo-ndk/blob/263131b177b2cf1fe0891e6c537dbe64011a6b4a/src/cli/test.rs#L26-L28"},{"ref":"src/cli/mod.rs:54-56","code":"   54 |     /// Links libc++_shared library\n   55 |     #[arg(long, default_value_t = false, env = \"CARGO_NDK_LINK_LIBCXX_SHARED\")]\n   56 |     link_libcxx_shared: bool,","lines":3,"link":"https://github.com/bbqsrc/cargo-ndk/blob/263131b177b2cf1fe0891e6c537dbe64011a6b4a/src/cli/mod.rs#L54-L56"},{"ref":"src/cli/env.rs:27-29","code":"   27 |     /// Links libc++_shared library\n   28 |     #[arg(long, default_value_t = false, env = \"CARGO_NDK_LINK_LIBCXX_SHARED\")]\n   29 |     link_libcxx_shared: bool,","lines":3,"link":"https://github.com/bbqsrc/cargo-ndk/blob/263131b177b2cf1fe0891e6c537dbe64011a6b4a/src/cli/env.rs#L27-L29"}]},
{"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"medium","difficulty":"medium","description":"`cli::run` is a single ~375-line function that mixes many responsibilities: argument parsing/validation, help/version handling, NDK discovery and version detection, exporting many environment variables, the per-target build loop, and the post-build artifact-copying logic (including libc++_shared handling and freshness checks). This makes the control flow hard to follow and is where several of the bugs above cluster.","fix":"Extract cohesive helpers - e.g. `setup_environment`, `build_targets`, `copy_artifacts(output_dir, targets, ...)` - so each concern is independently readable and testable.","locations":[{"ref":"src/cli/mod.rs:440-815","code":"  440 | pub fn run(args: Vec<String>) -> anyhow::Result<()> {\n  441 |     // Check for help/version before parsing to avoid required arg errors\n  442 |     let (mut shell, args) = init::<BuildArgs>(args)?;\n  443 | \n  444 |     let args = match parse_mixed_args::<BuildArgs>(args) {\n  445 |         Ok(args) => args,\n  446 |         Err(e) => {\n  447 |             shell.error(e)?;\n  448 |             std::process::exit(2);\n  449 |         }\n  450 |     };\n  451 | \n  452 |     if args.cargo_args.is_empty() {\n  453 |         shell.error(\"No args found to pass to cargo!\")?;\n  454 |         shell.note(\"You still need to specify build arguments to cargo to achieve anything. :)\")?;\n  455 |         std::process::exit(1);\n  456 |     }\n  457 | \n  458 |     let metadata = match MetadataCommand::new().no_deps().exec() {\n  459 |         Ok(v) => v,\n  460 |         Err(e) => {\n  461 |             shell.error(\"Failed to load Cargo.toml in current directory.\")?;\n  462 |             shell.error(e)?;\n  463 |             std::process::exit(1);\n  464 |         }\n  465 |     };\n  466 | \n  467 |     let out_dir = metadata.target_directory;\n  468 | \n  469 |     // We used to check for NDK_HOME, // Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;

    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;

  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';

function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);

function mdField(label, value) {

// Render the "**Locations:**" block. When a location has a commit-pinned
// permalink (GitHub/GitLab), just paste the bare URL on its own line -
// GitHub/GitLab auto-expand a line-range blob link into an inline code
// preview, so re-pasting the snippet as a fenced block would duplicate it.
// Forges without a detected permalink shape (or missing commit/repo info)
// fall back to the fenced ref+snippet so the location is still readable.
function mdLocations(locations) {
  if (!locations.length) return '';
  let out = '**Locations:**\n\n';
  for (const l of locations) {
    if (l.link)               out += l.link + '\n\n';
    else if (l.code != null)  out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
    else                      out += '- `' + l.ref + '` _(file not found)_\n\n';
  }
  return out;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += mdField('Description', f.description) + '\n\n';
      out += mdLocations(f.locations);
      out += mdField('Fix', f.fix) + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build a [project] header block from embedded PROJECT_INFO, so the exported
// findings.toml is self-contained (doesn't depend on a sibling project-info.toml
// that a second, separately-triggered download could silently fail to save).
// '' when there is no project info at all.
function buildProjectToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = PROJECT_INFO || {};
  if (!Object.keys(pi).length) return '';
  const lines = ['[project]'];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n\n';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return buildProjectToml() + chunks.join('\n\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += mdField('Description', f.description) + '\n\n';
  out += mdLocations(f.locations);
  out += mdField('Fix', f.fix) + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystacks per finding (cleared on full re-render).
// Two variants: everything (default), and file/folder paths only - for when a
// search term (e.g. a directory name like 'dlls/abc') also happens to appear
// inside description/fix prose and you only want path matches.
const _hay = new Map();
const _hayLoc = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}
function hayLocOf(f) {
  if (!_hayLoc.has(f.id)) {
    _hayLoc.set(f.id, f.locations.map(l => l.ref).join(' ').toLowerCase());
  }
  return _hayLoc.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (S.searchScope === 'locations') {
      if (!hayLocOf(f).includes(q)) return false;
    } else if (!hayOf(f).includes(q) && !st.includes(q)) {
      return false;
    }
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  _hayLoc.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    // Single download (was two) - a second auto-triggered download is commonly
    // blocked by the browser unless the user explicitly allows it, which silently
    // drops project-info.toml. Embedding [project] in findings.toml itself avoids
    // that failure mode entirely.
    downloadText(buildFindingsToml(), 'findings.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});
document.getElementById('search-scope').addEventListener('click', e => {
  S.searchScope = S.searchScope === 'locations' ? 'all' : 'locations';
  e.currentTarget.classList.toggle('active', S.searchScope === 'locations');
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
