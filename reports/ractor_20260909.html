<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}

.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}

.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}

.search-wrap{display:flex;align-items:center;gap:.35rem}

.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}

.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}

.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}

.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}

.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}

.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}

.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}

.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"hash_with_max computes `dh.finish() % (excluded_max as u64)`. If `excluded_max` (the worker pool size) is 0, this is an integer modulo by zero which panics and crashes the factory actor. A pool size of 0 is reachable: `num_initial_workers` is user-supplied (the builder default is 1, but 0 is accepted), and KeyPersistentRouting / CustomRouting call hash_with_max with `pool_size` on every dispatch. A Dispatch arriving while pool_size==0 panics.","fix":"Guard against a zero space, e.g. `if excluded_max == 0 { return 0; }` at the top of hash_with_max, and/or reject/refuse routing when pool_size == 0 in the routers.","locations":[{"ref":"ractor/src/factory/hash.rs:14-22","code":"   14 | pub fn hash_with_max<TKey>(key: &TKey, excluded_max: usize) -> usize\n   15 | where\n   16 |     TKey: Hash,\n   17 | {\n   18 |     let mut dh = DefaultHasher::new();\n   19 |     key.hash(&mut dh);\n   20 |     let bounded_hash = dh.finish() % (excluded_max as u64);\n   21 |     bounded_hash as usize\n   22 | }","lines":9,"link":"https://github.com/slawlor/ractor/blob/1af0aaad5d340cda27c5370768c6c96a0376a543/ractor/src/factory/hash.rs#L14-L22"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"hard","description":"The non-`blanket_serde` `BytesConvertable::from_bytes` implementations panic on malformed or truncated input. The numeric impl slices `&bytes[..size_of::<Self>()]` (panics if `bytes` is shorter than the type size), `String::from_bytes` calls `String::from_utf8(bytes).unwrap()` (panics on invalid UTF-8), `bool::from_bytes` indexes `bytes[0]` (panics on empty slice), and `char::from_bytes` / `Vec<char>::from_bytes` call `char::from_u32(u).unwrap()` (panics on invalid scalar values). These functions deserialize bytes that, with the `cluster` feature, arrive from a remote peer over the network. A malicious or buggy peer can therefore crash (panic) the actor/runtime decoding the message — a remote denial-of-service. The doc comment claims \"Panics are acceptable\" but that is unsafe for attacker-controlled wire data.","fix":"Change `BytesConvertable::from_bytes` to return `Result<Self, _>` (or add a fallible variant) and have the cluster deserialization path propagate a `BoxedDowncastErr` instead of panicking on short slices, invalid UTF-8, or invalid char code points.","locations":[{"ref":"ractor/src/serialization.rs:54-57","code":"   54 |                 fn from_bytes(bytes: Vec<u8>) -> Self {\n   55 |                     let mut data = [0u8; std::mem::size_of::<Self>()];\n   56 |                     data.copy_from_slice(&bytes[..std::mem::size_of::<Self>()]);\n   57 |                     Self::from_be_bytes(data)","lines":4,"link":"https://github.com/slawlor/ractor/blob/1af0aaad5d340cda27c5370768c6c96a0376a543/ractor/src/serialization.rs#L54-L57"},{"ref":"ractor/src/serialization.rs:93-95","code":"   93 |         fn from_bytes(bytes: Vec<u8>) -> Self {\n   94 |             bytes[0] == 1u8\n   95 |         }","lines":3,"link":"https://github.com/slawlor/ractor/blob/1af0aaad5d340cda27c5370768c6c96a0376a543/ractor/src/serialization.rs#L93-L95"},{"ref":"ractor/src/serialization.rs:103-106","code":"  103 |         fn from_bytes(bytes: Vec<u8>) -> Self {\n  104 |             let u = u32::from_bytes(bytes);\n  105 |             Self::from_u32(u).unwrap()\n  106 |         }","lines":4,"link":"https://github.com/slawlor/ractor/blob/1af0aaad5d340cda27c5370768c6c96a0376a543/ractor/src/serialization.rs#L103-L106"},{"ref":"ractor/src/serialization.rs:113-115","code":"  113 |         fn from_bytes(bytes: Vec<u8>) -> Self {\n  114 |             String::from_utf8(bytes).unwrap()\n  115 |         }","lines":3,"link":"https://github.com/slawlor/ractor/blob/1af0aaad5d340cda27c5370768c6c96a0376a543/ractor/src/serialization.rs#L113-L115"},{"ref":"ractor/src/serialization.rs:195-200","code":"  195 |         fn from_bytes(bytes: Vec<u8>) -> Self {\n  196 |             let u32s = <Vec<u32>>::from_bytes(bytes);\n  197 |             u32s.into_iter()\n  198 |                 .map(|u| char::from_u32(u).unwrap())\n  199 |                 .collect::<Vec<_>>()\n  200 |         }","lines":6,"link":"https://github.com/slawlor/ractor/blob/1af0aaad5d340cda27c5370768c6c96a0376a543/ractor/src/serialization.rs#L195-L200"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`derive_serialization_for_prost_type!` generates a `from_bytes` that calls `decode_length_delimited(buffer).unwrap()`. Any prost-derived message type using this macro will panic on malformed/truncated bytes. While the macro is user-invoked, it is the documented mechanism for cluster message types and the deserialized bytes come from the network, so a malformed payload from a peer panics the deserializing actor.","fix":"Document that `from_bytes` cannot return an error in the current `BytesConvertable` contract, but at minimum avoid `unwrap()` by returning a default or trapping the error; better, propagate a decode error if/when the trait allows it.","locations":[{"ref":"ractor_cluster/src/macros.rs:22-25","code":"   22 |             fn from_bytes(bytes: Vec<u8>) -> Self {\n   23 |                 let buffer = bytes::Bytes::from(bytes);\n   24 |                 <Self as prost::Message>::decode_length_delimited(buffer).unwrap()\n   25 |             }","lines":4,"link":"https://github.com/slawlor/ractor/blob/1af0aaad5d340cda27c5370768c6c96a0376a543/ractor_cluster/src/macros.rs#L22-L25"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"send_message_unchecked unwraps TMessage::from_boxed(m) when the channel send fails and the boxed message is returned, in order to hand the original message back inside SendErr. This round-trips a message that was just boxed locally, so it normally succeeds, but it is an unwrap on a fallible downcast in a non-test code path; any future change that lets a non-round-trippable message reach here (or a logic error in box/unbox) turns a benign SendErr into a hard panic inside the sender's thread.","fix":"Avoid the down-cast round trip: keep a way to recover the original typed value without re-boxing (e.g. send by value through a wrapper that retains the original on failure), or degrade gracefully to MessagingErr::ChannelClosed instead of unwrapping.","locations":[{"ref":"ractor/src/actor/actor_properties.rs:210-216","code":"  210 |         self.message\n  211 |             .send(MuxedMessage::Message(boxed))\n  212 |             .map_err(|e| match e.0 {\n  213 |                 MuxedMessage::Message(m) => MessagingErr::SendErr(TMessage::from_boxed(m).unwrap()),\n  214 |                 _ => panic!(\"Expected a boxed message but got a drain message\"),\n  215 |             })\n  216 |     }","lines":7,"link":"https://github.com/slawlor/ractor/blob/1af0aaad5d340cda27c5370768c6c96a0376a543/ractor/src/actor/actor_properties.rs#L210-L216"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"try_route_next_active_job contains an explicit `panic!` on the RouteResult::Backlog branch, asserting an invariant that a targeted worker can never backlog. This depends entirely on every Router implementation (including user-supplied custom routers via the public Router trait) honoring the contract that choose_target_worker returning Some guarantees route_message will not return Backlog. A buggy or reasonable custom router will hard-panic the entire factory rather than logging and recovering.","fix":"Replace the panic with error logging and re-enqueue the job (or return an ActorProcessingErr) so a misbehaving router degrades gracefully instead of crashing the factory.","locations":[{"ref":"ractor/src/factory/factoryimpl.rs:330-336","code":"  330 |                     RouteResult::Backlog(_) => {\n  331 |                         tracing::error!(\n  332 |                             \"Error routing job to {worker}. Invariant violated with backlog when we have a targeted worker\"\n  333 |                         );\n  334 | \n  335 |                         panic!(\"Received invalid variant of `RouteResult::Backlog` because a worker is unavailable, but we already targeted a worker.\");\n  336 |                     }","lines":7,"link":"https://github.com/slawlor/ractor/blob/1af0aaad5d340cda27c5370768c6c96a0376a543/ractor/src/factory/factoryimpl.rs#L330-L336"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"JobOptions::into_bytes uses `.duration_since(UNIX_EPOCH).expect(\"Time went backwards\")` (cluster feature). If submit_time is before the UNIX epoch (e.g. a deserialized/zeroed value or a misconfigured clock) this panics during serialization of a job destined for a remote node, crashing the sender actor.","fix":"Use `duration_since(UNIX_EPOCH).unwrap_or_default()` to encode 0 when the time precedes the epoch rather than panicking.","locations":[{"ref":"ractor/src/factory/job.rs:203-222","code":"  203 | #[cfg(feature = \"cluster\")]\n  204 | impl BytesConvertable for JobOptions {\n  205 |     fn into_bytes(self) -> Vec<u8> {\n  206 |         let submit_time = (self\n  207 |             .submit_time\n  208 |             .duration_since(std::time::UNIX_EPOCH)\n  209 |             .expect(\"Time went backwards\")\n  210 |             .as_nanos() as u64)\n  211 |             .to_be_bytes();\n  212 |         let ttl = self\n  213 |             .ttl\n  214 |             .map(|t| t.as_nanos() as u64)\n  215 |             .unwrap_or(0)\n  216 |             .to_be_bytes();\n  217 | \n  218 |         let mut data = vec![0u8; 16];\n  219 |         data[0..8].copy_from_slice(&submit_time);\n  220 |         data[8..16].copy_from_slice(&ttl);\n  221 |         data\n  222 |     }","lines":20,"link":"https://github.com/slawlor/ractor/blob/1af0aaad5d340cda27c5370768c6c96a0376a543/ractor/src/factory/job.rs#L203-L222"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"negligible","difficulty":"medium","description":"DerivedActorRef::get_derived's send closure panics if a returned SendErr message cannot be converted back from the full TMessage to TFrom via TryFrom. This is documented as 'should never happen', and indeed From/TryFrom for a subset type are inverses in correct usage, but a user supplying inconsistent From/TryFrom impls converts a recoverable send failure into a panic on the caller's thread.","fix":"Return a dedicated error (e.g. map to MessagingErr::ChannelClosed or a new variant) instead of panicking when the reverse conversion fails, so misconfigured conversions degrade gracefully rather than aborting the caller.","locations":[{"ref":"ractor/src/actor/derived_actor.rs:211-226","code":"  211 |         let cast_and_send = move |msg: TFrom| {\n  212 |             actor_ref.send_message(msg.into()).map_err(|err| match err {\n  213 |                 MessagingErr::SendErr(returned) => {\n  214 |                     let Ok(err) = TFrom::try_from(returned) else {\n  215 |                         panic!(\n  216 |                             \"Failed to deconvert message from {} to {} when sending to: {actor_ref:?}\",\n  217 |                             std::any::type_name::<TMessage>(),\n  218 |                             std::any::type_name::<TFrom>()\n  219 |                         );\n  220 |                     };\n  221 |                     MessagingErr::SendErr(err)\n  222 |                 }\n  223 |                 MessagingErr::ChannelClosed => MessagingErr::ChannelClosed,\n  224 |                 MessagingErr::InvalidActorType => MessagingErr::InvalidActorType,\n  225 |             })\n  226 |         };","lines":16,"link":"https://github.com/slawlor/ractor/blob/1af0aaad5d340cda27c5370768c6c96a0376a543/ractor/src/actor/derived_actor.rs#L211-L226"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"negligible","difficulty":"easy","description":"`ThreadLocalActorSpawner::new()` (tokio variant) builds a current-thread runtime with `.build().unwrap()`. If runtime construction fails (e.g. resource exhaustion building the new thread/runtime), this panics rather than surfacing an error. Since `new()` returns `Self` (not a Result) and is part of the public API, the only options are panic, but the failure is silent to callers until it aborts.","fix":"Document that `new()` may panic on runtime-construction failure, or provide a fallible `try_new() -> Result<Self, _>` constructor that propagates the build error.","locations":[{"ref":"ractor/src/thread_local.rs:450-453","code":"  450 |         let rt = tokio::runtime::Builder::new_current_thread()\n  451 |             .enable_all()\n  452 |             .build()\n  453 |             .unwrap();","lines":4,"link":"https://github.com/slawlor/ractor/blob/1af0aaad5d340cda27c5370768c6c96a0376a543/ractor/src/thread_local.rs#L450-L453"}]},
{"id":"RACE_1","type":"race_condition","type_label":"Race Condition","severity":"medium","difficulty":"hard","description":"`ConnectionReady` can be missed. In the auth-completion path (handle, lines 981-991) the session only sends `ConnectionReady` if `state.ready.is_ok()` immediately after `after_authenticated`. But `after_authenticated` sets ready to `SyncSent` (if Open) and only transitions to `Ready` upon receiving the peer's `Ready` control message in `handle_control`. If the peer's `Ready` message was already processed-and-dropped earlier (it is only accepted once auth.is_ok), or arrives in a different interleaving, the ConnectionReady notification to the NodeServer can be lost, so subscribers never get `node_session_ready`.","fix":"Drive the ConnectionReady notification solely from the ReadyState transition to `Ready` (in handle_control) rather than also speculatively checking it right after authentication, and ensure Ready control messages received before local sync are buffered/handled.","locations":[{"ref":"ractor_cluster/src/node/node_session.rs:517-533","code":"  517 |         if let Some(msg) = message.msg {\n  518 |             match msg {\n  519 |                 control_protocol::control_message::Msg::Ready(_) => match state.ready {\n  520 |                     ReadyState::Open => {\n  521 |                         state.ready = ReadyState::SyncReceived;\n  522 |                     }\n  523 |                     ReadyState::SyncSent => {\n  524 |                         state.ready = ReadyState::Ready;\n  525 |                         ractor::cast!(\n  526 |                             self.node_server,\n  527 |                             NodeServerMessage::ConnectionReady(myself.get_id())\n  528 |                         )?;\n  529 |                     }\n  530 |                     ReadyState::SyncReceived | ReadyState::Ready => {\n  531 |                         tracing::warn!(\"Received duplicate Ready signal\");\n  532 |                     }\n  533 |                 },","lines":17,"link":"https://github.com/slawlor/ractor/blob/1af0aaad5d340cda27c5370768c6c96a0376a543/ractor_cluster/src/node/node_session.rs#L517-L533"},{"ref":"ractor_cluster/src/node/node_session.rs:784-795","code":"  784 |         state.tcp_send_control(control_protocol::ControlMessage {\n  785 |             msg: Some(control_protocol::control_message::Msg::Ready(\n  786 |                 control_protocol::Ready {},\n  787 |             )),\n  788 |         });\n  789 |         match state.ready {\n  790 |             ReadyState::Open => state.ready = ReadyState::SyncSent,\n  791 |             ReadyState::SyncReceived => state.ready = ReadyState::Ready,\n  792 |             ReadyState::SyncSent | ReadyState::Ready => {\n  793 |                 unreachable!(\"after_authenticated() executed twice\")\n  794 |             }\n  795 |         }","lines":12,"link":"https://github.com/slawlor/ractor/blob/1af0aaad5d340cda27c5370768c6c96a0376a543/ractor_cluster/src/node/node_session.rs#L784-L795"}]},
{"id":"RACE_2","type":"race_condition","type_label":"Race Condition","severity":"low","difficulty":"medium","description":"`register_pid` holds the write lock on the matched PID-registry DashMap shard (the `Vacant` entry guard) while iterating all PID listeners and calling `send_supervisor_evt` on each (lines 63-74). Unlike `pg::notify_world_listeners`, which clones listeners out and drops the guard before notifying, this keeps a registry shard locked across an arbitrary number of channel sends, increasing contention and lock-hold time on the hot spawn path.","fix":"Insert under the entry lock, drop the guard, then snapshot the listeners and send notifications outside the lock (mirroring the pattern in `pg::notify_world_listeners`).","locations":[{"ref":"ractor/src/registry/pid_registry.rs:63-74","code":"   63 |             Vacant(v) => {\n   64 |                 v.insert(actor.clone());\n   65 |                 // notify lifecycle listeners\n   66 |                 for listener in get_pid_listeners().iter() {\n   67 |                     let _ =\n   68 |                         listener\n   69 |                             .value()\n   70 |                             .send_supervisor_evt(SupervisionEvent::PidLifecycleEvent(\n   71 |                                 PidLifecycleEvent::Spawn(actor.clone()),\n   72 |                             ));\n   73 |                 }\n   74 |                 Ok(())","lines":12,"link":"https://github.com/slawlor/ractor/blob/1af0aaad5d340cda27c5370768c6c96a0376a543/ractor/src/registry/pid_registry.rs#L63-L74"}]},
{"id":"RES_1","type":"resource_leak","type_label":"Resource Leak","severity":"low","difficulty":"medium","description":"The wasm `Interval::reset` creates a new JS closure and calls `closure.forget()`, which intentionally leaks the closure to the JS GC, but it does NOT release the previously-forgotten closure from the prior `set_interval`/`reset` call. `clear_interval` stops the timer firing but the leaked `Box<dyn Fn()>` from the previous interval is never reclaimed. Repeatedly calling `reset()` on a long-lived interval leaks one closure per call.","fix":"Store the active `Closure` in the `Interval` struct (instead of `forget()`-ing it) so the old closure is dropped when replaced on `reset`/`drop`, or otherwise track and drop the previous closure.","locations":[{"ref":"ractor/src/concurrency/wasm_browser_primitives/time.rs:214-229","code":"  214 |     pub fn reset(&mut self) {\n  215 |         // Clear the existing interval.\n  216 |         clear_interval(self.interval_id);\n  217 | \n  218 |         // Create a new channel to receive ticks.\n  219 |         let (tx, rx) = tokio::sync::mpsc::unbounded_channel();\n  220 |         self.rx = rx;\n  221 |         let period_ms = self.period.as_millis() as f64;\n  222 |         // Set up a new interval.\n  223 |         let closure = Closure::wrap(Box::new(move || {\n  224 |             let _ = tx.send(());\n  225 |         }) as Box<dyn Fn()>);\n  226 |         self.interval_id = set_interval(closure.as_ref().unchecked_ref(), period_ms);\n  227 |         // Release memory management of this closure from Rust to the JS GC.\n  228 |         closure.forget();\n  229 |     }","lines":16,"link":"https://github.com/slawlor/ractor/blob/1af0aaad5d340cda27c5370768c6c96a0376a543/ractor/src/concurrency/wasm_browser_primitives/time.rs#L214-L229"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"The vectorized `BytesConvertable::into_bytes` computes the output buffer size as `self.len() * std::mem::size_of::<$ty>()` (e.g. up to *16 for i128/u128). For very large input vectors this multiplication can overflow `usize` in debug builds (panic) or wrap in release builds, producing an undersized allocation followed by out-of-bounds slice writes / panics. While reaching this requires an enormous in-memory Vec, it is unchecked arithmetic on a length-derived size in serialization code.","fix":"Use checked multiplication (`len.checked_mul(size_of)`) and return/handle an error, or rely on `Vec::with_capacity` semantics that already guard against overflow.","locations":[{"ref":"ractor/src/serialization.rs:122-128","code":"  122 |             impl BytesConvertable for Vec<$ty> {\n  123 |                 fn into_bytes(self) -> Vec<u8> {\n  124 |                     let mut result = vec![0u8; self.len() * std::mem::size_of::<$ty>()];\n  125 |                     for (offset, item) in self.into_iter().enumerate() {\n  126 |                         result[offset * std::mem::size_of::<$ty>() .. offset * std::mem::size_of::<$ty>() + std::mem::size_of::<$ty>()].copy_from_slice(&item.to_be_bytes());\n  127 |                     }\n  128 |                     result","lines":7,"link":"https://github.com/slawlor/ractor/blob/1af0aaad5d340cda27c5370768c6c96a0376a543/ractor/src/serialization.rs#L122-L128"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"When the authentication state is already `Close`, `handle_auth` calls `myself.stop(...)` (and stops the tcp child) but does NOT return. Execution falls through into the `match &state.auth` block which then runs `client_auth.next(...)` / `server_auth.next(...)` and may send further auth messages and overwrite `state.auth` on a session that is being torn down. The shutdown is asynchronous, so additional handshake processing continues against a peer that has already failed authentication.","fix":"Add a `return;` after stopping the session in the `is_close()` branch so no further authentication processing occurs once the FSM has decided to close.","locations":[{"ref":"ractor_cluster/src/node/node_session.rs:185-195","code":"  185 |         if state.auth.is_close() {\n  186 |             tracing::info!(\n  187 |                 \"Node Session {} is shutting down due to authentication failure\",\n  188 |                 self.node_id\n  189 |             );\n  190 |             // we need to shutdown, the session needs to be terminated\n  191 |             myself.stop(Some(\"auth_fail\".to_string()));\n  192 |             if let Some(tcp) = &state.tcp {\n  193 |                 tcp.stop(Some(\"auth_fail\".to_string()));\n  194 |             }\n  195 |         }","lines":11,"link":"https://github.com/slawlor/ractor/blob/1af0aaad5d340cda27c5370768c6c96a0376a543/ractor_cluster/src/node/node_session.rs#L185-L195"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"hard","description":"On wasm the `Interval` is backed by JS `setInterval`, which does NOT fire immediately; the first `tick()` awaits `rx.recv()` and only completes after one full `period` has elapsed. The tokio backend's interval ticks once immediately. `send_interval` (and the doc comment on `interval`) explicitly rely on the \"ticks 1 time immediately\" semantics: it calls `timer.tick().await` once to consume the immediate tick, then ticks again before each send. On wasm this means the first send is delayed by two full periods instead of one, and the documented \"Ticks 1 time immediately\" comment is wrong for the wasm backend.","fix":"Make the wasm `Interval` deliver an immediate first tick (e.g. seed the channel with one `()` on creation, or have `tick()` return immediately the first time) to match tokio/async-std semantics, or fix the comments and `send_interval` to not assume an immediate tick.","locations":[{"ref":"ractor/src/concurrency/wasm_browser_primitives/time.rs:176-209","code":"  176 | /// Creates a new interval that ticks every `period` duration.\n  177 | pub(super) fn interval(period: Duration) -> Interval {\n  178 |     let (tx, rx) = tokio::sync::mpsc::unbounded_channel();\n  179 |     let period_ms = period.as_millis() as f64;\n  180 |     // Create a closure that sends a tick via the channel.\n  181 |     let closure = Closure::wrap(Box::new(move || {\n  182 |         let _ = tx.send(());\n  183 |     }) as Box<dyn Fn()>);\n  184 |     // Register an interval with the closure.\n  185 |     let interval_id = set_interval(closure.as_ref().unchecked_ref(), period_ms);\n  186 |     // Release memory management of this closure from Rust to the JS GC.\n  187 |     closure.forget();\n  188 |     Interval {\n  189 |         period,\n  190 |         rx,\n  191 |         interval_id,\n  192 |     }\n  193 | }\n  194 | \n  195 | /// A structure that represents an interval that ticks at a specified period.\n  196 | /// It provides methods to wait for the next tick, reset the interval,\n  197 | /// and ensure the interval is cleaned up when it is dropped.\n  198 | #[derive(Debug)]\n  199 | pub struct Interval {\n  200 |     period: Duration,\n  201 |     rx: tokio::sync::mpsc::UnboundedReceiver<()>,\n  202 |     interval_id: i32,\n  203 | }\n  204 | \n  205 | impl Interval {\n  206 |     /// Waits until the next tick.\n  207 |     pub async fn tick(&mut self) {\n  208 |         self.rx.recv().await;\n  209 |     }","lines":34,"link":"https://github.com/slawlor/ractor/blob/1af0aaad5d340cda27c5370768c6c96a0376a543/ractor/src/concurrency/wasm_browser_primitives/time.rs#L176-L209"},{"ref":"ractor/src/concurrency/wasm_browser_primitives.rs:33-38","code":"   33 | /// Build a new interval at the given duration starting at now\n   34 | ///\n   35 | /// Ticks 1 time immediately\n   36 | pub fn interval(dur: Duration) -> Interval {\n   37 |     time::interval(dur)\n   38 | }","lines":6,"link":"https://github.com/slawlor/ractor/blob/1af0aaad5d340cda27c5370768c6c96a0376a543/ractor/src/concurrency/wasm_browser_primitives.rs#L33-L38"},{"ref":"ractor/src/time.rs:120-130","code":"  120 |         let mut timer = crate::concurrency::interval(period);\n  121 |         // timer tick's immediately the first time\n  122 |         timer.tick().await;\n  123 |         while ACTIVE_STATES.contains(&actor.get_status()) {\n  124 |             timer.tick().await;\n  125 |             // if we receive an error trying to send, the channel is closed and we should stop trying\n  126 |             // actor died\n  127 |             if actor.send_message::<TMessage>(msg()).is_err() {\n  128 |                 break;\n  129 |             }\n  130 |         }","lines":11,"link":"https://github.com/slawlor/ractor/blob/1af0aaad5d340cda27c5370768c6c96a0376a543/ractor/src/time.rs#L120-L130"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `handle_control`, the `PgLeave` branch builds `cells` from `state.remote_actors.get(&pid)` but does not remove the actors from `remote_actors`, and the EnumerateNodeSessions filter at lines 620-625 uses `&&` so a peer is excluded only if BOTH its name AND connection_string differ from the asker. As written the dedup is overly permissive: a peer whose name matches the asker but connection_string differs (or vice-versa) is still sent back, which can encourage self/duplicate connection attempts in transitive mode.","fix":"Use `||` so the asker is filtered if EITHER its name OR its connection_string matches, matching the intent of 'don't send back the node who's asking'.","locations":[{"ref":"ractor_cluster/src/node/node_session.rs:636-644","code":"  636 |                             .into_values()\n  637 |                             .filter_map(|local_session| local_session.peer_name)\n  638 |                             .filter(|local_session| {\n  639 |                                 // don't send back the node who's asking so we don't trigger self-connections\n  640 |                                 whos_asking.name != local_session.name\n  641 |                                     && whos_asking.connection_string\n  642 |                                         != local_session.connection_string\n  643 |                             })\n  644 |                             .collect::<Vec<_>>();","lines":9,"link":"https://github.com/slawlor/ractor/blob/1af0aaad5d340cda27c5370768c6c96a0376a543/ractor_cluster/src/node/node_session.rs#L636-L644"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The self-connection guard in `handle` runs on EVERY message after `state.name` is set and uses `myself.stop(...)` then `return Ok(())`. However it compares only name/connection_string; a legitimate distinct peer that happens to share a connection_string (e.g. behind NAT, or mis-set hostname) is permanently unable to connect. More importantly, the check is performed lazily per-message instead of once when the name is learned, so the session may already have processed control/node messages from a self-connection before the guard fires.","fix":"Perform the self-connection check exactly once, immediately when the peer name is recorded (in handle_auth where `state.name` is set), and reject before any control/node processing.","locations":[{"ref":"ractor_cluster/src/node/node_session.rs:1111-1120","code":" 1111 |         if let Some(peer) = &state.name {\n 1112 |             if self.this_node_name.connection_string == peer.connection_string\n 1113 |                 || self.this_node_name.name == peer.name\n 1114 |             {\n 1115 |                 // self-connection detected, exit session\n 1116 |                 tracing::warn!(\"Cannot establish a connection to self. Exiting\");\n 1117 |                 myself.stop(Some(\"self_connection\".to_string()));\n 1118 |                 return Ok(());\n 1119 |             }\n 1120 |         }","lines":10,"link":"https://github.com/slawlor/ractor/blob/1af0aaad5d340cda27c5370768c6c96a0376a543/ractor_cluster/src/node/node_session.rs#L1111-L1120"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In the cluster JobOptions::from_bytes, when the byte length is not exactly 16 the code silently returns Default::default() (a fresh JobOptions with `submit_time = now`) instead of signaling an error. A corrupted/truncated wire payload is thus interpreted as a brand-new just-submitted job, silently discarding the real submit_time and any TTL, which can defeat TTL-based loadshedding for remote jobs.","fix":"Return a decode error (propagate BoxedDowncastErr) on unexpected lengths rather than fabricating default timing values.","locations":[{"ref":"ractor/src/factory/job.rs:224-230","code":"  224 |     fn from_bytes(mut data: Vec<u8>) -> Self {\n  225 |         if data.len() != 16 {\n  226 |             Self {\n  227 |                 span: None,\n  228 |                 ..Default::default()\n  229 |             }\n  230 |         } else {","lines":7,"link":"https://github.com/slawlor/ractor/blob/1af0aaad5d340cda27c5370768c6c96a0376a543/ractor/src/factory/job.rs#L224-L230"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`notify_world_listeners` always notifies the listeners registered under both `scoped_key` (scope=<actual scope>, group=ALL_GROUPS) and `global_key` (scope=ALL_SCOPES_NOTIFICATION, group=ALL_GROUPS). When a join/leave happens in a scope literally named `ALL_SCOPES_NOTIFICATION`, `scoped_key == global_key`, so the loop over `[scoped_key, global_key]` notifies every listener under that key twice for a single membership change.","fix":"Deduplicate the keys before iterating (skip the global key when it equals the scoped key), e.g. only push `global_key` into the iteration set when `scope != ALL_SCOPES_NOTIFICATION`.","locations":[{"ref":"ractor/src/pg.rs:272-297","code":"  272 |     let scoped_key = ScopeGroupKey {\n  273 |         scope: scope.to_owned(),\n  274 |         group: ALL_GROUPS_NOTIFICATION.to_owned(),\n  275 |     };\n  276 |     let global_key = ScopeGroupKey {\n  277 |         scope: ALL_SCOPES_NOTIFICATION.to_owned(),\n  278 |         group: ALL_GROUPS_NOTIFICATION.to_owned(),\n  279 |     };\n  280 | \n  281 |     for key in [scoped_key, global_key] {\n  282 |         let listeners = monitor\n  283 |             .world_listeners\n  284 |             .get(&key)\n  285 |             .map(|entry| entry.value().clone());\n  286 |         if let Some(listeners) = listeners {\n  287 |             let change = if is_join {\n  288 |                 GroupChangeMessage::Join(scope.to_owned(), group.clone(), actors.to_vec())\n  289 |             } else {\n  290 |                 GroupChangeMessage::Leave(scope.to_owned(), group.clone(), actors.to_vec())\n  291 |             };\n  292 |             for listener in &listeners {\n  293 |                 let _ = listener\n  294 |                     .send_supervisor_evt(SupervisionEvent::ProcessGroupChanged(change.clone()));\n  295 |             }\n  296 |         }\n  297 |     }","lines":26,"link":"https://github.com/slawlor/ractor/blob/1af0aaad5d340cda27c5370768c6c96a0376a543/ractor/src/pg.rs#L272-L297"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`is_reply_port_type` decides whether a field is a reply port purely by checking that the last path segment ident equals the literal string `RpcReplyPort`. This both over-matches and under-matches: a user type alias or unrelated type that happens to be named `RpcReplyPort` (not `ractor::RpcReplyPort`) is treated as a reply port (and its data is dropped from the serialized args, with a oneshot bridge spawned), while a reply port referenced through a re-export under a different final name would not be detected. Because reply-port detection drives the exactly-one-reply-port validation and which fields get serialized vs. bridged, a false match silently changes the wire format and an RPC's behavior with no diagnostic.","fix":"Document this as a deliberate name-based heuristic and/or tighten matching (e.g. accept `RpcReplyPort`, `ractor::RpcReplyPort`, and `rpc::RpcReplyPort` path shapes) so accidental name collisions are less likely to silently reinterpret a data field as a reply port.","locations":[{"ref":"ractor_cluster_derive/src/parse.rs:96-108","code":"   96 | /// Check if a type's last path segment is `RpcReplyPort`.\n   97 | fn is_reply_port_type(ty: &syn::Type) -> bool {\n   98 |     if let syn::Type::Path(type_path) = ty {\n   99 |         type_path\n  100 |             .path\n  101 |             .segments\n  102 |             .last()\n  103 |             .map(|seg| seg.ident == \"RpcReplyPort\")\n  104 |             .unwrap_or(false)\n  105 |     } else {\n  106 |         false\n  107 |     }\n  108 | }","lines":13,"link":"https://github.com/slawlor/ractor/blob/1af0aaad5d340cda27c5370768c6c96a0376a543/ractor_cluster_derive/src/parse.rs#L96-L108"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"StickyQueuerRouting::choose_target_worker scans the entire worker pool linearly (`worker_pool.iter().find(...is_processing_key...)`) on every routed job to find a worker already processing the key. For large worker pools under high job rates this is an O(pool_size) operation per dispatch on the hot path, defeating the O(1) available-worker deque maintained for the fallback case.","fix":"Maintain a `HashMap<TKey, WorkerId>` index of in-flight keys (updated on enqueue/complete) so sticky lookup is O(1) instead of scanning the whole pool.","locations":[{"ref":"ractor/src/factory/routing.rs:365-385","code":"  365 |     fn choose_target_worker(\n  366 |         &mut self,\n  367 |         job: &Job<TKey, TMsg>,\n  368 |         _pool_size: usize,\n  369 |         worker_hint: Option<WorkerId>,\n  370 |         worker_pool: &HashMap<WorkerId, WorkerProperties<TKey, TMsg>>,\n  371 |     ) -> Option<WorkerId> {\n  372 |         // check sticky first\n  373 |         if let Some(worker) = worker_hint.and_then(|worker| worker_pool.get(&worker)) {\n  374 |             if worker.is_processing_key(&job.key) {\n  375 |                 return worker_hint;\n  376 |             }\n  377 |         }\n  378 | \n  379 |         let maybe_worker = worker_pool\n  380 |             .iter()\n  381 |             .find(|(_, worker)| worker.is_processing_key(&job.key))\n  382 |             .map(|(a, _)| *a);\n  383 |         if maybe_worker.is_some() {\n  384 |             return maybe_worker;\n  385 |         }","lines":21,"link":"https://github.com/slawlor/ractor/blob/1af0aaad5d340cda27c5370768c6c96a0376a543/ractor/src/factory/routing.rs#L365-L385"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`which_groups()`, `which_scopes()` and `which_scopes_and_groups()` each scan the entire group `map` (every shard, every entry) and clone every matching key/name, even though a scope->groups secondary `index` already exists that could answer `which_groups`/`which_scopes` far more cheaply. Under many groups this is unnecessary lock contention and allocation on what look like read-mostly query paths.","fix":"Answer scope/group enumeration from the `index` DashMap (already maintained for `which_scoped_groups`) instead of full scans of `map`, falling back to `map` only where the index cannot answer.","locations":[{"ref":"ractor/src/pg.rs:563-574","code":"  563 | pub fn which_groups() -> Vec<GroupName> {\n  564 |     let monitor = get_monitor();\n  565 |     let mut groups = monitor\n  566 |         .map\n  567 |         .iter()\n  568 |         .filter(|kvp| !kvp.value().members.is_empty())\n  569 |         .map(|kvp| kvp.key().group.to_owned())\n  570 |         .collect::<Vec<_>>();\n  571 |     groups.sort_unstable();\n  572 |     groups.dedup();\n  573 |     groups\n  574 | }","lines":12,"link":"https://github.com/slawlor/ractor/blob/1af0aaad5d340cda27c5370768c6c96a0376a543/ractor/src/pg.rs#L563-L574"},{"ref":"ractor/src/pg.rs:594-602","code":"  594 | pub fn which_scopes_and_groups() -> Vec<ScopeGroupKey> {\n  595 |     let monitor = get_monitor();\n  596 |     monitor\n  597 |         .map\n  598 |         .iter()\n  599 |         .filter(|kvp| !kvp.value().members.is_empty())\n  600 |         .map(|kvp| kvp.key().clone())\n  601 |         .collect::<Vec<_>>()\n  602 | }","lines":9,"link":"https://github.com/slawlor/ractor/blob/1af0aaad5d340cda27c5370768c6c96a0376a543/ractor/src/pg.rs#L594-L602"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"The v1 (default) output port allocates a fresh `Vec<u8>`/heap for the broadcast on every `send`, and more importantly `subscribe` takes a write lock on `subscriptions` and linearly scans+`retain`s all subscriptions to prune dead ones on each subscribe call. With many subscribers and frequent subscriptions this is O(n) work under an exclusive lock. Additionally the broadcast channel buffer is hard-capped at 10 (`pubsub::channel(10)`), so a subscriber whose forwarding task falls more than 10 messages behind will silently drop messages (lagged receiver), which the module docs acknowledge only as \"high probability\" of delivery.","fix":"Document the lossy 10-message bound prominently, and consider pruning dead subscriptions lazily or under a cheaper structure; the v2 implementation already addresses the lossiness and should be the recommended path.","locations":[{"ref":"ractor/src/port/output.rs:73-81","code":"   73 |         fn default() -> Self {\n   74 |             // We only need enough buffer for the subscription task to forward to the input port\n   75 |             // of the receiving actor. Hence 10 should be plenty.\n   76 |             let (tx, _rx) = pubsub::channel(10);\n   77 |             Self {\n   78 |                 tx,\n   79 |                 subscriptions: RwLock::new(vec![]),\n   80 |             }\n   81 |         }","lines":9,"link":"https://github.com/slawlor/ractor/blob/1af0aaad5d340cda27c5370768c6c96a0376a543/ractor/src/port/output.rs#L73-L81"},{"ref":"ractor/src/port/output.rs:100-110","code":"  100 |             let mut subs = self.subscriptions.write().unwrap();\n  101 | \n  102 |             // filter out dead subscriptions, since they're no longer valid\n  103 |             subs.retain(|sub| !sub.is_dead());\n  104 | \n  105 |             let sub = OutputPortSubscription::new::<TMsg, F, TReceiverMsg>(\n  106 |                 self.tx.subscribe(),\n  107 |                 converter,\n  108 |                 receiver,\n  109 |             );\n  110 |             subs.push(sub);","lines":11,"link":"https://github.com/slawlor/ractor/blob/1af0aaad5d340cda27c5370768c6c96a0376a543/ractor/src/port/output.rs#L100-L110"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"ActorCell::get_name clones the Option<ActorName> (an Arc<str>/String clone) on every call, and it is invoked frequently for debug formatting (Debug impl, tracing fields, set_status cleanup). For hot paths this is an unnecessary allocation/refcount bump when only a borrow is needed.","fix":"Where call sites only need to read the name (Debug, logging), expose a borrowing accessor or pass the &Option<ActorName> through, reserving the cloning get_name for cases that genuinely need an owned value.","locations":[{"ref":"ractor/src/actor/actor_cell.rs:305-307","code":"  305 |     pub fn get_name(&self) -> Option<ActorName> {\n  306 |         self.inner.name.clone()\n  307 |     }","lines":3,"link":"https://github.com/slawlor/ractor/blob/1af0aaad5d340cda27c5370768c6c96a0376a543/ractor/src/actor/actor_cell.rs#L305-L307"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"process_message handles MessagingErr::InvalidActorType and MessagingErr::SendErr from listen_in_priority, but listen_in_priority can only ever return MessagingErr::ChannelClosed (all its mapping arms produce ChannelClosed). The two extra arms are unreachable in practice and exist only to satisfy the match; the accompanying comments ('not possible') confirm this.","fix":"Change listen_in_priority's error type to MessagingErr<()> with a tighter contract or collapse the unreachable arms into a single `_ =>` arm to make the impossibility explicit and reduce duplicated handling.","locations":[{"ref":"ractor/src/actor.rs:1015-1028","code":" 1015 |             Err(MessagingErr::InvalidActorType) => {\n 1016 |                 // not possible. Treat like a channel closed\n 1017 |                 Ok(ActorLoopResult::signal(Self::handle_signal(\n 1018 |                     myself.clone(),\n 1019 |                     Signal::Kill,\n 1020 |                 )))\n 1021 |             }\n 1022 |             Err(MessagingErr::SendErr(_)) => {\n 1023 |                 // not possible. Treat like a channel closed\n 1024 |                 Ok(ActorLoopResult::signal(Self::handle_signal(\n 1025 |                     myself.clone(),\n 1026 |                     Signal::Kill,\n 1027 |                 )))\n 1028 |             }","lines":14,"link":"https://github.com/slawlor/ractor/blob/1af0aaad5d340cda27c5370768c6c96a0376a543/ractor/src/actor.rs#L1015-L1028"},{"ref":"ractor/src/actor/actor_cell.rs:155-192","code":"  155 |     pub(crate) async fn listen_in_priority(\n  156 |         &mut self,\n  157 |     ) -> Result<ActorPortMessage, MessagingErr<()>> {\n  158 |         #[cfg(feature = \"async-std\")]\n  159 |         {\n  160 |             crate::concurrency::select! {\n  161 |                 signal = (&mut self.signal_rx).fuse() => {\n  162 |                     signal.map(ActorPortMessage::Signal).map_err(|_| MessagingErr::ChannelClosed)\n  163 |                 }\n  164 |                 stop = (&mut self.stop_rx).fuse() => {\n  165 |                     stop.map(ActorPortMessage::Stop).map_err(|_| MessagingErr::ChannelClosed)\n  166 |                 }\n  167 |                 supervision = self.supervisor_rx.recv().fuse() => {\n  168 |                     supervision.map(ActorPortMessage::Supervision).ok_or(MessagingErr::ChannelClosed)\n  169 |                 }\n  170 |                 message = self.message_rx.recv().fuse() => {\n  171 |                     message.map(ActorPortMessage::Message).ok_or(MessagingErr::ChannelClosed)\n  172 |                 }\n  173 |             }\n  174 |         }\n  175 |         #[cfg(not(feature = \"async-std\"))]\n  176 |         {\n  177 |             crate::concurrency::select! {\n  178 |                 signal = &mut self.signal_rx => {\n  179 |                     signal.map(ActorPortMessage::Signal).map_err(|_| MessagingErr::ChannelClosed)\n  180 |                 }\n  181 |                 stop = &mut self.stop_rx => {\n  182 |                     stop.map(ActorPortMessage::Stop).map_err(|_| MessagingErr::ChannelClosed)\n  183 |                 }\n  184 |                 supervision = self.supervisor_rx.recv() => {\n  185 |                     supervision.map(ActorPortMessage::Supervision).ok_or(MessagingErr::ChannelClosed)\n  186 |                 }\n  187 |                 message = self.message_rx.recv() => {\n  188 |                     message.map(ActorPortMessage::Message).ok_or(MessagingErr::ChannelClosed)\n  189 |                 }\n  190 |             }\n  191 |         }\n  192 |     }","lines":38,"link":"https://github.com/slawlor/ractor/blob/1af0aaad5d340cda27c5370768c6c96a0376a543/ractor/src/actor/actor_cell.rs#L155-L192"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"Commented-out variants and imports remain in the v2 output port inner module: the `OutportMessage` enum has commented `RemoveSubscriber(Id)` / `Subscribers(...)` variants and an associated commented `use` line for `oneshot`/`OneshotSender`. This is leftover scaffolding that adds noise.","fix":"Remove the commented-out enum variants and the commented import line, or implement them if intended.","locations":[{"ref":"ractor/src/port/output.rs:238-255","code":"  238 |         //use crate::concurrency::{mpsc_unbounded, oneshot, MpscUnboundedSender, OneshotSender};\n  239 |         use crate::{ActorId, ActorRef, DerivedActorRef, Message};\n  240 | \n  241 |         #[cfg(feature = \"tokio_runtime\")]\n  242 |         /// As we do a lot of iteratio without calling async\n  243 |         /// method while dispatching message, we consume 1 tokio\n  244 |         /// task budget unit every CONSUMBE_BUDGET_FACTOR message sent\n  245 |         const CONSUME_BUDGET_FACTOR: u32 = 32;\n  246 |         /// Each subscriber may receive a batch of MAX_BATCH_SIZE\n  247 |         /// before another batch is sent to an other subscriber\n  248 |         const MAX_BATCH_SIZE: usize = 32;\n  249 | \n  250 |         enum OutportMessage<Id, TMsg> {\n  251 |             Data(TMsg),\n  252 |             SetSubscriber(Option<Box<dyn Subscriber<Id, TMsg>>>),\n  253 |             //RemoveSubscriber(Id),\n  254 |             //Subscribers(OneshotSender<Vec<Id>>),\n  255 |         }","lines":18,"link":"https://github.com/slawlor/ractor/blob/1af0aaad5d340cda27c5370768c6c96a0376a543/ractor/src/port/output.rs#L238-L255"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"hard","description":"`ReadyState::SyncReceived` -> `Ready` transition is reachable in two places (handle_control Ready and after_authenticated), and `after_authenticated`'s match on `ReadyState::SyncReceived` sets Ready but never notifies the NodeServer of ConnectionReady from that path; only the SyncSent->Ready path in handle_control sends it. As a result the SyncReceived->Ready completion (peer sent Ready before we did) produces a Ready session that is never reported as ready to subscribers.","fix":"When `after_authenticated` transitions SyncReceived->Ready, also cast `NodeServerMessage::ConnectionReady(myself.get_id())` so both orderings notify subscribers.","locations":[{"ref":"ractor_cluster/src/node/node_session.rs:789-795","code":"  789 |         match state.ready {\n  790 |             ReadyState::Open => state.ready = ReadyState::SyncSent,\n  791 |             ReadyState::SyncReceived => state.ready = ReadyState::Ready,\n  792 |             ReadyState::SyncSent | ReadyState::Ready => {\n  793 |                 unreachable!(\"after_authenticated() executed twice\")\n  794 |             }\n  795 |         }","lines":7,"link":"https://github.com/slawlor/ractor/blob/1af0aaad5d340cda27c5370768c6c96a0376a543/ractor_cluster/src/node/node_session.rs#L789-L795"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"medium","difficulty":"easy","description":"The module-level doc comment claims that enum variants are encoded over the wire by a numeric `index` field assigned from their lexicographical ordering, and that this is the `index` field on `ractor::message::SerializedMessage`. This is false and contradicts both the actual implementation and the `RactorClusterMessage` doc immediately below it. The generated code uses the variant *name string* as the discriminator (`variant: #variant_name.to_string()`), there is no numeric index, no lexicographical sorting, and `SerializedMessage` has a `variant: String` field, not an `index` field. A reader relying on this comment would wrongly assume variant *ordering* (rather than names) must be kept stable across cluster nodes for wire compatibility, which is exactly backwards from the real (name-based) compatibility guarantee documented at lines 57-58 and 65.","fix":"Rewrite the comment to describe name-based tagging: each variant is identified over the wire by its variant name string (carried in the `variant: String` field of `SerializedMessage::Cast`/`Call`), so variant names (not ordering) must remain stable across nodes until all are upgraded.","locations":[{"ref":"ractor_cluster_derive/src/lib.rs:19-20","code":"   19 | //!    a. All variants of the enum will be numbered based on their lexicographical ordering, which is sent over-the-wire in order to decode which\n   20 | //!    variant was called. This is the `index` field on any variant of `ractor::message::SerializedMessage`","lines":2,"link":"https://github.com/slawlor/ractor/blob/1af0aaad5d340cda27c5370768c6c96a0376a543/ractor_cluster_derive/src/lib.rs#L19-L20"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"The async-std `JoinSet::join_next` is documented to mirror tokio's `JoinSet` and returns `Option<Result<T, ()>>`, but it always wraps results in `Ok` (`self.set.next().await.map(|item| Ok(item))`) and can never produce `Err`. Callers like `rpc::multi_call` contain a `_ => return Err(MessagingErr::ChannelClosed)` arm intended to handle a cancelled/panicked joined task; with the async-std backend that arm is dead, so a panicking spawned task is silently lost instead of surfacing an error, diverging from tokio behavior where a `JoinError` would be returned.","fix":"Document the behavioral difference, or have the async-std `JoinSet` catch task failures (e.g. via a wrapper that detects cancellation) and return `Err(())` on failure to match tokio's contract.","locations":[{"ref":"ractor/src/concurrency/async_std_primitives.rs:151-154","code":"  151 |     /// Join the next future\n  152 |     pub async fn join_next(&mut self) -> Option<Result<T, ()>> {\n  153 |         self.set.next().await.map(|item| Ok(item))\n  154 |     }","lines":4,"link":"https://github.com/slawlor/ractor/blob/1af0aaad5d340cda27c5370768c6c96a0376a543/ractor/src/concurrency/async_std_primitives.rs#L151-L154"},{"ref":"ractor/src/rpc.rs:254-259","code":"  254 |     while let Some(result) = join_set.join_next().await {\n  255 |         match result {\n  256 |             Ok((i, r)) => results[i] = r,\n  257 |             _ => return Err(MessagingErr::ChannelClosed),\n  258 |         }\n  259 |     }","lines":6,"link":"https://github.com/slawlor/ractor/blob/1af0aaad5d340cda27c5370768c6c96a0376a543/ractor/src/rpc.rs#L254-L259"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The comment for the `PgLeave` branch says 'join the remote actors to the local PG group' but the code performs a leave (`leave_scoped`). Copy-paste from the PgJoin branch above.","fix":"Correct the comment to 'leave the remote actors from the local PG group'.","locations":[{"ref":"ractor_cluster/src/node/node_session.rs:610-618","code":"  610 |                     // join the remote actors to the local PG group\n  611 |                     if !cells.is_empty() {\n  612 |                         tracing::debug!(\n  613 |                             \"PG Leave scope '{}' and group '{}' for {} remote actors\",\n  614 |                             leave.scope,\n  615 |                             leave.group,\n  616 |                             cells.len()\n  617 |                         );\n  618 |                         ractor::pg::leave_scoped(leave.scope, leave.group, cells);","lines":9,"link":"https://github.com/slawlor/ractor/blob/1af0aaad5d340cda27c5370768c6c96a0376a543/ractor_cluster/src/node/node_session.rs#L610-L618"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The doc comment for ActorProperties::send_message_unchecked is labeled 'SAFETY: Callers must ensure the message type matches the actor's expected type', implying memory-unsafety semantics, but the function is not `unsafe` and a type mismatch only yields a logical error / SendErr, never undefined behavior (the message is still type-erased via Any). The 'SAFETY' wording is misleading for a safe function.","fix":"Reword the comment as a normal invariant note (e.g. 'NOTE: callers must ensure ...') rather than 'SAFETY', since no unsafe code or UB is involved.","locations":[{"ref":"ractor/src/actor/actor_properties.rs:185-197","code":"  185 |     /// Send a message without runtime type checking.\n  186 |     ///\n  187 |     /// This is an internal optimization for strongly-typed ActorRef which has compile-time\n  188 |     /// type safety guarantees, avoiding the redundant runtime TypeId comparison.\n  189 |     ///\n  190 |     /// SAFETY: Callers must ensure the message type matches the actor's expected type.\n  191 |     pub(crate) fn send_message_unchecked<TMessage>(\n  192 |         &self,\n  193 |         message: TMessage,\n  194 |     ) -> Result<(), MessagingErr<TMessage>>\n  195 |     where\n  196 |         TMessage: Message,\n  197 |     {","lines":13,"link":"https://github.com/slawlor/ractor/blob/1af0aaad5d340cda27c5370768c6c96a0376a543/ractor/src/actor/actor_properties.rs#L185-L197"}]},
{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"update_settings logs the discard handler update with the label `HashValue` (\"Updating discard handler: HashValue={}\") while logging `discard_handler.is_some()`. This is a copy-paste typo of `HasValue` used in the surrounding log lines and prints a boolean under a misleading key.","fix":"Change the format string label from `HashValue` to `HasValue` to match the other update_settings log lines.","locations":[{"ref":"ractor/src/factory/factoryimpl.rs:759-763","code":"  759 |         if let Some(discard_handler) = discard_handler {\n  760 |             tracing::debug!(\n  761 |                 \"Updating discard handler: HashValue={}\",\n  762 |                 discard_handler.is_some()\n  763 |             );","lines":5,"link":"https://github.com/slawlor/ractor/blob/1af0aaad5d340cda27c5370768c6c96a0376a543/ractor/src/factory/factoryimpl.rs#L759-L763"}]},
{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The doc comment on WorkerProperties.discard_settings says \"will cause an oldest job at the head of the queue will be dropped\" — this is grammatically broken (\"an oldest ... will be dropped\") and also misleading because the discard direction (oldest vs newest) actually depends on the configured DiscardMode, not always the oldest.","fix":"Reword to: \"When the queue is at its max length, a job at the head (oldest) or the incoming job (newest) is dropped depending on the configured DiscardMode.\"","locations":[{"ref":"ractor/src/factory/worker.rs:577-581","code":"  577 |     /// Maximum queue length. Any job arriving when the queue is at its max length\n  578 |     /// will cause an oldest job at the head of the queue will be dropped.\n  579 |     ///\n  580 |     /// Default is [WorkerDiscardSettings::None]\n  581 |     pub(crate) discard_settings: WorkerDiscardSettings,","lines":5,"link":"https://github.com/slawlor/ractor/blob/1af0aaad5d340cda27c5370768c6c96a0376a543/ractor/src/factory/worker.rs#L577-L581"}]},
{"id":"OTHER_1","type":"other","type_label":"Other","severity":"low","difficulty":"hard","description":"For struct-style (named) variants the generated code binds the user's own field identifiers directly in the match pattern (e.g. `Self::Variant { a, b }`) while also introducing helper bindings such as `__data`, `__ptr`, `__args`, `__variant`, `__reply`, `__target_port`, `__len`, `__len_bytes`. The codegen header comment asserts the `__` prefix avoids collisions with user-chosen field names, but a user is free to name a struct field with a leading double underscore (e.g. a field literally named `__data` or `__ptr`). In that case the pattern binding of the user field and the generated `let mut __data`/`let mut __ptr` collide/shadow, producing either a silent miscompilation of that field or a confusing error, contradicting the stated guarantee.","fix":"Either generate the helper bindings with `proc_macro2::Span::mixed_site()`/`quote::format_ident!` hygiene that cannot collide, or reject (with a `compile_error!`) any named field whose identifier begins with `__`, and update the header comment to state the actual constraint.","locations":[{"ref":"ractor_cluster_derive/src/codegen.rs:6-9","code":"    6 | //! Code generation from parsed IR for `RactorClusterMessage`.\n    7 | //!\n    8 | //! Internal generated variables use `__` prefix to avoid collisions with\n    9 | //! user-chosen field names in named (struct-style) variants.","lines":4,"link":"https://github.com/slawlor/ractor/blob/1af0aaad5d340cda27c5370768c6c96a0376a543/ractor_cluster_derive/src/codegen.rs#L6-L9"}]}
