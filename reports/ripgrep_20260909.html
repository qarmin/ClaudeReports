<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}

#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}

.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}

.loc-lines{color:#4b5563;font-weight:400}

.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"The `--help`/`--generate man` doc-generation pipeline is full of `unreachable!()` and `assert!()` calls that fire at runtime based on the *content* of static `doc_long()`/`doc_short()` strings written in `crates/core/flags/defs.rs` (e.g. a `\\flag{typo}` tag pointing at a non-existent flag, a `\\flag-negate{foo}` tag for a flag with no negation, or an accidental blank line inside a roff doc string feeding `remove_roff`'s `assert!(!line.is_empty(), ...)`). These functions are invoked every time a user runs `rg -h`/`rg --help`/`rg --generate man`, so a single malformed doc string anywhere in `defs.rs` crashes that command for all users. There is no test in the repo that actually calls `generate_short()`, `generate_long()`, or `man::generate()` and checks they don't panic -- `test_generate` in `defs.rs` only checks that `--generate` parses into the right `Mode`, it never renders the docs. This means such a bug would only be caught by a human manually running `--help`/`--generate man`, not by `cargo test`.","fix":"Add a unit test (in `crates/core/flags/doc/help.rs` or a shared test module) that calls `help::generate_short()`, `help::generate_long()`, and `man::generate()` once for every flag in `defs::FLAGS` as part of `cargo test`, so any `\\flag{}`/`\\flag-negate{}`/roff-formatting mistake is caught in CI instead of surfacing as a user-facing panic on `--help`.","locations":[{"ref":"crates/core/flags/doc/help.rs:234-277","code":"  234 | fn remove_roff(v: &str) -> String {\n  235 |     let mut lines = vec![];\n  236 |     for line in v.trim().lines() {\n  237 |         assert!(!line.is_empty(), \"roff should have no empty lines\");\n  238 |         if line.starts_with(\".\") {\n  239 |             if line.starts_with(\".IP \") {\n  240 |                 let item_label = line\n  241 |                     .split(\" \")\n  242 |                     .nth(1)\n  243 |                     .expect(\"first argument to .IP\")\n  244 |                     .replace(r\"\\(bu\", r\"•\")\n  245 |                     .replace(r\"\\fB\", \"\")\n  246 |                     .replace(r\"\\fP\", \":\");\n  247 |                 lines.push(format!(\"{item_label}\"));\n  248 |             } else if line.starts_with(\".IB \") || line.starts_with(\".BI \") {\n  249 |                 let pieces = line\n  250 |                     .split_whitespace()\n  251 |                     .skip(1)\n  252 |                     .collect::<Vec<_>>()\n  253 |                     .concat();\n  254 |                 lines.push(format!(\"{pieces}\"));\n  255 |             } else if line.starts_with(\".sp\")\n  256 |                 || line.starts_with(\".PP\")\n  257 |                 || line.starts_with(\".TP\")\n  258 |             {\n  259 |                 lines.push(\"\".to_string());\n  260 |             }\n  261 |         } else if line.starts_with(r\"\\fB\") && line.ends_with(r\"\\fP\") {\n  262 |             let line = line.replace(r\"\\fB\", \"\").replace(r\"\\fP\", \"\");\n  263 |             lines.push(format!(\"{line}:\"));\n  264 |         } else {\n  265 |             lines.push(line.to_string());\n  266 |         }\n  267 |     }\n  268 |     // Squash multiple adjacent paragraph breaks into one.\n  269 |     lines.dedup_by(|l1, l2| l1.is_empty() && l2.is_empty());\n  270 |     lines\n  271 |         .join(\"\\n\")\n  272 |         .replace(r\"\\fB\", \"\")\n  273 |         .replace(r\"\\fI\", \"\")\n  274 |         .replace(r\"\\fP\", \"\")\n  275 |         .replace(r\"\\-\", \"-\")\n  276 |         .replace(r\"\\\\\", r\"\\\")\n  277 | }","lines":44,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/crates/core/flags/doc/help.rs#L234-L277"},{"ref":"crates/core/flags/doc/help.rs:169-192","code":"  169 |     let doc = super::render_custom_markup(doc, \"flag\", |name, out| {\n  170 |         let Some(flag) = cr {"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`MultiStrategyBuilder::prefix()` and `::suffix()` build an `AhoCorasick` automaton with `AhoCorasick::new(&self.literals).unwrap()`. `AhoCorasick::new` returns a `Result` and can fail (e.g. if the combined pattern set is too large or exceeds internal automaton limits), which would panic instead of surfacing as a `globset::Error`. Every other fallible builder step in `GlobSet::new` (e.g. `RequiredExtensionStrategyBuilder::build`, `MultiStrategyBuilder::regex_set`) properly propagates errors via `Result`; these two call sites are the exception and can bring down the whole process for glob sets with a very large number of prefix/suffix literals (e.g. huge user-supplied `.gitignore`/override lists).","fix":"Make `prefix`/`suffix` fallible and propagate the error, mirroring `regex_set`:\n```rust\nfn prefix(self) -> Result<PrefixStrategy, Error> {\n    let matcher = AhoCorasick::new(&self.literals).map_err(|err| Error {\n        glob: None,\n        kind: ErrorKind::Regex(err.to_string()),\n    })?;\n    Ok(PrefixStrategy { matcher, map: self.map, longest: self.longest })\n}\n```\nand update the two call sites in `GlobSet::new` to use `suffixes.suffix()?` / `prefixes.prefix()?`.","locations":[{"ref":"crates/globset/src/lib.rs:1035-1041","code":" 1035 |     fn prefix(self) -> PrefixStrategy {\n 1036 |         PrefixStrategy {\n 1037 |             matcher: AhoCorasick::new(&self.literals).unwrap(),\n 1038 |             map: self.map,\n 1039 |             longest: self.longest,\n 1040 |         }\n 1041 |     }","lines":7,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/crates/globset/src/lib.rs#L1035-L1041"},{"ref":"crates/globset/src/lib.rs:1043-1049","code":" 1043 |     fn suffix(self) -> SuffixStrategy {\n 1044 |         SuffixStrategy {\n 1045 |             matcher: AhoCorasick::new(&self.literals).unwrap(),\n 1046 |             map: self.map,\n 1047 |             longest: self.longest,\n 1048 |         }\n 1049 |     }","lines":7,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/crates/globset/src/lib.rs#L1043-L1049"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`RequiredExtensionStrategy::matches_all` only checks the regexes registered under the candidate's own extension and ignores every other extension bucket stored in `self.0`. If a `GlobSet` contains required-extension patterns for more than one extension (e.g. `**/m*.rs` and `**/m*.c`), `matches_all` incorrectly returns `true` as soon as the patterns for the candidate's own extension match, even though the patterns for the other extension can never match this candidate. Verified by building a `GlobSet` from `[\"**/m*.rs\", \"**/m*.c\"]` and calling `set.matches_all(\"a/main.rs\")`: it returns `true`, while `set.matches(\"a/main.rs\")` returns only `[0]` (only the `.rs` pattern actually matched), proving not all glob patterns in the set matched. Every other strategy (`LiteralStrategy`, `BasenameLiteralStrategy`, `ExtensionStrategy`, `PrefixStrategy`, `SuffixStrategy`, `RegexSetStrategy`) accounts for the *total* number of registered patterns when computing `matches_all`; `RequiredExtensionStrategy` is the only one that doesn't, breaking the invariant documented on `GlobSet::matches_all`.","fix":"Compare the number of matched regexes for the candidate's extension against the total number of required-extension patterns across *all* extensions, not just the candidate's own bucket, e.g.:\n```rust\nfn matches_all(&self, candidate: &Candidate<'_>) -> bool {\n    let total: usize = self.0.values().map(|v| v.len()).sum();\n    if candidate.ext.is_empty() {\n        return total == 0;\n    }\n    match self.0.get(candidate.ext.as_bytes()) {\n        Some(regexes) if regexes.len() == total => regexes\n            .iter()\n            .all(|(_, re)| re.is_match(candidate.path.as_bytes())),\n        _ => false,\n    }\n}\n```","locations":[{"ref":"crates/globset/src/lib.rs:928-942","code":"  928 |     fn matches_all(&self, candidate: &Candidate<'_>) -> bool {\n  929 |         if candidate.ext.is_empty() {\n  930 |             return false;\n  931 |         }\n  932 |         if let Some(regexes) = self.0.get(candidate.ext.as_bytes()) {\n  933 |             for &(_, ref re) in regexes {\n  934 |                 if !re.is_match(candidate.path.as_bytes()) {\n  935 |                     return false;\n  936 |                 }\n  937 |             }\n  938 |             true\n  939 |         } else {\n  940 |             false\n  941 |         }\n  942 |     }","lines":15,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/crates/globset/src/lib.rs#L928-L942"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`set_windows_exe_options` emits `cargo:rerun-if-changed=pkg/windows/Manifest.xml` when targeting windows-msvc, but `set_git_revision_hash` (called right before it in `main`) never emits any `rerun-if-changed` directive of its own. Cargo's rule is that if a build script emits *any* `rerun-if-changed` instruction, Cargo disables its default fallback of rebuilding whenever any file in the package changes, and only reruns the script for the listed paths. Since the only `rerun-if-changed` emitted on windows-msvc points at the manifest file, the build script (and thus the `RIPGREP_BUILD_GIT_HASH` env var baked into the binary via `cargo:rustc-env`) will no longer be refreshed when the git commit changes but the manifest doesn't -- so `rg --version` can silently report a stale git hash on Windows-msvc builds after switching commits/branches without touching the manifest.","fix":"Emit an unconditional rerun-if-changed that keeps Cargo's git-hash tracking correct, e.g. add `println!(\"cargo:rerun-if-changed=.git/HEAD\");` (and/or the current ref file) in `set_git_revision_hash`, or avoid emitting `rerun-if-changed` for the manifest at all so Cargo keeps using its default whole-package rebuild heuristic.","locations":[{"ref":"build.rs:1-4","code":"    1 | fn main() {\n    2 |     set_git_revision_hash();\n    3 |     set_windows_exe_options();\n    4 | }","lines":4,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/build.rs#L1-L4"},{"ref":"build.rs:12-32","code":"   12 | fn set_windows_exe_options() {\n   13 |     static MANIFEST: &str = \"pkg/windows/Manifest.xml\";\n   14 | \n   15 |     let Ok(target_os) = std::env::var(\"CARGO_CFG_TARGET_OS\") else { return };\n   16 |     let Ok(target_env) = std::env::var(\"CARGO_CFG_TARGET_ENV\") else { return };\n   17 |     if !(target_os == \"windows\" && target_env == \"msvc\") {\n   18 |         return;\n   19 |     }\n   20 | \n   21 |     let Ok(mut manifest) = std::env::current_dir() else { return };\n   22 |     manifest.push(MANIFEST);\n   23 |     let Some(manifest) = manifest.to_str() else { return };\n   24 | \n   25 |     println!(\"cargo:rerun-if-changed={MANIFEST}\");\n   26 |     // Embed the Windows application manifest file.\n   27 |     println!(\"cargo:rustc-link-arg-bin=rg=/MANIFEST:EMBED\");\n   28 |     println!(\"cargo:rustc-link-arg-bin=rg=/MANIFESTINPUT:{manifest}\");\n   29 |     // Turn linker warnings into errors. Helps debugging, otherwise the\n   30 |     // warnings get squashed (I believe).\n   31 |     println!(\"cargo:rustc-link-arg-bin=rg=/WX\");\n   32 | }","lines":21,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/build.rs#L12-L32"},{"ref":"build.rs:36-61","code":"   36 | fn set_git_revision_hash() {\n   37 |     use std::process::Command;\n   38 | \n   39 |     let args = &[\"rev-parse\", \"--short=10\", \"HEAD\"];\n   40 |     let output = Command::new(\"git\").args(args).output();\n   41 |     match output {\n   42 |         Ok(output) => {\n   43 |             let rev =\n   44 |                 String::from_utf8_lossy(&output.stdout).trim().to_string();\n   45 |             if rev.is_empty() {\n   46 |                 println!(\n   47 |                     \"cargo:warning=output from `git rev-parse` is empty, \\\n   48 |                      so skipping embedding of commit hash\"\n   49 |                 );\n   50 |                 return;\n   51 |             }\n   52 |             println!(\"cargo:rustc-env=RIPGREP_BUILD_GIT_HASH={rev}\");\n   53 |         }\n   54 |         Err(e) => {\n   55 |             println!(\n   56 |                 \"cargo:warning=failed to run `git rev-parse`, \\\n   57 |                  so skipping embedding of commit hash: {e}\"\n   58 |             );\n   59 |         }\n   60 |     }\n   61 | }","lines":26,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/build.rs#L36-L61"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `try_resolve_binary`'s helper `is_exe` (crates/cli/src/decompress.rs:453-456), a candidate path is considered a valid executable if it simply isn't a directory -- the Unix executable permission bits are never checked. `try_associate`/`associate` call `try_resolve_binary` unconditionally on all platforms (not gated behind `cfg!(windows)` like the public `resolve_binary` is), so on Unix, if a PATH directory earlier in `$PATH` contains a non-executable regular file with the same name as the requested program (e.g. a stray data file called `gzip`), `try_resolve_binary` will resolve to that non-executable file and stop searching, instead of continuing on to the real executable later in PATH. This causes the decompression command to fail at spawn time (EACCES) even though a working executable exists in PATH.","fix":"On Unix, also check the executable permission bits before accepting a match, e.g.:\n```rust\nfn is_exe(path: &Path) -> bool {\n    let Ok(md) = path.metadata() else { return false };\n    if md.is_dir() {\n        return false;\n    }\n    #[cfg(unix)]\n    {\n        use std::os::unix::fs::PermissionsExt;\n        return md.permissions().mode() & 0o111 != 0;\n    }\n    #[cfg(not(unix))]\n    {\n        true\n    }\n}\n```","locations":[{"ref":"crates/cli/src/decompress.rs:448-487","code":"  448 | fn try_resolve_binary<P: AsRef<Path>>(\n  449 |     prog: P,\n  450 | ) -> Result<PathBuf, CommandError> {\n  451 |     use std::env;\n  452 | \n  453 |     fn is_exe(path: &Path) -> bool {\n  454 |         let Ok(md) = path.metadata() else { return false };\n  455 |         !md.is_dir()\n  456 |     }\n  457 | \n  458 |     let prog = prog.as_ref();\n  459 |     if prog.is_absolute() {\n  460 |         return Ok(prog.to_path_buf());\n  461 |     }\n  462 |     let Some(syspaths) = env::var_os(\"PATH\") else {\n  463 |         let msg = \"system PATH environment variable not found\";\n  464 |         return Err(CommandError::io(io::Error::new(\n  465 |             io::ErrorKind::Other,\n  466 |             msg,\n  467 |         )));\n  468 |     };\n  469 |     for syspath in env::split_paths(&syspaths) {\n  470 |         if syspath.as_os_str().is_empty() {\n  471 |             continue;\n  472 |         }\n  473 |         let abs_prog = syspath.join(prog);\n  474 |         if is_exe(&abs_prog) {\n  475 |             return Ok(abs_prog.to_path_buf());\n  476 |         }\n  477 |         if abs_prog.extension().is_none() {\n  478 |             for extension in [\"com\", \"exe\"] {\n  479 |                 let abs_prog = abs_prog.with_extension(extension);\n  480 |                 if is_exe(&abs_prog) {\n  481 |                     return Ok(abs_prog.to_path_buf());\n  482 |                 }\n  483 |             }\n  484 |         }\n  485 |     }\n  486 |     let msg = format!(\"{}: could not find executable in PATH\", prog.display());\n  487 |     return Err(CommandError::io(io::Error::new(io::ErrorKind::Other, msg)));","lines":40,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/crates/cli/src/decompress.rs#L448-L487"},{"ref":"crates/cli/src/decompress.rs:453-456","code":"  453 |     fn is_exe(path: &Path) -> bool {\n  454 |         let Ok(md) = path.metadata() else { return false };\n  455 |         !md.is_dir()\n  456 |     }","lines":4,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/crates/cli/src/decompress.rs#L453-L456"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"hard","description":"In `remove_matching_bytes`, the `Look::Start | Look::End` case (i.e. `\\A`/`\\z`, not the line-anchored `^`/`$` variants) removes `b'\\n'` from the non-matching-byte set even though `\\A`/`\\z` say nothing about newlines at all. This is acknowledged in the surrounding `// FIXME: This is wrong` comment, but it means a pattern anchored with `\\A`/`\\z` can cause the fast line-by-line search path in `grep-searcher` to incorrectly treat `\\n` as a possible match byte (or vice-versa), diverging from what the slow path would report, per the linked upstream issue discussion this code references (#2260 nearby in `config.rs`).","fix":"Treat `Look::Start`/`Look::End` (absolute text anchors) as not removing any byte from the non-matching set (matching the true semantics of `\\A`/`\\z`), and instead ensure callers that rely on the line-by-line fast path explicitly disable it whenever a `Look::Start`/`Look::End` assertion is present in the pattern (which `ConfiguredHIR::line_terminator` already partially does via `contains_anchor_haystack`).","locations":[{"ref":"crates/regex/src/non_matching.rs:30-35","code":"   30 |         HirKind::Look(Look::Start | Look::End) => {\n   31 |             // FIXME: This is wrong, but not doing this leads to incorrect\n   32 |             // results because of how anchored searches are implemented in\n   33 |             // the 'grep-searcher' crate.\n   34 |             set.remove(b'\\n');\n   35 |         }","lines":6,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/crates/regex/src/non_matching.rs#L30-L35"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`SortMode::supported()` in lowargs.rs checks whether last-modified/last-accessed/created sorting is supported by calling `std::env::current_exe()` and inspecting *that* file's metadata, rather than checking the metadata of the actual directory/paths that will be searched (which are not known/needed at this point, but `std::env::current_dir()` would at least be a directory on the same filesystem as the search). Since `current_exe()` can live on a completely different filesystem/mount than the paths being searched (e.g. binary installed on one filesystem, search target on a network mount or a filesystem without atime support), this heuristic can produce a wrong verdict: it may report a sort mode as supported when the actual search paths don't support that timestamp (silently falling back to `None`/unordered treatment for those entries at hiargs.rs:776, `s.path().metadata().and_then(|m| get(&m)).ok()`), or reject a sort mode as unsupported (bailing out with an error) even though the real search paths would have supported it fine.","fix":"Check metadata support against `std::env::current_dir()` (or, better, defer this check until the actual search paths are known and check one of them) instead of `std::env::current_exe()`, since the executable's filesystem has no necessary relationship to the filesystem(s) being searched.","locations":[{"ref":"crates/core/flags/lowargs.rs:686-721","code":"  686 | impl SortMode {\n  687 |     /// Checks whether the selected sort mode is supported. If it isn't, an\n  688 |     /// error (hopefully explaining why) is returned.\n  689 |     pub(crate) fn supported(&self) -> anyhow::Result<()> {\n  690 |         match self.kind {\n  691 |             SortModeKind::Path => Ok(()),\n  692 |             SortModeKind::LastModified => {\n  693 |                 let md = std::env::current_exe()\n  694 |                     .and_then(|p| p.metadata())\n  695 |                     .and_then(|md| md.modified());\n  696 |                 let Err(err) = md else { return Ok(()) };\n  697 |                 anyhow::bail!(\n  698 |                     \"sorting by last modified isn't supported: {err}\"\n  699 |                 );\n  700 |             }\n  701 |             SortModeKind::LastAccessed => {\n  702 |                 let md = std::env::current_exe()\n  703 |                     .and_then(|p| p.metadata())\n  704 |                     .and_then(|md| md.accessed());\n  705 |                 let Err(err) = md else { return Ok(()) };\n  706 |                 anyhow::bail!(\n  707 |                     \"sorting by last accessed isn't supported: {err}\"\n  708 |                 );\n  709 |             }\n  710 |             SortModeKind::Created => {\n  711 |                 let md = std::env::current_exe()\n  712 |                     .and_then(|p| p.metadata())\n  713 |                     .and_then(|md| md.created());\n  714 |                 let Err(err) = md else { return Ok(()) };\n  715 |                 anyhow::bail!(\n  716 |                     \"sorting by creation time isn't supported: {err}\"\n  717 |                 );\n  718 |             }\n  719 |         }\n  720 |     }\n  721 | }","lines":36,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/crates/core/flags/lowargs.rs#L686-L721"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`expand_tilde` expands `~` in git's `core.excludesFile` value by calling `path.replace(\"~\", &home)`, which substitutes *every* occurrence of `~` in the string, not just a leading `~/` as git/shell tilde-expansion conventions require. If the configured path contains a `~` anywhere other than the very start (e.g. a directory literally named with a tilde, or a value like `~/foo/~bar`), the result is mangled (every `~` gets replaced with the home directory), producing a bogus path that silently fails to load the global gitignore file.","fix":"Only expand a leading tilde, e.g.:\n```rust\nfn expand_tilde(path: &str) -> String {\n    let home = match home_dir() {\n        None => return path.to_string(),\n        Some(home) => home.to_string_lossy().into_owned(),\n    };\n    if let Some(rest) = path.strip_prefix(\"~\") {\n        format!(\"{home}{rest}\")\n    } else {\n        path.to_string()\n    }\n}\n```","locations":[{"ref":"crates/ignore/src/gitignore.rs:689-696","code":"  689 | /// Expands ~ in file paths to the value of $HOME.\n  690 | fn expand_tilde(path: &str) -> String {\n  691 |     let home = match home_dir() {\n  692 |         None => return path.to_string(),\n  693 |         Some(home) => home.to_string_lossy().into_owned(),\n  694 |     };\n  695 |     path.replace(\"~\", &home)\n  696 | }","lines":8,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/crates/ignore/src/gitignore.rs#L689-L696"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`record_matches` in both `JSONSink` and `StandardSink` computes match offsets\nrelative to `range.start` (`s = m.start() - range.start`, `e = m.end() - range.start`)\nbefore pushing them into the shared `matches` vector, but the follow-up check that is\nmeant to drop a trailing empty match compares that *relative* offset against an\n*absolute* quantity instead of the length of the sliced range. `json.rs` compares\nagainst `bytes.len()` (the length of the full underlying search buffer passed in,\ne.g. `mat.buffer()`), while `standard.rs` compares against `range.end` (the absolute\nend offset within that same buffer). Neither is equal to `range.end - range.start`\n(the actual length of `mat.bytes()`/`ctx.bytes()` that the relative offsets are\nexpressed in), except by coincidence when `range.start == 0` (which only happens for\nthe `context()` call sites, not for `matched()`). Because the two nearly-identical\ncopies of this function disagree on what they compare against, and neither matches\nthe units of the value being compared, the \"don't report empty matches appearing at\nthe end of the bytes\" logic is not doing what its comment says for the `matched()`\ncode path, where `range.start` is generally non-zero and `bytes.len()`/`range.end`\nare much larger than the relevant slice length.","fix":"Compare the relative offset against the length of the slice the offsets are actually\nrelative to, i.e. `range.end - range.start`, consistently in both files:\n```rust\nif !matches.is_empty()\n    && matches.last().unwrap().is_empty()\n    && matches.last().unwrap().start() >= range.end - range.start\n{\n    matches.pop().unwrap();\n}\n```\nThis makes the two copies of `record_matches` consistent with each other and with the\nunits of the `s`/`e` offsets computed just above.","locations":[{"ref":"crates/printer/src/json.rs:672-678","code":"  672 |         // Don't report empty matches appearing at the end of the bytes.\n  673 |         if !matches.is_empty()\n  674 |             && matches.last().unwrap().is_empty()\n  675 |             && matches.last().unwrap().start() >= bytes.len()\n  676 |         {\n  677 |             matches.pop().unwrap();\n  678 |         }","lines":7,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/crates/printer/src/json.rs#L672-L678"},{"ref":"crates/printer/src/standard.rs:727-733","code":"  727 |         // Don't report empty matches appearing at the end of the bytes.\n  728 |         if !matches.is_empty()\n  729 |             && matches.last().unwrap().is_empty()\n  730 |             && matches.last().unwrap().start() >= range.end\n  731 |         {\n  732 |             matches.pop().unwrap();\n  733 |         }","lines":7,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/crates/printer/src/standard.rs#L727-L733"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"Several places open a hyperlink span with `start_hyperlink`/`interpolator.begin` and\nthen perform one or more subsequent fallible writes before calling\n`finish`/`end_hyperlink` to close the span, using `?` to propagate errors from the\nwrites in between. If any of those intermediate writes fails (e.g. a broken pipe\nwhile `rg` output is piped into `head`, or any other transient `io::Error`), the\nfunction returns early via `?` and the hyperlink-closing call is skipped entirely.\nSince hyperlinks are emitted as raw terminal escape sequences (OSC 8), this can leave\nan unterminated hyperlink span written to the output stream; if the process does not\nimmediately abort and further unrelated text is written to the same terminal by a\nlater invocation, that text could be visually/semantically absorbed into the\nstill-open hyperlink.","fix":"Ensure the hyperlink-closing call always runs once the span has been opened, even if\nan intermediate write fails, e.g. by capturing the first error and still invoking the\ncloser before propagating it:\n```rust\nlet status = self.start_hyperlink(&ppath)?;\nlet result = (|| -> io::Result<()> {\n    self.wtr.set_color(self.config.colors.path())?;\n    self.wtr.write_all(ppath.as_bytes())?;\n    self.wtr.reset()\n})();\nself.interpolator.finish(status, &mut self.wtr)?;\nresult\n```\nApply the same pattern to `write_path_hyperlink` and `write_prelude` in `standard.rs`.","locations":[{"ref":"crates/printer/src/path.rs:150-163","code":"  150 |     pub fn write(&mut self, path: &Path) -> io::Result<()> {\n  151 |         let ppath = PrinterPath::new(path.as_ref())\n  152 |             .with_separator(self.config.separator);\n  153 |         if !self.wtr.supports_color() {\n  154 |             self.wtr.write_all(ppath.as_bytes())?;\n  155 |         } else {\n  156 |             let status = self.start_hyperlink(&ppath)?;\n  157 |             self.wtr.set_color(self.config.colors.path())?;\n  158 |             self.wtr.write_all(ppath.as_bytes())?;\n  159 |             self.wtr.reset()?;\n  160 |             self.interpolator.finish(status, &mut self.wtr)?;\n  161 |         }\n  162 |         self.wtr.write_all(&[self.config.terminator])\n  163 |     }","lines":14,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/crates/printer/src/path.rs#L150-L163"},{"ref":"crates/printer/src/standard.rs:1448-1452","code":" 1448 |     fn write_path_hyperlink(&self, path: &PrinterPath) -> io::Result<()> {\n 1449 |         let status = self.start_hyperlink(path, None, None)?;\n 1450 |         self.write_path(path)?;\n 1451 |         self.end_hyperlink(status)\n 1452 |     }","lines":5,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/crates/printer/src/standard.rs#L1448-L1452"},{"ref":"crates/printer/src/standard.rs:1176-1189","code":" 1176 |     fn write_prelude(\n 1177 |         &self,\n 1178 |         absolute_byte_offset: u64,\n 1179 |         line_number: Option<u64>,\n 1180 |         column: Option<u64>,\n 1181 |     ) -> io::Result<()> {\n 1182 |         let mut prelude = PreludeWriter::new(self);\n 1183 |         prelude.start(line_number, column)?;\n 1184 |         prelude.write_path()?;\n 1185 |         prelude.write_line_number(line_number)?;\n 1186 |         prelude.write_column_number(column)?;\n 1187 |         prelude.write_byte_offset(absolute_byte_offset)?;\n 1188 |         prelude.end()\n 1189 |     }","lines":14,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/crates/printer/src/standard.rs#L1176-L1189"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`Searcher::check_config` only guards against `heap_limit == Some(0)` when memory maps are entirely disabled (`!self.config.mmap.is_enabled()`), assuming that whenever mmap is 'enabled' as a strategy it will actually be used to avoid needing heap space. But `is_enabled()` only reflects whether the caller chose `MmapChoice::auto()`, not whether mmap will actually be attempted/succeed for a given call. `search_reader` and `search_slice` (when transcoding is needed) never attempt memory maps at all, and even `search_file`/`search_path` can fall back to the heap path if `MmapChoice::open` returns `None` (e.g., unconditionally on macOS per the `cfg!(target_os = \"macos\")` check in mmap.rs, or on any mmap failure). In all of these cases, a caller who set `heap_limit(Some(0))` together with `memory_map(MmapChoice::auto())` gets a confusing low-level `io::Error` (\"configured allocation limit (0) exceeded\") from the internal line buffer / multi-line buffer instead of the intended, descriptive `ConfigError::SearchUnavailable`. Verified experimentally: calling `search_reader` with `heap_limit(Some(0))` and `memory_map(unsafe { MmapChoice::auto() })` produces `Err(\"configured allocation limit (0) exceeded\")` rather than a `ConfigError`.","fix":"Make the `SearchUnavailable` check strategy-path-aware instead of just checking `mmap.is_enabled()`. For example, have `search_reader`/`search_slice` (which never use mmap) always reject `heap_limit == Some(0)` regardless of the mmap setting, and/or have `search_file_maybe_path` check for `SearchUnavailable` again after `self.config.mmap.open(..)` returns `None` before falling back to the heap-based readers, so the caller always gets `ConfigError::SearchUnavailable` instead of a generic allocation-limit IO error.","locations":[{"ref":"crates/searcher/src/searcher/mod.rs:805-821","code":"  805 |     fn check_config<M: Matcher>(&self, matcher: M) -> Result<(), ConfigError> {\n  806 |         if self.config.heap_limit == Some(0) && !self.config.mmap.is_enabled()\n  807 |         {\n  808 |             return Err(ConfigError::SearchUnavailable);\n  809 |         }\n  810 |         let matcher_line_term = match matcher.line_terminator() {\n  811 |             None => return Ok(()),\n  812 |             Some(line_term) => line_term,\n  813 |         };\n  814 |         if matcher_line_term != self.config.line_term {\n  815 |             return Err(ConfigError::MismatchedLineTerminators {\n  816 |                 matcher: matcher_line_term,\n  817 |                 searcher: self.config.line_term,\n  818 |             });\n  819 |         }\n  820 |         Ok(())\n  821 |     }","lines":17,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/crates/searcher/src/searcher/mod.rs#L805-L821"},{"ref":"crates/searcher/src/searcher/mmap.rs:73-79","code":"   73 |         if cfg!(target_os = \"macos\") {\n   74 |             // I guess memory maps on macOS aren't great.\n   75 |             //\n   76 |             // See: https://github.com/BurntSushi/ripgrep/issues/36\n   77 |             // See: https://github.com/BurntSushi/ripgrep/pull/3246\n   78 |             return None;\n   79 |         }","lines":7,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/crates/searcher/src/searcher/mmap.rs#L73-L79"},{"ref":"crates/searcher/src/searcher/mod.rs:995-997","code":"  995 |         if heap_limit == 0 {\n  996 |             return Err(S::Error::error_io(alloc_error(heap_limit)));\n  997 |         }","lines":3,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/crates/searcher/src/searcher/mod.rs#L995-L997"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`main.rs`'s `search()` (line 137) and `search_parallel()` (line 202) do `*stats += search_result.stats().unwrap()` whenever the local `stats: Option<grep::printer::Stats>` (derived from `HiArgs::stats()`) is `Some`. This silently assumes that whenever `HiArgs.stats` is `Some`, the configured printer was also built with per-search stats tracking enabled, so that `SearchResult::stats()` (populated from `sink.stats()`/`sink.stats().cloned()` in `search.rs`) is never `None`. That invariant is only maintained because `HiArgs::printer_standard`/`printer_summary` happen to call `.stats(self.stats.is_some())` (hiargs.rs:635, 664) -- a fact enforced purely by convention across two separate files with no type-level guarantee. If a future change to `printer_standard`/`printer_summary`/`printer_json` ever decouples the `stats` builder flag from `HiArgs.stats`, `main.rs` will panic on every search that requests `--stats`/`--json`.","fix":"Replace the `unwrap()` with an explicit fallback, e.g. `if let Some(s) = search_result.stats() { *stats += s.clone(); }`, or thread the invariant through the type system by having `SearchWorker`/`Printer` expose a `bool` (or a non-Option `Stats`) whenever stats tracking is known to be enabled, so the coupling between `HiArgs.stats` and the printer's `stats(..)` builder flag isn't purely convention-based.","locations":[{"ref":"crates/core/main.rs:142-144","code":"  142 |         if let Some(ref mut stats) = stats {\n  143 |             *stats += search_result.stats().unwrap();\n  144 |         }","lines":3,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/crates/core/main.rs#L142-L144"},{"ref":"crates/core/main.rs:206-209","code":"  206 |             if let Some(ref locked_stats) = *stats {\n  207 |                 let mut stats = locked_stats.lock().unwrap();\n  208 |                 *stats += search_result.stats().unwrap();\n  209 |             }","lines":4,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/crates/core/main.rs#L206-L209"},{"ref":"crates/core/flags/hiargs.rs:646","code":"  646 |             .stats(self.stats.is_some())","lines":1,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/crates/core/flags/hiargs.rs#L646"},{"ref":"crates/core/flags/hiargs.rs:675","code":"  675 |             .stats(self.stats.is_some())","lines":1,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/crates/core/flags/hiargs.rs#L675"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`SubMatch::serialize` calls `s.serialize_struct(\"SubMatch\", 3)`, declaring a fixed\nfield count of 3, but then conditionally serializes an extra `replacement` field\n(`state.serialize_field(\"replacement\", ...)`) whenever `self.replacement.is_some()`,\nso up to 4 fields are actually written before `state.end()`. `serde_json`'s\n`SerializeStruct` implementation happens to ignore the declared length, so this is\ncurrently harmless with the JSON backend this crate uses, but it violates the `serde`\n`Serializer::serialize_struct` contract (the `len` argument is documented as the\nnumber of fields that will be serialized) and would silently corrupt output or panic\nwith serializer backends that rely on the declared length, e.g. fixed-layout binary\nformats such as bincode or MessagePack in \"struct as array\" mode.","fix":"Compute the field count based on whether `replacement` is present:\n```rust\nlet len = if self.replacement.is_some() { 4 } else { 3 };\nlet mut state = s.serialize_struct(\"SubMatch\", len)?;\n```","locations":[{"ref":"crates/printer/src/jsont.rs:143-158","code":"  143 | impl<'a> serde::Serialize for SubMatch<'a> {\n  144 |     fn serialize<S: serde::Serializer>(\n  145 |         &self,\n  146 |         s: S,\n  147 |     ) -> Result<S::Ok, S::Error> {\n  148 |         use serde::ser::SerializeStruct;\n  149 | \n  150 |         let mut state = s.serialize_struct(\"SubMatch\", 3)?;\n  151 |         state.serialize_field(\"match\", &Data::from_bytes(self.m))?;\n  152 |         if let Some(r) = self.replacement {\n  153 |             state.serialize_field(\"replacement\", &Data::from_bytes(r))?;\n  154 |         }\n  155 |         state.serialize_field(\"start\", &self.start)?;\n  156 |         state.serialize_field(\"end\", &self.end)?;\n  157 |         state.end()\n  158 |     }","lines":16,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/crates/printer/src/jsont.rs#L143-L158"}]},
{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"negligible","difficulty":"very_easy","description":"`JSON::write_message` writes the trailing newline with `self.wtr.write(b\"\\n\")`\ninstead of `write_all`, relying on a comment (\"This will always be Ok(1) when\nsuccessful\") that isn't guaranteed by the `Write` trait. `write` is permitted to\nperform a short write (return `Ok(0)` or less than the full buffer) without that\nbeing an error, in which case the newline would silently be dropped from the output\neven though the function returns `Ok(())`. In practice this is very unlikely to\nhappen for the writers this crate is used with, but relying on undocumented behavior\nof a trait method whose contract explicitly allows partial writes is fragile.","fix":"Use `write_all`, which does guarantee the full buffer is written (or returns an\nerror), removing the need to rely on unstated assumptions:\n```rust\n// before\nlet _ = self.wtr.write(b\"\\n\")?; // This will always be Ok(1) when successful.\nOk(())\n```\n```rust\n// after\nself.wtr.write_all(b\"\\n\")?;\nOk(())\n```","locations":[{"ref":"crates/printer/src/json.rs:558","code":"  558 |         let _ = self.wtr.write(b\"\\n\")?; // This will always be Ok(1) when successful.","lines":1,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/crates/printer/src/json.rs#L558"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`StandardImpl::sink_slow_multi_per_match` (used for `per_match` output when the\nsearcher is in multi-line mode) iterates over `self.sunk.matches()` and, for every\nsingle match, creates a brand new `LineStep` starting from byte offset `0` of\n`self.sunk.bytes()` and walks forward line-by-line until it passes that match's\nstart. This makes the routine O(matches * lines) instead of O(lines): if a single\nmulti-line `SinkMatch` contains many matches spread across many lines (a realistic\nscenario for `--vimgrep`-style usage, which is what `per_match` exists for), the\nline-stepping work done for earlier matches is fully redone for every later match,\ngiving quadratic behavior in the number of matches/lines within one reported block.","fix":"Track the current line/byte position and `count` across the outer `for &m in\nself.sunk.matches()` loop (matches are documented to be sorted by start offset), so\nthe `LineStep` resumes from where the previous match's scan left off instead of\nrestarting at `0` each time. For example, hoist `count` and a starting byte offset\nout of the `for` loop and initialize `LineStep::new(line_term, resume_offset,\nbytes.len())` from the last position reached by the previous iteration.","locations":[{"ref":"crates/printer/src/standard.rs:1115-1170","code":" 1115 |     fn sink_slow_multi_per_match(&self) -> io::Result<()> {\n 1116 |         let line_term = self.searcher.line_terminator().as_byte();\n 1117 |         let spec = self.config().colors.matched();\n 1118 |         let bytes = self.sunk.bytes();\n 1119 |         for &m in self.sunk.matches() {\n 1120 |             let mut count = 0;\n 1121 |             let mut stepper = LineStep::new(line_term, 0, bytes.len());\n 1122 |             while let Some((start, end)) = stepper.next(bytes) {\n 1123 |                 let mut line = Match::new(start, end);\n 1124 |                 if line.start() >= m.end() {\n 1125 |                     break;\n 1126 |                 } else if line.end() <= m.start() {\n 1127 |                     count += 1;\n 1128 |                     continue;\n 1129 |                 }\n 1130 |                 self.write_prelude(\n 1131 |                     self.sunk.absolute_byte_offset() + line.start() as u64,\n 1132 |                     self.sunk.line_number().map(|n| n + count),\n 1133 |                     Some(m.start().saturating_sub(line.start()) as u64 + 1),\n 1134 |                 )?;\n 1135 |                 count += 1;\n 1136 |                 self.trim_line_terminator(bytes, &mut line);\n 1137 |                 self.trim_ascii_prefix(bytes, &mut line);\n 1138 |                 if self.exceeds_max_columns(&bytes[line]) {\n 1139 |                     self.write_exceeded_line(bytes, line, &[m], &mut 0)?;\n 1140 |                     continue;\n 1141 |                 }\n 1142 | \n 1143 |                 while !line.is_empty() {\n 1144 |                     if m.end() <= line.start() {\n 1145 |                         self.write(&bytes[line])?;\n 1146 |                         line = line.with_start(line.end());\n 1147 |                     } else if line.start() < m.start() {\n 1148 |                         let upto = cmp::min(line.end(), m.start());\n 1149 |                         self.write(&bytes[line.with_end(upto)])?;\n 1150 |                         line = line.with_start(upto);\n 1151 |                     } else {\n 1152 |                         let upto = cmp::min(line.end(), m.end());\n 1153 |                         self.write_spec(spec, &bytes[line.with_end(upto)])?;\n 1154 |                         line = line.with_start(upto);\n 1155 |                     }\n 1156 |                 }\n 1157 |                 self.write_line_term()?;\n 1158 |                 // It turns out that vimgrep really only wants one line per\n 1159 |                 // match, even when a match spans multiple lines. So when\n 1160 |                 // that option is enabled, we just quit after printing the\n 1161 |                 // first line.\n 1162 |                 //\n 1163 |                 // See: https://github.com/BurntSushi/ripgrep/issues/1866\n 1164 |                 if self.config().per_match_one_line {\n 1165 |                     break;\n 1166 |                 }\n 1167 |             }\n 1168 |         }\n 1169 |         Ok(())\n 1170 |     }","lines":56,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/crates/printer/src/standard.rs#L1115-L1170"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`Haystack::is_dir()` (haystack.rs:143-154) does an extra `self.dent.path_is_symlink() && self.dent.path().is_dir()` syscall-based check when the entry isn't already known to be a directory from its cached file type. In `HaystackBuilder::build()`, for an explicitly-provided (depth 0) path that turns out to be a symlink pointing at a directory, `is_dir()` is invoked once inside `is_explicit()` (haystack.rs:138) and, since `is_explicit()` returns `false` in that case, `is_dir()` is invoked again at haystack.rs:69 (`if !hay.is_dir()`). Each call re-does the same `path_is_symlink()`/`path().is_dir()` syscalls instead of reusing the previously computed result.","fix":"Compute `is_dir()` once in `build()` (or cache it, e.g. via `std::cell::Cell<Option<bool>>` on `Haystack`) and reuse the cached result in both the `is_explicit()` check and the later `!hay.is_dir()` check, instead of recomputing it from scratch each time.","locations":[{"ref":"crates/core/haystack.rs:49-79","code":"   49 |     fn build(&self, dent: ignore::DirEntry) -> Option<Haystack> {\n   50 |         let hay = Haystack { dent, strip_dot_prefix: self.strip_dot_prefix };\n   51 |         if let Some(err) = hay.dent.error() {\n   52 |             ignore_message!(\"{err}\");\n   53 |         }\n   54 |         // If this entry was explicitly provided by an end user, then we always\n   55 |         // want to search it.\n   56 |         if hay.is_explicit() {\n   57 |             return Some(hay);\n   58 |         }\n   59 |         // At this point, we only want to search something if it's explicitly a\n   60 |         // file. This omits symlinks. (If ripgrep was configured to follow\n   61 |         // symlinks, then they have already been followed by the directory\n   62 |         // traversal.)\n   63 |         if hay.is_file() {\n   64 |             return Some(hay);\n   65 |         }\n   66 |         // We got nothing. Emit a debug message, but only if this isn't a\n   67 |         // directory. Otherwise, emitting messages for directories is just\n   68 |         // noisy.\n   69 |         if !hay.is_dir() {\n   70 |             log::debug!(\n   71 |                 \"ignoring {}: failed to pass haystack filter: \\\n   72 |                  file type: {:?}, metadata: {:?}\",\n   73 |                 hay.dent.path().display(),\n   74 |                 hay.dent.file_type(),\n   75 |                 hay.dent.metadata()\n   76 |             );\n   77 |         }\n   78 |         None\n   79 |     }","lines":31,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/crates/core/haystack.rs#L49-L79"},{"ref":"crates/core/haystack.rs:131-139","code":"  131 |     pub(crate) fn is_explicit(&self) -> bool {\n  132 |         // stdin is obvious. When an entry has a depth of 0, that means it\n  133 |         // was explicitly provided to our directory iterator, which means it\n  134 |         // was in turn explicitly provided by the end user. The !is_dir check\n  135 |         // means that we want to search files even if their symlinks, again,\n  136 |         // because they were explicitly provided. (And we never want to try\n  137 |         // to search a directory.)\n  138 |         self.is_stdin() || (self.dent.depth() == 0 && !self.is_dir())\n  139 |     }","lines":9,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/crates/core/haystack.rs#L131-L139"},{"ref":"crates/core/haystack.rs:141-154","code":"  141 |     /// Returns true if and only if this haystack points to a directory after\n  142 |     /// following symbolic links.\n  143 |     fn is_dir(&self) -> bool {\n  144 |         let ft = match self.dent.file_type() {\n  145 |             None => return false,\n  146 |             Some(ft) => ft,\n  147 |         };\n  148 |         if ft.is_dir() {\n  149 |             return true;\n  150 |         }\n  151 |         // If this is a symlink, then we want to follow it to determine\n  152 |         // whether it's a directory or not.\n  153 |         self.dent.path_is_symlink() && self.dent.path().is_dir()\n  154 |     }","lines":14,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/crates/core/haystack.rs#L141-L154"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"The usage error message is built with `format!` even though it contains no interpolated arguments, allocating a `String` unnecessarily just to hand it to `From::from` for a one-shot error path.","fix":"Use a plain string literal instead of `format!`:\n```rust\n// before\nNone => {\n    return Err(From::from(format!(\"Usage: search-stdin <pattern>\")));\n}\n// after\nNone => {\n    return Err(From::from(\"Usage: search-stdin <pattern>\"));\n}\n```","locations":[{"ref":"crates/searcher/examples/search-stdin.rs:18-23","code":"   18 |     let pattern = match env::args().nth(1) {\n   19 |         Some(pattern) => pattern,\n   20 |         None => {\n   21 |             return Err(From::from(format!(\"Usage: search-stdin <pattern>\")));\n   22 |         }\n   23 |     };","lines":6,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/crates/searcher/examples/search-stdin.rs#L18-L23"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"The `TSeq` inner-literal helper type has an `#[allow(dead_code)]` attribute on its `impl` block that silences warnings for several methods that are never actually called anywhere in the crate: `TSeq::new` (generic constructor), `sort`, `is_exact`, and `max_literal_len`. Because the lint is blanket-suppressed for the whole impl block, any future genuinely dead method added here would also go unnoticed.","fix":"Remove the unused `new`, `sort`, `is_exact`, and `max_literal_len` methods (or the whole blanket `#[allow(dead_code)]`) and instead annotate only the specific methods that are intentionally kept for API symmetry, so the compiler can catch newly introduced dead code.","locations":[{"ref":"crates/regex/src/literal.rs:445-446","code":"  445 | #[allow(dead_code)]\n  446 | impl TSeq {","lines":2,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/crates/regex/src/literal.rs#L445-L446"},{"ref":"crates/regex/src/literal.rs:459-465","code":"  459 |     fn new<I, B>(it: I) -> TSeq\n  460 |     where\n  461 |         I: IntoIterator<Item = B>,\n  462 |         B: AsRef<[u8]>,\n  463 |     {\n  464 |         TSeq { seq: Seq::new(it), prefix: true }\n  465 |     }","lines":7,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/crates/regex/src/literal.rs#L459-L465"},{"ref":"crates/regex/src/literal.rs:496-498","code":"  496 |     fn sort(&mut self) {\n  497 |         self.seq.sort();\n  498 |     }","lines":3,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/crates/regex/src/literal.rs#L496-L498"},{"ref":"crates/regex/src/literal.rs:516-518","code":"  516 |     fn is_exact(&self) -> bool {\n  517 |         self.seq.is_exact()\n  518 |     }","lines":3,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/crates/regex/src/literal.rs#L516-L518"},{"ref":"crates/regex/src/literal.rs:537-539","code":"  537 |     fn max_literal_len(&self) -> Option<usize> {\n  538 |         self.seq.max_literal_len()\n  539 |     }","lines":3,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/crates/regex/src/literal.rs#L537-L539"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"Vimgrep and WithFilenameNo both explicitly override doc_choices() to return an empty slice, but the Flag trait's default implementation (in crates/core/flags/mod.rs) already returns `&[]`. These overrides are redundant no-ops that add noise without changing behavior.","fix":"Remove the redundant `fn doc_choices(&self) -> &'static [&'static str] { &[] }` overrides from the `Vimgrep` and `WithFilenameNo` impls and rely on the trait's default implementation, e.g.:\n```rust\n// before\nfn doc_choices(&self) -> &'static [&'static str] {\n    &[]\n}\n\n// after\n// (removed; trait default already returns &[])\n```","locations":[{"ref":"crates/core/flags/defs.rs:7758-7760","code":" 7758 |     fn doc_choices(&self) -> &'static [&'static str] {\n 7759 |         &[]\n 7760 |     }","lines":3,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/crates/core/flags/defs.rs#L7758-L7760"},{"ref":"crates/core/flags/defs.rs:7758-7760","code":" 7758 |     fn doc_choices(&self) -> &'static [&'static str] {\n 7759 |         &[]\n 7760 |     }","lines":3,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/crates/core/flags/defs.rs#L7758-L7760"}]},
{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"`generate_long_flag` in help.rs and `generate_flag` in man.rs both implement essentially identical logic for rendering `\\flag{name}` and `\\flag-negate{name}` markup: look up the flag via `crate::flags::parse::lookup`, `unreachable!()` with near-identical messages if the flag or its negation doesn't exist, and then format the short/long name. The only difference between the two copies is the surrounding roff escaping (`\\-`, `\\fB`/`\\fP`). Any future change to the lookup/error-message logic (e.g. improving the panic message, or handling aliases) has to be made in two places and will silently drift otherwise.","fix":"Factor the flag-lookup-and-panic logic out into a shared helper in `crates/core/flags/doc/mod.rs`, e.g. `fn resolve_flag_tag(name: &str) -> &'static dyn Flag` and `fn resolve_negated_flag_tag(name: &str) -> (&'static dyn Flag, &'static str)`, and have both `help.rs` and `man.rs` call it, passing only the output-formatting closure that differs between plain text and roff.","locations":[{"ref":"crates/core/flags/doc/help.rs:169-192","code":"  169 |     let doc = super::render_custom_markup(doc, \"flag\", |name, out| {\n  170 |         let Some(flag) = crate::flags::parse::lookup(name) else {\n  171 |             unreachable!(r\"found unrecognized \\flag{{{name}}} in --help docs\")\n  172 |         };\n  173 |         if let Some(name) = flag.name_short() {\n  174 |             write!(out, r\"-{}/\", char::from(name));\n  175 |         }\n  176 |         write!(out, r\"--{}\", flag.name_long());\n  177 |     });\n  178 |     let doc = super::render_custom_markup(&doc, \"flag-negate\", |name, out| {\n  179 |         let Some(flag) = crate::flags::parse::lookup(name) else {\n  180 |             unreachable!(\n  181 |                 r\"found unrecognized \\flag-negate{{{name}}} in --help docs\"\n  182 |             )\n  183 |         };\ {"id":"DUP_2","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"`Ignore::matched_ignore` contains two nearly identical loops that walk parent ignore matchers and populate `m_custom_ignore`, `m_ignore`, `m_gi`, and `m_gi_exclude` via `is_none()` checks: one over `self.parents().take_while(|ig| !ig.inner.is_absolute_parent)` and a second, structurally identical one over `self.parents().skip_while(|ig| !ig.inner.is_absolute_parent)` inside the `if self.inner.opts.parents` block. Any future fix or precedence change to this matching logic has to be made twice, and the two copies can silently drift apart.","fix":"Extract a helper that takes an `impl Iterator<Item = IgnoreRef<'_>>` (or a boxed dyn iterator) plus the mutable `Match` accumulators and `any_git`/`saw_git` state, and call it once for the `take_while` iterator and once for the `skip_while` iterator, instead of duplicating the four `if ...is_none() { ... }` blocks.","locations":[{"ref":"crates/ignore/src/dir.rs:563-594","code":"  563 |         for ig in self.parents().take_while(|ig| !ig.inner.is_absolute_parent)\n  564 |         {\n  565 |             if m_custom_ignore.is_none() {\n  566 |                 m_custom_ignore = ig\n  567 |                     .inner\n  568 |                     .custom_ignore_matcher\n  569 |                     .matched(path, is_dir)\n  570 |                     .map(IgnoreMatch::gitignore);\n  571 |             }\n  572 |             if m_ignore.is_none() {\n  573 |                 m_ignore = ig\n  574 |                     .inner\n  575 |                     .ignore_matcher\n  576 |                     .matched(path, is_dir)\n  577 |                     .map(IgnoreMatch::gitignore);\n  578 |             }\n  579 |             if any_git && !saw_git && m_gi.is_none() {\n  580 |                 m_gi = ig\n  581 |                     .inner\n  582 |                     .git_ignore_matcher\n  583 |                     .matched {"id":"DUP_3","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"easy","description":"In `DirEntryRaw::from_entry`, the error is wrapped in `Error::WithDepth` twice: once implicitly via the `.with_depth(depth)` call (which itself constructs `Error::WithDepth { depth, err: Box::new(self) }`), and again explicitly by the surrounding `Error::WithDepth { depth, err: Box::new(err) }`. The result is a redundant `WithDepth(WithPath(WithDepth(Io)))` chain instead of the intended `WithPath(WithDepth(Io))`. This doesn't change observable behavior (because `Error::depth()` and other accessor methods short-circuit at the first `WithDepth` they encounter), but it performs an unnecessary heap allocation and produces a confusing, needlessly-nested error representation. Compare with the very similar (and correctly non-duplicated) pattern in `Error::from_walkdir` in `crates/ignore/src/lib.rs`.","fix":"Drop the redundant `.with_depth(depth)` call before `.with_path(...)`, since the outer `Error::WithDepth { depth, .. }` already records the depth:\n```rust\nlet ty = ent.file_type().map_err(|err| {\n    let err = Error::Io(err).with_path(ent.path());\n    Error::WithDepth { depth, err: Box::new(err) }\n})?;\n```","locations":[{"ref":"crates/ignore/src/walk.rs:331-334","code":"  331 |         let ty = ent.file_type().map_err(|err| {\n  332 |             let err = Error::Io(err).with_depth(depth).with_path(ent.path());\n  333 |             Error::WithDepth { depth, err: Box::new(err) }\n  334 |         })?;","lines":4,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/crates/ignore/src/walk.rs#L331-L334"}]},
{"id":"DUP_4","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"`Replacer::replace_all` and `find_iter_at_in_context` in the same file both re-implement the identical 'strange dance' for handling multi-line look-ahead: compute `is_multi_line`, then either cap the buffer at `range.end + MAX_LOOK_AHEAD` (multi-line case) or call `trim_line_terminator` and truncate to `m.end()` (single-line case). The two copies have drifted slightly (one keeps the trimmed line terminator bytes, the other discards them), making it easy for a future bugfix to one of the copies to be missed in the other.","fix":"Extract a shared helper, e.g. `fn clamp_for_multiline<'b>(searcher: &Searcher, matcher: &impl Matcher, bytes: &'b [u8], range: &Range<usize>) -> (&'b [u8], &'b [u8])` returning the possibly-truncated haystack and the trimmed line terminator (empty slice for the multi-line case), and call it from both `replace_all` and `find_iter_at_in_context`.","locations":[{"ref":"crates/printer/src/util.rs:61-79","code":"   61 |         let is_multi_line = searcher.multi_line_with_matcher(&matcher);\n   62 |         // Get the line_terminator that was removed (if any) so we can add it\n   63 |         // back.\n   64 |         let line_terminator = if is_multi_line {\n   65 |             if haystack[range.end..].len() >= MAX_LOOK_AHEAD {\n   66 |                 haystack = &haystack[..range.end + MAX_LOOK_AHEAD];\n   67 |             }\n   68 |             &[]\n   69 |         } else {\n   70 |             // When searching a single line, we should remove the line\n   71 |             // terminator. Otherwise, it's possible for the regex (via\n   72 |             // look-around) to observe the line terminator and not match\n   73 |             // because of it.\n   74 |             let mut m = Match::new(0, range.end);\n   75 |             let line_terminator =\n   76 |                 trim_line_terminator(searcher, haystack, &mut m);\n   77 |             haystack = &haystack[..m.end()];\n   78 |             line_terminator\n   79 |         };","lines":19,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/crates/printer/src/util.rs#L61-L79"},{"ref":"crates/printer/src/util.rs:507-521","code":"  507 |     let is_multi_line = searcher.multi_line_with_matcher(&matcher);\n  508 |     if is_multi_line {\n  509 |         if bytes[range.end..].len() >= MAX_LOOK_AHEAD {\n  510 |             bytes = &bytes[..range.end + MAX_LOOK_AHEAD];\n  511 |         }\n  512 |     } else {\n  513 |         // When searching a single line, we should remove the line terminator.\n  514 |         // Otherwise, it's possible for the regex (via look-around) to observe\n  515 |         // the line terminator and not match because of it.\n  516 |         let mut m = Match::new(0, range.end);\n  517 |         // No need to remember the line terminator as we aren't doing a replace\n  518 |         // here.\n  519 |         trim_line_terminator(searcher, bytes, &mut m);\n  520 |         bytes = &bytes[..m.end()];\n  521 |     }","lines":15,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/crates/printer/src/util.rs#L507-L521"}]},
{"id":"DUP_5","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"`class_over_limit_unicode`/`class_over_limit_bytes` and `extract_class_unicode`/`extract_class_bytes` are each pairs of near-identical functions that differ only in the concrete `hir::Class{Unicode,Bytes}` type they operate on. The bodies (loop, `count`/`limit_class` comparison, `enforce_literal_len` call) are copy-pasted, so a future fix to the limit-checking logic (e.g., the same off-by-one style early-exit) would need to be applied twice and could easily be updated in only one place.","fix":"Factor the shared logic into a single generic helper (e.g. over an iterator of `(start, end)` ranges with a `len()` accessor) that both the Unicode and byte class variants call, eliminating the duplicated loops.","locations":[{"ref":"crates/regex/src/literal.rs:320-332","code":"  320 |     fn extract_class_unicode(&self, cls: &hir::ClassUnicode) -> TSeq {\n  321 |         if self.class_over_limit_unicode(cls) {\n  322 |             return TSeq::infinite();\n  323 |         }\n  324 |         let mut seq = TSeq::empty();\n  325 |         for r in cls.iter() {\n  326 |             for ch in r.start()..=r.end() {\n  327 |                 seq.push(Literal::from(ch));\n  328 |             }\n  329 |         }\n  330 |         self.enforce_literal_len(&mut seq);\n  331 |         seq\n  332 |     }","lines":13,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/crates/regex/src/literal.rs#L320-L332"},{"ref":"crates/regex/src/literal.rs:334-348","code":"  334 |     /// Convert the given byte class into a sequence of literals if the class\n  335 |     /// is small enough. If the class is too big, return an infinite sequence.\n  336 |     fn extract_class_bytes(&self, cls: &hir::ClassBytes) -> TSeq {\n  337 |         if self.class_over_limit_bytes(cls) {\n  338 |             return TSeq::infinite();\n  339 |         }\n  340 |         let mut seq = TSeq::empty();\n  341 |         for r in cls.iter() {\n  342 |             for b in r.start()..=r.end() {\n  343 |                 seq.push(Literal::from(b));\n  344 |             }\n  345 |         }\n  346 |         self.enforce_literal_len(&mut seq);\n  347 |         seq\n  348 |     }","lines":15,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/crates/regex/src/literal.rs#L334-L348"},{"ref":"crates/regex/src/literal.rs:352-361","code":"  352 |     fn class_over_limit_unicode(&self, cls: &hir::ClassUnicode) -> bool {\n  353 |         let mut count = 0;\n  354 |         for r in cls.iter() {\n  355 |             if count > self.limit_class {\n  356 |                 return true;\n  357 |             }\n  358 |             count += r.len();\n  359 |         }\n  360 |         count > self.limit_class\n  361 |     }","lines":10,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/crates/regex/src/literal.rs#L352-L361"},{"ref":"crates/regex/src/literal.rs:363-374","code":"  363 |     /// Returns true if the given byte class exceeds the configured limits on\n  364 |     /// this extractor.\n  365 |     fn class_over_limit_bytes(&self, cls: &hir::ClassBytes) -> bool {\n  366 |         let mut count = 0;\n  367 |         for r in cls.iter() {\n  368 |             if count > self.limit_class {\n  369 |                 return true;\n  370 |             }\n  371 |             count += r.len();\n  372 |         }\n  373 |         count > self.limit_class\n  374 |     }","lines":12,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/crates/regex/src/literal.rs#L363-L374"}]},
{"id":"OTHER_1","type":"other","type_label":"Other","severity":"low","difficulty":"very_easy","description":"The doc_long() roff text for --null-data has a typo: `\\fP\\\\n\\fP` opens with the \"return to previous font\" macro (`\\fP`) instead of the bold macro (`\\fB`). Every other instance in this same doc string (and the rest of the file) correctly uses `\\fB\\\\n\\fP` to render `\\n` in bold. Because there's no preceding `\\fB`/`\\fI` to close, `\\fP` here is a no-op, so `\\n` renders in the default font instead of bold in the generated man page / help text, inconsistent with the surrounding documentation.","fix":"Change the line `of the default of \\fP\\\\n\\fP.` to `of the default of \\fB\\\\n\\fP.` so the bold macro is opened correctly, matching the identical phrase used two lines below (`if \\fB\\\\n\\fP were used as the line terminator`).","locations":[{"ref":"crates/core/flags/defs.rs:5404-5420","code":" 5404 |     fn doc_long(&self) -> &'static str {\n 5405 |         r\"\n 5406 | Enabling this flag causes ripgrep to use \\fBNUL\\fP as a line terminator instead\n 5407 | of the default of \\fP\\\\n\\fP.\n 5408 | .sp\n 5409 | This is useful when searching large binary files that would otherwise have\n 5410 | very long lines if \\fB\\\\n\\fP were used as the line terminator. In particular,\n 5411 | ripgrep requires that, at a minimum, each line must fit into memory. Using\n 5412 | \\fBNUL\\fP instead can be a useful stopgap to keep memory requirements low and\n 5413 | avoid OOM (out of memory) conditions.\n 5414 | .sp\n 5415 | This is also useful for processing NUL delimited data, such as that emitted\n 5416 | when using ripgrep's \\flag{null} flag or \\fBfind\\fP's \\fB\\-\\-print0\\fP flag.\n 5417 | .sp\n 5418 | Using this flag implies \\flag{text}. It also overrides \\flag{crlf}.\n 5419 | \"\n 5420 |     }","lines":17,"link":"https://github.com/BurntSushi/ripgrep/blob/3fce3b5bb0236da2df6d99672afb8a719642eca7/crates/core/flags/defs.rs#L5404-L5420"}]}
