<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

<script type="application/json" id="D">[{"id":"UAF_1","type":"use_after_free","type_label":"Use After Free","severity":"critical","difficulty":"hard","description":"`WasmWebPool::scoped_computation_impl` (`src/pool/pool_impl/wasm_web.rs:360-399`) stores the address of its stack-local `scope_runtime` into the single global `runtime().shared.state.active_scope_addr`, and worker threads recover this pointer purely from that shared global slot when they pop a `Task` in `worker_loop` (`state.active_scope_addr.expect(\"active scope must be set while queue is non-empty\")`, lines 217-221). Unlike `BasicPool`'s `Task` (`src/pool/pool_impl/basic.rs`), which carries its own `runtime: Arc<ScopeRuntime>` per task, `wasm_web.rs`'s `Task` (lines 161-165) carries no runtime reference at all - it is entirely dependent on whichever `ScopeRuntime` happens to be the *current* global `active_scope_addr` at the moment the task is popped. Because `runtime()` always returns the same process-wide `WASM_WEB3_RUNTIME` singleton regardless of which `WasmWebPool` value invoked it, and `ParThreadPool::scoped_computation` only requires `&mut self` (not `&mut` of some shared handle), two independent `WasmWebPool` instances used concurrently (e.g. from two different threads, or a reentrant/nested parallel call) can call `scoped_computation` at the same time. The invariant that only one scope may be active is enforced solely by `debug_assert!(state.active_scope_addr.is_none())` (line 370), which is compiled out in release builds. If violated, a task queued for scope A that is still pending when scope B becomes active will have its completion mis-attributed to scope B's `ScopeRuntime` (corrupting B's pending count and potentially letting B's `wait_for_completion` return before B's own real tasks finish, i.e. a use-after-free of data B's closures borrowed), while scope A's own `pending` counter for that task is never decremented, hanging scope A's `wait_for_completion` forever.","fix":"Give the wasm `Task` its own scope reference the way `basic.rs` does (e.g. an `Arc<ScopeRuntime>` or a raw pointer captured per-task rather than looked up from a shared mutable slot), so a task always completes against the runtime it was actually submitted for. Additionally, replace the `debug_assert!` guarding `active_scope_addr` with a real runtime check (e.g. an atomic compare-exchange \"in use\" flag) that returns an error or panics on reentrant/overlapping use instead of silently overwriting the pointer in release builds.","locations":[{"ref":"src/pool/pool_impl/wasm_web.rs:143-165","code":"  143 | pub struct ScopeRef<'env> {\n  144 |     shared: *const WorkerShared,\n  145 |     runtime: *const ScopeRuntime,\n  146 |     inline_only: bool,\n  147 |     _marker: PhantomData<&'env ()>,\n  148 | }\n  149 | \n  150 | impl<'env> ScopeRef<'env> {\n  151 |     fn shared(&self) -> &WorkerShared {\n  152 |         unsafe { &*self.shared }\n  153 |     }\n  154 | \n  155 |     fn runtime(&self) -> &ScopeRuntime {\n  156 |         unsafe { &*self.runtime }\n  157 |     }\n  158 | }\n  159 | \n  160 | #[cfg_attr(not(target_feature = \"atomics\"), allow(dead_code))]\n  161 | struct Task {\n  162 |     data: *mut (),\n  163 |     run_fn: unsafe fn(*mut ()),\n  164 |     drop_fn: unsafe fn(*mut ()),\n  165 | }","lines":23,"link":"https://github.com/orxfun/orx-parallel/blob/b9214fbeb714e4bb8f8858676a818cef2f21b097/src/pool/pool_impl/wasm_web.rs#L143-L165"},{"ref":"src/pool/pool_impl/wasm_web.rs:208-235","code":"  208 | fn worker_loop(shared: Arc<WorkerShared>) {\n  209 |     loop {\n  210 |         let (task, runtime_ptr) = {\n  211 |             let mut state = shared.state.lock().expect(\"poisoned pool lock\");\n  212 |             loop {\n  213 |                 if state.shutdown {\n  214 |                     return;\n  215 |                 }\n  216 | \n  217 |                 if let Some(task) = state.queue.pop_front() {\n  218 |                     let runtime_ptr = state\n  219 | part of unwinding or later normal use), Rust will run `T`'s destructor once per slot in `orig_ptr`, which can now double-drop a value whose duplicate byte pattern appears at two live-looking slots (double free / UB) while silently leaking another value that was overwritten early and never reached `orig_ptr` at all. The standard library's own merge sort avoids exactly this class of bug via drop guards (e.g. `MergeHole`); this implementation has none.","fix":"Add panic-safety to the merge: either wrap the destination writes in a drop guard that tracks how far the merge has progressed and, on unwind, forgets/patches up the `aux`/`orig` buffers to avoid double drops (mirroring `alloc::slice::merge`'s `MergeHole` pattern), or require `T: Ord` comparisons to be assumed panic-free only after wrapping calls to `<`/`<=` with `catch_unwind`-based abort-on-panic semantics so a partial state can never be observed. At minimum, document that `par_experimental_sort` is unsound for panicking `Ord` implementations, since it is gated behind the `experimental` feature.","locations":[{"ref":"src/sort/sort_slice.rs:50-121","code":"   50 | impl<T: Ord> MergeSubTask<T> {\n   51 |     #[inline]\n   52 |     fn execute(self) {\n   53 |         if self.len_a == 0 {\n   54 |             if self.len_b > 0 {\n   55 |                 unsafe {\n   56 |                     core::ptr::copy_nonoverlapping(self.src_b, self.dst, self.len_b);\n   57 |                 }\n   58 |             }\n   59 |             return;\n   60 |         }\n   61 |         if self.len_b == 0 {\n   62 |             unsafe {\n   63 |                 core::ptr::copy_nonoverlapping(self.src_a, self.dst, self.len_a);\n   64 |             }\n   65 |             return;\n   66 |         }\n   67 | \n   68 |         // Fast-path: if all elements of A <= all elements of B\n   69 |         let last_a = unsafe { &*self.src_a.add(self.len_a - 1) };\n   70 |         let first_b = unsafe { &*self.src_b };\n   71 |         if last_a < rt;\n  291 |             copy_tasks.push(CopyChunkTask {\n  292 |                 src: unsafe { aux_ptr.add(start) },\n  293 |                 dst: unsafe { orig_ptr.add(start) },\n  294 |                 len,\n  295 |             });\n  296 |         }\n  297 | \n  298 |         let par = copy_tasks.into_par().runner(&mut *runner);\n  299 |         let par = params.apply(par);\n  300 |         par.for_each(|task| task.execute());\n  301 |     }\n  302 | }","lines":148,"link":"https://github.com/orxfun/orx-parallel/blob/b9214fbeb714e4bb8f8858676a818cef2f21b097/src/sort/sort_slice.rs#L155-L302"}]},{"id":"UAF_3","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"easy","description":"`unsafe impl<U, V> Send for PairPtr<U, V> {}` in `src/use_var/pair_ptr.rs` grants `Send` for `PairPtr<U, V>` regardless of whether `U`/`V` are `Send`. `PairPtr` is built in `UseFold::init_get` (`src/use_var/use_fold.rs`) from a pointer into `U::Item` storage and a pointer into `T` storage, and is then handed to worker-thread closures (`&mut PairPtr<Self::Use, B>` in the `fold` combinator, `src/infallible_use/par.rs`) which dereference it via `PairPtr::u_v_mut`. Since the `Use` trait (`src/use_var/use.rs`) does not require `type Item: Send`, and `UseFold`'s own generic bounds only require `U: Use` (not `U::Item: Send`), a `Use` implementation whose `Item` is `!Send` can have its per-thread values silently transferred to other worker threads through this unconstrained `Send` impl.","fix":"Bound the unsafe impl on `U: Send, V: Send`: `unsafe impl<U: Send, V: Send> Send for PairPtr<U, V> {}`. Consider also adding `type Item: Send` to the `Use` trait in `src/use_var/use.rs` so this constraint is enforced crate-wide at the trait level rather than only at individual unsafe-impl call sites.","locations":[{"ref":"src/use_var/pair_ptr.rs:1-7","code":"    1 | pub struct PairPtr<U, V> {\n    2 |     u: *mut U,\n    3 |     v: *mut V,\n    4 | }\n    5 | \n    6 | unsafe impl<U, V> Send for PairPtr<U, V> {}\n    7 | ","lines":7,"link":"https://github.com/orxfun/orx-parallel/blob/b9214fbeb714e4bb8f8858676a818cef2f21b097/src/use_var/pair_ptr.rs#L1-L7"}]},{"id":"UAF_4","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"easy","description":"`unsafe impl<'a, T: 'a> Sync for UseSlice<'a, T> {}` in `src/use_var/use_slice.rs` grants `Sync` for `UseSlice<'a, T>` for *any* `T`, without requiring `T: Send`. `UseSlice` is `Sync` specifically so that a shared `&UseSlice` can be handed to multiple worker threads, each of which then calls `init_get`/`get` to obtain an exclusive `&mut T` into a distinct slice element that it will read, write, and (via the underlying slice) eventually drop on that thread. That is precisely the pattern that requires `T: Send` (transferring ownership/exclusive access of a `T` value to a different thread than the one that created it), not `T: Sync`. Confirming this is reachable: the public entry point `Par::use_slice` in `src/infallible/par.rs` (and the mirrored `option`/`result` variants) only bounds `U: Sync + 'a`, not `U: Send`, so a caller can pass a `Sync + !Send` slice (e.g. a slice of a type deliberately opted out of `Send`) straight through to worker threads. Compare with `src/use_var/use_vec.rs`, where `UseVec<T: Send, F>` correctly bounds its item type on `Send`.","fix":"Bound the unsafe impl (and ideally the struct itself) on `T: Send`: `unsafe impl<'a, T: 'a + Send> Sync for UseSlice<'a, T> {}`, and add the same `T: Send` bound to the `UseSlice` struct/impl block, matching the pattern already used by `UseVec<T: Send, F>`. Also tighten `Par::use_slice`'s `U: Sync` bound to `U: Send + Sync` (or `U: Send` only, if `Sync` isn't actually needed) in `src/infallible/par.rs`, `src/option/par.rs`, and `src/result/par.rs`.","locations":[{"ref":"src/use_var/use_slice.rs:8-24","code":"    8 | pub struct UseSlice<'a, T: 'a> {\n    9 |     ptr: *mut T,\n   10 |     len: usize,\n   11 |     p: PhantomData<fn() -> &'a ()>,\n   12 | }\n   13 | \n   14 | impl<'a, T: 'a> UseSlice<'a, T> {\n   15 |     pub fn new(slice: &'a mut [T]) -> Self {\n   16 |         let ptr = slice.as_mut_ptr();\n   17 |         let len = slice.len();\n   18 |         let p = PhantomData;\n   19 |         Self { ptr, len, p }\n   20 |     }\n   21 | }\n   22 | \n   23 | unsafe impl<'a, T: 'a> Sync for UseSlice<'a, T> {}\n   24 | ","lines":17,"link":"https://github.com/orxfun/orx-parallel/blob/b9214fbeb714e4bb8f8858676a818cef2f21b097/src/use_var/use_slice.rs#L8-L24"}]},{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"hard","description":"`Elem::normalize_depths` in `src/infallible/recursive/execution/elem.rs` computes `elem.depth = elem.depth * depth_coef + elem.width` where `depth_coef = max_width + 1` is recomputed independently at every tree level, to build a single `usize` sort key encoding breadth-first order for `par_recursive(...).collect()`/`.first()`/`.find()` under the default `IterationOrder::Ordered`. This is called once per level in `src/infallible/recursive/execution/collect.rs` (lines 65 and 85) and `src/infallible/recursive/execution/next.rs` (lines 52 and 74), on every wave of the recursion. Because each level multiplies the running `depth` by that level's branching factor, the accumulated key can overflow `usize` after only a handful of levels for moderately wide trees (e.g. branching factor 1000 overflows within about 6-7 levels) or after 64 levels for a plain binary tree. In a debug build this triggers a `panic` (`attempt to multiply with overflow` / `attempt to add with overflow`); in a release build (default `overflow-checks = false`) it silently wraps, corrupting the sort key used both to order the next generation's `inputs` (via `sort_unstable_by_key` in `next.rs`) and to order the final `result.sort()` in `collect.rs` (since `input.depth` after a wrapped `normalize_depths` is copied directly into an output `Elem`'s `width` field). The practical effect is that `par_recursive` with default `Ordered` iteration order can silently return elements in the wrong order (or panic in debug) for sufficiently deep or wide recursive inputs, e.g. a recursive filesystem walk or a wide multi-way tree.","fix":"Replace the single-`usize` collapsing scheme with a scheme that cannot silently overflow, e.g. store the full per-level path (a small `Vec<usize>` or `SmallVec<[usize; N]>` of `width` values, one per level) on each `Elem` and implement `Ord`/`PartialOrd` as lexicographic comparison over that path instead of folding it into one integer. If the single-integer encoding must be kept for performance, at minimum use `checked_mul`/`checked_add` (or `saturating_*`) and document/enforce a maximum supported depth * branching-factor product so the failure mode is an explicit, documented error rather than silent corruption or an unexplained panic.","locations":[{"ref":"src/infallible/recursive/execution/elem.rs:18-25","code":"   18 |     pub fn normalize_depths(elements: &mut [Self]) {\n   19 |         if let Some(max_width) = elements.iter().map(|x| x.width).max() {\n   20 |             let depth_coef = max_width + 1;\n   21 |             for elem in elements {\n   22 |                 elem.depth = elem.depth * depth_coef + elem.width;\n   23 |             }\n   24 |         }\n   25 |     }","lines":8,"link":"https://github.com/orxfun/orx-parallel/blob/b9214fbeb714e4bb8f8858676a818cef2f21b097/src/infallible/recursive/execution/elem.rs#L18-L25"},{"ref":"src/infallible/recursive/execution/collect.rs:64-66","code":"   64 |     utils::into_outer_par(&mut inputs, &mut data, |x| &mut x.input, &mut runner);\n   65 |     Elem::normalize_depths(&mut inputs);\n   66 |     utils::into_outer_par(&mut result, &mut data, |x| &mut x.output, &mut runner);","lines":3,"link":"https://github.com/orxfun/orx-parallel/blob/b9214fbeb714e4bb8f8858676a818cef2f21b097/src/infallible/recursive/execution/collect.rs#L64-L66"},{"ref":"src/infallible/recursive/execution/collect.rs:84-86","code":"   84 |         utils::into_outer_par(&mut inputs, &mut data, |x| &mut x.input, &mut runner);\n   85 |         Elem::normalize_depths(&mut inputs);\n   86 |         utils::into_outer_par(&mut result, &mut data, |x| &mut x.output, &mut runner);","lines":3,"link":"https://github.com/orxfun/orx-parallel/blob/b9214fbeb714e4bb8f8858676a818cef2f21b097/src/infallible/recursive/execution/collect.rs#L84-L86"},{"ref":"src/infallible/recursive/execution/next.rs:51-53","code":"   51 |             utils::into_outer_par(&mut inputs, &mut data, |x| x, &mut runner);\n   52 |             Elem::normalize_depths(&mut inputs);\n   53 |             inputs.sort_unstable_by_key(|x| x.depth);","lines":3,"link":"https://github.com/orxfun/orx-parallel/blob/b9214fbeb714e4bb8f8858676a818cef2f21b097/src/infallible/recursive/execution/next.rs#L51-L53"},{"ref":"src/infallible/recursive/execution/next.rs:73-75","code":"   73 |                 utils::into_outer_par(&mut inputs, &mut data, |x| x, &mut runner);\n   74 |                 Elem::normalize_depths(&mut inputs);\n   75 |                 inputs.sort_unstable_by_key(|x| x.depth);","lines":3,"link":"https://github.com/orxfun/orx-parallel/blob/b9214fbeb714e4bb8f8858676a818cef2f21b097/src/infallible/recursive/execution/next.rs#L73-L75"}]},{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"In `State::record_chunk` (`src/runner/runner_variants/adaptive_chunk/state.rs:90-99`), convergence stability is computed as `let threshold = prev_avg / CONVERGENCE_STABILITY_DIVISOR; let stable = change < threshold;`. Since `CONVERGENCE_STABILITY_DIVISOR = 50` and this is integer division, whenever `prev_avg < 50` (i.e. per-item cost under 50ns, a common case for cheap workloads), `threshold` truncates to `0`, and `change < 0` can never be true for an unsigned `change`. Convergence-based early stopping (`converged_samples`) therefore can never fire for workloads with sub-50ns average per-item cost, silently disabling that optimization path and forcing exploration to fall back only on the `elapsed_ms >= EXPLORATION_MIN_MS` / tiny-work / min-samples checks.","fix":"Avoid truncating the threshold before comparing; compare using multiplication instead of division, e.g. `let stable = change.saturating_mul(CONVERGENCE_STABILITY_DIVISOR) < prev_avg;` so small `prev_avg` values still produce a meaningful (sub-unit) threshold.","locations":[{"ref":"src/runner/runner_variants/adaptive_chunk/state.rs:90-99","code":"   90 |         let prev_avg = self.prev_avg_ns_per_item.load(Ordering::Relaxed);\n   91 |         if prev_avg > 0 {\n   92 |             let change = updated_avg.abs_diff(prev_avg);\n   93 |             let threshold = prev_avg / CONVERGENCE_STABILITY_DIVISOR;\n   94 |             let stable = change < threshold;\n   95 |             match stable {\n   96 |                 true => _ = self.converged_samples.fetch_add(1, Ordering::Relaxed),\n   97 |                 false => self.converged_samples.store(0, Ordering::Relaxed), // reset\n   98 |             }\n   99 |         }","lines":10,"link":"https://github.com/orxfun/orx-parallel/blob/b9214fbeb714e4bb8f8858676a818cef2f21b097/src/runner/runner_variants/adaptive_chunk/state.rs#L90-L99"}]},{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"In `State::should_stop_exploration` (`src/runner/runner_variants/adaptive_chunk/state.rs:104-122`), `total * EXPLORATION_CAP_PCT` and `total * EXPLORATION_TARGET_PCT` are plain (non-saturating, non-checked) multiplications on `total: usize` taken from `self.initial_len`, whereas the sibling computation `explored.saturating_mul(100)` on the same line deliberately uses `saturating_mul`. For an astronomically large exact input length (`total > usize::MAX / 10`), this multiplication would overflow (panicking in debug builds, wrapping in release), unlike the `explored_x100` computation right next to it.","fix":"Use `total.saturating_mul(EXPLORATION_CAP_PCT)` / `total.saturating_mul(EXPLORATION_TARGET_PCT)` for consistency with the neighboring `explored.saturating_mul(100)`.","locations":[{"ref":"src/runner/runner_variants/adaptive_chunk/state.rs:104-122","code":"  104 |     pub(super) fn should_stop_exploration(&self) -> bool {\n  105 |         let explored = self.explored_tasks.load(Ordering::Relaxed);\n  106 |         let explored_x100 = explored.saturating_mul(100);\n  107 |         let fraction_capped = match self.initial_len {\n  108 |             Some(total) if total > 0 => explored_x100 >= total * EXPLORATION_CAP_PCT,\n  109 |             _ => false,\n  110 |         };\n  111 |         if fraction_capped {\n  112 |             return true;\n  113 |         }\n  114 | \n  115 |         if explored < self.min_samples {\n  116 |             return false;\n  117 |         }\n  118 | \n  119 |         let fraction_reached = match self.initial_len {\n  120 |             Some(total) if total > 0 => explored_x100 >= total * EXPLORATION_TARGET_PCT,\n  121 |             _ => false,\n  122 |         };","lines":19,"link":"https://github.com/orxfun/orx-parallel/blob/b9214fbeb714e4bb8f8858676a818cef2f21b097/src/runner/runner_variants/adaptive_chunk/state.rs#L104-L122"}]},{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In `src/infallible/par_runner.rs`, the `experimental`-feature-gated `collect_arb_over_bag` method calls `self.nt_state(params, &iter, iter.size_hint(), None)`, passing `&iter` (type `&I`) where `nt_state` (defined in `src/runner/par_runner.rs`) expects a `bool` for its `is_source_serialized` parameter. Every other caller of `nt_state` in the same file (`next`, `next_any`, `reduce`, `collect`, `collect_arb`) correctly passes `I::is_source_serialized()`. This is a genuine compile error, verified with `cargo check --features experimental --lib`, which fails with `error[E0308]: mismatched types ... expected bool, found &I`. This means the crate does not build at all with the `experimental` feature enabled.","fix":"Replace `&iter` with `I::is_source_serialized()` to match the other call sites:\n```rust\nlet (_, state) = self.nt_state(params, I::is_source_serialized(), iter.size_hint(), None);\n```","locations":[{"ref":"src/infallible/par_runner.rs:216","code":"  216 |         let (_, state) = self.nt_state(params, &iter, iter.size_hint(), None);","lines":1,"link":"https://github.com/orxfun/orx-parallel/blob/b9214fbeb714e4bb8f8858676a818cef2f21b097/src/infallible/par_runner.rs#L216"}]},{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In the adaptive-chunk runner, `AdaptiveChunkRunner::complete_chunk` (`src/runner/runner_variants/adaptive_chunk/adaptive_chunk_runner.rs`) unconditionally calls `state.record_chunk(chunk_state)` whenever `state.mode() == Mode::Explore`, but the callers (e.g. `src/result_use/thread_execution/next.rs`, `collect.rs`, `next_any.rs`, `reduce.rs`, `collect_arb.rs`, and `src/result/thread_execution/next_any.rs`/`reduce.rs`) call `Q::complete_chunk(state, chunk_state)` unconditionally after every loop iteration, including the `None => {}` branch where `iter.next_by`/`chunk_puller.pull()` returned no item at all (a transient empty pull while `iter.is_completed_when_none_returned()` is false, i.e. a busy-retry noted by the `// TODO: a good back-off strategy` comment). In that case `record_chunk` still records a sample with `items = chunk_state.requested_chunk_size.max(1)` divided into a near-zero `elapsed_ns`, injecting spurious near-zero-cost samples into `avg_ns_per_item`/`avg_abs_deviation_ns_per_item` via `EWMA_PARAMS_AVG.ewma(...)`. Under contention (many threads racing on the same `ConcurrentIter`), this systematically biases the EWMA average r","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `src/pool/pool_impl/wasm_web_start_workers.js`, the worker-bootstrap handler posts `{ type: \"orx_parallel_worker_ready\" }` (line 15) *before* checking `typeof pkg.wasm_web_start_worker !== \"function\"` (lines 16-18) and before actually invoking `pkg.wasm_web_start_worker()` (line 19). If the wasm binary was built without the `atomics` target-feature, `wasm_web_start_worker` is not exported (it is `#[cfg(target_feature = \"atomics\")]`-gated in `src/pool/pool_impl/wasm_web.rs`), so the worker still announces `\"orx_parallel_worker_ready\"` first and only afterwards throws and posts `\"orx_parallel_worker_error\"`. Since `startWorkers()`'s `Promise.race([onWorkerReady, onWorkerInitError, onWorkerError, onWorkerTimeout])` already resolves via the premature ready message, the subsequent (and correct) error message arrives too late to be observed - the caller believes the worker initialized successfully when it never entered its work loop.","fix":"Move the readiness check/call before signalling readiness:\n```js\n// before\nawait pkg.default(init);\npostMessage({ type: \"orx_parallel_worker_ready\" });\nif (typeof pkg.wasm_web_start_worker !== \"function\") {\n    throw new Error(\"wasm worker entrypoint is missing: expected wasm_web_start_worker\");\n}\npkg.wasm_web_start_worker();\n\n// after\nawait pkg.default(init);\nif (typeof pkg.wasm_web_start_worker !== \"function\") {\n    throw new Error(\"wasm worker entrypoint is missing: expected wasm_web_start_worker\");\n}\npostMessage({ type: \"orx_parallel_worker_ready\" });\npkg.wasm_web_start_worker();\n```","locations":[{"ref":"src/pool/pool_impl/wasm_web_start_workers.js:11-24","code":"   11 | waitForMsgType(self, \"orx_parallel_worker_init\").then(async ({ init }) => {\n   12 |     try {\n   13 |         const pkg = await import(\"../../../../..\");\n   14 |         await pkg.default(init);\n   15 |         postMessage({ `type Size = X::Size;`). This means `.enumerate()` on a `ParUse` pipeline entered via `use_new`/`use_vec`/`use_slice` is unnecessarily blocked whenever the pipeline's underlying `Xap1`/`Xap2` has `Size = Bin` or `Size = Many` - even in cases where that xap is built purely from `BinM`/`ManyM` (map-only) steps that themselves do implement `XapEnumByInput`. The `Size = One` constraint on `IdUse`'s impl serves no purpose since `IdUse` is a transparent identity wrapper and doesn't care about the wrapped xap's cardinality.","fix":"Relax the bound to `impl<X: XapEnumByInput, U> XapUseEnumByInput for IdUse<X, U>` (dropping `<Size = One>`), matching the unconstrained `Size = X::Size` used by `IdUse`'s `XapUse` impl.","locations":[{"ref":"src/infallible_use/xap_variants/id.rs:45-52","code":"   45 | impl<X: XapEnumByInput<Size = One>, U> XapUseEnumByInput for IdUse<X, U> {\n   46 |     type Enumerated = IdUse<X::Enumerated, U>;\n   47 | \n   48 |     fn enumerate(self) -> Self::Enumerated {\n   49 |         let x = self.x.enumerate();\n   50 |         IdUse::new(x)\n   51 |     }\n   52 | }","lines":8,"link":"https://github.com/orxfun/orx-parallel/blob/b9214fbeb714e4bb8f8858676a818cef2f21b097/src/infallible_use/xap_variants/id.rs#L45-L52"}]},{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `src/result_use/thread_execution/reduce.rs:112-126`, only the last of four structurally-identical accumulation blocks introduces a pointless alias `let u2 = u;` (line 117) and then dereferences `u2` instead of `u` (`f(unsafe { &mut *u2 }, acc, a)`), while the three earlier blocks in the same function correctly use `f(unsafe { &mut *u }, ...)` directly. Since `u: *mut U` is `Copy`, `u2` is not needed for aliasing/borrow-checker reasons and is leftover copy-paste noise.","fix":"```rust\nSome(chunk) => {\n    for a in chunk.flat_map(|i| S::xap_use_res(u, x1, x2, i)) {\n        acc = match a {\n            Ok(a) => f(unsafe { &mut *u }, acc, a),\n            Err(e) => {\n                Q::broadcast_stop(iter, state, chunk_state);\n                return Err(e);\n            }\n        };\n    }\n}\n```","locations":[{"ref":"src/result_use/thread_execution/reduce.rs:112-126","code":"  112 |                     c => {\n  113 |                         chunk_puller.resize_for_chunk_size(c);\n  114 | \n  115 |                         match chunk_puller.pull() {\n  116 |                             Some(chunk) => {\n  117 |                                 let u2 = u;\n  118 |                                 for a in chunk.flat_map(|i| S::xap_use_res(u, x1, x2, i)) {\n  119 |                                     acc = match a {\n  120 |                                         Ok(a) => f(unsafe { &mut *u2 }, acc, a),\n  121 |                                         Err(e) => {\n  122 |                                             Q::broadcast_stop(iter, state, chunk_state);\n  123 |                                             return Err(e);\n  124 |                                         }\n  125 |                                     };\n  126 |                                 }","lines":15,"link":"https://github.com/orxfun/orx-parallel/blob/b9214fbeb714e4bb8f8858676a818cef2f21b097/src/result_use/thread_execution/reduce.rs#L112-L126"}]},{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"high","difficulty":"hard","description":"On `target_arch = \"wasm32\"`, `ScopeRuntime::wait_for_completion` (`src/pool/pool_impl/wasm_web.rs:108-114`) busy-spins with `while self.pending.load(Ordering::Acquire) != 0 { core::hint::spin_loop(); }` instead of blocking on the `completion_cv`/`completion_lock` pair used on other targets. This function runs on whichever thread called `scoped_computation` - typically the browser's main/UI thread issuing the parallel computation. A tight spin loop there pins that thread at 100% CPU for the entire duration of every parallel computation and prevents it from servicing any other JS/event-loop work (messages, timers, rendering) until all worker tasks finish, effectively freezing the page for the length of the computation - the opposite of what an off-main-thread worker pool is meant to achieve.","fix":"Avoid unconditional busy-spinning on the calling thread: e.g. yield periodically (exponential backoff), only allow `scoped_computation` to be called from within a worker context so the main thread is never blocked, or use a bounded `Atomics.wait`/`Atomics.waitAsync`-based scheme (with a small time budget) so the calling thread can make forward progress on its event loop between checks.","locations":[{"ref":"src/pool/pool_impl/wasm_web.rs:108-114","code":"  108 |     fn wait_for_completion(&self) {\n  109 |         #[cfg(target_arch = \"wasm32\")]\n  110 |         {\n  111 |             while self.pending.load(Ordering::Acquire) != 0 {\n  112 |                 core::hint::spin_loop();\n  113 |             }\n  114 |         }","lines":7,"link":"https://github.com/orxfun/orx-parallel/blob/b9214fbeb714e4bb8f8858676a818cef2f21b097/src/pool/pool_impl/wasm_web.rs#L108-L114"}]},{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"high","difficulty":"hard","description":"`Timing::now()` for wasm32 (`src/runner/runner_variants/adaptive_chunk/timing/timing_wasm.rs:6-9`) is implemented as `(js_sys::Date::now() * 1_000_000.0) as u64`. `Date::now()` only has millisecond resolution (and in many browsers is throttled further), so multiplying by `1_000_000.0` fabricates fake nanosecond units without adding real precision: two calls to `Timing::now()` within the same JS-clock millisecond tick yield identical values, so `elapsed_ns_from` (via `saturating_sub`) returns exactly `0` for the very common case where a chunk finishes in under ~1ms. `State::record_chunk` then computes `sample_ns_per_item = elapsed_ns / items = 0`, which is fed into the EWMA average (`EWMA_PARAMS_AVG.ewma`), repeatedly biasing `avg_ns_per_item` toward zero on wasm and undermining the heavy-work / high-variability chunk-size decisions the adaptive runner is designed to make (`choose_fixed_chunk_size` in `state.rs`).","fix":"Use a higher-resolution wasm clock, e.g. `web_sys::Window::performance()`/`WorkerGlobalScope::performance()`'s `Performance::now()` (sub-millisecond resolution, monotonic), instead of `js_sys::Date::now()`, before scaling to nanosecond-like units.","locations":[{"ref":"src/runner/runner_variants/adaptive_chunk/timing/timing_wasm.rs:1-20","code":"    1 | pub type Instant = u64;\n    2 | \n    3 | pub struct Timing;\n    4 | \n    5 | impl Timing {\n    6 |     #[inline(always)]\n    7 |     pub fn now() -> Instant {\n    8 |         (js_sys::Date::now() * 1_000_000.0) as u64\n    9 |     }\n   10 | \n   11 |     #[inline(always)]\n   12 |     pub fn elapsed_ns_from(from: Instant) -> u64 {\n   13 |         Timing::now().saturating_sub(from)\n   14 |     }\n   15 | \n   16 |     #[inline(always)]\n   17 |     pub fn elapsed_millis_from(from: Instant) -> u128 {\n   18 |         Timing::now().saturating_sub(from).saturating_div(1_000_000) as u128\n   19 |     }\n   20 | }","lines":20,"link":"https://github.com/orxfun/orx-parallel/blob/b9214fbeb714e4bb8f8858676a818cef2f21b097/src/runner/runner_variants/adaptive_chunk/timing/timing_wasm.rs#L1-L20"}]},{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"medium","difficulty":"hard","description":"In `src/infallible_use/thread_execution/reduce.rs`, both the `0 | 1` and chunked branches of the polling loops handle a `None` result from `iter.next_by(th_idx)`/`chunk_puller.pull()` with a bare `None => {}` when `!iter.is_completed_when_none_returned()`, immediately looping back to `Q::next_chunk_size`/`Q::begin_chunk` again with no delay or back-off. This is a tight busy-spin: a worker thread that races ahead of a slower-producing concurrent iterator (e.g. a recursively-expanding source) will burn 100% CPU polling in a loop until either new work appears or completion is signalled, rather than yielding/backing off. The code itself flags this with `// TODO: a good back-off strategy might be used, needs benchmark with ConcurrentQueue` at both occurrences, confirming it is a known, unresolved gap rather than intentional final behavior. The identical unthrottled retry pattern also appears in the sibling `collect.rs`, `collect_arb.rs`, `next.rs`, and `next_any.rs` in the same directory.","fix":"Add a back-off strategy on repeated `None` results (e.g. `core::hint::spin_loop()` for a few iterations, then a short sleep/yield, similar to typical spin-wait patterns for lock-free queues) before retrying `next_chunk_size`/`begin_chunk`, and benchmark against `ConcurrentQueue`-backed sources as the existing TODO suggests.","locations":[{"ref":"src/infallible_use/thread_execution/reduce.rs:42-45","code":"   42 |                     // TODO: a good back-off strategy might be used, needs benchmark with ConcurrentQueue\n   43 |                     None if iter.is_completed_when_none_returned() => break,\n   44 |                     None => {}\n   45 |                 }","lines":4,"link":"https://github.com/orxfun/orx-parallel/blob/b9214fbeb714e4bb8f8858676a818cef2f21b097/src/infallible_use/thread_execution/reduce.rs#L42-L45"},{"ref":"src/infallible_use/thread_execution/reduce.rs:89-92","code":"   89 |                             // TODO: a good back-off strategy might be used, needs benchmark with ConcurrentQueue\n   90 |                             None if iter.is_completed_when_none_returned() => break,\n   91 |                             None => {}\n   92 |                         }","lines":4,"link":"https://github.com/orxfun/orx-parallel/blob/b9214fbeb714e4bb8f8858676a818cef2f21b097/src/infallible_use/thread_execution/reduce.rs#L89-L92"}]},{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"medium","difficulty":"hard","description":"In `src/option/thread_execution/{collect.rs,collect_arb.rs,next.rs,next_any.rs,reduce.rs}` and their `src/option_use/thread_execution/` counterparts, every polling loop handles a `None` from `iter.next_by`/`iter.next_with_idx_by`/`chunk_puller.pull(_with_idx)` (when `!iter.is_completed_when_none_returned()`) with a bare `None => {}`, immediately looping back to `Q::next_chunk_size`/`Q::begin_chunk` with no back-off. This is an unthrottled busy-spin: a worker that races ahead of a slower/lazily-producing concurrent iterator will spin at 100% CPU until new work appears or completion is signalled. The `reduce.rs` files in both directories even carry a `// TODO: a good back-off strategy might be used, needs benchmark with ConcurrentQueue` comment acknowledging this as an unresolved gap, but the identical unthrottled pattern is silently repeated (without the TODO note) in the sibling `collect.rs`, `collect_arb.rs`, `next.rs`, and `next_any.rs` in both `option` and `option_use`.","fix":"Add a shared back-off helper (e.g. a few `core::hint::spin_loop()` iterations followed by a short yield/sleep) invoked from the `None => {}` arms across all of `option`'s and `option_use`'s `thread_execution` functions before retrying, consistent with the TODO already present in `reduce.rs`, and benchmark against `ConcurrentQueue`-backed sources as noted.","locations":[{"ref":"src/option/thread_execution/reduce.rs:46-48","code":"   46 |                     // TODO: a good back-off strategy might be used, needs benchmark with ConcurrentQueue\n   47 |                     None if iter.is_completed_when_none_returned() => break,\n   48 |                     None => {}","lines":3,"link":"https://github.com/orxfun/orx-parallel/blob/b9214fbeb714e4bb8f8858676a818cef2f21b097/src/option/thread_execution/reduce.rs#L46-L48"},{"ref":"src/option/thread_execution/reduce.rs:101-103","code":"  101 |                             // TODO: a good back-off strategy might be used, needs benchmark with ConcurrentQueue\n  102 | input has fewer elements than `min_samples` (easily true for a modest thread count, e.g. `8 * 32 = 256` on a 32-thread machine), `explored < self.min_samples` remains true for the entire computation, so the runner never leaves `Mode::Explore` and keeps using `min_chunk_size` (often `1`) for the whole run instead of ever picking an amortized/balanced fixed chunk size.","fix":"Also bound `min_samples` (or the stop-exploration decision) by the iterator's lower-bound `size_hint().0` when an exact length isn't known, or clamp `min_samples` by the observed number of tasks completed so far relative to any available lower bound, so short inputs on inexact-size sources aren't forced to explore forever at `min_chunk_size`.","locations":[{"ref":"src/runner/runner_variants/adaptive_chunk/state.rs:104-145","code":"  104 |     pub(super) fn should_stop_exploration(&self) -> bool {\n  105 |         let explored = self.explored_tasks.load(Ordering::Relaxed);\n  106 |         let explored_x100 = explored.saturating_mul(100);\n  107 |         let fraction_capped = match self.initial_len {\n  108 |             Some(total) if total > 0 => explored_x100 >= total * EXPLORATION_CAP_PCT,\n  109 |             _ => false,\n  110 |         };\n  111 |         if fraction_capped {\n  112 |             return true;\n  113 |         }\n  114 | \n  115 |         if explored < self.min_samples {\n  116 |             return false;\n  117 |         }\n  118 | \n  119 |         let fraction_reached = match self.initial_len {\n  120 |             Some(total) if total > 0 => explored_x100 >= total * EXPLORATION_TARGET_PCT,\n  121 |             _ => false,\n  122 |         };\n  123 | \n  124 |         if fraction_reached {\n  125 |             return true;\n  126 |         }\n  127 | \n  128 |         // Convergence-based stopping: if average has been stable for N samples,\n  129 |         // and we've explored enough, stop exploring\n  130 |         let converged = self.converged_samples.load(Ordering s 1-24) registers a `message` listener on `self` waiting for `\"orx_parallel_worker_init\"`, then imports the wasm package, calls `pkg.default(init)`, posts `\"orx_parallel_worker_ready\"`, and calls `pkg.wasm_web_start_worker()` - logic that is clearly meant to run inside a spawned Worker's global scope. However, `startWorkers()` in the same file (line 40) creates each `Worker` pointing at a *different* script, `new URL(\"./worker_helpers.js\", import.meta.url)`, and no `worker_helpers.js` file exists anywhere in this repository (confirmed by search). This means lines 1-24 never run in their intended context: whenever this module is loaded on the main thread (its actual real usage, since it is the `#[wasm_bindgen(module = ...)]` target providing `startWorkers`), `self` refers to the main-thread global, so the listener is registered but the expected `\"orx_parallel_worker_init\"` message is never delivered to it (it is only ever posted to the spawned `worker_helpers.js` workers, via `worker.postMessage(workerInit)` at line 60). The real worker bootstrap script is apparently supplied externally by the companion `orx-parallel-wasm` npm package (per `docs/wasm.md`, which says its build step \"copies the worker helper beside the generated worker entry\"), making this block an unused, easily-mistaken-for-authoritative copy that can silently drift out of sync with the real `worker_helpers.js` content.","fix":"Remove the dead top-level listener block from `wasm_web_start_workers.js` (it never executes in its current usage), or add a comment clarifying it is a reference template for the externally-supplied `worker_helpers.js` and must be kept in sync manually, to avoid confusing future maintainers into thinking it is live code.","locations":[{"ref":"src/pool/pool_impl/wasm_web_start_workers.js:1-24","code":"    1 | function waitForMsgType(target, type) {\n    2 |     return new Promise((resolve) => {\n    3 |         target.addEventListener(\"message\", function onMsg({ dat efinition the result has exactly zero or one element` comment directly above `self.xap(i).into_iter().next()`, but that line contains no `unsafe` block at all - it is a plain, always-safe `Option`-returning call. The comment was clearly copy-pasted from the sibling `XapOne::one_value` a few lines above, which does contain an `unsafe { ... unwrap_unchecked() }` call that genuinely needs a safety justification. The identical stale comment is duplicated in `src/infallible_use/xap.rs` on `XapUseBin::bin_value`. A `SAFETY:` comment on code with no `unsafe` is misleading to readers and to tools (like `clippy::undocumented_unsafe_blocks`) that expect `SAFETY:` to precede an `unsafe` block.","fix":"Remove the `SAFETY:` prefix (or the comment entirely) from `bin_value`/`XapUseBin::bin_value` since there is no `unsafe` code to justify there, e.g. change the comment to a plain `// zero-or-one element, so `next()` yields at most one value` note, or delete it.","locations":[{"ref":"src/infallible/xap.rs:100-107","code":"  100 | /// Convenience methods for xaps that yield zero or one value.\n  101 | pub trait XapBin: Xap<Size = Bin> {\n  102 |     #[inline(always)]\n  103 |     /// Returns the optional output value.\n  104 |     fn bin_value(&self, i: Self::I) -> Option<Self::O> {\n  105 |         // SAFETY: by definition the result has exactly zero or one element\n  106 |         self.xap(i).into_iter().next()\n  107 |     }","lines":8,"link":"https://github.com/orxfun/orx-parallel/blob/b9214fbeb714e4bb8f8858676a818cef2f21b097/src/infallible/xap.rs#L100-L107"},{"ref":"src/infallible_use/xap.rs:86-92","code":"   86 | pub trait XapUseBin: XapUse<Size = Bin> {\n   87 |     #[inline(always)]\n   88 |     fn bin_value(&self, u: *mut Self::U, i: Self::I) -> Option<Self::O> {\n   89 |         // SAFETY: by definition the result has exactly zero or one element\n   90 |         self.xap_use(u, i).into_iter().next()\n   91 |     }\n   92 | }","lines":7,"link":"https://github.com/orxfun/or ented for the identity xap (`Id`/`IdUse`) and the `*M` (map-only) variants `OneM`, `BinM`, `ManyM` (and `UOneM`, `UBinM`, `UManyM`). The `*F` (filter/filter_map) variants `OneF`, `BinF`, `ManyF` and the `*X` (flat_map/flatten) variants `OneX`, `BinX`, `ManyX` - plus their `infallible_use` counterparts `UOneF`/`UBinF`/`UManyF`/`UOneX`/`UBinX`/`UManyX` - never implement `XapEnumByInput`/`XapUseEnumByInput`. Since `EnumeratePar::enumerate`/`EnumerateParUse::enumerate` require the whole current `Xap`/`XapUse` chain to implement this trait (it recursively calls `.enumerate()` on the wrapped inner xap too), once a pipeline uses `.filter()`, `.filter_map()`, `.flat_map()`, or `.flatten()` anywhere before `.enumerate()`, the `.enumerate()` call stops compiling (`XapEnumByInput`/`XapUseEnumByInput` bound unsatisfied) - even though every rustdoc example in `src/infallible/par_enum.rs` and `src/infallible_use/par_enum.rs` only demonstrates calling `.enumerate()` immediately after source creation, with no mention of this restriction. Users who write `.filter(...).enumerate()` or `.flat_map(...).enumerate()` get a confusing trait-bound compile error instead of a documented limitation.","fix":"Either (a) document explicitly on `EnumeratePar`/`EnumerateParUse` (and in `.filter`/`.filter_map`/`.flat_map`/`.flatten` docs) that `.enumerate()` must be called before any filtering/flat-mapping step, or (b) implement `XapEnumByInput`/`XapUseEnumByInput` for the `*F` and `*X` variants too (threading `(usize, ...)` through the zero-or-many cardinality the same way `*M` variants thread it through the one-to-one case), so `.filter(...).enumerate()` compiles and behaves as users would expect from a rayon/std-like API.","locations":[{"ref":"src/infallible/xap_variants/bin_f.rs:1-39","code":"    1 | use crate::infallible::fun::FilterMap;\n    2 | use crate::infallible::xap::{Xap, XapBin};\n    3 | use crate::sizes::Bin;\n    4 | \n    5 | /// Zero-or-one xap followed by a filter-map step.\n    assert!(\n        cfg!(target_feature = \"atomics\"),\n        \"Wasm web threading requires atomics-enabled wasm build flags; see docs/wasm.md.\"\n    );\n    assert_eq!(\n        WASM_WEB3_THREAD_POOL_STATE.load(Ordering::SeqCst),\n        WASM_WEB3_THREAD_POOL_INITIALIZED,\n        \"Wasm web thread pool is not initialized. Call and await init_wasm_parallel_runtime(...) before running parallel computations.\"\n    )\n}\n```\nThis preserves the panic message and behavior when atomics-enabled code actually runs `scoped_computation`, while letting non-atomics `wasm32` builds compile (they will simply panic at runtime if `WasmWebPool` is ever used, which matches the documented degrade-gracefully intent).","locations":[{"ref":"src/pool/pool_impl/wasm_web.rs:311-324","code":"  311 | fn assert_wasm_thread_pool_initialized() {\n  312 |     const {\n  313 |         assert!(\n  314 |             cfg!(target_feature = \"atomics\"),\n  315 |             \"Wasm web threading requires atomics-enabled wasm build flags; see docs/wasm.md.\"\n  316 |         );\n  317 |     }\n  318 | \n  319 |     assert_eq!(\n  320 |         WASM_WEB3_THREAD_POOL_STATE.load(Ordering::SeqCst),\n  321 |         WASM_WEB3_THREAD_POOL_INITIALIZED,\n  322 |         \"Wasm web thread pool is not initialized. Call and await init_wasm_parallel_runtime(...) before running parallel computations.\"\n  323 |     )\n  324 | }","lines":14,"link":"https://github.com/orxfun/orx-parallel/blob/b9214fbeb714e4bb8f8858676a818cef2f21b097/src/pool/pool_impl/wasm_web.rs#L311-L324"}]},{"id":"OTHER_2","type":"other","type_label":"Other","severity":"medium","difficulty":"medium","description":"`WithDiagnostics`'s `TaskCounts::push` and `ThreadLifetimes::begin`/`end` (`src/runner/runner_variants/with_diagnostics.rs:84-119`) take `&self` and obtain per-index `&mut Vec<usize>` / `&mut Option<Instant>` via raw-pointer casts (`&mut *(self.0.as_ptr().add(th_idx) as *mut Vec<usize>)`) on plain `Vec<Vec<usize>>` / `Vec<Option< </div>
