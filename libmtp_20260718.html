 stack buffer `buf`, not whatever `openusb_get_raw_desc` may have allocated into `bufptr`. This corrupts the heap/aborts. It is also only freed on some early returns and never on the success path.","fix":"Free the pointer actually managed by the API (`openusb_free_raw_desc(bufptr)`), only when the descriptor was heap-allocated, and free it on all exit paths.","locations":[{"ref":"src/libopenusb1-glue.c:329-362","code":"  329 |         ret = openusb_get_raw_desc(libmtp_openusb_handle, *dev, USB_DESC_TYPE_STRING, 0xee, 0, &bufptr, (unsigned short *)&buffersize);\n  330 |         /*\n  331 |          * If something failed we're probably stalled to we need\n  332 |          * to clear the stall off the endpoint and say this is not\n  333 |          * MTP.\n  334 |          */\n  335 |         if (ret < 0) {\n  336 |             /* EP0 is the default control endpoint */\n  337 |             //libusb_clear_halt (devh, 0);\n  338 |             openusb_close_device(*devh);\n  339 |             openusb_free_raw_desc(buf);\n  340 |             return 0;\n  341 |         }\n  342 | \n  343 |         // Dump it, if requested\n  344 |         if (dumpfile != NULL && ret > 0) {\n  345 |             fprintf(dumpfile, \"Microsoft device descriptor 0xee:\\n\");\n  346 |             data_dump_ascii(dumpfile, buf, ret, 16);\n  347 |         }\n  348 | \n  349 |         /* Check if descriptor length is at least 10 bytes */\n  350 |         if (ret < 10) {\n  351 |             openusb_close_device(*devh);\n  352 |             openusb_free_raw_desc(buf);\n  353 |             return 0;\n  354 |         }\n  355 | \n  356 |         /* Check if this device has a Microsoft Descriptor */\n  357 |         if (!((buf[2] == 'M') && (buf[4] == 'S') &&\n  358 |                 (buf[6] == 'F') && (buf[8] == 'T'))) {\n  359 |             openusb_close_device(*devh);\n  360 |             openusb_free_raw_desc(buf);\n  361 |             return 0;\n  362 |         }","lines":34,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libopenusb1-glue.c#L329-L362"}]},{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"openusb `LIBMTP_Check_Specific_Device()` declares `openusb_devid_t **devs = NULL;` and calls `openusb_get_devids_by_bus(libmtp_openusb_handle, 0, devs, &nrofdevs)` passing the NULL `devs` by value (should be `&devs`), so the list pointer is never set. `nrofdevs` (an `unsigned int`) is also passed uninitialized. The loop then dereferences the NULL `devs[i]` and passes `devs[i]` (an `openusb_devid_t`) where `probe_device_descriptor` expects an `openusb_dev_handle_t *` - crash and type confusion.","fix":"Declare `openusb_devid_t *devs = NULL;`, pass `&devs` and an initialized count, and pass `&devs[i]` with the correct type to `probe_device_descriptor` (matching the working `get_mtp_usb_device_list`).","locations":[{"ref":"src/libopenusb1-glue.c:556-575","code":"  556 | int LIBMTP_Check_Specific_Device(int busno, int devno) {\n  557 |     unsigned int nrofdevs;\n  558 |     openusb_devid_t **devs = NULL;\n  559 |     int i;\n  560 | \n  561 |     init_usb();\n  562 | \n  563 |     openusb_get_devids_by_bus(libmtp_openusb_handle, 0, devs, &nrofdevs);\n  564 |     for (i = 0; i < nrofdevs; i++) {\n  565 |         /*\n  566 |             if (bus->location != busno)\n  567 |               continue;\n  568 |             if (dev->devnum != devno)\n  569 |               continue;\n  570 |          */\n  571 |         if (probe_device_descriptor(devs[i], NULL))\n  572 |             return 1;\n  573 |     }\n  574 |     return 0;\n  575 | }","lines":20,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libopenusb1-glue.c#L556-L575"}]},{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"The openusb `ptp_usb_event()` ports the libusb-0.1 retry idiom `if (result==0) { <read again> }` verbatim, but the semantics are inverted: with `usb_bulk_read` `result==0` meant a zero-length packet (retry to get real data), whereas with `openusb_bulk_xfer` `result==0` is OPENUSB_SUCCESS. So after every *successful* first read the code performs a second read into the same `usbevent`, discarding the first event and blocking/overwriting. Both the CHECK and CHECK_FAST cases.","fix":"Drive the retry off the transferred byte count, not the status code (e.g. `if (result == OPENUSB_SUCCESS && xread == 0) { <read again> }`), and treat `result != OPENUSB_SUCCESS` as the error condition.","locations":[{"ref":"src/libopenusb1-glue.c:1611-1630","code":" 1611 |             result = openusb_bulk_xfer(*ptp_usb->handle, ptp_usb->interface, ptp_usb->intep, &bulk);\n 1612 |             xread = bulk.result.transferred_bytes;\n 1613 | \n 1614 |             if (result == 0) {\n 1615 |                 /*\n 1616 |                                 result = USB_BULK_READ(ptp_usb->handle,\n 1617 |                                     ptp_usb->intep,\n 1618 |                                     (unsigned char *) &usbevent,\n 1619 |                                     sizeof (usbevent),\n 1620 |                                     &xread,\n 1621 |                                     0);\n 1622 |                  */\n 1623 |                 bulk.payload = (unsigned char *) &usbevent;\n 1624 |                 bulk.length = sizeof (usbevent);\n 1625 |                 bulk.timeout = ptp_usb->timeout;\n 1626 |                 bulk.flags = 0;\n 1627 |                 bulk.next = NULL;\n 1628 |                 result = openusb_bulk_xfer(*ptp_usb->handle, ptp_usb->interface, ptp_usb->intep, &bulk);\n 1629 |                 xread = bulk.result.transferred_bytes;\n 1630 |             }","lines":20,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libopenusb1-glue.c#L1611-L1630"},{"ref":"src/libopenusb1-glue.c:1647-1666","code":" 1647 |             result = openusb_bulk_xfer(*ptp_usb->handle, ptp_usb->interface, ptp_usb->intep, &bulk);\n 1648 |             xread = bulk.result.transferred_bytes;\n 1649 | \n 1650 |             if (result == 0) {\n 1651 |                 /*\n 1652 |                                 result = USB_BULK_READ(ptp_usb->handle,\n 1653 |                                         ptp_usb->intep,\n 1654 |                                         (unsigned char *) &usbevent,\n 1655 |                                         sizeof (usbevent),\n 1656 |                                         &xread,\n 1657 |                                         ptp_usb->timeout);\n 1658 |                  */\n 1659 |                 bulk.payload = (unsigned char *) &usbevent;\n 1660 |                 bulk.length = sizeof (usbevent);\n 1661 |                 bulk.timeout = ptp_usb->timeout;\n 1662 |                 bulk.flags = 0;\n 1663 |                 bulk.next = NULL;\n 1664 |                 result = openusb_bulk_xfer(*ptp_usb->handle, ptp_usb->interface, ptp_usb->intep, &bulk);\n 1665 |                 xread = bulk.result.transferred_bytes;\n 1666 |             }","lines":20,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libopenusb1-glue.c#L1647-L1666"}]},{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"In the openusb `ptp_usb_event()`, the byte count is taken from `rlen = result;` but `result` here is the return code of `openusb_bulk_xfer` (0 == OPENUSB_SUCCESS), not the number of bytes transferred - that value is in `xread = bulk.result.transferred_bytes`. On a successful read `result` is 0, so `if (rlen < 8) return PTP_ERROR_IO;` always fires and events are never delivered. (In `libusb-glue.c` the same line is correct because `usb_bulk_read` returns the byte count.)","fix":"Use the transferred byte count: `rlen = xread;` (the `bulk.result.transferred_bytes` value already stored in `xread`).","locations":[{"ref":"src/libopenusb1-glue.c:1678-1683","code":" 1678 |     rlen = result;\n 1679 |     if (rlen < 8) {\n 1680 |         libusb_glue_error(params,\n 1681 |                 \"PTP: reading event an short read of %ld bytes occurred\", rlen);\n 1682 |         return PTP_ERROR_IO;\n 1683 |     }","lines":6,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libopenusb1-glue.c#L1678-L1683"}]},{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`read_into_spl_text_t()` never terminates on a read error. When `read()` returns `rdcnt < 0` the code only logs and does NOT set `eof`; then `char* it_end = t + rdcnt;` computes a pointer BEFORE `t` (e.g. `t-1`), so the inner `while(it < it_end)` loop body is skipped, and the outer `while(!eof)` loop spins forever calling `read()` which keeps returning `-1`. Untrusted/short reads or a bad fd hang the process (DoS).","fix":"In the `rdcnt < 0` branch set `eof = 1;` (and `rdcnt = 0;`) before continuing, or `break;` out of the loop so a read error terminates parsing instead of looping.","locations":[{"ref":"src/playlist-spl.c:356-371","code":"  356 |     rdcnt = read(fd, it, sizeof(char)*MAXREAD);\n  357 |     if(rdcnt < 0)\n  358 |       LIBMTP_INFO(\"load_spl_fd read err %s\\n\", strerror(errno));\n  359 |     else if(rdcnt == 0) { // for EOF, fix rdcnt\n  360 |       if(it-t == MAXREAD)\n  361 |         LIBMTP_ERROR(\"error -- buffer too small to read in .spl playlist entry\\n\");\n  362 | \n  363 |       rdcnt = lseek(fd, 0, SEEK_CUR) - offcnt;\n  364 |       eof = 1;\n  365 |     }\n  366 | \n  367 |     LIBMTP_PLST_DEBUG(\"read buff= {%dB new, %dB old/left-over}%s\\n\",(int)rdcnt, (int)(iw-w), eof?\", EOF\":\"\");\n  368 | \n  369 |     // while more input bytes\n  370 |     char* it_end = t + rdcnt;\n  371 |     while(it < it_end) {","lines":16,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/playlist-spl.c#L356-L371"}]},{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In openusb `probe_device_descriptor()`, the control-message-2 error branch tests `if (ctrl.result.transferred_bytes < 0)`. `transferred_bytes` in `struct openusb_ctrl_request`'s result is an unsigned count, so `< 0` is always false and the error path is dead - a failed control transfer is never reported. (The analogous libusb-0.1 code correctly tests the signed `ret == -1`.)","fix":"Check the transfer status/return code instead (e.g. `if (ret != OPENUSB_SUCCESS)`), not the unsigned `transferred_bytes`.","locations":[{"ref":"src/libopenusb1-glue.c:452-459","code":"  452 |         if (ctrl.result.transferred_bytes < 0) {\n  453 |             /* TODO: Implement callback function to let managing program know there\n  454 |                was a problem, along with description of the problem */\n  455 |             LIBMTP_ERROR(\"Potential MTP Device with VendorID:%04x and \"\n  456 |                     \"ProductID:%04x encountered an error responding to \"\n  457 |                     \"control message 2.\\n\"\n  458 |                     \"Problems may arrise but continuing\\n\",\n  459 |                     desc.idVendor, desc.idProduct);","lines":8,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libopenusb1-glue.c#L452-L459"}]},{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In the openusb `ptp_read_func` trailing zero-read, the transfer result is stored into `ret` (`ret = openusb_bulk_xfer(...)`), but the subsequent success test checks the unrelated `zeroresult`, which was initialized to 0 and never reassigned: `if (zeroresult != OPENUSB_SUCCESS) LIBMTP_INFO(...)`. The diagnostic can therefore never fire. `xread` is likewise assigned but unused here.","fix":"Assign the call result to `zeroresult` (`zeroresult = openusb_bulk_xfer(...)`) or test `ret` instead.","locations":[{"ref":"src/libopenusb1-glue.c:930-938","code":"  930 |         bulk.payload = &temp;\n  931 |         bulk.length = 0;\n  932 |         bulk.timeout = ptp_usb->timeout;\n  933 |         bulk.flags = 0;\n  934 |         bulk.next = NULL;\n  935 |         ret = openusb_bulk_xfer(*ptp_usb->handle, ptp_usb->interface, ptp_usb->inep, &bulk);\n  936 |         xread = bulk.result.transferred_bytes;\n  937 |         if (zeroresult != OPENUSB_SUCCESS)\n  938 |             LIBMTP_INFO(\"LIBMTP panic: unable to read in zero packet, response 0x%04x\", zeroresult);","lines":9,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libopenusb1-glue.c#L930-L938"}]},{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`ptp_mtpz_makeapplicationcertificatemessage` generates the 16-byte handshake nonce with `srand(time(NULL))` followed by `rand() % 256`. This is a non-cryptographic PRNG seeded with the current second, so the nonce is predictable/low-entropy. For an authentication handshake nonce this weakens the protocol's replay/freshness guarantees.","fix":"Use a cryptographically secure source, e.g. `gcry_randomize(random, 16, GCRY_STRONG_RANDOM)` (gcrypt is already a dependency), instead of `srand`/`rand`.","locations":[{"ref":"src/mtpz.c:1721-1724","code":" 1721 | \tsrand(time(NULL));\n 1722 | \n 1723 | \tfor (i = 0; i < 16; i++)\n 1724 | \t\t*(random + i) = (unsigned char)(rand() % 256);","lines":4,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/mtpz.c#L1721-L1724"}]},{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The intended \"line too long / buffer too small at EOF\" guard `if(it-t == MAXREAD)` is dead: `it` was reset to `t` at the top of the loop (`it = t;`) immediately before `read()`, so `it - t` is always `0` here and the condition can never be true. The real overflow condition (a single .spl line longer than `WSIZE`) is only handled by the separate reset at the bottom of the loop, so this branch never warns as intended.","fix":"Track the unconsumed/partial-line length via `iw - w` (the working buffer) and test that against `WSIZE`, e.g. `if(iw - w >= (ptrdiff_t)WSIZE)`, instead of the always-zero `it - t == MAXREAD` test. Or remove the dead check.","locations":[{"ref":"src/playlist-spl.c:355-365","code":"  355 |     it = t; // set ptr to start of buffer\n  356 |     rdcnt = read(fd, it, sizeof(char)*MAXREAD);\n  357 |     if(rdcnt < 0)\n  358 |       LIBMTP_INFO(\"load_spl_fd read err %s\\n\", strerror(errno));\n  359 |     else if(rdcnt == 0) { // for EOF, fix rdcnt\n  360 |       if(it-t == MAXREAD)\n  361 |         LIBMTP_ERROR(\"error -- buffer too small to read in .spl playlist entry\\n\");\n  362 | \n  363 |       rdcnt = lseek(fd, 0, SEEK_CUR) - offcnt;\n  364 |       eof = 1;\n  365 |     }","lines":11,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/playlist-spl.c#L355-L365"}]},{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"Macro-hygiene bug in `array_extend_capacity`: the `memset` size expression uses `LEN` without parentheses (`LEN * sizeof((ARRAY)->val[0])`), whereas the `realloc` and log lines correctly use `(LEN)`. If `LEN` is ever a lower-precedence expression such as `n + 1`, the size becomes `n + (1 * sizeof(...))` instead of `(n + 1) * sizeof(...)`, zeroing too few bytes and leaving newly allocated elements uninitialized. Current callers only pass single tokens (`1`, `(SRC)->len`), so it is latent, but the inconsistency is a real defect.","fix":"Parenthesize the argument. Before: `memset((ARRAY)->val + (ARRAY)->len, 0, LEN * sizeof((ARRAY)->val[0]));` After: `memset((ARRAY)->val + (ARRAY)->len, 0, (LEN) * sizeof((ARRAY)->val[0]));`","locations":[{"ref":"src/array.h:85","code":"   85 | \tmemset((ARRAY)->val + (ARRAY)->len, 0, LEN * sizeof((ARRAY)->val[0])); \\","lines":1,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/array.h#L85"}]},{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `ptp_usb_getdata()`, inside the `rlen == inep_maxpacket` fast path, the end-of-data test `if (rlen == usbdata.length)` compares the host-order `rlen` against the raw little-endian `usbdata.length` field without `dtoh32()`, unlike every other use of that field in the same function (`dtoh32(usbdata.length)`). On a big-endian host this comparison is wrong; even on little-endian it is inconsistent and fragile. Both glue files.","fix":"Compare against the decoded value: `if (rlen == dtoh32(usbdata.length))`.","locations":[{"ref":"src/libusb-glue.c:1360","code":" 1360 | \t\tif (rlen == usbdata.length)","lines":1,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libusb-glue.c#L1360"},{"ref":"src/libopenusb1-glue.c:1371","code":" 1371 |             if (rlen == usbdata.length)","lines":1,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libopenusb1-glue.c#L1371"}]},{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`find_interface_and_endpoints()` reads the configuration value with `*conf = dev->config->bConfigurationValue;;` which always uses `dev->config[0]` even though the surrounding loop iterates configurations via `dev->config[i]` (used correctly for `bNumInterfaces` etc. below). For a multi-configuration device the wrong configuration value is reported. The line also contains a stray double semicolon.","fix":"```\n*conf = dev->config->bConfigurationValue;;\n```\nbecomes\n```\n*conf = dev->config[i].bConfigurationValue;\n```","locations":[{"ref":"src/libusb-glue.c:1901","code":" 1901 |     *conf = dev->config->bConfigurationValue;;","lines":1,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libusb-glue.c#L1901"}]},{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`ptp_usb_getpacket` copies a buffered surplus packet into the fixed-size caller container with `memcpy(packet, params->response_packet, params->response_packet_size)` and copies a freshly read packet with `memcpy(packet, x, *rlen)`, neither bounded against `sizeof(PTPUSBBulkContainer)`. `*rlen` is the number of bytes actually read over the IN endpoint (up to `inep_maxpacket`). While `inep_maxpacket` is normally capped at `PTP_USB_BULK_PAYLOAD_LEN_READ`, the copy target is a stack `PTPUSBBulkContainer` in callers such as `ptp_usb_getresp`, so any path where the read length exceeds the container size overflows a stack buffer.","fix":"Clamp both `memcpy` lengths to `sizeof(PTPUSBBulkContainer)` (or assert `*rlen`/`response_packet_size <= sizeof(*packet)`) before copying into the caller-provided container.","locations":[{"ref":"src/libusb1-glue.c:1389-1405","code":" 1389 | \tif (params->response_packet_size > 0) {\n 1390 | \t\t/* If there is a buffered packet, just use it. */\n 1391 | \t\tmemcpy(packet, params->response_packet, params->response_packet_size);\n 1392 | \t\t*rlen = params->response_packet_size;\n 1393 | \t\tfree(params->response_packet);\n 1394 | \t\tparams->response_packet = NULL;\n 1395 | \t\tparams->response_packet_size = 0;\n 1396 | \t\t/* Here this signifies a \"virtual read\" */\n 1397 | \t\treturn PTP_RC_OK;\n 1398 | \t}\n 1399 | \tptp_init_recv_memory_handler (&memhandler);\n 1400 | \tret = ptp_read_func(packet_size, &memhandler, params->data, rlen, 0);\n 1401 | \tptp_exit_recv_memory_handler (&memhandler, &x, rlen);\n 1402 | \tif (x) {\n 1403 | \t\tmemcpy (packet, x, *rlen);\n 1404 | \t\tfree (x);\n 1405 | \t}","lines":17,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libusb1-glue.c#L1389-L1405"}]},{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`hex_to_bytes` allocates `len/2` bytes and fills them only while `sscanf(hex + i, \"%2x\", &u) == 1`. If a non-hex character is encountered, the loop stops early and the remaining bytes of the returned buffer are left uninitialized (later used as key/certificate material). It also does not check the `malloc` result. There is no signal to the caller that parsing stopped short.","fix":"Zero the buffer after allocation (or `calloc`), check the `malloc` result, and return NULL / an explicit error if fewer than `len/2` bytes were successfully parsed.","locations":[{"ref":"src/mtpz.c:107-123","code":"  107 | static char *hex_to_bytes(char *hex, size_t len)\n  108 | {\n  109 | \tif (len % 2)\n  110 | \t\treturn NULL;\n  111 | \n  112 | \tchar *bytes = malloc(len / 2);\n  113 | \tunsigned int u;\n  114 | \tunsigned int i = 0;\n  115 | \n  116 | \twhile (i < len && sscanf(hex + i, \"%2x\", &u) == 1)\n  117 | \t{\n  118 | \t\tbytes[i / 2] = u;\n  119 | \t\ti += 2;\n  120 | \t}\n  121 | \n  122 | \treturn bytes;\n  123 | }","lines":17,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/mtpz.c#L107-L123"}]},{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"The qsort comparator `_compare_func` returns `px->ObjectHandle - py->ObjectHandle` where\n`ObjectHandle` is `uint32_t`. The subtraction is computed in unsigned arithmetic and then\nconverted to `int`, so for handles that differ by more than `INT_MAX` the returned sign is\nwrong (e.g. `0x00000000` vs `0xFFFFFFFF`). This yields an inconsistent ordering and an\nincorrectly sorted MTP object-property list (not memory-unsafe, but a correctness bug the\nsort/binary-search downstream relies on).","fix":"Compare without subtraction:\n```\nreturn (px->ObjectHandle > py->ObjectHandle) - (px->ObjectHandle < py->ObjectHandle);\n```","locations":[{"ref":"src/ptp-pack.c:1259-1265","code":" 1259 | static int\n 1260 | _compare_func(const void* x, const void *y) {\n 1261 | \tconst MTPObjectProp *px = x;\n 1262 | \tconst MTPObjectProp *py = y;\n 1263 | \n 1264 | \treturn px->ObjectHandle - py->ObjectHandle;\n 1265 | }","lines":7,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/ptp-pack.c#L1259-L1265"}]},{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`ptp_panasonic_9401` declares `unsigned int *size = 0;` (a NULL pointer) and passes it as the recvlen argument to `ptp_transaction`. This compiles because `ptp_transaction` tolerates a NULL recvlen, but the intent was clearly a size variable; as written the received length is silently discarded and the code is misleading.","fix":"Use a real variable. Before:\n```\nunsigned int\t*size = 0;\n...\nCHECK_PTP_RC(ptp_transaction(params, &ptp, PTP_DP_GETDATA, 0, &data, size));\n```\nAfter:\n```\nunsigned int\tsize = 0;\n...\nCHECK_PTP_RC(ptp_transaction(params, &ptp, PTP_DP_GETDATA, 0, &data, &size));\n```","locations":[{"ref":"src/ptp.c:1367-1371","code":" 1367 | \tunsigned int\t*size = 0;\n 1368 | \tunsigned char\t*data = NULL;\n 1369 | \n 1370 | \tPTP_CNT_INIT(ptp, PTP_OC_PANASONIC_9401, param1);\n 1371 | \tCHECK_PTP_RC(ptp_transaction(params, &ptp, PTP_DP_GETDATA, 0, &data, size));","lines":5,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/ptp.c#L1367-L1371"}]},{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`has_3_ep()` only accepts an interface whose `bNumEndpoints` file contains exactly the two bytes `0x30 0x33` (`\"03\"`), via `if (buf[0] == 0x30 && buf[1] == 0x33) return 1;`. The comment on the line above even admits `maybe we should parse it?`. An MTP-class interface that exposes more than three endpoints (e.g. `\"04\"`) is rejected outright by `check_interface()` (which early-returns when `has_3_ep() <= 0`), so such devices are never recognized as candidates. This is a fragile string-compare masquerading as a numeric threshold check.","fix":"Parse the value numerically and treat it as a minimum, e.g. `long n = strtol(buf, NULL, 10); return (n >= 3) ? 1 : 0;` (after ensuring `buf` is null-terminated), so interfaces with three or more endpoints are still examined by the per-endpoint scan in `check_interface()`.","locations":[{"ref":"util/mtp-probe.c:155-157","code":"  155 |   /* 0x30, 0x33 = \"03\", maybe we should parse it? */\n  156 |   if (buf[0] == 0x30 && buf[1] == 0x33)\n  157 |     return 1;","lines":3,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/util/mtp-probe.c#L155-L157"}]},{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"very_easy","description":"The `GP_LOG_E` diagnostic in `array_extend_capacity` formats a `size_t` value (the result of `(... ) * sizeof(...)`) with `%ld`, which expects `long`. On platforms where `size_t` and `long` differ (e.g. 64-bit Windows / LLP64), this is a format/argument type mismatch producing wrong output or a warning.","fix":"Use the size_t length modifier. Before: `GP_LOG_E (\"Out of memory: 'realloc' of %ld bytes failed.\", ...)` After: `GP_LOG_E (\"Out of memory: 'realloc' of %zu bytes failed.\", ...)`","locations":[{"ref":"src/array.h:82","code":"   82 | \t\tGP_LOG_E (\"Out of memory: 'realloc' of %ld bytes failed.\", ((ARRAY)->len + (LEN)) * sizeof((ARRAY)->val[0])); \\","lines":1,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/array.h#L82"}]},{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"very_easy","description":"In `check_sysfs()` two `if` statements are stacked without braces, which is easy to misread and fragile against future edits:\n```\n      if (!regexec(&r, dent->d_name, 0, 0, 0))\n      if (check_interface(dirbuf) > 0)\n\t/* potential MTP interface! */\n\tlook_closer = 1;\n```\nThe behavior is correct today (a nested condition), but the missing braces and identical indentation make it look like a copy/paste mistake and invite an accidental `else`/statement-association bug later.","fix":"Combine into a single guarded block. Before:\n```\n    if (S_ISDIR(st.st_mode)) {\n      if (!regexec(&r, dent->d_name, 0, 0, 0))\n      if (check_interface(dirbuf) > 0)\n\tlook_closer = 1;\n    }\n```\nAfter:\n```\n    if (S_ISDIR(st.st_mode)) {\n      if (!regexec(&r, dent->d_name, 0, 0, 0) && check_interface(dirbuf) > 0)\n\tlook_closer = 1;\n    }\n```","locations":[{"ref":"util/mtp-probe.c:272-277","code":"  272 |     if (S_ISDIR(st.st_mode)) {\n  273 |       if (!regexec(&r, dent->d_name, 0, 0, 0))\n  274 |       if (check_interface(dirbuf) > 0)\n  275 | \t/* potential MTP interface! */\n  276 | \tlook_closer = 1;\n  277 |     }","lines":6,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/util/mtp-probe.c#L272-L277"}]},{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"`ptp_chdk_parse_live_data` unpacks the bitmap framebuffer descriptor `bmd` from the *viewport* offset `header->vp_desc_start` instead of the bitmap offset `header->bm_desc_start`. The bounds check just above correctly validates `bm_desc_start`, but the unpack call uses the wrong offset, so `bmd` is filled from the wrong location (and `bm_desc_start` is never actually used).","fix":"Change the second unpack to use the bitmap offset. Before:\n```\nptp_unpack_chdk_lv_framebuffer_desc (params, data+header->vp_desc_start, bmd);\n```\nAfter:\n```\nptp_unpack_chdk_lv_framebuffer_desc (params, data+header->bm_desc_start, bmd);\n```","locations":[{"ref":"src/ptp.c:5676-5677","code":" 5676 | \tptp_unpack_chdk_lv_framebuffer_desc (params, data+header->vp_desc_start, vpd);\n 5677 | \tptp_unpack_chdk_lv_framebuffer_desc (params, data+header->vp_desc_start, bmd);","lines":2,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/ptp.c#L5676-L5677"}]},{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"The doc comment for `DEVICE_FLAG_CAPTURE_PREVIEW` is a verbatim copy of the comment for `DEVICE_FLAG_CAPTURE` (\"Cameras that can capture images.\"), so it does not describe what the flag actually means (capturing a preview/live-view image rather than a full capture). Misleading documentation for a public flag.","fix":"Replace the copied text with an accurate description, e.g. `/** Cameras that can capture a preview image. (libgphoto2) */`.","locations":[{"ref":"src/device-flags.h:223-226","code":"  223 | /**\n  224 |  * Cameras that can capture images. (libgphoto2)\n  225 |  */\n  226 | #define DEVICE_FLAG_CAPTURE_PREVIEW\t0x00080000","lines":4,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/device-flags.h#L223-L226"}]},{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"negligible","difficulty":"very_easy","description":"Error-stack messages were copy-pasted from other functions and name the wrong function. `LIBMTP_Get_File_To_File_Descriptor()` and the cancel path report `\"LIBMTP_Get_File_From_File_Descriptor()\"` (no such function), and `LIBMTP_Get_File_To_Handler()` emits messages naming `\"LIBMTP_Get_File_To_File_Descriptor()\"`. This misleads anyone debugging via the error stack.","fix":"Correct the function names in the message literals, e.g.:\n```\n-    add_error_to_errorstack(device, LIBMTP_ERROR_CANCELLED, \"LIBMTP_Get_File_From_File_Descriptor(): Cancelled transfer.\");\n+    add_error_to_errorstack(device, LIBMTP_ERROR_CANCELLED, \"LIBMTP_Get_File_To_File_Descriptor(): Cancelled transfer.\");\n```","locations":[{"ref":"src/libmtp.c:5436","code":" 5436 |     add_error_to_errorstack(device, LIBMTP_ERROR_CANCELLED, \"LIBMTP_Get_File_From_File_Descriptor(): Cancelled transfer.\");","lines":1,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libmtp.c#L5436"},{"ref":"src/libmtp.c:5477-5518","code":" 5477 |     add_error_to_errorstack(device, LIBMTP_ERROR_GENERAL, \"LIBMTP_Get_File_To_File_Descriptor(): Could not get object info.\");\n 5478 |     return -1;\n 5479 |   }\n 5480 |   if (mtpfile->filetype == LIBMTP_FILETYPE_FOLDER) {\n 5481 |     add_error_to_errorstack(device, LIBMTP_ERROR_GENERAL, \"LIBMTP_Get_File_To_File_Descriptor(): Bad object format.\");\n 5482 |     LIBMTP_destroy_file_t (mtpfile);\n 5483 |     return -1;\n 5484 |   }\n 5485 | \n 5486 |   // Callbacks\n 5487 |   ptp_usb->callback_active = 1;\n 5488 |   ptp_usb->current_transfer_total = mtpfile->filesize +\n 5489 |     PTP_USB_BULK_HDR_LEN+sizeof(uint32_t); // Request length, one parameter\n 5490 |   ptp_usb->current_transfer_complete = 0;\n 5491 |   ptp_usb->current_transfer_callback = callback;\n 5492 |   ptp_usb->current_transfer_callback_data = data;\n 5493 | \n 5494 |   // Don't need mtpfile anymore\n 5495 |   LIBMTP_destroy_file_t(mtpfile);\n 5496 | \n 5497 |   MTPDataHandler mtp_handler;\n 5498 |   mtp_handler.getfunc = NULL;\n 5499 |   mtp_handler.putfunc = put_func;\n 5500 |   mtp_handler.priv = priv;\n 5501 | \n 5502 |   PTPDataHandler handler;\n 5503 |   handler.getfunc = NULL;\n 5504 |   handler.putfunc = put_func_wrapper;\n 5505 |   handler.priv = &mtp_handler;\n 5506 | \n 5507 |   ret = ptp_getobject_to_handler(params, id, &handler);\n 5508 | \n 5509 |   ptp_usb->callback_active = 0;\n 5510 |   ptp_usb->current_transfer_callback = NULL;\n 5511 |   ptp_usb->current_transfer_callback_data = NULL;\n 5512 | \n 5513 |   if (ret == PTP_ERROR_CANCEL) {\n 5514 |     add_error_to_errorstack(device, LIBMTP_ERROR_CANCELLED, \"LIBMTP_Get_File_From_File_Descriptor(): Cancelled transfer.\");\n 5515 |     return -1;\n 5516 |   }\n 5517 |   if (ret != PTP_RC_OK) {\n 5518 |     add_ptp_error_to_errorstack(device, ret, \"LIBMTP_Get_File_To_File_Descriptor(): Could not get file from device.\");","lines":42,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libmtp.c#L5477-L5518"}]},{"id":"CPY_4","type":"copy_paste","type_label":"Copy Paste","severity":"negligible","difficulty":"very_easy","description":"`PTP_DPC_CANON_EOS_CustomFunc19` is `#define`d twice in a row with the identical value `0xD192`. This is a harmless copy-paste artifact (same value so no redefinition warning of substance), but it is dead duplication and could mask a genuine typo if someone later edits only one of the two lines.","fix":"Delete the duplicate line. Before:\n```\n#define PTP_DPC_CANON_EOS_CustomFunc19\t\t0xD192\n#define PTP_DPC_CANON_EOS_CustomFunc19\t\t0xD192\n```\nAfter:\n```\n#define PTP_DPC_CANON_EOS_CustomFunc19\t\t0xD192\n```","locations":[{"ref":"src/ptp.h:2220-2221","code":" 2220 | #define PTP_DPC_CANON_EOS_CustomFunc19\t\t0xD192\n 2221 | #define PTP_DPC_CANON_EOS_CustomFunc19\t\t0xD192","lines":2,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/ptp.h#L2220-L2221"}]},{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"easy","description":"`memory_putfunc()` grows the accumulation buffer with `priv->data = realloc(priv->data, priv->curoff+sendlen);` without checking the result. On failure `realloc` returns NULL, the original allocation is overwritten (leaked), `priv->size` is nevertheless set to the requested size, and the following `memcpy(priv->data + priv->curoff, data, sendlen)` writes through a NULL pointer. Because this handler accumulates device-supplied data (`putfunc` is fed straight from the bulk-IN endpoint via `ptp_read_func`), the size is attacker-influenced. Present in both glue files.","fix":"`realloc` into a temporary; on NULL return `PTP_RC_GeneralError` without touching `priv->data`/`priv->size`. e.g. `unsigned char *n = realloc(priv->data, priv->curoff+sendlen); if (!n) return PTP_RC_GeneralError; priv->data = n; priv->size = priv->curoff + sendlen;`","locations":[{"ref":"src/libusb-glue.c:1085-1089","code":" 1085 | \tif (priv->curoff + sendlen > priv->size) {\n 1086 | \t\tpriv->data = realloc (priv->data, priv->curoff+sendlen);\n 1087 | \t\tpriv->size = priv->curoff + sendlen;\n 1088 | \t}\n 1089 | \tmemcpy (priv->data + priv->curoff, data, sendlen);","lines":5,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libusb-glue.c#L1085-L1089"},{"ref":"src/libopenusb1-glue.c:1092-1096","code":" 1092 |     if (priv->curoff + sendlen > priv->size) {\n 1093 |         priv->data = realloc(priv->data, priv->curoff + sendlen);\n 1094 |         priv->size = priv->curoff + sendlen;\n 1095 |     }\n 1096 |     memcpy(priv->data + priv->curoff, data, sendlen);","lines":5,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libopenusb1-glue.c#L1092-L1096"}]},{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"medium","description":"`mtpz_rsa_init` and `mtpz_rsa_decrypt` ignore every gcrypt return code. `gcry_mpi_scan`, `gcry_sexp_build`, `gcry_pk_decrypt` can all fail, leaving `mpi_*`/`sexp_plain` uninitialized. In `mtpz_rsa_decrypt`, if `gcry_pk_decrypt` fails, `sexp_plain` is passed uninitialized to `gcry_sexp_nth_mpi`, which is undefined behavior and can crash. Since the ciphertext fed to `mtpz_rsa_decrypt` comes straight from the untrusted device (`message`), a device can trigger this.","fix":"Check the `gcry_error_t` returned by each `gcry_mpi_scan`, `gcry_sexp_build`, `gcry_pk_decrypt` call; on any failure release what was allocated and return an error (0 written) instead of proceeding with uninitialized handles.","locations":[{"ref":"src/mtpz.c:296-316","code":"  296 | mtpz_rsa_t *mtpz_rsa_init(const unsigned char *str_modulus, const unsigned char *str_privkey, const unsigned char *str_pubexp)\n  297 | {\n  298 | \tmtpz_rsa_t *rsa = calloc(1, sizeof(mtpz_rsa_t));\n  299 | \tif (rsa == NULL)\n  300 | \t\treturn NULL;\n  301 | \n  302 | \tgcry_mpi_t mpi_modulus, mpi_privkey, mpi_pubexp;\n  303 | \n  304 | \tgcry_mpi_scan(&mpi_modulus, GCRYMPI_FMT_HEX, str_modulus, 0, NULL);\n  305 | \tgcry_mpi_scan(&mpi_privkey, GCRYMPI_FMT_HEX, str_privkey, 0, NULL);\n  306 | \tgcry_mpi_scan(&mpi_pubexp, GCRYMPI_FMT_HEX, str_pubexp, 0, NULL);\n  307 | \n  308 | \tgcry_sexp_build(&rsa->privkey, NULL, \"(private-key (rsa (n %m) (e %m) (d %m)))\", mpi_modulus, mpi_pubexp, mpi_privkey);\n  309 | \tgcry_sexp_build(&rsa->pubkey, NULL, \"(public-key (rsa (n %m) (e %m)))\", mpi_modulus, mpi_pubexp);\n  310 | \n  311 | \tgcry_mpi_release(mpi_modulus);\n  312 | \tgcry_mpi_release(mpi_privkey);\n  313 | \tgcry_mpi_release(mpi_pubexp);\n  314 | \n  315 | \treturn rsa;\n  316 | }","lines":21,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/mtpz.c#L296-L316"},{"ref":"src/mtpz.c:324-358","code":"  324 | int mtpz_rsa_decrypt(int flen, unsigned char *from, int tlen, unsigned char *to, mtpz_rsa_t *rsa)\n  325 | {\n  326 | \tgcry_mpi_t mpi_from;\n  327 | \tgcry_mpi_scan(&mpi_from, GCRYMPI_FMT_USG, from, flen, NULL);\n  328 | \n  329 | \tgcry_sexp_t sexp_data;\n  330 | \tgcry_sexp_build(&sexp_data, NULL, \"(enc-val (flags raw) (rsa (a %m)))\", mpi_from);\n  331 | \n  332 | \tgcry_sexp_t sexp_plain;\n  333 | \tgcry_pk_decrypt(&sexp_plain, sexp_data, rsa->privkey);\n  334 | \n  335 | \tgcry_mpi_t mpi_value = gcry_sexp_nth_mpi(sexp_plain, 1, GCRYMPI_FMT_USG);\n  336 | \n  337 | \t// Lame workaround. GCRYMPI_FMT_USG gets rid of any leading zeroes which we do need,\n  338 | \t// so we'll count how many bits are being used, and subtract that from how many bits actually\n  339 | \t// should be there, and then write into our output array shifted over however many bits/8.\n  340 | \tint bitshift = (tlen * 8) - gcry_mpi_get_nbits(mpi_value);\n  341 | \tsize_t written;\n  342 | \n  343 | \tif (bitshift / 8)\n  344 | \t{\n  345 | \t\tmemset(to, 0, bitshift / 8);\n  346 | \t\tto += bitshift / 8;\n  347 | \t\ttlen -= bitshift / 8;\n  348 | \t}\n  349 | \n  350 | \tgcry_mpi_print(GCRYMPI_FMT_USG, to, tlen, &written, mpi_value);\n  351 | \n  352 | \tgcry_mpi_release(mpi_from);\n  353 | \tgcry_mpi_release(mpi_value);\n  354 | \tgcry_sexp_release(sexp_data);\n  355 | \tgcry_sexp_release(sexp_plain);\n  356 | \n  357 | \treturn (int)written;\n  358 | }","lines":35,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/mtpz.c#L324-L358"}]},{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"easy","description":"In `spl_to_playlist_t()` the error path for `LIBMTP_Get_File_To_File_Descriptor()` closes the file descriptor and logs, but does NOT `return`. Execution falls through to `read_into_spl_text_t(device, fd)` which reads from the already-closed `fd`, and then `close(fd)` is called a second time (double close). The error message is a placeholder (`LIBMTP_INFO(\"FIXME closed\\n\")`) rather than a real diagnostic. Because `read()` on a closed fd returns `-1`, this also triggers the infinite-loop bug in `read_into_spl_text_t()` (see separate finding).","fix":"On failure, clean up and bail out: after `close(fd)` add `return;` (leaving `pl->tracks == NULL`, `pl->no_tracks == 0`). Also emit a real error via the intended `add_ptp_error_to_errorstack()` instead of the `FIXME` placeholder.","locations":[{"ref":"src/playlist-spl.c:145-153","code":"  145 |   int ret = LIBMTP_Get_File_To_File_Descriptor(device, pl->playlist_id, fd, NULL, NULL);\n  146 |   if( ret < 0 ) {\n  147 |     // FIXME     add_ptp_error_to_errorstack(device, ret, \"LIBMTP_Get_Playlist: Could not get .spl playlist file.\");\n  148 |     close(fd);\n  149 |     LIBMTP_INFO(\"FIXME closed\\n\");\n  150 |   }\n  151 | \n  152 |   text_t* p = read_into_spl_text_t(device, fd);\n  153 |   close(fd);","lines":9,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/playlist-spl.c#L145-L153"}]},{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`LIBMTP_Open_Raw_Device_Uncached()` calls `ptp_getdevicepropdesc(...,&dpd)` and, when it fails, only pushes an error onto the stack but then unconditionally reads `dpd.FORM.Range.MaxValue.u8` and calls `ptp_free_devicepropdesc(&dpd)` on the uninitialized stack struct `dpd`. This reads uninitialized memory and can pass garbage pointers to `ptp_free_devicepropdesc()`, risking a free of a wild pointer.","fix":"Move the `dpd.FORM.Range.MaxValue.u8` read and `ptp_free_devicepropdesc(&dpd)` inside the success branch (i.e. only when `ptp_getdevicepropdesc()` returned `PTP_RC_OK`), or `memset(&dpd,0,sizeof(dpd))` before the call and skip processing on failure.","locations":[{"ref":"src/libmtp.c:2163-2183","code":" 2163 |     PTPDevicePropDesc dpd;\n 2164 | \n 2165 |     /* Try to read maximum battery level */\n 2166 |     if(ptp_getdevicepropdesc(current_params,\n 2167 | \t\t\t     PTP_DPC_BatteryLevel,\n 2168 | \t\t\t     &dpd) != PTP_RC_OK) {\n 2169 |       add_error_to_errorstack(mtp_device,\n 2170 | \t\t\t      LIBMTP_ERROR_CONNECTING,\n 2171 | \t\t\t      \"Unable to read Maximum Battery Level for this \"\n 2172 | \t\t\t      \"device even though the device supposedly \"\n 2173 | \t\t\t      \"supports this functionality\");\n 2174 |     }\n 2175 | \n 2176 |     /* TODO: is this appropriate? */\n 2177 |     /* If max battery level is 0 then leave the default, otherwise assign */\n 2178 |     if (dpd.FORM.Range.MaxValue.u8 != 0) {\n 2179 |       mtp_device->maximum_battery_level = dpd.FORM.Range.MaxValue.u8;\n 2180 |     }\n 2181 | \n 2182 |     ptp_free_devicepropdesc(&dpd);\n 2183 |   }","lines":21,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libmtp.c#L2163-L2183"}]},{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`get_track_metadata()` and `get_album_metadata()` call `ptp_object_want(...,&ob)` but ignore the returned status `ret` and immediately dereference `ob->mtp_props.len`. Every other caller in the file checks `ret != PTP_RC_OK` first. If `ptp_object_want()` fails (device returns an unexpected/invalid handle), `ob` may be NULL or point to a stale/unpopulated object, causing a NULL/invalid dereference.","fix":"Check the return value: `if (ret != PTP_RC_OK) return;` (or bail out appropriately) before dereferencing `ob`.","locations":[{"ref":"src/libmtp.c:4894-4898","code":" 4894 |   ret = ptp_object_want(params, track->item_id, PTPOBJECT_MTPPROPLIST_LOADED, &ob);\n 4895 |   if (ob->mtp_props.len) {\n 4896 |     prop = ob->mtp_props.val;\n 4897 |     for (i=0;i<ob->mtp_props.len;i++,prop++)\n 4898 |       pick_property_to_track_metadata(device, prop, track);","lines":5,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libmtp.c#L4894-L4898"},{"ref":"src/libmtp.c:8628-8632","code":" 8628 |   ret = ptp_object_want(params, alb->album_id, PTPOBJECT_MTPPROPLIST_LOADED, &ob);\n 8629 |   if (ob->mtp_props.len) {\n 8630 |     prop = ob->mtp_props.val;\n 8631 |     for (i=0;i<ob->mtp_props.len;i++,prop++)\n 8632 |       pick_property_to_album_metadata(device, prop, alb);","lines":5,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libmtp.c#L8628-L8632"}]},{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`memory_putfunc` grows its buffer with `realloc` but does not check for a NULL return. On allocation failure the old pointer is lost (leak), `priv->data` becomes NULL, `priv->size` is still advanced, and the following `memcpy(priv->data + priv->curoff, data, sendlen)` dereferences NULL. This handler receives device data during every data-phase read.","fix":"Assign `realloc` to a temporary, check for NULL (return `PTP_RC_GeneralError` and leave `priv` unchanged/free old buffer), and only then update `priv->data`/`priv->size`.","locations":[{"ref":"src/libusb1-glue.c:1184-1197","code":" 1184 | static uint16_t\n 1185 | memory_putfunc(PTPParams* params, void* private,\n 1186 | \t       unsigned long sendlen, unsigned char *data\n 1187 | ) {\n 1188 | \tPTPMemHandlerPrivate* priv = (PTPMemHandlerPrivate*)private;\n 1189 | \n 1190 | \tif (priv->curoff + sendlen > priv->size) {\n 1191 | \t\tpriv->data = realloc (priv->data, priv->curoff+sendlen);\n 1192 | \t\tpriv->size = priv->curoff + sendlen;\n 1193 | \t}\n 1194 | \tmemcpy (priv->data + priv->curoff, data, sendlen);\n 1195 | \tpriv->curoff += sendlen;\n 1196 | \treturn PTP_RC_OK;\n 1197 | }","lines":14,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libusb1-glue.c#L1184-L1197"}]},{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"In the `PTP_EC_CANON_EOS_AvailListChanged` handler the enum value array is allocated with\n`dpd->FORM.Enum.SupportedValue = calloc (dpd_count, sizeof (PTPPropValue));` but the result\nis never checked for `NULL`. `dpd_count` is device-controlled (only bounded by\n`dpd_count < 2<<16`), so a large allocation under memory pressure returns `NULL` and the\nfollowing loops write `dpd->FORM.Enum.SupportedValue[j].u16 = ...` (and the `XX(...)` macro\nwrites) through a NULL pointer - a crash / NULL-deref write.","fix":"Check the allocation: `dpd->FORM.Enum.SupportedValue = calloc(dpd_count, sizeof(PTPPropValue));\nif (!dpd->FORM.Enum.SupportedValue) { dpd->FORM.Enum.NumberOfValues = 0; break; }` before the\nfill loops.","locations":[{"ref":"src/ptp-pack.c:2050-2062","code":" 2050 | \t\t\tdpd->FORM.Enum.NumberOfValues = dpd_count;\n 2051 | \t\t\tfree (dpd->FORM.Enum.SupportedValue);\n 2052 | \t\t\tdpd->FORM.Enum.SupportedValue = calloc (dpd_count, sizeof (PTPPropValue));\n 2053 | \n 2054 | \t\t\tswitch (dpc) {\n 2055 | \t\t\tcase PTP_DPC_CANON_EOS_ImageFormat:\n 2056 | \t\t\tcase PTP_DPC_CANON_EOS_ImageFormatCF:\n 2057 | \t\t\tcase PTP_DPC_CANON_EOS_ImageFormatSD:\n 2058 | \t\t\tcase PTP_DPC_CANON_EOS_ImageFormatExtHD:\n 2059 | \t\t\t\t/* special handling of ImageFormat properties */\n 2060 | \t\t\t\tfor (j=0;j<dpd_count;j++) {\n 2061 | \t\t\t\t\tdpd->FORM.Enum.SupportedValue[j].u16 = ptp_unpack_EOS_ImageFormat( params, &xdata, &xsize );\n 2062 | \t\t\t\t\tptp_debug (params, INDENT \"prop %x option[%2d] == 0x%04x\", dpc, j, dpd->FORM.Enum.SupportedValue[j].u16);","lines":13,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/ptp-pack.c#L2050-L2062"},{"ref":"src/ptp-pack.c:2069-2085","code":" 2069 | \t\t\t\t\tif (sizeof(dpd->FORM.Enum.SupportedValue[j].TYPE)*dpd_count > xsize) {\t\\\n 2070 | \t\t\t\t\t\tptp_debug (params, \"%s size %lu does not match needed %u\", prefix, sizeof(dpd->FORM.Enum.SupportedValue[j].TYPE)*dpd_count, xsize);\t\\\n 2071 | \t\t\t\t\t\tbreak;\t\t\t\t\t\t\t\\\n 2072 | \t\t\t\t\t}\t\t\t\t\t\t\t\t\\\n 2073 | \t\t\t\t\tfor (j=0;j<dpd_count;j++) { \t\t\t\t\t\\\n 2074 | \t\t\t\t\t\tdpd->FORM.Enum.SupportedValue[j].TYPE = CONV(xdata); \t\\\n 2075 | \t\t\t\t\t\tptp_debug (params, INDENT \"prop %x option[%2d] == 0x%02x\", dpc, j, CONV(xdata)); \\\n 2076 | \t\t\t\t\t\txdata += 4; /* might only be for propxtype 3 */ \\\n 2077 | \t\t\t\t\t} \\\n 2078 | \t\t\t\t\tbreak;\n 2079 | \n 2080 | \t\t\t\tcase PTP_DTC_INT16:\tXX( i16, dtoh16a );\n 2081 | \t\t\t\tcase PTP_DTC_UINT16:\tXX( u16, dtoh16a );\n 2082 | \t\t\t\tcase PTP_DTC_UINT32:\tXX( u32, dtoh32a );\n 2083 | \t\t\t\tcase PTP_DTC_INT32:\tXX( i32, dtoh32a );\n 2084 | \t\t\t\tcase PTP_DTC_UINT8:\tXX( u8,  dtoh8a );\n 2085 | \t\t\t\tcase PTP_DTC_INT8:\tXX( i8,  dtoh8a );","lines":17,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/ptp-pack.c#L2069-L2085"}]},{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`ptp_unpack_Nikon_EC` and `ptp_unpack_Nikon_EC_EX` allocate the event array with\n`calloc((*cnt), sizeof(PTPContainer))` without checking for `NULL`. `*cnt` is derived from a\ndevice-supplied 16-bit count, so the allocation can fail, after which the fill loops\ndereference the NULL pointer (`(*ec)[i].Code = ...`) causing a crash. (`ptp_unpack_Nikon_EC`\nalso returns `void`, so it cannot even signal the failure.)","fix":"After each `calloc`, check `if (!*ec) { *cnt = 0; return; /* or return 0 */ }` before the\nfill loop.","locations":[{"ref":"src/ptp-pack.c:2725-2732","code":" 2725 | \t*ec = calloc((*cnt), sizeof(PTPContainer));\n 2726 | \n 2727 | \tfor (i=0;i<*cnt;i++) {\n 2728 | \t\tmemset(&(*ec)[i],0,sizeof(PTPContainer));\n 2729 | \t\t(*ec)[i].Code\t= dtoh16a(&data[PTP_nikon_ec_Code+PTP_nikon_ec_Size*i]);\n 2730 | \t\t(*ec)[i].Param1\t= dtoh32a(&data[PTP_nikon_ec_Param1+PTP_nikon_ec_Size*i]);\n 2731 | \t\t(*ec)[i].Nparam\t= 1;\n 2732 | \t}","lines":8,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/ptp-pack.c#L2725-L2732"},{"ref":"src/ptp-pack.c:2757-2775","code":" 2757 | \t*ec = calloc((*cnt), sizeof(PTPContainer));\n 2758 | \toffset = 4;\n 2759 | \n 2760 | \tfor (i=0;i<*cnt;i++) {\n 2761 | \t\tif (len < offset + 4)\n 2762 | \t\t\tgoto error;\n 2763 | \n 2764 | \t\t(*ec)[i].Code\t= dtoh16o(data, offset);\n 2765 | \t\t(*ec)[i].Nparam\t= dtoh16o(data, offset);\n 2766 | \t\tptp_debug (params, \"nikon eventex %d: code 0x%04x, params %d\", i, (*ec)[i].Code, (*ec)[i].Nparam);\n 2767 | \t\tif (((*ec)[i].Nparam > 5) || (len < offset + ((*ec)[i].Nparam*sizeof(uint32_t))))\n 2768 | \t\t\tgoto error;\n 2769 | \n 2770 | \t\tif ((*ec)[i].Nparam >= 1) (*ec)[i].Param1 = dtoh32o(data, offset);\n 2771 | \t\tif ((*ec)[i].Nparam >= 2) (*ec)[i].Param2 = dtoh32o(data, offset);\n 2772 | \t\tif ((*ec)[i].Nparam >= 3) (*ec)[i].Param3 = dtoh32o(data, offset);\n 2773 | \t\tif ((*ec)[i].Nparam >= 4) (*ec)[i].Param4 = dtoh32o(data, offset);\n 2774 | \t\tif ((*ec)[i].Nparam == 5) (*ec)[i].Param5 = dtoh32o(data, offset);\n 2775 | \t}","lines":19,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/ptp-pack.c#L2757-L2775"}]},{"id":"ERR_9","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"Several allocations dereference their result without a NULL check: `parse_extension_descriptor()` `extension = malloc(...)` then `extension->name = name`; `LIBMTP_Read_Event_Async()` `data = malloc(...)` then `data->cb = cb`; `add_error_to_errorstack()` `newerror = malloc(...)` then `newerror->errornumber = ...` (also unchecked `strdup`); `LIBMTP_Get_Storage()` `storage = malloc(...)` then `storage->prev = ...` (two sites); `LIBMTP_Get_Supported_Filetypes()` `localtypes = malloc(...)`. On allocation failure these NULL-dereference and crash.","fix":"Check each `malloc`/`strdup` result for NULL and handle the failure (return an error / skip) before dereferencing.","locations":[{"ref":"src/libmtp.c:1887-1891","code":" 1887 |             extension = malloc(sizeof(LIBMTP_device_extension_t));\n 1888 |             extension->name = name;\n 1889 |             extension->major = major;\n 1890 |             extension->minor = minor;\n 1891 |             extension->next = NULL;","lines":5,"link":"https://github.com/libmtp/libmtp/blob ndle =` store). Additionally this per-connection allocation is never freed in `close_usb()`/`close_device()`, leaking one handle wrapper per device open.","fix":"Check the `malloc` result and free `ptp_usb->handle` in `close_usb` after `openusb_close_device`.","locations":[{"ref":"src/libopenusb1-glue.c:1776-1777","code":" 1776 |     ptp_usb->handle = malloc(sizeof(openusb_dev_handle_t));\n 1777 |     *ptp_usb->handle = device_handle;","lines":2,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libopenusb1-glue.c#L1776-L1777"},{"ref":"src/libopenusb1-glue.c:1950-1982","code":" 1950 | static void close_usb(PTP_USB* ptp_usb) {\n 1951 |     if (!FLAG_NO_RELEASE_INTERFACE(ptp_usb)) {\n 1952 |         /*\n 1953 |          * Clear any stalled endpoints\n 1954 |          * On misbehaving devices designed for Windows/Mac, quote from:\n 1955 |          * http://www2.one-eyed-alien.net/~mdharm/linux-usb/target_offenses.txt\n 1956 |          * Device does Bad Things(tm) when it gets a GET_STATUS after CLEAR_HALT\n 1957 |          * (...) Windows, when clearing a stall, only sends the CLEAR_HALT command,\n 1958 |          * and presumes that the stall has cleared.  Some devices actually choke\n 1959 |          * if the CLEAR_HALT is followed by a GET_STATUS (used to determine if the\n 1960 |          * STALL is persistant or not).\n 1961 |          */\n 1962 |         clear_stall(ptp_usb);\n 1963 |         // Clear halts on any endpoints\n 1964 |         clear_halt(ptp_usb);\n 1965 |         // Added to clear some stuff on the OUT endpoint\n 1966 |         // TODO: is this good on the Mac too?\n 1967 |         // HINT: some devices may need that you comment these two out too.\n 1968 |         //libusb_clear_halt(ptp_usb->handle, ptp_usb->outep);\n 1969 |         //libusb_release_interface(ptp_usb->handle, (int) ptp_usb->interface);\n 1970 |     }\n 1971 |     if (FLAG_FORCE_RESET_ON_CLOSE(ptp_usb)) {\n 1972 |         /*\n 1973 |          * Some devices really love to get reset after being\n 1974 |          * disconnected. Again, since Windows never disconnects\n 1975 |          * a device closing behaviour is seldom or never exercised\n 1976 |          * on devices when engineered and often error prone.\n 1977 |          * Reset may help some.\n 1978 |          */\n 1979 |         openusb_reset(*ptp_usb->handle);\n 1980 |     }\n 1981 |     openusb_close_device(*ptp_usb->handle);\n 1982 | }","lines":33,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libopenusb1-glue.c#L1950-L1982"}]},{"id":"ERR_11","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `write_from_spl_text_t()` the payload write result is accumulated onto a nonzero running total before the error test: `ret += write(fd, t, len);` then `if(ret < 0)`. Because `ret` already holds `2` (BOM) or `2` (faked from the previous line), a single `write()` returning `-1` yields `ret == 1`, so the `ret < 0` branch is not taken and the failure is misreported as merely a wrong-byte-count. Write errors can be silently mis-handled.","fix":"Capture the individual write return in a separate variable and test it directly, e.g. `ssize_t n = write(fd, t, len); if(n < 0) { ...error... } else ret += n;` rather than testing the running total.","locations":[{"ref":"src/playlist-spl.c:473-482","code":"  473 |     ret += write(fd, t, len);\n  474 | \n  475 |     // release the converted string\n  476 |     free(t);\n  477 | \n  478 |     // check for failures\n  479 |     if(ret < 0)\n  480 |       LIBMTP_ERROR(\"write spl file failed: %s\\n\", strerror(errno));\n  481 |     else if(ret != len +2)\n  482 |       LIBMTP_ERROR(\"write spl file wrong number of bytes ret=%d len=%d '%s'\\n\", (int)ret, (int)len, p->text);","lines":10,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/playlist-spl.c#L473-L482"}]},{"id":"ERR_12","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"Many pack helpers call `malloc`/`calloc` and immediately write to the returned pointer\nwithout a NULL check: `ptp_pack_OI` (`oidata=malloc(...)` then `memset`/`htod32a`),\n`ptp_pack_DPV` (every `dpv=malloc(size)` branch then `htodNa(dpv,...)`), and `ptp_pack_OPL`\n(`opldata = malloc(totalsize)` then `htod32a(&opldata[bufp],...)`). On allocation failure\nthese dereference `NULL`. `ptp_pack_DPV` additionally can leave `dpv == NULL` / `size == 0`\nfor an unsupported datatype, which `ptp_pack_OPL` then `memcpy`s from.","fix":"Check each allocation for `NULL` and return 0 / propagate an error before writing. In\n`ptp_pack_OPL`, also skip entries whose `ptp_pack_DPV` returned `NULL`/0.","locations":[{"ref":"src/ptp-pack.c:433-439","code":"  433 | \toidata=malloc(PTP_oi_MaxLen + params->ocs64*4);\n  434 | \t*oidataptr=oidata;\n  435 | \t/* the caller should free it after use! */\n  436 | #if 0\n  437 | \tchar *capture_date=\"20020101T010101\"; /* XXX Fake date */\n  438 | #endif\n  439 | \tmemset (oidata, 0, PTP_oi_MaxLen + params->ocs64*4);","lines":7,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/ptp-pack.c#L433-L439"},{"ref":"src/ptp-pack.c:1096-1097","code":" 1096 | \t\tdpv=malloc(size);\n 1097 | \t\thtod8a(dpv,value->i8);","lines":2,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/ptp-pack.c#L1096-L1097"},{"ref":"src/ptp-pack.c:1236-1238","code":" 1236 | \topldata = malloc(totalsize);\n 1237 | \n 1238 | \thtod32a(&opldata[bufp],noitems);","lines":3,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/ptp-pack.c#L1236-L1238"}]},{"id":"ERR_13","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`duplicate_PropertyValue` and `duplicate_DevicePropDesc` allocate arrays with\n`calloc(src->a.count, ...)` / `calloc(src->FORM.Enum.NumberOfValues, ...)` and immediately\nwrite into them in a loop without checking for `NULL`. The counts originate from\ndevice-parsed data, so a failed allocation leads to a NULL-deref write.","fix":"Check the `calloc` result before the fill loop and bail out (set count to 0 / return) on\n`NULL`.","locations":[{"ref":"src/ptp-pack.c:943-946","code":"  943 | \t\tdst->a.count = src->a.count;\n  944 | \t\tdst->a.v = calloc (src->a.count, sizeof(src->a.v[0]));\n  945 | \t\tfor (i=0;i<src->a.count;i++)\n  946 | \t\t\tduplicate_PropertyValue (&src->a.v[i], &dst->a.v[i], type & ~PTP_DTC_ARRAY_MASK);","lines":4,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/ptp-pack.c#L943-L946"},{"ref":"src/ptp-pack.c:986-989","code":"  986 | \t\tdst->FORM.Enum.NumberOfValues = src->FORM.Enum.NumberOfValues;\n  987 | \t\tdst->FORM.Enum.SupportedValue = calloc (src->FORM.Enum.NumberOfValues, sizeof(dst->FORM.Enum.SupportedValue[0]));\n  988 | \t\tfor (i = 0; i<src->FORM.Enum.NumberOfValues ; i++)\n  989 | \t\t\tduplicate_PropertyValue (&src->FORM.Enum.SupportedValue[i], &dst->FORM.Enum.SupportedValue[i], src->DataType);","lines":4,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/ptp-pack.c#L986-L989"}]},{"id":"ERR_14","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"The `strndup` fallback does not check the result of `malloc(n + 1)`; if allocation fails, `strncpy(ret, s, n)` dereferences a `NULL` pointer and crashes. Additionally, unlike POSIX `strndup` (which reads at most `n` bytes), this implementation calls `strlen(s)` on the whole input first, so it over-reads if the caller passes a buffer that is not `NUL`-terminated within `n` bytes.","fix":"Check `ret` for `NULL` after `malloc` and return `NULL` on failure. Optionally use `strnlen(s, n)` instead of `strlen(s)` to bound the read to `n` bytes and match POSIX `strndup` semantics.","locations":[{"ref":"src/util.c:137-150","code":"  137 | #ifndef HAVE_STRNDUP\n  138 | char *strndup (const char *s, size_t n)\n  139 | {\n  140 |   size_t len = strlen (s);\n  141 |   char *ret;\n  142 | \n  143 |   if (len <= n)\n  144 |     return strdup (s);\n  145 | \n  146 |   ret = malloc(n + 1);\n  147 |   strncpy(ret, s, n);\n  148 |   ret[n] = '\\0';\n  149 |   return ret;\n  150 | }","lines":14,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/util.c#L137-L150"}]},{"id":"ERR_15","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`has_3_ep()` returns `-1` when it cannot `open()` the `bNumEndpoints` file. `check_interface()` propagates that with `if (ret <= 0) return ret;`, so it returns `-1`. But `check_sysfs()` only treats a return value `> 0` as a candidate (`if (check_interface(dirbuf) > 0) look_closer = 1;`), so the error is silently swallowed and `look_closer` stays `0`. If every scanned interface either fails to open or is not an MTP candidate, `check_sysfs()` returns `0`, and `main()` then skips the deeper probe entirely (`if (ret != 0) ret = LIBMTP_Check_Specific_Device(...)`). A transient failure reading `bNumEndpoints` for the real MTP interface therefore causes the device to be reported as non-MTP with no fallback, instead of falling through to the authoritative `LIBMTP_Check_Specific_Device()` check.","fix":"Distinguish \"scanned and found nothing\" from \"could not determine\". Have `check_sysfs()` remember whether any `check_interface()` returned a negative (error) result and return `-1` in that case, so `main()` falls through to `LIBMTP_Check_Specific_Device()`. Alternatively, in `check_sysfs()` bail to a \"look closer\" result on error rather than ignoring negative returns.","locations":[{"ref":"util/mtp-probe.c:133-160","code":"  133 | static int has_3_ep(char *path)\n  134 | {\n  135 |   char pbuf[FILENAME_MAX];\n  136 |   int len = strlen(path);\n  137 |   int fd;\n  138 |   char buf[128];\n  139 |   int bread;\n  140 | \n  141 |   strcpy(pbuf, path);\n  142 |   pbuf[len++] = '/';\n  143 |   strncpy(pbuf + len, \"bNumEndpoints\", FILENAME_MAX - len);\n  144 |   pbuf[FILENAME_MAX - 1] = '\\0'; /* Sentinel */\n  145 | \n  146 |   fd = open(pbuf, O_RDONLY);\n  147 |   if (fd < 0)\n  148 |     return -1;\n  149 |   /* Read all contents to buffer */\n  150 |   bread = read(fd, buf, sizeof(buf));\n  151 |   close(fd);\n  152 |   if (bread < 2)\n  153 |     return 0;\n  154 | \n  155 |   /* 0x30, 0x33 = \"03\", maybe we should parse it? */\n  156 |   if (buf[0] == 0x30 && buf[1] == 0x33)\n  157 |     return 1;\n  158 | \n  159 |   return 0;\n  160 | }","lines":28,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/util/mtp-probe.c#L133-L160"},{"ref":"util/mtp-probe.c:174-176","code":"  174 |   ret = has_3_ep(sysfspath);\n  175 |   if (ret <= 0)\n  176 |     return ret;","lines":3,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/util/mtp-probe.c#L174-L176"},{"ref":"util/mtp-probe.c:272-282","code":"  272 |     if (S_ISDIR(st.st_mode)) {\n  273 |       if (!regexec(&r, dent->d_name, 0, 0, 0))\n  274 |       if (check_interface(dirbuf) > 0)\n  275 | \t/* potential MTP interface! */\n  276 | \tlook_closer = 1;\n  277 |     }\n  278 |   }\n  279 | \n  280 |   regfree(&r);\n  281 |   closedir(dir);\n  282 |   return look_closer;","lines":11,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/util/mtp-probe.c#L272-L282"},{"ref":"util/mtp-probe.c:304-311","code":"  304 |   ret = check_sysfs(fname);\n  305 |   /*\n  306 |    * This means that regular directory check either agrees that this may be a\n  307 |    * MTP device, or that it doesn't know (failed). In that case, kick the deeper\n  308 |    * check inside LIBMTP.\n  309 |    */\n  310 |   if (ret != 0)\n  311 |     ret = LIBMTP_Check_Specific_Device(busno, devno);","lines":8,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/util/mtp-probe.c#L304-L311"}]},{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"The array abstraction has no separate capacity field; `array_extend_capacity` always `realloc`s to exactly `len + LEN` elements. Consequently `array_push_back` / `array_push_back_empty` trigger a `realloc` on every single insertion, giving O(n^2) copying behaviour when building an array element by element. The doc comment advertises this as an STL-like container, but `std::vector`-style amortized growth is absent.","fix":"Track a separate capacity and grow geometrically (e.g. double capacity when full), reallocating only when `len == capacity`, so repeated `array_push_back` is amortized O(1).","locations":[{"ref":"src/array.h:79-96","code":"   79 | #define array_extend_capacity(ARRAY, LEN) do { \\\n   80 | \t(ARRAY)->val = realloc((ARRAY)->val, ((ARRAY)->len + (LEN)) * sizeof((ARRAY)->val[0])); \\\n   81 | \tif (!(ARRAY)->val) { \\\n   82 | \t\tGP_LOG_E (\"Out of memory: 'realloc' of %ld bytes failed.\", ((ARRAY)->len + (LEN)) * sizeof((ARRAY)->val[0])); \\\n   83 | \t\treturn GP_ERROR_NO_MEMORY; \\\n   84 | \t} \\\n   85 | \tmemset((ARRAY)->val + (ARRAY)->len, 0, LEN * sizeof((ARRAY)->val[0])); \\\n   86 | } while(0)\n   87 | \n   88 | #define array_push_back_empty(ARRAY, PITER) do { \\\n   89 | \tarray_extend_capacity(ARRAY, 1); \\\n   90 | \t*PITER = &(ARRAY)->val[(ARRAY)->len++]; \\\n   91 | } while(0)\n   92 | \n   93 | #define array_push_back(ARRAY, VAL) do { \\\n   94 | \tarray_extend_capacity(ARRAY, 1); \\\n   95 | \t(ARRAY)->val[(ARRAY)->len++] = VAL; \\\n   96 | } while(0)","lines":18,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/array.h#L79-L96"}]},{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`LIBMTP_Get_Representative_Sample()` stores a byte array but allocates `malloc(sizeof(PTPPropValue) * propval.a.count)` for `sampledata->data` (an `unsigned char*`), over-allocating by a factor of `sizeof(PTPPropValue)` (~16x). With a device-controlled `propval.a.count` this also risks an integer-overflow of the size on 32-bit platforms. Only `propval.a.count` bytes are ever written.","fix":"Allocate `malloc(propval.a.count)` (one byte per element), check the result, and validate `count` against a sane bound.","locations":[{"ref":"src/libmtp.c:9202-9207","code":" 9202 |   sampledata->size = propval.a.count;\n 9203 |   sampledata->data = malloc(sizeof(PTPPropValue) * propval.a.count);\n 9204 |   for (i = 0; i < propval.a.count; i++) {\n 9205 |     sampledata->data[i] = propval.a.v[i].u8;\n 9206 |   }\n 9207 |   free(propval.a.v);","lines":6,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libmtp.c#L9202-L9207"}]},{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"In openusb `probe_device_descriptor()` the interface-string probe is stubbed out: the `libusb_get_string_descriptor_ascii` call is commented (`// FIXME: DK: Find out how to get the string descriptor`), yet `buf[0] = '\\0'; ... if (ret < 3) continue; if (strstr((char*)buf, \"MTP\") ...)` remains. `ret` still holds the return of the earlier `openusb_parse_device_desc` and `buf` is empty, so the whole `strstr`/MTP-name detection is dead and can never match. The `k` altsetting index is also passed to `openusb_parse_interface_desc` post-incremented, so the fprintf reports the wrong altsetting.","fix":"Either implement the interface-string read via the openusb API or remove the dead detection block so the (mis)use of stale `ret`/empty `buf` cannot mislead.","locations":[{"ref":"src/libopenusb1-glue.c:296-316","code":"  296 |                 buf[0] = '\\0';\n  297 |                 // FIXME: DK: Find out how to get the string descriptor for an interface?\n  298 |                 /*\n  299 |                                 ret = libusb_get_string_descriptor_ascii(devh,\n  300 |                                         config->interface[j].altsetting[k].iInterface,\n  301 |                                         buf,\n  302 |                                         1024);\n  303 |                  */\n  304 |                 if (ret < 3)\n  305 |                     continue;\n  306 |                 if (strstr((char *) buf, \"MTP\") != NULL) {\n  307 |                     if (dumpfile != NULL) {\n  308 |                         fprintf(dumpfile, \"Configuration %d, interface %d, altsetting %d:\\n\", i, j, k);\n  309 |                         fprintf(dumpfile, \"   Interface description contains the string \\\"MTP\\\"\\n\");\n  310 |                         fprintf(dumpfile, \"   Device recognized as MTP, no further probing.\\n\");\n  311 |                     }\n  312 |                     //libusb_free_config_descriptor(config);\n  313 |                     openusb_close_device(*devh);\n  314 |                     return 1;\n  315 |                 }\n  316 |             }","lines":21,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libopenusb1-glue.c#L296-L316"}]},{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`mtpz_encryption_cipher` is declared and defined but never called anywhere in the codebase (only `mtpz_encryption_cipher_advanced` is used). Besides being dead code, it also leaks its `expanded` key schedule (allocated by `mtpz_encryption_expand_key`, never freed) and silently does nothing when `len` is not a multiple of 16.","fix":"Remove the unused `mtpz_encryption_cipher` function (and its forward declaration at line 272), or if kept, add `free(expanded);` and handle the non-block-aligned case.","locations":[{"ref":"src/mtpz.c:577-603","code":"  577 | void mtpz_encryption_cipher(unsigned char *data, unsigned int len, char encrypt)\n  578 | {\n  579 | \tunsigned char *expanded = NULL;\n  580 | \n  581 | \tint offset = 0, count = len;\n  582 | \n  583 | \tif ((count & 0x0F) == 0)\n  584 | \t{\n  585 | \t\tint exp_len = 0;\n  586 | \t\texpanded = mtpz_encryption_expand_key((unsigned char *)MTPZ_ENCRYPTION_KEY, 16, 10, &exp_len);\n  587 | \n  588 | \t\tif (count != 0)\n  589 | \t\t{\n  590 | \t\t\tdo\n  591 | \t\t\t{\n  592 | \t\t\t\tif (encrypt)\n  593 | \t\t\t\t\tmtpz_encryption_encrypt_custom(data + offset, NULL, expanded);\n  594 | \t\t\t\telse\n  595 | \t\t\t\t\tmtpz_encryption_decrypt_custom(data + offset, NULL, expanded);\n  596 | \n  597 | \t\t\t\tcount -= 16;\n  598 | \t\t\t\toffset += 16;\n  599 | \t\t\t}\n  600 | \t\t\twhile (count != 0);\n  601 | \t\t}\n  602 | \t}\n  603 | }","lines":27,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/mtpz.c#L577-L603"}]},{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"In `ptp_canon_getobjectinfo` the per-iteration guard `if (size < i*PTP_CANON_FolderEntryLen) break;` is off-by-one (it should be `(i+1)*...` to guarantee the whole entry fits). It is effectively dead because the earlier check `if (ptp.Param1 > size/PTP_CANON_FolderEntryLen) goto error;` already bounds `*entnum`, but the loop check as written is misleading and does not actually protect the `ptp_unpack_Canon_FE` read.","fix":"Either remove the redundant check or make it correct: `if (size < (i+1)*PTP_CANON_FolderEntryLen) break;`.","locations":[{"ref":"src/ptp.c:4136-4141","code":" 4136 | \tfor(i=0; i<(*entnum); i++) {\n 4137 | \t\tif (size < i*PTP_CANON_FolderEntryLen) break;\n 4138 | \t\tptp_unpack_Canon_FE(params,\n 4139 | \t\t\t\t    data+i*PTP_CANON_FolderEntryLen,\n 4140 | \t\t\t\t    &((*entries)[i]) );\n 4141 | \t}","lines":6,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/ptp.c#L4136-L4141"}]},{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The macro is defined as `free_array_recusive` (missing the second `r`), but the usage example in the header's doc comment calls `free_array_recursive` (correctly spelled). The documented name does not exist, so anyone copying the example gets an undefined-identifier error, and the macro name itself is a visible typo in the public helper API.","fix":"Rename the macro to `free_array_recursive` (fix line 73 and any callers) so it matches the documented spelling. Before: `#define free_array_recusive(ARRAY, DESTRUCTOR)` After: `#define free_array_recursive(ARRAY, DESTRUCTOR)`","locations":[{"ref":"src/array.h:47","code":"   47 |  * free_array_recursive(&objects, ptp_free_object);","lines":1,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/array.h#L47"},{"ref":"src/array.h:73","code":"   73 | #define free_array_recusive(ARRAY, DESTRUCTOR) do { \\","lines":1,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/array.h#L73"}]},{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The temp-file name templates and log messages are copy-paste inconsistent. In `spl_to_playlist_t()` (the .spl -> playlist_t direction) the temp file is named `\"/tmp/mtp-spl2pl-XXXXXX\"` and errors say `\"%s.spl -> %s\"`, which is correct; but `playlist_t_to_spl()` (the playlist_t -> .spl direction) reuses the same `mtp-spl2pl` name and the same `\"%s.spl -> %s\"` wording even though it is converting the other way. The name/message misdescribe the direction, which is misleading when debugging temp-file failures.","fix":"Rename the template in `playlist_t_to_spl()` (e.g. `\"/tmp/mtp-pl2spl-XXXXXX\"`) and correct the log wording to reflect the pl -> .spl direction.","locations":[{"ref":"src/playlist-spl.c:191-203","code":"  191 |   char tmpname[] = \"/tmp/mtp-spl2pl-XXXXXX\"; // must be a var since mkstemp modifies it\n  192 | \n  193 |   LIBMTP_PLST_DEBUG(\"pl->name='%s'\\n\",pl->name);\n  194 | \n  195 |   // open a file descriptor\n  196 |   int fd = mkstemp(tmpname);\n  197 |   if(fd < 0) {\n  198 |     LIBMTP_ERROR(\"failed to make temp file for %s.spl -> %s, errno=%s\\n\", pl->name, tmpname, strerror(errno));\n  199 |     return -1;\n  200 |   }\n  201 |   // make sure the file will be deleted afterwards\n  202 |   if(unlink(tmpname) < 0)\n  203 |     LIBMTP_ERROR(\"failed to delete temp file for %s.spl -> %s, errno=%s\\n\", pl->name, tmpname, strerror(errno));","lines":13,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/playlist-spl.c#L191-L203"}]},{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The comment on `PTP_CHDK_CAPTURE_JPG` reads \"Note supported on all cameras, use Lua get_usb_capture_support to check\", which contradicts itself: it is missing the negation and clearly means the format is NOT supported on all cameras (hence the instruction to query support). As written it misleads readers into thinking JPEG capture is universally available.","fix":"Fix the typo. Before: `Full jpeg file. Note supported on all cameras, ...` After: `Full jpeg file. Not supported on all cameras, use Lua get_usb_capture_support to check`.","locations":[{"ref":"src/chdk_ptp.h:570-573","code":"  570 | /*\n  571 | Full jpeg file. Note supported on all cameras, use Lua get_usb_capture_support to check\n  572 | */\n  573 | #define PTP_CHDK_CAPTURE_JPG    0x1 ","lines":4,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/chdk_ptp.h#L570-L573"}]},{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The `bytes = malloc(CONTEXT_BLOCK_SIZE);` allocation in `ptp_write_func` is annotated `// This is the largest block we'll need to read in.` - a copy-paste from `ptp_read_func`; this is the *write* buffer. Present in both glue files.","fix":"Reword to `// This is the largest block we'll need to write out.`","locations":[{"ref":"src/libusb-glue.c:974","code":"  974 |   // This is the largest block we'll need to read in.","lines":1,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libusb-glue.c#L974"},{"ref":"src/libopenusb1-glue.c:958","code":"  958 |     // This is the largest block we'll need to read in.","lines":1,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libopenusb1-glue.c#L958"}]},{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"In `ptp_write_func` the comment on the scratch buffer says it is for reading, but the buffer is used for writing (data is fetched via `getfunc` and sent with `USB_BULK_WRITE`). Copy-paste from `ptp_read_func`.","fix":"Change the comment before `bytes = malloc(CONTEXT_BLOCK_SIZE);` from `// This is the largest block we'll need to read in.` to `// This is the largest block we'll need to write out.`","locations":[{"ref":"src/libusb1-glue.c:1070-1071","code":" 1070 |   // This is the largest block we'll need to read in.\n 1071 |   bytes = malloc(CONTEXT_BLOCK_SIZE);","lines":2,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libusb1-glue.c#L1070-L1071"}]},{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"The doc comment states `@param dump_boundry the address offset to start at (usually 0)`, but the function prints `dump_boundry-0x10` for the first line. bel":"Duplicate Code","severity":"low","difficulty":"easy","description":"music-players.h contains multiple rows with an identical VID/PID pair (same vendor id and product id). Because device lookup returns the first match, the second row is unreachable dead data, and several look like copy-paste PID mistakes: `0x0502/0x3750` used for both `\"Liquid Z220 (ID2)\"` and `\"Liquid Z330\"`; `0x0502/0x3841` for both `\"Iconia One 10\"` and `\"B3-A20\"`; `0x17ef/0x79de` for `\"Tab 3 10 Plus\"` and `\"TB3-850M \"`; `0x17ef/0x7a36` for `\"C2\"` and `\"P2c72\"`; `0x091e/0x4f43` for `\"Euduro 2\"` and `\"Fenix 7\"`; `0x271d/0x4016` for `\"Energy P5\"` and `\"Studio Energy X 2 Phone\"`; and notably `0x0489/0xc025` maps to two different vendors, `\"Foxconn (for InFocus)\" M810` and `\"SHARP Corporation\" SH930W`. All duplicated pairs carry identical flags, so behavior is unaffected, but the extra rows are misleading and at least one PID is likely wrong (e.g. Liquid Z330).","fix":"Verify each duplicated PID against its source report; correct the ones that are copy-paste PID typos (e.g. the real Liquid Z330 PID) and merge/remove the genuinely redundant rows so each VID/PID appears once.","locations":[{"ref":"src/music-players.h:630-634","code":"  630 |   { \"Acer\", 0x0502, \"Liquid Z220 (ID2)\", 0x3750,\n  631 |       DEVICE_FLAGS_ANDROID_BUGS },\n  632 |   /* https://sourceforge.net/p/libmtp/bugs/1478/ */\n  633 |   { \"Acer\", 0x0502, \"Liquid Z330\", 0x3750,\n  634 |       DEVICE_FLAGS_ANDROID_BUGS },","lines":5,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/music-players.h#L630-L634"},{"ref":"src/music-players.h:645-649","code":"  645 |   { \"Acer\", 0x0502, \"Iconia One 10\", 0x3841,\n  646 |       DEVICE_FLAGS_ANDROID_BUGS },\n  647 |   /* https://sourceforge.net/p/libmtp/support-requests/279/ */\n  648 |   { \"Acer\", 0x0502, \"B3-A20\", 0x3841,\n  649 |       DEVICE_FLAGS_ANDROID_BUGS },","lines":5,"link":"https://github.com/lib
