<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e2e8f0;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#64748b;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#cbd5e1;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#94a3b8}
.project-info .pi-row .pi-k{color:#64748b}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#94a3b8;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#475569;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e2e8f0;border-color:#475569}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#64748b;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#94a3b8;border-color:#475569}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#475569;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#64748b;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#94a3b8;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e2e8f0}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#475569}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#94a3b8;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e2e8f0}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#cbd5e1}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#475569;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#64748b}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#64748b}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#64748b;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#64748b;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e2e8f0}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#cbd5e1;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#475569;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e2e8f0;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

<script type="application/json" id="D">[{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`adjust_u16()` and `adjust_u32()` perform `val % opd->FORM.Range.StepSize.u16` / `.u32` when `opd->FormFlag == PTP_DPFF_Range` without checking that the step size is non-zero. The `PTPObjectPropDesc` comes straight from the device via `ptp_mtp_getobjectpropdesc()` (e.g. inside `LIBMTP_Update_Track_Metadata()` at the `PTP_OPC_Duration`/`PTP_OPC_SampleRate` cases). A malicious or buggy device that advertises a range property with `StepSize == 0` triggers an integer division-by-zero, crashing the process with SIGFPE.","fix":"Guard the modulo: only round to step when `opd->FORM.Range.StepSize.u16 != 0` (resp. `.u32`), otherwise return the clamped `val` unchanged.","locations":[{"ref":"src/libmtp.c:851-889","code":"  851 | static uint16_t adjust_u16(uint16_t val, PTPObjectPropDesc *opd)\n  852 | {\n  853 |   switch (opd->FormFlag) {\n  854 |   case PTP_DPFF_Range:\n  855 |     if (val < opd->FORM.Range.MinValue.u16) {\n  856 |       return opd->FORM.Range.MinValue.u16;\n  857 |     }\n  858 |     if (val > opd->FORM.Range.MaxValue.u16) {\n  859 |       return opd->FORM.Range.MaxValue.u16;\n  860 |     }\n  861 |     // Round down to last step.\n  862 |     if (val % opd->FORM.Range.StepSize.u16 != 0) {\n  863 |       return val - (val % opd->FORM.Range.StepSize.u16);\n  864 |     }\n  865 |     return val;\n  866 |     break;\n  867 |   case PTP_DPFF_Enumeration:\n  868 |     {\n  869 |       int i;\n  870 |       uint16_t bestfit = opd->FORM.Enum.SupportedValue[0].u16;\n  871 | \n  872 |       for (i=0; i<opd->FORM.Enum.NumberOfValues; i++) {\n  873 | \tif (val == opd->FORM.Enum.SupportedValue[i].u16) {\n  874 | \t  return val;\n  875 | \t}\n  876 | \t// Rough guess of best fit\n  877 | \tif (opd->FORM.Enum.SupportedValue[i].u16 < val) {\n  878 | \t  bestfit = opd->FORM.Enum.SupportedValue[i].u16;\n  879 | \t}\n  880 |       }\n  881 |       // Just some default that'll work.\n  882 |       return bestfit;\n  883 |     }\n  884 |   default:\n  885 |     // Will accept any value\n  886 |     break;\n  887 |   }\n  888 |   return val;\n  889 | }","lines":39,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libmtp.c#L851-L889"},{"ref":"src/libmtp.c:896-934","code":"  896 | static uint32_t adjust_u32(uint32_t val, PTPObjectPropDesc *opd)\n  897 | {\n  898 |   switch (opd->FormFlag) {\n  899 |   case PTP_DPFF_Range:\n  900 |     if (val < opd->FORM.Range.MinValue.u32) {\n  901 |       return opd->FORM.Range.MinValue.u32;\n  902 |     }\n  903 |     if (val > opd->FORM.Range.MaxValue.u32) {\n  904 |       return opd->FORM.Range.MaxValue.u32;\n  905 |     }\n  906 |     // Round down to last step.\n  907 |     if (val % opd->FORM.Range.StepSize.u32 != 0) {\n  908 |       return val - (val % opd->FORM.Range.StepSize.u32);\n  909 |     }\n  910 |     return val;\n  911 |     break;\n  912 |   case PTP_DPFF_Enumeration:\n  913 |     {\n  914 |       int i;\n  915 |       uint32_t bestfit = opd->FORM.Enum.SupportedValue[0].u32;\n  916 | \n  917 |       for (i=0; i<opd->FORM.Enum.NumberOfValues; i++) {\n  918 | \tif (val == opd->FORM.Enum.SupportedValue[i].u32) {\n  919 | \t  return val;\n  920 | \t}\n  921 | \t// Rough guess of best fit\n  922 | \tif (opd->FORM.Enum.SupportedValue[i].u32 < val) {\n  923 | \t  bestfit = opd->FORM.Enum.SupportedValue[i].u32;\n  924 | \t}\n  925 |       }\n  926 |       // Just some default that'll work.\n  927 |       return bestfit;\n  928 |     }\n  929 |   default:\n  930 |     // Will accept any value\n  931 |     break;\n  932 |   }\n  933 |   return val;\n  934 | }","lines":39,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libmtp.c#L896-L934"}]},{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"very_easy","description":"In `ptp_read_func()` the scratch buffer is allocated with `bytes = malloc(CONTEXT_BLOCK_SIZE);` and used immediately as the destination of `USB_BULK_READ` and `handler->putfunc` with no NULL check. If the allocation fails the code dereferences NULL. Note the sibling `ptp_write_func()` right below *does* check `if (!bytes) return PTP_ERROR_IO;`, so this is an inconsistent copy. The `libopenusb1-glue.c` `ptp_read_func` has the same unchecked `malloc`.","fix":"Add the same guard used in `ptp_write_func`:\n```\nbytes = malloc(CONTEXT_BLOCK_SIZE);\nif (!bytes)\n  return PTP_ERROR_IO;\n```","locations":[{"ref":"src/libusb-glue.c:848","code":"  848 |   bytes = malloc(CONTEXT_BLOCK_SIZE);","lines":1,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libusb-glue.c#L848"},{"ref":"src/libopenusb1-glue.c:815","code":"  815 |     bytes = malloc(CONTEXT_BLOCK_SIZE);","lines":1,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libopenusb1-glue.c#L815"}]},{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`generate_unique_filename()` calls `strrchr(filename,'.')` and, if the filename has no dot, `extension_position` is NULL. It is then used in `char basename[extension_position - filename + 1];` and `strncpy(basename, filename, extension_position - filename);` where `extension_position - filename` is a large negative pointer difference, producing a VLA of bogus size and an out-of-bounds copy - a crash / stack corruption. This runs whenever `FLAG_UNIQUE_FILENAMES` is set and an extension-less filename collides.","fix":"After `strrchr`, handle the `extension_position == NULL` case (no extension) explicitly, e.g. append the suffix to the whole name, before computing basename lengths.","locations":[{"ref":"src/libmtp.c:5710-5736","code":" 5710 | static char *generate_unique_filename(PTPParams* params, char const * const filename)\n 5711 | {\n 5712 |   int suffix;\n 5713 |   const char * extension_position;\n 5714 | \n 5715 |   if (check_filename_exists(params, filename))\n 5716 |   {\n 5717 |     extension_position = strrchr(filename,'.');\n 5718 | \n 5719 |     char basename[extension_position - filename + 1];\n 5720 |     strncpy(basename, filename, extension_position - filename);\n 5721 |     basename[extension_position - filename] = '\\0';\n 5722 | \n 5723 |     suffix = 1;\n 5724 |     char newname[ strlen(basename) + 6 + strlen(extension_position)];\n 5725 |     sprintf(newname, \"%s_%d%s\", basename, suffix, extension_position);\n 5726 |     while ((check_filename_exists(params, newname)) && (suffix < 1000000)) {\n 5727 |       suffix++;\n 5728 |       sprintf(newname, \"%s_%d%s\", basename, suffix, extension_position);\n 5729 |     }\n 5730 |   return strdup(newname);\n 5731 |   }\n 5732 |   else\n 5733 |   {\n 5734 |     return strdup(filename);\n 5735 |   }\n 5736 | }","lines":27,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libmtp.c#L5710-L5736"}]},{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`LIBMTP_Get_Representative_Sample_Format()` calls `ptp_mtp_getobjectpropdesc(..., PTP_OPC_RepresentativeSampleFormat, ...)` without checking the return code and then reads `opd_format.FORM.Enum.SupportedValue[0].u16`. If the call fails or the device returns a non-enumeration form (or an enumeration with zero values), `SupportedValue` may be NULL/uninitialized, causing a NULL/out-of-bounds read. Same pattern is repeated for the width/height/duration/size descriptors.","fix":"Check the return value of each `ptp_mtp_getobjectpropdesc()` and validate `FormFlag == PTP_OPFF_Enumeration && NumberOfValues > 0` (or `== PTP_OPFF_Range`) before dereferencing the FORM union; bail out or skip fields that fail.","locations":[{"ref":"src/libmtp.c:8992-9032","code":" 8992 |     ptp_mtp_getobjectpropdesc (params, PTP_OPC_RepresentativeSampleFormat, map_libmtp_type_to_ptp_type(filetype), &opd_format);\n 8993 |     retsam->filetype = map_ptp_type_to_libmtp_type(opd_format.FORM.Enum.SupportedValue[0].u16);\n 8994 |     ptp_free_objectpropdesc(&opd_format);\n 8995 |     /* Populate the maximum image height */\n 8996 |     ptp_mtp_getobjectpropdesc (params, PTP_OPC_RepresentativeSampleWidth, map_libmtp_type_to_ptp_type(filetype), &opd_width);\n 8997 |     retsam->width = opd_width.FORM.Range.MaxValue.u32;\n 8998 |     ptp_free_objectpropdesc(&opd_width);\n 8999 |     /* Populate the maximum image width */\n 9000 |     ptp_mtp_getobjectpropdesc (params, PTP_OPC_RepresentativeSampleHeight, map_libmtp_type_to_ptp_type(filetype), &opd_height);\n 9001 |     retsam->height = opd_height.FORM.Range.MaxValue.u32;\n 9002 |     ptp_free_objectpropdesc(&opd_height);\n 9003 |     /* Populate the maximum size */\n 9004 |     if (support_size) {\n 9005 |       ptp_mtp_getobjectpropdesc (params, PTP_OPC_RepresentativeSampleSize, map_libmtp_type_to_ptp_type(filetype), &opd_size);\n 9006 |       retsam->size = opd_size.FORM.Range.MaxValue.u32;\n 9007 |       ptp_free_objectpropdesc(&opd_size);\n 9008 |     }\n 9009 |     *sample = retsam;\n 9010 |   } else if (support_data && support_format && !support_height && !support_width && support_duration) {\n 9011 |     // Another qualified guess\n 9012 |     LIBMTP_filesampledata_t *retsam = LIBMTP_new_filesampledata_t();\n 9013 |     /*\n 9014 |      * Populate the sample format with the first supported format\n 9015 |      *\n 9016 |      * TODO: figure out how to pass back more than one format if more are\n 9017 |      * supported by the device.\n 9018 |      */\n 9019 |     ptp_mtp_getobjectpropdesc (params, PTP_OPC_RepresentativeSampleFormat, map_libmtp_type_to_ptp_type(filetype), &opd_format);\n 9020 |     retsam->filetype = map_ptp_type_to_libmtp_type(opd_format.FORM.Enum.SupportedValue[0].u16);\n 9021 |     ptp_free_objectpropdesc(&opd_format);\n 9022 |     /* Populate the maximum duration */\n 9023 |     ptp_mtp_getobjectpropdesc (params, PTP_OPC_RepresentativeSampleDuration, map_libmtp_type_to_ptp_type(filetype), &opd_duration);\n 9024 |     retsam->duration = opd_duration.FORM.Range.MaxValue.u32;\n 9025 |     ptp_free_objectpropdesc(&opd_duration);\n 9026 |     /* Populate the maximum size */\n 9027 |     if (support_size) {\n 9028 |       ptp_mtp_getobjectpropdesc (params, PTP_OPC_RepresentativeSampleSize, map_libmtp_type_to_ptp_type(filetype), &opd_size);\n 9029 |       retsam->size = opd_size.FORM.Range.MaxValue.u32;\n 9030 |       ptp_free_objectpropdesc(&opd_size);\n 9031 |     }\n 9032 |     *sample = retsam;","lines":41,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libmtp.c#L8992-L9032"}]},{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"Several places compute `x % ptp_usb->inep_maxpacket` / `% ptp_usb->outep_maxpacket` where the maxpacket value comes unmodified from the device endpoint descriptor. A device that reports `wMaxPacketSize == 0` triggers a division-by-zero (SIGFPE). Affected: the terminator-byte test in `ptp_read_func` (`toread % ptp_usb->inep_maxpacket == 0`), the trailing zero-read test (`curread % ptp_usb->outep_maxpacket == 0`), and the WMP packet-alignment math in `ptp_write_func` (`towrite % ptp_usb->outep_maxpacket`). Both glue files.","fix":"Reject endpoints with `wMaxPacketSize == 0` in `find_interface_and_endpoints` (return failure), or guard each modulo with `maxpacket != 0`.","locations":[{"ref":"src/libusb-glue.c:859","code":"  859 |       if (readzero && FLAG_NO_ZERO_READS(ptp_usb) && (toread % ptp_usb->inep_maxpacket == 0)) {","lines":1,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libusb-glue.c#L859"},{"ref":"src/libusb-glue.c:942","code":"  942 |       curread % ptp_usb->outep_maxpacket == 0) {","lines":1,"link":"https://github.com/libmtp/libmtp/blob/ea c = memory_getfunc;\n 1101 | \thandler->putfunc = memory_putfunc;\n 1102 | \tpriv->data = NULL;\n 1103 | \tpriv->size = 0;\n 1104 | \tpriv->curoff = 0;\n 1105 | \treturn PTP_RC_OK;","lines":10,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libusb-glue.c#L1096-L1105"},{"ref":"src/libopenusb1-glue.c:1102-1112","code":" 1102 | static uint16_t\n 1103 | ptp_init_recv_memory_handler(PTPDataHandler *handler) {\n 1104 |     PTPMemHandlerPrivate* priv;\n 1105 |     priv = malloc(sizeof (PTPMemHandlerPrivate));\n 1106 |     handler->priv = priv;\n 1107 |     handler->getfunc = memory_getfunc;\n 1108 |     handler->putfunc = memory_putfunc;\n 1109 |     priv->data = NULL;\n 1110 |     priv->size = 0;\n 1111 |     priv->curoff = 0;\n 1112 |     return PTP_RC_OK;","lines":11,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libopenusb1-glue.c#L1102-L1112"}]},{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"In `ptp_usb_getdata()` the surplus-packet buffer is allocated with `params->response_packet = malloc(surplen);` and used immediately in `memcpy(params->response_packet, ...)` with no NULL check. `surplen` is derived from the device-reported `usbdata.length`, so a NULL return leads to a crash. Both glue files.","fix":"Check the result: `params->response_packet = malloc(surplen); if (!params->response_packet) { ret = PTP_ERROR_IO; break; }` (or skip buffering the surplus on allocation failure).","locations":[{"ref":"src/libusb-glue.c:1399-1402","code":" 1399 | \t\t\t\tparams->response_packet = malloc(surplen);\n 1400 | \t\t\t\tmemcpy(params->response_packet,\n 1401 | \t\t\t\t       (uint8_t *) &usbdata + packlen, surplen);\n 1402 | \t\t\t\tparams->response_packet_size = surplen;","lines":4,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libusb-glue.c#L1399-L1402"},{"ref":"src/libopenusb1-glu T)->len == 0`) it does `free_array(DST); *(DST) = *(SRC);` which makes `(DST)->val` and `(SRC)->val` alias the same heap buffer while leaving `SRC` untouched. A caller who treats `SRC` uniformly (e.g. calls `free_array(SRC)` afterwards, as the other branch implies is safe) will double-free the buffer that `DST` now owns, and any subsequent use of `DST` is a use-after-free. The buffer is moved but the source is never zeroed.","fix":"Move ownership out of `SRC` in the empty branch too, e.g. reuse the existing `move` macro: `free_array (DST); move(*(DST), *(SRC));` so that `(SRC)->val`/`(SRC)->len` are reset to `0` and `SRC` can be freed safely by the caller exactly as in the other branch.","locations":[{"ref":"src/array.h:104-112","code":"  104 | #define array_append(DST, SRC) do { \\\n  105 | \tif ((DST)->len) { \\\n  106 | \t\tarray_append_copy(DST, SRC); \\\n  107 | \t\tfree_array (SRC); \\\n  108 | \t} else { \\\n  109 | \t\tfree_array (DST); \\\n  110 | \t\t*(DST) = *(SRC); \\\n  111 | \t} \\\n  112 | } while(0)","lines":9,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/array.h#L104-L112"}]},{"id":"UAF_2","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"medium","description":"openusb `probe_device_descriptor()` is fundamentally broken. `devh` is initialized to `NULL` and `openusb_open_device(libmtp_openusb_handle, NULL, USB_INIT_DEFAULT, devh)` is called passing the literal `NULL` as the device id and the NULL `devh` (by value) as the output-handle argument, so no handle is ever produced. Every later `openusb_close_device(*devh)` and `openusb_ctrl_xfer(*devh, ...)` then dereferences the NULL `devh`, crashing. The control transfers also send/receive into `bufptr` which still points at the on-stack `buf`.","fix":"Pass the real device (`*dev`) as the id and `&devh` as the output handle to `openusb_open_device`, verify success, and use `devh` (not `*devh`) consistently per the openusb API tput pointer (`*block=data`) and then immediately `free(data)`s it. The caller receives a dangling pointer to freed heap memory and will read it (and likely free it again), causing a use-after-free / double-free with device-controlled data.","fix":"Do not free the buffer that is handed to the caller. Before:\n```\n*block=data;\n*readnum=ptp.Param1;\nfree (data);\nreturn PTP_RC_OK;\n```\nAfter:\n```\n*block=data;\n*readnum=ptp.Param1;\nreturn PTP_RC_OK;\n```","locations":[{"ref":"src/ptp.c:4019-4023","code":" 4019 | \tCHECK_PTP_RC(ptp_transaction(params, &ptp, PTP_DP_GETDATA, 0, &data, NULL));\n 4020 | \t*block=data;\n 4021 | \t*readnum=ptp.Param1;\n 4022 | \tfree (data);\n 4023 | \treturn PTP_RC_OK;","lines":5,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/ptp.c#L4019-L4023"}]},{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"easy","description":"`ptp_read_func()` and `ptp_write_func()` allocate a `CONTEXT_BLOCK_SIZE` (16 KiB) scratch buffer `bytes = malloc(CONTEXT_BLOCK_SIZE)` but leak it on every error return inside the transfer loop. In `ptp_read_func` the returns at `return PTP_ERROR_IO`, `return putfunc_ret` and `return PTP_ERROR_CANCEL` all skip the `free(bytes)` that only runs at the normal end of the loop. Same pattern in `ptp_write_func` (`return getfunc_ret`, `return PTP_ERROR_IO`, `return PTP_ERROR_CANCEL`). USB I/O errors and callback cancellation are common, so this leaks 16 KiB per failed transfer. The `libopenusb1-glue.c` copies have the identical leak.","fix":"`free(bytes)` before each early `return` in both loops (or refactor to a single `goto out;` cleanup label that frees `bytes` and returns the status).","locations":[{"ref":"src/libusb-glue.c:848-935","code":"  848 |   bytes = malloc(CONTEXT_BLOCK_SIZE);\n  849 |   while (curread < size) {\n  850 | \n  851 |     LIBMTP_USB_DEBUG(\"Remaining size to read: 0x%04lx bytes\\n\", size - curread);\n  852 | \n  853 | tion":"`update_spl_playlist()` fetches `old = LIBMTP_Get_Playlist(device, ...)` (a heap-allocated `LIBMTP_playlist_t` with its `name`/`tracks`) but never destroys it on any of its return paths (delta branch, name-only branch, or no-change branch). Every update leaks a full playlist structure.","fix":"Call `LIBMTP_destroy_playlist_t(old);` before each `return` (after the last use of `old->name`/`old->tracks`).","locations":[{"ref":"src/playlist-spl.c:269-315","code":"  269 |   LIBMTP_playlist_t * old = LIBMTP_Get_Playlist(device, newlist->playlist_id);\n  270 |   \n  271 |   // check to see if we found it\n  272 |   if (!old)\n  273 |     return -1;\n  274 | \n  275 |   // check if the playlists match\n  276 |   int delta = 0;\n  277 |   unsigned int i;\n  278 |   if(old->no_tracks != newlist->no_tracks)\n  279 |     delta++;\n  280 |   for(i=0;i<newlist->no_tracks && delta==0;i++) {\n  281 |     if(old->tracks[i] != newlist->tracks[i])\n  282 |       delta++;\n  283 |   }\n  284 | \n  285 |   // if not, kill the playlist and replace it\n  286 |   if(delta) {\n  287 |     LIBMTP_PLST_DEBUG(\"new tracks detected:\\n\");\n  288 |     LIBMTP_PLST_DEBUG(\"delete old playlist and build a new one\\n\");\n  289 |     LIBMTP_PLST_DEBUG(\" NOTE: new playlist_id will result!\\n\");\n  290 |     if(LIBMTP_Delete_Object(device, old->playlist_id) != 0)\n  291 |       return -1;\n  292 | \n  293 |     if(strcmp(old->name,newlist->name) == 0)\n  294 |       LIBMTP_PLST_DEBUG(\"name unchanged\\n\");\n  295 |     else\n  296 |       LIBMTP_PLST_DEBUG(\"name is changing too -> %s\\n\",newlist->name);\n  297 | \n  298 |     return LIBMTP_Create_New_Playlist(device, newlist);\n  299 |   }\n  300 | \n  301 | \n  302 |   // update the name only\n  303 |   if(strcmp(old->name,newlist->name) != 0) {\n  304 |     LIBMTP_PLST_DEBUG(\"ONLY name is changing -> %s\\n\",newlist->name);\n  305 |     LIBMTP_PLST_DEBUG(\"playlist_id will remain unchanged\\n\");\n  306 |     char* s = malloc(sizeof(c | \t\tfree(*image);\n 4053 | \t\treturn PTP_RC_GeneralError;\n 4054 | \t}","lines":5,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/ptp.c#L4050-L4054"}]},{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"critical","difficulty":"medium","description":"In `ptp_mtpz_validatehandshakeresponse` the device-supplied response is parsed with fully device-controlled length fields that are never bounds-checked. After AES-decrypting `act_msg` (832 bytes), `certs_length` is read as a 32-bit big-endian value and the parser does `act_reader += certs_length` (`certs_length` up to `0xFFFFFFFF`), then reads further `unsigned short` length fields (`rand_length`, `dev_rand_length`, `sig_length`, `machash_length`) from wherever the pointer now points. Each of these drives `malloc(len)` + `memcpy(dst, act_reader, len)` reading from the 832-byte `act_msg` buffer. A malicious/malfunctioning device can make `act_reader` point far outside `act_msg` and make the `memcpy` copy up to 64KiB, causing large out-of-bounds heap reads (and potential crash). None of `certs_length`, `rand_length`, `dev_rand_length`, `sig_length`, `machash_length` are validated against the remaining buffer length.","fix":"Track a running offset and validate every advance and every read against the fixed 832-byte buffer end before dereferencing, e.g. reject the response if `certs_length`, `rand_length`, `dev_rand_length`, `sig_length` or `machash_length` plus the current offset exceed `832`. Bail out with an error return instead of reading/`memcpy`-ing beyond `act_msg + 832`.","locations":[{"ref":"src/mtpz.c:1620-1665","code":" 1620 | \tunsigned char *act_msg = (unsigned char *)malloc(832);\n 1621 | \tunsigned char *act_reader = act_msg;\n 1622 | \tmemcpy(act_msg, reader, 832);\n 1623 | \treader = NULL;\n 1624 | \n 1625 | \tmtpz_encryption_cipher_advanced((unsigned char *)hash_key, 16, act_msg, 832, 0);\n 1626 | \n 1627 | \tact_reader++;\n ds `memcpy(packet, x, *rlen)` into a fixed-size `PTPUSBBulkContainer` (`sizeof` == 1024 bytes: 12-byte header + `PTP_USB_BULK_PAYLOAD_LEN_READ`). A malicious/broken device reporting `wMaxPacketSize > 1024` makes `*rlen` exceed the destination and overflows the caller's stack container in `ptp_usb_getresp`/`ptp_usb_getdata`. Worse, inside `ptp_read_func` a `wMaxPacketSize > CONTEXT_BLOCK_SIZE` (0x4000) makes `USB_BULK_READ` write `toread` bytes into the 16 KiB `bytes` heap buffer, a heap overflow. Data read from USB is untrusted. Present in both glue files.","fix":"Validate `wMaxPacketSize` when assigning endpoints in `find_interface_and_endpoints` (reject/clamp to `PTP_USB_BULK_HS_MAX_PACKET_LEN_READ`/`_SS_` and mask the high mult-transaction bits, e.g. `wMaxPacketSize & 0x07ff`), and in `ptp_usb_getpacket` cap `*rlen` to `sizeof(PTPUSBBulkContainer)` before the `memcpy`.","locations":[{"ref":"src/libusb-glue.c:1272-1301","code":" 1272 | static uint16_t ptp_usb_getpacket(PTPParams *params,\n 1273 | \t\tPTPUSBBulkContainer *packet, unsigned long *rlen)\n 1274 | {\n 1275 | \tPTPDataHandler\tmemhandler;\n 1276 | \tuint16_t\tret;\n 1277 | \tunsigned char\t*x = NULL;\n 1278 | \tunsigned long packet_size;\n 1279 | \tPTP_USB *ptp_usb = (PTP_USB *) params->data;\n 1280 | \n 1281 | \tpacket_size = ptp_usb->inep_maxpacket;\n 1282 | \n 1283 | \t/* read the header and potentially the first data */\n 1284 | \tif (params->response_packet_size > 0) {\n 1285 | \t\t/* If there is a buffered packet, just use it. */\n 1286 | \t\tmemcpy(packet, params->response_packet, params->response_packet_size);\n 1287 | \t\t*rlen = params->response_packet_size;\n 1288 | \t\tfree(params->response_packet);\n 1289 | \t\tparams->response_packet = NULL;\n 1290 | \t\tparams->response_packet_size = 0;\n 1291 | \t\t/* Here this signifies a \"virtual read\" */\n 1292 | \t\treturn PTP_RC_OK;\n 1293 | \t}\n 1294 | \tptp_init_recv_memory_handler (&memhandler);\n 1295 | \tret = ptp_read_func(packet_size, &memhandler, params->data, rlen, 0);\n 1296 | \tptp_exit_recv_memory_handler (&memhandler, &x, rlen);\n 1297 | \tif (x) {\n 1298 | \t\tmemcpy (packet, x, *rlen);\n 1299 | \t\tfree (x);\n 1300 | \t}\n 1301 | \treturn ret;","lines":30,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libusb-glue.c#L1272-L1301"},{"ref":"src/libusb-glue.c:1932-1937","code":" 1932 | \t      *inep_maxpacket = ep[l].wMaxPacketSize;\n 1933 | \t      found_inep = 1;\n 1934 | \t    }\n 1935 | \t    if ((ep[l].bEndpointAddress & USB_ENDPOINT_DIR_MASK) == 0) {\n 1936 | \t      *outep = ep[l].bEndpointAddress;\n 1937 | \t      *outep_maxpacket = ep[l].wMaxPacketSize;","lines":6,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libusb-glue.c#L1932-L1937"},{"ref":"src/libopenusb1-glue.c:1282-1311","code":" 1282 | static uint16_t ptp_usb_getpacket(PTPParams *params,\n 1283 |         PTPUSBBulkContainer *packet, unsigned long *rlen) {\n 1284 |     PTPDataHandler memhandler;\n 1285 |     uint16_t ret;\n 1286 |     unsigned char *x = NULL;\n 1287 |     unsigned long packet_size;\n 1288 |     PTP_USB *ptp_usb = (PTP_USB *) params->data;\n 1289 | \n 1290 |     packet_size = ptp_usb->inep_maxpacket;\n 1291 | \n 1292 |     /* read the header and potentially the first data */\n 1293 |     if (params->response_packet_size > 0) {\n 1294 |         /* If there is a buffered packet, just use it. */\n 1295 |         memcpy(packet, params->response_packet, params->response_packet_size);\n 1296 |         *rlen = params->response_packet_size;\n 1297 |         free(params->response_packet);\n 1298 |         params->response_packet = NULL;\n 1299 |         params->response_packet_size = 0;\n 1300 |         /* Here this signifies a \"virtual read\" */\n 1301 |         return PTP_RC_OK;\n 1302 |     }\n 1303 |     ptp_init_recv_memory_handler(&memhandler);\n 1304 |     ret = ptp_read_func(packet_size, &memhandler, params->data, rlen, 0);\n 1305 |     ptp_exit_recv_memory_handler(&memhandler, &x, rlen);\n 1306 |     if (x) {\n 1307 |         memcpy(packet, x, *rlen);\n 1308 |         free(x);\n 1309 |     }\n 1310 |     return ret;\n 1311 | }","lines":30,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libopenusb1-glue.c#L1282-L1311"},{"ref":"src/libopenusb1-glue.c:2036-2041","code":" 2036 |                         *inep_maxpacket = ep.wMaxPacketSize;\n 2037 |                         found_inep = 1;\n 2038 |                     }\n 2039 |                     if ((ep.bEndpointAddress & USB_ENDPOINT_DIR_MASK) == 0) {\n 2040 |                         *outep = ep.bEndpointAddress;\n 2041 |                         *outep_maxpacket = ep.wMaxPacketSize;","lines":6,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libopenusb1-glue.c#L2036-L2041"}]},{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"`ptp_mtpz_validatehandshakeresponse` ignores the response length `len` returned by `ptp_mtpz_getwmdrmpdappresponse` entirely. It walks `reader` over the device buffer reading header bytes and then does `memcpy(message, reader, 128)` and `memcpy(act_msg, reader, 832)` with no check that the response is actually at least `~964` bytes long. A short response from an untrusted device causes out-of-bounds reads past the allocated `response` buffer.","fix":"Validate `len` up front (e.g. require `len >= 4 + 128 + 2 + 2 + 832`) and validate `reader` stays within `response + len` before each `memcpy`/dereference. Return an error when the response is shorter than expected.","locations":[{"ref":"src/mtpz.c:1536-1568","code":" 1536 | \tunsigned int len;\n 1537 | \tunsigned char* response = NULL;\n 1538 | \n 1539 | \tret = ptp_mtpz_getwmdrmpdappresponse (params, &response, &len);\n 1540 | \tif (ret != PTP_RC_OK)\n 1541 | \t{\n 1542 | \t\tLIBMTP_INFO (\"(MTPZ) Failure - did e hash plus a 4-byte counter) before accepting the response; return an error otherwise so `ptp_mtpz_opensecuresyncsession` never reads past the buffer.","locations":[{"ref":"src/mtpz.c:1659-1665","code":" 1659 | \tunsigned int machash_length = MTPZ_SWAP(*(unsigned short *)(act_reader) << 16);\n 1660 | \tact_reader += 2;\n 1661 | \tunsigned char *machash_data = (unsigned char *)malloc(machash_length);\n 1662 | \tmemcpy(machash_data, act_reader, machash_length);\n 1663 | \tact_reader += machash_length;\n 1664 | \n 1665 | \t*calculatedHash = machash_data;","lines":7,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/mtpz.c#L1659-L1665"},{"ref":"src/mtpz.c:1681-1686","code":" 1681 | \tunsigned char\tmch[16];\n 1682 | \tuint32_t\t*hashparams = (unsigned int *)mch;\n 1683 | \tunsigned int\tmacCount = *(unsigned int *)(hash + 16);\n 1684 | \tuint16_t\tret;\n 1685 | \n 1686 | \tmtpz_encryption_encrypt_mac(hash, 16, (unsigned char *)(&macCount), 4, mch);","lines":6,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/mtpz.c#L1681-L1686"}]},{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"`discover_filepath_from_id()` builds a path into a fixed `char w[1024]` from the right, decrementing `iw` by `strlen(files->filename)+1` and by `strlen(f)+1` for each parent folder, with no bounds check (the code even has `// FIXME: check for string overflow before it occurs`). File names and folder names come from the device and are untrusted. A long filename, or a deep/long folder chain, drives `iw` below `w`, and the subsequent `strcpy(iw, ...)`, `iw[strlen(f)] = '\\'`, and the final `iw--; iw[0] = '\\';` write out of bounds (stack buffer underflow/overflow). Corrupt or malicious device metadata can corrupt the stack.","fix":"Before each `strcpy`/separator write, verify `iw - needed >= w` and abort (set `*p = NULL; return;`) if it would underflow. Better: compute the total required length first and either allocate dynamically or bound-check every prepend; also guard the final `iw--` slash write against `iw == w`.","locations":[{"ref":"src/playlist-spl.c:666-708","code":"  666 |   // fill in a string from the right side since we don't know the root till the end\n  667 |   const int M = 1024;\n  668 |   char w[M];\n  669 |   char* iw = w + M; // iterator on w\n  670 | \n  671 |   // in case of failure return NULL string\n  672 |   *p = NULL;\n  673 | \n  674 | \n  675 |   // find the right file\n  676 |   while(files != NULL && files->item_id != track) {\n  677 |     files = files->next;\n  678 |   }\n  679 |   // if we didn't find a matching file, abort\n  680 |   if(files == NULL)\n  681 |     return;\n  682 | \n  683 |   // stuff the filename into our string\n  684 |   // FIXME: check for string overflow before it occurs\n  685 |   iw = iw - (strlen(files->filename) +1); // leave room for '\\0' at the end\n  686 |   strcpy(iw,files->filename);\n  687 | \n  688 |   // next follow the directories to the root\n  689 |   // prepending folders to the path as we go\n  690 |   uint32_t id = files->parent_id;\n  691 |   char* f = NULL;\n  692 |   while(id != 0) {\n  693 |     find_folder_name(folders, &id, &f);\n  694 |     if(f == NULL) return; // fail if the next part of the path couldn't be found\n  695 |     iw = iw - (strlen(f) +1);\n  696 |     // FIXME: check for string overflow before it occurs\n  697 |     strcpy(iw, f);\n  698 |     iw[strlen(f)] = '\\\\';\n  699 |     free(f);\n  700 |   }\n  701 | \n  702 |   // prepend a slash\n  703 |   iw--;\n  704 |   iw[0] = '\\\\';\n  705 | \n  706 |   // now allocate a string of the right length to be returned\n  707 |   *p = strdup(iw);\n  708 | }","lines":43,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/playlist-spl.c#L666-L708"}]},{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"In `ptp_unpack_ptp11_manifest` the number of entries `numberoifs` is read as an\nattacker-controlled 64-bit value with `numberoifs = dtoh64o(data, offset)` and passed\nstraight into `calloc(numberoifs, sizeof(PTPObjectFilesystemInfo))` with no upper-bound\ncheck against `datalen`. Two problems: (1) `calloc` takes `size_t` arguments, so on a\n32-bit platform the 64-bit `numberoifs` is truncated to `size_t` (e.g. `0x100000000`\nbecomes `0`, `0x100000005` becomes `5`) while the loop counter `i` and the loop bound stay\n64-bit `uint64_t`; the loop `for (i = 0; i < numberoifs; i++)` then writes `xoifs[i]` far\npast the truncated allocation - a heap buffer overflow. (2) Even on 64-bit, a moderately\nlarge count (e.g. `10000000`) succeeds and allocates hundreds of MB from a tiny packet - a\nmemory-exhaustion DoS. The per-iteration `if (offset + 34 + 2 > datalen) goto tooshort`\ncheck limits how many entries are actually written, but on 32-bit the truncated allocation\ncan be smaller than the number of iterations reachable before the buffer is exhausted.","fix":"Bound `numberoifs` before allocating, e.g. reject counts that cannot possibly fit in the\nremaining buffer: `if (numberoifs > (datalen - offset) / 36) return 0;` (each entry is at\nleast 34 fixed bytes plus 2 one-byte strings). Also make the loop counter/bound and the\nallocation use the same width (validate `numberoifs <= SIZE_MAX/sizeof(PTPObjectFilesystemInfo)`)\nso no truncation can occur.","locations":[{"ref":"src/ptp-pack.c:2979-2985","code":" 2979 | \tif (!data || datalen < 8)\n 2980 | \t\treturn 0;\n 2981 | \tnumberoifs = dtoh64o(data, offset);\n 2982 | \txoifs = calloc(numberoifs, sizeof(PTPObjectFilesystemInfo));\n 2983 | \tif (!xoifs)\n 2984 | \t\treturn 0;\n 2985 | ","lines":7,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/ptp-pack.c#L2979-L2985"},{"ref":"src/ptp-pack.c:2986-2990","code":" 2986 | \tfor (i = 0; i < numberoifs; i++) {\n 2987 | \t\tchar *modify_date;\n 2988 | \t\tPTPObjectFilesystemInfo *oif = xoifs+i;\n 2989 | \n 2990 | \t\tif (offset + 34 + 2 > datalen)","lines":5,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/ptp-pack.c#L2986-L2990"}]},{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"In `ptp_nikon_getwifiprofilelist` the profile-name and ESSID lengths `n` are read from the device (`n = dtoh32o(data, pos)`) and only validated against the total data `size` (`pos+n+4 >= size` / `pos+n >= size`). They are then passed straight to `strncpy` into the fixed-size fields `profile_name[17]` and `essid[33]` of the heap-allocated `params->wifi_profiles` array. A device can report `n` far larger than 17/33, so `strncpy` writes `n` device-controlled bytes past the field, a heap buffer overflow.","fix":"Clamp the copy length to the destination size, e.g. `strncpy(dst, src, MIN(n, sizeof(dst)-1))` and always NUL-terminate, or reject profiles whose `n` exceeds `sizeof(profile_name)-1` / `sizeof(essid)-1`.","locations":[{"ref":"src/ptp.c:5028-5033","code":" 5028 | \t\tn = dtoh32o(data, pos);\n 5029 | \t\tif (pos+n+4 >= size)\n 5030 | \t\t\tgoto error;\n 5031 | \t\tstrncpy(params->wifi_profiles[profn].profile_name, (char*)&data[pos], n);\n 5032 | \t\tparams->wifi_profiles[profn].profile_name[16] = '\\0';\n 5033 | \t\tpos += n;","lines":6,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/ptp.c#L5028-L5033"},{"ref":"src/ptp.c:5053-5058","code":" 5053 | \t\tn = dtoh32o(data, pos);\n 5054 | \t\tif (pos+n >= size)\n 5055 | \t\t\tgoto error;\n 5056 | \t\tstrncpy(params->wifi_profiles[profn].essid, (char*)data + pos, n);\n 5057 | \t\tparams->wifi_profiles[profn].essid[32] = '\\0';\n 5058 | \t\tpos += n;","lines":6,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/ptp.c#L5053-L5058"}]},{"id":"OVF_8","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"In `adjust_u16()`/`adjust_u32()` the enumeration branch reads `opd->FORM.Enum.SupportedValue[0]` before checking `NumberOfValues`. A device that returns an enumeration form with `NumberOfValues == 0` (and thus a `SupportedValue` array that may be empty/NULL) causes an out-of-bounds / NULL read of `SupportedValue[0]`.","fix":"Check `opd->FORM.Enum.NumberOfValues > 0` (and `SupportedValue != NULL`) before dereferencing `SupportedValue[0]`; if empty, return `val` unchanged.","locations":[{"ref":"src/libmtp.c:867-883","code":"  867 |   case PTP_DPFF_Enumeration:\n  868 |     {\n  869 |       int i;\n  870 |       uint16_t bestfit = opd->FORM.Enum.SupportedValue[0].u16;\n  871 | \n  872 |       for (i=0; i<opd->FORM.Enum.NumberOfValues; i++) {\n  873 | \tif (val == opd->FORM.Enum.SupportedValue[i].u16) {\n  874 | \t  return val;\n  875 | \t}\n  876 | \t// Rough guess of best fit\n  877 | \tif (opd->FORM.Enum.SupportedValue[i].u16 < val) {\n  878 | \t  bestfit = opd->FORM.Enum.SupportedValue[i].u16;\n  879 | \t}\n  880 |       }\n  881 |       // Just some default that'll work.\n  882 |       return bestfit;\n  883 |     }","lines":17,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libmtp.c#L867-L883"},{"ref":"src/libmtp.c:912-928","code":"  912 |   case PTP_DPFF_Enumeration:\n  913 |     {\n  914 |       int i;\n  915 |       uint32_t bestfit = opd->FORM.Enum.SupportedValue[0].u32;\n  916 | \n  917 |       for (i=0; i<opd->FORM.Enum.NumberOfValues; i++) {\n  918 | \tif (val == opd->FORM.Enum.SupportedValue[i].u32) {\n  919 | \t  return val;\n  920 | \t}\n  921 | \t// Rough guess of best fit\n  922 | \tif (opd->FORM.Enum.SupportedValue[i].u32 < val) {\n  923 | \t  bestfit = opd->FORM.Enum.SupportedValue[i].u32;\n  924 | \t}\n  925 |       }\n  926 |       // Just some default that'll work.\n  927 |       return bestfit;\n  928 |     }","lines":17,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libmtp.c#L912-L928"}]},{"id":"OVF_9","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"hard","description":"`get_device_unicode_property()` computes `tmp = malloc((propval.a.count + 1)*sizeof(uint16_t))` where `propval.a.count` is a device-controlled `uint32_t`. If `count == 0xFFFFFFFF`, `count + 1` wraps to 0 (32-bit arithmetic), so `malloc(0)` is called and the subsequent loop `for (i=0;i<propval.a.count;i++) tmp[i]=...` writes ~4 billion elements, a massive heap overflow. The `malloc()` return is also unchecked, so a plain allocation failure NULL-derefs in the same loop.","fix":"Perform the size computation in `size_t`, reject implausibly large `count`, and check the `malloc()` result before writing to `tmp`.","locations":[{"ref":"src/libmtp.c:4012-4024","code":" 4012 |   // Extract the actual array.\n 4013 |   // printf(\"Array of %d elements\\n\", propval.a.count);\n 4014 |   tmp = malloc((propval.a.count + 1)*sizeof(uint16_t));\n 4015 |   for (i = 0; i < propval.a.count; i++) {\n 4016 |     tmp[i] = propval.a.v[i].u16;\n 4017 |     // printf(\"%04x \", tmp[i]);\n 4018 |   }\n 4019 |   tmp[propval.a.count] = 0x0000U;\n 4020 |   free(propval.a.v);\n 4021 | \n 4022 |   *unicstring = utf16_to_utf8(device, tmp);\n 4023 | \n 4024 |   free(tmp);","lines":13,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libmtp.c#L4012-L4024"}]},{"id":"OVF_10","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"`create_new_abstract_list()` copies the list name into the fixed 256-byte stack buffer `fname` with `strncpy(fname, name, sizeof(fname))` when the name already ends in the suffix. `strncpy` does not NUL-terminate when `strlen(name) >= 256`, so the subsequent `strdup(fname)` / use as `Filename` reads past the buffer (out-of-bounds read, possible info leak or crash). The other `strncpy` at line 7937 is correctly bounded but this one is not.","fix":"Use a bounded copy that always terminates, e.g. `strncpy(fname, name, sizeof(fname)-1); fname[sizeof(fname)-1]='\\0';`.","locations":[{"ref":"src/libmtp.c:7927-7940","code":" 7927 |   fname[0] = '\\0';\n 7928 |   if (strlen(name) > strlen(suffix)) {\n 7929 |     char const * const suff = &name[strlen(name)-strlen(suffix)];\n 7930 |     if (!strcmp(suff, suffix)) {\n 7931 |       // Home free.\n 7932 |       strncpy(fname, name, sizeof(fname));\n 7933 |     }\n 7934 |   }\n 7935 |   // If it didn't end with \"<suffix>\" then add that here.\n 7936 |   if (fname[0] == '\\0') {\n 7937 |     strncpy(fname, name, sizeof(fname)-strlen(suffix)-1);\n 7938 |     strcat(fname, suffix);\n 7939 |     fname[sizeof(fname)-1] = '\\0';\n 7940 |   }","lines":14,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libmtp.c#L7927-L7940"}]},{"id":"OVF_11","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"hard","description":"In `ptp_usb_getdata`, after reading a container the code computes `rlen - PTP_USB_BULK_HDR_LEN` (12) and passes it as the length to `handler->putfunc` without first checking that `rlen >= PTP_USB_BULK_HDR_LEN`. `rlen` is device-controlled (a malfunctioning/malicious device can return a data-phase packet shorter than 12 bytes while still setting the container type field). Because `rlen` is `unsigned long`, `rlen - 12` underflows to a huge value, causing `putfunc` to read far past `usbdata.payload.data`.","fix":"Before subtracting, verify `rlen >= PTP_USB_BULK_HDR_LEN` (as `ptp_usb_getresp` does for short responses) and treat shorter packets as an IO error rather than passing an underflowed length to `putfunc`.","locations":[{"ref":"src/libusb1-glue.c:1455-1460","code":" 1455 | \t\tif (rlen == ptp_usb->inep_maxpacket) {\n 1456 | \t\t\t/* Copy first part of data to 'data' */\n 1457 | \t\t\tputfunc_ret =\n 1458 | \t\t\t\thandler->putfunc(\n 1459 | \t\t\t\t\t\tparams, handler->priv, rlen - PTP_USB_BULK_HDR_LEN, usbdata.payload.data\n 1460 | \t\t\t\t\t\t);","lines":6,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libusb1-glue.c#L1455-L1460"},{"ref":"src/libusb1-glue.c:1534-1539","code":" 1534 | \t\t/* Copy first part of data to 'data' */\n 1535 | \t\tputfunc_ret =\n 1536 | \t\t  handler->putfunc(\n 1537 | \t\t\t\t   params, handler->priv, rlen - PTP_USB_BULK_HDR_LEN,\n 1538 | \t\t\t\t   usbdata.payload.data\n 1539 | \t\t\t\t   );","lines":6,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libusb1-glue.c#L1534-L1539"}]},{"id":"OVF_12","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"In `ptp_mtpz_validatehandshakeresponse`, `rand_length` is device-controlled and used as `malloc(rand_length)` + `memcpy(rand_data, act_reader, rand_length)`, then `memcmp(rand_data, random, 16)` is performed. If the device sets `rand_length < 16` (e.g. `0`), `memcmp` reads 16 bytes from a buffer smaller than 16 bytes, an out-of-bounds heap read; `malloc(0)` plus a 16-byte `memcmp` is undefined behavior.","fix":"Validate `rand_length == 16` (the code only ever compares 16 bytes) before allocating/copying; reject the handshake response otherwise.","locations":[{"ref":"src/mtpz.c:1632-1643","code":" 1632 | \tunsigned int rand_length = MTPZ_SWAP(*(unsigned short *)(act_reader) << 16);\n 1633 | \tact_reader += 2;\n 1634 | \tunsigned char *rand_data = (unsigned char *)malloc(rand_length);\n 1635 | \tmemcpy(rand_data, act_reader, rand_length);\n 1636 | \tif (memcmp(rand_data, random, 16) != 0)\n 1637 | \t{\n 1638 | \t\tfree(rand_data);\n 1639 | \t\tfree(hash_key);\n 1640 | \t\tfree(v10);\n 1641 | \t\tfree(v11);\n 1642 | \t\treturn -1;\n 1643 | \t}","lines":12,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/mtpz.c#L1632-L1643"}]},{"id":"OVF_13","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"`ptp_unpack_canon_event` reads several fixed-offset fields up to byte offset 12\n(`dtoh16a(data + PTP_ec_Type)` at 4, `dtoh16a(data + PTP_ec_Code)` at 6,\n`dtoh32a(data + PTP_ec_TransId)` at 8..11) with the only guard being\n`if (length > len) return;`, where `length` is itself read from the device\n(`dtoh32a(data + PTP_ec_Length)`). If the device supplies `len` (and `length`) smaller than\n12 - e.g. `len == 8`, `length == 8` - the `length > len` test passes and the code reads up\nto 4 bytes past the end of the `len`-byte buffer. There is no minimum-length check for the\nunconditional header reads.","fix":"Add an explicit minimum-size check before touching the fixed header fields, e.g.\n`if (data == NULL || len < PTP_ec_TransId + 4) return;` (i.e. `len < 12`) before the\n`length > len` test, and only read `Param1/2/3` when `length >= their_offset + 4` (already\ndone).","locations":[{"ref":"src/ptp-pack.c:1342-1350","code":" 1342 | \tlength = dtoh32a(data + PTP_ec_Length);\n 1343 | \tif (length > len) {\n 1344 | \t\tptp_debug (params, \"length %d in container, but data only %d bytes?!\", length, len);\n 1345 | \t\treturn;\n 1346 | \t}\n 1347 | \ttype = dtoh16a(data + PTP_ec_Type);\n 1348 | \n 1349 | \tec->Code           = dtoh16a(data + PTP_ec_Code);\n 1350 | \tec->Transaction_ID = dtoh32a(data + PTP_ec_TransId);","lines":9,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/ptp-pack.c#L1342-L1350"}]},{"id":"OVF_14","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"In `ptp_unpack_EOS_events`, several event handlers build C strings from the device buffer\nwith `strdup((char*)curdata + PTP_cee_OA_Name)` / `strdup((char*)xdata)` etc. The per-event\nsize checks (e.g. `size < PTP_cee_OA_Name+1`) only guarantee that the filename field\n*starts* inside the event; they do not guarantee a terminating NUL exists before the end of\nthe received buffer. Since libmtp does not guarantee the received data is NUL-terminated,\n`strdup` can read past the end of the allocated buffer (heap over-read / info leak / crash).\nSame pattern for the `PTP_DTC_STR` property values `strdup((char*)xdata)`.","fix":"Use a length-bounded copy that cannot read past the event/buffer, e.g. compute the maximum\navailable length `max = (data + datasize) - (curdata + PTP_cee_OA_Name)` and use\n`strndup(src, max)` (or copy at most `max` bytes and force a NUL). For the string-property\ncase bound by `xsize`: `dpd->CurrentValue.str = strndup((char*)xdata, xsize);`.","locations":[{"ref":"src/ptp-pack.c:1955","code":" 1955 | \t\t\te[i].u.object.Filename      = strdup(((char*)curdata + PTP_cee_OA_Name));","lines":1,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/ptp-pack.c#L1955"},{"ref":"src/ptp-pack.c:1973","code":" 1973 | \t\t\te[i].u.object.Filename      = strdup(((char*)curdata + PTP_cee_OA64_Name));","lines":1,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/ptp-pack.c#L1973"},{"ref":"src/ptp-pack.c:1990","code":" 1990 | \t\t\te[i].u.object.Filename      = strdup(((char*)curdata + PTP_cee_OI_Name));","lines":1,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/ptp-pack.c#L1990"},{"ref":"src/ptp-pack.c:2346-2349","code":" 2346 | \t\t\t\tdpd->DefaultValue.str = strdup( (char*)xdata );\n 2347 | \n 2348 | \t\t\t\tfree (dpd->CurrentValue.str);\n 2349 | \t\t\t\tdpd->CurrentValue.str = strdup( (char*)xdata );","lines":4,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/ptp-pack.c#L2346-L2349"}]},{"id":"OVF_15","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"hard","description":"In the `PTP_EC_CANON_EOS_OLCInfoChanged` handler, entries are read at fixed offsets and with\nthe *table* length `olcsizes[olcver][j]` even though the code itself computes a truncated\n`cursize = MIN(olcsizes[olcver][j], size - curoff)` and warns that the entry may be\ntruncated. The actual data accesses ignore `cursize`: fixed byte reads such as\n`curdata[curoff+7]` (0x0002), `curdata[curoff+7]` (0x0004), `curdata[curoff+2]` /\n`ptp_bytes2str(curdata + curoff + 3, olcsizes[olcver][j] - 3, ...)` (0x0040), and the\n`ptp_bytes2str(curdata + curoff, olcsizes[olcver][j], ...)` calls in the 0x0100/0x0200/\ndefault cases all use the untruncated table size. When `size - curoff < olcsizes[olcver][j]`\n(the exact truncation case the code detects) these read past `curdata + size`, and since the\nouter loop only guarantees `curdata + size < data + datasize`, they can read a few bytes past\n`data + datasize`.","fix":"Use `cursize` (the bounds-clamped length) for every read, not `olcsizes[olcver][j]`, and\nguard each fixed-offset byte access with an explicit `if (curoff + N < size)` before reading\n`curdata[curoff+N]`. Skip (or emit only the truncation warning for) any entry where\n`cursize < olcsizes[olcver][j]` instead of dereferencing the full table length.","locations":[{"ref":"src/ptp-pack.c:2461-2473","code":" 2461 | \t\t\tfor (j = 0; j <= 12; j++) {\n 2462 | \t\t\t\tunsigned int curmask = 1 << j;\n 2463 | \t\t\t\tunsigned int cursize = MIN(olcsizes[olcver][j], size - curoff);\n 2464 | \t\t\t\tif (curoff > size)\n 2465 | \t\t\t\t\tbreak;\n 2466 | \t\t\t\tif (!(mask & curmask))\n 2467 | \t\t\t\t\tcontinue;\n 2468 | \t\t\t\tif (olcsizes[olcver][j] != cursize) {\n 2469 | \t\t\t\t\tptp_debug (params, \"%s mask 0x%04x entry truncated (%d bytes), olcsizes table (%d bytes) wrong?\",\n 2470 | \t\t\t\t\t           prefix, curmask, cursize, olcsizes[olcver][j]);\n 2471 | \t\t\t\t}\n 2472 | \t\t\t\tptp_debug (params, \"event %3d:%04x: (olcmask) %d bytes: %s\", i, curmask, cursize,\n 2473 | \t\t\t\t           ptp_bytes2str(curdata + curoff, cursize, \"%02x \"));","lines":13,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/ptp-pack.c#L2461-L2473"},{"ref":"src/ptp-pack.c:2490-2492","code":" 2490 | \t\t\t\t\t\tdpd->CurrentValue.u16 = curdata[curoff+7];\n 2491 | \t\t\t\t\t} else {\n 2492 | \t\t\t\t\t\tdpd->CurrentValue.u16 = curdata[curoff+5];","lines":3,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/ptp-pack.c#L2490-L2492"},{"ref":"src/ptp-pack.c:2509-2511","code":" 2509 | \t\t\t\t\t\tdpd->CurrentValue.u16 = curdata[curoff+7]; /* RP, R5, etc */\n 2510 | \t\t\t\t\t} else {\n 2511 | \t\t\t\t\t\tdpd->CurrentValue.u16 = curdata[curoff+4]; /* just use last byte */","lines":3,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/ptp-pack.c#L2509-L2511"},{"ref":"src/ptp-pack.c:2530-2539","code":" 2530 | \t\t\t\t\tint\tvalue = (signed char)curdata[curoff+2];\n 2531 | \t\t\t\t\t/* mask 0x0040: 7 bytes, 01 01 00 00 00 00 00 observed */\n 2532 | \t\t\t\t\t/* exposure indicator */\n 2533 | \t\t\t\t\te[i].type = PTP_EOSEvent_Unknown;\n 2534 | \t\t\t\t\tPTP_CANON_SET_INFO(e[i], \"OLCInfo exposure indicator %d,%d,%d.%d (%s)\",\n 2535 | \t\t\t\t\t\tcurdata[curoff+0],\n 2536 | \t\t\t\t\t\tcurdata[curoff+1],\n 2537 | \t\t\t\t\t\tvalue/10, abs(value)%10,\n 2538 | \t\t\t\t\t\tptp_bytes2str(curdata + curoff + 3, olcsizes[olcver][j] - 3, \"%02x \")\n 2539 | \t\t\t\t\t);","lines":10,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/ptp-pack.c#L2530-L2539"},{"ref":"src/ptp-pack.c:2556","code":" 2556 | \t\t\t\t\tPTP_CANON_SET_INFO(e[i], \"%s\", ptp_bytes2str(curdata + curoff, olcsizes[olcver][j], \"%02x\"));","lines":1,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/ptp-pack.c#L2556"},{"ref":"src/ptp-pack.c:2561","code":" 2561 | \t\t\t\t\tPTP_CANON_SET_INFO(e[i], \"%s\", ptp_bytes2str(curdata + curoff, olcsizes[olcver][j], \"%02x\"));","lines":1,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/ptp-pack.c#L2561"},{"ref":"src/ptp-pack.c:2596-2597","code":" 2596 | \t\t\t\t\tPTP_CANON_SET_INFO(e[i], \"OLCInfo event 0x%04x, %d bytes: %s\", curmask, olcsizes[olcver][j],\n 2597 | \t\t\t\t\t\tptp_bytes2str(curdata + curoff, olcsizes[olcver][j], \"%02x \"));","lines":2,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/ptp-pack.c#L2596-L2597"}]},{"id":"OVF_16","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"`ptp_panasonic_getdevicepropertydesc` derives buffer offsets from the device-supplied `headerLength` and `*propertyValueListLength` using expressions like `headerLength * 4 + 2 * 4` and `headerLength * 4 + 3 * 4 + valuesize + (*propertyValueListLength) * valuesize`. These are computed in 32-bit `uint32_t` arithmetic and can overflow, so the `size < ...` guards can be bypassed, leading to out-of-bounds reads via `dtoh16a`/`dtoh32a` at attacker-chosen offsets. `ptp_panasonic_getdevicepropertysize` has the same pattern with `headerLength * 4`.","fix":"Perform the offset/size arithmetic in a 64-bit type (or check each multiplicand against `size` before multiplying), and validate that every computed offset+length stays within `size` without wrapping.","locations":[{"ref":"src/ptp.c:1667-1701","code":" 1667 | \theaderLength = dtoh32a( (data) + 4 );\n 1668 | \tif (size < 4 + 6 * 4)\n 1669 | \t\treturn PTP_RC_GeneralError;\n 1670 | \n 1671 | \tpropertyCode = dtoh32a( (data) + 4 + 6 * 4 );\n 1672 | \tif (size < headerLength * 4 + 2 * 4)\n 1673 | \t\treturn PTP_RC_GeneralError;\n 1674 | \n 1675 | \tif(valuesize == 2) {\n 1676 | \t\t*currentValue \t\t= (uint32_t) dtoh16a( (data) + headerLength * 4 + 2 * 4 );\n 1677 | \t} else if(valuesize == 4) {\n 1678 | \t\t*currentValue \t\t= dtoh32a( (data) + headerLength * 4 + 2 * 4 );\n 1679 | \t} else {\n 1680 | \t\tptp_debug (params, \"unexpected valuesize %d\", valuesize);\n 1681 | \t\treturn PTP_RC_GeneralError;\n 1682 | \t}\n 1683 | \t/* Marcus: where is 4*headerLenght coming from ? */\n 1684 | \tif (size < headerLength * 4 + 2 * 4 + valuesize) return PTP_RC_GeneralError;\n 1685 | \t*propertyValueListLength \t\t= dtoh32a( (data) + headerLength * 4 + 2 * 4 + valuesize);\n 1686 | \n 1687 | \tptp_debug(params, \"header: %u, code: 0x%x, value: %u, count: %u\", headerLength, propertyCode, *currentValue, *propertyValueListLength);\n 1688 | \n 1689 | \tif (size < headerLength * 4 + 3 * 4 + valuesize + (*propertyValueListLength) * valuesize) {\n 1690 | \t\tptp_debug (params, \"size %d vs expected size %d\", size, headerLength * 4 + 3 * 4 + valuesize + (*propertyValueListLength) * valuesize);\n 1691 | \t\treturn PTP_RC_GeneralError;\n 1692 | \t}\n 1693 | \n 1694 | \t*propertyValueList = calloc(*propertyValueListLength, sizeof(uint32_t));\n 1695 | \n 1696 | \tfor(i = 0; i < *propertyValueListLength; i++) {\n 1697 | \t\tif(valuesize == 2) {\n 1698 | \t\t\t(*propertyValueList)[i] = (uint32_t) dtoh16a( (data) + headerLength * 4 + 3 * 4 + valuesize + i * valuesize);\n 1699 | \t\t} else if(valuesize == 4) {\n 1700 | \t\t\t(*propertyValueList)[i] = dtoh32a( (data) + headerLength * 4 + 3 * 4 + valuesize + i * valuesize);\n 1701 | \t\t}","lines":35,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/ptp.c#L1667-L1701"},{"ref":"src/ptp.c:1541-1544","code":" 1541 | \tuint32_t headerLength \t\t= dtoh32a( (data) + 4 );\n 1542 | \tif (size < 4 + 6 * 4) goto error;\n 1543 | \tuint32_t propertyCode \t\t= dtoh32a( (data) + 4 + 6 * 4 );\n 1544 | \tif (size < headerLength * 4 + 2 * 4) goto error;","lines":4,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/ptp.c#L1541-L1544"}]},{"id":"OVF_17","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"`ptp_chdk_read_script_msg` allocates `sizeof(ptp_chdk_script_msg) + ptp.Param4 + 1` and then `memcpy((*msg)->data, data, ptp.Param4)`. `ptp.Param4` is a response parameter chosen by the device, while `data` was received with a NULL recvlen so its actual length is unknown and independent of `Param4`. If `Param4` exceeds the real data-phase length, the `memcpy` reads out of bounds of the received buffer. The `malloc` result is also used without a NULL check.","fix":"Request the real received length from `ptp_transaction` (non-NULL recvlen) and copy `MIN(Param4, actual_size)`; also check the `malloc` result for NULL before dereferencing `*msg`.","locations":[{"ref":"src/ptp.c:5622-5636","code":" 5622 | \tCHECK_PTP_RC(ptp_transaction(params, &ptp, PTP_DP_GETDATA, 0, &data, NULL));\n 5623 | \tif (!data) {\n 5624 | \t\tptp_error(params,\"no data received\");\n 5625 | \t\treturn PTP_ERROR_BADPARAM;\n 5626 | \t}\n 5627 | \n 5628 | \t/* for convenience, always allocate an extra byte and null it*/\n 5629 | \t*msg = malloc(sizeof(ptp_chdk_script_msg) + ptp.Param4 + 1);\n 5630 | \t(*msg)->type = ptp.Param1;\n 5631 | \t(*msg)->subtype = ptp.Param2;\n 5632 | \t(*msg)->script_id = ptp.Param3;\n 5633 | \t(*msg)->size = ptp.Param4;\n 5634 | \tmemcpy((*msg)->data,data,(*msg)->size);\n 5635 | \t(*msg)->data[(*msg)->size] = 0;\n 5636 | \tfree(data);","lines":15,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/ptp.c#L5622-L5636"}]},{"id":"OVF_18","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"In `get_ep_type()` the sysfs file contents are read into a fixed 128-byte stack buffer with `bread = read(fd, buf, sizeof(buf));` and then compared with `strcmp(buf, \"Bulk\")` / `strcmp(buf, \"in\")` etc. `read()` does NOT null-terminate `buf`, and the only characters that get turned into `'\\0'` are `0x0d`/`0x0a` in the `for (i = 0; i < bread; i++)` loop. If the sysfs file returns exactly 128 bytes with no CR/LF inside the read window, `buf` has no terminator and `strcmp()` reads past the end of the stack buffer (out-of-bounds read). Even for shorter reads the code relies on the file containing a newline, which is an unstated invariant. The same pattern appears twice (the `type` read and the `direction` read).","fix":"Reserve one byte and terminate explicitly. Before:\n```\n  bread = read(fd, buf, sizeof(buf));\n  close(fd);\n  if (bread < 2)\n    return OTHER_EP;\n```\nAfter:\n```\n  bread = read(fd, buf, sizeof(buf) - 1);\n  close(fd);\n  if (bread < 2)\n    return OTHER_EP;\n  buf[bread] = '\\0';\n```\nApply the same change to both `read()` sites in `get_ep_type()`.","locations":[{"ref":"util/mtp-probe.c:86-98","code":"   86 |   bread = read(fd, buf, sizeof(buf));\n   87 |   close(fd);\n   88 |   if (bread < 2)\n   89 |     return OTHER_EP;\n   90 | \n   91 |   for (i = 0; i < bread; i++)\n   92 |     if(buf[i] == 0x0d || buf[i] == 0x0a)\n   93 |       buf[i] = '\\0';\n   94 | \n   95 |   if (!strcmp(buf, \"Bulk\"))\n   96 |     is_bulk = 1;\n   97 |   if (!strcmp(buf, \"Interrupt\"))\n   98 |     is_interrupt = 1;","lines":13,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/util/mtp-probe.c#L86-L98"},{"ref":"util/mtp-probe.c:107-119","code":"  107 |   bread = read(fd, buf, sizeof(buf));\n  108 |   close(fd);\n  109 |   if (bread < 2)\n  110 |     return OTHER_EP;\n  111 | \n  112 |   for (i = 0; i < bread; i++)\n  113 |     if(buf[i] == 0x0d || buf[i] == 0x0a)\n  114 |       buf[i] = '\\0';\n  115 | \n  116 |   if (!strcmp(buf, \"in\"))\n  117 |     is_in = 1;\n  118 |   if (!strcmp(buf, \"out\"))\n  119 |     is_out = 1;","lines":13,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/util/mtp-probe.c#L107-L119"}]},{"id":"OVF_19","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"hard","description":"`generate_unique_filename()` sizes the VLA `newname` as `strlen(basename) + 6 + strlen(extension_position)`, reserving only 6 bytes for `_%d`. The loop lets `suffix` reach up to 1000000 (`_1000000`, 8 chars) plus the NUL terminator, so `sprintf(newname, \"%s_%d%s\", ...)` can write past the end of the stack VLA. Requires a very large number of colliding filenames but is an unbounded stack write.","fix":"Reserve enough space for the maximum suffix width and the NUL, e.g. size the buffer with `strlen(basename) + strlen(extension_position) + 16`, or use `snprintf` with an explicitly computed size.","locations":[{"ref":"src/libmtp.c:5723-5730","code":" 5723 |     suffix = 1;\n 5724 |     char newname[ strlen(basename) + 6 + strlen(extension_position)];\n 5725 |     sprintf(newname, \"%s_%d%s\", basename, suffix, extension_position);\n 5726 |     while ((check_filename_exists(params, newname)) && (suffix < 1000000)) {\n 5727 |       suffix++;\n 5728 |       sprintf(newname, \"%s_%d%s\", basename, suffix, extension_position);\n 5729 |     }\n 5730 |   return strdup(newname);","lines":8,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libmtp.c#L5723-L5730"}]},{"id":"OVF_20","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`LIBMTP_Custom_Operation()` writes `n_param` values into `(&ptp.Param1)[i]`, but `PTPContainer` only has 5 parameter fields (`Param1`..`Param5`). A caller passing `n_param > 5` writes past the parameter array inside the struct, corrupting adjacent `PTPContainer` fields / stack. There is no bounds check on `n_param`.","fix":"Reject or clamp `n_param` to the number of available parameter slots (5) before the loop, returning an error for out-of-range values.","locations":[{"ref":"src/libmtp.c:9458-9471","code":" 9458 | int LIBMTP_Custom_Operation(LIBMTP_mtpdevice_t *device, uint16_t code, int n_param, ...)\n 9459 | {\n 9460 |   PTPParams *params = (PTPParams *) device->params;\n 9461 |   PTPContainer ptp;\n 9462 |   va_list args;\n 9463 |   uint16_t ret;\n 9464 |   int i;\n 9465 | \n 9466 |   ptp.Code = code;\n 9467 |   ptp.Nparam = n_param;\n 9468 |   va_start(args, n_param);\n 9469 |   for (i = 0; i < n_param; i++)\n 9470 |     (&ptp.Param1)[i] = va_arg(args, uint32_t);\n 9471 |   va_end(args);","lines":14,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/libmtp.c#L9458-L9471"}]},{"id":"OVF_21","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"In the `PTP_EC_CANON_EOS_PropValueChanged` handler the only size guard is\n`if (size < PTP_cee_Prop_Val_Data) break;` (i.e. `size >= 0x0c`), giving `xsize = size - 0x0c`\nwhich can be 0. The subsequent per-datatype reads (`dtoh32a(xdata)`, `dtoh16a(xdata)`, ...)\nand the `CustomFunc1..11` path that does `xdata += 4; xsize -= 4;` do not verify that\n`xsize` is large enough. When `xsize == 0` the `xsize -= 4` underflows to a huge unsigned\nvalue, and the fixed reads (`dtoh32a(xdata)`, `dtoh8a(xdata)` after the `+= 4`) read up to\nseveral bytes past the current event. The outer loop only guarantees one more byte exists,\nso this can read a few bytes past `data + datasize`.","fix":"Check `xsize` against the datatype size before each read (e.g. `if (xsize < 4) break;` for\nUINT32/INT32, `if (xsize < 2)` for 16-bit, `if (xsize < 1)` for 8-bit) and guard the\n`xsize -= 4` with `if (xsize >= 4) { xdata += 4; xsize -= 4; }`.","locations":[{"ref":"src/ptp-pack.c:2097-2106","code":" 2097 | \t\tcase PTP_EC_CANON_EOS_PropValueChanged: {\t/* property info */\n 2098 | \t\t\tif (size < PTP_cee_Prop_Val_Data) {\n 2099 | \t\t\t\tptp_debug (params, \"%s size %d is smaller than %d\", prefix, size, PTP_cee_Prop_Val_Data);\n 2100 | \t\t\t\tbreak;\n 2101 | \t\t\t}\n 2102 | \n 2103 | \t\t\tunsigned int j;\n 2104 | \t\t\tuint32_t\tdpc = dtoh32a(curdata + PTP_cee_DPC);\n 2105 | \t\t\tconst uint8_t\t*xdata = curdata + PTP_cee_Prop_Val_Data;\n 2106 | \t\t\tunsigned int\txsize = size - PTP_cee_Prop_Val_Data;","lines":10,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/ptp-pack.c#L2097-L2106"},{"ref":"src/ptp-pack.c:2275-2276","code":" 2275 | \t\t\t\txdata += 4;\n 2276 | \t\t\t\txsize -= 4;","lines":2,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/ptp-pack.c#L2275-L2276"},{"ref":"src/ptp-pack.c:2309-2338","code":" 2309 | \t\t\tswitch (dpd->DataType) {\n 2310 | \t\t\tcase PTP_DTC_INT32:\n 2311 | \t\t\t\tdpd->DefaultValue.i32 = dtoh32a(xdata);\n 2312 | \t\t\t\tdpd->CurrentValue.i32 = dtoh32a(xdata);\n 2313 | \t\t\t\tptp_debug (params, INDENT \"prop %x value == %d (i32)\", dpc, dpd->CurrentValue.i32);\n 2314 | \t\t\t\tbreak;\n 2315 | \t\t\tcase PTP_DTC_UINT32:\n 2316 | \t\t\t\tdpd->DefaultValue.u32 = dtoh32a(xdata);\n 2317 | \t\t\t\tdpd->CurrentValue.u32 = dtoh32a(xdata);\n 2318 | \t\t\t\tptp_debug (params, INDENT \"prop %x value == 0x%08x (u32)\", dpc, dpd->CurrentValue.u32);\n 2319 | \t\t\t\tbreak;\n 2320 | \t\t\tcase PTP_DTC_INT16:\n 2321 | \t\t\t\tdpd->DefaultValue.i16 = dtoh16a(xdata);\n 2322 | \t\t\t\tdpd->CurrentValue.i16 = dtoh16a(xdata);\n 2323 | \t\t\t\tptp_debug (params, INDENT \"prop %x value == %d (i16)\", dpc, dpd->CurrentValue.i16);\n 2324 | \t\t\t\tbreak;\n 2325 | \t\t\tcase PTP_DTC_UINT16:\n 2326 | \t\t\t\tdpd->DefaultValue.u16 = dtoh16a(xdata);\n 2327 | \t\t\t\tdpd->CurrentValue.u16 = dtoh16a(xdata);\n 2328 | \t\t\t\tptp_debug (params, INDENT \"prop %x value == 0x%04x (u16)\", dpc, dpd->CurrentValue.u16);\n 2329 | \t\t\t\tbreak;\n 2330 | \t\t\tcase PTP_DTC_UINT8:\n 2331 | \t\t\t\tdpd->DefaultValue.u8  = dtoh8a(xdata);\n 2332 | \t\t\t\tdpd->CurrentValue.u8  = dtoh8a(xdata);\n 2333 | \t\t\t\tptp_debug (params, INDENT \"prop %x value == 0x%02x (u8)\", dpc, dpd->CurrentValue.u8);\n 2334 | \t\t\t\tbreak;\n 2335 | \t\t\tcase PTP_DTC_INT8:\n 2336 | \t\t\t\tdpd->DefaultValue.i8  = dtoh8a(xdata);\n 2337 | \t\t\t\tdpd->CurrentValue.i8  = dtoh8a(xdata);\n 2338 | \t\t\t\tptp_debug (params, INDENT \"prop %x value == %d (i8)\", dpc, dpd->CurrentValue.i8);","lines":30,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/ptp-pack.c#L2309-L2338"}]},{"id":"OVF_22","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`ptp_sigma_fp_parse_ifdlist` prints an ASCII IFD entry using a device-controlled offset: for `count > 4` it does `ptp_debug(params, \"ascii: %s\", &data[dtoh32a(data+offset+i*12+8)])`. The 32-bit value is used directly as an index into `data` with no bound check, and `%s` then reads until a NUL, an out-of-bounds read of attacker-controlled length. The `count <= 4` branch also `%s`-prints an in-band field that is not guaranteed to be NUL-terminated.","fix":"Validate that the decoded offset is `< size` and that a NUL terminator exists within `size` before using it as a `%s` argument; otherwise skip or truncate.","locations":[{"ref":"src/ptp.c:1020-1026","code":" 1020 | \t\tswitch (dtoh16a(data+offset+i*12+2)) {\n 1021 | \t\tcase 0x2: /* ASCII */\n 1022 | \t\t\tif (count > 4) {\n 1023 | \t\t\t\tptp_debug (params, \"ascii: %s\", &data[dtoh32a(data+offset+i*12+8)]);\n 1024 | \t\t\t} else {\n 1025 | \t\t\t\tptp_debug (params, \"ascii: %s\", data+offset+i*12+8);\n 1026 | \t\t\t}","lines":7,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/ptp.c#L1020-L1026"}]},{"id":"OVF_23","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`ptp_panasonic_getdevicepropertysize` checks `if (size < 4) goto error;` and then immediately reads `dtoh32a((data) + 4)`, which accesses bytes 4..7 and requires `size >= 8`. For received sizes of 4..7 this is a 1-4 byte out-of-bounds read before the later `size < 4 + 6*4` guard is reached.","fix":"Require `size >= 8` (or `size >= 4 + 6*4` up front) before reading `data+4`.","locations":[{"ref":"src/ptp.c:1540-1541","code":" 1540 | \tif (size < 4) goto error;\n 1541 | \tuint32_t headerLength \t\t= dtoh32a( (data) + 4 );","lines":2,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/src/ptp.c#L1540-L1541"}]},{"id":"OVF_24","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`sorted_codes = malloc(numentries * sizeof(int))` is immediately followed by the unconditional write `sorted_codes[0] = 0;`. When `numentries` is `0`, `malloc(0)` may return a non-`NULL` zero-length allocation, and `sorted_codes[0] = 0` then writes one `int` past the end of that allocation (heap buffer overflow). `numentries` comes from `LIBMTP_Get_Supported_Devices_List` and is normally non-zero, so this is a latent edge case rather than an everyday crash.","fix":"Guard the initialization on a non-empty list, e.g. wrap the sort block in `if (numentries > 0) { ... }`, or only run the loop body when `numentries > 0` so `sorted_codes[0]` is never written for an empty allocation.","locations":[{"ref":"util/mtp-hotplug.c:143-147","code":"  143 |     sorted_codes = malloc(numentries * sizeof(int));\n  144 |     if (sorted_codes == NULL) {\n  145 |       ret = -1;\n  146 |   } else {\n  147 |       sorted_codes[0] = 0;","lines":5,"link":"https://github.com/libmtp/libmtp/blob/ea1ce2030a17f52cd6615b483191af3b8b35b494/util/mtp-hotplug.c#L143-L147"}]},{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"openusb `probe_device_descriptor()` frees the wrong pointer: `openusb_get_raw_desc` is asked to fill `&bufptr` (which is pre-pointed at the stack array `buf`), and on the failure/short-descriptor paths the code calls `openusb_free_raw_desc(buf)` - freeing the
