<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e2e8f0;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#64748b;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#cbd5e1;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#94a3b8}
.project-info .pi-row .pi-k{color:#64748b}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#94a3b8;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#475569;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e2e8f0;border-color:#475569}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#64748b;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#94a3b8;border-color:#475569}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#475569;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#64748b;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#94a3b8;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e2e8f0}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#475569}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#94a3b8;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e2e8f0}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#cbd5e1}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#475569;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#64748b}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#64748b}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#64748b;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#64748b;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e2e8f0}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#cbd5e1;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#475569;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e2e8f0;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

<script type="application/json" id="D">[{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"In `GPUQueue::on_submitted_work_done`, the polling loop calls\n`self.instance.device_poll(self.device, PollType::wait_indefinitely()).unwrap()`.\n`device_poll` returns a `Result` that becomes `Err` on device loss / OOM / an\ninternal error, all of which are reachable at runtime (a device can be lost while\nJS is awaiting `queue.onSubmittedWorkDone()`). The `.unwrap()` turns such an error\ninto a full process panic (the whole Deno runtime aborts) instead of rejecting the\nreturned promise. Web content should never be able to abort the host by losing a\ndevice while a work-done promise is pending.","fix":"Propagate the error instead of unwrapping, e.g. map it into a `JsErrorBox` and\nreturn it from `device_poll_fut` so `try_join!` rejects the promise:\n```rust\nself\n  .instance\n  .device_poll(self.device, wgpu_types::PollType::wait_indefinitely())\n  .map_err(|e| JsErrorBox::generic(e.to_string()))?;\n```","locations":[{"ref":"deno_webgpu/queue.rs:103-110","code":"  103 |     let device_poll_fut = async move {\n  104 |       while !*done.borrow() {\n  105 |         {\n  106 |           self\n  107 |             .instance\n  108 |             .device_poll(self.device, wgpu_types::PollType::wait_indefinitely())\n  109 |             .unwrap();\n  110 |         }","lines":8,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/deno_webgpu/queue.rs#L103-L110"}]},{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`parse_execution_mode` handles `ExecutionMode::LocalSize` by indexing `args[0]`, `args[1]`,\n`args[2]` directly, but `args` is built with `self.data.by_ref().take(inst.wc as usize - 3)`\nafter only `inst.expect_at_least(3)?`. A malicious/malformed SPIR-V module can declare\n`OpExecutionMode <ep> LocalSize` with a word count of 3, 4, or 5 (i.e. fewer than the 3 required\noperands), or simply truncate the stream, leaving `args` shorter than 3. The subsequent slice\nindexing then panics (index out of bounds), a reachable DoS on attacker-controlled input.","fix":"Validate the operand count before indexing, e.g. return `Error::InvalidOperandCount(inst.op, inst.wc)`\nwhen `args.len() < 3`, or use `args.get(0/1/2).copied()` and error on `None` instead of `ep.workgroup_size = [args[0], args[1], args[2]]`.","locations":[{"ref":"naga/src/front/spv/mod.rs:2020-2022","code":" 2020 |             ExecutionMode::LocalSize => {\n 2021 |                 ep.workgroup_size = [args[0], args[1], args[2]];\n 2022 |             }","lines":3,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/front/spv/mod.rs#L2020-L2022"},{"ref":"naga/src/front/spv/mod.rs:1955-1959","code":" 1955 |         inst.expect_at_least(3)?;\n 1956 | \n 1957 |         let ep_id = self.next()?;\n 1958 |         let mode_id = self.next()?;\n 1959 |         let args: Vec<spirv::Word> = self.data.by_ref().take(inst.wc as usize - 3).collect();","lines":5,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/front/spv/mod.rs#L1955-L1959"}]},{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"In `GPUBuffer::map_async` (`deno_webgpu/buffer.rs`) the polling loop calls\n`self.instance.device_poll(self.device, PollType::wait_indefinitely()).unwrap()`. If the\ndevice is lost or errors while a map is pending (a normal, application-observable\ncondition), `device_poll` returns `Err` and the `unwrap()` panics, aborting the entire Deno\nisolate rather than surfacing a rejected promise. The same function also does\n`sender.send(status).unwrap()` in the map callback, which panics if the receiver has already\nbeen dropped. wgpu's API contract is that invalid/lost-device conditions become errors, not\npanics.","fix":"Propagate the poll error instead of unwrapping: map `device_poll(...)` to a\n`BufferError` (e.g. `.map_err(|_| BufferError::Operation(\"device poll failed\"))?`) inside\n`device_poll_fut`, and use `let _ = sender.send(status);` in the callback so a dropped\nreceiver can't panic.","locations":[{"ref":"deno_webgpu/buffer.rs:173-186","code":"  173 |     let done = Rc::new(RefCell::new(false));\n  174 |     let done_ = done.clone();\n  175 |     let device_poll_fut = async move {\n  176 |       while !*done.borrow() {\n  177 |         {\n  178 |           self\n  179 |             .instance\n  180 |             .device_poll(self.device, wgpu_types::PollType::wait_indefinitely())\n  181 |             .unwrap();\n  182 |         }\n  183 |         tokio::time::sleep(Duration::from_millis(10)).await;\n  184 |       }\n  185 |       Ok::<(), BufferError>(())\n  186 |     };","lines":14,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/deno_webgpu/buffer.rs#L173-L186"},{"ref":"deno_webgpu/buffer.rs:150-151","code":"  150 |       let callback = Box::new(move |status| {\n  151 |         sender.send(status).unwrap();","lines":2,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/deno_webgpu/buffer.rs#L150-L151"}]},{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`GPUComputePassEncoder::set_bind_group` (`deno_webgpu/compute_pass.rs`) reads\n`dynamic_offsets_data_start` (`start`, a `u64` cast to `usize`) and\n`dynamic_offsets_data_length` (`len`, a `u32` cast to `usize`) straight from JS and then\nslices `let offsets = &data[start..(start + len)];` where `data` has `ab_len =\nab.byte_length() / 4` elements. There is no check that `start + len <= ab_len` (the spec\nmandates a `RangeError` here), and these arguments are raw `v8::Value`s that bypass the\n`#[webidl]` validation. A call such as\n`pass.setBindGroup(0, bg, new Uint32Array(2), 5, 10)` makes the slice range exceed the\narray and panics (`slice index out of bounds`), aborting the whole Deno isolate. `start +\nlen` can also overflow `usize` before the slice, panicking in debug builds. The identical\npattern exists in `deno_webgpu/render_pass.rs:267` (out of scope but same root cause).","fix":"After computing `start`, `len` and `ab_len`, validate bounds and return a `WebIdlError`\ninstead of panicking, e.g.:\n```\nif start.checked_add(len).map_or(true, |end| end > ab_len) {\n    return Err(WebIdlError::new(PREFIX, ..., &\"offset+length out of bounds\"));\n}\nlet offsets = &data[start..start + len];\n```","locations":[{"ref":"deno_webgpu/compute_pass.rs:165-196","code":"  165 |     let err = if let Ok(uint_32) = dynamic_offsets.try_cast::<v8::Uint32Array>()\n  166 |     {\n  167 |       let start = u64::convert(\n  168 |         scope,\n  169 |         dynamic_offsets_data_start,\n  170 |         Cow::Borrowed(PREFIX),\n  171 |         (|| Cow::Borrowed(\"Argument 4\")).into(),\n  172 |         &IntOptions {\n  173 |           clamp: false,\n  174 |           enforce_range: true,\n  175 |         },\n  176 |       )? as usize;\n  177 |       let len = u32::convert(\n  178 |         scope,\n  179 |         dynamic_offsets_data_length,\n  180 |         Cow::Borrowed(PREFIX),\n  181 |         (|| Cow::Borrowed(\"Argument 5\")).into(),\n  182 |         &IntOptions {\n  183 |           clamp: false,\n  184 |           enforce_range: true,\n  185 |         },\n  186 |       )? as usize;\n  187 | \n  188 |       let ab = uint_32.buffer(scope).unwrap();\n  189 |       let ptr = ab.data().unwrap();\n  190 |       let ab_len = ab.byte_length() / 4;\n  191 | \n  192 |       // SAFETY: compute_pass_set_bind_group internally calls extend_from_slice with this slice\n  193 |       let data =\n  194 |         unsafe { std::slice::from_raw_parts(ptr.as_ptr() as _, ab_len) };\n  195 | \n  196 |       let offsets = &data[start..(start + len)];","lines":32,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/deno_webgpu/compute_pass.rs#L165-L196"}]},{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"The `queue_on_submitted_work_done` callback is `Box::new(move || { sender.send(()).unwrap(); })`.\nIf the awaiting async task is dropped before the callback fires (e.g. the JS promise\nis cancelled / the isolate tears down the pending op), the `oneshot::Receiver` is\ndropped and `sender.send(())` returns `Err`, so `.unwrap()` panics from inside the\nwgpu callback during a later `device_poll`. Since the callback runs on the polling\npath, this aborts the process.","fix":"Ignore the send failure since a dropped receiver just means nobody is waiting:\n`let _ = sender.send(());`","locations":[{"ref":"deno_webgpu/queue.rs:93-95","code":"   93 |     let callback = Box::new(move || {\n   94 |       sender.send(()).unwrap();\n   95 |     });","lines":3,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/deno_webgpu/queue.rs#L93-L95"}]},{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"In both render-pass and render-bundle `set_bind_group`, when `dynamic_offsets` is a\n`Uint32Array` the code slices `let offsets = &data[start..(start + len)];` where\n`start` (a `u64` from `dynamic_offsets_data_start`) and `len` (a `u32` from\n`dynamic_offsets_data_length`) are cast to `usize` and used with no check that\n`start + len <= ab_len`. There is no validation that these fall within the backing\narray, so a caller passing an out-of-range `start`/`len` triggers an\nout-of-bounds slice panic (and `start + len` can additionally overflow `usize` for\na large `start`). Unlike the WebGPU-spec-mandated validation error, this aborts the\nprocess. The non-`Uint32Array` path validates via `WebIdlConverter`, but this fast\npath does not.","fix":"Before slicing, validate the range using checked arithmetic and return a\n`WebIdlError`/`JsErrorBox` (or clamp) when out of bounds, e.g.:\n```rust\nlet end = start.checked_add(len).filter(|&e| e <= ab_len)\n    .ok_or_else(|| /* validation error */)?;\nlet offsets = &data[start..end];\n```","locations":[{"ref":"deno_webgpu/render_pass.rs:265-273","code":"  265 |       let ab = uint_32.buffer(scope).unwrap();\n  266 |       let ptr = ab.data().unwrap();\n  267 |       let ab_len = ab.byte_length() / 4;\n  268 | \n  269 |       // SAFETY: created from an array buffer, slice is dropped at end of function call\n  270 |       let data =\n  271 |         unsafe { std::slice::from_raw_parts(ptr.as_ptr() as _, ab_len) };\n  272 | \n  273 |       let offsets = &data[start..(start + len)];","lines":9,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/deno_webgpu/render_pass.rs#L265-L273"},{"ref":"deno_webgpu/render_bundle.rs:170-178","code":"  170 |       let ab = uint_32.buffer(scope).unwrap();\n  171 |       let ptr = ab.data().unwrap();\n  172 |       let ab_len = ab.byte_length() / 4;\n  173 | \n  174 |       // SAFETY: created from an array buffer, slice is dropped at end of function call\n  175 |       let data =\n  176 |         unsafe { std::slice::from_raw_parts(ptr.as_ptr() as _, ab_len) };\n  177 | \n  178 |       let offsets = &data[start..(start + len)];","lines":9,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/deno_webgpu/render_bundle.rs#L170-L178"}]},{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`write_fun` in the DOT backend contains `assert!(sg.calls.is_empty());`\nimmediately followed by a loop over `sg.calls`. However `StatementGraph::add`\nunconditionally pushes an entry into `self.calls` for every `Statement::Call`\n(`self.calls.push((id, function))`). Therefore the assertion fires - panicking -\nfor *any* module whose function/entry-point body contains a function call, which\nis extremely common in real WGSL. Since `assert!` (not `debug_assert!`) is\nretained in release builds, `naga::back::dot::write` (a public API, used e.g. by\nthe naga CLI `--dot` output) panics on the majority of real shader modules\ninstead of emitting the graph. The loop that follows the assert is effectively\ndead code because it can only run when the assert would already have passed.","fix":"Remove the `assert!(sg.calls.is_empty());` line so the existing loop can actually\nrender call edges (the loop body already writes a correctly-prefixed\n`{prefix}_s{from} -> f{n}_s0` edge). If call edges are intentionally unsupported,\ninstead stop pushing to `self.calls` in the `S::Call` arm and drop both the\nassert and the loop.","locations":[{"ref":"naga/src/back/dot/mod.rs:547-556","code":"  547 |     assert!(sg.calls.is_empty());\n  548 |     for (from, function) in sg.calls {\n  549 |         writeln!(\n  550 |             output,\n  551 |             \"\\t\\t{}_s{} -> {}_s0\",\n  552 |             prefix,\n  553 |             from,\n  554 |             Prefixed(function),\n  555 |         )?;\n  556 |     }","lines":10,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/back/dot/mod.rs#L547-L556"},{"ref":"naga/src/back/dot/mod.rs:231-244","code":"  231 |                 S::Call {\n  232 |                     function,\n  233 |                     ref arguments,\n  234 |                     result,\n  235 |                 } => {\n  236 |                     for &arg in arguments {\n  237 |                         self.dependencies.push((id, arg, \"arg\"));\n  238 |                     }\n  239 |                     if let Some(expr) = result {\n  240 |                         self.emits.push((id, expr));\n  241 |                     }\n  242 |                     self.calls.push((id, function));\n  243 |                     \"Call\"\n  244 |                 }","lines":14,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/back/dot/mod.rs#L231-L244"}]},{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"In `write_wrapper_function`, the loop that copies vertex-output members\n(`naga/src/back/msl/mesh_shader.rs:350-358`) unwraps each member name with\n`new_name.as_ref().unwrap()`. The `out_vertex_member_names` vector contains a\n`None` entry for every member that `write_mesh_output_types` chose to *skip*:\none iteration pushes `None` (line 76) and only non-skipped members overwrite it\nwith `Some` (line 128). A member is skipped when it is a\n`BuiltIn::PointSize` and `allow_and_force_point_size` is false (lines 88-92), or\nwhen it is `PointIndex`/`LineIndices`/`TriangleIndices` (lines 94-101). If the\nvertex output type contains any such member, `out_vertex_member_names` holds a\n`None` at that index and the vertex copy loop panics with `unwrap()`. Note the\n*primitive* copy loop right below (lines 379-393) correctly guards this with\n`if let Some(new_name) = new_name.as_ref() { ... } else { ... }`; the vertex loop\nis inconsistent and does not.","fix":"Guard the vertex copy the same way the primitive loop does, skipping `None`\nentries (or emitting nothing for them) instead of `unwrap()`ing:\n```rust\nif let Some(new_name) = new_name.as_ref() {\n    let out_value = format!(\"{out_vert}.{new_name}\");\n    writeln!(self.out, \"{indent}{indent}{out_value} = {in_value};\")?;\n}\n```","locations":[{"ref":"naga/src/back/msl/mesh_shader.rs:350-358","code":"  350 |                 for (member_idx, new_name) in mesh_out.out_vertex_member_names.iter().enumerate() {\n  351 |                     let in_value = format!(\n  352 |                         \"{in_array}.{WRAPPED_ARRAY_FIELD}[{vert_index}].{}\",\n  353 |                         self.names\n  354 |                             [&NameKey::StructMember(info.vertex_output_type, member_idx as u32)]\n  355 |                     );\n  356 |                     let out "type_label":"Panic","severity":"medium","difficulty":"medium","description":"`parse_array_specifier_single` calls `frontend.layouter.update(ctx.module.to_ctx()).unwrap()`\nwhile parsing an array specifier in attacker-controlled GLSL. `Layouter::update`\nreturns `Err` (a `LayoutError`, e.g. on type-size/stride overflow for a\ndeeply/largely sized array type) which the `.unwrap()` converts into a panic. A\ncrafted GLSL shader can thus panic the compiler (DoS) instead of producing a clean\ncompilation error.","fix":"Propagate the layout error as a GLSL `Error` instead of unwrapping, e.g. map the\n`LayoutError` into `ErrorKind::SemanticError`/an appropriate error variant with the\ncurrent span and return it via `?`.","locations":[{"ref":"naga/src/front/glsl/parser/types.rs:55-56","code":"   55 |             frontend.layouter.update(ctx.module.to_ctx()).unwrap();\n   56 |             let stride = frontend.layouter[*ty].to_stride();","lines":2,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/front/glsl/parser/types.rs#L55-L56"}]},{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"In `parse_image_sample`, the sampler-tracking match uses `*self.handle_sampling.get_mut(&handle).unwrap()`\nfor both the direct `GlobalVariable` and the `Access` -> `GlobalVariable` cases. `handle_sampling` is\nonly populated for globals whose type satisfies `can_comparison_sample` (samplers, sampled float\nimages, and binding arrays thereof). The sampler operand of an `OpSampledImage` comes from\n`lookup_sampled_image`, whose `sampler` handle can be made to point at any global expression by a\nmalformed module (e.g. a storage buffer global). In that case the global is absent from\n`handle_sampling` and the `.unwrap()` panics. Note the image branch just above deliberately uses the\ngraceful `if let Some(flags) = self.handle_sampling.get_mut(&handle)`, making this an inconsistent\ncopy that reintroduces a panic.","fix":"Mirror the image branch and use `if let Some(flags) = self.handle_sampling.get_mut(&handle) { *flags |= sampling_bit; }`\ninstead of `*self.handle_sampling.get_mut(&handle).unwrap() |= sampling_bit;` in both sampler arms\n(lines 726 and 735).","locations":[{"ref":"naga/src/front/spv/image.rs:724-742","code":"  724 |         match ctx.expressions[si_lexp.sampler] {\n  725 |             crate::Expression::GlobalVariable(handle) => {\n  726 |                 *self.handle_sampling.get_mut(&handle).unwrap() |= sampling_bit;\n  727 |             }\n  728 | \n  729 |             crate::Expression::FunctionArgument(i) => {\n  730 |                 ctx.parameter_sampling[i as usize] |= sampling_bit;\n  731 |             }\n  732 | \n  733 |             crate::Expression::Access { base, .. } => match ctx.expressions[base] {\n  734 |                 crate::Expression::GlobalVariable(handle) => {\n  735 |                     *self.handle_sampling.get_mut(&handle).unwrap() |= sampling_bit;\n  736 |                 }\n  737 | \n  738 |                 ref other => return Err(Error::InvalidGlobalVar(other.clone())),\n  739 |             },\n  740 | \n  741 |             ref other => return Err(Error::InvalidGlobalVar(other.clone())),\n  742 |         }","lines":19,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/front/spv/image.rs#L724-L742"}]},{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"Several arithmetic/comparison expression parsers call `.scalar_kind().unwrap()` on the result or\noperand type without checking that the type is actually a scalar/vector. A malformed SPIR-V module\ncan apply e.g. `OpSNegate`, `OpIAdd`, or `OpINotEqual` to a result/operand whose Naga type is a\nstruct, array, pointer, image, etc.; `TypeInner::scalar_kind()` then returns `None` and the\n`.unwrap()` panics instead of producing a clean parse error. This affects\n`parse_expr_unary_op_sign_adjusted`, `parse_expr_binary_op_sign_adjusted`, and\n`parse_expr_int_comparison`.","fix":"Replace `.scalar_kind().unwrap()` with `.scalar_kind().ok_or(Error::InvalidInnerType(<type_id>))?`\n(or a similarly appropriate error) so a non-numeric operand/result type yields a parse error rather\nthan a panic.","locations":[{"ref":"naga/src/front/spv/mod.rs:1079-1082","code":" 1079 |         let kind = ctx.module.types[result_lookup_ty.handle]\n 1080 |             .inner\n 1081 |             .scalar_kind()\n 1082 |             .unwrap();","lines":4,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/front/spv/mod.rs#L1079-L1082"},{"ref":"naga/src/front/spv/mod.rs:1145-1148","code":" 1145 |         let kind = ctx.module.types[expected_lookup_ty.handle]\n 1146 |             .inner\n 1147 |             .scalar_kind()\n 1148 |             .unwrap();","lines":4,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/front/spv/mod.rs#L1145-L1148"},{"ref":"naga/src/front/spv/mod.rs:1213-1216","code":" 1213 |         let p1_kind = ctx.module.types[p1_lookup_ty.handle]\n 1214 |             .inner\n 1215 |             .scalar_kind()\n 1216 |             .unwrap();","lines":4,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/front/spv/mod.rs#L1213-L1216"},{"ref":"naga/src/front/spv/mod.rs:1220-1223","code":" 1220 |         let p2_kind = ctx.module.types[p2_lookup_ty.handle]\n 1221 |             .inner\n 1222 |             .scalar_kind()\n 1223 |             .unwrap();","lines":4,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/front/spv/mod.rs#L1220-L1223"}]},{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`insert_composite` computes a `components` vector of length `count` and then writes\n`components[selection as usize] = ...`. For the `Struct` case, `selection` is validated because\n`lookup_member.get(&(handle, selection))` returns `None` (and errors) for out-of-range indices.\nBut for the `Array`, `Vector`, and `Matrix` cases there is no bounds check on `selection`\nagainst `count`/`size`. An `OpCompositeInsert` with an index >= the composite size (indices are\nliterals, attacker-controlled) makes both the `0..count` loop and the final\n`components[selection as usize]` write panic with an out-of-bounds index.","fix":"For the `Array`/`Vector`/`Matrix` arms, verify `(selection as usize) < count` and return\n`Error::InvalidAccessIndex(selection)` otherwise, before building `components` and indexing\n`components[selection as usize]`.","locations":[{"ref":"naga/src/front/spv/mod.rs:1366-1405","code":" 1366 |             crate::TypeInner::Array { size, .. } => {\n 1367 |                 let size = match size {\n 1368 |                     crate::ArraySize::Constant(size) => size.get(),\n 1369 |                     crate::ArraySize::Pending(_) => {\n 1370 |                         unreachable!();\n 1371 |                     }\n 1372 |                     // A runtime sized array is not a composite type\n 1373 |                     crate::ArraySize::Dynamic => {\n 1374 |                         return Err(Error::InvalidAccessType(root_type_id))\n 1375 |                     }\n 1376 |                 };\n 1377 | \n 1378 |                 let child_type_id = root_lookup\n 1379 |                     .base_id\n 1380 |                     .ok_or(Error::InvalidAccessType(root_type_id))?;\n 1381 | \n 1382 |                 (size as usize, child_type_id)\n 1383 |             }\n 1384 |             crate::TypeInner::Vector { size, .. }\n 1385 |             | crate::TypeInner::Matrix { columns: size, .. } => {\n 1386 |                 let child_type_id = root_lookup\n 1387 |                     .base_id\n 1388 |                     .ok_or(Error::InvalidAccessType(root_type_id))?;\n 1389 |                 (size as usize, child_type_id)\n 1390 |             }\n 1391 |             _ => return Err(Error::InvalidAccessType(root_type_id)),\n 1392 |         };\n 1393 | \n 1394 |         let mut components = Vec::with_capacity(count);\n 1395 |         for index in 0..count as u32 {\n 1396 |             let expr = expressions.append(\n 1397 |                 crate::Expression::AccessIndex {\n 1398 |                     base: root_expr,\n 1399 |                     index,\n 1400 |                 },\n 1401 |                 if index == selection { span } else { root_span },\n 1402 |             );\n 1403 |             components.push(expr);\n 1404 |         }\n 1405 |         components[selection as usize] = self.insert_composite(","lines":40,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/front/spv/mod.rs#L1366-L1405"}]},{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"`Op::CompositeConstruct` is accepted with only three words via\n`inst.expect_at_least(3)?`, but a valid `OpCompositeConstruct` requires at least\none constituent (word count >= 4: opcode + result-type + result-id +\n>=1 constituent). With `wc == 3` the constituent loop `for _ in 3..inst.wc`\nnever runs, leaving `components` empty, and `let first = components[0];`\n(line 712) then panics on out-of-bounds indexing. A crafted SPIR-V module\ntriggers this panic (DoS).","fix":"Require at least one constituent:\n```\n-                    inst.expect_at_least(3)?;\n+                    inst.expect_at_least(4)?;\n```","locations":[{"ref":"naga/src/front/spv/next_block.rs:698-712","code":"  698 |                 Op::CompositeConstruct => {\n  699 |                     inst.expect_at_least(3)?;\n  700 | \n  701 |                     let result_type_id = self.next()?;\n  702 |                     let id = self.next()?;\n  703 |                     let mut components = Vec::with_capacity(inst.wc as usize - 2);\n  704 |                     for _ in 3..inst.wc {\n  705 |                         let comp_id = self.next()?;\n  706 |                         log::trace!(\"\\t\\t\\tlooking up expr {comp_id:?}\");\n  707 |                         let lexp = self.lookup_expression.lookup(comp_id)?;\n  708 |                         let handle = get_expr_handle!(comp_id, lexp);\n  709 |                         components.push(handle);\n  710 |                     }\n  711 |                     let ty = self.lookup_type.lookup(result_type_id)?.handle;\n  712 |                     let first = components[0];","lines":15,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/front/spv/next_block.rs#L698-L712"}]},{"id":"PANIC_14","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"In `Op::Switch`, the selector type is matched only for `Scalar { kind: Uint }`\nand `Scalar { kind: Sint }`, with `ref other => unimplemented!(\"Unexpected selector {:?}\", other)`.\nA SPIR-V module whose selector expression has any other type (bool, float,\nvector, pointer, struct, ...) drives this `unimplemented!()` and panics rather\nthan returning a decode error.","fix":"Return a proper error for unexpected selector types instead of `unimplemented!`,\ne.g. `ref other => return Err(Error::InvalidInnerType(selector_lexp.type_id))`\n(or a dedicated invalid-selector error variant).","locations":[{"ref":"naga/src/front/spv/next_block.rs:2147-2167","code":" 2147 |                     let selector = match ctx.module.types[selector_lty.handle].inner {\n 2148 |                         crate::TypeInner::Scalar(crate::Scalar {\n 2149 |                             kind: crate::ScalarKind::Uint,\n 2150 |                             width: _,\n 2151 |                         }) => {\n 2152 |                             // IR expects a signed integer, so do a bitcast\n 2153 |                             ctx.expressions.append(\n 2154 | f let Ok(consensus_scalar) = ctx.automatic_conversion_consensus(None, &components)\n  507 |                 {\n  508 |                     // Note that this will *not* necessarily convert all the\n  509 |                     // components to the same type! The `automatic_conversion_consensus`\n  510 |                     // method only considers the parameters' leaf scalar\n  511 |                     // types; the parameters themselves could be any mix of\n  512 |                     // vectors, matrices, and scalars.\n  513 |                     //\n  514 |                     // But *if* it is possible for this array construction\n  515 |                     // expression to be well-typed at all, then all the\n  516 |                     // parameters must have the same type constructors (vec,\n  517 |                     // matrix, scalar) applied to their leaf scalars, so\n  518 |                     // reconciling their scalars is always the right thing to\n  519 |                     // do. And if this array construction is not well-typed,\n  520 |                     // these conversions will not make it so, and we can let\n  521 |                     // validation catch the error.\n  522 |                     ctx.convert_slice_to_common_leaf_scalar(&mut components, consensus_scalar)?;\n  523 |                 } else {\n  524 |                     // There's no consensus scalar. Emit the `Compose`\n  525 |                     // expression anyway, and let validation catch the problem.\n  526 |                 }\n  527 | \n  528 |                 let base = ctx.register_type(components[0])?;","lines":25,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/front/wgsl/lower/construction.rs#L504-L528"},{"ref":"naga/src/front/wgsl/lower/conversion.rs:356-358","code":"  356 |         let base = base\n  357 |             .or_else(|| components_iter.next().unwrap().1)\n  358 |             .ok_or(0usize)?;","lines":3,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/front/wgsl/lower/conversion.rs#L356-L358"}]},{"id":"PANIC_17","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"In `ConstantEvaluator::cast`, casting an `f16` literal to a concrete integer\ntype uses `num_traits::ToPrimitive` conversions unwrapped with `.unwrap()`,\njustified by the comment \"Only None on NaN or Inf\":\n\n```rust\nSc::U16 => ... Literal::F16(v) => f16::to_u16(&v.max(f16::ZERO)).unwrap(),\nSc::I32 => ... Literal::F16(v) => f16::to_i32(&v).unwrap(), //Only None on NaN or Inf\nSc::U32 => ... Literal::F16(v) => f16::to_u32(&v.max(f16::ZERO)).unwrap(),\nSc::I64 => ... Literal::F16(v) => f16::to_i64(&v).unwrap(), //Only None on NaN or Inf\nSc::U64 => ... Literal::F16(v) => f16::to_u64(&v.max(f16::ZERO)).unwrap(),\n```\n\nThe \"cannot be NaN/Inf\" assumption does not hold for `f16`. `check_literal_value`\n(`naga/src/valid/expression.rs:1466`) only rejects NaN/Inf for `F32` and `F64`;\n`F16` is not checked at all, so an `f16` NaN or +/-Inf literal survives\nvalidation. Such a literal is reachable from front ends that import raw\nconstants (e.g. `spv-in`), and can then be fed to a constant-expression integer\nconstructor like `i32(x)`/`u32(x)`. `to_i32`/`to_i64` return `None` for NaN and\nInf, and `to_u32`/`to_u64` return `None` for +Inf even after `.max(f16::ZERO)`,\nso `.unwrap()` panics - a denial-of-service on attacker-controlled shader input.\nNote the sibling `F32`/`F64` arms deliberately `clamp(min_float, max_float)`\ninstead of unwrapping, so this is an inconsistency in the same match.","fix":"Either make `check_literal_value` also reject `F16` NaN/Inf (closing the gap at\nthe source), or make these arms defensive like the `F32` arms - e.g. convert\n`f16` to `f32` and `clamp` into the target range, or map a `None` result to\n`return make_error()` instead of `.unwrap()`.","locations":[{"ref":"naga/src/proc/constant_evaluator.rs:2422-2484","code":" 2422 |                         Literal::F16(v) => f16::to_u16(&v.max(f16::ZERO)).unwrap(),\n 2423 |                         Literal::Bool(v) => v as u16,\n 2424 |                         Literal::F64(_) | Literal::I64(_) | Literal::U64(_) => {\n 2425 |                             return make_error();\n 2426 |                         }\n 2427 |                         Literal::AbstractInt(v) => v as u16,\n 2428 |                         Literal::AbstractFloat(v) => v as u16,\n 2429 |                     }),\n 2430 |                     Sc::I32 => Literal::I32(match literal {\n 2431 |                         Literal::I16(v) => v as i32,\n 2432 |                         Literal::U16(v) => v as i32,\n 2433 |                         Literal::I32(v) => v,\n 2434 |                         Literal::U32(v) => v as i32,\n 2435 |                         Literal::F32(v) => v.clamp(i32::min_float(), i32::max_float()) as i32,\n 2436 |                         Literal::F16(v) => f16::to_i32(&v).unwrap(), //Only None on NaN or Inf\n 2437 |                         Literal::Bool(v) => v as i32,\n 2438 |                         Literal::F64(_) | Literal::I64(_) | Literal::U64(_) => {\n 2439 |                             return make_error();\n 2440 |                         }\n 2441 |                         Literal::AbstractInt(v) => i32::try_from_abstract(v)?,\n 2442 |                         Literal::AbstractFloat(v) => i32::try_from_abstract(v)?,\n 2443 |                     }),\n 2444 |                     Sc::U32 => Literal::U32(match literal {\n 2445 |                         Literal::I16(v) => v as u32,\n 2446 |                         Literal::U16(v) => v as u32,\n 2447 |                         Literal::I32(v) => v as u32,\n 2448 |                         Literal::U32(v) => v,\n 2449 |                         Literal::F32(v) => v.clamp(u32::min_float(), u32::max_float()) as u32,\n 2450 |                         // max(0) avoids None due to negative, therefore only None on NaN or Inf\n 2451 |                         Literal::F16(v) => f16::to_u32(&v.max(f16::ZERO)).unwrap(),\n 2452 |                         Literal::Bool(v) => v as u32,\n 2453 |                         Literal::F64(_) | Literal::I64(_) | Literal::U64(_) => {\n 2454 |                             return make_error();\n 2455 |                         }\n 2456 |                         Literal::AbstractInt(v) => u32::try_from_abstract(v)?,\n 2457 |                         Literal::AbstractFloat(v) => u32::try_from_abstract(v)?,\n 2458 |                     }),\n 2459 |                     Sc::I64 => Literal::I64(match literal {\n 2460 |                         Literal::I16(v) => v as i64,\n 2461 |                         Literal::U16(v) => v as i64,\n 2462 |                         Literal::I32(v) => v as i64,\n 2463 |                         Literal::U32(v) => v as i64,\n 2464 |                         Literal::F32(v) => v.clamp(i64::min_float(), i64::max_float()) as i64,\n 2465 |                         Literal::Bool(v) => v as i64,\n 2466 |                         Literal::F64(v) => v.clamp(i64::min_float(), i64::max_float()) as i64,\n 2467 |                         Literal::I64(v) => v,\n 2468 |                         Literal::U64(v) => v as i64,\n 2469 |                         Literal::F16(v) => f16::to_i64(&v).unwrap(), //Only None on NaN or Inf\n 2470 |                         Literal::AbstractInt(v) => i64::try_from_abstract(v)?,\n 2471 |                         Literal::AbstractFloat(v) => i64::try_from_abstract(v)?,\n 2472 |                     }),\n 2473 |                     Sc::U64 => Literal::U64(match literal {\n 2474 |                         Literal::I16(v) => v as u64,\n 2475 |                         Literal::U16(v) => v as u64,\n 2476 |                         Literal::I32(v) => v as u64,\n 2477 |                         Literal::U32(v) => v as u64,\n 2478 |                         Literal::F32(v) => v.clamp(u64::min_float(), u64::       } => {\n  286 |                 // TransitionResources does not exist in Command, so skip or handle as needed.\n  287 |                 // If you want to ignore, you could panic or return a default.\n  288 |                 panic!(\"TransitionResources cannot be converted to Command\");\n  289 |             }","lines":8,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-core/src/device/trace/record.rs#L282-L289"}]},{"id":"PANIC_20","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`Draw::new` unconditionally asserts `assert!(limits.max_buffer_size <= u32::MAX as u64);`.\n`limits` here is `&desc.required_limits`, i.e. caller-controlled (see\n`device/resource.rs:547-554`, which passes `&desc.required_limits` into\n`IndirectValidation::new` -> `Draw::new`). Adapters can legitimately advertise, and\napplications can legitimately request, a `max_buffer_size` greater than `u32::MAX`\n(4 GiB). When indirect draw validation is enabled (it is by default whenever\n`InstanceFlags::VALIDATION_INDIRECT_CALL` is set and the downlevel/limit\nrequirements are met), requesting such a device aborts the process via the assert\ninstead of returning a recoverable error. This turns a valid device request into a\npanic/DoS.","fix":"Do not panic on caller-controlled limits. Either return a\n`CreateIndirectValidationPipelineError` when `limits.max_buffer_size > u32::MAX`\n(disabling indirect validation or failing device creation gracefully), or clamp the\neffective size used by this module to `u32::MAX` and document that buffers beyond\n4 GiB are not covered by indirect validation. At minimum replace `assert!` with a\nchecked error path so `Device::new` can propagate a `DeviceError`/creation error\ninstead of aborting.","locations":[{"ref":"wgpu-core/src/indirect_validation/draw.rs:68-72","code":"   68 |         // Indirect draw validation doesn't support buffer sizes higher than u32\n   69 |         // since its offsets in the shader and dynamic offsets are u32.\n   70 |         //\n   71 |         // See also: `u64_offset_to_u32_offset`.\n   72 |         assert!(limits.max_buffer_size <= u32::MAX as u64);","lines":5,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-core/src/indirect_validation/draw.rs#L68-L72"}]},{"id":"PANIC_21","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`create_surface_from_drm` turns recoverable Vulkan/driver failures into\nprocess-aborting panics via `.expect(...)`. `get_drm_display(...).expect(...)`,\n`acquire_drm_display(...).expect(...)`, `get_display_mode_properties(...).expect(...)`\nand `create_display_plane_surface(...).expect(...)` all panic on any Vulkan\nerror result (e.g. `ERROR_INITIALIZATION_FAILED`, `ERROR_SURFACE_LOST_KHR`,\nout-of-memory, or a display already in use by another process). The function\nalready returns `Result<Surface, crate::InstanceError>` and every other failure\npath in it produces an `InstanceError`, so these panics are inconsistent and\nmake DRM surface creation non-robust against transient driver conditions.","fix":"Replace each `.expect(...)` with `.map_err(|e| crate::InstanceError::with_source(...))?`\nso driver errors are propagated as `InstanceError` instead of aborting the\nprocess, matching the error handling used elsewhere in the same function.","locations":[{"ref":"wgpu-hal/src/vulkan/drm.rs:199-249","code":"  199 |         let display = unsafe {\n  200 |             acquire_drm_display_instance\n  201 |                 .get_drm_display(physical_device, fd, connector_id)\n  202 |                 .expect(\"Failed to get drm display\")\n  203 |         };\n  204 | \n  205 |         unsafe {\n  206 |             acquire_drm_display_instance\n  207 |                 .acquire_drm_display(physical_device, fd, display)\n  208 |                 .expect(\"Failed to acquire drm display\")\n  209 |         }\n  210 | \n a50f86a4241ef523f8fd6091cf9a0/wgpu-hal/src/vulkan/drm.rs#L199-L249"}]},{"id":"PANIC_22","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"In `NativeSwapchain::acquire`, the workaround for Intel drivers that return\n\"bizarre\" swapchain image indices is placed *after* the returned `index` is\nalready used to index `present_semaphores`. The line\n`let present_semaphore_arc = self.get_present_semaphores(index);` calls\n`self.present_semaphores[index as usize].clone()`, which panics with an\nout-of-bounds slice index whenever `index >= present_semaphores.len()`\n(which equals `images.len()`, typically 2-4). The guard\n`if self.device.vendor_id == intel::VENDOR && index > 0x100 { return Outdated }`\nonly runs on the *next* line, so it can never prevent the panic it was written\nto prevent: a bogus index such as `0x101` triggers the out-of-bounds index one\nstatement earlier. The intent is clearly to detect the bad index and return\n`SurfaceError::Outdated` gracefully, but the ordering defeats it.","fix":"Move the Intel bogus-index check so it runs *before* any use of `index` to\nindex into `present_semaphores` (and `images`). I.e. perform the\n`self.device.vendor_id == crate::auxil::db::intel::VENDOR && index > 0x100`\ncheck immediately after `acquire_next_image` returns `index`, returning\n`Err(crate::SurfaceError::Outdated)` there, and only afterwards call\n`self.get_present_semaphores(index)` and read `self.images[index as usize]`.","locations":[{"ref":"wgpu-hal/src/vulkan/swapchain/native.rs:519-534","code":"  519 |         self.advance_acquire_semaphore();\n  520 | \n  521 |         let present_semaphore_arc = self.get_present_semaphores(index);\n  522 | \n  523 |         // special case for Intel Vulkan returning bizarre values (ugh)\n  524 |         if self.device.vendor_id == crate::auxil::db::intel::VENDOR && index > 0x100 {\n  525 |             return Err(crate::SurfaceError::Outdated);\n  526 |         }\n  527 | \n  528 |         let identity = self.device.texture_identity_factory.next();\n  529 | \n  530 |         let texture = crate::vulkan::SurfaceTexture {\n  531 |             index,\n  532 |             texture: crate::vulkan::Texture {\n  533 |                 raw: self.images[index as usize],\n  534 |                 drop_guard: None,","lines":16,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-hal/src/vulkan/swapchain/native.rs#L519-L534"}]},{"id":"PANIC_23","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`GPUCompilationMessage::new` indexes the source string with\n`&source[start..start + loc.length as usize]` and `&source[0..start]` using the\nbyte `offset`/`length` reported by naga. If a reported location's `offset + length`\never exceeds the source length or does not fall on a UTF-8 char boundary, these\nslicing operations panic while building the compilation-info object for an already\nfailed shader compile. This is defensive hardening: a bad/stale location from naga\nwould turn an ordinary compile error into a process panic.","fix":"Use checked slicing (`source.get(start..end)`) and fall back to zeroed\n`offset`/`length`/`line_pos` when the range is invalid or not on a char boundary,\ninstead of direct indexing.","locations":[{"ref":"deno_webgpu/shader.rs:147-160","code":"  147 |         let start = loc.offset as usize;\n  148 | \n  149 |         // Naga reports a `line_pos` using UTF-8 bytes, so we cannot use it.\n  150 |         let line_start =\n  151 |           source[0..start].rfind('\\n').map(|pos| pos + 1).unwrap_or(0);\n  152 |         let line_pos = len_utf16(&source[line_start..start]) + 1;\n  153 | \n  154 |         Self {\n  155 |           message,\n  156 |           r#type: GPUCompilationMessageType::Error,\n  157 |           line_num: loc.line_number.into(),\n  158 |           line_pos,\n  159 |           offset: len_utf16(&source[0..start]),\n  160 |           length: len_utf16(&source[start..start + loc.length as usize]),","lines":14,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/deno_webgpu/shader.rs#L147-L160"}]},{"id":"PANIC_24","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`Op::SMod` computes `let kind = inner.scalar_kind().unwrap();` on the result\ntype. `TypeInner::scalar_kind()` returns `None` for non-scalar-kinded types\n(e.g. `Struct`, `Array`). A malformed SPIR-V module giving `OpSMod` a result\ntype that is not an integer scalar/vector panics on this `.unwrap()`. The same\npattern (`scalar_kind().unwrap()`) is used for `OpBitFieldInsert` /\n`OpBitFieldSExtract` operand/count types (`next_block.rs:1120-1127`,\n`1188-1195`), each a latent panic on crafted input.","fix":"Replace the `.unwrap()`s with an error return when `scalar_kind()` is `None`,\ne.g. `let kind = inner.scalar_kind().ok_or(Error::InvalidInnerType(result_type_id))?;`,\nand likewise for the bitfield offset/count kinds.","locations":[{"ref":"naga/src/front/spv/next_block.rs:891-894","code":"  891 |                     let result_ty = self.lookup_type.lookup(result_type_id)?;\n  892 |                     let inner = &ctx.module.types[result_ty.handle].inner;\n  893 |                     let kind = inner.scalar_kind().unwrap();\n  894 |                     let size = inner.size(ctx.gctx()) as u8;","lines":4,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/front/spv/next_block.rs#L891-L894"}]},{"id":"PANIC_25","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`RenderBundleEncoder::set_immediates` returns `Result<(), PassStateError>` but validates the\ndata length with `assert!(data.len().is_multiple_of(4))` rather than returning an error. The\n`data: &[u8]` slice originates from the public `Global::render_bundle_encoder_set_immediates`\nentry point. wgpu-core's contract is to return validation errors rather than panic; a caller\n(e.g. a language binding that does not pre-validate on the content timeline) passing a byte\nlength that is not a multiple of 4 crashes the process instead of getting an error back.","fix":"Replace the `assert!` with an early `return Err(...)` using an appropriate immediate-data\nerror variant (analogous to `ImmediateUploadError::SizeUnaligned`) so an unaligned `data.len()`\nis reported as a validation error instead of panicking.","locations":[{"ref":"wgpu-core/src/command/bundle.rs:647-661","code":"  647 |     pub fn set_immediates(&mut self, offset: u32, data: &[u8]) -> Result<(), PassStateError> {\n  648 |         pass_base!(self, PassErrorScope::SetImmediate);\n  649 | \n  650 |         // This should have been validated in content timeline\n  651 |         assert!(data.len().is_multiple_of(4));\n  652 | \n  653 |         self.base.commands.push(RenderCommand::SetImmediate {\n  654 |             offset,\n  655 |             data: data\n  656 |                 .chunks_exact(size_of::<u32>())\n  657 |                 .map(|ck| u32::from_le_bytes(ck.try_into().unwrap()))\n  658 |                 .collect(),\n  659 |         });\n  660 |         Ok(())\n  661 |     }","lines":15,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-core/src/command/bundle.rs#L647-L661"}]},{"id":"PANIC_26","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`&message[prefix.len() + 2..]` assumes every matched prefix is followed by at least a `\": \"`\nseparator. `message` only guarantees `starts_with(prefix)` (length `>= prefix.len()`), so a\ndriver-emitted message that is exactly the prefix (or `prefix` + one trailing byte) makes\n`prefix.len() + 2` exceed the string length and the slice panics inside the vectored exception\nhandler. Message text is driver/runtime controlled. (Currently latent because the\n`cast_slice` bug above prevents this branch from being reached, but it is a real defect once\nthat is fixed.)","fix":"Use a checked slice, e.g. `message.get(prefix.len() + 2..).unwrap_or(\"\")`, or strip the prefix\nand a `\": \"` separator with `strip_prefix` and fall back to the whole message when absent.","locations":[{"ref":"wgpu-hal/src/auxil/dxgi/exception.rs:65-71","code":"   65 |     let (message, level) = match MESSAGE_PREFIXES\n   66 |         .iter()\n   67 |         .find(|&&(prefix, _)| message.starts_with(prefix))\n   68 |     {\n   69 |         Some(&(prefix, level)) => (&message[prefix.len() + 2..], level),\n   70 |         None => (message, log::Level::Debug),\n   71 |     };","lines":7,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-hal/src/auxil/dxgi/exception.rs#L65-L71"}]},{"id":"PANIC_27","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`new_dynamic_dxc` calls `version_info.GetVersion(&mut major, &mut minor).unwrap()` on the\nraw FFI result. The surrounding code deliberately tolerates DXC 1.0 not exposing\n`IDxcVersionInfo` (the `cast` is guarded by `if let Ok(..)`), but once the cast succeeds the\n`GetVersion` HRESULT is `unwrap()`ed. If a present-but-misbehaving `dxcompiler.dll` returns\na failing HRESULT from `GetVersion`, this panics inside device creation instead of falling\nback to the assumed 1.0 shader model, turning a recoverable driver quirk into a hard crash.","fix":"Handle the HRESULT instead of unwrapping, e.g. only use the returned `major`/`minor` when\n`GetVersion(...).ok()` succeeds and otherwise keep the `(1, 0)` fallback already set up\nabove.","locations":[{"ref":"wgpu-hal/src/dx12/shader_compilation.rs:57-61","code":"   57 |         if let Ok(version_info) = compiler.cast::<Dxc::IDxcVersionInfo>() {\n   58 |             unsafe {\n   59 |                 version_info.GetVersion(&mut major, &mut minor).unwrap();\n   60 |             }\n   61 |         }","lines":5,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-hal/src/dx12/shader_compilation.rs#L57-L61"}]},{"id":"PANIC_28","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`free_resource` panics if `gpu_allocator`'s `free` returns an error\n(`panic!(\"Failed to destroy dx12 {:?}, {e}\")`). This runs on the resource-destruction path\n(including `Drop`), where unwinding is undesirable and a freeing failure (e.g. an allocation\nthat was already freed or belongs to a different allocator instance) should be logged rather\nthan aborting the process. The code itself flags this with a `// TODO: Don't panic here`.","fix":"Replace the `panic!` with a `log::error!` (the allocation is being dropped regardless), or\npropagate the failure through a result if the caller can act on it, rather than aborting on\na destruction-time error.","locations":[{"ref":"wgpu-hal/src/dx12/suballocation.rs:270-276","code":"  270 |         if let AllocationInner::Placed { inner } = allocation.inner {\n  271 |             match self.mem_allocator.inner.lock().free(inner) {\n  272 |                 Ok(_) => (),\n  273 |                 // TODO: Don't panic here\n  274 |                 Err(e) => panic!(\"Failed to destroy dx12 {:?}, {e}\", allocation.ty),\n  275 |             };\n  276 |         }","lines":7,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-hal/src/dx12/suballocation.rs#L270-L276"}]},{"id":"PANIC_29","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In `Instance::init`, the `EGL_MESA_platform_surfaceless` arm is selected purely on the client\nextension string, then calls `egl1_5.expect(\"Failed to get EGL 1.5 for surfaceless\")`. On a real\nEGL 1.4 implementation that advertises `EGL_MESA_platform_surfaceless` (supported on 1.4 via\n`EGL_EXT_platform_base`, as the adjacent comment notes), `upcast::<EGL1_5>()` returns `None` and\nthis `expect` panics during instance creation instead of falling through to the default-display\npath.","fix":"Handle the `None` case gracefully: only take the surfaceless path when a usable `egl1_5`\ninstance is available (or fall back to `get_display(DEFAULT_DISPLAY)`), rather than `expect`ing.","locations":[{"ref":"wgpu-hal/src/gles/egl.rs:864-883","code":"  864 |             x if client_ext_str.contains(\"EGL_MESA_platform_surfaceless\") => {\n  865 |                 log::debug!(\n  866 |                     \"No (or unknown) windowing system ({x:?}) present. Using surfaceless platform\"\n  867 |                 );\n  868 |                 #[allow(\n  869 |                     clippy::unnecessary_literal_unwrap,\n  870 |                     reason = \"this is only a literal on Emscripten\"\n  871 |                 )]\n  872 |                 // TODO: This extension is also supported on EGL 1.4 with EGL_EXT_platform_base: https://registry.khronos.org/EGL/extensions/MESA/EGL_MESA_platform_surfaceless.txt\n  873 |                 let egl = egl1_5.expect(\"Failed to get EGL 1.5 for surfaceless\");\n  874 |                 let display = unsafe {\n  875 |                     egl.get_platform_display(\n  876 |                         EGL_PLATFORM_SURFACELESS_MESA,\n  877 |                         khronos_egl::DEFAULT_DISPLAY,\n  878 |                         &[khronos_egl::ATTRIB_NONE],\n  879 |                     )\n  880 |                 }\n  881 |                 .map_err(instance_err(\"failed to get MESA surfaceless display\"))?;\n  882 |                 (display, WindowKind::Unknown)\n  883 |             }","lines":20,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-hal/src/gles/egl.rs#L864-L883"}]},{"id":"PANIC_30","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`Queue::process`'s `CopyBufferToBuffer` handler hits `todo!()` when both source and destination\nare host-emulated buffers (both `raw == None`). This path is reachable on GLES configurations\nwithout `PrivateCapabilities::BUFFER_ALLOCATION` / with `Workarounds::EMULATE_BUFFER_MAP`, where\n`create_buffer` produces `raw: None` buffers for mappable buffers. A `copy_buffer_to_buffer`\nbetween two such buffers panics the queue instead of performing a `memcpy` between the two host\n`Vec<u8>` allocations.","fix":"Implement the host-to-host copy instead of `todo!()`: lock both `map_state`s and\n`copy_from_slice` the `copy.size` bytes from `src.data[src_offset..]` into\n`dst.data[dst_offset..]`.","locations":[{"ref":"wgpu-hal/src/gles/queue.rs:450-452","code":"  450 |                     (None, None) => {\n  451 |                         todo!()\n  452 |                     }","lines":3,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-hal/src/gles/queue.rs#L450-L452"}]},{"id":"PANIC_31","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`CString::new` is called with caller-controlled strings and unwrapped, so an\ninterior NUL byte causes a panic instead of an error. In `compile_stage`,\n`CString::new(stage.entry_point).unwrap()` panics if the shader entry-point name\ncontains a NUL, and in `init_with_callback`, `CString::new(desc.name).unwrap()`\npanics if the application name contains a NUL. Both strings originate from the\npublic API surface.","fix":"Handle the `CString::new` error explicitly (e.g. map it to\n`crate::PipelineError`/`crate::InstanceError`, or strip/reject interior NULs)\ninstead of `.unwrap()`.","locations":[{"ref":"wgpu-hal/src/vulkan/device.rs:794","code":"  794 |         let entry_point = CString::new(stage.entry_point).unwrap();","lines":1,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-hal/src/vulkan/device.rs#L794"},{"ref":"wgpu-hal/src/vulkan/instance.rs:691","code":"  691 |         let app_name = CString::new(desc.name).unwrap();","lines":1,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-hal/src/vulkan/instance.rs#L691"}]},{"id":"PANIC_32","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"Instance/surface creation contains `.unwrap()` calls on fallible Vulkan\noperations that panic instead of returning the surrounding `Result`.\n`create_debug_utils_messenger(&vk_info, None).unwrap()` (in `from_raw`) and\n`create_metal_surface(&vk_info, None).unwrap()` (in `create_surface_from_layer`)\nabort the process on any driver error (e.g. out-of-host-memory), even though\n`from_raw` returns `Result<Self, InstanceError>` and `create_surface_from_layer`\nreturns `Result<Surface, InstanceError>`.","fix":"Propagate the errors with `.map_err(|e| crate::InstanceError::with_source(...))?`\nrather than `.unwrap()`, consistent with the other surface constructors in this\nfile.","locations":[{"ref":"wgpu-hal/src/vulkan/instance.rs:408-409","code":"  408 |                 let messenger =\n  409 |                     unsafe { extension.create_debug_utils_messenger(&vk_info, None) }.unwrap();","lines":2,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-hal/src/vulkan/instance.rs#L408-L409"},{"ref":"wgpu-hal/src/vulkan/instance.rs:628","code":"  628 |             unsafe { metal_loader.create_metal_surface(&vk_info, None).unwrap() }","lines":1,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-hal/src/vulkan/instance.rs#L628"}]},{"id":"PANIC_33","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In `CompilationMessage::from_js`, the UTF-16 offset is converted with\n`map_utf16_to_utf8_offset`, which returns `u32::MAX` (and logs an error) when the offset is\nout of bounds for the source string. That returned `offset` is then used directly to slice\nthe source: `&source[offset as usize..]`. If `map_utf16_to_utf8_offset` returned `u32::MAX`\n(or any value greater than `source.len()`), the slice indexing panics. The offsets come from\nthe browser's WGSL compiler diagnostics, so a stale/mismatched source or a browser reporting\nan offset past the end of the string turns a compilation-info query into an uncatchable wasm\nabort. The subsequent `length` computation has the same reliance on `offset` being in bounds.","fix":"Clamp/guard `offset` before slicing, e.g. `let offset = offset.min(source.len() as u32);`\nand treat an out-of-bounds offset as \"no span\" (`None`) rather than indexing `source` with a\npossibly-`u32::MAX` value.","locations":[{"ref":"wgpu/src/backend/webgpu.rs:174-181","code":"  174 |             WebShaderCompilationInfo::Wgsl { source } => {\n  175 |                 let offset = map_utf16_to_utf8_offset(utf16_offset, source);\n  176 |                 let length = map_utf16_to_utf8_offset(utf16_length, &source[offset as usize..]);\n  177 |                 let line_number = js_message.line_num() as u32; // That's legal, because we're counting lines the same way\n  178 | \n  179 |                 let prefix = &source[..offset as usize];\n  180 |                 let line_start = prefix.rfind('\\n').map(|pos| pos + 1).unwrap_or(0) as u32;\n  181 |                 let line_position = offset - line_start + 1; // Counting UTF-8 byte indices","lines":8,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu/src/backend/webgpu.rs#L174-L181"},{"ref":"wgpu/src/backend/webgpu.rs:141-155","code":"  141 | fn map_utf16_to_utf8_offset(utf16_offset: u32, text: &str) -> u32 {\n  142 |     let mut utf16_i = 0;\n  143 |     for (utf8_index, c) in text.char_indices() {\n  144 |         if utf16_i >= utf16_offset {\n  145 |             return utf8_index as u32;\n  146 |         }\n  147 |         utf16_i += c.len_utf16() as u32;\n  148 |     }\n  149 |     if utf16_i >= utf16_offset {\n  150 |         text.len() as u32\n  151 |     } else {\n  152 |         log::error!(\"UTF16 offset {utf16_offset} is out of bounds for string {text}\");\n  153 |         u32::MAX\n  154 |     }\n  155 | }","lines":15,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu/src/backend/webgpu.rs#L141-L155"}]},{"id":"UAF_1","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"medium","description":"`GPUBuffer::destroy` (`deno_webgpu/buffer.rs`) frees the underlying wgpu buffer via\n`buffer_destroy` but never detaches the JS `ArrayBuffer`s that `get_mapped_range` handed\nout. For a write-mapped range, `get_mapped_range` builds the `ArrayBuffer` with\n`v8::ArrayBuffer::new_backing_store_from_ptr(slice_pointer.as_ptr(), ...)`, i.e. the\nbacking store points **directly** at wgpu's mapped host memory (with a no-op deleter), and\nthose globals are stored in `self.mapped_js_buffers`. Only `unmap` walks\n`mapped_js_buffers` and calls `ab.detach(None)`. A script can therefore do:\n`const b = device.createBuffer({ size, usage: MAP_WRITE|COPY_SRC, mappedAtCreation: true });\nconst ab = b.getMappedRange(); b.destroy(); new Uint8Array(ab)[0] = 1;` and read/write freed\nGPU-host memory, a use-after-free reachable purely from JS. The WebGPU spec also requires\n`destroy()` to detach all mapped ranges' `ArrayBuffer`s. Note `destroy` is currently a\n`#[fast]` op with no `HandleScope`, so fixing it requires giving it a scope like `unmap`.","fix":"Make `destroy` a non-fast op that receives `scope: &mut v8::HandleScope`, and before (or\nafter) calling `buffer_destroy`, detach every tracked `ArrayBuffer` exactly like `unmap`:\n```\nfor ab in self.mapped_js_buffers.replace(vec![]) {\n    ab.open(scope).detach(None);\n}\nself.instance.buffer_destroy(self.id);\n```\nThis prevents JS from retaining a live view over memory that wgpu has freed.","locations":[{"ref":"deno_webgpu/buffer.rs:273-277","code":"  273 |   #[fast]\n  274 |   #[undefined]\n  275 |   fn destroy(&self) {\n  276 |     self.instance.buffer_destroy(self.id);\n  277 |   }","lines":5,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/deno_webgpu/buffer.rs#L273-L277"},{"ref":"deno_webgpu/buffer.rs:217-250","code":"  217 |     let bs = if mode == &MapMode::Write {\n  218 |       unsafe extern \"C\" fn noop_deleter_callback(\n  219 |         _data: *mut std::ffi::c_void,\n  220 |         _byte_length: usize,\n  221 |         _deleter_data: *mut std::ffi::c_void,\n  222 |       ) {\n  223 |       }\n  224 | \n  225 |       // SAFETY: creating a backing store from the pointer and length provided by wgpu\n  226 |       unsafe {\n  227 |         v8::ArrayBuffer::new_backing_store_from_ptr(\n  228 |           slice_pointer.as_ptr() as _,\n  229 |           range_size as usize,\n  230 |           noop_deleter_callback,\n  231 |           std::ptr::null_mut(),\n  232 |         )\n  233 |       }\n  234 |     } else {\n  235 |       // SAFETY: creating a vector from the pointer and length provided by wgpu\n  236 |       let slice = unsafe {\n  237 |         std::slice::from_raw_parts(slice_pointer.as_ptr(), range_size as usize)\n  238 |       };\n  239 |       v8::ArrayBuffer::new_backing_store_from_vec(slice.to_vec())\n  240 |     };\n  241 | \n  242 |     let shared_bs = bs.make_shared();\n  243 |     let ab = v8::ArrayBuffer::with_backing_store(scope, &shared_bs);\n  244 | \n  245 |     if mode == &MapMode::Write {\n  246 |       self\n  247 |         .mapped_js_buffers\n  248 |         .borrow_mut()\n  249 |         .push(v8::Global::new(scope, ab));\n  250 |     }","lines":34,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/deno_webgpu/buffer.rs#L217-L250"},{"ref":"deno_webgpu/buffer.rs:255-271","code":"  255 |   #[nofast]\n  256 |   #[undefined]\n  257 |   fn unmap(&self, scope: &mut v8::HandleScope) -> Result<(), BufferError> {\n  258 |     for ab in self.mapped_js_buffers.replace(vec![]) {\n  259 |       let ab = ab.open(scope);\n  260 |       ab.detach(None);\n  261 |     }\n  262 | \n  263 |     self\n  264 |       .instance\n  265 |       .buffer_unmap(self.id)\n  266 |       .map_err(BufferError::Access)?;\n  267 | \n  268 |     *self.map_state.borrow_mut() = \"unmapped\";\n  269 | \n  270 |     Ok(())\n  271 |   }","lines":17,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/deno_webgpu/buffer.rs#L255-L271"}]},{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"In `calculate_offset`, the span of an array member is computed as `size.get() * stride`,\nwhere both operands are `u32` and the array size is taken directly from the (user-supplied)\nGLSL shader. A shader declaring a large array inside an interface block, e.g.\n`float big[500000000];`, makes `size.get() * stride` exceed `u32::MAX` (here `5e8 * 16`),\nwhich panics in debug builds and silently wraps to a bogus span/stride in release builds.\nThe same unchecked `u32` arithmetic also appears in the struct branch (`span += info.span;`)\nand matrix branch (`align * columns as u32`). Because `calculate_offset` runs during GLSL\nparsing (before validation), this is reachable directly from attacker-controlled shader source.","fix":"Perform the size computation in `u64` (or use `checked_mul`/`checked_add`) and push a\n`SemanticError`/overflow error into `errors` when the result would exceed `u32::MAX`, e.g.:\n```rust\ncrate::ArraySize::Constant(size) => {\n    let span = (size.get() as u64).checked_mul(stride as u64);\n    match span.and_then(|s| u32::try_from(s).ok()) {\n        Some(s) => s,\n        None => { errors.push(Error { kind: ErrorKind::SemanticError(\"array too large\".into()), meta }); 0 }\n    }\n}\n```","locations":[{"ref":"naga/src/front/glsl/offset.rs:87-91","code":"   87 |             let span = match size {\n   88 |                 crate::ArraySize::Constant(size) => size.get() * stride,\n   89 |                 crate::ArraySize::Pending(_) => unreachable!(),\n   90 |                 crate::ArraySize::Dynamic => stride,\n   91 |             };","lines":5,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/front/glsl/offset.rs#L87-L91"},{"ref":"naga/src/front/glsl/offset.rs:146","code":"  146 |             (align, align * columns as u32)","lines":1,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/front/glsl/offset.rs#L146"},{"ref":"naga/src/front/glsl/offset.rs:164","code":"  164 |                 span += info.span;","lines":1,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/front/glsl/offset.rs#L164"}]},{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`Lowerer::r#struct` accumulates the running struct `offset` (a `u32`) with\n`offset += member_size`, where `member_size` comes from a user-controlled\n`@size(...)` attribute via `const_u32`. The only bound applied to the attribute\nis the lower bound `if size < member_min_size { return Err(...) }`; there is no\nupper bound, so `member_size` can be as large as `u32::MAX`. Because the\n`offset > crate::valid::MAX_TYPE_SIZE` check happens *after* the addition, a\nstruct whose earlier members already pushed `offset` above zero followed by a\nmember with a huge `@size` overflows the `u32`. In debug builds this panics with\nan arithmetic-overflow abort (a DoS reachable from a crafted shader); in release\nbuilds it silently wraps, so the wrapped small `offset` passes the\n`> MAX_TYPE_SIZE` guard and the struct is built with corrupted member offsets and\nspan. Example: a first member leaving `offset = 100`, then `@size(4294967295u) x: u32`\nwraps to `offset == 99`, bypassing the size check.","fix":"Use checked arithmetic and report `Error::TypeTooLarge` on overflow, e.g. replace\n`offset += member_size;` with:\n\n```rust\noffset = offset\n    .checked_add(member_size)\n    .filter(|&o| o <= crate::valid::MAX_TYPE_SIZE)\n    .ok_or_else(|| Box::new(Error::TypeTooLarge { span }))?;\n```\n\nand remove the now-redundant separate `> MAX_TYPE_SIZE` check (or keep it as a\nbelt-and-suspenders guard). The `member_alignment.round_up(offset)` calls should\nlikewise be protected, since `round_up` also adds without overflow checks.","locations":[{"ref":"naga/src/front/wgsl/lower/mod.rs:4615-4671","code":" 4615 |             let member_size = if let Some(size_expr) = member.size {\n 4616 |                 let (size, span) = self.const_u32(size_expr, &mut ctx.as_const())?;\n 4617 |                 if let ir::TypeInner::Array {\n 4618 |                     size: ir::ArraySize::Dynamic | ir::ArraySize::Pending(_),\n 4619 |                     ..\n 4620 |                 } = ctx.module.types[ty].inner\n 4621 |                 {\n 4622 |                     return Err(Box::new(Error::SizeAttributeRequiresFixedFootprint(span)));\n 4623 |                 }\n 4624 |                 if size < member_min_size {\n 4625 |                     return Err(Box::new(Error::SizeAttributeTooLow(span, member_min_size)));\n 4626 |                 } else {\n 4627 |                     size\n 4628 |                 }\n 4629 |             } else {\n 4630 |                 member_min_size\n 4631 |             };\n 4632 | \n 4633 |             let member_alignment = if let Some(align_expr) = member.align {\n 4634 |                 let (align, span) = self.const_u32(align_expr, &mut ctx.as_const())?;\n 4635 |                 if let Some(alignment) = proc::Alignment::new(align) {\n 4636 |                     if alignment < member_min_alignment {\n 4637 |                         return Err(Box::new(Error::AlignAttributeTooLow(\n 4638 |                             span,\n 4639 |                             member_min_alignment,\n 4640 |                         )));\n 4641 |                     } else {\n 4642 |                         alignment\n 4643 |                     }\n 4644 |                 } els
