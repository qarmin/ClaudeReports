e {\n 4645 |                     return Err(Box::new(Error::NonPowerOfTwoAlignAttribute(span)));\n 4646 |                 }\n 4647 |             } else {\n 4648 |                 member_min_alignment\n 4649 |             };\n 4650 | \n 4651 |             let binding = self.binding(&member.binding, ty, ctx)?;\n 4652 | \n 4653 |             offset = member_alignment.round_up(offset);\n 4654 |             struct_alignment = struct_alignment.max(member_alignment);\n 4655 | \n 4656 |             if !member.doc_comments.is_empty() {\n 4657 |                 doc_comments.push(Some(\n 4658 |                     member.doc_comments.iter().map(|s| s.to_string()).collect(),\n 4659 |                 ));\n 4660 |             }\n 4661 |             members.push(ir::StructMember {\n 4662 |                 name: Some(member.name.name.to_owned()),\n 4663 |                 ty,\n 4664 |                 binding,\n 4665 |                 offset,\n 4666 |             });\n 4667 | \n 4668 |             offset += member_size;\n 4669 |             if offset > crate::valid::MAX_TYPE_SIZE {\n 4670 |                 return Err(Box::new(Error::TypeTooLarge { span }));\n 4671 |             }","lines":57,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/front/wgsl/lower/mod.rs#L4615-L4671"}]},{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"In `parse_hex_float_parts`, the hex-float significand is accumulated into a\n`u128` with `acc = acc.checked_shl(4).ok_or(NumberError::NotRepresentable)? | digit as u128;`.\n`u128::checked_shl` only returns `None` when the *shift amount* is `>= 128`; the\nshift amount here is always the constant `4`, so `checked_shl(4)` never fails and\nnever detects that significant high bits are shifted out of the 128-bit value.\nAs a result, a hex-float literal whose integer/fraction part has more than 32\nsignificant hex digits silently wraps `acc` modulo `2^128` and produces a\n**wrong finite value** instead of the correct value or a `NotRepresentable`\nerror. For example `0x1` followed by 32 hex `0`s and a `p0` exponent\n(`0x100000000000000000000000000000000p0`, the value `2^128 ≈ 3.4e38`, which is\nrepresentable as an `AbstractFloat`/`f64`) accumulates `1 << 128`, which wraps to\n`acc == 0`, so `parse_hex_float_parts` hits the `if acc == 0 { return Ok((negative, 0, 0)); }`\npath and the literal is parsed as `0.0`. The later `if mant > u64::MAX as u128`\nguard does not catch this because the wrapped value is small. This is a silent\nmiscompilation of a valid (if unusual) shader constant, driven entirely by\nattacker/caller-controlled source text.","fix":"Use an operation that actually detects value overflow of the 128-bit\naccumulator, e.g. `checked_mul(16)` in both the integer-part and fractional-part\nloops:\n```rust\nacc = acc.checked_mul(16).ok_or(NumberError::NotRepresentable)? | digit as u128;\n```\n(`acc * 16 | digit` equals `acc * 16 + digit` since `digit < 16` and the low\nnibble is zero after multiplying by 16.) This turns the pathological\n>32-hex-digit case into a proper `NumberError::NotRepresentable` instead of a\nsilently wrong value. If exact-value preservation for such extreme literals is\ndesired, additionally fold any dropped high/low zero digits into the exponent as\nthe trailing-zero-removal loop already does.","locations":[{"ref":"naga/src/front/wgsl/parse/number.rs:463","code":"  463 |         acc = acc.checked_shl(4).ok_or(NumberError::NotRepresentable)? | digit as u128;","lines":1,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/front/wgsl/parse/number.rs#L463"},{"ref":"naga/src/front/wgsl/parse/number.rs:480","code":"  480 |             acc = acc.checked_shl(4).ok_or(NumberError::NotRepresentable)? | digit as u128;","lines":1,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/front/wgsl/parse/number.rs#L480"}]},{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"`ImmediateSlots::from_range` assumes the byte range fits within the 64-slot\n(256-byte) bitmask, but performs no bounds check:\n\n```\nlet lo = offset / 4;\nlet hi = (offset + size_bytes).div_ceil(4);\nSelf(u64::MAX << lo & u64::MAX >> (64 - hi))\n```\n\nFor a type larger than 256 bytes, `hi > 64`, so `64 - hi` underflows (debug:\npanic; release: wraps to a huge value, and the subsequent `>>`/`<<` shift by an\namount `>= 64` is masked, producing an incorrect mask). Likewise `offset + size_bytes`\ncan overflow `u32`, and `lo >= 64` overflows the `<<` shift. This is reachable\nthrough validation: naga does not bound the size of an `AddressSpace::Immediate`\nglobal (`validate_type` only checks scalar `immediates_compatibility`, not total\nsize), and `for_pointer`→`from_type`→`from_range` is called from the analyzer for\nany load of an immediate global. A shader such as\n`var<immediate> big: array<vec4<f32>, 100>;` (1600 bytes) that loads `big`\ntriggers `from_range(0, 1600)` (`hi == 400`), panicking in debug builds and\nsilently computing a wrong slot mask in release.","fix":"Reject / clamp ranges that exceed the 64-slot capacity before shifting. Compute\n`hi`/`lo` with `u64` and saturating/checked arithmetic, return an empty or full\nmask (or surface a validation error) when `offset + size_bytes > 256`, and guard\nthe shift amounts so `lo < 64` and `hi <= 64`. Additionally, ensure oversized\nimmediate globals are rejected during type/interface validation.","locations":[{"ref":"naga/src/valid/immediates.rs:16-23","code":"   16 |     pub const fn from_range(offset: u32, size_bytes: u32) -> Self {\n   17 |         if size_bytes == 0 {\n   18 |             return Self(0);\n   19 |         }\n   20 |         let lo = offset / 4;\n   21 |         let hi = (offset + size_bytes).div_ceil(4);\n   22 |         Self(u64::MAX << lo & u64::MAX >> (64 - hi))\n   23 |     }","lines":8,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/valid/immediates.rs#L16-L23"}]},{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"In `validate_type`'s `Struct` arm, member offsets (arbitrary caller/fuzzer-supplied\n`u32`s) are combined with sizes using unchecked arithmetic before any bound is\nenforced:\n\n- Line 765: `min_offset = member.offset + base_size;` — if `member.offset` is near\n  `u32::MAX` and `base_size >= 1`, this overflows. In debug it panics; in release\n  it wraps to a small value, so the following `if min_offset > span` check does\n  **not** fire and an out-of-bounds member is wrongly accepted\n  (`MemberOutOfBounds` is never returned).\n- Line 797: `let diff = member.offset - offset;` — `offset` here is a previous\n  struct member's offset (`prev_struct_data`). A member at `offset == 0` following\n  a struct-typed member (allowed via the `member.offset == 0` overlap \"HACK\" at\n  lines 754-755) makes this `0 - offset` underflow and panic in debug builds.\n\nThe `Layouter` run earlier does not validate individual member offsets (for a\nstruct it only uses `span` and member alignments), so these values reach this code\nunbounded.","fix":"Use checked/`u64`-widened arithmetic: compute `min_offset` as\n`member.offset as u64 + base_size as u64` (or `member.offset.checked_add(base_size)`)\nand treat overflow as `MemberOutOfBounds`; compute `diff` with\n`member.offset.checked_sub(offset)` and treat the `None` case as a disalignment\nerror rather than subtracting directly.","locations":[{"ref":"naga/src/valid/type.rs:764-766","code":"  764 |                     let base_size = gctx.types[member.ty].inner.size(gctx);\n  765 |                     min_offset = member.offset + base_size;\n  766 |                     if min_offset > span {","lines":3,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/valid/type.rs#L764-L766"},{"ref":"naga/src/valid/type.rs:796-797","code":"  796 |                     if let Some((span, offset)) = prev_struct_data {\n  797 |                         let diff = member.offset - offset;","lines":2,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/valid/type.rs#L796-L797"}]},{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`map_buffer_on_submit` (the macro shared by `CommandEncoder`, `CommandBuffer`, `RenderPass`,\nand `ComputePass`) computes the mapping offset/size with\n`range_to_offset_size(bounds, buffer.size)` but, unlike `Buffer::slice`, never calls\n`check_buffer_bounds`. `range_to_offset_size` performs unchecked subtractions\n(`whole_size - offset`, `bound - offset`, `bound + 1 - offset`), so an out-of-range `bounds`\n(e.g. `buffer.slice(200..)` on a 100-byte buffer) underflows: it panics in debug builds and\nsilently wraps to a bogus huge `size`/`offset` in release builds. The doc comment explicitly\npromises `# Panics - If bounds is outside the bounds of buffer` at record time, but no such\ncheck exists; the bad value is instead stored and only re-examined at submit time inside\n`Buffer::map_async`, where the wrapped range `offset..offset + size` can overflow again.","fix":"Make `check_buffer_bounds` `pub(crate)` and call it in `map_buffer_on_submit` right after\n`let (offset, size) = range_to_offset_size(bounds, buffer.size);`, exactly as `Buffer::slice`\ndoes, so out-of-range `bounds` panic deterministically at record time instead of wrapping.","locations":[{"ref":"wgpu/src/api/command_buffer_actions.rs:103-120","code":"  103 |         pub fn map_buffer_on_submit<S: core::ops::RangeBounds<BufferAddress>>(\n  104 |             &self,\n  105 |             buffer: &api::Buffer,\n  106 |             mode: MapMode,\n  107 |             bounds: S,\n  108 |             callback: impl FnOnce(Result<(), BufferAsyncError>) + WasmNotSend + 'static,\n  109 |         ) {\n  110 |             let (offset, size) = range_to_offset_size(bounds, buffer.size);\n  111 |             self.actions.lock().buffer_mappings.push(\n  112 |                 crate::api::command_buffer_actions::DeferredBufferMapping {\n  113 |                     buffer: buffer.clone(),\n  114 |                     mode,\n  115 |                     offset,\n  116 |                     size,\n  117 |                     callback: alloc::boxed::Box::new(callback),\n  118 |                 },\n  119 |             );\n  120 |         }","lines":18,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu/src/api/command_buffer_actions.rs#L103-L120"},{"ref":"wgpu/src/api/buffer.rs:1074-1091","code":" 1074 | #[track_caller]\n 1075 | pub(crate) fn range_to_offset_size<S: RangeBounds<BufferAddress>>(\n 1076 |     bounds: S,\n 1077 |     whole_size: BufferAddress,\n 1078 | ) -> (BufferAddress, BufferAddress) {\n 1079 |     let offset = match bounds.start_bound() {\n 1080 |         Bound::Included(&bound) => bound,\n 1081 |         Bound::Excluded(&bound) => bound + 1,\n 1082 |         Bound::Unbounded => 0,\n 1083 |     };\n 1084 |     let size = match bounds.end_bound() {\n 1085 |         Bound::Included(&bound) => bound + 1 - offset,\n 1086 |         Bound::Excluded(&bound) => bound - offset,\n 1087 |         Bound::Unbounded => whole_size - offset,\n 1088 |     };\n 1089 | \n 1090 |     (offset, size)\n 1091 | }","lines":18,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu/src/api/buffer.rs#L1074-L1091"}]},{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`Instruction::to_words` encodes the first word of every instruction as\n`(self.wc << 16) | self.op as u32`, where `wc` is a `u32` word count accumulated one at a time\nby `add_operand`/`set_type`/`set_result`. The SPIR-V word-count field is only 16 bits, but there\nis no check that `wc <= 0xFFFF`. For an instruction whose operand list is large enough to push\n`wc` past `0xFFFF` (for example a `OpConstantComposite`/`OpTypeStruct`/`OpCompositeConstruct`\nbuilt from a very large array of constituents), the `wc << 16` shift overflows the low 16 bits into\nthe opcode field, silently corrupting the emitted opcode and producing invalid SPIR-V with no error\nreturned. `source_auto_continued` already special-cases this 16-bit limit for `OpSource`, but the\ngeneric path does not guard it.","fix":"Guard against the 16-bit limit when finalizing an instruction, e.g. `debug_assert!(self.wc <= 0xFFFF)`\nin `to_words`, and ideally surface a real `Error` from the writer when an instruction would exceed\n`u16::MAX` words (splitting or rejecting the offending construct) instead of silently truncating\n`wc` into the opcode.","locations":[{"ref":"naga/src/back/spv/layout.rs:122-127","code":"  122 |     pub(super) fn to_words(&self, sink: &mut impl Extend<Word>) {\n  123 |         sink.extend(Some((self.wc << 16) | self.op as u32));\n  124 |         sink.extend(self.type_id);\n  125 |         sink.extend(self.result_id);\n  126 |         sink.extend(self.operands.iter().cloned());\n  127 |     }","lines":6,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/back/spv/layout.rs#L122-L127"},{"ref":"naga/src/back/spv/layout.rs:111-114","code":"  111 |     pub(super) fn add_operand(&mut self, operand: Word) {\n  112 |         self.operands.push(operand);\n  113 |         self.wc += 1;\n  114 |     }","lines":4,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/back/spv/layout.rs#L111-L114"}]},{"id":"OVF_8","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"When binding a dynamic storage buffer in `create_bind_group`, the bound size is computed as\n`size = (data.buffer.size - data.offset) as u32`, truncating a `u64` byte size to `u32`. For a storage buffer\nlarger than 4 GiB (or a remaining range exceeding 4 GiB), the truncated size is used as `NumElements = size / 4`\nin the SRV/UAV description, silently exposing a much smaller view than intended. Other size paths in this file use\n`try_into().unwrap()` which at least panics loudly on truncation rather than silently wrapping.","fix":"Compute the size in `u64` and convert with a checked cast, e.g.\n`let size = u32::try_from(data.buffer.size - data.offset).unwrap();`, or otherwise validate that the range fits in\n`u32` before use.","locations":[{"ref":"wgpu-hal/src/dx12/device.rs:1562-1564","code":" 1562 |                                 wgt::BufferBindingType::Storage { .. } => {\n 1563 |                                     size = (data.buffer.size - data.offset) as u32;\n 1564 |                                     dynamic_buffers.push(super::DynamicBuffer::Storage);","lines":3,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-hal/src/dx12/device.rs#L1562-L1564"}]},{"id":"OVF_9","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"In `draw` and `draw_indexed`, the multiview instance-index guard computes\n`first_instance as u64 + instance_count as u64 - 1`. When `instance_count == 0`\n(a legal no-op draw) and `first_instance == 0`, this evaluates `0u64 - 1`, which\npanics on overflow in debug builds and wraps to `u64::MAX` in release builds.\nIn release the wrapped value is `> multiview_instance_index_limit`, so a valid\nzero-instance draw on a multiview pipeline spuriously triggers the\n`panic!(\"This vulkan device is affected by #8333\")` path.","fix":"Guard against the empty draw before subtracting, e.g. check\n`instance_count != 0 && (first_instance as u64 + instance_count as u64 - 1) > limit`,\nor compute the last index as `first_instance as u64 + (instance_count as u64).saturating_sub(1)`\nand skip the check when `instance_count == 0`.","locations":[{"ref":"wgpu-hal/src/vulkan/command.rs:1075-1080","code":" 1075 |         if self.current_pipeline_is_multiview\n 1076 |             && (first_instance as u64 + instance_count as u64 - 1)\n 1077 |                 > self.device.private_caps.multiview_instance_index_limit as u64\n 1078 |         {\n 1079 |             panic!(\"This vulkan device is affected by [#8333](https://github.com/gfx-rs/wgpu/issues/8333)\");\n 1080 |         }","lines":6,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-hal/src/vulkan/command.rs#L1075-L1080"},{"ref":"wgpu-hal/src/vulkan/command.rs:1099-1104","code":" 1099 |         if self.current_pipeline_is_multiview\n 1100 |             && (first_instance as u64 + instance_count as u64 - 1)\n 1101 |                 > self.device.private_caps.multiview_instance_index_limit as u64\n 1102 |         {\n 1103 |             panic!(\"This vulkan device is affected by [#8333](https://github.com/gfx-rs/wgpu/issues/8333)\");\n 1104 |         }","lines":6,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-hal/src/vulkan/command.rs#L1099-L1104"}]},{"id":"OVF_10","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`Extent3d::mip_level_size` shifts the extent by an unmasked `level`\n(`self.width >> level`, `self.height >> level`, `self.depth_or_array_layers >> level`). A\n`level >= 32` triggers a debug-build panic (`attempt to shift right with overflow`) and, in\nrelease builds, Rust masks the shift amount to `level & 31`, silently returning a wrong\n(too-large) mip extent instead of the intended `1`. The function is `#[doc(hidden)]` and\ninternal, but nothing clamps `level` against `max_mips`.","fix":"Clamp the shift, e.g. `u32::max(1, self.width.checked_shr(level).unwrap_or(0))`\n(and likewise for height/depth), so any `level >= 32` yields `1` rather than panicking or\nproducing a masked-shift result.","locations":[{"ref":"wgpu-types/src/origin_extent.rs:178-191","code":"  178 |     pub fn mip_level_size(&self, level: u32, dim: TextureDimension) -> Self {\n  179 |         Self {\n  180 |             width: u32::max(1, self.width >> level),\n  181 |             height: match dim {\n  182 |                 TextureDimension::D1 => 1,\n  183 |                 _ => u32::max(1, self.height >> level),\n  184 |             },\n  185 |             depth_or_array_layers: match dim {\n  186 |                 TextureDimension::D1 => 1,\n  187 |                 TextureDimension::D2 => self.depth_or_array_layers,\n  188 |                 TextureDimension::D3 => u32::max(1, self.depth_or_array_layers >> level),\n  189 |             },\n  190 |         }\n  191 |     }","lines":14,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-types/src/origin_extent.rs#L178-L191"}]},{"id":"OVF_11","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`CommandEncoder::resolve_query_set` computes the query count as\n`query_range.end - query_range.start` with an unchecked subtraction on caller-supplied\n`u32`s. If a caller passes an inverted range (`end < start`), this panics in debug builds and\nwraps to a near-`u32::MAX` count in release builds, which is then forwarded to\n`self.inner.resolve_query_set(...)`.","fix":"Use `query_range.end.checked_sub(query_range.start)` (or validate `start <= end`) and panic\nwith a clear message, rather than relying on unchecked `-`, before passing the count on.","locations":[{"ref":"wgpu/src/api/command_encoder.rs:233-247","code":"  233 |     pub fn resolve_query_set(\n  234 |         &mut self,\n  235 |         query_set: &QuerySet,\n  236 |         query_range: Range<u32>,\n  237 |         destination: &Buffer,\n  238 |         destination_offset: BufferAddress,\n  239 |     ) {\n  240 |         self.inner.resolve_query_set(\n  241 |             &query_set.inner,\n  242 |             query_range.start,\n  243 |             query_range.end - query_range.start,\n  244 |             &destination.inner,\n  245 |             destination_offset,\n  246 |         );\n  247 |     }","lines":15,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu/src/api/command_encoder.rs#L233-L247"}]},{"id":"OVF_12","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`validate_write_buffer` bounds-checks with `write_size + offset > buffer.inner.size() as u64`\nwhere both `write_size` and `offset` are `u64` derived from caller input. A large `offset`\nmakes `write_size + offset` overflow; in release builds this wraps to a small value, so the\noverrun check passes and validation wrongly returns `Some(())`. (The subsequent JS\n`writeBuffer` then throws and the `.unwrap()` in `write_buffer` aborts, so the net effect is\na confusing abort instead of the intended clean `None` rejection.)","fix":"Use a checked/saturating add for the bounds test, e.g.\n`if offset.checked_add(write_size).is_none_or(|end| end > buffer.inner.size() as u64) { ... return None; }`.","locations":[{"ref":"wgpu/src/backend/webgpu.rs:2757-2786","code":" 2757 |     fn validate_write_buffer(\n 2758 |         &self,\n 2759 |         buffer: &dispatch::DispatchBuffer,\n 2760 |         offset: wgt::BufferAddress,\n 2761 |         size: wgt::BufferSize,\n 2762 |     ) -> Option<()> {\n 2763 |         let buffer = buffer.as_webgpu();\n 2764 | \n 2765 |         let usage = wgt::BufferUsages::from_bits_truncate(buffer.inner.usage());\n 2766 |         // TODO: actually send this down the error scope\n 2767 |         if !usage.contains(wgt::BufferUsages::COPY_DST) {\n 2768 |             log::error!(\"Destination buffer is missing the `COPY_DST` usage flag\");\n 2769 |             return None;\n 2770 |         }\n 2771 |         let write_size = u64::from(size);\n 2772 |         if !write_size.is_multiple_of(wgt::COPY_BUFFER_ALIGNMENT) {\n 2773 |             log::error!(\"Copy size {size} does not respect `COPY_BUFFER_ALIGNMENT`\");\n 2774 |             return None;\n 2775 |         }\n 2776 |         if !offset.is_multiple_of(wgt::COPY_BUFFER_ALIGNMENT) {\n 2777 |             log::error!(\n 2778 |                 \"Buffer offset {offset} is not aligned to block size or `COPY_BUFFER_ALIGNMENT`\"\n 2779 |             );\n 2780 |             return None;\n 2781 |         }\n 2782 |         if write_size + offset > buffer.inner.size() as u64 {\n 2783 |             log::error!(\"copy of {}..{} would end up overrunning the bounds of the destination buffer of size {}\", offset, offset + write_size, buffer.inner.size());\n 2784 |             return None;\n 2785 |         }\n 2786 |         Some(())","lines":30,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu/src/backend/webgpu.rs#L2757-L2786"}]},{"id":"OVF_13","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`resolve_query_set` truncates a 64-bit buffer offset to 32 bits:\n`destination_offset as u32`. The WebGPU spec types `resolveQuerySet`'s `destinationOffset`\nas `GPUSize64`, so for a destination offset at or above `u32::MAX` (possible when\n`maxBufferSize` exceeds 4 GiB) the high bits are silently dropped and the query results are\nwritten to the wrong location instead of surfacing an error. The public API passes a\n`crate::BufferAddress` (`u64`), so the value is caller-controlled.","fix":"Use an `f64`-based binding for the destination offset (as the other copy/write paths do,\ne.g. `set_offset_f64` / `..._with_f64`), passing `destination_offset as f64`, so the full\n64-bit offset is preserved instead of truncating with `as u32`.","locations":[{"ref":"wgpu/src/backend/webgpu.rs:3409-3427","code":" 3409 |     fn resolve_query_set(\n 3410 |         &self,\n 3411 |         query_set: &dispatch::DispatchQuerySet,\n 3412 |         first_query: u32,\n 3413 |         query_count: u32,\n 3414 |         destination: &dispatch::DispatchBuffer,\n 3415 |         destination_offset: crate::BufferAddress,\n 3416 |     ) {\n 3417 |         let query_set = &query_set.as_webgpu().inner;\n 3418 |         let destination = &destination.as_webgpu().inner;\n 3419 | \n 3420 |         self.inner.resolve_query_set_with_u32(\n 3421 |             query_set,\n 3422 |             first_query,\n 3423 |             query_count,\n 3424 |             destination,\n 3425 |             destination_offset as u32,\n 3426 |         );\n 3427 |     }","lines":19,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu/src/backend/webgpu.rs#L3409-L3427"}]},{"id":"OVF_14","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"Several dispatch methods compute counts as `end - start` on caller-supplied `Range`\nvalues without validating `start <= end`. If a caller passes a reversed range the\nsubtraction underflows: it panics in debug builds (overflow checks on) and silently\nwraps to a huge value in release builds, which is then forwarded to `wgc` as a\nvertex/index/instance count or map size. Representative cases:\n`render_pass_draw` uses `vertices.end - vertices.start` and\n`instances.end - instances.start`; `draw_indexed` uses `indices.end - indices.start`;\nthe render-bundle encoder duplicates the same pattern; and `map_async` /\n`get_mapped_range` compute `range.end - range.start` on `BufferAddress` (`u64`) ranges.\nWhile these come from the application rather than an untrusted network source, a\nreversed range yields an inconsistent panic-vs-wrap behavior between debug and release\ninstead of a clean validation error.","fix":"Use `checked_sub` (or `saturating_sub` plus an explicit validation error routed through\n`handle_error`) so a reversed range produces a deterministic error instead of a debug\npanic / release wraparound, e.g.\n`let count = vertices.end.checked_sub(vertices.start).unwrap_or(0);` combined with an\nexplicit range-order validation before the call.","locations":[{"ref":"wgpu/src/backend/wgpu_core.rs:3365-3372","code":" 3365 |     fn draw(&mut self, vertices: Range<u32>, instances: Range<u32>) {\n 3366 |         if let Err(cause) = self.context.0.render_pass_draw(\n 3367 |             &mut self.pass,\n 3368 |             vertices.end - vertices.start,\n 3369 |             instances.end - instances.start,\n 3370 |             vertices.start,\n 3371 |             instances.start,\n 3372 |         ) {","lines":8,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu/src/backend/wgpu_core.rs#L3365-L3372"},{"ref":"wgpu/src/backend/wgpu_core.rs:3382-3390","code":" 3382 |     fn draw_indexed(&mut self, indices: Range<u32>, base_vertex: i32, instances: Range<u32>) {\n 3383 |         if let Err(cause) = self.context.0.render_pass_draw_indexed(\n 3384 |             &mut self.pass,\n 3385 |             indices.end - indices.start,\n 3386 |             instances.end - instances.start,\n 3387 |             indices.start,\n 3388 |             base_vertex,\n 3389 |             instances.start,\n 3390 |         ) {","lines":9,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu/src/backend/wgpu_core.rs#L3382-L3390"},{"ref":"wgpu/src/backend/wgpu_core.rs:2251-2256","code":" 2251 |         match self.context.0.buffer_map_async(\n 2252 |             self.id,\n 2253 |             range.start,\n 2254 |             Some(range.end - range.start),\n 2255 |             operation,\n 2256 |         ) {","lines":6,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu/src/backend/wgpu_core.rs#L2251-L2256"},{"ref":"wgpu/src/backend/wgpu_core.rs:3879-3904","code":" 3879 |     fn draw(&mut self, vertices: Range<u32>, instances: Range<u32>) {\n 3880 |         self.context\n 3881 |             .0\n 3882 |             .render_bundle_encoder_draw(\n 3883 |                 &mut self.encoder,\n 3884 |                 vertices.end - vertices.start,\n 3885 |                 instances.end - instances.start,\n 3886 |                 vertices.start,\n 3887 |                 instances.start,\n 3888 |             )\n 3889 |             .expect(\"RenderBundleEncoder should not have ended\");\n 3890 |     }\n 3891 | \n 3892 |     fn draw_indexed(&mut self, indices: Range<u32>, base_vertex: i32, instances: Range<u32>) {\n 3893 |         self.context\n 3894 |             .0\n 3895 |             .render_bundle_encoder_draw_indexed(\n 3896 |                 &mut self.encoder,\n 3897 |                 indices.end - indices.start,\n 3898 |                 instances.end - instances.start,\n 3899 |                 indices.start,\n 3900 |                 base_vertex,\n 3901 |                 instances.start,\n 3902 |             )\n 3903 |             .expect(\"RenderBundleEncoder should not have ended\");\n 3904 |     }","lines":26,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu/src/backend/wgpu_core.rs#L3879-L3904"}]},{"id":"OVF_15","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"In `DeviceExt::create_texture_with_data`, the per-subresource byte count is computed entirely in\n`u32`:\n\n```rust\nlet bytes_per_row = width_blocks * block_size;\nlet data_size = bytes_per_row * height_blocks * mip_size.depth_or_array_layers;\n```\n\n`bytes_per_row`, `height_blocks`, `mip_size.depth_or_array_layers` and `data_size` are all `u32`, so\nfor a single large mip (for example a `2048x2048x256` 3D `Rgba8` texture: `8192 * 2048 * 256 ≈ 4.29e9`)\nthe product wraps around `u32::MAX`. The wrapped-small `data_size` is then used both as\n`end_offset = binary_offset + data_size as usize` and as the size of the source slice\n`&data[binary_offset..end_offset]`, so the upload silently reads the wrong (too-small) region and\n`binary_offset` desynchronizes for all following subresources, corrupting the whole upload.","fix":"Perform the size arithmetic in a wide type. For example compute\n`let data_size = bytes_per_row as u64 * height_blocks as u64 * mip_size.depth_or_array_layers as u64;`\nand use `data_size as usize` for the slice bounds (or keep everything in `usize`), so the multiply\ncannot wrap for large subresources.","locations":[{"ref":"wgpu/src/util/device.rs:134-140","code":"  134 |                 let width_blocks = mip_physical.width / block_width;\n  135 |                 let height_blocks = mip_physical.height / block_height;\n  136 | \n  137 |                 let bytes_per_row = width_blocks * block_size;\n  138 |                 let data_size = bytes_per_row * height_blocks * mip_size.depth_or_array_layers;\n  139 | \n  140 |                 let end_offset = binary_offset + data_size as usize;","lines":7,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu/src/util/device.rs#L134-L140"}]},{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In the `Statement::Switch` handler, the fall-through target label is computed with\n`case_ids[i + 1]`, but `i` is the index produced by `.enumerate()` **after** the\n`.filter(...)` that drops empty fall-through cases, while `case_ids` is built over the\n**unfiltered** case list (one entry per original case). Whenever an empty fall-through\ncase precedes a non-empty fall-through case, `i` is smaller than that case's original\nposition, so `case_ids[i + 1]` selects the wrong block label.\n\nThis is reachable from the GLSL frontend (see `naga/src/front/glsl/parser/functions.rs`,\nwhich emits an empty `fall_through: true` case for a bare `case N:` label followed by a\nnon-empty falling-through case). Concretely, for:\n\n```glsl\nswitch (x) {\n  case 0:            // empty, fall_through = true  -> filtered out\n  case 1: y = 1;     // non-empty, fall_through = true\n  case 2: y = 2; break;\n}\n```\n\n`case_ids` becomes `[A, A, B, C]` (case0 and case1 share label `A`). In the second loop\n`case 1` has filtered index `i == 0`, so `case_finish_id = case_ids[1] == A`, i.e. the\nblock branches to its own label instead of `B` (case 2). The result is a self-branch,\nproducing invalid SPIR-V / broken control flow.","fix":"Do not index the unfiltered `case_ids` with the filtered `enumerate` index. Instead index\ninto the filtered sequence, e.g. collect the surviving `(case, label_id)` pairs into a\n`Vec` first and use the next entry's `label_id` as the fall-through target:\n\n```rust\nlet live: Vec<(&crate::SwitchCase, Word)> = cases\n    .iter()\n    .zip(case_ids.iter().copied())\n    .filter(|&(case, _)| !(case.fall_through && case.body.is_empty()))\n    .collect();\nfor (i, &(case, label_id)) in live.iter().enumerate() {\n    let case_finish_id = if case.fall_through {\n        live[i + 1].1\n    } else {\n        merge_id\n    };\n    let _ = self.write_block(label_id, &case.body, BlockExit::Branch { target: case_finish_id }, inner_context, debug_info)?;\n}\n```","locations":[{"ref":"naga/src/back/spv/block.rs:3627-3654","code":" 3627 |                     for (i, (case, label_id)) in cases\n 3628 |                         .iter()\n 3629 |                         .zip(case_ids.iter())\n 3630 |                         .filter(|&(case, _)| !(case.fall_through && case.body.is_empty()))\n 3631 |                         .enumerate()\n 3632 |                     {\n 3633 |                         let case_finish_id = if case.fall_through {\n 3634 |                             case_ids[i + 1]\n 3635 |                         } else {\n 3636 |                             merge_id\n 3637 |                         };\n 3638 |                         // We can ignore the `BlockExitDisposition` returned here because\n 3639 |                         // `case_finish_id` is always referred to by either:\n 3640 |                         //\n 3641 |                         // - the `OpSwitch`, if it's the next case's label for a\n 3642 |                         //   fall-through, or\n 3643 |                         //\n 3644 |                         // - the `OpSelectionMerge`, if it's the switch's overall merge\n 3645 |                         //   block because there's no fall-through.\n 3646 |                         let _ = self.write_block(\n 3647 |                             *label_id,\n 3648 |                             &case.body,\n 3649 |                             BlockExit::Branch {\n 3650 |                                 target: case_finish_id,\n 3651 |                             },\n 3652 |                             inner_context,\n 3653 |                             debug_info,\n 3654 |                         )?;","lines":28,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/back/spv/block.rs#L3627-L3654"}]},{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`InitTracker::<u32>::discard` breaks the \"sorted by range end\" invariant that\n`uninitialized_ranges` must uphold. When `pos` falls strictly before the first\nrange whose `end >= pos` and is not adjacent to it (`r.start > pos` and\n`r.start != pos + 1`), the new single-element range is appended with\n`self.uninitialized_ranges.push(pos..(pos + 1));`. Because the range at `r_idx`\n(and any ranges after it) have larger `end` values, appending at the tail leaves\nthe vector out of order.\n\nEvery other method (`check`, `uninitialized`, `drain`, and `discard` itself)\nrelies on `partition_point(|r| r.end < pos)` / `r.end <= start`, which requires\nthe predicate to be monotonic over the vector. Once the order is broken,\n`partition_point` returns a garbage index, so `check` can report an uninitialized\nlayer as initialized (skipping the WebGPU-mandated zero-init and leaking stale\nGPU memory to a shader), or the sortedness `assert!(ranges[i-1].end <= ranges[i].start)`\nin `command/memory_init.rs` can panic.\n\nThis is reachable from safe public API: `discard` is driven by\n`TextureInitTracker::discard(mip_level, layer)` (via `command/memory_init.rs:333`),\nwhose `layer` comes from `view.selector.layers.start` of a render attachment with\n`StoreOp::Discard` (`command/render.rs:1189-1193`). Discarding a lower layer after a\nhigher layer (or after some layers were already initialized, leaving a range like\n`[3..6]`) triggers the buggy branch, e.g. `discard(1)` on ranges `[3..6]` yields\n`[3..6, 1..2]`.","fix":"Insert the new range at its correct sorted position `r_idx` instead of pushing to\nthe tail:\n```rust\n} else if r.start > pos {\n    // may still extend range at beginning\n    if r.start == pos + 1 {\n        self.uninitialized_ranges[r_idx] = pos..r.end;\n    } else {\n        // previous range end must be smaller than idx, therefore no merge possible\n        self.uninitialized_ranges.insert(r_idx, pos..(pos + 1));\n    }\n}\n```\nThe outer `else` branch (where `r_idx == len`) can keep using `push`, since that\nis equivalent to `insert(len, ..)`.","locations":[{"ref":"wgpu-core/src/init_tracker/mod.rs:266-273","code":"  266 |             } else if r.start > pos {\n  267 |                 // may still extend range at beginning\n  268 |                 if r.start == pos + 1 {\n  269 |                     self.uninitialized_ranges[r_idx] = pos..r.end;\n  270 |                 } else {\n  271 |                     // previous range end must be smaller than idx, therefore no merge possible\n  272 |                     self.uninitialized_ranges.push(pos..(pos + 1));\n  273 |                 }","lines":8,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-core/src/init_tracker/mod.rs#L266-L273"}]},{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`output_debug_string_handler` reads the wrong memory for the debug message. For\n`DBG_PRINTEXCEPTION_C` / `DBG_PRINTEXCEPTION_WIDE_C`, `EXCEPTION_RECORD::ExceptionInformation`\nis `[usize; 15]` holding the *exception parameters*: `ExceptionInformation[0]` is the string\nlength and `ExceptionInformation[1]` is a *pointer* to the actual message text (that is how\n`OutputDebugStringA/W` raise the exception). The handler instead does\n`bytemuck::cast_slice(&record.ExceptionInformation)` and interprets the raw bytes of the\nlength/pointer words as the string. The resulting text is garbage (bytes of a small integer\nfollowed by a pointer value), so `message.strip_prefix(\"D3D12 \")` on line 58 always fails and\nthe handler unconditionally returns `EXCEPTION_CONTINUE_SEARCH`. Net effect: no D3D12\nvalidation messages are ever logged and the `validation_canary` (which CI relies on to detect\nvalidation errors) is never set, silently masking real validation failures.","fix":"Dereference the message pointer instead of casting the parameter array. Roughly:\n```rust\nlet message = match record.ExceptionCode {\n    Foundation::DBG_PRINTEXCEPTION_C => String::from_utf8_lossy(unsafe {\n        core::slice::from_raw_parts(\n            record.ExceptionInformation[1] as *const u8,\n            record.ExceptionInformation[0],\n        )\n    }),\n    Foundation::DBG_PRINTEXCEPTION_WIDE_C => Cow::Owned(String::from_utf16_lossy(unsafe {\n        core::slice::from_raw_parts(\n            record.ExceptionInformation[1] as *const u16,\n            record.ExceptionInformation[0],\n        )\n    })),\n    _ => return Debug::EXCEPTION_CONTINUE_SEARCH,\n};\n```\n(guard against a zero pointer/length before reading).","locations":[{"ref":"wgpu-hal/src/auxil/dxgi/exception.rs:48-56","code":"   48 |     let message = match record.ExceptionCode {\n   49 |         Foundation::DBG_PRINTEXCEPTION_C => {\n   50 |             String::from_utf8_lossy(bytemuck::cast_slice(&record.ExceptionInformation))\n   51 |         }\n   52 |         Foundation::DBG_PRINTEXCEPTION_WIDE_C => Cow::Owned(String::from_utf16_lossy(\n   53 |             bytemuck::cast_slice(&record.ExceptionInformation),\n   54 |         )),\n   55 |         _ => return Debug::EXCEPTION_CONTINUE_SEARCH,\n   56 |     };","lines":9,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-hal/src/auxil/dxgi/exception.rs#L48-L56"}]},{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In `build_acceleration_structures`, the GPU virtual address for an AABB geometry buffer is computed as\n`buffer_base + (aabb.offset as u64 * aabb.stride)`. But `aabb.offset` is documented as a **byte** offset\n(`AccelerationStructureAABBs` in `wgpu-hal/src/lib.rs`: \"`offset` - offset in bytes\"), and wgpu-core passes the\nalready-byte-valued `primitive_offset` here (validated as a multiple of 8 and bounds-checked in bytes against the\nbuffer size). Multiplying the byte offset by `stride` produces a wrong `StartAddress` (off by roughly a factor of\n`stride`), so any BLAS build with a non-zero AABB offset points the GPU at the wrong - and likely out-of-bounds -\nmemory region. Note the sibling code in the same function treats index/transform offsets correctly as raw bytes\n(`indices.offset as u64`, `transform.offset as u64`), making this line inconsistent. The Vulkan backend also uses\n`aabb.offset` directly as a byte `primitive_offset`.","fix":"Add the byte offset directly instead of multiplying by the stride:\n\n```rust\n// before\nlet aabb_address = unsafe {\n    aabb.buffer.expect(\"needs buffer to build\").resource.GetGPUVirtualAddress()\n        + (aabb.offset as u64 * aabb.stride)\n};\n// after\nlet aabb_address = unsafe {\n    aabb.buffer.expect(\"needs buffer to build\").resource.GetGPUVirtualAddress()\n        + aabb.offset as u64\n};\n```","locations":[{"ref":"wgpu-hal/src/dx12/command.rs:1723-1729","code":" 1723 |                         let aabb_address = unsafe {\n 1724 |                             aabb.buffer\n 1725 |                                 .expect(\"needs buffer to build\")\n 1726 |                                 .resource\n 1727 |                                 .GetGPUVirtualAddress()\n 1728 |                                 + (aabb.offset as u64 * aabb.stride)\n 1729 |                         };","lines":7,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-hal/src/dx12/command.rs#L1723-L1729"}]},{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `GPUCanvasContext::get_current_texture`, the `GPUTexture` constructed for the\nswapchain image is given `mip_level_count: 0` and `sample_count: 0`. Per the WebGPU\nspec the current texture of a canvas context always has `mipLevelCount == 1` and\n`sampleCount == 1`. As a result `canvasTexture.mipLevelCount` and\n`canvasTexture.sampleCount` observably return `0` to JS, which is wrong and can\nbreak code that reads these fields (e.g. to derive viewport/mip parameters).","fix":"Change:\n```rust\nmip_level_count: 0,\nsample_count: 0,\n```\nto:\n```rust\nmip_level_count: 1,\nsample_count: 1,\n```","locations":[{"ref":"deno_webgpu/surface.rs:167-168","code":"  167 |           mip_level_count: 0,\n  168 |           sample_count: 0,","lines":2,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/deno_webgpu/surface.rs#L167-L168"}]},{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `write_nested_function_outer`, when the entry point has a merged input\ninterface struct (`entry_point_io[...].input == Some`), the code writes that\nargument directly without going through the `separator_if_needed` closure and\nwithout ever setting `any_args_written = true`:\n\n```rust\nif let Some(ref ep_input) = self.entry_point_io.get(&(ep_index as usize)).unwrap().input {\n    write!(self.out, \"{} {}\", ep_input.ty_name, ep_input.arg_name)?;\n} else {\n    for (index, arg) in entry_point.function.arguments.iter().enumerate() {\n        write!(self.out, \"{}\", separator_if_needed())?; // else-branch does it right\n        ...\n    }\n}\nif need_workgroup_variables_initialization || stage == ShaderStage::Mesh {\n    write!(self.out, \"{}uint {} : SV_GroupIndex\", separator_if_needed(), ...)?;\n}\n```\n\nBecause `any_args_written` is still `false` after the `Some` branch, the\nfollowing `separator_if_needed()` call for `SV_GroupIndex` returns `\"\"` instead\nof `\", \"`. The generated parameter list becomes\n`InputType input_nameuint idx : SV_GroupIndex` with no comma, which is invalid\nHLSL and fails to compile. `input` is `Some` for a mesh/task entry point when a\nfunction argument carries a subgroup builtin binding (see\n`write_ep_input_struct`/`EntryPointInterface` construction in `writer.rs`,\n`input: if !func.arguments.is_empty() && (Fragment || any subgroup builtin)`),\nand for `ShaderStage::Mesh` the `SV_GroupIndex` parameter is always appended, so\nthe broken output is reachable (a mesh shader taking e.g.\n`@builtin(subgroup_invocation_id)`), as well as a task shader that additionally\nneeds workgroup-variable initialization.","fix":"Route the `Some` branch through `separator_if_needed()` exactly like the `else`\nbranch, so the first-argument state is tracked:\n\n```rust\nif let Some(ref ep_input) = self.entry_point_io.get(&(ep_index as usize)).unwrap().input {\n    write!(self.out, \"{}{} {}\", separator_if_needed(), ep_input.ty_name, ep_input.arg_name)?;\n} else {\n    ...\n}\n```","locations":[{"ref":"naga/src/back/hlsl/mesh_shader.rs:342-367","code":"  342 |         if let Some(ref ep_input) = self.entry_point_io.get(&(ep_index as usize)).unwrap().input {\n  343 |             write!(self.out, \"{} {}\", ep_input.ty_name, ep_input.arg_name)?;\n  344 |         } else {\n  345 |             for (index, arg) in entry_point.function.arguments.iter().enumerate() {\n  346 |                 write!(self.out, \"{}\", separator_if_needed())?;\n  347 |                 self.write_type(module, arg.ty)?;\n  348 | \n  349 |                 let argument_name =\n  350 |                     &self.names[&NameKey::EntryPointArgument(ep_index, index as u32)];\n  351 | \n  352 |                 write!(self.out, \" {argument_name}\")?;\n  353 |                 if let TypeInner::Array { base, size, .. } = module.types[arg.ty].inner {\n  354 |                     self.write_array_size(module, base, size)?;\n  355 |                 }\n  356 | \n  357 |                 self.write_semantic(&arg.binding, Some((stage, Io::Input)))?;\n  358 |             }\n  359 |         }\n  360 |         if need_workgroup_variables_initialization || stage == ShaderStage::Mesh {\n  361 |             write!(\n  362 |                 self.out,\n  363 |                 \"{}uint {} : SV_GroupIndex\",\n  364 |                 separator_if_needed(),\n  365 |                 args.local_invocation_index,\n  366 |             )?;\n  367 |         }","lines":26,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/back/hlsl/mesh_shader.rs#L342-L367"}]},{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `try_write_type_inner`, the `TypeInner::ValuePointer { size: Some(size), .. }` arm emits one\ntoo many closing angle brackets. It opens two brackets (`ptr<` and `vec{N}<`) but writes three\n`>`: one after the scalar (line 377), one inside the `if let Some(space)` block (line 381), and\nthen a spurious extra `write!(out, \">\")?;` after the `if`/`else` (line 385). The result for a\npointer-to-vector value type is malformed like `ptr<function, vec4<f32>>>`, which is invalid WGSL\nand wrong diagnostic output. Compare the correct `size: None` arm (lines 357-366), which closes\nexactly once. This is reachable from the WGSL backend via `write_type_resolution` (e.g.\n`start_named_expr` with `WriterFlags::EXPLICIT_TYPES` for an expression typed as a value pointer to\na vector) and from all `DiagnosticDisplay`/`DiagnosticDebug` paths.","fix":"Remove the trailing extra bracket after the `else` block. Before:\n```rust\n        } else {\n            return Err(WriteTypeError::NonWgsl);\n        }\n        write!(out, \">\")?;\n    }\n```\nAfter:\n```rust\n        } else {\n            return Err(WriteTypeError::NonWgsl);\n        }\n    }\n```","locations":[{"ref":"naga/src/common/wgsl/types.rs:368-386","code":"  368 |         TypeInner::ValuePointer {\n  369 |             size: Some(size),\n  370 |             scalar,\n  371 |             space,\n  372 |         } => {\n  373 |             let (address, maybe_access) = address_space_str(space);\n  374 |             if let Some(space) = address {\n  375 |                 write!(out, \"ptr<{}, vec{}<\", space, common::vector_size_str(size),)?;\n  376 |                 ctx.write_scalar(scalar, out)?;\n  377 |                 out.write_str(\">\")?;\n  378 |                 if let Some(access) = maybe_access {\n  379 |                     write!(out, \", {access}\")?;\n  380 |                 }\n  381 |                 write!(out, \">\")?;\n  382 |             } else {\n  383 |                 return Err(WriteTypeError::NonWgsl);\n  384 |             }\n  385 |             write!(out, \">\")?;\n  386 |         }","lines":19,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/common/wgsl/types.rs#L368-L386"}]},{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `Lowerer::r#struct`, doc comments are attached to the wrong struct members\nwhenever any member lacks a doc comment. The `doc_comments` vector is only\npushed to inside the `if !member.doc_comments.is_empty()` branch, so it holds\none entry per *documented* member, not one entry per member. The later loop\n`for (i, c) in doc_comments.drain(..).enumerate()` then uses `i` as the struct\nmember index in `.struct_members.insert((handle, i), comment)`. As a result, a\ndoc comment on member N is stored under the index of the N-th documented member,\nnot member N itself. For example, in `struct S { a: i32, /** doc */ b: i32 }` the\ncomment on `b` (member index 1) is inserted at `(handle, 0)`, mis-associating it\nwith `a`. The `Option<Vec<String>>` element type plus the `if let Some(comment)`\nguard show a `None` push in the `else` branch was intended but omitted.","fix":"Push a placeholder for members without docs so indices stay aligned, e.g.:\n\n```rust\n// before\nif !member.doc_comments.is_empty() {\n    doc_comments.push(Some(\n        member.doc_comments.iter().map(|s| s.to_string()).collect(),\n    ));\n}\n\n// after\nif !member.doc_comments.is_empty() {\n    doc_comments.push(Some(\n        member.doc_comments.iter().map(|s| s.to_string()).collect(),\n    ));\n} else {\n    doc_comments.push(None);\n}\n```\n\nAlternatively, insert into `struct_members` directly inside the member loop\nusing the real member index instead of collecting into a separate vector.","locations":[{"ref":"naga/src/front/wgsl/lower/mod.rs:4585-4694","code":" 4585 |         let mut doc_comments: Vec<Option<Vec<String>>> = Vec::new();\n 4586 | \n 4587 |         for member in s.members.iter() {\n 4588 |             let ty = self.resolve_ast_type(&member.ty, &mut ctx.as_const())?;\n 4589 | \n 4590 |             ctx.layouter.update(ctx.module.to_ctx()).map_err(|err| {\n 4591 |                 let LayoutErrorInner::TooLarge = err.inner else {\n 4592 |                     unreachable!(\"unexpected layout error: {err:?}\");\n 4593 |                 };\n 4594 | n 4629 |             } else {\n 4630 |                 member_min_size\n 4631 |             };\n 4632 | \n 4633 |             let member_alignment = if let Some(align_expr) = member.align {\n 4634 |                 let (align, span) = self.const_u32(align_expr, &mut ctx.as_const())?;\n 4635 |                 if let Some(alignment) = proc::Alignment::new(align) {\n 4636 |                     if alignment < member_min_alignment {\n 4637 |                         return Err(Box::new(Error::AlignAttributeTooLow(\n 4638 |                             span,\n 4639 |                             member_min_alignment,\n 4640 |                         )));\n 4641 |                     } else {\n 4642 |                         alignment\n 4643 |                     }\n 4644 |                 } else {\n 4645 |                     return Err(Box::new(Error::NonPowerOfTwoAlignAttribute(span)));\n 4646 |                 }\n 4647 |             } else {\n 4648 |                 member_min_alignment\n 4649 |             };\n 4650 | \n 4651 |             let binding = self.binding(&member.binding, ty, ctx)?;\n 4652 | \n 4653 |             offset = member_alignment.round_up(offset);\n 4654 |             struct_alignment = struct_alignment.max(member_alignment);\n 4655 | \n 4656 |             if !member.doc_comments.is_empty() {\n 4657 |                 doc_comments.push(Some(\n 4658 |                     member.doc_comments.iter().map(|s| s.to_string()).collect(),\n 4659 |                 ));\n 4660 |             }\n 4661 |             members.push(ir::StructMember {\n 4662 |                 name: Some(member.name.name.to_owned()),\n 4663 |                 ty,\n 4664 |                 binding,\n 4665 |                 offset,\n 4666 |             });\n 4667 | \n 4668 |             offset += member_size;\n 4669 |             if offset > crate::valid::MAX_TYPE_SIZE {\n 4670 |                 return Err(Box::new(Error::TypeTooLarge { span }));\n 4671 |             }\n 4672 |         }\n 46 ats the whole purpose of this pass, whose doc-comment states that\n   after it \"handle accesses are infallible\"; an invalid doc-comment handle can\n   then reach later code (e.g. compaction / doc-comment emission) that indexes\n   the corresponding arena and panics.\n2. When there *are* struct-member doc comments, the four inner loops are\n   re-executed once per struct-member entry, doing redundant work.","fix":"De-nest the four loops so they sit at the same level as the\n`doc_comments_for_types` and `doc_comments_for_struct_members` loops, i.e. move\nthe `functions` / `entry_points` / `constants` / `global_variables` validation\nloops out of (below) the `for ... in doc_comments_for_struct_members.iter()`\nloop's closing brace so each runs exactly once and unconditionally.","locations":[{"ref":"naga/src/valid/handles.rs:294-340","code":"  294 |             for (&(ty, struct_member_index), _) in doc_comments_for_struct_members.iter() {\n  295 |                 validate_type(ty)?;\n  296 |                 let struct_type = types.get_handle(ty).unwrap();\n  297 |                 match struct_type.inner {\n  298 |                     crate::TypeInner::Struct {\n  299 |                         ref members,\n  300 |                         span: ref _span,\n  301 |                     } => {\n  302 |                         (0..members.len())\n  303 |                             .contains(&struct_member_index)\n  304 |                             .then_some(())\n  305 |                             // TODO: what errors should this be?\n  306 |                             .ok_or_else(|| ValidationError::Type {\n  307 |                                 handle: ty,\n  308 |                                 name: struct_type.name.as_ref().map_or_else(\n  309 |                                     || \"members length incorrect\".to_string(),\n  310 |                                     |name| name.to_string(),\n  311 |                                 ),\n  312 | dium","difficulty":"easy","description":"In `multi_draw_indirect`, when the indirect-validation path is taken (i.e.\n`device.indirect_validation.is_some()` and `family != DrawMeshTasks`), the code\nunconditionally does `draw_ctx.add(offset)?` followed by a final\n`draw_ctx.draw(current_draw_data)`, and only the *additional* draws are gated by\n`for i in 1..count`. This means a `count == 0` multi-draw still issues exactly\none draw instead of zero. `count == 0` is reachable from the public\n`RenderPass::multi_draw_indirect` / `multi_draw_indexed_indirect` API and is a\nvalid no-op per spec (the non-validation path correctly forwards\n`count = 0` to `raw_encoder.draw_indirect`, which draws nothing). Worse, the\n`args_size` check at `stride.checked_mul(0) == Some(0)` accepts `offset ==\nindirect_buffer.size`, so with `count == 0, offset == size` the batcher's\n`add(offset)` sets up a GPU read of `stride` bytes starting exactly at the end\nof the indirect buffer, an out-of-bounds read feeding a spurious draw.","fix":"Skip the add/draw entirely when `count == 0`, e.g. wrap the batching in a\nguard:\n```rust\nif count > 0 {\n    let mut current_draw_data = draw_ctx.add(offset)?;\n    for i in 1..count {\n        // ... existing loop body ...\n    }\n    draw_ctx.draw(current_draw_data);\n}\n```\n(or early-return before any side effects once `count == 0` is detected).","locations":[{"ref":"wgpu-core/src/command/render.rs:3428-3450","code":" 3428 |         let mut current_draw_data = draw_ctx.add(offset)?;\n 3429 | \n 3430 |         for i in 1..count {\n 3431 |             let draw_data = draw_ctx.add(offset + stride * i as u64)?;\n 3432 | \n 3433 |             if draw_data.buffer_index == current_draw_data.buffer_index {\n 3434 |                 #[cfg(debug_assertions)]\n 3435 |                 {\n 3436 |                     let dst_stride =\n 3437 |                         get_dst_stride_of_indirect_args(state.pass.base.device.backend(), family);\n 3438 |                     debug_assert_eq!(\n 3439 |                         draw_data.offset,\n 3440 |                         current_draw_data.offset + dst_stride * current_draw_data.count as u64\n 3441 |                     );\n 3442 |                 }\n 3443 |                 current_draw_data.count += 1;\n 3444 |             } else {\n 3445 |                 draw_ctx.draw(current_draw_data);\n 3446 |                 current_draw_data = draw_data;\n 3447 |             }\n 3448 |         }\n 3449 | \n 3450 |         draw_ctx.draw(current_draw_data);","lines":23,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-core/src/command/render.rs#L3428-L3450"}]},{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"The vectored exception handler is never actually unregistered, breaking the module's stated\n\"1 or 0 handlers\" invariant. `register_exception_handler` discards the handle returned by\n`AddVectoredExceptionHandler` (line 17), and `unregister_exception_handler` calls\n`RemoveVectoredExceptionHandler(output_debug_string_handler as *mut _)`, passing the *function\npointer* rather than the opaque handle that `Add` returned. `RemoveVectoredExceptionHandler`\nonly accepts that returned handle, so the call fails and the handler stays installed. Because\n`*count_guard` is still decremented to 0, a subsequent `register_exception_handler` sees\n`count == 0` and calls `AddVectoredExceptionHandler` *again*, installing a second handler. Over\nrepeated instance create/destroy cycles this accumulates duplicate handlers and duplicate log\noutput, exactly the \"multiple handlers\" case the comment says must not happen.","fix":"Store the handle returned by `AddVectoredExceptionHandler` (e.g. in a `static Mutex<*mut c_void>`\nalongside `EXCEPTION_HANDLER_COUNT`) and pass that stored handle to\n`RemoveVectoredExceptionHandler`, instead of casting the function pointer.","locations":[{"ref":"wgpu-h ... */ z as i32) };\n        let slice = z - copy.texture_base.origin.z;\n        let offset = copy.buffer_layout.offset\n            + (slice * block_size * row_texels * column_texels) as u64;\n        read_pixels(offset);\n    }\n}\n```","locations":[{"ref":"wgpu-hal/src/gles/queue.rs:976-991","code":"  976 |                     glow::TEXTURE_3D => {\n  977 |                         for z in copy.texture_base.origin.z..copy.size.depth {\n  978 |                             unsafe {\n  979 |                                 gl.framebuffer_texture_layer(\n  980 |                                     glow::READ_FRAMEBUFFER,\n  981 |                                     glow::COLOR_ATTACHMENT0,\n  982 |                                     Some(src),\n  983 |                                     copy.texture_base.mip_level as i32,\n  984 |                                     z as i32,\n  985 |                                 )\n  986 |                             };\n  987 |                             let offset = copy.buffer_layout.offset\n  988 |                                 + (z * block_size * row_texels * column_texels) as u64;\n  989 |                             read_pixels(offset);\n  990 |                         }\n  991 |                     }","lines":16,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-hal/src/gles/queue.rs#L976-L991"}]},{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `Queue::process`, the `CopyQueryResults` command writes into a host-mapped (`raw == None`)\ndestination buffer at offset 0, silently ignoring `dst_offset`. The GL-buffer branch (`Some`)\nand the `QUERY_BUFFERS` fast path both correctly honor `dst_offset`, so a resolve into a mapped\nbuffer with a non-zero destination offset corrupts data at the start of the buffer instead of\nwriting at the requested location.","fix":"Index the destination slice starting at `dst_offset`:\n```rust\nNone => {\n    let mut map_state = lock(&dst.map_state);\n    let data = map_state.data.as_mut().unwrap();\n    let start = dst_offset as usize;\n    let len = query_data.len().min(data.len().saturating_sub(start));\n    data[start..start + len].copy_from_slice(&query_data[..len]);\n}\n```","locations":[{"ref":"wgpu-hal/src/gles/queue.rs:1098-1104","code":" 1098 |                         None => {\n 1099 |                             let mut map_state = lock(&dst.map_state);\n 1100 |                             let data = map_state.data.as_mut().unwrap();\n 1101 |                             let len = query_data.len().min(data.len());\n 1102 |                             data[..len].copy_from_slice(&query_data[..len]);\n 1103 |                         }\n 1104 |                     }","lines":7,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-hal/src/gles/queue.rs#L1098-L1104"}]},{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`OsType::new` detects visionOS with `version.majorVersion < 8`, and the adjacent comment still\nclaims \"The current version number of visionOS is 1.0.0.\" Apple moved to year-based OS versioning\nin 2025, so visionOS is now version 26 (the same file already gates `msl_version` on\n`available!(... visionos = 26.0)` at `wgpu-hal/src/metal/adapter.rs:711`, confirming visionOS 26\nexists). On any visionOS >= 8 (i.e. the current visionOS 26), `version.majorVersion < 8` is false, so\n`os_is_vision` is `false` and the device is misclassified as `Macos` or `Ios` instead of `VisionOs`.\nThis feeds wrong values into `buffer_alignment` and `constant_buffer_offset_alignment` (which special\n-case `OsType::VisionOs` at lines 883 and 891-894) and other `os_type`-derived capabilities/limits,\nproducing incorrect reported alignments/limits on visionOS.","fix":"Detect visionOS by target platform rather than a fragile numeric bound. Prefer\n`cfg!(target_os = \"visionos\")` (with the Simulator caveat noted in the comment) or an explicit\n`available!(visionos = ...)` / device-family combination that does not assume `majorVersion < 8`, and\nupdate the outdated `\"visionOS is 1.0.0\"` comment. At minimum, remove the `majorVersion < 8` gate so\nthat visionOS 26+ is still recognized.","locations":[{"ref":"wgpu-hal/src/metal/adapter.rs:1793-1811","code":" 1793 | impl super::OsType {\n 1794 |     fn new(version: NSOperatingSystemVersion, device: &ProtocolObject<dyn MTLDevice>) -> Self {\n 1795 |         // Metal was first introduced in OS X 10.11 and iOS 8. The current version number of visionOS is 1.0.0. Additionally,\n 1796 |         // on the Simulator, Apple only provides the Apple2 GPU capability, and the Apple2+ GPU capability covers the capabilities of Apple2.\n 1797 |         // Therefore, the following conditions can be used to determine if it is visionOS.\n 1798 |         // https://developer.apple.com/documentation/metal/developing_metal_apps_that_run_in_simulator\n 1799 |         let os_is_vision = version.majorVersion < 8 && device.supportsFamily(MTLGPUFamily::Apple2);\n 1800 |         let os_is_mac = device.supportsFeatureSet(MTLFeatureSet::macOS_GPUFamily1_v1);\n 1801 |         let os_is_tvos = device.supportsFeatureSet(MTLFeatureSet::tvOS_GPUFamily1_v1);\n 1802 |         if os_is_vision {\n 1803 |             Self::VisionOs\n 1804 |         } else if os_is_mac {\n 1805 |             Self::Macos\n 1806 |         } else if os_is_tvos {\n 1807 |             Self::Tvos\n 1808 |         } else {\n 1809 |             Self::Ios\n 1810 |         }\n 1811 |     }","lines":19,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-hal/src/metal/adapter.rs#L1793-L1811"}]},{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `begin_encoding`, the outstanding-command-buffer counter is incremented with\n`command_buffer_created_not_submitted.fetch_add(1, ..)` *before* the limit check.\nWhen the limit is exceeded the function returns `Err(crate::DeviceError::Lost)`\nwithout ever decrementing the counter again. No command buffer was created\n(`raw_cmd_buf` stays `None`), so none of the paths that normally decrement the\ncounter run: `discard_encoding` only decrements when `had_command_buffer` is\ntrue, `end_encoding`/submit never see a `CommandBuffer`, and the\n`CommandBuffer::drop` path is never reached. Every time this failure path is hit\nthe shared per-queue counter is permanently inflated by one, ratcheting the\neffective ceiling down on each transient overshoot and eventually forcing\n`begin_encoding` to always return `Lost` for the queue.","fix":"Do not leave the counter incremented on the early-return path. Either check\nbefore adding, or undo the add:\n```rust\nlet previous = self\n    .queue_shared\n    .command_buffer_created_not_submitted\n    .fetch_add(1, atomic::Ordering::AcqRel);\nif previous >= adapter::MAX_COMMAND_BUFFERS {\n    self.queue_shared\n        .command_buffer_created_not_submitted\n        .fetch_sub(1, atomic::Ordering::AcqRel);\n    // ... log ...\n    return Err(crate::DeviceError::Lost);\n}\n```","locations":[{"ref":"wgpu-hal/src/metal/command.rs:487-501","code":"  487 |         let previous = self\n  488 |             .queue_shared\n  489 |             .command_buffer_created_not_submitted\n  490 |             .fetch_add(1, atomic::Ordering::AcqRel);\n  491 |         if previous >= adapter::MAX_COMMAND_BUFFERS {\n  492 |             let current = previous + 1;\n  493 |             log::warn!(\n  494 |                 \"metal: refusing to create new command buffer; {current} outstanding command \\\n  495 |                  buffers exceeds the limit of {}. Treating this as device lost. \\\n  496 |                  Ensure command encoders are submitted or dropped rather than kept alive \\\n  497 |                  to avoid exhausting Metal's command buffer budget.\",\n  498 |                 adapter::MAX_COMMAND_BUFFERS\n  499 |             );\n  500 |             return Err(crate::DeviceError::Lost);\n  501 |         }","lines":15,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-hal/src/metal/command.rs#L487-L501"}]},{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`create_query_set` only increments the internal resource counter\n`self.counters.query_sets.add(1)` in the `wgt::QueryType::Timestamp` branch; the\n`wgt::QueryType::Occlusion` branch constructs and returns a `QuerySet` without\never calling `add(1)`. However, `destroy_query_set` unconditionally calls\n`self.counters.query_sets.sub(1)`. As a result every occlusion query set that is\ncreated and later destroyed drives the `query_sets` counter net -1, corrupting\nthe counter (it can go negative / underflow) and breaking the leak-detection and\ndiagnostic reporting that `get_internal_counters` exposes.","fix":"Add the missing increment in the `Occlusion` branch so it matches the\nunconditional `sub(1)` in `destroy_query_set`. Before (Occlusion branch, no\ncounter update):\n```rust\n                    if let Some(label) = desc.label {\n                        raw_buffer.setLabel(Some(&NSString::from_str(label)));\n                    }\n                    Ok(super::QuerySet {\n```\nAfter:\n```rust\n                    if let Some(label) = desc.label {\n                        raw_buffer.setLabel(Some(&NSString::from_str(label)));\n                    }\n                    self.counters.query_sets.add(1);\n                    Ok(super::QuerySet {\n```","locations":[{"ref":"wgpu-hal/src/metal/device.rs:1921-1939","code":" 1921 |             match desc.ty {\n 1922 |                 wgt::QueryType::Occlusion => {\n 1923 |                     let size = desc.count as u64 * crate::QUERY_SIZE;\n 1924 |                     let options = MTLResourceOptions::empty();\n 1925 |                     //TODO: HazardTrackingModeUntracked\n 1926 |                     let raw_buffer = self\n 1927 |                         .shared\n 1928 |                         .device\n 1929 |                         .newBufferWithLength_options(size as usize, options)\n 1930 |                         .unwrap();\n 1931 |                     if let Some(label) = desc.label {\n 1932 |                         raw_buffer.setLabel(Some(&NSString::from_str(label)));\n 1933 |                     }\n 1934 |                     Ok(super::QuerySet {\n 1935 |                         raw_buffer,\n 1936 |                         counter_sample_buffer: None,\n 1937 |                         ty: desc.ty,\n 1938 |                     })\n 1939 |                 }","lines":19,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-hal/src/metal/device.rs#L1921-L1939"},{"ref":"wgpu-hal/src/metal/device.rs:1991-1993","code":" 1991 |     unsafe fn destroy_query_set(&self, _set: super::QuerySet) {\n 1992 |         self.counters.query_sets.sub(1);\n 1993 |     }","lines":3,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-hal/src/metal/device.rs#L1991-L1993"}]},{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `PhysicalDeviceFeatures::to_wgpu`, the check for `TEXTURE_INT64_ATOMIC`\nmutates the feature struct before reading it. `shader_image_atomic_int64` is a\nshared reference; `.shader_image_int64_atomics(true)` is an ash builder setter\nthat takes `self` by value, so it copies the (`Copy`) struct, sets the field to\n`vk::TRUE`, and returns the copy. The subsequent field read\n`.shader_image_int64_atomics != 0` therefore always evaluates to `true`. As a\nresult `F::TEXTURE_INT64_ATOMIC` is reported as supported for **any** adapter\nthat exposes the `VK_EXT_shader_image_atomic_int64` stem = self.presentation_system.with_env();\n  587 |         let latency_waitable_object = self.latency_waitable_object.with_env();\n  588 |         let agility_sdk = self\n  589 |             .agility_sdk\n  590 |             .map(|s| s.with_env())\n  591 |             .or_else(Dx12AgilitySDK::from_env);\n  592 |         Self {\n  593 |             shader_compiler,\n  594 |             presentation_system,\n  595 |             latency_waitable_object,\n  596 |             force_shader_model: ForceShaderModelToken::default(),\n  597 |             agility_sdk,\n  598 |         }\n  599 |     }","lines":16,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-types/src/backend.rs#L584-L599"}]},{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`InstanceDescriptor::with_env` takes `self` by value but rebuilds the struct using\n`memory_budget_thresholds: MemoryBudgetThresholds::default()` instead of\n`self.memory_budget_thresholds`. There is no environment override for\n`memory_budget_thresholds` (it has no `from_env`), so any caller that constructs an\n`InstanceDescriptor` with custom thresholds and then calls `.with_env()` (e.g. via\n`new_with_display_handle_from_env`, which does `Self::new_with_display_handle(display).with_env()`)\nsilently loses the configured budget thresholds, resetting `for_resource_creation` and\n`for_device_loss` to `None`.","fix":"Preserve the existing value:\n```\n-            memory_budget_thresholds: MemoryBudgetThresholds::default(),\n+            memory_budget_thresholds: self.memory_budget_thresholds,\n```","locations":[{"ref":"wgpu-types/src/instance.rs:106-117","code":"  106 |     pub fn with_env(self) -> Self {\n  107 |         let backends = self.backends.with_env();\n  108 |         let flags = self.flags.with_env();\n  109 |         let backend_options = self.backend_options.with_env();\n  110 |         Self {\n  111 | );\n  250 |     }","lines":17,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/deno_webgpu/buffer.rs#L234-L250"},{"ref":"deno_webgpu/buffer.rs:255-271","code":"  255 |   #[nofast]\n  256 |   #[undefined]\n  257 |   fn unmap(&self, scope: &mut v8::HandleScope) -> Result<(), BufferError> {\n  258 |     for ab in self.mapped_js_buffers.replace(vec![]) {\n  259 |       let ab = ab.open(scope);\n  260 |       ab.detach(None);\n  261 |     }\n  262 | \n  263 |     self\n  264 |       .instance\n  265 |       .buffer_unmap(self.id)\n  266 |       .map_err(BufferError::Access)?;\n  267 | \n  268 |     *self.map_state.borrow_mut() = \"unmapped\";\n  269 | \n  270 |     Ok(())\n  271 |   }","lines":17,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/deno_webgpu/buffer.rs#L255-L271"}]},{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `write_wrapped_convert_from_std140_compat_type`, the `TypeInner::Array` branch pushes a *type\nid* where a *value id* is required when a member needs no conversion. `std140_element_id` is the\n`OpCompositeExtract` result value, but the `else` branch assigns `final_element_id =\nstd140_element_type_id` (the element's type id) instead of `std140_element_id`, then pushes it into\n`element_ids` used to build the `OpCompositeConstruct`. Using a type id as an operand would produce\ninvalid SPIR-V. In practice this branch is currently unreachable because a std140-compat array type\nis only ever declared when its base type itself has a std140-compat mapping (see\n`write_std140_compat_type_declaration`'s `Array` arm), so `std140_info.is_some()` always holds here;\nbut the code is a latent bug that will misbehave if that invariant ever changes.","fix":"In the `else` branch use the extracted value, not its type id: replace `std140_element_type_id`\nwith `std140_element_id`.","locations":[{"ref":"naga/src/back/spv/writer.rs:973-999","code":"  973 |                 for i in 0..size {\n  974 |                     let std140_element_id = self.id_gen.next();\n  975 |                     let std140_element_type_id =\n  976 |                         std140_info.map_or(element_type_id, |info| info.type_id);\n  977 |                     block.body.push(Instruction::composite_extract(\n  978 |                         std140_element_type_id,\n  979 |                         std140_element_id,\n  980 |                         param_id,\n  981 |                         &[i],\n  982 |                     ));\n  983 | \n  984 |                     // Only call the conversion function if a compatibility mapping actually exists.\n  985 |                     let final_element_id = if std140_info.is_some() {\n  986 |                         let conversion_fn_id = self.wrapped_functions\n  987 |                             [&WrappedFunction::ConvertFromStd140CompatType { r#type: base }];\n  988 |                         let id = self.id_gen.next();\n  989 |                         block.body.push(Instruction::function_call(\n  990 |                             element_type_id,\n  991 |                             id,\n  992 |                             conversion_fn_id,\n  993 |                             &[std140_element_id],\n  994 |                         ));\n  995 |                         id\n  996 |                     } else {\n  997 |                         std140_element_type_id\n  998 |                     };\n  999 |                     element_ids.push(final_element_id);","lines":27,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/back/spv/writer.rs#L973-L999"}]},{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`List::min_arguments` computes the *maximum* argument count, not the minimum. The\nfold uses `core::cmp::max(best, len)` where it should use `core::cmp::min`:\n\n```rust\nfn min_arguments(&self) -> usize {\n    self.members()\n        .fold(None, |best, (_, rule)| {\n            let len = rule.arguments.len();\n            Some(match best {\n                Some(best) => core::cmp::max(best, len), // BUG: should be `min`\n                None => len,\n            })\n        })\n        .unwrap()\n}\n```\n\n`max_arguments` (just below) correctly returns the maximum, so both methods return\nthe same value. This is used by the validator in `valid/expression.rs` as\n`if actuals.len() < overloads.min_arguments()` to reject calls with too few\narguments. The bug is currently masked because every `List` overload set built in\n`mathfunction.rs` has all rules with an identical argument count (so `min == max`),\nbut it is a latent correctness bug: any future `List` whose rules differ in arity\nwould make `min_arguments` over-report and wrongly reject valid calls (or, in the\nmirrored comparison, accept invalid ones).","fix":"Replace `core::cmp::max(best, len)` with `core::cmp::min(best, len)` in\n`min_arguments`.","locations":[{"ref":"naga/src/proc/overloads/list.rs:73-85","code":"   73 |     fn min_arguments(&self) -> usize {\n   74 |         self.members()\n   75 |             .fold(None, |best, (_, rule)| {\n   76 |                 // This is different from `max_arguments` because\n   77 |                 // `<Option as PartialOrd>` doesn't work the way we'd like.\n   78 |                 let len = rule.arguments.len();\n   79 |                 Some(match best {\n   80 |                     Some(best) => core::cmp::max(best, len),\n   81 |                     None => len,\n   82 |                 })\n   83 |             })\n   84 |             .unwrap()\n   85 |     }","lines":13,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/proc/overloads/list.rs#L73-L85"}]},{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":
