"The suppression filter for the spammy \"did not pass any clear value\" warnings matches too\nbroadly. The comment says it targets messages `#820` and `#821`, but `message.contains(\"#82\")`\nalso suppresses `#822`..`#829`, `#8200`, and any other warning whose text contains the\nsubstring `#82`, discarding potentially useful diagnostics.","fix":"Match the specific IDs, e.g.:\n```rust\nif level == log::Level::Warn && (message.contains(\"#820\") || message.contains(\"#821\")) {\n```","locations":[{"ref":"wgpu-hal/src/auxil/dxgi/exception.rs:73-77","code":"   73 |     if level == log::Level::Warn && message.contains(\"#82\") {\n   74 |         // This is are useless spammy warnings (#820, #821):\n   75 |         // \"The application did not pass any clear value to resource creation\"\n   76 |         return Debug::EXCEPTION_CONTINUE_SEARCH;\n   77 |     }","lines":5,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-hal/src/auxil/dxgi/exception.rs#L73-L77"}]},{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `set_immediates`, the `needs_updating` check that is supposed to detect whether the\nwritten immediate-data range `[start_words, end_words)` overlaps a given uniform's range\n`[uniform_start_words, uniform_end_words)` uses the wrong boolean operator and a wrong\ncomparison. Two half-open ranges overlap iff `start_words < uniform_end_words`\n**and** `uniform_start_words < end_words`. The code instead ORs the two sub-conditions\n(and uses `<=` for the second), so `needs_updating` is *always* true: it is impossible for\nboth `start_words >= uniform_end_words` and `uniform_start_words > end_words` to hold at\nonce (since `start_words <= end_words` and `uniform_start_words <= uniform_end_words`).\nThe uploaded data is still correct (it is the stored snapshot), so this is not a correctness\nbug, but every `set_immediates` call now re-emits a `SetImmediates` upload for *every*\nuniform desc of the pipeline (one per shader stage) regardless of what the caller actually\ntouched, defeating the intended optimization.","fix":"Use an AND with strict inequalities so only genuinely overlapping uniforms are re-uploaded:\n\nBefore:\n```rust\nlet needs_updating =\n    start_words < uniform_end_words || uniform_start_words <= end_words;\n```\nAfter:\n```rust\nlet needs_updating =\n    start_words < uniform_end_words && uniform_start_words < end_words;\n```","locations":[{"ref":"wgpu-hal/src/gles/command.rs:842-844","code":"  842 |             // Is true if any word within the uniform binding was updated\n  843 |             let needs_updating =\n  844 |                 start_words < uniform_end_words || uniform_start_words <= end_words;","lines":3,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-hal/src/gles/command.rs#L842-L844"}]},{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"`Padding` (a trace-indentation helper in `atomic_upgrade.rs`) uses an RAII counter that is\nunbalanced. `Padding::inc_padding` increments the shared `Arc<AtomicUsize>` and returns\n`self.clone()`, relying on that returned value's `Drop` to decrement. However, the base\n`Padding` stored in `UpgradeState.padding` (created via `Default`) is never incremented for\nitself, yet its `Drop` still calls `fetch_sub(1, ...)`. When all the temporary paddings have\nalready been dropped, the counter is back to `0`, and the final drop of the base instance\nsubtracts from `0`, wrapping the `usize` counter around. The result is discarded via\n`let _ = ...`, so there is no crash and no user-visible effect (it only affects log\nindentation), but the counter accounting is incorrect.","fix":"Track nesting depth without cloning-shares-a-counter semantics, e.g. make `inc_padding` return\na guard type whose `Drop` is the only place that decrements, and do not implement `Drop` on the\nbase `Padding`; or only decrement in `Drop` when a matching increment was performed by that same\ninstance.","locations":[{"ref":"naga/src/front/atomic_upgrade.rs:65-69","code":"   65 | impl Drop for Padding {\n   66 |     fn drop(&mut self) {\n   67 |         let _ = self.0.fetch_sub(1, core::sync::atomic::Ordering::Relaxed);\n   68 |     }\n   69 | }","lines":5,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/front/atomic_upgrade.rs#L65-L69"},{"ref":"naga/src/front/atomic_upgrade.rs:84-88","code":"   84 |     fn inc_padding(&self) -> Padding {\n   85 |         let _ = self.0.fetch_add(1, core::sync::atomic::Ordering::Relaxed);\n   86 |         self.clone()\n   87 |     }\n   88 | }","lines":5,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/front/atomic_upgrade.rs#L84-L88"}]},{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"very_easy","description":"In `crate::StorageFormat::to_hlsl_str`, the signedness of the two-channel 32-bit\nformats is swapped: `Rg32Uint` is mapped to the *signed* HLSL element type `int4`\nand `Rg32Sint` is mapped to the *unsigned* type `uint4`. Every other format in\nthis function follows the opposite (correct) convention: `R32Uint => \"uint\"`,\n`R32Sint => \"int\"`, `Rgba32Uint => \"uint4\"`, `Rgba32Sint => \"int4\"`. This element\ntype is used to declare the HLSL `RWTexture*`/typed-UAV element type, so a WGSL\nstorage texture with format `rg32uint` or `rg32sint` will be emitted with the\nwrong signedness, producing miscompiled shaders (wrong sign-extension on loads,\nor an outright DXC type error when the declared format disagrees with the\nresource). This is a live production path (D3D12 backend).","fix":"Swap `Rg32Uint` and `Rg32Sint` so the `Sint` formats map to `int4` and the\n`Uint` formats map to `uint4`:\n\nBefore:\n```rust\nSelf::Rg8Sint | Self::Rg16Sint | Self::Rg32Uint => \"int4\",\nSelf::Rg8Uint | Self::Rg16Uint | Self::Rg32Sint => \"uint4\",\n```\nAfter:\n```rust\nSelf::Rg8Sint | Self::Rg16Sint | Self::Rg32Sint => \"int4\",\nSelf::Rg8Uint | Self::Rg16Uint | Self::Rg32Uint => \"uint4\",\n```","locations":[{"ref":"naga/src/back/hlsl/conv.rs:136-137","code":"  136 |             Self::Rg8Sint | Self::Rg16Sint | Self::Rg32Uint => \"int4\",\n  137 |             Self::Rg8Uint | Self::Rg16Uint | Self::Rg32Sint => \"uint4\",","lines":2,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/back/hlsl/conv.rs#L136-L137"}]},{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"In `PhysicalDeviceFeatures::from_extensions_and_requested_features`, the core\nfeature builder calls `.shader_storage_buffer_array_dynamic_indexing(..)`\n**twice** on the same `vk::PhysicalDeviceFeatures` builder. The second call\n(with condition `TEXTURE_BINDING_ARRAY | STORAGE_RESOURCE_BINDING_ARRAY`)\nsilently overwrites the first (with condition\n`BUFFER_BINDING_ARRAY | STORAGE_RESOURCE_BINDING_ARRAY`). The commented-out\n`//.shader_storage_image_array_dynamic_indexing(` immediately below shows the\nsecond call was meant to be\n`.shader_storage_image_array_dynamic_indexing(..)`. Consequences: (1)\n`shaderStorageBufferArrayDynamicIndexing` is now gated on `TEXTURE_BINDING_ARRAY`\ninstead of `BUFFER_BINDING_ARRAY`, so requesting\n`BUFFER_BINDING_ARRAY | STORAGE_RESOURCE_BINDING_ARRAY` without\n`TEXTURE_BINDING_ARRAY` fails to enable it, risking a Vulkan validation error\nwhen a shader dynamically indexes a storage-buffer array; (2)\n`shaderStorageImageArrayDynamicIndexing` is never enabled at all.","fix":"Rename the second call to\n`.shader_storage_image_array_dynamic_indexing(requested_features.contains(\nwgt::Features::TEXTURE_BINDING_ARRAY | wgt::Features::STORAGE_RESOURCE_BINDING_ARRAY))`\nso that storage-buffer dynamic indexing keeps its `BUFFER_BINDING_ARRAY`-based\ncondition and storage-image dynamic indexing is actually enabled.","locations":[{"ref":"wgpu-hal/src/vulkan/adapter.rs:346-357","code":"  346 |                 .shader_storage_buffer_array_dynamic_indexing(requested_features.contains(\n  347 |                     wgt::Features::BUFFER_BINDING_ARRAY\n  348 |                         | wgt::Features::STORAGE_RESOURCE_BINDING_ARRAY,\n  349 |                 ))\n  350 |                 .shader_sampled_image_array_dynamic_indexing(\n  351 |                     requested_features.contains(wgt::Features::TEXTURE_BINDING_ARRAY),\n  352 |                 )\n  353 |                 .shader_storage_buffer_array_dynamic_indexing(requested_features.contains(\n  354 |                     wgt::Features::TEXTURE_BINDING_ARRAY\n  355 |                         | wgt::Features::STORAGE_RESOURCE_BINDING_ARRAY,\n  356 |                 ))\n  357 |                 //.shader_storage_image_array_dynamic_indexing(","lines":12,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-hal/src/vulkan/adapter.rs#L346-L357"}]},{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"In `create_mesh_pipeline`, the **task** stage's `zero_initialize_workgroup_memory` is\nincorrectly read from the **mesh** stage's compilation options instead of the task\nstage's own options. Every other field of the task stage is sourced from `task`\n(`task.module`, `task.entry_point`, and `task_constants` derived from\n`task.compilation_options.constants`), but the zero-init flag reads\n`desc.mesh.compilation_options.zero_initialize_workgroup_memory`. This means a caller\nwho sets `zero_initialize_workgroup_memory` differently on the task vs mesh stage gets\nthe mesh stage's value silently applied to the task stage, so the task shader's\nworkgroup memory may be zero-initialized (or not) contrary to what was requested -\na correctness/perf discrepancy that is completely silent. Compare with\n`create_render_pipeline`, where the vertex stage uses `desc.vertex.compilation_options`\nand the fragment stage uses `frag.compilation_options` for the same flag.","fix":"Read the flag from the task stage's own compilation options:\n```\n-                        zero_initialize_workgroup_memory: desc\n-                            .mesh\n-                            .compilation_options\n-                            .zero_initialize_workgroup_memory,\n+                        zero_initialize_workgroup_memory: task\n+                            .compilation_options\n+                            .zero_initialize_workgroup_memory,\n```","locations":[{"ref":"wgpu/src/backend/wgpu_core.rs:1455-1465","code":" 1455 |                 pipe::TaskState {\n 1456 |                     stage: pipe::ProgrammableStageDescriptor {\n 1457 |                         module: task.module.inner.as_core().id,\n 1458 |                         entry_point: task.entry_point.map(Borrowed),\n 1459 |                         constants: task_constants,\n 1460 |                         zero_initialize_workgroup_memory: desc\n 1461 |                             .mesh\n 1462 |                             .compilation_options\n 1463 |                             .zero_initialize_workgroup_memory,\n 1464 |                     },\n 1465 |                 }","lines":11,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu/src/backend/wgpu_core.rs#L1455-L1465"}]},{"id":"CPY_4","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `write_wrapped_image_sample`, the 3-plane external-texture path computes\n`plane2_coords` by clamping to `plane2`'s texel bounds, but the *upper* clamp\nbound mistakenly subtracts `plane1_half_texel` instead of `plane2_half_texel`:\n\n```\nfloat2 plane2_coords = metal::clamp(coords, bounds.xy + plane2_half_texel, bounds.zw - plane1_half_texel);\n```\n\nThe lower bound correctly uses `plane2_half_texel`, and the analogous `plane0`\n(line 6513) and `plane1` (line 6529) clamps use a single consistent half-texel\nfor both bounds. This is a copy/paste slip: whenever `plane1` and `plane2` differ\nin size, the V-plane (`plane2`) sample can be clamped to the wrong sub-texel\nregion, producing an incorrect chroma sample near the texture edges.","fix":"Use `plane2_half_texel` for the upper bound as well:\nbefore:\n```\n\"{l3}float2 plane2_coords = {NAMESPACE}::clamp(coords, bounds.xy + plane2_half_texel, bounds.zw - plane1_half_texel);\"\n```\nafter:\n```\n\"{l3}float2 plane2_coords = {NAMESPACE}::clamp(coords, bounds.xy + plane2_half_texel, bounds.zw - plane2_half_texel);\"\n```","locations":[{"ref":"naga/src/back/msl/writer.rs:6551-6554","code":" 6551 |                 writeln!(\n 6552 |                     self.out,\n 6553 |                     \"{l3}float2 plane2_coords = {NAMESPACE}::clamp(coords, bounds.xy + plane2_half_texel, bounds.zw - plane1_half_texel);\"\n 6554 |                 )?;","lines":4,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/back/msl/writer.rs#L6551-L6554"}]},{"id":"CPY_5","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `E::CooperativeMultiplyAdd` validation, the loop iterates over the three\noperands `[a, b, c]` binding each to `operand`, but on a role/type mismatch it\nalways reports the handle `a` instead of the offending `operand`:\n\n```rust\nfor (operand, expected_role) in [a, b, c].into_iter().zip(roles) {\n    match resolver[operand] {\n        Ti::CooperativeMatrix { role, .. } if role == expected_role => {}\n        ref other => {\n            log::debug!(\"{expected_role:?} operand type: {other:?}\");\n            return Err(ExpressionError::InvalidCooperativeOperand(a)); // BUG: reports `a`, not `operand`\n        }\n    }\n}\n```\n\nWhen operand `b` or `c` is the invalid one, the diagnostic points at the wrong\nexpression, misleading the user.","fix":"Return `ExpressionError::InvalidCooperativeOperand(operand)` instead of\n`InvalidCooperativeOperand(a)`.","locations":[{"ref":"naga/src/valid/expression.rs:1416-1423","code":" 1416 |                 for (operand, expected_role) in [a, b, c].into_iter().zip(roles) {\n 1417 |                     match resolver[operand] {\n 1418 |                         Ti::CooperativeMatrix { role, .. } if role == expected_role => {}\n 1419 |                         ref other => {\n 1420 |                             log::debug!(\"{expected_role:?} operand type: {other:?}\");\n 1421 |                             return Err(ExpressionError::InvalidCooperativeOperand(a));\n 1422 |                         }\n 1423 |                     }","lines":8,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/valid/expression.rs#L1416-L1423"}]},{"id":"CPY_6","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `iter_blas`, the guard that validates a triangle geometry with an index buffer checks\n`mesh.size.index_count.is_none()` twice and never checks `mesh.size.index_format.is_none()`, even though\n`mesh.size.index_format.unwrap()` is later called unconditionally (e.g. `index_stride =\nmesh.size.index_format.unwrap().byte_size()` and `format: mesh.size.index_format.unwrap()`). The\nduplicated condition is a copy-paste error; the intended third clause is clearly the `index_format`\npresence check. In practice `index_format` is guaranteed `Some` here by earlier cross-checks against the\nBLAS size descriptor, so this is currently dead/redundant rather than a live panic, but the code no\nlonger expresses the invariant it intends to enforce and would silently rely on distant validation if\nthat ever changed.","fix":"Replace the duplicated clause with the intended `index_format` check:\n```\nif mesh.first_index.is_none()\n    || mesh.size.index_count.is_none()\n    || mesh.size.index_format.is_none()\n{\n```","locations":[{"ref":"wgpu-core/src/command/ray_tracing.rs:844-847","code":"  844 |                         if mesh.first_index.is_none()\n  845 |                             || mesh.size.index_count.is_none()\n  846 |                             || mesh.size.index_count.is_none()\n  847 |                         {","lines":4,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-core/src/command/ray_tracing.rs#L844-L847"}]},{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`InstanceDevices::poll_all_devices` declares a return type of `Result<bool, WaitIdleError>`,\nbut it silently discards any error returned by `device.poll_and_return_closures`. The result\nis only inspected with `matches!(result, Ok(wgt::PollStatus::QueueEmpty))`, so an `Err(...)`\n(e.g. a device loss or a timeout on the `force_wait` / `wait_indefinitely()` path) is thrown\naway and merely treated as \"queue not empty\". The function then always returns `Ok(...)`, so\nthe `WaitIdleError` arm of the return type is never actually produced. A caller of\n`Instance::poll_all_devices` (i.e. `wgpu::Instance::poll_all`) therefore cannot learn that a\ndevice errored or that an indefinite wait failed, and will observe a normal, successful poll.","fix":"Propagate the error instead of swallowing it. For example, match on `result` and return the\nerror (still collecting the closures first), or use `?`:\n```rust\nlet (closures, result) = device.poll_and_return_closures(poll_type);\nclosure_list.extend(closures);\nlet status = result?;\nlet is_queue_empty = matches!(status, wgt::PollStatus::QueueEmpty);\nall_queue_empty &= is_queue_empty;\n```\nIf best-effort polling across devices is genuinely intended, at minimum log the dropped error\nand document why it is ignored, rather than leaving the unreachable `WaitIdleError` return arm.","locations":[{"ref":"wgpu-core/src/instance.rs:78-84","code":"   78 |                 let (closures, result) = device.poll_and_return_closures(poll_type);\n   79 | \n   80 |                 let is_queue_empty = matches!(result, Ok(wgt::PollStatus::QueueEmpty));\n   81 | \n   82 |                 all_queue_empty &= is_queue_empty;\n   83 | \n   84 |                 closure_list.extend(closures);","lines":7,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-core/src/instance.rs#L78-L84"},{"ref":"wgpu-core/src/instance.rs:61-89","code":"   61 |     fn poll_all_devices(\n   62 |         &self,\n   63 |         force_wait: bool,\n   64 |         closure_list: &mut UserClosures,\n   65 |     ) -> Result<bool, WaitIdleError> {\n   66 |         let mut all_queue_empty = true;\n   67 |         {\n   68 |             let device_guard = self.0.lock();\n   69 | \n   70 |             for device in device_guard.iter().filter_map(|device| device.upgrade()) {\n   71 |                 let poll_type = if force_wait {\n   72 |                     // TODO(#8286): Should expose timeout to poll_all.\n   73 |                     wgt::PollType::wait_indefinitely()\n   74 |                 } else {\n   75 |                     wgt::PollType::Poll\n   76 |                 };\n   77 | \n   78 |                 let (closures, result) = device.poll_and_return_closures(poll_type);\n   79 | \n   80 |                 let is_queue_empty = matches!(result, Ok(wgt::PollStatus::QueueEmpty));\n   81 | \n   82 |                 all_queue_empty &= is_queue_empty;\n   83 | \n   84 |                 closure_list.extend(closures);\n   85 |             }\n   86 |         }\n   87 | \n   88 |         Ok(all_queue_empty)\n   89 |     }","lines":29,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-core/src/instance.rs#L61-L89"}]},{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`crate::Error::from_js` only recognizes `GpuValidationError` and `GpuOutOfMemoryError`\nand calls `panic!(\"Unexpected error\")` for anything else. WebGPU also defines\n`GPUInternalError`, which is a first-class error type this backend actively opts into:\n`push_error_scope` maps `crate::ErrorFilter::Internal` to `webgpu_sys::GpuErrorFilter::Internal`\n(around line 2666), and `on_uncaptured_error` (line 2646) routes *every* uncaptured error\nthrough `from_js`. When the browser produces a `GPUInternalError` (either popped from an\n`Internal` error scope via `future_pop_error_scope` at line 1067, or delivered to the\nuncaptured-error handler), `from_js` falls into the `else` arm and panics. On wasm there is\nno `catch_unwind`, so this is an uncatchable process abort triggered by a legitimate,\napp-observable GPU condition. `crate::Error` even has an `Internal { source, description }`\nvariant that is never produced here.","fix":"Add a fallback that maps any other `GpuError` (via its `message()` accessor on the\n`GpuError` base type) to `crate::Error::Internal { source, description }` instead of\n`panic!`. For example, downcast/interpret `js_error` as a `webgpu_sys::GpuError`, read\n`.message()`, and return `crate::Error::Internal { source, description: message }` rather\nthan aborting.","locations":[{"ref":"wgpu/src/backend/webgpu.rs:74-88","code":"   74 | impl crate::Error {\n   75 |     fn from_js(js_error: js_sys::Object) -> Self {\n   76 |         let source = Box::<dyn core::error::Error + Send + Sync>::from(\"<WebGPU Error>\");\n   77 |         if let Some(js_error) = js_error.dyn_ref::<webgpu_sys::GpuValidationError>() {\n   78 |             crate::Error::Validation {\n   79 |                 source,\n   80 |                 description: js_error.message(),\n   81 |             }\n   82 |         } else if js_error.has_type::<webgpu_sys::GpuOutOfMemoryError>() {\n   83 |             crate::Error::OutOfMemory { source }\n   84 |         } else {\n   85 |             panic!(\"Unexpected error\");\n   86 |         }\n   87 |     }\n   88 | }","lines":15,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu/src/backend/webgpu.rs#L74-L88"},{"ref":"wgpu/src/backend/webgpu.rs:2644-2654","code":" 2644 |     fn on_uncaptured_error(&self, handler: Arc<dyn crate::UncapturedErrorHandler>) {\n 2645 |         let f = Closure::wrap(Box::new(move |event: webgpu_sys::GpuUncapturedErrorEvent| {\n 2646 |             let error = crate::Error::from_js(event.error().value_of());\n 2647 |             handler(error);\n 2648 |         }) as Box<dyn FnMut(_)>);\n 2649 |         self.inner\n 2650 |             .set_onuncapturederror(Some(f.as_ref().unchecked_ref()));\n 2651 |         // Release memory management of this closure from Rust to the JS GC.\n 2652 |         // TODO: This will leak if weak references is not supported.\n 2653 |         f.forget();\n 2654 |     }","lines":11,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu/src/backend/webgpu.rs#L2644-L2654"},{"ref":"wgpu/src/backend/webgpu.rs:2663-2667","code":" 2663 |         self.inner.push_error_scope(match filter {\n 2664 |             crate::ErrorFilter::OutOfMemory => webgpu_sys::GpuErrorFilter::OutOfMemory,\n 2665 |             crate::ErrorFilter::Validation => webgpu_sys::GpuErrorFilter::Validation,\n 2666 |             crate::ErrorFilter::Internal => webgpu_sys::GpuErrorFilter::Internal,\n 2667 |         });","lines":5,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu/src/backend/webgpu.rs#L2663-L2667"}]},{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`FeaturesManager::check_availability` omits version checks for two features that\nhave real minimum-version requirements: `SHADER_BARYCENTRICS` (needs desktop\nGLSL 450 / GLSL ES 320, per `GL_EXT_fragment_shader_barycentric`) and\n`PRIMITIVE_INDEX`. When these features are requested on a version that cannot\nsupport them, `check_availability` returns `Ok(())` instead of\n`Error::MissingFeatures`, and `write` then unconditionally emits the\ncorresponding `#extension ... : require` directive. The result is that instead of\na clean naga error, the backend produces GLSL that the downstream driver rejects\nat compile time. Contrast with e.g. `TEXTURE_SHADOW_LOD`, `SUBGROUP_OPERATIONS`,\netc., which are all gated here. (`INSTANCE_INDEX` and `FULL_IMAGE_FORMATS` are\nintentionally omitted because they are always polyfillable/internal; the two\nabove are not.)","fix":"Add `check_feature!` entries for the missing features, e.g.\n`check_feature!(SHADER_BARYCENTRICS, 450, 320);` and an appropriate\n`check_feature!(PRIMITIVE_INDEX, ...)` (matching the version thresholds already\nencoded in `FeaturesManager::write`, i.e. ES 320 / desktop 150 for the geometry\nshader path), so unsupported requests surface as `Error::MissingFeatures`.","locations":[{"ref":"naga/src/back/glsl/features.rs:113-141","code":"  113 |         check_feature!(COMPUTE_SHADER, 420, 310);\n  114 |         check_feature!(BUFFER_STORAGE, 400, 310);\n  115 |         check_feature!(DOUBLE_TYPE, 150);\n  116 |         check_feature!(CUBE_TEXTURES_ARRAY, 130, 310);\n  117 |         check_feature!(MULTISAMPLED_TEXTURES, 150, 300);\n  118 |         check_feature!(MULTISAMPLED_TEXTURE_ARRAYS, 150, 310);\n  119 |         check_feature!(ARRAY_OF_ARRAYS, 120, 310);\n  120 |         check_feature!(IMAGE_LOAD_STORE, 130, 310);\n  121 |         check_feature!(CONSERVATIVE_DEPTH, 130, 300);\n  122 |         check_feature!(NOPERSPECTIVE_QUALIFIER, 130);\n  123 |         check_feature!(SAMPLE_QUALIFIER, 400, 320);\n  124 |         check_feature!(CLIP_DISTANCE, 130, 300 /* with extension */);\n  125 |         check_feature!(CULL_DISTANCE, 450, 300 /* with extension */);\n  126 |         check_feature!(SAMPLE_VARIABLES, 400, 300);\n  127 |         check_feature!(DYNAMIC_ARRAY_SIZE, 400 /* with extension */, 310);\n  128 |         check_feature!(DUAL_SOURCE_BLENDING, 330, 300 /* with extension */);\n  129 |         check_feature!(SUBGROUP_OPERATIONS, 430, 310);\n  130 |         check_feature!(TEXTURE_ATOMICS, 420, 310);\n  131 |         match version {\n  132 |             Version::Embedded { is_webgl: true, .. } => check_feature!(MULTI_VIEW, 140, 300),\n  133 |             _ => check_feature!(MULTI_VIEW, 140, 310),\n  134 |         };\n  135 |         // Only available on glsl core, this means that opengl es can't query the number\n  136 |         // of samples nor levels in a image and neither do bound checks on the sample nor\n  137 |         // the level argument of texelFetch\n  138 |         check_feature!(TEXTURE_SAMPLES, 150);\n  139 |         check_feature!(TEXTURE_LEVELS, 130);\n  140 |         check_feature!(IMAGE_SIZE, 430, 310);\n  141 |         check_feature!(TEXTURE_SHADOW_LOD, 200, 300);","lines":29,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/back/glsl/features.rs#L113-L141"},{"ref":"naga/src/back/glsl/features.rs:295-313","code":"  295 |         if self.0.contains(Features::SHADER_BARYCENTRICS) {\n  296 |             // https://github.com/KhronosGroup/GLSL/blob/main/extensions/ext/GLSL_EXT_fragment_shader_barycentric.txt\n  297 |             writeln!(\n  298 |                 out,\n  299 |                 \"#extension GL_EXT_fragment_shader_barycentric : require\"\n  300 |             )?;\n  301 |         }\n  302 | \n  303 |         if self.0.contains(Features::PRIMITIVE_INDEX) {\n  304 |             match options.version {\n  305 |                 Version::Embedded { version, .. } if version < 320 => {\n  306 |                     writeln!(out, \"#extension GL_OES_geometry_shader : require\")?;\n  307 |                 }\n  308 |                 Version::Desktop(version) if version < 150 => {\n  309 |                     writeln!(out, \"#extension GL_ARB_geometry_shader4 : require\")?;\n  310 |                 }\n  311 |                 _ => (),\n  312 |             }\n  313 |         }","lines":19,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/back/glsl/features.rs#L295-L313"}]},{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`Lexer::new` calls `pp.add_define(define, value).unwrap()` on every entry of the\ncaller-supplied `defines` map, with a `//TODO: handle error` note. `add_define` fails for\nan invalid macro name/value, so a caller passing a malformed preprocessor define (these come\nfrom application-level `Options`, not the shader text) triggers a panic inside the frontend\ninstead of a recoverable parse error. Front ends embedding wgpu/naga (Deno, Firefox, etc.)\nwould abort the process rather than surface a `ParseErrors`.","fix":"Propagate the failure instead of `unwrap()`. Either make `Lexer::new` return\n`Result<Self, Error>` and bubble the error up through `Frontend::parse`, or record the\nfailed define into the frontend's `errors` list and skip it, so an invalid define name\nproduces a diagnostic rather than a panic.","locations":[{"ref":"naga/src/front/glsl/lex.rs:35-41","code":"   35 |     pub fn new(input: &'a str, defines: &'a FastHashMap<String, String>) -> Self {\n   36 |         let mut pp = Preprocessor::new(input);\n   37 |         for (define, value) in defines {\n   38 |             pp.add_define(define, value).unwrap(); //TODO: handle error\n   39 |         }\n   40 |         Lexer { pp }\n   41 |     }","lines":7,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/front/glsl/lex.rs#L35-L41"}]},{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"In `E::ImageLoad` validation, when the mip-`level` operand of a mipmapped image\nhas an invalid (non-integer) type, the code returns\n`ExpressionError::InvalidImageArrayIndexType(level)` - the error variant meant for\n*array index* operands - rather than a level/index variant:\n\n```rust\nmatch (level, class.is_mipmapped()) {\n    (None, false) => {}\n    (Some(level), true) => match resolver[level] {\n        Ti::Scalar(Sc { kind: Sk::Sint | Sk::Uint, width: _ }) => {}\n        _ => return Err(ExpressionError::InvalidImageArrayIndexType(level)), // wrong variant\n    },\n    ...\n}\n```\n\nThe dedicated `InvalidImageOtherIndexType` variant (already used a few lines above\nfor the `sample` operand and described as \"Image sample or level-of-detail index's\ntype ... is not an integer scalar\") is the correct one. The current variant\nproduces a misleading \"array index\" diagnostic for a level operand.","fix":"Change the `_ =>` arm to\n`return Err(ExpressionError::InvalidImageOtherIndexType(level))`.","locations":[{"ref":"naga/src/valid/expression.rs:877-885","code":"  877 |                 match (level, class.is_mipmapped()) {\n  878 |                     (None, false) => {}\n  879 |                     (Some(level), true) => match resolver[level] {\n  880 |                         Ti::Scalar(Sc {\n  881 |                             kind: Sk::Sint | Sk::Uint,\n  882 |                             width: _,\n  883 |                         }) => {}\n  884 |                         _ => return Err(ExpressionError::InvalidImageArrayIndexType(level)),\n  885 |                     },","lines":9,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/valid/expression.rs#L877-L885"}]},{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"`for_each_file` builds its glob error context with a plain string literal that\ncontains a format placeholder which is never interpolated (there is no `path`\nvariable in scope, and `.context(...)` takes an already-formatted value), then\n`.unwrap()`s, so an invalid pattern panics with a literally useless message\n`\"glob pattern {path:?} is invalid\"`.","fix":"Before:\n```\nglob(pattern_in_dir)\n    .context(\"glob pattern {path:?} is invalid\")\n    .unwrap()\n```\nAfter:\n```\nglob(pattern_in_dir)\n    .with_context(|| format!(\"glob pattern {pattern_in_dir:?} is invalid\"))\n    .unwrap()\n```","locations":[{"ref":"naga/xtask/src/glob.rs:26-28","code":"   26 |     glob(pattern_in_dir)\n   27 |         .context(\"glob pattern {path:?} is invalid\")\n   28 |         .unwrap()","lines":3,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/xtask/src/glob.rs#L26-L28"}]},{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"`Adapter::open` returns `Result<_, crate::DeviceError>`, but the Metal command-queue creation\n`newCommandQueueWithMaxCommandBufferCount(...)` is `.unwrap()`ed. This Metal call can return `nil`\n(e.g. on resource exhaustion), which would panic the caller instead of surfacing a recoverable\n`DeviceError::OutOfMemory`/`Lost`. Device open should degrade to an error, not abort the process.","fix":"Replace the `.unwrap()` with error propagation, e.g.:\n```rust\n// before\nlet queue = self\n    .shared\n    .device\n    .newCommandQueueWithMaxCommandBufferCount(MAX_COMMAND_BUFFERS)\n    .unwrap();\n// after\nlet queue = self\n    .shared\n    .device\n    .newCommandQueueWithMaxCommandBufferCount(MAX_COMMAND_BUFFERS)\n    .ok_or(crate::DeviceError::OutOfMemory)?;\n```","locations":[{"ref":"wgpu-hal/src/metal/adapter.rs:75-79","code":"   75 |             let queue = self\n   76 |                 .shared\n   77 |                 .device\n   78 |                 .newCommandQueueWithMaxCommandBufferCount(MAX_COMMAND_BUFFERS)\n   79 |                 .unwrap();","lines":5,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-hal/src/metal/adapter.rs#L75-L79"}]},{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`create_sampler` finishes with\n`self.shared.device.newSamplerStateWithDescriptor(&descriptor).unwrap()`.\n`newSamplerStateWithDescriptor` returns an `Option` and can return `None`\n(e.g. exhausting the device sampler limit or unsupported descriptor\ncombinations), so a driver-side failure panics the process instead of being\nreported through the `DeviceResult<super::Sampler>` this function already\nreturns.","fix":"Map the `None` case to a device error instead of unwrapping, e.g.\n`.ok_or(crate::DeviceError::Unexpected)?` (or `OutOfMemory` if appropriate),\nand return it via `?` so sampler creation failure is recoverable.","locations":[{"ref":"wgpu-hal/src/metal/device.rs:752-760","code":"  752 |             let raw = self\n  753 |                 .shared\n  754 |                 .device\n  755 |                 .newSamplerStateWithDescriptor(&descriptor)\n  756 |                 .unwrap();\n  757 | \n  758 |             self.counters.samplers.add(1);\n  759 | \n  760 |             Ok(super::Sampler { raw })","lines":9,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-hal/src/metal/device.rs#L752-L760"}]},{"id":"ERR_9","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`create_query_set` allocates its backing buffers with\n`newBufferWithLength_options(...).unwrap()` in both the `Occlusion` and\n`Timestamp` branches. `newBufferWithLength_options` returns `None` on allocation\nfailure (out of memory), so a large or memory-pressured allocation turns a\nrecoverable condition into a hard panic even though the function returns\n`DeviceResult`. Contrast with `create_buffer`, which correctly maps the same\ncall to `.ok_or(crate::DeviceError::OutOfMemory)?`.","fix":"Replace the `.unwrap()` on `newBufferWithLength_options` with\n`.ok_or(crate::DeviceError::OutOfMemory)?`, matching `create_buffer`, so buffer\nallocation failure surfaces as a `DeviceError` instead of panicking.","locations":[{"ref":"wgpu-hal/src/metal/device.rs:1926-1930","code":" 1926 |                     let raw_buffer = self\n 1927 |                         .shared\n 1928 |                         .device\n 1929 |                         .newBufferWithLength_options(size as usize, options)\n 1930 |                         .unwrap();","lines":5,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-hal/src/metal/device.rs#L1926-L1930"},{"ref":"wgpu-hal/src/metal/device.rs:1943-1945","code":" 1943 |                     let destination_buffer = device\n 1944 |                         .newBufferWithLength_options(size as usize, MTLResourceOptions::empty())\n 1945 |                         .unwrap();","lines":3,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-hal/src/metal/device.rs#L1943-L1945"}]},{"id":"ERR_10","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`CommandEncoder::make_framebuffer` is declared to return\n`Result<vk::Framebuffer, crate::DeviceError>`, but the actual\n`create_framebuffer` call uses `.unwrap()` instead of mapping the error. A\ndevice-lost / out-of-memory result from `vkCreateFramebuffer` will panic the\nprocess rather than propagate a `DeviceError`, defeating the `?` at the call\nsite in `begin_render_pass` (which itself then also `.unwrap()`s the result at\nlines 868 and 870). Every other cache-fill path here (e.g.\n`make_temp_texture_view` via `map_host_device_oom_and_ioca_err`) propagates the\nerror properly.","fix":"Replace `.unwrap()` with\n`.map_err(super::map_host_device_oom_err)?` in `make_framebuffer`, and\npropagate (`?`) the results of `make_render_pass`/`make_framebuffer` in\n`begin_render_pass` instead of `.unwrap()`.","locations":[{"ref":"wgpu-hal/src/vulkan/command.rs:76","code":"   76 |                 let raw = unsafe { self.device.raw.create_framebuffer(&vk_info, None).unwrap() };","lines":1,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-hal/src/vulkan/command.rs#L76"},{"ref":"wgpu-hal/src/vulkan/command.rs:868-870","code":"  868 |         let raw_pass = self.device.make_render_pass(rp_key).unwrap();\n  869 |         fb_key.raw_pass = raw_pass;\n  870 |         let raw_framebuffer = self.make_framebuffer(fb_key).unwrap();","lines":3,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-hal/src/vulkan/command.rs#L868-L870"}]},{"id":"ERR_11","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`Dx12Compiler::from_env` parses `WGPU_DX12_COMPILER` with `env.parse()` and attaches a\n`map_err(|expected_msg| log::warn!(...))` intended to warn on unknown values. But\n`impl FromStr for Dx12Compiler` never returns `Err`: its fallback arm\n`path => Self::DynamicDxc { dxc_path: path.to_string() }` accepts *any* string. As a result\nthe `map_err` warning branch is dead code, and a typo like `WGPU_DX12_COMPILER=dxxc` is\nsilently interpreted as a DLL path (`dxcompiler` load will later fail) instead of being\nreported. Additionally, `from_str` matches on `value.to_lowercase().as_str()` and then uses\nthat lowercased `path` for the `dxc_path`, so an explicit path passed via the env var is\nlowercased before use.","fix":"Make `FromStr` return `Err(expected_msg)` for unrecognized short names (while still allowing\nan explicit path through a distinct, non-lowercased mechanism), so the `from_env` warning is\nactually reachable. At minimum, stop lowercasing the string used as `dxc_path`: match on a\nlowercased copy for the keyword arms but store the original `value` in `DynamicDxc`.","locations":[{"ref":"wgpu-types/src/backend.rs:822-831","code":"  822 |     #[must_use]\n  823 |     pub fn from_env() -> Option<Self> {\n  824 |         let env = crate::env::var(\"WGPU_DX12_COMPILER\")?;\n  825 |         env.parse().map_err(|expected_msg| {\n  826 |             log::warn!(\n  827 |                 \"Unknown value `{env:?}` for `WGPU_DX12_COMPILER` environment variable. {expected_msg}\"\n  828 |             )\n  829 |         })\n  830 |         .ok()\n  831 |     }","lines":10,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-types/src/backend.rs#L822-L831"},{"ref":"wgpu-types/src/backend.rs:846-860","code":"  846 | impl FromStr for Dx12Compiler {\n  847 |     type Err = &'static str;\n  848 | \n  849 |     fn from_str(value: &str) -> Result<Self, Self::Err> {\n  850 |         Ok(match value.to_lowercase().as_str() {\n  851 |             \"dxc\" | \"dynamicdxc\" => Self::default_dynamic_dxc(),\n  852 |             \"staticdxc\" => Self::StaticDxc,\n  853 |             \"fxc\" => Self::Fxc,\n  854 |             \"auto\" => Self::Auto,\n  855 |             path => Self::DynamicDxc {\n  856 |                 dxc_path: path.to_string(),\n  857 |             },\n  858 |         })\n  859 |     }\n  860 | }","lines":15,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-types/src/backend.rs#L846-L860"}]},{"id":"ERR_12","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"The panic message passed to `.expect(...)` is a plain string, so the `{trimmed}` in\n`.expect(\"Invalid test line: {trimmed}\")` is never interpolated - on failure the user would see the\nliteral text `{trimmed}` instead of the offending line. (In practice the regex ends in `(?<selector>.*)`\nwhich always matches, so this path is effectively dead, but the diagnostic is still wrong.)","fix":"Build the message with a format macro, e.g.:\n```rust\n// before\nlet captures = TEST_LINE_REGEX\n    .captures(trimmed)\n    .expect(\"Invalid test line: {trimmed}\");\n// after\nlet captures = TEST_LINE_REGEX\n    .captures(trimmed)\n    .unwrap_or_else(|| panic!(\"Invalid test line: {trimmed}\"));\n```","locations":[{"ref":"xtask/src/cts.rs:196-198","code":"  196 |             let captures = TEST_LINE_REGEX\n  197 |                 .captures(trimmed)\n  198 |                 .expect(\"Invalid test line: {trimmed}\");","lines":3,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/xtask/src/cts.rs#L196-L198"}]},{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"`write_image_query` handles `ImageQuery::NumLayers` by unconditionally emitting\n`OpImageQuerySizeLod` (with an explicit LOD of 0). Per the SPIR-V spec, `OpImageQuerySizeLod`\nrequires the image to have `Sampled == 1` (a sampled image) and `MS == 0`; it is invalid for\nstorage images (`Sampled == 2`). `textureNumLayers` is valid WGSL for storage arrayed textures\n(`texture_storage_2d_array`), and the sibling `ImageQuery::Size` arm already correctly selects\n`OpImageQuerySize` for `Ic::Storage { .. }` (and multisampled classes). The `NumLayers` arm\ndoes not make this distinction, so querying the layer count of a storage arrayed texture emits\ninvalid SPIR-V (rejected by validation layers / drivers).","fix":"Mirror the class-based selection used in the `Iq::Size` arm: for `Ic::Storage { .. }` (and any\nmultisampled class) emit `spirv::Op::ImageQuerySize` with no LOD operand, and only use\n`ImageQuerySizeLod` with the level-0 operand for sampled/depth non-multisampled images. Extract\nthe last component (`vec_size as u32 - 1`) from whichever query result you produce.","locations":[{"ref":"naga/src/back/spv/image.rs:1223-1252","code":" 1223 |             Iq::NumLayers => {\n 1224 |                 let vec_size = match dim {\n 1225 |                     Id::D1 => crate::VectorSize::Bi,\n 1226 |                     Id::D2 | Id::Cube => crate::VectorSize::Tri,\n 1227 |                     Id::D3 => crate::VectorSize::Quad,\n 1228 |                 };\n 1229 |                 let extended_size_type_id = self.get_numeric_type_id(NumericType::Vector {\n 1230 |                     size: vec_size,\n 1231 |                     scalar: crate::Scalar::U32,\n 1232 |                 });\n 1233 |                 let id_extended = self.gen_id();\n 1234 |                 let mut inst = Instruction::image_query(\n 1235 |                     spirv::Op::ImageQuerySizeLod,\n 1236 |                     extended_size_type_id,\n 1237 |                     id_extended,\n 1238 |                     image_id,\n 1239 |                 );\n 1240 |                 inst.add_operand(self.get_index_constant(0));\n 1241 |                 block.body.push(inst);\n 1242 | \n 1243 |                 let extract_id = self.gen_id();\n 1244 |                 block.body.push(Instruction::composite_extract(\n 1245 |                     result_type_id,\n 1246 |                     extract_id,\n 1247 |                     id_extended,\n 1248 |                     &[vec_size as u32 - 1],\n 1249 |                 ));\n 1250 | \n 1251 |                 extract_id\n 1252 |             }","lines":30,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/back/spv/image.rs#L1223-L1252"}]},{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`write_task_shader_wrapper` clamps the per-dimension mesh dispatch limit with\n`limits.max_mesh_workgroups_per_dim.min(2 << 21)`, i.e. it caps each of\n`grid_size.x/y/z` to at most `2 << 21` == `2^22` == `4194304`. D3D12's\n`DispatchMesh` hard limit is `65535` (`0xFFFF`) *per dimension* (with a separate\ntotal limit of `2^22`). `2 << 21` is the *total* group-count bound, not the\nper-axis bound. If the host passes a `max_mesh_workgroups_per_dim` larger than\n`65535`, the emitted guard `grid_size.{x,y,z} > max_per_dim` will let per-axis\ncounts up to `4194304` through, exceeding the D3D12 per-dimension limit and\nrisking device removal / undefined behaviour. The constant should reflect the\nper-axis cap (`65535`), not the total-groups cap.","fix":"Cap the per-dimension value to the D3D12 per-axis limit, e.g.\n`let max_per_dim = limits.max_mesh_workgroups_per_dim.min(65535);`, and keep the\nseparate `max_total` (`2^22`) check for the product of the dimensions.","locations":[{"ref":"naga/src/back/hlsl/mesh_shader.rs:276-284","code":"  276 |             let max_per_dim = limits.max_mesh_workgroups_per_dim.min(2 << 21);\n  277 |             let max_total = limits.max_mesh_workgroups_total;\n  278 |             for i in 0..3 {\n  279 |                 writeln!(\n  280 |                     self.out,\n  281 |                     \"{level}{grid_size}.{} > {max_per_dim} ||\",\n  282 |                     back::COMPONENTS[i],\n  283 |                 )?;\n  284 |             }","lines":9,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/back/hlsl/mesh_shader.rs#L276-L284"}]},{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`needs_object_memory_barriers` is computed once for the *whole module* (true if\nany entry point is a `Task` stage with a `task_payload`) and then consulted by\nthe shared `write_barrier` helper. As a result, every `Barrier::WORK_GROUP`\nbarrier emitted *anywhere* in the module - including in ordinary `kernel`\n(compute) or regular functions that have nothing to do with mesh/task shaders -\ngets an extra `metal::mem_flags::mem_object_data` barrier appended. `mem_object_data`\nis only meaningful in object (task) shader functions, so a module that mixes a\ntask shader with a plain compute shader that uses `workgroupBarrier()` will emit\na `mem_object_data` barrier inside the compute kernel, which is at best redundant\nand may be rejected by the Metal compiler.","fix":"Scope the object-memory-barrier requirement to the function/entry point actually\nbeing written (e.g. only when the current entry point is a `Task` stage with a\ntask payload), rather than caching a single module-wide `needs_object_memory_barriers`\nflag on the `Writer` and applying it to every `WORK_GROUP` barrier.","locations":[{"ref":"naga/src/back/msl/writer.rs:4580-4583","code":" 4580 |         self.needs_object_memory_barriers = module\n 4581 |             .entry_points\n 4582 |             .iter()\n 4583 |             .any(|e| e.stage == crate::ShaderStage::Task && e.task_payload.is_some());","lines":4,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/back/msl/writer.rs#L4580-L4583"},{"ref":"naga/src/back/msl/writer.rs:8348-8359","code":" 8348 |         if flags.contains(crate::Barrier::WORK_GROUP) {\n 8349 |             writeln!(\n 8350 |                 self.out,\n 8351 |                 \"{level}{NAMESPACE}::threadgroup_barrier({NAMESPACE}::mem_flags::mem_threadgroup);\",\n 8352 |             )?;\n 8353 |             if self.needs_object_memory_barriers {\n 8354 |                 writeln!(\n 8355 |                     self.out,\n 8356 |                     \"{level}{NAMESPACE}::threadgroup_barrier({NAMESPACE}::mem_flags::mem_object_data);\",\n 8357 |                 )?;\n 8358 |             }\n 8359 |         }","lines":12,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/back/msl/writer.rs#L8348-L8359"}]},{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`write_coordinate_one` builds the vector-of-ones constant by calling `self.gen_id()` and\nemitting a raw `Instruction::constant_composite(...)` straight into\n`self.writer.logical_layout.declarations` every time it is invoked. This bypasses the\nconstant deduplication that `Writer::get_constant_composite` provides, so every `Restrict`\nimage access (each `ImageLoad`/`ImageStore` under the `Restrict` bounds-check policy) emits a\nfresh, identical `OpConstantComposite`, bloating the module with duplicate constants.","fix":"Use the deduplicating path, e.g. build the constituent id list and call\n`self.writer.get_constant_composite(LookupType::Local(LocalType::Numeric(NumericType::Vector { size: vector_size, scalar: crate::Scalar::I32 })), &ones[..vector_size as usize])`\ninstead of generating a new id and pushing `constant_composite` unconditionally.","locations":[{"ref":"naga/src/back/spv/image.rs:403-419","code":"  403 |     fn write_coordinate_one(&mut self, coordinates: &ImageCoordinates) -> Result<Word, Error> {\n  404 |         let one = self.get_scope_constant(1);\n  405 |         match coordinates.size {\n  406 |             None => Ok(one),\n  407 |             Some(vector_size) => {\n  408 |                 let ones = [one; 4];\n  409 |                 let id = self.gen_id();\n  410 |                 Instruction::constant_composite(\n  411 |                     coordinates.type_id,\n  412 |                     id,\n  413 |                     &ones[..vector_size as usize],\n  414 |                 )\n  415 |                 .to_words(&mut self.writer.logical_layout.declarations);\n  416 |                 Ok(id)\n  417 |             }\n  418 |         }\n  419 |     }","lines":17,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/back/spv/image.rs#L403-L419"}]},{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`patch_function` locates a function's `LookupFunction` by doing a linear scan\n`self.lookup_function.iter_mut().find(|&(_, ref lookup)| lookup.handle == h)` for every function in\nthe module. Since `patch_function` is called once per function (and once per entry point), this is\nO(functions^2) over a hash map. The code even acknowledges it (`// Note: this search is a bit\nunfortunate`). For modules with many functions this is needless quadratic work.","fix":"Maintain a reverse index `Handle<crate::Function> -> spirv::Word` (or store the `spirv::Word` on the\npatched function ahead of time) so the lookup is O(1) instead of scanning `lookup_function` each call.","locations":[{"ref":"naga/src/front/spv/mod.rs:1679-1690","code":" 1679 |         // Note: this search is a bit unfortunate\n 1680 |         let (fun_id, mut parameters_sampling) = match handle {\n 1681 |             Some(h) => {\n 1682 |                 let (&fun_id, lookup) = self\n 1683 |                     .lookup_function\n 1684 |                     .iter_mut()\n 1685 |                     .find(|&(_, ref lookup)| lookup.handle == h)\n 1686 |                     .unwrap();\n 1687 |                 (fun_id, mem::take(&mut lookup.parameters_sampling))\n 1688 |             }\n 1689 |             None => (0, Vec::new()),\n 1690 |         };","lines":12,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/front/spv/mod.rs#L1679-L1690"}]},{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"In `RenderPassInfo::start`, `validation::validate_color_attachment_bytes_per_sample`\nis invoked inside the per-attachment `for (index, attachment)` loop, and it\nre-iterates the *entire* `color_attachments` slice each time\n(`color_attachments.iter().flatten().map(...)`). The computed total does not\ndepend on `index`, so the identical full-slice validation runs once per color\nattachment (O(n^2) over the attachment count) with no change in result.","fix":"Hoist the `validate_color_attachment_bytes_per_sample` call out of the loop and\nrun it a single time (either before or after the attachment loop) over the full\n`color_attachments` slice.","locations":[{"ref":"wgpu-core/src/command/render.rs:1491-1498","code":" 1491 |             validation::validate_color_attachment_bytes_per_sample(\n 1492 |                 color_attachments\n 1493 |                     .iter()\n 1494 |                     .flatten()\n 1495 |                     .map(|at| at.view.desc.format),\n 1496 |                 device.limits.max_color_attachment_bytes_per_sample,\n 1497 |             )\n 1498 |             .map_err(RenderPassErrorInner::ColorAttachment)?;","lines":8,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-core/src/command/render.rs#L1491-L1498"}]},{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`replace_control_chars` rebuilds the string in place with `String::replace_range` inside a loop.\nEach `replace_range` shifts the entire remaining tail of the string, so on pathological input\nconsisting of many control characters the routine is `O(n^2)`. In practice this runs only on the\nerror-reporting path (formatting shader source that already failed to parse/validate), so it is\nnot hot, but a single-pass builder would avoid the quadratic behavior. Note the replacement\n(`\\u{FFFD}`, 3 bytes) is generally longer than the control byte it replaces, so the tail grows\nand shifts repeatedly.","fix":"Rewrite as a single forward pass that pushes non-matching slices and the `REPLACEMENT_CHAR`\ninto a freshly built `String` (still returning `Cow::Borrowed` when no control char is found),\ninstead of repeatedly calling `replace_range` on the growing buffer.","locations":[{"ref":"naga/src/error.rs:169-188","code":"  169 | pub(crate) fn replace_control_chars(s: &str) -> Cow<'_, str> {\n  170 |     const REPLACEMENT_CHAR: &str = \"\\u{FFFD}\";\n  171 |     debug_assert_eq!(\n  172 |         REPLACEMENT_CHAR.chars().next().unwrap(),\n  173 |         char::REPLACEMENT_CHARACTER\n  174 |     );\n  175 | \n  176 |     let mut res = Cow::Borrowed(s);\n  177 |     let mut offset = 0;\n  178 | \n  179 |     while let Some(found_pos) = res[offset..].find(|c: char| c.is_control() && !c.is_whitespace()) {\n  180 |         offset += found_pos;\n  181 |         let found_len = res[offset..].chars().next().unwrap().len_utf8();\n  182 |         res.to_mut()\n  183 |             .replace_range(offset..offset + found_len, REPLACEMENT_CHAR);\n  184 |         offset += REPLACEMENT_CHAR.len();\n  185 |     }\n  186 | \n  187 |     res\n  188 | }","lines":20,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/error.rs#L169-L188"}]},{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"`Options::mesh_shader_primitive_indices_clamp` is declared and defaulted to\n`true` in the MSL backend (`naga/src/back/msl/mod.rs:321` and `:343`) but is\nnever read anywhere in the MSL backend (confirmed: no other reference exists\nunder `naga/src/back/msl/`). The mesh wrapper writes primitive index values\nstraight through to `set_index(...)` from the user-supplied index array without\nany clamping (`naga/src/back/msl/mesh_shader.rs:405-411`). A caller that sets\nthis option (in either direction) gets no change in behavior, so the safety\nknob is silently a no-op for MSL. (The SPIR-V backend also only stores/copies\nthe flag without reading it, so this appears to be an unimplemented feature\nrather than an MSL-only oversight.)","fix":"Either implement the intended clamping in `write_wrapper_function` (clamp each\nwritten index to be `< vert_count` when `options.mesh_shader_primitive_indices_clamp`\nis set) or remove the unused `mesh_shader_primitive_indices_clamp` field from the\nMSL `Options` so callers are not misled into thinking it has an effect.","locations":[{"ref":"naga/src/back/msl/mod.rs:320-321","code":"  320 |     /// Whether to validate the output of a mesh shader workgroup.\n  321 |     pub mesh_shader_primitive_indices_clamp: bool,","lines":2,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/back/msl/mod.rs#L320-L321"},{"ref":"naga/src/back/msl/mesh_shader.rs:394-412","code":"  394 |                         let num_indices = match info.topology {\n  395 |                             crate::MeshOutputTopology::Points => 1,\n  396 |                             crate::MeshOutputTopology::Lines => 2,\n  397 |                             crate::MeshOutputTopology::Triangles => 3,\n  398 |                         };\n  399 |                         for i in 0..num_indices {\n  400 |                             let component = if num_indices == 1 {\n  401 |                                 \"\".to_string()\n  402 |                             } else {\n  403 |                                 format!(\".{}\", back::COMPONENTS[i])\n  404 |                             };\n  405 |                             writeln!(\n  406 |                                 self.out,\n  407 |                                 \"{indent}{}{}.set_index({prim_index} * {num_indices} + {i}, {in_value}{component});\",\n  408 |                                 back::INDENT,\n  409 |                                 mesh_out_name,\n  410 |                             )?;\n  411 |                         }\n  412 |                     }","lines":19,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/back/msl/mesh_shader.rs#L394-L412"}]},{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"In `write_ray_query_generate_intersection`, the function-local variable `current_t` is\ndeclared twice in a row. The first `OpVariable` is immediately shadowed by the second\n`let current_t = self.id_gen.next();`, so the id produced by the first declaration is never\nloaded from or stored to anywhere in the function. This emits a spurious, unused\n`OpVariable` (of type `f32_ptr_type_id`) into every generated `RayQueryGenerateIntersection`\nhelper, wasting an id and a variable slot. The pseudo-code comment further down only mentions\na single `var current_t:f32;`, confirming the second declaration is the intended one and the\nfirst is an accidental copy-paste duplication.","fix":"Delete the first duplicate block. Before:\n```rust\nlet current_t = self.id_gen.next();\nblock.body.push(Instruction::variable(\n    f32_ptr_type_id,\n    current_t,\n    spirv::StorageClass::Function,\n    None,\n));\n\nlet current_t = self.id_gen.next();\nblock.body.push(Instruction::variable(\n    f32_ptr_type_id,\n    current_t,\n    spirv::StorageClass::Function,\n    None,\n));\n```\nAfter:\n```rust\nlet current_t = self.id_gen.next();\nblock.body.push(Instruction::variable(\n    f32_ptr_type_id,\n    current_t,\n    spirv::StorageClass::Function,\n    None,\n));\n```","locations":[{"ref":"naga/src/back/spv/ray/query.rs:814-828","code":"  814 |         let current_t = self.id_gen.next();\n  815 |         block.body.push(Instruction::variable(\n  816 |             f32_ptr_type_id,\n  817 |             current_t,\n  818 |             spirv::StorageClass::Function,\n  819 |             None,\n  820 |         ));\n  821 | \n  822 |         let current_t = self.id_gen.next();\n  823 |         block.body.push(Instruction::variable(\n  824 |             f32_ptr_type_id,\n  825 |             current_t,\n  826 |             spirv::StorageClass::Function,\n  827 |             None,\n  828 |         ));","lines":15,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/back/spv/ray/query.rs#L814-L828"}]},{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`write_enable_declarations` contains two identical, back-to-back copies of the same\n`ray_tracing_pipeline` detection logic. Lines 395-400 (globals in `IncomingRayPayload`/`RayPayload`)\nand lines 402-412 (entry points in RT stages) are repeated verbatim at lines 414-419 and 421-431.\nThe second copy has no effect (it re-sets `needed.ray_tracing_pipeline = true`) and is pure\nredundant code, presumably an accidental copy-paste during a merge.","fix":"Delete the duplicated second block (lines 414-431), keeping only the first copy at lines 395-412.","locations":[{"ref":"naga/src/back/wgsl/writer.rs:414-431","code":"  414 |         if module.global_variables.iter().any(|gv| {\n  415 |             gv.1.space == crate::AddressSpace::IncomingRayPayload\n  416 |                 || gv.1.space == crate::AddressSpace::RayPayload\n  417 |         }) {\n  418 |             needed.ray_tracing_pipeline = true;\n  419 |         }\n  420 | \n  421 |         if module.entry_points.iter().any(|ep| {\n  422 |             matches!(\n  423 |                 ep.stage,\n  424 |                 ShaderStage::RayGeneration\n  425 |                     | ShaderStage::AnyHit\n  426 |                     | ShaderStage::ClosestHit\n  427 |                     | ShaderStage::Miss\n  428 |             )\n  429 |         }) {\n  430 |             needed.ray_tracing_pipeline = true;\n  431 |         }","lines":18,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/back/wgsl/writer.rs#L414-L431"}]},{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"The reserved-keyword list contains duplicate entries: `\"FP_ILOGB0\"` appears\ntwice and `\"FP_ILOGBNAN\"` appears twice back-to-back. Since `RESERVED` is folded\ninto a `KeywordSet` (a set), the duplicates are harmless, but they are dead and\nlook like a copy-paste slip (only these two `FP_ILOGB*` constants exist in\n`<metal_types>`, so no third intended constant is missing).","fix":"```\n-    \"FP_ILOGB0\",\n-    \"FP_ILOGB0\",\n-    \"FP_ILOGBNAN\",\n-    \"FP_ILOGBNAN\",\n+    \"FP_ILOGB0\",\n+    \"FP_ILOGBNAN\",\n```","locations":[{"ref":"naga/src/back/msl/keywords.rs:271-274","code":"  271 |     \"FP_ILOGB0\",\n  272 |     \"FP_ILOGB0\",\n  273 |     \"FP_ILOGBNAN\",\n  274 |     \"FP_ILOGBNAN\",","lines":4,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/back/msl/keywords.rs#L271-L274"}]},{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`Block::push` carries `#[allow(unused_variables)]`, but both of its parameters\n(`end` and `span`) are actually used in the body (`self.body.push(end)` and\n`self.span_info.push(span)`). The attribute suppresses nothing and is dead\nleftover. (As a minor readability nit, the statement parameter is also\nconfusingly named `end` rather than `stmt`/`statement`.)","fix":"Remove the stale attribute:\n```rust\n// before\n#[allow(unused_variables)]\npub fn push(&mut self, end: Statement, span: Span) {\n\n// after\npub fn push(&mut self, end: Statement, span: Span) {\n```","locations":[{"ref":"naga/src/ir/block.rs:37-41","code":"   37 |     #[allow(unused_variables)]\n   38 |     pub fn push(&mut self, end: Statement, span: Span) {\n   39 |         self.body.push(end);\n   40 |         self.span_info.push(span);\n   41 |     }","lines":5,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/ir/block.rs#L37-L41"}]},{"id":"DEAD_6","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`QuerySet`'s `assert_impl_all!` is preceded by a duplicated `#[cfg(send_sync)]` attribute. It\nis harmless (the second `cfg` is redundant) but is clearly an accidental copy-paste.","fix":"Remove the duplicate attribute:\n```rust\n#[cfg(send_sync)]\n#[cfg(send_sync)]\nstatic_assertions::assert_impl_all!(QuerySet: Send, Sync);\n```\nbecomes\n```rust\n#[cfg(send_sync)]\nstatic_assertions::assert_impl_all!(QuerySet: Send, Sync);\n```","locations":[{"ref":"wgpu/src/api/query_set.rs:31-33","code":"   31 | #[cfg(send_sync)]\n   32 | #[cfg(send_sync)]\n   33 | static_assertions::assert_impl_all!(QuerySet: Send, Sync);","lines":3,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu/src/api/query_set.rs#L31-L33"}]},{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment on `write_is_nan` states the opposite of what the emitted code\ndoes. The comment says it \"Checks whether `expr` does *not* have the bitpattern\nof IEEE f32 `NaN`\", but the generated expression is\n`(write_not_finite(expr) && ((as_type<uint>(expr) & 0x7fffff) != 0))`, i.e. it is\n*true when `expr` IS a NaN* (all exponent bits set plus a non-zero mantissa).\nThe call site confirms the intended meaning: `invalid_nan_infs = ... || is_nan(desc.tmax)`\ntreats a NaN `tmax` as invalid.","fix":"```\n-    /// Checks whether `expr` does not have the bitpattern of IEEE f32 `NaN`.\n+    /// Checks whether `expr` has the bitpattern of IEEE f32 `NaN`.\n```","locations":[{"ref":"naga/src/back/msl/ray.rs:35-43","code":"   35 |     /// Checks whether `expr` does not have the bitpattern of IEEE f32 `NaN`.\n   36 |     ///\n   37 |     /// Note that this evaluates `expr` in the written code multiple times.\n   38 |     fn write_is_nan(&mut self, expr: &str) -> BackendResult {\n   39 |         write!(self.out, \"(\")?;\n   40 |         self.write_not_finite(expr)?;\n   41 |         write!(self.out, \" && ((as_type<uint>({expr}) & 0x7fffff) != 0))\")?;\n   42 |         Ok(())\n   43 |     }","lines":9,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/back/msl/ray.rs#L35-L43"}]},{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"In `RenderPassInfo::finish`, the `else` arm that builds `(depth_ops,\nstencil_ops)` for the `StencilOnly` divergent-discard case has its inline\ncomments copy-pasted from the `DepthOnly` arm and never corrected. The tuple is\n`(depth_ops, stencil_ops)`, so in this arm the first element (`LOAD | STORE`) is\nthe *unchanged depth* and the second (`LOAD_CLEAR | STORE`) is the *cleared\nstencil*, but the comments say the opposite (\"unchanged stencil\" / \"clear\ndepth\"). The code is correct; only the comments mislead.","fix":"Swap the comments to match the actual channel:\n```rust\n(\n    hal::AttachmentOps::LOAD | hal::AttachmentOps::STORE,        // unchanged depth\n    hal::AttachmentOps::LOAD_CLEAR | hal::AttachmentOps::STORE,  // clear stencil\n)\n```","locations":[{"ref":"wgpu-core/src/command/render.rs:1791-1795","code":" 1791 |             } else {\n 1792 |                 (\n 1793 |                     hal::AttachmentOps::LOAD | hal::AttachmentOps::STORE, // unchanged stencil\n 1794 |                     hal::AttachmentOps::LOAD_CLEAR | hal::AttachmentOps::STORE, // clear depth\n 1795 |                 )","lines":5,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-core/src/command/render.rs#L1791-L1795"}]},{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"In `WriteOnly::split_off_last()`, the `SAFETY` comment on the `*self = ...` line is copy-pasted\nverbatim from `split_off_first()` and describes the wrong operation. `split_off_last()` shrinks\n`self` to everything *except the last* element (`slice_from_raw_parts(ptr, new_len)` where\n`new_len = len - 1`) and returns the last element (`ptr.add(new_len)`). The comment claims it\n\"covers exactly everything but the first element\", which is what `split_off_first()` does, not\nthis method. A future reader auditing this `unsafe` block against the comment could be misled about\nthe invariant being upheld.","fix":"Correct the copy-pasted comment. Before:\n```\n// SAFETY: covers exactly everything but the first element\n*self = unsafe { WriteOnly::new(NonNull::slice_from_raw_parts(ptr, new_len)) };\n```\nAfter:\n```\n// SAFETY: covers exactly everything but the last element\n*self = unsafe { WriteOnly::new(NonNull::slice_from_raw_parts(ptr, new_len)) };\n```","locations":[{"ref":"wgpu-types/src/write_only.rs:613","code":"  613 |             // SAFETY: covers exactly everything but the first element","lines":1,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-types/src/write_only.rs#L613"}]},{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"In `GPUDevice::create_bind_group_layout` (`deno_webgpu/device.rs`) the exclusivity check\ncounts five possible entry kinds including `entry.external_texture`, but the error message\nonly lists four of them, omitting `externalTexture`. A user who supplies both a texture and\nan external texture gets a message that doesn't mention the field they set.","fix":"Before:\n```\n\"Only one of 'buffer', 'sampler', 'texture' and 'storageTexture' may be specified\",\n```\nAfter:\n```\n\"Only one of 'buffer', 'sampler', 'texture', 'storageTexture' and 'externalTexture' may be specified\",\n```","locations":[{"ref":"deno_webgpu/device.rs:318-322","code":"  318 |       if n_entries != 1 {\n  319 |         return Err(JsErrorBox::type_error(\n  320 |           \"Only one of 'buffer', 'sampler', 'texture' and 'storageTexture' may be specified\",\n  321 |         ));\n  322 |       }","lines":5,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/deno_webgpu/device.rs#L318-L322"}]},{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The local helper `less_than_two_true` in `write_initialize_function` actually\nbuilds an expression that is true when **at least two** of the input booleans\nare true (it ORs together every pairwise `a && b`), which is the logical\nopposite of what its name claims. It is used correctly (e.g. to detect\n`naga_contains_multiple_opaque`), so the behaviour is fine, but the misleading\nname invites a future maintainer to invert the condition.","fix":"Rename the function to reflect its actual semantics, e.g.:\n\n```rust\n// before\nfn less_than_two_true(mut bools: Vec<&str>) -> Result<String, super::Error> {\n// after\nfn at_least_two_true(mut bools: Vec<&str>) -> Result<String, super::Error> {\n```\n\nand update the two call sites accordingly.","locations":[{"ref":"naga/src/back/hlsl/ray.rs:323-335","code":"  323 |             fn less_than_two_true(mut bools: Vec<&str>) -> Result<String, super::Error> {\n  324 |                 assert!(bools.len() > 1, \"Must have multiple booleans!\");\n  325 |                 let mut final_expr = String::new();\n  326 |                 while let Some(last_bool) = bools.pop() {\n  327 |                     for &bool in &bools {\n  328 |                         if !final_expr.is_empty() {\n  329 |                             final_expr.push_str(\"||\");\n  330 |                         }\n  331 |                         write!(final_expr, \" ({last_bool} && {bool}) \")?;\n  332 |                     }\n  333 |                 }\n  334 |                 Ok(final_expr)\n  335 |             }","lines":13,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/back/hlsl/ray.rs#L323-L335"}]},{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"In `write_image_query`'s `Iq::Size` handling, the comment on the `Id::Cube` shuffle claims it\nduplicates the first component \"for all 3 dimensions\", but the shuffle pattern is `&[0u32, 0]`\n(two components), producing a `vec2` result (cube `textureDimensions` returns `vec2<u32>`). The\n\"3 dimensions\" wording is misleading/incorrect.","fix":"Reword the comment to reflect that a cube's size query yields two components, e.g.:\n```\n// always pick the first component (width == height for a cube)\nId::Cube => &[0u32, 0][..],\n```","locations":[{"ref":"naga/src/back/spv/image.rs:1195-1197","code":" 1195 |                         // always pick the first component, and duplicate it for all 3 dimensions\n 1196 |                         Id::Cube => &[0u32, 0][..],\n 1197 |                         _ => &[0u32, 1, 2, 3][..dim_coords],","lines":3,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/back/spv/image.rs#L1195-L1197"}]},{"id":"CMT_7","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"Several doc/inline comments contain typos. `naga/src/compact/mod.rs:109` has a doubled word\n(`we we want`); `naga/src/compact/mod.rs:501` reads `the inner loop stop` (should be `stops`);\n`naga/src/front/glsl/builtins.rs:90` reads `Don't regeneate variations` (should be\n`regenerate`); `naga/src/front/glsl/context.rs:1117` reads `to the current bodyy` (doubled\n`y`).","fix":"`naga/src/compact/mod.rs:109`: `// Given that we we want to visit` -> `// Given that we want to visit`\n`naga/src/compact/mod.rs:501`: `// the inner loop stop at the latest` -> `// the inner loop stops at the latest`\n`naga/src/front/glsl/builtins.rs:90`: `// Don't regeneate variations` -> `// Don't regenerate variations`\n`naga/src/front/glsl/context.rs:1117`: `// Lower the condition first to the current bodyy` -> `// Lower the condition first to the current body`","locations":[{"ref":"naga/src/compact/mod.rs:109","code":"  109 |     // Given that we we want to visit each thing only once (to keep compaction","lines":1,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/compact/mod.rs#L109"},{"ref":"naga/src/compact/mod.rs:501","code":"  501 |         // expression that the type could possibly refer to, we know that we","lines":1,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9 [{"ref":"naga/src/non_max_u32.rs:46-47","code":"   46 | /// `0..=u32::MAX - 1`, is mapped to the range `1..=u32::MAX`, which is the\n   47 | /// range that /// [`NonZeroU32`] can represent. (And conversely, since","lines":2,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/naga/src/non_max_u32.rs#L46-L47"}]},{"id":"CMT_12","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The trailing comment in `Registry::remove` says `//Returning None is legal if it's an error ID`,\nbut the method returns `T` (from `self.storage.write().remove(id)`), not an `Option<T>`. The\ncomment is stale/misleading: there is no `None` being returned here.","fix":"Update or remove the stale comment. Before:\n```rust\n        //Returning None is legal if it's an error ID\n        value\n```\nAfter (e.g.):\n```rust\n        // `remove` yields the storage's error/placeholder value for an error ID, which is expected.\n        value\n```","locations":[{"ref":"wgpu-core/src/registry.rs:98-106","code":"   98 |     pub(crate) fn remove(&self, id: Id<T::Marker>) -> T {\n   99 |         let value = self.storage.write().remove(id);\n  100 |         // This needs to happen *after* removing it from the storage, to maintain the\n  101 |         // invariant that `self.identity` only contains ids which are actually available\n  102 |         // See https://github.com/gfx-rs/wgpu/issues/5372\n  103 |         self.identity.free(id);\n  104 |         //Returning None is legal if it's an error ID\n  105 |         value\n  106 |     }","lines":9,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-core/src/registry.rs#L98-L106"}]},{"id":"CMT_13","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The doc comment on `Storage::get` claims it \"Panics if there is an epoch mismatch, the entry is empty\nor in error.\" The `Element<T>` enum only has `Vacant` and `Occupied` variants (there is no error\nstate), so the \"or in error\" clause is stale and misleading.","fix":"```\n-    /// Get an owned reference to an item.\n-    /// Panics if there is an epoch mismatch, the entry is empty or in error.\n+    /// Get an owned reference to an item.\n+    /// Panics if there is an epoch mismatch or the entry is empty.\n```","locations":[{"ref":"wgpu-core/src/storage.rs:137-138","code":"  137 |     /// Get an owned reference to an item.\n  138 |     /// Panics if there is an epoch mismatch, the entry is empty or in error.","lines":2,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-core/src/storage.rs#L137-L138"}]},{"id":"CMT_14","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"Copy-paste error in the `set_size` doc comments of `BlasTracker` and `QuerySetTracker`: both say\n\"Must be called with the highest possible Texture ID\", but these trackers hold BLASes and query\nsets, not textures. The correct text (as in `buffer.rs`) should reference the tracked resource's ID.","fix":"In `track/blas.rs`:\n```\n-    /// Must be called with the highest possible Texture ID before\n+    /// Must be called with the highest possible BLAS ID before\n```\nIn `track/query_set.rs`:\n```\n-    /// Must be called with the highest possible Texture ID before\n+    /// Must be called with the highest possible QuerySet ID before\n```","locations":[{"ref":"wgpu-core/src/track/blas.rs:41","code":"   41 |     /// Must be called with the highest possible Texture ID before","lines":1,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241ef523f8fd6091cf9a0/wgpu-core/src/track/blas.rs#L41"},{"ref":"wgpu-core/src/track/query_set.rs:41","code":"   41 |     /// Must be called with the highest possible Texture ID before","lines":1,"link":"https://github.com/gfx-rs/wgpu/blob/ef79a923cfea50f86a4241
