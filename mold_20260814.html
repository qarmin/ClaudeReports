<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

<script type="application/json" id="D">[{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"critical","difficulty":"easy","description":"`InputFile<E>::InputFile()` dereferences the section header table before it has\nvalidated `e_shoff`. `sh_begin` is computed as `mf->data + ehdr.e_shoff` with no\ncheck that `e_shoff` is within the file, and when `e_shnum == 0` the code\nimmediately reads `sh_begin->sh_size` and `sh_begin->sh_link`. A malformed\nobject with `e_shoff` set to a huge value therefore reads far outside the mmap\nand crashes with `SIGSEGV`/`SIGBUS` before the range check on line 97 ever runs.\n\nThe range check itself is also unsound: `num_sections` is taken from a 64-bit\n`sh_size`, so `sh_begin + num_sections` can overflow the pointer and wrap\naround, making `mf->data + mf->size < (u8 *)(sh_begin + num_sections)` compare\nfalse for a bogus value.","fix":"Validate before dereferencing:\n```c++\nif (ehdr.e_shoff < 0 || ehdr.e_shoff > mf->size - sizeof(ElfShdr<E>))\n  Fatal(ctx) << *this << \": e_shoff is out of range\";\nElfShdr<E> *sh_begin = (ElfShdr<E> *)(mf->data + ehdr.e_shoff);\ni64 num_sections = (ehdr.e_shnum == 0) ? (i64)sh_begin->sh_size : (i64)ehdr.e_shnum;\nif (num_sections < 0 ||\n    num_sections > (mf->size - ehdr.e_shoff) / (i64)sizeof(ElfShdr<E>))\n  Fatal(ctx) << *this << \": e_shoff or e_shnum corrupted\";\n```\ni.e. compare *counts*, not derived pointers, so no pointer overflow is possible.","locations":[{"ref":"src/input-files.cc:86-107","code":"   86 |   ElfEhdr<E> &ehdr = *(ElfEhdr<E> *)mf->data;\n   87 |   is_dso = (ehdr.e_type == ET_DYN);\n   88 | \n   89 |   ElfShdr<E> *sh_begin = (ElfShdr<E> *)(mf->data + ehdr.e_shoff);\n   90 | \n   91 |   // e_shnum contains the total number of sections in an object file.\n   92 |   // Since it is a 16-bit integer field, it's not large enough to\n   93 |   // represent >65535 sections. If an object file contains more than 65535\n   94 |   // sections, the actual number is stored to sh_size field.\n   95 |   i64 num_sections = (ehdr.e_shnum == 0) ? sh_begin->sh_size : ehdr.e_shnum;\n   96 | \n   97 |   if (mf->data + mf->size < (u8 *)(sh_begin + num_sections))\n   98 |     Fatal(ctx) << mf->name << \": e_shoff or e_shnum corrupted: \"\n   99 |                << mf->size << \" \" << num_sections;\n  100 |   elf_sections = {sh_begin, sh_begin + num_sections};\n  101 | \n  102 |   // e_shstrndx is a 16-bit field. If .shstrtab's section index is\n  103 |   // too large, the actual number is stored to sh_link field.\n  104 |   i64 shstrtab_idx = (ehdr.e_shstrndx == SHN_XINDEX)\n  105 |     ? sh_begin->sh_link : ehdr.e_shstrndx;\n  106 | \n  107 |   shstrtab = this->get_string(ctx, shstrtab_idx);","lines":22,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/input-files.cc#L86-L107"}]},{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`ArHdr::read_name` trusts every value it reads from the archive:\n\n- SysV long names: `strtab.data() + atoi(ar_name + 1)` is not checked against\n  `strtab.size()`, and `strstr(start, \"/\\n\")` scans until it finds the terminator, walking\n  off the end of the mapping if the string table has no terminator. If `strstr` returns\n  `nullptr`, `return {start, (const char *)strstr(...)}` constructs a `std::string` from a\n  `(first, last)` pair whose `last` is null - undefined behaviour, in practice a crash or a\n  huge allocation.\n- BSD long names: `int namelen = atoi(ar_name + 3)` may be negative or larger than the\n  remaining file; `std::string name{(char *)ptr, (size_t)namelen}` then copies `namelen`\n  bytes (a negative value becomes ~2^64 after the `size_t` cast) and `ptr += namelen` moves\n  the cursor out of the file.\n\nAll of these are reachable from a malformed `.a` file, which mold happily reads from the\ncommand line or from `-l` search paths.","fix":"Pass the enclosing `MappedFile` bounds into `read_name` and validate: reject\n`namelen < 0 || namelen > remaining`, reject a SysV offset `>= strtab.size()`, and use\n`strtab.find(\"/\\n\", off)` (which is bounds-safe) instead of `strstr`, `Fatal`ing when the\nterminator is absent.","locations":[{"ref":"src/archive-file.cc:52-74","code":"   52 |   std::string read_name(std::string_view strtab, u8 *&ptr) const {\n   53 |     // BSD-style long filename\n   54 |     if (starts_with(\"#1/\")) {\n   55 |       int namelen = atoi(ar_name + 3);\n   56 |       std::string name{(char *)ptr, (size_t)namelen};\n   57 |       ptr += namelen;\n   58 | \n   59 |       if (size_t pos = name.find('\\0'))\n   60 |         name = name.substr(0, pos);\n   61 |       return name;\n   62 |     }\n   63 | \n   64 |     // SysV-style long filename\n   65 |     if (starts_with(\"/\")) {\n   66 |       const char *start = strtab.data() + atoi(ar_name + 1);\n   67 |       return {start, (const char *)strstr(start, \"/\\n\")};\n   68 |     }\n   69 | \n   70 |     // Short fileanme\n   71 |     if (const char *end = (char *)memchr(ar_name, '/', sizeof(ar_name)))\n   72 |       return {ar_name, end};\n   73 |     return {ar_name, sizeof(ar_name)};\n   74 |   }","lines":23,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/archive-file.cc#L52-L74"}]},{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`read_thin_archive_members` only advances `data` at the very end of the loop body\n(`data = body;`). The `continue` that skips a member named `__.SYMDEF` /\n`__.SYMDEF SORTED` jumps back to the top of the loop with `data` unchanged, so the same\nheader is parsed forever: mold hangs (100% CPU, no output) on a thin archive whose first\nlong-named member is a BSD symbol table. This is reachable with a crafted or simply\nBSD-produced thin archive, since the branch is only taken for names stored as long names\n(`#1/...`), which is exactly how `__.SYMDEF` is stored.","fix":"Advance the cursor before the `continue`:\n```\n     std::string name = hdr.read_name(strtab, body);\n+    data = body;\n\n     // Skip if symbol table\n     if (name == \"__.SYMDEF\" || name == \"__.SYMDEF SORTED\")\n       continue;\n```\nand delete the trailing `data = body;`.","locations":[{"ref":"src/archive-file.cc:108-122","code":"  108 |     if (!hdr.starts_with(\"#1/\") && !hdr.starts_with(\"/\"))\n  109 |       Fatal(ctx) << mf->name << \": filename is not stored as a long filename\";\n  110 | \n  111 |     std::string name = hdr.read_name(strtab, body);\n  112 | \n  113 |     // Skip if symbol table\n  114 |     if (name == \"__.SYMDEF\" || name == \"__.SYMDEF SORTED\")\n  115 |       continue;\n  116 | \n  117 |     std::string path = name.starts_with('/') ?\n  118 |       name : (path_dirname(mf->name) / name).string();\n  119 |     vec.push_back(must_open_file(ctx, path));\n  120 |     vec.back()->thin_parent = mf;\n  121 |     data = body;\n  122 |   }","lines":15,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/archive-file.cc#L108-L122"}]},{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"Neither archive reader validates that a member header or a member body actually fits in the\nmapped file. The fat loop only requires two bytes to remain\n(`while (begin + mf->size - data >= 2)`) before it reinterprets `data` as a 60-byte `ArHdr`,\nand `size` comes straight from `atol(hdr.ar_size)` with no upper bound, so\n`data = body + size` can point far past the mapping (or wrap the pointer, which is UB). The\nresulting `mf->slice(ctx, name, body - begin, data - body)` produces a `MappedFile` whose\n`data`/`size` describe memory outside the mmap (`MappedFile::slice` in `src/mold.h:190-199`\nperforms no bounds check), and every later read of that \"member\" is an out-of-bounds access -\na SIGSEGV/SIGBUS on a malformed or hostile `.a` file. The thin reader has the same problem\n(`while (data < begin + mf->size)` followed by an unchecked 60-byte header read).","fix":"Before dereferencing the header, require `begin + mf->size - data >= (i64)sizeof(ArHdr)` and\n`Fatal` otherwise. After computing `size`, verify `size >= 0 && size <= begin + mf->size - body`\n(and that `hdr.ar_fmag` equals \"`\\n\") before using it; `Fatal(ctx) << mf->name << \": corrupted archive\"`\non failure. Also bounds-check the string-table slice `{(char *)body, (size_t)size}`.","locations":[{"ref":"src/archive-file.cc:134-141","code":"  134 |   while (begin + mf->size - data >= 2) {\n  135 |     if ((begin - data) % 2)\n  136 |       data++;\n  137 | \n  138 |     ArHdr &hdr = *(ArHdr *)data;\n  139 |     u8 *body = data + sizeof(hdr);\n  140 |     u64 size = atol(hdr.ar_size);\n  141 |     data = body + size;","lines":8,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/archive-file.cc#L134-L141"},{"ref":"src/archive-file.cc:154-161","code":"  154 |     std::string name = hdr.read_name(strtab, body);\n  155 | \n  156 |     // Skip if symbol table\n  157 |     if (name == \"__.SYMDEF\" || name == \"__.SYMDEF SORTED\")\n  158 |       continue;\n  159 | \n  160 |     vec.push_back(mf->slice(ctx, name, body - begin, data - body));\n  161 |   }","lines":8,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/archive-file.cc#L154-L161"},{"ref":"src/archive-file.cc:86-99","code":"   86 |   while (data < begin + mf->size) {\n   87 |     // Each header is aligned to a 2 byte boundary.\n   88 |     if ((begin - data) % 2)\n   89 |       data++;\n   90 | \n   91 |     ArHdr &hdr = *(ArHdr *)data;\n   92 |     u8 *body = data + sizeof(hdr);\n   93 |     u64 size = atol(hdr.ar_size);\n   94 | \n   95 |     // Read a string table.\n   96 |     if (hdr.is_strtab()) {\n   97 |       strtab = {(char *)body, (size_t)size};\n   98 |       data = body + size;\n   99 |       continue;","lines":14,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/archive-file.cc#L86-L99"}]},{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`parse_defsym_value` returns a default-constructed `std::variant<Symbol<E> *, u64>` when the\nvalue fails to parse (e.g. `--defsym=foo=0x12z`). The variant's first alternative is\n`Symbol<E> *`, so the \"error\" value is a **null symbol pointer**, not an error. That null is\nstored in `ctx.arg.defsyms`, copied into `ctx.arg.undefined` by the loop at lines 1719-1723,\nand finally dereferenced by `sym->gc_root = true` - mold segfaults instead of printing a\ndiagnostic. The syntax error is silently swallowed on the way.","fix":"Report the error instead of returning a null symbol:\n```\n-    if (s.size() != nread)\n-      return {};\n+    if (s.size() != nread)\n+      Fatal(ctx) << \"--defsym: not a valid value: \" << s;\n```\nAlternatively return `std::optional<...>` and `Fatal` at the call site, and defensively skip\nnull pointers in the `ctx.arg.undefined` loops.","locations":[{"ref":"src/cmdline.cc:590-604","code":"  590 | template <typename E>\n  591 | static std::variant<Symbol<E> *, u64>\n  592 | parse_defsym_value(Context<E> &ctx, std::string_view s) {\n  593 |   if (s.starts_with(\"0x\") || s.starts_with(\"0X\")) {\n  594 |     size_t nread;\n  595 |     u64 addr = std::stoull(std::string(s), &nread, 16);\n  596 |     if (s.size() != nread)\n  597 |       return {};\n  598 |     return addr;\n  599 |   }\n  600 | \n  601 |   if (s.find_first_not_of(\"0123456789\") == s.npos)\n  602 |     return (u64)std::stoull(std::string(s), nullptr, 10);\n  603 |   return get_symbol(ctx, s);\n  604 | }","lines":15,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/cmdline.cc#L590-L604"},{"ref":"src/cmdline.cc:1719-1723","code":" 1719 |   for (i64 i = 0; i < ctx.arg.defsyms.size(); i++) {\n 1720 |     std::variant<Symbol<E> *, u64 ));\n  121 |   }\n  122 | }","lines":8,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/input-files.cc#L115-L122"}]},{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`ObjectFile<E>::parse_note_gnu_property()` walks a `.note.gnu.property` section\nwith no bounds checking at all:\n\n- `*(ElfNhdr<E> *)data.data()` is read while `data` may hold fewer than\n  `sizeof(ElfNhdr<E>)` bytes (out-of-bounds read).\n- `data.substr(sizeof(hdr))`, `data.substr(align_to(hdr.n_namesz, 4))` and\n  `data.substr(align_to(hdr.n_descsz, sizeof(Word<E>)))` throw\n  `std::out_of_range` whenever the (attacker-controlled) 32-bit size fields\n  exceed the remaining data. mold has no top-level `catch`, so this is\n  `std::terminate()`.\n- `n_namesz == 0` makes `hdr.n_namesz - 1` underflow to `0xffffffff`.\n- The inner loop reads 8 bytes (`type` and `size`) whenever `desc` is merely\n  non-empty, so a 1-byte descriptor reads 7 bytes past the end, and\n  `desc.substr(8)` throws.","fix":"Check the remaining size before each read and each `substr`, e.g.\n```c++\nwhile (data.size() >= sizeof(ElfNhdr<E>)) {\n  ElfNhdr<E> &hdr = *(ElfNhdr<E> *)data.data();\n  i64 namesz = align_to(hdr.n_namesz, 4);\n  i64 descsz = align_to(hdr.n_descsz, sizeof(Word<E>));\n  if (namesz > data.size() - sizeof(hdr) ||\n      descsz > data.size() - sizeof(hdr) - namesz)\n    Fatal(ctx) << *this << \": corrupted .note.gnu.property\";\n  ...\n}\n```\nand require `desc.size() >= 8` (and `desc.size() - 8 >= align_to(size, ...)`)\nin the inner loop.","locations":[{"ref":"src/input-files.cc:146-182","code":"  146 | template <typename E>\n  147 | void\n  148 | ObjectFile<E>::parse_note_gnu_property(Context<E> &ctx, const ElfShdr<E> &shdr) {\n  149 |   std::string_view data = this->get_string(ctx, shdr);\n  150 | \n  151 |   while (!data.empty()) {\n  152 |     ElfNhdr<E> &hdr = *(ElfNhdr<E> *)data.data();\n  153 |     data = data.substr(sizeof(hdr));\n  154 | \n  155 |     std::string_view name = data.substr(0, hdr.n_namesz - 1);\n  156 |     data = data.substr(align_to(hdr.n_namesz, 4));\n  157 | \n  158 |     std::string_view desc = data.substr(0, hdr.n_descsz);\n  159 |     data = data.substr(align_to(hdr.n_descsz, sizeof(Word<E>)));\n  160 | \n  161 |     if (hdr.n_type != NT_GNU_PROPERTY_TYPE_0 || name != \"GNU\")\n  162 |       continue;\n  163 | \n  164 |     while (!desc.empty()) {\n  165 |       u32 type = *(U32<E> *)desc.data();\n  166 |       u32 size = *(U32<E> *)(desc.data() + 4);\n  167 |       desc = desc.substr(8);\n  168 | \n  169 |       // The majority of currently defined .note.gnu.property\n  170 |       // use 32-bit values.\n  171 |       // We don't know how to handle anything else, so if we encounter\n  172 |       // one, skip it.\n  173 |       //\n  174 |       // The following properties have a different size:\n  175 |       // - GNU_PROPERTY_STACK_SIZE\n  176 |       // - GNU_PROPERTY_NO_COPY_ON_PROTECTED\n  177 |       if (size == 4)\n  178 |         gnu_properties[type] |= *(U32<E> *)desc.data();\n  179 |       desc = desc.substr(align_to(size, sizeof(Word<E>)));\n  180 |     }\n  181 |   }\n  182 | }","lines":37,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/input-files.cc#L146-L182"}]},{"id":"PANIC_14","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`read_riscv_attributes()` mis-parses truncated/hostile `.riscv.attributes`:\n\n- `i64 sz = *(U32<E> *)data.data();` reads 4 bytes although `data` may hold only\n  1-3 bytes (out-of-bounds read).\n- `sz` is only checked against an upper bound. If `sz < 4`, `sz - 4` underflows\n  when converted to `size_t` and `std::string_view p(data.data() + 4, sz - 4)`\n  creates a view of ~2^64 bytes, after which every read runs off the mapping.\n- If `sz == 0`, `data = data.substr(0)` leaves `data` unchanged and the outer\n  `while (!data.empt e.addend = rel.r_addend;\n  827 |       fde.fre = data.substr(off, sframe_fre_block_size<E>(data, off));\n  828 |       fde.func_size = ent.func_size;\n  829 |       fde.num_fres = *(U16<E> *)(data.data() + off);\n  830 |       sframe_fdes.push_back(fde);\n  831 |     }","lines":56,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/input-files.cc#L776-L831"}]},{"id":"PANIC_20","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`ObjectFile<E>::parse_symbols()` copies `symtab_sec->sh_info` straight into\n`first_global` with no validation. `sh_info` is an untrusted 32-bit field, so\n`first_global` can exceed `elf_syms.size()`.\n\nConsequences: `register_global_symbols()` computes\n`num_globals = elf_syms.size() - first_global`, which underflows to a negative\n`i64`, and `has_symver.resize(num_globals)` is then called with a value that\nconverts to a gigantic `size_t` (`std::length_error`/OOM). `get_local_syms()`\ndoes `subspan(0, first_global)` on a shorter span, which is undefined behaviour,\nand every `for (i64 i = 0; i < first_global; i++) symbols[i]` loop\n(`get_source_name()`, `compute_symtab_size()`, `populate_symtab()`) reads out of\nbounds.","fix":"Clamp/validate right after reading it:\n```c++\nthis->first_global = symtab_sec->sh_info;\nthis->elf_syms = this->template get_data<ElfSym<E>>(ctx, *symtab_sec);\nif (this->first_global < 0 || this->first_global > this->elf_syms.size())\n  Fatal(ctx) << *this << \": invalid sh_info in the symbol table\";\n```","locations":[{"ref":"src/input-files.cc:1112-1125","code":" 1112 | void ObjectFile<E>::parse_symbols(Context<E> &ctx) {\n 1113 |   symtab_sec = this->find_section(SHT_SYMTAB);\n 1114 | \n 1115 |   if (symtab_sec) {\n 1116 |     // In ELF, all local symbols precede global symbols in the symbol table.\n 1117 |     // sh_info has an index of the first global symbol.\n 1118 |     this->first_global = symtab_sec->sh_info;\n 1119 |     this->elf_syms = this->template get_data<ElfSym<E>>(ctx, *symtab_sec);\n 1120 |     this->symbol_strtab = this->get_string(ctx, symtab_sec->sh_link);\n 1121 |     this->populate_symbol_name_lengths();\n 1122 | \n 1123 |     if (ElfShdr<E> *shdr = this->find_section(SHT_SYMTAB_SHNDX))\n 1124 |       symtab_shndx_sec = this->template get_data<U32<E>>(ctx, *shdr);\n 1125 |   }","lines":14,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/input-files.cc#L1112-L1125"},{"ref":"src/input-files.cc:843-847","code":"  843 |   this->symbols.resize(this->elf_syms.size());\n  844 | \n  845 |   i64 num_globals = this->elf_syms.size() - this->first_global;\n  846 |   has_symver.resize(num_globals);\n  847 | ","lines":5,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/input-files.cc#L843-L847"}]},{"id":"PANIC_21","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`parse_sections()` marks COMDAT group members as discarded by writing\n`comdat_discarded[i] = true` where `i` comes from `ref.members(*this)`, i.e. the\nraw `u32` payload of the `SHT_GROUP` section in the input object. Those values\nare section indices supplied by the file and are never validated against\n`sections.size()`. `std::vector<bool>::operator[]` performs no bounds check, so a\nmalformed group with an entry like `0xffffffff` corrupts memory (an\nout-of-bounds *write*, not just a read).\n\nThe same unvalidated indices are used again in `passes.cc` as `file->sections[i]`.","fix":"Validate group members when the group is read (in `read_section_metadata()`), or\nguard the loop:\n```c++\nfor (u32 i : ref.members(*this)) {\n  if (i >= comdat_discarded.size())\n    Fatal(ctx) << *this << \": invalid section index in SHT_GROUP\";\n  comdat_discarded[i] = true;\n}\n```","locations":[{"ref":"src/input-files.cc:1136-1146","code":" 1136 |   assert(!sections_parsed);\n 1137 |   sections.resize(this->elf_sections.size( ":"easy","description":"`SharedFile<E>::get_alignment()` indexes `this->elf_sections[sym->esym().st_shndx]`\nwith a completely unvalidated `st_shndx`. Besides ordinary out-of-range values,\n`st_shndx` can legitimately be a reserved index such as `SHN_ABS` (`0xfff1`),\nwhich is not a section index at all. Since this runs for every copy relocation,\na DSO exporting an absolute symbol that gets a copy relocation makes mold read\n~64 KiB past the section header table.\n\n`SharedFile<E>::is_readonly()` has the same problem for the program headers: it\nbuilds a span from `e_phoff`/`e_phnum` without checking either against the file\nsize.","fix":"In `get_alignment()`, return 1 when `st_shndx >= elf_sections.size()` (which\ncovers `SHN_ABS`/`SHN_COMMON`); in `is_readonly()`, verify\n`e_phoff + e_phnum * sizeof(ElfPhdr<E>) <= mf->size` before constructing the\nspan (or return `false` otherwise).","locations":[{"ref":"src/input-files.cc:1827-1834","code":" 1827 | template <typename E>\n 1828 | i64 SharedFile<E>::get_alignment(Symbol<E> *sym) {\n 1829 |   ElfShdr<E> &shdr = this->elf_sections[sym->esym().st_shndx];\n 1830 |   i64 align = std::max<i64>(1, shdr.sh_addralign);\n 1831 |   if (sym->value)\n 1832 |     align = std::min<i64>(align, 1LL << std::countr_zero(sym->value));\n 1833 |   return align;\n 1834 | }","lines":8,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/input-files.cc#L1827-L1834"},{"ref":"src/input-files.cc:1836-1849","code":" 1836 | template <typename E>\n 1837 | bool SharedFile<E>::is_readonly(Symbol<E> *sym) {\n 1838 |   ElfEhdr<E> &ehdr = *(ElfEhdr<E> *)this->mf->data;\n 1839 |   std::span<ElfPhdr<E>> phdrs((ElfPhdr<E> *)(this->mf->data + ehdr.e_phoff),\n 1840 |                               ehdr.e_phnum);\n 1841 |   u64 val = sym->esym().st_value;\n 1842 | \n 1843 |   for (ElfPhdr<E> &phdr : phdrs)\n 1844 |     if ((phdr.p_type == PT_LOAD || phdr.p_type == PT_GNU_RELRO) &&\n 1845 |         !(phdr.p_flags & PF_W) d6f6634f925f6d54e5c/src/passes.cc#L3350-L3353"}]},{"id":"PANIC_57","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`create_comdat_group_sections()` assumes that every member of a surviving\nCOMDAT group has a live `InputSection` with a non-null `output_section`:\n\n```\nInputSection<E> &isec = *file.sections[j];\nmembers.push_back(isec.output_section);\n```\n\nNeither `file.sections[j]` (null for section kinds mold never materializes)\nnor `isec.output_section` (null for any section that was killed before\n`create_output_sections()` ran) is checked. `parse_eh_frame_sections()` and\n`parse_sframe_sections()` run before `combine_objects()` and set\n`isec->is_alive = false` for `.eh_frame`/`.sframe` input sections, and\n`create_output_sections()` skips dead sections, so a COMDAT group that\ncontains an `.eh_frame` member (produced by compilers that emit per-function\ncomdat unwind data) makes `members` contain a null `Chunk *`, which\n`ComdatGroupSection::copy_buf()` then dereferences via `chunk->shndx`. The\n`*file.sections[shdr.sh_info]` deref for RELA members has the same problem.","fix":"Skip members whose `file.sections[j]` is null or whose `output_section` is null (and adjust `sh_size`, which is computed from `members.size()` in the `ComdatGroupSection` constructor), or `Fatal()` with a clear message naming the offending section instead of dereferencing null.","locations":[{"ref":"src/relocatable.cc:78-98","code":"   78 |     for (ComdatGroupRef<E> &ref : file.comdat_groups) {\n   79 |       if (!ref.is_owner)\n   80 |         continue;\n   81 | \n   82 |       Symbol<E> *sym = file.symbols[file.elf_sections[ref.sect_idx].sh_info];\n   83 |       assert(sym);\n   84 | \n   85 |       std::vector<Chunk<E> *> members;\n   86 |       for (u32 j : ref.members(file)) {\n   87 |         const ElfShdr<E> &shdr = file.elf_sections[j];\n   88 |         if (shdr.sh_type == (E::is_rela ? SHT_RELA : SHT_REL)) {\n   89 |           Inp
