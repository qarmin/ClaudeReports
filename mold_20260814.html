re","type_label":"Architecture","severity":"medium","difficulty":"hard","description":"`src/mold.h` is a single 4043-line header that holds the entire program's type\nuniverse. Every one of the ~12 per-target translation units (`arch-x86-64.cc`,\n`arch-arm64.cc`, ... plus `passes.cc`, `output-chunks.cc`, `input-files.cc`,\n`icf.cc`, `gdb-index.cc`, ...) includes all of it, so touching any comment in\nany part forces a full rebuild of the whole linker, and every TU pays for\n`<windows.h>`, `<iostream>`, TBB's concurrent containers and `<variant>`.\n\nThe file contains at least eight unrelated responsibility clusters:\n\n* Diagnostics: `SyncStream`, `Out`, `Fatal`, `Error`, `Warn` (79-162).\n* Process/OS glue: signal-handler globals, `MappedFile`, `open_file`,\n  `acquire_global_lock` (164-274).\n* Input-section model: `SectionFragment`, `CieRecord`, `FdeRecord`,\n  `SFrameFde`, `InputSection` (276-629).\n* The output-chunk zoo: `Chunk` plus ~35 subclasses, one per output section\n  (688-1642).\n* Output-file writers: `OutputFile`, `MallocOutputFile`, `LockingOutputFile`\n  (1644-1742).\n* Input-file model: `MergeableSection`, `InputSectionTable`, `NameLen`,\n  `InputFile`, `ObjectFile`, `SharedFile` (1752-2106).\n* Command line + global state: `BuildId`, the option enums, `SectionOrder`,\n  and the 280-line `Context` struct (2488-2905).\n* Symbol model and ~50 inline implementations (2926-4043).\n\n`Context<E>` itself is a second, nested architecture problem: it mixes\ncommand-line option storage, five memory pools, pointers to every synthetic\noutput section, ~28 linker-synthesized symbol pointers, `--gdb-index` scratch\nspans and the global error flag, which is why it must be forward-declared and\nwhy nearly every function in the project takes `Context<E> &`.","fix":"Split into headers along the existing `//` section-comment boundaries, which\nalready mark the intended module structure:\n\n* `src/diagnostics.h` (79-162, matches `error.cc`)\n* `src/mapped-file.h` (1 f6d54e5c/src/output-chunks.cc#L3539-L3588"}]},{"id":"OTHER_1","type":"other","type_label":"Other","severity":"medium","difficulty":"easy","description":"`ElfSym<E>` encodes `st_info` and `st_other` as bitfields whose layout is\nselected by `#ifdef __LITTLE_ENDIAN__` - i.e. by the *host* byte order - because\nC++ leaves bitfield allocation order implementation-defined. This is a\nreasonable bet for GCC/Clang on mainstream ABIs, but nothing in the file\nverifies it: there is not a single `static_assert` on `sizeof(ElfSym<E>)`,\n`sizeof(ElfShdr<E>)`, `sizeof(ElfEhdr<E>)`, `sizeof(ElfRel<E>)` or on the value\nextracted from a known `st_info`/`st_other` byte. A compiler that packs\nbitfields differently, or that inserts padding around the anonymous unions,\nwould produce a linker that silently reads every symbol's type, binding,\nvisibility, `ppc64_local_entry` and `riscv_variant_cc` from the wrong bits.","fix":"Add compile-time checks next to the definitions, e.g.\n```cpp\nstatic_assert(sizeof(ElfSym<X86_64>) == 24);\nstatic_assert(sizeof(ElfSym<I386>) == 16);\nstatic_assert(sizeof(ElfShdr<X86_64>) == 64);\nstatic_assert(sizeof(ElfEhdr<X86_64>) == 64);\nstatic_assert(sizeof(ElfRel<X86_64>) == 24);\n```\nplus a `constexpr` round-trip check that writing `st_type = 2, st_bind = 1`\nproduces the byte `0x12`.","locations":[{"ref":"src/elf.h:1555-1640","code":" 1555 | template <typename E> requires E::is_64\n 1556 | struct ElfSym<E> {\n 1557 |   bool is_undef() const { return st_shndx == SHN_UNDEF; }\n 1558 |   bool is_abs() const { return st_shndx == SHN_ABS; }\n 1559 |   bool is_common() const { return st_shndx == SHN_COMMON; }\n 1560 |   bool is_weak() const { return st_bind == STB_WEAK; }\n 1561 |   bool is_undef_weak() const { return is_undef() && is_weak(); }\n 1562 | \n 1563 |   bool ppc64_preserves_r2() const { return ppc64_local_entry != 1; }\n 1564 |   bool ppc64_uses_toc() const { return ppc64_local_entry > 1; }\n 1565 | \n 1566 |   U32<E> st_name;\n 1567 | \n 1568 | #ifdef __LITTLE_ENDIAN__\n 1569 |   u8 st_type : 4;\n 1570 |   u8 st_bind : 4;\n 1571 |   union {\n 1572 |     u8 st_visibility : 2;\n 1573 |     struct {\n 1574 |       u8 : 7;\n 1575 |       u8 arm64_variant_pcs : 1;\n 1576 |     };\n 1577 |     struct {\n 1578 |       u8 : 7;\n 1579 |       u8 riscv_variant_cc : 1;\n 1580 |     };\n 1581 |     struct {\n 1582 |       u8 : 5;\n 1583 |       u8 ppc64_local_entry : 3;\n 1584 |     };\n 1585 |   };\n 1586 | #else\n 1587 |   u8 st_bind : 4;\n 1588 |   u8 st_type : 4;\n 1589 |   union {\n 1590 |     struct {\n 1591 |       u8 : 6;\n 1592 |       u8 st_visibility : 2;\n 1593 |     };\n 1594 |     u8 arm64_variant_pcs : 1;\n 1595 |     u8 riscv_variant_cc : 1;\n 1596 |     u8 ppc64_local_entry : 3;\n 1597 |   };\n 1598 | #endif\n 1599 | \n 1600 |   U16<E> st_shndx;\n 1601 |   U64<E> st_value;\n 1602 |   U64<E> st_size;\n 1603 | };\n 1604 | \n 1605 | template <typename E> requires (!E::is_64)\n 1606 | struct ElfSym<E> {\n 1607 |   bool is_undef() const { return st_shndx == SHN_UNDEF; }\n 1608 |   bool is_abs() const { return st_shndx == SHN_ABS; }\n 1609 |   bool is_common() const { return st_shndx == SHN_COMMON; }\n 1610 |   bool is_weak() const { return st_bind == STB_WEAK; }\n 1611 |   bool is_undef_weak() const { return is_undef() && is_weak(); }\n 1612 | \n 1613 |   U32<E> st_name;\n 1614 |   U32<E> st_value;\n 1615 |   U32<E> st_size;\n 1616 | \n 1617 | #ifdef __LITTLE_ENDIAN__\n 1618 |   u8 st_type : 4;\n 1619 |   u8 st_bind : 4;\n 1620 |   union {\n 1621 |     u8 st_visibility : 2;\n 1622 |     struct {\n 1623 |       u8 : 7;\n 1624 |       u8 riscv_variant_cc : 1;\n 1625 |     };\n 1626 |   };\n 1627 | #else\n 1628 |   u8 st_bind : 4;\n 1629 |   u8 st_type : 4;\n 1630 |   union {\n 1631 |     struct {\n 1632 |       u8 : 6;\n 1633 |       u8 st_visibility : 2;\n 1634 |     };\n 1635 |     u8 riscv_variant_cc : 1;\n 1636 |   };\n 1637 | #endif\n 1638 | \n 1639 |   U16<E> st_shndx;\n 1640 | };","lines":86,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/elf.h#L1555-L1640"},{"ref":"src/elf.h:1642-1672","code":" 1642 | template <typename E>\n 1643 | struct ElfShdr {\n 1644 |   U32<E> sh_name;\n 1645 |   U32<E> sh_type;\n 1646 |   Word<E> sh_flags;\n 1647 |   Word<E> sh_addr;\n 1648 |   Word<E> sh_offset;\n 1649 |   Word<E> sh_size;\n 1650 |   U32<E> sh_link;\n 1651 |   U32<E> sh_info;\n 1652 |   Word<E> sh_addralign;\n 1653 |   Word<E> sh_entsize;\n 1654 | };\n 1655 | \n 1656 | template <typename E>\n 1657 | struct ElfEhdr {\n 1658 |   u8 e_ident[16];\n 1659 |   U16<E> e_type;\n 1660 |   U16<E> e_machine;\n 1661 |   U32<E> e_version;\n 1662 |   Word<E> e_entry;\n 1663 |   Word<E> e_phoff;\n 1664 |   Word<E> e_shoff;\n 1665 |   U32<E> e_flags;\n 1666 |   U16<E> e_ehsize;\n 1667 |   U16<E> e_phentsize;\n 1668 |   U16<E> e_phnum;\n 1669 |   U16<E> e_shentsize;\n 1670 |   U16<E> e_shnum;\n 1671 |   U16<E> e_shstrndx;\n 1672 | };","lines":31,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/elf.h#L1642-L1672"}]},{"id":"OTHER_2","type":"other","type_label":"Other","severity":"medium","difficulty":"easy","description":"The fallback lock path `/tmp/mold-lock-<username>` is a predictable name in a\nworld-writable, non-sticky-safe location and is opened with\n`O_WRONLY | O_CREAT` without `O_NOFOLLOW` and without checking ownership. Any\nlocal user can pre-create that path (or a symlink pointing at a file the victim\nowns) and then hold `lockf()` on it forever, permanently stalling every\n`MOLD_JOBS=1` link of the target user - a trivial local denial of service. The\nsymlink is also followed, so an unrelated file gets opened for writing.","fix":"Open with `O_NOFOLLOW | O_CLOEXEC`, then `fstat()` the descriptor and refuse the\nlock unless `st_uid == getuid()` and `S_ISREG(st_mode)`. Prefer\n`XDG_RUNTIME_DIR`/`TMPDIR` and fall back to a per-uid directory created with\nmode `0700`.","locations":[{"ref":"src/jobs-unix.cc:30-42","code":"   30 |   std::string path;\n   31 |   if (char *dir = getenv(\"XDG_RUNTIME_DIR\"))\n   32 |     path = dir + \"/mold-lock\"s;\n   33 |   else\n   34 |     path = \"/tmp/mold-lock-\"s + getpwuid(getuid())->pw_name;\n   35 | \n   36 |   int fd = open(path.c_str(), O_WRONLY | O_CREAT | O_CLOEXEC, 0600);\n   37 |   if (fd == -1)\n   38 |     return;\n   39 | \n   40 |   if (lockf(fd, F_LOCK, 0) == -1)\n   41 |     return;\n   42 |   lock_fd = fd;","lines":13,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/jobs-unix.cc#L30-L42"}]},{"id":"OTHER_3","type":"other","type_label":"Other","severity":"medium","difficulty":"easy","description":"`Context<E>::has_error` is a plain `bool` that is written from\n`Error<E>::Error()` and `Warn<E>::Warn()` (`src/error.cc:30`, `src/error.cc:43`)\nand read by `Context<E>::checkpoint()`. Diagnostics are emitted from inside\n`tbb::parallel_for_each` passes (relocation scanning, undefined-symbol\nreporting, range checks), so several threads can write this flag concurrently\nwhile another thread reads it. That is a data race and therefore undefined\nbehaviour; in practice the risk is that a concurrently-set error flag is not\nobserved at the next `checkpoint()` and mold produces a broken output with exit\nstatus 0.","fix":"Change the declaration to an atomic, which the codebase already has a helper\nfor:\n\n```cpp\n-  bool has_error = false;\n+  Atomic<bool> has_error = false;\n```\n\nNo call site needs to change, since `Atomic<T>` implicitly converts to `T` and\nhas an `operator=(T)`.","locations":[{"ref":"src/mold.h:2769-2769","code":" 2769 |   bool has_error = false;","lines":1,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mold.h#L2769"},{"ref":"src/mold.h:2618-2623","code":" 2618 |   void checkpoint() {\n 2619 |     if (has_error) {\n 2620 |       cleanup();\n 2621 |       _exit(1);\n 2622 |     }\n 2623 |   }","lines":6,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mold.h#L2618-L2623"}]},{"id":"OTHER_4","type":"other","type_label":"Other","severity":"medium","difficulty":"easy","description":"In `EhFrameSection<E>::copy_buf`, `u64 func_addr;` is declared uninitialized and is\nonly assigned inside `for (i64 j = 0; j < rels.size(); j++) { ... if (j == 0) func_addr = val; }`.\nIf an FDE has no relocations (`rels.empty()`), `func_addr` is read a few lines later\nin `ent.init_addr = func_addr - origin;`, i.e. an indeterminate value is written into\nthe `.eh_frame_hdr` binary-search table and then used as the sort key. This yields a\nnon-reproducible output and a search table that can direct the unwinder to a wrong\nFDE. Before the tombstone change the write was guarded by `j == 0 && eh_hdr` inside\nthe loop, so an FDE without relocations simply produced no table entry; the\nrefactoring dropped that guard. It is also a `-Wmaybe-uninitialized` class defect.","fix":"Initialize the variable and skip the entry when it was never set, e.g. `std::optional<u64> func_addr;` (or `u64 func_addr = 0; bool has_func_addr = false;`) and write the tombstone (`ent.init_addr = INT32_MAX; ent.fde_addr = 0;`) when no relocation supplied a function address.","locations":[{"ref":"src/output-chunks.cc:2694-2707","code":" 2694 |       u64 func_addr;\n 2695 | \n 2696 |       for (i64 j = 0; j < rels.size(); j++) {\n 2697 |         const ElfRel<E> &rel = rels[j];\n 2698 |         assert(rel.r_offset - fde.input_offset < contents.size());\n 2699 | \n 2700 |         Symbol<E> &sym = *file->symbols[rel.r_sym];\n 2701 |         u64 loc = offset + rel.r_offset - fde.input_offset;\n 2702 |         u64 val = sym.get_addr(ctx) + get_addend(cie.input_section, rel);\n 2703 |         apply_eh_reloc(ctx, rel, loc, val);\n 2704 | \n 2705 |         if (j == 0)\n 2706 |           func_addr = val;\n 2707 |       }","lines":14,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/output-chunks.cc#L2694-L2707"},{"ref":"src/output-chunks.cc:2709-2729","code":" 2709 |       if (!eh_hdr)\n 2710 |         continue;\n 2711 | \n 2712 |       // Write to .eh_frame_hdr\n 2713 |       HdrEntry &ent = eh_hdr[file->fde_idx + i];\n 2714 |       u8 *ptr = base + offset + 8 + cie.fde_ptr_size;\n 2715 |       u64 range = (cie.fde_ptr_size == 4) ? *(U32<E> *)ptr : *(U64<E> *)ptr;\n 2716 | \n 2717 |       if (range == 0) {\n 2718 |         // Compilers may emit a meaningless FDE covering a zero-length\n 2719 |         // address range. Such an FDE must not be written to .eh_frame_hdr\n 2720 |         // because another function may start at the same address, and a\n 2721 |         // binary search on .eh_frame_hdr could then find the empty FDE\n 2722 |         // instead of the real one. We write a tombstone value instead.\n 2723 |         ent.init_addr = INT32_MAX;\n 2724 |         ent.fde_addr = 0;\n 2725 |       } else {\n 2726 |         u64 origin = ctx.eh_frame_hdr->shdr.sh_addr;\n 2727 |         ent.init_addr = func_addr - origin;\n 2728 |         ent.fde_addr = this->shdr.sh_addr + offset - origin;\n 2729 |       }","lines":21,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/output-chunks.cc#L2709-L2729"}]},{"id":"OTHER_5","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"`execl()`, `execlp()` and `execle()` size their argument vector with\n`alloca((count_args(&ap) + 2) * sizeof(char *))`. `alloca()` cannot fail\ndetectably: a caller that passes a very long argument list (which is entirely\nlegal - `ARG_MAX` is typically 2 MiB, i.e. hundreds of thousands of pointers)\nsilently moves the stack pointer past the guard page and the *build tool* being\nwrapped crashes with no diagnostic. This code runs inside every process of a\nbuild under `mold -run`, so it is exposed to whatever argument lists that build\nuses.","fix":"Use a small fixed-size stack buffer for the common case and fall back to\n`malloc()`/`free()` above a threshold, e.g.\n```c\nint n = count_args(&ap) + 2;\nchar *stackbuf[64];\nchar **argv = (n <= 64) ? stackbuf : malloc(n * sizeof(char *));\n```\n(remembering that the `exec*` call does not return on success, so the `free()`\nonly needs to run on the failure path).","locations":[{"ref":"src/mold-wrapper.c:90-116","code":"   90 | int execl(const char *path, const char *arg0, ...) {\n   91 |   va_list ap;\n   92 |   va_start(ap, arg0);\n   93 |   char **argv = alloca((count_args(&ap) + 2) * sizeof(char *));\n   94 |   copy_args(argv, arg0, &ap);\n   95 |   va_end(ap);\n   96 |   return execve(path, argv, environ);\n   97 | }\n   98 | \n   99 | int execlp(const char *file, const char *arg0, ...) {\n  100 |   va_list ap;\n  101 |   va_start(ap, arg0);\n  102 |   char **argv = alloca((count_args(&ap) + 2) * sizeof(char *));\n  103 |   copy_args(argv, arg0, &ap);\n  104 |   va_end(ap);\n  105 |   return execvpe(file, argv, environ);\n  106 | }\n  107 | \n  108 | int execle(const char *path, const char *arg0, ...) {\n  109 |   va_list ap;\n  110 |   va_start(ap, arg0);\n  111 |   char **argv = alloca((count_args(&ap) + 2) * sizeof(char *));\n  112 |   copy_args(argv, arg0, &ap);\n  113 |   char **env = va_arg(ap, char **);\n  114 |   va_end(ap);\n  115 |   return execve(path, argv, env);\n  116 | }","lines":27,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mold-wrapper.c#L90-L116"}]},{"id":"OTHER_6","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"Two unguarded object-like/function-like macros are defined at the very top of\nthis header, which every translation unit in the project includes:\n\n* `ALWAYS_INLINE` (`src/mold.h:30`) is defined unconditionally to a GCC/Clang\n  `__attribute__`, has no `MOLD_` prefix, and is never `#undef`ed. On MSVC it\n  would break the ten `for_each_reloc(...) ALWAYS_INLINE` lambdas in the\n  `arch-*.cc` files, and the unprefixed name can collide with third-party\n  headers.\n* `msan_unpoison(addr, sz)` (`src/mold.h:42`) expands to *nothing* in the\n  default build, so any argument with a side effect would be silently dropped.\n\nBoth are macro-hygiene hazards in a header that also drags in `<windows.h>`\n(`src/mold.h:33`), which defines dozens of unprefixed macros of its own.","fix":"Prefix and guard them:\n\n```cpp\n#if defined(__GNUC__) || defined(__clang__)\n# define MOLD_ALWAYS_INLINE __attribute__((always_inline))\n#else\n# define MOLD_ALWAYS_INLINE\n#endif\n\n#if ENABLE_MSAN_UNPOISON\nextern \"C\" void __msan_unpoison(void *, size_t);\n# define msan_unpoison(addr, sz) __msan_unpoison(addr, sz)\n#else\n# define msan_unpoison(addr, sz) ((void)(addr), (void)(sz))\n#endif\n```\n\nand rename the ten uses in `src/arch-*.cc`.","locations":[{"ref":"src/mold.h:30-43","code":"   30 | #define ALWAYS_INLINE __attribute__((always_inline))\n   31 | \n   32 | #ifdef _WIN32\n   33 | # include <windows.h>\n   34 | #else\n   35 | # include <unistd.h>\n   36 | #endif\n   37 | \n   38 | #if ENABLE_MSAN_UNPOISON\n   39 | extern \"C\" void __msan_unpoison(void *, size_t);\n   40 | # define msan_unpoison(addr, sz) __msan_unpoison(addr, sz)\n   41 | #else\n   42 | # define msan_unpoison(addr, sz)\n   43 | #endif","lines":14,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mold.h#L30-L43"}]},{"id":"OTHER_7","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"`discarded_comdat_sym<E>` is a mutable global (`inline` variable template)\nassigned from the `Context<E>` constructor\n(`discarded_comdat_sym<E> = arena.template make<Symbol<E>>();`). It is compared\nagainst in `Symbol<E>::esym()` and `InputSection<E>::get_tombstone()` and used\nthroughout `input-files.cc`. This directly contradicts the design stated in the\ncomment above `Context` - \"Context represents a context object for each\ninvocation of the linker\" - because a second `Context<E>` (which\n`redo_main()` creates, `src/mold.h:2316`) silently overwrites the pointer that\nsymbols created by the first context still compare against, and two contexts\ncan never coexist.","fix":"Move the sentinel into `Context<E>` as a member\n(`Symbol<E> *discarded_comdat_sym = nullptr;`) and pass `ctx` to the handful of\nplaces that need it - `esym()` and `get_tombstone()` already receive or can\nreceive a `Context<E> &`. If that is too invasive, at least assert in the\n`Context` constructor that `discarded_comdat_sym<E>` is still null so a second\ncontext fails loudly instead of silently corrupting the first.","locations":[{"ref":"src/mold.h:62-64","code":"   62 | // Local symbols in discarded COMDAT sections all use one zero-valued symbol.\n   63 | template <typename E>\n   64 | inline Symbol<E> *discarded_comdat_sym;","lines":3,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mold.h#L62-L64"},{"ref":"src/mold.h:2599-2614","code":" 2599 | // Context represents a context object for each invocation of the linker.\n 2600 | // It contains command line flags, pointers to singleton objects\n 2601 | // (such as linker-synthesized output sections), unique_ptrs for\n 2602 | // resource management, and other miscellaneous objects.\n 2603 | template <typename E>\n 2604 | struct Context {\n 2605 |   Context() : symbol_map(arena) {\n 2606 |     discarded_comdat_sym<E> = arena.template make<Symbol<E>>();\n 2607 | \n 2608 |     arg.entry = get_symbol(*this, \"_start\");\n 2609 |     arg.fini = get_symbol(*this, \"_fini\");\n 2610 |     arg.init = get_symbol(*this, \"_init\");\n 2611 | \n 2612 |     if constexpr (is_sparc<E>)\n 2613 |       extra.tls_get_addr = get_symbol(*this, \"__tls_get_addr\");\n 2614 |   }","lines":16,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mold.h#L2599-L2614"}]},{"id":"OTHER_8","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"`output_tmpfile`, `output_buffer_start` and `output_buffer_end` are plain\nnon-atomic, non-`volatile` inline globals that are written from ordinary linker\ncode (`src/output-file-unix.cc:60`, `:91-92`, `:127-131`) and read from a\n`SIGSEGV`/`SIGBUS` handler and from `cleanup()` (`src/signal-unix.cc:21-22`,\n`:45-46`). Reading a non-`volatile sig_atomic_t`-typed object that is modified\noutside the handler is undefined behaviour, and a partially written pointer in\nthe handler could make the crash handler `unlink()` a wrong path or\nmis-classify a fault as \"output buffer overrun\".","fix":"Declare them as atomics with relaxed access, which is well defined in signal\nhandlers when lock-free:\n\n```cpp\ninline std::atomic<char *> output_tmpfile = nullptr;\ninline std::atomic<u8 *> output_buffer_start = nullptr;\ninline std::atomic<u8 *> output_buffer_end = nullptr;\n```\n\nand load each exactly once at the top of the handler.","locations":[{"ref":"src/mold.h:164-174","code":"  164 | //\n  165 | // signal-unix.cc\n  166 | //\n  167 | \n  168 | inline char *output_tmpfile = nullptr;\n  169 | inline u8 *output_buffer_start = nullptr;\n  170 | inline u8 *output_buffer_end = nullptr;\n  171 | \n  172 | std::string errno_string();\n  173 | void cleanup();\n  174 | void install_signal_handler();","lines":11,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mold.h#L164-L174"}]},{"id":"OTHER_9","type":"other","type_label":"Other","severity":"low","difficulty":"very_easy","description":"`ObjectFile<E>::symtab_sec` and `SharedFile<E>::symtab_sec` are the only\npointer members in those classes without a default member initializer. Every\nother pointer member in the same classes (`llvm_addrsig`, `debug_info`,\n`debug_pubnames`, ...) is `= nullptr`. `ObjectFile` instances created through\n`ObjectFile(Context<E> &ctx)` (the internal file and the LTO placeholder,\n`src/passes.cc:813`, `src/lto-unix.cc:621`) never run `parse_symbols()`, so the\nmember holds an indeterminate value for the whole link.","fix":"```cpp\n-  const ElfShdr<E> *symtab_sec;\n+  const ElfShdr<E> *symtab_sec = nullptr;\n```\n\nin both classes. (Both are actually only read inside the function that assigns\nthem, so they could equally well become local variables.)","locations":[{"ref":"src/mold.h:2059-2062","code":" 2059 |   bool has_common_symbol = false;\n 2060 | \n 2061 |   const ElfShdr<E> *symtab_sec;\n 2062 |   std::span<U32<E>> symtab_shndx_sec;","lines":4,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mold.h#L2059-L2062"},{"ref":"src/mold.h:2100-2101","code":" 2100 |   std::vector<u16> versyms;\n 2101 |   const ElfShdr<E> *symtab_sec;","lines":2,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mold.h#L2100-L2101"}]},{"id":"OTHER_10","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"`Symbol<E>` is stored in `TaggedPtr<InputSection<E>, Chunk<E>,\nSectionFragment<E>, Symbol<E>>` (`Symbol<E>::origin`, set via\n`set_symbol_origin()`), which needs 2 tag bits and therefore\n`alignof(Symbol<E>) >= 4`. Its three siblings all carry an explicit\n`__attribute__((aligned(4)))` for exactly that reason - `InputSection` even has\na comment saying \"keep this type four-byte aligned even on hosts such as\nm68k\" - but `Symbol` has none. On a host ABI where `alignof(u64) == 2` (m68k\nSysV, which the `InputSection` comment calls out by name), the\n`static_assert(alignof(T) >= 1ULL << TAG_BITS)` in `TaggedPtr::operator=`\n(`lib/lib.h:89`) would fire and mold would fail to build.\n\nThe `SectionFragment` and `Chunk` attributes also lack the explanatory comment\nthat `InputSection` has, so a reader has no way of knowing they are load-bearing\nand not just a micro-optimization.","fix":"```cpp\n-template <typename E>\n-class Symbol {\n+// Symbol::origin stores tagged pointers to this type, so keep it four-byte\n+// aligned even on hosts such as m68k.\n+template <typename E>\n+class __attribute__((aligned(4))) Symbol {\n```\n\nand copy the same one-line rationale above `SectionFragment` (279) and `Chunk`\n(689).","locations":[{"ref":"src/mold.h:2946-2957","code":" 2946 | // Symbol class represents a symbol. For each unique symbol name, we\n 2947 | // create one instance of Symbol.\n 2948 | //\n 2949 | // A symbol has not only one but several different addresses if it\n 2950 | // has PLT or GOT entries. This class provides various functions to\n 2951 | // compute different addresses.\n 2952 | template <typename E>\n 2953 | class Symbol {\n 2954 | public:\n 2955 |   Symbol() = default;\n 2956 |   Symbol(const Symbol &) = delete;\n 2957 |   Symbol &operator=(const Symbol &) = delete;","lines":12,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mold.h#L2946-L2957"},{"ref":"src/mold.h:279-280","code":"  279 | template <typename E>\n  280 | struct __attribute__((aligned(4))) SectionFragment {","lines":2,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mold.h#L279-L280"},{"ref":"src/mold.h:689-690","code":"  689 | template <typename E>\n  690 | class __attribute__((aligned(4))) Chunk {","lines":2,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mold.h#L689-L690"}]},{"id":"OTHER_11","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"`InputSection<E>::shdr()` and `name()` compare a signed `i32 shndx` (default\n`-1`) against `file.elf_sections.size()` (`size_t`). The signed operand is\nconverted to `size_t`, so a negative `shndx` compares *greater* than the size\nand control falls into\n`file.elf_sections2[shndx - file.elf_sections.size()]`, indexing a vector with a\nhuge value. The same signed/unsigned pattern appears in\n`InputFile<E>::get_data(ctx, i64 idx)` / `get_string(ctx, i64 idx)` (there it\nhappens to fail safe into `Fatal`), in `CieRecord::get_rels()` /\n`FdeRecord::get_rels()` (`i < rels.size()`), and in `is_c_identifier()`\n(`i < s.size()`). These all compile with warnings suppressed and are easy to get\nwrong when refactoring.","fix":"Cast the container size once, e.g.\n\n```cpp\ninline ElfShdr<E> &InputSection<E>::shdr() const {\n  i64 n = file.elf_sections.size();\n  assert(shndx >= 0);\n  return (shndx < n) ? file.elf_sections[shndx]\n                     : file.elf_sections2[shndx - n];\n}\n```\n\nand apply the same `(i64)`-cast pattern to the other comparisons. Consider\nenabling `-Wsign-compare` for this header.","locations":[{"ref":"src/mold.h:3241-3246","code":" 3241 | template <typename E>\n 3242 | inline ElfShdr<E> &InputSection<E>::shdr() const {\n 3243 |   if (shndx < file.elf_sections.size())\n 3244 |     return file.elf_sections[shndx];\n 3245 |   return file.elf_sections2[shndx - file.elf_sections.size()];\n 3246 | }","lines":6,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mold.h#L3241-L3246"},{"ref":"src/mold.h:3258-3268","code":" 3258 | template <typename E>\n 3259 | inline std::string_view InputSection<E>::name() const {\n 3260 |   if (shndx >= file.elf_sections.size())\n 3261 |     return (shdr().sh_flags & SHF_TLS) ? \".tls_common\" : \".common\";\n 3262 | \n 3263 |   const char *data =\n 3264 |     file.shstrtab.data() + file.elf_sections[shndx].sh_name;\n 3265 |   if (namelen == UINT16_MAX)\n 3266 |     return {data, UINT16_MAX + strlen(data + UINT16_MAX)};\n 3267 |   return {data, namelen};\n 3268 | }","lines":11,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mold.h#L3258-L3268"},{"ref":"src/mold.h:4026-4031","code":" 4026 |   if (!is_alpha(s[0]))\n 4027 |     return false;\n 4028 |   for (i64 i = 1; i < s.size(); i++)\n 4029 |     if (!is_alnum(s[i]))\n 4030 |       return false;\n 4031 |   return true;","lines":6,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mold.h#L4026-L4031"}]},{"id":"OTHER_12","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"`get_r_delta()` calls `ranges::upper_bound` with `std::less_equal<>{}` as the\ncomparator. `std::less_equal` is not a strict weak ordering, which the\nstandard requires for `upper_bound`; the code works only because libstdc++'s\nimplementation evaluates `comp(value, *mid)` exactly once per step. It is\nalso non-obvious to readers what the resulting semantics are (it returns the\ndelta of the last entry whose offset is strictly less than `offset`).","fix":"Use a conforming formulation, e.g. `auto it = ranges::lower_bound(deltas, offset, {}, &RelocDelta::offset); return (it == deltas.begin()) ? 0 : (it - 1)->delta;`, and add a one-line comment stating that a delta recorded exactly at `offset` does not apply to that offset.","locations":[{"ref":"src/shrink-sections.cc:69-75","code":"   69 | template <>\n   70 | i64 get_r_delta(InputSection<E> &isec, u64 offset) {\n   71 |   std::span<RelocDelta> deltas = isec.extra.r_deltas;\n   72 |   auto it = ranges::upper_bound(deltas, offset, std::less_equal<>{},\n   73 |                                 &RelocDelta::offset);\n   74 |   return (it == deltas.begin()) ? 0 : (it - 1)->delta;\n   75 | }","lines":7,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/shrink-sections.cc#L69-L75"}]},{"id":"OTHER_13","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"The constant is named `EM_S390X`, but the official ELF machine name for value 22\nis `EM_S390` (it covers both 31-bit s390 and 64-bit s390x). Every other entry in\nthe enum uses the standard spelling, so grepping for `EM_S390` - the name that\nappears in the psABI, in glibc's `elf.h` and in binutils - finds nothing.","fix":"Rename to the standard name and update the two uses:\n`EM_S390X = 22,` -> `EM_S390 = 22,` (in `elf.h: const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};
const PRESENT_DIFFS = DIFFICULTY_ORDER.filter(d => FINDINGS.some(f => f.difficulty === d));

const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State
const S = {
  search: '', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenDiff: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(),
};
const statuses = {};

// Persistence
function loadStatuses() {

}
function saveStatuses() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(statuses)); } catch {}
}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;
function syncHash() {
  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));
    if (S.search)            p.set('q',   S.search);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);

}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));

  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Render a "**Label:** value" line. GitHub/CommonMark only recognizes a
// ``` fence when it starts at the beginning of a line, so if the value
// itself opens with a fence, put it on its own line instead of right
// after the inline label - otherwise the fence marker gets glued onto
// "**Label:** ```" and never renders as a code block.
function mdField(label, value) {
  value = value || '';
  return /^```/.test(value.trim())
    ? '**' + label + ':**\n\n' + value
    : '**' + label + ':** ' + value;
}

// Render the "**Locations:**" block. When a location has a commit-pinned
// permalink (GitHub/GitLab), just paste the bare URL on its own line -
// GitHub/GitLab auto-expand a line-range blob link into an inline code
// preview, so re-pasting the snippet as a fenced block would duplicate it.
// Forges without a detected permalink shape (or missing commit/repo info)
// fall back to the fenced ref+snippet so the location is still readable.
function mdLocations(locations) {
  if (!locations.length) return '';
  let out = '**Locations:**\n\n';
  for (const l of locations) {
    if (l.link)               out += l.link + '\n\n';
    else if (l.code != null)  out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
    else                      out += '- `' + l.ref + '` _(file not found)_\n\n';
  }
  return out;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += mdField('Description', f.description) + '\n\n';
      out += mdLocations(f.locations);
      out += mdField('Fix', f.fix) + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return chunks.join('\n\n') + '\n';
}

// Build project-info.toml from embedded PROJECT_INFO (same format as gen_project_info.py).
function buildProjectInfoToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = Object.assign({}, PROJECT_INFO);
  if (!('description' in pi)) pi.description = '';
  const lines = [
    '# Project metadata for the code audit report (all fields optional).',
    '# Hand-edit freely (e.g. fill in description); re-run the audit without --force to keep edits.',
    '', '[project]'
  ];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += mdField('Description', f.description) + '\n\n';
  out += mdLocations(f.locations);
  out += mdField('Fix', f.fix) + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystack per finding (cleared on full re-render)
const _hay = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (!hayOf(f).includes(q) && !st.includes(q)) return false;
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    downloadText(buildFindingsToml(),    'findings.toml',     'application/toml');
    downloadText(buildProjectInfoToml(), 'project-info.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
