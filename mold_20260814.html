_supported) {\n  438 |     is_gcc_linker_api_v1 = true;\n  439 |     return LAPI_V1;\n  440 |   }\n  441 |   return LAPI_V0;\n  442 | }","lines":22,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/lto-unix.cc#L421-L442"}]},{"id":"UAF_2","type":"use_after_free","type_label":"Use After Free","severity":"medium","difficulty":"easy","description":"`execv()` and `execvp()` forward to the wrapper's own `execvpe()` passing the\nglobal `environ` as `envp`. `execvpe()` then does\n`for (int i = 0; envp[i]; i++) putenv(envp[i]);` - i.e. it iterates `environ`\nwhile calling `putenv()`, which is explicitly allowed to reallocate the\n`environ` array. Once glibc grows the array, the `envp` pointer being walked\nrefers to the freed old array and the loop reads freed memory (and may then\n`putenv()` garbage pointers). The aliasing is invisible at the `execvpe()` call\nsite because the alias is created two frames up in `execvp()`.","fix":"Do not re-publish the environment at all - look up the real `execvpe` and pass\n`envp` straight through (see the related `execvpe` finding). If the emulation\nmust be kept, snapshot the list first:\n```c\nint n = 0; while (envp[n]) n++;\nchar **copy = malloc((n + 1) * sizeof(char *));\nfor (int i = 0; i < n; i++) copy[i] = strdup(envp[i]);\nfor (int i = 0; i < n; i++) putenv(copy[i]);\n```","locations":[{"ref":"src/mold-wrapper.c:69-80","code":"   69 | int execvpe(const char *file, char *const *argv, char *const *envp) {\n   70 |   debug_print(\"execvpe %s\\n\", file);\n   71 | \n   72 |   if (!strcmp(file, \"ld\") || is_ld(file))\n   73 |     file = get_mold_path();\n   74 | \n   75 |   for (int i = 0; envp[i]; i++)\n   76 |     putenv(envp[i]);\n   77 | \n   78 |   typeof(execvpe) *real = dlsym(RTLD_NEXT, \"execvp\");\n   79 |   return real(file, argv, environ);\n   80 | }","lines":12,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mold-wrapper.c#L69-L80"},{"ref":"src/mold-wrapper.c:118-124","code":"  118 | int execv(const char *path, char *const *argv) {\n  119 |   return execve(path, argv, environ);\n  120 | }\n  121 | \n  122 | int execvp(const char *file, char *const *argv) {\n  123 |   return execvpe(file, argv, environ);\n  124 | }","lines":7,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mold-wrapper.c#L118-L124"}]},{"id":"UAF_3","type":"use_after_free","type_label":"Use After Free","severity":"low","difficulty":"medium","description":"`demangle_cpp()` and `demangle_rust()` return a `std::string_view` into a `thread_local` buffer that\nthe *next* call on the same thread overwrites or frees. `demangle_rust()` in particular starts with\n`free(buf)` before demangling, so a `string_view` returned by a previous call becomes dangling the\nmoment the next symbol is demangled. Nothing in `lib/lib.h:1129-1130` documents this. Callers such\nas `demangle()` in `src/input-files.cc:56-65` return that view further up the stack; today it\nhappens to be consumed immediately by `operator<<`, but the contract is a trap for any future\ncaller that wants to keep the result (e.g. to build an error message from two symbols).\n\nAdditionally the thread-local buffers are never freed, so every worker thread leaks its last\ndemangled name for the lifetime of the process.","fix":"Either return an owning `std::optional<std::string>`, or document the lifetime explicitly in\n`lib/lib.h` (`// The returned view is valid only until the next demangle_*() call on this\nthread.`). If the allocation cost is the concern, let the caller pass a `std::string &out`\nscratch buffer it owns.","locations":[{"ref":"lib/demangle.cc:13-40","code":"   13 | std::optional<std::string_view> demangle_cpp(std::string_view name) {\n   14 |   static thread_local char *buf;\n   15 |   static thread_local size_t buflen;\n   16 | \n   17 |   // TODO(cwasser): Actually demangle Symbols on Windows using e.g.\n   18 |   // `UnDecorateSymbolName` from Dbghelp, maybe even Itanium symbols?\n   19 | #ifndef _WIN32\n   20 |   if (name.starts_with(\"_Z\")) {\n   21 |     int status;\n   22 |     char *p = abi::__cxa_demangle(std::string(name).c_str(), buf, &buflen, &status);\n   23 |     if (status == 0) {\n   24 |       buf = p;\n   25 |       return p;\n   26 |     }\n   27 |   }\n   28 | #endif\n   29 | \n   30 |   return {};\n   31 | }\n   32 | \n   33 | std::optional<std::string_view> demangle_rust(std::string_view name) {\n   34 |   static thread_local char *buf;\n   35 |   free(buf);\n   36 |   buf = rust_demangle(std::string(name).c_str(), 0);\n   37 |   if (buf)\n   38 |     return buf;\n   39 |   return {};\n   40 | }","lines":28,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/lib/demangle.cc#L13-L40"},{"ref":"lib/lib.h:1125-1130","code":" 1125 | //\n 1126 | // demangle.cc\n 1127 | //\n 1128 | \n 1129 | std::optional<std::string_view> demangle_cpp(std::string_view name);\n 1130 | std::optional<std::string_view> demangle_rust(std::string_view name);","lines":6,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/lib/lib.h#L1125-L1130"}]},{"id":"UAF_4","type":"use_after_free","type_label":"Use After Free","severity":"low","difficulty":"medium","description":"`Context<E>::debug_info`, `debug_abbrev`, `debug_ranges`, `debug_addr` and\n`debug_rnglists` are `std::span<u8>` members that, for uncompressed sections,\nalias the output buffer: `get_buffer()` returns\n`{ctx.buf + chunk->shdr.sh_offset, chunk->shdr.sh_size}`\n(`src/gdb-index.cc:758-764`). `OutputFile<E>::extend()` is explicitly\ndocumented right in this header as \"`buf` and `ctx.buf` may move as a result of\nthis call\", and `write_gdb_index()` calls `ctx.output_file->extend()` at\n`src/gdb-index.cc:971` in the same function that filled those spans. Today the\nspans happen to be consumed before the `extend()` call, so nothing dangles -\nbut there is no marker or invariant preventing a future reordering, and\n`MallocOutputFile::extend()` really does `realloc`.","fix":"Store offsets rather than pointers, e.g. keep\n`std::pair<i64 /*offset*/, i64 /*size*/> debug_info;` in `Context` and\nmaterialize `std::span<u8>{ctx.buf + off, size}` at the point of use; or clear\nthe five spans inside `OutputFile<E>::extend()` so a stale use trips\nimmediately. At minimum, add a comment next to the members stating that they\nare invalidated by `extend()`.","locations":[{"ref":"src/mold.h:1656-1662","code":" 1656 | \n 1657 |   // Appends `size` bytes to the output file and returns a pointer to\n 1658 |   // the newly-allocated space, bumping `filesize` accordingly. We use\n 1659 |   // it for .gdb_index, whose size is not known until all other\n 1660 |   // sections have been written. The new space is zero-initialized.\n 1661 |   // `buf` and `ctx.buf` may move as a result of this call.\n 1662 |   virtual u8 *extend(Context<E> &ctx, i64 size) = 0;","lines":7,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mold.h#L1656-L1662"},{"ref":"src/mold.h:2862-2869","code":" 2862 |   // For --gdb-index\n 2863 |   // shared_ptr lets the implementation type remain in gdb-index.cc.\n 2864 |   std::shared_ptr<GdbIndexData> gdb_index_data;\n 2865 |   std::span<u8> debug_info;\n 2866 |   std::span<u8> debug_abbrev;\n 2867 |   std::span<u8> debug_ranges;\n 2868 |   std::span<u8> debug_addr;\n 2869 |   std::span<u8> debug_rnglists;","lines":8,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mold.h#L2862-L2869"}]},{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"In `run_lto_plugin()`, `create_plugin_input_file()` reopens the file descriptor\nof every GCC offload object and passes it to `claim_file_hook()`, but the\ndescriptor is never closed afterwards. `read_lto_object()` does close it (via\n`mf->close_fd()` / `mf->parent->close_fd()`) precisely because the plugin does\nnot take ownership. A link with many offload objects therefore leaks one fd per\nobject and can hit `EMFILE`.","fix":"Mirror `read_lto_object()`:\n```c++\nPluginInputFile pfile = create_plugin_input_file(ctx, file->mf);\nint claimed = false;\nclaim_file_hook(&pfile, &claimed);\nassert(!claimed);\nif (file->mf->parent)\n  file->mf->parent->close_fd();\nelse\n  file->mf->close_fd();\n```","locations":[{"ref":"src/lto-unix.cc:735-745","code":"  735 |   // Object files containing .gnu.offload_lto_.* sections need to be\n  736 |   // given to the LTO backend. Such sections contains code and data for\n  737 |   // peripherails (typically GPUs).\n  738 |   for (ObjectFile<E> *file : ctx.objs) {\n  739 |     if (file->is_reachable && !file->is_lto_obj && file->is_gcc_offload_obj) {\n  740 |       PluginInputFile pfile = create_plugin_input_file(ctx, file->mf);\n  741 |       int claimed = false;\n  742 |       claim_file_hook(&pfile, &claimed);\n  743 |       assert(!claimed);\n  744 |     }\n  745 |   }","lines":11,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/lto-unix.cc#L735-L745"}]},{"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"The LTO plugin obtained with `dlopen()` in `load_lto_plugin()` is never\n`dlclose()`d, and the handle is not even stored, so it cannot be released. On\nthe normal path this only matters at exit, but `mold -run` and the\n`restart_process()` re-exec path keep the mapping alive unnecessarily; more\nimportantly, holding a plugin handle with no way to release it makes it\nimpossible to ever support linking multiple outputs in one process.","fix":"Store the handle in a namespace-scope variable and `dlclose()` it in\n`lto_cleanup()` after `cleanup_hook()` has run (or document explicitly why the\nhandle is intentionally leaked).","locations":[{"ref":"src/lto-unix.cc:444-515","code":"  444 | // dlopen the linker plugin file\n  445 | template <typename E>\n  446 | static void load_lto_plugin(Context<E> &ctx) {\n  447 |   static std::once_flag flag;\n  448 | \n  449 |   std::call_once(flag, [&] {\n  450 |     assert(phase == 0);\n  451 |     phase = 1;\n  452 |     gctx<E> = &ctx;\n  453 | \n  454 |     void *handle = dlopen(ctx.arg.plugin.c_str(), RTLD_NOW | RTLD_LOCAL);\n  455 |     if (!handle)\n  456 |       Fatal(ctx) << \"could not open plugin file: \" << dlerror();\n  457 | \n  458 |     OnloadFn *onload = (OnloadFn *)dlsym(handle, \"onload\");\n  459 |     if (!onload)\n  460 |       Fatal(ctx) << \"failed to load plugin \" << ctx.arg.plugin << \": \"\n  461 |                  << dlerror();\n  462 | \n  463 |     auto save = [&](std::string_view str) {\n  464 |       return save_string(ctx, std::string(str).c_str()).data();\n  465 |     };\n  466 | \n  467 |     std::vector<PluginTagValue> tv;\n  468 |     tv.emplace_back(LDPT_MESSAGE, message<E>);\n  469 | \n  470 |     if (ctx.arg.shared)\n  471 |       tv.emplace_back(LDPT_LINKER_OUTPUT, LDPO_DYN);\n  472 |     else if (ctx.arg.pie)\n  473 |       tv.emplace_back(LDPT_LINKER_OUTPUT, LDPO_PIE);\n  474 |     else\n  475 |       tv.emplace_back(LDPT_LINKER_OUTPUT, LDPO_EXEC);\n  476 | \n  477 |     for (std::string_view opt : ctx.arg.plugin_opt)\n  478 |       tv.emplace_back(LDPT_OPTION, save(opt));\n  479 | \n  480 |     tv.emplace_back(LDPT_REGISTER_CLAIM_FILE_HOOK, register_claim_file_hook<E>);\n  481 |     tv.emplace_back(LDPT_REGISTER_ALL_SYMBOLS_READ_HOOK,\n  482 |                     register_all_symbols_read_hook<E>);\n  483 |     tv.emplace_back(LDPT_REGISTER_CLEANUP_HOOK, register_cleanup_hook<E>);\n  484 |     tv.emplace_back(LDPT_ADD_SYMBOLS, add_symbols);\n  485 |     tv.emplace_back(LDPT_GET_SYMBOLS, get_symbols_v1);\n  486 |     tv.emplace_back(LDPT_ADD_INPUT_FILE, add_input_file<E>);\n  487 |     tv.emplace_back(LDPT_GET_INPUT_FILE, get_input_file);\n  488 |     tv.emplace_back(LDPT_RELEASE_INPUT_FILE, release_input_file<E>);\n  489 |     tv.emplace_back(LDPT_ADD_INPUT_LIBRARY, add_input_library);\n  490 |     tv.emplace_back(LDPT_OUTPUT_NAME, save(ctx.arg.output));\n  491 |     tv.emplace_back(LDPT_SET_EXTRA_LIBRARY_PATH, set_extra_library_path);\n  492 |     tv.emplace_back(LDPT_GET_VIEW, get_view<E>);\n  493 |     tv.emplace_back(LDPT_GET_INPUT_SECTION_COUNT, get_input_section_count);\n  494 |     tv.emplace_back(LDPT_GET_INPUT_SECTION_TYPE, get_input_section_type);\n  495 |     tv.emplace_back(LDPT_GET_INPUT_SECTION_NAME, get_input_section_name);\n  496 |     tv.emplace_back(LDPT_GET_INPUT_SECTION_CONTENTS, get_input_section_contents);\n  497 |     tv.emplace_back(LDPT_UPDATE_SECTION_ORDER, update_section_order);\n  498 |     tv.emplace_back(LDPT_ALLOW_SECTION_ORDERING, allow_section_ordering);\n  499 |     tv.emplace_back(LDPT_ADD_SYMBOLS_V2, add_symbols);\n  500 |     tv.emplace_back(LDPT_GET_SYMBOLS_V2, get_symbols_v2<E>);\n  501 |     tv.emplace_back(LDPT_ALLOW_UNIQUE_SEGMENT_FOR_SECTIONS,\n  502 |                     allow_unique_segment_for_sections);\n  503 |     tv.emplace_back(LDPT_UNIQUE_SEGMENT_FOR_SECTIONS, unique_segment_for_sections);\n  504 |     tv.emplace_back(LDPT_GET_SYMBOLS_V3, get_symbols_v3<E>);\n  505 |     tv.emplace_back(LDPT_GET_INPUT_SECTION_ALIGNMENT, get_input_section_alignment);\n  506 |     tv.emplace_back(LDPT_GET_INPUT_SECTION_SIZE, get_input_section_size);\n  507 |     tv.emplace_back(LDPT_REGISTER_NEW_INPUT_HOOK, register_new_input_hook<E>);\n  508 |     tv.emplace_back(LDPT_GET_WRAP_SYMBOLS, get_wrap_symbols);\n  509 |     tv.emplace_back(LDPT_GET_API_VERSION, get_api_version<E>);\n  510 |     tv.emplace_back(LDPT_NULL, 0);\n  511 | \n  512 |     [[maybe_unused]] PluginStatus status = onload(tv.data());\n  513 |     assert(status == LDPS_OK);\n  514 |   });\n  515 | }","lines":72,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/lto-unix.cc#L444-L515"}]},{"id":"MEM_3","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"very_easy","description":"Three error paths in the Win32 `open_file_impl()` return `nullptr` after the\n`HANDLE fd` has been opened (and, in two cases, after `new MappedFile` has been\nallocated), leaking both the OS handle and the heap object. The `GetFileSize`\nfailure path leaks only the handle; the `CreateFileMapping` and `MapViewOfFile`\npaths leak the handle *and* the `MappedFile` (it is not yet in `ctx.mf_pool`).\nThe Unix version has the analogous `MappedFile` leak on the `mmap` failure path.","fix":"Add `CloseHandle(fd); delete mf;` (resp. `close(fd); delete mf;`) before each\n`return nullptr`, or wrap the handle/allocation in RAII guards that are released\nonly on the success path.","locations":[{"ref":"src/mapped-file-win32.cc:25-51","code":"   25 |   if (size_lo == INVALID_FILE_SIZE) {\n   26 |     error = path + \": GetFileSize failed: \" + errno_string();\n   27 |     return nullptr;\n   28 |   }\n   29 | \n   30 |   u64 size = ((u64)size_hi << 32) + size_lo;\n   31 | \n   32 |   MappedFile *mf = new MappedFile;\n   33 |   mf->name = path;\n   34 |   mf->size = size;\n   35 |   mf->fd = fd;\n   36 | \n   37 |   if (size > 0) {\n   38 |     HANDLE h = CreateFileMapping(fd, nullptr, PAGE_READONLY, 0, size, nullptr);\n   39 |     if (!h) {\n   40 |       error = path + \": CreateFileMapping failed: \" + errno_string();\n   41 |       return nullptr;\n   42 |     }\n   43 | \n   44 |     mf->data = (u8 *)MapViewOfFile(h, FILE_MAP_COPY, 0, 0, size);\n   45 |     CloseHandle(h);\n   46 | \n   47 |     if (!mf->data) {\n   48 |       error = path + \": MapViewOfFile failed: \" + errno_string();\n   49 |       return nullptr;\n   50 |     }\n   51 |   }","lines":27,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mapped-file-win32.cc#L25-L51"},{"ref":"src/mapped-file-unix.cc:17-29","code":"   17 |   MappedFile *mf = new MappedFile;\n   18 |   mf->name = path;\n   19 |   mf->size = st.st_size;\n   20 | \n   21 |   if (st.st_size > 0) {\n   22 |     mf->data = (u8 *)mmap(nullptr, st.st_size, PROT_READ | PROT_WRITE,\n   23 |                           MAP_PRIVATE, fd, 0);\n   24 |     if (mf->data == MAP_FAILED)\n   25 |       error = path + \": mmap failed: \" + errno_string();\n   26 |   }\n   27 | \n   28 |   close(fd);\n   29 |   return mf;","lines":13,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mapped-file-unix.cc#L17-L29"}]},{"id":"MEM_4","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"`MappedFile::~MappedFile()` calls only `unmap()`; it never calls `close_fd()`.\n`reopen_fd()` reopens a descriptor for LTO (`src/lto-unix.cc:591`) and only two\nexplicit `close_fd()` calls exist (`src/lto-unix.cc:643-645`), so any\n`MappedFile` whose descriptor is reopened on another code path leaks it for the\nlifetime of the process. Given that mold can open thousands of archive members,\na descriptor leak here can hit `RLIMIT_NOFILE`.","fix":"```cpp\n-  ~MappedFile() { unmap(); }\n+  ~MappedFile() { unmap(); close_fd(); }\n```\n\n`close_fd()` is already a no-op when `fd == -1`, so this is safe for the common\ncase.","locations":[{"ref":"src/mold.h:182-190","code":"  182 | class MappedFile {\n  183 | public:\n  184 |   ~MappedFile() { unmap(); }\n  185 |   void unmap();\n  186 |   void close_fd();\n  187 |   void reopen_fd(const std::string &path);\n  188 | \n  189 |   template <typename E>\n  190 |   MappedFile *slice(Context<E> &ctx, std::string name, u64 start, u64 size) {","lines":9,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mold.h#L182-L190"},{"ref":"src/mold.h:236-241","code":"  236 | #ifdef _WIN32\n  237 |   HANDLE fd = INVALID_HANDLE_VALUE;\n  238 | #else\n  239 |   int fd = -1;\n  240 | #endif\n  241 | };","lines":6,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mold.h#L236-L241"}]},{"id":"MEM_5","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"`SymbolAux<E>` contains a `std::vector<u64> thunk_addrs`, but every\n`SymbolAux<E>` is created with `ctx.arena.template make<SymbolAux<E>>()`\n(`src/mold.h:3818`, `src/passes.cc:1919`, `src/output-chunks.cc:3007`).\n`ArenaResource` is a bump allocator whose destructor only `munmap`s the region\n(`lib/arena.cc:39-45`); it never runs destructors of objects placed in it and\nnothing wraps `SymbolAux` in an `ArenaObjectPtr`. Consequently every\n`thunk_addrs` heap buffer is leaked. Note that `ShardedMap` explicitly\n`static_assert`s that its arena entries are trivially destructible\n(`lib/lib.h:895`) - `SymbolAux<E>` violates that same invariant without any\nguard.","fix":"Either make `SymbolAux<E>` trivially destructible by allocating the thunk\naddress list from the arena as well (e.g. a `{ArenaPtr<u64> ptr; u32 size;}`\npair filled once in `gather_thunk_addresses()`, which already knows the final\ncount), or add\n`static_assert(std::is_trivially_destructible_v<SymbolAux<E>>);` next to the\ndeclaration and keep the vector in a separately-owned side table.","locations":[{"ref":"src/mold.h:312-326","code":"  312 | template <typename E>\n  313 | struct SymbolAux {\n  314 |   i32 got_idx = -1;\n  315 |   i32 gottp_idx = -1;\n  316 |   i32 tlsgd_idx = -1;\n  317 |   i32 tlsdesc_idx = -1;\n  318 |   i32 plt_idx = -1;\n  319 |   i32 pltgot_idx = -1;\n  320 |   i32 dynsym_idx = -1;\n  321 |   i32 opd_idx = -1;\n  322 |   u32 djb_hash = 0;\n  323 | \n  324 |   // For range extension thunks\n  325 |   std::vector<u64> thunk_addrs;\n  326 | };","lines":15,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mold.h#L312-L326"},{"ref":"src/mold.h:3815-3822","code":" 3815 | template <typename E>\n 3816 | void Symbol<E>::add_thunk_addr(Context<E> &ctx, u64 addr) requires needs_thunk<E> {\n 3817 |   if (!aux)\n 3818 |     aux = ctx.arena.template make<SymbolAux<E>>();\n 3819 |   std::vector<u64> &vec = aux->thunk_addrs;\n 3820 |   assert(vec.empty() || vec.back() < addr);\n 3821 |   vec.push_back(addr);\n 3822 | }","lines":8,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mold.h#L3815-L3822"}]},{"id":"MEM_6","type":"memory_leak","type_label":"Memory Leak","severity":"negligible","difficulty":"very_easy","description":"`InputSection<E>::uncompress()` allocates `u8 *buf = new u8[sh_size]`, then\ncalls `copy_contents_to()`, and only afterwards transfers ownership to\n`ctx.string_pool`. If `copy_contents_to()` throws (it calls\n`std::string_view::substr`, which can throw `std::out_of_range` on malformed\ninput), `buf` leaks. The window is small but the fix is free.","fix":"```c++\n-  u8 *buf = new u8[sh_size];\n-  copy_contents_to(ctx, buf, sh_size);\n-  contents = buf;\n-  ctx.string_pool.emplace_back(buf);\n+  auto owned = std::make_unique<u8[]>(sh_size);\n+  copy_contents_to(ctx, owned.get(), sh_size);\n+  contents = owned.get();\n+  ctx.string_pool.emplace_back(std::move(owned));\n```","locations":[{"ref":"src/input-sections.cc:67-77","code":"   67 | template <typename E>\n   68 | void InputSection<E>::uncompress(Context<E> &ctx) {\n   69 |   if (!(shdr().sh_flags & SHF_COMPRESSED) || uncompressed)\n   70 |     return;\n   71 | \n   72 |   u8 *buf = new u8[sh_size];\n   73 |   copy_contents_to(ctx, buf, sh_size);\n   74 |   contents = buf;\n   75 |   ctx.string_pool.emplace_back(buf);\n   76 |   uncompressed = true;\n   77 | }","lines":11,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/input-sections.cc#L67-L77"}]},{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"`read_uleb()` and `read_sleb()` accumulate into a `u64` with\n`val |= (byte & 0x7f) << shift;`. `byte` is a `u8`, so `byte & 0x7f` is promoted to `int` and the\nwhole shift expression has type `int`, not `u64`. For `shift >= 32` (i.e. from the 5th LEB128 byte\nonwards) the shift count is at least the width of `int`, which is undefined behaviour; already at\n`shift == 28` a byte value above `0x07` overflows a signed `int`, which is also UB. Even where the\ncompiler does something \"reasonable\", the intermediate result is truncated to 32 bits before being\nOR-ed into `val`, so every ULEB/SLEB value larger than `2^31` is decoded incorrectly.\n\nThese helpers decode DWARF/`.debug_*` and `.eh_frame` data taken straight from untrusted input\nobject files, so a crafted or merely unusual object file yields silently wrong offsets (and, in\n`read_sleb()`, feeds `sign_extend(val, shift)` where `shift` can exceed 64, another UB shift).","fix":"Cast to the accumulator type before shifting, and cap the shift.\n\nBefore:\n```cpp\n    val |= (byte & 0x7f) << shift;\n```\n\nAfter:\n```cpp\n    val |= (u64)(byte & 0x7f) << shift;\n```\n\nFor `read_sleb()`, additionally clamp the sign-extension width, e.g.\n`return sign_extend(val, std::min<i64>(shift, 64));`.","locations":[{"ref":"lib/lib.h:378-388","code":"  378 | inline u64 read_uleb(u8 **buf) {\n  379 |   u64 val = 0;\n  380 |   u8 shift = 0;\n  381 |   u8 byte;\n  382 |   do {\n  383 |     byte = *(*buf)++;\n  384 |     val |= (byte & 0x7f) << shift;\n  385 |     shift += 7;\n  386 |   } while (byte & 0x80);\n  387 |   return val;\n  388 | }","lines":11,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/lib/lib.h#L378-L388"},{"ref":"lib/lib.h:395-405","code":"  395 | inline i64 read_sleb(u8 **buf) {\n  396 |   u64 val = 0;\n  397 |   u8 shift = 0;\n  398 |   u8 byte;\n  399 |   do {\n  400 |     byte = *(*buf)++;\n  401 |     val |= (byte & 0x7f) << shift;\n  402 |     shift += 7;\n  403 |   } while (byte & 0x80);\n  404 |   return sign_extend(val, shift);\n  405 | }","lines":11,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/lib/lib.h#L395-L405"}]},{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"`read_uleb` (used throughout `gdb-index.cc` for DWARF abbrev codes, attribute\nforms, `DW_FORM_udata` values and `DW_RLE_*` operands) computes\n`val |= (byte & 0x7f) << shift;`. `byte & 0x7f` has type `int`, so the shift is\nperformed in 32-bit signed arithmetic: for `shift >= 28` the result overflows\n`int` (undefined behaviour), and in practice GCC/Clang produce a negative `int`\nthat is then sign-extended when OR'ed into the `u64`, setting bits 32-63. For\n`shift >= 32` the shift itself is undefined. Any ULEB128 value that needs five\nor more bytes - a `DW_AT_high_pc` of `DW_FORM_udata` larger than 256 MiB, a\n`DW_RLE_startx_length` length, a large abbrev code - is decoded incorrectly.\n`read_sleb` has the identical defect.","fix":"Do the arithmetic in 64-bit and guard the shift width:\n```cpp\ninline u64 read_uleb(u8 **buf) {\n  u64 val = 0;\n  int shift = 0;\n  u8 byte;\n  do {\n    byte = *(*buf)++;\n    if (shift < 64)\n      val |= (u64)(byte & 0x7f) << shift;\n    shift += 7;\n  } while (byte & 0x80);\n  return val;\n}\n```\nand apply the same change to `read_sleb`.","locations":[{"ref":"lib/lib.h:378-388","code":"  378 | inline u64 read_uleb(u8 **buf) {\n  379 |   u64 val = 0;\n  380 |   u8 shift = 0;\n  381 |   u8 byte;\n  382 |   do {\n  383 |     byte = *(*buf)++;\n  384 |     val |= (byte & 0x7f) << shift;\n  385 |     shift += 7;\n  386 |   } while (byte & 0x80);\n  387 |   return val;\n  388 | }","lines":11,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/lib/lib.h#L378-L388"},{"ref":"lib/lib.h:395-405","code":"  395 | inline i64 read_sleb(u8 **buf) {\n  396 |   u64 val = 0;\n  397 |   u8 shift = 0;\n  398 |   u8 byte;\n  399 |   do {\n  400 |     byte = *(*buf)++;\n  401 |     val |= (byte & 0x7f) << shift;\n  402 |     shift += 7;\n  403 |   } while (byte & 0x80);\n  404 |   return sign_extend(val, shift);\n  405 | }","lines":11,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/lib/lib.h#L395-L405"},{"ref":"src/gdb-index.cc:409-415","code":"  409 |   case DW_FORM_strx:\n  410 |   case DW_FORM_addrx:\n  411 |   case DW_FORM_udata:\n  412 |   case DW_FORM_ref_udata:\n  413 |   case DW_FORM_loclistx:\n  414 |   case DW_FORM_rnglistx:\n  415 |     return read_uleb(p);","lines":7,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/gdb-index.cc#L409-L415"}]},{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"The SPARC64 large-PLT layout and the `.plt` size computation disagree. `sparc_plt_ptr_offset`\nand `to_plt_offset` lay large entries out in 5120-byte blocks of 160 entries (24-byte stub +\n8-byte data pointer = 32 bytes per entry, starting at file offset `0x100000`), but\n`PltSection<E>::update_shdr` sizes the SPARC `.plt` as\n`plt_hdr_size + symbols.size() * plt_size`, i.e. 16 bytes per entry. Since\n`plt_hdr_size + sparc_num_small_plt * plt_size == 0x100000` exactly, the section is sized\n`0x100000 + 16 * nlarge` while the layout needs `0x100000 + 32 * nlarge` - exactly half of\nwhat is required. As soon as a link needs more than `sparc_num_small_plt` (65534) PLT\nentries, `write_plt_entry` and the `*(ub64 *)(ctx.buf + ...+ ptroff)` pointer store write\npast the end of `.plt`, corrupting whatever chunk follows or running off the end of the\noutput mapping.","fix":"Size the section from the same function that lays it out, e.g. drop the special SPARC branch\nand make `update_shdr` use\n`to_plt_offset<E>(symbols.size() - 1) + <entry size> + <pointer area of the last block>`, or\nadd a `sparc_plt_size(ctx, nsyms)` helper next to `sparc_plt_ptr_offset` that returns\n`0x100000 + nblocks * 5120` (with the partial last block accounted for) and call it from\n`PltSection<E>::update_shdr`. Add an assertion that every offset written by\n`write_plt_entry` is `< shdr.sh_size`.","locations":[{"ref":"src/arch-sparc64.cc:83-89","code":"   83 | i64 sparc_plt_ptr_offset(Context<E> &ctx, i64 pltidx) {\n   84 |   i64 i = pltidx - sparc_num_small_plt;\n   85 |   i64 block = i / 160;\n   86 |   i64 nlarge = (i64)ctx.plt->symbols.size() - sparc_num_small_plt;\n   87 |   i64 nstub = std::min<i64>(160, nlarge - block * 160);\n   88 |   return 0x100000 + block * 5120 + nstub * 24 + (i % 160) * 8;\n   89 | }","lines":7,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/arch-sparc64.cc#L83-L89"},{"ref":"src/output-chunks.cc:1890-1898","code":" 1890 | template <typename E>\n 1891 | void PltSection<E>::update_shdr(Context<E> &ctx) {\n 1892 |   if (symbols.empty())\n 1893 |     this->shdr.sh_size = 0;\n 1894 |   else if constexpr (is_sparc<E>)\n 1895 |     this->shdr.sh_size = E::plt_hdr_size + symbols.size() * E::plt_size;\n 1896 |   else\n 1897 |     this->shdr.sh_size = to_plt_offset<E>(symbols.size());\n 1898 | }","lines":9,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/output-chunks.cc#L1890-L1898"}]},{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"For DWARF64 input, `read_compunits` computes `size = ((CuHdrDwarf2_64<E>\n*)p)->size + 12` where `size` is a `U64<E>` converted to `i64`, and\n`read_pubnames_cu` computes `i64 size = hdr.size + offsetof(...) +\nsizeof(hdr.size)` the same way. A `unit_length` field with the top bit set\nyields a negative `i64`, and the callers do `p += size`, walking the cursor\n*backwards*. `read_compunits`' `for (u8 *p = begin; p < end;)` and\n`read_pubnames`' `while (p < end)` then loop forever, pushing `Compunit`s or\nname records until memory is exhausted. There is also no check that `p + size <=\nend`, so an oversized but positive `unit_length` records a compile unit whose\nrecorded `offset`/`size` extends past the end of `.debug_info`; those values are\nwritten verbatim into the `.gdb_index` CU list and are also used to index into\nthe output buffer later.","fix":"Validate the length before using it, in both places:\n```cpp\nu64 len = ((CuHdrDwarf2_64<E> *)p)->size;\nif (len > (u64)(end - p) - 12)\n  Fatal(ctx) << file << \": corrupted .debug_info unit_length\";\ni64 size = len + 12;\n```\nand apply the same `end - p` bound to the pubnames header before computing\n`end = (u8 *)&hdr + size`.","locations":[{"ref":"src/gdb-index.cc:704-714","code":"  704 |     for (u8 *p = begin; p < end;) {\n  705 |       DwarfKind kind = get_dwarf_kind(ctx, p);\n  706 |       i64 size;\n  707 |       if (kind == DWARF2_32 || kind == DWARF5_32)\n  708 |         size = ((CuHdrDwarf2_32<E> *)p)->size + 4;\n  709 |       else\n  710 |         size = ((CuHdrDwarf2_64<E> *)p)->size + 12;\n  711 | \n  712 |       cus.push_back(Compunit{kind, p - begin, size, (i32)file_idx});\n  713 |       p += size;\n  714 |     }","lines":11,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/gdb-index.cc#L704-L714"},{"ref":"src/gdb-index.cc:636-654","code":"  636 |   Compunit *cu = get_cu(hdr.debug_info_offset);\n  637 |   i64 size = hdr.size + offsetof(PubnamesHdr, size) + sizeof(hdr.size);\n  638 |   u8 *p = (u8 *)&hdr + sizeof(hdr);\n  639 |   u8 *end = (u8 *)&hdr + size;\n  640 | \n  641 |   while (p < end) {\n  642 |     if (*(Offset *)p == 0)\n  643 |       break;\n  644 |     p += sizeof(Offset);\n  645 | \n  646 |     u8 type = *p++;\n  647 |     const char *name = (char *)p;\n  648 |     i64 len = strlen(name);\n  649 |     p += len + 1;\n  650 |     cu->names.emplace_back(\n  651 |       hash_string(std::string_view(name, len)), type, name);\n  652 |   }\n  653 | \n  654 |   return size;","lines":19,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/gdb-index.cc#L636-L654"},{"ref":"src/gdb-index.cc:680-685","code":"  680 |     while (p < end) {\n  681 |       if (*(U32<E> *)p == 0xffff'ffff)\n  682 |         p += read_pubnames_cu(ctx, *(PubnamesHdr64<E> *)p, cus, file);\n  683 |       else\n  684 |         p += read_pubnames_cu(ctx, *(PubnamesHdr32<E> *)p, cus, file);\n  685 |     }","lines":6,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/gdb-index.cc#L680-L685"}]},{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`R_LARCH_ALIGN` with a non-zero `r_sym` stores `log2(alignment)` in the low 8 bits of\n`r_addend`, and the code computes `alignment = 1 << r.r_addend`. `r_addend` comes straight\nfrom an input object file and is only checked for `r.r_addend >> 8`, so any value in\n`[31, 255]` shifts a 32-bit `int` by more than its width - undefined behaviour - and values\naround 31 produce a negative `alignment`. `align_to()` then asserts `has_single_bit(align)`\n(disabled with `NDEBUG`), and `actual = P + alignment - 4` can make `remove()` subtract more\nbytes than the section contains, leaving `isec.sh_size` negative at line 1052.","fix":"Use a 64-bit shift and bound the exponent, e.g.:\n```\n-        alignment = 1 << r.r_addend;\n+        if (r.r_addend > 31)\n+          Fatal(ctx) << isec << \": R_LARCH_ALIGN: alignment too large: \" << i;\n+        alignment = 1LL << r.r_addend;\n```\nand additionally verify that `actual - desired` does not exceed the remaining section size.","locations":[{"ref":"src/arch-loongarch.cc:924-934","code":"  924 |       i64 alignment;\n  925 |       if (r.r_sym) {\n  926 |         if (r.r_addend >> 8)\n  927 |           Fatal(ctx) << isec << \": ternary R_LARCH_ALIGN is not supported: \" << i;\n  928 |         alignment = 1 << r.r_addend;\n  929 |       } else {\n  930 |         if (!has_single_bit(r.r_addend + 4))\n  931 |           Fatal(ctx) << isec << \": R_LARCH_ALIGN: invalid alignment requirement: \"\n  932 |                      << i;\n  933 |         alignment = r.r_addend + 4;\n  934 |       }","lines":11,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/arch-loongarch.cc#L924-L934"}]},{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"`r_addend` of `R_RISCV_ALIGN` is used unvalidated as a byte count. `shrink_section`\ncomputes `remove(actual - desired)` from it and finally does `isec.sh_size -= r_delta`\n(`sh_size` is a signed `i64`, so it can go negative), and `apply_reloc_alloc` runs\n`for (; i <= padding_bytes - 4; i += 4) *(ul32 *)(loc + i) = nop;` where\n`padding_bytes = rel.r_addend - removed_bytes`. Nothing checks that the padding fits inside\nthe section, so an object file with a large `R_RISCV_ALIGN` addend makes mold write NOPs far\npast the end of the section's slice of the output buffer (heap/mmap overflow) and/or produce a\nnegative section size. Unlike a bad `r_offset` (which mold generally trusts), this addend\ndrives an unbounded *loop* of stores and is trivially bounded.","fix":"Validate the addend when the relocation is scanned or at the top of the `R_RISCV_ALIGN`\nhandling, e.g. reject `r_addend < 0`, `r_addend & 1`, or\n`r_offset + r_addend > isec.get_contents().size()` with a `Fatal`, and keep the\n`assert((padding_bytes & 1) == 0)` as a real check rather than an assertion.","locations":[{"ref":"src/arch-riscv.cc:621-638","code":"  621 |     case R_RISCV_ALIGN: {\n  622 |       // A R_RISCV_ALIGN is followed by a NOP sequence. We need to remove\n  623 |       // zero or more bytes so that the instruction after R_RISCV_ALIGN is\n  624 |       // aligned to a given alignment boundary.\n  625 |       //\n  626 |       // We need to guarantee that the NOP sequence is valid after byte\n  627 |       // removal (e.g. we can't remove the first 2 bytes of a 4-byte NOP).\n  628 |       // For the sake of simplicity, we always rewrite the entire NOP sequence.\n  629 |       i64 padding_bytes = rel.r_addend - removed_bytes;\n  630 |       assert((padding_bytes & 1) == 0);\n  631 | \n  632 |       i64 i = 0;\n  633 |       for (; i <= padding_bytes - 4; i += 4)\n  634 |         *(ul32 *)(loc + i) = 0x0000'0013; // nop\n  635 |       if (i < padding_bytes)\n  636 |         *(ul16 *)(loc + i) = 0x0001;      // c.nop\n  637 |       break;\n  638 |     }","lines":18,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/arch-riscv.cc#L621-L638"},{"ref":"src/arch-riscv.cc:912-921","code":"  912 |     if (r.r_type == R_RISCV_ALIGN) {\n  913 |       // The total bytes of NOPs is stored to r_addend, so the next\n  914 |       // instruction is r_addend away.\n  915 |       u64 P = isec.get_addr() + r.r_offset - r_delta;\n  916 |       u64 desired = align_to(P, bit_ceil(r.r_addend));\n  917 |       u64 actual = P + r.r_addend;\n  918 |       if (desired != actual)\n  919 |         remove(actual - desired);\n  920 |       continue;\n  921 |     }","lines":10,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/arch-riscv.cc#L912-L921"}]},{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"All `.gdb_index` header offsets are 32-bit (`SectionHeader` uses `ul32`), and\nthe code assigns 64-bit sums to them without any check:\n`hdr.cu_types_offset = hdr.cu_list_offset + cus.size() * 16`,\n`hdr.symtab_offset += cu.ranges.size() * 20`,\n`hdr.const_pool_offset = hdr.symtab_offset + ht_size * 8`. Similarly, the type\nvector entries pack the compile-unit number into the low 24 bits\n(`(name.type << 24) | i`), so a link with more than 2^24 compile units silently\ncorrupts the type byte. On a very large debug link the constant pool alone can\nexceed 4 GiB; the result is a silently truncated header and a `.gdb_index` that\nmakes gdb read garbage, instead of a clear error.","fix":"Compute the sizes in `i64`, then check each against `UINT32_MAX` (and\n`cus.size()` against `1 << 24`) before storing into the header, and\n`Fatal(ctx) << \"--gdb-index: index is too large\"` when a limit is exceeded.","locations":[{"ref":"src/gdb-index.cc:956-969","code":"  956 |   SectionHeader hdr;\n  957 |   hdr.cu_list_offset = sizeof(hdr);\n  958 |   hdr.cu_types_offset = hdr.cu_list_offset + cus.size() * 16;\n  959 |   hdr.ranges_offset = hdr.cu_types_offset;\n  960 | \n  961 |   hdr.symtab_offset = hdr.ranges_offset;\n  962 |   for (Compunit &cu : cus)\n  963 |     hdr.symtab_offset += cu.ranges.size() * 20;\n  964 | \n  965 |   i64 ht_size = data.ht_size;\n  966 |   hdr.const_pool_offset = hdr.symtab_offset + ht_size * 8;\n  967 | \n  968 |   i64 bufsize = hdr.const_pool_offset + data.pool_size.type_bytes +\n  969 |                 data.pool_size.name_bytes;","lines":14,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/gdb-index.cc#L956-L969"},{"ref":"src/gdb-index.cc:887-895","code":"  887 |   tbb::parallel_for_each(cus, [&](Compunit &cu) {\n  888 |     i64 i = &cu - cus.data();\n  889 |     for (NameRecord &record : cu.names) {\n  890 |       IndexedName &name = record.indexed;\n  891 |       MapValue *ent = name.entry;\n  892 |       ul32 *p = (ul32 *)(base + ent->type_offset);\n  893 |       p[name.type_idx] = (name.type << 24) | i;\n  894 |     }\n  895 |   });","lines":9,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/gdb-index.cc#L887-L895"}]},{"id":"OVF_8","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"The Win32 `open_file_impl()` calls\n`CreateFileMapping(fd, nullptr, PAGE_READONLY, 0, size, nullptr)`. The 4th and\n5th parameters are `dwMaximumSizeHigh` and `dwMaximumSizeLow`, both `DWORD`.\nPassing `0` for the high word and the full `u64 size` for the low word\ntruncates any file larger than 4 GiB to `size & 0xffffffff`, producing a mapping\nthat is too small (or zero-sized, which then means \"whole file\" only by\naccident). Linking a >4 GiB input archive on Windows silently maps the wrong\nrange.","fix":"Pass `0, 0` (which means \"map the whole file\") or split the size correctly:\n```c++\nHANDLE h = CreateFileMapping(fd, nullptr, PAGE_READONLY,\n                             (DWORD)(size >> 32), (DWORD)size, nullptr);\n```","locations":[{"ref":"src/mapped-file-win32.cc:37-51","code":"   37 |   if (size > 0) {\n   38 |     HANDLE h = CreateFileMapping(fd, nullptr, PAGE_READONLY, 0, size, nullptr);\n   39 |     if (!h) {\n   40 |       error = path + \": CreateFileMapping failed: \" + errno_string();\n   41 |       return nullptr;\n   42 |     }\n   43 | \n   44 |     mf->data = (u8 *)MapViewOfFile(h, FILE_MAP_COPY, 0, 0, size);\n   45 |     CloseHandle(h);\n   46 | \n   47 |     if (!mf->data) {\n   48 |       error = path + \": MapViewOfFile failed: \" + errno_string();\n   49 |       return nullptr;\n   50 |     }\n   51 |   }","lines":15,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mapped-file-win32.cc#L37-L51"}]},{"id":"OVF_9","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`FdeRecord<E>::cie_idx` is a `u16`, but it is assigned from an `i64` index into\n`ObjectFile<E>::cies`:\n\n```cpp\nfdes[i].cie_idx = find_cie(fdes[i].input_offset + 4 - cie_offset);\n```\n(`src/input-files.cc:709`)\n\nAn object file with more than 65535 CIE records in its `.eh_frame` (possible for\n`ld -r` output, huge LTO objects, or a deliberately crafted file) silently wraps\nthe index. `FdeRecord::size()`, `get_contents()` and `get_rels()` then read\n`file.cies[cie_idx]` for the wrong CIE, producing a corrupt `.eh_frame` or an\nout-of-bounds read. The same constructor also narrows `i64 begin_offset` and\n`i64 rel_begin` into the `u32` fields `input_offset` and `rel_idx` without a\ncheck.","fix":"Widen `cie_idx` to `u32` (the struct is 8-byte aligned already, so on most\ntargets this costs nothing) and add a check where it is assigned:\n\n```cpp\n-  u16 cie_idx = -1;\n+  u32 cie_idx = -1;\n```\n\nplus `if (idx > UINT32_MAX) Fatal(ctx) << ...;` in `parse_ehframe()`.","locations":[{"ref":"src/mold.h:472-499","code":"  472 | template <typename E>\n  473 | struct FdeRecord {\n  474 |   FdeRecord(u32 input_offset, u32 rel_idx)\n  475 |     : input_offset(input_offset), rel_idx(rel_idx) {}\n  476 | \n  477 |   i64 size(ObjectFile<E> &file) const {\n  478 |     return *(U32<E> *)(file.cies[cie_idx].contents.data() + input_offset) + 4;\n  479 |   }\n  480 | \n  481 |   std::string_view get_contents(ObjectFile<E> &file) const {\n  482 |     return file.cies[cie_idx].contents.substr(input_offset, size(file));\n  483 |   }\n  484 | \n  485 |   std::span<ElfRel<E>> get_rels(ObjectFile<E> &file) const {\n  486 |     std::span<ElfRel<E>> rels = file.cies[cie_idx].rels;\n  487 |     i64 end = input_offset + size(file);\n  488 |     i64 i = rel_idx;\n  489 |     while (i < rels.size() && rels[i].r_offset < end)\n  490 |       i++;\n  491 |     return rels.subspan(rel_idx, i - rel_idx);\n  492 |   }\n  493 | \n  494 |   u32 input_offset = -1;\n  495 |   u32 output_offset = -1;\n  496 |   u32 rel_idx = -1;\n  497 |   u16 cie_idx = -1;\n  498 |   Atomic<bool> is_alive = true;\n  499 | };","lines":28,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mold.h#L472-L499"}]},{"id":"OVF_10","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"`bits()` builds its mask with `((1LL << (hi - lo + 1)) - 1)`. `1LL` is a *signed* 64-bit literal,\nso a width of 63 shifts into the sign bit (implementation-defined/UB in C++17 and earlier, and a\nsanitizer report today) and a width of 64 — i.e. `bits(val, 63, 0)` — is an undefined shift by the\nfull operand width. The helper is documented as \"Returns [hi:lo] bits of val\" with no width\nrestriction and is used pervasively in the `arch-*.cc` files.\n\n`bit_ceil()` has the same class of bug: `1LL << (64 - std::countl_zero(val))` is UB whenever\n`val > (1ULL << 62)` (shift into or past the sign bit). `bit_ceil()` is called from\n`ConcurrentMap::resize()` with a caller-supplied bucket estimate.","fix":"Use unsigned literals and handle the full-width case.\n\nBefore:\n```cpp\ninline u64 bits(u64 val, u64 hi, u64 lo) {\n  return (val >> lo) & ((1LL << (hi - lo + 1)) - 1);\n}\n```\n\nAfter:\n```cpp\ninline u64 bits(u64 val, u64 hi, u64 lo) {\n  u64 width = hi - lo + 1;\n  u64 mask = (width >= 64) ? ~(u64)0 : ((1ULL << width) - 1);\n  return (val >> lo) & mask;\n}\n```\n\nFor `bit_ceil()`, just forward to `std::bit_ceil` (the comment claiming libraries lack it is\nstale — `lib/arena.cc:49` already calls `std::has_single_bit` directly).","locations":[{"ref":"lib/lib.h:270-273","code":"  270 | // Returns [hi:lo] bits of val.\n  271 | inline u64 bits(u64 val, u64 hi, u64 lo) {\n  272 |   return (val >> lo) & ((1LL << (hi - lo + 1)) - 1);\n  273 | }","lines":4,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/lib/lib.h#L270-L273"},{"ref":"lib/lib.h:212-217","code":"  212 | // Some C++ libraries haven't implemented std::bit_ceil yet.\n  213 | inline u64 bit_ceil(u64 val) {\n  214 |   if (has_single_bit(val))\n  215 |     return val;\n  216 |   return 1LL << (64 - std::countl_zero(val));\n  217 | }","lines":6,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/lib/lib.h#L212-L217"}]},{"id":"OVF_11","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"`uleb_size()` loops `for (int i = 1; i < 9; i++)` and returns `9` as a fallback, but ULEB128\nencoding of a `u64` needs **10** bytes for values `>= 2^63` (9 bytes cover only 63 bits).\n`write_uleb()` will happily emit those 10 bytes. Any caller that sizes a buffer with\n`uleb_size()` and then fills it with `write_uleb()` overflows the buffer by one byte for such\nvalues.","fix":"Before:\n```cpp\ninline i64 uleb_size(u64 val) {\n  for (int i = 1; i < 9; i++)\n    if (val < (1LL << (7 * i)))\n      return i;\n  return 9;\n}\n```\n\nAfter:\n```cpp\ninline i64 uleb_size(u64 val) {\n  for (int i = 1; i < 10; i++)\n    if (i == 10 || val < (1ULL << (7 * i)))\n      return i;\n  return 10;\n}\n```\n(or simply `return std::max<i64>(1, (std::bit_width(val) + 6) / 7);`)","locations":[{"ref":"lib/lib.h:425-430","code":"  425 | inline i64 uleb_size(u64 val) {\n  426 |   for (int i = 1; i < 9; i++)\n  427 |     if (val < (1LL << (7 * i)))\n  428 |       return i;\n  429 |   return 9;\n  430 | }","lines":6,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/lib/lib.h#L425-L430"},{"ref":"lib/lib.h:368-376","code":"  368 | inline i64 write_uleb(u8 *buf, u64 val) {\n  369 |   i64 i = 0;\n  370 |   do {\n  371 |     u8 byte = val & 0x7f;\n  372 |     val >>= 7;\n  373 |     buf[i++] = val ? (byte | 0x80) : byte;\n  374 |   } while (val);\n  375 |   return i;\n  376 | }","lines":9,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/lib/lib.h#L368-L376"}]},{"id":"OVF_12","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`parse_number` and `parse_hex` return `i64` but convert with `std::stoul`, whose result type\nis `unsigned long` - 32 bits on Windows (LLP64) and on any ILP32 host. Options that\nlegitimately take 64-bit values (`--image-base`, `-z max-page-size`, `-z stack-size`,\n`--Ttext`, `--section-start`, `--defsym`) are therefore silently truncated on those\nplatforms, e.g. `--image-base=0x100000000` becomes `0`. mold explicitly supports Windows\n(see `src/mapped-file-win32.cc`, `subprocess-win32.cc`).","fix":"Use `std::stoull` (or, better, `std::from_chars` into a `u64`) in both helpers and range-check\nthe result before narrowing to `i64`.","locations":[{"ref":"src/cmdline.cc:412-439","code":"  412 | template <typename E>\n  413 | static i64 parse_hex(Context<E> &ctx, std::string opt, std::string_view value) {\n  414 |   auto flags = std::regex_constants::optimize | std::regex_constants::ECMAScript;\n  415 |   static std::regex re(R\"((?:0x|0X)?([0-9a-fA-F]+))\", flags);\n  416 | \n  417 |   std::cmatch m;\n  418 |   if (!std::regex_match(value.data(), value.data() + value.size(), m, re))\n  419 |     Fatal(ctx) << \"option -\" << opt << \": not a hexadecimal number\";\n  420 |   return std::stoul(m[1], nullptr, 16);\n  421 | }\n  422 | \n  423 | template <typename E>\n  424 | static i64 parse_number(Context<E> &ctx, std::string opt,\n  425 |                         std::string_view value) {\n  426 |   size_t nread;\n  427 | \n  428 |   if (value.starts_with('-')) {\n  429 |     i64 ret = std::stoul(std::string(value.substr(1)), &nread, 0);\n  430 |     if (value.size() - 1 != nread)\n  431 |       Fatal(ctx) << \"option -\" << opt << \": not a number: \" << value;\n  432 |     return -ret;\n  433 |   }\n  434 | \n  435 |   i64 ret = std::stoul(std::string(value), &nread, 0);\n  436 |   if (value.size() != nread)\n  437 |     Fatal(ctx) << \"option -\" << opt << \": not a number: \" << value;\n  438 |   return ret;\n  439 | }","lines":28,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/cmdline.cc#L412-L439"}]},{"id":"OVF_13","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"The 32-bit `ElfRel<E>` specializations store `r_type` in a `u8` and `r_sym` in a\n`U24<E>`, but the constructor takes both as `u32` and assigns them with a silent\nnarrowing conversion. A relocation type above 255 or a symbol index above\n0xffffff is truncated without any diagnostic, producing a wrong relocation in\nthe output (`--relocatable` and `--emit-relocs` construct `ElfRel` objects\ndirectly). The 24-bit symbol index is a hard 16M-symbol limit for 32-bit\ntargets that is not documented or checked anywhere.","fix":"Assert the ranges in the constructor for the narrow cases:\n```cpp\nElfRel(u64 offset, u32 type, u32 sym, i64 addend = 0)\n    : r_offset(offset), r_type(type), r_sym(sym) {\n  if constexpr (!E::is_64)\n    assert(type <= 0xff && sym <= 0xffffff);\n}\n```\nand report a `Fatal` at the (few) call sites that can exceed the limits.","locations":[{"ref":"src/elf.h:1734-1754","code":" 1734 | template <typename E> requires (E::is_le && !E::is_rela)\n 1735 | struct ElfRel<E> {\n 1736 |   ElfRel() = default;\n 1737 |   ElfRel(u64 offset, u32 type, u32 sym, i64 addend = 0)\n 1738 |     : r_offset(offset), r_type(type), r_sym(sym) {}\n 1739 | \n 1740 |   Word<E> r_offset;\n 1741 |   std::conditional_t<E::is_64, U32<E>, u8> r_type;\n 1742 |   std::conditional_t<E::is_64, U32<E>, U24<E>> r_sym;\n 1743 | };\n 1744 | \n 1745 | template <typename E> requires (!E::is_le && !E::is_rela)\n 1746 | struct ElfRel<E> {\n 1747 |   ElfRel() = default;\n 1748 |   ElfRel(u64 offset, u32 type, u32 sym, i64 addend = 0)\n 1749 |     : r_offset(offset), r_sym(sym), r_type(type) {}\n 1750 | \n 1751 |   Word<E> r_offset;\n 1752 |   std::conditional_t<E::is_64, U32<E>, U24<E>> r_sym;\n 1753 |   std::conditional_t<E::is_64, U32<E>, u8> r_type;\n 1754 | };","lines":21,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/elf.h#L1734-L1754"},{"ref":"src/elf.h:1710-1732","code":" 1710 | template <typename E> requires (E::is_le && E::is_rela)\n 1711 | struct ElfRel<E> {\n 1712 |   ElfRel() = default;\n 1713 |   ElfRel(u64 offset, u32 type, u32 sym, i64 addend)\n 1714 |     : r_offset(offset), r_type(type), r_sym(sym), r_addend(addend) {}\n 1715 | \n 1716 |   Word<E> r_offset;\n 1717 |   std::conditional_t<E::is_64, U32<E>, u8> r_type;\n 1718 |   std::conditional_t<E::is_64, U32<E>, U24<E>> r_sym;\n 1719 |   SWord<E> r_addend;\n 1720 | };\n 1721 | \n 1722 | template <typename E> requires (!E::is_le && E::is_rela)\n 1723 | struct ElfRel<E> {\n 1724 |   ElfRel() = default;\n 1725 |   ElfRel(u64 offset, u32 type, u32 sym, i64 addend)\n 1726 |     : r_offset(offset), r_sym(sym), r_type(type), r_addend(addend) {}\n 1727 | \n 1728 |   Word<E> r_offset;\n 1729 |   std::conditional_t<E::is_64, U32<E>, U24<E>> r_sym;\n 1730 |   std::conditional_t<E::is_64, U32<E>, u8> r_type;\n 1731 |   SWord<E> r_addend;\n 1732 | };","lines":23,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/elf.h#L1710-L1732"}]},{"id":"OVF_14","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"`find_cu_abbrev` reads the abbrev declaration code as `u32 code =\nread_uleb(&abbrev)` while the code it is matched against, `abbrev_code`, is\nstored in an `i64`. A ULEB value above 2^32 is truncated in `code` but not in\n`abbrev_code`, so the comparison can never succeed and the loop keeps scanning\nthe abbrev table until it falls off the end of `.debug_abbrev`. It can also\nproduce a spurious match when a large declaration code truncates to the same\nlow 32 bits as `abbrev_code`.","fix":"Use the same width for both: change `u32 code = read_uleb(&abbrev);` to\n`u64 code = read_uleb(&abbrev);` and `i64 abbrev_code = read_uleb(p);` to\n`u64 abbrev_code = read_uleb(p);`.","locations":[{"ref":"src/gdb-index.cc:315-336","code":"  315 |   i64 abbrev_code = read_uleb(p);\n  316 | \n  317 |   // Find a .debug_abbrev record corresponding to the .debug_info record.\n  318 |   // We assume the .debug_info record at a given offset is of\n  319 |   // DW_TAG_compile_unit which describes a compunit.\n  320 |   u8 *abbrev = &ctx.debug_abbrev[0] + hdr.abbrev_offset;\n  321 | \n  322 |   for (;;) {\n  323 |     u32 code = read_uleb(&abbrev);\n gh buffer for .gnu.version_r.\n 3092 |   contents.resize((sizeof(ElfVerneed<E>) + sizeof(ElfVernaux<E>)) *\n 3093 |                   (syms.size() + 1));","lines":3,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/output-chunks.cc#L3091-L3093"},{"ref":"src/output-chunks.cc:3116-3130","code":" 3116 |   auto start_group = [&](SharedFile<E> &file) {\n 3117 |     this->shdr.sh_info++;\n 3118 |     if (verneed)\n 3119 |       verneed->vn_next = ptr - (u8 *)verneed;\n 3120 | \n 3121 |     verneed = (ElfVerneed<E> *)ptr;\n 3122 |     ptr += sizeof(ElfVerneed<E>);\n 3123 |     verneed->vn_version = 1;\n 3124 |     verneed->vn_file = ctx.dynstr->find_string(file.soname);\n 3125 |     verneed->vn_aux = sizeof(ElfVerneed<E>);\n 3126 |     aux = nullptr;\n 3127 | \n 3128 |     if (ctx.arg.pack_dyn_relocs_relr && is_glibc2(file))\n 3129 |       add_entry(\"GLIBC_ABI_DT_RELR\");\n 3130 |   };","lines":15,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/output-chunks.cc#L3116-L3130"}]},{"id":"OVF_19","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"Alignments are reconstructed with an `int` shift: `1 << p2align`. `p2align`\ncomes from `to_p2align()` in `src/input-sections.cc`, which is\n`std::countr_zero(sh_addralign)` on a `u64` with no validation that\n`sh_addralign` is a power of two or bounded, so it can be up to 63. `1 << 31`\nsign-extends to `0xffff'ffff'8000'0000` when stored into the `u64`\n`sh_addralign`, and any value `>= 32` is undefined behaviour. The same\npattern appears in the thunk placement math in `thunks.cc`, where a bogus\nalignment corrupts section offsets.","fix":"Shift a 64-bit value and reject absurd alignments when parsing:\nbefore `osec->shdr.sh_addralign = 1 << p2align;`\nafter  `osec->shdr.sh_addralign = (u64)1 << p2align;`\n(likewise `align_to(offset, (u64)1 << m[d]->p2align)`), and have `to_p2align()` reject non-power-of-two / oversized `sh_addralign` values with a `Fatal`.","locations":[{"ref":"src/passes.cc:771-780","code":"  771 |   for (std::unique_ptr<OutputSection<E>> &osec : ctx.osec_pool) {\n  772 |     Atomic<u32> p2align;\n  773 |     tbb::parallel_for((i64)0, (i64)ctx.objs.size(), [&](i64 i) {\n  774 |       u32 x = 0;\n  775 |       for (InputSection<E> *isec : osec->members_vec[i])\n  776 |         x = std::max<u32>(x, isec->p2align);\n  777 |       update_maximum(p2align, x);\n  778 |     });\n  779 |     osec->shdr.sh_addralign = 1 << p2align;\n  780 |   }","lines":10,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/passes.cc#L771-L780"},{"ref":"src/thunks.cc:154-165","code":"  154 |     auto d_thunk_end = [&] {\n  155 |       u64 d_end = align_to(offset, 1 << m[d]->p2align) + m[d]->sh_size;\n  156 |       return align_to(d_end, thunk_align) + max_thunk_size;\n  157 |     };\n  158 | \n  159 |     while (d < m.size() &&\n  160 |            (b == d || d_thunk_end() <= m[b]->offset + branch_distance<E>)) {\n  161 |       offset = align_to(offset, 1 << m[d]->p2align);\n  162 |       m[d]->offset = offset;\n  163 |       offset += m[d]->sh_size;\n  164 |       d++;\n  165 |     }","lines":12,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/thunks.cc#L154-L165"},{"ref":"src/thunks.cc:293-296","code":"  293 |         m = m.subspan(1);\n  294 |       } else {\n  295 |         offset = align_to(offset, thunk_align);\n  296 |         t[0]->offset = offset;","lines":4,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/thunks.cc#L293-L296"}]},{"id":"OVF_20","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`set_virtual_addresses_regular()`/`set_virtual_addresses_by_order()` accumulate\naddresses in a `u64` and store them into `chunk->shdr.sh_addr`, which is a\n32-bit field for ELF32 targets (i386, ARM32, RV32, PPC32, LoongArch32). No\npass checks that the final address or `set_file_offsets()`'s return value fits;\n`set_osec_offsets()` just returns the `i64` file size. An over-4 GiB ELF32\nlayout (or an `--image-base`/`--section-start` value near the top of the\naddress space) is therefore silently truncated, producing an output file with\nnonsense addresses instead of a diagnostic. `addr += sh_size` can also wrap\naround `2^64` on 64-bit targets with an absurd `--section-start`.","fix":"After address assignment, verify that `addr` (and each `sh_addr + sh_size`) fits in `sizeof(Word<E>) * 8` bits and that the address never decreases unexpectedly; emit `Fatal(ctx) << \"output file too large\"` otherwise. Do the same for the file size returned by `set_file_offsets()`.","locations":[{"ref":"src/passes.cc:2805-2891","code":" 2805 |   for (i64 i = 0; i < chunks.size(); i++) {\n 2806 |     if (!(chunks[i]->shdr.sh_flags & SHF_ALLOC))\n 2807 |       continue;\n 2808 | \n 2809 |     // .relro_padding is a padding section to extend a PT_GNU_RELRO\n 2810 |     // segment to cover an entire page. Technically, we don't need a\n 2811 |     // .relro_padding section because we can leave a trailing part of a\n 2812 |     // segment an unused space. However, the `strip` command would delete\n 2813 |     // such an unused trailing part and make an executable invalid.\n 2814 |     // So we add a dummy section.\n 2815 |     if (chunks[i] == ctx.relro_padding) {\n 2816 |       chunks[i]->shdr.sh_addr = addr;\n 2817 |       chunks[i]->shdr.sh_size = align_to(addr, ctx.page_size) - addr;\n 2818 |       addr += ctx.page_size;\n 2819 |       continue;\n 2820 |     }\n 2821 | \n 2822 |     // Handle --section-start first\n 2823 |     if (auto it = ctx.arg.section_start.find(chunks[i]->name);\n 2824 |         it != ctx.arg.section_start.end()) {\n 2825 |       addr = it->second;\n 2826 |       chunks[i]->shdr.sh_addr = addr;\n 2827 |       addr += chunks[i]->shdr.sh_size;\n 2828 |       continue;\n 2829 |     }\n 2830 | \n 2831 |     // Memory protection works at page size granularity. We need to\n 2832 |     // put sections with different memory attributes into different\n 2833 |     // pages. We do it by inserting paddings here.\n 2834 |     if (i > 0 && chunks[i - 1] != ctx.relro_padding) {\n 2835 |       i64 flags1 = get_flags(chunks[i - 1]);\n 2836 |       i64 flags2 = get_flags(chunks[i]);\n 2837 | \n 2838 |       if (!ctx.arg.nmagic && flags1 != flags2) {\n 2839 |         switch (ctx.arg.z_separate_code) {\n 2840 |         case SEPARATE_LOADABLE_SEGMENTS:\n 2841 |           addr = align_to(addr, ctx.page_size);\n 2842 |           break;\n 2843 |         case SEPARATE_CODE:\n 2844 |           if ((flags1 & PF_X) != (flags2 & PF_X)) {\n 2845 |             addr = align_to(addr, ctx.page_size);\n 2846 |             break;\n 2847 |           }\n 2848 |           [[fallthrough]];\n 2849 |         case NOSEPARATE_CODE:\n 2850 |           if (addr % ctx.page_size != 0)\n 2851 |             addr += ctx.page_size;\n 2852 |           break;\n 2853 |         default:\n 2854 |           unreachable();\n 2855 |         }\n 2856 |       }\n 2857 |     }\n 2858 | \n 2859 |     // TLS sections are included only in PT_LOAD but also in PT_TLS.\n 2860 |     // We align the first TLS section so that the PT_TLS segment starts\n 2861 |     // at an address that meets the segment's alignment requirement.\n 2862 |     if (is_tls(chunks[i]) && (i == 0 || !is_tls(chunks[i - 1])))\n 2863 |       addr = align_to(addr, get_tls_segment_alignment(ctx));\n 2864 | \n 2865 |     // TLS BSS sections are laid out so that they overlap with the\n 2866 |     // subsequent non-tbss sections. Overlapping is fine because a STT_TLS\n 2867 |     // segment contains an initialization image for newly-created threads,\n 2868 |     // and no one except the runtime reads its contents. Even the runtime\n 2869 |     // doesn't need a BSS part of a TLS initialization image;
