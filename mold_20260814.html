*)loc = sym.get_gottp_addr(ctx) + A - GOT;\n  420 |       } else {\n  421 |         u32 insn = relax_tlsdesc_to_le(loc - 2);\n  422 |         if (!insn)\n  423 |           Fatal(ctx) << *this << \": illegal instruction sequence for TLSDESC\";\n  424 |         loc[-2] = insn >> 8;","lines":12,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/arch-i386.cc#L413-L424"}]},{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"very_easy","description":"The `check` lambda in `apply_reloc_nonalloc` passes its arguments to `check_range` in the\nwrong order. The signature is\n`check_range(Context<E> &ctx, i64 i, i64 val, i64 lo, i64 hi)` (`src/mold.h:578`), but both\nbackends call `check_range(ctx, val, i, lo, hi)`. Consequently the relocation *index* `i`\nis range-checked instead of the relocation value, so the only user\n(`check(S + A, 0, 1LL << 32)` for `R_PPC64_ADDR32` / `R_390_32`) never reports an overflow -\n`i` is always inside `[0, 2^32)`. Worse, if the check ever did fire, `check_range` would\nevaluate `get_rels(ctx)[val]` with `val` being an arbitrary 64-bit address, an\nout-of-bounds read. The `apply_reloc_alloc` twins in the same files use the correct order\n(`src/arch-s390x.cc:144-146`, `src/arch-ppc64v2.cc:381-383`).","fix":"Swap the two arguments:\n```\n     auto check = [&](i64 val, i64 lo, i64 hi) {\n-      check_range(ctx, val, i, lo, hi);\n+      check_range(ctx, i, val, lo, hi);\n     };\n```","locations":[{"ref":"src/arch-ppc64v1.cc:305-307","code":"  305 |     auto check = [&](i64 val, i64 lo, i64 hi) {\n  306 |       check_range(ctx, val, i, lo, hi);\n  307 |     };","lines":3,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/arch-ppc64v1.cc#L305-L307"},{"ref":"src/arch-s390x.cc:364-366","code":"  364 |     auto check = [&](i64 val, i64 lo, i64 hi) {\n  365 |       check_range(ctx, val, i, lo, hi);\n  366 | d/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/arch-ppc64v2.cc#L213-L222"},{"ref":"src/arch-ppc64v2.cc:97-101","code":"   97 | static void write34(u8 *loc, u64 x) {\n   98 |   ul32 *buf = (ul32 *)loc;\n   99 |   buf[0] = (buf[0] & 0xfffc'0000) | bits(x, 33, 16);\n  100 |   buf[1] = (buf[1] & 0xffff'0000) | bits(x, 15, 0);\n  101 | }","lines":5,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/arch-ppc64v2.cc#L97-L101"}]},{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"All numeric option parsing goes through `std::stoul`/`std::stoull`/`std::stoi`, which throw\n`std::out_of_range` (and `std::invalid_argument`) on unrepresentable input. Nothing in mold\ncatches them, so `mold --image-base=0xffffffffffffffffff`, `--Ttext=fffffffffffffffffff`,\n`--section-order '=99999999999999999999'` or a kernel version string with a huge component\nterminate the process via `std::terminate` with an unhandled-exception abort instead of the\nusual `mold: error: ...` message. The affected helpers are `parse_hex` (`std::stoul`),\n`parse_number` (`std::stoul`), `parse_section_order` (`std::stoull`),\n`parse_defsym_value` (`std::stoull`) and `parse_kernel_version` (`std::stoi`).","fix":"Wrap the conversions (e.g. a small `to_u64(std::string_view, int base, bool &ok)` helper\nusing `std::from_chars`, which is non-throwing and does not allocate) and call\n`Fatal(ctx) << \"option -\" << opt << \": number out of range: \" << value;` on failure.\n`std::from_chars` also removes the temporary `std::string` allocations these helpers make.","locations":[{"ref":"src/cmdline.cc:412-439","code":"  412 | template <typename E>\n  413 | static i64 parse_hex(Context<E> &ctx, std::string opt, std::string_view value) {\n  414 |   auto flags = std::regex_constants::optimize | std::regex_constants::ECMAScript;\n  415 |   static std::regex re(R\"((?:0x|0X)?([0-9a-fA-F]+))\", flags);\n  416 | \n  417 |   std::cmatch m;\n  418 |   if (!std::regex_match(value.data(), value.data() + value.size(), m, re))\n  419 |     Fatal(ctx) << \"option -\" << opt << \": not a hexadecimal number\";\n  420 |   return std::stoul(m[1], nullptr, 16);\n  421 | }\n  422 | \n  423 | template <typename E>\n  424 | static i64 parse_number(Context<E> &ctx, std::string opt,\n  425 |                         std::string_view value) {\n  426 |   size_t nread;\n  427 | \n  428 |   if (value.starts_with('-')) {\n  429 |     i64 ret = std::stoul(std::string(value.substr(1)), &nread, 0);\n  430 |     if (value.size() - 1 != nread)\n  431 |       Fatal(ctx) << \"option -\" << opt << \": not a number: \" << value;\n  432 |     return -ret;\n  433 |   }\n  434 | \n  435 |   i64 ret = std::stoul(std::string(value), &nread, 0);\n  436 |   if (value.size() != nread)\n  437 |     Fatal(ctx) << \"option -\" << opt << \": not a number: \" << value;\n  438 |   return ret;\n  439 | }","lines":28,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/cmdline.cc#L412-L439"},{"ref":"src/cmdline.cc:560-567","code":"  560 |     } else if (std::regex_match(tok.data(), tok.data() + tok.size(), m, re3)) {\n  561 |       ord.type = SectionOrder::ADDR;\n  562 |       std::string s = m[1];\n  563 |       ord.value = std::stoull(s, nullptr, s.starts_with(\"0x\") ? 16 : 10);\n  564 |     } else if (std::regex_match(tok.data(), tok.data() + tok.size(), m, re4)) {\n  565 |       ord.type = SectionOrder::ALIGN;\n  566 |       std::string s = m[1];\n  567 |       ord.value = std::stoull(s, nullptr, s.starts_with(\"0x\") ? 16 : 10);","lines":8,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/cmdline.cc#L560-L567"},{"ref":"src/cmdline.cc:607-616","code":"  607 | static std::tuple<int, int, int>\n  608 | parse_kernel_version(std::string str) {\n  609 |   auto flags = std::regex_constants::optimize | std::regex_constants::ECMAScript;\n  610 |   static std::regex re(R\"(^(\\d+)\\.(\\d+)\\.(\\d+))\", flags);\n  611 |   std::smatch m;\n  612 | \n  613 |   if (!std::regex_search(str, m, re))\n  614 |     return {0, 0, 0};\n  615 |   return {std::stoi(m[1]), std::stoi(m[2]), std::stoi(m[3])};\n  616 | }","lines":10,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/cmdline.cc#L607-L616"}]},{"id":"ERR_9","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"very_easy","description":"`--thread-count`/`--threads=` accept any number, including `0` and negatives, without\nvalidation. The value is stored in `ctx.arg.thread_count` and handed to\n`tbb::global_control(max_allowed_parallelism, get_thread_count(ctx))` in `src/main.cc:362`.\nTBB requires a parallelism level of at least 1; `0` violates that contract and a negative\nvalue is converted to a huge `size_t`, so `--thread-count 0` produces an assertion failure or\nundefined scheduler behaviour rather than a clean error message.","fix":"Validate right after parsing, e.g.:\n```\n     } else if (read_arg(\"thread-count\")) {\n       ctx.arg.thread_count = parse_number(ctx, \"thread-count\", arg);\n+      if (*ctx.arg.thread_count < 1)\n+        Fatal(ctx) << \"--thread-count: must be a positive number: \" << arg;\n```\nand the same for the `--threads=` branch.","locations":[{"ref":"src/cmdline.cc:1381-1388","code":" 1381 |     } else if (read_arg(\"thread-count\")) {\n 1382 |       ctx.arg.thread_count = parse_number(ctx, \"thread-count\", arg);\n 1383 |     } else if (read_flag(\"threads\")) {\n 1384 |       ctx.arg.thread_count.reset();\n 1385 |     } else if (read_flag(\"no-threads\")) {\n 1386 |       ctx.arg.thread_count = 1;\n 1387 |     } else if (read_eq(\"threads\")) {\n 1388 |       ctx.arg.thread_count = parse_number(ctx, \"threads\", arg);","lines":8,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/cmdline.cc#L1381-L1388"}]},{"id":"ERR_10","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`find_cu_abbrev` rejects any DWARF 5 unit type other than `DW_UT_compile`,\n`DW_UT_partial`, `DW_UT_skeleton` and `DW_UT_split_compile` with a `Fatal`.\n`DW_UT_type` (0x02) and `DW_UT_split_type` (0x06) are emitted into\n`.debug_info` by GCC and Clang with `-fdebug-types-section`, so linking such\nobjects with `--gdb-index` aborts with `--gdb-index: unknown unit type: 0x2`\ninstead of simply skipping the type unit (which carries no address ranges\nanyway). `.gdb_index` even has a dedicated \"types CU list\" section that mold\nalways leaves empty.","fix":"Add `DW_UT_type = 0x02` and `DW_UT_split_type = 0x06` to the `DW_UT_*` enum and\nhandle them in `read_compunits` by skipping the unit (do not create a\n`Compunit`), rather than failing the link in `find_cu_abbrev`.","locations":[{"ref":"src/gdb-index.cc:300-313","code":"  300 |   if constexpr (requires { hdr.unit_type; }) {\n  301 |     switch (hdr.unit_type) {\n  302 |     case DW_UT_compile:\n  303 |     case DW_UT_partial:\n  304 |       break;\n  305 |     case DW_UT_skeleton:\n  306 |     case DW_UT_split_compile:\n  307 |       *p += 8;\n  308 |       break;\n  309 |     default:\n  310 |       Fatal(ctx) << \"--gdb-index: unknown unit type: 0x\"\n  311 |                  << std::hex << hdr.unit_type;\n  312 |     }\n  313 |   }","lines":14,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/gdb-index.cc#L300-L313"},{"ref":"src/elf.h:1430-1435","code":" 1430 | enum : u32 {\n 1431 |   DW_UT_compile = 0x01,\n 1432 |   DW_UT_partial = 0x03,\n 1433 |   DW_UT_skeleton = 0x04,\n 1434 |   DW_UT_split_compile = 0x05,\n 1435 | };","lines":6,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/elf.h#L1430-L1435"}]},{"id":"ERR_11","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`read_scalar` covers only a subset of DWARF forms and aborts the *entire link*\nvia `Fatal` for anything else. Forms that are perfectly legal on a compile-unit\nDIE and are declared in `elf.h` but not handled include `DW_FORM_sdata`,\n`DW_FORM_block`/`block1`/`block2`/`block4`, `DW_FORM_exprloc`,\n`DW_FORM_data16`, `DW_FORM_ref_sig8`, `DW_FORM_strp_sup`, `DW_FORM_ref_sup4`/\n`ref_sup8`, `DW_FORM_indirect` and `DW_FORM_implicit_const`. A single\nunrecognized attribute in one object file makes `--gdb-index` fail the whole\nlink rather than degrading to \"no index entry for this compile unit\".","fix":"Implement the skippable forms (`sdata` -> `read_sleb`, `block*`/`exprloc` ->\nread the length and skip, `data16`/`ref_sig8`/`ref_sup8` -> fixed skips,\n`indirect` -> re-dispatch on a ULEB form code). For genuinely unknown forms,\nreport a warning and abandon indexing for that compile unit instead of calling\n`Fatal`.","locations":[{"ref":"src/gdb-index.cc:357-423","code":"  357 | template <typename E, typename Offset>\n  358 | u64 read_scalar(Context<E> &ctx, u8 **p, u64 form) {\n  359 |   switch (form) {\n  360 |   case DW_FORM_flag_present:\n  361 |     return 0;\n  362 |   case DW_FORM_data1:\n  363 |   case DW_FORM_flag:\n  364 |   case DW_FORM_strx1:\n  365 |   case DW_FORM_addrx1:\n  366 |   case DW_FORM_ref1:\n  367 |     return *(*p)++;\n  368 |   case DW_FORM_data2:\n  369 |   case DW_FORM_strx2:\n  370 |   case DW_FORM_addrx2:\n  371 |   case DW_FORM_ref2: {\n  372 |     u64 val = *(U16<E> *)*p;\n  373 |     *p += 2;\n  374 |     return val;\n  375 |   }\n  376 |   case DW_FORM_strx3:\n  377 |   case DW_FORM_addrx3: {\n  378 |     u64 val = *(U24<E> *)*p;\n  379 |     *p += 3;\n  380 |     return val;\n  381 |   }\n  382 |   case DW_FORM_data4:\n  383 |   case DW_FORM_strx4:\n  384 |   case DW_FORM_addrx4:\n  385 |   case DW_FORM_ref4: {\n  386 |     u64 val = *(U32<E> *)*p;\n  387 |     *p += 4;\n  388 |     return val;\n  389 |   }\n  390 |   case DW_FORM_data8:\n  391 |   case DW_FORM_ref8: {\n  392 |     u64 val = *(U64<E> *)*p;\n  393 |     *p += 8;\n  394 |     return val;\n  395 |   }\n  396 |   case DW_FORM_strp:\n  397 |   case DW_FORM_sec_offset:\n  398 |   case DW_FORM_line_strp: {\n  399 |     u64 val = *(Offset *)*p;\n  400 |     *p += sizeof(Offset);\n  401 |     return val;\n  402 |   }\n  403 |   case DW_FORM_addr:\n  404 |   case DW_FORM_ref_addr: {\n  405 |     u64 val = *(Word<E> *)*p;\n  406 |     *p += sizeof(Word<E>);\n  407 |     return val;\n  408 |   }\n  409 |   case DW_FORM_strx:\n  410 |   case DW_FORM_addrx:\n  411 |   case DW_FORM_udata:\n  412 |   case DW_FORM_ref_udata:\n  413 |   case DW_FORM_loclistx:\n  414 |   case DW_FORM_rnglistx:\n  415 |     return read_uleb(p);\n  416 |   case DW_FORM_string:\n  417 |     *p += strlen((char *)*p) + 1;\n  418 |     return 0;\n  419 |   default:\n  420 |     Fatal(ctx) << \"--gdb-index: unhandled debug info form: 0x\"\n  421 |                << std::hex << form;\n  422 |   }\n  423 | }","lines":67,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/gdb-index.cc#L357-L423"},{"ref":"src/elf.h:1437-1481","code":" 1437 | enum : u32 {\n 1438 |   DW_FORM_addr = 0x01,\n 1439 |   DW_FORM_block2 = 0x03,\n 1440 |   DW_FORM_block4 = 0x04,\n 1441 |   DW_FORM_data2 = 0x05,\n 1442 |   DW_FORM_data4 = 0x06,\n 1443 |   DW_FORM_data8 = 0x07,\n 1444 |   DW_FORM_string = 0x08,\n 1445 |   DW_FORM_block = 0x09,\n 1446 |   DW_FORM_block1 = 0x0a,\n 1447 |   DW_FORM_data1 = 0x0b,\n 1448 |   DW_FORM_flag = 0x0c,\n 1449 |   DW_FORM_sdata = 0x0d,\n 1450 |   DW_FORM_strp = 0x0e,\n 1451 |   DW_FORM_udata = 0x0f,\n 1452 |   DW_FORM_ref_addr = 0x10,\n 1453 |   DW_FORM_ref1 = 0x11,\n 1454 |   DW_FORM_ref2 = 0x12,\n 1455 |   DW_FORM_ref4 = 0x13,\n 1456 |   DW_FORM_ref8 = 0x14,\n 1457 |   DW_FORM_ref_udata = 0x15,\n 1458 |   DW_FORM_indirect = 0x16,\n 1459 |   DW_FORM_sec_offset = 0x17,\n 1460 |   DW_FORM_exprloc = 0x18,\n 1461 |   DW_FORM_flag_present = 0x19,\n 1462 |   DW_FORM_strx = 0x1a,\n 1463 |   DW_FORM_addrx = 0x1b,\n 1464 |   DW_FORM_ref_sup4 = 0x1c,\n 1465 |   DW_FORM_strp_sup = 0x1d,\n 1466 |   DW_FORM_data16 = 0x1e,\n 1467 |   DW_FORM_line_strp = 0x1f,\n 1468 |   DW_FORM_ref_sig8 = 0x20,\n 1469 |   DW_FORM_implicit_const = 0x21,\n 1470 |   DW_FORM_loclistx = 0x22,\n 1471 |   DW_FORM_rnglistx = 0x23,\n 1472 |   DW_FORM_ref_sup8 = 0x24,\n 1473 |   DW_FORM_strx1 = 0x25,\n 1474 |   DW_FORM_strx2 = 0x26,\n 1475 |   DW_FORM_strx3 = 0x27,\n 1476 |   DW_FORM_strx4 = 0x28,\n 1477 |   DW_FORM_addrx1 = 0x29,\n 1478 |   DW_FORM_addrx2 = 0x2a,\n 1479 |   DW_FORM_addrx3 = 0x2b,\n 1480 |   DW_FORM_addrx4 = 0x2c,\n 1481 | };","lines":45,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/elf.h#L1437-L1481"}]},{"id":"ERR_12","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"very_easy","description":"`create_plugin_input_file()` checks the reopened descriptor with `if (!file.fd)`.\nOn POSIX, `open()` reports failure by returning `-1`, not `0`, and\n`MappedFile::fd` is initialized to `-1`. The check therefore never fires: a\nfailed `reopen_fd()` silently hands `fd = -1` to the LTO plugin, which then\nfails in a confusing way deep inside the compiler backend instead of producing\nmold's \"cannot open ...\" message. (`0` is a *valid* descriptor, so the current\ntest would also produce a spurious error if stdin were closed.)","fix":"```c++\n-  if (!file.fd)\n+  if (file.fd == -1)\n     Fatal(ctx) << \"cannot open \" << file.name << \": \" << errno_string();\n```\n(and use `INVALID_HANDLE_VALUE` on the Win32 side if that path is ever enabled).","locations":[{"ref":"src/lto-unix.cc:581-598","code":"  581 | template <typename E>\n  582 | static PluginInputFile\n  583 | create_plugin_input_file(Context<E> &ctx, MappedFile *mf) {\n  584 |   PluginInputFile file;\n  585 |   MappedFile *mf2 = mf->parent ? mf->parent : mf;\n  586 | \n  587 |   file.name = save_string(ctx, mf2->name).data();\n  588 |   file.offset = mf->get_offset();\n  589 |   file.filesize = mf->size;\n  590 | \n  591 |   mf2->reopen_fd(file.name);\n  592 | \n  593 |   file.fd = mf2->fd;\n  594 | \n  595 |   if (!file.fd)\n  596 |     Fatal(ctx) << \"cannot open \" << file.name << \": \" << errno_string();\n  597 |   return file;\n  598 | }","lines":18,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/lto-unix.cc#L581-L598"}]},{"id":"ERR_13","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"With `--pack-dyn-relocs=android`, `RelDynSection<E>::copy_buf` blindly writes the\n`android_encoded` byte vector that was produced by the *last* `update_shdr` call:\n\n```\nif (ctx.arg.pack_dyn_relocs_android)\n  write_vector(ctx.buf + this->shdr.sh_offset, android_encoded);\n```\n\nNothing checks that `android_encoded.size() == this->shdr.sh_size`. The APS2 encoder\nis size-unstable (SLEB128 deltas), and the convergence hack in `update_shdr` only\npads when the encoding *shrinks* - if the last `update_shdr` (`main.cc` calls\n`ctx.reldyn->update_shdr(ctx)` once more after the layout is frozen) produces a\n*larger* stream, `sh_size` is silently increased after file offsets have been\nassigned, and `copy_buf` writes past the space reserved for `.rela.dyn`, corrupting\nthe following section or, if `.rela.dyn` is last, running past the end of the output\nmmap. `DynamicSection::copy_buf` guards the analogous situation with an `assert`;\nthis one does not.","fix":"Clamp and verify: in `update_shdr` never let `sh_size` grow once the layout is frozen (pad/truncate to the previous size the same way `keep_android_size` handles shrinking), and add `assert(android_encoded.size() == this->shdr.sh_size);` at the top of `copy_buf` (plus a `Fatal` in release builds).","locations":[{"ref":"src/output-chunks.cc:476-492","code":"  476 |   if (ctx.arg.pack_dyn_relocs_android) {\n  477 |     relocs.resize(num_relocs - num_relrs);\n  478 |     write_relocs(ctx, relocs.data());\n  479 | \n  480 |     // APS2 uses SLEB128-encoded deltas, so .rela.dyn size may oscillate\n  481 |     // as addresses move. If a shrink is followed by a growth, stop\n  482 |     // shrinking and pad the encoded stream to converge.\n  483 |     android_encoded = encode_android<E>(relocs);\n  484 |     i64 old_size = this->shdr.sh_size;\n  485 |     if (old_size != 0 && old_size < (i64)android_encoded.size())\n  486 |       keep_android_size = true;\n  487 |     if (keep_android_size && android_encoded.size() < old_size)\n  488 |       android_encoded.resize(old_size);\n  489 |     this->shdr.sh_size = android_encoded.size();\n  490 |   } else {\n  491 |     this->shdr.sh_size = (num_relocs - num_relrs) * sizeof(ElfRel<E>);\n  492 |   }","lines":17,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/output-chunks.cc#L476-L492"},{"ref":"src/output-chunks.cc:496-502","code":"  496 | template <typename E>\n  497 | void RelDynSection<E>::copy_buf(Context<E> &ctx) {\n  498 |   if (ctx.arg.pack_dyn_relocs_android)\n  499 |     write_vector(ctx.buf + this->shdr.sh_offset, android_encoded);\n  500 |   else\n  501 |     write_relocs(ctx, (ElfRel<E> *)(ctx.buf + this->shdr.sh_offset));\n  502 | }","lines":7,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/output-chunks.cc#L496-L502"}]},{"id":"ERR_14","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`MemoryMappedOutputFile`'s constructor registers the temporary file with the global\ncleanup hook (`mold::output_tmpfile`, unlinked by `cleanup()` from `Fatal` and from\nthe signal handler) only *after* `fchmod` and `ftruncate` have succeeded:\n\n```\nthis->fd = open_or_create_file(ctx, path, tmpfile, perm);   // may have renamed the old output to `tmpfile`\nif (fchmod(...) == -1) Fatal(ctx) << ...;                   // cleanup() sees output_tmpfile == nullptr\nif (ftruncate(this->fd, filesize) == -1) Fatal(ctx) << ...; // same\noutput_tmpfile = (char *)save_string(ctx, tmpfile).data();\n```\n\n`open_or_create_file` renames an existing output file to `.<name>.<pid>` in order to\nreuse it. If `fchmod` or `ftruncate` then fails (a very likely failure: `ftruncate`\nreturns `ENOSPC`/`EFBIG` for large outputs), or if the user hits Ctrl-C in that\nwindow, mold exits without unlinking the temp file. The user is left with **no**\noutput file (it was renamed away) plus a stray hidden `.<name>.<pid>` file. The same\nwindow exists between the successful `rename` inside `open_or_create_file` and the\nreturn of that function.","fix":"Set `output_tmpfile` as soon as the temporary name is known - move `output_tmpfile = (char *)save_string(ctx, tmpfile).data();` to just before the `open_or_create_file` call (or set it inside `open_or_create_file` immediately after a successful `rename`), so every subsequent error path is covered by `cleanup()`.","locations":[{"ref":"src/output-file-unix.cc:28-41","code":"   28 |   // writing to an existing file is much faster than creating a fresh\n   29 |   // file and writing to it.\n   30 |   if (ctx.overwrite_output_file && rename(path.c_str(), tmpfile.c_str()) == 0) {\n   31 |     i64 fd = ::open(tmpfile.c_str(), O_RDWR | O_CREAT, perm);\n   32 |     if (fd != -1)\n   33 |       return fd;\n   34 |     unlink(tmpfile.c_str());\n   35 |   }\n   36 | \n   37 |   i64 fd = ::open(tmpfile.c_str(), O_RDWR | O_CREAT, perm);\n   38 |   if (fd == -1)\n   39 |     Fatal(ctx) << \"cannot open \" << tmpfile << \": \" << errno_string();\n   40 |   return fd;\n   41 | }","lines":14,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/output-file-unix.cc#L28-L41"},{"ref":"src/output-file-unix.cc:52-60","code":"   52 |     this->fd = open_or_create_file(ctx, path, tmpfile, perm);\n   53 | \n   54 |     if (fchmod(this->fd, perm & ~get_umask()) == -1)\n   55 |       Fatal(ctx) << \"fchmod failed: \" << errno_string();\n   56 | \n   57 |     if (ftruncate(this->fd, filesize) == -1)\n   58 |       Fatal(ctx) << \"ftruncate failed: \" << errno_string();\n   59 | \n   60 |     output_tmpfile = (char *)save_string(ctx, tmpfile).data();","lines":9,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/output-file-unix.cc#L52-L60"}]},{"id":"ERR_15","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"The FreeBSD branch of `get_self_path()` ignores both `sysctl()` return values and treats the\nreturned `size` as a string length. `KERN_PROC_PATHNAME` reports the size *including* the\nterminating NUL, so `path.resize(size)` leaves an embedded `'\\0'` as the last character of the\nreturned `std::string`. Every consumer that concatenates or compares this path (e.g. building a\n`-plugin` path or re-exec argv) sees a stray NUL. If either `sysctl()` call fails, the function\nsilently returns an uninitialized/empty path instead of reporting the error.\n\nThe Apple/Windows branch also writes its diagnostic without a trailing newline\n(`\"mold: get_self_path is not supported\"`).","fix":"```cpp\n  size_t size = 0;\n  if (sysctl(mib, 4, NULL, &size, NULL, 0) < 0)\n    Fatal(...) << \"sysctl(KERN_PROC_PATHNAME) failed: \" << errno_string();\n\n  std::string path(size, '\\0');\n  if (sysctl(mib, 4, path.data(), &size, NULL, 0) < 0)\n    Fatal(...) << \"sysctl(KERN_PROC_PATHNAME) failed: \" << errno_string();\n\n  path.resize(strnlen(path.data(), size));  // drop the trailing NUL\n  return path;\n```","locations":[{"ref":"lib/filepath.cc:21-39","code":"   21 | #elif __FreeBSD__\n   22 |   // /proc may not be mounted on FreeBSD. The proper way to get the\n   23 |   // current executable's path is to use sysctl(2).\n   24 |   int mib[4];\n   25 |   mib[0] = CTL_KERN;\n   26 |   mib[1] = KERN_PROC;\n   27 |   mib[2] = KERN_PROC_PATHNAME;\n   28 |   mib[3] = -1;\n   29 | \n   30 |   size_t size;\n   31 |   sysctl(mib, 4, NULL, &size, NULL, 0);\n   32 | \n   33 |   std::string path;\n   34 |   path.resize(size);\n   35 |   sysctl(mib, 4, path.data(), &size, NULL, 0);\n   36 |   return path;\n   37 | #else\n   38 |   return std::filesystem::read_symlink(\"/proc/self/exe\").string();\n   39 | #endif","lines":19,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/lib/filepath.cc#L21-L39"}]},{"id":"ERR_16","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"`get_usage()` declares `struct rusage ru;` uninitialized and ignores `getrusage()`'s return value\n(likewise `GetProcessTimes()` on Windows). If the call fails, `ru.ru_utime` / `ru.ru_stime` are\nread uninitialized — undefined behaviour, and the `--perf` report prints garbage user/system times.","fix":"Before:\n```cpp\n  struct rusage ru;\n  getrusage(RUSAGE_SELF, &ru);\n  return {to_nsec(ru.ru_utime), to_nsec(ru.ru_stime)};\n```\n\nAfter:\n```cpp\n  struct rusage ru = {};\n  if (getrusage(RUSAGE_SELF, &ru) < 0)\n    return {0, 0};\n  return {to_nsec(ru.ru_utime), to_nsec(ru.ru_stime)};\n```","locations":[{"ref":"lib/perf.cc:33-51","code":"   33 | static std::pair<i64, i64> get_usage() {\n   34 | #ifdef _WIN32\n   35 |   auto to_nsec = [](FILETIME t) -> i64 {\n   36 |     return (((u64)t.dwHighDateTime << 32) + (u64)t.dwLowDateTime) * 100;\n   37 |   };\n   38 | \n   39 |   FILETIME creation, exit, kernel, user;\n   40 |   GetProcessTimes(GetCurrentProcess(), &creation, &exit, &kernel, &user);\n   41 |   return {to_nsec(user), to_nsec(kernel)};\n   42 | #else\n   43 |   auto to_nsec = [](struct timeval t) -> i64 {\n   44 |     return (i64)t.tv_sec * 1'000'000'000 + t.tv_usec * 1'000;\n   45 |   };\n   46 | \n   47 |   struct rusage ru;\n   48 |   getrusage(RUSAGE_SELF, &ru);\n   49 |   return {to_nsec(ru.ru_utime), to_nsec(ru.ru_stime)};\n   50 | #endif\n   51 | }","lines":19,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/lib/perf.cc#L33-L51"}]},{"id":"ERR_17","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`InputSection<E>::apply_reloc_nonalloc` for LoongArch open-codes only the *first* half of\n`record_undef_error` - the discarded-COMDAT check - and calls `record_undef_error` only in\nthat branch. Every other backend writes\n`if (rel.r_type == R_NONE || record_undef_error(ctx, rel)) return;`\n(e.g. `src/arch-riscv.cc:683-685`, `src/arch-x86-64.cc:665-667`). As a result, an undefined\nnon-weak symbol that is referenced only from a non-allocated section (a debug section, for\ninstance) is never reported on LoongArch, and the relocation is applied against address 0.","fix":"Replace the open-coded check with the shared helper:\n```\n-    if (rel.r_type == R_NONE)\n-      return;\n-    ...\n-    if (!sym.file && &sym != discarded_comdat_sym<E>) {\n-      record_undef_error(ctx, rel);\n-      return;\n-    }\n+    if (rel.r_type == R_NONE || record_undef_error(ctx, rel))\n+      return;\n```","locations":[{"ref":"src/arch-loongarch.cc:705-716","code":"  705 |   for_each_reloc(ctx, [&](const ElfRel<E> &rel, i64) ALWAYS_INLINE {\n  706 |     if (rel.r_type == R_NONE)\n  707 |       return;\n  708 | \n  709 |     Symbol<E> &sym = *file.symbols[rel.r_sym];\n  710 |     u8 *loc = base + rel.r_offset;\n  711 | \n  712 |     if (!sym.file && &sym != discarded_comdat_sym<E>) {\n  713 |       record_undef_error(ctx, rel);\n  714 |       return;\n  715 |     }\n  716 | ","lines":12,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/arch-loongarch.cc#L705-L716"}]},{"id":"ERR_18","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"`scan_relocations` in the SH-4 backend reports an unknown relocation type with `Fatal`,\nwhich calls `_exit(1)` immediately (`src/error.cc:18-21`). Every other backend uses `Error`\nhere (`src/arch-riscv.cc:856`, `src/arch-m68k.cc:315`, `src/arch-s390x.cc:490`, ...), which\nrecords the failure and lets mold keep scanning so that the user sees every problem in one\nrun and so that `--noinhibit-exec` behaves as documented.","fix":"```\n     default:\n-      Fatal(ctx) << *this << \": unknown relocation: \" << rel;\n+      Error(ctx) << *this << \": unknown relocation: \" << rel;\n```","locations":[{"ref":"src/arch-sh4.cc:373-375","code":"  373 |     default:\n  374 |       Fatal(ctx) << *this << \": unknown relocation: \" << rel;\n  375 |     }","lines":3,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/arch-sh4.cc#L373-L375"}]},{"id":"ERR_19","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In the `R_X86_64_GOTTPOFF`/`R_X86_64_CODE_4_GOTTPOFF` relaxation path the result of\n`relax_gottpoff` is used without checking it for 0, unlike the two TLSDESC paths 40 lines\nbelow which `Fatal` with \"illegal instruction sequence\". If the instruction pattern is not\nrecognised, `insn` is 0 and the code silently writes three zero bytes\n(`add %al, (%rax)` ...) over the instruction prefix, producing a corrupt binary instead of a\ndiagnostic. Today this is unreachable because `scan_relocations` only skips GOT allocation\nwhen the same call returned non-zero, but the invariant is implicit and unenforced.","fix":"Mirror the TLSDESC handling:\n```\n         u32 insn = relax_gottpoff(loc, rel);\n+        if (!insn)\n+          Fatal(ctx) << *this << \": illegal instruction sequence for \" << rel;\n         loc[-3] = insn >> 16;\n```","locations":[{"ref":"src/arch-x86-64.cc:567-578","code":"  567 |     case R_X86_64_GOTTPOFF:\n  568 |     case R_X86_64_CODE_4_GOTTPOFF:\n  569 |       if (sym.has_gottp(ctx)) {\n  570 |         write32s(sym.get_gottp_addr(ctx) + A - P);\n  571 |       } else {\n  572 |         u32 insn = relax_gottpoff(loc, rel);\n  573 |         loc[-3] = insn >> 16;\n  574 |         loc[-2] = insn >> 8;\n  575 |         loc[-1] = insn;\n  576 |         write32s(S - ctx.tp_addr);\n  577 |       }\n  578 |       break;","lines":12,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/arch-x86-64.cc#L567-L578"}]},{"id":"ERR_20","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"`read_archive_members` uses `assert(str.starts_with(\"!<thin>\\n\"))` to validate the magic. In\nrelease builds (`NDEBUG`) the assert vanishes and any file that merely reached this function\nwithout the `!<arch>\\n` magic is parsed as a thin archive starting 8 bytes in, i.e. random\nbytes are interpreted as `ArHdr`s.","fix":"```\n-  assert(str.starts_with(\"!<thin>\\n\"));\n+  if (!str.starts_with(\"!<thin>\\n\"))\n+    Fatal(ctx) << mf->name << \": not an archive file\";\n```","locations":[{"ref":"src/archive-file.cc:165-175","code":"  165 | template <typename E>\n  166 | std::vector<MappedFile *>\n  167 | read_archive_members(Context<E> &ctx, MappedFile *mf) {\n  168 |   std::string_view str = mf->get_contents();\n  169 | \n  170 |   if (str.starts_with(\"!<arch>\\n\"))\n  171 |     return read_fat_archive_members(ctx, mf);\n  172 | \n  173 |   assert(str.starts_with(\"!<thin>\\n\"));\n  174 |   return read_thin_archive_members(ctx, mf);\n  175 | }","lines":11,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/archive-file.cc#L165-L175"}]},{"id":"ERR_21","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`Fatal<E>::~Fatal` calls `_exit(1)`, which bypasses the C++ runtime and does not\nflush `std::cout`. `--print-gc-sections` and `--print-icf-sections` write their\nreports to `std::cout` (which is fully buffered when redirected to a file or a\npipe), so a fatal error raised after those passes silently discards the report\nthat was already \"printed\". `out.emit()` only takes care of this object's own\n`std::cerr` output.","fix":"Flush `std::cout` before exiting:\n```cpp\ntemplate <typename E>\n[[noreturn]] Fatal<E>::~Fatal() {\n  out.emit();\n  std::cout.flush();\n  cleanup();\n  _exit(1);\n}\n```","locations":[{"ref":"src/error.cc:17-22","code":"   17 | template <typename E>\n   18 | [[noreturn]] Fatal<E>::~Fatal() {\n   19 |   out.emit();\n   20 |   cleanup();\n   21 |   _exit(1);\n   22 | }","lines":6,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/error.cc#L17-L22"}]},{"id":"ERR_22","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"If `lockf()` fails, `acquire_global_lock()` returns without closing `fd`, so the\ndescriptor leaks for the entire link. More importantly, the failure is silently\nignored: mold continues without the lock even though the user asked for\n`MOLD_JOBS=1`, so the memory-limiting behaviour silently stops working.","fix":"```c++\n-  if (lockf(fd, F_LOCK, 0) == -1)\n-    return;\n+  if (lockf(fd, F_LOCK, 0) == -1) {\n+    close(fd);\n+    return;\n+  }\n```","locations":[{"ref":"src/jobs-unix.cc:36-43","code":"   36 |   int fd = open(path.c_str(), O_WRONLY | O_CREAT | O_CLOEXEC, 0600);\n   37 |   if (fd == -1)\n   38 |     return;\n   39 | \n   40 |   if (lockf(fd, F_LOCK, 0) == -1)\n   41 |     return;\n   42 |   lock_fd = fd;\n   43 | }","lines":8,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/jobs-unix.cc#L36-L43"}]},{"id":"ERR_23","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"When `--relocatable` is combined with LTO, `mold_main()` runs `do_lto()` and\nthen returns from `combine_objects()` at line 440-443, skipping the\n`lto_cleanup(ctx)` call at line 756. `cleanup_hook()` is what deletes the\ntemporary ELF files the LTO backend wrote to disk, so `mold -r -flto` leaves\ntemporary files behind on every link.","fix":"Call `lto_cleanup(ctx)` before the early return:\n```c++\nif (ctx.arg.relocatable) {\n  combine_objects(ctx);\n  if (!ctx.arg.plugin.empty())\n    lto_cleanup(ctx);\n  return 0;\n}\n```","locations":[{"ref":"src/main.cc:437-443","code":"  437 |   // Handle --relocatable. Since the linker's behavior is quite different\n  438 |   // from the normal one when the option is given, the logic is implemented\n  439 |   // to a separate file.\n  440 |   if (ctx.arg.relocatable) {\n  441 |     combine_objects(ctx);\n  442 |     return 0;\n  443 |   }","lines":7,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/main.cc#L437-L443"},{"ref":"src/main.cc:756-757","code":"  756 |   if (!ctx.arg.plugin.empty())\n  757 |     lto_cleanup(ctx);","lines":2,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/main.cc#L756-L757"}]},{"id":"ERR_24","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"`print_map()` reports a failure to open the map file with `errno_string()`.\n`std::ofstream::open()` is not required to set `errno` (and on libstdc++ it\noften leaves a stale value from an unrelated call), so the message frequently\nsays something like \"Success\" or names an unrelated error. The same applies to\nthe mapped-file Win32 paths.","fix":"Open with `std::filesystem`/`::open` and report the real error, or at minimum\nset `errno = 0;` immediately before `file.open(...)` so a stale value is not\nreported.","locations":[{"ref":"src/mapfile.cc:49-55","code":"   49 |   if (!ctx.arg.Map.empty() && ctx.arg.Map != \"-\") {\n   50 |     file.open(ctx.arg.Map);\n   51 |     if (file.fail())\n   52 |       Fatal(ctx) << \"--print-map: cannot open \" << ctx.arg.Map << \": \"\n   53 |                  << errno_string();\n   54 |     out = &file;\n   55 |   }","lines":7,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mapfile.cc#L49-L55"}]},{"id":"ERR_25","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"`DynstrSection<E>::find_string` relies on an `assert` to validate its lookup:\n\n```\nauto it = strings.find(str);\nassert(it != strings.end());\nreturn it->second;\n```\n\nIn a release build (`NDEBUG`) a missing string dereferences the end iterator, i.e.\nundefined behaviour, instead of reporting an internal error. `create_dynamic_section`\ncalls it for every `DT_NEEDED`, `DT_RPATH`, `DT_SONAME`, `DT_AUDIT`, `DT_FILTER` and\n`DT_AUXILIARY` value, so any future path that emits a dynamic tag whose string was\nnever added via `add_string` turns into a silent memory error.","fix":"Replace the assert with a hard check, e.g. `if (it == strings.end()) Fatal(ctx) << \"internal error: .dynstr entry not found: \" << str;` (the function needs a `Context` parameter for that, or use `unreachable()` which is active in release builds).","locations":[{"ref":"src/output-chunks.cc:593-598","code":"  593 | template <typename E>\n  594 | i64 DynstrSection<E>::find_string(std::string_view str) {\n  595 |   auto it = strings.find(str);\n  596 |   assert(it != strings.end());\n  597 |   return it->second;\n  598 | }","lines":6,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/output-chunks.cc#L593-L598"}]},{"id":"ERR_26","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"`LockingOutputFile`'s constructor ignores the result of `flock()` and of the `write()`\nthat is supposed to make a stale debug file unusable:\n\n```\nflock(this->fd, LOCK_EX);\nu8 buf[256] = {};\n(void)!!write(this->fd, buf, sizeof(buf));\n```\n\nIf `flock` fails (`EINTR`, `ENOLCK`, or a filesystem without lock support such as\nsome NFS mounts) mold proceeds without holding the lock, which is exactly the\nscenario this class exists to prevent - two concurrent links can then write the same\n`--separate-debug-file` simultaneously. A short or failed `write` likewise leaves the\nold, now-invalid debug file looking usable to gdb.","fix":"Check both calls, e.g. `if (flock(this->fd, LOCK_EX) == -1) Fatal(ctx) << path << \": flock failed: \" << errno_string();` and treat a `write` returning anything other than `sizeof(buf)` as a fatal error.","locations":[{"ref":"src/output-file-unix.cc:196-210","code":"  196 | template <typename E>\n  197 | LockingOutputFile<E>::LockingOutputFile(Context<E> &ctx, std::string path,\n  198 |                                         int perm)\n  199 |   : OutputFile<E>(path, 0, true) {\n  200 |   this->fd = ::open(path.c_str(), O_RDWR | O_CREAT, perm);\n  201 |   if (this->fd == -1)\n  202 |     Fatal(ctx) << \"cannot open \" << path << \": \" << errno_string();\n  203 |   flock(this->fd, LOCK_EX);\n  204 | \n  205 |   // We may be overwriting to an existing debug info file. We want to\n  206 |   // make the file unusable so that gdb won't use it by accident until\n  207 |   // it's ready.\n  208 |   u8 buf[256] = {};\n  209 |   (void)!!write(this->fd, buf, sizeof(buf));\n  210 | }","lines":15,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/output-file-unix.cc#L196-L210"}]},{"id":"ERR_27","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`report_undef_errors()` iterates `ctx.undef_errors`, which is a\n`tbb::concurrent_hash_map<Symbol<E> *, std::vector<std::string>>`. Iteration\norder of a concurrent hash map keyed by *pointer values* is unspecified and\nvaries between runs (ASLR, allocation order, thread interleaving), and the\nper-symbol `std::vector<std::string>` is filled concurrently, so the \"first\nMAX_ERRORS\" references reported for a symbol are also arbitrary. Users\ndiffing linker output across builds see spurious changes, and the truncation\nmessage can point at different call sites each time.","fix":"Copy the map into a `std::vector`, sort it by symbol name (and sort each symbol's message list) before printing, so that the diagnostics are reproducible.","locations":[{"ref":"src/passes.cc:1994-2027","code":" 1994 | template <typename E>\n 1995 | void report_undef_errors(Context<E> &ctx) {\n 1996 |   constexpr i64 MAX_ERRORS = 3;\n 1997 | \n 1998 |   if (ctx.arg.unresolved_symbols == UNRESOLVED_IGNORE)\n 1999 |     return;\n 2000 | \n 2001 |   for (auto &pair : ctx.undef_errors) {\n 2002 |     Symbol<E> *sym = pair.first;\n 2003 |     std::span<std::string> errors = pair.second;\n 2004 | \n 2005 |     std::stringstream ss;\n 2006 |     ss << \"undefined symbol: \"\n 2007 |        << (ctx.arg.demangle ? demangle(*sym) : sym->name())\n 2008 |        << \"\\n\";\n 2009 | \n 2010 |     for (i64 i = 0; i < errors.size() && i < MAX_ERRORS; i++)\n 2011 |       ss << errors[i];\n 2012 | \n 2013 |     if (MAX_ERRORS < errors.size())\n 2014 |       ss << \">>> referenced \" << (errors.size() - MAX_ERRORS) << \" more times\\n\";\n 2015 | \n 2016 |     // Remove the trailing '\\n' because Error/Warn adds it automatically\n 2017 |     std::string msg = ss.str();\n 2018 |     msg.pop_back();\n 2019 | \n 2020 |     if (ctx.arg.unresolved_symbols == UNRESOLVED_ERROR)\n 2021 |       Error(ctx) << msg;\n 2022 |     else\n 2023 |       Warn(ctx) << msg;\n 2024 |   }\n 2025 | \n 2026 |   ctx.checkpoint();\n 2027 | }","lines":34,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/passes.cc#L1994-L2027"}]},{"id":"ERR_28","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"Two unchecked I/O results in the fork/notify handshake:\n\n* `fork_child()`: `if (read(pipefd[0], buf, 1) == 1) _exit(0);` - a `read`\n  interrupted by a signal returns `-1`/`EINTR`, after which the parent falls\n  through to `waitpid()` and blocks until the child finishes, silently\n  defeating the whole \"hide exit latency\" optimization.\n* `notify_parent()`: the `write()` result is only checked by\n  `assert(n == 1)`, which is compiled out in release builds\n  (`-DNDEBUG`); a failed notification is then completely silent.","fix":"Retry the `read`/`write` on `EINTR` in a loop, and handle a genuine failure explicitly (e.g. fall back to `waitpid()` on read failure; report or ignore a `write` failure deliberately with a comment instead of relying on `assert`).","locations":[{"ref":"src/subprocess-unix.cc:36-48","code":"   36 | \n   37 |     char buf[1];\n   38 |     if (read(pipefd[0], buf, 1) == 1)\n   39 |       _exit(0);\n   40 | \n   41 |     int status;\n   42 |     waitpid(pid, &status, 0);\n   43 | \n   44 |     if (WIFEXITED(status))\n   45 |       _exit(WEXITSTATUS(status));\n   46 |     if (WIFSIGNALED(status))\n   47 |       raise(WTERMSIG(status));\n   48 |     _exit(1);","lines":13,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/subprocess-unix.cc#L36-L48"},{"ref":"src/subprocess-unix.cc:56-65","code":"   56 | template <typename E>\n   57 | void notify_parent() {\n   58 |   if (pipe_write_fd == -1)\n   59 |     return;\n   60 | \n   61 |   char buf[] = {1};\n   62 |   [[maybe_unused]] int n = write(pipe_write_fd, buf, 1);\n   63 |   assert(n == 1);\n   64 |   pipe_write_fd = -1;\n   65 | }","lines":10,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/subprocess-unix.cc#L56-L65"}]},{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"very_easy","description":"`TarWriter::open()` opens the archive with `fopen(output_path.c_str(), \"w\")` — text mode. This file\nalready has Windows-specific code (`#define ftruncate _chsize_s`), and on Windows text mode\ntranslates every `0x0A` byte written to `0x0D 0x0A`. `TarWriter::append()` writes raw binary input\nfiles into the archive, so every `--repro` tarball produced on Windows is corrupted, and the\n`ftell()`-based 512-byte block alignment is thrown off as well.","fix":"Before:\n```cpp\n  FILE *out = fopen(output_path.c_str(), \"w\");\n```\n\nAfter:\n```cpp\n  FILE *out = fopen(output_path.c_str(), \"wb\");\n```","locations":[{"ref":"lib/tar.cc:72-78","code":"   72 | std::unique_ptr<TarWriter>\n   73 | TarWriter::open(std::string output_path, std::string basedir) {\n   74 |   FILE *out = fopen(output_path.c_str(), \"w\");\n   75 |   if (!out)\n   76 |     return nullptr;\n   77 |   return std::unique_ptr<TarWriter>(new TarWriter(out, basedir));\n   78 | }","lines":7,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/lib/tar.cc#L72-L78"}]},{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`InputSectionTable<E>::operator[]` silently returns `nullptr` for three\ndifferent situations - an out-of-range/erased slot (`value == 0`), a slot that\nhas been converted to a `MergeableSection`, and a section that was never\ncreated - and its `Iterator::operator*` yields those null pointers to\nrange-`for` loops. Most callers remember the null check\n(`if (isec && isec->is_alive)`), but some do not; for example\n`src/relocatable.cc:89` and `src/relocatable.cc:92` do\n`InputSection<E> &isec = *file.sections[shdr.sh_info];` on an index taken from\na `SHT_GROUP` member list, which is a null dereference for a mergeable or\ndiscarded group member. There is nothing in the type to force the check.","fix":"Split the API so the fallible and infallible uses are distinguishable, e.g. keep\n`get(i64 idx)` returning `InputSection<E> *` and add\n`InputSection<E> &at(Context<E> &ctx, i64 idx)` that reports a corrupt-input\nerror instead of returning null; and make the iterator skip empty slots so\n`for (InputSection<E> *isec : file->sections)` never yields `nullptr`.","locations":[{"ref":"src/mold.h:1798-1844","code":" 1798 | // ObjectFile needs a lookup table indexed by ELF section number. Store 31-bit\n 1799 | // indices into per-file pools and use the high bit to distinguish regular and\n 1800 | // mergeable sections.\n 1801 | template <typename E>\n 1802 | class InputSectionTable {\n 1803 | public:\n 1804 |   class Iterator {\n 1805 |   public:\n 1806 |     Iterator(InputSectionTable &table, i64 idx)\n 1807 |       : table(table), idx(idx) {}\n 1808 | \n 1809 |     InputSection<E> *operator*() const { return table[idx]; }\n 1810 | \n 1811 |     Iterator &operator++() {\n 1812 |       idx++;\n 1813 |       return *this;\n 1814 |     }\n 1815 | \n 1816 |     bool operator!=(const Iterator &other) const { return idx != other.idx; }\n 1817 | \n 1818 |   private:\n 1819 |     InputSectionTable &table;\n 1820 |     i64 idx;\n 1821 |   };\n 1822 | \n 1823 |   InputSection<E> *operator[](i64 idx);\n 1824 |   MergeableSection<E> *get_mergeable(i64 idx);\n 1825 |   InputSection<E> *emplace(Context<E> &ctx, ObjectFile<E> &file, i64 shndx,\n 1826 |                            std::string_view name);\n 1827 |   void erase(i64 idx) { indices[idx] = 0; }\n 1828 |   void set_mergeable(i64 idx, std::unique_ptr<MergeableSection<E>> m);\n 1829 | \n 1830 |   Iterator begin() { return {*this, 0}; }\n 1831 |   Iterator end() { return {*this, (i64)indices.size()}; }\n 1832 | \n 1833 |   void resize(i64 size) { indices.resize(size); }\n 1834 |   i64 size() const { return indices.size(); }\n 1835 |   bool empty() const { return indices.empty(); }\n 1836 | \n 1837 | private:\n 1838 |   static constexpr u32 MERGEABLE = 1U << 31;\n 1839 |   static constexpr u32 INDEX_MASK = ~MERGEABLE;\n 1840 | \n 1841 |   std::deque<InputSection<E>> pool;\n 1842 |   std::vector<std::unique_ptr<MergeableSection<E>>> mergeable_pool;\n 1843 |   std::vector<u32> indices;\n 1844 | };","lines":47,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mold.h#L1798-L1844"},{"ref":"src/mold.h:3553-3569","code":" 3553 | template <typename E>\n 3554 | inline InputSection<E> *InputSectionTable<E>::operator[](i64 idx) {\n 3555 |   u32 value = indices[idx];\n 3556 |   if (value == 0 || (value & MERGEABLE))\n 3557 |     return nullptr;\n 3558 | \n 3559 |   return &pool[value - 1];\n 3560 | }\n 3561 | \n 3562 | template <typename E>\n 3563 | inline MergeableSection<E> *\n 3564 | InputSectionTable<E>::get_mergeable(i64 idx) {\n 3565 |   u32 value = indices[idx];\n 3566 |   if (!(value & MERGEABLE))\n 3567 |     return nullptr;\n 3568 |   return mergeable_pool[(value & INDEX_MASK) - 1].get();\n 3569 | }","lines":17,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mold.h#L3553-L3569"}]},{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"On Windows the output file size is passed to `CreateFileMapping` in the *low* dword\nparameter only, with 0 for the high dword:\n\n```\nHANDLE map = CreateFileMapping(handle, nullptr, PAGE_READWRITE, 0, filesize, nullptr);\n```\n\n`filesize` is an `i64` and gets truncated to a `DWORD`, so any output of 4 GiB or\nmore creates a mapping object of `filesize % 2^32` bytes. The subsequent\n`MapViewOfFile(map, FILE_MAP_WRITE, 0, 0, filesize)` (whose size parameter is a\n64-bit `SIZE_T`) then fails, and mold dies with a misleading\n`MapViewOfFile failed` message. The same truncation exists in `extend()`.","fix":"Split the size: `CreateFileMapping(handle, nullptr, PAGE_READWRITE, (DWORD)((u64)filesize >> 32), (DWORD)((u64)filesize & 0xffffffff), nullptr)` in both the constructor and `extend()`.","locations":[{"ref":"src/output-file-win32.cc:22-27","code":"   22 |     HANDLE map = CreateFileMapping(handle, nullptr, PAGE_READWRITE, 0,\n   23 |                                    filesize, nullptr);\n   24 |     if (!map)\n   25 |       Fatal(ctx) << path << \": CreateFileMapping failed: \" << GetLastError();\n   26 | \n   27 |     this->buf = (u8 *)MapViewOfFile(map, FILE_MAP_WRITE, 0, 0, filesize);","lines":6,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/output-file-win32.cc#L22-L27"},{"ref":"src/output-file-win32.cc:45-52","code":"   45 |     HANDLE map = CreateFileMapping(handle, nullptr, PAGE_READWRITE, 0,\n   46 |                                    this->filesize + size, nullptr);\n   47 |     if (!map)\n   48 |       Fatal(ctx) << this->path << \": CreateFileMapping failed: \"\n   49 |                  << GetLastError();\n   50 | \n   51 |     this->buf = (u8 *)MapViewOfFile(map, FILE_MAP_WRITE, 0, 0,\n   52 |                                     this->filesize + size);","lines":8,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/output-file-win32.cc#L45-L52"}]},{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`sighandler()` is installed for `SIGSEGV`, `SIGBUS` and `SIGABRT` but is not\nasync-signal-safe. It takes a `std::mutex` (`pthread_mutex_lock` is not in the\nPOSIX list of async-signal-safe functions) as its very first action, and it\nreads `std::string sigabrt_msg`. If the crashing thread is interrupted inside\nthe C++/pthread runtime, or if a second thread faults while the first holds\nthe lock, the handler can deadlock instead of printing the \"Disk full?\"\nmessage - exactly the diagnostic path this handler exists for. The handler\nalso clobbers `errno` (via `write`) without saving/restoring it.","fix":"Drop the mutex and use an `std::atomic_flag`/`__atomic_test_and_set` to let only the first faulting thread print (others spin or immediately `_exit`). Precompute `sigabrt_msg` into a plain `static char[]` buffer at startup, save/restore `errno` around the handler body, and keep the body to `write()`, `unlink()`, `signal()` and `raise()` only.","locations":[{"ref":"src/signal-unix.cc:37-64","code":"   37 | static void sighandler(int signo, siginfo_t *info, void *ucontext) {\n   38 |   static std::mutex mu;\n   39 |   std::scoped_lock lock{mu};\n   40 | \n   41 |   // Handle disk full error\n   42 |   switch (signo) {\n   43 |   case SIGSEGV:\n   44 |   case SIGBUS:\n   45 |     if (output_buffer_start <= info->si_addr &&\n   46 |         info->si_addr < output_buffer_end) {\n   47 |       const char msg[] = \"mold: failed to write to an output file. Disk full?\\n\";\n   48 |       (void)!write(STDERR_FILENO, msg, sizeof(msg) - 1);\n   49 |     }\n   50 |     break;\n   51 |   case SIGABRT: {\n   52 |     (void)!write(STDERR_FILENO, &sigabrt_msg[0], sigabrt_msg.size());\n   53 |     break;\n   54 |   }\n   55 |   }\n   56 | \n   57 |   // Re-throw the signal\n   58 |   signal(SIGSEGV, SIG_DFL);\n   59 |   signal(SIGBUS, SIG_DFL);\n   60 |   signal(SIGABRT, SIG_DFL);\n   61 | \n   62 |   cleanup();\n   63 |   raise(signo);\n   64 | }","lines":28,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/signal-unix.cc#L37-L64"}]},{"id":"API_5","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"`fork_child()` creates the synchronization pipe with plain `pipe(2)`, so\nneither end has `FD_CLOEXEC`. The child (which does the actual linking) keeps\n`pipefd[1]` open and later `exec`s other programs - the LTO plugin toolchain,\nand `mold -run`'s `execv`/`execvp` in the same directory - which inherit the\nwrite end. The parent blocks in `read(pipefd[0], buf, 1)` until either a byte\narrives or *all* write ends are closed, so a long-lived grandchild keeps the\nparent (i.e. the process the build system waits on) alive after the linker\nitself has exited. The parent also never closes `pipefd[0]`.","fix":"Use `pipe2(pipefd, O_CLOEXEC)` (falling back to `pipe` + `fcntl(FD_CLOEXEC)` where `pipe2` is unavailable); the child clears the flag only if it really needs to pass the fd on. Close `pipefd[0]` in the parent after the read.","locations":[{"ref":"src/subprocess-unix.cc:19-54","code":"   19 | template <typename E>\n   20 | void fork_child() {\n   21 |   int pipefd[2];\n   22 |   if (pipe(pipefd) == -1) {\n   23 |     perror(\"pipe\");\n   24 |     exit(1);\n   25 |   }\n   26 | \n   27 |   pid_t pid = fork();\n   28 |   if (pid == -1) {\n   29 |     perror(\"fork\");\n   30 |     exit(1);\n   31 |   }\n   32 | \n   33 |   if (pid > 0) {\n   34 |     // Parent\n   35 |     close(pipefd[1]);\n   36 | \n   37 |     char buf[1];\n   38 |     if (read(pipefd[0], buf, 1) == 1)\n   39 |       _exit(0);\n   40 | \n   41 |     int status;\n   42 |     waitpid(pid, &status, 0);\n   43 | \n   44 |     if (WIFEXITED(status))\n   45 |       _exit(WEXITSTATUS(status));\n   46 |     if (WIFSIGNALED(status))\n   47 |       raise(WTERMSIG(status));\n   48 |     _exit(1);\n   49 |   }\n   50 | \n   51 |   // Child\n   52 |   close(pipefd[0]);\n   53 |   pipe_write_fd = pipefd[1];\n   54 | }","lines":36,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/subprocess-unix.cc#L19-L54"}]},{"id":"API_6","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"On Windows, `ArenaResource::allocate()` reserves address space in the constructor and commits it\nlazily with `VirtualAlloc(data + begin, size, MEM_COMMIT, PAGE_READWRITE)` *after* the offset CAS\nsucceeds. Two threads can be handed adjacent sub-page allocations inside the same 4 KiB page:\nthread A commits the page, returns, and starts writing its object; thread B then calls\n`VirtualAlloc(MEM_COMMIT)` on the same page. `VirtualAlloc` documents that committing an\nalready-committed page does not fail, but the \"memory is initialized to zero\" guarantee is only\nspelled out for newly committed pages — the code relies on an undocumented no-op, and any change in\nbehaviour would silently zero another thread's freshly written object.","fix":"Commit in page-aligned chunks tracked by a separate monotonic \"committed high-water mark\" atomic,\nso a page is committed exactly once:\n\n```cpp\n  static Atomic<u64> committed;   // page-aligned\n  u64 need = align_to(end, PAGE);\n  u64 have = committed.load();\n  while (have < need && !committed.compare_exchange_weak(have, need)) {}\n  if (have < need && !VirtualAlloc(data + have, need - have, MEM_COMMIT, PAGE_READWRITE))\n    memory_error(\"commit\", need - have);\n```\n\nor simply commit the whole reservation up front on Windows (the reservation is already sparse on\nPOSIX via `MAP_NORESERVE`).","locations":[{"ref":"lib/arena.cc:48-75","code":"   48 | void *ArenaResource::allocate(u64 size, u64 alignment) {\n   49 |   assert(std::has_single_bit(alignment));\n   50 | \n   51 |   // ArenaPtr and base-relative indices both encode offsets in four-byte units.\n   52 |   alignment = std::max<u64>(alignment, 4);\n   53 |   u64 old = offset.load(std::memory_order_relaxed);\n   54 | \n   55 |   for (;;) {\n   56 |     u64 padding = -old & (alignment - 1);\n   57 |     if (old > SIZE || padding > SIZE - old || size > SIZE - old - padding) {\n   58 |       std::cerr << \"mold: cannot allocate more than \" << SIZE\n   59 |                 << \" bytes for linker data structures on this host\\n\";\n   60 |       std::exit(1);\n   61 |     }\n   62 | \n   63 |     u64 begin = old + padding;\n   64 |     u64 end = begin + size;\n   65 |     if (offset.compare_exchange_weak(old, end, std::memory_order_relaxed)) {\n   66 | #ifdef _WIN32\n   67 |       // VirtualAlloc reserves and commits address space separately.\n   68 |       if (size &&\n   69 |           !VirtualAlloc(data + begin, (SIZE_T)size, MEM_COMMIT, PAGE_READWRITE))\n   70 |         memory_error(\"commit\", size);\n   71 | #endif\n   72 |       return data + begin;\n   73 |     }\n   74 |   }\n   75 | }","lines":28,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/lib/arena.cc#L48-L75"}]},{"id":"API_7","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"`lib/siphash.h` has no `#pragma once` and no include guard, even though its own header comment\ntells users to \"just copy this header file into your project and #include it\". Including it from\ntwo translation-unit-shared headers, or twice in one TU, is an immediate redefinition error for\n`SipHashTmpl` and the four `using` aliases. Every other header in the project (`lib/lib.h`,\n`lib/atomics.h`, `lib/integers.h`, `src/mold.h`) has `#pragma once`.\n\nRelated: `SipHashTmpl::hash()` takes the message length as `int inlen` while `update()` takes\n`int64_t msglen`, so the convenience wrapper silently truncates messages larger than 2 GiB.","fix":"Add `#pragma once` immediately after the header comment:\n\n```cpp\n// https://github.com/rui314/siphash/blob/main/siphash.h\n\n#pragma once\n\n#include <bit>\n```\n\nand change `static void hash(void *out, void *key, void *in, int inlen)` to take `int64_t inlen`.","locations":[{"ref":"lib/siphash.h:1-10","code":"    1 | // This is a header-only C++20 implementation of SipHash based on the\n    2 | // reference implementation. To use, just copy this header file into\n    3 | // your project and #include it.\n    4 | //\n    5 | // https://github.com/rui314/siphash/blob/main/siphash.h\n    6 | \n    7 | #include <bit>\n    8 | #include <cstdint>\n    9 | #include <cstring>\n   10 | ","lines":10,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/lib/siphash.h#L1-L10"},{"ref":"lib/siphash.h:74-78","code":"   74 |   static void hash(void *out, void *key, void *in, int inlen) {\n   75 |     SipHashTmpl<C_ROUNDS, D_ROUNDS, OUTLEN> h(key);\n   76 |     h.update(in, inlen);\n   77 |     h.finish(out);\n   78 |   }","lines":5,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/lib/siphash.h#L74-L78"}]},{"id":"API_8","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"`read_response_file` calls `isspace(c)` with a plain `char`. On platforms where `char` is\nsigned, any byte >= 0x80 in a response file (UTF-8 paths, for example) is passed to\n`isspace` as a negative value, which is undefined behaviour and in practice indexes the\nctype table out of bounds on glibc/MSVC debug runtimes.","fix":"Cast to `unsigned char` at both call sites:\n```\n-      if (c == 0 || isspace(c))\n+      if (c == 0 || isspace((unsigned char)c))\n```","locations":[{"ref":"src/cmdline.cc:277-304","code":"  277 |     switch (state) {\n  278 |     case SPACE:\n  279 |       if (c == 0 || isspace(c))\n  280 |         break;\n  281 | \n  282 |       if (c == '\\\\') {\n  283 |         os << c2;\n  284 |         state = BARE;\n  285 |         i++;\n  286 |         break;\n  287 |       }\n  288 | \n  289 |       if (c == '\\'' || c == '\"') {\n  290 |         quote = c;\n  291 |         state = QUOTED;\n  292 |         break;\n  293 |       }\n  294 | \n  295 |       os << c;\n  296 |       state = BARE;\n  297 |       break;\n  298 |     case BARE:\n  299 |       if (c == 0 || isspace(c)) {\n  300 |         vec.push_back(os.str());\n  301 |         os = {};\n  302 |         state = SPACE;\n  303 |         break;\n  304 |       }","lines":28,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/cmdline.cc#L277-L304"}]},{"id":"API_9","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"`is_text_file` passes a plain `char` to `isprint`. `<cctype>` functions are\ndefined only for values representable as `unsigned char` or `EOF`; passing a\nnegative `char` (any byte >= 0x80 on a platform with signed `char`, which is\nevery mainstream one) is undefined behaviour and in practice indexes the ctype\ntable out of bounds. The function is called on arbitrary untrusted input bytes.","fix":"Cast to `unsigned char`:\n```cpp\nauto istext = [](char c) {\n  return isprint((unsigned char)c) || c == '\\n' || c == '\\t';\n};\n```","locations":[{"ref":"src/filetype.cc:5-13","code":"    5 | static bool is_text_file(MappedFile *mf) {\n    6 |   auto istext = [](char c) {\n    7 |     return isprint(c) || c == '\\n' || c == '\\t';\n    8 |   };\n    9 | \n   10 |   u8 *data = mf->data;\n   11 |   return mf->size >= 4 && istext(data[0]) && istext(data[1]) &&\n   12 |          istext(data[2]) && istext(data[3]);\n   13 | }","lines":9,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/filetype.cc#L5-L13"}]},{"id":"API_10","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"Two problems with the plugin message/claim protocol:\n\n1. `message()` treats `LDPL_ERROR` exactly like `LDPL_FATAL` and calls `Fatal`,\n   which `_exit(1)`s from inside a plugin callback. The `ld_plugin` API\n   specifies `LDPL_ERROR` as a *recoverable* error: the linker should record it\n   and let the plugin return normally. Killing the process from a callback also\n   leaks whatever temporary files the plugin created (`cleanup_hook` never\n   runs).\n2. `add_symbols()` asserts `phase == 1`, but `run_lto_plugin()` sets\n   `phase = 2` before calling `claim_file_hook()` for GCC offload objects. If\n   the plugin calls `add_symbols()` from that claim, debug builds abort on the\n   assertion.","fix":"Use `Error(ctx) << buf;` for `LDPL_ERROR` and keep `Fatal` only for\n`LDPL_FATAL`. Relax the `add_symbols()` assertion to `phase == 1 || phase == 2`\n(or set `phase = 2` only after the offload claims).","locations":[{"ref":"src/lto-unix.cc:116-140","code":"  116 | template <typename E>\n  117 | static PluginStatus message(PluginLevel level, const char *fmt, ...) {\n  118 |   LOG << \"message\\n\";\n  119 |   Context<E> &ctx = *gctx<E>;\n  120 | \n  121 |   char buf[1000];\n  122 |   va_list ap;\n  123 |   va_start(ap, fmt);\n  124 |   vsnprintf(buf, sizeof(buf), fmt, ap);\n  125 |   va_end(ap);\n  126 | \n  127 |   switch (level) {\n  128 |   case LDPL_INFO:\n  129 |     Out(ctx) << buf;\n  130 |     break;\n  131 |   case LDPL_WARNING:\n  132 |     Warn(ctx) << buf;\n  133 |     break;\n  134 |   case LDPL_ERROR:\n  135 |   case LDPL_FATAL:\n  136 |     Fatal(ctx) << buf;\n  137 |   }\n  138 | \n  139 |   return LDPS_OK;\n  140 | }","lines":25,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/lto-unix.cc#L116-L140"},{"ref":"src/lto-unix.cc:164-170","code":"  164 | static PluginStatus\n  165 | add_symbols(void *handle, int nsyms, const PluginSymbol *psyms) {\n  166 |   LOG << \"add_symbols: \" << nsyms << \"\\n\";\n  167 |   assert(phase == 1);\n  168 |   plugin_symbols = {psyms, psyms + nsyms};\n  169 |   return LDPS_OK;\n  170 | }","lines":7,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/lto-unix.cc#L164-L170"},{"ref":"src/lto-unix.cc:703-745","code":"  703 |   assert(phase == 1);\n  704 |   phase = 2;\n  705 | \n  706 |   // Set `referenced_by_regular_obj` bit.\n  707 |   tbb::parallel_for_each(ctx.objs, [](ObjectFile<E> *file) {\n  708 |     if (!file->is_lto_obj) {\n  709 |       for (Symbol<E> *sym : file->get_global_syms()) {\n  710 |         if (sym->file && !sym->file->is_dso &&\n  711 |             sym->file->to_obj()->is_lto_obj) {\n  712 |           std::scoped_lock lock(sym->mu);\n  713 |           sym->referenced_by_regular_obj = true;\n  714 |         }\n  715 |       }\n  716 |     }\n  717 |   });\n  718 | \n  719 |   // Symbols specified by the --wrap option needs to be visible from\n  720 |   // regular object files.\n  721 |   for (std::string_view name : ctx.arg.wrap) {\n  722 |     get_symbol(ctx, name)->referenced_by_regular_obj = true;\n  723 | \n  724 |     std::string_view x = save_string(ctx, \"__wrap_\" + std::string(name));\n  725 |     std::string_view y = save_string(ctx, \"__real_\" + std::string(name));\n  726 | \n  727 |     get_symbol(ctx, x)->referenced_by_regular_obj = true;\n  728 |     get_symbol(ctx, y)->referenced_by_regular_obj = true;\n  729 |   }\n  730 | \n  731 |   // Keep some symbols\n  732 |   for (Symbol<E> *sym : ctx.arg.undefined)\n  733 |     sym->referenced_by_regular_obj = true;\n  734 | \n  735 |   // Object files containing .gnu.offload_lto_.* sections need to be\n  736 |   // given to the LTO backend. Such sections contains code and data for\n  737 |   // peripherails (typically GPUs).\n  738 |   for (ObjectFile<E> *file : ctx.objs) {\n  739 |     if (file->is_reachable && !file->is_lto_obj && file->is_gcc_offload_obj) {\n  740 |       PluginInputFile pfile = create_plugin_input_file(ctx, file->mf);\n  741 |       int claimed = false;\n  742 |       claim_file_hook(&pfile, &claimed);\n  743 |       assert(!claimed);\n  744 |     }\n  745 |   }","lines":43,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/lto-unix.cc#L703-L745"}]},{"id":"API_11","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"Two Win32 API contract issues in `open_file_impl()`:\n\n1. `GetFileSize()` returns `INVALID_FILE_SIZE` (`0xffffffff`) both on error and\n   for a perfectly valid file whose low size dword happens to be `0xffffffff`.\n   The documented way to distinguish them is to call `GetLastError()` and check\n   for `NO_ERROR`. As written, some valid files are rejected.\n2. All Win32 error paths format the message with `errno_string()`, which reports\n   the C `errno`, not `GetLastError()`. The diagnostics are therefore unrelated\n   to the actual failure.","fix":"Use `GetFileSizeEx()` (which has an unambiguous failure indication), and add a\n`win32_error_string()` helper based on `FormatMessage(GetLastError())` for the\nerror strings in this file.","locations":[{"ref":"src/mapped-file-win32.cc:22-50","code":"   22 |   DWORD size_hi;\n   23 |   DWORD size_lo = GetFileSize(fd, &size_hi);\n   24 | \n   25 |   if (size_lo == INVALID_FILE_SIZE) {\n   26 |     error = path + \": GetFileSize failed: \" + errno_string();\n   27 |     return nullptr;\n   28 |   }\n   29 | \n   30 |   u64 size = ((u64)size_hi << 32) + size_lo;\n   31 | \n   32 |   MappedFile *mf = new MappedFile;\n   33 |   mf->name = path;\n   34 |   mf->size = size;\n   35 |   mf->fd = fd;\n   36 | \n   37 |   if (size > 0) {\n   38 |     HANDLE h = CreateFileMapping(fd, nullptr, PAGE_READONLY, 0, size, nullptr);\n   39 |     if (!h) {\n   40 |       error = path + \": CreateFileMapping failed: \" + errno_string();\n   41 |       return nullptr;\n   42 |     }\n   43 | \n   44 |     mf->data = (u8 *)MapViewOfFile(h, FILE_MAP_COPY, 0, 0, size);\n   45 |     CloseHandle(h);\n   46 | \n   47 |     if (!mf->data) {\n   48 |       error = path + \": MapViewOfFile failed: \" + errno_string();\n   49 |       return nullptr;\n   50 |     }","lines":29,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mapped-file-win32.cc#L22-L50"}]},{"id":"API_12","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"Every interposed function in `mold-wrapper.c` calls `dlsym(RTLD_NEXT, ...)` and\nuses the result without checking for `NULL`. If the symbol is not found further\ndown the search order (which can happen when the wrapper is preloaded into a\nstatically-linked or unusual binary), the code jumps through a NULL pointer and\nthe *build tool*, not mold, segfaults with no explanation. The documented way to\ncheck `dlsym` for failure is to clear `dlerror()` first and inspect it\nafterwards, since `NULL` is a legal symbol value.","fix":"Wrap the lookups:\n```c\nstatic void *get_real(const char *name) {\n  dlerror();\n  void *p = dlsym(RTLD_NEXT, name);\n  const char *err = dlerror();\n  if (!p || err) {\n    fprintf(stderr, \"mold-wrapper.so: dlsym(%s) failed: %s\\n\", name, err ? err : \"not found\");\n    _exit(1);\n  }\n  return p;\n}\n```\nand use it in all five interposers.","locations":[{"ref":"src/mold-wrapper.c:78-79","code":"   78 |   typeof(execvpe) *real = dlsym(RTLD_NEXT, \"execvp\");\n   79 |   return real(file, argv, environ);","lines":2,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mold-wrapper.c#L78-L79"},{"ref":"src/mold-wrapper.c:86-87","code":"   86 |   typeof(execve) *real = dlsym(RTLD_NEXT, \"execve\");\n   87 |   return real(path, argv, envp);","lines":2,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mold-wrapper.c#L86-L87"},{"ref":"src/mold-wrapper.c:133-134","code":"  133 |   typeof(posix_spawn) *real = dlsym(RTLD_NEXT, \"posix_spawn\");\n  134 |   return real(pid, path, file_actions, attrp, argv, envp);","lines":2,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mold-wrapper.c#L133-L134"},{"ref":"src/mold-wrapper.c:144-145","code":"  144 |   typeof(posix_spawnp) *real = dlsym(RTLD_NEXT, \"posix_spawnp\");\n  145 |   return real(pid, file, file_actions, attrp, argv, envp);","lines":2,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mold-wrapper.c#L144-L145"}]},{"id":"API_13","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`InputSection<E>::get_rels()` is declared `const` but lazily mutates shared\nstate on its owner file:\n\n```cpp\nExactArray<ElfRel<E>> &rels = file.decoded_crel[relsec_idx];\nif (!rels.data())\n  rels = decode_crel(ctx, file, shdr);\n```\n\nConstness does not propagate because `file` is a reference member. The lazy\ninitialization is unsynchronized, and `for_each_reloc()` (also `const`) reads\n`file.decoded_crel[relsec_idx].data()` to decide whether to stream or\nmaterialize. This is only safe because no two input sections currently share a\n`relsec_idx` and no pass calls `get_rels()` on the same section from two\nthreads - an invariant that is nowhere documented or asserted, and that a new\nparallel pass would break silently (a torn `ExactArray` gives a dangling\n`std::span<ElfRel<E>>`).","fix":"Drop the `const` from `get_rels()` / `for_each_reloc()` so the mutation is\nvisible in the signature, and add a comment (or an assertion in debug builds)\nrecording the invariant: \"decoded_crel[relsec_idx] is owned exclusively by the\none InputSection whose relsec_idx is this index; it must not be materialized\nconcurrently.\"","locations":[{"ref":"src/mold.h:3331-3362","code":" 3331 | template <typename E>\n 3332 | inline void InputSection<E>::for_each_reloc(Context<E> &ctx, auto fn) const {\n 3333 |   ObjectFile<E> &file = this->file;\n 3334 | \n 3335 |   if (relsec_idx != -1) {\n 3336 |     ElfShdr<E> &shdr = file.elf_sections[relsec_idx];\n 3337 |     if (shdr.sh_type == SHT_CREL &&\n 3338 |         !file.decoded_crel[relsec_idx].data()) {\n 3339 |       CrelReader<E>(ctx, file, shdr).for_each(fn);\n 3340 |       return;\n 3341 |     }\n 3342 |   }\n 3343 | \n 3344 |   std::span<const ElfRel<E>> rels = get_rels(ctx);\n 3345 |   for (i64 i = 0; i < rels.size(); i++)\n 3346 |     fn(rels[i], i);\n 3347 | }\n 3348 | \n 3349 | template <typename E>\n 3350 | inline std::span<ElfRel<E>> InputSection<E>::get_rels(Context<E> &ctx) const {\n 3351 |   if (relsec_idx == -1)\n 3352 |     return {};\n 3353 | \n 3354 |   ElfShdr<E> &shdr = file.elf_sections[relsec_idx];\n 3355 |   if (shdr.sh_type == SHT_CREL) {\n 3356 |     ExactArray<ElfRel<E>> &rels = file.decoded_crel[relsec_idx];\n 3357 |     if (!rels.data())\n 3358 |       rels = decode_crel(ctx, file, shdr);\n 3359 |     return std::span<ElfRel<E>>(rels.data(), rels.size());\n 3360 |   }\n 3361 |   return file.template get_data<ElfRel<E>>(ctx, shdr);\n 3362 | }","lines":32,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mold.h#L3331-L3362"},{"ref":"src/mold.h:566-573","code":"  566 |   ElfShdr<E> &shdr() const;\n  567 |   std::span<ElfRel<E>> get_rels(Context<E> &ctx) const;\n  568 | \n  569 |   // Visit relocations without materializing a CREL table unless another pass\n  570 |   // has already decoded it. The callback must be always-inline because this\n  571 |   // function may invoke it millions of times.\n  572 |   void for_each_reloc(Context<E> &ctx, auto fn) const;\n  573 |   std::span<FdeRecord<E>> get_fdes() const;","lines":8,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mold.h#L566-L573"}]},{"id":"API_14","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`get_umask()` reads the process umask by temporarily setting it to 0:\n\n```\nstatic u32 get_umask() {\n  u32 orig_umask = umask(0);\n  umask(orig_umask);\n  return orig_umask;\n}\n```\n\n`umask` is process-global, and mold is heavily multithreaded (TBB workers are already\nrunning when the output file is opened). Any file created by another thread during\nthat window - `--repro` archives, LTO plugin temporaries, plugin-spawned helpers -\nis created with the raw mode bits, i.e. potentially world-writable. The value is also\nrecomputed on every call instead of being read once.","fix":"Read the umask once at startup (before any worker thread exists) and cache it in a global/`Context`, or use `open(..., perm)` semantics plus `fchmod(fd, perm & ~cached_umask)` with that cached value; on Linux the umask can also be read without modifying it from `/proc/self/status` (`Umask:`).","locations":[{"ref":"src/output-file-unix.cc:17-21","code":"   17 | static u32 get_umask() {\n   18 |   u32 orig_umask = umask(0);\n   19 |   umask(orig_umask);\n   20 |   return orig_umask;\n   21 | }","lines":5,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/output-file-unix.cc#L17-L21"},{"ref":"src/output-file-unix.cc:54-55","code":"   54 |     if (fchmod(this->fd, perm & ~get_umask()) == -1)\n   55 |       Fatal(ctx) << \"fchmod failed: \" << errno_string();","lines":2,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/output-file-unix.cc#L54-L55"}]},{"id":"API_15","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`MemoryMappedOutputFile<E>::close` deliberately breaks the atomicity of the final\n`rename`:\n\n```\nfd2 = ::open(this->path.c_str(), O_RDONLY);\nif (fd2 != -1)\n  unlink(this->path.c_str());\nif (rename(output_tmpfile, this->path.c_str()) == -1)\n  Fatal(ctx) << ...;\n```\n\n`rename(2)` already replaces the destination atomically while keeping the old inode\nalive for existing openers, so the `unlink` buys nothing that the retained `fd2`\ndoes not already provide, and it opens a window in which the output path does not\nexist. A concurrent build step (a `make` rule, a running copy of the program being\nrelinked, an `inotify` watcher) can observe `ENOENT` or, worse, pick up the file\nmid-`rename`. If `rename` fails, the previous output has already been destroyed.","fix":"Drop the `unlink` and keep only `fd2 = ::open(path, O_RDONLY);` (holding the old inode open is what defers block release); let `rename` do the atomic replacement.","locations":[{"ref":"src/output-file-unix.cc:139-156","code":"  139 |   void close(Context<E> &ctx) override {\n  140 |     Timer t(ctx, \"close_file\");\n  141 | \n  142 |     if (!this->is_unmapped)\n  143 |       munmap(this->buf, vasize);\n  144 |     ::close(this->fd);\n  145 | \n  146 |     // If an output file already exists, open a file and then remove it.\n  147 |     // This is the fastest way to unlink a file, as it does not make the\n  148 |     // system to immediately release disk blocks occupied by the file.\n  149 |     fd2 = ::open(this->path.c_str(), O_RDONLY);\n  150 |     if (fd2 != -1)\n  151 |       unlink(this->path.c_str());\n  152 | \n  153 |     if (rename(output_tmpfile, this->path.c_str()) == -1)\n  154 |       Fatal(ctx) << this->path << \": rename failed: \" << errno_string();\n  155 |     output_tmpfile = nullptr;\n  156 |   }","lines":18,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/output-file-unix.cc#L139-L156"}]},{"id":"API_16","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"The `SIGSEGV` handler is installed without `SA_ONSTACK` and no alternate\nsignal stack is set up with `sigaltstack()`. A stack-overflow `SIGSEGV` - the\none case where a handler is most useful - cannot run the handler at all, so\nthe process dies without printing anything and, more importantly, without\nrunning `cleanup()`, leaving the temporary output file\n(`output_tmpfile`) behind. The Win32 counterpart explicitly handles\n`EXCEPTION_STACK_OVERFLOW`, so the platforms behave inconsistently.","fix":"Allocate a `SIGSTKSZ`-sized alternate stack once with `sigaltstack()` and add `SA_ONSTACK` to `action.sa_flags` so the handler can run (and can `unlink` the temporary file) after a stack overflow.","locations":[{"ref":"src/signal-unix.cc:66-85","code":"   66 | void install_signal_handler() {\n   67 |   struct sigaction action;\n   68 |   action.sa_sigaction = sighandler;\n   69 |   sigemptyset(&action.sa_mask);\n   70 |   action.sa_flags = SA_SIGINFO;\n   71 | \n   72 |   sigaction(SIGSEGV, &action, NULL);\n   73 |   sigaction(SIGBUS, &action, NULL);\n   74 | \n   75 |   // OneTBB 2021.9.0 has the interface version 12090.\n   76 |   if (TBB_runtime_interface_version() <= 12090) {\n   77 |     sigabrt_msg = \"mold: aborted\\n\"\n   78 |       \"mold:
