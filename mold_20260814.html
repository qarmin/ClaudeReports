   i64 sz = ctx.phdr->shdr.sh_size;\n 3126 |       ctx.phdr->update_shdr(ctx);\n 3127 |       if (sz < ctx.phdr->shdr.sh_size)\n 3128 |         continue;\n 3129 |     }\n 3130 | \n 3131 |     return fileoff;\n 3132 |   }\n 3133 | }","lines":34,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/passes.cc#L3100-L3133"}]},{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"The `check` lambda in `InputSection<E>::apply_reloc_nonalloc()` passes its arguments to\n`check_range()` in the wrong order. The declaration is\n`check_range(Context<E> &ctx, i64 i, i64 val, i64 lo, i64 hi)` (see `src/mold.h:3439`), but the\nnon-allocated variants call `check_range(ctx, val, i, lo, hi)`, i.e. the relocation *index* and\nthe relocation *value* are swapped. The allocated variants in the very same files get it right\n(`check_range(ctx, i, val, lo, hi)` at `src/arch-i386.cc:303` and `src/arch-arm64.cc:168`).\n\nTwo consequences:\n\n1. The range test `if (val < lo || hi <= val)` is applied to the relocation index instead of the\n   relocated value, so every overflow check in non-allocated sections is dead. Values that do not\n   fit are silently truncated into `.debug_*` output instead of producing a diagnostic.\n2. When the bogus test *does* fire, `check_range()` executes `get_rels(ctx)[i]` with `i` set to the\n   relocation *value* (an absolute address, e.g. `S + A`). For `arch-i386.cc` this is easily\n   reachable: `R_386_8` uses `hi == 1 << 8`, so any non-allocated section with 256 or more\n   relocations makes the index-based test fail and dereferences `get_rels()` far out of bounds,\n   crashing the linker (or reading arbitrary heap) on an ordinary `-g` build.\n\nThe same swap exists in `src/arch-s390x.cc:365`, `src/arch-ppc64v1.cc:306` and\n`src/arch-sparc64.cc:533`, so the fix should be applied consistently across all of them.","fix":"Swap the two arguments back so the lambda matches the allocated variant.\n\nBefore:\n```cpp\n    auto check = [&](i64 val, i64 lo, i64 hi) {\n      check_range(ctx, val, i, lo, hi);\n    };\n```\n\nAfter:\n```cpp\n    auto check = [&](i64 val, i64 lo, i64 hi) {\n      check_range(ctx, i, val, lo, hi);\n    };\n```\n\nConsider also making the mistake impossible by giving `check_range()` a distinct parameter type\nfor the index (e.g. a `RelIdx` wrapper struct) or by reordering the parameters to\n`check_range(ctx, val, lo, hi, i)`.","locations":[{"ref":"src/arch-i386.cc:459-461","code":"  459 |     auto check = [&](i64 val, i64 lo, i64 hi) {\n  460 |       check_range(ctx, val, i, lo, hi);\n  461 |     };","lines":3,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/arch-i386.cc#L459-L461"},{"ref":"src/arch-arm64.cc:500-502","code":"  500 |     auto check = [&](i64 val, i64 lo, i64 hi) {\n  501 |       check_range(ctx, val, i, lo, hi);\n  502 |     };","lines":3,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/arch-arm64.cc#L500-L502"},{"ref":"src/mold.h:3437-3447","code":" 3437 | template <typename E>\n 3438 | inline void\n 3439 | InputSection<E>::check_range(Context<E> &ctx, i64 i, i64 val, i64 lo, i64 hi) {\n 3440 |   if (val < lo || hi <= val) {\n 3441 |     const ElfRel<E> &rel = get_rels(ctx)[i];\n 3442 |     Symbol<E> &sym = *file.symbols[rel.r_sym];\n 3443 |     Error(ctx) << *this << \": relocation \" << rel << \" against \"\n 3444 |                << sym << \" out of range: \" << val << \" is not in [\"\n 3445 |                << lo << \", \" << hi << \")\";\n 3446 |   }\n 3447 | }","lines":11,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mold.h#L3437-L3447"}]},{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`R_PPC64_GOT16`, `R_PPC64_GOT16_LO`, `R_PPC64_GOT16_HI` and `R_PPC64_GOT16_HA` compute\n`G - TOC`, where `G` is only the *offset* of the symbol's slot inside `.got`\n(`G = sym.get_got_idx(ctx) * sizeof(Word<E>)`). The value that must be encoded is the\nTOC-relative address of that GOT slot, i.e. `G + GOT - TOC`. Because `GOT`\n(`ctx.got->shdr.sh_addr`) is missing, the computed displacement is off by the absolute\naddress of `.got` (a value in the gigabytes), so the resulting `addis`/`ld` pair reads from\na completely wrong address. Every neighbouring case in the same file gets this right:\n`R_PPC64_PLT16_*` uses `G + GOT - TOC` (`src/arch-ppc64v2.cc:278-289`) and the TLS GOT\ncases use full addresses such as `sym.get_gottp_addr(ctx) - TOC`. The identical mistake\nexists in the ELFv1 backend.","fix":"Add the GOT base, mirroring the `PLT16` cases:\n```\n     case R_PPC64_GOT16:\n-      *(ul16 *)loc = G - TOC;\n+      *(ul16 *)loc = G + GOT - TOC;\n```\nand likewise for `_LO`, `_HI`, `_HA` in `arch-ppc64v2.cc` and for `R_PPC64_GOT16` in\n`arch-ppc64v1.cc`. Consider adding an overflow check as well, since a 16-bit field cannot\nhold an arbitrary TOC displacement.","locations":[{"ref":"src/arch-ppc64v2.cc:266-277","code":"  266 |     case R_PPC64_GOT16:\n  267 |       *(ul16 *)loc = G - TOC;\n  268 |       break;\n  269 |     case R_PPC64_GOT16_LO:\n  270 |       *(ul16 *)loc = lo(G - TOC);\n  271 |       break;\n  272 |     case R_PPC64_GOT16_HI:\n  273 |       *(ul16 *)loc = hi(G - TOC);\n  274 |       break;\n  275 |     case R_PPC64_GOT16_HA:\n  276 |       *(ul16 *)loc = ha(G - TOC);\n  277 |       break;","lines":12,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/arch-ppc64v2.cc#L266-L277"},{"ref":"src/arch-ppc64v1.cc:225-227","code":"  225 |     case R_PPC64_GOT16:\n  226 |       *(ub16 *)loc = G - TOC;\n  227 |       break;","lines":3,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/arch-ppc64v1.cc#L225-L227"}]},{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In `InputSection<E>::apply_reloc_alloc`, `R_RISCV_ADD8` and `R_RISCV_SUB8` increment/decrement\nthe *pointer* `loc` instead of the byte it points to. `loc` is a plain `u8 *`, so\n`loc += S + A;` just advances a local pointer that is re-initialized on the next loop\niteration and is never used again in the current one. The net effect is that 8-bit\nadd/sub relocations in allocated sections are silently ignored, so `.byte foo - bar`\nstyle expressions in `SHF_ALLOC` sections (used by `.gcc_except_table`,\n`__patchable_function_entries`, and hand-written assembly) are written as zero/garbage.\nThe same relocations are handled correctly in `apply_reloc_nonalloc`\n(`*loc += S + A;`, `src/arch-riscv.cc:719-720`) and in `apply_eh_reloc`\n(`*loc -= val;`, `src/arch-riscv.cc:171-173`), which shows the intent.","fix":"Dereference the pointer:\n```\n     case R_RISCV_ADD8:\n-      loc += S + A;\n+      *loc += S + A;\n       break;\n...\n     case R_RISCV_SUB8:\n-      loc -= S + A;\n+      *loc -= S + A;\n       break;\n```","locations":[{"ref":"src/arch-riscv.cc:597-599","code":"  597 |     case R_RISCV_ADD8:\n  598 |       loc += S + A;\n  599 |       break;","lines":3,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/arch-riscv.cc#L597-L599"},{"ref":"src/arch-riscv.cc:609-611","code":"  609 |     case R_RISCV_SUB8:\n  610 |       loc -= S + A;\n  611 |       break;","lines":3,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/arch-riscv.cc#L609-L611"}]},{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"s390x is a big-endian target and every other memory access in this backend uses the\nbig-endian `ub16`/`ub32`/`ub64` types, but the three 12-bit displacement relocations use\nthe *little-endian* `ul16` type. Writing a 12-bit immediate through `ul16` byte-swaps the\nfield: the low 8 bits of the displacement land in the byte that holds\n`B2 || D2[11:8]` and the high 4 bits land in the byte that holds `D2[7:0]`. The result is\na corrupted base register field and a corrupted displacement for `R_390_12`,\n`R_390_GOT12`, `R_390_GOTPLT12`, `R_390_PC12DBL` and `R_390_PLT12DBL`. The bug survives\nbecause GCC rarely emits these relocation types.","fix":"Use the big-endian accessor in all three places, e.g.:\n```\n     case R_390_12:\n       check(S + A, 0, 1 << 12);\n-      *(ul16 *)loc |= bits(S + A, 11, 0);\n+      *(ub16 *)loc |= bits(S + A, 11, 0);\n       break;\n```","locations":[{"ref":"src/arch-s390x.cc:163-166","code":"  163 |     case R_390_12:\n  164 |       check(S + A, 0, 1 << 12);\n  165 |       *(ul16 *)loc |= bits(S + A, 11, 0);\n  166 |       break;","lines":4,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/arch-s390x.cc#L163-L166"},{"ref":"src/arch-s390x.cc:180-184","code":"  180 |     case R_390_PC12DBL:\n  181 |     case R_390_PLT12DBL:\n  182 |       check_dbl(S + A - P, -(1 << 12), 1 << 12);\n  183 |       *(ul16 *)loc |= bits(S + A - P, 12, 1);\n  184 |       break;","lines":5,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/arch-s390x.cc#L180-L184"},{"ref":"src/arch-s390x.cc:212-216","code":"  212 |     case R_390_GOT12:\n  213 |     case R_390_GOTPLT12:\n  214 |       check(G + A, 0, 1 << 12);\n  215 |       *(ul16 *)loc |= bits(G + A, 11, 0);\n  216 |       break;","lines":5,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/arch-s390x.cc#L212-L216"}]},{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"`R_SPARC_WDISP16` patches the instruction word through a 16-bit store instead of a 32-bit\none. Every other instruction-patching case in this file uses `*(ub32 *)loc`. Two things go\nwrong: (1) the `bit(val, 16) << 21` term is thrown away entirely because it does not fit in\n16 bits, and (2) SPARC is big-endian, so a `ub16` store at `loc` targets bits 31..16 of the\ninstruction word - `bits(val, 15, 2)`, which belongs in the `d16lo` field at bits 13..0,\nis OR'ed into the opcode/rd fields instead. Any object file using `R_SPARC_WDISP16` (the\n`BPr` register-branch relocation) therefore produces a corrupted instruction.","fix":"Change the store width:\n```\n-      *(ub16 *)loc |= (bit(val, 16) << 21) | bits(val, 15, 2);\n+      *(ub32 *)loc |= (bit(val, 16) << 21) | bits(val, 15, 2);\n```\nWhile there, note that the `d16hi` field is 2 bits wide at instruction bits 21..20, so the\ncorrect encoding is `(bits(val, 17, 16) << 20) | bits(val, 15, 2)`.","locations":[{"ref":"src/arch-sparc64.cc:290-295","code":"  290 |     case R_SPARC_WDISP16: {\n  291 |       i64 val = S + A - P;\n  292 |       check(val, -(1 << 16), 1 << 16);\n  293 |       *(ub16 *)loc |= (bit(val, 16) << 21) | bits(val, 15, 2);\n  294 |       break;\n  295 |     }","lines":6,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/arch-sparc64.cc#L290-L295"}]},{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"`--dynamic-list-data` is a boolean flag (see the help text: \"Add data symbols to dynamic\nsymbols\"), but it is parsed with `read_arg`, which consumes the *next* command line argument\nas its value when the option is written without `=`. `mold --dynamic-list-data foo.o -o a.out`\ntherefore silently drops `foo.o` from the link (or, if the option is last, dies with\n\"argument missing\"). The consumed value is discarded, so the mistake is invisible.","fix":"```\n-    } else if (read_arg(\"dynamic-list-data\")) {\n+    } else if (read_flag(\"dynamic-list-data\")) {\n       ctx.arg.dynamic_list_data = true;\n```","locations":[{"ref":"src/cmdline.cc:1507-1508","code":" 1507 |     } else if (read_arg(\"dynamic-list-data\")) {\n 1508 |       ctx.arg.dynamic_list_data = true;","lines":2,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/cmdline.cc#L1507-L1508"}]},{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`enqueue_symbol` in `collect_root_set` does not mark shared libraries as\nreachable, unlike `visit_section`, which does\n`sym.file->is_reachable.test_and_set()` for symbols defined in a DSO. The CIE\nroot loop feeds every CIE relocation through `enqueue_symbol`, and a CIE's\nrelocations point at the personality routine (e.g. `__gxx_personality_v0`).\nFor a DSO-defined personality routine, `sym->get_frag()` is null and\n`sym->get_input_section()` is null, so `enqueue_section(nullptr)` is a no-op\nand the DSO is never marked reachable. With `--gc-sections --as-needed`,\n`gc_sections` clears `is_reachable` for every `as_needed` DSO up front and then\n`std::erase_if` drops it, so the library providing the personality routine can\nbe dropped from `DT_NEEDED` even though the program needs it at run time.","fix":"Make `enqueue_symbol` mirror the DSO handling in `visit_section`:\n```cpp\nauto enqueue_symbol = [&](Symbol<E> *sym) {\n  if (!sym)\n    return;\n  if (sym->file && sym->file->is_dso) {\n    sym->file->is_reachable.test_and_set();\n    return;\n  }\n  if (SectionFragment<E> *frag = sym->get_frag())\n    frag->is_alive = true;\n  else\n    enqueue_section(sym->get_input_section());\n};\n```","locations":[{"ref":"src/gc-sections.cc:74-81","code":"   74 |   auto enqueue_symbol = [&](Symbol<E> *sym) {\n   75 |     if (sym) {\n   76 |       if (SectionFragment<E> *frag = sym->get_frag())\n   77 |         frag->is_alive = true;\n   78 |       else\n   79 |         enqueue_section(sym->get_input_section());\n   80 |     }\n   81 |   };","lines":8,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/gc-sections.cc#L74-L81"},{"ref":"src/gc-sections.cc:113-117","code":"  113 |   tbb::parallel_for_each(ctx.objs, [&](ObjectFile<E> *file) {\n  114 |     for (CieRecord<E> &cie : file->cies)\n  115 |       for (const ElfRel<E> &rel : cie.get_rels())\n  116 |         enqueue_symbol(file->symbols[rel.r_sym]);\n  117 |   });","lines":5,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/gc-sections.cc#L113-L117"},{"ref":"src/gc-sections.cc:254-271","code":"  254 |   for (SharedFile<E> *file : ctx.dsos)\n  255 |     if (file->as_needed)\n  256 |       file->is_reachable = false;\n  257 | \n  258 |   for (Symbol<E> *sym : ctx.arg.undefined)\n  259 |     if (sym->file && sym->file->is_dso)\n  260 |       sym->file->is_reachable = true;\n  261 | \n  262 |   for (Symbol<E> *sym : ctx.arg.require_defined)\n  263 |     if (sym->file && sym->file->is_dso)\n  264 |       sym->file->is_reachable = true;\n  265 | \n  266 |   tbb::concurrent_vector<InputSection<E> *> rootset = collect_root_set(ctx);\n  267 |   StartStopMap<E> start_stop_map = build_start_stop_map(ctx);\n  268 |   mark(ctx, rootset, start_stop_map);\n  269 |   sweep(ctx);\n  270 | \n  271 |   std::erase_if(ctx.dsos, [](SharedFile<E> *file) { return !file->is_reachable; });","lines":18,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/gc-sections.cc#L254-L271"}]},{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`DW_FORM_implicit_const` is handled in the abbrev *skipping* loop of\n`find_cu_abbrev` (an extra ULEB is consumed from the abbrev stream), but not in\nthe attribute-reading loop of `read_address_ranges`. There, after\n`read_uleb(&abbrev)` returns `form == DW_FORM_implicit_const`, the code calls\n`read_scalar`, which has no case for `0x21` and therefore hits `default:` and\nkills the link with `--gdb-index: unhandled debug info form: 0x21`. Even if the\nform were tolerated, the implicit value stored in the abbrev would not be\nconsumed, desynchronizing the abbrev cursor and misparsing every following\nattribute (including `DW_AT_low_pc` / `DW_AT_ranges`). GCC emits\n`DW_FORM_implicit_const` routinely with `-gdwarf-5`, so `--gdb-index` can fail\noutright on ordinary DWARF 5 input.","fix":"Consume the implicit value from the abbrev stream and use it as the attribute\nvalue without advancing the `.debug_info` cursor:\n```cpp\nu64 name = read_uleb(&abbrev);\nu64 form = read_uleb(&abbrev);\nif (name == 0 && form == 0)\n  break;\n\nu64 val;\nif (form == DW_FORM_implicit_const)\n  val = read_sleb(&abbrev);\nelse\n  val = read_scalar<E, Offset>(ctx, &p, form);\n```","locations":[{"ref":"src/gdb-index.cc:341-348","code":"  341 |     for (;;) {\n  342 |       u64 name = read_uleb(&abbrev);\n  343 |       u64 form = read_uleb(&abbrev);\n  344 |       if (name == 0 && form == 0)\n  345 |         break;\n  346 |       if (form == DW_FORM_implicit_const)\n  347 |         read_uleb(&abbrev);\n  348 |     }","lines":8,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/gdb-index.cc#L341-L348"},{"ref":"src/gdb-index.cc:528-554","code":"  528 |   // Read all interesting debug records.\n  529 |   for (;;) {\n  530 |     u64 name = read_uleb(&abbrev);\n  531 |     u64 form = read_uleb(&abbrev);\n  532 |     if (name == 0 && form == 0)\n  533 |       break;\n  534 | \n  535 |     u64 val = read_scalar<E, Offset>(ctx, &p, form);\n  536 | \n  537 |     switch (name) {\n  538 |     case DW_AT_low_pc:\n  539 |       low_pc = {form, val};\n  540 |       break;\n  541 |     case DW_AT_high_pc:\n  542 |       high_pc = {form, val};\n  543 |       break;\n  544 |     case DW_AT_rnglists_base:\n  545 |       rnglists_base = val;\n  546 |       break;\n  547 |     case DW_AT_addr_base:\n  548 |       addrx = (Word<E> *)(&ctx.debug_addr[0] + val);\n  549 |       break;\n  550 |     case DW_AT_ranges:\n  551 |       ranges = {form, val};\n  552 |       break;\n  553 |     }\n  554 |   }","lines":27,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/gdb-index.cc#L528-L554"}]},{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`MergedSection<E>::compute_section_size` splits fragments into a DWARF32 region\n(`is_32bit`, offsets accumulated in `off1`) and a DWARF64 region (`off2`), producing\n`2 * NUM_SHARDS` per-shard sizes and a `shard_offsets` prefix array of\n`2 * NUM_SHARDS + 1` entries. The final pass that turns shard-local offsets into\nsection-global offsets starts at shard **1**:\n\n```\ntbb::parallel_for((i64)1, map.NUM_SHARDS, [&](i64 i) { ... frag.offset += shard_offsets[i] or shard_offsets[i + map.NUM_SHARDS]; });\n```\n\nStarting at 1 was correct before the split, because `shard_offsets[0] == 0`. It is\nwrong now: the non-`is_32bit` fragments of shard 0 need `shard_offsets[NUM_SHARDS]`\nadded, which is the (non-zero) start of the DWARF64 region. Those fragments keep\noffsets relative to the beginning of the section and therefore overlap the DWARF32\nstrings. The result is a corrupted `.debug_str`/`.debug_line_str` (strings written on\ntop of each other, wrong string offsets in debug info) whenever a link mixes DWARF32\nand DWARF64 objects, which is exactly the case this code path was written for.","fix":"Change the loop bound to cover shard 0: `tbb::parallel_for((i64)0, map.NUM_SHARDS, ...)`. (`shard_offsets[0]` is still 0, so the `is_32bit` branch is unaffected.)","locations":[{"ref":"src/output-chunks.cc:2527-2546","code":" 2527 |   i64 shard_size = map.nbuckets / map.NUM_SHARDS;\n 2528 |   shard_offsets.resize(sizes.size() + 1);\n 2529 | \n 2530 |   for (i64 i = 1; i < sizes.size() + 1; i++)\n 2531 |     shard_offsets[i] =\n 2532 |       align_to(shard_offsets[i - 1] + sizes[i - 1], this->shdr.sh_addralign);\n 2533 | \n 2534 |   this->shdr.sh_size = shard_offsets.back();\n 2535 | \n 2536 |   tbb::parallel_for((i64)1, map.NUM_SHARDS, [&](i64 i) {\n 2537 |     for (i64 j = shard_size * i; j < shard_size * (i + 1); j++) {\n 2538 |       SectionFragment<E> &frag = map.entries[j].value;\n 2539 |       if (frag.is_alive) {\n 2540 |         if (frag.is_32bit)\n 2541 |           frag.offset += shard_offsets[i];\n 2542 |         else\n 2543 |           frag.offset += shard_offsets[i + map.NUM_SHARDS];\n 2544 |       }\n 2545 |     }\n 2546 |   });","lines":20,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/output-chunks.cc#L2527-L2546"}]},{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`R_ARM_PLT32` is the only function-call relocation in `apply_reloc_alloc()` that never checks\nwhether the branch displacement fits. `R_ARM_CALL` uses `if (is_int(val, 26))` and\n`R_ARM_JUMP24` uses `if (T || !is_int(val, 26))` to redirect through a range-extension thunk,\nbut `R_ARM_PLT32` only redirects when the target is Thumb (`T`) and otherwise writes\n`bits(val, 25, 2)` unconditionally, silently truncating an out-of-range displacement to a\nbranch to a wrong address.\n\nThe thunk is actually available: `R_ARM_PLT32` is listed in `ARM32LE::R_FUNCALL`\n(`src/elf.h:1992-1994`) so `requires_thunk()` reserves a thunk slot for it; only the apply step\nforgets to use it. The result is a silently miscompiled binary rather than a link error whenever\nan ARM32 `.text` grows beyond ±32 MiB and the (legacy) `R_ARM_PLT32` relocation is in use.","fix":"Mirror the `R_ARM_JUMP24` logic:\n\n```cpp\n    case R_ARM_PLT32:\n      if (sym.is_remaining_undef_weak()) {\n        *(U32<E> *)loc = 0xe320'f000; // NOP\n      } else {\n        i64 val = S + A - P;\n        if (T || !is_int(val, 26))\n          val = get_arm_thunk_addr() + A - P;\n        *(U32<E> *)loc = (*(U32<E> *)loc & 0xff00'0000) | bits(val, 25, 2);\n      }\n      break;\n```","locations":[{"ref":"src/arch-arm32.cc:412-419","code":"  412 |     case R_ARM_PLT32:\n  413 |       if (sym.is_remaining_undef_weak()) {\n  414 |         *(U32<E> *)loc = 0xe320'f000; // NOP\n  415 |       } else {\n  416 |         u64 val = (T ? get_arm_thunk_addr() : S) + A - P;\n  417 |         *(U32<E> *)loc = (*(U32<E> *)loc & 0xff00'0000) | bits(val, 25, 2);\n  418 |       }\n  419 |       break;","lines":8,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/arch-arm32.cc#L412-L419"},{"ref":"src/arch-arm32.cc:394-411","code":"  394 |     case R_ARM_JUMP24: {\n  395 |       if (sym.is_remaining_undef_weak()) {\n  396 |         *(U32<E> *)loc = 0xe320'f000; // NOP\n  397 |         break;\n  398 |       }\n  399 | \n  400 |       // These relocs refers to a B (unconditional branch) instruction.\n  401 |       // Unlike BL or BLX, we can't rewrite B to BX in place when the\n  402 |       // processor mode switch is required because BX doesn't takes an\n  403 |       // immediate; it takes only a register. So if mode switch is\n  404 |       // required, we jump to a linker-synthesized thunk which does the\n  405 |       // job with a longer code sequence.\n  406 |       i64 val = S + A - P;\n  407 |       if (T || !is_int(val, 26))\n  408 |         val = get_arm_thunk_addr() + A - P;\n  409 |       *(U32<E> *)loc = (*(U32<E> *)loc & 0xff00'0000) | bits(val, 25, 2);\n  410 |       break;\n  411 |     }","lines":18,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/arch-arm32.cc#L394-L411"}]},{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`R_68K_TLS_LE16` and `R_68K_TLS_LE8` are written with the *unsigned* helpers `write16`\n(`check(val, 0, 1 << 16)`) and `write8` (`check(val, 0, 1 << 8)`), but on m68k the thread\npointer is placed 0x7000 bytes *into* the TLS block\n(`get_tp_addr()` returns `phdr.p_vaddr + 0x7000`, `src/tls.cc:170-178`). Therefore\n`S + A - ctx.tp_addr` is negative for every thread-local variable in the first 28 KiB of\nthe TLS block, and mold reports a bogus `relocation ... out of range` error (or, with\n`--noinhibit-exec`, writes a truncated value). The sibling `R_68K_TLS_LDO16`/`LDO8` cases,\nwhose value is biased the same way, correctly use the signed `write16s`/`write8s` helpers.","fix":"Use the signed variants for the TP-relative cases:\n```\n     case R_68K_TLS_LE16:\n-      write16(S + A - ctx.tp_addr);\n+      write16s(S + A - ctx.tp_addr);\n       break;\n     case R_68K_TLS_LE8:\n-      write8(S + A - ctx.tp_addr);\n+      write8s(S + A - ctx.tp_addr);\n       break;\n```","locations":[{"ref":"src/arch-m68k.cc:199-207","code":"  199 |     case R_68K_TLS_LE32:\n  200 |       *(ub32 *)loc = S + A - ctx.tp_addr;\n  201 |       break;\n  202 |     case R_68K_TLS_LE16:\n  203 |       write16(S + A - ctx.tp_addr);\n  204 |       break;\n  205 |     case R_68K_TLS_LE8:\n  206 |       write8(S + A - ctx.tp_addr);\n  207 |       break;","lines":9,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/arch-m68k.cc#L199-L207"},{"ref":"src/arch-m68k.cc:184-189","code":"  184 |     case R_68K_TLS_LDO16:\n  185 |       write16s(S + A - ctx.dtp_addr);\n  186 |       break;\n  187 |     case R_68K_TLS_LDO8:\n  188 |       write8s(S + A - ctx.dtp_addr);\n  189 |       break;","lines":6,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/arch-m68k.cc#L184-L189"}]},{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`PPC64OpdSection` unconditionally emits `R_PPC64_RELATIVE` dynamic relocations (or RELR\nentries) for every `.opd` entry, storing `sym->get_addr(ctx, NO_PLT | NO_OPD)` as the\naddend. For a GNU ifunc symbol that address is the *resolver*, so a function pointer taken\nto an ifunc resolves to the resolver itself instead of the selected implementation.\n`scan_relocations` does mark ifuncs with `NEEDS_GOT | NEEDS_PLT | NEEDS_PPC_OPD`\n(`src/arch-ppc64v1.cc:343-344`) and `PPC64V1` does define `R_IRELATIVE`\n(`src/elf.h:2090-2107`), so ifunc support is intended. `GotSection` handles the same\nsituation correctly by emitting `R_IRELATIVE` and excluding ifunc slots from RELR\n(`src/output-chunks.cc:1716-1718`).","fix":"In `PPC64OpdSection::write_dynrels` emit `ElfRel<E>(loc, E::R_IRELATIVE, 0, sym->get_addr(ctx, NO_PLT | NO_OPD))`\nwhen `sym->is_ifunc()`, and skip such entries in `get_relr_offsets()` (RELR can only encode\nplain relative relocations), exactly as `GotSection` does.","locations":[{"ref":"src/arch-ppc64v1.cc:663-687","code":"  663 | void PPC64OpdSection::write_dynrels(Context<E> &ctx, ElfRel<E> *buf) const {\n  664 |   if (!ctx.arg.pic)\n  665 |     return;\n  666 | \n  667 |   for (Symbol<E> *sym : symbols) {\n  668 |     u64 loc = sym->get_opd_addr(ctx);\n  669 |     if (!ctx.arg.pack_dyn_relocs_relr || !this->num_relrs ||\n  670 |         loc % sizeof(Word<E>) != 0)\n  671 |       *buf++ = ElfRel<E>(loc, E::R_RELATIVE, 0, sym->get_addr(ctx, NO_PLT | NO_OPD));\n  672 |     if (!ctx.arg.pack_dyn_relocs_relr || !this->num_relrs ||\n  673 |         (loc + 8) % sizeof(Word<E>) != 0)\n  674 |       *buf++ = ElfRel<E>(loc + 8, E::R_RELATIVE, 0, ctx.extra.TOC->value);\n  675 |   }\n  676 | }\n  677 | \n  678 | void PPC64OpdSection::copy_buf(Context<E> &ctx) {\n  679 |   ub64 *buf = (ub64 *)(ctx.buf + this->shdr.sh_offset);\n  680 | \n  681 |   for (Symbol<E> *sym : symbols) {\n  682 |     u64 addr = sym->get_addr(ctx, NO_PLT | NO_OPD);\n  683 |     *buf++ = addr;\n  684 |     *buf++ = ctx.extra.TOC->value;\n  685 |     *buf++ = 0;\n  686 |   }\n  687 | }","lines":25,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/arch-ppc64v1.cc#L663-L687"},{"ref":"src/arch-ppc64v1.cc:649-661","code":"  649 | std::vector<u64> PPC64OpdSection::get_relr_offsets(Context<E> &ctx) {\n  650 |   if (!ctx.arg.pic)\n  651 |     return {};\n  652 | \n  653 |   std::vector<u64> offsets;\n  654 |   offsets.reserve(symbols.size() * 2);\n  655 |   for (Symbol<E> *sym : symbols) {\n  656 |     u64 loc = sym->get_opd_addr(ctx) - this->shdr.sh_addr;\n  657 |     offsets.push_back(loc);\n  658 |     offsets.push_back(loc + 8);\n  659 |   }\n  660 |   return offsets;\n  661 | }","lines":13,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/arch-ppc64v1.cc#L649-L661"}]},{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`apply_reloc_alloc` writes 4 bytes *after* the relocated place without any bounds check:\nthe ELFv2 backend tests `*(ul32 *)(loc + 4) == 0x6000'0000` and overwrites it with\n`ld r2, 24(r1)`, and the ELFv1 backend does the same with `ld r2, 40(r1)`. `r_offset` comes\nfrom the input object file, so a `R_PPC64_REL24` whose `bl` is the last instruction of a\nsection makes mold read and potentially write into whatever output-buffer bytes follow the\nsection - i.e. the beginning of the next input section in the same output section.","fix":"Guard the peek/patch with the section size, e.g.\n`if (rel.r_offset + 8 <= (u64)sh_size && *(ul32 *)(loc + 4) == 0x6000'0000)`, and report an\nerror (or simply skip the r2 restore) otherwise.","locations":[{"ref":"src/arch-ppc64v2.cc:229-232","code":"  229 |         // restore it after function return. To do so, there's usually a\n  230 |         // NOP as a placeholder after a BL. 0x6000'0000 is a NOP.\n  231 |         if (*(ul32 *)(loc + 4) == 0x6000'0000)\n  232 |           *(ul32 *)(loc + 4) = 0xe841'0018; // ld r2, 24(r1)","lines":4,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/arch-ppc64v2.cc#L229-L232"},{"ref":"src/arch-ppc64v1.cc:205-210","code":"  205 |       // If a callee is an external function, PLT saves %r2 to the\n  206 |       // caller's r2 save slot. We need to restore it after function\n  207 |       // return. To do so, there's usually a NOP as a placeholder\n  208 |       // after a BL. 0x6000'0000 is a NOP.\n  209 |       if (sym.has_plt(ctx) && *(ub32 *)(loc + 4) == 0x6000'0000)\n  210 |         *(ub32 *)(loc + 4) = 0xe841'0028; // ld r2, 40(r1)","lines":6,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/arch-ppc64v1.cc#L205-L210"}]},{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"The mask in `set_rs1` is one binary digit short: `0b111111'11111'00000'111'11111'1111111`\ncontains 31 digits, so as a 32-bit value it is `0x7ff07fff` rather than the intended\n`0xfff07fff`. In addition to clearing the `rs1` field (bits 19..15) it therefore also\nclears bit 31 of the instruction, which is `imm[11]` for I-type and the top bit of\n`imm[11:5]` for S-type. `set_rs1` is called right after `write_itype`/`write_stype` when\n`is_int(val, 12)` holds (`src/arch-riscv.cc:465-466` and `src/arch-riscv.cc:494-495`), and\nthat condition explicitly admits negative 12-bit values, whose sign bit is exactly bit 31.\nSo for a negative `%lo12` value the just-written immediate is silently truncated to a\npositive one.","fix":"Add the missing digit so the mask covers all 32 bits:\n```\n-  *(ul32 *)loc &= 0b111111'11111'00000'111'11111'1111111;\n+  *(ul32 *)loc &= 0b1111111'11111'00000'111'11111'1111111;\n```\n(`0b1111111'11111` = the 12-bit immediate field, i.e. mask `0xfff07fff`.)","locations":[{"ref":"src/arch-riscv.cc:83-87","code":"   83 | static void set_rs1(u8 *loc, u32 rs1) {\n   84 |   assert(rs1 < 32);\n   85 |   *(ul32 *)loc &= 0b111111'11111'00000'111'11111'1111111;\n   86 |   *(ul32 *)loc |= rs1 << 15;\n   87 | }","lines":5,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/arch-riscv.cc#L83-L87"}]},{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`shrink_section` derives the alignment requested by `R_RISCV_ALIGN` as\n`bit_ceil(r.r_addend)`, but `r_addend` holds the number of NOP *padding* bytes, which the\nassembler emits as `alignment - min_insn_size` (2 with RVC, 4 without). When that value is\nalready a power of two the rounding produces a too-small alignment: for `.align 2`\n(4-byte) in RVC code `r_addend` is 2 and `bit_ceil(2) == 2`, and for `.align 3` (8-byte) in\nnon-RVC code `r_addend` is 4 and `bit_ceil(4) == 4`. With alignment 2, `align_to(P, 2)`\nalways equals `P` (instructions are always 2-byte aligned), so mold unconditionally removes\nall the padding and the following instruction can end up at an address that is only 2-byte\naligned, silently violating the mandatory `.align` directive.","fix":"Round up from a value that is strictly larger than the padding, e.g.\n`bit_ceil(r.r_addend + 1)` (LLVM's lld uses `PowerOf2Ceil(addend + 2)`):\n```\n-      u64 desired = align_to(P, bit_ceil(r.r_addend));\n+      u64 desired = align_to(P, bit_ceil(r.r_addend + 1));\n```\nThis maps padding 2 -> alignment 4, 4 -> 8, 6 -> 8, 14 -> 16, and leaves padding 0 a no-op.","locations":[{"ref":"src/arch-riscv.cc:912-921","code":"  912 |     if (r.r_type == R_RISCV_ALIGN) {\n  913 |       // The total bytes of NOPs is stored to r_addend, so the next\n  914 |       // instruction is r_addend away.\n  915 |       u64 P = isec.get_addr() + r.r_offset - r_delta;\n  916 |       u64 desired = align_to(P, bit_ceil(r.r_addend));\n  917 |       u64 actual = P + r.r_addend;\n  918 |       if (desired != actual)\n  919 |         remove(actual - desired);\n  920 |       continue;\n  921 |     }","lines":10,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/arch-riscv.cc#L912-L921"}]},{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`--thinlto-index-only` is handled by `read_arg` first and `read_flag` second. `read_arg`\nmatches  | \n  408 |     for (const ElfRel<E> &rel : isec.get_rels(ctx))\n  409 |       if (Symbol<E> &sym = *isec.file.symbols[rel.r_sym];\n  410 |           InputSection<E> *isec = sym.get_input_section())\n  411 |         if (isec->icf_eligible)\n  412 |           edge_indices[i + 1]++;\n  413 |   });\n  414 | \n  415 |   for (i64 i = 1; i < edge_indices.size(); i++)\n  416 |     edge_indices[i] += edge_indices[i - 1];\n  417 | \n  418 |   edges.resize(edge_indices.back());\n  419 | \n  420 |   tbb::parallel_for((i64)0, (i64)sections.size(), [&](i64 i) {\n  421 |     InputSection<E> &isec = *sections[i];\n  422 |     i64 idx = edge_indices[i];\n  423 | \n  424 |     for (FdeRecord<E> &fde : isec.get_fdes())\n  425 |       for (const ElfRel<E> &rel : fde.get_rels(isec.file).subspan(1))\n  426 |         if (Symbol<E> &sym = *isec.file.symbols[rel.r_sym];\n  427 |             InputSection<E> *isec = sym.get_input_section())\n  428 |           if (isec->icf_eligible)\n  429 |             edges[idx++] = isec->icf_idx;\n  430 | \n  431 |     for (const ElfRel<E> &rel : isec.get_rels(ctx))\n  432 |       if (Symbol<E> &sym = *isec.file.symbols[rel.r_sym];\n  433 |           InputSection<E> *isec = sym.get_input_section())\n  434 |         if (isec->icf_eligible)\n  435 |           edges[idx++] = isec->icf_idx;\n  436 |   });","lines":40,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/icf.cc#L397-L436"}]},{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The zstd decompression loop can spin forever on a truncated/corrupt compressed\nsection. `ZSTD_decompressStream()` returns a non-zero \"hint\" when it needs more\ninput; once `in.pos == in.size` and no further output can be produced, it keeps\nreturning the same non-error, non-zero value and `out.pos` stops advancing, so\n`while (out.pos < out.size)` never terminates and mold burns CPU indefinitely.\nThe existing guar :"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Range-extension thunk placement is built on the invariant that a thunk group\nnever exceeds `max_thunk_size` (`batch_size / 2`, i.e. 16/4/8 MiB for\nARM64/ARM32/PPC): the D-advance loop reserves exactly `max_thunk_size` bytes\nwhen deciding how far a thunk may be placed from the batch. The invariant is\nonly checked with `assert(thunk.size() < max_thunk_size);`, which is compiled\nout in release builds. A single batch (32 MiB of ARM64 code) can hold up to\n~8M call sites, i.e. far more distinct callees than the ~1M entries that fit\nin 16 MiB of thunk, so a pathological but legal input silently overruns the\nreserved window; callers then cannot reach the tail of their thunk and the\nlink fails much later with the unhelpful `range extension thunk out of range`\nfatal error from `Symbol::get_thunk_addr()` (or, if the batch loop is\nperturbed, with wrong branch targets).","fix":"Turn the assertion into a real check inside the loop: while collecting symbols, stop adding entries once `E::thunk_hdr_size + n * E::thunk_size` reaches `max_thunk_size`, end the batch early (set `c` to the current section) and emit the remaining symbols into the next thunk. At minimum, replace the `assert` with a `Fatal(ctx)` so the failure is diagnosed where it happens.","locations":[{"ref":"src/thunks.cc:152-218","code":"  152 |   while (b < m.size()) {\n  153 |     // Move D foward as far as we can jump from B to a thunk at D.\n  154 |     auto d_thunk_end = [&] {\n  155 |       u64 d_end = align_to(offset, 1 << m[d]->p2align) + m[d]->sh_size;\n  156 |       return align_to(d_end, thunk_align) + max_thunk_size;\n  157 |     };\n  158 | \n  159 |     while (d < m.size() &&\n  160 |            (b == d || d_thunk_end() <= m[b]->offset + branch_distance<E>)) {\n  161 |       offset = align_to(offset, 1 << m[d]->p2align);\n  162 |       m[d]->offset = offset;\n  163 |       offset += m[d]->sh_size;\n  164 |       d++;\n  165 |     }\n  166 | \n  167 |     // Find the end of the current batch. Section end addresses are sorted,\n  168 |     // so use binary search. Starting from B + 1 guarantees progress.\n  169 |     std::span<InputSection<E> *> range = m.subspan(b + 1, d - b - 1);\n  170 |     c = ranges::lower_bound(range, m[b]->offset + batch_size, {},\n  171 |                             [](InputSection<E> *isec) {\n  172 |                               return isec->offset + isec->sh_size;\n  173 |                             }) - m.begin();\n  174 | \n  175 |     // Find the first section that is within branch range of C.\n  176 |     i64 c_offset = (c == d) ? offset : m[c]->offset;\n  177 |     range = m.subspan(a, b - a);\n  178 |     a = ranges::lower_bound(range, c_offset - branch_distance<E>, {},\n  179 |                             [](InputSection<E> *isec) {\n  180 |                               return isec->offset;\n  181 |                             }) - m.begin();\n  182 | \n  183 |     // Erase references to out-of-range thunks.\n  184 |     for (; t < thunks.size() && thunks[t]->offset < m[a]->offset; t++)\n  185 |       for (Symbol<E> *sym : thunks[t]->symbols)\n  186 |         sym->flags = 0;\n  187 | \n  188 |     // Create a new thunk and place it at D.\n  189 |     offset = align_to(offset, thunk_align);\n  190 |     thunks.emplace_back(std::make_unique<Thunk<E>>(*this, offset));\n  191 | \n  192 |     Thunk<E> &thunk = *thunks.back();\n  193 |     tbb::enumerable_thread_specific<std::vector<Symbol<E> *>> symbols;\n  194 | \n  195 |     // Scan relocations between B and C to collect symbols that need\n  196 |     // entries in the new thunk.\n  197 |     tbb::parallel_for(b, c, [&](i64 i) {\n  198 |       InputSection<E> &isec = *m[i];\n  199 |       for (const ElfRel<E> &rel : isec.get_rels(ctx))\n  200 |         if (requires_thunk(ctx, isec, rel, true))\n  201 |           if (Symbol<E> &sym = *isec.file.symbols[rel.r  ? ARM32LE::name : ARM32BE::name;\n  146 |   case EM_AARCH64:\n  147 |     return is_le ? ARM64LE::name : ARM64BE::name;\n  148 |   case EM_RISCV:\n  149 |     if (is_le)\n  150 |       return is_64 ? RV64LE::name : RV32LE::name;\n  151 |     return is_64 ? RV64BE::name : RV32BE::name;\n  152 |   case EM_PPC:\n  153 |     return PPC32::name;\n  154 |   case EM_PPC64:\n  155 |     // ELFv1 is big-endian and ELFv2 is little-endian by convention, but\n  156 |     // the correspondence is not a rule; musl for example uses ELFv2 on\n  157 |     // big-endian too. We support only the usual combinations, so treat\n  158 |     // the others as unrecognizable rather than silently linking them\n  159 |     // against the wrong ABI.\n  160 |     if (!is_le)\n  161 |       if (u32 abi = (ehdr64_be->e_flags & EF_PPC64_ABI); abi == 0 || abi == 1)\n  162 |         return PPC64V1::name;\n  163 |     if (is_le)\n  164 |       if (u32 abi = (ehdr64_le->e_flags & EF_PPC64_ABI); abi == 0 || abi == 2)\n  165 |         return PPC64V2::name;\n  166 |     return \"\";\n  167 |   case EM_S390X:\n  168 |     return S390X::name;\n  169 |   case EM_SPARC64:\n  170 |     return SPARC64::name;\n  171 |   case EM_68K:\n  172 |     return M68K::name;\n  173 |   case EM_SH:\n  174 |     return is_le ? SH4LE::name : SH4BE::name;\n  175 |   case EM_LOONGARCH:\n  176 |     return is_64 ? LOONGARCH64::name : LOONGARCH32::name;\n  177 |   default:\n  178 |     return \"\";\n  179 |   }","lines":48,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/filetype.cc#L132-L179"}]},{"id":"LOGIC_47","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`get_dwarf_kind` only rejects `hdr.version > 5`. Versions 0 and 1 are not valid\nDWARF and version 1 has a completely different compile-unit header layout, yet\nboth are silently accepted and parsed as if they were DWARF 2-4, producing\ngarbage compile-unit sizes and offsets from what is clearly not DWARF data.","fix":"Reject low versions too, in both branches:\n```cpp\nif (hdr.version < 2 || hdr.version > 5)\n  Fatal(ctx) << \"--gdb-index: DWARF version \" << hdr.version\n             << \" is not supported\";\n```","locations":[{"ref":"src/gdb-index.cc:278-293","code":"  278 | template <typename E>\n  279 | static DwarfKind get_dwarf_kind(Context<E> &ctx, u8 *p) {\n  280 |   if (*(U32<E> *)p == 0xffff'ffff) {\n  281 |     CuHdrDwarf2_64<E> &hdr = *(CuHdrDwarf2_64<E> *)p;\n  282 |     if (hdr.version > 5)\n  283 |       Fatal(ctx) << \"--gdb-index: DWARF version \" << hdr.version\n  284 |                  << \" is not supported\";\n  285 |     return (hdr.version == 5) ? DWARF5_64 : DWARF2_64;\n  286 |   }\n  287 | \n  288 |   CuHdrDwarf2_32<E> &hdr = *(CuHdrDwarf2_32<E> *)p;\n  289 |   if (hdr.version > 5)\n  290 |     Fatal(ctx) << \"--gdb-index: DWARF version \" << hdr.version\n  291 |                << \" is not supported\";\n  292 |   return (hdr.version == 5) ? DWARF5_32 : DWARF2_32;\n  293 | }","lines":16,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/gdb-index.cc#L278-L293"}]},{"id":"LOGIC_48","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"On SPARC64 `ElfRel<SPARC64>` carries an extra `r_type_data` field (a 24-bit\nvalue used as a second addend by `R_SPARC_OLO10`, see `arch-sparc64.cc:378`).\n`compute_digest` hashes `r_offset`, `r_type`, the addend and the target symbol,\nbut never `r_type_data`. Two otherwise identical sections whose only difference\nis the `R_SPARC_OLO10` extra addend therefore produce the same digest and are\nfolded together, silently miscompiling the program. `cie_equals`\n(`input-sections.cc:24-29`) has the same omission.","fix":"Hash the SPARC-specific field when it exists:\n```cpp\nif constexpr (is_sparc64<E>)\n  hash(rel.r_type_data);\n```\nand add the corresponding comparison to `cie_equals`.","locations":[{"ref":"src/icf.cc:192-197","code":"  192 |   for (const ElfRel<E> &rel : isec.get_rels(ctx)) {\n  193 |     hash(rel.r_offset);\n  194 |     hash(rel.r_type);\n  195 |     hash(get_addend(isec, rel));\n  196 |     hash_symbol(*isec.file.symbols[rel.r_sym]);\n  197 |   }","lines":6,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/icf.cc#L192-L197"},{"ref":"src/elf.h:1823-1835","code":" 1823 | template <>\n 1824 | struct ElfRel<SPARC64> {\n 1825 |   ElfRel() = default;\n 1826 |   ElfRel(u64 offset, u32 type, u32 sym, i64 addend)\n 1827 |     : r_offset(offset), r_sym(sym), r_type_data(0), r_type(type),\n 1828 |       r_addend(addend) {}\n 1829 | \n 1830 |   ub64 r_offset;\n 1831 |   ub32 r_sym;\n 1832 |   ub24 r_type_data; // SPARC-specific: used for R_SPARC_OLO10\n 1833 |   u8 r_type;\n 1834 |   ib64 r_addend;\n 1835 | };","lines":13,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/elf.h#L1823-L1835"}]},{"id":"LOGIC_49","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`print_icf_sections` collects the folded sections into a\n`tbb::concurrent_unordered_multimap` and then iterates `map.equal_range(leader)`\nto print them. The relative order of equal keys in an unordered multimap is not\nspecified and depends on which thread inserted first, so the\n`--print-icf-sections` report is nondeterministic across runs of the same link.\nEverything else about mold's output is deterministic, so this breaks\nbuild-log reproducibility.","fix":"Collect `(leader, isec)` pairs into a `tbb::concurrent_vector`, then\n`tbb::parallel_sort` by `(leader->get_priority(), isec->get_priority())` before\nprinting, so the report order is a function of the input only.","locations":[{"ref":"src/icf.cc:476-519","code":"  476 | static void print_icf_sections(Context<E> &ctx) {\n  477 |   tbb::concurrent_vector<InputSection<E> *> leaders;\n  478 |   tbb::concurrent_unordered_multimap<InputSection<E> *, InputSection<E> *> map;\n  479 | \n  480 |   tbb::parallel_for_each(ctx.objs, [&](ObjectFile<E> *file) {\n  481 |     for (InputSection<E> *isec : file->sections) {\n  482 |       if (isec && isec->is_alive && isec->leader) {\n  483 |         if (isec == isec->leader)\n  484 |           leaders.push_back(isec);\n  485 |         else\n  486 |           map.insert({isec->leader, isec});\n  487 |       }\n  488 |     }\n  489 |   });\n  490 | \n  491 |   tbb::parallel_sort(leaders.begin(), leaders.end(),\n  492 |                      [](InputSection<E> *a, InputSection<E> *b) {\n  493 |                        return a->get_priority() < b->get_priority();\n  494 |                      });\n  495 | \n  496 |   std::ostream *out = &std::cout;\n  497 |   std::ofstream file;\n  498 | \n  499 |   std::string &path = ctx.arg.print_icf_sections;\n  500 |   if (path != \"-\") {\n  501 |     file.open(path);\n  502 |     if (file.fail())\n  503 |       Fatal(ctx) << \"--print-icf-sections: cannot open \" << path << \": \"\n  504 |                  << errno_string();\n  505 |     out = &file;\n  506 |   }\n  507 | \n  508 |   i64 saved_bytes = 0;\n  509 | \n  510 |   for (InputSection<E> *leader : leaders) {\n  511 |     auto [begin, end] = map.equal_range(leader);\n  512 |     if (begin != end) {\n  513 |       *out << \"selected section \" << *leader << '\\n';\n  514 |       for (auto it = begin; it != end; it++) {\n  515 |         *out << \"  removing identical section \" << *it->second << '\\n';\n  516 |         saved_bytes += leader->get_contents().size();\n  517 |       }\n  518 |     }\n  519 |   }","lines":44,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/icf.cc#L476-L519"}]},{"id":"LOGIC_50","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`SharedFile<E>::get_symbols_at()` does\n`auto [begin, end] = ranges::equal_range(...); return {&*begin, ...};`. If the\nrange is empty (`begin == end == sorted_syms.end()`), `*begin` dereferences an\nend iterator, which is undefined behaviour. Today this cannot happen only\nbecause `sorted_syms` is built inside a `std::call_once` from the same\n`symbols` list that `sym` came from - but `sorted_syms` is memoized on the\n*first* call, while `Symbol::file` can still be reassigned by later passes, so\nthe invariant is not enforced by the code.","fix":"```c++\n-  return {&*begin, (size_t)(end - begin)};\n+  if (begin == end)\n+    return {};\n+  return {&*begin, (size_t)(end - begin)};\n```\nand, ideally, assert that the memoized `sorted_syms` still contains `sym`.","locations":[{"ref":"src/input-files.cc:1796-1818","code":" 1796 | template <typename E>\n 1797 | std::span<Symbol<E> *> SharedFile<E>::get_symbols_at(Symbol<E> *sym) {\n 1798 |   assert(sym->file == this);\n 1799 | \n 1800 |   std::call_once(init_sorted_syms, [&] {\n 1801 |     for (Symbol<E> *sym : this->symbols)\n 1802 |       if (sym->file == this)\n 1803 |         sorted_syms.push_back(sym);\n 1804 | \n 1805 |     tbb::parallel_sort(sorted_syms.begin(), sorted_syms.end(),\n 1806 |                        [](Symbol<E> *a, Symbol<E> *b) {\n 1807 |       const ElfSym<E> &x = a->esym();\n 1808 |       const ElfSym<E> &y = b->esym();\n 1809 |       return std::tuple{x.st_value, &x} < std::tuple{y.st_value, &y};\n 1810 |     });\n 1811 |   });\n 1812 | \n 1813 |   auto [begin, end] = ranges::equal_range(sorted_syms, sym->esym().st_value, {},\n 1814 |                                           [](Symbol<E> *x) {\n 1815 |     return x->esym().st_value;\n 1816 |   });\n 1817 |   return {&*begin, (size_t)(end - begin)};\n 1818 | }","lines":23,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/input-files.cc#L1796-L1818"}]},{"id":"LOGIC_51","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`to_p2align()` silently accepts a non-power-of-two `sh_addralign`:\n`std::countr_zero(3)` is `0`, so an alignment of 3 is turned into 1, and\n`std::countr_zero(6)` is `1`, turning 6 into 2. The ELF spec requires\n`sh_addralign` to be 0 or a power of two; accepting garbage here means the\nlinker under-aligns the section without any diagnostic.","fix":"```c++\nstatic i64 to_p2align(u64 alignment) {\n  if (alignment == 0)\n    return 0;\n  if (!std::has_single_bit(alignment))\n    // report an error, or round up: alignment = std::bit_ceil(alignment);\n  return std::countr_zero(alignment);\n}\n```","locations":[{"ref":"src/input-sections.cc:8-12","code":"    8 | static i64 to_p2align(u64 alignment) {\n    9 |   if (alignment == 0)\n   10 |     return 0;\n   11 |   return std::countr_zero(alignment);\n   12 | }","lines":5,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/input-sections.cc#L8-L12"}]},{"id":"LOGIC_52","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`unquote()` asserts that a token starting with `\"` also ends with `\"`. That\ninvariant is produced by `tokenize()`, but it is expressed as `assert`, which\ncompiles away in release builds. In a release build, a token such as a lone `\"`\nat the very end of a truncated script would make `s.substr(1, s.size() - 2)`\ncompute `substr(1, (size_t)-1)` - benign only by accident. More importantly, the\n`tokenize()` string-literal branch itself accepts an *unterminated* literal\nwithout diagnosing it whenever the closing quote happens to be the last byte of\nthe file.","fix":"Replace the `assert` with a real check (`if (s.size() < 2 || s.back() != '\"')\nreturn s;`) and keep the tokenizer's `unclosed string literal` diagnostic as the\nsingle source of truth.","locations":[{"ref":"src/linker-script.cc:106-112","code":"  106 | static std::string_view unquote(std::string_view s) {\n  107 |   if (s.size() > 0 && s[0] == '\"') {\n  108 |     assert(s[s.size() - 1] == '\"');\n  109 |     return s.substr(1, s.size() - 2);\n  110 |   }\n  111 |   return s;\n  112 | }","lines":7,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/linker-script.cc#L106-L112"},{"ref":"src/linker-script.cc:73-80","code":"   73 |     if (input[0] == '\"') {\n   74 |       i64 pos = input.find('\"', 1);\n   75 |       if (pos == std::string_view::npos)\n   76 |         error(input, \"unclosed string literal\");\n   77 |       tokens.push_back(input.substr(0, pos + 1));\n   78 |       input = input.substr(pos + 1);\n   79 |       continue;\n   80 |     }","lines":8,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/linker-script.cc#L73-L80"}]},{"id":"LOGIC_53","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`is_in_sysroot()` returns `true` for *every* absolute path when `--sysroot` is\nnot given: `std::filesystem::relative(path, \"\")` yields an empty path, which is\nneither `\".\"` nor prefixed with `\"../\"`. As a result `resolve_path()` takes the\n\"prepend the sysroot\" branch for any script whose entry starts with `/`, calling\n`must_open_file(ctx, \"\" + str)` and thereby bypassing the `check_target`\ncompatibility check (`get_machine_type`) that the normal `open()` path applies.\nAn incompatible absolute path named in a `GROUP(...)` is silently accepted\ninstead of being skipped with a warning.\n\n`std::filesystem::relative()` is also the throwing overload; a path that the\nimplementation cannot canonicalize raises `std::filesystem_error`, which mold\ndoes not catch.","fix":"Return `false` immediately when `ctx.arg.sysroot.empty()`, and use the\n`std::error_code` overload of `std::filesystem::relative()` so a failure\ndegrades to `false` instead of terminating.","locations":[{"ref":"src/linker-script.cc:125-133","code":"  125 | template <typename E>\n  126 | static bool is_in_sysroot(Context<E> &ctx, std::string path) {\n  127 |   std::string sysroot = ctx.arg.sysroot;\n  128 |   if (sysroot.starts_with('/') && !ctx.arg.chroot.empty())\n  129 |     sysroot = ctx.arg.chroot + \"/\" + path_clean(sysroot);\n  130 | \n  131 |   std::string rel = std::filesystem::relative(path, sysroot).string();\n  132 |   return rel != \".\" && !rel.starts_with(\"../\");\n  133 | }","lines":9,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/linker-script.cc#L125-L133"},{"ref":"src/linker-script.cc:155-158","code":"  155 |   // GNU ld prepends the sysroot if a pathname starts with '/' and the\n  156 |   // script being processed is in the sysroot. We do the same.\n  157 |   if (str.starts_with('/') && is_in_sysroot(ctx, mf->name))\n  158 |     return must_open_file(ctx, ctx.arg.sysroot + str);","lines":4,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/linker-script.cc#L155-L158"}]},{"id":"LOGIC_54","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`get_script_output_type()` indexes `tok[2]` after the `AS_NEEDED` handling\nwithout re-checking the span length, and without checking that the token is not\nthe closing parenthesis. For an empty `GROUP( )` the code calls\n`resolve_path(\")\")`, which tries to open a file literally named `)` in every\nlibrary search directory and finally calls `error()` -> `Fatal` with\n\"library not found: )\" - a confusing diagnostic for a script that is merely\nempty.\n\nAdditionally, this early `resolve_path()` is invoked with `check_target = false`\nduring machine-type detection, so an unreadable path aborts the link before the\n`-m` deduction has a chance to fall through to the next candidate file.","fix":"Guard the access:\n```c++\nif (tok.size() >= 3 && tok[2] != \")\")\n  if (MappedFile *mf = resolve_path(tok[2], false))\n    return get_machine_type(ctx, rctx, mf);\nreturn \"\";\n```\nand consider a non-fatal `resolve_path` variant for the detection path.","locations":[{"ref":"src/linker-script.cc:240-260","code":"  240 | template <typename E>\n  241 | std::string_view Script<E>::get_script_output_type() {\n  242 |   std::call_once(once, [&] { tokenize(); });\n  243 |   std::span<std::string_view> tok = tokens;\n  244 | \n  245 |   if (tok.size() >= 3 && tok[0] == \"OUTPUT_FORMAT\" && tok[1] == \"(\") {\n  246 |     if (tok[2] == \"elf64-x86-64\")\n  247 |       return X86_64::name;\n  248 |     if (tok[2] == \"elf32-i386\")\n  249 |       return I386::name;\n  250 |   }\n  251 | \n  252 |   if (tok.size() >= 3 && (tok[0] == \"INPUT\" || tok[0] == \"GROUP\") &&\n  253 |       tok[1] == \"(\") {\n  254 |     if (tok.size() >= 5 && tok[2] == \"AS_NEEDED\" && tok[3] == \"(\")\n  255 |       tok = tok.subspan(2);\n  256 |     if (MappedFile *mf = resolve_path(tok[2], false))\n  257 |       return get_machine_type(ctx, rctx, mf);\n  258 |   }\n  259 |   return \"\";\n  260 | }","lines":21,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/linker-script.cc#L240-L260"}]},{"id":"LOGIC_55","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`get_map()` skips the sorting pass when `map.size() <= 1`. With exactly one\nentry the map *does* need sorting - that single input section can own thousands\nof symbols, and they will be emitted to the map file in hash-table/parallel\ninsertion order instead of by address. The guard was presumably meant to avoid\nrunning `tbb::parallel_for` over an empty range.","fix":"```c++\n-  if (map.size() <= 1)\n+  if (map.empty())\n     return map;\n```","locations":[{"ref":"src/mapfile.cc:32-39","code":"   32 |   if (map.size() <= 1)\n   33 |     return map;\n   34 | \n   35 |   tbb::parallel_for(map.range(), [](const typename Map<E>::range_type &range) {\n   36 |     for (auto &[k, v] : range)\n   37 |       ranges::stable_sort(v, {}, &Symbol<E>::value);\n   38 |   });\n   39 |   return map;","lines":8,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mapfile.cc#L32-L39"}]},{"id":"LOGIC_56","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`is_ld()` matches the basename against `ld`, `ld.lld`, `ld.gold`, `ld.bfd` and\n`ld.mold`, but not `ld.mold`'s common siblings `mold`, `ld64.mold` or\ntarget-prefixed names such as `x86_64-linux-gnu-ld`. GCC/Clang invoke the\ncross-prefixed `ld` name in cross-compilation setups, so `mold -run` silently\nfails to interpose there and the build links with the system linker without any\nwarning.","fix":"Also accept a basename that ends with `-ld` (i.e. a target-triple prefix):\n```c\nsize_t n = strlen(ptr);\nif (n > 3 && !strcmp(ptr + n - 3, \"-ld\"))\n  return true;\n```","locations":[{"ref":"src/mold-wrapper.c:59-67","code":"   59 | static bool is_ld(const char *path) {\n   60 |   const char *ptr = path + strlen(path);\n   61 |   while (path < ptr && ptr[-1] != '/')\n   62 |     ptr--;\n   63 | \n   64 |   return !strcmp(ptr, \"ld\") || !strcmp(ptr, \"ld.lld\") ||\n   65 |          !strcmp(ptr, \"ld.gold\") || !strcmp(ptr, \"ld.bfd\") ||\n   66 |          !strcmp(ptr, \"ld.mold\");\n   67 | }","lines":9,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mold-wrapper.c#L59-L67"}]},{"id":"LOGIC_57","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`execvpe()` in the `LD_PRELOAD` wrapper violates the API contract in two ways:\n\n1. It applies the caller's `envp` to the *wrapper's own* process by calling\n   `putenv(envp[i])` in a loop, then invokes the real `execvp()` with the global\n   `environ`. Real `execvpe()` must not modify the calling process's\n   environment, and entries that were in `environ` but not in `envp` are not\n   removed, so the child ends up with a merged environment rather than exactly\n   `envp`.\n2. `putenv()` (as opposed to `se e() != STT_FUNC) {\n 1954 |       if (ctx.arg.z_relro && sym->file->is_dso &&\n 1955 |           sym->file->to_dso()->is_readonly(sym))\n 1956 |         ctx.copyrel_relro->add_symbol(ctx, sym);\n 1957 |       else\n 1958 |         ctx.copyrel->add_symbol(ctx, sym);\n 1959 |     }\n 1960 | \n 1961 |     if constexpr (is_ppc64v1<E>)\n 1962 |       if (sym->flags & NEEDS_PPC_OPD)\n 1963 |         ctx.extra.opd->add_symbol(ctx, sym);\n 1964 | \n 1965 |     sym->flags = 0;\n 1966 |   }","lines":65,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/passes.cc#L1902-L1966"}]},{"id":"LOGIC_64","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`remove_redundant_thunks()` decides which thunk entries are unnecessary by\ncomputing real distances via `requires_thunk(..., /*first_pass=*/false)`,\nwhich calls `sym.get_addr(ctx)`. It runs from `main()` *before*\n`fix_synthetic_symbols()`, so every linker-synthesized symbol still carries\nthe placeholder `value = 0xdeadbeef` assigned in `add_synthetic_symbols()`\n(and `--defsym` aliases have not been resolved to their target's value yet).\nCalls to such symbols - e.g. PPC64's `_savegpr0_*`/`_restgpr0_*` helpers or a\n`--defsym` alias of a function - are therefore evaluated against a bogus\naddress. Today this happens to be conservative (0xdeadbeef looks far away, so\nthe thunk entry is kept), but the correctness of the pass silently depends on\nthat accident; any synthetic symbol whose placeholder happens to land inside\nthe branch range would have its needed thunk entry deleted.","fix":"Either run `remove_redundant_thunks()` after synthetic symbol values are known, or make `requires_thunk()` treat symbols whose owner is `ctx.internal_obj` (value not yet finalized) as unconditionally requiring a thunk, with a comment explaining the ordering constraint.","locations":[{"ref":"src/thunks.cc:259-269","code":"  259 |   // Mark all symbols that actual TE` entries\nare emitted than intended; (b) if `ctx.chunks[i]` happens to be a `SHT_NOTE` chunk\nwith matching flags, `append()` is called with a completely unrelated chunk and sets\n`p_memsz = chunk->sh_addr + chunk->sh_size - phdr.p_vaddr`, which underflows to a\nhuge `u64` when that chunk sits at a lower address, producing a `PT_NOTE` segment\nthat claims to cover gigabytes. Additionally `i` is advanced past entries of `chunks`\nthat were never examined, so real note sections can be skipped entirely.","fix":"Replace `ctx.chunks[i]` with `chunks[i]` in all three places inside the inner `while` loop (the condition, the `to_phdr_flags` call and the `append` argument).","locations":[{"ref":"src/output-chunks.cc:224-236","code":"  224 |   // Create a PT_NOTE for SHF_NOTE sections.\n  225 |   for (i64 i = 0; i < chunks.size();) {\n  226 |     Chunk<E> *first = chunks[i++];\n  227 |     if (is_note(first)) {\n  228 |       i64 flags = to_phdr_flags(ctx, first);\n  229 |       define(PT_NOTE, flags, first);\n  230 | \n  231 |       while (i < chunks.size() &&\n  232 |              is_note(ctx.chunks[i]) &&\n  233 |              to_phdr_flags(ctx, ctx.chunks[i]) == flags)\n  234 |         append(ctx.chunks[i++]);\n  235 |     }\n  236 |   }","lines":13,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/output-chunks.cc#L224-L236"}]},{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"The LTO pass-manager options are wired up backwards. `--no-legacy-pass-manager` pushes the\nplugin option `legacy-pass-manager`, i.e. the \"no-\" spelling *enables* the legacy pass\nmanager, and the option that should enable it (`--lto-legacy-pass-manager`, the spelling used\nby lld and accepted by GCC's linker plugin) is not recognised at all and makes mold die with\n\"unknown command line option\". The sibling three lines below\n(`--no-lto-legacy-pass-manager` -> `new-pass-manager`) shows the intended naming scheme.","fix":"```\n-    } else if (read_flag(\"no-legacy-pass-manager\")) {\n+    } else if (read_flag(\"lto-legacy-pass-manager\")) {\n       ctx.arg.plugin_opt.emplace_back(\"legacy-pass-manager\");\n```\nkeeping `--no-lto-legacy-pass-manager` -> `new-pass-manager` as is.","locations":[{"ref":"src/cmdline.cc:1332-1337","code":" 1332 |     } else if (read_flag(\"no-legacy-pass-manager\")) {\n 1333 |       ctx.arg.plugin_opt.emplace_back(\"legacy-pass-manager\");\n 1334 |     } else if (read_arg(\"lto-partitions\")) {\n 1335 |       ctx.arg.plugin_opt.push_back(\"lto-partitions=\" + std::string(arg));\n 1336 |     } else if (read_flag(\"no-lto-legacy-pass-manager\")) {\n 1337 |       ctx.arg.plugin_opt.emplace_back(\"new-pass-manager\");","lines":6,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/cmdline.cc#L1332-L1337"}]},{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"In `get_output_name()` the prefix table maps an input section name such as\n`.text.foo` to the output name `.text` by stripping the last character of the\ntable entry (`stem = prefix.substr(0, prefix.size() - 1)`). Every entry\ntherefore has to end with a dot. `\".srodata\"` is missing its trailing dot, so\nits `stem` becomes `\".srodat\"` and *any* `.srodata` / `.srodata.*` input\nsection is emitted into an output section literally named `.srodat`.\n\nVerified against an installed mold binary:\n\n```\n$ cat sr.s\n.section .srodata,\"a\"\n.long 42\n$ mold -o sr.out sr.o -e 0 && readelf -SW sr.out | grep srodat\n  [ 3] .srodat  PROGBITS  0000000000200210 000210 000008 00 A 0 0 1\n```\n\n`.srodata` is the RISC-V/small-data read-only section; tooling and linker\nscripts that look for `.srodata` (and `__global_pointer$`-relative\naddressing conventions) silently stop matching.","fix":"Add the missing dot in the table:\nbefore `\".sdata.\", \".sbss.\", \".srodata\", \".gnu.build.attributes.\",`\nafter  `\".sdata.\", \".sbss.\", \".srodata.\", \".gnu.build.attributes.\",`","locations":[{"ref":"src/passes.cc:618-629","code":"  618 |   static std::string_view prefixes[] = {\n  619 |     \".text.\", \".data.rel.ro.\", \".data.\", \".rodata.\", \".bss.rel.ro.\", \".bss.\",\n  620 |     \".init_array.\", \".fini_array.\", \".tbss.\", \".tdata.\", \".gcc_except_table.\",\n  621 |     \".ctors.\", \".dtors.\", \".gnu.warning.\", \".openbsd.randomdata.\",\n  622 |     \".sdata.\", \".sbss.\", \".srodata\", \".gnu.build.attributes.\",\n  623 |   };\n  624 | \n  625 |   for (std::string_view prefix : prefixes) {\n  626 |     std::string_view stem = prefix.substr(0, prefix.size() - 1);\n  627 |     if (name == stem || name.starts_with(prefix))\n  628 |       return stem;\n  629 |   }","lines":12,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/passes.cc#L618-L629"}]},{"id":"CPY_4","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"The accepted option name `--opt-remarks-with_hotness` contains an underscore, while the\nplugin option it forwards (`opt-remarks-with-hotness`) and every other `--opt-remarks-*`\noption use hyphens. Build systems passing the standard `--opt-remarks-with-hotness` get\n\"unknown command line option\".","fix":"```\n-    } else if (read_flag(\"opt-remarks-with_hotness\")) {\n+    } else if (read_flag(\"opt-remarks-with-hotness\")) {\n       ctx.arg.plugin_opt.emplace_back(\"opt-remarks-with-hotness\");\n```\n(optionally keep the old spelling as an alias).","locations":[{"ref":"src/cmdline.cc:1349-1350","code":" 1349 |     } else if (read_flag(\"opt-remarks-with_hotness\")) {\n 1350 |       ctx.arg.plugin_opt.emplace_back(\"opt-remarks-with-hotness\");","lines":2,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/cmdline.cc#L1349-L1350"}]},{"id":"CPY_5","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"The diagnostic for an unhandled `DW_AT_low_pc` form prints `high_pc.form`\ninstead of `low_pc.form`, so the error message names the wrong attribute's form\nand the user cannot tell which form is actually unsupported.","fix":"Change\n`Fatal(ctx) << \"--gdb-index: unhandled form for DW_AT_low_pc: 0x\" << std::hex << high_pc.form;`\nto\n`Fatal(ctx) << \"--gdb-index: unhandled form for DW_AT_low_pc: 0x\" << std::hex << low_pc.form;`","locations":[{"ref":"src/gdb-index.cc:595-598","code":"  595 |     default:\n  596 |       Fatal(ctx) << \"--gdb-index: unhandled form for DW_AT_low_pc: 0x\"\n  597 |                  << std::hex << high_pc.form;\n  598 |     }","lines":4,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/gdb-index.cc#L595-L598"}]},{"id":"CPY_6","type":"copy_paste","type_label":"Copy Paste","severity":"negligible","difficulty":"very_easy","description":"In the linker-synthesized `_restgpr0_*` sequence the `_restgpr0_29` label is attached to\n`ld r0,16(r1)` and the following unnamed slot holds `ld r29,-24(r1)`; the canonical GCC\nsequence has these two instructions the other way round (the label belongs on the `r29`\nrestore, and `ld r0,16(r1)` is the shared tail). Execution happens to remain correct because\nboth loads precede the `mtlr r0`, but the table no longer matches the layout it is\ndocumenting, and a future edit that inserts something between them would break it.","fix":"Swap the two entries so the label sits on the register restore:\n```\n-  { \"_restgpr0_29\", 0xe8010010 }, // ld r0,16(r1)\n-  { \"\",             0xeba1ffe8 }, // ld r29,-24(r1)\n+  { \"_restgpr0_29\", 0xeba1ffe8 }, // ld r29,-24(r1)\n+  { \"\",             0xe8010010 }, // ld r0,16(r1)\n```","locations":[{"ref":"src/arch-ppc64v2.cc:616-618","code":"  616 |   { \"_restgpr0_29\", 0xe8010010 }, // ld r0,16(r1)\n  617 |   { \"\",             0xeba1ffe8 }, // ld r29,-24(r1)\n  618 |   { \"\",             0x7c0803a6 }, // mtlr r0","lines":3,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/arch-ppc64v2.cc#L616-L618"}]},{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"easy","description":"`MallocOutputFile<E>::close()` ignores every failure of the final write:\n\n```cpp\nfwrite(this->buf, this->filesize, 1, fp);\nfclose(fp);\n```\n\nNeither the `fwrite` short-write/error result nor the `fclose` flush result is\nchecked. `MallocOutputFile` is the path used for `-o -`, for non-mmap-able\noutputs and for `--separate-debug-file`, so a full disk, a quota violation or\nan I/O error silently produces a truncated or partially written output file\nwhile mold exits with status 0. Note that `fclose(stdout)` is also called when\n`path == \"-\"`, which closes the process's stdout.","fix":"Check both calls and report:\n\n```cpp\nif (fwrite(this->buf, this->filesize, 1, fp) != 1)\n  Fatal(ctx) << \"cannot write to \" << this->path << \": \" << errno_string();\nif (fp != stdout && fclose(fp) != 0)\n  Fatal(ctx) << \"cannot write to \" << this->path << \": \" << errno_string();\nif (fp == stdout && fflush(fp) != 0)\n  Fatal(ctx) << \"cannot write to stdout: \" << errno_string();\n```","locations":[{"ref":"src/mold.h:1701-1725","code":" 1701 |   void close(Context<E> &ctx) override {\n 1702 |     Timer t(ctx, \"close_file\");\n 1703 |     FILE *fp;\n 1704 | \n 1705 |     if (this->path == \"-\") {\n 1706 |       fp = stdout;\n 1707 |     } else {\n 1708 | #ifdef _WIN32\n 1709 |       int pmode = (perm & 0200) ? (_S_IREAD | _S_IWRITE) : _S_IREAD;\n 1710 |       i64 fd = _open(this->path.c_str(), _O_RDWR | _O_CREAT | _O_BINARY, pmode);\n 1711 | #else\n 1712 |       i64 fd = ::open(this->path.c_str(), O_RDWR | O_CREAT, perm);\n 1713 | #endif\n 1714 |       if (fd == -1)\n 1715 |         Fatal(ctx) << \"cannot open \" << this->path << \": \" << errno_string();\n 1716 | #ifdef _WIN32\n 1717 |       fp = _fdopen(fd, \"wb\");\n 1718 | #else\n 1719 |       fp = fdopen(fd, \"w\");\n 1720 | #endif\n 1721 |     }\n 1722 | \n 1723 |     fwrite(this->buf, this->filesize, 1, fp);\n 1724 |     fclose(fp);\n 1725 |   }","lines":25,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mold.h#L1701-L1725"}]},{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"All error handling in `lib/compress.cc` is done with `assert()`, which is compiled out in release\nbuilds (`-DNDEBUG`). The `CHECK()` macro is literally `assert(r == Z_OK)` and\n`zstd_compress()` uses `assert(!ZSTD_isError(sz))`.\n\nThe zstd case is the worst: `ZSTD_compress()` returns an error *code* (a huge `size_t` such as\n`(size_t)-70`) on failure, and the function then returns `{buf, sz}` — a `std::span` whose length\nis that error code. `compressed_size` becomes astronomically large and `ZstdCompressor::write_to()`\n`memcpy`s that many bytes, corrupting memory / crashing. Failures such as an allocation failure\ninside libzstd therefore turn into memory corruption instead of a clean error message.\n`deflatePending()`'s return value is not checked at all.","fix":"Replace the asserts with real checks that survive `NDEBUG`, e.g.\n\n```cpp\nstatic std::span<u8> zstd_compress(std::span<u8> input, int level) {\n  i64 bufsize = ZSTD_COMPRESSBOUND(input.size());\n  u8 *buf = new u8[bufsize];\n  size_t sz = ZSTD_compress(buf, bufsize, input.data(), input.size(), level);\n  if (ZSTD_isError(sz)) {\n    std::cerr << \"mold: zstd compression failed: \" << ZSTD_getErrorName(sz) << \"\\n\";\n    std::exit(1);\n  }\n  return {buf, sz};\n}\n```\n\nand change `CHECK(fn)` to test the result and abort with a message rather than using `assert`.","locations":[{"ref":"lib/compress.cc:23-27","code":"   23 | #define CHECK(fn)                               \\\n   24 |   do {                                          \\\n   25 |     [[maybe_unused]] int r = (fn);              \\\n   26 |     assert(r == Z_OK);                          \\\n   27 |   } while (0)","lines":5,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/lib/compress.cc#L23-L27"},{"ref":"lib/compress.cc:141-147","code":"  141 | static std::span<u8> zstd_compress(std::span<u8> input, int level) {\n  142 |   i64 bufsize = ZSTD_COMPRESSBOUND(input.size());\n  143 |   u8 *buf = new u8[bufsize];\n  144 |   size_t sz = ZSTD_compress(buf, bufsize, input.data(), input.size(), level);\n  145 |   assert(!ZSTD_isError(sz));\n  146 |   return {buf, sz};\n  147 | }","lines":7,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/lib/compress.cc#L141-L147"},{"ref":"lib/compress.cc:86-90","code":"   86 |   int nbits = 0;\n   87 |   deflatePending(&strm, Z_NULL, &nbits);\n   88 |   if (nbits == 5)\n   89 |     CHECK(deflatePrime(&strm, 10, 2));\n   90 |   CHECK(deflate(&strm, Z_SYNC_FLUSH));","lines":5,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/lib/compress.cc#L86-L90"}]},{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`ConcurrentMap::resize()` never checks whether the backing allocation succeeded. On POSIX, `mmap`\nreturns `MAP_FAILED` (`(void *)-1`), not `nullptr`, so `entries` becomes `(Entry *)-1`; the\nfollowing `madvise()` fails silently and the first `insert()` dereferences a near-`-1` pointer.\nOn Windows the `_aligned_malloc()` result is passed straight to `memset()`. Since `nbuckets` is\nderived from an estimate of the number of mergeable-section pieces in the input files, a large\nlink on a memory-constrained host turns into a wild pointer dereference instead of a diagnostic.","fix":"Check the results:\n\n```cpp\n#ifdef _WIN32\n    entries = (Entry *)_aligned_malloc(bufsize, alignof(Entry));\n    if (!entries) { std::cerr << \"mold: out of memory\\n\"; std::exit(1); }\n    memset((void *)entries, 0, bufsize);\n#else\n    void *p = mmap(nullptr, bufsize, PROT_READ | PROT_WRITE,\n                   MAP_ANONYMOUS | MAP_PRIVATE, -1, 0);\n    if (p == MAP_FAILED) { std::cerr << \"mold: out of memory\\n\"; std::exit(1); }\n    entries = (Entry *)p;\n#endif\n```","locations":[{"ref":"lib/lib.h:490-508","code":"  490 |   void resize(i64 nbuckets) {\n  491 |     assert(!entries);\n  492 |     this->nbuckets = std::max<i64>(MIN_NBUCKETS, bit_ceil(nbuckets));\n  493 |     i64 bufsize = sizeof(Entry) * this->nbuckets;\n  494 | \n  495 |     // Allocate a zero-initialized buffer. mmap is faster than\n  496 |     // malloc + memset.\n  497 | #ifdef _WIN32\n  498 |     entries = (Entry *)_aligned_malloc(bufsize, alignof(Entry));\n  499 |     memset((void *)entries, 0, bufsize);\n  500 | #else\n  501 |     entries = (Entry *)mmap(nullptr, bufsize, PROT_READ | PROT_WRITE,\n  502 |                             MAP_ANONYMOUS | MAP_PRIVATE, -1, 0);\n  503 | #endif\n  504 | \n  505 | #ifdef MADV_HUGEPAGE\n  506 |     madvise((void *)entries, bufsize, MADV_HUGEPAGE);\n  507 | #endif\n  508 |   }","lines":19,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/lib/lib.h#L490-L508"}]},{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`TarWriter::append()` ignores the result of every I/O call: four `fwrite()`s, two `fseek()`s, both\n`ftell()`s (which return `-1L` on failure and are then fed to `align_to()` and `ftruncate()`), and\n`ftruncate()` itself (explicitly discarded with `(void)!`). `TarWriter::~TarWriter()` also ignores\n`fclose()`, which is where buffered data actually reaches the disk. A full disk or a write error\ntherefore produces a silently truncated/corrupt `.repro.tar` with a successful exit status — the\nexact situation in which a user is trying to capture a reproducer.","fix":"Check each call and report through the caller. Minimally, add a helper\n\n```cpp\nstatic void check_io(bool ok) {\n  if (!ok) {\n    std::cerr << \"mold: failed to write to the repro tar file: \"\n              << strerror(errno) << \"\\n\";\n    std::exit(1);\n  }\n}\n```\n\nand wrap every `fwrite`/`fseek`/`ftell`/`ftruncate`, plus `check_io(fclose(out) == 0)` in the\ndestructor (or, better, expose an explicit `close()` that can propagate the error).","locations":[{"ref":"lib/tar.cc:84-117","code":"   84 | void TarWriter::append(std::string path, std::string_view data) {\n   85 |   // Write PAX header\n   86 |   UstarHeader pax = {};\n   87 | \n   88 |   std::string attr = encode_path(basedir, path);\n   89 | \n   90 |   if (attr.size() >= 0100'000'000'000)\n   91 |     unreachable();\n   92 |   snprintf(pax.size, sizeof(pax.size), \"%011zo\", attr.size());\n   93 |   pax.name[0] = '/';\n   94 |   pax.typeflag[0] = 'x';\n   95 |   finalize(pax);\n   96 |   fwrite(&pax, sizeof(pax), 1, out);\n   97 | \n   98 |   // Write pathname\n   99 |   fwrite(attr.data(), attr.size(), 1, out);\n  100 |   fseek(out, align_to(ftell(out), BLOCK_SIZE), SEEK_SET);\n  101 | \n  102 |   // Write Ustar header\n  103 |   UstarHeader ustar = {};\n  104 |   memcpy(ustar.mode, \"0000664\", 8);\n  105 |   if (data.size() >= 0100'000'000'000)\n  106 |     unreachable();\n  107 |   snprintf(ustar.size, sizeof(ustar.size), \"%011zo\", data.size());\n  108 |   finalize(ustar);\n  109 |   fwrite(&ustar, sizeof(ustar), 1, out);\n  110 | \n  111 |   // Write file contents\n  112 |   fwrite(data.data(), data.size(), 1, out);\n  113 |   fseek(out, align_to(ftell(out), BLOCK_SIZE), SEEK_SET);\n  114 | \n  115 |   // A tar file must ends with two empty blocks\n  116 |   (void)!ftruncate(fileno(out), ftell(out) + BLOCK_SIZE * 2);\n  117 | }","lines":34,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/lib/tar.cc#L84-L117"
