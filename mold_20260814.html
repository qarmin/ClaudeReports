 mold with libtbb version 2021.9.0 or older is known to be unstable \"\n   79 |       \"under heavy load. Your libtbb version is \" +\n   80 |       std::string(TBB_runtime_version()) +\n   81 |       \". Please upgrade your libtbb library and try again.\\n\";\n   82 | \n   83 |     sigaction(SIGABRT, &action, NULL);\n   84 |   }\n   85 | }","lines":20,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/signal-unix.cc#L66-L85"},{"ref":"src/signal-win32.cc:41-45","code":"   41 |   } else if (rec->ExceptionCode == EXCEPTION_STACK_OVERFLOW) {\n   42 |     static const char msg[] =\n   43 |       \"mold: stack overflow\\n\";\n   44 |     (void)!_write(_fileno(stderr), msg, sizeof(msg) - 1);\n   45 |   }","lines":5,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/signal-win32.cc#L41-L45"}]},{"id":"API_17","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"`install_signal_handler()` declares `struct sigaction action;` without\ninitialization and sets only `sa_sigaction`, `sa_mask` and `sa_flags`. The\nremaining members (`sa_restorer` on glibc, and padding/extra fields on other\nplatforms) are passed to the kernel with indeterminate values. It happens to\nwork on Linux because glibc overwrites `sa_restorer` when `SA_RESTORER` is not\nrequested, but it is undefined behaviour to read uninitialized members and is\na portability hazard.","fix":"Value-initialize the struct:\nbefore `struct sigaction action;`\nafter  `struct sigaction action = {};`","locations":[{"ref":"src/signal-unix.cc:66-73","code":"   66 | void install_signal_handler() {\n   67 |   struct sigaction action;\n   68 |   action.sa_sigaction = sighandler;\n   69 |   sigemptyset(&action.sa_mask);\n   70 |   action.sa_flags = SA_SIGINFO;\n   71 | \n   72 |   sigaction(SIGSEGV, &action, NULL);\n   73 |   sigaction(SIGBUS, &action, NULL);","lines":8,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/signal-unix.cc#L66-L73"}]},{"id":"API_18","type":"api_misuse","type_label":"Api Misuse","severity":"negligible","difficulty":"very_easy","description":"`OutputFile<E>::open` applies `madvise(..., MADV_HUGEPAGE)` to `file->buf`\nunconditionally, but `file` may be a `MallocOutputFile` whose buffer comes from\n`calloc`. `madvise` requires a page-aligned address, so the call fails with `EINVAL`\nfor the malloc'ed case (the return value is ignored, so it is only wasted work), and\nthe comment right above it - \"Enable transparent huge page for an output\nmemory-mapped file\" - does not describe what the code does.","fix":"Guard the call: `if (file->is_mmapped) madvise(file->buf, filesize, MADV_HUGEPAGE);` (the flag already exists on `OutputFile`).","locations":[{"ref":"src/output-file-unix.cc:177-190","code":"  177 |   OutputFile<E> *file;\n  178 |   if (is_special)\n  179 |     file = new MallocOutputFile(ctx, path, filesize, perm);\n  180 |   else\n  181 |     file = new MemoryMappedOutputFile(ctx, path, filesize, perm);\n  182 | \n  183 | #ifdef MADV_HUGEPAGE\n  184 |   // Enable transparent huge page for an output memory-mapped file.\n  185 |   // Linking a Chromium debug build is ~20% faster with this madvise call.\n  186 |   madvise(file->buf, filesize, MADV_HUGEPAGE);\n  187 | #endif\n  188 | \n  189 |   if (ctx.arg.filler != -1)\n  190 |     memset(file->buf, ctx.arg.filler, filesize);","lines":14,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/output-file-unix.cc#L177-L190"}]},{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`ShardedMap::gather()` counts *pending references* (`count += bin[i].size()`), not distinct keys,\nand hands that number to `Shard::reserve()`, which both sizes the `unordered_map`\n(`map.reserve(map.size() + count)`) and allocates an arena block of `count` `Entry` objects.\n\n`ShardedMap::add()` is called once per global symbol *reference* in every object file\n(`src/input-files.cc:882`), and popular symbols are referenced by thousands of files. Arena\nblocks are never freed and `Entry` is `ShardedMapEntry<Symbol<E>>` (a full `Symbol` plus a\n`std::string_view`), so a link with, say, 20M global symbol references but 2M distinct names\npermanently burns roughly ten times the memory it needs. Since `ArenaResource::SIZE` is a hard\n8 GiB cap that calls `std::exit(1)` when exceeded (`lib/lib.h:672-679`, `lib/arena.cc:57-61`),\nthis turns a memory-waste problem into an outright link failure on large projects.","fix":"Deduplicate before reserving, or reserve incrementally. Simplest fix: keep `reserve()` for the\n`unordered_map` (a hash table over-reserve is comparatively cheap) but stop pre-allocating one\narena `Entry` per pending reference — let `Shard::insert()` grow blocks geometrically\n(`add_block(std::max(INSERT_BLOCK_SIZE, blocks.back().capacity * 2))`) so arena usage tracks the\nnumber of *created* entries. Alternatively, sort/unique each shard's `Pending` list by\n`(hash, key)` in `gather()` first and reserve the unique count.","locations":[{"ref":"lib/lib.h:863-881","code":"  863 |   void gather(auto on_create) {\n  864 |     tbb::parallel_for((i64)0, NUM_SHARDS, [&](i64 i) {\n  865 |       Shard &shard = shards[i];\n  866 | \n  867 |       i64 count = 0;\n  868 |       for (Bin &bin : bins)\n  869 |         count += bin[i].size();\n  870 |       if (count == 0)\n  871 |         return;\n  872 | \n  873 |       shard.reserve(count);\n  874 | \n  875 |       for (Bin &bin : bins)\n  876 |         for (Pending &p : bin[i])\n  877 |           *p.slot = shard.insert(p.key, p.hash, on_create);\n  878 |     });\n  879 | \n  880 |     bins.clear();\n  881 |   }","lines":19,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/lib/lib.h#L863-L881"},{"ref":"lib/lib.h:939-944","code":"  939 |     void reserve(i64 count) {\n  940 |       map.reserve(map.size() + count);\n  941 |       if (blocks.empty() ||\n  942 |           blocks.back().capacity - blocks.back().size < count)\n  943 |         add_block(std::max<i64>(INSERT_BLOCK_SIZE, count));\n  944 |     }","lines":6,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/lib/lib.h#L939-L944"}]},{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`start_stop_name(sym.name())` is evaluated for every relocation of every live\nsection - the single hottest loop in `--gc-sections`. `Symbol<E>::name()`\nis not a trivial accessor (it may have to scan for the name length) and the\nhelper then performs two `starts_with` comparisons, all to detect a symbol\nclass that is extremely rare. The check is also performed for symbols that were\nresolved to a real definition and therefore can never be a linker-synthesized\n`__start_`/`__stop_` marker.","fix":"Precompute the answer once per symbol instead of once per reference: set a\n`bool is_start_stop` flag (or cache the stripped name) on `Symbol<E>` when the\n`__start_`/`__stop_` symbols are synthesized, and gate the lookup on\n`sym.is_start_stop` in `visit_section`. Also skip the check entirely when\n`start_stop_map` is empty.","locations":[{"ref":"src/gc-sections.cc:122-128","code":"  122 | static std::string_view start_stop_name(std::string_view sym) {\n  123 |   if (sym.starts_with(\"__start_\"))\n  124 |     return sym.substr(8);\n  125 |   if (sym.starts_with(\"__stop_\"))\n  126 |     return sym.substr(7);\n  127 |   return \"\";\n  128 | }","lines":7,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/gc-sections.cc#L122-L128"},{"ref":"src/gc-sections.cc:171-189","code":"  171 |     // A reference to __start_<name> or __stop_<name> keeps every\n  172 |     // section named <name> alive, mirroring how those symbols are\n  173 |     // defined. A single such reference can keep an enormous number of\n  174 |     // sections alive, so we spread the fanout over threads instead\n  175 |     // of marking the sections one by one.\n  176 |     if (std::string_view name = start_stop_name(sym.name());\n  177 |         !name.empty()) {\n  178 |       if (auto it = start_stop_map.find(name);\n  179 |           it != start_stop_map.end()) {\n  180 |         // Mark and visit the sections with a nested parallel loop.\n  181 |         // As in mark() below, a section added to a feeder has\n  182 |         // already been marked, so a feeder's loop body must visit\n  183 |         // it unconditionally.\n  184 |         tbb::parallel_for_each(it->second, [&](InputSection<E> *isec) {\n  185 |           if (mark_section(isec))\n  186 |             visit_section(ctx, isec, feeder, 0, start_stop_map);\n  187 |         });\n  188 |       }\n  189 |     }","lines":19,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/gc-sections.cc#L171-L189"}]},{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`uniquify_cies` deduplicates CIE records with a serial O(n^2) scan: for every\nCIE of every object file it linearly walks the `cies` vector calling\n`cie_equals`, which itself compares the full CIE contents and all its\nrelocations. When most object files contribute a distinct CIE (mixed\ncompilers/personality routines, LTO partitions, `-fexceptions` with different\noptions), n grows with the number of input files and the pass becomes quadratic\n- 50k objects means billions of `cie_equals` calls on the critical path, and it\nis not parallelized at all.","fix":"Hash each CIE (contents plus the normalized relocation list produced by\n`cie_equals`) and use a hash map from digest to `icf_idx`, falling back to\n`cie_equals` only on digest collision. This turns the pass into O(n) and lets it\nbe parallelized per object file.","locations":[{"ref":"src/icf.cc:87-109","code":"   87 | template <typename E>\n   88 | static void uniquify_cies(Context<E> &ctx) {\n   89 |   Timer t(ctx, \"uniquify_cies\");\n   90 |   std::vector<CieRecord<E> *> cies;\n   91 | \n   92 |   auto find = [&](CieRecord<E> &cie) -> i64 {\n   93 |     for (i64 i = 0; i < cies.size(); i++)\n   94 |       if (cie_equals(cie, *cies[i]))\n   95 |         return i;\n   96 |     return -1;\n   97 |   };\n   98 | \n   99 |   for (ObjectFile<E> *file : ctx.objs) {\n  100 |     for (CieRecord<E> &cie : file->cies) {\n  101 |       if (i64 idx = find(cie); idx != -1) {\n  102 |         cie.icf_idx = idx;\n  103 |       } else {\n  104 |         cie.icf_idx = cies.size();\n  105 |         cies.push_back(&cie);\n  106 |       }\n  107 |     }\n  108 |   }\n  109 | }","lines":23,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/icf.cc#L87-L109"}]},{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`SymbolAux<E>` unconditionally carries a 24-byte `std::vector<u64>\nthunk_addrs`, but `thunk_addrs` is only ever touched by\n`Symbol<E>::add_thunk_addr()` / `get_thunk_addr()`, both of which are\n`requires needs_thunk<E>` (ARM32, ARM64, PPC). On x86-64, RISC-V, s390x, etc.\nthe member is dead weight that grows every aux record from 40 to 64 bytes.\n`SymbolAux` is allocated for every symbol that gets a GOT/PLT/dynsym slot, i.e.\nhundreds of thousands of objects on a large link, and the header comment\ndirectly above the struct says the split from `Symbol` exists precisely to save\nmemory.","fix":"Use the same `[[no_unique_address]]` extras pattern already used for\n`InputSectionExtras<E>`, `ObjectFileExtras<E>` and `ContextExtras<E>`:\n\n```cpp\ntemplate <typename E> struct SymbolAuxExtras {};\n\ntemplate <needs_thunk E>\nstruct SymbolAuxExtras<E> { std::vector<u64> thunk_addrs; };\n\ntemplate <typename E>\nstruct SymbolAux {\n  ...\n  [[no_unique_address]] SymbolAuxExtras<E> extra;\n};\n```","locations":[{"ref":"src/mold.h:308-326","code":"  308 | // Additional class members for dynamic symbols. Because most symbols\n  309 | // don't need them and we allocate tens of millions of symbol objects\n  310 | // for large programs, we separate them from `Symbol` class to save\n  311 | // memory.\n  312 | template <typename E>\n  313 | struct SymbolAux {\n  314 |   i32 got_idx = -1;\n  315 |   i32 gottp_idx = -1;\n  316 |   i32 tlsgd_idx = -1;\n  317 |   i32 tlsdesc_idx = -1;\n  318 |   i32 plt_idx = -1;\n  319 |   i32 pltgot_idx = -1;\n  320 |   i32 dynsym_idx = -1;\n  321 |   i32 opd_idx = -1;\n  322 |   u32 djb_hash = 0;\n  323 | \n  324 |   // For range extension thunks\n  325 |   std::vector<u64> thunk_addrs;\n  326 | };","lines":19,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mold.h#L308-L326"}]},{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"In the `--pack-dyn-relocs=android` path, `RelDynSection<E>::update_shdr` materializes\n*all* dynamic relocations into `relocs` and re-encodes them from scratch:\n\n```\nrelocs.resize(num_relocs - num_relrs);\nwrite_relocs(ctx, relocs.data());\nandroid_encoded = encode_android<E>(relocs);\n```\n\n`update_shdr` is invoked once per chunk per layout pass and, on top of that,\n`set_osec_offsets` calls `ctx.reldyn->update_shdr(ctx)` in its own convergence loop\n(`passes.cc`). Every one of those iterations walks all output chunks, calls\n`Symbol::get_addr` for every relocation, `ranges::sort`s the entire relocation array\n(millions of `ElfRel` records) and re-runs the SLEB128 encoder. `encode_android` also\nsorts its input in place on every call even though the array is already sorted from\nthe previous pass.","fix":"Cache the encoding: keep the previous `relocs`/`android_encoded` and only re-run `write_relocs` + `encode_android` when an input to the encoding actually changed, or compute only the encoded *size* during the convergence loop and produce the final byte stream once, after the layout is frozen.","locations":[{"ref":"src/output-chunks.cc:476-492","code":"  476 |   if (ctx.arg.pack_dyn_relocs_android) {\n  477 |     relocs.resize(num_relocs - num_relrs);\n  478 |     write_relocs(ctx, relocs.data());\n  479 | \n  480 |     // APS2 uses SLEB128-encoded deltas, so .rela.dyn size may oscillate\n  481 |     // as addresses move. If a shrink is followed by a growth, stop\n  482 |     // shrinking and pad the encoded stream to converge.\n  483 |     android_encoded = encode_android<E>(relocs);\n  484 |     i64 old_size = this->shdr.sh_size;\n  485 |     if (old_size != 0 && old_size < (i64)android_encoded.size())\n  486 |       keep_android_size = true;\n  487 |     if (keep_android_size && android_encoded.size() < old_size)\n  488 |       android_encoded.resize(old_size);\n  489 |     this->shdr.sh_size = android_encoded.size();\n  490 |   } else {\n  491 |     this->shdr.sh_size = (num_relocs - num_relrs) * sizeof(ElfRel<E>);\n  492 |   }","lines":17,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/output-chunks.cc#L476-L492"},{"ref":"src/output-chunks.cc:1276-1284","code":" 1276 |   ranges::sort(rels, {}, [&](const ElfRel<E> &r) {\n 1277 |     return std::tuple{r.r_type, r.r_sym, r.r_offset};\n 1278 |   });\n 1279 | \n 1280 |   i64 prev_offset = 0;\n 1281 |   i64 prev_addend = 0;\n 1282 |   i64 i = 0;\n 1283 | \n 1284 |   while (i < (i64)rels.size()) {","lines":9,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/output-chunks.cc#L1276-L1284"}]},{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`OutputSection<E>::scan_abs_relocations` classifies every absolute relocation in a\nsingle-threaded loop:\n\n```\nfor (i64 i = 0; i < (i64)abs_rels.size(); i++) {\n  AbsRel<E> &r = abs_rels[i];\n  r.kind = get_abs_rel_kind(ctx, *r.sym);\n  ...\n  dynrel_offsets[i / DYNREL_SHARD_SIZE + 1]++;\n}\n```\n\n`abs_rels` holds ~1.5 million entries for a single section such as `.data.rel.ro` in\na Chromium debug link, and the whole point of the surrounding `DYNREL_SHARD_SIZE`\nmachinery is to allow shard-parallel processing (`write_dynrels` and\n`get_relr_offsets` already use `tbb::parallel_for` over exactly these shards). This\nloop reintroduces the serial stretch that the \"Parallelize dynamic relocation\ncollection\" work removed. The loop is trivially shardable: each shard can count its\nown emitted relocations into `dynrel_offsets[idx + 1]`, followed by the existing\nserial prefix sum.","fix":"Replace the serial loop with `tbb::parallel_for((i64)0, nshards, ...)` where each shard iterates `std::span(abs_rels).subspan(begin, end - begin)`, sets `r.kind`, accumulates a local count and stores it into `dynrel_offsets[idx + 1]`; keep the existing prefix-sum loop afterwards.","locations":[{"ref":"src/output-chunks.cc:1377-1393","code":" 1377 |   // Classify relocations and retain exact per-shard output counts.\n 1378 |   i64 nshards = (abs_rels.size() + DYNREL_SHARD_SIZE - 1) / DYNREL_SHARD_SIZE;\n 1379 |   dynrel_offsets.assign(nshards + 1, 0);\n 1380 | \n 1381 |   for (i64 i = 0; i < (i64)abs_rels.size(); i++) {\n 1382 |     AbsRel<E> &r = abs_rels[i];\n 1383 |     r.kind = get_abs_rel_kind(ctx, *r.sym);\n 1384 | \n 1385 |     bool emit = r.kind == ABS_REL_BASEREL || r.kind == ABS_REL_DYNREL;\n 1386 |     if constexpr (supports_ifunc<E>)\n 1387 |       emit |= (r.kind == ABS_REL_IFUNC);\n 1388 |     if (emit)\n 1389 |       dynrel_offsets[i / DYNREL_SHARD_SIZE + 1]++;\n 1390 |   }\n 1391 | \n 1392 |   for (i64 i = 0; i < nshards; i++)\n 1393 |     dynrel_offsets[i + 1] += dynrel_offsets[i];","lines":17,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/output-chunks.cc#L1377-L1393"}]},{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`create_output_sections()` gives *every* output section a per-object-file\nbucket vector:\n\n```\nfor (std::unique_ptr<OutputSection<E>> &osec : ctx.osec_pool)\n  osec->members_vec.resize(ctx.objs.size());\n```\n\nThat is `O(#output_sections x #input_files)` `std::vector` objects (24 bytes\neach) allocated and then destroyed, even though almost all of them stay\nempty. It is especially bad for `--relocatable`, where the branch above\ncreates one `OutputSection` per COMDAT group *per file*: 100k groups x 10k\nobjects would reserve ~24 GiB of empty vectors before a single input section\nis added. The subsequent `flatten()` then copies all members once more.","fix":"Invert the data structure: collect `(osec, isec)` pairs per input file into per-thread vectors, then bucket them by output section once (e.g. sort by `output_section` pointer, or use a `tbb::concurrent_vector<InputSection<E> *>` per output section) so memory is proportional to the number of live input sections rather than to `#osec x #objs`.","locations":[{"ref":"src/passes.cc:716-723","code":"  716 |       if (ctx.arg.relocatable && (sh_flags & SHF_GROUP)) {\n  717 |         OutputSection<E> *osec =\n  718 |           new OutputSection<E>(isec->name(), shdr.sh_type);\n  719 |         osec->sh_flags = sh_flags;\n  720 |         isec->output_section = osec;\n  721 |         ctx.osec_pool.emplace_back(osec);\n  722 |         continue;\n  723 |       }","lines":8,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/passes.cc#L716-L723"},{"ref":"src/passes.cc:760-768","code":"  760 |   // Add input sections to output sections\n  761 |   for (std::unique_ptr<OutputSection<E>> &osec : ctx.osec_pool)\n  762 |     osec->members_vec.resize(ctx.objs.size());\n  763 | \n  764 |   tbb::parallel_for((i64)0, (i64)ctx.objs.size(), [&](i64 i) {\n  765 |     for (InputSection<E> *isec : ctx.objs[i]->sections)\n  766 |       if (isec && isec->output_section)\n  767 |         isec->output_section->members_vec[i].push_back(isec);\n  768 |   });","lines":9,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/passes.cc#L760-L768"},{"ref":"src/passes.cc:782-788","code":"  782 |   for (std::unique_ptr<OutputSection<E>> &osec : ctx.osec_pool) {\n  783 |     osec->shdr.sh_flags = osec->sh_flags;\n  784 |     osec->is_relro = is_relro(*osec);\n  785 |     osec->members = flatten(osec->members_vec);\n  786 |     osec->members_vec.clear();\n  787 |     osec->members_vec.shrink_to_fit();\n  788 |   }","lines":7,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/passes.cc#L782-L788"}]},{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"The output-section alignment computation runs a *serial* outer loop over all\noutput sections and a nested `tbb::parallel_for` over all input files for\neach one:\n\n```\nfor (std::unique_ptr<OutputSection<E>> &osec : ctx.osec_pool) {\n  Atomic<u32> p2align;\n  tbb::parallel_for((i64)0, (i64)ctx.objs.size(), [&](i64 i) { ... });\n  osec->shdr.sh_addralign = 1 << p2align;\n}\n```\n\nEvery output section pays a full parallel-for dispatch plus a scan of all\n`ctx.objs.size()` (mostly empty) buckets, so the total work is\n`O(#osec x #objs)` with `#osec` separate parallel regions and an atomic\n`update_maximum` per bucket. With many small output sections (the common case\nfor `-ffunction-sections`, and the degenerate case for `--relocatable`) this\ndominates `create_output_sections()`.","fix":"Parallelize over output sections instead: `tbb::parallel_for_each(ctx.osec_pool, ...)` computing a plain (non-atomic) local maximum over that section's own members. Combine it with the `sh_flags`/`is_relro`/`flatten` loop right below so the member lists are traversed once.","locations":[{"ref":"src/passes.cc:770-780","code":"  770 |   // Compute section alignment\n  771 |   for (std::unique_ptr<OutputSection<E>> &osec : ctx.osec_pool) {\n  772 |     Atomic<u32> p2align;\n  773 |     tbb::parallel_for((i64)0, (i64)ctx.objs.size(), [&](i64 i) {\n  774 |       u32 x = 0;\n  775 |       for (InputSection<E> *isec : osec->members_vec[i])\n  776 |         x = std::max<u32>(x, isec->p2align);\n  777 |       update_maximum(p2align, x);\n  778 |     });\n  779 |     osec->shdr.sh_addralign = 1 << p2align;\n  780 |   }","lines":11,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/passes.cc#L770-L780"}]},{"id":"PERF_9","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`check_shlib_undefined()` calls `has_dso_definition()` for every unresolved,\nnon-weak undefined symbol of every shared library, and `has_dso_definition()`\nlinearly scans *all* symbols of *all* shared files:\n\n```\nfor (ArenaObjectPtr<SharedFile<E>> &file : ctx.dso_pool)\n  for (i64 i = 0; i < file->symbols.size(); i++)\n    if (file->symbols[i] == &sym && !file->elf_syms[i].is_undef())\n      return true;\n```\n\nThis is `O(#unresolved x #dsos x #syms_per_dso)`. On a large desktop link with\n`--no-allow-shlib-undefined` and a few hundred DSOs, each with tens of\nthousands of dynamic symbols, a handful of genuinely unresolved symbols is\nenough to add seconds of wall time; a thousand of them makes the pass appear\nto hang.","fix":"Precompute the answer once: before the loop, mark each `Symbol<E>` that has a non-undefined definition in some DSO (a single pass over `ctx.dso_pool`, setting a bit or filling an `unordered_set<Symbol<E> *>`), then have the check be an O(1) lookup.","locations":[{"ref":"src/passes.cc:1280-1287","code":" 1280 | template <typename E>\n 1281 | static bool has_dso_definition(Context<E> &ctx, Symbol<E> &sym) {\n 1282 |   for (ArenaObjectPtr<SharedFile<E>> &file : ctx.dso_pool)\n 1283 |     for (i64 i = 0; i < file->symbols.size(); i++)\n 1284 |       if (file->symbols[i] == &sym && !file->elf_syms[i].is_undef())\n 1285 |         return true;\n 1286 |   return false;\n 1287 | }","lines":8,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/passes.cc#L1280-L1287"},{"ref":"src/passes.cc:1325-1337","code":" 1325 |     tbb::parallel_for_each(ctx.dsos, [&](SharedFile<E> *file) {\n 1326 |       // Check if all undefined symbols have been resolved.\n 1327 |       for (i64 i = 0; i < file->elf_syms.size(); i++) {\n 1328 |         const ElfSym<E> &esym = file->elf_syms[i];\n 1329 |         Symbol<E> &sym = *file->symbols[i];\n 1330 | \n 1331 |         if (esym.is_undef() && !esym.is_weak() && !is_sparc_register(esym) &&\n 1332 |             (!sym.file || sym.visibility == STV_HIDDEN) &&\n 1333 |             !has_dso_definition(ctx, sym))\n 1334 |           Error(ctx) << *file << \": --no-allow-shlib-undefined: undefined symbol: \"\n 1335 |                      << sym;\n 1336 |       }\n 1337 |     });","lines":13,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/passes.cc#L1325-L1337"}]},{"id":"PERF_10","type":"performance","type_label":"Performance","severity":"medium","difficulty":"easy","description":"`r_set_osec_offsets()` advances the file offset for every chunk, including\n`SHT_NOBITS` ones:\n\n```\nfor (Chunk<E> *chunk : ctx.chunks) {\n  offset = align_to(offset, chunk->shdr.sh_addralign);\n  chunk->shdr.sh_offset = offset;\n  offset += chunk->shdr.sh_size;   // also for SHT_NOBITS\n}\n```\n\n`set_file_offsets()` in the non-relocatable path correctly assigns a NOBITS\nsection an offset without consuming file space. As a result `mold -r` writes\n(and zero-fills) the entire `.bss`/`.tbss` into the output object. Measured\nwith mold 2.40.4 on an object containing a 10 MiB `.bss`:\n\n```\n$ ls -l b.o        1344 bytes\n$ mold -r -o br.o b.o && ls -l br.o   10487400 bytes\n$ ld   -r -o bl.o b.o && ls -l bl.o       1488 bytes\n```\n\n`OutputSection::copy_buf()` already returns early for `SHT_NOBITS`, so the\nspace is pure waste of disk, page cache and write time for every `-r` link.","fix":"Skip the size accumulation for NOBITS chunks:\n```\nfor (Chunk<E> *chunk : ctx.chunks) {\n  if (chunk->shdr.sh_type == SHT_NOBITS) {\n    chunk->shdr.sh_offset = offset;\n    continue;\n  }\n  offset = align_to(offset, chunk->shdr.sh_addralign);\n  chunk->shdr.sh_offset = offset;\n  offset += chunk->shdr.sh_size;\n}\n```","locations":[{"ref":"src/relocatable.cc:139-148","code":"  139 | template <typename E>\n  140 | static u64 r_set_osec_offsets(Context<E> &ctx) {\n  141 |   u64 offset = 0;\n  142 |   for (Chunk<E> *chunk : ctx.chunks) {\n  143 |     offset = align_to(offset, chunk->shdr.sh_addralign);\n  144 |     chunk->shdr.sh_offset = offset;\n  145 |     offset += chunk->shdr.sh_size;\n  146 |   }\n  147 |   return offset;\n  148 | }","lines":10,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/relocatable.cc#L139-L148"}]},{"id":"PERF_11","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"Both demanglers build a temporary `std::string` on every call purely to obtain a NUL-terminated\npointer: `abi::__cxa_demangle(std::string(name).c_str(), ...)` and\n`rust_demangle(std::string(name).c_str(), 0)`. `demangle_cpp()` is called once per defined symbol\ninside a `parallel_for_each` over the whole symbol map when `extern \"C++\"` version-script patterns\nare present (`src/passes.cc:2238`, `src/passes.cc:2467`), so this is one heap allocation +\ncopy per symbol on a hot parallel path — and it is paid even for the overwhelmingly common case\nwhere `__cxa_demangle` immediately fails.\n\n`demangle_cpp()` at least short-circuits on `name.starts_with(\"_Z\")`; `demangle_rust()` does not\nshort-circuit at all.","fix":"Symbol names in mold come from a NUL-terminated `.strtab` mapping, so the copy is usually\navoidable. Either pass a `const char *` down from the caller, or keep a `thread_local std::string`\nscratch buffer and `assign()` into it instead of constructing a fresh string each call:\n\n```cpp\n  static thread_local std::string tmp;\n  tmp.assign(name);\n  char *p = abi::__cxa_demangle(tmp.c_str(), buf, &buflen, &status);\n```","locations":[{"ref":"lib/demangle.cc:19-27","code":"   19 | #ifndef _WIN32\n   20 |   if (name.starts_with(\"_Z\")) {\n   21 |     int status;\n   22 |     char *p = abi::__cxa_demangle(std::string(name).c_str(), buf, &buflen, &status);\n   23 |     if (status == 0) {\n   24 |       buf = p;\n   25 |       return p;\n   26 |     }\n   27 |   }","lines":9,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/lib/demangle.cc#L19-L27"},{"ref":"lib/demangle.cc:33-40","code":"   33 | std::optional<std::string_view> demangle_rust(std::string_view name) {\n   34 |   static thread_local char *buf;\n   35 |   free(buf);\n   36 |   buf = rust_demangle(std::string(name).c_str(), 0);\n   37 |   if (buf)\n   38 |     return buf;\n   39 |   return {};\n   40 | }","lines":8,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/lib/demangle.cc#L33-L40"}]},{"id":"PERF_12","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`Arm32ExidxSection<E>::remove_duplicate_entries()` calls `get_contents(ctx)` purely to take\n`.size()` and throws the vector away; `copy_buf()` then calls `get_contents(ctx)` again to produce\nthe same bytes. `get_contents()` is not cheap: it allocates the whole `.ARM.exidx` image, runs\n`output_section.write_to()` (which applies every relocation in the section), does two\n`tbb::parallel_for` passes, a full sort and a `unique`. All of that is done twice.\n\n`get_contents()` also mutates shared state as a side effect — `output_section.shdr.sh_addr =\nthis->shdr.sh_addr;` — which is surprising for a `get_*` accessor and means the size-only call\nleaves the wrapped `OutputSection`'s address field modified.","fix":"Cache the computed contents on the object:\n\n```cpp\ntemplate <>\nvoid Arm32ExidxSection<E>::remove_duplicate_entries(Context<E> &ctx) {\n  contents = get_contents(ctx);\n  this->shdr.sh_size = contents.size();\n}\n\ntemplate <>\nvoid Arm32ExidxSection<E>::copy_buf(Context<E> &ctx) {\n  write_vector(ctx.buf + this->shdr.sh_offset, contents);\n}\n```\n\nand move the `output_section.shdr.sh_addr` assignment out of `get_contents()` into the caller so\nthe accessor has no side effects.","locations":[{"ref":"src/arch-arm32.cc:836-846","code":"  836 | template <>\n  837 | void Arm32ExidxSection<E>::remove_duplicate_entries(Context<E> &ctx) {\n  838 |   this->shdr.sh_size = get_contents(ctx).size();\n  839 | }\n  840 | \n  841 | template <>\n  842 | void Arm32ExidxSection<E>::copy_buf(Context<E> &ctx) {\n  843 |   std::vector<u8> contents = get_contents(ctx);\n  844 |   assert(this->shdr.sh_size == contents.size());\n  845 |   write_vector(ctx.buf + this->shdr.sh_offset, contents);\n  846 | }","lines":11,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/arch-arm32.cc#L836-L846"},{"ref":"src/arch-arm32.cc:767-834","code":"  767 | template <>\n  768 | std::vector<u8> Arm32ExidxSection<E>::get_contents(Context<E> &ctx) {\n  769 |   // .ARM.exidx records consists of a signed 31-bit relative address\n  770 |   // and a 32-bit value. The relative address indicates the start\n  771 |   // address of a function that the record covers. The value is one of\n  772 |   // the followings:\n  773 |   //\n  774 |   // 1. CANTUNWIND indicating that there's no unwinding info for the function,\n  775 |   // 2. a compact unwinding record encoded into a 32-bit value, or\n  776 |   // 3. a 31-bit relative address which points to a larger record in\n  777 |   //    the .ARM.extab section.\n  778 |   //\n  779 |   // CANTUNWIND is value 1. The most significant bit is set in (2) but\n  780 |   // not in (3). So we can distinguished them just by looking at a value.\n  781 |   const u32 CANTUNWIND = 1;\n  782 | \n  783 |   struct Entry {\n  784 |     U32<E> addr;\n  785 |     U32<E> val;\n  786 |   };\n  787 | \n  788 |   // We reserve one extra slot for the sentinel\n  789 |   i64 num_entries = output_section.shdr.sh_size / sizeof(Entry) + 1;\n  790 |   std::vector<u8> buf(num_entries * sizeof(Entry));\n  791 |   Entry *ent = (Entry *)buf.data();\n  792 | \n  793 |   // Write section contents to the buffer\n  794 |   output_section.shdr.sh_addr = this->shdr.sh_addr;\n  795 |   output_section.write_to(ctx, buf.data());\n  796 | \n  797 |   // Fill in sentinel fields\n  798 |   u64 sentinel_addr = this->shdr.sh_addr + sizeof(Entry) * (num_entries - 1);\n  799 |   ent[num_entries - 1].addr = get_text_end(ctx) - sentinel_addr;\n  800 |   ent[num_entries - 1].val = CANTUNWIND;\n  801 | \n  802 |   // Entry's addresses are relative to themselves. In order to sort\n  803 |   // records by address, we first translate them so that the addresses\n  804 |   // are relative to the beginning of the section.\n  805 |   auto is_relative = [](u32 val) {\n  806 |     return val != CANTUNWIND && !(val & 0x8000'0000);\n  807 |   };\n  808 | \n  809 |   tbb::parallel_for((i64)0, num_entries, [&](i64 i) {\n  810 |     i64 offset = sizeof(Entry) * i;\n  811 |     ent[i].addr = sign_extend(ent[i].addr, 31) + offset;\n  812 |     if (is_relative(ent[i].val))\n  813 |       ent[i].val = 0x7fff'ffff & (ent[i].val + offset);\n  814 |   });\n  815 | \n  816 |   ranges::sort(ent, ent + num_entries, {}, &Entry::addr);\n  817 | \n  818 |   // Remove duplicate adjacent entries. That is, if two adjacent functions\n  819 |   // have the same compact unwind info or are both CANTUNWIND, we can\n  820 |   // merge them into a single address range.\n  821 |   auto tail = ranges::unique(ent, ent + num_entries, {}, &Entry::val);\n  822 |   num_entries -= tail.size();\n  823 |   buf.resize(num_entries * sizeof(Entry));\n  824 | \n  825 |   // Make addresses relative to themselves.\n  826 |   tbb::parallel_for((i64)0, num_entries, [&](i64 i) {\n  827 |     i64 offset = sizeof(Entry) * i;\n  828 |     ent[i].addr = 0x7fff'ffff & (ent[i].addr - offset);\n  829 |     if (is_relative(ent[i].val))\n  830 |       ent[i].val = 0x7fff'ffff & (ent[i].val - offset);\n  831 |   });\n  832 | \n  833 |   return buf;\n  834 | }","lines":68,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/arch-arm32.cc#L767-L834"}]},{"id":"PERF_13","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`build_start_stop_map` walks every live `SHF_ALLOC` input section of every\nobject file and calls `isec->name()` plus `is_c_identifier(name)` on each, even\nwhen no `__start_<name>`/`__stop_<name>` symbol is referenced anywhere in the\nlink - which is the overwhelmingly common case. The resulting map is then\nalmost always empty, so the whole pass is wasted work proportional to the total\nnumber of input sections.","fix":"Build the map lazily: first check whether any referenced symbol name starts with\n`__start_`/`__stop_` (this information is already available when those symbols\nare synthesized) and skip `build_start_stop_map` entirely otherwise. Pass an\nempty map to `mark` in that case.","locations":[{"ref":"src/gc-sections.cc:45-56","code":"   45 | template <typename E>\n   46 | static StartStopMap<E> build_start_stop_map(Context<E> &ctx) {\n   47 |   StartStopMap<E> map;\n   48 |   tbb::parallel_for_each(ctx.objs, [&](ObjectFile<E> *file) {\n   49 |     for (InputSection<E> *isec : file->sections)\n   50 |       if (isec && isec->is_alive && (isec->shdr().sh_flags & SHF_ALLOC))\n   51 |         if (std::string_view name = isec->name();\n   52 |             is_c_identifier(name))\n   53 |           map[name].push_back(isec);\n   54 |   });\n   55 |   return map;\n   56 | }","lines":12,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/gc-sections.cc#L45-L56"},{"ref":"src/gc-sections.cc:266-268","code":"  266 |   tbb::concurrent_vector<InputSection<E> *> rootset = collect_root_set(ctx);\n  267 |   StartStopMap<E> start_stop_map = build_start_stop_map(ctx);\n  268 |   mark(ctx, rootset, start_stop_map);","lines":3,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/gc-sections.cc#L266-L268"}]},{"id":"PERF_14","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"Every reference to a `__start_`/`__stop_` symbol spawns a nested\n`tbb::parallel_for_each` over the matching sections. Such groups are usually\ntiny (a handful of sections), so the task-spawning overhead dominates, and the\nnested loop is executed once per *reference*, not once per name - a program with\nN references to `__start_foo` runs N nested parallel loops over the same vector,\nwith `mark_section` failing for all but the first.","fix":"Handle the fan-out serially (feeding into `feeder` for the bulk of the work) or\nonly fall back to `tbb::parallel_for_each` when `it->second.size()` exceeds a\nthreshold. Better still, mark each `__start_`/`__stop_` symbol as already\nexpanded with a `test_and_set` flag so the group is walked at most once.","locations":[{"ref":"src/gc-sections.cc:184-188","code":"  184 |         tbb::parallel_for_each(it->second, [&](InputSection<E> *isec) {\n  185 |           if (mark_section(isec))\n  186 |             visit_section(ctx, isec, feeder, 0, start_stop_map);\n  187 |         });\n  188 |       }","lines":5,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/gc-sections.cc#L184-L188"}]},{"id":"PERF_15","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`sweep` always builds `std::vector<std::vector<InputSection<E> *>>\nsections(ctx.objs.size())` and pushes every discarded section into it, but the\nvector is only read when `--print-gc-sections` is given. On a large link with\n`--gc-sections` this is millions of `push_back` calls plus per-object heap\nallocations that are then thrown away.","fix":"Hoist `bool print = !ctx.arg.print_gc_sections.empty();` above the\n`tbb::parallel_for` and guard the `sections[i].push_back(isec)` with it, or skip\nbuilding the vector entirely and do a second serial pass over the sections when\nprinting is requested.","locations":[{"ref":"src/gc-sections.cc:211-225","code":"  211 | static void sweep(Context<E> &ctx) {\n  212 |   Timer t(ctx, \"sweep\");\n  213 | \n  214 |   std::vector<std::vector<InputSection<E> *>> sections(ctx.objs.size());\n  215 | \n  216 |   tbb::parallel_for((i64)0, (i64)ctx.objs.size(), [&](i64 i) {\n  217 |     ObjectFile<E> &file = *ctx.objs[i];\n  218 | \n  219 |     for (InputSection<E> *isec : file.sections) {\n  220 |       if (isec && isec->is_alive && !isec->is_visited) {\n  221 |         isec->kill();\n  222 |         sections[i].push_back(isec);\n  223 |       }\n  224 |     }\n  225 |   });","lines":15,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/gc-sections.cc#L211-L225"},{"ref":"src/gc-sections.cc:227-229","code":"  227 |   std::string &path = ctx.arg.print_gc_sections;\n  228 | \n  229 |   if (!path.empty()) {","lines":3,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/gc-sections.cc#L227-L229"}]},{"id":"PERF_16","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`parse_ehframe()` associates FDEs with CIEs using `find_cie()`, a linear scan\nover `[cies_begin, cies.size())` executed once per FDE. That makes the pass\nO(#FDEs x #CIEs). It is fine for the common one-CIE case, but object files\nproduced by `ld -r` over a large program (or C++ code mixing many personality\nroutines) routinely carry hundreds of CIEs and tens of thousands of FDEs, making\nthis a measurable hot spot.\n\nThe `ranges::stable_sort` immediately below has a related problem: its\nprojection `get_isec()` re-does `elf_syms[...]` + `get_shndx()` +\n`sections[...]` lookups on every comparison, i.e. O(n log n) times, instead of\nbeing computed once per FDE.","fix":"Build a `std::unordered_map<i64, i64>` (or a sorted vector of\n`{input_offset, index}` plus `std::lower_bound`) from CIE input offset to index\nonce per `.eh_frame` section. For the sort, precompute a\n`std::vector<std::pair<i64 /*priority*/, FdeRecord<E>>>` (or a parallel key\narray) and sort that.","locations":[{"ref":"src/input-files.cc:699-738","code":"  699 |     // Associate CIEs to FDEs.\n  700 |     auto find_cie = [&](i64 offset) {\n  701 |       for (i64 i = cies_begin; i < cies.size(); i++)\n  702 |         if (cies[i].input_offset == offset)\n  703 |           return i;\n  704 |       Fatal(ctx) << *isec << \": bad FDE pointer\";\n  705 |     };\n  706 | \n  707 |     for (i64 i = fdes_begin; i < fdes.size(); i++) {\n  708 |       i64 cie_offset = *(I32<E> *)(contents.data() + fdes[i].input_offset + 4);\n  709 |       fdes[i].cie_idx = find_cie(fdes[i].input_offset + 4 - cie_offset);\n  710 |     }\n  711 | \n  712 |     isec->is_alive = false;\n  713 |   }\n  714 | \n  715 |   auto get_isec = [&](const FdeRecord<E> &fde) {\n  716 |     return get_section(this->elf_syms[fde.get_rels(*this)[0].r_sym]);\n  717 |   };\n  718 | \n  719 |   // We assume that FDEs for the same input sections are contiguous\n  720 |   // in `fdes` vector.\n  721 |   ranges::stable_sort(fdes, {}, [&](const FdeRecord<E> &x) {\n  722 |     return get_isec(x)->get_priority();\n  723 |   });\n  724 | \n  725 |   // Associate FDEs to input sections.\n  726 |   for (i64 i = 0; i < fdes.size();) {\n  727 |     InputSection<E> *isec = get_isec(fdes[i]);\n  728 |     assert(isec->fde_begin == -1);\n  729 | \n  730 |     if (isec->is_alive) {\n  731 |       isec->fde_begin = i++;\n  732 |       while (i < fdes.size() && isec == get_isec(fdes[i]))\n  733 |         i++;\n  734 |       isec->fde_end = i;\n  735 |     } else {\n  736 |       fdes[i++].is_alive = false;\n  737 |     }\n  738 |   }","lines":40,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/input-files.cc#L699-L738"}]},{"id":"PERF_17","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`MergeableSection<E>::split_contents()` reserves `frag_offsets` only in the\nfixed-size-record branch. The `SHF_STRINGS` branch - which is by far the common\ncase and typically produces the most fragments - grows the vector by repeated\nreallocation. Since the fragment count is unknown up front, a cheap estimate\n(e.g. `data.size() / 16`) still removes most of the reallocations.","fix":"Add `frag_offsets.reserve(data.size() / 16 + 1);` before the string-splitting\nloop (matching the `reserve(data.size() / entsize)` already present in the other\nbranch).","locations":[{"ref":"src/input-sections.cc:409-426","code":"  409 |   // Split sections\n  410 |   if (parent.shdr.sh_flags & SHF_STRINGS) {\n  411 |     for (i64 pos = 0; pos < data.size();) {\n  412 |       frag_offsets.push_back(pos);\n  413 |       size_t end = find_null(data, pos, entsize);\n  414 |       if (end == data.npos)\n  415 |         Fatal(ctx) << *input_section << \": string is not null terminated\";\n  416 |       pos = end + entsize;\n  417 |     }\n  418 |   } else {\n  419 |     if (data.size() % entsize)\n  420 |       Fatal(ctx) << *input_section\n  421 |                  << \": section size is not multiple of sh_entsize\";\n  422 |     frag_offsets.reserve(data.size() / entsize);\n  423 | \n  424 |     for (i64 pos = 0; pos < data.size(); pos += entsize)\n  425 |       frag_offsets.push_back(pos);\n  426 |   }","lines":18,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/input-sections.cc#L409-L426"}]},{"id":"PERF_18","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`detect_machine_type()` calls `open_file()` on command-line inputs to sniff the\nmachine type; every successful call creates a *new* `MappedFile` (with its own\n`mmap`) and pushes it into `ctx.mf_pool`. The same files are then opened and\nmapped a second time by `read_input_files()`. The same duplication happens\nwhenever the same library appears more than once on the command line (`-lfoo`\ntwice, or a library reachable both directly and through a `GROUP(...)` script):\n`open_file()` has no path-to-`MappedFile` cache, so a big DSO can be mapped\nseveral times and each mapping is kept alive until the end of the link.","fix":"Add a `std::unordered_map<std::string, MappedFile *>` cache (guarded by a mutex\nor as a `tbb::concurrent_hash_map`) inside `open_file()` keyed on the resolved\npath, so repeated opens of the same file share one mapping.","locations":[{"ref":"src/main.cc:134-155","code":"  134 | template <typename E>\n  135 | static std::string_view\n  136 | detect_machine_type(Context<E> &ctx, std::span<ReaderJob> jobs) {\n  137 |   for (ReaderJob &job : jobs)\n  138 |     if (!job.is_lib)\n  139 |       if (MappedFile *mf = open_file(ctx, job.name))\n  140 |         if (get_file_type(ctx, mf) != FileType::TEXT)\n  141 |           if (std::string_view target = get_machine_type(ctx, job.rctx, mf);\n  142 |               !target.empty())\n  143 |             return target;\n  144 | \n  145 |   for (ReaderJob &job : jobs)\n  146 |     if (!job.is_lib)\n  147 |       if (MappedFile *mf = open_file(ctx, job.name))\n  148 |         if (get_file_type(ctx, mf) == FileType::TEXT)\n  149 |           if (std::string_view target =\n  150 |               Script(ctx, job.rctx, mf).get_script_output_type();\n  151 |               !target.empty())\n  152 |             return target;\n  153 | \n  154 |   Fatal(ctx) << \"-m option is missing\";\n  155 | }","lines":22,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/main.cc#L134-L155"},{"ref":"src/main.cc:244-251","code":"  244 |     // Everything else is a command line argument that we need to open.\n  245 |     MappedFile *mf;\n  246 |     if (job.is_lib) {\n  247 |       mf = find_library(ctx, rctx, job.name);\n  248 |       mf->given_fullpath = false;\n  249 |     } else {\n  250 |       mf = must_open_file(ctx, job.name);\n  251 |     }","lines":8,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/main.cc#L244-L251"}]},{"id":"PERF_19","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`SectionFragment<E>` uses `i64 offset` for an offset inside a single output\nsection. The struct is embedded in `ConcurrentMap<SectionFragment<E>>::Entry`,\none instance per unique mergeable string, i.e. tens of millions on a large\nC++ link, and the `i64` also forces the struct's alignment to 8 despite the\nexplicit `__attribute__((aligned(4)))`, so the struct is 16 bytes where 12\nwould do. The class even carries an `is_32bit` flag whose entire purpose is to\nguarantee that a subset of fragments lives within the first 2^32 bytes of the\nsection, so a 64-bit offset is not needed for the common case either.","fix":"Shrink `offset` to `u32` (with the existing `is_32bit` partitioning in\n`MergedSection<E>::compute_section_size()` already splitting the section into a\nsub-4 GiB region and the rest, either keep two 32-bit fields or add an explicit\n`Fatal` when an output mergeable section exceeds 4 GiB). Measure `sizeof`\nbefore/after; the `alignas(32)` on `ConcurrentMap::Entry` means the win only\nmaterializes if `Entry` drops below 32 bytes.","locations":[{"ref":"src/mold.h:279-306","code":"  279 | template <typename E>\n  280 | struct __attribute__((aligned(4))) SectionFragment {\n  281 |   SectionFragment(Context<E> &ctx, MergedSection<E> &sec, bool is_alive)\n  282 |     : output_section_arena_idx(ctx.arena.get_index(&sec)),\n  283 |       is_alive(is_alive) {}\n  284 | \n  285 |   u64 get_addr(Context<E> &ctx) const {\n  286 |     return get_output_section(ctx).shdr.sh_addr + offset;\n  287 |   }\n  288 | \n  289 |   MergedSection<E> &get_output_section(Context<E> &ctx) const {\n  290 |     return *ctx.arena.template get_pointer<MergedSection<E>>(\n  291 |       output_section_arena_idx);\n  292 |   }\n  293 | \n  294 |   i64 offset = -1;\n  295 | \n  296 |   // SectionFragment lives in a separately mapped hash table, so it cannot use\n  297 |   // ArenaPtr.\n  298 |   u32 output_section_arena_idx;\n  299 | \n  300 |   Atomic<u8> p2align = 0;\n  301 |   Atomic<bool> is_alive = false;\n  302 | \n  303 |   // True if this fragment must be placed within 2^32 bytes from the\n  304 |   // start of the output section.\n  305 |   Atomic<bool> is_32bit = false;\n  306 | };","lines":28,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mold.h#L279-L306"}]},{"id":"PERF_20","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`DynamicSection<E>::update_shdr` builds the entire dynamic section just to learn its\nlength and throws the vector away, and `copy_buf` builds it a second time.\n`create_dynamic_section` is not cheap: it performs three `find_chunk` calls, each a\nlinear scan over `ctx.chunks`, plus a `find_string` hash lookup per `DT_NEEDED`, and\n`update_shdr` runs once per chunk per layout pass (and `compute_section_headers`\nitself calls `update_shdr` on every chunk twice). The same pattern exists in\n`OutputPhdr::update_shdr`, which re-sorts all `SHF_ALLOC` chunks on every pass.","fix":"Cache the vector produced by `create_dynamic_section` in the `DynamicSection` object (as `OutputPhdr` already does with `phdrs`) and have `copy_buf` write the cached copy after asserting its size, instead of recomputing it.","locations":[{"ref":"src/output-chunks.cc:920-934","code":"  920 | template <typename E>\n  921 | void DynamicSection<E>::update_shdr(Context<E> &ctx) {\n  922 |   if (ctx.arg.static_ && !ctx.arg.pie)\n  923 |     return;\n  924 | \n  925 |   this->shdr.sh_size = create_dynamic_section(ctx).size() * sizeof(Word<E>);\n  926 |   this->shdr.sh_link = ctx.dynstr->shndx;\n  927 | }\n  928 | \n  929 | template <typename E>\n  930 | void DynamicSection<E>::copy_buf(Context<E> &ctx) {\n  931 |   std::vector<Word<E>> contents = create_dynamic_section(ctx);\n  932 |   assert(this->shdr.sh_size == contents.size() * sizeof(Word<E>));\n  933 |   write_vector(ctx.buf + this->shdr.sh_offset, contents);\n  934 | }","lines":15,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/output-chunks.cc#L920-L934"},{"ref":"src/output-chunks.cc:805-821","code":"  805 |   if (find_chunk(ctx, SHT_INIT_ARRAY)) {\n  806 |     define(DT_INIT_ARRAY, ctx.__init_array_start->value);\n  807 |     define(DT_INIT_ARRAYSZ,\n  808 |            ctx.__init_array_end->value - ctx.__init_array_start->value);\n  809 |   }\n  810 | \n  811 |   if (find_chunk(ctx, SHT_PREINIT_ARRAY)) {\n  812 |     define(DT_PREINIT_ARRAY, ctx.__preinit_array_start->value);\n  813 |     define(DT_PREINIT_ARRAYSZ,\n  814 |            ctx.__preinit_array_end->value - ctx.__preinit_array_start->value);\n  815 |   }\n  816 | \n  817 |   if (find_chunk(ctx, SHT_FINI_ARRAY)) {\n  818 |     define(DT_FINI_ARRAY, ctx.__fini_array_start->value);\n  819 |     define(DT_FINI_ARRAYSZ,\n  820 |            ctx.__fini_array_end->value - ctx.__fini_array_start->value);\n  821 |   }","lines":17,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/output-chunks.cc#L805-L821"}]},{"id":"PERF_21","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`add_start_stop()` throws away the `Symbol<E> *` returned by `add()` and then\nre-derives it, calling `save_string()` a second time. `save_string()` copies\nthe string into the arena, so every `__start_`/`__stop_` symbol permanently\nleaks a duplicate copy of its name into the arena and pays a second hash\nlookup in the global symbol table. With `--physical-image-base` four such\nsymbols are created per eligible output section.","fix":"Use the value `add()` already returns:\nbefore\n```\nadd(save_string(ctx, s));\nif (ctx.arg.z_start_stop_visibility_protected)\n  get_symbol(ctx, save_string(ctx, s))->is_exported = true;\n```\nafter\n```\nSymbol<E> *sym = add(save_string(ctx, s));\nif (ctx.arg.z_start_stop_visibility_protected)\n  sym->is_exported = true;\n```","locations":[{"ref":"src/passes.cc:956-960","code":"  956 |   auto add_start_stop = [&](std::string s) {\n  957 |     add(save_string(ctx, s));\n  958 |     if (ctx.arg.z_start_stop_visibility_protected)\n  959 |       get_symbol(ctx, save_string(ctx, s))->is_exported = true;\n  960 |   };","lines":5,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/passes.cc#L956-L960"}]},{"id":"PERF_22","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`print_dependencies()` constructs a fresh `std::unordered_set<void *>` for\n*every* input section of every object file, then inserts into it while\nscanning relocations. For a large link this is millions of hash-table\nconstructions/destructions in a serial loop. The pass is opt-in\n(`--print-dependencies`), but it is unusably slow on the kind of link where\none actually wants a dependency dump.","fix":"Hoist the set out of the loop and `clear()` it per section (it keeps its buckets), or replace it with a per-symbol epoch counter/`visited` stamp. The outer loop over `ctx.objs` can also be a `tbb::parallel_for_each` with per-thread buffered output.","locations":[{"ref":"src/passes.cc:1087-1106","code":" 1087 |   for (ObjectFile<E> *file : ctx.objs) {\n 1088 |     for (InputSection<E> *isec : file->sections) {\n 1089 |       if (!isec)\n 1090 |         continue;\n 1091 | \n 1092 |       std::unordered_set<void *> visited;\n 1093 | \n 1094 |       for (const ElfRel<E> &r : isec->get_rels(ctx)) {\n 1095 |         if (r.r_type == R_NONE || file->elf_syms.size() <= r.r_sym)\n 1096 |           continue;\n 1097 | \n 1098 |         ElfSym<E> &esym = file->elf_syms[r.r_sym];\n 1099 |         Symbol<E> &sym = *file->symbols[r.r_sym];\n 1100 | \n 1101 |         if (esym.is_undef() && sym.file && sym.file != file &&\n 1102 |             visited.insert((void *)&sym).second)\n 1103 |           println(*isec, sym, esym);\n 1104 |       }\n 1105 |     }\n 1106 |   }","lines":20,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/passes.cc#L1087-L1106"}]},{"id":"PERF_23","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`get_init_fini_priority()` and `get_ctor_dtor_priority()` run `std::regex`\nmatches (`\\.(\\d+)$`, `(?:clang_rt\\.)?crtbegin`, `(?:clang_rt\\.)?crtend`)\nonce per input section in `.init_array`/`.fini_array`/`.ctors`/`.dtors`, and\n`get_ctor_dtor_priority()` additionally regex-searches the whole\n`isec->file.filename` string. `std::regex` is roughly two orders of magnitude\nslower than hand-written scanning, and `std::stoi(m[1])` constructs a\n`std::string` per call. `sort_init_fini()`/`sort_ctor_dtor()` are serial\nloops, so this cost is not hidden by parallelism.","fix":"Replace the regexes with direct string operations: scan trailing digits of `name` manually, and use `filename.find(\"crtbegin\")`/`find(\"crtend\")` (with an optional `clang_rt.` prefix check) instead of `std::regex_search`.","locations":[{"ref":"src/passes.cc:1402-1432","code":" 1402 | template <typename E>\n 1403 | static i64 get_init_fini_priority(InputSection<E> *isec) {\n 1404 |   static std::regex re(R\"(\\.(\\d+)$)\", std::regex_constants::optimize);\n 1405 |   std::string_view name = isec->name();\n 1406 |   std::cmatch m;\n 1407 |   if (std::regex_search(name.data(), name.data() + name.size(), m, re))\n 1408 |     return std::stoi(m[1]);\n 1409 |   return 65536;\n 1410 | }\n 1411 | \n 1412 | template <typename E>\n 1413 | static i64 get_ctor_dtor_priority(InputSection<E> *isec) {\n 1414 |   auto opts = std::regex_constants::optimize | std::regex_constants::ECMAScript;\n 1415 |   static std::regex re1(R\"((?:clang_rt\\.)?crtbegin)\", opts);\n 1416 |   static std::regex re2(R\"((?:clang_rt\\.)?crtend)\", opts);\n 1417 |   static std::regex re3(R\"(\\.(\\d+)$)\", opts);\n 1418 | \n 1419 |   // crtbegin.o and crtend.o contain marker symbols such as\n 1420 |   // __CTOR_LIST__ or __DTOR_LIST__. So they have to be at the\n 1421 |   // beginning or end of the section.\n 1422 |   if (std::regex_search(isec->file.filename, re1))\n 1423 |     return -2;\n 1424 |   if (std::regex_search(isec->file.filename, re2))\n 1425 |     return 65536;\n 1426 | \n 1427 |   std::string_view name = isec->name();\n 1428 |   std::cmatch m;\n 1429 |   if (std::regex_search(name.data(), name.data() + name.size(), m, re3))\n 1430 |     return std::stoi(m[1]);\n 1431 |   return -1;\n 1432 | }","lines":31,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/passes.cc#L1402-L1432"}]},{"id":"PERF_24","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`copy_chunks()` builds a `std::string` for every chunk purely to name a\ntimer, and `create_output_symtab()` builds a `std::string` per thunk\n(`\"thunk\" + std::to_string(n++)`) even when `--strip-all`-style output means\nthe name is never emitted. The former allocates once per output chunk on the\nhot copy path and the timer records are kept alive in\n`ctx.timer_records` even when `--perf` is not given.","fix":"Only construct the sub-timer when `ctx.arg.perf` is set (or make `Timer` take a `std::string_view` and store the chunk name), ulty":"medium","description":"`AhoCorasick::add()` encodes begin/end-of-string markers (`\"foo\"` → `\"\\0foo\\0\"`, `\"*foo\"` →\n`\"foo\\0\"`, `\"foo*\"` → `\"\\0foo\"`), and `AhoCorasick::find()` correspondingly calls `walk('\\0')`\nbefore and after the input. None of the marker branches can ever be taken from the only caller:\n`Glob::add()` routes exact patterns to `exacts`, `foo*` to `prefixes` and `*foo` to `suffixes`\n*before* consulting `AhoCorasick::can_handle()`, so the automaton only ever receives patterns of\nthe form `*foo*`, for which both `pat.starts_with('*')` and `pat.ends_with('*')` are true. The two\n`walk('\\0')` calls in `find()` are therefore pure overhead on every query, and the marker logic is\nuntested dead code.","fix":"Either delete the marker handling and the two `walk('\\0')` calls (documenting that `AhoCorasick`\ndoes substring matching only), or route exact/prefix/suffix patterns through it as well so the\ncode is exercised. If the markers are kept for generality, add a unit test that feeds `add(\"foo\")`\nand `add(\"foo*\")` directly.","locations":[{"ref":"lib/aho-corasick.cc:93-107","code":"   93 |   // We handle \"foo\" as if \"\\0foo\\0\", \"*foo\" as if \"foo\\0\", \"foo*\" as\n   94 |   // if \"\\0foo\", and \"*foo*\" as if \"foo\". Aho-Corasick can do only\n   95 |   // substring matching, so we use \\0 as a beginning/end-of-string\n   96 |   // markers.\n   97 |   if (!pat.starts_with('*'))\n   98 |     walk('\\0');\n   99 |   for (u8 c : pat)\n  100 |     if (c != '*')\n  101 |       walk(c);\n  102 |   if (!pat.ends_with('*'))\n  103 |     walk('\\0');\n  104 | \n  105 |   nodes[idx].value = std::max(nodes[idx].value, val);\n  106 |   return true;\n  107 | }","lines":15,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/lib/aho-corasick.cc#L93-L107"},{"ref":"lib/aho-corasick.cc:76-80","code":"   76 |   walk('\\0');\n   77 |   for (u8 c : str)\n   78 |     walk(c);\n   79 |   walk('\\0');\n r to function symbols instead of .opd.\n```","locations":[{"ref":"src/arch-ppc64v1.cc:596","code":"  596 |     // Rewrite relocations so that they directly refer to .opd.","lines":1,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/arch-ppc64v1.cc#L596"}]},{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The help text documents `-z nodefs` as the counterpart of `-z defs`, but the parser\nimplements `-z undefs` instead; `-z nodefs` falls through to the catch-all branch and is\nmerely warned about and ignored. Conversely the implemented `-z undefs` is not documented\nanywhere. A build that relies on the documented `-z nodefs` to suppress undefined-symbol\nerrors keeps failing the link.","fix":"Accept both: `} else if (read_z_flag(\"undefs\") || read_z_flag(\"nodefs\")) {`, and document\n`-z undefs` in `helpmsg`.","locations":[{"ref":"src/cmdline.cc:200-201","code":"  200 |   -z defs                     Report undefined symbols (even with --shared)\n  201 |     -z nodefs","lines":2,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/cmdline.cc#L200-L201"},{"ref":"src/cmdline.cc:1190-1193","code":" 1190 |     } else if (read_z_flag(\"defs\") || read_flag(\"no-undefined\")) {\n 1191 |       report_undefined = true;\n 1192 |     } else if (read_z_flag(\"undefs\")) {\n 1193 |       report_undefined = false;","lines":4,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/cmdline.cc#L1190-L1193"}]},{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The help text documents `-z start_stop_visibility=[hidden,protected]` with underscores, but\nthe parser only accepts the hyphenated `-z start-stop-visibility=...`. A user copying the\ndocumented spelling gets \"unknown command line option\" (a warning, so the symbol visibility\nsilently stays at the default).","fix":"```\n-  -z start_stop_visibility=[hidden,protected]\n+  -z start-stop-visibility=[hidden,protected]\n```\nor accept both spellings in `read_z_flag`.","locations":[{"ref":"src/cmdline.cc:223-224","code":"  223 |   -z start_stop_visibility=[hidden,protected]\n  224 |                               Specify symbol visibility for \"__start_SECNAME\" and \"__stop_SECNAME\" symbols","lines":2,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/cmdline.cc#L223-L224"},{"ref":"src/cmdline.cc:1180-1183","code":" 1180 |     } else if (read_z_flag(\"start-stop-visibility=protected\")) {\n 1181 |       ctx.arg.z_start_stop_visibility_protected = true;\n 1182 |     } else if (read_z_flag(\"start-stop-visibility=hidden\")) {\n 1183 |       ctx.arg.z_start_stop_visibility_protected = false;","lines":4,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/cmdline.cc#L1180-L1183"}]},{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The \"supported targets\" line of the help text lists `elf64-powerpc` twice (a copy-paste slip -\nthe second one was presumably meant to be the ELFv2 name, which is already spelled\n`elf64-powerpcle`). Output of `mold --help` is user-visible documentation.","fix":"```\n-mold: supported targets: ... elf32-powerpc elf64-powerpc elf64-powerpc elf64-powerpcle ...\n+mold: supported targets: ... elf32-powerpc elf64-powerpc elf64-powerpcle ...\n```","locations":[{"ref":"src/cmdline.cc:239-239","code":"  239 | mold: supported targets: elf32-i386 elf64-x86-64 elf32-littlearm elf64-littleaarch64 elf64-bigaarch64 elf32-littleriscv elf32-bigriscv elf64-littleriscv elf64-bigriscv elf32-powerpc elf64-powerpc elf64-powerpc elf64-powerpcle elf64-s390 elf64-sparc elf32-m68k elf32-sh-linux elf64-loongarch elf32-loongarch","lines":1,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/cmdline.cc#L239"}]},{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"Several accepted options are missing from `helpmsg`, so `--help` under-documents mold:\n`--section-order`, `--section-align`, `--filler`, `--physical-image-base`, `--start-stop`,\n`--discard-section`/`--no-discard-section`, `--print-dependencies`,\n`--relocatable-merge-sections`, `--default-symver`, `--be8`/`--be32`, `-z ibt`, `-z shstk`,\n`-z cet-report=...`, `-z undefs`, `-z x86-64-v{2,3,4}`, `-z dynamic-undefined-weak`. In the\nopposite direction, `-V` and the \"supported emulations\" line omit `armelfb_linux_eabi` and\n`elf32ppclinux`, both of which the `-m` handler accepts.","fix":"Add the missing entries to `helpmsg` and to the `-V` emulation list, and add a test that\ndiffs the option names matched by `read_flag`/`read_arg`/`read_z_flag` against the help text\nso the two cannot drift apart again.","locations":[{"ref":"src/cmdline.cc:792-801","code":"  792 |     } else if (read_flag(\"V\")) {\n  793 |       Out(ctx) << mold_version\n  794 |                << \"\\n  Supported emulations:\\n   elf_x86_64\\n   elf_i386\\n\"\n  795 |                << \"   aarch64elf\\n   aarch64linux\\n   aarch64elfb\\n\"\n  796 |                << \"   aarch64linuxb\\n   armelf_linux_eabi\\n   elf64lriscv\\n\"\n  797 |                << \"   elf64briscv\\n   elf32lriscv\\n   elf32briscv\\n\"\n  798 |                << \"   elf32ppc\\n   elf64ppc\\n   elf64lppc\\n   elf64_s390\\n\"\n  799 |                << \"   elf64_sparc\\n   m68kelf\\n   shlelf_linux\\n\"\n  800 |                << \"   shelf_linux\\n   elf64loongarch\\n   elf32loongarch\";\n  801 |       version_shown = true;","lines":10,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/cmdline.cc#L792-L801"},{"ref":"src/cmdline.cc:1136-1151","code":" 1136 |     } else if (read_arg(\"section-align\")) {\n 1137 |       size_t pos = arg.find('=');\n 1138 |       if (pos == arg.npos || pos == arg.size() - 1)\n 1139 |         Fatal(ctx) << \"--section-align: syntax error: \" << arg;\n 1140 |       i64 value = parse_number(ctx, \"section-align\", arg.substr(pos + 1));\n 1141 |       if (!has_single_bit(value))\n 1142 |         Fatal(ctx) << \"--section-align=\" << arg << \": value must be a power of 2\";\n 1143 |       ctx.arg.section_align[arg.substr(0, pos)] = value;\n 1144 |     } else if (read_arg(\"section-start\")) {\n 1145 |       size_t pos = arg.find('=');\n 1146 |       if (pos == arg.npos || pos == arg.size() - 1)\n 1147 |         Fatal(ctx) << \"--section-start: syntax error: \" << arg;\n 1148 |       ctx.arg.section_start[arg.substr(0, pos)] =\n 1149 |         parse_hex(ctx, \"section-start\", arg.substr(pos + 1));\n 1150 |     } else if (read_arg(\"section-order\")) {\n 1151 |       ctx.arg.section_order = parse_section_order(ctx, arg);","lines":16,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/cmdline.cc#L1136-L1151"},{"ref":"src/cmdline.cc:1249-1258","code":" 1249 |     } else if (read_z_flag(\"x86-64-v2\")) {\n 1250 |       ctx.arg.z_x86_64_isa_level |= GNU_PROPERTY_X86_ISA_1_V2;\n 1251 |     } else if (read_z_flag(\"x86-64-v3\")) {\n 1252 |       ctx.arg.z_x86_64_isa_level |= GNU_PROPERTY_X86_ISA_1_V3;\n 1253 |     } else if (read_z_flag(\"x86-64-v4\")) {\n 1254 |       ctx.arg.z_x86_64_isa_level |= GNU_PROPERTY_X86_ISA_1_V4;\n 1255 |     } else if (read_z_flag(\"rewrite-endbr\")) {\n 1256 |       if constexpr (!is_x86_64<E>)\n 1257 |         Fatal(ctx) << \"-z rewrite-endbr is supported only on x86-64\";\n 1258 |       ctx.arg.z_rewrite_endbr = true;","lines":10,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/cmdline.cc#L1249-L1258"}]},{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The comment says a GCC FAT LTO object \"can be identified by the presence of\n`.gcc.lto_.symtab` section\", but the code checks for `.gnu.lto_.symtab.`\n(different prefix, plus a trailing dot). The comment names a section that does\nnot exist, which will send a reader looking for the wrong thing.","fix":"Replace the comment text `presence of .gcc.lto_.symtab section` with\n`presence of a .gnu.lto_.symtab.* section` so that it matches the\n`name.starts_with(\".gnu.lto_.symtab.\")` test in the code.","locations":[{"ref":"src/filetype.cc:28-36","code":"   28 |     // GCC FAT LTO objects contain both regular ELF sections and GCC-\n   29 |     // specific LTO sections, so that they can be linked as LTO objects if\n   30 |     // the LTO linker plugin is available and falls back as regular\n   31 |     // objects otherwise. GCC FAT LTO object can be identified by the\n   32 |     // presence of `.gcc.lto_.symtab` section.\n   33 |     if (has_gcc_plugin) {\n   34 |       std::string_view name = data + shdrs[shstrtab_idx].sh_offset + sec.sh_name;\n   35 |       if (name.starts_with(\".gnu.lto_.symtab.\"))\n   36 |         return true;","lines":9,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/filetype.cc#L28-L36"}]},{"id":"CMT_7","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The comment says \"As in mark() below\", but the `mark()` lambda it refers to is\ndefined *above* at line 138. The only `mark` below is the file-scope\n`mark(Context&, rootset, start_stop_map)` driver function, which is a different\nthing - so the reference is doubly misleading.","fix":"Change `// As in mark() below, a section added to a feeder has` to\n`// As in the mark() lambda above, a section added to a feeder has`.","locations":[{"ref":"src/gc-sections.cc:180-183","code":"  180 |         // Mark and visit the sections with a nested parallel loop.\n  181 |         // As in mark() below, a section added to a feeder has\n  182 |         // already been marked, so a feeder's loop body must visit\n  183 |         // it unconditionally.","lines":4,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/gc-sections.cc#L180-L183"}]},{"id":"CMT_8","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The `DigestMap` comment claims \"Since the slot index is derived from digest bits\nthat the first word doesn't contain, a successful match effectively compares an\nentire 128-bit digest, so the map is exact\". Neither half of that holds in\ngeneral. The tag is `digest.hi >> 16` and the home index is `digest.hi & mask`;\nwhen `mask` has fewer than 16 bits, bits `[k, 16)` of `digest.hi` are never\ncompared at all. More importantly, on a linear-probing step the slot index no\nlonger encodes the stored digest's low bits, so a match at a probed slot\ncompares only the 48-bit tag plus the 64-bit `lo` - 112 bits, not 128.","fix":"Reword the comment to state the actual guarantee (a match compares the 48-bit\ntag plus the full 64-bit second word, i.e. at least 112 digest bits, which is\nwithin the same hash-collision assumption the rest of ICF relies on), or store\nthe full `digest.hi` in the slot and compare it exactly.","locations":[{"ref":"src/icf.cc:216-230","code":"  216 | //\n  217 | // Each slot consists of two 64-bit words and a section pointer. The\n  218 | // first word packs the round number, a busy bit, and 48 bits of the\n  219 | // digest; the second word holds another 64 bits. An inserter claims a\n  220 | // vacant slot by installing the first word with compare-and-swap with\n  221 | // the busy bit set, writes the second word and the pointer, and then\n  222 | // rewrites the first word with the busy bit cleared to publish the\n  223 | // slot. Since the slot index is derived from digest bits that the\n  224 | // first word doesn't contain, a successful match effectively compares\n  225 | // an entire 128-bit digest, so the map is exact under the same\n  226 | // hash-collision assumption the surrounding algorithm is built on.\n  227 | //\n  228 | // Of all sections inserted with the same digest in the same round, the\n  229 | // slot ends up pointing to the one with the lowest priority, which ICF\n  230 | // uses as the leader of the digest's equivalence class.","lines":15,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/icf.cc#L216-L230"}]},{"id":"CMT_9","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The comment above `read_riscv_attributes()` claims the grammar is\n`[ <section-length> \"vendor-name\" <file-tag> <size> <attribute>*]+ ]*`, which\ncontains an unbalanced `]` and does not describe what the code actually does:\nthe code skips a fixed 5 bytes for the file tag *and* the sub-sub-section size\n(`p = p.substr(5)`), and never uses the `<size>` value it skips. The stray\nbracket and the mismatch make it impossible to check the parser against the\ndocumented format.","fix":"Rewrite the grammar comment to match the implementation, e.g.\n```\n// <format-version:1>\n// ( <section-length:4> <vendor-name:NUL-terminated>\n//   ( <tag:1> <sub-section-size:4> <attribute>* )* )*\n```\nand note explicitly that the sub-section size is skipped rather than validated\n(or start validating it).","locations":[{"ref":"src/input-files.cc:184-188","code":"  184 | // <format-version>\n  185 | // [ <section-length> \"vendor-name\" <file-tag> <size> <attribute>*]+ ]*\n  186 | template <is_riscv E>\n  187 | static void read_riscv_attributes(Context<E> &ctx, ObjectFile<E> &file,\n  188 |                                   std::string_view data) {","lines":5,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/input-files.cc#L184-L188"},{"ref":"src/input-files.cc:208-211","code":"  208 |     if (!p.starts_with(ELF_TAG_FILE))\n  209 |       Fatal(ctx) << file << \": corrupted .riscv.attributes section\";\n  210 |     p = p.substr(5); // skip the tag and the sub-sub-section size\n  211 | ","lines":4,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/input-files.cc#L208-L211"}]},{"id":"CMT_10","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The comment on `StrtabSection` says `.strtab` is referenced by `.strtab`. It is\nreferenced by `.symtab` (via `sh_link`); `.strtab` referencing itself is\nmeaningless.","fix":"```cpp\n-// .strtab is referenced by .strtab and contains symbol names. Note that\n+// .strtab is referenced by .symtab and contains symbol names. Note that\n```","locations":[{"ref":"src/mold.h:1064-1067","code":" 1064 | // .strtab is referenced by .strtab and contains symbol names. Note that\n 1065 | // .strtab is not needed at runtime; one can remove the section from an\n 1066 | // ELF file without breaking it. Strings that runtime accesses are stored\n 1067 | // in .dynstr.","lines":4,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mold.h#L1064-L1067"}]},{"id":"CMT_11","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"Both `RelocSection` and `ComdatGroupSection` are documented as being used\n\"only for the reproducible output (i.e. the `-r` output)\". `-r` is\n`--relocatable`, not \"reproducible\" (mold's reproducibility option is\n`--repro`). The same wrong word is duplicated in two places, so a reader\ngrepping for \"reproducible\" is led to the wrong feature.","fix":"In both places:\n\n```cpp\n-// This is used only for the reproducible output (i.e. the `-r` output).\n+// This is used only for the relocatable output (i.e. the `-r` output).\n```","locations":[{"ref":"src/mold.h:1591-1592","code":" 1591 | // RelocSection represents a relocation table for an output file.\n 1592 | // This is used only for the reproducible output (i.e. the `-r` output).","lines":2,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mold.h#L1591-L1592"},{"ref":"src/mold.h:1622-1623","code":" 1622 | // ComdatGroupSection represents a comdat group for an output file.\n 1623 | // This is used only for the reproducible output (i.e. the `-r` output).","lines":2,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mold.h#L1622-L1623"}]},{"id":"CMT_12","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"`Symbol<E>::sym_idx` is documented as \"Index into the symbol table of the owner\nfile\", but during COMDAT selection `record_comdat_owner()` deliberately\nrepurposes it, via `std::atomic_ref<i32>`, to hold the *file priority* of the\nwinning COMDAT owner, and only restores it to `-1` afterwards\n(`src/passes.cc:318-372`). This matters because `Symbol<E>::esym()`\n(`src/mold.h:3973-3979`) unconditionally does `file->elf_syms[sym_idx]`; any\ncall to `esym()`, `name()` or `get_type()` between\n`record_comdat_owner()` and the `sym.sym_idx = -1` restore reads out of bounds.\nThe header gives no hint that this window exists.","fix":"Either document the temporary reuse next to the member, or (better) stop\noverloading the field: give `Symbol` a dedicated `Atomic<i32> comdat_owner`\nonly in the COMDAT path, or key the ownership map on the signature symbol\npointer in a side table owned by `parse_input_sections()`.","locations":[{"ref":"src/mold.h:3031-3033","code":" 3031 | \n 3032 |   // Index into the symbol table of the owner file.\n 3033 |   i32 sym_idx = -1;","lines":3,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/mold.h#L3031-L3033"},{"ref":"src/mold.h:3973-3979","code":" 3973 | template <typename E>\n 3974 | inline const ElfSym<E> &Symbol<E>::esym() const {\n 3975 |   static const ElfSym<E> empty =  32; i++) {\n   19 |     x = std::rotl(x, 1);\n   20 |     x ^= (x & 1) * (poly << 1);\n   21 |   }","lines":14,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/lib/crc32.cc#L8-L21"},{"ref":"lib/lib.h:207-217","code":"  207 | // Some C++ libraries haven't implemented std::has_single_bit yet.\n  208 | inline bool has_single_bit(u64 val) {\n  209 |   return std::popcount(val) == 1;\n  210 | }\n  211 | \n  212 | // Some C++ libraries haven't implemented std::bit_ceil yet.\n  213 | inline u64 bit_ceil(u64 val) {\n  214 |   if (has_single_bit(val))\n  215 |     return val;\n  216 |   return 1LL << (64 - std::countl_zero(val));\n  217 | }","lines":11,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/lib/lib.h#L207-L217"},{"ref":"src/arch-arm32.cc:672-674","code":"  672 |   // TLS trampoline code. ARM32's TLSDESC is designed so that this\n  673 |   // common piece of code is factored out from object files to reduce\n  674 |   // output size. Since no one provide, the linker has to synthesize it.","lines":3,"link":"https://github.com/rui314/mold/blob/c340272e6376f9a8e5b5cd6f6634f925f6d54e5c/src/arch-arm32.cc#L672-L674"},{"ref":"src/arch-arm32.cc:758-781","code":"  758 | // ARM executables use an .ARM.exidx section to look up an exception\n  759 | // handling record for the current instruction pointer. The table needs\n  760 | // to be sorted by their addresses.\n  761 | //\n  762 | // Other target uses .eh_frame_hdr instead for the same purpose.\n  763 | // I don't know why only ARM uses the different mechanism, but it's\n  764 | // likely that it's due to some historical reason.\n  765 | //\n  766 | // This function returns contents of .ARM.exidx.\n  767 | template <>\n  768 | std::vector<u8> Arm32ExidxSection<E>::get_contents(Context<E> &ctx) {\n  769 |   // .ARM.exidx records consists of a signed 31-bit relative address\n  770 |   // and a 32-bit value. The relative address indicates the start\n  771
