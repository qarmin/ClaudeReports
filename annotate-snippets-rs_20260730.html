<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

<script type="application/json" id="D">[{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`render_short_message` unconditionally requires the first `Group` to have a `Title` and aborts the process otherwise: `let Some(title) = &group.title else { panic!(\"Expected a Title\") };`. A title-less group is perfectly legal public API - `Group::with_level(Level::ERROR)` sets `title: None` (see `Group::with_level` in `src/snippet.rs`), and `Renderer::short_message(true)` is also public. Verified by running:\n\n```rust\nlet r = Renderer::plain().short_message(true);\nlet g = [Group::with_level(Level::ERROR).element(Level::NOTE.message(\"hi\"))];\nr.render(&g); // thread 'main' panicked at src/renderer/render.rs:241:9: Expected a Title\n```\n\nThe non-short path (`render` / `pre_process`) handles `group.title == None` gracefully (`if let Some(title) = &group.title`), so this is an inconsistency between the two rendering modes, not a documented precondition.","fix":"Degrade gracefully instead of panicking. Either fall back to the group's `primary_level` with an empty text, or skip the title portion entirely, e.g.:\n\n```rust\nif let Some(title) = &group.title {\n    render_title(renderer, &mut buffer, title, 0, TitleStyle::MainHeader, false, 0);\n}\n```\n\nand use `group.primary_level` for the final `buffer.render(...)` call instead of `title.level`. If a title truly is a hard precondition, it must be documented on `Renderer::short_message` and on `Group::with_level`.","locations":[{"ref":"src/renderer/render.rs:240-242","code":"  240 |     let Some(title) = &group.title else {\n  241 |         panic!(\"Expected a Title\");\n  242 |     };","lines":3,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/render.rs#L240-L242"}]},{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`span_to_locations` slices the line with raw byte arithmetic: `start_info.line[0..(span.start - start_info.start_byte).min(start_info.line.len())]` and the mirrored `end_info.line[0..(span.end - end_info.start_byte).min(end_info.line.len())]`. If the caller passes a byte offset that is not a UTF-8 char boundary, `str` indexing panics with `byte index N is not a char boundary`. This is reachable from the public API and is *not* caught by the range validation in `annotated_lines` / `splice_lines`, which only rejects `span.end > source_len + 1`. Verified against the built crate:\n```rust\n// panics: \"end byte index 10 is not a char boundary; it is inside 'é' (bytes 9..11 of string)\"\nSnippet::source(\"let x = \\\"é\\\";\").annotation(AnnotationKind::Primary.span(9..10))\n// panics: \"end byte index 2 is not a char boundary; it is inside 'é' (bytes 1..3 of string)\"\nSnippet::source(\"aé\\nbb\").annotation(AnnotationKind::Primary.span(0..2))\n```\nNote the inconsistency with `span_to_snippet`, which uses `self.source.get(span)` and returns `None` for the exact same input instead of panicking.","fix":"Do not index with an unvalidated offset. Either round the offset to the nearest char boundary, or validate up front and panic with a descriptive message like the existing `Annotation range ... is beyond the end of buffer ...` check. E.g. replace the slicing with a `char_indices`-driven walk that stops once the accumulated byte offset reaches the target:\n```rust\nlet target = (span.start - start_info.start_byte).min(start_info.line.len());\nlet (mut start_char_pos, start_display_pos) = start_info\n    .line\n    .char_indices()\n    .take_while(|(i, _)| *i < target)\n    .fold((0, 0), |(char_pos, display_pos), (_, c)| (char_pos + 1, display_pos + char_width(c)));\n```\nand add an explicit `assert!(source.is_char_boundary(span.start) && source.is_char_boundary(span.end), ...)` in `annotated_lines` and `splice_lines` next to the existing range check so the failure mode is a clear contract violation rather than an internal slicing panic.","locations":[{"ref":"src/renderer/source_map.rs:64-76","code":"   64 |     pub(crate) fn span_to_locations(&self, span: Range<usize>) -> (Loc, Loc) {\n   65 |         let start_info = self\n   66 |             .lines\n   67 |             .iter()\n   68 |             .find(|info| span.start >= info.start_byte && span.start < info.end_byte)\n   69 |             .unwrap_or(self.lines.last().unwrap());\n   70 |         let (mut start_char_pos, start_display_pos) = start_info.line\n   71 |             [0..(span.start - start_info.start_byte).min(start_info.line.len())]\n   72 |             .chars()\n   73 |             .fold((0, 0), |(char_pos, byte_pos), c| {\n   74 |                 let display = char_width(c);\n   75 |                 (char_pos + 1, byte_pos + display)\n   76 |             });","lines":13,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/source_map.rs#L64-L76"},{"ref":"src/renderer/source_map.rs:92-103","code":"   92 |         let end_info = self\n   93 |             .lines\n   94 |             .iter()\n   95 |             .find(|info| span.end >= info.start_byte && span.end < info.end_byte)\n   96 |             .unwrap_or(self.lines.last().unwrap());\n   97 |         let (end_char_pos, end_display_pos) = end_info.line\n   98 |             [0..(span.end - end_info.start_byte).min(end_info.line.len())]\n   99 |             .chars()\n  100 |             .fold((0, 0), |(char_pos, byte_pos), c| {\n  101 |                 let display = char_width(c);\n  102 |                 (char_pos + 1, byte_pos + display)\n  103 |             });","lines":12,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/source_map.rs#L92-L103"},{"ref":"src/renderer/source_map.rs:119-121","code":"  119 |     pub(crate) fn span_to_snippet(&self, span: Range<usize>) -> Option<&str> {\n  120 |         self.source.get(span)\n  121 |     }","lines":3,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/source_map.rs#L119-L121"}]},{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"Nothing in `AnnotationKind::span` rejects an inverted range (`span.start > span.end`), and the renderer assumes `start <= end`. Verified: `Snippet::source(\"hello world\").annotation(AnnotationKind::Primary.span(5..2))` panics with `attempt to subtract with overflow` at `src/renderer/render.rs:1399` (`let width = annotation.end.display - annotation.start.display;`) in debug builds. With overflow checks off the subtraction wraps and the annotation is silently dropped from the output (verified: the caret row is rendered empty), i.e. a wrong diagnostic instead of a crash. `Range<usize>` cannot express this invariant, so it has to be checked.","fix":"Normalize the range in `AnnotationKind::span` before storing it, e.g.\n```rust\npub fn span<'a>(self, span: Range<usize>) -> Annotation<'a> {\n    let span = if span.start > span.end { span.end..span.start } else { span };\n    Annotation { span, label: None, kind: self, highlight_source: false }\n}\n```\n(or `debug_assert!(span.start <= span.end)` plus a documented `# Panics` section), and defensively use `saturating_sub` at `src/renderer/render.rs:1399`.","locations":[{"ref":"src/snippet.rs:394-403","code":"  394 | impl AnnotationKind {\n  395 |     /// Annotate a byte span within [`Snippet`]\n  396 |     pub fn span<'a>(self, span: Range<usize>) -> Annotation<'a> {\n  397 |         Annotation {\n  398 |             span,\n  399 |             label: None,\n  400 |             kind: self,\n  401 |             highlight_source: false,\n  402 |         }\n  403 |     }","lines":10,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/snippet.rs#L394-L403"},{"ref":"src/renderer/render.rs:1399","code":" 1399 |         let width = annotation.end.display - annotation.start.display;","lines":1,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/render.rs#L1399"}]},{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`AnnotationKind::span` accepts any `Range<usize>` without checking that the endpoints fall on UTF-8 character boundaries of the `Snippet`'s source. During rendering, `SourceMap::span_to_locations` slices the line with `start_info.line[0..(span.start - start_info.start_byte).min(start_info.line.len())]`, which panics on a non-boundary index. Verified: rendering `Snippet::source(\"héllo world\").annotation(AnnotationKind::Primary.span(2..5))` aborts with `end byte index 2 is not a char boundary; it is inside 'é' (bytes 1..3 of string)` from `src/renderer/source_map.rs:71`. The same happens through `Patch::new`. Any tool that computes byte offsets from a different source of truth (a lexer over a re-encoded buffer, a byte-oriented diff, a `#[cfg]`-stripped copy of the file) can crash the whole diagnostic renderer with a user-visible process abort (`panic = \"abort\"` is set for both profiles in `Cargo.toml`).","fix":"Either validate in the constructors or degrade gracefully in the renderer. Cheapest robust fix is in `SourceMap::span_to_locations`: replace the panicking index expressions with a boundary-safe lookup, e.g.\n```rust\nlet offset = (span.start - start_info.start_byte).min(start_info.line.len());\nlet prefix = start_info\n    .line\n    .get(0..offset)\n    .unwrap_or_else(|| &start_info.line[0..floor_char_boundary(start_info.line, offset)]);\n```\nand do the same for the `span.end` slice. Additionally document the requirement on `AnnotationKind::span` and `Patch::new` with a `# Panics` section, or snap the incoming `Range` to char boundaries there using `str::is_char_boundary`.","locations":[{"ref":"src/snippet.rs:394-403","code":"  394 | impl AnnotationKind {\n  395 |     /// Annotate a byte span within [`Snippet`]\n  396 |     pub fn span<'a>(self, span: Range<usize>) -> Annotation<'a> {\n  397 |         Annotation {\n  398 |             span,\n  399 |             label: None,\n  400 |             kind: self,\n  401 |             highlight_source: false,\n  402 |         }\n  403 |     }","lines":10,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/snippet.rs#L394-L403"},{"ref":"src/snippet.rs:438-443","code":"  438 |     pub fn new(span: Range<usize>, replacement: impl Into<Cow<'a, str>>) -> Self {\n  439 |         Self {\n  440 |             span,\n  441 |             replacement: replacement.into(),\n  442 |         }\n  443 |     }","lines":6,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/snippet.rs#L438-L443"},{"ref":"src/renderer/source_map.rs:64-103","code":"   64 |     pub(crate) fn span_to_locations(&self, span: Range<usize>) -> (Loc, Loc) {\n   65 |         let start_info = self\n   66 |             .lines\n   67 |             .iter()\n   68 |             .find(|info| span.start >= info.start_byte && span.start < info.end_byte)\n   69 |             .unwrap_or(self.lines.last().unwrap());\n   70 |         let (mut start_char_pos, start_display_pos) = start_info.line\n   71 |             [0..(span.start - start_info.start_byte).min(start_info.line.len())]\n   72 |             .chars()\n   73 |             .fold((0, 0), |(char_pos, byte_pos), c| {\n   74 |                 let display = char_width(c);\n   75 |                 (char_pos + 1, byte_pos + display)\n   76 |             });\n   77 |         // correct the char pos if we are highlighting the end of a line\n   78 |         if (span.start - start_info.start_byte).saturating_sub(start_info.line.len()) > 0 {\n   79 |             start_char_pos += 1;\n   80 |         }\n   81 |         let start = Loc {\n    if start > self.lines[line].len() || end > self.lines[line].len() {\n  125 |             return;\n  126 |         };","lines":9,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/styled_buffer.rs#L118-L126"}]},{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"In `splice_lines`, the substitution highlight start/end are computed as `(cur_lo.char as isize + acc) as usize`. `acc` is a signed accumulator that goes negative when a patch deletes more than it inserts. The code assumes patch spans are disjoint (see the `Assumption: all spans are in the same file, and all spans are disjoint` comment), but that assumption is never validated, so `cur_lo.char as isize + acc` can be negative and the `as usize` cast silently wraps to a value near `usize::MAX`. `SubstitutionHighlight { start, end }` then carries garbage into `style_substitution_highlights`, which does `max_line_num_len + 3 + start + extra_width_start` and panics. Verified against the built crate:\n```rust\nSnippet::source(\"abcdefghij\\n\")\n    .patch(Patch::new(0..8, \"\"))     // acc becomes -8\n    .patch(Patch::new(2..4, \"XY\"))   // cur_lo.char == 2 -> 2 + (-8) == -6 -> huge usize\n// thread 'main' panicked at src/renderer/render.rs:1944:17: attempt to add with overflow\n```\nIn release builds this wraps instead and produces a wildly out-of-range style range.","fix":"Clamp instead of casting blind, and reject/normalise overlapping patches. Minimally:\n```rust\nlet start = usize::try_from(cur_lo.char as isize + acc).unwrap_or(0);\nlet end = usize::try_from(cur_lo.char as isize + acc + len).unwrap_or(0);\nline_highlight.push(SubstitutionHighlight { start, end });\n```\nBetter: after `patches.sort_by_key(|p| p.span.start)`, verify the disjointness invariant the code already documents (e.g. `debug_assert!(windows.all(|w| w[0].span.end <= w[1].span.start))`) and either panic with a clear message or drop/merge overlapping patches.","locations":[{"ref":"src/renderer/source_map.rs:484-505","code":"  484 |             let len: isize = part\n  485 |                 .replacement\n  486 |                 .split('\\n')\n  487 |                 .next()\n  488 |                 .unwrap_or(&part.replacement)\n  489 |                 .chars()\n  490 |                 .map(|c| match c {\n  491 |                     '\\t' => 4,\n  492 |                     _ => 1,\n  493 |                 })\n  494 |                 .sum();\n  495 |             line_highlight.push(SubstitutionHighlight {\n  496 |                 start: (cur_lo.char as isize + acc) as usize,\n  497 |                 end: (cur_lo.char as isize + acc + len) as usize,\n  498 |             });\n  499 |             buf.push_str(&part.replacement);\n  500 |             // Account for the difference between the width of the current code and the\n  501 |             // snippet being suggested, so that the *later* suggestions are correctly\n  502 |             // aligned on the screen. Note that cur_hi and cur_lo can be on different\n  503 |             // lines, so cur_hi.col can be smaller than cur_lo.col\n  504 |             acc += len - (cur_hi.char as isize - cur_lo.char as isize);\n  505 |             prev_hi = cur_hi;","lines":22,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/source_map.rs#L484-L505"}]},{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"very_easy","description":"`margin.term_width * 2` overflows for large `term_width` values, panicking in debug builds\n(\"attempt to multiply with overflow\") and wrapping in release builds. `term_width` comes straight\nfrom the public `Renderer::term_width()` setter (`column_width = renderer.term_width.saturating_sub(code_offset)`\nin `render_snippet_annotations`), so any caller passing a very large `usize` crashes the renderer.\nVerified: `Renderer::plain().term_width(usize::MAX).render(&report)` panics at this exact line.","fix":"Use a saturating multiplication.\n\nBefore:\n```rust\nif width > margin.term_width * 2 && width > (MIN_PAD * 2 + margin_width) {\n```\nAfter:\n```rust\nif width > margin.term_width.saturating_mul(2) && width > (MIN_PAD * 2 + margin_width) {\n```","locations":[{"ref":"src/renderer/render.rs:1401-1403","code":" 1401 |         static MIN_PAD: usize = 5;\n 1402 |         let margin_width = str_width(renderer.decor_style.margin());\n 1403 |         if width > margin.term_width * 2 && width > (MIN_PAD * 2 + margin_width) {","lines":3,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/render.rs#L1401-L1403"}]},{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`let line_end = ann.end.line - 1;` subtracts without any guard. `Loc::line` is `line_start + idx`, and `line_start` is fully caller-controlled through `Snippet::line_start` (it is a plain `usize`, so `0` is accepted). A multiline annotation whose `span.start > span.end` produces `lo.line > hi.line`; combined with `line_start(0)` this yields `ann.end.line == 0` and the subtraction underflows. Verified against the built crate:\n```rust\nSnippet::source(\"aaa\\nbbb\\nccc\\n\").line_start(0).annotation(AnnotationKind::Primary.span(8..1))\n// thread 'main' panicked: attempt to subtract with overflow\n```\nIn release builds this wraps to `usize::MAX`, and `middle < line_end` then becomes true, so `add_annotation_to_file` is called with `usize::MAX` and hits its `.unwrap()` on the line lookup. Note also that neither `annotated_lines` nor `splice_lines` validates `span.start <= span.end`; only `span.end` is bounds-checked.","fix":"Use `ann.end.line.saturating_sub(1)` (matching the defensive `saturating_sub` already used in `MultilineAnnotation::as_end` s are disabled, producing a line number of `0` for the second line). At the other end, `line_start(0)` is accepted and renders 0-based gutter numbers and origins such as `f.rs:0:1`, even though every other part of the API treats line numbers as 1-based (the default is `1`, and `Loc::line` is documented as \"The (1-based) line number\").","fix":"Clamp and document in the setter:\n```rust\npub fn line_start(mut self, line_start: usize) -> Self {\n    self.line_start = line_start.max(1);\n    self\n}\n```\nand use `line_start.saturating_add(idx)` in `SourceMap::new`, so an absurd `line_start` produces saturated line numbers rather than a panic or a wrapped `0`.","locations":[{"ref":"src/snippet.rs:253-258","code":"  253 |     /// When manually [`fold`][Self::fold]ing,\n  254 |     /// the [`source`][Self::source]s line offset from the original start\n  255 |     pub fn line_start(mut self, line_start: usize) -> Self {\n  256 |         self.line_start = line_start;\n  257 |         self\n  258 |     }","lines":6,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/snippet.rs#L253-L258"},{"ref":"src/renderer/source_map.rs:41-49","code":"   41 |             mapping.push(LineInfo {\n   42 |                 line,\n   43 |                 line_index: line_start + idx,\n   44 |                 start_byte: line_range.start,\n   45 |                 end_byte: line_range.end + end_line_size,\n   46 |                 end_line_size,\n   47 |             });\n   48 | \n   49 |             current_index += line_length + end_line_size;","lines":9,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/source_map.rs#L41-L49"},{"ref":"src/renderer/source_map.rs:649-652","code":"  649 | pub(crate) struct Loc {\n  650 |     /// The (1-based) line number.\n  651 |     pub(crate) line: usize,\n  652 |     /// The (0-based) column offset.","lines":4,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/source_map.rs#L649-L652"}]},{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`Margin::compute` mixes checked and unchecked arithmetic on `usize`. Lines 74 and 106 correctly use `saturating_sub`, but the two `else if` guards and the padding computations use plain `-`:\n`self.label_right - self.span_left` (twice) and `self.span_right - self.span_left` (twice). These only avoid underflow because of a non-local invariant in `render.rs`: `span_left_margin` is a `min` over `ann.start.display`/`ann.end.display` and `label_right_margin` / `span_right_margin` are `max`es over the *same* annotation set, so `span_left <= label_right` and `span_left <= span_right` happen to hold. Nothing in `margin.rs` documents or enforces that, and `new()` biases the three values in *opposite* directions (`span_left` is `-ELLIPSIS_PASSING`, the other two `+ELLIPSIS_PASSING`), which makes the invariant easy to break with any future change to how the margins are gathered - the result would be a release-mode wraparound to a near-`usize::MAX` width rather than a clean panic.","fix":"Use `saturating_sub` consistently, matching the rest of the file:\n```rust\n} else if self.label_right.saturating_sub(self.span_left) <= self.term_width {\n    let padding_left = (self.term_width - self.label_right.saturating_sub(self.span_left)) / 2;\n    ...\n} else if self.span_right.saturating_sub(self.span_left) <= self.term_width {\n    let padding_left = (self.term_width - self.span_right.saturating_sub(self.span_left)) / 5 * 2;\n```\nand add a `debug_assert!(self.span_left <= self.span_right && self.span_left <= self.label_right);` at the top of `compute` so the invariant is documented and checked.","locations":[{"ref":"src/renderer/margin.rs:83-92","code":"   83 |             } else if self.label_right - self.span_left <= self.term_width {\n n, ann.start.display);\n  669 |             span_right_margin = max(span_right_margin, ann.end.display);\n  670 |             // FIXME: account for labels not in the same line\n  671 |             let label_right = ann.label.as_ref().map_or(0, |l| str_width(l) + 1);\n  672 |             label_right_margin = max(label_right_margin, ann.end.display + label_right);\n  673 |         }","lines":25,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/render.rs#L649-L673"}]},{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"`annotation.end.display - annotation.start.display` is a raw subtraction, while\n`LineAnnotation::len()` computes exactly the same quantity with `abs_diff` and an explicit comment\n(\"Account for usize underflows\"). One of the two is wrong: if the underflow the helper guards\nagainst is really possible, this line panics in debug builds and produces a gigantic `width` (which\nthen enters the trimming branch and calls `buffer.replace` with absurd columns) in release builds.","fix":"Reuse the helper that already handles this.\n\nBefore:\n```rust\nlet width = annotation.end.display - annotation.start.display;\n```\nAfter:\n```rust\nlet width = annotation.len();\n```","locations":[{"ref":"src/renderer/render.rs:1396-1399","code":" 1396 |         let LineAnnotationType::Singleline = annotation.annotation_type else {\n 1397 |             continue;\n 1398 |         };\n 1399 |         let width = annotation.end.display - annotation.start.display;","lines":4,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/render.rs#L1396-L1399"}]},{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`Level::with_name` documents a hard guarantee that is not implemented:\n\n> Text passed to this function is considered \"untrusted input\", as such all text is passed\n> through a normalization function. Pre-styled text is not allowed to be passed to this function.\n\n`with_name` merely stores `name.into().0` verbatim into `Level::name`. `Level::as_str` returns\nthat raw `Cow` unchanged, and the renderer appends it directly with\n`buffer.append(buffer_msg_line_offset, title.level().as_str(), label_style)` -\n`normalize_whitespace` is never called on it anywhere in the crate (`grep` for\n`normalize_whitespace` shows it is only applied to `title.text()` and to source lines).\n\nContrast this with `Level::primary_title`, whose identical doc-warning *is* honoured\n(`render.rs` picks `normalize_whitespace(title.text())` when `allows_styling` is `false`).\n\nVerified by running against the crate:\n\n```rust\nlet evil = \"ev\\u{202e}il\\u{1b}[31m\\ttab\";\nlet report = &[Group::with_title(Level::ERROR.with_name(Some(evil)).primary_title(\"boom\"))];\nprintln!(\"{:?}\", Renderer::plain().render(report));\n// RAW BYTES: \"ev\\u{202e}il\\u{1b}[31m\\ttab: boom\"\n```\n\nThe raw RTL-override `U+202E`, a raw `ESC` (`\\u{1b}`) starting an ANSI sequence, and a raw tab\nall reach the output - even from `Renderer::plain()`, which is documented as \"No terminal\nstyling\". A caller that trusts the doc-comment and feeds a level name derived from user data\n(a lint name from a config file, a diagnostic category from a network response) gets terminal\nescape / bidi injection, which is exactly the attack class `OUTPUT_REPLACEMENTS` exists to stop.","fix":"Either normalize in `with_name`:\n\n```rust\npub fn with_name(self, name: impl Into<OptionCow<'a>>) -> Level<'a> {\n    Level {\n        name: Some(name.into().0.map(|n| match crate::renderer::normalize_whitespace(&n) {\n            Cow::Borrowed(_) => n,\n            Cow::Owned(owned) => Cow::Owned(owned),\n        })),\n        level: self.level,\n    }\n}\n```\n\nor normalize at the single render site (`render.rs:356`) with\n`&normalize_whitespace(title.level().as_str())`. If normalization is intentionally *not*\nperformed, delete the `<div class=\"warning\">` block from the `with_name` doc-comment instead,\nso callers do not rely on a guarantee the crate does not provide.","locations":[{"ref":"src/level.rs:148-170","code":"  148 |     /// Replace the name describing this [`Level`]\n  149 |     ///\n  150 |     /// <div class=\"warning\">\n  151 |     ///\n  152 |     /// Text passed to this function is considered \"untrusted input\", as such\n  153 |     /// all text is passed through a normalization function. Pre-styled text is\n  154 |     /// not allowed to be passed to this function.\n  155 |     ///\n  156 |     /// <\/div>\n  157 |     ///\n  158 |     /// # Example\n  159 |     ///\n  160 |     /// ```rust\n  161 |     /// # #[allow(clippy::needless_doctest_main)]\n  162 |     #[doc = include_str!(\"../examples/custom_level.rs\")]\n  163 |     /// ```\n  164 |     #[doc = include_str!(\"../examples/custom_level.svg\")]\n  165 |     pub fn with_name(self, name: impl Into<OptionCow<'a>>) -> Level<'a> {\n  166 |         Level {\n  167 |             name: Some(name.into().0),\n  168 |             level: self.level,\n  169 |         }\n  170 |     }","lines":23,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/level.rs#L148-L170"},{"ref":"src/renderer/render.rs:355-357","code":"  355 |     if title.level().name != Some(None) {\n  356 |         buffer.append(buffer_msg_line_offset, title.level().as_str(), label_style);\n  357 |         label_width += title.level().as_str().len();","lines":3,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/render.rs#L355-L357"}]},{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`span_to_lines` uses `if end < line_info.start_byte { break; }` to decide where the span stops. Because `end` is *exclusive*, a span that ends exactly at the first byte of the next line (i.e. a span that includes a trailing `\\n`) satisfies `end == line_info.start_byte`, so the following, completely untouched line is included in the result. `render.rs` feeds this list into `draw_code_line` as `file_lines`, where every element but the last is emitted as a `N - <line>` removal row, so an unrelated line is rendered as deleted. Verified against the built crate:\n```rust\nSnippet::source(\"aaa\\nbbb\\nccc\\n\").patch(Patch::new(0..4, \"xxx\\n\"))\n```\nrenders\n```\n1 - aaa\n2 - bbb      <-- line 2 is not touched by the patch\n1 + xxx\n```","fix":"Treat `end` as exclusive while still allowing empty spans to select their own line:\n```rust\n// before\nif end < line_info.start_byte {\n    break;\n}\n// after\nif end <= line_info.start_byte && end != start {\n    break;\n}\n```\n(the `end != start` guard preserves the current behaviour for degenerate `n..n` spans, which must still map to the line beginning at `n`).","locations":[{"ref":"src/renderer/source_map.rs:123-142","code":"  123 |     pub(crate) fn span_to_lines(&self, span: Range<usize>) -> Vec<&LineInfo<'a>> {\n  124 |         let mut lines = vec![];\n  125 |         let start = span.start;\n  126 |         let end = span.end;\n  127 |         for line_info in &self.lines {\n  128 |             if start >= line_info.end_byte {\n  129 |                 continue;\n  130 |             }\n  131 |             if end < line_info.start_byte {\n  132 |                 break;\n  133 |             }\n  134 |             lines.push(line_info);\n  135 |         }\n  136 | \n  137 |         if lines.is_empty() && !self.lines.is_empty() {\n  138 |             lines.push(self.lines.last().unwrap());\n  139 |         }\n  140 | \n  141 |         lines\n  142 |     }","lines":20,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/source_map.rs#L123-L142"}]},{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`Margin::compute` silently abandons the terminal-width guarantee whenever a single span is wider than `term_width`. When none of the first three branches match, the final `else` sets `computed_left = self.span_left` / `computed_right = self.span_right`, and `right()` then returns `min(line_len, self.computed_right)`, so the rendered window is `span_right - span_left` columns wide - which is `(real span width) + 2 * ELLIPSIS_PASSING` and is completely unbounded by `term_width`. The middle-trimming pass in `render.rs` only kicks in when `width > margin.term_width * 2`, so there is a dead zone for spans in `(term_width, 2 * term_width]` where nothing clamps the output at all.\n\nVerified: source line `\"z\".repeat(40) + \" tail\".repeat(3)` (55 columns) with one `AnnotationKind::Primary.span(0..40).label(\"A\")` rendered with `Renderer::plain().term_width(30)` produces a widest output line of **50 columns**:\n```text\n1 | zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz ta...\n  | ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^ A\n```\nParadoxically `term_width(20)` yields only 23 columns (because there the `> term_width * 2` middle-trim path is taken), so the overflow is non-monotonic in `term_width`.","fix":"Clamp the give-up branch to the terminal width instead of the raw span extent, e.g. keep `computed_left = self.span_left` but set `self.computed_right = self.computed_left + max(self.term_width, MIN_WINDOW)`, and let the middle-trimming pass in `render.rs` insert the `...` for the elided centre. Alternatively make `right()` clamp unconditionally:\n```rust\npub(crate) fn right(&self, line_len: usize) -> usize {\n    min(line_len, max(self.computed_right, self.computed_left + self.term_width))\n}\n```\nand lower the middle-trim trigger in `render.rs` from `width > margin.term_width * 2` to `width > margin.term_width` so spans in the dead zone are actually trimmed.","locations":[{"ref":"src/renderer/margin.rs:93-97","code":"   93 |             } else {\n   94 |                 // Mostly give up but still don't show the full line.\n   95 |                 self.computed_left = self.span_left;\n   96 |                 self.computed_right = self.span_right;\n   97 |             }","lines":5,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/margin.rs#L93-L97"},{"ref":"src/renderer/margin.rs:105-111","code":"  105 |     pub(crate) fn right(&self, line_len: usize) -> usize {\n  106 |         if line_len.saturating_sub(self.computed_left) <= self.term_width {\n  107 |             line_len\n  108 |         } else {\n  109 |             min(line_len, self.computed_right)\n  110 |         }\n  111 |     }","lines":7,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/margin.rs#L105-L111"}]},{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`render_title` accumulates `label_width` from **byte** lengths (`title.level().as_str().len()` and `id.len()`) but then uses it as a **display column** count to build the `padding` string that aligns the continuation lines of a multi-line title. Level names are user-supplied via `Level::with_name`, and `Id::id` is user-supplied too, so non-ASCII values misalign the output. Verified:\n\n```text\nエラー: line1\n           line2      <- over-indented by 3 (9 bytes counted, 6 display columns)\n\nerror[Ω1]: line1\n            line2     <- over-indented by 1 (Ω is 2 bytes, 1 column)\n```\n\nCorrect output would put `line2` exactly under `line1`.","fix":"Use the module's own `str_width` helper (defined at the bottom of this file) instead of `str::len`.\n\nBefore:\n```rust\nlabel_width += title.level().as_str().len();\n...\nlabel_width += 2 + id.len();\n```\n\nAfter:\n```rust\nlabel_width += str_width(title.level().as_str());\n...\nlabel_width += 2 + str_width(id);\n```","locations":[{"ref":"src/renderer/render.rs:353-376","code":"  353 |     let mut label_width = 0;\n  354 | \n  355 |     if title.level().name != Some(None) {\n  356 |         buffer.append(buffer_msg_line_offset, title.level().as_str(), label_style);\n  357 |         label_width += title.level().as_str().len();\n  358 |         if let Some(Id { id: Some(id), url }) = &title.id() {\n  359 |             buffer.append(buffer_msg_line_offset, \"[\", label_style);\n  360 |             if let Some(url) = url.as_ref() {\n  361 |                 buffer.append(\n  362 |                     buffer_msg_line_offset,\n  363 |                     &format!(\"\\x1B]8;;{url}\\x1B\\\\\"),\n  364 |                     label_style,\n  365 |                 );\n  366 |             }\n  367 |             buffer.append(buffer_msg_line_offset, id, label_style);\n  368 |             if url.is_some() {\n  369 |                 buffer.append(buffer_msg_line_offset, \"\\x1B]8;;\\x1B\\\\\", label_style);\n  370 |             }\n  371 |             buffer.append(buffer_msg_line_offset, \"]\", label_style);\n  372 |             label_width += 2 + id.len();\n  373 |         }\n  374 |         buffer.append(buffer_msg_line_offset, \": \", title_element_style);\n  375 |         label_width += 2;\n  376 |     }","lines":24,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/render.rs#L353-L376"}]},{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The level name returned by `Level::as_str` is measured with `str::len()` (bytes) when computing\n`label_width`, which is then used as a *column* count to build the continuation padding\n(`\" \".repeat(...)`). For any custom level name containing non-ASCII characters the continuation\nlines of a multi-line message are indented by `bytes - display_columns` extra spaces. The same\nbyte-length mistake is made for the id at `label_width += 2 + id.len()`.\n\nVerified by running against the crate:\n\n```text\n--- blad ---            --- błąd ---\n  = blad: line one        = błąd: line one\n          line two ok               line two ok      <-- 2 columns too far\n```\n\n`\"błąd\"` is 6 bytes but 4 display columns. The crate already has `char_width` / display-width\nhelpers (`renderer::char_width`, used elsewhere in `render.rs`), so the byte count here is\nclearly unintended. This is reachable from the public API via `Level::with_name`.","fix":"Measure display width instead of bytes:\n\n```rust\nlabel_width += str_width(title.level().as_str());\n...\nlabel_width += 2 + str_width(id);\n```\n\nusing the same unicode-width based helper that backs `char_width`, rather than `str::len()`.","locations":[{"ref":"src/renderer/render.rs:355-372","code":"  355 |     if title.level().name != Some(None) {\n  356 |         buffer.append(buffer_msg_line_offset, title.level().as_str(), label_style);\n  357 |         label_width += title.level().as_str().len();\n  358 |         if let Some(Id { id: Some(id), url }) = &title.id() {\n  359 |             buffer.append(buffer_msg_line_offset, \"[\", label_style);\n  360 |             if let Some(url) = url.as_ref() {\n  361 |                 buffer.append(\n  362 |                     buffer_msg_line_offset,\n  363 |                     &format!(\"\\x1B]8;;{url}\\x1B\\\\\"),\n  364 |                     label_style,\n  365 |                 );\n  366 |             }\n  367 |             buffer.append(buffer_msg_line_offset, id, label_style);\n  368 |             if url.is_some() {\n  369 |                 buffer.append(buffer_msg_line_offset, \"\\x1B]8;;\\x1B\\\\\", label_style);\n  370 |             }\n  371 |             buffer.append(buffer_msg_line_offset, \"]\", label_style);\n  372 |             label_width += 2 + id.len();","lines":18,"link":"https://github.com/rust-lang/annotate-snippets-rs/bl ,"type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `render_source_line`, the \"short start\" optimisation (rendering `2 | / fn foo() {` instead of the `|  _^` two-line form) tests whether the code preceding a `MultilineStart` is all whitespace with `source_string.chars().take(ann.start.display).all(char::is_whitespace)`. `Iterator::take` counts **chars**, but `ann.start.display` is a **display column** (see `Loc::display`, computed with `char_width` in `SourceMap::span_to_locations`). For any line whose leading run contains non-single-width characters the two differ, and the check inspects the wrong slice of the line.\n\nVerified: with `\\u{3000}\\u{3000}fn foo() {` (two ideographic spaces, each `char_width == 2`), `ann.start.char == 2` but `ann.start.display == 4`, so `take(4)` also pulls in `f` and `o`, the check fails and the compact form is lost:\n\n```text\n1 |   　　fn foo() {          (buggy: falls back to the verbose form)\n  |  _____^\n2 | | 　　}\n  | |_____^ here\n```\n\nwhereas the ASCII-indented equivalent correctly renders `1 | /     fn foo() {`.","fix":"Consume `source_string` by accumulated display width rather than by char count, since `source_string` is the *normalized* line (tabs already expanded) and `ann.start.display` is a display column:\n\n```rust\nlet mut consumed = 0;\nlet leading_is_blank = source_string\n    .chars()\n    .take_while(|c| {\n        let keep = consumed < ann.start.display;\n        consumed += char_width(*c);\n        keep\n    })\n    .all(char::is_whitespace);\nif leading_is_blank {\n```\n\n`char_width` is already available in this module.","locations":[{"ref":"src/renderer/render.rs:900-920","code":"  900 |     for ann in &line_info.annotations {\n  901 |         if let LineAnnotationType::MultilineStart(depth) = ann.annotation_type {\n  902 |             if source_string\n  903 |                 .chars()\n  904 |                 .take(ann.start.display)\n  905 | t all, so a user-configured `Renderer::none(style)` is not applied there, while the very same `ElementStyle` later on the line does get the style; and (b) as soon as the first character has a different style, `write!(str, \"{current_style:#}\")` emits a stray reset before anything has been written.\n\nVerified with `Renderer::plain().none(anstyle::AnsiColor::Magenta.on_default())`, whose output begins with a reset and leaves the leading `NoStyle` run unstyled while a later `NoStyle` run is magenta. The `if !line.is_empty()` guard on the reset is vacuous (see the separate dead-code finding), so it does not prevent this.","fix":"Track whether anything has been emitted on the current line and write the initial style explicitly:\n```rust\nfor (i, line) in self.lines.iter().enumerate() {\n    let mut current_style = stylesheet.none;\n    let mut started = false;\n    for StyledChar { ch, style } in line {\n        let ch_style = style.color_spec(level, stylesheet);\n        if !started || ch_style != current_style {\n            if started {\n                write!(str, \"{current_style:#}\")?;\n            }\n            current_style = ch_style;\n            write!(str, \"{current_style}\")?;\n            started = true;\n        }\n        str.push(*ch);\n    }\n    if started {\n        write!(str, \"{current_style:#}\")?;\n    }\n    ...\n}\n```","locations":[{"ref":"src/renderer/styled_buffer.rs:52-68","code":"   52 |         for (i, line) in self.lines.iter().enumerate() {\n   53 |             let mut current_style = stylesheet.none;\n   54 |             for StyledChar { ch, style } in line {\n   55 |                 let ch_style = style.color_spec(level, stylesheet);\n   56 |                 if ch_style != current_style {\n   57 |                     if !line.is_empty() {\n   58 |                         write!(str, \"{current_style:#}\")?;\n   59 |                     }\n   60 |                     current_style = ch_style;\n   61 |                     write!(str, \"{current_style}\")?;\n   62 |                 }\n   63 |                 str.push(*ch);\n   64 |             }\n   65 |             write!(str, \"{current_style:#}\")?;\n   66 |             if i != self.lines.len() - 1 {\n   67 |                 str.push('\\n');\n   68 |             }","lines":17,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/styled_buffer.rs#L52-L68"}]},{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"The overlap-detection loop compares `j` against the literal `1` instead of against the outer index\n`i`: `if overlaps(next, annotation, 0) && j > 1`. This has two consequences:\n\n1. Genuine overlaps between annotation pairs with `j <= 1` are never recorded, so `overlap[]` stays\n   `false` and the \"skip long-span trimming when spans overlap\" guard at line 1393 does not fire.\n2. When `i == j`, `overlaps(annotation, annotation, 0)` is trivially `true` for any non-empty span,\n   so *every* annotation with index `>= 2` is unconditionally marked as overlapping itself.\n\nVerified repro (two annotations on one very long line, the short one nested inside the long one):\n```rust\nSnippet::source(&source).path(\"f.rs\")\n    .annotation(AnnotationKind::Primary.span(12..312).label(\"long\"))\n    .annotation(AnnotationKind::Context.span(112..117).label(\"small\"))\n```\nrenders as\n```text\n2 | xxxxxxxxxxxxxxxxxxxxxxxxxxxxx...xxxxxxxxxxxxxxxxxxxxxxxxxxxxx...\n  | ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^...^^^^^^^^^^^^^^^^^^^^^^^^^^^^^\n  | |                                                                    |\n  | |                                                                    small\n  | long\n```\nThe middle of the long span is elided even though `small` overlaps it, leaving `small`'s vertical\nbar and label dangling ~100 columns past the end of the (now shortened) underline row.","fix":"Compare the two loop indices instead of a constant, and skip the self-comparison:\n```rust\nfor (j, next) in annotations.iter().enumerate() {\n    if i != j && overlaps(next, annotation, 0) {\n        overlap[i] = true;\n        overlap[j] = true;\n    }\n```","locations":[{"ref":"src/renderer/render.rs:1029-1034","code":" 1029 |     for (i, annotation) in annotations.iter().enumerate() {\n 1030 |         for (j, next) in annotations.iter().enumerate() {\n 1031 |             if overlaps(next, annotation, 0) && j > 1 {\n 1032 |                 overlap[i] = true;\n 1033 |                 overlap[j] = true;\n 1034 |             }","lines":6,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/render.rs#L1029-L1034"}]},{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"medium","description":"The single decision \"should this group's window be closed with `╰╴`, continued with `│`, or left\nopen?\" is copy-pasted into four arms of the main `render` loop with three *different* conditions:\n\n- title with no following element (`src/renderer/render.rs:81-92`):\n  `peek.is_none() && title_style == MainHeader && g == 0 && group_len > 1`\n- after a `Cause` (`src/renderer/render.rs:129-148`): outer `if g == 0`, then\n  `None if group_len > 1 => draw_col_separator_end`\n- after an `Origin` (`src/renderer/render.rs:194-202`):\n  `g == 0 && peek.is_none() && group_len > 1`\n- after a `Padding` (`src/renderer/render.rs:204-221`): **`peek.is_none()` only** - no `g == 0`,\n  no `group_len > 1`\n\nThe `Padding` arm is the odd one out, and it produces observably inconsistent output. With\n`DecorStyle::Unicode` and a two-group report whose *second* (i.e. `g == 1`) group ends with a\ntrailing element:\n\n```text\nlast element = Padding            last element = Origin\nnote: second                      note: second\n  ╭▸ g.rs:1:6                       ╭▸ g.rs:1:6\n  │                                 │\n1 │ aaaa bbbb                      1 │ aaaa bbbb\n  │      ────                        │      ────\n  ╰╴                <- closed        ⸬  h.rs        <- not closed\n```\n\nNothing else in a non-first group ever emits the closing `╰╴`, so a trailing `Padding` is the only\nway to get one. Whichever behaviour is intended, it is currently decided by which of four\ncopy-pasted `if` chains happens to run.","fix":"Compute the decision once, before the match, and apply it once after:\n\n```rust\nenum WindowEdge { None, Continue, Close }\n\nfn window_edge(g: usize, group_len: usize, has_next: bool) -> WindowEdge {\n    match (has_next, g == 0 && group_len > 1) {\n        (true, _)      => WindowEdge::Continue,\n        (false, true)  => WindowEdge::Close,\n        (false, false) => WindowEdge::None,\n    }\n}\n```\n\nEach arm then only renders its own content; the loop tail does\n`match window_edge(g, group_len, peek.is_some()) { .. }` with the single\n`draw_col_separator_no_space` / `draw_col_separator_end` call. Add a snapshot test covering a\ntrailing `Padding` in both the first and a subsequent group to pin the chosen behaviour.","locations":[{"ref":"src/renderer/render.rs:81-92","code":"   81 |                 if peek.is_none()\n   82 |                     && title_style == TitleStyle::MainHeader\n   83 |                     && g == 0\n   84 |                     && group_len > 1\n   85 |                 {\n   86 |                     draw_col_separator_end(\n   87 |                         renderer,\n   88 |                         &mut buffer,\n   89 |                         buffer_msg_line_offset,\n   90 |                         max_line_num_len + 1,\n   91 |                     );\n   92 |                 }","lines":12,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/render.rs#L81-L92"},{"ref":"src/renderer/render.rs:129-148","code":"  129 |                         if g == 0 {\n  130 | 04 |                     PreProcessedElement::Padding(_) => {\n  205 |                         let current_line = buffer.num_lines();\n  206 |                         if peek.is_none() {\n  207 |                             draw_col_separator_end(\n  208 |                                 renderer,\n  209 |                                 &mut buffer,\n  210 |                                 current_line,\n  211 |                                 max_line_num_len + 1,\n  212 |                             );\n  213 |                         } else {\n  214 |                             draw_col_separator_no_space(\n  215 |                                 renderer,\n  216 |                                 &mut buffer,\n  217 |                                 current_line,\n  218 |                                 max_line_num_len + 1,\n  219 |                             );\n  220 |                         }\n  221 |                     }","lines":18,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/render.rs#L204-L221"}]},{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`StyledBuffer::render` returns `Result<(), fmt::Error>` even though its only sink is a `&mut String`, whose `core::fmt::Write` impl is infallible (it can only abort on allocation failure). The `?` operators therefore propagate an error that can never occur, and the chain ends at `render::render`, which resolves it with `render_short_message(renderer, groups).unwrap()`. This is an `unwrap()` on a value the type system says can fail but the implementation says cannot - either it is dead error handling or it is a latent panic, and a reader cannot tell which.","fix":"Make the signature infallible and drop the `?`/`unwrap()` chain: change the return type to `()`, replace `write!(str, \"{current_style:#}\")?` with `let _ = write!(str, \"{current_style:#}\");` (or push the rendered escape via `str.push_str`), and remove the corresponding `?`/`.unwrap()` at the call sites in `render.rs`.","locations":[{"ref":"src/renderer/styled_buffer.rs:43-71","code":"   43 |     pub(crate) fn render(\n   44 |         &self,\n   45 |         level: &Level<'_>,\n   46 |         stylesheet: &Stylesheet,\n   47 |         str: &mut String,\n   48 |     ) -> Result<(), fmt::Error> {\n   49 |         let capacity = self.lines.iter().map(|line| line.len()).sum();\n   50 |         str.reserve(capacity);\n   51 | \n   52 |         for (i, line) in self.lines.iter().enumerate() {\n   53 |             let mut current_style = stylesheet.none;\n   54 |             for StyledChar { ch, style } in line {\n   55 |                 let ch_style = style.color_spec(level, stylesheet);\n   56 |                 if ch_style != current_style {\n   57 |                     if !line.is_empty() {\n   58 |                         write!(str, \"{current_style:#}\")?;\n   59 |                     }\n   60 |                     current_style = ch_style;\n   61 |                     write!(str, \"{current_style}\")?;\n   62 |                 }\n   63 |                 str.push(*ch);\n   64 |             }\n   65 |             write!(str, \"{current_style:#}\")?;\n   66 |             if i != self.lines.len() - 1 {\n   67 |                 str.push('\\n');\n   68 |             }\n   69 |         }\n   70 |         Ok(())\n   71 |     }","lines":29,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/styled_buffer.rs#L43-L71"},{"ref":"src/renderer/render.rs:30-32","code":"   30 |     if renderer.short_message {\n   31 |         render_short_message(renderer, groups).unwrap()\n   32 |     } else {","lines":3,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/render.rs#L30-L32"}]},{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"negligible","difficulty":"very_easy","description":"`StyledBuffer::render` returns `Result<(), fmt::Error>` only because it uses `write!` into a `String`, which cannot fail. Both call sites in `render` swallow that with `.unwrap()`, which means a future change to `StyledBuffer::render` that can genuinely fail would silently turn into a panic in a library that otherwise returns a `String`.","fix":"Make `StyledBuffer::render` and `render_short_message` infallible (drop the `Result`, since `String: fmt::Write` never errors) so the `.unwrap()`s disappear:\n\n```rust\npub(crate) fn render(&self, level: &Level<'_>, stylesheet: &Stylesheet, str: &mut String) { ... }\n```","locations":[{"ref":"src/renderer/render.rs:29-31","code":"   29 | pub(crate) fn render(renderer: &Renderer, groups: Report<'_>) -> String {\n   30 |     if renderer.short_message {\n   31 |         render_short_message(renderer, groups).unwrap()","lines":3,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/render.rs#L29-L31"},{"ref":"src/renderer/render.rs:224-226","code":"  224 |             buffer\n  225 |                 .render(&level, &renderer.stylesheet, &mut out_string)\n  226 |                 .unwrap();","lines":3,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/render.rs#L224-L226"}]},{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"medium","description":"`Title::id_url` is the only text-taking builder in this file with no \"untrusted input\" warning, and its value is the most dangerous one: `render_title` embeds it raw inside an OSC 8 hyperlink escape, `format!(\"\\x1B]8;;{url}\\x1B\\\\\")`. Neither normalization nor escaping is applied, and the sequence is emitted even by `Renderer::plain()`, which callers reasonably expect to be escape-free. Verified: `Level::ERROR.primary_title(\"t\").id(\"E0308\").id_url(\"https://x/\\u{1b}\\\\\\u{1b}]0;pwned\\u{7}\")` renders, under `Renderer::plain()`, `error[\\u{1b}]8;;https://x/\\u{1b}\\\\\\u{1b}]0;pwned\\u{7}\\u{1b}\\\\E0308...]: t` - the `\\u{1b}\\\\` inside the URL terminates the OSC string and the remainder is executed by the terminal (here, setting the window title). Any tool that forwards an externally supplied lint documentation URL into `id_url` becomes a terminal-escape-injection vector.","fix":"Reject or sanitize control characters in the URL - drop the hyperlink entirely if `url.chars().any(char::is_control)`, or percent-encode them - and only emit the OSC 8 sequence when the renderer is actually styled (gate it the same way ANSI styling is gated, so `Renderer::plain()` prints the bare `[E0308]`). Also add the same `<div class=\"warning\">` untrusted-input note that `Title::id` has.","locations":[{"ref":"src/snippet.rs:185-195","code":"  185 |     /// Provide a URL for [`Title::id`] for more information on this diagnostic\n  186 |     ///\n  187 |     /// <div class=\"warning\">\n  188 |     ///\n  189 |     /// This is only relevant if `id` is present\n  190 |     ///\n  191 |     /// <\/div>\n  192 |     pub fn id_url(mut self, url: impl Into<Cow<'a, str>>) -> Self {\n  193 |         self.id.get_or_insert(Id::default()).url = Some(url.into());\n  194 |         self\n  195 |     }","lines":11,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/snippet.rs#L185-L195"},{"ref":"src/renderer/render.rs:358-372","code":"  358 |         if let Some(Id { id: Some(id), url }) = &title.id() {\n  359 |             buffer.append(buffer_msg_line_offset, \"[\", label_style);\n  360 |             if let Some(url) = url.as_ref() {\n  361 |                 buffer.append(\n  362 |                     buffer_msg_line_offset,\n  363 |                     &format!(\"\\x1B]8;;{url}\\x1B\\\\\"),\n  364 |                     label_style,\n  365 |                 );\n  366 |             }\n  367 |             buffer.append(buffer_msg_line_offset, id, label_style);\n  368 |             if url.is_some() {\n  369 |                 buffer.append(buffer_msg_line_offset, \"\\x1B]8;;\\x1B\\\\\", label_style);\n  370 |             }\n  371 |             buffer.append(buffer_msg_line_offset, \"]\", label_style);\n  372 |             label_width += 2 + id.len();","lines":15,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/render.rs#L358-L372"}]},{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`Level` is documented as \"Severity level for `Title`s and `Message`s\" and publicly derives\n`PartialOrd`/`Ord`, but the derived ordering is lexicographic over the *field declaration order*\n`(name, level)`, so the cosmetic `name` override dominates the actual severity:\n\n```rust\nassert!(Level::WARNING < Level::ERROR.with_name(Some(\"a\"))); // true - a warning outranks an error\nassert!(Level::ERROR   < Level::WARNING);                    // true - ERROR is the *minimum*\nassert!(Level::ERROR   < Level::HELP);                       // true - HELP is the *maximum*\n```\n\n(all three verified by running against the crate). Two problems compound:\n\n1. Because `name: Option<Option<Cow<'a, str>>>` is compared first and `None < Some(_)`, *any*\n   level carrying a custom name sorts above *every* default level regardless of `LevelInner`.\n2. Even for default levels the direction is the opposite of the intuitive one -\n   `LevelInner::Error` is declared first so it is the smallest; a user calling\n   `.iter().max()` to find the most severe diagnostic gets `Level::HELP`.\n\nNeither the `Ord` direction nor the name-first tie-break is documented. The derive is unused\ninside the crate (`grep` finds no `Level` comparison in `src/`), so this is pure public API\nsurface that will silently mis-sort user code.","fix":"Either drop `PartialOrd`/`Ord` from the `Level` derive (they are unused internally) and expose an\nexplicit accessor for severity, or implement them by hand so severity dominates and the direction\nis documented:\n\n```rust\n#[derive(Clone, Debug, PartialEq, Eq)]\npub struct Level<'a> { /* ... */ }\n\nimpl Ord for Level<'_> {\n    fn cmp(&self, other: &Self) -> core::cmp::Ordering {\n        // `Error` is the most severe, so reverse the declaration order of `LevelInner`\n        other.level.cmp(&self.level).then_with(|| self.name.cmp(&other.name))\n    }\n}\n```\n\nWhichever is chosen, add a doc-comment on `Level` stating which end of the ordering is \"most\nsevere\".","locations":[{"ref":"src/level.rs:55-59","code":"   55 | #[derive(Clone, Debug, PartialEq, Eq, PartialOrd, Ord)]\n   56 | pub struct Level<'a> {\n   57 |     pub(crate) name: Option<Option<Cow<'a, str>>>,\n   58 |     pub(crate) level: LevelInner,\n   59 | }","lines":5,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/level.rs#L55-L59"},{"ref":"src/level.rs:214-221","code":"  214 | #[derive(Clone, Copy, Debug, PartialEq, Eq, PartialOrd, Ord)]\n  215 | pub(crate) enum LevelInner {\n  216 |     Error,\n  217 |     Warning,\n  218 |     Info,\n  219 |     Note,\n  220 |     Help,\n  221 | }","lines":8,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/level.rs#L214-L221"}]},{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"`src/renderer/mod.rs:38` does `pub use anstyle::*;`, re-exporting the *entire* `anstyle` crate into\n`annotate_snippets::renderer`. This makes every current and future public item of `anstyle`\n(`Style`, `AnsiColor`, `Effects`, `Color`, `Ansi256Color`, `RgbColor`, `Reset`, `EffectIter`, ...)\npart of `annotate-snippets`' public API surface. Two concrete consequences:\n\n- A semver-minor release of `anstyle` that adds a new public item silently changes\n  `annotate-snippets`' public API, and can break downstream `use annotate_snippets::renderer::*;`\n  glob imports through a name collision that this crate never authored.\n- The crate's own public names in that module (`Renderer`, `DecorStyle`, `DEFAULT_TERM_WIDTH`, the\n  `DEFAULT_*_STYLE` constants) are indistinguishable from the re-exported foreign ones in rustdoc.\n\nOnly `Style` (used in the `Renderer::error`/`warning`/... setters at mod.rs:205-269) and the color\ntypes needed to construct one are actually part of this crate's contract.","fix":"Replace the glob with an explicit, documented re-export list, e.g.\n\n```rust\npub use anstyle::{Ansi256Color, AnsiColor, Color, Effects, RgbColor, Style};\n```\n\nso that additions to `anstyle` cannot change this crate's API, and add a doc comment noting that\nthese are re-exports of `anstyle` types accepted by [`Renderer::error`] and friends.","locations":[{"ref":"src/renderer/mod.rs:38","code":"   38 | pub use anstyle::*;","lines":1,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/mod.rs#L38"}]},{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"`AnnotationKind::span` and `Patch::new` are the only way to supply byte ranges, yet neither documents that an out-of-range span aborts rendering. `SourceMap::annotated_lines` and `SourceMap::splice_lines` `panic!` with `Annotation range ... is beyond the end of buffer ...` / `Patch span ... is beyond the end of buffer ...`. Verified: `AnnotationKind::Primary.span(2..99)` on a 5-byte source and `Patch::new(2..99, \"x\")` on a 5-byte source both panic. `Renderer::render` has no `# Panics` section either, so the only way a caller learns about this contract is by crashing in production.","fix":"Add a `# Panics` section to the doc comments of `AnnotationKind::span`, `Patch::new`, `Snippet::annotation`/`Snippet::patch` and `Renderer::render` stating that spans must satisfy `span.start <= span.end <= source.len() + 1` and must lie on UTF-8 char boundaries. Better still, clamp the span to `source.len() + 1` in the renderer and drop the `panic!`s so a malformed span degrades to a slightly wrong caret instead of killing the host process.","locations":[{"ref":"src/snippet.rs:395-403","code":"  395 |     /// Annotate a byte span within [`Snippet`]\n  396 |     pub fn span<'a>(self, span: Range<usize>) -> Annotation<'a> {\n  397 |         Annotation {\n  398 |             span,\n  399 |             label: None,\n  400 |             kind: self,\n  401 |             highlight_source: false,\n  402 |         }\n  403 |     }","lines":9,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/snippet.rs#L395-L403"},{"ref":"src/snippet.rs:429-443","code":"  429 |     /// Splice `replacement` into the [`Snippet`] at the specified byte span\n  430 |     ///\n  431 |     /// <div class=\"warning\">\n  432 |     ///\n  433 |     /// Text passed to this function is considered \"untrusted input\", as such\n  434 |     /// all text is passed through a normalization function. Pre-styled text is\n  435 |     /// not allowed to be passed to this function.\n  436 |     ///\n  437 |     /// <\/div>\n  438 |     pub fn new(span: Range<usize>, replacement: impl Into<Cow<'a, str>>) -> Self {\n  439 |         Self {\n  440 |             span,\n  441 |             replacement: replacement.into(),\n  442 |         }\n  443 |     }","lines":15,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/snippet.rs#L429-L443"},{"ref":"src/renderer/source_map.rs:149-159","code":"  149 |         let source_len = self.source.len();\n  150 |         if let Some(bigger) = annotations.iter().find_map(|x| {\n  151 |             // Allow highlighting one past the last character in the source.\n  152 | le from the docs.","fix":"Document the disjointness/ordering requirement on `Patch::new` and `Snippet::patch`, and enforce it where the patches are collected: in `SourceMap::splice_lines`, after `patches.sort_by_key(|p| p.span.start)`, drop (or clamp) any patch whose `span.start` is less than the previous patch's `span.end`, and skip patches where `span.start > span.end`, instead of splicing them blindly.","locations":[{"ref":"src/snippet.rs:428-443","code":"  428 | impl<'a> Patch<'a> {\n  429 |     /// Splice `replacement` into the [`Snippet`] at the specified byte span\n  430 |     ///\n  431 |     /// <div class=\"warning\">\n  432 |     ///\n  433 |     /// Text passed to this function is considered \"untrusted input\", as such\n  434 |     /// all text is passed through a normalization function. Pre-styled text is\n  435 |     /// not allowed to be passed to this function.\n  436 |     ///\n  437 |     /// <\/div>\n  438 |     pub fn new(span: Range<usize>, replacement: impl Into<Cow<'a, str>>) -> Self {\n  439 |         Self {\n  440 |             span,\n  441 |             replacement: replacement.into(),\n  442 |         }\n  443 |     }","lines":16,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/snippet.rs#L428-L443"},{"ref":"src/snippet.rs:299-311","code":"  299 | impl<'a> Snippet<'a, Patch<'a>> {\n  300 |     /// Suggest to the user an edit to the [`source`][Self::source]\n  301 |     pub fn patch(mut self, patch: Patch<'a>) -> Snippet<'a, Patch<'a>> {\n  302 |         self.markers.push(patch);\n  303 |         self\n  304 |     }\n  305 | \n  306 |     /// Suggest to the user edits to the [`source`][Self::source]\n  307 |     pub fn patches(mut self, patches: impl IntoIterator<Item = Patch<'a>>) -> Self {\n  308 |         self.markers.extend(patches);\n  309 |         self\n  310 |     }\n  311 | }","lines":13,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe O_TXT,\n  136 |             (None, LevelInner::Note) => NOTE_TXT,\n  137 |             (None, LevelInner::Help) => HELP_TXT,\n  138 |         }\n  139 |     }\n  140 | \n  141 |     pub(crate) fn style(&self, stylesheet: &Stylesheet) -> Style {\n  142 |         self.level.style(stylesheet)\n  143 |     }","lines":15,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/level.rs#L129-L143"}]},{"id":"API_7","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"A `Snippet` with no markers cannot be added to a `Group` without a turbofish. `Element` has two `From<Snippet<'a, _>>` impls (`Annotation` -> `Cause`, `Patch` -> `Suggestion`), so `T` is only ever inferred from a call to `.annotation()`/`.patch()`. Verified: `Group::with_level(Level::ERROR).element(Snippet::source(\"a\\nb\\nc\").path(\"f.rs\"))` fails to compile with `E0283: cannot infer type of the type parameter T declared on the struct Snippet` plus `multiple impls satisfying Element<'_>: From<Snippet<'_, _>> found`, and the user has to write `Snippet::<Annotation<'_>>::source(...)`. Showing plain source context with `fold(false)` and no annotations is a legitimate and natural use of this API, and nothing documents the workaround.","fix":"Give `T` a default (`pub struct Snippet<'a, T = Annotation<'a>>`) so `Snippet::source(..)` resolves to the annotation flavor, or add dedicated constructors such as `Snippet::cause(source)` / `Snippet::suggestion(source)` that pin `T`. At minimum, document the turbofish in the `Snippet` type-level doc comment next to the existing \"`Snippet`s come in the following styles (`T`)\" list.","locations":[{"ref":"src/snippet.rs:115-125","code":"  115 | impl<'a> From<Snippet<'a, Annotation<'a>>> for Element<'a> {\n  116 |     fn from(value: Snippet<'a, Annotation<'a>>) -> Self {\n  117 |         Element::Cause(value)\n  118 |     }\n  119 | }\n  120 | \n  121 | impl<'a> From<Snippet<'a
