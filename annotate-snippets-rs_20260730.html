urce_map.rs:57-62","code":"   57 |     pub(crate) fn get_line(&self, idx: usize) -> Option<&'a str> {\n   58 |         self.lines\n   59 |             .iter()\n   60 |             .find(|l| l.line_index == idx)\n   61 |             .map(|info| info.line)\n   62 |     }","lines":6,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/source_map.rs#L57-L62"},{"ref":"src/renderer/source_map.rs:304-308","code":"  304 |                 let until = (ann.start.line..middle)\n  305 |                     .rev()\n  306 |                     .filter_map(|line| self.get_line(line).map(|s| (line + 1, s)))\n  307 |                     .find(|(_, s)| filter(s))\n  308 |                     .map_or(ann.start.line, |(line, _)| line);","lines":5,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/source_map.rs#L304-L308"},{"ref":"src/renderer/source_map.rs:466-475","code":"  466 |                 push_trailing(&mut buf, prev_line, &prev_hi, None);\n  467 |                 // push lines between the previous and current span (if any)\n  468 |                 for idx in prev_hi.line + 1..(cur_lo.line) {\n  469 |                     if let Some(line) = self.get_line(idx) {\n  470 |                         buf.push_str(line.as_ref());\n  471 |                         buf.push('\\n');\n  472 |                         highlights.push(core::mem::take(&mut line_highlight));\n  473 |                     }\n  474 |                 }\n  475 |                 if let Some(cur_line) = self.get_line(cur_lo.line) {","lines":10,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/source_map.rs#L466-L475"},{"ref":"src/renderer/source_map.rs:543-554","code":"  543 |         for part in &trimmed_patches {\n  544 |             let (cur_lo, cur_hi) = self.span_to_locations(part.span.clone());\n  545 |             for line in cur_lo.line..=cur_hi.line {\n  546 |                 let start = if line == cur_lo.line { cur_lo.char } else { 0 };\n  547 |                 let end = if line == cur_hi.line {\n  548 |                     cur_hi.char\n  549 |                 } else {\n  550 |                     self.get_line(line).unwrap_or_default().chars().count()\n  551 |                 };\n  552 |                 replaced_highlights[line - bounding_lo.line]\n  553 |                     .push(SubstitutionHighlight { start, end });\n  554 |             }","lines":12,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/source_map.rs#L543-L554"}]},{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"medium","difficulty":"easy","description":"`span_to_locations` locates the start and end lines with two full linear scans (`self.lines.iter().find(...)`), and `span_to_lines` linearly walks every line from the beginning of the file (the `if start >= line_info.end_byte { continue; }` arm skips lines one by one instead of seeking). `self.lines` is sorted by `start_byte`, so both are binary-searchable. `span_to_locations` is called once per annotation in `annotated_lines`, twice per patch in `splice_lines`, plus again from `render.rs` (lines 1462, 1496, 1498, 1632), so a large file with many annotations degrades to O(annotations × lines).","fix":"Replace the scans with `partition_point`, e.g.\n```rust\nlet idx = self.lines.partition_point(|info| info.end_byte <= span.start);\nlet start_info = self.lines.get(idx).unwrap_or_else(|| self.lines.last().unwrap());\n```\nand use the same technique to find the first line of `span_to_lines` before iterating forward.","locations":[{"ref":"src/renderer/source_map.rs:64-69","code":"   64 |     pub(crate) fn span_to_locations(&self, span: Range<usize>) -> (Loc, Loc) {\n   65 |         let start_info = self\n   66 |             .lines\n   67 |             .iter()\n   68 | ium","description":"`render_source_line` clones the whole annotation list for every rendered line\n(`line_info.annotations.clone()`), deep-copying every `Cow::Owned` label, only to sort it. The\nfollowing nested loop is then O(n^2) and calls `overlaps` up to four times for the same `(i, j)`\npair (lines 1031, 1035, 1061 and 1079), each call redoing the same `num_overlap` arithmetic. All of\nthis work is discarded for lines that early-return at line 1100.","fix":"Sort a `Vec<&LineAnnotation<'_>>` instead of cloning the annotations\n(`let mut annotations: Vec<&LineAnnotation<'_>> = line_info.annotations.iter().collect();`\nthen `annotations.sort_by_key(|a| Reverse((a.start.display, a.start.char)));`), and hoist the\nrepeated `overlaps(next, annotation, 0)` call into a `let overlaps_0 = ...;` binding at the top of\nthe inner loop body.","locations":[{"ref":"src/renderer/render.rs:960-961","code":"  960 |     let mut annotations = line_info.annotations.clone();\n  961 |     annotations.sort_by_key(|a| Reverse((a.start.display, a.start.char)));","lines":2,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/render.rs#L960-L961"},{"ref":"src/renderer/render.rs:1029-1092","code":" 1029 |     for (i, annotation) in annotations.iter().enumerate() {\n 1030 |         for (j, next) in annotations.iter().enumerate() {\n 1031 |             if overlaps(next, annotation, 0) && j > 1 {\n 1032 |                 overlap[i] = true;\n 1033 |                 overlap[j] = true;\n 1034 |             }\n 1035 |             if overlaps(next, annotation, 0)  // This label overlaps with another one and both\n 1036 |                     && annotation.has_label()     // take space (they have text and are not\n 1037 |                     && j > i                      // multiline lines).\n 1038 |                     && p == 0\n 1039 |             // We're currently on the first line, move the label one line down\n 1040 |             {\n 1041 |                 // If we're overlapping with an un-labelled annotation with the same span\n 1042 |                 // we can just merge them in the output\n 1043 |                 if next.start.display == annotation.start.display\n 1044 |                     && next.start.char == annotation.start.char\n 1045 |                     && next.end.display == annotation.end.display\n 1046 |                     && next.end.char == annotation.end.char\n 1047 |                     && !next.has_label()\n 1048 |                 {\n 1049 |                     continue;\n 1050 |                 }\n 1051 | \n 1052 |                 // This annotation needs a new line in the output.\n 1053 |                 p += 1;\n 1054 |                 break;\n 1055 |             }\n 1056 |         }\n 1057 |         annotations_position.push((p, annotation));\n 1058 |         for (j, next) in annotations.iter().enumerate() {\n 1059 |             if j > i {\n 1060 |                 let l = next.label.as_ref().map_or(0, |label| label.len() + 2);\n 1061 |                 if (overlaps(next, annotation, l) // Do not allow two labels to be in the same\n 1062 |                         // line if they overlap including padding, to\n 1063 |                         // avoid situations like:\n 1064 |                         //\n 1065 |                         //      fn foo(x: u32) {\n 1066 |                         //      -------^------\n 1067 |                         //      |      |\n 1068 |                         //      fn_spanx_span\n 1069 |                         //\n 1070 |                         && annotation.has_label()    // Both labels must have some text, otherwise\n 1071 |                         && next.has_label())         // they are not overlapping.\n 1072 |                         // Do not add a new line if this annotation\n 1073 |                         // or the next are vertical line placeholders.\n 1074 |                         || (annotation.takes_space() // If tor();\n    buffer.putc(line, col, chr, ElementStyle::LineNumber);\n    buffer.putc(line, col + 1, ' ', ElementStyle::LineNumber);\n```\nFor `maybe_anonymized`, emit the padding spaces with `buffer.putc`/`itoa`-style digit writing, or cache a\nreusable `String` in the caller and `write!` into it instead of allocating a fresh one per line.","locations":[{"ref":"src/renderer/render.rs:2107-2110","code":" 2107 | fn draw_col_separator(renderer: &Renderer, buffer: &mut StyledBuffer, line: usize, col: usize) {\n 2108 |     let chr = renderer.decor_style.col_separator();\n 2109 |     buffer.puts(line, col, &format!(\"{chr} \"), ElementStyle::LineNumber);\n 2110 | }","lines":4,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/render.rs#L2107-L2110"},{"ref":"src/renderer/render.rs:2197-2206","code":" 2197 | fn maybe_anonymized(renderer: &Renderer, line_num: usize, max_line_num_len: usize) -> String {\n 2198 |     format!(\n 2199 |         \"{:>max_line_num_len$}\",\n 2200 |         if renderer.anonymized_line_numbers {\n 2201 |             Cow::Borrowed(ANONYMIZED_LINE_NUM)\n 2202 |         } else {\n 2203 |             Cow::Owned(line_num.to_string())\n 2204 |         }\n 2205 |     )\n 2206 | }","lines":10,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/render.rs#L2197-L2206"}]},{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`normalize_whitespace` is called for essentially every rendered source/suggestion line, and its fast-path\nguard is a nested linear scan: for each char of the line it walks all 43 entries of `OUTPUT_REPLACEMENTS`\n(`OUTPUT_REPLACEMENTS.iter().any(...)`), i.e. ~43 comparisons per character in the common case where\nnothing needs replacing. The table is sorted (there is even a unit test enforcing that,\n`ensure_output_replacements_is_sorted`) and the replacement loop below already uses\n`binary_search_by_key`, so the guard is doing far more work than the transformation it is guarding.","fix":"Use the same binary search (or a cheap range pre-filter) in the guard.\nBefore:\n```rust\n    if !s\n        .chars()\n        .any(|user| OUTPUT_REPLACEMENTS.iter().any(|(bad, _)| user == *bad))\n    {\n        return Cow::Borrowed(s);\n    }\n```\nAfter:\n```rust\n    if !s.chars().any(|user| {\n        OUTPUT_REPLACEMENTS\n            .binary_search_by_key(&user, |(k, _)| *k)\n            .is_ok()\n    }) {\n        return Cow::Borrowed(s);\n    }\n```","locations":[{"ref":"src/renderer/render.rs:2515-2521","code":" 2515 | pub(crate) fn normalize_whitespace(s: &str) -> Cow<'_, str> {\n 2516 |     if !s\n 2517 |         .chars()\n 2518 |         .any(|user| OUTPUT_REPLACEMENTS.iter().any(|(bad, _)| user == *bad))\n 2519 |     {\n 2520 |         return Cow::Borrowed(s);\n 2521 |     }","lines":7,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/render.rs#L2515-L2521"}]},{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"The depth-assignment pass clones the entire `multiline_annotations` vector (`multiline_annotations.clone().into_iter()`) solely to be able to iterate while mutating. `MultilineAnnotation` contains a `Option<Cow<'a, str>>` label, so this is a deep clone of every label, and the surrounding nested loop is already O(n²).","fix":"Iterate by index instead of cloning:\n```rust\nfor outer_i in 0..multiline_annotations.len() {\n    let (start, end, kind) = {\n        let ann = &multiline_annotations[outer_i];\n        (ann.start, ann.end, ann.kind)\n    };\n    ...\n}\n```\n`Loc` is `Copy` and `AnnotationKind` is `Copy`, so only the label needs to stay borrowed, and the inner loop can use `split_at_mut` or index-based access.","locations":[{"ref":"src/renderer/source_map.rs:222-247","code":"  222 |         // Find overlapping multiline annotations, put them at different depths\n  223 |         multiline_annotations.sort_by_key(|ml| (ml.start.line, usize::MAX - ml.end.line));\n  224 |         for (outer_i, ann) in multiline_annotations.clone().into_iter().enumerate() {\n  225 |             if ann.kind.is_primary() {\n  226 |                 primary_spans.push((ann.start, ann.end));\n  227 |             }\n  228 |             for (inner_i, a) in &mut multiline_annotations.iter_mut().enumerate() {\n  229 |                 // Move all other multiline annotations overlapping with this one\n  230 |                 // one level to the right.\n  231 |                 if !ann.same_span(a)\n  232 |                     && num_overlap(ann.start.line, ann.end.line, a.start.line, a.end.line, true)\n  233 |                 {\n  234 |                     a.increase_depth();\n  235 |                 } else if ann.same_span(a) && outer_i != inner_i {\n  236 |                     a.overlaps_exactly = true;\n  237 |                 } else {\n  238 |                     if primary_spans\n  239 |                         .iter()\n  240 |                         .any(|(s, e)| a.start == *s && a.end == *e)\n  241 |                     {\n  242 |                         a.kind = AnnotationKind::Primary;\n  243 |                     }\n  244 |                     break;\n  245 |                 }\n  246 |             }\n  247 |         }","lines":26,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/source_map.rs#L222-L247"}]},{"id":"PERF_9","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`splice_lines` builds the full `Vec<&LineInfo>` returned by `span_to_lines(lo..hi)` but only ever reads `lines.first()`. For a non-folded splice `lo..hi` is the whole source, so this allocates and fills a vector with one entry per line of the file purely to look at element 0.","fix":"Drop the intermediate vector:\n```rust\n// before\nlet lines = self.span_to_lines(lo..hi);\n...\nlet mut prev_line = lines.first().map(|line| line.line);\n// after\nlet mut prev_line = self.span_to_lines(lo..hi).first().map(|line| line.line);\n```\nand preferably add a dedicated `fn first_line_of_span(&self, span: Range<usize>) -> Option<&'a str>` that returns the first match without collecting.","locations":[{"ref":"src/renderer/source_map.rs:431-445","code":"  431 |         let lines = self.span_to_lines(lo..hi);\n  432 | \n  433 |         let mut highlights = vec![];\n  434 |         // To build up the result, we do this for each span:\n  435 |         // - push the line segment trailing the previous span\n  436 |         //   (at the beginning a \"phantom\" span pointing at the start of the line)\n  437 |         // - push lines between the previous and current span (if any)\n  438 |         // - if the previous and current span are not on the same line\n  439 |         //   push the line segment leading up to the current span\n  440 |         // - splice in the span substitution\n  441 |         //\n  442 |         // Finally push the trailing line segment of the last span\n  443 |         let (mut prev_hi, _) = self.span_to_locations(lo..hi);\n  444 |         prev_hi.char = 0;\n  445 |         let mut prev_line = lines.first().map(|line| line.line);","lines":15,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/source_map.rs#L431-L445"}]},{"id":"PERF_10","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`StyledBuffer::render` pre-reserves `self.lines.iter().map(|line| line.len()).sum()` bytes, but `line.len()` is a count of `StyledChar`s (i.e. `char`s), not bytes. The estimate therefore ignores (a) multi-byte characters - the whole `DecorStyle::Unicode` glyph set plus any non-ASCII source text is 3 bytes per `char`, (b) the `'\\n'` appended after every line, and (c) the ANSI escape sequences, which are ~5-10 bytes per style transition and dominate styled output. For a styled Unicode render the reservation can be off by several times, so the `String` reallocates and memcpy's repeatedly during the hot write loop.","fix":"Account for byte width and the newlines.\n\nBefore:\n```rust\nlet capacity = self.lines.iter().map(|line| line.len()).sum();\nstr.reserve(capacity);\n```\nAfter:\n```rust\nlet capacity: usize = self\n    .lines\n    .iter()\n    .map(|line| line.iter().map(|c| c.ch.len_utf8()).sum::<usize>() + 1)\n    .sum();\nstr.reserve(capacity);\n```","locations":[{"ref":"src/renderer/styled_buffer.rs:49-51","code":"   49 |         let capacity = self.lines.iter().map(|line| line.len()).sum();\n   50 |         str.reserve(capacity);\n   51 | ","lines":3,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/styled_buffer.rs#L49-L51"}]},{"id":"PERF_11","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`Patch::trim_trivial_replacements` always heap-allocates the trimmed replacement via `Cow::Owned(substr.to_owned())`, even though `substr` is by construction always a subslice of `trimmed.replacement` (every branch of `as_substr` returns a piece of its `suggestion` argument, never of `original`). `splice_lines` calls this for every patch of every suggestion, so a report with many patches performs one avoidable `String` allocation and copy per patch. The allocation is forced only because `as_substr` unifies both input lifetimes into one, hiding the fact that the result borrows from the suggestion.","fix":"Split the lifetimes in `as_substr` (`fn as_substr<'s>(original: &str, suggestion: &'s str) -> Option<(usize, &'s str, usize)>`) so the returned slice is known to borrow from `suggestion`, then compute the trimmed replacement as a byte range and reslice in place instead of copying:\n```rust\nif let Some((prefix, suffix)) = as_substr_range(snippet, &trimmed.replacement) {\n    trimmed.span = trimmed.original_span.start + prefix..trimmed.original_span.end.saturating_sub(suffix);\n    trimmed.replacement = match trimmed.replacement {\n        Cow::Borrowed(s) => Cow::Borrowed(&s[prefix..s.len() - suffix]),\n        Cow::Owned(mut s) => { s.truncate(s.len() - suffix); s.drain(..prefix); Cow::Owned(s) }\n    };\n}\n```","locations":[{"ref":"src/snippet.rs:447-467","code":"  447 |     pub(crate) fn trim_trivial_replacements(self, source: &str) -> TrimmedPatch<'a> {\n  448 |         let mut trimmed = TrimmedPatch {\n  449 |             original_span: self.span.clone(),\n  450 |             span: self.span,\n  451 |             replacement: self.replacement,\n  452 |         };\n  453 | \n  454 |         if trimmed.replacement.is_empty() {\n  455 |             return trimmed;\n  456 |         }\n  457 |         let Some(snippet) = source.get(trimmed.original_span.clone()) else {\n  458 |             return trimmed;\n  459 |         };\n  460 | \n  461 |         if let Some((prefix, substr, suffix)) = as_substr(snippet, &trimmed.replacement) {\n  462 |             trimmed.span = trimmed.original_span.start + prefix\n  463 |                 ..trimmed.original_span.end.saturating_sub(suffix);\n  464 |             trimmed.replacement = Cow::Owned(substr.to_owned());\n  465 |         }\n  466 |         trimmed\n  467 |     }","lines":21,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/snippet.rs#L447-L467"},{"ref":"src/renderer/source_map.rs:776-800","code":"  776 | pub(crate) fn as_substr<'a>(\n  777 |     original: &'a str,\n  778 |     suggestion: &'a str,\n  779 | ) -> Option<(usize, &'a str, usize)> {\n  780 |     if let Some(stripped) = suggestion.strip_prefix(original) {\n  781 |         Some((original.len(), stripped, 0))\n  782 |     } else if let Some(stripped) = suggestion.strip_suffix(original) {\n  783 |         Some((0, stripped, original.len()))\n  784 |     } else {\n  785 |         let common_prefix = original\n  786 |             .chars()\n  787 |             .zip(suggestion.chars())\n  788 |             .take_while(|(c1, c2)| c1 == c2)\n  789 |             .map(|(c, _)| c.len_utf8())\n  790 |             .sum();\n  791 |         let original = &original[common_prefix..];\n  792 |         let suggestion = &suggestion[common_prefix..];\n  793 |         if let Some(stripped) = suggestion.strip_suffix(original) {\n  794 |             let common_suffix = original.len();\n  795 |             Some((common_prefix, stripped, common_suffix))\n  796 |         } else {\n  797 |             None\n  798 |         }\n  799 |     }\n  800 | }","lines":25,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/source_map.rs#L776-L800"}]},{"id":"PERF_12","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"`normalize_untrusted_str` unconditionally allocates. `normalize_whitespace` is deliberately\nwritten to return `Cow::Borrowed(s)` on the common path where the input contains none of the\n`OUTPUT_REPLACEMENTS` characters, but `into_owned()` immediately throws that away and heap-copies\nthe string. For the overwhelmingly common clean-input case this turns a zero-allocation scan into\na full copy, and the only public entry point to the normalizer cannot opt out.","fix":"Return the `Cow` and let the caller decide:\n\n```rust\npub fn normalize_untrusted_str(s: &str) -> Cow<'_, str> {\n    renderer::normalize_whitespace(s)\n}\n```\n\nThis is a breaking change, so if the signature must stay, at minimum document that the function\nalways allocates, or add a `normalize_untrusted_cow` variant alongside it.","locations":[{"ref":"src/lib.rs:114-120","code":"  114 | /// Normalize the string to avoid any unicode control characters.\n  115 | ///\n  116 string()`, collects them into a `Vec<String>`, and then `join(\", \")` allocates a third time and copies everything again. `Iterator::intersperse` is unstable, but a simple `fold` avoids both the per-label `String` and the intermediate `Vec`.","fix":"Before:\n```rust\n.collect::<Vec<_>>()\n.join(\", \");\n```\n\nAfter (dropping the `msg.to_string()` in the `filter_map` and yielding `&str` instead):\n```rust\n.fold(String::new(), |mut acc, msg| {\n    if !acc.is_empty() {\n        acc.push_str(\", \");\n    }\n    acc.push_str(msg);\n    acc\n});\n```","locations":[{"ref":"src/renderer/render.rs:249-266","code":"  249 |         let labels_inner = cause\n  250 |             .markers\n  251 |             .iter()\n  252 |             .filter_map(|ann| match &ann.label {\n  253 |                 Some(msg) if ann.kind.is_primary() => {\n  254 |                     if !msg.trim().is_empty() {\n  255 |                         Some(msg.to_string())\n  256 |                     } else {\n  257 |                         None\n  258 |                     }\n  259 |                 }\n  260 |                 _ => None,\n  261 |             })\n  262 |             .collect::<Vec<_>>()\n  263 |             .join(\", \");\n  264 |         if !labels_inner.is_empty() {\n  265 |             labels = Some(labels_inner);\n  266 |         }","lines":18,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/render.rs#L249-L266"}]},{"id":"PERF_15","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"`max_line_num_len` leading spaces are written one `buffer.append` call at a time. Each `append` reads `self.lines[line].len()`, then `puts` re-checks bounds and may `resize` the row `Vec` - so an O(n) sequence of resizes replaces what a single `puts` of an n-space string would do.","fix":"Before:\n```rust\nfor _ in 0..max_line_num_len {\n    buffer.append(buffer_msg_line_off e_change, DisplaySuggestion::Underline) {\n 1672 |                     // If this is a replacement, underline with `~`, if this is an addition\n 1673 |                     // underline with `+`.\n 1674 |                     buffer.putc(\n 1675 |                         row_num,\n 1676 |                         (padding as isize + p) as usize,\n 1677 |                         if part.is_addition(sm) {\n 1678 |                             '+'\n 1679 |                         } else {\n 1680 |                             renderer.decor_style.diff()\n 1681 |                         },\n 1682 |                         ElementStyle::Addition,\n 1683 |                     );\n 1684 |                 }\n 1685 |             }","lines":16,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/render.rs#L1670-L1685"}]},{"id":"PERF_17","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"`set_style_range` calls `set_style` once per column, and each `set_style` call redoes `self.lines.get_mut(line)` - a bounds check and pointer chase for the row - before touching a single cell. For a wide highlighted span this repeats the row lookup once per column. The same pattern appears in `draw_range` in `render.rs`, which calls `putc` per column and thus re-runs `ensure_lines` plus two bounds checks for every character.","fix":"Resolve the row once and iterate the slice:\n```rust\npub(crate) fn set_style_range(\n    &mut self,\n    line: usize,\n    col_start: usize,\n    col_end: usize,\n    style: ElementStyle,\n    overwrite: bool,\n) {\n    let Some(line) = self.lines.get_mut(line) else {\n        return;\n    };\n    let end = col_end.min(line.len());\n    for c in &mut line[col_start.min(end)..end] {\n        if overwrite || matches!(c.style, ElementStyle::NoStyle | ElementStyle::Quotation) {\n            c.style = style;\n        }\n    }\n}\n```","locations":[{"ref":"src/renderer/styled_buffer.rs:142-153","code":"  142 |     pub(crate) fn set_style_range(\n  143 |         &mut self,\n  144 |         line: usize,\n  145 |         col_start: usize,\n  146 |         col_end: usize,\n  147 |         style: ElementStyle,\n  148 |         overwrite: bool,\n  149 |     ) {\n  150 |         for col in col_start..col_end {\n  151 |             self.set_style(line, col, style, overwrite);\n  152 |         }\n  153 |     }","lines":12,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/styled_buffer.rs#L142-L153"}]},{"id":"PERF_18","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"`Group::with_title` clones the whole `Level` out of the title just to store it a second time in `primary_level`, and `Level` can own a `Cow<'a, str>` name (`Level::with_name`), so this is a real `String` copy whenever a custom owned level name is used. The two fields can never disagree for a group built with `with_title`, so the field is pure duplicated state; the renderer clones it a third time at `src/renderer/render.rs:52`.","fix":"Store the level once and derive it on read, e.g. make `primary_level` an `Option<Level<'a>>` set only by `Group::with_level` and add a `pub(crate) fn primary_level(&self) -> &Level<'a>` that falls back to `self.title.as_ref().map(|t| &t.level)`; then take `&group.primary_level()` in `render` instead of `group.primary_level.clone()`.","locations":[{"ref":"src/snippet.rs:49-62","code":"   49 | pub struct Group<'a> {\n   50 |     pub(crate) primary_level: Level<'a>,\n   51 |     pub(crate) title: Option<Title<'a>>,\n   52 |     pub(crate) elements: Vec<Element<'a>>,\n   53 | }\n   54 | \n   55 | impl<'a> Group<'a> {\n   56 |     /// Create group with a [`Title`], deriving [`AnnotationKind::Primary`] from its [`Level`]\n   57 |     pub fn with_title(title: Title<'a>) -> Self {\n   58 |         let level = title.level g.\n 1100 |     if line_info.annotations.iter().all(LineAnnotation::is_line) {\n 1101 |         return vec![];\n 1102 |     }","lines":5,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/render.rs#L1098-L1102"}]},{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"The `else` branches of `add_annotation_to_file` and `keep_line` are unreachable. `annotated_line_infos` is initialised with one entry per element of `self.lines` (lines 161-170) and is only shrunk *after* all annotation insertion (the `fold` `retain` at line 322), while every `line_index` passed in is derived from a `Loc::line` or from a range strictly between two `Loc::line`s, and `line_index` values are contiguous by construction. The `find` therefore always succeeds. The dead branches also contain a `.unwrap()` that would panic and an `annotated_line_infos.sort_by_key(...)` that would make insertion O(n log n) per call, so they are a latent panic plus misleading complexity rather than a safety net.","fix":"Collapse both helpers to the lookup they actually perform, e.g.\n```rust\nfn add_annotation_to_file(&self, infos: &mut [AnnotatedLineInfo<'a>], line_index: usize, line_ann: LineAnnotation<'a>) {\n    let line_info = infos\n        .iter_mut()\n        .find(|li| li.line_index == line_index)\n        .expect(\"annotated_line_infos covers every line of the source map\");\n    line_info.annotations.push(line_ann);\n}\n```\nwhich also lets the parameter be `&mut [..]` instead of `&mut Vec<..>`.","locations":[{"ref":"src/renderer/source_map.rs:335-354","code":"  335 |         if let Some(line_info) = annotated_line_infos\n  336 |             .iter_mut()\n  337 |             .find(|line_info| line_info.line_index == line_index)\n  338 |         {\n  339 |             line_info.annotations.push(line_ann);\n  340 |         } else {\n  341 |             let info = self\n  342 | ::is_empty` is the only public item in this file with no doc comment, and it is never called anywhere in the crate (no use in `src/`, `tests/`, `examples/` or `benches/`). Its semantics are also non-obvious: it ignores `primary_level`, so `Group::with_level(Level::ERROR).is_empty()` is `true` even though the group is a fully constructed value that renders (as an empty string).","fix":"Before:\n```rust\n    pub fn is_empty(&self) -> bool {\n```\nAfter:\n```rust\n    /// Whether this group has neither a [`Title`] nor any [`Element`]s\n    ///\n    /// Such a group renders as nothing; the group's [`Level`] is not considered content.\n    pub fn is_empty(&self) -> bool {\n```","locations":[{"ref":"src/snippet.rs:93-95","code":"   93 |     pub fn is_empty(&self) -> bool {\n   94 |         self.elements.is_empty() && self.title.is_none()\n   95 |     }","lines":3,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/snippet.rs#L93-L95"}]},{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"medium","difficulty":"easy","description":"The doc-comment on `normalize_untrusted_str` makes two claims that the implementation\ncontradicts:\n\n1. \"This is important for untrusted input, as it can contain **invalid unicode sequences**\" -\n   the parameter is `&str`, which Rust guarantees to be valid UTF-8. A `&str` can never hold an\n   invalid unicode sequence, so the stated motivation is impossible.\n2. \"Normalize the string to avoid **any** unicode control characters\" - `normalize_whitespace`\n   only rewrites a fixed table (`OUTPUT_REPLACEMENTS`): the C0 controls, `DEL`, `U+200D`, and the\n   bidi controls `U+202A..U+202E` / `U+2066..U+2069`. The C1 control block `U+0080..U+009F`\n   (which includes `U+009B`, the single-byte CSI that some terminals honour) is *not* handled,\n   so \"any unicode control characters\" overstates the guarantee.\n\nAdditionally, the biggest observable behaviour of the function is entirely undocumented: the\ntable maps `('\\t', \"    \")`, so the function silently expands every tab into four spaces.\nVerified: `normalize_untrusted_str(\"a\\tb\")` returns `\"a    b\"`. A caller reading this doc would\nnot expect a \"normalize control characters\" helper to reflow their indentation.","fix":"Reword to describe what the function actually does, e.g.\n\n```rust\n/// Replace terminal-hostile characters so untrusted text can be safely rendered.\n///\n/// Control characters (`U+0000..U+001F`, `U+007F`) are replaced with their Unicode \"control\n/// picture\" glyphs, the bidi overrides/isolates (`U+202A..U+202E`, `U+2066..U+2069`) and\n/// `U+200D` are replaced, and each tab is expanded to four spaces. Newlines are preserved.\n```\n\nand drop the \"invalid unicode sequences\" sentence. If C1 controls are meant to be covered, add\n`U+0080..U+009F` to `OUTPUT_REPLACEMENTS`.","locations":[{"ref":"src/lib.rs:114-120","code":"  114 | /// Normalize the string to avoid any unicode control characters.\n  115 | ///\n  116 | /// This is important for untrusted input, as it can contain\n  117 | /// invalid unicode sequences.\n  118 | pub fn normalize_untrusted_str(s: &str) -> String {\n  119 |     renderer::normalize_whitespace(s).into_owned()\n  120 | }","lines":7,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/lib.rs#L114-L120"},{"ref":"src/renderer/render.rs:2515-2534","code":" 2515 | pub(crate) fn normalize_whitespace(s: &str) -> Cow<'_, str> {\n 2516 |     if !s\n 2517 |         .chars()\n 2518 |         .any(|user| OUTPUT_REPLACEMENTS.iter().any(|(bad, _)| user == *bad))\n 2519 |     {\n 2520 |         return Cow::Borrowed(s);\n 2521 |     }\n 2522 | \n 2523 |     // Scan the input string for a character in the ordered table above.\n 2524 |     // If it's present, replace it with its alternative string (it can be more than 1 char!).\n 2525 |     // Otherwise, retain the input char.\n 2526 |     let normalized = s.chars().fold(String::with_capacity(s.len()), |mut s, c| {\n 2527 |         match OUTPUT_REPLACEMENTS.binary_search_by_key(&c, |(k, _)| *k) {\n 2528 |             Ok(i) => s.push_str(OUTPUT_REPLACEMENTS[i].1),\n 2529 |             _ => s.push(c),\n 2530 |         }\n 2531 |         s\n 2532 |     });\n 2533 |     Cow::Owned(normalized)\n 2534 | }","lines":20,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/render.rs#L2515-L2534"}]},{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"medium","difficulty":"easy","description":"The doc comment on `Title::id` states: \"Text passed to this function is considered \"untrusted input\", as such all text is passed through a normalization function.\" That is false - the id is written to the output buffer verbatim at `src/renderer/render.rs:367` (`buffer.append(buffer_msg_line_offset, id, label_style)`), with no `normalize_whitespace` call anywhere on the path. Verified: `Level::ERROR.primary_title(\"t\").id(\"E\\u{7}03\\t08\")` renders `error[E\\u{7}03\\t08]: t`, i.e. the BEL control character and the raw tab reach the terminal. Title *text* really is normalized (`src/renderer/render.rs:401-405`), which makes the discrepancy easy to miss and the doc actively misleading for anyone relying on it for untrusted diagnostic codes.","fix":"Normalize at render time, e.g. `buffer.append(buffer_msg_line_offset, &normalize_whitespace(id), label_style)` in `render_title`, and use the normalized string's display width for `label_width` as well; otherwise delete the \"passed through a normalization function\" claim from the `Title::id` doc comment and tell callers to run `normalize_untrusted_str` themselves.","locations":[{"ref":"src/snippet.rs:169-183","code":"  169 |     /// The category for this [`Report`]\n  170 |     ///\n  171 |     /// Useful for looking searching for more information to resolve the diagnostic.\n  172 |     ///\n  173 |     /// <div class=\"warning\">\n  174 |     ///\n  175 |     /// Text passed to this function is considered \"untrusted input\", as such\n  176 |     /// all text is passed through a normalization function. Styled text is\n  177 |     /// not allowed to be passed to this function.\n  178 |     ///\n  179 |     /// <\/div>\n  180 |     pub fn id(mut self, id: impl Into<Cow<'a, str>>) -> Self {\n  181 |         self.id.get_or_insert(Id::default()).id = Some(id.into());\n  182 |         self\n  183 |     }","lines":15,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/snippet.rs#L169-L183"},{"ref":"src/renderer/render.rs:355-373","code":"  355 |     if title.level().name != Some(None) {\n  356 |         buffer.append(buffer_msg_line_offset, title.level().as_str(), label_style);\n  357 |         label_width += title.level().as_str().len();\n  358 |         if let Some(Id { id: Some(id), url }) = &title.id() {\n  359 |             buffer.append(buffer_msg_line_offset, \"[\", label_style);\n  360 |             if let Some(url) = url.as_ref() {\n  361 |                 buffer.append(\n  362 |                     buffer_msg_line_offset,\n  363 |                     &format!(\"\\x1B]8;;{url}\\x1B\\\\\"),\n  364 |                     label_style,\n  365 |                 );\n  366 |             }\n  367 |             buffer.append(buffer_msg_line_offset, id, label_style);\n  368 |             if url.is_some() {\n  369 |                 buffer.append(buffer_msg_line_offset, \"\\x1B]8;;\\x1B\\\\\", label_style);\n  370 |             }\n  371 |             buffer.append(buffer_msg_line_offset, \"]\", label_style);\n  372 |             label_width += 2 + id.len();\n  373 |         }","lines":19,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/render.rs#L355-L373"}]},{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"medium","difficulty":"easy","description":"Both `Snippet::path` and `Origin::path` carry the warning \"Text passed to this function is considered \"untrusted input\", as such all text is passed through a normalization function.\" Paths are never normalized: `render_origin` builds the string with `format!(\"{}:{}:{}\", origin.path, line, col)` and appends it directly. Verified: `Snippet::source(..).path(\"f\\u{7}i\\tl\\u{202e}e.rs\")` renders `--> f\\u{7}i\\tl\\u{202e}e.rs:1:1`, passing through BEL, a raw tab and a U+202E RIGHT-TO-LEFT OVERRIDE - exactly the characters `OUTPUT_REPLACEMENTS` exists to strip. A file path is very often attacker-controlled (it comes from the compiled project), so the guarantee the doc makes is the one that matters most here.","fix":"Apply the existing normalizer in `render_origin`:\n```rust\nlet path = normalize_whitespace(&origin.path);\nlet str = match (&origin.line, &origin.char_column) {\n    (Some(line), Some(col)) => format!(\"{path}:{line}:{col}\"),\n    (Some(line), None) => format!(\"{path}:{line}\"),\n    _ => path.into_owned(),\n};\n```\n(and likewise for the suggestion/secondary origin paths), or remove the false normalization claim from both doc comments.","locations":[{"ref":"src/snippet.rs:260-272","code":"  260 |     /// The location of the [`source`][Self::source] (e.g. a path)\n  261 |     ///\n  262 |     /// <div class=\"warning\">\n  263 |     ///\n  264 |     /// Text passed to this function is considered \"untrusted input\", as such\n  265 |     /// all text is passed through a normalization function. Pre-styled text is\n  266 |     /// not allowed to be passed to this function.\n  267 |     ///\n  268 |     /// <\/div>\n  269 |     pub fn path(mut self, path: impl Into<OptionCow<'a>>) -> Self {\n  270 |         self.path = path.into().0;\n  271 |         self\n  272 |     }","lines":13,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/s ip that\nmakes the walkthrough look like the two suggestions patch different lines.","fix":"before:\n```text\n   ╭╴\n21 -     let _ = Box {};\n21 +     let _ = Box::new(_);\n   ├╴\n```\nafter:\n```text\n   ╭╴\n17 -     let _ = Box {};\n17 +     let _ = Box::new(_);\n   ├╴\n```","locations":[{"ref":"src/lib.rs:49-55","code":"   49 | //! [`Patch`] Option 1 on a [`Snippet`]\n   50 | //! ```text\n   51 | //!    ╭╴\n   52 | //! 21 -     let _ = Box {};\n   53 | //! 21 +     let _ = Box::new(_);\n   54 | //!    ├╴\n   55 | //! ```","lines":7,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/lib.rs#L49-L55"}]},{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The `# Cargo `features`` section documents only `simd` and `testing-colors`, but `Cargo.toml`\ndeclares four features: `default = [\"std\"]`, `std`, `simd`, `testing-colors`. `std` is the one\nfeature with real semantic consequences - `#![cfg_attr(all(not(feature = \"std\"), not(test)),\nno_std)]` means the crate is `no_std`-capable only when default features are disabled - and it is\ndocumented neither here nor in `README.md` (grep for `no_std` / `default-features` in `README.md`\nreturns nothing). A `no_std` user has no way to discover that this crate supports them.\n\nSeparately, the fenced block at lines 94-96 starts in column 0 while the list item it belongs to\nrequires 2-space indentation, so CommonMark closes the `<ul>` before the code block and the\ncommand renders as a sibling of the list rather than as part of the `testing-colors` bullet.","fix":"Document the `std` feature and indent the fence into the list item:\n\n```rust\n//! # Cargo `features`\n//!\n//! - `std` *(default)* - Enables `std` support. Disable with\n//!   `default-features = false` to build the crate as `no_std` (an allocator is still required).\n//!\n//! - `simd` - Speeds up folding\n//!\n//! - `testing-colors` - Makes [`Renderer::styled`] colors OS independent, which\n//!   allows for easier testing when testing colored output. It should be added as\n//!   a feature in `[dev-dependencies]`, which can be done with the following command:\n//!   ```text\n//!   cargo add annotate-snippets --dev --features testing-colors\n//!   ```\n```","locations":[{"ref":"src/lib.rs:87-96","code":"   87 | //! # Cargo `features`\n   88 | //!\n   89 | //! - `simd` - Speeds up folding\n   90 | //!\n   91 | //! - `testing-colors` - Makes [Renderer::styled] colors OS independent, which\n   92 | //! allows for easier testing when testing colored output. It should be added as\n   93 | //! a feature in `[dev-dependencies]`, which can be done with the following command:\n   94 | //! ```text\n   95 | //! cargo add annotate-snippets --dev --feature testing-colors\n   96 | //! ```","lines":10,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/lib.rs#L87-L96"},{"ref":"src/lib.rs:98","code":"   98 | #![cfg_attr(all(not(feature = \"std\"), not(test)), no_std)]","lines":1,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/lib.rs#L98"}]},{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The crate-level features heading is `# Cargo `features``, which rustdoc turns into the anchor id\n`cargo-features`. `Renderer::styled` links to it as `crate#features`, which resolves to\n`../index.html#features` - an anchor that does not exist, so the link lands at the top of the\ncrate page instead of the features section.\n\nVerified against the generated docs:\n\n```text\n$ grep -o 'id=\"[a-z-]*features[a-z-]*\"' target/doc/annotate_snippets/index.html\nid=\"cargo-features\"\n$ grep -o 'href=\"[^\"]*#features\"' target/doc/annotate_snippets/renderer/struct.Renderer.html\nhref=\"../index.html#features\"\n```\n\nrustdoc's `broken_intra_doc_links` lint does not validate `#fragment` suffixes, so this is silent.","fix":"Point the link at the real anchor. In `src/renderer/mod.rs:136`:\n\nbefore:\n```rust\n    /// When testing styled terminal output, see the [`testing-colors` feature](crate#features)\n```\nafter:\n```rust\n    /// When testing styled terminal output, see the [`testing-colors` feature](crate#cargo-features)\n```","locations":[{"ref":"src/lib.rs:87","code":"   87 | //! # Cargo `features`","lines":1,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/lib.rs#L87"},{"ref":"src/renderer/mod.rs:136","code":"  136 |     /// When testing styled terminal output, see the [`testing-colors` feature](crate#features)","lines":1,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/mod.rs#L136"}]},{"id":"CMT_7","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The copy-pasteable command in the crate-level docs uses `--feature`, which is not a `cargo add`\nflag; the flag is `-F` / `--features`. Running the documented command fails with\n`error: unexpected argument '--feature' found`.\n\nVerified: `cargo add --help` lists only `--no-default-features`, `--default-features` and\n`-F, --features <FEATURES>`.","fix":"before:\n```text\ncargo add annotate-snippets --dev --feature testing-colors\n```\nafter:\n```text\ncargo add annotate-snippets --dev --features testing-colors\n```","locations":[{"ref":"src/lib.rs:94-96","code":"   94 | //! ```text\n   95 | //! cargo add annotate-snippets --dev --feature testing-colors\n   96 | //! ```","lines":3,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/lib.rs#L94-L96"}]},{"id":"CMT_8","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"Every field doc on `Margin` describes the *raw* column, but `Margin::new` stores a value biased by `ELLIPSIS_PASSING` (6): `whitespace_left` is stored as `whitespace_left.saturating_sub(6)`, `span_left` as `span_left.saturating_sub(6)`, `span_right` as `span_right + 6` and `label_right` as `label_right + 6`. So `\"The column of the beginning of left-most span\"` is off by -6 and `\"The column of the end of right-most span\"` is off by +6. This is not cosmetic: the guard `self.label_right >= self.whitespace_left` (whose comment says it protects against \"the right-most label ... within [the whitespace]\") is actually comparing `real_label_right + 6` against `real_whitespace - 6`, i.e. it is skewed by 12 columns relative to what the comment describes.","fix":"Either document the bias on each field (e.g. `/// The column of the beginning of the left-most span, less ELLIPSIS_PASSING`) or, better, store the raw columns and apply `ELLIPSIS_PASSING` at the comparison sites in `compute` so that `span_left`, `span_right`, `label_right` and `whitespace_left` mean exactly what their docs say.","locations":[{"ref":"src/renderer/margin.rs:9-23","code":"    9 |     /// The available whitespace in the left that can be consumed when centering.\n   10 |     whitespace_left: usize,\n   11 |     /// The column of the beginning of left-most span.\n   12 |     span_left: usize,\n   13 |     /// The column of the end of right-most span.\n   14 |     span_right: usize,\n   15 |     /// The beginning of the line to be displayed.\n   16 |     computed_left: usize,\n   17 |     /// The end of the line to be displayed.\n   18 |     computed_right: usize,\n   19 |     /// The current width of the terminal. 140 by default and in tests.\n   20 |     pub(crate) term_width: usize,\n   21 |     /// The end column of a span label, including the span. Doesn't account for labels not in the\n   22 |     /// same line as the span.\n   23 |     label_right: usize,","lines":15,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/margin.rs#L9-L23"},{"ref":"src/renderer/margin.rs:44-52","code":"   44 |         let mut m = Margin {\n   45 |             whitespace_left: whitespace_left.saturating_sub(ELLIPSIS_PASSING),\n   46 |             span_left: span_left.saturating_sub(ELLIPSIS_PASSING),\n   47 |             span_right: span_right + ELLIPSIS_PASSING,\n   48 |             computed_left: 0,\n   49 |             computed_right: 0,\n   50 |             term_width,\n   51 |             label_right: label_right + ELLIPSIS_PASSING,\n   52 |         };","lines":9,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/margin.rs#L44-L52"}]},{"id":"CMT_9","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"`Margin::term_width` is documented as\n```rust\n/// The current width of the terminal. 140 by default and in tests.\npub(crate) term_width: usize,\n```\n(`src/renderer/margin.rs:19-20`), but the only construction site passes the *remaining code column\nwidth*, not the terminal width:\n\n```rust\n// src/renderer/render.rs:675-691\nlet width_offset = 3 + max_line_num_len;\nlet code_offset = if multiline_depth == 0 { width_offset } else { width_offset + multiline_depth + 1 };\nlet column_width = renderer.term_width.saturating_sub(code_offset);\nlet margin = Margin::new(whitespace_margin, span_left_margin, span_right_margin,\n                         label_right_margin, column_width, max_line_len);\n```\n\nSo with the default `DEFAULT_TERM_WIDTH = 140` and a 2-digit line-number gutter, `term_width` is\n135, not 140 - and the \"140 by default and in tests\" claim is never true in practice. `Margin` also\ncompares this value against `computed_right - computed_left` and `label_right - span_left`\n(margin.rs:72-92), which are *code-local* columns, so the field is being used correctly and only\nthe name and doc are wrong.\n\n`render_source_line` then reads the field back out as if it were a terminal measurement:\n`if width > margin.term_width * 2` and `max(margin.term_width / 3, MIN_PAD)`\n(render.rs:1403-1406), which is the kind of misreading the wrong name invites.","fix":"Rename the field and its constructor parameter to reflect what it holds and fix the doc:\n\n```rust\n/// The number of columns available for source text, i.e.\n/// `Renderer::term_width` minus the gutter and multiline-depth offsets.\npub(crate) code_width: usize,\n```\n\nand update the six reads inside `Margin::compute`/`Margin::right` (margin.rs:72-106) plus the two\nreads in `render_source_line` (render.rs:1403, 1406) accordingly.","locations":[{"ref":"src/renderer/margin.rs:19-20","code":"   19 |     /// The current width of the terminal. 140 by default and in tests.\n   20 |     pub(crate) term_width: usize,","lines":2,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/margin.rs#L19-L20"},{"ref":"src/renderer/render.rs:682-691","code":"  682 |     let column_width = renderer.term_width.saturating_sub(code_offset);\n  683 | \n  684 |     let margin = Margin::new(\n  685 |         whitespace_margin,\n  686 |         span_left_margin,\n  687 |         span_right_margin,\n  688 |         label_right_margin,\n  689 |         column_width,\n  690 |         max_line_len,\n  691 |     );","lines":10,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/render.rs#L682-L691"},{"ref":"src/renderer/render.rs:1403-1406","code":" 1403 |         if width > margin.term_width * 2 && width > (MIN_PAD * 2 + margin_width) {\n 1404 |             // If the terminal is *too* small, we keep at least a tiny bit of the span for\n 1405 |             // display.\n 1406 |             let pad = max(margin.term_width / 3, MIN_PAD);","lines":4,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9 T_11","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The ASCII-art legend above `DecorStyle::underline` labels two glyphs with field names that do not exist on `UnderlineParts`. `< top_right` should be `bottom_right` (the primary `┙` is stored in the `bottom_right` field), and `< bottom_right_with_text` should be `multiline_bottom_right_with_text`. The legend is the only documentation of what each of the 15 `UnderlineParts` fields draws, so wrong names here directly mislead anyone adding a new `DecorStyle`.","fix":"Before:\n```rust\n//           top_left > ┏│━━━┙ < top_right\n// multiline_vertical > ┃│\n//                      ┃│   X1 Y1\n//                      ┃│   X2 Y2\n//                      ┃└────╿──┘ < multiline_end_same_line\n//        bottom_left > ┗━━━━━┥ < bottom_right_with_text\n```\nAfter:\n```rust\n//           top_left > ┏│━━━┙ < bottom_right\n// multiline_vertical > ┃│\n//                      ┃│   X1 Y1\n//                      ┃│   X2 Y2\n//                      ┃└────╿──┘ < multiline_end_same_line\n//        bottom_left > ┗━━━━━┥ < multiline_bottom_right_with_text\n```","locations":[{"ref":"src/renderer/mod.rs:342-346","code":"  342 |         //                      ┃│   X1 Y1\n  343 |         //                      ┃│   X2 Y2\n  344 |         //                      ┃└────╿──┘ < multiline_end_same_line\n  345 |         //        bottom_left > ┗━━━━━┥ < bottom_right_with_text\n  346 |         //   multiline_horizontal ^   `X` is a good letter","lines":5,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/mod.rs#L342-L346"}]},{"id":"CMT_12","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The `FIXME` claims the arm is not exercised by any test, but it is: replacing the body with a\n`panic!` fails `multiple_replacements`, `suggestion_no_fold`,\n`suggestion he (0-based) column offset.\n  653 |     pub(crate) char: usize,\n  654 |     /// The (0-based) column offset when displayed.\n  655 |     pub(crate) display: usize,\n  656 |     /// The (0-based) byte offset.\n  657 |     pub(crate) byte: usize,\n  658 | }","lines":12,"link":"https://github.com/rust-lang/annotate-snippets-rs/blob/52add15aada8827a42460fe0c9446c1416b7fcc6/src/renderer/source_map.rs#L647-L658"}]},{"id":"CMT_15","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment on `SubstitutionHighlight` says the type translates between spans and **byte** positions, but `start`/`end` are filled from `Loc::char` and from `chars()` counts, and the `SplicedLines` type alias two declarations above correctly documents the same vectors as \"Char spans\". The consumer (`style_substitution_highlights` / `extra_width_from_tabs` in `render.rs`) also treats them as character offsets. The contradictory doc directly invites the byte/char mixups seen elsewhere (e.g. `render.rs:1858` compares one of these `end` values against `line_to_add.len()`, a byte length).","fix":"```rust\n// before\n/// Used to translate between `Span`s and byte positions within a single output line in highlighted\n/// code of structured suggestions.\n// after\n/// Used to translate between `Span`s and character offsets within a single output line in\n/// highlighted code of structured suggestions.\n```","locations":[{"ref":"src/renderer/source_map.rs:717-733","code":"  717 | pub(crate) type SplicedLines<'a> = (\n  718 |     String,\n  719 |     Vec<TrimmedPatch<'a>>,\n  720 |     // Char spans to highlight per line of the post-substitution output.\n  721 |     Vec<Vec<SubstitutionHighlight>>,\n  722 |     // Char spans of the replaced (original) code, per original line in the\n  723 |     // bounding range covered by the splice.\n  724 |     Vec<Vec<SubstitutionHighlight>>,\n  725 | );\n  726 | \n  727 | /// Used to translate betwe ulty":"medium","description":"`src/renderer/render.rs` contains two hand-maintained parallel tables that must agree on the\ndisplay width of every special character, with nothing but a comment enforcing the invariant:\n\n- `char_width` (render.rs:2298-2315) lists 41 control/bidi code points that must render as width 1,\n  plus `'\\t' => 4`. Its comment says \"Keep the following list in sync with\n  `rustc_errors::emitter::OUTPUT_REPLACEMENTS`\".\n- `OUTPUT_REPLACEMENTS` (render.rs:2467-2513) maps 43 code points to their replacement strings, and\n  is what `normalize_whitespace` (render.rs:2515-2534) actually substitutes before emission. Its\n  comment says \"Keep the following list in sync with `rustc_span::char_width`.\"\n\nThe invariant they encode is `str_width(s) == str_width(normalize_whitespace(s))` - layout is\ncomputed on the *raw* line (`max_line_len = max(max_line_len, str_width(line_info.line))`,\nrender.rs:666; `Loc::display` via `char_width`, source_map.rs:74) while emission writes the\n*normalized* line (`normalize_whitespace(line_info.line)`, render.rs:855). Any entry present in one\ntable and absent from the other silently shifts every underline and label on that line.\n\nThe tables currently do agree (each replacement is 1 column except `'\\t' -> \"    \"` at 4 and\n`'\\u{200d}' -> \"\"` at 0, matching `char_width`), but the only test that exists\n(`ensure_output_replacements_is_sorted`, render.rs:2763-2773) checks sortedness and de-duplication -\nnot width agreement. `'\\u{200d}'` (ZWJ) is in `OUTPUT_REPLACEMENTS` but not in `char_width`'s\nexplicit list; it happens to work only because `unicode_width` independently reports 0 for it.","fix":"Derive one table from the other so they cannot drift, and pin the invariant with a test:\n\n```rust\npub(crate) fn char_width(ch: char) -> usize {\n    match OUTPUT_REPLACEMENTS.binary_search_by_key(&ch, |(k, _)| *k) {\n        Ok(i) => OUTPUT_REPLACEMENTS[i].1.chars()\n            .map(|c| unicode_width::Unico ine_num_len + 3` (the code column) appears **8** times (lines 396, 1518, 1669, 1759, 1807,\n  1882, 1943, 1944)\n- `width_offset - 2` appears **4** times (lines 876, 1141, 1148, 2059) - and `width_offset` is\n  itself defined as `3 + max_line_num_len` at line 675, so `width_offset - 2` *is*\n  `max_line_num_len + 1`, i.e. the same column is spelled two different ways in the same file.\n\nWorse, the two rendering paths use *different* spellings for the same columns: the snippet path\ncarries `width_offset`/`code_offset` (computed once at render.rs:675-680, and `code_offset` grows\nby `multiline_depth + 1`), while the suggestion path hardcodes `max_line_num_len + 3`\n(render.rs:1518, 1759, 1807, 1882, 1943) and never accounts for multiline depth. There is no single\nplace to read to learn the output's column layout, and a change to the gutter requires editing 40\ncall sites.\n\nThe magic `3` is even documented three separate times in ASCII art comments (render.rs:378-395,\n1875-1879, and again implicitly at 1669) rather than named once.","fix":"Introduce a small value type and use it everywhere:\n\n```rust\n#[derive(Clone, Copy)]\nstruct Gutter {\n    max_line_num_len: usize,\n    multiline_depth: usize,\n}\n\nimpl Gutter {\n    /// Column of the `|` / `│` separator.\n    fn sep_col(self) -> usize { self.max_line_num_len + 1 }\n    /// Column where source text starts.\n    fn code_col(self) -> usize {\n        self.max_line_num_len + 3\n            + if self.multiline_depth == 0 { 0 } else { self.multiline_depth + 1 }\n    }\n    /// Legacy `width_offset` (== `sep_col() + 2`).\n    fn width_offset(self) -> usize { self.max_line_num_len + 3 }\n}\n```\n\nThen `draw_col_separator_no_space(renderer, buffer, line, width_offset - 2)` becomes\n`painter.draw_col_separator_no_space(line, gutter.sep_col())`, and the suggestion path picks up\nmultiline-depth awareness for free instead of hardcoding `max_line_num_len + 3`.","locations":[{"ref":"src/renderer/render.rs:675-691","co n (`draw_line`, `draw_range`, `draw_multiline_line`,\n   `draw_col_separator*`, `draw_note_separator`, `draw_line_separator`),\n4. text metrics and normalization (`char_width`, `str_width`, `extra_width_from_tabs`,\n   `OUTPUT_REPLACEMENTS`, `normalize_whitespace`, `num_decimal_digits`),\n5. domain data types that are not rendering at all (`LineAnnotation`, `LineAnnotationType`,\n   `DisplaySuggestion`, `ElementStyle`, `UnderlineParts`, `MessageOrTitle`).\n\nLayout and emission are literally interleaved inside `render_source_line`: it computes label\npositions into `annotations_position` (lines 1025-1127) and then, in the same function body,\nissues `buffer.putc` / `buffer.puts` / `buffer.replace` calls (lines 1140-1422), so there is no\npoint at which the computed layout can be inspected, unit-tested, or reused.","fix":"Split `render.rs` into a directory module:\n- `src/renderer/text.rs`: move `char_width`, `str_width`, `extra_width_from_tabs`,\n  `num_decimal_digits`, `OUTPUT_REPLACEMENTS` and `normalize_whitespace` (render.rs:2264-2534).\n  This also removes the odd dependency of the public `normalize_untrusted_str` in `src/lib.rs:118`\n  on the renderer module.\n- `src/renderer/annotation.rs`: move `LineAnnotation`, `LineAnnotationType`, `overlaps`,\n  `num_overlap` (render.rs:2317-2430), which `source_map.rs` already imports.\n- `src/renderer/style.rs` (or fold into `stylesheet.rs`): move `ElementStyle` and `UnderlineParts`\n  (render.rs:2536-2587).\n- `src/renderer/plan.rs`: move `pre_process`, `PreProcessedGroup`, `PreProcessedElement`,\n  `DisplaySuggestion` (render.rs:2596-2734).\n- `src/renderer/layout.rs`: extract the pure part of `render_source_line` (render.rs:1025-1127)\n  into `fn layout_annotations(annotations: &[LineAnnotation<'_>]) -> LineLayout` returning\n  `{ positions: Vec<(usize, &LineAnnotation)>, line_len: usize, overlap: Vec<bool> }`, so it can be\n  unit-tested without a `StyledBuffer`.\n- keep `render.rs` for emission only: `render_source
