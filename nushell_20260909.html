{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`Value::not_in` for CellPath-in-CellPath checks is logically incorrect. The `in` operator at line 3831-3838 computes: `rhs.members.windows(lhs.members.len()).any(|w| w == rhs.members)`. This checks if any window of the right-hand CellPath equals the entire right-hand CellPath's members - this is almost never true and certainly not what was intended (checking whether `lhs` is a sub-path of `rhs`). The `not_in` implementation at line 3898-3904 copies the same bug: `.all(|member_window| member_window != rhs.members)`. Both should compare `member_window == lhs.members` (the needle), not `rhs.members` (the haystack).","fix":"Change `member_window == rhs.members` to `member_window == lhs.members` in `in`, and `member_window != rhs.members` to `member_window != lhs.members` in `not_in`.","locations":[{"ref":"crates/nu-protocol/src/value/mod.rs:3867-3874","code":" 3867 |             (Value::CellPath { val: lhs, .. }, Value::CellPath { val: rhs, .. }) => {\n 3868 |                 Ok(Value::bool(\n 3869 |                     rhs.members\n 3870 |                         .windows(lhs.members.len())\n 3871 |                         .any(|member_window| member_window == rhs.members),\n 3872 |                     span,\n 3873 |                 ))\n 3874 |             }","lines":8,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-protocol/src/value/mod.rs#L3867-L3874"},{"ref":"crates/nu-protocol/src/value/mod.rs:3934-3940","code":" 3934 |             (Value::CellPath { val: lhs, .. }, Value::CellPath { val: rhs, .. }) => {\n 3935 |                 Ok(Value::bool(\n 3936 |                     rhs.members\n 3937 |                         .windows(lhs.members.len())\n 3938 |                         .all(|member_window| member_window != rhs.members),\n 3939 |                     span,\n 3940 |                 ))","lines":7,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-protocol/src/value/mod.rs#L3934-L3940"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`FloatRange::contains` has inverted boundary comparisons for the decreasing-range case. For a decreasing range (step < 0) the lower bound is `end` and upper bound is `start`. The code guards:\n  `Bound::Included(end) if value <= end => return false`  (line 436)\n  `Bound::Excluded(end) if value < end => return false`   (line 437)\nThis means values that are BELOW the end bound are rejected (correct), but the semantics are wrong for `Included`: a value equal to `end` should be INCLUDED (not rejected). The condition `value <= end` excludes the value at the end boundary for `Bound::Included`, which is wrong. Similarly for `Excluded`: `value < end` should reject values strictly below `end`, but the condition is correct for excluded. Wait - re-reading: for decreasing range, `end` is the minimum. `Included(end)` means `end` is valid. The guard fires when `value <= end`, i.e. when value is at or below end. But `value == end` should be accepted for Included. So the guard `value <= end` incorrectly rejects `value == end`.","fix":"For decreasing ranges with `Bound::Included(end)`, the check should be `value < end` (strictly below the lower bound is out of range). The current `value <= end` incorrectly excludes the endpoint.","locations":[{"ref":"crates/nu-protocol/src/value/range.rs:429-451","code":"  429 |         pub fn contains(&self, value: f64) -> bool {\n  430 |             if self.step < 0.0 {\n  431 |                 // Decreasing range\n  432 |                 if value > self.start {\n  433 |                     return false;\n  434 |                 }\n  435 |                 match self.end {\n  436 |                     Bound::Included(end) if value <= end => return false,\n  437 |                     Bound::Excluded(end) if value < end => return false,\n  438 |                     _ => {}\n  439 |                 };\n  440 |             } else {\n  441 |                 // Increasing range\n  442 |                 if value < self.start {\n  443 |                     return false;\n  444 |                 }\n  445 |                 match self.end {\n  446 |                     Bound::Included(end) if value >= end => return false,\n  447 |                     Bound::Excluded(end) if value > end => return false,\n  448 |                     _ => {}\n  449 |                 };\n  450 |             }\n  451 |             ((value - self.start) % self.step).abs() < f64::EPSILON","lines":23,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-protocol/src/value/range.rs#L429-L451"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`history --clear` only removes the history file but leaves SQLite auxiliary files intact when\n`HistoryFileFormat::Sqlite` is in use. The in-code comment \"TODO: FIXME also clear the auxiliary\nfiles when using sqlite\" acknowledges this. After `history --clear`, reedline re-opens SQLite and\nthe auxiliary files (WAL, SHM) from the previous session may reference freed pages, potentially\ncausing database corruption or incorrect history on the next launch.","fix":"When the format is Sqlite, also remove the `.sqlite3-wal` and `.sqlite3-shm` sibling files, or use the `SqliteBackedHistory` API to perform a clean truncation.","locations":[{"ref":"crates/nu-cli/src/commands/history/history_.rs:80-84","code":"   80 |         if call.has_flag(engine_state, stack, \"clear\")? {\n   81 |             let _ = std::fs::remove_file(history_path);\n   82 |             // TODO: FIXME also clear the auxiliary files when using sqlite\n   83 |             return Ok(PipelineData::empty());\n   84 |         }","lines":5,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cli/src/commands/history/history_.rs#L80-L84"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"Inverted condition in get_prompt_string for the right-prompt ANSI color-reset. The comment says 'Always reset the color at the start of the right prompt to ensure there is no ansi bleed over', but the guard is `if output.is_empty()`. When the right prompt IS populated, no reset is prepended, so ANSI color from the left prompt bleeds into it. When the right prompt is empty, a spurious `\\x1b[0m` reset is emitted (turning an absent right prompt into a non-None return value).","fix":"Change the condition to `if !output.is_empty() && prompt == PROMPT_COMMAND_RIGHT`.","locations":[{"ref":"crates/nu-cli/src/prompt_update.rs:81-85","code":"   81 |     // Always reset the color at the start of the right prompt\n   82 |     // to ensure there is no ansi bleed over\n   83 |     if output.is_empty() && prompt == PROMPT_COMMAND_RIGHT {\n   84 |         output.insert_str(0, \"\\x1b[0m\")\n   85 |     };","lines":5,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cli/src/prompt_update.rs#L81-L85"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `bits not` (not.rs), the `Eight` unsigned variant masks with `0x7F_FF_FF_FF_FF_FF` (line 151) which is only 7 bytes, not 8. For an 8-byte unsigned NOT the mask should be `0xFF_FF_FF_FF_FF_FF_FF_FF` (all 64 bits). The current mask silently clears the MSB, so `bits not` on a value in the range `[0x80_00_00_00_00_00..0xFF_FF_FF_FF_FF_FF]` returns a result with the top bit zeroed, which is incorrect.","fix":"Change the mask to `0xFF_FF_FF_FF_FF_FF_FF_FF` cast to i64, i.e. `!val & 0xFF_FF_FF_FF_FF_FF_FF_FFu64 as i64`, or use `(val as u64 ^ u64::MAX) as i64`.","locations":[{"ref":"crates/nu-cmd-extra/src/extra/bits/not.rs:151","code":"  151 |                     Eight => !val & 0x7F_FF_FF_FF_FF_FF,","lines":1,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cmd-extra/src/extra/bits/not.rs#L151"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`PluginInfo::is_modified` compares `name`, `filename`, `shell`, and `commands` between the engine state and the registry, but omits `version`. If a plugin is upgraded (new binary with a new version string), `plugin list` will show status `loaded` instead of `modified`, misleading the user into thinking nothing changed.","fix":"Add `|| self.version != other.version` to the `is_modified` predicate.","locations":[{"ref":"crates/nu-cmd-plugin/src/commands/plugin/list.rs:326-331","code":"  326 |     fn is_modified(&self, other: &PluginInfo) -> bool {\n  327 |         self.name != other.name\n  328 |             || self.filename != other.filename\n  329 |             || self.shell != other.shell\n  330 |             || self.commands != other.commands\n  331 |     }","lines":6,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cmd-plugin/src/commands/plugin/list.rs#L326-L331"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"VALID_CODES contains 't' (the string is \"lbhdirstun\"), but apply_code_to_style has no arm for 't' and falls through to the error branch. When a user writes attr = \"t\" or any concatenated code containing 't' (e.g. \"bt\"), the VALID_CODES guard at lines 912 and 929 accepts it as valid, then apply_code_to_style immediately returns Err(\"Unknown attribute code: 't'\"). The user sees a confusing error for a code that the validator itself deems acceptable. The 't' is almost certainly a leftover character that was never wired up.","fix":"Remove 't' from the VALID_CODES string, or add a handler for 't' in apply_code_to_style if it was meant to be an alias for strikethrough (currently 's'). Removing it is the safer fix.","locations":[{"ref":"crates/nu-color-config/src/nu_style.rs:33","code":"   33 | const VALID_CODES: &str = \"lbhdirstun\"; // blink, bold, dimmed, hidden, italic, reverse, strike, underline, normal","lines":1,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-color-config/src/nu_style.rs#L33"},{"ref":"crates/nu-color-config/src/nu_style.rs:910-914","code":"  910 |         if trimmed.len() == 1 {\n  911 |             let ch = trimmed.chars().next().unwrap_or('?').to_ascii_lowercase();\n  912 |             if VALID_CODES.contains(ch) {\n  913 |                 apply_code_to_style(ch, style)?;\n  914 |                 continue;","lines":5,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-color-config/src/nu_style.rs#L910-L914"},{"ref":"crates/nu-color-config/src/nu_style.rs:926-935","code":"  926 |         // Check if all characters are valid codes (concatenated codes like \"bi\" for bold+italic)\n  927 |         let is_codes = trimmed\n  928 |             .chars()\n  929 |             .all(|c| VALID_CODES.contains(c.to_ascii_lowercase()));\n  930 | \n  931 |         if is_codes {\n  932 |             // Treat as concatenated codes\n  933 |             for ch in trimmed.chars().map(|c| c.to_ascii_lowercase()) {\n  934 |                 apply_code_to_style(ch, style)?;\n  935 |             }","lines":10,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-color-config/src/nu_style.rs#L926-L935"},{"ref":"crates/nu-color-config/src/nu_style.rs:949-971","code":"  949 | fn apply_code_to_style(code: char, style: &mut Style) -> Result<(), ShellError> {\n  950 |     match code {\n  951 |         'l' => style.is_blink = true,\n  952 |         'b' => style.is_bold = true,\n  953 |         'd' => style.is_dimmed = true,\n  954 |         'h' => style.is_hidden = true,\n  955 |         'i' => style.is_italic = true,\n  956 |         'r' => style.is_reverse = true,\n  957 |         's' => style.is_strikethrough = true,\n  958 |         'u' => style.is_underline = true,\n  959 |         'n' => (),\n  960 |         _ => {\n  961 |             return Err(ShellError::Generic(\n  962 |                 GenericError::new_internal(\n  963 |                     \"Invalid ANSI attribute code\",\n  964 |                     format!(\"Unknown attribute code: '{}'\", code),\n  965 |                 )\n  966 |                 .with_help(VALID_CODES_HELP),\n  967 |             ));\n  968 |         }\n  969 |     }\n  970 |     Ok(())\n  971 | }","lines":23,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-color-config/src/nu_style.rs#L949-L971"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`rm` contains two redundant `paths.is_empty()` checks (lines 137 and 194). The first check at line 137 returns early with an error if paths is empty. Between lines 137 and 194 only the `for` loop and some config reads happen; no element is ever removed from `paths`. The second check at line 194 is therefore dead code that can never be true.","fix":"Remove the second `if paths.is_empty()` block at lines 194-200.","locations":[{"ref":"crates/nu-command/src/filesystem/rm.rs:137-142","code":"  137 |     if paths.is_empty() {\n  138 |         return Err(ShellError::MissingParameter {\n  139 |             param_name: \"requires file paths\".to_string(),\n  140 |             span: call.head,\n  141 |         });\n  142 |     }","lines":6,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-command/src/filesystem/rm.rs#L137-L142"},{"ref":"crates/nu-command/src/filesystem/rm.rs:194-200","code":"  194 |     if paths.is_empty() {\n  195 |         return Err(ShellError::Generic(GenericError::new(\n  196 |             \"rm requires target paths\",\n  197 |             \"needs parameter\",\n  198 |             span,\n  199 |         )));\n  200 |     }","lines":7,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-command/src/filesystem/rm.rs#L194-L200"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`handle_status_error` in `client.rs` uses an exact string comparison `response.header(\"content-type\") == Some(\"application/json\")` to decide whether to read the error body. In practice, servers typically send `Content-Type: application/json; charset=utf-8` or `application/json; charset=UTF-8`, which will not match the exact string. As a result, the error body is ignored and only the generic HTTP status reason is shown to the user, losing potentially valuable server-provided error detail.","fix":"Change the comparison to `response.header(\"content-type\").is_some_and(|ct| ct.contains(\"application/json\"))` to tolerate charset parameters.","locations":[{"ref":"crates/nu-command/src/network/http/client.rs:890","code":"  890 |     let msg = if response.header(\"content-type\") == Some(\"application/json\") {","lines":1,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-command/src/network/http/client.rs#L890"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"On Windows, when running a PATHEXT script (e.g., a `.nu` file with a Windows file association), the command is built as `cmd.exe /D /C <expanded_name> [args...]` via `command.args([...])`. Rust's `Command::args()` applies MSVCRT quoting (for `CreateProcess`), not CMD quoting (for `cmd.exe`'s post-/C argument parsing). If `expanded_name` contains spaces, CMD will split the path at the first space and misinterpret the remainder as additional tokens rather than as part of the script filename. The user-visible symptom is \"command not found\" or execution of the wrong binary.","fix":"For the PATHEXT script path, wrap `expanded_name` in double-quotes before passing to `command.args()`: `command.args([\"/D\", \"/C\", &format!(\"\\\"{}\\\"\" , expanded_name.to_string_lossy())])` or use `raw_arg` with proper CMD quoting.","locations":[{"ref":"crates/nu-command/src/system/run_external.rs:184-191","code":"  184 |         #[cfg(windows)]\n  185 |         if is_cmd_internal_command(&name_str) || pathext_script_in_windows {\n  186 |             // The /D flag disables execution of AutoRun commands from registry.\n  187 |             // The /C flag followed by a command name instructs CMD to execute\n  188 |             // that command and quit.\n  189 |             command.args([\"/D\", \"/C\", &expanded_name.to_string_lossy()]);\n  190 |             for arg in &args {\n  191 |                 command.raw_arg(escape_cmd_argument(arg)?);","lines":8,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-command/src/system/run_external.rs#L184-L191"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `lex_internal` (lex.rs line 626-629), the `ParseError::ExtraTokens` span is constructed with bare `curr_offset` values instead of `state.span_offset + curr_offset`. Every other token span in the same function consistently adds `state.span_offset`. When `span_offset != 0` (incremental lex or re-lex after a partial parse), the error will point to the wrong source location.","fix":"Change the span construction to `Span::new(state.span_offset + curr_offset, state.span_offset + curr_offset + 1)`.","locations":[{"ref":"crates/nu-parser/src/lex.rs:898-902","code":"  898 |             if !is_complete && state.error.is_none() {\n  899 |                 state.error = Some(ParseError::ExtraTokens(Span::new(\n  900 |                     curr_offset,\n  901 |                     curr_offset + 1,\n  902 |                 )));","lines":5,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/lex.rs#L898-L902"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In parse_short_flags(), the 'last flag in batch' guard compares the BYTE offset from char_indices() against num_chars-1 which is a CHARACTER count. For multi-byte short flag characters the comparison is semantically wrong: a non-last multi-byte character may have a byte offset greater than or equal to num_chars-1, incorrectly skipping the error.","fix":"Track character index separately (e.g. enumerate the char_indices result) and compare against num_chars-1 using the character index, not the byte offset.","locations":[{"ref":"crates/nu-parser/src/parse_calls.rs:604-614","code":"  604 |             let num_chars = short_flags.chars().count();\n  605 |             let mut found_short_flags = vec![];\n  606 |             let mut unmatched_short_flags = vec![];\n  607 |             for (offset, short_flag) in short_flags.char_indices() {\n  608 |                 let short_flag_span = Span::new(\n  609 |                     arg_span.start + 1 + offset,\n  610 |                     arg_span.start + 1 + offset + short_flag.len_utf8(),\n  611 |                 );\n  612 |                 if let Some(flag) = sig.get_short_flag(short_flag) {\n  613 |                     // Allow args in short flag batches as long as it is the last flag.\n  614 |                     if flag.arg.is_some() && offset < num_chars - 1 {","lines":11,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/parse_calls.rs#L604-L614"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In parse_expression, when an environment-variable shorthand (FOO=) has no value after the `=` sign, the fallback expression is constructed as `Expr::String(String::new())` but typed as `Type::Nothing` (lines 1468-1474). This Expr/Type mismatch can lead to incorrect type-checking downstream: the expression claims to produce Nothing but is actually an empty string.","fix":"Change `Type::Nothing` to `Type::String` so the type matches the `Expr::String` variant, or use `Expr::Nothing` with `Type::Nothing` if an empty env var should be treated as nothing.","locations":[{"ref":"crates/nu-parser/src/parse_expressions.rs:1528-1535","code":" 1528 |         } else {\n 1529 |             Expression::new(\n 1530 |                 working_set,\n 1531 |                 Expr::String(String::new()),\n 1532 |                 Span::unknown(),\n 1533 |                 Type::Nothing,\n 1534 |             )\n 1535 |         };","lines":8,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/parse_expressions.rs#L1528-L1535"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"is_unaliasable_parser_keyword unconditionally returns from the two-word branch (line 56) via `return UNALIASABLE_PARSER_KEYWORDS.contains(&cmd_name)` even when the two-word combination is NOT in the keyword list. This means for a span sequence like [\"export\", \"someArg\"], the two-word content (\"export someArg\") is checked and, finding no match, the function returns `false` - without ever checking whether the single word \"export\" is itself an unaliasable keyword. As a result, single-word keywords followed by any argument are incorrectly reported as non-unaliasable.","fix":"Change the two-word branch to only return `true` early, not `false`: `let two_word = ...; if UNALIASABLE_PARSER_KEYWORDS.contains(&two_word) { return true; }`. Then fall through to the single-word check.","locations":[{"ref":"crates/nu-parser/src/parse_keywords.rs:52-66","code":"   52 | pub fn is_unaliasable_parser_keyword(working_set: &StateWorkingSet, spans: &[Span]) -> bool {\n   53 |     // try two words\n   54 |     if let (Some(&span1), Some(&span2)) = (spans.first(), spans.get(1)) {\n   55 |         let cmd_name = working_set.get_span_contents(Span::append(span1, span2));\n   56 |         return UNALIASABLE_PARSER_KEYWORDS.contains(&cmd_name);\n   57 |     }\n   58 | \n   59 |     // try one word\n   60 |     if let Some(&span1) = spans.first() {\n   61 |         let cmd_name = working_set.get_span_contents(span1);\n   62 |         UNALIASABLE_PARSER_KEYWORDS.contains(&cmd_name)\n   63 |     } else {\n   64 |         false\n   65 |     }\n   66 | }","lines":15,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/parse_keywords.rs#L52-L66"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"When a mandatory short flag (e.g. `-ab`) contains more than one character, an error is reported (line 800) but execution continues and the flag is pushed into `args` using chars[0] anyway (lines 821-831). The erroneous flag is silently accepted into the signature despite the error.","fix":"After reporting the error on line 800, add an early `continue` or skip the `args.push` block so a multi-character short flag is not registered.","locations":[{"ref":"crates/nu-parser/src/parse_signatures.rs:804-846","code":"  804 |                             // Mandatory short flag, e.g. -e (must be one character)\n  805 |                             else if contents.starts_with(b\"-\") && contents.len() > 1 {\n  806 |                                 let short_flag = &contents[1..];\n  807 |                                 let short_flag = String::from_utf8_lossy(short_flag).to_string();\n  808 |                                 let chars: Vec<char> = short_flag.chars().collect();\n  809 | \n  810 |                                 if chars.len() > 1 {\n  811 |                                     working_set.error(ParseError::Expected(\"short flag\", span));\n  812 |                                 }\n  813 | \n  814 |                                 let mut encoded_var_name = [0u8; 4];\n  815 |                                 let len = chars[0].encode_utf8(&mut encoded_var_name).len();\n  816 |                                 let variable_name = encoded_var_name[0..len].to_vec();\n  817 | \n  818 |                                 if !is_variable(&variable_name) {\n  819 |                                     working_set.error(ParseError::Expected(\n  820 |                                         \"valid variable name for this short flag\",\n  821 |                                         span,\n  822 |                                     ))\n  823 |                                 }\n  824 | \n  825 |                                 let var_id = check_and_add_variable(\n  826 |                                     working_set,\n  827 |                                     variable_name,\n  828 |                                     Type::Bool,\n  829 |                                     span,\n  830 |                                 );\n  831 | \n  832 |                                 args.push(Arg::Flag {\n  833 |                                     flag: Flag {\n  834 |                                         arg: None,\n  835 |                                         desc: String::new(),\n  836 |                                         long: String::new(),\n  837 |                                         short: Some(chars[0]),\n  838 |                                         required: false,\n  839 |                                         var_id,\n  840 |                                         default_value: None,\n  841 |                                         completion: None,\n  842 |                                     },\n  843 |                                     type_annotated: false,\n  844 |                                 });\n  845 |                                 parse_mode = ParseMode::Arg;\n  846 |                             }","lines":43,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/parse_signatures.rs#L804-L846"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"merge_delta() calls delta.scope.remove(0) to extract only the first ScopeFrame, silently discarding any additional frames that may have been pushed via enter_scope() without a matching exit_scope() (e.g. due to a parse error mid-parse). Any declarations or variables defined in scope frames beyond index 0 are silently lost. This also panics with an index-out-of-bounds if delta.scope is somehow empty.","fix":"Assert that delta.scope.len() == 1 before removing, or iterate all scope frames. At minimum, debug_assert!(delta.scope.len() == 1, ...) to catch scope imbalances during development.","locations":[{"ref":"crates/nu-protocol/src/engine/engine_state.rs:346-394","code":"  346 |         let first = delta.scope.remove(0);\n  347 | \n  348 |         for (delta_name, delta_overlay) in first.clone().overlays {\n  349 |             if let Some((_, existing_overlay)) = self\n  350 |                 .scope\n  351 |                 .overlays\n  352 |                 .iter_mut()\n  353 |                 .find(|(name, _)| name == &delta_name)\n  354 |             {\n  355 |                 // Updating existing overlay\n  356 |                 for item in delta_overlay.decls.into_iter() {\n  357 |                     existing_overlay.decls.insert(item.0, item.1);\n  358 |                 }\n  359 |                 for item in delta_overlay.vars.into_iter() {\n  360 |                     existing_overlay.insert_variable(item.0, item.1);\n  361 |                 }\n  362 |                 for item in delta_overlay.modules.into_iter() {\n  363 |                     existing_overlay.modules.insert(item.0, item.1);\n  364 |                 }\n  365 | \n  366 |                 existing_overlay\n  367 |                     .visibility\n  368 |                     .merge_with(delta_overlay.visibility);\n  369 |             } else {\n  370 |                 // New overlay was added to the delta\n  371 |                 self.scope.overlays.push((delta_name, delta_overlay));\n  372 |             }\n  373 |         }\n  374 | \n  375 |         let mut activated_ids = self.translate_overlay_ids(&first);\n  376 | \n  377 |         let mut removed_ids = vec![];\n  378 | \n  379 |         for name in &first.removed_overlays {\n  380 |             if let Some(overlay_id) = self.find_overlay(name) {\n  381 |                 removed_ids.push(overlay_id);\n  382 |             }\n  383 |         }\n  384 | \n  385 |         // Remove overlays removed in delta\n  386 |         self.scope\n  387 |             .active_overlays\n  388 |             .retain(|id| !removed_ids.contains(id));\n  389 | \n  390 |         // Move overlays activated in the delta to be first\n  391 |         self.scope\n  392 |             .active_overlays\n  393 |             .retain(|id| !activated_ids.contains(id));\n  394 |         self.scope.active_overlays.append(&mut activated_ids);","lines":49,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-protocol/src/engine/engine_state.rs#L346-L394"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"flat_map() and filter() on PipelineData::ByteStream (lines 576-592 and 647-664) both ignore the stream's ByteStreamType annotation. They call stream.into_bytes() and then check whether the result is valid UTF-8 to decide the type, so a stream explicitly annotated as Binary will be silently coerced to a String Value if the bytes happen to be valid UTF-8. Both sites are marked with TODO comments acknowledging this uncertainty.","fix":"Respect stream.type_() before deciding whether to decode as UTF-8. For Binary streams, always produce Value::binary regardless of content. Mirror the logic in ByteStream::into_value() which already handles this correctly.","locations":[{"ref":"crates/nu-protocol/src/pipeline/pipeline_data.rs:578-594","code":"  578 |             PipelineData::ByteStream(stream, metadata) => {\n  579 |                 // TODO: is this behavior desired / correct ?\n  580 |                 let span = stream.span();\n  581 |                 let iter = match String::from_utf8(stream.into_bytes()?) {\n  582 |                     Ok(mut str) => {\n  583 |                         str.truncate(str.trim_end_matches(LINE_ENDING_PATTERN).len());\n  584 |                         f(Value::string(str, span))\n  585 |                     }\n  586 |                     Err(err) => f(Value::binary(err.into_bytes(), span)),\n  587 |                 };\n  588 |                 Ok(iter.into_iter().into_pipeline_data_with_metadata(\n  589 |                     span,\n  590 |                     signals.clone(),\n  591 |                     metadata,\n  592 |                 ))\n  593 |             }\n  594 |         }","lines":17,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-protocol/src/pipeline/pipeline_data.rs#L578-L594"},{"ref":"crates/nu-protocol/src/pipeline/pipeline_data.rs:649-666","code":"  649 |             PipelineData::ByteStream(stream, metadata) => {\n  650 |                 // TODO: is this behavior desired / correct ?\n  651 |                 let span = stream.span();\n  652 |                 let value = match String::from_utf8(stream.into_bytes()?) {\n  653 |                     Ok(mut str) => {\n  654 |                         str.truncate(str.trim_end_matches(LINE_ENDING_PATTERN).len());\n  655 |                         Value::string(str, span)\n  656 |                     }\n  657 |                     Err(err) => Value::binary(err.into_bytes(), span),\n  658 |                 };\n  659 |                 let value = if f(&value) {\n  660 |                     value\n  661 |                 } else {\n  662 |                     Value::nothing(span)\n  663 |                 };\n  664 |                 Ok(value.into_pipeline_data_with_metadata(metadata))\n  665 |             }\n  666 |         }","lines":18,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-protocol/src/pipeline/pipeline_data.rs#L649-L666"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`coerce_bool` for floats uses `val <= &f64::EPSILON` to decide `false`. This means any float from negative infinity through epsilon (inclusive) is considered `false`, including all negative floats. Typically the intent is that `0.0` (or near-zero) is falsy, not negative numbers. Negative floats like `-1.0` would be treated as `false` by this check since `-1.0 <= f64::EPSILON`. The comparison should likely be `val.abs() <= f64::EPSILON` or just `*val == 0.0`.","fix":"Change `val <= &f64::EPSILON` to `val.abs() <= f64::EPSILON` (or `*val == 0.0` to keep it simple and consistent with the integer case).","locations":[{"ref":"crates/nu-protocol/src/value/mod.rs:918","code":"  918 |             Value::Float { val, .. } if val <= &f64::EPSILON => Ok(false),","lines":1,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-protocol/src/value/mod.rs#L918"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`PartialOrd` for `Value::Record` may produce an incorrect result when two records have different numbers of fields. After sorting both records and comparing column names and values pairwise using `zip` (which stops at the shorter record), the code compares `lhs.len().partial_cmp(&rhs.len())` to break ties. However, the pairwise column comparison via `zip` only visits `min(lhs.len(), rhs.len())` pairs. If the longer record's extra columns sort earlier than the shorter record's last column, the comparison is wrong. For example `{a:1, b:2} vs {a:1, c:0}` should compare `a==a`, then `b < c`, returning `Less`. But after zip (which gives a==a and b<c correctly), it returns Less - that's fine. However for `{a:1, b:2} vs {a:1}`, the zip gives a==a and stops; then `len` comparison gives `Greater` - which is correct (longer is greater lexicographically). This is likely correct but the column-name comparison happens before value comparison which may not correctly implement lexicographic order when column names differ.","fix":"Consider using a proper lexicographic comparison over paired (col, val) tuples. The current approach of comparing all columns first and then all values is not equivalent to lexicographic order over (col, val) pairs.","locations":[{"ref":"crates/nu-protocol/src/value/mod.rs:2631-2656","code":" 2631 |                 Value::Record { val: rhs, .. } => {\n 2632 |                     // reorder cols and vals to make more logically compare.\n 2633 |                     // more general, if two record have same col and values,\n 2634 |                     // the order of cols shouldn't affect the equal property.\n 2635 |                     let mut lhs = lhs.clone().into_owned();\n 2636 |                     let mut rhs = rhs.clone().into_owned();\n 2637 |                     lhs.sort_cols();\n 2638 |                     rhs.sort_cols();\n 2639 | \n 2640 |                     // Check columns first\n 2641 |                     for (a, b) in lhs.columns().zip(rhs.columns()) {\n 2642 |                         let result = a.partial_cmp(b);\n 2643 |                         if result != Some(Ordering::Equal) {\n 2644 |                             return result;\n 2645 |                         }\n 2646 |                     }\n 2647 |                     // Then check the values\n 2648 |                     for (a, b) in lhs.values().zip(rhs.values()) {\n 2649 |                         let result = a.partial_cmp(b);\n 2650 |                         if result != Some(Ordering::Equal) {\n 2651 |                             return result;\n 2652 |                         }\n 2653 |                     }\n 2654 |                     // If all of the comparisons were equal, then lexicographical order dictates\n 2655 |                     // that the shorter sequence is less than the longer one\n 2656 |                     lhs.len().partial_cmp(&rhs.len())","lines":26,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-protocol/src/value/mod.rs#L2631-L2656"}]},
{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`Value::not_in` for CellPath membership (Value::Int/String in CellPath) at lines 3881-3896 is logically inverted. The closure passed to `.any()` returns `true` when the member DOES NOT match, and `false` when it matches. Since `.any()` returns `true` if at least one element satisfies the predicate, `not_in` returns `true` when at least one member does NOT match the search value - which is almost always true for any multi-element path. The correct semantics should be `!rhs.members.iter().any(|member| /* member matches self */)`, mirroring how `in` works but negated. Currently the `not_in` implementation reuses `any` with the negated match predicate instead of negating the result of `any` with the positive predicate.","fix":"Rewrite as `let val = !rhs.members.iter().any(|member| match (self, member) { (Int{val:lhs}, PathMember::Int{val:rhs}) => lhs == rhs as i64, (String{val:lhs}, PathMember::String{val:rhs}) => lhs == rhs, _ => false });`","locations":[{"ref":"crates/nu-protocol/src/value/mod.rs:3917-3932","code":" 3917 |             (Value::String { .. } | Value::Int { .. }, Value::CellPath { val: rhs, .. }) => {\n 3918 |                 let val = rhs.members.iter().any(|member| match (self, member) {\n 3919 |                     (Value::Int { val: lhs, .. }, PathMember::Int { val: rhs, .. }) => {\n 3920 |                         *lhs != *rhs as i64\n 3921 |                     }\n 3922 |                     (Value::String { val: lhs, .. }, PathMember::String { val: rhs, .. }) => {\n 3923 |                         lhs != rhs\n 3924 |                     }\n 3925 |                     (Value::String { .. }, PathMember::Int { .. })\n 3926 |                     | (Value::Int { .. }, PathMember::String { .. }) => true,\n 3927 |                     _ => unreachable!(\n 3928 |                         \"outer match arm ensures `self` is either a `String` or `Int` variant\"\n 3929 |                     ),\n 3930 |                 });\n 3931 | \n 3932 |                 Ok(Value::bool(val, span))","lines":16,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-protocol/src/value/mod.rs#L3917-L3932"}]},
{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`IntRange::distance` at lines 99-107 returns incorrect results for ranges where `start > end`. The condition `Bound::Included(end) | Bound::Excluded(end) if self.start > end` returns `Bound::Excluded(0)` (empty range) for both Included and Excluded bounds. This collapses them into the same empty result, losing the distinction. For a decreasing range like `5..1` (where start=5, step=-1, end=Included(1)), the distance should be `Included(4)` (four steps: 5,4,3,2,1), but instead it returns `Excluded(0)` which signals an empty range.","fix":"For decreasing ranges (step < 0), compute distance as `(start - end)` instead of `(end - start)`, taking into account the Included/Excluded distinction.","locations":[{"ref":"crates/nu-protocol/src/value/range.rs:98-107","code":"   98 |         pub fn distance(&self) -> Bound<u64> {\n   99 |             match self.end {\n  100 |                 Bound::Unbounded => Bound::Unbounded,\n  101 |                 Bound::Included(end) | Bound::Excluded(end) if self.start > end => {\n  102 |                     Bound::Excluded(0)\n  103 |                 }\n  104 |                 Bound::Included(end) => Bound::Included((end - self.start) as u64),\n  105 |                 Bound::Excluded(end) => Bound::Excluded((end - self.start) as u64),\n  106 |             }\n  107 |         }","lines":10,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-protocol/src/value/range.rs#L98-L107"}]},
{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`CasedRecord::index_of` uses `rposition` (rightmost position) when looking up a column. If a Record contains duplicate keys (which `Record::push` allows without checking for duplicates, and `Record::extend`/`FromIterator` also do not deduplicate), all lookups return the LAST occurrence. `record.get(key)` will return the last value for that key, while `record.insert(key, val)` updates the last value. This means values inserted before the duplicate are invisible but still occupy memory. The comment on `Record::push` documents this as a deliberate design tradeoff, but callers of `Record::from_iter` and `Record::extend` may not realize they can silently create shadow entries.","fix":"Either document this behavior prominently on `FromIterator` and `Extend`, or add deduplication in those trait implementations (as the TODO comments suggest).","locations":[{"ref":"crates/nu-protocol/src/value/record.rs:49-52","code":"   49 |     pub fn index_of(&self, col: impl AsRef<str>) -> Option<usize> {\n   50 |         let col = col.as_ref();\n   51 |         self.0.columns().rposition(|k| Sensitivity::eq(k, col))\n   52 |     }","lines":4,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-protocol/src/value/record.rs#L49-L52"},{"ref":"crates/nu-protocol/src/value/record.rs:697-712","code":"  697 | impl FromIterator<(String, Value)> for Record {\n  698 |     fn from_iter<T: IntoIterator<Item = (String, Value)>>(iter: T) -> Self {\n  699 |         // TODO: should this check for duplicate keys/columns?\n  700 |         Self {\n  701 |             inner: iter.into_iter().collect(),\n  702 |         }\n  703 |     }\n  704 | }\n  705 | \n  706 | impl Extend<(String, Value)> for Record {\n  707 |     fn extend<T: IntoIterator<Item = (String, Value)>>(&mut self, iter: T) {\n  708 |         for (k, v) in iter {\n  709 |             // TODO: should this .insert with a check?\n  710 |             self.push(k, v)\n  711 |         }\n  712 |     }","lines":16,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-protocol/src/value/record.rs#L697-L712"}]},
{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`history import` uses `item_from_value` to convert a `Value::Record` but silently ignores the\n`id` and `session_id` record fields (they are not listed as supported and cause an \"unsupported\ncolumn names\" error if present). However, the `extra_description` says available fields are\n\"command, start_timestamp, hostname, cwd, duration, exit_status\" and does NOT mention that `id`\nor `session_id` will cause a hard error. A user importing from a `history` dump (which includes\n`id` or `item_id`) will hit a confusing `TypeMismatch` error.","fix":"Either silently ignore unknown columns instead of erroring, or document the strict field list clearly in `extra_description` with an explicit note that extra columns cause errors.","locations":[{"ref":"crates/nu-cli/src/commands/history/history_import.rs:207-248","code":"  207 | fn item_from_record(mut rec: Record, span: Span) -> Result<HistoryItem, ShellError> {\n  208 |     let cmd = match rec.remove(fields::COMMAND_LINE) {\n  209 |         Some(v) => v.as_str()?.to_owned(),\n  210 |         None => {\n  211 |             return Err(ShellError::TypeMismatch {\n  212 |                 err_message: format!(\"missing column: {}\", fields::COMMAND_LINE),\n  213 |                 span,\n  214 |             });\n  215 |         }\n  216 |     };\n  217 | \n  218 |     fn get<T>(\n  219 |         rec: &mut Record,\n  220 |         field: &'static str,\n  221 |         f: impl FnOnce(Value) -> Result<T, ShellError>,\n  222 |     ) -> Result<Option<T>, ShellError> {\n  223 |         rec.remove(field).map(f).transpose()\n  224 |     }\n  225 | \n  226 |     let rec = &mut rec;\n  227 |     let item = HistoryItem {\n  228 |         command_line: cmd,\n  229 |         id: None,\n  230 |         start_timestamp: get(rec, fields::START_TIMESTAMP, |v| Ok(v.as_date()?.to_utc()))?,\n  231 |         hostname: get(rec, fields::HOSTNAME, |v| Ok(v.as_str()?.to_owned()))?,\n  232 |         cwd: get(rec, fields::CWD, |v| Ok(v.as_str()?.to_owned()))?,\n  233 |         exit_status: get(rec, fields::EXIT_STATUS, |v| v.as_int())?,\n  234 |         duration: get(rec, fields::DURATION, |v| duration_from_value(v, span))?,\n  235 |         more_info: None,\n  236 |         // TODO: Currently reedline doesn't let you create session IDs.\n  237 |         session_id: None,\n  238 |     };\n  239 | \n  240 |     if !rec.is_empty() {\n  241 |         let cols = rec.columns().map(|s| s.as_str()).collect::<Vec<_>>();\n  242 |         return Err(ShellError::TypeMismatch {\n  243 |             err_message: format!(\"unsupported column names: {}\", cols.join(\", \")),\n  244 |             span,\n  245 |         });\n  246 |     }\n  247 |     Ok(item)\n  248 | }","lines":42,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cli/src/commands/history/history_import.rs#L207-L248"}]},
{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`keybindings_listen.rs` calls `terminal::enable_raw_mode()` inside `print_events()` (line 68) but\nthe caller in `run()` (lines 44-52) only calls `terminal::disable_raw_mode()` on the `Err` path\nfrom `print_events`. Inside `print_events`, the early-return `?` on `crossterm::event::read()`\n(line 100) and on the `queue`/`flush` calls (lines 121-127) will propagate an `Err` back to `run()`\nwithout having called `disable_raw_mode()`. The terminal then stays in raw mode for the rest of the\nshell session.","fix":"Use a RAII guard or `scopeguard` to ensure `disable_raw_mode()` is always called. Alternatively, catch all `?` early-returns within `print_events` and call `disable_raw_mode()` before returning the error.","locations":[{"ref":"crates/nu-cli/src/commands/keybindings_listen.rs:34-53","code":"   34 |     fn run(\n   35 |         &self,\n   36 |         engine_state: &EngineState,\n   37 |         stack: &mut Stack,\n   38 |         call: &Call,\n   39 |         _input: PipelineData,\n   40 |     ) -> Result<PipelineData, ShellError> {\n   41 |         println!(\"Type any key combination to see key details. Press ESC to abort.\");\n   42 | \n   43 |         match print_events(&stack.get_config(engine_state), call.head) {\n   44 |             Ok(v) => Ok(v.into_pipeline_data()),\n   45 |             Err(e) => {\n   46 |                 terminal::disable_raw_mode()\n   47 |                     .map_err(|err| IoError::new_internal(err, \"Could not disable raw mode\"))?;\n   48 |                 Err(ShellError::Generic(\n   49 |                     GenericError::new_internal(\"Error with input\", \"\").with_help(e.to_string()),\n   50 |                 ))\n   51 |             }\n   52 |         }\n   53 |     }","lines":20,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cli/src/commands/keybindings_listen.rs#L34-L53"}]},
{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"Bitwise AND (`&`) used instead of logical short-circuit AND (`&&`) when checking whether the config file path both exists and is a file. Both sides are always evaluated even when `config_path.exists()` returns false, causing an unnecessary filesystem call.","fix":"Replace `config_path.exists() & config_path.is_file()` with `config_path.exists() && config_path.is_file()`.","locations":[{"ref":"crates/nu-cli/src/config_files.rs:268","code":"  268 |     if config_path.exists() & config_path.is_file() {","lines":1,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cli/src/config_files.rs#L268"}]},
{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In loop_iteration, the reedline error branch at line 821 filters errors by checking `err.to_string().contains(\"duration\")`. This is a fragile string-match heuristic: any unrelated error whose Debug representation happens to contain the word 'duration' is silently swallowed (only run_finaliziation_ansi_sequence is called, no message or exit). Conversely, if the reedline internal error message ever changes wording, the filter breaks.","fix":"Match on the concrete reedline error variant instead of inspecting the Debug string. Alternatively document precisely which reedline error is expected and add a TODO with the reedline issue reference.","locations":[{"ref":"crates/nu-cli/src/repl.rs:858-873","code":"  858 |         Err(err) => {\n  859 |             if !err.to_string().contains(\"duration\") {\n  860 |                 write_repl_error_details(&err);\n  861 |                 cleanup_exit((), engine_state, 1);\n  862 |                 return (true, stack, line_editor);\n  863 |             }\n  864 | \n  865 |             run_finaliziation_ansi_sequence(\n  866 |                 &stack,\n  867 |                 engine_state,\n  868 |                 use_color,\n  869 |                 shell_integration.osc633,\n  870 |                 shell_integration.osc133,\n  871 |             );\n  872 |         }\n  873 |     }","lines":16,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cli/src/repl.rs#L858-L873"}]},
{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `util.rs` (`process_range`), the `Bound::Excluded(v)` arm computes `(v - 1) as isize` (line 17). If `v` is 0 (an excluded zero bound), this wraps to `-1 as isize` which is correct behavior. However, if `v` is `i64::MIN`, the subtraction `v - 1` wraps to `i64::MAX` in release mode without any diagnostic, silently producing an incorrect range end.","fix":"Use `v.checked_sub(1).unwrap_or(isize::MIN as i64) as isize` or add a comment explaining that the caller guarantees `v > 0`.","locations":[{"ref":"crates/nu-cmd-base/src/util.rs:17","code":"   17 |                 Bound::Excluded(v) => (v - 1) as isize,","lines":1,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cmd-base/src/util.rs#L17"}]},
{"id":"LOGIC_33","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `vertical_rotate_value` (roll/mod.rs, line 28), the rotation count for `roll down`/`roll up` is computed as `by.map(|n| n % vals.len()).unwrap_or(1)`. When `vals` is empty (`vals.len() == 0`), this performs `n % 0` which panics. The existing check in the commands passes the list value collected from pipeline data, so an empty list is possible.","fix":"Guard with `if vals.is_empty() { return Ok(Value::list(vals, span)); }` before computing rotations.","locations":[{"ref":"crates/nu-cmd-extra/src/extra/filters/roll/mod.rs:28","code":"   28 |             let rotations = by.map(|n| n % vals.len()).unwrap_or(1);","lines":1,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cmd-extra/src/extra/filters/roll/mod.rs#L28"}]},
{"id":"LOGIC_34","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `horizontal_rotate_value` (roll/mod.rs, line 59), the rotation count for `roll left`/`roll right` is computed as `by.map(|n| n % record.len()).unwrap_or(1)`. When `record.len() == 0`, this performs `n % 0`, which panics. An empty record is a valid nushell value.","fix":"Guard with `if record.is_empty() { return Ok(Value::record(Record::new(), span)); }` before computing rotations.","locations":[{"ref":"crates/nu-cmd-extra/src/extra/filters/roll/mod.rs:59","code":"   59 |             let rotations = by.map(|n| n % record.len()).unwrap_or(1);","lines":1,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cmd-extra/src/extra/filters/roll/mod.rs#L59"}]},
{"id":"LOGIC_35","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `rotate.rs`, the `new_column_names` vector is built with `total_rows + 1` entries (line 205), but the actual number of columns needed for the rotated output is `total_rows + 1` only for the record path (one column for the original column name plus one per original row). When `col_given_names` provides fewer names than `new_column_names.len()`, the guard `if idx > new_column_names.len() - 1` (line 214) uses a subtraction that would underflow to `usize::MAX` if `new_column_names` is empty. However `new_column_names` is always non-empty here (at least one entry), so no actual underflow occurs, but the pattern is fragile.","fix":"Replace `idx > new_column_names.len() - 1` with `idx >= new_column_names.len()` to avoid relying on non-empty invariant.","locations":[{"ref":"crates/nu-cmd-extra/src/extra/filters/rotate.rs:213-215","code":"  213 |         for (idx, val) in col_given_names.into_iter().enumerate() {\n  214 |             if idx > new_column_names.len() - 1 {\n  215 |                 break;","lines":3,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cmd-extra/src/extra/filters/rotate.rs#L213-L215"}]},
{"id":"LOGIC_36","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"Domain check in `math arctanh` uses a closed interval `[-1, 1]` but the error message says 'open interval (-1, 1)'. The guard `(-1.0..=1.0).contains(&val)` allows the endpoints -1 and 1, which produce `-Infinity` and `+Infinity` respectively (as confirmed by the example `1 | math arctanh` returning `f64::INFINITY`). The error message misrepresents the actual behavior: endpoints ARE accepted and produce infinity.","fix":"Either change the error message to say 'closed interval [-1, 1]' (and note that endpoints yield Infinity), or intentionally reject endpoints with `(-1.0..1.0).contains(&val) && val != 1.0` and keep the 'open interval' message. The example at line 50-52 already shows the current behavior (endpoints allowed), so updating the message is the least-disruptive fix.","locations":[{"ref":"crates/nu-cmd-extra/src/extra/math/arctanh.rs:66-80","code":"   66 |             if (-1.0..=1.0).contains(&val) {\n   67 |                 let val = val.atanh();\n   68 | \n   69 |                 Value::float(val, span)\n   70 |             } else {\n   71 |                 Value::error(\n   72 |                     ShellError::UnsupportedInput {\n   73 |                         msg: \"'arctanh' undefined for values outside the open interval (-1, 1).\"\n   74 |                             .into(),\n   75 |                         input: \"value originates from here\".into(),\n   76 |                         msg_span: head,\n   77 |                         input_span: span,\n   78 |                     },\n   79 |                     head,\n   80 |                 )","lines":15,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cmd-extra/src/extra/math/arctanh.rs#L66-L80"}]},
{"id":"LOGIC_37","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `format/command.rs` `extract_formatting_operations`, the span calculation at lines 123-141 computes `pattern_span` to get accurate inner-string spans. However, the formula `delta % 2` for `str_prefix_len` (line 135) assumes the only valid string prefixes are single-character (`r'`, `$'`) or absent. Multi-character raw string delimiters like `r##'...'##` (where the hashes can be 1-6) break the assumption that `delta / 2` gives the number of quote/delimiter chars. As a result, span positions for format columns within raw strings with multiple hashes will be shifted, producing incorrect error span highlights.","fix":"The existing comment (line 118) already acknowledges the limitation. The safest fix for raw strings with multiple `#` delimiters is to use the byte length of the actual prefix characters (by scanning the source text) rather than dividing `delta` by 2. Alternatively, accept that span precision is best-effort and document it.","locations":[{"ref":"crates/nu-cmd-extra/src/extra/strings/format/command.rs:123-141","code":"  123 |     let pattern_span = {\n  124 |         //\n  125 |         //    .----------span len: 21\n  126 |         //    |     .--string len: 12\n  127 |         //    |     |       delta:  9\n  128 |         //  .-+-----|-----------.\n  129 |         //  |    .--+-------.   |\n  130 |         //  r###'hello {user}'###\n  131 |         //\n  132 |         let delta = pattern_span.len() - pattern.len();\n  133 |         // might be `r'foo'` or `$'foo'`\n  134 |         // either 1 or 0\n  135 |         let str_prefix_len = delta % 2;\n  136 |         //\n  137 |         //    r###'hello {user}'###\n  138 |         //    ^^^^\n  139 |         let span_str_start_delta = delta / 2 + str_prefix_len;\n  140 |         pattern_span.subspan(span_str_start_delta, span_str_start_delta + pattern.len())\n  141 |     };","lines":19,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cmd-extra/src/extra/strings/format/command.rs#L123-L141"}]},
{"id":"LOGIC_38","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `format_i64`, the `lowerexp` and `upperexp` fields use `format!(\"{num:#e}\")` and `format!(\"{num:#E}\")`. The `#` flag has no effect on `e`/`E` format in Rust (there is no alternate form), so these are no-ops. The `#` is misleading compared to `binary`/`hex`/`octal` where it adds the `0b`/`0x`/`0o` prefix. For the no-prefix variant, `lowerexp` uses the same `format!(\"{num:#e}\")` regardless of the `no_prefix` flag (i.e., the `--no-prefix` flag has no observable effect on exp fields for integers).","fix":"Remove the `#` from `{num:#e}` and `{num:#E}` since it is a no-op for the exponent format specifier. The `no_prefix` path for `lowerexp`/`upperexp` can remain as `format!(\"{num:e}\")` without any behavioral change.","locations":[{"ref":"crates/nu-cmd-extra/src/extra/strings/format/number.rs:143-145","code":"  143 |             \"lowerexp\" => Value::string(format!(\"{num:#e}\"), span),\n  144 |             \"upperexp\" => Value::string(format!(\"{num:#E}\"), span),\n  145 |             \"lowerhex\" => Value::string(","lines":3,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cmd-extra/src/extra/strings/format/number.rs#L143-L145"}]},
{"id":"LOGIC_39","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `do_`, when both `--ignore-errors` and `--capture-errors` are specified simultaneously, the behavior is undefined and the combination is silently accepted. The `capture_errors` arm (line 76) is checked first for `ByteStream` results, so `--capture-errors` wins for external commands producing a byte stream. For non-byte-stream results (e.g. Nushell errors or ListStream) the `ignore_all_errors` arms fire instead. There is no validation that these mutually exclusive flags are not both set.","fix":"Add an early check: if `capture_errors && ignore_all_errors` return `Err(ShellError::IncompatibleParameters { ... })` with a clear message explaining the flags are mutually exclusive.","locations":[{"ref":"crates/nu-cmd-lang/src/core_commands/do_.rs:62-189","code":"   62 |         let ignore_all_errors = call.has_flag(engine_state, caller_stack, \"ignore-errors\")?;\n   63 | \n   64 |         let capture_errors = call.has_flag(engine_state, caller_stack, \"capture-errors\")?;\n   65 |         let has_env = call.has_flag(engine_state, caller_stack, \"env\")?;\n   66 | \n   67 |         let result = if has_env {\n   68 |             ClosureEvalOnce::new_env_preserve_out_dest(engine_state, caller_stack, closure)\n   69 |         } else {\n   70 |             ClosureEvalOnce::new_preserve_out_dest(engine_state, caller_stack, closure)\n   71 |         }\n   72 |         .add_args(rest)?\n   73 |         .run_with_input(input);\n   74 | \n   75 |         match result {\n   76 |             Ok(PipelineData::ByteStream(stream, metadata)) if capture_errors => {\n   77 |                 let span = stream.span();\n   78 |                 #[cfg(not(feature = \"os\"))]\n   79 |                 return Err(ShellError::DisabledOsSupport {\n   80 |                     msg: \"Cannot create a thread to receive stdout message.\".to_string(),\n   81 |                     span,\n   82 |                 });\n   83 | \n   84 |                 #[cfg(feature = \"os\")]\n   85 |                 match stream.into_child() {\n   86 |                     Ok(mut child) => {\n   87 |                         // Use a thread to receive stdout message.\n   88 |                         // Or we may get a deadlock if child process sends out too much bytes to stderr.\n   89 |                         //\n   90 |                         // For example: in normal linux system, stderr pipe's limit is 65535 bytes.\n   91 |                         // if child process sends out 65536 bytes, the process will be hanged because no consumer\n   92 |                         // consumes the first 65535 bytes\n   93 |                         // So we need a thread to receive stdout message, then the current thread can continue to consume\n   94 |                         // stderr messages.\n   95 |                         let stdout_handler = child\n   96 |                             .stdout\n   97 |                             .take()\n   98 |                             .map(|mut stdout| {\n   99 |                                 thread::Builder::new()\n  100 |                                     .name(\"stdout consumer\".to_string())\n  101 |                                     .spawn(move || {\n  102 |                                         let mut buf = Vec::new();\n  103 |                                         stdout.read_to_end(&mut buf).map_err(|err| {\n  104 |                                             IoError::new_internal(\n  105 |                                                 err,\n  106 |                                                 \"Could not read stdout to end\",\n  107 |                                             )\n  108 |                                         })?;\n  109 |                                         Ok::<_, ShellError>(buf)\n  110 |                                     })\n  111 |                                     .map_err(|err| IoError::new(err, head, None))\n  112 |                             })\n  113 |                             .transpose()?;\n  114 | \n  115 |                         // Intercept stderr so we can return it in the error if the exit code is non-zero.\n  116 |                         // The threading issues mentioned above dictate why we also need to intercept stdout.\n  117 |                         let stderr_msg = match child.stderr.take() {\n  118 |                             None => String::new(),\n  119 |                             Some(mut stderr) => {\n  120 |                                 let mut buf = String::new();\n  121 |                                 stderr\n  122 |                                     .read_to_string(&mut buf)\n  123 |                                     .map_err(|err| IoError::new(err, span, None))?;\n  124 |                                 buf\n  125 |                             }\n  126 |                         };\n  127 | \n  128 |                         let stdout = if let Some(handle) = stdout_handler {\n  129 |                             match handle.join() {\n  130 |                                 Err(err) => {\n  131 |                                     return Err(ShellError::ExternalCommand {\n  132 |                                         label: \"Fail to receive external commands stdout message\"\n  133 |                                             .to_string(),\n  134 |                                         help: format!(\"{err:?}\"),\n  135 |                                         span,\n  136 |                                     });\n  137 |                                 }\n  138 |                                 Ok(res) => Some(res?),\n  139 |                             }\n  140 |                         } else {\n  141 |                             None\n  142 |                         };\n  143 | \n  144 |                         child.ignore_error(false);\n  145 |                         child.wa                          Value::nothing(head)\n  182 |                     } else {\n  183 |                         value\n  184 |                     }\n  185 |                 });\n  186 |                 Ok(PipelineData::list_stream(stream, metadata))\n  187 |             }\n  188 |             r => r,\n  189 |         }","lines":128,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cmd-lang/src/core_commands/do_.rs#L62-L189"}]},
{"id":"LOGIC_40","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`overlay use` calls `caller_stack.update_config(engine_state)` only in the `else` branch where `maybe_origin_module_id` is `None` (line 181). When a module with an `export-env` block is activated (lines 164 and 173), `update_config` is never called. Consequently, if the overlay exports a `config` env var, the running config is not updated for the current session.","fix":"Call `caller_stack.update_config(engine_state)?;` after each `caller_stack.add_overlay(...)` call inside the `if let Some(module_id)` branches (after lines 164 and 173).","locations":[{"ref":"crates/nu-cmd-lang/src/core_commands/overlay/use_.rs:166-187","code":"  166 |                 let _ = eval_block(engine_state, &mut callee_stack, block, input)?;\n  167 | \n  168 |                 // The export-env block should see the env vars *before* activating this overlay\n  169 |                 caller_stack.add_overlay(overlay_name);\n  170 |                 // make sure that PWD is not restored in old overlays.\n  171 |                 if let Some(cwd) = cwd {\n  172 |                     caller_stack.add_env_var(\"PWD\".to_string(), cwd);\n  173 |                 }\n  174 | \n  175 |                 // Merge the block's environment to the current stack\n  176 |                 redirect_env(engine_state, caller_stack, &callee_stack);\n  177 |             } else {\n  178 |                 caller_stack.add_overlay(overlay_name);\n  179 |                 // make sure that PWD is not restored in old overlays.\n  180 |                 if let Some(cwd) = cwd {\n  181 |                     caller_stack.add_env_var(\"PWD\".to_string(), cwd);\n  182 |                 }\n  183 |             }\n  184 |         } else {\n  185 |             caller_stack.add_overlay(overlay_name);\n  186 |             caller_stack.update_config(engine_state)?;\n  187 |         }","lines":22,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cmd-lang/src/core_commands/overlay/use_.rs#L166-L187"}]},
{"id":"LOGIC_41","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `rm`, the home-directory protection check (line 163-165) and the CWD-equality check (line 291) both compare filesystem paths using `to_string_lossy()` string equality rather than `Path` component equality. On systems with non-UTF-8 filenames the replacement character U+FFFD is inserted, causing two distinct paths to compare equal (false positive) or the home/cwd path to fail to match the target (false negative - bypassing the safety guard).","fix":"Use `Path::eq()` or `PathBuf::canonicalize()` based comparison instead of `to_string_lossy()` string comparison.","locations":[{"ref":"crates/nu-command/src/filesystem/rm.rs:161-165","code":"  161 |         if let Some(ref home) = home\n  162 |             && expand_path_with(path.item.as_ref(), &currentdir_path, path.item.is_expand())\n  163 |                 .to_string_lossy()\n  164 |                 .as_ref()\n  165 |                 == home.as_str()","lines":5,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-command/src/filesystem/rm.rs#L161-L165"},{"ref":"crates/nu-command/src/filesystem/rm.rs:291","code":"  291 |         if currentdir_path.to_string_lossy() == path.to_string_lossy()","lines":1,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-command/src/filesystem/rm.rs#L291"}]},
{"id":"LOGIC_42","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `escape_cmd_argument` (Windows CMD argument escaping), the function handles empty arguments via the final `else` branch which returns the empty string as a bare (unquoted) argument. When passed to `cmd.exe` via `raw_arg`, an empty argument will be lost because CMD does not preserve empty unquoted tokens. The existing `FIXME?` comment acknowledges this. Any external command receiving an empty string argument will see the argument disappear, shifting all subsequent arguments by one position.","fix":"Add an early check: if `bytes.is_empty() { return Ok(Cow::Owned(OsString::from(\"\\\"\\\"\"))); }` to emit a quoted empty string.","locations":[{"ref":"crates/nu-command/src/system/run_external.rs:785-787","code":"  785 |         // FIXME?: what if `arg.is_empty()`?\n  786 |         Ok(Cow::Borrowed(arg))\n  787 |     }","lines":3,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-command/src/system/run_external.rs#L785-L787"}]},
{"id":"LOGIC_43","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"get_columns returns an empty vec as soon as it encounters any non-Record value in the input slice. Columns accumulated from earlier Record items in the slice are silently discarded. Callers expecting a union of all record columns from a mixed-type list get an empty result with no indication of why.","fix":"Consider returning the already-accumulated columns from record items seen before the non-record item, or documenting clearly that any non-record item causes an immediate empty return, since this is surprising behavior.","locations":[{"ref":"crates/nu-engine/src/column.rs:4-20","code":"    4 | pub fn get_columns(input: &[Value]) -> Vec<String> {\n    5 |     let mut column_set = HashSet::new();\n    6 |     let mut columns = Vec::new();\n    7 |     for item in input {\n    8 |         let Value::Record { val, .. } = item else {\n    9 |             return vec![];\n   10 |         };\n   11 | \n   12 |         for col in val.columns() {\n   13 |             if column_set.insert(col) {\n   14 |                 columns.push(col.to_string());\n   15 |             }\n   16 |         }\n   17 |     }\n   18 | \n   19 |     columns\n   20 | }","lines":17,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-engine/src/column.rs#L4-L20"}]},
{"id":"LOGIC_44","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"is_block_call in compile/mod.rs checks only the direct arguments of a Call expression for Expr::Block children. A call whose block argument is wrapped in a FullCellPath (e.g. as a result of certain parse paths) would not be detected, potentially causing the finish_redirection cleanup to be skipped incorrectly. The function is used to decide whether to skip cleanup of redirections after nested eval expressions.","fix":"Document clearly the invariant that block-call arguments are always direct Expr::Block children, or expand the check to handle FullCellPath wrappers with an empty tail.","locations":[{"ref":"crates/nu-engine/src/compile/mod.rs:236-244","code":"  236 | fn is_block_call(expr: &Expr) -> bool {\n  237 |     match expr {\n  238 |         Expr::Call(inner) => inner\n  239 |             .arguments\n  240 |             .iter()\n  241 |             .any(|arg| matches!(arg.expr().map(|e| &e.expr), Some(Expr::Block(..)))),\n  242 |         _ => false,\n  243 |     }\n  244 | }","lines":9,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-engine/src/compile/mod.rs#L236-L244"}]},
{"id":"LOGIC_45","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `CallEval::run` (eval.rs line 184-188), after `finalize_arguments` is called, `arg_index` and `rest_args` are reset but `named_args` is not cleared. If the same `CallEval` were to call `add_named` again and then `run` a second time, the `named_args` filter in `finalize_arguments` would incorrectly treat the previously-provided flags as already set, potentially skipping their default-value assignment. `run_prebound` (line 203) likewise does not reset `named_args`.","fix":"Add `self.named_args.clear();` alongside the existing resets in `run` and `run_prebound`, or document clearly that `CallEval` is single-use.","locations":[{"ref":"crates/nu-engine/src/eval.rs:236-240","code":"  236 |         self.finalize_arguments(&block.signature)?;\n  237 |         self.arg_index = 0;\n  238 |         self.rest_args.clear();\n  239 |         (self.eval)(engine_state, &mut self.callee_stack, block, input).map(|p| p.body)\n  240 |     }","lines":5,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-engine/src/eval.rs#L236-L240"},{"ref":"crates/nu-engine/src/eval.rs:259-264","code":"  259 |         input: PipelineData,\n  260 |     ) -> Result<PipelineData, ShellError> {\n  261 |         self.arg_index = 0;\n  262 |         self.rest_args.clear();\n  263 |         (self.eval)(engine_state, &mut self.callee_stack, block, input).map(|p| p.body)\n  264 |     }","lines":6,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-engine/src/eval.rs#L259-L264"}]},
{"id":"LOGIC_46","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `gather_arguments` (eval_ir.rs lines 1488-1498), the loop that handles remaining (unbound) positional arguments after argument processing does not distinguish between required and optional parameters - the second tuple element `_` (which is `true` for required) is ignored. If a spread argument causes positional_iter to stall before consuming all required positionals, those required positionals are silently defaulted to `nothing` instead of producing a `MissingParameter` error.","fix":"Destructure the second field: `for (positional_arg, required) in positional_iter { if required { return Err(ShellError::MissingParameter { ... }); } ... }`.","locations":[{"ref":"crates/nu-engine/src/eval_ir.rs:1714-1724","code":" 1714 |     // Check for arguments that haven't yet been set and set them to their defaults\n 1715 |     for (positional_arg, _) in positional_iter {\n 1716 |         let var_id = expect_positional_var_id(positional_arg, call_head)?;\n 1717 |         callee_stack.add_var(\n 1718 |             var_id,\n 1719 |             positional_arg\n 1720 |                 .default_value\n 1721 |                 .clone()\n 1722 |                 .unwrap_or(Value::nothing(call_head)),\n 1723 |         );\n 1724 |     }","lines":11,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-engine/src/eval_ir.rs#L1714-L1724"}]},
{"id":"LOGIC_47","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In lite_parser.rs, the Attribute mode does not push the command into the pipeline when a Semicolon terminates it (lines 243-250): the code calls pipeline.push() and block.push() but only when last_token was already an Eol/Semicolon, not unconditionally. A lone attribute on a semicolon-terminated line with a non-Eol/Semicolon preceding token silently drops the pipeline.","fix":"Call pipeline.push() and block.push() unconditionally on Semicolon (and on Eol), not only when last_token matches, mirroring the Normal mode Semicolon handling at line 471-474.","locations":[{"ref":"crates/nu-parser/src/lite_parser.rs:242-251","code":"  242 |                     TokenContents::Eol | TokenContents::Semicolon => {\n  243 |                         command.attribute_idx.push(command.parts.len());\n  244 |                         mode = Mode::Normal;\n  245 |                         if let TokenContents::Eol | TokenContents::Semicolon = last_token {\n  246 |                             // Clear out the comment as we're entering a new comment\n  247 |                             curr_comment = None;\n  248 |                             pipeline.push(&mut command);\n  249 |                             block.push(&mut pipeline);\n  250 |                         }\n  251 |                     }","lines":10,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/lite_parser.rs#L242-L251"}]},
{"id":"LOGIC_48","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"detect_params_in_name() constructs error span as Span::new(offset + name_span.start - 1, offset + name_span.start - 1) (line 937). When offset is 0 and name_span.start is 0, this underflows (wraps to usize::MAX on release builds or panics in debug). Even in non-zero cases the span points one byte before the '[' or '(' rather than at it.","fix":"Change to Span::new(offset + name_span.start, offset + name_span.start) to point to the actual problematic character, and guard against underflow.","locations":[{"ref":"crates/nu-parser/src/parse_def.rs:975","code":"  975 |                 span: Span::new(offset + name_span.start - 1, offset + name_span.start - 1),","lines":1,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/parse_def.rs#L975"}]},
