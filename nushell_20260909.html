{"id":"LOGIC_49","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"parse_record_pattern re-assigns `bytes` from the same span after emitting the missing `{` error (line 174), but the re-fetch does not change what bytes contains because the same span is used. The reassignment is misleading and serves no purpose.","fix":"Remove the redundant `bytes = working_set.get_span_contents(span);` line on 174. The `bytes` variable already holds those exact bytes.","locations":[{"ref":"crates/nu-parser/src/parse_patterns.rs:195-198","code":"  195 |     } else {\n  196 |         working_set.error(ParseError::Expected(\"{\", Span::new(start, start + 1)));\n  197 |         bytes = working_set.get_span_contents(span);\n  198 |     }","lines":4,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/parse_patterns.rs#L195-L198"}]},
{"id":"LOGIC_50","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"ByteStream::skip() and ByteStream::take() both create the resulting ByteStream with Signals::empty() (lines 252 and 267-270), discarding the original stream's Signals instance. This means consumers of the returned stream cannot interrupt it via Ctrl-C. Additionally, skip() uses io::copy without any signal checking while consuming skipped bytes, blocking the thread for the entire skip duration.","fix":"Pass self.signals through to the new ByteStream in both methods. In skip(), use copy_with_signals() instead of io::copy() to allow interruption during the skip.","locations":[{"ref":"crates/nu-protocol/src/pipeline/byte_stream.rs:245-261","code":"  245 |     pub fn skip(self, span: Span, n: u64) -> Result<Self, ShellError> {\n  246 |         let known_size = self.known_size.map(|len| len.saturating_sub(n));\n  247 |         if let Some(mut reader) = self.reader() {\n  248 |             // Copy the number of skipped bytes into the sink before proceeding\n  249 |             io::copy(&mut (&mut reader).take(n), &mut io::sink())\n  250 |                 .map_err(|err| IoError::new(err, span, None))?;\n  251 |             Ok(\n  252 |                 ByteStream::read(reader, span, Signals::empty(), ByteStreamType::Binary)\n  253 |                     .with_known_size(known_size),\n  254 |             )\n  255 |         } else {\n  256 |             Err(ShellError::TypeMismatch {\n  257 |                 err_message: \"expected readable stream\".into(),\n  258 |                 span,\n  259 |             })\n  260 |         }\n  261 |     }","lines":17,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-protocol/src/pipeline/byte_stream.rs#L245-L261"},{"ref":"crates/nu-protocol/src/pipeline/byte_stream.rs:263-279","code":"  263 |     pub fn take(self, span: Span, n: u64) -> Result<Self, ShellError> {\n  264 |         let known_size = self.known_size.map(|s| s.min(n));\n  265 |         if let Some(reader) = self.reader() {\n  266 |             Ok(ByteStream::read(\n  267 |                 reader.take(n),\n  268 |                 span,\n  269 |                 Signals::empty(),\n  270 |                 ByteStreamType::Binary,\n  271 |             )\n  272 |             .with_known_size(known_size))\n  273 |         } else {\n  274 |             Err(ShellError::TypeMismatch {\n  275 |                 err_message: \"expected readable stream\".into(),\n  276 |                 span,\n  277 |             })\n  278 |         }\n  279 |     }","lines":17,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-protocol/src/pipeline/byte_stream.rs#L263-L279"}]},
{"id":"LOGIC_51","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"PipelineIterator converts ByteStream errors (from Chunks::next) into Value::error with Span::unknown() (line 1024-1026), discarding the original span from the ByteStream. The FIXME comment acknowledges this. Error values without spans produce lower-quality diagnostics since the error message cannot be underlined in source.","fix":"Store the ByteStream's span in PipelineIteratorInner::ByteStream and use it when constructing the error Value. The span is available via self.0 fields or by storing it at construction time in PipelineIterator.","locations":[{"ref":"crates/nu-protocol/src/pipeline/pipeline_data.rs:1036-1043","code":" 1036 |             PipelineIteratorInner::ByteStream(stream) => stream.next().map(|x| match x {\n 1037 |                 Ok(x) => x,\n 1038 |                 Err(err) => Value::error(\n 1039 |                     err,\n 1040 |                     Span::unknown(), //FIXME: unclear where this span should come from\n 1041 |                 ),\n 1042 |             }),\n 1043 |         }","lines":8,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-protocol/src/pipeline/pipeline_data.rs#L1036-L1043"}]},
{"id":"LOGIC_52","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`FromValue for Result<A, B>` at lines 617-628 clones the value twice (`v.clone()`) and tries `A::from_value` first, then `B::from_value`. If `A::from_value` succeeds but `B::from_value` would also succeed, it silently returns `Ok(Ok(a))` and discards the `B` interpretation. This may be surprising, but the bigger issue is that cloning `v` twice means any side-effects or large allocations in `v` are doubled. More importantly, when both `A` and `B` conversions fail, the `B` error is silently discarded and the `A` error is returned, which may not be the most informative error.","fix":"Document the try-A-first semantics explicitly. Consider not cloning if `A` conversion can report failure without consuming the value.","locations":[{"ref":"crates/nu-protocol/src/value/from_value.rs:617-628","code":"  617 |     fn from_value(v: Value) -> std::result::Result<Self, ShellError> {\n  618 |         match (A::from_value(v.clone()), B::from_value(v.clone())) {\n  619 |             (Ok(a), _) => Ok(Ok(a)),\n  620 |             (_, Ok(b)) => Ok(Err(b)),\n  621 |             (Err(ea), Err(_)) => Err(ea),\n  622 |         }\n  623 |     }\n  624 | \n  625 |     fn expected_type() -> Type {\n  626 |         Type::one_of([A::expected_type(), B::expected_type()])\n  627 |     }\n  628 | }","lines":12,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-protocol/src/value/from_value.rs#L617-L628"}]},
{"id":"LOGIC_53","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`Value::Duration` compact Debug format at line 361-365 casts the `i64` nanoseconds value to `u64` before creating a `std::time::Duration`. For negative durations (which are valid in nushell), this causes wrapping/incorrect display, e.g. `-1ns` would display as a very large positive duration.","fix":"Handle negative durations in the Debug impl, e.g. by printing a `-` prefix and negating the value before the cast, or using a signed duration display helper.","locations":[{"ref":"crates/nu-protocol/src/value/mod.rs:361-367","code":"  361 |             Value::Duration { val, .. } => wrap_tuple(\n  362 |                 \"Duration\",\n  363 |                 display_as_debug(humantime::Duration::from(std::time::Duration::from_nanos(\n  364 |                     *val as u64,\n  365 |                 ))),\n  366 |             )\n  367 |             .fmt(f),","lines":7,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-protocol/src/value/mod.rs#L361-L367"}]},
{"id":"LOGIC_54","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`human_time_from_now` fallback branch at lines 4326-4332 computes delta years as `val.year() - now.year()` and multiplies by 365, ignoring leap years. The comment even notes that `num_days()` gives a wrong extra year before year ~936. The 365-day approximation will be off by months for date spans spanning multiple leap years. This causes incorrect human-readable date output for extreme historical dates.","fix":"Use `delta.num_days()` with appropriate safeguards, or compute years from the actual day difference rather than subtracting calendar years.","locations":[{"ref":"crates/nu-protocol/src/value/mod.rs:4337-4343","code":" 4337 |         None => {\n 4338 |             // Happens if the total number of nanoseconds exceeds what fits in an i64\n 4339 |             // Note: not using delta.num_days() because it results is wrong for years before ~936: a extra year is added\n 4340 |             let delta_years = val.year() - now.year();\n 4341 |             HumanTime::from(Duration::days(delta_years as i64 * 365))\n 4342 |         }\n 4343 |     }","lines":7,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-protocol/src/value/mod.rs#L4337-L4343"}]},
{"id":"LOGIC_55","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`IntRange::contains` for decreasing ranges at line 165-172 has the same boundary inversion as FloatRange: `Bound::Included(end) if value < end => return false` correctly rejects values strictly below end, but `Bound::Excluded(end) if value <= end => return false` for Excluded should reject `value <= end`, which means exactly `value == end` is correctly rejected. Wait - for Excluded the current check IS correct: `value <= end` rejects values at or below end, but for Included the check is `value < end` which correctly only rejects values strictly below end. So IntRange is correct. Only FloatRange has the inversion.","fix":"No fix needed for IntRange::contains; this finding is informational only (it documents that IntRange is correct, unlike FloatRange).","locations":[{"ref":"crates/nu-protocol/src/value/range.rs:164-187","code":"  164 |         pub fn contains(&self, value: i64) -> bool {\n  165 |             if self.step < 0 {\n  166 |                 // Decreasing range\n  167 |                 if value > self.start {\n  168 |                     return false;\n  169 |                 }\n  170 |                 match self.end {\n  171 |                     Bound::Included(end) if value < end => return false,\n  172 |                     Bound::Excluded(end) if value <= end => return false,\n  173 |                     _ => {}\n  174 |                 };\n  175 |             } else {\n  176 |                 // Increasing range\n  177 |                 if value < self.start {\n  178 |                     return false;\n  179 |                 }\n  180 |                 match self.end {\n  181 |                     Bound::Included(end) if value > end => return false,\n  182 |                     Bound::Excluded(end) if value >= end => return false,\n  183 |                     _ => {}\n  184 |                 };\n  185 |             }\n  186 |             (value - self.start) % self.step == 0\n  187 |         }","lines":24,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-protocol/src/value/range.rs#L164-L187"}]},
{"id":"LOGIC_56","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`FloatRange::Iter` uses a quotient-snapping heuristic at lines 586-592 that could cause incorrect values for ranges where `start` and `step` have the same sign but the quotient happens to be very close to an integer by coincidence. The snap `quotient.round() * self.step` recomputes the value from scratch, which may differ from the expected `start + step * n` in edge cases. The condition `(quotient - quotient.round()).abs() < 1e-10` is a fixed epsilon that may be too tight for large values (where float precision is coarser) or too loose for small values.","fix":"Document the heuristic's assumptions and test cases where the quotient snap might produce unexpected values for extreme step/start combinations.","locations":[{"ref":"crates/nu-protocol/src/value/range.rs:581-599","code":"  581 |         fn next(&mut self) -> Option<Self::Item> {\n  582 |             if let Some(iter) = self.iter {\n  583 |                 let current = self.start + self.step * iter as f64;\n  584 | \n  585 |                 // Snap only tiny floating-point drift (quotient very close to integer).\n  586 |                 let quotient = current / self.step;\n  587 |                 let value = if (quotient - quotient.round()).abs() < 1e-10 {\n  588 |                     quotient.round() * self.step\n  589 |                 } else {\n  590 |                     current\n  591 |                 };\n  592 | \n  593 |                 // Round to step's decimal precision if applicable, to avoid\n  594 |                 // displaying artifacts like 0.30000000000000004.\n  595 |                 let value = if self.round_factor > 0.0 {\n  596 |                     (value * self.round_factor).round() / self.round_factor\n  597 |                 } else {\n  598 |                     value\n  599 |                 };","lines":19,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-protocol/src/value/range.rs#L581-L599"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`history import` backs up the history file before importing, but the import itself is not atomic.\nThe `import()` function iterates items one-by-one calling `dst.save()` for each. If the process is\ninterrupted (signal, out-of-disk, etc.) mid-import, the destination history is left in a partial\nstate. The backup exists, but is not automatically restored on failure - the user must do so\nmanually. There is no rollback on error.","fix":"For SQLite, wrap the loop in a transaction (begin/commit/rollback). For plaintext, write to a temporary file and rename atomically after success, removing the backup only on clean exit.","locations":[{"ref":"crates/nu-cli/src/commands/history/history_import.rs:166-175","code":"  166 | fn import(\n  167 |     dst: &mut dyn History,\n  168 |     src: impl Iterator<Item = Result<HistoryItem, ShellError>>,\n  169 | ) -> Result<(), ShellError> {\n  170 |     for item in src {\n  171 |         let mut item = item?;\n  172 |         item.id = None;\n  173 |         dst.save(item).map_err(error_from_reedline)?;\n  174 |     }\n  175 |     Ok(())","lines":10,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cli/src/commands/history/history_import.rs#L166-L175"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"In `hook.rs`, `eval_hook` silently swallows errors from string-hook and record/code-string hook execution. When `eval_block` returns `Err`, it calls `report_shell_error` to print the error but then continues and returns `Ok(output)` (which is `PipelineData::empty()`). Callers that chain hooks receive a success value even though the hook failed, which can mask errors and produce incorrect behavior (e.g. a broken `pre_prompt` hook silently does nothing).","fix":"Return `Err(err)` instead of calling `report_shell_error` and continuing. Or, if silent-failure is intentional, document it explicitly. The closure branch in `run_hook` (lines 315-321) correctly propagates errors - the string branch should match.","locations":[{"ref":"crates/nu-cmd-base/src/hook.rs:159-166","code":"  159 |             match eval_block::<WithoutDebug>(engine_state, stack, &block, input).map(|p| p.body) {\n  160 |                 Ok(pipeline_data) => {\n  161 |                     output = pipeline_data;\n  162 |                 }\n  163 |                 Err(err) => {\n  164 |                     report_shell_error(Some(stack), engine_state, &err);\n  165 |                 }\n  166 |             }","lines":8,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cmd-base/src/hook.rs#L159-L166"},{"ref":"crates/nu-cmd-base/src/hook.rs:277-286","code":"  277 |                         match eval_block::<WithoutDebug>(engine_state, stack, &block, input)\n  278 |                             .map(|p| p.body)\n  279 |                         {\n  280 |                             Ok(pipeline_data) => {\n  281 |                                 output = pipeline_data;\n  282 |                             }\n  283 |                             Err(err) => {\n  284 |                                 report_shell_error(Some(stack), engine_state, &err);\n  285 |                             }\n  286 |                         }","lines":10,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cmd-base/src/hook.rs#L277-L286"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"ir::Call::req_parser_info returns ShellError::CantFindColumn when the named parser-info key is absent. CantFindColumn is semantically for record column lookups; the actual operation is a key lookup in a parser-info map. This uses the wrong error variant, producing a confusing error message ('column not found') for a missing parser-info entry.","fix":"Return a more appropriate error such as ShellError::CantFindColumn with a clearer message, or introduce a dedicated error variant for missing parser info.","locations":[{"ref":"crates/nu-engine/src/call_ext.rs:376-381","code":"  376 |             Err(ShellError::CantFindColumn {\n  377 |                 col_name: name.into(),\n  378 |                 span: None,\n  379 |                 src_span: self.head,\n  380 |             })\n  381 |         }","lines":6,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-engine/src/call_ext.rs#L376-L381"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"In parse_let() (and parse_mut()), when working_set.find_decl(b\"let\") returns None, the code records one UnknownState error and then falls through to record a second UnknownState error immediately below (line 118-121). Two redundant errors are emitted for the same root cause.","fix":"Return after the first error or restructure with if-else so only one error path is taken.","locations":[{"ref":"crates/nu-parser/src/parse_bindings.rs:133-144","code":"  133 |         working_set.error(ParseError::UnknownState(\n  134 |             \"internal error: let or const statements not found in core language\".into(),\n  135 |             Span::concat(spans),\n  136 |         ))\n  137 |     }\n  138 | \n  139 |     working_set.error(ParseError::UnknownState(\n  140 |         \"internal error: let or const statement unparsable\".into(),\n  141 |         Span::concat(spans),\n  142 |     ));\n  143 | \n  144 |     garbage_pipeline(working_set, spans)","lines":12,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/parse_bindings.rs#L133-L144"},{"ref":"crates/nu-parser/src/parse_bindings.rs:396-408","code":"  396 |     } else {\n  397 |         working_set.error(ParseError::UnknownState(\n  398 |             \"internal error: let or const statements not found in core language\".into(),\n  399 |             Span::concat(spans),\n  400 |         ))\n  401 |     }\n  402 | \n  403 |     working_set.error(ParseError::UnknownState(\n  404 |         \"internal error: let or const statement unparsable\".into(),\n  405 |         Span::concat(spans),\n  406 |     ));\n  407 | \n  408 |     garbage_pipeline(working_set, spans)","lines":13,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/parse_bindings.rs#L396-L408"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"parse_const() has the same double-error pattern: when the decl is not found it emits an UnknownState error and then falls through to emit a second UnknownState error on lines 264-267.","fix":"Return after the first error or use if-else to avoid the second unconditional error.","locations":[{"ref":"crates/nu-parser/src/parse_bindings.rs:283-295","code":"  283 |     } else {\n  284 |         working_set.error(ParseError::UnknownState(\n  285 |             \"internal error: let or const statements not found in core language\".into(),\n  286 |             Span::concat(spans),\n  287 |         ))\n  288 |     }\n  289 | \n  290 |     working_set.error(ParseError::UnknownState(\n  291 |         \"internal error: let or const statement unparsable\".into(),\n  292 |         Span::concat(spans),\n  293 |     ));\n  294 | \n  295 |     (garbage_pipeline(working_set, spans), None)","lines":13,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/parse_bindings.rs#L283-L295"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"parse_module emits a duplicate ModuleNotFound error. When `spans.len() == split_id + 1` and parse_module_file_or_dir returns None, it has already registered an error internally. parse_module then unconditionally registers a second ParseError::ModuleNotFound for the same span (lines 975-978), resulting in the user seeing the same error twice.","fix":"Remove the redundant `working_set.error(ParseError::ModuleNotFound(...))` call; rely solely on the error emitted by parse_module_file_or_dir.","locations":[{"ref":"crates/nu-parser/src/parse_module.rs:975-988","code":"  975 |         if let Some(module_id) = parse_module_file_or_dir(\n  976 |             working_set,\n  977 |             module_name_or_path.as_bytes(),\n  978 |             module_name_or_path_span,\n  979 |             None,\n  980 |         ) {\n  981 |             return (pipeline, Some(module_id));\n  982 |         } else {\n  983 |             working_set.error(ParseError::ModuleNotFound(\n  984 |                 module_name_or_path_span,\n  985 |                 module_name_or_path,\n  986 |             ));\n  987 |             return (pipeline, None);\n  988 |         }","lines":14,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/parse_module.rs#L975-L988"}]},
{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"recover_from_panic() handles poisoned mutexes for repl_state, jobs, and regex_cache, but omits debugger (line 135) and report_log (line 136). If a panic occurs while the debugger or report_log mutex is locked, subsequent calls to activate_debugger(), deactivate_debugger(), or any code that logs via report_log will propagate the poison error to their callers rather than being recovered gracefully.","fix":"Add is_poisoned() checks and reinitializations for self.debugger and self.report_log inside recover_from_panic(), analogous to the existing repl_state recovery.","locations":[{"ref":"crates/nu-protocol/src/engine/engine_state.rs:1172-1188","code":" 1172 |     pub fn recover_from_panic(&mut self) {\n 1173 |         if Mutex::is_poisoned(&self.repl_state) {\n 1174 |             self.repl_state = Arc::new(Mutex::new(ReplState {\n 1175 |                 buffer: \"\".to_string(),\n 1176 |                 cursor_pos: 0,\n 1177 |                 accept: false,\n 1178 |             }));\n 1179 |         }\n 1180 |         if Mutex::is_poisoned(&self.jobs) {\n 1181 |             self.jobs = Arc::new(Mutex::new(Jobs::default()));\n 1182 |         }\n 1183 |         if Mutex::is_poisoned(&self.regex_cache) {\n 1184 |             self.regex_cache = Arc::new(Mutex::new(LruCache::new(\n 1185 |                 NonZeroUsize::new(REGEX_CACHE_SIZE).expect(\"tried to create cache of size zero\"),\n 1186 |             )));\n 1187 |         }\n 1188 |     }","lines":17,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-protocol/src/engine/engine_state.rs#L1172-L1188"},{"ref":"crates/nu-protocol/src/engine/engine_state.rs:162-163","code":"  162 |     pub debugger: Arc<Mutex<Box<dyn Debugger>>>,\n  163 |     pub report_log: Arc<Mutex<ReportLog>>,","lines":2,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-protocol/src/engine/engine_state.rs#L162-L163"}]},
{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `error_make.rs` line 136, when the pipeline input cannot be converted to `ErrorInfo`, the error is silently discarded (`Err(_) => vec![]`). If the user pipes in an incompatible value that they expect to be chained as an inner error, it is silently dropped with no warning. This can be surprising - the user sees no indication their inner error was ignored.","fix":"Consider emitting a warning or including the raw input value in the constructed error's `inner` list (or accept it as a raw `Value::Error`) so that accidental piping of unsupported types is visible to the user.","locations":[{"ref":"crates/nu-cmd-lang/src/core_commands/error_make.rs:134-137","code":"  134 |         let inners = match ErrorInfo::from_value(input.into_value(call.head)?) {\n  135 |             Ok(v) => vec![v.into_value(call.head)],\n  136 |             Err(_) => vec![],\n  137 |         };","lines":4,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cmd-lang/src/core_commands/error_make.rs#L134-L137"}]},
{"id":"ERR_9","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`add_default_context` and `add_plugin_command_context` silently swallow errors from `engine_state.merge_delta()` by printing them with `eprintln!` and returning the partially-configured engine state. Callers receive no indication that the context is broken, which can produce confusing \"command not found\" errors at runtime with no clear cause.","fix":"Change both functions to return `Result<EngineState, ShellError>` and propagate the error, or at minimum `panic!()` since this indicates a serious programming error during startup.","locations":[{"ref":"crates/nu-cmd-lang/src/default_context.rs:79-81","code":"   79 |     if let Err(err) = engine_state.merge_delta(delta) {\n   80 |         eprintln!(\"Error creating default context: {err:?}\");\n   81 |     }","lines":3,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cmd-lang/src/default_context.rs#L79-L81"},{"ref":"crates/nu-cmd-plugin/src/default_context.rs:26-28","code":"   26 |     if let Err(err) = engine_state.merge_delta(delta) {\n   27 |         eprintln!(\"Error creating default context: {err:?}\");\n   28 |     }","lines":3,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cmd-plugin/src/default_context.rs#L26-L28"}]},
{"id":"ERR_10","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`modify_plugin_file` in `util.rs` reads the existing plugin registry file and then writes it back with `File::create` (which truncates). There is no locking, no atomic rename, and no temporary file. Concurrent calls to `plugin add` or `plugin rm` (e.g. from two shells) can race: both read the same file, both modify their in-memory copy, and the last writer overwrites the first writer's changes. `File::create` also truncates the file immediately, so a crash between the `create` and `write_to` leaves a corrupt (empty) registry file.","fix":"Write to a sibling temporary file first, then atomically rename it over the target (`std::fs::rename`). Consider a file-level advisory lock (`fs4` or `liblockfile`) to prevent lost-update races.","locations":[{"ref":"crates/nu-cmd-plugin/src/util.rs:69-114","code":"   69 | pub(crate) fn modify_plugin_file(\n   70 |     engine_state: &EngineState,\n   71 |     stack: &mut Stack,\n   72 |     span: Span,\n   73 |     custom_path: &Option<Spanned<String>>,\n   74 |     operate: impl FnOnce(&mut PluginRegistryFile) -> Result<(), ShellError>,\n   75 | ) -> Result<(), ShellError> {\n   76 |     let plugin_registry_file_path =\n   77 |         get_plugin_registry_file_path(engine_state, stack, span, custom_path)?;\n   78 | \n   79 |     let file_span = custom_path.as_ref().map(|p| p.span).unwrap_or(span);\n   80 | \n   81 |     // Try to read the plugin file if it exists\n   82 |     let mut contents = if fs::metadata(&plugin_registry_file_path).is_ok_and(|m| m.len() > 0) {\n   83 |         PluginRegistryFile::read_from(\n   84 |             File::open(&plugin_registry_file_path)\n   85 |                 .map_err(|err| IoError::new(err, file_span, plugin_registry_file_path.clone()))?,\n   86 |             Some(file_span),\n   87 |         )?\n   88 |     } else {\n   89 |         PluginRegistryFile::default()\n   90 |     };\n   91 | \n   92 |     // Do the operation\n   93 |     operate(&mut contents)?;\n   94 | \n   95 |     // Save the modified file on success\n   96 |     // First, ensure the parent directory exists\n   97 |     if let Some(parent_dir) = plugin_registry_file_path.parent() {\n   98 |         fs::create_dir_all(parent_dir).map_err(|err| {\n   99 |             IoError::new(\n  100 |                 err.not_found_as(NotFound::Directory),\n  101 |                 file_span,\n  102 |                 parent_dir.to_path_buf(),\n  103 |             )\n  104 |         })?;\n  105 |     }\n  106 | \n  107 |     // Now create the file\n  108 |     contents.write_to(\n  109 |         File::create(&plugin_registry_file_path)\n  110 |             .map_err(|err| IoError::new(err, file_span, plugin_registry_file_path))?,\n  111 |         Some(span),\n  112 |     )?;\n  113 | \n  114 |     Ok(())","lines":46,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cmd-plugin/src/util.rs#L69-L114"}]},
{"id":"ERR_11","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"parse_export_env silently drops extra arguments beyond the first block. The call to parse_internal_call passes only `&[spans[1]]` instead of the full `&spans[1..]`. If the user writes `export-env { } extra-arg`, the extra span is never parsed or flagged.","fix":"Pass `&spans[1..]` to parse_internal_call so that extra trailing arguments are reported as errors by the normal argument parser.","locations":[{"ref":"crates/nu-parser/src/parse_module.rs:394-401","code":"  394 |             } = parse_internal_call(\n  395 |                 working_set,\n  396 |                 spans[0],\n  397 |                 &[spans[1]],\n  398 |                 decl_id,\n  399 |                 ArgumentParsingLevel::Full,\n  400 |                 None,\n  401 |             );","lines":8,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/parse_module.rs#L394-L401"}]},
{"id":"ERR_12","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`Value::sub` for `Filesize - Filesize` at line 2914 reports the error message as `\"add operation overflowed\"` but the operation is subtraction.","fix":"Change the error message to `\"subtraction operation overflowed\"`.","locations":[{"ref":"crates/nu-protocol/src/value/mod.rs:2940-2945","code":" 2940 |                     Ok(Value::filesize(val, span))\n 2941 |                 } else {\n 2942 |                     Err(ShellError::OperatorOverflow {\n 2943 |                         msg: \"add operation overflowed\".into(),\n 2944 |                         span,\n 2945 |                         help: None,","lines":6,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-protocol/src/value/mod.rs#L2940-L2945"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"Every access to the `$env` variable (both AST and IR evaluators) re-collects all environment variable key-value pairs from scratch, clones all values, and sorts them. For scripts that read `$env` frequently inside tight loops this is a significant hidden cost.","fix":"Consider a cached/lazy representation for the record, or at minimum avoid sorting unless the caller requires ordered output (e.g. provide an unsorted version by default).","locations":[{"ref":"crates/nu-engine/src/eval.rs:719-732","code":"  719 |         ENV_VARIABLE_ID => {\n  720 |             let env_vars = stack.get_env_vars(engine_state);\n  721 |             let env_columns = env_vars.keys();\n  722 |             let env_values = env_vars.values();\n  723 | \n  724 |             let mut pairs = env_columns\n  725 |                 .map(|x| x.to_string())\n  726 |                 .zip(env_values.cloned())\n  727 |                 .collect::<Vec<(String, Value)>>();\n  728 | \n  729 |             pairs.sort_by(|a, b| a.0.cmp(&b.0));\n  730 | \n  731 |             Ok(Value::record(pairs.into_iter().collect(), span))\n  732 |         }","lines":14,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-engine/src/eval.rs#L719-L732"},{"ref":"crates/nu-engine/src/eval_ir.rs:1850-1862","code":" 1850 |         ENV_VARIABLE_ID => {\n 1851 |             let env_vars = ctx.stack.get_env_vars(ctx.engine_state);\n 1852 |             let env_columns = env_vars.keys();\n 1853 |             let env_values = env_vars.values();\n 1854 | \n 1855 |             let mut pairs = env_columns\n 1856 |                 .map(|x| x.to_string())\n 1857 |                 .zip(env_values.cloned())\n 1858 |                 .collect::<Vec<(String, Value)>>();\n 1859 | \n 1860 |             pairs.sort_by(|a, b| a.0.cmp(&b.0));\n 1861 | \n 1862 |             Ok(Value::record(pairs.into_iter().collect(), span))","lines":13,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-engine/src/eval_ir.rs#L1850-L1862"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"In `gather_arguments` (eval_ir.rs line 1505), checking whether a named variable has already been set uses a linear scan over `callee_stack.vars` for each named argument in the signature. This is O(n*m) where n is the number of named parameters and m is the number of already-set variables. For commands with many named arguments this degrades noticeably on each call.","fix":"Use a `HashSet<VarId>` built once before the loop to track set var IDs, reducing the per-iteration lookup to O(1) amortised.","locations":[{"ref":"crates/nu-engine/src/eval_ir.rs:1726-1741","code":" 1726 |     for named_arg in &block.signature.named {\n 1727 |         if let Some(var_id) = named_arg.var_id {\n 1728 |             // For named arguments, we do this check by looking to see if the variable was set yet on\n 1729 |             // the stack. This assumes that the stack's variables was previously empty, but that's a\n 1730 |             // fair assumption for a brand new callee stack.\n 1731 |             if !callee_stack.vars.iter().any(|(id, _)| *id == var_id) {\n 1732 |                 let val = if named_arg.arg.is_none() {\n 1733 |                     Value::bool(false, call_head)\n 1734 |                 } else if let Some(value) = &named_arg.default_value {\n 1735 |                     value.clone()\n 1736 |                 } else {\n 1737 |                     Value::nothing(call_head)\n 1738 |                 };\n 1739 |                 callee_stack.add_var(var_id, val);\n 1740 |             }\n 1741 |         }","lines":16,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-engine/src/eval_ir.rs#L1726-L1741"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"medium","difficulty":"easy","description":"In `glob_from` (glob_from.rs lines 53-56), `path.components()` is called twice per iteration: once for `.count()` and once for `.nth(c)`. Since `.nth()` is O(n), the overall loop is O(n^2) in the number of path components.","fix":"Collect the components into a `Vec` once before the loop, then index directly: `let comps: Vec<_> = path.components().collect(); for comp in &comps[counter..] { just_pattern.push(comp); }`.","locations":[{"ref":"crates/nu-engine/src/glob_from.rs:53-56","code":"   53 |         for c in counter..path.components().count() {\n   54 |             if let Some(comp) = path.components().nth(c) {\n   55 |                 just_pattern.push(comp);\n   56 |             }","lines":4,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-engine/src/glob_from.rs#L53-L56"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"medium","difficulty":"easy","description":"In parse_call(), when handling an alias whose wrapped_call is an ExternalCall, the code clones the entire alias with alias.clone() just to pattern-match on its wrapped_call field. The alias reference is already available; cloning a decl object (which may contain signature, examples, etc.) is unnecessarily expensive.","fix":"Pattern-match directly on &alias.wrapped_call without cloning the alias. The inner head and args clones (lines 1435/1438) are already present and sufficient.","locations":[{"ref":"crates/nu-parser/src/parse_calls.rs:1716-1723","code":" 1716 |         let parsed_call = if let Some(alias) = decl.as_alias() {\n 1717 |             if let Expression {\n 1718 |                 expr: Expr::ExternalCall(head, args),\n 1719 |                 span: _,\n 1720 |                 span_id: _,\n 1721 |                 ty,\n 1722 |             } = &alias.clone().wrapped_call\n 1723 |             {","lines":8,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/parse_calls.rs#L1716-L1723"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"medium","difficulty":"easy","description":"`PartialOrd` for `Value::Record` calls `lhs.clone().into_owned()` and `rhs.clone().into_owned()` unconditionally to sort copies of the records for comparison. This allocates and copies entire records (including all string keys and Values) on every comparison. Record comparison is used heavily in sorting and deduplication operations. For large records this is O(n) allocation per comparison.","fix":"Consider comparing without cloning by iterating sorted views (e.g. collecting `(col, val)` references sorted by col name) or caching sorted indices. At minimum, skip the clone when both records are already sorted.","locations":[{"ref":"crates/nu-protocol/src/value/mod.rs:2635-2637","code":" 2635 |                     let mut lhs = lhs.clone().into_owned();\n 2636 |                     let mut rhs = rhs.clone().into_owned();\n 2637 |                     lhs.sort_cols();","lines":3,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-protocol/src/value/mod.rs#L2635-L2637"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In documentation.rs get_command_documentation, engine_state.get_signatures_and_declids(true) iterates every declaration in engine state to find subcommands. This is called every time --help output is generated. For large engines with many plugins/commands loaded, this is O(n) over all declarations just to find subcommands that start with the current command name.","fix":"Consider maintaining an index of subcommand relationships in EngineState to avoid the full scan, or at minimum cache the result for the duration of a single help invocation.","locations":[{"ref":"crates/nu-engine/src/documentation.rs:316-364","code":"  316 |     let signatures = engine_state.get_signatures_and_declids(true);\n  317 |     // track which declarations we've already added to `subcommands`\n  318 |     let mut seen = HashSet::new();\n  319 |     for (sig, decl_id) in signatures {\n  320 |         // Prefer the overlay-visible declaration name (if any) for display and matching.\n  321 |         // Fall back to the signature's name if not present.\n  322 |         let display_name = engine_state\n  323 |             .find_decl_name(decl_id, &[])\n  324 |             .map(|bytes| String::from_utf8_lossy(bytes).to_string())\n  325 |             .unwrap_or_else(|| sig.name.clone());\n  326 | \n  327 |         // Don't display removed/deprecated commands in the Subcommands list. We consider a signature a subcommand when either the overlay-visible\n  328 |         // `display_name` begins with `cmd_name ` *or* the canonical signature name does; the latter covers cases where `display_name` returns the\n  329 |         // alias instead of the script-qualified name due to hashmap ordering.\n  330 |         if (display_name.starts_with(&format!(\"{cmd_name} \"))\n  331 |             || sig.name.starts_with(&format!(\"{cmd_name} \")))\n  332 |             && !matches!(sig.category, Category::Removed)\n  333 |             && seen.insert(decl_id)\n  334 |         {\n  335 |             let command_type = engine_state.get_decl(decl_id).command_type();\n  336 | \n  337 |             // choose which name to show: prefer the overlay-visible one if it actually matches the prefix, otherwise fall back to the canonical\n  338 |             // signature name (which is usually the script-qualified form).\n  339 |             let name_to_print = if display_name.starts_with(&format!(\"{cmd_name} \")) {\n  340 |                 display_name.clone()\n  341 |             } else {\n  342 |                 sig.name.clone()\n  343 |             };\n  344 | \n  345 |             // If it's a plugin, alias, or custom command, display that information in the help\n  346 |             if command_type == CommandType::Plugin\n  347 |                 || command_type == CommandType::Alias\n  348 |                 || command_type == CommandType::Custom\n  349 |             {\n  350 |                 subcommands.push(format!(\n  351 |                     \"  {help_subcolor_one}{} {help_section_name}({}){RESET} - {}\",\n  352 |                     name_to_print,\n  353 |                     command_type,\n  354 |                     highlight_code(&sig.description, engine_state, stack, head)\n  355 |                 ));\n  356 |             } else {\n  357 |                 subcommands.push(format!(\n  358 |                     \"  {help_subcolor_one}{}{RESET} - {}\",\n  359 |                     name_to_print,\n  360 |                     highlight_code(&sig.description, engine_state, stack, head)\n  361 |                 ));\n  362 |             }\n  363 |         }\n  364 |     }","lines":49,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-engine/src/documentation.rs#L316-L364"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In `CallEval::finalize_arguments` (eval.rs line 269), `self.named_args.contains(&flag.long)` performs a linear scan over the Vec for each remaining flag. For commands with many flags this is O(n^2). The analogous `named_args` field is a `Vec<String>`.","fix":"Replace `named_args: Vec<String>` with a `HashSet<String>` (or a small sorted Vec and binary search) to make the `contains` check O(1).","locations":[{"ref":"crates/nu-engine/src/eval.rs:317-337","code":"  317 |         let remaining_flags = signature\n  318 |             .named\n  319 |             .iter()\n  320 |             // Skip provided flags\n  321 |             .filter(|flag| !self.named_args.contains(&flag.long))\n  322 |             // Ignore named arguments without var_id.\n  323 |             // There is some code in nu_cli::completions that relies on this behavior of `eval_call`.\n  324 |             .filter_map(|flag| Some((flag.var_id?, flag)));\n  325 | \n  326 |         for (var_id, flag) in remaining_flags {\n  327 |             if flag.arg.is_none() {\n  328 |                 self.callee_stack\n  329 |                     .add_var(var_id, Value::bool(false, self.head_span));\n  330 |             } else {\n  331 |                 let value = flag\n  332 |                     .default_value\n  333 |                     .clone()\n  334 |                     .unwrap_or(Value::nothing(self.head_span));\n  335 |                 self.callee_stack.add_var(var_id, value);\n  336 |             }\n  337 |         }","lines":21,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-engine/src/eval.rs#L317-L337"}]},
{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"In `eval_call` (eval_ir.rs line 1290), `Span::merge_many` iterates over all argument spans on every built-in command call to compute the overall call span. The FIXME comment acknowledges this should be precalculated. At scale (tight loops calling built-ins with many arguments) this becomes a non-trivial overhead.","fix":"Precalculate and store the merged span in the IR `Call` struct during compilation, removing the per-call iteration.","locations":[{"ref":"crates/nu-engine/src/eval_ir.rs:1472-1481","code":" 1472 |             // FIXME: precalculate this and save it somewhere\n 1473 |             let span = Span::merge_many(\n 1474 |                 std::iter::once(head).chain(\n 1475 |                     caller_stack\n 1476 |                         .arguments\n 1477 |                         .get_args(*args_base, args_len)\n 1478 |                         .iter()\n 1479 |                         .flat_map(|arg| arg.span()),\n 1480 |                 ),\n 1481 |             );","lines":10,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-engine/src/eval_ir.rs#L1472-L1481"}]},
{"id":"PERF_9","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"find_decl_with_command_type() iterates all known declarations from the end to find a match by name and command type. With many declarations this is O(n) every time %cmd is used, where n is the total number of declared commands.","fix":"Consider maintaining a separate index keyed by (name, command_type) in StateWorkingSet, or at minimum memoize results.","locations":[{"ref":"crates/nu-parser/src/parse_calls.rs:1807-1823","code":" 1807 | fn find_decl_with_command_type(\n 1808 |     working_set: &StateWorkingSet<'_>,\n 1809 |     name: &[u8],\n 1810 |     command_type: CommandType,\n 1811 | ) -> Option<DeclId> {\n 1812 |     // Search all known declarations so `%cmd` can still resolve a built-in even when\n 1813 |     // a custom command with the same name shadows it in normal visibility lookup.\n 1814 |     for idx in (0..working_set.num_decls()).rev() {\n 1815 |         let decl_id = DeclId::new(idx);\n 1816 |         let decl = working_set.get_decl(decl_id);\n 1817 |         if decl.command_type() == command_type && decl.name().as_bytes() == name {\n 1818 |             return Some(decl_id);\n 1819 |         }\n 1820 |     }\n 1821 | \n 1822 |     None\n 1823 | }","lines":17,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/parse_calls.rs#L1807-L1823"}]},
{"id":"PERF_10","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"find_longest_decl_with_prefix() first copies all spans into a local Vec, then rebuilds the full joined name with command_name_from_spans, only to repeatedly discard tail spans and rebuild the name on each iteration. Each iteration allocates a new Vec<u8> for the name.","fix":"Pre-compute each prefix name incrementally by appending single spans, or track the tail length and rebuild only when the lookup fails, avoiding O(n^2) allocation in the common path.","locations":[{"ref":"crates/nu-parser/src/parse_calls.rs:1902-1930","code":" 1902 |     let mut pos = 0;\n 1903 |     let cmd_start = pos;\n 1904 |     let mut name_spans = vec![];\n 1905 | \n 1906 |     for word_span in spans[cmd_start..].iter() {\n 1907 |         // Find the longest group of words that could form a command\n 1908 | \n 1909 |         name_spans.push(*word_span);\n 1910 | \n 1911 |         pos += 1;\n 1912 |     }\n 1913 | \n 1914 |     let mut name = command_name_from_spans(working_set, &name_spans, prefix);\n 1915 | \n 1916 |     let mut maybe_decl_id = working_set.find_decl(&name);\n 1917 | \n 1918 |     while maybe_decl_id.is_none() {\n 1919 |         // Find the longest command match\n 1920 |         if name_spans.len() <= 1 {\n 1921 |             // Keep the first word even if it does not match -- could be external command\n 1922 |             break;\n 1923 |         }\n 1924 | \n 1925 |         name_spans.pop();\n 1926 |         pos -= 1;\n 1927 | \n 1928 |         name = command_name_from_spans(working_set, &name_spans, prefix);\n 1929 |         maybe_decl_id = working_set.find_decl(&name);\n 1930 |     }","lines":29,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/parse_calls.rs#L1902-L1930"}]},
{"id":"PERF_11","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"parse_keyword (parse_keywords.rs line 88) clones the entire `call_expr` Expression (including its boxed Call with all arguments and parser_info) just to destructure a Box<Call> from the clone, while the original `call_expr` is needed only in the fallback `_ =>` arm (line 109) and the else branch (line 112). This unnecessary clone is executed on every parsed keyword invocation.","fix":"Restructure to avoid the clone: extract `decl_id` via a reference first, then match on the declaration name, and only reconstruct the pipeline call once. For example, use `if let Expr::Call(call) = &call_expr.expr { let name = working_set.get_decl(call.decl_id).name(); match name { ... } }` and consume `call_expr` only at the end.","locations":[{"ref":"crates/nu-parser/src/parse_keywords.rs:153-181","code":"  153 |     if let Expression {\n  154 |         expr: Expr::Call(call),\n  155 |         ..\n  156 |     } = call_expr.clone()\n  157 |     {\n  158 |         // Apply parse keyword side effects\n  159 |         let cmd = working_set.get_decl(call.decl_id);\n  160 |         // check help flag first.\n  161 |         if call.named_iter().any(|(flag, _, _)| flag.item == \"help\") {\n  162 |             let call_span = call.span();\n  163 |             return Pipeline::from_vec(vec![Expression::new(\n  164 |                 working_set,\n  165 |                 Expr::Call(call),\n  166 |                 call_span,\n  167 |                 Type::Any,\n  168 |             )]);\n  169 |         }\n  170 | \n  171 |         match cmd.name() {\n  172 |             \"overlay hide\" => crate::parse_module::parse_overlay_hide(working_set, call),\n  173 |             \"overlay new\" => crate::parse_module::parse_overlay_new(working_set, call),\n  174 |             \"overlay use\" => crate::parse_module::parse_overlay_use(working_set, call),\n  175 |             #[cfg(feature = \"plugin\")]\n  176 |             \"plugin use\" => crate::parse_source::parse_plugin_use(working_set, call),\n  177 |             _ => Pipeline::from_vec(vec![call_expr]),\n  178 |         }\n  179 |     } else {\n  180 |         Pipeline::from_vec(vec![call_expr])\n  181 |     }","lines":29,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/parse_keywords.rs#L153-L181"}]},
{"id":"PERF_12","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"In parse_filesize (parse_literals.rs line 1344), the entire input string is converted to uppercase (`x.to_ascii_uppercase()`) before suffix matching. This allocates a new String for every token that could be a filesize, even though only the unit suffix needs to be case-normalized.","fix":"Instead of uppercasing the full string, check suffixes case-insensitively by comparing only the relevant suffix bytes. For example, pass a transform that only uppercases the tail portion, or compare the suffix bytes with ASCII case-insensitive comparison.","locations":[{"ref":"crates/nu-parser/src/parse_literals.rs:1348-1363","code":" 1348 |     match parse_unit_value(bytes, span, FILESIZE_UNIT_GROUPS, Type::Filesize, |x| {\n 1349 |         x.to_ascii_uppercase()\n 1350 |     }) {\n 1351 |         Some(Ok(expr)) => {\n 1352 |             let span_id = working_set.add_span(span);\n 1353 |             expr.with_span_id(span_id)\n 1354 |         }\n 1355 |         Some(Err(mk_err_for)) => {\n 1356 |             working_set.error(mk_err_for(\"filesize\"));\n 1357 |             garbage(working_set, span)\n 1358 |         }\n 1359 |         None => {\n 1360 |             working_set.error(ParseError::Expected(\"filesize with valid units\", span));\n 1361 |             garbage(working_set, span)\n 1362 |         }\n 1363 |     }","lines":16,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/parse_literals.rs#L1348-L1363"}]},
{"id":"PERF_13","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"In the `export module` branch of parse_export_in_module, `module_name` is fetched and trimmed even when the success path does not use it (the success path calls working_set.get_module(module_id).name() instead). The trimmed module_name is only used in the error message.","fix":"Move the module_name computation inside the `else` branch so it is only evaluated on the error path.","locations":[{"ref":"crates/nu-parser/src/parse_module.rs:291-308","code":"  291 |                 if let Some(module_name_span) = spans.get(2) {\n  292 |                     let module_name = working_set.get_span_contents(*module_name_span);\n  293 |                     let module_name = trim_quotes(module_name);\n  294 | \n  295 |                     if let Some(module_id) = maybe_module_id {\n  296 |                         result.push(Exportable::Module {\n  297 |                             name: working_set.get_module(module_id).name(),\n  298 |                             id: module_id,\n  299 |                         });\n  300 |                     } else {\n  301 |                         working_set.error(ParseError::InternalError(\n  302 |                             format!(\n  303 |                                 \"failed to find added module '{}'\",\n  304 |                                 String::from_utf8_lossy(module_name)\n  305 |                             ),\n  306 |                             Span::concat(&spans[1..]),\n  307 |                         ));\n  308 |                     }","lines":18,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/parse_module.rs#L291-L308"}]},
{"id":"PERF_14","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"In parse_use, `working_set.get_span_contents(name_span).to_vec()` allocates a new Vec to store the contents only for a byte-slice comparison. The comparison can be done directly against the borrowed slice returned by get_span_contents.","fix":"Change `let use_call = working_set.get_span_contents(name_span).to_vec(); if use_call != b\"use\"` to `if working_set.get_span_contents(name_span) != b\"use\"`.","locations":[{"ref":"crates/nu-parser/src/parse_module.rs:1098-1105","code":" 1098 |     let use_call = working_set.get_span_contents(name_span).to_vec();\n 1099 |     if use_call != b\"use\" {\n 1100 |         working_set.error(ParseError::UnknownState(\n 1101 |             \"internal error: Wrong call name for 'use' command\".into(),\n 1102 |             Span::concat(spans),\n 1103 |         ));\n 1104 |         return (garbage_pipeline(working_set, spans), vec![]);\n 1105 |     }","lines":8,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/parse_module.rs#L1098-L1105"}]},
{"id":"PERF_15","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"In parse_input_output_types, every call to working_set.get_span_contents(tokens[idx].span) is followed by .to_vec(), allocating a new Vec for bytes that are only used to call parse_type. parse_type takes a &[u8], so the allocation is unnecessary.","fix":"Pass the borrowed slice directly to parse_type without calling .to_vec().","locations":[{"ref":"crates/nu-parser/src/parse_signatures.rs:353-354","code":"  353 |         let type_bytes = working_set.get_span_contents(tokens[idx].span).to_vec();\n  354 |         let input_type = parse_type(working_set, &type_bytes, tokens[idx].span);","lines":2,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/parse_signatures.rs#L353-L354"},{"ref":"crates/nu-parser/src/parse_signatures.rs:379-380","code":"  379 |         let type_bytes = working_set.get_span_contents(tokens[idx].span).to_vec();\n  380 |         let output_type = parse_type(working_set, &type_bytes, tokens[idx].span);","lines":2,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/parse_signatures.rs#L379-L380"}]},
{"id":"PERF_16","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"merge_delta() clones the entire first ScopeFrame (first.clone().overlays) on line 282 just to iterate its overlays, even though the loop consumes the overlays and the rest of first (active_overlays, removed_overlays) is used afterwards. Cloning a ScopeFrame with many overlays wastes significant memory and time at parse-merge time.","fix":"Use std::mem::take(&mut first.overlays) or separate the overlays field before the loop: let overlays = first.overlays; for (delta_name, delta_overlay) in overlays { ... }. Then use first.active_overlays and first.removed_overlays in the remaining code.","locations":[{"ref":"crates/nu-protocol/src/engine/engine_state.rs:348","code":"  348 |         for (delta_name, delta_overlay) in first.clone().overlays {","lines":1,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-protocol/src/engine/engine_state.rs#L348"}]},
{"id":"PERF_17","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"get_decls_sorted() clones the entire overlay_frame.decls HashMap (O(n) allocation) on every call for both branches, before optionally filtering. The !include_hidden branch clones-then-filters when it could simply iterate the reference without cloning. Called on completions and help lookups this wastes allocation proportional to the number of declared commands.","fix":"In the !include_hidden branch, replace .clone().into_iter().filter(...).collect() with overlay_frame.decls.iter().filter(|(_, id)| ...).map(|(k, v)| (k.clone(), *v)).collect(). The include_hidden branch still needs a clone since decls_map.extend() consumes the iterator.","locations":[{"ref":"crates/nu-protocol/src/engine/engine_state.rs:954-977","code":"  954 |     /// Get all commands within scope, sorted by the commands' names\n  955 |     pub fn get_decls_sorted(&self, include_hidden: bool) -> Vec<(Vec<u8>, DeclId)> {\n  956 |         let mut decls_map = HashMap::new();\n  957 | \n  958 |         for overlay_frame in self.active_overlays(&[]) {\n  959 |             let new_decls = if include_hidden {\n  960 |                 overlay_frame.decls.clone()\n  961 |             } else {\n  962 |                 overlay_frame\n  963 |                     .decls\n  964 |                     .clone()\n  965 |                     .into_iter()\n  966 |                     .filter(|(_, id)| overlay_frame.visibility.is_decl_id_visible(id))\n  967 |                     .collect()\n  968 |             };\n  969 | \n  970 |             decls_map.extend(new_decls);\n  971 |         }\n  972 | \n  973 |         let mut decls: Vec<(Vec<u8>, DeclId)> = decls_map.into_iter().collect();\n  974 | \n  975 |         decls.sort_by(|a, b| a.0.cmp(&b.0));\n  976 |         decls\n  977 |     }","lines":24,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-protocol/src/engine/engine_state.rs#L954-L977"}]},
{"id":"PERF_18","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`Value::get_type` for `Value::Record` at lines 1008-1010 clones every column name string (`x.clone()`) to build the `Type::Record` descriptor. This is called frequently (e.g. in error messages, type checking). For records with many fields or long column names this causes significant allocation.","fix":"Consider using `Arc<str>` or `Box<str>` for column names in `Type::Record`, or lazily computing the type descriptor.","locations":[{"ref":"crates/nu-protocol/src/value/mod.rs:1010-1012","code":" 1010 |             Value::Record { val, .. } => {\n 1011 |                 Type::Record(val.iter().map(|(x, y)| (x.clone(), y.get_type())).collect())\n 1012 |             }","lines":3,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-protocol/src/value/mod.rs#L1010-L1012"}]},
{"id":"PERF_19","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`Value::to_expanded_string` for `List` and `Record` constructs an intermediate `Vec<String>` before joining, allocating O(n) strings. Using `itertools::join` or writing directly to a `String` with `push_str` / fold would avoid the intermediate allocation.","fix":"Use `vals.iter().map(|x| x.to_expanded_string(\", \", config)).collect::<Vec<_>>().join(separator)` already does this - no further fix needed here. But consider `itertools::Itertools::join` to skip the Vec entirely.","locations":[{"ref":"crates/nu-protocol/src/value/mod.rs:1125-1138","code":" 1125 |             Value::List { vals: val, .. } => format!(\n 1126 |                 \"[{}]\",\n 1127 |                 val.iter()\n 1128 |                     .map(|x| x.to_expanded_string(\", \", config))\n 1129 |                     .collect::<Vec<_>>()\n 1130 |                     .join(separator)\n 1131 |             ),\n 1132 |             Value::Record { val, .. } => format!(\n 1133 |                 \"{{{}}}\",\n 1134 |                 val.iter()\n 1135 |                     .map(|(x, y)| format!(\"{}: {}\", x, y.to_expanded_string(\", \", config)))\n 1136 |                     .collect::<Vec<_>>()\n 1137 |                     .join(separator)\n 1138 |             ),","lines":14,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-protocol/src/value/mod.rs#L1125-L1138"}]},
{"id":"PERF_20","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"In `rotate.rs`, `new_column_names` is built by pushing into `res` and then calling `res.to_vec()` (line 208), which clones the vector unnecessarily. `res` is already a `Vec<String>` and can be used directly.","fix":"Remove the `.to_vec()` call and use `res` directly as `new_column_names`.","locations":[{"ref":"crates/nu-cmd-extra/src/extra/filters/rotate.rs:203-209","code":"  203 |     let mut new_column_names = {\n  204 |         let mut res = vec![];\n  205 |         for idx in 0..(total_rows + 1) {\n  206 |             res.push(format!(\"column{idx}\"));\n  207 |         }\n  208 |         res.to_vec()\n  209 |     };","lines":7,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cmd-extra/src/extra/filters/rotate.rs#L203-L209"}]},
{"id":"PERF_21","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"In `rotate.rs`, `res.to_vec()` is also called inside the inner `new_vals` block (line 266) to clone a `Vec` that was just built and is immediately assigned. This extra clone is unnecessary.","fix":"Replace `res.to_vec()` with `res` to avoid the redundant clone.","locations":[{"ref":"crates/nu-cmd-extra/src/extra/filters/rotate.rs:256-267","code":"  256 |         let new_vals = {\n  257 |             // move through the array with a step, which is every new_values size / total rows, starting from our old column's index\n  258 |             // so if initial data was like this [[a b]; [1 2] [3 4]] - we basically iterate on this [3 4 1 2] array, so we pick 3, then 1, and then when idx increases, we pick 4 and 2\n  259 |             for i in (idx..new_values.len()).step_by(new_values.len() / total_rows) {\n  260 |                 res.push(new_values[i].clone());\n  261 |             }\n  262 |             // when rotating clockwise, the old column names become the last column's values\n  263 |             if !ccw {\n  264 |                 res.push(Value::string(val, call.head));\n  265 |             }\n  266 |             res.to_vec()\n  267 |         };","lines":12,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cmd-extra/src/extra/filters/rotate.rs#L256-L267"}]},
{"id":"PERF_22","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"In `error_make.rs` `labeled()`, `self.inner.clone()` is called on line 204 and then `self.clone().labels()` is called on line 211, cloning the entire `ErrorInfo` struct (including all its `Vec` fields) twice. The first clone is to iterate `inner` elements; the second clone is to call `labels()` which consumes `self`. The struct could instead be partially destructured to avoid the extra clone.","fix":"Destructure `self` at the top of `labeled` to extract `inner` and call `self.labels()` without cloning: `let labels = self.labels();` (which consumes `self`), then reconstruct or keep `inner` from the original fields before the call.","locations":[{"ref":"crates/nu-cmd-lang/src/core_commands/error_make.rs:201-211","code":"  201 |     pub fn labeled(self, span: Span, show_labels: bool) -> ShellError {\n  202 |         let inner: Vec<ShellError> = self\n  203 |             .inner\n  204 |             .clone()\n  205 |             .into_iter()\n  206 |             .map(|i| match ErrorInfo::from_value(i) {\n  207 |                 Ok(e) => e.labeled(span, show_labels),\n  208 |                 Err(err) => err,\n  209 |             })\n  210 |             .collect();\n  211 |         let labels = self.clone().labels();","lines":11,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cmd-lang/src/core_commands/error_make.rs#L201-L211"}]},
{"id":"PERF_23","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"In `let_.rs`, `rhs` is always cloned to produce `value_to_store` (lines 98-108), even in the common `let x = expr` path where the `rhs` value will never be returned to the pipeline (line 113 returns `PipelineData::Empty`). The clone is wasted in that branch.","fix":"After computing `value_to_store`, check `initial_value.is_some()` before consuming `rhs` for the pipeline return so that the `rhs` can be moved into `value_to_store` directly when `initial_value` is present.","locations":[{"ref":"crates/nu-cmd-lang/src/core_commands/let_.rs:98-117","code":"   98 |         let value_to_store = {\n   99 |             let variable = engine_state.get_var(var_id);\n  100 |             if variable.ty == Type::Glob {\n  101 |                 match &rhs {\n  102 |                     Value::String { val, .. } => Value::glob(val.clone(), false, rhs.span()),\n  103 |                     _ => rhs.clone(),\n  104 |                 }\n  105 |             } else {\n  106 |                 rhs.clone()\n  107 |             }\n  108 |         };\n  109 |         stack.add_var(var_id, value_to_store);\n  110 | \n  111 |         if initial_value.is_some() {\n  112 |             // `let var = expr`: suppress output (traditional assignment, no display)\n  113 |             Ok(PipelineData::Empty)\n  114 |         } else {\n  115 |             // `input | let var`: pass through the assigned value\n  116 |             Ok(PipelineData::Value(rhs, None))\n  117 |         }","lines":20,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cmd-lang/src/core_commands/let_.rs#L98-L117"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"A commented-out eprintln! debug statement has been left in color_string_to_nustyle. It serves no purpose in the committed code and should be removed.","fix":"Delete the commented line `// eprintln!(\"color_string: {}\", &color_string);`.","locations":[{"ref":"crates/nu-color-config/src/color_config.rs:77","code":"   77 |     // eprintln!(\"color_string: {}\", &color_string);","lines":1,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-color-config/src/color_config.rs#L77"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"nonexistent_column in column.rs is a public function that is never called anywhere in the codebase. It is not re-exported from nu-engine's lib.rs. The only occurrence of the string 'nonexistent_column' in the repo is an unrelated test function name in nu-command.","fix":"Remove the function, or if it is intended for future use, add #[allow(dead_code)] with a TODO comment explaining when it will be used.","locations":[{"ref":"crates/nu-engine/src/column.rs:23-36","code":"   23 | pub fn nonexistent_column<'a, I>(inputs: &[String], columns: I) -> Option<String>\n   24 | where\n   25 |     I: IntoIterator<Item = &'a String>,\n   26 | {\n   27 |     let set: HashSet<&String> = HashSet::from_iter(columns);\n   28 | \n   29 |     for input in inputs {\n   30 |         if set.contains(input) {\n   31 |             continue;\n   32 |         }\n   33 |         return Some(input.clone());\n   34 |     }\n   35 |     None\n   36 | }","lines":14,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-engine/src/column.rs#L23-L36"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`EvalIrBlockFn` and `get_eval_ir_block` in `eval_helpers.rs` are defined and exported but never used anywhere else in the codebase. They are identical in signature to `EvalBlockFn` / `get_eval_block` and constitute unused public API.","fix":"Remove the `EvalIrBlockFn` type alias and `get_eval_ir_block` function, or document a planned use. If the distinction between IR and non-IR evaluation is no longer needed, consolidate the three identical function-pointer type aliases (`EvalBlockFn`, `EvalIrBlockFn`, `EvalBlockWithEarlyReturnFn`) into one.","locations":[{"ref":"crates/nu-engine/src/eval_helpers.rs:17-18","code":"   17 | pub type EvalIrBlockFn =\n   18 |     fn(&EngineState, &mut Stack, &Block, PipelineData) -> Result<PipelineExecutionData, ShellError>;","lines":2,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-engine/src/eval_helpers.rs#L17-L18"},{"ref":"crates/nu-engine/src/eval_helpers.rs:47-53","code":"   47 | pub fn get_eval_ir_block(engine_state: &EngineState) -> EvalIrBlockFn {\n   48 |     if engine_state.is_debugging() {\n   49 |         eval_ir_block::<WithDebug>\n   50 |     } else {\n   51 |         eval_ir_block::<WithoutDebug>\n   52 |     }\n   53 | }","lines":7,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-engine/src/eval_helpers.rs#L47-L53"}]},
{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"In find_longest_decl_with_prefix(), cmd_start is always 0 and is used only as a slice-start for spans[cmd_start..], yet the function returns it as the first tuple element. All callers use it only as a slice index and always see it as 0. The variable and its position in the return tuple add noise without value.","fix":"Remove cmd_start from the return tuple and simplify callers.","locations":[{"ref":"crates/nu-parser/src/parse_calls.rs:1902-1904","code":" 1902 |     let mut pos = 0;\n 1903 |     let cmd_start = pos;\n 1904 |     let mut name_spans = vec![];","lines":3,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/parse_calls.rs#L1902-L1904"},{"ref":"crates/nu-parser/src/parse_calls.rs:1877","code":" 1877 |     (cmd_start, pos, name, maybe_decl_id)","lines":1,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/parse_calls.rs#L1877"}]},
{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"Lines 104-105 in `keybindings_listen.rs` contain two commented-out `stdout.queue(...)` calls.\nThese appear to be debug tracing lines left from development and serve no purpose in the codebase.","fix":"Remove the commented-out lines.","locations":[{"ref":"crates/nu-cli/src/commands/keybindings_listen.rs:111-112","code":"  111 |         // stdout.queue(crossterm::style::Print(format!(\"event: {:?}\", &event)))?;\n  112 |         // stdout.queue(crossterm::style::Print(\"\\r\\n\"))?;","lines":2,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cli/src/commands/keybindings_listen.rs#L111-L112"}]},
{"id":"DEAD_6","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"In `overlay/list.rs`, the inactive overlay entries and active overlay entries are chained as separate iterators (lines 48-74), but the inactive entries are collected from `engine_state.scope.overlays` with active ones filtered out. The `active_overlays` iterator is created upfront (line 44-46) as a separate binding and then chained (line 63), but then the initial `active_overlays` variable is not reused - the filter closure on lines 54-62 independently iterates `stack.active_overlays` for every overlay. This O(n*m) scan could be replaced by constructing a `HashSet` first.","fix":"Collect `stack.active_overlays` into a `HashSet<&String>` before the `filter_map` to reduce the inner loop from O(m) to O(1) per entry.","locations":[{"ref":"crates/nu-cmd-lang/src/core_commands/overlay/list.rs:43-74","code":"   43 |             .active_overlays\n   44 |             .iter()\n   45 |             .map(|overlay| (overlay.clone(), true));\n   46 | \n   47 |         // Get all overlay names from engine state\n   48 |         let output_rows: Vec<Value> = engine_state\n   49 |             .scope\n   50 |             .overlays\n   51 |             .iter()\n   52 |             .filter_map(|(name, _)| {\n   53 |                 let name = String::from_utf8_lossy(name).to_string();\n   54 |                 if stack\n   55 |                     .active_overlays\n   56 |                     .iter()\n   57 |                     .any(|active_name| active_name == &name)\n   58 |                 {\n   59 |                     None\n   60 |                 } else {\n   61 |                     Some((name, false))\n   62 |                 }\n   63 |             })\n   64 |             .chain(active_overlays)\n   65 |             .map(|(name, active)| {\n   66 |                 Value::record(\n   67 |                     record! {\n   68 |                         \"name\" => Value::string(name.to_owned(), call.head),\n   69 |                         \"active\" => Value::bool(active, call.head),\n   70 |                     },\n   71 |                     call.head,\n   72 |                 )\n   73 |             })\n   74 |             .collect();","lines":32,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cmd-lang/src/core_commands/overlay/list.rs#L43-L74"}]},
{"id":"DEAD_7","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"The standalone `find_in_dirs` wrapper function in parse_module.rs (lines 762-769) does nothing but forward to `crate::parse_source::find_in_dirs` with identical arguments and is only called once in the same file. It adds an indirection with no value.","fix":"Call `crate::parse_source::find_in_dirs(...)` directly at the call site and remove the wrapper.","locations":[{"ref":"crates/nu-parser/src/parse_module.rs:762-769","code":"  762 | fn find_in_dirs(\n  763 |     filename: &str,\n  764 |     working_set: &StateWorkingSet,\n  765 |     cwd: &str,\n  766 |     dirs_var_name: Option<&str>,\n  767 | ) -> Option<ParserPath> {\n  768 |     crate::parse_source::find_in_dirs(filename, working_set, cwd, dirs_var_name)\n  769 | }","lines":8,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/parse_module.rs#L762-L769"}]},
{"id":"DEAD_8","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"EngineState exposes four public debug printing methods (print_vars, print_decls, print_blocks, print_contents) that write directly to stdout via println!. These appear to be leftover debugging utilities from development and are not referenced from any other module. They risk producing unexpected stdout output if accidentally called in production.","fix":"Remove or gate behind #[cfg(debug_assertions)] / #[cfg(test)]. Alternatively, use the existing debug-derive on EngineState and remove the manual methods.","locations":[{"ref":"crates/nu-protocol/src/engine/engine_state.rs:699-703","code":"  699 |     pub fn print_vars(&self) {\n  700 |         for var in self.vars.iter().enumerate() {\n  701 |             println!(\"var{}: {:?}\", var.0, var.1);\n  702 |         }\n  703 |     }","lines":5,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-protocol/src/engine/engine_state.rs#L699-L703"},{"ref":"crates/nu-protocol/src/engine/engine_state.rs:705-709","code":"  705 |     pub fn print_decls(&self) {\n  706 |         for decl in self.decls.iter().enumerate() {\n  707 |             println!(\"decl{}: {:?}\", decl.0, decl.1.signature());\n  708 |         }\n  709 |     }","lines":5,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-protocol/src/engine/engine_state.rs#L705-L709"},{"ref":"crates/nu-protocol/src/engine/engine_state.rs:711-715","code":"  711 |     pub fn print_blocks(&self) {\n  712 |         for block in self.blocks.iter().enumerate() {\n  713 |             println!(\"block{}: {:?}\", block.0, block.1);\n  714 |         }\n  715 |     }","lines":5,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-protocol/src/engine/engine_state.rs#L711-L715"},{"ref":"crates/nu-protocol/src/engine/engine_state.rs:717-
