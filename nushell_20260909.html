<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`commandline edit --insert` calls `String::insert_str(cursor_pos, &str)` where `cursor_pos` is a\nraw byte offset that was set via reedline or `commandline set-cursor`.\n`insert_str` panics at runtime (with a byte-boundary assertion failure) if `cursor_pos` does not\nfall on a UTF-8 character boundary. A user who sets the cursor mid-codepoint (e.g. inside an emoji)\nand then calls `commandline edit --insert` will crash the shell REPL.","fix":"Guard with `repl.buffer.is_char_boundary(cursor_pos)` before calling `insert_str`, and return an appropriate `ShellError` if the invariant is violated.","locations":[{"ref":"crates/nu-cli/src/commands/commandline/edit.rs:62-64","code":"   62 |             let cursor_pos = repl.cursor_pos;\n   63 |             repl.buffer.insert_str(cursor_pos, &str);\n   64 |             repl.cursor_pos += str.len();","lines":3,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cli/src/commands/commandline/edit.rs#L62-L64"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`commandline get-cursor` panics with `.expect()` when `cursor_pos` is not on a grapheme boundary.\nThe cursor position is a byte offset (set by reedline or by `commandline edit --insert`).\nIf a multi-byte character sits at `cursor_pos` and the byte offset does not coincide with a\ngrapheme boundary, `position()` returns `None` and the `.expect()` panics the shell.\n`commandline edit --insert` advances `cursor_pos` by `str.len()` bytes, which can land in the\nmiddle of a grapheme if the inserted string itself contains multi-byte characters followed by\ncombining code points.","fix":"Replace the `.expect()` with a graceful error: return `ShellError::Generic` with a message describing the misaligned cursor, or clamp to the nearest grapheme boundary before searching.","locations":[{"ref":"crates/nu-cli/src/commands/commandline/get_cursor.rs:40-41","code":"   40 |             .position(|(i, _c)| i == repl.cursor_pos)\n   41 |             .expect(\"Cursor position isn't on a grapheme boundary\");","lines":2,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cli/src/commands/commandline/get_cursor.rs#L40-L41"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"In `rotate`, when a single empty-record row is passed (e.g. `{} | rotate`), `total_columns` is 0, `not_a_record` stays false (the record branch ran), and `total_rows` is decremented from 1 to 0. The loop then executes `step_by(new_values.len() / total_rows)` which is `step_by(0 / 0)` - a division-by-zero panic in both debug and release builds.","fix":"Guard against `total_rows == 0` before the `step_by` call (or before the whole `columns_iter` loop). If `total_rows == 0`, return early with an appropriate error, similar to the existing empty-list guard.","locations":[{"ref":"crates/nu-cmd-extra/src/extra/filters/rotate.rs:198-199","code":"  198 |     if total_columns == 0 {\n  199 |         total_rows -= 1;","lines":2,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cmd-extra/src/extra/filters/rotate.rs#L198-L199"},{"ref":"crates/nu-cmd-extra/src/extra/filters/rotate.rs:259","code":"  259 |             for i in (idx..new_values.len()).step_by(new_values.len() / total_rows) {","lines":1,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cmd-extra/src/extra/filters/rotate.rs#L259"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"Dead `todo!()` arm in `error make` run(). The outer match at line 127-131 coerces `value` to either `Value::String` or `Value::Record` (the `Ok(_)` arm always produces a `Value::string`), so `Value::Error` can never reach the inner match. The arm at line 157 (`(_, Value::Error { .. }) => *error`) is dead, and the wildcard `_ => todo!()` at line 158 is equally unreachable. However, if the surrounding logic ever changes so that a non-String/non-Record/non-Error value reaches the inner match, it will panic with `todo!()` rather than returning a proper `ShellError`.","fix":"Replace `_ => todo!()` with a proper ShellError variant (e.g. `ShellError::UnsupportedInput`) and remove or comment the dead `Value::Error` arm, or assert statically by removing those arms if the outer match truly guarantees the type.","locations":[{"ref":"crates/nu-cmd-lang/src/core_commands/error_make.rs:139-159","code":"  139 |         Err(match (inners, value) {\n  140 |             (inner, Value::String { val, .. }) => ErrorInfo {\n  141 |                 msg: val,\n  142 |                 inner,\n  143 |                 ..ErrorInfo::default()\n  144 |             }\n  145 |             .labeled(call.head, show_labels),\n  146 |             (\n  147 |                 inner,\n  148 |                 Value::Record {\n  149 |                     val, internal_span, ..\n  150 |                 },\n  151 |             ) => {\n  152 |                 let mut ei = ErrorInfo::from_value((*val).clone().into_value(internal_span))?;\n  153 |                 ei.inner = [ei.inner, inner].concat();\n  154 | \n  155 |                 ei.labeled(internal_span, show_labels)\n  156 |             }\n  157 |             (_, Value::Error { error, .. }) => *error,\n  158 |             _ => todo!(),\n  159 |         })","lines":21,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cmd-lang/src/core_commands/error_make.rs#L139-L159"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"Two `panic!` calls via `panic!(\"http response channel disconnected\")` inside `send_cancellable_request` and `send_cancellable_request_bytes`. `RecvTimeoutError::Disconnected` means the sender thread panicked or was dropped without sending. This is a reachable runtime panic: if the spawned HTTP thread panics (e.g., due to an internal ureq bug), the receiver loop will hit `Disconnected` and kill the nushell process instead of propagating a ShellError.","fix":"Replace `panic!(...)` with `return Err(ShellErrorOrRequestError::ShellError(ShellError::NushellFailed { msg: \"HTTP request thread disconnected unexpectedly\".into() }))` so the error surfaces cleanly.","locations":[{"ref":"crates/nu-command/src/network/http/client.rs:746","code":"  746 |             Err(RecvTimeoutError::Disconnected) => panic!(\"http response channel disconnected\"),","lines":1,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-command/src/network/http/client.rs#L746"},{"ref":"crates/nu-command/src/network/http/client.rs:799","code":"  799 |             Err(RecvTimeoutError::Disconnected) => panic!(\"http response channel disconnected\"),","lines":1,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-command/src/network/http/client.rs#L799"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`transform_response_using_content_type` calls `.expect(\"Failed to parse content type, and failed to default to text/plain\")` after three parse attempts, the last of which is the literal string `\"text/plain\"`. While `\"text/plain\"` is always a valid MIME type, making the expect theoretically unreachable, the pattern is fragile: any future refactor of the fallback chain that introduces a new literal could silently create a production panic. This is dead-reachable panic code in a hot HTTP response path.","fix":"Replace `.expect(...)` with `.unwrap_or_else(|_| mime::Mime::from_str(\"application/octet-stream\").expect(\"always valid\"))` or return a `ShellError` instead.","locations":[{"ref":"crates/nu-command/src/network/http/client.rs:994-999","code":"  994 |     let content_type = mime::Mime::from_str(content_type)\n  995 |         // there are invalid content types in the wild, so we try to recover\n  996 |         // Example: `Content-Type: \"text/plain\"; charset=\"utf8\"` (note the quotes)\n  997 |         .or_else(|_| mime::Mime::from_str(&content_type.replace('\"', \"\")))\n  998 |         .or_else(|_| mime::Mime::from_str(\"text/plain\"))\n  999 |         .expect(\"Failed to parse content type, and failed to default to text/plain\");","lines":6,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-command/src/network/http/client.rs#L994-L999"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"assert! in compile_pipeline panics when both out and err targets of a Separate redirection are Pipe. The assertion fires at compile time based on parser-produced AST. A parser bug or future extension that generates this combination would produce a panic rather than a graceful CompileError, crashing the compilation of user input.","fix":"Replace assert! with a check that returns Err(CompileError::InvalidRedirectMode { ... }) so the error is propagated gracefully.","locations":[{"ref":"crates/nu-engine/src/compile/mod.rs:182-192","code":"  182 |                 assert!(\n  183 |                     !matches!(\n  184 |                         (out, err),\n  185 |                         (\n  186 |                             RedirectionTarget::Pipe { .. },\n  187 |                             RedirectionTarget::Pipe { .. }\n  188 |                         )\n  189 |                     ),\n  190 |                     \"for Separate redirection, out and err targets must not both be Pipe\"\n  191 |                 );\n  192 |                 let out = redirection_target_to_mode(working_set, builder, out)?;","lines":11,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-engine/src/compile/mod.rs#L182-L192"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"Three `.expect()` calls in `CallEval::add_positional` and `finalize_arguments` will panic if a custom command parameter is missing its `var_id`. The message at line 260 also contains a typo (\"lackes\" instead of \"lacks\"). Although these are intended as compile-time invariants, user-supplied code paths that reach these (e.g., via a broken plugin or eval edge case) will crash the shell process.","fix":"Return a ShellError (e.g., ShellError::NushellFailedSpanned) instead of panicking. Fix the typo at line 260: \"lackes\" -> \"lacks\".","locations":[{"ref":"crates/nu-engine/src/eval.rs:109","code":"  109 |                 .expect(\"internal error: all custom parameters must have var_ids\");","lines":1,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-engine/src/eval.rs#L109"},{"ref":"crates/nu-engine/src/eval.rs:109","code":"  109 |                 .expect(\"internal error: all custom parameters must have var_ids\");","lines":1,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-engine/src/eval.rs#L109"},{"ref":"crates/nu-engine/src/eval.rs:196","code":"  196 |                 .expect(\"internal error: all custom parameters must have var_ids\");","lines":1,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-engine/src/eval.rs#L196"},{"ref":"crates/nu-engine/src/eval.rs:312","code":"  312 |                     .expect(\"Internal error: rest positional parameter lackes var_id\"),","lines":1,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-engine/src/eval.rs#L312"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"parse_oneof() calls best_guess.expect() on a value that could be None when possible_shapes is non-empty but every shape produces zero first-error-offset advance and propagate_error is false. The comment says 'should not be None here', but the condition at line 728 only checks offset or propagate_error, both of which can be false/zero while best_guess is Some - so the only real panic risk is an empty possible_shapes list, which the callers do not guard.","fix":"Replace .expect() with a match or if let, returning an appropriate garbage Expression when best_guess is unexpectedly None.","locations":[{"ref":"crates/nu-parser/src/parse_calls.rs:770-772","code":"  770 |     if max_first_error_offset > spans[starting_spans_idx].start || propagate_error {\n  771 |         working_set.parse_errors.extend(best_guess_errors);\n  772 |         best_guess.expect(\"best_guess should not be None here!\")","lines":3,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/parse_calls.rs#L770-L772"}]},
{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"parse_attribute() calls .expect() on the first span check, panicking on user-provided input if the attribute lacks a leading '@'. The condition is enforced by an assertion two lines later as well.","fix":"Replace the chained .filter().expect() with a proper error path: if the first span does not start with '@', call working_set.error() and return a garbage result instead of panicking.","locations":[{"ref":"crates/nu-parser/src/parse_calls.rs:2020-2024","code":" 2020 |     let _ = lite_command\n 2021 |         .parts\n 2022 |         .first()\n 2023 |         .filter(|s| working_set.get_span_contents(**s).starts_with(b\"@\"))\n 2024 |         .expect(\"Attributes always start with an `@`\");","lines":5,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/parse_calls.rs#L2020-L2024"}]},
{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"parse_attribute() additionally calls assert!() immediately after the .expect(), meaning two different panic paths exist for the same invalid input scenario.","fix":"Replace the assert! with a proper error + early return using working_set.error().","locations":[{"ref":"crates/nu-parser/src/parse_calls.rs:2026-2029","code":" 2026 |     assert!(\n 2027 |         lite_command.attribute_idx.is_empty(),\n 2028 |         \"attributes can't have attributes\"\n 2029 |     );","lines":4,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/parse_calls.rs#L2026-L2029"}]},
{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"parse_match_block_expression enters a scope at the start of each loop iteration (working_set.enter_scope()) but two early-return paths at lines 574 and 583 call `return garbage(working_set, span)` without first calling working_set.exit_scope(). This leaks a scope on every malformed match guard expression, causing incorrect variable resolution for subsequent parsing in the same block.","fix":"Call working_set.exit_scope() before each `return garbage(...)` inside the while loop body (lines 574 and 583). Consider a guard/RAII wrapper or a defer-like pattern to ensure exit_scope is called on all paths.","locations":[{"ref":"crates/nu-parser/src/parse_expressions.rs:494-593","code":"  494 |         working_set.enter_scope();\n  495 | \n  496 |         // First parse the pattern\n  497 |         let mut pattern = parse_pattern(working_set, output[position].span);\n  498 | \n  499 |         position += 1;\n  500 | \n  501 |         if position >= output.len() {\n  502 |             working_set.error(ParseError::Mismatch(\n  503 |                 \"=>\".into(),\n  504 |                 \"end of input\".into(),\n  505 |                 Span::new(output[position - 1].span.end, output[position - 1].span.end),\n  506 |             ));\n  507 | \n  508 |             working_set.exit_scope();\n  509 |             break;\n  510 |         }\n  511 | \n  512 |         let mut connector = working_set.get_span_contents(output[position].span);\n  513 | \n  514 |         // Multiple patterns connected by '|'\n  515 |         if connector == b\"|\" && position < output.len() {\n  516 |             let mut or_pattern = vec![pattern];\n  517 | \n  518 |             while connector == b\"|\" && position < output.len() {\n  519 |                 connector = b\"\";\n  520 | \n  521 |                 position += 1;\n  522 | \n  523 |                 if position >= output.len() {\n  524 | {"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"After advancing `position` past a match guard expression at line 599 (`position += if found { start + 1 } else { start }`), the code immediately accesses `output[position].span` at line 601 without checking that `position < output.len()`. If the guard expression consumed all remaining tokens, this causes an index-out-of-bounds panic on user-supplied input.","fix":"Add a bounds check: `if position >= output.len() { /* emit error, exit_scope, break */ }` between lines 599 and 601, mirroring the pattern already used on lines 614-623.","locations":[{"ref":"crates/nu-parser/src/parse_expressions.rs:609-611","code":"  609 |             pattern.guard = Some(Box::new(guard));\n  610 |             position += if found { start + 1 } else { start };\n  611 |             connector = working_set.get_span_contents(output[position].span);","lines":3,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/parse_expressions.rs#L609-L611"}]},
{"id":"PANIC_14","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"translate_overlay_ids() and its callers (last_overlay_name, last_overlay, get_overlay_name, get_overlay) all call .expect() on index lookups with no recovery path. translate_overlay_ids additionally calls .expect() twice in a chained .get().expect() pattern. Any mismatch between active_overlays IDs and the actual overlays Vec causes a panic in user-facing code paths like shell initialization and overlay management.","fix":"Return Option or Result from these methods instead of panicking. get_overlay / get_overlay_name are called from active_overlays() which is hot-path; consider a debug_assert + safe fallback instead of expect.","locations":[{"ref":"crates/nu-protocol/src/engine/engine_state.rs:527-541","code":"  527 |     fn translate_overlay_ids(&self, other: &ScopeFrame) -> Vec<OverlayId> {\n  528 |         let other_names = other.active_overlays.iter().map(|other_id| {\n  529 |             &other\n  530 |                 .overlays\n  531 |                 .get(other_id.get())\n  532 |                 .expect(\"internal error: missing overlay\")\n  533 |                 .0\n  534 |         });\n  535 | \n  536 |         other_names\n  537 |             .map(|other_name| {\n  538 |                 self.find_overlay(other_name)\n  539 |                     .expect(\"internal error: missing overlay\")\n  540 |             })\n  541 |             .collect()","lines":15,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-protocol/src/engine/engine_state.rs#L527-L541"},{"ref":"crates/nu-protocol/src/engine/engine_state.rs:544-548","code":"  544 |     pub fn last_overlay_name(&self, removed_overlays: &[Vec<u8>]) -> &[u8] {\n  545 |         self.active_overlay_names(removed_overlays)\n  546 |             .last()\n  547 |             .expect(\"internal error: no active overlays\")\n  548 |     }","lines":5,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-protocol/src/engine/engine_state.rs#L544-L548"},{"ref":"crates/nu-protocol/src/engine/engine_state.rs:550-555","code":"  550 |     pub fn last_overlay(&self, removed_overlays: &[Vec<u8>]) -> &OverlayFrame {\n  551 |         self.active_overlay_ids(removed_overlays)\n  552 |             .last()\n  553 |             .map(|id| self.get_overlay(*id))\n  554 |             .expect(\"internal error: no active overlays\")\n  555 |     }","lines":6,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-protocol/src/engine/engine_state.rs#L550-L555"},{"ref":"crates/nu-protocol/src/engine/engine_state.rs:557-564","code":"  557 |     pub fn get_overlay_name(&self, overlay_id: OverlayId) -> &[u8] {\n  558 |         &self\n  559 |             .scope\n  560 |             .overlays\n  561 |             .get(overlay_id.get())\n  562 |             .expect(\"internal error: missing overlay\")\n  563 |             .0\n  564 |     }","lines":8,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-protocol/src/engine/engine_state.rs#L557-L564"},{"ref":"crates/nu-protocol/src/engine/engine_state.rs:566-573","code":"  566 |     pub fn get_overlay(&self, overlay_id: OverlayId) -> &OverlayFrame {\n  567 |         &self\n  568 |             .scope\n  569 |             .overlays\n  570 |             .get(overlay_id.get())\n  571 |             .expect(\"internal error: missing overlay\")\n  572 |             .1\n  573 |     }","lines":8,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-protocol/src/engine/engine_state.rs#L566-L573"}]},
{"id":"PANIC_15","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"get_signature() directly indexes self.blocks with [] (line 894: self.blocks[block_id.get()]) instead of using .get().expect() or returning Option. This is inconsistent with get_block() which uses .get().expect() with a descriptive message, and panics without any context if block_id is out of range (possible when called from plugins with stale data).","fix":"Replace self.blocks[block_id.get()] with self.blocks.get(block_id.get()).expect(\"internal error: missing block in get_signature\") or delegate to self.get_block(block_id).","locations":[{"ref":"crates/nu-protocol/src/engine/engine_state.rs:979-985","code":"  979 |     pub fn get_signature(&self, decl: &dyn Command) -> Signature {\n  980 |         if let Some(block_id) = decl.block_id() {\n  981 |             *self.blocks[block_id.get()].signature.clone()\n  982 |         } else {\n  983 |             decl.signature()\n  984 |         }\n  985 |     }","lines":7,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-protocol/src/engine/engine_state.rs#L979-L985"}]},
{"id":"PANIC_16","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`AttributableCompletion::fetch` calls `.expect(\"internal error, builtin declaration not found\")` for\neach of \"def\", \"extern\", \"export def\", \"export extern\". Although these are built-in commands and\nshould always exist, any future refactoring that renames or removes one would silently turn completion\ninto a crash. The panic propagates through the REPL event loop.","fix":"Use `find_decl(...)?` with an early `continue` or return `vec![]` on `None`, and log an error instead of panicking.","locations":[{"ref":"crates/nu-cli/src/completions/attribute_completions.rs:47","code":"   47 |                 .expect(\"internal error, builtin declaration not found\");","lines":1,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cli/src/completions/attribute_completions.rs#L47"}]},
{"id":"PANIC_17","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"shells[current_shell] in do_auto_cd performs an unchecked index into the shells vector. The index is taken from the NUSHELL_CURRENT_SHELL environment variable, which is user-controlled. If the variable holds a value larger than shells.len()-1 (e.g. after the user manually sets `$env.NUSHELL_CURRENT_SHELL = 99`) the code panics with an index-out-of-bounds. Additionally, if the i64 value is negative, `as usize` wraps to a huge index, also causing a panic.","fix":"Clamp or bounds-check current_shell before indexing: `if current_shell < shells.len() { shells[current_shell] = ...; } else { /* error or push */ }`.","locations":[{"ref":"crates/nu-cli/src/repl.rs:1054-1068","code":" 1054 |     let current_shell = stack.get_env_var(engine_state, \"NUSHELL_CURRENT_SHELL\");\n 1055 |     let current_shell = if let Some(v) = current_shell {\n 1056 |         v.as_int().unwrap_or_default() as usize\n 1057 |     } else {\n 1058 |         0\n 1059 |     };\n 1060 | \n 1061 |     let last_shell = stack.get_env_var(engine_state, \"NUSHELL_LAST_SHELL\");\n 1062 |     let last_shell = if let Some(v) = last_shell {\n 1063 |         v.as_int().unwrap_or_default() as usize\n 1064 |     } else {\n 1065 |         0\n 1066 |     };\n 1067 | \n 1068 |     shells[current_shell] = Value::string(path, span);","lines":15,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cli/src/repl.rs#L1054-L1068"}]},
{"id":"PANIC_18","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"In `to_html`'s `to_html` function, `color_hm.get(\"background\").expect(...)` and `color_hm.get(\"foreground\").expect(...)` are called (lines 238-253). The map is built by `convert_html_theme_to_hash_map`, which always inserts both keys, so this should never trigger. However these are still unconditional panics rather than proper error propagation.","fix":"Use `ok_or_else` to convert the missing-key case into a `ShellError` and propagate it, removing the `.expect` calls.","locations":[{"ref":"crates/nu-cmd-extra/src/extra/formats/to/html/mod.rs:236-255","code":"  236 |             color_hm\n  237 |                 .get(\"background\")\n  238 |                 .expect(\"Error getting background color\"),\n  239 |             color_hm\n  240 |                 .get(\"foreground\")\n  241 |                 .expect(\"Error getting foreground color\")\n  242 |         )\n  243 |         .ok();\n  244 |     } else {\n  245 |         write!(\n  246 |             &mut output_string,\n  247 |             \"<div style=\\\"background-color:{};color:{};\\\">\",\n  248 |             color_hm\n  249 |                 .get(\"background\")\n  250 |                 .expect(\"Error getting background color\"),\n  251 |             color_hm\n  252 |                 .get(\"foreground\")\n  253 |                 .expect(\"Error getting foreground color\")\n  254 |         )\n  255 |         .ok();","lines":20,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cmd-extra/src/extra/formats/to/html/mod.rs#L236-L255"}]},

{"id":"PANIC_20","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"In `to_html`'s `run_regexes`, every call to `Regex::new(...)` uses `.expect(\"problem with color regex\")`. The regexes are statically defined strings, so compilation rarely fails, but `.expect` is still a panic path. Similarly, `hash.get(&n).expect(...)` panics if the hash is iterated out of sequence (which cannot happen with the current code structure, but the invariant is implicit).","fix":"Compile regexes once at startup (e.g. via `once_cell::sync::Lazy`) and return a `ShellError` if compilation fails, instead of panicking.","locations":[{"ref":"crates/nu-cmd-extra/src/extra/formats/to/html/mod.rs:628-630","code":"  628 |         let re = Regex::new(value.0).expect(\"problem with color regex\");\n  629 |         let after = re.replace_all(&working_string, &value.1[..]).to_string();\n  630 |         working_string = after;","lines":3,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cmd-extra/src/extra/formats/to/html/mod.rs#L628-L630"}]},
{"id":"PANIC_21","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"In `eval_pipeline_without_terminal_expression`, `n_expressions` is computed as `block.pipelines[0].elements.len()` and then used as `n_expressions - 1` in a `truncate()` call on line 83. If a single-pipeline block somehow has zero elements (e.g. a pipeline consisting only of whitespace), `n_expressions - 1` underflows (`0usize - 1`) and panics in debug builds. In release builds the wrap-around produces `usize::MAX`, making `truncate(usize::MAX)` a no-op, but the logic is still wrong and the condition on line 93 would never trigger. The code relies on the parser always producing at least one element for a single pipeline, which is not explicitly guarded.","fix":"Guard with `if n_expressions == 0 { return Some(Value::nothing(Span::test_data())); }` before computing `n_expressions - 1`, or use `.saturating_sub(1)`.","locations":[{"ref":"crates/nu-cmd-lang/src/example_support.rs:79-83","code":"   79 |         let n_expressions = block.pipelines[0].elements.len();\n   80 |         // Modify the block to remove the last element and recompile it\n   81 |         {\n   82 |             let mut_block = Arc::make_mut(&mut block);\n   83 |             mut_block.pipelines[0].elements.truncate(n_expressions - 1);","lines":5,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cmd-lang/src/example_support.rs#L79-L83"}]},
{"id":"PANIC_22","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`ls_for_one_pattern` acquires a `Mutex` on `hidden_dirs` with `.expect(\"Unable to acquire lock for hidden_dirs\")` inside a `rayon::spawn` closure. If any rayon thread panics while holding the lock, the mutex becomes poisoned and every subsequent `.lock()` call in a parallel thread panics, cascading into a process crash.","fix":"Use `.lock().unwrap_or_else(|e| e.into_inner())` to recover from a poisoned mutex, or handle the `PoisonError` and return a `ShellError`.","locations":[{"ref":"crates/nu-command/src/filesystem/ls.rs:496-498","code":"  496 |                         let mut hidden_dir_mutex = hidden_dir_clone\n  497 |                             .lock()\n  498 |                             .expect(\"Unable to acquire lock for hidden_dirs\");","lines":3,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-command/src/filesystem/ls.rs#L496-L498"}]},
{"id":"PANIC_23","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`lookup_error_to_shell_error` calls `unimplemented!()` for `LookupErrorKind::Memory`. The comment says \"We don't handle out of memory gracefully anywhere else.\" However `LookupErrorKind::Memory` is a real value that the `dns_lookup` crate can return, and hitting this arm in production panics nushell rather than returning a DNS error.","fix":"Replace `unimplemented!()` with `generic_error(\"Out of memory during DNS lookup\")` or a `ShellError::OutOfMemory` variant.","locations":[{"ref":"crates/nu-command/src/network/http/client.rs:972","code":"  972 |         LookupErrorKind::Memory => unimplemented!(), // We don't handle out of memory gracefully anywhere else.","lines":1,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-command/src/network/http/client.rs#L972"}]},
{"id":"PANIC_24","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"BlockBuilder::set_last_ast and add_comment both call .expect(\"no last instruction\") on the last element of self.ast / self.comments. If either is called when the instruction vec is empty (e.g. immediately after builder construction, before any push), this panics. This is a logic-error trap rather than a user-triggered path, but it is not enforced by the type system.","fix":"Return Result<(), CompileError> and emit CompileError::Unexpected or similar instead of panicking.","locations":[{"ref":"crates/nu-engine/src/compile/builder.rs:330-339","code":"  330 |         *self.ast.last_mut().expect(\"no last instruction\") = ast_ref;\n  331 |     }\n  332 | \n  333 |     /// Add a comment to the last instruction.\n  334 |     pub(crate) fn add_comment(&mut self, comment: impl std::fmt::Display) {\n  335 |         add_comment(\n  336 |             self.comments.last_mut().expect(\"no last instruction\"),\n  337 |             comment,\n  338 |         )\n  339 |     }","lines":10,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-engine/src/compile/builder.rs#L330-L339"}]},
{"id":"PANIC_25","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"In `known_external_option_name` (known_external.rs), two `.expect()` calls will panic if flag name or short-name bytes are not valid UTF-8. Because these bytes come from the IR data slice (compiled from source), invalid UTF-8 can originate from a crafted or corrupted IR stream.","fix":"Replace `.expect()` with proper error propagation: return a `Result<String, ShellError>` and use `std::str::from_utf8(...).map_err(|_| ShellError::...)`.","locations":[{"ref":"crates/nu-parser/src/known_external.rs:244","code":"  244 |             std::str::from_utf8(&data[name]).expect(\"invalid utf-8 in flag name\")","lines":1,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/known_external.rs#L244"},{"ref":"crates/nu-parser/src/known_external.rs:249","code":"  249 |             std::str::from_utf8(&data[short]).expect(\"invalid utf-8 in flag short name\")","lines":1,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/known_external.rs#L249"}]},
{"id":"PANIC_26","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"parse_for() calls next_array::<3>().expect() on the positional iterator after check_call returns Valid, but check_call only verifies argument counts against the signature; if the call was actually built with garbage positions due to earlier parse errors, the iterator may produce fewer than 3 items and panic.","fix":"Replace .expect() with a let-else that returns an appropriate error Expression, similar to the pattern used for name_expr.as_string() at line 526.","locations":[{"ref":"crates/nu-parser/src/parse_def.rs:225-228","code":"  225 |     let [var_decl, iteration_expr, block_expr] = call\n  226 |         .positional_iter()\n  227 |         .next_array()\n  228 |         .expect(\"for call already checked\");","lines":4,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/parse_def.rs#L225-L228"}]},
{"id":"PANIC_27","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"parse_attribute_block() calls .expect() on attributes.last(), which panics if attribute_commands() yields zero items. The function is always called through has_attributes() guards, but that invariant is not enforced at the call site of parse_attribute_block itself.","fix":"Use if let Some(attr) = attributes.last() and return an appropriate error pipeline when the list is empty.","locations":[{"ref":"crates/nu-parser/src/parse_def.rs:289-293","code":"  289 |     let last_attr_span = attributes\n  290 |         .last()\n  291 |         .expect(\"Attribute block must contain at least one attribute\")\n  292 |         .expr\n  293 |         .span;","lines":5,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/parse_def.rs#L289-L293"}]},
{"id":"PANIC_28","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"check_record_key_or_value accesses `value_span[0]` at lines 1786 and 1793 without first checking that `value_span` is non-empty. A garbage expression with a zero-length span (e.g., from a prior parse error) would cause an out-of-bounds index panic.","fix":"Guard with `if value_span.is_empty() { return None; }` at the top of the function, or change the indexing to `value_span.first()` and match on `Some`.","locations":[{"ref":"crates/nu-parser/src/parse_expressions.rs:1847-1868","code":" 1847 |     let value_span = working_set.get_span_contents(expr.span);\n 1848 |     match expr.expr {\n 1849 |         Expr::String(_) => {\n 1850 |             if ![b'\"', b'\\'', b'`'].contains(&value_span[0]) {\n 1851 |                 bareword_error(expr)\n 1852 |             } else {\n 1853 |                 None\n 1854 |             }\n 1855 |         }\n 1856 |         Expr::StringInterpolation(ref expressions) => {\n 1857 |             if value_span[0] != b'$' {\n 1858 |                 expressions\n 1859 |                     .iter()\n 1860 |                     .filter(|expr| matches!(expr.expr, Expr::String(_)))\n 1861 |                     .filter_map(bareword_error)\n 1862 |                     .next()\n 1863 |             } else {\n 1864 |                 None\n 1865 |             }\n 1866 |         }\n 1867 |         _ => None,\n 1868 |     }","lines":22,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/parse_expressions.rs#L1847-L1868"}]},
{"id":"PANIC_29","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"check_string_no_trailing_tokens (parse_literals.rs line 1889) calls `.expect(\"string begins with quote\")` on the result of `bytes.iter().rposition(|ch| *ch == quote)`. If `bytes` does not contain `quote` at all, this panics. The function's contract is stated only as a comment and is not enforced. If a caller ever passes bytes that were already stripped of the quote character, this panics on user-controlled input paths.","fix":"Replace the `.expect()` with an `.ok_or(...)` and propagate a ParseError, or assert that callers always pass bytes that contain the quote character before calling this function.","locations":[{"ref":"crates/nu-parser/src/parse_literals.rs:1891-1894","code":" 1891 |     let pos = bytes\n 1892 |         .iter()\n 1893 |         .rposition(|ch| *ch == quote)\n 1894 |         .expect(\"string begins with quote\");","lines":4,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/parse_literals.rs#L1891-L1894"}]},
{"id":"PANIC_30","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"warp_export_call indexes `spans[0..=1]` (a range of two elements) without verifying that spans has at least two elements. If the function is called with a single-element span slice (e.g., a bare `export` keyword with no sub-keyword), this causes an index-out-of-bounds panic.","fix":"Add a bounds check before the range index: if spans.len() < 2 { emit an error and return false; }.","locations":[{"ref":"crates/nu-parser/src/parse_module.rs:53","code":"   53 |             def_call.head = Span::concat(&spans[0..=1]);","lines":1,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/parse_module.rs#L53"}]},
{"id":"PANIC_31","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"In parse_module_block, the catch-all `_` branch accesses `command.parts[0]` unconditionally. A LiteCommand can have an empty `parts` vec (LitePipeline::push admits commands with empty parts when a redirection is present). Accessing index 0 on an empty vec panics.","fix":"Use `command.parts.first().copied().unwrap_or(Span::unknown())` instead of `command.parts[0]`.","locations":[{"ref":"crates/nu-parser/src/parse_module.rs:649","code":"  649 |                         command.parts[0],","lines":1,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/parse_module.rs#L649"}]},
{"id":"PANIC_32","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"parse_var_with_opt_type indexes tokens[0] without checking whether tokens is empty. After calling lex_signature on the concatenated remaining spans, if those spans represent only whitespace or separators the lexer may produce zero tokens, making tokens[0].span a panic.","fix":"Guard with `if let Some(first_token) = tokens.first() { ... } else { emit MissingType error; return garbage; }`.","locations":[{"ref":"crates/nu-parser/src/parse_signatures.rs:199-206","code":"  199 |             let (tokens, parse_error) =\n  200 |                 lex_signature(&type_bytes, full_span.start, &[], &[b','], true);\n  201 | \n  202 |             if let Some(parse_error) = parse_error {\n  203 |                 working_set.error(parse_error);\n  204 |             }\n  205 | \n  206 |             let ty = parse_type(working_set, &type_bytes, tokens[0].span);","lines":8,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/parse_signatures.rs#L199-L206"}]},
{"id":"PANIC_33","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"add_env_var() in Stack explicitly panics when active_overlays is empty (line 294: panic!(\"internal error: no active overlay\")). The comment above says 'TODO: Remove panic'. A user can reach this by calling remove_overlay on all overlays (including the default) before setting an env var, turning an invariant-violation into an uncaught panic instead of a ShellError.","fix":"Return Result<(), ShellError> and propagate a ShellError::NushellFailed or similar instead of panicking. This matches the existing last_overlay_name() pattern on line 321-328 which returns Result.","locations":[{"ref":"crates/nu-protocol/src/engine/stack.rs:641-664","code":"  641 |     pub fn add_env_var(&mut self, var: String, value: Value) {\n  642 |         if let Some(last_overlay) = self.active_overlays.last().cloned() {\n  643 |             let env_name = EnvName::from(var);\n  644 |             self.clear_env_var_marks_in_active_overlay(&last_overlay, &env_name);\n  645 | \n  646 |             if let Some(scope) = self.env_vars.last_mut() {\n  647 |                 let scope = Arc::make_mut(scope);\n  648 |                 if let Some(env_vars) = scope.get_mut(&last_overlay) {\n  649 |                     env_vars.insert(env_name, value);\n  650 |                 } else {\n  651 |                     scope.insert(last_overlay, [(env_name, value)].into_iter().collect());\n  652 |                 }\n  653 |             } else {\n  654 |                 self.env_vars.push(Arc::new(\n  655 |                     [(last_overlay, [(env_name, value)].into_iter().collect())]\n  656 |                         .into_iter()\n  657 |                         .collect(),\n  658 |                 ));\n  659 |             }\n  660 |         } else {\n  661 |             // TODO: Remove panic\n  662 |             panic!(\"internal error: no active overlay\");\n  663 |         }\n  664 |     }","lines":24,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-protocol/src/engine/stack.rs#L641-L664"}]},
{"id":"PANIC_34","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"Chunks::next_string() contains a .expect() call in production code (line 1032) when re-parsing bytes already verified to be valid UTF-8. While the logic is correct, any future refactor of the truncation could cause it to silently panic at runtime instead of returning an error.","fix":"Replace .expect() with a ShellError::NonUtf8Custom return, mapping from_utf8 to an Err path, to maintain consistent error handling throughout the iterator.","locations":[{"ref":"crates/nu-protocol/src/pipeline/byte_stream.rs:1031-1036","code":" 1031 |                 let mut buf = err.into_bytes();\n 1032 |                 buf.truncate(valid_up_to);\n 1033 |                 buf.shrink_to_fit();\n 1034 |                 let string = String::from_utf8(buf)\n 1035 |                     .expect(\"failed to parse utf-8 even after correcting error\");\n 1036 |                 self.pos += string.len() as u64;","lines":6,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-protocol/src/pipeline/byte_stream.rs#L1031-L1036"}]},
{"id":"PANIC_35","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"file_path.file_name().expect(\"internal error: missing filename\") in eval_file.rs panics when an absolute path ends with '..'. This is theoretically reachable by running `nu /some/path/..` on a system where path normalization does not canonicalize the '..' segment before file_name() is called, because absolute_with may leave trailing '..' in the result.","fix":"Return a proper ShellError (e.g. InvalidPath) instead of using .expect().","locations":[{"ref":"crates/nu-cli/src/eval_file.rs:89-91","code":"   89 |     let source_filename = file_path\n   90 |         .file_name()\n   91 |         .expect(\"internal error: missing filename\");","lines":3,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cli/src/eval_file.rs#L89-L91"}]},
{"id":"PANIC_36","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"Multiple calls to engine_state.repl_state.lock().expect(\"repl state mutex\") throughout the REPL loop will panic if the mutex is poisoned (i.e., a previous holder panicked while holding it). The outer catch_unwind in evaluate_repl recovers from panics within loop_iteration, but a poisoned mutex from within run_command (which is NOT wrapped in catch_unwind) would propagate uncaught and crash the REPL process.","fix":"Use `.lock().unwrap_or_else(|e| e.into_inner())` to recover from a poisoned mutex, or propagate the error gracefully instead of panicking.","locations":[{"ref":"crates/nu-cli/src/repl.rs:409","code":"  409 |     let mut repl = engine_state.repl_state.lock().expect(\"repl state mutex\");","lines":1,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cli/src/repl.rs#L409"},{"ref":"crates/nu-cli/src/repl.rs:409","code":"  409 |     let mut repl = engine_state.repl_state.lock().expect(\"repl state mutex\");","lines":1,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cli/src/repl.rs#L409"},{"ref":"crates/nu-cli/src/repl.rs:577","code":"  577 |     let mut repl = engine_state.repl_state.lock().expect(\"repl state mutex\");","lines":1,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cli/src/repl.rs#L577"},{"ref":"crates/nu-cli/src/repl.rs:1289","code":" 1289 |     let mut repl = engine_state.repl_state.lock().expect(\"repl state mutex\");","lines":1,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cli/src/repl.rs#L1289"}]},
{"id":"PANIC_37","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`todo!()` on line 158 of `error_make.rs` is in a match arm `(_, _)` that is statically unreachable: the `value` binding is always either `Value::String` or `Value::Record` after the filtering on lines 127-131. The preceding `Value::Error` arm (line 157) is also dead code for the same reason. Using `todo!()` instead of `unreachable!()` produces a worse panic message and signals incomplete implementation rather than an internal invariant.","fix":"Remove the dead `Value::Error` arm (line 157) and replace `todo!()` with `unreachable!(\"value is always String or Record\")`.","locations":[{"ref":"crates/nu-cmd-lang/src/core_commands/error_make.rs:155-159","code":"  155 |                 ei.labeled(internal_span, show_labels)\n  156 |             }\n  157 |             (_, Value::Error { error, .. }) => *error,\n  158 |             _ => todo!(),\n  159 |         })","lines":5,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cmd-lang/src/core_commands/error_make.rs#L155-L159"}]},
{"id":"PANIC_38","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In `eval_block` (example support), the `unwrap_or_else` closure contains a hard-coded placeholder string `\"TODO\"` as the command name in the panic message: `panic!(\"test eval error in `{}`: {:?}\", \"TODO\", err)`. This produces useless diagnostic output when a test fails because it obscures which example failed.","fix":"Pass the block source string (or an excerpt) instead of `\"TODO\"`. The `block` is available at the call site (`eval_block(block, input, cwd, engine_state)`); or restructure to pass a label.","locations":[{"ref":"crates/nu-cmd-lang/src/example_support.rs:136-139","code":"  136 |         .unwrap_or_else(|err| {\n  137 |             report_shell_error(None, engine_state, &err);\n  138 |             panic!(\"test eval error in `{}`: {:?}\", \"TODO\", err)\n  139 |         })","lines":4,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cmd-lang/src/example_support.rs#L136-L139"}]},
{"id":"PANIC_39","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"compile_call uses .expect(\"expr() None in non-Named\") for Argument::Positional / Argument::Spread arms when arg_reg is None. While this should be impossible given that expr() only returns None for pure-flag Named arguments, a future refactor that adds a new Argument variant or changes expr() semantics could trigger this panic. There is no type-level guarantee that prevents the issue.","fix":"Return a CompileError::UnexpectedExpression or similar instead of panicking, matching the pattern used elsewhere in the compiler.","locations":[{"ref":"crates/nu-engine/src/compile/call.rs:279","code":"  279 |                     arg_reg.expect(\"expr() None in non-Named\"),","lines":1,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-engine/src/compile/call.rs#L279"},{"ref":"crates/nu-engine/src/compile/call.rs:279","code":"  279 |                     arg_reg.expect(\"expr() None in non-Named\"),","lines":1,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-engine/src/compile/call.rs#L279"}]},
{"id":"PANIC_40","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In `flatten_expression_into` (flatten.rs), the spread-operator span is computed as `Span::new(expr.span.start - 3, expr.span.start)` (lines 355 and 390). This is a bare `usize` subtraction. If `expr.span.start < 3` (e.g., in synthetic or test AST nodes with span starting near 0), this underflows and panics in debug mode or produces a garbage span in release mode.","fix":"Use `expr.span.start.saturating_sub(3)` and add a debug assertion that the result is less than `expr.span.start`, or compute the operator span from AST data that tracks the actual `...` position.","locations":[{"ref":"crates/nu-parser/src/flatten.rs:354-356","code":"  354 |                         output.push((\n  355 |                             Span::new(expr.span.start - 3, expr.span.start),\n  356 |                             FlatShape::Operator,","lines":3,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/flatten.rs#L354-L356"},{"ref":"crates/nu-parser/src/flatten.rs:389-391","code":"  389 |                         output.push((\n  390 |                             Span::new(expr.span.start - 3, expr.span.start),\n  391 |                             FlatShape::Operator,","lines":3,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/flatten.rs#L389-L391"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"In parse_assignment_expression, when the RHS of an assignment parses as an external call, the code accesses `head.span.start - 1` (line 1038) to peek at the character before the command name in order to detect a leading `^`. Because `head.span.start` is a `usize`, if it happens to be 0 the subtraction wraps to `usize::MAX`, producing an enormous span start that will likely panic in `get_span_contents` or return garbage data.","fix":"Guard the subtraction: `if head.span.start > 0 { let contents = working_set.get_span_contents(Span { start: head.span.start - 1, end: head.span.end }); ... }` else assume no caret.","locations":[{"ref":"crates/nu-parser/src/parse_expressions.rs:1097-1109","code":" 1097 |         let contents = working_set.get_span_contents(Span {\n 1098 |             start: head.span.start - 1,\n 1099 |             end: head.span.end,\n 1100 |         });\n 1101 |         if !contents.starts_with(b\"^\") {\n 1102 |             working_set.parse_errors.push(ParseError::LabeledErrorWithHelp {\n 1103 |                 error: \"External command calls must be explicit in assignments\".into(),\n 1104 |                 label: \"add a caret (^) before the command name if you intended to run and capture its output\".into(),\n 1105 |                 help: \"the parsing of assignments was changed in 0.97.0, and this would have previously been treated as a string. Alternatively, quote the string with single or double quotes to avoid it being interpreted as a command name. This restriction may be removed in a future release.\".into(),\n 1106 |                 span: head.span,\n 1107 |             });\n 1108 |         }\n 1109 |     }","lines":13,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/parse_expressions.rs#L1097-L1109"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"In menu_completions.rs, span start and end values received from a user-authored Nushell closure are read as i64 and cast directly to usize. A negative end value (e.g. -1) wraps to a huge usize on truncation and will corrupt the reedline span, causing reedline to read/replace far outside the buffer or panic. The existing `start.min(end)` only prevents start from exceeding end but does not guard against negative values.","fix":"Before casting, validate that both start and end are >= 0 and that end <= line.len() as i64; fall back to default_span if either check fails.","locations":[{"ref":"crates/nu-cli/src/menus/menu_completions.rs:117-125","code":"  117 |                     let start = span.get(\"start\").and_then(|val| val.as_int().ok());\n  118 |                     let end = span.get(\"end\").and_then(|val| val.as_int().ok());\n  119 |                     match (start, end) {\n  120 |                         (Some(start), Some(end)) => {\n  121 |                             let start = start.min(end);\n  122 |                             reedline::Span {\n  123 |                                 start: start as usize,\n  124 |                                 end: end as usize,\n  125 |                             }","lines":9,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cli/src/menus/menu_completions.rs#L117-L125"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"In add_ide_menu, cursor_offset is read as i64 via .as_int()? and then cast to i16 without checking range. Any value outside [-32768, 32767] silently truncates. A user who sets cursor_offset: 40000 in config gets a wrong (wrapped) offset with no error reported.","fix":"Use i16::try_from(cursor_offset).map_err(|_| ShellError::InvalidValue { ... })? instead of `as i16`.","locations":[{"ref":"crates/nu-cli/src/reedline_config.rs:419-422","code":"  419 |         ide_menu = match extract_value(\"cursor_offset\", val, span) {\n  420 |             Ok(cursor_offset) => {\n  421 |                 let cursor_offset = cursor_offset.as_int()?;\n  422 |                 ide_menu.with_cursor_offset(cursor_offset as i16)","lines":4,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cli/src/reedline_config.rs#L419-L422"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"parse_completer constructs `Span::new(span.start - 1, span.start)` to point at the `@` character preceding the completer span. `span.start` is a usize; if it equals 0 this subtraction underflows, panicking in debug builds and wrapping to usize::MAX in release builds.","fix":"Use `span.start.saturating_sub(1)` instead of `span.start - 1`.","locations":[{"ref":"crates/nu-parser/src/parse_shape_specs.rs:144","code":"  144 |             op_span: Span::new(span.start - 1, span.start),","lines":1,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/parse_shape_specs.rs#L144"}]},
{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`Duration * Float` and `Duration / Float` perform unchecked casts of the result to `i64`. At lines 3016-3021 (mul): `(*lhs as f64 * *rhs) as i64` - if the result exceeds `i64::MAX` or is below `i64::MIN`, the cast produces undefined behaviour in Rust (actually it saturates to `i64::MIN`/`i64::MAX` in release mode since Rust 1.45, but it's still semantically wrong). The `div` case at lines 3128-3143 has a bounds check, but `mul` at lines 3016-3021 does not.","fix":"Add overflow check: `let val = *lhs as f64 * *rhs; if i64::MIN as f64 <= val && val <= i64::MAX as f64 { Ok(Value::duration(val as i64, span)) } else { Err(overflow) }`","locations":[{"ref":"crates/nu-protocol/src/value/mod.rs:3043-3048","code":" 3043 |             (Value::Duration { val: lhs, .. }, Value::Float { val: rhs, .. }) => {\n 3044 |                 Ok(Value::duration((*lhs as f64 * *rhs) as i64, span))\n 3045 |             }\n 3046 |             (Value::Float { val: lhs, .. }, Value::Duration { val: rhs, .. }) => {\n 3047 |                 Ok(Value::duration((*lhs * *rhs as f64) as i64, span))\n 3048 |             }","lines":6,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-protocol/src/value/mod.rs#L3043-L3048"}]},
{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"In help_completions.rs, the reedline suggestion span is computed as `pos - line.len()`. Both are usize. If pos < line.len() (which reedline itself should prevent but does not guarantee for all internal code paths) this underflows and panics in debug builds or silently wraps to a huge value in release builds, corrupting the replacement span.","fix":"Use `pos.saturating_sub(line.len())` or add an explicit check before the subtraction.","locations":[{"ref":"crates/nu-cli/src/menus/help_completions.rs:120-123","code":"  120 |                     span: reedline::Span {\n  121 |                         start: pos - line.len(),\n  122 |                         end: pos,\n  123 |                     },","lines":4,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cli/src/menus/help_completions.rs#L120-L123"}]},
{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"negligible","difficulty":"easy","description":"In `version.rs`, `version.major`, `version.minor`, and `version.patch` are `u64` fields (from semver 1.x) cast to `i64` with `as i64`. Values >= 2^63 silently wrap to negative numbers in release builds. In practice, version components this large are impossible in the current nushell versioning scheme, but the cast is technically incorrect.","fix":"Use `i64::try_from(version.major).unwrap_or(i64::MAX)` or emit the value as a string for fields that are too large.","locations":[{"ref":"crates/nu-cmd-lang/src/core_commands/version.rs:159-161","code":"  159 |     record.push(\"major\", Value::int(version.major as i64, span));\n  160 |     record.push(\"minor\", Value::int(version.minor as i64, span));\n  161 |     record.push(\"patch\", Value::int(version.patch as i64, span));","lines":3,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cmd-lang/src/core_commands/version.rs#L159-L161"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"Missing early return after reporting 'path does not exist' error in do_auto_cd. After calling report_shell_error the function continues, converts the non-existent path to a string, calls have_permission on it, and eventually calls stack.set_cwd, which also fails. The user sees two or three error messages for a single bad auto-cd attempt, and OLDPWD is incorrectly set to the current directory before the second error is emitted.","fix":"Add `return;` immediately after the report_shell_error call inside the `if !path.exists()` block (before `path.to_string_lossy().to_string()`).","locations":[{"ref":"crates/nu-cli/src/repl.rs:1007-1021","code":" 1007 |     let path = {\n 1008 |         if !path.exists() {\n 1009 |             report_shell_error(\n 1010 |                 Some(stack),\n 1011 |                 engine_state,\n 1012 |                 &ShellError::Io(IoError::new_with_additional_context(\n 1013 |                     shell_error::io::ErrorKind::DirectoryNotFound,\n 1014 |                     span,\n 1015 |                     PathBuf::from(&path),\n 1016 |                     \"Cannot change directory\",\n 1017 |                 )),\n 1018 |             );\n 1019 |         }\n 1020 |         path.to_string_lossy().to_string()\n 1021 |     };","lines":15,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cli/src/repl.rs#L1007-L1021"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"color_to_string formats Rgb colors without zero-padding individual components (uses {:X} instead of {:02X}). A color like Color::Rgb(1, 2, 3) becomes \"#123\" (only 3 hex digits after #). color_from_hex rejects any string whose trimmed length != 6, so it returns Ok(None) for such values. Any color round-trip through NuStyle where any RGB component is < 16 silently drops the color. The existing test at line 1011 uses 0x11, 0x22, 0x33 (all >= 16) so it masks the bug.","fix":"Change `format!(\"#{r:X}{g:X}{b:X}\")` to `format!(\"#{r:02X}{g:02X}{b:02X}\")` to always produce 6 hex digits.","locations":[{"ref":"crates/nu-color-config/src/nu_style.rs:120","code":"  120 |         Color::Rgb(r, g, b) => format!(\"#{r:X}{g:X}{b:X}\"),","lines":1,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-color-config/src/nu_style.rs#L120"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`http_client_pool` contains a TOCTOU race: it acquires a read lock, observes `None`, drops the lock, builds a new `Agent` (slow - involves TLS setup), then acquires a write lock and stores it. Two concurrent callers can both observe `None` under the read lock, both build an `Agent`, and both write, with the second overwriting the first. Any existing connections from the first `Agent` are silently abandoned (connection pool leak). This is the classic double-checked locking bug.","fix":"After acquiring the write lock (line 169) re-check `guard.as_ref().is_some()` and return the existing client if another thread has already initialised it.","locations":[{"ref":"crates/nu-command/src/network/http/client.rs:132-176","code":"  132 | pub fn http_client_pool(\n  133 |     engine_state: &EngineState,\n  134 |     stack: &mut Stack,\n  135 | ) -> Result<Arc<Agent>, ShellError> {\n  136 |     {\n  137 |         let guard = GLOBAL_CLIENT.read().expect(\"the lock should be valid\");\n  138 |         if let Some(client) = guard.as_ref() {\n  139 |             return Ok(Arc::clone(client));\n  140 |         }\n  141 |     }\n  142 |     let mut config_builder = ureq::config::Config::builder()\n  143 |         .user_agent(\"nushell\")\n  144 |         .save_redirect_history(true)\n  145 |         .http_status_as_error(false)\n  146 |         .max_redirects_will_error(false);\n  147 |     if let Some(http_proxy) = retrieve_http_proxy_from_env(engine_state, stack)\n  148 |         && let Ok(proxy) = ureq::Proxy::new(&http_proxy)\n  149 |     {\n  150 |         config_builder = config_builder.proxy(Some(proxy));\n  151 |     };\n  152 | \n  153 |     // Apply TLS configuration with certificate verification enabled by default.\n  154 |     // This matches the behavior of http_client() to ensure pooled connections\n  155 |     // are secure. Users must explicitly use `http pool --insecure` to disable.\n  156 |     config_builder = config_builder.tls_config(tls_config(false)?);\n  157 | \n  158 |     // Like the DefaultConnector, we chain a SocksConnector, then a ConnextProxyConnector, then\n  159 |     // some tcp connector and finally some tls connector.\n  160 |     let connector = ().chain(SocksConnector::default()).chain(ConnectProxyConnector::default());\n  161 | \n  162 |     let on_connect = engine_state.signal_handlers.as_ref().map(make_on_connect);\n  163 |     let connector = connector.chain(InterruptibleTcpConnector::new(on_connect));\n  164 | \n  165 |     #[cfg(feature = \"rustls-tls\")]\n  166 |     let connector = connector.chain(RustlsConnector::default());\n  167 |     #[cfg(feature = \"native-tls\")]\n  168 |     let connector = connector.chain(NativeTlsConnector::default());\n  169 | \n  170 |     let resolver = DnsLookupResolver;\n  171 |     let agent = ureq::Agent::with_parts(config_builder.build(), connector, resolver);\n  172 | \n  173 |     let arc_agent = Arc::new(agent);\n  174 |     let mut guard = GLOBAL_CLIENT.write().expect(\"the lock should be valid\");\n  175 |     *guard = Some(Arc::clone(&arc_agent));\n  176 |     Ok(arc_agent)","lines":45,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-command/src/network/http/client.rs#L132-L176"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"In compile_assignment (operator.rs), when the environment variable being assigned is FILE_PWD or CURRENT_FILE, the AutomaticEnvVarSetManually error is always constructed with envvar_name: \"PWD\".into() regardless of which automatic variable actually triggered the error. The user will always see 'cannot set $env.PWD' even when they attempted to assign $env.FILE_PWD or $env.CURRENT_FILE.","fix":"Use the actual key name: envvar_name: key.into() (or key.to_string().into()) instead of the hardcoded \"PWD\".","locations":[{"ref":"crates/nu-engine/src/compile/operator.rs:251-256","code":"  251 |                 if AUTOMATIC_NAMES.iter().any(|name| key.eq_ignore_case(name)) {\n  252 |                     return Err(CompileError::AutomaticEnvVarSetManually {\n  253 |                         envvar_name: \"PWD\".into(),\n  254 |                         span: lhs.span,\n  255 |                     });\n  256 |                 }","lines":6,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-engine/src/compile/operator.rs#L251-L256"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`Value::ne` treats `Nothing != Nothing` as `true`. `ne` returns `!matches!(partial_cmp, Equal)`, but `partial_cmp(Nothing, Nothing)` returns `Some(Equal)`, so that expression is `false`, correctly giving `Nothing != Nothing => false`. However the bigger issue is that both `eq` and `ne` return concrete bool Values for cross-type comparisons that should return `Nothing` (null propagation). The comparison operators `lt`, `lte`, `gt`, `gte` all short-circuit and return `Value::nothing` when either operand is `Nothing`, but `eq` and `ne` do NOT. This means `null == 1` returns `Value::bool(false)` instead of `null`, inconsistent with all other comparisons. The `PartialOrd` impl for `(Nothing, non-Nothing)` returns `Greater`, so `eq(Nothing, Int{0})` computes `partial_cmp -> Some(Greater)`, which is not `Equal`, so `eq` returns `false` - a concrete bool, not `nothing`. This breaks null propagation for equality checks.","fix":"Add the same Nothing short-circuit that `lt`/`lte`/`gt`/`gte` have: if either operand is Nothing, return `Value::nothing(span)` before doing the comparison.","locations":[{"ref":"crates/nu-protocol/src/value/mod.rs:3808-3837","code":" 3808 |     pub fn eq(&self, op: Span, rhs: &Value, span: Span) -> Result<Value, ShellError> {\n 3809 |         if let (Value::Custom { val: lhs, .. }, rhs) = (self, rhs) {\n 3810 |             return lhs.operation(\n 3811 |                 self.span(),\n 3812 |                 Operator::Comparison(Comparison::Equal),\n 3813 |                 op,\n 3814 |                 rhs,\n 3815 |             );\n 3816 |         }\n 3817 | \n 3818 |         Ok(Value::bool(\n 3819 |             matches!(self.partial_cmp(rhs), Some(Ordering::Equal)),\n 3820 |             span,\n 3821 |         ))\n 3822 |     }\n 3823 | \n 3824 |     pub fn ne(&self, op: Span, rhs: &Value, span: Span) -> Result<Value, ShellError> {\n 3825 |         if let (Value::Custom { val: lhs, .. }, rhs) = (self, rhs) {\n 3826 |             return lhs.operation(\n 3827 |                 self.span(),\n 3828 |                 Operator::Comparison(Comparison::NotEqual),\n 3829 |                 op,\n 3830 |                 rhs,\n 3831 |             );\n 3832 |         }\n 3833 | \n 3834 |         Ok(Value::bool(\n 3835 |             !matches!(self.partial_cmp(rhs), Some(Ordering::Equal)),\n 3836 |             span,\n 3837 |         ))","lines":30,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-protocol/src/value/mod.rs#L3808-L3837"}]},
