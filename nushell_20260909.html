722","code":"  717 |     pub fn print_contents(&self) {\n  718 |         for cached_file in self.files.iter() {\n  719 |             let string = String::from_utf8_lossy(&cached_file.content);\n  720 |             println!(\"{string}\");\n  721 |         }\n  722 |     }","lines":6,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-protocol/src/engine/engine_state.rs#L717-L722"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"In `keybindings_listen.rs` line 96, the variable is named `stdout` but it wraps `std::io::stderr()`.\nThis naming is misleading and contradicts its own usage. Both the reader and any future maintainer\nwill be confused about whether output goes to stdout or stderr.","fix":"Rename `stdout` to `stderr_writer` (or similar) to match the actual stream being wrapped.","locations":[{"ref":"crates/nu-cli/src/commands/keybindings_listen.rs:96","code":"   96 |     let mut stdout = std::io::BufWriter::new(std::io::stderr());","lines":1,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cli/src/commands/keybindings_listen.rs#L96"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"span_match_postfix() has a parameter named 'prefix' (line 802) while the doc comment, function name, and internal logic all refer to it as a postfix/suffix. This misleads callers about the semantics and is inconsistent with span_match_prefix() which correctly names its parameter 'prefix'.","fix":"Rename the parameter from 'prefix' to 'postfix' (or 'suffix') to match the doc comment and function intent.","locations":[{"ref":"crates/nu-protocol/src/engine/engine_state.rs:868-878","code":"  868 |     /// If the span's content ends with the given postfix, return two subspans\n  869 |     /// corresponding to the rest of the content, and this postfix.\n  870 |     pub fn span_match_postfix(&self, span: Span, prefix: &[u8]) -> Option<(Span, Span)> {\n  871 |         let contents = self.get_span_contents(span);\n  872 | \n  873 |         if contents.ends_with(prefix) {\n  874 |             span.split_at(span.len() - prefix.len())\n  875 |         } else {\n  876 |             None\n  877 |         }\n  878 |     }","lines":11,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-protocol/src/engine/engine_state.rs#L868-L878"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"The comment at repl.rs line 80 inside get_prompt_string says 'Always reset the color at the start of the right prompt' but the implementation only does so when output is empty - which is the opposite of 'always'. The comment misleads readers about the intended behavior and masks the logic bug described in the adjacent finding.","fix":"Update the comment to accurately describe the current behavior, or fix the condition and keep the comment as-is.","locations":[{"ref":"crates/nu-cli/src/prompt_update.rs:81-85","code":"   81 |     // Always reset the color at the start of the right prompt\n   82 |     // to ensure there is no ansi bleed over\n   83 |     if output.is_empty() && prompt == PROMPT_COMMAND_RIGHT {\n   84 |         output.insert_str(0, \"\\x1b[0m\")\n   85 |     };","lines":5,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cli/src/prompt_update.rs#L81-L85"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"VALID_NAMES_HELP (line 49) lists \"strike\" but omits \"strikethrough\", which is also a valid alias (line 42 of VALID_CODE_NAMES). Users who try \"strikethrough\" and get an error about an unknown name will not see it in the help text.","fix":"Append \"strikethrough\" to VALID_NAMES_HELP: `\"Valid names are: bold, italic, underline, strike, strikethrough, dimmed, reverse, hidden, blink, normal\"`.","locations":[{"ref":"crates/nu-color-config/src/nu_style.rs:48-49","code":"   48 | const VALID_NAMES_HELP: &str =\n   49 |     \"Valid names are: bold, italic, underline, strike, dimmed, reverse, hidden, blink, normal\";","lines":2,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-color-config/src/nu_style.rs#L48-L49"}]},

{"id":"DUP_15","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"easy","description":"`mutate_data_at_cell_path` contains two nearly-identical blocks (lines 1606-1631 for List and 1647-1672 for non-List) handling the `CellPathMutation::Upsert`, `Update/Remove`, and `Insert` error cases for a non-Record/non-Error value when the path member is a String. The logic is identical modulo which value is used for `src_span`. This 25-line block is duplicated.","fix":"Extract the duplicated error-dispatch logic into a helper function that takes the action, optional flag, col_name, span, and src_span.","locations":[{"ref":"crates/nu-protocol/src/value/mod.rs:1608-1633","code":" 1608 |                                 v => match action {\n 1609 |                                     CellPathMutation::Insert { head_span } => {\n 1610 |                                         return Err(ShellError::UnsupportedInput {\n 1611 |                                             msg: \"expected table or record\".into(),\n 1612 |                                             input: format!(\"input type: {:?}\", v.get_type()),\n 1613 |                                             msg_span: *head_span,\n 1614 |                                             input_span: *span,\n 1615 |                                         });\n 1616 |                                     }\n 1617 |                                     CellPathMutation::Update | CellPathMutation::Remove { .. } => {\n 1618 |                                         if !*optional {\n 1619 |                                             return Err(ShellError::CantFindColumn {\n 1620 |                                                 col_name: col_name.clone(),\n 1621 |                                                 span: Some(*span),\n 1622 |                                                 src_span: v.span(),\n 1623 |                                             });\n 1624 | {"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"`EvalBlockFn`, `EvalIrBlockFn`, and `EvalBlockWithEarlyReturnFn` in `eval_helpers.rs` are three distinct public type aliases for the identical function pointer signature. This creates confusion about whether they are interchangeable and adds noise to the API surface. The distinction between `EvalBlockFn` and `EvalBlockWithEarlyReturnFn` is semantically meaningful, but `EvalIrBlockFn` is identical to both and unused.","fix":"Remove `EvalIrBlockFn` (unused). Consider whether `EvalBlockFn` and `EvalBlockWithEarlyReturnFn` should be merged or given more distinct names that communicate their different semantics.","locations":[{"ref":"crates/nu-engine/src/eval_helpers.rs:13-22","code":"   13 | pub type EvalBlockFn =\n   14 |     fn(&EngineState, &mut Stack, &Block, PipelineData) -> Result<PipelineExecutionData, ShellError>;\n   15 | \n   16 | /// Type of eval_ir_block() function\n   17 | pub type EvalIrBlockFn =\n   18 |     fn(&EngineState, &mut Stack, &Block, PipelineData) -> Result<PipelineExecutionData, ShellError>;\n   19 | \n   20 | /// Type of eval_block_with_early_return() function\n   21 | pub type EvalBlockWithEarlyReturnFn =\n   22 |     fn(&EngineState, &mut Stack, &Block, PipelineData) -> Result<PipelineExecutionData, ShellError>;","lines":10,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-engine/src/eval_helpers.rs#L13-L22"}]},
{"id":"ARCH_2","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"parse_literals.rs contains a manual reimplementation of the C `modf` function (lines 1585-1617, borrowed verbatim from libm) to split f64 into integer and fractional parts. Rust's standard library provides `f64::trunc()` and `f64::fract()` which do exactly the same thing. The custom implementation is harder to audit and adds dead code risk.","fix":"Replace the `modf(x)` call and local function with `(x.fract(), x.trunc())` and delete the `fn modf` definition.","locations":[{"ref":"crates/nu-parser/src/parse_literals.rs:1589-1622","code":" 1589 | // Borrowed from libm at https://github.com/rust-lang/libm/blob/master/src/math/modf.rs\n 1590 | fn modf(x: f64) -> (f64, f64) {\n 1591 |     let rv2: f64;\n 1592 |     let mut u = x.to_bits();\n 1593 |     let e = (((u >> 52) & 0x7ff) as i32) - 0x3ff;\n 1594 | \n 1595 |     /* no fractional part */\n 1596 |     if e >= 52 {\n 1597 |         rv2 = x;\n 1598 |         if e == 0x400 && (u << 12) != 0 {\n 1599 |             /* nan */\n 1600 |             return (x, rv2);\n 1601 |         }\n 1602 |         u &= 1 << 63;\n 1603 |         return (f64::from_bits(u), rv2);\n 1604 |     }\n 1605 | \n 1606 |     /* no integral part*/\n 1607 |     if e < 0 {\n 1608 |         u &= 1 << 63;\n 1609 |         rv2 = f64::from_bits(u);\n 1610 |         return (x, rv2);\n 1611 |     }\n 1612 | \n 1613 |     let mask = ((!0) >> 12) >> e;\n 1614 |     if (u & mask) == 0 {\n 1615 |         rv2 = x;\n 1616 |         u &= 1 << 63;\n 1617 |         return (f64::from_bits(u), rv2);\n 1618 |     }\n 1619 |     u &= !mask;\n 1620 |     rv2 = f64::from_bits(u);\n 1621 |     (x - rv2, rv2)\n 1622 | }","lines":34,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/parse_literals.rs#L1589-L1622"}]},
{"id":"ARCH_3","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"parse_module_file_or_dir double-registers the same module when the path is a directory. It calls parse_module_file (which itself calls working_set.add_module), obtains a module_id, clones the module data, and then calls working_set.add_module a second time (line 847), producing a second, redundant module entry in the working set.","fix":"Return the module_id produced by parse_module_file directly, without cloning and re-adding the module. If the name must differ from the file stem, pass the desired name via the name_override argument to parse_module_file.","locations":[{"ref":"crates/nu-parser/src/parse_module.rs:834-853","code":"  834 |         if let Some(module_id) = parse_module_file(\n  835 |             working_set,\n  836 |             mod_nu_path,\n  837 |             path_span,\n  838 |             name_override.or(Some(module_name)),\n  839 |         ) {\n  840 |             let module = working_set.get_module(module_id).clone();\n  841 | \n  842 |             let module_name = String::from_utf8_lossy(&module.name).to_string();\n  843 | \n  844 |             let module_comments = if let Some(comments) = working_set.get_module_comments(module_id)\n  845 |             {\n  846 |                 comments.to_vec()\n  847 |             } else {\n  848 |                 vec![]\n  849 |             };\n  850 | \n  851 |             let new_module_id = working_set.add_module(&module_name, module, module_comments);\n  852 | \n  853 |             Some(new_module_id)","lines":20,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/parse_module.rs#L834-L853"}]},
{"id":"OTHER_1","type":"other","type_label":"Other","severity":"medium","difficulty":"medium","description":"In `rm`, the decision to call `std::fs::remove_dir_all(&f)` is made after calling `f.symlink_metadata()` (line 414) to classify the target. Between that `symlink_metadata` call and the `remove_dir_all` call (line 480), the filesystem state can change (TOCTOU): a regular directory can be replaced with a symlink to another directory tree, causing `remove_dir_all` to follow and destroy the symlink target. On Linux, `remove_dir_all` follows no symlinks at top level (it unlinks the symlink, not its contents) so the risk is reduced, but the race creates an inconsistency between the metadata used for classification and the actual deletion.","fix":"On Linux, use `openat`/`unlinkat` with `AT_REMOVEDIR` (or the `nix` crate's equivalent) inside a loop to perform race-free deletion. For the current approach, document the known TOCTOU window.","locations":[{"ref":"crates/nu-command/src/filesystem/rm.rs:414","code":"  414 |         if let Ok(metadata) = f.symlink_metadata() {","lines":1,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-command/src/filesystem/rm.rs#L414"},{"ref":"crates/nu-command/src/filesystem/rm.rs:462-481","code":"  462 |                 } else if metadata.is_symlink() {\n  463 |                     // In Windows, symlink pointing to a directory can be removed using\n  464 |                     // std::fs::remove_dir instead of std::fs::remove_file.\n  465 |                     #[cfg(windows)]\n  466 |                     {\n  467 |                         use std::os::windows::fs::FileTypeExt;\n  468 |                         if metadata.file_type().is_symlink_dir() {\n  469 |                             std::fs::remove_dir(&f)\n  470 |                         } else {\n  471 |                             std::fs::remove_file(&f)\n  472 |                         }\n  473 |                     }\n  474 | \n  475 |                     #[cfg(not(windows))]\n  476 |                     std::fs::remove_file(&f)\n  477 |                 } else if metadata.is_file() || is_socket || is_fifo {\n  478 |                     std::fs::remove_file(&f)\n  479 |                 } else {\n  480 |                     std::fs::remove_dir_all(&f)\n  481 |                 };","lines":20,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-command/src/filesystem/rm.rs#L462-L481"}]},
{"id":"OTHER_2","type":"other","type_label":"Other","severity":"medium","difficulty":"easy","description":"When `http get/post/...` is called with `--full` flag, the full response record includes `headers.request` which contains all outgoing request headers verbatim, including the `Authorization: Basic <base64>` header set by `--user`/`--password`. This means credentials are surfaced in the pipeline data and can be accidentally logged, stored, or printed. The `--full` mode is designed for debugging but the credential exposure is not documented.","fix":"Strip the `Authorization` header (and similarly `Proxy-Authorization`, `Cookie`) from `request_headers_value` in the `flags.full` path before embedding them in the output record, or at minimum document the behavior in the command help text.","locations":[{"ref":"crates/nu-command/src/network/http/client.rs:1126-1137","code":" 1126 |         let request_headers_value = headers_to_nu(&headers, span)\n 1127 |             .and_then(|data| data.into_value(span))\n 1128 |             .unwrap_or(Value::nothing(span));\n 1129 | \n 1130 |         let response_headers_value = headers_to_nu(&extract_response_headers(&resp), span)\n 1131 |             .and_then(|data| data.into_value(span))\n 1132 |             .unwrap_or(Value::nothing(span));\n 1133 | \n 1134 |         let headers = record! {\n 1135 |             \"request\" => request_headers_value,\n 1136 |             \"response\" => response_headers_value,\n 1137 |         };","lines":12,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-command/src/network/http/client.rs#L1126-L1137"},{"ref":"crates/nu-command/src/network/http/client.rs:385-416","code":"  385 | pub fn request_add_authorization_header<B>(\n  386 |     user: Option<String>,\n  387 |     password: Option<String>,\n  388 |     mut request: RequestBuilder<B>,\n  389 | ) -> RequestBuilder<B> {\n  390 |     let base64_engine = GeneralPurpose::new(&alphabet::STANDARD, PAD);\n  391 | \n  392 |     let login = match (user, password) {\n  393 |         (Some(user), Some(password)) => {\n  394 |             let mut enc_str = String::new();\n  395 |             base64_engine.encode_string(format!(\"{user}:{password}\"), &mut enc_str);\n  396 |             Some(enc_str)\n  397 |         }\n  398 |         (Some(user), _) => {\n  399 |             let mut enc_str = String::new();\n  400 |             base64_engine.encode_string(format!(\"{user}:\"), &mut enc_str);\n  401 |             Some(enc_str)\n  402 |         }\n  403 |         (_, Some(password)) => {\n  404 |             let mut enc_str = String::new();\n  405 |             base64_engine.encode_string(format!(\":{password}\"), &mut enc_str);\n  406 |             Some(enc_str)\n  407 |         }\n  408 |         _ => None,\n  409 |     };\n  410 | \n  411 |     if let Some(login) = login {\n  412 |         request = request.header(\"Authorization\", &format!(\"Basic {login}\"));\n  413 |     }\n  414 | \n  415 |     request\n  416 | }","lines":32,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-command/src/network/http/client.rs#L385-L416"}]},
{"id":"OTHER_3","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"OSC 9;9 and OSC 2 shell-integration sequences embed the working directory path (and command name for OSC 2) directly into ANSI escape sequences without sanitization. If the path contains the ST terminator (ESC \\) or BEL (\\x07) the escape sequence is terminated early, potentially leaking arbitrary characters to the terminal or injecting rogue escape sequences. OSC 7 correctly uses percent-encoding; the same hygiene is missing for OSC 9;9 and OSC 2.","fix":"Sanitize the path (and command name) before embedding in OSC 9;9 and OSC 2 sequences - at minimum strip or escape \\x07 for OSC 2 (BEL-terminated) and \\x1b\\\\ for OSC 9;9 (ST-terminated).","locations":[{"ref":"crates/nu-cli/src/repl.rs:1227","code":" 1227 |         run_ansi_sequence(&format!(\"\\x1b]9;9;{}\\x1b\\\\\", path));","lines":1,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cli/src/repl.rs#L1227"},{"ref":"crates/nu-cli/src/repl.rs:1181","code":" 1181 |         run_ansi_sequence(&format!(\"\\x1b]2;{title}\\x07\"));","lines":1,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-cli/src/repl.rs#L1181"}]},
{"id":"OTHER_4","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"ir::Call::opt_const is required by the CallExt trait but is not implemented for IR evaluation. It returns ShellError::IrEvalError with a message mentioning 'not yet implemented'. This acts as an unimplemented!() equivalent but uses a generic error type rather than a clear NotSupported or similar, making it harder to handle programmatically.","fix":"Return a ShellError variant that clearly communicates the feature is not supported in IR mode, to allow callers to handle or route around it cleanly.","locations":[{"ref":"crates/nu-engine/src/call_ext.rs:329-338","code":"  329 |     fn opt_const<T: FromValue>(\n  330 |         &self,\n  331 |         _working_set: &StateWorkingSet,\n  332 |         _pos: usize,\n  333 |     ) -> Result<Option<T>, ShellError> {\n  334 |         Err(ShellError::IrEvalError {\n  335 |             msg: \"const evaluation is not yet implemented on ir::Call\".into(),\n  336 |             span: Some(self.head),\n  337 |         })\n  338 |     }","lines":10,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-engine/src/call_ext.rs#L329-L338"}]},
{"id":"OTHER_5","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"In parse_alias.rs line 280, split_once on a Cow<str> uses unwrap_or((&arg, \"\")) where &arg is a reference to a local Cow. The contains('=') check just above guarantees split_once succeeds, making the unwrap_or branch dead code, but it also means the fallback borrow refers to the Cow's deref which is safe only because Cow remains live. This is non-obvious and the fallback is unreachable.","fix":"Use .unwrap() (or expect) with a comment noting the preceding contains('=') guard, making the intent explicit and removing the misleading fallback.","locations":[{"ref":"crates/nu-parser/src/parse_alias.rs:282-284","code":"  282 |             let arg = String::from_utf8_lossy(working_set.get_span_contents(spans[1]));\n  283 | \n  284 |             let (name, initial_value) = arg.split_once('=').unwrap_or((&arg, \"\"));","lines":3,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/parse_alias.rs#L282-L284"}]},
{"id":"OTHER_6","type":"other","type_label":"Other","severity":"negligible","difficulty":"easy","description":"The `KnownExternal::signature` implementation (known_external.rs line 23-25) dereferences and immediately clones a `Box<Signature>`: `*self.signature.clone()`. This allocates a clone of the Box, then dereferences to get the inner Signature by value. The `*` and `.clone()` ordering is confusing and could be written as `(*self.signature).clone()` or simply `self.signature.as_ref().clone()` for clarity.","fix":"Rewrite as `(*self.signature).clone()` to make the intent clear, or derive `Clone` properly on `KnownExternal` and use `self.signature.as_ref().clone()`.","locations":[{"ref":"crates/nu-parser/src/known_external.rs:23-25","code":"   23 |     fn signature(&self) -> Signature {\n   24 |         *self.signature.clone()\n   25 |     }","lines":3,"link":"https://github.com/nushell/nushell/blob/9d3157963241cf89447119d34d6e887859f5e7e8/crates/nu-parser/src/known_external.rs#L23-L25"}]}

const HAS_DIFFICULTY = PRESENT_DIFFS.length > 0;
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State
const S = {
  search: '', searchScope: 'all', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenDiff: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(),
};
const statuses = {};

// Persistence
function loadStatuses() {
  try { Object.assign(statuses, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch {}
}
function saveStatuses() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(statuses)); } catch {}
}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;
function syncHash() {
  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));
    if (S.search)            p.set('q',   S.search);
    if (S.searchScope !== 'all') p.set('qs', S.searchScope);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('qs'))  { S.searchScope = p.get('qs'); }
  document.getElementById('search-scope').classList.toggle('active', S.searchScope === 'locations');
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Render a "**Label:** value" line. GitHub/CommonMark only recognizes a
// ``` fence when it starts at the beginning of a line, so if the value
// itself opens with a fence, put it on its own line instead of right
// after the inline label - otherwise the fence marker gets glued onto
// "**Label:** ```" and never renders as a code block.
function mdField(label, value) {
  value = value || '';
  return /^```/.test(value.trim())
    ? '**' + label + ':**\n\n' + value
    : '**' + label + ':** ' + value;
}

// Render the "**Locations:**" block. When a location has a commit-pinned
// permalink (GitHub/GitLab), just paste the bare URL on its own line -
// GitHub/GitLab auto-expand a line-range blob link into an inline code
// preview, so re-pasting the snippet as a fenced block would duplicate it.
// Forges without a detected permalink shape (or missing commit/repo info)
// fall back to the fenced ref+snippet so the location is still readable.
function mdLocations(locations) {
  if (!locations.length) return '';
  let out = '**Locations:**\n\n';
  for (const l of locations) {
    if (l.link)               out += l.link + '\n\n';
    else if (l.code != null)  out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
    else                      out += '- `' + l.ref + '` _(file not found)_\n\n';
  }
  return out;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += mdField('Description', f.description) + '\n\n';
      out += mdLocations(f.locations);
      out += mdField('Fix', f.fix) + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build a [project] header block from embedded PROJECT_INFO, so the exported
// findings.toml is self-contained (doesn't depend on a sibling project-info.toml
// that a second, separately-triggered download could silently fail to save).
// '' when there is no project info at all.
function buildProjectToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = PROJECT_INFO || {};
  if (!Object.keys(pi).length) return '';
  const lines = ['[project]'];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n\n';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return buildProjectToml() + chunks.join('\n\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += mdField('Description', f.description) + '\n\n';
  out += mdLocations(f.locations);
  out += mdField('Fix', f.fix) + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystacks per finding (cleared on full re-render).
// Two variants: everything (default), and file/folder paths only - for when a
// search term (e.g. a directory name like 'dlls/abc') also happens to appear
// inside description/fix prose and you only want path matches.
const _hay = new Map();
const _hayLoc = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}
function hayLocOf(f) {
  if (!_hayLoc.has(f.id)) {
    _hayLoc.set(f.id, f.locations.map(l => l.ref).join(' ').toLowerCase());
  }
  return _hayLoc.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (S.searchScope === 'locations') {
      if (!hayLocOf(f).includes(q)) return false;
    } else if (!hayOf(f).includes(q) && !st.includes(q)) {
      return false;
    }
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  _hayLoc.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    // Single download (was two) - a second auto-triggered download is commonly
    // blocked by the browser unless the user explicitly allows it, which silently
    // drops project-info.toml. Embedding [project] in findings.toml itself avoids
    // that failure mode entirely.
    downloadText(buildFindingsToml(), 'findings.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});
document.getElementById('search-scope').addEventListener('click', e => {
  S.searchScope = S.searchScope === 'locations' ? 'all' : 'locations';
  e.currentTarget.classList.toggle('active', S.searchScope === 'locations');
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
