{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`InterfaceOperationalState::from_flag` treats any interface that is `IFF_RUNNING` but whose `link_state != LINK_STATE_UP` as `Dormant`. `LINK_STATE_UNKNOWN` (the common case for interfaces that don't report link state, e.g. loopback, tun, many virtual interfaces) is thereby reported as `Dormant` rather than `Up`/`Unknown`, which is misleading for the many interface types that never set a concrete link state.","fix":"Treat `LINK_STATE_UNKNOWN` as `Up` (or `Unknown`) when `IFF_RUNNING` is set, reserving `Dormant` for an explicit down/dormant link state.","locations":[{"ref":"src/unix/bsd/network_common.rs:104-116","code":"  104 |     pub(crate) fn from_flag(flags: core::ffi::c_int, link_state: core::ffi::c_int) -> Self {\n  105 |         // https://github.com/freebsd/freebsd-src/blob/7e7d4e711ff94d114c93fd522d4125aa9bd9f5cd/contrib/bsnmp/snmp_mibII/mibII_interfaces.c#L283-L298\n  106 | \n  107 |         if (flags & libc::IFF_RUNNING) != 0 {\n  108 |             if link_state != libc::LINK_STATE_UP {\n  109 |                 InterfaceOperationalState::Dormant\n  110 |             } else {\n  111 |                 InterfaceOperationalState::Up\n  112 |             }\n  113 |         } else {\n  114 |             InterfaceOperationalState::Down\n  115 |         }\n  116 |     }","lines":13,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/bsd/network_common.rs#L104-L116"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`read_table` (both copies) splits each line on the separator and takes only `split.next()` for the\nkey and the next for the value. For `/proc/meminfo` the key is `MemTotal` and the colon separator\nworks, but lines such as `Hugepagesize:` and any future field whose key itself can contain the\nseparator are not a concern here; however the value parsing `value.trim_start().split(' ').next()`\nassumes the value's first space-delimited token is the number. This silently ignores any line where\nthe unit precedes the number or the number has thousands separators - acceptable for /proc/meminfo,\nbut the helper is also used for arbitrary `colsep`/files (cgroup `memory.stat` with `' '`), where a\nkey containing a space (none today) would misparse. Low risk, noting the shared assumption.","fix":"No change needed for current inputs; if generalized, document that keys must not contain the separator and values must start with the numeric token.","locations":[{"ref":"src/unix/linux/cgroup.rs:195-230","code":"  195 | fn read_table<F>(filename: &str, colsep: char, mut f: F)\n  196 | where\n  197 |     F: FnMut(&str, u64),\n  198 | {\n  199 |     if let Ok(content) = get_all_utf8_data(filename, 16_635) {\n  200 |         content\n  201 |             .split('\\n')\n  202 |             .flat_map(|line| {\n  203 |                 let mut split = line.split(colsep);\n  204 |                 let key = split.next()?;\n  205 |                 let value = split.next()?;\n  206 |                 let value0 = value.trim_start().split(' ').next()?;\n  207 |                 let value0_u64 = u64::from_str(value0).ok()?;\n  208 |                 Some((key, value0_u64))\n  209 |             })\n  210 |             .for_each(|(k, v)| f(k, v));\n  211 |     }\n  212 | }\n  213 | \n  214 | fn read_table_key(filename: &Path, target_key: &str, colsep: char) -> Option<u64> {\n  215 |     if let Ok(content) = get_all_utf8_data(filename, 16_635) {\n  216 |         return content.split('\\n').find_map(|line| {\n  217 |             let mut split = line.split(colsep);\n  218 |             let key = split.next()?;\n  219 |             if key != target_key {\n  220 |                 return None;\n  221 |             }\n  222 | \n  223 |             let value = split.next()?;\n  224 |             let value0 = value.trim_start().split(' ').next()?;\n  225 |             u64::from_str(value0).ok()\n  226 |         });\n  227 |     }\n  228 | \n  229 |     None\n  230 | }","lines":36,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/linux/cgroup.rs#L195-L230"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`open_files` counts `fs::read_dir(proc_path/fd).count()`. `read_dir` on `/proc/<pid>/fd` itself\nopens a directory file descriptor while it is being read, so the returned count includes that\ntransient fd and is off by one (the process does not actually have that fd open). `read_dir` also\ndoes not include `.`/`..` on Linux, so the only systematic error is the +1 from the directory handle\nused to enumerate. Minor but a documented inaccuracy historically (see commits 2eddedf/1308eee that\njust touched this).","fix":"If exactness matters, subtract the self-referential entry, or document that the count may be off by one due to the enumeration handle.","locations":[{"ref":"src/unix/linux/process.rs:324-336","code":"  324 |     pub(crate) fn open_files(&self) -> Option<usize> {\n  325 |         let open_files_dir = self.proc_path.as_path().join(\"fd\");\n  326 |         match fs::read_dir(&open_files_dir) {\n  327 |             Ok(entries) => Some(entries.count() as _),\n  328 |             Err(_error) => {\n  329 |                 sysinfo_debug!(\n  330 |                     \"Failed to get open files in `{}`: {_error:?}\",\n  331 |                     open_files_dir.display(),\n  332 |                 );\n  333 |                 None\n  334 |             }\n  335 |         }\n  336 |     }","lines":13,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/linux/process.rs#L324-L336"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `compute_cpu_usage`, the \"first cycle\" guard `if p.old_utime == 0 && p.old_stime == 0 { return; }`\nalso fires on every refresh for a genuinely idle process whose accumulated user+system time is still\n0 (e.g. a freshly-spawned process that has done no work, or a kernel/idle thread). For such a process\nthe previous snapshot is `(0,0)`, so its CPU usage is never computed and stays at the default until\nit happens to accumulate any tick. The intent is \"skip the first sample\", but the condition keys off\nthe values being zero rather than off a \"has previous sample\" flag.","fix":"Track whether a previous sample exists with an explicit boolean (set after `set_time` runs once)\nrather than inferring it from `old_utime == 0 && old_stime == 0`, which is ambiguous with a real\nzero-CPU process.","locations":[{"ref":"src/unix/linux/process.rs:688-703","code":"  688 | pub(crate) fn compute_cpu_usage(p: &mut ProcessInner, total_time: f32, max_value: f32) {\n  689 |     // First time updating the values without reference, wait for a second cycle to update cpu_usage\n  690 |     if p.old_utime == 0 && p.old_stime == 0 {\n  691 |         return;\n  692 |     }\n  693 | \n  694 |     // We use `max_value` to ensure that the process CPU usage will never get bigger than:\n  695 |     // `\"number of CPUs\" * 100.`\n  696 |     p.cpu_usage = (p\n  697 |         .utime\n  698 |         .saturating_sub(p.old_utime)\n  699 |         .saturating_add(p.stime.saturating_sub(p.old_stime)) as f32\n  700 |         / total_time\n  701 |         * 100.)\n  702 |         .min(max_value);\n  703 | }","lines":16,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/linux/process.rs#L688-L703"}]},
{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`get_disk_kind` returns `DiskKind::Unknown(-1)` on failure, the same sentinel used in\n`get_list` to mean \"kind not yet determined\". In `DiskInner::refresh_specifics`, the kind is\nonly (re)queried while `self.type_ == DiskKind::Unknown(-1)`. So if `get_disk_kind` ever fails\nonce (DeviceIoControl error or wrong returned size), the disk is permanently stuck retrying\nthe IOCTL on every refresh because the sentinel never changes, and the user observes an\n`Unknown(-1)` kind indistinguishable from \"pending\".","fix":"Use a distinct sentinel for a genuine query failure (e.g. `DiskKind::Unknown(0)`), or cache the failure so it is not retried indefinitely.","locations":[{"ref":"src/windows/disk.rs:402-431","code":"  402 | unsafe fn get_disk_kind(handle: &HandleWrapper) -> DiskKind {\n  403 |     let spq_trim = STORAGE_PROPERTY_QUERY {\n  404 |         PropertyId: StorageDeviceSeekPenaltyProperty,\n  405 |         QueryType: PropertyStandardQuery,\n  406 |         AdditionalParameters: [0],\n  407 |     };\n  408 |     let mut result: DEVICE_SEEK_PENALTY_DESCRIPTOR = unsafe { std::mem::zeroed() };\n  409 | \n  410 |     let mut dw_size = 0;\n  411 |     let device_io_control = unsafe {\n  412 |         DeviceIoControl(\n  413 |             handle.0,\n  414 |             IOCTL_STORAGE_QUERY_PROPERTY,\n  415 |             Some(&spq_trim as *const STORAGE_PROPERTY_QUERY as *const _),\n  416 |             size_of::<STORAGE_PROPERTY_QUERY>() as _,\n  417 |             Some(&mut result as *mut DEVICE_SEEK_PENALTY_DESCRIPTOR as *mut _),\n  418 |             size_of::<DEVICE_SEEK_PENALTY_DESCRIPTOR>() as _,\n  419 |             Some(&mut dw_size),\n  420 |             None,\n  421 |         )\n  422 |         .is_ok()\n  423 |     };\n  424 | \n  425 |     if !device_io_control || dw_size != size_of::<DEVICE_SEEK_PENALTY_DESCRIPTOR>() as u32 {\n  426 |         DiskKind::Unknown(-1)\n  427 |     } else {\n  428 |         let is_hdd = result.IncursSeekPenalty;\n  429 |         if is_hdd { DiskKind::HDD } else { DiskKind::SSD }\n  430 |     }\n  431 | }","lines":30,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/windows/disk.rs#L402-L431"},{"ref":"src/windows/disk.rs:203-205","code":"  203 |                     if refreshes.kind() && self.type_ == DiskKind::Unknown(-1) {\n  204 |                         self.type_ = get_disk_kind(&handle);\n  205 |                     }","lines":3,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/windows/disk.rs#L203-L205"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"medium","description":"The x86 and arm `ComponentInner`/`ComponentsInner` implementations share a large amount of\nnear-identical boilerplate (the accessor methods `temperature`/`max`/`critical`/`label`/`id`, the\n`from_vec`/`into_vec`/`list`/`list_mut` wrappers, and the `max` update logic in `refresh`). Roughly\n40+ lines are duplicated between `macos/component/x86.rs`, `macos/component/arm.rs`, and the\n`app_store/component.rs` stub.","fix":"Extract the shared accessor/list boilerplate into a common module or macro shared by the architecture-specific component backends.","locations":[{"ref":"src/unix/apple/macos/component/x86.rs:148-176","code":"  148 |     pub(crate) fn temperature(&self) -> Option<f32> {\n  149 |         self.temperature\n  150 |     }\n  151 | \n  152 |     pub(crate) fn max(&self) -> Option<f32> {\n  153 |         Some(self.max)\n  154 |     }\n  155 | \n  156 |     pub(crate) fn critical(&self) -> Option<f32> {\n  157 |         self.critical\n  158 |     }\n  159 | \n  160 |     pub(crate) fn label(&self) -> &str {\n  161 |         &self.label\n  162 |     }\n  163 | \n  164 |     pub(crate) fn id(&self) -> Option<&str> {\n  165 |         Some(&self.id)\n  166 |     }\n  167 | \n  168 |     pub(crate) fn refresh(&mut self) {\n  169 |         self.temperature = self.ffi_part.temperature();\n  170 |         if let Some(temperature) = self.temperature {\n  171 |             if temperature > self.max {\n  172 |                 self.max = temperature;\n  173 |             }\n  174 |         }\n  175 |     }\n  176 | }","lines":29,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/apple/macos/component/x86.rs#L148-L176"},{"ref":"src/unix/apple/macos/component/arm.rs:153-194","code":"  153 |     pub(crate) fn temperature(&self) -> Option<f32> {\n  154 |         self.temperature\n  155 |     }\n  156 | \n  157 |     pub(crate) fn max(&self) -> Option<f32> {\n  158 |         Some(self.max)\n  159 |     }\n  160 | \n  161 |     pub(crate) fn critical(&self) -> Option<f32> {\n  162 |         self.critical\n  163 |     }\n  164 | \n  165 |     pub(crate) fn label(&self) -> &str {\n  166 |         &self.label\n  167 |     }\n  168 | \n  169 |     pub(crate) fn id(&self) -> Option<&str> {\n  170 |         self.id.as_deref()\n  171 |     }\n  172 | \n  173 |     pub(crate) fn refresh(&mut self) {\n  174 |         unsafe {\n  175 |             let Some(event) =\n  176 |                 IOHIDServiceClientCopyEvent(&self.service, kIOHIDEventTypeTemperature, 0, 0)\n  177 |             else {\n  178 |                 self.temperature = None;\n  179 |                 return;\n  180 |             };\n  181 |             // SAFETY: `IOHIDServiceClientCopyEvent` is a \"copy\" function, so\n  182 |             // the event has +1 retain count.\n  183 |             let event = CFRetained::from_raw(event);\n  184 | \n  185 |             let temperature =\n  186 |                 IOHIDEventGetFloatValue(&event, IOHIDEventFieldBase(kIOHIDEventTypeTemperature))\n  187 |                     as _;\n  188 |             self.temperature = Some(temperature);\n  189 |             if temperature > self.max {\n  190 |                 self.max = temperature;\n  191 |             }\n  192 |         }\n  193 |     }\n  194 | }","lines":42,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/apple/macos/component/arm.rs#L153-L194"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`mem_available` is documented to be `active + inactive + free + speculative` (see the comment),\nbut the implementation sums `active + inactive + free` only and omits `speculative_count`. The\nformula in the comment and the code disagree, so available memory is consistently underestimated by\nthe speculative page count.","fix":"Add `.saturating_add(u64::from(stat.speculative_count))` before the `saturating_mul(self.page_size_b)`, or fix the comment to match the intended formula.","locations":[{"ref":"src/unix/apple/system.rs:192-199","code":"  192 |                     // From documentation of Apple XNU:\n  193 |                     // https://github.com/apple-oss-distributions/xnu/blob/main/doc/vm/memorystatus_notify.md#available-memory\n  194 |                     //\n  195 |                     // AVAILABLE_NON_COMPRESSED_MEMORY = (active + inactive + free + speculative)\n  196 |                     self.mem_available = u64::from(stat.active_count)\n  197 |                         .saturating_add(u64::from(stat.inactive_count))\n  198 |                         .saturating_add(u64::from(stat.free_count))\n  199 |                         .saturating_mul(self.page_size_b);","lines":8,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/apple/system.rs#L192-L199"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`refresh_disk_io` on FreeBSD memoizes geom initialization in a `static OnceLock<Result<(),()>>`. If `geom_stats_open` fails once (e.g. transient resource issue, or geom not yet ready at process start), the `Err` is cached permanently and disk I/O stats are disabled for the entire lifetime of the process with no retry.","fix":"Either retry initialization on failure or document that geom I/O is permanently disabled after a single failure.","locations":[{"ref":"src/unix/bsd/freebsd/disk.rs:242-250","code":"  242 | unsafe fn refresh_disk_io<T: GetValues>(disks: &mut [T]) {\n  243 |     static GEOM_STATS: OnceLock<Result<(), ()>> = OnceLock::new();\n  244 | \n  245 |     if GEOM_STATS\n  246 |         .get_or_init(|| unsafe { initialize_geom() })\n  247 |         .is_err()\n  248 |     {\n  249 |         return;\n  250 |     }","lines":9,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/bsd/freebsd/disk.rs#L242-L250"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"FreeBSD `open_files()` computes `len = len * 4 / 3` (multiply then divide) on a `size_t` byte count. For an extremely large initial `len` this multiplication could overflow `usize` before the divide. More importantly the comment justifies the magic 4/3 by citing libutil but the resulting `len` is then passed as the *buffer size* to a second `get_sysctl_raw` while the allocation was made for the *original* `len`; the enlarged `len` tells the kernel the buffer is bigger than it actually is, so the kernel may write past the `malloc(len)` allocation.","fix":"Allocate the buffer using the enlarged length (`len * 4 / 3`) before the second sysctl, or pass the original allocation size; use `checked_mul`/`saturating_mul` for the 4/3 scaling.","locations":[{"ref":"src/unix/bsd/freebsd/process.rs:79-89","code":"   79 |             let Some(data) = AllocatedPtr::<()>::new(len) else {\n   80 |                 sysinfo_debug!(\"Failed to allocate memory to get `open_files` info\");\n   81 |                 return None;\n   82 |             };\n   83 |             // No clue why, it's done this way in `freebsd/lib/libutil/kinfo_getfile.c` so I suppose\n   84 |             // they have a good reason...\n   85 |             len = len * 4 / 3;\n   86 |             if get_sysctl_raw(mib, data.0, &mut len).is_none() {\n   87 |                 sysinfo_debug!(\"Couldn't retrieve `open_files` data\");\n   88 |                 return None;\n   89 |             }","lines":11,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/bsd/freebsd/process.rs#L79-L89"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"medium","description":"`update_networks` does `let mut buf = Vec::with_capacity(len); buf.set_len(len);` then passes\n`buf.as_mut_ptr()` to `sysctl`. Between the two `sysctl` calls the routing table can grow, so the\nsecond call may need more than `len` bytes; `sysctl` will then fail with ENOMEM (handled), but if it\ninstead returns a `len` *smaller* than allocated, the subsequent pointer walk uses the kernel-updated\n`len` so that is fine. The real hazard is `buf.set_len(len)` on uninitialized memory followed by\ntreating it as `*const c_char` and walking it via `(*ifm).ifm_msglen`; a zero or corrupt `ifm_msglen`\nmakes `next = next.offset(0)` an infinite loop, and a value pushing `next` past `lim` is only caught\nby the `while next < lim` check *after* the dereference, so a final truncated record can be read OOB.","fix":"Guard against `ifm_msglen == 0` (break/return) and verify `next.offset(ifm_msglen) <= lim` before dereferencing the next header.","locations":[{"ref":"src/unix/apple/network.rs:129-151","code":"  129 |             }\n  130 |             let mut buf = Vec::with_capacity(len);\n  131 |             buf.set_len(len);\n  132 |             if sysctl(\n  133 |                 mib.as_mut_ptr(),\n  134 |                 mib.len() as _,\n  135 |                 buf.as_mut_ptr(),\n  136 |                 &mut len,\n  137 |                 null_mut(),\n  138 |                 0,\n  139 |             ) < 0\n  140 |             {\n  141 |                 // TODO: might be nice to put an error in here...\n  142 |                 return;\n  143 |             }\n  144 |             let buf = buf.as_ptr() as *const c_char;\n  145 |             let lim = buf.add(len);\n  146 |             let mut next = buf;\n  147 | \n  148 |             while next < lim {\n  149 |                 let ifm = next as *const libc::if_msghdr;\n  150 |                 next = next.offset((*ifm).ifm_msglen as isize);\n  151 |                 if (*ifm).ifm_type == RTM_IFINFO2 as u8 {","lines":23,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/apple/network.rs#L129-L151"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`get_idle` dereferences `cpu_info.offset(...)` without first checking the corresponding\n`num_cpu_info` bound, and `compute_usage_of_cpu` indexes `old_cpu_info`/`cpu_info` at `offset`\nderived from the current cpu list length. If `host_processor_info` ever returns fewer CPU entries\nthan the cached `cpus` vector (e.g. a CPU goes offline between `init_cpus` and a later refresh, or\nthe two `host_processor_info` calls disagree), the loop in `CpusWrapper::refresh` reads past the end\nof the kernel-allocated `cpu_info` buffer (out-of-bounds read). There is no length reconciliation\nbetween `cpus.len()` and `num_cpu_info`.","fix":"Bound the per-CPU loop by `min(cpus.len(), num_cpu_info as usize / CPU_STATE_MAX)` and pass `num_cpu_info` into the closure so offsets cannot exceed the buffer.","locations":[{"ref":"src/unix/apple/cpu.rs:51-66","code":"   51 |         if refresh_kind.usage() && need_cpu_usage_update {\n   52 |             self.last_update = Some(Instant::now());\n   53 |             update_cpu_usage(port, &mut self.global_cpu, |proc_data, cpu_info| {\n   54 |                 let mut percentage = 0f32;\n   55 |                 let mut offset = 0;\n   56 |                 for proc_ in cpus.iter_mut() {\n   57 |                     let cpu_usage = compute_usage_of_cpu(proc_, cpu_info, offset);\n   58 |                     proc_.inner.update(cpu_usage, Arc::clone(&proc_data));\n   59 |                     percentage += proc_.inner.cpu_usage();\n   60 | \n   61 |                     offset += libc::CPU_STATE_MAX as isize;\n   62 |                 }\n   63 |                 (percentage, cpus.len())\n   64 |             });\n   65 |         }\n   66 |     }","lines":16,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/apple/cpu.rs#L51-L66"},{"ref":"src/unix/apple/cpu.rs:229-243","code":"  229 | #[inline]\n  230 | fn get_in_use(cpu_info: *mut i32, offset: isize) -> i64 {\n  231 |     unsafe {\n  232 |         let user = *cpu_info.offset(offset + libc::CPU_STATE_USER as isize) as i64;\n  233 |         let system = *cpu_info.offset(offset + libc::CPU_STATE_SYSTEM as isize) as i64;\n  234 |         let nice = *cpu_info.offset(offset + libc::CPU_STATE_NICE as isize) as i64;\n  235 | \n  236 |         user.saturating_add(system).saturating_add(nice)\n  237 |     }\n  238 | }\n  239 | \n  240 | #[inline]\n  241 | fn get_idle(cpu_info: *mut i32, offset: isize) -> i32 {\n  242 |     unsafe { *cpu_info.offset(offset + libc::CPU_STATE_IDLE as isize) }\n  243 | }","lines":15,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/apple/cpu.rs#L229-L243"}]},
{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`IoService::drop` calls `IOServiceClose(self.0)` outside any `unsafe` block and without checking the\nreturn code. More importantly, `IOServiceClose` is an FFI call and the `Drop` impl is the only place\nthat releases the SMC connection; if `IOServiceOpen` ever returned a connection that was already\nhalf-torn-down this would be a double-close. The result is also silently discarded so a failed close\n(leaked port right) is invisible even in debug builds.","fix":"Wrap the call in `unsafe`, and at least `sysinfo_debug!` on a non-`kIOReturnSuccess` result so leaks during teardown are observable.","locations":[{"ref":"src/unix/apple/macos/component/x86.rs:373-377","code":"  373 | impl Drop for IoService {\n  374 |     fn drop(&mut self) {\n  375 |         IOServiceClose(self.0);\n  376 |     }\n  377 | }","lines":5,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/apple/macos/component/x86.rs#L373-L377"}]},
{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`get_process_infos` does `Vec::with_capacity(arg_max)` then writes into it via\n`proc_args.as_mut_slice().as_mut_ptr()` and later `proc_args.set_len(arg_max)`. `as_mut_slice()` on a\nzero-length Vec yields an empty slice whose pointer is valid for 0 bytes; the code relies on the\nallocation backing `with_capacity` being writable for `arg_max` bytes, which is true, but writing\nthrough a pointer derived from a zero-length slice is questionable provenance. After the call,\n`set_len(arg_max)` is used even though `sysctl` updates `arg_max` to the *actual* bytes written, which\nmay be smaller -- so trailing uninitialized bytes are included in `proc_args`. They are only ever\nparsed up to null terminators so it is usually harmless, but it formally exposes uninitialized memory.","fix":"Use `proc_args.as_mut_ptr()` directly, and `set_len` to the byte count actually returned by the second `sysctl` (the updated `arg_max`) rather than the originally requested size.","locations":[{"ref":"src/unix/apple/macos/process.rs:636-657","code":"  636 |         let mut proc_args: Vec<u8> = Vec::with_capacity(arg_max as _);\n  637 |         if libc::sysctl(\n  638 |             mib.as_mut_ptr(),\n  639 |             mib.len() as _,\n  640 |             proc_args.as_mut_slice().as_mut_ptr() as *mut _,\n  641 |             &mut arg_max,\n  642 |             std::ptr::null_mut(),\n  643 |             0,\n  644 |         ) == -1\n  645 |         {\n  646 |             sysinfo_debug!(\n  647 |                 \"couldn't get arguments and environment for PID {}\",\n  648 |                 process.pid.0\n  649 |             );\n  650 |             return false; // What changed since the previous call? Dark magic!\n  651 |         }\n  652 | \n  653 |         proc_args.set_len(arg_max);\n  654 | \n  655 |         if proc_args.is_empty() {\n  656 |             return false;\n  657 |         }","lines":22,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/apple/macos/process.rs#L636-L657"}]},
{"id":"API_5","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"Every FFI function in c_interface.rs uses `assert!(!ptr.is_null())`. A failed assert panics, and panicking across an `extern \"C\"` boundary is undefined behavior (or an abort with the default panic runtime). Returning a null/sentinel or aborting deliberately would be safer than relying on unwind-through-FFI.","fix":"Replace `assert!` with an explicit early `return` of a sentinel value (mirroring the existing null-checks in sysinfo_cpus_usage), or call `std::process::abort()` so no unwinding crosses the FFI boundary.","locations":[{"ref":"src/c_interface.rs:40-44","code":"   40 | pub extern \"C\" fn sysinfo_destroy(system: CSystem) {\n   41 |     assert!(!system.is_null());\n   42 |     unsafe {\n   43 |         drop(Box::from_raw(system as *mut System));\n   44 |     }","lines":5,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/c_interface.rs#L40-L44"},{"ref":"src/c_interface.rs:439-442","code":"  439 | pub extern \"C\" fn sysinfo_process_pid(process: CProcess) -> PID {\n  440 |     assert!(!process.is_null());\n  441 |     let process = process as *const Process;\n  442 |     unsafe { (*process).pid().0 as _ }","lines":4,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/c_interface.rs#L439-L442"}]},
{"id":"API_6","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`ProcessorCpuLoadInfo::drop` unmaps the kernel-returned buffer with `munmap(self.cpu_load, vm_page_size)`,\ni.e. it always unmaps exactly one page regardless of how large the `host_processor_info` allocation\nactually was. For machines with many CPUs the load-info array can span more than one page, so this\nleaks the remaining pages on each drop. (Compare `CpuData::drop` in cpu.rs which computes the real\nsize, albeit with its own overflow concern.)","fix":"Track the returned `info_size`/`cpu_count` and unmap the full byte length (`cpu_count * size_of::<processor_cpu_load_info>()`, page-rounded) instead of a single `vm_page_size`.","locations":[{"ref":"src/unix/apple/macos/system.rs:47-53","code":"   47 | impl Drop for ProcessorCpuLoadInfo {\n   48 |     fn drop(&mut self) {\n   49 |         unsafe {\n   50 |             munmap(self.cpu_load as _, vm_page_size);\n   51 |         }\n   52 |     }\n   53 | }","lines":7,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/apple/macos/system.rs#L47-L53"},{"ref":"src/unix/apple/macos/system.rs:19-44","code":"   19 |     fn new(port: mach_port_t) -> Option<Self> {\n   20 |         let mut info_size = std::mem::size_of::<processor_cpu_load_info_t>() as _;\n   21 |         let mut cpu_count = 0;\n   22 |         let mut cpu_load: processor_cpu_load_info_t = null_mut();\n   23 | \n   24 |         unsafe {\n   25 |             if host_processor_info(\n   26 |                 port,\n   27 |                 PROCESSOR_CPU_LOAD_INFO,\n   28 |                 &mut cpu_count,\n   29 |                 &mut cpu_load as *mut _ as *mut _,\n   30 |                 &mut info_size,\n   31 |             ) != 0\n   32 |             {\n   33 |                 sysinfo_debug!(\"host_processor_info failed, not updating CPU ticks usage...\");\n   34 |                 None\n   35 |             } else if cpu_count < 1 || cpu_load.is_null() {\n   36 |                 None\n   37 |             } else {\n   38 |                 Some(Self {\n   39 |                     cpu_load,\n   40 |                     cpu_count,\n   41 |                 })\n   42 |             }\n   43 |         }\n   44 |     }","lines":26,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/apple/macos/system.rs#L19-L44"}]},
{"id":"API_7","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`get_users` performs several `std::mem::transmute::<_, &CFString>(...)` conversions relying on\ntoll-free bridging between `NSString` and `CFString`, with `#[allow(clippy::missing_transmute_annotations)]`.\nThese untyped transmutes are brittle: if the upstream `objc2-open-directory` attribute constant types\nchange, the transmute silently reinterprets a pointer of the wrong type. There is no runtime check.","fix":"Use the typed bridging API (`CFRetained`/`as_ref` conversions) provided by objc2 instead of raw `transmute`, or at minimum add explicit type annotations and a comment asserting the layout invariant.","locations":[{"ref":"src/unix/apple/users.rs:50-61","code":"   50 |         #[allow(clippy::missing_transmute_annotations)]\n   51 |         let attributes: CFRetained<CFArray<CFString>> = CFArray::from_objects(&[\n   52 |             // NSString <-> CFString conversion is \"toll-free bridging\".\n   53 |             std::mem::transmute::<_, &CFString>(attr_name),\n   54 |             std::mem::transmute::<_, &CFString>(attr_uid),\n   55 |             std::mem::transmute::<_, &CFString>(attr_gid),\n   56 |         ]);\n   57 |         let Some(query) = ODQueryRef::with_node(\n   58 |             kCFAllocatorDefault,\n   59 |             node_ref.as_deref(),\n   60 |             // NSString <-> CFString conversion is \"toll-free bridging\".\n   61 |             kODRecordTypeUsers.map(|v| std::mem::transmute(v)),","lines":12,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/apple/users.rs#L50-L61"}]},
{"id":"API_8","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`get_sys_value_by_name` requires the returned length to exactly equal `size_of::<T>()` (`original == len`). For sysctls whose kernel value is wider than the requested `T` (common for counters exposed as 64-bit but read into a 32-bit `c_int`, e.g. `kern.maxfilesperproc`/`kern.maxfilesper` read into `u32`, or `kern.osrevision`), the call may legitimately succeed yet be rejected because `len` differs, silently returning `None`/0. This makes `open_files_limit()` and `kernel_version()` fragile across kernel versions.","fix":"Accept `len <= original` (the kernel returns the number of bytes written) rather than requiring exact equality, or size `T` to match the kernel's actual type.","locations":[{"ref":"src/unix/bsd/freebsd/utils.rs:122-137","code":"  122 | #[cfg(any(feature = \"system\", feature = \"component\"))]\n  123 | pub(crate) unsafe fn get_sys_value_by_name<T: Sized>(name: &[u8], value: &mut T) -> bool {\n  124 |     let mut len = std::mem::size_of::<T>() as libc::size_t;\n  125 |     let original = len;\n  126 | \n  127 |     unsafe {\n  128 |         libc::sysctlbyname(\n  129 |             name.as_ptr() as *const libc::c_char,\n  130 |             value as *mut _ as *mut _,\n  131 |             &mut len,\n  132 |             std::ptr::null_mut(),\n  133 |             0,\n  134 |         ) == 0\n  135 |             && original == len\n  136 |     }\n  137 | }","lines":16,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/bsd/freebsd/utils.rs#L122-L137"},{"ref":"src/unix/bsd/netbsd/utils.rs:153-168","code":"  153 | #[cfg(any(feature = \"system\", feature = \"component\"))]\n  154 | pub(crate) unsafe fn get_sys_value_by_name<T: Sized>(name: &[u8], value: &mut T) -> bool {\n  155 |     let mut len = std::mem::size_of::<T>() as libc::size_t;\n  156 |     let original = len;\n  157 | \n  158 |     unsafe {\n  159 |         libc::sysctlbyname(\n  160 |             name.as_ptr() as *const libc::c_char,\n  161 |             value as *mut _ as *mut _,\n  162 |             &mut len,\n  163 |             std::ptr::null_mut(),\n  164 |             0,\n  165 |         ) == 0\n  166 |             && original == len\n  167 |     }\n  168 | }","lines":16,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/bsd/netbsd/utils.rs#L153-L168"}]},
{"id":"API_9","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`Connection::temperature` reads the WMI `CurrentTemperature` (and `CriticalTripPoint`) values\nout of the VARIANT via `variant.Anonymous.decVal.Anonymous2.Lo64`. These properties are\ninteger VARIANTs (VT_I4/VT_UI4), whose value lives in the `lVal`/`ulVal` union member, not in\nthe `DECIMAL` (`decVal`) member. Reinterpreting the union as a DECIMAL and reading `Lo64`\nhappens to work only because the relevant bytes overlap, but it is not the documented field\nand is fragile against VARIANT layout assumptions. It also never inspects `vt` to confirm the\ntype.","fix":"Read the integer via the proper union member (e.g. `variant.Anonymous.Anonymous.Anonymous.lVal`) after checking `vt`, instead of going through `decVal`.","locations":[{"ref":"src/windows/component.rs:299-314","code":"  299 |             let mut variant = variant.assume_init();\n  300 | \n  301 |             // temperature is given in tenth of degrees Kelvin\n  302 |             let temp = (variant.Anonymous.decVal.Anonymous2.Lo64 / 10) as f32 - 273.15;\n  303 |             let _r = VariantClear(&mut variant);\n  304 | \n  305 |             let mut critical = None;\n  306 |             if get_critical {\n  307 |                 class_obj\n  308 |                     .Get(w!(\"CriticalTripPoint\"), 0, &mut variant, None, None)\n  309 |                     .ok()?;\n  310 | \n  311 |                 // temperature is given in tenth of degrees Kelvin\n  312 |                 critical = Some((variant.Anonymous.decVal.Anonymous2.Lo64 / 10) as f32 - 273.15);\n  313 |                 let _r = VariantClear(&mut variant);\n  314 |             }","lines":16,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/windows/component.rs#L299-L314"}]},
{"id":"API_10","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"In `ph_query_process_variable_size`, `return_length` is only written by the first\n`NtQueryInformationProcess` call inside the `if let Err(err) = ...` block. If that call\nunexpectedly returns success (`Ok`), the `if let Err` is false, the block is skipped, and the\nfollowing `return_length.assume_init()` reads uninitialized memory. In practice a 0-length\nquery always fails with STATUS_INFO_LENGTH_MISMATCH, but relying on that for soundness is\nfragile.","fix":"Initialize `return_length` to 0 before the call, or explicitly return None if the first call returns Ok (which is unexpected for a 0-length buffer).","locations":[{"ref":"src/windows/process.rs:658-679","code":"  658 |     let mut return_length = MaybeUninit::<u32>::uninit();\n  659 | \n  660 |     unsafe {\n  661 |         if let Err(err) = NtQueryInformationProcess(\n  662 |             process_handle,\n  663 |             process_information_class as _,\n  664 |             null_mut(),\n  665 |             0,\n  666 |             return_length.as_mut_ptr() as *mut _,\n  667 |         )\n  668 |         .ok()\n  669 |             && ![\n  670 |                 STATUS_BUFFER_OVERFLOW.into(),\n  671 |                 STATUS_BUFFER_TOO_SMALL.into(),\n  672 |                 STATUS_INFO_LENGTH_MISMATCH.into(),\n  673 |             ]\n  674 |             .contains(&err.code())\n  675 |         {\n  676 |             return None;\n  677 |         }\n  678 | \n  679 |         let mut return_length = return_length.assume_init();","lines":22,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/windows/process.rs#L658-L679"}]},
{"id":"API_11","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"In `get_users`, `std::slice::from_raw_parts_mut(uids.0, nb_sessions as _)` is called\nunconditionally after `LsaEnumerateLogonSessions` succeeds. If the call reports 0 sessions and\nleaves `uids.0` null (allowed by the API contract), constructing a slice from a null pointer is\nundefined behavior even for length 0.","fix":"Guard with `if nb_sessions != 0 && !uids.0.is_null()` before forming the slice.","locations":[{"ref":"src/windows/users.rs:235-240","code":"  235 |         let mut nb_sessions = 0;\n  236 |         let mut uids: LsaBuffer<LUID> = Default::default();\n  237 |         if LsaEnumerateLogonSessions(&mut nb_sessions, uids.inner_mut()).is_err() {\n  238 |             sysinfo_debug!(\"LsaEnumerateLogonSessions failed\");\n  239 |         } else {\n  240 |             let entries = std::slice::from_raw_parts_mut(uids.0, nb_sessions as _);","lines":6,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/windows/users.rs#L235-L240"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`/proc/cpuinfo` is read and parsed redundantly. On the very first CPU refresh, `get_vendor_id_and_brand`\nreads and parses the entire `/proc/cpuinfo`; then for each CPU core, `get_cpu_frequency` is called\n(in parallel) and, whenever `scaling_cur_freq` is missing (common on VMs/containers/ARM), each call\nre-opens and re-reads the whole `/proc/cpuinfo` again and linearly scans it. For an N-core machine\nwithout `cpufreq` sysfs this is N full reads+parses of `/proc/cpuinfo` per frequency refresh, plus\nthe separate vendor/brand read.","fix":"Read `/proc/cpuinfo` once per refresh and pass the parsed per-core MHz map down, instead of\nre-reading the file inside `get_cpu_frequency` for every core. Cache the parsed cpuinfo for the\nduration of a single `refresh`.","locations":[{"ref":"src/unix/linux/cpu.rs:450-484","code":"  450 | pub(crate) fn get_cpu_frequency(cpu_core_index: usize) -> u64 {\n  451 |     let mut s = String::new();\n  452 |     if File::open(format!(\n  453 |         \"/sys/devices/system/cpu/cpu{cpu_core_index}/cpufreq/scaling_cur_freq\",\n  454 |     ))\n  455 |     .and_then(|mut f| f.read_to_string(&mut s))\n  456 |     .is_ok()\n  457 |     {\n  458 |         let freq_option = s.trim().split('\\n').next();\n  459 |         if let Some(freq_string) = freq_option\n  460 |             && let Ok(freq) = freq_string.parse::<u64>()\n  461 |         {\n  462 |             return freq / 1000;\n  463 |         }\n  464 |     }\n  465 |     s.clear();\n  466 |     if File::open(\"/proc/cpuinfo\")\n  467 |         .and_then(|mut f| f.read_to_string(&mut s))\n  468 |         .is_err()\n  469 |     {\n  470 |         return 0;\n  471 |     }\n  472 |     let find_cpu_mhz = s.split('\\n').find(|line| {\n  473 |         cpuinfo_is_key(line, b\"cpu MHz\\t\")\n  474 |             || cpuinfo_is_key(line, b\"CPU MHz\\t\")\n  475 |             || cpuinfo_is_key(line, b\"BogoMIPS\")\n  476 |             || cpuinfo_is_key(line, b\"clock\\t\")\n  477 |             || cpuinfo_is_key(line, b\"bogomips per cpu\")\n  478 |     });\n  479 |     find_cpu_mhz\n  480 |         .and_then(|line| line.split(':').next_back())\n  481 |         .and_then(|val| val.replace(\"MHz\", \"\").trim().parse::<f64>().ok())\n  482 |         .map(|speed| speed as u64)\n  483 |         .unwrap_or_default()\n  484 | }","lines":35,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/linux/cpu.rs#L450-L484"},{"ref":"src/unix/linux/cpu.rs:811-820","code":"  811 | pub(crate) fn get_vendor_id_and_brand() -> HashMap<usize, (String, String)> {\n  812 |     let mut s = String::new();\n  813 |     if File::open(\"/proc/cpuinfo\")\n  814 |         .and_then(|mut f| f.read_to_string(&mut s))\n  815 |         .is_err()\n  816 |     {\n  817 |         return HashMap::new();\n  818 |     }\n  819 |     get_vendor_id_and_brand_inner(&s)\n  820 | }","lines":10,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/linux/cpu.rs#L811-L820"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`arm::ComponentsInner::refresh` and `x86` both create fresh `CFString` keys on every refresh call\n(`CFString::from_static_str(...)` per refresh, and in the gpu code `CFString::from_str(\"Device\nUtilization %\")` etc. are allocated inside the per-device loop). These are constant keys that could be\ncreated once. The GPU loop allocates several CFStrings per accelerator per refresh.","fix":"Hoist constant CFString key creation out of the per-iteration/per-refresh paths (create once, reuse).","locations":[{"ref":"src/unix/apple/gpu.rs:152-154","code":"  152 |                     && let Some(usage) = usage_dict\n  153 |                         .get(&CFString::from_str(\"Device Utilization %\"))\n  154 |                         .or_else(|| usage_dict.get(&CFString::from_str(\"Device Utilization\")))","lines":3,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/apple/gpu.rs#L152-L154"},{"ref":"src/unix/apple/macos/component/arm.rs:45-53","code":"   45 |         let keys = [\n   46 |             &*CFString::from_static_str(HID_DEVICE_PROPERTY_PRIMARY_USAGE_PAGE),\n   47 |             &*CFString::from_static_str(HID_DEVICE_PROPERTY_PRIMARY_USAGE),\n   48 |         ];\n   49 | \n   50 |         let nums = [\n   51 |             &*CFNumber::new_i32(kHIDPage_AppleVendor),\n   52 |             &*CFNumber::new_i32(kHIDUsage_AppleVendor_TemperatureSensor),\n   53 |         ];","lines":9,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/apple/macos/component/arm.rs#L45-L53"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`get_disks_mapping` re-queries and re-parses the entire `kern.geom.conftxt` sysctl text on every call to `get_all_list` (i.e. on every disk refresh), even though the disk->geom-label mapping is essentially static. For frequent disk refreshes this is wasted sysctl + string parsing work.","fix":"Cache the mapping (e.g. in a `OnceLock` or on the `DisksInner`) and only rebuild it when a new disk that is not yet mapped appears.","locations":[{"ref":"src/unix/bsd/freebsd/disk.rs:310-339","code":"  310 | fn get_disks_mapping() -> HashMap<String, String> {\n  311 |     let mut disk_mapping = HashMap::new();\n  312 |     let Some(mapping) = get_sys_value_str_by_name(b\"kern.geom.conftxt\\0\") else {\n  313 |         return disk_mapping;\n  314 |     };\n  315 | \n  316 |     let mut last_id = String::new();\n  317 | \n  318 |     for line in mapping.lines() {\n  319 |         let mut parts = line.split_whitespace();\n  320 |         let Some(kind) = parts.next() else { continue };\n  321 | \n  322 |         #[allow(clippy::collapsible_if)]\n  323 |         if kind == \"0\" {\n  324 |             if let Some(\"DISK\") = parts.next()\n  325 |                 && let Some(id) = parts.next()\n  326 |             {\n  327 |                 last_id.clear();\n  328 |                 last_id.push_str(id);\n  329 |             }\n  330 |         } else if kind == \"2\" && !last_id.is_empty() {\n  331 |             if let Some(\"LABEL\") = parts.next()\n  332 |                 && let Some(path) = parts.next()\n  333 |             {\n  334 |                 disk_mapping.insert(format!(\"/dev/{path}\"), last_id.clone());\n  335 |             }\n  336 |         }\n  337 |     }\n  338 |     disk_mapping\n  339 | }","lines":30,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/bsd/freebsd/disk.rs#L310-L339"},{"ref":"src/unix/bsd/freebsd/disk.rs:353","code":"  353 |     let disk_mapping = get_disks_mapping();","lines":1,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/bsd/freebsd/disk.rs#L353"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`refresh_networks_list_from_sysfs` reads each statistics file (rx_bytes, tx_bytes, rx_packets,\ntx_packets, rx_errors, tx_errors, mtu, operstate) with a separate `File::open`/`read` syscall pair\nper interface per refresh - 8 opens per interface every refresh cycle. This is a fixed set of small\nsysfs files; the cost is mostly syscall overhead but adds up with many interfaces and frequent\nrefreshes.","fix":"Acceptable as-is, but could be reduced by reading the combined per-interface counters (e.g. parsing `/proc/net/dev` once) rather than 8 individual sysfs opens per interface.","locations":[{"ref":"src/unix/linux/network.rs:90-102","code":"   90 |             let rx_bytes = read(parent, \"rx_bytes\", &mut num_buf);\n   91 |             let tx_bytes = read(parent, \"tx_bytes\", &mut num_buf);\n   92 |             let rx_packets = read(parent, \"rx_packets\", &mut num_buf);\n   93 |             let tx_packets = read(parent, \"tx_packets\", &mut num_buf);\n   94 |             let rx_errors = read(parent, \"rx_errors\", &mut num_buf);\n   95 |             let tx_errors = read(parent, \"tx_errors\", &mut num_buf);\n   96 |             // let rx_compressed = read(parent, \"rx_compressed\", &mut num_buf);\n   97 |             // let tx_compressed = read(parent, \"tx_compressed\", &mut num_buf);\n   98 |             let mtu = read(entry_path, \"mtu\", &mut num_buf);\n   99 | \n  100 |             let operational_state = InterfaceOperationalState::from_data(\n  101 |                 read_str(entry_path, \"operstate\", &mut str_buf).trim_ascii(),\n  102 |             );","lines":13,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/linux/network.rs#L90-L102"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`refresh_processes_specifics` rebuilds the `(filter_array, filter_callback)` pair and uses a\nboxed `dyn Fn` indirection (`real_filter`/`empty_filter`) for the common `ProcessesToUpdate::All`\ncase, invoking a virtual call per process. With hundreds/thousands of processes this is a\nneedless indirection on a hot path.","fix":"Match on `processes_to_update` once and run two specialized loop bodies, or pass a plain slice and check `filter.is_empty()` inline rather than via a trait object.","locations":[{"ref":"src/windows/system.rs:203-225","code":"  203 |         #[inline(always)]\n  204 |         fn real_filter(e: Pid, filter: &[Pid]) -> bool {\n  205 |             filter.contains(&e)\n  206 |         }\n  207 | \n  208 |         #[inline(always)]\n  209 |         fn empty_filter(_e: Pid, _filter: &[Pid]) -> bool {\n  210 |             true\n  211 |         }\n  212 | \n  213 |         #[allow(clippy::type_complexity)]\n  214 |         let (filter_array, filter_callback): (\n  215 |             &[Pid],\n  216 |             &(dyn Fn(Pid, &[Pid]) -> bool + Sync + Send),\n  217 |         ) = match processes_to_update {\n  218 |             ProcessesToUpdate::All => (&[], &empty_filter),\n  219 |             ProcessesToUpdate::Some(pids) => {\n  220 |                 if pids.is_empty() {\n  221 |                     return 0;\n  222 |                 }\n  223 |                 (pids, &real_filter)\n  224 |             }\n  225 |         };","lines":23,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/windows/system.rs#L203-L225"},{"ref":"src/windows/system.rs:282","code":"  282 |             if filter_callback(proc_id, filter_array) {","lines":1,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/windows/system.rs#L282"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"sysinfo_processes returns `entries.len()` as the count after potentially breaking the callback loop early, so the returned size_t is the total process count rather than the number actually visited. Not incorrect per the doc (it documents the equivalent of `processes()`), but combined with early-break it can mislead callers who expect the count of visited entries. Worth clarifying.","fix":"Document that the return value is always the total number of processes regardless of early termination, or track and return the number of entries actually passed to the callback.","locations":[{"ref":"src/c_interface.rs:365-378","code":"  365 |     if let Some(fn_pointer) = fn_pointer {\n  366 |         unsafe {\n  367 |             let system: Box<System> = Box::from_raw(system as *mut System);\n  368 |             let len = {\n  369 |                 let entries = system.processes();\n  370 |                 for (pid, process) in entries {\n  371 |                     if !fn_pointer(pid.0 as _, process as *const Process as CProcess, data) {\n  372 |                         break;\n  373 |                     }\n  374 |                 }\n  375 |                 entries.len() as size_t\n  376 |             };\n  377 |             let _ = Box::into_raw(system);\n  378 |             len","lines":14,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/c_interface.rs#L365-L378"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`MacAddr::from_str` builds the parser as a lazy iterator of `Result`, pulls six\nitems via `let-else`, then checks for a 7th, then propagates each `?`. Functionally\ncorrect but the manual six-fold `parts.next()` unrolling is verbose and easy to\nget wrong; it also evaluates the radix parse for all parts even when an earlier\none is invalid (the deferred `?` masks which one). Not a correctness bug, just\nfragile/duplicative code.","fix":"Collect into a fixed-size array via `arrayvec`/`try_into`, or parse in a loop with an index bound check, to remove the repeated `let-else` blocks.","locations":[{"ref":"src/common/network.rs:487-516","code":"  487 |     fn from_str(s: &str) -> Result<Self, Self::Err> {\n  488 |         let mut parts = s\n  489 |             .split(':')\n  490 |             .map(|s| u8::from_str_radix(s, 16).map_err(MacAddrFromStrError::IntError));\n  491 | \n  492 |         let Some(data0) = parts.next() else {\n  493 |             return Err(MacAddrFromStrError::InvalidAddrFormat);\n  494 |         };\n  495 |         let Some(data1) = parts.next() else {\n  496 |             return Err(MacAddrFromStrError::InvalidAddrFormat);\n  497 |         };\n  498 |         let Some(data2) = parts.next() else {\n  499 |             return Err(MacAddrFromStrError::InvalidAddrFormat);\n  500 |         };\n  501 |         let Some(data3) = parts.next() else {\n  502 |             return Err(MacAddrFromStrError::InvalidAddrFormat);\n  503 |         };\n  504 |         let Some(data4) = parts.next() else {\n  505 |             return Err(MacAddrFromStrError::InvalidAddrFormat);\n  506 |         };\n  507 |         let Some(data5) = parts.next() else {\n  508 |             return Err(MacAddrFromStrError::InvalidAddrFormat);\n  509 |         };\n  510 | \n  511 |         if parts.next().is_some() {\n  512 |             return Err(MacAddrFromStrError::InvalidAddrFormat);\n  513 |         }\n  514 | \n  515 |         Ok(MacAddr([data0?, data1?, data2?, data3?, data4?, data5?]))\n  516 |     }","lines":30,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/common/network.rs#L487-L516"}]},
{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`from_cstr_array` walks the NUL-terminated pointer array twice: once to count entries and once to build the `Vec`. For process argv/environ this is minor, but it could be a single pass that pushes as it walks (the only reason to pre-count is the `with_capacity`, which a small initial guess plus amortized growth would handle just as well).","fix":"Single-pass walk pushing each `OsString` until the NULL terminator.","locations":[{"ref":"src/unix/bsd/netbsd/utils.rs:213-239","code":"  213 | pub(crate) unsafe fn from_cstr_array(ptr: *const *const libc::c_char) -> Vec<OsString> {\n  214 |     if ptr.is_null() {\n  215 |         return Vec::new();\n  216 |     }\n  217 |     let mut max = 0;\n  218 |     loop {\n  219 |         unsafe {\n  220 |             let ptr = ptr.add(max);\n  221 |             if (*ptr).is_null() {\n  222 |                 break;\n  223 |             }\n  224 |         }\n  225 |         max += 1;\n  226 |     }\n  227 |     if max == 0 {\n  228 |         return Vec::new();\n  229 |     }\n  230 |     let mut ret = Vec::with_capacity(max);\n  231 | \n  232 |     for pos in 0..max {\n  233 |         unsafe {\n  234 |             let p = ptr.add(pos);\n  235 |             ret.push(OsStr::from_bytes(CStr::from_ptr(*p).to_bytes()).to_os_string());\n  236 |         }\n  237 |     }\n  238 |     ret\n  239 | }","lines":27,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/bsd/netbsd/utils.rs#L213-L239"},{"ref":"src/unix/bsd/netbsd/utils.rs:213-239","code":"  213 | pub(crate) unsafe fn from_cstr_array(ptr: *const *const libc::c_char) -> Vec<OsString> {\n  214 |     if ptr.is_null() {\n  215 |         return Vec::new();\n  216 |     }\n  217 |     let mut max = 0;\n  218 |     loop {\n  219 |         unsafe {\n  220 |             let ptr = ptr.add(max);\n  221 |             if (*ptr).is_null() {\n  222 |                 break;\n  223 |             }\n  224 |         }\n  225 |         max += 1;\n  226 |     }\n  227 |     if max == 0 {\n  228 |         return Vec::new();\n  229 |     }\n  230 |     let mut ret = Vec::with_capacity(max);\n  231 | \n  232 |     for pos in 0..max {\n  233 |         unsafe {\n  234 |             let p = ptr.add(pos);\n  235 |             ret.push(OsStr::from_bytes(CStr::from_ptr(*p).to_bytes()).to_os_string());\n  236 |         }\n  237 |     }\n  238 |     ret\n  239 | }","lines":27,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/bsd/netbsd/utils.rs#L213-L239"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"`CpusWrapper.got_cpu_frequency` is set to `false` in `new()` and to `true` at the end of `refresh`\n(lines 32 and 181) but is never read anywhere in the Linux backend. On the Apple/BSD backends the\nequivalent field gates re-querying frequency, but the Linux backend unconditionally re-reads\nfrequency every time `refresh_kind.frequency()` is set. The field is pure dead state on Linux.","fix":"Either remove `got_cpu_frequency` from the Linux `CpusWrapper`, or actually use it to skip the (documented as \"very slow\") frequency re-read when already obtained.","locations":[{"ref":"src/unix/linux/cpu.rs:22-23","code":"   22 |     got_cpu_frequency: bool,\n   23 |     /// This field is needed to prevent updating when not enough time passed since last update.","lines":2,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/linux/cpu.rs#L22-L23"},{"ref":"src/unix/linux/cpu.rs:32","code":"   32 |             got_cpu_frequency: false,","lines":1,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/linux/cpu.rs#L32"},{"ref":"src/unix/linux/cpu.rs:190","code":"  190 |             self.got_cpu_frequency = true;","lines":1,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/linux/cpu.rs#L190"}]},

{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The field is named `uuid` and typed `OsString`, and `new_disk` stores it as `uuid`, but the value\nactually written is the mount path (`f_mntonname`), not a volume UUID. The struct field, the local\nvariable, and the matching logic (`d.inner.uuid == uuid`) are all misleadingly named: disks are\nde-duplicated by mount point, not by UUID. The genuine UUID key\n(`kCFURLVolumeUUIDStringKey`) is requested but never read into this field.","fix":"Rename the field/variable to `mount_point_key` (or actually populate it from `kCFURLVolumeUUIDStringKey`), and update the comment so it does not claim to be a UUID.","locations":[{"ref":"src/unix/apple/disk.rs:336-343","code":"  336 |             let mount_point = PathBuf::from(OsStr::from_bytes(\n  337 |                 CStr::from_ptr(c_disk.f_mntonname.as_ptr()).to_bytes(),\n  338 |             ));\n  339 | \n  340 |             let uuid = OsStr::from_bytes(CStr::from_ptr(c_disk.f_mntonname.as_ptr()).to_bytes())\n  341 |                 .to_os_string();\n  342 | \n  343 |             let disk = container.iter_mut().find(|d| d.inner.uuid == uuid);","lines":8,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/apple/disk.rs#L336-L343"},{"ref":"src/unix/apple/disk.rs:38","code":"   38 |     uuid: OsString,","lines":1,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/apple/disk.rs#L38"}]},

<script>
(function(){
'use strict';

// Data
const FINDINGS     = JSON.parse(document.getElementById('D').textContent);
const PROJECT_INFO = JSON.parse(document.getElementById('PI').textContent);
const SEVS     = ['critical','high','medium','low','negligible'];
const STATUSES = ['open','fixed','wont-fix','false-positive'];
const ALL_TYPES = [...new Set(FINDINGS.map(f => f.type))].sort(cmpTypes);

// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.
const DIFFICULTY_ORDER = ['very_easy','easy','medium','hard'];
const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};
const PRESENT_DIFFS = DIFFICULTY_ORDER.filter(d => FINDINGS.some(f => f.difficulty === d));
const HAS_DIFFICULTY = PRESENT_DIFFS.length > 0;
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State
const S = {
  search: '', searchScope: 'all', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),

// Persistence
function loadStatuses() {

}
function saveStatuses() {

function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;

    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));
    if (S.search)            p.set('q',   S.search);
    if (S.searchScope !== 'all') p.set('qs', S.searchScope);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('qs'))  { S.searchScope = p.get('qs'); }
  document.getElementById('search-scope').classList.toggle('active', S.searchScope === 'locations');
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));

  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }
function isCustom(t)  { return String(t).toLowerCase() === 'custom'; }
function typeCls(t)   { return 'type-badge' + (isCustom(t) ? ' custom-type' : ''); }
// 'custom' findings are the user's own externally-sourced ones; pin them first
// everywhere types are listed so they never blend into the audit's own categories.
function cmpTypes(a, b) {
  if (isCustom(a) !== isCustom(b)) return isCustom(a) ? -1 : 1;
  return String(a).localeCompare(String(b));
}

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Render a "**Label:** value" line. GitHub/CommonMark only recognizes a
// ``` fence when it starts at the beginning of a line, so if the value
// itself opens with a fence, put it on its own line instead of right
// after the inline label - otherwise the fence marker gets glued onto
// "**Label:** ```" and never renders as a code block.
function mdField(label, value) {
  value = value || '';
  return /^```/.test(value.trim())
    ? '**' + label + ':**\n\n' + value
    : '**' + label + ':** ' + value;
}

// Render the "**Locations:**" block. When a location has a commit-pinned
// permalink (GitHub/GitLab), just paste the bare URL on its own line -
// GitHub/GitLab auto-expand a line-range blob link into an inline code
// preview, so re-pasting the snippet as a fenced block would duplicate it.
// Forges without a detected permalink shape (or missing commit/repo info)
// fall back to the fenced ref+snippet so the location is still readable.
function mdLocations(locations) {
  if (!locations.length) return '';
  let out = '**Locations:**\n\n';
  for (const l of locations) {
    if (l.link)               out += l.link + '\n\n';
    else if (l.code != null)  out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
    else                      out += '- `' + l.ref + '` _(file not found)_\n\n';
  }
  return out;
}

// Build full MD report for in-browser download.
function buildMdFull() {
