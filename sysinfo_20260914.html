<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`slice_to_nb` computes `nb = nb * 10 + (c - b'0')` over raw bytes with no digit validation. If the\n`/proc/<pid>/statm` content contains any non-digit byte (e.g. a leading `-`, a space embedded\nunexpectedly, or corrupted/non-standard data), `c - b'0'` underflows and panics in debug builds\n(wraps to a huge value in release). The multiply can also overflow (panic in debug, wrap in\nrelease). The bytes come straight from a `' '`-split of the file with no filtering, so the first\ntwo fields are passed in verbatim.","fix":"Validate each byte is `b'0'..=b'9'` and use checked/saturating arithmetic (or simply parse the\nfield with `u64::from_str` after `str::from_utf8`, mirroring `old_get_memory`). Return 0 / fall back\non any non-digit instead of subtracting unconditionally.","locations":[{"ref":"src/unix/linux/process.rs:1073-1080","code":" 1073 | fn slice_to_nb(s: &[u8]) -> u64 {\n 1074 |     let mut nb: u64 = 0;\n 1075 | \n 1076 |     for c in s {\n 1077 |         nb = nb * 10 + (c - b'0') as u64;\n 1078 |     }\n 1079 |     nb\n 1080 | }","lines":8,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/linux/process.rs#L1073-L1080"},{"ref":"src/unix/linux/process.rs:1101-1111","code":" 1101 |     let mut parts = buf.split(|c| *c == b' ');\n 1102 |     entry.virtual_memory = parts\n 1103 |         .next()\n 1104 |         .map(slice_to_nb)\n 1105 |         .unwrap_or(0)\n 1106 |         .saturating_mul(info.page_size_b);\n 1107 |     entry.memory = parts\n 1108 |         .next()\n 1109 |         .map(slice_to_nb)\n 1110 |         .unwrap_or(0)\n 1111 |         .saturating_mul(info.page_size_b);","lines":11,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/linux/process.rs#L1101-L1111"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`to_u64` has the same unguarded `c - b'0'` pattern with no digit check and `x *= 10` overflow. It is\nused to parse fields from `/proc/stat` (CPU times, `btime`). A malformed or unexpected `/proc/stat`\nline (non-digit byte in a field) underflow-panics in debug builds; very large accumulated values can\noverflow `*= 10` (panic in debug, silent wrap in release).","fix":"Guard with `if !c.is_ascii_digit() { break; }` and use `x = x.wrapping_mul(10).wrapping_add(...)` or\nsaturating arithmetic, matching the safer digit-bounded loop already used in `network.rs::read`.","locations":[{"ref":"src/unix/linux/utils.rs:84-92","code":"   84 | pub(crate) fn to_u64(v: &[u8]) -> u64 {\n   85 |     let mut x = 0;\n   86 | \n   87 |     for c in v {\n   88 |         x *= 10;\n   89 |         x += u64::from(c - b'0');\n   90 |     }\n   91 |     x\n   92 | }","lines":9,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/linux/utils.rs#L84-L92"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"In `parse_smbios`, the inner string-skipping loop is guarded by `while i < table.len()` but\naccesses `table[i + 1]`. When `i == table.len() - 1`, `table[i + 1]` indexes one past the end\nand panics. SMBIOS data comes from firmware (`GetSystemFirmwareTable`) and can be malformed or\ntruncated, especially in virtual machines, so this is reachable.","fix":"Change the inner condition to `while i + 1 < table.len()` (and handle the trailing-byte case), or check `i + 1 < table.len()` before reading `table[i + 1]`.","locations":[{"ref":"src/windows/utils.rs:130-136","code":"  130 |                 while i < table.len() {\n  131 |                     if table[i] == 0 && table[i + 1] == 0 {\n  132 |                         i += 2;\n  133 |                         break;\n  134 |                     }\n  135 |                     i += 1;\n  136 |                 }","lines":7,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/windows/utils.rs#L130-L136"}]},
{"id":"UAF_1","type":"use_after_free","type_label":"Use After Free","severity":"low","difficulty":"medium","description":"`CustomBufReader::next` returns `Some(unsafe transmute::<&str, &'a str>(self.buffer.as_str()))`,\nlaundering the borrow of `self.buffer` to lifetime `'a` even though the very next call to `next`\ndoes `self.buffer.clear()` and overwrites the buffer. Any consumer that retains a returned `&str`\nacross a subsequent `next` call would read freed/overwritten data (UB). The current callers\n(`find_first_vendor`, `fill_device_map`) only use one line at a time so it is not triggered today,\nbut the API is unsound and a latent footgun.","fix":"Don't expose a lifetime-laundering `Iterator`; instead return owned `String`s, or restructure to a\n`while let Some(line) = reader.read_next()` method that borrows `&mut self` for each line (a lending\niterator), so the borrow checker forbids holding a line across the next read.","locations":[{"ref":"src/unix/linux/gpu.rs:216-236","code":"  216 | impl<'a> Iterator for CustomBufReader<'a> {\n  217 |     type Item = &'a str;\n  218 | \n  219 |     fn next(&mut self) -> Option<Self::Item> {\n  220 |         loop {\n  221 |             self.buffer.clear();\n  222 |             if self.reader.read_line(self.buffer).ok()? == 0 {\n  223 |                 return None;\n  224 |             } else if self.buffer.starts_with(\"C \") {\n  225 |                 // We reached the end of the device list.\n  226 |                 return None;\n  227 |             } else if !self.buffer.starts_with('#') {\n  228 |                 // SAFETY: This is because of `Iterator` trait limitations: we cannot return a\n  229 |                 // reference to the type's fields because that would require changing `next` to\n  230 |                 // `fn next(&'a mut self) -> ...`, which isn't allowed by the compiler. So instead,\n  231 |                 // we `transmute`...\n  232 |                 return Some(unsafe { std::mem::transmute::<&str, &'a str>(self.buffer.as_str()) });\n  233 |             }\n  234 |         }\n  235 |     }\n  236 | }","lines":21,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/linux/gpu.rs#L216-L236"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`free_swap()` computes `self.swap_total - self.swap_used` with a plain subtraction. The two values come from independent sysctl/kvm reads (and on NetBSD from independent `swpages`/`swpginuse` fields), so `swap_used` can transiently exceed `swap_total`, causing a debug-build panic on subtraction overflow (and a huge wrapped value in release). Every other accumulator in this crate uses `saturating_sub`.","fix":"Use `self.swap_total.saturating_sub(self.swap_used)`.","locations":[{"ref":"src/unix/bsd/freebsd/system.rs:132-134","code":"  132 |     pub(crate) fn free_swap(&self) -> u64 {\n  133 |         self.swap_total - self.swap_used\n  134 |     }","lines":3,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/bsd/freebsd/system.rs#L132-L134"},{"ref":"src/unix/bsd/netbsd/system.rs:145-147","code":"  145 |     pub(crate) fn free_swap(&self) -> u64 {\n  146 |         self.swap_total - self.swap_used\n  147 |     }","lines":3,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/bsd/netbsd/system.rs#L145-L147"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`used_memory()` returns `mem_total - mem_available` and `used_swap()` returns\n`swap_total - swap_free` with plain subtraction. These values are read independently from\n`/proc/meminfo` at (potentially) different refresh times, and `MemAvailable` is an estimate that the\nkernel does not guarantee to be <= `MemTotal`; under some conditions (or when the fields were never\nrefreshed together) `mem_available > mem_total` is possible, causing an underflow panic in debug\nbuilds and a near-`u64::MAX` result in release. Every other arithmetic path in this module already\nuses `saturating_*`.","fix":"Use `self.mem_total.saturating_sub(self.mem_available)` and `self.swap_total.saturating_sub(self.swap_free)`.","locations":[{"ref":"src/unix/linux/system.rs:334-336","code":"  334 |     pub(crate) fn used_memory(&self) -> u64 {\n  335 |         self.mem_total - self.mem_available\n  336 |     }","lines":3,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/linux/system.rs#L334-L336"},{"ref":"src/unix/linux/system.rs:347-349","code":"  347 |     pub(crate) fn used_swap(&self) -> u64 {\n  348 |         self.swap_total - self.swap_free\n  349 |     }","lines":3,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/linux/system.rs#L347-L349"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"`compute_start` computes `process_times / 10_000_000 - 11_644_473_600` with no underflow\nguard. `get_process_times` returns 0 when `GetProcessTimes` fails (e.g. on a restricted handle),\nand `get_start_time`/`get_start_and_run_time` feed that 0 straight into `compute_start`. For\nany value below 11_644_473_600 (in particular 0), the subtraction underflows: a panic in debug\nbuilds and a wildly wrong wrapped start time in release builds.","fix":"Guard the subtraction, e.g. `(process_times / 10_000_000).saturating_sub(11_644_473_600)`, and/or have `get_process_times` signal failure instead of returning 0.","locations":[{"ref":"src/windows/process.rs:630-652","code":"  630 | #[inline]\n  631 | fn compute_start(process_times: u64) -> u64 {\n  632 |     // 11_644_473_600 is the number of seconds between the Windows epoch (1601-01-01) and\n  633 |     // the Linux epoch (1970-01-01).\n  634 |     process_times / 10_000_000 - 11_644_473_600\n  635 | }\n  636 | \n  637 | fn get_start_and_run_time(handle: HANDLE, now: u64) -> (u64, u64) {\n  638 |     unsafe {\n  639 |         let process_times = get_process_times(handle);\n  640 |         let start = compute_start(process_times);\n  641 |         let run_time = check_sub(now, start);\n  642 |         (start, run_time)\n  643 |     }\n  644 | }\n  645 | \n  646 | #[inline]\n  647 | pub(crate) fn get_start_time(handle: HANDLE) -> u64 {\n  648 |     unsafe {\n  649 |         let process_times = get_process_times(handle);\n  650 |         compute_start(process_times)\n  651 |     }\n  652 | }","lines":23,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/windows/process.rs#L630-L652"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`CpuData::drop` computes `prev_cpu_info_size = size_of::<i32>() as u32 * self.num_cpu_info`. With a\nvery large `num_cpu_info` (returned by `host_processor_info`) this `u32` multiplication can overflow\nand pass a too-small length to `vm_deallocate`, leaking the rest of the mapping. In practice\n`num_cpu_info` is small, but the unchecked `u32` arithmetic is fragile.","fix":"Compute the size in `usize` (or use `checked_mul`) before passing to `vm_deallocate`.","locations":[{"ref":"src/unix/apple/cpu.rs:96-110","code":"   96 | impl Drop for CpuData {\n   97 |     fn drop(&mut self) {\n   98 |         if !self.cpu_info.0.is_null() {\n   99 |             let prev_cpu_info_size = std::mem::size_of::<i32>() as u32 * self.num_cpu_info;\n  100 |             unsafe {\n  101 |                 libc::vm_deallocate(\n  102 |                     #[allow(deprecated)]\n  103 |                     mach_task_self(),\n  104 |                     self.cpu_info.0 as _,\n  105 |                     prev_cpu_info_size as _,\n  106 |                 );\n  107 |             }\n  108 |             self.cpu_info.0 = std::ptr::null_mut();\n  109 |         }\n  110 |     }","lines":15,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/apple/cpu.rs#L96-L110"}]},
{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"The x86 `ultostr` helper masks each byte with `% 128` instead of `& 0xFF` (or `& 0x7F` if 7-bit was\nintended). For any byte >= 128 this corrupts the reconstructed `data_type` string. It currently works\nonly because the compared type strings (e.g. \"sp78\") are pure ASCII < 128, but the masking is wrong\nfor general 4CC values and is a latent bug.","fix":"Mask with `& 0xFF` (cast `u8`) so the full byte is preserved when reconstructing the type code.","locations":[{"ref":"src/unix/apple/macos/component/x86.rs:209-218","code":"  209 | #[inline]\n  210 | unsafe fn ultostr(s: *mut c_char, val: u32) {\n  211 |     unsafe {\n  212 |         *s.offset(0) = ((val >> 24) % 128) as i8;\n  213 |         *s.offset(1) = ((val >> 16) % 128) as i8;\n  214 |         *s.offset(2) = ((val >> 8) % 128) as i8;\n  215 |         *s.offset(3) = (val % 128) as i8;\n  216 |         *s.offset(4) = 0;\n  217 |     }\n  218 | }","lines":10,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/apple/macos/component/x86.rs#L209-L218"}]},
{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`get_proc_list` computes `count * mem::size_of::<Pid>() as i32` as an `i32`. On a system with an\nextreme number of pids this `i32` byte count can overflow to a negative/small value, which would\ncause `proc_listallpids` to be told the buffer is far smaller than it is. `count` came from the same\nsyscall so this is unlikely in practice, but the arithmetic is unchecked `i32`.","fix":"Compute the byte size in `usize`/`isize` and pass it without truncating through `i32`.","locations":[{"ref":"src/unix/apple/macos/process.rs:878-895","code":"  878 | pub(crate) fn get_proc_list() -> Option<Vec<Pid>> {\n  879 |     unsafe {\n  880 |         let count = libc::proc_listallpids(::std::ptr::null_mut(), 0);\n  881 |         if count < 1 {\n  882 |             return None;\n  883 |         }\n  884 |         let mut pids: Vec<Pid> = Vec::with_capacity(count as usize);\n  885 |         pids.set_len(count as usize);\n  886 |         let count = count * mem::size_of::<Pid>() as i32;\n  887 |         let x = libc::proc_listallpids(pids.as_mut_ptr() as *mut c_void, count);\n  888 | \n  889 |         if x < 1 || x as usize >= pids.len() {\n  890 |             None\n  891 |         } else {\n  892 |             pids.set_len(x as usize);\n  893 |             Some(pids)\n  894 |         }\n  895 |     }","lines":18,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/apple/macos/process.rs#L878-L895"}]},
{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`used_swap()` computes `self.swap_total - self.swap_free` with an unchecked subtraction.\nIf `swap_free` is ever greater than `swap_total` (the two values are sampled from `xsw_usage`\nfields that are not guaranteed to be mutually consistent at the instant they are read), this\npanics in debug builds and wraps to a huge value in release builds. Every other delta in this\nfile uses `saturating_sub`; this one was missed (note the `// TODO: need to be checked` comment\nright above it).","fix":"Use `self.swap_total.saturating_sub(self.swap_free)`.","locations":[{"ref":"src/unix/apple/system.rs:371-374","code":"  371 |     // TODO: need to be checked\n  372 |     pub(crate) fn used_swap(&self) -> u64 {\n  373 |         self.swap_total - self.swap_free\n  374 |     }","lines":4,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/apple/system.rs#L371-L374"}]},
{"id":"OVF_8","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"NetBSD memory/swap computation multiplies kernel-reported i64 page counts by `page_size` and adds them with plain `*`/`+` operators (no saturating arithmetic). `info.active + info.wired`, `(info.filepages + info.execpages)`, `info.npages * page_size`, `info.swpages * page_size`, and `self.mem_used + cached_memory` can overflow/panic in debug builds on machines with very large memory or if the kernel returns an unexpected value. The FreeBSD backend consistently uses `saturating_mul`/`saturating_add` for the same kind of computation.","fix":"Use `saturating_mul`/`saturating_add` (or checked arithmetic) as the FreeBSD backend does in `SystemInfo::get_*_memory`.","locations":[{"ref":"src/unix/bsd/netbsd/system.rs:68-76","code":"   68 |             self.mem_total = info.npages as u64 * self.system_info.page_size;\n   69 |             self.mem_used = (info.active as u64 + info.wired as u64) * self.system_info.page_size;\n   70 |             let cached_memory =\n   71 |                 (info.filepages + info.execpages) as u64 * self.system_info.page_size;\n   72 |             self.mem_free = self.mem_total.saturating_sub(self.mem_used + cached_memory);\n   73 |         }\n   74 |         if refresh_kind.swap() {\n   75 |             self.swap_total = info.swpages as u64 * self.system_info.page_size;\n   76 |             self.swap_used = info.swpginuse as u64 * self.system_info.page_size;","lines":9,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/bsd/netbsd/system.rs#L68-L76"}]},
{"id":"OVF_9","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"In `CpuValues`/`CpuUsage::set`, the `min!` macro and the `irq` term use non-saturating arithmetic\nwhile the rest of the file is careful to use `saturating_*`. Specifically `(steal_period +\nguest_period)` (line 352) is a plain `+` on two `u64` periods, and `min!($a, $b, $def)` does `$a -\n$b` after only checking `$a > $b`. While periods are normally small deltas, `/proc/stat` counters\ncan reset (e.g. CPU hotplug, counter wrap) producing inconsistent old/new snapshots; the plain `+`\ncan then overflow (debug panic) and the macro logic is fragile. `steal_period` itself is already\ncomputed with `saturating_sub`, so the inconsistency is purely the final `+`.","fix":"Use `steal_period.saturating_add(guest_period)` for the `irq` numerator to stay consistent with the surrounding saturating math.","locations":[{"ref":"src/unix/linux/cpu.rs:331-361","code":"  331 |         macro_rules! min {\n  332 |             ($a:expr, $b:expr, $def:expr) => {\n  333 |                 if $a > $b { ($a - $b) as f32 } else { $def }\n  334 |             };\n  335 |         }\n  336 | \n  337 |         self.old_values = self.new_values;\n  338 |         self.new_values.set(\n  339 |             user, nice, system, idle, iowait, irq, softirq, steal, guest, guest_nice,\n  340 |         );\n  341 | \n  342 |         self.total_time = self.new_values.total_time();\n  343 |         self.old_total_time = self.old_values.total_time();\n  344 | \n  345 |         let nice_period = self.new_values.nice.saturating_sub(self.old_values.nice);\n  346 |         let user_period = self.new_values.user.saturating_sub(self.old_values.user);\n  347 |         let steal_period = self.new_values.steal.saturating_sub(self.old_values.steal);\n  348 |         let guest_period = self\n  349 |             .new_values\n  350 |             .virtual_time()\n  351 |             .saturating_sub(self.old_values.virtual_time());\n  352 |         let system_period = self\n  353 |             .new_values\n  354 |             .system_time()\n  355 |             .saturating_sub(self.old_values.system_time());\n  356 | \n  357 |         let total = min!(self.total_time, self.old_total_time, 1.);\n  358 |         let nice = nice_period as f32 / total;\n  359 |         let user = user_period as f32 / total;\n  360 |         let system = system_period as f32 / total;\n  361 |         let irq = (steal_period + guest_period) as f32 / total;","lines":31,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/linux/cpu.rs#L331-L361"}]},
{"id":"OVF_10","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`disk.rs` computes byte counters as `stat.sectors_read * SECTOR_SIZE` and\n`stat.sectors_written * SECTOR_SIZE` with plain `*`. `sectors_read`/`sectors_written` are parsed as\n`u64` directly from `/proc/diskstats` with no clamping, so a very large (or maliciously crafted in a\ncontainer) value multiplied by 512 can overflow `u64` (debug panic, silent wrap in release).","fix":"Use `stat.sectors_read.saturating_mul(SECTOR_SIZE)` and likewise for written.","locations":[{"ref":"src/unix/linux/disk.rs:130-131","code":"  130 |                 self.read_bytes = stat.sectors_read * SECTOR_SIZE;\n  131 |                 self.written_bytes = stat.sectors_written * SECTOR_SIZE;","lines":2,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/linux/disk.rs#L130-L131"}]},
{"id":"OVF_11","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`used_memory()` returns `self.mem_total - self.mem_available` and `free_swap()` returns\n`self.swap_total - self.swap_used` with plain subtraction. `mem_available`/`swap_used` are read\nfrom independent Win32 calls (`GlobalMemoryStatusEx`, `K32GetPerformanceInfo`) and are not\nguaranteed to be <= the corresponding total, so the subtraction can underflow (debug panic /\nrelease wrap to a huge value). Other counters in this file already use `saturating_sub`.","fix":"Use `self.mem_total.saturating_sub(self.mem_available)` and `self.swap_total.saturating_sub(self.swap_used)`.","locations":[{"ref":"src/windows/system.rs:363-365","code":"  363 |     pub(crate) fn used_memory(&self) -> u64 {\n  364 |         self.mem_total - self.mem_available\n  365 |     }","lines":3,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/windows/system.rs#L363-L365"},{"ref":"src/windows/system.rs:371-373","code":"  371 |     pub(crate) fn free_swap(&self) -> u64 {\n  372 |         self.swap_total - self.swap_used\n  373 |     }","lines":3,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/windows/system.rs#L371-L373"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`PCI`'s `Display` impl formats `domain`, `bus` and `device` as hexadecimal\n(`\"{domain:04x}:{bus:02x}:{device:02x}.{function}\"`), but its `FromStr` impl\nparses every field with `value.parse::<u32>()` which is base-10. As a result\n`PCI::from_str(&pci.to_string())` does not round-trip: any hex digit a-f makes\nthe parse fail (\"invalid domain\"/\"invalid bus\"/...) and a value like `0x10`\nparses as decimal 16 rather than 16-hex. The two impls are inconsistent.","fix":"Parse with `u32::from_str_radix(value, 16)` for domain/bus/device (and decide whether `function` is hex or decimal to match `Display`, which prints it without `{:x}`), so that `Display`/`FromStr` round-trip.","locations":[{"ref":"src/common/gpu.rs:145-195","code":"  145 | impl fmt::Display for PCI {\n  146 |     fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {\n  147 |         let Self {\n  148 |             domain,\n  149 |             bus,\n  150 |             device,\n  151 |             function,\n  152 |         } = self;\n  153 |         write!(f, \"{domain:04x}:{bus:02x}:{device:02x}.{function}\")\n  154 |     }\n  155 | }\n  156 | \n  157 | impl core::str::FromStr for PCI {\n  158 |     type Err = &'static str;\n  159 | \n  160 |     fn from_str(s: &str) -> Result<Self, Self::Err> {\n  161 |         fn get_next_u32<'a>(\n  162 |             iter: &mut impl Iterator<Item = &'a str>,\n  163 |             missing_msg: &'static str,\n  164 |             invalid_msg: &'static str,\n  165 |         ) -> Result<u32, &'static str> {\n  166 |             let Some(value) = iter.next() else {\n  167 |                 return Err(missing_msg);\n  168 |             };\n  169 |             value.parse::<u32>().map_err(|_| invalid_msg)\n  170 |         }\n  171 | \n  172 |         let mut iter = s.split(':');\n  173 |         let domain = get_next_u32(&mut iter, \"missing domain\", \"invalid domain\")?;\n  174 |         let bus = get_next_u32(&mut iter, \"missing bus\", \"invalid bus\")?;\n  175 |         let Some(last) = iter.next() else {\n  176 |             return Err(\"missing device\");\n  177 |         };\n  178 |         if iter.next().is_some() {\n  179 |             return Err(\"unexpected `:` after bus\");\n  180 |         };\n  181 |         let mut iter = last.split('.');\n  182 |         let device = get_next_u32(&mut iter, \"missing device\", \"invalid device\")?;\n  183 |         let function = get_next_u32(&mut iter, \"missing function\", \"invalid function\")?;\n  184 |         if iter.next().is_some() {\n  185 |             return Err(\"unexpected `:` after function\");\n  186 |         };\n  187 | \n  188 |         Ok(Self {\n  189 |             domain,\n  190 |             bus,\n  191 |             device,\n  192 |             function,\n  193 |         })\n  194 |     }\n  195 | }","lines":51,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/common/gpu.rs#L145-L195"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In `update_process` (backup CPU computation branch), `p.old_stime` is overloaded to store\n`mach_absolute_time()` while `p.old_utime` stores cumulative task time. The deltas are then computed\nas `task_time - p.old_utime` and `time - p.old_stime`. But in the *other* branch (`time_interval`\npresent) and in `create_new_process`, `old_stime`/`old_utime` are set to\n`pti_total_system`/`pti_total_user`. So if `time_interval` toggles between `Some` and `None` across\nrefreshes (it is `None` whenever `clock_info` is absent), the backup branch reads an `old_stime` that\nholds a *task-time* value as if it were a *mach timestamp*, producing wildly wrong CPU usage. The two\ncode paths reuse the same fields with incompatible meanings.","fix":"Use separate fields for the backup-path timestamp baseline (e.g. `old_mach_time`) rather than overloading `old_stime`/`old_utime`, so switching between the two CPU-usage strategies cannot mix value domains.","locations":[{"ref":"src/unix/apple/macos/process.rs:330-380","code":"  330 | #[allow(deprecated)] // Because of libc::mach_absolute_time.\n  331 | pub(crate) fn compute_cpu_usage(\n  332 |     p: &mut ProcessInner,\n  333 |     task_info: libc::proc_taskinfo,\n  334 |     system_time: u64,\n  335 |     user_time: u64,\n  336 |     time_interval: Option<f64>,\n  337 | ) {\n  338 |     if let Some(time_interval) = time_interval {\n  339 |         let total_existing_time = p.old_stime.saturating_add(p.old_utime);\n  340 |         if time_interval > 0.000001 && total_existing_time > 0 {\n  341 |             let total_current_time = task_info\n  342 |                 .pti_total_system\n  343 |                 .saturating_add(task_info.pti_total_user);\n  344 | \n  345 |             let total_time_diff = total_current_time.saturating_sub(total_existing_time);\n  346 |             if total_time_diff > 0 {\n  347 |                 p.cpu_usage = (total_time_diff as f64 / time_interval * 100.) as f32;\n  348 |             }\n  349 |         }\n  350 |         p.old_stime = task_info.pti_total_system;\n  351 |         p.old_utime = task_info.pti_total_user;\n  352 |     } else {\n  353 |         unsafe {\n  354 |             // This is the \"backup way\" of CPU computation.\n  355 |             let time = libc::mach_absolute_time();\n  356 |             let task_time = user_time\n  357 |                 .saturating_add(system_time)\n  358 |                 .saturating_add(task_info.pti_total_user)\n  359 |                 .saturating_add(task_info.pti_total_system);\n  360 | \n  361 |             let system_time_delta = if task_time < p.old_utime {\n  362 |                 task_time\n  363 |             } else {\n  364 |                 task_time.saturating_sub(p.old_utime)\n  365 |             };\n  366 |             let time_delta = if time < p.old_stime {\n  367 |                 time\n  368 |             } else {\n  369 |                 time.saturating_sub(p.old_stime)\n  370 |             };\n  371 |             p.old_utime = task_time;\n  372 |             p.old_stime = time;\n  373 |             p.cpu_usage = if time_delta == 0 {\n  374 |                 0f32\n  375 |             } else {\n  376 |                 (system_time_delta as f64 * 100f64 / time_delta as f64) as f32\n  377 |             };\n  378 |         }\n  379 |     }\n  380 | }","lines":51,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/apple/macos/process.rs#L330-L380"},{"ref":"src/unix/apple/macos/process.rs:483-484","code":"  483 |             p.old_stime = task_info.pti_total_system;\n  484 |             p.old_utime = task_info.pti_total_user;","lines":2,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/apple/macos/process.rs#L483-L484"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"NetBSD global CPU usage accumulates into a buffer that is never zeroed. `global_cp_times = self.global_cp_times.get_mut()` returns the VecSwitcher's 'new' buffer, which still holds the per-state sums computed two refreshes ago (VecSwitcher just flips between v1/v2, it does not clear). The loop then does `global_cp_times[CP_*] += new_cp_times[CP_*]` on top of those stale values, so the global CPU usage is computed from corrupted accumulated totals after the first two refreshes.","fix":"Zero `global_cp_times` (e.g. `global_cp_times.fill(0)`) before summing the per-CPU `new_cp_times` into it.","locations":[{"ref":"src/unix/bsd/netbsd/cpu.rs:72-104","code":"   72 |     fn get_cpu_usage(&mut self) {\n   73 |         let global_cp_times = self.global_cp_times.get_mut();\n   74 |         for (pos, (cpu, cp_times)) in self\n   75 |             .cpus\n   76 |             .iter_mut()\n   77 |             .zip(self.cp_times.iter_mut())\n   78 |             .enumerate()\n   79 |         {\n   80 |             unsafe {\n   81 |                 if !get_sys_value_array(\n   82 |                     &[ffi::CTL_KERN, libc::KERN_CP_TIME, pos as _],\n   83 |                     cp_times.get_mut(),\n   84 |                 ) {\n   85 |                     sysinfo_debug!(\n   86 |                         \"wrong CPU time computation, skipping it. Likely invalid CPU usage result\"\n   87 |                     );\n   88 |                     continue;\n   89 |                 }\n   90 |             }\n   91 | \n   92 |             cpu.inner.cpu_usage = cp_times.compute_cpu_usage();\n   93 | \n   94 |             let new_cp_times = cp_times.get_new();\n   95 |             global_cp_times[ffi::CP_USER] += new_cp_times[ffi::CP_USER];\n   96 |             global_cp_times[ffi::CP_NICE] += new_cp_times[ffi::CP_NICE];\n   97 |             global_cp_times[ffi::CP_SYS] += new_cp_times[ffi::CP_SYS];\n   98 |             global_cp_times[ffi::CP_INTR] += new_cp_times[ffi::CP_INTR];\n   99 |             global_cp_times[ffi::CP_IDLE] += new_cp_times[ffi::CP_IDLE];\n  100 |         }\n  101 |         for global_cp_time in global_cp_times {\n  102 |             *global_cp_time /= self.cpus.len() as u64;\n  103 |         }\n  104 |         self.global_cpu_usage = self.global_cp_times.compute_cpu_usage();","lines":33,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/bsd/netbsd/cpu.rs#L72-L104"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`open_files` calls `proc_pidinfo(PROC_PIDLISTFDS, 0, NULL, 0)` to get a size, allocates that many\nbytes, then calls again. There is a TOCTOU window: between the two calls the process can open more\nfds, so the second call can return *more* bytes than the buffer holds. `proc_pidinfo` clamps to the\nprovided buffer size so it will not overflow, but the returned count is then silently truncated,\nunder-reporting open files without any indication. Conversely the divisor\n`size_of::<libc::proc_fdinfo>()` assumes the returned byte count is an exact multiple.","fix":"Over-allocate (size + a margin) or loop until the returned size fits the buffer, and document that the count is a best-effort snapshot.","locations":[{"ref":"src/unix/apple/macos/process.rs:265-299","code":"  265 |     pub(crate) fn open_files(&self) -> Option<usize> {\n  266 |         let buffer_size_bytes = unsafe {\n  267 |             libc::proc_pidinfo(\n  268 |                 self.pid.0,\n  269 |                 libc::PROC_PIDLISTFDS,\n  270 |                 0,\n  271 |                 std::ptr::null_mut(),\n  272 |                 0,\n  273 |             )\n  274 |         };\n  275 | \n  276 |         if buffer_size_bytes < 0 {\n  277 |             sysinfo_debug!(\"proc_pidinfo failed\");\n  278 |             return None;\n  279 |         }\n  280 | \n  281 |         let mut buffer = vec![0u8; buffer_size_bytes as usize];\n  282 | \n  283 |         let buffer_filled_bytes = unsafe {\n  284 |             libc::proc_pidinfo(\n  285 |                 self.pid.0,\n  286 |                 libc::PROC_PIDLISTFDS,\n  287 |                 0,\n  288 |                 buffer.as_mut_ptr() as *mut std::ffi::c_void,\n  289 |                 buffer_size_bytes,\n  290 |             )\n  291 |         };\n  292 | \n  293 |         if buffer_filled_bytes < 0 {\n  294 |             sysinfo_debug!(\"proc_pidinfo failed\");\n  295 |             return None;\n  296 |         }\n  297 | \n  298 |         Some(buffer_filled_bytes as usize / std::mem::size_of::<libc::proc_fdinfo>())\n  299 |     }","lines":35,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/apple/macos/process.rs#L265-L299"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `update_networks`, the second `sysctl` call to fill `mib_data` is given the *address of a\ntemporary* `&mut size_of::<ifmibdata>()` as the size in/out parameter. This is correct as input, but\nbecause it is a throwaway temporary the *returned* size is discarded and never validated. More\nimportantly, `mib_data.assume_init()` is called whenever `ret >= 0`, but a successful `sysctl` that\nreturns fewer bytes than `size_of::<ifmibdata>()` would leave part of the struct uninitialized while\nstill being treated as fully initialized. The `ifmibdata` layout is also a local hand-rolled `#[repr(C)]`\nduplicate (FIXME comment) that must exactly match the kernel struct or every field read is wrong.","fix":"Capture the returned length in a real variable and verify it equals `size_of::<ifmibdata>()` before calling `assume_init`; drop the hand-rolled struct once the libc definition lands.","locations":[{"ref":"src/unix/apple/network.rs:177-235","code":"  177 |                     let mut mib_data: MaybeUninit<ifmibdata> = MaybeUninit::uninit();\n  178 | \n  179 |                     mib2[4] = (*if2m).ifm_index as _;\n  180 |                     let ret = sysctl(\n  181 |                         mib2.as_mut_ptr(),\n  182 |                         mib2.len() as _,\n  183 |                         mib_data.as_mut_ptr() as *mut _,\n  184 |                         &mut size_of::<ifmibdata>(),\n  185 |                         null_mut(),\n  186 |                         0,\n  187 |                     );\n  188 | \n  189 |                     match self.interfaces.entry(name) {\n  190 |                         hash_map::Entry::Occupied(mut e) => {\n  191 |                             let interface = e.get_mut();\n  192 |                             let interface = &mut interface.inner;\n  193 | \n  194 |                             if ret < 0 {\n  195 |                                 sysinfo_debug!(\n  196 |                                     \"Cannot get network interface data usage: sysctl failed: {ret}\"\n  197 |                                 );\n  198 |                             } else {\n  199 |                                 let data = mib_data.assume_init();\n  200 |                                 update_network_data(interface, &data.ifmd_data);\n  201 |                             }\n  202 |                             interface.mtu = mtu;\n  203 |                             interface.operational_state = operational_state;\n  204 |                             interface.updated = true;\n  205 |                         }\n  206 |                         hash_map::Entry::Vacant(e) => {\n  207 |                             let current_in;\n  208 |                             let current_out;\n  209 |                             let packets_in;\n  210 |                             let packets_out;\n  211 |                             let errors_in;\n  212 |                             let errors_out;\n  213 | \n  214 |                             if ret < 0 {\n  215 |                                 sysinfo_debug!(\n  216 |                                     \"Cannot get network interface data usage: sysctl failed: {ret}\"\n  217 |                                 );\n  218 | \n  219 |                                 current_in = 0;\n  220 |                                 current_out = 0;\n  221 |                                 packets_in = 0;\n  222 |                                 packets_out = 0;\n  223 |                                 errors_in = 0;\n  224 |                                 errors_out = 0;\n  225 |                             } else {\n  226 |                                 let data = mib_data.assume_init();\n  227 |                                 let data = data.ifmd_data;\n  228 | \n  229 |                                 current_in = data.ifi_ibytes;\n  230 |                                 current_out = data.ifi_obytes;\n  231 |                                 packets_in = data.ifi_ipackets;\n  232 |                                 packets_out = data.ifi_opackets;\n  233 |                                 errors_in = data.ifi_ierrors;\n  234 |                                 errors_out = data.ifi_oerrors;\n  235 |                             }","lines":59,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/apple/network.rs#L177-L235"},{"ref":"src/unix/apple/network.rs:18-28","code":"   18 | #[repr(C)]\n   19 | struct ifmibdata {\n   20 |     ifmd_name: [c_char; IFNAMSIZ],\n   21 |     ifmd_pcount: c_uint,\n   22 |     ifmd_flags: c_uint,\n   23 |     ifmd_snd_len: c_uint,\n   24 |     ifmd_snd_maxlen: c_uint,\n   25 |     ifmd_snd_drops: c_uint,\n   26 |     ifmd_filler: [c_uint; 4],\n   27 |     ifmd_data: if_data64,\n   28 | }","lines":11,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/apple/network.rs#L18-L28"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`refresh_processes_specifics` ignores the `ProcessesToUpdate::Some` filter when counting updates,\nand more importantly it calls `update_process(..., check_if_alive = false)` for every pid even when\nthe caller passed an explicit list of pids (`ProcessesToUpdate::Some`). With `check_if_alive = false`\na dead pid that is passed explicitly will not be detected as dead (see `check_if_pid_is_alive`,\nwhich short-circuits to `true` when `check_if_alive` is false), so stale/dead processes requested by\npid can be kept alive in `process_list`. The `false` is only correct when iterating the full\n`proc_listallpids` result.","fix":"Pass `check_if_alive = matches!(processes_to_update, ProcessesToUpdate::Some(_))` (true when refreshing an explicit pid list) so explicitly-requested dead pids are detected and removed.","locations":[{"ref":"src/unix/apple/system.rs:290-308","code":"  290 |                 into_iter(pids)\n  291 |                     .flat_map(|pid| {\n  292 |                         if !filter_callback(pid, filter) {\n  293 |                             return None;\n  294 |                         }\n  295 |                         nb_updated.fetch_add(1, Ordering::Relaxed);\n  296 |                         update_process(\n  297 |                             wrap,\n  298 |                             pid,\n  299 |                             time_interval,\n  300 |                             now,\n  301 |                             refresh_kind,\n  302 |                             false,\n  303 |                             timebase_to_ms,\n  304 |                         )\n  305 |                         .unwrap_or_default()\n  306 |                     })\n  307 |                     .collect()\n  308 |             };","lines":19,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/apple/system.rs#L290-L308"},{"ref":"src/unix/apple/macos/process.rs:398-415","code":"  398 | #[inline]\n  399 | fn check_if_pid_is_alive(pid: Pid, check_if_alive: bool) -> bool {\n  400 |     // In case we are iterating all pids we got from `proc_listallpids`, then\n  401 |     // there is no point checking if the process is alive since it was returned\n  402 |     // from this function.\n  403 |     if !check_if_alive {\n  404 |         return true;\n  405 |     }\n  406 |     unsafe {\n  407 |         if kill(pid.0, 0) == 0 {\n  408 |             return true;\n  409 |         }\n  410 |         // `kill` failed but it might not be because the process is dead.\n  411 |         let errno = crate::unix::libc_errno();\n  412 |         // If errno is equal to ESCHR, it means the process is dead.\n  413 |         !errno.is_null() && *errno != libc::ESRCH\n  414 |     }\n  415 | }","lines":18,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/apple/macos/process.rs#L398-L415"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"FreeBSD per-process CPU usage is `(100 * kproc.ki_pctcpu) as f32 / fscale`. `ki_pctcpu` is a `u32`/fixed-point value; `100 * ki_pctcpu` is computed in integer space and can overflow `u32` (ki_pctcpu fixed-point can be large), wrapping before the cast to f32. The NetBSD equivalent `(100 * kproc.p_pctcpu) as f32 / system_info.fscale` has the same integer-overflow-before-cast issue.","fix":"Cast to f32 (or u64) before multiplying: `(kproc.ki_pctcpu as f32) * 100.0 / fscale`.","locations":[{"ref":"src/unix/bsd/freebsd/process.rs:155-159","code":"  155 |     let cpu_usage = if refresh_kind.cpu() {\n  156 |         Some((100 * kproc.ki_pctcpu) as f32 / fscale)\n  157 |     } else {\n  158 |         None\n  159 |     };","lines":5,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/bsd/freebsd/process.rs#L155-L159"},{"ref":"src/unix/bsd/netbsd/process.rs:162-164","code":"  162 |     if refresh_kind.cpu() {\n  163 |         proc_.cpu_usage = (100 * kproc.p_pctcpu) as f32 / system_info.fscale;\n  164 |     }","lines":3,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/bsd/netbsd/process.rs#L162-L164"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"NetBSD maps the LWP state `LSRUN` (runnable / on a run queue) to `ProcessStatus::Suspended`. `LSRUN` means the thread is ready to run, not suspended; the correct mapping is `ProcessStatus::Run` (or a 'Runnable' status). `LSSUSPENDED` (value 8) is the actually-suspended state and is not handled at all.","fix":"Map `LSONPROC`/`LSRUN` to `ProcessStatus::Run` and add an `LSSUSPENDED => ProcessStatus::Suspended` arm.","locations":[{"ref":"src/unix/bsd/netbsd/process.rs:91-97","code":"   91 |             match entry.l_stat {\n   92 |                 ffi::LSONPROC => return Some(ProcessStatus::Run),\n   93 |                 ffi::LSRUN => return Some(ProcessStatus::Suspended),\n   94 |                 ffi::LSSLEEP => return Some(ProcessStatus::Sleep),\n   95 |                 ffi::LSSTOP => return Some(ProcessStatus::Stop),\n   96 |                 _ => {}\n   97 |             }","lines":7,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/bsd/netbsd/process.rs#L91-L97"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`ThermalSensorType::from` has an off-by-one mapping that contradicts both the kernel hwmon API\nand the doc comments right above it. The hwmon `tempN_type` values are documented (and the enum\ndoc comments at lines 57-66 state): 1 = CPU embedded diode, 2 = 3904 transistor, 3 = thermal diode,\n4 = thermistor, 5 = AMD AMDSI, 6 = Intel PECI. But the match arms map `0 => CPUEmbeddedDiode`,\n`1 => Transistor3904`, leaving 3,4,5,6 correct and value 2 (3904 transistor) falling into\n`Unknown(2)`. So a CPU embedded diode (value 1) is misreported as a 3904 transistor, value 0 (never\nemitted by the kernel) is misreported as CPU diode, and value 2 is lost. This is a copy-paste/\noff-by-one slip between the doc table (1-indexed) and the match (0-indexed).","fix":"Shift the arms to match the documented 1-based values: `1 => CPUEmbeddedDiode,\n2 => Transistor3904, 3 => ThermalDiode, 4 => Thermistor, 5 => AMDAMDSI, 6 => IntelPECI,\nn => Unknown(n)`. (`sensor_type` is currently never read by any public API, which is why this has\ngone unnoticed - see the dead-code note - but the mapping is still wrong.)","locations":[{"ref":"src/unix/linux/component.rs:199-211","code":"  199 | impl From<u8> for ThermalSensorType {\n  200 |     fn from(input: u8) -> Self {\n  201 |         match input {\n  202 |             0 => Self::CPUEmbeddedDiode,\n  203 |             1 => Self::Transistor3904,\n  204 |             3 => Self::ThermalDiode,\n  205 |             4 => Self::Thermistor,\n  206 |             5 => Self::AMDAMDSI,\n  207 |             6 => Self::IntelPECI,\n  208 |             n => Self::Unknown(n),\n  209 |         }\n  210 |     }\n  211 | }","lines":13,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/linux/component.rs#L199-L211"},{"ref":"src/unix/linux/component.rs:58-67","code":"   58 |     /// Values integer:\n   59 |     ///\n   60 |     /// - 1: CPU embedded diode\n   61 |     /// - 2: 3904 transistor\n   62 |     /// - 3: thermal diode\n   63 |     /// - 4: thermistor\n   64 |     /// - 5: AMD AMDSI\n   65 |     /// - 6: Intel PECI\n   66 |     ///\n   67 |     /// Not all types are supported by all chips.","lines":10,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/linux/component.rs#L58-L67"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `get_process_params`, the 64-bit branch (`if pwow32info.is_null()`) does not `return` at\nits end. After handling a 64-bit target it falls through into the code that handles a 32-bit\nWOW64 process, which then calls `ReadProcessMemory(handle, pwow32info, ...)` with\n`pwow32info == null` (since the target is 64-bit). The comment \"target is a 32 bit process in\nwow64 mode\" at line 870 is meant to gate that block but is not inside any `else`. The result\nis a wasted/failed `ReadProcessMemory` and a misleading \"Unable to read PEB32\" debug log on\nevery 64-bit process refresh. The two branches should be mutually exclusive (if/else).","fix":"Wrap the 32-bit WOW64 handling (lines 870-915) in an `else` of the `if pwow32info.is_null()` block, or add a `return;` at the end of the 64-bit branch (after line 868).","locations":[{"ref":"src/windows/process.rs:880-971","code":"  880 |         if pwow32info.is_null() {\n  881 |             // target is a 64 bit process\n  882 | \n  883 |             let Some(pinfo) = pinfo else { return };\n  884 | \n  885 |             let mut peb = MaybeUninit::<PEB>::uninit();\n  886 |             if ReadProcessMemory(\n  887 |                 handle,\n  888 |                 pinfo.PebBaseAddress.cast(),\n  889 |                 peb.as_mut_ptr().cast(),\n  890 |                 size_of::<PEB>(),\n  891 |                 None,\n  892 |             )\n  893 |             .is_err()\n  894 |             {\n  895 |                 sysinfo_debug!(\"Unable to read process PEB\");\n  896 |                 return;\n  897 |             }\n  898 | \n  899 |             let peb = peb.assume_init();\n  900 | \n  901 |             let mut proc_params = MaybeUninit::<RTL_USER_PROCESS_PARAMETERS>::uninit();\n  902 |             if ReadProcessMemory(\n  903 |                 handle,\n  904 |                 peb.ProcessParameters.cast(),\n  905 |                 proc_params.as_mut_ptr().cast(),\n  906 |                 size_of::<RTL_USER_PROCESS_PARAMETERS>(),\n  907 |                 None,\n  908 |             )\n  909 |             .is_err()\n  910 |             {\n  911 |                 sysinfo_debug!(\"Unable to read process parameters\");\n  912 |                 return;\n  913 |             }\n  914 | \n  915 |             let proc_params = proc_params.assume_init();\n  916 |             get_cmd_line(&proc_params, handle, refresh_kind, &mut process.cmd);\n  917 |             get_proc_env(&proc_params, handle, refresh_kind, &mut process.environ);\n  918 |             get_cwd_and_root(\n  919 |                 &proc_params,\n  920 |                 handle,\n  921 |                 refresh_kind,\n  922 |                 &mut process.cwd,\n  923 |                 &mut process.root,\n  924 |             );\n  925 |         }\n  926 |         // target is a 32 bit process in wow64 mode\n  927 | \n  928 |         if !has_anything_to_update {\n  929 |             return;\n  930 |         }\n  931 | \n  932 |         let mut peb32 = MaybeUninit::<PEB32>::uninit();\n  933 |         if ReadProcessMemory(\n  934 |             handle,\n  935 |             pwow32info,\n  936 |             peb32.as_mut_ptr().cast(),\n  937 |             size_of::<PEB32>(),\n  938 |             None,\n  939 |         )\n  940 |         .is_err()\n  941 |         {\n  942 |             sysinfo_debug!(\"Unable to read PEB32\");\n  943 |             return;\n  944 |         }\n  945 |         let peb32 = peb32.assume_init();\n  946 | \n  947 |         let mut proc_params = MaybeUninit::<RTL_USER_PROCESS_PARAMETERS32>::uninit();\n  948 |         if ReadProcessMemory(\n  949 |             handle,\n  950 |             peb32.ProcessParameters as *mut _,\n  951 |             proc_params.as_mut_ptr().cast(),\n  952 |             size_of::<RTL_USER_PROCESS_PARAMETERS32>(),\n  953 |             None,\n  954 |         )\n  955 |         .is_err()\n  956 |         {\n  957 |             sysinfo_debug!(\"Unable to read 32 bit process parameters\");\n  958 |             return;\n  959 |         }\n  960 | \n  961 |         let proc_params = proc_params.assume_init();\n  962 |         get_cmd_line(&proc_params, handle, refresh_kind, &mut process.cmd);\n  963 |         get_proc_env(&proc_params, handle, refresh_kind, &mut process.environ);\n  964 |         get_cwd_and_root(\n  965 |             &proc_params,\n  966 |             handle,\n  967 |             refresh_kind,\n  968 |             &mut process.cwd,\n  969 |             &mut process.root,\n  970 |         );\n  971 |     }","lines":92,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/windows/process.rs#L880-L971"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`is_proc_running` treats a process as running iff its exit code equals `STILL_ACTIVE` (259).\nA process that legitimately exits with code 259 is therefore reported as still running. This\ndirectly affects `ProcessInner::wait`, which loops `while is_proc_running(handle)` sleeping\n10ms forever for such a process (an effective hang). This is a well-known Win32 pitfall;\n`GetExitCodeProcess` alone cannot distinguish \"running\" from \"exited with 259\".","fix":"Use `WaitForSingleObject(handle, 0)` (returns WAIT_TIMEOUT if still running, WAIT_OBJECT_0 if signaled) to determine liveness, falling back to GetExitCodeProcess only for the code.","locations":[{"ref":"src/windows/system.rs:510-514","code":"  510 | pub(crate) fn is_proc_running(handle: HANDLE) -> bool {\n  511 |     let mut exit_code = 0;\n  512 |     unsafe { GetExitCodeProcess(handle, &mut exit_code) }.is_ok()\n  513 |         && exit_code == STILL_ACTIVE.0 as u32\n  514 | }","lines":5,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/windows/system.rs#L510-L514"},{"ref":"src/windows/process.rs:496-521","code":"  496 |     pub(crate) fn wait(&self) -> Option<ExitStatus> {\n  497 |         if let Some(handle) = self.get_handle() {\n  498 |             while is_proc_running(handle) {\n  499 |                 if get_start_time(handle) != self.start_time() {\n  500 |                     // PID owner changed so the previous process was finished!\n  501 |                     sysinfo_debug!(\"PID owner changed so cannot get old process exit status\");\n  502 |                     return None;\n  503 |                 }\n  504 |                 std::thread::sleep(std::time::Duration::from_millis(10));\n  505 |             }\n  506 |             let mut exit_status = 0;\n  507 |             unsafe {\n  508 |                 match GetExitCodeProcess(handle, &mut exit_status) {\n  509 |                     Ok(_) => Some(ExitStatus::from_raw(exit_status)),\n  510 |                     Err(_error) => {\n  511 |                         sysinfo_debug!(\"failed to retrieve process exit status: {_error:?}\");\n  512 |                         None\n  513 |                     }\n  514 |                 }\n  515 |             }\n  516 |         } else {\n  517 |             // In this case, we can't do anything so we just return.\n  518 |             sysinfo_debug!(\"can't wait on this process so returning\");\n  519 |             None\n  520 |         }\n  521 |     }","lines":26,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/windows/process.rs#L496-L521"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`MacAddrFromStrError`'s `InvalidAddrFormat` message string (\"invalid address\nformat\") is generic, while `IpNetworkFromStrError::InvalidAddrFormat` prints\n\"invalid address format, should `[IP address]/[number]`\" — note the malformed\nphrasing (missing \"be\": \"should `[IP address]/[number]`\"). Minor user-facing\ngrammar issue in the error `Display`.","fix":"Reword to \"invalid address format, should be `[IP address]/[number]`\".","locations":[{"ref":"src/common/network.rs:583-592","code":"  583 | impl core::fmt::Display for IpNetworkFromStrError {\n  584 |     fn fmt(&self, f: &mut core::fmt::Formatter<'_>) -> core::fmt::Result {\n  585 |         match self {\n  586 |             Self::PrefixError(error) => write!(f, \"prefix is not an integer: {error}\"),\n  587 |             Self::AddrParseError(error) => write!(f, \"failed to parse IP address: {error}\"),\n  588 |             Self::InvalidAddrFormat => {\n  589 |                 f.write_str(\"invalid address format, should `[IP address]/[number]`\")\n  590 |             }\n  591 |         }\n  592 |     }","lines":10,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/common/network.rs#L583-L592"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`get_temperature_inner` (x86) checks `val.data_size > 0` and a `sp78` type match, but `val.bytes` is a\n`[i8; 32]` and the sp78 decode reads `val.bytes[0]` and `val.bytes[1]` unconditionally. If a key\nreports `data_type == \"sp78\"` but `data_size < 2`, the decode reads bytes that were not populated by\nthe SMC for this key (they are whatever `read_key`'s 32-byte memcpy copied). The size is validated as\n`> 0` but not `>= 2`.","fix":"Require `val.data_size >= 2` before decoding the sp78 value.","locations":[{"ref":"src/unix/apple/macos/component/x86.rs:278-295","code":"  278 | fn get_temperature_inner(\n  279 |     con: io_connect_t,\n  280 |     input_structure: &ffi::KeyData_t,\n  281 |     original_val: &ffi::Val_t,\n  282 | ) -> Option<f32> {\n  283 |     unsafe {\n  284 |         if let Ok(val) = read_key(con, input_structure, (*original_val).clone()) {\n  285 |             if val.data_size > 0\n  286 |                 && libc::strcmp(val.data_type.as_ptr(), c\"sp78\".as_ptr() as *const i8) == 0\n  287 |             {\n  288 |                 // convert sp78 value to temperature\n  289 |                 let x = (i32::from(val.bytes[0]) << 6) + (i32::from(val.bytes[1]) >> 2);\n  290 |                 return Some(x as f32 / 64f32);\n  291 |             }\n  292 |         }\n  293 |     }\n  294 |     None\n  295 | }","lines":18,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/apple/macos/component/x86.rs#L278-L295"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`get_io_platform_property` for the CFData branch does `CStr::from_bytes_with_nul(&s.to_vec())`. This\nrequires the CFData to contain exactly one trailing NUL and no interior NULs; many IOKit data\nproperties are *not* NUL-terminated, in which case `from_bytes_with_nul` fails and the property is\nsilently dropped (`None`). The string branch handles CFString correctly, but data-backed properties\n(common for board-id, etc.) will frequently return `None`.","fix":"Trim a single trailing NUL if present and build the string from the remaining bytes (e.g. `from_utf8_lossy` over the slice without the trailing NUL) instead of requiring `from_bytes_with_nul`.","locations":[{"ref":"src/unix/apple/macos/system.rs:194-200","code":"  194 |         properties.downcast::<CFData>().ok().and_then(|s| {\n  195 |             CStr::from_bytes_with_nul(&s.to_vec())\n  196 |                 .ok()\n  197 |                 .and_then(|cstr| cstr.to_str().ok())\n  198 |                 .map(str::to_owned)\n  199 |         })\n  200 |     }","lines":7,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/apple/macos/system.rs#L194-L200"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`from_flags` maps an interface that is `IFF_RUNNING` but not `IFF_UP` to `Dormant`, and anything not\n`IFF_RUNNING` to `Down`. On macOS an interface that is administratively up (`IFF_UP`) but whose link\nis not running (`!IFF_RUNNING`, e.g. cable unplugged) is reported as `Down`, while the inverted\ncombination (`IFF_RUNNING && !IFF_UP`) -- which essentially never occurs -- maps to `Dormant`. The\nown comment (`are these the right flags?`) flags the uncertainty; the more meaningful \"interface up\nbut no carrier\" state is collapsed into `Down`.","fix":"Reconsider the mapping: treat `IFF_UP && !IFF_RUNNING` (no carrier) explicitly, and verify against the BSD implementation referenced in the comment.","locations":[{"ref":"src/unix/apple/network.rs:266-279","code":"  266 | impl InterfaceOperationalState {\n  267 |     fn from_flags(flags: core::ffi::c_int) -> Self {\n  268 |         // based on the bsd version in src\\unix\\bsd\\network_common.rs\n  269 |         if (flags & IFF_RUNNING) != 0 {\n  270 |             if (flags & IFF_UP) != 0 {\n  271 |                 InterfaceOperationalState::Up\n  272 |             } else {\n  273 |                 InterfaceOperationalState::Dormant\n  274 |             }\n  275 |         } else {\n  276 |             InterfaceOperationalState::Down\n  277 |         }\n  278 |     }\n  279 | }","lines":14,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/apple/network.rs#L266-L279"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`os_version` resizes the buffer with `buf.resize(pos, 0)` where `pos` is the index of the first NUL,\nwith the comment \"Shrink buffer to terminate the null bytes\". The comment is misleading: `resize(pos,\n0)` truncates to length `pos`, dropping the NUL and everything after it (correct), but the `, 0` fill\nvalue is dead (only used when growing, which never happens here). Same pattern is duplicated in\n`get_system_info`. Minor: the fill argument is meaningless and the comment misstates the operation.","fix":"Use `buf.truncate(pos)` and correct the comment.","locations":[{"ref":"src/unix/apple/system.rs:488-491","code":"  488 |                     if let Some(pos) = buf.iter().position(|x| *x == 0) {\n  489 |                         // Shrink buffer to terminate the null bytes\n  490 |                         buf.resize(pos, 0);\n  491 |                     }","lines":4,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/apple/system.rs#L488-L491"},{"ref":"src/unix/apple/system.rs:596-599","code":"  596 |                 if let Some(pos) = buf.iter().position(|x| *x == 0) {\n  597 |                     // Shrink buffer to terminate the null bytes\n  598 |                     buf.resize(pos, 0);\n  599 |                 }","lines":4,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/apple/system.rs#L596-L599"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"On FreeBSD, ZFS dataset disks are named by `f_mntfromname` (the dataset name) but the duplicate-detection in `get_all_list` matches an existing disk by `name` AND a prefix comparison of `file_system` bytes against `fs_type` using `zip(...).all(...)`. The `zip().all()` only compares overlapping bytes, so two filesystems whose type names share a prefix (e.g. an entry whose stored `file_system` is empty) compare as equal, potentially merging distinct disks. This mirrors the `same_name` prefix bug on NetBSD.","fix":"Compare `file_system` for full equality (`d.inner.file_system.as_encoded_bytes() == &fs_type[..]`) instead of a prefix `zip().all()`.","locations":[{"ref":"src/unix/bsd/freebsd/disk.rs:405-413","code":"  405 |         if let Some(disk) = container.iter_mut().find(|d| {\n  406 |             d.inner.name == name\n  407 |                 && d.inner\n  408 |                     .file_system\n  409 |                     .as_encoded_bytes()\n  410 |                     .iter()\n  411 |                     .zip(fs_type.iter())\n  412 |                     .all(|(a, b)| a == b)\n  413 |         }) {","lines":9,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/bsd/freebsd/disk.rs#L405-L413"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"On FreeBSD, removable-device detection compares the *filesystem type* against `b\"USB\"`/`b\"usb\"` and against `fs_type.starts_with(b\"/dev/cd\")`. A filesystem type is never `USB`/`usb` nor a `/dev/cd...` path (that would be a device path, not an `f_fstypename`), so `is_removable` is effectively always false. The NetBSD backend copies the same broken check.","fix":"Test the device source (`f_mntfromname`, e.g. `/dev/cd*`, `/dev/da*` USB) rather than the filesystem-type string, or drop the dead branch.","locations":[{"ref":"src/unix/bsd/freebsd/disk.rs:421-426","code":"  421 |             let is_removable = if refresh_kind.storage() {\n  422 |                 [b\"USB\", b\"usb\"].iter().any(|b| *b == &fs_type[..])\n  423 |                     || fs_type.starts_with(b\"/dev/cd\")\n  424 |             } else {\n  425 |                 false\n  426 |             };","lines":6,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/bsd/freebsd/disk.rs#L421-L426"},{"ref":"src/unix/bsd/netbsd/disk.rs:382-387","code":"  382 |             let is_removable = if refresh_kind.storage() {\n  383 |                 [b\"USB\", b\"usb\"].iter().any(|b| *b == &fs_type[..])\n  384 |                     || fs_type.starts_with(b\"/dev/cd\")\n  385 |             } else {\n  386 |                 false\n  387 |             };","lines":6,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/bsd/netbsd/disk.rs#L382-L387"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"FreeBSD `available_memory()` returns `self.mem_free` (the same value as `free_memory()`). On most platforms 'available' memory (reclaimable cache + free) is larger than strictly 'free' memory; here they are identical, so `available_memory` understates what is actually reclaimable. NetBSD has the same `available_memory == free_memory` aliasing.","fix":"Compute available memory including reclaimable cache, or document that on BSD it equals free memory.","locations":[{"ref":"src/unix/bsd/freebsd/system.rs:116-122","code":"  116 |     pub(crate) fn free_memory(&self) -> u64 {\n  117 |         self.mem_free\n  118 |     }\n  119 | \n  120 |     pub(crate) fn available_memory(&self) -> u64 {\n  121 |         self.mem_free\n  122 |     }","lines":7,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/bsd/freebsd/system.rs#L116-L122"},{"ref":"src/unix/bsd/netbsd/system.rs:129-135","code":"  129 |     pub(crate) fn free_memory(&self) -> u64 {\n  130 |         self.mem_free\n  131 |     }\n  132 | \n  133 |     pub(crate) fn available_memory(&self) -> u64 {\n  134 |         self.mem_free\n  135 |     }","lines":7,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/bsd/netbsd/system.rs#L129-L135"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"NetBSD disk `refresh_disk_io` builds the result Vec with `Vec::with_capacity(nb_drives)` and writes into it via a raw pointer, then `set_len(nb_drives)`. If the number of drives grows between the size-probe sysctl and the data sysctl, the kernel could report more drives than the buffer holds; because `size` is reused (capacity-sized) the kernel will truncate, but `nb_drives = size / IO_SYSCTL_SIZE` is then recomputed from the (possibly clamped) returned size, so this happens to be safe only because the kernel clamps to the passed buffer size. The pattern is fragile and undocumented (relies on `set_len` never exceeding capacity).","fix":"Assert/clamp `nb_drives` to the allocated capacity before `set_len`, and add a comment that the second sysctl clamps to the buffer size.","locations":[{"ref":"src/unix/bsd/netbsd/disk.rs:242-275","code":"  242 | unsafe fn refresh_disk_io<T: GetValues>(disks: &mut [T]) {\n  243 |     const IO_SYSCTL_SIZE: usize = std::mem::size_of::<ffi::io_sysctl>();\n  244 |     let mib = &[ffi::CTL_HW, ffi::HW_IOSTATS, IO_SYSCTL_SIZE as libc::c_int];\n  245 |     let mut size: libc::size_t = 0;\n  246 | \n  247 |     unsafe {\n  248 |         if !super::utils::get_sysctl_raw(mib, null_mut(), &mut size) {\n  249 |             sysinfo_debug!(\"failed to get iostats info\");\n  250 |             return;\n  251 |         }\n  252 |         let mut nb_drives = size as usize / IO_SYSCTL_SIZE;\n  253 |         if nb_drives < 1 {\n  254 |             sysinfo_debug!(\"no drive\");\n  255 |             return;\n  256 |         }\n  257 |         let mut drives: Vec<ffi::io_sysctl> = Vec::with_capacity(nb_drives);\n  258 |         if !super::utils::get_sysctl_raw(mib, drives.as_mut_ptr() as *mut _, &mut size) {\n  259 |             sysinfo_debug!(\"failed to get iostats drives\");\n  260 |             return;\n  261 |         }\n  262 |         nb_drives = size as usize / IO_SYSCTL_SIZE;\n  263 |         drives.set_len(nb_drives);\n  264 | \n  265 |         for drive in drives {\n  266 |             if let Some(disk) = disks\n  267 |                 .iter_mut()\n  268 |                 .find(|disk| same_name(disk.dev_id(), &drive.name))\n  269 |             {\n  270 |                 disk.update_old();\n  271 |                 *disk.get_read() = drive.rbytes;\n  272 |                 *disk.get_written() = drive.wbytes;\n  273 |             }\n  274 |         }\n  275 |     }","lines":34,"link":"https://github.com/GuillaumeGomez/sysinfo/blob/1ae43394eb6f38d5650a51b31f2582f26a8b53b8/src/unix/bsd/netbsd/disk.rs#L242-L275"}]},
