<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"Infinite loop / denial-of-service on crafted AAC (ADTS) input.\n\nIn `read_from`, after the first frame is found, the property-reading loop seeks to `first_frame_end` and\nrepeatedly calls `find_next_frame`, advancing by `first_header.len` each iteration. `ADTSHeader::read` never\nrejects a frame whose 13-bit `Frame length` field (`len`) is 0, and `read_properties`/`read_from` never\nreject a 0-length frame either. When `len == 0`:\n  - `find_next_frame` returns `frame_end = first_adts_frame_start_absolute + 0` (same position).\n  - `cmp_header` is called with `first_header_len = 0`; it seeks `0.saturating_sub(header_len) == 0`\n    (no movement), re-reads the identical 4 bytes, and returns `HeaderCmpResult::Equal`.\nThe outer `while let Some(...)` loop therefore seeks back to the exact same offset every iteration and never\nterminates. A single malicious ADTS frame with a zero length field hangs the parser forever.","fix":"Reject ADTS frames whose `len` is less than the header size (7, or 9 with CRC) in `ADTSHeader::read`\n(treat as not a valid frame / return `Ok(None)` or bail). Additionally, in the loop in `read_from`, guard\nthat each `frame_end` strictly increases (e.g. break if `frame_end <= previous_position`) so progress is\nalways made even on malformed input.","locations":[{"ref":"lofty/src/aac/read.rs:139-148","code":"  139 | \t\treader.seek(SeekFrom::Start(first_frame_end))?;\n  140 | \n  141 | \t\tlet mut frame_count = 1;\n  142 | \n  143 | \t\twhile let Some((header, frame_end)) = find_next_frame(reader, parse_mode)? {\n  144 | \t\t\tfirst_frame_header.bitrate += header.bitrate;\n  145 | \t\t\tframe_count += 1u32;\n  146 | \n  147 | \t\t\treader.seek(SeekFrom::Start(frame_end))?;\n  148 | \t\t}","lines":10,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/aac/read.rs#L139-L148"},{"ref":"lofty/src/aac/header.rs:107-108","code":"  107 | \t\tlet len =\n  108 | \t\t\t(u16::from(byte4 & 0b11) << 11) | (u16::from(byte5) << 3) | (u16::from(byte6) >> 5);","lines":2,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/aac/header.rs#L107-L108"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`flac_properties` computes `dfla.len - 12` where `dfla` is an atom whose length is only guaranteed\nby `AtomInfo::read` to be >= 8 (ATOM_HEADER_LEN), not >= 12. A `dfLa` atom with length 8, 9, 10 or\n11 makes `dfla.len - 12` underflow, panicking in debug builds and wrapping to a huge u64 in release\nbuilds (the subsequent `< 18` comparison then passes the wrong branch). Reachable from a crafted\nFLAC-in-MP4 stsd entry.","fix":"Check `dfla.len < 30` (12 header/version + 18 STREAMINFO) up front and bail early, or use `dfla.len.checked_sub(12)`.","locations":[{"ref":"lofty/src/mp4/properties.rs:1004","code":" 1004 | \tif dfla.len - 12 < 18 {","lines":1,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/mp4/properties.rs#L1004"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"Integer divide-by-zero panic on malformed SV7 MPC input. In `MpcSv7Properties::read`, when\n`true_gapless` is set and `frame_count == 1` with `last_frame_length == 0`, `total_samples`\nbecomes `(1 * 1152) - (1152 - 0) = 0`. The bitrate is then computed as\n`(stream_length * 8 * sample_freq) / (total_samples * 1000)`, i.e. a division by zero, which\npanics in both debug and release builds. The early-return guards only check `sample_freq == 0`\nand `frame_count == 0`, never `total_samples == 0`. All of these inputs are attacker-controlled\nfields read directly from the file header.","fix":"After computing `total_samples`, bail or warn-and-return early when `total_samples == 0` (mirror the `total_samples == 0` guard already present in sv8/properties.rs:282-288) before performing the division.","locations":[{"ref":"lofty/src/musepack/sv7/properties.rs:374-384","code":"  374 | \t\tlet total_samples;\n  375 | \t\tif properties.true_gapless {\n  376 | \t\t\ttotal_samples = (u64::from(properties.frame_count) * MPC_FRAME_LENGTH)\n  377 | \t\t\t\t- (MPC_FRAME_LENGTH - u64::from(properties.last_frame_length));\n  378 | \t\t} else {\n  379 | \t\t\ttotal_samples =\n  380 | \t\t\t\t(u64::from(properties.frame_count) * MPC_FRAME_LENGTH) - MPC_DECODER_SYNTH_DELAY;\n  381 | \t\t}\n  382 | \n  383 | \t\tproperties.average_bitrate = ((stream_length * 8 * u64::from(properties.sample_freq))\n  384 | \t\t\t/ (total_samples * 1000)) as u32;","lines":11,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/musepack/sv7/properties.rs#L374-L384"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"Divide-by-zero panic when calculating Opus bitrate. `length` is computed as `(total_samples * 1000).div_round(48000)`. The only guard is `total_samples > 0`, but for small granule-position differences (total_samples in roughly 1..=23) the rounded division produces `length == 0`. The very next lines divide by `length` (`(file_length * 8) / length` and `(stream_len * 8) / length`), which panics on a crafted Opus file whose last-page abgp is only slightly larger than the first-page abgp (after pre-skip subtraction). This is reachable from untrusted input.","fix":"After computing `length`, guard the divisions with `if length > 0` (mirroring the Vorbis code which uses `checked_div`), or compute the bitrate with `checked_div`/`saturating` helpers and skip the calculation when `length == 0`.","locations":[{"ref":"lofty/src/ogg/opus/properties.rs:141-155","code":"  141 | \t\tif total_samples > 0 {\n  142 | \t\t\t// Best case scenario\n  143 | \t\t\tlet length = (total_samples * 1000).div_round(48000);\n  144 | \n  145 | \t\t\t// Get the stream length by subtracting the length of the header packets\n  146 | \n  147 | \t\t\t// Safe to unwrap, metadata is checked prior\n  148 | \t\t\tlet metadata_packet = packets.get(1).unwrap();\n  149 | \t\t\tlet header_size = identification_packet.len() + metadata_packet.len();\n  150 | \n  151 | \t\t\tlet stream_len = file_length - header_size as u64;\n  152 | \n  153 | \t\t\tproperties.duration = Duration::from_millis(length);\n  154 | \t\t\tproperties.overall_bitrate = ((file_length * 8) / length) as u32;\n  155 | \t\t\tproperties.audio_bitrate = ((stream_len * 8) / length) as u32;","lines":15,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/ogg/opus/properties.rs#L141-L155"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"Divide-by-zero panic when calculating Speex bitrate. Inside `if total_samples > 0`, `length` is set to `(total_samples * 1000).div_round(sample_rate)`, which can round down to 0 for small total_samples relative to the sample rate. `length` then reaches the bitrate calculations at the bottom of the function where it is used as a divisor (`file_length.saturating_mul(8) / length` and `.div_round(length)`), panicking on division by zero. div_round itself also divides by its `rhs`, so `div_round(length)` with length==0 panics too. Reachable from crafted input.","fix":"Only assign the rounded `length` when it is non-zero (keep the default of 1000 otherwise), or guard all uses of `length` as a divisor with a `length > 0` check / `checked_div`.","locations":[{"ref":"lofty/src/ogg/speex/properties.rs:167-192","code":"  167 | \t\tif properties.sample_rate > 0 {\n  168 | \t\t\tlet total_samples = last_page_abgp.saturating_sub(first_page_abgp);\n  169 | \n  170 | \t\t\t// Best case scenario\n  171 | \t\t\tif total_samples > 0 {\n  172 | \t\t\t\tlength = (total_samples * 1000).div_round(u64::from(properties.sample_rate));\n  173 | \t\t\t\tproperties.duration = Duration::from_millis(length);\n  174 | \t\t\t} else {\n  175 | \t\t\t\tlog::warn!(\n  176 | \t\t\t\t\t\"Speex: The file contains invalid PCM values, unable to calculate length\"\n  177 | \t\t\t\t);\n  178 | \t\t\t}\n  179 | \t\t} else {\n  180 | \t\t\tlog::warn!(\"Speex: Sample rate = 0, unable to calculate length\");\n  181 | \t\t}\n  182 | \t}\n  183 | \n  184 | \tif properties.nominal_bitrate > 0 {\n  185 | \t\tproperties.overall_bitrate = (file_length.saturating_mul(8) / length) as u32;\n  186 | \t\tproperties.audio_bitrate = (properties.nominal_bitrate as u64 / 1000) as u32;\n  187 | \t} else {\n  188 | \t\tlog::warn!(\"Nominal bitrate = 0, estimating bitrate from file length\");\n  189 | \n  190 | \t\tproperties.overall_bitrate = file_length.saturating_mul(8).div_round(length) as u32;\n  191 | \t\tproperties.audio_bitrate = stream_length.saturating_mul(8).div_round(length) as u32;\n  192 | \t}","lines":26,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/ogg/speex/properties.rs#L167-L192"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`parse_data_inner` uses a hard `assert!` (active in release builds) on parser-derived offsets:\n`assert!(atom_end >= position, ...)`. `atom_end = atom_info.start + atom_info.len`. If a previously\nparsed atom advanced the reader past the computed `atom_end` (a \"size mismatch\" the code admits can\nhappen), this panics on untrusted input rather than returning a recoverable error. A library\nparsing untrusted files should never abort the process.","fix":"Replace the `assert!` with a graceful error/early-return: `if atom_end < position { return Ok(None); }` (or `err!(SizeMismatch)`).","locations":[{"ref":"lofty/src/mp4/ilst/read.rs:246-253","code":"  246 | \tlet atom_end = atom_info.start + atom_info.len;\n  247 | \tlet position = reader.stream_position()?;\n  248 | \tassert!(\n  249 | \t\tatom_end >= position,\n  250 | \t\t\"uncaught size mismatch, reader position: {position} (expected <= {atom_end})\",\n  251 | \t);\n  252 | \n  253 | \tlet to_read = atom_end - position;","lines":8,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/mp4/ilst/read.rs#L246-L253"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`lookup_resolver` panics with `unwrap()`/`panic!` when an unregistered custom `FileType` is encountered, and is called from `Probe::read_inner` (probe.rs:490). While the panic is documented on `Probe::read`, a library parsing untrusted files reaching a hard `panic!` from the normal read path is hostile to callers who cannot guarantee resolver registration ordering. The mutex `unwrap()` additionally turns a poisoned lock into a panic.","fix":"Return a `Result`/`err!(UnknownFormat)` for the missing-resolver case instead of `panic!`, and handle a poisoned mutex gracefully rather than `unwrap()`.","locations":[{"ref":"lofty/src/resolve.rs:41-52","code":"   41 | pub(crate) fn lookup_resolver(name: &'static str) -> &'static dyn ObjectSafeFileResolver {\n   42 | \tlet res = CUSTOM_RESOLVERS.lock().unwrap();\n   43 | \n   44 | \tif let Some(resolver) = res.get(name).copied() {\n   45 | \t\treturn resolver;\n   46 | \t}\n   47 | \n   48 | \tpanic!(\n   49 | \t\t\"Encountered an unregistered custom `FileType` named `{}`\",\n   50 | \t\tname\n   51 | \t);\n   52 | }","lines":12,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/resolve.rs#L41-L52"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`flush_page` contains `debug_assert!(self.pos <= self.current_packet_len as u64)` and `debug_assert!(full_segments_occupied <= MAX_WRITTEN_SEGMENT_COUNT)`, and relies on `self.last_segment_size.expect(..)`. While `paginate` is fed internal packet slices in normal use, `Packets::paginate`/`write_to` are public APIs that paginate content whose recorded packet sizes can be set arbitrarily via `Packets::set`. A packet whose size exceeds the actual content, or content larger than expected, could trip the debug assertions (panic in debug builds) or push an incorrect segment table. The invariants are enforced only by debug_assert, so release builds emit a malformed page instead.","fix":"Validate packet lengths against available content before paginating, and return a `PageError` instead of relying on debug_assert for invariants that depend on externally controllable sizes.","locations":[{"ref":"ogg_pager/src/paginate.rs:82-101","code":"   82 | \t\tdebug_assert!(self.pos <= self.current_packet_len as u64);\n   83 | \n   84 | \t\tif self.flags.packet_finished_on_page {\n   85 | \t\t\theader.abgp = self.abgp;\n   86 | \t\t} else {\n   87 | \t\t\t// A special value of '-1' (in two's complement) indicates that no packets\n   88 | \t\t\t// finish on this page.\n   89 | \t\t\theader.abgp = 1_u64.wrapping_neg()\n   90 | \t\t}\n   91 | \n   92 | \t\tdebug_assert!(full_segments_occupied <= MAX_WRITTEN_SEGMENT_COUNT);\n   93 | \t\theader.segments = vec![255; full_segments_occupied];\n   94 | \n   95 | \t\tif full_segments_occupied != MAX_WRITTEN_SEGMENT_COUNT {\n   96 | \t\t\t// End of the packet\n   97 | \t\t\tlet last_segment_size = self\n   98 | \t\t\t\t.last_segment_size\n   99 | \t\t\t\t.expect(\"fresh packet should be indicated at this point\");\n  100 | \t\t\theader.segments.push(last_segment_size);\n  101 | \t\t}","lines":20,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/ogg_pager/src/paginate.rs#L82-L101"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`PacketsIter::next` indexes `self.packet_sizes[0]` and slices `self.content.split_at(packet_size as usize)` based on the recorded sizes. This relies on the invariant that the sum of `packet_sizes` equals `content.len()`. If a prior `Packets::set` desynchronized that invariant, `split_at` panics (index out of bounds). The iterator trusts `cap`/`packet_sizes[0]` without checking against the remaining content length.","fix":"Use `split_at_checked` (or guard `packet_size <= self.content.len()`) and stop iterating gracefully on mismatch.","locations":[{"ref":"ogg_pager/src/packets.rs:422-436","code":"  422 | \tfn next(&mut self) -> Option<Self::Item> {\n  423 | \t\tif self.cap == 0 {\n  424 | \t\t\treturn None;\n  425 | \t\t}\n  426 | \n  427 | \t\tlet packet_size = self.packet_sizes[0];\n  428 | \n  429 | \t\tself.cap -= 1;\n  430 | \t\tself.packet_sizes = &self.packet_sizes[1..];\n  431 | \n  432 | \t\tlet (ret, remaining) = self.content.split_at(packet_size as usize);\n  433 | \t\tself.content = remaining;\n  434 | \n  435 | \t\tSome(ret)\n  436 | \t}","lines":15,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/ogg_pager/src/packets.rs#L422-L436"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"`duration` is read directly from the file's `mdhd` atom (u64 for version 1, u32 for version 0)\nand is then used in `duration * 1000` before being passed to `div_round`. A crafted version-1\n`mdhd` with a large duration makes `duration * 1000` overflow `u64`, which panics in debug builds\nand silently wraps in release builds, producing a nonsensical duration. `div_round` itself\n(`self + (rhs >> 1)`) can also overflow on top of that. This is reachable from untrusted input.","fix":"Use checked/saturating arithmetic or compute in u128: `u128::from(duration) * 1000` then divide, before converting back. Clamp the result to a sane range.","locations":[{"ref":"lofty/src/mp4/properties.rs:694-697","code":"  694 | \tif timescale > 0 {\n  695 | \t\tlet duration_millis = (duration * 1000).div_round(u64::from(timescale));\n  696 | \t\tproperties.duration = Duration::from_millis(duration_millis);\n  697 | \t}","lines":4,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/mp4/properties.rs#L694-L697"},{"ref":"lofty/src/mp4/properties.rs:388-405","code":"  388 | \t\t\tlet (timescale, duration) = if version == 1 {\n  389 | \t\t\t\t// We don't care about these two values\n  390 | \t\t\t\tlet _creation_time = reader.read_u64()?;\n  391 | \t\t\t\tlet _modification_time = reader.read_u64()?;\n  392 | \n  393 | \t\t\t\tlet timescale = reader.read_u32()?;\n  394 | \t\t\t\tlet duration = reader.read_u64()?;\n  395 | \n  396 | \t\t\t\t(timescale, duration)\n  397 | \t\t\t} else {\n  398 | \t\t\t\tlet _creation_time = reader.read_u32()?;\n  399 | \t\t\t\tlet _modification_time = reader.read_u32()?;\n  400 | \n  401 | \t\t\t\tlet timescale = reader.read_u32()?;\n  402 | \t\t\t\tlet duration = reader.read_u32()?;\n  403 | \n  404 | \t\t\t\t(timescale, u64::from(duration))\n  405 | \t\t\t};","lines":18,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/mp4/properties.rs#L388-L405"},{"ref":"lofty/src/util/math.rs:18-20","code":"   18 | \t\t\t\tfn div_round(self, rhs: Self) -> Self::Output {\n   19 | \t\t\t\t\t(self + (rhs >> 1)) / rhs\n   20 | \t\t\t\t}","lines":3,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/util/math.rs#L18-L20"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"In `PictureInformation::from_jpeg`, the per-section skip computes `section_len - 2` where `section_len` is a `u16` read from untrusted input inside the loop (line 451). Unlike the first read (lines 443-446, which guards against `< 2` via `overflowing_sub`), this subtraction is unchecked. A crafted JPEG with a section length of 0 or 1 causes a `u16` underflow: panic in debug builds, and in release it wraps to a huge value passed to `seek`, breaking parsing. Reachable from untrusted picture data.","fix":"Use `section_len.checked_sub(2)` (or `overflowing_sub` like the earlier code) and bail with `err!(NotAPicture)` on underflow.","locations":[{"ref":"lofty/src/picture/mod.rs:453-479","code":"  453 | \t\t\tsection_len = reader.read_u16::<BigEndian>()?;\n  454 | \n  455 | \t\t\t// This marks the SOS (Start of Scan), which is\n  456 | \t\t\t// the end of the header\n  457 | \t\t\tif marker == 0xDA {\n  458 | \t\t\t\tbreak;\n  459 | \t\t\t}\n  460 | \n  461 | \t\t\t// We are looking for a frame with a \"SOFn\" marker,\n  462 | \t\t\t// with `n` either being 0 or 2. Since there isn't a\n  463 | \t\t\t// header like PNG, we actually need to search for this\n  464 | \t\t\t// frame\n  465 | \t\t\tif marker == 0xC0 || marker == 0xC2 {\n  466 | \t\t\t\tlet precision = reader.read_u8()?;\n  467 | \t\t\t\tlet height = u32::from(reader.read_u16::<BigEndian>()?);\n  468 | \t\t\t\tlet width = u32::from(reader.read_u16::<BigEndian>()?);\n  469 | \t\t\t\tlet components = reader.read_u8()?;\n  470 | \n  471 | \t\t\t\treturn Ok(Self {\n  472 | \t\t\t\t\twidth,\n  473 | \t\t\t\t\theight,\n  474 | \t\t\t\t\tcolor_depth: u32::from(precision * components),\n  475 | \t\t\t\t\tnum_colors: 0,\n  476 | \t\t\t\t});\n  477 | \t\t\t}\n  478 | \n  479 | \t\t\treader.seek(SeekFrom::Current(i64::from(section_len - 2)))?;","lines":27,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/picture/mod.rs#L453-L479"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"`PictureInformation::from_jpeg` computes `color_depth: u32::from(precision * components)` where both `precision` and `components` are `u8` read directly from untrusted JPEG bytes. The SOF marker allows `precision` up to 16 and `components` up to 255 (and an attacker can put any byte there), so `precision * components` routinely exceeds 255. The multiplication is done in `u8`, so it panics on overflow in debug builds and silently wraps (producing a wrong color depth) in release. `from_jpeg` is reachable from `PictureInformation::from_picture` and FLAC/Vorbis picture parsing on untrusted input.","fix":"Promote before multiplying: `color_depth: u32::from(precision) * u32::from(components)`.","locations":[{"ref":"lofty/src/picture/mod.rs:466-476","code":"  466 | \t\t\t\tlet precision = reader.read_u8()?;\n  467 | \t\t\t\tlet height = u32::from(reader.read_u16::<BigEndian>()?);\n  468 | \t\t\t\tlet width = u32::from(reader.read_u16::<BigEndian>()?);\n  469 | \t\t\t\tlet components = reader.read_u8()?;\n  470 | \n  471 | \t\t\t\treturn Ok(Self {\n  472 | \t\t\t\t\twidth,\n  473 | \t\t\t\t\theight,\n  474 | \t\t\t\t\tcolor_depth: u32::from(precision * components),\n  475 | \t\t\t\t\tnum_colors: 0,\n  476 | \t\t\t\t});","lines":11,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/picture/mod.rs#L466-L476"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"In `RelativeVolumeAdjustmentFrame::as_bytes`, when a channel's `peak_volume` is longer than the\nbyte count implied by `bits_representing_peak`, the code recalculates `bits_representing_peak` (a\n`u8`) by summing `b.leading_ones()` over up to 32 peak bytes. Each `leading_ones()` returns 0..=8,\nso the sum can reach 32*8 = 256, which overflows the `u8` accumulator and panics in debug builds\n(wraps in release). A `RelativeVolumeAdjustmentFrame` with a large `peak_volume` and a small\n`bits_representing_peak` is enough to trigger this. The comment \"Max out at 255 bits\" is also\nmisleading: nothing caps the value at 255.","fix":"Use a saturating/checked accumulator and actually cap at 255, e.g.:\n\n```rust\nlet mut total = 0u16;\nfor b in peak.iter().copied().take(32) {\n    total += u16::from(b.leading_ones() as u8);\n}\nbits_representing_peak = u8::try_from(total).unwrap_or(u8::MAX);\n```\n\nAlso reconsider the semantics: summing `leading_ones()` per byte is almost certainly not the\nintended \"number of bits representing the peak\".","locations":[{"ref":"lofty/src/id3/v2/items/relative_volume_adjustment_frame.rs:255-266","code":"  255 | \t\t\t\tif peak.len() > expected_peak_byte_length as usize {\n  256 | \t\t\t\t\t// Recalculate bits representing peak\n  257 | \t\t\t\t\tbits_representing_peak = 0;\n  258 | \n  259 | \t\t\t\t\t// Max out at 255 bits\n  260 | \t\t\t\t\tfor b in peak.iter().copied().take(32) {\n  261 | \t\t\t\t\t\tbits_representing_peak += b.leading_ones() as u8;\n  262 | \t\t\t\t\t}\n  263 | \t\t\t\t}\n  264 | \n  265 | \t\t\t\tcontent.push(bits_representing_peak);\n  266 | \t\t\t\tcontent.extend(peak.iter().take(32));","lines":12,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/id3/v2/items/relative_volume_adjustment_frame.rs#L255-L266"}]},
{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"In `write_riff_info` several `u32` additions on file-derived sizes can overflow. Line 39 `original_stream_length + IFF_CHUNK_HEADER_SIZE` and line 62 `original_stream_length + IFF_CHUNK_HEADER_SIZE` are computed in `u32` before the `as usize` cast; a large RIFF size field (close to `u32::MAX`) overflows (debug panic / release wrap) producing a bogus offset that is then used to index/seek into the in-memory file buffer.","fix":"Perform these additions in `u64` (e.g. `u64::from(original_stream_length) + u64::from(IFF_CHUNK_HEADER_SIZE)`) and compare against the actual buffer length, or use `checked_add` and bail on overflow.","locations":[{"ref":"lofty/src/iff/wav/tag/write.rs:44","code":"   44 | \tif file_bytes.get_ref().len() < (original_stream_length + IFF_CHUNK_HEADER_SIZE) as usize {","lines":1,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/iff/wav/tag/write.rs#L44"},{"ref":"lofty/src/iff/wav/tag/write.rs:66-67","code":"   66 | \t\tlet tag_position = (original_stream_length + IFF_CHUNK_HEADER_SIZE) as usize;\n   67 | \t\tfile_bytes.seek(SeekFrom::Start(tag_position as u64))?;","lines":2,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/iff/wav/tag/write.rs#L66-L67"}]},
{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"On the write path, `moov` size is recomputed as `(moov_len - existing_udta_size) + new_udta_size`,\nand in `save_to_existing` `*new_udta_size = (udta.len - meta.len) + new_meta_size`. These assume the\nchild atom (`udta`/`meta`) length is <= its parent length. A malformed file where a child reports a\nlength larger than its parent makes these subtractions underflow (panic in debug, wrap in release).\nThe file has already been fully read into memory, so this is a robustness/panic bug rather than a\nmemory-safety one.","fix":"Use checked subtraction and return a `FileEncodingError` when a child atom's size exceeds its parent's.","locations":[{"ref":"lofty/src/mp4/ilst/write.rs:201","code":"  201 | \tlet new_moov_length = (moov_len - existing_udta_size) + new_udta_size;","lines":1,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/mp4/ilst/write.rs#L201"},{"ref":"lofty/src/mp4/ilst/write.rs:349","code":"  349 | \t\t*new_udta_size = (udta.len - meta.len) + new_meta_size;","lines":1,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/mp4/ilst/write.rs#L349"}]},
{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"Bitrate estimation multiplies before widening: `u128::from(mdat_len * 8)` and\n`u128::from(file_length * 8)`. The `* 8` happens in `u64` first, so the widening to `u128` is\nuseless for preventing overflow. `mdat_len` derives from an atom length (`atom.len - 8`, where\n`atom.len` can be a 64-bit extended size), so a crafted/huge `mdat` can overflow the `u64`\nmultiplication (panic in debug, wrap in release) before it is ever promoted to `u128`.","fix":"Widen first, then multiply: `u128::from(mdat_len) * 8` and `u128::from(file_length) * 8`.","locations":[{"ref":"lofty/src/mp4/properties.rs:753","code":"  753 | \t\tlet overall_bitrate = u128::from(file_length * 8) / duration_millis;","lines":1,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/mp4/properties.rs#L753"}]},
{"id":"OVF_8","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"Same unchecked-multiply overflow risk in the SV7 path: `stream_length * 8 * u64::from(sample_freq)`\nand `total_samples * 1000` are computed without overflow protection on attacker-controlled values.\n`frame_count` is a full u32 read from the file, so `frame_count * MPC_FRAME_LENGTH` and the\nsubsequent products can overflow u64 and panic in debug builds.","fix":"Use checked/saturating arithmetic or u128 intermediates for these products, consistent with the rest of the parser.","locations":[{"ref":"lofty/src/musepack/sv7/properties.rs:376-384","code":"  376 | \t\t\ttotal_samples = (u64::from(properties.frame_count) * MPC_FRAME_LENGTH)\n  377 | \t\t\t\t- (MPC_FRAME_LENGTH - u64::from(properties.last_frame_length));\n  378 | \t\t} else {\n  379 | \t\t\ttotal_samples =\n  380 | \t\t\t\t(u64::from(properties.frame_count) * MPC_FRAME_LENGTH) - MPC_DECODER_SYNTH_DELAY;\n  381 | \t\t}\n  382 | \n  383 | \t\tproperties.average_bitrate = ((stream_length * 8 * u64::from(properties.sample_freq))\n  384 | \t\t\t/ (total_samples * 1000)) as u32;","lines":9,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/musepack/sv7/properties.rs#L376-L384"}]},
{"id":"OVF_9","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"Unchecked u64 multiplications on attacker-controlled sample counts can overflow and panic in\ndebug builds (or silently wrap in release, producing garbage bitrate/duration). `sample_count`\nand `beginning_silence` are variable-length integers of up to 9*7 = 63 bits, so `total_samples`\ncan approach 2^63. `total_samples * 1000` (used for both duration and the bitrate divisor) and\n`stream_length * 8 * sample_rate` can overflow u64.","fix":"Use checked/saturating arithmetic (e.g. `checked_mul`) or cast to u128 for the intermediate products, and bail gracefully on overflow instead of relying on wrapping/panicking.","locations":[{"ref":"lofty/src/musepack/sv8/properties.rs:294-298","code":"  294 | \tlet length = (total_samples * 1000).div_round(u64::from(sample_rate));\n  295 | \n  296 | \tproperties.duration = Duration::from_millis(length);\n  297 | \tproperties.average_bitrate =\n  298 | \t\t((stream_length * 8 * u64::from(sample_rate)) / (total_samples * 1000)) as u32;","lines":5,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/musepack/sv8/properties.rs#L294-L298"}]},
{"id":"OVF_10","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"Potential subtraction underflow when computing the Opus stream length: `let stream_len = file_length - header_size as u64;` where `header_size = identification_packet.len() + metadata_packet.len()`. The two packet lengths are derived from parsed packet data, while `file_length` comes from seeking to the end. There is no guarantee `header_size <= file_length` for a malformed/crafted file (e.g. packets reconstructed from overlapping/duplicated pages), so this can underflow and panic in debug builds (or wrap to a huge value in release, producing a nonsense bitrate).","fix":"Use `file_length.saturating_sub(header_size as u64)`.","locations":[{"ref":"lofty/src/ogg/opus/properties.rs:149-151","code":"  149 | \t\t\tlet header_size = identification_packet.len() + metadata_packet.len();\n  150 | \n  151 | \t\t\tlet stream_len = file_length - header_size as u64;","lines":3,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/ogg/opus/properties.rs#L149-L151"}]},
{"id":"OVF_11","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"In `Packets::paginate`, each packet slice is taken as `&self.content[pos..pos + packet_size as usize]` and `pos` is advanced by `packet_size as usize`. `packet_sizes` is `Vec<u64>` and `set()` writes arbitrary user-supplied content lengths into it. If the recorded packet sizes ever exceed `content.len()` (which `set` does not re-validate against the actual content vec, and which can drift after multiple `set` calls), the slice index panics. The sum of packet sizes is assumed to equal `content.len()` but nothing enforces this invariant.","fix":"Slice defensively with bounds checks (e.g. `content.get(pos..pos + size)`), or maintain/verify the invariant that `packet_sizes.iter().sum() == content.len()` after every mutation.","locations":[{"ref":"ogg_pager/src/packets.rs:341-351","code":"  341 | \tpub fn paginate(&self, stream_serial: u32, abgp: u64, flags: u8) -> Result<Vec<Page>> {\n  342 | \t\tlet mut packets = Vec::new();\n  343 | \n  344 | \t\tlet mut pos = 0;\n  345 | \t\tfor packet_size in self.packet_sizes.iter().copied() {\n  346 | \t\t\tpackets.push(&self.content[pos..pos + packet_size as usize]);\n  347 | \t\t\tpos += packet_size as usize;\n  348 | \t\t}\n  349 | \n  350 | \t\tpaginate(packets, stream_serial, abgp, flags)\n  351 | \t}","lines":11,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/ogg_pager/src/packets.rs#L341-L351"},{"ref":"ogg_pager/src/packets.rs:278-290","code":"  278 | \tpub fn set(&mut self, idx: usize, content: impl Into<Vec<u8>>) -> bool {\n  279 | \t\tlet Some(range) = self.packet_span(idx) else {\n  280 | \t\t\treturn false;\n  281 | \t\t};\n  282 | \n  283 | \t\tlet content = content.into();\n  284 | \t\tlet content_size = content.len();\n  285 | \n  286 | \t\tself.content.splice(range, content);\n  287 | \t\tself.packet_sizes[idx] = content_size as u64;\n  288 | \n  289 | \t\ttrue\n  290 | \t}","lines":13,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/ogg_pager/src/packets.rs#L278-L290"}]},
{"id":"OVF_12","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"Accumulating per-frame AAC bitrates into a `u32` can overflow. `first_frame_header.bitrate` is a `u32` and\nthe loop does `first_frame_header.bitrate += header.bitrate` once per frame across the entire file before\ndividing by `frame_count`. Each `header.bitrate` is a few hundred (e.g. ~344 for a typical 44.1 kHz frame),\nso a file with on the order of ~12M frames overflows `u32`, panicking in debug builds and wrapping in\nrelease (yielding a nonsensical average bitrate and thus a wrong duration). A crafted/large file can trigger\nthis on untrusted input.","fix":"Accumulate into a `u64` (or use a running average) and only down-cast after dividing by `frame_count`, e.g.\n`let mut bitrate_sum = u64::from(first_frame_header.bitrate); ... bitrate_sum += u64::from(header.bitrate);`\nthen `first_frame_header.bitrate = (bitrate_sum / u64::from(frame_count)) as u32;`.","locations":[{"ref":"lofty/src/aac/read.rs:141-150","code":"  141 | \t\tlet mut frame_count = 1;\n  142 | \n  143 | \t\twhile let Some((header, frame_end)) = find_next_frame(reader, parse_mode)? {\n  144 | \t\t\tfirst_frame_header.bitrate += header.bitrate;\n  145 | \t\t\tframe_count += 1u32;\n  146 | \n  147 | \t\t\treader.seek(SeekFrom::Start(frame_end))?;\n  148 | \t\t}\n  149 | \n  150 | \t\tfirst_frame_header.bitrate /= frame_count;","lines":10,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/aac/read.rs#L141-L150"}]},
{"id":"OVF_13","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"Silent truncation of item value lengths to u32 when serializing an APE tag. `value.len() as u32`\ntruncates on 64-bit platforms if a single item value is >= 4 GiB; the full (non-truncated) bytes are\nthen written via `write_all`, producing a tag whose declared value_size disagrees with the bytes\npresent. The aggregate `size + 32 > u32::MAX` check at line 209 happens only after the per-item size\nfields are already written with truncated values, so it does not catch this per-item case.","fix":"Validate each item value length against u32::MAX before casting and bail with `err!(TooMuchData)` if exceeded.","locations":[{"ref":"lofty/src/ape/tag/write.rs:209-234","code":"  209 | \t\tlet (mut flags, value) = match item.value {\n  210 | \t\t\tItemValueRef::Binary(value) => {\n  211 | \t\t\t\ttag_write.write_u32::<LittleEndian>(value.len() as u32)?;\n  212 | \n  213 | \t\t\t\t(1_u32 << 1, value)\n  214 | \t\t\t},\n  215 | \t\t\tItemValueRef::Text(ref value) => {\n  216 | \t\t\t\ttag_write.write_u32::<LittleEndian>(value.len() as u32)?;\n  217 | \n  218 | \t\t\t\t(0_u32, value.as_bytes())\n  219 | \t\t\t},\n  220 | \t\t\tItemValueRef::Locator(value) => {\n  221 | \t\t\t\ttag_write.write_u32::<LittleEndian>(value.len() as u32)?;\n  222 | \n  223 | \t\t\t\t(2_u32 << 1, value.as_bytes())\n  224 | \t\t\t},\n  225 | \t\t};\n  226 | \n  227 | \t\tif item.read_only {\n  228 | \t\t\tflags |= 1_u32\n  229 | \t\t}\n  230 | \n  231 | \t\ttag_write.write_u32::<LittleEndian>(flags)?;\n  232 | \t\ttag_write.write_all(item.key.as_bytes())?;\n  233 | \t\ttag_write.write_u8(0)?;\n  234 | \t\ttag_write.write_all(value)?;","lines":26,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/ape/tag/write.rs#L209-L234"}]},
{"id":"OVF_14","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"Frame body length is taken as `value.len() as u32` (and `len + 1` for grouping identity), a\ntruncating cast of a usize. For a frame body larger than 4 GiB the written size wraps, and `len + 1`\ncan overflow to 0 if `len == u32::MAX`. `synch()` later rejects values above the 28-bit limit, but\nonly after the truncation has already happened, so the synchsafe guard can be defeated by a value\nthat wraps below the limit.","fix":"Use try_into::<u32>() on value.len() and on the +1 result, returning TooMuchData on overflow, before encoding the size.","locations":[{"ref":"lofty/src/id3/v2/write/frame.rs:310-319","code":"  310 | \tlet len = value.len() as u32;\n  311 | \tlet is_grouping_identity = flags.grouping_identity.is_some();\n  312 | \n  313 | \twrite_frame_header(\n  314 | \t\twriter,\n  315 | \t\tname,\n  316 | \t\tif is_grouping_identity { len + 1 } else { len },\n  317 | \t\tflags,\n  318 | \t\twrite_options,\n  319 | \t)?;","lines":10,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/id3/v2/write/frame.rs#L310-L319"}]},
{"id":"OVF_15","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`Chunk`'s `Seek` impl casts the adjusted remaining sizes back to unsigned without range checks: `(*self.file_remaining_size as i64 - delta) as u64` and `(i64::from(*self.chunk_remaining_size) - delta) as u32`. A seek that moves the inner `Take` limit such that `delta` exceeds the current `chunk_remaining_size` yields a negative intermediate that wraps to a huge `u32`/`u64`, corrupting the bookkeeping used to bound subsequent reads. Also `file_remaining_size as i64` can itself be wrong for very large files (>i64::MAX, not reachable in practice).","fix":"Use checked/saturating signed-to-unsigned conversions (e.g. clamp the result to 0) and assert the delta stays within the chunk bounds, mirroring the saturating logic used in the `Read` impl.","locations":[{"ref":"lofty/src/iff/chunk.rs:315-327","code":"  315 | impl<R: Seek> Seek for Chunk<'_, R> {\n  316 | \tfn seek(&mut self, pos: SeekFrom) -> std::io::Result<u64> {\n  317 | \t\tlet old_limit = self.reader.limit();\n  318 | \t\tlet ret = self.reader.seek(pos)?;\n  319 | \t\tlet new_limit = self.reader.limit();\n  320 | \n  321 | \t\tlet delta = (old_limit as i64) - (new_limit as i64);\n  322 | \n  323 | \t\t*self.file_remaining_size = (*self.file_remaining_size as i64 - delta) as u64;\n  324 | \t\t*self.chunk_remaining_size = (i64::from(*self.chunk_remaining_size) - delta) as u32;\n  325 | \n  326 | \t\tOk(ret)\n  327 | \t}","lines":13,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/iff/chunk.rs#L315-L327"}]},
{"id":"OVF_16","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"WAV `fmt ` parsing silently truncates 16-bit fields to 8 bits. `channels` is read as `u16` then stored as `channels as u8` (line 142); a file declaring >255 channels wraps to a wrong small value rather than being rejected. Likewise `bit_depth` is produced via `valid_bits_per_sample as u8` / `bits_per_sample as u8` (lines 213-214), truncating depths >255. These are externally controlled values from the chunk.","fix":"Validate the `u16` channel count / bit depth against the `u8` range (or widen the public field types) and bail with a decode error on out-of-range values instead of truncating.","locations":[{"ref":"lofty/src/iff/wav/properties.rs:139-147","code":"  139 | \tlet mut fmt_chunk = FmtChunk {\n  140 | \t\tformat_tag,\n  141 | \t\tchannels: channels as u8,\n  142 | \t\tsample_rate,\n  143 | \t\tbytes_per_second,\n  144 | \t\tblock_align,\n  145 | \t\tbits_per_sample,\n  146 | \t\textensible_info: None,\n  147 | \t};","lines":9,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/iff/wav/properties.rs#L139-L147"},{"ref":"lofty/src/iff/wav/properties.rs:216-223","code":"  216 | \tmatch extensible_info {\n  217 | \t\tSome(ExtensibleFmtChunk {\n  218 | \t\t\tvalid_bits_per_sample,\n  219 | \t\t\t..\n  220 | \t\t}) if valid_bits_per_sample > 0 => bit_depth = valid_bits_per_sample as u8,\n  221 | \t\t_ if bits_per_sample > 0 => bit_depth = bits_per_sample as u8,\n  222 | \t\t_ => bit_depth = bytes_per_sample.saturating_mul(8) as u8,\n  223 | \t}","lines":8,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/iff/wav/properties.rs#L216-L223"}]},
{"id":"OVF_17","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`total_samples * 1000` can overflow `u64` for an attacker-controlled granule position close to `u64::MAX`. In debug builds this panics; in release it wraps, yielding an incorrect duration/bitrate. Vorbis avoids this by widening to `u128` before multiplying (see vorbis/properties.rs:124-129), but Opus and Speex multiply in `u64`.","fix":"Widen to `u128` before multiplying by 1000 (as Vorbis does), or use `saturating_mul`.","locations":[{"ref":"lofty/src/ogg/opus/properties.rs:143","code":"  143 | \t\t\tlet length = (total_samples * 1000).div_round(48000);","lines":1,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/ogg/opus/properties.rs#L143"},{"ref":"lofty/src/ogg/speex/properties.rs:172","code":"  172 | \t\t\t\tlength = (total_samples * 1000).div_round(u64::from(properties.sample_rate));","lines":1,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/ogg/speex/properties.rs#L172"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Encrypted-frame writing computes the frame header size as `value.len() + 1`, but the body it\nactually writes is a 4-byte data length indicator + 1-byte method symbol + the value\n(`value.len() + 5` bytes). The frame size in the header must include the data length indicator and\nmethod symbol, so it is 4 bytes too small. Any reader using the frame size to find the next frame\nwill land 4 bytes inside this frame's data and mis-parse the rest of the tag.","fix":"Pass `(value.len() + 5) as u32` (4 for the data length indicator + 1 for the method symbol) to `write_frame_header`, and guard against overflow when casting from usize.","locations":[{"ref":"lofty/src/id3/v2/write/frame.rs:351-364","code":"  351 | \tif let Some(mut len) = flags.data_length_indicator\n  352 | \t\t&& len > 0\n  353 | \t{\n  354 | \t\twrite_frame_header(writer, name, (value.len() + 1) as u32, flags, write_options)?;\n  355 | \t\tif !write_options.use_id3v23 {\n  356 | \t\t\tlen = len.synch()?;\n  357 | \t\t}\n  358 | \n  359 | \t\twriter.write_u32::<BigEndian>(len)?;\n  360 | \t\twriter.write_u8(method_symbol)?;\n  361 | \t\twriter.write_all(value)?;\n  362 | \n  363 | \t\treturn Ok(());\n  364 | \t}","lines":14,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/id3/v2/write/frame.rs#L351-L364"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`Tag::take_filter` claims in its doc comment that it \"preserves the ordering of the remaining items\", but the swap-based partition does not. It swaps each matched element toward the front (`self.items.swap(split_idx, read_idx)`), which scrambles the relative order of the *unmatched* elements that get swapped backward. Example: items [A,B,C,D] where B and D match. After processing, the vec becomes [B,D,C,A]; draining the front two leaves [C,A], but the original order of the remaining items was [A,C]. So the documented invariant is violated, and remaining items come out reordered.","fix":"Use a stable partition. Replace the swap loop with `Vec::extract_if` (or a manual stable approach: build a new `Vec` of retained items in order while collecting the matched ones), e.g. partition into two `Vec`s preserving order, then reassign `self.items` to the retained vec and return the matched vec as an iterator. The doc claim of order preservation then holds for both matched and remaining items.","locations":[{"ref":"lofty/src/tag/mod.rs:463-483","code":"  463 | \tpub fn take_filter<F>(\n  464 | \t\t&mut self,\n  465 | \t\tkey: ItemKey,\n  466 | \t\tmut filter: F,\n  467 | \t) -> impl Iterator<Item = TagItem> + use<'_, F>\n  468 | \twhere\n  469 | \t\tF: FnMut(&TagItem) -> bool,\n  470 | \t{\n  471 | \t\t// TODO: drain_filter\n  472 | \t\tlet mut split_idx = 0;\n  473 | \n  474 | \t\tfor read_idx in 0..self.items.len() {\n  475 | \t\t\tlet item = &self.items[read_idx];\n  476 | \t\t\tif item.key() == key && filter(item) {\n  477 | \t\t\t\tself.items.swap(split_idx, read_idx);\n  478 | \t\t\t\tsplit_idx += 1;\n  479 | \t\t\t}\n  480 | \t\t}\n  481 | \n  482 | \t\tself.items.drain(..split_idx)\n  483 | \t}","lines":21,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/tag/mod.rs#L463-L483"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`RelativeVolumeAdjustmentFrame::as_bytes` can emit a frame that cannot be round-tripped. When\n`peak_volume` is *shorter* than the byte count implied by `bits_representing_peak`\n(`expected_peak_byte_length`), the code still writes the original `bits_representing_peak` byte\nfollowed by only `peak.len()` bytes (it only recomputes the bit count when peak is *longer*). On\nre-parse, `RelativeVolumeAdjustmentFrame::parse` computes `bytes_representing_peak` from the declared\nbits and `read_exact`s that many bytes, consuming bytes that belong to the next channel and\ncorrupting all following channels in the frame.","fix":"Validate or normalize on write: ensure the number of peak bytes written matches\n`(bits_representing_peak + 7) / 8`, padding or recomputing `bits_representing_peak` from\n`peak.len()` when they disagree in either direction.","locations":[{"ref":"lofty/src/id3/v2/items/relative_volume_adjustment_frame.rs:242-267","code":"  242 | \t\t\tlet mut bits_representing_peak = info.bits_representing_peak;\n  243 | \t\t\tlet expected_peak_byte_length = (u16::from(bits_representing_peak) + 7) >> 3;\n  244 | \n  245 | \t\t\tcontent.push(*channel_type as u8);\n  246 | \t\t\tcontent.extend(info.volume_adjustment.to_be_bytes());\n  247 | \n  248 | \t\t\tif info.peak_volume.is_none() {\n  249 | \t\t\t\t// Easiest path, no peak\n  250 | \t\t\t\tcontent.push(0);\n  251 | \t\t\t\tcontinue;\n  252 | \t\t\t}\n  253 | \n  254 | \t\t\tif let Some(peak) = &info.peak_volume {\n  255 | \t\t\t\tif peak.len() > expected_peak_byte_length as usize {\n  256 | \t\t\t\t\t// Recalculate bits representing peak\n  257 | \t\t\t\t\tbits_representing_peak = 0;\n  258 | \n  259 | \t\t\t\t\t// Max out at 255 bits\n  260 | \t\t\t\t\tfor b in peak.iter().copied().take(32) {\n  261 | \t\t\t\t\t\tbits_representing_peak += b.leading_ones() as u8;\n  262 | \t\t\t\t\t}\n  263 | \t\t\t\t}\n  264 | \n  265 | \t\t\t\tcontent.push(bits_representing_peak);\n  266 | \t\t\t\tcontent.extend(peak.iter().take(32));\n  267 | \t\t\t}","lines":26,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/id3/v2/items/relative_volume_adjustment_frame.rs#L242-L267"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `GenresIter::next`, for bracketed genre refinements (`((...)` form) the iterator advances\n`self.pos = end + 1` using the pre-adjustment `end`, then mutates `end += 1` afterward to widen the\nreturned slice. The slice returned (`&self.value[start..end]`) thus includes the closing `)` while\n`self.pos` was set from the older value, so the relationship between the returned span and the next\nposition is inconsistent and depends on subtle ordering. This is fragile and the `((` handling does\nnot robustly cover all malformed bracketing seen in real files.","fix":"Compute the final `end` (including any `((` adjustment) before setting `self.pos`, and clearly separate the returned slice bounds from the next-scan position.","locations":[{"ref":"lofty/src/id3/v2/tag.rs:286-295","code":"  286 | \t\tif remainder.starts_with('(') && remainder.contains(')') {\n  287 | \t\t\tlet start = self.pos + 1;\n  288 | \t\t\tlet mut end = self.pos + remainder.find(')').unwrap();\n  289 | \t\t\tself.pos = end + 1;\n  290 | \t\t\t// handle bracketed refinement e.g. (55)((I think...)\"\n  291 | \t\t\tif remainder.starts_with(\"((\") {\n  292 | \t\t\t\tend += 1;\n  293 | \t\t\t}\n  294 | \t\t\treturn Some(parse_genre(&self.value[start..end], self.preserve_indexes));\n  295 | \t\t}","lines":10,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/id3/v2/tag.rs#L286-L295"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`from_tag` collects all generated frames into a `HashSet<Frame>` (`frames`) and then iterates that\nset to build the tag. Iteration order of a HashSet is non-deterministic, so the order in which\nframes are written to the file changes between runs / process invocations. This makes ID3v2 output\nnon-reproducible (bit-for-bit) and can cause flaky round-trip/ordering assertions and confusing\ndiffs for users who re-save unchanged tags.","fix":"Use an insertion-order-preserving collection (e.g. an indexmap/IndexSet or a Vec with explicit dedup) so frame write order is deterministic.","locations":[{"ref":"lofty/src/id3/v2/tag/conversion.rs:408-459","code":"  408 | \tlet mut frames = HashSet::with_capacity(items.len());\n  409 | \tfor item in items {\n  410 | \t\tif let Some(frame) = item_to_frame(&mut ctx, item) {\n  411 | \t\t\tframes.insert(frame);\n  412 | \t\t}\n  413 | \t}\n  414 | \n  415 | \tif !ctx.tipl.key_value_pairs.is_empty() {\n  416 | \t\tframes.insert(Frame::KeyValue(ctx.tipl));\n  417 | \t}\n  418 | \n  419 | \tfor (frame_id, frame_value) in ctx.text_frames {\n  420 | \t\tframes.insert(new_text_frame(\n  421 | \t\t\tFrameId::Valid(Cow::Borrowed(frame_id)),\n  422 | \t\t\tframe_value,\n  423 | \t\t));\n  424 | \t}\n  425 | \n  426 | \tfor (frame_id, frame_value) in ctx.txxx_frames {\n  427 | \t\tframes.insert(new_user_text_frame(Cow::Borrowed(frame_id), frame_value));\n  428 | \t}\n  429 | \n  430 | \tfor (LanguageAndDescription { lang, description }, content) in ctx.comments {\n  431 | \t\tframes.insert(Frame::Comment(CommentFrame::new(\n  432 | \t\t\tTextEncoding::UTF8,\n  433 | \t\t\tlang,\n  434 | \t\t\tdescription,\n  435 | \t\t\tcontent,\n  436 | \t\t)));\n  437 | \t}\n  438 | \n  439 | \tfor (LanguageAndDescription { lang, description }, content) in ctx.unsync_text {\n  440 | \t\tframes.insert(Frame::UnsynchronizedText(UnsynchronizedTextFrame::new(\n  441 | \t\t\tTextEncoding::UTF8,\n  442 | \t\t\tlang,\n  443 | \t\t\tdescription,\n  444 | \t\t\tcontent,\n  445 | \t\t)));\n  446 | \t}\n  447 | \n  448 | \tif let Some(track_frame) =\n  449 | \t\tnew_number_pair_frame(super::TRACK_ID, ctx.track_number, ctx.track_total)\n  450 | \t{\n  451 | \t\tframes.insert(track_frame);\n  452 | \t}\n  453 | \n  454 | \tif let Some(disc_frame) = new_number_pair_frame(super::DISC_ID, ctx.disc_number, ctx.disc_total)\n  455 | \t{\n  456 | \t\tframes.insert(disc_frame);\n  457 | \t}\n  458 | \n  459 | \tframes","lines":52,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/id3/v2/tag/conversion.rs#L408-L459"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"When both `crc` and `restrictions` extended-header flags are set, the CRC content start index is\ncomputed as `22 + 3 = 25`, but the restrictions flag data only occupies 2 bytes (a 1-byte length\nof `1` plus the 1-byte restrictions value, written at offsets 22..24 by create_tag_header). The\nactual tag content therefore begins at offset 24, not 25, so the CRC is calculated over the frame\ndata with its first byte omitted, producing an incorrect CRC. The CRC-only path (content_start=22)\nis correct; only the crc+restrictions combination is wrong, and the test only covers crc-only.","fix":"Use `content_start_idx += 2` for restrictions (matching the 2 bytes written), so content_start_idx becomes 24 when both crc and restrictions are present.","locations":[{"ref":"lofty/src/id3/v2/write/mod.rs:146-158","code":"  146 | \t\tlet mut content_start_idx = 22;\n  147 | \n  148 | \t\tif has_restrictions {\n  149 | \t\t\tcontent_start_idx += 3;\n  150 | \t\t}\n  151 | \n  152 | \t\t// Skip 16 bytes\n  153 | \t\t//\n  154 | \t\t// Normal ID3v2 header (10)\n  155 | \t\t// Extended header (6)\n  156 | \t\tid3v2.seek(SeekFrom::Start(16))?;\n  157 | \n  158 | \t\tlet tag_contents = &id3v2.get_ref()[content_start_idx..];","lines":13,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/id3/v2/write/mod.rs#L146-L158"},{"ref":"lofty/src/id3/v2/write/mod.rs:243-249","code":"  243 | \t\tif let Some(restrictions) = flags.restrictions {\n  244 | \t\t\text_flags |= 0x10;\n  245 | \t\t\textended_header_size += 2;\n  246 | \n  247 | \t\t\theader.write_u8(1)?;\n  248 | \t\t\theader.write_u8(restrictions.as_bytes())?;\n  249 | \t\t}","lines":7,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/id3/v2/write/mod.rs#L243-L249"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`bytes_to_occupy_uint` returns 1/2/4 but never 3: when the natural byte count is 3 it bumps to 4.\nThe comment block in the spec area and the `SignedInteger`/`UnsignedInteger` docs claim integers are\nwritten in \"1-4 bytes\", implying 3 is allowed. Writing a 3-byte-representable unsigned value as 4\nbytes is harmless for readers but contradicts the documented shrinking behavior and wastes a byte;\nworth a comment explaining why 3 is intentionally skipped (some readers mishandle 3-byte ints).","fix":"Add a comment documenting that 3-byte integers are intentionally promoted to 4 bytes, or allow 3 bytes if no reader compatibility issue exists.","locations":[{"ref":"lofty/src/mp4/ilst/write.rs:711-721","code":"  711 | fn bytes_to_occupy_uint(uint: u32) -> usize {\n  712 | \tif uint == 0 {\n  713 | \t\treturn 1;\n  714 | \t}\n  715 | \n  716 | \tlet ret = 4 - (uint.to_le().leading_zeros() >> 3) as usize;\n  717 | \tif ret == 3 {\n  718 | \t\treturn 4;\n  719 | \t}\n  720 | \tret\n  721 | }","lines":11,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/mp4/ilst/write.rs#L711-L721"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `ilst_from_udta` and `find_audio_trak`, the byte accumulator (`read`) is initialized to 8 and\nincremented by `atom.len` per child, but the `meta`/`break` branch sets `meta_atom_size` and breaks\n*without* adding to `read`, and the loop bound is the parent's full length. The accounting mixes\n\"bytes consumed\" with the parent length inconsistently (e.g. `read += atom.len` happens both before\nand after `skip_atom` in different functions). This does not crash but can cause the loop to stop\nearly or read one atom too many on unusual layouts.","fix":"Track consumed bytes consistently using the reader's `stream_position`/`remaining_size` rather than a hand-maintained counter, and update it uniformly for every branch.","locations":[{"ref":"lofty/src/mp4/moov.rs:98-154","code":"   98 | \tlet mut read = 8;\n   99 | \tlet mut found_meta = false;\n  100 | \tlet mut meta_atom_size = 0;\n  101 | \n  102 | \twhile read < len {\n  103 | \t\tlet Some(atom) = reader.next()? else {\n  104 | \t\t\tbreak;\n  105 | \t\t};\n  106 | \n  107 | \t\tif atom.ident == AtomIdent::Fourcc(*b\"meta\") {\n  108 | \t\t\tfound_meta = true;\n  109 | \t\t\tmeta_atom_size = atom.len;\n  110 | \t\t\tbreak;\n  111 | \t\t}\n  112 | \n  113 | \t\tread += atom.len;\n  114 | \t\tskip_atom(reader, atom.extended, atom.len)?;\n  115 | \t}\n  116 | \n  117 | \tif !found_meta {\n  118 | \t\treturn Ok(None);\n  119 | \t}\n  120 | \n  121 | \t// It's possible for the `meta` atom to be non-full,\n  122 | \t// so we have to check for that case\n  123 | \tlet full_meta_atom = meta_is_full(reader)?;\n  124 | \n  125 | \tif full_meta_atom {\n  126 | \t\tread = 12;\n  127 | \t} else {\n  128 | \t\tread = 8;\n  129 | \t}\n  130 | \n  131 | \tlet mut found_ilst = false;\n  132 | \tlet mut ilst_atom_size = 0;\n  133 | \n  134 | \twhile read < meta_atom_size {\n  135 | \t\tlet Some(atom) = reader.next()? else {\n  136 | \t\t\tbreak;\n  137 | \t\t};\n  138 | \n  139 | \t\tif atom.ident == AtomIdent::Fourcc(*b\"ilst\") {\n  140 | \t\t\tfound_ilst = true;\n  141 | \t\t\tilst_atom_size = atom.len;\n  142 | \t\t\tbreak;\n  143 | \t\t}\n  144 | \n  145 | \t\tread += atom.len;\n  146 | \t\tskip_atom(reader, atom.extended, atom.len)?;\n  147 | \t}\n  148 | \n  149 | \tif found_ilst {\n  150 | \t\treturn parse_ilst(reader, parse_options, ilst_atom_size - 8).map(Some);\n  151 | \t}\n  152 | \n  153 | \tOk(None)\n  154 | }","lines":57,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/mp4/moov.rs#L98-L154"},{"ref":"lofty/src/mp4/properties.rs:312-353","code":"  312 | \t\tlet mut read = 8;\n  313 | \t\twhile read < mdia.len {\n  314 | \t\t\tlet Some(atom) = reader.next()? else { break };\n  315 | \n  316 | \t\t\tread += atom.len;\n  317 | \n  318 | \t\t\tif let AtomIdent::Fourcc(fourcc) = atom.ident {\n  319 | \t\t\t\tmatch &fourcc {\n  320 | \t\t\t\t\tb\"mdhd\" => {\n  321 | \t\t\t\t\t\tskip_atom(reader, atom.extended, atom.len)?;\n  322 | \t\t\t\t\t\tmdhd = Some(atom)\n  323 | \t\t\t\t\t},\n  324 | \t\t\t\t\tb\"hdlr\" => {\n  325 | \t\t\t\t\t\tif atom.len < 20 {\n  326 | \t\t\t\t\t\t\tlog::warn!(\"Incomplete 'hdlr' atom, skipping\");\n  327 | \t\t\t\t\t\t\tskip_atom(reader, atom.extended, atom.len)?;\n  328 | \t\t\t\t\t\t\tcontinue;\n  329 | \t\t\t\t\t\t}\n  330 | \n  331 | \t\t\t\t\t\t// The hdlr atom is followed by 8 zeros\n  332 | \t\t\t\t\t\treader.seek(SeekFrom::Current(8))?;\n  333 | \n  334 | \t\t\t\t\t\tlet mut handler_type = [0; 4];\n  335 | \t\t\t\t\t\treader.read_exact(&mut handler_type)?;\n  336 | \n  337 | \t\t\t\t\t\tif &handler_type == b\"soun\" {\n  338 | \t\t\t\t\t\t\taudio_track = true\n  339 | \t\t\t\t\t\t}\n  340 | \n  341 | \t\t\t\t\t\tskip_atom(reader, atom.extended, atom.len - 12)?;\n  342 | \t\t\t\t\t},\n  343 | \t\t\t\t\tb\"minf\" => minf = Some(atom),\n  344 | \t\t\t\t\t_ => {\n  345 | \t\t\t\t\t\
