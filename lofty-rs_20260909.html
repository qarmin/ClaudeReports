{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"ReplayGain clamping uses an exclusive upper bound, silently zeroing legitimate maximum values.\n`if !(0..i16::MAX).contains(&gain) { return 0; }` rejects `gain == i16::MAX` (32767) even though it\nis a valid representable result, mapping it to 0 (no gain). The bound should be inclusive\n(`0..=i16::MAX`). Additionally, computing `gain` via `(... ) as i16` from an f32 can saturate/wrap\nbefore the range check, but the off-by-one in the bound is the concrete defect.","fix":"Use an inclusive range `(0..=i16::MAX).contains(&gain)`, or clamp the f32 before casting.","locations":[{"ref":"lofty/src/musepack/sv7/properties.rs:332-342","code":"  332 | \t\tlet set_replay_gain = |gain: u16| -> i16 {\n  333 | \t\t\tif gain == 0 {\n  334 | \t\t\t\treturn 0;\n  335 | \t\t\t}\n  336 | \n  337 | \t\t\tlet gain = ((MPC_OLD_GAIN_REF - f32::from(gain) / 100.0) * 256.0 + 0.5) as i16;\n  338 | \t\t\tif !(0..i16::MAX).contains(&gain) {\n  339 | \t\t\t\treturn 0;\n  340 | \t\t\t}\n  341 | \t\t\tgain\n  342 | \t\t};","lines":11,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/musepack/sv7/properties.rs#L332-L342"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`PictureType::from_ape_key` returns `Self::Undefined(0)` for unknown keys, but `Undefined(0)` is indistinguishable from `Other` (which maps to/from u8 value 0). Round-tripping an unrecognized APE key therefore silently becomes the `Other` picture type with no way for callers to detect that the key was unknown, unlike the analogous `from_u8` which preserves the original byte.","fix":"Either return a dedicated sentinel/`Option`, or document that unknown APE keys collapse to `Other`. At minimum avoid `Undefined(0)` which aliases `Other`.","locations":[{"ref":"lofty/src/picture/mod.rs:275-300","code":"  275 | \tpub fn from_ape_key(key: &str) -> Self {\n  276 | \t\tmatch key {\n  277 | \t\t\t\"Cover Art (Other)\" => Self::Other,\n  278 | \t\t\t\"Cover Art (Png Icon)\" => Self::Icon,\n  279 | \t\t\t\"Cover Art (Icon)\" => Self::OtherIcon,\n  280 | \t\t\t\"Cover Art (Front)\" => Self::CoverFront,\n  281 | \t\t\t\"Cover Art (Back)\" => Self::CoverBack,\n  282 | \t\t\t\"Cover Art (Leaflet)\" => Self::Leaflet,\n  283 | \t\t\t\"Cover Art (Media)\" => Self::Media,\n  284 | \t\t\t\"Cover Art (Lead Artist)\" => Self::LeadArtist,\n  285 | \t\t\t\"Cover Art (Artist)\" => Self::Artist,\n  286 | \t\t\t\"Cover Art (Conductor)\" => Self::Conductor,\n  287 | \t\t\t\"Cover Art (Band)\" => Self::Band,\n  288 | \t\t\t\"Cover Art (Composer)\" => Self::Composer,\n  289 | \t\t\t\"Cover Art (Lyricist)\" => Self::Lyricist,\n  290 | \t\t\t\"Cover Art (Recording Location)\" => Self::RecordingLocation,\n  291 | \t\t\t\"Cover Art (During Recording)\" => Self::DuringRecording,\n  292 | \t\t\t\"Cover Art (During Performance)\" => Self::DuringPerformance,\n  293 | \t\t\t\"Cover Art (Video Capture)\" => Self::ScreenCapture,\n  294 | \t\t\t\"Cover Art (Fish)\" => Self::BrightFish,\n  295 | \t\t\t\"Cover Art (Illustration)\" => Self::Illustration,\n  296 | \t\t\t\"Cover Art (Band Logotype)\" => Self::BandLogo,\n  297 | \t\t\t\"Cover Art (Publisher Logotype)\" => Self::PublisherLogo,\n  298 | \t\t\t_ => Self::Undefined(0),\n  299 | \t\t}\n  300 | \t}","lines":26,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/picture/mod.rs#L275-L300"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In the ID3v2 map the format key \"TEXT\" is mapped twice in two separate rules: `\"TEXT\" => Writer` and `\"TEXT\" => Lyricist`. Because `get_item_key` builds the lookup via `map.insert($key, values)`, the second insertion overwrites the first, so `ItemKey::from_key(TagType::Id3v2, \"TEXT\")` resolves to `Lyricist`, not `Writer`. The macro's own comment states \"The most applicable variant must appear first\", implying `Writer` (which appears first) should win. The result is silently determined by declaration order in a non-obvious, easy-to-break way.","fix":"Decide explicitly which `ItemKey` \"TEXT\" should resolve to and either merge into a single `\"TEXT\" => Writer | Lyricist` rule (where `values[0]` deterministically wins) or remove the duplicate. Additionally, make `get_item_key` not silently overwrite on duplicate keys (e.g. keep the first inserted value) so declaration order matches the documented contract.","locations":[{"ref":"lofty/src/tag/item.rs:190","code":"  190 | \t\"TEXT\"                                  => Writer,","lines":1,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/tag/item.rs#L190"},{"ref":"lofty/src/tag/item.rs:194","code":"  194 | \t\"TEXT\"                                  => Lyricist,","lines":1,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/tag/item.rs#L194"},{"ref":"lofty/src/tag/item.rs:66","code":"   66 | \t\t\t\t\t\t\t\tmap.insert($key, values);","lines":1,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/tag/item.rs#L66"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`F80::as_f64` ignores the explicit integer (J) bit of the 80-bit extended format and always treats the value as normalized: it masks the fraction to 63 bits (`& 0x7FFF_FFFF_FFFF_FFFF`) and rebuilds an f64 mantissa without distinguishing the normalized (i=1) vs denormalized (i=0) cases described in the comment just above (lines 80-85). For true denormalized F80 inputs this yields an incorrect f64. In practice AIFF sample rates are always normalized so it is not currently triggered, but the code does not implement what its own comment documents.","fix":"Inspect the integer bit (bit 63 of `fraction`) and handle the denormalized case, or narrow the comment to state that only normalized inputs are supported.","locations":[{"ref":"lofty/src/util/math.rs:80-91","code":"   80 | \t\t// 0 <= e <= 32766, i = 0, f = 0\n   81 | \t\tif self.fraction == 0 {\n   82 | \t\t\treturn f64::from_bits(sign << 63);\n   83 | \t\t}\n   84 | \n   85 | \t\t// 0 <= e <= 32766, 0 <= i <= 1, f >= 0\n   86 | \n   87 | \t\tlet fraction = self.fraction & 0x7FFF_FFFF_FFFF_FFFF;\n   88 | \t\tlet exponent = self.exponent as i16 - 16383 + 1023;\n   89 | \t\tlet bits = (sign << 63) | ((exponent as u64) << 52) | (fraction >> 11);\n   90 | \n   91 | \t\tf64::from_bits(bits)","lines":12,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/util/math.rs#L80-L91"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`header.rs` validates the segment count with `if segments < 1` where `segments` is a `u8`. This is equivalent to `segments == 0`. The `< 1` form on an unsigned type is confusing and triggers clippy's `absurd_extreme_comparisons`-style concerns; more importantly it obscures that the only rejected value is 0.","fix":"Use `if segments == 0` for clarity.","locations":[{"ref":"ogg_pager/src/header.rs:81-85","code":"   81 | \t\tlet segments = data.read_u8()?;\n   82 | \n   83 | \t\tif segments < 1 {\n   84 | \t\t\treturn Err(PageError::BadSegmentCount);\n   85 | \t\t}","lines":5,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/ogg_pager/src/header.rs#L81-L85"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The final completeness check compares `packet_sizes.len() != count as usize`, but the read loop tracks progress with a separate counter `packets_read` and breaks when `packets_read == count`. These two counters are maintained independently (packets_read is only incremented when `count != -1`), making the post-loop validation fragile: if the loop exits early via the `while let Ok(..)` condition (a page failing to parse) rather than the explicit `break 'outer`, the error path depends on `packet_sizes.len()` rather than the counter actually driving the loop. Consolidating on one counter would remove the duplicated bookkeeping and the chance of them disagreeing.","fix":"Drive both the early-break and the final check from a single source of truth (e.g. `packet_sizes.len()`).","locations":[{"ref":"ogg_pager/src/packets.rs:82-129","code":"   82 | \t\tlet mut packets_read = 0;\n   83 | \n   84 | \t\tlet mut packet_size = 0_u64;\n   85 | \t\tlet mut packet_bytes_already_read = None;\n   86 | \t\tlet mut current_packet_content;\n   87 | \t\t'outer: while let Ok(header) = PageHeader::read(data) {\n   88 | \t\t\tfor i in header.segments {\n   89 | \t\t\t\tpacket_size += u64::from(i);\n   90 | \n   91 | \t\t\t\tif i < 255 {\n   92 | \t\t\t\t\tif count != -1 {\n   93 | \t\t\t\t\t\tpackets_read += 1;\n   94 | \t\t\t\t\t}\n   95 | \n   96 | \t\t\t\t\tlet byte_count_to_read =\n   97 | \t\t\t\t\t\tSelf::get_byte_count_to_read(packet_size, &mut packet_bytes_already_read);\n   98 | \n   99 | \t\t\t\t\tcurrent_packet_content = vec![0; byte_count_to_read as usize];\n  100 | \t\t\t\t\tdata.read_exact(&mut current_packet_content)?;\n  101 | \n  102 | \t\t\t\t\tpacket_sizes.push(packet_size);\n  103 | \t\t\t\t\tpacket_size = 0;\n  104 | \t\t\t\t\tpacket_bytes_already_read = None;\n  105 | \n  106 | \t\t\t\t\tcontent.append(&mut current_packet_content);\n  107 | \n  108 | \t\t\t\t\tif packets_read == count {\n  109 | \t\t\t\t\t\tbreak 'outer;\n  110 | \t\t\t\t\t}\n  111 | \t\t\t\t}\n  112 | \t\t\t}\n  113 | \n  114 | \t\t\t// The packet continues on the next page, write what we can so far\n  115 | \t\t\tif packet_size != 0 {\n  116 | \t\t\t\tlet byte_count_to_read =\n  117 | \t\t\t\t\tSelf::get_byte_count_to_read(packet_size, &mut packet_bytes_already_read);\n  118 | \n  119 | \t\t\t\tcurrent_packet_content = vec![0; byte_count_to_read as usize];\n  120 | \t\t\t\tdata.read_exact(&mut current_packet_content)?;\n  121 | \t\t\t\tcontent.append(&mut current_packet_content);\n  122 | \t\t\t}\n  123 | \n  124 | \t\t\tcontinue;\n  125 | \t\t}\n  126 | \n  127 | \t\tif count != -1 && packet_sizes.len() != count as usize {\n  128 | \t\t\treturn Err(PageError::NotEnoughData);\n  129 | \t\t}","lines":48,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/ogg_pager/src/packets.rs#L82-L129"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`paginate` checks `if flags & CONTAINS_LAST_PAGE_OF_BITSTREAM == 0x04`. Comparing the masked result against the literal `0x04` instead of `!= 0` works only because `CONTAINS_LAST_PAGE_OF_BITSTREAM` happens to equal 0x04, but it is brittle: if the flag value ever changes the masked comparison silently breaks. The idiomatic form is `flags & FLAG != 0`.","fix":"Use `flags & CONTAINS_LAST_PAGE_OF_BITSTREAM != 0`.","locations":[{"ref":"ogg_pager/src/paginate.rs:149","code":"  149 | \tif flags & CONTAINS_LAST_PAGE_OF_BITSTREAM == 0x04","lines":1,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/ogg_pager/src/paginate.rs#L149"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`Moov::find`, `Moov::parse`, and `mdat_length` drive their loops with `while let Ok(Some(atom)) =\nreader.next()`. Any `Err` returned by `reader.next()` (e.g. `SizeMismatch`, `BadAtom`) is silently\nswallowed and treated as end-of-iteration rather than being propagated. This means genuine parse\nerrors in `Strict` mode are quietly ignored at the top level, and `Moov::find` will simply report\n\"No moov atom found\" instead of the real underlying error.","fix":"Match on the result explicitly and propagate `Err` (at least in `ParsingMode::Strict`), only treating `Ok(None)` as loop termination.","locations":[{"ref":"lofty/src/mp4/moov.rs:26-33","code":"   26 | \t\twhile let Ok(Some(atom)) = reader.next() {\n   27 | \t\t\tif atom.ident == AtomIdent::Fourcc(*b\"moov\") {\n   28 | \t\t\t\tmoov = Some(atom);\n   29 | \t\t\t\tbreak;\n   30 | \t\t\t}\n   31 | \n   32 | \t\t\tskip_atom(reader, atom.extended, atom.len)?;\n   33 | \t\t}","lines":8,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/mp4/moov.rs#L26-L33"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"In the OGG write path, after rewriting the header pages the remaining audio pages are re-read and re-numbered with `while let Ok(mut page) = Page::read(&mut pages_reader)`. Any parse error on the trailing data terminates the loop silently, so a corrupt or truncated page in the remainder is dropped without warning and the rest of the file's audio is lost on write-back, with no error returned to the caller. I/O errors are likewise swallowed.","fix":"Match on the read result; break only on a clean EOF and propagate genuine errors (or at minimum log a warning) so silent data loss during tag writing is detectable.","locations":[{"ref":"lofty/src/ogg/tag/write.rs:123-132","code":"  123 | \tlet mut pages_reader = Cursor::new(&remaining_file_content[..]);\n  124 | \tlet mut idx = 0;\n  125 | \twhile let Ok(mut page) = Page::read(&mut pages_reader) {\n  126 | \t\tlet header = page.header_mut();\n  127 | \t\theader.sequence_number = pages_written + idx;\n  128 | \t\tpage.gen_crc();\n  129 | \t\tfile.write_all(&page.as_bytes())?;\n  130 | \n  131 | \t\tidx += 1;\n  132 | \t}","lines":10,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/ogg/tag/write.rs#L123-L132"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`Packets::read_count` drives its loop with `while let Ok(header) = PageHeader::read(data)`, which silently swallows every error from page-header parsing (I/O errors, missing magic, bad version, bad segment count). A truncated or corrupt stream simply terminates the loop as if the data ended cleanly. When `count == -1` (read all) this means a corrupt page in the middle is indistinguishable from EOF and no error is ever reported. Genuine I/O errors are also hidden.","fix":"Distinguish EOF/clean termination from real errors: match on the result and break only on the expected end condition, propagating I/O errors (and, in strict mode, malformed-page errors).","locations":[{"ref":"ogg_pager/src/packets.rs:87","code":"   87 | \t\t'outer: while let Ok(header) = PageHeader::read(data) {","lines":1,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/ogg_pager/src/packets.rs#L87"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In `EventTimingCodesFrame::parse`, the loop reads an event-type byte with `while let Ok(...)` (a\nread error / EOF cleanly ends the loop), but then reads the 4-byte timestamp with `?`, which\npropagates an error. A truncated frame that ends after an event-type byte but before its 4-byte\ntimestamp turns a recoverable \"end of events\" into a hard parse error, inconsistent with the\nloop's own tolerant handling of the event-type byte.","fix":"Read the timestamp tolerantly too (e.g. break the loop if the `read_u32` fails) so a trailing\npartial event is ignored rather than aborting the whole frame, matching the event-type handling.","locations":[{"ref":"lofty/src/id3/v2/items/event_timing_codes_frame.rs:283-291","code":"  283 | \t\t\twhile let Ok(event_type_byte) = reader.read_u8() {\n  284 | \t\t\t\tlet event_type = EventType::from_u8(event_type_byte);\n  285 | \t\t\t\tlet timestamp = reader.read_u32::<BigEndian>()?;\n  286 | \n  287 | \t\t\t\tevents.push(Event {\n  288 | \t\t\t\t\tevent_type,\n  289 | \t\t\t\t\ttimestamp,\n  290 | \t\t\t\t})\n  291 | \t\t\t}","lines":9,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/id3/v2/items/event_timing_codes_frame.rs#L283-L291"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`Tag::date()` parses with `ParsingMode::Relaxed` and uses `.ok().flatten()`, silently discarding any parse error. `try_parse_timestamp` (used elsewhere in this module for the same purpose) at least logs a warning on failure. `date()` swallows malformed timestamps with no diagnostic, making it harder to debug why a date \"disappears\". Behavior is also inconsistent with `try_parse_timestamp`.","fix":"Route `date()` through `try_parse_timestamp` (or otherwise log on parse failure) so the two timestamp read paths behave consistently and a failed parse is at least observable in logs.","locations":[{"ref":"lofty/src/tag/mod.rs:189-197","code":"  189 | \tfn date(&self) -> Option<Timestamp> {\n  190 | \t\tself.get_string(ItemKey::RecordingDate)\n  191 | \t\t\t.or_else(|| self.get_string(ItemKey::Year))\n  192 | \t\t\t.and_then(|d| {\n  193 | \t\t\t\tTimestamp::parse(&mut d.as_bytes(), ParsingMode::Relaxed)\n  194 | \t\t\t\t\t.ok()\n  195 | \t\t\t\t\t.flatten()\n  196 | \t\t\t})\n  197 | \t}","lines":9,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/tag/mod.rs#L189-L197"},{"ref":"lofty/src/tag/mod.rs:122-130","code":"  122 | #[must_use]\n  123 | pub(crate) fn try_parse_timestamp(input: &str) -> Option<Timestamp> {\n  124 | \tlet Ok(timestamp) = Timestamp::parse(&mut input.as_bytes(), ParsingMode::Relaxed) else {\n  125 | \t\tlog::warn!(\"Timestamp exists in file, but cannot be parsed.\");\n  126 | \t\treturn None;\n  127 | \t};\n  128 | \n  129 | \ttimestamp\n  130 | }","lines":9,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/tag/mod.rs#L122-L130"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`read_to_terminator` for UTF-16 reads byte pairs via `(reader.read_u8(), reader.read_u8())`. If the stream ends after an odd number of bytes (a trailing lone byte before EOF), the `while let (Ok(b1), Ok(b2))` pattern fails to match and the already-read `b1` is silently discarded. The dropped byte is also not reflected in the returned length, so callers tracking `bytes_read` will be off by one on malformed input.","fix":"After the loop, account for a dangling final byte (push it / include it in the length), or document that trailing odd bytes are intentionally dropped.","locations":[{"ref":"lofty/src/util/text.rs:409-419","code":"  409 | \t\tTextEncoding::UTF16 | TextEncoding::UTF16BE => {\n  410 | \t\t\twhile let (Ok(b1), Ok(b2)) = (reader.read_u8(), reader.read_u8()) {\n  411 | \t\t\t\tif b1 == 0 && b2 == 0 {\n  412 | \t\t\t\t\tterminator_len = 2;\n  413 | \t\t\t\t\tbreak;\n  414 | \t\t\t\t}\n  415 | \n  416 | \t\t\t\ttext_bytes.push(b1);\n  417 | \t\t\t\ttext_bytes.push(b2)\n  418 | \t\t\t}\n  419 | \t\t},","lines":11,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/util/text.rs#L409-L419"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`Id3v1Tag::set_track` casts the incoming `u32` to `u8` with `value as u8`, silently truncating. A\ncaller setting track 256 ends up storing track 0 (which the format treats as \"no track\"), and 257\nbecomes 1, etc., with no error or warning. Other ID3v1 setters that can lose data at least clamp or\ntruncate visibly; this one corrupts the value.","fix":"Clamp to u8::MAX (or ignore values > 255) and/or log a warning, e.g. `self.track_number = Some(u8::try_from(value).unwrap_or(u8::MAX));`.","locations":[{"ref":"lofty/src/id3/v1/tag.rs:169-171","code":"  169 | \tfn set_track(&mut self, value: u32) {\n  170 | \t\tself.track_number = Some(value as u8);\n  171 | \t}","lines":3,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/id3/v1/tag.rs#L169-L171"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"negligible","difficulty":"medium","description":"`impl<'a> Into<Cow<'a, str>> for FrameId<'a>` implements `Into` directly instead of `From`. This is\nthe `from_over_into` anti-pattern: implementing `From<FrameId> for Cow` would give the `Into`\nimplementation for free and also provide the reverse-direction ergonomics. As written, callers only\nget `Into`, and the blanket `From` is unavailable.","fix":"Replace with `impl<'a> From<FrameId<'a>> for Cow<'a, str> { fn from(id: FrameId<'a>) -> Self {\nid.into_inner() } }`.","locations":[{"ref":"lofty/src/id3/v2/frame/header/mod.rs:213-217","code":"  213 | impl<'a> Into<Cow<'a, str>> for FrameId<'a> {\n  214 | \tfn into(self) -> Cow<'a, str> {\n  215 | \t\tself.into_inner()\n  216 | \t}\n  217 | }","lines":5,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/id3/v2/frame/header/mod.rs#L213-L217"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"high","difficulty":"medium","description":"`gen_map!`-generated `get_item_key` builds a `HashMap<&str, &[ItemKey]>` in a `LazyLock`, but then never uses it as a hash map. It does `INSTANCE.iter().find(|(k, _)| k.eq_ignore_ascii_case(key))`, which is a full O(n) linear scan with a case-insensitive comparison on every single lookup. The maps are large (the ID3v2 and ILST maps have ~70-90 entries each), and `ItemKey::from_key` is called for every key while parsing a tag, making tag parsing O(items * map_size). The whole point of the HashMap (O(1) lookup) is defeated; it would have been just as fast to store a `&[(&str, &[ItemKey])]` slice.","fix":"Normalize keys to ASCII-lowercase when building the map (store lowercased static keys) and look up with `INSTANCE.get(key.to_ascii_lowercase().as_str())`, or build a case-insensitive hashing wrapper. Either approach restores O(1) lookups instead of an O(n) scan per call.","locations":[{"ref":"lofty/src/tag/item.rs:60-72","code":"   60 | \t\t\t\tpub(crate) fn get_item_key(&self, key: &str) -> Option<ItemKey> {\n   61 | \t\t\t\t\tstatic INSTANCE: std::sync::LazyLock<HashMap<&'static str, &'static [ItemKey]>> = std::sync::LazyLock::new(|| {\n   62 | \t\t\t\t\t\tlet mut map = HashMap::new();\n   63 | \t\t\t\t\t\t$(\n   64 | \t\t\t\t\t\t\tlet values: &'static [ItemKey] = &[$(ItemKey::$variant,)+];\n   65 | \t\t\t\t\t\t\t$(\n   66 | \t\t\t\t\t\t\t\tmap.insert($key, values);\n   67 | \t\t\t\t\t\t\t)+\n   68 | \t\t\t\t\t\t)+\n   69 | \t\t\t\t\t\tmap\n   70 | \t\t\t\t\t});\n   71 | \t\t\t\t\tINSTANCE.iter().find(|(k, _)| k.eq_ignore_ascii_case(key)).map(|(_, v)| v[0])\n   72 | \t\t\t\t}","lines":13,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/tag/item.rs#L60-L72"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"On the OGG tag write path the entire remainder of the file after the header packets is read fully into memory (`file.read_to_end(&mut remaining_file_content)`), then parsed page-by-page from a `Cursor`, then written back out. For large audio files this doubles peak memory (full audio body buffered) and performs an extra full copy that could be streamed/seek-based instead.","fix":"Stream the trailing pages directly from the source file region rather than buffering the whole remainder in a Vec.","locations":[{"ref":"lofty/src/ogg/tag/write.rs:71-72","code":"   71 | \tlet mut remaining_file_content = Vec::new();\n   72 | \tfile.read_to_end(&mut remaining_file_content)?;","lines":2,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/ogg/tag/write.rs#L71-L72"},{"ref":"lofty/src/ogg/tag/write.rs:123-132","code":"  123 | \tlet mut pages_reader = Cursor::new(&remaining_file_content[..]);\n  124 | \tlet mut idx = 0;\n  125 | \twhile let Ok(mut page) = Page::read(&mut pages_reader) {\n  126 | \t\tlet header = page.header_mut();\n  127 | \t\theader.sequence_number = pages_written + idx;\n  128 | \t\tpage.gen_crc();\n  129 | \t\tfile.write_all(&page.as_bytes())?;\n  130 | \n  131 | \t\tidx += 1;\n  132 | \t}","lines":10,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/ogg/tag/write.rs#L123-L132"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`PictureType::from_str`/`MimeType::from_str` calls `mime_type.to_lowercase()` allocating a new `String` on every lookup. `from_ape_key` also does linear string matching. These are minor, but `MimeType::from_str` in particular is on hot picture-parsing paths and allocates even when the input is already lowercase.","fix":"Use `eq_ignore_ascii_case` comparisons against the known literals to avoid the allocation, falling back to `Unknown` for the rest.","locations":[{"ref":"lofty/src/picture/mod.rs:73-81","code":"   73 | \tpub fn from_str(mime_type: &str) -> Self {\n   74 | \t\tmatch &*mime_type.to_lowercase() {\n   75 | \t\t\t\"image/jpeg\" | \"image/jpg\" => Self::Jpeg,\n   76 | \t\t\t\"image/png\" => Self::Png,\n   77 | \t\t\t\"image/tiff\" => Self::Tiff,\n   78 | \t\t\t\"image/bmp\" => Self::Bmp,\n   79 | \t\t\t\"image/gif\" => Self::Gif,\n   80 | \t\t\t_ => Self::Unknown(mime_type.to_owned()),\n   81 | \t\t}","lines":9,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/picture/mod.rs#L73-L81"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`write_tag` and `dump_tag` clone the entire `Tag` (items + all pictures) for the MP4 path via `Into::<Ilst>::into(tag.clone())`. For a tag carrying large embedded artwork this duplicates all picture byte buffers purely to perform a read-only write/dump. Other formats in the same `match` take `&Tag` without cloning.","fix":"Provide a borrowing conversion `&Tag -> IlstRef` (analogous to the other `*Ref` types already used in this file, e.g. `Id3v2TagRef`/`VorbisCommentsRef`) so the MP4 write/dump path can operate without cloning the pictures.","locations":[{"ref":"lofty/src/tag/utils.rs:39-43","code":"   39 | \t\tFileType::Mp4 => crate::mp4::ilst::write::write_to(\n   40 | \t\t\tfile,\n   41 | \t\t\t&mut Into::<Ilst>::into(tag.clone()).as_ref(),\n   42 | \t\t\twrite_options,\n   43 | \t\t),","lines":5,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/tag/utils.rs#L39-L43"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`Page::gen_crc` calls `self.as_bytes()`, which allocates a fresh `Vec` containing the entire page (header + segment table + content) purely to feed it to `crc32`, then discards it. For every page written this is a full extra allocation and copy of the page content. The CRC could be computed incrementally over the header bytes and the content slice without materializing the combined buffer.","fix":"Compute the CRC by streaming the header fields and `self.content` through `crc32` incrementally, avoiding the temporary Vec.","locations":[{"ref":"ogg_pager/src/lib.rs:100-105","code":"  100 | \t/// Generates the CRC checksum of the page\n  101 | \tpub fn gen_crc(&mut self) {\n  102 | \t\t// The value is computed over the entire header (with the CRC field in the header set to zero) and then continued over the page\n  103 | \t\tself.header.checksum = 0;\n  104 | \t\tself.header.checksum = crc::crc32(&self.as_bytes());\n  105 | \t}","lines":6,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/ogg_pager/src/lib.rs#L100-L105"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`get_byte_count_to_read` contains dead arithmetic in the `Some` branch: it sets `*packet_bytes_already_read = Some(*already_read_bytes_count + byte_count_to_read)` where `byte_count_to_read = packet_size - *already_read_bytes_count`, so the stored value simplifies to exactly `packet_size`. The running total is therefore needlessly recomputed via a subtraction-then-addition round trip, and the `Option` exists only to encode \"first chunk vs. later chunk\", which is already implied by `packet_size`. The logic is harder to follow than necessary.","fix":"Simplify: `let to_read = packet_size - already_read; *packet_bytes_already_read = Some(packet_size);`.","locations":[{"ref":"ogg_pager/src/packets.rs:137-154","code":"  137 | \tfn get_byte_count_to_read(\n  138 | \t\tpacket_size: u64,\n  139 | \t\tpacket_bytes_already_read: &mut Option<u64>,\n  140 | \t) -> u64 {\n  141 | \t\tlet byte_count_to_read;\n  142 | \t\tmatch packet_bytes_already_read {\n  143 | \t\t\tSome(already_read_bytes_count) => {\n  144 | \t\t\t\tbyte_count_to_read = packet_size - *already_read_bytes_count;\n  145 | \t\t\t\t*packet_bytes_already_read = Some(*already_read_bytes_count + byte_count_to_read);\n  146 | \t\t\t},\n  147 | \t\t\tNone => {\n  148 | \t\t\t\tbyte_count_to_read = packet_size;\n  149 | \t\t\t\t*packet_bytes_already_read = Some(packet_size);\n  150 | \t\t\t},\n  151 | \t\t}\n  152 | \n  153 | \t\tbyte_count_to_read\n  154 | \t}","lines":18,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/ogg_pager/src/packets.rs#L137-L154"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`TextInformationFrame::as_bytes` encodes the text first, then `content.insert(0, encoding as u8)`,\nwhich is an O(n) shift of the entire encoded buffer to prepend a single encoding byte. Text frames\nare one of the most common frame types, so this prepend happens for nearly every written tag. The\nsame pattern appears in `TimestampFrame::as_bytes`.","fix":"Build the buffer with the encoding byte first, e.g. `let mut content = vec![encoding as u8];\ncontent.extend(encoding.encode(...)?);` to avoid the front insertion.","locations":[{"ref":"lofty/src/id3/v2/items/text_information_frame.rs:115-117","code":"  115 | \t\tlet mut content = encoding.encode(&self.value, false, write_options.lossy_text_encoding)?;\n  116 | \t\tcontent.insert(0, encoding as u8);\n  117 | \t\tOk(content)","lines":3,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/id3/v2/items/text_information_frame.rs#L115-L117"},{"ref":"lofty/src/id3/v2/items/timestamp_frame.rs:135-140","code":"  135 | \t\tlet mut encoded_text = encoding.encode(\n  136 | \t\t\t&self.timestamp.to_string(),\n  137 | \t\t\tfalse,\n  138 | \t\t\twrite_options.lossy_text_encoding,\n  139 | \t\t)?;\n  140 | \t\tencoded_text.insert(0, encoding as u8);","lines":6,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/id3/v2/items/timestamp_frame.rs#L135-L140"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"In `ExtendedTextFrame::parse`, the UTF-16 block returns early when `raw_text.is_empty()` (line 125),\nso by the time the `match bom` at line 139 is reached `raw_text` is guaranteed non-empty. The match\narm `[0x00, 0x00] if raw_text.is_empty() => { ... }` therefore can never be taken; its guard is\nalways false. The body (including the `debug_assert!` and `break 'utf16`) is dead code.","fix":"Remove the unreachable guarded arm. The following `[0x00, 0x00] => { err!(...) }` arm already covers\nthe \"no BOM\" case for non-empty text.","locations":[{"ref":"lofty/src/id3/v2/items/extended_text_frame.rs:150-155","code":"  150 | \t\t\t\t\t[0x00, 0x00] if raw_text.is_empty() => {\n  151 | \t\t\t\t\t\tdebug_assert!(description.content.is_empty());\n  152 | \t\t\t\t\t\t// Empty string\n  153 | \t\t\t\t\t\tframe_content = String::new();\n  154 | \t\t\t\t\t\tbreak 'utf16;\n  155 | \t\t\t\t\t},","lines":6,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/id3/v2/items/extended_text_frame.rs#L150-L155"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`let _ = next_fourcc.escape_ascii();` computes an `EscapeAscii` iterator and immediately discards it. `escape_ascii` has no side effects, so the line does nothing (likely a leftover from a debug/log statement). Dead code that obscures intent.","fix":"Remove the line, or, if it was meant for logging, turn it into an actual `log::debug!` call using the escaped bytes.","locations":[{"ref":"lofty/src/iff/chunk.rs:215","code":"  215 | \t\t\tlet _ = next_fourcc.escape_ascii();","lines":1,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/iff/chunk.rs#L215"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"`AtomInfo` derives/stores an `extended` flag and a `header_size()` helper, but several skip paths\nignore the distinction and assume an 8-byte header. Conversely, the commented-out seek in\n`ContextualAtom::read` (`// reader.seek(SeekFrom::Current(*reader_len as i64))?;`) is leftover dead\ncode with no explanation of why remaining bytes are not skipped.","fix":"Remove the commented-out line, or restore it with a comment explaining the invariant (children already consume the full container).","locations":[{"ref":"lofty/src/mp4/write.rs:84","code":"   84 | \t\t// reader.seek(SeekFrom::Current(*reader_len as i64))?; // Skip any remaining bytes","lines":1,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/mp4/write.rs#L84"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"Misleading doc comment on `search_for_frame_sync`'s return value. The comment states the function \"returns the\nindex relative to this beginning\" and \"will return the first match\", and the implementation comment describes\nanalyzing overlapping pairs starting at `[0x01,0x02]`. However the returned `index` comes from\n`iterator.enumerate()` which begins enumerating only after the first byte was already consumed into\n`buffer[0]`, so `index` is the position of the *second* byte of the matching pair, i.e. it equals the offset of\nthe frame-sync's first byte only because of that one-byte skew. The reasoning is subtle and the comment does\nnot explain the off-by-one bookkeeping, making the function easy to misread/misuse by callers computing\nabsolute offsets.","fix":"Clarify the comment to state explicitly that `buffer[0]` is pre-loaded with the first byte before enumeration,\nso the enumerated `index` already corresponds to the offset of the first byte of the matched 2-byte frame sync.","locations":[{"ref":"lofty/src/mpeg/header.rs:13-44","code":"   13 | // Searches for a frame sync (11 set bits) in the reader.\n   14 | // The search starts at the beginning of the reader and returns the index relative to this beginning.\n   15 | // This will return the first match, if one is found.\n   16 | //\n   17 | // Note that the search searches in 8 bit steps, i.e. the first 8 bits need to be byte aligned.\n   18 | pub(crate) fn search_for_frame_sync<R>(input: &mut R) -> std::io::Result<Option<u64>>\n   19 | where\n   20 | \tR: Read,\n   21 | {\n   22 | \tlet mut iterator = input.bytes();\n   23 | \tlet mut buffer = [0u8; 2];\n   24 | \t// Read the first byte, as each iteration expects that buffer 0 was set from a previous iteration.\n   25 | \t// This is not the case in the first iteration, which is therefore a special case.\n   26 | \tif let Some(byte) = iterator.next() {\n   27 | \t\tbuffer[0] = byte?;\n   28 | \t}\n   29 | \t// Create a stream of overlapping 2 byte pairs\n   30 | \t//\n   31 | \t// Example:\n   32 | \t// [0x01, 0x02, 0x03, 0x04] should be analyzed as\n   33 | \t// [0x01, 0x02], [0x02, 0x03], [0x03, 0x04]\n   34 | \tfor (index, byte) in iterator.enumerate() {\n   35 | \t\tbuffer[1] = byte?;\n   36 | \t\t// Check the two bytes in the buffer\n   37 | \t\tif verify_frame_sync(buffer) {\n   38 | \t\t\treturn Ok(Some(index as u64));\n   39 | \t\t}\n   40 | \t\t// If they do not match, copy the last byte in the buffer to the front for the next iteration\n   41 | \t\tbuffer[0] = buffer[1];\n   42 | \t}\n   43 | \tOk(None)\n   44 | }","lines":32,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/mpeg/header.rs#L13-L44"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"The comment \"In the absolute *worst* case we'll do 3 more retries.\" is misleading: the retry loop in `find_last_page` is unbounded - it keeps calling `rfind`/`PageHeader::read` until a valid header is found or the backward search fails. There is no hard cap of 3 retries; the \"3\" is just an informal estimate based on max page size, not enforced by the code.","fix":"Reword the comment to reflect that the loop is bounded only by the search reaching `header_end`, not a fixed retry count.","locations":[{"ref":"lofty/src/ogg/mod.rs:63-93","code":"   63 | \t// In the absolute *worst* case we'll do 3 more retries. Realistically though, the last page in\n   64 | \t// the stream should be well below the maximum size.\n   65 | \tlet last_page_header;\n   66 | \tloop {\n   67 | \t\tlet current_pos = data.stream_position()?;\n   68 | \n   69 | \t\tmatch PageHeader::read(data) {\n   70 | \t\t\tOk(h) => {\n   71 | \t\t\t\tlast_page_header = h;\n   72 | \t\t\t\tbreak;\n   73 | \t\t\t},\n   74 | \t\t\t// False positive, keep searching\n   75 | \t\t\tErr(\n   76 | \t\t\t\tPageError::MissingMagic | PageError::InvalidVersion | PageError::BadSegmentCount,\n   77 | \t\t\t) => {\n   78 | \t\t\t\tdata.seek(SeekFrom::Start(current_pos))?;\n   79 | \n   80 | \t\t\t\tif !data\n   81 | \t\t\t\t\t.rfind(PATTERN)\n   82 | \t\t\t\t\t.buffer_size(BUFFER_SIZE)\n   83 | \t\t\t\t\t.start_pos(RevSearchStart::FromCurrent)\n   84 | \t\t\t\t\t.end_pos(RevSearchEnd::Pos(header_end))\n   85 | \t\t\t\t\t.search()?\n   86 | \t\t\t\t{\n   87 | \t\t\t\t\treturn Err(PageError::MissingMagic.into());\n   88 | \t\t\t\t}\n   89 | \t\t\t\tcontinue;\n   90 | \t\t\t},\n   91 | \t\t\tErr(err) => return Err(err.into()),\n   92 | \t\t}\n   93 | \t}","lines":31,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/ogg/mod.rs#L63-L93"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"The doc comment on `MAX_CONTENT_SIZE` claims \"An OGG page can have up to 255 segments, or ~64KB. We cap it at 32 segments, or ~8KB when writing.\" but the constant it documents is `MAX_SEGMENT_COUNT * 255` (255 segments, ~64KB) - i.e. the read-side maximum, not the 32-segment write cap. The comment describes `MAX_WRITTEN_CONTENT_SIZE` (defined just above), so it is attached to the wrong constant and misleads readers about what `MAX_CONTENT_SIZE` represents.","fix":"Move the 32-segment/8KB note to MAX_WRITTEN_CONTENT_SIZE and describe MAX_CONTENT_SIZE as the full 255-segment read maximum.","locations":[{"ref":"ogg_pager/src/lib.rs:21-25","code":"   21 | /// The maximum page content size\n   22 | // NOTE: An OGG page can have up to 255 segments, or ~64KB. We cap it at 32 segments, or ~8KB when writing.\n   23 | pub const MAX_CONTENT_SIZE: usize = MAX_SEGMENT_COUNT * 255;\n   24 | /// The maximum number of segments a page can contain\n   25 | pub const MAX_SEGMENT_COUNT: usize = 255;","lines":5,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/ogg_pager/src/lib.rs#L21-L25"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"The doc comment on `UniqueFileIdentifierFrame::identifier` states \"The binary payload with up to 64\nbytes of data\", but `parse` reads the identifier with `read_to_end` and imposes no 64-byte limit\n(the only bound is the surrounding frame size). The \"up to 64 bytes\" claim is misleading.","fix":"Either enforce the 64-byte limit during parsing/validation per the ID3v2 spec, or correct the doc\ncomment to reflect that no limit is enforced.","locations":[{"ref":"lofty/src/id3/v2/items/unique_file_identifier.rs:19-20","code":"   19 | \t/// The binary payload with up to 64 bytes of data.\n   20 | \tpub identifier: Cow<'a, [u8]>,","lines":2,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/id3/v2/items/unique_file_identifier.rs#L19-L20"},{"ref":"lofty/src/id3/v2/items/unique_file_identifier.rs:98-99","code":"   98 | \t\t\tlet mut identifier = Vec::new();\n   99 | \t\t\treader.read_to_end(&mut identifier)?;","lines":2,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/id3/v2/items/unique_file_identifier.rs#L98-L99"}]},
{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"Comment has a stray, unbalanced double-quote: `// handle bracketed refinement e.g. (55)((I think...)\"`.\nThe trailing `\"` is a typo and makes the example look malformed.","fix":"Remove the trailing stray double quote from the comment.","locations":[{"ref":"lofty/src/id3/v2/tag.rs:290","code":"  290 | \t\t\t// handle bracketed refinement e.g. (55)((I think...)\"","lines":1,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/id3/v2/tag.rs#L290"}]},
{"id":"OTHER_1","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"`FileType::from_ext` accepts the extension \"wave\" (mapped to `FileType::Wav`) and \"wave\" is mentioned in the\nmatch arm, but the public `EXTENSIONS` constant - documented as the filter list for scanning directories -\nomits \"wave\". A directory scan using `EXTENSIONS` (as shown in the doc example) will skip `.wave` files even\nthough Lofty can identify them by extension. The two lists are explicitly meant to be kept in sync (see the\n\"Also update ...\" comments).","fix":"Add \"wave\" to the `EXTENSIONS` array so it matches the `from_ext` match arm, or drop the \"wave\" arm if it is\nnot intended to be supported.","locations":[{"ref":"lofty/src/file/file_type.rs:40-44","code":"   40 | pub const EXTENSIONS: &[&str] = &[\n   41 | \t// Also update `FileType::from_ext()` below\n   42 | \t\"aac\", \"ape\", \"aiff\", \"aif\", \"afc\", \"aifc\", \"mp3\", \"mp2\", \"mp1\", \"wav\", \"wv\", \"opus\", \"flac\",\n   43 | \t\"ogg\", \"mp4\", \"m4a\", \"m4b\", \"m4p\", \"m4r\", \"m4v\", \"3gp\", \"mpc\", \"mp+\", \"mpp\", \"spx\",\n   44 | ];","lines":5,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/file/file_type.rs#L40-L44"},{"ref":"lofty/src/file/file_type.rs:207","code":"  207 | \t\t\t\"wav\" | \"wave\" => Some(Self::Wav),","lines":1,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/file/file_type.rs#L207"}]},
{"id":"OTHER_2","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"`TagItem::re_map` is a misnomer. Its name strongly implies it remaps/rewrites the item's key for the new `TagType`, but it only returns a `bool` indicating whether a mapping exists (a validity check); it never mutates the item. It is used in `Tag::re_map`, `Tag::insert`, and `Tag::push` purely as a predicate. The confusing name makes call sites like `self.retain(|i| i.re_map(tag_type))` hard to read.","fix":"Rename `TagItem::re_map` to something predicate-like, e.g. `supports_tag_type` or `is_valid_for`, to reflect that it only checks validity and does not perform a remap.","locations":[{"ref":"lofty/src/tag/item.rs:1245-1253","code":" 1245 | \tpub(crate) fn re_map(&self, tag_type: TagType) -> bool {\n 1246 | \t\tif tag_type == TagType::Id3v1 {\n 1247 | \t\t\tuse crate::id3::v1::constants::VALID_ITEMKEYS;\n 1248 | \n 1249 | \t\t\treturn VALID_ITEMKEYS.contains(&self.item_key);\n 1250 | \t\t}\n 1251 | \n 1252 | \t\tself.item_key.map_key(tag_type).is_some()\n 1253 | \t}","lines":9,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/tag/item.rs#L1245-L1253"},{"ref":"lofty/src/tag/mod.rs:250","code":"  250 | \t\tself.retain(|i| i.re_map(tag_type));","lines":1,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/tag/mod.rs#L250"},{"ref":"lofty/src/tag/mod.rs:369-370","code":"  369 | \tpub fn insert(&mut self, item: TagItem) -> bool {\n  370 | \t\tif item.re_map(self.tag_type) {","lines":2,"link":"https://github.com/Serial-ATA/lofty-rs/blob/d7c7daf6f6a1e034e5c7a5174493b809168c795b/lofty/src/tag/mod.rs#L369-L370"}]}

  <button class="action-btn" data-action="download-md">&#11015; MD</button>
  <button class="action-btn" data-action="download-md-short">&#11015; MD Short</button>
  <button class="action-btn" data-action="download-toml">&#11015; TOML</button>
</div>
<div id="hidden-bar"></div>
<div id="content"></div>
</div>
<script>
(function(){
'use strict';

// Data
const FINDINGS     = JSON.parse(document.getElementById('D').textContent);
const PROJECT_INFO = JSON.parse(document.getElementById('PI').textContent);
const SEVS     = ['critical','high','medium','low','negligible'];
const STATUSES = ['open','fixed','wont-fix','false-positive'];
const ALL_TYPES = [...new Set(FINDINGS.map(f => f.type))].sort();
// Build lookup map for O(1) access
const FINDING_BY_ID = new Map(FINDINGS.map(f => [f.id, f]));
// Only severities actually present in the report — the filter bar hides the rest.
const PRESENT_SEVS = SEVS.filter(s => FINDINGS.some(f => (f.severity || 'medium') === s));
// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.
const DIFFICULTY_ORDER = ['very_easy','easy','medium','hard'];
const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};
const PRESENT_DIFFS = DIFFICULTY_ORDER.filter(d => FINDINGS.some(f => f.difficulty === d));
const HAS_DIFFICULTY = PRESENT_DIFFS.length > 0;
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State
const S = {
  search: '', searchScope: 'all', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenDiff: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(),
};
const statuses = {};

// Persistence
function loadStatuses() {
  try { Object.assign(statuses, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch {}
}
function saveStatuses() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(statuses)); } catch {}
}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;
function syncHash() {
  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));
    if (S.search)            p.set('q',   S.search);
    if (S.searchScope !== 'all') p.set('qs', S.searchScope);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('qs'))  { S.searchScope = p.get('qs'); }
  document.getElementById('search-scope').classList.toggle('active', S.searchScope === 'locations');
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Render a "**Label:** value" line. GitHub/CommonMark only recognizes a
// ``` fence when it starts at the beginning of a line, so if the value
// itself opens with a fence, put it on its own line instead of right
// after the inline label - otherwise the fence marker gets glued onto
// "**Label:** ```" and never renders as a code block.
function mdField(label, value) {
  value = value || '';
  return /^```/.test(value.trim())
    ? '**' + label + ':**\n\n' + value
    : '**' + label + ':** ' + value;
}

// Render the "**Locations:**" block. When a location has a commit-pinned
// permalink (GitHub/GitLab), just paste the bare URL on its own line -
// GitHub/GitLab auto-expand a line-range blob link into an inline code
// preview, so re-pasting the snippet as a fenced block would duplicate it.
// Forges without a detected permalink shape (or missing commit/repo info)
// fall back to the fenced ref+snippet so the location is still readable.
function mdLocations(locations) {
  if (!locations.length) return '';
  let out = '**Locations:**\n\n';
  for (const l of locations) {
    if (l.link)               out += l.link + '\n\n';
    else if (l.code != null)  out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
    else                      out += '- `' + l.ref + '` _(file not found)_\n\n';
  }
  return out;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += mdField('Description', f.description) + '\n\n';
      out += mdLocations(f.locations);
      out += mdField('Fix', f.fix) + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build a [project] header block from embedded PROJECT_INFO, so the exported
// findings.toml is self-contained (doesn't depend on a sibling project-info.toml
// that a second, separately-triggered download could silently fail to save).
// '' when there is no project info at all.
function buildProjectToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = PROJECT_INFO || {};
  if (!Object.keys(pi).length) return '';
  const lines = ['[project]'];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n\n';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return buildProjectToml() + chunks.join('\n\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += mdField('Description', f.description) + '\n\n';
  out += mdLocations(f.locations);
  out += mdField('Fix', f.fix) + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystacks per finding (cleared on full re-render).
// Two variants: everything (default), and file/folder paths only - for when a
// search term (e.g. a directory name like 'dlls/abc') also happens to appear
// inside description/fix prose and you only want path matches.
const _hay = new Map();
const _hayLoc = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}
function hayLocOf(f) {
  if (!_hayLoc.has(f.id)) {
    _hayLoc.set(f.id, f.locations.map(l => l.ref).join(' ').toLowerCase());
  }
  return _hayLoc.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (S.searchScope === 'locations') {
      if (!hayLocOf(f).includes(q)) return false;
    } else if (!hayOf(f).includes(q) && !st.includes(q)) {
      return false;
    }
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  _hayLoc.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    // Single download (was two) - a second auto-triggered download is commonly
    // blocked by the browser unless the user explicitly allows it, which silently
    // drops project-info.toml. Embedding [project] in findings.toml itself avoids
    // that failure mode entirely.
    downloadText(buildFindingsToml(), 'findings.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});
document.getElementById('search-scope').addEventListener('click', e => {
  S.searchScope = S.searchScope === 'locations' ? 'all' : 'locations';
  e.currentTarget.classList.toggle('active', S.searchScope === 'locations');
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
