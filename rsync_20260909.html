{"id":"LOGIC_38","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"do_fallocate() returns the (mutated) `length` value when do_fstat() fails after a successful fallocate in the opts==0 path. `length` was deliberately altered just above (++/-- to mismatch the desired length), so on fstat failure the caller receives a wrong preallocated_len that does not correspond to the actual on-disk allocation. The real allocated size (st.st_blocks * S_BLKSIZE) is the intended return; a fstat failure silently substitutes a bogus number instead of an error.","fix":"On do_fstat() failure return -1 (an error) rather than the mutated `length`, or at least return the original requested length, not the +/-1 adjusted one. Confirm caller (receiver preallocated_len handling) tolerates the chosen value.","locations":[{"ref":"syscall.c:2673-2692","code":" 2673 | \tif (length & 1) /* make the length not match the desired length */\n 2674 | \t\tlength++;\n 2675 | \telse\n 2676 | \t\tlength--;\n 2677 | #if defined HAVE_FALLOCATE\n 2678 | \tret = fallocate(fd, opts, offset, length);\n 2679 | #elif defined HAVE_SYS_FALLOCATE\n 2680 | \tret = syscall(SYS_fallocate, fd, opts, (loff_t)offset, (loff_t)length);\n 2681 | #elif defined HAVE_EFFICIENT_POSIX_FALLOCATE\n 2682 | \tret = posix_fallocate(fd, offset, length);\n 2683 | #else\n 2684 | #error Coding error in SUPPORT_PREALLOCATION logic.\n 2685 | #endif\n 2686 | \tif (ret < 0)\n 2687 | \t\treturn ret;\n 2688 | \tif (opts == 0) {\n 2689 | \t\tSTRUCT_STAT st;\n 2690 | \t\tif (do_fstat(fd, &st) < 0)\n 2691 | \t\t\treturn length;\n 2692 | \t\treturn st.st_blocks * S_BLKSIZE;","lines":20,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/syscall.c#L2673-L2692"}]},
{"id":"LOGIC_39","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"list_file() in tls.c: storetime() formats into a fixed buffer; for the 't==0' branch it computes len = MIN(20 + 10*has_nsecs, destsize-1) and memsets spaces. But in the t!=0 branch, gmtime_r() can return NULL (e.g. for an out-of-range time_t such as a negative or far-future mtime read from an xattr via stat_xattr) and the code immediately dereferences mt->tm_year etc. without a NULL check, causing a NULL-pointer crash on corrupt/extreme timestamps.","fix":"Check 'if (!mt)' after gmtime_r and emit a placeholder/spaces instead of dereferencing.","locations":[{"ref":"tls.c:126-141","code":"  126 | static void storetime(char *dest, size_t destsize, time_t t, int nsecs)\n  127 | {\n  128 | \tif (t) {\n  129 | \t\tint len;\n  130 | \t\tstruct tm tmp, *mt = gmtime_r(&t, &tmp);\n  131 | \n  132 | \t\tlen = snprintf(dest, destsize,\n  133 | \t\t\t\" %04d-%02d-%02d %02d:%02d:%02d\",\n  134 | \t\t\t(int)mt->tm_year + 1900,\n  135 | \t\t\t(int)mt->tm_mon + 1,\n  136 | \t\t\t(int)mt->tm_mday,\n  137 | \t\t\t(int)mt->tm_hour,\n  138 | \t\t\t(int)mt->tm_min,\n  139 | \t\t\t(int)mt->tm_sec);\n  140 | \t\tif (nsecs >= 0 && len >= 0)\n  141 | \t\t\tsnprintf(dest + len, destsize - len, \".%09d\", nsecs);","lines":16,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/tls.c#L126-L141"}]},
{"id":"LOGIC_40","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"id_parse() detects overflow by checking 'tmp = num*10 + digit; if (tmp < num) goto invalid'. id_t may be an unsigned 32-bit type; num*10 can wrap to a value that is still >= num for certain inputs (the classic multiply-overflow gap), so some overflowing ID strings are accepted and silently produce a wrong (truncated/wrapped) id. The check catches addition overflow but not all multiplication overflow.","fix":"Check for multiplication overflow before computing: if (num > (ID_MAX - digit)/10) reject; or parse into a wider type and range-check against the id_t max.","locations":[{"ref":"uidlist.c:76-94","code":"   76 | static id_t id_parse(const char *num_str)\n   77 | {\n   78 | \tid_t tmp, num = 0;\n   79 | \tconst char *cp = num_str;\n   80 | \n   81 | \twhile (*cp) {\n   82 | \t\tif (!isDigit(cp)) {\n   83 | \t\t  invalid_num:\n   84 | \t\t\trprintf(FERROR, \"Invalid ID number: %s\\n\", num_str);\n   85 | \t\t\texit_cleanup(RERR_SYNTAX);\n   86 | \t\t}\n   87 | \t\ttmp = num * 10 + *cp++ - '0';\n   88 | \t\tif (tmp < num)\n   89 | \t\t\tgoto invalid_num;\n   90 | \t\tnum = tmp;\n   91 | \t}\n   92 | \n   93 | \treturn num;\n   94 | }","lines":19,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/uidlist.c#L76-L94"}]},
{"id":"LOGIC_41","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"send_one_name() truncates names longer than 255 to 255 ('Impossible?' comment) but write_byte(f, len) then writes a length the receiver uses with read_sbuf into new_array(char, len+1). Truncating to 255 silently corrupts a >255-char user/group name on the wire rather than erroring; the receiver gets a different (truncated) name and may map to the wrong id. The 'Impossible?' comment is also questionable since names can legitimately be long on some systems.","fix":"Either guarantee names cannot exceed 255 earlier, or use a varint length and a larger field; at minimum log a warning when truncation occurs instead of silently corrupting.","locations":[{"ref":"uidlist.c:373-386","code":"  373 | static void send_one_name(int f, id_t id, const char *name)\n  374 | {\n  375 | \tint len;\n  376 | \n  377 | \tif (!name)\n  378 | \t\tname = \"\";\n  379 | \tif ((len = strlen(name)) > 255) /* Impossible? */\n  380 | \t\tlen = 255;\n  381 | \n  382 | \twrite_varint30(f, id);\n  383 | \twrite_byte(f, len);\n  384 | \tif (len)\n  385 | \t\twrite_buf(f, name, len);\n  386 | }","lines":14,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/uidlist.c#L373-L386"}]},
{"id":"LOGIC_42","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"getallgroups() default-group reordering: if the default group pw_gid is not found (j == size), it EXPAND_ITEM_LIST by size+1 but never increments gid_list->count, then writes gid_array[j] (j==size, the new slot) = gid_array[0] and gid_array[0] = pw_gid. Because count was not incremented, the appended pw_gid at index 'size' is not counted, so callers iterating [0,count) will see pw_gid at index 0 (good) but lose the element that was previously at index 0 (it was moved to the uncounted slot 'size'). One group silently disappears from the visible list.","fix":"When appending the missing default group, increment gid_list->count (and size) so the moved-out original group at index 'size' remains within the counted range.","locations":[{"ref":"uidlist.c:606-619","code":"  606 | \t/* Paranoia: is the default group not first in the list? */\n  607 | \tif (gid_array[0] != pw->pw_gid) {\n  608 | \t\tint j;\n  609 | \t\tfor (j = 1; j < size; j++) {\n  610 | \t\t\tif (gid_array[j] == pw->pw_gid)\n  611 | \t\t\t\tbreak;\n  612 | \t\t}\n  613 | \t\tif (j == size) { /* The default group wasn't found! */\n  614 | \t\t\t(void)EXPAND_ITEM_LIST(gid_list, gid_t, size+1);\n  615 | \t\t\tgid_array = gid_list->items;\n  616 | \t\t}\n  617 | \t\tgid_array[j] = gid_array[0];\n  618 | \t\tgid_array[0] = pw->pw_gid;\n  619 | \t}","lines":14,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/uidlist.c#L606-L619"}]},
{"id":"LOGIC_43","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"set_times() permanently sets the global `omit_link_times = 1` the first time it falls through to the generic case (switch_step at line 160), even when the fall-through happened only because an earlier method returned ENOSYS for a non-symlink file. After this, symlink mtimes are silently skipped for the rest of the run regardless of the user's --omit-link-times choice, which is a surprising and order-dependent side effect.","fix":"Only force omit_link_times when the platform genuinely lacks symlink-time support detected for a symlink; do not mutate the user-facing global as a side effect of a generic-path fallback, or gate it behind a separate internal flag.","locations":[{"ref":"util1.c:164-170","code":"  164 | #include \"case_N.h\"\n  165 | \t\tswitch_step++;\n  166 | \t\tif (!omit_link_times) {\n  167 | \t\t\tomit_link_times = 1;\n  168 | \t\t\tif (S_ISLNK(stp->st_mode))\n  169 | \t\t\t\treturn 1;\n  170 | \t\t}","lines":7,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/util1.c#L164-L170"}]},
{"id":"LOGIC_44","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"glob_expand_module() reassigns the local `base` (originally base1) via asprintf to \" base1/\" then uses base_len (incremented by 1) to step the scan: `for (s = arg; *s; s = p + base_len)`. After finding the separator and NUL-terminating, advancing by base_len skips exactly the matched separator; but base_len was incremented only once (line 825) while the asprintf prepended a leading space AND appended a trailing slash, making the actual separator length strlen(base1)+2, not strlen(base1)+1. When base1 is matched mid-string this advances `s` one byte short, potentially re-scanning a stray slash. Worth verifying against the intended token layout.","fix":"Recompute base_len = strlen(base) after the asprintf so the scan step matches the actual separator string length.","locations":[{"ref":"util1.c:884-917","code":"  884 | void glob_expand_module(char *base1, char *arg, char ***argv_p, int *argc_p, int *maxargs_p)\n  885 | {\n  886 | \tchar *p, *s;\n  887 | \tchar *base = base1;\n  888 | \tint base_len = strlen(base);\n  889 | \n  890 | \tif (!arg || !*arg)\n  891 | \t\treturn;\n  892 | \n  893 | \tif (strncmp(arg, base, base_len) == 0)\n  894 | \t\targ += base_len;\n  895 | \n  896 | \tif (protect_args) {\n  897 | \t\tglob_expand(arg, argv_p, argc_p, maxargs_p);\n  898 | \t\treturn;\n  899 | \t}\n  900 | \n  901 | \targ = strdup(arg);\n  902 | \n  903 | \tif (asprintf(&base,\" %s/\", base1) < 0)\n  904 | \t\tout_of_memory(\"glob_expand_module\");\n  905 | \tbase_len++;\n  906 | \n  907 | \tfor (s = arg; *s; s = p + base_len) {\n  908 | \t\tif ((p = strstr(s, base)) != NULL)\n  909 | \t\t\t*p = '\\0'; /* split it at this point */\n  910 | \t\tglob_expand(s, argv_p, argc_p, maxargs_p);\n  911 | \t\tif (!p)\n  912 | \t\t\tbreak;\n  913 | \t}\n  914 | \n  915 | \tfree(arg);\n  916 | \tfree(base);\n  917 | }","lines":34,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/util1.c#L884-L917"}]},
{"id":"LOGIC_45","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"partial_dir_fname() copies the directory prefix with `strncpy(t, fname, len)` where len = fn - fname can be as large as the input path length. partial_fname is a fixed MAXPATHLEN buffer and `sz` is only decremented after the copy. If the directory portion of fname is >= MAXPATHLEN, strncpy overflows the static buffer before the later pathjoin length check (line 1321) can reject it. The comment `/* safe */` is therefore misleading.","fix":"Before the strncpy, verify `len < sz` (return NULL otherwise), then strncpy at most sz-1 bytes and NUL-terminate.","locations":[{"ref":"util1.c:1563-1580","code":" 1563 | char *partial_dir_fname(const char *fname)\n 1564 | {\n 1565 | \tchar *t = partial_fname;\n 1566 | \tint sz = sizeof partial_fname;\n 1567 | \tconst char *fn;\n 1568 | \n 1569 | \tif ((fn = strrchr(fname, '/')) != NULL) {\n 1570 | \t\tfn++;\n 1571 | \t\tif (*partial_dir != '/') {\n 1572 | \t\t\tint len = fn - fname;\n 1573 | \t\t\tstrncpy(t, fname, len); /* safe */\n 1574 | \t\t\tt += len;\n 1575 | \t\t\tsz -= len;\n 1576 | \t\t}\n 1577 | \t} else\n 1578 | \t\tfn = fname;\n 1579 | \tif ((int)pathjoin(t, sz, partial_dir, fn) >= sz)\n 1580 | \t\treturn NULL;","lines":18,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/util1.c#L1563-L1580"}]},
{"id":"LOGIC_46","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"auth_client() falls back to getpass(\"Password: \") and if that returns NULL sets pass=\"\". An empty password is then hashed and sent as a valid response. There is no warning that an empty password is being used, which can mask a misconfiguration (no password file, no env var, non-interactive tty) and silently attempt auth with an empty secret.","fix":"Warn (FERROR) when no password source was found and an empty password is being used, or fail the auth attempt.","locations":[{"ref":"authenticate.c:455-473","code":"  455 | \tif (!(pass = getpassf(password_file))\n  456 | \t && !(pass = getenv(\"RSYNC_PASSWORD\"))) {\n  457 | \t\t/* XXX: cyeoh says that getpass is deprecated, because\n  458 | \t\t * it may return a truncated password on some systems,\n  459 | \t\t * and it is not in the LSB.\n  460 | \t\t *\n  461 | \t\t * Andrew Klein says that getpassphrase() is present\n  462 | \t\t * on Solaris and reads up to 256 characters.\n  463 | \t\t *\n  464 | \t\t * OpenBSD has a readpassphrase() that might be more suitable.\n  465 | \t\t */\n  466 | \t\tpass = getpass(\"Password: \");\n  467 | \t}\n  468 | \n  469 | \tif (!pass)\n  470 | \t\tpass = \"\";\n  471 | \n  472 | \tgenerate_hash(pass, challenge, pass2);\n  473 | \tio_printf(fd, \"%s %s\\n\", user, pass2);","lines":19,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/authenticate.c#L455-L473"}]},
{"id":"LOGIC_47","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In parse_chmod STATE_2ND_HALF, the 'X' case sets FLAG_X_KEEP and falls through to 'x'. Both 'X' and 'x' independently test `if (copybits) state = STATE_ERROR;`. The 'X' fall-through therefore runs the copybits check twice. Harmless today, but if copybits is set, FLAG_X_KEEP has already been OR'd into flags before the error state is detected, leaving a stray flag bit on the (about-to-be-discarded) parse state. Since the list is freed on error this does not leak, but the duplicated guard is dead-ish and confusing.","fix":"Move the single copybits check above the X/x handling, or set FLAG_X_KEEP only after confirming !copybits.","locations":[{"ref":"chmod.c:204-213","code":"  204 | \t\t\tcase 'X':\n  205 | \t\t\t\tif (copybits)\n  206 | \t\t\t\t\tstate = STATE_ERROR;\n  207 | \t\t\t\tflags |= FLAG_X_KEEP;\n  208 | \t\t\t\t/* FALL THROUGH */\n  209 | \t\t\tcase 'x':\n  210 | \t\t\t\tif (copybits)\n  211 | \t\t\t\t\tstate = STATE_ERROR;\n  212 | \t\t\t\twhat |= 1;\n  213 | \t\t\t\tbreak;","lines":10,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/chmod.c#L204-L213"}]},
{"id":"LOGIC_48","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"map_ptr() reduces window_size to `(int32)(map->file_size - window_start)` when the\nwindow would extend past EOF (line 257-258). If the caller requests a region whose\noffset+len legitimately extends slightly past file_size (which match.c does, e.g.\n`map_ptr(buf, len-1, 1)` and the +more lookahead), window_size can become smaller\nthan `len + align_fudge`, but the following `if (window_size < len + align_fudge)`\nre-expands it via ALIGNED_LENGTH and the realloc handles it, so reads past EOF zero-\nfill. This works but means map_ptr can issue a read whose read_size extends past EOF;\nread() returns short and the tail is memset to 0 (line 306) -- correct, but the\nfile_size clamp at 257 is effectively dead for these over-reads because line 259\noverrides it.","fix":"Clarify with a comment that the EOF clamp is intentionally overridden when the requested len exceeds the remaining file, so reads zero-fill the tail.","locations":[{"ref":"fileio.c:317-320","code":"  317 | \tif (window_start + window_size > map->file_size)\n  318 | \t\twindow_size = (int32)(map->file_size - window_start);\n  319 | \tif (window_size < len + align_fudge)\n  320 | \t\twindow_size = ALIGNED_LENGTH(len + align_fudge);","lines":4,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/fileio.c#L317-L320"}]},
{"id":"LOGIC_49","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"send1extra() frees each relnamecache entry (free(rnp)) inside the loop and then free(relname_list) at the end, but the item_list's backing 'items' array allocated by EXPAND_ITEM_LIST is never freed (only the item_list struct itself via free(relname_list)). The per-call relname_list->items buffer leaks.","fix":"Free relname_list->items before freeing relname_list (or use the item-list teardown helper).","locations":[{"ref":"flist.c:2352-2382","code":" 2352 | \tfor (j = 0; j < relname_list->count; j++) {\n 2353 | \t\tchar *slash;\n 2354 | \t\trelnamecache *rnp = ((relnamecache**)relname_list->items)[j];\n 2355 | \t\tchar name_type = rnp->name_type;\n 2356 | \n 2357 | \t\tfbuf[dlen] = '/';\n 2358 | \t\tlen = strlcpy(fbuf + dlen + 1, rnp->fname, sizeof fbuf - dlen - 1);\n 2359 | \t\tfree(rnp);\n 2360 | \t\tif (len >= (int)sizeof fbuf)\n 2361 | \t\t\tcontinue; /* Impossible... */\n 2362 | \n 2363 | \t\tslash = strchr(fbuf+dlen+1, '/');\n 2364 | \t\tif (slash) {\n 2365 | \t\t\tsend_implied_dirs(f, flist, fbuf, fbuf+dlen+1, slash, flags, name_type);\n 2366 | \t\t\tcontinue;\n 2367 | \t\t}\n 2368 | \n 2369 | \t\tif (name_type != NORMAL_NAME) {\n 2370 | \t\t\tSTRUCT_STAT st = {0};\n 2371 | \n 2372 | \t\t\tif (name_type != MISSING_NAME && link_stat(fbuf, &st, 1) != 0) {\n 2373 | \t\t\t\tinterpret_stat_error(fbuf, True);\n 2374 | \t\t\t\tcontinue;\n 2375 | \t\t\t}\n 2376 | \t\t\tsend_file_name(f, flist, fbuf, &st, FLAG_TOP_DIR | flags, ALL_FILTERS);\n 2377 | \t\t} else\n 2378 | \t\t\tsend_file_name(f, flist, fbuf, NULL, FLAG_TOP_DIR | flags, ALL_FILTERS);\n 2379 | \t}\n 2380 | \n 2381 | \tfree(relname_list);\n 2382 | }","lines":31,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/flist.c#L2352-L2382"}]},
{"id":"LOGIC_50","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"flist_find() mutates the sorted entries it scans (writes F_DEPTH and len32 cache distances into 'empty' entries) during a lookup. This makes the supposedly read-only search non-reentrant and unsafe to call concurrently or from signal context, and silently relies on clear_file() having set up the +/-1 sentinels. A stale/garbage F_DEPTH or len32 (e.g. on an entry that was not produced by clear_file) leads to an out-of-bounds index via mid_up/high without bounds checking.","fix":"Add bounds assertions on mid_up and high after the cached-distance jumps, and document/enforce that flist_find is only valid on a fully cleaned, sorted flist.","locations":[{"ref":"flist.c:3134-3174","code":" 3134 | \twhile (low <= high) {\n 3135 | \t\tmid = (low + high) / 2;\n 3136 | \t\tif (F_IS_ACTIVE(flist->sorted[mid]))\n 3137 | \t\t\tmid_up = mid;\n 3138 | \t\telse {\n 3139 | \t\t\t/* Scan for the next non-empty entry using the cached\n 3140 | \t\t\t * distance values.  If the value isn't fully up-to-\n 3141 | \t\t\t * date, update it. */\n 3142 | \t\t\tmid_up = mid + F_DEPTH(flist->sorted[mid]);\n 3143 | \t\t\tif (!F_IS_ACTIVE(flist->sorted[mid_up])) {\n 3144 | \t\t\t\tdo {\n 3145 | \t\t\t\t    mid_up += F_DEPTH(flist->sorted[mid_up]);\n 3146 | \t\t\t\t} while (!F_IS_ACTIVE(flist->sorted[mid_up]));\n 3147 | \t\t\t\tF_DEPTH(flist->sorted[mid]) = mid_up - mid;\n 3148 | \t\t\t}\n 3149 | \t\t\tif (mid_up > high) {\n 3150 | \t\t\t\t/* If there's nothing left above us, set high to\n 3151 | \t\t\t\t * a non-empty entry below us and continue. */\n 3152 | \t\t\t\thigh = mid - (int)flist->sorted[mid]->len32;\n 3153 | \t\t\t\tif (!F_IS_ACTIVE(flist->sorted[high])) {\n 3154 | \t\t\t\t\tdo {\n 3155 | \t\t\t\t\t    high -= (int)flist->sorted[high]->len32;\n 3156 | \t\t\t\t\t} while (!F_IS_ACTIVE(flist->sorted[high]));\n 3157 | \t\t\t\t\tflist->sorted[mid]->len32 = mid - high;\n 3158 | \t\t\t\t}\n 3159 | \t\t\t\tcontinue;\n 3160 | \t\t\t}\n 3161 | \t\t}\n 3162 | \t\tdiff = f_name_cmp(flist->sorted[mid_up], f);\n 3163 | \t\tif (diff == 0) {\n 3164 | \t\t\tif (protocol_version < 29\n 3165 | \t\t\t    && S_ISDIR(flist->sorted[mid_up]->mode)\n 3166 | \t\t\t    != S_ISDIR(f->mode))\n 3167 | \t\t\t\treturn -1;\n 3168 | \t\t\treturn mid_up;\n 3169 | \t\t}\n 3170 | \t\tif (diff < 0)\n 3171 | \t\t\tlow = mid_up + 1;\n 3172 | \t\telse\n 3173 | \t\t\thigh = mid - 1;\n 3174 | \t}","lines":41,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/flist.c#L3134-L3174"}]},
{"id":"LOGIC_51","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"any_time_differs/itemize lazily fill sxp->crtime only when it is currently 0, using 0 as the 'not yet fetched' sentinel. A file whose real create time is exactly epoch 0 (a legitimate value) will be re-fetched on every call (get_create_time re-invoked), and more importantly get_create_time may legitimately return 0, after which the code keeps treating it as unfetched. This is a minor correctness/perf issue at the epoch-0 boundary.","fix":"Use a separate boolean 'crtime fetched' flag in stat_x instead of overloading 0 as the unfetched sentinel.","locations":[{"ref":"generator.c:411-422","code":"  411 | static inline int any_time_differs(stat_x *sxp, struct file_struct *file, UNUSED(const char *fname))\n  412 | {\n  413 | \tint differs = mtime_differs(&sxp->st, file);\n  414 | #ifdef SUPPORT_CRTIMES\n  415 | \tif (!differs && crtimes_ndx) {\n  416 | \t\tif (sxp->crtime == 0)\n  417 | \t\t\tsxp->crtime = get_create_time(fname, &sxp->st);\n  418 | \t\tdiffers = !same_time(sxp->crtime, 0, F_CRTIME(file), 0);\n  419 | \t}\n  420 | #endif\n  421 | \treturn differs;\n  422 | }","lines":12,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/generator.c#L411-L422"},{"ref":"generator.c:540-547","code":"  540 | #ifdef SUPPORT_CRTIMES\n  541 | \t\tif (crtimes_ndx) {\n  542 | \t\t\tif (sxp->crtime == 0)\n  543 | \t\t\t\tsxp->crtime = get_create_time(fnamecmp, &sxp->st);\n  544 | \t\t\tif (!same_time(sxp->crtime, 0, F_CRTIME(file), 0))\n  545 | \t\t\t\tiflags |= ITEM_REPORT_CRTIME;\n  546 | \t\t}\n  547 | #endif","lines":8,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/generator.c#L540-L547"}]},
{"id":"LOGIC_52","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In recv_generator the parent-directory mkdir for --relative && !implied_dirs ignores whether do_stat_at failed for a reason other than ENOENT. It only checks do_stat_at(dn, &sx.st) < 0 and then unconditionally tries make_path. If the stat failed with EACCES or ELOOP (dir exists but is inaccessible), it will attempt mkdir and emit a misleading 'mkdir failed' error rather than the real access error.","fix":"Only treat the missing-parent case when errno == ENOENT; for other stat errors, report the actual stat failure.","locations":[{"ref":"generator.c:1718-1727","code":" 1718 | \t\t\tif (relative_paths && !implied_dirs && file->mode != 0\n 1719 | \t\t\t && do_stat_at(dn, &sx.st) < 0) {\n 1720 | \t\t\t\tif (dry_run)\n 1721 | \t\t\t\t\tgoto parent_is_dry_missing;\n 1722 | \t\t\t\tif (make_path(fname, MKP_DROP_NAME | MKP_SKIP_SLASH) < 0) {\n 1723 | \t\t\t\t\trsyserr(FERROR_XFER, errno,\n 1724 | \t\t\t\t\t\t\"recv_generator: mkdir %s failed\",\n 1725 | \t\t\t\t\t\tfull_fname(dn));\n 1726 | \t\t\t\t}\n 1727 | \t\t\t}","lines":10,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/generator.c#L1718-L1727"}]},
{"id":"LOGIC_53","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"NON_ZERO_64 redundantly ORs in (y) twice. With << binding tighter than |, the expression is `(y) | ((uint64_t)(x) << 32) | (y)`, so the trailing `| (y)` is dead. It happens to be harmless, but it obscures intent and suggests a possible typo (e.g. one of the operands was meant to be something else).","fix":"Drop the duplicate operand: define NON_ZERO_64(x, y) as ((x) || (y) ? ((uint64_t)(x) << 32 | (y)) : (int64)1).","locations":[{"ref":"hashtable.c:369","code":"  369 | #define NON_ZERO_64(x, y) ((x) || (y) ? (y) | (uint64_t)(x) << 32 | (y) : (int64)1)","lines":1,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/hashtable.c#L369"}]},
{"id":"LOGIC_54","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"what_fd_is() returns a pointer to a function-local `static char buf[20]` for the default case. It is not reentrant and a second call (e.g. logging two fds in one printf via separate what_fd_is() calls) would corrupt the first result. The buffer is also only 20 bytes - adequate for `fd %d` but the static-return idiom is a latent aliasing bug if the result is used after a subsequent call.","fix":"Document the single-use constraint, or have callers copy the result immediately; for the named-fd cases this is fine since they return string literals.","locations":[{"ref":"io.c:368-382","code":"  368 | static const char *what_fd_is(int fd)\n  369 | {\n  370 | \tstatic char buf[20];\n  371 | \n  372 | \tif (fd == sock_f_out)\n  373 | \t\treturn \"socket\";\n  374 | \telse if (fd == iobuf.out_fd)\n  375 | \t\treturn \"message fd\";\n  376 | \telse if (fd == batch_fd)\n  377 | \t\treturn \"batch file\";\n  378 | \telse {\n  379 | \t\tsnprintf(buf, sizeof buf, \"fd %d\", fd);\n  380 | \t\treturn buf;\n  381 | \t}\n  382 | }","lines":15,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/io.c#L368-L382"}]},
{"id":"LOGIC_55","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"raw_read_int() may use an uninitialized pointer pattern that depends on macro evaluation order. The `else` branch is `raw_read_buf(data = buf, 4);` which assigns data inside the argument; this is correct, but the parallel `if` branch returns `IVAL(data,0)` where data came from perform_io. The construct `raw_read_buf(data = buf, 4)` is fragile/obscure: if anyone reorders it to read `data` before the assignment the value is garbage. Not currently a bug but an easy future foot-gun in wire-decoding code.","fix":"Split for clarity: in the else branch do `data = buf; raw_read_buf(buf, 4);` on separate statements rather than assigning inside the call argument.","locations":[{"ref":"io.c:1056-1064","code":" 1056 | static int32 raw_read_int(void)\n 1057 | {\n 1058 | \tchar *data, buf[4];\n 1059 | \tif (iobuf.in.size - iobuf.in.pos >= 4)\n 1060 | \t\tdata = perform_io(4, PIO_INPUT_AND_CONSUME);\n 1061 | \telse\n 1062 | \t\traw_read_buf(data = buf, 4);\n 1063 | \treturn IVAL(data, 0);\n 1064 | }","lines":9,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/io.c#L1056-L1064"}]},
{"id":"LOGIC_56","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"AIX sys_acl_get_file() error paths after the first SMB_MALLOC return without setting errno consistently and, more importantly, after acl_entry_link_head is built the function returns acl_entry_link_head but never frees file_acl on some early-return-0 paths (the `default: return 0;` inside the ace_type switch returns from the middle of the loop leaking file_acl and the whole chain).","fix":"Replace the bare `return 0;` in the switch default with a goto to a cleanup label that frees file_acl and the chain, or break out and fall through to the existing SAFE_FREE(file_acl).","locations":[{"ref":"lib/sysacls.c:2103-2105","code":" 2103 | \t\t\tdefault:\n 2104 | \t\t\t\treturn 0;\n 2105 | \t\t\t}","lines":3,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/lib/sysacls.c#L2103-L2105"},{"ref":"lib/sysacls.c:2176-2179","code":" 2176 | \tacl_entry_link_head->count = 0;\n 2177 | \tSAFE_FREE(file_acl);\n 2178 | \n 2179 | \treturn acl_entry_link_head;","lines":4,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/lib/sysacls.c#L2176-L2179"}]},
{"id":"LOGIC_57","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"trailing_N_elements() returns the last `count` path elements. If the concatenated string has fewer than `count` slash-separated components, the inner loops never decrement count to 0, and after the outer while exhausts, only `if (count == 1)` returns the whole first string; for count >= 2 with insufficient components it returns NULL. wildmatch_array(where>0) then treats NULL text as FALSE. That means a pattern requesting the trailing 2 components against a single-component name silently fails to match rather than matching the available component, which may not be the intended fallback.","fix":"Confirm desired semantics; if a request for N trailing components on a shorter path should match the whole path, return *a (the first element) for count>=1 when no further slash is found instead of only count==1.","locations":[{"ref":"lib/wildmatch.c:273-298","code":"  273 | static const uchar *trailing_N_elements(const uchar*const **a_ptr, int count)\n  274 | {\n  275 |     const uchar*const *a = *a_ptr;\n  276 |     const uchar*const *first_a = a;\n  277 | \n  278 |     while (*a)\n  279 | \t    a++;\n  280 | \n  281 |     while (a != first_a) {\n  282 | \tconst uchar *s = *--a;\n  283 | \ts += strlen((char*)s);\n  284 | \twhile (--s >= *a) {\n  285 | \t    if (*s == '/' && !--count) {\n  286 | \t\t*a_ptr = a+1;\n  287 | \t\treturn s+1;\n  288 | \t    }\n  289 | \t}\n  290 |     }\n  291 | \n  292 |     if (count == 1) {\n  293 | \t*a_ptr = a+1;\n  294 | \treturn *a;\n  295 |     }\n  296 | \n  297 |     return NULL;\n  298 | }","lines":26,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/lib/wildmatch.c#L273-L298"},{"ref":"lib/wildmatch.c:340-345","code":"  340 |     if (where > 0)\n  341 | \ttext = trailing_N_elements(&a, where);\n  342 |     else\n  343 | \ttext = *a++;\n  344 |     if (!text)\n  345 | \treturn FALSE;","lines":6,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/lib/wildmatch.c#L340-L345"}]},
{"id":"LOGIC_58","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"do_parameter() P_CHAR does '*(char*)parm_ptr = *parmvalue;' which reads the first char of parmvalue with no check that parmvalue is non-empty. parmvalue comes from the parser and should be at least an empty NUL-terminated string, so *parmvalue is '\\0' for an empty value (benign), but an empty char-param silently sets NUL with no diagnostic.","fix":"Warn if the char param value is empty rather than silently storing NUL.","locations":[{"ref":"loadparm.c:554-556","code":"  554 | \tcase P_CHAR:\n  555 | \t\t*(char *)parm_ptr = *parmvalue;\n  556 | \t\tbreak;","lines":3,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/loadparm.c#L554-L556"}]},
{"id":"LOGIC_59","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"do_parameter() P_ENUM fallback: if the value is not a known enum name it does 'if (atoi(parmvalue) > 0) *(int*)parm_ptr = atoi(parmvalue);'. atoi is called twice and a value of 0 or negative is silently ignored, leaving the previous/default value in place with no error reported to the admin. A typo'd enum value thus silently keeps a default rather than flagging a config error.","fix":"Parse once with strtol and validate; emit an FLOG warning when an enum value is unrecognized and not a positive integer.","locations":[{"ref":"loadparm.c:575-586","code":"  575 | \tcase P_ENUM:\n  576 | \t\tfor (i=0; parm_table[parmnum].enum_list[i].name; i++) {\n  577 | \t\t\tif (strequal(parmvalue, parm_table[parmnum].enum_list[i].name)) {\n  578 | \t\t\t\t*(int *)parm_ptr = parm_table[parmnum].enum_list[i].value;\n  579 | \t\t\t\tbreak;\n  580 | \t\t\t}\n  581 | \t\t}\n  582 | \t\tif (!parm_table[parmnum].enum_list[i].name) {\n  583 | \t\t\tif (atoi(parmvalue) > 0)\n  584 | \t\t\t\t*(int *)parm_ptr = atoi(parmvalue);\n  585 | \t\t}\n  586 | \t\tbreak;","lines":12,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/loadparm.c#L575-L586"}]},
{"id":"LOGIC_60","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"read_del_stats() accumulates stats.deleted_files via `stats.deleted_files += stats.deleted_dirs = read_varint_bounded(...)`. Each component is independently bounded by MAX_WIRE_DEL_STAT, but the running sum stats.deleted_files (an int field) is not bounded, so five near-MAX values can overflow a 32-bit int, producing a negative/garbage total that is later printed and used in output_itemized_counts().","fix":"Accumulate into a 64-bit intermediate and bound/clamp the total, or verify the int width of the stats fields is large enough that 5*MAX_WIRE_DEL_STAT cannot overflow; otherwise widen the field.","locations":[{"ref":"main.c:244-251","code":"  244 | void read_del_stats(int f)\n  245 | {\n  246 | \tstats.deleted_files = read_varint_bounded(f, 0, MAX_WIRE_DEL_STAT, \"deleted_files\");\n  247 | \tstats.deleted_files += stats.deleted_dirs = read_varint_bounded(f, 0, MAX_WIRE_DEL_STAT, \"deleted_dirs\");\n  248 | \tstats.deleted_files += stats.deleted_symlinks = read_varint_bounded(f, 0, MAX_WIRE_DEL_STAT, \"deleted_symlinks\");\n  249 | \tstats.deleted_files += stats.deleted_devices = read_varint_bounded(f, 0, MAX_WIRE_DEL_STAT, \"deleted_devices\");\n  250 | \tstats.deleted_files += stats.deleted_specials = read_varint_bounded(f, 0, MAX_WIRE_DEL_STAT, \"deleted_specials\");\n  251 | }","lines":8,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/main.c#L244-L251"},{"ref":"main.c:391-420","code":"  391 | static void output_itemized_counts(const char *prefix, int *counts)\n  392 | {\n  393 | \tstatic char *const labels[] = { \"reg\", \"dir\", \"link\", \"dev\", \"special\" };\n  394 | \tchar buf[1024], *pre = \" (\";\n  395 | \tint j, len = 0;\n  396 | \tint total = counts[0];\n  397 | \tif (total) {\n  398 | \t\tcounts[0] -= counts[1] + counts[2] + counts[3] + counts[4];\n  399 | \t\tfor (j = 0; j < 5; j++) {\n  400 | \t\t\tif (counts[j]) {\n  401 | \t\t\t\t/* snprintf can return more than its size arg\n  402 | \t\t\t\t * on truncation; keep len <= sizeof buf - 2 so\n  403 | \t\t\t\t * the closing ')' and trailing NUL always\n  404 | \t\t\t\t * have room and the next iteration's\n  405 | \t\t\t\t * sizeof buf - len - 2 cannot underflow. */\n  406 | \t\t\t\tif (len >= (int)sizeof buf - 2)\n  407 | \t\t\t\t\tbreak;\n  408 | \t\t\t\tlen += snprintf(buf+len, sizeof buf - len - 2,\n  409 | \t\t\t\t\t\"%s%s: %s\",\n  410 | \t\t\t\t\tpre, labels[j], comma_num(counts[j]));\n  411 | \t\t\t\tif (len > (int)sizeof buf - 2)\n  412 | \t\t\t\t\tlen = (int)sizeof buf - 2;\n  413 | \t\t\t\tpre = \", \";\n  414 | \t\t\t}\n  415 | \t\t}\n  416 | \t\tbuf[len++] = ')';\n  417 | \t}\n  418 | \tbuf[len] = '\\0';\n  419 | \trprintf(FINFO, \"%s: %s%s\\n\", prefix, comma_num(total), buf);\n  420 | }","lines":30,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/main.c#L391-L420"}]},
{"id":"LOGIC_61","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"hard","description":"handle_stats() caches total_read/total_written from stats at entry, but in the client-receiver branch it then OVERWRITES total_written and total_read by reading them back from the wire in swapped order. If f is a valid fd but the peer sent fewer values (protocol mismatch / truncation), read_varlong30 will block or error; more subtly, when am_sender && write_batch is false and we are a server non-sender, none of the branches fire and the cached values silently remain the local (wrong-direction) totals used later by output_summary in some code paths.","fix":"Document/verify that every reachable caller state is covered by one of the branches; add an explicit else for the unhandled server-receiver/generator case so totals are never reported with the wrong direction.","locations":[{"ref":"main.c:329-389","code":"  329 | static void handle_stats(int f)\n  330 | {\n  331 | \tendtime = time(NULL);\n  332 | \n  333 | \t/* Cache two stats because the read/write code can change it. */\n  334 | \ttotal_read = stats.total_read;\n  335 | \ttotal_written = stats.total_written;\n  336 | \n  337 | \tif (INFO_GTE(STATS, 3)) {\n  338 | \t\t/* These come out from every process */\n  339 | \t\tshow_malloc_stats();\n  340 | \t\tshow_flist_stats();\n  341 | \t}\n  342 | \n  343 | \tif (am_generator)\n  344 | \t\treturn;\n  345 | \n  346 | \tif (am_daemon) {\n  347 | \t\tif (f == -1 || !am_sender)\n  348 | \t\t\treturn;\n  349 | \t}\n  350 | \n  351 | \tif (am_server) {\n  352 | \t\tif (am_sender) {\n  353 | \t\t\twrite_varlong30(f, total_read, 3);\n  354 | \t\t\twrite_varlong30(f, total_written, 3);\n  355 | \t\t\twrite_varlong30(f, stats.total_size, 3);\n  356 | \t\t\tif (protocol_version >= 29) {\n  357 | \t\t\t\twrite_varlong30(f, stats.flist_buildtime, 3);\n  358 | \t\t\t\twrite_varlong30(f, stats.flist_xfertime, 3);\n  359 | \t\t\t}\n  360 | \t\t}\n  361 | \t\treturn;\n  362 | \t}\n  363 | \n  364 | \t/* this is the client */\n  365 | \n  366 | \tif (f < 0 && !am_sender) /* e.g. when we got an empty file list. */\n  367 | \t\t;\n  368 | \telse if (!am_sender) {\n  369 | \t\t/* Read the first two in opposite order because the meaning of\n  370 | \t\t * read/write swaps when switching from sender to receiver. */\n  371 | \t\ttotal_written = read_varlong30(f, 3);\n  372 | \t\ttotal_read = read_varlong30(f, 3);\n  373 | \t\tstats.total_size = read_varlong30(f, 3);\n  374 | \t\tif (protocol_version >= 29) {\n  375 | \t\t\tstats.flist_buildtime = read_varlong30(f, 3);\n  376 | \t\t\tstats.flist_xfertime = read_varlong30(f, 3);\n  377 | \t\t}\n  378 | \t} else if (write_batch) {\n  379 | \t\t/* The --read-batch process is going to be a client\n  380 | \t\t * receiver, so we need to give it the stats. */\n  381 | \t\twrite_varlong30(batch_fd, total_read, 3);\n  382 | \t\twrite_varlong30(batch_fd, total_written, 3);\n  383 | \t\twrite_varlong30(batch_fd, stats.total_size, 3);\n  384 | \t\tif (protocol_version >= 29) {\n  385 | \t\t\twrite_varlong30(batch_fd, stats.flist_buildtime, 3);\n  386 | \t\t\twrite_varlong30(batch_fd, stats.flist_xfertime, 3);\n  387 | \t\t}\n  388 | \t}\n  389 | }","lines":61,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/main.c#L329-L389"}]},
{"id":"LOGIC_62","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"bytes_per_sec_human_dnum() divides by (0.5 + (endtime - starttime)). endtime and starttime are time_t; if the system clock steps backward between start and end, (endtime - starttime) can be negative enough that the denominator becomes <= 0, producing a negative or +/-inf rate. The 0.5 fudge only guards the exact zero-elapsed case, not backward clock jumps.","fix":"Clamp the elapsed time to a non-negative value, e.g. double elapsed = endtime > starttime ? endtime - starttime : 0; then divide by (0.5 + elapsed).","locations":[{"ref":"main.c:422-427","code":"  422 | static const char *bytes_per_sec_human_dnum(void)\n  423 | {\n  424 | \tif (starttime == (time_t)-1 || endtime == (time_t)-1)\n  425 | \t\treturn \"UNKNOWN\";\n  426 | \treturn human_dnum((total_written + total_read) / (0.5 + (endtime - starttime)), 2);\n  427 | }","lines":6,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/main.c#L422-L427"}]},
{"id":"LOGIC_63","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"output_summary() computes speedup as total_size / (total_written + total_read) via comma_dnum(). When the transfer moves zero bytes (e.g. empty file list or dry-run with nothing to do) total_written + total_read can be 0, yielding a divide-by-zero (inf/nan) in the speedup figure printed at STATS level 1.","fix":"Guard the divisor: print speedup only when (total_written + total_read) > 0, otherwise print a placeholder such as 0.00.","locations":[{"ref":"main.c:470-473","code":"  470 | \t\trprintf(FINFO, \"total size is %s  speedup is %s%s\\n\",\n  471 | \t\t\thuman_num(stats.total_size),\n  472 | \t\t\tcomma_dnum((double)stats.total_size / (total_written+total_read), 2),\n  473 | \t\t\twrite_batch < 0 ? \" (BATCH ONLY)\" : dry_run ? \" (DRY RUN)\" : \"\");","lines":4,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/main.c#L470-L473"}]},
{"id":"LOGIC_64","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In do_cmd() the remote-shell parsing closes a quote with `if (*f == in_quote && *++f != in_quote)`. The `*++f` advances f even while testing, so an escaped doubled quote ('' or \"\") inside a quoted string is handled, but a single closing quote immediately followed by end-of-string ('\\0') is matched by the != in_quote test and clears in_quote while f now points at the NUL; the outer `while (*f != ' ' || in_quote)` then continues with in_quote=0 and *f=='\\0', falls into the `if (!*f)` branch which does f-- and breaks - correct only by luck. The control flow is fragile and the `continue` after clearing in_quote skips the `*t++ = *f++` so the closing quote is correctly dropped, but a stray quote char at string end is easy to mis-handle. Worth hardening.","fix":"Restructure the quote-handling loop with explicit bounds checks on f so end-of-string while scanning a quote is handled in one place rather than relying on the f-- fixup.","locations":[{"ref":"main.c:551-574","code":"  551 | \t\t\twhile (*f != ' ' || in_quote) {\n  552 | \t\t\t\tif (!*f) {\n  553 | \t\t\t\t\tif (in_quote) {\n  554 | \t\t\t\t\t\trprintf(FERROR,\n  555 | \t\t\t\t\t\t\t\"Missing trailing-%c in remote-shell command.\\n\",\n  556 | \t\t\t\t\t\t\tin_quote);\n  557 | \t\t\t\t\t\texit_cleanup(RERR_SYNTAX);\n  558 | \t\t\t\t\t}\n  559 | \t\t\t\t\tf--;\n  560 | \t\t\t\t\tbreak;\n  561 | \t\t\t\t}\n  562 | \t\t\t\tif (*f == '\\'' || *f == '\"') {\n  563 | \t\t\t\t\tif (!in_quote) {\n  564 | \t\t\t\t\t\tin_quote = *f++;\n  565 | \t\t\t\t\t\tcontinue;\n  566 | \t\t\t\t\t}\n  567 | \t\t\t\t\tif (*f == in_quote && *++f != in_quote) {\n  568 | \t\t\t\t\t\tin_quote = '\\0';\n  569 | \t\t\t\t\t\tcontinue;\n  570 | \t\t\t\t\t}\n  571 | \t\t\t\t}\n  572 | \t\t\t\t*t++ = *f++;\n  573 | \t\t\t}\n  574 | \t\t\t*t++ = '\\0';","lines":24,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/main.c#L551-L574"}]},
{"id":"LOGIC_65","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In get_local_name(), when mkpath_dest_arg dry-run path at line 835 takes the branch, it calls change_dir(dest_path, CD_SKIP_CHDIR) but ignores its return value, while every other change_dir call in this function checks for failure and exits. An error there is silently swallowed, potentially leaving curr_dir[] inconsistent for the dry-run.","fix":"Check the return of the CD_SKIP_CHDIR change_dir call and handle failure consistently with the other call sites, or comment why a failure is acceptable here.","locations":[{"ref":"main.c:853-867","code":"  853 | \tif (dry_run && mkpath_dest_arg && do_stat(dest_path, &st) < 0) {\n  854 | \t\t/* --mkpath would have created this parent dir, but a dry run did\n  855 | \t\t * not, so don't chdir into it; flag the destination as not yet\n  856 | \t\t * present (as the dir-creation path above does) so the generator\n  857 | \t\t * doesn't try to compare against the missing tree (#880).  Only\n  858 | \t\t * the missing-parent case is touched, so an ordinary file-to-file\n  859 | \t\t * dry run still itemizes against an existing destination. */\n  860 | \t\tdry_run++;\n  861 | \t\tchange_dir(dest_path, CD_SKIP_CHDIR);\n  862 | \t} else if (!change_dir(dest_path, CD_NORMAL)) {\n  863 | \t\trsyserr(FERROR, errno, \"change_dir#3 %s failed\",\n  864 | \t\t\tfull_fname(dest_path));\n  865 | \t\texit_cleanup(RERR_FILESELECT);\n  866 | \t}\n  867 | \t*cp = '/';","lines":15,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/main.c#L853-L867"}]},
{"id":"LOGIC_66","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In parse_time(), the leap-year fixup comment/logic at the in_date==1 (year) case assumes the only way tm_mday can decrease after mktime is a Feb-29 -> Mar-1 rollover (mon==1 mday==29). It hard-codes t.tm_mon==2 / old_mday==29 as the only valid case and otherwise returns error. This is fragile: it silently rejects otherwise-valid future-time computations if mktime normalizes differently across libc/timezone DST boundaries.","fix":"Recompute the target fields explicitly each iteration rather than reasoning from mktime's post-normalization mutation of the struct tm; or re-derive mday from the requested values before each mktime call.","locations":[{"ref":"options.c:1388-1397","code":" 1388 | \t\tcase 1:\n 1389 | \t\t\tif (t.tm_mday < old_mday) {\n 1390 | \t\t\t\t/* mon==1 mday==29 got bumped to mon==2 */\n 1391 | \t\t\t\tif (t.tm_mon != 2 || old_mday != 29)\n 1392 | \t\t\t\t\treturn (time_t)-1;\n 1393 | \t\t\t\tt.tm_mon = 1;\n 1394 | \t\t\t\tt.tm_mday = 29;\n 1395 | \t\t\t}\n 1396 | \t\t\tt.tm_year++;\n 1397 | \t\t\tbreak;","lines":10,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/options.c#L1388-L1397"}]},
{"id":"LOGIC_67","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"Redundant/always-true condition. After `if (!do_compression) do_compression = CPRES_AUTO;`, do_compression is guaranteed nonzero, so the immediately following `if (do_compression && refused_compress)` has a dead `do_compression &&` sub-condition.","fix":"Drop the redundant `do_compression &&` and just test `if (refused_compress)`.","locations":[{"ref":"options.c:2138-2141","code":" 2138 | \tif (do_compression || do_compression_level != CLVL_NOT_SPECIFIED) {\n 2139 | \t\tif (!do_compression)\n 2140 | \t\t\tdo_compression = CPRES_AUTO;\n 2141 | \t\tif (do_compression && refused_compress) {","lines":4,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/options.c#L2138-L2141"}]},
{"id":"LOGIC_68","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In server_options(), `if (quiet && msgs2stderr)` sends -q to the server. quiet is the count of -q flags; msgs2stderr is a mode (0/1/2). The intent appears to be 'only forward -q when messages are not going to the client', but the check `&& msgs2stderr` is true for both mode 1 (all-to-stderr) and mode 2 (errors-to-stderr/default), so -q is forwarded in the default case too. If the design intends to suppress forwarding -q only in the client-message mode (0), this is correct; but the coupling between an unrelated count and a mode enum is non-obvious and undocumented.","fix":"Add a comment clarifying why -q is gated on msgs2stderr, or use an explicit named predicate; verify mode 2 (default) really should forward -q.","locations":[{"ref":"options.c:2803-2804","code":" 2803 | \tif (quiet && msgs2stderr)\n 2804 | \t\targstr[x++] = 'q';","lines":2,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/options.c#L2803-L2804"}]},
{"id":"LOGIC_69","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"rprint_progress() ETA uses `(unsigned int)(remain / 3600.0)` for the hours field formatted as %4u, after already clamping remain <= 9999*3600. The minutes/seconds use `% 60` on a double cast to unsigned int. Casting a large double directly to unsigned int is well defined only when the value fits; the clamp keeps hours <= 9999 so it fits, but the seconds field `(unsigned int)remain % 60` casts the full remain (could be up to ~3.6e7) to unsigned int first, which fits in 32-bit but is fragile and relies on the earlier clamp staying in sync.","fix":"Compute integer seconds once (e.g. `unsigned long secs = (unsigned long)remain;`) then derive h/m/s from secs to avoid repeated large double->int casts.","locations":[{"ref":"progress.c:118-125","code":"  118 | \tif (remain < 0 || remain > 9999.0 * 3600.0)\n  119 | \t\tstrlcpy(rembuf, \"  ??:??:??\", sizeof rembuf);\n  120 | \telse {\n  121 | \t\tsnprintf(rembuf, sizeof rembuf, \"%4u:%02u:%02u\",\n  122 | \t\t\t (unsigned int) (remain / 3600.0),\n  123 | \t\t\t (unsigned int) (remain / 60.0) % 60,\n  124 | \t\t\t (unsigned int) remain % 60);\n  125 | \t}","lines":8,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/progress.c#L118-L125"}]},
{"id":"LOGIC_70","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"rprint_progress() percentage computation `pct = ofs == size ? 100 : (int)(100.0 * ofs / size)` divides by size without guarding size == 0. For a zero-length file size==0; the ternary catches ofs==size (0==0 -> 100) so the divide is avoided in that exact case, but if ofs != size while size == 0 (can happen with INFO_GTE(PROGRESS,2) total-size accounting where size is the grand total and could momentarily be 0) the expression divides by zero.","fix":"Guard explicitly: `pct = size ? (ofs >= size ? 100 : (int)(100.0*ofs/size)) : 100;`.","locations":[{"ref":"progress.c:128","code":"  128 | \tpct = ofs == size ? 100 : (int) (100.0 * ofs / size);","lines":1,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/progress.c#L128"}]},
{"id":"LOGIC_71","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In recv_files the comment at receiver.c:870-871 states \"--inplace && --partial-dir\nare never enabled at the same time\", but inplace_partial is a documented mode\n(inplace_partial && fnamecmp_type == FNAMECMP_PARTIAL_DIR is handled throughout this\nfile and in sender.c:337). The pre-29 branch's reasoning may be stale relative to the\ninplace_partial feature added later; the comment is at best confusing about which\ncombination is excluded.","fix":"Clarify the comment to state precisely which option combination is mutually exclusive for protocol < 29 versus the inplace_partial mode used for >= 29.","locations":[{"ref":"receiver.c:1046-1047","code":" 1046 | \t\t\t/* Reminder: --inplace && --partial-dir are never\n 1047 | \t\t\t * enabled at the same time. */","lines":2,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/receiver.c#L1046-L1047"}]},
{"id":"LOGIC_72","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"When proxy_user/proxy_pass are set, stringjoin(buffer, PROXY_BUF_SIZE, user, \":\", pass, NULL) silently truncates the credentials to PROXY_BUF_SIZE before len = strlen(buffer) is taken. The subsequent 'too long' length check at line 66 then operates on the already-truncated length, so over-long credentials are not rejected but are silently mangled, producing a broken Proxy-Authorization header rather than a clear error.","fix":"Compute the required length from the raw proxy_user/proxy_pass strings (strlen(user)+1+strlen(pass)) and reject before joining, or check that stringjoin did not truncate.","locations":[{"ref":"socket.c:72-83","code":"   72 | \tif (proxy_user && proxy_pass) {\n   73 | \t\tstringjoin(buffer, PROXY_BUF_SIZE,\n   74 | \t\t\t proxy_user, \":\", proxy_pass, NULL);\n   75 | \t\tlen = strlen(buffer);\n   76 | \n   77 | \t\tif ((len*8 + 5) / 6 >= PROXY_BUF_SIZE - 3) {\n   78 | \t\t\trprintf(FERROR,\n   79 | \t\t\t\t\"authentication information is too long\\n\");\n   80 | \t\t\treturn -1;\n   81 | \t\t}\n   82 | \n   83 | \t\tbase64_encode(buffer, len, authbuf, 1);","lines":12,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/socket.c#L72-L83"}]},
{"id":"LOGIC_73","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"do_open_nofollow() in the no-O_NOFOLLOW fallback opens the file before comparing dev/ino, then on mismatch (a symlink-swap detected) returns EINVAL. This is a TOCTOU-narrowing check but it cannot distinguish a benign hardlink/rename from an attack; more importantly the comment block does not warn that on platforms lacking O_NOFOLLOW this remains racy (the lstat-then-open-then-fstat window). Minor since real systems have O_NOFOLLOW.","fix":"Add a note that the !O_NOFOLLOW path is best-effort and inherently racy; no functional change needed on modern systems.","locations":[{"ref":"syscall.c:2766-2790","code":" 2766 | #ifdef O_NOFOLLOW\n 2767 | \tfd = open(pathname, flags|O_NOFOLLOW);\n 2768 | #else\n 2769 | \tif (do_lstat(pathname, &l_st) < 0)\n 2770 | \t\treturn -1;\n 2771 | \tif (S_ISLNK(l_st.st_mode)) {\n 2772 | \t\terrno = ELOOP;\n 2773 | \t\treturn -1;\n 2774 | \t}\n 2775 | \tif ((fd = open(pathname, flags)) < 0)\n 2776 | \t\treturn fd;\n 2777 | \tif (do_fstat(fd, &f_st) < 0) {\n 2778 | \t  close_and_return_error:\n 2779 | \t\t{\n 2780 | \t\t\tint save_errno = errno;\n 2781 | \t\t\tclose(fd);\n 2782 | \t\t\terrno = save_errno;\n 2783 | \t\t}\n 2784 | \t\treturn -1;\n 2785 | \t}\n 2786 | \tif (l_st.st_dev != f_st.st_dev || l_st.st_ino != f_st.st_ino) {\n 2787 | \t\terrno = EINVAL;\n 2788 | \t\tgoto close_and_return_error;\n 2789 | \t}\n 2790 | #endif","lines":25,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/syscall.c#L2766-L2790"}]},
{"id":"LOGIC_74","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"tls.c stat_xattr() reads buf with sys_lgetxattr(..., sizeof buf - 1); if len >= (int)sizeof buf it forces ERANGE. The sscanf format \"%o %d,%d %d:%d\" reads 'mode' as unsigned int via %o but rdev_major/minor/uid/gid as signed %d into int vars; the resulting uid/gid are then assigned to fst->st_uid/st_gid. A malicious xattr with negative numbers (e.g. uid -1) is accepted and stored, which can later be interpreted as a very large uid. Minor since tls is a test tool, but it exits(1) on parse failure which is a hard abort on any malformed xattr.","fix":"Validate the parsed numeric ranges (non-negative, within id_t) before assigning, and consider warning+skip instead of exit(1) on corrupt xattrs.","locations":[{"ref":"tls.c:92-107","code":"   92 | \tif (sscanf(buf, \"%o %d,%d %d:%d\",\n   93 | \t\t   &mode, &rdev_major, &rdev_minor, &uid, &gid) != 5) {\n   94 | \t\tfprintf(stderr, \"Corrupt %s xattr attached to %s: \\\"%s\\\"\\n\",\n   95 | \t\t\tXSTAT_ATTR, fname, buf);\n   96 | \t\texit(1);\n   97 | \t}\n   98 | \n   99 | #if _S_IFLNK != 0120000\n  100 | \tif ((mode & (_S_IFMT)) == 0120000)\n  101 | \t\tmode = (mode & ~(_S_IFMT)) | _S_IFLNK;\n  102 | #endif\n  103 | \tfst->st_mode = mode;\n  104 | \n  105 | \tfst->st_rdev = MAKEDEV(rdev_major, rdev_minor);\n  106 | \tfst->st_uid = uid;\n  107 | \tfst->st_gid = gid;","lines":16,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/tls.c#L92-L107"}]},
{"id":"LOGIC_75","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"tls.c storetime(): when t!=0 it does snprintf(dest+len, destsize-len, ...) for nsecs. If the first snprintf truncated (len >= destsize, since snprintf returns would-have-been length), destsize-len underflows to a huge size_t passed to the second snprintf, allowing a write past 'dest'. With the 50-byte buffers used here it won't truncate in practice, but the pattern is unsafe.","fix":"Guard the nsecs append with 'if (nsecs >= 0 && len > 0 && (size_t)len < destsize)'.","locations":[{"ref":"tls.c:132-141","code":"  132 | \t\tlen = snprintf(dest, destsize,\n  133 | \t\t\t\" %04d-%02d-%02d %02d:%02d:%02d\",\n  134 | \t\t\t(int)mt->tm_year + 1900,\n  135 | \t\t\t(int)mt->tm_mon + 1,\n  136 | \t\t\t(int)mt->tm_mday,\n  137 | \t\t\t(int)mt->tm_hour,\n  138 | \t\t\t(int)mt->tm_min,\n  139 | \t\t\t(int)mt->tm_sec);\n  140 | \t\tif (nsecs >= 0 && len >= 0)\n  141 | \t\t\tsnprintf(dest + len, destsize - len, \".%09d\", nsecs);","lines":10,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/tls.c#L132-L141"}]},
{"id":"LOGIC_76","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"parse_name_map() validates a numeric mapping entry but for a range 'A-B' it never checks that A <= B. id_parse(cp) and id_parse(dash+1) are stored as id and max_id; recv_add_id() later matches with 'id < node->id || id > node->u.max_id'. If the user writes a reversed range (e.g. 100-50) max_id < id and the rule can never match, silently doing nothing instead of warning.","fix":"After parsing both ends of a range, reject (or warn) when max_id < id1.","locations":[{"ref":"uidlist.c:531-537","code":"  531 | \t\t\tif (dash) {\n  532 | \t\t\t\t*dash = '\\0';\n  533 | \t\t\t\tnoiu.max_id = id_parse(dash+1);\n  534 | \t\t\t} else\n  535 | \t\t\t\tnoiu.max_id = 0;\n  536 | \t\t\tflags = 0;\n  537 | \t\t\tid1 = id_parse(cp);","lines":7,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/uidlist.c#L531-L537"}]},
{"id":"LOGIC_77","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In print_info_flags() JSON branch, `item_buf[strlen(item)+2-1] = '_';` rewrites a byte at a computed offset into item_buf to turn the 's' of an Nbits label into '_'. This index is derived from strlen(item) with no check that it is within the snprintf-truncated content; for the fixed capability strings it fits, but the write is unguarded against item_buf truncation (item_buf is 32 bytes) and would corrupt adjacent stack on a longer flag name.","fix":"Bound the index against the actual bytes written by snprintf (item_len, clamped to sizeof item_buf) before writing item_buf[...].","locations":[{"ref":"usage.c:205-211","code":"  205 | \t\t\titem_len = snprintf(item_buf, sizeof item_buf,\n  206 | \t\t\t\t\t   \" \\\"%s%s\\\": %s%.*s%s%s\", item, is_bits ? \"bits\" : \"\",\n  207 | \t\t\t\t\t   quot, val_len, val, quot, need_comma ? \",\" : \"\");\n  208 | \t\t\tif (is_bits)\n  209 | \t\t\t\titem_buf[strlen(item)+2-1] = '_'; /* Turn the 's' into a '_' */\n  210 | \t\t\tfor (space = item; (space = strpbrk(space, \" -\")) != NULL; space++)\n  211 | \t\t\t\titem_buf[space - item + 2] = '_';","lines":7,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/usage.c#L205-L211"}]},
{"id":"LOGIC_78","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"lock_range() takes offset and len as `int`, but assigns them to `lock.l_start`/`lock.l_len` which are off_t. Negative or >2GB offsets/lengths cannot be expressed, silently truncating on large files and on LFS builds where off_t is 64-bit.","fix":"Take OFF_T offset and OFF_T len parameters to match the flock fields.","locations":[{"ref":"util1.c:712-723","code":"  712 | int lock_range(int fd, int offset, int len)\n  713 | {\n  714 | \tstruct flock lock;\n  715 | \n  716 | \tlock.l_type = F_WRLCK;\n  717 | \tlock.l_whence = SEEK_SET;\n  718 | \tlock.l_start = offset;\n  719 | \tlock.l_len = len;\n  720 | \tlock.l_pid = 0;\n  721 | \n  722 | \treturn fcntl(fd,F_SETLK,&lock) == 0;\n  723 | }","lines":12,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/util1.c#L712-L723"}]},
{"id":"LOGIC_79","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"pathjoin() computes `destsize - 1` in the `if (len < destsize - 1)` test. The documented contract does not forbid destsize == 0, and strlcpy returns strlen(p1) for destsize 0. If a caller ever passes destsize 0, `destsize - 1` underflows to SIZE_MAX and the `len < SIZE_MAX` branch is taken, writing dest[len]='/' past a zero-size buffer.","fix":"Guard with `if (destsize && len < destsize - 1)` (and similarly the inner test), or assert destsize > 0.","locations":[{"ref":"util1.c:1064-1080","code":" 1064 | size_t pathjoin(char *dest, size_t destsize, const char *p1, const char *p2)\n 1065 | {\n 1066 | \tsize_t len = strlcpy(dest, p1, destsize);\n 1067 | \tif (len < destsize - 1) {\n 1068 | \t\tif (!len || dest[len-1] != '/')\n 1069 | \t\t\tdest[len++] = '/';\n 1070 | \t\tif (len < destsize - 1)\n 1071 | \t\t\tlen += strlcpy(dest + len, p2, destsize - len);\n 1072 | \t\telse {\n 1073 | \t\t\tdest[len] = '\\0';\n 1074 | \t\t\tlen += strlen(p2);\n 1075 | \t\t}\n 1076 | \t}\n 1077 | \telse\n 1078 | \t\tlen += strlen(p2) + 1; /* Assume we'd insert a '/'. */\n 1079 | \treturn len;\n 1080 | }","lines":17,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/util1.c#L1064-L1080"}]},
{"id":"LOGIC_80","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"normalize_path() shadows the function-scope `unsigned int len` with a local `int len = strlen(path)` inside the `if (*path != '/')` block. The outer `len` is the one returned via len_ptr (set by clean_fname). The shadowing is harmless here but is a readability trap and risks a future edit using the wrong `len`.","fix":"Rename the inner variable (e.g. plen) to avoid shadowing.","locations":[{"ref":"util1.c:1500-1509","code":" 1500 | char *normalize_path(char *path, BOOL force_newbuf, unsigned int *len_ptr)\n 1501 | {\n 1502 | \tunsigned int len;\n 1503 | \n 1504 | \tif (*path != '/') { /* Make path absolute. */\n 1505 | \t\tint len = strlen(path);\n 1506 | \t\tif (curr_dir_len + 1 + len >= sizeof curr_dir)\n 1507 | \t\t\treturn NULL;\n 1508 | \t\tcurr_dir[curr_dir_len] = '/';\n 1509 | \t\tmemcpy(curr_dir + curr_dir_len + 1, path, len + 1);","lines":10,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/util1.c#L1500-L1509"}]},
{"id":"LOGIC_81","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"unsafe_symlink() rejects a destination ending in \"/..\" only when `dlen > 3` (line 1421). A destination of exactly \"/..\" has dlen == 3 and slips past this specific check; it is still caught as absolute (leading '/') here, but the off-by guard `dlen > 3` would also miss a relative-rooted variant if the leading-slash rule changed. The threshold should be `>= 3` to compare the trailing 3 chars safely.","fix":"Use `if (dlen >= 3 && strcmp(&dest[dlen-3], \"/..\") == 0)` (the strcmp already needs only 3 trailing bytes).","locations":[{"ref":"util1.c:1685-1688","code":" 1685 | \t// reject if the destination ends in /..\n 1686 | \tconst size_t dlen = strlen(dest);\n 1687 | \tif (dlen > 3 && strcmp(&dest[dlen-3], \"/..\") == 0)\n 1688 | \t    return 1;","lines":4,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/util1.c#L1685-L1688"}]},
{"id":"LOGIC_82","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"fuzzy_distance() declares `uint32 a[MAXPATHLEN]` on the stack and indexes it by len2 (a[i2] for i2 < len2). There is no check that len2 < MAXPATHLEN; callers pass filename lengths which are normally bounded, but a len2 >= MAXPATHLEN causes a stack buffer overflow. The MAXPATHLEN-sized stack array is also large (~4KB).","fix":"Assert/clamp len2 < MAXPATHLEN, or allocate `a` sized to len2; add an explicit guard since the buffer is indexed by untrusted-length data.","locations":[{"ref":"util1.c:1854-1901","code":" 1854 | uint32 fuzzy_distance(const char *s1, unsigned len1, const char *s2, unsigned len2, uint32 upperlimit)\n 1855 | {\n 1856 | \tuint32 a[MAXPATHLEN], diag, above, left, diag_inc, above_inc, left_inc;\n 1857 | \tint32 cost;\n 1858 | \tunsigned i1, i2;\n 1859 | \n 1860 | \t/* Check to see if the Levenshtein distance must be greater than the\n 1861 | \t * upper limit defined by the previously found lowest distance using\n 1862 | \t * the heuristic that the Levenshtein distance is greater than the\n 1863 | \t * difference in length of the two strings */\n 1864 | \tif ((len1 > len2 ? len1 - len2 : len2 - len1) * UNIT > upperlimit)\n 1865 | \t\treturn 0xFFFFU * UNIT + 1;\n 1866 | \n 1867 | \tif (!len1 || !len2) {\n 1868 | \t\tif (!len1) {\n 1869 | \t\t\ts1 = s2;\n 1870 | \t\t\tlen1 = len2;\n 1871 | \t\t}\n 1872 | \t\tfor (i1 = 0, cost = 0; i1 < len1; i1++)\n 1873 | \t\t\tcost += s1[i1];\n 1874 | \t\treturn (int32)len1 * UNIT + cost;\n 1875 | \t}\n 1876 | \n 1877 | \tfor (i2 = 0; i2 < len2; i2++)\n 1878 | \t\ta[i2] = (i2+1) * UNIT;\n 1879 | \n 1880 | \tfor (i1 = 0; i1 < len1; i1++) {\n 1881 | \t\tdiag = i1 * UNIT;\n 1882 | \t\tabove = (i1+1) * UNIT;\n 1883 | \t\tfor (i2 = 0; i2 < len2; i2++) {\n 1884 | \t\t\tleft = a[i2];\n 1885 | \t\t\tif ((cost = *((uchar*)s1+i1) - *((uchar*)s2+i2)) != 0) {\n 1886 | \t\t\t\tif (cost < 0)\n 1887 | \t\t\t\t\tcost = UNIT - cost;\n 1888 | \t\t\t\telse\n 1889 | \t\t\t\t\tcost = UNIT + cost;\n 1890 | \t\t\t}\n 1891 | \t\t\tdiag_inc = diag + cost;\n 1892 | \t\t\tleft_inc = left + UNIT + *((uchar*)s1+i1);\n 1893 | \t\t\tabove_inc = above + UNIT + *((uchar*)s2+i2);\n 1894 | \t\t\ta[i2] = above = left < above\n 1895 | \t\t\t      ? (left_inc < diag_inc ? left_inc : diag_inc)\n 1896 | \t\t\t      : (above_inc < diag_inc ? above_inc : diag_inc);\n 1897 | \t\t\tdiag = left;\n 1898 | \t\t}\n 1899 | \t}\n 1900 | \n 1901 | \treturn a[len2-1];","lines":48,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/util1.c#L1854-L1901"}]},
{"id":"LOGIC_83","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"my_alloc() computes the guard `num >= max_alloc/size` and then allocates `num * size`. The integer division floors, so for some (num,size) pairs near the limit the multiplication num*size can still be slightly below max_alloc and pass, which is intended; but the check does not protect against `size == 0` (division by zero). Callers use sizeof(type) so size is non-zero in practice, yet the public-looking helper has no guard.","fix":"Add `if (size == 0) size = 1;` or assert size > 0 before the division.","locations":[{"ref":"util2.c:73-91","code":"   73 | void *my_alloc(void *ptr, size_t num, size_t size, const char *file, int line)\n   74 | {\n   75 | \tif (num >= max_alloc/size) {\n   76 | \t\tif (!file)\n   77 | \t\t\treturn NULL;\n   78 | \t\trprintf(FERROR, \"[%s] exceeded --max-alloc=%s setting (file=%s, line=%d)\\n\",\n   79 | \t\t\twho_am_i(), do_big_num(max_alloc, 0, NULL), src_file(file), line);\n   80 | \t\texit_cleanup(RERR_MALLOC);\n   81 | \t}\n   82 | \tif (!ptr)\n   83 | \t\tptr = malloc(num * size);\n   84 | \telse if (ptr == do_calloc)\n   85 | \t\tptr = calloc(num, size);\n   86 | \telse\n   87 | \t\tptr = realloc(ptr, num * size);\n   88 | \tif (!ptr && file)\n   89 | \t\t_out_of_memory(\"my_alloc caller\", file, line);\n   90 | \treturn ptr;\n   91 | }","lines":19,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/util2.c#L73-L91"}]},
{"id":"LOGIC_84","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In recv_xattr_request()'s receiver-side search, when lst->count == 1 the `for (j = lst->count; j > 1 ...)` loop body never runs, so the code relies entirely on the initial rxa/cnt already pointing at the sole entry. That holds for the first request but after a prior iteration advanced rxa within the same call (multi-request stream), rxa may be left pointing past the single element; the subsequent `rxa->num != num` check catches it with a protocol error rather than wrapping. Edge-case correctness is subtle and undocumented.","fix":"Reset rxa = lst->items / cnt = lst->count at the start of each receiver search iteration, or handle the count==1 case explicitly, so the scan always starts from a known position.","locations":[{"ref":"xattrs.c:750-767","code":"  750 | \t\t} else {\n  751 | \t\t\tint j;\n  752 | \t\t\t/* The receiving side has no known num order, so we just scan\n  753 | \t\t\t * forward (w/wrap) and hope that the next value is near by. */\n  754 | \t\t\tfor (j = lst->count; j > 1 && rxa->num != num; j--) {\n  755 | \t\t\t\tif (--cnt)\n  756 | \t\t\t\t\trxa++;\n  757 | \t\t\t\telse {\n  758 | \t\t\t\t\tcnt = lst->count;\n  759 | \t\t\t\t\trxa = lst->items;\n  760 | \t\t\t\t}\n  761 | \t\t\t}\n  762 | \t\t}\n  763 | \t\tif (!cnt || rxa->num != num) {\n  764 | \t\t\trprintf(FERROR, \"[%s] could not find xattr #%d for %s\\n\",\n  765 | \t\t\t\twho_am_i(), num, f_name(file, NULL));\n  766 | \t\t\texit_cleanup(RERR_PROTOCOL);\n  767 | \t\t}","lines":18,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/xattrs.c#L750-L767"}]},
{"id":"LOGIC_85","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"medium","description":"find_matching_rsync_acl() uses function-static access_match/default_match as a search cache shared across all calls. Because it is static, the cached index persists between unrelated files/transfers; combined with `*match = racl_list->count - 1` when count is 0 this sets *match = -1 (size_t count-1 wraps but assigned to int = -1) which is then used to index base[*match]. The count==0 case is reachable before any ACL is stored.","fix":"Guard for racl_list->count == 0 (return -1 immediately) before using count-1 as an index, and reset the static match when the list is reset.","locations":[{"ref":"acls.c:455-470","code":"  455 | \tstatic int access_match = -1, default_match = -1;\n  456 | \tint *match = type == SMB_ACL_TYPE_ACCESS ? &access_match : &default_match;\n  457 | \tsize_t count = racl_list->count;\n  458 | \n  459 | \t/* If this is the first time through or we didn't match the last\n  460 | \t * time, then start at the end of the list, which should be the\n  461 | \t * best place to start hunting. */\n  462 | \tif (*match == -1)\n  463 | \t\t*match = racl_list->count - 1;\n  464 | \twhile (count--) {\n  465 | \t\trsync_acl *base = racl_list->items;\n  466 | \t\tif (rsync_acl_equal(base + *match, racl))\n  467 | \t\t\treturn *match;\n  468 | \t\tif (!(*match)--)\n  469 | \t\t\t*match = racl_list->count - 1;\n  470 | \t}","lines":16,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/acls.c#L455-L470"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"medium","description":"AVX2 get_checksum1 applies the wrong CHAR_OFFSET correction. This loop consumes 64 bytes per iteration, and the algorithm comment above the function (lines 348-350) says it must add 64*CHAR_OFFSET to s1 and 2080*CHAR_OFFSET to s2. Instead the code adds 32*CHAR_OFFSET and 528*CHAR_OFFSET (the values copied verbatim from the 32-byte SSSE3/SSE2 loops). When rsync is built with a nonzero CHAR_OFFSET, the AVX2 path produces a different checksum1 than the scalar/SSE paths, breaking block matching and corrupting the rolling-checksum negotiation. CHAR_OFFSET is 0 in stock builds so the default build is unaffected, but the code is wrong for any nonzero setting.","fix":"In the AVX2 loop use the 64-byte constants: _mm_set1_epi32(64 * CHAR_OFFSET) for ss1 and _mm_set1_epi32(2080 * CHAR_OFFSET) for ss2, matching the documented per-64-byte formula.","locations":[{"ref":"simd-checksum-x86_64.cpp:431-439","code":"  431 | #if CHAR_OFFSET != 0\n  432 |             // s1 += 32*CHAR_OFFSET\n  433 |             __m128i char_offset_multiplier = _mm_set1_epi32(32 * CHAR_OFFSET);\n  434 |             ss1 = _mm_add_epi32(ss1, char_offset_multiplier);\n  435 | \n  436 |             // s2 += 528*CHAR_OFFSET\n  437 |             char_offset_multiplier = _mm_set1_epi32(528 * CHAR_OFFSET);\n  438 |             ss2 = _mm_add_epi32(ss2, char_offset_multiplier);\n  439 | #endif","lines":9,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/simd-checksum-x86_64.cpp#L431-L439"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"access_match() calls strdup(list) and immediately strlower(list2) without checking strdup for NULL. Under memory pressure this is a NULL-pointer dereference in the daemon access-control path. Although rsync usually treats OOM as fatal elsewhere via out_of_memory(), here the unchecked strdup turns OOM into a crash rather than a clean error, and a crash mid-access-check is a security-relevant denial of service.","fix":"Check the strdup() result and call out_of_memory(\"access_match\") (or treat as deny) on NULL.","locations":[{"ref":"access.c:266-268","code":"  266 | \tchar *list2 = strdup(list);\n  267 | \n  268 | \tstrlower(list2);","lines":3,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/access.c#L266-L268"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"In make_backup(), when copying a device/special/symlink fails (do_mknod_at or do_symlink_at error), the code only logs via rsyserr but still sets ret = 2 (device case) or ret = 2 (symlink else-branch). For the device branch, ret is set to 2 unconditionally even on mknod failure, so make_backup reports success and the caller (delete_item) will proceed to unlink the original even though no backup was created, losing data.","fix":"On do_mknod_at failure, leave ret as 0 (or set an explicit failure) so the caller does not treat the missing backup as a successful duplication. Only set ret = 2 when the mknod actually succeeded.","locations":[{"ref":"backup.c:357-365","code":"  357 | \t/* Check to see if this is a device file, or link */\n  358 | \tif ((am_root && preserve_devices && IS_DEVICE(file->mode))\n  359 | \t || (preserve_specials && IS_SPECIAL(file->mode))) {\n  360 | \t\tif (do_mknod_at(buf, file->mode, sx.st.st_rdev) < 0)\n  361 | \t\t\trsyserr(FERROR, errno, \"mknod %s failed\", full_fname(buf));\n  362 | \t\telse if (DEBUG_GTE(BACKUP, 1))\n  363 | \t\t\trprintf(FINFO, \"make_backup: DEVICE %s successful.\\n\", fname);\n  364 | \t\tret = 2;\n  365 | \t}","lines":9,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/backup.c#L357-L365"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"fread error handling in exchange_protocols() motd loop and in the early_input_file send loop only checks feof/return value loosely. In the motd loop 'while (f && !feof(f))' a hard read error (ferror) that returns 0 without setting EOF would spin forever; more importantly fread short-count vs error is not distinguished. Lower impact but worth hardening since this runs in the daemon.","fix":"Break out of the loop on ferror(f), not just feof(f); check ferror after fread returns 0.","locations":[{"ref":"clientserver.c:191-199","code":"  191 | \t\t\twhile (f && !feof(f)) {\n  192 | \t\t\t\tint len = fread(buf, 1, bufsiz - 1, f);\n  193 | \t\t\t\tif (len > 0)\n  194 | \t\t\t\t\twrite_buf(f_out, buf, len);\n  195 | \t\t\t}\n  196 | \t\t\tif (f)\n  197 | \t\t\t\tfclose(f);\n  198 | \t\t\twrite_sbuf(f_out, \"\\n\");\n  199 | \t\t}","lines":9,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/clientserver.c#L191-L199"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"In send_file_list, when iconv conversion of files-from lines or args occurs the read_line/sanitize path silently continues, but more importantly the strlcpy at line 2303 truncates argv entries longer than MAXPATHLEN without any error: an over-long source arg is silently truncated to a different path rather than reported, potentially transferring the wrong file.","fix":"Check the strlcpy return against MAXPATHLEN and emit an overflow/skip error for over-long argument paths, mirroring the handling in make_file().","locations":[{"ref":"flist.c:2572-2578","code":" 2572 | \t\t} else {\n 2573 | \t\t\tif (argc-- == 0)\n 2574 | \t\t\t\tbreak;\n 2575 | \t\t\tstrlcpy(fbuf, *argv++, MAXPATHLEN);\n 2576 | \t\t\tif (sanitize_paths)\n 2577 | \t\t\t\tsanitize_path(fbuf, fbuf, \"\", 0, SP_KEEP_DOT_DIRS);\n 2578 | \t\t}","lines":7,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/flist.c#L2572-L2578"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"forward_filesfrom_data() ignores read() errors other than EINTR by treating them as EOF. When read() returns -1 with any errno != EINTR (e.g. EIO, EBADF), the code at line 376 falls into the `len == 0 || errno != EINTR` branch and silently sends the end-of-file marker as if the files-from source closed cleanly, rather than reporting the I/O error. A truncated/garbled --files-from list would be sent as if complete.","fix":"Distinguish a true read error from EOF: on len < 0 with errno not in {EINTR, EAGAIN, EWOULDBLOCK}, emit an error (rsyserr) and exit_cleanup(RERR_FILEIO) instead of sending a clean EOF marker.","locations":[{"ref":"io.c:455-471","code":"  455 | static void forward_filesfrom_data(void)\n  456 | {\n  457 | \tssize_t len;\n  458 | \n  459 | \tlen = read(ff_forward_fd, ff_xb.buf + ff_xb.len, ff_xb.size - ff_xb.len);\n  460 | \tif (len <= 0) {\n  461 | \t\tif (len == 0 || errno != EINTR) {\n  462 | \t\t\t/* Send end-of-file marker */\n  463 | \t\t\tff_forward_fd = -1;\n  464 | \t\t\twrite_buf(iobuf.out_fd, \"\\0\\0\", ff_lastchar ? 2 : 1);\n  465 | \t\t\tfree_xbuf(&ff_xb);\n  466 | \t\t\tif (ff_reenable_multiplex >= 0)\n  467 | \t\t\t\tio_start_multiplex_out(ff_reenable_multiplex);\n  468 | \t\t\tfree_implied_include_partial_string();\n  469 | \t\t}\n  470 | \t\treturn;\n  471 | \t}","lines":17,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/io.c#L455-L471"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"very_easy","description":"set_dparams() does 'equal = strchr(params[j], '='); *equal = 0;' with no NULL check, relying on the comment 'options.c verified this'. If that invariant is ever violated (e.g., a --dparam value without '=' reaching here through a different code path), this is a NULL dereference. The defensive cost is trivial.","fix":"Guard: if (!equal) continue; (or log and skip) instead of unconditionally dereferencing.","locations":[{"ref":"loadparm.c:672-674","code":"  672 | \tfor (j = 0; j < dparam_list.count; j++) {\n  673 | \t\tequal = strchr(params[j], '='); /* options.c verified this */\n  674 | \t\t*equal = '\\0';","lines":3,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/loadparm.c#L672-L674"}]},
