<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"recv_acl_access() does not validate the received access bits when am_root < 0 (fake-super). In that mode arbitrary attacker-controlled bits flow into user_obj/group_obj/mask_obj/other_obj and the per-name access fields and are later serialized via SIVAL into the stored ACL xattr (set_rsync_acl) without range checking, defeating the SMB_ACL_VALID_*_BITS guard that exists for the normal path.","fix":"Apply the SMB_ACL_VALID_NAME_BITS / SMB_ACL_VALID_OBJ_BITS range check regardless of am_root, or explicitly mask the value before storing it.","locations":[{"ref":"acls.c:909-922","code":"  909 | \t\tif (am_root >= 0 && access & ~SMB_ACL_VALID_NAME_BITS)\n  910 | \t\t\tgoto value_error;\n  911 | \t\tif (flags & XFLAG_NAME_FOLLOWS)\n  912 | \t\t\t*name_follows_ptr = 1;\n  913 | \t\telse\n  914 | \t\t\t*name_follows_ptr = 0;\n  915 | \t\tif (flags & XFLAG_NAME_IS_USER)\n  916 | \t\t\taccess |= NAME_IS_USER;\n  917 | \t} else if (am_root >= 0 && access & ~SMB_ACL_VALID_OBJ_BITS) {\n  918 | \t  value_error:\n  919 | \t\trprintf(FERROR_XFER, \"recv_acl_access: value out of range: %x\\n\",\n  920 | \t\t\taccess);\n  921 | \t\texit_cleanup(RERR_STREAMIO);\n  922 | \t}","lines":14,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/acls.c#L909-L922"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"idev_find() can return NULL (its hashtable-insert path can fail), but the sender dereferences the result without a NULL check: 'np->data' and 'np->data = ...'. A NULL return causes a crash when transmitting hard-linked files.","fix":"Check 'np' for NULL after idev_find() and handle the out-of-memory/insert-failure case (e.g. call out_of_memory) before dereferencing np->data.","locations":[{"ref":"flist.c:601-605","code":"  601 | \t\t\tstruct ht_int64_node *np = idev_find(tmp_dev, tmp_ino);\n  602 | \t\t\tfirst_hlink_ndx = (int32)(long)np->data; /* is -1 when new */\n  603 | \t\t\tif (first_hlink_ndx < 0) {\n  604 | \t\t\t\tnp->data = (void*)(long)(first_ndx + ndx);\n  605 | \t\t\t\txflags |= XMIT_HLINK_FIRST;","lines":5,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/flist.c#L601-L605"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"AIX sys_acl_free_acl() dereferences posix_acl->nextp in the for-loop initializer and the trailing fixups without a NULL guard. For a list with a single node (count produced exactly one link, nextp == NULL) the loop condition `acl_entry_link->nextp != NULL` is checked on `posix_acl->nextp` which is NULL, so the for body is skipped, but then the post-loop code dereferences acl_entry_link->prevp on a node whose prevp may be NULL (head), causing a NULL dereference.","fix":"Handle the single-node / empty list cases explicitly and null-check prevp before dereferencing; walk the list defensively from the head freeing each node once.","locations":[{"ref":"lib/sysacls.c:2728-2743","code":" 2728 | int sys_acl_free_acl(SMB_ACL_T posix_acl)\n 2729 | {\n 2730 | \tstruct acl_entry_link *acl_entry_link;\n 2731 | \n 2732 | \tfor (acl_entry_link = posix_acl->nextp; acl_entry_link->nextp != NULL; acl_entry_link = acl_entry_link->nextp) {\n 2733 | \t\tSAFE_FREE(acl_entry_link->prevp->entryp);\n 2734 | \t\tSAFE_FREE(acl_entry_link->prevp);\n 2735 | \t}\n 2736 | \n 2737 | \tSAFE_FREE(acl_entry_link->prevp->entryp);\n 2738 | \tSAFE_FREE(acl_entry_link->prevp);\n 2739 | \tSAFE_FREE(acl_entry_link->entryp);\n 2740 | \tSAFE_FREE(acl_entry_link);\n 2741 | \n 2742 | \treturn 0;\n 2743 | }","lines":16,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/lib/sysacls.c#L2728-L2743"}]},
{"id":"UAF_1","type":"use_after_free","type_label":"Use After Free","severity":"medium","difficulty":"medium","description":"usermap/groupmap are assigned directly from poptGetOptArg() (popt-owned) and retained globally, then poptFreeContext(pc) is called at line 2104. server_options() later passes usermap/groupmap to safe_arg(). With popt 1.19 freeing returned option-arg memory on context destruction, these retained pointers can dangle. (The --chown path uses asprintf and is safe; the direct --usermap/--groupmap assignments are not.)","fix":"strdup() the poptGetOptArg() result when assigning usermap/groupmap, matching the asprintf-allocated case used by --chown.","locations":[{"ref":"options.c:1904","code":" 1904 | \t\t\tusermap = (char *)poptGetOptArg(pc);","lines":1,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/options.c#L1904"},{"ref":"options.c:1920","code":" 1920 | \t\t\tgroupmap = (char *)poptGetOptArg(pc);","lines":1,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/options.c#L1920"},{"ref":"options.c:2216","code":" 2216 | \t\tpoptFreeContext(pc);","lines":1,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/options.c#L2216"},{"ref":"options.c:3092-3096","code":" 3092 | \t\tif (usermap)\n 3093 | \t\t\targs[ac++] = safe_arg(\"--usermap\", usermap);\n 3094 | \n 3095 | \t\tif (groupmap)\n 3096 | \t\t\targs[ac++] = safe_arg(\"--groupmap\", groupmap);","lines":5,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/options.c#L3092-L3096"}]},
{"id":"RACE_1","type":"race_condition","type_label":"Race Condition","severity":"high","difficulty":"hard","description":"rsync_panic_handler() is an async-signal handler installed for SIGSEGV/SIGFPE/SIGABRT/SIGBUS (maintainer mode). It calls snprintf() and shell_exec(), which in turn calls getenv(), system() or fork()+execlp()+waitpid()+wait_process(). system() and the malloc/stdio machinery reached through it are not async-signal-safe, so invoking them from a fault handler can deadlock or corrupt state instead of producing the intended debugger. This defeats the very crash-debugging the handler is meant to provide.","fix":"From the fault handler only set a volatile sig_atomic_t flag (or call _exit after a raw write()), or restrict to strictly async-signal-safe primitives. Do the fork/exec of the debugger from outside signal context, or use only direct syscalls (no system()/getenv()).","locations":[{"ref":"main.c:1772-1784","code":" 1772 | static void rsync_panic_handler(UNUSED(int whatsig))\n 1773 | {\n 1774 | \tchar cmd_buf[300];\n 1775 | \tint ret, pid_int = getpid();\n 1776 | \n 1777 | \tsnprintf(cmd_buf, sizeof cmd_buf, get_panic_action(), pid_int, pid_int);\n 1778 | \n 1779 | \t/* Unless we failed to execute gdb, we allow the process to\n 1780 | \t * continue.  I'm not sure if that's right. */\n 1781 | \tret = shell_exec(cmd_buf);\n 1782 | \tif (ret)\n 1783 | \t\t_exit(ret);\n 1784 | }","lines":13,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/main.c#L1772-L1784"},{"ref":"main.c:176-195","code":"  176 | int shell_exec(const char *cmd)\n  177 | {\n  178 | \tchar *shell = getenv(\"RSYNC_SHELL\");\n  179 | \tint status;\n  180 | \tpid_t pid;\n  181 | \n  182 | \tif (!shell)\n  183 | \t\treturn system(cmd);\n  184 | \n  185 | \tif ((pid = fork()) < 0)\n  186 | \t\treturn -1;\n  187 | \n  188 | \tif (pid == 0) {\n  189 | \t\texeclp(shell, shell, \"-c\", cmd, NULL);\n  190 | \t\t_exit(1);\n  191 | \t}\n  192 | \n  193 | \tint ret = wait_process(pid, &status, 0);\n  194 | \treturn ret < 0 ? -1 : status;\n  195 | }","lines":20,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/main.c#L176-L195"}]},
{"id":"RACE_2","type":"race_condition","type_label":"Race Condition","severity":"medium","difficulty":"medium","description":"wait_process() reads and writes the shared pid_stat_table[] (clearing a matched slot's pid) without blocking SIGCHLD. remember_children() is the SIGCHLD handler and also scans/writes pid_stat_table[]. If SIGCHLD fires while wait_process() is mid-scan, the handler can fill or the main code can clear the same slot concurrently, losing a child's exit status or producing an inconsistent table.","fix":"Block SIGCHLD (sigprocmask/sigaddset) around the pid_stat_table scan in wait_process(), or use sig_atomic_t-safe access discipline, so the handler and main path never touch the table simultaneously.","locations":[{"ref":"main.c:152-174","code":"  152 | pid_t wait_process(pid_t pid, int *status_ptr, int flags)\n  153 | {\n  154 | \tpid_t waited_pid;\n  155 | \n  156 | \tdo {\n  157 | \t\twaited_pid = waitpid(pid, status_ptr, flags);\n  158 | \t} while (waited_pid == -1 && errno == EINTR);\n  159 | \n  160 | \tif (waited_pid == -1 && errno == ECHILD) {\n  161 | \t\t/* Status of requested child no longer available:  check to\n  162 | \t\t * see if it was processed by remember_children(). */\n  163 | \t\tint cnt;\n  164 | \t\tfor (cnt = 0; cnt < MAXCHILDPROCS; cnt++) {\n  165 | \t\t\tif (pid == pid_stat_table[cnt].pid) {\n  166 | \t\t\t\t*status_ptr = pid_stat_table[cnt].status;\n  167 | \t\t\t\tpid_stat_table[cnt].pid = 0;\n  168 | \t\t\t\treturn pid;\n  169 | \t\t\t}\n  170 | \t\t}\n  171 | \t}\n  172 | \n  173 | \treturn waited_pid;\n  174 | }","lines":23,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/main.c#L152-L174"},{"ref":"main.c:1715-1739","code":" 1715 | void remember_children(UNUSED(int val))\n 1716 | {\n 1717 | #ifdef WNOHANG\n 1718 | \tint cnt, status;\n 1719 | \tpid_t pid;\n 1720 | \t/* An empty waitpid() loop was put here by Tridge and we could never\n 1721 | \t * get him to explain why he put it in, so rather than taking it\n 1722 | \t * out we're instead saving the child exit statuses for later use.\n 1723 | \t * The waitpid() loop presumably eliminates all possibility of leaving\n 1724 | \t * zombie children, maybe that's why he did it. */\n 1725 | \twhile ((pid = waitpid(-1, &status, WNOHANG)) > 0) {\n 1726 | \t\t/* save the child's exit status */\n 1727 | \t\tfor (cnt = 0; cnt < MAXCHILDPROCS; cnt++) {\n 1728 | \t\t\tif (pid_stat_table[cnt].pid == 0) {\n 1729 | \t\t\t\tpid_stat_table[cnt].pid = pid;\n 1730 | \t\t\t\tpid_stat_table[cnt].status = status;\n 1731 | \t\t\t\tbreak;\n 1732 | \t\t\t}\n 1733 | \t\t}\n 1734 | \t}\n 1735 | #endif\n 1736 | #ifndef HAVE_SIGACTION\n 1737 | \tsignal(SIGCHLD, remember_children);\n 1738 | #endif\n 1739 | }","lines":25,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/main.c#L1715-L1739"}]},
{"id":"RACE_3","type":"race_condition","type_label":"Race Condition","severity":"medium","difficulty":"hard","description":"sigusr1_handler() and sig_int() (for the non-deferred paths) set called_from_signal_handler=1 and then call exit_cleanup()/_exit_cleanup(), which runs flush_write_file(), io_flush(), close(), unlink(), finish_transfer(), log_exit(), rprintf(), etc. Almost none of these are async-signal-safe. A SIGUSR1/SIGINT arriving while the main path holds a stdio/malloc lock can deadlock or corrupt during the cleanup. This is a long-standing design hazard worth flagging.","fix":"Prefer the deferred-signal mechanism (got_kill_signal) for all cases where IO is multiplexed, and keep the immediate-exit path to async-signal-safe operations only (raw writes + _exit). At minimum document that the literal-data flush path in _exit_cleanup must not be reached from a signal unless flush_ok_after_signal guarantees safety.","locations":[{"ref":"main.c:1676-1680","code":" 1676 | static void sigusr1_handler(UNUSED(int val))\n 1677 | {\n 1678 | \tcalled_from_signal_handler = 1;\n 1679 | \texit_cleanup(RERR_SIGNAL1);\n 1680 | }","lines":5,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/main.c#L1676-L1680"},{"ref":"rsync.c:842-875","code":"  842 | /* This is only called for SIGINT, SIGHUP, and SIGTERM. */\n  843 | void sig_int(int sig_num)\n  844 | {\n  845 | \tcalled_from_signal_handler = 1;\n  846 | \n  847 | \t/* KLUGE: if the user hits Ctrl-C while ssh is prompting\n  848 | \t * for a password, then our cleanup's sending of a SIGUSR1\n  849 | \t * signal to all our children may kill ssh before it has a\n  850 | \t * chance to restore the tty settings (i.e. turn echo back\n  851 | \t * on).  By sleeping for a short time, ssh gets a bigger\n  852 | \t * chance to do the right thing.  If child processes are\n  853 | \t * not ssh waiting for a password, then this tiny delay\n  854 | \t * shouldn't hurt anything. */\n  855 | \tmsleep(400);\n  856 | \n  857 | \t/* If we're an rsync daemon listener (not a daemon server),\n  858 | \t * we'll exit with status 0 if we received SIGTERM. */\n  859 | \tif (am_daemon && !am_server && sig_num == SIGTERM)\n  860 | \t\texit_cleanup(0);\n  861 | \n  862 | \t/* If the signal arrived on the server side (or for the receiver\n  863 | \t * process on the client), we want to try to do a controlled shutdown\n  864 | \t * that lets the client side (generator process) know what happened.\n  865 | \t * To do this, we set a flag and let the normal process handle the\n  866 | \t * shutdown.  We only attempt this if multiplexed IO is in effect and\n  867 | \t * we didn't already set the flag. */\n  868 | \tif (!got_kill_signal && (am_server || am_receiver)) {\n  869 | \t\tgot_kill_signal = sig_num;\n  870 | \t\tcalled_from_signal_handler = 0;\n  871 | \t\treturn;\n  872 | \t}\n  873 | \n  874 | \texit_cleanup(RERR_SIGNAL);\n  875 | }","lines":34,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/rsync.c#L842-L875"},{"ref":"cleanup.c:103-283","code":"  103 | NORETURN void _exit_cleanup(int code, const char *file, int line)\n  104 | {\n  105 | \tstatic int switch_step = 0;\n  106 | \tstatic int exit_code = 0, exit_line = 0;\n  107 | \tstatic const char *exit_file = NULL;\n  108 | \tstatic int first_code = 0;\n  109 | \n  110 | \tSIGACTION(SIGUSR1, SIG_IGN);\n  111 | \tSIGACTION(SIGUSR2, SIG_IGN);\n  112 | \n  113 | \tif (!exit_code) { /* Preserve first error exit info when recursing. */\n  114 | \t\texit_code = code;\n  115 | \t\texit_file = file;\n  116 | \t\texit_line = line < 0 ? -line : line;\n  117 | \t}\n  118 | \n  119 | \t/* If this is the exit at the end of the run, the server side\n  120 | \t * should not attempt to output a message (see log_exit()). */\n  121 | \tif (am_server && code == 0)\n  122 | \t\tam_server = 2;\n  123 | \n  124 | \t/* Some of our actions might cause a recursive call back here, so we\n  125 | \t * keep track of where we are in the cleanup and never repeat a step. */\n  126 | \tswitch (switch_step) {\n  127 | #include \"case_N.h\" /* case 0: */\n  128 | \t\tswitch_step++;\n  129 | \n  130 | \t\tfirst_code = code;\n  131 | \n  132 | \t\tif (output_needs_newline) {\n  133 | \t\t\tfputc('\\n', stdout);\n  134 | \t\t\toutput_needs_newline = 0;\n  135 | \t\t}\n  136 | \n  137 | \t\tif (DEBUG_GTE(EXIT, 2)) {\n  138 | \t\t\trprintf(FINFO,\n  139 | \t\t\t\t\"[%s] _exit_cleanup(code=%d, file=%s, line=%d): entered\\n\",\n  140 | \t\t\t\twho_am_i(), code, src_file(file), line);\n  141 | \t\t}\n  142 | \n  143 | #include \"case_N.h\"\n  144 | \t\tswitch_step++;\n  145 | \n  146 | \t\tif (cleanup_child_pid != -1) {\n  147 | \t\t\tint status;\n  148 | \t\t\tint pid = wait_process(cleanup_child_pid, &status, WNOHANG);\n  149 | \t\t\tif (pid == cleanup_child_pid) {\n  150 | \t\t\t\tstatus = WEXITSTATUS(status);\n  151 | \t\t\t\tif (status > exit_code)\n  152 | \t\t\t\t\texit_code = status;\n  153 | \t\t\t}\n  154 | \t\t}\n  155 | \n  156 | #include \"case_N.h\"\n  157 | \t\tswitch_step++;\n  158 | \n  159 | \t\tif (cleanup_got_literal && (cleanup_fname || cleanup_fd_w != -1)) {\n  160 | \t\t\tif (cleanup_fd_r != -1) {\n  161 | \t\t\t\tclose(cleanup_fd_r);\n  162 | \t\t\t\tcleanup_fd_r = -1;\n  163 | \t\t\t}\n  164 | \t\t\tif (cleanup_fd_w != -1) {\n  165 | \t\t\t\tflush_write_file(cleanup_fd_w);\n  166 | \t\t\t\tclose(cleanup_fd_w);\n  167 | \t\t\t\tcleanup_fd_w = -1;\n  168 | \t\t\t}\n  169 | \t\t\tif (cleanup_fname && cleanup_new_fname && keep_partial\n  170 | \t\t\t && handle_partial_dir(cleanup_new_fname, PDIR_CREATE)) {\n  171 | \t\t\t\tint tweak_modtime = 0;\n  172 | \t\t\t\tconst char *fname = cleanup_fname;\n  173 | \t\t\t\tcleanup_fname = NULL;\n  174 | \t\t\t\tif (!partial_dir) {\n  175 | \t\t\t\t\t/* We don't want to leave a partial file with a modern time or it\n  176 | \t\t\t\t\t * could be skipped via --update.  Setting the time to something\n  177 | \t\t\t\t\t * really ol xit_cleanup(code=%d, file=%s, line=%d): \"\n  234 | \t\t\t\t\"about to call exit(%d)%s\\n\",\n  235 | \t\t\t\twho_am_i(), first_code, exit_file, exit_line, exit_code,\n  236 | \t\t\t\tdry_run ? \" (DRY RUN)\" : \"\");\n  237 | \t\t}\n  238 | \n  239 | #include \"case_N.h\"\n  240 | \t\tswitch_step++;\n  241 | \n  242 | \t\tif (exit_code && exit_code != RERR_SOCKETIO && exit_code != RERR_STREAMIO && exit_code != RERR_SIGNAL1\n  243 | \t\t && exit_code != RERR_TIMEOUT && !shutting_down) {\n  244 | \t\t\tif (protocol_version >= 31 || am_receiver) {\n  245 | \t\t\t\tif (line > 0) {\n  246 | \t\t\t\t\tif (DEBUG_GTE(EXIT, 3)) {\n  247 | \t\t\t\t\t\trprintf(FINFO, \"[%s] sending MSG_ERROR_EXIT with exit_code %d\\n\",\n  248 | \t\t\t\t\t\t\twho_am_i(), exit_code);\n  249 | \t\t\t\t\t}\n  250 | \t\t\t\t\tsend_msg_int(MSG_ERROR_EXIT, exit_code);\n  251 | \t\t\t\t}\n  252 | \t\t\t\tif (!am_sender)\n  253 | \t\t\t\t\tio_flush(MSG_FLUSH); /* Be sure to send all messages */\n  254 | \t\t\t\tnoop_io_until_death();\n  255 | \t\t\t}\n  256 | \t\t\telse if (!am_sender)\n  257 | \t\t\t\tio_flush(MSG_FLUSH); /* Be sure to send all messages */\n  258 | \t\t}\n  259 | \n  260 | #include \"case_N.h\"\n  261 | \t\tswitch_step++;\n  262 | \n  263 | \t\tif (am_server && exit_code)\n  264 | \t\t\tmsleep(100);\n  265 | \t\tclose_all();\n  266 | \n  267 | \t\t/* FALLTHROUGH */\n  268 | \tdefault:\n  269 | \t\tbreak;\n  270 | \t}\n  271 | \n  272 | \tif (called_from_signal_handler) {\n  273 | #ifdef GCOV_COVERAGE\n  274 | \t\t/* _exit() bypasses the gcov atexit flush; rsync's generator (and\n  275 | \t\t * other processes) normally finish via the signal handler, so\n  276 | \t\t * without this they would write no .gcda. Harmless otherwise. */\n  277 | \t\textern void __gcov_dump(void);\n  278 | \t\t__gcov_dump();\n  279 | #endif\n  280 | \t\t_exit(exit_code);\n  281 | \t}\n  282 | \texit(exit_code);\n  283 | }","lines":181,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1 {"id":"RACE_4","type":"race_condition","type_label":"Race Condition","severity":"low","difficulty":"easy","description":"sleep_for_bwlimit() uses a `static long total_written` accumulator and casts intermediate products to int64 only for the elapsed-time term (line 2115) but stores the bwlimit-scaled result back into a `long` (line 2133). On 32-bit platforms `long` is 32 bits; `(sleep_usec - elapsed_usec) * bwlimit` and `total_written * (ONE_SEC/1024)` (line 2120) can overflow a 32-bit long for large bwlimit / long sleeps, corrupting the rate limiter (either no throttling or excessive sleeps).","fix":"Use int64 for total_written and for the sleep_usec computation intermediates, or clamp bwlimit-derived products, to avoid 32-bit long overflow in the accumulator math.","locations":[{"ref":"io.c:2311-2345","code":" 2311 | static void sleep_for_bwlimit(int bytes_written)\n 2312 | {\n 2313 | \tstatic struct timeval prior_tv;\n 2314 | \tstatic long total_written = 0;\n 2315 | \tstruct timeval tv, start_tv;\n 2316 | \tlong elapsed_usec, sleep_usec;\n 2317 | \n 2318 | #define ONE_SEC\t1000000L /* # of microseconds in a second */\n 2319 | \n 2320 | \ttotal_written += bytes_written;\n 2321 | \n 2322 | \tgettimeofday(&start_tv, NULL);\n 2323 | \tif (prior_tv.tv_sec) {\n 2324 | \t\telapsed_usec = (start_tv.tv_sec - prior_tv.tv_sec) * ONE_SEC\n 2325 | \t\t\t     + (start_tv.tv_usec - prior_tv.tv_usec);\n 2326 | \t\ttotal_written -= (int64)elapsed_usec * bwlimit / (ONE_SEC/1024);\n 2327 | \t\tif (total_written < 0)\n 2328 | \t\t\ttotal_written = 0;\n 2329 | \t}\n 2330 | \n 2331 | \tsleep_usec = total_written * (ONE_SEC/1024) / bwlimit;\n 2332 | \tif (sleep_usec < ONE_SEC / 10) {\n 2333 | \t\tprior_tv = start_tv;\n 2334 | \t\treturn;\n 2335 | \t}\n 2336 | \n 2337 | \ttv.tv_sec  = sleep_usec / ONE_SEC;\n 2338 | \ttv.tv_usec = sleep_usec % ONE_SEC;\n 2339 | \tselect(0, NULL, NULL, NULL, &tv);\n 2340 | \n 2341 | \tgettimeofday(&prior_tv, NULL);\n 2342 | \telapsed_usec = (prior_tv.tv_sec - start_tv.tv_sec) * ONE_SEC\n 2343 | \t\t     + (prior_tv.tv_usec - start_tv.tv_usec);\n 2344 | \ttotal_written = (sleep_usec - elapsed_usec) * bwlimit / (ONE_SEC/1024);\n 2345 | }","lines":35,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/io.c#L2311-L2345"}]},
{"id":"RACE_5","type":"race_condition","type_label":"Race Condition","severity":"low","difficulty":"medium","description":"remember_children() (SIGCHLD handler) writes into the first free pid_stat_table[] slot but silently drops the status if all MAXCHILDPROCS (7) slots are full. With more than 7 transient children, exit statuses are lost and wait_process() will then mis-report success (it returns the requested pid with whatever *status_ptr held) when ECHILD is hit. Combined with the non-atomic table access this can mask child failures.","fix":"When the table is full, at least record an overflow flag, or size the table dynamically; ensure wait_process() distinguishes 'not found' from 'found with success status'.","locations":[{"ref":"main.c:1715-1739","code":" 1715 | void remember_children(UNUSED(int val))\n 1716 | {\n 1717 | #ifdef WNOHANG\n 1718 | \tint cnt, status;\n 1719 | \tpid_t pid;\n 1720 | \t/* An empty waitpid() loop was put here by Tridge and we could never\n 1721 | \t * get him to explain why he put it in, so rather than taking it\n 1722 | \t * out we're instead saving the child exit statuses for later use.\n 1723 | \t * The waitpid() loop presumably eliminates all possibility of leaving\n 1724 | \t * zombie children, maybe that's why he did it. */\n 1725 | \twhile ((pid = waitpid(-1, &status, WNOHANG)) > 0) {\n 1726 | \t\t/* save the child's exit status */\n 1727 | \t\tfor (cnt = 0; cnt < MAXCHILDPROCS; cnt++) {\n 1728 | \t\t\tif (pid_stat_table[cnt].pid == 0) {\n 1729 | \t\t\t\tpid_stat_table[cnt].pid = pid;\n 1730 | \t\t\t\tpid_stat_table[cnt].status = status;\n 1731 | \t\t\t\tbreak;\n 1732 | \t\t\t}\n 1733 | \t\t}\n 1734 | \t}\n 1735 | #endif\n 1736 | #ifndef HAVE_SIGACTION\n 1737 | \tsignal(SIGCHLD, remember_children);\n 1738 | #endif\n 1739 | }","lines":25,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/main.c#L1715-L1739"},{"ref":"main.c:160-171","code":"  160 | \tif (waited_pid == -1 && errno == ECHILD) {\n  161 | \t\t/* Status of requested child no longer available:  check to\n  162 | \t\t * see if it was processed by remember_children(). */\n  163 | \t\tint cnt;\n  164 | \t\tfor (cnt = 0; cnt < MAXCHILDPROCS; cnt++) {\n  165 | \t\t\tif (pid == pid_stat_table[cnt].pid) {\n  166 | \t\t\t\t*status_ptr = pid_stat_table[cnt].status;\n  167 | \t\t\t\tpid_stat_table[cnt].pid = 0;\n  168 | \t\t\t\treturn pid;\n  169 | \t\t\t}\n  170 | \t\t}\n  171 | \t}","lines":12,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/main.c#L160-L171"}]},
{"id":"RACE_6","type":"race_condition","type_label":"Race Condition","severity":"low","difficulty":"medium","description":"get_tmpname() with make_unique uses a process-global static `counter_limit` seeded\nfrom getpid() and a per-call `counter`. The access() existence test followed by a\nlater create is an inherent TOCTOU, acknowledged in the comment for special files,\nbut for symlink/device creation in a daemon context an attacker who can create files\nin the target directory can force the MAX_UNIQUE_LOOP retries to exhaust and return 0\n(creation failure), a minor DoS on special-file transfers.","fix":"This is acknowledged-best-effort; consider O_EXCL creation where the object type allows it instead of access()+create.","locations":[{"ref":"receiver.c:367-389","code":"  367 | \tif (make_unique) {\n  368 | \t\tstatic unsigned counter_limit;\n  369 | \t\tunsigned counter;\n  370 | \n  371 | \t\tif (!counter_limit) {\n  372 | \t\t\tcounter_limit = (unsigned)getpid() + MAX_UNIQUE_LOOP;\n  373 | \t\t\tif (counter_limit > MAX_UNIQUE_NUMBER || counter_limit < MAX_UNIQUE_LOOP)\n  374 | \t\t\t\tcounter_limit = MAX_UNIQUE_LOOP;\n  375 | \t\t}\n  376 | \t\tcounter = counter_limit - MAX_UNIQUE_LOOP;\n  377 | \n  378 | \t\t/* This doesn't have to be very good because we don't need\n  379 | \t\t * to worry about someone trying to guess the values:  all\n  380 | \t\t * a conflict will do is cause a device, special file, hard\n  381 | \t\t * link, or symlink to fail to be created.  Also: avoid\n  382 | \t\t * using mktemp() due to gcc's annoying warning. */\n  383 | \t\twhile (1) {\n  384 | \t\t\tsnprintf(suf, TMPNAME_SUFFIX_LEN+1, \".%d\", counter);\n  385 | \t\t\tif (access(fnametmp, 0) < 0)\n  386 | \t\t\t\tbreak;\n  387 | \t\t\tif (++counter >= counter_limit)\n  388 | \t\t\t\treturn 0;\n  389 | \t\t}","lines":23,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/receiver.c#L367-L389"}]},
{"id":"RACE_7","type":"race_condition","type_label":"Race Condition","severity":"low","difficulty":"easy","description":"is_in_group() caches getgroups() results in static state across calls; this is process-global and not reentrant. In the daemon, group membership is established before fork per-connection so it is effectively constant, but the function is also used during transfers; if our_gid or the process group set changed at runtime the cache would be stale. Not currently exploitable but a latent correctness hazard.","fix":"Document that the cache assumes a fixed group set for the process lifetime, or provide an invalidation hook if group changes are ever possible.","locations":[{"ref":"uidlist.c:195-240","code":"  195 | static int is_in_group(gid_t gid)\n  196 | {\n  197 | #ifdef HAVE_GETGROUPS\n  198 | \tstatic gid_t last_in;\n  199 | \tstatic int ngroups = -2, last_out = -1;\n  200 | \tstatic GETGROUPS_T *gidset;\n  201 | \tint n;\n  202 | \n  203 | \tif (gid == last_in && last_out >= 0)\n  204 | \t\treturn last_out;\n  205 | \tif (ngroups < -1) {\n  206 | \t\tif ((ngroups = getgroups(0, NULL)) < 0)\n  207 | \t\t\tngroups = 0;\n  208 | \t\tgidset = new_array(GETGROUPS_T, ngroups+1);\n  209 | \t\tif (ngroups > 0)\n  210 | \t\t\tngroups = getgroups(ngroups, gidset);\n  211 | \t\t/* The default gid might not be in the list on some systems. */\n  212 | \t\tfor (n = 0; n < ngroups; n++) {\n  213 | \t\t\tif ((gid_t)gidset[n] == our_gid)\n  214 | \t\t\t\tbreak;\n  215 | \t\t}\n  216 | \t\tif (n == ngroups)\n  217 | \t\t\tgidset[ngroups++] = our_gid;\n  218 | \t\tif (DEBUG_GTE(OWN, 2)) {\n  219 | \t\t\tint pos;\n  220 | \t\t\tchar *gidbuf = new_array(char, ngroups*21+32);\n  221 | \t\t\tpos = snprintf(gidbuf, 32, \"process has %d gid%s: \", ngroups, ngroups == 1? \"\" : \"s\");\n  222 | \t\t\tfor (n = 0; n < ngroups; n++) {\n  223 | \t\t\t\tpos += snprintf(gidbuf+pos, 21, \" %d\", (int)gidset[n]);\n  224 | \t\t\t}\n  225 | \t\t\trprintf(FINFO, \"%s\\n\", gidbuf);\n  226 | \t\t\tfree(gidbuf);\n  227 | \t\t}\n  228 | \t}\n  229 | \n  230 | \tlast_in = gid;\n  231 | \tfor (n = 0; n < ngroups; n++) {\n  232 | \t\tif ((gid_t)gidset[n] == gid)\n  233 | \t\t\treturn last_out = 1;\n  234 | \t}\n  235 | \treturn last_out = 0;\n  236 | \n  237 | #else\n  238 | \treturn gid == our_gid;\n  239 | #endif\n  240 | }","lines":46,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/uidlist.c#L195-L240"}]},
{"id":"RACE_8","type":"race_condition","type_label":"Race Condition","severity":"negligible","difficulty":"easy","description":"idev_find() caches the most-recently-used device node in a function-local `static` (dev_node). This is fine single-threaded but is a hidden global that makes the function non-reentrant and unsafe if the sender ever processes file lists concurrently. It also means the cache is never invalidated if the per-device hashtable is later destroyed.","fix":"Document the single-threaded assumption explicitly, or move the cache into a passed-in context struct so the function is reentrant.","locations":[{"ref":"hlink.c:67-85","code":"   67 | struct ht_int64_node *idev_find(int64 dev, int64 ino)\n   68 | {\n   69 | \tstatic struct ht_int64_node *dev_node = NULL;\n   70 | \n   71 | \t/* Note that some OSes have a dev == 0, so increment to avoid storing a 0. */\n   72 | \tif (!dev_node || dev_node->key != dev+1) {\n   73 | \t\t/* We keep a separate hash table of inodes for every device. */\n   74 | \t\tdev_node = hashtable_find(dev_tbl, dev+1, data_when_new);\n   75 | \t\tif (dev_node->data == data_when_new) {\n   76 | \t\t\tdev_node->data = hashtable_create(512, HT_KEY64);\n   77 | \t\t\tif (DEBUG_GTE(HLINK, 3)) {\n   78 | \t\t\t\trprintf(FINFO, \"[%s] created hashtable for dev %s\\n\",\n   79 | \t\t\t\t\twho_am_i(), big_num(dev));\n   80 | \t\t\t}\n   81 | \t\t}\n   82 | \t}\n   83 | \n   84 | \treturn hashtable_find(dev_node->data, ino, (void*)-1L);\n   85 | }","lines":19,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/hlink.c#L67-L85"}]},
{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"On the client path, daemon_auth_choices is set via strdup() in exchange_protocols() every time it is called and is never freed. start_inband_exchange() calls exchange_protocols() once per connection; the duplicated string lives for the process lifetime. Minor, but it is an unreferenced heap allocation with no free and no single-owner contract.","fix":"Free any previous daemon_auth_choices before reassigning, or document that it is intentionally process-lifetime state.","locations":[{"ref":"clientserver.c:228-233","code":"  228 | \tdaemon_auth_choices = strchr(buf + 9, ' ');\n  229 | \tif (daemon_auth_choices) {\n  230 | \t\tchar *cp;\n  231 | \t\tdaemon_auth_choices = strdup(daemon_auth_choices + 1);\n  232 | \t\tif ((cp = strchr(daemon_auth_choices, '\\n')) != NULL)\n  233 | \t\t\t*cp = '\\0';","lines":6,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/clientserver.c#L228-L233"}]},
{"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"change_pathname() does strdup(dir) into 'cpy' and stores it in the static 'pathname'. On the daemon-excluded error path it goto's chdir_error and sets pathname=NULL without freeing 'cpy', leaking the duplicated string. On the success path the previous strdup'd pathname is also overwritten without being freed (though that copy may be referenced by F_PATHNAME and intentionally long-lived).","fix":"free(cpy) on the chdir_error path when dirlen<0 was used. Audit ownership of the strdup'd pathname so it is freed when no longer referenced.","locations":[{"ref":"flist.c:434-441","code":"  434 | \tif (dirlen < 0) {\n  435 | \t\tchar *cpy = strdup(dir);\n  436 | \t\tif (*cpy != '/')\n  437 | \t\t\tchange_dir(orig_dir, CD_SKIP_CHDIR);\n  438 | \t\tif (path_is_daemon_excluded(cpy, 0))\n  439 | \t\t\tgoto chdir_error;\n  440 | \t\tdir = cpy;\n  441 | \t\tdirlen = -dirlen;","lines":8,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/flist.c#L434-L441"},{"ref":"flist.c:461-470","code":"  461 | \tif (!change_dir(dir, CD_NORMAL)) {\n  462 | \t  chdir_error:\n  463 | \t\tio_error |= IOERR_GENERAL;\n  464 | \t\trsyserr(FERROR_XFER, errno, \"change_dir %s failed\", full_fname(dir));\n  465 | \t\tif (dir != orig_dir)\n  466 | \t\t\tchange_dir(orig_dir, CD_NORMAL);\n  467 | \t\tpathname = NULL;\n  468 | \t\tpathname_len = 0;\n  469 | \t\treturn 0;\n  470 | \t}","lines":10,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/flist.c#L461-L470"}]},
{"id":"MEM_3","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"OPT_MAX_SIZE / OPT_MIN_SIZE / OPT_BWLIMIT reassign the *_arg globals with strdup(do_big_num(...)) without freeing the previous value. If the option is specified more than once on the command line, each prior strdup'd string is leaked. Same pattern: max_size_arg, min_size_arg, bwlimit_arg.","fix":"These args initially point at popt-owned memory, so a naive free is unsafe; track ownership with a flag (or always strdup the original popt arg) and free the previously-owned strdup before overwriting on repeated use.","locations":[{"ref":"options.c:1817","code":" 1817 | \t\t\tmax_size_arg = strdup(do_big_num(max_size, 0, NULL));","lines":1,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/options.c#L1817"},{"ref":"options.c:1823","code":" 1823 | \t\t\tmin_size_arg = strdup(do_big_num(min_size, 0, NULL));","lines":1,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/options.c#L1823"},{"ref":"options.c:1830","code":" 1830 | \t\t\tbwlimit_arg = strdup(do_big_num(size, 0, NULL));","lines":1,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/options.c#L1830"}]},
{"id":"MEM_4","type":"memory_leak","type_label":"Memory Leak","severity":"negligible","difficulty":"easy","description":"OPT_SERVER re-creates the popt context (poptFreeContext then poptGetContext) to disable aliases, but iconv_opt may have been strdup'd earlier from RSYNC_ICONV (line 1378) and is then simply overwritten with NULL here, leaking that allocation. Negligible (one-time, tiny) but is a leak.","fix":"Free the prior strdup'd iconv_opt before setting it to NULL, or track whether it was heap-allocated.","locations":[{"ref":"options.c:1525-1527","code":" 1525 | #ifdef ICONV_OPTION\n 1526 | \t\t\ticonv_opt = NULL;\n 1527 | #endif","lines":3,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/options.c#L1525-L1527"},{"ref":"options.c:1491-1493","code":" 1491 | \tif (!am_daemon && protect_args <= 0 && (arg = getenv(\"RSYNC_ICONV\")) != NULL && *arg)\n 1492 | \t\ticonv_opt = strdup(arg);\n 1493 | #endif","lines":3,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/options.c#L1491-L1493"}]},
{"id":"RES_1","type":"resource_leak","type_label":"Resource Leak","severity":"medium","difficulty":"medium","description":"AIX sys_acl_get_file() leaks the allocated linked list (and previously allocated entryp structs) on every malloc-failure path: it frees only file_acl with SAFE_FREE and returns NULL, never freeing acl_entry_link_head or the partially built chain. Repeated ENOMEM conditions accumulate leaks.","fix":"On each error path free the partially constructed acl_entry_link chain (via sys_acl_free_acl) in addition to file_acl before returning NULL.","locations":[{"ref":"lib/sysacls.c:2016-2068","code":" 2016 | \tacl_entry_link->entryp = SMB_MALLOC_P(struct new_acl_entry);\n 2017 | \tif (acl_entry_link->entryp == NULL) {\n 2018 | \t\tSAFE_FREE(file_acl);\n 2019 | \t\terrno = ENOMEM;\n 2020 | \t\tDEBUG(0, (\"Error in AIX sys_acl_get_file is %d\\n\", errno));\n 2021 | \t\treturn NULL;\n 2022 | \t}\n 2023 | \n 2024 | \tDEBUG(10, (\"acl_entry is %d\\n\", acl_entry));\n 2025 | \tDEBUG(10, (\"acl_last(file_acl) id %d\\n\", acl_last(file_acl)));\n 2026 | \n 2027 | \t/* Check if the extended acl bit is on.   *\n 2028 | \t * If it isn't, do not show the           *\n 2029 | \t * contents of the acl since AIX intends *\n 2030 | \t * the extended info to remain unused     */\n 2031 | \n 2032 | \tif (file_acl->acl_mode & S_IXACL){\n 2033 | \t\t/* while we are not pointing to the very end */\n 2034 | \t\twhile (acl_entry < acl_last(file_acl)) {\n 2035 | \t\t\t/* before we malloc anything, make sure this is  */\n 2036 | \t\t\t/* a valid acl entry and one that we want to map */\n 2037 | \t\t\tidp = id_nxt(acl_entry->ace_id);\n 2038 | \t\t\tif ((acl_entry->ace_type == ACC_SPECIFY || acl_entry->ace_type == ACC_PERMIT)\n 2039 | \t\t\t && idp != id_last(acl_entry)) {\n 2040 | \t\t\t\tacl_entry = acl_nxt(acl_entry);\n 2041 | \t\t\t\tcontinue;\n 2042 | \t\t\t}\n 2043 | \n 2044 | \t\t\tidp = acl_entry->ace_id;\n 2045 | \n 2046 | \t\t\t/* Check if this is the first entry in the linked list. *\n 2047 | \t\t\t * The first entry needs to keep prevp pointing to NULL *\n 2048 | \t\t\t * and already has entryp allocated.                  */\n 2049 | \n 2050 | \t\t\tif (acl_entry_link_head->count != 0) {\n 2051 | \t\t\t\tacl_entry_link->nextp = SMB_MALLOC_P(struct acl_entry_link);\n 2052 | \n 2053 | \t\t\t\tif (acl_entry_link->nextp == NULL) {\n 2054 | \t\t\t\t\tSAFE_FREE(file_acl);\n 2055 | \t\t\t\t\terrno = ENOMEM;\n 2056 | \t\t\t\t\tDEBUG(0, (\"Error in AIX sys_acl_get_file is %d\\n\", errno));\n 2057 | \t\t\t\t\treturn NULL;\n 2058 | \t\t\t\t}\n 2059 | \n 2060 | \t\t\t\tacl_entry_link->nextp->prevp = acl_entry_link;\n 2061 | \t\t\t\tacl_entry_link = acl_entry_link->nextp;\n 2062 | \t\t\t\tacl_entry_link->entryp = SMB_MALLOC_P(struct new_acl_entry);\n 2063 | \t\t\t\tif (acl_entry_link->entryp == NULL) {\n 2064 | \t\t\t\t\tSAFE_FREE(file_acl);\n 2065 | \t\t\t\t\terrno = ENOMEM;\n 2066 | \t\t\t\t\tDEBUG(0, (\"Error in AIX sys_acl_get_file is %d\\n\", errno));\n 2067 | \t\t\t\t\treturn NULL;\n 2068 | \t\t\t\t}","lines":53,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/lib/sysacls.c#L2016-L2068"},{"ref":"lib/sysacls.c:2121-2137","code":" 2121 | \t\t\tacl_entry_link->nextp = SMB_MALLOC_P(struct acl_entry_link);\n 2122 | \t\t\tif (acl_entry_link->nextp == NULL) {\n 2123 | \t\t\t\tSAFE_FREE(file_acl);\n 2124 | \t\t\t\terrno = ENOMEM;\n 2125 | \t\t\t\tDEBUG(0, (\"Error in AIX sys_acl_get_file is %d\\n\", errno));\n 2126 | \t\t\t\treturn NULL;\n 2127 | \t\t\t}\n 2128 | \n 2129 | \t\t\tacl_entry_link->nextp->prevp = acl_entry_link;\n 2130 | \t\t\tacl_entry_link = acl_entry_link->nextp;\n 2131 | \t\t\tacl_entry_link->entryp = SMB_MALLOC_P(struct new_acl_entry);\n 2132 | \t\t\tif (acl_entry_link->entryp == NULL) {\n 2133 | \t\t\t\tSAFE_FREE(file_acl);\n 2134 | \t\t\t\terrno = ENOMEM;\n 2135 | \t\t\t\tDEBUG(0, (\"Error in AIX sys_acl_get_file is %d\\n\", errno));\n 2136 | \t\t\t\treturn NULL;\n 2137 | \t\t\t}","lines":1 {"id":"RES_2","type":"resource_leak","type_label":"Resource Leak","severity":"medium","difficulty":"easy","description":"In the socket-creation branch of do_mknod(), if socket() succeeds but the subsequent unlink() or bind() fails, the function returns -1 without closing the socket descriptor `sock`. Each failed special-file (socket) creation leaks one file descriptor.","fix":"On the error path, close `sock` before returning -1 (e.g. capture the success of socket() separately, and `if (sock >= 0) close(sock);` before `return -1;`).","locations":[{"ref":"syscall.c:1284-1287","code":" 1284 | \t\tif ((sock = socket(PF_UNIX, SOCK_STREAM, 0)) < 0\n 1285 | \t\t || (unlink(pathname) < 0 && errno != ENOENT)\n 1286 | \t\t || (bind(sock, (struct sockaddr*)&saddr, sizeof saddr)) < 0)\n 1287 | \t\t\treturn -1;","lines":4,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/syscall.c#L1284-L1287"}]},
{"id":"RES_3","type":"resource_leak","type_label":"Resource Leak","severity":"medium","difficulty":"easy","description":"do_fork() writes child pids into the fixed-size array `all_pids[10]` indexed by `num_pids` with no bounds check. If more than 10 children are forked over the process lifetime, num_pids overruns the static array (out-of-bounds write) and kill_all() later iterates past the array as well.","fix":"Bound the write (`if (num_pids < (int)(sizeof all_pids/sizeof all_pids[0]))`) or grow the array dynamically; assert/log if the limit is exceeded.","locations":[{"ref":"util1.c:668-680","code":"  668 | static pid_t all_pids[10];\n  669 | static int num_pids;\n  670 | \n  671 | /** Fork and record the pid of the child. **/\n  672 | pid_t do_fork(void)\n  673 | {\n  674 | \tpid_t newpid = fork();\n  675 | \n  676 | \tif (newpid != 0  &&  newpid != -1) {\n  677 | \t\tall_pids[num_pids++] = newpid;\n  678 | \t}\n  679 | \treturn newpid;\n  680 | }","lines":13,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/util1.c#L668-L680"},{"ref":"util1.c:692-709","code":"  692 | void kill_all(int sig)\n  693 | {\n  694 | \tint i;\n  695 | \n  696 | \tfor (i = 0; i < num_pids; i++) {\n  697 | \t\t/* Let's just be a little careful where we\n  698 | \t\t * point that gun, hey?  See kill(2) for the\n  699 | \t\t * magic caused by negative values. */\n  700 | \t\tpid_t p = all_pids[i];\n  701 | \n  702 | \t\tif (p == getpid())\n  703 | \t\t\tcontinue;\n  704 | \t\tif (p <= 0)\n  705 | \t\t\tcontinue;\n  706 | \n  707 | \t\tkill(p, sig);\n  708 | \t}\n  709 | }","lines":18,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/util1.c#L692-L709"}]},
{"id":"RES_4","type":"resource_leak","type_label":"Resource Leak","severity":"low","difficulty":"medium","description":"In write_batch_shell_file(), if any write() in the body fails, `err` is accumulated but batch_sh_fd is only closed inside the final combined check at line 307 (`... || close(batch_sh_fd) < 0 || err`). Because of short-circuit `||`, if the final newline write succeeds and close succeeds, err is then evaluated; but if an earlier write set err and the final write also fails, exit_cleanup runs without ever closing batch_sh_fd on the error path where the final write() itself returns != 1 (close is short-circuited away). The fd leaks until process exit (minor, since exit_cleanup follows).","fix":"Close batch_sh_fd unconditionally before evaluating the error, e.g. compute the write/close results into separate variables, close the fd, then test err and exit_cleanup as needed.","locations":[{"ref":"batch.c:343-347","code":"  343 | \tif (write(batch_sh_fd, \"\\n\", 1) != 1 || close(batch_sh_fd) < 0 || err) {\n  344 | \t\trsyserr(FERROR, errno, \"Batch file %s.sh write error\", batch_name);\n  345 | \t\texit_cleanup(RERR_FILEIO);\n  346 | \t}\n  347 | \tbatch_sh_fd = -1;","lines":5,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/batch.c#L343-L347"}]},
{"id":"RES_5","type":"resource_leak","type_label":"Resource Leak","severity":"low","difficulty":"very_easy","description":"flush_delete_delay() closes deldelay_fd on a write failure but does not reset it to -1. The descriptor number remains >= 0 in the static variable. do_delayed_deletions() and read_delay_line() both gate behavior on deldelay_fd >= 0, so any later code path that reaches them would operate on a closed (or recycled) descriptor. It is mostly contained because the same failure sets delete_during = 0, but the stale fd is a latent bug if the buffering logic is reused.","fix":"After close(deldelay_fd) on the error path, set deldelay_fd = -1.","locations":[{"ref":"generator.c:149-162","code":"  149 | static int flush_delete_delay(void)\n  150 | {\n  151 | \tif (deldelay_fd < 0 && !start_delete_delay_temp())\n  152 | \t\treturn 0;\n  153 | \tif (write(deldelay_fd, deldelay_buf, deldelay_cnt) != deldelay_cnt) {\n  154 | \t\trsyserr(FERROR, errno, \"flush of delete-delay buffer\");\n  155 | \t\tdelete_during = 0;\n  156 | \t\tdelete_after = !inc_recurse;\n  157 | \t\tclose(deldelay_fd);\n  158 | \t\treturn 0;\n  159 | \t}\n  160 | \tdeldelay_cnt = 0;\n  161 | \treturn 1;\n  162 | }","lines":14,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/generator.c#L149-L162"}]},
{"id":"RES_6","type":"resource_leak","type_label":"Resource Leak","severity":"low","difficulty":"medium","description":"include_config() directory branch: if EXPAND_ITEM_LIST/strdup of dir entries succeeds but a later pm_process() returns non-1 and breaks the loop, all bpp[j] strings and bpp are freed at the end (good). However the 'if (!(bpp = conf_list.items)) return 1;' early-return path is taken when the directory matched zero files - conf_list.items is NULL and nothing leaks. Fine. But on the opendir success with readdir entries, if realloc inside EXPAND_ITEM_LIST moves the list, earlier strdup'd pointers are preserved (stored in the list), so no leak. No action strictly required; noting the manual free dance is easy to break.","fix":"Consider a small helper to own the conf_list lifetime to reduce the chance a future edit forgets to free entries.","locations":[{"ref":"params.c:430-472","code":"  430 |     } else if (S_ISDIR(sb.st_mode)) {\n  431 | \tchar buf[MAXPATHLEN], **bpp;\n  432 | \titem_list conf_list;\n  433 | \tstruct dirent *di;\n  434 | \tsize_t j;\n  435 | \tDIR *d;\n  436 | \n  437 | \tif (!(d = opendir(include))) {\n  438 | \t    rsyserr(FLOG, errno, \"unable to open config dir \\\"%s\\\"\", include);\n  439 | \t    return 0;\n  440 | \t}\n  441 | \n  442 | \tmemset(&conf_list, 0, sizeof conf_list);\n  443 | \n  444 | \twhile ((di = readdir(d)) != NULL) {\n  445 | \t    char *dname = d_name(di);\n  446 | \t    if (!wildmatch(match, dname))\n  447 | \t\tcontinue;\n  448 | \t    bpp = EXPAND_ITEM_LIST(&conf_list, char *, 32);\n  449 | \t    pathjoin(buf, sizeof buf, include, dname);\n  450 | \t    *bpp = strdup(buf);\n  451 | \t}\n  452 | \tclosedir(d);\n  453 | \n  454 | \tif (!(bpp = conf_list.items))\n  455 | \t    return 1;\n  456 | \n  457 | \tif (conf_list.count > 1)\n  458 | \t    qsort(bpp, conf_list.count, sizeof (char *), name_cmp);\n  459 | \n  460 | \tfor (j = 0, ret = 1; j < conf_list.count; j++) {\n  461 | \t    if (manage_globals && the_sfunc)\n  462 | \t\tthe_sfunc(j == 0 ? \"]push\" : \"]reset\");\n  463 | \t    if ((ret = pm_process(bpp[j], the_sfunc, the_pfunc)) != 1)\n  464 | \t\tbreak;\n  465 | \t}\n  466 | \n  467 | \tif (manage_globals && the_sfunc)\n  468 | \t    the_sfunc(\"]pop\");\n  469 | \n  470 | \tfor (j = 0; j < conf_list.count; j++)\n  471 | \t    free(bpp[j]);\n  472 | \tfree(bpp);","lines":43,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/params.c#L430-L472"}]},
{"id":"RES_7","type":"resource_leak","type_label":"Resource Leak","severity":"negligible","difficulty":"easy","description":"istring() (usage.c) allocates with asprintf for each capability string built into the info_flags[] array in print_info_flags(), and these allocations are never freed. Since this runs once at --version/print and the process effectively exits or proceeds, it is a minor one-shot leak, but the strings (e.g. the istring() %d-bit entries) are leaked deterministically every call.","fix":"Free the istring()-allocated entries after building/printing the list, or accept and document the intentional one-shot leak.","locations":[{"ref":"usage.c:30-36","code":"   30 | static char *istring(const char *fmt, int val)\n   31 | {\n   32 | \tchar *str;\n   33 | \tif (asprintf(&str, fmt, val) < 0)\n   34 | \t\tout_of_memory(\"istring\");\n   35 | \treturn str;\n   36 | }","lines":7,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/usage.c#L30-L36"},{"ref":"usage.c:48-51","code":"   48 | \t\tistring(\"%d-bit files\", (int)(sizeof (OFF_T) * 8)),\n   49 | \t\tistring(\"%d-bit inums\", (int)(sizeof dumstat->st_ino * 8)), /* Don't check ino_t! */\n   50 | \t\tistring(\"%d-bit timestamps\", (int)(sizeof (time_t) * 8)),\n   51 | \t\tistring(\"%d-bit long ints\", (int)(sizeof (int64) * 8)),","lines":4,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/usage.c#L48-L51"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"hard","description":"read_a_msg() decodes the multiplexed length as `msg_bytes = tag & 0xFFFFFF` (up to 16MB) from the wire. For MSG_DATA (line 1525-1526) it sets `iobuf.raw_input_ends_before = iobuf.in.pos + msg_bytes` with no check that msg_bytes is sane relative to iobuf.in.size. Downstream, read_buf() computes `iobuf.raw_input_ends_before - iobuf.in.pos` as the available raw length; a hostile peer can send an MSG_DATA header claiming up to 16MB while the input buffer is far smaller, and the wrap arithmetic in perform_io (raw_input_ends_before -= in.size / -= in.pos) plus drain_multiplex_messages() `raw_len = raw_input_ends_before - in.pos` operate on this attacker-controlled span. While the circular-buffer reads are individually clamped, the unvalidated 16MB span feeds size_t subtractions that can transiently underflow in drain_multiplex_messages (raw_len huge) and skew len bookkeeping.","fix":"Validate MSG_DATA msg_bytes against a protocol maximum (it should never exceed the negotiated max raw chunk / iobuf.in.size budget) before storing raw_input_ends_before, aborting with RERR_STREAMIO on an out-of-range length, consistent with the explicit bounds checks added elsewhere (read_int_bounded / read_varint_size).","locations":[{"ref":"io.c:1695-1713","code":" 1695 | \tmsg_bytes = tag & 0xFFFFFF;\n 1696 | \ttag = (tag >> 24) - MPLEX_BASE;\n 1697 | \n 1698 | \tif (msgs2stderr == 1 && DEBUG_GTE(IO, 1)) {\n 1699 | \t\trprintf(FINFO, \"[%s] got msg=%d, len=%\" SIZE_T_FMT_MOD \"d\\n\",\n 1700 | \t\t\twho_am_i(), (int)tag, (SIZE_T_FMT_CAST)msg_bytes);\n 1701 | \t}\n 1702 | \n 1703 | \tswitch (tag) {\n 1704 | \tcase MSG_DATA:\n 1705 | \t\tassert(iobuf.raw_input_ends_before == 0);\n 1706 | \t\t/* Though this does not yet read the data, we do mark where in\n 1707 | \t\t * the buffer the msg data will end once it is read.  It is\n 1708 | \t\t * possible that this points off the end of the buffer, in\n 1709 | \t\t * which case the gradual reading of the input stream will\n 1710 | \t\t * cause this value to wrap around and eventually become real. */\n 1711 | \t\tif (msg_bytes)\n 1712 | \t\t\tiobuf.raw_input_ends_before = iobuf.in.pos + msg_bytes;\n 1713 | \t\tiobuf.in_multiplexed = 1;","lines":19,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/io.c#L1695-L1713"},{"ref":"io.c:1928-1944","code":" 1928 | static void drain_multiplex_messages(void)\n 1929 | {\n 1930 | \twhile (IN_MULTIPLEXED_AND_READY && iobuf.in.len) {\n 1931 | \t\tif (iobuf.raw_input_ends_before) {\n 1932 | \t\t\tsize_t raw_len = iobuf.raw_input_ends_before - iobuf.in.pos;\n 1933 | \t\t\tiobuf.raw_input_ends_before = 0;\n 1934 | \t\t\tif (raw_len >= iobuf.in.len) {\n 1935 | \t\t\t\tiobuf.in.len = 0;\n 1936 | \t\t\t\tbreak;\n 1937 | \t\t\t}\n 1938 | \t\t\tiobuf.in.len -= raw_len;\n 1939 | \t\t\tif ((iobuf.in.pos += raw_len) >= iobuf.in.size)\n 1940 | \t\t\t\tiobuf.in.pos -= iobuf.in.size;\n 1941 | \t\t}\n 1942 | \t\tread_a_msg();\n 1943 | \t}\n 1944 | }","lines":17,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/io.c#L1928-L1944"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"In add_rule(), when *pat == '/' the absolute-path prefix length is computed as `pre_len = dirbuf_len - module_dirlen - 1`. dirbuf_len and module_dirlen are unsigned ints; if dirbuf_len <= module_dirlen (e.g. dirbuf not yet set up, or module_dirlen miscomputed) this underflows to a huge unsigned value, which is then used as a memcpy length and new_array size, causing a massive allocation or buffer overrun.","fix":"Guard with an assertion or clamp: only compute pre_len when dirbuf_len > module_dirlen + 1, otherwise treat as 0 and log/skip.","locations":[{"ref":"exclude.c:301-302","code":"  301 | \t\tif (*pat == '/')\n  302 | \t\t\tpre_len = dirbuf_len - module_dirlen - 1;","lines":2,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/exclude.c#L301-L302"},{"ref":"exclude.c:316-318","code":"  316 | \trule->pattern = new_array(char, pre_len + pat_len + suf_len + 1);\n  317 | \tif (pre_len) {\n  318 | \t\tmemcpy(rule->pattern, dirbuf + module_dirlen, pre_len);","lines":3,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/exclude.c#L316-L318"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"very_easy","description":"read_buf() clamps a per-iteration copy size to the whole input buffer size instead of size-minus-one. `siz = MIN(len, raw_input_ends_before - in.pos)` then `if (siz >= in.size) siz = in.size;`. raw_read_buf()/perform_io() require the requested length to fit in the circular buffer; requesting exactly in.size leaves no slack and relies on perform_io never needing the buffer non-full. The original upstream code uses `siz = iobuf.in.size - 1` here to preserve the circular-buffer invariant that len < size; using the full size risks a wrap/clamp edge in perform_io's input filling.","fix":"Clamp to `iobuf.in.size - 1` (matching upstream) rather than `iobuf.in.size`, preserving the circular-buffer invariant that a single request is strictly smaller than the buffer.","locations":[{"ref":"io.c:2169-2172","code":" 2169 | \t\tsiz = MIN(len, iobuf.raw_input_ends_before - iobuf.in.pos);\n 2170 | \t\tif (siz >= iobuf.in.size)\n 2171 | \t\t\tsiz = iobuf.in.size;\n 2172 | \t\traw_read_buf(buf, siz);","lines":4,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/io.c#L2169-L2172"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"Solaris read_xattr() sets `bufpos = -1` (a size_t, becoming SIZE_MAX) on read error, then `ret = bufpos` returns that huge unsigned value cast to ssize_t. On a 64-bit platform ssize_t can represent it as -1, but the intent is fragile; also `sb.st_size > buflen` and `bufpos < sb.st_size` compare signed off_t against size_t, which can misbehave for large/negative st_size.","fix":"Use an ssize_t for the running position/return, set it to -1 explicitly on error, and compare st_size against buflen with matching signedness after validating st_size >= 0.","locations":[{"ref":"lib/sysxattrs.c:229-241","code":"  229 | \t\tsize_t bufpos;\n  230 | \t\tfor (bufpos = 0; bufpos < sb.st_size; ) {\n  231 | \t\t\tssize_t cnt = read(attrfd, (char*)buf + bufpos, sb.st_size - bufpos);\n  232 | \t\t\tif (cnt <= 0) {\n  233 | \t\t\t\tif (cnt < 0 && errno == EINTR)\n  234 | \t\t\t\t\tcontinue;\n  235 | \t\t\t\tbufpos = -1;\n  236 | \t\t\t\tbreak;\n  237 | \t\t\t}\n  238 | \t\t\tbufpos += cnt;\n  239 | \t\t}\n  240 | \t\tret = bufpos;\n  241 | \t}","lines":13,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/lib/sysxattrs.c#L229-L241"}]},
{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"very_easy","description":"In hash_search the rolling-checksum update does `s2 -= k * (map[0]+CHAR_OFFSET)`\nwhere k is int32 up to s->blength (max 1<<17 for proto>=30, 1<<29 for older\nprotocols negotiated by a peer). With OLD_MAX_BLOCK_SIZE = 1<<29 and a byte+offset\nvalue up to ~255, k*(map[0]+CHAR_OFFSET) can exceed 2^31 and overflow the int32/uint32\narithmetic. The rolling sum is defined modulo 2^32 so wraparound is mathematically\ntolerated for uint32 s2, but the multiplication is performed in int32 `k` promoted\ncontext; signed overflow there is undefined behavior. Matches still work because the\nsender/receiver agree, but UB is a latent hazard with large pre-30 block sizes.","fix":"Cast to uint32 explicitly: `s2 -= (uint32)k * (uint32)(map[0]+CHAR_OFFSET);` to keep the arithmetic in well-defined unsigned modular form.","locations":[{"ref":"match.c:356-357","code":"  356 | \t\ts1 -= map[0] + CHAR_OFFSET;\n  357 | \t\ts2 -= k * (map[0]+CHAR_OFFSET);","lines":2,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/match.c#L356-L357"}]},
{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"Signed integer overflow in --stop-after parsing. `atol(arg) * 60` is computed (and its result assigned to `val`) before any range check. For a large user-supplied minute value the multiplication itself overflows long, which is undefined behavior; the subsequent LONG_MAX-based guard runs on an already-overflowed value.","fix":"Parse into a long first, reject if it exceeds LONG_MAX/60 (and is non-positive) before multiplying: `long m = atol(arg); if (m <= 0 || m > LONG_MAX/60) goto bad; val = m * 60;`","locations":[{"ref":"options.c:2003","code":" 2003 | \t\t\tif ((val = atol(arg) * 60) <= 0 || LONG_MAX - val < stop_at_utime || (long)(time_t)val != val) {","lines":1,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/options.c#L2003"}]},
{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"full_write() accumulates the total bytes written into an `int total_written`, while the input length is a `size_t len`. On a single copy_file() the buffer is only 8 KB so this never overflows, but the function is a general utility (also called from generator.c with a map length) and the loop variable `written` plus the accumulator are both `int`. A write of more than INT_MAX bytes would overflow `total_written` (UB / wrong return), and the return type cannot represent large sizes.","fix":"Change `int total_written` (and the return type) to `ssize_t`/`size_t` semantics, or have callers only pass <= INT_MAX. At minimum make `total_written` a size_t and return it, keeping the <0 error convention via a separate flag.","locations":[{"ref":"util1.c:302-319","code":"  302 | int full_write(int desc, const char *ptr, size_t len)\n  303 | {\n  304 | \tint total_written;\n  305 | \n  306 | \ttotal_written = 0;\n  307 | \twhile (len > 0) {\n  308 | \t\tint written = write(desc, ptr, len);\n  309 | \t\tif (written < 0)  {\n  310 | \t\t\tif (errno == EINTR)\n  311 | \t\t\t\tcontinue;\n  312 | \t\t\treturn written;\n  313 | \t\t}\n  314 | \t\ttotal_written += written;\n  315 | \t\tptr += written;\n  316 | \t\tlen -= written;\n  317 | \t}\n  318 | \treturn total_written;\n  319 | }","lines":18,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/util1.c#L302-L319"}]},
{"id":"OVF_8","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"get_acl() fake-super path computes `cnt = (len - 4*4) / (4+4)` as a signed int before the bounds check `len < 4*4`. If a corrupt/hostile stored xattr has len < 16, (len - 16) underflows in size_t arithmetic and is divided, producing a large cnt; the subsequent `len != (size_t)cnt*(4+4)+4*4` check is what actually rejects it, but relying on that after computing cnt from an underflowed value is fragile.","fix":"Check `len < 4*4 || (len - 4*4) % (4+4) != 0` first, then compute cnt, so cnt is never derived from an underflowed length.","locations":[{"ref":"acls.c:608-612","code":"  608 | \t\tcnt = (len - 4*4) / (4+4);\n  609 | \t\tif (len < 4*4 || len != (size_t)cnt*(4+4) + 4*4) {\n  610 | \t\t\tfree(buf);\n  611 | \t\t\treturn -1;\n  612 | \t\t}","lines":5,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/acls.c#L608-L612"}]},
{"id":"OVF_9","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"base64_encode() computes bytes = (len*8 + 5)/6 with int arithmetic. len is an int byte count; for the auth/proxy callers len is small, but the function is generic and a large len (e.g. >~268M) overflows len*8 as a signed int, producing a wrong/negative byte count and a buffer overrun or under-write. The function has no length guard.","fix":"Use size_t for len and the bytes computation, or document/assert a maximum input length; callers should ensure the output buffer is sized for the computed bytes.","locations":[{"ref":"authenticate.c:40-65","code":"   40 | void base64_encode(const char *buf, int len, char *out, int pad)\n   41 | {\n   42 | \tchar *b64 = \"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/\";\n   43 | \tint bit_offset, byte_offset, idx, i;\n   44 | \tconst uchar *d = (const uchar *)buf;\n   45 | \tint bytes = (len*8 + 5)/6;\n   46 | \n   47 | \tfor (i = 0; i < bytes; i++) {\n   48 | \t\tbyte_offset = (i*6)/8;\n   49 | \t\tbit_offset = (i*6)%8;\n   50 | \t\tif (bit_offset < 3) {\n   51 | \t\t\tidx = (d[byte_offset] >> (2-bit_offset)) & 0x3F;\n   52 | \t\t} else {\n   53 | \t\t\tidx = (d[byte_offset] << (bit_offset-2)) & 0x3F;\n   54 | \t\t\tif (byte_offset+1 < len) {\n   55 | \t\t\t\tidx |= (d[byte_offset+1] >> (8-(bit_offset-2)));\n   56 | \t\t\t}\n   57 | \t\t}\n   58 | \t\tout[i] = b64[idx];\n   59 | \t}\n   60 | \n   61 | \twhile (pad && (i % 4))\n   62 | \t\tout[i++] = '=';\n   63 | \n   64 | \tout[i] = '\\0';\n   65 | }","lines":26,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/authenticate.c#L40-L65"}]},
{"id":"OVF_10","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"parse_chmod() builds masks using signed-int arithmetic with subtraction, e.g. `CHMOD_BITS - (where*7) - (topoct?topbits:0) - (copybits?mode_dest_special_bits(where):0)`. These are bit clears written as subtraction and rely on the subtracted sets being subsets of CHMOD_BITS with no overlap. If a future edit makes topbits and mode_dest_special_bits overlap (both can set 04000/02000 conceptually), the subtraction would underflow into adjacent bits and corrupt the AND mask, unlike a proper `& ~bits`.","fix":"Use bitwise clears `CHMOD_BITS & ~((where*7) | (topoct?topbits:0) | (copybits?mode_dest_special_bits(where):0))` instead of subtraction so overlapping bits are idempotent and cannot underflow.","locations":[{"ref":"chmod.c:105","code":"  105 | \t\t\t\tcurr_mode->ModeAND = CHMOD_BITS - bits - topoct;","lines":1,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/chmod.c#L105"},{"ref":"chmod.c:113-114","code":"  113 | \t\t\t\tcurr_mode->ModeAND = CHMOD_BITS - (where * 7) - (topoct ? topbits : 0)\n  114 | \t\t\t\t\t\t    - (copybits ? mode_dest_special_bits(where) : 0);","lines":2,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/chmod.c#L113-L114"}]},
{"id":"OVF_11","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"read_proxy_protocol_header() V1 path: port_chk = strtol(p, &endc, 10) and then only checks '*endc || port_chk == 0'. A port value > 65535 or negative is accepted as long as it is non-zero and fully numeric, so the proxy port validation is weaker than the documented 'valid port' intent. Ports are only used for the (ignored) validation, so impact is low, but malformed headers pass validation.","fix":"Validate the parsed port is in 1..65535 before accepting.","locations":[{"ref":"clientname.c:295-304","code":"  295 | \t\tport_chk = strtol(p, &endc, 10);\n  296 | \t\tif (*endc || port_chk == 0)\n  297 | \t\t\treturn 0;\n  298 | \t\t/* Ignore source port. */\n  299 | \n  300 | \t\tp = sp + 1;\n  301 | \t\tport_chk = strtol(p, &endc, 10);\n  302 | \t\tif (*endc || port_chk == 0)\n  303 | \t\t\treturn 0;\n  304 | \t\t/* Ignore destination port. */","lines":10,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/clientname.c#L295-L304"}]},
{"id":"OVF_12","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"is_backup_file() computes `int k = strlen(fn) - backup_suffix_len`. strlen() returns size_t, so the subtraction is done in unsigned domain; when the filename is shorter than the backup suffix the result is a huge size_t that is then truncated to int. Depending on the value it can pass the `k > 0` test and make strcmp(fn+k, ...) read past the end of the string. In practice fn is a path being deleted and the suffix is short, so it rarely triggers, but it is undefined behavior.","fix":"Compare lengths first: `int fnlen = strlen(fn); int k = fnlen - backup_suffix_len; return k > 0 && ...`, or guard with `if ((size_t)backup_suffix_len >= strlen(fn)) return 0;` before computing the offset.","locations":[{"ref":"delete.c:80-84","code":"   80 | static inline int is_backup_file(char *fn)\n   81 | {\n   82 | \tint k = strlen(fn) - backup_suffix_len;\n   83 | \treturn k > 0 && strcmp(fn+k, backup_suffix) == 0;\n   84 | }","lines":5,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/delete.c#L80-L84"}]},
{"id":"OVF_13","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"rule_matches() declares match-length locals as plain `int` (l1, l2 = strlen(...)). For pathological pattern/name lengths > INT_MAX these truncate, but more realistically `name[l1-(l2+1)]` underflows the index if l2 == l1 is not the case but l1 < l2+1; this is guarded by `l2 <= l1` and `(l1==l2 || ...)` so the index is safe. Still, using int for strlen results is a latent truncation.","fix":"Use size_t for l1/l2 to avoid signed truncation on very long strings.","locations":[{"ref":"exclude.c:1071-1077","code":" 1071 | \t\tint l1 = strlen(name);\n 1072 | \t\tint l2 = strlen(pattern);\n 1073 | \t\tif (l2 <= l1 &&\n 1074 | \t\t    strcmp(name+(l1-l2),pattern) == 0 &&\n 1075 | \t\t    (l1==l2 || name[l1-(l2+1)] == '/')) {\n 1076 | \t\t\treturn ret_match;\n 1077 | \t\t}","lines":7,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/exclude.c#L1071-L1077"}]},
{"id":"OVF_14","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"stats.flist_buildtime / flist_xfertime are computed as int64 ms from gettimeofday, but the subtraction (end_tv.tv_usec - start_tv.tv_usec) is done in plain int and can be negative; combined with the seconds term it is correct only because tv_sec difference compensates, but if tv_usec wraps and tv_sec are equal-but-clock-went-backwards the result can be a large/negative bogus value. Minor stats-only impact.","fix":"Clamp negative elapsed values to a minimum (the code already forces 1 for buildtime; do the same for xfertime) or compute using a monotonic clock.","locations":[{"ref":"flist.c:2774-2777","code":" 2774 | \tstats.flist_buildtime = (int64)(end_tv.tv_sec - start_tv.tv_sec) * 1000\n 2775 | \t\t\t      + (end_tv.tv_usec - start_tv.tv_usec) / 1000;\n 2776 | \tif (stats.flist_buildtime == 0)\n 2777 | \t\tstats.flist_buildtime = 1;","lines":4,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/flist.c#L2774-L2777"},{"ref":"flist.c:2800-2801","code":" 2800 | \tstats.flist_xfertime = (int64)(end_tv.tv_sec - start_tv.tv_sec) * 1000\n 2801 | \t\t\t     + (end_tv.tv_usec - start_tv.tv_usec) / 1000;","lines":2,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/flist.c#L2800-L2801"}]},
{"id":"OVF_15","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"remember_delete accepts a truncated record: the loop breaks when (deldelay_cnt += len) <= deldelay_size, but snprintf's return len excludes the terminating '\\0'. When deldelay_cnt + len == deldelay_size exactly, snprintf had size deldelay_size - deldelay_cnt and therefore truncated the trailing '\\0' (it needed len+1 bytes). The truncated, unterminated record is then committed to the buffer, which read_delay_line later parses, potentially mis-splitting it with the following record.","fix":"Break only when (deldelay_cnt += len) < deldelay_size (strict), so a record that exactly fills the buffer minus the NUL is flushed and rewritten with room for its terminator.","locations":[{"ref":"generator.c:164-185","code":"  164 | static int remember_delete(struct file_struct *file, const char *fname, int flags)\n  165 | {\n  166 | \tint len;\n  167 | \n  168 | \tif (deldelay_cnt == deldelay_size && !flush_delete_delay())\n  169 | \t\treturn 0;\n  170 | \n  171 | \tif (flags & DEL_NO_UID_WRITE)\n  172 | \t\tdeldelay_buf[deldelay_cnt++] = '!';\n  173 | \n  174 | \twhile (1) {\n  175 | \t\tlen = snprintf(deldelay_buf + deldelay_cnt, deldelay_size - deldelay_cnt,\n  176 | \t\t\t       \"%x %s%c\", (int)file->mode, fname, '\\0');\n  177 | \t\tif ((deldelay_cnt += len) <= deldelay_size)\n  178 | \t\t\tbreak;\n  179 | \t\tdeldelay_cnt -= len;\n  180 | \t\tif (!flush_delete_delay())\n  181 | \t\t\treturn 0;\n  182 | \t}\n  183 | \n  184 | \treturn 1;\n  185 | }","lines":22,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/generator.c#L164-L185"}]},
{"id":"OVF_16","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"create_refuse_error() computes `n = snprintf(...) - 1` then does snprintf(err_buf + n, sizeof err_buf - n, ...). snprintf returns the would-be length; if the option name were long enough to truncate the first write, n could exceed the buffer size, making err_buf + n point out of bounds and sizeof err_buf - n underflow to a huge size_t. Current option longNames are all short so this cannot trigger today, but the arithmetic is unguarded and fragile.","fix":"Bound n to the buffer: compute the real written length as `n = MIN(snprintf(...), (int)sizeof err_buf - 1) - 1;` and guard `if (op->shortName && n >= 0 && n < (int)sizeof err_buf)` before the second snprintf.","locations":[{"ref":"options.c:1427-1429","code":" 1427 | \tint n = snprintf(err_buf, sizeof err_buf, \"%s --%s\\n\", msg, op->longName) - 1;\n 1428 | \tif (op->shortName)\n 1429 | \t\tsnprintf(err_buf + n, sizeof err_buf - n, \" (-%c)\\n\", op->shortName);","lines":3,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/options.c#L1427-L1429"}]},
