{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"free_sums() frees s->sums then s->sum2_array only inside `if (s->sums)`. If a sum_struct is ever allocated with sum2_array set but sums NULL (or sums freed/zeroed independently), sum2_array leaks; conversely the code assumes sum2_array is always allocated together with sums. This coupling is undocumented and brittle.","fix":"Free sums and sum2_array independently (each guarded by its own non-NULL check), or document the invariant that the two are always allocated/freed as a pair.","locations":[{"ref":"rsync.c:453-460","code":"  453 | void free_sums(struct sum_struct *s)\n  454 | {\n  455 | \tif (s->sums) {\n  456 | \t\tfree(s->sums);\n  457 | \t\tfree(s->sum2_array);\n  458 | \t}\n  459 | \tfree(s);\n  460 | }","lines":8,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/rsync.c#L453-L460"}]},
{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"In send_files, after a successful do_fstat the code maps the file with map_file but\nmap_file/map_ptr report read errors only via map->status, which match_sums turns\ninto a deliberately-corrupted file checksum. That is by design, but if fstat of an\nIS_DEVICE file with st.st_size == 0 calls get_device_size() and that returns 0 (e.g.\nunsupported ioctl), match_sums is called with len==0 and mbuf==NULL, sending an\nempty file silently rather than reporting the inability to size the device.","fix":"When copy_devices and get_device_size() returns 0/failure for a device, emit an IOERR and MSG_NO_SEND instead of silently transferring zero bytes.","locations":[{"ref":"sender.c:733-756","code":"  733 | \t\tif (IS_DEVICE(st.st_mode)) {\n  734 | \t\t\tif (!copy_devices) {\n  735 | \t\t\t\trprintf(FERROR, \"attempt to copy device contents without --copy-devices\\n\");\n  736 | \t\t\t\texit_cleanup(RERR_PROTOCOL);\n  737 | \t\t\t}\n  738 | \t\t\tif (st.st_size == 0)\n  739 | \t\t\t\tst.st_size = get_device_size(fd, fname);\n  740 | \t\t}\n  741 | \n  742 | \t\tif (append_mode > 0 && st.st_size < F_LENGTH(file)) {\n  743 | \t\t\trprintf(FWARNING, \"skipped diminished file: %s\\n\",\n  744 | \t\t\t\tfull_fname(fname));\n  745 | \t\t\tfree_sums(s);\n  746 | \t\t\tclose(fd);\n  747 | \t\t\tif (protocol_version >= 30)\n  748 | \t\t\t\tsend_msg_int(MSG_NO_SEND, ndx);\n  749 | \t\t\tcontinue;\n  750 | \t\t}\n  751 | \n  752 | \t\tif (st.st_size) {\n  753 | \t\t\tint32 read_size = MAX(s->blength * 3, MAX_MAP_SIZE);\n  754 | \t\t\tmbuf = map_file(fd, st.st_size, read_size, s->blength);\n  755 | \t\t} else\n  756 | \t\t\tmbuf = NULL;","lines":24,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/sender.c#L733-L756"}]},
{"id":"ERR_9","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"In copy_file(), if do_fsync fails (line 459) the code closes ofd and returns -1, but ifd was already closed earlier (line 441) so that is fine; however on the ftruncate failure path (line 452) it logs the error but does NOT return failure and continues to fsync/close, so a truncate failure that the comment says 'must trigger the partial transfer error' is in fact swallowed - copy_file returns 0 (success) despite a wrong-length dest file.","fix":"On do_ftruncate() failure, set an error flag and return -1 (after closing ofd), matching the comment's stated intent of triggering a partial-transfer error.","locations":[{"ref":"util1.c:489-500","code":"  489 | \t/* Source file might have shrunk since we fstatted it.\n  490 | \t * Cut off any extra preallocated zeros from dest file. */\n  491 | \tif (offset < prealloc_len) {\n  492 | #ifdef HAVE_FTRUNCATE\n  493 | \t\t/* If we fail to truncate, the dest file may be wrong, so we\n  494 | \t\t * must trigger the \"partial transfer\" error. */\n  495 | \t\tif (do_ftruncate(ofd, offset) < 0)\n  496 | \t\t\trsyserr(FERROR_XFER, errno, \"ftruncate %s\", full_fname(dest));\n  497 | #else\n  498 | \t\trprintf(FERROR_XFER, \"no ftruncate for over-long pre-alloc: %s\", full_fname(dest));\n  499 | #endif\n  500 | \t}","lines":12,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/util1.c#L489-L500"}]},
{"id":"ERR_10","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"get_xattr_data() treats only ENOTSUP as a non-fatal 'attribute absent' condition. If an xattr listed by get_xattr_names() disappears (or its value is removed) before lgetxattr() reads it - a normal TOCTOU race during concurrent modification - lgetxattr returns ENOATTR/ENODATA and rsync_xal_get()/copy_xattrs() abort the whole file transfer with -1 instead of skipping the vanished attribute.","fix":"In get_xattr_data(), also return NULL silently (or have callers skip) when errno == ENOATTR/ENODATA, mirroring the ENOTSUP handling, so a racing removal does not fail the transfer.","locations":[{"ref":"xattrs.c:206-213","code":"  206 | \tif (datum_len == (size_t)-1) {\n  207 | \t\tif (errno == ENOTSUP || no_missing_error)\n  208 | \t\t\treturn NULL;\n  209 | \t\trsyserr(FERROR_XFER, errno,\n  210 | \t\t\t\"get_xattr_data: lgetxattr(%s,\\\"%s\\\",0) failed\",\n  211 | \t\t\tfull_fname(fname), name);\n  212 | \t\treturn NULL;\n  213 | \t}","lines":8,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/xattrs.c#L206-L213"}]},
{"id":"ERR_11","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"csum_len_for_type() returns 1 for CSUM_NONE, but sum_end() writes a single NUL byte for CSUM_NONE while several callers treat the returned length as the number of meaningful digest bytes. The '1' is a sentinel rather than a real digest length; code paths that memcpy/compare cur_sum_len bytes for CSUM_NONE will read/compare an uninitialized-or-meaningless byte. Low impact because CSUM_NONE disables matching, but the 1-vs-0 convention is a latent footgun.","fix":"Document the '1' sentinel clearly at the CSUM_NONE return, or audit callers to ensure none treat the lone byte as a real checksum value.","locations":[{"ref":"checksum.c:235-236","code":"  235 | \t  case CSUM_NONE:\n  236 | \t\treturn 1;","lines":2,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/checksum.c#L235-L236"},{"ref":"checksum.c:741-743","code":"  741 | \t  case CSUM_NONE:\n  742 | \t\t*sum = '\\0';\n  743 | \t\tbreak;","lines":3,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/checksum.c#L741-L743"}]},
{"id":"ERR_12","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"do_delayed_deletions ignores the return value of lseek(deldelay_fd, 0, 0). If the seek fails (e.g. on an unusual fd state), the subsequent reads start from the wrong offset and read_delay_line will report 'invalid data' or silently delete the wrong set of items rather than reporting the seek error.","fix":"Check the lseek return value and bail out with an error (skip the delayed-deletion pass) if it is < 0.","locations":[{"ref":"generator.c:265-278","code":"  265 | static void do_delayed_deletions(char *delbuf)\n  266 | {\n  267 | \tint mode, flags;\n  268 | \n  269 | \tif (deldelay_fd >= 0) {\n  270 | \t\tif (deldelay_cnt && !flush_delete_delay())\n  271 | \t\t\treturn;\n  272 | \t\tlseek(deldelay_fd, 0, 0);\n  273 | \t}\n  274 | \twhile ((mode = read_delay_line(delbuf, &flags)) >= 0)\n  275 | \t\tdelete_item(delbuf, mode, flags | DEL_RECURSE);\n  276 | \tif (deldelay_fd >= 0)\n  277 | \t\tclose(deldelay_fd);\n  278 | }","lines":14,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/generator.c#L265-L278"}]},
{"id":"ERR_13","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"finish_hard_link(): in the while loop, when maybe_hard_link returns < 0 (val < 0) the code does `continue` to process the next prev_ndx, but it has already done flist->in_progress-- and free_stat_x. The continue skips send_msg_success which is correct. However on error it silently proceeds without recording that this hardlink failed; the file was marked FLAG_HLINK_DONE earlier (line 511) before the link attempt, so a failed hardlink is still flagged DONE, potentially leaving the destination without the expected hard link and no error escalation.","fix":"Either set FLAG_HLINK_DONE only after a successful maybe_hard_link, or propagate the failure (e.g. via an error counter / non-zero exit) so a failed hardlink is not silently treated as complete.","locations":[{"ref":"hlink.c:528-544","code":"  528 | \twhile ((ndx = prev_ndx) >= 0) {\n  529 | \t\tint val;\n  530 | \t\tflist = flist_for_ndx(ndx, \"finish_hard_link\");\n  531 | \t\tfile = flist->files[ndx - flist->ndx_start];\n  532 | \t\tfile->flags = (file->flags & ~FLAG_HLINK_FIRST) | FLAG_HLINK_DONE;\n  533 | \t\tprev_ndx = F_HL_PREV(file);\n  534 | \t\tF_HL_PREV(file) = fin_ndx;\n  535 | \t\tprev_statret = link_stat(f_name(file, prev_name), &prev_sx.st, 0);\n  536 | \t\tval = maybe_hard_link(file, ndx, prev_name, prev_statret, &prev_sx,\n  537 | \t\t\t\t      our_name, stp, fname, itemizing, code);\n  538 | \t\tflist->in_progress--;\n  539 | \t\tfree_stat_x(&prev_sx);\n  540 | \t\tif (val < 0)\n  541 | \t\t\tcontinue;\n  542 | \t\tif (remove_source_files == 1 && do_xfers)\n  543 | \t\t\tsend_msg_success(fname, ndx);\n  544 | \t}","lines":17,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/hlink.c#L528-L544"}]},
{"id":"ERR_14","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In the OPT_CHOWN handler, poptGetOptArg() can return NULL (popt returns NULL for a missing/empty arg in some configurations); chown is then passed to strchr(chown, ':') without a NULL check, risking a NULL deref. Several other handlers (e.g. 'M' at 1650, OPT_STDERR) similarly use the returned arg with only an implicit assumption it is non-NULL.","fix":"Defensively check poptGetOptArg() for NULL in handlers that dereference the result, emitting a clean option error instead of crashing.","locations":[{"ref":"options.c:1926-1931","code":" 1926 | \t\t\tconst char *chown = poptGetOptArg(pc);\n 1927 | \t\t\tint len;\n 1928 | \t\t\tif ((arg = strchr(chown, ':')) != NULL)\n 1929 | \t\t\t\tlen = arg++ - chown;\n 1930 | \t\t\telse\n 1931 | \t\t\t\tlen = strlen(chown);","lines":6,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/options.c#L1926-L1931"},{"ref":"options.c:1763-1764","code":" 1763 | \t\t\targ = poptGetOptArg(pc);\n 1764 | \t\t\tif (*arg != '-') {","lines":2,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/options.c#L1763-L1764"},{"ref":"options.c:2027-2028","code":" 2027 | \t\t\targ = poptGetOptArg(pc);\n 2028 | \t\t\tlen = strlen(arg);","lines":2,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/options.c#L2027-L2028"}]},
{"id":"ERR_15","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"rand_bytes() falls back to rand() on a short read from /dev/urandom, but does not seed rand() and uses it for security-sensitive temp-file suffix generation in secure_mkstemp(). If /dev/urandom is unavailable (chroot/container without /dev), suffixes become predictable (rand() default seed), weakening the O_EXCL temp-file unpredictability the function relies on. The comment acknowledges the fallback but understates the security impact.","fix":"Seed rand() (e.g. from time/pid) at least once before the fallback, or better, retry /dev/urandom and treat persistent failure as a hard error in the daemon path. At minimum document that the fallback produces predictable names.","locations":[{"ref":"syscall.c:3379-3398","code":" 3379 | /* Fill buf with len random bytes.  Prefers /dev/urandom for cryptographic\n 3380 |  * quality; falls back to rand() if /dev/urandom cannot be opened or read\n 3381 |  * (e.g. inside a chroot or container without /dev populated). */\n 3382 | static void rand_bytes(unsigned char *buf, size_t len)\n 3383 | {\n 3384 | #ifndef O_CLOEXEC\n 3385 | #define O_CLOEXEC 0\n 3386 | #endif\n 3387 | \tint fd = open(\"/dev/urandom\", O_RDONLY | O_CLOEXEC);\n 3388 | \tif (fd >= 0) {\n 3389 | \t\tssize_t n = read(fd, buf, len);\n 3390 | \t\tclose(fd);\n 3391 | \t\tif (n == (ssize_t)len) {\n 3392 | \t\t\treturn;\n 3393 | \t\t}\n 3394 | \t}\n 3395 | \tfor (size_t i = 0; i < len; i++) {\n 3396 | \t\tbuf[i] = (unsigned char)rand();\n 3397 | \t}\n 3398 | }","lines":20,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/syscall.c#L3379-L3398"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"AIX sys_acl_set_file()/chacl() return value rc is declared `uint` but chacl() returns int (-1 on error). Assigning -1 to a uint and returning it makes the caller's `< 0` failure test never true, masking ACL-set failures on AIX. Same pattern in the #if 0 sys_acl_set_fd.","fix":"Declare rc as int so negative chacl() return values are preserved and detected by callers.","locations":[{"ref":"lib/sysacls.c:2547","code":" 2547 | \tuint rc;","lines":1,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/lib/sysacls.c#L2547"},{"ref":"lib/sysacls.c:2623-2628","code":" 2623 | \trc = chacl((char*)name, file_acl, file_acl->acl_len);\n 2624 | \tDEBUG(10, (\"errno is %d\\n\", errno));\n 2625 | \tDEBUG(10, (\"return code is %d\\n\", rc));\n 2626 | \tSAFE_FREE(file_acl);\n 2627 | \tDEBUG(10, (\"Exiting the sys_acl_set_file\\n\"));\n 2628 | \treturn rc;","lines":6,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/lib/sysacls.c#L2623-L2628"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"get_checksum2 keeps a per-process static scratch buffer (buf1/len1) for the MD4 paths that is never freed and only ever grows. This is by-design caching, but the buffer is leaked at exit and, because the same static is reused across all MD4-family transfers, it pins the size of the largest block seen for the life of the process. Not a correctness bug, but worth noting for memory-footprint audits.","fix":"Acceptable as-is for a short-lived CLI; if tighter control is wanted, free buf1 when the checksum type changes or document the intentional growth-only cache.","locations":[{"ref":"checksum.c:380-391","code":"  380 | \t\tmd_context m;\n  381 | \t\tint32 i;\n  382 | \t\tstatic char *buf1;\n  383 | \t\tstatic int32 len1;\n  384 | \n  385 | \t\tmdfour_begin(&m);\n  386 | \n  387 | \t\tif (len > len1 || !buf1) {\n  388 | \t\t\tfree(buf1);\n  389 | \t\t\tbuf1 = new_array(char, len+4);\n  390 | \t\t\tlen1 = len;\n  391 | \t\t}","lines":12,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/checksum.c#L380-L391"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"add_rule()'s per-dir-merge duplicate check (lines 264-279) does a linear scan over all mergelist_parents and a strlen+memcmp for every rule added. For configurations with many per-dir merge rules this is O(n^2). Minor, but the comment claims it merely avoids re-adding; the cost grows with rule count.","fix":"If this ever matters, hash basenames; otherwise document the expected-small cardinality.","locations":[{"ref":"exclude.c:361-376","code":"  361 | \t\tfor (i = 0; i < mergelist_cnt; i++) {\n  362 | \t\t\tfilter_rule *ex = mergelist_parents[i];\n  363 | \t\t\tconst char *s;\n  364 | \t\t\tif (!ex)\n  365 | \t\t\t\tcontinue;\n  366 | \t\t\ts = strrchr(ex->pattern, '/');\n  367 | \t\t\tif (s)\n  368 | \t\t\t\ts++;\n  369 | \t\t\telse\n  370 | \t\t\t\ts = ex->pattern;\n  371 | \t\t\tlen = strlen(s);\n  372 | \t\t\tif (len == pat_len - (cp - rule->pattern) && memcmp(s, cp, len) == 0) {\n  373 | \t\t\t\tfree_filter(rule);\n  374 | \t\t\t\treturn;\n  375 | \t\t\t}\n  376 | \t\t}","lines":16,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/exclude.c#L361-L376"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"read_args() grows *request_p with realloc_array on every single arg line when accumulating the request string (one realloc per file/arg up to the 1024 cap). For a request with many short args this is repeated O(n) reallocs/copies. Minor given the 1024-byte cap, but the growth is byte-exact (request_len + len + 1) so every append reallocates.","fix":"Grow the request buffer geometrically (or allocate the 1024-byte cap once up front) instead of reallocating to the exact needed size on each append.","locations":[{"ref":"io.c:1513-1521","code":" 1513 | \t\tif (dot_pos) {\n 1514 | \t\t\tif (request_p && request_len < 1024) {\n 1515 | \t\t\t\tint len = strlen(buf);\n 1516 | \t\t\t\tif (request_len)\n 1517 | \t\t\t\t\trequest_p[0][request_len++] = ' ';\n 1518 | \t\t\t\t*request_p = realloc_array(*request_p, char, request_len + len + 1);\n 1519 | \t\t\t\tmemcpy(*request_p + request_len, buf, len + 1);\n 1520 | \t\t\t\trequest_len += len;\n 1521 | \t\t\t}","lines":9,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/io.c#L1513-L1521"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"receive_data() calls `time(NULL)` on every single token iteration when allowed_lull\nis set (maybe_send_keepalive(time(NULL), ...)). For a heavily-matched delta with many\nsmall tokens this is a syscall per token. The keepalive logic internally rate-limits,\nso the time() call is the only per-iteration cost, but it is still avoidable overhead\non the hot data path.","fix":"Cache time(NULL) less frequently (e.g. only when progress is shown or every N tokens) and pass the cached value, as other hot loops in rsync do.","locations":[{"ref":"receiver.c:545-546","code":"  545 | \t\tif (allowed_lull)\n  546 | \t\t\tmaybe_send_keepalive(time(NULL), MSK_ALLOW_FLUSH | MSK_ACTIVE_RECEIVER);","lines":2,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/receiver.c#L545-L546"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"send_zstd_token maps the entire literal length nb in one `map_ptr(buf, offset, nb)`\ncall, forcing map_file to grow/realloc its sliding window to hold all of nb at once,\nwhereas send_deflated_token (zlib) feeds the compressor in CHUNK_SIZE pieces\n(token.c:419-427) and keeps the map window bounded. For large literal runs the zstd\npath can balloon the map window allocation well beyond MAX_MAP_SIZE.","fix":"Feed zstd input through map_ptr in CHUNK_SIZE pieces like the zlib send_deflated_token path to keep the map window bounded.","locations":[{"ref":"token.c:788-790","code":"  788 | \t\tzstd_in_buff.src = map_ptr(buf, offset, nb);\n  789 | \t\tzstd_in_buff.size = nb;\n  790 | \t\tzstd_in_buff.pos = 0;","lines":3,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/token.c#L788-L790"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"print_child_argv() calls strspn() over the full allowed-character set and then strlen() for every argument to decide whether to quote. For long argument vectors this scans each arg twice; it runs on every spawned child but only when the relevant debug/info level is active, so impact is minor.","fix":"Compute strlen once and compare to strspn's return, or scan once with a character classification table.","locations":[{"ref":"util1.c:110-118","code":"  110 | \t\tif (strspn(*cmd, \"abcdefghijklmnopqrstuvwxyz\"\n  111 | \t\t\t   \"ABCDEFGHIJKLMNOPQRSTUVWXYZ\"\n  112 | \t\t\t   \"0123456789\"\n  113 | \t\t\t   \",.-_=+@/\") != strlen(*cmd)) {\n  114 | \t\t\trprintf(FCLIENT, \"\\\"%s\\\" \", *cmd);\n  115 | \t\t} else {\n  116 | \t\t\trprintf(FCLIENT, \"%s \", *cmd);\n  117 | \t\t}\n  118 | \t\tcnt++;","lines":9,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/util1.c#L110-L118"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"find_fuzzy scans every fuzzy dirlist twice: once for an exact size+mtime match (first loop) and once for the fuzzy-distance computation (second loop), recomputing F_IS_ACTIVE / S_ISREG / F_LENGTH / FLAG_FILE_SENT filters in both passes. For large fuzzy basis directories this doubles the per-candidate filtering work.","fix":"Track exact-match and best-fuzzy candidates in a single pass, or skip the fuzzy-distance pass entirely once an exact size+mtime match is found (the first loop already returns early on exact match, so the second pass only matters when no exact match exists - acceptable, but the duplicated filtering could be hoisted).","locations":[{"ref":"generator.c:847-911","code":"  847 | \t/* Try to find an exact size+mtime match first. */\n  848 | \tfor (i = 0; i < fuzzy_basis; i++) {\n  849 | \t\tstruct file_list *dirlist = dirlist_array[i];\n  850 | \n  851 | \t\tif (!dirlist)\n  852 | \t\t\tcontinue;\n  853 | \n  854 | \t\tfor (j = 0; j < dirlist->used; j++) {\n  855 | \t\t\tstruct file_struct *fp = dirlist->files[j];\n  856 | \n  857 | \t\t\tif (!F_IS_ACTIVE(fp))\n  858 | \t\t\t\tcontinue;\n  859 | \n  860 | \t\t\tif (!S_ISREG(fp->mode) || !F_LENGTH(fp) || fp->flags & FLAG_FILE_SENT)\n  861 | \t\t\t\tcontinue;\n  862 | \n  863 | \t\t\tif (F_LENGTH(fp) == F_LENGTH(file) && same_time(fp->modtime, 0, file->modtime, 0)) {\n  864 | \t\t\t\tif (DEBUG_GTE(FUZZY, 2))\n  865 | \t\t\t\t\trprintf(FINFO, \"fuzzy size/modtime match for %s\\n\", f_name(fp, NULL));\n  866 | \t\t\t\t*fnamecmp_type_ptr = FNAMECMP_FUZZY + i;\n  867 | \t\t\t\treturn fp;\n  868 | \t\t\t}\n  869 | \n  870 | \t\t}\n  871 | \t}\n  872 | \n  873 | \tfor (i = 0; i < fuzzy_basis; i++) {\n  874 | \t\tstruct file_list *dirlist = dirlist_array[i];\n  875 | \n  876 | \t\tif (!dirlist)\n  877 | \t\t\tcontinue;\n  878 | \n  879 | \t\tfor (j = 0; j < dirlist->used; j++) {\n  880 | \t\t\tstruct file_struct *fp = dirlist->files[j];\n  881 | \t\t\tconst char *suf, *name;\n  882 | \t\t\tint len, suf_len;\n  883 | \t\t\tuint32 dist;\n  884 | \n  885 | \t\t\tif (!F_IS_ACTIVE(fp))\n  886 | \t\t\t\tcontinue;\n  887 | \n  888 | \t\t\tif (!S_ISREG(fp->mode) || !F_LENGTH(fp) || fp->flags & FLAG_FILE_SENT)\n  889 | \t\t\t\tcontinue;\n  890 | \n  891 | \t\t\tname = fp->basename;\n  892 | \t\t\tlen = strlen(name);\n  893 | \t\t\tsuf = find_filename_suffix(name, len, &suf_len);\n  894 | \n  895 | \t\t\tdist = fuzzy_distance(name, len, fname, fname_len, lowest_dist);\n  896 | \t\t\t/* Add some extra weight to how well the suffixes match unless we've already disqualified\n  897 | \t\t\t * this file based on a heuristic. */\n  898 | \t\t\tif (dist < 0xFFFF0000U) {\n  899 | \t\t\t\tdist += fuzzy_distance(suf, suf_len, fname_suf, fname_suf_len, 0xFFFF0000U) * 10;\n  900 | \t\t\t}\n  901 | \t\t\tif (DEBUG_GTE(FUZZY, 2)) {\n  902 | \t\t\t\trprintf(FINFO, \"fuzzy distance for %s = %d.%05d\\n\",\n  903 | \t\t\t\t\tf_name(fp, NULL), (int)(dist>>16), (int)(dist&0xFFFF));\n  904 | \t\t\t}\n  905 | \t\t\tif (dist <= lowest_dist) {\n  906 | \t\t\t\tlowest_dist = dist;\n  907 | \t\t\t\tlowest_fp = fp;\n  908 | \t\t\t\t*fnamecmp_type_ptr = FNAMECMP_FUZZY + i;\n  909 | \t\t\t}\n  910 | \t\t}\n  911 | \t}","lines":65,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/generator.c#L847-L911"}]},
{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"lp_number() and getsectionbyname() do a linear scan of all sections for every module lookup. For daemons with a large number of modules this is O(n) per connection. Minor given typical module counts, but a sorted index or hash would scale better.","fix":"Build a name->index map once after config load if module counts grow large.","locations":[{"ref":"loadparm.c:701-711","code":"  701 | int lp_number(char *name)\n  702 | {\n  703 | \tint i;\n  704 | \n  705 | \tfor (i = section_list.count - 1; i >= 0; i--) {\n  706 | \t\tif (strcmp(lp_name(i), name) == 0)\n  707 | \t\t\tbreak;\n  708 | \t}\n  709 | \n  710 | \treturn i;\n  711 | }","lines":11,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/loadparm.c#L701-L711"},{"ref":"loadparm.c:426-436","code":"  426 | static int getsectionbyname(char *name)\n  427 | {\n  428 | \tint i;\n  429 | \n  430 | \tfor (i = section_list.count - 1; i >= 0; i--) {\n  431 | \t\tif (strwiEQ(iSECTION(i).name, name))\n  432 | \t\t\tbreak;\n  433 | \t}\n  434 | \n  435 | \treturn i;\n  436 | }","lines":11,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/loadparm.c#L426-L436"}]},
{"id":"PERF_9","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"wait_process_with_flush() polls with msleep(20) + io_flush in a busy loop while waiting for a child. With long-running children this wakes 50 times/second doing a full IO flush each time, which is wasteful CPU/IO churn versus blocking on the fd or using a longer backoff when no IO is pending.","fix":"Use a select/poll on the IO fds (or SIGCHLD-driven wakeup) instead of a fixed 20ms spin, or increase the sleep interval when there is no pending IO.","locations":[{"ref":"main.c:197-227","code":"  197 | /* Wait for a process to exit, calling io_flush while waiting. */\n  198 | static void wait_process_with_flush(pid_t pid, int *exit_code_ptr)\n  199 | {\n  200 | \tpid_t waited_pid;\n  201 | \tint status;\n  202 | \n  203 | \twhile ((waited_pid = wait_process(pid, &status, WNOHANG)) == 0) {\n  204 | \t\tmsleep(20);\n  205 | \t\tio_flush(FULL_FLUSH);\n  206 | \t}\n  207 | \n  208 | \t/* TODO: If the child exited on a signal, then log an\n  209 | \t * appropriate error message.  Perhaps we should also accept a\n  210 | \t * message describing the purpose of the child.  Also indicate\n  211 | \t * this to the caller so that they know something went wrong. */\n  212 | \tif (waited_pid < 0) {\n  213 | \t\trsyserr(FERROR, errno, \"waitpid\");\n  214 | \t\t*exit_code_ptr = RERR_WAITCHILD;\n  215 | \t} else if (!WIFEXITED(status)) {\n  216 | #ifdef WCOREDUMP\n  217 | \t\tif (WCOREDUMP(status))\n  218 | \t\t\t*exit_code_ptr = RERR_CRASHED;\n  219 | \t\telse\n  220 | #endif\n  221 | \t\tif (WIFSIGNALED(status))\n  222 | \t\t\t*exit_code_ptr = RERR_TERMINATED;\n  223 | \t\telse\n  224 | \t\t\t*exit_code_ptr = RERR_WAITCHILD;\n  225 | \t} else\n  226 | \t\t*exit_code_ptr = WEXITSTATUS(status);\n  227 | }","lines":31,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/main.c#L197-L227"}]},
{"id":"PERF_10","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"do_punch_hole()'s portable fallback declares a 4096-byte zero buffer on the stack and memsets it on every call, then writes 4096-byte chunks. For large holes this is a per-chunk write loop with no buffering benefit beyond 4096; acceptable but the (int)sizeof and `int chunk`/`int wrote` truncate OFF_T len silently (len is capped to 4096 per chunk so no overflow, but mixing int and OFF_T is fragile).","fix":"Use size_t/ssize_t for chunk and wrote to avoid int/OFF_T mixing; the logic is correct today only because chunk is bounded by sizeof zeros.","locations":[{"ref":"syscall.c:2727-2740","code":" 2727 | \t{\n 2728 | \t\tchar zeros[4096];\n 2729 | \t\tmemset(zeros, 0, sizeof zeros);\n 2730 | \t\twhile (len > 0) {\n 2731 | \t\t\tint chunk = len > (int)sizeof zeros ? (int)sizeof zeros : len;\n 2732 | \t\t\tint wrote = write(fd, zeros, chunk);\n 2733 | \t\t\tif (wrote <= 0) {\n 2734 | \t\t\t\tif (wrote < 0 && errno == EINTR)\n 2735 | \t\t\t\t\tcontinue;\n 2736 | \t\t\t\treturn -1;\n 2737 | \t\t\t}\n 2738 | \t\t\tlen -= wrote;\n 2739 | \t\t}\n 2740 | \t}","lines":14,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/syscall.c#L2727-L2740"}]},
{"id":"PERF_11","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"timestring() calls localtime_r and snprintf on every invocation and rotates through 4 static buffers; it is fine functionally, but the `assert(len > 0)` is used solely 'to silence a gcc warning' on an snprintf whose format is fixed and cannot fail - the assert compiles out under NDEBUG, leaving `len` set-but-unused, which can itself warn under -Wunused-but-set-variable.","fix":"Cast the snprintf result to void instead of stashing it in an asserted variable: `(void)snprintf(...);`.","locations":[{"ref":"util1.c:1722-1738","code":" 1722 | char *timestring(time_t t)\n 1723 | {\n 1724 | \tstatic int ndx = 0;\n 1725 | \tstatic char buffers[4][20]; /* We support 4 simultaneous timestring results. */\n 1726 | \tchar *TimeBuf = buffers[ndx = (ndx + 1) % 4];\n 1727 | \tstruct tm tmp, *tm = localtime_r(&t, &tmp);\n 1728 | \tint len;\n 1729 | \tif (!tm) {\n 1730 | \t\tstrlcpy(TimeBuf, \"(time out of range)\", sizeof buffers[0]);\n 1731 | \t\treturn TimeBuf;\n 1732 | \t}\n 1733 | \tlen = snprintf(TimeBuf, sizeof buffers[0], \"%4d/%02d/%02d %02d:%02d:%02d\",\n 1734 | \t\t (int)tm->tm_year + 1900, (int)tm->tm_mon + 1, (int)tm->tm_mday,\n 1735 | \t\t (int)tm->tm_hour, (int)tm->tm_min, (int)tm->tm_sec);\n 1736 | \tassert(len > 0); /* Silence gcc warning */\n 1737 | \n 1738 | \treturn TimeBuf;","lines":17,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/util1.c#L1722-L1738"}]},
{"id":"PERF_12","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"hard","description":"rsync_xal_store() walks the entire singly-linked hash-collision chain to its tail on every insert (while loop appending new_ref at the end). For many xattr lists that hash-collide this is O(n^2) over the run. Prepending to the chain head would be O(1) and order within a bucket is irrelevant to correctness.","fix":"Insert new_ref at the head of node->data's chain instead of traversing to the tail.","locations":[{"ref":"xattrs.c:505-517","code":"  505 | \tif (node->data != (void*)new_ref) {\n  506 | \t\trsync_xa_list_ref *ref = node->data;\n  507 | \n  508 | \t\twhile (ref != NULL) {\n  509 | \t\t\tif (ref->next != NULL) {\n  510 | \t\t\t\tref = ref->next;\n  511 | \t\t\t\tcontinue;\n  512 | \t\t\t}\n  513 | \n  514 | \t\t\tref->next = new_ref;\n  515 | \t\t\tbreak;\n  516 | \t\t}\n  517 | \t}","lines":13,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/xattrs.c#L505-L517"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"After the `if (!mapbuf) { ... }` block (which either exits or `continue`s on the\ndiscard path), mapbuf is guaranteed non-NULL. The subsequent `if (mapbuf)` guard\nand the `map &&` test in `if (fd != -1 && map && write_file(...))` are therefore\nalways true. Redundant guards that obscure the control flow and suggest map could\nbe NULL here when it cannot.","fix":"Remove the redundant `if (mapbuf)` wrapper and the `map &&` sub-condition; map is always set from map_ptr() at this point.","locations":[{"ref":"receiver.c:617-633","code":"  617 | \t\tif (mapbuf) {\n  618 | \t\t\tmap = map_ptr(mapbuf,offset2,len);\n  619 | \n  620 | \t\t\tsee_token(map, len);\n  621 | \t\t\tsum_update(map, len);\n  622 | \t\t}\n  623 | \n  624 | \t\tif (updating_basis_or_equiv) {\n  625 | \t\t\tif (offset == offset2 && fd != -1) {\n  626 | \t\t\t\tif (skip_matched(fd, offset, map, len) < 0)\n  627 | \t\t\t\t\tgoto report_write_error;\n  628 | \t\t\t\toffset += len;\n  629 | \t\t\t\tcontinue;\n  630 | \t\t\t}\n  631 | \t\t}\n  632 | \t\tif (fd != -1 && map && write_file(fd, 0, offset, map, len) != (int)len)\n  633 | \t\t\tgoto report_write_error;","lines":17,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/receiver.c#L617-L633"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"rule->elide is unconditionally set to 0 in add_rule() (line 227) right before the pattern is filled in, but the struct came from new0()/new_array allocation that is already zeroed for new0 rules. For rules built via new_array path the field matters, but the assignment sits oddly in the middle of pattern setup; it is effectively redundant for the common new0(filter_rule) callers.","fix":"Move the elide reset next to other rflag initialization or drop it for new0-allocated rules; verify all callers zero-init.","locations":[{"ref":"exclude.c:324","code":"  324 | \trule->elide = 0;","lines":1,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/exclude.c#L324"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"In recv_generator, after generate_and_send_sums the final write_sum_head fallback has two structurally identical branches: 'if (statret != 0 || whole_file) write_sum_head(f_out, NULL); else if (sx.st.st_size <= 0) { write_sum_head(f_out, NULL); }'. The else-if body is the same call as the if body, so the extra branch adds no behavior and the braces/structure suggest a refactor was abandoned.","fix":"Collapse to a single condition: if (statret != 0 || whole_file || sx.st.st_size <= 0) write_sum_head(f_out, NULL); else { generate_and_send_sums ... }.","locations":[{"ref":"generator.c:2400-2411","code":" 2400 | \tif (statret != 0 || whole_file)\n 2401 | \t\twrite_sum_head(f_out, NULL);\n 2402 | \telse if (sx.st.st_size <= 0) {\n 2403 | \t\twrite_sum_head(f_out, NULL);\n 2404 | \t} else {\n 2405 | \t\tif (generate_and_send_sums(fd, sx.st.st_size, f_out, f_copy) < 0) {\n 2406 | \t\t\trprintf(FWARNING,\n 2407 | \t\t\t\t\"WARNING: file is too large for checksum sending: %s\\n\",\n 2408 | \t\t\t\tfnamecmp);\n 2409 | \t\t\twrite_sum_head(f_out, NULL);\n 2410 | \t\t}\n 2411 | \t}","lines":12,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/generator.c#L2400-L2411"}]},

{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"generate_hash()'s doc comment says 'Generate an MD4 hash created from the combination of the password and the challenge', but the function uses sum_init(valid_auth_checksums.negotiated_nni, ...) i.e. the negotiated checksum algorithm (MD5/SHA*), not MD4. The comment is stale and misleading for a security-sensitive routine.","fix":"Update the comment to say the hash uses the negotiated auth checksum algorithm, not MD4.","locations":[{"ref":"authenticate.c:121-134","code":"  121 | /* Generate an MD4 hash created from the combination of the password\n  122 |  * and the challenge string and return it base64-encoded. */\n  123 | static void generate_hash(const char *in, const char *challenge, char *out)\n  124 | {\n  125 | \tchar buf[MAX_DIGEST_LEN];\n  126 | \tint len;\n  127 | \n  128 | \tlen = sum_init(valid_auth_checksums.negotiated_nni, 0);\n  129 | \tsum_update(in, strlen(in));\n  130 | \tsum_update(challenge, strlen(challenge));\n  131 | \tsum_end(buf);\n  132 | \n  133 | \tbase64_encode(buf, len, out, 0);\n  134 | }","lines":14,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/authenticate.c#L121-L134"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"Comment says 'so there is a limit of one lookup per customer' (typo/odd phrasing for 'per client/connection') and the function caches in a function-static name_buf, meaning across a single forked daemon child only one client is ever handled, so caching is fine; but in the daemon-over-rsh or repeated-call scenarios the static cache is never reset, so a process that handles its address once keeps that name for any subsequent client_name call regardless of a different ipaddr argument. The comment masks this by implying it is always one customer.","fix":"Clarify the comment to state the cache is per-process and is valid only because each client is handled by a dedicated forked child; assert ipaddr matches on a cache hit if reuse is ever possible.","locations":[{"ref":"clientname.c:88-99","code":"   88 |  * Return the DNS name of the client.\n   89 |  *\n   90 |  * The name is statically cached so that repeated lookups are quick,\n   91 |  * so there is a limit of one lookup per customer.\n   92 |  *\n   93 |  * If anything goes wrong, including the name->addr->name check, then\n   94 |  * we just use \"UNKNOWN\", so you can use that value in hosts allow\n   95 |  * lines.\n   96 |  *\n   97 |  * After translation from sockaddr to name we do a forward lookup to\n   98 |  * make sure nobody is spoofing PTR records.\n   99 |  **/","lines":12,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/clientname.c#L88-L99"},{"ref":"clientname.c:102-110","code":"  102 | \tstatic char name_buf[100];\n  103 | \tchar port_buf[100];\n  104 | \tstruct sockaddr_storage ss;\n  105 | \tsocklen_t ss_len;\n  106 | \tstruct addrinfo hint, *answer;\n  107 | \tint err;\n  108 | \n  109 | \tif (*name_buf)\n  110 | \t\treturn name_buf;","lines":9,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/clientname.c#L102-L110"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"Grammatically broken and misleading comment. It reads 'Return the name unchanged it doesn't have any slashes.' (missing 'if'/'when'), and the code below actually copies the name into a static buffer and returns that buffer (not the original name unchanged) in the len_ptr branch.","fix":"Rewrite as: '/* Return the name (truncated to len_ptr) when it doesn't have any slashes. */' and note that the result may be a copy in the static buf.","locations":[{"ref":"exclude.c:705","code":"  705 | \t\t/* Return the name unchanged it doesn't have any slashes. */","lines":1,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/exclude.c#L705"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"idev_destroy() iterates dev_tbl (created with HT_KEY64, i.e. ht_int64_node entries) but casts each node to `struct ht_int32_node *`. It only ever reads node->data, which is the first member of both node structs, so it works by accident, but the cast is type-incorrect and misleading to a future reader who may add key access via this pointer and read the wrong/over-running field.","fix":"Cast to `struct ht_int64_node *` to match the HT_KEY64 table that init_hard_links() created, or access only via a void* and HT_NODE without naming a specific node type.","locations":[{"ref":"hlink.c:91-95","code":"   91 | \tfor (i = 0; i < dev_tbl->size; i++) {\n   92 | \t\tstruct ht_int32_node *node = HT_NODE(dev_tbl, dev_tbl->nodes, i);\n   93 | \t\tif (node->data)\n   94 | \t\t\thashtable_destroy(node->data);\n   95 | \t}","lines":5,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/hlink.c#L91-L95"}]},
{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"Comment says \"unprotected args stop here\" with `if (protect_args && !local_server) args[ac++] = NULL;` - but for a local_server with protect_args set, the NULL terminator is intentionally NOT added, and the remaining (protected) args continue to be appended into the same array. The comment does not explain the local_server exception, making the control flow misleading to a reader who assumes protected args are always split out.","fix":"Expand the comment to note that for a local server the split is skipped so all args go through one array.","locations":[{"ref":"options.c:2919-2920","code":" 2919 | \tif (protect_args && !local_server) /* unprotected args stop here */\n 2920 | \t\targs[ac++] = NULL;","lines":2,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/options.c#L2919-L2920"}]},
{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"Comment at do_server_sender says 'change_dir#3' but get_local_name already uses 'change_dir#3' and 'change_dir#4' is used in do_server_recv. The #3 label is duplicated between functions, making the numbered debug strings ambiguous when diagnosing which change_dir failed.","fix":"Renumber the change_dir debug messages so each call site has a unique identifier.","locations":[{"ref":"rsync.c:953-955","code":"  953 | \tstruct file_list *flist = cur_flist;\n  954 | \n  955 | \tif (!flist && !(flist = first_flist))","lines":3,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/rsync.c#L953-L955"},{"ref":"main.c:862-864","code":"  862 | \t} else if (!change_dir(dest_path, CD_NORMAL)) {\n  863 | \t\trsyserr(FERROR, errno, \"change_dir#3 %s failed\",\n  864 | \t\t\tfull_fname(dest_path));","lines":3,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/main.c#L862-L864"},{"ref":"main.c:1205-1207","code":" 1205 | \t\tif (!am_daemon && !change_dir(dir, CD_NORMAL)) {\n 1206 | \t\t\trsyserr(FERROR, errno, \"change_dir#4 %s failed\",\n 1207 | \t\t\t\tfull_fname(dir));","lines":3,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/main.c#L1205-L1207"}]},
{"id":"CMT_7","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"The AVX2 64-byte loop carries comments copied from the 32-byte SSSE3 implementation that no longer match the code. Examples: 'sum(t1[0]..t1[7])' (should be t1[0]..t1[15]), 't1[0]*28 + t1[1]*24' and 's2 += 28*t1[0] + 24*t1[1] + ...' (the AVX2 multipliers are 60,56,52,...), and the '// s1 += 32*CHAR_OFFSET' / '// s2 += 528*CHAR_OFFSET' comments which describe the 32-byte case. These mislead future readers maintaining the SIMD code.","fix":"Update the inline comments in get_checksum1_avx2_64 to reflect the 64-byte / 16-element work and the 60..4 multiplier set, or remove the now-inaccurate copied comments.","locations":[{"ref":"simd-checksum-x86_64.cpp:390-438","code":"  390 |             // [sum(t1[0]..t1[7]), X, X, X] [int32*4]; faster than multiple _mm_hadds_epi16\n  391 |             __m256i sum_add32 = _mm256_add_epi16(add16_1, add16_2);\n  392 |             sum_add32 = _mm256_add_epi16(sum_add32, _mm256_srli_epi32(sum_add32, 16));\n  393 |             sum_add32 = _mm256_add_epi16(sum_add32, _mm256_srli_si256(sum_add32, 4));\n  394 |             sum_add32 = _mm256_add_epi16(sum_add32, _mm256_srli_si256(sum_add32, 8));\n  395 | \n  396 |             // [sum(t2[0]..t2[7]), X, X, X] [int32*4]; faster than multiple _mm_hadds_epi16\n  397 |             __m256i sum_mul_add32 = _mm256_add_epi16(mul_add16_1, mul_add16_2);\n  398 |             sum_mul_add32 = _mm256_add_epi16(sum_mul_add32, _mm256_srli_epi32(sum_mul_add32, 16));\n  399 |             sum_mul_add32 = _mm256_add_epi16(sum_mul_add32, _mm256_srli_si256(sum_mul_add32, 4));\n  400 |             sum_mul_add32 = _mm256_add_epi16(sum_mul_add32, _mm256_srli_si256(sum_mul_add32, 8));\n  401 | \n  402 |             // s1 += t1[0] + t1[1] + t1[2] + t1[3] + t1[4] + t1[5] + t1[6] + t1[7]\n  403 | \t    __m128i sum_add32_hi = _mm256_extracti128_si256(sum_add32, 0x1);\n  404 |             ss1 = _mm_add_epi32(ss1, _mm256_castsi256_si128(sum_add32));\n  405 |             ss1 = _mm_add_epi32(ss1, sum_add32_hi);\n  406 | \n  407 |             // s2 += t2[0] + t2[1] + t2[2] + t2[3] + t2[4] + t2[5] + t2[6] + t2[7]\n  408 | \t    __m128i sum_mul_add32_hi = _mm256_extracti128_si256(sum_mul_add32, 0x1);\n  409 |             ss2 = _mm_add_epi32(ss2, _mm256_castsi256_si128(sum_mul_add32));\n  410 |             ss2 = _mm_add_epi32(ss2, sum_mul_add32_hi);\n  411 | \n  412 |             // [t1[0] + t1[1], t1[2] + t1[3] ...] [int16*8]\n  413 |             // We could've combined this with generating sum_add32 above and\n  414 |             // save an instruction but benchmarking shows that as being slower\n  415 |             __m256i add16 = _mm256_hadds_epi16(add16_1, add16_2);\n  416 | \n  417 |             // [t1[0], t1[1], ...] -> [t1[0]*28 + t1[1]*24, ...] [int32*4]\n  418 |             __m256i mul32 = _mm256_madd_epi16(add16, mul_t1);\n  419 | \n  420 |             // [sum(mul32), X, X, X] [int32*4]; faster than multiple _mm_hadd_epi32\n  421 |             mul32 = _mm256_add_epi32(mul32, _mm256_srli_si256(mul32, 4));\n  422 |             mul32 = _mm256_add_epi32(mul32, _mm256_srli_si256(mul32, 8));\n  423 | \t    // prefetch 2 cacheline ahead\n  424 |             _mm_prefetch(&buf[i + 160], _MM_HINT_T0);\n  425 | \n  426 |             // s2 += 28*t1[0] + 24*t1[1] + 20*t1[2] + 16*t1[3] + 12*t1[4] + 8*t1[5] + 4*t1[6]\n  427 | \t    __m128i mul32_hi = _mm256_extracti128_si256(mul32, 0x1);\n  428 |             ss2 = _mm_add_epi32(ss2, _mm256_castsi256_si128(mul32));\n  429 |             ss2 = _mm_add_epi32(ss2, mul32_hi);\n  430 | \n  431 | #if CHAR_OFFSET != 0\n  432 |             // s1 += 32*CHAR_OFFSET\n  433 |             __m128i char_offset_multiplier = _mm_set1_epi32(32 * CHAR_OFFSET);\n  434 |             ss1 = _mm_add_epi32(ss1, char_offset_multiplier);\n  435 | \n  436 |             // s2 += 528*CHAR_OFFSET\n  437 |             char_offset_multiplier = _mm_set1_epi32(528 * CHAR_OFFSET);\n  438 |             ss2 = _mm_add_epi32(ss2, char_offset_multiplier);","lines":49,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/simd-checksum-x86_64.cpp#L390-L438"}]},
{"id":"CMT_8","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The header comment on do_open_at() (lines 691-707) describes the wrapper as purely defence-in-depth for sites 'otherwise protected by secure parent-syscalls' and frames O_NOFOLLOW as desirable specifically 'for O_CREAT|O_EXCL'. But the function is a generic do_open replacement and always sets O_NOFOLLOW regardless of flags, which changes semantics for non-O_CREAT opens. The comment understates that this wrapper is NOT a drop-in semantic equivalent of do_open().","fix":"Update the comment to state plainly that do_open_at() never follows a final-component symlink for any flags, so it is not semantically identical to do_open().","locations":[{"ref":"syscall.c:1552-1568","code":" 1552 | /*\n 1553 |   Symlink-race-safe variant of do_open() for receiver-side use. See\n 1554 |   the comment on do_chmod_at() for the threat model. open() resolves\n 1555 |   parent components, so a parent-symlink swap can redirect the open\n 1556 |   to a file outside the module. This wrapper is defence-in-depth for\n 1557 |   bare-path do_open() sites that callers know are otherwise\n 1558 |   protected by secure parent-syscalls (e.g. generator.c's in-place\n 1559 |   backup creation, where robust_unlink() rejects the symlinked\n 1560 |   parent before this open is reached): if any of those upstream\n 1561 |   protections is later removed or regresses, the open here still\n 1562 |   refuses to escape the module.\n 1563 | \n 1564 |   Defence: open the parent of pathname under secure_relative_open()\n 1565 |   and call openat() against the resulting dirfd with O_NOFOLLOW\n 1566 |   (so the basename itself isn't followed if it happens to be a\n 1567 |   pre-planted symlink, which is what we want for O_CREAT|O_EXCL).\n 1568 | */","lines":17,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/syscall.c#L1552-L1568"},{"ref":"syscall.c:1627","code":" 1627 | \tret = openat(dfd, bname, flags | O_NOFOLLOW | O_BINARY, mode);","lines":1,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/syscall.c#L1627"}]},
{"id":"CMT_9","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The comment \"/* File ended, flush */\" sits above `if (token != -2) flush = ZSTD_e_flush;`.\nThe flush is applied for essentially every token except the data-only -2 token, not\nonly at file end (file end is token -1). The comment misdescribes the condition and\nwill mislead a future reader into thinking the flush only happens on EOF.","fix":"Reword to something like '/* Flush the encoder for every non data-only (-2) token so the receiver can decode each block. */'.","locations":[{"ref":"token.c:797-799","code":"  797 | \t\t\t/* File ended, flush */\n  798 | \t\t\tif (token != -2)\n  799 | \t\t\t\tflush = ZSTD_e_flush;","lines":3,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/token.c#L797-L799"}]},
{"id":"CMT_10","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The `/* safe */` comment on the strncpy in partial_dir_fname asserts the copy is bounded, but nothing bounds `len` (= fn - fname) against the destination buffer size before the copy. The comment hides the actual overflow risk noted above.","fix":"Remove or correct the comment once a real bounds check is added.","locations":[{"ref":"util1.c:1573","code":" 1573 | \t\t\tstrncpy(t, fname, len); /* safe */","lines":1,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/util1.c#L1573"}]},
{"id":"CMT_11","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"Comment in cleanup.c claims cleanup_got_literal is 'Set to True once literal data has been sent', followed by a literal '(????)' editorial marker left in the source. The (????) is noise that should not ship, and the description is for the variable that follows, not the close_all/file-doc block it is grouped with.","fix":"Remove the stray '(????)' and tidy the doc comment so it clearly documents cleanup_got_literal.","locations":[{"ref":"cleanup.c:80-88","code":"   80 | /**\n   81 |  * Set to True once literal data has been sent across the link for the\n   82 |  * current file. (????)\n   83 |  *\n   84 |  * Handling the cleanup when a transfer is interrupted is tricky when\n   85 |  * --partial is selected.  We need to ensure that the partial file is\n   86 |  * kept if any real data has been transferred.\n   87 |  **/\n   88 | int cleanup_got_literal = 0;","lines":9,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/cleanup.c#L80-L88"}]},
{"id":"CMT_12","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"Comment in client_addr() block and the 'one lookup per customer' phrasing aside, the comment at clientserver.c:355-356 'Old servers may just drop the connection here, rather than sending a proper EXIT command. Yuck.' is fine, but the adjacent kluge_around_eof logic only sets the kluge for protocol_version < 25 while listing; for >=25 servers send EXIT. This is correct, noting only that the comment does not mention the version gate that the code applies.","fix":"Optionally mention the protocol_version < 25 gate in the comment.","locations":[{"ref":"clientserver.c:397-399","code":"  397 | \t/* Old servers may just drop the connection here,\n  398 | \t rather than sending a proper EXIT command.  Yuck. */\n  399 | \tkluge_around_eof = list_only && protocol_version < 25 ? 1 : 0;","lines":3,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/clientserver.c#L397-L399"}]},
{"id":"CMT_13","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"The comment at the hard-link debug block says first_hlink_ndx 'is -1 when new', but the value stored/compared is '(int32)(long)np->data' where np->data defaults to NULL (0), not -1; a brand-new node yields 0 here, while the documented -1 sentinel is only produced after the explicit cast pattern used elsewhere. The comment is misleading about the new-node sentinel for this code path.","fix":"Clarify the comment to state that a freshly created node has data==NULL (0) and that the -1 wording refers to the receiver's separate ndx convention, or align the sentinel handling.","locations":[{"ref":"flist.c:602-603","code":"  602 | \t\t\tfirst_hlink_ndx = (int32)(long)np->data; /* is -1 when new */\n  603 | \t\t\tif (first_hlink_ndx < 0) {","lines":2,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/flist.c#L602-L603"}]},
{"id":"CMT_14","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"The comment on sum_sizes_sqroot says 'blocksum_bits = BLOCKSUM_BIAS + 2*log2(file_len) - log2(block_len)' and references md4, but the strong-sum length is now capped by xfer_sum_len/SUM_LENGTH (max_s2length) which can be a negotiated xxh/MD5 digest, not md4. The historical md4 wording is misleading for readers of the current code.","fix":"Update the comment to refer to the negotiated strong-checksum digest rather than md4, and note the max_s2length cap added for short digests.","locations":[{"ref":"generator.c:693-702","code":"  693 |  * The block size is a rounded square root of file length.\n  694 |  *\n  695 |  * The checksum size is determined according to:\n  696 |  *     blocksum_bits = BLOCKSUM_BIAS + 2*log2(file_len) - log2(block_len)\n  697 |  * provided by Donovan Baarda which gives a probability of rsync\n  698 |  * algorithm corrupting data and falling back using the whole md4\n  699 |  * checksums.\n  700 |  *\n  701 |  * This might be made one of several selectable heuristics.\n  702 |  */","lines":10,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/generator.c#L693-L702"}]},
{"id":"CMT_15","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"Typo in comment: `Must becombined` (missing space) should read `Must be combined`.","fix":"Fix the comment to `/* Must be combined with PIO_NEED_INPUT. */`.","locations":[{"ref":"io.c:211","code":"  211 | #define PIO_CONSUME_INPUT (1<<4) /* Must becombined with PIO_NEED_INPUT. */","lines":1,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/io.c#L211"}]},
{"id":"CMT_16","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"Comment in sysacls.c AIX block says the access must be 'left shifted by three bites' but the code shifts by 6 (<<= 6), and 'bites' is a typo for 'bits'. The comment is both numerically wrong and misspelled, appearing twice.","fix":"Correct the comment to say 'left shifted by six bits' (matching <<= 6) and fix the spelling.","locations":[{"ref":"lib/sysacls.c:2083-2085","code":" 2083 | \t\t\t/* The access in the acl entries must be left shifted by *\n 2084 | \t\t\t * three bites, because they will ultimately be compared *\n 2085 | \t\t\t * to S_IRUSR, S_IWUSR, and S_IXUSR.                  */","lines":3,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/lib/sysacls.c#L2083-L2085"},{"ref":"lib/sysacls.c:2083-2085","code":" 2083 | \t\t\t/* The access in the acl entries must be left shifted by *\n 2084 | \t\t\t * three bites, because they will ultimately be compared *\n 2085 | \t\t\t * to S_IRUSR, S_IWUSR, and S_IXUSR.                  */","lines":3,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/lib/sysacls.c#L2083-L2085"}]},
{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"hard","description":"The run-output token-encoding block (compute r = run_start - last_run_end, n =\nlast_token - run_start, emit TOKEN_REL/TOKENRUN_REL or TOKEN_LONG/TOKENRUN_LONG plus\nthe run-count bytes) is duplicated verbatim across send_deflated_token,\nsend_zstd_token and send_compressed_token (LZ4). Three ~17-line copies that must stay\nbit-for-bit identical for protocol compatibility; a fix to one can silently diverge.","fix":"Extract a shared helper, e.g. emit_token_run(int f, int32 token, int32 nb), and call it from all three senders.","locations":[{"ref":"token.c:396-412","code":"  396 | \t} else if (nb != 0 || token != last_token + 1 || token >= run_start + 65536) {\n  397 | \t\t/* output previous run */\n  398 | \t\tr = run_start - last_run_end;\n  399 | \t\tn = last_token - run_start;\n  400 | \t\tif (r >= 0 && r <= 63) {\n  401 | \t\t\twrite_byte(f, (n==0? TOKEN_REL: TOKENRUN_REL) + r);\n  402 | \t\t} else {\n  403 | \t\t\twrite_byte(f, (n==0? TOKEN_LONG: TOKENRUN_LONG));\n  404 | \t\t\twrite_int(f, run_start);\n  405 | \t\t}\n  406 | \t\tif (n != 0) {\n  407 | \t\t\twrite_byte(f, n);\n  408 | \t\t\twrite_byte(f, n >> 8);\n  409 | \t\t}\n  410 | \t\tlast_run_end = last_token;\n  411 | \t\trun_start = token;\n  412 | \t}","lines":17,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/token.c#L396-L412"},{"ref":"token.c:765-782","code":"  765 | \t} else if (nb != 0 || token != last_token + 1 || token >= run_start + 65536) {\n  766 | \t\t/* output previous run */\n  767 | \t\tr = run_start - last_run_end;\n  768 | \t\tn = last_token - run_start;\n  769 | \n  770 | \t\tif (r >= 0 && r <= 63) {\n  771 | \t\t\twrite_byte(f, (n==0? TOKEN_REL: TOKENRUN_REL) + r);\n  772 | \t\t} else {\n  773 | \t\t\twrite_byte(f, (n==0? TOKEN_LONG: TOKENRUN_LONG));\n  774 | \t\t\twrite_int(f, run_start);\n  775 | \t\t}\n  776 | \t\tif (n != 0)
