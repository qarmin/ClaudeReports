{"id":"OVF_17","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"block_size is parsed as ssize_t then truncated to int32 via `block_size = (int32)size;`. parse_size_arg already bounds it to max_blength (MAX_BLOCK_SIZE), so the cast is currently safe, but the cast silently relies on that invariant; server_options() later does `asprintf(&arg, \"-B%u\", (int)block_size)` using %u with an (int) argument, a format/type mismatch (int passed for unsigned conversion).","fix":"Use a matching format/type in the asprintf (e.g. cast to unsigned: `(unsigned)block_size` with %u, or use %d with (int)). Keep the bounds invariant explicit.","locations":[{"ref":"options.c:1810","code":" 1810 | \t\t\tblock_size = (int32)size;","lines":1,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/options.c#L1810"},{"ref":"options.c:2963","code":" 2963 | \t\tif (asprintf(&arg, \"-B%u\", (int)block_size) < 0)","lines":1,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/options.c#L2963"}]},
{"id":"OVF_18","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"msdiff() computes `(t2->tv_sec - t1->tv_sec) * 1000L` in a long. On platforms where long is 32 bits, an elapsed time of more than ~24 days overflows, and even a modest multi-hour transfer combined with the +usec term can produce a wrong (possibly negative) result that then feeds rate/ETA math. The function also returns unsigned long while computing a potentially negative intermediate.","fix":"Perform the arithmetic in a 64-bit type (e.g. int64/long long) and clamp negative diffs to 0 before returning.","locations":[{"ref":"progress.c:55-59","code":"   55 | static unsigned long msdiff(struct timeval *t1, struct timeval *t2)\n   56 | {\n   57 | \treturn (t2->tv_sec - t1->tv_sec) * 1000L\n   58 | \t     + (t2->tv_usec - t1->tv_usec) / 1000;\n   59 | }","lines":5,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/progress.c#L55-L59"}]},
{"id":"OVF_19","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"dest_mode() declares new_mode as int and returns it as mode_t. The expression `(new_mode & 0444) >> 2` and the bit operations are fine, but storing the computed value through an int and returning as mode_t relies on implementation-defined narrowing; more importantly the `else` branch `flist_mode & (~CHMOD_BITS | dflt_perms)` ANDs with the complement of CHMOD_BITS ORed with dflt_perms - if dflt_perms ever contains bits outside CHMOD_BITS this preserves unexpected high mode bits. Minor but worth verifying dflt_perms is masked to CHMOD_BITS by callers.","fix":"Use mode_t for new_mode and assert/mask dflt_perms to CHMOD_BITS at entry so the default-permission OR cannot leak unintended bits.","locations":[{"ref":"rsync.c:464-486","code":"  464 | mode_t dest_mode(mode_t flist_mode, mode_t stat_mode, int dflt_perms,\n  465 | \t\t int exists)\n  466 | {\n  467 | \tint new_mode;\n  468 | \t/* If the file already exists, we'll return the local permissions,\n  469 | \t * possibly tweaked by the --executability option. */\n  470 | \tif (exists) {\n  471 | \t\tnew_mode = (flist_mode & ~CHMOD_BITS) | (stat_mode & CHMOD_BITS);\n  472 | \t\tif (preserve_executability && S_ISREG(flist_mode)) {\n  473 | \t\t\t/* If the source file is executable, grant execute\n  474 | \t\t\t * rights to everyone who can read, but ONLY if the\n  475 | \t\t\t * file isn't already executable. */\n  476 | \t\t\tif (!(flist_mode & 0111))\n  477 | \t\t\t\tnew_mode &= ~0111;\n  478 | \t\t\telse if (!(stat_mode & 0111))\n  479 | \t\t\t\tnew_mode |= (new_mode & 0444) >> 2;\n  480 | \t\t}\n  481 | \t} else {\n  482 | \t\t/* Apply destination default permissions and turn\n  483 | \t\t * off special permissions. */\n  484 | \t\tnew_mode = flist_mode & (~CHMOD_BITS | dflt_perms);\n  485 | \t}\n  486 | \treturn new_mode;","lines":23,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/rsync.c#L464-L486"}]},
{"id":"OVF_20","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"receive_sums() (sender side) computes `s->flength = (OFF_T)s->count * s->blength`\nfor append_mode. count and blength are read from the network and validated in\nread_sum_head, but the multiplication promotes via the (OFF_T) cast on count only;\nblength stays int32. With count up to INT32_MAX and blength up to 1<<29, the product\nfits OFF_T (64-bit) thanks to the cast, so this specific line is safe -- but the\nidentical pattern in receive_data (`sum.flength = (OFF_T)sum.count * sum.blength`)\nrelies on the same cast. Both are correct only because OFF_T is 64-bit; worth a\nguard comment since a 32-bit OFF_T build would overflow.","fix":"Add a compile-time assertion that OFF_T is 64-bit, or compute the product with explicit 64-bit operands and document the assumption.","locations":[{"ref":"sender.c:350-353","code":"  350 | \tif (append_mode > 0) {\n  351 | \t\ts->flength = (OFF_T)s->count * s->blength;\n  352 | \t\tif (s->remainder)\n  353 | \t\t\ts->flength -= s->blength - s->remainder;","lines":4,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/sender.c#L350-L353"},{"ref":"receiver.c:510-512","code":"  510 | \t\tsum.flength = (OFF_T)sum.count * sum.blength;\n  511 | \t\tif (sum.remainder)\n  512 | \t\t\tsum.flength -= sum.blength - sum.remainder;","lines":3,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/receiver.c#L510-L512"}]},
{"id":"OVF_21","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"do_setattrlist_times()/do_lutimes()/do_utimes() assign stp->st_atime/st_mtime (time_t) into struct timeval/timespec tv_sec and ST_*_NSEC into tv_usec/tv_nsec. The nsec->usec division (ST_ATIME_NSEC / 1000) silently truncates sub-microsecond precision, and on 32-bit time_t platforms the st_*time assignment can overflow for post-2038 timestamps. Low impact but worth noting for the time-preservation path.","fix":"No action needed for nsec truncation (inherent to the API). For 2038 safety, rely on the build's 64-bit time_t; document the assumption.","locations":[{"ref":"syscall.c:2588-2600","code":" 2588 | \tt[0].tv_sec = stp->st_atime;\n 2589 | #ifdef ST_ATIME_NSEC\n 2590 | \tt[0].tv_usec = stp->ST_ATIME_NSEC / 1000;\n 2591 | #else\n 2592 | \tt[0].tv_usec = 0;\n 2593 | #endif\n 2594 | \tt[1].tv_sec = stp->st_mtime;\n 2595 | #ifdef ST_MTIME_NSEC\n 2596 | \tt[1].tv_usec = stp->ST_MTIME_NSEC / 1000;\n 2597 | #else\n 2598 | \tt[1].tv_usec = 0;\n 2599 | #endif\n 2600 | \treturn lutimes(path, t);","lines":13,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/syscall.c#L2588-L2600"},{"ref":"syscall.c:2612-2624","code":" 2612 | \tt[0].tv_sec = stp->st_atime;\n 2613 | #ifdef ST_ATIME_NSEC\n 2614 | \tt[0].tv_usec = stp->ST_ATIME_NSEC / 1000;\n 2615 | #else\n 2616 | \tt[0].tv_usec = 0;\n 2617 | #endif\n 2618 | \tt[1].tv_sec = stp->st_mtime;\n 2619 | #ifdef ST_MTIME_NSEC\n 2620 | \tt[1].tv_usec = stp->ST_MTIME_NSEC / 1000;\n 2621 | #else\n 2622 | \tt[1].tv_usec = 0;\n 2623 | #endif\n 2624 | \treturn utimes(path, t);","lines":13,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/syscall.c#L2612-L2624"}]},
{"id":"OVF_22","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"safe_read() returns `int n_chars` from read() but accepts a `size_t len`. read() can be asked for up to len bytes; if len > INT_MAX the result is implementation defined and the int return truncates. In copy_file the read size is a fixed 8 KB so this is safe today, but the helper is unsafe for large len values.","fix":"Use `ssize_t n_chars` and return ssize_t, or document/clamp that len must be <= SSIZE_MAX.","locations":[{"ref":"util1.c:332-344","code":"  332 | static int safe_read(int desc, char *ptr, size_t len)\n  333 | {\n  334 | \tint n_chars;\n  335 | \n  336 | \tif (len == 0)\n  337 | \t\treturn len;\n  338 | \n  339 | \tdo {\n  340 | \t\tn_chars = read(desc, ptr, len);\n  341 | \t} while (n_chars < 0 && errno == EINTR);\n  342 | \n  343 | \treturn n_chars;\n  344 | }","lines":13,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/util1.c#L332-L344"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"match_address() writes a NUL into the caller's token at the '/' to split address from mask (line 122), and restores it on most exit paths, but the success path through match_binary at lines 235-243 reaches the 'out:' label which does NOT restore the '/'. Trace: when p!=0 and inet_pton/strtol succeed, control flows past the restore... actually the restore is done at line 146 (*p++ = '/') before any of these branches, so the token is restored early. However note inet_pton path at 197 leaves bits=-1 with p already restored - confirm the token mutation is always reverted. The fragile early-restore (line 146 advances p past the slash with p++) means the later 'malformed mask in %s' diagnostics print the token with the slash intact but p now points one char too far for any further use; this is brittle but currently correct.","fix":"Avoid mutating the caller's token in place; copy the token or split into separate buffers so restoration cannot be missed and diagnostics are unambiguous.","locations":[{"ref":"access.c:137-163","code":"  137 | \tp = strchr(tok,'/');\n  138 | \tif (p)\n  139 | \t\t*p = '\\0';\n  140 | \n  141 | \t/* Fail quietly if tok is a hostname, not an address. */\n  142 | \tif (tok[strspn(tok, \".0123456789\")] && strchr(tok, ':') == NULL) {\n  143 | \t\tif (p)\n  144 | \t\t\t*p = '/';\n  145 | \t\treturn 0;\n  146 | \t}\n  147 | \n  148 | \tmemset(&hints, 0, sizeof(hints));\n  149 | \thints.ai_family = PF_UNSPEC;\n  150 | \thints.ai_socktype = SOCK_STREAM;\n  151 | #ifdef AI_NUMERICHOST\n  152 | \thints.ai_flags = AI_NUMERICHOST;\n  153 | #endif\n  154 | \n  155 | \tif (getaddrinfo(addr, NULL, &hints, &resa) != 0) {\n  156 | \t\tif (p)\n  157 | \t\t\t*p = '/';\n  158 | \t\treturn 0;\n  159 | \t}\n  160 | \n  161 | \tgai = getaddrinfo(tok, NULL, &hints, &rest);\n  162 | \tif (p)\n  163 | \t\t*p++ = '/';","lines":27,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/access.c#L137-L163"},{"ref":"access.c:213-253","code":"  213 | \tif (p) {\n  214 | \t\tif (inet_pton(resa->ai_addr->sa_family, p, mask) <= 0) {\n  215 | #ifdef HAVE_STRTOL\n  216 | \t\t\tchar *ep = NULL;\n  217 | #else\n  218 | \t\t\tunsigned char *pp;\n  219 | #endif\n  220 | \n  221 | #ifdef HAVE_STRTOL\n  222 | \t\t\tbits = strtol(p, &ep, 10);\n  223 | \t\t\tif (!*p || *ep) {\n  224 | \t\t\t\trprintf(FLOG, \"malformed mask in %s\\n\", tok);\n  225 | \t\t\t\tret = 0;\n  226 | \t\t\t\tgoto out;\n  227 | \t\t\t}\n  228 | #else\n  229 | \t\t\tfor (pp = (unsigned char *)p; *pp; pp++) {\n  230 | \t\t\t\tif (!isascii(*pp) || !isdigit(*pp)) {\n  231 | \t\t\t\t\trprintf(FLOG, \"malformed mask in %s\\n\", tok);\n  232 | \t\t\t\t\tret = 0;\n  233 | \t\t\t\t\tgoto out;\n  234 | \t\t\t\t}\n  235 | \t\t\t}\n  236 | \t\t\tbits = atoi(p);\n  237 | #endif\n  238 | \t\t\tif (bits == 0) {\n  239 | \t\t\t\tret = 1;\n  240 | \t\t\t\tgoto out;\n  241 | \t\t\t}\n  242 | \t\t\tif (bits < 0 || bits > (addrlen << 3)) {\n  243 | \t\t\t\trprintf(FLOG, \"malformed mask in %s\\n\", tok);\n  244 | \t\t\t\tret = 0;\n  245 | \t\t\t\tgoto out;\n  246 | \t\t\t}\n  247 | \t\t}\n  248 | \t} else {\n  249 | \t\tbits = 128;\n  250 | \t}\n  251 | \n  252 | \tif (bits >= 0)\n  253 | \t\tmake_mask(mask, bits, addrlen);","lines":41,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/access.c#L213-L253"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"match_address() default mask bits is 128 even when the address family is IPv4 (addrlen 4). When a deny/allow token is a bare IPv4 address with no '/' prefix, 'bits' stays 128 and make_mask(mask,128,4) is invoked. This happens to work for an exact match because match_binary only compares addrlen(=4) bytes, but the default of 128 is conceptually wrong and fragile: any future change that consults 'bits' for IPv4 (or that validates bits<=addrlen<<3 for the no-slash path) would misbehave. The no-slash path also skips the bits range validation entirely.","fix":"Set the default bits based on family: bits = addrlen << 3 (32 for IPv4, 128 for IPv6) when no mask is supplied.","locations":[{"ref":"access.c:248-253","code":"  248 | \t} else {\n  249 | \t\tbits = 128;\n  250 | \t}\n  251 | \n  252 | \tif (bits >= 0)\n  253 | \t\tmake_mask(mask, bits, addrlen);","lines":6,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/access.c#L248-L253"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"auth_server() parses the per-user option suffix (':deny', ':ro', ':rw') using isUpper(opts)?toLower(opts):*opts and isUpper(opts+1)?toLower(opts+1):opts[1]. isUpper/toLower here are the rsync macros that take a pointer and read one char, but the 'rw'/'ro' branch reads opts[1] without first confirming opts[0] was actually 'r' from a non-empty string: if the suffix is exactly \"r\" (opts points at 'r' then '\\0'), opts[1] is the terminating NUL, toLower(NUL) is read, and opt_ch becomes garbage that is neither 'o' nor 'w', so it falls to opt_ch='\\0' (treated as read-write). A bare ':r' suffix silently grants write access instead of being rejected.","fix":"After detecting leading 'r', verify the next char is exactly 'o' or 'w' and reject (deny) any other suffix instead of defaulting to full read-write access.","locations":[{"ref":"authenticate.c:359-369","code":"  359 | \t\tif ((opts = strchr(tok, ':')) != NULL) {\n  360 | \t\t\t*opts++ = '\\0';\n  361 | \t\t\topt_ch = isUpper(opts) ? toLower(opts) : *opts;\n  362 | \t\t\tif (opt_ch == 'r') { /* handle ro and rw */\n  363 | \t\t\t\topt_ch = isUpper(opts+1) ? toLower(opts+1) : opts[1];\n  364 | \t\t\t\tif (opt_ch == 'o')\n  365 | \t\t\t\t\topt_ch = 'r';\n  366 | \t\t\t\telse if (opt_ch != 'w')\n  367 | \t\t\t\t\topt_ch = '\\0';\n  368 | \t\t\t} else if (opt_ch != 'd') /* if it's not deny, ignore it */\n  369 | \t\t\t\topt_ch = '\\0';","lines":11,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/authenticate.c#L359-L369"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"hard","description":"rsync_module(): the per-module reverse-lookup-on-demand at lines 723-724 calls client_name(client_addr(f_in)) when host==undetermined_hostname and the module enables reverse lookup. But start_daemon() already attempts this pre-chroot scan (lines 1326-1335) only when some module wants it; if the GLOBAL reverse lookup is off and only this module wants it, the pre-chroot scan DID run (the loop covers per-module), so by here client_name's static cache is populated. However if a daemon chroot (lp_daemon_chroot) was applied between the pre-chroot scan and here, the cache is fine; but for a 'use chroot' module the chroot happens later (line 983) so this lookup at 723 runs before chroot - OK. The risk: if reverse lookup is enabled per-module but the pre-chroot scan was skipped because need_reverse stayed 0 due to a module index mismatch, a hostname-based allow/deny would silently fail-open. Verify lp_reverse_lookup(j) indexing matches the module 'i' used here.","fix":"Ensure the pre-chroot scan and the per-module check use identical module indexing; add an assertion or always populate the cache before any access check when any reverse-lookup is configured.","locations":[{"ref":"clientserver.c:766-784","code":"  766 | \t/* If reverse lookup is disabled globally but enabled for this module,\n  767 | \t * we need to do it now before the access check. */\n  768 | \tif (host == undetermined_hostname && lp_reverse_lookup(i))\n  769 | \t\thost = client_name(client_addr(f_in));\n  770 | \tset_env_str(\"RSYNC_HOST_NAME\", host);\n  771 | \tset_env_str(\"RSYNC_HOST_ADDR\", addr);\n  772 | \n  773 | \tif (!allow_access(addr, &host, i)) {\n  774 | \t\trprintf(FLOG, \"rsync denied on module %s from %s (%s)\\n\",\n  775 | \t\t\tname, host, addr);\n  776 | \t\tif (!lp_list(i))\n  777 | \t\t\tio_printf(f_out, \"@ERROR: Unknown module '%s'\\n\", name);\n  778 | \t\telse {\n  779 | \t\t\tio_printf(f_out,\n  780 | \t\t\t\t  \"@ERROR: access denied to %s from %s (%s)\\n\",\n  781 | \t\t\t\t  name, host, addr);\n  782 | \t\t}\n  783 | \t\treturn -1;\n  784 | \t}","lines":19,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/clientserver.c#L766-L784"},{"ref":"clientserver.c:1459-1468","code":" 1459 | \t{\n 1460 | \t\tint need_reverse = lp_reverse_lookup(-1);\n 1461 | \t\tint j, num_modules = lp_num_modules();\n 1462 | \t\tfor (j = 0; !need_reverse && j < num_modules; j++) {\n 1463 | \t\t\tif (lp_reverse_lookup(j))\n 1464 | \t\t\t\tneed_reverse = 1;\n 1465 | \t\t}\n 1466 | \t\tif (need_reverse)\n 1467 | \t\t\t(void)client_name(client_addr(f_in));\n 1468 | \t}","lines":10,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/clientserver.c#L1459-L1468"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"setup_merge_file() mutates global parser state (dirbuf, dirbuf_len, parent_dirscan) and the rule's pattern in place, and is invoked from push_local_filters() during directory traversal. It does `ex->pattern = strdup(y+1)` after `free`ing the old pattern via `free(pat)` at the end, but `pat` was the original ex->pattern; between strdup and free, ex->pattern already points to the new strdup'd basename. If strdup fails (returns NULL) ex->pattern becomes NULL and subsequent rule_matches()/strrchr(ex->pattern,...) dereferences NULL.","fix":"Check the strdup() result (rsync usually wraps allocation; use the project's checked allocator or test for NULL and call out_of_memory).","locations":[{"ref":"exclude.c:799-845","code":"  799 | \ty = strrchr(x, '/');\n  800 | \t*y = '\\0';\n  801 | \tex->pattern = strdup(y+1);\n  802 | \tif (!*x)\n  803 | \t\tx = \"/\";\n  804 | \tif (*x == '/')\n  805 | \t\tstrlcpy(buf, x, MAXPATHLEN);\n  806 | \telse\n  807 | \t\tpathjoin(buf, MAXPATHLEN, dirbuf, x);\n  808 | \n  809 | \tlen = clean_fname(buf, CFN_COLLAPSE_DOT_DOT_DIRS);\n  810 | \tif (len != 1 && len < MAXPATHLEN-1) {\n  811 | \t\tbuf[len++] = '/';\n  812 | \t\tbuf[len] = '\\0';\n  813 | \t}\n  814 | \t/* This ensures that the specified dir is a parent of the transfer. */\n  815 | \tfor (x = buf, y = dirbuf; *x && *x == *y; x++, y++) {}\n  816 | \tif (*x)\n  817 | \t\ty += strlen(y); /* nope -- skip the scan */\n  818 | \n  819 | \tparent_dirscan = True;\n  820 | \twhile (*y) {\n  821 | \t\tchar save[MAXPATHLEN];\n  822 | \t\t/* copylen is strlen(y) which is < MAXPATHLEN. +1 for \\0 */\n  823 | \t\tsize_t copylen = strlcpy(save, y, MAXPATHLEN) + 1;\n  824 | \t\t*y = '\\0';\n  825 | \t\tdirbuf_len = y - dirbuf;\n  826 | \t\tstrlcpy(x, ex->pattern, MAXPATHLEN - (x - buf));\n  827 | \t\tparse_filter_file(lp, buf, ex, XFLG_ANCHORED2ABS);\n  828 | \t\tif (ex->rflags & FILTRULE_NO_INHERIT) {\n  829 | \t\t\t/* Free the undesired rules to clean up any per-dir\n  830 | \t\t\t * mergelists they defined.  Otherwise pop_local_filters\n  831 | \t\t\t * may crash trying to restore nonexistent state for\n  832 | \t\t\t * those mergelists. */\n  833 | \t\t\tfree_filters(lp->head);\n  834 | \t\t\tlp->head = NULL;\n  835 | \t\t}\n  836 | \t\tlp->tail = NULL;\n  837 | \t\tstrlcpy(y, save, copylen);\n  838 | \t\twhile ((*x++ = *y++) != '/') {}\n  839 | \t}\n  840 | \tparent_dirscan = False;\n  841 | \tif (DEBUG_GTE(FILTER, 2)) {\n  842 | \t\trprintf(FINFO, \"[%s] completed parent_dirscan for mergelist #%d%s\\n\",\n  843 | \t\t\twho_am_i(), mergelist_num, lp->debug_type);\n  844 | \t}\n  845 | \tfree(pat);","lines":47,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/exclude.c#L799-L845"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"rprintf() handles vsnprintf truncation by overwriting the tail with an ellipsis: memcpy(buf+len-sizeof ellipsis, ellipsis, sizeof ellipsis) where len = sizeof buf - 1 and sizeof ellipsis = 6. It then checks format[strlen(format)-1] to optionally restore a trailing newline. If the *format* string is empty (\"\"), strlen(format)-1 underflows to (size_t)-1 and format[(size_t)-1] reads far out of bounds. Empty format strings are unusual but rprintf is a general API.","fix":"Guard with if (*format && format[strlen(format)-1] == '\\n') before indexing.","locations":[{"ref":"log.c:463-466","code":"  463 | \t\tmemcpy(buf+len-sizeof ellipsis, ellipsis, sizeof ellipsis);\n  464 | \t\tif (format[strlen(format)-1] == '\\n') {\n  465 | \t\t\tbuf[len-1] = '\\n';\n  466 | \t\t}","lines":4,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/log.c#L463-L466"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"getallgroups(): after a first getgrouplist() failure with size > malloced, it expands and retries; if it still fails it sets size=-1 and returns 'getgrouplist failed'. But on the path where the first call fails with size <= malloced (else branch line 596), it sets size=-1 then returns the error - fine. The real bug: when the SECOND getgrouplist succeeds, 'size' holds the real count, gid_list->count = size is set, but if the retry's getgrouplist again reports size larger than the freshly expanded buffer (race or kernel rounding), the code does not re-check and proceeds with gid_list->count = (negative or too-large) size, then dereferences gid_array[0..size). A returned size larger than the buffer leads to out-of-bounds reads in the default-group reordering loop.","fix":"After the retry, clamp size to gid_list->malloced (or treat size > malloced as failure) before assigning gid_list->count and indexing gid_array.","locations":[{"ref":"uidlist.c:592-619","code":"  592 | \tif (getgrouplist(pw->pw_name, pw->pw_gid, gid_list->items, &size) < 0) {\n  593 | \t\tif (size > (int)gid_list->malloced) {\n  594 | \t\t\tgid_list->count = gid_list->malloced;\n  595 | \t\t\t(void)EXPAND_ITEM_LIST(gid_list, gid_t, size);\n  596 | \t\t\tif (getgrouplist(pw->pw_name, pw->pw_gid, gid_list->items, &size) < 0)\n  597 | \t\t\t\tsize = -1;\n  598 | \t\t} else\n  599 | \t\t\tsize = -1;\n  600 | \t\tif (size < 0)\n  601 | \t\t\treturn \"getgrouplist failed\";\n  602 | \t}\n  603 | \tgid_list->count = size;\n  604 | \tgid_array = gid_list->items;\n  605 | \n  606 | \t/* Paranoia: is the default group not first in the list? */\n  607 | \tif (gid_array[0] != pw->pw_gid) {\n  608 | \t\tint j;\n  609 | \t\tfor (j = 1; j < size; j++) {\n  610 | \t\t\tif (gid_array[j] == pw->pw_gid)\n  611 | \t\t\t\tbreak;\n  612 | \t\t}\n  613 | \t\tif (j == size) { /* The default group wasn't found! */\n  614 | \t\t\t(void)EXPAND_ITEM_LIST(gid_list, gid_t, size+1);\n  615 | \t\t\tgid_array = gid_list->items;\n  616 | \t\t}\n  617 | \t\tgid_array[j] = gid_array[0];\n  618 | \t\tgid_array[0] = pw->pw_gid;\n  619 | \t}","lines":28,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/uidlist.c#L592-L619"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"base64_encode() reads the next source byte with 'if (byte_offset+1 < len) idx |= d[byte_offset+1] >> (8-(bit_offset-2));'. When bit_offset==3 the shift is (8-(3-2)) = 7, fine; but the guard byte_offset+1<len can still leave the case where byte_offset == len-1 and bit_offset>=3: the low bits of the final sextet are taken only from d[byte_offset] (correct), yet d[byte_offset] is read even when byte_offset can equal len for the very last produced char in some len%3 cases, reading one byte past the input. With non-padded output (pad=0, used by the auth challenge/hash) the final partial group can index d[byte_offset] where byte_offset == len.","fix":"Add an explicit bound check on byte_offset < len before dereferencing d[byte_offset], or compute the exact number of full/partial groups to avoid reading past the input buffer.","locations":[{"ref":"authenticate.c:47-59","code":"   47 | \tfor (i = 0; i < bytes; i++) {\n   48 | \t\tbyte_offset = (i*6)/8;\n   49 | \t\tbit_offset = (i*6)%8;\n   50 | \t\tif (bit_offset < 3) {\n   51 | \t\t\tidx = (d[byte_offset] >> (2-bit_offset)) & 0x3F;\n   52 | \t\t} else {\n   53 | \t\t\tidx = (d[byte_offset] << (bit_offset-2)) & 0x3F;\n   54 | \t\t\tif (byte_offset+1 < len) {\n   55 | \t\t\t\tidx |= (d[byte_offset+1] >> (8-(bit_offset-2)));\n   56 | \t\t\t}\n   57 | \t\t}\n   58 | \t\tout[i] = b64[idx];\n   59 | \t}","lines":13,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/authenticate.c#L47-L59"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"check_secret() matches a secrets-file line against the user/group name using strncmp(s, *ptr, len) where len is strlen(name), and then requires s[len]==':'. This means a secrets file entry whose name is a prefix is rejected correctly, but it does NOT guard against the supplied 'user' containing embedded characters that strtok already split. More importantly, for @group lines the code compares against 'group' which is the matched group name derived from getgrouplist; an attacker who can influence group membership resolution controls which secret line is selected. This is by-design but the prefix check uses the *file* token length implicitly via s[len] which is correct only because len==strlen(name); fine. Real issue: the loop sets *ptr=NULL after a password mismatch (line 162) to avoid re-checking, but only for the matched ptr; a later duplicate user line is then skipped, so a correct password on a second matching line is never tried.","fix":"Do not disable the name after a single mismatch if duplicate entries are legitimately supported, or document that only the first matching secrets line is honored.","locations":[{"ref":"authenticate.c:207-216","code":"  207 | \t\tif (!*ptr || strncmp(s, *ptr, len) != 0 || s[len] != ':')\n  208 | \t\t\tcontinue;\n  209 | \t\tgenerate_hash(s+len+1, challenge, pass2);\n  210 | \t\tif (strcmp(pass, pass2) == 0) {\n  211 | \t\t\terr = NULL;\n  212 | \t\t\tbreak;\n  213 | \t\t}\n  214 | \t\terr = \"password mismatch\";\n  215 | \t\t*ptr = NULL; /* Don't look for name again. */\n  216 | \t}","lines":10,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/authenticate.c#L207-L216"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"hard","description":"check_batch_flags() permanently mutates the static flag_ptr[] array based on protocol_version (sets flag_ptr[7] or flag_ptr[9] to NULL). This truncates the flag table for the rest of the process lifetime. write_stream_flags() and a subsequent call iterate flag_ptr until the first NULL, so if check_batch_flags() runs before a later write_stream_flags() (e.g. mixed read/write batch scenarios or repeated invocation), the higher-numbered flags (acls/xattrs/inplace/append) are silently dropped from the bitmap. The protocol-version gating mutates shared state instead of being applied per-call.","fix":"Do not overwrite flag_ptr entries; instead compute an effective flag count from protocol_version locally and bound the loop with it, leaving the static table intact.","locations":[{"ref":"batch.c:121-128","code":"  121 | void check_batch_flags(void)\n  122 | {\n  123 | \tint i;\n  124 | \n  125 | \tif (protocol_version < 29)\n  126 | \t\tflag_ptr[7] = NULL;\n  127 | \telse if (protocol_version < 30)\n  128 | \t\tflag_ptr[9] = NULL;","lines":8,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/batch.c#L121-L128"},{"ref":"batch.c:109-113","code":"  109 | \tfor (i = 0, flags = 0; flag_ptr[i]; i++) {\n  110 | \t\tif (*flag_ptr[i])\n  111 | \t\t\tflags |= 1 << i;\n  112 | \t}\n  113 | \twrite_int(fd, flags);","lines":5,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/batch.c#L109-L113"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In tweak_mode(), copy_bits is computed from `mode` BEFORE `mode &= ModeAND`, which is correct for the copy semantics, but the result is then applied AFTER the ModeOR step. For CHMOD_EQ with a copy source whose destination overlaps a 'topoct' special bit, ModeAND already cleared the special bits (per mode_dest_special_bits) and ModeOR re-added none, then copy_bits ORs in only the rwx triple (mode_copy_bits returns copy_dst*copy_bits, a 0-7 value shifted, never special bits). So setuid/setgid are never copied even with =u when the source has them. Verify this matches documented intent; the help text added in b88080bd says special bits are cleared, but copying e.g. `u=g` will not propagate the source's setgid even though one might expect symmetry.","fix":"If special bits should never be copied (current behavior), this is fine but should be documented near mode_copy_bits. If they should be, extend mode_copy_bits to optionally include S_ISUID/S_ISGID/S_ISVTX based on copy_src.","locations":[{"ref":"chmod.c:275-315","code":"  275 | static int mode_copy_bits(int mode, int copy_src, int copy_dst, int copy_and)\n  276 | {\n  277 | \tint copy_bits = 0;\n  278 | \n  279 | \tif (copy_src & 0100)\n  280 | \t\tcopy_bits |= (mode >> 6) & 7;\n  281 | \tif (copy_src & 0010)\n  282 | \t\tcopy_bits |= (mode >> 3) & 7;\n  283 | \tif (copy_src & 0001)\n  284 | \t\tcopy_bits |= mode & 7;\n  285 | \n  286 | \treturn (copy_dst * copy_bits) & copy_and;\n  287 | }\n  288 | \n  289 | \n  290 | /* Takes an existing file permission and a list of AND/OR changes, and\n  291 |  * create a new permissions. */\n  292 | int tweak_mode(int mode, struct chmod_mode_struct *chmod_modes)\n  293 | {\n  294 | \tint IsX = mode & 0111;\n  295 | \tint NonPerm = mode & ~CHMOD_BITS;\n  296 | \tint copy_bits;\n  297 | \n  298 | \tfor ( ; chmod_modes; chmod_modes = chmod_modes->next) {\n  299 | \t\tif ((chmod_modes->flags & FLAG_DIRS_ONLY) && !S_ISDIR(NonPerm))\n  300 | \t\t\tcontinue;\n  301 | \t\tif ((chmod_modes->flags & FLAG_FILES_ONLY) && S_ISDIR(NonPerm))\n  302 | \t\t\tcontinue;\n  303 | \t\tcopy_bits = mode_copy_bits(mode, chmod_modes->ModeCOPY_SRC,\n  304 | \t\t\t\t\t   chmod_modes->ModeCOPY_DST,\n  305 | \t\t\t\t\t   chmod_modes->ModeCOPY_AND);\n  306 | \t\tmode &= chmod_modes->ModeAND;\n  307 | \t\tif ((chmod_modes->flags & FLAG_X_KEEP) && !IsX && !S_ISDIR(NonPerm))\n  308 | \t\t\tmode |= chmod_modes->ModeOR & ~0111;\n  309 | \t\telse\n  310 | \t\t\tmode |= chmod_modes->ModeOR;\n  311 | \t\tif (chmod_modes->ModeOP == CHMOD_SUB)\n  312 | \t\t\tmode &= CHMOD_BITS - copy_bits;\n  313 | \t\telse\n  314 | \t\t\tmode |= copy_bits;\n  315 | \t}","lines":41,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/chmod.c#L275-L315"},{"ref":"chmod.c:112-119","code":"  112 | \t\t\tcase CHMOD_EQ:\n  113 | \t\t\t\tcurr_mode->ModeAND = CHMOD_BITS - (where * 7) - (topoct ? topbits : 0)\n  114 | \t\t\t\t\t\t    - (copybits ? mode_dest_special_bits(where) : 0);\n  115 | \t\t\t\tcurr_mode->ModeOR  = bits + topoct;\n  116 | \t\t\t\tcurr_mode->ModeCOPY_SRC = copybits;\n  117 | \t\t\t\tcurr_mode->ModeCOPY_DST = where;\n  118 | \t\t\t\tcurr_mode->ModeCOPY_AND = where_specified ? CHMOD_BITS : ~orig_umask;\n  119 | \t\t\t\tcurr_mode->ModeOP = op;","lines":8,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/chmod.c#L112-L119"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"close_all() (compiled only with SHUTDOWN_ALL_SOCKETS) iterates fds from sysconf(_SC_OPEN_MAX)-1 down to 0 and closes ALL of them, including stdin/stdout/stderr and the still-active control sockets. It is called from _exit_cleanup() and from sigusr2_handler() AFTER output_summary() but the receiver's sigusr2_handler path may still need stdout for the summary on some flows; more critically closing fd 0/1/2 unconditionally can interfere with a parent that shares them. Also do_fstat/is_a_socket/shutdown/close from a signal handler (sigusr2) are not all async-signal-safe.","fix":"Skip fds 0,1,2 (or only shutdown actual sockets and leave standard streams), and avoid the fstat/shutdown loop from the SIGUSR2 handler; restrict signal-context close_all to direct close() of known socket fds.","locations":[{"ref":"cleanup.c:51-68","code":"   51 | void close_all(void)\n   52 | {\n   53 | #ifdef SHUTDOWN_ALL_SOCKETS\n   54 | \tint max_fd;\n   55 | \tint fd;\n   56 | \tint ret;\n   57 | \tSTRUCT_STAT st;\n   58 | \n   59 | \tmax_fd = sysconf(_SC_OPEN_MAX) - 1;\n   60 | \tfor (fd = max_fd; fd >= 0; fd--) {\n   61 | \t\tif ((ret = do_fstat(fd, &st)) == 0) {\n   62 | \t\t\tif (is_a_socket(fd))\n   63 | \t\t\t\tret = shutdown(fd, 2);\n   64 | \t\t\tret = close(fd);\n   65 | \t\t}\n   66 | \t}\n   67 | #endif\n   68 | }","lines":18,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/cleanup.c#L51-L68"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In _exit_cleanup(), exit_line is set from the first call as `line < 0 ? -line : line`, but the later guard `if ((exit_code && line > 0) || ...)` and the MSG_ERROR_EXIT send use the CURRENT call's `line`, not the preserved first line. On a recursive cleanup the second entry's line value (which can differ in sign/meaning) drives whether log_exit and send_msg_int(MSG_ERROR_EXIT) run, so a recursive cleanup triggered after a MSG_ERROR_EXIT (line<0) vs a normal one can suppress or duplicate the error report inconsistently with the preserved exit info.","fix":"Decide the log/MSG_ERROR_EXIT behavior from a preserved first-call line (and its sign) rather than the current recursive call's line, or document why the current call's line is intentionally authoritative.","locations":[{"ref":"cleanup.c:113-117","code":"  113 | \tif (!exit_code) { /* Preserve first error exit info when recursing. */\n  114 | \t\texit_code = code;\n  115 | \t\texit_file = file;\n  116 | \t\texit_line = line < 0 ? -line : line;\n  117 | \t}","lines":5,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/cleanup.c#L113-L117"},{"ref":"cleanup.c:221-251","code":"  221 | \t\t/* If line < 0, this exit is after a MSG_ERROR_EXIT event, so\n  222 | \t\t * we don't want to output a duplicate error. */\n  223 | \t\tif ((exit_code && line > 0)\n  224 | \t\t || am_daemon || (logfile_name && (am_server || !INFO_GTE(STATS, 1)))) {\n  225 | \t\t\tlog_exit(exit_code, exit_file, exit_line);\n  226 | \t\t}\n  227 | \n  228 | #include \"case_N.h\"\n  229 | \t\tswitch_step++;\n  230 | \n  231 | \t\tif (DEBUG_GTE(EXIT, 1)) {\n  232 | \t\t\trprintf(FINFO,\n  233 | \t\t\t\t\"[%s] _exit_cleanup(code=%d, file=%s, line=%d): \"\n  234 | \t\t\t\t\"about to call exit(%d)%s\\n\",\n  235 | \t\t\t\twho_am_i(), first_code, exit_file, exit_line, exit_code,\n  236 | \t\t\t\tdry_run ? \" (DRY RUN)\" : \"\");\n  237 | \t\t}\n  238 | \n  239 | #include \"case_N.h\"\n  240 | \t\tswitch_step++;\n  241 | \n  242 | \t\tif (exit_code && exit_code != RERR_SOCKETIO && exit_code != RERR_STREAMIO && exit_code != RERR_SIGNAL1\n  243 | \t\t && exit_code != RERR_TIMEOUT && !shutting_down) {\n  244 | \t\t\tif (protocol_version >= 31 || am_receiver) {\n  245 | \t\t\t\tif (line > 0) {\n  246 | \t\t\t\t\tif (DEBUG_GTE(EXIT, 3)) {\n  247 | \t\t\t\t\t\trprintf(FINFO, \"[%s] sending MSG_ERROR_EXIT with exit_code %d\\n\",\n  248 | \t\t\t\t\t\t\twho_am_i(), exit_code);\n  249 | \t\t\t\t\t}\n  250 | \t\t\t\t\tsend_msg_int(MSG_ERROR_EXIT, exit_code);\n  251 | \t\t\t\t}","lines":31,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/cleanup.c#L221-L251"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"read_proxy_protocol_header() computes 'size' from two unsigned-char length bytes (0..65535) then reads exactly 'size' bytes into hdr after a bounds check 'size + PROXY_V2_HEADER_SIZE > sizeof hdr'. For an unsupported family (default case) it discards the data and returns 1 (accept), leaving ipaddr_buf unset so the real socket peer is used - acceptable. But for CMD_PROXY with a recognized family where 'size' is larger than the fixed ip4/ip6 struct, it requires exact equality (size != sizeof ...) and returns 0; the spec allows trailing TLV bytes after the address block, so legitimate proxy v2 headers carrying TLVs are rejected.","fix":"Accept size >= sizeof(addr struct) for the matched family (the extra bytes are TLVs already consumed by the read_buf at line 207) rather than requiring exact equality.","locations":[{"ref":"clientname.c:201-223","code":"  201 | \t\tsize = (hdr.v2.len[0] << 8) + hdr.v2.len[1];\n  202 | \n  203 | \t\tif (ver != 2 || size + PROXY_V2_HEADER_SIZE > (int)sizeof hdr)\n  204 | \t\t\treturn 0;\n  205 | \n  206 | \t\t/* Grab all the remaining data in the binary request. */\n  207 | \t\tread_buf(fd, (char*)&hdr + PROXY_V2_HEADER_SIZE, size);\n  208 | \n  209 | \t\tswitch (cmd) {\n  210 | \t\tcase CMD_PROXY:\n  211 | \t\t\tswitch (hdr.v2.fam) {\n  212 | \t\t\tcase PROXY_FAM_TCPv4:\n  213 | \t\t\t\tif (size != sizeof hdr.v2.addr.ip4)\n  214 | \t\t\t\t\treturn 0;\n  215 | \t\t\t\tinet_ntop(AF_INET, hdr.v2.addr.ip4.src_addr, ipaddr_buf, sizeof ipaddr_buf);\n  216 | \t\t\t\treturn valid_ipaddr(ipaddr_buf, False);\n  217 | #ifdef INET6\n  218 | \t\t\tcase PROXY_FAM_TCPv6:\n  219 | \t\t\t\tif (size != sizeof hdr.v2.addr.ip6)\n  220 | \t\t\t\t\treturn 0;\n  221 | \t\t\t\tinet_ntop(AF_INET6, hdr.v2.addr.ip6.src_addr, ipaddr_buf, sizeof ipaddr_buf);\n  222 | \t\t\t\treturn valid_ipaddr(ipaddr_buf, False);\n  223 | #endif","lines":23,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/clientname.c#L201-L223"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"valid_ipaddr() IPv6 parsing: the loop allows at most 8 groups (count<8) but the embedded-IPv4 tail handling and '::' accounting can accept some malformed addresses. Specifically at line 502 it reads up to 4 hex digits by chained isHexDigit(++s) calls; a 5th hex digit triggers return 0, but a group like ':::' double-colon detection at 508-513 only rejects a second '::' and does not bound the total number of groups when a '::' compressed run is present together with a trailing IPv4, where the count check (line 494) uses fixed magic numbers (6) that are off for scope-id cases. This is a validator-permissiveness issue: it may accept some strings that are not strictly valid IPv6, which are then passed to getaddrinfo/inet_pton downstream (those will reject), so impact is limited to weaker pre-validation.","fix":"Prefer delegating final validation to inet_pton(AF_INET6, ...) for the non-scope case rather than the hand-rolled group counter, or add explicit bounds tests for the compressed+IPv4 combination.","locations":[{"ref":"clientname.c:484-521","code":"  484 | \t\tfor (count = 0; count < 8; count++) {\n  485 | \t\t\tif (!*s)\n  486 | \t\t\t\treturn saw_double_colon;\n  487 | \t\t\tif (allow_scope && *s == '%') {\n  488 | \t\t\t\tif (saw_double_colon)\n  489 | \t\t\t\t\tbreak;\n  490 | \t\t\t\treturn 0;\n  491 | \t\t\t}\n  492 | \n  493 | \t\t\tif (strchr(s, ':') == NULL && strchr(s, '.') != NULL) {\n  494 | \t\t\t\tif ((!saw_double_colon && count != 6) || (saw_double_colon && count > 6))\n  495 | \t\t\t\t\treturn 0;\n  496 | \t\t\t\tipv4_at_end = 1;\n  497 | \t\t\t\tbreak;\n  498 | \t\t\t}\n  499 | \n  500 | \t\t\tif (!isHexDigit(s++)) /* Need 1-4 hex digits */\n  501 | \t\t\t\treturn 0;\n  502 | \t\t\tif (isHexDigit(s) && isHexDigit(++s) && isHexDigit(++s) && isHexDigit(++s))\n  503 | \t\t\t\treturn 0;\n  504 | \n  505 | \t\t\tif (*s == ':') {\n  506 | \t\t\t\tif (!*++s)\n  507 | \t\t\t\t\treturn 0;\n  508 | \t\t\t\tif (*s == ':') {\n  509 | \t\t\t\t\tif (saw_double_colon)\n  510 | \t\t\t\t\t\treturn 0;\n  511 | \t\t\t\t\tsaw_double_colon = 1;\n  512 | \t\t\t\t\ts++;\n  513 | \t\t\t\t}\n  514 | \t\t\t}\n  515 | \t\t}\n  516 | \n  517 | \t\tif (!ipv4_at_end) {\n  518 | \t\t\tif (allow_scope && *s == '%')\n  519 | \t\t\t\tfor (s++; isAlNum(s); s++) { }\n  520 | \t\t\treturn !*s && s[-1] != '%';\n  521 | \t\t}","lines":38,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/clientname.c#L484-L521"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"claim_connection() is called (line 746) and on success takes a slot, but several subsequent error returns (invalid uid/gid, no path, chroot failures, exec-prep failures, etc., lines 760-1009) return -1 without an explicit connection-release. rsync relies on process exit / lock-file fd close to release the slot, but rsync_module() returns -1 to its caller (start_daemon) rather than exiting, so the lock fd opened by claim_connection may remain held in this process until exit_cleanup runs elsewhere. Verify the lock is released on every -1 return after a successful claim.","fix":"Ensure the connection lock is released (or the process exits) on all error paths after claim_connection() succeeds.","locations":[{"ref":"clientserver.c:791-803","code":"  791 | \tif (!claim_connection(lp_lock_file(i), lp_max_connections(i))) {\n  792 | \t\tif (errno) {\n  793 | \t\t\trsyserr(FLOG, errno, \"failed to open lock file %s\",\n  794 | \t\t\t\tlp_lock_file(i));\n  795 | \t\t\tio_printf(f_out, \"@ERROR: failed to open lock file\\n\");\n  796 | \t\t} else {\n  797 | \t\t\trprintf(FLOG, \"max connections (%d) reached\\n\",\n  798 | \t\t\t\tlp_max_connections(i));\n  799 | \t\t\tio_printf(f_out, \"@ERROR: max connections (%d) reached -- try again later\\n\",\n  800 | \t\t\t\tlp_max_connections(i));\n  801 | \t\t}\n  802 | \t\treturn -1;\n  803 | \t}","lines":13,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/clientserver.c#L791-L803"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"hard","description":"negotiate_daemon_auth() permanently mutates the shared global table entry valid_auth_checksums_items[] (negotiated_nni->num and ->flags) to downgrade CSUM_MD4 to CSUM_MD4_OLD when talking to an old peer. Because negotiated_nni points into the global static list (or its main_nni), the change persists in the table after negotiation. In a daemon that handles auth for the same in-process table more than once this leaves the md4 entry stuck as CSUM_MD4_OLD with flags cleared, which would alter a subsequent negotiation. It works today only because each connection re-execs / the entry is not re-evaluated, an implicit and fragile assumption.","fix":"Apply the md4-is-old downgrade to a copy used for this connection, or reset the mutated num/flags after use, rather than editing the shared valid_auth_checksums_items entry in place.","locations":[{"ref":"compat.c:890-893","code":"  890 | \tif (md4_is_old && valid_auth_checksums.negotiated_nni->num == CSUM_MD4) {\n  891 | \t\tvalid_auth_checksums.negotiated_nni->num = CSUM_MD4_OLD;\n  892 | \t\tvalid_auth_checksums.negotiated_nni->flags = 0;\n  893 | \t}","lines":4,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/compat.c#L890-L893"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"teardown_mergelist() reports the wrong mergelist index in its debug message and uses a fragile deactivation scheme. The debug message prints `mergelist_cnt - 1` as the deactivated index, but the actual entry being removed is found by scanning mergelist_parents[] for the matching `ex` pointer, which may be at any index, not necessarily the last one. The message is therefore misleading whenever the freed rule is not the final mergelist.","fix":"Find the matching index first (the `j` from the scan loop) and use it in the debug message instead of `mergelist_cnt - 1`.","locations":[{"ref":"exclude.c:220-236","code":"  220 | \tif (DEBUG_GTE(FILTER, 2)) {\n  221 | \t\trprintf(FINFO, \"[%s] deactivating mergelist #%d%s\\n\",\n  222 | \t\t\twho_am_i(), mergelist_cnt - 1,\n  223 | \t\t\tex->u.mergelist->debug_type);\n  224 | \t}\n  225 | \n  226 | \tfree(ex->u.mergelist->debug_type);\n  227 | \tfree(ex->u.mergelist);\n  228 | \n  229 | \tfor (j = 0; j < mergelist_cnt; j++) {\n  230 | \t\tif (mergelist_parents[j] == ex) {\n  231 | \t\t\tmergelist_parents[j] = NULL;\n  232 | \t\t\tbreak;\n  233 | \t\t}\n  234 | \t}\n  235 | \twhile (mergelist_cnt && mergelist_parents[mergelist_cnt-1] == NULL)\n  236 | \t\tmergelist_cnt--;","lines":17,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/exclude.c#L220-L236"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"implied_include_partial_string() / free_implied_include_partial_string() use module-global statics (partial_string_buf, partial_string_len) to stitch a split argument across two calls. This is stateful and not reentrant: if add_implied_include() is entered while partial_string_len is set but the second half never arrives in the expected order, the stale partial buffer is prepended to an unrelated argument, corrupting the implied include. There is no validation that the second call corresponds to the same logical argument.","fix":"Document the strict call-ordering contract, and assert it (or pass the partial state explicitly) so misuse fails loudly instead of silently corrupting a pattern.","locations":[{"ref":"exclude.c:449-493","code":"  449 | static char *partial_string_buf = NULL;\n  450 | static int partial_string_len = 0;\n  451 | void implied_include_partial_string(const char *s_start, const char *s_end)\n  452 | {\n  453 | \tpartial_string_len = s_end - s_start;\n  454 | \tif (partial_string_len <= 0 || partial_string_len >= MAXPATHLEN) { /* too-large should be impossible... */\n  455 | \t\tpartial_string_len = 0;\n  456 | \t\treturn;\n  457 | \t}\n  458 | \tif (!partial_string_buf)\n  459 | \t\tpartial_string_buf = new_array(char, MAXPATHLEN);\n  460 | \tmemcpy(partial_string_buf, s_start, partial_string_len);\n  461 | }\n  462 | \n  463 | void free_implied_include_partial_string()\n  464 | {\n  465 | \tif (partial_string_buf) {\n  466 | \t\tif (partial_string_len)\n  467 | \t\t\tadd_implied_include(\"\", 0);\n  468 | \t\tfree(partial_string_buf);\n  469 | \t\tpartial_string_buf = NULL;\n  470 | \t}\n  471 | \tpartial_string_len = 0; /* paranoia */\n  472 | }\n  473 | \n  474 | /* Each arg the client sends to the remote sender turns into an implied include\n  475 |  * that the receiver uses to validate the file list from the sender. */\n  476 | void add_implied_include(const char *arg, int skip_daemon_module)\n  477 | {\n  478 | \tint arg_len, saw_wild = 0, saw_live_open_brkt = 0, backslash_cnt = 0;\n  479 | \tint slash_cnt = 0;\n  480 | \tconst char *cp;\n  481 | \tchar *p;\n  482 | \tif (trust_sender_args)\n  483 | \t\treturn;\n  484 | \tif (partial_string_len) {\n  485 | \t\targ_len = strlen(arg);\n  486 | \t\tif (partial_string_len + arg_len >= MAXPATHLEN) {\n  487 | \t\t\tpartial_string_len = 0;\n  488 | \t\t\treturn; /* Should be impossible... */\n  489 | \t\t}\n  490 | \t\tmemcpy(partial_string_buf + partial_string_len, arg, arg_len + 1);\n  491 | \t\tpartial_string_len = 0;\n  492 | \t\targ = partial_string_buf;\n  493 | \t}","lines":45,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/exclude.c#L449-L493"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"change_local_filter_dir() uses a static array `filt_array[MAXPATHLEN/2+1]` indexed by dir_depth and asserts `dir_depth < MAXPATHLEN/2+1`. The assert is a hard abort (not graceful error handling) and is compiled out under NDEBUG, in which case an out-of-range dir_depth writes past the static array (stack/global overflow) at line 900.","fix":"Replace assert() with a real bounds check that errors out cleanly (exit_cleanup) so it is effective even with NDEBUG.","locations":[{"ref":"exclude.c:974-1000","code":"  974 | void change_local_filter_dir(const char *dname, int dlen, int dir_depth)\n  975 | {\n  976 | \tstatic int cur_depth = -1;\n  977 | \tstatic void *filt_array[MAXPATHLEN/2+1];\n  978 | \n  979 | \tif (!dname) {\n  980 | \t\tfor ( ; cur_depth >= 0; cur_depth--) {\n  981 | \t\t\tif (filt_array[cur_depth]) {\n  982 | \t\t\t\tpop_local_filters(filt_array[cur_depth]);\n  983 | \t\t\t\tfilt_array[cur_depth] = NULL;\n  984 | \t\t\t}\n  985 | \t\t}\n  986 | \t\treturn;\n  987 | \t}\n  988 | \n  989 | \tassert(dir_depth < MAXPATHLEN/2+1);\n  990 | \n  991 | \tfor ( ; cur_depth >= dir_depth; cur_depth--) {\n  992 | \t\tif (filt_array[cur_depth]) {\n  993 | \t\t\tpop_local_filters(filt_array[cur_depth]);\n  994 | \t\t\tfilt_array[cur_depth] = NULL;\n  995 | \t\t}\n  996 | \t}\n  997 | \n  998 | \tcur_depth = dir_depth;\n  999 | \tfilt_array[cur_depth] = push_local_filters(dname, dlen);\n 1000 | }","lines":27,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/exclude.c#L974-L1000"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"rule_strcmp() returns `str + rule_len - 1` on a successful whitespace/underscore/NUL match (so the caller's `*++s` re-reads the last keyword char as the modifier separator), but returns `str + rule_len` (no -1) for the ',' case. This off-by-one asymmetry is intentional but extremely subtle and undocumented; a future edit to the keyword-dispatch switch that assumes a uniform return offset will silently mis-parse modifiers.","fix":"Add a comment explaining why the ',' branch differs by one from the whitespace/NUL branch, or normalize the return and adjust callers.","locations":[{"ref":"exclude.c:1218-1227","code":" 1218 | static const uchar *rule_strcmp(const uchar *str, const char *rule, int rule_len)\n 1219 | {\n 1220 | \tif (strncmp((char*)str, rule, rule_len) != 0)\n 1221 | \t\treturn NULL;\n 1222 | \tif (isspace(str[rule_len]) || str[rule_len] == '_' || !str[rule_len])\n 1223 | \t\treturn str + rule_len - 1;\n 1224 | \tif (str[rule_len] == ',')\n 1225 | \t\treturn str + rule_len;\n 1226 | \treturn NULL;\n 1227 | }","lines":10,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/exclude.c#L1218-L1227"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In parse_filter_str(), the merge-file default name handling sets `pat = \".cvsignore\"; pat_len = 10;`. The literal is correct length (10), but `pat` now points to a string literal while the surrounding code elsewhere assumes `pat` points into the mutable rulestr buffer. It is passed to add_rule()/parse_filter_file() which treat it as read-only, so it works, but the hard-coded magic length 10 will silently break if the default name string is ever edited.","fix":"Use `pat_len = strlen(pat);` instead of the hard-coded 10 to avoid a desync if the literal changes.","locations":[{"ref":"exclude.c:1554-1557","code":" 1554 | \t\t\tif (!pat_len) {\n 1555 | \t\t\t\tpat = \".cvsignore\";\n 1556 | \t\t\t\tpat_len = 10;\n 1557 | \t\t\t}","lines":4,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/exclude.c#L1554-L1557"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In send_rules(), the elide computation for RECEIVER_SIDE uses `elide = elide ? 0 : ...`. If a rule somehow has BOTH FILTRULE_SENDER_SIDE and FILTRULE_RECEIVER_SIDE set (the parser tries to forbid this but template inheritance at parse_rule_tok lines 1293-1303 can combine sides), the sender-side branch sets elide, then the receiver-side branch resets it to 0, silently un-eliding a rule that should have been side-restricted. The `else if (delete_excluded...)` is then skipped entirely.","fix":"Assert that SENDER_SIDE and RECEIVER_SIDE are mutually exclusive before this block, or handle the both-set case explicitly.","locations":[{"ref":"exclude.c:1904-1911","code":" 1904 | \t\tif (ent->rflags & FILTRULE_SENDER_SIDE)\n 1905 | \t\t\telide = am_sender ? LOCAL_RULE : REMOTE_RULE;\n 1906 | \t\tif (ent->rflags & FILTRULE_RECEIVER_SIDE)\n 1907 | \t\t\telide = elide ? 0 : am_sender ? REMOTE_RULE : LOCAL_RULE;\n 1908 | \t\telse if (delete_excluded && !elide\n 1909 | \t\t && (!(ent->rflags & FILTRULE_PERDIR_MERGE)\n 1910 | \t\t  || ent->rflags & FILTRULE_NO_PREFIXES))\n 1911 | \t\t\telide = am_sender ? LOCAL_RULE : REMOTE_RULE;","lines":8,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/exclude.c#L1904-L1911"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"recv_file_entry() declares 'real_ISREG_entry' and 'linkname_len' without initialization. They are set on both the normal path and the 'goto create_object' hard-link-first path, so today every path assigns them, but the control flow is fragile: a future edit adding an early goto to create_object (or another branch) would read uninitialized values driving allocation size (linkname_len) and checksum/regular-file handling (real_ISREG_entry).","fix":"Initialize 'real_ISREG_entry = 0' and 'linkname_len = 0' at declaration to make the data-from-network handling robust against future control-flow changes.","locations":[{"ref":"flist.c:798-801","code":"  798 | \tint alloc_len, basename_len, linkname_len;\n  799 | \tint extra_len = file_extra_cnt * EXTRA_LEN;\n  800 | \tint first_hlink_ndx = -1;\n  801 | \tchar real_ISREG_entry;","lines":4,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/flist.c#L798-L801"},{"ref":"flist.c:1091-1093","code":" 1091 | \t\treal_ISREG_entry = 0;\n 1092 | \t} else\n 1093 | \t\treal_ISREG_entry = S_ISREG(mode) ? 1 : 0;","lines":3,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/flist.c#L1091-L1093"}]},
{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"recv_file_entry trusts 'l1' (XMIT_SAME_NAME byte) and copies l1 bytes of the previous name via strlcpy(thisname, lastname, l1+1). The overflow guard only checks 'l2 >= MAXPATHLEN - l1'. If a malicious sender sets l1 to a value larger than the actual length of lastname, strlcpy stops at lastname's NUL (safe), but thisname[l1+l2] is then written using the attacker's l1, and basename_len handling downstream assumes l1 reflects real shared prefix length. The end result is a thisname whose effective length differs from l1+l2 assumptions; combined with the SAME_NAME logic this can desynchronize subsequent name decoding.","fix":"Validate that l1 <= strlen(lastname) before using it as a shared-prefix length, rejecting the entry as a protocol error otherwise.","locations":[{"ref":"flist.c:811-828","code":"  811 | \tif (xflags & XMIT_SAME_NAME)\n  812 | \t\tl1 = read_byte(f);\n  813 | \n  814 | \tif (xflags & XMIT_LONG_NAME)\n  815 | \t\tl2 = read_varint30(f);\n  816 | \telse\n  817 | \t\tl2 = read_byte(f);\n  818 | \n  819 | \tif (l2 >= MAXPATHLEN - l1) {\n  820 | \t\trprintf(FERROR,\n  821 | \t\t\t\"overflow: xflags=0x%x l1=%d l2=%d lastname=%s [%s]\\n\",\n  822 | \t\t\txflags, l1, l2, lastname, who_am_i());\n  823 | \t\toverflow_exit(\"recv_file_entry\");\n  824 | \t}\n  825 | \n  826 | \tstrlcpy(thisname, lastname, l1 + 1);\n  827 | \tread_sbuf(f, &thisname[l1], l2);\n  828 | \tthisname[l1 + l2] = 0;","lines":18,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/flist.c#L811-L828"}]},
{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"check_for_finished_files toggles a set of mode flags by negation (ignore_existing = -ignore_existing; ignore_non_existing; update_only; always_checksum; size_only; append_mode; make_backups) around the redo recv_generator call and negates them back afterward. This relies on every one of these being either 0 or strictly positive so that double-negation restores them, and on no nested redo occurring. If any of these variables can legitimately hold a value that is already negative on entry (e.g. as a sentinel) the restore is wrong, and the pattern is fragile and easy to break when adding a new option that is checked elsewhere as '> 0'.","fix":"Save the original values into locals and restore them explicitly instead of relying on sign negation; this is clearer and robust against negative sentinels and future additions.","locations":[{"ref":"generator.c:2647-2688","code":" 2647 | \t\tif (check_redo && (ndx = get_redo_num()) != -1) {\n 2648 | \t\t\tOFF_T save_max_size = max_size;\n 2649 | \t\t\tOFF_T save_min_size = min_size;\n 2650 | \t\t\tcsum_length = SUM_LENGTH;\n 2651 | \t\t\tmax_size = -1;\n 2652 | \t\t\tmin_size = -1;\n 2653 | \t\t\tignore_existing = -ignore_existing;\n 2654 | \t\t\tignore_non_existing = -ignore_non_existing;\n 2655 | \t\t\tupdate_only = -update_only;\n 2656 | \t\t\talways_checksum = -always_checksum;\n 2657 | \t\t\tsize_only = -size_only;\n 2658 | \t\t\tappend_mode = -append_mode;\n 2659 | \t\t\tmake_backups = -make_backups; /* avoid dup backup w/inplace */\n 2660 | \t\t\tignore_times++;\n 2661 | \n 2662 | \t\t\tflist = cur_flist;\n 2663 | \t\t\tcur_flist = flist_for_ndx(ndx, \"check_for_finished_files.2\");\n 2664 | \t\t\tif (ndx < cur_flist->ndx_start)\n 2665 | \t\t\t\texit_cleanup(RERR_PROTOCOL);\n 2666 | \n 2667 | \t\t\tfile = cur_flist->files[ndx - cur_flist->ndx_start];\n 2668 | \t\t\tif (solo_file)\n 2669 | \t\t\t\tstrlcpy(fbuf, solo_file, sizeof fbuf);\n 2670 | \t\t\telse\n 2671 | \t\t\t\tf_name(file, fbuf);\n 2672 | \t\t\trecv_generator(fbuf, file, ndx, itemizing, code, sock_f_out);\n 2673 | \t\t\tcur_flist->to_redo--;\n 2674 | \n 2675 | \t\t\tcur_flist = flist;\n 2676 | \n 2677 | \t\t\tcsum_length = SHORT_SUM_LENGTH;\n 2678 | \t\t\tmax_size = save_max_size;\n 2679 | \t\t\tmin_size = save_min_size;\n 2680 | \t\t\tignore_existing = -ignore_existing;\n 2681 | \t\t\tignore_non_existing = -ignore_non_existing;\n 2682 | \t\t\tupdate_only = -update_only;\n 2683 | \t\t\talways_checksum = -always_checksum;\n 2684 | \t\t\tsize_only = -size_only;\n 2685 | \t\t\tappend_mode = -append_mode;\n 2686 | \t\t\tmake_backups = -make_backups;\n 2687 | \t\t\tignore_times--;\n 2688 | \t\t\tcontinue;","lines":42,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/generator.c#L2647-L2688"}]},
{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"read_varlong() reads `min_bytes` bytes into b2 then copies `min_bytes-1` bytes via `memcpy(u.b, b2+1, min_bytes-1)`. If a caller passes min_bytes == 0, `read_buf(f, b2, 0)` is a no-op but `memcpy(u.b, b2+1, (size_t)-1)` underflows to SIZE_MAX, a massive out-of-bounds copy. There is no guard that min_bytes >= 1. All in-tree callers pass >=1, but the function is a public wire-decoding primitive with no defensive check.","fix":"Assert or validate min_bytes >= 1 at function entry, or compute the copy length as min_bytes ? min_bytes-1 : 0.","locations":[{"ref":"io.c:2044-2059","code":" 2044 | int64 read_varlong(int f, uchar min_bytes)\n 2045 | {\n 2046 | \tunion {\n 2047 | \t\tchar b[9];\n 2048 | \t\tint64 x;\n 2049 | \t} u;\n 2050 | \tchar b2[8];\n 2051 | \tint extra;\n 2052 | \n 2053 | #if SIZEOF_INT64 < 8\n 2054 | \tmemset(u.b, 0, 8);\n 2055 | #else\n 2056 | \tu.x = 0;\n 2057 | #endif\n 2058 | \tread_buf(f, b2, min_bytes);\n 2059 | \tmemcpy(u.b, b2+1, min_bytes-1);","lines":16,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/io.c#L2044-L2059"}]},
{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"read_sbuf() writes the NUL terminator at buf[len] but read_buf() was asked to fill exactly len bytes, so the caller must allocate len+1. This contract is implicit and undocumented; several callers historically size buffers to the exact field length. Similarly read_vstring() writes buf[len]='\\0' after checking `len >= bufsize` (so buf[len] with len==bufsize-1 is the last slot - OK), but read_sbuf has no such bounds check at all and will happily write one past a len-sized buffer.","fix":"Document the +1 requirement at read_sbuf() (and audit callers), or add a bufsiz parameter so the terminator write can be bounds-checked like read_vstring().","locations":[{"ref":"io.c:2187-2191","code":" 2187 | void read_sbuf(int f, char *buf, size_t len)\n 2188 | {\n 2189 | \tread_buf(f, buf, len);\n 2190 | \tbuf[len] = '\\0';\n 2191 | }","lines":5,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/io.c#L2187-L2191"}]},
{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"permstring() requires an 11-char buffer (per the comment) and does strlcpy(perms, \"----------\", 11) writing 10 chars + NUL. It then indexes perms[0..9]. The comment says buffer must be 'at least 11 characters' which matches, but the literal is only 10 dashes; perms[10] is the NUL. Callers passing exactly 11 are fine. The risk is the off-by-one mental model: there are 10 visible chars (type + 9 perms) so any caller that allocated 10 (counting only visible) would overflow. Worth verifying all call sites pass >= 11.","fix":"Audit callers of permstring() to ensure the buffer is >= 11 bytes; consider taking a buffer length parameter or using a fixed-size typedef to make the contract enforceable.","locations":[{"ref":"lib/permstring.c:27-32","code":"   27 | void permstring(char *perms, mode_t mode)\n   28 | {\n   29 | \tstatic const char *perm_map = \"rwxrwxrwx\";\n   30 | \tint i;\n   31 | \n   32 | \tstrlcpy(perms, \"----------\", 11);","lines":6,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/lib/permstring.c#L27-L32"}]},
{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"wildmatch '[' character-class range handling: when a '-' range is encountered (p_ch=='-' && prev_ch && p[1] && p[1]!=']'), it tests `t_ch <= p_ch && t_ch >= prev_ch`. Because t_ch and the class chars are uchar but comparisons are int-promoted, this is fine for 8-bit, but if force_lower_case is active t_ch has been lowercased while prev_ch/p_ch (the pattern range bounds) are NOT lowercased. So `iwildmatch` with a pattern like `[A-Z]` against an uppercase input lowercases the input to e.g. 'a' and then compares against 'A'..'Z', failing the match, whereas a literal uppercase letter compared in the default/'==' branch would also fail - i.e. case-insensitive class matching is inconsistent with case-insensitive literal matching.","fix":"When force_lower_case is set, also lowercase the class range bounds (and single class chars) before comparing, so [A-Z] behaves consistently under iwildmatch.","locations":[{"ref":"lib/wildmatch.c:83-84","code":"   83 | \tif (force_lower_case && ISUPPER(t_ch))\n   84 | \t    t_ch = tolower(t_ch);","lines":2,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/lib/wildmatch.c#L83-L84"}]},
{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"log_formatted() copies the format into buf with strlcpy then appends '\\n' at buf[total++] and NUL at buf[total]. total is strlcpy's return = length of the *source* format, which on truncation is the would-have-been length, NOT the bytes actually copied. The guard 'if (total > MAXPATHLEN)' exits, but buf is sizeof = MAXPATHLEN+1024, so a format between MAXPATHLEN and the real buffer size passes the guard while total reflects the untruncated source length, making buf[total++]='\\n' and buf[total]='\\0' write past the actually-copied data position (using a stale/over-long total) - the '\\n' and NUL land at the source length offset, which may exceed what strlcpy wrote and read uninitialized buffer between.","fix":"Use the actual copied length: total = strlen(buf) after strlcpy (or MIN(total, sizeof buf - 2)) before appending '\\n'.","locations":[{"ref":"log.c:550-556","code":"  550 | \ttotal = strlcpy(buf, format, sizeof buf);\n  551 | \tif (total > MAXPATHLEN) {\n  552 | \t\trprintf(FERROR, \"log-format string is WAY too long!\\n\");\n  553 | \t\texit_cleanup(RERR_MESSAGEIO);\n  554 | \t}\n  555 | \tbuf[total++] = '\\n';\n  556 | \tbuf[total] = '\\0';","lines":7,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/log.c#L550-L556"}]},
{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In become_copy_as_user() the privilege-drop sequence calls setuid(uid) and then seteuid(uid) joined by ||, so seteuid() runs only if setuid() FAILS (returns <0). For a process that is not full root but has only the effective uid set, or on systems where setuid() does not also clear saved-uid, the intended belt-and-suspenders seteuid() is never executed when setuid() succeeds, leaving a recoverable saved-set-user-ID. The redundant call is effectively dead in the success path.","fix":"Call setuid(uid) and check it; then separately call seteuid(uid) and check it (do not chain with ||). Verify the resulting ruid/euid via getresuid/MY_UID before proceeding.","locations":[{"ref":"main.c:304-311","code":"  304 | \tif (setuid(uid) < 0\n  305 | #ifdef HAVE_SETEUID\n  306 | \t || seteuid(uid) < 0\n  307 | #endif\n  308 | \t) {\n  309 | \t\trsyserr(FERROR, errno, \"setuid failed\");\n  310 | \t\texit_cleanup(RERR_SYNTAX);\n  311 | \t}","lines":8,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/main.c#L304-L311"}]},
{"id":"LOGIC_33","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"hard","description":"do_recv() unconditionally resets copy_links = copy_dirlinks = copy_unsafe_links = 0 for the receiving side. This is intended per the comment, but it mutates global option state that is also consulted by the generator process which continues running in the SAME function after the fork (am_generator branch). Any later code (or a future generator path) that reads these globals will see them cleared even though the user requested them, a subtle cross-process coupling.","fix":"Confirm the generator never needs copy_links/copy_dirlinks/copy_unsafe_links after this point; if it might, scope the reset to the receiver child (after the fork, pid==0 branch) instead of before the fork.","locations":[{"ref":"main.c:1013-1021","code":" 1013 | static int do_recv(int f_in, int f_out, char *local_name)\n 1014 | {\n 1015 | \tint pid;\n 1016 | \tint exit_code = 0;\n 1017 | \tint error_pipe[2];\n 1018 | \n 1019 | \t/* The receiving side mustn't obey this, or an existing symlink that\n 1020 | \t * points to an identical file won't be replaced by the referent. */\n 1021 | \tcopy_links = copy_dirlinks = copy_unsafe_links = 0;","lines":9,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/main.c#L1013-L1021"},{"ref":"main.c:1134-1159","code":" 1134 | \tam_generator = 1;\n 1135 | \timplied_filter_list.head = implied_filter_list.tail = NULL;\n 1136 | \tflist_receiving_enabled = True;\n 1137 | \n 1138 | \tio_end_multiplex_in(MPLX_SWITCHING);\n 1139 | \tif (write_batch && !am_server)\n 1140 | \t\tstop_write_batch();\n 1141 | \n 1142 | \tclose(error_pipe[1]);\n 1143 | \tif (f_in != f_out)\n 1144 | \t\tclose(f_in);\n 1145 | \tsock_f_in = -1;\n 1146 | \tf_in = error_pipe[0];\n 1147 | \n 1148 | \tio_start_buffering_out(f_out);\n 1149 | \tio_start_multiplex_in(f_in);\n 1150 | \n 1151 | #ifdef SUPPORT_HARD_LINKS\n 1152 | \tif (preserve_hard_links && inc_recurse) {\n 1153 | \t\tstruct file_list *flist;\n 1154 | \t\tfor (flist = first_flist; flist; flist = flist->next)\n 1155 | \t\t\tmatch_hard_links(flist);\n 1156 | \t}\n 1157 | #endif\n 1158 | \n 1159 | \tgenerate_files(f_out, local_name);","lines":26,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/main.c#L1134-L1159"}]},
{"id":"LOGIC_34","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"basis_dir entries from --compare-dest/--copy-dest/--link-dest are stored as raw popt-owned pointers (poptGetOptArg) and parse_arguments later calls poptDupArgv + poptFreeContext at line 2104, freeing the popt context. With popt 1.19 (which the code explicitly notes started freeing returned data), the basis_dir[] pointers can become dangling after poptFreeContext, since only the positional argv is duplicated, not option-arg strings. The args[] strings consumed via safe_arg(basis_dir[i]) in server_options run after the context is freed.","fix":"strdup() the basis_dir argument when storing it (as is done for other retained option args), so it survives poptFreeContext.","locations":[{"ref":"options.c:1870","code":" 1870 | \t\t\tbasis_dir[basis_dir_cnt++] = (char *)poptGetOptArg(pc);","lines":1,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/options.c#L1870"},{"ref":"options.c:2216-2231","code":" 2216 | \t\tpoptFreeContext(pc);\n 2217 | \t\treturn 1;\n 2218 | \t}\n 2219 | \n 2220 | \t/* Because popt 1.19 has started to free the returned args data, we now\n 2221 | \t * make a copy of the array and then do an immediate cleanup. */\n 2222 | \targv = poptGetArgs(pc);\n 2223 | \targc = count_args(argv);\n 2224 | \tif (!argc) {\n 2225 | \t\t*argv_p = empty_argv;\n 2226 | \t\t*argc_p = 0;\n 2227 | \t} else if (poptDupArgv(argc, argv, argc_p, argv_p) != 0)\n 2228 | \t\tout_of_memory(\"parse_arguments\");\n 2229 | \targv = *argv_p;\n 2230 | \tpoptFreeContext(pc);\n 2231 | \tpc = NULL;","lines":16,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/options.c#L2216-L2231"},{"ref":"options.c:3118-3121","code":" 3118 | \t\t\tfor (i = 0; i < basis_dir_cnt; i++) {\n 3119 | \t\t\t\targs[ac++] = alt_dest_opt(0);\n 3120 | \t\t\t\targs[ac++] = safe_arg(\"\", basis_dir[i]);\n 3121 | \t\t\t}","lines":4,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/options.c#L3118-L3121"}]},
{"id":"LOGIC_35","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"params.c Section()/Parameter() grow bufr via realloc_array but never check the result for NULL (realloc_array presumably aborts on OOM internally - verify). More importantly, the buffer-growth guard 'if (i > (bSize - 2))' grows only when i exceeds bSize-2, but in Parameter()'s value loop a run of bytes between growth checks is bounded by one char per iteration so this is fine; the section-name loop similarly. No overflow, but the realloc'd 'bufr' is a file-scope global reused across recursive pm_process() calls (include/merge), and a nested include that grows bufr leaves the outer caller using the (possibly moved) pointer correctly only because bufr is global - the local references in Section()/Parameter() re-read the global each iteration. This global mutable parser buffer shared across recursion is fragile architecture.","fix":"Document the global-bufr recursion contract explicitly, or pass the buffer/size as parameters to make the recursion-safety obvious and not dependent on each access re-reading the globals.","locations":[{"ref":"params.c:95-96","code":"   95 | static char *bufr  = NULL;\n   96 | static int   bSize = 0;","lines":2,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/params.c#L95-L96"},{"ref":"params.c:210-215","code":"  210 |     /* Check that the buffer is big enough for the next character. */\n  211 |     if( i > (bSize - 2) )\n  212 |       {\n  213 |       bSize += BUFR_INC;\n  214 |       bufr   = realloc_array( bufr, char, bSize );\n  215 |       }","lines":6,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/params.c#L210-L215"},{"ref":"params.c:626-638","code":"  626 |   if( NULL != bufr )                          /* If we already have a buffer */\n  627 |     result = Parse( InFile, sfunc, pfunc );   /* (recursive call), then just */\n  628 |                                               /* use it.                     */\n  629 | \n  630 |   else                                        /* If we don't have a buffer   */\n  631 |     {                                         /* allocate one, then parse,   */\n  632 |     bSize = BUFR_INC;                         /* then free.                  */\n  633 |     bufr = new_array( char, bSize );\n  634 |     result = Parse( InFile, sfunc, pfunc );\n  635 |     free( bufr );\n  636 |     bufr  = NULL;\n  637 |     bSize = 0;\n  638 |     }","lines":13,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/params.c#L626-L638"}]},
{"id":"LOGIC_36","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In piped_child() (and local_child()), the child branch does dup2/close into STDIN/STDOUT and on dup2/close failure calls exit_cleanup(RERR_IPC) from the forked child. exit_cleanup may run parent-side cleanup handlers (atexit/cleanup of shared state, killing the partner, removing temp files) in the child context, which can corrupt the parent's view or delete files. Forked children should use _exit() after a failed exec/dup, not the full exit_cleanup() path.","fix":"In the child after fork, on dup2/close/exec failure report the error and call _exit(RERR_IPC) (or a child-safe cleanup) rather than exit_cleanup(), to avoid running parent-oriented cleanup in the child.","locations":[{"ref":"pipe.c:68-86","code":"   68 | \tif (pid == 0) {\n   69 | \t\tif (dup2(to_child_pipe[0], STDIN_FILENO) < 0\n   70 | \t\t || close(to_child_pipe[1]) < 0\n   71 | \t\t || close(from_child_pipe[0]) < 0\n   72 | \t\t || dup2(from_child_pipe[1], STDOUT_FILENO) < 0) {\n   73 | \t\t\trsyserr(FERROR, errno, \"Failed to dup/close\");\n   74 | \t\t\texit_cleanup(RERR_IPC);\n   75 | \t\t}\n   76 | \t\tif (to_child_pipe[0] != STDIN_FILENO)\n   77 | \t\t\tclose(to_child_pipe[0]);\n   78 | \t\tif (from_child_pipe[1] != STDOUT_FILENO)\n   79 | \t\t\tclose(from_child_pipe[1]);\n   80 | \t\tset_blocking(STDIN_FILENO);\n   81 | \t\tif (blocking_io > 0)\n   82 | \t\t\tset_blocking(STDOUT_FILENO);\n   83 | \t\texecvp(command[0], command);\n   84 | \t\trsyserr(FERROR, errno, \"Failed to exec %s\", command[0]);\n   85 | \t\texit_cleanup(RERR_IPC);\n   86 | \t}","lines":19,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/pipe.c#L68-L86"},{"ref":"pipe.c:130-167","code":"  130 | \tif (pid == 0) {\n  131 | \t\tam_sender = 0;\n  132 | \t\tam_server = 1;\n  133 | \t\tfilesfrom_fd = -1;\n  134 | \t\tmunge_symlinks = 0; /* Each side needs its own option. */\n  135 | \t\tchmod_modes = NULL; /* Let the sending side handle this. */\n  136 | \n  137 | \t\t/* Let the client side handle this. */\n  138 | \t\tif (logfile_name) {\n  139 | \t\t\tlogfile_name = NULL;\n  140 | \t\t\tlogfile_close();\n  141 | \t\t}\n  142 | \n  143 | \t\tif (remote_option_cnt) {\n  144 | \t\t\tint rc = remote_option_cnt + 1;\n  145 | \t\t\tconst char **rv = remote_options;\n  146 | \t\t\tif (!parse_arguments(&rc, &rv)) {\n  147 | \t\t\t\toption_error();\n  148 | \t\t\t\texit_cleanup(RERR_SYNTAX);\n  149 | \t\t\t}\n  150 | \t\t}\n  151 | \n  152 | \t\tif (dup2(to_child_pipe[0], STDIN_FILENO) < 0\n  153 | \t\t || close(to_child_pipe[1]) < 0\n  154 | \t\t || close(from_child_pipe[0]) < 0\n  155 | \t\t || dup2(from_child_pipe[1], STDOUT_FILENO) < 0) {\n  156 | \t\t\trsyserr(FERROR, errno, \"Failed to dup/close\");\n  157 | \t\t\texit_cleanup(RERR_IPC);\n  158 | \t\t}\n  159 | \t\tif (to_child_pipe[0] != STDIN_FILENO)\n  160 | \t\t\tclose(to_child_pipe[0]);\n  161 | \t\tif (from_child_pipe[1] != STDOUT_FILENO)\n  162 | \t\t\tclose(from_child_pipe[1]);\n  163 | #ifdef ICONV_CONST\n  164 | \t\tsetup_iconv();\n  165 | #endif\n  166 | \t\tchild_main(argc, argv);\n  167 | \t}","lines":38,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/pipe.c#L130-L167"}]},

m.blength);\n  499 | \t\tif (DEBUG_GTE(DELTASUM, 2)) {\n  500 | \t\t\trprintf(FINFO, \"recv mapped %s of size %s\\n\",\n  501 | \t\t\t\tfname_r, big_num(size_r));\n  502 | \t\t}\n  503 | \t} else\n  504 | \t\tmapbuf = NULL;\n  505 | \n  506 | \tsum_init(xfer_sum_nni, checksum_seed);\n  507 | \n  508 | \tif (append_mode > 0) {\n  509 | \t\tOFF_T j;\n  510 | \t\tsum.flength = (OFF_T)sum.count * sum.blength;\n  511 | \t\tif (sum.remainder)\n  512 | \t\t\tsum.flength -= sum.blength - sum.remainder;\n  513 | \t\tif (append_mode == 2 && mapbuf) {\n  514 | \t\t\tfor (j = CHUNK_SIZE; j < sum.flength; j += CHUNK_SIZE) {\n  515 | \t\t\t\tif (INFO_GTE(PROGRESS, 1))\n  516 | \t\t\t\t\tshow_progress(offset, total_size);\n  517 | \t\t\t\tsum_update(map_ptr(mapbuf, offset, CHUNK_SIZE),\n  518 | \t\t\t\t\t   CHUNK_SIZE);\n  519 | \t\t\t\toffset = j;\n  520 | \t\t\t}\n  521 | \t\t\tif (offset < sum.flength) {\n  522 | \t\t\t\tint32 len = (int32)(sum.flength - offset);\n  523 | \t\t\t\tif (INFO_GTE(PROGRESS, 1))\n  524 | \t\t\t\t\tshow_progress(offset, total_size);\n  525 | \t\t\t\tsum_update(map_ptr(mapbuf, offset, len), len);","lines":59,"link":"https://github.com/WayneD/rsync/blob/43a5fa44a87ccd2ea9a4878c38f1adee6c3a2e90/receiver.c#L467-L525"}]},
