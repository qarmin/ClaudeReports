{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"The editorconfig diagnostics `EditorConfigDiagnostic::incompatible`, `::unknown_glob_pattern`, and `::invalid_glob_pattern` (and their backing structs) are never constructed anywhere (verified by grep). In `EditorConfig::to_biome`, sections whose glob fails to parse are silently dropped via `.ok()?` instead of producing one of these diagnostics, and `validate()` always returns an empty vec. So invalid/unsupported editorconfig glob patterns are silently ignored with no user feedback, while the diagnostics written for exactly this case are unreachable.","fix":"Wire the diagnostics into `to_biome` (push them onto the returned Vec when glob parsing fails), or remove the dead constructors/structs.","locations":[{"ref":"crates/biome_configuration/src/diagnostics.rs:423-449","code":"  423 | impl EditorConfigDiagnostic {\n  424 |     pub fn incompatible(key: impl Into<String>, message: impl Into<String>) -> Self {\n  425 |         Self::Incompatible(IncompatibleDiagnostic {\n  426 |             message: MessageAndDescription::from(\n  427 |                 markup! { \"Key '\"{key.into()}\"' is incompatible with biome: \"{message.into()}}\n  428 |                     .to_owned(),\n  429 |             ),\n  430 |         })\n  431 |     }\n  432 | \n  433 |     pub fn unknown_glob_pattern(pattern: impl Into<String>) -> Self {\n  434 |         Self::UnknownGlobPattern(UnknownGlobPatternDiagnostic {\n  435 |             message: MessageAndDescription::from(\n  436 |                 markup! { \"This glob pattern is incompatible with biome: \"{pattern.into()}}\n  437 |                     .to_owned(),\n  438 |             ),\n  439 |         })\n  440 |     }\n  441 | \n  442 |     pub fn invalid_glob_pattern(pattern: impl Into<String>, reason: impl Into<String>) -> Self {\n  443 |         Self::InvalidGlobPattern(InvalidGlobPatternDiagnostic {\n  444 |             message: MessageAndDescription::from(\n  445 |                 markup! { \"This glob pattern is invalid: \"{pattern.into()}\" Reason: \"{reason.into()}}\n  446 |                     .to_owned(),\n  447 |             ),\n  448 |         })\n  449 |     }","lines":27,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_configuration/src/diagnostics.rs#L423-L449"},{"ref":"crates/biome_configuration/src/editorconfig.rs:329-344","code":"  329 |         let overrides: Vec<_> = self\n  330 |             .sections\n  331 |             .into_iter()\n  332 |             .filter_map(|section| {\n  333 |                 // Ignore glob patterns that cannot be parsed.\n  334 |                 Some((\n  335 |                     biome_glob::editorconfig::EditorconfigGlob::try_from(section.glob).ok()?,\n  336 |                     section.options,\n  337 |                 ))\n  338 |             })\n  339 |             .map(|(glob, v)| OverridePattern {\n  340 |                 includes: Some(OverrideGlobs::EditorconfigGlob(Box::new(glob))),\n  341 |                 formatter: Some(v.to_biome_override()),\n  342 |                 ..Default::default()\n  343 |             })\n  344 |             .collect();","lines":16,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_configuration/src/editorconfig.rs#L329-L344"},{"ref":"crates/biome_configuration/src/editorconfig.rs:401-403","code":"  401 |     fn validate(&self) -> Vec<EditorConfigDiagnostic> {\n  402 |         vec![]\n  403 |     }","lines":3,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_configuration/src/editorconfig.rs#L401-L403"}]},
{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"In the inconsistent-cell-count branch, `shortest` is initialized to row 0 and only updated immediately before a `return`, so the loop never iterates past the first inconsistent row. The intent to track the globally shortest row is never realized; the reported span is just whichever of row 0 / current row is shorter at the first mismatch. The `shortest` tracking is effectively dead.","fix":"Either drop the `shortest` variable and report the offending row's span directly, or scan all rows first to find the true shortest before producing the diagnostic.","locations":[{"ref":"crates/biome_css_analyze/src/lint/correctness/no_invalid_grid_areas.rs:196-218","code":"  196 |     let mut shortest = &grid_areas_props[0];\n  197 | \n  198 |     for grid_areas_prop in &grid_areas_props {\n  199 |         let cleaned_text = inner_string_text(&grid_areas_prop.0);\n  200 |         // Check if the grid areas are empty\n  201 |         if cleaned_text.is_empty() {\n  202 |             return Some(UseConsistentGridAreasState {\n  203 |                 text: None,\n  204 |                 span: grid_areas_prop.1,\n  205 |                 reason: GridAreaValidationError::EmptyGridArea,\n  206 |             });\n  207 |         }\n  208 |         // Check if all elements have the same length\n  209 |         if cleaned_text.len() != first_len {\n  210 |             if cleaned_text.len() < inner_string_text(&shortest.0).len() {\n  211 |                 shortest = grid_areas_prop;\n  212 |             }\n  213 |             return Some(UseConsistentGridAreasState {\n  214 |                 text: None,\n  215 |                 span: shortest.1,\n  216 |                 reason: GridAreaValidationError::InconsistentCellCount,\n  217 |             });\n  218 |         }","lines":23,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_css_analyze/src/lint/correctness/no_invalid_grid_areas.rs#L196-L218"}]},
{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"In `parse_import_attribute`, the guard accepts both `assert` and `with` (`p.at(T![assert]) || p.at(T![with])`), but the subsequent `match p.cur()` only handles `T![with]`; the `assert` case falls into `_ => { m.abandon(p); return Absent; }`. So when positioned at `assert`, the function starts a marker, immediately abandons it, and returns `Absent` - the `assert` acceptance in the guard is effectively dead and the marker start/abandon is wasted work.","fix":"Drop `assert` from the guard (`if !p.at(T![with]) { return Absent; }`), or add an explicit `T![assert]` arm that emits the deprecation diagnostic.","locations":[{"ref":"crates/biome_js_parser/src/syntax/module.rs:534-551","code":"  534 | fn parse_import_attribute(p: &mut JsParser) -> ParsedSyntax {\n  535 |     if p.has_preceding_line_break() {\n  536 |         return Absent;\n  537 |     }\n  538 |     if !p.at(T![assert]) && !p.at(T![with]) {\n  539 |         return Absent;\n  540 |     }\n  541 | \n  542 |     let m = p.start();\n  543 |     match p.cur() {\n  544 |         T![with] => {\n  545 |             p.expect(T![with]);\n  546 |         }\n  547 |         _ => {\n  548 |             m.abandon(p);\n  549 |             return Absent;\n  550 |         }\n  551 |     };","lines":18,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_js_parser/src/syntax/module.rs#L534-L551"}]},
{"id":"DEAD_6","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`indent` is built from the last member's first-token indentation trivia (lines 302-307), but is then immediately shadowed by a fresh empty `let mut indent = Vec::new();` at line 309 before being used. The first computation is entirely wasted work and dead code; only the second `indent` (computed from `old_rules_list.last()`) is actually consumed.","fix":"Delete the first `indent` block (lines 302-307); keep only the computation at lines 309-314.","locations":[{"ref":"crates/biome_migrate/src/analyzers/rule_mover.rs:302-309","code":"  302 |             let mut indent = Vec::new();\n  303 |             if let Some((last_node, _)) = new_elements.last()\n  304 |                 && let Some(first_token) = last_node.syntax().first_token()\n  305 |             {\n  306 |                 indent.extend(first_token.indentation_trivia_pieces());\n  307 |             }\n  308 |             // Add the new group and rule\n  309 |             let mut indent = Vec::new();","lines":8,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_migrate/src/analyzers/rule_mover.rs#L302-L309"}]},
{"id":"DEAD_7","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`PathInfoCache::clear_prefix` is defined but never called anywhere in the workspace, while `remove`/`get_or_insert*` are used. It is dead code (and removes keys while iterating the papaya map's keys, which is tolerated by papaya but still unused).","fix":"Remove the method, or wire it up if removal-by-prefix is actually needed (e.g. parallel to `ProjectDatabase::unload_path`).","locations":[{"ref":"crates/biome_module_graph/src/path_info_cache.rs:34-41","code":"   34 |     pub fn clear_prefix(&self, prefix: &Utf8Path) {\n   35 |         let pinned = self.cache.pin();\n   36 |         for key in pinned.keys() {\n   37 |             if key.starts_with(prefix) {\n   38 |                 pinned.remove(key);\n   39 |             }\n   40 |         }\n   41 |     }","lines":8,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_module_graph/src/path_info_cache.rs#L34-L41"}]},
{"id":"DEAD_8","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"The `### ` heading branch in markdown documentation parsing is unreachable. `str::split_once(\"## \")` already matches inside any line starting with `### ` (the substring `\"## \"` occurs at offset 1 of `\"### \"`), so the first `if let Some(...) = line.split_once(\"## \")` always succeeds for `### ` lines and the `else if` arm never runs. Both arms produce identical output, so behavior is unchanged, but the intent to distinguish `##` vs `###` is silently lost.","fix":"Drop the redundant `### ` branch, or detect the heading level explicitly before splitting so each level is handled as intended.","locations":[{"ref":"crates/biome_service/src/documentation/mod.rs:227-238","code":"  227 |         for line in metadata.docs.lines() {\n  228 |             if let Some((_, remainder)) = line.split_once(\"## \") {\n  229 |                 fmt.write_markup(markup! {\n  230 |                     <Emphasis>{remainder.trim_start()}<\/Emphasis>\n  231 |                 })?;\n  232 |             } else if let Some((_, remainder)) = line.split_once(\"### \") {\n  233 |                 fmt.write_markup(markup! {\n  234 |                     <Emphasis>{remainder.trim_start()}<\/Emphasis>\n  235 |                 })?;\n  236 |             } else {\n  237 |                 fmt.write_str(line)?;\n  238 |             }","lines":12,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_service/src/documentation/mod.rs#L227-L238"}]},
{"id":"DEAD_9","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"In grit `lint`, `skipped_diagnostics` is `diagnostic_count.saturating_sub(diagnostics.len())` where `diagnostic_count` was just assigned `diagnostics.len() as u32`, so the result is always 0. The `diagnostic_count` variable and the subtraction are pointless and misleading.","fix":"Drop the `diagnostic_count`/`skipped_diagnostics` computation and set `skipped_diagnostics: 0` directly, matching the other hardcoded zero fields.","locations":[{"ref":"crates/biome_service/src/file_handlers/grit.rs:506-507","code":"  506 |     let diagnostic_count = diagnostics.len() as u32;\n  507 |     let skipped_diagnostics = diagnostic_count.saturating_sub(diagnostics.len() as u32);","lines":2,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_service/src/file_handlers/grit.rs#L506-L507"}]},
{"id":"DEAD_10","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"The `_ => CSS_BOGUS` arm in the SCSS nth pseudo-class parser completes a zero-width bogus node without consuming a token. It is currently unreachable given the entry guard, but if a future guard change makes it reachable inside a list parser it would stall recovery (no forward progress). Harden it now.","fix":"In the `_` fallback arm, bump the offending token (or return `Absent`) so the parser always makes progress.","locations":[{"ref":"crates/biome_css_parser/src/syntax/scss/selector/pseudo_class_nth.rs:66-75","code":"   66 |     } else {\n   67 |         match p.cur() {\n   68 |             T![n] => {\n   69 |                 p.bump_with_context(T![n], CssLexContext::PseudoNthSelector);\n   70 |                 parse_scss_pseudo_class_nth_offset(p).ok();\n   71 |                 CSS_PSEUDO_CLASS_NTH\n   72 |             }\n   73 |             _ => CSS_BOGUS,\n   74 |         }\n   75 |     };","lines":10,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_css_parser/src/syntax/scss/selector/pseudo_class_nth.rs#L66-L75"}]},
{"id":"DEAD_11","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"Seven `is_at_*_dimension` predicate functions are unused and suppressed with `#[expect(dead_code)]` plus a TODO. Acknowledged/intentional, flagged for completeness; they are carrying weight without callers.","fix":"Either wire these predicates into the dimension parser or delete them.","locations":[{"ref":"crates/biome_css_parser/src/syntax/value/dimension.rs:185-235","code":"  185 | // TODO: In the future, remove the `#[expect(dead_code)]` as these get used.\n  186 | \n  187 | /// Returns true if the parser is currently at the start of a RegularDimension\n  188 | /// that will become a Length value\n  189 | #[inline]\n  190 | #[expect(dead_code)]\n  191 | pub(crate) fn is_at_length_dimension(p: &mut CssParser) -> bool {\n  192 |     is_at_regular_dimension(p) && is_nth_at_length_unit(p, 1)\n  193 | }\n  194 | /// Returns true if the parser is currently at the start of a RegularDimension\n  195 | /// that will become a Length value\n  196 | #[inline]\n  197 | #[expect(dead_code)]\n  198 | pub(crate) fn is_at_container_lengths_dimension(p: &mut CssParser) -> bool {\n  199 |     is_at_regular_dimension(p) && is_nth_at_container_lengths_unit(p, 1)\n  200 | }\n  201 | /// Returns true if the parser is currently at the start of a RegularDimension\n  202 | /// that will become an Angle value\n  203 | #[inline]\n  204 | #[expect(dead_code)]\n  205 | pub(crate) fn is_at_angle_dimension(p: &mut CssParser) -> bool {\n  206 |     is_at_regular_dimension(p) && is_nth_at_angle_unit(p, 1)\n  207 | }\n  208 | /// Returns true if the parser is currently at the start of a RegularDimension\n  209 | /// that will become a Time value\n  210 | #[inline]\n  211 | #[expect(dead_code)]\n  212 | pub(crate) fn is_at_time_dimension(p: &mut CssParser) -> bool {\n  213 |     is_at_regular_dimension(p) && is_nth_at_time_unit(p, 1)\n  214 | }\n  215 | /// Returns true if the parser is currently at the start of a RegularDimension\n  216 | /// that will become a Frequency value\n  217 | #[inline]\n  218 | #[expect(dead_code)]\n  219 | pub(crate) fn is_at_frequency_dimension(p: &mut CssParser) -> bool {\n  220 |     is_at_regular_dimension(p) && is_nth_at_frequency_unit(p, 1)\n  221 | }\n  222 | /// Returns true if the parser is currently at the start of a RegularDimension\n  223 | /// that will become a Resolution value\n  224 | #[inline]\n  225 | #[expect(dead_code)]\n  226 | pub(crate) fn is_at_resolution_dimension(p: &mut CssParser) -> bool {\n  227 |     is_at_regular_dimension(p) && is_nth_at_resolution_unit(p, 1)\n  228 | }\n  229 | /// Returns true if the parser is currently at the start of a RegularDimension\n  230 | /// that will become a Flex value\n  231 | #[inline]\n  232 | #[expect(dead_code)]\n  233 | pub(crate) fn is_at_flex_dimension(p: &mut CssParser) -> bool {\n  234 |     is_at_regular_dimension(p) && is_nth_at_flex_unit(p, 1)\n  235 | }","lines":51,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_css_parser/src/syntax/value/dimension.rs#L185-L235"}]},
{"id":"DEAD_12","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"`is_reserved_module_name` checks `name.len() == 4 && matches!(name, \"void\" | \"null\")`. Both `\"void\"` and `\"null\"` already have length 4, so the `name.len() == 4` conjunct can never change the result; it is redundant.","fix":"Simplify to `matches!(name, \"void\" | \"null\")`.","locations":[{"ref":"crates/biome_js_parser/src/syntax/typescript/types.rs:172-174","code":"  172 | pub(crate) fn is_reserved_module_name(name: &str) -> bool {\n  173 |     name.len() == 4 && matches!(name, \"void\" | \"null\")\n  174 | }","lines":3,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_js_parser/src/syntax/typescript/types.rs#L172-L174"}]},
{"id":"DEAD_13","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"`parse_ts_import_type_assertion_block` returns `Absent` at the top unless `p.at(T!['{'])`, then re-tests the identical `if p.at(T!['{'])` before bumping. Nothing between the two checks advances the parser, so the inner `if` is always true and is redundant nesting.","fix":"Remove the inner `if p.at(T!['{'])` guard and bump unconditionally.","locations":[{"ref":"crates/biome_js_parser/src/syntax/typescript/types.rs:1703-1721","code":" 1703 | fn parse_ts_import_type_assertion_block(p: &mut JsParser) -> ParsedSyntax {\n 1704 |     if !p.at(T!['{']) {\n 1705 |         return Absent;\n 1706 |     }\n 1707 | \n 1708 |     let m = p.start();\n 1709 | \n 1710 |     if p.at(T!['{']) {\n 1711 |         p.bump(T!['{']);\n 1712 |         if p.at(T!['}']) {\n 1713 |             p.error(\n 1714 |                 p.err_builder(\n 1715 |                     \"Missing import type assertion keyword 'with'\",\n 1716 |                     p.cur_range(),\n 1717 |                 )\n 1718 |                 .with_detail(p.cur_range(), \"'with' expected.\"),\n 1719 |             );\n 1720 |         }\n 1721 |     }","lines":19,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_js_parser/src/syntax/typescript/types.rs#L1703-L1721"}]},
{"id":"DEAD_14","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"`ConfigurationStatus::Loading` is matched in `is_linting_and_formatting_disabled` (returns true) and in the `TryFrom<u8>` impl, but no code path ever assigns this variant - configuration loading is synchronous within `load_biome_configuration_file_internal` and never records a `Loading` status. The variant and its handling are effectively dead.","fix":"Either set `Loading` while a load is in flight (so the on/off switch reflects it) or remove the variant.","locations":[{"ref":"crates/biome_lsp/src/session.rs:180-182","code":"  180 |     EditorConfigError = 3,\n  181 |     /// Currently loading the configuration\n  182 |     Loading = 4,","lines":3,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_lsp/src/session.rs#L180-L182"},{"ref":"crates/biome_lsp/src/session.rs:1556","code":" 1556 |             ConfigurationStatus::Loading => true,","lines":1,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_lsp/src/session.rs#L1556"}]},

{"id":"DEAD_16","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"In `print_debug_str`, for strings of length >= 25 the loop scans byte indices 21..25 for a char boundary. Since max UTF-8 scalar is 4 bytes, any 4-index window contains a boundary, so the final `write!(f, \"\")` fallback is unreachable; if ever reached it silently prints nothing (losing debug output) instead of a truncated string.","fix":"Document why the loop always succeeds, or compute a safe boundary deterministically (e.g. floor_char_boundary) and always emit a truncated string.","locations":[{"ref":"crates/biome_rowan/src/syntax/trivia.rs:649-661","code":"  649 | fn print_debug_str<S: AsRef<str>>(text: S, f: &mut fmt::Formatter<'_>) -> fmt::Result {\n  650 |     let text = text.as_ref();\n  651 |     if text.len() < 25 {\n  652 |         write!(f, \"{text:?}\")\n  653 |     } else {\n  654 |         for idx in 21..25 {\n  655 |             if text.is_char_boundary(idx) {\n  656 |                 let text = format!(\"{} ...\", &text[..idx]);\n  657 |                 return write!(f, \"{text:?}\");\n  658 |             }\n  659 |         }\n  660 |         write!(f, \"\")\n  661 |     }","lines":13,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_rowan/src/syntax/trivia.rs#L649-L661"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"Contradictory comments about the jest `consistent-test-it` `withinDescribe` default. The field doc states `withinDescribe` defaults to the value of `fn` (which defaults to `\"test\"`). But the conversion comment and code map a missing `withinDescribe` to `It`. Either the comment is wrong or the migration uses `it` where ESLint would use `test`.","fix":"Reconcile the comments and, if matching ESLint, default `within_describe` to the resolved `fn_kind` rather than a hard-coded `It`.","locations":[{"ref":"crates/biome_cli/src/execute/migrate/eslint_jest.rs:16-18","code":"   16 |     /// The function to prefer inside `describe` blocks. Defaults to the value of `fn`.\n   17 |     #[deserializable(rename = \"withinDescribe\")]\n   18 |     pub within_describe: Option<EslintTestFunctionKind>,","lines":3,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_cli/src/execute/migrate/eslint_jest.rs#L16-L18"},{"ref":"crates/biome_cli/src/execute/migrate/eslint_jest.rs:39-47","code":"   39 |         // ESLint's defaults: `fn` → \"test\", `withinDescribe` → \"it\".\n   40 |         // Always set both explicitly so the migrated config preserves ESLint behavior\n   41 |         // regardless of Biome's own defaults.\n   42 |         let fn_kind = val\n   43 |             .function\n   44 |             .map_or(TestFunctionKind::Test, TestFunctionKind::from);\n   45 |         let within_describe = val\n   46 |             .within_describe\n   47 |             .map_or(TestFunctionKind::It, TestFunctionKind::from);","lines":9,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_cli/src/execute/migrate/eslint_jest.rs#L39-L47"}]},

{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The comment on `insert_final_newline` says it is \"not a biome option, but we need it to emit a diagnostic when this is set to false.\" No such diagnostic is ever emitted (`validate()` returns `vec![]`), and the field is now actually applied as the `trailing_newline` formatter option in `to_biome`/`to_biome_override`, so the comment is doubly wrong. The module doc table (lines 3-9) also omits the `insert_final_newline -> trailing_newline` mapping.","fix":"Update the comment to state it maps to `trailing_newline`, add the row to the doc table, and remove the always-empty `validate()` or implement the intended diagnostic.","locations":[{"ref":"crates/biome_configuration/src/editorconfig.rs:363-364","code":"  363 |     // Not a biome option, but we need it to emit a diagnostic when this is set to false.\n  364 |     pub insert_final_newline: EditorconfigValue<TrailingNewline>,","lines":2,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_configuration/src/editorconfig.rs#L363-L364"},{"ref":"crates/biome_configuration/src/editorconfig.rs:401-403","code":"  401 |     fn validate(&self) -> Vec<EditorConfigDiagnostic> {\n  402 |         vec![]\n  403 |     }","lines":3,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_configuration/src/editorconfig.rs#L401-L403"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The detail label on noDuplicateFontNames points at the FIRST (original) occurrence (`duplicate.range()`) but reads \"This is where the duplicate font name is found:\". `this` is the later duplicate occurrence and `duplicate` is the earlier stored value retrieved from the HashSet, so the label is inverted: it points the user at the original declaration while calling it the duplicate.","fix":"Reword the detail to indicate it points at the original/first occurrence (e.g. \"This font name was already declared here:\"), or swap which range is primary vs detail.","locations":[{"ref":"crates/biome_css_analyze/src/lint/suspicious/no_duplicate_font_names.rs:97-98","code":"   97 |             if let Some(duplicate) = family_names.get(&css_value) {\n   98 |                 return Some((css_value.clone(), duplicate.clone()));","lines":2,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_css_analyze/src/lint/suspicious/no_duplicate_font_names.rs#L97-L98"},{"ref":"crates/biome_css_analyze/src/lint/suspicious/no_duplicate_font_names.rs:118-120","code":"  118 |             .detail(duplicate.range(), markup! {\n  119 |                 \"This is where the duplicate font name is found:\"\n  120 |             })","lines":3,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_css_analyze/src/lint/suspicious/no_duplicate_font_names.rs#L118-L120"}]},

{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"In `parse_import_attribute`, the comment `// bump \"with\"` sits AFTER the match block that already bumped `with`, and immediately before `p.expect(T!['{'])`. The comment describes neither the line above nor below it, so it misleads readers into thinking the `{` expectation is the `with` bump.","fix":"Delete the misplaced comment or move/correct it next to the actual `with` bump.","locations":[{"ref":"crates/biome_js_parser/src/syntax/module.rs:553","code":"  553 |     // bump \"with\"","lines":1,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_js_parser/src/syntax/module.rs#L553"}]},
{"id":"CMT_7","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"`read_trailing_trivia`'s doc comment and (ignored) doctest claim an all-whitespace input returns an empty string: `assert_eq!(read_trailing_trivia(\"   \"), \"\")`. The implementation returns the whole string: count == value.len(), so it returns `&value[len-count..]`, i.e. the full input. The comment's justification ('leading trivia would have consumed it all') is false because the function has no knowledge of leading trivia. Callers in `update_snippets` format `leading + reindented + trailing`, so if a token's text is entirely whitespace the leading+trailing readers can both return it and duplicate it.","fix":"Either fix the doc/doctest to describe the real behavior, or make `read_trailing_trivia` not overlap with leading whitespace (e.g. return \"\" when count == value.len()), since the format! usage assumes leading and trailing are disjoint.","locations":[{"ref":"crates/biome_service/src/file_handlers/html.rs:1382-1406","code":" 1382 | /// # Returns\n 1383 | /// A `Cow<'_, str>` containing the trailing whitespace. If the entire string is whitespace,\n 1384 | /// returns an empty string (because leading trivia would have consumed it all). If there's no\n 1385 | /// trailing whitespace, returns an empty string.\n 1386 | ///\n 1387 | /// # Examples\n 1388 | /// ```ignore\n 1389 | /// assert_eq!(read_trailing_trivia(\"console.log('Hi');\\n\"), \"\\n\");\n 1390 | /// assert_eq!(read_trailing_trivia(\"console.log('Hi');\"), \"\");\n 1391 | /// assert_eq!(read_trailing_trivia(\"   \"), \"\");\n 1392 | /// ```\n 1393 | fn read_trailing_trivia(value: &str) -> Cow<'_, str> {\n 1394 |     let bytes = value.as_bytes();\n 1395 |     let count = bytes\n 1396 |         .iter()\n 1397 |         .rev()\n 1398 |         .take_while(|&&b| matches!(b, b' ' | b'\\t' | b'\\n' | b'\\r'))\n 1399 |         .count();\n 1400 | \n 1401 |     if count > 0 {\n 1402 |         Cow::Borrowed(&value[value.len() - count..])\n 1403 |     } else {\n 1404 |         Cow::Borrowed(\"\")\n 1405 |     }\n 1406 | }","lines":25,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_service/src/file_handlers/html.rs#L1382-L1406"}]},
{"id":"CMT_8","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The doc comment on `support_kind_for` ('Returns the SupportKind for the given feature, but only if it is not enabled.') is copy-pasted from `support_kind_if_not_enabled` and is wrong: `support_kind_for` always returns the kind unconditionally.","fix":"Change the `support_kind_for` doc comment to 'Returns the SupportKind for the given feature.'","locations":[{"ref":"crates/biome_service/src/workspace.rs:311-316","code":"  311 |     /// Returns the [`SupportKind`] for the given `feature`, but only if it is\n  312 |     /// not enabled.\n  313 |     #[inline(always)]\n  314 |     pub fn support_kind_for(&self, feature: FeatureKind) -> SupportKind {\n  315 |         self.0[feature.index()]\n  316 |     }","lines":6,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_service/src/workspace.rs#L311-L316"}]},

{"id":"CMT_11","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"Doc comment contains a garbled, unfinished sentence: \"Keeps any  the current value is [Indent::Align] and increments the level by one.\" (double space, broken grammar, references nonexistent `Indent::Align` instead of `Indention::Align`). Looks like an edit artifact.","fix":"Remove the broken trailing sentence and fix `Indent::Align` references to `Indention::Align`.","locations":[{"ref":"crates/biome_formatter/src/printer/mod.rs:1019-1025","code":" 1019 |     /// Increments the level by one.\n 1020 |     ///\n 1021 |     /// The behaviour depends on the [`indent_style`][IndentStyle] if this is an [Indent::Align]:\n 1022 |     /// * **Tabs**: `align` is converted into an indent. This results in `level` increasing by two: once for the align, once for the level increment\n 1023 |     /// * **Spaces**: Increments the `level` by one and keeps the `align` unchanged.\n 1024 |     ///\n 1025 |     /// Keeps any  the current value is [Indent::Align] and increments the level by one.","lines":7,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_formatter/src/printer/mod.rs#L1019-L1025"}]},
{"id":"CMT_12","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"The doc comment for `SimpleArgument` states a regex literal is complex/simple based on `len()` greater/less than 5, but `is_simple_regex_expression` actually tests `pattern.text().width() <= 5` (display width, not byte/char length). For multi-byte or wide-character patterns the two differ, so the documentation is misleading.","fix":"Update the doc comment to say the decision is based on the display width of the regex pattern, matching the implementation.","locations":[{"ref":"crates/biome_js_formatter/src/utils/member_chain/simple_argument.rs:19-21","code":"   19 | /// - *complex*: if the argument is a [JsRegexLiteralExpression] with len() greater than 5\n   20 | /// - *simple*: the argument is a literal\n   21 | /// - *simple*: the argument is a [JsRegexLiteralExpression] with len() less than 5","lines":3,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_js_formatter/src/utils/member_chain/simple_argument.rs#L19-L21"},{"ref":"crates/biome_js_formatter/src/utils/member_chain/simple_argument.rs:215-225","code":"  215 |     fn is_simple_regex_expression(&self) -> bool {\n  216 |         if let Self::Expression(AnyJsExpression::AnyJsLiteralExpression(\n  217 |             AnyJsLiteralExpression::JsRegexLiteralExpression(regex),\n  218 |         )) = self\n  219 |             && let Ok((pattern, _)) = regex.decompose()\n  220 |         {\n  221 |             return pattern.text().width() <= 5;\n  222 |         }\n  223 | \n  224 |         false\n  225 |     }","lines":11,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_js_formatter/src/utils/member_chain/simple_argument.rs#L215-L225"}]},

{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"Redundant `results.add(&name, RuleMigrationResult::Migrated)` calls. `migrate_eslint_any_rule` already records the rule as Migrated whenever it returns `true`. The JestConsistentTestIt and TypeScriptNoShadow arms call `results.add(..., Migrated)` again inside the `if migrate_eslint_any_rule(...)` block; because `migrated` is a BTreeSet the second insert is a no-op, but it is misleading and inconsistent with the other ~15 option-carrying arms.","fix":"Remove the two redundant `results.add(..., Migrated)` calls.","locations":[{"ref":"crates/biome_cli/src/execute/migrate/eslint_to_biome.rs:790","code":"  790 |                 results.add(&name, RuleMigrationResult::Migrated);","lines":1,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_cli/src/execute/migrate/eslint_to_biome.rs#L790"},{"ref":"crates/biome_cli/src/execute/migrate/eslint_to_biome.rs:906","code":"  906 |                 results.add(&name, RuleMigrationResult::Migrated);","lines":1,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_cli/src/execute/migrate/eslint_to_biome.rs#L906"}]},

{"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"`migrate_file` is a single ~300-line function with three large, near-duplicated branches (Prettier, ESLint, default) that each repeat the change_file/format_file/set_content/diff-diagnostic dance. The duplication has already caused subtle divergence (e.g. the spurious ignore-file message logic differs between branches). It mixes IO, deserialization, merging, and diagnostic emission in one place.","fix":"Extract the shared write/format/diff tail into a helper taking the merged config (and the 'changed?' decision) so each sub-command branch only computes the merged Biome config.","locations":[{"ref":"crates/biome_cli/src/execute/migrate.rs:165-459","code":"  165 | fn migrate_file(payload: MigrateFile) -> Result<MigrationFileResult, CliDiagnostic> {\n  166 |     let MigrateFile {\n  167 |         workspace,\n  168 |         console,\n  169 |         project_key,\n  170 |         write,\n  171 |         configuration_file_path,\n  172 |         sub_command,\n  173 |     } = payload;\n  174 |     let mut cache = NodeCache::default();\n  175 |     let fs = workspace.fs();\n  176 | \n  177 |     let open_options = if write {\n  178 |         OpenOptions::default().read(true).write(true)\n  179 |     } else {\n  180 |         OpenOptions::default().read(true)\n  181 |     };\n  182 |     let mut biome_config_file =\n  183 |         fs.open_with_options(configuration_file_path.as_path(), open_options)?;\n  184 |     let mut biome_config_content = String::new();\n  185 |     biome_config_file.read_to_string(&mut biome_config_content)?;\n  186 | \n  187 |     let biome_path = BiomePath::new(configuration_file_path.as_path());\n  188 |     let parse_options = match configuration_file_path.extension() {\n  189 |         Some(\"jsonc\") => JsonParserOptions::default()\n  190 |             .with_allow_comments()\n  191 |             .with_allow_trailing_commas(),\ {"id":"OTHER_1","type":"other","type_label":"Other","severity":"medium","difficulty":"medium","description":"`read_message` allocates `vec![0u8; length]` where `length` is parsed directly from the untrusted `Content-Length` header received from the socket peer, with no upper bound. A malicious or buggy daemon/peer sending a huge Content-Length forces a multi-gigabyte allocation (OOM / DoS) before any data is read.","fix":"Validate `length` against a sane maximum frame size before allocating, returning an error if it is exceeded.","locations":[{"ref":"crates/biome_cli/src/service/mod.rs:360-368","code":"  360 |     let length = length.context(\n  361 |         \"incoming response from the remote workspace is missing the Content-Length header\",\n  362 |     )?;\n  363 | \n  364 |     let mut result = vec![0u8; length];\n  365 |     socket_read\n  366 |         .read_exact(&mut result)\n  367 |         .await\n  368 |         .with_context(|| format!(\"failed to read message of {length} bytes from the socket\"))?;","lines":9,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_cli/src/service/mod.rs#L360-L368"}]},
{"id":"OTHER_2","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"`GenerationalPointer` steals the low bit of a pointer for a generation tag and only checks `debug_assert!(data & 1 == 0)` in `new`; `value()` masks `& !1` and dereferences. Soundness depends on every pointee (`GreenNodeData`/`GreenTokenData`/`GreenTriviaData`, each the `data` field of an `ArcInner` whose first field is an `AtomicUsize`) having alignment >= 2. This holds today but is an undocumented cross-module coupling to `arc::ArcInner`'s layout; in release a future change yielding a 1-byte-aligned pointee would silently corrupt pointers with no assertion.","fix":"Add a compile-time guard such as `const _: () = assert!(align_of::<Pointee>() >= 2);` per pointee type so the bit-stealing invariant cannot regress silently in release builds.","locations":[{"ref":"crates/biome_rowan/src/green/node_cache.rs:32-56","code":"   32 | impl<T: IntoRawPointer> GenerationalPointer<T> {\n   33 |     fn new(value: T, generation: Generation) -> Self {\n   34 |         let ptr = value.into_raw();\n   35 |         let mut data = ptr as usize;\n   36 |         debug_assert!(data & 1 == 0);\n   37 |         data |= generation as usize;\n   38 |         Self {\n   39 |             data,\n   40 |             _ty: PhantomData,\n   41 |         }\n   42 |     }\n   43 | \n   44 |     fn value(&self) -> &T::Pointee {\n   45 |         // SAFETY: This clears the least significant bit from `data`. This bit\n   46 |         // should have been set to zero in the original pointer due to the\n   47 |         // alignment requirements of the underlying data (this is checked by an\n   48 |         // assertion on debug builds), so this essentially extracts the pointer\n   49 |         // value from the bit field. Said point is safe to dereference at this\n   50 |         // point since we're holding a valid reference to `self` which\n   51 |         // guarantees `Drop` has not been called and the memory associated with\n   52 |         // the pointer has not been released yet.\n   53 |         let data = self.data & !1;\n   54 |         let ptr = data as *const T::Pointee;\n   55 |         unsafe { &*ptr }\n   56 |     }","lines":25,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_rowan/src/green/node_cache.rs#L32-L56"},{"ref":"crates/biome_rowan/src/green/node_cache.rs:86-92","code":"   86 | impl<T: IntoRawPointer> Drop for GenerationalPointer<T> {\n   87 |     fn drop(&mut self) {\n   88 |         let ptr = self.value() as *const _ as *mut _;\n   89 |         let value = unsafe { T::from_raw(ptr) };\n   90 |         drop(value);\n   91 |     }\n   92 | }","lines":7,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_rowan/src/green/node_cache.rs#L86-L92"}]},

{"id":"OTHER_4","type":"other","type_label":"Other","severity":"negligible","difficulty":"easy","description":"Misspelled local variable `element_statck` (should be `element_stack`) in `RemoveSoftLinesBuffer::write_element`. Cosmetic only.","fix":"Rename `element_statck` to `element_stack`.","locations":[{"ref":"crates/biome_formatter/src/buffer.rs:636-666","code":"  636 |         let mut element_statck = Vec::new();\n  637 |         element_statck.push(element);\n  638 | \n  639 |         while let Some(element) = element_statck.pop() {\n  640 |             match element {\n  641 |                 FormatElement::Tag(Tag::StartConditionalContent(condition)) => {\n  642 |                     self.conditional_content_stack.push(condition.clone());\n  643 |                 }\n  644 |                 FormatElement::Tag(Tag::EndConditionalContent) => {\n  645 |                     self.conditional_content_stack.pop();\n  646 |                 }\n  647 |                 // All content within an expanded conditional gets dropped. If there's a\n  648 |                 // matching flat variant, that will still get kept.\n  649 |                 _ if self.is_in_expanded_conditional_content() => {}\n  650 | \n  651 |                 FormatElement::Line(LineMode::Soft) => {}\n  652 |                 FormatElement::Line(LineMode::SoftOrSpace) => {\n  653 |                     self.inner.write_element(FormatElement::Space)?\n  654 |                 }\n  655 |                 FormatElement::Interned(interned) => {\n  656 |                     let cleaned = self.clean_interned(&interned);\n  657 |                     self.inner.write_element(FormatElement::Interned(cleaned))?\n  658 |                 }\n  659 |                 // Since this buffer aims to simulate infinite print width, we don't need to retain the best fitting.\n  660 |                 // Just extract the flattest variant and then handle elements within it.\n  661 |                 FormatElement::BestFitting(best_fi {"id":"OTHER_5","type":"other","type_label":"Other","severity":"negligible","difficulty":"easy","description":"In `JsTreeTransformer`, the destructured binding shadows `inner_offset` (an offset/`TextSize`) with the first element of `first_new_line`, which is actually a `TextRange` (computed as `trivia.text_range() + inner_offset`). Naming a range `inner_offset` and passing it to `add_deleted_range` is misleading and invites future maintainers to treat it as an offset.","fix":"Rename the destructured binding to something like `deleted_range` to reflect that it is a `TextRange`, not an offset.","locations":[{"ref":"crates/biome_js_formatter/src/syntax_rewriter.rs:251-255","code":"  251 |                     if trivia.is_newline() && first_new_line.is_none() {\n  252 |                         first_new_line = Some((\n  253 |                             trivia.text_range() + inner_offset,\n  254 |                             leading_trivia.next().unwrap(),\n  255 |                         ));","lines":5,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_js_formatter/src/syntax_rewriter.rs#L251-L255"},{"ref":"crates/biome_js_formatter/src/syntax_rewriter.rs:270-272","code":"  270 |                     let (inner_offset, _) = first_new_line.take().unwrap();\n  271 | \n  272 |                     self.source_map.add_deleted_range(inner_offset);","lines":3,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_js_formatter/src/syntax_rewriter.rs#L270-L272"}]},
{"id":"OTHER_6","type":"other","type_label":"Other","severity":"negligible","difficulty":"easy","description":"`expected_named_import` and `expected_namespace_import` call `expected_any(&[\"named imports\"], ...)` / `expected_any(&[\"namespace imports\"], ...)` with a single-element slice. `expected_any` is intended for multiple alternatives and renders less cleanly than `expected_node` for the single-alternative case.","fix":"Use `expected_node(\"named imports\", ...)` / `expected_node(\"namespace imports\", ...)` for the single-alternative diagnostics.","locations":[{"ref":"crates/biome_js_parser/src/syntax/js_parse_error.rs:126-132","code":"  126 | pub(crate) fn expected_named_import(p: &JsParser, range: TextRange) -> ParseDiagnostic {\n  127 |     expected_any(&[\"named imports\"], range, p)\n  128 | }\n  129 | \n  130 | pub(crate) fn expected_namespace_import(p: &JsParser, range: TextRange) -> ParseDiagnostic {\n  131 |     expected_any(&[\"namespace imports\"], range, p)\n  132 | }","lines":7,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_js_parser/src/syntax/js_parse_error.rs#L126-L132"}]},
{"id":"OTHER_7","type":"other","type_label":"Other","severity":"negligible","difficulty":"medium","description":"In the panic arm of `SyntaxToken::green` (corrupted-tree guard), `self.data().green().as_node().unwrap().to_string()` renders the entire subtree text and then formats it with `{:?}` (debug of a String). Only hit on an invariant violation, but it is wasteful and odd.","fix":"Format the kind instead, e.g. `panic!(\"corrupted tree: a node thinks it is a token: {:?}\", self.data().green().kind())`.","locations":[{"ref":"crates/biome_rowan/src/cursor/token.rs:49-59","code":"   49 |     pub(crate) fn green(&self) -> &GreenTokenData {\n   50 |         match self.data().green().as_token() {\n   51 |             Some(token) => token,\n   52 |             None => {\n   53 |                 panic!(\n   54 |                     \"corrupted tree: a node thinks it is a token: {:?}\",\n   55 |                     self.data().green().as_node().unwrap().to_string()\n   56 |                 );\n   57 |             }\n   58 |         }\n   59 |     }","lines":11,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_rowan/src/cursor/token.rs#L49-L59"}]},

const HAS_DIFFICULTY = PRESENT_DIFFS.length > 0;
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State
const S = {
  search: '', searchScope: 'all', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenDiff: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(),
};
const statuses = {};

// Persistence
function loadStatuses() {
  try { Object.assign(statuses, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch {}
}
function saveStatuses() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(statuses)); } catch {}
}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;
function syncHash() {
  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));
    if (S.search)            p.set('q',   S.search);
    if (S.searchScope !== 'all') p.set('qs', S.searchScope);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('qs'))  { S.searchScope = p.get('qs'); }
  document.getElementById('search-scope').classList.toggle('active', S.searchScope === 'locations');
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Render a "**Label:** value" line. GitHub/CommonMark only recognizes a
// ``` fence when it starts at the beginning of a line, so if the value
// itself opens with a fence, put it on its own line instead of right
// after the inline label - otherwise the fence marker gets glued onto
// "**Label:** ```" and never renders as a code block.
function mdField(label, value) {
  value = value || '';
  return /^```/.test(value.trim())
    ? '**' + label + ':**\n\n' + value
    : '**' + label + ':** ' + value;
}

// Render the "**Locations:**" block. When a location has a commit-pinned
// permalink (GitHub/GitLab), just paste the bare URL on its own line -
// GitHub/GitLab auto-expand a line-range blob link into an inline code
// preview, so re-pasting the snippet as a fenced block would duplicate it.
// Forges without a detected permalink shape (or missing commit/repo info)
// fall back to the fenced ref+snippet so the location is still readable.
function mdLocations(locations) {
  if (!locations.length) return '';
  let out = '**Locations:**\n\n';
  for (const l of locations) {
    if (l.link)               out += l.link + '\n\n';
    else if (l.code != null)  out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
    else                      out += '- `' + l.ref + '` _(file not found)_\n\n';
  }
  return out;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += mdField('Description', f.description) + '\n\n';
      out += mdLocations(f.locations);
      out += mdField('Fix', f.fix) + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build a [project] header block from embedded PROJECT_INFO, so the exported
// findings.toml is self-contained (doesn't depend on a sibling project-info.toml
// that a second, separately-triggered download could silently fail to save).
// '' when there is no project info at all.
function buildProjectToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = PROJECT_INFO || {};
  if (!Object.keys(pi).length) return '';
  const lines = ['[project]'];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n\n';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return buildProjectToml() + chunks.join('\n\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += mdField('Description', f.description) + '\n\n';
  out += mdLocations(f.locations);
  out += mdField('Fix', f.fix) + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystacks per finding (cleared on full re-render).
// Two variants: everything (default), and file/folder paths only - for when a
// search term (e.g. a directory name like 'dlls/abc') also happens to appear
// inside description/fix prose and you only want path matches.
const _hay = new Map();
const _hayLoc = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}
function hayLocOf(f) {
  if (!_hayLoc.has(f.id)) {
    _hayLoc.set(f.id, f.locations.map(l => l.ref).join(' ').toLowerCase());
  }
  return _hayLoc.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (S.searchScope === 'locations') {
      if (!hayLocOf(f).includes(q)) return false;
    } else if (!hayOf(f).includes(q) && !st.includes(q)) {
      return false;
    }
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  _hayLoc.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    // Single download (was two) - a second auto-triggered download is commonly
    // blocked by the browser unless the user explicitly allows it, which silently
    // drops project-info.toml. Embedding [project] in findings.toml itself avoids
    // that failure mode entirely.
    downloadText(buildFindingsToml(), 'findings.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});
document.getElementById('search-scope').addEventListener('click', e => {
  S.searchScope = S.searchScope === 'locations' ? 'all' : 'locations';
  e.currentTarget.classList.toggle('active', S.searchScope === 'locations');
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
