<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`compute_initial_fingerprint` slices the source text with `&source_code.text[span]` without any bounds/char-boundary guard. `Index<TextRange> for str` panics if the span end exceeds `text.len()` or falls on a non-UTF-8 char boundary. Other consumers in these reporters guard via `SourceFile::location(...).ok()`; this one indexes raw, so a diagnostic whose span does not match its attached source code panics the whole CLI run.","fix":"Use a checked slice, e.g. `source_code.text.get(Range::<usize>::from(span)).unwrap_or(\"\")`, before hashing.","locations":[{"ref":"crates/biome_cli/src/reporter/gitlab.rs:124-144","code":"  124 |     fn compute_initial_fingerprint(&self, diagnostic: &Error, path: &str) -> u64 {\n  125 |         let location = diagnostic.location();\n  126 |         let code = match location.span {\n  127 |             Some(span) => match location.source_code {\n  128 |                 Some(source_code) => &source_code.text[span],\n  129 |                 None => \"\",\n  130 |             },\n  131 |             None => \"\",\n  132 |         };\n  133 | \n  134 |         let check_name = diagnostic\n  135 |             .category()\n  136 |             .map(|category| category.name())\n  137 |             .unwrap_or_default();\n  138 | \n  139 |         calculate_hash(&Fingerprint {\n  140 |             check_name,\n  141 |             path,\n  142 |             code,\n  143 |         })\n  144 |     }","lines":21,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_cli/src/reporter/gitlab.rs#L124-L144"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`SuggestionsVisitor::record_frame` calls `source.location(span.start()).expect(\"Invalid span\")` and `span.end()).expect(\"Invalid span\")`. If the diagnostic carries a span out of range for its source_code, `SourceFile::location` returns Err and this panics during `--reporter=json`. The analogous code in rdjson/sarif/json `to_location` uses `.ok()?` to skip gracefully; only this path panics.","fix":"Replace the two `.expect(\"Invalid span\")` with guards that return early, matching the rdjson/sarif handling.","locations":[{"ref":"crates/biome_cli/src/reporter/json.rs:416-433","code":"  416 |     fn record_frame(&mut self, location: Location<'_>) -> std::io::Result<()> {\n  417 |         if let (Some(span), Some(source_code)) = (location.span, location.source_code) {\n  418 |             let source = SourceFile::new(source_code);\n  419 |             let start = source.location(span.start()).expect(\"Invalid span\");\n  420 |             let end = source.location(span.end()).expect(\"Invalid span\");\n  421 | \n  422 |             self.suggestions.push(JsonSuggestion {\n  423 |                 end: LocationSpan {\n  424 |                     line: end.line_number.get(),\n  425 |                     column: end.column_number.get(),\n  426 |                 },\n  427 |                 start: LocationSpan {\n  428 |                     line: start.line_number.get(),\n  429 |                     column: start.column_number.get(),\n  430 |                 },\n  431 |                 text: self.current_message.take().unwrap_or_default(),\n  432 |             })\n  433 |         }","lines":18,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_cli/src/reporter/json.rs#L416-L433"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"In the `EqualLines` branch of `text_edit`, both `line_index.line_col(offset).expect(...)` and `line_index.offset(line_col).expect(...)` panic if `doc.line_index` (the previous document revision) does not correspond to the revision the TextEdit diff was computed against. Because `insert_document` (which sets line_index) and `change_file` (which sets workspace content) are separate non-atomic steps reachable concurrently from async handlers, an interleaved didChange can desynchronize them, after which an edit diff produced against newer content is converted with a stale line index and panics.","fix":"Replace the two `expect` with `?` plus `.context(...)` so the handler degrades to producing no edits instead of crashing the request.","locations":[{"ref":"crates/biome_lsp/src/utils.rs:75-90","code":"   75 |             CompressedOp::EqualLines { line_count } => {\n   76 |                 let mut line_col = line_index\n   77 |                     .line_col(offset)\n   78 |                     .expect(\"diff length is overflowing the line count in the original file\");\n   79 | \n   80 |                 line_col.line += line_count.get() + 1;\n   81 |                 line_col.col = 0;\n   82 | \n   83 |                 // SAFETY: This should only happen if `line_index` wasn't built\n   84 |                 // from the same string as the old revision of `diff`\n   85 |                 let new_offset = line_index\n   86 |                     .offset(line_col)\n   87 |                     .expect(\"diff length is overflowing the line count in the original file\");\n   88 | \n   89 |                 offset = new_offset;\n   90 |             }","lines":16,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_lsp/src/utils.rs#L75-L90"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`SyntaxSlots::nth_back(n)` does `self.back_pos -= n as u32` with no bounds check, then calls `next_back()`. The DoubleEndedIterator::nth_back contract requires that `n >= remaining` consume the iterator and return None. Here, if `n >= len()`, the subtraction underflows: it panics in debug, and in release wraps `back_pos` to a huge value, after which `slice()` evaluates `self.pos < self.back_pos` as true and indexes `green().slice()[pos..huge]`, causing an out-of-bounds slice panic. The forward `nth` (line 811-815) is safe only because `slice()` clamps `pos`; `nth_back` mutates `back_pos` before any guard.","fix":"Clamp before subtracting, mirroring the forward direction: if `n` would push `back_pos` to or below `pos`, set `back_pos = pos` and return None; otherwise `back_pos -= n as u32; next_back()`.","locations":[{"ref":"crates/biome_rowan/src/cursor/node.rs:885-889","code":"  885 |     #[inline]\n  886 |     fn nth_back(&mut self, n: usize) -> Option<Self::Item> {\n  887 |         self.back_pos -= n as u32;\n  888 |         self.next_back()\n  889 |     }","lines":5,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_rowan/src/cursor/node.rs#L885-L889"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`default_biome_log_path` reads `BIOME_LOG_PATH` via `env::var_os` and calls `.to_str().unwrap()`, which panics if the env var contains non-UTF-8 bytes (possible on Unix). Other call sites for the same variable use `biome_env().value_for(...)` returning `Option<String>` and never panic.","fix":"Handle the non-UTF-8 case gracefully, or use `biome_env().value_for(\"BIOME_LOG_PATH\")` consistently.","locations":[{"ref":"crates/biome_cli/src/commands/daemon.rs:236-241","code":"  236 | pub fn default_biome_log_path() -> Utf8PathBuf {\n  237 |     match env::var_os(\"BIOME_LOG_PATH\") {\n  238 |         Some(directory) => Utf8PathBuf::from(directory.as_os_str().to_str().unwrap()),\n  239 |         None => biome_fs::ensure_cache_dir().join(\"biome-logs\"),\n  240 |     }\n  241 | }","lines":6,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_cli/src/commands/daemon.rs#L236-L241"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"Inside a `Display::fmt` impl (expected to only fail via `io::Error`), `settings.merge_with_configuration(...).unwrap()` panics if merging the loaded configuration fails. A malformed-but-loadable configuration could trigger this during `biome rage`, aborting the process rather than printing a diagnostic.","fix":"Handle the `Result` instead of unwrapping, printing a fallback failure line via the formatter.","locations":[{"ref":"crates/biome_cli/src/commands/rage.rs:233-240","code":"  233 |                     let mut settings = Settings::default();\n  234 |                     settings\n  235 |                         .merge_with_configuration(\n  236 |                             configuration.clone(),\n  237 |                             None,\n  238 |                             extended_configurations,\n  239 |                         )\n  240 |                         .unwrap();","lines":8,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_cli/src/commands/rage.rs#L233-L240"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`setup_cli_subscriber` calls `File::create(file)...expect(\"Failed to create log file\")`. When the user passes `--log-file`/`BIOME_LOG_FILE` pointing at an unwritable path (no permission, missing parent dir), the CLI panics during logging setup instead of returning a clean diagnostic.","fix":"Propagate the error (make the function fallible) or fall back to stdout with a warning instead of `expect`.","locations":[{"ref":"crates/biome_cli/src/logging.rs:92-97","code":"   92 |     let make_writer = file\n   93 |         .map(File::create)\n   94 |         .transpose()\n   95 |         .expect(\"Failed to create log file\")\n   96 |         .optional()\n   97 |         .or_else(std::io::stdout);","lines":6,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_cli/src/logging.rs#L92-L97"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`DefaultWatcher::new` calls `recommended_watcher(tx).expect(\"watcher created\")`. Creating an OS file watcher can genuinely fail at runtime (e.g. inotify instance/fd limits exhausted on Linux), which would panic the CLI in `--watch` mode instead of surfacing a `WatcherDiagnostic`.","fix":"Make `new` fallible or store the construction error and surface it as a `WatcherEvent::Error` on first poll rather than panicking.","locations":[{"ref":"crates/biome_cli/src/runner/impls/watchers/default.rs:17-23","code":"   17 |     pub fn new() -> Self {\n   18 |         let (tx, rx) = channel();\n   19 |         Self {\n   20 |             rx,\n   21 |             watcher: Box::new(recommended_watcher(tx).expect(\"watcher created\")),\n   22 |         }\n   23 |     }","lines":7,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_cli/src/runner/impls/watchers/default.rs#L17-L23"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`should_hug_type` computes `union_type.types().len() - 1 == void_count` on a `TsUnionTypeVariantList`. The variant list is a separated list that can be empty in error-recovery parses (e.g. a malformed `type T = |;`). `len()` returning 0 makes the subtraction underflow and panic in debug builds. The expression is evaluated unconditionally before the `|| successful.count() == 1` branch.","fix":"Guard against an empty list, e.g. `union_type.types().len().checked_sub(1) == Some(void_count)`, or early-return when the list is empty.","locations":[{"ref":"crates/biome_js_formatter/src/utils/typescript.rs:94-95","code":"   94 |         union_type.types().len() - 1 == void_count && has_object_type && comments == 0\n   95 |             || successful.count() == 1","lines":2,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_js_formatter/src/utils/typescript.rs#L94-L95"}]},
{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`diagnostic.advices(&mut visitor).unwrap()` panics if a diagnostic advice's Display/io path ever returns an error. Diagnostics are produced from analyzing untrusted source, so a custom advice could trigger it; the function already returns Result.","fix":"Replace `.unwrap()` with `?`.","locations":[{"ref":"crates/biome_lsp/src/utils.rs:283","code":"  283 |     diagnostic.advices(&mut visitor).unwrap();","lines":1,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_lsp/src/utils.rs#L283"}]},
{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`element_in_slot` does `self.slots().nth(slot_index as usize).expect(\"Slot index out of bounds\")`. `SyntaxSlots::nth` returns None past the end (it just advances `pos`), so this `expect` is reachable and panics on an invalid index instead of returning None. The trailing `.map(|element| element)` is also a no-op identity map.","fix":"Return `Option<SyntaxElement>` and use `?`/`and_then`, or document/assert the precondition if the method is meant to be infallible. Remove the identity `.map(|element| element)`.","locations":[{"ref":"crates/biome_rowan/src/cursor/node.rs:73-80","code":"   73 |     pub(crate) fn element_in_slot(&self, slot_index: u32) -> Option<SyntaxElement> {\n   74 |         let slot = self\n   75 |             .slots()\n   76 |             .nth(slot_index as usize)\n   77 |             .expect(\"Slot index out of bounds\");\n   78 | \n   79 |         slot.map(|element| element)\n   80 |     }","lines":8,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_rowan/src/cursor/node.rs#L73-L80"}]},
{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`AstroFileHandler::output` slices `&input[..start.end() + 1]`. `start.end()` is the end of the `^---\\s*$` match (just before the line's newline); `+1` assumes a single `\\n` follows. With CRLF endings the byte at `start.end()` is `\\r`, so `start.end()+1` falls inside the `\\r\\n` pair (panic on non-char-boundary slice), and for a fence at EOF with no trailing byte it indexes out of bounds. Reached from CLI/LSP Astro formatting.","fix":"Avoid the unconditional +1; locate the next newline relative to `start.end()` or use a char-boundary-safe offset instead of assuming a single-byte newline immediately follows.","locations":[{"ref":"crates/biome_service/src/file_handlers/astro.rs:54-66","code":"   54 |     pub fn output(input: &str, output: &str) -> String {\n   55 |         let mut matches = Self::matches(input);\n   56 |         if let (Some(start), Some(end)) = (matches.next(), matches.next()) {\n   57 |             format!(\n   58 |                 \"{}{}{}\",\n   59 |                 &input[..start.end() + 1],\n   60 |                 output.trim_start(),\n   61 |                 &input[end.start()..]\n   62 |             )\n   63 |         } else {\n   64 |             input.to_string()\n   65 |         }\n   66 |     }","lines":13,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_service/src/file_handlers/astro.rs#L54-L66"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"The verbatim-marker source position is computed as `TextSize::from(self.state.buffer.len() as u32)`, truncating a `usize` byte length to `u32`. For output larger than 4 GiB this silently produces wrong offsets. Everywhere else the printer uses `text_len()`, which returns `TextSize` and asserts the u32 bound; this raw `as u32` is the only place that truncates instead of asserting. Practically unreachable for formatting, hence low.","fix":"Use `self.state.buffer.text_len()` (returns `TextSize`, asserts the bound) instead of `TextSize::from(self.state.buffer.len() as u32)`.","locations":[{"ref":"crates/biome_formatter/src/printer/mod.rs:296-302","code":"  296 |             FormatElement::Tag(StartVerbatim(kind)) => {\n  297 |                 if let VerbatimKind::Verbatim { length } = kind {\n  298 |                     self.state.verbatim_markers.push(TextRange::at(\n  299 |                         TextSize::from(self.state.buffer.len() as u32),\n  300 |                         *length,\n  301 |                     ));\n  302 |                 }","lines":7,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_formatter/src/printer/mod.rs#L296-L302"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`SourceMap::text_slice` computes `&self.text[range - self.offset]`; the precondition `range.start() >= self.offset` is enforced only by `debug_assert!`. In release, a range starting before `offset` underflows the `TextSize` subtraction (panic) or yields a bogus range causing an OOB slice panic. All current callers are internal, so this is defensive rather than an active bug.","fix":"Acceptable given internal usage; if hardening is desired, clamp or return a Result instead of relying on debug-only assertion.","locations":[{"ref":"crates/biome_formatter/src/source_map.rs:309-318","code":"  309 |     pub fn text_slice(&self, range: TextRange) -> &str {\n  310 |         debug_assert!(\n  311 |             range.start() >= self.offset,\n  312 |             \"Range {:?} should be bigger than offset {:?}.\",\n  313 |             range,\n  314 |             self.offset\n  315 |         );\n  316 | \n  317 |         &self.text[range - self.offset]\n  318 |     }","lines":10,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_formatter/src/source_map.rs#L309-L318"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`span.start().add(TextSize::from(offset))` / `span.end().add(...)` use unchecked `Add` on TextSize. For a span near u32::MAX plus an embedded-language frontmatter offset, this panics in debug / wraps in release. Values are partly derived from file content.","fix":"Use `checked_add` and return an error on overflow.","locations":[{"ref":"crates/biome_lsp/src/utils.rs:240-247","code":"  240 |     let span = if let Some(offset) = offset {\n  241 |         TextRange::new(\n  242 |             span.start().add(TextSize::from(offset)),\n  243 |             span.end().add(TextSize::from(offset)),\n  244 |         )\n  245 |     } else {\n  246 |         span\n  247 |     };","lines":8,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_lsp/src/utils.rs#L240-L247"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"The multiplicative growth check `new.saturating_mul(RATIO_Q) >= self.previous.saturating_mul(RATIO_GROWTH)` saturates both sides to u32::MAX for large lengths (previous*150 saturates above ~28.6M chars, new*100 above ~42.9M). Once both saturate, the comparison is always true, so `growth_streak` increments every iteration regardless of actual growth, and a large-but-stable file can be falsely flagged as conflicting after STREAK_LIMIT iterations. Also, when previous==new==0, `0*100 >= 0*150` is true, falsely counting a growth streak for an empty/unchanged value. Used in the fix-all loop in file_handlers/mod.rs.","fix":"Compute the ratio in u64 to avoid saturation, e.g. `(new as u64) * RATIO_Q as u64 >= (previous as u64) * RATIO_GROWTH as u64`, and guard the equal/zero case so a non-growing value does not accumulate a streak.","locations":[{"ref":"crates/biome_service/src/utils/growth_guard.rs:44","code":"   44 |         if new.saturating_mul(RATIO_Q) >= self.previous.saturating_mul(RATIO_GROWTH) {","lines":1,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_service/src/utils/growth_guard.rs#L44"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`RuleCategory::from_str` accepts \"action\" but not \"assist\", while the suppression-comment category for assists is \"assist\" (see `as_suppression_category` returning \"assist\" and the category registry naming it \"assist\"). In `to_analyzer_suppressions`, a whole-category assist suppression like `// biome-ignore assist` / `// biome-ignore-all assist` is parsed via `RuleCategory::from_str(key.name())` where `key.name()` == \"assist\"; this returns `Err`, so the suppression is silently dropped and the assist signals are NOT suppressed. The `Everything(assist)` suppression therefore never works.","fix":"Make `RuleCategory::from_str` accept \"assist\" (mapping it to `RuleCategory::Action`) in addition to (or instead of) \"action\", so it round-trips with `as_suppression_category`. Alternatively, in `to_analyzer_suppressions` map the `assist` key explicitly to `RuleCategory::Action` rather than going through `from_str`.","locations":[{"ref":"crates/biome_analyze/src/categories.rs:42-50","code":"   42 |     fn from_str(s: &str) -> Result<Self, Self::Err> {\n   43 |         match s {\n   44 |             \"syntax\" => Ok(Self::Syntax),\n   45 |             \"lint\" => Ok(Self::Lint),\n   46 |             \"action\" => Ok(Self::Action),\n   47 |             \"transformation\" => Ok(Self::Transformation),\n   48 |             _ => Err(\"Invalid rule category\"),\n   49 |         }\n   50 |     }","lines":9,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_analyze/src/categories.rs#L42-L50"},{"ref":"crates/biome_analyze/src/lib.rs:752-758","code":"  752 |         if key == category!(\"lint\") || key == category!(\"assist\") {\n  753 |             if let Ok(category) = RuleCategory::from_str(key.name()) {\n  754 |                 result.push(\n  755 |                     AnalyzerSuppression::everything(category, reason)\n  756 |                         .with_variant(&suppression.kind),\n  757 |                 );\n  758 |             }","lines":7,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_analyze/src/lib.rs#L752-L758"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"Prettier's `bracketSameLine` option is never migrated. The field is named `bracket_line` and the Deserializable macro defaults to camelCase serialized names, so it deserializes from the JSON key `bracketLine` - which is not a real Prettier option (the real option is `bracketSameLine`, with the older deprecated alias `jsxBracketSameLine`). Consequently a user's `bracketSameLine` setting is silently dropped and Biome's `bracketSameLine` always takes the default. Same misnamed field is used for both top-level config and per-override options; the doc-comment URL `#bracket-line` is also wrong.","fix":"Rename the field to `bracket_same_line` (deserializing from `bracketSameLine`), or add `#[deserializable(rename = \"bracketSameLine\")]`, and fix the doc-comment link.","locations":[{"ref":"crates/biome_cli/src/execute/migrate/prettier.rs:52-53","code":"   52 |     /// https://prettier.io/docs/en/options#bracket-line\n   53 |     bracket_line: bool,","lines":2,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_cli/src/execute/migrate/prettier.rs#L52-L53"},{"ref":"crates/biome_cli/src/execute/migrate/prettier.rs:112-116","code":"  112 |     single_quote: Option<bool>,\n  113 |     /// https://prettier.io/docs/en/options#bracket-spcing\n  114 |     bracket_spacing: Option<bool>,\n  115 |     /// https://prettier.io/docs/en/options#bracket-line\n  116 |     bracket_line: Option<bool>,","lines":5,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_cli/src/execute/migrate/prettier.rs#L112-L116"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"PrettierConfiguration's Default impl inverts two Prettier defaults. Prettier's real defaults are `semi: true` and `singleQuote: false`, but here `semi` defaults to `false` and `single_quote` to `true`. The derived Deserializable builds the struct via this Default and only overwrites fields present in the JSON, so any Prettier config that omits `semi` or `singleQuote` migrates to the wrong Biome setting (e.g. it produces `semicolons: asNeeded` and single quotes when Prettier would use semicolons and double quotes).","fix":"Set the Default impl to match Prettier: `semi: true` and `single_quote: false`.","locations":[{"ref":"crates/biome_cli/src/execute/migrate/prettier.rs:77-79","code":"   77 |             semi: false,\n   78 |             single_quote: true,\n   79 |             bracket_spacing: true,","lines":3,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_cli/src/execute/migrate/prettier.rs#L77-L79"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"Operator precedence bug in the diff `is_error` computation. The comment states a diff is an error 'in CI mode and in format/check command in non-write mode', i.e. `is_ci() || ((is_format() || is_check()) && !requires_write_access())`. Because `&&` binds tighter than `||`, the expression actually evaluates as `is_ci() || is_format() || (is_check() && !requires_write_access())`. As a result a `format` diff is always counted as an error regardless of write access, skewing the error count and exit code.","fix":"Group explicitly: `let is_error = execution.is_ci() || ((execution.is_format() || execution.is_check()) && !execution.requires_write_access());`","locations":[{"ref":"crates/biome_cli/src/runner/impls/collectors/default.rs:274-276","code":"  274 |                     let is_error = execution.is_ci()\n  275 |                         || (execution.is_format()\n  276 |                             || execution.is_check() && !execution.requires_write_access());","lines":3,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_cli/src/runner/impls/collectors/default.rs#L274-L276"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"noInvalidGridAreas decides whether grid-template-areas rows are consistent by comparing the UTF-8 byte length of the trimmed row string (cleaned_text.len() != first_len) instead of comparing the number of cell tokens. The rule's documented semantics require the same number of cell tokens per row. Rows with the same byte length but different token counts are wrongly accepted, e.g. `\"aaa b\"` (2 tokens, len 5) vs `\"a b c\"` (3 tokens, len 5) is a false negative; multi-byte cell names also distort the comparison.","fix":"Compare token counts, not byte lengths: let first_len = first_prop.split_whitespace().count(); and compare cleaned_text.split_whitespace().count() != first_len.","locations":[{"ref":"crates/biome_css_analyze/src/lint/correctness/no_invalid_grid_areas.rs:194-218","code":"  194 |     let first_prop = inner_string_text(&grid_areas_props[0].0);\n  195 |     let first_len = first_prop.len();\n  196 |     let mut shortest = &grid_areas_props[0];\n  197 | \n  198 |     for grid_areas_prop in &grid_areas_props {\n  199 |         let cleaned_text = inner_string_text(&grid_areas_prop.0);\n  200 |         // Check if the grid areas are empty\n  201 |         if cleaned_text.is_empty() {\n  202 |             return Some(UseConsistentGridAreasState {\n  203 |                 text: None,\n  204 |                 span: grid_areas_prop.1,\n  205 |                 reason: GridAreaValidationError::EmptyGridArea,\n  206 |             });\n  207 |         }\n  208 |         // Check if all elements have the same length\n  209 |         if cleaned_text.len() != first_len {\n  210 |             if cleaned_text.len() < inner_string_text(&shortest.0).len() {\n  211 |                 shortest = grid_areas_prop;\n  212 |             }\n  213 |             return Some(UseConsistentGridAreasState {\n  214 |                 text: None,\n  215 |                 span: shortest.1,\n  216 |                 reason: GridAreaValidationError::InconsistentCellCount,\n  217 |             });\n  218 |         }","lines":25,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_css_analyze/src/lint/correctness/no_invalid_grid_areas.rs#L194-L218"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"The range-format frontmatter-offset guard is broken in two ways. `format_range.start() - TextSize::from(offset)` uses TextSize's plain `Sub`, so when `start < offset` the subtraction underflows (panics in debug, wraps in release) BEFORE the comparison is evaluated. Additionally `>= TextSize::from(0)` is an unsigned comparison that is always true, so the `else` branch is unreachable. The correct pattern is already used in analysis.rs (`cursor_range.start().gt(&TextSize::from(offset))`). For a Vue/Astro/Svelte file where a range-format request starts inside the leading frontmatter region, this is reachable from untrusted editor input.","fix":"Mirror analysis.rs: only subtract when `format_range.start() >= TextSize::from(offset)`, otherwise keep `format_range`. Use `checked_sub` to be safe.","locations":[{"ref":"crates/biome_lsp/src/handlers/formatting.rs:174-185","code":"  174 |     let format_range = if let Some(offset) = offset {\n  175 |         if format_range.start() - TextSize::from(offset) >= TextSize::from(0) {\n  176 |             TextRange::new(\n  177 |                 format_range.start().sub(TextSize::from(offset)),\n  178 |                 format_range.end().sub(TextSize::from(offset)),\n  179 |             )\n  180 |         } else {\n  181 |             format_range\n  182 |         }\n  183 |     } else {\n  184 |         format_range\n  185 |     };","lines":12,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_lsp/src/handlers/formatting.rs#L174-L185"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`find_jsdoc_for_exported_symbol`'s `ImportSymbol::Default` re-export branch pushes the target module onto the work `stack` without first guarding with `seen_paths.insert(...)`. Every other branch in this function (Named, blanket) and the entire sibling `find_js_exported_symbol` (whose Default branch *does* guard) use the visited-set check. A cyclic default re-export (e.g. `a` re-exports default from `b` which re-exports default from `a`, or a self-cycle) makes this loop push modules forever, hanging the query and growing memory unboundedly. This is a copy-paste omission relative to `find_js_exported_symbol`.","fix":"Add the `&& seen_paths.insert(path.to_path_buf())` guard to the Default branch, mirroring `find_js_exported_symbol`.","locations":[{"ref":"crates/biome_module_graph/src/db/queries.rs:144-150","code":"  144 |                     ImportSymbol::Default => {\n  145 |                         if let Ok(path) = reexport.import.resolved_path.as_deref()\n  146 |                             && let Some(module) = db.module_for_path(path)\n  147 |                         {\n  148 |                             stack.push(SymbolFromModuleInfo::new(db, symbol.name(db), module));\n  149 |                         }\n  150 |                     }","lines":7,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_module_graph/src/db/queries.rs#L144-L150"},{"ref":"crates/biome_module_graph/src/db/queries.rs:66-73","code":"   66 |                     ImportSymbol::Default => {\n   67 |                         if let Ok(path) = reexport.import.resolved_path.as_deref()\n   68 |                             && seen_paths.insert(path.to_path_buf())\n   69 |                             && let Some(module) = db.module_for_path(path)\n   70 |                         {\n   71 |                             stack.push(SymbolFromModuleInfo::new(db, symbol.name(db), module));\n   72 |                         }\n   73 |                     }","lines":8,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_module_graph/src/db/queries.rs#L66-L73"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`indentation_trivia_pieces` is documented to return the run of whitespace pieces immediately preceding the token (the indentation, stopping at the first non-whitespace). The `skip_count` math is wrong in two ways. (1) `.map(|pos| pos + 1)` skips one extra piece: for leading trivia `[Newline, Whitespace(\"    \")]` it computes `skip_count = 0` and returns `[Newline, Whitespace]`, wrongly including the newline. (2) For an all-whitespace leading trivia (`position` returns `None`), `.unwrap_or(0)` yields `skip_count = len`, returning EMPTY instead of all the whitespace. This function feeds code actions (no_switch_declarations, use_single_var_declarator, biome_migrate) that copy a token's indentation onto a newly created token, so the bug injects a stray newline or drops indentation, corrupting the generated fix's formatting.","fix":"Count trailing-whitespace pieces correctly: `let pieces = self.leading_trivia().pieces(); let kept = pieces.clone().rev().position(|x| !x.is_whitespace()).unwrap_or(pieces.len()); let skip_count = pieces.len() - kept; pieces.skip(skip_count)`. Add tests for `[Newline, Whitespace]`, all-whitespace, and no-whitespace inputs.","locations":[{"ref":"crates/biome_rowan/src/syntax/token.rs:434-446","code":"  434 |     /// Return whitespace that juxtapose the token until the first non-whitespace item.\n  435 |     pub fn indentation_trivia_pieces(\n  436 |         &self,\n  437 |     ) -> impl ExactSizeIterator<Item = SyntaxTriviaPiece<L>> + Clone + use<L> {\n  438 |         let leading_trivia = self.leading_trivia().pieces();\n  439 |         let skip_count = leading_trivia.len()\n  440 |             - leading_trivia\n  441 |                 .rev()\n  442 |                 .position(|x| !x.is_whitespace())\n  443 |                 .map(|pos| pos + 1)\n  444 |                 .unwrap_or(0);\n  445 |         self.leading_trivia().pieces().skip(skip_count)\n  446 |     }","lines":13,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_rowan/src/syntax/token.rs#L434-L446"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In the watcher batch-unload loops, when `find_project_for_path` returns `None` for a path, the function does `return Ok(vec![])`, which discards all diagnostics accumulated for earlier paths AND skips all remaining paths in the batch. A single path outside any project (common when rename/remove events touch mixed locations) aborts unloading of the rest of the batch. The per-path `index_path` correctly handles 'no project' as a per-path skip; the loop variants must do the same.","fix":"Replace `else { return Ok(vec![]); }` with `else { continue; }` in both `unload_files` and `unload_paths`.","locations":[{"ref":"crates/biome_service/src/scanner/watcher.rs:391-396","code":"  391 |         for path in paths {\n  392 |             let Some(project_key) = workspace.find_project_for_path(&path) else {\n  393 |                 return Ok(vec![]);\n  394 |             };\n  395 |             diagnostics.extend(workspace.unload_file(&path, project_key)?);\n  396 |         }","lines":6,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_service/src/scanner/watcher.rs#L391-L396"},{"ref":"crates/biome_service/src/scanner/watcher.rs:410-416","code":"  410 |         for path in &paths {\n  411 |             let Some(project_key) = workspace.find_project_for_path(path) else {\n  412 |                 return Ok(vec![]);\n  413 |             };\n  414 |             let result = workspace.unload_path(path, project_key)?;\n  415 |             diagnostics.extend(result);\n  416 |         }","lines":7,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_service/src/scanner/watcher.rs#L410-L416"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"The `Debug` impl for `RuleCategories` never reports the `Transformation` category: it checks Syntax/Lint/Assist but omits the `Categories::Transformation` branch before `list.finish()`. A `RuleCategories` value that contains only `Transformation` will Debug-format as an empty list (and `Display` delegates to `Debug`), producing misleading diagnostic/log output. The `serde::Serialize` impl right below correctly includes Transformation, so this is an inconsistency.","fix":"Add `if self.0.contains(Categories::Transformation) { list.entry(&RuleCategory::Transformation); }` before `list.finish()`.","locations":[{"ref":"crates/biome_analyze/src/categories.rs:266-284","code":"  266 | impl Debug for RuleCategories {\n  267 |     fn fmt(&self, f: &mut Formatter<'_>) -> std::fmt::Result {\n  268 |         if self.0.is_empty() {\n  269 |             write!(f, \"No categories\")\n  270 |         } else {\n  271 |             let mut list = f.debug_list();\n  272 |             if self.0.contains(Categories::Syntax) {\n  273 |                 list.entry(&RuleCategory::Syntax);\n  274 |             }\n  275 |             if self.0.contains(Categories::Lint) {\n  276 |                 list.entry(&RuleCategory::Lint);\n  277 |             }\n  278 |             if self.0.contains(Categories::Assist) {\n  279 |                 list.entry(&RuleCategory::Action);\n  280 |             }\n  281 |             list.finish()\n  282 |         }\n  283 |     }\n  284 | }","lines":19,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_analyze/src/categories.rs#L266-L284"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `get_sorted_attributes`, if `replace_token` returns `None` for any attribute (the `?` at the end of the whitespace-fixup block), the entire function returns `None`, discarding the fully-sorted result. Callers interpret `None` as \"could not sort\", so a single failed whitespace token replacement aborts the whole sort/assist action even though the ordering was computed successfully. This silently drops a valid sorted-attributes code action.","fix":"On a failed `replace_token`, keep the original `sorted_attr` (skip just the whitespace fixup for that element) instead of propagating `None` for the whole list, or document and handle the failure so a valid sort is still returned.","locations":[{"ref":"crates/biome_analyze/src/shared/sort_attributes.rs:66-106","code":"   66 |     pub fn get_sorted_attributes<F>(&self, comparator: F) -> Option<Vec<T>>\n   67 |     where\n   68 |         F: FnMut(&T, &T) -> Ordering,\n   69 |     {\n   70 |         let mut attrs = self.attrs.clone();\n   71 |         attrs.sort_by(comparator);\n   72 | \n   73 |         let mut iter = attrs.iter_mut().peekable();\n   74 | \n   75 |         while let Some(sorted_attr) = iter.next() {\n   76 |             if iter.peek().is_some() {\n   77 |                 // Make sure sorted_attr has trailing whitespace if it is not the last attribute in the group\n   78 |                 let ends_in_whitespace = sorted_attr\n   79 |                     .node()\n   80 |                     .syntax()\n   81 |                     .last_trailing_trivia()\n   82 |                     .and_then(|last_trivia| last_trivia.last())\n   83 |                     .is_some_and(|last| last.is_whitespace() || last.is_newline());\n   84 | \n   85 |                 let next_starts_with_whitespace = iter\n   86 |                     .peek()\n   87 |                     .and_then(|next_sorted_attr| {\n   88 |                         next_sorted_attr.node().syntax().first_leading_trivia()\n   89 |                     })\n   90 |                     .and_then(|first_trivia| first_trivia.first())\n   91 |                     .is_some_and(|first| first.is_whitespace() || first.is_newline());\n   92 | \n   93 |                 if !ends_in_whitespace && !next_starts_with_whitespace {\n   94 |                     let old_last_token = sorted_attr.node().syntax().last_token().unwrap();\n   95 |                     let new_last_token =\n   96 |                         old_last_token.with_trailing_trivia([(TriviaPieceKind::Whitespace, \" \")]);\n   97 | \n   98 |                     *sorted_attr = sorted_attr\n   99 |                         .clone()\n  100 |                         .replace_token(old_last_token, new_last_token)?;\n  101 |                 }\n  102 |             }\n  103 |         }\n  104 | \n  105 |         Some(attrs)\n  106 |     }","lines":41,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_analyze/src/shared/sort_attributes.rs#L66-L106"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`format_with_errors` is only applied when `--formatter-enabled` is also passed in `biome ci`. The assignment sits inside `if self.formatter_enabled.is_some()`, so `biome ci --format-with-errors=true` (without `--formatter-enabled`) silently drops the setting. check.rs applies the two options in separate independent `if` blocks, confirming this is an unintended coupling / copy-paste divergence.","fix":"Move the `format_with_errors` assignment out of the `formatter_enabled` block into its own `if self.format_with_errors.is_some()` guard, mirroring check.rs.","locations":[{"ref":"crates/biome_cli/src/commands/ci.rs:187-190","code":"  187 |         if self.formatter_enabled.is_some() {\n  188 |             formatter.enabled = self.formatter_enabled;\n  189 |             formatter.format_with_errors = self.format_with_errors;\n  190 |         }","lines":4,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_cli/src/commands/ci.rs#L187-L190"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`check_fix_incompatible_arguments` passes the explanatory reason string as the `subcommand` argument of `CliDiagnostic::unexpected_argument(argument, subcommand)`. That second argument is used by `CliAdvice` to build a help command `biome <subcommand> --help`, so the produced advice becomes a nonsensical command like ``biome `--reason` is only valid when `--suppress` is used. --help``. The actual reason text is never shown as a reason and the suggested command is broken.","fix":"Use a diagnostic variant that takes a reason/explanation (e.g. an incompatible/illegal-argument diagnostic) rather than `unexpected_argument`, whose second parameter must be a subcommand name.","locations":[{"ref":"crates/biome_cli/src/commands/mod.rs:972-977","code":"  972 |     } else if !suppress && suppression_reason.is_some() {\n  973 |         return Err(CliDiagnostic::unexpected_argument(\n  974 |             \"--reason\",\n  975 |             \"`--reason` is only valid when `--suppress` is used.\",\n  976 |         ));\n  977 |     };","lines":6,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_cli/src/commands/mod.rs#L972-L977"},{"ref":"crates/biome_cli/src/diagnostics.rs:361-366","code":"  361 |     pub fn unexpected_argument(argument: impl Into<String>, subcommand: impl Into<String>) -> Self {\n  362 |         Self::UnexpectedArgument(UnexpectedArgument {\n  363 |             argument: argument.into(),\n  364 |             help: CliAdvice::new_with_help(subcommand),\n  365 |         })\n  366 |     }","lines":6,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_cli/src/diagnostics.rs#L361-L366"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`SuggestionsVisitor::last_diagnostic_length` is initialized to 0 and read at line 399 but never written. Once `record_frame` has pushed at least one suggestion, `self.suggestions.len()` is non-zero, so `0 != current_diagnostic_length` is always true and every subsequent `record_log` takes the `last_mut().expect(...)` branch, OVERWRITING the last suggestion's text instead of buffering it. Produces wrong/dropped advice text in `--reporter=json` output.","fix":"Update `last_diagnostic_length` after consuming it (e.g. set it to `self.suggestions.len()` at the end of `record_frame`/`record_log`), or remove the field and rework the buffering.","locations":[{"ref":"crates/biome_cli/src/reporter/json.rs:385-414","code":"  385 | struct SuggestionsVisitor {\n  386 |     suggestions: Vec<JsonSuggestion>,\n  387 |     current_message: Option<String>,\n  388 |     last_diagnostic_length: usize,\n  389 | }\n  390 | \n  391 | impl Visit for SuggestionsVisitor {\n  392 |     fn record_log(&mut self, _category: LogCategory, text: &dyn Display) -> std::io::Result<()> {\n  393 |         let message = {\n  394 |             let mut message = MarkupBuf::default();\n  395 |             let mut fmt = Formatter::new(&mut message);\n  396 |             fmt.write_markup(markup!({ { text } }))?;\n  397 |             markup_to_string(&message).expect(\"Invalid markup\")\n  398 |         };\n  399 |         let current_diagnostic_length = self.suggestions.len();\n  400 | \n  401 |         if self.last_diagnostic_length != current_diagnostic_length {\n  402 |             let last_suggestion = self\n  403 |                 .suggestions\n  404 |                 .last_mut()\n  405 |                 .expect(\"No suggestions to append to\");\n  406 |             last_suggestion.text = message;\n  407 |         } else if let Some(current_message) = self.current_message.as_mut() {\n  408 |             current_message.push_str(&message);\n  409 |         } else {\n  410 |             self.current_message = Some(message);\n  411 |         }\n  412 | \n  413 |         Ok(())\n  414 |     }","lines":30,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_cli/src/reporter/json.rs#L385-L414"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"JUnit reporter creates a brand-new `TestSuite` per diagnostic (`TestSuite::new(path)` inside the per-diagnostic loop) instead of grouping diagnostics by file into one suite per file. The result is many single-test suites with duplicate names for the same file, defeating the purpose of JUnit suites and producing oddly-grouped reports.","fix":"Group diagnostics by their `Resource::File` path into a `BTreeMap<path, TestSuite>` first, add each `TestCase` to the matching suite, then add the suites to the report once.","locations":[{"ref":"crates/biome_cli/src/reporter/junit.rs:88-132","code":"   88 |         for diagnostic in diagnostics {\n   89 |             let mut status = TestCaseStatus::non_success(NonSuccessKind::Failure);\n   90 |             let message = format!(\"{}\", JunitDiagnostic { diagnostic });\n   91 |             status.set_message(message.clone());\n   92 | \n   93 |             let location = diagnostic.location();\n   94 | \n   95 |             if let (Some(span), Some(source_code), Some(resource)) =\n   96 |                 (location.span, location.source_code, location.resource)\n   97 |             {\n   98 |                 let source = SourceFile::new(source_code);\n   99 |                 let start = source.location(span.start())?;\n  100 | \n  101 |                 status.set_description(format!(\n  102 |                     \"line {row:?}, col {col:?}, {body}\",\n  103 |                     row = start.line_number.get(),\n  104 |                     col = start.column_number.get(),\n  105 |                     body = message\n  106 |                 ));\n  107 |                 let mut case = TestCase::new(\n  108 |                     format!(\n  109 |                         \"org.biome.{}\",\n  110 |                         diagnostic\n  111 |                             .category()\n  112 |                             .map(|c| c.name())\n  113 |                             .unwrap_or_default()\n  114 |                             .replace('/', \".\")\n  115 |                     ),\n  116 |                     status,\n  117 |                 );\n  118 | \n  119 |                 if let Resource::File(path) = resource {\n  120 |                     let mut test_suite = TestSuite::new(path);\n  121 |                     case.extra\n  122 |                         .insert(\"line\".into(), start.line_number.get().to_string().into());\n  123 |                     case.extra.insert(\n  124 |                         \"column\".into(),\n  125 |                         start.column_number.get().to_string().into(),\n  126 |                     );\n  127 |                     test_suite\n  128 |                         .extra\n  129 |                         .insert(\"package\".into(), \"org.biome\".into());\n  130 |                     test_suite.add_test_case(case);\n  131 |                     self.0.add_test_suite(test_suite);\n  132 |                 }","lines":45,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_cli/src/reporter/junit.rs#L88-L132"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"noImportantStyles autofix corrupts trivia when the `!important` node has both leading and trailing trivia. The first `if let` block sets the property's trailing trivia from the `!important` node's leading trivia (line 97). The second `if let` block then unconditionally overwrites the property's trailing trivia again with the node's trailing trivia (line 115), discarding what the first block set. Both blocks also redundantly re-apply the property's own existing leading trivia. So in a case like `color: red !important /* c */;` the leading whitespace captured by the first block is lost.","fix":"Compute the final leading and trailing trivia once (combining the !important node's leading and trailing pieces) and apply with_leading_trivia_pieces/with_trailing_trivia_pieces a single time; do not let the second branch clobber the first.","locations":[{"ref":"crates/biome_css_analyze/src/lint/complexity/no_important_styles.rs:94-116","code":"   94 |         if let Some(leading_trivia) = node.syntax().first_leading_trivia() {\n   95 |             declaration_property = declaration_property\n   96 |                 .clone()\n   97 |                 .with_trailing_trivia_pieces(leading_trivia.pieces())?\n   98 |                 .with_leading_trivia_pieces(\n   99 |                     declaration_property\n  100 |                         .syntax()\n  101 |                         .first_leading_trivia()?\n  102 |                         .pieces(),\n  103 |                 )?;\n  104 |         }\n  105 | \n  106 |         if let Some(trailing_trivia) = node.syntax().last_trailing_trivia() {\n  107 |             declaration_property = declaration_property\n  108 |                 .clone()\n  109 |                 .with_leading_trivia_pieces(\n  110 |                     declaration_property\n  111 |                         .syntax()\n  112 |                         .first_leading_trivia()?\n  113 |                         .pieces(),\n  114 |                 )?\n  115 |                 .with_trailing_trivia_pieces(trailing_trivia.pieces())?;\n  116 |         }","lines":23,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_css_analyze/src/lint/complexity/no_important_styles.rs#L94-L116"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"noDuplicateAtImportRules normalizes import URLs with a fragile chain of string replacements: .replace(\"url(\", \"\").replace(')', \"\").replace('\"', \"'\"). This breaks for URLs that legitimately contain `)` or the substring `url(`, and normalizes only double quotes (not single quotes, and never strips them). An unquoted `url(a.css)` normalizes to `a.css` while `'a.css'` normalizes to `'a.css'`, so equivalent imports written with different quoting/url syntax are not recognized as duplicates.","fix":"Extract the inner string/URL token semantically from the parsed URL node instead of using string replacement on the trimmed text.","locations":[{"ref":"crates/biome_css_analyze/src/lint/suspicious/no_duplicate_at_import_rules.rs:85-92","code":"   85 |             let import_url = import_rule\n   86 |                 .url()\n   87 |                 .ok()?\n   88 |                 .to_trimmed_text()\n   89 |                 .to_lowercase_cow()\n   90 |                 .replace(\"url(\", \"\")\n   91 |                 .replace(')', \"\")\n   92 |                 .replace('\"', \"'\");","lines":8,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_css_analyze/src/lint/suspicious/no_duplicate_at_import_rules.rs#L85-L92"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"noIrregularWhitespace skips checking any token that carries leading or trailing comments (`!token.has_leading_comments() && !token.has_trailing_comments()`). Irregular whitespace inside or around a token that also happens to have an attached comment is never reported. The comment guard does not belong in irregular-whitespace detection.","fix":"Remove the comment-presence guard; check `token.text().chars().any(is_irregular_whitespace)` unconditionally.","locations":[{"ref":"crates/biome_css_analyze/src/lint/suspicious/no_irregular_whitespace.rs:88-90","code":"   88 |     for token in syntax.descendants_tokens(Direction::Next) {\n   89 |         if !token.has_leading_comments()\n   90 |             && !token.has_trailing_comments()","lines":3,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_css_analyze/src/lint/suspicious/no_irregular_whitespace.rs#L88-L90"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`is_global_suppressed` guards the suppression check with `if start >= TextSize::from(0)`. `TextSize` is an unsigned offset, so `start >= 0` is always true and the guard is dead. The comment says \"global suppression comments must start at the beginning of the file\", but that check is never actually performed: any node's leading comments are checked for global suppression, not just a node at file offset 0. The intended condition was `start == TextSize::from(0)`.","fix":"Change to `if start == TextSize::from(0)` to match the comment/intent, or remove the dead `start`/`if` and the misleading comment if global suppression is genuinely allowed on any leading comment.","locations":[{"ref":"crates/biome_formatter/src/comments.rs:940-950","code":"  940 |         let start = node.text_range_with_trivia().start();\n  941 |         // global suppression comments must start at the beginning of the file\n  942 |         if start >= TextSize::from(0) {\n  943 |             let is_global_suppression = self.data.is_global_suppression;\n  944 |             // only leading comments can be global suppression comments\n  945 |             return self\n  946 |                 .leading_comments(node)\n  947 |                 .iter()\n  948 |                 .any(|comment| is_global_suppression(comment.piece().text()));\n  949 |         }\n  950 |         false","lines":11,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_formatter/src/comments.rs#L940-L950"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"Write references are pushed into `scope.read_references` (not `write_references`) in both the `Write` and `HoistedWrite` arms of `SemanticModelBuilder::push_event`. As a result `SemanticModelScopeData::write_references` is never populated anywhere in the crate, making the field dead and the closure-capture code that reads `scope.write_references` effectively a no-op (it always iterates an empty vector). Capturing of writes still happens incidentally because writes land in `read_references`, but the field name is actively misleading and any future code relying on `write_references` will silently get nothing.","fix":"Push `reference_id` into `scope.write_references` in the Write/HoistedWrite arms, or remove the `write_references` field and the dead reads in `closure.rs` if a single combined list is intended.","locations":[{"ref":"crates/biome_js_semantic/src/semantic_model/builder.rs:340-375","code":"  340 |             Write {\n  341 |                 range,\n  342 |                 declaration_at,\n  343 |                 scope_id,\n  344 |             } => {\n  345 |                 let binding_id = self.bindings_by_start[&declaration_at];\n  346 |                 let binding = &mut self.bindings[binding_id.index()];\n  347 |                 let reference_id = ReferenceId::new(binding_id, binding.references.len());\n  348 |                 binding.references.push(SemanticModelReference {\n  349 |                     range_start: range.start(),\n  350 |                     ty: SemanticModelReferenceType::Write { hoisted: false },\n  351 |                 });\n  352 | \n  353 |                 let scope = &mut self.scopes[scope_id.index()];\n  354 |                 scope.read_references.push(reference_id);\n  355 | \n  356 |                 self.declared_at_by_start.insert(range.start(), binding_id);\n  357 |             }\n  358 |             Hoist {"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `is_class_used_in_component_tree`'s BFS, the `ModuleInfoKind::Js` arm checks `referenced_classes` AND enqueues the module's static/dynamic import targets to continue traversal, but the `ModuleInfoKind::Html` arm only checks `html_info.referenced_classes` and never enqueues `html_info.static_import_paths`/`dynamic_import_paths`. Consequently a CSS class used only inside a JS/JSX component imported from an HTML file's `<script>` is not detected as used, which can produce a false positive (class reported unused) in rules like `noUnusedClasses`. `transitive_importers_of` does walk HTML import paths, so the asymmetry is here.","fix":"In the HTML arm, after the `referenced_classes` check, enqueue resolved modules for `html_info.static_import_paths`/`dynamic_import_paths` like the JS arm does.","locations":[{"ref":"crates/biome_module_graph/src/db/queries/css.rs:413-421","code":"  413 |             ModuleInfoKind::Html(html_info) => {\n  414 |                 if html_info\n  415 |                     .referenced_classes\n  416 |                     .iter()\n  417 |                     .any(|r| r.matches(class_name.name(db).as_str()))\n  418 |                 {\n  419 |                     return true;\n  420 |                 }\n  421 |             }","lines":9,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_module_graph/src/db/queries/css.rs#L413-L421"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`is_protected` is missing the `.filter(|support_kind| !support_kind.is_not_requested())` that all three sibling methods (`is_ignored`, `is_not_supported`, `is_not_enabled`) apply before their `.all(...)` check. As a result, a file whose requested features are all genuinely protected but which also carries a `NotRequested` feature reports `is_protected() == false`, inconsistent with the documented 'all the features marked it as protected' semantics and with the parallel methods. Looks like a copy/omission bug.","fix":"Add `.filter(|support_kind| !support_kind.is_not_requested())` before `.all(...)` in `is_protected`, matching the sibling methods.","locations":[{"ref":"crates/biome_service/src/workspace.rs:354-359","code":"  354 |     /// The file is protected only if all the features marked it as protected\n  355 |     pub fn is_protected(&self) -> bool {\n  356 |         self.0\n  357 |             .iter()\n  358 |             .all(|support_kind| support_kind.is_protected())\n  359 |     }","lines":6,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_service/src/workspace.rs#L354-L359"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`ActionCategory::to_str` places the `.biome` suffix inconsistently across variants: QuickFix -> `quickfix.biome.{tag}`, Source::Other -> `source.biome.{tag}`, but Refactor::Other -> `refactor.{tag}.biome` and Generic -> `{tag}.biome`. Because `matches(filter)` is a `starts_with` against this string, the inconsistent placement means filters like `source.fixAll` will not match `Source(Other(\"fixAll\"))` (which becomes `source.biome.fixAll`), and the LSP `quickfix` filtering relies on these prefixes. The encoding is not self-consistent with the documented LSP CodeActionKind hierarchy (e.g. `quickfix.biome.{tag}` breaks the `quickfix` -> `quickfix.x` hierarchy expected by clients).","fix":"Standardize the kind string format so the category hierarchy comes first and the `.biome` vendor suffix is appended consistently (e.g. always `{kind-hierarchy}.biome`), matching the doctest expectations and LSP semantics.","locations":[{"ref":"crates/biome_analyze/src/categories.rs:138-171","code":"  138 |     pub fn to_str(&self) -> Cow<'static, str> {\n  139 |         match self {\n  140 |             Self::QuickFix(tag) => {\n  141 |                 if tag.is_empty() {\n  142 |                     Cow::Borrowed(\"quickfix.biome\")\n  143 |                 } else {\n  144 |                     Cow::Owned(format!(\"quickfix.biome.{tag}\"))\n  145 |                 }\n  146 |             }\n  147 | \n  148 |             Self::Refactor(RefactorKind::None) => Cow::Borrowed(\"refactor.biome\"),\n  149 |             Self::Refactor(RefactorKind::Extract) => Cow::Borrowed(\"refactor.extract.biome\"),\n  150 |             Self::Refactor(RefactorKind::Inline) => Cow::Borrowed(\"refactor.inline.biome\"),\n  151 |             Self::Refactor(RefactorKind::Rewrite) => Cow::Borrowed(\"refactor.rewrite.biome\"),\n  152 |             Self::Refactor(RefactorKind::Other(tag)) => Cow::Owned(format!(\"refactor.{tag}.biome\")),\n  153 | \n  154 |             Self::Source(SourceActionKind::None) => Cow::Borrowed(\"source.biome\"),\n  155 |             Self::Source(SourceActionKind::FixAll) => Cow::Borrowed(\"source.fixAll.biome\"),\n  156 |             Self::Source(SourceActionKind::OrganizeImports) => {\n  157 |                 Cow::Borrowed(\"source.organizeImports.biome\")\n  158 |             }\n  159 |             Self::Source(SourceActionKind::Other(tag)) => Cow::Owned(format!(\"source.biome.{tag}\")),\n  160 | \n  161 |             Self::Other(other_action) => match other_action {\n  162 |                 OtherActionCategory::InlineSuppression => {\n  163 |                     Cow::Borrowed(\"quickfix.suppressRule.inline.biome\")\n  164 |                 }\n  165 |                 OtherActionCategory::ToplevelSuppression => {\n  166 |                     Cow::Borrowed(\"quickfix.suppressRule.topLevel.biome\")\n  167 |                 }\n  168 |                 OtherActionCategory::Generic(tag) => Cow::Owned(format!(\"{tag}.biome\")),\n  169 |             },\n  170 |         }\n  171 |     }","lines":34,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_analyze/src/categories.rs#L138-L171"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`is_version_newer`/upgrade relies on `node_semver::Version` ordering, but the latest-version endpoint and the embedded `VERSION` may include prerelease tags. With semver precedence a prerelease (e.g. `2.0.0-beta.1`) is older than its release, and Biome uses odd-minor prereleases, so depending on what `latest.txt` serves, `biome upgrade` on a prerelease build may refuse a valid upgrade or offer an unexpected channel switch.","fix":"Define explicit channel/prerelease handling rather than relying on raw semver `>`.","locations":[{"ref":"crates/biome_cli/src/commands/upgrade.rs:110-115","code":"  110 |     if !is_version_newer(VERSION, &latest_version)? {\n  111 |         session.app.console.log(markup! {\n  112 |             \"Biome is already up to date at version \"<Emphasis>{VERSION}<\/Emphasis>\".\"\n  113 |         });\n  114 |         return Ok(());\n  115 |     }","lines":6,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_cli/src/commands/upgrade.rs#L110-L115"},{"ref":"crates/biome_cli/src/commands/upgrade.rs:211-215","code":"  211 | fn is_version_newer(current: &str, latest: &str) -> Result<bool, CliDiagnostic> {\n  212 |     let current = parse_version(current)?;\n  213 |     let latest = parse_version(latest)?;\n  214 |     Ok(latest > current)\n  215 | }","lines":5,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_cli/src/commands/upgrade.rs#L211-L215"}]},
{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The 'ignore file has been successfully migrated' message can fire spuriously. `old_biome_config` is captured before the Prettier/ESLint config is merged in, but the message is gated on `write && biome_config != old_biome_config`. So even when the ignore file contributes no patterns, the message still prints whenever the surrounding Prettier/ESLint migration changed the config, falsely claiming the ignore file was migrated.","fix":"Gate the message on whether the ignore patterns were actually non-empty and applied (capture the config state immediately before extending includes and compare), or only emit inside the `!ignore_patterns.patterns.is_empty()` branch.","locations":[{"ref":"crates/biome_cli/src/execute/migrate.rs:227-241","code":"  227 |             if let Ok(ignore_patterns) = ignorefile::read_ignore_file(fs, prettier::IGNORE_FILE) {\n  228 |                 if !ignore_patterns.patterns.is_empty() {\n  229 |                     biome_config\n  230 |                         .formatter\n  231 |                         .get_or_insert(Default::default())\n  232 |                         .includes\n  233 |                         .get_or_insert(Default::default())\n  234 |                         .extend(ignore_patterns.patterns);\n  235 |                 }\n  236 |                 if write && biome_config != old_biome_config {\n  237 |                     console.log(markup!{\n  238 |                         <Info><Emphasis>{prettier::IGNORE_FILE}<\/Emphasis>\" has been successfully migrated.\"<\/Info>\n  239 |                     });\n  240 |                 }\n  241 |             }","lines":15,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_cli/src/execute/migrate.rs#L227-L241"},{"ref":"crates/biome_cli/src/execute/migrate.rs:310-324","code":"  310 |             if let Ok(ignore_patterns) = i {"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"Per-override `objectWrap` is silently dropped when migrating Prettier overrides. In `TryFrom<Override>` the `options.object_wrap` field is never read, so an override that sets `objectWrap` has no effect. Additionally `OverrideOptions::object_wrap` is typed as `ObjectWrap` (not `Option<ObjectWrap>`) unlike every other override option, so it cannot distinguish 'unset' from 'preserve'.","fix":"Make `object_wrap` an `Option<ObjectWrap>` and, when set, emit it into the override formatter's `expand` option (mirroring the top-level conversion).","locations":[{"ref":"crates/biome_cli/src/execute/migrate/prettier.rs:126","code":"  126 |     object_wrap: ObjectWrap,","lines":1,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_cli/src/execute/migrate/prettier.rs#L126"},{"ref":"crates/biome_cli/src/execute/migrate/prettier.rs:319-416","code":"  319 | impl TryFrom<Override> for biome_configuration::OverridePattern {\n  320 |     type Error = Error;\n  321 |     fn try_from(Override { files, options }: Override) -> anyhow::Result<Self> {\n  322 |         let mut result = Self {\n  323 |             includes: Some(biome_configuration::OverrideGlobs::Globs(\n  324 |                 files\n  325 |                     .into_iter()\n  326 |                     .filter_map(|glob| glob.parse().ok())\n  327 |                     .collect(),\n  328 |             )),\n  329 |             ..Default::default()\n  330 |         };\n  331 |         if options.print_width.is_some()\n  332 |             || options.use_tabs.is_some()\n  333 |             || options.tab_width.is_some()\n  334 |             || options.end_of_line.is_some()\n  335 |         {\n  336 |             // are global options are set\n  337 |             let line_width = if let Some(print_width) = options.print_width {\n  338 |                 Some(LineWidth
