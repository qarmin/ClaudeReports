{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`biome --where-am-i` silently succeeds and prints nothing if `env::current_exe()` fails (e.g. the executable was deleted/moved). Returning `Ok(())` with no output gives no signal that the lookup failed.","fix":"Emit an error/diagnostic (or non-zero exit) when `current_exe()` returns `Err`.","locations":[{"ref":"crates/biome_cli/src/lib.rs:329-334","code":"  329 |             BiomeCommand::WhereAmI => {\n  330 |                 if let Ok(path) = env::current_exe() {\n  331 |                     print!(\"{}\", path.display());\n  332 |                 }\n  333 |                 Ok(())\n  334 |             }","lines":6,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_cli/src/lib.rs#L329-L334"}]},
{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"GitLab `try_from_diagnostic` substitutes a span of `TextRange::new(1, 1)` when the diagnostic has no span. Offset 1 is an arbitrary in-text position, so `SourceFile::location` reports line/column based on byte offset 1 rather than a sensible file-start default.","fix":"Default the missing span to `TextRange::empty(TextSize::from(0))` (file start) or skip emitting a line number.","locations":[{"ref":"crates/biome_cli/src/reporter/gitlab.rs:207-216","code":"  207 |         let location = diagnostic.location();\n  208 |         let span = location\n  209 |             .span\n  210 |             .unwrap_or(TextRange::new(TextSize::from(1), TextSize::from(1)));\n  211 |         let source_code = location.source_code?;\n  212 |         let description = PrintDescription(diagnostic).to_string();\n  213 |         let begin = match SourceFile::new(source_code).location(span.start()) {\n  214 |             Ok(start) => start.line_number.get(),\n  215 |             Err(_) => return None,\n  216 |         };","lines":10,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_cli/src/reporter/gitlab.rs#L207-L216"}]},
{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"JUnit reporter silently drops any diagnostic that lacks a span/source_code/resource: the TestCase construction is nested inside `if let (Some(span), Some(source_code), Some(resource))`. Diagnostics without a location never appear, even though `summary.errors` still counts them, yielding a report whose `errors` count can exceed the number of emitted test cases.","fix":"Emit a TestCase even when location info is missing (omit line/column extras) so the count of failures matches the reported error total.","locations":[{"ref":"crates/biome_cli/src/reporter/junit.rs:88-134","code":"   88 |         for diagnostic in diagnostics {\n   89 |             let mut status = TestCaseStatus::non_success(NonSuccessKind::Failure);\n   90 |             let message = format!(\"{}\", JunitDiagnostic { diagnostic });\n   91 |             status.set_message(message.clone());\n   92 | \n   93 |             let location = diagnostic.location();\n   94 | \n   95 |             if let (Some(span), Some(source_code), Some(resource)) =\n   96 |                 (location.span, location.source_code, location.resource)\n   97 |             {\n   98 |                 let source = SourceFile::new(source_code);\n   99 |                 let start = source.location(span.start())?;\n  100 | \n  101 |                 status.set_description(format!(\n  102 |                     \"line {row:?}, col {col:?}, {body}\",\n  103 |                     row = start.line_number.get(),\n  104 |                     col = start.column_number.get(),\n  105 |                     body = message\n  106 |                 ));\n  107 |                 let mut case = TestCase::new(\n  108 |                     format!(\n  109 |                         \"org.biome.{}\",\n  110 |                         diagnostic\n  111 |                             .category()\n  112 |                             .map(|c| c.name())\n  113 |                             .unwrap_or_default()\n  114 |                             .replace('/', \".\")\n  115 |                     ),\n  116 |                     status,\n  117 |                 );\n  118 | \n  119 |                 if let Resource::File(path) = resource {\n  120 |                     let mut test_suite = TestSuite::new(path);\n  121 |                     case.extra\n  122 |                         .insert(\"line\".into(), start.line_number.get().to_string().into());\n  123 |                     case.extra.insert(\n  124 |                         \"column\".into(),\n  125 |                         start.column_number.get().to_string().into(),\n  126 |                     );\n  127 |                     test_suite\n  128 |                         .extra\n  129 |                         .insert(\"package\".into(), \"org.biome\".into());\n  130 |                     test_suite.add_test_case(case);\n  131 |                     self.0.add_test_suite(test_suite);\n  132 |                 }\n  133 |             }\n  134 |         }","lines":47,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_cli/src/reporter/junit.rs#L88-L134"}]},
{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"Windows `ensure_daemon` loops with an unbounded `loop` retrying `open_socket`/`spawn_daemon` indefinitely, with no attempt limit and no handle to the spawned child. If the daemon repeatedly fails to come up, this spins forever and can spawn multiple daemon processes in a tight 50ms loop. The Unix counterpart bounds this to 10 attempts and tracks the child.","fix":"Bound the retry loop (e.g. 10 attempts) and only spawn once, mirroring the Unix `ensure_daemon` implementation.","locations":[{"ref":"crates/biome_cli/src/service/windows.rs:189-213","code":"  189 | pub(crate) async fn ensure_daemon(\n  190 |     stop_on_disconnect: bool,\n  191 |     watcher_options: WatcherOptions,\n  192 |     log_options: LogOptions,\n  193 | ) -> io::Result<bool> {\n  194 |     let mut did_spawn = false;\n  195 | \n  196 |     loop {\n  197 |         match open_socket().await {\n  198 |             Ok(Some(_)) => break,\n  199 |             Ok(None) => {\n  200 |                 spawn_daemon(\n  201 |                     stop_on_disconnect,\n  202 |                     watcher_options.clone(),\n  203 |                     log_options.clone(),\n  204 |                 )?;\n  205 |                 did_spawn = true;\n  206 |                 time::sleep(Duration::from_millis(50)).await;\n  207 |             }\n  208 |             Err(err) => return Err(err),\n  209 |         }\n  210 |     }\n  211 | \n  212 |     Ok(did_spawn)\n  213 | }","lines":25,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_cli/src/service/windows.rs#L189-L213"}]},
{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`EditorconfigValue::from_str` maps both `\"unset\"` and `\"off\"` to `Self::Default` for every option type. In the EditorConfig spec, `unset` is the reset keyword; `off` is not a generic reset keyword (and is not a valid value for any of these properties). Treating `off` as a universal reset means e.g. `indent_size = off` silently resolves to the Biome default instead of reporting an unrecognized value.","fix":"Only treat `\"unset\"` as `Default`; let `\"off\"` fall through to `T::from_str` so invalid values produce the proper diagnostic.","locations":[{"ref":"crates/biome_configuration/src/editorconfig.rs:422-430","code":"  422 | impl<T: FromStr> FromStr for EditorconfigValue<T> {\n  423 |     type Err = T::Err;\n  424 |     fn from_str(s: &str) -> Result<Self, Self::Err> {\n  425 |         match s {\n  426 |             \"unset\" | \"off\" => Ok(Self::Default),\n  427 |             _ => T::from_str(s).map(EditorconfigValue::Explicit),\n  428 |         }\n  429 |     }\n  430 | }","lines":9,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_configuration/src/editorconfig.rs#L422-L430"}]},
{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`Version::parse_version` uses `filter_map(|part| part.parse::<u32>().ok())`, silently dropping any non-numeric segment. A version like `\"1.x.3\"` parses to `[1, 3]`, comparing equal to `\"1.3\"` and less than `\"1.2.4\"`. This feeds the `$schema` version-mismatch warning, so malformed version strings can produce a misleading or absent diagnostic. The final `len().cmp(&len())` tiebreaker also treats `\"1.2\"` as less than `\"1.2.0\"`.","fix":"Treat unparsable segments as 0 (`.map(|p| p.parse().unwrap_or(0))`) or treat the whole version as incomparable; ignore trailing zero components in the length tiebreaker.","locations":[{"ref":"crates/biome_configuration/src/lib.rs:602-607","code":"  602 |     fn parse_version(&self) -> Vec<u32> {\n  603 |         self.0\n  604 |             .split('.')\n  605 |             .filter_map(|part| part.parse::<u32>().ok())\n  606 |             .collect()\n  607 |     }","lines":6,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_configuration/src/lib.rs#L602-L607"},{"ref":"crates/biome_configuration/src/lib.rs:628","code":"  628 |         self_parts.len().cmp(&other_parts.len())","lines":1,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_configuration/src/lib.rs#L628"}]},
{"id":"LOGIC_33","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"noInvalidDirectionInLinearGradient uses the regex `\\bin\\b` (IN_KEYWORD) on only the first comma-separated argument's text to detect a color-interpolation clause (`to top in srgb`) and skip validation. The color-interpolation `in <colorspace>` clause belongs to the whole function, not just the first argument, and matching a bare word `in` anywhere in the first argument is a fragile heuristic that can both over-skip (any direction containing a standalone `in` token) and under-skip valid interpolation syntax.","fix":"Anchor the check to the actual color-interpolation-method position (e.g. only when the argument ends with `in <colorspace>`) rather than matching `\\bin\\b` anywhere in the first argument.","locations":[{"ref":"crates/biome_css_analyze/src/lint/correctness/no_invalid_direction_in_linear_gradient.rs:62","code":"   62 | pub static IN_KEYWORD: LazyLock<Regex> = LazyLock::new(|| Regex::new(r\"(?i)\\bin\\b\").unwrap());","lines":1,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_css_analyze/src/lint/correctness/no_invalid_direction_in_linear_gradient.rs#L62"},{"ref":"crates/biome_css_analyze/src/lint/correctness/no_invalid_direction_in_linear_gradient.rs:95-97","code":"   95 |         let first_expression = arguments.first()?.ok()?;\n   96 |         let first_expression_text = first_expression.to_trimmed_text();\n   97 |         if IN_KEYWORD.is_match(&first_expression_text) {","lines":3,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_css_analyze/src/lint/correctness/no_invalid_direction_in_linear_gradient.rs#L95-L97"}]},
{"id":"LOGIC_34","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`normalize_string`'s `\\r` handling calls `bytes.next()` to peek the following byte; when that byte is NOT `\\n`, the consumed byte is silently discarded from further processing (copy_start is not advanced so it is still copied verbatim, but it is never re-checked for being a preferred_quote that needs escaping or a `\\` starting a new escape). A bare CR (not part of CRLF) followed by e.g. a quote char would thus not get escaped. Applies to both the escaped `\\r` sub-case and the bare `\\r` case. Low severity because JS/CSS string literals practically never contain a raw CR, but the logic is incorrect for that input.","fix":"Use a `Peekable` iterator so the lookahead byte is only consumed when it is actually `\\n`; otherwise leave it for the main loop to process (or explicitly re-check it for quote/backslash).","locations":[{"ref":"crates/biome_formatter/src/token/string.rs:62-67","code":"   62 |                     if escaped == b'\\r' {\n   63 |                         // If we encounter the sequence \"\\r\\n\", then skip '\\r'\n   64 |                         if let Some((next_byte_index, b'\\n')) = bytes.next() {\n   65 |                             reduced_string.push_str(&raw_content[copy_start..escaped_index]);\n   66 |                             copy_start = next_byte_index;\n   67 |                         }","lines":6,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_formatter/src/token/string.rs#L62-L67"},{"ref":"crates/biome_formatter/src/token/string.rs:76-81","code":"   76 |             b'\\r' => {\n   77 |                 if let Some((next_byte_index, b'\\n')) = bytes.next() {\n   78 |                     reduced_string.push_str(&raw_content[copy_start..byte_index]);\n   79 |                     copy_start = next_byte_index;\n   80 |                 }\n   81 |             }","lines":6,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_formatter/src/token/string.rs#L76-L81"}]},
{"id":"LOGIC_35","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The `require`-callee detection compares `call_expression.callee()?.syntax().text_with_trivia()` against the literal \"require\". `text_with_trivia()` includes leading/trailing trivia, so a callee with any attached comment or whitespace trivia (e.g. `/* c */ require(...)`) will fail the comparison even though the callee is `require`. Prettier matches on the trimmed identifier name.","fix":"Compare against the trimmed text instead, e.g. use `text_trimmed()` / `to_trimmed_string()`, or match on the identifier name token, so trivia does not affect the result.","locations":[{"ref":"crates/biome_js_formatter/src/utils/assignment_like.rs:691-695","code":"  691 |         if let Some(AnyJsExpression::JsCallExpression(call_expression)) = &right_expression\n  692 |             && call_expression.callee()?.syntax().text_with_trivia() == \"require\"\n  693 |         {\n  694 |             return Ok(AssignmentLikeLayout::NeverBreakAfterOperator);\n  695 |         }","lines":5,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_js_formatter/src/utils/assignment_like.rs#L691-L695"}]},
{"id":"LOGIC_36","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `parse_arrow_function_parameters`/parameter parsing, the call `.and_object_expression_allowed(!first || has_l_paren)` is misleading dead logic: `first` is set to `false` at the top of the loop body BEFORE this expression executes on the first iteration, so `!first` is always `true` and the `has_l_paren` operand is dead. The apparent intent (mirroring the leading-paren guard used in call-argument/parenthesized-expression parsing) never takes effect. Behaviorally harmless today but the expression is misleading.","fix":"Capture the first-ness before flipping `first` (e.g. `let is_first = first; if first { first = false; } ... and_object_expression_allowed(!is_first || has_l_paren)`), or simplify to `.and_object_expression_allowed(has_l_paren)` if the leading-paren semantics are intended.","locations":[{"ref":"crates/biome_js_parser/src/syntax/function.rs:1446-1464","code":" 1446 |                 first = false;\n 1447 |             } else {\n 1448 |                 p.expect(T![,]);\n 1449 |             }\n 1450 | \n 1451 |             if p.at(T![')']) {\n 1452 |                 break;\n 1453 |             }\n 1454 | \n 1455 |             progress.assert_progressing(p);\n 1456 | \n 1457 |             if parse_metavariable(p).is_present() {\n 1458 |                 continue;\n 1459 |             }\n 1460 | \n 1461 |             let parameter = parse_parameter(\n 1462 |                 p,\n 1463 |                 ExpressionContext::default().and_object_expression_allowed(!first || has_l_paren),\n 1464 |             );","lines":19,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_js_parser/src/syntax/function.rs#L1446-L1464"}]},
{"id":"LOGIC_37","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`Closure::all_captures` filters parent-scope references with `is_reference_within_scope(scope, reference)`, but that helper ignores the position of the specific `reference` it is passed. It returns `true` if the binding has *any* reference whose `range_start` falls inside the closure scope, so a parent-scope reference is kept as a capture candidate whenever the same binding is referenced anywhere inside the closure, even when this particular reference is not. This can over-approximate the capture set.","fix":"Test the passed reference's own position (`binding.references[reference.index()].range_start`) against the closure scope range instead of `.any(...)` over all references of the binding.","locations":[{"ref":"crates/biome_js_semantic/src/semantic_model/closure.rs:254-265","code":"  254 |     fn is_reference_within_scope(\n  255 |         &self,\n  256 |         scope: &SemanticModelScopeData,\n  257 |         reference: &ReferenceId,\n  258 |     ) -> bool {\n  259 |         let binding_id = reference.binding_id();\n  260 |         let binding = self.data.binding(binding_id);\n  261 |         binding\n  262 |             .references\n  263 |             .iter()\n  264 |             .any(|semantic_reference| scope.range.contains(semantic_reference.range_start))\n  265 |     }","lines":12,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_js_semantic/src/semantic_model/closure.rs#L254-L265"}]},
{"id":"LOGIC_38","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`widen_binding_from_writable_references` computes `reference_scope = reference.scope().id()` and uses it only to skip same-scope writes, but infers the assignment RHS type with `TypeData::from_any_js_expression(self, scope_id, &right)` using the binding's *declaration* `scope_id` rather than the scope where the assignment occurs. If the RHS references identifiers that resolve differently in the assignment scope vs. the declaration scope, the widened type can be wrong. Possibly intentional, hence low confidence.","fix":"Use `reference_scope` (the assignment's scope) when inferring the RHS type, or document why the declaration scope is correct.","locations":[{"ref":"crates/biome_module_graph/src/js_module_info/collector.rs:574-593","code":"  574 |         for reference in references {\n  575 |             let node = reference.syntax();\n  576 |             let reference_scope = reference.scope().id();\n  577 | \n  578 |             // We don't want to widen types inside the same scope\n  579 |             if binding.scope_id == reference_scope {\n  580 |                 continue;\n  581 |             }\n  582 |             let assignment = node\n  583 |                 .ancestors()\n  584 |                 .skip(1)\n  585 |                 .find_map(|ancestor| JsAssignmentExpression::cast_ref(&ancestor))\n  586 |                 .and_then(|assignment| assignment.right().ok());\n  587 |             if let Some(right) = assignment {\n  588 |                 let data = TypeData::from_any_js_expression(self, scope_id, &right);\n  589 |                 let assigned_type = self.reference_to_owned_data(data);\n  590 |                 union_collector.add(assigned_type);\n  591 |                 saw_widening_reference = true;\n  592 |             }\n  593 |         }","lines":20,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_module_graph/src/js_module_info/collector.rs#L574-L593"}]},
{"id":"LOGIC_39","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`SpdxExpression` parsing silently discards the `WITH <exception>` clause and only trusts the base license id. A license such as `GPL-2.0-only WITH Classpath-exception-2.0` is trust-checked as plain `GPL-2.0-only`, so the exception (which materially changes license obligations) is ignored. This is documented as intentional, but for a trust/deny gate it means exception-bearing expressions cannot be denied/allowed distinctly from their base license.","fix":"If exception-aware trust decisions are needed, retain the exception identifier in the AST (e.g. an `Id` variant carrying an optional exception) and incorporate it into `check_trust`.","locations":[{"ref":"crates/biome_package/src/license/expression.rs:234-247","code":"  234 |         Token::Id(id) => {\n  235 |             // Handle `<id> WITH <exception>` — skip the exception identifier\n  236 |             let rest = if let Some((Token::With, after_with)) = rest.split_first() {\n  237 |                 if let Some((Token::Id(_), after_exception)) = after_with.split_first() {\n  238 |                     after_exception\n  239 |                 } else {\n  240 |                     // WITH without an exception identifier — treat as end\n  241 |                     rest\n  242 |                 }\n  243 |             } else {\n  244 |                 rest\n  245 |             };\n  246 |             Some((SpdxExpression::Id(id), rest))\n  247 |         }","lines":14,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_package/src/license/expression.rs#L234-L247"}]},
{"id":"LOGIC_40","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`insert_serialized_tsconfig` and `insert_serialized_turbo_json` overwrite `self.diagnostics` wholesale with only the diagnostics from the just-parsed tsconfig/turbo manifest. If a `package.json` manifest (or the other config) was already inserted and produced diagnostics, those are discarded. Manifests are inserted independently, so whichever is inserted last wins and earlier diagnostics are silently lost.","fix":"Append (`extend`) the new diagnostics to `self.diagnostics` instead of replacing the vector, or keep separate per-manifest diagnostic collections.","locations":[{"ref":"crates/biome_package/src/node_js_package/mod.rs:32-58","code":"   32 |     pub fn insert_serialized_tsconfig(\n   33 |         &mut self,\n   34 |         content: &ProjectLanguageRoot<TsConfigJson>,\n   35 |         path: &Utf8Path,\n   36 |     ) {\n   37 |         let tsconfig = TsConfigJson::deserialize_manifest(content, path);\n   38 |         let (tsconfig, deserialize_diagnostics) = tsconfig.consume();\n   39 |         self.tsconfig = Some(tsconfig.unwrap_or_default());\n   40 |         self.diagnostics = deserialize_diagnostics\n   41 |             .into_iter()\n   42 |             .map(biome_diagnostics::serde::Diagnostic::new)\n   43 |             .collect();\n   44 |     }\n   45 | \n   46 |     pub fn insert_serialized_turbo_json(\n   47 |         &mut self,\n   48 |         content: &ProjectLanguageRoot<TurboJson>,\n   49 |         path: &Utf8Path,\n   50 |     ) {\n   51 |         let turbo_json = TurboJson::deserialize_manifest(content, path);\n   52 |         let (turbo_json, deserialize_diagnostics) = turbo_json.consume();\n   53 |         self.turbo_json = Some(Arc::new(turbo_json.unwrap_or_default()));\n   54 |         self.diagnostics = deserialize_diagnostics\n   55 |             .into_iter()\n   56 |             .map(biome_diagnostics::serde::Diagnostic::new)\n   57 |             .collect();\n   58 |     }","lines":27,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_package/src/node_js_package/mod.rs#L32-L58"},{"ref":"crates/biome_package/src/node_js_package/mod.rs:84-96","code":"   84 |     fn insert_serialized_manifest(\n   85 |         &mut self,\n   86 |         content: &ProjectLanguageRoot<Self::Manifest>,\n   87 |         path: &Utf8Path,\n   88 |     ) {\n   89 |         let deserialized = Self::Manifest::deserialize_manifest(content, path);\n   90 |         let (manifest, diagnostics) = deserialized.consume();\n   91 |         self.manifest = manifest;\n   92 |         self.diagnostics = diagnostics\n   93 |             .into_iter()\n   94 |             .map(biome_diagnostics::serde::Diagnostic::new)\n   95 |             .collect();\n   96 |     }","lines":13,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_package/src/node_js_package/mod.rs#L84-L96"}]},
{"id":"LOGIC_41","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"Numeric prerelease identifiers and version core components are parsed as `u16` (max 65535). Real npm packages can use larger numeric values (e.g. date-based prereleases like `1.0.0-20231201` or patch numbers above 65535). `parse_number` and `compare_prerelease` will fail to parse / mis-compare such versions: an all-digit prerelease that overflows u16 falls through to the lexical comparison branch, violating SemVer numeric precedence rules and silently degrading range matching.","fix":"Use a wider integer type (u32/u64) for version components and numeric prerelease comparison, matching node-semver which uses arbitrary-precision integers.","locations":[{"ref":"crates/biome_package/src/node_semver/version.rs:357-367","code":"  357 | fn parse_number(s: &str) -> Result<u16, VersionError> {\n  358 |     if s.is_empty() {\n  359 |         return Err(VersionError::InvalidNumber);\n  360 |     }\n  361 | \n  362 |     if s.len() > 1 && s.starts_with('0') {\n  363 |         return Err(VersionError::InvalidNumber);\n  364 |     }\n  365 | \n  366 |     s.parse().map_err(|_| VersionError::InvalidNumber)\n  367 | }","lines":11,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_package/src/node_semver/version.rs#L357-L367"},{"ref":"crates/biome_package/src/node_semver/version.rs:390-407","code":"  390 | fn compare_prerelease(a: &[String], b: &[String]) -> Ordering {\n  391 |     for (part_a, part_b) in a.iter().zip(b.iter()) {\n  392 |         match (part_a.parse::<u16>(), part_b.parse::<u16>()) {\n  393 |             (Ok(num_a), Ok(num_b)) => match num_a.cmp(&num_b) {\n  394 |                 Ordering::Equal => {}\n  395 |                 other => return other,\n  396 |             },\n  397 |             (Ok(_), Err(_)) => return Ordering::Less,\n  398 |             (Err(_), Ok(_)) => return Ordering::Greater,\n  399 |             (Err(_), Err(_)) => match part_a.cmp(part_b) {\n  400 |                 Ordering::Equal => {}\n  401 |                 other => return other,\n  402 |             },\n  403 |         }\n  404 |     }\n  405 | \n  406 |     a.len().cmp(&b.len())\n  407 | }","lines":18,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_package/src/node_semver/version.rs#L390-L407"}]},
{"id":"LOGIC_42","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`Children::size_hint` forwards `self.slots.size_hint()` (an `Enumerate<Slots>` that counts ALL slots including `Slot::Empty`), but `Children::next`/`next_back` skip empty slots and only yield occupied ones. The reported lower bound is therefore higher than the number of items actually produced, violating the Iterator size_hint contract. Callers that pre-allocate to the lower bound can be misled. (Not memory-unsafe: Children is not ExactSizeIterator/TrustedLen.)","fix":"Return `(0, upper)`: `let (_, upper) = self.slots.size_hint(); (0, upper)`.","locations":[{"ref":"crates/biome_rowan/src/green/node.rs:562-564","code":"  562 |     fn size_hint(&self) -> (usize, Option<usize>) {\n  563 |         self.slots.size_hint()\n  564 |     }","lines":3,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_rowan/src/green/node.rs#L562-L564"}]},
{"id":"LOGIC_43","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`is_dir` resolves a relative symlink target against the process CWD rather than the symlink's parent directory. `read_link_utf8()` returns the raw (possibly relative, e.g. `../foo`) link target, and `.is_dir()` on it resolves relative to the current working directory. For a relative symlink whose parent differs from the CWD this yields a wrong answer, so a symlinked directory can be misclassified as a non-directory, affecting includes/ignore decisions.","fix":"Resolve the link target relative to the symlink's parent before testing (e.g. join with `path.parent()`), or use `std::fs::metadata(path).map(|m| m.is_dir())` which follows symlinks correctly.","locations":[{"ref":"crates/biome_service/src/lib.rs:84-86","code":"   84 | fn is_dir(path: &Utf8Path) -> bool {\n   85 |     path.is_dir() || (path.is_symlink() && path.read_link_utf8().is_ok_and(|path| path.is_dir()))\n   86 | }","lines":3,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_service/src/lib.rs#L84-L86"}]},
{"id":"LOGIC_44","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`index_project` short-circuits re-scans via `self.is_watched(&project_path)`, but `watched_folders` is populated only asynchronously by the watcher thread after it drains its instruction channel. The scan and the synchronous `projects` insert happen before the watcher registers the folder, so two `index_project` calls issued in quick succession (before the watcher processes `WatchFolders`) both perform a full scan even though the second is redundant. The synchronously-updated `projects` map could serve as the guard.","fix":"Guard against redundant scans using the synchronously-updated `projects` map (or a 'scanned' flag) rather than the asynchronously-populated `watched_folders`, or document that duplicate concurrent scans are acceptable.","locations":[{"ref":"crates/biome_service/src/scanner.rs:179-200","code":"  179 |         if !scan_options.force && self.is_watched(&project_path) {\n  180 |             return Ok(ScanProjectResult {\n  181 |                 diagnostics: Default::default(),\n  182 |                 duration: Default::default(),\n  183 |                 configuration_files: Default::default(),\n  184 |             });\n  185 |         }\n  186 | \n  187 |         let scanned_project = ScannedProject {\n  188 |             scan_kind: scan_options.scan_kind.clone_without_targeting_info(),\n  189 |             watched: scan_options.watch,\n  190 |         };\n  191 | \n  192 |         let result = self.scan(\n  193 |             workspace,\n  194 |             project_key,\n  195 |             &project_path,\n  196 |             IndexTrigger::InitialScan,\n  197 |             scan_options,\n  198 |         )?;\n  199 | \n  200 |         self.projects.pin().insert(project_key, scanned_project);","lines":22,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_service/src/scanner.rs#L179-L200"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"Two `if let Ok(message) = from_utf8(&message) { ... } else { ... }` blocks have identical bodies in both arms: both format `{message:?}` the same way, so the UTF-8 check is pointless. The intent was presumably to display the bytes differently when they are not valid UTF-8 (the `else` branch formats the raw `Vec<u8>` rather than the `&str`, producing different output, but the code as written discards the decoded string and reuses the same identifier name, making both arms equivalent).","fix":"Either remove the redundant branch, or make the `else` branch genuinely format the non-UTF-8 bytes differently (e.g. lossy decode).","locations":[{"ref":"crates/biome_cli/src/service/mod.rs:255-261","code":"  255 |                 let response = from_slice(&message).with_context(|| {\n  256 |                     if let Ok(message) = from_utf8(&message) {\n  257 |                         format!(\"failed to deserialize JSON-RPC response from {message:?}\")\n  258 |                     } else {\n  259 |                         format!(\"failed to deserialize JSON-RPC response from {message:?}\")\n  260 |                     }\n  261 |                 });","lines":7,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_cli/src/service/mod.rs#L255-L261"},{"ref":"crates/biome_cli/src/service/mod.rs:296-301","code":"  296 |                 _ => {\n  297 |                     let message = if let Ok(message) = from_utf8(&message) {\n  298 |                         format!(\"invalid response {message:?}\")\n  299 |                     } else {\n  300 |                         format!(\"invalid response {message:?}\")\n  301 |                     };","lines":6,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_cli/src/service/mod.rs#L296-L301"}]},
{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"medium","description":"Six near-identical pseudo-class function-list parsers emit the empty-list diagnostic inconsistently. `function_selector_list.rs:38`, `function_relative_selector_list.rs:41`, and `function_selector.rs:75` gate the diagnostic on `&& p.at(T![')'])`; but `function_value_list.rs:38`, `function_compound_selector_list.rs:42`, and `function_custom_identifier_list.rs:38` emit it unconditionally on `list_range.is_empty()`. The ungated variants can emit a spurious/duplicate empty-list diagnostic when the list is empty but the parser is not actually at the closing `)` (e.g. malformed token), since `eat_or_recover_selector_function_close_token` will also report.","fix":"Adopt one convention across all six parsers; align the three ungated ones to also gate with `&& p.at(T![')'])`.","locations":[{"ref":"crates/biome_css_parser/src/syntax/selector/pseudo_class/function_value_list.rs:41-42","code":"   41 |     if list_range.is_empty() {\n   42 |         let diagnostic = expected_identifier(p, list_range);","lines":2,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_css_parser/src/syntax/selector/pseudo_class/function_value_list.rs#L41-L42"},{"ref":"crates/biome_css_parser/src/syntax/selector/pseudo_class/function_compound_selector_list.rs:42-43","code":"   42 |     if list_range.is_empty() {\n   43 |         let diagnostic = expected_compound_selector(p, list_range);","lines":2,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_css_parser/src/syntax/selector/pseudo_class/function_compound_selector_list.rs#L42-L43"},{"ref":"crates/biome_css_parser/src/syntax/selector/pseudo_class/function_custom_identifier_list.rs:38-39","code":"   38 |     if list_range.is_empty() {\n   39 |         let diagnostic = expected_identifier(p, list_range);","lines":2,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_css_parser/src/syntax/selector/pseudo_class/function_custom_identifier_list.rs#L38-L39"}]},
{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"`parse_if_media_test` has two recovery branches: the `is_at_any_media_condition` branch parses a `<media-condition>`, the `else` branch parses a `<media-feature>` (query feature). Both recover with the same `expected_any_query_feature` diagnostic, so a malformed media condition reports a query-feature error instead of a media-condition error.","fix":"Give the media-condition branch a media-condition-specific recovery diagnostic; keep `expected_any_query_feature` only for the media-feature branch.","locations":[{"ref":"crates/biome_css_parser/src/syntax/value/if.rs:263-271","code":"  263 |     if is_at_any_media_condition(p) {\n  264 |         parse_any_media_condition(p)\n  265 |             .or_recover(p, &AnyInParensParseRecovery, expected_any_query_feature)\n  266 |             .ok();\n  267 |     } else {\n  268 |         parse_any_query_feature(p)\n  269 |             .or_recover(p, &AnyInParensParseRecovery, expected_any_query_feature)\n  270 |             .ok();\n  271 |     }","lines":9,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_css_parser/src/syntax/value/if.rs#L263-L271"}]},
{"id":"CPY_4","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"`IndentWidthFromIntError`'s Display impl reports the valid range using `LineWidth::MIN` (1) and `LineWidth::MAX` (320), but indent width is validated against `IndentWidth::MIN` (0)..=`IndentWidth::MAX` (24). An out-of-range indent width (e.g. 30) yields the wrong-on-both-bounds message \"...should be between 1 and 320, got 30\". The struct's doc comment is also copy-pasted from `LineWidthFromIntError` (\"converting a u16 to a [LineWidth]\"; should be u8/IndentWidth).","fix":"Use `IndentWidth::MIN`/`IndentWidth::MAX` in the message and correct the doc comment to reference a u8 and `IndentWidth`.","locations":[{"ref":"crates/biome_formatter/src/lib.rs:541-555","code":"  541 | /// Error type returned when converting a u16 to a [LineWidth] fails\n  542 | #[derive(Clone, Copy, Debug)]\n  543 | pub struct IndentWidthFromIntError(pub u8);\n  544 | \n  545 | impl std::fmt::Display for IndentWidthFromIntError {\n  546 |     fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {\n  547 |         writeln!(\n  548 |             f,\n  549 |             \"The indent width should be between {} and {}, got {}\",\n  550 |             LineWidth::MIN,\n  551 |             LineWidth::MAX,\n  552 |             self.0,\n  553 |         )\n  554 |     }\n  555 | }","lines":15,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_formatter/src/lib.rs#L541-L555"}]},
{"id":"CPY_5","type":"copy_paste","type_label":"Copy Paste","severity":"negligible","difficulty":"easy","description":"`expected_any_query_feature` lists `<query-in-parens>` as one of the expected alternatives for a query feature, but a query feature is `<mf-plain>`/`<mf-boolean>`/`<mf-range>`, not a query-in-parens. The entry appears copied from a query-in-parens diagnostic and is incorrect.","fix":"Remove the `<query-in-parens>` alternative from `expected_any_query_feature`.","locations":[{"ref":"crates/biome_css_parser/src/syntax/at_rule/feature.rs:273-284","code":"  273 | pub(crate) fn expected_any_query_feature(p: &CssParser, range: TextRange) -> ParseDiagnostic {\n  274 |     expect_one_of(\n  275 |         &[\n  276 |             \"<mf-plain>\",\n  277 |             \"<mf-boolean>\",\n  278 |             \"<mf-range>\",\n  279 |             \"<query-in-parens> or <query-in-parens>\",\n  280 |         ],\n  281 |         range,\n  282 |     )\n  283 |     .into_diagnostic(p)\n  284 | }","lines":12,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_css_parser/src/syntax/at_rule/feature.rs#L273-L284"}]},
{"id":"CPY_6","type":"copy_paste","type_label":"Copy Paste","severity":"negligible","difficulty":"easy","description":"`parse_custom_identifier_pseudo_class` uses `p.expect(T!['('])` where the presence of `(` is already guaranteed by the preceding `is_at_*` guard. Every sibling pseudo-class function parser uses `p.bump(T!['('])` in this position. Using `expect` here is inconsistent (it could emit an unexpected diagnostic if the invariant ever changes).","fix":"Use `p.bump(T!['('])` for consistency with the other pseudo-class function parsers.","locations":[{"ref":"crates/biome_css_parser/src/syntax/selector/pseudo_class/function_custom_identifier.rs:30","code":"   30 |     p.expect(T!['(']);","lines":1,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_css_parser/src/syntax/selector/pseudo_class/function_custom_identifier.rs#L30"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"easy","description":"noDuplicateAtImportRules aborts the entire rule (returns None for the whole file) the moment any single media-query entry fails to parse: the match arms `_ => return None` at lines 104 and 116 bail out of run() instead of skipping that one entry. Similarly `at_rule.rule().ok()?` at line 74 returns None for the whole file if any at-rule fails to cast. A single malformed media query or at-rule silently suppresses duplicate-import detection for every other import in the file.","fix":"Replace `_ => return None` with skipping that media entry (e.g. `Err(_) => continue`), and replace `at_rule.rule().ok()?` with a `let ... else { continue; }` so a single parse failure only skips that rule.","locations":[{"ref":"crates/biome_css_analyze/src/lint/suspicious/no_duplicate_at_import_rules.rs:81","code":"   81 |             let AnyCssAtRule::CssImportAtRule(import_rule) = at_rule.rule().ok()? else {","lines":1,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_css_analyze/src/lint/suspicious/no_duplicate_at_import_rules.rs#L81"},{"ref":"crates/biome_css_analyze/src/lint/suspicious/no_duplicate_at_import_rules.rs:109","code":"  109 |                         _ => return None,","lines":1,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_css_analyze/src/lint/suspicious/no_duplicate_at_import_rules.rs#L109"},{"ref":"crates/biome_css_analyze/src/lint/suspicious/no_duplicate_at_import_rules.rs:119","code":"  119 |                         _ => return None,","lines":1,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_css_analyze/src/lint/suspicious/no_duplicate_at_import_rules.rs#L119"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`Utf8PathBuf::from_path_buf(...).expect(\"To be UTF-8 path\")` panics when a relativized path contains non-UTF-8 bytes. On a filesystem with non-UTF-8 file names this aborts the GitLab report run instead of falling back to the absolute path (which the caller already handles for the `None` case).","fix":"Return `None` on the UTF-8 conversion failure (`.ok()`), letting the caller fall back to `absolute_path.to_string()`.","locations":[{"ref":"crates/biome_cli/src/reporter/gitlab.rs:121","code":"  121 |         Some(Utf8PathBuf::from_path_buf(relativized.to_path_buf()).expect(\"To be UTF-8 path\"))","lines":1,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_cli/src/reporter/gitlab.rs#L121"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`diagnostic.advices(&mut visitor).unwrap()` unwraps the io::Result from advice traversal inside functions that themselves return io::Result, so a visit error aborts the process via panic instead of propagating. Fragile and inconsistent with the surrounding `?`-based handling.","fix":"Propagate the error with `?` (make the helper return `io::Result<...>`), or document why it cannot fail.","locations":[{"ref":"crates/biome_cli/src/reporter/json.rs:321-330","code":"  321 | fn to_advices(diagnostic: &Error) -> Vec<JsonSuggestion> {\n  322 |     let mut visitor = SuggestionsVisitor {\n  323 |         suggestions: vec![],\n  324 |         last_diagnostic_length: 0,\n  325 |         current_message: None,\n  326 |     };\n  327 |     diagnostic.advices(&mut visitor).unwrap();\n  328 | \n  329 |     visitor.suggestions\n  330 | }","lines":10,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_cli/src/reporter/json.rs#L321-L330"},{"ref":"crates/biome_cli/src/reporter/rdjson.rs:185-193","code":"  185 | fn to_rdjson_suggestions(diagnostic: &Error) -> Vec<RdJsonSuggestion> {\n  186 |     let mut visitor = SuggestionsVisitor {\n  187 |         suggestions: vec![],\n  188 |     };\n  189 | \n  190 |     diagnostic.advices(&mut visitor).unwrap();\n  191 | \n  192 |     visitor.suggestions\n  193 | }","lines":9,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_cli/src/reporter/rdjson.rs#L185-L193"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`self.0.to_string().expect(\"To serialize report to string\")` panics if quick_junit fails to serialize the report, surfacing serialization errors as a process panic rather than an io::Error, inconsistent with the surrounding `io::Result` return type.","fix":"Map the serialization error into an `io::Error` and return it via `?` instead of `.expect`.","locations":[{"ref":"crates/biome_cli/src/reporter/junit.rs:136-138","code":"  136 |         writer.log(markup! {\n  137 |             {self.0.to_string().expect(\"To serialize report to string\")}\n  138 |         });","lines":3,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_cli/src/reporter/junit.rs#L136-L138"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `parse_any_if_test_boolean_expr_group`, the parenthesized-group branch parses a general `<boolean-expr>` via `parse_any_if_test_boolean_expr` but recovers with `expected_if_test_boolean_not_expr` (the `not`-specific diagnostic, which says \"not boolean expression\"). The dedicated `expected_if_test_boolean_expr_group` exists and is used correctly elsewhere (e.g. if.rs:361 after `not`). The diagnostic and the parsed production are swapped, producing a confusing error message on malformed `if(( ... ))` input.","fix":"Use `expected_if_test_boolean_expr_group` for the parenthesized boolean-expression group recovery instead of `expected_if_test_boolean_not_expr`.","locations":[{"ref":"crates/biome_css_parser/src/syntax/value/if.rs:319-325","code":"  319 |         parse_any_if_test_boolean_expr(p)\n  320 |             .or_recover_with_token_set(\n  321 |                 p,\n  322 |                 &ParseRecoveryTokenSet::new(CSS_BOGUS_IF_TEST_BOOLEAN_EXPR, token_set![T![')']]),\n  323 |                 expected_if_test_boolean_not_expr,\n  324 |             )\n  325 |             .ok();","lines":7,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_css_parser/src/syntax/value/if.rs#L319-L325"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`impl Format<FormatTypeContext> for Imports` builds a `JoinBuilder`, adds entries, then returns `Ok(())` directly instead of calling `joiner.finish()`. `JoinBuilder::entry` writes immediately but stores any `FormatResult` error internally; only `finish()` surfaces it. So formatting errors produced while writing an import entry are silently swallowed and reported as success. The sibling impls `Exports` and `CssImports` correctly call `joiner.finish()`.","fix":"Replace the final `Ok(())` with `joiner.finish()`.","locations":[{"ref":"crates/biome_module_graph/src/format_module_graph.rs:104-138","code":"  104 | impl Format<FormatTypeContext> for Imports {\n  105 |     fn fmt(\n  106 |         &self,\n  107 |         f: &mut biome_formatter::formatter::Formatter<FormatTypeContext>,\n  108 |     ) -> FormatResult<()> {\n  109 |         let mut joiner = f.join();\n  110 | \n  111 |         for (import_name, import) in &self.0 {\n  112 |             let name = format_with(|f| {\n  113 |                 write!(f, [text(&std::format!(\"{:?}\", import_name.text()), None),])\n  114 |             });\n  115 |             let arrow = format_with(|f| write!(f, [&format_args![space(), token(\"=>\"), space()]]));\n  116 | \n  117 |             let export = format_with(|f| {\n  118 |                 write!(\n  119 |                     f,\n  120 |                     [&format_args![\n  121 |                         token(\"{\"),\n  122 |                         &group(&block_indent(&format_args![import]),),\n  123 |                         token(\"}\")\n  124 |                     ]]\n  125 |                 )\n  126 |             });\n  127 |             let line = format_with(|f| {\n  128 |                 write!(\n  129 |                     f,\n  130 |                     [&format_args![&name, &arrow, &export, soft_line_break()]]\n  131 |                 )\n  132 |             });\n  133 |             joiner.entry(&group(&format_args![line, soft_line_break_or_space()]));\n  134 |         }\n  135 | \n  136 |         Ok(())\n  137 |     }\n  138 | }","lines":35,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_module_graph/src/format_module_graph.rs#L104-L138"}]},
{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`parse_range` is declared to return `Result<Version, VersionError>` but it can never return `Err`: the failure path maps the error to `Ok(Version::Literal(...))`. Callers (`From<&str>`/`From<String>` for Version, the `Deserializable` impl) then do `.ok().unwrap_or(...)` / match on `Err`, treating an outcome that is statically unreachable. The `Result` wrapper is misleading dead error-handling: a parse failure is silently swallowed into a `Literal` rather than surfaced, and the never-`Err` signature hides that.","fix":"Change `parse_range` to return `Version` directly (it always succeeds), and simplify the `From`/`Deserializable` impls accordingly; or actually propagate the parse error if a distinction between SemVer and literal is desired.","locations":[{"ref":"crates/biome_package/src/node_js_package/package_json.rs:765-770","code":"  765 | fn parse_range(range: &str) -> Result<Version, VersionError> {\n  766 |     match Range::from_str(range).map(Version::SemVer) {\n  767 |         Ok(result) => Ok(result),\n  768 |         Err(_) => Ok(Version::Literal(range.to_string())),\n  769 |     }\n  770 | }","lines":6,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_package/src/node_js_package/package_json.rs#L765-L770"},{"ref":"crates/biome_package/src/node_js_package/package_json.rs:601-613","code":"  601 | impl From<&str> for Version {\n  602 |     fn from(value: &str) -> Self {\n  603 |         parse_range(value)\n  604 |             .ok()\n  605 |             .unwrap_or(Self::Literal(value.to_string()))\n  606 |     }\n  607 | }\n  608 | \n  609 | impl From<String> for Version {\n  610 |     fn from(value: String) -> Self {\n  611 |         parse_range(&value).ok().unwrap_or(Self::Literal(value))\n  612 |     }\n  613 | }","lines":13,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_package/src/node_js_package/package_json.rs#L601-L613"}]},
{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"negligible","difficulty":"easy","description":"Typo in `FileGuard::drop` comment: 'it's generally better to silently matcher the error' - 'matcher' should be 'swallow'/'ignore'. The comment is load-bearing (it explains why the error is intentionally dropped in a Drop impl).","fix":"Fix wording to: 'it's generally better to silently ignore the error than panic'.","locations":[{"ref":"crates/biome_service/src/workspace.rs:2211-2214","code":" 2211 |             // `close_file` can only error if the file was already closed, in\n 2212 |             // this case it's generally better to silently matcher the error\n 2213 |             // than panic (especially in a drop handler)\n 2214 |             .ok();","lines":4,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_service/src/workspace.rs#L2211-L2214"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`node::load_config` interpolates the untrusted `specifier` directly into JavaScript source passed to `node --eval` (`import('{specifier}')` and `require('{specifier}')`). A specifier containing a single quote, newline, or `')` (which can come from an ESLint config's `extends`/module names or resolved paths) breaks out of the string literal, producing a syntax error at best and arbitrary JS execution at worst. Also `uncycle(c.default)` calls `Object.entries` on the default export; if the default export is `null` this throws a TypeError.","fix":"Pass the specifier to node via an argument/env var or JSON-encode it instead of string-interpolating into source, and guard `uncycle` against non-object inputs.","locations":[{"ref":"crates/biome_cli/src/execute/migrate/node.rs:11-13","code":"   11 |         .arg(format!(\n   12 |             \"{UNCYCLE_FUNCTION} import('{specifier}').then((c) => console.log(JSON.stringify(uncycle(c.default), null, 2)))\"\n   13 |         ))","lines":3,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_cli/src/execute/migrate/node.rs#L11-L13"},{"ref":"crates/biome_cli/src/execute/migrate/node.rs:35-37","code":"   35 |                     .arg(format!(\n   36 |                         \"{UNCYCLE_FUNCTION} console.log(JSON.stringify(uncycle(require('{specifier}'))))\"\n   37 |                     ))","lines":3,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_cli/src/execute/migrate/node.rs#L35-L37"},{"ref":"crates/biome_cli/src/execute/migrate/node.rs:69-72","code":"   69 | const UNCYCLE_FUNCTION: &str = \"function uncycle(obj, seen = new Set()) {\n   70 |     seen.add(obj);\n   71 |     for (const [key, val] of Object.entries(obj)) {\n   72 |         if (val != null && typeof val == 'object') {","lines":4,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_cli/src/execute/migrate/node.rs#L69-L72"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`impl From<u8> for IndentSize` constructs `Self::Value(value)` for any u8 with no bound check, bypassing the `MIN..=MAX` (0..=24) validation that `FromStr` enforces. An out-of-range value would later fail `IndentWidth::try_from` and be silently dropped, but the API is an inconsistent foot-gun versus the validated FromStr path.","fix":"Remove the unused `From<u8>` impl, or replace it with a `TryFrom<u8>` that enforces the same MIN..=MAX bound.","locations":[{"ref":"crates/biome_configuration/src/editorconfig.rs:132-136","code":"  132 | impl From<u8> for IndentSize {\n  133 |     fn from(value: u8) -> Self {\n  134 |         Self::Value(value)\n  135 |     }\n  136 | }","lines":5,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_configuration/src/editorconfig.rs#L132-L136"}]},
{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`ScopeBindingsIter` implements `ExactSizeIterator::len()` by returning the total number of bindings in the scope, ignoring `binding_index` (the number already consumed). The `ExactSizeIterator` contract requires `len()` to return the count of *remaining* items, so after any `next()`/`nth()` call `len()` over-reports and the derived `size_hint()` becomes inconsistent. This can cause incorrect pre-allocations or logic in any consumer that partially consumes the iterator and then checks `len()`.","fix":"Return `self.data.scopes[self.id.index()].bindings.len() - self.binding_index as usize`.","locations":[{"ref":"crates/biome_js_semantic/src/semantic_model/scope.rs:265-273","code":"  265 | impl ExactSizeIterator for ScopeBindingsIter {\n  266 |     fn len(&self) -> usize {\n  267 |         // scope_id will always be a valid scope because\n  268 |         // it was created by [Scope::bindings] method.\n  269 |         debug_assert!(self.scope_id.index() < self.data.scopes.len());\n  270 | \n  271 |         self.data.scopes[self.scope_id.index()].bindings.len()\n  272 |     }\n  273 | }","lines":9,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_js_semantic/src/semantic_model/scope.rs#L265-L273"}]},
{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"negligible","difficulty":"easy","description":"`NumberFormatOptions::keep_one_trailing_decimal_zero` constructs `Self { keep_one_trailing_decimal_zero: true }`, discarding `self`. It works only because the struct currently has one field; adding any future field would silently reset it to default - a footgun in a builder.","fix":"Use `Self { keep_one_trailing_decimal_zero: true, ..self }`.","locations":[{"ref":"crates/biome_formatter/src/token/number.rs:16-20","code":"   16 |     pub fn keep_one_trailing_decimal_zero(self) -> Self {\n   17 |         Self {\n   18 |             keep_one_trailing_decimal_zero: true,\n   19 |         }\n   20 |     }","lines":5,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_formatter/src/token/number.rs#L16-L20"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","difficulty":"easy","description":"noIrregularWhitespace uses `Ast<AnyCssRule>` as its query, so run() fires once per rule including every nested rule. Each invocation first scans the entire subtree text via text_with_trivia() and then iterates all descendant tokens. Because rules nest (e.g. rules inside @media), the same text is rescanned at every nesting level (quadratic in nesting depth), and the same tokens are visited by both a parent rule's run and the child rule's run, which can also produce duplicate diagnostics for the same whitespace.","fix":"Query a top-level node (e.g. Ast<CssRoot>) and scan its tokens once, or restrict descendants_tokens to the rule's own non-nested tokens to avoid rescanning and duplicate reporting.","locations":[{"ref":"crates/biome_css_analyze/src/lint/suspicious/no_irregular_whitespace.rs:44-51","code":"   44 | impl Rule for NoIrregularWhitespace {\n   45 |     type Query = Ast<AnyCssRule>;\n   46 |     type State = TextRange;\n   47 |     type Signals = Box<[Self::State]>;\n   48 |     type Options = NoIrregularWhitespaceOptions;\n   49 | \n   50 |     fn run(ctx: &RuleContext<Self>) -> Self::Signals {\n   51 |         get_irregular_whitespace(ctx.query().syntax()).into_boxed_slice()","lines":8,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_css_analyze/src/lint/suspicious/no_irregular_whitespace.rs#L44-L51"},{"ref":"crates/biome_css_analyze/src/lint/suspicious/no_irregular_whitespace.rs:78-95","code":"   78 | fn get_irregular_whitespace(syntax: &CssSyntaxNode) -> Vec<TextRange> {\n   79 |     if !syntax\n   80 |         .text_with_trivia()\n   81 |         .chars()\n   82 |         .any(is_irregular_whitespace)\n   83 |     {\n   84 |         return vec![];\n   85 |     }\n   86 | \n   87 |     let mut results = vec![];\n   88 |     for token in syntax.descendants_tokens(Direction::Next) {\n   89 |         if !token.has_leading_comments()\n   90 |             && !token.has_trailing_comments()\n   91 |             && token.text().chars().any(is_irregular_whitespace)\n   92 |         {\n   93 |             results.push(token.text_range());\n   94 |         }\n   95 |     }","lines":18,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_css_analyze/src/lint/suspicious/no_irregular_whitespace.rs#L78-L95"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"Every license lookup (`is_valid`, `is_deprecated`, `is_osi_approved`, `is_fsf_libre`) performs a full O(n) linear scan over the ~1198-entry static license list. `SpdxExpression::check_trust` for a single identifier can trigger up to four separate full scans (valid, deprecated, OSI, FSF), and `NodeJsPackage::analyze` scans twice per license. For projects with many dependencies/licenses this is repeated linear work that could be a single hashed lookup.","fix":"Build a `HashMap<&'static str, &'static Licence>` (e.g. via `LazyLock`) keyed by `license_id` and add a single `find(id) -> Option<&Licence>` accessor, then derive the boolean checks from one lookup instead of four scans.","locations":[{"ref":"crates/biome_package/src/license/mod.rs:6-42","code":"    6 | impl LicenseList {\n    7 |     pub fn is_valid(&self, license_id: &str) -> bool {\n    8 |         let license_found = self\n    9 |             .license_list\n   10 |             .iter()\n   11 |             .find(|license| license.license_id == license_id);\n   12 | \n   13 |         license_found.is_some()\n   14 |     }\n   15 | \n   16 |     pub fn is_deprecated(&self, license_id: &str) -> bool {\n   17 |         let license_found = self\n   18 |             .license_list\n   19 |             .iter()\n   20 |             .find(|license| license.license_id == license_id);\n   21 | \n   22 |         license_found.is_some_and(|license| license.is_deprecated_license_id)\n   23 |     }\n   24 | \n   25 |     pub fn is_osi_approved(&self, license_id: &str) -> bool {\n   26 |         let license_found = self\n   27 |             .license_list\n   28 |             .iter()\n   29 |             .find(|license| license.license_id == license_id);\n   30 | \n   31 |         license_found.is_some_and(|license| license.is_osi_approved)\n   32 |     }\n   33 | \n   34 |     pub fn is_fsf_libre(&self, license_id: &str) -> bool {\n   35 |         let license_found = self\n   36 |             .license_list\n   37 |             .iter()\n   38 |             .find(|license| license.license_id == license_id);\n   39 | \n   40 |         license_found.is_some_and(|license| license.is_fsf_libre)\n   41 |     }\n   42 | }","lines":37,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_package/src/license/mod.rs#L6-L42"},{"ref":"crates/biome_package/src/license/expression.rs:89-107","code":"   89 |                 let valid_spdx = LICENSE_LIST.is_valid(id);\n   90 |                 if !valid_spdx {\n   91 |                     return Err(RejectReason::Untrusted);\n   92 |                 }\n   93 | \n   94 |                 // Deprecated check (reject when ignore_deprecated is false)\n   95 |                 if !config.ignore_deprecated && LICENSE_LIST.is_deprecated(id) {\n   96 |                     return Err(RejectReason::Deprecated);\n   97 |                 }\n   98 | \n   99 |                 // OSI check\n  100 |                 if config.require_osi_approved && !LICENSE_LIST.is_osi_approved(id) {\n  101 |                     return Err(RejectReason::NotOsiApproved);\n  102 |                 }\n  103 | \n  104 |                 // FSF check\n  105 |                 if config.require_fsf_libre && !LICENSE_LIST.is_fsf_libre(id) {\n  106 |                     return Err(RejectReason::NotFsfLibre);\n  107 |                 }","lines":19,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_package/src/license/expression.rs#L89-L107"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`overlapping_line_suppressions` runs `binary_search_by` over `line_suppressions` assuming the slice is totally ordered by `text_range`, then linearly expands left/right. Line-suppression ranges are expanded over time (`expand_range`/`overlap_last_suppression` call `text_range.cover(...)`), so adjacent entries' ranges can overlap and the slice may not satisfy the strict ordering invariant `binary_search_by` requires. When the invariant is violated, the search can land on the wrong index and the subsequent bounded left/right scan may miss an overlapping suppression, causing a suppression to be incorrectly treated as having no effect (false `suppressions/unused`) or a signal to escape suppression. Hard to confirm without targeted fuzzing, hence low confidence.","fix":"Either guarantee the ordering invariant (store and search by `comment_span`, which is fixed at push time, instead of the mutated `text_range`), or replace the binary search with a linear scan / interval structure that does not assume non-overlapping sorted ranges.","locations":[{"ref":"crates/biome_analyze/src/suppressions.rs:657-686","code":"  657 |     pub(crate) fn overlapping_line_suppressions(\n  658 |         &mut self,\n  659 |         target: &TextRange,\n  660 |     ) -> &mut [LineSuppression] {\n  661 |         let Ok(middle_index) = self.line_suppressions.binary_search_by(|s| {\n  662 |             if s.text_range.end() < target.start() {\n  663 |                 Ordering::Less\n  664 |             } else if target.end() < s.text_range.start() {\n  665 |                 Ordering::Greater\n  666 |             } else {\n  667 |                 Ordering::Equal\n  668 |             }\n  669 |         }) else {\n  670 |             return &mut [];\n  671 |         };\n  672 |         // Perf: normally just traversing in both directions should be faster - more than 2\n  673 |         // comments in a row should be rare, and 2-3 extra comparisons are faster than\n  674 |         // bisecting twice for left and right border.\n  675 |         let mut left = middle_index;\n  676 |         while left > 0 && self.line_suppressions[left - 1].text_range.end() >= target.start() {\n  677 |             left -= 1;\n  678 |         }\n  679 |         let mut right = middle_index;\n  680 |         while right < self.line_suppressions.len() - 1\n  681 |             && self.line_suppressions[right + 1].text_range.start() <= target.end()\n  682 |         {\n  683 |             right += 1;\n  684 |         }\n  685 |         &mut self.line_suppressions[left..=right]\n  686 |     }","lines":30,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_analyze/src/suppressions.rs#L657-L686"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"For each parent-scope reference, `is_reference_within_scope` iterates over *all* references of the referenced binding (`binding.references.iter().any(...)`). With N references per binding in a large parent scope this is O(N*M) where it should be O(1) per reference. Tied to the correctness issue: once the check uses the reference's own `range_start`, the inner scan disappears.","fix":"Resolve the reference's own range directly and check scope containment in O(1), removing the inner iteration over `binding.references`.","locations":[{"ref":"crates/biome_js_semantic/src/semantic_model/closure.rs:254-265","code":"  254 |     fn is_reference_within_scope(\n  255 |         &self,\n  256 |         scope: &SemanticModelScopeData,\n  257 |         reference: &ReferenceId,\n  258 |     ) -> bool {\n  259 |         let binding_id = reference.binding_id();\n  260 |         let binding = self.data.binding(binding_id);\n  261 |         binding\n  262 |             .references\n  263 |             .iter()\n  264 |             .any(|semantic_reference| scope.range.contains(semantic_reference.range_start))\n  265 |     }","lines":12,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_js_semantic/src/semantic_model/closure.rs#L254-L265"},{"ref":"crates/biome_js_semantic/src/semantic_model/closure.rs:295-308","code":"  295 |             let parent_read_references: Vec<_> = parent_scope\n  296 |                 .read_references\n  297 |                 .iter()\n  298 |                 .filter(|reference| self.is_reference_within_scope(scope, reference))\n  299 |                 .collect();\n  300 |             let parent_write_references: Vec<_> = parent_scope\n  301 |                 .write_references\n  302 |                 .iter()\n  303 |                 .filter(|reference| self.is_reference_within_scope(scope, reference))\n  304 |                 .collect();\n  305 | \n  306 |             references.extend(parent_read_references.iter().copied());\n  307 |             references.extend(parent_write_references.iter().copied());\n  308 |         }","lines":14,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_js_semantic/src/semantic_model/closure.rs#L295-L308"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`node::load_config` always spawns a second `node` process (`require.resolve('{specifier}')`) to obtain `resolved_path`, even on the common path where the first `import()` invocation succeeded. For configs with many `extends` entries this doubles the number of node process spawns.","fix":"Resolve the path inside the same node invocation (also print `import.meta.resolve`/`require.resolve` from the eval) to avoid a second process launch.","locations":[{"ref":"crates/biome_cli/src/execute/migrate/node.rs:22-29","code":"   22 |             let path_output = Command::new(\"node\")\n   23 |                 .env(\"NODE_NO_WARNINGS\", \"1\")\n   24 |                 .arg(\"--print\")\n   25 |                 .arg(format!(\n   26 |                     \"require.resolve('{specifier}')\"\n   27 |                 ))\n   28 |                 .output();\n   29 |             let resolved_path = path_output.ok().map_or(String::new(), |path_output| String::from_utf8_lossy(&path_output.stdout).trim().to_string());","lines":8,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_cli/src/execute/migrate/node.rs#L22-L29"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`DiagnosticsBySeverity::Display` builds a String via `format!(\"{total}\")` then writes it through `fmt.write_str`, an unnecessary heap allocation when a number can be written directly to the markup formatter.","fix":"Write the count directly, e.g. `fmt.write_markup(markup!({total}))?;`.","locations":[{"ref":"crates/biome_cli/src/reporter/summary.rs:523-533","code":"  523 | impl Display for DiagnosticsBySeverity {\n  524 |     fn fmt(&self, fmt: &mut Formatter) -> io::Result<()> {\n  525 |         let total = self.warnings + self.info + self.errors;\n  526 |         let count = CounterLine(self.errors, self.warnings, self.info);\n  527 |         fmt.write_str(&format!(\"{total}\"))?;\n  528 |         fmt.write_str(\" \")?;\n  529 |         fmt.write_markup(markup! {\n  530 |             \"(\"{count}\")\"\n  531 |         })?;\n  532 |         Ok(())\n  533 |     }","lines":11,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_cli/src/reporter/summary.rs#L523-L533"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"`BiomeDiagnostic::root_in_root` clones the owned `nested_path` String even though it is not used after this point.","fix":"Use `path: nested_path` directly and drop the `.clone()`.","locations":[{"ref":"crates/biome_configuration/src/diagnostics.rs:147-152","code":"  147 |     pub fn root_in_root(nested_path: String, root_path: Option<String>) -> Self {\n  148 |         Self::RootInRoot(RootInRoot {\n  149 |             path: nested_path.clone(),\n  150 |             other_path: root_path,\n  151 |         })\n  152 |     }","lines":6,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_configuration/src/diagnostics.rs#L147-L152"}]},
{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"`conditional_content_stack.iter().last()` walks the entire Vec to fetch the last element; `Vec`/slice exposes O(1) `.last()`. Occurs in `RemoveSoftLinesBuffer::is_in_expanded_conditional_content` and the extracted `clean_interned` helper. Negligible runtime (stacks are short) but trivially fixable in a formatting path.","fix":"Replace `.iter().last()` with `.last()`.","locations":[{"ref":"crates/biome_formatter/src/buffer.rs:528-533","code":"  528 |     fn is_in_expanded_conditional_content(&self) -> bool {\n  529 |         self.conditional_content_stack\n  530 |             .iter()\n  531 |             .last()\n  532 |             .is_some_and(|condition| condition.mode == PrintMode::Expanded)\n  533 |     }","lines":6,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_formatter/src/buffer.rs#L528-L533"},{"ref":"crates/biome_formatter/src/buffer.rs:591-593","code":"  591 |                                 _ if condition_content_stack.iter().last().is_some_and(\n  592 |                                     |condition| condition.mode == PrintMode::Expanded,\n  593 |                                 ) => {}","lines":3,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_formatter/src/buffer.rs#L591-L593"}]},
{"id":"PERF_9","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`should_hug_type` iterates over `union_type.types()` four separate times (for `has_object_type`, the unused-elsewhere `successful` count, the `comments` count, and `void_count`), plus a fifth `len()` call. For union types this walks the children repeatedly when a single pass collecting the three counts would suffice.","fix":"Collect the type list once into a small vec (or fold once) and compute `has_object_type`, the total count, the commented count, and the void count in a single traversal.","locations":[{"ref":"crates/biome_js_formatter/src/utils/typescript.rs:62-95","code":"   62 |         let mut iter = union_type.types().iter();\n   63 | \n   64 |         let has_object_type = iter.any(|ty| {\n   65 |             matches!(\n   66 |                 ty,\n   67 |                 Ok(AnyTsType::TsObjectType(_) | AnyTsType::TsReferenceType(_))\n   68 |             )\n   69 |         });\n   70 | \n   71 |         let successful = union_type\n   72 |             .types()\n   73 |             .iter()\n   74 |             .filter_map(|node: Result<AnyTsType, biome_rowan::SyntaxError>| node.ok());\n   75 | \n   76 |         let comments = union_type\n   77 |             .types()\n   78 |             .iter()\n   79 |             .filter_map(|node: Result<AnyTsType, biome_rowan::SyntaxError>| node.ok())\n   80 |             .filter(|node| comments.has_comments(node.syntax()))\n   81 |             .count();\n   82 | \n   83 |         let void_count = union_type\n   84 |             .types()\n   85 |             .iter()\n   86 |             .filter(|node| {\n   87 |                 matches!(\n   88 |                     node,\n   89 |                     Ok(AnyTsType::TsVoidType(_) | AnyTsType::TsNullLiteralType(_))\n   90 |                 )\n   91 |             })\n   92 |             .count();\n   93 | \n   94 |         union_type.types().len() - 1 == void_count && has_object_type && comments == 0\n   95 |             || successful.count() == 1","lines":34,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_js_formatter/src/utils/typescript.rs#L62-L95"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"medium","difficulty":"easy","description":"`organize_imports.rs` is not declared as a module anywhere in lib.rs, so it is never compiled. It is also internally broken: its `Default` impl initializes a field `ignore` that does not exist on the `OrganizeImports` struct (which has only `enabled` and `includes`), so it would fail to compile if added back to the module tree. Stale leftover code.","fix":"Delete the orphaned file. If it is meant to be live, add `mod organize_imports;` to lib.rs and remove the non-existent `ignore` field.","locations":[{"ref":"crates/biome_configuration/src/organize_imports.rs:1-41","code":"    1 | use biome_deserialize::StringSet;\n    2 | use biome_deserialize_macros::{Deserializable, Merge, Partial};\n    3 | #[cfg(feature = \"cli\")]\n    4 | use bpaf::Bpaf;\n    5 | use serde::{Deserialize, Serialize};\n    6 | \n    7 | #[derive(Clone, Debug, Deserialize, Eq, Partial, PartialEq, Serialize)]\n    8 | #[partial(derive(Clone, Deserializable, Eq, Merge, PartialEq))]\n    9 | #[partial(cfg_attr(feature = \"cli\", derive(Bpaf)))]\n   10 | #[partial(cfg_attr(feature = \"schema\", derive(schemars::JsonSchema)))]\n   11 | #[partial(serde(rename_all = \"camelCase\", default, deny_unknown_fields))]\n   12 | pub struct OrganizeImports {\n   13 |     /// Enables the organization of imports\n   14 |     #[partial(cfg_attr(feature = \"cli\", bpaf(hide)))]\n   15 |     pub enabled: bool,\n   16 | \n   17 |     /// A list of glob patterns. The import organizer will include files/folders that will\n   18 |     /// match these patterns.\n   19 |     #[partial(cfg_attr(feature = \"cli\", bpaf(pure(Default::default()), hide)))]\n   20 |     pub includes: Vec<biome_glob::NormalizedGlob>,\n   21 | }\n   22 | \n   23 | impl Default for OrganizeImports {\n   24 |     fn default() -> Self {\n   25 |         Self {\n   26 |             enabled: true,\n   27 |             ignore: Default::default(),\n   28 |             includes: Default::default(),\n   29 |         }\n   30 |     }\n   31 | }\n   32 | \n   33 | impl PartialOrganizeImports {\n   34 |     pub const fn is_disabled(&self) -> bool {\n   35 |         matches!(self.enabled, Some(false))\n   36 |     }\n   37 | \n   38 |     pub const fn is_enabled(&self) -> bool {\n   39 |         !self.is_disabled()\n   40 |     }\n   41 | }","lines":41,"link":"https://github.com/biomejs/biome/blob/353cbae47056f8e03b27d1d9b69e165b5b72f122/crates/biome_configuration/src/organize_imports.rs#L1-L41"}]},
