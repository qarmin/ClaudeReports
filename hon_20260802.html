<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

<script type="application/json" id="D">[{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"very_easy","description":"In the `async_setup_entry` switch registration, the `turboMode` switch block (added for Turbo Mode) reuses the exact guard condition from the `ecoMode` block above it: `device.get(\"ecoMode\", \"N/A\") != \"N/A\")`. It should check `device.get(\"turboMode\", \"N/A\") != \"N/A\")`. As written, the `turboMode` `HonSwitchEntity` (`key=\"turboMode\"`) is only created when the device exposes `ecoMode`, and is never created for a device that has `turboMode` but no `ecoMode` — and conversely may be wrongly created (and then fail on read) for devices that have `ecoMode` but not `turboMode`.","fix":"Fix the copy-pasted condition to check the correct key:\n\n```python\nif ((\"settings\" in device.commands)\n    and (device.get(\"turboMode\", \"N/A\") != \"N/A\")):\n\n    description = HonSwitchEntityDescription(\n        key=\"turboMode\",\n        name=\"Turbo Mode\",\n        icon=\"mdi:rocket-launch\",\n        translation_key=\"turbo_mode\",\n    )\n    appliances.extend([HonSwitchEntity(hass, coordinator, entry, appliance, description)])\n    await coordinator.async_request_refresh()\n```","locations":[{"ref":"custom_components/hon/switch.py:116-138","code":"  116 |         if ((\"settings\" in device.commands) \n  117 |             and (device.get(\"ecoMode\", \"N/A\") != \"N/A\")):\n  118 | \n  119 |             description = HonSwitchEntityDescription(\n  120 |                 key=\"ecoMode\",\n  121 |                 name=\"Eco Mode\",\n  122 |                 icon=\"mdi:sprout\",\n  123 |                 translation_key=\"eco_mode\",\n  124 |             )\n  125 |             appliances.extend([HonSwitchEntity(hass, coordinator, entry, appliance, description)])\n  126 |             await coordinator.async_request_refresh()\n  127 | \n  128 |         if ((\"settings\" in device.commands) \n  129 |             and (device.get(\"ecoMode\", \"N/A\") != \"N/A\")):\n  130 | \n  131 |             description = HonSwitchEntityDescription(\n  132 |                 key=\"turboMode\",\n  133 |                 name=\"Turbo Mode\",\n  134 |                 icon=\"mdi:rocket-launch\",\n  135 |                 translation_key=\"turbo_mode\",\n  136 |             )\n  137 |             appliances.extend([HonSwitchEntity(hass, coordinator, entry, appliance, description)])\n  138 |             await coordinator.async_request_refresh()","lines":23,"link":"https://github.com/gvigroux/hon/blob/7f577423d84c25e1b21734ead6e6db94bcc467e3/custom_components/hon/switch.py#L116-L138"}]},{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"In `number.py`'s `async_setup_entry`, two separate loops iterate `coordinator.device.settings` and both create a `HonNumber` for any `HonParameterRange` whose key starts with `\"startProgram.\"`: the first loop (lines 58-77) explicitly filters `key.startswith(\"startProgram.\")`, and the second loop (lines 79-100) filters only `isinstance(parameter, HonParameterRange)` with no exclusion of already-handled `startProgram.` keys. Every `startProgram.*` range parameter is therefore registered as a `HonNumber` twice with the identical `unique_id` (`f\"{self._mac}-number-{description.key}\"`), causing duplicate-entity warnings from Home Assistant's entity registry and wasted setup work.","fix":"Exclude the `startProgram.` keys already handled by the first loop from the second loop:\n\n```python\nfor key, parameter in coordinator.device.settings.items():\n    if not isinstance(parameter, HonParameterRange):\n        continue\n    if key.startswith(\"startProgram.\"):\n        continue\n    ...\n```","locations":[{"ref":"custom_components/hon/number.py:58-100","code":"   58 |         for key in coordinator.device.settings:\n   59 |             parameter = coordinator.device.settings[key]\n   60 |             if(isinstance(parameter, HonParameterRange)\n   61 |             and key.startswith(\"startProgram.\")):\n   62 | \n   63 |                 default_value = default_values.get(parameter.key, {})\n   64 |                 translation_key = coordinator.device.appliance_type.lower() + '_' + parameter.key.lower()\n   65 |                 \n   66 |                 #name=translations.get(f\"component.hon.entity.number.{translation_key}.name\", parameter.key),\n   67 | \n   68 |                 description = NumberEntityDescription(\n   69 |                     key=key,\n   70 |                     name=f\"{parameter.key}\",\n   71 |                     entity_category=EntityCategory.CONFIG,\n   72 |                     #entity_category=None,\n   73 |                     translation_key = translation_key,\n   74 |                     icon=default_value.get(\"icon\", None),\n   75 |                     unit_of_measurement=default_value.get(\"unit_of_measurement\", None),\n   76 |                 )\n   77 |                 appliances.extend([HonNumber(hon, coordinator, appliance, description)])\n   78 | \n   79 |         for key, parameter in coordinator.device.settings.items():\n   80 |             if not isinstance(parameter, HonParameterRange):\n   81 |                 continue\n   82 | \n   83 |             default_value = default_values.get(parameter.key, {})\n   84 |             translation_key = (\n   85 |                 coordinator.device.appliance_type.lower() + \"_\" + parameter.key.lower()\n   86 |             )\n   87 | \n   88 |             description = NumberEntityDescription(\n   89 |                 key=key,\n   90 |                 name=translations.get(\n   91 |                     f\"component.hon.entity.number.{translation_key}.name\", parameter.key\n   92 |                 ),\n   93 |                 entity_category=EntityCategory.CONFIG,\n   94 |                 translation_key=translation_key,\n   95 |                 icon=default_value.get(\"icon\"),\n   96 |                 native_unit_of_measurement=default_value.get(\n   97 |                     \"native_unit_of_measurement\"\n   98 |                 ),\n   99 |             )\n  100 |             appliances.append(HonNumber(hon, coordinator, appliance, description))","lines":43,"link":"https://github.com/gvigroux/hon/blob/7f577423d84c25e1b21734ead6e6db94bcc467e3/custom_components/hon/number.py#L58-L100"}]},{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`HonSwitchEntity.async_turn_on`/`async_turn_off` try to skip toggling a setting that is a plain `HonParameter` via `if type(setting) == HonParameter: return`. But `HonParameter` is only ever a base class — `HonCommand._create_parameters` (`command.py`) exclusively instantiates `HonParameterRange`, `HonParameterEnum`, or `HonParameterFixed`, never bare `HonParameter`. So `type(setting) == HonParameter` is always `False` and this guard never fires. When the underlying setting is actually a `HonParameterFixed` (typology `\"fixed\"`), the code falls through to `setting.value = ... else 1` (or `0`), which calls `HonParameterFixed.value`'s setter (`parameter.py:47-50`) and raises an unhandled `ValueError` because the new value differs from the fixed value — crashing the switch's `turn_on`/`turn_off` service call instead of being skipped gracefully.","fix":"Check for the intended type instead of the never-matching base class:\n\n```python\nif isinstance(setting, HonParameterFixed):\n    return\n```\n\nApply the same fix in both `async_turn_on` and `async_turn_off`.","locations":[{"ref":"custom_components/hon/switch.py:184-201","code":"  184 |     async def async_turn_on(self, **kwargs: Any) -> None:\n  185 |         setting = self._setting()\n  186 |         if setting is not None:\n  187 |             if type(setting) == HonParameter:\n  188 |                 return\n  189 |             if self.invert:\n  190 |                 setting.value = setting.min if isinstance(setting, HonParameterRange) else 0\n  191 |             else:\n  192 |                 setting.value = setting.max if isinstance(setting, HonParameterRange) else 1\n  193 |             await self._device.commands[\"settings\"].send()\n  194 |             value = str(setting.value)\n  195 |         else:\n  196 |             value = self._target_value(True)\n  197 |             await self.coordinator.async_set({self.entity_description.key: value})\n  198 | \n  199 |         self._device.set(self.entity_description.key, value)\n  200 |         self.async_write_ha_state()\n  201 |         self.coordinator.async_set_updated_data({})","lines":18,"link":"https://github.com/gvigroux/hon/blob/7f577423d84c25e1b21734ead6e6db94bcc467e3/custom_components/hon/switch.py#L184-L201"},{"ref":"custom_components/hon/switch.py:203-220","code":"  203 |     async def async_turn_off(self, **kwargs: Any) -> None:\n  204 |         setting = self._setting()\n  205 |         if setting is not None:\n  206 |             if type(setting) == HonParameter:\n  207 |                 return\n  208 |             if self.invert:\n  209 |                 setting.value = setting.max if isinstance(setting, HonParameterRange) else 1\n  210 |             else:\n  211 |                 setting.value = setting.min if isinstance(setting, HonParameterRange) else 0\n  212 |             await self._device.commands[\"settings\"].send()\n  213 |             value = str(setting.value)\n  214 |         else:\n  215 |             value = self._target_value(False)\n  216 |             await self.coordinator.async_set({self.entity_description.key: value})\n  217 | \n  218 |         self._device.set(self.entity_description.key, value)\n  219 |         self.async_write_ha_state()\n  220 |         self.coordinator.async_set_updated_data({})","lines":18,"link":"https://github.com/gvigroux/hon/blob/7f577423d84c25e1b21734ead6e6db94bcc467e3/custom_components/hon/switch.py#L203-L220"},{"ref":"custom_components/hon/parameter.py:47-50","code":"   47 |     @value.setter\n   48 |     def value(self, value):\n   49 |         if not value == self._value:\n   50 |             raise ValueError(f\"Can't change fixed value for parameter: {self.key}. Fixed value: {self._value}. New value {value}.\")","lines":4,"link":"https://github.com/gvigroux/hon/blob/7f577423d84c25e1b21734ead6e6db94bcc467e3/custom_components/hon/parameter.py#L47-L50"}]},{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`get_key(dictionary, val, default)` logs `f\"Value {value} is not in dictionary {dictionary}\"` on a lookup miss, but `value` is the *last* value iterated from `dictionary.items()` in the preceding `for` loop — not `val`, the value that was actually being searched for. The warning therefore reports the wrong value to the user/log reader. (It would also raise `UnboundLocalError` if `dictionary` were empty, though none of the current call sites pass an empty dict.)","fix":"Log the actual argument that failed to match:\n\n```python\ndef get_key(dictionary, val, default):\n    for key, value in dictionary.items():\n        if val == value:\n            return key\n    _LOGGER.warning(f\"Value {val} is not in dictionary {dictionary}\")\n    return default\n```","locations":[{"ref":"custom_components/hon/climate.py:157-162","code":"  157 | def get_key(dictionary,val,default):\n  158 |     for key, value in dictionary.items():\n  159 |         if val == value:\n  160 |             return key\n  161 |     _LOGGER.warning(f\"Value {value} is not in dictionary {dictionary}\")\n  162 |     return default","lines":6,"link":"https://github.com/gvigroux/hon/blob/7f577423d84c25e1b21734ead6e6db94bcc467e3/custom_components/hon/climate.py#L157-L162"}]},{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`HonClimateEntity.__init__` reads `temp_range = parameters.get('tempSel')` and then immediately does `isinstance(temp_range.step, float)` before validating that `temp_range` is even a `HonParameterRange` (that check only happens afterward, at line 207). If a climate appliance's `settings` command doesn't expose `tempSel` as a range parameter (missing entirely, or exposed as `HonParameterFixed`/`HonParameterEnum`, neither of which has a `.step` attribute), this raises an unhandled `AttributeError` on `None.step` or `HonParameterFixed.step`, aborting entity setup for that device. The following line, `parameters.get('windSpeed').values`, has the identical problem if `windSpeed` is missing.","fix":"Validate before dereferencing, e.g.:\n\n```python\ntemp_range = parameters.get('tempSel')\nself._attr_target_temperature_step = PRECISION_WHOLE\nif isinstance(temp_range, HonParameterRange):\n    self._attr_min_temp = temp_range.min\n    self._attr_max_temp = temp_range.max\n    if isinstance(temp_range.step, float):\n        self._attr_target_temperature_step = temp_range.step\n\nwind_speed = parameters.get('windSpeed')\nself._hon_fan_modes = wind_speed.values if wind_speed is not None else []\n```","locations":[{"ref":"custom_components/hon/climate.py:200-214","code":"  200 |         # Set Min / Max temperatures\n  201 |         temp_range = parameters.get('tempSel')\n  202 | \n  203 |         self._attr_target_temperature_step  = PRECISION_WHOLE\n  204 |         if isinstance(temp_range.step, float):\n  205 |             self._attr_target_temperature_step = temp_range.step\n  206 |     \n  207 |         if isinstance(temp_range, HonParameterRange):\n  208 |             self._attr_min_temp  = temp_range.min\n  209 |             self._attr_max_temp  = temp_range.max\n  210 |         \n  211 |         # Set Fan mode\n  212 |         self._hon_fan_modes = parameters.get('windSpeed').values\n  213 |         for fan_mode in self._hon_fan_modes:\n  214 |             self._attr_fan_modes.append(get_key(CLIMATE_FAN_MODE, fan_mode, FAN_OFF))","lines":15,"link":"https://github.com/gvigroux/hon/blob/7f577423d84c25e1b21734ead6e6db94bcc467e3/custom_components/hon/climate.py#L200-L214"}]},{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`HonConnection.load_commands` does `if not result or result.pop(\"resultCode\") != \"0\": return {}`. If the `/commands/v1/retrieve` response has a non-empty `payload` that is missing the `resultCode` key, `.pop(\"resultCode\")` raises an unhandled `KeyError`. This call is not wrapped in a `try`/`except` in `HonDevice.load_commands` (`device.py:288-289`) — the `try` there only guards the later `commands.pop(\"applianceModel\")` — so the exception propagates all the way up through `async_setup_entry` in `__init__.py`, aborting integration setup for the whole config entry.","fix":"Use `.get()` with a default so an unexpected payload shape degrades gracefully instead of crashing:\n\n```python\nif not result or result.pop(\"resultCode\", None) != \"0\":\n    return {}\n```","locations":[{"ref":"custom_components/hon/hon.py:163-181","code":"  163 |     async def load_commands(self, appliance):\n  164 |         params = {\n  165 |             \"applianceType\": appliance[\"applianceTypeId\"],\n  166 |             \"code\": appliance[\"code\"],\n  167 |             \"applianceModelId\": appliance[\"applianceModelId\"],\n  168 |             \"firmwareId\": appliance[\"eepromId\"],\n  169 |             \"macAddress\": appliance[\"macAddress\"],\n  170 |             \"fwVersion\": appliance[\"fwVersion\"],\n  171 |             \"os\": OS,\n  172 |             \"appVersion\": APP_VERSION,\n  173 |             \"series\": appliance[\"series\"],\n  174 |         }\n  175 |         url = f\"{API_URL}/commands/v1/retrieve\"\n  176 |         async with self._session.get(url, params=params, headers=self._headers) as resp:\n  177 |             result = (await resp.json()).get(\"payload\", {})\n  178 |             if not result or result.pop(\"resultCode\") != \"0\":\n  179 |                 return {}\n  180 |             _LOGGER.debug(f\"Commands: {result}\")\n  181 |             return result","lines":19,"link":"https://github.com/gvigroux/hon/blob/7f577423d84c25e1b21734ead6e6db94bcc467e3/custom_components/hon/hon.py#L163-L181"},{"ref":"custom_components/hon/device.py:288-295","code":"  288 |     async def load_commands(self):\n  289 |         commands = await self._hon.load_commands(self._appliance)\n  290 |     \n  291 |         try:\n  292 |             self._appliance_model = commands.pop(\"applianceModel\")\n  293 |         except:\n  294 |             _LOGGER.error(f\"Unable to load device commands. Please try to restart. Current value: [{commands}]\")\n  295 |             return","lines":8,"link":"https://github.com/gvigroux/hon/blob/7f577423d84c25e1b21734ead6e6db94bcc467e3/custom_components/hon/device.py#L288-L295"}]},{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`get_hOn_mac(device_id, hass)` does `device = device_registry.async_get(device_id); return next(iter(device.identifiers))[1]` with no check that `device` was found. Every service handler in `__init__.py` (`handle_oven_start`, `handle_dishwasher_start`, `handle_washingmachine_start`, `handle_set_mode`, `handle_turn_off`, `handle_light_on/off`, `handle_health_mode_on/off`, etc.) calls this with a user-supplied `call.data.get(\"device\")`. Passing an invalid or stale `device_id` to any of these hOn services raises an unhandled `AttributeError` (`NoneType has no attribute identifiers`) instead of a clean user-facing error.","fix":"Raise a clear Home Assistant error instead of crashing:\n\n```python\ndef get_hOn_mac(device_id, hass):\n    device_registry = dr.async_get(hass)\n    device = device_registry.async_get(device_id)\n    if device is None:\n        raise HomeAssistantError(f\"Unknown device_id: {device_id}\")\n    return next(iter(device.identifiers))[1]\n```","locations":[{"ref":"custom_components/hon/hon.py:309-312","code":"  309 | def get_hOn_mac(device_id, hass):\n  310 |     device_registry = dr.async_get(hass)\n  311 |     device = device_registry.async_get(device_id)\n  312 |     return next(iter(device.identifiers))[1]","lines":4,"link":"https://github.com/gvigroux/hon/blob/7f577423d84c25e1b21734ead6e6db94bcc467e3/custom_components/hon/hon.py#L309-L312"}]},{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`HonBaseButtonEntity` (the \"Get programs details\" button) is added unconditionally for every appliance (`button.py:22`), unlike `HonBaseSettingsButtonEntity` which is only added when `\"settings\" in device.commands`. But `async_press` does `command = self._device.commands.get(\"startProgram\"); programs = command.get_programs()` with no `None` check. For an appliance whose device model has no `startProgram` command, pressing this button raises an unhandled `AttributeError` on `None.get_programs()`.","fix":"Guard against a missing `startProgram` command, mirroring the settings-button pattern:\n\n```python\nasync def async_press(self) -> None:\n    command = self._device.commands.get(\"startProgram\")\n    if command is None:\n        _LOGGER.warning(\"%s has no startProgram command\", self._device.name)\n        return\n    programs = command.get_programs()\n    ...\n```\n\nOr only add `HonBaseButtonEntity` when `\"startProgram\" in device.commands`, same as the settings button.","locations":[{"ref":"custom_components/hon/button.py:22","code":"   22 |         appliances.extend([HonBaseButtonEntity(coordinator, appliance)])","lines":1,"link":"https://github.com/gvigroux/hon/blob/7f577423d84c25e1b21734ead6e6db94bcc467e3/custom_components/hon/button.py#L22"},{"ref":"custom_components/hon/button.py:42-45","code":"   42 |     async def async_press(self) -> None:\n   43 |         \"\"\"Handle the button press.\"\"\"\n   44 |         command = self._device.commands.get(\"startProgram\")\n   45 |         programs = command.get_programs()","lines":4,"link":"https://github.com/gvigroux/hon/blob/7f577423d84c25e1b21734ead6e6db94bcc467e3/custom_components/hon/button.py#L42-L45"}]},{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`HonParameterRange.value`'s setter checks `if self._min <= value <= self._max and not value % self._step:` with no guard against `self._step == 0`. `self._step` comes directly from the API's `incrementValue` (`int(attributes[\"incrementValue\"])`, `parameter.py:59`); if the hOn API ever returns `\"0\"` for a range parameter's increment, any attempt to set that parameter's value raises an unhandled `ZeroDivisionError` from the modulo operation.","fix":"Guard against a zero step before using it in the modulo check:\n\n```python\nif self._min <= value <= self._max and (self._step == 0 or not value % self._step):\n    self._value = value\nelse:\n    raise ValueError(...)\n```","locations":[{"ref":"custom_components/hon/parameter.py:95-105","code":"   95 |     @value.setter\n   96 |     def value(self, value):\n   97 |         if type(value) == str and type(self._step) == float:\n   98 |             value = float(value.replace(\",\",\".\"))\n   99 |         elif type(value) == str:\n  100 |             value = int(float(value.replace(\",\",\".\")))\n  101 | \n  102 |         if self._min <= value <= self._max and not value % self._step:\n  103 |             self._value = value\n  104 |         else:\n  105 |             raise ValueError(f\"Key [{self.key}] Value [{value}] - Allowed: min {self._min} max {self._max} step {self._step}\")","lines":11,"link":"https://github.com/gvigroux/hon/blob/7f577423d84c25e1b21734ead6e6db94bcc467e3/custom_components/hon/parameter.py#L95-L105"}]},{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`HonBaseCoordinator.__init__` wraps the assignment of `self._mac`, `self._type_name`, `self._name`, `self._brand`, `self._model`, `self._fw_version` in a bare `except:` that only logs a warning. If any key is missing from `appliance` (e.g. `appliance[\"brand\"]` raising `KeyError`), none of those attributes get set at all — not even the ones assigned before the failing line, since a `KeyError` aborts the whole block. Any later access to `device_info` (lines 70-80) or `async_set` (lines 63-64), which read `self._mac`, `self._name`, `self._brand`, etc., then raises an unhandled `AttributeError` instead of the original, more informative `KeyError`.","fix":"Set safe defaults before the try block so partially-populated appliance data doesn't leave attributes entirely missing:\n\n```python\nself._mac = appliance.get(\"macAddress\")\nself._type_name = appliance.get(\"applianceTypeName\")\nself._type_id = appliance.get(\"applianceTypeId\")\nself._name = appliance.get(\"nickName\", APPLIANCE_DEFAULT_NAME.get(str(self._type_id), \"hOn Device\"))\nself._brand = appliance.get(\"brand\", \"\")\nself._model = appliance.get(\"modelName\", \"\")\nself._fw_version = appliance.get(\"fwVersion\", \"\")\nif self._mac is None:\n    _LOGGER.warning(f\"Invalid appliance data in {appliance}\")\n```","locations":[{"ref":"custom_components/hon/base.py:33-42","code":"   33 |         try:\n   34 |             self._mac           = appliance[\"macAddress\"]\n   35 |             self._type_name     = appliance[\"applianceTypeName\"]\n   36 |             self._type_id       = appliance[\"applianceTypeId\"]\n   37 |             self._name          = appliance.get(\"nickName\", APPLIANCE_DEFAULT_NAME.get(str(self._type_id), \"Device ID: \" + str(self._type_id)))\n   38 |             self._brand         = appliance[\"brand\"]\n   39 |             self._model         = appliance[\"modelName\"]\n   40 |             self._fw_version    = appliance[\"fwVersion\"]\n   41 |         except:\n   42 |             _LOGGER.warning(f\"Invalid appliance data in {appliance}\" )","lines":10,"link":"https://github.com/gvigroux/hon/blob/7f577423d84c25e1b21734ead6e6db94bcc467e3/custom_components/hon/base.py#L33-L42"},{"ref":"custom_components/hon/base.py:63-64","code":"   63 |     async def async_set(self, parameters):\n   64 |         await self._hon.async_set(self._mac, self._type_name, parameters)","lines":2,"link":"https://github.com/gvigroux/hon/blob/7f577423d84c25e1b21734ead6e6db94bcc467e3/custom_components/hon/base.py#L63-L64"},{"ref":"custom_components/hon/base.py:70-80","code":"   70 |     @property\n   71 |     def device_info(self):\n   72 |         return {\n   73 |             \"identifiers\": {\n   74 |                 (DOMAIN, self._mac, self._type_name)\n   75 |             },\n   76 |             \"name\": self._name,\n   77 |             \"manufacturer\": self._brand,\n   78 |             \"model\": self._model,\n   79 |             \"sw_version\": self._fw_version,\n   80 |         }","lines":11,"link":"https://github.com/gvigroux/hon/blob/7f577423d84c25e1b21734ead6e6db94bcc467e3/custom_components/hon/base.py#L70-L80"}]},{"id":"OTHER_1","type":"other","type_label":"Other","severity":"high","difficulty":"medium","description":"`HonConnection.__init__` creates its `aiohttp.ClientSession` with `aiohttp.TCPConnector(ssl=False)`, which disables TLS certificate verification for every HTTPS request the integration makes to `api-iot.he.services` (login/CIAM auth, appliance list, commands, statistics). This sends the user's hOn email/password and session tokens over connections vulnerable to man-in-the-middle interception/tampering, since the client will accept any certificate (including a spoofed one) for the API host.","fix":"Drop `ssl=False` so the default certificate validation applies:\n\n```python\nself._session = aiohttp.ClientSession(headers=self._header)\n```\n\nIf a specific past TLS issue with the hOn API motivated disabling verification, pin the expected CA/certificate instead of disabling verification outright.","locations":[{"ref":"custom_components/hon/hon.py:69","code":"   69 |         self._session = aiohttp.ClientSession(headers=self._header, connector=aiohttp.TCPConnector(ssl=False))","lines":1,"link":"https://github.com/gvigroux/hon/blob/7f577423d84c25e1b21734ead6e6db94bcc467e3/custom_components/hon/hon.py#L69"}]},{"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"medium","difficulty":"medium","description":"`HonSelect` inherits from both `HonDevice` and `SelectEntity` (`class HonSelect(HonDevice, SelectEntity)`), unlike every other platform entity in this codebase (`HonNumber`, `HonSwitchEntity`, `HonBaseSensorEntity`, etc.), which all use composition — they hold `self._device = coordinator.device` and are otherwise plain `CoordinatorEntity` subclasses. `HonSelect` also sets `self._device = coordinator.device` (`select.py:66`) and uses `self._device` throughout its methods, so the `HonDevice` base class it inherits from contributes an entire parallel, unused set of instance state (`self._commands`, `self._attributes`, `self._appliance_model`, etc. from `HonDevice.__init__`) and a fragile multi-inheritance MRO mixing a data-model class (`HonDevice`, itself a `CoordinatorEntity`) with a Home Assistant `SelectEntity`, for no functional benefit.","fix":"Match the composition pattern used by the rest of the platform entities:\n\n```python\nclass HonSelect(CoordinatorEntity, SelectEntity):\n    def __init__(self, hon, coordinator, appliance, description) -> None:\n        super().__init__(coordinator)\n        self._device = coordinator.device\n        self.entity_description = description\n        self._mac = appliance[\"macAddress\"]\n        self._attr_unique_id = f\"{self._mac}-select-{description.key}\"\n        self._refresh_options()\n```","locations":[{"ref":"custom_components/hon/select.py:63-69","code":"   63 | class HonSelect(HonDevice, SelectEntity):\n   64 |     def __init__(self, hon, coordinator, appliance, description) -> None:\n   65 |         super().__init__(hon, coordinator, appliance)\n   66 |         self._device = coordinator.device\n   67 |         self.entity_description = description\n   68 |         self._attr_unique_id = f\"{self._mac}-select-{description.key}\"\n   69 |         self._refresh_options()","lines":7,"link":"https://github.com/gvigroux/hon/blob/7f577423d84c25e1b21734ead6e6db94bcc467e3/custom_components/hon/select.py#L63-L69"}]}]</script>

<script>
(function(){
'use strict';

// Data
const FINDINGS     = JSON.parse(document.getElementById('D').textContent);
const PROJECT_INFO = JSON.parse(document.getElementById('PI').textContent);
const SEVS     = ['critical','high','medium','low','negligible'];
const STATUSES = ['open','fixed','wont-fix','false-positive'];
const ALL_TYPES = [...new Set(FINDINGS.map(f => f.type))].sort();
// Build lookup map for O(1) access
const FINDING_BY_ID = new Map(FINDINGS.map(f => [f.id, f]));
// Only severities actually present in the report — the filter bar hides the rest.
const PRESENT_SEVS = SEVS.filter(s => FINDINGS.some(f => (f.severity || 'medium') === s));
// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.
const DIFFICULTY_ORDER = ['very_easy','easy','medium','hard'];
const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};
const PRESENT_DIFFS = DIFFICULTY_ORDER.filter(d => FINDINGS.some(f => f.difficulty === d));
const HAS_DIFFICULTY = PRESENT_DIFFS.length > 0;
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State
const S = {
  search: '', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenDiff: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(),
};
const statuses = {};

// Persistence
function loadStatuses() {
  try { Object.assign(statuses, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch {}
}
function saveStatuses() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(statuses)); } catch {}
}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;
function syncHash() {
  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));
    if (S.search)            p.set('q',   S.search);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += '**Description:** ' + (f.description || '') + '\n\n';
      if (f.locations.length) {
        out += '**Locations:**\n\n';
        for (const l of f.locations) {
          if (l.code != null) out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
          else                out += '- `' + l.ref + '` _(file not found)_\n\n';
        }
      }
      out += '**Fix:** ' + (f.fix || '') + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return chunks.join('\n\n') + '\n';
}

// Build project-info.toml from embedded PROJECT_INFO (same format as gen_project_info.py).
function buildProjectInfoToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = Object.assign({}, PROJECT_INFO);
  if (!('description' in pi)) pi.description = '';
  const lines = [
    '# Project metadata for the code audit report (all fields optional).',
    '# Hand-edit freely (e.g. fill in description); re-run the audit without --force to keep edits.',
    '', '[project]'
  ];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += '**Description:** ' + (f.description || '') + '\n\n';
  if (f.locations.length) {
    out += '**Locations:**\n\n';
    for (const l of f.locations) {
      if (l.code != null) out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
      else                out += '- `' + l.ref + '` _(file not found)_\n\n';
    }
  }
  out += '**Fix:** ' + (f.fix || '') + '\n';
  const links = f.locations.map(l => l.link).filter(Boolean);
  if (links.length) out += '\n' + links.join('\n') + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystack per finding (cleared on full re-render)
const _hay = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (!hayOf(f).includes(q) && !st.includes(q)) return false;
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    downloadText(buildFindingsToml(),    'findings.toml',     'application/toml');
    downloadText(buildProjectInfoToml(), 'project-info.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
