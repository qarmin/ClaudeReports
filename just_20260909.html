<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`parse_conjunct` recurses into itself directly for `/` (Join) and via `parse_conjunct` for `+` (Concatenation) and `++` (ListConcatenation) without any depth guard. The `RECURSION_LIMIT` check only exists in `parse_expression_with_condition`, so `a/b/c/d/.../` or `a+b+c+...` with enough operands exhausts the Rust call stack. Verified by running `just` against a justfile `x := a/a/a/...` with 50 000 operands - it crashes with stack overflow. Similarly `parse_disjunct` recurses into itself for `&&` without a depth check (and is only reachable through `parse_expression_with_condition` which already incremented the depth by 1, but `parse_disjunct` -> `parse_conjunct` can recurse indefinitely within that single `parse_expression_with_condition` call).","fix":"Extend the `self.recursion_depth` increment/decrement guard (or introduce a separate counter) to cover `parse_conjunct` and `parse_disjunct` recursive calls, consistent with the existing guard in `parse_expression_with_condition`.","locations":[{"ref":"src/parser.rs:785-812","code":"  785 |   fn parse_conjunct(&mut self) -> CompileResult<'src, Expression<'src>> {\n  786 |     if self.next_is_keyword(Keyword::If) {\n  787 |       self.parse_conditional()\n  788 |     } else if let Some(operator) = self.accept(Slash)? {\n  789 |       let lhs = None;\n  790 |       let rhs = self.parse_conjunct()?.into();\n  791 |       Ok(Expression::Join { lhs, operator, rhs })\n  792 |     } else {\n  793 |       let value = self.parse_value()?;\n  794 | \n  795 |       if let Some(operator) = self.accept(Slash)? {\n  796 |         let lhs = Some(Box::new(value));\n  797 |         let rhs = self.parse_conjunct()?.into();\n  798 |         Ok(Expression::Join { lhs, operator, rhs })\n  799 |       } else if let Some(operator) = self.accept(PlusPlus)? {\n  800 |         self.list_feature(ListFeature::ListConcatenationOperator, operator);\n  801 |         let lhs = value.into();\n  802 |         let rhs = self.parse_conjunct()?.into();\n  803 |         Ok(Expression::ListConcatenation { lhs, operator, rhs })\n  804 |       } else if let Some(operator) = self.accept(Plus)? {\n  805 |         let lhs = value.into();\n  806 |         let rhs = self.parse_conjunct()?.into();\n  807 |         Ok(Expression::Concatenation { lhs, operator, rhs })\n  808 |       } else {\n  809 |         Ok(value)\n  810 |       }\n  811 |     }\n  812 |   }","lines":28,"link":"https://github.com/casey/just/blob/5969e396f4e5c98b64a5df929e3ee67629295d6e/src/parser.rs#L785-L812"},{"ref":"src/parser.rs:741-754","code":"  741 |   fn parse_disjunct(&mut self, condition: bool) -> CompileResult<'src, Expression<'src>> {\n  742 |     let conjunct = self.parse_comparison(condition)?;\n  743 | \n  744 |     let expression = if let Some(token) = self.accept(AmpersandAmpersand)? {\n  745 |       self.list_feature(ListFeature::LogicalOperator, token);\n  746 |       let lhs = conjunct.into();\n  747 |       let rhs = self.parse_disjunct(false)?.into();\n  748 |       Expression::And { lhs, rhs }\n  749 |     } else {\n  750 |       conjunct\n  751 |     };\n  752 | \n  753 |     Ok(expression)\n  754 |   }","lines":14,"link":"https://github.com/casey/just/blob/5969e396f4e5c98b64a5df929e3ee67629295d6e/src/parser.rs#L741-L754"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`parse_value` recurses into itself directly for the `!` (Not/Bang) operator without going through the `parse_expression_with_condition` path that guards against `RECURSION_LIMIT`. An input like `x := !!!!!...` with tens of thousands of consecutive `!` characters causes unbounded Rust call-stack recursion, producing a stack overflow crash (`fatal runtime error: stack overflow, aborting`) instead of a graceful compile error. Verified by running `just` against a generated justfile containing 200 000 `!` operators - it segfaults. The `RECURSION_LIMIT` constant (256 / 48) exists specifically to prevent such crashes, but it is only checked in `parse_expression_with_condition`, leaving all `parse_value`-only recursion unprotected.","fix":"Add a recursion-depth check at the top of `parse_value` (increment and check `self.recursion_depth` before recursing into `parse_value` for `Bang`, and decrement it on return), or convert the loop to iterative using an explicit depth counter, the same way `parse_expression_with_condition` does it.","locations":[{"ref":"src/parser.rs:919-924","code":"  919 |   fn parse_value(&mut self) -> CompileResult<'src, Expression<'src>> {\n  920 |     if let Some(token) = self.accept(Bang)? {\n  921 |       self.list_feature(ListFeature::NegationOperator, token);\n  922 |       Ok(Expression::Not {\n  923 |         operand: self.parse_value()?.into(),\n  924 |       })","lines":6,"link":"https://github.com/casey/just/blob/5969e396f4e5c98b64a5df929e3ee67629295d6e/src/parser.rs#L919-L924"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In `function.rs`, `module_directory` calls `context.execution_context.module.source.parent().unwrap()` (line 519) and both `source_directory` (line 664) and `source_file` (line 684) call `search.justfile.parent().unwrap()`. On virtually all real-world inputs these are safe because justfile paths are always absolute paths with at least one non-root component. However they are unconditional `unwrap()` calls on user-influenced data: if `source` or `search.justfile` were ever set to the filesystem root `/` or to an empty path (e.g. by a crafted or buggy search result), the function panics instead of returning an error. `source_directory` has a second `unwrap()` at line 667 on `.join(context.name.token.path).parent()` which would also panic if the token path somehow resolves to the root.","fix":"Replace each `.unwrap()` with `.ok_or_else(|| format!(\"...\"))?` to return a descriptive error string instead of panicking, consistent with how the rest of `function.rs` handles error cases.","locations":[{"ref":"src/function.rs:520","code":"  520 |   let module_directory = context.execution_context.module.source.parent().unwrap();","lines":1,"link":"https://github.com/casey/just/blob/5969e396f4e5c98b64a5df929e3ee67629295d6e/src/function.rs#L520"},{"ref":"src/function.rs:689-690","code":"  689 |     .parent()\n  690 |     .unwrap()","lines":2,"link":"https://github.com/casey/just/blob/5969e396f4e5c98b64a5df929e3ee67629295d6e/src/function.rs#L689-L690"},{"ref":"src/function.rs:689-690","code":"  689 |     .parent()\n  690 |     .unwrap()","lines":2,"link":"https://github.com/casey/just/blob/5969e396f4e5c98b64a5df929e3ee67629295d6e/src/function.rs#L689-L690"},{"ref":"src/function.rs:689-690","code":"  689 |     .parent()\n  690 |     .unwrap()","lines":2,"link":"https://github.com/casey/just/blob/5969e396f4e5c98b64a5df929e3ee67629295d6e/src/function.rs#L689-L690"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`Token::fmt` (the `ColorDisplay` impl in `token.rs`, line 29) calls `self.src.lines().nth(self.line).unwrap()`. For an empty source string (`src == \"\"`), `lines().count()` is 0, so `self.lines` in the lexer is 0 and the advancement guard `line + 1 < self.lines` is never true, keeping `line` at 0. Any token from an empty file (including the `Eof` token) has `line: 0`, but `\"\".lines().nth(0)` returns `None`, so `.unwrap()` panics. In practice this is not triggered because empty-file errors (\"justfile contains no recipes\") currently do not format a source span, but any future error that references a token from an empty file will panic.","fix":"Replace `.unwrap()` with `.unwrap_or(\"\")` or handle the `None` case explicitly to avoid a panic when `src` is empty or `self.line` exceeds the actual line count.","locations":[{"ref":"src/token.rs:29","code":"   29 |     let line = self.src.lines().nth(self.line).unwrap();","lines":1,"link":"https://github.com/casey/just/blob/5969e396f4e5c98b64a5df929e3ee67629295d6e/src/token.rs#L29"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`join_list(value, sep)` delegates to Rust's `[String]::join()`, which returns an empty string `\"\"` when the input slice is empty. `Value::from(\"\")` wraps that in a single-element vec `[\"\"]​`, producing a non-empty, truthy `Value` instead of the empty `Value::new()` that a caller would expect from joining an empty list. As a result, `join_list([])` and `join_list([], sep)` return `[\"\"]` (truthy, length 1) rather than `[]` (falsy, length 0). Any downstream code that tests the result with `&&`, `||`, or an `if` condition, or passes it to `bool()`, will observe the wrong answer. The `split`/`join_list` round-trip also breaks: `join_list(split(\"\"), sep)` -> `join_list([], sep)` -> `[\"\"]`, not `[]`.","fix":"Add an early return for the empty case: `if value.is_empty() { return Ok(Value::new()); }` before the `join` call.","locations":[{"ref":"src/function.rs:440-442","code":"  440 | fn join_list(_context: Context, value: &Value, separator: Option<&str>) -> ValueResult {\n  441 |   Ok(value.elements().join(separator.unwrap_or(\" \")).into())\n  442 | }","lines":3,"link":"https://github.com/casey/just/blob/5969e396f4e5c98b64a5df929e3ee67629295d6e/src/function.rs#L440-L442"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`public_groups` in Justfile only collects groups from (a) direct `self.recipes` and (b) module-level `set groups := [...]` declarations in immediate submodules via `submodule.groups()`. It does NOT collect groups that are annotated on recipes inside those submodules with `[group('name')]`. As a result, `just --groups` produces an incomplete list whenever modules contain recipes with group annotations; those group names are silently absent from the output. The `list` subcommand calls `public_groups` recursively per module and is also affected at each nesting level for the same reason - a module's own recipe-group annotations ARE collected, but its submodules' recipe-group annotations are not included in that module's `public_groups` return value.","fix":"Add a third loop inside `public_groups` that walks `self.public_modules(config)` recursively and collects groups from each submodule's `public_recipes`. Alternatively, change the first loop to `self.public_recipes_recursive(config)` instead of `self.recipes.values()` to include all descendant recipe groups. Care must be taken to preserve the correct sort key (offset) for unsorted mode.","locations":[{"ref":"src/justfile.rs:763-791","code":"  763 |   pub(crate) fn public_groups(&self, config: &Config) -> Vec<String> {\n  764 |     let mut groups = Vec::new();\n  765 | \n  766 |     for recipe in self.recipes.values() {\n  767 |       if recipe.is_public() {\n  768 |         for group in recipe.groups() {\n  769 |           groups.push((recipe.import_offsets.as_slice(), recipe.name.offset, group));\n  770 |         }\n  771 |       }\n  772 |     }\n  773 | \n  774 |     for submodule in self.public_modules(config) {\n  775 |       for group in submodule.groups() {\n  776 |         groups.push((&[], submodule.name.unwrap().offset, group.to_string()));\n  777 |       }\n  778 |     }\n  779 | \n  780 |     if config.unsorted {\n  781 |       groups.sort();\n  782 |     } else {\n  783 |       groups.sort_by(|(_, _, a), (_, _, b)| a.cmp(b));\n  784 |     }\n  785 | \n  786 |     let mut seen = HashSet::new();\n  787 | \n  788 |     groups.retain(|(_, _, group)| seen.insert(group.clone()));\n  789 | \n  790 |     groups.into_iter().map(|(_, _, group)| group).collect()\n  791 |   }","lines":29,"link":"https://github.com/casey/just/blob/5969e396f4e5c98b64a5df929e3ee67629295d6e/src/justfile.rs#L763-L791"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"When `--group <NAME>` is combined with `--list-submodules`, the group filter is correctly applied at the top level but is silently dropped when recursing into submodules. The recursive call at subcommand.rs:801 passes `&[]` (empty groups) to `list_module` instead of the original `groups` slice, so every recipe inside a shown submodule is printed regardless of whether it belongs to the requested group. For example, if `mod bar` is tagged `[group('foo')]` and contains both a `[group('foo')]` recipe `c` and an ungrouped recipe `d`, then `just --list --group foo --list-submodules` prints `d` even though the user explicitly requested only group `foo` recipes.","fix":"Pass `groups` instead of `&[]` to the recursive `list_module` call so that the group filter is applied consistently throughout the module tree: `Self::list_module(config, depth + 1, groups, submodule)?;`","locations":[{"ref":"src/subcommand.rs:959","code":"  959 |             Self::list_module(config, depth + 1, &[], submodule)?;","lines":1,"link":"https://github.com/casey/just/blob/5969e396f4e5c98b64a5df929e3ee67629295d6e/src/subcommand.rs#L959"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `generate-book/src/main.rs`, the `links` BTreeMap maps heading slugs (computed from heading text) to their target HTML anchor or page. This map is built by iterating over ALL chapters and ALL headings globally, without namespacing the slug key by chapter. If two headings in different chapters (or within the same chapter) produce the same slug (e.g., two sections both titled 'Examples'), the later insertion silently overwrites the earlier one. Any `#anchor` internal link that referenced the first heading would then be silently rewritten to point to the second heading's page/anchor instead. The link rewriting loop at lines 160-170 uses `&links[anchor]` (panics if anchor slug not found in map) but this panic path is guarded by the prior `links.insert` which always stores every heading - so no panic, just wrong links.","fix":"Namespace slug keys by chapter index or filename, e.g., `format!(\"{}/{}\", chapter.filename(), slug)`, and generate links accordingly. Alternatively, detect slug collisions and emit an error.","locations":[{"ref":"crates/generate-book/src/main.rs:126-157","code":"  126 |     let mut links = BTreeMap::new();\n  127 | \n  128 |     for chapter in &chapters {\n  129 |       let mut current = None;\n  130 |       for event in &chapter.events {\n  131 |         match event {\n  132 |           Event::Start(Tag::Heading(..)) => current = Some(Vec::new()),\n  133 |           Event::End(Tag::Heading(level, ..)) => {\n  134 |             let events = current.unwrap();\n  135 |             let title = events\n  136 |               .iter()\n  137 |               .filter_map(|event| match event {\n  138 |                 Event::Code(content) | Event::Text(content) => Some(content.deref()),\n  139 |                 _ => None,\n  140 |               })\n  141 |               .collect::<String>();\n  142 |             let slug = slug(&title);\n  143 |             let link = if let HeadingLevel::H1 | HeadingLevel::H2 | HeadingLevel::H3 = level {\n  144 |               format!(\"{}.html\", chapter.filename())\n  145 |             } else {\n  146 |               format!(\"{}.html#{}\", chapter.filename(), slug)\n  147 |             };\n  148 |             links.insert(slug, link);\n  149 |             current = None;\n  150 |           }\n  151 |           _ => {\n  152 |             if let Some(events) = &mut current {\n  153 |               events.push(event.clone());\n  154 |             }\n  155 |           }\n  156 |         }\n  157 |       }","lines":32,"link":"https://github.com/casey/just/blob/5969e396f4e5c98b64a5df929e3ee67629295d6e/crates/generate-book/src/main.rs#L126-L157"},{"ref":"crates/generate-book/src/main.rs:160-170","code":"  160 |     for chapter in &mut chapters {\n  161 |       for event in &mut chapter.events {\n  162 |         if let Event::Start(Tag::Link(_, dest, _)) | Event::End(Tag::Link(_, dest, _)) = event {\n  163 |           if let Some(anchor) = dest.clone().strip_prefix('#') {\n  164 |             if anchor != \"just\" {\n  165 |               *dest = CowStr::Borrowed(&links[anchor]);\n  166 |             }\n  167 |           }\n  168 |         }\n  169 |       }\n  170 |     }","lines":11,"link":"https://github.com/casey/just/blob/5969e396f4e5c98b64a5df929e3ee67629295d6e/crates/generate-book/src/main.rs#L160-L170"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"The `ConfigError::SubcommandArguments` display format (config_error.rs:24-32) lowercases the `subcommand` field with `subcommand.to_lowercase()`, so error messages for `--changelog`, `--dump`, `--edit`, etc., print `--changelog`, `--dump`, `--edit` which is correct. However, for `--fmt` the stored subcommand name is `\"FORMAT\"` (from the `Subcommand::Format` strum `SCREAMING_SNAKE_CASE` serialisation), so the error reads `` `--format` used with unexpected argument `bar` `` rather than `--fmt`. A user who typed `--fmt bar` will see `--format` in the error, which is the alias name rather than the flag they used, and may be confusing (though technically both are valid spellings due to the `alias` attribute on that flag).","fix":"Either store the actual flag string used (`fmt` vs `format`) alongside the subcommand name when constructing `SubcommandArguments`, or document that the canonical alias is shown in error messages.","locations":[{"ref":"src/config_error.rs:25-33","code":"   25 |     \"`--{}` used with unexpected {}: {}\",\n   26 |     subcommand.to_lowercase(),\n   27 |     Count::unnumbered(\"argument\", arguments.len()),\n   28 |     List::and_ticked(arguments)\n   29 |   ))]\n   30 |   SubcommandArguments {\n   31 |     subcommand: &'static str,\n   32 |     arguments: Vec<String>,\n   33 |   },","lines":9,"link":"https://github.com/casey/just/blob/5969e396f4e5c98b64a5df929e3ee67629295d6e/src/config_error.rs#L25-L33"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `evaluate_defined_function` (evaluator.rs:286), `self.context.as_ref().unwrap()` panics if `self.context` is `None`. Similarly, the `context!()` macro in `evaluate_builtin_function` (evaluator.rs:326-328) calls `.unwrap()` on `self.function_context(name)` which returns `Err` when `self.context` is `None`. In practice these panics are unreachable because `evaluate_value`'s `Expression::Call` arm (evaluator.rs:487) checks `self.context` with `?` before dispatching to either function - so `None` context is caught and converted to `Error::Const` before reaching the unwraps. However, the unwraps are load-bearing invariant assertions that are not enforced by the type system; if a future refactor adds a new call site that bypasses the `Expression::Call` gate (e.g., an optimized fast path), the panics become reachable with no compile-time warning. The `self.context` field being `Option` while both callee functions assume `Some` is a latent unsafety.","fix":"Propagate the error instead of unwrapping: change the unwrap at line 286 to `?` (adjusting the return type or error conversion), and change the `context!()` macro to return `Err(...)` instead of panicking. Alternatively, restructure so `evaluate_defined_function` and `evaluate_builtin_function` receive a pre-validated `&ExecutionContext` argument rather than reading it from `self`.","locations":[{"ref":"src/evaluator.rs:289","code":"  289 |     let context = *self.context.as_ref().unwrap();","lines":1,"link":"https://github.com/casey/just/blob/5969e396f4e5c98b64a5df929e3ee67629295d6e/src/evaluator.rs#L289"},{"ref":"src/evaluator.rs:526-534","code":"  526 |       Expression::Call { name, arguments } => {\n  527 |         let module = self.context(ConstError::FunctionCall(*name))?.module;\n  528 |         if let Some(function) = module.functions.get(name.lexeme()) {\n  529 |           self.evaluate_defined_function(function, arguments)\n  530 |         } else if let Some(builtin) = function::get(name.lexeme()) {\n  531 |           self.evaluate_builtin_function(*name, builtin, arguments)\n  532 |         } else {\n  533 |           unreachable!();\n  534 |         }","lines":9,"link":"https://github.com/casey/just/blob/5969e396f4e5c98b64a5df929e3ee67629295d6e/src/evaluator.rs#L526-L534"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `signal_handler.rs`, the `caught` field of the singleton `SignalHandler` is set when a fatal signal is received during child process execution but is never cleared after being read by `spawn()`. The `spawn()` function returns `instance.caught` at line 141 without resetting it to `None`. As a result, once any fatal signal has been caught, every subsequent call to `spawn()` will report `Some(signal)` even if no new signal has arrived. In practice the immediate `Error::Interrupted` propagation limits real-world impact for normal (non-infallible) recipe lines, but for recipes with the `[no-exit-message]`/infallible attribute the per-line caught check is skipped (`if !infallible { ... }`), so execution continues through the loop and each subsequent `status_guard()` call within the same recipe will spuriously report the old signal. Any recipe executing after a signal-interrupted recipe in the same `just` invocation would also receive the stale `caught` value.","fix":"After reading `instance.caught` at line 141, reset it: store the value locally, then set `instance.caught = None` before returning. E.g.: `let caught = instance.caught.take(); (result, caught)`","locations":[{"ref":"src/signal_handler.rs:114-146","code":"  114 |   pub(crate) fn spawn<T>(\n  115 |     mut command: Command,\n  116 |     f: impl Fn(process::Child) -> io::Result<T>,\n  117 |   ) -> (io::Result<T>, Option<Signal>) {\n  118 |     let mut instance = Self::instance();\n  119 | \n  120 |     let child = match command.spawn() {\n  121 |       Err(err) => return (Err(err), None),\n  122 |       Ok(child) => child,\n  123 |     };\n  124 | \n  125 |     let pid = match child.id().try_into() {\n  126 |       Err(err) => {\n  127 |         return (\n  128 |           Err(io::Error::other(format!(\"invalid child PID: {err}\"))),\n  129 |           None,\n  130 |         );\n  131 |       }\n  132 |       Ok(pid) => pid,\n  133 |     };\n  134 | \n  135 |     instance.children.insert(pid, command);\n  136 | \n  137 |     drop(instance);\n  138 | \n  139 |     let result = f(child);\n  140 | \n  141 |     let mut instance = Self::instance();\n  142 | \n  143 |     instance.children.remove(&pid);\n  144 | \n  145 |     (result, instance.caught)\n  146 |   }","lines":33,"link":"https://github.com/casey/just/blob/5969e396f4e5c98b64a5df929e3ee67629295d6e/src/signal_handler.rs#L114-L146"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `signals.rs`, the write end of the signal-forwarding pipe (`WRITE`) is stored with `Ordering::Relaxed` in `compare_exchange` (success ordering), and read inside the async signal handler with `Ordering::Relaxed`. Under Rust's memory model, without a Release/Acquire pairing there is no formal guarantee that the signal handler thread will observe the fd value written before `sigaction` installs the handler. In practice, `sigaction` is a kernel syscall that acts as a full hardware memory fence, so the value is always visible before any signal is delivered; however, the code formally has UB according to Rust's abstract machine. On architectures with weak memory ordering (ARM, POWER) this could theoretically be reordered. Additionally, `WRITE` is never reset to `INVALID_FILENO` if `Signals::new()` is called a second time after the first `write` fd is consumed, because the `compare_exchange` correctly panics - but the original write fd (`into_raw_fd()` consumed) is leaked if `sigaction` subsequently fails (between lines 96 and 118).","fix":"Use `Ordering::Release` for the `compare_exchange` success ordering and `Ordering::Acquire` for `WRITE.load(...)` in the signal handler to satisfy Rust's memory model formally. For the fd leak, if any `sigaction` call fails, the write fd should be closed before returning the error.","locations":[{"ref":"src/signals.rs:92-102","code":"   92 |     if WRITE\n   93 |       .compare_exchange(\n   94 |         INVALID_FILENO,\n   95 |         write.into_raw_fd(),\n   96 |         atomic::Ordering::Relaxed,\n   97 |         atomic::Ordering::Relaxed,\n   98 |       )\n   99 |       .is_err()\n  100 |     {\n  101 |       panic!(\"signal iterator cannot be initialized twice\");\n  102 |     }","lines":11,"link":"https://github.com/casey/just/blob/5969e396f4e5c98b64a5df929e3ee67629295d6e/src/signals.rs#L92-L102"},{"ref":"src/signals.rs:45-62","code":"   45 | extern \"C\" fn handler(signal: libc::c_int) {\n   46 |   let errno = Errno::last();\n   47 | \n   48 |   let Ok(signal) = u8::try_from(signal) else {\n   49 |     die(\"unexpected signal\");\n   50 |   };\n   51 | \n   52 |   // SAFETY:\n   53 |   //\n   54 |   // `WRITE` is initialized before the signal handler can run and remains open\n   55 |   // for the duration of the program.\n   56 |   let fd = unsafe { BorrowedFd::borrow_raw(WRITE.load(atomic::Ordering::Relaxed)) };\n   57 | \n   58 |   if let Err(err) = nix::unistd::write(fd, &[signal]) {\n   59 |     die(err.desc());\n   60 |   }\n   61 | \n   62 |   errno.set();","lines":18,"link":"https://github.com/casey/just/blob/5969e396f4e5c98b64a5df929e3ee67629295d6e/src/signals.rs#L45-L62"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"The `bool()` built-in function explicitly treats the empty string `\"\"` as false (function.rs:160), but the language's native truthiness check `is_truthy()` (value.rs:67-69) treats `\"\"` (which is `Value { elements: [\"\"]​ }`) as true because it only tests `!elements.is_empty()`. Consequently, `if \"\" { \"yes\" } else { \"no\" }` evaluates to `\"yes\"`, while `bool(\"\")` returns the empty (falsy) value. Operators `&&`, `||`, and `!` all use `is_truthy`, so the language has two incompatible notions of boolean truth for the empty string. Users who call `bool()` to test a value they also test with `if`/`&&`/`||` will observe contradictory results.","fix":"Document the two distinct truthiness semantics clearly in the language reference. If unification is desired, either change `is_truthy` to also treat a single-element `[\"\"]` value as false (matching `bool()`), or change `bool(\"\")` to return `\"true\"` (matching `is_truthy`). A breaking change either way, but the current state silently surprises users.","locations":[{"ref":"src/value.rs:72-74","code":"   72 |   pub(crate) fn is_truthy(&self) -> bool {\n   73 |     !self.elements.is_empty()\n   74 |   }","lines":3,"link":"https://github.com/casey/just/blob/5969e396f4e5c98b64a5df929e3ee67629295d6e/src/value.rs#L72-L74"},{"ref":"src/function.rs:165-178","code":"  165 | fn bool(context: Context, value: &Value) -> ValueResult {\n  166 |   let condition = match value.elements() {\n  167 |     [] => false,\n  168 |     [element] => match element.as_str() {\n  169 |       \"\" | \"0\" | \"false\" => false,\n  170 |       \"1\" | \"true\" => true,\n  171 |       _ => return Err(format!(\"`{element}` is not a valid boolean string\")),\n  172 |     },\n  173 |     _ => {\n  174 |       return Err(\"multi-element lists cannot be converted into booleans\".into());\n  175 |     }\n  176 |   };\n  177 |   Ok(boolean(&context, condition))\n  178 | }","lines":14,"link":"https://github.com/casey/just/blob/5969e396f4e5c98b64a5df929e3ee67629295d6e/src/function.rs#L165-L178"},{"ref":"src/evaluator.rs:485-492","code":"  485 |       Expression::And { lhs, rhs } => {\n  486 |         let lhs = self.evaluate_value(lhs)?;\n  487 |         if lhs.is_truthy() {\n  488 |           self.evaluate_value(rhs)\n  489 |         } else {\n  490 |           Ok(Value::new())\n  491 |         }\n  492 |       }","lines":8,"link":"https://github.com/casey/just/blob/5969e396f4e5c98b64a5df929e3ee67629295d6e/src/evaluator.rs#L485-L492"},{"ref":"src/evaluator.rs:605-612","code":"  605 |       Expression::Not { operand } => Ok((!self.evaluate_value(operand)?.is_truthy()).into()),\n  606 |       Expression::Or { lhs, rhs } => {\n  607 |         let lhs = self.evaluate_value(lhs)?;\n  608 |         if lhs.is_truthy() {\n  609 |           Ok(lhs)\n  610 |         } else {\n  611 |           self.evaluate_value(rhs)\n  612 |         }","lines":8,"link":"https://github.com/casey/just/blob/5969e396f4e5c98b64a5df929e3ee67629295d6e/src/evaluator.rs#L605-L612"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `Subcommand::request()`, the internal `--request signal` handler calls `sigset.thread_block().unwrap()` and `sigset.wait().unwrap()` (src/subcommand.rs:499-501). Both are OS-level syscalls that can fail (e.g., if the calling thread lacks privileges or the signal set is invalid), in which case `just` will panic with a thread-panic backtrace rather than returning a structured `RunResult` error. Although `--request` is marked hidden and internal-use-only, panics are still an undesirable failure mode.","fix":"Replace `unwrap()` calls with `map_err` to convert `nix::Error` into an `Error::Internal` (or a dedicated error variant) and return it via `RunResult`.","locations":[{"ref":"src/subcommand.rs:604-610","code":"  604 |         let sigset = nix::sys::signal::SigSet::all();\n  605 | \n  606 |         sigset.thread_block().unwrap();\n  607 | \n  608 |         let received = sigset.wait().unwrap();\n  609 | \n  610 |         Response::Signal(received.as_str().into())","lines":7,"link":"https://github.com/casey/just/blob/5969e396f4e5c98b64a5df929e3ee67629295d6e/src/subcommand.rs#L604-L610"}]},

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('qs'))  { S.searchScope = p.get('qs'); }
  document.getElementById('search-scope').classList.toggle('active', S.searchScope === 'locations');
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Render a "**Label:** value" line. GitHub/CommonMark only recognizes a
// ``` fence when it starts at the beginning of a line, so if the value
// itself opens with a fence, put it on its own line instead of right
// after the inline label - otherwise the fence marker gets glued onto
// "**Label:** ```" and never renders as a code block.
function mdField(label, value) {
  value = value || '';
  return /^```/.test(value.trim())
    ? '**' + label + ':**\n\n' + value
    : '**' + label + ':** ' + value;
}

// Render the "**Locations:**" block. When a location has a commit-pinned
// permalink (GitHub/GitLab), just paste the bare URL on its own line -
// GitHub/GitLab auto-expand a line-range blob link into an inline code
// preview, so re-pasting the snippet as a fenced block would duplicate it.
// Forges without a detected permalink shape (or missing commit/repo info)
// fall back to the fenced ref+snippet so the location is still readable.
function mdLocations(locations) {
  if (!locations.length) return '';
  let out = '**Locations:**\n\n';
  for (const l of locations) {
    if (l.link)               out += l.link + '\n\n';
    else if (l.code != null)  out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
    else                      out += '- `' + l.ref + '` _(file not found)_\n\n';
  }
  return out;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += mdField('Description', f.description) + '\n\n';
      out += mdLocations(f.locations);
      out += mdField('Fix', f.fix) + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build a [project] header block from embedded PROJECT_INFO, so the exported
// findings.toml is self-contained (doesn't depend on a sibling project-info.toml
// that a second, separately-triggered download could silently fail to save).
// '' when there is no project info at all.
function buildProjectToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = PROJECT_INFO || {};
  if (!Object.keys(pi).length) return '';
  const lines = ['[project]'];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n\n';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return buildProjectToml() + chunks.join('\n\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += mdField('Description', f.description) + '\n\n';
  out += mdLocations(f.locations);
  out += mdField('Fix', f.fix) + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystacks per finding (cleared on full re-render).
// Two variants: everything (default), and file/folder paths only - for when a
// search term (e.g. a directory name like 'dlls/abc') also happens to appear
// inside description/fix prose and you only want path matches.
const _hay = new Map();
const _hayLoc = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}
function hayLocOf(f) {
  if (!_hayLoc.has(f.id)) {
    _hayLoc.set(f.id, f.locations.map(l => l.ref).join(' ').toLowerCase());
  }
  return _hayLoc.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (S.searchScope === 'locations') {
      if (!hayLocOf(f).includes(q)) return false;
    } else if (!hayOf(f).includes(q) && !st.includes(q)) {
      return false;
    }
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  _hayLoc.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    // Single download (was two) - a second auto-triggered download is commonly
    // blocked by the browser unless the user explicitly allows it, which silently
    // drops project-info.toml. Embedding [project] in findings.toml itself avoids
    // that failure mode entirely.
    downloadText(buildFindingsToml(), 'findings.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});
document.getElementById('search-scope').addEventListener('click', e => {
  S.searchScope = S.searchScope === 'locations' ? 'all' : 'locations';
  e.currentTarget.classList.toggle('active', S.searchScope === 'locations');
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
