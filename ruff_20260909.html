<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"critical","difficulty":"very_easy","description":"`TodoDirective::from_comment` slices the comment using `directive_kind.len()` (the hard-coded ASCII byte length of the directive keyword, e.g. `4` for `HACK`) instead of the actual byte length of the matched word. Because `TodoDirectiveKind::from_str` matches on `s.to_lowercase()`, a word containing a non-ASCII character whose lowercase form is ASCII will match while having a different byte length. The classic case is `U+212A KELVIN SIGN` (`K`), which is `is_alphanumeric()` (so it is part of `first_word`) and lowercases to ASCII `k`, so `HAC\\u{212A}` parses as `TodoDirectiveKind::Hack` with `len == 4` while occupying 6 bytes. `&comment[TextRange::at(relative_offset, len)]` then slices into the middle of a multi-byte character and panics.\n\nConfirmed repro (file containing `# HAC\\u{212A}` and any of `TD`/`FIX` rules selected):\n```\n$ ruff check --isolated --select TD,FIX t3.py\npanic: Panicked at crates/ruff_linter/src/directives.rs:321:38 when checking `t3.py`:\n`end byte index 6 is not a char boundary; it is inside 'K' (bytes 5..8 of string)`\n```\nAny user file with such a comment crashes `ruff check` whenever a `flake8-todos` (`TD`) or `flake8-fixme` (`FIX`) rule is enabled.","fix":"Use the real byte length of the matched word instead of the enum's nominal length.\n\nBefore:\n```rust\nif let Ok(directive_kind) = first_word.parse::<TodoDirectiveKind>() {\n    let len = directive_kind.len();\n```\nAfter:\n```rust\nif let Ok(directive_kind) = first_word.parse::<TodoDirectiveKind>() {\n    let len = first_word.text_len();\n```\n`TextLen` is already imported in this file. `TodoDirectiveKind::len` has no other callers (`grep` shows the only use is line 318), so it should be deleted along with this change.","locations":[{"ref":"crates/ruff_linter/src/directives.rs:313-325","code":"  313 |             let first_word = trimmed.split(|c: char| !c.is_alphanumeric()).next()?;\n  314 | \n  315 |             // If we detect a TodoDirectiveKind variant substring in the comment, construct and\n  316 |             // return the appropriate TodoDirective\n  317 |             if let Ok(directive_kind) = first_word.parse::<TodoDirectiveKind>() {\n  318 |                 let len = directive_kind.len();\n  319 | \n  320 |                 return Some(Self {\n  321 |                     content: &comment[TextRange::at(relative_offset, len)],\n  322 |                     range: TextRange::at(comment_range.start() + relative_offset, len),\n  323 |                     kind: directive_kind,\n  324 |                 });\n  325 |             }","lines":13,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/directives.rs#L313-L325"},{"ref":"crates/ruff_linter/src/directives.rs:362-370","code":"  362 | impl TodoDirectiveKind {\n  363 |     fn len(&self) -> TextSize {\n  364 |         match self {\n  365 |             TodoDirectiveKind::Xxx => TextSize::new(3),\n  366 |             TodoDirectiveKind::Hack | TodoDirectiveKind::Todo => TextSize::new(4),\n  367 |             TodoDirectiveKind::Fixme => TextSize::new(5),\n  368 |         }\n  369 |     }\n  370 | }","lines":9,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/directives.rs#L362-L370"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`relativize_path_to` in the GitLab renderer unwraps `pathdiff::diff_paths` with `.expect(\"Could not diff paths\")`. `pathdiff::diff_paths(path, base)` returns `None` whenever `path` is relative and `base` is absolute. `project_dir` comes from the `CI_PROJECT_DIR` environment variable (always set inside GitLab CI, and absolute), while `file.path(resolver)` for Ruff diagnostics is the `SourceFile` name, which is `-` when reading from stdin without `--stdin-filename`. That combination crashes the whole process.\n\nReproduced against `target/debug/ruff`:\n\n```\n$ echo 'import os' | CI_PROJECT_DIR=/tmp/gltest ruff check --isolated --select F401 --output-format gitlab -\nerror: Ruff crashed. ...\nthread 'main' panicked at crates/ruff_db/src/diagnostic/render/gitlab.rs:180:14:\nCould not diff paths\n```","fix":"Make `relativize_path_to` fall back to the original path instead of panicking, e.g. change\n\n```rust\nfn relativize_path_to<P: AsRef<Path>, R: AsRef<Path>>(path: P, project_root: R) -> String {\n    format!(\n        \"{}\",\n        pathdiff::diff_paths(&path, project_root)\n            .expect(\"Could not diff paths\")\n            .display()\n    )\n}\n```\n\nto\n\n```rust\nfn relativize_path_to<P: AsRef<Path>, R: AsRef<Path>>(path: P, project_root: R) -> String {\n    pathdiff::diff_paths(&path, project_root)\n        .unwrap_or_else(|| path.as_ref().to_path_buf())\n        .display()\n        .to_string()\n}\n```","locations":[{"ref":"crates/ruff_db/src/diagnostic/render/gitlab.rs:175-183","code":"  175 | /// Convert an absolute path to be relative to the specified project root.\n  176 | fn relativize_path_to<P: AsRef<Path>, R: AsRef<Path>>(path: P, project_root: R) -> String {\n  177 |     format!(\n  178 |         \"{}\",\n  179 |         pathdiff::diff_paths(&path, project_root)\n  180 |             .expect(\"Could not diff paths\")\n  181 |             .display()\n  182 |     )\n  183 | }","lines":9,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_db/src/diagnostic/render/gitlab.rs#L175-L183"},{"ref":"crates/ruff_db/src/diagnostic/render/gitlab.rs:86-89","code":"   86 |                     let path = self.project_dir.as_ref().map_or_else(\n   87 |                         || file.relative_path(self.resolver).display().to_string(),\n   88 |                         |project_dir| relativize_path_to(file.path(self.resolver), project_dir),\n   89 |                     );","lines":4,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_db/src/diagnostic/render/gitlab.rs#L86-L89"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`FormatRange`/`LineColumn` accept an arbitrarily large column number from `--range`, and `FormatRange::to_text_range` passes it unclamped to `LineIndex::offset`. For an ASCII source file, `LineIndex::offset` does `TextSize::try_from(character_offset).unwrap()`, which panics when the column exceeds `u32::MAX`. `LineColumn::from_str` parses the column as `usize` with no upper bound, and the early-return guard in `LineIndex::offset` only protects against out-of-range *line* numbers, not columns.\n\nReproduced with the debug binary:\n\n```\n$ ruff format --isolated --range=1:1-1:5000000000 /tmp/rangetest.py\nerror: Panicked while formatting rangetest.py: This indicates a bug in Ruff...\npanicked at crates/ruff_source_file/src/line_index.rs:497:50:\ncalled `Result::unwrap()` on an `Err` value: TryFromIntError(PosOverflow)\n```","fix":"Clamp the column (and line) to a value representable as `TextSize` when converting. In `FormatRange::to_text_range`, build the `SourceLocation` from `OneIndexed::new(self.start.column.get().min(u32::MAX as usize))` (same for `end`), or better, validate in `LineColumn::from_str` and reject/saturate columns greater than `u32::MAX` so that the error is reported as a normal `--range` parse error instead of a panic.","locations":[{"ref":"crates/ruff/src/args.rs:1171-1182","code":" 1171 | impl FormatRange {\n 1172 |     /// Converts the line:column range to a byte offset range specific for `source`.\n 1173 |     ///\n 1174 |     /// Returns an empty range if the start range is past the end of `source`.\n 1175 |     pub(super) fn to_text_range(self, source: &str, line_index: &LineIndex) -> TextRange {\n 1176 |         let start_byte_offset =\n 1177 |             line_index.offset(self.start.into(), source, PositionEncoding::Utf32);\n 1178 |         let end_byte_offset = line_index.offset(self.end.into(), source, PositionEncoding::Utf32);\n 1179 | \n 1180 |         TextRange::new(start_byte_offset, end_byte_offset)\n 1181 |     }\n 1182 | }","lines":12,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff/src/args.rs#L1171-L1182"},{"ref":"crates/ruff/src/args.rs:1299-1313","code":" 1299 |     fn from_str(value: &str) -> Result<Self, Self::Err> {\n 1300 |         let (line, column) = value.split_once(':').unwrap_or((value, \"1\"));\n 1301 | \n 1302 |         let line: usize = line.parse().map_err(LineColumnParseError::LineParseError)?;\n 1303 |         let column: usize = column\n 1304 |             .parse()\n 1305 |             .map_err(LineColumnParseError::ColumnParseError)?;\n 1306 | \n 1307 |         match (OneIndexed::new(line), OneIndexed::new(column)) {\n 1308 |             (Some(line), Some(column)) => Ok(LineColumn { line, column }),\n 1309 |             (Some(line), None) => Err(LineColumnParseError::ZeroColumnIndex { line }),\n 1310 |             (None, Some(column)) => Err(LineColumnParseError::ZeroLineIndex { column }),\n 1311 |             (None, None) => Err(LineColumnParseError::ZeroLineAndColumnIndex),\n 1312 |         }\n 1313 |     }","lines":15,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff/src/args.rs#L1299-L1313"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"In `Cache::open`, when the deserialized `PackageCache` has a `package_root` that differs from the requested `package_root`, the code warns and clears `package.files` but leaves the stale `package.package_root` in place. Every subsequent call to `Cache::relative_path` does `path.strip_prefix(&self.package.package_root)`, which then returns `None` for every file in the package. Both `crate::diagnostics::lint_path` (`cache.relative_path(path).expect(\"wrong package cache for file\")`) and `crate::commands::format::format_path` unwrap that `Option` with `.expect(...)`, so the recovery path deliberately taken here leads straight to a panic instead. `Cache::persist` would also write the wrong `package_root` back to disk.","fix":"Reset the root when clearing the files so the in-memory cache describes the package actually being linted:\n\n```rust\nif package.package_root != package_root {\n    warn_user!(\n        \"Different package root in cache: expected `{}`, got `{}`\",\n        package_root.display(),\n        package.package_root.display(),\n    );\n    return Cache::empty(path, package_root);\n}\n```\n\n`Cache::empty` already builds a `PackageCache` with the correct `package_root` and an empty `files` map.","locations":[{"ref":"crates/ruff/src/cache.rs:123-132","code":"  123 |         // Sanity check.\n  124 |         if package.package_root != package_root {\n  125 |             warn_user!(\n  126 |                 \"Different package root in cache: expected `{}`, got `{}`\",\n  127 |                 package_root.display(),\n  128 |                 package.package_root.display(),\n  129 |             );\n  130 |             package.files.clear();\n  131 |         }\n  132 |         Cache::new(path, package)","lines":10,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff/src/cache.rs#L123-L132"},{"ref":"crates/ruff/src/diagnostics.rs:192-198","code":"  192 |     let caching = match cache {\n  193 |         Some(cache) if noqa.is_enabled() => {\n  194 |             let relative_path = cache\n  195 |                 .relative_path(path)\n  196 |                 .expect(\"wrong package cache for file\");\n  197 | \n  198 |             let cache_key = FileCacheKey::from_path(path).context(\"Failed to create cache key\")?;","lines":7,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff/src/diagnostics.rs#L192-L198"},{"ref":"crates/ruff/src/commands/format.rs:262-272","code":"  262 |     if let Some(cache) = cache {\n  263 |         let relative_path = cache\n  264 |             .relative_path(path)\n  265 |             .expect(\"wrong package cache for file\");\n  266 | \n  267 |         if let Ok(cache_key) = FileCacheKey::from_path(path) {\n  268 |             if cache.is_formatted(relative_path, &cache_key) {\n  269 |                 return Ok(FormatResult::Unchanged);\n  270 |             }\n  271 |         }\n  272 |     }","lines":11,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff/src/commands/format.rs#L262-L272"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`analyze_graph` converts the current working directory with `SystemPathBuf::from_path_buf(CWD.clone()).expect(\"Expected a UTF-8 working directory\")`. On Unix a non-UTF-8 working directory is legal, so running `ruff analyze graph` from such a directory aborts with a panic (and the global panic hook telling the user to file a Ruff bug) rather than a clean error message. Every other path conversion in this function handles the failure gracefully with `warn!`.","fix":"Return an error instead of panicking:\n\n```rust\nlet root = SystemPathBuf::from_path_buf(CWD.clone())\n    .map_err(|path| anyhow::anyhow!(\"The working directory `{}` is not valid UTF-8\", path.display()))?;\n```","locations":[{"ref":"crates/ruff/src/commands/analyze_graph.rs:34-36","code":"   34 |     // Write all paths relative to the current working directory.\n   35 |     let root =\n   36 |         SystemPathBuf::from_path_buf(CWD.clone()).expect(\"Expected a UTF-8 working directory\");","lines":3,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff/src/commands/analyze_graph.rs#L34-L36"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`impl Default for OsSystem` swallows both failure modes of determining the current directory and then feeds the result into `OsSystem::new`, which asserts `cwd.as_utf8_path().is_absolute()`. If `std::env::current_dir()` fails (for example the working directory was deleted) or the working directory is not valid UTF-8, both `unwrap_or_default()` calls yield an empty path and the assertion fires, aborting with `assertion failed: cwd.as_utf8_path().is_absolute()` rather than a diagnostic. This is reachable from `ruff analyze graph`, which constructs the system with `OsSystem::default()`.","fix":"Make the fallible construction explicit instead of defaulting to an empty path, e.g. add\n```rust\nimpl OsSystem {\n    pub fn try_from_current_dir() -> std::io::Result<Self> {\n        let cwd = std::env::current_dir()?;\n        let cwd = SystemPathBuf::from_path_buf(cwd)\n            .map_err(|path| std::io::Error::new(std::io::ErrorKind::InvalidData, format!(\"Non-UTF-8 working directory: {}\", path.display())))?;\n        Ok(Self::new(cwd))\n    }\n}\n```\nand have `ruff analyze graph` report that error instead of using `OsSystem::default()`.","locations":[{"ref":"crates/ruff_db/src/system/os.rs:39-56","code":"   39 |     pub fn new(cwd: impl AsRef<SystemPath>) -> Self {\n   40 |         let cwd = cwd.as_ref();\n   41 |         assert!(cwd.as_utf8_path().is_absolute());\n   42 | \n   43 |         tracing::debug!(\n   44 |             \"Architecture: {}, OS: {}\",\n   45 |             std::env::consts::ARCH,\n   46 |             std::env::consts::OS,\n   47 |         );\n   48 | \n   49 |         Self {\n   50 |             // Spreading `..Default` because it isn't possible to feature gate the initializer of a single field.\n   51 |             inner: Arc::new(OsSystemInner {\n   52 |                 cwd: cwd.to_path_buf(),\n   53 |                 ..Default::default()\n   54 |             }),\n   55 |         }\n   56 |     }","lines":18,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_db/src/system/os.rs#L39-L56"},{"ref":"crates/ruff_db/src/system/os.rs:278-285","code":"  278 | impl Default for OsSystem {\n  279 |     fn default() -> Self {\n  280 |         Self::new(\n  281 |             SystemPathBuf::from_path_buf(std::env::current_dir().unwrap_or_default())\n  282 |                 .unwrap_or_default(),\n  283 |         )\n  284 |     }\n  285 | }","lines":8,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_db/src/system/os.rs#L278-L285"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"`format_dev_project` unconditionally indexes `files[0]` (three times: `BlackOptions::from_file(&files[0])`, `files[0].display()`, and `files[0].file_name()`), but `Args::files` is an optional positional argument. Running `cargo dev format-dev` without any path (and without `--multi-project`) reaches `format_dev_project(&args.files, ...)` with an empty slice and panics with `index out of bounds: the len is 0 but the index is 0` instead of printing a usage error.","fix":"Bail out early in `format_dev_project`:\n```rust\n// before\nlet black_options = BlackOptions::from_file(&files[0])?;\n// after\nlet Some(first_file) = files.first() else {\n    bail!(\"No paths given; pass at least one file or directory\");\n};\nlet black_options = BlackOptions::from_file(first_file)?;\n```\nand use `first_file` for the subsequent `files[0]` uses.","locations":[{"ref":"crates/ruff_dev/src/format_dev.rs:456-465","code":"  456 |     let start = Instant::now();\n  457 | \n  458 |     // TODO(konstin): The assumptions between this script (one repo) and ruff (pass in a bunch of\n  459 |     // files) mismatch.\n  460 |     let black_options = BlackOptions::from_file(&files[0])?;\n  461 |     debug!(\n  462 |         parent: None,\n  463 |         \"Options for {}: {black_options:?}\",\n  464 |         files[0].display()\n  465 |     );","lines":10,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_dev/src/format_dev.rs#L456-L465"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`QueueContentIterator::next` uses `top.expect(\"Missing end signal.\")` when the queue runs dry before the matching end tag is found. Every other malformed-document path in the printer returns `PrintError::InvalidDocument` (see `invalid_end_tag`, `invalid_start_tag`, `CallStack::pop`), so this one site turns a recoverable \"invalid document\" condition into a hard panic in release builds. It is reachable from `Printer::print_element`'s `StartLineSuffix` handling (`queue.iter_content(TagKind::LineSuffix)`) and from `Queue::skip_content`, and is also the panic that the `PrintQueue::pop` truncation bug reported above can trigger.","fix":"Make the iterator yield `PrintResult<&FormatElement>` (or stop yielding and record an error on the iterator) instead of panicking, e.g. change `type Item = &'a FormatElement;` to `type Item = PrintResult<&'a FormatElement>` and replace\n\n```rust\nmatch top.expect(\"Missing end signal.\") {\n```\n\nwith\n\n```rust\nlet Some(top) = top else {\n    self.depth = 0;\n    return Some(invalid_end_tag(self.kind, None));\n};\nmatch top {\n```\n\nand propagate the error at the two call sites (`Queue::skip_content` and the `StartLineSuffix` arm of `Printer::print_element`).","locations":[{"ref":"crates/ruff_formatter/src/printer/queue.rs:219-247","code":"  219 |     fn next(&mut self) -> Option<Self::Item> {\n  220 |         if self.depth == 0 {\n  221 |             None\n  222 |         } else {\n  223 |             let mut top = self.queue.pop();\n  224 | \n  225 |             while let Some(FormatElement::Interned(interned)) = top {\n  226 |                 self.queue.extend_back(interned);\n  227 |                 top = self.queue.pop();\n  228 |             }\n  229 | \n  230 |             match top.expect(\"Missing end signal.\") {\n  231 |                 element @ FormatElement::Tag(tag) if tag.kind() == self.kind => {\n  232 |                     if tag.is_start() {\n  233 |                         self.depth += 1;\n  234 |                     } else {\n  235 |                         self.depth -= 1;\n  236 | \n  237 |                         if self.depth == 0 {\n  238 |                             return None;\n  239 |                         }\n  240 |                     }\n  241 | \n  242 |                     Some(element)\n  243 |                 }\n  244 |                 element => Some(element),\n  245 |             }\n  246 |         }\n  247 |     }","lines":29,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_formatter/src/printer/queue.rs#L219-L247"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"`Cache::save` computes `now - *file.last_seen.get_mut()` on raw `u64` millisecond timestamps. `now` comes from the wall clock at `Cache::new` time, while `last_seen` was read from a cache file written by a previous run (possibly on another machine when the cache directory is shared, or before an NTP/DST/VM-snapshot clock correction). If the stored `last_seen` is greater than `now`, the subtraction underflows: it panics with `attempt to subtract with overflow` in debug builds and silently wraps to a huge value in release builds (which then evicts an entry that should have been kept).","fix":"Use a saturating subtraction. Before:\n\n```rust\n(now - *file.last_seen.get_mut()) <= MAX_LAST_SEEN.as_millis() as u64\n```\n\nAfter:\n\n```rust\nnow.saturating_sub(*file.last_seen.get_mut()) <= MAX_LAST_SEEN.as_millis() as u64\n```","locations":[{"ref":"crates/ruff/src/cache.rs:211-216","code":"  211 |         // Remove cached files that we haven't seen in a while.\n  212 |         let now = self.last_seen_cache;\n  213 |         self.package.files.retain(|_, file| {\n  214 |             // SAFETY: this will be truncated to the year ~2554.\n  215 |             (now - *file.last_seen.get_mut()) <= MAX_LAST_SEEN.as_millis() as u64\n  216 |         });","lines":6,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff/src/cache.rs#L211-L216"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`PrintQueue::pop` (and `PrintQueue::top_with_interned`) only skip **one** exhausted slice iterator before giving up, so if two adjacent slices on `element_slices` are exhausted at the same time the queue reports end-of-document while non-consumed content is still below it. This happens whenever `extend_back` is called at a moment when the current top slice is already exhausted, which the printer does routinely (`FormatElement::Interned(content) => queue.extend_back(content)`, `queue.extend_back(&[HARD_LINE_BREAK, CLOSE_PAREN])` in `EndBestFitParenthesize`, the per-element `queue.push` calls in `flush_line_suffixes`, etc.). The main print loop in `Printer::print_with_indent` breaks as soon as `queue.pop()` returns `None`, so the remainder of the document is silently dropped.\n\nI confirmed this end-to-end against the public API with a temporary test (since reverted):\n\n```rust\nlet inner = format_with(|f| write!(f, [token(\"i1\"), token(\"i2\")])).memoized();\nlet outer = format_with(|f| write!(f, [token(\"o1\"), inner, inner])).memoized();\nlet result = format(&format_args![outer, token(\"TAIL\")]);\n// expected \"o1i1i2i1i2TAIL\", actual \"o1i1i2i1i2\"\n```\n\n`FitsQueue::pop` / `FitsQueue::top_with_interned` have the same one-level limitation: they take a single slice from `rest_elements` via `next_back()`, and if that slice happens to be exhausted (`extend_back` ignores empty slices) they return `None`, which makes `FitsMeasurer::fits` return `Ok(true)` as if the end of the document had been reached — i.e. a group is measured as \"fits\" without measuring the trailing content. Additionally, a premature `None` from `pop` inside `QueueContentIterator::next` hits the `.expect(\"Missing end signal.\")`, turning the same defect into a hard panic instead of truncated output.","fix":"Make both queues drain *all* exhausted slices instead of just one. For `PrintQueue`:\n\n```rust\nfn pop(&mut self) -> Option<&'a FormatElement> {\n    while let Some(elements) = self.element_slices.last_mut() {\n        if let Some(element) = elements.next() {\n            return Some(element);\n        }\n        self.element_slices.pop();\n    }\n    None\n}\n\nfn top_with_interned(&self) -> Option<&'a FormatElement> {\n    self.element_slices\n        .iter()\n        .rev()\n        .find_map(|slice| slice.as_slice().first())\n}\n```\n\nand for `FitsQueue::pop`, loop over `rest_elements.next_back()` until a slice yields an element rather than trying exactly one:\n\n```rust\nfn pop(&mut self) -> Option<&'a FormatElement> {\n    if let Some(element) = self.queue.pop() {\n        return Some(element);\n    }\n    while let Some(next_slice) = self.rest_elements.next_back() {\n        self.queue.extend_back(next_slice.as_slice());\n        if let Some(element) = self.queue.pop() {\n            return Some(element);\n        }\n    }\n    None\n}\n```\n\n`FitsQueue::top_with_interned` needs the same treatment (scan `rest_elements` backwards for the first non-empty slice). Add a regression test for the nested-`memoized` case shown above.","locations":[{"ref":"crates/ruff_formatter/src/printer/queue.rs:78-103","code":"   78 | impl<'a> Queue<'a> for PrintQueue<'a> {\n   79 |     fn pop(&mut self) -> Option<&'a FormatElement> {\n   80 |         let elements = self.element_slices.last_mut()?;\n   81 |         elements.next().or_else(\n   82 |             #[cold]\n   83 |             || {\n   84 |                 self.element_slices.pop();\n   85 |                 let elements = self.element_slices.last_mut()?;\n   86 |                 elements.next()\n   87 |             },\n   88 |         )\n   89 |     }\n   90 | \n   91 |     fn top_with_interned(&self) -> Option<&'a FormatElement> {\n   92 |         let mut slices = self.element_slices.iter().rev();\n   93 |         let slice = slices.next()?;\n   94 | \n   95 |         slice.as_slice().first().or_else(\n   96 |             #[cold]\n   97 |             || {\n   98 |                 slices\n   99 |                     .next()\n  100 |                     .and_then(|next_elements| next_elements.as_slice().first())\n  101 |             },\n  102 |         )\n  103 |     }","lines":26,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_formatter/src/printer/queue.rs#L78-L103"},{"ref":"crates/ruff_formatter/src/printer/queue.rs:148-174","code":"  148 | impl<'a> Queue<'a> for FitsQueue<'a, '_> {\n  149 |     fn pop(&mut self) -> Option<&'a FormatElement> {\n  150 |         self.queue.pop().or_else(\n  151 |             #[cold]\n  152 |             || {\n  153 |                 if let Some(next_slice) = self.rest_elements.next_back() {\n  154 |                     self.queue.extend_back(next_slice.as_slice());\n  155 |                     self.queue.pop()\n  156 |                 } else {\n  157 |                     None\n  158 |                 }\n  159 |             },\n  160 |         )\n  161 |     }\n  162 | \n  163 |     fn top_with_interned(&self) -> Option<&'a FormatElement> {\n  164 |         self.queue.top_with_interned().or_else(\n  165 |             #[cold]\n  166 |             || {\n  167 |                 if let Some(next_elements) = self.rest_elements.as_slice().last() {\n  168 |                     next_elements.as_slice().first()\n  169 |                 } else {\n  170 |                     None\n  171 |                 }\n  172 |             },\n  173 |         )\n  174 |     }","lines":27,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_formatter/src/printer/queue.rs#L148-L174"},{"ref":"crates/ruff_formatter/src/printer/mod.rs:69-77","code":"   69 |         loop {\n   70 |             if let Some(element) = queue.pop() {\n   71 |                 self.print_element(&mut stack, &mut queue, element)?;\n   72 |             } else {\n   73 |                 if !self.flush_line_suffixes(&mut queue, &mut stack, None) {\n   74 |                     break;\n   75 |                 }\n   76 |             }\n   77 |         }","lines":9,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_formatter/src/printer/mod.rs#L69-L77"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"In `Checker::visit_expr`, the special-cased argument traversal for `typing.cast`, `typing.NewType` and `typing.TypeAliasType` silently drops `**kwargs` keyword arguments. The keyword arm is written as\n\n```rust\n(_, ArgOrKeyword::Keyword(Keyword { arg, value, .. })) => {\n    if let Some(id) = arg {\n        if id == \"typ\" {\n            self.visit_cast_type_argument(value);\n        } else {\n            self.visit_non_type_definition(value);\n        }\n    }\n}\n```\n\nwith no `else` branch, so when `arg` is `None` (i.e. a `**kwargs` double-star unpacking) the `value` expression is never visited at all. The `typing::Callable::TypeVar` arm handles the same case correctly (`else { self.visit_non_type_definition(value); }`), which shows the omission is accidental. Because the expression is never visited, no load reference is recorded for the name, so `F841` fires falsely (with an unsafe fix that deletes live code) and `F821` misses genuinely undefined names.","fix":"Add the missing `else` branch to all three arms so unpacked keyword values are still visited, mirroring the `TypeVar` arm:\n\n```rust\n(_, ArgOrKeyword::Keyword(Keyword { arg, value, .. })) => {\n    if let Some(id) = arg {\n        if id == \"typ\" {\n            self.visit_cast_type_argument(value);\n        } else {\n            self.visit_non_type_definition(value);\n        }\n    } else {\n        // Ex) `cast(int, **kwargs)`\n        self.visit_non_type_definition(value);\n    }\n}\n```\n\nApply the same change in the `typing::Callable::NewType` arm (the `\"tp\"` check) and the `typing::Callable::TypeAliasType` arm (the `\"value\" | \"type_params\"` check).","locations":[{"ref":"crates/ruff_linter/src/checkers/ast/mod.rs:1936-1952","code":" 1936 |                     Some(typing::Callable::Cast) => {\n 1937 |                         for (i, arg) in arguments.iter_source_order().enumerate() {\n 1938 |                             match (i, arg) {\n 1939 |                                 (0, ArgOrKeyword::Arg(arg)) => self.visit_cast_type_argument(arg),\n 1940 |                                 (_, ArgOrKeyword::Arg(arg)) => self.visit_non_type_definition(arg),\n 1941 |                                 (_, ArgOrKeyword::Keyword(Keyword { arg, value, .. })) => {\n 1942 |                                     if let Some(id) = arg {\n 1943 |                                         if id == \"typ\" {\n 1944 |                                             self.visit_cast_type_argument(value);\n 1945 |                                         } else {\n 1946 |                                             self.visit_non_type_definition(value);\n 1947 |                                         }\n 1948 |                                     }\n 1949 |                                 }\n 1950 |                             }\n 1951 |                         }\n 1952 |                     }","lines":17,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/checkers/ast/mod.rs#L1936-L1952"},{"ref":"crates/ruff_linter/src/checkers/ast/mod.rs:1953-1969","code":" 1953 |                     Some(typing::Callable::NewType) => {\n 1954 |                         for (i, arg) in arguments.iter_source_order().enumerate() {\n 1955 |                             match (i, arg) {\n 1956 |                                 (1, ArgOrKeyword::Arg(arg)) => self.visit_type_definition(arg),\n 1957 |                                 (_, ArgOrKeyword::Arg(arg)) => self.visit_non_type_definition(arg),\n 1958 |                                 (_, ArgOrKeyword::Keyword(Keyword { arg, value, .. })) => {\n 1959 |                                     if let Some(id) = arg {\n 1960 |                                         if id == \"tp\" {\n 1961 |                                             self.visit_type_definition(value);\n 1962 |                                         } else {\n 1963 |                                             self.visit_non_type_definition(value);\n 1964 |                                         }\n 1965 |                                     }\n 1966 |                                 }\n 1967 |                             }\n 1968 |                         }\n 1969 |                     }","lines":17,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/checkers/ast/mod.rs#L1953-L1969"},{"ref":"crates/ruff_linter/src/checkers/ast/mod.rs:1997-2014","code":" 1997 |                     Some(typing::Callable::TypeAliasType) => {\n 1998 |                         // Ex) TypeAliasType(\"Json\", \"Union[dict[str, Json]]\", type_params=())\n 1999 |                         for (i, arg) in arguments.iter_source_order().enumerate() {\n 2000 |                             match (i, arg) {\n 2001 |                                 (1, ArgOrKeyword::Arg(arg)) => self.visit_type_definition(arg),\n 2002 |                                 (_, ArgOrKeyword::Arg(arg)) => self.visit_non_type_definition(arg),\n 2003 |                                 (_, ArgOrKeyword::Keyword(Keyword { arg, value, .. })) => {\n 2004 |                                     if let Some(id) = arg {\n 2005 |                                         if matches!(&**id, \"value\" | \"type_params\") {\n 2006 |                                             self.visit_type_definition(value);\n 2007 |                                         } else {\n 2008 |                                             self.visit_non_type_definition(value);\n 2009 |                                         }\n 2010 |                                     }\n 2011 |                                 }\n 2012 |                             }\n 2013 |                         }\n 2014 |                     }","lines":18,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c824 {"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In `check_name` (AIR301), the replacement edit is built from `import_target` (only the *first* dotted segment of the replacement name) instead of the full replacement name. `generate_import_edit` uses its `name` argument both for the `ImportRequest` symbol *and* for `Edit::range_replacement`, so passing the truncated `import_target` silently drops everything after the first dot.\n\nTwo replacements currently carry dotted names:\n- `Replacement::SourceModuleMoved { module: \"airflow.configuration\", name: format!(\"conf.{rest}\") }`\n- `Replacement::Rename { module: \"...avp.entities\", name: \"AvpEntities.ASSET\" }`\n\nVerified with the shipped binary:\n```\n$ ruff check --isolated --select AIR301 --diff t4.py\n-from airflow.configuration import get\n+from airflow.configuration import get, conf\n \n-value = get(\"core\", \"dags_folder\")\n+value = conf(\"core\", \"dags_folder\")\n```\nThe help text even says \"Use `conf.get` from `airflow.configuration` instead.\" but the applied edit yields `conf(...)`. The same happens for `AvpEntities.DATASET` → `AvpEntities` (see `ruff_linter__rules__airflow__tests__AIR301_AIR301_provider_names_fix.py.snap`). Because `generate_import_edit` returns `Fix::safe_edits`, plain `ruff check --fix` rewrites working code into a `TypeError` at runtime.","fix":"Split the two roles of the `name` parameter in `generate_import_edit`: keep using the head segment for the `ImportRequest`, but use the full dotted name for the replacement text. For example change the signature to\n```rust\npub(crate) fn generate_import_edit(\n    expr: &Expr,\n    checker: &Checker,\n    module: &str,\n    name: &str,\n    ranged: TextRange,\n) -> Option<Fix> {\n    let import_target = name.split('.').next().unwrap_or(name);\n    let (import_edit, _) = checker\n        .importer()\n        .get_or_import_symbol(\n            &ImportRequest::import_from(module, import_target),\n            expr.start(),\n            checker.semantic(),\n        )\n        .ok()?;\n    let replacement_edit = Edit::range_replacement(name.to_string(), ranged.range());\n    Some(Fix::safe_edits(import_edit, [replacement_edit]))\n}\n```\nand at the call sites pass the full `name` (`generate_import_edit(expr, checker, module, name, range)`), deleting the now-redundant local `import_target` in `removal_in_3.rs` and `moved_in_3_1.rs`. Regenerate the AIR301 snapshots afterwards.","locations":[{"ref":"crates/ruff_linter/src/rules/airflow/rules/removal_in_3.rs:1092-1105","code":" 1092 |     let import_target = name.split('.').next().unwrap_or(name);\n 1093 |     let mut diagnostic = checker.report_diagnostic(\n 1094 |         Airflow3Removal {\n 1095 |             deprecated: qualified_name.to_string(),\n 1096 |             replacement: replacement.clone(),\n 1097 |         },\n 1098 |         range,\n 1099 |     );\n 1100 | \n 1101 |     if let Some(fix) = generate_import_edit(expr, checker, module, import_target, range)\n 1102 |         .or_else(|| generate_remove_and_runtime_import_edit(expr, checker, module, name))\n 1103 |     {\n 1104 |         diagnostic.set_fix(fix);\n 1105 |     }","lines":14,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/airflow/rules/removal_in_3.rs#L1092-L1105"},{"ref":"crates/ruff_linter/src/rules/airflow/helpers.rs:218-235","code":"  218 | pub(crate) fn generate_import_edit(\n  219 |     expr: &Expr,\n  220 |     checker: &Checker,\n  221 |     module: &str,\n  222 |     name: &str,\n  223 |     ranged: TextRange,\n  224 | ) -> Option<Fix> {\n  225 |     let (import_edit, _) = checker\n  226 |         .importer()\n  227 |         .get_or_import_symbol(\n  228 |             &ImportRequest::import_from(module, name),\n  229 |             expr.start(),\n  230 |             checker.semantic(),\n  231 |         )\n  232 |         .ok()?;\n  233 |     let replacement_edit = Edit::range_replacement(name.to_string(), ranged.range());\n  234 |     Some(Fix::safe_edits(import_edit, [replacement_edit]))\n  235 | }","lines":18,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/airflow/helpers.rs#L218-L235"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"In `fastapi_non_annotated_dependency` (FAST002), the `seen_default` tracker only iterates `function_def.parameters.args` and `function_def.parameters.kwonlyargs`, completely ignoring `function_def.parameters.posonlyargs`. A positional-only parameter that has a default therefore never sets `seen_default`, so `create_diagnostic` believes it is safe to emit a fix that drops the parameter's default value. The result is a fix that produces invalid Python.\n\nVerified with the debug binary on:\n```python\nfrom fastapi import FastAPI, Path\n\napp = FastAPI()\n\n\n@app.get(\"/things/{thing_id}\")\nasync def f(a: int = 1, /, thing_id: str = Path(...)):\n    return thing_id\n```\n`ruff check --select FAST002 --unsafe-fixes --diff` produces:\n```\nerror: Fix introduced a syntax error in `t.py` with rule codes FAST002: Parameter without a default cannot follow a parameter with a default\nasync def f(a: int = 1, /, thing_id: Annotated[str, Path()]):\n```\nBecause the linter's safety net rejects the transformed source, *all* fixes for that file are reverted and the user is told to file a bug report.","fix":"Seed `seen_default` from the positional-only parameters before the main loop, e.g. replace\n```rust\nlet mut seen_default = false;\n\nfor parameter in function_def\n    .parameters\n    .args\n    .iter()\n    .chain(&function_def.parameters.kwonlyargs)\n```\nwith\n```rust\nlet mut seen_default = function_def\n    .parameters\n    .posonlyargs\n    .iter()\n    .any(|parameter| parameter.default.is_some());\n\nfor parameter in function_def\n    .parameters\n    .args\n    .iter()\n    .chain(&function_def.parameters.kwonlyargs)\n```\nand add a fixture covering `def f(a: int = 1, /, thing_id: str = Path(...))`.","locations":[{"ref":"crates/ruff_linter/src/rules/fastapi/rules/fastapi_non_annotated_dependency.rs:119-151","code":"  119 |     let mut seen_default = false;\n  120 | \n  121 |     for parameter in function_def\n  122 |         .parameters\n  123 |         .args\n  124 |         .iter()\n  125 |         .chain(&function_def.parameters.kwonlyargs)\n  126 |     {\n  127 |         let (Some(annotation), Some(default)) = (parameter.annotation(), parameter.default())\n  128 |         else {\n  129 |             seen_default |= parameter.default.is_some();\n  130 |             continue;\n  131 |         };\n  132 | \n  133 |         if let Some(dependency) = is_fastapi_dependency(checker, default) {\n  134 |             let dependency_call = DependencyCall::from_expression(default);\n  135 |             let dependency_parameter = DependencyParameter {\n  136 |                 annotation,\n  137 |                 default,\n  138 |                 kind: dependency,\n  139 |                 name: parameter.name(),\n  140 |                 range: parameter.range,\n  141 |             };\n  142 |             seen_default = create_diagnostic(\n  143 |                 checker,\n  144 |                 &dependency_parameter,\n  145 |                 dependency_call,\n  146 |                 seen_default,\n  147 |             );\n  148 |         } else {\n  149 |             seen_default |= parameter.default.is_some();\n  150 |         }\n  151 |     }","lines":33,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/fastapi/rules/fastapi_non_annotated_dependency.rs#L119-L151"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `check`, the error message built for a failed `lint_path` prints the top-level error twice. `anyhow::Error::chain()` yields the error itself as its first element (this is why `Error::root_cause` is implemented as `self.chain().last().unwrap()`), so seeding `error` with `e.to_string()` and then appending every element of `e.chain()` duplicates the top-level message. For example `ruff check --fix` on a read-only file produces `Failed to lint foo.py: Permission denied (os error 13)\\n  Cause: Permission denied (os error 13)`, and with `E902` enabled that duplicated text becomes the body of the emitted `IOError` diagnostic.","fix":"Skip the first element of the chain. Before:\n\n```rust\nlet mut error = e.to_string();\nfor cause in e.chain() {\n    write!(&mut error, \"\\n  Cause: {cause}\").unwrap();\n}\n```\n\nAfter:\n\n```rust\nlet mut error = e.to_string();\nfor cause in e.chain().skip(1) {\n    write!(&mut error, \"\\n  Cause: {cause}\").unwrap();\n}\n```","locations":[{"ref":"crates/ruff/src/commands/check.rs:118-126","code":"  118 |                 .map_err(|e| {\n  119 |                     (Some(path.to_path_buf()), {\n  120 |                         let mut error = e.to_string();\n  121 |                         for cause in e.chain() {\n  122 |                             write!(&mut error, \"\\n  Cause: {cause}\").unwrap();\n  123 |                         }\n  124 |                         error\n  125 |                     })\n  126 |                 })","lines":9,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff/src/commands/check.rs#L118-L126"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `generate_all::main`, the shared `Mode` is forwarded to `generate_docs` as `dry_run: args.mode.is_dry_run()`. `is_dry_run()` is only `true` for `Mode::DryRun`, so running `cargo dev generate-all --mode check` passes `dry_run: false` to `generate_docs`, which then takes the `else` branch at `crates/ruff_dev/src/generate_docs.rs:149-153` and calls `fs::create_dir_all(\"docs/rules\")` plus `fs::write(filename, output)`. A \"check\" run therefore silently rewrites every rule documentation file instead of reporting that they are out of date, unlike every other generator in the list which honours `Mode::Check`.","fix":"Teach `generate_docs::Args` to take the shared `Mode` (as `generate_json_schema`, `generate_ty_options`, etc. already do) and pass it through:\n```rust\n// before\ngenerate_docs::main(&generate_docs::Args {\n    dry_run: args.mode.is_dry_run(),\n})?;\n// after\ngenerate_docs::main(&generate_docs::Args { mode: args.mode })?;\n```\nwith `generate_docs::main` bailing out with a diff for `Mode::Check` instead of writing.","locations":[{"ref":"crates/ruff_dev/src/generate_all.rs:41-55","code":"   41 | pub(crate) fn main(args: &Args) -> Result<()> {\n   42 |     generate_json_schema::main(&generate_json_schema::Args { mode: args.mode })?;\n   43 |     generate_ty_schema::main(&generate_ty_schema::Args { mode: args.mode })?;\n   44 |     generate_cli_help::main(&generate_cli_help::Args { mode: args.mode })?;\n   45 |     generate_docs::main(&generate_docs::Args {\n   46 |         dry_run: args.mode.is_dry_run(),\n   47 |     })?;\n   48 |     generate_ty_options::main(&generate_ty_options::Args { mode: args.mode })?;\n   49 |     generate_ty_rules::main(&generate_ty_rules::Args { mode: args.mode })?;\n   50 |     generate_ty_cli_reference::main(&generate_ty_cli_reference::Args { mode: args.mode })?;\n   51 |     generate_ty_env_vars_reference::main(&generate_ty_env_vars_reference::Args {\n   52 |         mode: args.mode,\n   53 |     })?;\n   54 |     Ok(())\n   55 | }","lines":15,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_dev/src/generate_all.rs#L41-L55"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`Collector::visit_stmt` only honours `--no-type-checking-imports` for the `if` test of a `Stmt::If`. The `elif_else_clauses` are handed to the default `visit_elif_else_clause` walker unconditionally, so imports inside `elif TYPE_CHECKING:` blocks are still collected even when `type_checking_imports` is `false`. Given `is_type_checking_condition` is applied to `test` but not to `clause.test`, `ruff analyze graph --no-type-checking-imports` reports different dependency sets for two semantically identical files:\n\n```python\nif sys.version_info >= (3, 11):\n    pass\nelif TYPE_CHECKING:\n    import pandas  # still collected\n```\n\nversus\n\n```python\nif TYPE_CHECKING:\n    import pandas  # correctly skipped\n```","fix":"Apply the same `is_type_checking_condition` filter to each `ElifElseClause` instead of delegating to the default walker:\n\n```rust\nfor clause in elif_else_clauses {\n    if let Some(test) = &clause.test\n        && !self.type_checking_imports\n        && is_type_checking_condition(test)\n    {\n        continue;\n    }\n    self.visit_elif_else_clause(clause);\n}\n```","locations":[{"ref":"crates/ruff_graph/src/collector.rs:103-118","code":"  103 |             Stmt::If(ast::StmtIf {\n  104 |                 test,\n  105 |                 body,\n  106 |                 elif_else_clauses,\n  107 |                 range: _,\n  108 |                 node_index: _,\n  109 |             }) => {\n  110 |                 // Skip TYPE_CHECKING blocks if not requested\n  111 |                 if self.type_checking_imports || !is_type_checking_condition(test) {\n  112 |                     self.visit_body(body);\n  113 |                 }\n  114 | \n  115 |                 for clause in elif_else_clauses {\n  116 |                     self.visit_elif_else_clause(clause);\n  117 |                 }\n  118 |             }","lines":16,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_graph/src/collector.rs#L103-L118"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"For `Stmt::ClassDef`, `flake8_pytest_style::rules::marks` is gated on `Rule::PytestIncorrectMarkParenthesesStyle` (PT023) alone, but `marks` implements both PT023 and `Rule::PytestUseFixturesWithoutParameters` (PT026). The `Stmt::FunctionDef` call site correctly gates on `checker.any_rule_enabled(&[Rule::PytestIncorrectMarkParenthesesStyle, Rule::PytestUseFixturesWithoutParameters])`. Consequently PT026 is never reported for class decorators unless PT023 also happens to be enabled. Verified with a debug build: with `--select PT026`, a class decorated with `@pytest.mark.usefixtures()` is not flagged, while an identically decorated function is; with `--select PT023,PT026` the class is flagged.","fix":"Change the gate to include PT026. Before:\n\n```rust\nif checker.is_rule_enabled(Rule::PytestIncorrectMarkParenthesesStyle) {\n    flake8_pytest_style::rules::marks(checker, decorator_list);\n}\n```\n\nAfter:\n\n```rust\nif checker.any_rule_enabled(&[\n    Rule::PytestIncorrectMarkParenthesesStyle,\n    Rule::PytestUseFixturesWithoutParameters,\n]) {\n    flake8_pytest_style::rules::marks(checker, decorator_list);\n}\n```","locations":[{"ref":"crates/ruff_linter/src/checkers/ast/analyze/statement.rs:496-498","code":"  496 |             if checker.is_rule_enabled(Rule::PytestIncorrectMarkParenthesesStyle) {\n  497 |                 flake8_pytest_style::rules::marks(checker, decorator_list);\n  498 |             }","lines":3,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/checkers/ast/analyze/statement.rs#L496-L498"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`Rule::RelativeImports` (`TID252`) is invoked from inside the `for alias in names` loop over the imported members of a `Stmt::ImportFrom`, but `flake8_tidy_imports::rules::banned_relative_import` reports the diagnostic against `stmt.range()` (the whole `from ... import ...` statement), not against the alias. As a result one diagnostic is emitted per imported name. Verified against a debug build: `from .. import a, b, c` produces three identical `TID252` diagnostics at `t1.py:1:1` (`--statistics` reports `3 TID252`), and every other statement-scoped `ImportFrom` rule in this function (e.g. `Rule::BannedImportFrom`, `Rule::ImportSelf`) is correctly placed outside the loop.","fix":"Move the `Rule::RelativeImports` block out of the `for alias in names` loop, next to the other statement-level checks such as `Rule::BannedImportFrom`. Before:\n\n```rust\nfor alias in names {\n    ...\n    if checker.is_rule_enabled(Rule::RelativeImports) {\n        flake8_tidy_imports::rules::banned_relative_import(\n            checker, stmt, level, module,\n            checker.module.qualified_name(),\n            checker.settings().flake8_tidy_imports.ban_relative_imports,\n        );\n    }\n    ...\n}\n```\n\nAfter: delete that block from the loop body and place it after the loop (alongside `if checker.is_rule_enabled(Rule::ImportSelf) { ... }`).","locations":[{"ref":"crates/ruff_linter/src/checkers/ast/analyze/statement.rs:832-841","code":"  832 |                 if checker.is_rule_enabled(Rule::RelativeImports) {\n  833 |                     flake8_tidy_imports::rules::banned_relative_import(\n  834 |                         checker,\n  835 |                         stmt,\n  836 |                         level,\n  837 |                         module,\n  838 |                         checker.module.qualified_name(),\n  839 |                         checker.settings().flake8_tidy_imports.ban_relative_imports,\n  840 |                     );\n  841 |                 }","lines":10,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/checkers/ast/analyze/statement.rs#L832-L841"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `check_physical_lines`, the inner `while doc_lines_iter.next_if(...)` loop calls `doc_line_too_long(&line, ...)` once for *every* doc-line start that falls inside the current physical line, rather than once per physical line. Two standalone string statements on the same physical line (e.g. `\"a\"; \"b\"`) each contribute a start offset via `doc_lines_from_ast`, so `W505` is reported twice with an identical range.\n\nConfirmed repro:\n```\n$ ruff check --isolated --select W505 --config 'lint.pycodestyle.max-doc-length=20' t.py\nW505 Doc line too long (74 > 20)  --> t.py:1:21\nW505 Doc line too long (74 > 20)  --> t.py:1:21\nFound 2 errors.\n```\nThe loop must still drain all matching offsets to keep the iterator in sync, but the diagnostic should only fire once.","fix":"Drain the doc-line offsets first, then emit at most one diagnostic:\n```rust\nlet mut is_doc_line = false;\nwhile doc_lines_iter\n    .next_if(|doc_line_start| line.range().contains_inclusive(**doc_line_start))\n    .is_some()\n{\n    is_doc_line = true;\n}\nif is_doc_line && enforce_doc_line_too_long {\n    doc_line_too_long(&line, comment_ranges, settings, context);\n}\n```","locations":[{"ref":"crates/ruff_linter/src/checkers/physical_lines.rs:43-51","code":"   43 |     for line in locator.contents().universal_newlines() {\n   44 |         while doc_lines_iter\n   45 |             .next_if(|doc_line_start| line.range().contains_inclusive(**doc_line_start))\n   46 |             .is_some()\n   47 |         {\n   48 |             if enforce_doc_line_too_long {\n   49 |                 doc_line_too_long(&line, comment_ranges, settings, context);\n   50 |             }\n   51 |         }","lines":9,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/checkers/physical_lines.rs#L43-L51"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`add_suppression` unconditionally rewrites every linted file to disk, even when `add_suppression_inner` produced zero edits. `add_suppression_inner` builds `output` by copying `contents` and splicing in edits; when `edits` is empty the returned `output` is byte-for-byte identical to the original file, yet `add_suppression` still calls `fs::write(path, output)`.\n\n```rust\nlet (count, output) = add_suppression_inner(/* ... */);\n\nfs::write(path, output)?;\nOk(count)\n```\n\n`crates/ruff/src/commands/add_noqa.rs` calls this (via `add_suppressions_to_path`) for *every* Python file in the project in a `par_iter`, so `ruff check --add-noqa` / `--add-ignore` truncates-and-rewrites the entire source tree. This bumps every file's mtime (invalidating build/test caches and triggering file watchers) and, because `fs::write` truncates before writing, a crash or interrupt during the sweep can leave untouched files empty.","fix":"Skip the write when nothing changed:\n\n```rust\nlet (count, output) = add_suppression_inner(/* ... */);\n\nif count > 0 {\n    fs::write(path, output)?;\n}\nOk(count)\n```\n\nIdeally also write via a temporary file plus `rename` so the update is atomic.","locations":[{"ref":"crates/ruff_linter/src/noqa.rs:796-813","code":"  796 | ) -> Result<usize> {\n  797 |     let (count, output) = add_suppression_inner(\n  798 |         path,\n  799 |         diagnostics,\n  800 |         locator,\n  801 |         comment_ranges,\n  802 |         external,\n  803 |         noqa_line_for,\n  804 |         line_ending,\n  805 |         reason,\n  806 |         suppressions,\n  807 |         suppression_kind,\n  808 |         preview,\n  809 |     );\n  810 | \n  811 |     fs::write(path, output)?;\n  812 |     Ok(count)\n  813 | }","lines":18,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/noqa.rs#L796-L813"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`is_airflow_auth_manager` matches the builtin path as `[\"airflow\", \"auth\", \"manager\", rest @ ..]` — singular `manager`. The real Airflow module (and every other pattern in this crate, e.g. `[\"airflow\", \"auth\", \"managers\", \"base_auth_manager\", \"BaseAuthManager\"]` in `check_name`, and the `[\"airflow\", \"auth\", \"managers\", \"fab\", ...]` arms in `moved_to_provider_in_3.rs`) is `airflow.auth.managers.*`. As a result the builtin branch is dead: neither the `appbuilder` constructor-argument diagnostic in `check_call_arguments` nor the `is_authorized_dataset` → `is_authorized_asset` rename in `check_method` ever fires for first-party Airflow auth managers; only the `airflow.providers.*` branch works.\n\nVerified: for a file containing both `SimpleAuthManager(appbuilder)` / `.is_authorized_dataset()` (from `airflow.auth.managers.simple.simple_auth_manager`) and `AwsAuthManager(appbuilder)` / `.is_authorized_dataset()`, `ruff check --select AIR301` reports only the two `AwsAuthManager` diagnostics. The doc comment above the function (\"the `auth.manager` builtin\") encodes the same typo, so there is no test fixture covering it.","fix":"Change the segment literal to the plural module name and update the doc comment:\n```rust\n/// Check whether the symbol is coming from the `auth.managers` builtin or provider `auth_manager`\n/// module which ends with `AuthManager`.\nfn is_airflow_auth_manager(segments: &[&str]) -> bool {\n    match segments {\n        [\"airflow\", \"auth\", \"managers\", rest @ ..] => {\n```\nAdd a fixture case under `crates/ruff_linter/resources/test/fixtures/airflow/AIR301_class_attribute.py` (and the args fixture) that uses `airflow.auth.managers.simple.simple_auth_manager.SimpleAuthManager`, then regenerate the snapshots.","locations":[{"ref":"crates/ruff_linter/src/rules/airflow/rules/removal_in_3.rs:1202-1212","code":" 1202 | /// Check whether the symbol is coming from the `auth.manager` builtin or provider `auth_manager` module which ends\n 1203 | /// with `AuthManager`.\n 1204 | fn is_airflow_auth_manager(segments: &[&str]) -> bool {\n 1205 |     match segments {\n 1206 |         [\"airflow\", \"auth\", \"manager\", rest @ ..] => {\n 1207 |             if let Some(last_element) = rest.last() {\n 1208 |                 last_element.ends_with(\"AuthManager\")\n 1209 |             } else {\n 1210 |                 false\n 1211 |             }\n 1212 |         }","lines":11,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/airflow/rules/removal_in_3.rs#L1202-L1212"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`is_operator_task_method` resolves the enclosing class via `semantic.first_non_type_parent_scope(semantic.current_scope())`, but `current_scope()` is the scope of the *expression being visited*, not the scope of `function_def`. When the `Variable.get()` call sits inside a comprehension or lambda within `execute()`, `current_scope()` is the `Generator`/`Lambda` scope, its first non-type parent is the `execute` function scope (not the class), the `ScopeKind::Class` match fails, and AIR003 fires even though the call is inside a legitimate task-execution method.\n\nVerified:\n```python\nclass MyOp(BaseOperator):\n    def execute(self, context):\n        vals = [Variable.get(f\"k{i}\") for i in range(3)]  # AIR003 (false positive)\n        plain = Variable.get(\"plain\")                      # correctly not reported\n```\n`ruff check --isolated --preview --select AIR003` reports only the comprehension line.","fix":"Walk up from the scope that actually owns `function_def` rather than from `current_scope()`. The simplest robust approach is to look up the binding for the function and use its scope, or to walk the enclosing scopes until a `ScopeKind::Function` whose `StmtFunctionDef` is `function_def` is found and then take *its* first non-type parent, e.g.:\n```rust\nlet Some(function_scope) = semantic\n    .current_scopes()\n    .find(|scope| matches!(scope.kind, ScopeKind::Function(def) if std::ptr::eq(def, function_def)))\nelse {\n    return false;\n};\nlet Some(parent_scope) = semantic.first_non_type_parent_scope(function_scope) else {\n    return false;\n};\n```\nAdd a fixture case with a comprehension inside `execute()` to `AIR003.py`.","locations":[{"ref":"crates/ruff_linter/src/rules/airflow/rules/variable_get_outside_task.rs:156-178","code":"  156 | fn is_operator_task_method(function_def: &StmtFunctionDef, semantic: &SemanticModel) -> bool {\n  157 |     if !matches!(\n  158 |         function_def.name.as_str(),\n  159 |         \"execute\" | \"pre_execute\" | \"post_execute\"\n  160 |     ) {\n  161 |         return false;\n  162 |     }\n  163 | \n  164 |     let Some(parent_scope) = semantic.first_non_type_parent_scope(semantic.current_scope()) else {\n  165 |         return false;\n  166 |     };\n  167 | \n  168 |     let ScopeKind::Class(class_def) = parent_scope.kind else {\n  169 |         return false;\n  170 |     };\n  171 | \n  172 |     any_qualified_base_class(class_def, semantic, |qn| {\n  173 |         matches!(\n  174 |             qn.segments(),\n  175 |             [\"airflow\", \"models\" | \"sdk\", .., \"BaseOperator\"]\n  176 |         )\n  177 |     })\n  178 | }","lines":23,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/airflow/rules/variable_get_outside_task.rs#L156-L178"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `fastapi_non_annotated_dependency` (FAST002), keyword-only parameters are chained into the same `seen_default` accumulator as the regular positional parameters. Keyword-only parameters have no ordering constraint with respect to defaults, so removing a default from a kw-only parameter can never cause the `Parameter without a default cannot follow a parameter with a default` error that `seen_default` exists to prevent. As a result, an available and correct fix is suppressed and a misleading `info` note is attached.\n\nVerified with the debug binary on:\n```python\n@app.get(\"/things/{thing_id}\")\nasync def f(q: str = Query(\"x\"), *, thing_id: str = Path(...)):\n    return thing_id\n```\nThe `thing_id` diagnostic reports `info: Automatic fix is unavailable because a required parameter would follow an optional parameter. Consider reordering arguments to enable the fix.` even though `thing_id: Annotated[str, Path()]` after `*` is perfectly valid.","fix":"Handle the two parameter groups separately: run the current `seen_default` logic over `function_def.parameters.posonlyargs` + `function_def.parameters.args`, then iterate `function_def.parameters.kwonlyargs` with `seen_default` reset to `false` (and never updated), since dropping a default is always legal after `*`. Concretely, pass a flag such as `keyword_only: bool` into `create_diagnostic` and skip the two `if seen_default { ... return Ok(None) }` bail-outs when it is set.","locations":[{"ref":"crates/ruff_linter/src/rules/fastapi/rules/fastapi_non_annotated_dependency.rs:121-151","code":"  121 |     for parameter in function_def\n  122 |         .parameters\n  123 |         .args\n  124 |         .iter()\n  125 |         .chain(&function_def.parameters.kwonlyargs)\n  126 |     {\n  127 |         let (Some(annotation), Some(default)) = (parameter.annotation(), parameter.default())\n  128 |         else {\n  129 |             seen_default |= parameter.default.is_some();\n  130 |             continue;\n  131 |         };\n  132 | \n  133 |         if let Some(dependency) = is_fastapi_dependency(checker, default) {\n  134 |             let dependency_call = DependencyCall::from_expression(default);\n  135 |             let dependency_parameter = DependencyParameter {\n  136 |                 annotation,\n  137 |                 default,\n  138 |                 kind: dependency,\n  139 |                 name: parameter.name(),\n  140 |                 range: parameter.range,\n  141 |             };\n  142 |             seen_default = create_diagnostic(\n  143 |                 checker,\n  144 |                 &dependency_parameter,\n  145 |                 dependency_call,\n  146 |                 seen_default,\n  147 |             );\n  148 |         } else {\n  149 |             seen_default |= parameter.default.is_some();\n  150 |         }\n  151 |     }","lines":31,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/fastapi/rules/fastapi_non_annotated_dependency.rs#L121-L151"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `fastapi_unused_path_parameter` (FAST003) the diagnostic range is computed by assuming the route-path string literal is exactly one byte of quote on each side and that its decoded value has the same length as its source text:\n```rust\ndiagnostic_range\n    .add_start(TextSize::from(range.start as u32 + 1))\n    .sub_end(TextSize::from((path.len() - range.end + 1) as u32))\n```\nHere `range` is a byte range into the *decoded* value (`path.to_str()`) while `diagnostic_range` is the *source* range of the expression, including the prefix, the quotes (which may be 3 characters), any escape sequences, and any implicitly concatenated parts. Whenever these differ, the caret is placed over the wrong text.\n\nVerified with the debug binary:\n```python\n@app.get(\"\"\"/things/{thing_id}\"\"\")\nasync def f(query: str): ...\n```\nhighlights `s/{thing_id}\"` instead of `{thing_id}`, and\n```python\n@app.get(\"/things/\\N{BULLET}{thing_id}\")\nasync def g(query: str): ...\n```\nis also shifted. Raw-string prefixes (`r\"...\"`) and implicit concatenation are affected the same way.","fix":"Stop mapping decoded offsets onto the whole-expression range. Either (a) restrict `PathParamIterator` to the raw source contents of a single, non-implicitly-concatenated `StringLiteral` part obtained via `ruff_python_ast::str::raw_contents(checker.locator().slice(part))` and add `part.range().start() + raw_contents_offset` to the match range, or (b) bail out (using `path_arg.range()` as the diagnostic range) when `path_arg.as_string_literal_expr()` is implicitly concatenated or when `part.flags()` indicate a non-single-quote/escaped literal. Add fixtures for `r\"/{x}\"`, `\"\"\"/{x}\"\"\"`, and `\"/a\" \"/{x}\"`.","locations":[{"ref":"crates/ruff_linter/src/rules/fastapi/rules/fastapi_unused_path_parameter.rs:132-196","code":"  132 |     let diagnostic_range = path_arg.range();\n  133 | \n  134 |     // We can't really handle anything other than string literals.\n  135 |     let path = match path_arg.as_string_literal_expr() {\n  136 |         Some(path_arg) => &path_arg.value,\n  137 |         None => return,\n  138 |     };\n  139 | \n  140 |     // Extract the path parameters from the route path.\n  141 |     let path_params = PathParamIterator::new(path.to_str());\n  142 | \n  143 |     // Extract the arguments from the function signature\n  144 |     let mut named_args = vec![];\n  145 | \n  146 |     for parameter_with_default in non_posonly_non_variadic_parameters(function_def) {\n  147 |         let ParameterWithDefault { parameter, .. } = parameter_with_default;\n  148 | \n  149 |         if let Some(alias) = parameter_alias(parameter, checker.semantic()) {\n  150 |             named_args.push(alias);\n  151 |         } else {\n  152 |             named_args.push(parameter.name.as_str());\n  153 |         }\n  154 | \n  155 |         let Some(dependency) =\n  156 |             Dependency::from_parameter(parameter_with_default, checker.semantic())\n  157 |         else {\n  158 |             continue;\n  159 |         };\n  160 | \n  161 |         if let Some(parameter_names) = dependency.parameter_names() {\n  162 |             named_args.extend_from_slice(parameter_names);\n  163 |         } else {\n  164 |             // If we can't determine the dependency, we can't really do anything.\n  165 |             return;\n  166 |         }\n  167 |     }\n  168 | \n  169 |     // Check if any of the path parameters are not in the function signature.\n  170 |     for (path_param, range) in path_params {\n  171 |         // If the path parameter is already in the function or the dependency signature,\n  172 |         // we don't need to do anything.\n  173 |         if named_args.contains(&path_param) {\n  174 |             continue;\n  175 |         }\n  176 | \n  177 |         // Determine whether the path parameter is used as a
