 positional-only argument. In this case,\n  178 |         // the path parameter injection won't work, but we also can't fix it (yet), since we'd need\n  179 |         // to make the parameter non-positional-only.\n  180 |         let is_positional = function_def\n  181 |             .parameters\n  182 |             .posonlyargs\n  183 |             .iter()\n  184 |             .any(|param| param.name() == path_param);\n  185 | \n  186 |         let mut diagnostic = checker.report_diagnostic(\n  187 |             FastApiUnusedPathParameter {\n  188 |                 arg_name: path_param.to_string(),\n  189 |                 function_name: function_def.name.to_string(),\n  190 |                 is_positional,\n  191 |             },\n  192 |             #[expect(clippy::cast_possible_truncation)]\n  193 |             diagnostic_range\n  194 |                 .add_start(TextSize::from(range.start as u32 + 1))\n  195 |                 .sub_end(TextSize::from((path.len() - range.end + 1) as u32)),\n  196 |         );","lines":65,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/fastapi/rules/fastapi_unused_path_parameter.rs#L132-L196"},{"ref":"crates/ruff_linter/src/rules/fastapi/rules/fastapi_unused_path_parameter.rs:495-531","code":"  495 | /// An iterator to extract parameters from FastAPI route paths.\n  496 | ///\n  497 | /// The iterator yields tuples of the parameter name and the range of the parameter in the input,\n  498 | /// inclusive of curly braces.\n  499 | ///\n  500 | /// FastAPI only recognizes path parameters when there are no leading or trailing spaces around\n  501 | /// the parameter name. For example, `/{x}` is a valid parameter, but `/{ x }` is treated literally.\n  502 | #[derive(Debug)]\n  503 | struct PathParamIterator<'a> {\n  504 |     inner: CaptureMatches<'a, 'a>,\n  505 | }\n  506 | \n  507 | impl<'a> PathParamIterator<'a> {\n  508 |     fn new(input: &'a str) -> Self {\n  509 |         /// Matches the Starlette pattern for path parameters with optional converters from\n  510 |         /// <https://github.com/Kludex/starlette/blob/e18637c68e36d112b1983bc0c8b663681e6a4c50/starlette/routing.py#L121>\n  511 |         static FASTAPI_PATH_PARAM_REGEX: LazyLock<Regex> = LazyLock::new(|| {\n  512 |             Regex::new(r\"\\{([a-zA-Z_][a-zA-Z0-9_]*)(?::[a-zA-Z_][a-zA-Z0-9_]*)?\\}\").unwrap()\n  513 |         });\n  514 | \n  515 |         Self {\n  516 |             inner: FASTAPI_PATH_PARAM_REGEX.captures_iter(input),\n  517 |         }\n  518 |     }\n  519 | }\n  520 | \n  521 | impl<'a> Iterator for PathParamIterator<'a> {\n  522 |     type Item = (&'a str, Range<usize>);\n  523 | \n  524 |     fn next(&mut self) -> Option<Self::Item> {\n  525 |         self.inner\n  526 |             .next()\n  527 |             // Extract the first capture group (the path parameter), but return the range of the\n  528 |             // whole match (everything in braces and including the braces themselves).\n  529 |             .and_then(|capture| Some((capture.get(1)?.as_str(), capture.get(0)?.range())))\n  530 |     }\n  531 | }","lines":37,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/fastapi/rules/fastapi_unused_path_parameter.rs#L495-L531"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`parse_mask` in the S103 (`bad-file-permissions`) rule only resolves `stat` constants when the expression is an `Expr::Attribute`:\n```rust\nExpr::Attribute(_) => semantic\n    .resolve_qualified_name(expr)\n    .as_ref()\n    .and_then(py_stat)\n```\nAn imported constant such as `from stat import S_IWOTH` is an `Expr::Name`, so it falls through to the `_ => KnownBits::unknown()` arm and the permissive mask is silently not detected. `resolve_qualified_name` handles `Expr::Name` fine, so the `Expr::Attribute(_)` pattern is an unnecessary restriction on a security rule.\n\nVerified with the debug binary: `os.chmod(\"/etc/passwd\", stat.S_IWOTH)` is flagged, but `from stat import S_IWOTH; os.chmod(\"/etc/passwd\", S_IWOTH)` and `os.chmod(\"/etc/passwd\", S_IWOTH | S_IXGRP)` are not.","fix":"Before:\n```rust\n        Expr::Attribute(_) => semantic\n            .resolve_qualified_name(expr)\n```\nAfter:\n```rust\n        Expr::Attribute(_) | Expr::Name(_) => semantic\n            .resolve_qualified_name(expr)\n```\nand add `from stat import S_IWOTH` cases to `crates/ruff_linter/resources/test/fixtures/flake8_bandit/S103.py`.","locations":[{"ref":"crates/ruff_linter/src/rules/flake8_bandit/rules/bad_file_permissions.rs:207-222","code":"  207 | fn parse_mask(expr: &Expr, semantic: &SemanticModel) -> KnownBits {\n  208 |     match expr {\n  209 |         Expr::NumberLiteral(ast::ExprNumberLiteral {\n  210 |             value: ast::Number::Int(int),\n  211 |             ..\n  212 |         }) => int\n  213 |             .as_u64()\n  214 |             .map(KnownBits::exact)\n  215 |             .unwrap_or_else(KnownBits::invalid),\n  216 |         Expr::Attribute(_) => semantic\n  217 |             .resolve_qualified_name(expr)\n  218 |             .as_ref()\n  219 |             .and_then(py_stat)\n  220 |             .map(KnownBits::exact)\n  221 |             .unwrap_or_else(KnownBits::unknown),\n  222 |         Expr::BinOp(ast::ExprBinOp {","lines":16,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/flake8_bandit/rules/bad_file_permissions.rs#L207-L222"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`walk_stmt` in `jump_statement_in_finally` (B012) only descends into the *primary* body of compound statements. For `Stmt::If` it walks `body` but never `elif_else_clauses`; for `Stmt::Try` it walks `body` but never `handlers`, `orelse`, or `finalbody`; for `Stmt::While`/`Stmt::For` it walks `body` but never `orelse`. As a result, `break`/`continue`/`return` inside an `else:`/`elif:`/`except:` block nested in a `finally:` clause is silently missed.\n\nVerified against the built binary - all three of these produce no diagnostic:\n```python\ndef f():\n    try: pass\n    finally:\n        if x: pass\n        else: return 1        # not flagged\n\ndef g():\n    try: pass\n    finally:\n        try: pass\n        except Exception: return 2   # not flagged\n\ndef h():\n    try: pass\n    finally:\n        for i in []: pass\n        else: return 3        # not flagged\n```","fix":"Extend the recursion in `walk_stmt` to cover the remaining bodies. Note that a nested `try`'s own `finalbody` must *not* be walked here (the checker already invokes `jump_statement_in_finally` for it, which would double-report), and that a loop's `orelse` must keep the original `f` (a `break` there binds to an enclosing loop, not to that loop):\n```rust\nStmt::While(ast::StmtWhile { body, orelse, .. })\n| Stmt::For(ast::StmtFor { body, orelse, .. }) => {\n    walk_stmt(checker, body, Stmt::is_return_stmt);\n    walk_stmt(checker, orelse, f);\n}\nStmt::If(ast::StmtIf { body, elif_else_clauses, .. }) => {\n    walk_stmt(checker, body, f);\n    for clause in elif_else_clauses {\n        walk_stmt(checker, &clause.body, f);\n    }\n}\nStmt::Try(ast::StmtTry { body, handlers, orelse, .. }) => {\n    walk_stmt(checker, body, f);\n    for handler in handlers {\n        let ExceptHandler::ExceptHandler(ast::ExceptHandlerExceptHandler { body, .. }) = handler;\n        walk_stmt(checker, body, f);\n    }\n    walk_stmt(checker, orelse, f);\n}\nStmt::With(ast::StmtWith { body, .. }) => walk_stmt(checker, body, f),\n```","locations":[{"ref":"crates/ruff_linter/src/rules/flake8_bugbear/rules/jump_statement_in_finally.rs:74-89","code":"   74 |         match stmt {\n   75 |             Stmt::While(ast::StmtWhile { body, .. }) | Stmt::For(ast::StmtFor { body, .. }) => {\n   76 |                 walk_stmt(checker, body, Stmt::is_return_stmt);\n   77 |             }\n   78 |             Stmt::If(ast::StmtIf { body, .. })\n   79 |             | Stmt::Try(ast::StmtTry { body, .. })\n   80 |             | Stmt::With(ast::StmtWith { body, .. }) => {\n   81 |                 walk_stmt(checker, body, f);\n   82 |             }\n   83 |             Stmt::Match(ast::StmtMatch { cases, .. }) => {\n   84 |                 for case in cases {\n   85 |                     walk_stmt(checker, &case.body, f);\n   86 |                 }\n   87 |             }\n   88 |             _ => {}\n   89 |         }","lines":16,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/flake8_bugbear/rules/jump_statement_in_finally.rs#L74-L89"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`setattr_with_constant` (B010) rejects a starred *object* (`obj.is_starred_expr()`) but not a starred *value*. For `setattr(obj, \"foo\", *values)` it emits an `AlwaysFixableViolation` whose fix rewrites the call to `obj.foo = *values`, which is a `SyntaxError` in Python. Verified with `ruff check --select B010 --diff`:\n```\n-setattr(obj, \"foo\", *values)\n+obj.foo = *values\n```\nThe fix is marked *safe* (no comments, NFKC-clean name), so `ruff check --fix` will silently break the file.","fix":"Bail out when the assigned value is starred as well. Before:\n```rust\nif obj.is_starred_expr() {\n    return;\n}\n```\nAfter:\n```rust\nif obj.is_starred_expr() || value.is_starred_expr() {\n    return;\n}\n```","locations":[{"ref":"crates/ruff_linter/src/rules/flake8_bugbear/rules/setattr_with_constant.rs:89-101","code":"   89 | pub(crate) fn setattr_with_constant(checker: &Checker, expr: &Expr, func: &Expr, args: &[Expr]) {\n   90 |     let [obj, name, value] = args else {\n   91 |         return;\n   92 |     };\n   93 |     if obj.is_starred_expr() {\n   94 |         return;\n   95 |     }\n   96 |     let Expr::StringLiteral(ast::ExprStringLiteral { value: name, .. }) = name else {\n   97 |         return;\n   98 |     };\n   99 |     if !is_identifier(name.to_str()) {\n  100 |         return;\n  101 |     }","lines":13,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/flake8_bugbear/rules/setattr_with_constant.rs#L89-L101"},{"ref":"crates/ruff_linter/src/rules/flake8_bugbear/rules/setattr_with_constant.rs:130-142","code":"  130 |         if expr == child.as_ref() {\n  131 |             let mut diagnostic = checker.report_diagnostic(SetAttrWithConstant, expr.range());\n  132 |             let edit = Edit::range_replacement(\n  133 |                 assignment(obj, name.to_str(), value, checker.generator()),\n  134 |                 expr.range(),\n  135 |             );\n  136 |             let fix = if is_unsafe {\n  137 |                 Fix::unsafe_edit(edit)\n  138 |             } else {\n  139 |                 Fix::safe_edit(edit)\n  140 |             };\n  141 |             diagnostic.set_fix(fix);\n  142 |         }","lines":13,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/flake8_bugbear/rules/setattr_with_constant.rs#L130-L142"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`builtin_attribute_shadowing` (A003) documents that \"Methods decorated with `@typing.override` or `@typing_extensions.override` are also ignored\", but the code inspects `class_def.decorator_list` - the decorators of the *enclosing class* - rather than the decorators of the shadowing method itself. `@override` is a method decorator, so the documented exemption never fires. This regressed when the original separate `builtin_method_shadowing` function (which checked the function's own `decorator_list`, added in #6076) was merged into the scope-based `builtin_attribute_shadowing`. Verified: A003 is still reported for\n```python\nfrom typing import override\n\n\nclass Class:\n    @override\n    @staticmethod\n    def list() -> None: ...\n\n    @staticmethod\n    def repeat(value: int, times: int) -> list[int]: ...\n```\nAdditionally the guard uses `return` inside the `for (name, binding_id)` loop, which would abandon the whole class rather than skipping one binding.","fix":"Resolve the decorator list from the binding's own definition instead of the class. For `BindingKind::FunctionDefinition(_)` bindings, look up the defining `StmtFunctionDef` (e.g. via `binding.statement(checker.semantic())` / `binding.source`) and test `is_override(&function_def.decorator_list, checker.semantic())`, then `continue` (not `return`) when it matches. If the class-level check is genuinely intended, the doc paragraph must instead say that classes decorated with `@override` are ignored.","locations":[{"ref":"crates/ruff_linter/src/rules/flake8_builtins/rules/builtin_attribute_shadowing.rs:105-112","code":"  105 |             // Ignore explicit overrides.\n  106 |             if class_def.decorator_list.iter().any(|decorator| {\n  107 |                 checker\n  108 |                     .semantic()\n  109 |                     .match_typing_expr(&decorator.expression, \"override\")\n  110 |             }) {\n  111 |                 return;\n  112 |             }","lines":8,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/flake8_builtins/rules/builtin_attribute_shadowing.rs#L105-L112"},{"ref":"crates/ruff_linter/src/rules/flake8_builtins/rules/builtin_attribute_shadowing.rs:39-43","code":"   39 | /// Builtins can be marked as exceptions to this rule via the\n   40 | /// [`lint.flake8-builtins.ignorelist`] configuration option, or\n   41 | /// converted to the appropriate dunder method. Methods decorated with\n   42 | /// `@typing.override` or `@typing_extensions.override` are also\n   43 | /// ignored.","lines":5,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/flake8_builtins/rules/builtin_attribute_shadowing.rs#L39-L43"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`UnparsedAssertion::from_comment` strips everything after the first `#` in the comment body in order to support nested pragmas such as `# error: [code] # type: ignore`. This also truncates any assertion whose expected *message* contains a `#`, e.g. `# error: [invalid-syntax] \"expected '#'\"` becomes `error: [invalid-syntax] \"expected '`, which then fails to parse with the misleading `expected '\"' to be the final character in an assertion with an error message`. There is no way to write an mdtest assertion for a diagnostic message containing a `#`.","fix":"Only split on a `#` that is not inside the quoted message. For example, find the first `#` that occurs before the opening `\"` of the message (or scan the body tracking whether we are inside a `\"`-delimited message) instead of using an unconditional `comment.split_once('#')`.","locations":[{"ref":"crates/mdtest/src/assertion.rs:258-269","code":"  258 |     fn from_comment(comment: &'a str) -> Option<Self> {\n  259 |         let comment = comment.trim().strip_prefix('#')?.trim();\n  260 | \n  261 |         // Support other pragma comments coming after `error` or `revealed`, e.g.\n  262 |         // `# error: [code] # type: ignore` (nested pragma comments)\n  263 |         let comment = if let Some((before_nested, _)) = comment.split_once('#') {\n  264 |             before_nested\n  265 |         } else {\n  266 |             comment\n  267 |         };\n  268 | \n  269 |         let (keyword, body) = comment.split_once(':').unwrap_or((comment, \"\"));","lines":12,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/mdtest/src/assertion.rs#L258-L269"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`MarkdownTest::contracted_title` compares `title.len()` (bytes) against `MAX_TITLE_LENGTH` but then truncates with `chars().take(MAX_TITLE_LENGTH)` (characters). For a title with non-ASCII characters - e.g. 15 accented or CJK characters - `title.len()` exceeds 20 while `chars().take(20)` yields the whole title, so the ellipsis `…` is appended even though nothing was actually truncated. These contracted names are used both for the `MDTEST_TEST_FILTER='...'` hint printed on failure and for insta snapshot file names (`crates/mdtest/src/lib.rs:726`).","fix":"Before:\n\n```rust\nif title.len() <= Self::MAX_TITLE_LENGTH {\n    return (*title).to_string();\n}\n```\n\nAfter:\n\n```rust\nif title.chars().count() <= Self::MAX_TITLE_LENGTH {\n    return title.to_string();\n}\n```","locations":[{"ref":"crates/mdtest/src/parser.rs:93-106","code":"   93 |     fn contracted_title(title: &str) -> String {\n   94 |         if title.len() <= Self::MAX_TITLE_LENGTH {\n   95 |             return (*title).to_string();\n   96 |         }\n   97 | \n   98 |         format!(\n   99 |             \"{}{}\",\n  100 |             title\n  101 |                 .chars()\n  102 |                 .take(Self::MAX_TITLE_LENGTH)\n  103 |                 .collect::<String>(),\n  104 |             Self::ELLIPSIS\n  105 |         )\n  106 |     }","lines":14,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/mdtest/src/parser.rs#L93-L106"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`EmbeddedFile::append_code` unconditionally pushes a `'\\n'` separator before the appended block, even when `self.code` is still empty. When the *first* code block of a merged snippet is empty (```` ```py ```` immediately followed by ```` ``` ````), `Entry::Vacant` still records a `CodeBlock` with empty code, and the next block then produces `code == \"\\ny = 2\"` - i.e. the concatenated file gains a leading blank line that `EmbeddedFileSourceMap` does not know about (the empty block contributes `line_count == 0`). Every relative line number is then off by one, and `to_absolute_line_number` walks past the end of the map, so any real failure on that file is reported as the bogus message \"Found a trailing assertion comment (e.g., `# revealed:` or `# error:`) not followed by any statement.\" (see `crates/mdtest/src/lib.rs:99-116`).","fix":"Only insert the separator when there is already code:\n\n```rust\nlet existing_code = self.code.to_mut();\nif !existing_code.is_empty() {\n    existing_code.push('\\n');\n}\nlet start_offset = existing_code.text_len();\n```\n\nAlternatively, skip pushing a `CodeBlock` in the `Entry::Vacant` arm of `process_code_block` when `code.is_empty()`, mirroring the early return in `append_code`.","locations":[{"ref":"crates/mdtest/src/parser.rs:396-413","code":"  396 |     fn append_code(&mut self, backtick_offsets: BacktickOffsets, new_code: &str) {\n  397 |         // Treat empty code blocks as non-existent, instead of creating\n  398 |         // an additional empty line:\n  399 |         if new_code.is_empty() {\n  400 |             return;\n  401 |         }\n  402 | \n  403 |         let existing_code = self.code.to_mut();\n  404 |         existing_code.push('\\n');\n  405 |         let start_offset = existing_code.text_len();\n  406 |         existing_code.push_str(new_code);\n  407 | \n  408 |         self.code_blocks.push(CodeBlock {\n  409 |             backticks: backtick_offsets,\n  410 |             embedded_start_offset: start_offset,\n  411 |             inline_snapshot_block: None,\n  412 |         });\n  413 |     }","lines":18,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/mdtest/src/parser.rs#L396-L413"},{"ref":"crates/mdtest/src/parser.rs:291-307","code":"  291 | impl EmbeddedFileSourceMap {\n  292 |     pub(crate) fn new(\n  293 |         md_index: &LineIndex,\n  294 |         dimensions: impl IntoIterator<Item = BacktickOffsets>,\n  295 |     ) -> EmbeddedFileSourceMap {\n  296 |         EmbeddedFileSourceMap {\n  297 |             start_line_and_line_count: dimensions\n  298 |                 .into_iter()\n  299 |                 .map(|d| {\n  300 |                     let start_line = md_index.line_index(d.start()).get();\n  301 |                     let end_line = md_index.line_index(d.end()).get();\n  302 |                     let code_line_count = (end_line - start_line) - 1;\n  303 |                     (start_line, code_line_count)\n  304 |                 })\n  305 |                 .collect(),\n  306 |         }\n  307 |     }","lines":17,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/mdtest/src/parser.rs#L291-L307"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `resolve`, the fourth-priority branch (user-level settings file) derives the fallback `target-version` from `find_fallback_target_version(&*path_dedot::CWD)`, ignoring `stdin_filename`, while the final fallback branch uses `find_fallback_target_version(stdin_filename.unwrap_or(&cwd))`. With `ruff check --stdin-filename /other/project/foo.py` and a user-level `~/.config/ruff/ruff.toml` present, the `requires-python` of `/other/project/pyproject.toml` is ignored and the cwd's is used instead, so the wrong Python version is inferred.","fix":"Thread the same path into `FallbackTransformer`, e.g. add a field `target: &'a Path` initialized to `stdin_filename.unwrap_or(&cwd)` and call `find_fallback_target_version(self.target)` instead of `find_fallback_target_version(&*path_dedot::CWD)`.","locations":[{"ref":"crates/ruff/src/resolve.rs:83-100","code":"   83 |     if let Some(pyproject) = pyproject::find_user_settings_toml() {\n   84 |         struct FallbackTransformer<'a> {\n   85 |             arguments: &'a ConfigArguments,\n   86 |         }\n   87 | \n   88 |         impl ConfigurationTransformer for FallbackTransformer<'_> {\n   89 |             fn transform(&self, mut configuration: Configuration) -> Configuration {\n   90 |                 // The `requires-python` constraint from the `pyproject.toml` takes precedence\n   91 |                 // over the `target-version` from the user configuration.\n   92 |                 let fallback = find_fallback_target_version(&*path_dedot::CWD);\n   93 |                 if let Some(fallback) = fallback {\n   94 |                     debug!(\"Derived `target-version` from found `requires-python`: {fallback:?}\");\n   95 |                     configuration.target_version = Some(fallback.into());\n   96 |                 }\n   97 | \n   98 |                 self.arguments.transform(configuration)\n   99 |             }\n  100 |         }","lines":18,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff/src/resolve.rs#L83-L100"},{"ref":"crates/ruff/src/resolve.rs:126-138","code":"  126 |     if config.target_version.is_none() {\n  127 |         // If we have arrived here we know that there was no `pyproject.toml`\n  128 |         // containing a `[tool.ruff]` section found in an ancestral directory.\n  129 |         // (This is an implicit requirement in the function\n  130 |         // `pyproject::find_settings_toml`.)\n  131 |         // However, there may be a `pyproject.toml` with a `requires-python`\n  132 |         // specified, and that is what we look for in this step.\n  133 |         let fallback = find_fallback_target_version(stdin_filename.unwrap_or(&cwd));\n  134 |         if let Some(version) = fallback {\n  135 |             debug!(\"Derived `target-version` from found `requires-python`: {version:?}\");\n  136 |         }\n  137 |         config.target_version = fallback.map(ast::PythonVersion::from);\n  138 |     }","lines":13,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff/src/resolve.rs#L126-L138"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`RenderingSortKey::cmp` is not a total order. The file/range comparison is only performed when *both* diagnostics have a primary span; otherwise the comparison falls through to severity/id/message. So for `A` (file `f`, offset 10), `B` (no primary span) and `C` (file `f`, offset 20) that share severity, `DiagnosticId` and concise message, we get `A == B`, `B == C` but `A < C`, violating transitivity. This key is fed to `sort_unstable_by` (e.g. `ty_python_semantic/src/lib.rs:213`, `ty_project/src/lib.rs:148`), and since Rust 1.81 the standard sorts may panic with \"user-provided comparison function does not correctly implement a total order\" when they detect such an inconsistency; otherwise the resulting diagnostic order is unspecified.","fix":"Make \"has no span\" an explicit, ordered component of the key rather than a fall-through. For example, compare `(span.is_none(), path, range.start())` as a tuple first:\n\n```rust\nlet key = |d: &Diagnostic| {\n    let span = d.primary_span();\n    (\n        span.is_none(),\n        span.as_ref().map(|s| s.file().path(&self.db)),\n        span.as_ref().and_then(|s| s.range()).map(|r| r.start()),\n    )\n};\nlet order = key(self.diagnostic).cmp(&key(other.diagnostic));\nif order.is_ne() { return order; }\n```\nthen keep the existing severity/id/message tiebreaks.","locations":[{"ref":"crates/ruff_db/src/diagnostic/mod.rs:569-614","code":"  569 | impl Ord for RenderingSortKey<'_> {\n  570 |     // We sort diagnostics in a way that keeps them in source order\n  571 |     // and grouped by file. After that, we fall back to severity\n  572 |     // (with fatal messages sorting before info messages) and then\n  573 |     // finally the diagnostic ID and concise message.\n  574 |     fn cmp(&self, other: &Self) -> std::cmp::Ordering {\n  575 |         if let (Some(span1), Some(span2)) = (\n  576 |             self.diagnostic.primary_span(),\n  577 |             other.diagnostic.primary_span(),\n  578 |         ) {\n  579 |             let file1 = span1.file();\n  580 |             let file2 = span2.file();\n  581 |             if file1 != file2 {\n  582 |                 let order = file1.path(&self.db).cmp(file2.path(&self.db));\n  583 |                 if order.is_ne() {\n  584 |                     return order;\n  585 |                 }\n  586 |             }\n  587 | \n  588 |             if let (Some(range1), Some(range2)) = (span1.range(), span2.range()) {\n  589 |                 let order = range1.start().cmp(&range2.start());\n  590 |                 if order.is_ne() {\n  591 |                     return order;\n  592 |                 }\n  593 |             }\n  594 |         }\n  595 |         // Reverse so that, e.g., Fatal sorts before Info.\n  596 |         let order = self\n  597 |             .diagnostic\n  598 |             .severity()\n  599 |             .cmp(&other.diagnostic.severity())\n  600 |             .reverse();\n  601 |         if order.is_ne() {\n  602 |             return order;\n  603 |         }\n  604 |         let order = self.diagnostic.id().cmp(&other.diagnostic.id());\n  605 |         if order.is_ne() {\n  606 |             return order;\n  607 |         }\n  608 | \n  609 |         self.diagnostic\n  610 |             .concise_message()\n  611 |             .to_str()\n  612 |             .cmp(&other.diagnostic.concise_message().to_str())\n  613 |     }\n  614 | }","lines":46,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_db/src/diagnostic/mod.rs#L569-L614"}]},
{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `ResolvedDiagnostic::to_renderable`, the decision to start a new snippet compares the *previous annotation's* `line_end` (`snippet.last()`) against the current annotation's context start, instead of the running maximum `line_end` of all annotations already in the snippet. Because annotations are sorted by `range.start()` only, a long multi-line annotation followed by a short one leaves `prev.line_end` far below the snippet's real extent (which `RenderableSnippet::new` computes with `anns.iter().map(|ann| ann.line_end).max()`). The result is snippets that overlap and re-render the same source lines.\n\nConfirmed with a temporary test (a primary annotation spanning lines 1-10, a secondary at line 2, a secondary at line 12, default `context = 2`):\n\n```\n 1 | / l01\n ...\n10 | | l10\n   | |___^ spans 1-10\n11 |   l11\n12 |   l12\n   |\n  ::: nums:12:1\n   |\n10 |   l10\n11 |   l11\n12 |   l12\n   |   --- at 12\n```\n\nLines 10-12 are printed twice, and the second frame re-shows content that was already displayed.","fix":"Track the maximum `line_end` seen so far in the current `snippet` and use it for the `context_after` call instead of `snippet.last()`. For example, keep a `let mut snippet_line_end: Option<OneIndexed> = None;` alongside `snippet`, update it with `snippet_line_end = Some(snippet_line_end.map_or(ann.line_end, |e| e.max(ann.line_end)))` on every push, reset it to `None` when the snippet is flushed, and compute\n\n```rust\nlet prev_context_ends = context_after(\n    &prev.diagnostic_source.as_source_code(),\n    merge_window,\n    snippet_line_end.unwrap_or(prev.line_end),\n    prev.notebook_index.as_ref(),\n)\n.get();\n```","locations":[{"ref":"crates/ruff_db/src/diagnostic/render.rs:325-390","code":"  325 |         for (path, anns) in ann_by_path {\n  326 |             let mut snippet = vec![];\n  327 |             for ann in anns {\n  328 |                 let Some(prev) = snippet.last() else {\n  329 |                     snippet.push(ann);\n  330 |                     continue;\n  331 |                 };\n  332 | \n  333 |                 let prev_context_ends = context_after(\n  334 |                     &prev.diagnostic_source.as_source_code(),\n  335 |                     merge_window,\n  336 |                     prev.line_end,\n  337 |                     prev.notebook_index.as_ref(),\n  338 |                 )\n  339 |                 .get();\n  340 |                 let this_context_begins = context_before(\n  341 |                     &ann.diagnostic_source.as_source_code(),\n  342 |                     merge_window,\n  343 |                     ann.line_start,\n  344 |                     ann.notebook_index.as_ref(),\n  345 |                 )\n  346 |                 .get();\n  347 | \n  348 |                 // For notebooks, check whether the end of the\n  349 |                 // previous annotation and the start of the current\n  350 |                 // annotation are in different cells.\n  351 |                 let prev_cell_index = prev.notebook_index.as_ref().map(|notebook_index| {\n  352 |                     let prev_end = prev\n  353 |                         .diagnostic_source\n  354 |                         .as_source_code()\n  355 |                         .line_column(prev.range.end());\n  356 |                     notebook_index.cell(prev_end.line).unwrap_or_default().get()\n  357 |                 });\n  358 |                 let this_cell_index = ann.notebook_index.as_ref().map(|notebook_index| {\n  359 |                     let this_start = ann\n  360 |                         .diagnostic_source\n  361 |                         .as_source_code()\n  362 |                         .line_column(ann.range.start());\n  363 |                     notebook_index\n  364 |                         .cell(this_start.line)\n  365 |                         .unwrap_or_default()\n  366 |                         .get()\n  367 |                 });\n  368 |                 let in_different_cells = prev_cell_index != this_cell_index;\n  369 | \n  370 |                 // The boundary case here is when `prev_context_ends`\n  371 |                 // is exactly one less than `this_context_begins`. In\n  372 |                 // that case, the context windows are adjacent and we\n  373 |                 // should fall through below to add this annotation to\n  374 |                 // the existing snippet.\n  375 |                 //\n  376 |                 // For notebooks, also check that the context windows\n  377 |                 // are in the same cell. Windows from different cells\n  378 |                 // should never be considered adjacent.\n  379 |                 if in_different_cells || this_context_begins.saturating_sub(prev_context_ends) > 1 {\n  380 |                     snippet_by_path\n  381 |                         .entry(path)\n  382 |                         .or_default()\n  383 |                         .push(std::mem::take(&mut snippet));\n  384 |                 }\n  385 |                 snippet.push(ann);\n  386 |             }\n  387 |             if !snippet.is_empty() {\n  388 |                 snippet_by_path.entry(path).or_default().push(snippet);\n  389 |             }\n  390 |         }","lines":66,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_db/src/diagnostic/render.rs#L325-L390"},{"ref":"crates/ruff_db/src/diagnostic/render.rs:333-339","code":"  333 |                 let prev_context_ends = context_after(\n  334 |                     &prev.diagnostic_source.as_source_code(),\n  335 |                     merge_window,\n  336 |                     prev.line_end,\n  337 |                     prev.notebook_index.as_ref(),\n  338 |                 )\n  339 |                 .get();","lines":7,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_db/src/diagnostic/render.rs#L333-L339"}]},
{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`context_after` computes `let max_lines = OneIndexed::from_zero_indexed(source.line_count());`. `SourceCode::line_count()` already returns the number of lines (`line_starts().len()`), so `from_zero_indexed` adds one and `max_lines` is one *past* the last valid line. This contradicts the doc comment, which promises the result is \"no greater than the number of lines in `source`\". The bug is currently masked because `LineIndex::line_start`/`line_end`/`line_range` all special-case `row_index == starts.len()` and because the trailing-blank-line trim loop immediately decrements the value, but any future caller that adds `1` to the result would index `starts[row_index]` out of bounds.","fix":"Replace\n\n```rust\nlet max_lines = OneIndexed::from_zero_indexed(source.line_count());\n```\n\nwith\n\n```rust\nlet max_lines = OneIndexed::new(source.line_count()).unwrap_or(OneIndexed::MIN);\n```","locations":[{"ref":"crates/ruff_db/src/diagnostic/render.rs:940-956","code":"  940 | /// Returns the line number accounting for the given `len`\n  941 | /// number of following context lines.\n  942 | ///\n  943 | /// The line number returned is guaranteed to be greater\n  944 | /// than or equal to `start` and no greater than the\n  945 | /// number of lines in `source`.\n  946 | ///\n  947 | /// In Jupyter notebooks, lines outside the cell containing\n  948 | /// `start` will be omitted.\n  949 | fn context_after(\n  950 |     source: &SourceCode<'_, '_>,\n  951 |     len: usize,\n  952 |     start: OneIndexed,\n  953 |     notebook_index: Option<&NotebookIndex>,\n  954 | ) -> OneIndexed {\n  955 |     let max_lines = OneIndexed::from_zero_indexed(source.line_count());\n  956 |     let mut line = start.saturating_add(len).min(max_lines);","lines":17,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_db/src/diagnostic/render.rs#L940-L956"}]},
{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`Files::system` interns the `File` under the lexically normalized `absolute` path but queries the file system with the caller-supplied, un-normalized `path`: `let metadata = db.system().path_metadata(path);`. `SystemPath::absolute` resolves `..` purely lexically (see `crates/ruff_db/src/system/path.rs:469-471`), whereas `OsSystem::path_metadata` performs a real `stat` that resolves each intermediate component. The two therefore disagree whenever the path contains `..` traversing a non-existent directory or a symlink, and because the resulting `File` is cached under the normalized key, the wrong status/revision is then returned for every later lookup of the normalized path.","fix":"Query the metadata with the normalized path that is also used as the cache key:\n\n```rust\nlet metadata = db.system().path_metadata(path);\n```\n\nbecomes\n\n```rust\nlet metadata = db.system().path_metadata(&absolute);\n```\n\n(`absolute` is still in scope at that point, it is only moved into `FilePath::from(absolute)` further down.)","locations":[{"ref":"crates/ruff_db/src/files.rs:129-163","code":"  129 |         *self\n  130 |             .inner\n  131 |             .system_by_path\n  132 |             .entry(absolute.clone())\n  133 |             .or_insert_with(|| {\n  134 |                 let metadata = db.system().path_metadata(path);\n  135 | \n  136 |                 tracing::trace!(\"Adding file '{absolute}'\");\n  137 | \n  138 |                 let durability = self.input_durability(\n  139 |                     self.root(db, &absolute)\n  140 |                         .map_or(Durability::default(), |root| root.durability(db)),\n  141 |                 );\n  142 | \n  143 |                 let builder = File::builder(FilePath::from(absolute))\n  144 |                     .durability(durability)\n  145 |                     .path_durability(Durability::NEVER_CHANGE);\n  146 | \n  147 |                 let builder = match metadata {\n  148 |                     Ok(metadata) if metadata.file_type().is_file() => builder\n  149 |                         .permissions(metadata.permissions())\n  150 |                         .revision(metadata.revision()),\n  151 |                     Ok(metadata) if metadata.file_type().is_directory() => builder\n  152 |                         .durability(Durability::MEDIUM.max(durability))\n  153 |                         .status(FileStatus::IsADirectory)\n  154 |                         .permissions(metadata.permissions())\n  155 |                         .revision(metadata.revision()),\n  156 |                     _ => builder\n  157 |                         .status(FileStatus::NotFound)\n  158 |                         .status_durability(Durability::MEDIUM.max(durability)),\n  159 |                 };\n  160 | \n  161 |                 builder.new(db)\n  162 |             })\n  163 |     }","lines":35,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_db/src/files.rs#L129-L163"}]},
{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"The `thiserror` format string for `SourceTextError::FailedToReadNotebook` has a stray trailing backtick: `\"Failed to read notebook: {0}`\"`. This message is surfaced to users - `ty_python_semantic::check_file` turns `source.read_error()` into an `IOErrorDiagnostic` - so running `ty check` on a malformed `.ipynb` prints a diagnostic ending in an unmatched backtick. The sibling variant `FailedToReadFile` has no such character.","fix":"Remove the stray backtick:\n```rust\n// before\n#[error(\"Failed to read notebook: {0}`\")]\n// after\n#[error(\"Failed to read notebook: {0}\")]\n```","locations":[{"ref":"crates/ruff_db/src/source.rs:196-202","code":"  196 | #[derive(Debug, thiserror::Error, PartialEq, Eq, Clone, get_size2::GetSize)]\n  197 | pub enum SourceTextError {\n  198 |     #[error(\"Failed to read notebook: {0}`\")]\n  199 |     FailedToReadNotebook(String),\n  200 |     #[error(\"Failed to read file: {0}\")]\n  201 |     FailedToReadFile(String),\n  202 | }","lines":7,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_db/src/source.rs#L196-L202"}]},
{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`generate_docs::main` only understands a boolean `dry_run` flag, while every other generator takes a `Mode` (`Write` / `Check` / `DryRun`). `generate_all::main` bridges the two with `dry_run: args.mode.is_dry_run()`, so running `cargo dev generate-all --mode check` — the mode whose documented purpose is \"Don't write to the file, check if the file is up-to-date and error if not\" — silently takes the `else` branch of `if args.dry_run` and **writes** every `docs/rules/<rule>.md` file to disk. A \"check\" invocation therefore mutates the working tree and can never report that the rule docs are stale.","fix":"Replace `Args { dry_run: bool }` in `generate_docs` with `Args { mode: Mode }` (matching `generate_ty_rules`, `generate_ty_options`, etc.) and handle all three arms: `Mode::DryRun` prints, `Mode::Write` writes only when the content differs, and `Mode::Check` compares against the on-disk file and `bail!`s with a `StrComparison` when it differs. Then pass `mode: args.mode` straight through from `generate_all::main` instead of `dry_run: args.mode.is_dry_run()`.","locations":[{"ref":"crates/ruff_dev/src/generate_docs.rs:21-26","code":"   21 | #[derive(clap::Args)]\n   22 | pub(crate) struct Args {\n   23 |     /// Write the generated docs to stdout (rather than to the filesystem).\n   24 |     #[arg(long)]\n   25 |     pub(crate) dry_run: bool,\n   26 | }","lines":6,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_dev/src/generate_docs.rs#L21-L26"},{"ref":"crates/ruff_dev/src/generate_docs.rs:155-160","code":"  155 |             if args.dry_run {\n  156 |                 println!(\"{output}\");\n  157 |             } else {\n  158 |                 fs::create_dir_all(\"docs/rules\")?;\n  159 |                 fs::write(filename, output)?;\n  160 |             }","lines":6,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_dev/src/generate_docs.rs#L155-L160"},{"ref":"crates/ruff_dev/src/generate_all.rs:45-47","code":"   45 |     generate_docs::main(&generate_docs::Args {\n   46 |         dry_run: args.mode.is_dry_run(),\n   47 |     })?;","lines":3,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_dev/src/generate_all.rs#L45-L47"}]},
{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`SHOW_HIDDEN_COMMANDS` is honoured by the early-return guard in `generate_command` (so a section *is* emitted for `generate-shell-completion`), but the loop that renders the parent's `<h3>Commands<\/h3>` list filters with a bare `subcommand.is_hide_set()` and does not consult `SHOW_HIDDEN_COMMANDS`. The result, visible in the committed `crates/ty/docs/cli.md`, is that `## ty generate-shell-completion` exists at line 150 with anchor `#ty-generate-shell-completion`, but no `<dt><a href=\"#ty-generate-shell-completion\">` entry appears in the `ty` command list, so the documented command is unreachable through navigation and its anchor is never linked.","fix":"Apply the same exemption in the listing loop. Before:\n```rust\nfor subcommand in subcommands {\n    if subcommand.is_hide_set() {\n        continue;\n    }\n```\nAfter:\n```rust\nfor subcommand in subcommands {\n    if subcommand.is_hide_set() && !SHOW_HIDDEN_COMMANDS.contains(&subcommand.get_name()) {\n        continue;\n    }\n```","locations":[{"ref":"crates/ruff_dev/src/generate_ty_cli_reference.rs:148-156","code":"  148 |         for subcommand in subcommands {\n  149 |             if subcommand.is_hide_set() {\n  150 |                 continue;\n  151 |             }\n  152 |             let subcommand_name = format!(\"{name} {}\", subcommand.get_name());\n  153 |             output.push_str(&format!(\n  154 |                 \"<dt><a href=\\\"#{}\\\"><code>{subcommand_name}<\/code><\/a><\/dt>\",\n  155 |                 subcommand_name.replace(' ', \"-\")\n  156 |             ));","lines":9,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_dev/src/generate_ty_cli_reference.rs#L148-L156"},{"ref":"crates/ruff_dev/src/generate_ty_cli_reference.rs:95-96","code":"   95 |     if command.is_hide_set() && !SHOW_HIDDEN_COMMANDS.contains(&command.get_name()) {\n   96 |         return;","lines":2,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_dev/src/generate_ty_cli_reference.rs#L95-L96"}]},
{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`invalid_end_tag` swaps the two fields of `InvalidDocumentError::StartEndTagMismatch`: it assigns the *end* tag kind to `start_kind` and the *start* tag kind to `end_kind`. Since `Display for InvalidDocumentError` renders it as `\"Expected end tag of kind {start_kind:?} but found {end_kind:?}.\"`, every mismatch reported through this helper prints the two kinds the wrong way round. `CallStack::invalid_document_error` in `call_stack.rs` builds the same variant correctly, so the two error paths disagree. For example a `Fill` whose content ends with an `EndGroup` reports \"Expected end tag of kind Group but found Fill\" instead of \"Expected end tag of kind Fill but found Group\".","fix":"Before:\n\n```rust\nSome(kind) => InvalidDocumentError::StartEndTagMismatch {\n    start_kind: end_tag,\n    end_kind: kind,\n},\n```\n\nAfter:\n\n```rust\nSome(kind) => InvalidDocumentError::StartEndTagMismatch {\n    start_kind: kind,\n    end_kind: end_tag,\n},\n```","locations":[{"ref":"crates/ruff_formatter/src/printer/mod.rs:1568-1577","code":" 1568 | #[cold]\n 1569 | fn invalid_end_tag<R>(end_tag: TagKind, start_tag: Option<TagKind>) -> PrintResult<R> {\n 1570 |     Err(PrintError::InvalidDocument(match start_tag {\n 1571 |         None => InvalidDocumentError::StartTagMissing { kind: end_tag },\n 1572 |         Some(kind) => InvalidDocumentError::StartEndTagMismatch {\n 1573 |             start_kind: end_tag,\n 1574 |             end_kind: kind,\n 1575 |         },\n 1576 |     }))\n 1577 | }","lines":10,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_formatter/src/printer/mod.rs#L1568-L1577"}]},
{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`impl From<&O> for PrinterOptions` builds the printer options from `PrinterOptions::default()` and copies only `indent_style` and `line_width`, silently dropping `indent_width`. Any caller using this conversion would get the default indent width of 2 regardless of the configured `indent-width`, which would corrupt tab-width accounting in `Printer::print_text` and `FitsMeasurer::fits_text`. The impl currently has no callers (all real code goes through `FormatOptions::as_print_options`), so this is a latent trap rather than an active bug — but it is silently wrong if anyone reaches for it.","fix":"Either delete the unused impl, or copy the third field. Before:\n\n```rust\nPrinterOptions::default()\n    .with_indent(options.indent_style())\n    .with_line_width(options.line_width())\n```\n\nAfter:\n\n```rust\nPrinterOptions::default()\n    .with_indent(options.indent_style())\n    .with_tab_width(options.indent_width())\n    .with_line_width(options.line_width())\n```","locations":[{"ref":"crates/ruff_formatter/src/printer/printer_options/mod.rs:19-28","code":"   19 | impl<'a, O> From<&'a O> for PrinterOptions\n   20 | where\n   21 |     O: FormatOptions,\n   22 | {\n   23 |     fn from(options: &'a O) -> Self {\n   24 |         PrinterOptions::default()\n   25 |             .with_indent(options.indent_style())\n   26 |             .with_line_width(options.line_width())\n   27 |     }\n   28 | }","lines":10,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_formatter/src/printer/printer_options/mod.rs#L19-L28"}]},
{"id":"LOGIC_33","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`detect_package_root` can return an empty `Path` and probes the process working directory for `__init__.py`. `Path::ancestors()` on a relative path ends with the empty path `\"\"`, and `is_package(Path::new(\"\"), &[])` evaluates `Path::new(\"\").join(\"__init__.py\").is_file()`, which resolves to `__init__.py` relative to the current working directory. So when the cwd itself contains `__init__.py` and a relative path is linted (for example `ruff check sub/mod.py` or `--stdin-filename sub/mod.py` run from inside a package directory), the loop never hits a non-package ancestor and returns `Some(Path::new(\"\"))`. That empty path is then wrapped in `PackageRoot::root` and handed to `check_file_path` / isort, where `Path::new(\"\").file_name()` is `None`, so module-name derivation for rules such as `implicit-namespace-package` and `invalid-module-name` operates on a degenerate root instead of the real package directory. The same loop is duplicated in `detect_package_root_with_cache` in `crates/ruff_workspace/src/resolver.rs`.","fix":"Stop the ancestor walk before the empty component, e.g. in `detect_package_root`:\n\n```rust\nfor parent in path.ancestors() {\n    if parent.as_os_str().is_empty() || !is_package(parent, namespace_packages) {\n        return current;\n    }\n    current = Some(parent);\n}\n```\n\nand mirror the guard in `is_package` (return `false` for an empty path) so the cwd is never probed for `__init__.py`. Apply the same change to `detect_package_root_with_cache`/`is_package_with_cache` in `crates/ruff_workspace/src/resolver.rs`.","locations":[{"ref":"crates/ruff_linter/src/packaging.rs:28-45","code":"   28 | pub fn is_package(path: &Path, namespace_packages: &[PathBuf]) -> bool {\n   29 |     namespace_packages\n   30 |         .iter()\n   31 |         .any(|namespace_package| path.starts_with(namespace_package))\n   32 |         || path.join(\"__init__.py\").is_file()\n   33 | }\n   34 | \n   35 | /// Return the package root for the given path to a directory with Python file.\n   36 | pub fn detect_package_root<'a>(path: &'a Path, namespace_packages: &[PathBuf]) -> Option<&'a Path> {\n   37 |     let mut current = None;\n   38 |     for parent in path.ancestors() {\n   39 |         if !is_package(parent, namespace_packages) {\n   40 |             return current;\n   41 |         }\n   42 |         current = Some(parent);\n   43 |     }\n   44 |     current\n   45 | }","lines":18,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/packaging.rs#L28-L45"}]},
{"id":"LOGIC_34","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"Two AIR301 fixes hardcode double quotes for the replacement string literal instead of consulting `checker.stylist().quote()`: `check_deprecated_context_key` emits `\"\\\"triggering_asset_events\\\"\"` and `check_trigger_rule_argument_value` emits `\"\\\"none_failed_min_one_success\\\"\"`. In a single-quoted codebase the safe fix flips the quote style, which then conflicts with `Q000`/the formatter's `quote-style = \"single\"`.\n\nVerified:\n```\n$ ruff check --isolated --select AIR301 --diff t7.py\n-    return context.get('triggering_dataset_events')\n+    return context.get(\"triggering_asset_events\")\n```\nContrast with `Renamer::fixup_assigned_value` in `crates/ruff_linter/src/renamer.rs`, which correctly uses `stylist.quote()` for exactly this situation.","fix":"Build the literal with the detected quote style, e.g. in `check_deprecated_context_key`:\n```rust\nlet quote = checker.stylist().quote();\ndiagnostic.set_fix(Fix::safe_edit(Edit::range_replacement(\n    format!(\"{quote}triggering_asset_events{quote}\"),\n    range,\n)));\n```\nand analogously for `\"none_failed_min_one_success\"` in `check_trigger_rule_argument_value` (note `checker` is already in scope in both functions).","locations":[{"ref":"crates/ruff_linter/src/rules/airflow/rules/removal_in_3.rs:386-390","code":"  386 |         diagnostic.set_fix(Fix::safe_edit(Edit::range_replacement(\n  387 |             \"\\\"triggering_asset_events\\\"\".to_string(),\n  388 |             range,\n  389 |         )));\n  390 |     }","lines":5,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/airflow/rules/removal_in_3.rs#L386-L390"},{"ref":"crates/ruff_linter/src/rules/airflow/rules/removal_in_3.rs:1417-1420","code":" 1417 |             diagnostic.set_fix(Fix::safe_edit(Edit::range_replacement(\n 1418 |                 \"\\\"none_failed_min_one_success\\\"\".to_string(),\n 1419 |                 value.range(),\n 1420 |             )));","lines":4,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/airflow/rules/removal_in_3.rs#L1417-L1420"}]},
{"id":"LOGIC_35","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`check_apply_defaults_decorator` produces a `Fix::safe_edit` that deletes `checker.locator().full_lines_range(decorator.range())`, i.e. the whole physical line(s) the decorator occupies. If the decorator carries a trailing comment, that comment is silently destroyed by a fix classified as *safe*, which violates Ruff's convention that comment-removing fixes be unsafe.\n\nVerified:\n```\n$ ruff check --isolated --select AIR301 --diff t6.py\n class ExampleOperator(BaseOperator):\n-    @apply_defaults  # important note\n     def __init__(self, message, **kwargs):\n```","fix":"Downgrade the fix to unsafe when the deleted range contains a comment. Using the existing comment ranges:\n```rust\nlet range = checker.locator().full_lines_range(decorator.range());\nlet edit = Edit::range_deletion(range);\ndiagnostic.set_fix(if checker.comment_ranges().intersects(range) {\n    Fix::unsafe_edit(edit)\n} else {\n    Fix::safe_edit(edit)\n});\n```","locations":[{"ref":"crates/ruff_linter/src/rules/airflow/rules/removal_in_3.rs:1373-1384","code":" 1373 |             let mut diagnostic = checker.report_diagnostic(\n 1374 |                 Airflow3Removal {\n 1375 |                     deprecated: \"apply_defaults\".to_string(),\n 1376 |                     replacement: Replacement::Message(\n 1377 |                         \"`apply_defaults` is now unconditionally done and can be safely removed.\",\n 1378 |                     ),\n 1379 |                 },\n 1380 |                 decorator.range(),\n 1381 |             );\n 1382 |             let range = checker.locator().full_lines_range(decorator.range());\n 1383 |             diagnostic.set_fix(Fix::safe_edit(Edit::range_deletion(range)));\n 1384 |         }","lines":12,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/airflow/rules/removal_in_3.rs#L1373-L1384"}]},
{"id":"LOGIC_36","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`hardcoded_sql_expression` (S608) only guards against reporting nested sub-expressions in the `Operator::Add` arm:\n```rust\nif checker\n    .semantic()\n    .current_expression_parent()\n    .is_some_and(ruff_python_ast::Expr::is_bin_op_expr)\n{\n    return;\n}\n```\nThe `Operator::Mod`, `.format()` and f-string arms have no such guard, so a query built by combining a `%`/f-string with `+` is reported twice, once for the inner node and once for the outer `BinOp`.\n\nVerified with the debug binary:\n```python\nq = (\"SELECT * FROM foo WHERE id = %s\" % x) + y\n```\nemits two `S608` diagnostics (columns 5 and 6), and\n```python\nq = f\"SELECT * FROM foo WHERE id = {x}\" + y\n```\nemits two diagnostics that both start at column 5.","fix":"Hoist the parent check out of the `Add` arm so it applies to every kind of matched expression, e.g. at the top of `hardcoded_sql_expression`:\n```rust\nif checker\n    .semantic()\n    .current_expression_parent()\n    .is_some_and(Expr::is_bin_op_expr)\n{\n    return;\n}\n```\nand delete the duplicated check inside the `Operator::Add` arm.","locations":[{"ref":"crates/ruff_linter/src/rules/flake8_bandit/rules/hardcoded_sql_expression.rs:60-121","code":"   60 | pub(crate) fn hardcoded_sql_expression(checker: &Checker, expr: &Expr) {\n   61 |     let content = match expr {\n   62 |         // \"select * from table where val = \" + \"str\" + ...\n   63 |         Expr::BinOp(ast::ExprBinOp {\n   64 |             op: Operator::Add, ..\n   65 |         }) => {\n   66 |             // Only evaluate the full BinOp, not the nested components.\n   67 |             if checker\n   68 |                 .semantic()\n   69 |                 .current_expression_parent()\n   70 |                 .is_some_and(ruff_python_ast::Expr::is_bin_op_expr)\n   71 |             {\n   72 |                 return;\n   73 |             }\n   74 |             if is_explicit_concatenation(expr) != Some(true) {\n   75 |                 return;\n   76 |             }\n   77 |             checker.generator().expr(expr)\n   78 |         }\n   79 |         // \"select * from table where val = %s\" % ...\n   80 |         Expr::BinOp(ast::ExprBinOp {\n   81 |             left,\n   82 |             op: Operator::Mod,\n   83 |             ..\n   84 |         }) => {\n   85 |             let Some(string) = left.as_string_literal_expr() else {\n   86 |                 return;\n   87 |             };\n   88 |             string.value.to_str().escape_default().to_string()\n   89 |         }\n   90 |         Expr::Call(ast::ExprCall { func, .. }) => {\n   91 |             let Expr::Attribute(ast::ExprAttribute { attr, value, .. }) = func.as_ref() else {\n   92 |                 return;\n   93 |             };\n   94 |             // \"select * from table where val = {}\".format(...)\n   95 |             if attr != \"format\" {\n   96 |                 return;\n   97 |             }\n   98 |             let Some(string) = value.as_string_literal_expr() else {\n   99 |                 return;\n  100 |             };\n  101 |             string.value.to_str().escape_default().to_string()\n  102 |         }\n  103 | \n  104 |         // f\"select * from table where val = {val}\"\n  105 |         Expr::FString(f_string)\n  106 |             if f_string.value.f_strings().any(|fs| {\n  107 |                 fs.elements\n  108 |                     .iter()\n  109 |                     .any(ast::InterpolatedStringElement::is_interpolation)\n  110 |             }) =>\n  111 |         {\n  112 |             concatenated_f_string(f_string, checker.locator())\n  113 |         }\n  114 | \n  115 |         _ => return,\n  116 |     };\n  117 | \n  118 |     if SQL_REGEX.is_match(&content) {\n  119 |         checker.report_diagnostic(HardcodedSQLExpression, expr.range());\n  120 |     }\n  121 | }","lines":62,"link":"https://github.com/astr {"id":"LOGIC_38","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `suspicious_imports`, several `Stmt::ImportFrom` arms loop over `names` and call `report_diagnostic_if_enabled` once *per matching name*, but always with the same `identifier.range()`. Importing two matching members from the same module therefore emits two byte-for-byte identical diagnostics. Verified with the built binary:\n```python\nfrom xml.etree import cElementTree, ElementTree   # S405 reported twice at col 6\nfrom Crypto import Cipher, Hash                   # S403 reported twice at col 6\n```\nThe same pattern affects the `\"xml\"` (`sax`), `\"xml.dom\"` (`expatbuilder`/`minidom`/`pulldom`), `\"wsgiref.handlers\"`, `\"twisted.web.twcgi\"` and `\"Crypto\"` arms.","fix":"Report at most once per import statement by testing with `any` instead of reporting inside the loop, e.g. for `\"xml.etree\"`:\n```rust\n\"xml.etree\" => {\n    if names.iter().any(|name| matches!(name.name.as_str(), \"cElementTree\" | \"ElementTree\")) {\n        checker.report_diagnostic_if_enabled(SuspiciousXmlEtreeImport, identifier.range());\n    }\n}\n```\nApply the same transformation to the `\"xml\"`, `\"xml.dom\"`, `\"wsgiref.handlers\"`, `\"twisted.web.twcgi\"` and `\"Crypto\"` arms (for `\"xml.dom\"`, report each distinct violation kind at most once).","locations":[{"ref":"crates/ruff_linter/src/rules/flake8_bandit/rules/suspicious_imports.rs:460-469","code":"  460 |                 \"xml.etree\" => {\n  461 |                     for name in names {\n  462 |                         if matches!(name.name.as_str(), \"cElementTree\" | \"ElementTree\") {\n  463 |                             checker.report_diagnostic_if_enabled(\n  464 |                                 SuspiciousXmlEtreeImport,\n  465 |                                 identifier.range(),\n  466 |                             );\n  467 |                         }\n  468 |                     }\n  469 | {"id":"LOGIC_39","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`flatten_iterables` (B030) unpacks a starred list at the top level (`Expr::Starred` whose value is `Expr::List` -> elements are queued), but the `Expr::BinOp` arm only unpacks `Expr::Tuple` operands, not `Expr::List`. Because the queue does not remember that a sub-expression came from a star, a starred concatenation of lists is reported as a non-exception class. Verified with the built binary:\n```python\ntry:\n    pass\nexcept (*([ValueError] + [TypeError]),):   # valid Python, 2 false positives\n    pass\n```\nwhile the equivalent `except (*[ValueError],):` and `except (*((ValueError,) + (TypeError,)),):` are correctly accepted.","fix":"Track the starred context while flattening, e.g. queue `(&Expr, bool /* under a star */)` pairs instead of bare `&Expr`, and unpack `Expr::List` (as well as `Expr::Tuple`) whenever the `under a star` flag is set. Do not unconditionally add `Expr::List` to the `Expr::BinOp` arm, since the unstarred `except [A] + [B]:` really is a `TypeError` at runtime and must keep being reported.","locations":[{"ref":"crates/ruff_linter/src/rules/flake8_bugbear/rules/except_with_non_exception_classes.rs:106-129","code":"  106 |             Expr::BinOp(ast::ExprBinOp {\n  107 |                 left,\n  108 |                 right,\n  109 |                 op: Operator::Add,\n  110 |                 ..\n  111 |             }) => {\n  112 |                 for expr in [left, right] {\n  113 |                     // If left or right are tuples, starred, or binary operators, flatten them.\n  114 |                     match expr.as_ref() {\n  115 |                         Expr::Tuple(ast::ExprTuple { elts, .. }) => {\n  116 |                             exprs_to_process.append(&mut elts.iter().collect());\n  117 |                         }\n  118 |                         Expr::Starred(ast::ExprStarred { value, .. }) => {\n  119 |                             exprs_to_process.push_back(value);\n  120 |                         }\n  121 |                         Expr::BinOp(ast::ExprBinOp {\n  122 |                             op: Operator::Add, ..\n  123 |                         }) => {\n  124 |                             exprs_to_process.push_back(expr);\n  125 |                         }\n  126 |                         _ => flattened_exprs.push(expr),\n  127 |                     }\n  128 |                 }\n  129 |             }","lines":24,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/flake8_bugbear/rules/except_with_non_exception_classes.rs#L106-L129"}]},
{"id":"LOGIC_40","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`handle_delete` and `handle_assign` in `LoopMutationsVisitor` iterate over *all* targets of a statement and call `self.add_mutation(range)` with the same statement `range` for each matching target. A statement with two subscript targets on the loop iterable therefore produces two identical B909 diagnostics. Verified with the built binary:\n```python\nsome_list = [1, 2, 3]\nfor x in some_list:\n    del some_list[0], some_list[1]      # 2 identical diagnostics\n    some_list[0] = some_list[1] = 9     # 2 identical diagnostics\n```","fix":"Register at most one mutation per statement, e.g. in `handle_delete`:\n```rust\nlet mutates = targets.iter().any(|target| {\n    matches!(target, Expr::Subscript(ExprSubscript { value, .. })\n        if ComparableExpr::from(self.iter) == ComparableExpr::from(value))\n});\nif mutates {\n    self.add_mutation(range);\n}\n```\nand analogously in `handle_assign` (keeping the `self.index`/`self.target` slice exemption inside the predicate).","locations":[{"ref":"crates/ruff_linter/src/rules/flake8_bugbear/rules/loop_iterator_mutation.rs:255-295","code":"  255 |     fn handle_delete(&mut self, range: TextRange, targets: &[Expr]) {\n  256 |         for target in targets {\n  257 |             if let Expr::Subscript(ExprSubscript {\n  258 |                 range: _,\n  259 |                 node_index: _,\n  260 |                 value,\n  261 |                 slice: _,\n  262 |                 ctx: _,\n  263 |             }) = target\n  264 |             {\n  265 |                 // Find, e.g., `del items[0]`.\n  266 |                 if ComparableExpr::from(self.iter) == ComparableExpr::from(value) {\n  267 |                     self.add_mutation(range);\n  268 |                 }\n  269 |             }\n  270 |         }\n  271 |     }\n  272 | \n  273 |     /// Handle, e.g., `items[0] = 1`.\n  274 |     fn handle_assign(&mut self, range: TextRange, targets: &[Expr]) {\n  275 |         for target in targets {\n  276 |             if let Expr::Subscript(ExprSubscript {\n  277 |                 range: _,\n  278 |                 node_index: _,\n  279 |                 value,\n  280 |                 slice,\n  281 |                 ctx: _,\n  282 |             }) = target\n  283 |             {\n  284 |                 // Find, e.g., `items[0] = 1`.\n  285 |                 if ComparableExpr::from(self.iter) == ComparableExpr::from(value) {\n  286 |                     // But allow, e.g., `for item in items: items[item] = 1`.\n  287 |                     if ComparableExpr::from(self.index) != ComparableExpr::from(slice)\n  288 |                         && ComparableExpr::from(self.target) != ComparableExpr::from(slice)\n  289 |                     {\n  290 |                         self.add_mutation(range);\n  291 |                     }\n  292 |                 }\n  293 |             }\n  294 |         }\n  295 |     }","lines":41,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/flake8_bugbear/rules/loop_iterator_mutation.rs#L255-L295"}]},
{"id":"LOGIC_41","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`builtin_lambda_argument_shadowing` (A006) iterates `parameters.iter_non_variadic_params()`, so variadic lambda parameters are never checked. Because `builtin_argument_shadowing` (A002) explicitly skips all parameters whose current expression is a lambda, `lambda *list, **dict: None` is reported by neither rule. Verified: `ruff check --select A002,A006` on\n```python\nf = lambda *list, **dict: None\ndef g(*list, **dict): pass\n```\nonly reports the `def` (A002) parameters, not the lambda's.","fix":"Iterate all parameters. Before:\n```rust\nfor param in parameters.iter_non_variadic_params() {\n```\nAfter:\n```rust\nfor param in parameters.iter() {\n```\n(`Parameters::iter` yields `AnyParameterRef`, which also exposes `name()`.)","locations":[{"ref":"crates/ruff_linter/src/rules/flake8_builtins/rules/builtin_lambda_argument_shadowing.rs:43-58","code":"   43 |     for param in parameters.iter_non_variadic_params() {\n   44 |         let name = param.name();\n   45 |         if shadows_builtin(\n   46 |             name,\n   47 |             checker.source_type,\n   48 |             &checker.settings().flake8_builtins.ignorelist,\n   49 |             checker.target_version(),\n   50 |         ) {\n   51 |             checker.report_diagnostic(\n   52 |                 BuiltinLambdaArgumentShadowing {\n   53 |                     name: name.to_string(),\n   54 |                 },\n   55 |                 name.range(),\n   56 |             );\n   57 |         }\n   58 |     }","lines":16,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/flake8_builtins/rules/builtin_lambda_argument_shadowing.rs#L43-L58"}]},
{"id":"LOGIC_42","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"very_easy","description":"`CacheKey for Path` hashes each component without first writing the component count, unlike the `[T]`, `Vec<T>`, `HashMap`, `HashSet` and `BTreeMap` implementations which all write `self.len()` first. The encoding is therefore not prefix-free across adjacent fields: a struct with two `PathBuf` fields hashes `(\"a/b\", \"c\")` and `(\"a\", \"b/c\")` to the same cache key, so a settings change between such fields would not invalidate `.ruff_cache`.","fix":"Write the component count first, mirroring the slice impl:\n\nBefore:\n```rust\nfn cache_key(&self, state: &mut CacheKeyHasher) {\n    for component in self.components() {\n        component.hash(&mut *state);\n    }\n}\n```\nAfter:\n```rust\nfn cache_key(&self, state: &mut CacheKeyHasher) {\n    state.write_usize(self.components().count());\n    for component in self.components() {\n        component.hash(&mut *state);\n    }\n}\n```","locations":[{"ref":"crates/ruff_cache/src/cache_key.rs:358-365","code":"  358 | impl CacheKey for Path {\n  359 |     #[inline]\n  360 |     fn cache_key(&self, state: &mut CacheKeyHasher) {\n  361 |         for component in self.components() {\n  362 |             component.hash(&mut *state);\n  363 |         }\n  364 |     }\n  365 | }","lines":8,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_cache/src/cache_key.rs#L358-L365"},{"ref":"crates/ruff_cache/src/cache_key.rs:280-286","code":"  280 | impl<T: CacheKey> CacheKey for [T] {\n  281 |     #[inline]\n  282 |     fn cache_key(&self, state: &mut CacheKeyHasher) {\n  283 |         state.write_usize(self.len());\n  284 |         CacheKey::cache_key_slice(self, state);\n  285 |     }\n  286 | }","lines":7,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_cache/src/cache_key.rs#L280-L286"}]},
{"id":"LOGIC_43","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"medium","description":"The GitLab Code Quality `fingerprint` is derived only from `diagnostic.name()`, the rendered `path` and a collision salt - it deliberately excludes the line/column and the message. Two findings of the same rule in the same file therefore always collide, and the collision is broken by re-hashing with the previous fingerprint as salt, which makes the assigned fingerprints depend on the *iteration order* of `self.diagnostics`. Inserting or removing an earlier occurrence of the same rule in the same file re-labels all later occurrences, defeating GitLab's ability to track a finding across pipelines.","fix":"Include order-independent content in `fingerprint`, for example hash `diagnostic.concise_message()` and `location.positions.begin.line` in addition to `diagnostic.name()` and `project_path`, so that the salted retry loop is only needed for genuinely identical findings.","locations":[{"ref":"crates/ruff_db/src/diagnostic/render/gitlab.rs:95-102","code":"   95 |             let mut message_fingerprint = fingerprint(diagnostic, &location.path, 0);\n   96 | \n   97 |             // Make sure that we do not get a fingerprint that is already in use\n   98 |             // by adding in the previously generated one.\n   99 |             while fingerprints.contains(&message_fingerprint) {\n  100 |                 message_fingerprint = fingerprint(diagnostic, &location.path, message_fingerprint);\n  101 |             }\n  102 |             fingerprints.insert(message_fingerprint);","lines":8,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_db/src/diagnostic/render/gitlab.rs#L95-L102"},{"ref":"crates/ruff_db/src/diagnostic/render/gitlab.rs:164-173","code":"  164 | /// Generate a unique fingerprint to identify a violation.\n  165 | fn fingerprint(diagnostic: &Diagnostic, project_path: &str, salt: u64) -> u64 {\n  166 |     let mut hasher = DefaultHasher::new();\n  167 | \n  168 |     salt.hash(&mut hasher);\n  169 |     diagnostic.name().hash(&mut hasher);\n  170 |     project_path.hash(&mut hasher);\n  171 | \n  172 |     hasher.finish()\n  173 | }","lines":10,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_db/src/diagnostic/render/gitlab.rs#L164-L173"}]},
{"id":"LOGIC_44","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"very_easy","description":"The `Format::Full` branch of `DisplayDiagnostic` ends its message with `{reformatted}---\\n` inside a raw string literal (`r#\"...\"#`). Escape sequences are not processed in raw strings, so the output literally ends with the four characters `---\\n` instead of `---` followed by a newline, producing garbled output for `--format full` unstable-formatting reports.","fix":"Drop the escape and rely on `writeln!` (which already appends a newline):\n```rust\n// before\n{reformatted}---\\n\"#,\n// after\n{reformatted}---\"#,\n```","locations":[{"ref":"crates/ruff_dev/src/format_dev.rs:705-718","code":"  705 |                         writeln!(\n  706 |                             f,\n  707 |                             r#\"Reformatting the formatted code a second time resulted in formatting changes.\n  708 | ---\n  709 | {diff}---\n  710 | \n  711 | Formatted once:\n  712 | ---\n  713 | {formatted}---\n  714 | \n  715 | Formatted twice:\n  716 | ---\n  717 | {reformatted}---\\n\"#,\n  718 |                         )?;","lines":14,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_dev/src/format_dev.rs#L705-L718"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"very_easy","description":"The AIR312 replacement for `airflow.sensors.bash.BashSensor` points at `airflow.providers.standard.sensor.bash` (singular `sensor`). Every other `standard`-provider sensor entry in the same `match` uses `sensors` (e.g. `airflow.providers.standard.sensors.filesystem`, `...sensors.python`, `...sensors.weekday`), and the real Airflow provider module is `airflow.providers.standard.sensors.bash`. Both the diagnostic help text and the autofix therefore name a module that does not exist.\n\nVerified:\n```\n$ ruff check --isolated --select AIR312 --unsafe-fixes --diff t5.py\n-from airflow.sensors.bash import BashSensor\n+from airflow.providers.standard.sensor.bash import BashSensor\n```\nApplying the fix turns a working import into an `ImportError`.","fix":"Before:\n```rust\n[\"airflow\", \"sensors\", \"bash\", \"BashSensor\"] => ProviderReplacement::Rename {\n    module: \"airflow.providers.standard.sensor.bash\",\n```\nAfter:\n```rust\n[\"airflow\", \"sensors\", \"bash\", \"BashSensor\"] => ProviderReplacement::Rename {\n    module: \"airflow.providers.standard.sensors.bash\",\n```\nThen regenerate `ruff_linter__rules__airflow__tests__AIR312_AIR312.py.snap`.","locations":[{"ref":"crates/ruff_linter/src/rules/airflow/rules/suggested_to_move_to_provider_in_3.rs:214-219","code":"  214 |         [\"airflow\", \"sensors\", \"bash\", \"BashSensor\"] => ProviderReplacement::Rename {\n  215 |             module: \"airflow.providers.standard.sensor.bash\",\n  216 |             name: \"BashSensor\",\n  217 |             provider: \"standard\",\n  218 |             version: \"0.0.1\",\n  219 |         },","lines":6,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/airflow/rules/suggested_to_move_to_provider_in_3.rs#L214-L219"}]},
{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"The call to `render_diff` passes the `(expected, actual)` pair in the wrong order, so every inline-snapshot diff printed by mdtest is inverted: lines prefixed with `-` under the `--- expected` header are actually from the *actual* rendered diagnostics, and `+` lines under `+++ actual` are from the *expected* snapshot. `Failure::with_diff(expected, actual)` stores `(expected, actual)` (see `crates/mdtest/src/lib.rs:460`, which passes `snapshot_code_block.expected` first), `Failure::diff()` returns them in that order, and `render_diff(f, expected, actual)` feeds them to `TextDiff::from_lines(expected, actual)` as `(old, new)`.","fix":"Before:\n\n```rust\nif let Some((expected, actual)) = failure.diff() {\n    let _ = render_diff(assertion_buf, actual, expected);\n}\n```\n\nAfter:\n\n```rust\nif let Some((expected, actual)) = failure.diff() {\n    let _ = render_diff(assertion_buf, expected, actual);\n}\n```","locations":[{"ref":"crates/mdtest/src/lib.rs:208-210","code":"  208 |                 if let Some((expected, actual)) = failure.diff() {\n  209 |                     let _ = render_diff(assertion_buf, actual, expected);\n  210 |                 }","lines":3,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/mdtest/src/lib.rs#L208-L210"},{"ref":"crates/mdtest/src/lib.rs:475-482","code":"  475 | fn render_diff(f: &mut dyn std::fmt::Write, expected: &str, actual: &str) -> std::fmt::Result {\n  476 |     let diff = TextDiff::from_lines(expected, actual);\n  477 | \n  478 |     writeln!(f, \"{}\", \"--- expected\".red())?;\n  479 |     writeln!(f, \"{}\", \"+++ actual\".green())?;\n  480 | \n  481 |     let mut unified = diff.unified_diff();\n  482 |     let unified = unified.header(\"expected\", \"actual\");","lines":8,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/mdtest/src/lib.rs#L475-L482"}]},
