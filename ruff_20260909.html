{"id":"DEAD_9","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`Matcher::match_line` declares a lifetime parameter `'b` with a `where 'b: 'a` bound, but `'b` appears nowhere in the signature or body, so the bound is meaningless and the generic parameter is dead.","fix":"Before:\n\n```rust\nfn match_line<'a, 'b>(\n    &self,\n    diagnostics: &'a [&'a Diagnostic],\n    assertions: &LineAssertions,\n) -> Result<SmallVec<[Diagnostic; 2]>, Vec<Failure>>\nwhere\n    'b: 'a,\n{\n```\n\nAfter:\n\n```rust\nfn match_line<'a>(\n    &self,\n    diagnostics: &'a [&'a Diagnostic],\n    assertions: &LineAssertions,\n) -> Result<SmallVec<[Diagnostic; 2]>, Vec<Failure>> {\n```","locations":[{"ref":"crates/mdtest/src/matcher.rs:335-342","code":"  335 |     fn match_line<'a, 'b>(\n  336 |         &self,\n  337 |         diagnostics: &'a [&'a Diagnostic],\n  338 |         assertions: &LineAssertions,\n  339 |     ) -> Result<SmallVec<[Diagnostic; 2]>, Vec<Failure>>\n  340 |     where\n  341 |         'b: 'a,\n  342 |     {","lines":8,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/mdtest/src/matcher.rs#L335-L342"}]},
{"id":"DEAD_10","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `lint_path`, `SourceKind::from_path` is called with `SourceType::Python(source_type)`, and `SourceKind::from_path` only returns `SourceKind::Markdown` for `SourceType::Markdown`. The inner `match` arm handling `SourceKind::Markdown(_)` can therefore never be taken; the `SourceType::Markdown` case is already handled by the earlier `SourceType::Toml(_) | SourceType::Markdown => return Ok(Diagnostics::default())` arm.","fix":"Collapse the nested match. Before:\n\n```rust\nOk(Some(source_kind)) => match source_kind {\n    SourceKind::Markdown(_) => return Ok(Diagnostics::default()), // skip linting markdown\n    _ => source_kind,\n},\n```\n\nAfter:\n\n```rust\nOk(Some(source_kind)) => source_kind,\n```","locations":[{"ref":"crates/ruff/src/diagnostics.rs:275-285","code":"  275 |     // Extract the sources from the file.\n  276 |     let source_kind = match SourceKind::from_path(path, SourceType::Python(source_type)) {\n  277 |         Ok(Some(source_kind)) => match source_kind {\n  278 |             SourceKind::Markdown(_) => return Ok(Diagnostics::default()), // skip linting markdown\n  279 |             _ => source_kind,\n  280 |         },\n  281 |         Ok(None) => return Ok(Diagnostics::default()),\n  282 |         Err(err) => {\n  283 |             return Ok(Diagnostics::from_source_error(&err, Some(path), settings));\n  284 |         }\n  285 |     };","lines":11,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff/src/diagnostics.rs#L275-L285"}]},
{"id":"DEAD_11","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `Printer::write_summary_text` the chain is `if fixed > 0 { ... } else if remaining > 0 { ... } else if remaining == 0 { ... }`. The final condition `remaining == 0` is always true at that point because the preceding branch already excluded `remaining > 0` and `remaining` is a `usize`.","fix":"Before:\n\n```rust\n} else if remaining == 0 {\n    writeln!(writer, \"{}\", \"All checks passed!\".green().bold())?;\n}\n```\n\nAfter:\n\n```rust\n} else {\n    writeln!(writer, \"{}\", \"All checks passed!\".green().bold())?;\n}\n```","locations":[{"ref":"crates/ruff/src/printer.rs:103-114","code":"  103 |                 if fixed > 0 {\n  104 |                     let s = if total == 1 { \"\" } else { \"s\" };\n  105 |                     writeln!(\n  106 |                         writer,\n  107 |                         \"Found {total} error{s} ({fixed} fixed, {remaining} remaining).\"\n  108 |                     )?;\n  109 |                 } else if remaining > 0 {\n  110 |                     let s = if remaining == 1 { \"\" } else { \"s\" };\n  111 |                     writeln!(writer, \"Found {remaining} error{s}.\")?;\n  112 |                 } else if remaining == 0 {\n  113 |                     writeln!(writer, \"{}\", \"All checks passed!\".green().bold())?;\n  114 |                 }","lines":12,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff/src/printer.rs#L103-L114"}]},
{"id":"DEAD_12","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`ResolvedAnnotation::new` is declared to return `Option<ResolvedAnnotation<'a>>` but every path returns `Some(...)` - there is no `None` return. Both call sites (`ResolvedDiagnostic::from_diagnostic` and `ResolvedDiagnostic::from_sub_diagnostic`) therefore use `filter_map` where `map` would do, hiding the fact that no annotation can ever be dropped.","fix":"Change the signature to `fn new(...) -> ResolvedAnnotation<'a>`, drop the `Some(...)` wrapper on the final expression, and change both `\\.filter_map(|ann| { ... ResolvedAnnotation::new(path, &diagnostic_source, ann, resolver) })` calls to `.map(...)`.","locations":[{"ref":"crates/ruff_db/src/diagnostic/render.rs:435-476","code":"  435 |     fn new(\n  436 |         path: &'a str,\n  437 |         diagnostic_source: &DiagnosticSource,\n  438 |         ann: &'a Annotation,\n  439 |         resolver: &'a dyn FileResolver,\n  440 |     ) -> Option<ResolvedAnnotation<'a>> {\n  441 |         let source = diagnostic_source.as_source_code();\n  442 |         let (range, line_start, line_end) = match (ann.span.range(), ann.message.is_some()) {\n  443 |             // An annotation with no range AND no message is probably(?)\n  444 |             // meaningless, but we should try to render it anyway.\n  445 |             (None, _) => (\n  446 |                 TextRange::empty(TextSize::new(0)),\n  447 |                 OneIndexed::MIN,\n  448 |                 OneIndexed::MIN,\n  449 |             ),\n  450 |             (Some(range), _) => {\n  451 |                 let line_start = source.line_index(range.start());\n  452 |                 let mut line_end = source.line_index(range.end());\n  453 |                 // As a special case, if the *end* of our range comes\n  454 |                 // right after a line terminator, we say that the last\n  455 |                 // line number for this annotation is the previous\n  456 |                 // line and not the next line. In other words, in this\n  457 |                 // case, we treat our line number as an inclusive\n  458 |                 // upper bound.\n  459 |                 if source.slice(range).ends_with(['\\r', '\\n']) {\n  460 |                     line_end = line_end.saturating_sub(1).max(line_start);\n  461 |                 }\n  462 |                 (range, line_start, line_end)\n  463 |             }\n  464 |         };\n  465 |         Some(ResolvedAnnotation {\n  466 |             path,\n  467 |             diagnostic_source: diagnostic_source.clone(),\n  468 |             range,\n  469 |             line_start,\n  470 |             line_end,\n  471 |             message: ann.get_message(),\n  472 |             is_primary: ann.is_primary,\n  473 |             hide_snippet: ann.hide_snippet,\n  474 |             notebook_index: resolver.notebook_index(&ann.span.file),\n  475 |         })\n  476 |     }","lines":42,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_db/src/diagnostic/render.rs#L435-L476"},{"ref":"crates/ruff_db/src/diagnostic/render.rs:229-239","code":"  229 |             .filter_map(|ann| {\n  230 |                 let path = ann\n  231 |                     .span\n  232 |                     .file\n  233 |                     .relative_path(resolver)\n  234 |                     .to_str()\n  235 |                     .unwrap_or_else(|| ann.span.file.path(resolver));\n  236 |                 let diagnostic_source = ann.span.file.diagnostic_source(resolver);\n  237 |                 ResolvedAnnotation::new(path, &diagnostic_source, ann, resolver)\n  238 |             })\n  239 |             .collect();","lines":11,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_db/src/diagnostic/render.rs#L229-L239"}]},
{"id":"DEAD_13","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`crates/ruff_dev/src/main.rs` already sets `#![allow(clippy::print_stdout, clippy::print_stderr)]` at the crate level, so the `#[expect(clippy::print_stdout)]` attribute on the `match command` inside `main` can never suppress anything the crate-level allow does not already suppress. It is leftover noise that suggests the lint is denied elsewhere in the crate, which it is not.","fix":"Remove the redundant attribute. Before:\n```rust\n    #[expect(clippy::print_stdout)]\n    match command {\n```\nAfter:\n```rust\n    match command {\n```","locations":[{"ref":"crates/ruff_dev/src/main.rs:5","code":"    5 | #![allow(clippy::print_stdout, clippy::print_stderr)]","lines":1,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_dev/src/main.rs#L5"},{"ref":"crates/ruff_dev/src/main.rs:98-99","code":"   98 |     #[expect(clippy::print_stdout)]\n   99 |     match command {","lines":2,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_dev/src/main.rs#L98-L99"}]},
{"id":"DEAD_14","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `impl FormatElements for [FormatElement]`, the dedicated match arm for `FormatElement::Interned(interned) if ignore_depth == 0` is fully subsumed by the following generic arm `element if ignore_depth == 0 && element.will_break()`: `FormatElement::will_break` for the `Interned` variant already delegates to `interned.will_break()`, which resolves to this very slice impl via `Deref`. The two paths are behaviourally identical.","fix":"Delete the redundant arm:\n```rust\nFormatElement::Interned(interned) if ignore_depth == 0 => {\n    if interned.will_break() {\n        return true;\n    }\n}\n```\nThe subsequent `element if ignore_depth == 0 && element.will_break() => return true,` arm handles interned elements identically.","locations":[{"ref":"crates/ruff_formatter/src/format_element/document.rs:707-715","code":"  707 |                 FormatElement::Interned(interned) if ignore_depth == 0 => {\n  708 |                     if interned.will_break() {\n  709 |                         return true;\n  710 |                     }\n  711 |                 }\n  712 | \n  713 |                 element if ignore_depth == 0 && element.will_break() => {\n  714 |                     return true;\n  715 |                 }","lines":9,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_formatter/src/format_element/document.rs#L707-L715"},{"ref":"crates/ruff_formatter/src/format_element.rs:266-267","code":"  266 |             FormatElement::Interned(interned) => interned.will_break(),\n  267 |             // Traverse into the most flat version because the content is guaranteed to expand when even","lines":2,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_formatter/src/format_element.rs#L266-L267"}]},
{"id":"DEAD_15","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`PrintWidth`, together with `PrintWidth::new`, its `Default` impl and the three `From` conversions, is entirely unused in the workspace — `PrinterOptions` stores `line_width: LineWidth` directly and nothing else references `PrintWidth`. It duplicates the role of `LineWidth` and is a maintenance trap (two \"line width\" types with different validity invariants: `LineWidth` wraps `NonZeroU16`, `PrintWidth` wraps a plain `u16` so `PrintWidth::new(0)` is constructible).","fix":"Delete the `PrintWidth` struct and all of its impls (`PrintWidth::new`, `Default for PrintWidth`, `From<LineWidth> for PrintWidth`, `From<PrintWidth> for u32`, `From<PrintWidth> for u16`) from `crates/ruff_formatter/src/printer/printer_options/mod.rs`.","locations":[{"ref":"crates/ruff_formatter/src/printer/printer_options/mod.rs:61-92","code":"   61 | #[derive(Debug, Copy, Clone, Eq, PartialEq)]\n   62 | pub struct PrintWidth(u16);\n   63 | \n   64 | impl PrintWidth {\n   65 |     pub fn new(width: u16) -> Self {\n   66 |         Self(width)\n   67 |     }\n   68 | }\n   69 | \n   70 | impl Default for PrintWidth {\n   71 |     fn default() -> Self {\n   72 |         LineWidth::default().into()\n   73 |     }\n   74 | }\n   75 | \n   76 | impl From<LineWidth> for PrintWidth {\n   77 |     fn from(width: LineWidth) -> Self {\n   78 |         Self(u16::from(width))\n   79 |     }\n   80 | }\n   81 | \n   82 | impl From<PrintWidth> for u32 {\n   83 |     fn from(width: PrintWidth) -> Self {\n   84 |         u32::from(width.0)\n   85 |     }\n   86 | }\n   87 | \n   88 | impl From<PrintWidth> for u16 {\n   89 |     fn from(width: PrintWidth) -> Self {\n   90 |         width.0\n   91 |     }\n   92 | }","lines":32,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_formatter/src/printer/printer_options/mod.rs#L61-L92"}]},
{"id":"DEAD_16","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`Rule::HashlibDigestHex` is listed in the `checker.any_rule_enabled(&[...])` guard for the string-method block (`\"...\".join(...)`, `\"...\".split(...)`, `\"...\".format(...)`), but nothing inside that block references it - `refurb::rules::hashlib_digest_hex` is dispatched from an unrelated `if checker.is_rule_enabled(Rule::HashlibDigestHex)` further down. It was added to the wrong list in commit `6e36dcfefe`. The effect is that enabling `FURB181` alone makes the checker enter and re-scan the string-method block for every call expression with an attribute callee, doing nothing.","fix":"Delete the stray entry. Before:\n\n```rust\n                // flynt\n                Rule::StaticJoinToFString,\n                // refurb\n                Rule::HashlibDigestHex,\n                // flake8-simplify\n                Rule::SplitStaticString,\n```\n\nAfter:\n\n```rust\n                // flynt\n                Rule::StaticJoinToFString,\n                // flake8-simplify\n                Rule::SplitStaticString,\n```","locations":[{"ref":"crates/ruff_linter/src/checkers/ast/analyze/expression.rs:560-561","code":"  560 |                 // refurb\n  561 |                 Rule::HashlibDigestHex,","lines":2,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/checkers/ast/analyze/expression.rs#L560-L561"}]},
{"id":"DEAD_17","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `extract_isort_directives`, the `else if off.is_some()` branch immediately re-tests the same value with `if let Some(exclusion_start) = off`. The inner `if let` can never fail, so the `Option` unwrapping is redundant and obscures the control flow.","fix":"Bind the value in the outer condition with a let-chain:\n\nBefore:\n```rust\n} else if off.is_some() {\n    if comment_text == \"# isort: on\" || comment_text == \"# ruff: isort: on\" {\n        if let Some(exclusion_start) = off {\n            exclusions.push(TextRange::new(exclusion_start, range.start()));\n        }\n        off = None;\n    }\n}\n```\nAfter:\n```rust\n} else if let Some(exclusion_start) = off {\n    if comment_text == \"# isort: on\" || comment_text == \"# ruff: isort: on\" {\n        exclusions.push(TextRange::new(exclusion_start, range.start()));\n        off = None;\n    }\n}\n```","locations":[{"ref":"crates/ruff_linter/src/directives.rs:230-236","code":"  230 |         } else if off.is_some() {\n  231 |             if comment_text == \"# isort: on\" || comment_text == \"# ruff: isort: on\" {\n  232 |                 if let Some(exclusion_start) = off {\n  233 |                     exclusions.push(TextRange::new(exclusion_start, range.start()));\n  234 |                 }\n  235 |                 off = None;\n  236 |             }","lines":7,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/directives.rs#L230-L236"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"In `CollectOptionsVisitor::record_set` the comment claims the option set is only added to the completion list when it has documentation, but the code unconditionally pushes the set and substitutes an empty string when `group.documentation()` is `None`. The comment also contains an `it's`/`its` typo.","fix":"Either drop the misleading comment or make the code match it. To match the comment:\n\n```rust\n// Only add the set to the completion list if it has its own documentation.\nif let Some(documentation) = group.documentation() {\n    self.values\n        .push((fully_qualified_name, documentation.to_owned()));\n}\n```\n\nOtherwise replace the comment with something accurate, e.g. `// Add the set itself, falling back to an empty help string when it is undocumented.`","locations":[{"ref":"crates/ruff/src/commands/completions/config.rs:33-37","code":"   33 |         // Only add the set to completion list if it has it's own documentation.\n   34 |         self.values.push((\n   35 |             fully_qualified_name,\n   36 |             group.documentation().unwrap_or(\"\").to_owned(),\n   37 |         ));","lines":5,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff/src/commands/completions/config.rs#L33-L37"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The `Diff` type's doc comment claims \"The implementation isn't fully fledged out and only used by tests.\" That is no longer true: `FullRenderer::render` calls `Diff::from_diagnostic` whenever `diag.has_applicable_fix(self.config.fix_applicability())` holds, and the default `fix_applicability` is `Applicability::Safe`, so real users see these diffs. Verified with `ruff check --isolated --select E703 --preview s.py`, which renders the `help: Remove unnecessary semicolon` diff hunk. The stale comment discourages anyone from treating the listed shortcomings (tab handling, zero-width whitespace, diff cost) as user-facing.","fix":"Replace\n\n```rust\n/// The implementation isn't fully fledged out and only used by tests. Before using in production, try\n/// * Improve layout\n```\n\nwith\n\n```rust\n/// Known shortcomings that are still worth addressing:\n/// * Improve layout\n```\n\n(dropping the \"only used by tests\" claim), and keep the remaining bullet list as a TODO.","locations":[{"ref":"crates/ruff_db/src/diagnostic/render/full.rs:88-102","code":"   88 | /// Renders a diff that shows the code fixes.\n   89 | ///\n   90 | /// The implementation isn't fully fledged out and only used by tests. Before using in production, try\n   91 | /// * Improve layout\n   92 | /// * Replace tabs with spaces for a consistent experience across terminals\n   93 | /// * Replace zero-width whitespaces\n   94 | /// * Print a simpler diff if only a single line has changed\n   95 | /// * Compute the diff from the `Edit` because diff calculation is expensive.\n   96 | struct Diff<'a> {\n   97 |     fix: &'a Fix,\n   98 |     diagnostic_source: DiagnosticSource,\n   99 |     notebook_index: Option<NotebookIndex>,\n  100 |     stylesheet: &'a DiagnosticStylesheet,\n  101 |     merge_window: usize,\n  102 | }","lines":15,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_db/src/diagnostic/render/full.rs#L88-L102"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment on `Edit::content` says it returns the new content \"for an insertion or deletion\", but a deletion is precisely the case where `content` is `None` (see `Edit::kind`, which classifies `content.is_none()` as `EditOperationKind::Deletion`). The kinds that carry content are insertion and replacement.","fix":"Before:\n```rust\n/// Returns the new content for an insertion or deletion.\npub fn content(&self) -> Option<&str> {\n```\nAfter:\n```rust\n/// Returns the new content for an insertion or replacement, or `None` for a deletion.\npub fn content(&self) -> Option<&str> {\n```","locations":[{"ref":"crates/ruff_diagnostics/src/edit.rs:60-63","code":"   60 |     /// Returns the new content for an insertion or deletion.\n   61 |     pub fn content(&self) -> Option<&str> {\n   62 |         self.content.as_deref()\n   63 |     }","lines":4,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_diagnostics/src/edit.rs#L60-L63"},{"ref":"crates/ruff_diagnostics/src/edit.rs:69-77","code":"   69 |     fn kind(&self) -> EditOperationKind {\n   70 |         if self.content.is_none() {\n   71 |             EditOperationKind::Deletion\n   72 |         } else if self.range.is_empty() {\n   73 |             EditOperationKind::Insertion\n   74 |         } else {\n   75 |             EditOperationKind::Replacement\n   76 |         }\n   77 |     }","lines":9,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_diagnostics/src/edit.rs#L69-L77"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The long comment explaining why `ParsedAnnotationsCache` must be cleared in `visit_deferred_string_type_definitions` gives an incorrect reason. It claims that for `x: \"list['str']\"` the `TextRange` of the inner `'str'` \"will be *relative to the parsed `list['str']` node* rather than *relative to the original module*\". That is not true for simple (single-part, unescaped) annotations: `parse_type_annotation` routes those to `parse_simple_type_annotation` -> `parse_string_annotation`, which parses a sub-range of the real module source and therefore produces absolute offsets. Verified empirically: `x: \"list['Undefined1']\"` reports `F821` at the correct absolute column inside the outer string. The clearing is actually needed for *complex* annotations (implicit concatenation or escaped quotes), where `parse_complex_type_annotation` calls `relocate_expr` and gives every nested node the *same* range as the outer string expression, so a nested string would collide with the outer string's cache entry and cause infinite recursion.","fix":"Rewrite the comment to describe the real hazard, e.g. explain that for complex string annotations (`x: \"Li\" \"st['str']\"`) `relocate_expr` assigns every nested node the outer string's range, so a nested string type definition would hit the cache entry of its own enclosing annotation and re-visit it forever; hence the cache must be invalidated between iterations. Use a complex-annotation example rather than the simple `x: \"list['str']\"` example.","locations":[{"ref":"crates/ruff_linter/src/checkers/ast/mod.rs:3080-3107","code":" 3080 |             // If we're parsing string annotations inside string annotations\n 3081 |             // (which is the only reason we might enter a second iteration of this loop),\n 3082 |             // the cache is no longer valid. We must invalidate it to avoid an infinite loop.\n 3083 |             //\n 3084 |             // For example, consider the following annotation:\n 3085 |             // ```python\n 3086 |             // x: \"list['str']\"\n 3087 |             // ```\n 3088 |             //\n 3089 |             // The first time we visit the AST, we see `\"list['str']\"`\n 3090 |             // and identify it as a stringified annotation.\n 3091 |             // We store it in `self.visit.string_type_definitions` to be analyzed later.\n 3092 |             //\n 3093 |             // After the entire tree has been visited, we look through\n 3094 |             // `self.visit.string_type_definitions` and find `\"list['str']\"`.\n 3095 |             // We parse it, and it becomes `list['str']`.\n 3096 |             // After parsing it, we call `self.visit_expr()` on the `list['str']` node,\n 3097 |             // and that `visit_expr` call is going to find `'str'` inside that node and\n 3098 |             // identify it as a string type definition, appending it to\n 3099 |             // `self.visit.string_type_definitions`, ensuring that there will be one\n 3100 |             // more iteration of this loop.\n 3101 |             //\n 3102 |             // Unfortunately, the `TextRange` of `'str'`\n 3103 |             // here will be *relative to the parsed `list['str']` node* rather than\n 3104 |             // *relative to the original module*, meaning the cache\n 3105 |             // (which uses `TextSize` as the key) becomes invalid on the second\n 3106 |             // iteration of this loop.\n 3107 |             self.parsed_annotations_cache.clear();","lines":28,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/checkers/ast/mod.rs#L3080-L3107"}]},
{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment on `Importer::typing_import_edit` states that the import \"will be added after the most recent top-level `TYPE_CHECKING` block\", but `preceding_type_checking_block` uses `self.type_checking_blocks.first()` and therefore always targets the *first* block in the file. Note the contrast with the sibling `preceding_import`, which really does return the most recent preceding statement via `partition_point`. The behaviour is acceptable, but the comment describes the opposite of what the code does.","fix":"Update the doc comment.\n\nBefore:\n```rust\n/// If there are no existing `TYPE_CHECKING` blocks, a new one will be added at the top\n/// of the file. Otherwise, it will be added after the most recent top-level\n/// `TYPE_CHECKING` block.\n```\nAfter:\n```rust\n/// If there are no existing `TYPE_CHECKING` blocks preceding `at`, a new one will be added\n/// at the top of the file. Otherwise, the import is added to the *first* top-level\n/// `TYPE_CHECKING` block in the file.\n```\nAnd rename `preceding_type_checking_block` to `first_preceding_type_checking_block` (or similar) so it no longer reads like `preceding_import`.","locations":[{"ref":"crates/ruff_linter/src/importer/mod.rs:132-137","code":"  132 |     /// Move an existing import into a `TYPE_CHECKING` block.\n  133 |     ///\n  134 |     /// If there are no existing `TYPE_CHECKING` blocks, a new one will be added at the top\n  135 |     /// of the file. Otherwise, it will be added after the most recent top-level\n  136 |     /// `TYPE_CHECKING` block.\n  137 |     pub(crate) fn typing_import_edit(","lines":6,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/importer/mod.rs#L132-L137"},{"ref":"crates/ruff_linter/src/importer/mod.rs:535-543","code":"  535 |     /// Return the `TYPE_CHECKING` block that precedes the given position, if any.\n  536 |     fn preceding_type_checking_block(&self, at: TextSize) -> Option<&'a Stmt> {\n  537 |         let block = self.type_checking_blocks.first()?;\n  538 |         if block.start() <= at {\n  539 |             Some(block)\n  540 |         } else {\n  541 |             None\n  542 |         }\n  543 |     }","lines":9,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/importer/mod.rs#L535-L543"}]},
{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment on `as_non_finite_float_string_literal` says the function returns a boolean, but the signature is `-> Option<&'static str>`. The next two sentences of the same comment then correctly describe the `Option` return, so the first line directly contradicts the rest of the doc and the code. Relatedly, `is_infinity_string_literal` is named with an `is_` prefix (implying `bool`) while it also returns `Option<&'static str>` and carries no doc comment at all.","fix":"Before:\n\n```rust\n/// Returns `true` if `expr` is a string literal that represents a non-finite float.\n```\n\nAfter:\n\n```rust\n/// Returns the matched pattern if `expr` is a string literal that represents a non-finite float.\n```\n\nAlso rename `is_infinity_string_literal` to `as_infinity_string_literal` for consistency with its two siblings and give it a doc comment.","locations":[{"ref":"crates/ruff_linter/src/linter/float.rs:10-14","code":"   10 | /// Returns `true` if `expr` is a string literal that represents a non-finite float.\n   11 | /// E.g., `\"NaN\"`, \"-inf\", `\"Infinity\"`, or even `\" +Inf \\n \\t\"`.\n   12 | /// Return `None` if it's not. Else the lowercased, trimmed string literal,\n   13 | /// e.g., `Some(\"nan\")`, `Some(\"-inf\")`, or `Some(\"+infinity\")`.\n   14 | pub(crate) fn as_non_finite_float_string_literal(expr: &ast::Expr) -> Option<&'static str> {","lines":5,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/linter/float.rs#L10-L14"},{"ref":"crates/ruff_linter/src/linter/float.rs:31-36","code":"   31 | pub(crate) fn is_infinity_string_literal(expr: &ast::Expr) -> Option<&'static str> {\n   32 |     find_any_ignore_ascii_case(\n   33 |         expr,\n   34 |         &[\"inf\", \"+inf\", \"-inf\", \"infinity\", \"+infinity\", \"-infinity\"],\n   35 |     )\n   36 | }","lines":6,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/linter/float.rs#L31-L36"}]},
{"id":"CMT_7","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment on `RuleSet::len` opens a ```` ```rust ```` code fence but never closes it, so the fence swallows the rest of the doc block and rustdoc renders/extracts the example incorrectly (and emits an unclosed-code-block warning).","fix":"Close the fence before the function. Before:\n\n```rust\n    ///     2\n    /// );\n    pub const fn len(&self) -> usize {\n```\n\nAfter:\n\n```rust\n    ///     2\n    /// );\n    /// ```\n    pub const fn len(&self) -> usize {\n```","locations":[{"ref":"crates/ruff_linter/src/registry/rule_set.rs:166-177","code":"  166 |     /// Returns the number of rules in this set.\n  167 |     ///\n  168 |     /// ## Examples\n  169 |     ///\n  170 |     /// ```rust\n  171 |     /// # use ruff_linter::registry::{Rule, RuleSet};\n  172 |     /// assert_eq!(RuleSet::empty().len(), 0);\n  173 |     /// assert_eq!(\n  174 |     ///     RuleSet::from_rules(&[Rule::AmbiguousFunctionName, Rule::BadQuotesInlineString]).len(),\n  175 |     ///     2\n  176 |     /// );\n  177 |     pub const fn len(&self) -> usize {","lines":12,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/registry/rule_set.rs#L166-L177"}]},
{"id":"CMT_8","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment on `in_airflow_task_function` claims it returns `true` if \"the current statement hierarchy **has a** function that's decorated with `@airflow.decorators.task`\". The implementation uses `current_statements().find_map(|stmt| stmt.as_function_def_stmt())`, which stops at the **innermost** enclosing function and checks only that one. A helper function nested inside a `@task`-decorated function therefore yields `false`, contradicting the documented contract. This matters because `check_context_key_usage_in_call`, `check_context_key_usage_in_subscript` and `check_removed_attribute_access_on_context_key` in `removal_in_3.rs` all gate on it.","fix":"Before:\n```rust\n/// Returns `true` if the current statement hierarchy has a function that's decorated with\n/// `@airflow.decorators.task` or `@airflow.sdk.task`.\n```\nAfter:\n```rust\n/// Returns `true` if the *innermost* enclosing function is decorated with\n/// `@airflow.decorators.task` or `@airflow.sdk.task`. Nested helper functions inside a task\n/// function are deliberately not treated as task functions.\n```","locations":[{"ref":"crates/ruff_linter/src/rules/airflow/helpers.rs:295-302","code":"  295 | /// Returns `true` if the current statement hierarchy has a function that's decorated with\n  296 | /// `@airflow.decorators.task` or `@airflow.sdk.task`.\n  297 | pub(crate) fn in_airflow_task_function(semantic: &SemanticModel) -> bool {\n  298 |     semantic\n  299 |         .current_statements()\n  300 |         .find_map(|stmt| stmt.as_function_def_stmt())\n  301 |         .is_some_and(|function_def| is_airflow_task(function_def, semantic))\n  302 | }","lines":8,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/airflow/helpers.rs#L295-L302"}]},
{"id":"CMT_9","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The S601 (`paramiko-call`) doc comment's \"Example\" shows code the rule does not actually flag:\n```python\nimport paramiko\n\nclient = paramiko.SSHClient()\nclient.exec_command(\"echo $HOME\")\n```\nThe implementation only matches the qualified name `[\"paramiko\", \"exec_command\"]`, i.e. a direct `paramiko.exec_command(...)` call (which is what the fixture `S601.py` contains). A method call on an `SSHClient` instance never resolves to that qualified name, so the documented example produces no diagnostic. Readers will conclude the rule covers `SSHClient.exec_command` when it does not.","fix":"Either change the doc example to match the implementation:\n```python\n/// import paramiko\n///\n/// paramiko.exec_command(\"echo $HOME\")\n```\nor, preferably, extend `paramiko_call` to also recognise `exec_command` invoked on a value that `typing::resolve_assignment` resolves to `[\"paramiko\", \"client\", \"SSHClient\"] | [\"paramiko\", \"SSHClient\"]` (the same pattern already used by S507 in `ssh_no_host_key_verification.rs`), and add a fixture case.","locations":[{"ref":"crates/ruff_linter/src/rules/flake8_bandit/rules/paramiko_calls.rs:17-28","code":"   17 | ///\n   18 | /// ## Example\n   19 | /// ```python\n   20 | /// import paramiko\n   21 | ///\n   22 | /// client = paramiko.SSHClient()\n   23 | /// client.exec_command(\"echo $HOME\")\n   24 | /// ```\n   25 | ///\n   26 | /// ## References\n   27 | /// - [Common Weakness Enumeration: CWE-78](https://cwe.mitre.org/data/definitions/78.html)\n   28 | /// - [Paramiko documentation: `SSHClient.exec_command()`](https://docs.paramiko.org/en/stable/api/client.html#paramiko.client.SSHClient.exec_command)","lines":12,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/flake8_bandit/rules/paramiko_calls.rs#L17-L28"},{"ref":"crates/ruff_linter/src/rules/flake8_bandit/rules/paramiko_calls.rs:41-52","code":"   41 | /// S601\n   42 | pub(crate) fn paramiko_call(checker: &Checker, func: &Expr) {\n   43 |     if checker\n   44 |         .semantic()\n   45 |         .resolve_qualified_name(func)\n   46 |         .is_some_and(|qualified_name| {\n   47 |             matches!(qualified_name.segments(), [\"paramiko\", \"exec_command\"])\n   48 |         })\n   49 |     {\n   50 |         checker.report_diagnostic(ParamikoCall, func.range());\n   51 |     }\n   52 | }","lines":12,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/flake8_bandit/rules/paramiko_calls.rs#L41-L52"}]},
{"id":"CMT_10","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The S508 (`snmp-insecure-version`) doc comment recommends code that does not do what it claims:\n```python\n/// Use instead:\n/// ```python\n/// from pysnmp.hlapi import CommunityData\n///\n/// CommunityData(\"public\", mpModel=2)\n/// ```\n```\n`pysnmp`'s `CommunityData` only accepts `mpModel=0` (SNMPv1) and `mpModel=1` (SNMPv2c); there is no `mpModel=2`, and `CommunityData` cannot express SNMPv3 at all. SNMPv3 requires `UsmUserData` (which is exactly what the sibling rule S509 checks). The rule's own message says \"Use SNMPv3 if able\", so the example directly contradicts the advice.","fix":"Before:\n```rust\n/// Use instead:\n/// ```python\n/// from pysnmp.hlapi import CommunityData\n///\n/// CommunityData(\"public\", mpModel=2)\n/// ```\n```\nAfter:\n```rust\n/// Use instead:\n/// ```python\n/// from pysnmp.hlapi import UsmUserData\n///\n/// UsmUserData(\"user\", \"authkey\", \"privkey\")\n/// ```\n```\nThen run `cargo dev generate-all`.","locations":[{"ref":"crates/ruff_linter/src/rules/flake8_bandit/rules/snmp_insecure_version.rs:23-33","code":"   23 | ///\n   24 | /// Use instead:\n   25 | /// ```python\n   26 | /// from pysnmp.hlapi import CommunityData\n   27 | ///\n   28 | /// CommunityData(\"public\", mpModel=2)\n   29 | /// ```\n   30 | ///\n   31 | /// ## References\n   32 | /// - [Cybersecurity and Infrastructure Security Agency (CISA): Alert TA17-156A](https://www.cisa.gov/news-events/alerts/2017/06/05/reducing-risk-snmp-abuse)\n   33 | /// - [Common Weakness Enumeration: CWE-319](https://cwe.mitre.org/data/definitions/319.html)","lines":11,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/flake8_bandit/rules/snmp_insecure_version.rs#L23-L33"},{"ref":"crates/ruff_linter/src/rules/flake8_bandit/rules/snmp_insecure_version.rs:45-69","code":"   45 | /// S508\n   46 | pub(crate) fn snmp_insecure_version(checker: &Checker, call: &ast::ExprCall) {\n   47 |     if checker\n   48 |         .semantic()\n   49 |         .resolve_qualified_name(&call.func)\n   50 |         .is_some_and(|qualified_name| {\n   51 |             matches!(\n   52 |                 qualified_name.segments(),\n   53 |                 [\"pysnmp\", \"hlapi\", .., \"CommunityData\"]\n   54 |             )\n   55 |         })\n   56 |     {\n   57 |         if let Some(keyword) = call.arguments.find_keyword(\"mpModel\") {\n   58 |             if matches!(\n   59 |                 keyword.value,\n   60 |                 Expr::NumberLiteral(ast::ExprNumberLiteral {\n   61 |                     value: ast::Number::Int(Int::ZERO | Int::ONE),\n   62 |                     ..\n   63 |                 })\n   64 |             ) {\n   65 |                 checker.report_diagnostic(SnmpInsecureVersion, keyword.range());\n   66 |             }\n   67 |         }\n   68 |     }\n   69 | }","lines":25,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/flake8_bandit/rules/snmp_insecure_version.rs#L45-L69"}]},
{"id":"CMT_11","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The user-visible message for S504 has a stray trailing backtick: `\"`ssl.wrap_socket` called without an `ssl_version``\"`. This is reproduced verbatim in the committed snapshot `ruff_linter__rules__flake8_bandit__tests__S504_S504.py.snap`, so every user of this rule sees the typo.","fix":"Before:\n```rust\n        \"`ssl.wrap_socket` called without an `ssl_version``\".to_string()\n```\nAfter:\n```rust\n        \"`ssl.wrap_socket` called without an `ssl_version`\".to_string()\n```\nThen regenerate the S504 snapshot with the documented snapshot-update environment variables.","locations":[{"ref":"crates/ruff_linter/src/rules/flake8_bandit/rules/ssl_with_no_version.rs:33-38","code":"   33 | impl Violation for SslWithNoVersion {\n   34 |     #[derive_message_formats]\n   35 |     fn message(&self) -> String {\n   36 |         \"`ssl.wrap_socket` called without an `ssl_version``\".to_string()\n   37 |     }\n   38 | }","lines":6,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/flake8_bandit/rules/ssl_with_no_version.rs#L33-L38"}]},
{"id":"CMT_12","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment on `allow_boolean_trap` states \"To return `true`, the function name must be explicitly allowed, and the argument must be either the first or second argument in the call.\" The function receives no argument index and performs no positional check at all - it only inspects the callee name (`is_allowed_func_call`, the `set`/`set_*` heuristic, `is_semantically_allowed_func_call`, `is_user_allowed_func_call`). The caller `boolean_positional_value_in_call` reports *every* boolean positional argument, not just the first two.","fix":"```rust\n/// Returns `true` if an argument is allowed to use a boolean trap. To return\n/// `true`, the function name must be explicitly allowed, and the argument must\n/// be either the first or second argument in the call.\n```\nbecomes\n```rust\n/// Returns `true` if a call is allowed to use a boolean trap, based solely on\n/// the callee: an explicitly allow-listed name, a setter-like name, or a\n/// user-configured allowed call.\n```","locations":[{"ref":"crates/ruff_linter/src/rules/flake8_boolean_trap/helpers.rs:133-141","code":"  133 | /// Returns `true` if an argument is allowed to use a boolean trap. To return\n  134 | /// `true`, the function name must be explicitly allowed, and the argument must\n  135 | /// be either the first or second argument in the call.\n  136 | pub(super) fn allow_boolean_trap(call: &ast::ExprCall, checker: &Checker) -> bool {\n  137 |     let func_name = match call.func.as_ref() {\n  138 |         Expr::Attribute(ast::ExprAttribute { attr, .. }) => attr.as_str(),\n  139 |         Expr::Name(ast::ExprName { id, .. }) => id.as_str(),\n  140 |         _ => return false,\n  141 |     };","lines":9,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/flake8_boolean_trap/helpers.rs#L133-L141"}]},
{"id":"CMT_13","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The comment above `is_simple_assignment_to_attribute` reads \"Checks whether a statement is a, possibly augmented, assignment of a name to an attribute.\" The function matches `Stmt::Assign` and `Stmt::AnnAssign` (an *annotated* assignment); it explicitly does not handle `Stmt::AugAssign` (`+=` and friends), which falls into the `_ => false` arm. The word \"augmented\" is wrong and misleads a reader into thinking `self.x += y` is accepted.","fix":"```rust\n// Checks whether a statement is a, possibly augmented,\n// assignment of a name to an attribute.\n```\nbecomes\n```rust\n// Checks whether a statement is a, possibly annotated,\n// assignment of a name to an attribute.\n```","locations":[{"ref":"crates/ruff_linter/src/rules/flake8_bugbear/rules/class_as_data_structure.rs:114-116","code":"  114 | // Checks whether a statement is a, possibly augmented,\n  115 | // assignment of a name to an attribute.\n  116 | fn is_simple_assignment_to_attribute(stmt: &ast::Stmt) -> bool {","lines":3,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/flake8_bugbear/rules/class_as_data_structure.rs#L114-L116"}]},
{"id":"CMT_14","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment on `flatten_iterables` says unstarred iterables are left alone, \"subsequently raising a warning for B029\". B029 is `except-with-empty-tuple`, implemented in `except_with_empty_tuple.rs`; the warning actually raised by this code path is B030 (`except-with-non-exception-classes`), which is the rule implemented in this very file.","fix":"```rust\n/// This should leave any unstarred iterables alone (subsequently raising a\n/// warning for B029).\n```\nbecomes\n```rust\n/// This should leave any unstarred iterables alone (subsequently raising a\n/// warning for B030).\n```","locations":[{"ref":"crates/ruff_linter/src/rules/flake8_bugbear/rules/except_with_non_exception_classes.rs:79-83","code":"   79 | /// Given an [`Expr`], flatten any [`Expr::Starred`] expressions and any\n   80 | /// [`Expr::BinOp`] expressions into a flat list of expressions.\n   81 | ///\n   82 | /// This should leave any unstarred iterables alone (subsequently raising a\n   83 | /// warning for B029).","lines":5,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/flake8_bugbear/rules/except_with_non_exception_classes.rs#L79-L83"}]},
{"id":"CMT_15","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"`add_rule.py` generates rule stubs with the signature `pub(crate) fn <name>(checker: &mut Checker) {}`, but the entire linter has moved to `&Checker` (981 occurrences of `checker: &Checker` vs. 1 remaining `&mut Checker`). Newly generated rules therefore start out violating the current convention and will not compile against `Checker::report_diagnostic`'s `&self` usage patterns without an edit.","fix":"Before:\n```python\npub(crate) fn {rule_name_snake}(checker: &mut Checker) {{}}\n```\nAfter:\n```python\npub(crate) fn {rule_name_snake}(checker: &Checker) {{}}\n```","locations":[{"ref":"scripts/add_rule.py:171-176","code":"  171 |         fp.write(\n  172 |             f\"\"\"\n  173 | /// {prefix}{code}\n  174 | pub(crate) fn {rule_name_snake}(checker: &mut Checker) {{}}\n  175 | \"\"\",\n  176 |         )","lines":6,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/scripts/add_rule.py#L171-L176"}]},
{"id":"CMT_16","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The doc comment on `attempt_test` says \"If a panic occurs, a nicely formatted [`FileFailures`] is returned as an `Err()` variant\", but the function returns `Result<T, AttemptTestError<'a>>`; the `FileFailures` is only produced later by `AttemptTestError::into_file_failures`, and only if the caller chooses to call it (`crates/ruff_mdtest/src/lib.rs:139-145` deliberately does not, for `expect-panic` tests).","fix":"Before:\n\n```rust\n/// If a panic occurs, a nicely formatted [`FileFailures`] is returned as an `Err()` variant to\n/// be formatted into a diagnostic message by callers.\n```\n\nAfter:\n\n```rust\n/// If a panic occurs, an [`AttemptTestError`] is returned as an `Err()` variant; callers can\n/// turn it into a nicely formatted [`FileFailures`] with [`AttemptTestError::into_file_failures`].\n```","locations":[{"ref":"crates/mdtest/src/lib.rs:591-605","code":"  591 | /// Run a function over an embedded test file, catching any panics that occur in the process.\n  592 | ///\n  593 | /// If no panic occurs, the result of the function is returned as an `Ok()` variant.\n  594 | ///\n  595 | /// If a panic occurs, a nicely formatted [`FileFailures`] is returned as an `Err()` variant to\n  596 | /// be formatted into a diagnostic message by callers.\n  597 | pub fn attempt_test<'a, T, F>(\n  598 |     test_fn: F,\n  599 |     test_file: &'a TestFile<'a>,\n  600 | ) -> Result<T, AttemptTestError<'a>>\n  601 | where\n  602 |     F: FnOnce(File) -> T + std::panic::UnwindSafe,\n  603 | {\n  604 |     catch_unwind(|| test_fn(test_file.file)).map_err(|info| AttemptTestError { info, test_file })\n  605 | }","lines":15,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/mdtest/src/lib.rs#L591-L605"}]},
{"id":"CMT_17","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The user-facing message printed when a panicking mdtest is run without a backtrace is missing a verb: \"run with `RUST_BACKTRACE=1` environment variable to a backtrace\".","fix":"Before:\n\n```rust\nlet msg = \"run with `RUST_BACKTRACE=1` environment variable to \\\n     a backtrace\";\n```\n\nAfter:\n\n```rust\nlet msg = \"run with `RUST_BACKTRACE=1` environment variable to \\\n     display a backtrace\";\n```","locations":[{"ref":"crates/mdtest/src/lib.rs:638-644","code":"  638 |         if let Some(backtrace) = info.backtrace {\n  639 |             match backtrace.status() {\n  640 |                 BacktraceStatus::Disabled => {\n  641 |                     let msg = \"run with `RUST_BACKTRACE=1` environment variable to \\\n  642 |                          a backtrace\";\n  643 |                     messages.push(Failure::new(msg));\n  644 |                 }","lines":7,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/mdtest/src/lib.rs#L638-L644"}]},
{"id":"CMT_18","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The doc comment above the blanket impl reads \"Every `IntoDiagnosticMessage` is accepted, so to is `std::fmt::Display`.\" It has the implication backwards (the impl makes every `Display` an `IntoDiagnosticMessage`, not the other way around) and contains a typo (`so to is`).","fix":"Before:\n```rust\n/// Every `IntoDiagnosticMessage` is accepted, so to is `std::fmt::Display`.\n```\nAfter:\n```rust\n/// Wherever an `IntoDiagnosticMessage` is accepted, so too is a `std::fmt::Display`.\n```","locations":[{"ref":"crates/ruff_db/src/diagnostic/mod.rs:1770-1775","code":" 1770 | /// Every `IntoDiagnosticMessage` is accepted, so to is `std::fmt::Display`.\n 1771 | impl<T: std::fmt::Display> IntoDiagnosticMessage for T {\n 1772 |     fn into_diagnostic_message(self) -> DiagnosticMessage {\n 1773 |         DiagnosticMessage::from(self.to_string())\n 1774 |     }\n 1775 | }","lines":6,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_db/src/diagnostic/mod.rs#L1770-L1775"}]},
{"id":"CMT_19","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The comment `// No tabs or unprintable chars` guarding `if result.is_empty()` in `replace_unprintable` is wrong on two counts: the function never touches tabs (the doc comment above explicitly says tabs are left to `annotate-snippets`), and the branch is really \"no replacement was performed\", which also covers the `\\r` -> `\\n` normalization that the comment omits.","fix":"Replace\n\n```rust\n    // No tabs or unprintable chars\n    if result.is_empty() {\n```\n\nwith\n\n```rust\n    // Nothing was rewritten: no lone `\\r` and no unprintable characters.\n    if result.is_empty() {\n```","locations":[{"ref":"crates/ruff_db/src/diagnostic/render.rs:1040-1045","code":" 1040 |     // No tabs or unprintable chars\n 1041 |     if result.is_empty() {\n 1042 |         EscapedSourceCode {\n 1043 |             annotations,\n 1044 |             text: Cow::Borrowed(source),\n 1045 |         }","lines":6,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_db/src/diagnostic/render.rs#L1040-L1045"}]},
{"id":"CMT_20","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"`FilePath::to_file`'s doc comment begins \"Interns a virtual file system path and returns a salsa [`File`] ingredient.\" The method does the opposite for virtual paths: `FilePath::SystemVirtual(_)` is the one variant that returns `None`, while `System` and `Vendored` paths are the ones actually interned.","fix":"Replace\n\n```rust\n/// Interns a virtual file system path and returns a salsa [`File`] ingredient.\n```\n\nwith\n\n```rust\n/// Interns a system or vendored path and returns a salsa [`File`] ingredient.\n/// Always returns `None` for virtual paths.\n```","locations":[{"ref":"crates/ruff_db/src/files/path.rs:80-93","code":"   80 |     /// Interns a virtual file system path and returns a salsa [`File`] ingredient.\n   81 |     ///\n   82 |     /// Returns `Some` if a file for `path` exists and is accessible by the user. Returns `None` otherwise.\n   83 |     ///\n   84 |     /// See [`system_path_to_file`] or [`vendored_path_to_file`] if you always have either a file\n   85 |     /// system or vendored path.\n   86 |     #[inline]\n   87 |     pub fn to_file(&self, db: &dyn Db) -> Option<File> {\n   88 |         match self {\n   89 |             FilePath::System(path) => system_path_to_file(db, path).ok(),\n   90 |             FilePath::Vendored(path) => vendored_path_to_file(db, path).ok(),\n   91 |             FilePath::SystemVirtual(_) => None,\n   92 |         }\n   93 |     }","lines":14,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_db/src/files/path.rs#L80-L93"}]},
{"id":"CMT_21","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The doc example for `deduplicate_nested_paths` has a stray `///` appended to the `use` statement: `use ruff_db::system::{SystemPath, deduplicate_nested_paths};///`. This makes the doctest contain a doc comment that documents nothing, triggering the `unused_doc_comments` warning when doctests are compiled.","fix":"Remove the stray comment marker:\n```rust\n// before\n/// use ruff_db::system::{SystemPath, deduplicate_nested_paths};///\n// after\n/// use ruff_db::system::{SystemPath, deduplicate_nested_paths};\n```","locations":[{"ref":"crates/ruff_db/src/system/path.rs:930-938","code":"  930 | /// Deduplicates identical paths and removes nested paths.\n  931 | ///\n  932 | /// # Examples\n  933 | /// ```rust\n  934 | /// use ruff_db::system::{SystemPath, deduplicate_nested_paths};///\n  935 | ///\n  936 | /// let paths = vec![SystemPath::new(\"/a/b/c\"), SystemPath::new(\"/a/b\"), SystemPath::new(\"/a/beta\"), SystemPath::new(\"/a/b/c\")];\n  937 | /// assert_eq!(deduplicate_nested_paths(paths).collect::<Vec<_>>(), &[SystemPath::new(\"/a/b\"), SystemPath::new(\"/a/beta\")]);\n  938 | /// ```","lines":9,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_db/src/system/path.rs#L930-L938"}]},
{"id":"CMT_22","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The comment `// First argument is ignored` above the `parse_cli(files)` call contradicts the code: `parse_cli` builds the matcher with `FormatCommand::command().no_binary_name(true)`, which tells `clap` *not* to treat the first element as a binary name, so every element of `files` (including the first) is parsed as a positional path. Multi-project mode, which passes exactly one path, depends on the first argument being used.","fix":"Delete the stale line:\n```rust\n// before\n// Find files to check (or in this case, format twice). Adapted from ruff\n// First argument is ignored\nlet (cli, overrides) = parse_cli(files)?;\n// after\n// Find files to check (or in this case, format twice). Adapted from ruff\nlet (cli, overrides) = parse_cli(files)?;\n```","locations":[{"ref":"crates/ruff_dev/src/format_dev.rs:39-47","code":"   39 | fn parse_cli(dirs: &[PathBuf]) -> anyhow::Result<(FormatArguments, ConfigArguments)> {\n   40 |     let args_matches = FormatCommand::command()\n   41 |         .no_binary_name(true)\n   42 |         .get_matches_from(dirs);\n   43 |     let mut arguments: FormatCommand = FormatCommand::from_arg_matches(&args_matches)?;\n   44 |     arguments.extend_exclude = Some(vec![FilePattern::Builtin(\"*.md\")]);\n   45 |     let (cli, config_arguments) = arguments.partition(GlobalConfigArgs::default())?;\n   46 |     Ok((cli, config_arguments))\n   47 | }","lines":9,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_dev/src/format_dev.rs#L39-L47"},{"ref":"crates/ruff_dev/src/format_dev.rs:469-471","code":"  469 |     // Find files to check (or in this case, format twice). Adapted from ruff\n  470 |     // First argument is ignored\n  471 |     let (cli, overrides) = parse_cli(files)?;","lines":3,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_dev/src/format_dev.rs#L469-L471"}]},
{"id":"CMT_23","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The `--error-file` CLI help says \"Only used in multi-project mode\", but `main` also writes the single-project result into `error_file` when `--multi-project` is not passed, so the flag works in both modes.","fix":"Update the doc comment:\n```rust\n// before\n/// Write all errors to this file in addition to stdout. Only used in multi-project mode.\n// after\n/// Write all errors to this file in addition to stdout.\n```","locations":[{"ref":"crates/ruff_dev/src/format_dev.rs:211-213","code":"  211 |     /// Write all errors to this file in addition to stdout. Only used in multi-project mode.\n  212 |     #[arg(long)]\n  213 |     pub(crate) error_file: Option<PathBuf>,","lines":3,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_dev/src/format_dev.rs#L211-L213"},{"ref":"crates/ruff_dev/src/format_dev.rs:249-251","code":"  249 |         if let Some(error_file) = &mut error_file {\n  250 |             write!(error_file, \"{}\", result.display(args.format)).unwrap();\n  251 |         }","lines":3,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_dev/src/format_dev.rs#L249-L251"}]},
{"id":"CMT_24","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"`Mode::Write`'s doc comment says \"Update the content in the `configuration.md`\", which is a leftover from `generate_cli_help`. The enum lives in `generate_all` and is shared by `generate_json_schema`, `generate_ty_schema`, `generate_ty_options`, `generate_ty_rules`, `generate_ty_cli_reference` and `generate_ty_env_vars_reference`, none of which touch `configuration.md`. The rendered `--mode` help text for all of those subcommands is therefore misleading.","fix":"Generalize the wording:\n```rust\n// before\n/// Update the content in the `configuration.md`.\n#[default]\nWrite,\n// after\n/// Write the generated content to the target files.\n#[default]\nWrite,\n```","locations":[{"ref":"crates/ruff_dev/src/generate_all.rs:22-33","code":"   22 | #[derive(Copy, Clone, PartialEq, Eq, clap::ValueEnum, Default)]\n   23 | pub(crate) enum Mode {\n   24 |     /// Update the content in the `configuration.md`.\n   25 |     #[default]\n   26 |     Write,\n   27 | \n   28 |     /// Don't write to the file, check if the file is up-to-date and error if not.\n   29 |     Check,\n   30 | \n   31 |     /// Write the generated help to stdout.\n   32 |     DryRun,\n   33 | }","lines":12,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_dev/src/generate_all.rs#L22-L33"}]},
{"id":"CMT_25","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The comment above the `ty.toml` rewrite in `format_snippet` claims the code rewrites \"examples starting with `[tool.ty]` or `[[tool.ty]]`\", but the code performs `example.replace(\"[tool.ty.\", \"[\")`, which requires a trailing dot and therefore does *not* rewrite a bare `[tool.ty]` or `[[tool.ty]]` header. It also replaces every occurrence anywhere in the snippet, not just at the start. A future option whose example uses a bare `[tool.ty]` header would silently be documented with a `pyproject.toml` header inside the `ty.toml` tab.","fix":"Make the comment match the code and widen the rewrite. Before:\n```rust\n// Rewrite examples starting with `[tool.ty]` or `[[tool.ty]]` to their `ty.toml` equivalent.\nif matches!(configuration, ConfigurationFile::TyToml) {\n    example = example.replace(\"[tool.ty.\", \"[\").into();\n}\n```\nAfter:\n```rust\n// Rewrite `[tool.ty.<x>]` / `[[tool.ty.<x>]]` table headers to their `ty.toml` equivalent\n// (`[<x>]` / `[[<x>]]`); a bare `[tool.ty]` header becomes the implicit top-level table.\nif matches!(configuration, ConfigurationFile::TyToml) {\n    example = example.replace(\"[tool.ty.\", \"[\").replace(\"[tool.ty]\\n\", \"\").into();\n}\n```","locations":[{"ref":"crates/ruff_dev/src/generate_ty_options.rs:213-216","code":"  213 |     // Rewrite examples starting with `[tool.ty]` or `[[tool.ty]]` to their `ty.toml` equivalent.\n  214 |     if matches!(configuration, ConfigurationFile::TyToml) {\n  215 |         example = example.replace(\"[tool.ty.\", \"[\").into();\n  216 |     }","lines":4,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_dev/src/generate_ty_options.rs#L213-L216"}]},
{"id":"CMT_26","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"`SectionContext::previous_line` is documented as returning \"the text of the last line of the previous section or an empty string if it is the first section\", but its return type is `Option<&'a str>` and it returns `None` for the first section: `UniversalNewlineIterator::next` short-circuits on an empty string (`crates/ruff_source_file/src/newlines.rs:81`), so `.last()` yields `None` rather than `Some(\"\")`.","fix":"Before:\n```rust\n/// Returns the text of the last line of the previous section or an empty string if it is the first section.\n```\nAfter:\n```rust\n/// Returns the text of the last line preceding this section, or `None` if this is the first section.\n```","locations":[{"ref":"crates/ruff_linter/src/docstrings/sections.rs:386-394","code":"  386 |     /// Returns the text of the last line of the previous section or an empty string if it is the first section.\n  387 |     pub(crate) fn previous_line(&self) -> Option<&'a str> {\n  388 |         let previous =\n  389 |             &self.docstring_body.as_str()[TextRange::up_to(self.range_relative().start())];\n  390 |         previous\n  391 |             .universal_newlines()\n  392 |             .last()\n  393 |             .map(|line| line.as_str())\n  394 |     }","lines":9,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/docstrings/sections.rs#L386-L394"}]},
{"id":"CMT_27","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The doc comment on `is_full_path` opens a fenced code block with ```` ```python ```` but never closes it, so the fence swallows the rest of the comment and rustdoc reports an unclosed code block for this item.","fix":"Add the closing fence before the function signature. Before:\n```rust\n/// os.system(r\"C:\\\\bin\\ls\")\nfn is_full_path(text: &str) -> bool {\n```\nAfter:\n```rust\n/// os.system(r\"C:\\\\bin\\ls\")\n/// ```\nfn is_full_path(text: &str) -> bool {\n```","locations":[{"ref":"crates/ruff_linter/src/rules/flake8_bandit/rules/shell_injection.rs:519-530","code":"  519 | /// Return `true` if the string appears to be a full file path.\n  520 | ///\n  521 | /// ## Examples\n  522 | /// ```python\n  523 | /// import os\n  524 | ///\n  525 | /// os.system(\"/bin/ls\")\n  526 | /// os.system(\"./bin/ls\")\n  527 | /// os.system([\"/bin/ls\"])\n  528 | /// os.system([\"/bin/ls\", \"/tmp\"])\n  529 | /// os.system(r\"C:\\\\bin\\ls\")\n  530 | fn is_full_path(text: &str) -> bool {","lines":12,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/flake8_bandit/rules/shell_injection.rs#L519-L530"}]},
{"id":"CMT_28","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The `## Example` block for `TryExceptContinue` (S112) starts with `import logging`, but the \"bad\" snippet never uses `logging` - the import was copied from the \"Use instead\" snippet below it. The equivalent `TryExceptPass` (S110) documentation correctly omits the import from its bad example.","fix":"Drop the unused import from the bad example:\n```python\n/// ```python\n/// while predicate:\n///     try:\n///         ...\n///     except Exception:\n///         continue\n/// ```\n```","locations":[{"ref":"crates/ruff_linter/src/rules/flake8_bandit/rules/try_except_continue.rs:20-29","code":"   20 | /// ## Example\n   21 | /// ```python\n   22 | /// import logging\n   23 | ///\n   24 | /// while predicate:\n   25 | ///     try:\n   26 | ///         ...\n   27 | ///     except Exception:\n   28 | ///         continue\n   29 | /// ```","lines":10,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/flake8_bandit/rules/try_except_continue.rs#L20-L29"}]},
{"id":"CMT_29","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The `## Example` block for `ReSubPositionalArgs` (B034) illustrates `re.split` but names its second argument `\"replacement\"`, which is copied from the `re.sub` signature. `re.split(pattern, string, maxsplit=0, flags=0)` takes the *string to split* there, so the example teaches the wrong signature for the very function it is documenting.","fix":"```python\nre.split(\"pattern\", \"replacement\", 1)\n...\nre.split(\"pattern\", \"replacement\", maxsplit=1)\n```\nbecomes\n```python\nre.split(\"pattern\", \"string\", 1)\n...\nre.split(\"pattern\", \"string\", maxsplit=1)\n```","locations":[{"ref":"crates/ruff_linter/src/rules/flake8_bugbear/rules/re_sub_positional_args.rs:25-37","code":"   25 | /// ## Example\n   26 | /// ```python\n   27 | /// import re\n   28 | ///\n   29 | /// re.split(\"pattern\", \"replacement\", 1)\n   30 | /// ```\n   31 | ///\n   32 | /// Use instead:\n   33 | /// ```python\n   34 | /// import re\n   35 | ///\n   36 | /// re.split(\"pattern\", \"replacement\", maxsplit=1)\n   37 | /// ```","lines":13,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/flake8_bugbear/rules/re_sub_positional_args.rs#L25-L37"}]},
{"id":"CMT_30","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The B004 documentation only describes `hasattr`: \"Checks for uses of `hasattr` to test if an object is callable\", and the violation message is hard-coded to `Using `hasattr(x, \"__call__\")` ...`. The rule also fires for `getattr(obj, \"__call__\", default)` (see the `\"getattr\"` arm and the `B004.py` fixture), so users get a message naming `hasattr` on a `getattr` call and the docs never mention the `getattr` form.","fix":"Extend the `## What it does` section to mention `getattr(obj, \"__call__\")` and add a `getattr` example, and/or parameterise the violation struct on the function name so the message reads `Using \\`getattr(x, \"__call__\")\\` ...` when the call is a `getattr`.","locations":[{"ref":"crates/ruff_linter/src/rules/flake8_bugbear/rules/unreliable_callable_check.rs:10-29","code":"   10 | /// ## What it does\n   11 | /// Checks for uses of `hasattr` to test if an object is callable (e.g.,\n   12 | /// `hasattr(obj, \"__call__\")`).\n   13 | ///\n   14 | /// ## Why is this bad?\n   15 | /// Using `hasattr` is an unreliable mechanism for testing if an object is\n   16 | /// callable. If `obj` implements a custom `__getattr__`, or if its `__call__`\n   17 | /// is itself not callable, you may get misleading results.\n   18 | ///\n   19 | /// Instead, use `callable(obj)` to test if `obj` is callable.\n   20 | ///\n   21 | /// ## Example\n   22 | /// ```python\n   23 | /// hasattr(obj, \"__call__\")\n   24 | /// ```\n   25 | ///\n   26 | /// Use instead:\n   27 | /// ```python\n   28 | /// callable(obj)\n   29 | /// ```","lines":20,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/flake8_bugbear/rules/unreliable_callable_check.rs#L10-L29"},{"ref":"crates/ruff_linter/src/rules/flake8_bugbear/rules/unreliable_callable_check.rs:113-124","code":"  113 |     // Validate function arguments based on function name\n  114 |     let valid_args = match builtins_function {\n  115 |         \"hasattr\" => {\n  116 |             // hasattr should have exactly 2 positional arguments and no keywords\n  117 |             args.len() == 2\n  118 |         }\n  119 |         \"getattr\" => {\n  120 |             // getattr should have 2 or 3 positional arguments and no keywords\n  121 |             args.len() == 2 || args.len() == 3\n  122 |         }\n  123 |         _ => return,\n  124 |     };","lines":12,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/flake8_bugbear/rules/unreliable_callable_check.rs#L113-L124"}]},
{"id":"CMT_31","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"B007's `## What it does` says \"Checks for unused variables in loops (e.g., `for` and `while` statements)\", but the rule only takes an `ast::StmtFor` and only inspects `for` targets - a `while` statement has no loop control variable and is never examined.","fix":"Before:\n```rust\n/// Checks for unused variables in loops (e.g., `for` and `while` statements).\n```\nAfter:\n```rust\n/// Checks for unused control variables in `for` loops.\n```","locations":[{"ref":"crates/ruff_linter/src/rules/flake8_bugbear/rules/unused_loop_control_variable.rs:13-15","code":"   13 | /// ## What it does\n   14 | /// Checks for unused variables in loops (e.g., `for` and `while` statements).\n   15 | ///","lines":3,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/flake8_bugbear/rules/unused_loop_control_variable.rs#L13-L15"},{"ref":"crates/ruff_linter/src/rules/flake8_bugbear/rules/unused_loop_control_variable.rs:85-90","code":"   85 | pub(crate) fn unused_loop_control_variable(checker: &Checker, stmt_for: &ast::StmtFor) {\n   86 |     let control_names = {\n   87 |         let mut finder = StoredNameFinder::default();\n   88 |         finder.visit_expr(stmt_for.target.as_ref());\n   89 |         finder.names\n   90 |     };","lines":6,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/flake8_bugbear/rules/unused_loop_control_variable.rs#L85-L90"}]},
{"id":"CMT_32","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The comment `// Ignore strings, to avoid false positives with docstrings.` sits above a `matches!` that also ignores `Expr::EllipsisLiteral`, which has nothing to do with docstrings (it exists to avoid flagging `...` stub bodies).","fix":"Before:\n```rust\n// Ignore strings, to avoid false positives with docstrings.\n```\nAfter:\n```rust\n// Ignore strings (to avoid false positives with docstrings) and `...` (used as a\n// placeholder body in stubs and protocols).\n```","locations":[{"ref":"crates/ruff_linter/src/rules/flake8_bugbear/rules/useless_expression.rs:82-88","code":"   82 |     // Ignore strings, to avoid false positives with docstrings.\n   83 |     if matches!(\n   84 |         value,\n   85 |         Expr::FString(_) | Expr::StringLiteral(_) | Expr::EllipsisLiteral(_)\n   86 |     ) {\n   87 |         return;\n   88 |     }","lines":7,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/flake8_bugbear/rules/useless_expression.rs#L82-L88"}]},
{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"very_easy","description":"In `ExpandedEdits::serialize`, the `(Some(start_cell), Some(end_cell)) if start_cell != end_cell` arm and the `(Some(_), None)` arm have byte-identical bodies (the `debug_assert_eq!`, the `prev_row` computation and the `end_location` rebuild). Beyond the duplication, the `(Some(_), None)` arm is effectively unreachable: `NotebookIndex::cell` only returns `None` when `cell_starts` is empty, in which case the *start* lookup would also be `None` and the `_` arm would be taken.","fix":"Collapse the two arms into one guard:\n\n```rust\n(Some(start_cell), end_cell) if Some(start_cell) != end_cell => {\n    debug_assert_eq!(end_location.column.get(), 1);\n\n    let prev_row = end_location.line.saturating_sub(1);\n    end_location = LineColumn {\n        line: notebook_index.cell_row(prev_row).unwrap_or(OneIndexed::MIN),\n        column: source_code\n            .line_column(source_code.line_end_exclusive(prev_row))\n            .column,\n    };\n}\n```","locations":[{"ref":"crates/ruff_db/src/diagnostic/render/json.rs:154-183","code":"  154 |                     match (\n  155 |                         notebook_index.cell(location.line),\n  156 |                         notebook_index.cell(end_location.line),\n  157 |                     ) {\n  158 |                         (Some(start_cell), Some(end_cell)) if start_cell != end_cell => {\n  159 |                             debug_assert_eq!(end_location.column.get(), 1);\n  160 | \n  161 |                             let prev_row = end_location.line.saturating_sub(1);\n  162 |                             end_location = LineColumn {\n  163 |                                 line: notebook_index.cell_row(prev_row).unwrap_or(OneIndexed::MIN),\n  164 |                                 column: source_code\n  165 |                                     .line_column(source_code.line_end_exclusive(prev_row))\n  166 |                                     .column,\n  167 |                             };\n  168 |                         }\n  169 |                         (Some(_), None) => {\n  170 |                             debug_assert_eq!(end_location.column.get(), 1);\n  171 | \n  172 |                             let prev_row = end_location.line.saturating_sub(1);\n  173 |                             end_location = LineColumn {\n  174 |                                 line: notebook_index.cell_row(prev_row).unwrap_or(OneIndexed::MIN),\n  175 |                                 column: source_code\n  176 |                                     .line_column(source_code.line_end_exclusive(prev_row))\n  177 |                                     .column,\n  178 |                             };\n  179 |                         }\n  180 |                         _ => {\n  181 |                             end_location = notebook_index.translate_line_column(&end_location);\n  182 |                         }\n  183 |                     }","lines":30,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_db/src/diagnostic/render/json.rs#L154-L183"}]},
{"id":"DUP_2","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"The whole \"parse a source file and build the analysis inputs\" preamble is copy-pasted three times inside `linter.rs` alone, and again in `crates/ruff_server/src/lint.rs` and `crates/ruff_linter/src/test.rs`. Each copy is the same ~35-line sequence: `parse_unchecked_source`, `Locator::new(source_kind.source_code())`, `Stylist::from_tokens`, `Indexer::from_tokens`, `directives::extract_directives(.., directives::Flags::from_settings(settings), ..)`, `Suppressions::from_tokens`, then a 13-argument `check_path` call. Because the sequence is replicated rather than shared, every new `check_path` parameter (`target_version`, `suppressions`, ...) has to be threaded through five call sites by hand, and it is easy for one copy to drift (the `check_path` signature already needs `#[expect(clippy::too_many_arguments)]`).","fix":"Introduce a single struct, e.g. `struct AnalysisInputs<'a> { parsed: Parsed<ModModule>, locator: Locator<'a>, stylist: Stylist<'a>, indexer: Indexer, directives: Directives, suppressions: Suppressions }`, with a constructor `AnalysisInputs::build(source_kind, source_type, settings, target_version)` that performs the six construction steps, and a method `fn check(&self, path, package, settings, noqa, source_kind, source_type, target_version) -> Vec<Diagnostic>` that forwards to `check_path`. Then `add_suppressions_to_path`, `lint_only`, the `lint_fix` loop body, `ruff_server::lint`, and `ruff_linter::test` each shrink to two calls and `check_path` no longer needs to be a 13-argument public function.","locations":[{"ref":"crates/ruff_linter/src/linter.rs:387-427","code":"  387 |     // Parse once.\n  388 |     let target_version = settings.resolve_target_version(path);\n  389 |     let parsed = parse_unchecked_source(source_kind, source_type, target_version.parser_version());\n  390 | \n  391 |     // Map row and column locations to b {"id":"DUP_3","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"The `Replacement`-handling boilerplate is copied verbatim across three AIR rule files. Each file contains (a) an ~28-line `fix_title` that matches all six `Replacement` variants, differing only in the literal `\"Airflow 3.0\"` vs `\"Airflow 3.1\"`, and (b) an ~40-line tail block that destructures `(module, name)` out of `&replacement`, reports the diagnostic for the non-fixable variants, calls `is_guarded_by_try_except`, computes `import_target`, and chains `generate_import_edit(...).or_else(|| generate_remove_and_runtime_import_edit(...))`. That is ~68 duplicated lines per file across three files. The bug reported separately (the `import_target` truncation) exists in two of the three copies precisely because of this duplication.","fix":"Move both pieces into `crates/ruff_linter/src/rules/airflow/helpers.rs`:\n```rust\nimpl Replacement {\n    /// Renders the `fix_title` text for a replacement, parameterised by the Airflow version\n    /// that introduced the change (`\"3.0\"`, `\"3.1\"`, ...).\n    pub(crate) fn fix_title(&self, version: &str) -> Option<String> { /* the shared match */ }\n\n    /// Returns `(module, name)` when the replacement is auto-fixable.\n    pub(crate) fn fixable_target(&self) -> Option<(&str, &str)> { /* the shared match */ }\n}\n\npub(crate) fn apply_replacement_fix(\n    checker: &Checker,\n    diagnostic: &mut Diagnostic,\n    expr: &Expr,\n    module: &str,\n    name: &str,\n    range: TextRange,\n) { /* is_guarded_by_try_except + generate_import_edit().or_else(...) */ }\n```\nEach of the three rule files then becomes a `match` over qualified names plus two helper calls.","locations":[{"ref":"crates/ruff_linter/src/rules/airflow/rules/removal_in_3.rs:62-90","code":"   62 |     fn fix_title(&self) -> Option<String> {\n   63 |         let Airflow3Removal { replacement, .. } = self;\n   64 |         match replacement {\n
