{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"`add_argument` computes the insertion point for the \"insert before the first keyword argument\" case by taking `parenthesized_range` of the keyword's *value*. That call was copy-pasted from the `else if let Some(last)` branch below, where extending to a parenthesized value's `end()` is correct. Here it is wrong: for `f(a=(1))` the parenthesized range is `(1)`, whose `start()` sits *after* `a=`, so the new argument is inserted in the middle of the existing keyword. The keyword's own `range` already starts at the `arg` name (or at `**`), which is exactly what is wanted.\n\nConfirmed repro with `B028`:\n```\n$ ruff check --isolated --select B028 --unsafe-fixes --diff t4.py\nerror: Fix introduced a syntax error in `t4.py` with rule codes B028: Expected `,`, found `=`\nimport warnings\nwarnings.warn(\"x\", category=stacklevel=2, (UserWarning))\n```\nRuff's syntax-error guard rejects the fix, but the user gets a scary `error:` message and silently loses the autofix. The same defect affects every caller of `add_argument` (`B028`, `B905`, `B912`, `PLW1510`, `PLC0207`, `PYI059`, `AIR202`, ...).","fix":"Insert at the start of the `Keyword` node itself, which already covers `arg=` and `**`:\n\nBefore:\n```rust\nif let Some(ast::Keyword { range, value, .. }) = arguments.keywords.first() {\n    let keyword = parenthesized_range(value.into(), arguments.into(), tokens).unwrap_or(*range);\n    Edit::insertion(format!(\"{argument}, \"), keyword.start())\n```\nAfter:\n```rust\nif let Some(keyword) = arguments.keywords.first() {\n    Edit::insertion(format!(\"{argument}, \"), keyword.start())\n```\n(`value` and `tokens` are then unused in this branch.) Add a regression test with a parenthesized keyword value such as `warnings.warn(\"x\", category=(UserWarning))`.","locations":[{"ref":"crates/ruff_linter/src/fix/edits.rs:274-278","code":"  274 | pub(crate) fn add_argument(argument: &str, arguments: &Arguments, tokens: &Tokens) -> Edit {\n  275 |     if let Some(ast::Keyword { range, value, .. }) = arguments.keywords.first() {\n  276 |         let keyword = parenthesized_range(value.into(), arguments.into(), tokens).unwrap_or(*range);\n  277 |         Edit::insertion(format!(\"{argument}, \"), keyword.start())\n  278 |     } else if let Some(last) = arguments.iter_source_order().last() {","lines":5,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/fix/edits.rs#L274-L278"}]},
{"id":"CPY_4","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"The `module` string for the `PodStatus` → `PodPhase` replacement has a stray leading space: `\" airflow.providers.cncf.kubernetes.utils.pod_manager\"`. The identical module string three arms above (`PodDefaults`/`PodLauncher`) has no leading space. This leaks into the user-facing help text and into the generated import.\n\nVisible in the committed snapshot `ruff_linter__rules__airflow__tests__AIR302_AIR302_kubernetes.py.snap`:\n```\nhelp: Install `apache-airflow-providers-cncf-kubernetes>=3.0.0` and use `PodPhase` from ` airflow.providers.cncf.kubernetes.utils.pod_manager` instead.\n...\n+ from  airflow.providers.cncf.kubernetes.utils.pod_manager import PodPhase\n```","fix":"Before:\n```rust\n] => ProviderReplacement::Rename {\n    module: \" airflow.providers.cncf.kubernetes.utils.pod_manager\",\n    name: \"PodPhase\",\n```\nAfter:\n```rust\n] => ProviderReplacement::Rename {\n    module: \"airflow.providers.cncf.kubernetes.utils.pod_manager\",\n    name: \"PodPhase\",\n```\nThen regenerate `ruff_linter__rules__airflow__tests__AIR302_AIR302_kubernetes.py.snap`.","locations":[{"ref":"crates/ruff_linter/src/rules/airflow/rules/moved_to_provider_in_3.rs:886-896","code":"  886 |         [\n  887 |             \"airflow\",\n  888 |             \"kubernetes\",\n  889 |             \"pod_launcher\" | \"pod_launcher_deprecated\",\n  890 |             \"PodStatus\",\n  891 |         ] => ProviderReplacement::Rename {\n  892 |             module: \" airflow.providers.cncf.kubernetes.utils.pod_manager\",\n  893 |             name: \"PodPhase\",\n  894 |             provider: \"cncf-kubernetes\",\n  895 |             version: \"3.0.0\",\n  896 |         },","lines":11,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/airflow/rules/moved_to_provider_in_3.rs#L886-L896"}]},
{"id":"CPY_5","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"The `file` argument of `print_tokens::Args` is documented as `Python file for which to generate the AST.` — copied verbatim from `print_ast::Args`. This string is the user-visible clap help for `cargo dev print-tokens --help`, which prints the token stream, not the AST.","fix":"Before:\n```rust\n    /// Python file for which to generate the AST.\n    #[arg(required = true)]\n    file: PathBuf,\n```\nAfter:\n```rust\n    /// Python file for which to print the token stream.\n    #[arg(required = true)]\n    file: PathBuf,\n```","locations":[{"ref":"crates/ruff_dev/src/print_tokens.rs:11-16","code":"   11 | #[derive(clap::Args)]\n   12 | pub(crate) struct Args {\n   13 |     /// Python file for which to generate the AST.\n   14 |     #[arg(required = true)]\n   15 |     file: PathBuf,\n   16 | }","lines":6,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_dev/src/print_tokens.rs#L11-L16"}]},
{"id":"CPY_6","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"`GOOGLE_SECTIONS` lists `SectionKind::Notes` twice: once in the shared block at the top (line 9) and again inside the `// Google-only` block (line 30, right after `SectionKind::Note`). `SectionStyle::sections()` is consumed only through `style.sections().contains(&kind)` in `suspected_as_section`, so the duplicate is harmless at runtime, but it is a paste error (the Google-only block was presumably meant to add `Note` only) and it makes the list misleading when comparing against `NUMPY_SECTIONS`.","fix":"Remove the second occurrence.\n\nBefore:\n```rust\n    SectionKind::Note,\n    SectionKind::Notes,\n    SectionKind::OtherArgs,\n```\nAfter:\n```rust\n    SectionKind::Note,\n    SectionKind::OtherArgs,\n```","locations":[{"ref":"crates/ruff_linter/src/docstrings/google.rs:26-31","code":"   26 |     SectionKind::Important,\n   27 |     SectionKind::KeywordArgs,\n   28 |     SectionKind::KeywordArguments,\n   29 |     SectionKind::Note,\n   30 |     SectionKind::Notes,\n   31 |     SectionKind::OtherArgs,","lines":6,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/docstrings/google.rs#L26-L31"}]},
{"id":"CPY_7","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In `extract_cryptographic_key`, the `\"RSA\"` arm of the `[\"Crypto\" | \"Cryptodome\", \"PublicKey\", function, \"generate\"]` match constructs `CryptographicKey::Dsa` instead of `CryptographicKey::Rsa`. It is an exact copy of the preceding `\"DSA\"` arm with only the match label changed. Since `Display` is derived from the variant, `pycrypto_rsa.generate(bits=2047)` is reported as \"DSA key sizes below 2048 bits are considered breakable\". This is visible in the committed snapshot (`S505.py:35` -> `DSA key sizes ...` for `pycrypto_rsa.generate(bits=2047)`).","fix":"```rust\n\"RSA\" => {\n    let (key_size, range) = extract_int_argument(call, \"bits\", 0)?;\n    Some((CryptographicKey::Dsa { key_size }, range))\n}\n```\nbecomes\n```rust\n\"RSA\" => {\n    let (key_size, range) = extract_int_argument(call, \"bits\", 0)?;\n    Some((CryptographicKey::Rsa { key_size }, range))\n}\n```","locations":[{"ref":"crates/ruff_linter/src/rules/flake8_bandit/rules/weak_cryptographic_key.rs:141-151","code":"  141 |         [\"Crypto\" | \"Cryptodome\", \"PublicKey\", function, \"generate\"] => match *function {\n  142 |             \"DSA\" => {\n  143 |                 let (key_size, range) = extract_int_argument(call, \"bits\", 0)?;\n  144 |                 Some((CryptographicKey::Dsa { key_size }, range))\n  145 |             }\n  146 |             \"RSA\" => {\n  147 |                 let (key_size, range) = extract_int_argument(call, \"bits\", 0)?;\n  148 |                 Some((CryptographicKey::Dsa { key_size }, range))\n  149 |             }\n  150 |             _ => None,\n  151 |         },","lines":11,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/flake8_bandit/rules/weak_cryptographic_key.rs#L141-L151"}]},
{"id":"CPY_8","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"The `--output-format` argument's `help` string is a copy-paste of the `--cache` argument's help text (`\"Location for caching cloned repositories\"`), so `python -m ruff_ecosystem --help` describes `--output-format` as a cache location.","fix":"Before:\n```python\nparser.add_argument(\n    \"--output-format\",\n    choices=[option.value for option in OutputFormat],\n    default=\"markdown\",\n    help=\"Location for caching cloned repositories\",\n)\n```\nAfter:\n```python\nparser.add_argument(\n    \"--output-format\",\n    choices=[option.value for option in OutputFormat],\n    default=\"markdown\",\n    help=\"Output format for the comparison report\",\n)\n```","locations":[{"ref":"python/ruff-ecosystem/ruff_ecosystem/cli.py:132-137","code":"  132 |     parser.add_argument(\n  133 |         \"--output-format\",\n  134 |         choices=[option.value for option in OutputFormat],\n  135 |         default=\"markdown\",\n  136 |         help=\"Location for caching cloned repositories\",\n  137 |     )","lines":6,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/python/ruff-ecosystem/ruff_ecosystem/cli.py#L132-L137"},{"ref":"python/ruff-ecosystem/ruff_ecosystem/cli.py:127-131","code":"  127 |     parser.add_argument(\n  128 |         \"--cache\",\n  129 |         type=Path,\n  130 |         help=\"Location for caching cloned repositories\",\n  131 |     )","lines":5,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/python/ruff-ecosystem/ruff_ecosystem/cli.py#L127-L131"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`commands::version::version` and `commands::rule::rule`/`commands::rule::rules` pass the `BufWriter<StdoutLock>` by value into `serde_json::to_writer_pretty`, which drops it at the end of the call. The final flush therefore happens in `BufWriter::drop`, which discards any `io::Error` (broken pipe, full disk), so `ruff version --output-format json` and `ruff rule --output-format json` can silently produce truncated output while exiting 0. The text branches of the same functions propagate write errors with `?`. The JSON branches also emit no trailing newline, unlike the text branches.","fix":"Borrow the writer and flush explicitly, e.g.:\n\n```rust\nHelpFormat::Json => {\n    serde_json::to_writer_pretty(&mut stdout, &version_info)?;\n    writeln!(stdout)?;\n    stdout.flush()?;\n}\n```\n\nand likewise in `rule`/`rules` (`serde_json::to_writer_pretty(&mut stdout, ...)` / `serializer = serde_json::Serializer::pretty(&mut stdout)` followed by `stdout.flush()?`).","locations":[{"ref":"crates/ruff/src/commands/version.rs:9-20","code":"    9 |     let mut stdout = BufWriter::new(io::stdout().lock());\n   10 |     let version_info = crate::version::version();\n   11 | \n   12 |     match output_format {\n   13 |         HelpFormat::Text => {\n   14 |             writeln!(stdout, \"ruff {version_info}\")?;\n   15 |         }\n   16 |         HelpFormat::Json => {\n   17 |             serde_json::to_writer_pretty(stdout, &version_info)?;\n   18 |         }\n   19 |     }\n   20 |     Ok(())","lines":12,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff/src/commands/version.rs#L9-L20"},{"ref":"crates/ruff/src/commands/rule.rs:111-142","code":"  111 |     let mut stdout = BufWriter::new(io::stdout().lock());\n  112 |     match format {\n  113 |         HelpFormat::Text => {\n  114 |             writeln!(stdout, \"{}\", format_rule_text(rule))?;\n  115 |         }\n  116 |         HelpFormat::Json => {\n  117 |             serde_json::to_writer_pretty(stdout, &Explanation::from_rule(&rule))?;\n  118 |         }\n  119 |     }\n  120 |     Ok(())\n  121 | }\n  122 | \n  123 | /// Explain all rules to the user.\n  124 | pub(crate) fn rules(format: HelpFormat) -> Result<()> {\n  125 |     let mut stdout = BufWriter::new(io::stdout().lock());\n  126 |     match format {\n  127 |         HelpFormat::Text => {\n  128 |             for rule in Rule::iter() {\n  129 |                 writeln!(stdout, \"{}\", format_rule_text(rule))?;\n  130 |                 writeln!(stdout)?;\n  131 |             }\n  132 |         }\n  133 |         HelpFormat::Json => {\n  134 |             let mut serializer = serde_json::Serializer::pretty(stdout);\n  135 |             let mut seq = serializer.serialize_seq(None)?;\n  136 |             for rule in Rule::iter() {\n  137 |                 seq.serialize_element(&Explanation::from_rule(&rule))?;\n  138 |             }\n  139 |             seq.end()?;\n  140 |         }\n  141 |     }\n  142 |     Ok(())","lines":32,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff/src/commands/rule.rs#L111-L142"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"Both `with_context` closures in `format_dev_multi_project` return plain string literals containing `{directory}` and `{project_directory}` placeholders, but no `format!` is involved, so the braces are emitted verbatim. When reading the projects directory fails the user sees `Failed to read projects directory '{directory}'` with no indication of which path failed. (`project_directory` is additionally a `Result` and would not even be printable.)","fix":"Use real formatting:\n```rust\n// before\n.with_context(|| \"Failed to read projects directory '{directory}'\")?\n// after\n.with_context(|| format!(\"Failed to read projects directory '{}'\", directory.display()))?\n```\nand for the inner one:\n```rust\n// before\n.with_context(|| \"Failed to read project directory '{project_directory}'\")?\n// after\n.with_context(|| format!(\"Failed to read a project directory in '{}'\", directory.display()))?\n```","locations":[{"ref":"crates/ruff_dev/src/format_dev.rs:328-338","code":"  328 |     for directory in &args.files {\n  329 |         for project_directory in directory\n  330 |             .read_dir()\n  331 |             .with_context(|| \"Failed to read projects directory '{directory}'\")?\n  332 |         {\n  333 |             project_paths.push(\n  334 |                 project_directory\n  335 |                     .with_context(|| \"Failed to read project directory '{project_directory}'\")?\n  336 |                     .path(),\n  337 |             );\n  338 |         }","lines":11,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_dev/src/format_dev.rs#L328-L338"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`Mode::Write` in the schema/markdown generators reads the existing file with `fs::read_to_string(&path)?` and propagates any error, including `ErrorKind::NotFound`. If the generated artefact does not exist yet (fresh generation, or the file was deleted), `cargo dev generate-all` aborts with a bare `No such file or directory` instead of creating it. `generate_ty_cli_reference` and `generate_ty_env_vars_reference` already handle this correctly by matching on `Err(err) if err.kind() == std::io::ErrorKind::NotFound` and writing the file, so the behaviour is inconsistent across generators that are all driven from the same `generate_all::main`.","fix":"Use the same `match fs::read_to_string(&path)` shape as `generate_ty_cli_reference::main`:\n```rust\nMode::Write => match fs::read_to_string(&schema_path) {\n    Ok(current) if current == schema_string => println!(\"Up-to-date: {filename}\"),\n    Ok(_) | Err(_) if /* NotFound */ true => { /* ... */ }\n};\n```\nconcretely, add an `Err(err) if err.kind() == std::io::ErrorKind::NotFound` arm that prints `Updating: {filename}` and performs the `fs::write`, and only propagate other I/O errors. Consider extracting this write-or-check logic into one shared helper used by all six generators.","locations":[{"ref":"crates/ruff_dev/src/generate_json_schema.rs:39-46","code":"   39 |         Mode::Write => {\n   40 |             let current = fs::read_to_string(&schema_path)?;\n   41 |             if current == schema_string {\n   42 |                 println!(\"Up-to-date: {filename}\");\n   43 |             } else {\n   44 |                 println!(\"Updating: {filename}\");\n   45 |                 fs::write(schema_path, schema_string.as_bytes())?;\n   46 |             }","lines":8,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_dev/src/generate_json_schema.rs#L39-L46"},{"ref":"crates/ruff_dev/src/generate_ty_schema.rs:39-46","code":"   39 |         Mode::Write => {\n   40 |             let current = fs::read_to_string(&schema_path)?;\n   41 |             if current == schema_string {\n   42 |                 println!(\"Up-to-date: {filename}\");\n   43 |             } else {\n   44 |                 println!(\"Updating: {filename}\");\n   45 |                 fs::write(schema_path, schema_string.as_bytes())?;\n   46 |             }","lines":8,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_dev/src/generate_ty_schema.rs#L39-L46"},{"ref":"crates/ruff_dev/src/generate_ty_rules.rs:40-47","code":"   40 |         Mode::Write => {\n   41 |             let current = fs::read_to_string(&schema_path)?;\n   42 |             if current == markdown {\n   43 |                 println!(\"Up-to-date: {filename}\");\n   44 |             } else {\n   45 |                 println!(\"Updating: {filename}\");\n   46 |                 fs::write(schema_path, markdown.as_bytes())?;\n   47 |             }","lines":8,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_dev/src/generate_ty_rules.rs#L40-L47"},{"ref":"crates/ruff_dev/src/generate_ty_options.rs:52-59","code":"   52 |         Mode::Write => {\n   53 |             let current = std::fs::read_to_string(&markdown_path)?;\n   54 |             if current == output {\n   55 |                 println!(\"Up-to-date: {file_name}\");\n   56 |             } else {\n   57 |                 println!(\"Updating: {file_name}\");\n   58 |                 std::fs::write(markdown_path, output.as_bytes())?;\n   59 |             }","lines":8,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_dev/src/generate_ty_options.rs#L52-L59"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"`print_cst::main` discards the `libcst_native` parse error entirely with `Err(_) => bail!(\"Failed to parse CST\")`. The user gets no indication of what is wrong with their file (offset, expected token, etc.), which defeats the purpose of a debugging subcommand whose whole job is to inspect a possibly-broken file.","fix":"Before:\n```rust\n        Err(_) => bail!(\"Failed to parse CST\"),\n```\nAfter:\n```rust\n        Err(err) => bail!(\"Failed to parse CST: {err}\"),\n```\n(`libcst_native::ParserError` implements `Display`; if it does not implement `std::error::Error`, format it with `{err:?}`.)","locations":[{"ref":"crates/ruff_dev/src/print_cst.rs:15-24","code":"   15 | pub(crate) fn main(args: &Args) -> Result<()> {\n   16 |     let contents = fs::read_to_string(&args.file)?;\n   17 |     match libcst_native::parse_module(&contents, None) {\n   18 |         Ok(python_cst) => {\n   19 |             println!(\"{python_cst:#?}\");\n   20 |             Ok(())\n   21 |         }\n   22 |         Err(_) => bail!(\"Failed to parse CST\"),\n   23 |     }\n   24 | }","lines":10,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_dev/src/print_cst.rs#L15-L24"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"In `entrypoint`, the two \"could not find executable\" error messages pass `sys.stderr` as the second *positional* argument to `print` instead of `file=sys.stderr`. The message is therefore written to **stdout** with the repr of the stderr stream appended, e.g. `Could not find ruff baseline executable: ruff <_io.TextIOWrapper name='<stderr>' mode='w' encoding='utf-8'>`. This corrupts the ecosystem tool's machine-readable stdout output.","fix":"Before:\n```python\nprint(\n    f\"Could not find ruff baseline executable: {args.baseline_executable}\",\n    sys.stderr,\n)\n```\nAfter:\n```python\nprint(\n    f\"Could not find ruff baseline executable: {args.baseline_executable}\",\n    file=sys.stderr,\n)\n```\nApply the same change to the `comparison_executable` branch.","locations":[{"ref":"python/ruff-ecosystem/ruff_ecosystem/cli.py:52-57","code":"   52 |         if not baseline_executable:\n   53 |             print(\n   54 |                 f\"Could not find ruff baseline executable: {args.baseline_executable}\",\n   55 |                 sys.stderr,\n   56 |             )\n   57 |             sys.exit(1)","lines":6,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/python/ruff-ecosystem/ruff_ecosystem/cli.py#L52-L57"},{"ref":"python/ruff-ecosystem/ruff_ecosystem/cli.py:67-72","code":"   67 |         if not comparison_executable:\n   68 |             print(\n   69 |                 f\"Could not find ruff comparison executable: {args.comparison_executable}\",\n   70 |                 sys.stderr,\n   71 |             )\n   72 |             sys.exit(1)","lines":6,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/python/ruff-ecosystem/ruff_ecosystem/cli.py#L67-L72"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"negligible","difficulty":"very_easy","description":"Inside `render_diff`, the `ChangeTag::Insert` arm uses `.unwrap()` on the `write!` result while every other write in the same function propagates the error with `?`. If the sink ever fails (the parameter is a `&mut dyn std::fmt::Write`, not a `String`), this arm panics instead of returning `Err`.","fix":"Before:\n\n```rust\nChangeTag::Insert => {\n    write!(f, \"{}{}\", \"+\".green(), value.green()).unwrap();\n}\n```\n\nAfter:\n\n```rust\nChangeTag::Insert => {\n    write!(f, \"{}{}\", \"+\".green(), value.green())?;\n}\n```","locations":[{"ref":"crates/mdtest/src/lib.rs:489-497","code":"  489 |             match change.tag() {\n  490 |                 ChangeTag::Equal => write!(f, \" {value}\")?,\n  491 |                 ChangeTag::Delete => {\n  492 |                     write!(f, \"{}{}\", \"-\".red(), value.red())?;\n  493 |                 }\n  494 |                 ChangeTag::Insert => {\n  495 |                     write!(f, \"{}{}\", \"+\".green(), value.green()).unwrap();\n  496 |                 }\n  497 |             }","lines":9,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/mdtest/src/lib.rs#L489-L497"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"`generate_docs::main` computes the output path as an absolute path rooted at `ROOT_DIR` (`PathBuf::from(ROOT_DIR).join(\"docs\").join(\"rules\")...`) but creates the parent directory with a **relative** path: `fs::create_dir_all(\"docs/rules\")`. `docs/rules` is not checked into the repository (it is produced by `scripts/generate_mkdocs.py`), so when `cargo dev generate-docs` is run from any directory other than the workspace root — which is normal for `cargo` subcommands — the call creates a stray `./docs/rules` next to the caller's cwd and then `fs::write(filename, output)` fails with `NotFound` because `<repo>/docs/rules` was never created.","fix":"Create the directory using the same `ROOT_DIR`-anchored path. Before:\n```rust\nfs::create_dir_all(\"docs/rules\")?;\nfs::write(filename, output)?;\n```\nAfter:\n```rust\nfs::create_dir_all(PathBuf::from(ROOT_DIR).join(\"docs\").join(\"rules\"))?;\nfs::write(filename, output)?;\n```","locations":[{"ref":"crates/ruff_dev/src/generate_docs.rs:149-160","code":"  149 |             let filename = PathBuf::from(ROOT_DIR)\n  150 |                 .join(\"docs\")\n  151 |                 .join(\"rules\")\n  152 |                 .join(&*rule.name())\n  153 |                 .with_extension(\"md\");\n  154 | \n  155 |             if args.dry_run {\n  156 |                 println!(\"{output}\");\n  157 |             } else {\n  158 |                 fs::create_dir_all(\"docs/rules\")?;\n  159 |                 fs::write(filename, output)?;\n  160 |             }","lines":12,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_dev/src/generate_docs.rs#L149-L160"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"negligible","difficulty":"very_easy","description":"`--format-comparison` declares `choices=[option.value for option in FormatComparison]` (a list of strings) but `default=FormatComparison.ruff_and_ruff` (an `Enum` member, and `FormatComparison` is a plain `Enum`, not a `str` `Enum`). The default is inconsistent with the declared `choices` type and is rendered as `FormatComparison.ruff_and_ruff` in `--help` output; it only works because `argparse` skips `choices` validation for non-string defaults and `FormatComparison(member)` is idempotent.","fix":"Before:\n```python\ndefault=FormatComparison.ruff_and_ruff,\n```\nAfter:\n```python\ndefault=FormatComparison.ruff_and_ruff.value,\n```","locations":[{"ref":"python/ruff-ecosystem/ruff_ecosystem/cli.py:154-159","code":"  154 |     parser.add_argument(\n  155 |         \"--format-comparison\",\n  156 |         choices=[option.value for option in FormatComparison],\n  157 |         default=FormatComparison.ruff_and_ruff,\n  158 |         help=\"Type of comparison to make when checking formatting.\",\n  159 |     )","lines":6,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/python/ruff-ecosystem/ruff_ecosystem/cli.py#L154-L159"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`check_imports` is invoked whenever *any* import-source rule is enabled (`crates/ruff_linter/src/linter.rs:216-222`), but it unconditionally runs a full `BlockBuilder` traversal of the module suite and then materialises `Vec<&Block>`, even when only `MissingRequiredImport` (`I002`) is selected. `I002` uses `parsed`/`locator`/`stylist` only and never touches `blocks`, so for an `I002`-only configuration every file pays an extra whole-AST walk plus an allocation. The `Vec` collection is also unnecessary even in the `I001` case, since `tracker.iter()` can be iterated directly.","fix":"Guard the block extraction on the rule that consumes it and iterate the tracker directly:\n```rust\nif context.is_rule_enabled(Rule::UnsortedImports) {\n    let mut tracker = BlockBuilder::new(locator, directives, source_type.is_stub(), cell_offsets);\n    tracker.visit_body(parsed.suite());\n    for block in tracker.iter() {\n        if !block.imports.is_empty() {\n            isort::rules::organize_imports(/* ... */);\n        }\n    }\n}\n```","locations":[{"ref":"crates/ruff_linter/src/checkers/imports.rs:34-62","code":"   34 |     // Extract all import blocks from the AST.\n   35 |     let tracker = {\n   36 |         let mut tracker =\n   37 |             BlockBuilder::new(locator, directives, source_type.is_stub(), cell_offsets);\n   38 |         tracker.visit_body(parsed.suite());\n   39 |         tracker\n   40 |     };\n   41 | \n   42 |     let blocks: Vec<&Block> = tracker.iter().collect();\n   43 | \n   44 |     // Enforce import rules.\n   45 |     if context.is_rule_enabled(Rule::UnsortedImports) {\n   46 |         for block in &blocks {\n   47 |             if !block.imports.is_empty() {\n   48 |                 isort::rules::organize_imports(\n   49 |                     block,\n   50 |                     locator,\n   51 |                     stylist,\n   52 |                     indexer,\n   53 |                     settings,\n   54 |                     package,\n   55 |                     source_type,\n   56 |                     parsed.tokens(),\n   57 |                     target_version,\n   58 |                     context,\n   59 |                 );\n   60 |             }\n   61 |         }\n   62 |     }","lines":29,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/checkers/imports.rs#L34-L62"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`function_uses_loop_variable` (B023) does membership testing against `Vec`s with linear scans: `reassigned_in_loop.contains(&name.id.as_str())` is executed once per suspicious variable, and `visitor.stored.iter().any(|stored| stored.id == loaded.id)` once per loaded name inside `SuspiciousVariablesVisitor`. Both are O(n*m) over names collected from the whole loop body, for every `for`/`while` statement in the file.","fix":"Collect into hash sets instead of vectors, e.g. make `AssignedNamesVisitor::names` an `FxHashSet<&'a str>` (or build `let reassigned_in_loop: FxHashSet<&str> = visitor.names.into_iter().collect();` before the loop over `suspicious_variables`), and similarly store `LoadedNamesVisitor::stored` names in an `FxHashSet<&str>` keyed by identifier.","locations":[{"ref":"crates/ruff_linter/src/rules/flake8_bugbear/rules/function_uses_loop_variable.rs:97-109","code":"   97 |                 // Treat any non-arguments as \"suspicious\".\n   98 |                 self.names\n   99 |                     .extend(visitor.loaded.into_iter().filter(|loaded| {\n  100 |                         if visitor.stored.iter().any(|stored| stored.id == loaded.id) {\n  101 |                             return false;\n  102 |                         }\n  103 | \n  104 |                         if parameters.includes(&loaded.id) {\n  105 |                             return false;\n  106 |                         }\n  107 | \n  108 |                         true\n  109 |                     }));","lines":13,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/flake8_bugbear/rules/function_uses_loop_variable.rs#L97-L109"},{"ref":"crates/ruff_linter/src/rules/flake8_bugbear/rules/function_uses_loop_variable.rs:297-321","code":"  297 |     if !suspicious_variables.is_empty() {\n  298 |         // Identify any variables that are assigned in the loop (ignoring functions).\n  299 |         let reassigned_in_loop = {\n  300 |             let mut visitor = AssignedNamesVisitor::default();\n  301 |             match node {\n  302 |                 Node::Stmt(stmt) => visitor.visit_stmt(stmt),\n  303 |                 Node::Expr(expr) => visitor.visit_expr(expr),\n  304 |             }\n  305 |             visitor.names\n  306 |         };\n  307 | \n  308 |         // If a variable was used in a function or lambda body, and assigned in the\n  309 |         // loop, flag it.\n  310 |         for name in suspicious_variables {\n  311 |             if reassigned_in_loop.contains(&name.id.as_str()) {\n  312 |                 if checker.insert_flake8_bugbear_range(name.range()) {\n  313 |                     checker.report_diagnostic(\n  314 |                         FunctionUsesLoopVariable {\n  315 |                             name: name.id.to_string(),\n  316 |                         },\n  317 |                         name.range(),\n  318 |                     );\n  319 |                 }\n  320 |             }\n  321 |         }","lines":25,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/flake8_bugbear/rules/function_uses_loop_variable.rs#L297-L321"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"In `mutable_argument_default` (B006), the `extend_immutable_calls` vector is built *inside* the `for parameter in ...` loop, so the user-configured dotted names are re-split and re-collected into a fresh `Vec<QualifiedName>` for every parameter that has a default. The value does not depend on the parameter. The sibling rule `function_call_in_argument_default` (B008) correctly hoists the identical computation out of its loop.","fix":"Move the binding above the loop:\n```rust\nlet extend_immutable_calls: Vec<QualifiedName> = checker\n    .settings()\n    .flake8_bugbear\n    .extend_immutable_calls\n    .iter()\n    .map(|target| QualifiedName::from_dotted_name(target))\n    .collect();\n\nfor parameter in function_def.parameters.iter_non_variadic_params() {\n    let Some(default) = parameter.default() else { continue; };\n    ...\n}\n```","locations":[{"ref":"crates/ruff_linter/src/rules/flake8_bugbear/rules/mutable_argument_default.rs:106-122","code":"  106 |     for parameter in function_def.parameters.iter_non_variadic_params() {\n  107 |         let Some(default) = parameter.default() else {\n  108 |             continue;\n  109 |         };\n  110 | \n  111 |         let extend_immutable_calls: Vec<QualifiedName> = checker\n  112 |             .settings()\n  113 |             .flake8_bugbear\n  114 |             .extend_immutable_calls\n  115 |             .iter()\n  116 |             .map(|target| QualifiedName::from_dotted_name(target))\n  117 |             .collect();\n  118 |         let is_mut_expr = if is_b006_check_guaranteed_mutable_expr_enabled(checker.settings()) {\n  119 |             is_guaranteed_mutable_expr(default, checker.semantic())\n  120 |         } else {\n  121 |             is_mutable_expr(default, checker.semantic())\n  122 |         };","lines":17,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/flake8_bugbear/rules/mutable_argument_default.rs#L106-L122"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`unused_loop_control_variable` re-walks the whole loop body via `helpers::uses_magic_variable_access(&stmt_for.body, ...)` once **per unused control name**, even though the result does not depend on `name`. For a loop such as `for a, b, c, d in xs:` with a large body, the body is traversed up to four extra times.","fix":"Hoist the computation above the `for (name, expr) in control_names` loop. Before (inside the loop):\n```rust\nlet certainty = if helpers::uses_magic_variable_access(&stmt_for.body, |id| {\n    checker.semantic().has_builtin_binding(id)\n}) {\n```\nAfter (compute once, before the loop):\n```rust\nlet certainty = if helpers::uses_magic_variable_access(&stmt_for.body, |id| {\n    checker.semantic().has_builtin_binding(id)\n}) {\n    Certainty::Uncertain\n} else {\n    Certainty::Certain\n};\n```\nand reuse `certainty` inside the loop.","locations":[{"ref":"crates/ruff_linter/src/rules/flake8_bugbear/rules/unused_loop_control_variable.rs:115-122","code":"  115 |         // Avoid fixing any variables that _may_ be used, but undetectably so.\n  116 |         let certainty = if helpers::uses_magic_variable_access(&stmt_for.body, |id| {\n  117 |             checker.semantic().has_builtin_binding(id)\n  118 |         }) {\n  119 |             Certainty::Uncertain\n  120 |         } else {\n  121 |             Certainty::Certain\n  122 |         };","lines":8,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/flake8_bugbear/rules/unused_loop_control_variable.rs#L115-L122"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"`show_settings` collects every resolved file into a `Vec`, sorts it with `sorted_unstable`, and then takes only the first element. That is an unnecessary allocation plus an O(n log n) sort where an O(n) `min()` suffices; on a large repository `ruff check --show-settings` walks and sorts the entire file list to print settings for one path.","fix":"Before:\n\n```rust\nlet Some(path) = paths\n    .into_iter()\n    .flatten()\n    .map(ResolvedFile::into_path)\n    .sorted_unstable()\n    .next()\nelse {\n```\n\nAfter:\n\n```rust\nlet Some(path) = paths\n    .into_iter()\n    .flatten()\n    .map(ResolvedFile::into_path)\n    .min()\nelse {\n```","locations":[{"ref":"crates/ruff/src/commands/show_settings.rs:22-30","code":"   22 |     let Some(path) = paths\n   23 |         .into_iter()\n   24 |         .flatten()\n   25 |         .map(ResolvedFile::into_path)\n   26 |         .sorted_unstable()\n   27 |         .next()\n   28 |     else {\n   29 |         bail!(\"No files found under the given path\");\n   30 |     };","lines":9,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff/src/commands/show_settings.rs#L22-L30"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"`process_documentation` is called once per rule that has an explanation (~1000 rules) and recompiles two non-trivial regexes on every call: the link-rewriting hack at the top and `r\"\\[`([^`]*?)`]\\[(.*?)]\"` near the bottom. `generate_ty_rules::generate_markdown` demonstrates the intended pattern by hoisting `rule_link_re` out of its loop.","fix":"Hoist both into `static`s. Before:\n```rust\nlet documentation = Regex::new(r\"\\[`([^`]*?)`]($|[^\\[(])\").unwrap().replace_all(\n```\nAfter:\n```rust\nstatic LINK_HACK_RE: LazyLock<Regex> =\n    LazyLock::new(|| Regex::new(r\"\\[`([^`]*?)`]($|[^\\[(])\").unwrap());\nlet documentation = LINK_HACK_RE.replace_all(\n```\nand likewise for `let re = Regex::new(r\"\\[`([^`]*?)`]\\[(.*?)]\").unwrap();` (add `use std::sync::LazyLock;` at the top of the file).","locations":[{"ref":"crates/ruff_dev/src/generate_docs.rs:175-184","code":"  175 |     let documentation = Regex::new(r\"\\[`([^`]*?)`]($|[^\\[(])\").unwrap().replace_all(\n  176 |         documentation,\n  177 |         |caps: &Captures| {\n  178 |             format!(\n  179 |                 \"[`{option}`][{option}]{sep}\",\n  180 |                 option = &caps[1],\n  181 |                 sep = &caps[2]\n  182 |             )\n  183 |         },\n  184 |     );","lines":10,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_dev/src/generate_docs.rs#L175-L184"},{"ref":"crates/ruff_dev/src/generate_docs.rs:217-218","code":"  217 |     let re = Regex::new(r\"\\[`([^`]*?)`]\\[(.*?)]\").unwrap();\n  218 |     for (_, [option, _]) in re.captures_iter(&documentation).map(|c| c.extract()) {","lines":2,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_dev/src/generate_docs.rs#L217-L218"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"In `unresolved_references`, the `UndefinedLocalWithImportStarUsage` violation (including a `String` allocated by `reference.name(checker.source()).to_string()`) is constructed eagerly and then passed by value to `report_diagnostic_if_enabled`, which discards it when `F405` is disabled. The function's early-return only checks that *either* `F405` or `F821` is enabled, so a file that enables only `F821` and contains a wildcard import will allocate a `String` for every unresolved reference and throw it away. The neighbouring `F821` branch guards with `checker.is_rule_enabled(Rule::UndefinedName)` before doing any work.","fix":"Guard the branch explicitly. Before:\n\n```rust\nif reference.is_wildcard_import() {\n    // F405\n    checker.report_diagnostic_if_enabled(\n        pyflakes::rules::UndefinedLocalWithImportStarUsage {\n            name: reference.name(checker.source()).to_string(),\n        },\n        reference.range(),\n    );\n}\n```\n\nAfter:\n\n```rust\nif reference.is_wildcard_import() {\n    // F405\n    if checker.is_rule_enabled(Rule::UndefinedLocalWithImportStarUsage) {\n        checker.report_diagnostic(\n            pyflakes::rules::UndefinedLocalWithImportStarUsage {\n                name: reference.name(checker.source()).to_string(),\n            },\n            reference.range(),\n        );\n    }\n}\n```","locations":[{"ref":"crates/ruff_linter/src/checkers/ast/analyze/unresolved_references.rs:15-22","code":"   15 |         if reference.is_wildcard_import() {\n   16 |             // F405\n   17 |             checker.report_diagnostic_if_enabled(\n   18 |                 pyflakes::rules::UndefinedLocalWithImportStarUsage {\n   19 |                     name: reference.name(checker.source()).to_string(),\n   20 |                 },\n   21 |                 reference.range(),\n   22 |             );","lines":8,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/checkers/ast/analyze/unresolved_references.rs#L15-L22"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"medium","difficulty":"easy","description":"The `Expr::Tuple`/`Expr::List` arm still calls `pyflakes::rules::starred_expressions` to implement `Rule::ExpressionsInStarAssignment` (`F621`), but that function can no longer report anything. When `F622` was moved into the parser as a semantic syntax error (commit `e6073d0cca`), the loop that computed `starred_index` was deleted and replaced with `let starred_index: Option<usize> = None;`, so the `if let Some(starred_index) = starred_index` branch is unreachable and `ExpressionsInStarAssignment` is never constructed. Verified with a debug build: a 300-element star assignment (`x0, ..., x299, *a = range(400)`) produces no `F621` diagnostic under `--select F621`. The whole call from `analyze::expression` is now dead work executed for every tuple/list store target.","fix":"Restore the computation of `starred_index` in `starred_expressions`:\n\n```rust\nlet mut starred_index: Option<usize> = None;\nfor (index, elt) in elts.iter().enumerate() {\n    if elt.is_starred_expr() {\n        starred_index = Some(index);\n    }\n}\n```\n\n(keeping the existing `check_too_many_expressions` guard), or, if `F621` is intentionally retired, delete `starred_expressions`, the `ExpressionsInStarAssignment` violation, and the `if ctx.is_store() { ... }` block in `analyze::expression`.","locations":[{"ref":"crates/ruff_linter/src/checkers/ast/analyze/expression.rs:223-232","code":"  223 |             if ctx.is_store() {\n  224 |                 let check_too_many_expressions =\n  225 |                     checker.is_rule_enabled(Rule::ExpressionsInStarAssignment);\n  226 |                 pyflakes::rules::starred_expressions(\n  227 |                     checker,\n  228 |                     elts,\n  229 |                     check_too_many_expressions,\n  230 |                     expr.range(),\n  231 |                 );\n  232 |             }","lines":10,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/checkers/ast/analyze/expression.rs#L223-L232"},{"ref":"crates/ruff_linter/src/rules/pyflakes/rules/starred_expressions.rs:60-74","code":"   60 | pub(crate) fn starred_expressions(\n   61 |     checker: &Checker,\n   62 |     elts: &[Expr],\n   63 |     check_too_many_expressions: bool,\n   64 |     location: TextRange,\n   65 | ) {\n   66 |     let starred_index: Option<usize> = None;\n   67 |     if check_too_many_expressions {\n   68 |         if let Some(starred_index) = starred_index {\n   69 |             if starred_index >= 1 << 8 || elts.len() - starred_index > 1 << 24 {\n   70 |                 checker.report_diagnostic(ExpressionsInStarAssignment, location);\n   71 |             }\n   72 |         }\n   73 |     }\n   74 | }","lines":15,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/pyflakes/rules/starred_expressions.rs#L60-L74"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"In `generate_options::emit_field` the branch `if parents.is_empty() { \"####\" }` is unreachable: `generate_set` always executes `parents.push(set)` before iterating the fields and calling `emit_field(output, name, field, parents.as_slice())`, so `parents` contains at least the `Set::Toplevel` entry. `header_level` is therefore always `\"#####\"`. The visible consequence is that the top-level options in the generated `docs/settings.md` are emitted as `#####` headings directly underneath the `### Top-level` heading, skipping the `####` level entirely (whereas nested options such as `lint.isort.*` correctly sit at `#####` under their `####` group heading).","fix":"The condition was almost certainly meant to test whether the field has any *named* parents. Compute `parents_anchor` first and key the level off it:\n```rust\nlet parents_anchor = parents.iter().filter_map(|parent| parent.name()).join(\"_\");\nlet header_level = if parents_anchor.is_empty() { \"####\" } else { \"#####\" };\n```\n(If the current `#####`-for-everything output is intentional, drop the dead branch and just use `let header_level = \"#####\";`.)","locations":[{"ref":"crates/ruff_dev/src/generate_options.rs:96-101","code":"   96 | fn emit_field(output: &mut String, name: &str, field: &OptionField, parents: &[Set]) {\n   97 |     let header_level = if parents.is_empty() { \"####\" } else { \"#####\" };\n   98 |     let parents_anchor = parents.iter().filter_map(|parent| parent.name()).join(\"_\");\n   99 | \n  100 |     if parents_anchor.is_empty() {\n  101 |         let _ = writeln!(output, \"{header_level} [`{name}`](#{name}) {{: #{name} }}\");","lines":6,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_dev/src/generate_options.rs#L96-L101"},{"ref":"crates/ruff_dev/src/generate_options.rs:52-58","code":"   52 |     parents.push(set);\n   53 | \n   54 |     // Generate the fields.\n   55 |     for (name, field) in &fields {\n   56 |         emit_field(output, name, field, parents.as_slice());\n   57 |         output.push_str(\"---\\n\\n\");\n   58 |     }","lines":7,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_dev/src/generate_options.rs#L52-L58"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`enforce_stubs` is computed from `Rule::DocstringInStub` and used only to decide whether `definitions()` should early-return, but no rule in the loop body ever runs `flake8_pyi::rules::docstring_in_stubs` — that rule is dispatched from `crates/ruff_linter/src/checkers/ast/analyze/suite.rs:13-15`. Consequently, when `PYI021` is the only rule from this set enabled on a `.pyi` file, `definitions()` resolves every `Definition` (`checker.semantic.definitions.resolve(...)`) and extracts a docstring for each one, then does nothing with any of it.","fix":"Delete the binding and its use in the guard:\n\n```rust\n// remove\nlet enforce_stubs =\n    checker.source_type.is_stub() && checker.is_rule_enabled(Rule::DocstringInStub);\n```\n\nand change the guard from\n\n```rust\nif !enforce_annotations\n    && !enforce_docstrings\n    && !enforce_stubs\n    && !enforce_stubs_and_runtime\n```\n\nto\n\n```rust\nif !enforce_annotations\n    && !enforce_docstrings\n    && !enforce_stubs_and_runtime\n```","locations":[{"ref":"crates/ruff_linter/src/checkers/ast/analyze/definitions.rs:31-32","code":"   31 |     let enforce_stubs =\n   32 |         checker.source_type.is_stub() && checker.is_rule_enabled(Rule::DocstringInStub);","lines":2,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/checkers/ast/analyze/definitions.rs#L31-L32"},{"ref":"crates/ruff_linter/src/checkers/ast/analyze/definitions.rs:95-103","code":"   95 |     if !enforce_annotations\n   96 |         && !enforce_docstrings\n   97 |         && !enforce_stubs\n   98 |         && !enforce_stubs_and_runtime\n   99 |         && !enforce_dunder_method\n  100 |         && !enforce_pydoclint\n  101 |     {\n  102 |         return;\n  103 |     }","lines":9,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/checkers/ast/analyze/definitions.rs#L95-L103"}]},
{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`DocLines` carries a `prev: TextSize` field that is initialised in `DocLines::new` and re-assigned on every token in `next()` (`self.prev = token.end();`), but is never read anywhere. `grep -rn \"\\\\.prev\" crates/ruff_linter/src/doc_lines.rs` shows the single assignment and no reads. It is a leftover from an earlier implementation and costs a store per token in a per-file token walk.","fix":"Delete the field, its initialisation, and the assignment.\n\nBefore:\n```rust\npub(crate) struct DocLines<'a> {\n    inner: Iter<'a, Token>,\n    prev: TextSize,\n}\n```\nAfter:\n```rust\npub(crate) struct DocLines<'a> {\n    inner: Iter<'a, Token>,\n}\n```\nand remove `prev: TextSize::default(),` from `new()` plus the `self.prev = token.end();` line at the bottom of the loop in `next()`.","locations":[{"ref":"crates/ruff_linter/src/doc_lines.rs:20-32","code":"   20 | pub(crate) struct DocLines<'a> {\n   21 |     inner: Iter<'a, Token>,\n   22 |     prev: TextSize,\n   23 | }\n   24 | \n   25 | impl<'a> DocLines<'a> {\n   26 |     fn new(tokens: &'a Tokens) -> Self {\n   27 |         Self {\n   28 |             inner: tokens.iter(),\n   29 |             prev: TextSize::default(),\n   30 |         }\n   31 |     }\n   32 | }","lines":13,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/doc_lines.rs#L20-L32"},{"ref":"crates/ruff_linter/src/doc_lines.rs:59","code":"   59 |             self.prev = token.end();","lines":1,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/doc_lines.rs#L59"}]},
{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"In `is_docstring_section`, the block guarded by `!next_line_is_underline` can never see `next_line_is_underline == true`: the function already did `if next_line_is_underline { return true; }` earlier, so the negation is a constant `true`. Worse, the inner `if section_kind.as_str() != verbatim` is also constant: the outer guard requires `verbatim` to start with a lowercase character, while `SectionKind::as_str()` always starts with an uppercase letter, so the two can never be equal. The whole block therefore reduces to \"if `verbatim` starts lowercase, return false\", which makes the accompanying comment about underlines actively misleading.","fix":"Collapse the redundant conditions and drop the stale underline reference from the comment:\n\nBefore:\n```rust\nif !next_line_is_underline && verbatim.chars().next().is_some_and(char::is_lowercase) {\n    if section_kind.as_str() != verbatim {\n        return false;\n    }\n}\n```\nAfter:\n```rust\n// A section name that is not title-cased is treated as a subsection.\nif verbatim.chars().next().is_some_and(char::is_lowercase) {\n    return false;\n}\n```","locations":[{"ref":"crates/ruff_linter/src/docstrings/sections.rs:464-475","code":"  464 |     // Determine whether the next line is an underline, e.g., \"-----\".\n  465 |     let next_line_is_underline = next_line.is_some_and(|next_line| {\n  466 |         let next_line = next_line.trim();\n  467 |         if next_line.is_empty() {\n  468 |             false\n  469 |         } else {\n  470 |             next_line.chars().all(|char| matches!(char, '-' | '='))\n  471 |         }\n  472 |     });\n  473 |     if next_line_is_underline {\n  474 |         return true;\n  475 |     }","lines":12,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/docstrings/sections.rs#L464-L475"},{"ref":"crates/ruff_linter/src/docstrings/sections.rs:557-573","code":"  557 |         // If the section isn't underlined, and isn't title-cased, assume it's a subsection,\n  558 |         // as in:\n  559 |         // ```python\n  560 |         // def func(parameters: tuple[int]):\n  561 |         //     \"\"\"Toggle the gizmo.\n  562 |         //\n  563 |         //     Parameters:\n  564 |         //     -----\n  565 |         //     parameters:\n  566 |         //         The arguments to the function.\n  567 |         //     \"\"\"\n  568 |         // ```\n  569 |         if !next_line_is_underline && verbatim.chars().next().is_some_and(char::is_lowercase) {\n  570 |             if section_kind.as_str() != verbatim {\n  571 |                 return false;\n  572 |             }\n  573 |         }","lines":17,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/docstrings/sections.rs#L557-L573"}]},
{"id":"DEAD_6","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"In `definition` (flake8-annotations), the magic-method branch maps the string returned by `simple_magic_return_type` back to a `PythonType` and bails out with a bare `return` on an unrecognised string:\n```rust\nlet python_type = match return_type_str {\n    \"str\" => PythonType::String,\n    ...\n    \"None\" => PythonType::None,\n    _ => return, // Unknown type, skip\n};\n```\n`simple_magic_return_type` can only ever return `\"str\" | \"bytes\" | \"int\" | \"float\" | \"complex\" | \"bool\" | \"None\"`, so the arm is unreachable dead code. It is also a landmine: unlike every other bail-out in this function it `return`s from `definition` entirely, which skips the final `ignore_fully_untyped` check and would leak all previously collected `DiagnosticGuard`s (they emit on drop rather than being defused). Adding a single new mapping in `ruff_python_stdlib::typing::simple_magic_return_type` would silently break the `lint.flake8-annotations.ignore-fully-untyped` option.","fix":"Replace the bare `_ => return` with a `_ => None` that skips only the fix, keeping the diagnostic and the trailing `ignore_fully_untyped` handling intact, e.g.:\n```rust\nlet python_type = match return_type_str {\n    \"str\" => Some(PythonType::String),\n    // ...\n    \"None\" => Some(PythonType::None),\n    _ => None,\n};\n\nif let Some(python_type) = python_type\n    && let Some((expr, edits)) = type_expr(python_type, checker, function.parameters.start())\n{\n    // ... set_fix\n}\n```","locations":[{"ref":"crates/ruff_linter/src/rules/flake8_annotations/rules/definition.rs:856-883","code":"  856 |                 if let Some(return_type_str) = return_type {\n  857 |                     // Convert the simple return type to a proper expression that handles shadowed builtins\n  858 |                     let python_type = match return_type_str {\n  859 |                         \"str\" => PythonType::String,\n  860 |                         \"bytes\" => PythonType::Bytes,\n  861 |                         \"int\" => PythonType::Number(NumberLike::Integer),\n  862 |                         \"float\" => PythonType::Number(NumberLike::Float),\n  863 |                         \"complex\" => PythonType::Number(NumberLike::Complex),\n  864 |                         \"bool\" => PythonType::Number(NumberLike::Bool),\n  865 |                         \"None\" => PythonType::None,\n  866 |                         _ => return, // Unknown type, skip\n  867 |                     };\n  868 | \n  869 |                     if let Some((expr, edits)) =\n  870 |                         type_expr(python_type, checker, function.parameters.start())\n  871 |                     {\n  872 |                         let return_type_expr = checker.generator().expr(&expr);\n  873 |                         diagnostic.set_fix(Fix::unsafe_edits(\n  874 |                             Edit::insertion(\n  875 |                                 format!(\" -> {return_type_expr}\"),\n  876 |                                 function.parameters.end(),\n  877 |                             ),\n  878 |                             edits,\n  879 |                         ));\n  880 |                     }\n  881 |                 }\n  882 |                 diagnostics.push(diagnostic);\n  883 |             }","lines":28,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/flake8_annotations/rules/definition.rs#L856-L883"},{"ref":"crates/ruff_linter/src/rules/flake8_annotations/rules/definition.rs:960-978","code":"  960 |     // If settings say so, don't report any of the\n  961 |     // diagnostics gathered here if there were no type annotations at all.\n  962 |     let diagnostics_enabled = !checker.settings().flake8_annotations.ignore_fully_untyped\n  963 |         || has_any_typed_arg\n  964 |         || has_typed_return\n  965 |         || (is_method\n  966 |             && !visibility::is_staticmethod(decorator_list, checker.semantic())\n  967 |             && parameters\n  968 |                 .posonlyargs\n  969 |                 .first()\n  970 |                 .or_else(|| parameters.args.first())\n  971 |                 .is_some_and(|first_param| first_param.annotation().is_some()));\n  972 | \n  973 |     if !diagnostics_enabled {\n  974 |         for diagnostic in diagnostics {\n  975 |             diagnostic.defuse();\n  976 |         }\n  977 |     }\n  978 | }","lines":19,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/flake8_annotations/rules/definition.rs#L960-L978"}]},
{"id":"DEAD_7","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`async_zero_sleep` (ASYNC115) resolves the callee's qualified name and derives the `AsyncModule` twice. Lines 82-98 already resolve the name, obtain `module`, and `return` for `AsyncModule::AsyncIo`; lines 113-127 then repeat `resolve_qualified_name` and `AsyncModule::try_from` and compute\n```rust\nlet is_relevant_module = matches!(module, AsyncModule::Trio | AsyncModule::AnyIo);\n```\nwhich is unconditionally `true` at that point because the `AsyncIo` case has already returned. The second `resolve_qualified_name` call is also wasted work on every zero-valued `trio`/`anyio` call.","fix":"Before:\n```rust\n    let Some(qualified_name) = checker\n        .semantic()\n        .resolve_qualified_name(call.func.as_ref())\n    else {\n        return;\n    };\n\n    if let Some(module) = AsyncModule::try_from(&qualified_name) {\n        let is_relevant_module = matches!(module, AsyncModule::Trio | AsyncModule::AnyIo);\n\n        let is_sleep = is_relevant_module && matches!(qualified_name.segments(), [_, \"sleep\"]);\n\n        if !is_sleep {\n            return;\n        }\n\n        let mut diagnostic = checker.report_diagnostic(AsyncZeroSleep { module }, call.range());\n```\nAfter (reusing the `qualified_name` and `module` already bound above, and de-indenting the rest of the function):\n```rust\n    if !matches!(qualified_name.segments(), [_, \"sleep\"]) {\n        return;\n    }\n\n    let mut diagnostic = checker.report_diagnostic(AsyncZeroSleep { module }, call.range());\n```","locations":[{"ref":"crates/ruff_linter/src/rules/flake8_async/rules/async_zero_sleep.rs:114-130","code":"  114 |     let Some(qualified_name) = checker\n  115 |         .semantic()\n  116 |         .resolve_qualified_name(call.func.as_ref())\n  117 |     else {\n  118 |         return;\n  119 |     };\n  120 | \n  121 |     if let Some(module) = AsyncModule::try_from(&qualified_name) {\n  122 |         let is_relevant_module = matches!(module, AsyncModule::Trio | AsyncModule::AnyIo);\n  123 | \n  124 |         let is_sleep = is_relevant_module && matches!(qualified_name.segments(), [_, \"sleep\"]);\n  125 | \n  126 |         if !is_sleep {\n  127 |             return;\n  128 |         }\n  129 | \n  130 |         let mut diagnostic = checker.report_diagnostic(AsyncZeroSleep { module }, call.range());","lines":17,"link":"https://github.com/astral-sh/ruff/blob/77dbb7e013a625e3016883b8d00f92fae0c82486/crates/ruff_linter/src/rules/flake8_async/rules/async_zero_sleep.rs#L114-L130"}]},
{"id":"DEAD_8","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`long_sleep_not_forever` (ASYNC116) has the same redundant double resolution as ASYNC115: `resolve_qualified_name` and `AsyncModule::try_from` are called at lines 75-91 (with an early `return` for `AsyncModule::AsyncIo`) and then again at lines 118-131, where `is_relevant_module` is always `true` and therefore dead.","fix":"Before:\n```rust\n    let Some(qualified_name) = checker\n        .semantic()\n        .resolve_qualified_name(call.func.as_ref())\n    else {\n        return;\n    };\n\n    let Some(module) = AsyncModule::try_from(&qualified_name) else {\n        return;\n    };\n\n    let is_relevant_module = matches!(module, AsyncModule::AnyIo | AsyncModule::Trio);\n\n    let is_sleep = is_relevant_module && matches!(qualified_name.segments(), [_, \"sleep\"]);\n\n    if !is_sleep {\n        return;\n    }\n```\nAfter (reusing the `qualified_name`/`module` bound earlier in the function):\n```rust\n    if !matches!(qualified_name.segments(), [_, \"sleep\"]) {\n        return;\n    }\n```","locations":[{"ref":"crates/ruff_linter/src/rules/flake8_async/rules/long_sleep_not_forever.rs:119-138","code":"  119 |     let Some(qualified_name) = checker\n  120 |         .semantic()\n  121 |         .resolve_qualified_name(call.func.as_ref())\n  122 |     else {\n  123 |         return;\n  124 |     };\n  125 | \n  126 |     let Some(module) = AsyncModule::try_from(&qualified_name) else {\n  127 |         return;\n  128 |     };\n  129 | \n  130 |     let is_relevant_module = matches!(module, AsyncModule::AnyIo | AsyncModule::Trio);\n  131 | \n  132 |     let is_sleep = is_relevant_module && matches!(qualified_name.segments(), [_, \"sleep\"]);\n  133 | \n  134 |     if !is_sleep {\n  135 |         return;\n  136 |     }\n  137 | \n  138 |     let mut diagnostic = checker.report_diagnostic(LongSleepNotForever { module }, call.range());","lines":20,"link":"ht
