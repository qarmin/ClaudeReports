<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"watch_rc() passes rc straight into classify_ec(), but classify_ec() raises ValueError for any code outside {0, 1, 2, 3..99, 100..127, 128..255}. The runner emits rc=-1 on a launch exception (runner.py:63), and asyncio's process.wait() returns a NEGATIVE returncode when the subprocess is killed by a signal. On a normal quit while borg is still running, app.action_quit -> runner.stop() calls process.terminate() (SIGTERM), so start() observes returncode -15 and emits process_finished with rc=-15. watch_rc(-15) then calls classify_ec(-15), which raises ValueError inside the Textual reactive watcher, surfacing an unhandled-exception error in the TUI on a routine quit-during-backup. Same crash for rc=-1.","fix":"Sanitize rc before classification: in watch_rc, guard with try/except around classify_ec, or normalize negative/out-of-range codes (e.g. map a negative signal returncode -n to 128+n, and treat -1/launch errors as the error class). Alternatively have the runner translate negative returncodes to the borg signal-base convention before emitting process_finished.","locations":[{"ref":"src/borg/cockpit/widgets.py:78-96","code":"   78 |     def watch_rc(self, rc: int):\n   79 |         label = self.query_one(\"#status-rc\")\n   80 |         if rc is None:\n   81 |             label.update(T(\"RC: RUNNING\"))\n   82 |             return\n   83 | \n   84 |         label.remove_class(\"rc-ok\")\n   85 |         label.remove_class(\"rc-warning\")\n   86 |         label.remove_class(\"rc-error\")\n   87 | \n   88 |         status = classify_ec(rc)\n   89 |         if status == \"success\":\n   90 |             label.add_class(\"rc-ok\")\n   91 |         elif status == \"warning\":\n   92 |             label.add_class(\"rc-warning\")\n   93 |         else:  # error, signal\n   94 |             label.add_class(\"rc-error\")\n   95 | \n   96 |         label.update(T(f\"RC: {rc}\"))","lines":19,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/cockpit/widgets.py#L78-L96"},{"ref":"src/borg/cockpit/runner.py:55-60","code":"   55 |             rc = await self.process.wait()\n   56 |             self.log_callback({\"type\": \"process_finished\", \"rc\": rc})\n   57 | \n   58 |         except Exception as e:\n   59 |             self.logger.error(f\"Failed to run Borg process: {e}\")\n   60 |             self.log_callback({\"type\": \"process_finished\", \"rc\": -1, \"error\": str(e)})","lines":6,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/cockpit/runner.py#L55-L60"},{"ref":"src/borg/cockpit/runner.py:68-72","code":"   68 |         if self.process and self.process.returncode is None:\n   69 |             self.logger.info(\"Terminating Borg process...\")\n   70 |             try:\n   71 |                 self.process.terminate()\n   72 |                 await self.process.wait()","lines":5,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/cockpit/runner.py#L68-L72"},{"ref":"src/borg/cockpit/app.py:126-129","code":"  126 |         elif msg_type == \"process_finished\":\n  127 |             self.process_running = False\n  128 |             rc = data.get(\"rc\", 0)\n  129 |             self.query_one(\"#status\").rc = rc","lines":4,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/cockpit/app.py#L126-L129"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"In import_paperkey, parsing the 'id' line count does `lines = int(id_lines)` inside a try/except ValueError. On ValueError it prints 'internal error while parsing length' but is MISSING a `continue`, so control falls through to the `break` at line 230 with `lines` left unbound. On the first iteration `lines` was never assigned, so the body-line loop reaches `if idx == lines` (line 258) and raises NameError, crashing the import instead of re-prompting. A user pasting a corrupted id line (non-numeric length) gets an unhandled NameError traceback rather than a retry prompt.","fix":"Add `continue` in the except branch (after the print) so a bad length re-prompts the id line, e.g.:\n                    except ValueError:\n                        print(\"internal error while parsing length\")\n                        continue","locations":[{"ref":"src/borg/crypto/keymanager.py:225-230","code":"  225 |                     try:\n  226 |                         lines = int(id_lines)\n  227 |                     except ValueError:\n  228 |                         print(\"internal error while parsing length\")\n  229 | \n  230 |                     break","lines":6,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/crypto/keymanager.py#L225-L230"},{"ref":"src/borg/crypto/keymanager.py:258","code":"  258 |                     if idx == lines:","lines":1,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/crypto/keymanager.py#L258"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"archive_get_items() returns None implicitly when metadata has neither 'item_ptrs' nor 'items' (both `if` branches fall through with no return). _load_meta then assigns metadata.items = None, and a later iter_items() -> DownloadPipeline.unpack_many(None) would fail. Normal archives always have one of these keys and the version check precedes this, so this only triggers on malformed/corrupted metadata, but it produces an opaque TypeError instead of a clear error.","fix":"After the two `if` blocks in archive_get_items, raise a clear error (e.g. `raise ValueError('archive metadata has neither item_ptrs nor items')`) instead of falling through to an implicit None return.","locations":[{"ref":"src/borg/archive.py:515-527","code":"  515 | def archive_get_items(metadata, *, repo_objs, repository):\n  516 |     if \"item_ptrs\" in metadata:  # looks like a v2+ archive\n  517 |         assert \"items\" not in metadata\n  518 |         items = []\n  519 |         for id, cdata in zip(metadata.item_ptrs, repository.get_many(metadata.item_ptrs)):\n  520 |             _, data = repo_objs.parse(id, cdata, ro_type=ROBJ_ARCHIVE_CHUNKIDS)\n  521 |             ids = msgpack.unpackb(data)\n  522 |             items.extend(ids)\n  523 |         return items\n  524 | \n  525 |     if \"items\" in metadata:  # legacy, v1 archive\n  526 |         assert \"item_ptrs\" not in metadata\n  527 |         return metadata.items","lines":13,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/archive.py#L515-L527"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"do_debug_dump_repo_objs and do_debug_search_repo_objs set up the crypto key by reading the first repository object: result = repository.list(limit=1, marker=None) followed by id, _ = result[0]. repository.list returns an empty list for an empty repository (no packs), so result[0] raises an uncaught IndexError instead of a clean error message. Running these debug commands against a freshly created/empty repository crashes with a traceback.","fix":"Check the result before indexing, e.g. `if not result: raise CommandError(\"repository has no objects\")` (or print a friendly message) before doing `id, _ = result[0]`.","locations":[{"ref":"src/borg/archiver/debug_cmd.py:127-130","code":"  127 |         result = repository.list(limit=1, marker=None)\n  128 |         id, _ = result[0]\n  129 |         cdata = repository.get(id)\n  130 |         key = key_factory(repository, cdata)","lines":4,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/archiver/debug_cmd.py#L127-L130"},{"ref":"src/borg/archiver/debug_cmd.py:167-170","code":"  167 |         result = repository.list(limit=1, marker=None)\n  168 |         id, _ = result[0]\n  169 |         cdata = repository.get(id)\n  170 |         key = key_factory(repository, cdata)","lines":4,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/archiver/debug_cmd.py#L167-L170"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"ChunkerFailing accepts an empty map string: `set('').issubset({'R','E'})` is True, so the constructor validation passes. In chunkify(), once a non-empty read occurs, `idx = self.count if self.count < len(self.map) else -1` yields -1 (since len is 0), and `self.map[idx]` (i.e. ''[-1]) raises IndexError instead of a controlled error. The fail-map is user-supplied via `--chunker-params fail,BLOCKSIZE,MAP` (parsed in helpers/parseformat.py ChunkerParams without a non-empty check), so an empty map crashes with an unhandled IndexError rather than a clear validation error.","fix":"Reject an empty map in __init__: add `if not map: raise ValueError('map must not be empty')` after the upper()/subset check (or validate non-empty fail_map in ChunkerParams).","locations":[{"ref":"src/borg/chunkers/failing.py:23-26","code":"   23 |         map = map.upper()\n   24 |         if not set(map).issubset({\"R\", \"E\"}):\n   25 |             raise ValueError(\"unsupported map character\")\n   26 |         self.map = map","lines":4,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/chunkers/failing.py#L23-L26"},{"ref":"src/borg/chunkers/failing.py:48-49","code":"   48 |                 idx = self.count if self.count < len(self.map) else -1\n   49 |                 behavior = self.map[idx]","lines":2,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/chunkers/failing.py#L48-L49"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"interval() is used as an argparse type validator (e.g. for prune --keep-within). When passed an empty string, `s.endswith(tuple(...))` is False, so execution falls into the else branch at line 155 which evaluates `s[-1]` to build the error message. On an empty string `s[-1]` raises IndexError, producing an unhandled traceback instead of a clean ArgumentTypeError.","fix":"Handle the empty-string case before indexing, e.g. raise ArgumentTypeError early if `not s`, or avoid `s[-1]` in the message (use the whole value `s`).","locations":[{"ref":"src/borg/helpers/parseformat.py:169-173","code":"  169 |     if s.endswith(tuple(multiplier.keys())):\n  170 |         number = s[:-1]\n  171 |         suffix = s[-1]\n  172 |     else:\n  173 |         raise ArgumentTypeError(f'Unexpected time unit \"{s[-1]}\": choose from {\", \".join(multiplier)}')","lines":5,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/helpers/parseformat.py#L169-L173"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"ProgressIndicatorPercent defaults total=0 and progress() computes `pct = self.counter * 100 / self.total`, which raises ZeroDivisionError if show()/progress() is called while total is still 0. Several call sites (e.g. tar_cmds.py, extract_cmd.py) construct the indicator with the default total and only set pi.total later from a computed size; if that size is 0 the indicator is in a divide-by-zero state. In current call paths show() happens not to be reached when total is 0, but the class itself offers no guard.","fix":"Guard against total == 0 in progress(), e.g. `pct = self.counter * 100 / self.total if self.total else 100.0`, or skip output entirely when total is 0.","locations":[{"ref":"src/borg/helpers/progress.py:88-95","code":"   88 |     def progress(self, current=None, increase=1):\n   89 |         if current is not None:\n   90 |             self.counter = current\n   91 |         pct = self.counter * 100 / self.total\n   92 |         self.counter += increase\n   93 |         if pct >= self.trigger_at:\n   94 |             self.trigger_at += self.step\n   95 |             return pct","lines":8,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/helpers/progress.py#L88-L95"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"RepoObj.parse() reads meta_compressed[\"ctype\"], [\"clevel\"], [\"csize\"] (lines 150-152) and parse_meta()/parse() read meta[\"type\"] (lines 109, 145) directly with [] indexing. When the AUTHENTICATED_NO_KEY workaround is enabled, key.decrypt() does not authenticate, so a tampered/truncated metadata blob that still msgpack-unpacks into a dict missing these keys raises an unhandled KeyError instead of an IntegrityError, crashing the operation rather than being reported as a repository integrity problem.","fix":"Use meta.get(...) with validation and raise IntegrityError when a required key (type/ctype/clevel/csize) is missing, so corrupt metadata surfaces as an integrity error rather than a KeyError.","locations":[{"ref":"src/borg/repoobj.py:248-250","code":"  248 |             ctype = meta_compressed[\"ctype\"]\n  249 |             clevel = meta_compressed[\"clevel\"]\n  250 |             csize = meta_compressed[\"csize\"]  # always the overall size","lines":3,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/repoobj.py#L248-L250"},{"ref":"src/borg/repoobj.py:193","code":"  193 |         if ro_type != ROBJ_DONTCARE and meta[\"type\"] != ro_type:","lines":1,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/repoobj.py#L193"},{"ref":"src/borg/repoobj.py:243","code":"  243 |         if ro_type != ROBJ_DONTCARE and meta_compressed[\"type\"] != ro_type:","lines":1,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/repoobj.py#L243"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"assert_no_manifest_replay compares the stored security timestamp string with manifest.timestamp via `timestamp > manifest.timestamp`. manifest.timestamp defaults to None (manifest.py:476) and is set from m.get(\"timestamp\") (manifest.py:502), so it can be None for a manifest lacking a timestamp field (e.g. legacy or crafted manifest). When the security dir has a non-empty stored timestamp and manifest.timestamp is None, the `str > None` comparison raises an unhandled TypeError, aborting the command with a confusing traceback instead of a proper security check/error.","fix":"Guard against manifest.timestamp being None, e.g. `if timestamp and manifest.timestamp and timestamp > manifest.timestamp:` (and decide explicitly how to treat a missing manifest timestamp), so the replay check degrades gracefully instead of crashing.","locations":[{"ref":"src/borg/security.py:169","code":"  169 |         if timestamp and timestamp > manifest.timestamp:","lines":1,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/security.py#L169"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In translate(), the escape check for the alternation/group meta-characters '(', '|', ')' is broken. At line 30 `i` is incremented immediately after reading the current char into `c`, so at line 63 `pat[i - 1]` is the CURRENT character `c` itself (always one of '(', '|', ')'), never the preceding character. Thus `pat[i - 1] != \"\\\\\"` is always True and a user-escaped literal like `\\(` is never recognized: the backslash is emitted via re.escape and the `(` is still emitted as an unescaped regex group-open. The intended check is the previous char `pat[i - 2]`. Result: shell patterns containing escaped parens/pipes do not match the literal character and can even create an invalid/unintended regex.","fix":"Check the character before the current one: `if i < 2 or pat[i - 2] != \"\\\\\": res += c` (and emit an escaped literal otherwise), mirroring how the escape state is checked elsewhere.","locations":[{"ref":"src/borg/helpers/shellpattern.py:62-64","code":"   62 |         elif c in \"(|)\":\n   63 |             if i > 0 and pat[i - 1] != \"\\\\\":\n   64 |                 res += c","lines":3,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/helpers/shellpattern.py#L62-L64"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"build_filter (used for the export-tar/extract item filter and progress-size pass) splits item paths with os.sep, while borg item paths always use '/' internally and the extract loop strips with '/'.split. On Windows (os.sep == '\\\\') the filter's `len(item.path.split(os.sep)) > strip_components` never splits the '/'-separated path, so with --strip-components it filters out all items for the progress total (and, in export-tar, for the actual output), diverging from the real extraction which strips on '/'.","fix":"Use '/' (the borg path separator) consistently in build_filter instead of os.sep, matching the extract loop's orig_path.split('/').","locations":[{"ref":"src/borg/archiver/_common.py:597-610","code":"  597 | def build_filter(matcher, strip_components):\n  598 |     if strip_components:\n  599 | \n  600 |         def item_filter(item):\n  601 |             matched = matcher.match(item.path) and len(item.path.split(os.sep)) > strip_components\n  602 |             return matched\n  603 | \n  604 |     else:\n  605 | \n  606 |         def item_filter(item):\n  607 |             matched = matcher.match(item.path)\n  608 |             return matched\n  609 | \n  610 |     return item_filter","lines":14,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/archiver/_common.py#L597-L610"},{"ref":"src/borg/archiver/extract_cmd.py:61-67","code":"   61 |         for item in archive.iter_items():\n   62 |             orig_path = item.path\n   63 |             if strip_components:\n   64 |                 stripped_path = \"/\".join(orig_path.split(\"/\")[strip_components:])\n   65 |                 if not stripped_path:\n   66 |                     continue\n   67 |                 item.path = stripped_path","lines":7,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/archiver/extract_cmd.py#L61-L67"},{"ref":"src/borg/archiver/tar_cmds.py:494-497","code":"  494 |         for item in archive.iter_items(filter):\n  495 |             orig_path = item.path\n  496 |             if strip_components:\n  497 |                 item.path = os.sep.join(orig_path.split(os.sep)[strip_components:])","lines":4,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/archiver/tar_cmds.py#L494-L497"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"The nested helper analyze_path_change(path) reads its data from `base[path]` and `new[path]` (the parameter) but accumulates results into `self.difference_by_path[directory_path]`, referencing the enclosing loop variable `directory_path` instead of its own `path` parameter. It only works because both call sites pass `directory_path` as the argument, making them coincidentally equal. This is a latent bug: any refactor that calls the helper with a different argument, or reorders the loops, would silently write to the wrong directory bucket.","fix":"Inside analyze_path_change use the `path` parameter consistently: write to `self.difference_by_path[path]` rather than `self.difference_by_path[directory_path]`.","locations":[{"ref":"src/borg/archiver/analyze_cmd.py:414-428","code":"  414 |         def analyze_path_change(path):\n  415 |             base_chunks = base[path]\n  416 |             new_chunks = new[path]\n  417 |             # add up added chunks' sizes\n  418 |             for id in new_chunks.keys() - base_chunks.keys():\n  419 |                 self.difference_by_path[directory_path] += new_chunks[id]\n  420 |             # add up removed chunks' sizes\n  421 |             for id in base_chunks.keys() - new_chunks.keys():\n  422 |                 self.difference_by_path[directory_path] += base_chunks[id]\n  423 | \n  424 |         for directory_path in base:\n  425 |             analyze_path_change(directory_path)\n  426 |         for directory_path in new:\n  427 |             if directory_path not in base:\n  428 |                 analyze_path_change(directory_path)","lines":15,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/archiver/analyze_cmd.py#L414-L428"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In the generated zsh completion for archive IDs, the hex-prefix validation uses the glob `[[ -n \"$prefix\" && ! \"$prefix\" == [0-9a-fA-F]# ]]`. The `#` quantifier (meaning 'zero or more') in zsh only works when EXTENDED_GLOB is set, which is not guaranteed inside a completion widget. Without extendedglob, `#` is a literal, so the pattern only matches a single hex char followed by a literal '#'. As a result, any multi-character prefix like `aid:d34d` fails the match and the function returns with no candidates, silently breaking aid: completion for the common case of more than one typed hex digit. The bash sibling at line 103 correctly uses an ERE `^[0-9a-fA-F]*$`.","fix":"Use a robust test independent of extendedglob, e.g. `[[ -n \"$prefix\" && \"$prefix\" != <-> && ! \"$prefix\" == [0-9a-fA-F]## ]]` is still glob-dependent; prefer `[[ -n \"$prefix\" && \"$prefix\" =~ '[^0-9a-fA-F]' ]] && return 0` (regex match for a non-hex char), mirroring the bash implementation.","locations":[{"ref":"src/borg/archiver/completion_cmd.py:359-360","code":"  359 |     # allow only hex digits as prefix; empty prefix also allowed (list all)\n  360 |     [[ -n \"$prefix\" && ! \"$prefix\" == [0-9a-fA-F]# ]] && return 0","lines":2,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/archiver/completion_cmd.py#L359-L360"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In do_debug_search_repo_objs the cross-object boundary scan uses slices of width len(wanted)-1. For a single-byte search term (str: with one char, or hex: with one byte) len(wanted)-1 == 0, and last_data[-0:] is the ENTIRE previous object (Python treats -0 as 0), not the intended empty/last-0-bytes slice; data[:0] is empty. As a result the boundary check rescans the whole previous object and can emit a spurious/duplicate finding already reported by the per-object scan. Only affects 1-byte search terms in a debug command.","fix":"Skip the boundary scan when len(wanted) <= 1, or special-case the slice so a zero width yields an empty bytes object (e.g. use last_data[len(last_data)-(len(wanted)-1):] which is correct for width 0).","locations":[{"ref":"src/borg/archiver/debug_cmd.py:180-186","code":"  180 |             # try to locate wanted sequence crossing the border of last_data and data\n  181 |             boundary_data = last_data[-(len(wanted) - 1) :] + data[: len(wanted) - 1]\n  182 |             if wanted in boundary_data:\n  183 |                 boundary_data = last_data[-(len(wanted) - 1 + context) :] + data[: len(wanted) - 1 + context]\n  184 |                 offset = boundary_data.find(wanted)\n  185 |                 info = \"%d %s | %s\" % (i, last_id.hex(), id.hex())\n  186 |                 print_finding(info, wanted, boundary_data, offset)","lines":7,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/archiver/debug_cmd.py#L180-L186"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"The status-errors widget is created with the initial CSS class 'error-ok' (singular), but the stylesheet only defines '.errors-ok' / '.errors-warning' (plural), and watch_error_count adds/removes the plural names. Because the error_count reactive uses init=False, its watcher does not fire at startup, so the initial 'Errors: 0' label carries the unstyled 'error-ok' class and is not rendered in the success color until the count first changes.","fix":"Change the initial class on line 43 from 'error-ok' to 'errors-ok' to match the CSS rule and the watcher.","locations":[{"ref":"src/borg/cockpit/widgets.py:43","code":"   43 |                 yield Static(T(\"Errors: 0\"), classes=\"status error-ok\", id=\"status-errors\")","lines":1,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/cockpit/widgets.py#L43"},{"ref":"src/borg/cockpit/cockpit.tcss:183-189","code":"  183 | .errors-ok {\n  184 |     color: $success;\n  185 | }\n  186 | \n  187 | .errors-warning {\n  188 |     color: $warning;\n  189 | }","lines":7,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/cockpit/cockpit.tcss#L183-L189"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"SpeedSparkline.BLOCKS = ['.', ' ', '▂', ...] is non-monotonic: index 0 is '.' and index 1 is a blank space, while indices 2..8 are increasing block heights. So level 0 renders a dot, but a slightly larger value (level 1) renders an invisible blank, and only level 2+ resumes growing. This makes a small nonzero speed appear as empty/lower than zero in the sparkline, inverting the visual height ordering at the bottom.","fix":"Use a monotonically increasing glyph ramp, e.g. replace the space at index 1 with '▁' (one-eighth block): ['.', '▁', '▂', '▃', '▄', '▅', '▆', '▇', '█'], or drop the leading '.' and remap thresholds so level 0 is blank.","locations":[{"ref":"src/borg/cockpit/widgets.py:383","code":"  383 |     BLOCKS = [\".\", \" \", \"▂\", \"▃\", \"▄\", \"▅\", \"▆\", \"▇\", \"█\"]","lines":1,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/cockpit/widgets.py#L383"},{"ref":"src/borg/cockpit/widgets.py:418-424","code":"  418 |             for i in range(4):\n  419 |                 # i=0 is top line, i=3 is bottom line\n  420 |                 # Thresholds: Top(24), Mid-High(16), Mid-Low(8), Low(0)\n  421 |                 threshold = (3 - i) * 8\n  422 |                 level = int(scaled - threshold)\n  423 |                 level = max(0, min(8, level))\n  424 |                 lines[i].append(self.BLOCKS[level])","lines":7,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/cockpit/widgets.py#L418-L424"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In DiffFormatter.__init__, line 1126 protects against a None/empty format by substituting a default (`format or \"{content}...\"`), but line 1128 then calls `Formatter().parse(format)` on the raw, unguarded `format`. `Formatter().parse(None)` raises TypeError ('expected str, got NoneType'), and parsing an empty string would silently produce an empty key set inconsistent with the default format that is actually used for output. Currently the only caller (diff_cmd.py) always passes a non-empty string, so this is latent, but the two lines disagree about whether `format` may be falsy.","fix":"Compute the effective format once, e.g. `fmt = format or \"{content}{link}{directory}{blkdev}{chrdev}{fifo} {path}{NL}\"`, pass it to super().__init__, and derive self.format_keys from `fmt` instead of the raw `format`.","locations":[{"ref":"src/borg/helpers/parseformat.py:1400-1404","code":" 1400 |     def __init__(self, format, content_only=False):\n 1401 |         static_data = {} | self.FIXED_KEYS\n 1402 |         super().__init__(format or \"{content}{link}{directory}{blkdev}{chrdev}{fifo} {path}{NL}\", static_data)\n 1403 |         self.content_only = content_only\n 1404 |         self.format_keys = {f[1] for f in Formatter().parse(format)}","lines":5,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/helpers/parseformat.py#L1400-L1404"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"info() builds the returned dict with self.version (the repository format version read from config, e.g. 2) BEFORE calling _load_hints(), which overwrites self.version with hints[\"version\"] (the hints-file FORMAT version, which is 1 or 2 and is a different concept than the repo version). After info() returns, self.version no longer reflects the repository version but the hints format version, which is misleading for any later code reading self.version on the same instance.","fix":"Do not clobber self.version with the hints format version in _load_hints(); store the hints format version in a separate attribute (e.g. self.hints_version) or drop the assignment, since the repo version is already known from config.","locations":[{"ref":"src/borg/legacy/repository.py:465-477","code":"  465 |     def _load_hints(self):\n  466 |         if (transaction_id := self.get_transaction_id()) is None:\n  467 |             # self is a fresh repo, so transaction_id is None and there is no hints file\n  468 |             return\n  469 |         hints = self._unpack_hints(transaction_id)\n  470 |         self.version = hints[\"version\"]\n  471 |         self.shadow_index = hints[\"shadow_index\"]\n  472 | \n  473 |     def info(self):\n  474 |         \"\"\"return some infos about the repo (must be opened first)\"\"\"\n  475 |         info = dict(id=self.id, version=self.version)\n  476 |         self._load_hints()\n  477 |         return info","lines":13,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/legacy/repository.py#L465-L477"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"In do_help, the `--epilog-only` branch prints `commands[args.topic].epilog` directly. If a subcommand has no epilog set, this prints the literal string 'None' to stdout instead of producing empty/no output, which is misleading for scripts or users running `borg help <cmd> --epilog-only`.","fix":"Guard the print, e.g. `epilog = commands[args.topic].epilog; if epilog: print(epilog)` so a missing epilog yields no output rather than 'None'.","locations":[{"ref":"src/borg/archiver/help_cmd.py:1133-1134","code":" 1133 |             if args.epilog_only:\n 1134 |                 print(commands[args.topic].epilog)","lines":2,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/archiver/help_cmd.py#L1133-L1134"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"medium","description":"format_timedelta assumes a non-negative timedelta. For a negative td, td.total_seconds() is negative and Python's `%` yields a positive remainder while int(ts/60) truncates toward zero, producing an inconsistent/garbled human string (e.g. mixing positive seconds with a negative day count). Borg durations are always non-negative so this is not hit in practice.","fix":"If negative durations are ever possible, take abs() and prepend a minus sign, or assert td >= timedelta(0).","locations":[{"ref":"src/borg/helpers/time.py:118-131","code":"  118 | def format_timedelta(td):\n  119 |     \"\"\"Format a timedelta in a human-friendly format.\"\"\"\n  120 |     ts = td.total_seconds()\n  121 |     s = ts % 60\n  122 |     m = int(ts / 60) % 60\n  123 |     h = int(ts / 3600) % 24\n  124 |     txt = \"%.3f seconds\" % s\n  125 |     if m:\n  126 |         txt = \"%d minutes %s\" % (m, txt)\n  127 |     if h:\n  128 |         txt = \"%d hours %s\" % (h, txt)\n  129 |     if td.days:\n  130 |         txt = \"%d days %s\" % (td.days, txt)\n  131 |     return txt","lines":14,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/helpers/time.py#L118-L131"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"In assert_no_manifest_replay, the OSError handler logs \"Could not read previous location file\" but this code path reads the manifest-timestamp file (self.manifest_ts_file), not the location file. The wrong message was copy-pasted verbatim from assert_location_matches (line 114). A user debugging an I/O error on the manifest-timestamp file would be misled into looking at the wrong file.","fix":"Change the log message to \"Could not read manifest timestamp file: %s\".","locations":[{"ref":"src/borg/security.py:164-166","code":"  164 |         except OSError as exc:\n  165 |             logger.warning(\"Could not read previous location file: %s\", exc)\n  166 |             timestamp = \"\"","lines":3,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/security.py#L164-L166"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"do_tag silently ignores --set when it would erase pre-existing special (@-prefixed) tags. When clobber is True the assignment `archive.tags = new_tags` is skipped, but no warning or error is emitted to the user. The command still prints a success line with the (unchanged or only add/remove-modified) tags, so the user has no indication their --set request was not applied.","fix":"When clobber is True, emit a warning (self.print_warning) explaining that --set was ignored because it would remove existing special tags, and that the special tags must be included in --set.","locations":[{"ref":"src/borg/archiver/tag_cmd.py:25-42","code":"   25 |             if args.set_tags is not None:\n   26 |                 # avoid that --set (accidentally) erases existing special tags,\n   27 |                 # but allow --set if the existing special tags are also given.\n   28 |                 new_tags = set(args.set_tags)\n   29 |                 existing_special = {tag for tag in archive.tags if tag.startswith(\"@\")}\n   30 |                 clobber = not existing_special.issubset(new_tags)\n   31 |                 if not clobber:\n   32 |                     archive.tags = new_tags\n   33 |             archive.tags |= set(args.add_tags or [])\n   34 |             archive.tags -= set(args.remove_tags or [])\n   35 |             old_id = archive.id\n   36 |             archive.set_meta(\"tags\", list(sorted(archive.tags)))\n   37 |             if old_id != archive.id:\n   38 |                 manifest.archives.delete_by_id(old_id)\n   39 |             print(\n   40 |                 f\"id: {bin_to_hex(old_id):.8} -> {bin_to_hex(archive.id):.8}, \"\n   41 |                 f\"tags: {','.join(sorted(archive.tags))}.\"\n   42 |             )","lines":18,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/archiver/tag_cmd.py#L25-L42"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"BORG_FILES_CACHE_TTL is parsed with int(os.environ.get(\"BORG_FILES_CACHE_TTL\", 2)) inside _write_files_cache, which runs during Cache.close() after the backup work is already done. If the env var is set to a non-integer value, int() raises an unhandled ValueError at the very end of the run, crashing the command and preventing the files cache from being saved (so the next run cannot benefit from the cache).","fix":"Parse the env var defensively, e.g. wrap in try/except ValueError and fall back to the default 2 with a warning, or validate the value once at startup.","locations":[{"ref":"src/borg/cache.py:439","code":"  439 |         ttl = int(os.environ.get(\"BORG_FILES_CACHE_TTL\", 2))","lines":1,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/cache.py#L439"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"sanity_check opens the candidate path with open(filename, 'rb') (line 597). _find_key_in_keys_dir (642-647) and _find_all_keys_in_keys_dir (656-661) iterate every entry in the keys directory and call sanity_check, but only catch KeyfileInvalidError and KeyfileMismatchError. If the keys directory contains a subdirectory (or a path that is otherwise unreadable), open() raises IsADirectoryError/OSError which is not caught, aborting key discovery instead of skipping the entry.","fix":"Skip non-files (e.g. `if not entry.is_file(): continue`) before sanity_check, or extend the except clauses in _find_key_in_keys_dir/_find_all_keys_in_keys_dir to also catch OSError.","locations":[{"ref":"src/borg/crypto/key.py:693-702","code":"  693 |     def sanity_check(self, filename, id):\n  694 |         repo_id_hex = bin_to_hex(id)\n  695 |         with open(filename, \"rb\") as fd:\n  696 |             # we do the magic / id check in binary mode to avoid stumbling over\n  697 |             # decoding errors if somebody has binary files in the keys dir for some reason.\n  698 |             data = fd.read(10000)\n  699 |         if not is_keyfile(data):\n  700 |             raise KeyfileInvalidError(self.repository._location.canonical_path(), filename)\n  701 |         if not is_keyfile(data, repo_id_hex):\n  702 |             raise KeyfileMismatchError(self.repository._location.canonical_path(), filename)","lines":10,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/crypto/key.py#L693-L702"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"dir_is_cachedir() relies on a single os.read(tag_fd, len(CACHE_TAG_CONTENTS)) returning the full content in one call. os.read is permitted to return fewer bytes than requested; on a short read the equality comparison fails and a genuine cache directory would be misclassified as not-a-cachedir, causing it to be backed up instead of excluded. In practice CACHE_TAG_CONTENTS is 43 bytes and regular-file reads almost always return it fully, so the risk is small.","fix":"Read in a loop until len(CACHE_TAG_CONTENTS) bytes are accumulated or EOF/short-read, then compare; or read len+1 bytes and compare the prefix.","locations":[{"ref":"src/borg/helpers/fs.py:183-194","code":"  183 |     tag_fd = None\n  184 |     try:\n  185 |         if dir_fd is not None:\n  186 |             tag_fd = os.open(CACHE_TAG_NAME, os.O_RDONLY, dir_fd=dir_fd)\n  187 |         else:\n  188 |             tag_fd = os.open(str(Path(path) / CACHE_TAG_NAME), os.O_RDONLY)\n  189 |         return os.read(tag_fd, len(CACHE_TAG_CONTENTS)) == CACHE_TAG_CONTENTS\n  190 |     except (FileNotFoundError, OSError):\n  191 |         return False\n  192 |     finally:\n  193 |         if tag_fd is not None:\n  194 |             os.close(tag_fd)","lines":12,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/helpers/fs.py#L183-L194"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"The server side can serialize an exception with exception_class == \"StoreObjectNotFound\" (remote.py lines 790-791), but the client's handle_error() in call_many has no branch for \"StoreObjectNotFound\". Such a response therefore falls through to the generic else and is raised as a raw RPCError instead of a proper StoreObjectNotFound, losing the typed exception. In normal legacy operation get() raises LegacyRepository.ObjectNotFound (which IS handled), so this only bites if the served repository code ever raises StoreObjectNotFound, but the explicit server-side handling implies it is considered possible.","fix":"Add an elif branch in handle_error for error == \"StoreObjectNotFound\" that raises StoreObjectNotFound(args[0]) (import it from ..repository, already imported).","locations":[{"ref":"src/borg/legacy/remote.py:402-440","code":"  402 |         def handle_error(unpacked):\n  403 |             if \"exception_class\" not in unpacked:\n  404 |                 return\n  405 | \n  406 |             error = unpacked[\"exception_class\"]\n  407 |             args = unpacked[\"exception_args\"]\n  408 | \n  409 |             if error == \"Error\":\n  410 |                 raise Error(args[0])\n  411 |             elif error == \"ErrorWithTraceback\":\n  412 |                 raise ErrorWithTraceback(args[0])\n  413 |             elif error == \"DoesNotExist\":\n  414 |                 raise LegacyRepository.DoesNotExist(self.location.processed)\n  415 |             elif error == \"AlreadyExists\":\n  416 |                 raise LegacyRepository.AlreadyExists(self.location.processed)\n  417 |             elif error == \"CheckNeeded\":\n  418 |                 raise LegacyRepository.CheckNeeded(self.location.processed)\n  419 |             elif error == \"IntegrityError\":\n  420 |                 raise IntegrityError(args[0])\n  421 |             elif error == \"PathNotAllowed\":\n  422 |                 raise PathNotAllowed(args[0])\n  423 |             elif error == \"PathPermissionDenied\":\n  424 |                 raise LegacyRepository.PathPermissionDenied(args[0])\n  425 |             elif error == \"ParentPathDoesNotExist\":\n  426 |                 raise LegacyRepository.ParentPathDoesNotExist(args[0])\n  427 |             elif error == \"ObjectNotFound\":\n  428 |                 raise LegacyRepository.ObjectNotFound(args[0], self.location.processed)\n  429 |             elif error == \"InvalidRPCMethod\":\n  430 |                 raise InvalidRPCMethod(args[0])\n  431 |             elif error == \"LockTimeout\":\n  432 |                 raise LockTimeout(args[0])\n  433 |             elif error == \"LockFailed\":\n  434 |                 raise LockFailed(args[0], args[1])\n  435 |             elif error == \"NotLocked\":\n  436 |                 raise NotLocked(args[0])\n  437 |             elif error == \"NotMyLock\":\n  438 |                 raise NotMyLock(args[0])\n  439 |             else:\n  440 |                 raise self.RPCError(unpacked)","lines":39,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/legacy/remote.py#L402-L440"},{"ref":"src/borg/legacy/remote.py:760-765","code":"  760 |                             # StoreObjectNotFound and Repository.ObjectNotFound both have\n  761 |                             # __name__ == \"ObjectNotFound\", so we need to distinguish them\n  762 |                             # explicitly for correct client-side reconstruction.\n  763 |                             exc_cls_name = (\n  764 |                                 \"StoreObjectNotFound\" if isinstance(e, StoreObjectNotFound) else e.__class__.__name__\n  765 |                             )","lines":6,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/legacy/remote.py#L760-L765"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"RepoObj.parse() asserts `csize == len(data_compressed)` and `psize <= csize` (lines 153, 157) on values read from decrypted metadata. With the AUTHENTICATED_NO_KEY workaround, metadata is not authenticated, so a tampered csize/psize from a malicious or corrupted repo triggers an AssertionError (and AssertionError can be stripped entirely under python -O) instead of a clean IntegrityError. Same pattern as the documented integrity checks elsewhere in the file which correctly raise IntegrityError.","fix":"Replace these assertions with explicit checks that raise IntegrityError on mismatch, consistent with the other size-consistency checks in this module.","locations":[{"ref":"src/borg/repoobj.py:251-255","code":"  251 |             assert csize == len(data_compressed)\n  252 |             psize = meta_compressed.get(\n  253 |                 \"psize\", csize\n  254 |             )  # obfuscation: psize (payload size) is potentially less than csize.\n  255 |             assert psize <= csize","lines":5,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/repoobj.py#L251-L255"}]},
{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"negligible","difficulty":"medium","description":"on_unmount awaits runner.stop() (which terminates and waits for the process) but does not await runner_task, whereas action_quit awaits both runner.stop() and runner_task. On an unmount-driven shutdown the read_stream/gather coroutine in start() may still be pending, so the final process_finished callback can race with teardown.","fix":"Mirror action_quit in on_unmount: after awaiting runner.stop(), also await self.runner_task if it exists.","locations":[{"ref":"src/borg/cockpit/app.py:88-104","code":"   88 |     async def on_unmount(self) -> None:\n   89 |         \"\"\"Cleanup resources on app shutdown.\"\"\"\n   90 |         if hasattr(self, \"runner\"):\n   91 |             await self.runner.stop()\n   92 | \n   93 |     async def action_quit(self) -> None:\n   94 |         \"\"\"Handle quit action.\"\"\"\n   95 |         if hasattr(self, \"speed_timer\"):\n   96 |             self.speed_timer.stop()\n   97 |         if hasattr(self, \"runner\"):\n   98 |             await self.runner.stop()\n   99 |         if hasattr(self, \"runner_task\"):\n  100 |             await self.runner_task\n  101 |         self.query_one(\"#logo\").styles.animate(\"opacity\", 0, duration=2)\n  102 |         self.query_one(\"#slogan\").styles.animate(\"opacity\", 0, duration=2)\n  103 |         await asyncio.sleep(2)  # give the user a chance the see the borg RC\n  104 |         self.exit()","lines":17,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/cockpit/app.py#L88-L104"}]},
{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"negligible","difficulty":"medium","description":"ChunkerParams validates `block_size > MAX_DATA_SIZE` and `header_size > MAX_DATA_SIZE` (line 268) but never rejects negative header_size; a value like 'fixed,128,-5' passes validation (int('-5') is accepted) and yields a negative header_size that is semantically invalid. Only the lower bound for block_size (>=64) is enforced, not for header_size.","fix":"Add `or header_size < 0` to the validation (e.g. require `0 <= header_size <= MAX_DATA_SIZE`) so negative header sizes are rejected with a clear ArgumentTypeError.","locations":[{"ref":"src/borg/helpers/parseformat.py:308-320","code":"  308 |     if algo == CH_FIXED and 2 <= count <= 3:  # fixed, block_size[, header_size]\n  309 |         block_size = int(params[1])\n  310 |         header_size = int(params[2]) if count == 3 else 0\n  311 |         if block_size < 64:\n  312 |             # we are only disallowing the most extreme cases of abuse here - this does NOT imply\n  313 |             # that cutting chunks of the minimum allowed size is efficient concerning storage\n  314 |             # or in-memory chunk management.\n  315 |             # choose the block (chunk) size wisely: if you have a lot of data and you cut\n  316 |             # it into very small chunks, you are asking for trouble!\n  317 |             raise ArgumentTypeError(\"block_size must not be less than 64 Bytes\")\n  318 |         if block_size > MAX_DATA_SIZE or header_size > MAX_DATA_SIZE:\n  319 |             raise ArgumentTypeError(\"block_size and header_size must not exceed MAX_DATA_SIZE [%d]\" % MAX_DATA_SIZE)\n  320 |         return algo, block_size, header_size","lines":13,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/helpers/parseformat.py#L308-L320"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"Starfield._update_art and LogoPanel.on_resize call random.seed(self._seed) on the process-global random module to make the star/pulsar layout stable across resizes. This mutates global RNG state as a side effect every render/resize, clobbering any other consumer of the module-level random sequence. It is also fragile: two widgets reseeding the same global generator can interfere with each other's intended determinism.","fix":"Use a local generator: store self._rng = random.Random(seed) in __init__ and call self._rng.random()/_rng.randint()/_rng.choice() instead of reseeding the global random module.","locations":[{"ref":"src/borg/cockpit/widgets.py:205-226","code":"  205 |         random.seed(self._seed)\n  206 | \n  207 |         star_density = 0.1\n  208 |         big_star_chance = 0.1\n  209 | \n  210 |         from .theme import theme\n  211 | \n  212 |         star_color = f\"[{theme.variables['star-color']}]\"\n  213 |         star_bright_color = f\"[{theme.variables['star-bright-color']}]\"\n  214 | \n  215 |         # 1. Create canvas (Starfield)\n  216 |         canvas = [[(\" \", \"\")] * w for _ in range(h)]\n  217 |         for y in range(h):\n  218 |             for x in range(w):\n  219 |                 if random.random() < star_density:  # nosec B311 - visual effect randomness\n  220 |                     if random.random() < big_star_chance:  # nosec B311 - visual effect randomness\n  221 |                         char = \"*\"\n  222 |                         color = star_bright_color\n  223 |                     else:\n  224 |                         char = random.choice([\".\", \"·\"])  # nosec B311 - visual effect randomness\n  225 |                         color = star_color\n  226 |                     canvas[y][x] = (char, color)","lines":22,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/cockpit/widgets.py#L205-L226"},{"ref":"src/borg/cockpit/widgets.py:313-354","code":"  313 |         if w > 4 and h > 4:\n  314 |             random.seed(self._seed)\n  315 | \n  316 |             # Exclusion Zone Calculation\n  317 |             # --------------------------\n  318 | \n  319 |             # Logo top-left\n  320 |             logo_y = (h - Logo.H) // 2 - 1\n  321 |             logo_x = (w - Logo.W) // 2\n  322 | \n  323 |             # Slogan top-left\n  324 |             slogan_y = logo_y + Logo.H + 2\n  325 |             slogan_x = (w - Slogan.W) // 2\n  326 | \n  327 |             # Forbidden area\n  328 |             # --------------\n  329 |             # Combined rect over Logo and Slogan\n  330 |             f_y1 = logo_y\n  331 |             f_y2 = slogan_y + Slogan.H\n  332 |             f_x1 = min(logo_x, slogan_x)\n  333 |             f_x2 = max(logo_x + Logo.W, slogan_x + Slogan.W)\n  334 | \n  335 |             # Update Logo and Slogan position\n  336 |             # Note: In the overlay layer, widgets stack vertically.\n  337 |             # Logo is at y=0 (height Logo.H).\n  338 |             # Slogan is at y=Logo.H (height Slogan.H).\n  339 |             # Pulsar is at y=Logo.H+Slogan.H (height Pulsar.H)\n  340 |             # We must subtract these flow positions from the desired absolute positions.\n  341 |             self.query_one(Logo).styles.offset = (logo_x, logo_y)\n  342 |             self.query_one(Slogan).styles.offset = (slogan_x, slogan_y - Logo.H)\n  343 | \n  344 |             # Pulsar: styles.offset moves the top-left corner.\n  345 |             # So if offset is (px, py), it occupies x=[px, px+Pulsar.W), y=[py, py+Pulsar.H).\n  346 | \n  347 |             # Find a valid Pulsar position\n  348 |             for _ in range(20):\n  349 |                 # Random position\n  350 |                 max_x = max(0, w - Pulsar.W)\n  351 |                 max_y = max(0, h - Pulsar.H)\n  352 | \n  353 |                 px = random.randint(0, max_x)  # nosec B311 - visual placement randomness\n  354 |                 py = random.randint(0, max_y)  # nosec B311 - visual placement randomness","lines":42,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/cockpit/widgets.py#L313-L354"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"OutputTimestamp.__format__ calls `format_time(self.ts.astimezone(), ...)`, and format_time() itself immediately calls `ts.astimezone()` again on its argument. The timezone conversion is applied twice. It is harmless (astimezone on an aware datetime is idempotent) but is redundant work and slightly misleading.","fix":"Pass self.ts directly: `return format_time(self.ts, format_spec=format_spec)`, since format_time already converts to local time.","locations":[{"ref":"src/borg/helpers/time.py:204-206","code":"  204 |     def __format__(self, format_spec):\n  205 |         # we want to output a timestamp in the user's local timezone\n  206 |         return format_time(self.ts.astimezone(), format_spec=format_spec)","lines":3,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/helpers/time.py#L204-L206"},{"ref":"src/borg/helpers/time.py:102-106","code":"  102 | def format_time(ts: datetime, format_spec=\"\"):\n  103 |     \"\"\"\n  104 |     Convert *ts* to a human-friendly format with textual weekday (in local timezone).\n  105 |     \"\"\"\n  106 |     return ts.astimezone().strftime(\"%a, %Y-%m-%d %H:%M:%S %z\" if format_spec == \"\" else format_spec)","lines":5,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/helpers/time.py#L102-L106"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"ArchiveRecreater.iter_chunks() has an `else` branch (the non-rechunkify case yielding Chunk objects) that is unreachable. Its only caller, process_chunks() (line 2259-2266), calls iter_chunks() exclusively inside the `if not target.recreate_rechunkify: ... return` early-out's negation - i.e. only when target.recreate_rechunkify is True. Inside iter_chunks the same condition `if target.recreate_rechunkify:` is therefore always True, so the else at lines 2285-2287 never executes.","fix":"Either remove the dead else branch (and the redundant inner `if target.recreate_rechunkify`) in iter_chunks, or simplify process_chunks to not pre-check, so the branch becomes meaningful again.","locations":[{"ref":"src/borg/archive.py:2903-2912","code":" 2903 |     def iter_chunks(self, archive, target, chunks):\n 2904 |         chunk_iterator = archive.pipeline.fetch_many(chunks, ro_type=ROBJ_FILE_STREAM)\n 2905 |         if target.recreate_rechunkify:\n 2906 |             # The target.chunker will read the file contents through ChunkIteratorFileWrapper chunk-by-chunk\n 2907 |             # (does not load the entire file into memory)\n 2908 |             file = ChunkIteratorFileWrapper(chunk_iterator)\n 2909 |             yield from target.chunker.chunkify(file)\n 2910 |         else:\n 2911 |             for chunk in chunk_iterator:\n 2912 |                 yield Chunk(chunk, size=len(chunk), allocation=CH_DATA)","lines":10,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/archive.py#L2903-L2912"},{"ref":"src/borg/archive.py:2882-2889","code":" 2882 |     def process_chunks(self, archive, target, item):\n 2883 |         if not target.recreate_rechunkify:\n 2884 |             for chunk_id, size in item.chunks:\n 2885 |                 self.cache.reuse_chunk(chunk_id, size, target.stats)\n 2886 |             return item.chunks\n 2887 |         chunk_iterator = self.iter_chunks(archive, target, list(item.chunks))\n 2888 |         chunk_processor = partial(self.chunk_processor, target)\n 2889 |         target.process_file_chunks(item, self.cache, target.stats, self.progress, chunk_iterator, chunk_processor)","lines":8,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/archive.py#L2882-L2889"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"In ChunkerParams, `count = len(params)` where params = s.strip().split(\",\"). str.split always returns at least one element, so `count == 0` is impossible and the `if count == 0: raise ArgumentTypeError(\"no chunker params given\")` branch is unreachable. An empty input falls through and is reported by the final generic 'invalid chunker params' instead.","fix":"Remove the unreachable `count == 0` check, or replace it with a real empty-input check such as `if not params[0]:`.","locations":[{"ref":"src/borg/helpers/parseformat.py:299-302","code":"  299 |     params = s.strip().split(\",\")\n  300 |     count = len(params)\n  301 |     if count == 0:\n  302 |         raise ArgumentTypeError(\"no chunker params given\")","lines":4,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/helpers/parseformat.py#L299-L302"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"In iter_objects, `assert size >= 0` is placed AFTER the yield and asserts on the full entry size (which _read already guaranteed to be >= header size, i.e. always positive). It can never fail and does not validate the value actually yielded to the caller, so it is effectively dead.","fix":"Remove the unreachable-failure assertion, or move a meaningful check (e.g. on the yielded data-size) before the yield.","locations":[{"ref":"src/borg/legacy/repository.py:1490-1492","code":" 1490 |             yield tag, key, offset, size - header_size(tag), data\n 1491 |             assert size >= 0\n 1492 |             offset += size","lines":3,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/legacy/repository.py#L1490-L1492"}]},
{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"The six lock exception classes (LockError, LockErrorT, LockFailed, LockTimeout, NotLocked, NotMyLock) with identical docstrings and identical exit_mcode values (70-75) are defined verbatim in both storelocking.py and fslocking.py. This is ~34 lines of near-identical duplicated code across two modules; a divergent edit to one copy (message wording or exit code) would silently desynchronize the two locking backends.","fix":"Move the shared lock exception classes into one module (e.g. a locking_common module or helpers.errors) and import them into both storelocking.py and fslocking.py.","locations":[{"ref":"src/borg/fslocking.py:72-105","code":"   72 | class LockError(Error):\n   73 |     \"\"\"Failed to acquire the lock {}.\"\"\"\n   74 | \n   75 |     exit_mcode = 70\n   76 | \n   77 | \n   78 | class LockErrorT(ErrorWithTraceback):\n   79 |     \"\"\"Failed to acquire the lock {}.\"\"\"\n   80 | \n   81 |     exit_mcode = 71\n   82 | \n   83 | \n   84 | class LockFailed(LockErrorT):\n   85 |     \"\"\"Failed to create/acquire the lock {} ({}).\"\"\"\n   86 | \n   87 |     exit_mcode = 72\n   88 | \n   89 | \n   90 | class LockTimeout(LockError):\n   91 |     \"\"\"Failed to create/acquire the lock {} (timeout).\"\"\"\n   92 | \n   93 |     exit_mcode = 73\n   94 | \n   95 | \n   96 | class NotLocked(LockErrorT):\n   97 |     \"\"\"Failed to release the lock {} (was not locked).\"\"\"\n   98 | \n   99 |     exit_mcode = 74\n  100 | \n  101 | \n  102 | class NotMyLock(LockErrorT):\n  103 |     \"\"\"Failed to release the lock {} (was/is locked, but not by me).\"\"\"\n  104 | \n  105 |     exit_mcode = 75","lines":34,"link":"https://github.com/borgbackup/borg/blob/67306a3b4fbf269a9cb2913dafe74d3e00ee3917/src/borg/fslocking.py#L72-L105"},{"ref":"src/borg/fslocking.py:72-105","code":"   72 | class LockError(Error):\n   73 |     \"\"\"Failed to acquire
