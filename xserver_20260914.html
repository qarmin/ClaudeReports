{"id":"LOGIC_57","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"Button-remap parsing in KdParsePointer never advances the destination index: inside `while (*s && *s != '}')` the code does `pi->map[i] = *s - '0';` but only `s++` at the end of the loop; `i` stays 0. So a `{...}` reorder string only ever writes pi->map[0] (which is the unused button-0 slot) with the last processed digit, silently discarding the entire button remap. A naive fix of adding `i++` must also bound-check `i` against `KD_MAX_BUTTON` because `save` can hold up to ~1023 digits, which would otherwise overflow `pi->map[KD_MAX_BUTTON+1]`.","fix":"Track and bound the index, e.g.:\n```c\n            char *s = save + 1;\n            i = 1; /* map[0] is unused button 0 */\n            while (*s && *s != '}' && i <= pi->nButtons && i <= KD_MAX_BUTTON) {\n                if ('1' <= *s && *s <= '0' + pi->nButtons)\n                    pi->map[i++] = *s - '0';\n                else\n                    UseMsg();\n                s++;\n            }\n```","locations":[{"ref":"hw/kdrive/src/kinput.c:1306-1317","code":" 1306 |         if (save[0] == '{') {\n 1307 |             char *s = save + 1;\n 1308 | \n 1309 |             i = 0;\n 1310 |             while (*s && *s != '}') {\n 1311 |                 if ('1' <= *s && *s <= '0' + pi->nButtons)\n 1312 |                     pi->map[i] = *s - '0';\n 1313 |                 else\n 1314 |                     UseMsg();\n 1315 |                 s++;\n 1316 |             }\n 1317 |         }","lines":12,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/kdrive/src/kinput.c#L1306-L1317"}]},
{"id":"LOGIC_58","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In the SBUS FFB probe branch, `prop` is first loaded from the \"name\" property (line 170), then immediately overwritten by the \"board_type\" property (line 172) before the \"name\" value is ever used. The subsequent `strstr(prop, \"afb\")` (line 175) is therefore run against the binary 4-byte board_type value instead of the intended \"name\" string, and worse, if the \"board_type\" property does not exist `sparcPromGetProperty()` returns NULL, so `strstr(NULL, \"afb\")` dereferences a NULL pointer and crashes. The \"name\" fetch is effectively dead code and the afb/Elite3D detection is broken.","fix":"Run the afb test on the `name` property and NULL-guard both fetches. For example:\n```c\ncase SBUS_DEVICE_FFB: {\n    char *name = sparcPromGetProperty(&psdp->node, \"name\", &len);\n    chiprev = 0;\n    prop = sparcPromGetProperty(&psdp->node, \"board_type\", &len);\n    if (prop && len == 4)\n        chiprev = *(int *) prop;\n    if (name && strstr(name, \"afb\")) {\n        if (chiprev == 3)\n            psdp->descr = \"Sun|Elite3D-M6 Horizontal\";\n    } else {\n        ...\n    }\n}\n```","locations":[{"ref":"hw/xfree86/common/xf86sbusBus.c:172-180","code":"  172 |                 prop = sparcPromGetProperty(&psdp->node, \"name\", &len);\n  173 |                 chiprev = 0;\n  174 |                 prop = sparcPromGetProperty(&psdp->node, \"board_type\", &len);\n  175 |                 if (prop && len == 4)\n  176 |                     chiprev = *(int *) prop;\n  177 |                 if (strstr(prop, \"afb\")) {\n  178 |                     if (chiprev == 3)\n  179 |                         psdp->descr = \"Sun|Elite3D-M6 Horizontal\";\n  180 |                 }","lines":9,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/common/xf86sbusBus.c#L172-L180"}]},
{"id":"LOGIC_59","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"xf86IsScreenPrimary() passes the loop counter `i` (a per-screen entity slot index 0..numEntities-1) directly to xf86IsEntityPrimary(), which uses its argument to index the global `xf86Entities[]` array. It must pass the global entity index `pScrn->entityList[i]` instead (compare the correct usage in xf86Configure.c:748 `xf86IsEntityPrimary(xf86Screens[l]->entityList[n])`). As written it checks the wrong entities (usually xf86Entities[0]), returning an incorrect primary-screen result; if a screen's numEntities exceeds xf86NumEntities it also reads out of bounds.","fix":"Index the screen's entity list:\n```c\nfor (i = 0; i < pScrn->numEntities; i++) {\n    if (xf86IsEntityPrimary(pScrn->entityList[i]))\n        return TRUE;\n}\n```","locations":[{"ref":"hw/xfree86/compat/xf86Helper.c:27-30","code":"   27 |     for (i = 0; i < pScrn->numEntities; i++) {\n   28 |         if (xf86IsEntityPrimary(i))\n   29 |             return TRUE;\n   30 |     }","lines":4,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/compat/xf86Helper.c#L27-L30"}]},
{"id":"LOGIC_60","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"ProcDPMSCapable() always returns `capable = TRUE` regardless of whether any screen actually supports DPMS. The extension is only registered when DPMSSupported() returns TRUE, so in practice this is consistent - but if the capability changes at runtime (screens are added/removed), the reply would be stale. More importantly, the reply is hardcoded rather than calling DPMSSupported() dynamically.","fix":"Change the reply to `capable = DPMSSupported()` so it reflects the actual current state rather than always returning TRUE.","locations":[{"ref":"Xext/dpms/dpms.c:259-268","code":"  259 | ProcDPMSCapable(ClientPtr client)\n  260 | {\n  261 |     X_REQUEST_HEAD_STRUCT(xDPMSCapableReq);\n  262 | \n  263 |     xDPMSCapableReply reply = {\n  264 |         .capable = TRUE\n  265 |     };\n  266 | \n  267 |     return X_SEND_REPLY_SIMPLE(client, reply);\n  268 | }","lines":10,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/dpms/dpms.c#L259-L268"}]},
{"id":"LOGIC_61","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In DRI2CanFlip(), the condition `pDraw->x != pWinPixmap->screen_x` checks that the drawable's x matches the pixmap's screen_x. However, the preceding condition already checked `pDraw->x != 0`, so this second check is partially redundant. More importantly, the check combines `pDraw->x != 0 || pDraw->x != pWinPixmap->screen_x` which evaluates to `pDraw->x != 0` whenever screen_x is also 0 (the common case) and to TRUE whenever they differ. The logic intent is to require both `x == 0` AND `x == screen_x`, but since both are checked against 0 implicitly, the combined condition is overly broad for non-zero screen_x origins.","fix":"The condition is logically correct for the zero-origin common case but the double-check of x/y against 0 and then against screen_x/screen_y is redundant. Simplify to just `pDraw->x != pWinPixmap->screen_x || pDraw->y != pWinPixmap->screen_y` since that subsumes the `!= 0` checks when screen_x/y are 0.","locations":[{"ref":"Xext/dri2/dri2.c:928-931","code":"  928 |     if (pDraw->x != 0 || pDraw->y != 0 ||\n  929 |         pDraw->x != pWinPixmap->screen_x || pDraw->y != pWinPixmap->screen_y ||\n  930 |         pDraw->width != pWinPixmap->drawable.width ||\n  931 |         pDraw->height != pWinPixmap->drawable.height)","lines":4,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/dri2/dri2.c#L928-L931"}]},
{"id":"LOGIC_62","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In __glXDisp_SwapBuffers(), pGlxDraw->type is compared against DRAWABLE_WINDOW (the X drawable type constant, value 0 from pixmap.h) instead of GLX_DRAWABLE_WINDOW (the GLX-private enum, also value 0 from glxdrawable.h). While these constants happen to share the same numeric value today, mixing the two enumerations is semantically wrong and fragile.","fix":"Change 'pGlxDraw->type == DRAWABLE_WINDOW' to 'pGlxDraw->type == GLX_DRAWABLE_WINDOW' to use the correct enum namespace.","locations":[{"ref":"Xext/glx/glxcmds.c:1602","code":" 1602 |     if (pGlxDraw->type == DRAWABLE_WINDOW &&","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/glxcmds.c#L1602"}]},
{"id":"LOGIC_63","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"__glXRemoveFromContextList is missing a break after it removes cx from the list. After executing `prev->next = c->next` the loop continues, setting prev = cx (the just-removed, possibly-freed-later element) and iterating the remaining nodes. Since cx is unique in the list this does not corrupt state, but it wastes iterations and leaves prev dangling for the rest of the loop body.","fix":"Add `break;` immediately after `prev->next = c->next;` on line 161 to stop scanning once the element is found and removed.","locations":[{"ref":"Xext/glx/glxext.c:163-173","code":"  163 |     if (cx == glxAllContexts)\n  164 |         glxAllContexts = cx->next;\n  165 |     else {\n  166 |         prev = glxAllContexts;\n  167 |         for (c = glxAllContexts; c; c = c->next) {\n  168 |             if (c == cx)\n  169 |                 prev->next = c->next;\n  170 |             prev = c;\n  171 |         }\n  172 |     }\n  173 | }","lines":11,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/glxext.c#L163-L173"}]},
{"id":"LOGIC_64","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The global `static GLboolean errorOccured` in glxext.c is process-global state used to communicate GL errors between `__glXErrorCallBack` and callers in singlepix.c. There is no re-entrancy guard: if a GL call that triggers the callback happens to be interleaved (or if the callback fires during a different client's request via a nested dispatch), the flag can be spuriously cleared or read by the wrong caller. The misspelling 'Occured' (one 'r') is also inconsistent with the English word 'occurred'.","fix":"The global-flag pattern is inherently fragile. At minimum rename to `errorOccurred` for clarity. A more robust fix would pass an error-context pointer through the GL error callback registration rather than using a global.","locations":[{"ref":"Xext/glx/glxext.c:217-243","code":"  217 | static GLboolean errorOccured = GL_FALSE;\n  218 | \n  219 | /*\n  220 | ** The GL was will call this routine if an error occurs.\n  221 | */\n  222 | void\n  223 | __glXErrorCallBack(GLenum code)\n  224 | {\n  225 |     errorOccured = GL_TRUE;\n  226 | }\n  227 | \n  228 | /*\n  229 | ** Clear the error flag before calling the GL command.\n  230 | */\n  231 | void\n  232 | __glXClearErrorOccured(void)\n  233 | {\n  234 |     errorOccured = GL_FALSE;\n  235 | }\n  236 | \n  237 | /*\n  238 | ** Check if the GL command caused an error.\n  239 | */\n  240 | GLboolean\n  241 | __glXErrorOccured(void)\n  242 | {\n  243 |     return errorOccured;","lines":27,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/glxext.c#L217-L243"},{"ref":"Xext/glx/glxext.h:60-62","code":"   60 | extern void __glXErrorCallBack(GLenum code);\n   61 | extern void __glXClearErrorOccured(void);\n   62 | extern GLboolean __glXErrorOccured(void);","lines":3,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/glxext.h#L60-L62"}]},
{"id":"LOGIC_65","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In xorgGlxThunkRequest, when `resource` is 0 (i.e. the request is not a resource-creation request - including all destroy and query cases), the tail `if (ret != Success) glxServer.removeXIDMap(resource)` unconditionally calls `removeXIDMap(0)`. For the X_GLXvop_DestroyGLXPbufferSGIX case in particular, a failure from forwardRequest means the pbuffer's XID map entry was not removed (the success-path removal at line 439 was not reached), yet the cleanup call uses XID 0 instead of the actual pbuffer XID. The pbuffer mapping leaks on failure.","fix":"For the Destroy case, track the pbuffer XID separately and call `glxServer.removeXIDMap(pbufferXid)` on failure, just as the success path does. Guard the final `removeXIDMap(resource)` with `if (resource)` to avoid the unnecessary removeXIDMap(0) for non-create paths.","locations":[{"ref":"Xext/glx/glxext.c:445-453","code":"  445 |     if (ret == Success && vendorCode == X_GLXvop_DestroyGLXPbufferSGIX) {\n  446 |         xGLXDestroyGLXPbufferSGIXReq *req = (void *)stuff;\n  447 |         glxServer.removeXIDMap(maybe_swap32(client, req->pbuffer));\n  448 |     }\n  449 | \n  450 |     if (ret != Success)\n  451 |         glxServer.removeXIDMap(resource);\n  452 | \n  453 |     return ret;","lines":9,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/glxext.c#L445-L453"}]},
{"id":"LOGIC_66","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"__glXTexImage3DReqSize (indirect_reqsize.c:571-572) returns 0 when the CARD32 field at pc+76 is\nnon-zero (the 'null image' flag). This correctly signals 'no pixel data'. However the caller\n(__glXGetProtocolSizeData / the render dispatch loop) treats a return of 0 from the size function\nas 'variable part has zero bytes', not as 'this variant is different from the fixed-size entry'.\nThe fixed-size entry for TexImage3D in Render_size_table[282] is {84, 48} (84 fixed bytes, size\nfunction index 48). If the size function returns 0 for the null-image variant, the total validated\nlength is 84 bytes, which is correct. But the comment at pc+76 is not documented; future maintainers\nmay not realize that returning 0 here has a special meaning different from an error.","fix":"Add a comment explaining that returning 0 here means 'no variable data' for the null-image fast path, not an error.","locations":[{"ref":"Xext/glx/indirect_reqsize.c:571-572","code":"  571 |     if (*(CARD32 *) (pc + 76))\n  572 |         return 0;","lines":2,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/indirect_reqsize.c#L571-L572"}]},
{"id":"LOGIC_67","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In __glXDispSwap_DrawArrays (render2swap.c:300-309), the first loop decodes numVals and datatype\nfrom compHeader by reading the fields and calling swapl on local copies. The stride is accumulated\nfrom these swapped locals. The second loop (lines 315-371) re-reads the same fields from compHeader\nand calls swapl again, getting the same (still unswapped in memory) values. This is redundant but\ncorrect. However it means the in-memory compHeader fields are never actually byte-swapped, so if\nany other code were to read them after this function, they would still be in wire-byte order.\nBy contrast, the hdr header fields (numVertexes, numComponents, primType) are swapped in-place via\npointer alias (swapl(&numVertexes) but numVertexes is a local copy - still not in-place). The code\nis correct but confusing and inconsistent: some fields appear to be swapped in-place (they are not;\nswapl operates on local copies) and the double-read pattern is redundant.","fix":"Swap compHeader fields in-place once, or store the swapped values in local variables and reuse them in the second loop to avoid re-reading and re-swapping.","locations":[{"ref":"Xext/glx/render2swap.c:300-309","code":"  300 |     for (i = 0; i < numComponents; i++) {\n  301 |         GLenum datatype = compHeader[i].datatype;\n  302 |         GLint numVals = compHeader[i].numVals;\n  303 |         GLenum component = compHeader[i].component;\n  304 | \n  305 |         swapl(&datatype);\n  306 |         swapl(&numVals);\n  307 |         swapl(&component);\n  308 | \n  309 |         stride += __GLX_PAD(numVals * __glXTypeSize(datatype));","lines":10,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/render2swap.c#L300-L309"},{"ref":"Xext/glx/render2swap.c:315-372","code":"  315 |     for (i = 0; i < numComponents; i++) {\n  316 |         GLenum datatype = compHeader[i].datatype;\n  317 |         GLint numVals = compHeader[i].numVals;\n  318 |         GLenum component = compHeader[i].component;\n  319 | \n  320 |         swapl(&datatype);\n  321 |         swapl(&numVals);\n  322 |         swapl(&component);\n  323 | \n  324 |         swapArray(numVals, datatype, stride, numVertexes, pc);\n  325 | \n  326 |         switch (component) {\n  327 |         case GL_VERTEX_ARRAY:\n  328 |             glEnableClientState(GL_VERTEX_ARRAY);\n  329 |             glVertexPointer(numVals, datatype, stride, pc);\n  330 |             break;\n  331 |         case GL_NORMAL_ARRAY:\n  332 |             glEnableClientState(GL_NORMAL_ARRAY);\n  333 |             glNormalPointer(datatype, stride, pc);\n  334 |             break;\n  335 |         case GL_COLOR_ARRAY:\n  336 |             glEnableClientState(GL_COLOR_ARRAY);\n  337 |             glColorPointer(numVals, datatype, stride, pc);\n  338 |             break;\n  339 |         case GL_INDEX_ARRAY:\n  340 |             glEnableClientState(GL_INDEX_ARRAY);\n  341 |             glIndexPointer(datatype, stride, pc);\n  342 |             break;\n  343 |         case GL_TEXTURE_COORD_ARRAY:\n  344 |             glEnableClientState(GL_TEXTURE_COORD_ARRAY);\n  345 |             glTexCoordPointer(numVals, datatype, stride, pc);\n  346 |             break;\n  347 |         case GL_EDGE_FLAG_ARRAY:\n  348 |             glEnableClientState(GL_EDGE_FLAG_ARRAY);\n  349 |             glEdgeFlagPointer(stride, (const GLboolean *) pc);\n  350 |             break;\n  351 |         case GL_SECONDARY_COLOR_ARRAY:\n  352 |         {\n  353 |             PFNGLSECONDARYCOLORPOINTERPROC SecondaryColorPointerEXT =\n  354 |                 __glGetProcAddress(\"glSecondaryColorPointerEXT\");\n  355 |             glEnableClientState(GL_SECONDARY_COLOR_ARRAY);\n  356 |             SecondaryColorPointerEXT(numVals, datatype, stride, pc);\n  357 |             break;\n  358 |         }\n  359 |         case GL_FOG_COORD_ARRAY:\n  360 |         {\n  361 |             PFNGLFOGCOORDPOINTERPROC FogCoordPointerEXT =\n  362 |                 __glGetProcAddress(\"glFogCoordPointerEXT\");\n  363 |             glEnableClientState(GL_FOG_COORD_ARRAY);\n  364 |             FogCoordPointerEXT(datatype, stride, pc);\n  365 |             break;\n  366 |         }\n  367 |         default:\n  368 |             break;\n  369 |         }\n  370 | \n  371 |         pc += __GLX_PAD(numVals * __glXTypeSize(datatype));\n  372 |     }","lines":58,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/render2swap.c#L315-L372"}]},
{"id":"LOGIC_68","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In single2.c __glXDisp_RenderMode(), the non-swapped path does not call any X_REPLY_FIELD_CARD32() markers for the reply fields (retval, size, newMode), while the swap counterpart single2swap.c __glXDispSwap_RenderMode() explicitly marks all three fields with X_REPLY_FIELD_CARD32(). This asymmetry is suspicious: the non-swap path relies on the framework sending the reply fields without per-field byte-swapping annotations. If the reply framework requires these annotations to work correctly for all client endiannesses, the non-swap path may send incorrectly formatted replies to native-endian clients.","fix":"Add X_REPLY_FIELD_CARD32(retval), X_REPLY_FIELD_CARD32(size), and X_REPLY_FIELD_CARD32(newMode) before X_SEND_REPLY_WITH_RPCBUF in __glXDisp_RenderMode(), matching the swap variant.","locations":[{"ref":"Xext/glx/single2.c:200-211","code":"  200 |     /*\n  201 |      ** First reply is the number of elements returned in the feedback or\n  202 |      ** selection array, as per the API for glRenderMode itself.\n  203 |      */\n  204 |  noChangeAllowed:;\n  205 |     xGLXRenderModeReply reply = {\n  206 |         .retval = retval,\n  207 |         .size = nitems,\n  208 |         .newMode = newMode\n  209 |     };\n  210 | \n  211 |     return X_SEND_REPLY_WITH_RPCBUF(client, reply, rpcbuf);","lines":12,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/single2.c#L200-L211"},{"ref":"Xext/glx/single2swap.c:207-217","code":"  207 |  noChangeAllowed:;\n  208 |     xGLXRenderModeReply reply = {\n  209 |         .retval = retval,\n  210 |         .size = nitems,\n  211 |         .newMode = newMode\n  212 |     };\n  213 |     X_REPLY_FIELD_CARD32(retval);\n  214 |     X_REPLY_FIELD_CARD32(size);\n  215 |     X_REPLY_FIELD_CARD32(newMode);\n  216 | \n  217 |     return X_SEND_REPLY_WITH_RPCBUF(client, reply, rpcbuf);","lines":11,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/single2swap.c#L207-L217"}]},
{"id":"LOGIC_69","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"ht_destroy() in hashtable.c does not accept NULL and immediately dereferences the ht pointer (`ht->bucketBits`). GlxDispatchReset() in vndcmds.c calls ht_destroy(vendorPrivHash) and then sets vendorPrivHash = NULL. If GlxDispatchReset were ever called a second time before GlxDispatchInit re-creates the hash (e.g., by code added in the future), it would crash. The API contract is inconsistent with the pattern of the NULL-safe callers (vendorPrivHash starts as NULL).","fix":"Add a NULL guard at the top of ht_destroy: `if (!ht) return;`","locations":[{"ref":"Xext/hashtable.c:73-88","code":"   73 | ht_destroy(HashTable ht)\n   74 | {\n   75 |     int c;\n   76 |     BucketPtr it, tmp;\n   77 |     int numBuckets = 1 << ht->bucketBits;\n   78 |     for (c = 0; c < numBuckets; ++c) {\n   79 |         xorg_list_for_each_entry_safe(it, tmp, &ht->buckets[c], l) {\n   80 |             xorg_list_del(&it->l);\n   81 |             free(it->key);\n   82 |             free(it->data);\n   83 |             free(it);\n   84 |         }\n   85 |     }\n   86 |     free(ht->buckets);\n   87 |     free(ht);\n   88 | }","lines":16,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/hashtable.c#L73-L88"},{"ref":"Xext/glx/vndcmds.c:453-459","code":"  453 | void GlxDispatchReset(void)\n  454 | {\n  455 |     memset(dispatchFuncs, 0, sizeof(dispatchFuncs));\n  456 | \n  457 |     ht_destroy(vendorPrivHash);\n  458 |     vendorPrivHash = NULL;\n  459 | }","lines":7,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/vndcmds.c#L453-L459"}]},
{"id":"LOGIC_70","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"PanoramiXExtensionInit (panoramiX.c) stores `masterScreen->CreateGC` into\n`pScreenPriv->CreateGC` for every screen (line 472), not each screen's own\n`CreateGC`. When XineramaCreateGC later fires for a non-master screen, it\nrestores the GC's screen CreateGC pointer to masterScreen's function and calls\nit, invoking the wrong screen's CreateGC. If secondary screens have different\nCreateGC implementations (e.g., different hardware drivers), this silently calls\nthe wrong driver function.","fix":"Change line 472 to `pScreenPriv->CreateGC = walkScreen->CreateGC;` so each screen's original CreateGC is saved and later restored correctly.","locations":[{"ref":"Xext/panoramiX/panoramiX.c:464-476","code":"  464 |     XINERAMA_FOR_EACH_SCREEN_BACKWARD({\n  465 |         PanoramiXScreenPtr pScreenPriv = calloc(1, sizeof(PanoramiXScreenRec));\n  466 |         dixSetPrivate(&walkScreen->devPrivates, &PanoramiXScreenKeyRec,\n  467 |                       pScreenPriv);\n  468 |         if (!pScreenPriv) {\n  469 |             noPanoramiXExtension = TRUE;\n  470 |             return;\n  471 |         }\n  472 | \n  473 |         dixScreenHookClose(walkScreen, XineramaCloseScreen);\n  474 |         pScreenPriv->CreateGC = masterScreen->CreateGC;\n  475 |         walkScreen->CreateGC = XineramaCreateGC;\n  476 |     });","lines":13,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/panoramiX/panoramiX.c#L464-L476"}]},
{"id":"LOGIC_71","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In ProcSecurityGenerateAuthorization, `protodata` is advanced past the protocol-name region using `bytes_to_int32(nbytesAuthProto)` (the count of 4-byte words, i.e. nbytesAuthProto/4) rather than the padded byte length. `protoname` is a `char *`, so the pointer lands ~4x too early, inside the proto-name bytes instead of after them. When a client supplies non-zero auth data, GenerateAuthorization then reads the auth data from the wrong (overlapping, earlier) offset, corrupting authorization generation. The `len` word-count above uses bytes_to_int32 correctly; only this pointer arithmetic is wrong. No OOB (the wrong location is earlier in the same buffer), so it is a correctness bug; typically masked because most callers send empty auth data.","fix":"Use the padded byte count:\n```\n    protoname = (char *) &stuff[1];\n    protodata = protoname + pad_to_int32(stuff->nbytesAuthProto);\n```","locations":[{"ref":"Xext/security/security.c:493-494","code":"  493 |     protoname = (char *) &stuff[1];\n  494 |     protodata = protoname + bytes_to_int32(stuff->nbytesAuthProto);","lines":2,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/security/security.c#L493-L494"}]},
{"id":"LOGIC_72","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"XFixesSelectCursorInput() creates a useless zero-mask listener entry when a client selects cursor input with eventMask == 0 and no prior selection exists for that (client, window) pair. The `if (!eventMask)` block at the top only returns Success if it finds an existing entry to free; otherwise it falls through to the 'update existing entry' loop (no match) and then unconditionally allocates a new CursorEventRec, calls FakeClientID(), and AddResource() with eventMask == 0. The correct behavior (which the analogous select.c ProcXFixesSelectSelectionInput retains) is a no-op when clearing a non-existent selection. Here a client can allocate one dead listener + one server resource ID per (client, window) simply by deselecting cursor input it never selected, wasting memory and resource IDs.","fix":"Make the empty-mask path always return after attempting to clear, so no zero-mask entry is created:\n```c\n    /* clear any potentially existing entry */\n    if (!eventMask) {\n        CursorEventPtr walk;\n        xorg_list_for_each_entry(walk, &cursorListeners, entry) {\n            if (walk->pClient == pClient && walk->pWindow == pWindow) {\n                FreeResource(walk->clientResource, 0);\n                break;\n            }\n        }\n        return Success;\n    }\n```","locations":[{"ref":"Xext/xfixes/cursor.c:205-254","code":"  205 |     /* clear any potentially existing entry */\n  206 |     if (!eventMask) {\n  207 |         CursorEventPtr walk;\n  208 |         xorg_list_for_each_entry(walk, &cursorListeners, entry) {\n  209 |             if (walk->pClient == pClient && walk->pWindow == pWindow) {\n  210 |                 FreeResource(walk->clientResource, 0);\n  211 |                 return Success;\n  212 |             }\n  213 |         }\n  214 |     }\n  215 | \n  216 |     /* update existing entry */\n  217 |     CursorEventPtr walk;\n  218 |     xorg_list_for_each_entry(walk, &cursorListeners, entry) {\n  219 |         if (walk->pClient == pClient && walk->pWindow == pWindow) {\n  220 |             walk->eventMask = eventMask;\n  221 |             return Success;\n  222 |         }\n  223 |     }\n  224 | \n  225 |     /* create new entry */\n  226 |     {\n  227 |         CursorEventPtr e = calloc(1, sizeof(CursorEventRec));\n  228 |         if (!e)\n  229 |             return BadAlloc;\n  230 | \n  231 |         e->pClient = pClient;\n  232 |         e->pWindow = pWindow;\n  233 |         e->clientResource = FakeClientID(pClient->index);\n  234 |         e->eventMask = eventMask;\n  235 | \n  236 |         /*\n  237 |          * Add a resource hanging from the window to\n  238 |          * catch window destroy\n  239 |          */\n  240 |         rc = dixLookupResourceByType(&val, pWindow->drawable.id,\n  241 |                                      CursorWindowType, serverClient,\n  242 |                                      DixGetAttrAccess);\n  243 |         if (rc != Success)\n  244 |             if (!AddResource(pWindow->drawable.id, CursorWindowType,\n  245 |                              (void *) pWindow)) {\n  246 |                 free(e);\n  247 |                 return BadAlloc;\n  248 |             }\n  249 | \n  250 |         if (!AddResource(e->clientResource, CursorClientType, (void *) e))\n  251 |             return BadAlloc;\n  252 | \n  253 |         xorg_list_append(&e->entry, &cursorListeners);\n  254 |     }","lines":50,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/xfixes/cursor.c#L205-L254"}]},
{"id":"LOGIC_73","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"The `dev_type[]` table has 18 entries but MakeDeviceTypeAtoms only iterates `i < NUMTYPES` where NUMTYPES is defined as 15. As a result the last three device-type name atoms (XI_EYETRACKER, XI_CURSORKEYS, XI_FOOTMOUSE) are never pre-registered via dixAddAtom. The count constant does not match the actual array size, a maintenance hazard: adding/removing entries silently changes coverage. Impact is minor (those atoms are simply created lazily on demand later), but it is a clear count/array mismatch.","fix":"Iterate over the real array size instead of the stale NUMTYPES constant, e.g. `for (i = 0; i < ARRAY_SIZE(dev_type); i++)`, or update `#define NUMTYPES` to match the number of entries in `dev_type[]` (18).","locations":[{"ref":"Xext/xinput/extinit.c:107-129","code":"  107 | static struct dev_type {\n  108 |     Atom type;\n  109 |     const char *name;\n  110 | } dev_type[] = {\n  111 |     {0, XI_KEYBOARD},\n  112 |     {0, XI_MOUSE},\n  113 |     {0, XI_TABLET},\n  114 |     {0, XI_TOUCHSCREEN},\n  115 |     {0, XI_TOUCHPAD},\n  116 |     {0, XI_BARCODE},\n  117 |     {0, XI_BUTTONBOX},\n  118 |     {0, XI_KNOB_BOX},\n  119 |     {0, XI_ONE_KNOB},\n  120 |     {0, XI_NINE_KNOB},\n  121 |     {0, XI_TRACKBALL},\n  122 |     {0, XI_QUADRATURE},\n  123 |     {0, XI_ID_MODULE},\n  124 |     {0, XI_SPACEBALL},\n  125 |     {0, XI_DATAGLOVE},\n  126 |     {0, XI_EYETRACKER},\n  127 |     {0, XI_CURSORKEYS},\n  128 |     {0, XI_FOOTMOUSE}\n  129 | };","lines":23,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/xinput/extinit.c#L107-L129"},{"ref":"Xext/xinput/extinit.c:1053-1054","code":" 1053 |     for (i = 0; i < NUMTYPES; i++)\n 1054 |         dev_type[i].type = dixAddAtom(dev_type[i].name);","lines":2,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/xinput/extinit.c#L1053-L1054"}]},
{"id":"LOGIC_74","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"XkbDDXChangeControls() computes `changed = new->enabled_ctrls ^ old->enabled_ctrls` and then, when a per-key-repeat byte differs, does `changed &= XkbPerKeyRepeatMask`. XkbPerKeyRepeatMask is a controls-component bit, not an enabled_ctrls bit, so it is essentially never present in `changed`; the `&=` therefore clears `changed` to 0 rather than flagging the per-key-repeat change. The subsequent `if (changed & XkbPerKeyRepeatMask)` then never fires, so the keyboard feedback CtrlProc is not notified of per-key auto-repeat changes. The code clearly intends `|=` (the trailing `if` only makes sense that way). Longstanding, but a genuine defect.","fix":"before:\n```c\n            changed &= XkbPerKeyRepeatMask;\n```\nafter:\n```c\n            changed |= XkbPerKeyRepeatMask;\n```","locations":[{"ref":"Xext/xkeyboard/ddxCtrls.c:74","code":"   74 |             changed &= XkbPerKeyRepeatMask;","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/xkeyboard/ddxCtrls.c#L74"}]},
{"id":"LOGIC_75","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"hard","description":"The byte-swap of the variable-length indicator payload in SetDeviceInfo is performed in place inside CheckSetDeviceIndicators (swaps ledWire->ledClass/ledID/namesPresent/mapsPresent/physIndicators, atomWire atoms, and mapWire fields). _XkbSetDeviceInfoCheck is then invoked once for `dev` and again for every matching slave when deviceSpec is XkbUseCoreKbd/XkbUseCorePtr, so for a byte-swapped client the same request bytes are swapped once per device. With an even number of check calls the data ends up back in wire order and the subsequent apply (SetDeviceIndicators, which does not swap) misinterprets it, setting bogus indicator names/maps or failing with spurious BadAtom/BadValue. ProcXkbSetMap avoids exactly this by threading an explicit doswap flag; the SetDeviceInfo/SetNames/SetGeometry paths do not. Pre-existing, requires swapped client + core device + slave keyboards, and is bounds-checked so not memory-unsafe.","fix":"Do the in-place byte-swap of the request payload exactly once, before the per-device check/apply loop (or pass a doswap flag as ProcXkbSetMap does so only the first CheckSetDeviceIndicators call swaps), so repeated invocations for sibling devices operate on already-host-order data.","locations":[{"ref":"Xext/xkeyboard/xkb.c:6530-6536","code":" 6530 |         if (client->swapped) {\n 6531 |             swaps(&ledWire->ledClass);\n 6532 |             swaps(&ledWire->ledID);\n 6533 |             swapl(&ledWire->namesPresent);\n 6534 |             swapl(&ledWire->mapsPresent);\n 6535 |             swapl(&ledWire->physIndicators);\n 6536 |         }","lines":7,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/xkeyboard/xkb.c#L6530-L6536"},{"ref":"Xext/xkeyboard/xkb.c:6807-6826","code":" 6807 |     rc = _XkbSetDeviceInfoCheck(client, dev, stuff);\n 6808 | \n 6809 |     if (rc != Success)\n 6810 |         return rc;\n 6811 | \n 6812 |     if (stuff->deviceSpec == XkbUseCoreKbd ||\n 6813 |         stuff->deviceSpec == XkbUseCorePtr) {\n 6814 |         DeviceIntPtr other;\n 6815 | \n 6816 |         for (other = inputInfo.devices; other; other = other->next) {\n 6817 |             if (((other != dev) && !InputDevIsMaster(other) &&\n 6818 |                  GetMaster(other, MASTER_KEYBOARD) == dev) &&\n 6819 |                 ((stuff->deviceSpec == XkbUseCoreKbd && other->key) ||\n 6820 |                  (stuff->deviceSpec == XkbUseCorePtr && other->button))) {\n 6821 |                 rc = dixCallDeviceAccessCallback(client, other, DixManageAccess);\n 6822 |                 if (rc == Success) {\n 6823 |                     rc = _XkbSetDeviceInfoCheck(client, other, stuff);\n 6824 |                     if (rc != Success)\n 6825 |                         return rc;\n 6826 |                 }","lines":20,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/xkeyboard/xkb.c#L6807-L6826"}]},
{"id":"LOGIC_76","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In ReadXkmGeometry the color indices `wireGeom.base_color_ndx` and `wireGeom.label_color_ndx` are read from the file and used unvalidated to index `geom->colors`, which was allocated with only `wireGeom.num_colors` entries. If either index is >= num_colors (or num_colors is 0), `geom->base_color`/`geom->label_color` are set to pointers outside the colors array, which are later dereferenced by geometry consumers/free code (out-of-bounds access). Unlike the shape primary/approx indices below (which are range-checked against num_outlines), these are not checked.","fix":"Validate the indices before taking their address, e.g. only set `geom->base_color`/`geom->label_color` when `wireGeom.base_color_ndx < wireGeom.num_colors` (resp. label_color_ndx), otherwise leave them at a safe default (colors[0] when num_colors>0, else NULL).","locations":[{"ref":"Xext/xkeyboard/xkmread.c:1086-1096","code":" 1086 |     if (wireGeom.num_colors > 0) {\n 1087 |         for (i = 0; i < wireGeom.num_colors; i++) {\n 1088 |             nRead += XkmGetCountedString(file, buf, 100);\n 1089 |             if (XkbAddGeomColor(geom, buf, i) == NULL) {\n 1090 |                 _XkbLibError(_XkbErrBadAlloc, \"ReadXkmGeometry\", 0);\n 1091 |                 return nRead;\n 1092 |             }\n 1093 |         }\n 1094 |     }\n 1095 |     geom->base_color = &geom->colors[wireGeom.base_color_ndx];\n 1096 |     geom->label_color = &geom->colors[wireGeom.label_color_ndx];","lines":11,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/xkeyboard/xkmread.c#L1086-L1096"}]},
{"id":"LOGIC_77","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In device_added() the pnp_id sysattr is read from the immediate parent into a local `pnp_id` (line 157), but `attrs.pnp_id` is only ever assigned inside the `while (!pnp_id && ...)` loop. When the immediate parent already exposes an `id` sysattr (the common case), the loop guard `!pnp_id` is false, the loop body never runs, and `attrs.pnp_id` stays NULL. The parent's PnP ID is therefore silently discarded, so InputClass rules using MatchPnPID fail to match for those devices. This is a regression versus the previous code which assigned `attrs.pnp_id = strdup(pnp_id)` before/independent of the walk-up loop.","fix":"Assign the immediate-parent id before the walk-up loop and let the loop only handle the not-found case:\n```c\nconst char *pnp_id = udev_device_get_sysattr_value(parent, \"id\");\n...\nif (pnp_id)\n    attrs.pnp_id = strdup(pnp_id);\nLOG_SYSATTR(ppath, \"id\", pnp_id);\n...\nwhile (!attrs.pnp_id && (parent = udev_device_get_parent(parent))) {\n    pnp_id = udev_device_get_sysattr_value(parent, \"id\");\n    if (!pnp_id)\n        continue;\n    attrs.pnp_id = strdup(pnp_id);\n    ppath = udev_device_get_devnode(parent);\n    LOG_SYSATTR(ppath, \"id\", pnp_id);\n}\n```","locations":[{"ref":"config/udev.c:158-188","code":"  158 |         const char *pnp_id = udev_device_get_sysattr_value(parent, \"id\");\n  159 |         unsigned int usb_vendor, usb_model;\n  160 | \n  161 |         name = udev_device_get_sysattr_value(parent, \"name\");\n  162 |         LOG_SYSATTR(ppath, \"name\", name);\n  163 |         if (!name) {\n  164 |             name = udev_device_get_property_value(parent, \"NAME\");\n  165 |             LOG_PROPERTY(ppath, \"NAME\", name);\n  166 |         }\n  167 | \n  168 |         /* construct USB ID in lowercase hex - \"0000:ffff\" */\n  169 |         if (product &&\n  170 |             sscanf(product, \"%*x/%4x/%4x/%*x\", &usb_vendor, &usb_model) == 2) {\n  171 |             char *usb_id;\n  172 |             if (asprintf(&usb_id, \"%04x:%04x\", usb_vendor, usb_model)\n  173 |                 == -1)\n  174 |                 usb_id = NULL;\n  175 |             else\n  176 |                 LOG_PROPERTY(ppath, \"PRODUCT\", product);\n  177 |             attrs.usb_id = usb_id;\n  178 |         }\n  179 | \n  180 |         while (!pnp_id && (parent = udev_device_get_parent(parent))) {\n  181 |             pnp_id = udev_device_get_sysattr_value(parent, \"id\");\n  182 |             if (!pnp_id)\n  183 |                 continue;\n  184 | \n  185 |             attrs.pnp_id = strdup(pnp_id);\n  186 |             ppath = udev_device_get_devnode(parent);\n  187 |             LOG_SYSATTR(ppath, \"id\", pnp_id);\n  188 |         }","lines":31,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/config/udev.c#L158-L188"}]},
{"id":"LOGIC_78","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"num_keys is computed as `max_key_code - min_key_code` without the +1, both when filling the wire event (FixDeviceStateNotify) and when deciding whether a second deviceKeyStateNotify event is needed (`if (nkeys > 32)`). The real key count is max_key_code - min_key_code + 1. As a result num_keys reported to the client is one too small, and a device with exactly 33 keys (max-min+1==33 -> nkeys computed as 32) fails the `nkeys > 32` test, so key bit 32 (the 33rd key) is never sent in a deviceKeyStateNotify. Compare appendKeyInfo() in eventconvert.c which correctly uses `max_keycode - min_keycode + 1`.","fix":"Add the missing +1 in both places, e.g. `ev->num_keys = k->xkbInfo->desc->max_key_code - k->xkbInfo->desc->min_key_code + 1;` and `nkeys = k->xkbInfo->desc->max_key_code - k->xkbInfo->desc->min_key_code + 1;` (verify against the wire-field width and the >32 threshold semantics before changing).","locations":[{"ref":"dix/enterleave.c:656-658","code":"  656 |         ev->num_keys = k->xkbInfo->desc->max_key_code -\n  657 |             k->xkbInfo->desc->min_key_code;\n  658 |         memmove((char *) &ev->keys[0], (char *) k->down, 4);","lines":3,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/dix/enterleave.c#L656-L658"},{"ref":"dix/enterleave.c:715-718","code":"  715 |     if ((k = dev->key) != NULL) {\n  716 |         nkeys = k->xkbInfo->desc->max_key_code - k->xkbInfo->desc->min_key_code;\n  717 |         if (nkeys > 32) /* first 32 are encoded in deviceStateNotify */\n  718 |             evcount++;","lines":4,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/dix/enterleave.c#L715-L718"}]},
{"id":"LOGIC_79","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"check_modmap_change() validates that no *new* modifier keycode is down over the inclusive range [min_key_code, max_key_code] (line 152 rejects i > max_key_code), but the loop that checks whether any *old* modifier key is currently down iterates with `i < xkb->max_key_code`, skipping the key at max_key_code. A modifier mapped to the highest keycode that is currently held down will not block the map change (MappingBusy is not returned), so the modifier map can be changed while that key is pressed.","fix":"Use an inclusive bound to match the valid keycode range:\n```c\n    for (int i = xkb->min_key_code; i <= xkb->max_key_code; i++) {\n```","locations":[{"ref":"dix/inpututils.c:167-174","code":"  167 |     for (int i = xkb->min_key_code; i < xkb->max_key_code; i++) {\n  168 |         if (!xkb->map->modmap[i])\n  169 |             continue;\n  170 |         if (key_is_down(dev, i, KEY_POSTED | KEY_PROCESSED)) {\n  171 |             client->errorValue = i;\n  172 |             return MappingBusy;\n  173 |         }\n  174 |     }","lines":8,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/dix/inpututils.c#L167-L174"}]},
{"id":"LOGIC_80","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"CopySprite() grows dst->spriteTrace to `src->spriteTraceSize` entries via reallocarray, but then records the capacity as `src->spriteTraceGood` (the number of valid entries, always <= spriteTraceSize). This under-reports the real allocation size, so subsequent CopySprite() calls will reallocate again unnecessarily whenever spriteTraceGood is between the recorded and the actual capacity. The recorded size no longer reflects the buffer that was actually allocated.","fix":"Record the size actually allocated:\n```c\n        dst->spriteTrace = trace;\n        dst->spriteTraceSize = src->spriteTraceSize;\n```","locations":[{"ref":"dix/inpututils.c:1237-1246","code":" 1237 |     if (src->spriteTraceGood > dst->spriteTraceSize) {\n 1238 |         trace = reallocarray(dst->spriteTrace,\n 1239 |                              src->spriteTraceSize, sizeof(*trace));\n 1240 |         if (!trace) {\n 1241 |             dst->spriteTraceGood = 0;\n 1242 |             return FALSE;\n 1243 |         }\n 1244 |         dst->spriteTrace = trace;\n 1245 |         dst->spriteTraceSize = src->spriteTraceGood;\n 1246 |     }","lines":10,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/dix/inpututils.c#L1237-L1246"}]},
{"id":"LOGIC_81","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"AccelerationDefaultCleanup() sets dev->valuator->accelScheme.AccelSchemeProc = NULL BEFORE calling DeletePredictableAccelerationProperties(). Inside that function, vel = GetDevicePredictableAccelData(dev) always returns NULL now, because GetDevicePredictableAccelData() requires AccelSchemeProc == acceleratePointerPredictable. As a result the `if (vel)` block that calls XIUnregisterPropertyHandler() for each of the 4 registered handlers is dead code and is never executed, so the property handlers are never unregistered (leak / stale handlers) while scheme->prop_handlers is freed just below.","fix":"Unregister the handlers unconditionally (they were registered unconditionally in InitializePredictableAccelerationProperties), or capture vel before AccelSchemeProc is cleared. E.g. drop the `if (vel)` guard around the XIUnregisterPropertyHandler loop, since scheme->prop_handlers is valid regardless of vel.","locations":[{"ref":"dix/ptrveloc.c:421-426","code":"  421 |     vel = GetDevicePredictableAccelData(dev);\n  422 |     if (vel) {\n  423 |         for (int i = 0; i < scheme->num_prop_handlers; i++)\n  424 |             if (scheme->prop_handlers[i])\n  425 |                 XIUnregisterPropertyHandler(dev, scheme->prop_handlers[i]);\n  426 |     }","lines":6,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/dix/ptrveloc.c#L421-L426"},{"ref":"dix/ptrveloc.c:182-190","code":"  182 |         input_lock();\n  183 |         dev->valuator->accelScheme.AccelSchemeProc = NULL;\n  184 |         FreeVelocityData(vel);\n  185 |         free(vel);\n  186 |         DeletePredictableAccelerationProperties(dev,\n  187 |                                                 (PredictableAccelSchemePtr)\n  188 |                                                 dev->valuator->accelScheme.\n  189 |                                                 accelData);\n  190 |         free(dev->valuator->accelScheme.accelData);","lines":9,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/dix/ptrveloc.c#L182-L190"}]},
{"id":"LOGIC_82","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"dixLookupSelection inserts a freshly allocated Selection into the global CurrentSelections list BEFORE the XaceHookSelectionAccess security check. If that check fails, the empty placeholder Selection remains permanently in the global list. It is also reachable from read-only paths (ProcGetSelectionOwner calls it with DixGetAttrAccess), so merely querying the owner of an unused selection atom permanently allocates a Selection record, allowing a client to accumulate entries.","fix":"Only link the new Selection into CurrentSelections after the Xace check succeeds (allocate, run the check on the local object, and prepend to the list only on Success), or unlink and free it when the check fails.","locations":[{"ref":"dix/selection.c:87-104","code":"   87 |     if (!pSel) {\n   88 |         pSel = dixAllocateObjectWithPrivates(Selection, PRIVATE_SELECTION);\n   89 |         if (!pSel)\n   90 |             return BadAlloc;\n   91 |         pSel->selection = selectionName;\n   92 |         pSel->next = CurrentSelections;\n   93 |         CurrentSelections = pSel;\n   94 |     }\n   95 | \n   96 |     /* security creation/labeling check */\n   97 |     rc = XaceHookSelectionAccess(client, &pSel, access_mode | DixCreateAccess);\n   98 |     if (rc != Success) {\n   99 |         return rc;\n  100 |     }\n  101 | \n  102 |     *result = pSel;\n  103 |     return rc;\n  104 | }","lines":18,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/dix/selection.c#L87-L104"}]},
{"id":"LOGIC_83","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In glamor_copy_fbo_fbo_draw() GL_SCISSOR_TEST is enabled (line 451) and the GLAMOR_VERTEX_POS array is enabled (line 427). The two BUG_RETURN_VAL(!src_priv/!dst_priv, FALSE) checks at lines 453 and 465 return FALSE directly instead of jumping to bail_ctx, skipping the cleanup that disables scissor test, disables the vertex attrib array, and clears the MESA tile-raster-order state. If these BUG conditions ever fire, GL state is left dirty and corrupts subsequent rendering.","fix":"Replace the two `BUG_RETURN_VAL(..., FALSE)` calls with a bug-logged `goto bail_ctx;` (e.g. `if (!src_priv) { __glamor_bug(); goto bail_ctx; }`) so the scissor/vertex-array/tile-order cleanup at bail_ctx always runs.","locations":[{"ref":"glamor/glamor_copy.c:455-467","code":"  455 |     BUG_RETURN_VAL(!src_priv, FALSE);\n  456 | \n  457 |     glamor_pixmap_loop(src_priv, src_box_index) {\n  458 |         BoxPtr src_box = glamor_pixmap_box_at(src_priv, src_box_index);\n  459 | \n  460 |         args.dx = dx + src_off_x - src_box->x1;\n  461 |         args.dy = dy + src_off_y - src_box->y1;\n  462 |         args.src = glamor_pixmap_fbo_at(src_priv, src_box_index);\n  463 | \n  464 |         if (!glamor_use_program(dst, gc, prog, &args))\n  465 |             goto bail_ctx;\n  466 | \n  467 |         BUG_RETURN_VAL(!dst_priv, FALSE);","lines":13,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/glamor/glamor_copy.c#L455-L467"}]},
{"id":"LOGIC_84","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"EphyrKeyboardInit() uses the KeySymsRec keySyms without initializing it when hostx_load_keymap() fails: the assignment `ki->minScanCode = keySyms.minKeyCode; ki->maxScanCode = keySyms.maxKeyCode;` runs unconditionally after the `if (hostx_load_keymap(...))` block and reads uninitialized stack memory in the failure path. Additionally the calloc() for ki->driverPrivate is not checked for NULL, and EphyrKeyboardEnable/Disable later dereference it unconditionally.","fix":"Move the `ki->minScanCode/maxScanCode` assignments inside the `if (hostx_load_keymap(...))` block (or zero-initialize keySyms), and check the result of the driverPrivate calloc(), returning BadAlloc on failure.","locations":[{"ref":"hw/kdrive/ephyr/ephyr.c:1465-1492","code":" 1465 | EphyrKeyboardInit(KdKeyboardInfo * ki)\n 1466 | {\n 1467 |     KeySymsRec keySyms;\n 1468 |     CARD8 modmap[MAP_LENGTH];\n 1469 |     XkbControlsRec controls;\n 1470 | \n 1471 |     ki->driverPrivate = (EphyrKbdPrivate *)\n 1472 |         calloc(1, sizeof(EphyrKbdPrivate));\n 1473 | \n 1474 |     if (hostx_load_keymap(&keySyms, modmap, &controls)) {\n 1475 |         XkbApplyMappingChange(ki->dixdev, &keySyms,\n 1476 |                               keySyms.minKeyCode,\n 1477 |                               keySyms.maxKeyCode - keySyms.minKeyCode + 1,\n 1478 |                               modmap, serverClient);\n 1479 |         XkbDDXChangeControls(ki->dixdev, &controls, &controls);\n 1480 |         free(keySyms.map);\n 1481 |     }\n 1482 | \n 1483 |     ki->minScanCode = keySyms.minKeyCode;\n 1484 |     ki->maxScanCode = keySyms.maxKeyCode;\n 1485 | \n 1486 |     if (ki->name != NULL) {\n 1487 |         free(ki->name);\n 1488 |     }\n 1489 | \n 1490 |     ki->name = strdup(\"Xephyr virtual keyboard\");\n 1491 |     ephyrKbd = ki;\n 1492 |     return Success;","lines":28,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/kdrive/ephyr/ephyr.c#L1465-L1492"}]},
{"id":"LOGIC_85","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In ephyrXVPrivQueryHostAdaptors() the adaptor iterator is advanced with xcb_xv_adaptor_info_next(&it) only at the very end of the loop body, but the loop contains multiple `continue` statements (nPorts<=0, base_port_id<0, translate_video_encodings failure, translate_xv_attributes failure, translate_xv_image_formats failure). Any of those continues skips the iterator advance, so subsequent iterations read the wrong (stale) host adaptor via it.data while still indexing a_this->adaptors[i] by i, corrupting the parsed adaptor table.","fix":"Move `xcb_xv_adaptor_info_next(&it);` to the top of the loop body (advancing a separate cursor) or ensure every code path that ends the iteration advances the iterator, e.g. put the advance in a `for` update clause or before each `continue`.","locations":[{"ref":"hw/kdrive/ephyr/ephyrvideo.c:486-562","code":"  486 |     for (i = 0; i < a_this->num_adaptors; i++) {\n  487 |         xcb_xv_adaptor_info_t *cur_host_adaptor = it.data;\n  488 |         xcb_xv_format_t *format = xcb_xv_adaptor_info_formats(cur_host_adaptor);\n  489 |         int j = 0;\n  490 | \n  491 |         a_this->adaptors[i].nPorts = cur_host_adaptor->num_ports;\n  492 |         if (a_this->adaptors[i].nPorts <= 0) {\n  493 |             EPHYR_LOG_ERROR(\"Could not find any port of adaptor %d\\n\", i);\n  494 |             continue;\n  495 |         }\n  496 |         a_this->adaptors[i].type = cur_host_adaptor->type;\n  497 |         a_this->adaptors[i].type |= XvWindowMask;\n  498 |         a_this->adaptors[i].flags =\n  499 |             VIDEO_OVERLAID_IMAGES | VIDEO_CLIP_TO_VIEWPORT;\n  500 |         a_this->adaptors[i].name =\n  501 |             strndup(xcb_xv_adaptor_info_name(cur_host_adaptor),\n  502 |                     cur_host_adaptor->name_size);\n  503 |         if (!a_this->adaptors[i].name)\n  504 |             a_this->adaptors[i].name = strdup(\"Xephyr Video Overlay\");\n  505 |         base_port_id = cur_host_adaptor->base_id;\n  506 |         if (base_port_id < 0) {\n  507 |             EPHYR_LOG_ERROR(\"failed to get port id for adaptor %d\\n\", i);\n  508 |             continue;\n  509 |         }\n  510 |         if (!s_base_port_id)\n  511 |             s_base_port_id = base_port_id;\n  512 | \n  513 |         if (!translate_video_encodings(&a_this->adaptors[i],\n  514 |                                        cur_host_adaptor)) {\n  515 |             EPHYR_LOG_ERROR(\"failed to get encodings for port port id %d,\"\n  516 |                             \" adaptors %d\\n\", base_port_id, i);\n  517 |             continue;\n  518 |         }\n  519 | \n  520 |         a_this->adaptors[i].nFormats = cur_host_adaptor->num_formats;\n  521 |         a_this->adaptors[i].pFormats =\n  522 |             calloc(cur_host_adaptor->num_formats,\n  523 |                    sizeof(*a_this->adaptors[i].pFormats));\n  524 |         for (j = 0; j < cur_host_adaptor->num_formats; j++) {\n  525 |             xcb_visualtype_t *visual =\n  526 |                 xcb_aux_find_visual_by_id(xscreen, format[j].visual);\n  527 |             a_this->adaptors[i].pFormats[j].depth = format[j].depth;\n  528 |             a_this->adaptors[i].pFormats[j].class = visual->_class;\n  529 |         }\n  530 | \n  531 |         a_this->adaptors[i].pPortPrivates =\n  532 |             calloc(a_this->adaptors[i].nPorts,\n  533 |                    sizeof(DevUnion) + sizeof(EphyrPortPriv));\n  534 |         port_priv_offset = a_this->adaptors[i].nPorts;\n  535 |         for (j = 0; j < a_this->adaptors[i].nPorts; j++) {\n  536 |             EphyrPortPriv *port_privs_base =\n  537 |                 (EphyrPortPriv *) &a_this->adaptors[i].\n  538 |                 pPortPrivates[port_priv_offset];\n  539 |             EphyrPortPriv *port_priv = &port_privs_base[j];\n  540 | \n  541 |             port_priv->port_number = base_port_id + j;\n  542 |             port_priv->current_adaptor = &a_this->adaptors[i];\n  543 |             port_priv->xv_priv = a_this;\n  544 |             a_this->adaptors[i].pPortPrivates[j].ptr = port_priv;\n  545 |         }\n  546 | \n  547 |         if (!translate_xv_attributes(&a_this->adaptors[i], cur_host_adaptor)) {\n  548 |         {\n  549 |             EPHYR_LOG_ERROR(\"failed to get port attribute \"\n  550 |                             \"for adaptor %d\\n\", i);\n  551 |             continue;\n  552 |         }\n  553 |         }\n  554 | \n  555 |         if (!translate_xv_image_formats(&a_this->adaptors[i], cur_host_adaptor)) {\n  556 |             EPHYR_LOG_ERROR(\"failed to get image formats \"\n  557 |                             \"for adaptor %d\\n\", i);\n  558 |             continue;\n  559 |         }\n  560 | \n  561 |         xcb_xv_adaptor_info_next(&it);\n  562 |     }","lines":77,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/kdrive/ephyr/ephyrvideo.c#L486-L562"}]},
{"id":"LOGIC_86","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"MouseInit reads km->tty before it is initialized. `km` is allocated with malloc() (not calloc), and MouseFirstProtocol() -- which reads km->tty for its serial/non-serial warnings and for the fallback protocol-selection loop `kmouseProts[km->i_prot]->tty != km->tty` -- is called at line 913, but km->tty is only assigned (isatty(fd)) at line 919. The fallback loop is not reached with the default \"ps/2\" protocol, so today it only produces a spurious warning, but the uninitialized read is a real defect and the fallback loop could spin on garbage if km->prot were ever NULL. Additionally, `km->i_prot = 0` at line 918 clobbers the protocol index MouseFirstProtocol just computed, desynchronizing km->prot from km->i_prot for any non-default protocol.","fix":"Set `km->tty = isatty(fd);` (and km->iob.fd) before calling MouseFirstProtocol, and drop the `km->i_prot = 0;` reset so it keeps the index chosen by MouseFirstProtocol.","locations":[{"ref":"hw/kdrive/linux/mouse.c:910-921","code":"  910 |     km = (Kmouse *) malloc(sizeof(Kmouse));\n  911 |     if (km) {\n  912 |         km->iob.avail = km->iob.used = 0;\n  913 |         MouseFirstProtocol(km, pi->protocol ? pi->protocol : \"ps/2\");\n  914 |         /* MouseFirstProtocol sets state to MouseBroken for later protocol\n  915 |          * checks. Skip these checks if a protocol was supplied */\n  916 |         if (pi->protocol)\n  917 |             km->state = MouseWorking;\n  918 |         km->i_prot = 0;\n  919 |         km->tty = isatty(fd);\n  920 |         km->iob.fd = fd;\n  921 |         pi->driverPrivate = km;","lines":12,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/kdrive/linux/mouse.c#L910-L921"}]},
{"id":"LOGIC_87","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"Off-by-one when shifting remaining screens in autoConfigDevice() for the multi-screen / multi-driver case. The md.nmatches driver screens occupy indices 0..md.nmatches-1, so the surviving original screens slp[1..num_screens-1] should be placed starting at index md.nmatches. Instead the loop writes `screens[i + md.nmatches] = slp[i]` (i starting at 1), leaving index md.nmatches as a NULL hole (which prematurely terminates the NULL-terminated screen list) and writing slp[num_screens-1] into the last slot, which is then overwritten by the NULL terminator on line 428-429. Net effect: extra configured screens are silently dropped.","fix":"Shift by md.nmatches-1 so slp[1] lands at index md.nmatches:\n```c\nfor (i = 1; i < num_screens; i++)\n    xf86ConfigLayout.screens[i + md.nmatches - 1] = slp[i];\n```\n(the terminator index at num_screens + md.nmatches - 1 is then correct).","locations":[{"ref":"hw/xfree86/common/xf86AutoConfig.c:425-429","code":"  425 |             for (i = 1; i < num_screens; i++) {\n  426 |                 xf86ConfigLayout.screens[i + md.nmatches] = slp[i];\n  427 |             }\n  428 |             xf86ConfigLayout.screens[num_screens + md.nmatches - 1].screen =\n  429 |                 NULL;","lines":5,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/common/xf86AutoConfig.c#L425-L429"}]},
{"id":"LOGIC_88","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"xf86GetDevFromEntity() dereferences xf86Entities[entityIndex] before validating the index. The `devices`/`devices[0]` check on lines 552-553 indexes xf86Entities[entityIndex] first, and only afterwards (lines 556-558) is `entityIndex >= xf86NumEntities` checked, making the bounds check dead and allowing an out-of-bounds read for an invalid entityIndex.","fix":"Move the bounds check first:\n```c\nGDevPtr\nxf86GetDevFromEntity(int entityIndex, int instance)\n{\n    int i;\n\n    if (entityIndex >= xf86NumEntities ||\n        instance >= xf86Entities[entityIndex]->numInstances)\n        return NULL;\n\n    if ((!xf86Entities[entityIndex]->devices) ||\n        (!xf86Entities[entityIndex]->devices[0]))\n        return NULL;\n    ...\n```","locations":[{"ref":"hw/xfree86/common/xf86Bus.c:547-565","code":"  547 | GDevPtr\n  548 | xf86GetDevFromEntity(int entityIndex, int instance)\n  549 | {\n  550 |     int i;\n  551 | \n  552 |     /* We might not use AddDevtoEntity */\n  553 |     if ((!xf86Entities[entityIndex]->devices) ||\n  554 |         (!xf86Entities[entityIndex]->devices[0]))\n  555 |         return NULL;\n  556 | \n  557 |     if (entityIndex >= xf86NumEntities ||\n  558 |         instance >= xf86Entities[entityIndex]->numInstances)\n  559 |         return NULL;\n  560 | \n  561 |     for (i = 0; i < xf86Entities[entityIndex]->numInstances; i++)\n  562 |         if (xf86Entities[entityIndex]->devices[i]->screen == instance)\n  563 |             return xf86Entities[entityIndex]->devices[i];\n  564 |     return NULL;\n  565 | }","lines":19,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/common/xf86Bus.c#L547-L565"}]},
{"id":"LOGIC_89","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In xf86PointerMoved the X panning branch sets frameX1 to `x + 1` while computing frameX0 as `x - HDisplay + 1`, producing a frame of width HDisplay+1 that is inconsistent with the mode width. The analogous Y branch below correctly sets frameY1 = y (width VDisplay). This off-by-one shifts the displayed frame by one pixel when panning right on a virtual desktop.","fix":"Match the Y branch:\n```c\nif (pScr->frameX1 < x) {\n    pScr->frameX1 = x;\n    pScr->frameX0 = x - pScr->currentMode->HDisplay + 1;\n    frameChanged = TRUE;\n}\n```","locations":[{"ref":"hw/xfree86/common/xf86Cursor.c:151-155","code":"  151 |     if (pScr->frameX1 < x) {\n  152 |         pScr->frameX1 = x + 1;\n  153 |         pScr->frameX0 = x - pScr->currentMode->HDisplay + 1;\n  154 |         frameChanged = TRUE;\n  155 |     }","lines":5,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/common/xf86Cursor.c#L151-L155"}]},
{"id":"LOGIC_90","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"DGAClientStateChange breaks out of the per-screen loop after cleaning up the first screen owned by a disconnecting client. If a single client activated DGA on more than one screen (multihead), the remaining screens keep a dangling `client` pointer, stay in DGA mode, and DGACallbackRefCount is decremented only once so the ClientStateCallback is never removed (leak / stale pointer usable by later delivery). The `break` prevents handling all screens the client owned.","fix":"Do not break after the first match; continue scanning all screens and clean up every screen whose DGA_GETCLIENT equals the gone client, decrementing the refcount for each.","locations":[{"ref":"hw/xfree86/common/xf86DGA.c:1312-1329","code":" 1312 |     DIX_FOR_EACH_SCREEN({\n 1313 |         if (pci->client && (DGA_GETCLIENT(walkScreenIdx) == pci->client)) {\n 1314 |             if ((pci->client->clientState == ClientStateGone) ||\n 1315 |                 (pci->client->clientState == ClientStateRetained))\n 1316 |             {\n 1317 |                 XDGAModeRec mode;\n 1318 |                 PixmapPtr pPix;\n 1319 | \n 1320 |                 DGA_SETCLIENT(walkScreenIdx, NULL);\n 1321 |                 DGASelectInput(walkScreenIdx, NULL, 0);\n 1322 |                 DGASetMode(walkScreenIdx, 0, &mode, &pPix);\n 1323 | \n 1324 |                 if (--DGACallbackRefCount == 0)\n 1325 |                     DeleteCallback(&ClientStateCallback, DGAClientStateChange, NULL);\n 1326 |             }\n 1327 |             break;\n 1328 |         }\n 1329 |     });","lines":18,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/common/xf86DGA.c#L1312-L1329"}]},
{"id":"LOGIC_91","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`DRIScreenInit` validates the driver-supplied `maxDrawableTableEntry` (must be in 1..SAREA_MAX_DRAWABLES) and logs an X_ERROR when it is out of range, but then falls through and uses the bad value anyway. If a driver sets `maxDrawableTableEntry > SAREA_MAX_DRAWABLES` (256), the immediately following initialization loop writes past the ends of the fixed-size arrays `pDRIPriv->DRIDrawables[SAREA_MAX_DRAWABLES]` and `pSAREA->drawableTable[SAREA_MAX_DRAWABLES]` (out-of-bounds write). The value is driver-controlled rather than client-controlled, so impact is limited, but the 'validation' is effectively a no-op that gives a false sense of safety.","fix":"Make the check actually abort init instead of only logging:\n```c\nif ((pDRIPriv->pDriverInfo->maxDrawableTableEntry <= 0) ||\n    (pDRIPriv->pDriverInfo->maxDrawableTableEntry > SAREA_MAX_DRAWABLES)) {\n    DRIDrvMsg(pScreen->myNum, X_ERROR,\n              \"Invalid max drawable table size set by driver: %d\\n\",\n              pDRIPriv->pDriverInfo->maxDrawableTableEntry);\n    return FALSE;\n}\n```","locations":[{"ref":"hw/xfree86/dri/dri.c:530-543","code":"  530 |     /* validate max drawable table entry set by driver */\n  531 |     if ((pDRIPriv->pDriverInfo->maxDrawableTableEntry <= 0) ||\n  532 |         (pDRIPriv->pDriverInfo->maxDrawableTableEntry > SAREA_MAX_DRAWABLES)) {\n  533 |         DRIDrvMsg(pScreen->myNum, X_ERROR,\n  534 |                   \"Invalid max drawable table size set by driver: %d\\n\",\n  535 |                   pDRIPriv->pDriverInfo->maxDrawableTableEntry);\n  536 |     }\n  537 | \n  538 |     /* Initialize drawable tables (screen private and SAREA) */\n  539 |     for (i = 0; i < pDRIPriv->pDriverInfo->maxDrawableTableEntry; i++) {\n  540 |         pDRIPriv->DRIDrawables[i] = NULL;\n  541 |         pDRIPriv->pSAREA->drawableTable[i].stamp = 0;\n  542 |         pDRIPriv->pSAREA->drawableTable[i].flags = 0;\n  543 |     }","lines":14,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/dri/dri.c#L530-L543"}]},
{"id":"LOGIC_92","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"Inconsistent request byte-swapping in the XF86DRI dispatch. `ProcXF86DRIQueryDirectRenderingCapable` swaps its CARD32 field via `X_REQUEST_FIELD_CARD32(screen)` (and deliberately handles swapped clients), but none of the other handlers (`ProcXF86DRIOpenConnection`, `AuthConnection`, `CloseConnection`, `GetClientDriverName`, `CreateContext`, `DestroyContext`, `CreateDrawable`, `DestroyDrawable`, `GetDrawableInfo`, `GetDeviceInfo`) swap `stuff->screen` or their other multi-byte fields (`magic`, `context`, `drawable`). Since the extension is registered with the same `ProcXF86DRIDispatch` for both the normal and the swapped entry points, a byte-swapped client's fields are consumed unswapped, so screen/drawable/context lookups use garbage values. Impact is limited (swapped local clients are rare and dixGetScreenPtr/dixLookupDrawable validate the value, yielding BadValue rather than memory unsafety), but it is a real correctness bug and the asymmetry with the Capable handler shows swapped clients were meant to be handled.","fix":"Add the appropriate `X_REQUEST_FIELD_CARD32(...)` (and CARD32 for `magic`, `context`, `drawable`) swap calls after each `X_REQUEST_HEAD_STRUCT(...)` in these handlers, mirroring `ProcXF86DRIQueryDirectRenderingCapable`, or explicitly reject swapped clients in `ProcXF86DRIDispatch`.","locations":[{"ref":"hw/xfree86/dri/xf86dri.c:123-146","code":"  123 | ProcXF86DRIOpenConnection(register ClientPtr client)\n  124 | {\n  125 |     X_REQUEST_HEAD_STRUCT(xXF86DRIOpenConnectionReq);\n  126 | \n  127 |     drm_handle_t hSAREA;\n  128 |     char *busIdString;\n  129 |     CARD32 busIdStringLength = 0;\n  130 | \n  131 |     ScreenPtr pScreen = dixGetScreenPtr(stuff->screen);\n  132 |     if (!pScreen) {\n  133 |         client->errorValue = stuff->screen;\n  134 |         return BadValue;\n  135 |     }\n  136 | \n  137 |     if (!DRIOpenConnection(pScreen,\n  138 |                            &hSAREA, &busIdString)) {\n  139 |         return BadValue;\n  140 |     }\n  141 | \n  142 |     x_rpcbuf_t rpcbuf = { .swapped = client->swapped, .err_clear = TRUE };\n  143 |     if (busIdString) {\n  144 |         busIdStringLength = strlen(busIdString);\n  145 |         x_rpcbuf_write_CARD8s(&rpcbuf, (CARD8*)busIdString, strlen(busIdString));\n  146 |     }","lines":24,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/dri/xf86dri.c#L123-L146"},{"ref":"hw/xfree86/dri/xf86dri.c:160-172","code":"  160 | ProcXF86DRIAuthConnection(register ClientPtr client)\n  161 | {\n  162 |     X_REQUEST_HEAD_STRUCT(xXF86DRIAuthConnectionReq);\n  163 | \n  164 |     ScreenPtr pScreen = dixGetScreenPtr(stuff->screen);\n  165 |     if (!pScreen) {\n  166 |         client->errorValue = stuff->screen;\n  167 |         return BadValue;\n  168 |     }\n  169 | \n  170 |     CARD8 authenticated = 1;\n  171 |     if (!DRIAuthConnection(pScreen, stuff->magic)) {\n  172 |         ErrorF(\"Failed to authenticate %lu\\n\", (unsigned long) stuff->magic);","lines":13,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/dri/xf86dri.c#L160-L172"},{"ref":"hw/xfree86/dri/xf86dri.c:198-217","code":"  198 | static int\n  199 | ProcXF86DRIGetClientDriverName(register ClientPtr client)\n  200 | {\n  201 |     X_REQUEST_HEAD_STRUCT(xXF86DRIGetClientDriverNameReq);\n  202 | \n  203 |     ScreenPtr pScreen = dixGetScreenPtr(stuff->screen);\n  204 |     if (!pScreen) {\n  205 |         client->errorValue = stuff->screen;\n  206 |         return BadValue;\n  207 |     }\n  208 | \n  209 |     xXF86DRIGetClientDriverNameReply reply = { 0 };\n  210 | \n  211 |     char *clientDriverName = NULL;\n  212 | \n  213 |     DRIGetClientDriverName(pScreen,\n  214 |                            (int *) &reply.ddxDriverMajorVersion,\n  215 |                            (int *) &reply.ddxDriverMinorVersion,\n  216 |                            (int *) &reply.ddxDriverPatchVersion,\n  217 |                            &clientDriverName);","lines":20,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/dri/xf86dri.c#L198-L217"},{"ref":"hw/xfree86/dri/xf86dri.c:228-296","code":"  228 | static int\n  229 | ProcXF86DRICreateContext(register ClientPtr client)\n  230 | {\n  231 |     X_REQUEST_HEAD_STRUCT(xXF86DRICreateContextReq);\n  232 | \n  233 |     ScreenPtr pScreen = dixGetScreenPtr(stuff->screen);\n  234 |     if (!pScreen) {\n  235 |         client->errorValue = stuff->screen;\n  236 |         return BadValue;\n  237 |     }\n  238 | \n  239 |     xXF86DRICreateContextReply reply = { 0 };\n  240 | \n  241 |     if (!DRICreateContext(pScreen,\n  242 |                           NULL,\n  243 |                           stuff->context,\n  244 |                           (drm_context_t *) &reply.hHWContext)) {\n  245 |         return BadValue;\n  246 |     }\n  247 | \n  248 |     return X_SEND_REPLY_SIMPLE(client, reply);\n  249 | }\n  250 | \n  251 | static int\n  252 | ProcXF86DRIDestroyContext(register ClientPtr client)\n  253 | {\n  254 |     X_REQUEST_HEAD_STRUCT(xXF86DRIDestroyContextReq);\n  255 | \n  256 |     ScreenPtr pScreen = dixGetScreenPtr(stuff->screen);\n  257 |     if (!pScreen) {\n  258 |         client->errorValue = stuff->screen;\n  259 |         return BadValue;\n  260 |     }\n  261 | \n  262 |     if (!DRIDestroyContext(pScreen, stuff->context)) {\n  263 |         return BadValue;\n  264 |     }\n  265 | \n  266 |     return Success;\n  267 | }\n  268 | \n  269 | static int\n  270 | ProcXF86DRICreateDrawable(ClientPtr client)\n  271 | {\n  272 |     X_REQUEST_HEAD_STRUCT(xXF86DRICreateDrawableReq);\n  273 | \n  274 |     DrawablePtr pDrawable;\n  275 |     int rc;\n  276 | \n  277 |     ScreenPtr pScreen = dixGetScreenPtr(stuff->screen);\n  278 |     if (!pScreen) {\n  279 |         client->errorValue = stuff->screen;\n  280 |         return BadValue;\n  281 |     }\n  282 | \n  283 |     rc = dixLookupDrawable(&pDrawable, stuff->drawable, client, 0,\n  284 |                            DixReadAccess);\n  285 |     if (rc != Success)\n  286 |         return rc;\n  287 | \n  288 |     xXF86DRICreateDrawableReply reply = { 0 };\n  289 |     if (!DRICreateDrawable(pScreen, client,\n  290 |                            pDrawable,\n  291 |                            (drm_drawable_t *) &reply.hHWDrawable)) {\n  292 |         return BadValue;\n  293 |     }\n  294 | \n  295 |     return X_SEND_REPLY_SIMPLE(client, reply);\n  296 | }","lines":69,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/dri/xf86dri.c#L228-L296"},{"ref":"hw/xfree86/dri/xf86dri.c:325-343","code":"  325 | static int\n  326 | ProcXF86DRIGetDrawableInfo(register ClientPtr client)\n  327 | {\n  328 |     X_REQUEST_HEAD_STRUCT(xXF86DRIGetDrawableInfoReq);\n  329 | \n  330 |     DrawablePtr pDrawable;\n  331 |     int X, Y, W, H;\n  332 |     drm_clip_rect_t *pClipRects;\n  333 |     drm_clip_rect_t *pBackClipRects;\n  334 |     int backX, backY, rc;\n  335 | \n  336 |     ScreenPtr pScreen = dixGetScreenPtr(stuff->screen);\n  337 |     if (!pScreen) {\n  338 |         client->errorValue = stuff->screen;\n  339 |         return BadValue;\n  340 |     }\n  341 | \n  342 |     rc = dixLookupDrawable(&pDrawable, stuff->drawable, client, 0,\n  343 |                            DixReadAccess);","lines":19,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/dri/xf86dri.c#L325-L343"}]},
{"id":"LOGIC_93","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"drmmode_bo_import() dereferences `bo` at the top (gbm_bo_get_width(bo)/gbm_bo_get_height(bo)) and only later guards `if (bo && ms->kms_has_modifiers && ...)`. The `bo &&` test is dead/misleading: if bo could be NULL the function would already have crashed above, and if it can't be NULL the check is pointless. It gives a false sense of NULL-safety to future readers.","fix":"Drop the redundant `bo &&` from the condition (bo is unconditionally dereferenced at lines 351-352), or add a real early `if (!bo) return -1;` guard at the top of the function before the width/height reads.","locations":[{"ref":"hw/xfree86/drivers/video/modesetting/drmmode_bo.c:359-368","code":"  359 | drmmode_bo_import(drmmode_ptr drmmode, struct gbm_bo *bo,\n  360 |                   uint32_t *fb_id)\n  361 | {\n  362 |     uint32_t width = gbm_bo_get_width(bo);\n  363 |     uint32_t height = gbm_bo_get_height(bo);\n  364 | \n  365 | #ifdef GBM_BO_WITH_MODIFIERS\n  366 |     modesettingPtr ms = modesettingPTR(drmmode->scrn);\n  367 |     if (bo && ms->kms_has_modifiers &&\n  368 |         gbm_bo_get_modifier(bo) != DRM_FORMAT_MOD_INVALID) {","lines":10,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/drivers/video/modesetting/drmmode_bo.c#L359-L368"}]},
{"id":"LOGIC_94","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`fbdev_open_device()` copies the kernel-supplied `fix.id` (a `char[16]` that is NOT guaranteed to be NUL-terminated when all 16 bytes are used) into a 16-byte `malloc` buffer with `strncpy(*namep, fix.id, 16)`. `strncpy` does not append a NUL when the source fills the whole buffer, so `*namep` can be a non-terminated string. Callers (fbdevHWProbe and the fbdev video driver) treat it as a C string, leading to out-of-bounds reads when printing/comparing the name.","fix":"Allocate one extra byte and terminate:\n```c\n*namep = malloc(17);\nif (*namep) {\n    strncpy(*namep, fix.id, 16);\n    (*namep)[16] = '\\0';\n}\n```","locations":[{"ref":"hw/xfree86/fbdevhw/fbdevhw.c:268-271","code":"  268 |     *namep = malloc(16);\n  269 |     if (*namep) {\n  270 |         strncpy(*namep, fix.id, 16);\n  271 |     }","lines":4,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/fbdevhw/fbdevhw.c#L268-L271"}]},
{"id":"LOGIC_95","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"On little-endian builds `write_w()` / `write_l()` perform the fast aligned access (`V_ADDR_WW` / `V_ADDR_WL`) inside the `if`, but unlike the symmetric `read_w()` / `read_l()` (which `return` in the fast path) they lack the early `return`. Execution then falls through and re-writes the same location byte-by-byte. For plain RAM this is a redundant double-write; for the VRAM/MMIO branch it issues a 16/32-bit MMIO transaction followed by 2/4 additional 8-bit MMIO transactions to the same register, which can trigger unintended side effects on mapped hardware during BIOS POST.","fix":"Add `return;` after the fast-path write, mirroring `read_w`/`read_l`:\n```c\n    if (OFF(addr + 1) > 0) {\n        V_ADDR_WW(addr, val);\n        return;\n    }\n```\nand likewise `return;` after `V_ADDR_WL(addr, val);` in `write_l`.","locations":[{"ref":"hw/xfree86/int10/generic.c:452-476","code":"  452 | static void\n  453 | write_w(xf86Int10InfoPtr pInt, int addr, CARD16 val)\n  454 | {\n  455 | #if X_BYTE_ORDER == X_LITTLE_ENDIAN\n  456 |     if (OFF(addr + 1) > 0) {\n  457 |         V_ADDR_WW(addr, val);\n  458 |     }\n  459 | #endif\n  460 |     V_ADDR_WB(addr, val);\n  461 |     V_ADDR_WB(addr + 1, val >> 8);\n  462 | }\n  463 | \n  464 | static void\n  465 | write_l(xf86Int10InfoPtr pInt, int addr, uint32_t val)\n  466 | {\n  467 | #if X_BYTE_ORDER == X_LITTLE_ENDIAN\n  468 |     if (OFF(addr + 3) > 2) {\n  469 |         V_ADDR_WL(addr, val);\n  470 |     }\n  471 | #endif\n  472 |     V_ADDR_WB(addr, val);\n  473 |     V_ADDR_WB(addr + 1, val >> 8);\n  474 |     V_ADDR_WB(addr + 2, val >> 16);\n  475 |     V_ADDR_WB(addr + 3, val >> 24);\n  476 | }","lines":25,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/int10/generic.c#L452-L476"}]},
