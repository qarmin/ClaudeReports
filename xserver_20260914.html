<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"RRTellChanged() and TellChanged() dereference `pSecondaryScrPriv->provider` without a NULL check. RRTellChanged line 637 (`pSecondaryScrPriv->provider->changed = FALSE;`) runs for every secondary in the primary's secondary_list on any change-notification pass, and is not even guarded by is_output_secondary. TellChanged line 535 does the same when a client selected RRProviderChangeNotifyMask. The same file treats provider as optionally-NULL in RRCloseScreen (line 101: `if (pScrPriv->provider) RRProviderDestroy(...)`), proving a secondary screen can legitimately have provider==NULL, in which case these paths crash the server. This is reachable from client-visible flows (RRTellChanged is invoked after SetCrtcConfig/SetScreenConfig etc.).","fix":"Guard both dereferences, e.g. at line 637 wrap in `if (pSecondaryScrPriv->provider) pSecondaryScrPriv->provider->changed = FALSE;` and at line 535 test `if (pSecondaryScrPriv->provider && pSecondaryScrPriv->provider->changed)` before delivering the event.","locations":[{"ref":"Xext/randr/randr.c:635-637","code":"  635 |         xorg_list_for_each_entry(iter, &primary->secondary_list, secondary_head) {\n  636 |             pSecondaryScrPriv = rrGetScrPriv(iter);\n  637 |             pSecondaryScrPriv->provider->changed = FALSE;","lines":3,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/randr/randr.c#L635-L637"},{"ref":"Xext/randr/randr.c:532-538","code":"  532 |         if (pRREvent->mask & RRProviderChangeNotifyMask) {\n  533 |             xorg_list_for_each_entry(iter, &pScreen->secondary_list, secondary_head) {\n  534 |                 pSecondaryScrPriv = rrGetScrPriv(iter);\n  535 |                 if (pSecondaryScrPriv->provider->changed)\n  536 |                     RRDeliverProviderEvent(client, pWin, pSecondaryScrPriv->provider);\n  537 |             }\n  538 |         }","lines":7,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/randr/randr.c#L532-L538"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"ephyrProcessConfigureNotify() dereferences the result of screen_from_window() (screen->driver) before checking it for NULL. screen_from_window() can return NULL for a window that matches no Xephyr screen. Every other event handler in this file (ephyrProcessExpose, ephyrProcessMouseMotion) guards against a NULL screen first; this one does not, so a ConfigureNotify referencing an unknown window crashes Xephyr.","fix":"Check the screen before dereferencing it:\n```c\n    KdScreenInfo *screen = screen_from_window(configure->window);\n    if (!screen)\n        return;\n    EphyrScrPriv *scrpriv = screen->driver;\n```","locations":[{"ref":"hw/kdrive/ephyr/ephyr.c:1245-1246","code":" 1245 |     KdScreenInfo *screen = screen_from_window(configure->window);\n 1246 |     EphyrScrPriv *scrpriv = screen->driver;","lines":2,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/kdrive/ephyr/ephyr.c#L1245-L1246"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"In ReadHandlers(), when the handler line contains no \"event\" substring, strstr() returns NULL and dst->EventNo is set to -1, but the function does NOT return. Execution falls through to `data += sizeof(\"event\") - 1;` (i.e. (char*)NULL + 5) and then `strtol(data, NULL, 10)`, which dereferences a near-NULL pointer and crashes the server during input autodetection. It also silently overwrites the EventNo=-1 sentinel, defeating the `read_dev.EventNo == -1` guard in EvdevDefaultDevice().","fix":"Return early when \"event\" is not found:\n```c\n    data = strstr(data, \"event\");\n    if (!data) {\n        /* If this one is missing, we really can't do anything */\n        dst->EventNo = -1;\n        return;\n    }\n```","locations":[{"ref":"hw/kdrive/linux/evdev/evdev_autodetect.c:183-192","code":"  183 |     data = strstr(data, \"event\");\n  184 |     if (!data) {\n  185 |         /* If this one is missing, we really can't do anything */\n  186 |         dst->EventNo = -1;\n  187 |     }\n  188 | \n  189 |     data += sizeof(\"event\") - 1;\n  190 | \n  191 |     /* This one is base10 */\n  192 |     dst->EventNo = strtol(data, NULL, 10);","lines":10,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/kdrive/linux/evdev/evdev_autodetect.c#L183-L192"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"ApplyAutoRepeat parses an \"AutoRepeat\" option value of the form \"<delay> <rate>\" with sscanf and then computes `1000 / rate` with no check that rate is non-zero. A device/InputClass option `Option \"AutoRepeat\" \"500 0\"` produces an integer divide-by-zero (SIGFPE) that kills the server. The value is under config/hotplug control and is applied for every newly added input device in xf86InputDevicePostInit.","fix":"Reject a non-positive rate before dividing:\n```c\n    if (sscanf(repeatStr, \"%ld %ld\", &delay, &rate) != 2 || rate <= 0) {\n        LogMessageVerb(X_ERROR, 1, \"\\\"%s\\\" is not a valid AutoRepeat value\\n\", repeatStr);\n        return;\n    }\n```\n(then `repeat_interval = 1000 / rate;` is safe).","locations":[{"ref":"hw/xfree86/common/xf86Xinput.c:350-357","code":"  350 |     if (sscanf(repeatStr, \"%ld %ld\", &delay, &rate) != 2) {\n  351 |         LogMessageVerb(X_ERROR, 1, \"\\\"%s\\\" is not a valid AutoRepeat value\\n\", repeatStr);\n  352 |         return;\n  353 |     }\n  354 | \n  355 |     LogMessageVerb(X_CONFIG, 1, \"AutoRepeat: %ld %ld\\n\", delay, rate);\n  356 |     xkbi->desc->ctrls->repeat_delay = delay;\n  357 |     xkbi->desc->ctrls->repeat_interval = 1000 / rate;","lines":8,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/common/xf86Xinput.c#L350-L357"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"In the OutputClass ModulePath handling, when a class has neither a `driver` nor `modules` set, the final `else` branch dereferences `cl->modulepath` unconditionally via `*(cl->modulepath)`. Every other branch (lines 285, 315) first checks `if (cl->modulepath)` before dereferencing it. If an xorg.conf OutputClass section specifies none of driver/modules/modulepath, `cl->modulepath` is NULL and the server crashes at startup while processing the config.","fix":"Guard the pointer before dereferencing:\n```c\n} else {\n    if (cl->modulepath && *(cl->modulepath)) {\n```\ninstead of\n```c\n} else {\n    if (*(cl->modulepath)) {\n```","locations":[{"ref":"hw/xfree86/common/xf86platformBus.c:339-362","code":"  339 |                 } else {\n  340 |                     if (*(cl->modulepath)) {\n  341 |                         char *path2;\n  342 |                         if (asprintf(&path2, \"%s,%s\", cl->modulepath,\n  343 |                                 path ? path : xf86ModulePath) == -1)\n  344 |                             LogMessageVerb(X_ERROR, 1, \"memory allocation failed\\n\");\n  345 |                         else {\n  346 |                             LogMessageVerb(X_CONFIG, 1, \"OutputClass \\\"%s\\\" default ModulePath extended to \\\"%s\\\"\\n\",\n  347 |                                 cl->identifier, path2);\n  348 |                             free(path);\n  349 |                             path = path2;\n  350 |                         }\n  351 |                     } else {\n  352 |                         char *path2 = strdup(xf86ModulePath);\n  353 |                         if (!path2)\n  354 |                             LogMessageVerb(X_ERROR, 1, \"memory allocation failed\\n\");\n  355 |                         else {\n  356 |                             LogMessageVerb(X_CONFIG, 1, \"OutputClass \\\"%s\\\" default ModulePath reset to standard \\\"%s\\\"\\n\",\n  357 |                                 cl->identifier, path2);\n  358 |                             free(path);\n  359 |                             path = path2;\n  360 |                         }\n  361 |                     }\n  362 |                 }","lines":24,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/common/xf86platformBus.c#L339-L362"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"xf86ForEachDetailedBlock() and xf86ForEachVideoBlock() iterate `mon->no_sections` (taken verbatim from EDID byte 126) and read extension blocks at `mon->rawData + 128*(i+1)` without checking that the raw buffer actually contains those blocks. Unlike cea_for_each_db() they never test EDID_COMPLETE_RAWDATA. For the non-complete code paths the rawData buffer is only 128 bytes: xf86DoEDID_DDC1() and xf86DoEDID_DDC2()/xf86DoEEDID(complete=FALSE) build a 128-byte block, then parseEDID() sets no_sections from byte 126 and (via handle_edid_quirks -> xf86ForEachDetailedBlock) walks past the 128-byte allocation. A monitor that advertises extension blocks (byte126 > 0) triggers a heap out-of-bounds read of up to no_sections*128 bytes, which can crash the server. (Data is monitor/hardware-controlled, not a network client.)","fix":"Bound the extension-block loops by what the buffer actually holds. Either clamp `m->no_sections` in parseEDID() to what `size` covers (`if (size < (size_t)(1 + m->no_sections) * EDID1_LEN) m->no_sections = (size - EDID1_LEN)/EDID1_LEN;`), or gate the extension iteration in both xf86ForEach* helpers on `mon->flags & EDID_COMPLETE_RAWDATA` as cea_for_each_db() already does.","locations":[{"ref":"hw/xfree86/ddc/interpret_edid.c:348-364","code":"  348 |     for (i = 0; i < DET_TIMINGS; i++)\n  349 |         fn(mon->det_mon + i, data);\n  350 | \n  351 |     for (i = 0; i < mon->no_sections; i++) {\n  352 |         ext = mon->rawData + EDID1_LEN * (i + 1);\n  353 |         switch (ext[EXT_TAG]) {\n  354 |         case CEA_EXT:\n  355 |             handle_cea_detail_block(ext, mon, fn, data);\n  356 |             break;\n  357 |         case VTB_EXT:\n  358 |         case DI_EXT:\n  359 |         case LS_EXT:\n  360 |         case MI_EXT:\n  361 |             break;\n  362 |         }\n  363 |     }\n  364 | }","lines":17,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/ddc/interpret_edid.c#L348-L364"},{"ref":"hw/xfree86/ddc/interpret_edid.c:413-435","code":"  413 | void\n  414 | xf86ForEachVideoBlock(xf86MonPtr mon, handle_video_fn fn, void *data)\n  415 | {\n  416 |     int i;\n  417 |     uint8_t *ext;\n  418 | \n  419 |     if (mon == NULL)\n  420 |         return;\n  421 | \n  422 |     for (i = 0; i < mon->no_sections; i++) {\n  423 |         ext = mon->rawData + EDID1_LEN * (i + 1);\n  424 |         switch (ext[EXT_TAG]) {\n  425 |         case CEA_EXT:\n  426 |             handle_cea_video_block(ext, fn, data);\n  427 |             break;\n  428 |         case VTB_EXT:\n  429 |         case DI_EXT:\n  430 |         case LS_EXT:\n  431 |         case MI_EXT:\n  432 |             break;\n  433 |         }\n  434 |     }\n  435 | }","lines":23,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/ddc/interpret_edid.c#L413-L435"},{"ref":"hw/xfree86/ddc/interpret_edid.c:268-274","code":"  268 |     m->no_sections = (int) *(char *) SECTION(NO_EDID, block);\n  269 | \n  270 |     handle_edid_quirks(m);\n  271 |     encode_aspect_ratio(m);\n  272 | \n  273 |     if (size > 128)\n  274 |         m->flags |= EDID_COMPLETE_RAWDATA;","lines":7,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/ddc/interpret_edid.c#L268-L274"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"Infinite loop (DoS / server hang) in the inputtest driver's protocol parser. In `read_input_from_connection`, an event header with `length == 0` and a `type` value that is not a recognized `xf86ITEventType` slips past every guard: the header-size check (line 862) passes, `length >= EVENT_BUFFER_SIZE` (line 871) is false, `valid_length - processed_size < length` (line 878) is false, and `is_supported_event()` returns false so the event is silently skipped. Then `processed_size += event_header.length` adds 0, leaving all loop state unchanged, so the inner `while (1)` spins forever consuming 100% CPU and never returning to the server. (A length of 0 with a *supported* type is caught by the size-mismatch check and tears down the connection, so only unsupported types trigger the hang.) The controlling socket is created with mode 0777 (pre_init line 1045), so any local process that can reach it can wedge the server whenever this driver is configured.","fix":"Reject headers whose length is smaller than the header itself, right after reading `event_header`:\n```c\nif (event_header.length < sizeof(xf86ITEventHeader) ||\n    event_header.length >= EVENT_BUFFER_SIZE) {\n    xf86IDrvMsg(pInfo, X_ERROR, \"Received event with bad length: %u\\n\",\n                event_header.length);\n    teardown_client_connection(pInfo);\n    return;\n}\n```","locations":[{"ref":"hw/xfree86/drivers/input/inputtest/xf86-input-inputtest.c:858-901","code":"  858 |         while (1) {\n  859 |             xf86ITEventHeader event_header;\n  860 |             char *event_begin = driver_data->buffer.data + processed_size;\n  861 | \n  862 |             if (driver_data->buffer.valid_length - processed_size < sizeof(xf86ITEventHeader))\n  863 |                 break;\n  864 | \n  865 |             /* Note that event_begin pointer is not aligned, accessing it directly is\n  866 |                undefined behavior. We must use memcpy to copy the data to aligned data\n  867 |                area. Most compilers will optimize out this call out and use whatever\n  868 |                is most efficient to access unaligned data on a particular platform */\n  869 |             memcpy(&event_header, event_begin, sizeof(xf86ITEventHeader));\n  870 | \n  871 |             if (event_header.length >= EVENT_BUFFER_SIZE) {\n  872 |                 xf86IDrvMsg(pInfo, X_ERROR, \"Received event with too long length: %d\\n\",\n  873 |                             event_header.length);\n  874 |                 teardown_client_connection(pInfo);\n  875 |                 return;\n  876 |             }\n  877 | \n  878 |             if (driver_data->buffer.valid_length - processed_size < event_header.length)\n  879 |                 break;\n  880 | \n  881 |             if (is_supported_event(event_header.type)) {\n  882 |                 int expected_event_size = get_event_size(event_header.type);\n  883 | \n  884 |                 if (event_header.length != expected_event_size) {\n  885 |                     xf86IDrvMsg(pInfo, X_ERROR, \"Unexpected event length: was %d bytes, \"\n  886 |                                 \"expected %d (event type: %d)\\n\",\n  887 |                                 event_header.length, expected_event_size,\n  888 |                                 (int) event_header.type);\n  889 |                     teardown_client_connection(pInfo);\n  890 |                     return;\n  891 |                 }\n  892 | \n  893 |                 /* We could use event_begin pointer directly, but we want to ensure correct\n  894 |                    data alignment (if only so that address sanitizer does not complain) */\n  895 |                 xf86ITEventAny event_data;\n  896 |                 memset(&event_data, 0, sizeof(event_data));\n  897 |                 memcpy(&event_data, event_begin, event_header.length);\n  898 |                 handle_event(pInfo, &event_data);\n  899 |             }\n  900 |             processed_size += event_header.length;\n  901 |         }","lines":44,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/drivers/input/inputtest/xf86-input-inputtest.c#L858-L901"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In ProcRRSetScreenConfig, when the drawable's screen has no RandR private (`pScrPriv == NULL`), control jumps to the `sendReply` label. The reply is then built with `.newTimestamp = pScrPriv->lastSetTime.milliseconds` and `.newConfigTimestamp = pScrPriv->lastConfigTime.milliseconds`, unconditionally dereferencing the NULL `pScrPriv`, crashing the server. Sibling handlers in the same file (ProcRRGetScreenInfo, ProcRRGetScreenSizeRange) explicitly treat a NULL pScrPriv as a valid, reachable state and fall back to currentTime, so this dereference is an inconsistency/latent NULL-deref on the same code path they guard. (Longstanding; predates the recent refactor, but still a real defect reachable only if a drawable can live on a screen lacking rrScrPriv.)","fix":"Make the reply's timestamps tolerate a NULL pScrPriv, mirroring the other handlers, e.g. `.newTimestamp = pScrPriv ? pScrPriv->lastSetTime.milliseconds : currentTime.milliseconds` and likewise for newConfigTimestamp; or fill and send a failed-status reply in the `if (!pScrPriv)` branch itself instead of falling through to code that dereferences pScrPriv.","locations":[{"ref":"Xext/randr/rrscreen.c:910-914","code":"  910 |     if (!pScrPriv) {\n  911 |         time = currentTime;\n  912 |         status = RRSetConfigFailed;\n  913 |         goto sendReply;\n  914 |     }","lines":5,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/randr/rrscreen.c#L910-L914"},{"ref":"Xext/randr/rrscreen.c:1064-1074","code":" 1064 |  sendReply:\n 1065 | \n 1066 |     free(pData);\n 1067 | \n 1068 |     xRRSetScreenConfigReply reply = {\n 1069 |         .status = status,\n 1070 |         .newTimestamp = pScrPriv->lastSetTime.milliseconds,\n 1071 |         .newConfigTimestamp = pScrPriv->lastConfigTime.milliseconds,\n 1072 |         .root = pDraw->pScreen->root->drawable.id,\n 1073 |         /* .subpixelOrder = ?? */\n 1074 |     };","lines":11,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/randr/rrscreen.c#L1064-L1074"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In ProcessPointerEvent the local `dev` is computed as `InputDevIsFloating(mouse) ? mouse : GetMaster(mouse, MASTER_KEYBOARD)`. The code immediately guards this with `if (dev && dev->key)` (line 728), showing the author considered `dev` possibly NULL. However, on a ButtonRelease the code later calls `InputDevIsMaster(dev)` (line 738) with no NULL check, and InputDevIsMaster() unconditionally dereferences `dev->type` (dix/events.c:354). If `GetMaster()` ever returns NULL for a non-floating pointer, this is a NULL-pointer dereference / crash. The two code paths disagree about whether `dev` can be NULL.","fix":"Make the NULL handling consistent: bail out early if `dev` is NULL, or guard the ButtonRelease block with `if (dev && InputDevIsMaster(dev))`.","locations":[{"ref":"Xext/xkeyboard/xkbAccessX.c:726-761","code":"  726 |     DeviceIntPtr dev = InputDevIsFloating(mouse)\n  727 |         ? mouse : GetMaster(mouse, MASTER_KEYBOARD);\n  728 | \n  729 |     if (dev && dev->key) {\n  730 |         xkbi = dev->key->xkbInfo;\n  731 |         xkbi->shiftKeyCount = 0;\n  732 |         xkbi->lastPtrEventTime = event->time;\n  733 |     }\n  734 | \n  735 |     if (event->type == ET_ButtonPress) {\n  736 |         changed |= XkbPointerButtonMask;\n  737 |     }\n  738 |     else if (event->type == ET_ButtonRelease) {\n  739 |         if (InputDevIsMaster(dev)) {\n  740 |             DeviceIntPtr source;\n  741 |             int rc;\n  742 | \n  743 |             rc = dixLookupDevice(&source, event->sourceid, serverClient,\n  744 |                     DixWriteAccess);\n  745 |             if (rc != Success)\n  746 |                 ErrorF(\"[xkb] bad sourceid '%d' on button release event.\\n\",\n  747 |                         event->sourceid);\n  748 |             else if (!IsXTestDevice(source, GetMaster(dev, MASTER_POINTER))) {\n  749 |                 DeviceIntPtr xtest_device;\n  750 | \n  751 |                 xtest_device = GetXTestDevice(GetMaster(dev, MASTER_POINTER));\n  752 |                 if (button_is_down(xtest_device, ev->device_event.detail.button, BUTTON_PROCESSED))\n  753 |                     XkbFakeDeviceButton(dev, FALSE, event->detail.key);\n  754 |             }\n  755 |         }\n  756 | \n  757 |         if (xkbi)\n  758 |             xkbi->lockedPtrButtons &= ~(1 << (event->detail.key & 0x7));\n  759 | \n  760 |         changed |= XkbPointerButtonMask;\n  761 |     }","lines":36,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/xkeyboard/xkbAccessX.c#L726-L761"}]},
{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"exaModifyPixmapHeader_driver() dereferences pExaPixmap (writes pExaPixmap->sys_ptr / sys_pitch) at lines 168-171 without a NULL check, even though the function itself treats pExaPixmap as possibly-NULL (guarded `if (pExaPixmap)` at line 145) and the pixmap-destroy hooks explicitly handle a NULL pExaPixmap 'on an error path'. The classic variant keeps the entire sys_ptr assignment inside its `if (pExaPixmap)` block; the driver variant does not. If a non-EXA / half-initialized pixmap reaches this path while info->ModifyPixmapHeader is set, this is a NULL dereference.","fix":"Guard the post-hook assignment with the NULL check as the classic path does:\n```c\nif (!pPixData && pPixmap->devPrivate.ptr && pPixmap->devKind && pExaPixmap) {\n    pExaPixmap->sys_ptr = pPixmap->devPrivate.ptr;\n    pExaPixmap->sys_pitch = pPixmap->devKind;\n}\n```","locations":[{"ref":"exa/exa_driver.c:160-175","code":"  160 |     if (pExaScr->info->ModifyPixmapHeader) {\n  161 |         ret = pExaScr->info->ModifyPixmapHeader(pPixmap, width, height, depth,\n  162 |                                                 bitsPerPixel, devKind,\n  163 |                                                 pPixData);\n  164 |         /* For EXA_HANDLES_PIXMAPS, we set pPixData to NULL.\n  165 |          * If pPixmap->devPrivate.ptr is non-NULL, then we've got a\n  166 |          * !has_gpu_copy pixmap. We need to store the pointer,\n  167 |          * because PrepareAccess won't be called.\n  168 |          */\n  169 |         if (!pPixData && pPixmap->devPrivate.ptr && pPixmap->devKind) {\n  170 |             pExaPixmap->sys_ptr = pPixmap->devPrivate.ptr;\n  171 |             pExaPixmap->sys_pitch = pPixmap->devKind;\n  172 |         }\n  173 |         if (ret == TRUE)\n  174 |             goto out;\n  175 |     }","lines":16,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/exa/exa_driver.c#L160-L175"}]},
{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"exaGlyphs() calls GetScratchGC() at line 760 and immediately passes the result to ValidateGC() and pGC->ops->PolyFillRect() without checking for NULL. If GetScratchGC() fails (allocation failure) this NULL-dereferences and crashes the server. Other code in the same tree guards this call (see exaCreateAlphaPicture() in exa_render.c:1083-1087, which checks the GetScratchGC() return and cleans up). This branch also leaks pMaskPixmap/pMask if it were to bail, but the primary issue is the missing NULL check leading to a crash.","fix":"Check the return value:\n```c\n        pGC = GetScratchGC(pMaskPixmap->drawable.depth, pScreen);\n        if (!pGC) {\n            FreePicture((void *) pMask, (XID) 0);\n            dixDestroyPixmap(pMaskPixmap, 0);\n            return;\n        }\n        ValidateGC(&pMaskPixmap->drawable, pGC);\n```","locations":[{"ref":"exa/exa_glyphs.c:760-767","code":"  760 |         pGC = GetScratchGC(pMaskPixmap->drawable.depth, pScreen);\n  761 |         ValidateGC(&pMaskPixmap->drawable, pGC);\n  762 |         rect.x = 0;\n  763 |         rect.y = 0;\n  764 |         rect.width = width;\n  765 |         rect.height = height;\n  766 |         (*pGC->ops->PolyFillRect) (&pMaskPixmap->drawable, pGC, 1, &rect);\n  767 |         FreeScratchGC(pGC);","lines":8,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/exa/exa_glyphs.c#L760-L767"}]},
{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In the mouse press/release handlers the EPHYR_LOG() calls dereference screen_from_window(button->event)->pScreen->myNum without a NULL check. screen_from_window() can return NULL. This only crashes in DEBUG builds (EPHYR_LOG is a no-op otherwise), so impact is limited, but it is still an unchecked NULL dereference on a host-controlled event.","fix":"Compute the screen once, guard for NULL, and log a screen number only when it is valid (e.g. `screen ? screen->pScreen->myNum : -1`), mirroring the pattern already used in ephyrProcessMouseMotion.","locations":[{"ref":"hw/kdrive/ephyr/ephyr.c:1077-1080","code":" 1077 |     if (!ephyrMouse ||\n 1078 |         !((EphyrPointerPrivate *) ephyrMouse->driverPrivate)->enabled) {\n 1079 |         EPHYR_LOG(\"skipping mouse press:%d\\n\", screen_from_window(button->event)->pScreen->myNum);\n 1080 |         return;","lines":4,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/kdrive/ephyr/ephyr.c#L1077-L1080"},{"ref":"hw/kdrive/ephyr/ephyr.c:1089","code":" 1089 |     EPHYR_LOG(\"enqueuing mouse press:%d\\n\", screen_from_window(button->event)->pScreen->myNum);","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/kdrive/ephyr/ephyr.c#L1089"},{"ref":"hw/kdrive/ephyr/ephyr.c:1106","code":" 1106 |     EPHYR_LOG(\"enqueuing mouse release:%d\\n\", screen_from_window(button->event)->pScreen->myNum);","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/kdrive/ephyr/ephyr.c#L1106"}]},
{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"ephyrProcessKeyRelease() relies on assert(screen) to validate the screen_from_window() result before dereferencing screen->driver. In an NDEBUG build the assert compiles out and screen->driver becomes a NULL dereference when the key event's window matches no Xephyr screen.","fix":"Replace the `assert(screen)` with a real runtime guard, e.g. `if (!screen) goto send_release;` (or return after ensuring the key-release is still forwarded), so a missing screen cannot cause a NULL dereference in release builds.","locations":[{"ref":"hw/kdrive/ephyr/ephyr.c:1177-1179","code":" 1177 |             KdScreenInfo *screen = screen_from_window(key->event);\n 1178 |             assert(screen);\n 1179 |             EphyrScrPriv *scrpriv = screen->driver;","lines":3,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/kdrive/ephyr/ephyr.c#L1177-L1179"}]},
{"id":"PANIC_14","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"ephyrXVPrivQueryHostAdaptors() calls calloc() for pFormats without checking the result, then dereferences it (pFormats[j].depth = ...). It also calls xcb_aux_find_visual_by_id() and immediately dereferences the returned visual (visual->_class) without a NULL check; if the host reports a format whose visual id is not present, this is a NULL dereference.","fix":"Check the pFormats calloc for NULL (bail like the other allocations), and guard `visual` before reading `visual->_class` (skip the format or default the class if visual is NULL).","locations":[{"ref":"hw/kdrive/ephyr/ephyrvideo.c:520-529","code":"  520 |         a_this->adaptors[i].nFormats = cur_host_adaptor->num_formats;\n  521 |         a_this->adaptors[i].pFormats =\n  522 |             calloc(cur_host_adaptor->num_formats,\n  523 |                    sizeof(*a_this->adaptors[i].pFormats));\n  524 |         for (j = 0; j < cur_host_adaptor->num_formats; j++) {\n  525 |             xcb_visualtype_t *visual =\n  526 |                 xcb_aux_find_visual_by_id(xscreen, format[j].visual);\n  527 |             a_this->adaptors[i].pFormats[j].depth = format[j].depth;\n  528 |             a_this->adaptors[i].pFormats[j].class = visual->_class;\n  529 |         }","lines":10,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/kdrive/ephyr/ephyrvideo.c#L520-L529"}]},
{"id":"PANIC_15","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"hostx_set_fullscreen_hint() dereferences the xcb_intern_atom_reply() results (reply->atom) without checking for NULL; a NULL reply from the host X server crashes the server at startup.","fix":"Check each `reply` for NULL before reading `reply->atom` and handle the failure (skip setting the hint / log a warning).","locations":[{"ref":"hw/kdrive/ephyr/hostx.c:392-398","code":"  392 |     reply = xcb_intern_atom_reply(HostX.conn, cookie_WINDOW_STATE, NULL);\n  393 |     atom_WINDOW_STATE = reply->atom;\n  394 |     free(reply);\n  395 | \n  396 |     reply = xcb_intern_atom_reply(HostX.conn, cookie_WINDOW_STATE_FULLSCREEN,\n  397 |                                   NULL);\n  398 |     atom_WINDOW_STATE_FULLSCREEN = reply->atom;","lines":7,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/kdrive/ephyr/hostx.c#L392-L398"}]},
{"id":"PANIC_16","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"hostx_get_window_attributes() dereferences geom_reply and attr_reply without NULL checks (geom_reply->x, attr_reply->visual). If either xcb reply fails (bad window id), this NULL-dereferences.","fix":"Verify geom_reply and attr_reply are non-NULL before use; return FALSE (and free whichever succeeded) if either is NULL.","locations":[{"ref":"hw/kdrive/ephyr/hostx.c:1379-1392","code":" 1379 |     geom_cookie = xcb_get_geometry(HostX.conn, a_window);\n 1380 |     attr_cookie = xcb_get_window_attributes(HostX.conn, a_window);\n 1381 |     geom_reply = xcb_get_geometry_reply(HostX.conn, geom_cookie, NULL);\n 1382 |     attr_reply = xcb_get_window_attributes_reply(HostX.conn, attr_cookie, NULL);\n 1383 | \n 1384 |     a_attrs->x = geom_reply->x;\n 1385 |     a_attrs->y = geom_reply->y;\n 1386 |     a_attrs->width = geom_reply->width;\n 1387 |     a_attrs->height = geom_reply->height;\n 1388 |     a_attrs->visualid = attr_reply->visual;\n 1389 | \n 1390 |     free(geom_reply);\n 1391 |     free(attr_reply);\n 1392 |     return TRUE;","lines":14,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/kdrive/ephyr/hostx.c#L1379-L1392"}]},
{"id":"PANIC_17","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"__glXQueryServerString() calls xcb_glx_query_server_string_string(reply) and xcb_glx_query_server_string_string_length(reply) without checking reply for NULL. A failed GLX query reply results in a NULL dereference during glamor initialization.","fix":"After xcb_glx_query_server_string_reply(), return NULL (or an empty allocated string) if reply is NULL before calling the accessor functions.","locations":[{"ref":"hw/kdrive/ephyr/hostx.c:1608-1619","code":" 1608 |     cookie = xcb_glx_query_server_string(HostX.conn, HostX.screen, name);\n 1609 |     reply = xcb_glx_query_server_string_reply(HostX.conn, cookie, NULL);\n 1610 |     str = xcb_glx_query_server_string_string(reply);\n 1611 | \n 1612 |     /* The spec doesn't mention this, but the Xorg server replies with\n 1613 |      * a string already terminated with '\\0'. */\n 1614 |     len = xcb_glx_query_server_string_string_length(reply);\n 1615 |     buf = XNFalloc(len);\n 1616 |     memcpy(buf, str, len);\n 1617 |     free(reply);\n 1618 | \n 1619 |     return buf;","lines":12,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/kdrive/ephyr/hostx.c#L1608-L1619"}]},
{"id":"PANIC_18","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"xf86RandRGetInfo() dereferences scrp->currentMode unconditionally at the post-loop check, but the function never verifies it is non-NULL. The in-loop use at line 99 is only a pointer comparison (safe when NULL), but lines 106-107 read ->HDisplay/->VDisplay. This callback is the rrGetInfo hook, reachable from the RandR 1.0 GetScreenInfo client request. currentMode can legitimately be NULL (e.g. a failed mode switch: xf86VidModeSwitchMode sets pScrn->currentMode = NULL before calling xf86SwitchMode, and if the driver returns success without setting it the field stays NULL), turning a client request into a server crash.","fix":"Guard the dereference, e.g.\n```c\nif (scrp->currentMode &&\n    (scrp->currentMode->HDisplay != randrp->virtualX ||\n     scrp->currentMode->VDisplay != randrp->virtualY)) {\n```","locations":[{"ref":"hw/xfree86/common/xf86RandR.c:108-109","code":"  108 |     if (scrp->currentMode->HDisplay != randrp->virtualX ||\n  109 |         scrp->currentMode->VDisplay != randrp->virtualY) {","lines":2,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/common/xf86RandR.c#L108-L109"}]},
{"id":"PANIC_19","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"xf86VidModeSetViewPort() dereferences pScrn->currentMode (->HDisplay/->VDisplay) with no NULL check. It backs the SetViewPort VidMode callback, reachable from the XF86VidModeSetViewPort client request. If currentMode is NULL (see the failed-switch scenario in xf86VidModeSwitchMode), this crashes the server on a client request.","fix":"Bail out (return FALSE) when `pScrn->currentMode == NULL` before computing the frame bounds.","locations":[{"ref":"hw/xfree86/common/xf86VidMode.c:224-229","code":"  224 |     pScrn->frameX0 = MIN(MAX(x, 0),\n  225 |                          pScrn->virtualX - pScrn->currentMode->HDisplay);\n  226 |     pScrn->frameX1 = pScrn->frameX0 + pScrn->currentMode->HDisplay - 1;\n  227 |     pScrn->frameY0 = MIN(MAX(y, 0),\n  228 |                          pScrn->virtualY - pScrn->currentMode->VDisplay);\n  229 |     pScrn->frameY1 = pScrn->frameY0 + pScrn->currentMode->VDisplay - 1;","lines":6,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/common/xf86VidMode.c#L224-L229"}]},
{"id":"PANIC_20","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"xf86VidModeAddModeline() dereferences pScrn->modes->next / pScrn->modes->next->prev without checking that pScrn->modes is non-NULL. It is installed as the AddModeline VidMode callback and is reachable from the XF86VidModeAddModeLine client request. A screen with an empty mode list (pScrn->modes == NULL) would cause a NULL dereference / server crash from a client request.","fix":"Return FALSE early if `pScrn->modes == NULL` before linking the new mode into the list.","locations":[{"ref":"hw/xfree86/common/xf86VidMode.c:331-337","code":"  331 |     mode->name = strdup(\"\"); /* freed by deletemode */\n  332 |     mode->status = MODE_OK;\n  333 |     mode->next = pScrn->modes->next;\n  334 |     mode->prev = pScrn->modes;\n  335 |     pScrn->modes->next = mode;\n  336 |     if (mode->next != NULL)\n  337 |         mode->next->prev = mode;","lines":7,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/common/xf86VidMode.c#L331-L337"}]},
{"id":"UAF_1","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"medium","description":"Double-free / use-after-free on vblank-queue failure in the modesetting DRI2 driver. `ms_queue_vblank()` (vblank.c:371-373) always calls `ms_drm_abort_seq()` on failure, which invokes the entry's abort callback `ms_dri2_frame_event_abort()` -> `ms_dri2_del_frame_event()`, freeing the event struct (and, for swaps, destroying front/back buffers) BEFORE returning FALSE. The correct contract is demonstrated in present.c:140-141, which returns without re-freeing. But both DRI2 handlers here free the already-freed struct again: in `ms_dri2_schedule_swap`, when `ms_queue_vblank` fails at line 910 or 951 it jumps to `blit_fallback`, where `if (frame_info) ms_dri2_del_frame_event(frame_info)` (line 967-968) frees `frame_info` a second time and dereferences its freed `front`/`back` pointers; in `ms_dri2_schedule_wait_msc`, failures at line 750-751 and 789 jump to `out_free` (line 807-808) which calls `ms_dri2_del_frame_event(wait_info)` on the already-freed struct. Both are reachable from client DRI2SwapBuffers / DRI2ScheduleWaitMSC requests whenever the kernel vblank ioctl fails (errno != EBUSY), causing heap corruption / double dixDestroyPixmap.","fix":"Because `ms_queue_vblank()` already aborts (and frees) the queue entry on failure, callers must not free it again. Null the pointer before jumping to the cleanup label at each failure site, e.g. in `ms_dri2_schedule_swap`:\n```c\nif (!ms_queue_vblank(crtc, ms_flag, *target_msc, &queued_msc, seq)) {\n    xf86DrvMsg(scrn->scrnIndex, X_WARNING,\n               \"divisor 0 get vblank counter failed: %s\\n\", strerror(errno));\n    frame_info = NULL; /* already freed by ms_queue_vblank()'s abort */\n    goto blit_fallback;\n}\n```\nApply the same `frame_info = NULL;` before the `goto blit_fallback` at line 951, and `wait_info = NULL;` before the two `goto out_free` statements (lines 751 and 798) in `ms_dri2_schedule_wait_msc`.","locations":[{"ref":"hw/xfree86/drivers/video/modesetting/dri2.c:911-922","code":"  911 |         if (!ms_queue_vblank(crtc, ms_flag, *target_msc, &queued_msc, seq)) {\n  912 |             xf86DrvMsg(scrn->scrnIndex, X_WARNING,\n  913 |                        \"divisor 0 get vblank counter failed: %s\\n\",\n  914 |                        strerror(errno));\n  915 |             goto blit_fallback;\n  916 |         }\n  917 | \n  918 |         *target_msc = queued_msc + flip;\n  919 |         frame_info->frame = *target_msc;\n  920 | \n  921 |         return TRUE;\n  922 |     }","lines":12,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/drivers/video/modesetting/dri2.c#L911-L922"},{"ref":"hw/xfree86/drivers/video/modesetting/dri2.c:952-970","code":"  952 |     if (!ms_queue_vblank(crtc, ms_flag, request_msc - flip, &queued_msc, seq)) {\n  953 |         xf86DrvMsg(scrn->scrnIndex, X_WARNING,\n  954 |                    \"final get vblank counter failed: %s\\n\",\n  955 |                    strerror(errno));\n  956 |         goto blit_fallback;\n  957 |     }\n  958 | \n  959 |     /* Adjust returned value for 1 fame pageflip offset of flip > 0 */\n  960 |     *target_msc = queued_msc + flip;\n  961 |     frame_info->frame = *target_msc;\n  962 | \n  963 |     return TRUE;\n  964 | \n  965 |  blit_fallback:\n  966 |     ms_dri2_blit_swap(draw, front, back);\n  967 |     DRI2SwapComplete(client, draw, 0, 0, 0, DRI2_BLIT_COMPLETE, func, data);\n  968 |     if (frame_info)\n  969 |         ms_dri2_del_frame_event(frame_info);\n  970 |     *target_msc = 0; /* offscreen, so zero out target vblank count */","lines":19,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/drivers/video/modesetting/dri2.c#L952-L970"},{"ref":"hw/xfree86/drivers/video/modesetting/dri2.c:751-762","code":"  751 |         ret = ms_queue_vblank(crtc, MS_QUEUE_ABSOLUTE, target_msc, &queued_msc, seq);\n  752 |         if (!ret) {\n  753 |             static int limit = 5;\n  754 |             if (limit) {\n  755 |                 xf86DrvMsg(scrn->scrnIndex, X_WARNING,\n  756 |                            \"%s:%d get vblank counter failed: %s\\n\",\n  757 |                            __func__, __LINE__,\n  758 |                            strerror(errno));\n  759 |                 limit--;\n  760 |             }\n  761 |             goto out_free;\n  762 |         }","lines":12,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/drivers/video/modesetting/dri2.c#L751-L762"},{"ref":"hw/xfree86/drivers/video/modesetting/dri2.c:790-809","code":"  790 |     if (!ms_queue_vblank(crtc, MS_QUEUE_ABSOLUTE, request_msc, &queued_msc, seq)) {\n  791 |         static int limit = 5;\n  792 |         if (limit) {\n  793 |             xf86DrvMsg(scrn->scrnIndex, X_WARNING,\n  794 |                        \"%s:%d get vblank counter failed: %s\\n\",\n  795 |                        __func__, __LINE__,\n  796 |                        strerror(errno));\n  797 |             limit--;\n  798 |         }\n  799 |         goto out_free;\n  800 |     }\n  801 | \n  802 |     wait_info->frame = queued_msc;\n  803 | \n  804 |     DRI2BlockClient(client, draw);\n  805 | \n  806 |     return TRUE;\n  807 | \n  808 |  out_free:\n  809 |     ms_dri2_del_frame_event(wait_info);","lines":20,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/drivers/video/modesetting/dri2.c#L790-L809"},{"ref":"hw/xfree86/drivers/video/modesetting/vblank.c:370-374","code":"  370 |     check:\n  371 |         if (errno != EBUSY) {\n  372 |             ms_drm_abort_seq(scrn, seq);\n  373 |             return FALSE;\n  374 |         }","lines":5,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/drivers/video/modesetting/vblank.c#L370-L374"}]},
{"id":"UAF_2","type":"use_after_free","type_label":"Use After Free","severity":"medium","difficulty":"medium","description":"XkbVModMaskText() saves `mm = XkbModMaskText(modMask, format)`, which returns a pointer into one of the NUM_BUFFER (8) rotating text buffers managed by tbGetBuffer(). It then loops over the up to XkbNumVirtualMods (16) virtual-modifier bits, calling XkbVModIndexText() once per set bit; each of those calls advances the rotating buffer index by one. When 8 or more virtual-mod bits are set (together with a non-zero real-mod mask so `mm` is non-NULL), the rotating index wraps all the way back to the slot `mm` points at. tbGetBuffer() may then free() and reallocate that slot (when the newly requested size exceeds the slot's current size), leaving `mm` dangling; the subsequent `strlen(mm)`/`strcpy(rtrn, mm)` is then a use-after-free read (otherwise it reads clobbered content and emits corrupt modifier text). A client can craft a key type via XkbSetMap whose mods.real_mods is non-zero and whose mods.vmods has 8+ bits set; the corruption is triggered later when the server serializes that keymap for xkbcomp (XkbWriteXKBKeyTypes -> XkbVModMaskText, reachable via keymap recompilation in ddxLoad.c).","fix":"Do not hold a rotating-buffer pointer across calls that themselves use the rotating buffers. Copy the real-mod text into a local fixed buffer immediately, e.g. `char mmbuf[64]; if (modMask != 0) { strncpy(mmbuf, XkbModMaskText(modMask, format), sizeof(mmbuf)-1); mmbuf[sizeof(mmbuf)-1]='\\0'; mm = mmbuf; } else mm = NULL;` and use `mmbuf` afterwards, so it is unaffected by the XkbVModIndexText() calls in the loop.","locations":[{"ref":"Xext/xkeyboard/xkbtext.c:173-238","code":"  173 |     if (modMask != 0)\n  174 |         mm = XkbModMaskText(modMask, format);\n  175 |     else\n  176 |         mm = NULL;\n  177 | \n  178 |     str = buf;\n  179 |     buf[0] = '\\0';\n  180 |     if (mask) {\n  181 |         char *tmp;\n  182 | \n  183 |         for (i = 0, bit = 1; i < XkbNumVirtualMods; i++, bit <<= 1) {\n  184 |             if (mask & bit) {\n  185 |                 tmp = XkbVModIndexText(xkb, i, format);\n  186 |                 len = strlen(tmp) + 1 + (str == buf ? 0 : 1);\n  187 |                 if (format == XkbCFile)\n  188 |                     len += 4;\n  189 |                 if ((str - buf) + len > VMOD_BUFFER_SIZE)\n  190 |                     continue; /* Skip */\n  191 |                 if (str != buf) {\n  192 |                     if (format == XkbCFile)\n  193 |                         *str++ = '|';\n  194 |                     else\n  195 |                         *str++ = '+';\n  196 |                     len--;\n  197 |                 }\n  198 |                 if (format == XkbCFile)\n  199 |                     sprintf(str, \"%sMask\", tmp);\n  200 |                 else\n  201 |                     strcpy(str, tmp);\n  202 |                 str = &str[len - 1];\n  203 |             }\n  204 |         }\n  205 |         str = buf;\n  206 |     }\n  207 |     else\n  208 |         str = NULL;\n  209 |     if (mm)\n  210 |         len = strlen(mm);\n  211 |     else\n  212 |         len = 0;\n  213 |     if (str)\n  214 |         len += strlen(str) + (mm == NULL ? 0 : 1);\n  215 |     rtrn = tbGetBuffer(len + 1);\n  216 |     rtrn[0] = '\\0';\n  217 | \n  218 |     if (mm != NULL) {\n  219 |         i = strlen(mm);\n  220 |         if (i > len)\n  221 |             i = len;\n  222 |         strcpy(rtrn, mm);\n  223 |     }\n  224 |     else {\n  225 |         i = 0;\n  226 |     }\n  227 |     if (str != NULL) {\n  228 |         if (mm != NULL) {\n  229 |             if (format == XkbCFile)\n  230 |                 strcat(rtrn, \"|\");\n  231 |             else\n  232 |                 strcat(rtrn, \"+\");\n  233 |         }\n  234 |         strncat(rtrn, str, len - i);\n  235 |     }\n  236 |     rtrn[len] = '\\0';\n  237 |     return rtrn;\n  238 | }","lines":66,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/xkeyboard/xkbtext.c#L173-L238"}]},
{"id":"UAF_3","type":"use_after_free","type_label":"Use After Free","severity":"medium","difficulty":"hard","description":"xf86_add_platform_device() grows the global xf86_platform_devices array with XNFreallocarray, which may relocate the whole block, and xf86_remove_platform_device() memmoves elements down after a removal. Meanwhile xf86ClaimPlatformSlot() stores raw pointers into this array in entities (`p->bus.id.plat = d`) and primaryBus.id.plat also holds such a pointer. After any subsequent hotplug add (reallocation) or middle-element removal (shift), previously stored `bus.id.plat` pointers become dangling / point at the wrong device, so later use (e.g. xf86IsPrimaryPlatform, MATCH_PCI_DEVICES, xf86MergeOutputClassOptions) reads freed or mismatched memory.","fix":"Do not store bare pointers into a reallocatable array. Either store the platform-device index in the entity and look the device up on demand, or allocate each xf86_platform_device individually (array of pointers to stable heap objects) so add/remove never invalidate references held by entities and primaryBus.","locations":[{"ref":"hw/xfree86/common/xf86platformBus.c:67-94","code":"   67 | int\n   68 | xf86_add_platform_device(struct OdevAttributes *attribs, Bool unowned)\n   69 | {\n   70 |     xf86_platform_devices = XNFreallocarray(xf86_platform_devices,\n   71 |                                             xf86_num_platform_devices + 1,\n   72 |                                             sizeof(struct xf86_platform_device));\n   73 | \n   74 |     xf86_platform_devices[xf86_num_platform_devices].attribs = attribs;\n   75 |     xf86_platform_devices[xf86_num_platform_devices].pdev = NULL;\n   76 |     xf86_platform_devices[xf86_num_platform_devices].flags =\n   77 |         unowned ? XF86_PDEV_UNOWNED : 0;\n   78 | \n   79 |     xf86_num_platform_devices++;\n   80 |     return 0;\n   81 | }\n   82 | \n   83 | int\n   84 | xf86_remove_platform_device(int dev_index)\n   85 | {\n   86 |     int j;\n   87 | \n   88 |     config_odev_free_attributes(xf86_platform_devices[dev_index].attribs);\n   89 | \n   90 |     for (j = dev_index; j < xf86_num_platform_devices - 1; j++)\n   91 |         memcpy(&xf86_platform_devices[j], &xf86_platform_devices[j + 1], sizeof(struct xf86_platform_device));\n   92 |     xf86_num_platform_devices--;\n   93 |     return 0;\n   94 | }","lines":28,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/common/xf86platformBus.c#L67-L94"},{"ref":"hw/xfree86/common/xf86platformBus.c:471-494","code":"  471 | static int\n  472 | xf86ClaimPlatformSlot(struct xf86_platform_device * d, DriverPtr drvp,\n  473 |                   int chipset, GDevPtr dev, Bool active)\n  474 | {\n  475 |     EntityPtr p = NULL;\n  476 |     int num;\n  477 | \n  478 |     if (xf86CheckSlot(d, BUS_PLATFORM)) {\n  479 |         num = xf86AllocateEntity();\n  480 |         p = xf86Entities[num];\n  481 |         p->driver = drvp;\n  482 |         p->chipset = chipset;\n  483 |         p->bus.type = BUS_PLATFORM;\n  484 |         p->bus.id.plat = d;\n  485 |         p->active = active;\n  486 |         p->inUse = FALSE;\n  487 |         if (dev)\n  488 |             xf86AddDevToEntity(num, dev);\n  489 | \n  490 |         return num;\n  491 |     }\n  492 |     else\n  493 |         return -1;\n  494 | }","lines":24,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/common/xf86platformBus.c#L471-L494"}]},
{"id":"UAF_4","type":"use_after_free","type_label":"Use After Free","severity":"medium","difficulty":"very_easy","description":"ms_do_pageflip() destroys new_front_bo at line 523 on the normal completion path, then checks `flipdata->flip_count > 1`. If the flip-queuing loop ran but queued nothing (e.g. every CRTC returned !xf86_crtc_on), flip_count is still 1, the `>1` test is false, and control falls through to the `error_undo:`/`error_out:` labels where `gbm_bo_destroy(new_front_bo)` is executed a SECOND time (line 548) on the already-freed BO. That is a double-free / use-after-free of the gbm_bo. Reachable if all CRTCs are off (or turn off) when a pixmap flip is requested.","fix":"Null the pointer after the first destroy and guard the second:\n```c\n    gbm_bo_destroy(new_front_bo);\n    new_front_bo = NULL;\n    ...\nerror_out:\n    if (new_front_bo)\n        gbm_bo_destroy(new_front_bo);\n```","locations":[{"ref":"hw/xfree86/drivers/video/modesetting/pageflip.c:524-549","code":"  524 |     gbm_bo_destroy(new_front_bo);\n  525 | \n  526 |     /*\n  527 |      * Do we have more than our local reference,\n  528 |      * if so and no errors, then drop our local\n  529 |      * reference and return now.\n  530 |      */\n  531 |     if (flipdata->flip_count > 1) {\n  532 |         flipdata->flip_count--;\n  533 |         return TRUE;\n  534 |     }\n  535 | \n  536 | error_undo:\n  537 | \n  538 |     /*\n  539 |      * Have we just got the local reference?\n  540 |      * free the framebuffer if so since nobody successfully\n  541 |      * submitted anything\n  542 |      */\n  543 |     if (flipdata->flip_count == 1) {\n  544 |         drmModeRmFB(ms->fd, ms->drmmode.fb_id);\n  545 |         ms->drmmode.fb_id = flipdata->old_fb_id;\n  546 |     }\n  547 | \n  548 | error_out:\n  549 |     gbm_bo_destroy(new_front_bo);","lines":26,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/drivers/video/modesetting/pageflip.c#L524-L549"}]},
{"id":"UAF_5","type":"use_after_free","type_label":"Use After Free","severity":"low","difficulty":"hard","description":"In ProcSecurityGenerateAuthorization, event clients are registered (SecurityEventSelectForAuthorization, line 529-533) before the authorization resource is added (line 535). SecurityEventSelectForAuthorization allocates an OtherClients record and AddResource's an RTEventClient resource whose value is `pAuth`. If the subsequent `AddResource(authId, ...)` fails, the code goes to `bailout` and does `free(pAuth)` (line 570) without deleting the RTEventClient resource that still points at `pAuth`. When that event-client resource is later freed, SecurityDeleteAuthorizationEventClient dereferences the freed `pAuth`, a use-after-free. Only reachable if AddResource fails (XID exhaustion), hence hard to trigger.","fix":"Either register event clients only after AddResource(authId) succeeds, or in the bailout path free any registered event-client resources first, e.g. iterate `pAuth->eventClients` calling `FreeResource(pEventClient->resource, X11_RESTYPE_NONE)` (and freeing the records) before `free(pAuth)`. Reordering AddResource(authId) before the eventMask handling is the simplest fix.","locations":[{"ref":"Xext/security/security.c:530-539","code":"  530 |     if (eventMask) {\n  531 |         err = SecurityEventSelectForAuthorization(pAuth, client, eventMask);\n  532 |         if (err != Success)\n  533 |             goto bailout;\n  534 |     }\n  535 | \n  536 |     if (!AddResource(authId, SecurityAuthorizationResType, pAuth)) {\n  537 |         err = BadAlloc;\n  538 |         goto bailout;\n  539 |     }","lines":10,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/security/security.c#L530-L539"},{"ref":"Xext/security/security.c:567-572","code":"  567 |  bailout:\n  568 |     if (removeAuth)\n  569 |         RemoveAuthorization(stuff->nbytesAuthProto, protoname,\n  570 |                             authdata_len, pAuthdata);\n  571 |     free(pAuth);\n  572 |     return err;","lines":6,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/security/security.c#L567-L572"}]},
{"id":"UAF_6","type":"use_after_free","type_label":"Use After Free","severity":"low","difficulty":"easy","description":"`_glamor_egl_init()` stores the freshly allocated private into `scrn->privates[xf86GlamorEGLPrivateIndex].ptr` (line 86) before calling `glamor_egl_init_internal()`. If that call fails, the code `free(glamor_egl)` (line 105) but leaves the screen private pointing at the freed block; the `FreeScreen` wrapper that would clean it up is only installed on success. Any later access of the screen private (e.g. via the GLAMOR_EGL_PRIV_PROC callback) would be a use-after-free.","fix":"On the failure path reset the private before freeing, e.g. `scrn->privates[xf86GlamorEGLPrivateIndex].ptr = NULL;` immediately before `free(glamor_egl); return FALSE;`.","locations":[{"ref":"hw/xfree86/glamor_egl/glamor_xf86_egl.c:92-113","code":"   92 |     scrn->privates[xf86GlamorEGLPrivateIndex].ptr = glamor_egl;\n   93 | \n   94 |     if (xf86Info.debug != NULL) {\n   95 |         glamor_egl_conf.dmabuf_forced = TRUE;\n   96 |         glamor_egl_conf.dmabuf_capable = !!strstr(xf86Info.debug,\n   97 |                                                    \"dmabuf_capable\");\n   98 |     }\n   99 | \n  100 |     glamor_egl_conf.llvmpipe_allowed = !!scrn->confScreen->num_gpu_devices;\n  101 | \n  102 |     glamor_egl_conf.server_private = scrn->FreeScreen;\n  103 | \n  104 |     ret = glamor_egl_init_internal(&glamor_egl_conf, caps);\n  105 |     free(options);\n  106 |     if (ret) {\n  107 |         scrn->FreeScreen = glamor_xf86_egl_free_screen;\n  108 |         return TRUE;\n  109 |     }\n  110 | \n  111 |     free(glamor_egl);\n  112 |     return FALSE;\n  113 | }","lines":22,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/glamor_egl/glamor_xf86_egl.c#L92-L113"}]},
{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"medium","description":"In compRedirectWindow(), when a new CompWindowRec (cw) is freshly allocated and wired into the\nwindow's devPrivates, and then AddResource() fails for ccw->id (line 207), the function returns\nBadAlloc without cleaning up the newly-created cw. At this point cw is already stored via\ndixSetPrivate() (line 203) and ccw is already prepended to cw->clients (line 205-206), but no\nresource exists to trigger FreeCompositeClientWindow -> compFreeClientWindow on teardown.\nThe cw allocation, its damage object, and the ccw are leaked. Subsequent calls will find cw via\nGetCompWindow() without having the resource they expect.","fix":"When AddResource() fails at line 207, before returning BadAlloc, remove ccw from cw->clients,\nand if cw was newly allocated in this call (i.e., it was NULL before), destroy cw->damage,\nuninit cw->borderClip, clear the devPrivates pointer, and free cw and ccw.","locations":[{"ref":"Xext/composite/compalloc.c:178-209","code":"  178 |     if (!cw) {\n  179 |         cw = calloc(1, sizeof(CompWindowRec));\n  180 |         if (!cw) {\n  181 |             free(ccw);\n  182 |             return BadAlloc;\n  183 |         }\n  184 |         cw->damage = DamageCreate(compReportDamage,\n  185 |                                   compDestroyDamage,\n  186 |                                   DamageReportNonEmpty,\n  187 |                                   FALSE, pWin->drawable.pScreen, pWin);\n  188 |         if (!cw->damage) {\n  189 |             free(ccw);\n  190 |             free(cw);\n  191 |             return BadAlloc;\n  192 |         }\n  193 | \n  194 |         anyMarked = compMarkWindows(pWin, &pLayerWin);\n  195 | \n  196 |         RegionNull(&cw->borderClip);\n  197 |         cw->update = CompositeRedirectAutomatic;\n  198 |         cw->clients = 0;\n  199 |         cw->oldx = COMP_ORIGIN_INVALID;\n  200 |         cw->oldy = COMP_ORIGIN_INVALID;\n  201 |         cw->damageRegistered = FALSE;\n  202 |         cw->damaged = FALSE;\n  203 |         cw->pOldPixmap = NullPixmap;\n  204 |         dixSetPrivate(&pWin->devPrivates, CompWindowPrivateKey, cw);\n  205 |     }\n  206 |     ccw->next = cw->clients;\n  207 |     cw->clients = ccw;\n  208 |     if (!AddResource(ccw->id, CompositeClientWindowType, pWin))\n  209 |         return BadAlloc;","lines":32,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/composite/compalloc.c#L178-L209"}]},
{"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"medium","description":"In compRedirectSubwindows(), when AddResource() fails for ccw->id (line 405), the function\nreturns BadAlloc without removing ccw from csw->clients (it was prepended on line 403-404).\nIf csw was newly allocated in this call, neither csw nor ccw is freed, and the devPrivates\npointer is left dangling. Even if csw pre-existed, ccw is leaked and csw->clients is corrupted.","fix":"On AddResource() failure, unlink ccw from csw->clients, free ccw, and if csw was newly\ncreated (csw->clients is now empty), clear the devPrivates and free csw before returning BadAlloc.","locations":[{"ref":"Xext/composite/compalloc.c:403-408","code":"  403 |      * Hook into subwindows list\n  404 |      */\n  405 |     ccw->next = csw->clients;\n  406 |     csw->clients = ccw;\n  407 |     if (!AddResource(ccw->id, CompositeClientSubwindowsType, pWin))\n  408 |         return BadAlloc;","lines":6,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/composite/compalloc.c#L403-L408"}]},
{"id":"MEM_3","type":"memory_leak","type_label":"Memory Leak","severity":"high","difficulty":"medium","description":"The per-screen `crtcs` buffer is shared (aliased) across screens, causing a double free at shutdown. vfbInitializeScreenInfo() does `*screen = defaultScreenInfo` (copying the crtcs pointer and numCrtcs=1) and then calls vfbAddCrtcInfo(screen, 1), whose `count = numCrtcs - screen->numCrtcs` is 0, so it does NOT allocate a fresh buffer. Because defaultScreenInfo.crtcs was allocated once on the first ddxProcessArgument() call, every vfbScreens[] entry created for `-screen` ends up pointing at that same heap buffer. With two or more `-screen` arguments, freeScreenInfo() (called for each screen in ddxGiveUp) frees the same crtcs pointer multiple times. Using `-crtcs` on an aliased screen additionally reallocs the shared buffer, leaving dangling pointers in the other screens (use-after-free).","fix":"Make vfbInitializeScreenInfo() give each screen its own crtcs allocation, e.g. after `*screen = defaultScreenInfo;` reset `screen->crtcs = NULL; screen->numCrtcs = 0;` before calling vfbAddCrtcInfo(), so a fresh buffer is always allocated per screen.","locations":[{"ref":"hw/vfb/InitOutput.c:196-207","code":"  196 | static vfbScreenInfoPtr\n  197 | vfbInitializeScreenInfo(vfbScreenInfoPtr screen)\n  198 | {\n  199 |     *screen = defaultScreenInfo;\n  200 |     vfbAddCrtcInfo(screen, VFB_DEFAULT_NUM_CRTCS);\n  201 | \n  202 |     /* First CRTC initializes with one output */\n  203 |     if (screen->numCrtcs > 0)\n  204 |         screen->crtcs[0].numOutputs = 1;\n  205 | \n  206 |     return screen;\n  207 | }","lines":12,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/vfb/InitOutput.c#L196-L207"},{"ref":"hw/vfb/InitOutput.c:172-194","code":"  172 | static void\n  173 | vfbAddCrtcInfo(vfbScreenInfoPtr screen, int numCrtcs)\n  174 | {\n  175 |     int i;\n  176 |     int count = numCrtcs - screen->numCrtcs;\n  177 | \n  178 |     if (count > 0) {\n  179 |         vfbCrtcInfoPtr crtcs =\n  180 |             reallocarray(screen->crtcs, numCrtcs, sizeof(*crtcs));\n  181 |         if (!crtcs)\n  182 |             FatalError(\"Not enough memory for %d CRTCs\", numCrtcs);\n  183 | \n  184 |         memset(crtcs + screen->numCrtcs, 0, count * sizeof(*crtcs));\n  185 | \n  186 |         for (i = screen->numCrtcs; i < numCrtcs; ++i) {\n  187 |             crtcs[i].width = screen->width;\n  188 |             crtcs[i].height = screen->height;\n  189 |         }\n  190 | \n  191 |         screen->crtcs = crtcs;\n  192 |         screen->numCrtcs = numCrtcs;\n  193 |     }\n  194 | }","lines":23,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/vfb/InitOutput.c#L172-L194"},{"ref":"hw/vfb/InitOutput.c:266","code":"  266 |     free(pvfb->crtcs);","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/vfb/InitOutput.c#L266"},{"ref":"hw/vfb/InitOutput.c:357-364","code":"  357 |         if (vfbNumScreens <= screenNum) {\n  358 |             vfbScreens =\n  359 |                 reallocarray(vfbScreens, screenNum + 1, sizeof(*vfbScreens));\n  360 |             if (!vfbScreens)\n  361 |                 FatalError(\"Not enough memory for screen %d\\n\", screenNum);\n  362 |             for (; vfbNumScreens <= screenNum; ++vfbNumScreens)\n  363 |                 vfbInitializeScreenInfo(&vfbScreens[vfbNumScreens]);\n  364 |         }","lines":8,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/vfb/InitOutput.c#L357-L364"}]},
{"id":"MEM_4","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"In compCreateOverlayClient(), the new pOc node is prepended to cs->pOverlayClients (lines 107-108)\nbefore AddResource() is called (line 114). If AddResource() fails, the function returns NULL but\npOc remains in the cs->pOverlayClients list without being freed. Any subsequent call to\ncompFreeOverlayClient() for the same pOc pointer that arrives via a different code path would\ndouble-free it; more practically, the dangling entry in pOverlayClients causes\ncompDestroyOverlayWindow() to never be called when appropriate.","fix":"If AddResource() fails, restore cs->pOverlayClients to its previous head (pOc->pNext), free pOc,\nand return NULL. Alternatively, call AddResource() before inserting into the list.","locations":[{"ref":"Xext/composite/compoverlay.c:118-126","code":"  118 |     pOc->pNext = cs->pOverlayClients;\n  119 |     cs->pOverlayClients = pOc;\n  120 | \n  121 |     /*\n  122 |      * Create a resource for this element so it can be deleted\n  123 |      * when the client goes away.\n  124 |      */\n  125 |     if (!AddResource(pOc->resource, CompositeClientOverlayType, (void *) pOc))\n  126 |         return NULL;","lines":9,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/composite/compoverlay.c#L118-L126"}]},
{"id":"MEM_5","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"very_easy","description":"In DRI2ScreenInit(), when `dri2_probe_driver_name()` returns a heap-allocated string (via strdup) and that string is not NULL, the function then checks `if (!ds->driverNames[0]) return FALSE;` - but if the string *is* non-NULL yet the function exits via the `err_out` path later (e.g. the `driverNames` calloc at line 1508 succeeded but something else later fails), the strdup'd driver name stored in `ds->driverNames[0]` and `ds->driverNames[1]` is freed only indirectly via `free(ds->driverNames)` (which frees the pointer array but not the strings). Additionally, the FIXME comment at line 1515-1516 explicitly acknowledges the leak of the strdup'd string for the success path. On the early-return path at line 1519, `ds->driverNames` has already been allocated and assigned but is not freed before returning FALSE.","fix":"Free the strdup'd driver name string in all error/exit paths. In the `err_out` label, add `free(ds->driverNames)` (already done) but also `free((void*)ds->driverNames[0])` when the probe path was taken. For the success path, store the probed name in a local variable and free it in DRI2CloseScreen.","locations":[{"ref":"Xext/dri2/dri2.c:1519-1535","code":" 1519 |         ds->driverNames = calloc(ds->numDrivers, sizeof(*ds->driverNames));\n 1520 |         if (!ds->driverNames)\n 1521 |             goto err_out;\n 1522 | \n 1523 |         if (info->driverName) {\n 1524 |             ds->driverNames[0] = info->driverName;\n 1525 |         } else {\n 1526 |             /* FIXME dri2_probe_driver_name() returns a strdup-ed string,\n 1527 |              * currently this gets leaked */\n 1528 |             ds->driverNames[0] = ds->driverNames[1] = dri2_probe_driver_name(pScreen, info);\n 1529 |             if (!ds->driverNames[0])\n 1530 |                 return FALSE;\n 1531 | \n 1532 |             /* There is no VDPAU driver for i965, fallback to the generic\n 1533 |              * OpenGL/VAAPI va_gl backend to emulate VDPAU on i965. */\n 1534 |             if (strcmp(ds->driverNames[0], \"i965\") == 0)\n 1535 |                 ds->driverNames[1] = \"va_gl\";","lines":17,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/dri2/dri2.c#L1519-L1535"}]},
{"id":"MEM_6","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"very_easy","description":"dispatch_DestroyGLXPixmap() in vnd_dispatch_stubs.c forwards the request to the vendor but never calls `glxServer.removeXIDMap(glxpixmap)` on success, unlike every other destroy handler (DestroyContext, DestroyPbuffer, DestroyPixmap, DestroyWindow) which all remove the XID map entry after a successful forward. The XID-to-vendor mapping remains in the idResource table for the lifetime of the client, preventing the XID slot from being reused correctly.","fix":"Add `if (ret == Success) { glxServer.removeXIDMap(glxpixmap); }` after the forwardRequest call, matching the pattern in dispatch_DestroyPixmap.","locations":[{"ref":"Xext/glx/vnd_dispatch_stubs.c:196-212","code":"  196 | static int dispatch_DestroyGLXPixmap(ClientPtr client)\n  197 | {\n  198 |     REQUEST(xGLXDestroyGLXPixmapReq);\n  199 |     CARD32 glxpixmap;\n  200 |     GlxServerVendor *vendor = NULL;\n  201 |     REQUEST_SIZE_MATCH(*stuff);\n  202 |     glxpixmap = GlxCheckSwap(client, stuff->glxpixmap);\n  203 |     vendor = glxServer.getXIDMap(glxpixmap);\n  204 |     if (vendor != NULL) {\n  205 |         int ret;\n  206 |         ret = glxServer.forwardRequest(vendor, client);\n  207 |         return ret;\n  208 |     } else {\n  209 |         client->errorValue = glxpixmap;\n  210 |         return GlxErrorBase + GLXBadPixmap;\n  211 |     }\n  212 | }","lines":17,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/vnd_dispatch_stubs.c#L196-L212"}]},
{"id":"MEM_7","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"AddPassiveGrabToList() is the sole owner of pGrab on error paths (every caller does `return AddPassiveGrabToList(client, grab);` and never frees the grab). It correctly frees pGrab on the BadAccess and MakeWindowOptional/BadAlloc paths, but when dixCallDeviceAccessCallback() denies access it does `return rc;` without freeing pGrab. The leaked GrabRec also owns an xi2mask, detail/modifier pMasks and a cursor reference. A client repeatedly issuing GrabKey/GrabButton/XI passive-grab requests that an XACE/security module denies leaks a grab each time (unbounded DoS).","fix":"Free the grab before returning the error:\n```c\n    rc = dixCallDeviceAccessCallback(client, pGrab->device, access_mode);\n    if (rc != Success) {\n        FreeGrab(pGrab);\n        return rc;\n    }\n```","locations":[{"ref":"dix/grabs.c:546-548","code":"  546 |     rc = dixCallDeviceAccessCallback(client, pGrab->device, access_mode);\n  547 |     if (rc != Success)\n  548 |         return rc;","lines":3,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/dix/grabs.c#L546-L548"}]},
