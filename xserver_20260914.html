{"id":"MEM_8","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"ClientSleepUntil re-runs its one-time initialization on every call: it unconditionally calls `CreateNewResourceType(SertafiedDelete, \"ClientSleep\")` (allocating a brand-new resource type each time and growing the global resource-type table without bound) and unconditionally resets `BlockHandlerRegistered = FALSE`, which makes the following `if (!BlockHandlerRegistered)` always true and re-registers the block/wakeup handler pair on every call. RegisterBlockAndWakeupHandlers appends duplicates, but the wakeup handler only removes one pair when the queue empties, so handlers accumulate. Both are client-reachable via XTEST (XTestFakeInput with a future activation time) and grow unboundedly.","fix":"Guard the resource-type creation and only initialize `BlockHandlerRegistered` once (e.g. as a static initializer):\n```c\n    if (!SertafiedResType) {\n        SertafiedResType = CreateNewResourceType(SertafiedDelete, \"ClientSleep\");\n        if (!SertafiedResType)\n            return FALSE;\n    }\n```\nand delete the `BlockHandlerRegistered = FALSE;` line (leave the flag to be cleared only by SertafiedWakeupHandler when the queue drains).","locations":[{"ref":"dix/sleepuntil.c:77-98","code":"   77 |     SertafiedResType = CreateNewResourceType(SertafiedDelete,\n   78 |                                              \"ClientSleep\");\n   79 |     if (!SertafiedResType)\n   80 |         return FALSE;\n   81 |     BlockHandlerRegistered = FALSE;\n   82 | \n   83 |     SertafiedPtr pRequest = calloc(1, sizeof(SertafiedRec));\n   84 |     if (!pRequest)\n   85 |         return FALSE;\n   86 |     pRequest->pClient = client;\n   87 |     pRequest->revive = *revive;\n   88 |     pRequest->id = FakeClientID(client->index);\n   89 |     pRequest->closure = closure;\n   90 |     if (!BlockHandlerRegistered) {\n   91 |         if (!RegisterBlockAndWakeupHandlers(SertafiedBlockHandler,\n   92 |                                             SertafiedWakeupHandler,\n   93 |                                             (void *) 0)) {\n   94 |             free(pRequest);\n   95 |             return FALSE;\n   96 |         }\n   97 |         BlockHandlerRegistered = TRUE;\n   98 |     }","lines":22,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/dix/sleepuntil.c#L77-L98"}]},
{"id":"MEM_9","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"TouchEndTouch and TouchFreeTouchPoint remove listeners with `for (int i = 0; i < ti->num_listeners; i++) TouchRemoveListener(ti, ti->listeners[0].listener);`. Because TouchRemoveListener decrements `num_listeners` on every successful removal while the loop index `i` increments, the loop terminates after only ceil(N/2) iterations, leaving floor(N/2) listeners in place. The remaining listeners' grab copies (created with AllocGrab in TouchAddListener) are never freed before `ti->listeners` is freed / num_listeners is zeroed, leaking those GrabRecs whenever a touch has more than one listener (grab + selection).","fix":"Drain the list unconditionally, e.g.:\n```c\n    while (ti->num_listeners > 0)\n        TouchRemoveListener(ti, ti->listeners[0].listener);\n```","locations":[{"ref":"dix/touch.c:252-253","code":"  252 |     for (int i = 0; i < ti->num_listeners; i++)\n  253 |         TouchRemoveListener(ti, ti->listeners[0].listener);","lines":2,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/dix/touch.c#L252-L253"},{"ref":"dix/touch.c:358-359","code":"  358 |     for (int i = 0; i < ti->num_listeners; i++)\n  359 |         TouchRemoveListener(ti, ti->listeners[0].listener);","lines":2,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/dix/touch.c#L358-L359"}]},
{"id":"MEM_10","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"very_easy","description":"exaCreatePixmap_mixed() allocates the pixmap via pScreen->CreatePixmap() at line 61, but then bails out with `return NullPixmap` at line 74 when the computed fb pitch is too large, without ever destroying pPixmap. This leaks a full PixmapRec (plus its EXA private) on every such call. The width limit at line 57 (32767) allows values large enough to trigger this: e.g. w=32767 at 32bpp gives paddedWidth/4 == 32768 > 32767. This is directly reachable from a client CreatePixmap request, so a client can repeatedly leak pixmaps. The classic path (exa_classic.c:98-103) correctly calls dixDestroyPixmap() before returning in the analogous over-size case, confirming this is an omission.","fix":"Destroy the already-created pixmap before returning:\n```c\n    paddedWidth = ((w * bpp + FB_MASK) >> FB_SHIFT) * sizeof(FbBits);\n    if (paddedWidth / 4 > 32767) {\n        dixDestroyPixmap(pPixmap, 0);\n        return NullPixmap;\n    }\n```","locations":[{"ref":"exa/exa_mixed.c:61-75","code":"   61 |     swap(pExaScr, pScreen, CreatePixmap);\n   62 |     pPixmap = pScreen->CreatePixmap(pScreen, 0, 0, depth, usage_hint);\n   63 |     swap(pExaScr, pScreen, CreatePixmap);\n   64 | \n   65 |     if (!pPixmap)\n   66 |         return NULL;\n   67 | \n   68 |     pExaPixmap = ExaGetPixmapPriv(pPixmap);\n   69 |     pExaPixmap->driverPriv = NULL;\n   70 | \n   71 |     bpp = pPixmap->drawable.bitsPerPixel;\n   72 | \n   73 |     paddedWidth = ((w * bpp + FB_MASK) >> FB_SHIFT) * sizeof(FbBits);\n   74 |     if (paddedWidth / 4 > 32767)\n   75 |         return NullPixmap;","lines":15,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/exa/exa_mixed.c#L61-L75"}]},
{"id":"MEM_11","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"very_easy","description":"In dispatch_damages() the clip array is allocated with calloc() at the top of the `if (num_cliprects)` block, but the early `if (!c) return 0;` return path (taken whenever damage rects exist but none of them intersect this CRTC after rotate_clip()) returns without freeing `clip`. This runs from the block handler on essentially every frame with off-CRTC damage (common in multi-monitor setups where damage on one output never intersects another CRTC), so it is a per-frame heap leak that grows unboundedly.","fix":"Free the buffer before the early return:\n```c\n        if (!c) {\n            free(clip);\n            return 0;\n        }\n```","locations":[{"ref":"hw/xfree86/drivers/video/modesetting/driver.c:649-689","code":"  649 |         drmModeClip *clip = calloc(num_cliprects, sizeof(drmModeClip));\n  650 |         BoxPtr rect = REGION_RECTS(dirty);\n  651 |         int i;\n  652 |         int c = 0;\n  653 | \n  654 |         if (!clip)\n  655 |             return -ENOMEM;\n  656 | \n  657 |         /* Create clips for the given rects in case the rect covers any\n  658 |          * area in the FB.\n  659 |          */\n  660 |         for (i = 0; i < num_cliprects; i++, rect++) {\n  661 |             if (rotate_clip(pixmap, crtc, rect, &clip[c], crtc->rotation, x, y) < 0)\n  662 |                 continue;\n  663 | \n  664 |             c++;\n  665 |         }\n  666 | \n  667 |         if (!c)\n  668 |             return 0;\n  669 | \n  670 |         /* TODO query connector property to see if this is needed */\n  671 |         ret = drmModeDirtyFB(ms->fd, fb_id, clip, c);\n  672 | \n  673 |         /* if we're swamping it with work, try one at a time */\n  674 |         if (ret == -EINVAL) {\n  675 |             for (i = 0; i < c; i++) {\n  676 |                 if ((ret = drmModeDirtyFB(ms->fd, fb_id, &clip[i], 1)) < 0)\n  677 |                     break;\n  678 |             }\n  679 |         }\n  680 | \n  681 |         if (ret == -EINVAL || ret == -ENOSYS) {\n  682 |             xf86DrvMsg(scrn->scrnIndex, X_INFO,\n  683 |                        \"Disabling kernel dirty updates, not required.\\n\");\n  684 |             ms->dirty_enabled = FALSE;\n  685 |         }\n  686 | \n  687 |         free(clip);\n  688 |     }\n  689 |     return ret;","lines":41,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/drivers/video/modesetting/driver.c#L649-L689"}]},
{"id":"MEM_12","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"easy","description":"In ms_tearfree_dri_flip() a local RegionRec `region` is initialized with RegionInit() and then RegionIntersect(&region, &region, dirty). Whenever the intersection of the CRTC bounds with the damage region yields more than one rectangle, the region's rect data is heap-allocated by the region ops, but the function returns (both on the RegionNil() FALSE path and on the successful TRUE path) without ever calling RegionUninit(&region). This is invoked on every DRI Present flip while TearFree is active, so the leak is recurring and grows with fragmented damage, a slow denial-of-service.","fix":"Call `RegionUninit(&region)` on every exit path after RegionInit. E.g. add it before the `return FALSE;` at the RegionNil check and before `return TRUE;` at the end:\n```c\n    if (RegionNil(&region)) {\n        RegionUninit(&region);\n        return FALSE;\n    }\n    ...\n    xorg_list_append(&flip->node, &trf->dri_flip_list);\n    RegionUninit(&region);\n    return TRUE;\n```\n(and RegionUninit before the `free(flip)`/`free(flipdata)` failure returns too).","locations":[{"ref":"hw/xfree86/drivers/video/modesetting/pageflip.c:345-381","code":"  345 |     /* Compute how much of the current damage intersects with this CRTC */\n  346 |     RegionInit(&region, &crtc->bounds, 0);\n  347 |     RegionIntersect(&region, &region, dirty);\n  348 | \n  349 |     /* No damage on this CRTC means no TearFree flip. This means the DRI client\n  350 |      * didn't change this CRTC's contents at all with its presentation, possibly\n  351 |      * because its window is fully occluded by another window on this CRTC.\n  352 |      */\n  353 |     if (RegionNil(&region))\n  354 |         return FALSE;\n  355 | \n  356 |     flip = calloc(1, sizeof(*flip));\n  357 |     if (!flip)\n  358 |         return FALSE;\n  359 | \n  360 |     flipdata = calloc(1, sizeof(*flipdata));\n  361 |     if (!flipdata) {\n  362 |         free(flip);\n  363 |         return FALSE;\n  364 |     }\n  365 | \n  366 |     /* Only track the DRI client's fake flip on the reference CRTC, which aligns\n  367 |      * with the behavior of Present when a client copies its pixmap rather than\n  368 |      * directly flipping it onto the display.\n  369 |      */\n  370 |     flip->on_reference_crtc = TRUE;\n  371 |     flip->flipdata = flipdata;\n  372 |     flip->tearfree_seq = trf->flip_seq;\n  373 |     flipdata->screen = xf86ScrnToScreen(crtc->scrn);\n  374 |     flipdata->event = event;\n  375 |     flipdata->flip_count = 1;\n  376 |     flipdata->event_handler = pageflip_handler;\n  377 |     flipdata->abort_handler = pageflip_abort;\n  378 | \n  379 |     /* Keep the list in FIFO order so that clients are notified in order */\n  380 |     xorg_list_append(&flip->node, &trf->dri_flip_list);\n  381 |     return TRUE;","lines":37,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/drivers/video/modesetting/pageflip.c#L345-L381"}]},
{"id":"MEM_13","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"PanoramiXExtensionInit (panoramiX.c) iterates screens backward and, for each\nscreen, calls calloc then dixSetPrivate then checks for NULL. If calloc fails\nfor screen N, screens already processed (higher-indexed screens in the backward\niteration) have had their `pScreenPriv` allocated and stored, and the close hook\nregistered. Execution then hits `noPanoramiXExtension = TRUE; return;` without\nfreeing those prior allocations. While the close hook will eventually fire when\nthose screens close, the extension is now disabled and PanoramiXResetProc will not\nrestore ProcVector entries that were already installed, leaving a partially\nmodified dispatch table. This is also a correctness issue: some screens have the\nXinerama GC hooks installed even though the extension is flagged as disabled.","fix":"Separate the allocation loop from the hook-registration loop: first allocate all privs in one pass (returning on failure before any hooks are set), then register hooks in a second pass only if all allocations succeeded.","locations":[{"ref":"Xext/panoramiX/panoramiX.c:464-476","code":"  464 |     XINERAMA_FOR_EACH_SCREEN_BACKWARD({\n  465 |         PanoramiXScreenPtr pScreenPriv = calloc(1, sizeof(PanoramiXScreenRec));\n  466 |         dixSetPrivate(&walkScreen->devPrivates, &PanoramiXScreenKeyRec,\n  467 |                       pScreenPriv);\n  468 |         if (!pScreenPriv) {\n  469 |             noPanoramiXExtension = TRUE;\n  470 |             return;\n  471 |         }\n  472 | \n  473 |         dixScreenHookClose(walkScreen, XineramaCloseScreen);\n  474 |         pScreenPriv->CreateGC = masterScreen->CreateGC;\n  475 |         walkScreen->CreateGC = XineramaCreateGC;\n  476 |     });","lines":13,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/panoramiX/panoramiX.c#L464-L476"}]},
{"id":"MEM_14","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"very_easy","description":"`XineramaConnectionCallbackList` entries registered via\n`XineramaRegisterConnectionBlockCallback` (panoramiX.c lines 363-375) are\nconsumed and freed inside `PanoramiXCreateConnectionBlock` (lines 673-679).\nHowever, `PanoramiXResetProc` (lines 865-876) does not drain the list. If the\nextension is reset before `PanoramiXCreateConnectionBlock` is called, all\nregistered callback list nodes leak.","fix":"Add a drain loop in PanoramiXResetProc that frees any remaining ConnectionCallbackList entries (same loop as in PanoramiXCreateConnectionBlock, minus calling the function pointers).","locations":[{"ref":"Xext/panoramiX/panoramiX.c:867-878","code":"  867 | PanoramiXResetProc(ExtensionEntry * extEntry)\n  868 | {\n  869 |     int i;\n  870 | \n  871 |     PanoramiXRenderReset();\n  872 |     PanoramiXFixesReset();\n  873 |     PanoramiXDamageReset();\n  874 |     PanoramiXCompositeReset ();\n  875 |     screenInfo.numScreens = PanoramiXNumScreens;\n  876 |     for (i = 256; i--;)\n  877 |         ProcVector[i] = SavedProcVector[i];\n  878 | }","lines":12,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/panoramiX/panoramiX.c#L867-L878"},{"ref":"Xext/panoramiX/panoramiX.c:675-681","code":"  675 |     while (ConnectionCallbackList) {\n  676 |         void *tmp;\n  677 | \n  678 |         tmp = (void *) ConnectionCallbackList;\n  679 |         (*ConnectionCallbackList->func) ();\n  680 |         ConnectionCallbackList = ConnectionCallbackList->next;\n  681 |         free(tmp);","lines":7,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/panoramiX/panoramiX.c#L675-L681"}]},
{"id":"MEM_15","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"In the Window->Pixmap branch of PanoramiXCopyArea, a heap buffer `data` (calloc at line 1136) is leaked when the per-screen `VALIDATE_DRAWABLE_AND_GC` at line 1144 fails. That macro (dix/dix_priv.h:112) does `return tmprc;` internally on a lookup failure or a depth/screen mismatch (BadMatch), bypassing the `free(data)` at line 1156. The subsequent explicit depth check (line 1145-1149) correctly frees, but the macro's early returns do not. A client under Xinerama can repeatedly trigger this (e.g. GC/pixmap depth mismatch on a secondary screen) to leak memory, a slow DoS vector.","fix":"Free `data` before returning from the failing macro. Since the macro returns internally, replace the raw `VALIDATE_DRAWABLE_AND_GC` here with an inline lookup that jumps to a cleanup label that does `free(data)`, or precede the loop by validating all destination drawables/GCs first. Minimal approach: expand the validation manually so each error path executes `free(data); return rc;`.","locations":[{"ref":"Xext/panoramiX/panoramiXprocs.c:1136-1157","code":" 1136 |         pitch = PixmapBytePad(width, drawables[0]->depth);\n 1137 |         if (!(data = calloc(height, pitch)))\n 1138 |             return BadAlloc;\n 1139 | \n 1140 |         XineramaGetImageData(drawables, srcx, srcy, width, height, ZPixmap, ~0,\n 1141 |                              data, pitch, srcIsRoot);\n 1142 | \n 1143 |         XINERAMA_FOR_EACH_SCREEN_BACKWARD({\n 1144 |             stuff->gc = gc->info[walkScreenIdx].id;\n 1145 |             VALIDATE_DRAWABLE_AND_GC(dst->info[walkScreenIdx].id, pDst, DixWriteAccess);\n 1146 |             if (drawables[0]->depth != pDst->depth) {\n 1147 |                 client->errorValue = stuff->dstDrawable;\n 1148 |                 free(data);\n 1149 |                 return BadMatch;\n 1150 |             }\n 1151 | \n 1152 |             (*pGC->ops->PutImage) (pDst, pGC, pDst->depth, dstx, dsty,\n 1153 |                                    width, height, 0, ZPixmap, data);\n 1154 |             if (dstShared)\n 1155 |                 break;\n 1156 |         });\n 1157 |         free(data);","lines":22,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/panoramiX/panoramiXprocs.c#L1136-L1157"}]},
{"id":"MEM_16","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"PanoramiXCopyArea (general branch) and PanoramiXCopyPlane build a `RegionRec totalReg` (RegionNull at lines 1215 / 1321) and append per-screen exposure regions into it inside the XINERAMA loop. If an error return happens mid-loop AFTER at least one RegionAppend has allocated data - e.g. the `X_CALL_CHECK_ERR(dixLookupDrawable(...))` at 1235/1340, the `return BadMatch` at 1240/1343, or the `return BadValue` at 1352-1353 (CopyPlane bitPlane validation) - `totalReg` is leaked because `RegionUninit(&totalReg)` is only reached in the normal completion path (1268 / 1376). Reachable by a Xinerama client with graphicsExposures enabled and a request that fails on a later screen after succeeding on an earlier one.","fix":"Add `RegionUninit(&totalReg);` before each mid-loop `return` in these two branches, or restructure to a single cleanup label (`goto out;`) that uninitializes the region and returns the status code.","locations":[{"ref":"Xext/panoramiX/panoramiXprocs.c:1212-1269","code":" 1212 |         DrawablePtr pDst = NULL, pSrc = NULL;\n 1213 |         GCPtr pGC = NULL;\n 1214 |         RegionRec totalReg;\n 1215 | \n 1216 |         RegionNull(&totalReg);\n 1217 | \n 1218 |         XINERAMA_FOR_EACH_SCREEN_BACKWARD({\n 1219 |             RegionPtr pRgn;\n 1220 | \n 1221 |             stuff->dstDrawable = dst->info[walkScreenIdx].id;\n 1222 |             stuff->srcDrawable = src->info[walkScreenIdx].id;\n 1223 |             stuff->gc = gc->info[walkScreenIdx].id;\n 1224 |             if (srcIsRoot) {\n 1225 |                 stuff->srcX = srcx - walkScreen->x;\n 1226 |                 stuff->srcY = srcy - walkScreen->y;\n 1227 |             }\n 1228 |             if (dstIsRoot) {\n 1229 |                 stuff->dstX = dstx - walkScreen->x;\n 1230 |                 stuff->dstY = dsty - walkScreen->y;\n 1231 |             }\n 1232 | \n 1233 |             VALIDATE_DRAWABLE_AND_GC(stuff->dstDrawable, pDst, DixWriteAccess);\n 1234 | \n 1235 |             if (stuff->dstDrawable != stuff->srcDrawable) {\n 1236 |                 X_CALL_CHECK_ERR(dixLookupDrawable(&pSrc, stuff->srcDrawable, client, 0,\n 1237 |                                            DixReadAccess));\n 1238 |                 if ((pDst->pScreen != pSrc->pScreen) ||\n 1239 |                     (pDst->depth != pSrc->depth)) {\n 1240 |                     client->errorValue = stuff->dstDrawable;\n 1241 |                     return BadMatch;\n 1242 |                 }\n 1243 |             }\n 1244 |             else\n 1245 |                 pSrc = pDst;\n 1246 | \n 1247 |             pRgn = (*pGC->ops->CopyArea) (pSrc, pDst, pGC,\n 1248 |                                           stuff->srcX, stuff->srcY,\n 1249 |                                           stuff->width, stuff->height,\n 1250 |                                           stuff->dstX, stuff->dstY);\n 1251 |             if (pGC->graphicsExposures && pRgn) {\n 1252 |                 if (srcIsRoot) {\n 1253 |                     RegionTranslate(pRgn, walkScreen->x, walkScreen->y);\n 1254 |                 }\n 1255 |                 RegionAppend(&totalReg, pRgn);\n 1256 |                 RegionDestroy(pRgn);\n 1257 |             }\n 1258 | \n 1259 |             if (dstShared)\n 1260 |                 break;\n 1261 |         });\n 1262 | \n 1263 |         if (pGC->graphicsExposures) {\n 1264 |             Bool overlap;\n 1265 | \n 1266 |             RegionValidate(&totalReg, &overlap);\n 1267 |             SendGraphicsExpose(client, &totalReg, stuff->dstDrawable,\n 1268 |                                X_CopyArea, 0);\n 1269 |             RegionUninit(&totalReg);","lines":58,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/panoramiX/panoramiXprocs.c#L1212-L1269"},{"ref":"Xext/panoramiX/panoramiXprocs.c:1322-1377","code":" 1322 |     RegionNull(&totalReg);\n 1323 | \n 1324 |     XINERAMA_FOR_EACH_SCREEN_BACKWARD({\n 1325 |         RegionPtr pRgn;\n 1326 | \n 1327 |         stuff->dstDrawable = dst->info[walkScreenIdx].id;\n 1328 |         stuff->srcDrawable = src->info[walkScreenIdx].id;\n 1329 |         stuff->gc = gc->info[walkScreenIdx].id;\n 1330 |         if (srcIsRoot) {\n 1331 |             stuff->srcX = srcx - walkScreen->x;\n 1332 |             stuff->srcY = srcy - walkScreen->y;\n 1333 |         }\n 1334 |         if (dstIsRoot) {\n 1335 |             stuff->dstX = dstx - walkScreen->x;\n 1336 |             stuff->dstY = dsty - walkScreen->y;\n 1337 |         }\n 1338 | \n 1339 |         VALIDATE_DRAWABLE_AND_GC(stuff->dstDrawable, pdstDraw, DixWriteAccess);\n 1340 |         if (stuff->dstDrawable != stuff->srcDrawable) {\n 1341 |             X_CALL_CHECK_ERR(dixLookupDrawable(&psrcDraw, stuff->srcDrawable, client, 0,\n 1342 |                                    DixReadAccess));\n 1343 |             if (pdstDraw->pScreen != psrcDraw->pScreen) {\n 1344 |                 client->errorValue = stuff->dstDrawable;\n 1345 |                 return BadMatch;\n 1346 |             }\n 1347 |         }\n 1348 |         else\n 1349 |             psrcDraw = pdstDraw;\n 1350 | \n 1351 |         if (stuff->bitPlane == 0 || (stuff->bitPlane & (stuff->bitPlane - 1)) ||\n 1352 |             (stuff->bitPlane > (1L << (psrcDraw->depth - 1)))) {\n 1353 |             client->errorValue = stuff->bitPlane;\n 1354 |             return BadValue;\n 1355 |         }\n 1356 | \n 1357 |         pRgn = (*pGC->ops->CopyPlane) (psrcDraw, pdstDraw, pGC,\n 1358 |                                        stuff->srcX, stuff->srcY,\n 1359 |                                        stuff->width, stuff->height,\n 1360 |                                        stuff->dstX, stuff->dstY,\n 1361 |                                        stuff->bitPlane);\n 1362 |         if (pGC->graphicsExposures && pRgn) {\n 1363 |             RegionAppend(&totalReg, pRgn);\n 1364 |             RegionDestroy(pRgn);\n 1365 |         }\n 1366 | \n 1367 |         if (dstShared)\n 1368 |             break;\n 1369 |     });\n 1370 | \n 1371 |     if (pGC->graphicsExposures) {\n 1372 |         Bool overlap;\n 1373 | \n 1374 |         RegionValidate(&totalReg, &overlap);\n 1375 |         SendGraphicsExpose(client, &totalReg, stuff->dstDrawable,\n 1376 |                            X_CopyPlane, 0);\n 1377 |         RegionUninit(&totalReg);","lines":56,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/panoramiX/panoramiXprocs.c#L1322-L1377"}]},
{"id":"MEM_17","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"In ProcXkbGetKbdByName, after a keymap has been loaded into `new` and the component name strings `names` have been populated, two early error returns `return BadAlloc;` (when a child rpcbuf allocation fails while assembling the Map or IndicatorMap sub-replies) bypass all cleanup at the end of the function. This leaks the freshly loaded XkbDescPtr `new` (a full keyboard description, potentially large), the strdup'd strings held in `names` (freed normally by XkbFreeComponentNames), and the accumulated parent `rpcbuf`. Only reachable under memory pressure, but it is a genuine resource leak on an attacker-influenceable request path.","fix":"Replace the bare `return BadAlloc;` in these blocks with a jump to a shared cleanup epilogue that frees `new` (via XkbFreeKeyboard when new != xkb), calls XkbFreeComponentNames(&names, FALSE), and clears the parent rpcbuf before returning the error code.","locations":[{"ref":"Xext/xkeyboard/xkb.c:5990-5991","code":" 5990 |         if (childbuf.error)\n 5991 |             return BadAlloc;","lines":2,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/xkeyboard/xkb.c#L5990-L5991"},{"ref":"Xext/xkeyboard/xkb.c:6035-6036","code":" 6035 |         if (childbuf.error)\n 6036 |             return BadAlloc;","lines":2,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/xkeyboard/xkb.c#L6035-L6036"}]},
{"id":"MEM_18","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"config_info allocated with asprintf() in both wscons_add_keyboard() and wscons_add_pointer() is never freed - the `unwind` labels only call input_option_free_list(). Additionally, wscons_add_pointer() passes strdup()'d strings to input_option_new() for \"name\", \"driver\" and \"device\"; input_option_set_value() strdup's the value itself (dix/inpututils.c), so each of those strdup() results is leaked. Startup-time leaks (BSD wscons backend), but real.","fix":"Add `free(config_info);` at the `unwind:` label (and before the early `return` after the asprintf/NULL-option checks) in both functions, and drop the redundant strdup() calls in wscons_add_pointer() (pass `path`/`driver` directly, since input_option_new copies them).","locations":[{"ref":"config/wscons.c:128-180","code":"  128 |     if (asprintf(&config_info, \"wscons:%s\", WSCONS_KBD_DEVICE) == -1)\n  129 |         goto unwind;\n  130 |     if (KB_ENCODING(wsenc) == KB_USER) {\n  131 |         /* Ignore wscons \"user\" layout */\n  132 |         LogMessageVerb(X_INFO, 3, \"wskbd: ignoring \\\"user\\\" layout\\n\");\n  133 |         goto kbd_config_done;\n  134 |     }\n  135 |     for (i = 0; kbdenc[i].val; i++)\n  136 |         if (KB_ENCODING(wsenc) == kbdenc[i].val) {\n  137 |             LogMessageVerb(X_INFO, 3, \"wskbd: using layout %s\\n\",\n  138 |                            kbdenc[i].name);\n  139 |             input_options = input_option_new(input_options,\n  140 |                                              \"xkb_layout\", kbdenc[i].name);\n  141 |             break;\n  142 |         }\n  143 |     for (i = 0; kbdvar[i].val; i++)\n  144 |         if (wsenc == kbdvar[i].val || KB_VARIANT(wsenc) == kbdvar[i].val) {\n  145 |             LogMessageVerb(X_INFO, 3, \"wskbd: using variant %s\\n\",\n  146 |                            kbdvar[i].name);\n  147 |             input_options = input_option_new(input_options,\n  148 |                                              \"xkb_variant\", kbdvar[i].name);\n  149 |             break;\n  150 |         }\n  151 |     for (i = 0; kbdopt[i].val; i++)\n  152 |         if (KB_VARIANT(wsenc) == kbdopt[i].val) {\n  153 |             LogMessageVerb(X_INFO, 3, \"wskbd: using option %s\\n\",\n  154 |                            kbdopt[i].name);\n  155 |             input_options = input_option_new(input_options,\n  156 |                                              \"xkb_options\", kbdopt[i].name);\n  157 |             break;\n  158 |         }\n  159 |     for (i = 0; kbdmodel[i].val; i++)\n  160 |         if (type == kbdmodel[i].val) {\n  161 |             LogMessageVerb(X_INFO, 3, \"wskbd: using model %s\\n\",\n  162 |                            kbdmodel[i].name);\n  163 |             input_options = input_option_new(input_options,\n  164 |                                              \"xkb_model\", kbdmodel[i].name);\n  165 |             break;\n  166 |         }\n  167 | \n  168 |  kbd_config_done:\n  169 |     attrs.flags |= ATTR_KEY | ATTR_KEYBOARD;\n  170 |     rc = NewInputDeviceRequest(input_options, &attrs, &dev);\n  171 |     if (rc != Success)\n  172 |         goto unwind;\n  173 | \n  174 |     for (; dev; dev = dev->next) {\n  175 |         free(dev->config_info);\n  176 |         dev->config_info = strdup(config_info);\n  177 |     }\n  178 |  unwind:\n  179 |     input_option_free_list(&input_options);\n  180 | }","lines":53,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/config/wscons.c#L128-L180"},{"ref":"config/wscons.c:191-213","code":"  191 |     if (asprintf(&config_info, \"wscons:%s\", path) == -1)\n  192 |         return;\n  193 | \n  194 |     input_options = input_option_new(input_options, \"_source\", \"server/wscons\");\n  195 |     if (input_options == NULL)\n  196 |         return;\n  197 | \n  198 |     input_options = input_option_new(input_o {"id":"MEM_19","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"In dixCreateColormap the AllocAll error paths for the default colormap (mid == pScreen->defColormap) call `free(pmap)` directly after the colormap's privates were allocated separately via dixAllocatePrivates. These paths leak the devPrivates (and the non-default path uses free(pmap) instead of dixFreeObjectWithPrivates / dixFiniPrivates). Only reachable on allocation failure while AllocAll is requested for the default colormap, so impact is minor, but it is an inconsistent cleanup vs. the success path in FreeColormap.","fix":"On these BadAlloc error paths, release privates the same way FreeColormap does before freeing pmap: for the default colormap call `dixFreePrivates(pmap->devPrivates, PRIVATE_COLORMAP); free(pmap);`, and for the non-default allocation use `dixFreeObjectWithPrivates(pmap, PRIVATE_COLORMAP);` instead of a bare `free(pmap)`.","locations":[{"ref":"dix/colormap.c:304-319","code":"  304 |     if (alloc == AllocAll) {\n  305 |         if (class & DynamicClass)\n  306 |             pmap->flags |= CM_AllAllocated;\n  307 |         for (EntryPtr pent = &pmap->red[size - 1]; pent >= pmap->red; pent--)\n  308 |             pent->refcnt = AllocPrivate;\n  309 |         pmap->freeRed = 0;\n  310 |         Pixel *ppix = calloc(size, sizeof(Pixel));\n  311 |         if (!ppix) {\n  312 |             free(pmap);\n  313 |             return BadAlloc;\n  314 |         }\n  315 |         pmap->clientPixelsRed[clientIndex] = ppix;\n  316 |         for (int i = 0; i < size; i++)\n  317 |             ppix[i] = i;\n  318 |         pmap->numPixelsRed[clientIndex] = size;\n  319 |     }","lines":16,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/dix/colormap.c#L304-L319"},{"ref":"dix/colormap.c:345-377","code":"  345 |         /* If every cell is allocated, mark its refcnt */\n  346 |         if (alloc == AllocAll) {\n  347 |             size = pmap->freeGreen;\n  348 |             for (EntryPtr pent = &pmap->green[size - 1]; pent >= pmap->green; pent--)\n  349 |                 pent->refcnt = AllocPrivate;\n  350 |             pmap->freeGreen = 0;\n  351 |             Pixel *ppix = calloc(size, sizeof(Pixel));\n  352 |             if (!ppix) {\n  353 |                 free(pmap->clientPixelsRed[clientIndex]);\n  354 |                 free(pmap);\n  355 |                 return BadAlloc;\n  356 |             }\n  357 |             pmap->clientPixelsGreen[clientIndex] = ppix;\n  358 |             for (int i = 0; i < size; i++)\n  359 |                 ppix[i] = i;\n  360 |             pmap->numPixelsGreen[clientIndex] = size;\n  361 | \n  362 |             size = pmap->freeBlue;\n  363 |             for (EntryPtr pent = &pmap->blue[size - 1]; pent >= pmap->blue; pent--)\n  364 |                 pent->refcnt = AllocPrivate;\n  365 |             pmap->freeBlue = 0;\n  366 |             ppix = calloc(size, sizeof(Pixel));\n  367 |             if (!ppix) {\n  368 |                 free(pmap->clientPixelsGreen[clientIndex]);\n  369 |                 free(pmap->clientPixelsRed[clientIndex]);\n  370 |                 free(pmap);\n  371 |                 return BadAlloc;\n  372 |             }\n  373 |             pmap->clientPixelsBlue[clientIndex] = ppix;\n  374 |             for (int i = 0; i < size; i++)\n  375 |                 ppix[i] = i;\n  376 |             pmap->numPixelsBlue[clientIndex] = size;\n  377 |         }","lines":33,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/dix/colormap.c#L345-L377"}]},
{"id":"MEM_20","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"In doListFontsAndAliases(), the local `names` is initialized to NULL and only assigned `c->names` at the `finish:` label. Every `goto bail` that happens *before* `finish:` (the `client->clientGone` early-out and the `err != Successful` error-reply path) leaves `names == NULL`, so the cleanup `xfont2_free_font_names(names)` frees NULL while the actually-allocated `c->names` record (plus every font name already accumulated into it) is leaked. A client that disconnects while a ListFonts request is suspended on a slow FPE (font server), or that triggers an FPE error, leaks this record on every such request, giving a client-triggerable memory leak.","fix":"Free the real record on all exit paths. Either set `names = c->names;` before the early `goto bail` sites, or change the cleanup to free `c->names` directly, e.g. replace `xfont2_free_font_names(names);` in the `bail:` block with `xfont2_free_font_names(c->names);` (and drop the now-unused local).","locations":[{"ref":"dix/dixfonts.c:589-601","code":"  589 |     FontNamesPtr names = NULL;\n  590 |     char *name, *resolved = NULL;\n  591 |     int namelen, resolvedlen = 0;\n  592 |     int aliascount = 0;\n  593 | \n  594 |     if (client->clientGone) {\n  595 |         if (c->current.current_fpe < c->num_fpes) {\n  596 |             fpe = c->fpe_list[c->current.current_fpe];\n  597 |             (*fpe_functions[fpe->type]->client_died) ((void *) client, fpe);\n  598 |         }\n  599 |         err = Successful;\n  600 |         goto bail;\n  601 |     }","lines":13,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/dix/dixfonts.c#L589-L601"},{"ref":"dix/dixfonts.c:762-765","code":"  762 |     if (err != Successful) {\n  763 |         SendErrorToClient(client, X_ListFonts, 0, 0, FontToXError(err));\n  764 |         goto bail;\n  765 |     }","lines":4,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/dix/dixfonts.c#L762-L765"},{"ref":"dix/dixfonts.c:798-807","code":"  798 |  bail:\n  799 |     ClientWakeup(client);\n  800 |     for (int i = 0; i < c->num_fpes; i++)\n  801 |         FreeFPE(c->fpe_list[i]);\n  802 |     free(c->fpe_list);\n  803 |     free(c->savedName);\n  804 |     xfont2_free_font_names(names);\n  805 |     free(c);\n  806 |     free(resolved);\n  807 |     return TRUE;","lines":10,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/dix/dixfonts.c#L798-L807"}]},
{"id":"MEM_21","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"very_easy","description":"In ClientSleepUntil, if AddResource() fails, the function returns FALSE without freeing the calloc'd pRequest, and after the block/wakeup handlers may already have been registered. This leaks the SertafiedRec on the (rare) AddResource failure path.","fix":"Free on failure:\n```c\n    if (!AddResource(pRequest->id, SertafiedResType, (void *) pRequest)) {\n        free(pRequest);\n        return FALSE;\n    }\n```","locations":[{"ref":"dix/sleepuntil.c:100-101","code":"  100 |     if (!AddResource(pRequest->id, SertafiedResType, (void *) pRequest))\n  101 |         return FALSE;","lines":2,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/dix/sleepuntil.c#L100-L101"}]},
{"id":"MEM_22","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"very_easy","description":"In exaCreatePixmap_driver(), the early `return NullPixmap` taken when `paddedWidth / 4 > 32767` leaks the PixmapPtr already allocated by pScreen->CreatePixmap() at line 62. Every other error exit in this function (lines 100-104) correctly calls dixDestroyPixmap() first. The classic variant (exa_classic.c:98-103) also destroys the pixmap on the analogous pitch check. With the w/h<=32767 guard and max bpp of 32 this branch is practically unreachable today, but it is a genuine leak if ever hit and an inconsistency with the sibling code.","fix":"Destroy the already-created pixmap before returning:\n```c\nif (paddedWidth / 4 > 32767) {\n    dixDestroyPixmap(pPixmap, 0);\n    return NULL;\n}\n```","locations":[{"ref":"exa/exa_driver.c:89-90","code":"   89 |         if (paddedWidth / 4 > 32767)\n   90 |             return NullPixmap;","lines":2,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/exa/exa_driver.c#L89-L90"}]},
{"id":"MEM_23","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"exaRealizeGlyphCaches() creates pPicture with an initial refcount of 1 (line 195), then for each matching cache does `cache->picture->refcnt++` (line 213). On the success path it drops the initial reference with FreePicture() at line 228, leaving one ref per cache. On the `bail:` path (line 231) it calls exaUnrealizeGlyphCaches(), which FreePicture()s exactly the per-cache references it added, but the initial creation reference is never released, so pPicture (and the backing cache pixmap it holds) is leaked. This path is taken only when the calloc() of hashEntries/glyphs fails (OOM), so impact is low, but it is a genuine leak reachable from client glyph rendering.","fix":"Release the initial reference on the failure path as well, e.g. add `FreePicture((void *) pPicture, (XID) 0);` after the exaUnrealizeGlyphCaches() call in the `bail:` block (the per-cache refs are already dropped by exaUnrealizeGlyphCaches, so this drops only the creation ref).","locations":[{"ref":"exa/exa_glyphs.c:195-234","code":"  195 |     pPicture = CreatePicture(0, &pPixmap->drawable, pPictFormat,\n  196 |                              CPComponentAlpha, &component_alpha, serverClient,\n  197 |                              &error);\n  198 | \n  199 |     dixDestroyPixmap(pPixmap, 0); /* picture holds a refcount */\n  200 | \n  201 |     if (!pPicture)\n  202 |         return FALSE;\n  203 | \n  204 |     /* And store the picture in all the caches for the format */\n  205 |     for (i = 0; i < EXA_NUM_GLYPH_CACHES; i++) {\n  206 |         ExaGlyphCachePtr cache = &pExaScr->glyphCaches[i];\n  207 |         int j;\n  208 | \n  209 |         if (cache->format != format)\n  210 |             continue;\n  211 | \n  212 |         cache->picture = pPicture;\n  213 |         cache->picture->refcnt++;\n  214 |         cache->hashEntries = calloc(cache->hashSize, sizeof(int));\n  215 |         cache->glyphs = calloc(cache->size, sizeof(ExaCachedGlyphRec));\n  216 |         cache->glyphCount = 0;\n  217 | \n  218 |         if (!cache->hashEntries || !cache->glyphs)\n  219 |             goto bail;\n  220 | \n  221 |         for (j = 0; j < cache->hashSize; j++)\n  222 |             cache->hashEntries[j] = -1;\n  223 | \n  224 |         cache->evictionPosition = rand() % cache->size;\n  225 |     }\n  226 | \n  227 |     /* Each cache references the picture individually */\n  228 |     FreePicture((void *) pPicture, (XID) 0);\n  229 |     return TRUE;\n  230 | \n  231 |  bail:\n  232 |     exaUnrealizeGlyphCaches(pScreen, format);\n  233 |     return FALSE;\n  234 | }","lines":40,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/exa/exa_glyphs.c#L195-L234"}]},
{"id":"MEM_24","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"In glamor_composite_largepixmap_region(), when the source/dest share a pixmap the code allocates a copy of the priv with calloc() and then does `BUG_RETURN_VAL(!source_pixmap_priv, FALSE);`. That early return happens after clipped_dest_regions (and all its RegionPtr entries) were already allocated at lines 1179/1185, so on the calloc OOM path they are leaked. The region translation done at line 1117 (`RegionTranslate(region, -dest->pDrawable->x, ...)`) is also not undone before returning, leaving the caller's region shifted.","fix":"On the calloc failure path, free the already-computed clipped_dest_regions (destroying their regions) and translate `region` back by `+dest->pDrawable->x/y` before returning FALSE, instead of using a bare BUG_RETURN_VAL.","locations":[{"ref":"glamor/glamor_largepixmap.c:1195-1200","code":" 1195 |         need_free_source_pixmap_priv = source_pixmap_priv;\n 1196 |         source_pixmap_priv = calloc(1, sizeof(*source_pixmap_priv));\n 1197 |         BUG_RETURN_VAL(!source_pixmap_priv, FALSE);\n 1198 |         *source_pixmap_priv = *need_free_source_pixmap_priv;\n 1199 |         need_free_source_pixmap_priv = source_pixmap_priv;\n 1200 |     }","lines":6,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/glamor/glamor_largepixmap.c#L1195-L1200"},{"ref":"glamor/glamor_largepixmap.c:1177-1188","code":" 1177 |     if (force_clip || fixed_block_width < dest_block_width\n 1178 |         || fixed_block_height < dest_block_height)\n 1179 |         clipped_dest_regions =\n 1180 |             glamor_compute_clipped_regions_ext(dest_pixmap, region,\n 1181 |                                                &n_dest_regions,\n 1182 |                                                fixed_block_width,\n 1183 |                                                fixed_block_height, 0, 0);\n 1184 |     else\n 1185 |         clipped_dest_regions = glamor_compute_clipped_regions(dest_pixmap,\n 1186 |                                                               region,\n 1187 |                                                               &n_dest_regions,\n 1188 |                                                               0, 0, 0);","lines":12,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/glamor/glamor_largepixmap.c#L1177-L1188"}]},
{"id":"MEM_25","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"very_easy","description":"In NewInputDeviceRequest, when a device has `type` equal to something other than \"pointer\"/\"keyboard\", the code logs \"unrecognised device type!\" and returns BadValue without freeing `optionsdup`, which has been accumulating input_option copies for each processed option. Every such request leaks the duplicated option list.","fix":"Before returning:\n```c\n            else {\n                ErrorF(\"unrecognised device type!\\n\");\n                input_option_free_list(&optionsdup);\n                return BadValue;\n            }\n```","locations":[{"ref":"hw/kdrive/src/kinput.c:2298-2301","code":" 2298 |             else {\n 2299 |                 ErrorF(\"unrecognised device type!\\n\");\n 2300 |                 return BadValue;\n 2301 |             }","lines":4,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/kdrive/src/kinput.c#L2298-L2301"}]},
{"id":"MEM_26","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"In xf86MatchDriverFromFiles, when the per-driver-name calloc fails the code logs and does `goto end`, but the currently open FILE *fp is never closed (end: only frees `line` and closes the directory). Each such failure leaks a file descriptor. (The log text even claims \"Exiting.\" but the function merely returns.)","fix":"Call `fclose(fp);` before `goto end` on the allocation-failure path (and on the earlier fopen-failure path fp is NULL so no change needed there), or restructure so fp is always closed before jumping to the cleanup label.","locations":[{"ref":"hw/xfree86/common/xf86pciBus.c:1356-1363","code":" 1356 |                         tmpMatch =\n 1357 |                             (char *) calloc(1, sizeof(char) *\n 1358 |                                             strlen(direntry->d_name) - 3);\n 1359 |                         if (!tmpMatch) {\n 1360 |                             LogMessageVerb(X_ERROR, 1,\n 1361 |                                            \"Could not allocate space for the module name. Exiting.\\n\");\n 1362 |                             goto end;\n 1363 |                         }","lines":8,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/common/xf86pciBus.c#L1356-L1363"},{"ref":"hw/xfree86/common/xf86pciBus.c:1390-1393","code":" 1390 |  end:\n 1391 |     free(line);\n 1392 |     closedir(idsdir);\n 1393 | }","lines":4,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/common/xf86pciBus.c#L1390-L1393"}]},
{"id":"MEM_27","type":"memory_leak","type_label":"Memory Leak","severity":"negligible","difficulty":"easy","description":"ProcXvMCListSubpictureTypes() returns BadImplementation mid-loop (when a compatible xvimage id has no matching entry in adaptor->subpictures) without clearing the rpcbuf. Data already written by x_rpcbuf_write_* leaves an allocated buffer that is never freed (the normal path frees it via X_SEND_REPLY_WITH_RPCBUF -> x_rpcbuf_clear). Only triggered by an inconsistent driver surface table, so impact is negligible.","fix":"Call `x_rpcbuf_clear(&rpcbuf);` before `return BadImplementation;` (or restructure to jump to a cleanup path).","locations":[{"ref":"Xext/xv/xvmc.c:539-541","code":"  539 |             if (!pImage) {\n  540 |                 return BadImplementation;\n  541 |             }","lines":3,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/xv/xvmc.c#L539-L541"}]},
{"id":"MEM_28","type":"memory_leak","type_label":"Memory Leak","severity":"negligible","difficulty":"easy","description":"CreateGCperDepth() creates the depth-1 scratch GC into ppGC[0] and only afterwards performs the `numDepths > MAXFORMATS` overflow guard, returning FALSE on that path without freeing ppGC[0]. The check should precede the allocation. Impact is negligible (init-time, numDepths is DDX-controlled and the caller FatalError()s), but the ordering and leak are still incorrect.","fix":"Move the `if (pScreen->numDepths > MAXFORMATS) return FALSE;` check above the `ppGC[0] = CreateScratchGC(...)` allocation so no scratch GC is leaked when the depth count is out of range.","locations":[{"ref":"dix/gc.c:843-847","code":"  843 |     if (!(ppGC[0] = CreateScratchGC(pScreen, 1)))\n  844 |         return FALSE;\n  845 |     /* Make sure we don't overflow GCperDepth[] */\n  846 |     if (pScreen->numDepths > MAXFORMATS)\n  847 |         return FALSE;","lines":5,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/dix/gc.c#L843-L847"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"Several 'Single' dispatch functions compute n * 4 (or n * 8 for doubles) as a signed 32-bit multiplication (GLsizei * int) and pass the result directly to __glXGetAnswerBuffer as size_t. When a client supplies n = 0x40000000, the signed multiplication n * 4 overflows and wraps to 0. __glXGetAnswerBuffer receives required_size = 0, which is less than sizeof(answerBuffer), so it returns the 200-element stack buffer. The GL function (e.g., glGenTextures, glGenQueries, glGenFramebuffers) is then called with the original, unclamped n = 0x40000000 and writes 2^30 elements into that stack buffer, overflowing it. Affected functions include: __glXDisp_GenTextures, __glXDisp_GenTexturesEXT, __glXDisp_GenQueries, __glXDisp_GenProgramsARB, __glXDisp_GenFramebuffers, __glXDisp_GenRenderbuffers.","fix":"Validate n before the multiplication: if n <= 0 or n > some reasonable upper bound (e.g., the request length divided by sizeof(GLuint)), return BadValue. Alternatively cast to size_t before multiplying: (size_t)n * 4.","locations":[{"ref":"Xext/glx/indirect_dispatch.c:2596-2612","code":" 2596 |     if (cx != NULL) {\n 2597 |         const GLsizei n = *(GLsizei *) (pc + 0);\n 2598 | \n 2599 |         GLuint answerBuffer[200];\n 2600 |         GLuint *textures =\n 2601 |             __glXGetAnswerBuffer(cl, n * 4, answerBuffer, sizeof(answerBuffer),\n 2602 |                                  4);\n 2603 | \n 2604 |         if (textures == NULL)\n 2605 |             return BadAlloc;\n 2606 |         glGenTextures(n, textures);\n 2607 |         __glXSendReply(cl->client, textures, n, 4, GL_TRUE, 0);\n 2608 |         error = Success;\n 2609 |     }\n 2610 | \n 2611 |     return error;\n 2612 | }","lines":17,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/indirect_dispatch.c#L2596-L2612"},{"ref":"Xext/glx/indirect_dispatch.c:2621-2638","code":" 2621 |     pc += __GLX_VENDPRIV_HDR_SIZE;\n 2622 |     if (cx != NULL) {\n 2623 |         const GLsizei n = *(GLsizei *) (pc + 0);\n 2624 | \n 2625 |         GLuint answerBuffer[200];\n 2626 |         GLuint *textures =\n 2627 |             __glXGetAnswerBuffer(cl, n * 4, answerBuffer, sizeof(answerBuffer),\n 2628 |                                  4);\n 2629 | \n 2630 |         if (textures == NULL)\n 2631 |             return BadAlloc;\n 2632 |         glGenTextures(n, textures);\n 2633 |         __glXSendReply(cl->client, textures, n, 4, GL_TRUE, 0);\n 2634 |         error = Success;\n 2635 |     }\n 2636 | \n 2637 |     return error;\n 2638 | }","lines":18,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/indirect_dispatch.c#L2621-L2638"},{"ref":"Xext/glx/indirect_dispatch.c:3883-3908","code":" 3883 | int\n 3884 | __glXDisp_GenQueries(__GLXclientState * cl, GLbyte * pc)\n 3885 | {\n 3886 |     PFNGLGENQUERIESPROC GenQueries = __glGetProcAddress(\"glGenQueries\");\n 3887 |     xGLXSingleReq *const req = (xGLXSingleReq *) pc;\n 3888 |     int error;\n 3889 |     __GLXcontext *const cx = __glXForceCurrent(cl, req->contextTag, &error);\n 3890 | \n 3891 |     pc += __GLX_SINGLE_HDR_SIZE;\n 3892 |     if (cx != NULL) {\n 3893 |         const GLsizei n = *(GLsizei *) (pc + 0);\n 3894 | \n 3895 |         GLuint answerBuffer[200];\n 3896 |         GLuint *ids =\n 3897 |             __glXGetAnswerBuffer(cl, n * 4, answerBuffer, sizeof(answerBuffer),\n 3898 |                                  4);\n 3899 | \n 3900 |         if (ids == NULL)\n 3901 |             return BadAlloc;\n 3902 |         GenQueries(n, ids);\n 3903 |         __glXSendReply(cl->client, ids, n, 4, GL_TRUE, 0);\n 3904 |         error = Success;\n 3905 |     }\n 3906 | \n 3907 |     return error;\n 3908 | }","lines":26,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/indire
