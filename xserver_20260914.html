{"id":"LOGIC_96","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"very_easy","description":"The extension error-count overflow check applies the `(unsigned)` cast to the *result* of a comparison rather than to the sum. `(unsigned)(lastError + NumErrors > LAST_ERROR)` casts a boolean (0/1) to unsigned, which is a no-op; the intent was almost certainly `(unsigned)(lastError + NumErrors) > LAST_ERROR`. It happens to compute the correct answer for the small positive values involved, but the construct is misleading and the parenthesization is a latent mistake. Not client-reachable (extensions register at startup).","fix":"Move the cast to the operand:\n```c\nif ((lastEvent + NumEvents > MAXEVENTS) ||\n    ((unsigned)(lastError + NumErrors) > LAST_ERROR)) {\n```","locations":[{"ref":"dix/extension.c:142-143","code":"  142 |     if ((lastEvent + NumEvents > MAXEVENTS) ||\n  143 |         (unsigned) (lastError + NumErrors > LAST_ERROR)) {","lines":2,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/dix/extension.c#L142-L143"}]},
{"id":"LOGIC_97","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"very_easy","description":"In log_window_info() the local `visibility` pointer is only assigned inside the switch on pWin->visibility, which has no `default` case. If pWin->visibility ever holds a value outside the four enumerated states, `visibility` is used uninitialized at the ErrorF() at line 261 (garbage pointer deref). This is a debug-only path (PrintWindowTree), and the field is normally constrained, so impact is minimal, but the switch should have a default.","fix":"Initialize the variable, e.g. `const char *visibility = \"unknown\";` at declaration, or add a `default:` case setting it.","locations":[{"ref":"dix/window.c:228-264","code":"  228 |     const char *win_name, *visibility;\n  229 |     BoxPtr rects;\n  230 | \n  231 |     for (int i = 0; i < (depth << 2); i++)\n  232 |         ErrorF(\" \");\n  233 | \n  234 |     win_name = get_window_name(pWin);\n  235 |     ErrorF(\"win 0x%.8x (%s), [%d, %d] to [%d, %d]\",\n  236 |            (unsigned) pWin->drawable.id,\n  237 |            win_name ? win_name : \"no name\",\n  238 |            pWin->drawable.x, pWin->drawable.y,\n  239 |            pWin->drawable.x + pWin->drawable.width,\n  240 |            pWin->drawable.y + pWin->drawable.height);\n  241 | \n  242 |     if (pWin->overrideRedirect)\n  243 |         ErrorF(\" (override redirect)\");\n  244 |     if (pWin->redirectDraw)\n  245 |         ErrorF(\" (%s compositing: pixmap %x)\",\n  246 |                (pWin->redirectDraw == RedirectDrawAutomatic) ?\n  247 |                \"automatic\" : \"manual\",\n  248 |                (unsigned) pWin->drawable.pScreen->GetWindowPixmap(pWin)->drawable.id);\n  249 | \n  250 |     switch (pWin->visibility) {\n  251 |     case VisibilityUnobscured:\n  252 |         visibility = \"unobscured\";\n  253 |         break;\n  254 |     case VisibilityPartiallyObscured:\n  255 |         visibility = \"partially obscured\";\n  256 |         break;\n  257 |     case VisibilityFullyObscured:\n  258 |         visibility = \"fully obscured\";\n  259 |         break;\n  260 |     case VisibilityNotViewable:\n  261 |         visibility = \"unviewable\";\n  262 |         break;\n  263 |     }\n  264 |     ErrorF(\", %s\", visibility);","lines":37,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/dix/window.c#L228-L264"}]},
{"id":"LOGIC_98","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"very_easy","description":"fbValidateBits() is declared to return Bool but falls off the end of the function without a return statement when all bits match (the only return is inside the mismatch branch). This is undefined behavior (returns an indeterminate value), so fbValidateDrawable() may spuriously reinitialize a valid drawable. The code is only compiled under FB_DEBUG, so impact in production builds is nil.","fix":"Add `return TRUE;` after the `while (stride--) { ... }` loop in fbValidateBits().","locations":[{"ref":"fb/fbpixmap.c:293-309","code":"  293 | static Bool\n  294 | fbValidateBits(FbStip * bits, int stride, FbStip data)\n  295 | {\n  296 |     while (stride--) {\n  297 |         if (*bits != data) {\n  298 | #ifdef WIN32\n  299 |             NCD_DEBUG((DEBUG_FAILURE,\n  300 |                        \"fdValidateBits failed at 0x%x (is 0x%x want 0x%x)\",\n  301 |                        bits, *bits, data));\n  302 | #else\n  303 |             fprintf(stderr, \"fbValidateBits failed\\n\");\n  304 | #endif\n  305 |             return FALSE;\n  306 |         }\n  307 |         bits++;\n  308 |     }\n  309 | }","lines":17,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/fb/fbpixmap.c#L293-L309"}]},
{"id":"LOGIC_99","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"very_easy","description":"EvdevPtrMotion()'s absolute-axis change-detection loop uses `for (i = 0; i < ke->max_abs; i++)` whereas every other abs loop in the file uses `<= ke->max_abs`. The last absolute axis (index max_abs) is therefore never checked for change, so a report that only changes the highest axis is skipped. Impact is limited to the debug ErrorF() output.","fix":"Use `for (i = 0; i <= ke->max_abs; i++)` to match the rest of the file.","locations":[{"ref":"hw/kdrive/linux/evdev/evdev.c:117","code":"  117 |     for (i = 0; i < ke->max_abs; i++)","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/kdrive/linux/evdev/evdev.c#L117"}]},
{"id":"LOGIC_100","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"handle_detailed_input (DDC monitor auto-config) mishandles the DS_RANGES block: it indexes mon_vrefresh with the hsync counter (`ptr->mon_vrefresh[ptr->mon_n_hsync]`) and hard-codes `ptr->mon_n_vrefresh = 1` instead of tracking a separate vrefresh count, and the case has no `break` (falls through to default). Harmless in practice because EDID has a single ranges block, and default does nothing, but the vrefresh count/indexing is wrong for multiple ranges blocks. -configure-only path.","fix":"Use a dedicated vrefresh index/counter and add a `break;` after the DS_RANGES case; increment mon_n_vrefresh rather than assigning 1.","locations":[{"ref":"hw/xfree86/common/xf86Configure.c:476-484","code":"  476 |     case DS_RANGES:\n  477 |         ptr->mon_hsync[ptr->mon_n_hsync].lo = det_mon->section.ranges.min_h;\n  478 |         ptr->mon_hsync[ptr->mon_n_hsync].hi = det_mon->section.ranges.max_h;\n  479 |         ptr->mon_n_vrefresh = 1;\n  480 |         ptr->mon_vrefresh[ptr->mon_n_hsync].lo = det_mon->section.ranges.min_v;\n  481 |         ptr->mon_vrefresh[ptr->mon_n_hsync].hi = det_mon->section.ranges.max_v;\n  482 |         ptr->mon_n_hsync++;\n  483 |     default:\n  484 |         break;","lines":9,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/common/xf86Configure.c#L476-L484"}]},
{"id":"LOGIC_101","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"In ddxProcessArgument() the -gamma/-rgamma/-ggamma/-bgamma handler consumes the value argument via argv[++i] and, on a successful sscanf but out-of-range value, returns 0 (\"argument not recognized\") after already having logically consumed the value. When sscanf itself fails there is no return at all, so control falls through to the subsequent option checks and ultimately xf86ProcessArgument with the advanced local i. This produces confusing argument accounting for malformed -gamma invocations (the value token is later re-interpreted as a standalone argument).","fix":"On both the out-of-range and sscanf-failure paths, print the usage error and `return 0` consistently without advancing i first (parse into a temp index and only commit on success), matching the -depth/-fbbpp handlers.","locations":[{"ref":"hw/xfree86/common/xf86Init.c:1071-1092","code":" 1071 |     if (!strcmp(argv[i], \"-gamma\") || !strcmp(argv[i], \"-rgamma\") ||\n 1072 |         !strcmp(argv[i], \"-ggamma\") || !strcmp(argv[i], \"-bgamma\")) {\n 1073 |         double gamma;\n 1074 | \n 1075 |         CHECK_FOR_REQUIRED_ARGUMENTS(1);\n 1076 |         if (sscanf(argv[++i], \"%lf\", &gamma) == 1) {\n 1077 |             if (gamma < GAMMA_MIN || gamma > GAMMA_MAX) {\n 1078 |                 ErrorF(\"gamma out of range, only  %.2f <= gamma_value <= %.1f\"\n 1079 |                        \" is valid\\n\", GAMMA_MIN, GAMMA_MAX);\n 1080 |                 return 0;\n 1081 |             }\n 1082 |             if (!strcmp(argv[i - 1], \"-gamma\"))\n 1083 |                 xf86Gamma.red = xf86Gamma.green = xf86Gamma.blue = gamma;\n 1084 |             else if (!strcmp(argv[i - 1], \"-rgamma\"))\n 1085 |                 xf86Gamma.red = gamma;\n 1086 |             else if (!strcmp(argv[i - 1], \"-ggamma\"))\n 1087 |                 xf86Gamma.green = gamma;\n 1088 |             else if (!strcmp(argv[i - 1], \"-bgamma\"))\n 1089 |                 xf86Gamma.blue = gamma;\n 1090 |             return 2;\n 1091 |         }\n 1092 |     }","lines":22,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/common/xf86Init.c#L1071-L1092"}]},
{"id":"LOGIC_102","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"very_easy","description":"`vbeReadEDID()` clears the real-mode scratch page with `memset(page, 0, sizeof(vbeInfoPtr))`, but `sizeof(vbeInfoPtr)` is the size of a pointer (8 bytes), not the size of the buffer or of any VBE structure. Only 8 bytes get cleared. It happens to be benign here (a `strcpy` of the \"VBE2\" signature follows and the DDC read overwrites the buffer), but the sizeof is clearly wrong and misleading.","fix":"Zero the intended amount, e.g. the EDID transfer size: `memset(page, 0, 128);` (or the appropriate structure/page size).","locations":[{"ref":"hw/xfree86/int10/vbe.c:284","code":"  284 |     memset(page, 0, sizeof(vbeInfoPtr));","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/int10/vbe.c#L284"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"critical","difficulty":"very_easy","description":"__glXDisp_PrioritizeTextures passes the same pointer (pc + 4) for both the 'textures' and 'priorities' arrays. The GLX protocol lays out the textures array at pc+4 followed by the priorities array at pc + 4 + n*4, but the code reads both from pc+4. The effect is that the texture priorities are silently set from the texture names array, corrupting GL state, and the actual priority data from the client is never consumed.","fix":"Change the second argument to use the correct offset: (const GLclampf *) (pc + 4 + n * 4).","locations":[{"ref":"Xext/glx/indirect_dispatch.c:2679-2686","code":" 2679 | __glXDisp_PrioritizeTextures(GLbyte * pc)\n 2680 | {\n 2681 |     const GLsizei n = *(GLsizei *) (pc + 0);\n 2682 | \n 2683 |     glPrioritizeTextures(n,\n 2684 |                          (const GLuint *) (pc + 4),\n 2685 |                          (const GLclampf *) (pc + 4));\n 2686 | }","lines":8,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/indirect_dispatch.c#L2679-L2686"}]},
{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"very_easy","description":"In glxdricommon.c attribMap, __DRI_ATTRIB_TRANSPARENT_INDEX_VALUE is mapped to the 'transparentPixel' field instead of 'transparentIndex'. There are two separate fields in __GLXconfig: transparentPixel (at offset 70) and transparentIndex (at offset 73). The DRI transparent type goes to transparentPixel correctly, but the index value is silently written to the wrong field, corrupting transparentPixel a second time instead of populating transparentIndex.","fix":"Change __ATTRIB(__DRI_ATTRIB_TRANSPARENT_INDEX_VALUE, transparentPixel) to __ATTRIB(__DRI_ATTRIB_TRANSPARENT_INDEX_VALUE, transparentIndex).","locations":[{"ref":"Xext/glx/glx_dri/glxdricommon.c:70","code":"   70 |         __ATTRIB(__DRI_ATTRIB_TRANSPARENT_INDEX_VALUE, transparentPixel),","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/glx_dri/glxdricommon.c#L70"}]},
{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"very_easy","description":"PrioritizeTextures passes (pc + 4) as both the textures array and the priorities array, and both bswap_32_array calls use count 0. The priorities should start after the n texture IDs at pc + 4 + n*4. This is present in both the swap and non-swap versions, but is worse here because even the texture IDs are not swapped.","fix":"Pass n to bswap_32_array for the textures array, and compute the priorities pointer as (pc + 4 + n * sizeof(GLuint)), with a separate bswap_32_array call passing n.","locations":[{"ref":"Xext/glx/indirect_dispatch_swap.c:2956-2966","code":" 2956 | void\n 2957 | __glXDispSwap_PrioritizeTextures(GLbyte * pc)\n 2958 | {\n 2959 |     const GLsizei n = (GLsizei) bswap_CARD32(pc + 0);\n 2960 | \n 2961 |     glPrioritizeTextures(n,\n 2962 |                          (const GLuint *) bswap_32_array((uint32_t *) (pc + 4),\n 2963 |                                                          0),\n 2964 |                          (const GLclampf *)\n 2965 |                          bswap_32_array((uint32_t *) (pc + 4), 0));\n 2966 | }","lines":11,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/indirect_dispatch_swap.c#L2956-L2966"}]},
{"id":"CPY_4","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"very_easy","description":"In FindWindowSubRes(), the border-pixmap branch reports the wrong pixmap: it passes window->background.pixmap (copy-pasted from the background branch) instead of the border pixmap, while using the border pixmap's drawable.id. This is reached from the X-Resource extension (XResQueryResourceBytes -> FindSubResources -> AddSubResourceSizeSpec), which dereferences the passed value in GetPixmapBytes (size->refCnt = pixmap->refcnt). For any window whose border is a pixmap (!borderIsPixel) but whose background is NOT a pixmap (backgroundState != BackgroundPixmap, e.g. a plain pixel background - very common), window->background is a union holding a pixel value, so a bogus pointer is dereferenced -> client-triggerable crash / out-of-bounds read.","fix":"Pass the border pixmap. Change:\n```c\nfunc(window->background.pixmap, pixmap->drawable.id, X11_RESTYPE_PIXMAP, cdata);\n```\nto:\n```c\nfunc(pixmap, pixmap->drawable.id, X11_RESTYPE_PIXMAP, cdata);\n```","locations":[{"ref":"dix/resource.c:353-357","code":"  353 |     if (window->border.pixmap && !window->borderIsPixel)\n  354 |     {\n  355 |         PixmapPtr pixmap = window->border.pixmap;\n  356 |         func(window->background.pixmap, pixmap->drawable.id, X11_RESTYPE_PIXMAP, cdata);\n  357 |     }","lines":5,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/dix/resource.c#L353-L357"}]},
{"id":"CPY_5","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"very_easy","description":"ProcXDGACopyArea inverts the screen-validity check. It returns BadValue when dixGetScreenPtr() succeeds (valid screen) and PROCEEDS when the screen pointer is NULL (invalid/out-of-range screen). Because `screen` is a client-supplied CARD32, an invalid index bypasses the guard and then reaches `DGA_GETCLIENT(stuff->screen)`, which indexes `screenInfo.screens[stuff->screen]` (array of only MAXSCREENS=16 pointers) with an unchecked value up to 2^32-1 and dereferences it -> out-of-bounds read + crash. It also completely breaks the request for every valid screen (always returns BadValue). DGA dispatch requires a local client, so this is a local-client DoS, not remote. Every other Proc in this file uses the correct `if (!pScreen)`.","fix":"Invert the test to match the other handlers:\n```c\nScreenPtr pScreen = dixGetScreenPtr(stuff->screen);\nif (!pScreen)\n    return BadValue;\n```","locations":[{"ref":"hw/xfree86/common/xf86DGA.c:1511-1513","code":" 1511 |     ScreenPtr pScreen = dixGetScreenPtr(stuff->screen);\n 1512 |     if (pScreen)\n 1513 |         return BadValue;","lines":3,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/common/xf86DGA.c#L1511-L1513"}]},
{"id":"CPY_6","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"very_easy","description":"ProcXDGASync has the same inverted screen-validity check as ProcXDGACopyArea: it returns BadValue when the screen is valid and continues when dixGetScreenPtr() returns NULL for an out-of-range client-supplied `screen` (CARD32). The subsequent `DGA_GETCLIENT(stuff->screen)` indexes `screenInfo.screens[]` out of bounds and dereferences the result -> crash; valid screens are always rejected. Local-client reachable (DGA dispatch requires client->local).","fix":"```c\nScreenPtr pScreen = dixGetScreenPtr(stuff->screen);\nif (!pScreen)\n    return BadValue;\n```","locations":[{"ref":"hw/xfree86/common/xf86DGA.c:1576-1578","code":" 1576 |     ScreenPtr pScreen = dixGetScreenPtr(stuff->screen);\n 1577 |     if (pScreen)\n 1578 |         return BadValue;","lines":3,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/common/xf86DGA.c#L1576-L1578"}]},
{"id":"CPY_7","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"ProcShapeOffset byte-swaps `yOff` twice and never swaps `xOff`. The request struct xShapeOffsetReq has both INT16 `xOff` and `yOff`, but the swap block reads `X_REQUEST_FIELD_CARD16(yOff)` twice. For a byte-swapped client this leaves `xOff` in the wrong byte order and double-swaps `yOff` back to the wrong order, so the shape region is translated by garbage offsets. A pure correctness bug for opposite-endian clients (no memory unsafety), but silently wrong.","fix":"Swap `xOff` instead of `yOff` twice:\n```\n    X_REQUEST_FIELD_CARD32(dest);\n    X_REQUEST_FIELD_CARD16(xOff);\n    X_REQUEST_FIELD_CARD16(yOff);\n```","locations":[{"ref":"Xext/shape/shape.c:612-615","code":"  612 |     X_REQUEST_HEAD_AT_LEAST(xShapeOffsetReq);\n  613 |     X_REQUEST_FIELD_CARD32(dest);\n  614 |     X_REQUEST_FIELD_CARD16(yOff);\n  615 |     X_REQUEST_FIELD_CARD16(yOff);","lines":4,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/shape/shape.c#L612-L615"}]},
{"id":"CPY_8","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"In ProcSetSelectionOwner, after invoking the SELECTION_FILTER_EV_CLEAR callback into `eventParam`, the code tests `if (!param.skip)` instead of `if (!eventParam.skip)`. `param.skip` is guaranteed false here (an earlier `if (param.skip) return` already handled that case), so the branch is always taken and the SelectionClear event is always written to the previous owner. An extension (e.g. XFIXES) that sets `skip` on the EV_CLEAR filter to suppress the event is ignored, producing a spurious SelectionClear.","fix":"Test the struct that actually received the callback result:\n```c\n        CallCallbacks(&SelectionFilterCallback, &eventParam);\n        if (!eventParam.skip) {\n```","locations":[{"ref":"dix/selection.c:224-233","code":"  224 |         CallCallbacks(&SelectionFilterCallback, &eventParam);\n  225 |         if (!param.skip) {\n  226 |             xEvent event = {\n  227 |                 .u.selectionClear.time = time.milliseconds,\n  228 |                 .u.selectionClear.window = eventParam.owner,\n  229 |                 .u.selectionClear.atom = eventParam.selection,\n  230 |             };\n  231 |             event.u.u.type = SelectionClear;\n  232 |             WriteEventsToClient(eventParam.recvClient, 1, &event);\n  233 |         }","lines":10,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/dix/selection.c#L224-L233"}]},
{"id":"CPY_9","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"get_vendor_section() assigns the EDID manufacture week and year to the wrong struct fields. `r->week` is set from the YEAR byte (V_YEAR, +1990) and `r->year` is set from the WEEK byte (V_WEEK). This swap was introduced by the macro-refactor commit 1cb42729a (originally `r->week = WEEK; r->year = YEAR;`). As a result print_vendor() and any driver reading DDC->vendor.week/year report bogus values (week ~= 2020, year ~= 0-54).","fix":"Swap the two assignments back:\n```c\nr->week = GET(V_WEEK) & 0xFF;\nr->year = _YEAR(GET(V_YEAR));\n```","locations":[{"ref":"hw/xfree86/ddc/interpret_edid.c:544-545","code":"  544 |     r->week = _YEAR(GET(V_YEAR));\n  545 |     r->year = GET(V_WEEK) & 0xFF;","lines":2,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/ddc/interpret_edid.c#L544-L545"}]},
{"id":"CPY_10","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"SingleRenderTriFan computes the payload size by subtracting `sizeof(xRenderTriStripReq)` instead of `sizeof(xRenderTriFanReq)` (copy-paste from SingleRenderTriStrip). It is currently harmless only by coincidence because both structs are 24 bytes (sz_xRenderTriStripReq == sz_xRenderTriFanReq == 24); if either request struct ever changes size this becomes a length-miscalculation bug on untrusted input. It should reference its own request type.","fix":"before:\n```c\n    npoints = ((client->req_len << 2) - sizeof(xRenderTriStripReq));\n```\nafter:\n```c\n    npoints = ((client->req_len << 2) - sizeof(xRenderTriFanReq));\n```","locations":[{"ref":"Xext/render/render.c:672-675","code":"  672 |     npoints = ((client->req_len << 2) - sizeof(xRenderTriStripReq));\n  673 |     if (npoints & 4)\n  674 |         return BadLength;\n  675 |     npoints >>= 3;","lines":4,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/render/render.c#L672-L675"}]},
{"id":"CPY_11","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In _XkbSetNames the XkbGroupNamesMask branch assigns the changed group-name mask to `nn.changedVirtualMods` instead of `nn.changedGroupNames`. This (a) clobbers the value that the immediately preceding XkbVirtualModNamesMask branch stored in `nn.changedVirtualMods`, and (b) never reports the changed group names in the XkbNamesNotify event, so clients that requested group-name change notifications receive wrong data. The xkbNamesNotify struct has a dedicated `changedGroupNames` field.","fix":"Assign to the correct field.\n\nBefore:\n```c\n    if (stuff->which & XkbGroupNamesMask) {\n        tmp = _XkbCopyMaskedAtoms(tmp, names->groups, XkbNumKbdGroups,\n                                  stuff->groupNames);\n        nn.changedVirtualMods = stuff->groupNames;\n    }\n```\nAfter:\n```c\n    if (stuff->which & XkbGroupNamesMask) {\n        tmp = _XkbCopyMaskedAtoms(tmp, names->groups, XkbNumKbdGroups,\n                                  stuff->groupNames);\n        nn.changedGroupNames = stuff->groupNames;\n    }\n```","locations":[{"ref":"Xext/xkeyboard/xkb.c:4253-4257","code":" 4253 |     if (stuff->which & XkbGroupNamesMask) {\n 4254 |         tmp = _XkbCopyMaskedAtoms(tmp, names->groups, XkbNumKbdGroups,\n 4255 |                                   stuff->groupNames);\n 4256 |         nn.changedVirtualMods = stuff->groupNames;\n 4257 |     }","lines":5,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/xkeyboard/xkb.c#L4253-L4257"}]},
{"id":"CPY_12","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"In CopyISOLockArgs() the literal \"group=\" is copied into the scratch buffer `tbuf` instead of the output buffer `buf`. The very next statement unconditionally overwrites `tbuf` with the group number via snprintf(), so the \"group=\" label is silently discarded. Every other Copy*Args helper (e.g. CopyGroupActionArgs at line 789) correctly writes the label to `buf`. As a result, serializing an ISOLock action that has the XkbSA_ISODfltIsGroup flag produces malformed xkb text like `ISOLock(+1,affect=...)` instead of `ISOLock(group=+1,affect=...)`, which xkbcomp then rejects when the keymap is recompiled. It also wastes part of the `sz` budget on the discarded copy.","fix":"The destination of the label copy must be `buf`, not `tbuf`.\n\nBefore:\n```c\nif (act->flags & XkbSA_ISODfltIsGroup) {\n    TryCopyStr(tbuf, \"group=\", sz);\n    if (act->flags & XkbSA_GroupAbsolute)\n```\n\nAfter:\n```c\nif (act->flags & XkbSA_ISODfltIsGroup) {\n    TryCopyStr(buf, \"group=\", sz);\n    if (act->flags & XkbSA_GroupAbsolute)\n```","locations":[{"ref":"Xext/xkeyboard/xkbtext.c:896-904","code":"  896 |     if (act->flags & XkbSA_ISODfltIsGroup) {\n  897 |         TryCopyStr(tbuf, \"group=\", sz);\n  898 |         if (act->flags & XkbSA_GroupAbsolute)\n  899 |             snprintf(tbuf, sizeof(tbuf), \"%d\", XkbSAGroup(act) + 1);\n  900 |         else if (XkbSAGroup(act) < 0)\n  901 |             snprintf(tbuf, sizeof(tbuf), \"%d\", XkbSAGroup(act));\n  902 |         else\n  903 |             snprintf(tbuf, sizeof(tbuf), \"+%d\", XkbSAGroup(act));\n  904 |         TryCopyStr(buf, tbuf, sz);","lines":9,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/xkeyboard/xkbtext.c#L896-L904"}]},
{"id":"CPY_13","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"For 10-10-10-2 (depth 30/rgbBits 30 or 32) configs the alpha mask is written as `0xc000000` (0x0C000000, 7 hex digits) instead of `0xc0000000`. The two alpha bits of an ARGB2101010 pixel live in bits 30-31, i.e. mask 0xC0000000. The written value places the alpha mask in the wrong bit positions (bits 26-27), so 30-bit GLX visuals report an incorrect alpha channel mask. Compare with the 8-bit case at line 298 which correctly uses 0xff000000.","fix":"Change `c->base.alphaMask = 0xc000000;` to `c->base.alphaMask = 0xc0000000;`","locations":[{"ref":"glamor/glamor_glx_provider.c:307","code":"  307 |                 c->base.alphaMask = 0xc000000;","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/glamor/glamor_glx_provider.c#L307"}]},
{"id":"CPY_14","type":"copy_paste","type_label":"Copy Paste","severity":"negligible","difficulty":"very_easy","description":"ProcXFixesSetRegion() computes the payload size using sizeof(xXFixesCreateRegionReq) instead of sizeof(xXFixesSetRegionReq). Both structs are currently 8 bytes so the behavior is correct today, but the wrong type name is a latent copy-paste hazard: if the SetRegion request struct ever changes size the length math will silently be wrong.","fix":"Use the correct request type:\n```c\n    int things = (client->req_len << 2) - sizeof(xXFixesSetRegionReq);\n```","locations":[{"ref":"Xext/xfixes/region.c:260-263","code":"  260 |     int things = (client->req_len << 2) - sizeof(xXFixesCreateRegionReq);\n  261 |     if (things & 4)\n  262 |         return BadLength;\n  263 |     things >>= 3;","lines":4,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/xfixes/region.c#L260-L263"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"dispatch_GLXClientInfo() in vndcmds.c forwards the GLXClientInfo request to every registered vendor library but ignores the return value of each `vendor->glxvc.handleRequest(client)` call. If one vendor returns an error, the loop continues and the function returns Success unconditionally. Errors from vendor processing are silently swallowed.","fix":"Capture the return value: `int ret = vendor->glxvc.handleRequest(client); if (ret != Success) { free(requestCopy); return ret; }` - or at minimum track and return the last non-Success result.","locations":[{"ref":"Xext/glx/vndcmds.c:140-144","code":"  140 |     xorg_list_for_each_entry(vendor, &GlxVendorList, entry) {\n  141 |         vendor->glxvc.handleRequest(client);\n  142 |         // Revert the request buffer back to our copy.\n  143 |         memcpy(client->requestBuffer, requestCopy, requestSize);\n  144 |     }","lines":5,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/vndcmds.c#L140-L144"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"vfbScreenInfo.dri_fd is never initialized to a sane sentinel. defaultScreenInfo is zero-initialized (dri_fd == 0) and vfbGlamorInit() only assigns dri_fd when glamor/render_node is requested; when it isn't, it returns early (line 845-847) leaving dri_fd == 0. At shutdown vfbCloseScreen() does `if (pvfb->dri_fd >= 0) close(pvfb->dri_fd)`, which closes file descriptor 0 (stdin) for a GLAMOR-enabled build running without -glamor (the common case). Additionally, on glamor init failure vfbGlamorInit() calls close(pvfb->dri_fd) without resetting it to -1 (lines 859, 877), so vfbCloseScreen later closes the same fd again (double close).","fix":"Initialize dri_fd to -1 (e.g. in defaultScreenInfo and/or vfbInitializeScreenInfo), and after every close(pvfb->dri_fd) in vfbGlamorInit set `pvfb->dri_fd = -1;`. That makes the `dri_fd >= 0` guard correct and prevents closing stdin / double close.","locations":[{"ref":"hw/vfb/InitOutput.c:827-832","code":"  827 | #ifdef GLAMOR\n  828 |     if (pvfb->dri_fd >= 0) {\n  829 |         close(pvfb->dri_fd);\n  830 |         pvfb->dri_fd = -1;\n  831 |     }\n  832 | #endif","lines":6,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/vfb/InitOutput.c#L827-L832"},{"ref":"hw/vfb/InitOutput.c:837-880","code":"  837 | #ifdef GLAMOR\n  838 | static Bool\n  839 | vfbGlamorInit(ScreenPtr pScreen)\n  840 | {\n  841 |     vfbScreenInfoPtr pvfb = &vfbScreens[pScreen->myNum];\n  842 | \n  843 |     if (!use_glamor && !render_node) {\n  844 |         return FALSE;\n  845 |     }\n  846 | \n  847 |     pvfb->dri_fd = render_node ? open(render_node, O_RDWR | O_CLOEXEC) : -1;\n  848 | \n  849 |     glamor_egl_conf_t glamor_egl_conf = {\n  850 |                                          .screen = pScreen,\n  851 |                                          .fd = pvfb->dri_fd,\n  852 |                                          .llvmpipe_allowed = TRUE,\n  853 |                                          .force_glamor = TRUE,\n  854 |                                         };\n  855 | \n  856 |     if (!glamor_egl_init_internal(&glamor_egl_conf, NULL)) {\n  857 |         close(pvfb->dri_fd);\n  858 |         return FALSE;\n  859 |     }\n  860 | \n  861 |     const char *renderer = (const char*)glGetString(GL_RENDERER);\n  862 | \n  863 |     int flags = GLAMOR_USE_EGL_SCREEN;\n  864 |     if (!renderer ||\n  865 |         strstr(renderer, \"softpipe\") ||\n  866 |         strstr(renderer, \"llvmpipe\")) {\n  867 |         flags |= GLAMOR_NO_RENDER_ACCEL;\n  868 |     }\n  869 | \n  870 |     if (pvfb->dri_fd < 0 || flags & GLAMOR_NO_RENDER_ACCEL) {\n  871 |         flags |= GLAMOR_NO_DRI3;\n  872 |     }\n  873 | \n  874 |     if (!glamor_init(pScreen, flags)) {\n  875 |         close(pvfb->dri_fd);\n  876 |         return FALSE;\n  877 |     }\n  878 | \n  879 |     return TRUE;\n  880 | }","lines":44,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/vfb/InitOutput.c#L837-L880"},{"ref":"hw/vfb/InitOutput.c:133-135","code":"  133 | #ifdef GLAMOR\n  134 |     int dri_fd;\n  135 | #endif","lines":3,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/vfb/InitOutput.c#L133-L135"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"PseudoramiXAddScreen grows its screen array with reallocarray() but never checks the result. On allocation failure `pseudoramiXScreens` becomes NULL while `pseudoramiXScreensAllocated` has already been bumped, so the immediately following `s = &pseudoramiXScreens[pseudoramiXNumScreens++]` dereferences NULL and crashes; a failing realloc that returns NULL also leaks the previous buffer. This is a server/DDX init path (rootless Xinerama) rather than a client request, so impact is limited, but it is a genuine robustness defect.","fix":"before:\n```c\n    if (pseudoramiXNumScreens == pseudoramiXScreensAllocated) {\n        pseudoramiXScreensAllocated += pseudoramiXScreensAllocated + 1;\n        pseudoramiXScreens = reallocarray(pseudoramiXScreens,\n                                          pseudoramiXScreensAllocated,\n                                          sizeof(PseudoramiXScreenRec));\n    }\n```\nafter:\n```c\n    if (pseudoramiXNumScreens == pseudoramiXScreensAllocated) {\n        int newAllocated = pseudoramiXScreensAllocated + pseudoramiXScreensAllocated + 1;\n        PseudoramiXScreenRec *newScreens = reallocarray(pseudoramiXScreens,\n                                                        newAllocated,\n                                                        sizeof(PseudoramiXScreenRec));\n        if (!newScreens)\n            return;\n        pseudoramiXScreens = newScreens;\n        pseudoramiXScreensAllocated = newAllocated;\n    }\n```","locations":[{"ref":"Xext/pseudoramiX/pseudoramiX.c:99-113","code":"   99 |     if (pseudoramiXNumScreens == pseudoramiXScreensAllocated) {\n  100 |         pseudoramiXScreensAllocated += pseudoramiXScreensAllocated + 1;\n  101 |         pseudoramiXScreens = reallocarray(pseudoramiXScreens,\n  102 |                                           pseudoramiXScreensAllocated,\n  103 |                                           sizeof(PseudoramiXScreenRec));\n  104 |     }\n  105 | \n  106 |     DEBUG_LOG(\"x: %d, y: %d, w: %d, h: %d\\n\", x, y, w, h);\n  107 | \n  108 |     s = &pseudoramiXScreens[pseudoramiXNumScreens++];\n  109 |     s->x = x;\n  110 |     s->y = y;\n  111 |     s->w = w;\n  112 |     s->h = h;\n  113 | }","lines":15,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/pseudoramiX/pseudoramiX.c#L99-L113"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"ScreenSaverSetAttributes returns `FALSE` when MakeScreenPrivate() fails to allocate. `FALSE` is 0, which equals `Success`, so on an allocation failure the request handler reports success to the client even though no attributes were created/installed. It should return BadAlloc.","fix":"Return `BadAlloc` instead of `FALSE`:\n```\n    if (!pPriv) {\n        pPriv = MakeScreenPrivate(pScreen);\n        if (!pPriv) {\n            return BadAlloc;\n        }\n    }\n```","locations":[{"ref":"Xext/saver/saver.c:829-834","code":"  829 |     if (!pPriv) {\n  830 |         pPriv = MakeScreenPrivate(pScreen);\n  831 |         if (!pPriv) {\n  832 |             return FALSE;\n  833 |         }\n  834 |     }","lines":6,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/saver/saver.c#L829-L834"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"eventToKeyButtonPointer() returns Success with *count=0 on the XI 1.x protocol-restriction early-out (button > 0xFF || deviceid >= 0x80) but never writes *xi. Callers are currently safe only because every caller pre-initializes its xEvent* to NULL (dix/events.c DeliverOneEvent, Xext/record/record.c). This is fragile: a future caller that trusts the Success return and reads/free()s *xi without initializing it would use an indeterminate pointer. The sibling EventToCore() avoids this by always writing *core_out via its out: label.","fix":"Set `*xi = NULL;` alongside `*count = 0;` before returning Success in the early-out, so the out-parameter is always defined.","locations":[{"ref":"dix/eventconvert.c:325-329","code":"  325 |     /* Sorry, XI 1.x protocol restrictions. */\n  326 |     if (ev->detail.button > 0xFF || ev->deviceid >= 0x80) {\n  327 |         *count = 0;\n  328 |         return Success;\n  329 |     }","lines":5,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/dix/eventconvert.c#L325-L329"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"glamor_link_glsl_prog() allocates the info-log buffer with calloc() but, unlike glamor_compile_glsl_prog() (which checks `if (info)`), it does not check the result before passing it to glGetProgramInfoLog(prog, size, NULL, info) and ErrorF(\"%s\", info). On allocation failure (or size==0) this passes NULL as the GL output buffer and as a %s argument, risking a crash. This path is reached only on a program-link failure, but the inconsistency with the compile helper makes it a latent NULL-deref.","fix":"Mirror glamor_compile_glsl_prog(): only call glGetProgramInfoLog()/ErrorF() when `info != NULL`, and free it afterwards, e.g.\n```c\nGLchar *info = calloc(1, size);\nif (info) {\n    glGetProgramInfoLog(prog, size, NULL, info);\n    ErrorF(\"Failed to link: %s\\n\", info);\n    free(info);\n}\nreturn FALSE;\n```","locations":[{"ref":"glamor/glamor_core.c:109-118","code":"  109 |     if (!ok) {\n  110 |         GLint size;\n  111 | \n  112 |         glGetProgramiv(prog, GL_INFO_LOG_LENGTH, &size);\n  113 |         GLchar *info = calloc(1, size);\n  114 | \n  115 |         glGetProgramInfoLog(prog, size, NULL, info);\n  116 |         ErrorF(\"Failed to link: %s\\n\", info);\n  117 |         return FALSE;\n  118 |     }","lines":10,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/glamor/glamor_core.c#L109-L118"}]},
{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"xf86VidModeSetGammaRamp() and xf86VidModeGetGammaRamp() call xf86ChangeGammaRamp()/xf86GetGammaRamp() but discard their results and always return TRUE. A failing gamma-ramp change is therefore reported to the VidMode extension (and the client) as success, unlike the sibling xf86VidModeSetGamma() which correctly checks xf86ChangeGamma()'s return value.","fix":"Propagate the callee status, e.g.:\n```c\nstatic Bool\nxf86VidModeSetGammaRamp(ScreenPtr pScreen, int size, CARD16 *r, CARD16 *g, CARD16 *b)\n{\n    return xf86ChangeGammaRamp(pScreen, size, r, g, b) == Success;\n}\n```\n(xf86GetGammaRamp is void, so at minimum document that GetGammaRamp cannot fail; if it can, give it a return type.)","locations":[{"ref":"hw/xfree86/common/xf86VidMode.c:384-389","code":"  384 | static Bool\n  385 | xf86VidModeSetGammaRamp(ScreenPtr pScreen, int size, CARD16 *r, CARD16 *g, CARD16 *b)\n  386 | {\n  387 |     xf86ChangeGammaRamp(pScreen, size, r, g, b);\n  388 |     return TRUE;\n  389 | }","lines":6,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/common/xf86VidMode.c#L384-L389"},{"ref":"hw/xfree86/common/xf86VidMode.c:391-396","code":"  391 | static Bool\n  392 | xf86VidModeGetGammaRamp(ScreenPtr pScreen, int size, CARD16 *r, CARD16 *g, CARD16 *b)\n  393 | {\n  394 |     xf86GetGammaRamp(pScreen, size, r, g, b);\n  395 |     return TRUE;\n  396 | }","lines":6,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/common/xf86VidMode.c#L391-L396"}]},
{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In xf86DoEEDID(), when complete extension data is requested, `EDID_block = reallocarray(EDID_block, 1 + n, EDID1_LEN);` is used without checking for NULL. On allocation failure the original buffer is leaked and the following loop calls DDC2Read(dev, i+1, EDID_block + EDID1_LEN*(1+i)), writing through a NULL-based pointer -> crash. (n comes from monitor byte 0x7e.)","fix":"Capture the result in a temp and bail on failure:\n```c\nunsigned char *tmpb = reallocarray(EDID_block, 1 + n, EDID1_LEN);\nif (!tmpb) { free(EDID_block); return NULL; }\nEDID_block = tmpb;\n```","locations":[{"ref":"hw/xfree86/ddc/ddc.c:446-453","code":"  446 |         if (complete && n) {\n  447 |             EDID_block = reallocarray(EDID_block, 1 + n, EDID1_LEN);\n  448 | \n  449 |             for (i = 0; i < n; i++)\n  450 |                 DDC2Read(dev, i + 1, EDID_block + (EDID1_LEN * (1 + i)));\n  451 |         }\n  452 | \n  453 |         tmp = xf86InterpretEEDID(pScrn->scrnIndex, EDID_block);","lines":8,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/ddc/ddc.c#L446-L453"}]},
{"id":"ERR_9","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In drmmode_crtc_create_planes(), after selecting best_kplane, `drmmode_crtc->formats = calloc(best_kplane->count_formats, sizeof(drmmode_format_rec))` is used immediately by populate_format_modifiers() / the fallback loop without checking for NULL. On allocation failure with count_formats > 0 this dereferences a NULL pointer (formats[i].format = ...). The same applies to formats_async, though that one is only read after a NULL-tolerant populate call.","fix":"Check the calloc result before use, e.g. `if (drmmode_crtc->formats) { ... }` and set `drmmode_crtc->num_formats = 0;` (or bail) when allocation fails, so downstream format lookups don't dereference NULL.","locations":[{"ref":"hw/xfree86/drivers/video/modesetting/drmmode_display.c:2684-2702","code":" 2684 |     if (best_kplane) {\n 2685 |         drmmode_crtc->num_formats = best_kplane->count_formats;\n 2686 |         drmmode_crtc->formats = calloc(best_kplane->count_formats,\n 2687 |                                        sizeof(drmmode_format_rec));\n 2688 |         if (!populate_format_modifiers(crtc, best_kplane,\n 2689 |                                        drmmode_crtc->formats, blob_id)) {\n 2690 |             for (int i = 0; i < best_kplane->count_formats; i++)\n 2691 |                 drmmode_crtc->formats[i].format = best_kplane->formats[i];\n 2692 |         } else {\n 2693 |             drmmode_crtc->formats_async = calloc(best_kplane->count_formats,\n 2694 |                                                  sizeof(drmmode_format_rec));\n 2695 |             if (!populate_format_modifiers(crtc, best_kplane,\n 2696 |                                            drmmode_crtc->formats_async, async_blob_id)) {\n 2697 |                 free(drmmode_crtc->formats_async);\n 2698 |                 drmmode_crtc->formats_async = NULL;\n 2699 |             }\n 2700 |         }\n 2701 |         drmModeFreePlane(best_kplane);\n 2702 |     }","lines":19,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/drivers/video/modesetting/drmmode_display.c#L2684-L2702"}]},
{"id":"ERR_10","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"negligible","difficulty":"very_easy","description":"In FreeScreen(), `int ret;` is left uninitialized and only assigned in the BUS_PCI branch (drmClose) or the non-server-fd else branch (close). When the fd is a server-managed platform fd (XF86_PDEV_SERVER_FD), neither branch runs, so the subsequent `(void) ret;` reads an uninitialized variable. It is harmless in practice (the value is discarded) but is technically UB and confusing.","fix":"Initialize `int ret = 0;` at declaration, or drop the unused `ret`/`(void) ret;` entirely since the return value of drmClose/close is never used.","locations":[{"ref":"hw/xfree86/drivers/video/modesetting/driver.c:1062-1079","code":" 1062 |     if (ms->fd > 0) {\n 1063 |         modesettingEntPtr ms_ent;\n 1064 |         int ret;\n 1065 | \n 1066 |         ms_ent = ms_ent_priv(pScrn);\n 1067 |         ms_ent->fd_ref--;\n 1068 |         if (!ms_ent->fd_ref) {\n 1069 |             if (ms->pEnt->location.type == BUS_PCI)\n 1070 |                 ret = drmClose(ms->fd);\n 1071 |             else\n 1072 | #ifdef XF86_PDEV_SERVER_FD\n 1073 |                 if (!(ms->pEnt->location.type == BUS_PLATFORM &&\n 1074 |                       (ms->pEnt->location.id.plat->flags & XF86_PDEV_SERVER_FD)))\n 1075 | #endif\n 1076 |                     ret = close(ms->fd);\n 1077 |             (void) ret;\n 1078 |             ms_ent->fd = 0;\n 1079 |         }","lines":18,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/drivers/video/modesetting/driver.c#L1062-L1079"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"GL state leak on a mid-loop failure path in glamor_poly_segment_solid_gl(). Unlike every other similar function in the module (glamor_points.c, glamor_lines.c, glamor_spans.c, glamor_rects.c), which place the `glDisable(GL_SCISSOR_TEST)` / `glDisableVertexAttribArray()` calls *after* the `bail:` label so they run on all exits, glamor_segs.c places them *before* `bail:`. The `goto bail` at line 102 (taken when glamor_set_destination_drawable() fails) happens after `glEnable(GL_SCISSOR_TEST)` (line 94) and after `glEnableVertexAttribArray(GLAMOR_VERTEX_POS)` (line 75), so it returns with the scissor test and vertex attrib array still enabled. This leaked global GL state corrupts subsequent glamor rendering.","fix":"Move the disables below the label so they run on every exit, matching glamor_lines.c:\n```c\n    ret = TRUE;\n\nbail:\n    glDisable(GL_SCISSOR_TEST);\n    glDisableVertexAttribArray(GLAMOR_VERTEX_POS);\n    return ret;\n```","locations":[{"ref":"glamor/glamor_segs.c:96-122","code":"   96 |     glEnable(GL_SCISSOR_TEST);\n   97 | \n   98 |     glamor_pixmap_loop(pixmap_priv, box_index) {\n   99 |         int nbox = RegionNumRects(gc->pCompositeClip);\n  100 |         BoxPtr box = RegionRects(gc->pCompositeClip);\n  101 | \n  102 |         if (!glamor_set_destination_drawable(drawable, box_index, TRUE, TRUE,\n  103 |                                              prog->matrix_uniform, &off_x, &off_y))\n  104 |             goto bail;\n  105 | \n  106 |         while (nbox--) {\n  107 |             glScissor(box->x1 + off_x,\n  108 |                       box->y1 + off_y,\n  109 |                       box->x2 - box->x1,\n  110 |                       box->y2 - box->y1);\n  111 |             box++;\n  112 |             glDrawArrays(GL_LINES, 0, nseg << (1 + add_last));\n  113 |         }\n  114 |     }\n  115 | \n  116 |     ret = TRUE;\n  117 | \n  118 |     glDisable(GL_SCISSOR_TEST);\n  119 |     glDisableVertexAttribArray(GLAMOR_VERTEX_POS);\n  120 | \n  121 | bail:\n  122 |     return ret;","lines":27,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/glamor/glamor_segs.c#L96-L122"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"ProcGetPointerMapping computes `nElts = (butc) ? butc->numButtons : 0`, explicitly guarding against a NULL button class, but then unconditionally forms `&butc->map[1]` and passes it to x_rpcbuf_write_binary_pad. If butc were NULL this computes an out-of-bounds pointer from NULL (undefined behavior). In practice PickPointer always returns a master pointer with a ButtonClass, so it is not currently reachable, but the code is internally inconsistent: it either can trust butc (drop the ternary) or must not dereference it.","fix":"Make the two uses consistent, e.g.:\nBefore:\n```c\n    int nElts = (butc) ? butc->numButtons : 0;\n    x_rpcbuf_t rpcbuf = { .swapped = client->swapped, .err_clear = TRUE };\n    x_rpcbuf_write_binary_pad(&rpcbuf, &butc->map[1], nElts);\n```\nAfter:\n```c\n    int nElts = (butc) ? butc->numButtons : 0;\n    x_rpcbuf_t rpcbuf = { .swapped = client->swapped, .err_clear = TRUE };\n    if (butc)\n        x_rpcbuf_write_binary_pad(&rpcbuf, &butc->map[1], nElts);\n```","locations":[{"ref":"dix/devices.c:1916-1920","code":" 1916 |     ButtonClassPtr butc = ptr->button;\n 1917 |     int nElts = (butc) ? butc->numButtons : 0;\n 1918 | \n 1919 |     x_rpcbuf_t rpcbuf = { .swapped = client->swapped, .err_clear = TRUE };\n 1920 |     x_rpcbuf_write_binary_pad(&rpcbuf, &butc->map[1], nElts);","lines":5,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/dix/devices.c#L1916-L1920"}]},
{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"__accbit() (used by LookupDixAccessName) calls strncat(buf, name, sz) and strncat(buf, \",\", sz) passing the total buffer size sz as the length argument on every call. strncat's 3rd argument is the max bytes to copy from src, not the destination capacity; it appends regardless of how much is already in buf. If enough access bits are set, the accumulated string (all names + commas total ~190 bytes) overflows the caller's fixed buffer (char accModeStr[128] in Xext/namespace/hook-resource.c) before the final buf[sz-1]=0 runs. Not currently reachable with a large-enough bitmask (access_mode masks are server-set with few bits), but the concatenation is unbounded and a latent stack overflow.","fix":"Track remaining space, e.g. pass `sz - strlen(buf) - 1` as the strncat limit, or switch to snprintf-based appending that respects the current length. Guard against negative remaining.","locations":[{"ref":"dix/registry.c:269-275","code":"  269 | static inline void __accbit(Mask val, Mask mask, const char* name, char *buf, int sz) {\n  270 |     if ((val & mask) == mask) {\n  271 |         if (buf[0])\n  272 |             strncat(buf, \",\", sz);\n  273 |         strncat(buf, name, sz);\n  274 |     }\n  275 | }","lines":7,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/dix/registry.c#L269-L275"},{"ref":"dix/registry.c:278-310","code":"  278 | LookupDixAccessName(Mask acc, char *buf, int sz) {\n  279 |     buf[0] = 0;\n  280 |     __accbit(acc, DixReadAccess,      \"Read\",      buf, sz);\n  281 |     __accbit(acc, DixWriteAccess,     \"Write\",     buf, sz);\n  282 |     __accbit(acc, DixDestroyAccess,   \"Destroy\",   buf, sz);\n  283 |     __accbit(acc, DixCreateAccess,    \"Create\",    buf, sz);\n  284 |     __accbit(acc, DixGetAttrAccess,   \"GetAttr\",   buf, sz);\n  285 |     __accbit(acc, DixSetAttrAccess,   \"SetAttr\",   buf, sz);\n  286 |     __accbit(acc, DixListPropAccess,  \"ListProp\",  buf, sz);\n  287 |     __accbit(acc, DixGetPropAccess,   \"GetProp\",   buf, sz);\n  288 |     __accbit(acc, DixSetPropAccess,   \"SetProp\",   buf, sz);\n  289 |     __accbit(acc, DixGetFocusAccess,  \"GetFocus\",  buf, sz);\n  290 |     __accbit(acc, DixSetFocusAccess,  \"SetFocus\",  buf, sz);\n  291 |     __accbit(acc, DixListAccess,      \"List\",      buf, sz);\n  292 |     __accbit(acc, DixAddAccess,       \"Add\",       buf, sz);\n  293 |     __accbit(acc, DixRemoveAccess,    \"Remove\",    buf, sz);\n  294 |     __accbit(acc, DixHideAccess,      \"Hide\",      buf, sz);\n  295 |     __accbit(acc, DixShowAccess,      \"Show\",      buf, sz);\n  296 |     __accbit(acc, DixBlendAccess,     \"Blend\",     buf, sz);\n  297 |     __accbit(acc, DixGrabAccess,      \"Grab\",      buf, sz);\n  298 |     __accbit(acc, DixFreezeAccess,    \"Freeze\",    buf, sz);\n  299 |     __accbit(acc, DixForceAccess,     \"Force\",     buf, sz);\n  300 |     __accbit(acc, DixInstallAccess,   \"Install\",   buf, sz);\n  301 |     __accbit(acc, DixUninstallAccess, \"Uninstall\", buf, sz);\n  302 |     __accbit(acc, DixSendAccess,      \"Send\",      buf, sz);\n  303 |     __accbit(acc, DixReceiveAccess,   \"Receive\",   buf, sz);\n  304 |     __accbit(acc, DixUseAccess,       \"Use\",       buf, sz);\n  305 |     __accbit(acc, DixManageAccess,    \"Manage\",    buf, sz);\n  306 |     __accbit(acc, DixDebugAccess,     \"Debug\",     buf, sz);\n  307 |     __accbit(acc, DixBellAccess,      \"Bell\",      buf, sz);\n  308 |     __accbit(acc, DixPostAccess,      \"Post\",      buf, sz);\n  309 |     buf[sz-1] = 0;\n  310 | }","lines":33,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/dix/registry.c#L278-L310"}]},
{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"create_bits_picture() passes the pixman image stride as `stride * sizeof(FbStride)`, but the stride must be expressed in bytes-per-FbBits-unit, i.e. `stride * sizeof(FbBits)`. This only works today because FbStride is `int` (4 bytes) and FbBits is `CARD32` (4 bytes) so the two happen to be equal; it is a latent, fragile computation that would silently corrupt every pixman-backed drawable (Composite/Trapezoids/Glyphs/Triangles) if either type's width ever changed.","fix":"Use the type of the actual buffer element:\n```c\n                                     (uint32_t *) bits,\n                                     stride * sizeof(FbBits));\n```","locations":[{"ref":"fb/fbpict.c:292-295","code":"  292 |     image = pixman_image_create_bits((pixman_format_code_t) pict->format,\n  293 |                                      pixmap->drawable.width,\n  294 |                                      pixmap->drawable.height, (uint32_t *) bits,\n  295 |                                      stride * sizeof(FbStride));","lines":4,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/fb/fbpict.c#L292-L295"}]},
{"id":"API_5","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"xf86XvMCScreenInit() assigns a Bool (`FALSE`) to the pointer field `pScreenPriv->dixinfo` (type XvMCAdaptorPtr) on the no-matching-adaptor error path. It happens to work because FALSE == 0 == NULL and it prevents a double free of pAdapt at CloseScreen, but assigning a boolean to a pointer is a type-confusion smell and misleads readers.","fix":"Use `pScreenPriv->dixinfo = NULL;` instead of `= FALSE;`.","locations":[{"ref":"hw/xfree86/common/xf86xvmc.c:187","code":"  187 |             pScreenPriv->dixinfo = FALSE;","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/common/xf86xvmc.c#L187"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"ProcDbeSwapBuffers() validates that all windows are unique by doing an O(n^2) nested loop\n(lines 478-483). For large swap lists this is quadratic. While swap lists are typically small\nin practice, this is protocol-controlled input so a malicious or buggy client could pass a\nlarge list.","fix":"Sort the window array before validation to allow an O(n log n) uniqueness check, or use a hash set for O(n) average.","locations":[{"ref":"Xext/doublebuffer/dbe.c:479-485","code":"  479 |         /* Each window must only be specified once - BadMatch. */\n  480 |         for (int j = i + 1; j < nStuff; j++) {\n  481 |             if (dbeSwapInfo[i].window == dbeSwapInfo[j].window) {\n  482 |                 free(swapInfo);\n  483 |                 return BadMatch;\n  484 |             }\n  485 |         }","lines":7,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/doublebuffer/dbe.c#L479-L485"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"ProcQueryExtension declares `char extname[PATH_MAX]` (4096 bytes on most systems) and zero-initializes the whole thing (`= { 0 }`) on every QueryExtension request, then copies at most `nbytes` of it. PATH_MAX is a wildly oversized bound for an extension name and the per-request 4 KB stack zeroing is pure waste in a request hot path.","fix":"Use a small fixed buffer sized to the longest possible extension name (e.g. `char extname[128] = {0};`) or allocate `nbytes+1` and copy exactly `nbytes`, avoiding the large stack zeroing.","locations":[{"ref":"dix/extension.c:301-302","code":"  301 |         char extname[PATH_MAX] = { 0 };\n  302 |         strncpy(extname, (char *) &stuff[1], MIN(stuff->nbytes, sizeof(extname)-1));","lines":2,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/dix/extension.c#L301-L302"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"In the main dispatch loop, GetExtensionEntry(client->majorOp) is called twice for every extension request: once to compute client->minorOp and again a few lines later to run the ExtensionDispatchCallback. The first result is discarded. This is redundant work on the hot request path and duplicated code.","fix":"Cache the ExtensionEntry from the first lookup (line 533) in a local and reuse it for the ExtensionDispatchCallback block instead of calling GetExtensionEntry() a second time at line 553.","locations":[{"ref":"dix/dispatch.c:535-562","code":"  535 |                 if (client->majorOp >= EXTENSION_BASE) {\n  536 |                     ExtensionEntry *ext = GetExtensionEntry(client->majorOp);\n  537 | \n  538 |                     if (ext)\n  539 |                         client->minorOp = ext->MinorOpcode(client);\n  540 |                 }\n  541 | #ifdef XSERVER_DTRACE\n  542 |                 if (XSERVER_REQUEST_START_ENABLED())\n  543 |                     XSERVER_REQUEST_START(LookupMajorName(client->majorOp),\n  544 |                                           client->majorOp,\n  545 |                                           ((xReq *) client->requestBuffer)->length,\n  546 |                                           client->index,\n  547 |                                           client->requestBuffer);\n  548 | #endif\n  549 |                 int result;\n  550 |                 if (read_result < 0 || read_result > (maxBigRequestSize << 2))\n  551 |                     result = BadLength;\n  552 |                 else {\n  553 |                     result = Success;\n  554 |                     /* On extension requests, call the extension dispatch hook */\n  555 |                     if ((client->majorOp >= EXTENSION_BASE) && ExtensionDispatchCallback) {\n  556 |                         ExtensionEntry *ext = GetExtensionEntry(client->majorOp);\n  557 |                         if (ext) {\n  558 |                             ExtensionAccessCallbackParam erec = { client, ext, DixUseAccess, Success };\n  559 |                             CallCallbacks(&ExtensionDispatchCallback, &erec);\n  560 |                             result = erec.status;\n  561 |                         }\n  562 |                     }","lines":28,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/dix/dispatch.c#L535-L562"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"In ProcDbeAllocateBackBufferName(), line 231 writes stuff->buffer into pDbeWindowPriv->IDs[0],\nbut the very next loop (lines 233-234) immediately overwrites all elements of IDs[] with\nDBE_FREE_ID_ELEMENT (value 0). The write on line 231 is a dead store with no observable effect.","fix":"Remove the dead assignment on line 231 (pDbeWindowPriv->IDs[0] = stuff->buffer).","locations":[{"ref":"Xext/doublebuffer/dbe.c:231-236","code":"  231 |         /* Initialize the buffer ID list. */\n  232 |         pDbeWindowPriv->maxAvailableIDs = DBE_INIT_MAX_IDS;\n  233 |         pDbeWindowPriv->IDs[0] = stuff->buffer;\n  234 | \n  235 |         for (int i = 0; i < DBE_INIT_MAX_IDS; i++)\n  236 |             pDbeWindowPriv->IDs[i] = DBE_FREE_ID_ELEMENT;","lines":6,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/doublebuffer/dbe.c#L231-L236"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"In ProcDbeSwapBuffers(), line 425 already returns Success if stuff->n == 0. The inner check\non line 434 (if (stuff->n != 0)) inside the client->swapped branch is therefore always true\nand guards code that would run unconditionally. It is unreachable dead code.","fix":"Remove the redundant 'if (stuff->n != 0)' inner guard on line 434.","locations":[{"ref":"Xext/doublebuffer/dbe.c:427-428","code":"  427 |     if (stuff->n == 0)\n  428 |         return Success;","lines":2,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/doublebuffer/dbe.c#L427-L428"},{"ref":"Xext/doublebuffer/dbe.c:434-445","code":"  434 |     if (client->swapped) {\n  435 |         xDbeSwapInfo *pSwapInfo;\n  436 |         if (stuff->n != 0) {\n  437 |             pSwapInfo = (xDbeSwapInfo *) stuff + 1;\n  438 | \n  439 |             /* The swap info following the fix part of this request is a window(32)\n  440 |              * followed by a 1 byte swap action and then 3 pad bytes.  We only need\n  441 |              * to swap the window information.\n  442 |              */\n  443 |             for (int i = 0; i < stuff->n; i++, pSwapInfo++)\n  444 |                 swapl(&pSwapInfo->window);\n  445 |         }","lines":12,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/doublebuffer/dbe.c#L434-L445"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"miDbeWindowDestroy() (dbe.c line 955) re-fetches pDbeWindowPriv from the window after calling\nFreeResource(), but the result is never used before the while-loop condition re-evaluates it via\nDBE_WINDOW_PRIV(pWin). The extra assignment on line 955 is a dead store.","fix":"Remove the redundant 'pDbeWindowPriv = DBE_WINDOW_PRIV(pWin)' on line 955 inside the loop body.","locations":[{"ref":"Xext/doublebuffer/dbe.c:949-956","code":"  949 |     while ((pDbeWindowPriv = DBE_WINDOW_PRIV(pWin))) {\n  950 |             /* *DbeWinPrivDelete() will free the window private and set it to\n  951 |              * NULL if there are no more buffer IDs associated with this\n  952 |              * window.\n  953 |              */\n  954 |             FreeResource(pDbeWindowPriv->IDs[0], X11_RESTYPE_NONE);\n  955 |             pDbeWindowPriv = DBE_WINDOW_PRIV(pWin);\n  956 |     }","lines":8,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/doublebuffer/dbe.c#L949-L956"}]},
{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"SGI_video_sync_bit is declared in extension_string.h enum but has no corresponding entry in the known_glx_extensions[] table in extension_string.c and is not referenced anywhere else in the GLX code. The enum slot wastes a bit in __GLX_EXT_BYTES and is a maintenance trap.","fix":"Remove the SGI_video_sync_bit enumerator and, if GLX_SGI_video_sync support is ever added, add both the enum value and the extension table entry together.","locations":[{"ref":"Xext/glx/extension_string.h:64","code":"   64 |     SGI_video_sync_bit,","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/extension_string.h#L64"}]},
{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"In validGlxFBConfigForWindow(), BUG_RETURN_VAL(!pVisual, FALSE) at line 133 already guarantees that pVisual is non-NULL when execution reaches the following if-statement. The 'pVisual == NULL ||' condition in that if is therefore unreachable dead code.","fix":"Remove 'pVisual == NULL ||' from the condition at line 136, leaving only the class mismatch and drawableType checks.","locations":[{"ref":"Xext/glx/glxcmds.c:134-143","code":"  134 |     BUG_RETURN_VAL(!pVisual, FALSE);\n  135 | \n  136 |     /* FIXME: What exactly should we check here... */\n  137 |     if (pVisual == NULL ||\n  138 |         pVisual->class != glxConvertToXVisualType(config->visualType) ||\n  139 |         !(config->drawableType & GLX_WINDOW_BIT)) {\n  140 |         client->errorValue = pDraw->id;\n  141 |         *err = BadMatch;\n  142 |         return FALSE;\n  143 |     }","lines":10,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/glxcmds.c#L134-L143"}]},
{"id":"DEAD_6","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"In DoGetDrawableAttributes(), the check 'pGlxDraw == NULL' at line 1814 is unreachable. The immediately preceding block at line 1811 already checks '!pGlxDraw' and returns if true, so execution can never reach the second NULL check of the same variable.","fix":"Remove the 'pGlxDraw == NULL ||' condition from the compound if at line 1814, leaving only the type and copySubBuffer checks.","locations":[{"ref":"Xext/glx/glxcmds.c:1785-1791","code":" 1785 |     if (!pGlxDraw)\n 1786 |         return error;\n 1787 | \n 1788 |     if (pGlxDraw == NULL ||\n 1789 |         pGlxDraw->type != GLX_DRAWABLE_WINDOW ||\n 1790 |         pGlxDraw->copySubBuffer == NULL)\n 1791 |         return __glXError(GLXBadDrawable);","lines":7,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/glxcmds.c#L1785-L1791"}]},
{"id":"DEAD_7","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`extern void __glXFlushContextCache(void);` is declared in glxext.h but has no definition anywhere in the codebase and is never called. It is a dead declaration.","fix":"Remove the declaration (and its definition if one is ever found).","locations":[{"ref":"Xext/glx/glxext.h:57","code":"   57 | extern void __glXFlushContextCache(void);","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/glxext.h#L57"}]},
{"id":"DEAD_8","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`extern RESTYPE __glXClientRes;` is declared in glxserver.h but is never defined in any translation unit and is never referenced in the codebase. It is a stale symbol left over from an older implementation.","fix":"Remove the declaration.","locations":[{"ref":"Xext/glx/glxserver.h:151","code":"  151 | extern RESTYPE __glXClientRes;","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/glxserver.h#L151"}]},
{"id":"DEAD_9","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"In __glXDisp_CallLists the variable 'lists' is initialised on line 92 and then immediately overwritten with the identical expression on line 94. The first assignment is unreachable dead code and suggests a generator artefact or a copy-paste left-over.","fix":"Remove the redundant second assignment 'lists = (const GLvoid *) (pc + 8);' on line 94.","locations":[{"ref":"Xext/glx/indirect_dispatch.c:87-97","code":"   87 | void\n   88 | __glXDisp_CallLists(GLbyte * pc)\n   89 | {\n   90 |     const GLsizei n = *(GLsizei *) (pc + 0);\n   91 |     const GLenum type = *(GLenum *) (pc + 4);\n   92 |     const GLvoid *lists = (const GLvoid *) (pc + 8);\n   93 | \n   94 |     lists = (const GLvoid *) (pc + 8);\n   95 | \n   96 |     glCallLists(n, type, lists);\n   97 | }","lines":11,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/indirect_dispatch.c#L87-L97"}]},
{"id":"DEAD_10","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"In __glXDisp_Map1d (render2.c:83-100), the variables 'compsize' and the entire __GLX_ALIGN64 block\nfor computing 'compsize = order * k' are only used when __GLX_ALIGN64 is defined. On all modern\nplatforms (x86-64, aarch64) __GLX_ALIGN64 is not defined, so this block is dead code. The swap\nvariant (__glXDispSwap_Map1d, render2swap.c:120) always declares compsize and always uses it for\nthe byte-swap array operation, making the variable always live. The non-swap variant's guarded\ncompsize is a maintenance burden since bugs in that path go undetected on common build targets.","fix":"Consider removing the __GLX_ALIGN64 code path if it is no longer needed, or at least add a comment explaining which architectures still require it.","locations":[{"ref":"Xext/glx/render2.c:83-100","code":"   83 | #ifdef __GLX_ALIGN64\n   84 |     GLint compsize;\n   85 | #endif\n   86 |     GLenum target;\n   87 |     GLdouble u1, u2, *points;\n   88 | \n   89 |     target = *(GLenum *) (pc + 16);\n   90 |     order = *(GLint *) (pc + 20);\n   91 |     k = __glMap1d_size(target);\n   92 | \n   93 | #ifdef __GLX_ALIGN64\n   94 |     if (order < 0 || k < 0) {\n   95 |         compsize = 0;\n   96 |     }\n   97 |     else {\n   98 |         compsize = order * k;\n   99 |     }\n  100 | #endif","lines":18,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/render2.c#L83-L100"},{"ref":"Xext/glx/render2.c:106-118","code":"  106 | #ifdef __GLX_ALIGN64\n  107 |     if (((unsigned long) pc) & 7) {\n  108 |         /*\n  109 |          ** Copy the doubles up 4 bytes, trashing the command but aligning\n  110 |          ** the data in the process\n  111 |          */\n  112 |         __GLX_MEM_COPY(pc - 4, pc, compsize * 8);\n  113 |         points = (GLdouble *) (pc - 4);\n  114 |     }\n  115 |     else {\n  116 |         points = (GLdouble *) pc;\n  117 |     }\n  118 | #else","lines":13,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/render2.c#L106-L118"}]},
{"id":"DEAD_11","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"ProcXOpenDevice contains a manual search of inputInfo.off_devices (and a second `if (status != Success) return status;` check) that is now unreachable/redundant. dixLookupDevice() (dix/devices.c:1241-1244) already scans inputInfo.off_devices and returns Success (setting *pDev) for a device found there, or BadDevice only if the id is in neither list. Therefore: (a) when status==BadDevice, the manual off_devices loop can never find the device (it is not in off_devices either), so `dev` stays NULL and the function returns BadDevice; (b) any non-Success/non-BadDevice status is returned earlier by the `else if`; so at line 108 `status` is always Success, making `if (status != Success) return status;` dead. The block is confusing (it looks like it supports opening disabled devices, but that is handled entirely by dixLookupDevice) and should be simplified to avoid future misreading.","fix":"Replace the whole lookup/validate block with the equivalent, since dixLookupDevice already searches off_devices:\n```c\nstatus = dixLookupDevice(&dev, stuff->deviceid, client, DixUseAccess);\nif (status != Success)\n    return status;\nif (InputDevIsMaster(dev))\n    return BadDevice;\n```","locations":[{"ref":"Xext/xinput/opendev.c:93-109","code":"   93 |     status = dixLookupDevice(&dev, stuff->deviceid, client, DixUseAccess);\n   94 | \n   95 |     if (status == BadDevice) {  /* not open */\n   96 |         for (dev = inputInfo.off_devices; dev; dev = dev->next)\n   97 |             if (dev->id == stuff->deviceid)\n   98 |                 break;\n   99 |         if (dev == NULL)\n  100 |             return BadDevice;\n  101 |     }\n  102 |     else if (status != Success)\n  103 |         return status;\n  104 | \n  105 |     if (InputDevIsMaster(dev))\n  106 |         return BadDevice;\n  107 | \n  108 |     if (status != Success)\n  109 |         return status;","lines":17,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/xinput/opendev.c#L93-L109"}]},
{"id":"DEAD_12","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"In ProcXQueryDeviceState the three `if (rc != BadAccess)` guards (which are meant to blank out the key/button/valuator state for a client lacking DixReadAccess) are unreachable as false. dixLookupDevice() only sets *pDev on Success (dix/devices.c:1250-1251); on BadAccess it leaves dev==NULL. The function already returns early at line 83-84 (`if (!dev) return rc;`) whenever rc==BadAccess, so past that point rc is always Success. Consequently the `rc != BadAccess` conditions at lines 118, 129 and 144 are always true, so the 'blanked state' feature they implement can never execute - it is dead code and a silently-dropped feature. This is intentional per the comment (avoiding a NULL deref) but leaves misleading dead conditionals that should be removed for clarity.","fix":"Since the function now always bails out on BadAccess (dev==NULL), drop the unreachable `if (rc != BadAccess)` guards and copy the state unconditionally, e.g. change `if (rc != BadAccess) for (i = 0; i < 32; i++) tk->keys[i] = k->down[i];` to `for (i = 0; i < 32; i++) tk->keys[i] = k->down[i];`, and likewise for the button memcpy and the valuator loop. Alternatively remove the early `if (!dev) return rc;` and keep dev NULL-safe blanking, but the simplest correct change is to delete the now-dead conditions.","locations":[{"ref":"Xext/xinput/queryst.c:75-84","code":"   75 |     rc = dixLookupDevice(&dev, stuff->deviceid, client, DixReadAccess);\n   76 |     if (rc != Success && rc != BadAccess)\n   77 |         return rc;\n   78 | \n   79 |     /* dixLookupDevice() leaves dev NULL on anything other than Success,\n   80 |      * including BadAccess. The code below intentionally continues on\n   81 |      * BadAccess to blank out the state, but it cannot do so without a valid\n   82 |      * device, so bail out rather than dereferencing NULL. */\n   83 |     if (!dev)\n   84 |         return rc;","lines":10,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/xinput/queryst.c#L75-L84"},{"ref":"Xext/xinput/queryst.c:118-120","code":"  118 |         if (rc != BadAccess)\n  119 |             for (i = 0; i < 32; i++)\n  120 |                 tk->keys[i] = k->down[i];","lines":3,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/xinput/queryst.c#L118-L120"},{"ref":"Xext/xinput/queryst.c:129-130","code":"  129 |         if (rc != BadAccess)\n  130 |             memcpy(tb->buttons, b->down, sizeof(b->down));","lines":2,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/xinput/queryst.c#L129-L130"},{"ref":"Xext/xinput/queryst.c:143-145","code":"  143 |         for (i = 0, values = v->axisVal; i < v->numAxes; i++) {\n  144 |             if (rc != BadAccess)\n  145 |                 *((int *) buf) = *values;","lines":3,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/xinput/queryst.c#L143-L145"}]},
{"id":"DEAD_13","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"GestureListenerGone() allocates an InternalEvent list with InitEventList(GetMaximumEventsNum()) and frees it with FreeEventList(), but the `events` buffer is never used anywhere in the function (unlike TouchListenerGone, the gesture path only calls GestureEndGesture). This is a needless allocation on every disconnect of a client that owns a gesture listener, and it will even FatalError the whole server if that allocation happens to fail, despite the buffer being unnecessary.","fix":"Remove the unused `events` variable and the InitEventList/FreeEventList calls (and the FatalError-on-alloc-failure), iterating the devices directly.","locations":[{"ref":"dix/gestures.c:301-323","code":"  301 | void\n  302 | GestureListenerGone(XID resource)\n  303 | {\n  304 |     GestureInfoPtr gi;\n  305 |     InternalEvent *events = InitEventList(GetMaximumEventsNum());\n  306 | \n  307 |     if (!events)\n  308 |         FatalError(\"GestureListenerGone: couldn't allocate events\\n\");\n  309 | \n  310 |     for (DeviceIntPtr dev = inputInfo.devices; dev; dev = dev->next) {\n  311 |         if (!dev->gesture)\n  312 |             continue;\n  313 | \n  314 |         gi = &dev->gesture->gesture;\n  315 |         if (!gi->active)\n  316 |             continue;\n  317 | \n  318 |         if (CLIENT_BITS(gi->listener.listener) == resource)\n  319 |             GestureEndGesture(gi);\n  320 |     }\n  321 | \n  322 |     FreeEventList(events, GetMaximumEventsNum());\n  323 | }","lines":23,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/dix/gestures.c#L301-L323"}]},
{"id":"DEAD_14","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"glamor_xv_render() computes `gamma = (float) port_priv->gamma / 1000.0;` and later unconditionally overwrites it with `gamma = 1.0;` before it is used in the ucogamma uniform. The XV_GAMMA attribute is settable/gettable but its value therefore has no effect on rendering, and the first computation is dead. This is either a leftover debug override or an incomplete feature; the comment/attribute imply gamma is applied.","fix":"Either remove the forced `gamma = 1.0;` override so the port's gamma actually takes effect, or drop the XV_GAMMA computation and document that gamma is intentionally fixed at 1.0.","locations":[{"ref":"glamor/glamor_xv.c:441-456","code":"  441 |     gamma = (float) port_priv->gamma / 1000.0;\n  442 |     uvcosf = RTFSaturation(port_priv->saturation) * cos(RTFHue(port_priv->hue));\n  443 |     uvsinf = RTFSaturation(port_priv->saturation) * sin(RTFHue(port_priv->hue));\n  444 | /* overlay video also does pre-gamma contrast/sat adjust, should we? */\n  445 | \n  446 |     yco = trans[ref].RefLuma * cont;\n  447 |     uco[0] = -trans[ref].RefRCr * uvsinf;\n  448 |     uco[1] = trans[ref].RefGCb * uvcosf - trans[ref].RefGCr * uvsinf;\n  449 |     uco[2] = trans[ref].RefBCb * uvcosf;\n  450 |     vco[0] = trans[ref].RefRCr * uvcosf;\n  451 |     vco[1] = trans[ref].RefGCb * uvsinf + trans[ref].RefGCr * uvcosf;\n  452 |     vco[2] = trans[ref].RefBCb * uvsinf;\n  453 |     off[0] = Loff * yco + Coff * (uco[0] + vco[0]) + bright;\n  454 |     off[1] = Loff * yco + Coff * (uco[1] + vco[1]) + bright;\n  455 |     off[2] = Loff * yco + Coff * (uco[2] + vco[2]) + bright;\n  456 |     gamma = 1.0;","lines":16,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/glamor/glamor_xv.c#L441-L456"}]},
