{"id":"DEAD_15","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"fdi2iclass.py is written in Python 2 syntax: `print 'Section \"InputClass\"'` statements and `node.attributes.has_key(...)`, both removed in Python 3. On any system where /usr/bin/python is Python 3 the script fails immediately with a SyntaxError, so this HAL-FDI-to-xorg.conf conversion helper is effectively non-functional today.","fix":"Port to Python 3: convert `print X` to `print(X)`, replace `x.has_key(k)` with `k in x`, and confirm minidom usage; or remove the obsolete tool if HAL FDI files are no longer supported.","locations":[{"ref":"config/fdi2iclass.py:68-196","code":"   68 |     if node.attributes.has_key('key'):\n   69 |         key = node.attributes['key'].nodeValue\n   70 |         if key in match_table:\n   71 |             match = match_table[key]\n   72 |         elif key == 'info.capabilities':\n   73 |             booltype = True\n   74 | \n   75 |     # bail out now if it's unrecognized\n   76 |     if not match and not booltype:\n   77 |         return (match, value)\n   78 | \n   79 |     if node.attributes.has_key('string'):\n   80 |         value = node.attributes['string'].nodeValue\n   81 |     elif node.attributes.has_key('contains'):\n   82 |         value = node.attributes['contains'].nodeValue\n   83 |         if match == 'MatchDevicePath':\n   84 |             value = device_glob(value)\n   85 |         elif booltype and value in cap_match_table:\n   86 |             match = cap_match_table[value]\n   87 |             value = 'yes'\n   88 |     elif node.attributes.has_key('string_outof'):\n   89 |         value = node.attributes['string_outof'].nodeValue.replace(';','|')\n   90 |     elif node.attributes.has_key('contains_outof'):\n   91 |         all_values = node.attributes['contains_outof'].nodeValue.split(';')\n   92 |         for v in all_values:\n   93 |             if match == 'MatchDevicePath':\n   94 |          print_section(matches, driver, ignore, options)\n  196 |         num += 1","lines":129,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/config/fdi2iclass.py#L68-L196"}]},
{"id":"DEAD_16","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`ExtensionAvailable()` guards with `if (!ext->base) return FALSE;`, but `ext->base` is set in `AddExtension()` to `i + EXTENSION_BASE` where `EXTENSION_BASE == 128`, so `base` is always >= 128 and can never be zero. The check is dead code and can mislead readers into thinking a base-0 (unassigned) extension state exists.","fix":"Remove the dead `if (!ext->base) return FALSE;` check, or replace it with a comment explaining why it cannot happen.","locations":[{"ref":"dix/extension.c:286-287","code":"  286 |     if (!ext->base)\n  287 |         return FALSE;","lines":2,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/dix/extension.c#L286-L287"}]},
{"id":"DEAD_17","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"check_butmap_change() takes a `CARD32 *errval_out` parameter that is never read or written; the function sets client->errorValue directly. ApplyPointerMapping() passes `&client->errorValue` for it, which is misleading dead API surface.","fix":"Drop the unused `errval_out` parameter from check_butmap_change() and update the single caller in ApplyPointerMapping().","locations":[{"ref":"dix/inpututils.c:47-50","code":"   47 | static int\n   48 | check_butmap_change(DeviceIntPtr dev, CARD8 *map, int len, CARD32 *errval_out,\n   49 |                     ClientPtr client)\n   50 | {","lines":4,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/dix/inpututils.c#L47-L50"},{"ref":"dix/inpututils.c:120","code":"  120 |     ret = check_butmap_change(dev, map, len, &client->errorValue, client);","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/dix/inpututils.c#L120"}]},
{"id":"DEAD_18","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`need_free_mask_pixmap_priv` is declared and initialized to NULL but never assigned anywhere; the `free(need_free_mask_pixmap_priv)` at the end is always free(NULL). It appears to be a leftover from a symmetric source/mask self-copy handling that was only implemented for the source side.","fix":"Either remove the unused variable and its free(), or implement the mask self-copy handling symmetrically with the source side (lines 1190-1200) if that was the intent.","locations":[{"ref":"glamor/glamor_largepixmap.c:1079","code":" 1079 |     glamor_pixmap_private *need_free_mask_pixmap_priv = NULL;","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/glamor/glamor_largepixmap.c#L1079"},{"ref":"glamor/glamor_largepixmap.c:1479","code":" 1479 |     free(need_free_mask_pixmap_priv);","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/glamor/glamor_largepixmap.c#L1479"}]},
{"id":"DEAD_19","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"ephyrXVPrivSaveImageToPortPriv() places `EPHYR_LOG(\"leave\\n\");` after the `return is_ok;` at the `out:` label, making the log statement unreachable dead code.","fix":"Move the EPHYR_LOG(\"leave\\n\") before the return:\n```c\n out:\n    EPHYR_LOG(\"leave\\n\");\n    return is_ok;\n```","locations":[{"ref":"hw/kdrive/ephyr/ephyrvideo.c:724-726","code":"  724 |  out:\n  725 |     return is_ok;\n  726 |     EPHYR_LOG(\"leave\\n\");","lines":3,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/kdrive/ephyr/ephyrvideo.c#L724-L726"}]},
{"id":"DEAD_20","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"Ps2Read contains a dead, misleading SWAP_USB block guarded by `#undef SWAP_USB` immediately above it. If it were ever enabled it would not compile because it references an undefined identifier `id`. It is confusing leftover code.","fix":"Remove the `#undef SWAP_USB` / `#ifdef SWAP_USB ... #endif` block referencing the nonexistent `id`, or replace it with the actual device-id detection if left/right swap is desired.","locations":[{"ref":"hw/kdrive/linux/ps2.c:75-81","code":"   75 | #undef SWAP_USB\n   76 | #ifdef SWAP_USB\n   77 |     if (id == 2) {\n   78 |         left_button = KD_BUTTON_3;\n   79 |         right_button = KD_BUTTON_1;\n   80 |     }\n   81 | #endif","lines":7,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/kdrive/linux/ps2.c#L75-L81"}]},
{"id":"DEAD_21","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"rotate_clip() has a stray double semicolon `clip->x2 = h - y1;;` producing an empty statement. Harmless but sloppy.","fix":"Remove the extra semicolon: `clip->x2 = h - y1;`","locations":[{"ref":"hw/xfree86/drivers/video/modesetting/driver.c:622","code":"  622 |             clip->x2 = h - y1;;","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/drivers/video/modesetting/driver.c#L622"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The comment on line 59-61 of dpms.c declares `CARD32 DPMSStandbyTime = -1` etc. The dpms_priv.h header comment correctly explains these are treated as UINT32_MAX. However, assigning -1 to a CARD32 (unsigned 32-bit integer) is implementation-defined in C for the initializer of a global variable with explicit type - though in practice all targets represent it as UINT32_MAX, the CONDITIONALLY_SET_DPMS_TIMEOUT macro then compares `== -1` against these unsigned values, which due to integer promotion compares UINT32_MAX against -1 (promoted to UINT32_MAX for unsigned comparison), so it works. The code is fragile and the type mismatch should be made explicit.","fix":"Use `UINT32_MAX` or `(CARD32)(-1)` explicitly instead of bare `-1`, and update the CONDITIONALLY_SET_DPMS_TIMEOUT macro to compare against `UINT32_MAX` to clarify intent.","locations":[{"ref":"Xext/dpms/dpms.c:60-62","code":"   60 | CARD32 DPMSStandbyTime = -1;\n   61 | CARD32 DPMSSuspendTime = -1;\n   62 | CARD32 DPMSOffTime = -1;","lines":3,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/dpms/dpms.c#L60-L62"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"Two HOOK_NAME string literals contain typos: hook-clientstate.c defines HOOK_NAME as \"clienstate\" (missing 't') and hook-receive.c defines HOOK_NAME as \"recieve\" (misspelled). These appear in all diagnostic log output from those hooks, making log grepping by hook name unreliable.","fix":"Change \"clienstate\" to \"clientstate\" and \"recieve\" to \"receive\".","locations":[{"ref":"Xext/namespace/hook-clientstate.c:3","code":"    3 | #define HOOK_NAME \"clienstate\"","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/namespace/hook-clientstate.c#L3"},{"ref":"Xext/namespace/hook-receive.c:3","code":"    3 | #define HOOK_NAME \"recieve\"","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/namespace/hook-receive.c#L3"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"hook-selection.c line 43 uses `snprintf(selname, sizeof(selname)-1, ...)`. The\n`-1` is unnecessary: `snprintf` already guarantees null termination within the\nspecified size limit, so `sizeof(selname)-1` just silently reduces the maximum\nuseful string length by one character with no documented reason.","fix":"Use `sizeof(selname)` as the size argument to snprintf.","locations":[{"ref":"Xext/namespace/hook-selection.c:45","code":"   45 |     snprintf(selname, sizeof(selname)-1, \"<%s>%s\", subj->ns->name, origSelectionName);","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/namespace/hook-selection.c#L45"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The size-mismatch warning inside ProcXResQueryResourceBytes reports the wrong function name (\"ProcXResQueryClientIds()\"), a copy-paste leftover that would mislead anyone diagnosing the warning.","fix":"Before:\n```c\n            LogMessage(X_WARNING, \"ProcXResQueryClientIds() rpcbuf size (%ld) context size (%ld)\\n\",\n```\nAfter:\n```c\n            LogMessage(X_WARNING, \"ProcXResQueryResourceBytes() rpcbuf size (%ld) context size (%ld)\\n\",\n```","locations":[{"ref":"Xext/xres/xres.c:868-870","code":"  868 |         if (rpcbuf.wpos != ctx.resultBytes)\n  869 |             LogMessage(X_WARNING, \"ProcXResQueryClientIds() rpcbuf size (%ld) context size (%ld)\\n\",\n  870 |                        (unsigned long)rpcbuf.wpos, (unsigned long)ctx.resultBytes);","lines":3,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/xres/xres.c#L868-L870"}]},
{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The block comment for DeliverStateNotifyEvent says 'one deviceValuator event per 6 valuators above valuator 4'. The first three valuators (indices 0,1,2) are encoded in the base deviceStateNotify, and the trailing deviceValuator events start at index 3 (first = 3), not above valuator 4. The comment is misleading about where valuator splitting begins.","fix":"Change 'one deviceValuator event per 6 valuators above valuator 4' to 'one deviceValuator event per 6 valuators starting at valuator 3'.","locations":[{"ref":"dix/enterleave.c:685-691","code":"  685 |  * If a device has more than that, the server sends out:\n  686 |  * - one deviceButtonStateNotify for buttons 32 and above\n  687 |  * - one deviceKeyStateNotify for keys 32 and above\n  688 |  * - one deviceValuator event per 6 valuators above valuator 4\n  689 |  *\n  690 |  * All events but the last one have the deviceid binary ORed with MORE_EVENTS,\n  691 |  */","lines":7,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/dix/enterleave.c#L685-L691"}]},
{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The file header doc comment is garbled: it contains a stray 'laid *' fragment on its own line, an artifact of a bad edit.","fix":"Remove the stray `laid *` line from the block comment.","locations":[{"ref":"glamor/glamor_picture.c:29-37","code":"   29 |  * Implements temporary uploads of GL_MEMORY Pixmaps to a texture that\n   30 |  * is swizzled appropriately for a given Render picture format.\n   31 |  * laid *\n   32 |  *\n   33 |  * This is important because GTK likes to use SHM Pixmaps for Render\n   34 |  * blending operations, and we don't want a blend operation to fall\n   35 |  * back to software (readback is more expensive than the upload we do\n   36 |  * here, and you'd have to re-upload the fallback output anyway).\n   37 |  */","lines":9,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/glamor/glamor_picture.c#L29-L37"}]},
{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"very_easy","description":"In __glXsendSwapEvent(), 'if (!client) return;' appears twice in a row (lines 2428 and 2435). The second check is dead code. Between the two checks only a struct initializer runs, which cannot nullify 'client'.","fix":"Remove the duplicate 'if (!client) return;' at line 2435.","locations":[{"ref":"Xext/glx/glxcmds.c:2401-2410","code":" 2401 |     ClientPtr client = dixClientForXID(drawable->drawId);\n 2402 |     if (!client)\n 2403 |         return;\n 2404 | \n 2405 |     xGLXBufferSwapComplete2 wire =  {\n 2406 |         .type = __glXEventBase + GLX_BufferSwapComplete\n 2407 |     };\n 2408 | \n 2409 |     if (!client)\n 2410 |         return;","lines":10,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/glxcmds.c#L2401-L2410"}]},
{"id":"OTHER_1","type":"other","type_label":"Other","severity":"high","difficulty":"medium","description":"Every dispatch function that resolves a GL entry point via __glGetProcAddress (118 call sites) calls the resulting function pointer immediately without checking whether it is NULL. If the underlying OpenGL implementation does not expose that entry point, __glGetProcAddress returns NULL and the call dereferences a null pointer, crashing the X server. A malicious client that sends a request for one of these commands (e.g., glBeginQuery, glCompressedTexImage1D, glSampleCoverage, glCheckFramebufferStatus, etc.) to a server whose driver lacks the extension can exploit this to trigger a server crash. Functions with a context guard (cx != NULL) still execute the null-pointer call inside the guard, so the guard does not protect against this.","fix":"After each __glGetProcAddress call, check the result for NULL and return an appropriate error (e.g., BadRequest or __glXError(GL_INVALID_OPERATION)) before invoking the function pointer.","locations":[{"ref":"Xext/glx/indirect_dispatch.c:3604-3616","code":" 3604 | __glXDisp_CompressedTexImage1D(GLbyte * pc)\n 3605 | {\n 3606 |     PFNGLCOMPRESSEDTEXIMAGE1DPROC CompressedTexImage1D =\n 3607 |         __glGetProcAddress(\"glCompressedTexImage1D\");\n 3608 |     const GLsizei imageSize = *(GLsizei *) (pc + 20);\n 3609 | \n 3610 |     CompressedTexImage1D(*(GLenum *) (pc + 0),\n 3611 |                          *(GLint *) (pc + 4),\n 3612 |                          *(GLenum *) (pc + 8),\n 3613 |                          *(GLsizei *) (pc + 12),\n 3614 |                          *(GLint *) (pc + 16),\n 3615 |                          imageSize, (const GLvoid *) (pc + 24));\n 3616 | }","lines":13,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/indirect_dispatch.c#L3604-L3616"},{"ref":"Xext/glx/indirect_dispatch.c:3848-3853","code":" 3848 | __glXDisp_BeginQuery(GLbyte * pc)\n 3849 | {\n 3850 |     PFNGLBEGINQUERYPROC BeginQuery = __glGetProcAddress(\"glBeginQuery\");\n 3851 | \n 3852 |     BeginQuery(*(GLenum *) (pc + 0), *(GLuint *) (pc + 4));\n 3853 | }","lines":6,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/indirect_dispatch.c#L3848-L3853"},{"ref":"Xext/glx/indirect_dispatch.c:4025-4028","code":" 4025 |     PFNGLBLENDEQUATIONSEPARATEPROC BlendEquationSeparate =\n 4026 |         __glGetProcAddress(\"glBlendEquationSeparate\");\n 4027 |     BlendEquationSeparate(*(GLenum *) (pc + 0), *(GLenum *) (pc + 4));\n 4028 | }","lines":4,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/indirect_dispatch.c#L4025-L4028"},{"ref":"Xext/glx/indirect_dispatch.c:4546-4563","code":" 4546 | __glXDisp_CheckFramebufferStatus(__GLXclientState * cl, GLbyte * pc)\n 4547 | {\n 4548 |     PFNGLCHECKFRAMEBUFFERSTATUSPROC CheckFramebufferStatus =\n 4549 |         __glGetProcAddress(\"glCheckFramebufferStatus\");\n 4550 |     xGLXVendorPrivateReq *const req = (xGLXVendorPrivateReq *) pc;\n 4551 |     int error;\n 4552 |     __GLXcontext *const cx = __glXForceCurrent(cl, req->contextTag, &error);\n 4553 | \n 4554 |     pc += __GLX_VENDPRIV_HDR_SIZE;\n 4555 |     if (cx != NULL) {\n 4556 |         GLenum retval;\n 4557 | \n 4558 |         retval = CheckFramebufferStatus(*(GLenum *) (pc + 0));\n 4559 |         __glXSendReply(cl->client, dummy_answer, 0, 0, GL_FALSE, retval);\n 4560 |         error = Success;\n 4561 |     }\n 4562 | \n 4563 |     return error;","lines":18,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/indirect_dispatch.c#L4546-L4563"}]},
{"id":"OTHER_2","type":"other","type_label":"Other","severity":"high","difficulty":"medium","description":"hookPropertyAccess never sets param->status, so it never actually blocks cross-namespace property access. The hook logs the violation but takes no enforcement action. Any client in any namespace can read or write properties on windows owned by clients in other namespaces without restriction.","fix":"Add `param->status = BadAccess;` in the cross-namespace path after deciding to block. Also add a NULL check for `subj` (see related finding) before accessing `subj->ns`.","locations":[{"ref":"Xext/namespace/hook-property.c:25-49","code":"   25 | void hookPropertyAccess(CallbackListPtr *pcbl, void *unused, void *calldata)\n   26 | {\n   27 |     XNS_HOOK_HEAD(XacePropertyAccessRec);\n   28 |     struct XnamespaceClientPriv *obj = XnsClientPriv(dixClientForWindow(param->pWin));\n   29 | \n   30 |     ATOM name = (*param->ppProp)->propertyName;\n   31 | \n   32 |     if (XnsClientSameNS(subj, obj))\n   33 |         return;\n   34 | \n   35 |     if (param->pWin == subj->ns->rootWindow)\n   36 |         return;\n   37 | \n   38 |     if (winIsRoot(param->pWin)) {\n   39 |         XNS_HOOK_LOG(\"window is the screen's root window\\n\");\n   40 |     } else {\n   41 |         XNS_HOOK_LOG(\"not a root window\\n\");\n   42 |     }\n   43 | \n   44 |     XNS_HOOK_LOG(\"access to property %s (atom 0x%x) window 0x%lx of client %d\\n\",\n   45 |         NameForAtom(name),\n   46 |         name,\n   47 |         (unsigned long)param->pWin->drawable.id,\n   48 |         dixClientForWindow(param->pWin)->index);\n   49 | }","lines":25,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/namespace/hook-property.c#L25-L49"}]},
{"id":"OTHER_3","type":"other","type_label":"Other","severity":"medium","difficulty":"medium","description":"In proc_dri3_dispatch(), the `!client->local` check rejecting non-local clients is applied at the top of the dispatch function before processing any opcode. However, proc_dri3_query_version() is also blocked for non-local clients, returning BadMatch. DRI2 extension allows QueryVersion from non-local clients (only the local check gates all other DRI2 ops). Blocking DRI3 QueryVersion from remote clients makes DRI3 unusable for remote X sessions where the client just wants to probe what DRI3 version the server supports, as required by the extension negotiation protocol. While this is intentionally security-restrictive, it deviates from the DRI3 spec's expectation that QueryVersion is always available.","fix":"Move the `!client->local` check inside the switch, exempting `X_DRI3QueryVersion` from the locality restriction (matching how DRI2 handles it in dri2ext.c lines 538-544).","locations":[{"ref":"Xext/dri3/dri3_request.c:621-625","code":"  621 | proc_dri3_dispatch(ClientPtr client)\n  622 | {\n  623 |     REQUEST(xReq);\n  624 |     if (!client->local)\n  625 |         return BadMatch;","lines":5,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/dri3/dri3_request.c#L621-L625"}]},
{"id":"OTHER_4","type":"other","type_label":"Other","severity":"medium","difficulty":"medium","description":"__glXCompressedTexImage1DReqSize, __glXCompressedTexImage2DReqSize, and __glXCompressedTexImage3DReqSize\n(indirect_reqsize.c:613-647) all accept a client-supplied imageSize and return 'safe_pad(imageSize)'\nwithout any upper-bound check. A malicious client can supply a very large imageSize value just below\nINT_MAX which passes safe_pad (since safe_pad detects overflow) but causes the protocol length\nvalidation to accept a packet far larger than any real compressed texture. While safe_pad prevents\nthe arithmetic from overflowing, there is no check that imageSize is sane relative to the texture\ndimensions (which are present in the same packet at pc+12, pc+16, etc.) before the server reads\nimageSize bytes of pixel data from the client connection. The same applies to CompressedTexSubImage3D.","fix":"Add a sanity upper bound for imageSize (e.g. reject if > MAX_COMPRESSED_TEXTURE_SIZE) or cross-validate against the dimensions present in the packet.","locations":[{"ref":"Xext/glx/indirect_reqsize.c:613-659","code":"  613 | int\n  614 | __glXCompressedTexImage1DReqSize(const GLbyte * pc, Bool swap, int reqlen)\n  615 | {\n  616 |     GLsizei imageSize = *(GLsizei *) (pc + 20);\n  617 | \n  618 |     if (swap) {\n  619 |         imageSize = bswap_32(imageSize);\n  620 |     }\n  621 | \n  622 |     return safe_pad(imageSize);\n  623 | }\n  624 | \n  625 | int\n  626 | __glXCompressedTexImage2DReqSize(const GLbyte * pc, Bool swap, int reqlen)\n  627 | {\n  628 |     GLsizei imageSize = *(GLsizei *) (pc + 24);\n  629 | \n  630 |     if (swap) {\n  631 |         imageSize = bswap_32(imageSize);\n  632 |     }\n  633 | \n  634 |     return safe_pad(imageSize);\n  635 | }\n  636 | \n  637 | int\n  638 | __glXCompressedTexImage3DReqSize(const GLbyte * pc, Bool swap, int reqlen)\n  639 | {\n  640 |     GLsizei imageSize = *(GLsizei *) (pc + 28);\n  641 | \n  642 |     if (swap) {\n  643 |         imageSize = bswap_32(imageSize);\n  644 |     }\n  645 | \n  646 |     return safe_pad(imageSize);\n  647 | }\n  648 | \n  649 | int\n  650 | __glXCompressedTexSubImage3DReqSize(const GLbyte * pc, Bool swap, int reqlen)\n  651 | {\n  652 |     GLsizei imageSize = *(GLsizei *) (pc + 36);\n  653 | \n  654 |     if (swap) {\n  655 |         imageSize = bswap_32(imageSize);\n  656 |     }\n  657 | \n  658 |     return safe_pad(imageSize);\n  659 | }","lines":47,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/indirect_reqsize.c#L613-L659"}]},
{"id":"OTHER_5","type":"other","type_label":"Other","severity":"low","difficulty":"very_easy","description":"findFirstSet uses the expression `(1 << i)` with a signed int left-hand operand and i reaching 31, which shifts a 1-bit into the sign bit. This is undefined behavior in C (signed integer overflow via shift). The parameter v is already `unsigned int`, so only the shift constant needs fixing.","fix":"Change `(1 << i)` to `(1u << i)` so the shift is performed on an unsigned type.","locations":[{"ref":"Xext/glx/glxscreens.c:219-221","code":"  219 |     for (i = 0; i < 32; i++)\n  220 |         if (v & (1 << i))\n  221 |             return i;","lines":3,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/glxscreens.c#L219-L221"}]},
{"id":"OTHER_6","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"SetMaskForEvent validates `deviceid` against [0,MAXDEVICES) but performs no bounds check on `event` before writing `event_filters[deviceid][event] = mask;`. The sibling function SetCriticalEvent does check `event >= MAXEVENTS`. `event_filters` is `[MAXDEVICES][MAXEVENTS]`, so an out-of-range `event` would be an OOB write. Current callers (UpdateDeviceState, SetMaskForExtEvent) pass in-range protocol event types so it is not currently reachable, but the missing check is an inconsistent, fragile invariant.","fix":"Add a bounds check symmetric with SetCriticalEvent:\n```c\nif (deviceid < 0 || deviceid >= MAXDEVICES)\n    FatalError(\"SetMaskForEvent: bogus device id\");\nif (event < 0 || event >= MAXEVENTS)\n    FatalError(\"SetMaskForEvent: bogus event number\");\nevent_filters[deviceid][event] = mask;\n```","locations":[{"ref":"dix/events.c:689-695","code":"  689 | void\n  690 | SetMaskForEvent(int deviceid, Mask mask, int event)\n  691 | {\n  692 |     if (deviceid < 0 || deviceid >= MAXDEVICES)\n  693 |         FatalError(\"SetMaskForEvent: bogus device id\");\n  694 |     event_filters[deviceid][event] = mask;\n  695 | }","lines":7,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/dix/events.c#L689-L695"}]},
{"id":"OTHER_7","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"Ones() has a preprocessor fall-through gap: when `__has_builtin` is defined but `__builtin_popcountl` is not a recognized builtin, the outer `#if defined __has_builtin` branch is taken, the inner `#if __has_builtin(...)` is false, and the `#else` fallback (which belongs to the outer directive) is skipped. This leaves the non-void function with an empty body and no return statement -> undefined behavior. In practice every compiler defining __has_builtin also provides __builtin_popcountl, so it is only a latent portability defect.","fix":"Restructure so the software fallback is always reachable, e.g. use `#if defined(__has_builtin) && __has_builtin(__builtin_popcountl)` as a single condition with a plain `#else` providing the HACKMEM implementation.","locations":[{"ref":"hw/xfree86/compat/ones.c:22-35","code":"   22 |     /* can't add a message here because this should be fast */\n   23 | #if defined __has_builtin\n   24 | #if __has_builtin(__builtin_popcountl)\n   25 |     return __builtin_popcountl (mask);\n   26 | #endif\n   27 | #elif defined __builtin_popcountl\n   28 |     return __builtin_popcountl (mask);\n   29 | #else\n   30 |     unsigned long y;\n   31 | \n   32 |     y = (mask >> 1) & 033333333333;\n   33 |     y = mask - y - ((y >> 1) & 033333333333);\n   34 |     return (((y + (y >> 3)) & 030707070707) % 077);\n   35 | #endif","lines":14,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/compat/ones.c#L22-L35"}]},
{"id":"OTHER_8","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"x_rpcbuf_write_CARD8s() declares the reserved region pointer as `INT16 *reserved` although it reserves/copies `count` bytes of CARD8 data. It works because memcpy uses a byte count, but the pointer type is misleading and inconsistent with the CARD8 payload.","fix":"Use the correct type:\n```c\nCARD8 *reserved = x_rpcbuf_reserve(rpcbuf, count);\n```","locations":[{"ref":"dix/rpcbuf.c:174","code":"  174 |     INT16 *reserved = x_rpcbuf_reserve(rpcbuf, count);","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/dix/rpcbuf.c#L174"}]},
{"id":"OTHER_9","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"glamor_create_fbo_array() returns `FALSE` on the fbo_array calloc failure, but the function's return type is `glamor_pixmap_fbo *`. This happens to work because FALSE == 0 == NULL, but it is a type confusion that should return NULL for clarity/correctness.","fix":"Change `return FALSE;` to `return NULL;` in the `if (fbo_array == NULL)` branch.","locations":[{"ref":"glamor/glamor_fbo.c:200-204","code":"  200 |     fbo_array = calloc(block_wcnt * block_hcnt, sizeof(glamor_pixmap_fbo *));\n  201 |     if (fbo_array == NULL) {\n  202 |         free(box_array);\n  203 |         return FALSE;\n  204 |     }","lines":5,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/glamor/glamor_fbo.c#L200-L204"}]}

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};

// State
const S = {
  search: '', searchScope: 'all', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenDiff: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(),
};

}

    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));
    if (S.search)            p.set('q',   S.search);
    if (S.searchScope !== 'all') p.set('qs', S.searchScope);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('qs'))  { S.searchScope = p.get('qs'); }
  document.getElementById('search-scope').classList.toggle('active', S.searchScope === 'locations');
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }
function isCustom(t)  { return String(t).toLowerCase() === 'custom'; }
function typeCls(t)   { return 'type-badge' + (isCustom(t) ? ' custom-type' : ''); }
// 'custom' findings are the user's own externally-sourced ones; pin them first
// everywhere types are listed so they never blend into the audit's own categories.
function cmpTypes(a, b) {
  if (isCustom(a) !== isCustom(b)) return isCustom(a) ? -1 : 1;
  return String(a).localeCompare(String(b));
}

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Render a "**Label:** value" line. GitHub/CommonMark only recognizes a
// ``` fence when it starts at the beginning of a line, so if the value
// itself opens with a fence, put it on its own line instead of right
// after the inline label - otherwise the fence marker gets glued onto
// "**Label:** ```" and never renders as a code block.
function mdField(label, value) {
  value = value || '';
  return /^```/.test(value.trim())
    ? '**' + label + ':**\n\n' + value
    : '**' + label + ':** ' + value;
}

// Render the "**Locations:**" block. When a location has a commit-pinned
// permalink (GitHub/GitLab), just paste the bare URL on its own line -
// GitHub/GitLab auto-expand a line-range blob link into an inline code
// preview, so re-pasting the snippet as a fenced block would duplicate it.
// Forges without a detected permalink shape (or missing commit/repo info)
// fall back to the fenced ref+snippet so the location is still readable.
function mdLocations(locations) {
  if (!locations.length) return '';
  let out = '**Locations:**\n\n';
  for (const l of locations) {
    if (l.link)               out += l.link + '\n\n';
    else if (l.code != null)  out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
    else                      out += '- `' + l.ref + '` _(file not found)_\n\n';
  }
  return out;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort(cmpTypes);

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += mdField('Description', f.description) + '\n\n';
      out += mdLocations(f.locations);
      out += mdField('Fix', f.fix) + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build a [project] header block from embedded PROJECT_INFO, so the exported
// findings.toml is self-contained (doesn't depend on a sibling project-info.toml
// that a second, separately-triggered download could silently fail to save).
// '' when there is no project info at all.
function buildProjectToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = PROJECT_INFO || {};
  if (!Object.keys(pi).length) return '';
  const lines = ['[project]'];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n\n';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    // Pin the id so re-rendering this export - or filtering it down later - can't
    // renumber findings that were already referenced by id elsewhere.
    if (f.id && f.id !== '?') lns.push(pad('id') + '= ' + tomlStr(f.id));
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return buildProjectToml() + chunks.join('\n\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += mdField('Description', f.description) + '\n\n';
  out += mdLocations(f.locations);
  out += mdField('Fix', f.fix) + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'folder') {
    if (!f.locations.length) return '(no location)';
    const path = f.locations[0].ref.replace(/:.*/,'');
    const idx = path.lastIndexOf('/');
    return idx === -1 ? '(root)' : path.slice(0, idx);
  }
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystacks per finding (cleared on full re-render).
// Two variants: everything (default), and file/folder paths only - for when a
// search term (e.g. a directory name like 'dlls/abc') also happens to appear
// inside description/fix prose and you only want path matches.
const _hay = new Map();
const _hayLoc = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}
function hayLocOf(f) {
  if (!_hayLoc.has(f.id)) {
    _hayLoc.set(f.id, f.locations.map(l => l.ref).join(' ').toLowerCase());
  }
  return _hayLoc.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (S.searchScope === 'locations') {
      if (!hayLocOf(f).includes(q)) return false;
    } else if (!hayOf(f).includes(q) && !st.includes(q)) {
      return false;
    }
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  if (S.groupBy === 'type') return [...keys].sort(cmpTypes);
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge ' + typeCls(f.type) + '" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge ' + typeCls(t) + '" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  _hayLoc.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    // Single download (was two) - a second auto-triggered download is commonly
    // blocked by the browser unless the user explicitly allows it, which silently
    // drops project-info.toml. Embedding [project] in findings.toml itself avoids
    // that failure mode entirely.
    downloadText(buildFindingsToml(), 'findings.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});
document.getElementById('search-scope').addEventListener('click', e => {
  S.searchScope = S.searchScope === 'locations' ? 'all' : 'locations';
  e.currentTarget.classList.toggle('active', S.searchScope === 'locations');
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
