__glXGetAnswerBuffer(cl, n * 4, answerBuffer, sizeof(answerBuffer),\n 4651 |                                  4);\n 4652 | \n 4653 |         if (framebuffers == NULL)\n 4654 |             return BadAlloc;\n 4655 | \n 4656 |         GenFramebuffers(n, framebuffers);\n 4657 |         __glXSendReply(cl->client, framebuffers, n, 4, GL_TRUE, 0);\n 4658 |         error = Success;\n 4659 |     }\n 4660 | \n 4661 |     return error;\n 4662 | }","lines":28,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/indirect_dispatch.c#L4635-L4662"},{"ref":"Xext/glx/indirect_dispatch.c:4664-4690","code":" 4664 | int\n 4665 | __glXDisp_GenRenderbuffers(__GLXclientState * cl, GLbyte * pc)\n 4666 | {\n 4667 |     PFNGLGENRENDERBUFFERSPROC GenRenderbuffers =\n 4668 |         __glGetProcAddress(\"glGenRenderbuffers\");\n 4669 |     xGLXVendorPrivateReq *const req = (xGLXVendorPrivateReq *) pc;\n 4670 |     int error;\n 4671 |     __GLXcontext *const cx = __glXForceCurrent(cl, req->contextTag, &error);\n 4672 | \n 4673 |     pc += __GLX_VENDPRIV_HDR_SIZE;\n 4674 |     if (cx != NULL) {\n 4675 |         const GLsizei n = *(GLsizei *) (pc + 0);\n 4676 | \n 4677 |         GLuint answerBuffer[200];\n 4678 |         GLuint *renderbuffers =\n 4679 |             __glXGetAnswerBuffer(cl, n * 4, answerBuffer, sizeof(answerBuffer),\n 4680 |                                  4);\n 4681 | \n 4682 |         if (renderbuffers == NULL)\n 4683 |             return BadAlloc;\n 4684 |         GenRenderbuffers(n, renderbuffers);\n 4685 |         __glXSendReply(cl->client, renderbuffers, n, 4, GL_TRUE, 0);\n 4686 |         error = Success;\n 4687 |     }\n 4688 | \n 4689 |     return error;\n 4690 | }","lines":27,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/indirect_dispatch.c#L4664-L4690"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"In xfont.c __glXMakeBitmapFromGlyph(), `allocBytes = widthPadded * h` is a plain int multiply with no overflow check. widthPadded derives from glyph width metrics (INT16 ascent/descent sums allow values up to ~65534) and h similarly. Their product can overflow a 32-bit int to a negative value. If allocBytes overflows to a value <= __GL_CHAR_BUF_SIZE (2048), the code uses the 2048-byte stack buffer `buf` for a glyph that actually requires gigabytes, resulting in a stack buffer overflow and potential code execution.","fix":"Replace the plain multiply with a checked form: use `(int64_t)widthPadded * h`, check it is positive and <= some reasonable limit, then cast to int for allocBytes.","locations":[{"ref":"Xext/glx/xfont.c:89-98","code":"   89 |     allocBytes = widthPadded * h;\n   90 |     if (allocBytes <= __GL_CHAR_BUF_SIZE) {\n   91 |         p = buf;\n   92 |         allocbuf = 0;\n   93 |     }\n   94 |     else {\n   95 |         p = calloc(1, allocBytes);\n   96 |         if (!p)\n   97 |             return BadAlloc;\n   98 |         allocbuf = p;","lines":10,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/xfont.c#L89-L98"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"very_easy","description":"ProcRenderSetPictureFilter computes the packet length from the 16-bit `stuff->length` field (`stuff->length * 4`) instead of the authoritative `client->req_len`. For a BIG-REQUESTS request the on-wire 16-bit length field is 0 (the real length lives in the extended CARD32 and is only reflected in client->req_len; see os/io.c move_header handling which copies the original xReq with length==0). So for a byte-swapped client sending RenderSetPictureFilter as a Big Request, `packet_len` becomes 0. Then `remaining = packet_len - sizeof(xRenderSetPictureFilterReq)(12) - namelen` underflows to a value near SIZE_MAX. Because both 12 and namelen (pad_to_int32) are multiples of 4, `remaining` is a multiple of 4, so the guard `if ((nparams*4) != remaining) return BadLength;` PASSES, and `SwapLongs(params, nparams)` is called with nparams ~= 2^62, causing a massive out-of-bounds write past the request buffer (server crash / potential memory corruption). REQUEST_AT_LEAST_EXTRA_SIZE uses the real length so it does not catch this. Reachable by any client that enables BIG-REQUESTS and connects with swapped byte order.","fix":"Use the authoritative request length that already accounts for Big Requests.\n\nbefore:\n```c\n    const size_t packet_len = stuff->length * 4;\n```\nafter:\n```c\n    const size_t packet_len = (size_t) client->req_len << 2;\n```","locations":[{"ref":"Xext/render/render.c:2816-2830","code":" 2816 |     const size_t namelen = pad_to_int32(stuff->nbytes);\n 2817 |     REQUEST_AT_LEAST_EXTRA_SIZE(xRenderSetPictureFilterReq, namelen);\n 2818 | \n 2819 |     const size_t packet_len = stuff->length * 4;\n 2820 |     const size_t remaining =\n 2821 |         (packet_len - sizeof(xRenderSetPictureFilterReq) - namelen);\n 2822 |     const size_t nparams = remaining / 4;\n 2823 |     if ((nparams * 4) != remaining) {\n 2824 |         return BadLength;\n 2825 |     }\n 2826 | \n 2827 |     if (client->swapped) {\n 2828 |         CARD32 *params = (CARD32*)((char*)(stuff + 1) + namelen);\n 2829 |         SwapLongs(params, nparams);\n 2830 |     }","lines":15,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/render/render.c#L2816-L2830"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"In SingleXvShmPutImage the bounds check `(size_needed + stuff->offset) > shmdesc->size` is evaluated in 32-bit unsigned arithmetic. `size_needed` is `int` and `stuff->offset` is a fully client-controlled `CARD32`; their sum is computed as a 32-bit unsigned value and only then widened to the 64-bit `unsigned long` size. A client can set `offset = 0xFFFFFFFF` with any small image (e.g. 1x1, size_needed=1) so that the sum wraps to 0, passing the check. XvdiPutImage is then called with the source data pointer `shmdesc->addr + stuff->offset` pointing ~4GB past the shared-memory segment, giving an out-of-bounds read reachable by any client that has an MIT-SHM segment and an XvImage-capable adaptor (common with video players). This is a memory-safety bug reachable directly from a request handler.","fix":"Perform the comparison in a 64-bit type and reject negative sizes, e.g.:\n```c\nif (size_needed < 0 ||\n    (uint64_t) size_needed + (uint64_t) stuff->offset > shmdesc->size)\n    return BadAccess;\n```\nThis avoids the 32-bit wrap of `size_needed + stuff->offset`.","locations":[{"ref":"Xext/xv/xvdisp.c:740-749","code":"  740 |     width = stuff->width;\n  741 |     height = stuff->height;\n  742 |     size_needed = (*pPort->pAdaptor->ddQueryImageAttributes) (pPort, pImage,\n  743 |                                                               &width, &height,\n  744 |                                                               NULL, NULL);\n  745 |     if ((size_needed + stuff->offset) > shmdesc->size)\n  746 |         return BadAccess;\n  747 | \n  748 |     if ((width < stuff->width) || (height < stuff->height))\n  749 |         return BadValue;","lines":10,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/xv/xvdisp.c#L740-L749"}]},
{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"very_easy","description":"In RealizeCursorAllScreens the cursor-realize failure rollback iterates previous screens with `while (--walkScreenIdx >= 0)`. `walkScreenIdx` is declared `unsigned` by the DIX_FOR_EACH_SCREEN macro (dix/screenint_priv.h:68), so `--walkScreenIdx >= 0` is a tautology. After processing screen 0 the counter wraps to UINT_MAX; `dixGetScreenPtr(UINT_MAX)` returns NULL (it bounds-checks), and the immediately following `walkScreen->UnrealizeCursor` dereferences NULL. With a single screen (the common case) the very first `--walkScreenIdx` already wraps, so ANY RealizeCursor failure (e.g. driver/GPU out-of-memory, or an oversized ARGB cursor from Xrender) crashes the server. This is a guaranteed NULL dereference on the error path.","fix":"Use an unsigned-safe loop that decrements after the test.\nBefore:\n```c\n                    while (--walkScreenIdx>= 0) {\n```\nAfter:\n```c\n                    while (walkScreenIdx-- > 0) {\n```\nThis iterates walkScreenIdx over fail-1..0 and then stops (0 > 0 is false) without wrapping.","locations":[{"ref":"dix/cursor.c:206-217","code":"  206 |                     while (--walkScreenIdx>= 0) {\n  207 |                         walkScreen = dixGetScreenPtr(walkScreenIdx);\n  208 |                         /* now unrealize all devices on previous screens */\n  209 |                         pDevIt = inputInfo.devices;\n  210 |                         while (pDevIt) {\n  211 |                             if (DevHasCursor(pDevIt) && walkScreen->UnrealizeCursor)\n  212 |                                 walkScreen->UnrealizeCursor(pDevIt, walkScreen, pCurs);\n  213 |                             pDevIt = pDevIt->next;\n  214 |                         }\n  215 |                         if (walkScreen->UnrealizeCursor)\n  216 |                             walkScreen->UnrealizeCursor(pDev, walkScreen, pCurs);\n  217 |                     }","lines":12,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/dix/cursor.c#L206-L217"},{"ref":"dix/screenint_priv.h:67-71","code":"   67 | #define DIX_FOR_EACH_SCREEN(__LAMBDA__) \\\n   68 |     do { \\\n   69 |         for (unsigned walkScreenIdx = 0; walkScreenIdx < screenInfo.numScreens; walkScreenIdx++) { \\\n   70 |             ScreenPtr walkScreen = screenInfo.screens[walkScreenIdx]; \\\n   71 |             (void)walkScreen; \\","lines":5,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/dix/screenint_priv.h#L67-L71"}]},
{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"very_easy","description":"initGlxVisual computes `visual->ColormapEntries = 1 << maxBits` where ColormapEntries is declared as `short` (16 bits) and maxBits comes from GLint config->redBits / greenBits / blueBits. For any config with a channel width >= 16 (e.g. float or HDR configs where a channel can be 16 or 32 bits) the shift either overflows int (UB for maxBits >= 31) or silently truncates when stored in the short field.","fix":"Cap maxBits before shifting, e.g. `if (maxBits < 15) visual->ColormapEntries = (short)(1 << maxBits); else visual->ColormapEntries = SHRT_MAX;`. Also guard against maxBits >= 31 to avoid signed UB.","locations":[{"ref":"Xext/glx/glxscreens.c:229-236","code":"  229 |     int maxBits;\n  230 | \n  231 |     maxBits = MAX(config->redBits, MAX(config->greenBits, config->blueBits));\n  232 | \n  233 |     config->visualID = visual->vid;\n  234 |     visual->class = glxConvertToXVisualType(config->visualType);\n  235 |     visual->bitsPerRGBValue = maxBits;\n  236 |     visual->ColormapEntries = 1 << maxBits;","lines":8,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/glxscreens.c#L229-L236"},{"ref":"Xext/glx/glxscreens.h:47","code":"   47 |     GLint redBits, greenBits, blueBits, alphaBits;      /* bits per comp */","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/glxscreens.h#L47"}]},
{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"The __GLX_ALIGN64 alignment-fixup blocks in __glXDisp_VertexAttribs{1,2,3,4}dvNV compute cmdlen as a signed 32-bit expression: e.g., '12 + __GLX_PAD((n * 8)) - 4' where n is GLsizei from client data. For large n (e.g., n = 0x10000000 for the factor-8 variant), n * 8 overflows a signed 32-bit integer (undefined behaviour in C, typically wraps). The resulting cmdlen is wrong, so memmove copies an incorrect byte count; either too few bytes are moved (doubles remain unaligned, triggering SIGBUS on strict-alignment architectures) or, if the wrap produces a large value, memory outside the packet buffer is read. Affected: __glXDisp_VertexAttribs1dvNV (n*8), __glXDisp_VertexAttribs2dvNV (n*16), __glXDisp_VertexAttribs3dvNV (n*24), __glXDisp_VertexAttribs4dvNV (n*32).","fix":"Cast n to size_t before multiplication: e.g., 'const size_t cmdlen = 12 + __GLX_PAD(((size_t)n * 8)) - 4;'. Also validate that n is non-negative and that n * element_size does not exceed the packet length.","locations":[{"ref":"Xext/glx/indirect_dispatch.c:4956-4973","code":" 4956 | void\n 4957 | __glXDisp_VertexAttribs1dvNV(GLbyte * pc)\n 4958 | {\n 4959 |     PFNGLVERTEXATTRIBS1DVNVPROC VertexAttribs1dvNV =\n 4960 |         __glGetProcAddress(\"glVertexAttribs1dvNV\");\n 4961 |     const GLsizei n = *(GLsizei *) (pc + 4);\n 4962 | \n 4963 | #ifdef __GLX_ALIGN64\n 4964 |     const GLuint cmdlen = 12 + __GLX_PAD((n * 8)) - 4;\n 4965 | \n 4966 |     if ((unsigned long) (pc) & 7) {\n 4967 |         (void) memmove(pc - 4, pc, cmdlen);\n 4968 |         pc -= 4;\n 4969 |     }\n 4970 | #endif\n 4971 | \n 4972 |     VertexAttribs1dvNV(*(GLuint *) (pc + 0), n, (const GLdouble *) (pc + 8));\n 4973 | }","lines":18,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/indirect_dispatch.c#L4956-L4973"},{"ref":"Xext/glx/indirect_dispatch.c:4995-5012","code":" 4995 | void\n 4996 | __glXDisp_VertexAttribs2dvNV(GLbyte * pc)\n 4997 | {\n 4998 |     PFNGLVERTEXATTRIBS2DVNVPROC VertexAttribs2dvNV =\n 4999 |         __glGetProcAddress(\"glVertexAttribs2dvNV\");\n 5000 |     const GLsizei n = *(GLsizei *) (pc + 4);\n 5001 | \n 5002 | #ifdef __GLX_ALIGN64\n 5003 |     const GLuint cmdlen = 12 + __GLX_PAD((n * 16)) - 4;\n 5004 | \n 5005 |     if ((unsigned long) (pc) & 7) {\n 5006 |         (void) memmove(pc - 4, pc, cmdlen);\n 5007 |         pc -= 4;\n 5008 |     }\n 5009 | #endif\n 5010 | \n 5011 |     VertexAttribs2dvNV(*(GLuint *) (pc + 0), n, (const GLdouble *) (pc + 8));\n 5012 | }","lines":18,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/indirect_dispatch.c#L4995-L5012"},{"ref":"Xext/glx/indirect_dispatch.c:5034-5051","code":" 5034 | void\n 5035 | __glXDisp_VertexAttribs3dvNV(GLbyte * pc)\n 5036 | {\n 5037 |     PFNGLVERTEXATTRIBS3DVNVPROC VertexAttribs3dvNV =\n 5038 |         __glGetProcAddress(\"glVertexAttribs3dvNV\");\n 5039 |     const GLsizei n = *(GLsizei *) (pc + 4);\n 5040 | \n 5041 | #ifdef __GLX_ALIGN64\n 5042 |     const GLuint cmdlen = 12 + __GLX_PAD((n * 24)) - 4;\n 5043 | \n 5044 |     if ((unsigned long) (pc) & 7) {\n 5045 |         (void) memmove(pc - 4, pc, cmdlen);\n 5046 |         pc -= 4;\n 5047 |     }\n 5048 | #endif\n 5049 | \n 5050 |     VertexAttribs3dvNV(*(GLuint *) (pc + 0), n, (const GLdouble *) (pc + 8));\n 5051 | }","lines":18,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/indirect_dispatch.c#L5034-L5051"},{"ref":"Xext/glx/indirect_dispatch.c:5073-5090","code":" 5073 | void\n 5074 | __glXDisp_VertexAttribs4dvNV(GLbyte * pc)\n 5075 | {\n 5076 |     PFNGLVERTEXATTRIBS4DVNVPROC VertexAttribs4dvNV =\n 5077 |         __glGetProcAddress(\"glVertexAttribs4dvNV\");\n 5078 |     const GLsizei n = *(GLsizei *) (pc + 4);\n 5079 | \n 5080 | #ifdef __GLX_ALIGN64\n 5081 |     const GLuint cmdlen = 12 + __GLX_PAD((n * 32)) - 4;\n 5082 | \n 5083 |     if ((unsigned long) (pc) & 7) {\n 5084 |         (void) memmove(pc - 4, pc, cmdlen);\n 5085 |         pc -= 4;\n 5086 |     }\n 5087 | #endif\n 5088 | \n 5089 |     VertexAttribs4dvNV(*(GLuint *) (pc + 0), n, (const GLdouble *) (pc + 8));\n 5090 | }","lines":18,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/indirect_dispatch.c#L5073-L5090"}]},
{"id":"OVF_8","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"The cmdlen calculations in the __GLX_ALIGN64 blocks for VertexAttribs*dvNV use expressions like `n * 32` where n is a client-supplied GLsizei (signed 32-bit). A large n causes signed integer overflow, yielding a small or negative cmdlen that is then passed to memmove, potentially reading or writing far outside the buffer.","fix":"Validate n against the actual packet length (req->length) before using it in the memmove size calculation, or cast to size_t before multiplying.","locations":[{"ref":"Xext/glx/indirect_dispatch_swap.c:5485","code":" 5485 |     const GLuint cmdlen = 12 + __GLX_PAD((n * 8)) - 4;","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/indirect_dispatch_swap.c#L5485"},{"ref":"Xext/glx/indirect_dispatch_swap.c:5533","code":" 5533 |     const GLuint cmdlen = 12 + __GLX_PAD((n * 16)) - 4;","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/indirect_dispatch_swap.c#L5533"},{"ref":"Xext/glx/indirect_dispatch_swap.c:5581","code":" 5581 |     const GLuint cmdlen = 12 + __GLX_PAD((n * 24)) - 4;","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/indirect_dispatch_swap.c#L5581"},{"ref":"Xext/glx/indirect_dispatch_swap.c:5629","code":" 5629 |     const GLuint cmdlen = 12 + __GLX_PAD((n * 32)) - 4;","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/indirect_dispatch_swap.c#L5629"}]},
{"id":"OVF_9","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"In __glXDisp_Map1d (render2.c:98) and __glXDisp_Map2d (render2.c:145), when __GLX_ALIGN64 is defined,\ncompsize is computed as 'order * k' or 'uorder * vorder * k' using plain C multiplication without\noverflow protection. Although order/uorder/vorder are client-supplied, the request-size validators\n(__glXMap1dReqSize/__glXMap2dReqSize) use safe_mul and would reject oversized values before the\ndispatch handlers are called. However the dispatch functions themselves recompute this product\nunsafely and pass 'compsize * 8' to memmove (__GLX_MEM_COPY). If the validators are bypassed or\ncalled from a different path, or if the __GLX_ALIGN64 branch is taken with large values, this can\nproduce an integer overflow leading to a heap/stack corruption via an undersized memmove.","fix":"Use safe_mul for compsize computation in these branches, and return early without the memmove if compsize overflows.","locations":[{"ref":"Xext/glx/render2.c:94-99","code":"   94 |     if (order < 0 || k < 0) {\n   95 |         compsize = 0;\n   96 |     }\n   97 |     else {\n   98 |         compsize = order * k;\n   99 |     }","lines":6,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/render2.c#L94-L99"},{"ref":"Xext/glx/render2.c:141-146","code":"  141 |     if (vorder < 0 || uorder < 0 || k < 0) {\n  142 |         compsize = 0;\n  143 |     }\n  144 |     else {\n  145 |         compsize = uorder * vorder * k;\n  146 |     }","lines":6,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/render2.c#L141-L146"}]},
{"id":"OVF_10","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"In __glXImageSize() (rensize.c), after `rowSize = safe_mul(groupsPerRow, groupSize)` is checked for overflow, the padding adjustment `rowSize += alignment - padding` is performed without an overflow check. For alignment=8 and padding=1, the adjustment adds 7. If rowSize was already INT_MAX-6, the result silently overflows to a negative value. This negative rowSize then flows into safe_mul(h, rowSize) and safe_mul(..., imageSize) which will interpret it as an error sentinel -1, but only if the product itself triggers the safe check - a crafted rowSize value close to INT_MAX may not be caught.","fix":"After the safe_mul check, use `if (padding && (rowSize > INT_MAX - (alignment - padding))) return -1; rowSize += alignment - padding;` - or call safe_add(rowSize, alignment - padding) and check the result.","locations":[{"ref":"Xext/glx/rensize.c:317-322","code":"  317 |         if ((rowSize = safe_mul(groupsPerRow, groupSize)) < 0)\n  318 |             return -1;\n  319 |         padding = (rowSize % alignment);\n  320 |         if (padding) {\n  321 |             rowSize += alignment - padding;\n  322 |         }","lines":6,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/rensize.c#L317-L322"}]},
{"id":"OVF_11","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"In _XkbFilterPointerBtn the pointer-button number for XkbSA_LockPtrBtn/XkbSA_PtrBtn comes straight from the keymap action (`pAction->btn.button`, a full CARD8, 0..255) and is only replaced by mk_dflt_btn when it equals XkbSA_UseDfltButton. It is then used as a shift count `1 << button` against `xkbi->lockedPtrButtons`, which is a CARD8 (see include/xkbsrv.h:120). Two problems: (a) for button >= 31 the expression `1 << button` is undefined behavior (shift count >= width of int); (b) for button in 8..255 the resulting bit is outside the 8-bit `lockedPtrButtons`, so the lock bit is never actually stored. Consequently a client that installs a LockPtrBtn action with a button >= 8 (via XkbSetMap) causes a fake ButtonPress to be posted on the initial press, but on release the guard `(xkbi->lockedPtrButtons & (1 << button)) == 0` is true so the matching ButtonRelease is skipped, leaving the pointer button permanently stuck down. Keymap actions are client-controllable, so this is reachable from untrusted requests.","fix":"Validate/clamp the button number before using it as a bit index, e.g. reject or ignore the action when `button < 1 || button > 7` (the number of buttons representable in the CARD8 `lockedPtrButtons`), and always use an unsigned shift `(1u << button)`. Alternatively widen `lockedPtrButtons` and bound `button` to the supported range.","locations":[{"ref":"Xext/xkeyboard/xkbActions.c:568-610","code":"  568 | static int\n  569 | _XkbFilterPointerBtn(XkbSrvInfoPtr xkbi,\n  570 |                      XkbFilterPtr filter, unsigned keycode, XkbAction *pAction)\n  571 | {\n  572 |     if (filter->keycode == 0) { /* initial press */\n  573 |         int button = pAction->btn.button;\n  574 | \n  575 |         if (button == XkbSA_UseDfltButton)\n  576 |             button = xkbi->desc->ctrls->mk_dflt_btn;\n  577 | \n  578 |         filter->keycode = keycode;\n  579 |         filter->active = 1;\n  580 |         filter->filterOthers = 0;\n  581 |         filter->priv = 0;\n  582 |         filter->filter = _XkbFilterPointerBtn;\n  583 |         filter->upAction = *pAction;\n  584 |         filter->upAction.btn.button = button;\n  585 |         switch (pAction->type) {\n  586 |         case XkbSA_LockPtrBtn:\n  587 |             if (((xkbi->lockedPtrButtons & (1 << button)) == 0) &&\n  588 |                 ((pAction->btn.flags & XkbSA_LockNoLock) == 0)) {\n  589 |                 xkbi->lockedPtrButtons |= (1 << button);\n  590 |                 AccessXCancelRepeatKey(xkbi, keycode);\n  591 |                 XkbFakeDeviceButton(xkbi->device, 1, button);\n  592 |                 filter->upAction.type = XkbSA_NoAction;\n  593 |             }\n  594 |             break;\n  595 |         case XkbSA_PtrBtn:\n  596 |         {\n  597 |             register int i, nClicks;\n  598 | \n  599 |             AccessXCancelRepeatKey(xkbi, keycode);\n  600 |             if (pAction->btn.count > 0) {\n  601 |                 nClicks = pAction->btn.count;\n  602 |                 for (i = 0; i < nClicks; i++) {\n  603 |                     XkbFakeDeviceButton(xkbi->device, 1, button);\n  604 |                     XkbFakeDeviceButton(xkbi->device, 0, button);\n  605 |                 }\n  606 |                 filter->upAction.type = XkbSA_NoAction;\n  607 |             }\n  608 |             else\n  609 |                 XkbFakeDeviceButton(xkbi->device, 1, button);\n  610 |         }","lines":43,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/xkeyboard/xkbActions.c#L568-L610"},{"ref":"Xext/xkeyboard/xkbActions.c:652-667","code":"  652 |     else if (filter->keycode == keycode) {\n  653 |         int button = filter->upAction.btn.button;\n  654 | \n  655 |         switch (filter->upAction.type) {\n  656 |         case XkbSA_LockPtrBtn:\n  657 |             if (((filter->upAction.btn.flags & XkbSA_LockNoUnlock) != 0) ||\n  658 |                 ((xkbi->lockedPtrButtons & (1 << button)) == 0)) {\n  659 |                 break;\n  660 |             }\n  661 |             xkbi->lockedPtrButtons &= ~(1 << button);\n  662 | \n  663 |             if (InputDevIsMaster(xkbi->device)) {\n  664 |                 XkbMergeLockedPtrBtns(xkbi->device);\n  665 |                 /* One SD still has lock set, don't post event */\n  666 |                 if ((xkbi->lockedPtrButtons & (1 << button)) != 0)\n  667 |                     break;","lines":16,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/xkeyboard/xkbActions.c#L652-L667"}]},
{"id":"OVF_12","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"very_easy","description":"Off-by-one bounds check on the client-controlled render op. `composite_op_info[]` in glamor_program.c has 13 entries (indices PictOpClear=0 .. PictOpAdd=12). The guard uses `op > ARRAY_SIZE(...)` (i.e. `op > 13`), which lets `op == 13` (PictOpSaturate) pass. `op` flows unchecked from RenderCompositeGlyphs through glamor_composite_glyphs() -> glamor_setup_program_render() -> glamor_use_program_render() -> use_solid/use_source_* -> glamor_set_blend(), which reads `composite_op_info[op]` at line 502. With op==13 that is a one-element out-of-bounds read of the static array, and the garbage source_blend/dest_blend GLenums are then handed to glBlendFunc(). The equivalent checks in glamor_render.c (lines 524 and 1751) correctly use `>=`.","fix":"Use `>=` like the other two copies of this check:\n```c\n    if (op >= ARRAY_SIZE(composite_op_info))\n        return NULL;\n```","locations":[{"ref":"glamor/glamor_program.c:657","code":"  657 |     if (op > ARRAY_SIZE(composite_op_info))","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/glamor/glamor_program.c#L657"},{"ref":"glamor/glamor_program.c:504","code":"  504 |     op_info = &composite_op_info[op];","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/glamor/glamor_program.c#L504"},{"ref":"glamor/glamor_program.c:464-478","code":"  464 | static struct blendinfo composite_op_info[] = {\n  465 |     [PictOpClear] = {0, 0, GL_ZERO, GL_ZERO},\n  466 |     [PictOpSrc] = {0, 0, GL_ONE, GL_ZERO},\n  467 |     [PictOpDst] = {0, 0, GL_ZERO, GL_ONE},\n  468 |     [PictOpOver] = {0, 1, GL_ONE, GL_ONE_MINUS_SRC_ALPHA},\n  469 |     [PictOpOverReverse] = {1, 0, GL_ONE_MINUS_DST_ALPHA, GL_ONE},\n  470 |     [PictOpIn] = {1, 0, GL_DST_ALPHA, GL_ZERO},\n  471 |     [PictOpInReverse] = {0, 1, GL_ZERO, GL_SRC_ALPHA},\n  472 |     [PictOpOut] = {1, 0, GL_ONE_MINUS_DST_ALPHA, GL_ZERO},\n  473 |     [PictOpOutReverse] = {0, 1, GL_ZERO, GL_ONE_MINUS_SRC_ALPHA},\n  474 |     [PictOpAtop] = {1, 1, GL_DST_ALPHA, GL_ONE_MINUS_SRC_ALPHA},\n  475 |     [PictOpAtopReverse] = {1, 1, GL_ONE_MINUS_DST_ALPHA, GL_SRC_ALPHA},\n  476 |     [PictOpXor] = {1, 1, GL_ONE_MINUS_DST_ALPHA, GL_ONE_MINUS_SRC_ALPHA},\n  477 |     [PictOpAdd] = {0, 0, GL_ONE, GL_ONE},\n  478 | };","lines":15,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/glamor/glamor_program.c#L464-L478"}]},
{"id":"OVF_13","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"Potential stack buffer overflow in KdStoreColors via the client StoreColors request. `expanddefs` is a fixed `xColorItem[KD_MAX_PSEUDO_SIZE]` (256). When the installed colormap's visual is DirectColor/TrueColor, `fbExpandDirectColors(pCmap, ndef, pdefs, expanddefs)` (miExpandDirectColors) emits up to (channel-count) entries per input def and writes them into `expanddefs` with no size limit. `ndef` is the client-controlled number of xColorItems and each def with DoRed|DoGreen|DoBlue on an 8-bit Direct/TrueColor visual expands to ~128 entries, so a handful of items overflows the 256-entry stack array. The depth<=KD_MAX_PSEUDO_DEPTH guard does not bound the expanded count; it is only unreachable in practice because default kdrive/fb visual sets do not expose a Direct/TrueColor visual at depth<=8, so a driver that advertises one makes this client-triggerable.","fix":"Bound the expansion, e.g. allocate `expanddefs` dynamically sized to `fbExpandDirectColors`'s worst-case output, or clamp/reject when the expanded count would exceed KD_MAX_PSEUDO_SIZE before writing, mirroring how other DDXes size the buffer to the colormap's real capacity.","locations":[{"ref":"hw/kdrive/src/kcmap.c:211-236","code":"  211 |     xColorItem expanddefs[KD_MAX_PSEUDO_SIZE];\n  212 | \n  213 |     if (pCmap != pScreenPriv->pInstalledmap)\n  214 |         return;\n  215 | \n  216 |     if (!pScreenPriv->card->cfuncs->putColors)\n  217 |         return;\n  218 | \n  219 |     if (pScreenPriv->screen->fb.depth > KD_MAX_PSEUDO_DEPTH)\n  220 |         return;\n  221 | \n  222 |     if (!pScreenPriv->enabled)\n  223 |         return;\n  224 | \n  225 |     /* Check for DirectColor or TrueColor being simulated on a PseudoColor device. */\n  226 |     pVisual = pCmap->pVisual;\n  227 |     if ((pVisual->class | DynamicClass) == DirectColor) {\n  228 |         /*\n  229 |          * Expand DirectColor or TrueColor color values into a PseudoColor\n  230 |          * format.  Defer to the Color Framebuffer (CFB) code to do that.\n  231 |          */\n  232 |         ndef = fbExpandDirectColors(pCmap, ndef, pdefs, expanddefs);\n  233 |         pdefs = expanddefs;\n  234 |     }\n  235 | \n  236 |     (*pScreenPriv->card->cfuncs->putColors) (pCmap->pScreen, ndef, pdefs);","lines":26,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/kdrive/src/kcmap.c#L211-L236"}]},
{"id":"OVF_14","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"RRVerticalRefresh() computes `mode->hTotal * mode->vTotal` where both fields are CARD16. They are promoted to (signed) int and multiplied; with client-controlled mode values (a client can supply arbitrary hTotal/vTotal via ProcRRCreateMode) the product 65535*65535 exceeds INT_MAX and triggers signed-integer-overflow undefined behavior before the result is stored into the CARD32 `dots`. The neighboring RROldModeAdd() already shows the correct pattern of casting each factor to CARD32 first.","fix":"before:\n```\n    CARD32 dots = mode->hTotal * mode->vTotal;\n```\nafter:\n```\n    CARD32 dots = (CARD32) mode->hTotal * (CARD32) mode->vTotal;\n```","locations":[{"ref":"Xext/randr/randr.c:710-722","code":"  710 | CARD16\n  711 | RRVerticalRefresh(xRRModeInfo * mode)\n  712 | {\n  713 |     CARD32 refresh;\n  714 |     CARD32 dots = mode->hTotal * mode->vTotal;\n  715 | \n  716 |     if (!dots)\n  717 |         return 0;\n  718 |     refresh = (mode->dotClock + dots / 2) / dots;\n  719 |     if (refresh > 0xffff)\n  720 |         refresh = 0xffff;\n  721 |     return (CARD16) refresh;\n  722 | }","lines":13,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/randr/randr.c#L710-L722"}]},
{"id":"OVF_15","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"In ChangeKbdFeedback, when a client sends X_ChangeFeedbackControl for a KbdFeedbackClass with `mask` containing DvAutoRepeatMode but NOT DvKey, `key` stays at DO_ALL (-1). For `auto_repeat_mode == AutoRepeatModeDefault`, `inx = key >> 3 = -1` and `kmask = 1 << (key & 7) = 128`. The `if (key == DO_ALL)` branch only sets `kctrl.autoRepeat`, but the recompute statement on lines 169-171 executes unconditionally, reading and writing `kctrl.autoRepeats[-1]` and `defaultKeyboardControl.autoRepeats[-1]`. This is an out-of-bounds (index -1) array access reachable directly from an untrusted client request — undefined behavior (UBSan/ASan-flaggable) even though the touched byte happens to fall inside the adjacent `autoRepeat` field of KeybdCtrl and is practically benign. The recompute must be inside the `else` (as the original 2012 code intended); the current form also leaves a redundant `&= ~kmask` dead statement on line 168.","fix":"Move the recompute back inside the `else` branch so it never runs for DO_ALL:\n\nBefore:\n```c\n        else if (t == AutoRepeatModeDefault) {\n            if (key == DO_ALL)\n                kctrl.autoRepeat = defaultKeyboardControl.autoRepeat;\n            else\n                kctrl.autoRepeats[inx] &= ~kmask;\n            kctrl.autoRepeats[inx] =\n                (kctrl.autoRepeats[inx] & ~kmask) |\n                (defaultKeyboardControl.autoRepeats[inx] & kmask);\n        }\n```\n\nAfter:\n```c\n        else if (t == AutoRepeatModeDefault) {\n            if (key == DO_ALL)\n                kctrl.autoRepeat = defaultKeyboardControl.autoRepeat;\n            else\n                kctrl.autoRepeats[inx] =\n                    (kctrl.autoRepeats[inx] & ~kmask) |\n                    (defaultKeyboardControl.autoRepeats[inx] & kmask);\n        }\n```","locations":[{"ref":"Xext/xinput/chgfctl.c:164-172","code":"  164 |         else if (t == AutoRepeatModeDefault) {\n  165 |             if (key == DO_ALL)\n  166 |                 kctrl.autoRepeat = defaultKeyboardControl.autoRepeat;\n  167 |             else\n  168 |                 kctrl.autoRepeats[inx] &= ~kmask;\n  169 |             kctrl.autoRepeats[inx] =\n  170 |                 (kctrl.autoRepeats[inx] & ~kmask) |\n  171 |                 (defaultKeyboardControl.autoRepeats[inx] & kmask);\n  172 |         }","lines":9,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/xinput/chgfctl.c#L164-L172"}]},
{"id":"OVF_16","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"XkbChangeTypesOfKey() validates a client-selectable key-type index with `if (newTypes[i] > xkb->map->num_types) return BadMatch;` and then dereferences `&xkb->map->types[newTypes[i]]`. Valid indices are 0..num_types-1, so `newTypes[i] == num_types` passes the check yet indexes one element past the populated types, reading uninitialized/out-of-bounds `pNewType->num_levels`. The analogous bound check in XkbResizeKeyType (line 275) correctly uses `>=`. Reachable from ProcXkbSetMap paths; longstanding upstream and partially guarded by earlier validation, hence low confidence of a real OOB, but the check is off by one.","fix":"before:\n```c\n        if (newTypes[i] > xkb->map->num_types)\n            return BadMatch;\n```\nafter:\n```c\n        if (newTypes[i] >= xkb->map->num_types)\n            return BadMatch;\n```","locations":[{"ref":"Xext/xkeyboard/XKBMisc.c:560-562","code":"  560 |         if (newTypes[i] > xkb->map->num_types)\n  561 |             return BadMatch;\n  562 |         pNewType = &xkb->map->types[newTypes[i]];","lines":3,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/xkeyboard/XKBMisc.c#L560-L562"}]},
{"id":"OVF_17","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"CheckLine() guards word assignment with `if (nread > remap->num_remap) { ...continue; }` before `tmp.name[remap->remap[nread].word] = tok;`. Valid indices into remap->remap[] are 0..num_remap-1, so when a data line has exactly one more word than the mapping declares, nread == num_remap passes the `>` check and reads remap->remap[num_remap]. If num_remap == MAX_WORDS (all 9 components mapped) this reads past the fixed-size remap[MAX_WORDS] array and then writes tmp.name[<garbage word>], a potential OOB write; for smaller num_remap it reads a zeroed entry (word==MODEL) and silently clobbers the MODEL field. Input comes from the on-disk XKB rules file (trusted), so impact is low, but the bound is off by one.","fix":"before:\n```c\n        if (nread > remap->num_remap) {\n```\nafter:\n```c\n        if (nread >= remap->num_remap) {\n```","locations":[{"ref":"Xext/xkeyboard/maprules.c:437-442","code":"  437 |         if (nread > remap->num_remap) {\n  438 |             DebugF(\"Too many words on a line\\n\");\n  439 |             DebugF(\"Extra word \\\"%s\\\" ignored\\n\", tok);\n  440 |             continue;\n  441 |         }\n  442 |         tmp.name[remap->remap[nread].word] = tok;","lines":6,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/xkeyboard/maprules.c#L437-L442"}]},
{"id":"OVF_18","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"XkbModMaskText() builds its result in a fixed 64-byte stack buffer `buf[64]`. The all-bits-set case (mask & 0xff) == 0xff is short-circuited to \"all\"/\"0xff\", but a mask with 7 of the 8 real-modifier bits set is not, and for format==XkbCFile each modifier expands to \"<name>Mask\" joined with '|'. For example bits {Shift,Lock,Control,Mod1,Mod2,Mod3,Mod4} produce \"ShiftMask|LockMask|ControlMask|Mod1Mask|Mod2Mask|Mod3Mask|Mod4Mask\" = 66 chars + NUL = 67 bytes, overflowing buf[64] on the stack (the strcpy/strcat writes are unbounded). Note: the XkbCFile format is currently not passed by any in-tree caller (grep finds no external XkbCFile users), so this path is effectively dead today, but it is a latent stack buffer overflow that becomes exploitable the moment C-file output is enabled.","fix":"Size the buffer for the worst case (8 modifiers x \"<name>Mask\" plus separators, ~80 bytes) and/or build the string with bounded appends (snprintf into a running offset with remaining-size tracking), the same way XkbControlsMaskText()/XkbIMWhichStateMaskText() pre-compute the required length before writing.","locations":[{"ref":"Xext/xkeyboard/xkbtext.c:268-310","code":"  268 | char *\n  269 | XkbModMaskText(unsigned mask, unsigned format)\n  270 | {\n  271 |     register int i, bit;\n  272 |     char buf[64] = { 0 };\n  273 |     char *rtrn;\n  274 | \n  275 |     if ((mask & 0xff) == 0xff) {\n  276 |         if (format == XkbCFile)\n  277 |             strcpy(buf, \"0xff\");\n  278 |         else\n  279 |             strcpy(buf, \"all\");\n  280 |     }\n  281 |     else if ((mask & 0xff) == 0) {\n  282 |         if (format == XkbCFile)\n  283 |             strcpy(buf, \"0\");\n  284 |         else\n  285 |             strcpy(buf, \"none\");\n  286 |     }\n  287 |     else {\n  288 |         char *str = buf;\n  289 | \n  290 |         buf[0] = '\\0';\n  291 |         for (i = 0, bit = 1; i < XkbNumModifiers; i++, bit <<= 1) {\n  292 |             if (mask & bit) {\n  293 |                 if (str != buf) {\n  294 |                     if (format == XkbCFile)\n  295 |                         *str++ = '|';\n  296 |                     else\n  297 |                         *str++ = '+';\n  298 |                 }\n  299 |                 strcpy(str, modNames[i]);\n  300 |                 str = &str[strlen(str)];\n  301 |                 if (format == XkbCFile) {\n  302 |                     strcpy(str, \"Mask\");\n  303 |                     str += 4;\n  304 |                 }\n  305 |             }\n  306 |         }\n  307 |     }\n  308 |     rtrn = tbGetBufferString(buf);\n  309 |     return rtrn;\n  310 | }","lines":43,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/xkeyboard/xkbtext.c#L268-L310"}]},
{"id":"OVF_19","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"XkmReadTOC caps the number of TOC entries it actually reads into the fixed-size `toc[MAX_TOC]` array to `max_toc` (16) via a *local* variable `size_toc`, but it never writes that cap back to `file_info->num_toc`. XkmReadFile then iterates `for (i = 0; i < fileInfo.num_toc; i++)` and dereferences `toc[i]` (in `fseek(file, toc[i].offset,...)`, the field comparisons, and `1 << toc[i].type`). `num_toc` is an untrusted CARD8 read from the file and can be up to 255, so for i >= 16 the code performs out-of-bounds reads of adjacent stack memory beyond the 16-entry `toc` array. A malicious/corrupt .xkm file therefore causes a stack OOB read (potential crash / seeking to garbage offsets).","fix":"Clamp the count used by XkmReadFile to what was actually read. Simplest: in XkmReadTOC write the cap back, `file_info->num_toc = size_toc;` after `size_toc = max_toc;`, or change the XkmReadFile loop to `for (i = 0; i < fileInfo.num_toc && i < MAX_TOC; i++)`.","locations":[{"ref":"Xext/xkeyboard/xkmread.c:1203-1213","code":" 1203 |     size_toc = file_info->num_toc;\n 1204 |     if (size_toc > max_toc) {\n 1205 |         DebugF(\"Warning! Too many TOC entries; last %d ignored\\n\",\n 1206 |                size_toc - max_toc);\n 1207 |         size_toc = max_toc;\n 1208 |     }\n 1209 |     for (i = 0; i < size_toc; i++) {\n 1210 |         if (fread(&toc[i], SIZEOF(xkmSectionInfo), 1, file) != 1)\n 1211 |             return 0;\n 1212 |     }\n 1213 |     return 1;","lines":11,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/xkeyboard/xkmread.c#L1203-L1213"},{"ref":"Xext/xkeyboard/xkmread.c:1237-1286","code":" 1237 |     for (i = 0; i < fileInfo.num_toc; i++) {\n 1238 |         fseek(file, toc[i].offset, SEEK_SET);\n 1239 |         tmp = fread(&tmpTOC, SIZEOF(xkmSectionInfo), 1, file);\n 1240 |         nRead = tmp * SIZEOF(xkmSectionInfo);\n 1241 |         if ((tmpTOC.type != toc[i].type) || (tmpTOC.format != toc[i].format) ||\n 1242 |             (tmpTOC.size != toc[i].size) || (tmpTOC.offset != toc[i].offset)) {\n 1243 |             return which;\n 1244 |         }\n 1245 |         if ((which & (1 << tmpTOC.type)) == 0) {\n 1246 |             continue;\n 1247 |         }\n 1248 |         switch (tmpTOC.type) {\n 1249 |         case XkmVirtualModsIndex:\n 1250 |             tmp = ReadXkmVirtualMods(file, *xkb, NULL);\n 1251 |             break;\n 1252 |         case XkmTypesIndex:\n 1253 |             tmp = ReadXkmKeyTypes(file, *xkb, NULL);\n 1254 |             break;\n 1255 |         case XkmCompatMapIndex:\n 1256 |             tmp = ReadXkmCompatMap(file, *xkb, NULL);\n 1257 |             break;\n 1258 |         case XkmKeyNamesIndex:\n 1259 |             tmp = ReadXkmKeycodes(file, *xkb, NULL);\n 1260 |             break;\n 1261 |         case XkmIndicatorsIndex:\n 1262 |             tmp = ReadXkmIndicators(file, *xkb, NULL);\n 1263 |             break;\n 1264 |         case XkmSymbolsIndex:\n 1265 |             tmp = ReadXkmSymbols(file, *xkb);\n 1266 |             break;\n 1267 |         case XkmGeometryIndex:\n 1268 |             tmp = ReadXkmGeometry(file, *xkb);\n 1269 |             break;\n 1270 |         default:\n 1271 |             _XkbLibError(_XkbErrBadImplementation,\n 1272 |                          XkbConfigText(tmpTOC.type, XkbMessage), 0);\n 1273 |             tmp = 0;\n 1274 |             break;\n 1275 |         }\n 1276 |         if (tmp > 0) {\n 1277 |             nRead += tmp;\n 1278 |             which &= ~(1 << toc[i].type);\n 1279 |             (*xkb)->defined |= (1 << toc[i].type);\n 1280 |         }\n 1281 |         if (nRead != tmpTOC.size) {\n 1282 |             _XkbLibError(_XkbErrBadLength,\n 1283 |                          XkbConfigText(tmpTOC.type, XkbMessage),\n 1284 |                          nRead - tmpTOC.size);\n 1285 |         }\n 1286 |     }","lines":50,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/xkeyboard/xkmread.c#L1237-L1286"}]},
{"id":"OVF_20","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"get_prop_string_array() handles a non-NULL but empty HAL strlist incorrectly. If props is non-NULL and props[0]==NULL, then len==0 and i==0, so `ret = calloc(len + i, 1)` becomes `calloc(0, 1)`. The value-copy loop runs zero times, leaving `str == ret`, and then `*(str - 1) = '\\0'` writes one byte before the buffer (heap underflow), or dereferences (NULL-1) if calloc(0) returned NULL. Reachable when HAL reports an empty string-list property.","fix":"Guard the empty case, e.g. `if (i == 0) { libhal_free_string_array(props); return NULL; }` before the calloc, or size the buffer as `calloc(len + i + 1, 1)` and only write the terminator when at least one element was copied.","locations":[{"ref":"config/hal.c:101-126","code":"  101 |     props = libhal_device_get_property_strlist(hal_ctx, udi, prop, NULL);\n  102 |     if (props) {\n  103 |         for (i = 0; props[i]; i++)\n  104 |             len += strlen(props[i]);\n  105 | \n  106 |         ret = calloc(len + i, sizeof(char));    /* i - 1 commas, 1 NULL */\n  107 |         if (!ret) {\n  108 |             libhal_free_string_array(props);\n  109 |             return NULL;\n  110 |         }\n  111 | \n  112 |         str = ret;\n  113 |         for (i = 0; props[i]; i++) {\n  114 |             strcpy(str, props[i]);\n  115 |             str += strlen(props[i]);\n  116 |             *str++ = ',';\n  117 |         }\n  118 |         *(str - 1) = '\\0';\n  119 | \n  120 |         libhal_free_string_array(props);\n  121 |     }\n  122 |     else {\n  123 |         return NULL;\n  124 |     }\n  125 | \n  126 |     return ret;","lines":26,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/config/hal.c#L101-L126"}]},
{"id":"OVF_21","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"RemoveFontWakeup() shifts array elements with `for (j = i; j < num_slept_fpes; j++) slept_fpes[j] = slept_fpes[j + 1];`. When j reaches num_slept_fpes-1 it reads slept_fpes[num_slept_fpes], one past the last valid entry; if num_slept_fpes == size_slept_fpes this reads one FontPathElementPtr beyond the allocated buffer (out-of-bounds read). The read value is written into an index that is then discarded by the decrement, so the only defect is the OOB read, but it is a genuine buffer over-read.","fix":"Stop the shift one element earlier:\n```c\n            for (int j = i; j < num_slept_fpes - 1; j++) {\n                slept_fpes[j] = slept_fpes[j + 1];\n            }\n```","locations":[{"ref":"dix/dixfonts.c:246-248","code":"  246 |             for (int j = i; j < num_slept_fpes; j++) {\n  247 |                 slept_fpes[j] = slept_fpes[j + 1];\n  248 |             }","lines":3,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/dix/dixfonts.c#L246-L248"}]},
{"id":"OVF_22","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"In ProcGetProperty the returned length is computed as `len = MIN(n - ind, 4 * p.longLength)` where p.longLength is a CARD32 (unsigned int). The multiplication `4 * p.longLength` is performed in 32-bit arithmetic and can wrap for large longLength (e.g. 0x40000000 -> 0). The classic implementation cast to unsigned long first. The result is only ever an under-return (len is still capped by MIN against n-ind, so no OOB), but a client requesting a large longLength gets truncated/zero property data instead of the correct amount.","fix":"Cast to unsigned long before multiplying:\n```c\nlen = MIN(n - ind, 4 * (unsigned long) p.longLength);\n```","locations":[{"ref":"dix/property.c:619","code":"  619 |     len = MIN(n - ind, 4 * p.longLength);","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/dix/property.c#L619"}]},
{"id":"OVF_23","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"GetDrawableBytes() computes numberOfPixels = drawable->width * drawable->height and bytes = numberOfPixels * bytesPerPixel using int arithmetic, then returns unsigned long. For large drawables (e.g. width*height*bpp exceeding INT_MAX) this overflows int, producing a wrong/negative size that is reported to clients via the X-Resource extension. Not a memory-safety issue, but incorrect accounting.","fix":"Perform the multiplications in unsigned long (or uint64_t):\n```c\nunsigned long bytesPerPixel = drawable->bitsPerPixel >> 3;\nunsigned long numberOfPixels = (unsigned long)drawable->width * drawable->height;\nbytes = numberOfPixels * bytesPerPixel;\n```","locations":[{"ref":"dix/resource.c:240-253","code":"  240 | static unsigned long\n  241 | GetDrawableBytes(DrawablePtr drawable)\n  242 | {\n  243 |     int bytes = 0;\n  244 | \n  245 |     if (drawable)\n  246 |     {\n  247 |         int bytesPerPixel = drawable->bitsPerPixel >> 3;\n  248 |         int numberOfPixels = drawable->width * drawable->height;\n  249 |         bytes = numberOfPixels * bytesPerPixel;\n  250 |     }\n  251 | \n  252 |     return bytes;\n  253 | }","lines":14,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/dix/resource.c#L240-L253"}]},
{"id":"OVF_24","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"In exaCreatePixmap_classic(), `pExaPixmap->fb_size = pExaPixmap->fb_pitch * h;` multiplies two `int` values before assigning to the `unsigned int` fb_size. For an accepted pixmap (fb_pitch up to 131071 after the check below, h up to 32767) the product reaches ~4.29e9, which overflows signed int (undefined behavior) even though the final unsigned result happens to stay under 2^32. The multiply also runs before the fb_pitch>131071 rejection, so oversized pitches are multiplied too. Client-reachable via CreatePixmap with large dimensions.","fix":"Do the multiplication in an unsigned/size_t type:\n```c\npExaPixmap->fb_size = (unsigned long) pExaPixmap->fb_pitch * h;\n```","locations":[{"ref":"exa/exa_classic.c:97","code":"   97 |     pExaPixmap->fb_size = pExaPixmap->fb_pitch * h;","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/exa/exa_classic.c#L97"}]},
{"id":"OVF_25","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"fbdevEnable() fills the hardware colormap for DIRECTCOLOR visuals by looping i up to max(1<<red.length, 1<<green.length, 1<<blue.length). priv->red/green/blue are __u16[256], so any channel with length > 8 (e.g. 10-bit framebuffers) makes i exceed 255 and writes out of bounds. Additionally, if any channel length is 0, `(1 << length) - 1 == 0` causes a division by zero. Both are driven by kernel-reported framebuffer capabilities.","fix":"Cap the loop bound to the array size and guard against zero-length channels, e.g. clamp `1 << var.*.length` to 256 and skip/compute masks defensively when a channel length is 0.","locations":[{"ref":"hw/kdrive/fbdev/fbdev.c:1043-1056","code":" 1043 |     if (priv->fix.visual == FB_VISUAL_DIRECTCOLOR) {\n 1044 |         int i;\n 1045 | \n 1046 |         for (i = 0;\n 1047 |              i < (1 << priv->var.red.length) ||\n 1048 |              i < (1 << priv->var.green.length) ||\n 1049 |              i < (1 << priv->var.blue.length); i++) {\n 1050 |             priv->red[i] = i * 65535 / ((1 << priv->var.red.length) - 1);\n 1051 |             priv->green[i] = i * 65535 / ((1 << priv->var.green.length) - 1);\n 1052 |             priv->blue[i] = i * 65535 / ((1 << priv->var.blue.length) - 1);\n 1053 |         }\n 1054 | \n 1055 |         fbdevUpdateFbColormap(priv, 0, i);\n 1056 |     }","lines":14,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/kdrive/fbdev/fbdev.c#L1043-L1056"}]},
{"id":"OVF_26","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"Unvalidated screen depth is used as an array index. KdParseScreen sets `screen->fb.depth = atoi(save)` with no range check, and KdSetPixmapFormats then indexes `depthToBpp[screen->fb.depth]` (array of 33 bytes) for read and write. A `-screen ...x999` (or negative) argument causes an out-of-bounds read/write of the stack array `depthToBpp[33]`. Command-line controlled rather than client controlled, so impact is limited, but it is still an OOB access with no diagnostic.","fix":"Validate the parsed depth (e.g. `1 <= depth && depth <= 32`) in KdParseScreen and reject/clamp otherwise, or guard the `depthToBpp[screen->fb.depth]` accesses with a range check in KdSetPixmapFormats.","locations":[{"ref":"hw/kdrive/src/kdrive.c:416-426","code":"  416 |     arg = KdParseFindNext(arg, \"x/,\", save, &delim);\n  417 |     if (save[0]) {\n  418 |         screen->fb.depth = atoi(save);\n  419 |         if (delim == '/') {\n  420 |             arg = KdParseFindNext(arg, \"x,\", save, &delim);\n  421 |             if (save[0])\n  422 |                 screen->fb.bitsPerPixel = atoi(save);\n  423 |         }\n  424 |         else\n  425 |             screen->fb.bitsPerPixel = 0;\n  426 |     }","lines":11,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/kdrive/src/kdrive.c#L416-L426"},{"ref":"hw/kdrive/src/kdrive.c:1036-1041","code":" 1036 |             bpp = screen->fb.bitsPerPixel;\n 1037 |             if (bpp == 24)\n 1038 |                 bpp = 32;\n 1039 |             if (!depthToBpp[screen->fb.depth])\n 1040 |                 depthToBpp[screen->fb.depth] = bpp;\n 1041 |             else if (depthToBpp[screen->fb.depth] != bpp)","lines":6,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/kdrive/src/kdrive.c#L1036-L1041"}]},
{"id":"OVF_27","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"xchomp() reads `line[len - 1]` before verifying `len > 0`; the `&& len > 0` guard comes after the out-of-bounds access. For an empty string (len == 0, possible from fgetln or a trailing line without newline) this is a one-byte out-of-bounds read of `line[-1]`. Reached while parsing driver-provided .ids files under PCI_TXT_IDS_PATH.","fix":"Check the length first:\n```c\n    len = strlen(line);\n    if (len > 0 && line[len - 1] == '\\n')\n        line[len - 1] = '\\0';\n```","locations":[{"ref":"hw/xfree86/common/xf86pciBus.c:1278-1280","code":" 1278 |     len = strlen(line);\n 1279 |     if (line[len - 1] == '\\n' && len > 0) {\n 1280 |         line[len - 1] = '\\0';","lines":3,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/common/xf86pciBus.c#L1278-L1280"}]},
{"id":"OVF_28","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"The .ids suffix test `strncmp(&(direntry->d_name[len - 4]), \".ids\", 4)` indexes `d_name[len - 4]` where `len = strlen(d_name)`. For any directory entry whose name is shorter than 4 characters (e.g. a file named \"a\" or \"ab\", which is not filtered by the leading-'.' check), `len - 4` underflows and reads before the start of the buffer.","fix":"Require a minimum length before the suffix comparison, e.g. `if (len >= 4 && strncmp(&direntry->d_name[len - 4], \".ids\", 4) == 0)`.","locations":[{"ref":"hw/xfree86/common/xf86pciBus.c:1317-1319","code":" 1317 |         len = strlen(direntry->d_name);\n 1318 |         /* A tiny bit of sanity checking. We should probably do better */\n 1319 |         if (strncmp(&(direntry->d_name[len - 4]), \".ids\", 4) == 0) {","lines":3,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/common/xf86pciBus.c#L1317-L1319"}]},
{"id":"OVF_29","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"drmmode_output_create_resources() searches the enum list for a value matching the current property value, then unconditionally passes `&p->atoms[j + 1]` to RRChangeOutputProperty(). p->atoms has only num_atoms = count_enums + 1 entries (indices 0..count_enums). If no enum value matches (loop falls through with j == count_enums), `&p->atoms[j+1]` == `&p->atoms[count_enums+1]`, one element past the array, and RRChangeOutputProperty reads that out-of-bounds atom. The sibling function drmmode_output_update_properties() guards this exact case with `if (k < p->mode_prop->count_enums)`, but create_resources does not, despite the misleading comment 'there's always a matching value'.","fix":"Guard the change like update_properties does:\n```c\n    for (j = 0; j < drmmode_prop->count_enums; j++)\n        if (drmmode_prop->enums[j].value == p->value)\n            break;\n    if (j < drmmode_prop->count_enums) {\n        err = RRChangeOutputProperty(output->randr_output, p->atoms[0],\n                                     XA_ATOM, 32, PropModeReplace, 1,\n                                     &p->atoms[j + 1], FALSE, TRUE);\n        ...\n    }\n```","locations":[{"ref":"hw/xfree86/drivers/video/modesetting/drmmode_display.c:3416-3422","code":" 3416 |             for (j = 0; j < drmmode_prop->count_enums; j++)\n 3417 |                 if (drmmode_prop->enums[j].value == p->value)\n 3418 |                     break;\n 3419 |             /* there's always a matching value */\n 3420 |             err = RRChangeOutputProperty(output->randr_output, p->atoms[0],\n 3421 |                                          XA_ATOM, 32, PropModeReplace, 1,\n 3422 |                                          &p->atoms[j + 1], FALSE, TRUE);","lines":7,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/xfree86/drivers/video/modesetting/drmmode_display.c#L3416-L3422"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"critical","difficulty":"very_easy","description":"dri3_fd_from_pixmap() writes `size[0]` instead of `strides[0]` for the size field. The parameter `size` is a `CARD32 *` pointer, so `size[0]` dereferences the pointee as an array element (which happens to compile and be the same as `*size`) but the author clearly intended to assign `strides[0]` (the stride) to `*stride` is already done on the previous line, and `strides[0]` should have been used for `*size` - but actually the intent was to assign `strides[0]` to the stride output (already done) AND populate the size output from the local `strides` buffer. The correct assignment is `*size = strides[0]` since there is no local `sizes` array - the function receives `size` as an output pointer, not an array. Writing `size[0]` is identical to `*size` by C semantics (no crash), but the value returned in `*size` will be whatever value `*size` contained on entry (the caller's uninitialized or stale value) rather than the buffer size from the v2 API. The caller in proc_dri3_buffer_from_pixmap uses the returned size field in the protocol reply, so clients receive garbage.","fix":"Replace `*size = size[0];` with `*size = strides[0];`. The local `strides[4]` array holds the per-plane stride; for a single-plane buffer the stride value serves as the size approximation, matching what the old `fd_from_pixmap` interface returned via its `CARD32 *size` parameter.","locations":[{"ref":"Xext/dri3/dri3_screen.c:151-152","code":"  151 |     *stride = strides[0];\n  152 |     *size = size[0];","lines":2,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/dri3/dri3_screen.c#L151-L152"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"critical","difficulty":"very_easy","description":"__glXDRIdrawableCopySubBuffer() passes arguments to copy_box() in completely wrong order. copy_box() signature is (drawable, dst, src, x, y, w, h), but the call passes (drawable, x, height-y-h, w, h, DRI2BufferFrontLeft, DRI2BufferBackLeft). This maps the x coordinate as 'dst' buffer enum, the height-adjusted y as 'src' buffer enum, and the DRI2 buffer constants end up as the width and height. The copy effectively operates on garbage buffer IDs at the wrong region, so CopySubBufferMESA silently does the wrong thing.","fix":"Swap arguments: copy_box(drawable, DRI2BufferFrontLeft, DRI2BufferBackLeft, x, private->height - y - h, w, h);","locations":[{"ref":"Xext/glx/glx_dri/glxdri2.c:140-142","code":"  140 |     copy_box(drawable, x, private->height - y - h,\n  141 |              w, h,\n  142 |              DRI2BufferFrontLeft, DRI2BufferBackLeft);","lines":3,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/glx_dri/glxdri2.c#L140-L142"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"critical","difficulty":"medium","description":"In indirect_program.c, DoGetProgramString calls get_programiv (line 83) and get_program_string (line 89) without checking whether those function pointers are NULL. __glGetProcAddress returns NULL when the extension is not present. A NULL call causes an immediate server crash. Both __glXDisp_GetProgramStringARB and __glXDispSwap_GetProgramStringARB are affected.","fix":"Add null checks after __glGetProcAddress and return an appropriate error (e.g. BadRequest or __glXError) if either pointer is NULL.","locations":[{"ref":"Xext/glx/indirect_program.c:83-89","code":"   83 |         get_programiv(target, GL_PROGRAM_LENGTH_ARB, &compsize);\n   84 | \n   85 |         if (compsize != 0) {\n   86 |             __GLX_GET_ANSWER_BUFFER(answer, cl, compsize, 1);\n   87 |             __glXClearErrorOccured();\n   88 | \n   89 |             get_program_string(target, pname, (GLubyte *) answer);","lines":7,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/indirect_program.c#L83-L89"},{"ref":"Xext/glx/indirect_program.c:105-124","code":"  105 | int\n  106 | __glXDisp_GetProgramStringARB(struct __GLXclientStateRec *cl, GLbyte * pc)\n  107 | {\n  108 |     PFNGLGETPROGRAMIVARBPROC get_program =\n  109 |         __glGetProcAddress(\"glGetProgramivARB\");\n  110 |     PFNGLGETPROGRAMSTRINGARBPROC get_program_string =\n  111 |         __glGetProcAddress(\"glGetProgramStringARB\");\n  112 | \n  113 |     return DoGetProgramString(cl, pc, get_program, get_program_string, FALSE);\n  114 | }\n  115 | \n  116 | int\n  117 | __glXDispSwap_GetProgramStringARB(struct __GLXclientStateRec *cl, GLbyte * pc)\n  118 | {\n  119 |     PFNGLGETPROGRAMIVARBPROC get_program =\n  120 |         __glGetProcAddress(\"glGetProgramivARB\");\n  121 |     PFNGLGETPROGRAMSTRINGARBPROC get_program_string =\n  122 |         __glGetProcAddress(\"glGetProgramStringARB\");\n  123 | \n  124 |     return DoGetProgramString(cl, pc, get_program, get_program_string, TRUE);","lines":20,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/indirect_program.c#L105-L124"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In SGEGenericEvent() the bounds check uses `> MAXEXTENSIONS` (strict greater-than), but the array `GEExtensions` has exactly MAXEXTENSIONS (128) elements indexed 0-127. An extension whose masked opcode equals exactly 128 passes the check but then indexes `GEExtensions[128]`, which is one element past the end of the array - undefined behaviour and a potential read/write of out-of-bounds memory. GERegisterExtension() correctly uses `>= MAXEXTENSIONS`, exposing the inconsistency.","fix":"Change the condition from `> MAXEXTENSIONS` to `>= MAXEXTENSIONS` to match the guard in GERegisterExtension().","locations":[{"ref":"Xext/geext/geext.c:131","code":"  131 |     if ((gefrom->extension & 0x7f) > MAXEXTENSIONS) {","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/geext/geext.c#L131"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In dri2_convert_glx_attribs(), the version guard for GLX_CONTEXT_RESET_NOTIFICATION_STRATEGY_ARB is inverted. The code returns BadValue when screen->dri2->base.version >= 4, meaning it rejects reset notification requests when the driver is new enough to handle them, and silently accepts them (writing to *reset) when the driver is too old. The intent was almost certainly to reject when the driver is too old (version < 4), not the other way around.","fix":"Change 'if (screen->dri2->base.version >= 4)' to 'if (screen->dri2->base.version < 4)' so that the error is returned when the driver does not support the reset notification attribute.","locations":[{"ref":"Xext/glx/glx_dri/glxdri2.c:383-387","code":"  383 |         case GLX_CONTEXT_RESET_NOTIFICATION_STRATEGY_ARB:\n  384 |             if (screen->dri2->base.version >= 4) {\n  385 |                 *error = BadValue;\n  386 |                 return FALSE;\n  387 |             }","lines":5,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/glx_dri/glxdri2.c#L383-L387"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"The __GLX_ALIGN64 alignment fixup in every __glXDisp_VertexAttrib{1,2,3,4}dv and __glXDisp_VertexAttrib{1,2,3,4}dvNV function does not actually align the double array to an 8-byte boundary. The protocol layout for these commands is [index: 4 bytes][doubles: N*8 bytes]. The fixup copies the block to pc-4 and decrements pc by 4, so the doubles end up at address (new_pc + 4). When the original pc was offset 4 mod 8 (the triggering condition), new_pc is 8-aligned but new_pc+4 is only 4-aligned. On strict-alignment architectures (SPARC, MIPS, early ARM) this causes a SIGBUS when the double array is accessed. By contrast, functions whose doubles start at offset 0 (e.g., MultiTexCoord1dv) or offset 8 (e.g., TexGendv, ProgramEnvParameter4dvARB) are fixed correctly by the same pattern.","fix":"The GLX protocol should place the doubles before the index (as MultiTexCoord*dv does) so the fixup works. Alternatively, use memcpy to a local aligned double array instead of the memmove-in-place trick.","locations":[{"ref":"Xext/glx/indirect_dispatch.c:4039-4052","code":" 4039 | void\n 4040 | __glXDisp_VertexAttrib1dv(GLbyte * pc)\n 4041 | {\n 4042 |     PFNGLVERTEXATTRIB1DVPROC VertexAttrib1dv =\n 4043 |         __glGetProcAddress(\"glVertexAttrib1dv\");\n 4044 | #ifdef __GLX_ALIGN64\n 4045 |     if ((unsigned long) (pc) & 7) {\n 4046 |         (void) memmove(pc - 4, pc, 12);\n 4047 |         pc -= 4;\n 4048 |     }\n 4049 | #endif\n 4050 | \n 4051 |     VertexAttrib1dv(*(GLuint *) (pc + 0), (const GLdouble *) (pc + 4));\n 4052 | }","lines":14,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/indirect_dispatch.c#L4039-L4052"},{"ref":"Xext/glx/indirect_dispatch.c:4062-4075","code":" 4062 | void\n 4063 | __glXDisp_VertexAttrib2dv(GLbyte * pc)\n 4064 | {\n 4065 |     PFNGLVERTEXATTRIB2DVPROC VertexAttrib2dv =\n 4066 |         __glGetProcAddress(\"glVertexAttrib2dv\");\n 4067 | #ifdef __GLX_ALIGN64\n 4068 |     if ((unsigned long) (pc) & 7) {\n 4069 |         (void) memmove(pc - 4, pc, 20);\n 4070 |         pc -= 4;\n 4071 |     }\n 4072 | #endif\n 4073 | \n 4074 |     VertexAttrib2dv(*(GLuint *) (pc + 0), (const GLdouble *) (pc + 4));\n 4075 | }","lines":14,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/indirect_dispatch.c#L4062-L4075"},{"ref":"Xext/glx/indirect_dispatch.c:4085-4098","code":" 4085 | void\n 4086 | __glXDisp_VertexAttrib3dv(GLbyte * pc)\n 4087 | {\n 4088 |     PFNGLVERTEXATTRIB3DVPROC VertexAttrib3dv =\n 4089 |         __glGetProcAddress(\"glVertexAttrib3dv\");\n 4090 | #ifdef __GLX_ALIGN64\n 4091 |     if ((unsigned long) (pc) & 7) {\n 4092 |         (void) memmove(pc - 4, pc, 28);\n 4093 |         pc -= 4;\n 4094 |     }\n 4095 | #endif\n 4096 | \n 4097 |     VertexAttrib3dv(*(GLuint *) (pc + 0), (const GLdouble *) (pc + 4));\n 4098 | }","lines":14,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/indirect_dispatch.c#L4085-L4098"},{"ref":"Xext/glx/indirect_dispatch.c:4164-4177","code":" 4164 | void\n 4165 | __glXDisp_VertexAttrib4dv(GLbyte * pc)\n 4166 | {\n 4167 |     PFNGLVERTEXATTRIB4DVPROC VertexAttrib4dv =\n 4168 |         __glGetProcAddress(\"glVertexAttrib4dv\");\n 4169 | #ifdef __GLX_ALIGN64\n 4170 |     if ((unsigned long) (pc) & 7) {\n 4171 |         (void) memmove(pc - 4, pc, 36);\n 4172 |         pc -= 4;\n 4173 |     }\n 4174 | #endif\n 4175 | \n 4176 |     VertexAttrib4dv(*(GLuint *) (pc + 0), (const GLdouble *) (pc + 4));\n 4177 | }","lines":14,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/indirect_dispatch.c#L4164-L4177"},{"ref":"Xext/glx/indirect_dispatch.c:4824-4837","code":" 4824 | void\n 4825 | __glXDisp_VertexAttrib1dvNV(GLbyte * pc)\n 4826 | {\n 4827 |     PFNGLVERTEXATTRIB1DVNVPROC VertexAttr {"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"PixelMapfv, PixelMapuiv, and PixelMapusv each call bswap_*_array with a hard-coded count of 0 instead of mapsize. This means the variable-length pixel map data is never byte-swapped before being passed to the GL driver. On a big-endian client, every element in the map arrives with reversed bytes and is silently misinterpreted.","fix":"Pass `mapsize` as the count argument to bswap_32_array / bswap_16_array, matching the non-swap version's mapsize variable.","locations":[{"ref":"Xext/glx/indirect_dispatch_swap.c:1635-1663","code":" 1635 | void\n 1636 | __glXDispSwap_PixelMapfv(GLbyte * pc)\n 1637 | {\n 1638 |     const GLsizei mapsize = (GLsizei) bswap_CARD32(pc + 4);\n 1639 | \n 1640 |     glPixelMapfv((GLenum) bswap_ENUM(pc + 0),\n 1641 |                  mapsize,\n 1642 |                  (const GLfloat *) bswap_32_array((uint32_t *) (pc + 8), 0));\n 1643 | }\n 1644 | \n 1645 | void\n 1646 | __glXDispSwap_PixelMapuiv(GLbyte * pc)\n 1647 | {\n 1648 |     const GLsizei mapsize = (GLsizei) bswap_CARD32(pc + 4);\n 1649 | \n 1650 |     glPixelMapuiv((GLenum) bswap_ENUM(pc + 0),\n 1651 |                   mapsize,\n 1652 |                   (const GLuint *) bswap_32_array((uint32_t *) (pc + 8), 0));\n 1653 | }\n 1654 | \n 1655 | void\n 1656 | __glXDispSwap_PixelMapusv(GLbyte * pc)\n 1657 | {\n 1658 |     const GLsizei mapsize = (GLsizei) bswap_CARD32(pc + 4);\n 1659 | \n 1660 |     glPixelMapusv((GLenum) bswap_ENUM(pc + 0),\n 1661 |                   mapsize,\n 1662 |                   (const GLushort *) bswap_16_array((uint16_t *) (pc + 8), 0));\n 1663 | }","lines":29,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/indirect_dispatch_swap.c#L1635-L1663"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"AreTexturesResident (and its EXT variant) call bswap_32_array with count 0. The n texture IDs read from the client packet are never byte-swapped before being passed to glAreTexturesResident, yielding residency results for completely wrong textures on big-endian clients.","fix":"Pass n as the count to bswap_32_array.","locations":[{"ref":"Xext/glx/indirect_dispatch_swap.c:2707-2767","code":" 2707 | int\n 2708 | __glXDispSwap_AreTexturesResident(__GLXclientState * cl, GLbyte * pc)\n 2709 | {\n 2710 |     xGLXSingleReq *const req = (xGLXSingleReq *) pc;\n 2711 |     int error;\n 2712 |     __GLXcontext *const cx =\n 2713 |         __glXForceCurrent(cl, bswap_CARD32(&req->contextTag), &error);\n 2714 | \n 2715 |     pc += __GLX_SINGLE_HDR_SIZE;\n 2716 |     if (cx != NULL) {\n 2717 |         const GLsizei n = (GLsizei) bswap_CARD32(pc + 0);\n 2718 | \n 2719 |         GLboolean retval;\n 2720 |         GLboolean answerBuffer[200];\n 2721 |         GLboolean *residences =\n 2722 |             __glXGetAnswerBuffer(cl, n, answerBuffer, sizeof(answerBuffer), 1);\n 2723 | \n 2724 |         if (residences == NULL)\n 2725 |             return BadAlloc;\n 2726 |         retval =\n 2727 |             glAreTexturesResident(n,\n 2728 |                                   (const GLuint *)\n 2729 |                                   bswap_32_array((uint32_t *) (pc + 4), 0),\n 2730 |                                   residences);\n 2731 |         __glXSendReplySwap(cl->client, residences, n, 1, GL_TRUE, retval);\n 2732 |         error = Success;\n 2733 |     }\n 2734 | \n 2735 |     return error;\n 2736 | }\n 2737 | \n 2738 | int\n 2739 | __glXDispSwap_AreTexturesResidentEXT(__GLXclientState * cl, GLbyte * pc)\n 2740 | {\n 2741 |     xGLXVendorPrivateReq *const req = (xGLXVendorPrivateReq *) pc;\n 2742 |     int error;\n 2743 |     __GLXcontext *const cx =\n 2744 |         __glXForceCurrent(cl, bswap_CARD32(&req->contextTag), &error);\n 2745 | \n 2746 |     pc += __GLX_VENDPRIV_HDR_SIZE;\n 2747 |     if (cx != NULL) {\n 2748 |         const GLsizei n = (GLsizei) bswap_CARD32(pc + 0);\n 2749 | \n 2750 |         GLboolean retval;\n 2751 |         GLboolean answerBuffer[200];\n 2752 |         GLboolean *residences =\n 2753 |             __glXGetAnswerBuffer(cl, n, answerBuffer, sizeof(answerBuffer), 1);\n 2754 | \n 2755 |         if (residences == NULL)\n 2756 |             return BadAlloc;\n 2757 |         retval =\n 2758 |             glAreTexturesResident(n,\n 2759 |                                   (const GLuint *)\n 2760 |                                   bswap_32_array((uint32_t *) (pc + 4), 0),\n 2761 |                                   residences);\n 2762 |         __glXSendReplySwap(cl->client, residences, n, 1, GL_TRUE, retval);\n 2763 |         error = Success;\n 2764 |     }\n 2765 | \n 2766 |     return error;\n 2767 | }","lines":61,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/indirect_dispatch_swap.c#L2707-L2767"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"DeleteTextures (and its EXT variant) call bswap_32_array with count 0 instead of n. The texture IDs in the packet are never byte-swapped, so the GL driver deletes the wrong textures when the client is big-endian.","fix":"Change the bswap_32_array count argument from 0 to n.","locations":[{"ref":"Xext/glx/indirect_dispatch_swap.c:2819-2857","code":" 2819 | __glXDispSwap_DeleteTextures(__GLXclientState * cl, GLbyte * pc)\n 2820 | {\n 2821 |     xGLXSingleReq *const req = (xGLXSingleReq *) pc;\n 2822 |     int error;\n 2823 |     __GLXcontext *const cx =\n 2824 |         __glXForceCurrent(cl, bswap_CARD32(&req->contextTag), &error);\n 2825 | \n 2826 |     pc += __GLX_SINGLE_HDR_SIZE;\n 2827 |     if (cx != NULL) {\n 2828 |         const GLsizei n = (GLsizei) bswap_CARD32(pc + 0);\n 2829 | \n 2830 |         glDeleteTextures(n,\n 2831 |                          (const GLuint *) bswap_32_array((uint32_t *) (pc + 4),\n 2832 |                                                          0));\n 2833 |         error = Success;\n 2834 |     }\n 2835 | \n 2836 |     return error;\n 2837 | }\n 2838 | \n 2839 | int\n 2840 | __glXDispSwap_DeleteTexturesEXT(__GLXclientState * cl, GLbyte * pc)\n 2841 | {\n 2842 |     xGLXVendorPrivateReq *const req = (xGLXVendorPrivateReq *) pc;\n 2843 |     int error;\n 2844 |     __GLXcontext *const cx =\n 2845 |         __glXForceCurrent(cl, bswap_CARD32(&req->contextTag), &error);\n 2846 | \n 2847 |     pc += __GLX_VENDPRIV_HDR_SIZE;\n 2848 |     if (cx != NULL) {\n 2849 |         const GLsizei n = (GLsizei) bswap_CARD32(pc + 0);\n 2850 | \n 2851 |         glDeleteTextures(n,\n 2852 |                          (const GLuint *) bswap_32_array((uint32_t *) (pc + 4),\n 2853 |                                                          0));\n 2854 |         error = Success;\n 2855 |     }\n 2856 | \n 2857 |     return error;","lines":39,
