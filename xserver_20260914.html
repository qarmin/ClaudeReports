{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"DeleteQueries (line 4247) and DeleteProgramsARB (line 4663) both call bswap_32_array with count 0, so the IDs are never byte-swapped. The GL driver deletes the wrong query objects / programs on big-endian clients.","fix":"Pass n as the count to bswap_32_array.","locations":[{"ref":"Xext/glx/indirect_dispatch_swap.c:4247-4267","code":" 4247 | __glXDispSwap_DeleteQueries(__GLXclientState * cl, GLbyte * pc)\n 4248 | {\n 4249 |     PFNGLDELETEQUERIESPROC DeleteQueries =\n 4250 |         __glGetProcAddress(\"glDeleteQueries\");\n 4251 |     xGLXSingleReq *const req = (xGLXSingleReq *) pc;\n 4252 |     int error;\n 4253 |     __GLXcontext *const cx =\n 4254 |         __glXForceCurrent(cl, bswap_CARD32(&req->contextTag), &error);\n 4255 | \n 4256 |     pc += __GLX_SINGLE_HDR_SIZE;\n 4257 |     if (cx != NULL) {\n 4258 |         const GLsizei n = (GLsizei) bswap_CARD32(pc + 0);\n 4259 | \n 4260 |         DeleteQueries(n,\n 4261 |                       (const GLuint *) bswap_32_array((uint32_t *) (pc + 4),\n 4262 |                                                       0));\n 4263 |         error = Success;\n 4264 |     }\n 4265 | \n 4266 |     return error;\n 4267 | }","lines":21,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/indirect_dispatch_swap.c#L4247-L4267"},{"ref":"Xext/glx/indirect_dispatch_swap.c:4663-4684","code":" 4663 | int\n 4664 | __glXDispSwap_DeleteProgramsARB(__GLXclientState * cl, GLbyte * pc)\n 4665 | {\n 4666 |     PFNGLDELETEPROGRAMSARBPROC DeleteProgramsARB =\n 4667 |         __glGetProcAddress(\"glDeleteProgramsARB\");\n 4668 |     xGLXVendorPrivateReq *const req = (xGLXVendorPrivateReq *) pc;\n 4669 |     int error;\n 4670 |     __GLXcontext *const cx =\n 4671 |         __glXForceCurrent(cl, bswap_CARD32(&req->contextTag), &error);\n 4672 | \n 4673 |     pc += __GLX_VENDPRIV_HDR_SIZE;\n 4674 |     if (cx != NULL) {\n 4675 |         const GLsizei n = (GLsizei) bswap_CARD32(pc + 0);\n 4676 | \n 4677 |         DeleteProgramsARB(n,\n 4678 |                           (const GLuint *) bswap_32_array((uint32_t *) (pc + 4),\n 4679 |                                                           0));\n 4680 |         error = Success;\n 4681 |     }\n 4682 | \n 4683 |     return error;\n 4684 | }","lines":22,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/indirect_dispatch_swap.c#L4663-L4684"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"DrawBuffers calls bswap_32_array with count 0 instead of n. The n GLenum draw-buffer values in the packet are never byte-swapped on big-endian clients, so the GL driver receives garbage attachment enumerants.","fix":"Change the bswap_32_array count argument from 0 to n.","locations":[{"ref":"Xext/glx/indirect_dispatch_swap.c:4435-4441","code":" 4435 | __glXDispSwap_DrawBuffers(GLbyte * pc)\n 4436 | {\n 4437 |     PFNGLDRAWBUFFERSPROC DrawBuffers = __glGetProcAddress(\"glDrawBuffers\");\n 4438 |     const GLsizei n = (GLsizei) bswap_CARD32(pc + 0);\n 4439 | \n 4440 |     DrawBuffers(n, (const GLenum *) bswap_32_array((uint32_t *) (pc + 4), 0));\n 4441 | }","lines":7,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/indirect_dispatch_swap.c#L4435-L4441"}]},

(pc - 4, pc, cmdlen);\n 5537 |         pc -= 4;\n 5538 |     }\n 5539 | #endif\n 5540 | \n 5541 |     VertexAttribs2dvNV((GLuint) bswap_CARD32(pc + 0),\n 5542 |                        n,\n 5543 |                        (const GLdouble *) bswap_64_array((uint64_t *) (pc + 8),\n 5544 |                                                          0));\n 5545 | }","lines":20,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/indirect_dispatch_swap.c#L5526-L5545"},{"ref":"Xext/glx/indirect_dispatch_swap.c:5573-5593","code":" 5573 | void\n 5574 | __glXDispSwap_VertexAttribs3dvNV(GLbyte * pc)\n 5575 | {\n 5576 |     PFNGLVERTEXATTRIBS3DVNVPROC VertexAttribs3dvNV =\n 5577 |         __glGetProcAddress(\"glVertexAttribs3dvNV\");\n 5578 |     const GLsizei n = (GLsizei) bswap_CARD32(pc + 4);\n 5579 | \n 5580 | #ifdef __GLX_ALIGN64\n 5581 |     const GLuint cmdlen = 12 + __GLX_PAD((n * 24)) - 4;\n 5582 | \n 5583 |     if ((unsigned long) (pc) & 7) {\n 5584 |         (void) memmove(pc - 4, pc, cmdlen);\n 5585 |         pc -= 4;\n 5586 |     }\n 5587 | #endif\n 5588 | \n 5589 |     VertexAttribs3dvNV((GLuint) bswap_CARD32(pc + 0),\n 5590 |                        n,\n 5591 |                        (const GLdouble *) bswap_64_array((uint64_t *) (pc + 8),\n 5592 |                                                          0));\n 5593 | }","lines":21,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/indirect_dispatch_swap.c#L5573-L5593"},{"ref":"Xext/glx/indirect_dispatch_swap.c:5621-5641","code":" 5621 | void\n 5622 | __glXDispSwap_VertexAttribs4dvNV(GLbyte * pc)\n 5623 | {\n 5624 |     PFNGLVERTEXATTRIBS4DVNVPROC VertexAttribs4dvNV =\n 5625 |         __glGetProcAddress(\"glVertexAttribs4dvNV\");\n 5626 |     const GLsizei n = (GLsizei) bswap_CARD32(pc + 4);\n 5627 | \n 5628 | #ifdef __GLX_ALIGN64\n 5629 |     const GLuint cmdlen = 12 + __GLX_PAD((n * 32)) - 4;\n 5630 | \n 5631 |     if ((unsigned long) (pc) & 7) {\n 5632 |         (void) memmove(pc - 4, pc, cmdlen);\n 5633 |         pc -= 4;\n 5634 |     }\n 5635 | #endif\n 5636 | \n 5637 |     VertexAttribs4dvNV((GLuint) bswap_CARD32(pc + 0),\n 5638 |                        n,\n 5639 |                        (const GLdouble *) bswap_64_array((uint64_t *) (pc + 8),\n 5640 |                                                          0));\n 5641 | }","lines":21,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/indirect_dispatch_swap.c#L5621-L5641"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"__glXDispSwap_SeparableFilter2D (renderpixswap.c) uses __GLX_CONV_FILT_CMD_HDR_SIZE (48) to compute\nhdrlen, but __glXDisp_SeparableFilter2D (renderpix.c) correctly uses __GLX_CONV_FILT_CMD_DISPATCH_HDR_SIZE (44).\nThe dispatch path has already stripped the 4-byte render header before calling the handler, so the\n'DISPATCH' variant (44 bytes) is the right one for both. Using 48 in the swap variant makes the second\nfilter kernel pointer (hdr + hdrlen + image1len) point 4 bytes too far into the packet, reading\ncorrupted data for the column kernel of glSeparableFilter2D.","fix":"Change renderpixswap.c line 44 from __GLX_CONV_FILT_CMD_HDR_SIZE to __GLX_CONV_FILT_CMD_DISPATCH_HDR_SIZE.","locations":[{"ref":"Xext/glx/renderpixswap.c:44","code":"   44 |     hdrlen = __GLX_PAD(__GLX_CONV_FILT_CMD_HDR_SIZE);","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/renderpixswap.c#L44"},{"ref":"Xext/glx/renderpix.c:44","code":"   44 |     hdrlen = __GLX_PAD(__GLX_CONV_FILT_CMD_DISPATCH_HDR_SIZE);","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/renderpix.c#L44"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In __glXDrawArraysReqSize (rensize.c:417), the validation condition for GL_EDGE_FLAG_ARRAY uses logical\nAND: '(numVals != 1) && (datatype != GL_UNSIGNED_BYTE)'. This means the check only rejects packets\nwhere both conditions are simultaneously true. A packet with numVals=99 but datatype==GL_UNSIGNED_BYTE\npasses validation even though the array element count is wrong. Similarly, numVals==1 with\ndatatype==GL_FLOAT passes even though the type is invalid for edge flags. The condition should use\nlogical OR to reject when either constraint is violated.","fix":"Change the condition to: if ((numVals != 1) || (datatype != GL_UNSIGNED_BYTE)) { return -1; }","locations":[{"ref":"Xext/glx/rensize.c:416-421","code":"  416 |         case GL_EDGE_FLAG_ARRAY:\n  417 |             if ((numVals != 1) && (datatype != GL_UNSIGNED_BYTE)) {\n  418 |                 /* bad size or bad type */\n  419 |                 return -1;\n  420 |             }\n  421 |             break;","lines":6,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/rensize.c#L416-L421"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"GetConvolutionFilter in singlepixswap.c has the 1D/2D condition inverted compared to the non-swap version in singlepix.c. singlepix.c correctly sets height=1 for GL_CONVOLUTION_1D; singlepixswap.c sets height=1 for GL_CONVOLUTION_2D instead, which means a 2D filter reports height=1 (wrong buffer size) and a 1D filter queries GL_CONVOLUTION_HEIGHT (wrong query). This causes an incorrect compsize, potentially allocating too small a buffer or sending garbage data.","fix":"Change the condition in singlepixswap.c from `if (target == GL_CONVOLUTION_2D)` to `if (target == GL_CONVOLUTION_1D)` to match the logic in singlepix.c.","locations":[{"ref":"Xext/glx/singlepixswap.c:305-318","code":"  305 |     swapBytes = *(GLboolean *) (pc + 12);\n  306 | \n  307 |     glGetConvolutionParameteriv(target, GL_CONVOLUTION_WIDTH, &width);\n  308 |     if (target == GL_CONVOLUTION_2D) {\n  309 |         height = 1;\n  310 |     }\n  311 |     else {\n  312 |         glGetConvolutionParameteriv(target, GL_CONVOLUTION_HEIGHT, &height);\n  313 |     }\n  314 |     /*\n  315 |      * The two queries above might fail if we're in a state where queries\n  316 |      * are illegal, but then width and height would still be zero anyway.\n  317 |      */\n  318 |     compsize = __glGetTexImage_size(target, 1, format, type, width, height, 1);","lines":14,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/singlepixswap.c#L305-L318"},{"ref":"Xext/glx/singlepix.c:280-294","code":"  280 |     swapBytes = *(GLboolean *) (pc + 12);\n  281 | \n  282 |     glGetConvolutionParameteriv(target, GL_CONVOLUTION_WIDTH, &width);\n  283 |     if (target == GL_CONVOLUTION_1D) {\n  284 |         height = 1;\n  285 |     }\n  286 |     else {\n  287 |         glGetConvolutionParameteriv(target, GL_CONVOLUTION_HEIGHT, &height);\n  288 |     }\n  289 |     /*\n  290 |      * The two queries above might fail if we're in a state where queries\n  291 |      * are illegal, but then width and height would still be zero anyway.\n  292 |      */\n  293 |     compsize = __glGetTexImage_size(target, 1, format, type, width, height, 1);\n  294 |     if (compsize < 0)","lines":15,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/singlepix.c#L280-L294"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In config.c select_ns(), calloc() is called but its return value is never checked for NULL. If the allocation fails, `newns->name = strdup(name)` immediately dereferences the NULL pointer, crashing the server during config loading.","fix":"Check `if (!newns) FatalError(\"Xnamespace: failed allocating namespace\\n\");` immediately after the calloc call.","locations":[{"ref":"Xext/namespace/config.c:45-46","code":"   45 |     struct Xnamespace *newns = calloc(1, sizeof(struct Xnamespace));\n   46 |     newns->name = strdup(name);","lines":2,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/namespace/config.c#L45-L46"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"Multiple namespace hooks (hookClient, hookDevice, hookExtAccess, hookExtDispatch, hookReceive, hookSelectionFilter, hookServerAccess, hookWindowProperty, hookResourceAccess) dereference `subj->ns->superPower` or other fields without first checking that `subj` or `subj->ns` is non-NULL. XNS_HOOK_HEAD provides no early-return when client is NULL, and XnsClientPriv(NULL) returns NULL. A NULL subj causes an immediate crash; a NULL subj->ns (possible during client teardown) is equally fatal.","fix":"Add `if (!subj || !subj->ns) return;` at the top of each hook that accesses subj->ns. Alternatively, add the guard directly into XNS_HOOK_HEAD.","locations":[{"ref":"Xext/namespace/hook-client.c:29","code":"   29 |     if (subj->ns->superPower || XnsClientSameNS(subj, obj))","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/namespace/hook-client.c#L29"},{"ref":"Xext/namespace/hook-device.c:23","code":"   23 |     if (subj->ns->superPower)","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/namespace/hook-device.c#L23"},{"ref":"Xext/namespace/hook-ext-access.c:22","code":"   22 |     if (subj->ns->superPower)","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/namespace/hook-ext-access.c#L22"},{"ref":"Xext/namespace/hook-ext-dispatch.c:29","code":"   29 |     if (subj->ns->superPower)","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/namespace/hook-ext-dispatch.c#L29"},{"ref":"Xext/namespace/hook-receive.c:39","code":"   39 |                             if ((!subj->ns->allowMouseMotion) || !isRootWin(param->pWin))","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/namespace/hook-receive.c#L39"},{"ref":"Xext/namespace/hooks.h:21-27","code":"   21 | #define XNS_HOOK_HEAD(t) \\\n   22 |     t *param = calldata; \\\n   23 |     ClientPtr client = param->client; \\\n   24 |     if (!client) { \\\n   25 |         /* XNS_LOG(\"hook %s NULL client\\n\", HOOK_NAME); */ \\\n   26 |     } \\\n   27 |     struct XnamespaceClientPriv *subj = XnsClientPriv(client);","lines":7,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/namespace/hooks.h#L21-L27"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"hookPropertyAccess dereferences `subj->ns->rootWindow` after the same-namespace check without first verifying that `subj` or `subj->ns` is non-NULL. XNS_HOOK_HEAD does not early-return when `client` is NULL; XnsClientPriv(NULL) returns NULL, making subj NULL. Also, if a client's namespace was cleared by hookClientDestroy before a subsequent hook fires, subj->ns can be NULL. Both cases cause a NULL pointer dereference crash.","fix":"After XNS_HOOK_HEAD, add `if (!subj || !subj->ns) return;` before any access to `subj->ns`. Apply the same guard in all other hooks that dereference `subj->ns` without checking.","locations":[{"ref":"Xext/namespace/hook-property.c:35","code":"   35 |     if (param->pWin == subj->ns->rootWindow)","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/namespace/hook-property.c#L35"},{"ref":"Xext/namespace/hooks.h:21-27","code":"   21 | #define XNS_HOOK_HEAD(t) \\\n   22 |     t *param = calldata; \\\n   23 |     ClientPtr client = param->client; \\\n   24 |     if (!client) { \\\n   25 |         /* XNS_LOG(\"hook %s NULL client\\n\", HOOK_NAME); */ \\\n   26 |     } \\\n   27 |     struct XnamespaceClientPriv *subj = XnsClientPriv(client);","lines":7,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/namespace/hooks.h#L21-L27"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"hookResourceAccess (hook-resource.c) dereferences `obj` at line 109\n(`obj->isServer`) and at line 135 (`obj->ns->name`) without checking whether\n`obj` is NULL. `obj = XnsClientPriv(owner)` where `owner = dixLookupXIDOwner(param->id)`.\n`dixLookupXIDOwner` can return NULL (when the XID does not map to a live client,\ne.g. server-internal resources or a just-disconnected client). In that case\n`XnsClientPriv(NULL)` returns NULL, and the code reaches line 109 after\n`XnsClientSameNS(subj, obj)` returns FALSE (different namespaces: one NULL, one\nnot), leading to a NULL dereference.","fix":"Add a NULL check for `obj` before line 109: `if (!obj) goto reject;` (or treat it as the server owning the resource and handle accordingly).","locations":[{"ref":"Xext/namespace/hook-resource.c:26-27","code":"   26 |     ClientPtr owner = dixLookupXIDOwner(param->id);\n   27 |     struct XnamespaceClientPriv *obj = XnsClientPriv(owner);","lines":2,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/namespace/hook-resource.c#L26-L27"},{"ref":"Xext/namespace/hook-resource.c:116-130","code":"  116 |     if (obj->isServer) {\n  117 |         if (param->rtype == X11_RESTYPE_COLORMAP) {\n  118 |             if (checkAllowed(param->access_mode, DixReadAccess | DixGetPropAccess | DixUseAccess | DixGetAttrAccess | DixAddAccess))\n  119 |                 goto pass;\n  120 |         }\n  121 | \n  122 |         if (param->rtype == X11_RESTYPE_WINDOW) {\n  123 |             /* allowed ones should already been catched above */\n  124 |             XNS_HOOK_LOG(\"REJECT server owned window 0x%0lx!\\n\", (unsigned long)((WindowPtr)param->res)->drawable.id);\n  125 |             goto reject;\n  126 |         }\n  127 | \n  128 |         if (checkAllowed(param->access_mode, DixReadAccess))\n  129 |             goto pass;\n  130 |     }","lines":15,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/namespace/hook-resource.c#L116-L130"},{"ref":"Xext/namespace/hook-resource.c:142","code":"  142 |         obj->ns->name);","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/namespace/hook-resource.c#L142"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"hookSelectionFilter (hook-selection.c) dereferences `subj->ns->superPower` at\nline 37 without a NULL guard on `subj`. Same root cause as above: XNS_HOOK_HEAD\ndoes not early-return for NULL client.","fix":"Add `if (!subj) return;` immediately after XNS_HOOK_HEAD.","locations":[{"ref":"Xext/namespace/hook-selection.c:36-39","code":"   36 |     XNS_HOOK_HEAD(SelectionFilterParamRec);\n   37 | \n   38 |     /* no rewrite if client is in root namespace */\n   39 |     if (subj->ns->superPower)","lines":4,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/namespace/hook-selection.c#L36-L39"},{"ref":"Xext/namespace/hooks.h:21-27","code":"   21 | #define XNS_HOOK_HEAD(t) \\\n   22 |     t *param = calldata; \\\n   23 |     ClientPtr client = param->client; \\\n   24 |     if (!client) { \\\n   25 |         /* XNS_LOG(\"hook %s NULL client\\n\", HOOK_NAME); */ \\\n   26 |     } \\\n   27 |     struct XnamespaceClientPriv *subj = XnsClientPriv(client);","lines":7,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/namespace/hooks.h#L21-L27"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"hookSend (hook-send.c) dereferences `obj->ns->name` at line 39 in the log\nmessage after calling `clientAllowedOnClient()` returned FALSE. `targetClient =\ndixClientForWindow(param->pWin)` can return NULL (dixClientForWindow returns NULL\nfor NULL pWin or when the window is owned by the server). If `targetClient` is NULL,\n`obj = XnsClientPriv(NULL) = NULL`, and `obj->ns->name` at line 39 is a NULL\ndereference.","fix":"Check `if (!targetClient || !obj)` before logging and before using `obj->ns`.","locations":[{"ref":"Xext/namespace/hook-send.c:36-41","code":"   36 |     ClientPtr targetClient = dixClientForWindow(param->pWin);\n   37 |     struct XnamespaceClientPriv *obj = XnsClientPriv(targetClient);\n   38 |     if (clientAllowedOnClient(client, targetClient))\n   39 |         goto pass;\n   40 | \n   41 |     XNS_HOOK_LOG(\"BLOCK target @ %s\\n\", obj->ns->name);","lines":6,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/namespace/hook-send.c#L36-L41"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"hookServerAccess (hook-server.c) dereferences `subj` unconditionally at line 17\n(`subj->ns->superPower`) before checking whether `subj` is NULL. XNS_HOOK_HEAD\nsets `subj = XnsClientPriv(client)`, which returns NULL when `client` is NULL.\nAlthough the ServerAccessCallback callers currently always pass a non-NULL client,\nthe guard comment in XNS_HOOK_HEAD is disabled (`/* XNS_LOG... */`), leaving no\nactual early return for NULL. If a future caller passes NULL, this is a NULL\ndereference crash.","fix":"Add `if (!subj) return;` (or `if (!client) return;`) immediately after XNS_HOOK_HEAD in hookServerAccess, before the first use of `subj`.","locations":[{"ref":"Xext/namespace/hook-server.c:17-20","code":"   17 |     XNS_HOOK_HEAD(ServerAccessCallbackParam);\n   18 | \n   19 |     if (subj->ns->superPower)\n   20 |         goto pass;","lines":4,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/namespace/hook-server.c#L17-L20"},{"ref":"Xext/namespace/hooks.h:21-27","code":"   21 | #define XNS_HOOK_HEAD(t) \\\n   22 |     t *param = calldata; \\\n   23 |     ClientPtr client = param->client; \\\n   24 |     if (!client) { \\\n   25 |         /* XNS_LOG(\"hook %s NULL client\\n\", HOOK_NAME); */ \\\n   26 |     } \\\n   27 |     struct XnamespaceClientPriv *subj = XnsClientPriv(client);","lines":7,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/namespace/hooks.h#L21-L27"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"hookWindowProperty (hook-windowproperty.c) dereferences `subj` at line 20\n(`subj->ns->superPower`) and again at lines 33, 37, and 42, with no NULL guard.\nXNS_HOOK_HEAD allows `client` to be NULL (the guard is a no-op comment), which\nmakes `subj = XnsClientPriv(NULL) = NULL`. The PropertyFilterCallback currently\nreceives a real client, but the pattern is fragile.","fix":"Add `if (!subj) return;` immediately after XNS_HOOK_HEAD.","locations":[{"ref":"Xext/namespace/hook-windowproperty.c:19-22","code":"   19 |     XNS_HOOK_HEAD(PropertyFilterParam);\n   20 | \n   21 |     // no redirect on super power\n   22 |     if (subj->ns->superPower)","lines":4,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/namespace/hook-windowproperty.c#L19-L22"},{"ref":"Xext/namespace/hooks.h:21-27","code":"   21 | #define XNS_HOOK_HEAD(t) \\\n   22 |     t *param = calldata; \\\n   23 |     ClientPtr client = param->client; \\\n   24 |     if (!client) { \\\n   25 |         /* XNS_LOG(\"hook %s NULL client\\n\", HOOK_NAME); */ \\\n   26 |     } \\\n   27 |     struct XnamespaceClientPriv *subj = XnsClientPriv(client);","lines":7,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/namespace/hooks.h#L21-L27"}]},
{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In DeliverStateNotifyEvent() the number of trailing deviceValuator events is *counted* with `evcount += ((nval - 3) + 6)/6;` but is *emitted* by a loop that runs `while (nval>0)` after `nval -= 3`, i.e. it writes exactly ceil((numAxes-3)/6) = ((numAxes-3)+5)/6 events. The two disagree whenever numAxes-3 is a positive multiple of 6, and also for numAxes==3: the formula yields ((n-3)+6)/6 which is one larger than the loop count for numAxes in {3,9,15,21,27,33}. Example: a device with numAxes==3 (very common: x,y,pressure) with a client having selected DeviceStateNotify. FixDeviceStateNotify writes only sev[0]; the valuator loop runs 0 times; but evcount==2. DeliverEventsToWindow is then told there are 2 events, so it sends the uninitialized 32-byte stack slot sev[1] to the client. This is an information disclosure of uninitialized server stack memory to any client that can select DeviceStateNotify (the exact bug class of CVE-2024-0229 introduced by the same fix commit 219c54b8a). It also means the last real event does not carry the MORE_EVENTS flag even though a further (garbage) event is delivered. BUG_RETURN does not catch it because evcount stays within ARRAY_SIZE(sev).","fix":"Make the count match the emit loop (0 extra events when numAxes<=3, otherwise ceil((numAxes-3)/6)). Before:\n```c\n        /* first three are encoded in deviceStateNotify, then\n         * it's 6 per deviceValuator event */\n        evcount += ((nval - 3) + 6)/6;\n```\nAfter:\n```c\n        /* first three are encoded in deviceStateNotify, then\n         * it's 6 per deviceValuator event */\n        if (nval > 3)\n            evcount += ((nval - 3) + 5) / 6;\n```","locations":[{"ref":"dix/enterleave.c:720-725","code":"  720 |     if ((v = dev->valuator) != NULL) {\n  721 |         nval = v->numAxes;\n  722 |         /* first three are encoded in deviceStateNotify, then\n  723 |          * it's 6 per deviceValuator event */\n  724 |         evcount += ((nval - 3) + 6)/6;\n  725 |     }","lines":6,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/dix/enterleave.c#L720-L725"},{"ref":"dix/enterleave.c:748-757","code":"  748 |     first = 3;\n  749 |     nval -= 3;\n  750 |     while (nval > 0) {\n  751 |         ev->deviceid |= MORE_EVENTS;\n  752 |         FixDeviceValuator(dev, (deviceValuator *) ++ev, v, first);\n  753 |         first += 6;\n  754 |         nval -= 6;\n  755 |     }\n  756 | \n  757 |     DeliverEventsToWindow(dev, win, (xEvent *) sev, evcount,","lines":10,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/dix/enterleave.c#L748-L757"}]},
{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"vfbRRScreenSetSize() indexes the per-screen RandR output array with the GLOBAL screen number pScreen->myNum instead of a local output index. pScrPriv->outputs has pScrPriv->numOutputs entries (== that screen's numCrtcs, default 1). On any screen whose myNum >= its numOutputs (e.g. a second screen `-screen 1 ...` with the default single CRTC), outputs[myNum] reads out of bounds and the garbage pointer is passed to RROutputSetPhysicalSize(). This path is reachable from an untrusted client via the RandR RRSetScreenSize request, so a client on a non-first screen can crash the server.","fix":"Do not index the output list by the global screen number. Since RRScreenSetSize is screen-wide, either update all outputs or use output 0:\n```c\nif (pScrPriv->numOutputs > 0)\n    RROutputSetPhysicalSize(pScrPriv->outputs[0], mmWidth, mmHeight);\nreturn TRUE;\n```\nor loop over `i < pScrPriv->numOutputs` calling RROutputSetPhysicalSize for each.","locations":[{"ref":"hw/vfb/InitOutput.c:900-923","code":"  900 | vfbRRScreenSetSize(ScreenPtr  pScreen,\n  901 |                    CARD16     width,\n  902 |                    CARD16     height,\n  903 |                    CARD32     mmWidth,\n  904 |                    CARD32     mmHeight)\n  905 | {\n  906 |     rrScrPrivPtr pScrPriv = rrGetScrPriv(pScreen);\n  907 | \n  908 |     // Prevent screen updates while we change things around\n  909 |     SetRootClip(pScreen, ROOT_CLIP_NONE);\n  910 | \n  911 |     pScreen->width = width;\n  912 |     pScreen->height = height;\n  913 |     pScreen->mmWidth = mmWidth;\n  914 |     pScreen->mmHeight = mmHeight;\n  915 | \n  916 |     // Restore the ability to update screen, now with new dimensions\n  917 |     SetRootClip(pScreen, ROOT_CLIP_FULL);\n  918 | \n  919 |     RRScreenSizeNotify (pScreen);\n  920 |     RRTellChanged(pScreen);\n  921 | \n  922 |     return RROutputSetPhysicalSize(pScrPriv->outputs[pScreen->myNum], mmWidth, mmHeight);\n  923 | }","lines":24,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/vfb/InitOutput.c#L900-L923"}]},
{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In compFreeClientSubwindows(), pClient is obtained via dixClientForXID(id) (line 433), which\ncan return NULL when the client no longer exists (e.g., during server reset or forced client\ndisconnect). pClient is then passed to DamageExtSetCritical() (line 441) and\ncompUnredirectWindow() (line 454). DamageExtSetCritical() internally calls\nGetDamageClient(pClient) which dereferences pClient->devPrivates without a NULL guard.\ncompUnredirectWindow() has BUG_RETURN_VAL(!pClient, BadValue) which only logs a bug and\nreturns -- but DamageExtSetCritical() is called first and will crash.","fix":"After line 433, add a NULL check: if (pClient == NULL) goto skip_client_ops; and restructure\nthe DamageExtSetCritical() call to be inside a pClient != NULL guard.","locations":[{"ref":"Xext/composite/compalloc.c:435-456","code":"  435 |             ClientPtr pClient = dixClientForXID(id);\n  436 | \n  437 |             *prev = ccw->next;\n  438 |             if (ccw->update == CompositeRedirectManual) {\n  439 |                 /*\n  440 |                  * tell damage extension that damage events for this client are\n  441 |                  * critical output\n  442 |                  */\n  443 |                 DamageExtSetCritical(pClient, false);\n  444 |                 csw->update = CompositeRedirectAutomatic;\n  445 |                 pWin->inhibitBGPaint = FALSE;\n  446 |                 if (pWin->mapped)\n  447 |                     (*pWin->drawable.pScreen->ClearToBackground) (pWin, 0, 0, 0,\n  448 |                                                                   0, TRUE);\n  449 |             }\n  450 | \n  451 |             /*\n  452 |              * Unredirect all existing subwindows\n  453 |              */\n  454 |             for (WindowPtr pChild = pWin->lastChild;\n  455 |                     pChild; pChild = pChild->prevSib)\n  456 |                 (void) compUnredirectWindow(pClient, pChild, ccw->update);","lines":22,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/composite/compalloc.c#L435-L456"}]},
{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In ProcCompositeQueryVersion() (compext.c lines 118-121), when the client requests a major\nversion lower than SERVER_COMPOSITE_MAJOR_VERSION, the reply is set to the client's requested\nversion including the client's minor version verbatim. This is correct when major versions\nmatch exactly, but when the major version differs the server should negotiate down to its own\ncapabilities for that major version, not blindly echo the client's minor version. A client\ncould claim major=0 minor=999 and the server would reply with minor=999 even though it only\nsupports a lower minor version.","fix":"When stuff->majorVersion < SERVER_COMPOSITE_MAJOR_VERSION, clamp the replied minor version to\nthe server's known minor version for that major, rather than echoing stuff->minorVersion.","locations":[{"ref":"Xext/composite/compext.c:119-123","code":"  119 |     /* if client asking for a lower version, use this one */\n  120 |     if (stuff->majorVersion < SERVER_COMPOSITE_MAJOR_VERSION) {\n  121 |         reply.majorVersion = stuff->majorVersion;\n  122 |         reply.minorVersion = stuff->minorVersion;\n  123 |     }","lines":5,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/composite/compext.c#L119-L123"}]},
{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In DRI2DrawableGone(), when iterating with xorg_list_for_each_entry_safe, the second branch `if (ref->id == id)` does not have a `break` or `continue` after deleting the ref entry. This means that after deleting a ref by X drawable id, the loop continues to the next iteration using `next`, which is correct for the _safe variant. However, if a single X drawable id has multiple associated dri2_ids (which is possible since DRI2AddDrawableRef can add multiple entries with the same id but different dri2_ids), only the first matching entry is freed, but FreeResourceByType is called for its dri2_id, which triggers DRI2DrawableGone again recursively for each associated dri2_id - potentially causing double-free of ref entries. The missing `continue` is a latent hazard if the structure is extended.","fix":"Add `continue;` after `free(ref);` in the `ref->id == id` branch, or rethink the loop to handle multi-ref cases explicitly.","locations":[{"ref":"Xext/dri2/dri2.c:393-397","code":"  393 |         if (ref->id == id) {\n  394 |             xorg_list_del(&ref->link);\n  395 |             FreeResourceByType(ref->dri2_id, dri2DrawableRes, TRUE);\n  396 |             free(ref);\n  397 |         }","lines":5,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/dri2/dri2.c#L393-L397"}]},
{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In do_get_buffers(), the err_out cleanup loop iterates `for (i = 0; i < count; i++)` to destroy buffers, but `i` was advanced past `count` if the extra real-front or fake-front buffers were added after the main loop (lines 594-617). Those extra buffers at index `count` and `count+1` are not destroyed in the error path, causing a resource leak. The local `buffers` array was allocated as `min(count, DRI2BufferHiz) + 1` elements, and the extra entries added after the main loop fall within the array but are skipped by the err_out loop.","fix":"Change the err_out cleanup loop bound from `count` to `i` (the current index at the time of the goto), so all allocated buffers including the extra front/fake-front entries are destroyed.","locations":[{"ref":"Xext/dri2/dri2.c:658-675","code":"  658 |  err_out:\n  659 | \n  660 |     *out_count = 0;\n  661 | \n  662 |     if (buffers) {\n  663 |         for (i = 0; i < count; i++) {\n  664 |             if (buffers[i] != NULL)\n  665 |                 destroy_buffer(pDraw, buffers[i], 0);\n  666 |         }\n  667 | \n  668 |         free(buffers);\n  669 |         buffers = NULL;\n  670 |     }\n  671 | \n  672 |     update_dri2_drawable_buffers(pPriv, pDraw, buffers, *out_count, width,\n  673 |                                  height);\n  674 | \n  675 |     return buffers;","lines":18,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/dri2/dri2.c#L658-L675"}]},
{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In proc_dri3_query_version(), the version negotiation skips from 1.2 to 1.4, never reporting 1.3. If the screen supports 1.4, the code reports 1.4; if not, it falls back to 1.2. Protocol version 1.3 introduced SetDRMDeviceInUse (which is dispatched in proc_dri3_dispatch as xDRI3SetDRMDeviceInUse) but the capability check function dri3_screen_can_one_point_four() controls both 1.3 and 1.4 features. A client requesting exactly 1.3 would receive a capped reply of 1.2 when the server actually supports SetDRMDeviceInUse. Since SetDRMDeviceInUse is a no-op this is not critical, but the version reporting is incorrect.","fix":"Add a `dri3_screen_can_one_point_three()` capability check (or reuse the existing one since 1.3 uses no new driver interfaces) and report 1.3 before 1.4 in the version ladder.","locations":[{"ref":"Xext/dri3/dri3_request.c:89-123","code":"   89 |     DIX_FOR_EACH_SCREEN({\n   90 |         if (!dri3_screen_can_one_point_one(walkScreen)) {\n   91 |             reply.minorVersion = 0;\n   92 |             break;\n   93 |         }\n   94 |         if (!dri3_screen_can_one_point_two(walkScreen)) {\n   95 |             reply.minorVersion = 1;\n   96 |             break;\n   97 |         }\n   98 |         if (!dri3_screen_can_one_point_four(walkScreen)) {\n   99 |             reply.minorVersion = 2;\n  100 |             break;\n  101 |         } else {\n  102 |             reply.minorVersion = 4;\n  103 |             break;\n  104 |         }\n  105 |     });\n  106 | \n  107 |     DIX_FOR_EACH_GPU_SCREEN({\n  108 |         if (!dri3_screen_can_one_point_one(walkScreen)) {\n  109 |             reply.minorVersion = 0;\n  110 |             break;\n  111 |         }\n  112 |         if (!dri3_screen_can_one_point_two(walkScreen)) {\n  113 |             reply.minorVersion = 1;\n  114 |             break;\n  115 |         }\n  116 |         if (!dri3_screen_can_one_point_four(walkScreen)) {\n  117 |             reply.minorVersion = 2;\n  118 |             break;\n  119 |         } else {\n  120 |             reply.minorVersion = 4;\n  121 |             break;\n  122 |         }\n  123 |     });","lines":35,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/dri3/dri3_request.c#L89-L123"}]},
{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In __glXDRIscreenCreateDrawable() (DRI2 path), after DRI2CreateDrawable2 succeeds, createNewDrawable() is called to create the DRI drawable but the return value is stored in private->driDrawable without any NULL check. If the driver returns NULL, the function returns &private->base with a NULL driDrawable. All subsequent operations (swapBuffers, waitGL, waitX, destroy) dereference private->driDrawable unconditionally, causing a NULL pointer dereference.","fix":"Check the return value of createNewDrawable. If it is NULL, call FreeResource(private->dri2_id, FALSE), __glXDrawableRelease(), free(private), and return NULL.","locations":[{"ref":"Xext/glx/glx_dri/glxdri2.c:627-631","code":"  627 |     private->driDrawable =\n  628 |         (*driScreen->dri2->createNewDrawable) (driScreen->driScreen,\n  629 |                                                config->driConfig, private);\n  630 | \n  631 |     return &private->base;","lines":5,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/glx_dri/glxdri2.c#L627-L631"}]},
{"id":"LOGIC_33","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In glxdriswrast.c __glXDRIscreenCreateContext(), when core->createNewContext() returns NULL (e.g. out of memory), the function returns &context->base with context->driContext == NULL. All vtable callbacks (makeCurrent, loseCurrent, copy, destroy) then unconditionally dereference context->driContext, causing a NULL pointer dereference. By contrast, the DRI2 path correctly checks for NULL and frees the context.","fix":"After the createNewContext call, check if context->driContext is NULL; if so, free(context) and return NULL, mirroring the check done in the DRI2 path (glxdri2.c:565-568).","locations":[{"ref":"Xext/glx/glx_dri/glxdriswrast.c:233-237","code":"  233 |     context->driContext =\n  234 |         (*core->createNewContext) (screen->driScreen, driConfig, driShare,\n  235 |                                    context);\n  236 | \n  237 |     return &context->base;","lines":5,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/glx_dri/glxdriswrast.c#L233-L237"}]},
{"id":"LOGIC_34","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In __glXDRIscreenCreateDrawable() (swrast path), createNewDrawable() is called but its return value stored in private->driDrawable is never checked for NULL. If the driver returns NULL, the function returns &private->base with a NULL driDrawable and subsequent use (swapBuffers, destroy) will dereference it.","fix":"After the createNewDrawable call, check private->driDrawable != NULL; if NULL, call __glXDrawableRelease(), free(private), and return NULL.","locations":[{"ref":"Xext/glx/glx_dri/glxdriswrast.c:266-270","code":"  266 |     private->driDrawable =\n  267 |         (*driScreen->swrast->createNewDrawable) (driScreen->driScreen,\n  268 |                                                  config->driConfig, private);\n  269 | \n  270 |     return &private->base;","lines":5,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/glx_dri/glxdriswrast.c#L266-L270"}]},
{"id":"LOGIC_35","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"DoGetDrawableAttributes() accesses pGlxDraw->config->fbconfigID at line 1867 without guarding against a NULL config. With GLX_EXT_no_config_context enabled (which both DRI2 and swrast enable), a context can be created without an fbconfig and can then be bound to a drawable created under that context. If such a drawable's config pointer is NULL, the dereference is a NULL pointer dereference.","fix":"Wrap the ATTRIB(GLX_FBCONFIG_ID, ...) line in a check: only emit the attribute when pGlxDraw->config != NULL.","locations":[{"ref":"Xext/glx/glxcmds.c:1836-1842","code":" 1836 |     if (pGlxDraw) {\n 1837 |         ATTRIB(GLX_TEXTURE_TARGET_EXT,\n 1838 |                pGlxDraw->target == GL_TEXTURE_2D ?\n 1839 |                 GLX_TEXTURE_2D_EXT : GLX_TEXTURE_RECTANGLE_EXT);\n 1840 |         ATTRIB(GLX_EVENT_MASK, pGlxDraw->eventMask);\n 1841 |         ATTRIB(GLX_FBCONFIG_ID, pGlxDraw->config->fbconfigID);\n 1842 |         if (pGlxDraw->type == GLX_DRAWABLE_PBUFFER) {","lines":7,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/glxcmds.c#L1836-L1842"}]},
{"id":"LOGIC_36","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"__glXDisp_TexSubImage1D, __glXDisp_TexSubImage2D, and __glXDisp_TexSubImage3D all ignore the 'nullImage' field that is present at the end of their respective GLX protocol headers (offsets pc+52, pc+52, and pc+84 respectively). The protocol includes this field so that a NULL data pointer can be signalled, consistent with the treatment in __glXDisp_TexImage3D which checks the equivalent 'ptr_is_null' field before deciding whether to pass NULL or a data pointer. The TexSubImage variants unconditionally pass a non-NULL data pointer, which disagrees with the protocol definition and can cause the GL driver to read beyond the end of the packet when the client sets nullImage to indicate no data.","fix":"Read the nullImage flag (e.g., at pc+52 for TexSubImage1D/2D, pc+84 for TexSubImage3D) and pass NULL as the pixels argument when it is non-zero, matching the pattern used in __glXDisp_TexImage3D lines 3410-3412.","locations":[{"ref":"Xext/glx/indirect_dispatch.c:2688-2706","code":" 2688 | void\n 2689 | __glXDisp_TexSubImage1D(GLbyte * pc)\n 2690 | {\n 2691 |     const GLvoid *const pixels = (const GLvoid *) ((pc + 56));\n 2692 |     __GLXpixelHeader *const hdr = (__GLXpixelHeader *) (pc);\n 2693 | \n 2694 |     glPixelStorei(GL_UNPACK_SWAP_BYTES, hdr->swapBytes);\n 2695 |     glPixelStorei(GL_UNPACK_LSB_FIRST, hdr->lsbFirst);\n 2696 |     glPixelStorei(GL_UNPACK_ROW_LENGTH, (GLint) hdr->rowLength);\n 2697 |     glPixelStorei(GL_UNPACK_SKIP_ROWS, (GLint) hdr->skipRows);\n 2698 |     glPixelStorei(GL_UNPACK_SKIP_PIXELS, (GLint) hdr->skipPixels);\n 2699 |     glPixelStorei(GL_UNPACK_ALIGNMENT, (GLint) hdr->alignment);\n 2700 | \n 2701 |     glTexSubImage1D(*(GLenum *) (pc + 20),\n 2702 |                     *(GLint *) (pc + 24),\n 2703 |                     *(GLint *) (pc + 28),\n 2704 |                     *(GLsizei *) (pc + 36),\n 2705 |                     *(GLenum *) (pc + 44), *(GLenum *) (pc + 48), pixels);\n 2706 | }","lines":19,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/indirect_dispatch.c#L2688-L2706"},{"ref":"Xext/glx/indirect_dispatch.c:2708-2728","code":" 2708 | void\n 2709 | __glXDisp_TexSubImage2D(GLbyte * pc)\n 2710 | {\n 2711 |     const GLvoid *const pixels = (const GLvoid *) ((pc + 56));\n 2712 |     __GLXpixelHeader *const hdr = (__GLXpixelHeader *) (pc);\n 2713 | \n 2714 |     glPixelStorei(GL_UNPACK_SWAP_BYTES, hdr->swapBytes);\n 2715 |     glPixelStorei(GL_UNPACK_LSB_FIRST, hdr->lsbFirst);\n 2716 |     glPixelStorei(GL_UNPACK_ROW_LENGTH, (GLint) hdr->rowLength);\n 2717 |     glPixelStorei(GL_UNPACK_SKIP_ROWS, (GLint) hdr->skipRows);\n 2718 |     glPixelStorei(GL_UNPACK_SKIP_PIXELS, (GLint) hdr->skipPixels);\n 2719 |     glPixelStorei(GL_UNPACK_ALIGNMENT, (GLint) hdr->alignment);\n 2720 | \n 2721 |     glTexSubImage2D(*(GLenum *) (pc + 20),\n 2722 |                     *(GLint *) (pc + 24),\n 2723 |                     *(GLint *) (pc + 28),\n 2724 |                     *(GLint *) (pc + 32),\n 2725 |                     *(GLsizei *) (pc + 36),\n 2726 |                     *(GLsizei *) (pc + 40),\n 2727 |                     *(GLenum *) (pc + 44), *(GLenum *) (pc + 48), pixels);\n 2728 | }","lines":21,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/indirect_dispatch.c#L2708-L2728"},{"ref":"Xext/glx/indirect_dispatch.c:3434-3458","code":" 3434 | void\n 3435 | __glXDisp_TexSubImage3D(GLbyte * pc)\n 3436 | {\n 3437 |     const GLvoid *const pixels = (const GLvoid *) ((pc + 88));\n 3438 |     __GLXpixel3DHeader *const hdr = (__GLXpixel3DHeader *) (pc);\n 3439 | \n 3440 |     glPixelStorei(GL_UNPACK_SWAP_BYTES, hdr->swapBytes);\n 3441 |     glPixelStorei(GL_UNPACK_LSB_FIRST, hdr->lsbFirst);\n 3442 |     glPixelStorei(GL_UNPACK_ROW_LENGTH, (GLint) hdr->rowLength);\n 3443 |     glPixelStorei(GL_UNPACK_ {"id":"LOGIC_38","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In __glXDisp_Map1d (render2.c:94), the overflow guard condition checks 'order < 0 || k < 0' to skip\nmemmove when invalid. However order == 0 is also invalid (no control points), and k == 0 means the\ntarget is unknown; passing compsize == 0 to memmove is harmless but means glMap1d is later called\nwith order=0 and a garbage stride, which is an OpenGL error. The swap variant (__glXDispSwap_Map1d,\nrender2swap.c:135) correctly guards with 'order <= 0 || k < 0'. The non-swap variant has a weaker\ncheck, creating an inconsistency.","fix":"Change render2.c line 94 from 'order < 0 || k < 0' to 'order <= 0 || k < 0' to match the swap variant.","locations":[{"ref":"Xext/glx/render2.c:94","code":"   94 |     if (order < 0 || k < 0) {","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/render2.c#L94"},{"ref":"Xext/glx/render2swap.c:135","code":"  135 |     if (order <= 0 || k < 0) {","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/render2swap.c#L135"}]},
{"id":"LOGIC_39","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In __glXDisp_Map2d (render2.c:141), the guard for the __GLX_ALIGN64 memmove checks 'vorder < 0 ||\nuorder < 0 || k < 0'. This is weaker than the swap variant (__glXDispSwap_Map2d, render2swap.c:187)\nwhich checks 'vorder <= 0 || uorder <= 0 || k < 0'. The non-swap variant permits order == 0 which\nmeans zero control points; compsize becomes 0, but glMap2d is subsequently called with order = 0\nproducing a GL error that could have been avoided. More importantly the inconsistency with the swap\nvariant is a maintenance hazard.","fix":"Change render2.c line 141 from 'vorder < 0 || uorder < 0 || k < 0' to 'vorder <= 0 || uorder <= 0 || k < 0'.","locations":[{"ref":"Xext/glx/render2.c:141","code":"  141 |     if (vorder < 0 || uorder < 0 || k < 0) {","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/render2.c#L141"},{"ref":"Xext/glx/render2swap.c:187","code":"  187 |     if (vorder <= 0 || uorder <= 0 || k < 0) {","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/render2swap.c#L187"}]},
{"id":"LOGIC_40","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In __glXImageSize() (rensize.c), for the GL_BITMAP path, `rowSize = bits_to_bytes(groupsPerRow)` is checked for < 0, but then `rowSize += alignment - padding` is applied without overflow protection. Additionally, the return `safe_mul(safe_add(h, skipRows), rowSize)` does not guard against rowSize having overflowed before reaching safe_mul. This mirrors the non-bitmap path issue but is a separate code path.","fix":"Add overflow check before the padding addition: `if (padding && rowSize > INT_MAX - (alignment - padding)) return -1; rowSize += alignment - padding;`","locations":[{"ref":"Xext/glx/rensize.c:207-215","code":"  207 |         rowSize = bits_to_bytes(groupsPerRow);\n  208 |         if (rowSize < 0)\n  209 |             return -1;\n  210 |         padding = (rowSize % alignment);\n  211 |         if (padding) {\n  212 |             rowSize += alignment - padding;\n  213 |         }\n  214 | \n  215 |         return safe_mul(safe_add(h, skipRows), rowSize);","lines":9,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/rensize.c#L207-L215"}]},
{"id":"LOGIC_41","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"__glXSeparableFilter2DReqSize (rensize.c:465) returns 'safe_add(safe_pad(image1size), image2size)'\nwithout also padding image2size. The SeparableFilter2D protocol sends the column-kernel image\nimmediately after the row-kernel image, but the row-kernel image is only padded to a 4-byte boundary.\nThe column-kernel image (image2) is computed here without padding, meaning the total size check\ncomputes the sum of a padded row kernel and an unpadded column kernel. This under-counts when\nimage2size is not 4-byte aligned, potentially accepting packets that are too small to hold the\nfull padded column kernel. The dispatch code in renderpix.c pads image1len before offsetting\n(line 59: image1len = __GLX_PAD(image1len)) but does not pad image2len, so the buffer layout is\nalso ambiguous.","fix":"In rensize.c, change the return to 'safe_add(safe_pad(image1size), safe_pad(image2size))' to consistently pad both kernel sizes.","locations":[{"ref":"Xext/glx/rensize.c:465","code":"  465 |     return safe_add(safe_pad(image1size), image2size);","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/rensize.c#L465"},{"ref":"Xext/glx/renderpix.c:56-64","code":"   56 |     image1len = __glXImageSize(hdr->format, hdr->type, 0, hdr->width, 1, 1,\n   57 |                                0, hdr->rowLength, 0, hdr->skipRows,\n   58 |                                hdr->alignment);\n   59 |     image1len = __GLX_PAD(image1len);\n   60 | \n   61 |     glSeparableFilter2D(hdr->target, hdr->internalformat, hdr->width,\n   62 |                         hdr->height, hdr->format, hdr->type,\n   63 |                         ((GLubyte *) hdr + hdrlen),\n   64 |                         ((GLubyte *) hdr + hdrlen + image1len));","lines":9,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/glx/renderpix.c#L56-L64"}]},
{"id":"LOGIC_42","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"hookSelectionFilter (hook-selection.c) passes `origSelectionName` (the return\nvalue of `NameForAtom`) directly to `snprintf` as a `%s` argument at line 43\nwithout checking for NULL. `NameForAtom` returns NULL (integer 0) for invalid\nor out-of-range atoms. Passing NULL to `%s` in snprintf is undefined behavior\n(typically crashes or prints \"(null)\" and produces a wrong atom name, breaking\nnamespace isolation silently).","fix":"Check `if (!origSelectionName) return;` after line 40 before using it in snprintf.","locations":[{"ref":"Xext/namespace/hook-selection.c:42-45","code":"   42 |     const char *origSelectionName = NameForAtom(param->selection);\n   43 | \n   44 |     char selname[PATH_MAX] = { 0 };\n   45 |     snprintf(selname, sizeof(selname)-1, \"<%s>%s\", subj->ns->name, origSelectionName);","lines":4,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/namespace/hook-selection.c#L42-L45"}]},
{"id":"LOGIC_43","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"hookSelectionFilter (hook-selection.c) builds the namespaced selection name into\na stack buffer of `PATH_MAX` bytes (line 42). X atom names are limited only by\nthe X11 request size (CARD16 nbytes, so up to 65535 bytes), which far exceeds\nPATH_MAX (typically 4096). A client can intern a very long atom name and use it\nas a selection; the namespaced form `<ns>LONGNAME` would be silently truncated by\nsnprintf, producing a mangled atom that does not match the server-internal\nnamespaced atom. This breaks namespace selection isolation without error,\nallowing the selection operation to appear to succeed but be mis-routed.","fix":"Allocate the buffer dynamically using the actual lengths of the namespace name and the selection atom name, or validate that the combined length fits before constructing the string.","locations":[{"ref":"Xext/namespace/hook-selection.c:44-46","code":"   44 |     char selname[PATH_MAX] = { 0 };\n   45 |     snprintf(selname, sizeof(selname)-1, \"<%s>%s\", subj->ns->name, origSelectionName);\n   46 |     Atom realSelection = dixAddAtom(selname);","lines":3,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/namespace/hook-selection.c#L44-L46"}]},
{"id":"LOGIC_44","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"hookServerAccess (hook-server.c) blocks ALL X request opcodes not explicitly\nwhitelisted (X_ListFonts, X_ListFontsWithInfo) with BadAccess. Only X_GrabServer\nis explicitly rejected by name; every other opcode falls through to the\n`XNS_HOOK_LOG` + `reject:` path. The log message at line 29 says \"BLOCKED access\nto server configuration request\" for all these cases, but the ServerAccessCallback\nis fired for many non-configuration requests (e.g., DixReadAccess on font lists).\nAny X opcode that legitimately needs a ServerAccessCallback check (such as font\nqueries not yet whitelisted) is rejected with no meaningful error to the caller,\nbreaking legitimate non-configuration server access silently.","fix":"Add a default `goto pass;` case inside the switch (or after the switch before the log) so only explicitly denied operations are rejected. Review which access_mode values warrant a block.","locations":[{"ref":"Xext/namespace/hook-server.c:22-36","code":"   22 |     switch (client->majorOp) {\n   23 |         case X_ListFonts:\n   24 |         case X_ListFontsWithInfo:\n   25 |             goto pass;\n   26 | \n   27 |         case X_GrabServer:\n   28 |             goto reject;\n   29 |     }\n   30 | \n   31 |     XNS_HOOK_LOG(\"BLOCKED access to server configuration request %s\\n\",\n   32 |         LookupRequestName(client->majorOp, client->minorOp));\n   33 | \n   34 | reject:\n   35 |     param->status = BadAccess;\n   36 |     return;","lines":15,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/namespace/hook-server.c#L22-L36"}]},
{"id":"LOGIC_45","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"rrCheckPixmapBounding() builds up `total_region` with repeated RegionUnion() calls but never calls RegionUninit() on it (nor on `root_pixmap_region`) before returning. Once two or more disjoint CRTC boxes are unioned, RegionUnion allocates a heap RegionData that is leaked on every call. The function is reachable from ProcRRSetCrtcConfig -> RRCrtcSet whenever the CRTC lives on a GPU/PRIME screen (pScreen->isGPU), so an unprivileged client driving a PRIME output can leak a small amount of heap on each SetCrtcConfig request. Separately, `root_pixmap_region` is initialized (line 640) and never used afterwards - dead code (it is only a single-rect region so it does not itself leak, but the init is pointless).","fix":"Call `RegionUninit(&total_region);` (and drop the unused `root_pixmap_region` / `PixmapRegionInit` or uninit it too) before every `return` in rrCheckPixmapBounding(). Add the uninit just before `return TRUE;` at line 716.","locations":[{"ref":"Xext/randr/rrcrtc.c:643-644","code":"  643 |     PixmapRegionInit(&root_pixmap_region, screen_pixmap);\n  644 |     RegionInit(&total_region, NULL, 0);","lines":2,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/randr/rrcrtc.c#L643-L644"},{"ref":"Xext/randr/rrcrtc.c:702-719","code":"  702 |     newsize = RegionExtents(&total_region);\n  703 |     new_width = newsize->x2;\n  704 |     new_height = newsize->y2;\n  705 | \n  706 |     if (new_width < screen_pixmap->drawable.width)\n  707 |         new_width = screen_pixmap->drawable.width;\n  708 | \n  709 |     if (new_height < screen_pixmap->drawable.height)\n  710 |         new_height = screen_pixmap->drawable.height;\n  711 | \n  712 |     if (new_width <= screen_pixmap->drawable.width &&\n  713 |         new_height <= screen_pixmap->drawable.height) {\n  714 |     } else {\n  715 |         pScrPriv->rrScreenSetSize(pScreen, new_width, new_height, 0, 0);\n  716 |     }\n  717 | \n  718 |     /* set shatters TODO */\n  719 |     return TRUE;","lines":18,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/randr/rrcrtc.c#L702-L719"}]},
{"id":"LOGIC_46","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"ProcShapeSelectInput swaps `stuff->window` twice for byte-swapped clients. `X_REQUEST_FIELD_CARD32(window)` already swaps it, and then the leftover manual `if (client->swapped) swapl(&stuff->window);` swaps it back to the wrong byte order. As a result byte-swapped clients pass a byte-reversed XID to dixLookupWindow, causing BadWindow or selection on an unintended window. (The extra REQUEST_SIZE_MATCH on line 709 is also redundant, since X_REQUEST_HEAD_STRUCT already matched the size.)","fix":"Drop the redundant size check and the second swap; window is already swapped by X_REQUEST_FIELD_CARD32:\n```\n    X_REQUEST_HEAD_STRUCT(xShapeSelectInputReq);\n    X_REQUEST_FIELD_CARD32(window);\n\n    WindowPtr pWin;\n    ShapeEventPtr pNewShapeEvent;\n\n    X_CALL_CHECK_ERR(dixLookupWindow(&pWin, stuff->window, client, DixReceiveAccess));\n```","locations":[{"ref":"Xext/shape/shape.c:708-719","code":"  708 |     X_REQUEST_HEAD_STRUCT(xShapeSelectInputReq);\n  709 |     X_REQUEST_FIELD_CARD32(window);\n  710 | \n  711 |     WindowPtr pWin;\n  712 |     ShapeEventPtr pNewShapeEvent;\n  713 | \n  714 |     REQUEST_SIZE_MATCH(xShapeSelectInputReq);\n  715 | \n  716 |     if (client->swapped)\n  717 |         swapl(&stuff->window);\n  718 | \n  719 |     X_CALL_CHECK_ERR(dixLookupWindow(&pWin, stuff->window, client, DixReceiveAccess));","lines":12,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/shape/shape.c#L708-L719"}]},
{"id":"LOGIC_47","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In XkbUpdateActionVirtualMods(), the XkbSA_ISOLock case tests `(((tmp = XkbModActionVMods(&act->iso)) != 0) & changed) != 0`. The inner `(... != 0)` collapses the virtual-mod bitmask `tmp` to 0 or 1 before ANDing with `changed`, so the branch only fires when bit 0 (ShiftMask) of `changed` is set, instead of when any of the action's virtual-mod bits intersect `changed`. Compare the correct XkbSA_SetMods case immediately above (line 682): `((tmp = XkbModActionVMods(&act->mods)) & changed) != 0`. As a result ISOLock key actions do not get their real-mod mask recomputed when most virtual modifiers change (reachable via XKB requests that rebind virtual mods), leaving stale modifier masks on those keys.","fix":"Match the XkbSA_SetMods form:\nbefore:\n```c\n        if ((((tmp = XkbModActionVMods(&act->iso)) != 0) & changed) != 0) {\n```\nafter:\n```c\n        if (((tmp = XkbModActionVMods(&act->iso)) & changed) != 0) {\n```","locations":[{"ref":"Xext/xkeyboard/XKBMisc.c:691","code":"  691 |         if ((((tmp = XkbModActionVMods(&act->iso)) != 0) & changed) != 0) {","lines":1,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/xkeyboard/XKBMisc.c#L691"}]},
{"id":"LOGIC_48","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In ProcXkbGetDeviceInfo the reply header fields present/supported/unsupported/nDeviceLedFBs/dfltKbdFB/dfltLedFB/devType are byte-swapped TWICE for swapped clients: once in the manual `if (rpcbuf.swapped) { swaps(...); ... }` block (lines 6458-6466) and again via the X_REPLY_FIELD_CARD16/CARD32 macros at the end (lines 6501-6507). Two swaps cancel out, so a byte-swapped (cross-endian) client receives all of these fields in native (wrong) byte order, corrupting the entire GetDeviceInfo reply for such clients. reply.length is unaffected (computed before, re-swapped by the send helper), so only these seven fields are wrong.","fix":"Delete the redundant manual swap block; the X_REPLY_FIELD_* macros already perform the swap.\n\nBefore:\n```c\n    x_rpcbuf_t rpcbuf = { .swapped = client->swapped, .err_clear = TRUE };\n\n    if (rpcbuf.swapped) {\n        swaps(&reply.present);\n        swaps(&reply.supported);\n        swaps(&reply.unsupported);\n        swaps(&reply.nDeviceLedFBs);\n        swaps(&reply.dfltKbdFB);\n        swaps(&reply.dfltLedFB);\n        swapl(&reply.devType);\n    }\n```\nAfter:\n```c\n    x_rpcbuf_t rpcbuf = { .swapped = client->swapped, .err_clear = TRUE };\n```\n(The `X_REPLY_FIELD_CARD16(present)` … `X_REPLY_FIELD_CARD32(devType)` block at the end of the function is kept and performs the single required swap.)","locations":[{"ref":"Xext/xkeyboard/xkb.c:6457-6467","code":" 6457 |     x_rpcbuf_t rpcbuf = { .swapped = client->swapped, .err_clear = TRUE };\n 6458 | \n 6459 |     if (rpcbuf.swapped) {\n 6460 |         swaps(&reply.present);\n 6461 |         swaps(&reply.supported);\n 6462 |         swaps(&reply.unsupported);\n 6463 |         swaps(&reply.nDeviceLedFBs);\n 6464 |         swaps(&reply.dfltKbdFB);\n 6465 |         swaps(&reply.dfltLedFB);\n 6466 |         swapl(&reply.devType);\n 6467 |     }","lines":11,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/xkeyboard/xkb.c#L6457-L6467"},{"ref":"Xext/xkeyboard/xkb.c:6502-6508","code":" 6502 |     X_REPLY_FIELD_CARD16(present);\n 6503 |     X_REPLY_FIELD_CARD16(supported);\n 6504 |     X_REPLY_FIELD_CARD16(unsupported);\n 6505 |     X_REPLY_FIELD_CARD16(nDeviceLedFBs);\n 6506 |     X_REPLY_FIELD_CARD16(dfltKbdFB);\n 6507 |     X_REPLY_FIELD_CARD16(dfltLedFB);\n 6508 |     X_REPLY_FIELD_CARD32(devType);","lines":7,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/xkeyboard/xkb.c#L6502-L6508"}]},
{"id":"LOGIC_49","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"XkbCopySrvLedInfo() claims in its header comment to make a \"deep copy\" that \"behaves like the original one\", but for non-default feedbacks it allocates fresh, zero-filled `names` and `maps` arrays with calloc() and never copies the contents of `src->names[]`/`src->maps[]` into them. The memcpy only copies the struct (including the now-overwritten pointers and the stale `namesPresent`/`mapsPresent`/`effectiveState` bookkeeping). Any custom indicator names or indicator maps configured on a non-default Kbd/Led feedback (e.g. set via XkbSetDeviceInfo) are silently lost when device classes are deep-copied during hierarchy changes (DeepCopyKeyboardClasses / DeepCopyPointerClasses in Xext/xinput/exevents.c), while the *Present masks still advertise them as present, yielding inconsistent LED behavior on the copy. The comment is therefore misleading as well.","fix":"After allocating the new arrays for the non-default case, copy the contents from the source:\n```c\nif (!(sli_new->flags & XkbSLI_IsDefault)) {\n    sli_new->names = calloc(XkbNumIndicators, sizeof(Atom));\n    sli_new->maps  = calloc(XkbNumIndicators, sizeof(XkbIndicatorMapRec));\n    if (sli_new->names && src->names)\n        memcpy(sli_new->names, src->names, XkbNumIndicators * sizeof(Atom));\n    if (sli_new->maps && src->maps)\n        memcpy(sli_new->maps, src->maps, XkbNumIndicators * sizeof(XkbIndicatorMapRec));\n}\n```\nAlso fix the comment if a shallow copy of the array contents is actually intended.","locations":[{"ref":"Xext/xkeyboard/xkbLEDs.c:678-706","code":"  678 | XkbSrvLedInfoPtr\n  679 | XkbCopySrvLedInfo(DeviceIntPtr from,\n  680 |                   XkbSrvLedInfoPtr src, KbdFeedbackPtr kf, LedFeedbackPtr lf)\n  681 | {\n  682 |     XkbSrvLedInfoPtr sli_new = NULL;\n  683 | \n  684 |     if (!src)\n  685 |         goto finish;\n  686 | \n  687 |     sli_new = calloc(1, sizeof(XkbSrvLedInfoRec));\n  688 |     if (!sli_new)\n  689 |         goto finish;\n  690 | \n  691 |     memcpy(sli_new, src, sizeof(XkbSrvLedInfoRec));\n  692 |     if (sli_new->class == KbdFeedbackClass)\n  693 |         sli_new->fb.kf = kf;\n  694 |     else\n  695 |         sli_new->fb.lf = lf;\n  696 | \n  697 |     if (!(sli_new->flags & XkbSLI_IsDefault)) {\n  698 |         sli_new->names = calloc(XkbNumIndicators, sizeof(Atom));\n  699 |         sli_new->maps = calloc(XkbNumIndicators, sizeof(XkbIndicatorMapRec));\n  700 |     }                           /* else sli_new->names/maps is pointing to\n  701 |                                    dev->key->xkbInfo->desc->names->indicators;\n  702 |                                    dev->key->xkbInfo->desc->names->indicators; */\n  703 | \n  704 |  finish:\n  705 |     return sli_new;\n  706 | }","lines":29,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/Xext/xkeyboard/xkbLEDs.c#L678-L706"}]},
{"id":"LOGIC_50","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In the same rollback loop of RealizeCursorAllScreens, after the inner `while (pDevIt)` loop already unrealizes every cursor-bearing device (which includes the failed device pDev) on each previous screen, the trailing `if (walkScreen->UnrealizeCursor) walkScreen->UnrealizeCursor(pDev, walkScreen, pCurs);` unrealizes pDev a second time on every previous screen. On fully-completed previous screens pDev was realized exactly once, so this is a double-unrealize, which can cause driver-side double-free or refcount underflow. Upstream does not have this extra call. (Only observable once the unsigned-underflow bug above is fixed, but it is an independent defect.)","fix":"Remove the redundant trailing unrealize of pDev inside the previous-screens loop:\n```c\n                        if (walkScreen->UnrealizeCursor)\n                            walkScreen->UnrealizeCursor(pDev, walkScreen, pCurs);\n```\nThe inner `while (pDevIt)` loop already unrealizes pDev on previous screens.","locations":[{"ref":"dix/cursor.c:206-217","code":"  206 |                     while (--walkScreenIdx>= 0) {\n  207 |                         walkScreen = dixGetScreenPtr(walkScreenIdx);\n  208 |                         /* now unrealize all devices on previous screens */\n  209 |                         pDevIt = inputInfo.devices;\n  210 |                         while (pDevIt) {\n  211 |                             if (DevHasCursor(pDevIt) && walkScreen->UnrealizeCursor)\n  212 |                                 walkScreen->UnrealizeCursor(pDevIt, walkScreen, pCurs);\n  213 |                             pDevIt = pDevIt->next;\n  214 |                         }\n  215 |                         if (walkScreen->UnrealizeCursor)\n  216 |                             walkScreen->UnrealizeCursor(pDev, walkScreen, pCurs);\n  217 |                     }","lines":12,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/dix/cursor.c#L206-L217"}]},
{"id":"LOGIC_51","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"fbSetSpans() iterates the composite-clip box list with `while (n--)` but never advances `pbox`. It repeatedly examines only the first clip rectangle. For any window/drawable whose composite clip has more than one rectangle (e.g. a partially obscured window, or a clip spanning multiple bands), spans that fall in the second or later clip bands are never drawn (the first box's `y2 <= ppt->y` so nothing is blitted, and `y1` is not `> ppt->y` so the loop never breaks), while spans in the first band get blitted redundantly n times. This is a silent rendering-correctness bug on a core GC op, reachable from ordinary client drawing on multi-rect clips. The sibling function fbFillSpans() (fb/fbfillsp.c:81) has the required `pbox++;`.","fix":"Advance the box pointer at the end of the inner loop. Before:\n```c\n            }\n        }\n        src += PixmapBytePad(*pwidth, pDrawable->depth);\n```\nAfter:\n```c\n            }\n            pbox++;\n        }\n        src += PixmapBytePad(*pwidth, pDrawable->depth);\n```","locations":[{"ref":"fb/fbsetsp.c:51-71","code":"   51 |         while (n--) {\n   52 |             if (pbox->y1 > ppt->y)\n   53 |                 break;\n   54 |             if (pbox->y2 > ppt->y) {\n   55 |                 x1 = ppt->x;\n   56 |                 x2 = x1 + *pwidth;\n   57 |                 if (pbox->x1 > x1)\n   58 |                     x1 = pbox->x1;\n   59 |                 if (pbox->x2 < x2)\n   60 |                     x2 = pbox->x2;\n   61 |                 if (x1 < x2)\n   62 |                     fbBlt((FbBits *) s,\n   63 |                           0,\n   64 |                           (x1 - ppt->x) * dstBpp + xoff,\n   65 |                           d,\n   66 |                           dstStride,\n   67 |                           (x1 + dstXoff) * dstBpp,\n   68 |                           (x2 - x1) * dstBpp,\n   69 |                           1, pGC->alu, pPriv->pm, dstBpp, FALSE, FALSE);\n   70 |             }\n   71 |         }","lines":21,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/fb/fbsetsp.c#L51-L71"}]},
{"id":"LOGIC_52","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"glamor_font_init() is invoked once per screen, but it unconditionally calls xfont2_allocate_font_private_index() and resets glamor_font_screen_count to 0 on every call. On a multi-screen (Zaphod) server the second and later calls overwrite the global glamor_font_private_index with a freshly allocated index, leaking the previously allocated index and orphaning any per-font private data stored under the old index (fonts realized on earlier screens can no longer be found). The screen-count bookkeeping (used to size the per-screen privates array in glamor_font_get) is also reset each time. It should allocate the private index and initialize the counter only once.","fix":"Guard the one-time initialization, e.g. only call `xfont2_allocate_font_private_index()` and reset `glamor_font_screen_count` when the index has not yet been allocated (track with a static `initialized` flag or an initial sentinel value of the index), and only grow `glamor_font_screen_count` (never reset it to 0).","locations":[{"ref":"glamor/glamor_font.c:244-262","code":"  244 | glamor_font_init(ScreenPtr screen)\n  245 | {\n  246 |     glamor_screen_private *glamor_priv = glamor_get_screen_private(screen);\n  247 | \n  248 |     if (!glamor_glsl_has_ints(glamor_priv))\n  249 |         return TRUE;\n  250 | \n  251 |     glamor_font_private_index = xfont2_allocate_font_private_index();\n  252 |     if (glamor_font_private_index == -1)\n  253 |         return FALSE;\n  254 |     glamor_font_screen_count = 0;\n  255 | \n  256 |     if (screen->myNum >= glamor_font_screen_count)\n  257 |         glamor_font_screen_count = screen->myNum + 1;\n  258 | \n  259 |     screen->RealizeFont = glamor_realize_font;\n  260 |     screen->UnrealizeFont = glamor_unrealize_font;\n  261 |     return TRUE;\n  262 | }","lines":19,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/glamor/glamor_font.c#L244-L262"}]},
{"id":"LOGIC_53","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In translate_eglconfig() the pbuffer size attributes are only queried when `c->base.renderType & GLX_PBUFFER_BIT` is true (line 218), but `c->base.renderType` is not assigned until line 249 (`c->base.renderType = GLX_RGBA_BIT`). At line 218 the config struct was just calloc'd, so renderType is still 0 and the condition is always false. As a result EGL_MAX_PBUFFER_WIDTH/HEIGHT/PIXELS are never fetched and every fbconfig reports maxPbufferWidth/Height/Pixels == 0 to GLX clients. The intended field is almost certainly `drawableType`, which is set at line 174 and does contain GLX_PBUFFER_BIT.","fix":"Test the already-initialized drawable type instead of the not-yet-set render type:\n```c\nif (c->base.drawableType & GLX_PBUFFER_BIT) {\n    GET(EGL_MAX_PBUFFER_WIDTH, maxPbufferWidth);\n    GET(EGL_MAX_PBUFFER_HEIGHT, maxPbufferHeight);\n    GET(EGL_MAX_PBUFFER_PIXELS, maxPbufferPixels);\n}\n```","locations":[{"ref":"glamor/glamor_glx_provider.c:218-222","code":"  218 |     if (c->base.renderType & GLX_PBUFFER_BIT) {\n  219 |         GET(EGL_MAX_PBUFFER_WIDTH, maxPbufferWidth);\n  220 |         GET(EGL_MAX_PBUFFER_HEIGHT, maxPbufferHeight);\n  221 |         GET(EGL_MAX_PBUFFER_PIXELS, maxPbufferPixels);\n  222 |     }","lines":5,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/glamor/glamor_glx_provider.c#L218-L222"}]},
{"id":"LOGIC_54","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"Wrong struct field assigned in MouseInit. The comment says the code should skip protocol verification when the user explicitly supplied a protocol, i.e. jump the state machine straight to MouseWorking. But it writes `km->state = MouseWorking;` (km->state is the per-protocol private `unsigned long`) instead of `km->stage = MouseWorking;` (the KmouseStage verification field, which MouseInitProtocol just set to MouseBroken). Consequently the explicit protocol still has to pass full re-validation, and the protocol-private state is corrupted with the enum value 2 (affects logiParse which does `km->state & KD_BUTTON_2`).","fix":"Change `km->state = MouseWorking;` to `km->stage = MouseWorking;`.","locations":[{"ref":"hw/kdrive/linux/mouse.c:913-917","code":"  913 |         MouseFirstProtocol(km, pi->protocol ? pi->protocol : \"ps/2\");\n  914 |         /* MouseFirstProtocol sets state to MouseBroken for later protocol\n  915 |          * checks. Skip these checks if a protocol was supplied */\n  916 |         if (pi->protocol)\n  917 |             km->state = MouseWorking;","lines":5,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/kdrive/linux/mouse.c#L913-L917"}]},
{"id":"LOGIC_55","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"Inverted `strcmp` test in MsInit. `strcmp(pi->path, \"auto\")` is non-zero when the path is NOT \"auto\", so the intended \"default to /dev/mouse when path is missing or 'auto'\" becomes \"override any explicitly-configured device path with /dev/mouse, and leave the literal string 'auto' untouched\". A user-supplied device is ignored (and its strdup'd string leaked), while `-mouse ms` with path \"auto\" leaves pi->path == \"auto\" which then fails to open.","fix":"Before:\n```c\n    if (!pi->path || strcmp(pi->path, \"auto\"))\n        pi->path = strdup(\"/dev/mouse\");\n```\nAfter:\n```c\n    if (!pi->path || strcmp(pi->path, \"auto\") == 0)\n        pi->path = strdup(\"/dev/mouse\");\n```","locations":[{"ref":"hw/kdrive/linux/ms.c:93-94","code":"   93 |     if (!pi->path || strcmp(pi->path, \"auto\"))\n   94 |         pi->path = strdup(\"/dev/mouse\");","lines":2,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/kdrive/linux/ms.c#L93-L94"}]},
{"id":"LOGIC_56","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"MsEnable has two inverted control-flow bugs. (1) On open() failure it does `return 0;` which is `Success` (Status Success == 0), so the caller (KdPointerProc DEVICE_ON) thinks the device enabled fine even though nothing was opened. (2) `if (KdRegisterFd(port, MsRead, pi)) return TRUE;` returns on the SUCCESS path (KdRegisterFd returns TRUE on success) with the value TRUE (==1), which is NOT `Success`, so the caller treats a successful enable as a failure; worse, `pi->driverPrivate = (void*)(intptr_t)port;` and `return Success;` become dead code, so driverPrivate is never set and MsDisable later unregisters using fd 0, leaking the real fd. The 'ms' serial driver is effectively unusable.","fix":"Return `BadMatch` (or another error) on open failure instead of 0, and invert the register check:\n```c\n    if (!KdRegisterFd(port, MsRead, pi))\n        goto bail;\n    pi->driverPrivate = (void *) (intptr_t) port;\n    return Success;\n```","locations":[{"ref":"hw/kdrive/linux/ms.c:108-112","code":"  108 |     port = open(pi->path, O_RDWR | O_NONBLOCK);\n  109 |     if (port < 0) {\n  110 |         ErrorF(\"Couldn't open %s (%d)\\n\", pi->path, (int) errno);\n  111 |         return 0;\n  112 |     }","lines":5,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/kdrive/linux/ms.c#L108-L112"},{"ref":"hw/kdrive/linux/ms.c:144-148","code":"  144 |     if (KdRegisterFd(port, MsRead, pi))\n  145 |         return TRUE;\n  146 |     pi->driverPrivate = (void *) (intptr_t) port;\n  147 | \n  148 |     return Success;","lines":5,"link":"https://github.com/X11Libre/xserver/blob/b6384684a1726f732262e844399c798d2de59c57/hw/kdrive/linux/ms.c#L144-L148"}]},
