|             page_rw = PageRw::read(state).await?;\n  305 |             page_rw.set_page_read(PROPERTY_DISABLE);\n  306 |             page_rw.set_page_write(PROPERTY_DISABLE);\n  307 |             page_rw.write(state).await\n  308 |         })\n  309 |         .await\n  310 |     }","lines":50,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/iis2dulpx/src/driver.rs#L261-L310"}]},{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `Iis2dulpx::reboot` and `Iis2dulpx::sw_reset` (`iis2dulpx/src/driver.rs`), the retry loop uses an off-by-one comparison that reports failure even when the operation actually succeeded on the very last allowed attempt. Both functions loop `for _ in 0..BOOT_SWRESET_MAX_ATTEMPTS` (`BOOT_SWRESET_MAX_ATTEMPTS = 5`), incrementing `cnt` each time the poll condition (`ctrl4.boot()` / `ctrl1.sw_reset()`) is still active, and `break`-ing as soon as it clears (without incrementing `cnt` on that final, successful iteration). After the loop, both functions check `if cnt + 1 >= BOOT_SWRESET_MAX_ATTEMPTS { return Err(...) }`. If the register clears on iteration index `BOOT_SWRESET_MAX_ATTEMPTS - 1` (the last iteration), `cnt` will have been incremented on the previous `BOOT_SWRESET_MAX_ATTEMPTS - 1` iterations, so `cnt == BOOT_SWRESET_MAX_ATTEMPTS - 1`, making `cnt + 1 == BOOT_SWRESET_MAX_ATTEMPTS`, which satisfies `>=` and incorrectly returns `Error::FailedToBoot` / `Error::FailedToSwReset` even though the boot/reset procedure completed successfully.","fix":"Track success explicitly instead of inferring it from the counter, e.g.:\n```rust\nlet mut done = false;\nfor _ in 0..BOOT_SWRESET_MAX_ATTEMPTS {\n    let ctrl4 = Ctrl4::read(self).await?;\n    if ctrl4.boot() == PROPERTY_DISABLE {\n        done = true;\n        break;\n    }\n    self.tim.delay_ms(BOOT_TIME_DELAY_MS as u32).await;\n}\nif !done {\n    return Err(Error::FailedToBoot);\n}\n```\nApply the analogous change to `sw_reset`, replacing the `cnt + 1 >= BOOT_SWRESET_MAX_ATTEMPTS` check with a `done` flag set only on the success branch.","locations":[{"ref":"iis2dulpx/src/driver.rs:371-384","code":"  371 |         let mut cnt = 0;\n  372 |         for _ in 0..BOOT_SWRESET_MAX_ATTEMPTS {\n  373 |             let ctrl4 = Ctrl4::read(self).await?;\n  374 |             // boot procedure ended correctly\n  375 |             if ctrl4.boot() == PROPERTY_DISABLE {\n  376 |                 break;\n  377 |             }\n  378 |             self.tim.delay_ms(BOOT_TIME_DELAY_MS as u32).await;\n  379 |             cnt += 1;\n  380 |         }\n  381 | \n  382 |         if cnt + 1 >= BOOT_SWRESET_MAX_ATTEMPTS {\n  383 |             return Err(Error::FailedToBoot);\n  384 |         }","lines":14,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/iis2dulpx/src/driver.rs#L371-L384"},{"ref":"iis2dulpx/src/driver.rs:415-428","code":"  415 |         let mut cnt = 0;\n  416 |         for _ in 0..BOOT_SWRESET_MAX_ATTEMPTS {\n  417 |             self.tim.delay_us(SW_RESET_DELAY_US as u32).await;\n  418 |             let ctrl1 = Ctrl1::read(self).await?;\n  419 | \n  420 |             // sw-reset procedure ended correctly\n  421 |             if ctrl1.sw_reset() == 0 {\n  422 |                 break;\n  423 |             }\n  424 | \n  425 |             cnt += 1;\n  426 |         }\n  427 | \n  428 |         if cnt + 1 >= BOOT_SWRESET_MAX_ATTEMPTS {","lines":14,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/iis2dulpx/src/driver.rs#L415-L428"}]},{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`Ilps22qs::bus_mode_set` encodes `val.interface` (`Interface::SelByHw = 0x00`, `Interface::Spi3w = 0x03`) into two separate `IfCtrl` bits: `i2c_i3c_dis` gets bit 1 and `en_spi_read` gets bit 0 (`driver.rs:194-195`). `Ilps22qs::bus_mode_get` reconstructs the interface only from `if_ctrl.i2c_i3c_dis() << 1` and completely ignores `en_spi_read()` (`driver.rs:223`). When the device was configured with `Interface::Spi3w`, `i2c_i3c_dis` reads back as `1`, giving `1 << 1 == 2`, which is not a valid `Interface` discriminant (only `0` and `3` exist). `Interface::try_from(2)` therefore fails and `unwrap_or_default()` silently returns `Interface::SelByHw` instead of `Interface::Spi3w` - `bus_mode_get` can never correctly report that the device is in 3-wire SPI mode.","fix":"Combine both bits when reconstructing the value, mirroring how `bus_mode_set` encoded them:\n\n```rust\n// before\nlet interface = Interface::try_from(if_ctrl.i2c_i3c_dis() << 1).unwrap_or_default();\n// after\nlet interface =\n    Interface::try_from((if_ctrl.i2c_i3c_dis() << 1) | if_ctrl.en_spi_read()).unwrap_or_default();\n```","locations":[{"ref":"ilps22qs/src/driver.rs:219-227","code":"  219 |     pub async fn bus_mode_get(&mut self) -> Result<BusMode, Error<B::Error>> {\n  220 |         let if_ctrl = IfCtrl::read(self).await?;\n  221 |         let i3c_if_ctrl = I3cIfCtrl::read(self).await?;\n  222 | \n  223 |         let interface = Interface::try_from(if_ctrl.i2c_i3c_dis() << 1).unwrap_or_default();\n  224 |         let filter = Filter::try_from(i3c_if_ctrl.asf_on()).unwrap_or_default();\n  225 | \n  226 |         Ok(BusMode { interface, filter })\n  227 |     }","lines":9,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/ilps22qs/src/driver.rs#L219-L227"},{"ref":"ilps22qs/src/driver.rs:191-201","code":"  191 |     pub async fn bus_mode_set(&mut self, val: BusMode) -> Result<(), Error<B::Error>> {\n  192 |         let mut if_ctrl = IfCtrl::read(self).await?;\n  193 | \n  194 |         if_ctrl.set_i2c_i3c_dis(((val.interface as u8) & 0x02) >> 1);\n  195 |         if_ctrl.set_en_spi_read((val.interface as u8) & 0x01);\n  196 |         if_ctrl.write(self).await?;\n  197 | \n  198 |         let mut i3c_if_ctrl = I3cIfCtrl::read(self).await?;\n  199 |         i3c_if_ctrl.set_asf_on((val.filter as u8) & 0x01);\n  200 |         i3c_if_ctrl.write(self).await\n  201 |     }","lines":11,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/ilps22qs/src/driver.rs#L191-L201"}]},{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `Ilps22qs::mode_set` the `lfpf_cfg` bit of `CtrlReg2` is computed as `(val.lpf as u8 & 0x02) >> 2`, but bit 1 (mask `0x02`) must be shifted right by 1, not 2, to turn it into a 0/1 value. Since `0x02 >> 2` is always `0`, `lfpf_cfg` is always written as `0` regardless of `val.lpf`, so `Lpf::OdrDiv9` (raw discriminant `3`) can never actually be configured on the device - it silently behaves identically to `Lpf::OdrDiv4`. The matching read-back in `Ilps22qs::mode_get` has the same mistake (`<< 2` instead of `<< 1`), so `Lpf::try_from(...)` can never reconstruct `Lpf::OdrDiv9` either, even if the raw register bit were somehow set.","fix":"Change the shift amount from 2 to 1 in both places so bit 1 of `val.lpf`/`lfpf_cfg` round-trips correctly:\n\n```rust\n// driver.rs:509 - before\nctrl_reg2.set_lfpf_cfg((val.lpf as u8 & 0x02) >> 2);\n// after\nctrl_reg2.set_lfpf_cfg((val.lpf as u8 & 0x02) >> 1);\n```\n\n```rust\n// driver.rs:543-544 - before\nlet lpf =\n    Lpf::try_from((ctrl_reg2.lfpf_cfg() << 2) | ctrl_reg2.en_lpfp()).unwrap_or_default();\n// after\nlet lpf =\n    Lpf::try_from((ctrl_reg2.lfpf_cfg() << 1) | ctrl_reg2.en_lpfp()).unwrap_or_default();\n```","locations":[{"ref":"ilps22qs/src/driver.rs:509","code":"  509 |         ctrl_reg2.set_lfpf_cfg((val.lpf as u8 & 0x02) >> 2);","lines":1,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/ilps22qs/src/driver.rs#L509"},{"ref":"ilps22qs/src/driver.rs:543-544","code":"  543 |         let lpf =\n  544 |             Lpf::try_from((ctrl_reg2.lfpf_cfg() << 2) | ctrl_reg2.en_lpfp()).unwrap_or_default();","lines":2,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/ilps22qs/src/driver.rs#L543-L544"}]},{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The polling loops waiting for `xl_flag_data_ready_get() == 1` and `sh_status_get().sens_hub_endop() == 1` inside `Ism330dhcxPassthrough::write_bytes`/`write_byte_read_bytes` (sync and async variants) are unbounded `loop { ... }` with no iteration limit or timeout. If the addressed external slave never responds (e.g. wrong address, disconnected sensor, or a NACK that the code already fails to detect - see related finding), the accelerometer data-ready flag or `sens_hub_endop` bit may never become `1`, and the driver spins forever, hanging the calling task/thread with no way for the caller to recover.","fix":"Bound each polling loop with a maximum retry count (or use `tim`/`DelayNs` to enforce a timeout) and return an `Error` variant when the limit is exceeded, instead of looping unconditionally.","locations":[{"ref":"ism330dhcx/src/driver.rs:5427-5440","code":" 5427 |             loop {\n 5428 |                 let drdy = master.xl_flag_data_ready_get()?;\n 5429 |                 if drdy == 1 {\n 5430 |                     break;\n 5431 |                 }\n 5432 |             }\n 5433 | \n 5434 |             let mut master_status;\n 5435 |             loop {\n 5436 |                 master_status = master.sh_status_get()?;\n 5437 |                 if master_status.sens_hub_endop() == 1 {\n 5438 |                     break;\n 5439 |                 }\n 5440 |             }","lines":14,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/ism330dhcx/src/driver.rs#L5427-L5440"},{"ref":"ism330dhcx/src/driver.rs:5477-5490","code":" 5477 |         let _ = master.acceleration_raw_get()?;\n 5478 |         loop {\n 5479 |             let drdy = master.xl_flag_data_ready_get()?;\n 5480 |             if drdy == 1 {\n 5481 |                 break;\n 5482 |             }\n 5483 |         }\n 5484 |         let mut master_status;\n 5485 |         loop {\n 5486 |             master_status = master.sh_status_get()?;\n 5487 |             if master_status.sens_hub_endop() == 1 {\n 5488 |                 break;\n 5489 |             }\n 5490 |         }","lines":14,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/ism330dhcx/src/driver.rs#L5477-L5490"},{"ref":"ism330dhcx/src/driver.rs:5547-5560","code":" 5547 |             loop {\n 5548 |                 let drdy = master.xl_flag_data_ready_get().await?;\n 5549 |                 if drdy == 1 {\n 5550 |                     break;\n 5551 |                 }\n 5552 |             }\n 5553 | \n 5554 |             let mut master_status;\n 5555 |             loop {\n 5556 |                 master_status = master.sh_status_get().await?;\n 5557 |                 if master_status.sens_hub_endop() == 1 {\n 5558 |                     break;\n 5559 |                 }\n 5560 |             }","lines":14,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/ism330dhcx/src/driver.rs#L5547-L5560"},{"ref":"ism330dhcx/src/driver.rs:5597-5610","code":" 5597 |         let _ = master.acceleration_raw_get().await?;\n 5598 |         loop {\n 5599 |             let drdy = master.xl_flag_data_ready_get().await?;\n 5600 |             if drdy == 1 {\n 5601 |                 break;\n 5602 |             }\n 5603 |         }\n 5604 |         let mut master_status;\n 5605 |         loop {\n 5606 |             master_status = master.sh_status_get().await?;\n 5607 |             if master_status.sens_hub_endop() == 1 {\n 5608 |                 break;\n 5609 |             }\n 5610 |         }","lines":14,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/ism330dhcx/src/driver.rs#L5597-L5610"}]},{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `Ism6hg256x::gy_eis_data_rate_set` the guard is written as `val != EisGyDataRate::OdrOff && (A) || (B)` where `A` is `ctrl1.odr_xl() != Off && ctrl1.op_mode_xl() == OdrTriggered` and `B` is `ctrl2.odr_g() != Off && ctrl2.op_mode_g() == OdrTriggered`. Because `&&` binds tighter than `||` in Rust, this parses as `(val != OdrOff && A) || B`, so the `val != EisGyDataRate::OdrOff` guard only gates the accelerometer check `A` and not the gyroscope check `B`. The comment above (`// if xl or gy are ON in odr triggered mode, eis cannot be turned on`) makes clear the intent was for the whole condition to only matter when the caller is trying to turn EIS *on* (`val != OdrOff`). As written, even a call meant to disable EIS (`val == EisGyDataRate::OdrOff`) is incorrectly rejected with `Error::InvalidConfiguration` whenever the gyroscope happens to be in ODR-triggered mode, making it impossible to turn EIS off in that configuration.","fix":"Add parentheses so the `val != EisGyDataRate::OdrOff` guard covers both sub-conditions:\n\n```rust\n// driver.rs:2053-2060 - before\nif val != EisGyDataRate::OdrOff\n    && (ctrl1.odr_xl() != (DataRate::Off as u8)\n        && ctrl1.op_mode_xl() == (XlMode::OdrTriggered as u8))\n    || (ctrl2.odr_g() != (DataRate::Off as u8)\n        && ctrl2.op_mode_g() == (GyMode::OdrTriggered as u8))\n{\n    return Err(Error::InvalidConfiguration);\n}\n// driver.rs:2053-2060 - after\nif val != EisGyDataRate::OdrOff\n    && ((ctrl1.odr_xl() != (DataRate::Off as u8)\n        && ctrl1.op_mode_xl() == (XlMode::OdrTriggered as u8))\n        || (ctrl2.odr_g() != (DataRate::Off as u8)\n            && ctrl2.op_mode_g() == (GyMode::OdrTriggered as u8)))\n{\n    return Err(Error::InvalidConfiguration);\n}\n```","locations":[{"ref":"ism6hg256x/src/driver.rs:2053-2060","code":" 2053 |         if val != EisGyDataRate::OdrOff\n 2054 |             && (ctrl1.odr_xl() != (DataRate::Off as u8)\n 2055 |                 && ctrl1.op_mode_xl() == (XlMode::OdrTriggered as u8))\n 2056 |             || (ctrl2.odr_g() != (DataRate::Off as u8)\n 2057 |                 && ctrl2.op_mode_g() == (GyMode::OdrTriggered as u8))\n 2058 |         {\n 2059 |             return Err(Error::InvalidConfiguration);\n 2060 |         }","lines":8,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/ism6hg256x/src/driver.rs#L2053-L2060"}]},{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In both `ln_pg_write` and `ln_pg_read`, the `len > buf.len() as u8` buffer-size validation runs only after the function has already written `PageRw` (enabling page write/read mode), `PageSel` (selecting the page number), and, in `ln_pg_write`, `PageAddress` to the device. If the check fails, the function returns `Err(Error::BufferTooSmall)` immediately without ever disabling `page_write`/`page_read` in `PageRw` or resetting `PageSel`, unlike the normal success path which explicitly resets `page_sel` to `0` and both `page_read`/`page_write` to `PROPERTY_DISABLE` before returning. This leaves the embedded-function advanced-features page left in an enabled read/write state after an error, so any subsequent unrelated access to that memory bank / page could unexpectedly read or write through the still-armed page mechanism.","fix":"Perform the `len > buf.len() as u8` length check before any register is written (as the very first statement in each closure), so a caller error never mutates device state:\n```rust\nself.operate_over_emb(async |state| {\n    let [mut lsb, mut msb] = address.to_le_bytes();\n\n    if len > buf.len() as u8 {\n        return Err(Error::BufferTooSmall);\n    }\n\n    // page write\n    let mut page_rw = PageRw::read(state).await?;\n    ...\n})\n```\nAlternatively, if the check must stay where it is, disable `page_write`/`page_read` and reset `page_sel` on the error path before returning, mirroring the cleanup already done on the success path.","locations":[{"ref":"lis2dux12/src/driver.rs:198-212","code":"  198 |             let mut page_rw = PageRw::read(state).await?;\n  199 |             page_rw.set_page_read(PROPERTY_DISABLE);\n  200 |             page_rw.set_page_write(PROPERTY_ENABLE);\n  201 |             page_rw.write(state).await?;\n  202 | \n  203 |             // set page num\n  204 |             let mut page_sel = PageSel::default().with_page_sel(msb);\n  205 |             page_sel.write(state).await?;\n  206 | \n  207 |             // set page addr\n  208 |             PageAddress::from_bits(lsb).write(state).await?;\n  209 | \n  210 |             if len > buf.len() as u8 {\n  211 |                 return Err(Error::BufferTooSmall);\n  212 |             }","lines":15,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/lis2dux12/src/driver.rs#L198-L212"},{"ref":"lis2dux12/src/driver.rs:271-282","code":"  271 |             let mut page_rw = PageRw::read(state).await?;\n  272 |             page_rw.set_page_read(PROPERTY_ENABLE);\n  273 |             page_rw.set_page_write(PROPERTY_DISABLE);\n  274 |             page_rw.write(state).await?;\n  275 | \n  276 |             // set page num\n  277 |             let mut page_sel = PageSel::default().with_page_sel(msb);\n  278 |             page_sel.write(state).await?;\n  279 | \n  280 |             if len > buf.len() as u8 {\n  281 |                 return Err(Error::BufferTooSmall);\n  282 |             }","lines":12,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/lis2dux12/src/driver.rs#L271-L282"}]},{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`Lis2duxs12::reboot` and `Lis2duxs12::sw_reset` (`lis2duxs12/src/driver.rs`) have an off-by-one error in their retry-exhaustion check. Both loop up to `BOOT_SWRESET_MAX_ATTEMPTS` (5) times, `break`-ing out as soon as the status bit clears, and only incrementing `cnt` on a failed attempt. After the loop, both check `if cnt + 1 >= BOOT_SWRESET_MAX_ATTEMPTS { return Err(...) }`. If success happens on exactly the final (5th) attempt, `cnt` will be 4 (incremented after each of the first 4 failed attempts, not incremented on the successful 5th attempt that breaks the loop), so `cnt + 1 == 5 >= 5` is true and the function incorrectly returns `Error::FailedToBoot` / `Error::FailedToSwReset` even though the device did successfully complete the boot/reset.","fix":"Track success explicitly instead of inferring it from the retry counter, e.g.:\n```rust\nlet mut ok = false;\nfor _ in 0..BOOT_SWRESET_MAX_ATTEMPTS {\n    let ctrl4 = Ctrl4::read(self).await?;\n    if ctrl4.boot() == PROPERTY_DISABLE {\n        ok = true;\n        break;\n    }\n    self.tim.delay_ms(BOOT_TIME_DELAY_MS as u32).await;\n}\nif !ok {\n    return Err(Error::FailedToBoot);\n}\n```\nApply the same pattern to `sw_reset`.","locations":[{"ref":"lis2duxs12/src/driver.rs:366-387","code":"  366 |     pub async fn reboot(&mut self) -> Result<(), Error<B::Error>> {\n  367 |         let mut ctrl4 = Ctrl4::read(self).await?;\n  368 |         ctrl4.set_boot(PROPERTY_ENABLE);\n  369 |         ctrl4.write(self).await?;\n  370 | \n  371 |         let mut cnt = 0;\n  372 |         for _ in 0..BOOT_SWRESET_MAX_ATTEMPTS {\n  373 |             let ctrl4 = Ctrl4::read(self).await?;\n  374 |             // boot procedure ended correctly\n  375 |             if ctrl4.boot() == PROPERTY_DISABLE {\n  376 |                 break;\n  377 |             }\n  378 |             self.tim.delay_ms(BOOT_TIME_DELAY_MS as u32).await;\n  379 |             cnt += 1;\n  380 |         }\n  381 | \n  382 |         if cnt + 1 >= BOOT_SWRESET_MAX_ATTEMPTS {\n  383 |             return Err(Error::FailedToBoot);\n  384 |         }\n  385 | \n  386 |         Ok(())\n  387 |     }","lines":22,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/lis2duxs12/src/driver.rs#L366-L387"},{"ref":"lis2duxs12/src/driver.rs:410-433","code":"  410 |     pub async fn sw_reset(&mut self) -> Result<(), Error<B::Error>> {\n  411 |         let mut ctrl1 = Ctrl1::read(self).await?;\n  412 |         ctrl1.set_sw_reset(PROPERTY_ENABLE);\n  413 |         ctrl1.write(self).await?;\n  414 | \n  415 |         let mut cnt = 0;\n  416 |         for _ in 0..BOOT_SWRESET_MAX_ATTEMPTS {\n  417 |             self.tim.delay_us(SW_RESET_DELAY_US as u32).await;\n  418 |             let ctrl1 = Ctrl1::read(self).await?;\n  419 | \n  420 |             // sw-reset procedure ended correctly\n  421 |             if ctrl1.sw_reset() == 0 {\n  422 |                 break;\n  423 |             }\n  424 | \n  425 |             cnt += 1;\n  426 |         }\n  427 | \n  428 |         if cnt + 1 >= BOOT_SWRESET_MAX_ATTEMPTS {\n  429 |             return Err(Error::FailedToSwReset);\n  430 |         }\n  431 | \n  432 |         Ok(())\n  433 |     }","lines":24,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/lis2duxs12/src/driver.rs#L410-L433"}]},{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `Lsm6dsv320x::gy_eis_data_rate_set` (lsm6dsv320x/src/driver.rs:2053-2058), the guard condition is written as `val != EisGyDataRate::OdrOff && (xl_triggered) || (gy_triggered)` without an enclosing set of parentheses around the whole `(xl_triggered) || (gy_triggered)` expression. Because `&&` binds tighter than `||` in Rust, this parses as `(val != OdrOff && xl_triggered) || gy_triggered`, not the intended `val != OdrOff && (xl_triggered || gy_triggered)`. As a result, whenever the gyroscope is running in `OdrTriggered` mode with a non-`Off` ODR, the function returns `Error::InvalidConfiguration` for *every* call, including calls that pass `val == EisGyDataRate::OdrOff` (i.e. attempts to disable/turn off the EIS gyroscope channel), which should always be allowed.","fix":"Wrap the two OR'd sub-conditions together so the leading `val != EisGyDataRate::OdrOff` guards both of them:\n```rust\nif val != EisGyDataRate::OdrOff\n    && ((ctrl1.odr_xl() != (DataRate::Off as u8)\n        && ctrl1.op_mode_xl() == (XlMode::OdrTriggered as u8))\n        || (ctrl2.odr_g() != (DataRate::Off as u8)\n            && ctrl2.op_mode_g() == (GyMode::OdrTriggered as u8)))\n{\n    return Err(Error::InvalidConfiguration);\n}\n```","locations":[{"ref":"lsm6dsv320x/src/driver.rs:2044-2065","code":" 2044 |     /// Enables and selects the ODR of the gyroscope EIS channel.\n 2045 |     pub async fn gy_eis_data_rate_set(\n 2046 |         &mut self,\n 2047 |         val: EisGyDataRate,\n 2048 |     ) -> Result<(), Error<B::Error>> {\n 2049 |         let ctrl1 = Ctrl1::read(self).await?;\n 2050 |         let ctrl2 = Ctrl2::read(self).await?;\n 2051 | \n 2052 |         // if xl or gy are ON in odr triggered mode, eis cannot be turned on\n 2053 |         if val != EisGyDataRate::OdrOff\n 2054 |             && (ctrl1.odr_xl() != (DataRate::Off as u8)\n 2055 |                 && ctrl1.op_mode_xl() == (XlMode::OdrTriggered as u8))\n 2056 |             || (ctrl2.odr_g() != (DataRate::Off as u8)\n 2057 |                 && ctrl2.op_mode_g() == (GyMode::OdrTriggered as u8))\n 2058 |         {\n 2059 |             return Err(Error::InvalidConfiguration);\n 2060 |         }\n 2061 | \n 2062 |         let mut ctrl_eis = CtrlEis::read(self).await?;\n 2063 |         ctrl_eis.set_odr_g_eis((val as u8) & 0x03);\n 2064 |         ctrl_eis.write(self).await\n 2065 |     }","lines":22,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/lsm6dsv320x/src/driver.rs#L2044-L2065"}]},{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`Ism330is::sh_slv_cfg_read` maps the caller-supplied `idx` to a slave register set via three separate `match idx { 0 => .., 1 => .., 2 => .., 3 => .., _ => SensHubReg::Slv0... }` expressions (`driver.rs:922-928`, `931-937`, `941-947`). Any `idx` value of 4 or greater silently falls back to the `Slv0` registers instead of signalling an error, so a caller that passes an out-of-range slave index ends up silently reconfiguring slave 0 instead of getting a clear failure.","fix":"Return `Err(Error::UnexpectedValue)` for `idx > 3` instead of silently defaulting to the `Slv0*` registers in each `match`.","locations":[{"ref":"ism330is/src/driver.rs:921-947","code":"  921 |         slv_add.set_rw_0(1);\n  922 |         let slv_add_reg = match idx {\n  923 |             0 => SensHubReg::Slv0Add,\n  924 |             1 => SensHubReg::Slv1Add,\n  925 |             2 => SensHubReg::Slv2Add,\n  926 |             3 => SensHubReg::Slv3Add,\n  927 |             _ => SensHubReg::Slv0Add,\n  928 |         };\n  929 |         self.write_to_register(slv_add_reg as u8, &[slv_add.into()])\n  930 |             .await?;\n  931 |         let slv_sub_add_reg = match idx {\n  932 |             0 => SensHubReg::Slv0Subadd,\n  933 |             1 => SensHubReg::Slv1Subadd,\n  934 |             2 => SensHubReg::Slv2Subadd,\n  935 |             3 => SensHubReg::Slv3Subadd,\n  936 |             _ => SensHubReg::Slv0Subadd,\n  937 |         };\n  938 |         self.write_to_register(slv_sub_add_reg as u8, &[val.slv_subadd])\n  939 |             .await?;\n  940 | \n  941 |         let slv_config_reg = match idx {\n  942 |             0 => SensHubReg::Slv0Config,\n  943 |             1 => SensHubReg::Slv1Config,\n  944 |             2 => SensHubReg::Slv2Config,\n  945 |             3 => SensHubReg::Slv3Config,\n  946 |             _ => SensHubReg::Slv0Config,\n  947 |         };","lines":27,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/ism330is/src/driver.rs#L921-L947"}]},{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"easy","description":"`Asm330lhh::pin_int1_route_set` never writes the `Int1Ctrl` register to the device. It only calls `val.md1_cfg.write(self).await?` and then reads `val.int1_ctrl.into_bits()` purely to decide whether to set `interrupts_enable` in `IntCfg1`, but the `int1_ctrl` bitfield itself is never sent over the bus with `.write()`. The sibling function `pin_int2_route_set` (a few lines below) correctly calls both `val.int2_ctrl.write(self).await?` and `val.md2_cfg.write(self).await?`, confirming this is a missing line rather than intentional behavior. As written, any caller that configures `PinInt1Route::int1_ctrl` (e.g. `int1_drdy_xl`, `int1_drdy_g`, `int1_fifo_th`, `int1_boot`, ...) will have those settings silently dropped - the INT1_CTRL register on the device keeps its old value.","fix":"Add the missing write of `val.int1_ctrl`, mirroring `pin_int2_route_set`:\n```rust\npub async fn pin_int1_route_set(\n    &mut self,\n    val: &mut PinInt1Route,\n) -> Result<(), Error<B::Error>> {\n    val.int1_ctrl.write(self).await?;\n    val.md1_cfg.write(self).await?;\n\n    let mut int1_cfg = IntCfg1::read(self).await?;\n    ...\n```","locations":[{"ref":"asm330lhh/src/driver.rs:1211-1226","code":" 1211 |     pub async fn pin_int1_route_set(\n 1212 |         &mut self,\n 1213 |         val: &mut PinInt1Route,\n 1214 |     ) -> Result<(), Error<B::Error>> {\n 1215 |         val.md1_cfg.write(self).await?;\n 1216 | \n 1217 |         let mut int1_cfg = IntCfg1::read(self).await?;\n 1218 | \n 1219 |         if (val.int1_ctrl.into_bits() | val.md1_cfg.into_bits()) != PROPERTY_DISABLE {\n 1220 |             int1_cfg.set_interrupts_enable(PROPERTY_ENABLE);\n 1221 |         } else {\n 1222 |             int1_cfg.set_interrupts_enable(PROPERTY_DISABLE);\n 1223 |         }\n 1224 | \n 1225 |         int1_cfg.write(self).await\n 1226 |     }","lines":16,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/asm330lhh/src/driver.rs#L1211-L1226"}]},{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"very_easy","description":"In `Ism330is::all_sources_get`, the `AllSources` struct fields `sh_slave0_nack`, `sh_slave1_nack`, `sh_slave2_nack`, `sh_slave3_nack`, and `sh_wr_once` are all assigned `status_sh.sens_hub_endop()` instead of their own corresponding accessors (`status_sh.slave0_nack()`, `status_sh.slave1_nack()`, `status_sh.slave2_nack()`, `status_sh.slave3_nack()`, `status_sh.wr_once_done()`). `StatusMasterMainpage` (see `ism330is/src/register/main.rs:496-511`) exposes these as five distinct 1-bit fields. As written, callers of `all_sources_get` always get the sensor-hub end-of-operation flag copied into every one of those five fields, so the individual slave NACK flags and the write-once-done flag are never actually reported - `sh_endop` is the only field that happens to be correct.","fix":"Use the dedicated accessor for each field instead of repeating `sens_hub_endop()`:\n\n```rust\n// before\nlet val = AllSources {\n    drdy_xl: status_reg.xlda(),\n    drdy_gy: status_reg.gda(),\n    drdy_temp: status_reg.tda(),\n    sh_endop: status_sh.sens_hub_endop(),\n    sh_slave0_nack: status_sh.sens_hub_endop(),\n    sh_slave1_nack: status_sh.sens_hub_endop(),\n    sh_slave2_nack: status_sh.sens_hub_endop(),\n    sh_slave3_nack: status_sh.sens_hub_endop(),\n    sh_wr_once: status_sh.sens_hub_endop(),\n    ispu,\n};\n\n// after\nlet val = AllSources {\n    drdy_xl: status_reg.xlda(),\n    drdy_gy: status_reg.gda(),\n    drdy_temp: status_reg.tda(),\n    sh_endop: status_sh.sens_hub_endop(),\n    sh_slave0_nack: status_sh.slave0_nack(),\n    sh_slave1_nack: status_sh.slave1_nack(),\n    sh_slave2_nack: status_sh.slave2_nack(),\n    sh_slave3_nack: status_sh.slave3_nack(),\n    sh_wr_once: status_sh.wr_once_done(),\n    ispu,\n};\n```","locations":[{"ref":"ism330is/src/driver.rs:543-562","code":"  543 |     pub async fn all_sources_get(&mut self) -> Result<AllSources, Error<B::Error>> {\n  544 |         let status_reg = StatusReg::read(self).await?;\n  545 |         let status_sh = StatusMasterMainpage::read(self).await?;\n  546 |         let ispu = IspuIntStatusMainPage::read(self).await.map(|reg| reg.0)?;\n  547 | \n  548 |         let val = AllSources {\n  549 |             drdy_xl: status_reg.xlda(),\n  550 |             drdy_gy: status_reg.gda(),\n  551 |             drdy_temp: status_reg.tda(),\n  552 |             sh_endop: status_sh.sens_hub_endop(),\n  553 |             sh_slave0_nack: status_sh.sens_hub_endop(),\n  554 |             sh_slave1_nack: status_sh.sens_hub_endop(),\n  555 |             sh_slave2_nack: status_sh.sens_hub_endop(),\n  556 |             sh_slave3_nack: status_sh.sens_hub_endop(),\n  557 |             sh_wr_once: status_sh.sens_hub_endop(),\n  558 |             ispu,\n  559 |         };\n  560 | \n  561 |         Ok(val)\n  562 |     }","lines":20,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/ism330is/src/driver.rs#L543-L562"}]},{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"very_easy","description":"`Ism330is::ispu_bdu_get` reads `reg.ispu_rate()` (the 4-bit ISPU output-data-rate field of `Ctrl9C`) and tries to convert that into an `IspuBdu` value, instead of reading `reg.ispu_bdu()` (the actual 2-bit BDU field, see `ism330is/src/register/main.rs:374-395`). This is the mirror-image bug of the adjacent `ispu_data_rate_get`, which correctly reads `ispu_rate()` - it looks like `ispu_bdu_get` was copy-pasted from it and the field accessor was never updated. Because `ispu_rate` and `ispu_bdu` occupy different bits of the same register, `ispu_bdu_get` returns a value derived from the ODR configuration rather than the actual BDU setting; whenever the raw rate value falls outside the 2-bit `IspuBdu` discriminant range, `unwrap_or_default()` silently masks the error by returning the default variant, so the function practically never reports the true BDU state configured via `ispu_bdu_set`.","fix":"Read the `ispu_bdu` field instead of `ispu_rate`:\n\n```rust\n// before\npub async fn ispu_bdu_get(&mut self) -> Result<IspuBdu, Error<B::Error>> {\n    let ispu_rate = Ctrl9C::read(self).await.map(|reg| reg.ispu_rate())?;\n\n    Ok(IspuBdu::try_from(ispu_rate).unwrap_or_default())\n}\n\n// after\npub async fn ispu_bdu_get(&mut self) -> Result<IspuBdu, Error<B::Error>> {\n    let ispu_bdu = Ctrl9C::read(self).await.map(|reg| reg.ispu_bdu())?;\n\n    Ok(IspuBdu::try_from(ispu_bdu).unwrap_or_default())\n}\n```","locations":[{"ref":"ism330is/src/driver.rs:1016-1029","code":" 1016 |     pub async fn ispu_bdu_set(&mut self, val: IspuBdu) -> Result<(), Error<B::Error>> {\n 1017 |         let mut ctrl9_c = Ctrl9C::read(self).await?;\n 1018 |         ctrl9_c.set_ispu_bdu((val as u8) & 0x3);\n 1019 |         ctrl9_c.write(self).await?;\n 1020 | \n 1021 |         Ok(())\n 1022 |     }\n 1023 | \n 1024 |     /// Get the actual ISPU BDU mode.\n 1025 |     pub async fn ispu_bdu_get(&mut self) -> Result<IspuBdu, Error<B::Error>> {\n 1026 |         let ispu_rate = Ctrl9C::read(self).await.map(|reg| reg.ispu_rate())?;\n 1027 | \n 1028 |         Ok(IspuBdu::try_from(ispu_rate).unwrap_or_default())\n 1029 |     }","lines":14,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/ism330is/src/driver.rs#L1016-L1029"}]},{"id":"CPY_4","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"very_easy","description":"In `register/if2.rs`, the `If2OutXYZAOIS` struct (documented as `IF2_OUTX_L_A_OIS` to `IF2_OUTZ_H_A_OIS`, the OIS accelerometer output registers at addresses `0x28`-`0x2D`, i.e. `If2Reg::OutxLAOis`) is annotated with `#[named_register(address = If2Reg::OutxLGOis, ...)]`, which is the address of the OIS gyroscope registers (`0x22`-`0x27`), copy-pasted from the `If2OutXYZGOIS` struct defined right above it. Any consumer calling `If2OutXYZAOIS::read()` will actually read the gyroscope OIS output registers and get angular-rate data mislabeled as linear-acceleration data.","fix":"```rust\n// if2.rs:112 - before\n#[named_register(address = If2Reg::OutxLGOis, access_type = \"Ism6hg256x<B, T, MainBank>\")]\npub struct If2OutXYZAOIS {\n// if2.rs:112 - after\n#[named_register(address = If2Reg::OutxLAOis, access_type = \"Ism6hg256x<B, T, MainBank>\")]\npub struct If2OutXYZAOIS {\n```","locations":[{"ref":"ism6hg256x/src/register/if2.rs:108-117","code":"  108 | /// IF2_OUTX_L_A_OIS to IF2_OUTZ_H_A_OIS (0x28 - 0x2D)\n  109 | ///\n  110 | /// 16-bit two's complement linear acceleration for OIS accelerometer axes (X, Y, Z).\n  111 | /// Data are according to the accelerometer full-scale and ODR (7.68 kHz) settings.\n  112 | #[named_register(address = If2Reg::OutxLGOis, access_type = \"Ism6hg256x<B, T, MainBank>\")]\n  113 | pub struct If2OutXYZAOIS {\n  114 |     pub x: i16,\n  115 |     pub y: i16,\n  116 |     pub z: i16,\n  117 | }","lines":10,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/ism6hg256x/src/register/if2.rs#L108-L117"}]},{"id":"CPY_5","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"very_easy","description":"In `Lsm6dso16is::all_sources_get` (`lsm6dso16is/src/driver.rs`), the `AllSources` struct literal sets `sh_slave0_nack`, `sh_slave1_nack`, `sh_slave2_nack`, `sh_slave3_nack` and `sh_wr_once` all to `status_sh.sens_hub_endop()` instead of their respective accessors. `StatusMasterMainpage` (see `lsm6dso16is/src/register/sensor_hub.rs`) exposes distinct `slave0_nack()`, `slave1_nack()`, `slave2_nack()`, `slave3_nack()` and `wr_once_done()` fields, none of which are ever read. Callers of `all_sources_get` get the sensor-hub end-of-operation flag duplicated into five unrelated fields and never see real NACK / write-once status.","fix":"Use the correct accessor for each field:\n```rust\nlet val = AllSources {\n    drdy_xl: status_reg.xlda(),\n    drdy_gy: status_reg.gda(),\n    drdy_temp: status_reg.tda(),\n    sh_endop: status_sh.sens_hub_endop(),\n    sh_slave0_nack: status_sh.sens_hub_endop(),\n    sh_slave1_nack: status_sh.sens_hub_endop(),\n    sh_slave2_nack: status_sh.sens_hub_endop(),\n    sh_slave3_nack: status_sh.sens_hub_endop(),\n    sh_wr_once: status_sh.sens_hub_endop(),\n    ispu,\n};\n```\nshould become:\n```rust\nlet val = AllSources {\n    drdy_xl: status_reg.xlda(),\n    drdy_gy: status_reg.gda(),\n    drdy_temp: status_reg.tda(),\n    sh_endop: status_sh.sens_hub_endop(),\n    sh_slave0_nack: status_sh.slave0_nack(),\n    sh_slave1_nack: status_sh.slave1_nack(),\n    sh_slave2_nack: status_sh.slave2_nack(),\n    sh_slave3_nack: status_sh.slave3_nack(),\n    sh_wr_once: status_sh.wr_once_done(),\n    ispu,\n};\n```","locations":[{"ref":"lsm6dso16is/src/driver.rs:543-562","code":"  543 |     pub async fn all_sources_get(&mut self) -> Result<AllSources, Error<B::Error>> {\n  544 |         let status_reg = StatusReg::read(self).await?;\n  545 |         let status_sh = StatusMasterMainpage::read(self).await?;\n  546 |         let ispu = IspuIntStatusMainPage::read(self).await.map(|reg| reg.0)?;\n  547 | \n  548 |         let val = AllSources {\n  549 |             drdy_xl: status_reg.xlda(),\n  550 |             drdy_gy: status_reg.gda(),\n  551 |             drdy_temp: status_reg.tda(),\n  552 |             sh_endop: status_sh.sens_hub_endop(),\n  553 |             sh_slave0_nack: status_sh.sens_hub_endop(),\n  554 |             sh_slave1_nack: status_sh.sens_hub_endop(),\n  555 |             sh_slave2_nack: status_sh.sens_hub_endop(),\n  556 |             sh_slave3_nack: status_sh.sens_hub_endop(),\n  557 |             sh_wr_once: status_sh.sens_hub_endop(),\n  558 |             ispu,\n  559 |         };\n  560 | \n  561 |         Ok(val)\n  562 |     }","lines":20,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/lsm6dso16is/src/driver.rs#L543-L562"}]},{"id":"CPY_6","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"very_easy","description":"`If2OutXYZAOIS` (the OIS accelerometer X/Y/Z output register, nominally `IF2_OUTX_L_A_OIS` at `0x28`) is declared with `address = If2Reg::OutxLGOis` (`0x22`, the OIS gyroscope output address) instead of `If2Reg::OutxLAOis` (`0x28`). This is a copy-paste of the preceding `If2OutXYZGOIS` declaration where the address constant was never updated. Any code calling `If2OutXYZAOIS::read(...)` will actually read the OIS gyroscope registers `IF2_OUTX_L_G_OIS..IF2_OUTZ_H_G_OIS`, silently returning gyroscope OIS data mislabeled as accelerometer OIS data.","fix":"Use the correct accelerometer OIS address constant for `If2OutXYZAOIS`:\n\n```rust\n// lsm6dsv320x/src/register/if2.rs:112 - before\n#[named_register(address = If2Reg::OutxLGOis, access_type = \"Lsm6dsv320x<B, T, MainBank>\")]\npub struct If2OutXYZAOIS {\n    pub x: i16,\n    pub y: i16,\n    pub z: i16,\n}\n\n// after\n#[named_register(address = If2Reg::OutxLAOis, access_type = \"Lsm6dsv320x<B, T, MainBank>\")]\npub struct If2OutXYZAOIS {\n    pub x: i16,\n    pub y: i16,\n    pub z: i16,\n}\n```","locations":[{"ref":"lsm6dsv320x/src/register/if2.rs:101-106","code":"  101 | #[named_register(address = If2Reg::OutxLGOis, access_type = \"Lsm6dsv320x<B, T, MainBank>\")]\n  102 | pub struct If2OutXYZGOIS {\n  103 |     pub x: i16,\n  104 |     pub y: i16,\n  105 |     pub z: i16,\n  106 | }","lines":6,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/lsm6dsv320x/src/register/if2.rs#L101-L106"},{"ref":"lsm6dsv320x/src/register/if2.rs:108-117","code":"  108 | /// IF2_OUTX_L_A_OIS to IF2_OUTZ_H_A_OIS (0x28 - 0x2D)\n  109 | ///\n  110 | /// 16-bit two's complement linear acceleration for OIS accelerometer axes (X, Y, Z).\n  111 | /// Data are according to the accelerometer full-scale and ODR (7.68 kHz) settings.\n  112 | #[named_register(address = If2Reg::OutxLGOis, access_type = \"Lsm6dsv320x<B, T, MainBank>\")]\n  113 | pub struct If2OutXYZAOIS {\n  114 |     pub x: i16,\n  115 |     pub y: i16,\n  116 |     pub z: i16,\n  117 | }","lines":10,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/lsm6dsv320x/src/register/if2.rs#L108-L117"}]},{"id":"CPY_7","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"easy","description":"In `Lsm6dsv80x::hg_event_get`, the returned `HgEvent.hg_shock_change` field is populated from `wup_src.hg_wu_change_ia()` - the exact same accessor already used for `hg_wakeup_chg` two lines above - instead of the dedicated `hg_shock_change_ia()` accessor that exists on `HgWakeUpSrc` (see `lsm6dsv80x/src/register/main.rs:1053-1055`, field `hg_shock_change_ia`). As a result, callers reading `hg_shock_change` actually get the wake-up-change flag duplicated, and the true high-g shock-state-change status is never surfaced.","fix":"Use the dedicated shock-change accessor:\n\n```rust\n// before\nlet hg_event = HgEvent {\n    hg_event: int_src.hg_ia(),\n    hg_wakeup_z: wup_src.hg_z_wu(),\n    hg_wakeup_y: wup_src.hg_y_wu(),\n    hg_wakeup_x: wup_src.hg_x_wu(),\n    hg_wakeup: wup_src.hg_wu_ia(),\n    hg_wakeup_chg: wup_src.hg_wu_change_ia(),\n    hg_shock: wup_src.hg_shock_state( ,"locations":[{"ref":"ism6hg256x/src/driver.rs:1298-1313","code":" 1298 |     pub async fn hg_event_get(&mut self) -> Result<HgEvent, Error<B::Error>> {\n 1299 |         let int_src = AllIntSrc::read(self).await?;\n 1300 |         let wup_src = HgWakeUpSrc::read(self).await?;\n 1301 | \n 1302 |         let hg_event = HgEvent {\n 1303 |             hg_event: int_src.hg_ia(),\n 1304 |             hg_wakeup_z: wup_src.hg_z_wu(),\n 1305 |             hg_wakeup_y: wup_src.hg_y_wu(),\n 1306 |             hg_wakeup_x: wup_src.hg_x_wu(),\n 1307 |             hg_wakeup: wup_src.hg_wu_ia(),\n 1308 |             hg_wakeup_chg: wup_src.hg_wu_change_ia(),\n 1309 |             hg_shock: wup_src.hg_shock_state(),\n 1310 |             hg_shock_change: wup_src.hg_wu_change_ia(),\n 1311 |         };\n 1312 |         Ok(hg_event)\n 1313 |     }","lines":16,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/ism6hg256x/src/driver.rs#L1298-L1313"}]},{"id":"CPY_10","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"`ln_pg_write` and `ln_pg_read` both increment the page-relative LSB address (`lsb: u8`, derived from `address.to_le_bytes()`) on every byte transferred and use `if lsb == 0 { ... }` to detect an address-page wraparound. `ln_pg_write` correctly increments with `lsb = lsb.wrapping_add(1)` (`lis2dux12/src/driver.rs:218`), but the sibling function `ln_pg_read` was apparently copy-pasted and uses plain `lsb += 1` (`lis2dux12/src/driver.rs:290`) instead. Since `lsb` is a `u8`, once it reaches `255` a plain `+= 1` panics on overflow in debug builds (`overflow-checks` enabled), and even in release builds without checks the wrap-detection logic depends on wrapping semantics that `+=` does not explicitly guarantee, unlike `wrapping_add`.","fix":"Make `ln_pg_read` consistent with `ln_pg_write` by using `wrapping_add`:\n```rust\n// before (lis2dux12/src/driver.rs:290)\nlsb += 1;\n\n// after\nlsb = lsb.wrapping_add(1);\n```","locations":[{"ref":"lis2dux12/src/driver.rs:218","code":"  218 |                 lsb = lsb.wrapping_add(1);","lines":1,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/lis2dux12/src/driver.rs#L218"},{"ref":"lis2dux12/src/driver.rs:290","code":"  290 |                 lsb += 1;","lines":1,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/lis2dux12/src/driver.rs#L290"}]},{"id":"CPY_11","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"In `EmbAdvFunctions::ln_pg_write` and `ln_pg_read` (`lis2duxs12/src/driver.rs`), both functions increment the page-relative byte offset `lsb: u8` after each byte access, but they use different arithmetic: `ln_pg_write` uses `lsb = lsb.wrapping_add(1)` (line 218) while `ln_pg_read` uses `lsb += 1` (line 290). Since `lsb` is a `u8` that legitimately reaches `255` and must wrap back to `0` to trigger the page-wrap branch (`if lsb == 0`), the unguarded `+=` in `ln_pg_read` will panic on overflow in builds with overflow checks enabled (e.g. debug builds) whenever a page-relative read crosses a 256-byte boundary, while the structurally identical `ln_pg_write` handles the exact same case safely.","fix":"Make `ln_pg_read` consistent with `ln_pg_write` by using `wrapping_add`:\n```rust\n// before\nlsb += 1;\n// after\nlsb = lsb.wrapping_add(1);\n```","locations":[{"ref":"lis2duxs12/src/driver.rs:218","code":"  218 |                 lsb = lsb.wrapping_add(1);","lines":1,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/lis2duxs12/src/driver.rs#L218"},{"ref":"lis2duxs12/src/driver.rs:290","code":"  290 |                 lsb += 1;","lines":1,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/lis2duxs12/src/driver.rs#L290"}]},{"id":"CPY_12","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"In `lsm6dsv16x/src/driver.rs`, `gy_data_rate_get` fails to shift `haodr.haodr_sel()` left by 4 bits before OR-ing it with `ctrl2.odr_g()`, unlike the parallel `xl_data_rate_get` which correctly does `haodr.haodr_sel() << 4`. Both `xl_data_rate_set`/`gy_data_rate_set` store the upper nibble of `Odr` into the 4-bit `haodr_sel` field via `(val >> 4) & 0x0F`, so reconstructing the original `Odr` value on read requires shifting `haodr_sel` back up by 4. Without the shift, `gy_data_rate_get` returns a wrong/garbage `Odr` value whenever HAODR-triggered ODR selection is used for the gyroscope (`haodr_sel() != 0`).","fix":"```rust\npub async fn gy_data_rate_get(&mut self) -> Result<Odr, Error<B::Error>> {\n    let ctrl2 = Ctrl2::read(self).await?;\n    let haodr = HaodrCfg::read(self).await?;\n    let sel = haodr.haodr_sel();\n    let odr = sel | ctrl2.odr_g();\n\n    Ok(Odr::try_from(odr).unwrap_or_default())\n}\n```\nbecomes:\n```rust\npub async fn gy_data_rate_get(&mut self) -> Result<Odr, Error<B::Error>> {\n    let ctrl2 = Ctrl2::read(self).await?;\n    let haodr = HaodrCfg::read(self).await?;\n    let sel = haodr.haodr_sel() << 4;\n    let odr = sel | ctrl2.odr_g();\n\n    Ok(Odr::try_from(odr).unwrap_or_default())\n}\n```","locations":[{"ref":"lsm6dsv16x/src/driver.rs:473-480","code":"  473 |     pub async fn gy_data_rate_get(&mut self) -> Result<Odr, Error<B::Error>> {\n  474 |         let ctrl2 = Ctrl2::read(self).await?;\n  475 |         let haodr = HaodrCfg::read(self).await?;\n  476 |         let sel = haodr.haodr_sel();\n  477 |         let odr = sel | ctrl2.odr_g();\n  478 | \n  479 |         Ok(Odr::try_from(odr).unwrap_or_default())\n  480 |     }","lines":8,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/lsm6dsv16x/src/driver.rs#L473-L480"}]},{"id":"CPY_13","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"In `Lsm6dsv320x::hg_event_get` (lsm6dsv320x/src/driver.rs), the `HgEvent` struct is built from `wup_src: HgWakeUpSrc`. Both `hg_wakeup_chg` and `hg_shock_change` are populated from the same accessor `wup_src.hg_wu_change_ia()`. The `HgWakeUpSrc` register (defined in lsm6dsv320x/src/register/main.rs) actually exposes two distinct status bits for this purpose: `hg_wu_change_ia` (high-g wake-up change event) and `hg_shock_change_ia` (high-g shock state change event). Because of the copy-paste, callers reading `hg_shock_change` from `HgEvent` will always get the wake-up-change flag instead of the real shock-change flag, so shock-change events can never be reported and are indistinguishable from wake-up-change events.","fix":"Use the dedicated `hg_shock_change_ia()` accessor for the `hg_shock_change` field, e.g. change `hg_shock_change: wup_src.hg_wu_change_ia(),` to `hg_shock_change: wup_src.hg_shock_change_ia(),` at lsm6dsv320x/src/driver.rs:1310.","locations":[{"ref":"lsm6dsv320x/src/driver.rs:1298-1313","code":" 1298 |     pub async fn hg_event_get(&mut self) -> Result<HgEvent, Error<B::Error>> {\n 1299 |         let int_src = AllIntSrc::read(self).await?;\n 1300 |         let wup_src = HgWakeUpSrc::read(self).await?;\n 1301 | \n 1302 |         let hg_event = HgEvent {\n 1303 |             hg_event: int_src.hg_ia(),\n 1304 |             hg_wakeup_z: wup_src.hg_z_wu(),\n 1305 |             hg_wakeup_y: wup_src.hg_y_wu(),\n 1306 |             hg_wakeup_x: wup_src.hg_x_wu(),\n 1307 |             hg_wakeup: wup_src.hg_wu_ia(),\n 1308 |             hg_wakeup_chg: wup_src.hg_wu_change_ia(),\n 1309 |             hg_shock: wup_src.hg_shock_state(),\n 1310 |             hg_shock_change: wup_src.hg_wu_change_ia(),\n 1311 |         };\n 1312 |         Ok(hg_event)\n 1313 |     }","lines":16,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/lsm6dsv320x/src/driver.rs#L1298-L1313"}]},{"id":"CPY_14","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"`pin_int1_route_set` and `pin_int2_route_set` in `asm330lhhx/src/driver.rs` implement the same logic (OR together the raw bits of the embedded-function/FSM/MLC interrupt registers to decide whether to enable the `int*_emb_func` routing bit) but were not kept consistent when copy-pasted: `pin_int1_route_set` (line 1607) uses `val.emb_func_int1.into_bits()` (the whole register byte), while `pin_int2_route_set` (line 1680) uses `val.emb_func_int2.int2_fsm_lc()` (just the one real bit of that register) in the equivalent position. Since `EmbFuncInt1`/`EmbFuncInt2` only have a single non-reserved, read-only-zero bit besides `int1_fsm_lc`/`int2_fsm_lc`, the two expressions happen to be numerically equivalent in practice, but the inconsistency makes the code harder to trust/maintain and would silently diverge in behavior if the reserved bits were ever used or misread from hardware.","fix":"Make `pin_int2_route_set` use `val.emb_func_int2.into_bits()` (matching the style of `pin_int1_route_set`) instead of `val.emb_func_int2.int2_fsm_lc()`, so both functions follow the identical, easily-auditable pattern.","locations":[{"ref":"asm330lhhx/src/driver.rs:1607-1616","code":" 1607 |         if (val.emb_func_int1.into_bits()\n 1608 |             | val.fsm_int1_a.into_bits()\n 1609 |             | val.fsm_int1_b.into_bits()\n 1610 |             | val.mlc_int1.into_bits())\n 1611 |             != PROPERTY_DISABLE\n 1612 |         {\n 1613 |             val.md1_cfg.set_int1_emb_func(PROPERTY_ENABLE);\n 1614 |         } else {\n 1615 |             val.md1_cfg.set_int1_emb_func(PROPERTY_DISABLE);\n 1616 |         }","lines":10,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/asm330lhhx/src/driver.rs#L1607-L1616"},{"ref":"asm330lhhx/src/driv cfg_read(\n    &mut self,\n    idx: u8,\n    val: &ShCfgRead,\n) -> Result<(), Error<B::Error>> {\n    self.mem_bank_set(MemBank::SensorHubMemBank).await?;\n\n    let res: Result<(), Error<B::Error>> = async {\n        let mut slv_add = Slv0Add::from_bits(0);\n        slv_add.set_slave0_add(val.slv_add);\n        slv_add.set_rw_0(1);\n        let slv_add_reg = match idx {\n            0 => SensHubReg::Slv0Add,\n            1 => SensHubReg::Slv1Add,\n            2 => SensHubReg::Slv2Add,\n            3 => SensHubReg::Slv3Add,\n            _ => SensHubReg::Slv0Add,\n        };\n        self.write_to_register(slv_add_reg as u8, &[slv_add.into()]).await?;\n\n        let slv_sub_add_reg = match idx {\n            0 => SensHubReg::Slv0Subadd,\n            1 => SensHubReg::Slv1Subadd,\n            2 => SensHubReg::Slv2Subadd,\n            3 => SensHubReg::Slv3Subadd,\n            _ => SensHubReg::Slv0Subadd,\n        };\n        self.write_to_register(slv_sub_add_reg as u8, &[val.slv_subadd]).await?;\n\n        let slv_config_reg = match idx {\n            0 => SensHubReg::Slv0Config,\n            1 => SensHubReg::Slv1Config,\n            2 => SensHubReg::Slv2Config,\n            3 => SensHubReg::Slv3Config,\n            _ => SensHubReg::Slv0Config,\n        };\n        let mut config_buf = [0];\n        self.read_from_register(slv_config_reg as u8, &mut config_buf).await?;\n        let mut slv_config = Slv0Config::from_bits(config_buf[0]);\n        slv_config.set_slave0_numop(val.slv_len);\n        self.write_to_register(slv_config_reg as u8, &[slv_config.into()]).await\n    }\n    .await;\n\n    self.mem_bank_set(MemBank::MainMemBank).await?;\n    res\n}\n```","locations":[{"ref":"ism330is/src/driver.rs:911-959","code":"  911 |     pub async fn sh_slv_cfg_read(\n  912 |         &mut self,\n  913 |         idx: u8,\n  914 |         val: &ShCfgRead,\n  915 |     ) -> Result<(), Error<B::Error>> {\n  916 |         let mut slv_add = Slv0Add::from_bits(0);\n  917 | \n  918 |      SflpGameGbiasXYZ(gbias_hf).write(self).await?;\n 2245 | \n 2246 |         // reload previous sensor configuration\n 2247 |         conf_saved.0.write(self).await?;\n 2248 |         conf_saved.1.write(self).await?;\n 2249 | \n 2250 |         // disable gbias setting\n 2251 |         ctrl10.set_emb_func_debug(0);\n 2252 |         ctrl10.write(self).await?;\n 2253 | \n 2254 |         // reload previous master configuration\n 2255 |         self.sh_master_set(master_config).await\n 2256 |     }","lines":131,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/lsm6dsv16x/src/driver.rs#L2126-L2256"}]},{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"easy","description":"`Lsm6dsv16x::sh_slv_cfg_read` (`lsm6dsv16x/src/driver.rs`) has the same bug as its `lsm6dso16is` counterpart: it manually calls `self.mem_bank_set(MemBank::SensorHubMemBank).await?`, performs several `self.write_to_register(...).await?` / `self.read_from_register(...).await?` calls, and only calls `self.mem_bank_set(MemBank::MainMemBank).await` as the final expression. Any error from the intermediate register accesses returns early via `?` and leaves the device selected on `SensorHubMemBank` instead of `MainMemBank`. The driver already provides `self.operate_over_sensorhub(...)`, used by all other sensor-hub setters/getters in this file (e.g. `sh_master_set`, `sh_cfg_write`), which restores the main bank unconditionally.","fix":"Rewrite `sh_slv_cfg_read` to perform its register accesses inside `self.operate_over_sensorhub(async |state| { ... }).await`, matching the pattern used by `sh_cfg_write` and the other sensor-hub accessors in the same file, so the bank is always restored regardless of whether an intermediate access fails.","locations":[{"ref":"lsm6dsv16x/src/driver.rs:3009-3038","code":" 3009 |     pub async fn sh_slv_cfg_read(\n 3010 |         &mut self,\n 3011 | y to report failed I2C transactions to the external slave. If the addressed slave NACKs the write or read, `sens_hub_endop` still becomes set once the sensor hub cycle completes, so these functions return `Ok(())` even though the underlying I2C transaction to the passthrough slave failed.","fix":"After the `sens_hub_endop() == 1` loop breaks, check the relevant NACK bit and propagate an error, e.g.:\n\n```rust\nif master_status.slave0_nack() == 1 {\n    return Err(Error::Bus(/* appropriate NACK error */));\n}\n```","locations":[{"ref":"ism330dhcx/src/driver.rs:5434-5440","code":" 5434 |             let mut master_status;\n 5435 |             loop {\n 5436 |                 master_status = master.sh_status_get()?;\n 5437 |                 if master_status.sens_hub_endop() == 1 {\n 5438 |                     break;\n 5439 |                 }\n 5440 |             }","lines":7,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/ism330dhcx/src/driver.rs#L5434-L5440"},{"ref":"ism330dhcx/src/driver.rs:5484-5490","code":" 5484 |         let mut master_status;\n 5485 |         loop {\n 5486 |             master_status = master.sh_status_get()?;\n 5487 |             if master_status.sens_hub_endop() == 1 {\n 5488 |                 break;\n 5489 |             }\n 5490 |         }","lines":7,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/ism330dhcx/src/driver.rs#L5484-L5490"},{"ref":"ism330dhcx/src/driver.rs:5554-5560","code":" 5554 |             let mut master_status;\n 5555 |             loop {\n 5556 |                 master_status = master.sh_status_get().await?;\n 5557 |                 if master_status.sens_hub_endop() == 1 {\n 5558 |                     break;\n 5559 |                 }\n 5560 |             }","lines":7,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/ism330dhcx/src/ r<B::Error>> {\n 1162 |         // Set memory bank to ISPU\n 1163 |         self.operate_over_ispu(async |lock| {\n 1164 |             let mut ispu_mem_sel = IspuMemSel::from_bits(0);\n 1165 | \n 1166 |             // Disable ISPU clock\n 1167 |             let mut ispu_cfg = IspuConfig::read(lock).await?;\n 1168 |             let clk_dis = ispu_cfg.clk_dis();\n 1169 |             ispu_cfg.set_clk_dis(1);\n 1170 |             ispu_cfg.write(lock).await?;\n 1171 | \n 1172 |             // Select memory to be written\n 1173 |             ispu_mem_sel.set_read_mem_en(0);\n 1174 |             ispu_mem_sel.set_mem_sel(mem_sel as u8);\n 1175 |             ispu_mem_sel.write(lock).await?;\n 1176 | \n 1177 |             if mem_sel == IspuMemoryType::ProgramRamMemory {\n 1178 |                 let mut addr_s = [0u16; 4];\n 1179 |                 let mut len_s = [0u16; 4];\n 1180 |                 let mut j = 0;\n 1181 |                 let mut k = 0;\n 1182 | \n 1183 |                 addr_s[0] = mem_addr;\n 1184 |                 for i in 0..len {\n 1185 |                     if (mem_addr + i == 0x2000)\n 1186 |                         || (mem_addr + i == 0x4000)\n 1187 |                         || (mem_addr + i == 0x6000)\n 1188 |                     {\n 1189 |                         len_s[j] = k;\n 1190 |                         j += 1;\n 1191 |                         addr_s[j] = mem_addr + i;\n 1192 |                         k = 0;\n 1193 |                     }\n 1194 |                     k += 1;\n 1195 |                 }\n 1196 |                 len_s[j] = k;\n 1197 |                 j += 1;\n 1198 | \n 1199 |                 k = 0;\n 1200 |                 for i in 0..j {\n 1201 |                     lock.ispu_sel_memory_addr(addr_s[i]).await?;\n 1202 |                     lock.write_to_register(\n 1203 |                         IspuReg::IspuMemData as u8,\n 1204 |                         &mem_data[k as usize..(k + len_s[i]) as usize],\n 1205 |                     )\n 1206 |                     .await?;\n 1207 |                     k += len_s[i];\n 1208 |                 }\n 1209 |             } else {\n 1210 |                 lock.ispu_sel_memory_addr(mem_addr).await?;\n 1211 |                 lock.write_to_register(IspuReg::IspuMemData as u8, &mem_data[0..len as usize])\n 1212 |                     .await?;\n 1213 |             }\n 1214 | \n 1215 |             // Restore ISPU clock\n 1216 |             ispu_cfg.set_clk_dis(clk_dis);\n 1217 |             ispu_cfg.write(lock).await?;\n 1218 | \n 1219 |             // Set memory bank back to main\n 1220 |             Ok(())\n 1221 |         })\n 1222 |         .await\n 1223 |     }","lines":69,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/lsm6dso16is/src/driver.rs#L1155-L1223"},{"ref":"lsm6dso16is/src/driver.rs:1235-1268","code":" 1235 |     pub async fn ispu_read_memory(\n 1236 |         &mut self,\n 1237 |         mem_sel: IspuMemoryType,\n 1238 |         mem_addr: u16,\n 1239 |         mem_data: &mut [u8],\n 1240 |         len: u16,\n 1241 |     ) -> Result<(), Error<B::Error>> {\n 1242 |         self.operate_over_ispu(async |lock| {\n 1243 |             let mut ispu_mem_sel = IspuMemSel::from_bits(0);\n 1244 | \n 1245 |             // Disable ISPU clock\n 1246 |             let mut ispu_cfg = IspuConfig::read(lock).await?;\n 1247 |             let clk_dis = ispu_cfg.clk_dis();\n 1248 |             ispu_cfg.set_clk_dis(1);\n 1249 |             ispu_cfg.write(lock).await?;\n 1250 | \n 1251 |             // Select memory to be read\n 1252 |             ispu_mem_sel.set_read_mem_en(1);\n 1253 |             ispu_mem_sel.set_mem_sel(mem_sel as u8);\n 1254 |             ispu_mem_sel.write(lock).await?;\n 1255 | \n 1256 |             // Select memory address\n 1257 |             lock.ispu_sel_memory_addr(mem_addr).await?;\n 1258 | \n 1259 |             // Read data\n 1260 |             let _dummy = IspuMemData::read(lock).await;\n 1261 |             IspuMemData::read_more(lock, &mut mem_data[0..len.into()]).await?;\n 1262 | \n 1263 |             // Set ISPU clock back to previous value\n 1264 |             ispu_cfg.set_clk_dis(clk_dis);\n 1265 |             ispu_cfg.write(lock).await\n 1266 |         })\n 1267 |         .await\n 1268 |     }","lines":34,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/lsm6dso16is/src/driver.rs#L1235-L1268"}]},{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In the `BusOperation` implementations for `Ism330isPassthrough`, the \"dummy\" accelerometer read used to wait for the sensor hub to trigger is handled inconsistently between the two methods: `write_bytes` discards the result with `let _dummy = master.acceleration_raw_get();` (sync at `driver.rs:1489`, async at `driver.rs:1618`, both without `?`), while `write_byte_read_bytes` propagates it with `let _dummy = master.acceleration_raw_get()?;` (sync at `driver.rs:1532`) / `.await?` (async at `driver.rs:1661`). Since both are documented as a dummy trigger read whose value is unused, a bus error there should be handled the same way in both methods; as written, `write_bytes` will silently continue into the `drdy`/`end_op` polling loops even after a bus error on the trigger read, while `write_byte_read_bytes` aborts immediately.","fix":"Make the error handling of the dummy `acceleration_raw_get()` call consistent between `write_bytes` and `write_byte_read_bytes` - either propagate the error with `?` in both, or discard it with `let _ = ...;` in both, matching whichever behavior is actually intended when the trigger read itself fails.","locations":[{"ref":"ism330is/src/driver.rs:1489","code":" 1489 |             let _dummy = master.acceleration_raw_get();","lines":1,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/ism330is/src/driver.rs#L1489"},{"ref":"ism330is/src/driver.rs:1532","code":" 1532 |         let _dummy = master.acceleration_raw_get()?;","lines":1,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/ism330is/src/driver.rs#L1532"},{"ref":"ism330is/src/driver.rs:1618","code":" 1618 |             let _dummy = master.acceleration_raw_get().await;","lines":1,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/ism330is/src/driver.rs#L1618"},{"ref":"ism330is/src/driver.rs:1661","code":" 1661 |         let _dummy = master.acceleration_raw_get().await?;","lines":1,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/ism330is/src/driver.rs#L1661"}]},{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"critical","difficulty":"easy","description":"`MemsUcfOp`'s `From<u8>` impl uses `unsafe { core::mem::transmute(value) }` to convert an arbitrary `u8` into a `#[repr(u8)]` enum that only has 5 valid discriminants (`0..=4`: `Read`/`Write`/`Delay`/`PollSet`/`PollReset`). Any `value` outside `0..=4` (e.g. a malformed byte read from a UCF/JSON config line) produces a `MemsUcfOp` instance holding an invalid discriminant, which is immediate undefined behavior in Rust - the compiler is allowed to assume `MemsUcfOp` never holds any other bit pattern, so this is worse than a panic; it can silently corrupt control flow anywhere the value is later matched on.","fix":"Replace the `transmute` with a safe, exhaustive conversion:\n```rust\nimpl From<u8> for MemsUcfOp {\n    fn from(value: u8) -> Self {\n        match value {\n            0x0 => MemsUcfOp::Read,\n            0x1 => MemsUcfOp::Write,\n            0x2 => MemsUcfOp::Delay,\n            0x3 => MemsUcfOp::PollSet,\n            0x4 => MemsUcfOp::PollReset,\n            _ => MemsUcfOp::Read, // or switch to `TryFrom` and return an Err\n        }\n    }\n}\n```\nor implement `TryFrom<u8>` (e.g. via `derive_more::TryFrom`, already used elsewhere in this workspace, such as `lsm6dsv80x/src/register/embedded.rs`) so malformed opcode bytes surface as a recoverable `Err` instead of UB.","locations":[{"ref":"util/st-mems-reg-config-conv/src/ucf_entry.rs:17-23","code":"   17 | impl From<u8> for MemsUcfOp {\n   18 |     fn from(value: u8) -> Self{\n   19 |         unsafe {\n   20 |             core::mem::transmute(value)\n   21 |         }\n   22 |     }\n   23 | }","lines":7,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/util/st-mems-reg-config-conv/src/ucf_entry.rs#L17-L23"}]},{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"`Ism6hg256x::sh_tgt_cfg_read` computes sensor-hub target register addresses via `SensHubReg::Tgt0Add as u8 + idx * 3` (and similarly for `Tgt0Subadd`/`Tgt0Config`) but, unlike its sibling functions `fifo_sh_batch_target_set`/`fifo_sh_batch_target_get` (which `assert!(idx <= 3)`), it performs no validation of `idx` at all. Passing `idx > 3` silently computes an out-of-range register address (or overflows the `u8` multiplication/addition, which panics in debug builds and wraps in release builds), causing writes/reads to the wrong sensor-hub target registers instead of a clean, reported error.","fix":"Add the same bound check used by the sibling functions at the top of `sh_tgt_cfg_read`, e.g. `if idx > 3 { return Err(Error::InvalidConfiguration); }` (or `assert!(idx <= 3)` for consistency with the current style of the sibling functions, though returning a `Result::Err` is preferable for all three).","locations":[{"ref":"ism6hg256x/src/driver.rs:3837-3869","code":" 3837 |     pub async fn sh_tgt_cfg_read(\n 3838 |         &mut self,\n 3839 |         idx: u8,\n 3840 |         val: ShCfgRead,\n 3841 |     ) -> Result<(), Error< ait\n 2355 |     }","lines":16,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/asm330lhh/src/driver.rs#L2340-L2355"},{"ref":"asm330lhh/src/driver.rs:2357-2367","code":" 2357 |     /// DEN value stored in LSB of Z-axis.\n 2358 |     ///\n 2359 |     /// # Returns\n 2360 |     ///\n 2361 |     /// * `Result`\n 2362 |     ///     * `u8`: Change the values of den_x in reg CTRL9_XL.\n 2363 |     ///     * `Err`: Returns an error if the operation fails.\n 2364 |     pub async fn den_mark_axis_z_get(&mut self) -> Result<u8, Error<B::Error>> {\n 2365 |         let ctrl9_xl = Ctrl9Xl::read(self).await?;\n 2366 |         Ok(ctrl9_xl.den_z())\n 2367 |     }","lines":11,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/asm330lhh/src/driver.rs#L2357-L2367"}]},{"id":"CMT_9","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The doc comments for `XOfsUsr`, `YOfsUsr` and `ZOfsUsr` all misspell `offset` as `offser` (\"Accelerometer X-axis user offser correction...\").","fix":"```rust\n// before\n/// Accelerometer X-axis user offser correction (X_OFS_USR) (R/W).\n// after\n/// Accelerometer X-axis user offset correction (X_OFS_USR) (R/W).\n```\n(and likewise replace `offser` with `offset` on the `YOfsUsr` and `ZOfsUsr` doc comments).","locations":[{"ref":"asm330lhh/src/register/main.rs:1209","code":" 1209 | /// Accelerometer X-axis user offser correction (X_OFS_USR) (R/W).","lines":1,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/asm330lhh/src/register/main.rs#L1209"},{"ref":"asm330lhh/src/register/main.rs:1221","code":" 1221 | /// Accelerometer Y-axis user offser correction (Y_OFS_USR) (R/W).","lines":1,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/asm330lhh/ mmented-out line:\n```rust\n// before\n#[bisync]\npub fn from_fs4_to_mg(lsb: i16) -> f32 {\n    // (lsb as f32) * 0.122\n    (lsb as f32) * 0.488\n}\n\n// after\n#[bisync]\npub fn from_fs4_to_mg(lsb: i16) -> f32 {\n    (lsb as f32) * 0.488\n}\n```","locations":[{"ref":"iis2dlpc/src/driver.rs:1824-1828","code":" 1824 | #[bisync]\n 1825 | pub fn from_fs4_to_mg(lsb: i16) -> f32 {\n 1826 |     // (lsb as f32) * 0.122\n 1827 |     (lsb as f32) * 0.488\n 1828 | }","lines":5,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/iis2dlpc/src/driver.rs#L1824-L1828"}]},{"id":"CMT_12","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"Two doc comments in `iis2mdc/src/driver.rs` use the wrong number of leading slashes, so rustdoc does not attach them to the following item and they silently vanish from generated documentation. Line 513 uses `//` (a plain comment, not `///`), and line 529 uses `////` (four slashes, which rustdoc also treats as a plain comment rather than a doc comment).","fix":"Use exactly three slashes for both doc comments:\n```rust\n// before (line 513)\n    // Retrieves the raw magnetic output values.\n\n// after\n    /// Retrieves the raw magnetic output values.\n```\n```rust\n// before (line 529)\n    //// Retrieves the raw temperature output value.\n\n// after\n    /// Retrieves the raw temperature output value.\n```","locations":[{"ref":"iis2mdc/src/driver.rs:513","code":"  513 |     // Retrieves the raw magnetic output values.","lines":1,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/iis2mdc/src/driver.rs#L513"},{"ref":"iis2mdc/src/driver.rs:529","code":"  529 |     //// Retrieves the raw temperature output value.","lines":1,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/iis2mdc/src/driver.rs#L529"}]},{"id":"CMT_13","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The doc comment on `Lis2mdl::int_gen_threshold_get` in `lis2mdl/src/driver.rs` contains a mojibake replacement character (`�`) instead of an apostrophe in `two's complement`, indicating a text-encoding mistake when the comment was written/copied.","fix":"Replace the corrupted character with a plain apostrophe:\n```rust\n// before\n    /// Data format is the same as output data raw: two�s complement with\n// after\n    /// Data format is the same as output data raw: two's complement with\n```","locations":[{"ref":"lis2mdl/src/driver.rs:503","code":"  503 |     /// Data format is the same as output data raw: two�s complement with","lines":1,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/lis2mdl/src/driver.rs#L503"}]},{"id":"CMT_14","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The doc comment above `MlcStatus` in lsm6dsv16x/src/register/embedded.rs states the register address is `0x4B`, but `EmbReg::MlcStatus` is actually defined as `0x15` (line 26), and `0x4B` is really the address of the unrelated `IntAckMask` register (also documented correctly a few lines below at line 539). The comment was apparently copy-pasted from `INT_ACK_MASK` and is misleading for anyone consulting the doc comment to find the register's real address.","fix":"Correct the address in the doc comment to match the actual `EmbReg::MlcStatus` value:\nbefore:\n```rust\n/// MLC_STATUS (0x4B)\n```\nafter:\n```rust\n/// MLC_STATUS (0x15)\n```","locations":[{"ref":"lsm6dsv16x/src/register/embedded.rs:26","code":"   26 |     MlcStatus = 0x15,","lines":1,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/lsm6dsv16x/src/register/embedded.rs#L26"},{"ref":"lsm6dsv16x/src/register/embedded.rs:399","code":"  399 | /// MLC_STATUS (0x4B)","lines":1,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/lsm6dsv16x/src/register/embedded.rs#L399"}]},{"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"easy","description":"`NamedRegisterAttr::quote_write_single` (part of the `QuoteOutput` trait implemented for `#[named_register(...)]`) is implemented as `panic!(\"not required\")`. It happens to never be invoked today because `Quote::generate` only calls `quote_write_single` when the register's `data_type` is `u8`, and for `named_register` the `data_type` is always the enclosing struct's own type - but that invariant is not enforced anywhere, so the trait method remains a live foot-gun: any future refactor of `Quote::generate`, or reuse of `NamedRegisterAttr` in a new code path, turns this into an actual panic during macro expansion of downstream sensor crates.","fix":"Either split `QuoteOutput` so single-byte writes are only required for attribute types that support them, or make the fallback emit a `compile_error!` token stream instead of panicking:\n```rust\nfn quote_write_single(&self) -> proc_macro2::TokenStream {\n    quote! { compile_error!(\"named_register does not support single-byte writes\") }\n}\n```","locations":[{"ref":"util/st-mem-bank-macro/src/attributes/named_register.rs:103-107","code":"  103 |     fn quote_write_single(&self) -> proc_macro2::TokenStream {\n  104 |         //let address = &self.address;\n  105 |         //quote! { sensor.write_to_register(#address as u8, &[self]) }\n  106 |         panic!(\"not required\");\n  107 |     }","lines":5,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/util/st-mem-bank-macro/src/attributes/named_register.rs#L103-L107"}]},{"id":"OTHER_1","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"The `DenMode::LevelLetched` enum variant is misspelled - it should be `LevelLatched` (compare with the neighboring `LevelTrigger`/`EdgeTrigger` naming and the register's own `interrupt latch` terminology used elsewhere in this file, e.g. `Lir::AllIntLatched`).","fix":"```rust\n// before\npub enum DenMode {\n    #[default]\n    Disable = 0,\n    LevelFifo = 6,\n    LevelLetched = 3,\n    LevelTrigger = 2,\n    EdgeTrigger = 4,\n}\n\n// after\npub enum DenMode {\n    #[default]\n    Disable = 0,\n    LevelFifo = 6,\n    LevelLatched = 3,\n    LevelTrigger = 2,\n    EdgeTrigger = 4,\n}\n```","locations":[{"ref":"asm330lhh/src/register/main.rs:1863-1873","code":" 1863 | #[repr(u8)]\n 1864 | #[derive(Clone, Copy, PartialEq, Default, TryFrom)]\n 1865 | #[try_from(repr)]\n 1866 | pub enum DenMode {\n 1867 |     #[default]\n 1868 |     Disable = 0,\n 1869 |     LevelFifo = 6,\n 1870 |     LevelLetched = 3,\n 1871 |     LevelTrigger = 2,\n 1872 |     EdgeTrigger = 4,\n 1873 | }","lines":11,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/asm330lhh/src/register/main.rs#L1863-L1873"}]},{"id":"OTHER_2","type":"other","type_label":"Other","severity":"negligible","difficulty":"easy","description":"The error variant `Error::FifoSampGraterThanBuff` (`driver.rs:39`) is misspelled - it should read `FifoSampGreaterThanBuff` (\"Grater\" should be \"Greater\"). It is part of the public API surface (returned by `Ilps22qs::fifo_data_get`), so fixing it is a minor breaking change for downstream users.","fix":"Rename the variant and update its single use site:\n\n```rust\n// driver.rs:39 - before\nFifoSampGraterThanBuff,\n// after\nFifoSampGreaterThanBuff,\n```\n\n```rust\n// driver.rs:875 - before\nreturn Err(Error::FifoSampGraterThanBuff);\n// after\nreturn Err(Error::FifoSampGreaterThanBuff);\n```","locations":[{"ref":"ilps22qs/src/driver.rs:39","code":"   39 |     FifoSampGraterThanBuff,","lines":1,"link": (function(){

const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
