<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>

<script type="application/json" id="D">[{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`EmbAdvFunctions::ln_pg_read` in `asm330lhhx/src/driver.rs` (lines 243-291) takes a caller-supplied `len: u8` and loops `for i in 0..len`, indexing `&mut buf[i as usize..(i as usize + 1)]` on every iteration (line 266) without ever checking `len` against `buf.len()`. If a caller passes `len` greater than `buf.len()`, this slice index panics (`range end index N out of range for slice of length M`). This is inconsistent with the sibling public methods in the very same file - `fsm_out_get` (line 3373) and `sh_read_data_raw_get` (line 3692) - which both explicitly check `if len > buf.len() as u8 { return Err(Error::BufferTooSmall); }` before touching the buffer. `ln_pg_write` (the write counterpart, lines 190-230) avoids the panic entirely by using `buf.iter().take(len as usize)`, but then silently writes fewer bytes than `len` if `buf` is short, without returning an error - masking a caller bug instead of panicking or reporting it.","fix":"Add the same bounds check used by `fsm_out_get`/`sh_read_data_raw_get` at the top of `ln_pg_read`, returning `Error::BufferTooSmall` instead of panicking:\n```rust\nasync fn ln_pg_read(&mut self, add: u16, buf: &mut [u8], len: u8) -> Result<(), Self::Error> {\n    if len > buf.len() as u8 {\n        return Err(Error::BufferTooSmall);\n    }\n    self.operate_over_emb(async |state| {\n        ...\n```\nAlso make `ln_pg_write` return `Error::BufferTooSmall` (instead of silently truncating via `.take(len as usize)`) when `buf.len() < len as usize`, so both directions fail loudly on a caller mistake instead of one panicking and the other silently under-writing.","locations":[{"ref":"asm330lhhx/src/driver.rs:243-291","code":"  243 |     async fn ln_pg_read(&mut self, add: u16, buf: &mut [u8], len: u8) -> Result<(), Self::Error> {\n  244 |         self.operate_over_emb(async |state| {\n  245 |             let [mut lsb, mut msb] = add.to_le_bytes();\n  246 | \n  247 |             // Set page read\n  248 |             let mut page_rw = PageRw::read(state).await?;\n  249 |             page_rw.set_page_rw(PAGE_READ_ENABLE);\n  250 |             page_rw.write(state).await?;\n  251 | \n  252 |             // Select page\n  253 |             let mut page_sel = PageSel::read(state).await?;\n  254 |             page_sel.set_page_sel(msb);\n  255 |             page_sel.write(state).await?;\n  256 | \n  257 |             // Set page address\n  258 |             let mut page_address = PageAddress::from_bits(0);\n  259 |             page_address.set_page_addr(lsb);\n  260 |             page_address.write(state).await?;\n  261 | \n  262 |             for i in 0..len {\n  263 |                 state\n  264 |                     .read_from_register(\n  265 |                         EmbReg::PageValue as u8,\n  266 |                         &mut buf[i as usize..(i as usize + 1)],\n  267 |                     )\n  268 |                     .await?;\n  269 | \n  270 |                 lsb = lsb.wrapping_add(1);\n  271 |                 // Check if page wrap\n  272 |                 if lsb == 0x00 {\n  273 |                     msb += 1;\n  274 |                     page_sel = PageSel::read(state).await?;\n  275 |                     page_sel.set_page_sel(msb);\n  276 |                     page_sel.write(state).await?;\n  277 |                 }\n  278 |             }\n  279 | \n  280 |             // Reset page selection\n  281 |             page_sel = PageSel::read(state).await?;\n  282 |             page_sel.set_page_sel(0);\n  283 |             page_sel.write(state).await?;\n  284 | \n  285 |             // Unset page read\n  286 |             page_rw = PageRw::read(state).await?;\n  287 |             page_rw.set_page_rw(PAGE_RW_DISABLE);\n  288 |             page_rw.write(state).await\n  289 |         })\n  290 |         .await\n  291 |     }","lines":49,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/asm330lhhx/src/driver.rs#L243-L291"}]},{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"Nine public API methods on `Asm330lhhx<B, T, MainBank>` in `asm330lhhx/src/driver.rs` have bodies that are just `todo!()`, so calling any of them unconditionally panics at runtime: `int1_mode_set`, `int1_mode_get`, `i3c_disable_set`, `i3c_disable_get`, `fsm_status_get`, `emb_func_clk_dis_set`, `emb_func_clk_dis_get`, `mlc_init_set`, `mlc_init_get`. None of these are marked `#[deprecated]`, `unimplemented`-documented, or otherwise gated, so they look like normal, safe-to-call driver methods from the public API surface. Several of them also have signatures that do not even match their own doc comments (e.g. `int1_mode_set()` takes no `val` argument even though its doc says `val: Change the values of pd_dis_int1...`; `fsm_status_get() -> Result<(), Error<B::Error>>` claims in its doc to return a `FsmStatus`/`FsmStatusA/B` struct; `mlc_init_get() -> Result<(), Error<B::Error>>` claims to return `u8`), and all nine are declared without a `&mut self` receiver at all (unlike every other sibling method in the same `impl` block), meaning they can only be invoked via `Asm330lhhx::<B, T, MainBank>::int1_mode_set()` turbofish syntax rather than as normal methods.","fix":"Implement each stub using the same read-modify-write pattern used by every other accessor in the file (e.g. `pin_polarity_set`/`get` for a single-bit register field), and give each method a proper `&mut self` receiver so it is callable like its siblings. For example, `int1_mode_set`/`int1_mode_get` should look like:\n```rust\npub async fn int1_mode_set(&mut self, val: PullDown) -> Result<(), Error<B::Error>> {\n    let mut i3c_bus_avb = I3cBusAvb::read(self).await?;\n    i3c_bus_avb.set_pd_dis_int1(val as u8);\n    i3c_bus_avb.write(self).await\n}\n\npub async fn int1_mode_get(&mut self) -> Result<PullDown, Error<B::Error>> {\n    let i3c_bus_avb = I3cBusAvb::read(self).await?;\n    Ok(PullDown::try_from(i3c_bus_avb.pd_dis_int1()).unwrap_or_default())\n}\n```\nUntil real implementations exist, at minimum add `#[deprecated]`/doc warnings so callers do not treat these as safe, and fix the return types to match what the doc comments promise.","locations":[{"ref":"asm330lhhx/src/driver.rs:1482-1495","code":" 1482 |     pub async fn int1_mode_set() -> Result<(), Error<B::Error>> {\n 1483 |         todo!();\n 1484 |     }\n 1485 | \n 1486 |     /// Connect/Disconnect INT1 pull-down\n 1487 |     ///\n 1488 |     /// # Returns\n 1489 |     ///\n 1490 |     /// * `Result`\n 1491 |     ///     * `PullDown`: Get the vaules of pd_dis_int1 in reg I3C_BUS_AVB\n 1492 |     ///     * `Err`: Returns an error if the operation fails.\n 1493 |     pub async fn int1_mode_get() -> Result<(), Error<B::Error>> {\n 1494 |         todo!();\n 1495 |     }","lines":14,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/asm330lhhx/src/driver.rs#L1482-L1495"},{"ref":"asm330lhhx/src/driver.rs:1569-1582","code":" 1569 |     pub async fn i3c_disable_set() -> Result<(), Error<B::Error>> {\n 1570 |         todo!();\n 1571 |     }\n 1572 | \n 1573 |     /// Get the configuration for I3C communication protocol\n 1574 |     ///\n 1575 |     /// # Returns\n 1576 |     ///\n 1577 |     /// * `Result`\n 1578 |     ///     * `I3cDisable`\n 1579 |     ///     * `Err`: Returns an error if the operation fails.\n 1580 |     pub async fn i3c_disable_get() -> Result<(), Error<B::Error>> {\n 1581 |         todo!();\n 1582 |     }","lines":14,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/asm330lhhx/src/driver.rs#L1569-L1582"},{"ref":"asm330lhhx/src/driver.rs:3176-3178","code":" 3176 |     pub async fn fsm_status_get() -> Result<(), Error<B::Error>> {\n 3177 | based error handling used everywhere else in the crate for the exact same class of \"invalid caller-supplied value\" error.","fix":"Replace the assertion with the same `Result`-based validation pattern used elsewhere in the driver:\n```rust\n// before\npub async fn fifo_watermark_set(&mut self, val: u8) -> Result<(), Error<B::Error>> {\n    assert!(val < 128);\n\n    let mut fifo_wtm = FifoWtm::read(self).await?;\n    fifo_wtm.set_fth(val);\n    fifo_wtm.write(self).await\n}\n\n// after\npub async fn fifo_watermark_set(&mut self, val: u8) -> Result<(), Error<B::Error>> {\n    if val >= 128 {\n        return Err(Error::InvalidValue);\n    }\n\n    let mut fifo_wtm = FifoWtm::read(self).await?;\n    fifo_wtm.set_fth(val);\n    fifo_wtm.write(self).await\n}\n```","locations":[{"ref":"lis2dux12/src/driver.rs:1816-1822","code":" 1816 |     pub async fn fifo_watermark_set(&mut self, val: u8) -> Result<(), Error<B::Error>> {\n 1817 |         assert!(val < 128);\n 1818 | \n 1819 |         let mut fifo_wtm = FifoWtm::read(self).await?;\n 1820 |         fifo_wtm.set_fth(val);\n 1821 |         fifo_wtm.write(self).await\n 1822 |     }","lines":7,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/lis2dux12/src/driver.rs#L1816-L1822"}]},{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"`fifo_watermark_set` in both `lis2duxs12/src/driver.rs` and `lps22df/src/driver.rs` validates its input with `assert!(val < 128)` / `assert!(watermark < 128)` instead of returning an `Err`. Every other setter in these driver APIs communicates invalid input through the `Result<(), Error<B::Error>>` return type; this function instead aborts the whole program (a real concern on `no_std` embedded targets with no unwinding/recovery) if a caller passes an out-of-range watermark, e.g. from an unchecked config value.","fix":"Return an error instead of asserting, matching the rest of the API's `Result`-based error handling:\n```rust\n// before\npub async fn fifo_watermark_set(&mut self, val: u8) -> Result<(), Error<B::Error>> {\n    assert!(val < 128);\n\n    let mut fifo_wtm = FifoWtm::read(self).await?;\n    fifo_wtm.set_fth(val);\n    fifo_wtm.write(self).await\n}\n\n// after\npub async fn fifo_watermark_set(&mut self, val: u8) -> Result<(), Error<B::Error>> {\n    if val >= 128 {\n        return Err(Error::InvalidValue);\n    }\n\n    let mut fifo_wtm = FifoWtm::read(self).await?;\n    fifo_wtm.set_fth(val);\n    fifo_wtm.write(self).await\n}\n```\n(For `lps22df`, use whatever existing `Error` variant best fits, e.g. `Error::UnexpectedValue`, since it has no dedicated `InvalidValue` variant.)","locations":[{"ref":"lis2duxs12/src/driver.rs:1841-1842","code":" 1841 |     pub async fn fifo_watermark_set(&mut self, val: u8) -> Result<(), Error<B::Error>> {\n 1842 |         assert!(val < 128);","lines":2,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/lis2duxs12/src/driver.rs#L1841-L1842"},{"ref":"lps22df/src/driver.rs:452-453","code":"  452 |     pub async fn fifo_watermark_set(&mut self, watermark: u8) -> Result<(), Error<B::Error>> {\n  453 |         assert!(watermark < 128);","lines":2,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/lps22df/src/driver.rs#L452-L453"}]},{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`ispu_write_dummy_cfg` and `ispu_read_dummy_cfg` (`lsm6dso16is/src/driver.rs`) compute `Reg::IspuDummyCfg1L as u8 + offset + len` as a bounds check before doing the register access, where `offset: u8` and `len: u8` are fully caller-controlled. This `u8` addition can overflow (e.g. `offset = 200, len = 100`): in debug builds this panics; in release builds it silently wraps, which can make the `> Reg::IspuDummyCfg4H as u8` bounds check pass when ,"type_label":"Panic","severity":"low","difficulty":"easy","description":"In `RegisterAttr::parse`, `AdvRegisterAttr::parse` and `NamedRegisterAttr::parse`, each key-value pair's key is read via `let ident = pair.path.get_ident().unwrap().to_string();`. If the attribute key is not a simple identifier (e.g. a qualified path token, or any malformed key token), `get_ident()` returns `None` and `.unwrap()` panics with an unhelpful message instead of surfacing a `syn::Error` pointing at the bad token.","fix":"Replace the `unwrap()` with a proper diagnostic, e.g. `let ident = pair.path.get_ident().ok_or_else(|| syn::Error::new_spanned(&pair.path, \"expected a simple identifier\"))?.to_string();`.","locations":[{"ref":"util/st-mem-bank-macro/src/attributes/register.rs:35","code":"   35 |             let ident = pair.path.get_ident().unwrap().to_string();","lines":1,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/util/st-mem-bank-macro/src/attributes/register.rs#L35"},{"ref":"util/st-mem-bank-macro/src/attributes/adv_register.rs:35","code":"   35 |             let ident = pair.path.get_ident().unwrap().to_string();","lines":1,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/util/st-mem-bank-macro/src/attributes/adv_register.rs#L35"},{"ref":"util/st-mem-bank-macro/src/attributes/named_register.rs:37","code":"   37 |             let ident = pair.path.get_ident().unwrap().to_string();","lines":1,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/util/st-mem-bank-macro/src/attributes/named_register.rs#L37"}]},{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"`Ism330is::ispu_write_dummy_cfg` and `Ism330is::ispu_read_dummy_cfg` validate the caller-supplied `offset`/`len` with `Reg::IspuDummyCfg1L as u8 + offset + len > Reg::IspuDummyCfg4H as u8`. `Reg::IspuDummyCfg1L as u8` is `0x73` (115); `offset` and `len` are both `u8` and fully caller-controlled. For inputs such as `offset = 200, len = 200`, `115 + 200 + 200 = 515` overflows `u8` (max 255). In a debug build (overflow checks on, the `cargo` default dev profile) this addition panics. In a release build (`overflow-checks = false`) it wraps around silently, so the bounds check can pass for values that are actually far out of the intended `[IspuDummyCfg1L, IspuDummyCfg4H]` register range, and the subsequent `write_to_register`/`read_from_register` call is then issued with a wrapped, incorrect register address - reading or writing an unintended hardware register instead of failing safely.","fix":"Widen the arithmetic to avoid wraparound, e.g. compute in `u16` before comparing:\n\n```rust\n// before (both functions)\nif Reg::IspuDummyCfg1L as u8 + offset + len > Reg::IspuDummyCfg4H as u8 {\n    return Err(Error::UnexpectedValue);\n}\n\n// after\nlet start = Reg::IspuDummyCfg1L as u16;\nlet end = start + offset as u16 + len as u16;\nif end > Reg::IspuDummyCfg4H as u16 {\n    return Err(Error::UnexpectedValue);\n}\n```","locations":[{"ref":"ism330is/src/driver.rs:1049","code":" 1049 |         if Reg::IspuDummyCfg1L as u8 + offset + len > Reg::IspuDummyCfg4H as u8 {","lines":1,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/ism330is/src/driver.rs#L1049"},{"ref":"ism330is/src/driver.rs:1072","code":" 1072 |         if Reg::IspuDummyCfg1L as u8 + offset + len > Reg::IspuDummyCfg4H as u8 {","lines":1,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/ism330is/src/driver.rs#L1072"}]},{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"`FifoData::decode` repeatedly computes timestamps with plain `u32` subtraction, e.g. `self.timestamp - self.dtime_xl`, `self.timestamp - 2 * self.dtime_xl`, `self.timestamp - self.dtime_gy`. `self.timestamp` starts at `0` (set in `FifoData::init`) and is only advanced by `Tag::Ts`/`Tag::Odrchg` handling. If a compressed (`NcT1`/`NcT2`/`Comp2x`/`Comp3x`) tag is decoded before `self.timestamp` has accumulated at least `dtime_xl`/`dtime_gy` (e.g. right at stream start, or right after an ODR change bumps `dtime_xl`/`dtime_gy` to a larger value), the subtraction underflows: it panics in a debug build and silently wraps to a huge bogus `u32` timestamp in a release build.","fix":"Use `self.timestamp.saturating_sub(self.dtime_xl)` (and the analogous `saturating_sub` form for every other subtraction listed) so a stream that starts mid-sequence, or right after an ODR change, produces a clamped, well-defined timestamp instead of panicking or wrapping.","locations":[{"ref":"util/st-fifo-tool/src/lib.rs:180","code":"  180 |                                 self.timestamp - self.dtime_xl","lines":1,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/util/st-fifo-tool/src/lib.rs#L180"},{"ref":"util/st-fifo-tool/src/lib.rs:192","code":"  192 |                                 self.timestamp - self.dtime_gy","lines":1,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/util/st-fifo-tool/src/lib.rs#L192"},{"ref":"util/st-fifo-tool/src/lib.rs:210","code":"  210 |                                 self.timestamp - 2 * self.dtime_xl","lines":1,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/util/st-fifo-tool/src/lib.rs#L210"},{"ref":"util/st-fifo-tool/src/lib.rs:222","code":"  222 |                                 self.timestamp - 2 * self.dtime_gy","lines":1,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/util/st-fifo-tool/src/lib.rs#L22 ":1,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/util/st-fifo-tool/src/lib.rs#L331"},{"ref":"util/st-fifo-tool/src/lib.rs:343","code":"  343 |                             fifo_out_slot[j].timestamp = self.timestamp - self.dtime_gy;","lines":1,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/util/st-fifo-tool/src/lib.rs#L343"}]},{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`RegisterAttr::parse`, `AdvRegisterAttr::parse` and `NamedRegisterAttr::parse` each compute `let generics_num = count_generics(&access_type) - 1;`. `count_generics` returns `0` whenever `access_type` has no angle-bracketed generic arguments (e.g. `access_type = \"SomeType\"` written without `<...>` by mistake). `0usize - 1` panics with a subtract-with-overflow message in a debug build (the typical build profile for a proc-macro crate) instead of producing a clean macro diagnostic pointing at the bad `access_type` string.","fix":"Validate before subtracting, e.g.:\n```rust\nlet raw_generics = count_generics(&access_type);\nif raw_generics == 0 {\n    return Err(input.error(\"'access_type' must have at least one generic parameter\"));\n}\nlet generics_num = raw_generics - 1;\n```","locations":[{"ref":"util/st-mem-bank-macro/src/attributes/register.rs:77","code":"   77 |         let generics_num = count_generics(&access_type) - 1;","lines":1,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/util/st-mem-bank-macro/src/attributes/register.rs#L77"},{"ref":"util/st-mem-bank-macro/src/attributes/adv_register.rs:80","code":"   80 |         let generics_num = count_generics(&access_type) - 1;","lines":1,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/util/st-mem-bank-macro/src/attributes/adv_register.rs#L80"},{"ref":"util/st-mem-bank-macro/src/attributes/named_register.rs:76","code":"   76 |         let generics_num = count_generics(&access_type) - 1;","lines":1,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/util/st-mem-bank-macro/src/attributes/named_register.rs#L76"}]},{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`Ilps22qs::fifo_data_get` validates the requested sample count with `if samp > data.len() as u8`. Casting `data.len()` (a `usize`) to `u8` truncates any buffer length greater than 255 (e.g. `data.len() == 256` truncates to `0`). This does not cause an out-of-bounds access, since the loop is separately bounded by `data.iter_mut().take(samp as usize)`, but it can make the length check spuriously reject valid calls when a caller passes a buffer larger than 255 elements, returning `Error::FifoSampGraterThanBuff` even though `data` is actually large enough for `samp` samples.","fix":"Compare in `usize` instead of truncating the buffer length down to `u8`:\n\n```rust\n// before\nif samp > data.len() as u8 {\n    return Err(Error::FifoSampGraterThanBuff);\n}\n// after\nif samp as usize > data.len() {\n    return Err(Error::FifoSampGraterThanBuff);\n}\n```","locations":[{"ref":"ilps22qs/src/driver.rs:874","code":"  874 |         if samp > data.len() as u8 {","lines":1,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/ilps22qs/src/driver.rs#L874"}]},{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"In both `ln_pg_write` and `ln_pg_read`, the page-select high byte `msb` is incremented with a plain `msb += 1;` on page wrap, while the low byte `lsb` in the same loop is advanced with `lsb.wrapping_add(1)` a few lines above. The two are inconsistent: if a single `ln_pg_write`/`ln_pg_read` call streams enough bytes to wrap `msb` past `255` (i.e. more than `256 * 256` bytes in one call), `msb += 1` overflows a `u8`, which panics with overflow checks enabled instead of wrapping like `lsb` does.","fix":"Use `wrapping_add` for `msb` as well, matching `lsb`:\n\n```rust\n// before\nmsb += 1;\n// after\nmsb = msb.wrapping_add(1);\n```","locations":[{"ref":"ism330dhcx/src/driver.rs:218","code":"  218 |                     msb += 1;","lines":1,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/ism330dhcx/src/driver.rs#L218"},{"ref":"ism330dhcx/src/driver.rs:279","code":"  279 |                     msb += 1;","lines":1,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/ism330dhcx/src/driver.rs#L279"}]},{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"In `Ism330dhcxPassthrough::write_bytes` (both sync and async variants), the slave sub-address is computed as `wbuf[0] + i - 1` where `wbuf[0]` and `i` are both `u8`. If `wbuf[0]` is close to `u8::MAX` and the write buffer spans several bytes, `wbuf[0] + i` can exceed `255`, causing a `u8` overflow: this panics in builds with overflow checks enabled, or silently wraps to an incorrect slave register address in release builds without them - either way the write targets the wrong register on the external slave device.","fix":"Use checked/wrapping arithmetic and surface an error on overflow, e.g. `slv0_subadd: wbuf[0].wrapping_add(i).wrapping_sub(1)`, or validate upfront that `wbuf[0] as usize + wbuf.len() - 1 <= u8::MAX as usize` before starting the loop.","locations":[{"ref":"ism330dhcx/src/driver.rs:5413","code":" 5413 |                 slv0_subadd: wbuf[0] + i - 1,","lines":1,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/ism330dhcx/src/driver.rs#L5413"},{"ref":"ism330dhcx/src/driver.rs:5533","code":" 5533 |                 slv0_subadd: wbuf[0] + i - 1,","lines":1,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/ism330dhcx/src/driver.rs#L5533"}]},{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"In the `passthrough` feature's `BusOperation::write_bytes` implementations for both `Lsm6dso16isPassthrough` (`lsm6dso16is/src/driver.rs`) and `Lsm6dsv16xPassthrough` (`lsm6dsv16x/src/driver.rs`), the sub-address is computed as `wbuf[0] + i - 1` using plain `u8` arithmetic, where `wbuf[0]` is a caller-supplied register address and `i` ranges over `1_u8..(wbuf.len() as u8)`. If `wbuf[0]` is close to `u8::MAX` and the write buffer is long enough, `wbuf[0] + i - 1` overflows `u8`, which panics in debug builds and silently wraps in release builds, producing a bogus sub-address written to the wrong slave register.","fix":"Use checked/wrapping arithmetic and reject out-of-range results explicitly, e.g. `wbuf[0].checked_add(i - 1).ok_or(Error::UnexpectedValue)?`, at all four call sites.","locations":[{"ref":"lsm6dso16is/src/driver.rs:1481","code":" 1481 |             sh_cfg_write.slv0_subadd = wbuf[0] + i - 1;","lines":1,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/lsm6dso16is/src/driver.rs#L1481"},{"ref":"lsm6dso16is/src/driver.rs:1610","code":" 1610 |             sh_cfg_write.slv0_subadd = wbuf[0] + i - 1;","lines":1,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/lsm6dso16is/src/driver.rs#L1610"},{"ref":"lsm6dsv16x/src/driver.rs:3812","code":" 3812 |                 slv0_subadd: wbuf[0] + i - 1,","lines":1,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/lsm6dsv16x/src/driver.rs#L3812"},{"ref":"lsm6dsv16x/src/driver.rs:3943","code":" 3943 |                 slv0_subadd: wbuf[0] + i - 1,","lines":1,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/lsm6dsv16x/src/driver.rs#L3943"}]},{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In `Iis2dulpx::fifo_data_get` (`iis2dulpx/src/driver.rs`), the branch that decodes the 12-bit-packed `XlAndQvar`/`XlTempTag` FIFO sample (`f_md.xl_only == 0`) computes `data.heat.raw` using only `fifo_raw[4]`: `data.heat.raw = (fifo_raw[4] as i16) >> 4;`. This discards `fifo_raw[5]` entirely, even though, by the same bit layout used two lines above for the X/Y/Z axes (where the low nibble of one byte plus the next full byte are combined and then shifted, e.g. `data.xl[0].raw[1] = (((fifo_raw[1] as i16) >> 4) + ((fifo_raw[2] as i16) << 4)) << 4;`), the 12-bit temperature/AH_QVAR value spans `fifo_raw[4]`'s upper nibble and all of `fifo_raw[5]`. As written, only 4 of the 12 bits are recovered (and the result is not left-shifted to the top of the `i16` the way `from_lsb_to_celsius`/`from_lsb_to_mv` and the X/Y/Z raw values expect), so heat/AH_QVAR values decoded from the FIFO in this mode will be wildly incorrect.","fix":"Mirror the pattern used for `data.xl[0].raw[1]` (which also combines a nibble from one byte with a full following byte), incorporating `fifo_raw[5]`:\n```rust\ndata.heat.raw = (((fifo_raw[4] as i16) >> 4) + ((fifo_raw[5] as i16) << 4)) << 4;\n```\ninstead of:\n```rust\ndata.heat.raw = (fifo_raw[4] as i16) >> 4;\n```","locations":[{"ref":"iis2dulpx/src/driver.rs:2062-2077","code":" 2062 |             FifoSensorTag::XlAndQvar | FifoSensorTag::XlTempTag => {\n 2063 |                 if f_md.xl_only == 0 {\n 2064 |                     // A FIFO sample consists of 12-bits 3-axis XL + T at ODR\n 2065 |                     data.xl[0].raw[0] = ((fifo_raw[0] as i16) + ((fifo_raw[1] as i16) << 8)) << 4;\n 2066 |                     data.xl[0].raw[1] =\n 2067 |                         (((fifo_raw[1] as i16) >> 4) + ((fifo_raw[2] as i16) << 4)) << 4;\n 2068 |                     data.xl[0].raw[2] = ((fifo_raw[3] as i16) + ((fifo_raw[4] as i16) << 8)) << 4;\n 2069 | \n 2070 |                     data.heat.raw = (fifo_raw[4] as i16) >> 4;\n 2071 | \n 2072 |                     if tag_sensor == FifoSensorTag::XlTempTag {\n 2073 |                         data.heat.deg_c = from_lsb_to_celsius(data.heat.raw);\n 2074 |                     } else {\n 2075 |                         data.ah_qvar.raw = data.heat.raw;\n 2076 |                         data.ah_qvar.mv = from_lsb_to_mv(data.ah_qvar.raw);\n 2077 |                     }","lines":16,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/iis2dulpx/src/driver.rs#L2062-L2077"}]},{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`reboot()` has an off-by-one bug in its retry-exhaustion check. The polling loop runs `BOOT_SWRESET_MAX_ATTEMPTS` (5) iterations; on true failure (boot bit never clears) `cnt` ends at `5`, while on a success that happens to land on the very last permitted read, the loop `break`s with `cnt` at `4` (since `cnt` is only incremented after a failed check, and the final successful check breaks before incrementing). The guard `if cnt + 1 >= BOOT_SWRESET_MAX_ATTEMPTS` is equivalent to `cnt >= 4`, so it incorrectly also treats the `cnt == 4` (last-attempt success) case as failure and returns `Error::FailedToBoot` even though `ctrl4.boot()` was observed to be `PROPERTY_DISABLE` (i.e. boot completed successfully) on that very iteration.","fix":"Change the exhaustion check from `cnt + 1 >= BOOT_SWRESET_MAX_ATTEMPTS` to `cnt >= BOOT_SWRESET_MAX_ATTEMPTS`, so only the case where every attempt was consumed without the boot bit clearing is reported as `Error::FailedToBoot`:\n```rust\nif cnt >= BOOT_SWRESET_MAX_ATTEMPTS {\n    return Err(Error::FailedToBoot);\n}\n```","locations":[{"ref":"lis2dux12/src/driver.rs:366-387","code":"  366 |     pub async fn reboot(&mut self) -> Result<(), Error<B::Error>> {\n  367 |         let mut ctrl4 = Ctrl4::read(self).await?;\n  368 |         ctrl4.set_boot(PROPERTY_ENABLE);\n  369 |         ctrl4.write(self).await?;\n  370 | \n  371 |         let mut cnt = 0;\n  372 |         for _ in 0..BOOT_SWRESET_MAX_ATTEMPTS {\n  373 |             let ctrl4 = Ctrl4::read(self).await?;\n  374 |             // boot procedure ended correctly\n  375 |             if ctrl4.boot() == PROPERTY_DISABLE {\n  376 |                 break;\n  377 |             }\n  378 |             self.tim.delay_ms(BOOT_TIME_DELAY_MS as u32).await;\n  379 |             cnt += 1;\n  380 |         }\n  381 | \n  382 |         if cnt + 1 >= BOOT_SWRESET_MAX_ATTEMPTS {\n  383 |             return Err(Error::FailedToBoot);\n  384 |         }\n  385 | \n  386 |         Ok(())\n  387 |     }","lines":22,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/lis2dux12/src/driver.rs#L366-L387"}]},{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`sw_reset()` has the same off-by-one bug as `reboot()` (see the other finding on `reboot`). The loop delays then reads `Ctrl1::sw_reset()` up to `BOOT_SWRESET_MAX_ATTEMPTS` (5) times; a true failure (bit never clears) leaves `cnt == 5`, while success on the very last permitted read leaves `cnt == 4` because `break` happens before the increment. The check `if cnt + 1 >= BOOT_SWRESET_MAX_ATTEMPTS` (i.e. `cnt >= 4`) wrongly reports `Error::FailedToSwReset` for the `cnt == 4` case even though `ctrl1.sw_reset() == 0` was actually observed, i.e. the reset genuinely completed.","fix":"Change the exhaustion check from `cnt + 1 >= BOOT_SWRESET_MAX_ATTEMPTS` to `cnt >= BOOT_SWRESET_MAX_ATTEMPTS`:\n```rust\nif cnt >= BOOT_SWRESET_MAX_ATTEMPTS {\n    return Err(Error::FailedToSwReset);\n}\n```","locations":[{"ref":"lis2dux12/src/driver.rs:410-433","code":"  410 |     pub async fn sw_reset(&mut self) -> Result<(), Error<B::Error>> {\n  411 |         let mut ctrl1 = Ctrl1::read(self).await?;\n  412 |         ctrl1.set_sw_reset(PROPERTY_ENABLE);\n  413 |         ctrl1.write(self).await?;\n  414 | \n  415 |         let mut cnt = 0;\n  416 |         for _ in 0..BOOT_SWRESET_MAX_ATTEMPTS {\n  417 |             self.tim.delay_us(SW_RESET_DELAY_US as u32).await;\n  418 |             let ctrl1 = Ctrl1::read(self).await?;\n  419 | \n  420 |             // sw-reset procedure ended correctly\n  421 |             if ctrl1.sw_reset() == 0 {\n  422 |                 break;\n  423 |             }\n  424 | \n  425 |             cnt += 1;\n  426 |         }\n  427 | \n  428 |         if cnt + 1 >= BOOT_SWRESET_MAX_ATTEMPTS {\n  429 |             return Err(Error::FailedToSwReset);\n  430 |         }\n  431 | \n  432 |         Ok(())\n  433 |     }","lines":24,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/lis2dux12/src/driver.rs#L410-L433"}]},{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"In `Lps22df::mode_get` (`lps22df/src/driver.rs`), the low-pass filter value is reconstructed with the wrong shift amount. `mode_set` packs `val.lpf` into two register bits via `ctrl_reg2.set_en_lpfp(val.lpf as u8 & 0x01)` (bit 0) and `ctrl_reg2.set_lfpf_cfg((val.lpf as u8 & 0x02) >> 1)` (bit 1, shifted right by 1). To invert this packing, `mode_get` must shift `lfpf_cfg` left by 1, but it instead does `let lpf = (ctrl_reg2.lfpf_cfg() << 2) | ctrl_reg2.en_lpfp();` (shift left by 2). For `LowPassFilter::OdrDiv9` (`en_lpfp=1`, `lfpf_cfg=1`), this computes `(1 << 2) | 1 = 5`, which is not a valid `LowPassFilter` discriminant (`Disable=0`, `OdrDiv4=1`, `OdrDiv9=3`), so `LowPassFilter::try_from(5).unwrap_or_default()` silently falls back to `LowPassFilter::Disable`. Any caller that sets `OdrDiv9` and later reads it back via `mode_get` observes the wrong filter setting.","fix":"Change the reconstruction shift from 2 to 1 so it mirrors the `>> 1` used when packing the field in `mode_set`:\n```rust\n// before\nlet lpf = (ctrl_reg2.lfpf_cfg() << 2) | ctrl_reg2.en_lpfp();\n// after\nlet lpf = (ctrl_reg2.lfpf_cfg() << 1) | ctrl_reg2.en_lpfp();\n```","locations":[{"ref":"lps22df/src/driver.rs:334-335","code":"  334 |         ctrl_reg2.set_en_lpfp(val.lpf as u8 & 0x01);\n  335 |         ctrl_reg2.set_lfpf_cfg((val.lpf as u8 & 0x02) >> 1);","lines":2,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/lps22df/src/driver.rs#L334-L335"},{"ref":"lps22df/src/driver.rs:351","code":"  351 |         let lpf = (ctrl_reg2.lfpf_cfg() << 2) | ctrl_reg2.en_lpfp();","lines":1,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/lps22df/src/driver.rs#L351"}]},{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"In `lsm6dso16is/src/driver.rs`, `ispu_boot_get` reconstructs `IspuBootLatched` with inverted logic relative to `ispu_boot_set`. `ispu_boot_set` writes `ispu_rst_n = val as u8` and `clk_dis = val as u8` where `IspuBootLatched::On = 0x0` and `Off = 0x1`; so after `set(On)` both bits read back as `0`, and after `set(Off)` both bits read back as `1`. But `ispu_boot_get` returns `On` when `ispu_config.ispu_rst_n() == 1 || ispu_config.clk_dis() == 1` (both zero -> stays `Off`; both one -> becomes `On`), which is the exact opposite of what was just written. A round-trip `ispu_boot_set(On)` followed by `ispu_boot_get()` returns `Off`, and vice versa.","fix":"The condition must check for both bits cleared (matching `On = 0x0`), using AND instead of OR:\n```rust\npub async fn ispu_boot_get(&mut self) -> Result<IspuBootLatched, Error<B::Error>> {\n    self.operate_over_ispu(async |lock| {\n        let ispu_config = IspuConfig::read(lock).await?;\n        let mut val = IspuBootLatched::Off;\n\n        if ispu_config.ispu_rst_n() == 1 || ispu_config.clk_dis() == 1 {\n            val = IspuBootLatched::On;\n        }\n\n        Ok(val)\n    })\n    .await\n}\n```\nbecomes:\n```rust\npub async fn ispu_boot_get(&mut self) -> Result<IspuBootLatched, Error<B::Error>> {\n    self.operate_over_ispu(async |lock| {\n        let ispu_config = IspuConfig::read(lock).await?;\n        let mut val = IspuBootLatched::Off;\n\n        if ispu_config.ispu_rst_n() == 0 && ispu_config.clk_dis() == 0 {\n            val = IspuBootLatched::On;\n        }\n\n        Ok(val)\n    })\n    .await\n}\n```","locations":[{"ref":"lsm6dso16is/src/driver.rs:1086-1111","code":" 1086 |     pub async fn ispu_boot_set(&mut self, val: IspuBootLatched) -> Result<(), Error<B::Error>> {\n 1087 |         self.operate_over_ispu(async |lock| {\n 1088 |             let mut ispu_config = IspuConfig::read(lock).await?;\n 1089 |             ispu_config.set_ispu_rst_n(val as u8);\n 1090 |             ispu_config.set_clk_dis(val as u8);\n 1091 |             ispu_config.write(lock).await\n 1092 |         })\n 1093 |         .await?;\n 1094 | \n 1095 |         Ok(())\n 1096 |     }\n 1097 | \n 1098 |     /// Get the actual Boot ISPU core configuration (on/off).\n 1099 |     pub async fn ispu_boot_get(&mut self) -> Result<IspuBootLatched, Error<B::Error>> {\n 1100 |         self.operate_over_ispu(async |lock| {\n 1101 |             let ispu_config = IspuConfig::read(lock).await?;\n 1102 |             let mut val = IspuBootLatched::Off;\n 1103 | \n 1104 |             if ispu_config.ispu_rst_n() == 1 || ispu_config.clk_dis() == 1 {\n 1105 |                 val = IspuBootLatched::On;\n 1106 |             }\n 1107 | \n 1108 |             Ok(val)\n 1109 |         })\n 1110 |         .await\n 1111 |     }","lines":26,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/lsm6dso16is/src/driver.rs#L1086-L1111"}]},{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`Asm330lhh::int_notification_set` incorrectly derives the `lir` bit of `IntCfg0` from `(val as u8) & 0x01` instead of `((val as u8) >> 1) & 0x01`. The corresponding getter, `int_notification_get`, reconstructs the `Lir` value as `(int_cfg0.lir() << 1) + int_cfg0.int_clr_on_read()`, i.e. it expects `lir` to hold bit 1 of the enum value and `int_clr_on_read` to hold bit 0. Because `set` writes bit 0 into *both* `lir` and `int_clr_on_read`, the set/get round trip is broken for `Lir::BaseLatchedEmbPulsed` (1) and `Lir::BasePulsedEmbLatched` (2): setting `BaseLatchedEmbPulsed` (val=1) programs `lir=1, int_clr_on_read=1`, which `int_notification_get` then reads back as `AllIntLatched` (3); setting `BasePulsedEmbLatched` (val=2) programs `lir=0, int_clr_on_read=0`, read back as `AllIntPulsed` (0). Only `AllIntPulsed` (0) and `AllIntLatched` (3) happen to round-trip correctly because their two bits are equal.","fix":"Extract bit 1 for `lir` and bit 0 for `int_clr_on_read`, matching `int_notification_get`:\n```rust\npub async fn int_notification_set(&mut self, val: Lir) -> Result<(), Error<B::Error>> {\n    let mut int_cfg0 = IntCfg0::read(self).await?;\n    int_cfg0.set_lir(((val as u8) >> 1) & 0x01);\n    int_cfg0.set_int_clr_on_read((val as u8) & 0x01);\n    int_cfg0.write(self).await?;\n    Ok(())\n}\n```","locations":[{"ref":"asm330lhh/src/driver.rs:1391-1397","code":" 1391 |     pub async fn int_notification_set(&mut self, val: Lir) -> Result<(), Error<B::Error>> {\n 1392 |         let mut int_cfg0 = IntCfg0::read(self).await?;\n 1393 |         int_cfg0.set_lir((val as u8) & 0x01);\n 1394 |         int_cfg0.set_int_clr_on_read((val as u8) & 0x01);\n 1395 |         int_cfg0.write(self).await?;\n 1396 |         Ok(())\n 1397 |     }","lines":7,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/asm330lhh/src/driver.rs#L1391-L1397"},{"ref":"asm330lhh/src/driver.rs:1406-1411","code":" 1406 |     pub async fn int_notification_get(&mut self) -> Result<Lir, Error<B::Error>> {\n 1407 |         let int_cfg0 = IntCfg0::read(self).await?;\n 1408 | \n 1409 |         let val = (int_cfg0.lir() << 1) + int_cfg0.int_clr_on_read();\n 1410 |         Ok(Lir::try_from(val).unwrap_or_default())\n 1411 |     }","lines":6,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/asm330lhh/src/driver.rs#L1406-L1411"}]},{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `asm330lhhx/src/register/sensor_hub.rs`, the `StartConfig` enum's `#[default]` attribute is placed on `ExtOnInt2Pin = 1` instead of `XlGyDrdy = 0`. The corresponding bitfield in `MasterConfig` (`pub start_config: u8`, in the same file) declares `#[bits(1, default = 0)]`, i.e. the register's true power-on-reset value is `0` (`XlGyDrdy`). Every other enum tied to a `MASTER_CONFIG`/sensor-hub field in this file (`AuxSensOn`, `ShubPuEn`, `WriteOnce`, `ShubOdr`) correctly places `#[default]` on the variant matching the field's `default = 0`; `StartConfig` is the sole exception. Any code that relies on `StartConfig::default()` (e.g. to build an initial/reset configuration) will therefore select `ExtOnInt2Pin` (trigger sensor-hub reads from the INT2 pin edge) instead of the actual hardware default `XlGyDrdy` (trigger from accelerometer/gyroscope data-ready), silently mis-configuring the sensor hub trigger source.","fix":"Move `#[default]` to the variant whose discriminant matches the bitfield's declared default (`0`):\n```rust\n#[repr(u8)]\n#[derive(Clone, Copy, PartialEq, Default, TryFrom)]\n#[try_from(repr)]\npub enum StartConfig {\n    #[default]\n    XlGyDrdy = 0,\n    ExtOnInt2Pin = 1,\n}\n```","locations":[{"ref":"asm330lhhx/src/register/sensor_hub.rs:501-508","code":"  501 | #[repr(u8)]\n  502 | #[derive(Clone, Copy, PartialEq, Default, TryFrom)]\n  503 | #[try_from(repr)]\n  504 | pub enum StartConfig {\n  505 |     #[default]\n  506 |     ExtOnInt2Pin = 1,\n  507 |     XlGyDrdy = 0,\n  508 | }","lines":8,"link":"https://github.com/STMicroelectronics/st-mems-rust-drivers/blob/a577310fa5e1fe2dd9f4561b30694b7d9f6f601d/asm330lhhx/src/register/sensor_hub.rs#L501-L508"}]},{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`Iis2dulpx::ln_pg_write` and `Iis2dulpx::ln_pg_read` (`iis2dulpx/src/driver.rs`) validate `len > buf.len()` *after* they have already put the device into page-write/page-read mode (`PageRw::set_page_write`/`set_page_read`) and selected a page (`PageSel`, `PageAddress`). When the length check fails, the function returns `Err(Error::BufferTooSmall)` immediately, skipping the cleanup code at the end of the closure that resets `page_sel` to 0 and clears `page_read`/`page_write` in `PageRw`. This leaves the sensor's advanced-features page mechanism enabled (page write or page read still active on whatever page was last selected) after a failed call, which can corrupt or misdirect subsequent unrelated register accesses to the advanced-features page area.","fix":"Move the length check to the very top of the closure, before any register is written, e.g. in `ln_pg_write`:\n```rust\nself.operate_over_emb(async |state| {\n    if len > buf.len() as u8 {\n        return Err(Error::BufferTooSmall);\n    }\n    let [mut lsb, mut msb] = address.to_le_bytes();\n    // ... existing page_rw / page_sel / page_addr setup and write loop unchanged\n})\n.await\n```\nand apply the same reordering to `ln_pg_read`, so a bad `len` never leaves the device mid-page-access state.","locations":[{"ref":"iis2dulpx/src/driver.rs:193-238","code":"  193 |     async fn ln_pg_write(&mut self, address: u16, buf: &[u8], len: u8) -> Result<(), Self::Error> {\n  194 |         self.operate_over_emb(async |state| {\n  195 |             let [mut lsb, mut msb] = address.to_le_bytes();\n  196 | \n  197 |             // page write\n  198 |             let mut page_rw = PageRw::read(state).await?;\n  199 |             page_rw.set_page_read(PROPERTY_DISABLE);\n  200 |             page_rw.set_page_write(PROPERTY_ENABLE);\n  201 |             page_rw.write(state).await?;\n  202 | \n  203 |             // set page num\n  204 |             let mut page_sel = PageSel::default().with_page_sel(msb);\n  205 |             page_sel.write(state).await?;\n  206 | \n  207 |             // set page addr\n  208 |             PageAddress::from_bits(lsb).write(state).await?;\n  209 | \n  210 |             if len > buf.len() as u8 {\n  211 |                 return Err(Error::BufferTooSmall);\n  212 |             }\n  213 | \n  214 |             for &item in buf.iter().take(len as usize) {\n  215 |                 // read value\n  216 |                 PageValue::from_bits(item).write(state).await?;\n  217 | \n  218 |                 lsb = lsb.wrapping_add(1);\n  219 | \n  220 |                 // check if page wrap\n  221 |                 if lsb == 0 {\n  222 |                     msb += 1;\n  223 |                     page_sel.set_page_sel(msb);\n  224 |                     page_sel.write(state).await?;\n  225 |                 }\n  226 |             }\n  227 | \n  228 |             // Reset page selection\n  229 |             page_sel.set_page_sel(0);\n  230 |             page_sel.write(state).await?;\n  231 | \n  232 |             page_rw = PageRw::read(state).await?;\n  233 |             page_rw.set_page_read(PROPERTY_DISABLE);\n  234 |             page_rw.set_page_write(PROPERTY_DISABLE);\n  235 |             page_rw.write(state).await\n  236 |         })\n  237 |
