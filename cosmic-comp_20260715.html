e":"  278 |     let needs_hook = radius_exists.is_none();\n  279 |     if needs_hook {\n  280 |         let hook_id = add_pre_commit_hook::<D, _>(wl_surface, xdg_radius_hook);\n  281 |         with_states(wl_surface, |surface_data| {\n  282 |             let hook_ids = surface_data\n  283 |                 .data_map\n  284 |                 .get_or_insert_threadsafe(|| ToplevelHookId::new(None));\n  285 |             let mut guard = hook_ids.lock().unwrap();\n  286 |             *guard = Some((hook_id, obj_downgrade));\n  287 |         });\n  288 |     }","lines":11,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/wayland/protocols/corner_radius.rs#L278-L288"}]},{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `MirrorHead`, after detecting that the requested head is already a mirror target or is itself mirroring (the `MirroredHeadBusy` condition), `extension_obj.post_error(...)` is called but there is no `return` afterward. Execution falls through and still creates the `PendingOutputConfiguration` with `mirroring` set and pushes `(head, Some(conf_head))` into `pending.heads`, i.e. the compositor accepts the configuration it just told the client was invalid. If the client has already queued a subsequent `Apply`/`Test` request in the same read (a common client pattern - fire requests without waiting for an error round-trip), that request can be dispatched before the connection is actually torn down and will operate on this invalid pending head configuration.","fix":"Add an early `return;` right after the `extension_obj.post_error(...)` call for the `MirroredHeadBusy` case, before creating and pushing the pending output configuration.","locations":[{"ref":"src/wayland/protocols/output_configuration/handlers/cosmic.rs:192-242","code":"  192 |             zcosmic_output_configuration_v1::Request::MirrorHead {\n  193 |                 id,\n  194 | erforms no equivalent bounds check before calling `toplevel_surface_under`/`popup_surface_under`. During workspace-switch animations (where multiple workspaces are rendered simultaneously at different offsets), this asymmetry means pointer hit-testing can select a surface belonging to a workspace whose rendered rectangle doesn't actually cover the pointer's position, while keyboard-focus hit-testing correctly excludes it.","fix":"Apply the same output-geometry intersection/bounds check in `surface_under`'s `Stage::Workspace`/`Stage::WorkspacePopups` arms as is already done in `element_under`, unless `toplevel_surface_under`/`popup_surface_under` are verified to already perform equivalent bounds checking internally (in which case the duplicate check in `element_under` could instead be removed for consistency).","locations":[{"ref":"src/input/mod.rs:2201-2230","code":" 2201 |                     Stage::WorkspacePopups { workspace, offset } => {\n 2202 |                         let location = global_pos + offset.as_global().to_f64();\n 2203 |                         let output = workspace.output();\n 2204 |                         let output_geo = output.geometry().to_local(output);\n 2205 |                         if Rectangle::new(offset.as_local(), output_geo.size)\n 2206 |                             .intersection(output_geo)\n 2207 |                             .is_some_and(|geometry| {\n 2208 |                                 geometry.contains(global_pos.to_local(output).to_i32_round())\n 2209 |                             })\n 2210 |                             && let Some(element) = workspace.popup_element_under(location, seat)\n 2211 |                         {\n 2212 |                             return ControlFlow::Break(Ok(Some(element)));\n 2213 |                         }\n 2214 |                     }\n 2215 |                     Stage::Workspace { workspace, offset } => {\n 2216 |                         let location = global_pos + offset.as_global().to_f64();\n 2217 |                         let output = workspace.output();\n 2218 |                         let output_geo = output.geometry().to_local(output);\n 2219 |                         if Rectangle::new(offset.as_local(), output_geo.size)\n 2220 |                             .intersection(output_geo)\n 2221 |                             .is_some_and(|geometry| {\n 2222 |                                 geometry.contains(global_pos.to_local(output).to_i32_round())\n 2223 |                             })\n 2224 |                             && let Some(element) = workspace.toplevel_element_under(location, seat)\n 2225 |                         {\n 2226 |                             return ControlFlow::Break(Ok(Some(element)));\n 2227 |                         }\n 2228 |                     }\n 2229 |                 }\n 2230 |                 ControlFlow::Continue(())","lines":30,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/input/mod.rs#L2201-L2230"},{"ref":"src/input/mod.rs:2367-2382","code":" 2367 |                     Stage::WorkspacePopups { workspace, offset } => {\n 2368 |                         let global_pos = global_pos + offset.to_f64().as_global();\n 2369 |                         if let Some(under) =\n 2370 |                             workspace.popup_surface_under(global_pos, overview.clone(), seat)\n 2371 |                         {\n 2372 |                             return ControlFlow::Break(Ok(Some(under)));\n 2373 |                         }\n 2374 |                     }\n 2375 |                     Stage::Workspace { workspace, offset } => {\n 2376 |                         let global_pos = global_pos + offset.to_f64().as_global();\n 2377 |                         if let Some(under) =\n 2378 |                             workspace.toplevel_surface_under(global_pos, overview.clone(), seat)\n 2379 |                         {\n 2380 |                             return ControlFlow::Break(Ok t.time,\n  578 |                         );\n  579 |                         element.pointer_entered = false;\n  580 |                     })\n  581 |             }","lines":16,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/shell/grabs/menu/mod.rs#L566-L581"}]},{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`OutputZoomState::animating_level` computes `percentage = elapsed / ANIMATION_DURATION` and feeds it directly into `ease(Linear, old_level, self.level, percentage)` without clamping to `[0, 1]` or checking whether the animation already finished. Its sibling `animating_focal_point` explicitly checks `duration_since > ANIMATION_DURATION` and early-returns the final value in that case. If `animating_level` is ever queried before the per-frame `refresh()` call clears an expired `previous_level` (or refresh lags behind for any output), `percentage` can exceed `1.0`, and `keyframe::ease` with `Linear` will overshoot past the target level instead of clamping to it.","fix":"Mirror the pattern used in `animating_focal_point`: check if `duration_since(*start) > ANIMATION_DURATION`, and if so, clear `previous_level` and return `self.level` directly; otherwise clamp `percentage` to `.min(1.0)` before calling `ease`.","locations":[{"ref":"src/shell/zoom.rs:130-139","code":"  130 |     pub fn animating_level(&self) -> f64 {\n  131 |         if let Some((old_level, start)) = self.previous_level.as_ref() {\n  132 |             let percentage = Instant::now().duration_since(*start).as_millis() as f32\n  133 |                 / ANIMATION_DURATION.as_millis() as f32;\n  134 | \n  135 |             ease(Linear, *old_level, self.level, percentage)\n  136 |         } else {\n  137 |             self.level\n  138 |         }\n  139 |     }","lines":10,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/shell/zoom.rs#L130-L139"}]},{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`surface_corners` computes `half_min_dim` as a safety clamp so a client-supplied corner radius can never be large enough to disconnect the surface outline: `u8::try_from(size.w.min(size.h) / 2).unwrap_or(u8::MAX)`. If the conversion fails (e.g. because the dimension is negative, which can happen transiently for surfaces without a settled geometry), the fallback is `u8::MAX` (255) -- i.e. the *least* restrictive value -- which defeats the purpose of the guard instead of failing safe.","fix":"Fall back to `0` (or clamp negative sizes to 0 before the `min`/division) instead of `u8::MAX`, e.g. `u8::try_from(size.w.min(size.h).max(0) / 2).unwrap_or(0)`, so an unexpected/negative size disables corner rounding rather than allowing an unbounded radius.","locations":[{"ref":"src/wayland/handlers/corner_radius.rs:71-91","code":"   71 | pub fn surface_corners(states: &SurfaceData, size: Size<i32, Logical>) -> Option<[u8; 4]> {\n   72 |     let mut guard = states.cached_state.get::<CacheableCorners>();\n   73 | \n   74 |     // guard against corner radius being too large, potentially disconnecting the outline\n   75 |     let half_min_dim = u8::try_from(size.w.min(size.h) / 2).unwrap_or(u8::MAX);\n   76 |     let corners = guard.current().0?;\n   77 | \n   78 |     Some([\n   79 |         u8::try_from(corners.top_left)\n   80 |             .unwrap_or(u8::MAX)\n   81 |             .min(half_min_dim),\n   82 |         u8::try_from(corners.top_right)\n   83 |             .unwrap_or(u8::MAX)\n   84 |             .min(half_min_dim),\n   85 |         u8::try_from(corners.bottom_right)\n   86 |             .unwrap_or(u8::MAX)\n   87 |             .min(half_min_dim),\n   88 |         u8::try_from(corners.bottom_left)\n   89 |             .unwrap_or(u8::MAX)\n   90 |             .min(half_min_dim),\n   91 |     ])","lines":21,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/wayland/handlers/corner_radius.rs#L71-L91"}]},{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`send_workspace_to_client` in ext.rs only sends the one-shot `id` event when `handle_state.ext_id.is_none()`, but `handle_state.ext_id` is never assigned anywhere in the file (the `WorkspaceDataInner.ext_id` field is only ever read, never written). Consequently the guard is always true and `instance.id(id)` fires on every call to `send_workspace_to_client`, i.e. on every `refresh`/output update, not just once as the ext-workspace protocol intends for this immutable identifier event.","fix":"After sending `instance.id(id)`, persist it: `handle_state.ext_id = Some(id);` (and use that stored value for `instance.id(...)` instead of re-cloning from `workspace.ext_id` each time) so the event is only emitted once per workspace handle.","locations":[{"ref":"src/wayland/protocols/workspace/ext.rs:487-491","code":"  487 |     if handle_state.ext_id.is_none()\n  488 |         && let Some(id) = workspace.ext_id.clone()\n  489 |     {\n  490 |         instance.id(id);\n  491 |     }","lines":5,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/wayland/protocols/workspace/ext.rs#L487-L491"},{"ref":"src/wayland/protocols/workspace/ext.rs:48-56","code":"   48 | pub struct WorkspaceDataInner {\n   49 |     pub(super) group: Option<ExtWorkspaceGroupHandleV1>,\n   50 |     name: String,\n   51 |     capabilities: Option<ext_workspace_handle_v1::WorkspaceCapabilities>,\n   52 |     coordinates: Vec<u32>,\n   53 |     states: Option<ext_workspace_handle_v1::State>,\n   54 |     ext_id: Option<String>,\n   55 |     pub(super) cosmic_v2_handle: Option<Weak<ZcosmicWorkspaceHandleV2>>,\n   56 | }","lines":9,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/wayland/protocols/workspace/ext.rs#L48-L56"}]},{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`WorkspaceUpdateGuard::move_workspace_to_group` always removes the workspace from its current group and pushes it onto the end of the target group's `workspaces` Vec, even when `group_handle` refers to the group the workspace is already in. In that case the call still silently reorders the workspace to the end of the list (remove + re-append) instead of leaving its position unchanged, which can visibly reshuffle workspace ordering for clients in response to what should be a no-op 'assign to current group' request.","fix":"Early-return (or skip the remove/push) when the workspace's current group id already equals `group_handle.id`.","locations":[{"ref":"src/wayland/protocols/workspace/mod.rs:419-454","code":"  419 |     pub fn move_workspace_to_group(\n  420 |         &mut self,\n  421 |         group_handle: WorkspaceGroupHandle,\n  422 |         workspace_handle: WorkspaceHandle,\n  423 |     ) {\n  424 |         // Get index of new group\n  425 |         let Some(group_idx) = self.0.groups.iter().position(|g| g.id == group_handle.id) else {\n  426 |             // If the new group doesn't exist, we shouldn't remove the workspace from its old group\n  427 |             return;\n  428 |         };\n  429 | \n  430 |         // Find old group index, and remove the workspace\n  431 |         let Some(workspace) = self.0.groups.iter_mut().find_map(|group| {\n  432 |             let idx = group\n  433 |                 .workspaces\n  434 |                 .iter()\n  435 |                 .position(|w| w.id == workspace_handle.id)?;\n  436 |             Some(group.workspaces.remove(idx))\n  437 |         }) else {\n  438 |             // Workspace not found in any group\n  439 |             return;\n  440 |         };\n  441 | \n  442 |         // Send `workspace_leave` for ever instance with old group.\n  443 |         //\n  444 | src/wayland/protocols/corner_radius.rs:576-604","code":"  576 |             cosmic_corner_radius_layer_v1::Request::UnsetPadding => {\n  577 |                 let mut guard = data.lock().unwrap();\n  578 |                 guard.corners = None;\n  579 | \n  580 |                 let CornerRadiusSurface::Layer(layer_surface) = &guard.surface else {\n  581 |                     unreachable!(\"corner_radius_layer without layer shell?\");\n  582 |                 };\n  583 |                 let Some(layer_surface) = layer_surface.upgrade().ok().and_then(|layer| {\n  584 |                     state\n  585 |                         .shell_state()\n  586 |                         .layer_surfaces()\n  587 |                         .find(|s| s.shell_surface() == &layer)\n  588 |                 }) else {\n  589 |                     resource.post_error(\n  590 |                         cosmic_corner_radius_layer_v1::Error::LayerDestroyed as u32,\n  591 |                         format!(\"{:?} No layer found\", resource),\n  592 |                     );\n  593 |                     return;\n  594 |                 };\n  595 | \n  596 |                 with_states(layer_surface.wl_surface(), |s| {\n  597 |                     let mut cached = s.cached_state.get::<CacheablePadding>();\n  598 |                     let pending = cached.pending();\n  599 |                     *pending = CacheablePadding(None);\n  600 |                 });\n  601 |                 drop(guard);\n  602 | \n  603 |                 state.unset_padding(data);\n  604 |             }","lines":29,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/wayland/protocols/corner_radius.rs#L576-L604"}]},{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"`TilingExceptions::new` validates the `title` regex but logs `exception.appid` in the warning instead of `exception.title`, making the diagnostic message misleading when a title regex fails to compile (it will print the app-id string, not the invalid title pattern that actually caused the error).","fix":"Change the warning to reference `exception.title`: `warn!(\"Invalid regex for title: {}, {}\", exception.title, e);`","locations":[{"ref":"src/shell/layout/mod.rs:76-78","code":"   76 |             if let Err(e) = Regex::new(&exception.title) {\n   77 |                 warn!(\"Invalid regex for title: {}, {}\", exception.appid, e);\n   78 |                 continue;","lines":3,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/shell/layout/mod.rs#L76-L78"}]},{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"easy","description":"In the `XWaylandEvent::Ready` handler, if `X11Wm::start_wm` fails, the closure logs the error and returns early without ever calling `data.notify_ready()`. `notify_ready` uses `Once::call_once` and is otherwise only invoked from the `Ready`/`Error` branches of this same handler and from `launch_xwayland`'s own early failure paths, and from the non-Xwayland branches in the KMS/winit/x11 backends (which are skipped when Xwayland is enabled). If WM startup fails after Xwayland itself came up, readiness is never signalled: systemd is never told the service is ready, `session::run_socket` (cosmic-session IPC) is never set up, and a kiosk-mode child command is never launched, effectively hanging session startup.","fix":"Call `data.notify_ready();` in the `Err(err)` arm before returning, mirroring the `XWaylandEvent::Error` branch below it.","locations":[{"ref":"src/xwayland.rs:159-170","code":"  159 |                     let wm = match X11Wm::start_wm(\n  160 |                         data.common.event_loop_handle.clone(),\n  161 |                         &data.common.display_handle,\n  162 |                         x11_socket,\n  163 |                         client.clone(),\n  164 |                     ) {\n  165 |                         Ok(wm) => wm,\n  166 |                         Err(err) => {\n  167 |                             error!(?err, \"Failed to start Xwayland WM\");\n  168 |                             return;\n  169 |                         }\n  170 |                     };","lines":12,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/xwayland.rs#L159-L170"}]},{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`try_vulkan_allocator` is explicitly written to gracefully fall back to the GBM allocator on any Vulkan failure (instance creation errors and enumeration errors are both handled with `match`/early `return None`), but the device-selection closure calls `phd.primary_node().unwrap()` and `phd.render_node().unwrap()` directly. If a Vulkan physical device fails to report its DRM node (a legitimate `Err` on some restricted/virtual drivers), this unwrap panics and crashes compositor startup instead of falling back to GBM as the rest of the function intends.","fix":"Replace the `.unwrap()` calls with `.ok().flatten()` (or a nested `match`) so a query error is treated like 'no match', consistent with the surrounding fallback logic, e.g. `phd.primary_node().ok().flatten() == Some(*node) || phd.render_node().ok().flatten() == Some(*node)`.","locations":[{"ref":"src/backend/x11.rs:294-304","code":"  294 |     let Some(device) = devices\n  295 |         .filter(|phd| {\n  296 |             phd.has_device_extension(smithay::reexports::ash::ext::physical_device_drm::NAME)\n  297 |         })\n  298 |         .find(|phd| {\n  299 |             phd.primary_node().unwrap() == Some(*node) || phd.render_node().unwrap() == Some(*node)\n  300 |         })\n  301 |     else {\n  302 |         debug!(?node, \"No vulkan device for node, falling back to gbm.\");\n  303 |         return None;\n  304 |     };","lines":11,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/backend/x11.rs#L294-L304"}]},{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`OutputPowerState::refresh` silently does nothing when `data.output.upgrade()` fails (the output was destroyed) or `state.get_dpms(&output)` returns `None` (dpms state unavailable) - the entry is left in `output_powers` with a stale mode and the client is never told anything changed. This is inconsistent with the `SetMode` request handler, which explicitly calls `obj.failed()` and removes the entry from `output_powers` in the same situation (output gone / dpms unavailable). Clients relying on `refresh`-driven updates (e.g. an output removed while a `zwlr_output_power_v1` object is bound to it) never receive a `failed` event and keep believing the last known power mode is current.","fix":"In the `else` branch of the `if let Some(output) = ... && let Some(on) = ...` in `refresh`, call `output_power.failed()` and remove the entry from `output_powers`, mirroring the cleanup already done in the `SetMode` handler.","locations":[{"ref":"src/wayland/protocols/output_power.rs:57-72","code":"   57 |     pub fn refresh<D: OutputPowerHandler>(state: &mut D) {\n   58 |         let mut output_powers = mem::take(&mut state.output_power_state().output_powers);\n   59 |         for (output_power, old_mode) in output_powers.iter_mut() {\n   60 |             let data = output_power.data::<OutputPowerData>().unwrap();\n   61 |             if let Some(output) = data.output.upgrade()\n   62 |                 && let Some(on) = state.get_dpms(&output)\n   63 |             {\n   64 |                 let mode = output_power_mode(on);\n   65 |                 if mode != *old_mode {\n   66 |                     output_power.mode(mode);\n   67 |                     *old_mode = mode;\n   68 |                 }\n   69 |             }\n   70 |         }\n   71 |         state.output_power_state().output_powers = output_powers;\n   72 |     }","lines":16,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/wayland/protocols/output_power.rs#L57-L72"}]},{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"In `DisableHead`, when the disabled head is currently used as a mirroring target by another pending head config, the code falls back to `head.post_error(zwlr_output_configuration_v1::Error::UnconfiguredHead, ...)` when there is no `extension_obj`. `head` here is a `&ZwlrOutputHeadV1` resource, but `zwlr_output_configuration_v1::Error` is the error enum of a *different* interface (`zwlr_output_configuration_v1`). `Resource::post_error` is generic over `impl Into<u32>` so this compiles, but it sends a wl_display error event on the `zwlr_output_head_v1` object carrying an error code number that is meaningless for that interface, which well-behaved clients/libwayland may reject or misinterpret as protocol corruption. Additionally, in both branches, the request falls through to `pending.heads.push((head, None))` regardless of whether the busy error was raised - there is no early `return` after posting the error (contrast with `EnableHead` just above, which does `return` after `AlreadyConfiguredHead`), leaving inconsistent/undefined pending head configuration state after a fatal protocol error was already raised for the client.","fix":"Post the `MirroredHeadBusy`/error on the correct object (e.g. always via `extension_obj` when present, otherwise post the error on `obj` (`ZwlrOutputConfigurationV1`) using an error code defined on that interface) and add an early `return;` after posting the error, matching the pattern used in `EnableHead`.","locations":[{"ref":"src/wayland/protocols/output_configuration/handlers/wlr.rs:218-252","code":"  218 |             zwlr_output_configuration_v1::Request::DisableHead { head } => {\n  219 |                 let mut pending = data.lock().unwrap();\n  220 |                 if pending.heads.iter().any(|(h, _)| *h == head) {\n  221 |                     obj.post_error(\n  222 |                         zwlr_output_configuration_v1::Error::AlreadyConfiguredHead,\n  223 |                         format!(\"{:?} was already configured\", head),\n  224 |                     );\n  225 |                     return;\n  226 |                 }\n  227 | \n  228 |                 if pending.heads.iter().any(|(_, c)| match c {\n  229 |                     Some(conf) => {\n  230 |                         let output_conf = conf.data::<PendingOutputConfiguration>().unwrap();\n  231 |                         let output = head.data::<WeakOutput>().unwrap();\n  232 |                         let pending_conf = output_conf.lock().unwrap();\n  233 |                         pending_conf.mirroring.as_ref().is_some_and(|o| o == output)\n  234 |                     }\n  235 |                     None => false,\n  236 |                 }) {\n  237 |                     if let Some(extension_obj) = pending.extension_obj.as_ref() {\n  238 |                         extension_obj.post_error(\n  239 |                             zcosmic_output_configuration_v1::Error::MirroredHeadBusy,\n  240 |                             format!(\"{:?} is disabled and mirrored\", head),\n  241 |                         );\n  242 |                     } else {\n  243 |                         // unreachable?\n  244 |                         head.post_error(\n  245 |                             zwlr_output_configuration_v1::Error::UnconfiguredHead,\n  246 |                             format!(\"{:?} is disabled and mirrored\", head),\n  247 |                         );\n  248 |                     }\n  249 |                 }\n  250 | \n  251 |                 pending.heads.push((head, None));\n  252 |             }","lines":35,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/wayland/protocols/output_configuration/handlers/wlr.rs#L218-L252"}]},{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"high","difficulty":"medium","description":"In the cosmic-session socket read handler installed by `run_socket`, `stream.stream.read(&mut stream.buffer)` returning `Ok(0)` (peer closed the connection / EOF) is not distinguished from a partial read. The code only checks `stream.read_bytes != 0 && stream.read_bytes == stream.size as usize` to decide completion; on EOF, `read_bytes` stays unchanged (often 0) and the handler falls through to `Ok(PostAction::Continue)`. Since the fd is registered with `Interest::READ` and `Mode::Level`, a closed/EOF'd socket remains readable-level-triggered forever, so calloop will call this callback again immediately, `read()` will again return `Ok(0)`, and so on - a tight busy loop pinning a CPU core for as long as cosmic-comp runs after cosmic-session's socket is closed (e.g. if cosmic-session crashes or exits before cosmic-comp).","fix":"Treat `Ok(0)` from `read()` as connection closed and return `Ok(PostAction::Remove)` (similar to how the `Err` branches already do), instead of only checking against the expected message size.","locations":[{"ref":"src/session.rs:106-153","code":"  106 |             handle.insert_source(\n  107 |                 Generic::new(StreamWrapper::from(session_socket), Interest::READ, Mode::Level),\n  108 |                 move |_, stream, _state| {\n  109 |                     // SAFETY: We don't drop the stream!\n  110 |                     let stream = unsafe { stream.get_mut() };\n  111 | \n  112 |                     if stream.size == 0 {\n  113 |                         let mut len = [0u8; 2];\n  114 |                         match stream.stream.read_exact(&mut len) {\n  115 |                             Ok(()) => {\n  116 |                                 stream.size = u16::from_ne_bytes(len);\n  117 |                                 stream.buffer = vec![0; stream.size as usize];\n  118 |                             },\n  119 |                             Err(err) => {\n  120 |                                 warn!(?err, \"Error reading from session socket\");\n  121 |                                 return Ok(PostAction::Remove);\n  122 |                             }\n  123 |                         }\n  124 |                     }\n  125 | \n  126 |                     stream.read_bytes += match stream.stream.read(&mut stream.buffer) {\n  127 |                         Ok(size) => size,\n  128 |                         Err(err) => {\n  129 |                             error!(?err, \"Error reading from session socket\");\n  130 |                             return Ok(PostAction::Remove);\n  131 |                         }\n  132 |                     };\n  133 | \n  134 |                     if stream.read_bytes != 0 && stream.read_bytes == stream.size as usize {\n  135 |                         stream.size = 0;\n  136 |                         stream.read_bytes = 0;\n  137 |                         match std::str::from_utf8(&stream.buffer) {\n  138 |                             Ok(message) => {\n  139 |                                 match serde_json::from_str::<'_, Message>(message) {\n  140 |                                     Ok(Message::SetEnv { .. }) => warn!(\"Got SetEnv from session? What is this?\"),\n  141 |                                     _ => warn!(\"Unknown session socket message, are you using incompatible cosmic-session and cosmic-comp versions?\"),\n  142 |                                 };\n  143 |                                 Ok(PostAction::Continue)\n  144 |                             },\n  145 |                             Err(err) => {\n  146 |                                 warn!(?err, \"Invalid message from session sock\");\n  147 |                                 Ok(PostAction::Continue)\n  148 |                             }\n  149 |                         }\n  150 |                     } else {\n  151 |                         Ok(PostAction::Continue)\n  152 |                     }\n  153 |                 },","lines":48,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/session.rs#L106-L153"}]},{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"medium","difficulty":"very_easy","description":"`update_pointer_focus` takes a write (exclusive) lock on `state.common.shell` just to call\n`State::surface_under(position, &output, &shell)`, which only needs `&Shell`. The equivalent call\nin `update_focus_state` (a few dozen lines above, same file) correctly uses `state.common.shell.read()`\nfor the exact same function. Taking an exclusive lock here unnecessarily serializes against every\nother reader of `Shell` (e.g. rendering) on every pointer-focus refresh, which runs frequently\n(once per seat on every `refresh_focus` call).","fix":"Change `state.common.shell.write()` to `state.common.shell.read()` at line 728; `State::surface_under` only takes `&Shell`.","locations":[{"ref":"src/shell/focus/mod.rs:723-745","code":"  723 | fn update_pointer_focus(state: &mut State, seat: &Seat<State>) {\n  724 |     if let Some(pointer) = seat.get_pointer() {\n  725 |         let output = seat.active_output();\n  726 |         let position = pointer.current_location().as_global();\n  727 | \n  728 |         let shell = state.common.shell.write();\n  729 |         let under = State::surface_under(position, &output, &shell)\n  730 |             .map(|(target, pos)| (target, pos.as_logical()));\n  731 |         drop(shell);\n  732 | \n  733 |         if pointer.current_focus().as_ref() != under.as_ref().map(|(target, _)| target) {\n  734 |             pointer.motion(\n  735 |                 state,\n  736 |                 under,\n  737 |                 &MotionEvent {\n  738 |                     location: pointer.current_location(),\n  739 |                     serial: SERIAL_COUNTER.next_serial(),\n  740 |                     time: state.common.clock.now().as_millis(),\n  741 |                 },\n  742 |             );\n  743 |         }\n  744 |     }\n  745 | }","lines":23,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/shell/focus/mod.rs#L723-L745"}]},{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`CosmicWindow::min_size` and `CosmicWindow::max_size` each call `self.0.with_program(...)` twice - once to fetch the min/max size and a second time, inside the `Option::map` closure, just to re-check `is_decorated`. Each `with_program` call acquires the `IcedElement`'s internal lock. This is a minor but easily avoidable redundant lock/borrow per call.","fix":"Fetch both the size and the decoration flag from a single `with_program` closure and use the results afterward, e.g. `self.0.with_program(|p| (p.window.min_size_without_ssd(), !p.window.is_decorated(false)))`.","locations":[{"ref":"src/shell/element/window.rs:624-634","code":"  624 |     pub fn min_size(&self) -> Option<Size<i32, Logical>> {\n  625 |         self.0\n  626 |             .with_program(|p| p.window.min_size_without_ssd())\n  627 |             .map(|size| {\n  628 |                 if self.0.with_program(|p| !p.window.is_decorated(false)) {\n  629 |                     size + (0, SSD_HEIGHT).into()\n  630 |                 } else {\n  631 |                     size\n  632 |                 }\n  633 |             })\n  634 |     }","lines":11,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/shell/element/window.rs#L624-L634"},{"ref":"src/shell/element/window.rs:635-645","code":"  635 |     pub fn max_size(&self) -> Option<Size<i32, Logical>> {\n  636 |         self.0\n  637 |             .with_program(|p| p.window.max_size_without_ssd())\n  638 |             .map(|size| {\n  639 |                 if self.0.with_program(|p| !p.window.is_decorated(false)) {\n  640 |                     size + (0, SSD_HEIGHT).into()\n  641 |                 } else {\n  642 |                     size\n  643 |                 }\n  644 |             })\n  645 |     }","lines":11,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/shell/element/window.rs#L635-L645"}]},{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`WorkspaceState::done()` tracks a single global `changed` boolean across the full `ext_instances x groups` cross product. If any single group changed for any single client, `instance.done()` is then sent to *every* `ExtWorkspaceManagerV1` instance, including clients whose groups/workspaces had no actual changes. Per the ext-workspace protocol this is not incorrect (extra `done` events are harmless), but it means every client receives a wakeup/round of protocol traffic on every unrelated state change anywhere in the compositor instead of only clients that actually had something change.","fix":"Track a per-instance (or per-client) changed flag - e.g. collect the set of instances that actually received a change from `send_group_to_client` - and only call `.done()` on those instances.","locations":[{"ref":"src/wayland/protocols/workspace/mod.rs:305-319","code":"  305 |     fn done(&mut self) {\n  306 |         let mut changed = false;\n  307 |         for instance in &self.ext_instances {\n  308 |             for group in &mut self.groups {\n  309 |                 if ext::send_group_to_client::<D>(&self.dh, instance, group) {\n  310 |                     changed = true;\n  311 |                 }\n  312 |             }\n  313 |         }\n  314 |         if changed {\n  315 |             for instance in &self.ext_instances {\n  316 |                 instance.done();\n  317 |             }\n  318 |         }\n  319 |     }","lines":15,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/wayland/protocols/workspace/mod.rs#L305-L319"}]},{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"`WorkspaceUpdateGuard::remove_workspace` loops over every group in `self.0.groups` and unconditionally calls `group.workspaces.retain(|w| w.id != workspace.id)` on all of them, even though workspace ids are generated globally uniquely via `next_workspace_id()` and a given workspace can only ever belong to one group. The function does a full scan of every group's workspace list on every removal instead of stopping once the (single) owning group is found.","fix":"Use `self.0.groups.iter_mut().find(...)` to locate the single owning group, process its `ext_instances`/removal there, and `break`/return instead of scanning and retaining across every group.","locations":[{"ref":"src/wayland/protocols/workspace/mod.rs:403-417","code":"  403 |     pub fn remove_workspace(&mut self, workspace: WorkspaceHandle) {\n  404 |         for group in &mut self.0.groups {\n  405 |             if let Some(workspace) = group.workspaces.iter().find(|w| w.id == workspace.id) {\n  406 |                 for instance in &workspace.ext_instances {\n  407 |                     let workspace_data = instance.data::<WorkspaceData>().unwrap();\n  408 |                     if let Some(group_instance) = &workspace_data.inner.lock().unwrap().group {\n  409 |                         group_instance.workspace_leave(instance);\n  410 |                     }\n  411 |                     instance.removed();\n  412 |                 }\n  413 |             }\n  414 |             group.workspaces.retain(|w| w.id != workspace.id);\n  415 |         }\n  416 |         WORKSPACE_IDS.lock().unwrap().remove(&workspace.id);\n  417 |     }","lines":15,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/wayland/protocols/workspace/mod.rs#L403-L417"}]},{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"`SurfaceThreadState::postprocess_textures` is typed as `HashMap<DrmNode, PostprocessState>`, but the only place it is ever written to is `self.postprocess_textures.entry(self.target_node)` in `redraw()`, and `self.target_node` is a constant set once at construction and never reassigned. The map therefore only ever holds 0 or 1 entries, making the `HashMap` keyed lookup pointless complexity over a plain `Option<PostprocessState>`. As a side effect, `node_removed()` never removes the entry for a node from this map even though it removes the node from the renderer API, though this is currently harmless since `target_node` (the only key ever used) is not a node that gets removed via `node_removed` while the surface is alive.","fix":"Replace `postprocess_textures: HashMap<DrmNode, PostprocessState>` with `postprocess_state: Option<PostprocessState>` (re-creating it when the output config changes, as is already done on entry mismatch), removing the misleading multi-node abstraction.","locations":[{"ref":"src/backend/kms/surface/mod.rs:149","code":"  149 |     postprocess_textures: HashMap<DrmNode, PostprocessState>,","lines":1,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/backend/kms/surface/mod.rs#L149"},{"ref":"src/backend/kms/surface/mod.rs:1109-1129","code":" 1109 |             let postprocess_state = match self.postprocess_textures.entry(self.target_node) {\n 1110 |                 hash_map::Entry::Occupied(occupied) => {\n 1111 |                     let postprocess_state = occupied.into_mut();\n 1112 |                     // If output config is different, re-create offscreen state\n 1113 |                     if postprocess_state.output_config != offscreen_output_config {\n 1114 |                         *postprocess_state = PostprocessState::new_with_renderer(\n 1115 |                             &mut renderer,\n 1116 |                             compositor.format(),\n 1117 |                             offscreen_output_config,\n 1118 |                         )?\n 1119 |                     }\n 1120 |                     postprocess_state\n 1121 |                 }\n 1122 |                 hash_map::Entry::Vacant(vacant) => {\n 1123 |                     vacant.insert(PostprocessState::new_with_renderer(\n 1124 |                         &mut renderer,\n 1125 |                         compositor.format(),\n 1126 |                         offscreen_output_config,\n 1127 |                     )?)\n 1128 |                 }\n 1129 |             };","lines":21,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/backend/kms/surface/mod.rs#L1109-L1129"},{"ref":"src/backend/kms/surface/mod.rs:740-744","code":"  740 |     fn node_removed(&mut self, node: DrmNode) {\n  741 |         self.api.as_mut().remove_node(&node);\n  742 |         // force enumeration\n  743 |         let _ = self.api.devices();\n  744 |     }","lines":5,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/backend/kms/surface/mod.rs#L740-L744"}]},{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`CursorStateInner::current_image` is written in `draw_cursor` (`state.current_image = Some(frame);`) but is never read anywhere in the codebase, making it a write-only field that adds bookkeeping cost (an `Image` clone every frame a named cursor is drawn) with no observable effect.","fix":"Remove the `current_image` field (and the clone/assignment that populates it) if it is truly unused, or wire it up to whatever consumer it was intended for.","locations":[{"ref":"src/backend/render/cursor.rs:267","code":"  267 |     current_image: Option<Image>,","lines":1,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/backend/render/cursor.rs#L267"},{"ref":"src/backend/render/cursor.rs:321","code":"  321 |             current_image: None,","lines":1,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/backend/render/cursor.rs#L321"},{"ref":"src/backend/render/cursor.rs:398","code":"  398 |         state.current_image = Some(frame);","lines":1,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/backend/render/cursor.rs#L398"}]},{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`RubberBand` (with `band`, `derivative`, `clamp`, `clamp_derivative` methods) and `GestureState::projected_end_pos` are defined but never referenced anywhere in the codebase (confirmed via a repo-wide grep). This appears to be leftover/ported code (comment references niri's rubber_band.rs) that was never wired up to any gesture rubber-banding behavior.","fix":"Either wire `RubberBand`/`projected_end_pos` into the swipe-gesture handling (e.g. to rubber-band overscroll past the first/last workspace) or remove the unused code.","locations":[{"ref":"src/input/gestures/mod.rs:107-111","code":"  107 |     /// Computes the gesture end position after decelerating to a halt.\n  108 |     pub fn projected_end_pos(&self) -> f64 {\n  109 |         let vel = self.velocity();\n  110 |         self.delta - vel / (1000. * DECELERATION_TOUCHPAD.ln())\n  111 |     }","lines":5,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/input/gestures/mod.rs#L107-L111"},{"ref":"src/input/gestures/mod.rs:134-173","code":"  134 | // rubber_band.rs from Niri (GPL-3.0) https://github.com/YaLTeR/niri/blob/db49deb7fd2fbe805ceec060aa4dec65009ad7a7/src/rubber_band.rs\n  135 | #[derive(Debug, Clone, Copy)]\n  136 | pub struct RubberBand {\n  137 |     pub stiffness: f64,\n  138 |     pub limit: f64,\n  139 | }\n  140 | \n  141 | impl RubberBand {\n  142 |     pub fn band(&self, x: f64) -> f64 {\n  143 |         let c = self.stiffness;\n  144 |         let d = self.limit;\n  145 | \n  146 |         (1. - (1. / (x * c / d + 1.))) * d\n  147 |     }\n  148 | \n  149 |     pub fn derivative(&self, x: f64) -> f64 {\n  150 |         let c = self.stiffness;\n  151 |         let d = self.limit;\n  152 | \n  153 |         c * d * d / (c * x + d).powi(2)\n  154 |     }\n  155 | \n  156 |     pub fn clamp(&self, min: f64, max: f64, x: f64) -> f64 {\n  157 |         let clamped = x.clamp(min, max);\n  158 |         let sign = if x < clamped { -1. } else { 1. };\n  159 |         let diff = (x - clamped).abs();\n  160 | \n  161 |         clamped + sign * self.band(diff)\n  162 |     }\n  163 | \n  164 |     pub fn clamp_derivative(&self, min: f64, max: f64, x: f64) -> f64 {\n  165 |         if min <= x && x <= max {\n  166 |             return 1.;\n  167 |         }\n  168 | \n  169 |         let clamped = x.clamp(min, max);\n  170 |         let diff = (x - clamped).abs();\n  171 |         self.derivative(diff)\n  172 |     }\n  173 | }","lines":40,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/input/gestures/mod.rs#L134-L173"}]},{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`Seats::remove_seat` and `Seats::update_last_active` are `pub fn`s but are never called anywhere in the codebase (only `add_seat` is invoked once at startup in `src/backend/mod.rs`, and no code path removes or reassigns the active seat after that). This leaves dead API surface, and as a side effect the `Seats::last_active()` panic guard (`.expect(\"No seat?\")`) for an empty seat list is currently unreachable since seats are never removed - which itself suggests `remove_seat` was intended to be wired up (e.g. for hot-unplug of the last input backend or seat teardown) but isn't.","fix":"Either wire `remove_seat`/`update_last_active` into the seat lifecycle where they were meant to be used (e.g. libinput seat removal), or delete them if seat removal is genuinely out of scope for this compositor.","locations":[{"ref":"src/shell/seats.rs:64-71","code":"   64 |     pub fn remove_seat(&mut self, seat: &Seat<State>) {\n   65 |         self.seats.retain(|s| s != seat);\n   66 |         if self.seats.is_empty() {\n   67 |             self.last_active = None;\n   68 |         } else if self.last_active.as_ref().is_some_and(|s| s == seat) {\n   69 |             self.last_active = Some(self.seats[0].clone());\n   70 |         }\n   71 |     }","lines":8,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/shell/seats.rs#L64-L71"},{"ref":"src/shell/seats.rs:81-83","code":"   81 |     pub fn update_last_active(&mut self, seat: &Seat<State>) {\n   82 |         self.last_active = Some(seat.clone());\n   83 |     }","lines":3,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/shell/seats.rs#L81-L83"}]},{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`_group_color` is never called anywhere in the codebase; the tiling layout code uses a separate `GROUP_COLOR` constant (see `src/shell/layout/tiling/mod.rs`) instead. The leading underscore in the name only suppresses unused-variable warnings, not unused-function (`dead_code`) warnings, so this function is genuinely dead weight.","fix":"Remove `_group_color`, or if it's meant to be kept for future use, mark it explicitly with `#[allow(dead_code)]` and a comment explaining why.","locations":[{"ref":"src/theme.rs:10-13","code":"   10 | pub(crate) fn _group_color(theme: &Theme) -> [f32; 3] {\n   11 |     let neutral_8 = theme.palette.neutral_8;\n   12 |     [neutral_8.red, neutral_8.green, neutral_8.blue]\n   13 | }","lines":4,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/theme.rs#L10-L13"}]},{"id":"DEAD_6","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"The `XWaylandEvent::Error` handler does `if let Some(mut xwayland_state) = data.common.xwayland_state.take() { xwayland_state.xwm = None; }`. This takes `xwayland_state` fully out of `Common` into a local binding and then mutates a field on that now-orphaned local, which is dropped at the end of the block with no observable effect - the assignment is a complete no-op. In addition, since the underlying `calloop::EventSource` for `XWayland` always returns `PostAction::Disable` after emitting exactly one of `Ready` or `Error` (see smithay's `xwayland/xserver.rs`), `Error` can only fire before `Ready` ever ran, meaning `xwayland_state` (only ever set inside the `Ready` arm above) is always `None` at this point in practice - so the whole `if let Some(...)` block is unreachable in normal operation.","fix":"Simplify to just `data.common.xwayland_state = None;` (harmless even though it's already `None`) and drop the pointless post-take mutation, or remove the block entirely and just call `data.notify_ready();`.","locations":[{"ref":"src/xwayland.rs:180-185","code":"  180 |                 XWaylandEvent::Error => {\n  181 |                     if let Some(mut xwayland_state) = data.common.xwayland_state.take() {\n  182 |                         xwayland_state.xwm = None;\n  183 |                     }\n  184 |                     data.notify_ready();\n  185 |                 }","lines":6,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/xwayland.rs#L180-L185"}]},{"id":"DEAD_7","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"A ~24 line commented-out `merge_workspaces` function is left in the file behind a `/* We will probably need this again at some point ... */` block comment. Dead, non-compiling code left inline makes the surrounding `Workspaces`/`WorkspaceSet` API harder to scan and will bit-rot silently (it already references `remove_fullscreen`/`toplevel_info_state` signatures that may drift from the live code without anyone noticing, since the compiler never checks it).","fix":"Delete the commented-out block and rely on version control (git history) to resurrect it if actually needed later.","locations":[{"ref":"src/shell/mod.rs:459-483","code":"  459 | /* We will probably need this again at some point\n  460 | fn merge_workspaces(\n  461 |     mut workspace: Workspace,\n  462 |     into: &mut Workspace,\n  463 |     workspace_state: &mut WorkspaceUpdateGuard<'_, State>,\n  464 |     toplevel_info_state: &mut ToplevelInfoState<State, CosmicSurface>,\n  465 | ) {\n  466 |     if into.fullscreen.is_some() {\n  467 |         // Don't handle the returned original workspace, for this nieche case.\n  468 |         let _ = workspace.remove_fullscreen();\n  469 |     }\n  470 | \n  471 |     for element in workspace.mapped() {\n  472 |         // fixup toplevel state\n  473 |         for (toplevel, _) in element.windows() {\n  474 |             toplevel_info_state.toplevel_leave_workspace(&toplevel, &workspace.handle);\n  475 |             toplevel_info_state.toplevel_enter_workspace(&toplevel, &into.handle);\n  476 |         }\n  477 |     }\n  478 |     // TODO: merge minimized windows\n  479 |     into.tiling_layer.merge(workspace.tiling_layer);\n  480 |     into.floating_layer.merge(workspace.floating_layer);\n  481 |     workspace_state.remove_workspace(workspace.handle);\n  482 | }\n  483 | */","lines":25,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/shell/mod.rs#L459-L483"}]},{"id":"DEAD_8","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `OverlapNotifyState::refresh`, the loop `for other_surface in map.layers().filter(|s| *s != layer_surface)` already excludes `layer_surface` via the `LayerSurface` equality check in the `filter`. The subsequent `if other_surface.wl_surface().id() == layer_surface.wl_surface().id() { continue; }` re-checks the same condition through the underlying `wl_surface` id and can never be true, since two distinct `LayerSurface`s sharing the same `WlSurface` id would already be equal under the outer filter's `PartialEq`.","fix":"Remove the redundant inner `if ... { continue; }` check since the outer `.filter(|s| *s != layer_surface)` already guarantees it.","locations":[{"ref":"src/wayland/protocols/overlap_notify.rs:147-150","code":"  147 |                         for other_surface in map.layers().filter(|s| *s != layer_surface) {\n  148 |                             if other_surface.wl_surface().id() == layer_surface.wl_surface().id() {\n  149 |                                 continue;\n  150 |                             }","lines":4,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/wayland/protocols/overlap_notify.rs#L147-L150"}]},{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The module-level comment in `theme.rs` says the watcher updates \"a Arc<Mutex<Theme>> in the state\", but `Common::theme` is a plain `cosmic::Theme` field (see `src/state.rs:250`) guarded by the shell's `RwLock`, not an `Arc<Mutex<Theme>>`. The comment describes an outdated/incorrect data structure and is misleading to a future reader.","fix":"Update the comment to reflect the actual implementation, e.g. \"updates `Common::theme` in place and propagates it to the shell via `Shell::set_theme` on change\".","locations":[{"ref":"src/theme.rs:1-3","code":"    1 | // insert into the event loop, a watcher for the theme & theme mode for changes\n    2 | \n    3 | // update a Arc<Mutex<Theme>> in the state on change of the theme and mark all interfaces for a redraw.","lines":3,"link":"https://github.com/pop-os/c CursorMode::All,\n 1136 |                         None,\n 1137 |                         None,\n 1138 |                     )\n 1139 |                     .with_context(|| \"Failed to render outputs\")?;\n 1140 | \n 1141 |                     elements.add_output(crtc, CLEAR_COLOR, output_elements);\n 1142 |                 }","lines":16,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/backend/kms/mod.rs#L1127-L1142"}]},{"id":"DUP_2","type":"duplicate_code","type_label":"Duplicate Code","severity":"medium","difficulty":"medium","description":"`render_input_order_internal` repeats the same layer-popup/layer-surface emission pattern eight\ntimes (Bottom and Background layers, each for both the \"current\" and \"previous\" workspace during\na transition, for both popups and surfaces), differing only in the `Layer` variant passed to\n`layer_popups`/`layer_surfaces` and whether an animation `offset` is applied. For example the\n\"previous bottom layer popups\" block and the \"previous background layer popups\" block are\nbyte-for-byte identical apart from `Layer::Bottom` vs `Layer::Background`, and the same duplication\nexists again for the non-popup `layer_surfaces` variants. This makes the function harder to audit\n(any future fix to the offset/index handling has to be replicated correctly in 4-8 places) and is\na ready source of copy-paste drift.","fix":"Extract a helper, e.g. `fn emit_layer_popups(output, layer, element_filter, offset, workspace_idx, callback)`\nand `fn emit_layer_surfaces(...)`, and call it with `Layer::Bottom`/`Layer::Background` and the\nappropriate offset/index for both the current and previous workspace, replacing the eight near\nidentical inlined loops.","locations":[{"ref":"src/shell/focus/order.rs:281-293","code":"  281 |     if let Some((_, idx, has_fullscreen, offset)) = previous.as_ref()\n  282 |         && !has_fullscreen\n  283 |     {\n  284 |         // previous bottom layer popups\n  285 | utput.edid,\n  463 |                 },\n  464 |                 tiling_enabled: self.tiling_enabled,\n  465 |                 id: self.id.clone(),\n  466 |                 name: self.name.clone(),\n  467 |             })\n  468 |         } else {\n  469 |             None\n  470 |         }\n  471 |     }\n  472 | \n  473 |     #[profiling::function]\n  474 |     pub fn refresh(&mut self) {\n  475 |         // seems it removes dead windows\n  476 |         // self.fullscreen.take_if(|w| !w.alive());\n  477 |         self.fullscreen_surfaces.retain(|w| w.alive());\n  478 | \n  479 |         self.floating_layer.refresh();\n  480 |         self.tiling_layer.refresh();\n  481 |     }\n  482 | \n  483 |     fn has_activation_token(&self, xdg_activation_state: &XdgActivationState) -> bool {\n  484 |         xdg_activation_state.tokens().any(|(_, data)| {\n  485 |             if let ActivationContext::Workspace(handle) =\n  486 |                 data.user_data.get::<ActivationContext>().unwrap()\n  487 |             {\n  488 |                 *handle == self.handle\n  489 |                     && data.timestamp.elapsed() < super::ACTIVATION_TOKEN_EXPIRE_TIME\n  490 |             } else {\n  491 |                 false\n  492 |             }\n  493 |         })\n  494 |     }\n  495 | \n  496 |     // Auto-removal of workspaces is allowed if empty, unless blocked by an\n  497 |     // unused and unexpired activation token, or pinned.\n  498 |     pub fn can_auto_remove(&self, xdg_activation_state: &XdgActivationState) -> bool {\n  499 |         self.is_empty() && !self.has_activation_token(xdg_activation_state) && !self.pinned\n  500 |     }\n  501 | \n  502 |     /// cleans up any window that is not alive anymore\n  503 |     pub fn refresh_focus_stack(&mut self) {\n  504 |         for (seat, stack) in self.focus_stack.0.iter_mut() {\n  505 |             let fullscreen_surfaces: Vec<&CosmicSurface> = self\n  506 |                 .fullscreen_surfaces\n  507 | _DURATION {\n  549 |                     f.start_at.take();\n  550 |                     self.dirty.store(true, Ordering::SeqCst);\n  551 |                 }\n  552 |             }\n  553 |         }\n  554 | \n  555 |         self.fullscreen_surfaces.retain(|f| {\n  556 |             if let Some(end) = f.ended_at\n  557 |                 && Instant::now().duration_since(end) >= FULLSCREEN_ANIMATION_DURATION\n  558 |             {\n  559 |                 self.dirty.store(true, Ordering::SeqCst);\n  560 |                 return false;\n  561 |             }\n  562 |             true\n  563 |         });\n  564 | \n  565 |         let clients = self.tiling_layer.update_animation_state();\n  566 |         self.floating_layer.update_animation_state();\n  567 |         clients\n  568 |     }\n  569 | \n  570 |     pub fn output(&self) -> &Output {\n  571 |         &self.output\n  572 |     }\n  573 | \n  574 |     /// Output workspace was originally created on, or explicitly moved to by the user\n  575 |     fn explicit_output(&self) -> &OutputMatch {\n  576 |         self.output_stack.front().unwrap()\n  577 |     }\n  578 | \n  579 |     // Set output the workspace is on\n  580 |     //\n  581 |     // If `explicit` is `true`, the user has explicitly moved the workspace\n  582 |     // to this output, so previous outputs it was on can be forgotten.\n  583 |     pub fn set_output(&mut self, output: &Output, explicit: bool) {\n  584 |         self.tiling_layer.set_output(output);\n  585 |         self.floating_layer.set_output(output);\n  586 |         for mapped in self.mapped() {\n  587 |             for (surface, _) in mapped.windows() {\n  588 |                 toplevel_leave_output(&surface, &self.output);\n  589 |                 toplevel_enter_output(&surface, output);\n  590 |             }\n  591 |         }\n  592 |         for window in self.minimized_windows.iter() {\n  593 |             for surface in window.windows() {\n  594 |                 toplevel_leave_output(&surface, &self.output);\n  595 |                 toplevel_enter_output(&surface, output);\n  596 |             }\n  597 |         }\n  598 |         for f in self\n  599 |             .fullscreen_surfaces\n  600 |             .iter()\n  601 |             .filter(|f| f.ended_at.is_none())\n  602 |         {\n  603 |             toplevel_leave_output(&f.surface, &self.output);\n  604 |             toplevel_enter_output(&f.surface, output);\n  605 |         }\n  606 |         if explicit {\n  607 |             self.output_stack.clear();\n  608 |         }\n  609 |         if let Some(pos) = self\n  610 |             .output_stack\n  611 |             .iter()\n  612 |             .position(|i| output_matches(i, output, true))\n  613 |         {\n  614 |             // Matched edid and connector name\n  615 |             self.output_stack.truncate(pos + 1);\n  616 |         } else if let Some(pos) = self\n  617 |             .output_stack\n  618 |             .iter()\n  619 |             .position(|i| output_matches(i, output, false))\n  620 |         {\n  621 |             // Matched edid but not connector name; truncate entries that don't match edid,\n  622 |             // but keep old entry in case we see two outputs with the same edid.\n  623 |             self.output_stack.truncate(pos + 1);\n  624 |             self.output_stack.push_back(output_match_for_output(output));\n  625 |         } else {\n  626 |             self.output_stack.push_back(output_match_for_output(output));\n  627 |         }\n  628 |         self.output = output.clone();\n  629 |     }\n  630 | \n  631 |     pub fn prefers_output(&self, output: &Output) -> bool {\n  632 |         // Disambiguate match by connector name if existing output has same edid\n  633 |         let disambiguate = output\n  634 |             .edid()\n  635 |             .is_some_and(|edid| self.output().edid() == Some(edid));\n  636 |         self.output_stack\n  637 |             .iter()\n  638 |             .any(|i| output_matches(i, output, disambiguate))\n  639 |     }\n  640 | \n  641 |     pub fn unmap_element(&mut self, mapped: &CosmicMapped) -> Option<WorkspaceRestoreData> {\n  642 |         let was_maximized = if mapped.maximized_state.lock().unwrap().is_some() {\n  643 |             // If surface is maximized then unmaximize it, so it is assigned to only one layer\n  644 |             self.unmaximize_request(mapped)\n  645 |         } else {\n  646 |             None\n  647 |         };\n  648 | \n  649 |         self.focus_stack.0.values_mut().for_each(|set| {\n  650 |             set.shift_remove(mapped);\n  651 |         });\n  652 | \n  653 |         if let Some(pos) = self.minimized_windows.iter().position(|m| m == mapped) {\n  654 |             let state = self.minimized_windows.remove(pos);\n  655 |             mapped.set_minimized(false);\n  656 |             return Some(match state {\n  657 |                 MinimizedWindow::Floating { previous, .. } => {\n  658 |                     WorkspaceRestoreData::Floating(previous)\n  659 |                 }\n  660 |                 MinimizedWindow::Tiling { previous, .. } => WorkspaceRestoreData::Tiling(previous),\n  661 |                 MinimizedWindow::Fullscreen { .. } => unreachable!(),\n  662 |             });\n  663 |         }\n  664 | \n  665 |         if let Ok(state) = self.tiling_layer.unmap(mapped, None) {\n  666 |             return Some(WorkspaceRestoreData::Tiling(TilingRestoreData {\n  667 |                 state,\n  668 |                 was_maximized: was_maximized.is_some(),\n  669 |             }));\n  670 |         }\n  671 | \n  672 |         let was_snapped = *mapped.floating_tiled.lock().unwrap();\n  673 |         // unmaximize_request might have triggered a `floating_layer.refresh()`,\n  674 |         // which may have already removed a non-alive surface.\n  675 |         if let Some(floating_geometry) = self.floating_layer.unmap(mapped, None).or(was_maximized) {\n  676 |             return Some(WorkspaceRestoreData::Floating(FloatingRestoreData {\n  677 |                 geometry: floating_geometry,\n  678 |                 output_size: self.output.geometry().size.as_logical(),\n  679 |                 was_maximized: was_maximized.is_some(),\n  680 |                 was_snapped,\n  681 |             }));\n  682 |         };\n  683 | \n  684 |         None\n  685 |     }\n  686 | \n  687 |     pub fn unmap_surface<S>(&mut self, surface: &S) -> Option<(CosmicSurface, WorkspaceRestoreData)>\n  688 |     where\n  689 |         CosmicSurface: PartialEq<S>,\n  690 |     {\n  691 |         if let Some(idx) = self\n  692 |             .fullscreen_surfaces\n  693 |             .iter()\n  694 |             .position(|f| f.ended_at.is_none() && &f.surface == surface)\n  695 |         {\n  696 |             let (surface, previous_state, previous_geometry) =\n  697 |                 self.remove_fullscreen_at(idx).unwrap();\n  698 |             return Some((\n  699 |                 surface,\n  700 |                 WorkspaceRestoreData::Fullscreen(previous_state.zip(previous_geometry).map(\n  701 |                     |(previous_state, previous_geometry)| FullscreenRestoreData {\n  702 |                         previous_state,\n  703 |                         previous_geometry,\n  704 |                     },\n  705 |                 )),\n  706 |             ));\n  707 |         }\n  708 | \n  709 |         if let Some(pos) = self.minimized_windows.iter().position(|m| {\n  710 |             if let MinimizedWindow::Fullscreen { surface: s, .. } = m {\n  711 |                 s == surface\n  712 |             } else {\n  713 |                 false\n  714 |             }\n  715 |         }) {\n  716 |             let MinimizedWindow::Fullscreen { surface, previous } =\n  717 |                 self.minimized_windows.remove(pos)\n  718 |             else {\n  719 |                 unreachable!()\n  720 |             };\n  721 | \n  722 |             surface.set_minimized(false);\n  723 |             return Some((surface, WorkspaceRestoreData::Fullscreen(previous)));\n  724 |         }\n  725 | \n  726 |         let mapped = self.element_for_surface(surface)?;\n  727 |         if let Some(stack) = mapped.stack_ref()\n  728 |             && stack.len() > 1\n  729 |         {\n  730 |             let idx = stack.surfaces().position(|s| &s == surface)?;\n  731 |             return Some((\n  732 |                 stack.remove_idx(idx)?,\n  733 |                 WorkspaceRestoreData::Stack(StackRestoreData {\n  734 |                     stack: mapped.key(),\n  735 |                     idx,\n  736 |                 }),\n  737 |             ));\n  738 |         }\n  739 | \n  740 |         // we know mapped is no stack with more than one element now,\n  741 |         // so we can treat mapped as containing only our surface.\n  742 | \n  743 |         let mapped = mapped.clone();\n  744 |         let layer = self.unmap_element(&mapped)?;\n  745 |         Some((mapped.active_window(), layer))\n  746 |     }\n  747 | \n  748 |     pub fn fullscreen_geometry_for_surface(\n  749 |         &self,\n  750 |         surface: &CosmicSurface,\n  751 |     ) -> Rectangle<i32, Local> {\n  752 |         let bbox = surface.bbox().as_local();\n  753 | \n  754 |         let mut full_geo = Rectangle::from_size(self.output.geometry().size.as_local());\n  755 |         if bbox != full_geo {\n  756 |             if bbox.size.w < full_geo.size.w {\n  757 |                 full_geo.loc.x += (full_geo.size.w - bbox.size.w) / 2;\n  758 |                 full_geo.size.w = bbox.size.w;\n  759 |             }\n  760 |             if bbox.size.h < full_geo.size.h {\n  761 |                 full_geo.loc.y += (full_geo.size.h - bbox.size.h) / 2;\n  762 |                 full_geo.size.h = bbox.size.h;\n  763 |             }\n  764 |         }\n  765 | \n  766 |         full_geo\n  767 |     }\n  768 |     pub fn fullscreen_geometry_for(&self, fullscreen: &F
