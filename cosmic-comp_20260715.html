<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e2e8f0;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#64748b;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#cbd5e1;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#94a3b8}
.project-info .pi-row .pi-k{color:#64748b}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#94a3b8;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#475569;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e2e8f0;border-color:#475569}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#64748b;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#94a3b8;border-color:#475569}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#475569;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#64748b;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#94a3b8;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e2e8f0}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#475569}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#94a3b8;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e2e8f0}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#cbd5e1}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#475569;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#64748b}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#64748b}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#64748b;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#64748b;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e2e8f0}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#cbd5e1;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#475569;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e2e8f0;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

<script type="application/json" id="D">[{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"critical","difficulty":"easy","description":"`window_from_handle(toplevel).unwrap()` is called for every request in the `ZcosmicToplevelManagerV1` dispatch (`Activate`, `Close`, `SetFullscreen`, `UnsetFullscreen`, `SetMaximized`, `UnsetMaximized`, `SetMinimized`, `UnsetMinimized`, `SetSticky`, `UnsetSticky`, `SetRectangle`, `MoveToExtWorkspace`). `window_from_handle` returns `None` whenever the `ZcosmicToplevelHandleV1` was created via the fallback path in `toplevel_info.rs`'s `GetCosmicToplevel` handler for a `foreign_toplevel` that is not registered with `ToplevelInfoHandler` (see `ToplevelHandleStateInner::empty()` at toplevel_info.rs:215, which explicitly sets `window: None` and only logs an error - it does not refuse to create the handle). A client can trivially trigger this by calling `zcosmic_toplevel_info_v1.get_cosmic_toplevel` with an `ext_foreign_toplevel_handle_v1` the compositor never registered, then issuing any `zcosmic_toplevel_manager_v1` request on the resulting handle, crashing the entire compositor process for all connected clients.","fix":"Replace every `window_from_handle(toplevel).unwrap()` with a graceful path, e.g. `let Some(window) = window_from_handle(toplevel) else { return; };`, mirroring the `None` handling already used elsewhere in the file. Alternatively, refuse to create the `ZcosmicToplevelHandleV1` at all (post a protocol error) when the window can't be resolved in `toplevel_info.rs`.","locations":[{"ref":"src/wayland/protocols/toplevel_management.rs:187-267","code":"  187 |         match request {\n  188 |             zcosmic_toplevel_manager_v1::Request::Activate { toplevel, seat } => {\n  189 |                 let window = window_from_handle(toplevel).unwrap();\n  190 |                 state.activate(dh, &window, Seat::from_resource(&seat));\n  191 |             }\n  192 |             zcosmic_toplevel_manager_v1::Request::Close { toplevel } => {\n  193 |                 let window = window_from_handle(toplevel).unwrap();\n  194 |                 state.close(dh, &window);\n  195 |             }\n  196 |             zcosmic_toplevel_manager_v1::Request::SetFullscreen { toplevel, output } => {\n  197 |                 let window = window_from_handle(toplevel).unwrap();\n  198 |                 state.fullscreen(dh, &window, output.as_ref().and_then(Output::from_resource))\n  199 |             }\n  200 |             zcosmic_toplevel_manager_v1::Request::UnsetFullscreen { toplevel } => {\n  201 |                 let window = window_from_handle(toplevel).unwrap();\n  202 |                 state.unfullscreen(dh, &window);\n  203 |             }\n  204 |             zcosmic_toplevel_manager_v1::Request::SetMaximized { toplevel } => {\n  205 |                 let window = window_from_handle(toplevel).unwrap();\n  206 |                 state.maximize(dh, &window);\n  207 |             }\n  208 |             zcosmic_toplevel_manager_v1::Request::UnsetMaximized { toplevel } => {\n  209 |                 let window = window_from_handle(toplevel).unwrap();\n  210 |                 state.unmaximize(dh, &window);\n  211 |             }\n  212 |             zcosmic_toplevel_manager_v1::Request::SetMinimized { toplevel } => {\n  213 |                 let window = window_from_handle(toplevel).unwrap();\n  214 |                 state.minimize(dh, &window);\n  215 |             }\n  216 |             zcosmic_toplevel_manager_v1::Request::UnsetMinimized { toplevel } => {\n  217 |                 let window = window_from_handle(toplevel).unwrap();\n  218 |                 state.unminimize(dh, &window);\n  219 |             }\n  220 |             zcosmic_toplevel_manager_v1::Request::SetSticky { toplevel } => {\n  221 |                 let window = window_from_handle(toplevel).unwrap();\n  222 |                 state.set_sticky(dh, &window);\n  223 |             }\n  224 |             zcosmic_toplevel_manager_v1::Request::UnsetSticky { toplevel } => {\n  225 |                 let window = window_from_handle(toplevel).unwrap();\n  226 |                 state.unset_sticky(dh, &window);\n  227 |             }\n  228 |             zcosmic_toplevel_manager_v1::Request::SetRectangle {\n  229 |                 toplevel,\n  230 |                 surface,\n  231 |                 x,\n  232 |                 y,\n  233 |                 width,\n  234 |                 height,\n  235 |             } => {\n  236 |                 let window =\n  237 |                     window_from_handle::<<D as ToplevelInfoHandler>::Window>(toplevel).unwrap();\n  238 |                 if let Some(toplevel_state) = window.user_data().get::<ToplevelState>() {\n  239 |                     let mut toplevel_state = toplevel_state.lock().unwrap();\n  240 |                     toplevel_state\n  241 |                         .rectangles\n  242 |                         .retain(|(s, _)| s.id() != surface.id());\n  243 |                     if width != 0 || height != 0 {\n  244 |                         toplevel_state.rectangles.push((\n  245 |                             surface.downgrade(),\n  246 |                             Rectangle::new((x, y).into(), (width, height).into()),\n  247 |                         ));\n  248 |                     }\n  249 |                 }\n  250 |             }\n  251 |             zcosmic_toplevel_manager_v1::Request::MoveToWorkspace { .. } => {}\n  252 |             zcosmic_toplevel_manager_v1::Request::MoveToExtWorkspace {\n  253 |                 toplevel,\n  254 |                 workspace,\n  255 |                 output,\n  256 |             } => {\n  257 |                 let window = window_from_handle(toplevel).unwrap();\n  258 |                 if let Some(workspace_handle) =\n  259 |                     state.workspace_state().get_ext_workspace_handle(&workspace)\n  260 |                     && let Some(output) = Output::from_resource(&output)\n  261 |                 {\n  262 |                     state.move_to_workspace(dh, &window, workspace_handle, output);\n  263 |                 }\n  264 |             }\n  265 |             _ => unreachable!(),\n  266 |         }\n  267 |     }","lines":81,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/wayland/protocols/toplevel_management.rs#L187-L267"},{"ref":"src/wayland/protocols/toplevel_info.rs:206-220","code":"  206 |                     window\n  207 |                         .user_data()\n  208 |                         .get::<ToplevelState>()\n  209 |                         .unwrap()\n  210 |                         .lock()\n  211 |                         .unwrap()\n  212 |                         .instances\n  213 |                         .push((obj.downgrade(), instance));\n  214 |                 } else {\n  215 |                     let _ = data_init.init(cosmic_toplevel, ToplevelHandleStateInner::empty());\n  216 |                     error!(\n  217 |                         ?foreign_toplevel,\n  218 |                         \"Toplevel for foreign-toplevel-list not registered for cosmic-toplevel-info.\"\n  219 |                     );\n  220 |                 }","lines":15,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/wayland/protocols/toplevel_info.rs#L206-L220"}]},{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"critical","difficulty":"easy","description":"`Common::xwayland_reset_eavesdropping` unconditionally calls `self.xwayland_state.as_mut().unwrap()`, with no check that Xwayland is actually running. It is invoked from `config/mod.rs` whenever the `xwayland_eavesdropping` cosmic-config key changes, with no guard on `xwayland_state` being `Some`. `xwayland_state` is `None` for the entire process lifetime when cosmic-comp is started with `--no-xwayland` (see `src/lib.rs:128-131`), and is also `None` during the startup window before `XWaylandEvent::Ready` fires, or after `XWayland::spawn`/`insert_source` fails. In any of those states, simply toggling the eavesdropping keyboard/pointer setting (e.g. via cosmic-settings) crashes the whole compositor with an unwrap panic.","fix":"Make `xwayland_reset_eavesdropping` a no-op when Xwayland isn't running: `let Some(xstate) = self.xwayland_state.as_mut() else { return; };` instead of `.unwrap()`.","locations":[{"ref":"src/xwayland.rs:372-389","code":"  372 |     pub fn xwayland_reset_eavesdropping(&mut self, serial: Serial) {\n  373 |         let seat = self.shell.read().seats.last_active().clone();\n  374 |         let keyboard = seat.get_keyboard().unwrap();\n  375 |         let pointer = seat.get_pointer().unwrap();\n  376 | \n  377 |         let xstate = self.xwayland_state.as_mut().unwrap();\n  378 |         xstate.last_modifier_state.take();\n  379 |         for key in xstate.pressed_keys.drain(..).rev() {\n  380 |             for wl_keyboard in keyboard.client_keyboards(&xstate.client) {\n  381 |                 wl_keyboard.key(serial.into(), 0, key.raw() - 8, KeyState::Released.into());\n  382 |             }\n  383 |         }\n  384 |         for button in xstate.pressed_buttons.drain(..).rev() {\n  385 |             for wl_pointer in pointer.client_pointers(&xstate.client) {\n  386 |                 wl_pointer.button(serial.into(), 0, button, ButtonState::Released.into());\n  387 |             }\n  388 |         }\n  389 |     }","lines":18,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/xwayland.rs#L372-L389"},{"ref":"src/config/mod.rs:900-908","code":"  900 |             \"xwayland_eavesdropping\" => {\n  901 |                 let new = get_config::<XwaylandEavesdropping>(&config, \"xwayland_eavesdropping\");\n  902 |                 if new != state.common.config.cosmic_conf.xwayland_eavesdropping {\n  903 |                     state.common.config.cosmic_conf.xwayland_eavesdropping = new;\n  904 |                     state\n  905 |                         .common\n  906 |                         .xwayland_reset_eavesdropping(SERIAL_COUNTER.next_serial());\n  907 |                 }\n  908 |             }","lines":9,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/config/mod.rs#L900-L908"}]},{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"high","difficulty":"very_easy","description":"`load_outputs` checks `path.exists()` and then opens the file with `OpenOptions::new().read(true).open(path).unwrap()`. This is a TOCTOU race (file can be removed/replaced between the check and the open) and also panics on any other open failure (permission error, path becomes a directory, etc.), crashing the compositor at startup while loading the persisted output configuration, even though the very next step (`ron::de::from_reader`) already has a full graceful-degradation path (log + delete + reset to default) for parse failures.","fix":"Handle the `open()` `Result` the same way parse errors are handled: on `Err`, warn and fall back to the default `OutputsConfig` instead of unwrapping.","locations":[{"ref":"cosmic-comp-config/src/output/comp.rs:81-84","code":"   81 |         if path.exists() {\n   82 |             match ron::de::from_reader::<_, OutputsConfig>(\n   83 |                 OpenOptions::new().read(true).open(path).unwrap(),\n   84 |             ) {","lines":4,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/cosmic-comp-config/src/output/comp.rs#L81-L84"}]},{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"When re-negotiating the DRM mode for an already-active surface, the closest-refresh-rate search does `(output_config.0.mode.1.unwrap() as i32 - refresh_rate as i32).abs()`, unconditionally unwrapping the optional stored refresh rate (`OutputConfig::mode: ((i32,i32), Option<u32>)`). `OutputConfig::default()` sets this field to `((0,0), None)`, and the very same struct (`CompOutputConfig`) already exposes a panic-safe accessor `mode_refresh()` (`src/config/mod.rs:94-96`) that does `self.0.mode.1.unwrap_or(60_000)` for exactly this reason. Any output config that reaches this code path with `mode.1 == None` (e.g. a manually edited/older `outputs.ron`, or a config produced by a code path that leaves refresh unset) crashes the whole compositor instead of using the existing safe fallback.","fix":"Use the existing safe accessor instead of unwrapping the raw field, e.g. `(output_config.mode_refresh() as i32 - refresh_rate as i32).abs()`.","locations":[{"ref":"src/backend/kms/mod.rs:928-931","code":"  928 |                     .min_by_key(|mode| {\n  929 |                         let refresh_rate = drm_helpers::calculate_refresh_rate(**mode);\n  930 |                         (output_config.0.mode.1.unwrap() as i32 - refresh_rate as i32).abs()\n  931 |                     })","lines":4,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/backend/kms/mod.rs#L928-L931"}]},{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`draw_cursor` computes `let actual_scale = (frame.size / state.size()).max(1);` where `state.size()` is `CursorStateInner::cursor_size`, a `u32` loaded straight from the `XCURSOR_SIZE` environment variable via `load_cursor_env()` (`.and_then(|s| s.parse().ok()).unwrap_or(24)`). If a user (or session manager) sets `XCURSOR_SIZE=0`, `cursor_size` becomes `0` and this integer division panics with 'attempt to divide by zero', crashing the compositor as soon as a named cursor is drawn. The `.max(1)` guard is applied only to the *result* of the division, too late to prevent the panic.","fix":"Clamp the parsed cursor size to at least 1 in `load_cursor_env` (e.g. `.map(|v: u32| v.max(1))`), or guard the division in `draw_cursor` with `state.size().max(1)`.","locations":[{"ref":"src/ba mpositor.","locations":[{"ref":"src/shell/element/window.rs:83-93","code":"   83 | #[derive(Debug)]\n   84 | pub struct CosmicWindowInternal {\n   85 |     pub(super) window: CosmicSurface,\n   86 |     activated: AtomicBool,\n   87 |     /// TODO: This needs to be per seat\n   88 |     pointer_entered: AtomicU8,\n   89 |     last_title: Mutex<String>,\n   90 |     tiled: AtomicBool,\n   91 |     theme: Mutex<cosmic::Theme>,\n   92 |     appearance_conf: Mutex<AppearanceConfig>,\n   93 | }","lines":11,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/shell/element/window.rs#L83-L93"},{"ref":"src/shell/element/window.rs:1006-1030","code":" 1006 |     fn enter(&self, seat: &Seat<State>, data: &mut State, event: &MotionEvent) {\n 1007 |         let mut event = event.clone();\n 1008 |         self.0.with_program(|p| {\n 1009 |             let has_ssd = p.has_ssd(false);\n 1010 |             if has_ssd || p.has_tiled_state() {\n 1011 |                 let Some(next) = Focus::under(\n 1012 |                     &p.window,\n 1013 |                     if has_ssd { SSD_HEIGHT } else { 0 },\n 1014 |                     event.location,\n 1015 |                 ) else {\n 1016 |                     return;\n 1017 |                 };\n 1018 | \n 1019 |                 let old_focus = p.swap_focus(Some(next));\n 1020 |                 assert_eq!(old_focus, None);\n 1021 | \n 1022 |                 let cursor_state = seat.user_data().get::<CursorState>().unwrap();\n 1023 |                 cursor_state.lock().unwrap().set_shape(next.cursor_shape());\n 1024 |                 seat.set_cursor_image_status(CursorImageStatus::default_named());\n 1025 |             }\n 1026 |         });\n 1027 | \n 1028 |         event.location -= self.0.with_program(|p| p.window.geometry().loc.to_f64());\n 1029 |         PointerTarget::enter(&self.0, seat, data, &event)\n 1030 |     }","lines":25,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/shell/element/window.rs#L1006-L1030"}]},{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`raise_with_children` recurses over floating-layer elements whose `xdg_toplevel` parent points at\n`focused`, and recurses into each child with no visited-set / cycle guard. `xdg_toplevel.parent`\nis entirely client-controlled (via `set_parent`), and a client can set toplevel A's parent to its\nown toplevel B and B's parent back to A, since both toplevels belong to the same client\nconnection so both `set_parent` requests are valid protocol calls. Once such a 2-cycle (or longer)\nexists between mapped windows, calling `raise_with_children` (invoked from `Shell::update_active`\non every focus change) recurses forever between A and B, causing unbounded stack growth and a\nstack overflow that aborts the whole compositor process - a remotely triggerable DoS from a single\nmisbehaving client.","fix":"Track visited elements while walking the parent chain, e.g. pass a `HashSet<CosmicMapped>` (or\ncompare surface ids) down the recursion and skip/stop when an element has already been visited, or\nrewrite the traversal iteratively with an explicit worklist and a visited set.","locations":[{"ref":"src/shell/focus/mod.rs:432-461","code":"  432 | fn raise_with_children(floating_layer: &mut FloatingLayout, focused: &CosmicMapped) {\n  433 |     if floating_layer.mapped().any(|m| m == focused) {\n  434 |         floating_layer.space.raise_element(focused, true);\n  435 |         for element in floating_layer\n  436 |             .space\n  437 |             .elements()\n  438 |             .filter(|elem| elem != &focused)\n  439 |             .filter(|elem| {\n  440 |                 let parent = elem\n  441 |                     .active_window()\n  442 |                     .0\n  443 |                     .toplevel()\n  444 |                     .and_then(|toplevel| toplevel.parent());\n  445 |                 parent.is_some_and(|parent| {\n  446 |                     focused\n  447 |                         .active_window()\n  448 |                         .wl_surface()\n  449 |                         .map(Cow::into_owned)\n  450 |                         .map(|focused| parent == focused)\n  451 |                         .unwrap_or(false)\n  452 |                 })\n  453 |             })\n  454 |             .cloned()\n  455 |             .collect::<Vec<_>>()\n  456 |             .into_iter()\n  457 |         {\n  458 |             raise_with_children(floating_layer, &element);\n  459 |         }\n  460 |     }\n  461 | }","lines":30,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/shell/focus/mod.rs#L432-L461"}]},{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"MoveGrab's Drop impl schedules an idle closure that dereferences the drag's `output`/`cursor_output` with several `.unwrap()` calls (`shell.active_space(&output).unwrap()`, `shell.workspaces.sets.get_mut(&output).unwrap()`, `shell.active_space_mut(&output).unwrap()`, `shell.workspaces.active_mut(&cursor_output).unwrap()`). `Shell::remove_output`/`WorkspaceSets::remove_output` (src/shell/mod.rs and src/shell/workspace.rs) shift-remove the output's entire `set` from `self.sets` on monitor unplug and do not cancel in-flight pointer/touch grabs. If a monitor is disconnected while a window is being dragged (grab still active, referencing that output), the idle closure runs after the output is already gone from `shell.workspaces.sets`, so every one of these `.unwrap()` calls panics and crashes the whole compositor.","fix":"Before unwrapping, verify the output is still present, e.g. `let Some(workspace) = shell.active_space(&output) else { /* fall back to another output or drop the window without crashing */ };` for each lookup, mirroring the defensive `self.output.upgrade()` pattern already used in `Re ale output/idx can't crash the compositor.","locations":[{"ref":"src/shell/mod.rs:4556-4586","code":" 4556 |     pub fn resize(&mut self, seat: &Seat<State>, direction: ResizeDirection, edge: ResizeEdge) {\n 4557 |         let Some(output) = seat.focused_output() else {\n 4558 |             return;\n 4559 |         };\n 4560 |         let (_, idx) = self.workspaces.active_num(&output);\n 4561 |         let Some(focused) = seat.get_keyboard().unwrap().current_focus() else {\n 4562 |             return;\n 4563 |         };\n 4564 |         let amount = (self\n 4565 |             .resize_state\n 4566 |             .take()\n 4567 |             .map(|(_, _, _, amount, _, _)| amount)\n 4568 |             .unwrap_or(10)\n 4569 |             + 2)\n 4570 |         .min(20);\n 4571 | \n 4572 |         if self\n 4573 |             .workspaces\n 4574 |             .sets\n 4575 |             .get_mut(&output)\n 4576 |             .unwrap()\n 4577 |             .sticky_layer\n 4578 |             .resize(&focused, direction, edge, amount)\n 4579 |         {\n 4580 |             self.resize_state = Some((focused, direction, edge, amount, idx, output));\n 4581 |         } else if let Some(workspace) = self.workspaces.get_mut(idx, &output)\n 4582 |             && workspace.resize(&focused, direction, edge, amount)\n 4583 |         {\n 4584 |             self.resize_state = Some((focused, direction, edge, amount, idx, output));\n 4585 |         }\n 4586 |     }","lines":31,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/shell/mod.rs#L4556-L4586"},{"ref":"src/shell/mod.rs:4588-4624","code":" 4588 |     pub fn finish_resize(&mut self, direction: ResizeDirection, edge: ResizeEdge) {\n 4589 |         if let Some((old_focused, old_direction, old_edge, _, idx, output)) =\n 4590 |             self.resize_state.take()\n 4591 |             && old_direction == direction\n 4592 |             && old_edge == edge\n 4593 |         {\n 4594 |             let Some(toplevel) = old_focused.toplevel() else {\n 4595 |                 return;\n 4596 |             };\n 4597 |             let Some(mapped) = self\n 4598 |                 .workspaces\n 4599 |                 .sets\n 4600 |                 .values()\n 4601 |                 .find_map(|set| {\n 4602 |                     set.sticky_layer\n 4603 |                         .mapped()\n 4604 |                         .find(|m| m.has_surface(&toplevel, WindowSurfaceType::TOPLEVEL))\n 4605 |                 })\n 4606 |                 .cloned()\n 4607 |                 .or_else(|| {\n 4608 |                     let workspace = self.workspaces.get(idx, &output).unwrap();\n 4609 |                     workspace\n 4610 |                         .mapped()\n 4611 |                         .find(|m| m.has_surface(&toplevel, WindowSurfaceType::TOPLEVEL))\n 4612 |                         .cloned()\n 4613 |                 })\n 4614 |             else {\n 4615 |                 return;\n 4616 |             };\n 4617 | \n 4618 |             let mut resize_state = mapped.resize_state.lock().unwrap();\n 4619 |             if let Some(ResizeState::Resizing(data)) = *resize_state {\n 4620 |                 mapped.set_resizing(false);\n 4621 |                 *resize_state = Some(ResizeState::WaitingForCommit(data));\n 4622 |             }\n 4623 |         }\n 4624 |     }","lines":37,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/shell/mod.rs#L4588-L4624"},{"ref":"src/shell/mod.rs:4608","code":" 4608 |                     let workspace = self.workspaces.get(idx, &output).unwrap();","lines":1,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/shell/mod.rs#L4608"}]},{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"While normalizing invalid `Mirroring` tags, the code looks up the mirror target's index `j` within the `Vec<OutputInfo>` key (`info`) and then indexes `config_clone[j]`, where `config_clone` is a clone of the corresponding `Vec<OutputConfig>` value. This assumes `info.len() == config.len()` for every entry in the `HashMap<Vec<OutputInfo>, Vec<OutputConfig>>`. That invariant is not checked anywhere on load; a hand-edited or corrupted `outputs.ron` with a shorter `Vec<OutputConfig>` than `Vec<OutputInfo>` (or a `j` beyond the config vector's length) causes an out-of-bounds panic while merely trying to sanitize the config.","fix":"Use `config_clone.get(j)` instead of `config_clone[j]` and treat a missing entry the same as the \"not found\" branch (reset to `Enabled`).","locations":[{"ref":"cosmic-comp-config/src/output/comp.rs:86-109","code":"   86 |                     for (info, config) in config.config.iter_mut() {\n   87 |                         let config_clone = config.clone();\n   88 |                         for conf in config.iter_mut() {\n   89 |                             if let OutputState::Mirroring(conn) = &conf.enabled {\n   90 |                                 if let Some((j, _)) = info\n   91 |                                     .iter()\n   92 |                                     .enumerate()\n   93 |                                     .find(|(_, info)| &info.connector == conn)\n   94 |                                 {\n   95 |                                     if config_clone[j].enabled != OutputState::Enabled {\n   96 |                                         warn!(\n   97 |                                             \"Invalid Mirroring tag, overriding with `Enabled` instead\"\n   98 |                                         );\n   99 |                                         conf.enabled = OutputState::Enabled;\n  100 |                                     }\n  101 |                                 } else {\n  102 |                                     warn!(\n  103 |                                         \"Invalid Mirroring tag, overriding with `Enabled` difficulty":"hard","description":"`process_x11_event` handles `PointerMotionAbsolute` by looking up the surface's output with `.find(...).map(...).unwrap()`. If the window has already been removed from `self.backend.x11().surfaces` (e.g. an `X11Event::CloseRequested` was processed for that window just before a stray/in-flight motion event for the same window arrives), `find` returns `None` and the `unwrap()` panics, crashing the compositor.","fix":"Use `if let Some(output) = ... .find(...).map(...) { ... }` and simply skip setting the active output when the window is no longer tracked, instead of unwrapping.","locations":[{"ref":"src/backend/x11.rs:518-541","code":"  518 | impl State {\n  519 |     pub fn process_x11_event(&mut self, event: InputEvent<X11Input>) {\n  520 |         // here we can handle special cases for x11 inputs, like mapping them to windows\n  521 |         if let InputEvent::PointerMotionAbsolute { event } = &event\n  522 |             && let Some(window) = event.window()\n  523 |         {\n  524 |             let output = self\n  525 |                 .backend\n  526 |                 .x11()\n  527 |                 .surfaces\n  528 |                 .iter()\n  529 |                 .find(|surface| &surface.window == window.as_ref())\n  530 |                 .map(|surface| surface.output.clone())\n  531 |                 .unwrap();\n  532 | \n  533 |             let device = event.device();\n  534 |             for seat in self.common.shell.read().seats.iter() {\n  535 |                 let devices = seat.user_data().get::<Devices>().unwrap();\n  536 |                 if devices.has_device(&device) {\n  537 |                     seat.set_active_output(&output);\n  538 |                     break;\n  539 |                 }\n  540 |             }\n  541 |         };","lines":24,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/backend/x11.rs#L518-L541"}]},{"id":"PANIC_15","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`notify_ready` determines the kiosk-mode child command using `std::env::args().skip(1)` (line 84). `env::args()` panics during iteration if any process argument is not valid UTF-8. The rest of the CLI parsing in `run()` deliberately uses `RawArgs`/`OsString`-based parsing via `clap_lex` (line 116-122) to avoid exactly this problem. Since the kiosk exec path/arguments are taken directly from argv without going through the OsStr-safe parser, a non-UTF-8 argument (e.g. a kiosk command path with non-UTF-8 bytes, which Linux argv permits) will crash the whole compositor at startup via a panic, tearing down the entire desktop session.","fix":"Use `std::env::args_os()` instead of `env::args()` for determining `exec`/kiosk args, matching the OsStr-safe handling already used for the rest of argv parsing (`process::Command` accepts `OsStr` directly, no UTF-8 conversion is required).","locations":[{"ref":"src/lib.rs:84","code":"   84 |             let mut args = env::args().skip(1);","lines":1,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/lib.rs#L84"}]},{"id":"PANIC_16","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"In `CosmicStack::handle_focus`, `previous_index` (`prev_idx`) is only populated when `seat.last_modifier_change()` returns `Some`, and starts out as `None`. The `FocusDirection::Up | FocusDirection::Down` arm unconditionally calls `prev_idx.unwrap().1`, and the `Left`/`Right` arms fall back to the same `prev_idx.unwrap().1` whenever `fetch_update` fails (i.e. focus is already at the first/last tab). If a focus-direction shortcut is triggered before any modifier key transition has ever been recorded for that seat (e.g. a keybinding without a modifier, or the very first such shortcut in a session under unusual timing), `prev_idx` is still `None` and this `unwrap()` panics, crashing the compositor.","fix":"Replace the `prev_idx.unwrap().1` calls with a fallback (e.g. keep the current `active` index, or fall back to `0`) when `prev_idx` is `None`, instead of unwrapping unconditionally.","locations":[{"ref":"src/shell/element/stack.rs:300-410","code":"  300 |     pub fn handle_focus(\n  301 |         &self,\n  302 |         seat: &Seat<State>,\n  303 |         direction: FocusDirection,\n  304 |         swap: Option<NodeDesc>,\n  305 |     ) -> bool {\n  306 |         let (result, update) = self.0.with_program(|p| {\n  307 |             let last_mod_serial = seat.last_modifier_change();\n  308 |             let mut prev_idx = p.previous_index.lock().unwrap();\n  309 |             if !prev_idx.is_some_and(|(serial, _)| Some(serial) == last_mod_serial) {\n  310 |                 *prev_idx = last_mod_serial.map(|s| (s, p.active.load(Ordering::SeqCst)));\n  311 |             }\n  312 | \n  313 |             match direction {\n  314 |                 FocusDirection::Left => {\n  315 |                     if !p.group_focused.load(Ordering::SeqCst) {\n  316 |                         if let Ok(old) =\n  317 |                             p.active\n  318 |                                 .fetch_update(Ordering::SeqCst, Ordering::SeqCst, |val| {\n  319 |                                     val.checked_sub(1)\n  320 |                                 })\n  321 |                         {\n  322 |                             p.previous_keyboard.store(old, Ordering::SeqCst);\n  323 |                             p.scroll_to_focus.store(true, Ordering::SeqCst);\n  324 |                             (true, true)\n  325 |                         } else {\n  326 |                             let new = prev_idx.unwrap().1;\n  327 |                             let old = p.active.swap(new, Ordering::SeqCst);\n  328 |                             if old != new {\n  329 |                                 p.previous_keyboard.store(old, Ordering::SeqCst);\n  330 |                                 p.scrol  f64 * scale).round() as i32;\n  204 |     let buffer_size = Size::<i32, BufferCoords>::from((pixel_size, pixel_size));\n  205 |     let output_size = buffer_size.to_logical(1, Transform::Normal).to_physical(1);\n  206 | \n  207 |     let image_buffer = MemoryRenderBuffer::from_slice(\n  208 |         &image.pixels_rgba,\n  209 |         Fourcc::Abgr8888,\n  210 |         (image.width as i32, image.height as i32),\n  211 |         image_scale as i32,\n  212 |         Transform::Normal,","lines":17,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/xwayland.rs#L196-L212"}]},{"id":"PANIC_19","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`Timings::new` uses `assert_eq!(interval.as_secs(), 0)` and `NonZeroU64::new(interval.subsec_nanos().into()).unwrap()` for both `refresh_interval` and `min_interval` when they are `Some(..)`. Any interval of one second or more panics the assert, and any interval whose `subsec_nanos()` is exactly `0` (e.g. `Duration::ZERO`, or a whole-second interval) panics the `unwrap`. The only current call site passes `Timings::new(None, None, false, target_node)`, so this is currently dead/unreachable, but it is a public-ish constructor with no graceful handling, unlike `set_refresh_interval`/`set_min_refresh_interval` right below it, which use `.and_then(NonZeroU64::new)` and degrade to `None` instead of panicking.","fix":"Make `Timings::new` degrade the same way `set_refresh_interval`/`set_min_refresh_interval` do (`.and_then(NonZeroU64::new)`) instead of asserting/unwrapping, so passing an out-of-range interval can't crash the surface thread.","locations":[{"ref":"src/backend/kms/surface/timings.rs:56-74","code":"   56 |     pub fn new(\n   57 |         refresh_interval: Option<Duration>,\n   58 |         min_interval: Option<Duration>,\n   59 |         vrr: bool,\n   60 |         node: DrmNode,\n   61 |     ) -> Self {\n   62 |         let refresh_interval_   warn!(?err, \"Failed to read numlock.ron, resetting..\");\n  364 |                     if let Err(err) = std::fs::remove_file(path) {\n  365 |                         error!(?err, \"Failed to remove numlock.ron.\");\n  366 |                     }\n  367 |                 })\n  368 |                 .ok()\n  369 |             })\n  370 |             .unwrap_or_default()\n  371 |     }","lines":17,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/config/mod.rs#L355-L371"},{"ref":"src/config/mod.rs:373-394","code":"  373 |     fn load_filter_state(path: &Option<PathBuf>) -> ScreenFilter {\n  374 |         if let Some(path) = path.as_ref()\n  375 |             && path.exists()\n  376 |         {\n  377 |             match ron::de::from_reader::<_, ScreenFilter>(\n  378 |                 OpenOptions::new().read(true).open(path).unwrap(),\n  379 |             ) {\n  380 |                 Ok(config) => return config,\n  381 |                 Err(err) => {\n  382 |                     warn!(?err, \"Failed to read screen_filter state, resetting..\");\n  383 |                     if let Err(err) = std::fs::remove_file(path) {\n  384 |                         error!(?err, \"Failed to remove screen_filter state.\");\n  385 |                     }\n  386 |                 }\n  387 |             };\n  388 |         }\n  389 | \n  390 |         ScreenFilter {\n  391 |             inverted: false,\n  392 |             color_filter: None,\n  393 |         }\n  394 |     }","lines":22,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/config/mod.rs#L373-L394"}]},{"id":"PANIC_21","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In the `InputEvent::PointerMotion` handler, `position.x`/`position.y` are clamped to `[output_geometry.loc, output_geometry.loc + output_geometry.size - 1]` using `f64::clamp`, which panics if `min > max`. If an output's `geometry().size` ever has a zero (or negative) width/height component - e.g. during output reconfiguration/hotplug races before a valid mode is applied - `loc + size - 1 < loc`, and this call panics, crashing the compositor from a pointer-motion event.","fix":"Guard against degenerate output geometry before clamping (e.g. skip clamping, or use `size.w.max(1)`/`size.h.max(1)` when computing the upper bound), or use a saturating/clamp-safe helper that tolerates `min >= max`.","locations":[{"ref":"src/input/mod.rs:385-392","code":"  385 |                     position.x = position.x.clamp(\n  386 |                         output_geometry.loc.x as f64,\n  387 |                         (output_geometry.loc.x + output_geometry.size.w - 1) as f64,\n  388 |                     );\n  389 |                     position.y = position.y.clamp(\n  390 |                         output_geometry.loc.y as f64,\n  391 |                         (output_geometry.loc.y + output_geometry.size.h - 1) as f64,\n  392 |                     );","lines":8,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/input/mod.rs#L385-L392"}]},{"id":"PANIC_22","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`DeviceIdentifier::matches` reads vendor/device IDs from sysfs (`/sys/dev/char/{major}:{minor}/device/vendor` and `.../device`) and slices the result with `ven[2..]` / `dev[2..]` to strip an assumed `0x` prefix, without checking the string length first. Unlike `try_parse_dev_from_str` (which checks `val.starts_with(\"0x\")` before doing the equivalent slice on user-supplied env var text), this code path has no such guard on the file contents. If the sysfs file is empty, shorter than 2 bytes, or doesn't start with `0x` for any reason, `ven[2..]` panics with a byte-index-out-of-bounds error, crashing the compositor instead of just failing the match.","fix":"Check the string length/prefix before slicing, e.g. `ven.strip_prefix(\ N) {\n  263 |         refresh /= 2;\n  264 |     }\n  265 |     if mode.vscan() > 1 {\n  266 |         refresh /= mode.vscan() as u64;\n  267 |     }\n  268 | \n  269 |     refresh as u32\n  270 | }","lines":18,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/backend/kms/drm_helpers.rs#L253-L270"},{"ref":"src/backend/kms/surface/mod.rs:703-705","code":"  703 |         let interval =\n  704 |             Duration::from_secs_f64(1_000. / drm_helpers::calculate_refresh_rate(mode) as f64);\n  705 |         self.timings.set_refresh_interval(Some(interval));","lines":3,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/backend/kms/surface/mod.rs#L703-L705"}]},{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"When computing the rescale for an animating fullscreen surface, the scale factor is derived by dividing by the surface's own geometry size: `target_geo.size.w as f64 / fullscreen_geo.size.w as f64` (and `.h`). `fullscreen_geo` comes directly from `fullscreen.surface.0.geometry()`, which can legitimately be `0x0` for a surface that has just been made fullscreen but has not yet committed a buffer/geometry matching the request (or a client that briefly reports a zero-sized geometry). In that case the division yields `NaN` or `Infinity`, which is then fed into `RescaleRenderElement::from_element`, producing an undefined/broken render transform for that frame.","fix":"Guard against a zero-sized `fullscreen_geo` before dividing, e.g. skip the rescale (fall back to `Scale { x: 1.0, y: 1.0 }` or skip animation for that frame) when `fullscreen_geo.size.w == 0 || fullscreen_geo.size.h == 0`.","locations":[{"ref":"src/shell/workspace.rs:1689-1693","code":" 1689 |                 let fullscreen_geo = fullscreen.surface.0.geometry();\n 1690 |                 let scale = Scale {\n 1691 |                     x: target_geo.size.w as f64 / fullscreen_geo.size.w as f64,\n 1692 |                     y: target_geo.size.h as f64 / fullscreen_geo.size.h as f64,\n 1693 |                 };","lines":5,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/shell/workspace.rs#L1689-L1693"}]},{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`position.x.abs()` / `position.y.abs()` are called on an `i32` that comes directly from a client's `set_position` request on the wlr-output-management / cosmic output-configuration protocol (see `src/wayland/protocols/output_configuration/handlers/wlr.rs:427`, `pending.position = Some(Point::from((x, y)))` with no range validation). If a client sends `i32::MIN` for either coordinate, `i32::MIN.abs()` overflows: in a debug build (default `overflow-checks = true`) this panics and takes down the whole compositor for all clients; in a release build it silently wraps back to `i32::MIN`, so `offset.0.max(position.x.abs())` fails to compute a positive correction, and the later `current_config.position = (position.x as u32, position.y as u32)` cast turns the still-negative value into a huge, essentially garbage `u32` output position instead of the intended sanitized non-negative value.","fix":"Use `position.x.unsigned_abs()` / `saturating_abs()` (or clamp with `position.x.checked_abs().unwrap_or(i32::MAX)`) instead of the panicking `.abs()`, e.g.:\n```rust\nif position.x.is_negative() {\n    offset.0 = offset.0.max(position.x.unsigned_abs() as i32);\n}\n```\nAlso consider validating/clamping `position` at the point it's parsed from the protocol request in `wlr.rs`/`cosmic.rs` before it ever reaches this handler.","locations":[{"ref":"src/wayland/handlers/output_configuration.rs:63-67","code":"   63 |                     if position.x.is_negative() {\n   64 |                         offset.0 = offset.0.max(position.x.abs());\n   65 |                     }\n   66 |                     if position.y.is_negative() {\n   67 |                         offset.1 = offset.1.max(position.y.abs());","lines":5,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/wayland/handlers/output_configuration.rs#L63-L67"},{"ref":"src/wayland/handlers/output_configuration.rs:137-139","code":"  137 |                     if let Some(position) = position {\n  138 |                         current_config.position = (position.x as u32, position.y as u32);\n  139 |                     }","lines":3,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/wayland/handlers/output_configuration.rs#L137-L139"}]},{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`Data::add_window` computes the new child's size as `new_size = last_length - used_size` where\n`used_size` is the sum of the *rounded* rescaled sibling sizes. Because each sibling size is\nindependently rounded to the nearest integer, `used_size` can overshoot `remainder` by up to\n~0.5px per sibling; with enough siblings in a group this can push `used_size` above `last_length`,\nmaking `new_size` negative, i.e. a newly inserted window gets a negative tile size inserted into\n`sizes`. `Data::remove_window` (same file, lines 255-282) and `Data::update_geometry`\n(lines 292-326) have the complementary issue: they divide by `remaining_size`/`previous_length`\nwithout checking for zero, so a group whose accumulated size has degenerated to 0 (e.g. after\nrepeated resizes/removals driving a sibling to a 0-length tile) produces `0.0/0.0 = NaN`, which\nRust's `as i32` cast silently truncates to `0` rather than panicking - masking the invalid state\ninstead of surfacing it, and leaving the tile permanently zero-sized.","fix":"Clamp `new_size` in `add_window` to a sane minimum (e.g. `.max(1)`) and compensate by shrinking the\nlargest existing sibling instead of the rounding remainder; guard the divisions in `remove_window`/\n`update_geometry` against `remaining_size == 0` / `previous_length == 0` by falling back to an even\nsplit instead of dividing.","locations":[{"ref":"src/shell/layout/tiling/mod.rs:219-244","code":"  219 |     fn add_window(&mut self, idx: usize) {\n  220 |         match self {\n  221 |             Data::Group {\n  222 |                 sizes,\n  223 |                 last_geometry,\n  224 |                 orientation,\n  225 |                 ..\n  226 |             } => {\n  227 |                 let last_length = match orientation {\n  228 |                     Orientation::Horizontal => last_geometry.size.h,\n  229 |                     Orientation::Vertical => last_geometry.size.w,\n  230 |                 };\n  231 |                 let equal_sizing = last_length / (sizes.len() as i32 + 1); // new window size\n  232 |                 let remainder = last_length - equal_sizing; // size for the rest of the windowns\n  233 | \n  234 |                 for size in sizes.iter_mut() {\n  235 |                     *size = ((*size as f64 / last_length as f64) * remainder as f64).round() as i32;\n  236 |                 }\n  237 |                 let used_size: i32 = sizes.iter().sum();\n  238 |                 let new_size = last_length - used_size;\n  239 | \n  240 |                 sizes.insert(idx, new_size);\n  241 |             }\n  242 |             _ => panic!(\"Adding window to leaf?\"),\n  243 |         }\n  244 |     }","lines":26,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/shell/layout/tiling/mod.rs#L219-L244"},{"ref":"src/shell/layout/tiling/mod.rs:255-282","code":"  255 |     fn remove_window(&mut self, idx: usize) {\n  256 |         match self {\n  257 |             Data::Group {\n  258 |                 sizes,\n  259 |                 last_geometry,\n  260 |                 orientation,\n  261 |                 ..\n  262 |             } => {\n  263 |                 let last_length = match orientation {\n  264 |                     Orientation::Horizontal => last_geometry.size.h,\n  265 |                     Orientation::Vertical => last_geometry.size.w,\n  266 |                 };\n  267 |                 let old_size = sizes.remove(idx);\n  268 |                 let remaining_size: i32 = sizes.iter().sum();\n  269 | \n  270 |                 for size in sizes.iter_mut() {\n  271 |                     *size +=\n  272 |                         ((*size as f64 / remaining_size as f64) * old_size as f64).round() as i32;\n  273 |                 }\n  274 |                 let used_size: i32 = sizes.iter().sum();\n  275 |                 let overflow = last_length - used_size;\n  276 |                 if overflow != 0 {\n  277 |                     *sizes.last_mut().unwrap() += overflow;\n  278 |                 }\n  279 |             }\n  280 |             _ => panic!(\"Added window to leaf?\"),\n  281 |         }\n  282 |     }","lines":28,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/shell/layout/tiling/mod.rs#L255-L282"},{"ref":"src/shell/layout/tiling/mod.rs:292-326","code":"  292 |     fn update_geometry(&mut self, geo: Rectangle<i32, Local>) {\n  293 |         match self {\n  294 |             Data::Group {\n  295 |                 orientation,\n  296 |                 sizes,\n  297 |                 last_geometry,\n  298 |                 ..\n  299 |             } => {\n  300 |                 let previous_length = match orientation {\n  301 |                     Orientation::Horizontal => last_geometry.size.h,\n  302 |                     Orientation::Vertical => last_geometry.size.w,\n  303 |                 };\n  304 |                 let new_length = match orientation {\n  305 |                     Orientation::Horizontal => geo.size.h,\n  306 |                     Orientation::Vertical => geo.size.w,\n  307 |                 };\n  308 | \n  309 |                 sizes.iter_mut().for_each(|len| {\n  310 |                     *len = (((*len as f64) / (previous_length as f64)) * (new_length as f64))\n  311 |                         .round() as i32;\n  312 |                 });\n  313 |                 let sum: i32 = sizes.iter().sum();\n  314 | \n  315 |                 // fix rounding issues\n  316 |                 if sum != new_length {\n  317 |                     let diff = new_length - sum;\n  318 |                     *sizes.last_mut().unwrap() += diff;\n  319 |                 }\n  320 |                 *last_geometry = geo;\n  321 |             }\n  322 |             Data::Mapped { last_geometry, .. } | Data::Placeholder { last_geometry, .. } => {\n  323 |                 *last_geometry = geo;\n  324 |             }\n  325 |         }\n  326 |     }","lines":35,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/shell/layout/tiling/mod.rs#L292-L326"}]},{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`WorkspaceSet::add_empty_workspace` and `WorkspaceSet::update_workspace_idxs` compute the 1-based workspace index as `self.workspaces.len() as u8 + 1` / `i as u8 + 1` and pass it to `workspace_set_idx`. If a workspace set ever reaches 255 workspaces, `255u8 + 1` overflows: this panics in debug builds (`attempt to add with overflow`) and silently wraps to `0` in release builds, producing a wrong/duplicate workspace coordinate/name sent over the `zcosmic_workspace_handle_v2` protocol. Dynamic-workspace mode can in principle grow the workspace count without an explicit user-facing limit, so this is a real (if unlikely-to-be-hit) truncation bug rather than a purely theoretical one.","fix":"Use `u32` (matching `set_workspace_coordinates`'s `&[idx as u32]`) instead of `u8` for the intermediate index computation, e.g. `self.workspaces.len() as u32 ed.","locations":[{"ref":"src/shell/grabs/delay.rs:56-79","code":"   56 |     fn motion(\n   57 |         &mut self,\n   58 |         data: &mut State,\n   59 |         handle: &mut PointerInnerHandle<'_, State>,\n   60 |         focus: Option<(<State as SeatHandler>::PointerFocus, Point<f64, Logical>)>,\n   61 |         event: &PointerMotionEvent,\n   62 |     ) {\n   63 |         handle.motion(data, focus, event);\n   64 | \n   65 |         let distance = self.start_data.distance(event.location);\n   66 |         if distance >= 1.\n   67 |             && let Some(factory) = self.grab_factory.take()\n   68 |         {\n   69 |             let serial = self.serial.unwrap_or(event.serial);\n   70 |             let seat = self.seat.clone();\n   71 |             data.common.event_loop_handle.insert_idle(move |data| {\n   72 |                 if let Some((grab, focus)) = factory(data) {\n   73 |                     seat.get_pointer()\n   74 |                         .unwrap()\n   75 |                         .set_grab(data, grab, serial, focus);\n   76 |                 }\n   77 |             });\n   78 |         }\n   79 |     }","lines":24,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/shell/grabs/delay.rs#L56-L79"},{"ref":"src/shell/grabs/delay.rs:91-101","code":"   91 |     fn button(\n   92 |         &mut self,\n   93 |         data: &mut State,\n   94 |         handle: &mut PointerInnerHandle<'_, State>,\n   95 |         event: &ButtonEvent,\n   96 |     ) {\n   97 |         handle.button(data, event);\n   98 |         if handle.current_pressed().is_empty() {\n   99 |             handle.unset_grab(self, data, event.serial, event.time, true);\n  100 |         }\n  101 |     }","lines":11,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/shell/grabs/delay.rs#L91-L101"},{"ref":"src/shell/grabs/delay.rs:195","code":"  195 |     fn unset(&mut self, _data: &mut State) {}","lin erity":"medium","difficulty":"easy","description":"In the GestureSwipeEnd handler, when an internal (3/4-finger) workspace-switch gesture is being tracked via `self.common.gesture_state`, the `event.cancelled()` flag from libinput is never inspected. The non-internal path (the `else` branch a few lines below) correctly forwards `cancelled: event.cancelled()` to the client, but the internal workspace-switch path always calls `end_workspace_swipe` based purely on accumulated delta/velocity, even if the gesture was cancelled (e.g. interrupted by palm rejection, a finger lift causing libinput to abort the gesture, or other HW-level interruption). This can cause a workspace switch to be committed for a gesture the user never intentionally completed.","fix":"Check `event.cancelled()` before calling `end_workspace_swipe`; on cancellation, reset the workspace delta back to the starting workspace instead of evaluating velocity/position thresholds, mirroring how the non-internal swipe path forwards `cancelled` to clients.","locations":[{"ref":"src/input/mod.rs:1173-1217","code":" 1173 |             InputEvent::GestureSwipeEnd { event, .. } => {\n 1174 |                 let maybe_seat = self\n 1175 |                     .common\n 1176 |                     .shell\n 1177 |                     .read()\n 1178 |                     .seats\n 1179 |                     .for_device(&event.device())\n 1180 |                     .cloned();\n 1181 |                 if let Some(seat) = maybe_seat {\n 1182 |                     self.common.idle_notifier_state.notify_activity(&seat);\n 1183 |                     if let Some(ref gesture_state) = self.common.gesture_state {\n 1184 |                         match gesture_state.action {\n 1185 |                             Some(SwipeAction::NextWorkspace) | Some(SwipeAction::PrevWorkspace) => {\n 1186 |                                 let velocity = gesture_state.velocity();\n 1187 |                                 let norm_velocity =\n 1188 | "difficulty":"easy","description":"`InputEvent::TouchUp` explicitly checks whether the active overview-mode trigger is `Trigger::Touch(slot)` for the terminating slot and clears overview mode (lines 1391-1397). `InputEvent::TouchCancel`, which represents the abnormal/interrupted counterpart of TouchUp (touch sequence aborted by the compositor/driver, e.g. due to a gesture takeover), performs no such cleanup. If a touch-driven overview-mode gesture is cancelled instead of ending normally, `shell.overview_mode`'s active trigger keeps referencing a slot that will never send TouchUp, leaving the compositor stuck in overview mode until some unrelated logic clears it.","fix":"Mirror the TouchUp cleanup in the TouchCancel handler: if `shell.overview_mode().0.active_trigger()` is `Trigger::Touch(slot)` matching `event.slot()`, call `shell.set_overview_mode(None, ...)` there as well.","locations":[{"ref":"src/input/mod.rs:1391-1397","code":" 1391 |             InputEvent::TouchUp { event, .. } => {\n 1392 |                 let mut shell = self.common.shell.write();\n 1393 |                 if let Some(Trigger::Touch(slot)) = shell.overview_mode().0.active_trigger()\n 1394 |                     && *slot == event.slot()\n 1395 |                 {\n 1396 |                     shell.set_overview_mode(None, self.common.event_loop_handle.clone());\n 1397 |                 }","lines":7,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/input/mod.rs#L1391-L1397"},{"ref":"src/input/mod.rs:1415-1428","code":" 1415 |             InputEvent::TouchCancel { event, .. } => {\n 1416 |                 let maybe_seat = self\n 1417 |                     .common\n 1418 |                     .shell\n 1419 |                     .read()\n 1420 |                     .seats\n 1421 |                     .for_device(&event.device())\n 1422 |                     .cloned();\n 1423 |                 if let Some(seat) = maybe_seat {\n 1424 | nt/stack/tabs.rs:404-405","code":"  404 |                 let min_width =\n  405 |                     (size.width - MIN_ACTIVE_TAB_WIDTH as f32 - 4.) / (element_count as f32 - 6.);","lines":2,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/shell/element/stack/tabs.rs#L404-L405"}]},{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"hard","description":"When a window drag ends by dropping onto a stack, `FloatingLayout::drop_window` (src/shell/layout/floating/mod.rs) merges the dragged window into the *existing* target stack and returns that different `CosmicMapped` (`mapped`) instead of the originally dragged one. Back in `MoveGrab::drop`'s Drop closure, the synthetic post-drop pointer-motion offset is computed as `position.as_logical().to_f64() - window.geometry().loc.to_f64() + offset`, where `window` is still the pre-drag dragged `CosmicMapped` captured before the merge, not `mapped` (the actual now-focused stack). Since `window`'s geometry is stale/unrelated to the stack's on-screen location, the synthetic `MotionEvent` sent to the client carries a wrong local coordinate whenever a drag ends by merging into a stack.","fix":"Use `mapped.geometry().loc` (the element actually returned by `drop_window`) instead of the stale `window.geometry().loc` when computing the synthetic pointer-motion offset at line 953.","locations":[{"ref":"src/shell/grabs/moving.rs:938-963","code":"  938 |             if let Some((mapped, position)) = position {\n  939 |                 let serial = SERIAL_COUNTER.next_serial();\n  940 |                 if !is_touch_grab {\n  941 |                     let pointer = seat.get_pointer().unwrap();\n  942 |                     let current_location = pointer.current_location();\n  943 | \n  944 |                     if let Some((target, offset)) = mapped.focus_under(\n  945 |                         current_location - position.as_logical().to_f64(),\n t/floating/mod.rs:912-941","code":"  912 |     pub fn resize_request(\n  913 |         &mut self,\n  914 |         mapped: &CosmicMapped,\n  915 |         seat: &Seat<State>,\n  916 |         start_data: GrabStartData,\n  917 |         edges: ResizeEdge,\n  918 |         edge_snap_threshold: u32,\n  919 |         release: ReleaseMode,\n  920 |     ) -> Option<ResizeSurfaceGrab> {\n  921 |         if seat.get_pointer().is_some() {\n  922 |             let location = self.space.element_location(mapped)?.as_local();\n  923 |             let size = mapped.geometry().size;\n  924 |             mapped.moved_since_mapped.store(true, Ordering::SeqCst);\n  925 | \n  926 |             Some(grabs::ResizeSurfaceGrab::new(\n  927 |                 start_data,\n  928 |                 mapped.clone(),\n  929 |                 edges,\n  930 |                 self.space.outputs().next().cloned().unwrap(),\n  931 |                 edge_snap_threshold,\n  932 |                 location,\n  933 |                 size,\n  934 |                 seat,\n  935 |                 release,\n  936 |             ))\n  937 |         } else {\n  938 |             None\n  939 |         }\n  940 |     }\n  941 | ","lines":30,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/shell/layout/floating/mod.rs#L912-L941"}]},{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`update_orientation()` rescales a group's `sizes` to the new orientation's length and then only\ncorrects the rounding error when the new sum undershoots the target: `if sum < new_length { *sizes.last_mut().unwrap() += new_length - sum; }`.\nIf rounding causes the sum to *overshoot* (`sum > new_length`, equally likely with `.round()`), no\ncorrection happens and the persisted `sizes` vector (which is written back into the live tree and\npushed onto the animation queue) permanently sums to more than the group's actual pixel length.\nEvery sibling function that does the equivalent rescale (`Data::update_geometry` at\nsrc/shell/layout/tiling/mod.rs:313-319, and the `remap` restore-state rescale at\nsrc/shell/layout/tiling/mod.rs:479-483) uses the symmetric `if sum != new_length { diff = new_length - sum; ... }`\nform, which handles both directions - this function is the odd one out. The corrupted sizes make\nsubsequent `update_positions` calls lay out children whose rectangles extend past the group's\nbounds (overlapping the next group or clipping off-screen), and the error is carried forward by\nevery later proportional rescale since they all scale relative to the (now wrong) stored sizes.","fix":"Use the same symmetric correction as `Data::update_geometry`:\n```rust\nlet sum: i32 = sizes.iter().sum();\nif sum != new_length {\n    let diff = new_length - sum;\n    *sizes.last_mut().unwrap() += diff;\n}\n```","locations":[{"ref":"src/shell/layout/tiling/mod.rs:2116-2123","code":" 2116 |             sizes.iter_mut().for_each(|len| {\n 2117 |                 *len = (((*len as f64) / (previous_length as f64)) * (new_length as f64)).round()\n 2118 |                     as i32;\n 2119 |             });\n 2120 |             let sum: i32 = sizes.iter().sum();\n 2121 |             if sum < new_length {\n 2122 |                 *sizes.last_mut().unwrap() += new_length - sum;\n 2123 |             }","lines":8,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/shell/layout/tiling/mod.rs#L2116-L2123"}]},{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`render_popups()` computes the animation `percentage` directly as\n`Instant::now().duration_since(animation_start).as_millis() as f32 / duration.as_millis() as f32`\nwith no guard for `duration == Duration::ZERO`. `render()` (the sibling function used for the main\nrender path, ~40 lines above/below in the same impl block) explicitly special-cases this:\n`if *duration == Duration::ZERO { 1.0 } else { ... }`. Tree durations of `Duration::ZERO` are a\nnormal occurrence: `TreeQueue::push_tree` defaults to `Duration::ZERO` when `None` is passed, and\nseveral call sites do pass `None` (e.g. `TilingLayout::resize` at line 2613, `set_output` at line\n392). When such a zero-duration tree is the animation target, `render_popups` divides by zero,\nproducing `f32::INFINITY`/`NaN`, which is then fed into `ease(EaseInOutCubic, 0.0, 1.0, percentage)`\nand subsequently used to interpolate popup rectangles, corrupting their position/size for that\nframe (popups can flash at (0,0) or collapse to zero size).","fix":"Mirror the guard already used in `render()`:\n```rust\nlet percentage = if let Some(animation_start) = self.queue.animation_start {\n    if *duration == Duration::ZERO {\n        1.0\n    } else {\n        let percentage = Instant::now().duration_since(animation_start).as_millis() as f32\n            / duration.as_millis() as f32;\n        ease(EaseInOutCubic, 0.0, 1.0, percentage)\n    }\n} else {\n    1.0\n};\n```","locations":[{"ref":"src/shell/layout/tiling/mod.rs:4200-4203","code":" 4200 |         let percentage = if let Some(animation_start) = self.queue.animation_start {\n 4201 |             let percentage = Instant::now().duration_since(animation_start).as_millis() as f32\n 4202 |                 / duration.as_millis() as f32;\n 4203 |             ease(EaseInOutCubic, 0.0, 1.0, percentage)","lines":4,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/shell/layout/tiling/mod.rs#L4200-L4203"}]},{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"The overview-mode fade alpha is computed with integer division before the cast to f32: `Instant::now().duration_since(*started).as_millis() / ANIMATION_DURATION.as_millis()` divides two `u128` values, which truncates to `0` for the entire ~200ms transition (since elapsed < ANIMATION_DURATION) and only jumps to `1` once the animation is already over. As a result the alpha value is pinned at a constant (1.0 during `Started`, 0.6 during `Ended`) for the whole animation and then snaps instantly to the other value instead of easing smoothly, i.e. the overview-mode fade-in/fade-out animation doesn't actually animate. The correct pattern (cast to f32/f64 before dividing) is used correctly a few lines below in the same function (`(...).as_millis() as f64 / 100.0`) and elsewhere in `shell/mod.rs` (e.g. `ANIMATION_DURATION.as_millis() as f32`), confirming this is a copy/paste mistake rather than intentional.","fix":"Cast each `as_millis()` call to f32 before dividing, e.g.:\n```rust\nOverviewMode::Started(_, started) => {\n    (1.0 - (Instant::now().duration_since(*started).as_millis() as f32\n        / ANIMATION_DURATION.as_millis() as f32))\n        .max(0.0)\n        * 0.4\n        + 0.6\n}\n```\nApply the same fix to the `Ended` arm and to the duplicate block in `render_popups`.","locations":[{"ref":"src/shell/workspace.rs:1750-1766","code":" 1750 |             let alpha = match &overview.0 {\n 1751 |                 OverviewMode::Started(_, started) => {\n 1752 |                     (1.0 - (Instant::now().duration_since(*started).as_millis()\n 1753 |                         / ANIMATION_DURATION.as_millis()) as f32)\n 1754 |                         .max(0.0)\n 1755 |                         * 0.4\n 1756 |                         + 0.6\n 1757 |                 }\n 1758 |                 OverviewMode::Ended(_, ended) => {\n 1759 |                     ((Instant::now().duration_since(*ended).as_millis()\n 1760 |                         / ANIMATION_DURATION.as_millis()) as f32)\n 1761 |                         * 0.4\n 1762 |                         + 0.6\n 1763 |                 }\n 1764 |                 OverviewMode::Active(_) => 0.6,\n 1765 |                 OverviewMode::None => 1.0,\n 1766 |             };","lines":17,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/shell/workspace.rs#L1750-L1766"},{"ref":"src/shell/workspace.rs:1926-1942","code":" 1926 |             let alpha = match &overview.0 {\n 1927 |                 OverviewMode::Started(_, started) => {\n 1928 |                     (1.0 - (Instant::now().duration_since(*started).as_millis()\n 1929 |                         / ANIMATION_DURATION.as_millis()) as f32)\n 1930 |                         .max(0.0)\n 1931 |                         * 0.4\n 1932 |                         + 0.6\n 1933 |                 }\n 1934 |                 OverviewMode::Ended(_, ended) => {\n 1935 |                     ((Instant::now().duration_since(*ended).as_millis()\n 1936 |                         / ANIMATION_DURATION.as_millis()) as f32)\n 1937 |                         * 0.4\n 1938 |                         + 0.6\n 1939 |                 }\n 1940 |                 OverviewMode::Active(_) => 0.6,\n 1941 |                 OverviewMode::None => 1.0,\n 1942 |             };","lines":17,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/shell/workspace.rs#L1926-L1942"}]},{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `systemd::ready`, the `DISPLAY` environment variable passed to `systemctl --user import-environment` is computed as `common.xwayland_state.as_ref().map(|s| format!(\":{}\", s.display)).unwrap_or_default()`. When Xwayland is disabled or hasn't started yet (`xwayland_state` is `None`), this evaluates to an empty string, so `systemctl --user import-environment ... DISPLAY` imports `DISPLAY=\"\"` into the systemd user manager's environment. This can overwrite/clobber a previously-valid `DISPLAY` value already present in the systemd user environment (e.g. from a prior session or nested X11), breaking X11 app launches for user services started afterwards, instead of simply leaving `DISPLAY` untouched.","fix":"Only pass/import `DISPLAY` when `xwayland_state` is `Some`; when it is `None`, drop `DISPLAY` from the `--user import-environment` argument list and `.env()` call entirely instead of importing an empty value.","locations":[{"ref":"src/systemd.rs:8-21","code":"    8 | pub fn ready(common: &Common) {\n    9 |     if booted() {\n   10 |         match Command::new(\"systemctl\")\n   11 |             .args([\"--user\", \"import-environment\", \"WAYLAND_DISPLAY\", \"DISPLAY\"])\n   12 |             .env(\"WAYLAND_DISPLAY\", &common.socket)\n   13 |             .env(\n   14 |                 \"DISPLAY\",\n   15 |                 common\n   16 |                     .xwayland_state\n   17 |                     .as_ref()\n   18 |                     .map(|s| format!(\":{}\", s.display))\n   19 |                     .unwrap_or_default(),\n   20 |             )\n   21 |             .status()","lines":14,"link":"https://github.com/pop-os/cosmic-comp/blob/dec1ee863368737c6900e1ae75424813e27e24af/src/systemd.rs#L8-L21"}]},{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`IcedElementInternal` stores a single `last_touch_serial: Option<Serial>` and `last_seat` shared across all touch points, instead of tracking it per `Finger` id. In `TouchTarget::down` it is overwritten with whichever finger last touched down. If two fingers are simultaneously down on the same `IcedElement` (e.g. a context menu or the zoom overlay), `motion`/`up` events for the finger that touched down first will use `last_touch_serial.unwrap()` referring to the serial of the second finger's `down` event, associating the wrong serial with the outgoing touch event. `motion` in particular calls `.unwrap()` unconditionally, so it silently uses a stale/incorrect serial rather than panicking, since `down` is guaranteed to have run first for a given target - but the value used for a given finger is not g
