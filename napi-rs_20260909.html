{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"easy","description":"`module_exports` proc-macro `panic!`s when the decorated function does not have exactly 1 or 2 arguments. A proc-macro should emit a span-based compile error (e.g. via `bail_span!`/`syn::Error`) rather than panic, otherwise the user gets an opaque internal-compiler-style `proc-macro panicked` message instead of a helpful diagnostic pointing at their code.","fix":"Replace the `panic!` with a compile error returned as tokens, e.g. emit `syn::Error::new_spanned(&fn_name, \"Arguments length of #[module_exports] function must be 1 or 2\").to_compile_error()` instead of panicking.","locations":[{"ref":"crates/macro/src/lib.rs:146-152","code":"  146 |   let call_expr = if args_len == 1 {\n  147 |     quote! { #fn_name(exports) }\n  148 |   } else if args_len == 2 {\n  149 |     quote! { #fn_name(exports, env) }\n  150 |   } else {\n  151 |     panic!(\"Arguments length of #[module_exports] function must be 1 or 2\");\n  152 |   };","lines":7,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/macro/src/lib.rs#L146-L152"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"In watch mode the build's `postBuild()` is triggered from a stderr `data` listener whenever the `Finished \\`dev\\`/\\`release\\`` line is seen, with `.catch(() => {})` swallowing all errors. Any failure during artifact copy / type-def generation / js-binding writing in watch mode is silently discarded, so the user sees a 'Finished' build but stale or missing bindings with no diagnostic. Additionally this can run concurrently with the `buildTask.then(() => this.postBuild())` path, causing two overlapping postBuild runs that race on the same output files.","fix":"Log the caught error (at least via debug.error) instead of swallowing it, and guard against concurrent postBuild runs (e.g. a single-flight lock / queue) so watch-mode and the main task don't race on the output files.","locations":[{"ref":"cli/src/api/build.ts:1235-1248","code":" 1235 |       // watch mode only, they are piped through stderr\n 1236 |       buildProcess.stderr?.on('data', (data) => {\n 1237 |         const output = data.toString()\n 1238 |         console.error(output)\n 1239 |         if (/Finished\\s(`dev`|`release`)/.test(output)) {\n 1240 |           this.postBuild().catch(() => {})\n 1241 |         }\n 1242 |       })\n 1243 |     })\n 1244 | \n 1245 |     return {\n 1246 |       task: buildTask.then(() => this.postBuild()),\n 1247 |       abort: () => controller.abort(),\n 1248 |     }","lines":14,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/cli/src/api/build.ts#L1235-L1248"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"In `universalizeBinaries`, the lipo invocation `universalizers[process.platform]?.(srcFiles, output)` is called via optional chaining; if `process.platform` somehow has no universalizer the call is a no-op, then the very next line checks `fileExists(output)` and throws 'Universal binary was not created'. But the earlier guard at line 71 already throws when `!universalizers[process.platform]`, so the optional-chaining at line 96 is dead defensive code that masks intent. More importantly `createDarwinUniversalBinary` runs `lipo` with `stdio: 'inherit'` and the inputs are user/config-derived absolute paths spread directly as argv (acceptable since spawnSync without shell), but `output` collisions are not checked - an existing universal file is silently overwritten.","fix":"Remove the redundant optional chaining at the call site (the guard above guarantees presence), and optionally warn before overwriting an existing universal output.","locations":[{"ref":"cli/src/api/universalize.ts:63-102","code":"   63 |   const srcFiles = UniArchsByPlatform[process.platform]?.map((arch) =>\n   64 |     resolve(\n   65 |       options.cwd,\n   66 |       options.outputDir,\n   67 |       `${config.binaryName}.${process.platform}-${arch}.node`,\n   68 |     ),\n   69 |   )\n   70 | \n   71 |   if (!srcFiles || !universalizers[process.platform]) {\n   72 |     throw new Error(\n   73 |       `'universal' arch for platform '${process.platform}' not supported.`,\n   74 |     )\n   75 |   }\n   76 | \n   77 |   debug(`Looking up source binaries to combine: `)\n   78 |   debug('  %O', srcFiles)\n   79 | \n   80 |   const srcFileLookup = await Promise.all(srcFiles.map((f) => fileExists(f)))\n   81 | \n   82 |   const notFoundFiles = srcFiles.filter((_, i) => !srcFileLookup[i])\n   83 | \n   84 |   if (notFoundFiles.length) {\n   85 |     throw new Error(\n   86 |       `Some binary files were not found: ${JSON.stringify(notFoundFiles)}`,\n   87 |     )\n   88 |   }\n   89 | \n   90 |   const output = resolve(\n   91 |     options.cwd,\n   92 |     options.outputDir,\n   93 |     `${config.binaryName}.${process.platform}-universal.node`,\n   94 |   )\n   95 | \n   96 |   universalizers[process.platform]?.(srcFiles, output)\n   97 | \n   98 |   if (!(await fileExists(output))) {\n   99 |     throw new Error(`Universal binary was not created: ${output}`)\n  100 |   }\n  101 | \n  102 |   debug(`Produced universal binary: ${output}`)","lines":40,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/cli/src/api/universalize.ts#L63-L102"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"The compat-mode proc-macros unwrap several Options populated by the `Fold` impl: `js_fn.name.unwrap()`, `js_fn.signature.unwrap()`, `js_fn.signature_raw.unwrap()`. If the folded item somehow lacks a signature/name (e.g. future syn changes, unusual input), these panic with no span, producing a bad diagnostic instead of a compile error.","fix":"Guard the Options and emit a `syn::Error::to_compile_error()` if absent, or restructure `JsFunction` so the signature/name are non-optional after folding.","locations":[{"ref":"crates/macro/src/lib.rs:49-51","code":"   49 |   let fn_name = js_fn.name.unwrap();\n   50 |   let fn_block = js_fn.block;\n   51 |   let signature = js_fn.signature.unwrap();","lines":3,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/macro/src/lib.rs#L49-L51"},{"ref":"crates/macro/src/lib.rs:86-88","code":"   86 |   let fn_name = js_fn.name.unwrap();\n   87 |   let fn_block = js_fn.block;\n   88 |   let signature = js_fn.signature.unwrap();","lines":3,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/macro/src/lib.rs#L86-L88"},{"ref":"crates/macro/src/lib.rs:143-144","code":"  143 |   let fn_name = js_fn.name.unwrap();\n  144 |   let signature = js_fn.signature_raw.unwrap();","lines":2,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/macro/src/lib.rs#L143-L144"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`generator_next_fn` and the other async generator callbacks throw errors using `e.reason.as_ptr()` as a C string: `sys::napi_throw_error(env, format!(\"{}\", e.status).as_ptr().cast(), e.reason.as_ptr().cast())`. Both `format!(...)` and `e.reason` are Rust `String`s that are NOT NUL-terminated; `napi_throw_error` expects NUL-terminated C strings and will read past the buffer end, leaking adjacent memory into the error code/message or reading out of bounds. Additionally the temporary `format!` string is dropped at the end of the statement, so the pointer dangles even before napi reads it.","fix":"Build NUL-terminated `CString`s (and keep them alive for the duration of the call), or use `JsError::from(e).throw_into(env)` which handles lengths correctly.","locations":[{"ref":"crates/napi/src/bindgen_runtime/async_iterator.rs:336-341","code":"  336 |           sys::napi_throw_error(\n  337 |             env,\n  338 |             format!(\"{}\", e.status).as_ptr().cast(),\n  339 |             e.reason.as_ptr().cast(),\n  340 |           )\n  341 |         };","lines":6,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/async_iterator.rs#L336-L341"},{"ref":"crates/napi/src/bindgen_runtime/iterator.rs:428-433","code":"  428 |               sys::napi_throw_error(\n  429 |                 env,\n  430 |                 format!(\"{}\", e.status).as_ptr().cast(),\n  431 |                 e.reason.as_ptr().cast(),\n  432 |               )\n  433 |             };","lines":6,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/iterator.rs#L428-L433"},{"ref":"crates/napi/src/bindgen_runtime/iterator.rs:493-498","code":"  493 |             sys::napi_throw_error(\n  494 |               env,\n  495 |               format!(\"{}\", e.status).as_ptr().cast(),\n  496 |               e.reason.as_ptr().cast(),\n  497 |             )\n  498 |           };","lines":6,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/iterator.rs#L493-L498"},{"ref":"crates/napi/src/bindgen_runtime/iterator.rs:688-693","code":"  688 |         sys::napi_throw_error(\n  689 |           env,\n  690 |           format!(\"{}\", e.status).as_ptr().cast(),\n  691 |           e.reason.as_ptr().cast(),\n  692 |         )\n  693 |       };","lines":6,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/iterator.rs#L688-L693"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`Reference::drop` only unrefs (`napi_reference_unref`) when `Arc::strong_count > 1`, and NEVER calls\n`napi_delete_reference`. The comment says when strong count == 1 the object is dropped on GC at\nprocess exit, but in the normal case (count > 1) the napi_ref is unref'd but the `napi_ref` handle\nitself is never deleted by `Reference`. Reference handles are created in `class.rs::new_instance`\n(`napi_wrap` produces `object_ref`) and stored in `REFERENCE_MAP`; nothing in the shown `Drop`\ndeletes them. If the only deletion happens in `Reference::add_ref` when a *duplicate* insert evicts\na previous entry (`napi_delete_reference(env, previous_ref)`), then references that are never\nre-inserted leak their `napi_ref` for the lifetime of the env. At minimum the unbalanced\nunref-without-delete is fragile and relies on GC finalization ordering.","fix":"Document precisely who owns and deletes the `napi_ref` (the GC finalizer via `finalize_callbacks`),\nand ensure the ref is deleted exactly once. Verify against the wrap finalizer that the\nunref-here / delete-on-finalize split is balanced for the count==1 case.","locations":[{"ref":"crates/napi/src/bindgen_runtime/js_values/value_ref.rs:56-78","code":"   56 | impl<T> Drop for Reference<T> {\n   57 |   fn drop(&mut self) {\n   58 |     let rc_strong_count = Arc::strong_count(&self.finalize_callbacks);\n   59 |     let mut ref_count = 0;\n   60 |     // If Rc strong count == 1, then the referenced object is dropped on GC\n   61 |     // It would happen when the process is exiting\n   62 |     // In general, the `drop` of the `Reference` would happen first\n   63 |     if rc_strong_count > 1 {\n   64 |       let status = unsafe {\n   65 |         crate::sys::napi_reference_unref(\n   66 |           self.env as crate::sys::napi_env,\n   67 |           self.napi_ref,\n   68 |           &mut ref_count,\n   69 |         )\n   70 |       };\n   71 |       debug_assert!(\n   72 |         status == crate::sys::Status::napi_ok,\n   73 |         \"Reference unref failed, status code: {}\",\n   74 |         crate::Status::from(status)\n   75 |       );\n   76 |     };\n   77 |   }\n   78 | }","lines":23,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/js_values/value_ref.rs#L56-L78"}]},
{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`napi_create_reference` return status is ignored when creating the class constructor ref (`sys::napi_create_reference(env, class_ptr, 1, &mut ctor_ref)`). Every other napi call in this function is wrapped in `check_status_or_throw!`. If this call fails, `ctor_ref` stays null and a null `napi_ref` is inserted into `registered_classes`, later returned by `get_class_constructor`, leading to misbehavior with no diagnostic.","fix":"Wrap the `napi_create_reference` call in `check_status_or_throw!` like the surrounding calls.","locations":[{"ref":"crates/napi/src/bindgen_runtime/module_register.rs:690-693","code":"  690 |           let mut ctor_ref = ptr::null_mut();\n  691 |           sys::napi_create_reference(env, class_ptr, 1, &mut ctor_ref);\n  692 | \n  693 |           registered_classes.insert(js_name.to_string(), ctor_ref);","lines":4,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/module_register.rs#L690-L693"}]},
{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`throw_syntax_error` (napi9) uses `CString::new(...).expect(...)` on both the\ncode and the message. Any caller-supplied string containing an interior NUL byte\nwill panic the whole process instead of returning an error. Unlike the other\n`throw_*` methods which return `Result<()>` and use `CString::new(...)?`, this\none takes no Result and panics. A JS-facing throw helper should never abort the\nprocess due to input content.","fix":"Make `throw_syntax_error` return `Result<()>` and use `CString::new(...)?`, or replace interior NULs / fall back gracefully instead of `.expect`.","locations":[{"ref":"crates/napi/src/env.rs:769-783","code":"  769 |   #[cfg(feature = \"napi9\")]\n  770 |   pub fn throw_syntax_error<S: AsRef<str>, C: AsRef<str>>(&self, msg: S, code: Option<C>) {\n  771 |     use crate::check_status_or_throw;\n  772 | \n  773 |     let code = code.as_ref().map(|c| c.as_ref()).unwrap_or(\"\");\n  774 |     let c_code = CString::new(code).expect(\"code must be a valid utf-8 string\");\n  775 |     let code_ptr = c_code.as_ptr();\n  776 |     let msg: CString = CString::new(msg.as_ref()).expect(\"msg must be a valid utf-8 string\");\n  777 |     let msg_ptr = msg.as_ptr();\n  778 |     check_status_or_throw!(\n  779 |       self.0,\n  780 |       unsafe { sys::node_api_throw_syntax_error(self.0, code_ptr, msg_ptr,) },\n  781 |       \"Throw syntax error failed\"\n  782 |     );\n  783 |   }","lines":15,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/env.rs#L769-L783"}]},
{"id":"ERR_9","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`spawn_future_with_callback` transmutes a stack-local `Env` reference to the\n`'env` lifetime: `core::mem::transmute::<&Env, &'env Env>(&env)`. The `env`\nlocal is created inside the resolver closure that runs later on the JS thread;\nextending a reference to a stack local to `'env` (the caller's lifetime) and\nhanding it to the user callback is unsound if the callback stashes the `&'env\nEnv` anywhere outliving the closure invocation. The user callback signature\n`FnOnce(&'env Env, T)` invites exactly that. `Env` is `Copy`, so passing it by\nvalue would avoid the transmute entirely.","fix":"Pass `Env` by value (it is Copy) to the callback rather than transmuting a stack-local reference to an arbitrary `'env` lifetime.","locations":[{"ref":"crates/napi/src/env.rs:1259-1280","code":" 1259 |   pub fn spawn_future_with_callback<\n 1260 |     'env,\n 1261 |     T: 'static + Send,\n 1262 |     V: ToNapiValue,\n 1263 |     F: 'static + Send + Future<Output = Result<T>>,\n 1264 |     R: 'static + FnOnce(&'env Env, T) -> Result<V>,\n 1265 |   >(\n 1266 |     &'env self,\n 1267 |     fut: F,\n 1268 |     callback: R,\n 1269 |   ) -> Result<PromiseRaw<'env, V>> {\n 1270 |     use crate::tokio_runtime;\n 1271 | \n 1272 |     let promise = tokio_runtime::execute_tokio_future(self.0, fut, move |env, val| unsafe {\n 1273 |       let env = Env::from_raw(env);\n 1274 |       let static_env = core::mem::transmute::<&Env, &'env Env>(&env);\n 1275 |       let val = callback(static_env, val)?;\n 1276 |       ToNapiValue::to_napi_value(env.0, val)\n 1277 |     })?;\n 1278 | \n 1279 |     Ok(PromiseRaw::new(self.0, promise))\n 1280 |   }","lines":22,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/env.rs#L1259-L1280"}]},
{"id":"ERR_10","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`UnknownRef` and `SymbolRef` Drop impls only `eprintln!` a leak warning but never actually release the napi reference. The doc comment admits the reference 'will be leaked forever' if `unref` is not called. This is by design but the warning message is misleading: it says 'ObjectRef is not unref' for both UnknownRef and SymbolRef (copy-paste; should say UnknownRef / SymbolRef respectively), making leak diagnostics point at the wrong type.","fix":"Fix the warning text to name the actual type (`UnknownRef`/`SymbolRef`). Consider whether Drop should attempt a best-effort release given a stored env, since silent leaks are easy to hit.","locations":[{"ref":"crates/napi/src/js_values/unknown.rs:111-117","code":"  111 | impl<const LEAK_CHECK: bool> Drop for UnknownRef<LEAK_CHECK> {\n  112 |   fn drop(&mut self) {\n  113 |     if LEAK_CHECK && !self.inner.is_null() {\n  114 |       eprintln!(\"ObjectRef is not unref, it considered as a memory leak\");\n  115 |     }\n  116 |   }\n  117 | }","lines":7,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/js_values/unknown.rs#L111-L117"},{"ref":"crates/napi/src/js_values/symbol.rs:69-75","code":"   69 | impl<const LEAK_CHECK: bool> Drop for SymbolRef<LEAK_CHECK> {\n   70 |   fn drop(&mut self) {\n   71 |     if LEAK_CHECK && !self.inner.is_null() {\n   72 |       eprintln!(\"ObjectRef is not unref, it considered as a memory leak\");\n   73 |     }\n   74 |   }\n   75 | }","lines":7,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/js_values/symbol.rs#L69-L75"}]},
{"id":"ERR_11","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`JsValue::escape` calls `sys::napi_escape_handle` inside an `unsafe` block but ignores its returned `napi_status`. If escaping fails (e.g. scope already escaped, which is a common N-API error since a scope may only be escaped once), `result` stays null and is passed straight to `from_napi_value`, silently producing a value wrapping a null pointer instead of surfacing an error. Every other method in this trait wraps its N-API call in `check_status!`.","fix":"Wrap the `napi_escape_handle` call in `check_status!(unsafe { ... })?;` before constructing the escaped value.","locations":[{"ref":"crates/napi/src/js_values/value.rs:162-176","code":"  162 |   fn escape<'scope, E: JsValue<'scope> + FromNapiValue>(\n  163 |     &self,\n  164 |     escapable_handle_scope: EscapableHandleScope<'scope>,\n  165 |   ) -> Result<E> {\n  166 |     let mut result = ptr::null_mut();\n  167 |     unsafe {\n  168 |       sys::napi_escape_handle(\n  169 |         escapable_handle_scope.env,\n  170 |         escapable_handle_scope.scope,\n  171 |         self.raw(),\n  172 |         &mut result,\n  173 |       )\n  174 |     };\n  175 |     unsafe { <E as FromNapiValue>::from_napi_value(self.value().env, result) }\n  176 |   }","lines":15,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/js_values/value.rs#L162-L176"}]},
{"id":"ERR_12","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`createGhRelease` swallows the GitHub release-creation error with `console.error(e)` and continues, returning a valid-looking `{ owner, repo, pkgInfo, octokit }`. The later asset-upload loop then assumes the release exists and calls `getReleaseByTag`; if the release truly failed to create for a non-'already exists' reason, the user gets a confusing downstream 404 instead of the original creation error being surfaced as fatal.","fix":"Distinguish 'release already exists' from other errors; rethrow unexpected errors instead of logging and proceeding.","locations":[{"ref":"cli/src/api/pre-publish.ts:542-565","code":"  542 |     if (!options.dryRun) {\n  543 |       try {\n  544 |         await octokit.repos.createRelease({\n  545 |           owner,\n  546 |           repo,\n  547 |           tag_name: pkgInfo.tag,\n  548 |           name: options.ghReleaseName,\n  549 |           prerelease:\n  550 |             version.includes('alpha') ||\n  551 |             version.includes('beta') ||\n  552 |             version.includes('rc'),\n  553 |         })\n  554 |       } catch (e) {\n  555 |         debug(\n  556 |           `Params: ${JSON.stringify(\n  557 |             { owner, repo, tag_name: pkgInfo.tag },\n  558 |             null,\n  559 |             2,\n  560 |           )}`,\n  561 |         )\n  562 |         console.error(e)\n  563 |       }\n  564 |     }\n  565 |     return { owner, repo, pkgInfo, octokit }","lines":24,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/cli/src/api/pre-publish.ts#L542-L565"}]},
{"id":"ERR_13","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`updatePackageJson` reads and `JSON.parse`s the target package.json with no try/catch. A malformed or partially-written package.json (e.g. concurrent writes during publish) throws a raw SyntaxError with no file-path context, unlike `readNapiConfig` which wraps parse errors with the offending path.","fix":"Wrap the JSON.parse in try/catch and rethrow with the file path in the message (matching readNapiConfig's pattern).","locations":[{"ref":"cli/src/utils/misc.ts:6146-6160","code":" 6146 | export async function updatePackageJson(\n 6147 |   path: string,\n 6148 |   partial: Record<string, any>,\n 6149 | ) {\n 6150 |   const exists = await fileExists(path)\n 6151 |   if (!exists) {\n 6152 |     debug(`File not exists ${path}`)\n 6153 |     return\n 6154 |   }\n 6155 |   const old = JSON.parse(await readFileAsync(path, 'utf8'))\n 6156 |   await writeFileAsync(\n 6157 |     path,\n 6158 |     JSON.stringify(mergePackageJson(old, partial), null, 2),\n 6159 |   )\n 6160 | }","lines":15,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/cli/src/utils/misc.ts#L6146-L6160"}]},
{"id":"ERR_14","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`fill_ty` silently returns the string `\"any\"` when the number of `{}`\nplaceholders does not match the number of supplied args:\n\n    if args.len() != matches.len() {\n      return String::from(\"any\");\n    }\n\nThis swallows what is almost always a real bug (a KNOWN_TYPES template whose\narity disagrees with the actual generic arguments, e.g. `HashMap` after the\nKNOWN_TYPES_IGNORE_ARG filtering went wrong). Instead of a diagnostic the user\ngets a silently-degraded `any` in their `.d.ts`, which is hard to notice and\ndefeats type checking. Codegen is build-time so this cannot be surfaced as a\nhard error easily, but the silent fallback hides template/arity mismatches.","fix":"At minimum keep the `any` fallback but emit a build warning (eprintln!/cargo:warning) including the template and arg count so arity mismatches are diagnosable.","locations":[{"ref":"crates/backend/src/typegen.rs:460-476","code":"  460 | fn fill_ty(template: &str, args: Vec<String>) -> String {\n  461 |   let matches = template.match_indices(\"{}\").collect::<Vec<_>>();\n  462 |   if args.len() != matches.len() {\n  463 |     return String::from(\"any\");\n  464 |   }\n  465 | \n  466 |   let mut ret = String::from(\"\");\n  467 |   let mut prev = 0;\n  468 |   matches.into_iter().zip(args).for_each(|((index, _), arg)| {\n  469 |     ret.push_str(&template[prev..index]);\n  470 |     ret.push_str(&arg);\n  471 |     prev = index + 2;\n  472 |   });\n  473 | \n  474 |   ret.push_str(&template[prev..]);\n  475 |   ret\n  476 | }","lines":17,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/backend/src/typegen.rs#L460-L476"}]},
{"id":"ERR_15","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`windows::setup_gnu` and `search_libnode_path` interplay can `panic!` (\"libnode.dll not found in any search path\") during a build. Build-script panics are acceptable for hard-stop misconfiguration, but here the panic fires whenever a gnu-target windows build lacks libnode on LIBNODE_PATH/LIBPATH/PATH, which is an ordinary environment issue better surfaced as a clear actionable message; also `search_libnode_path` only checks that `LIBNODE_PATH` dir `exists()` but not that it contains libnode.dll before returning it, then `setup_gnu` re-checks and panics with a different message - two divergent failure paths for the same condition.","fix":"Unify the not-found handling: have `search_libnode_path` only return dirs that actually contain `libnode.dll` (apply the same `.join(\"libnode.dll\").exists()` check it uses for LIBPATH/PATH to the LIBNODE_PATH branch), and emit a single clear error/`cargo:warning` message.","locations":[{"ref":"crates/build/src/windows.rs:4-17","code":"    4 | pub fn setup_gnu() {\n    5 |   let libnode_path = search_libnode_path();\n    6 |   if let Some(libnode_dir) = libnode_path {\n    7 |     let node_lib_path = libnode_dir.join(\"libnode.dll\");\n    8 |     if node_lib_path.exists() {\n    9 |       println!(\"cargo:rustc-link-search=native={}\", libnode_dir.display());\n   10 |       println!(\"cargo:rustc-link-lib=node\");\n   11 |     } else {\n   12 |       panic!(\"libnode.dll not found in {}\", libnode_dir.display());\n   13 |     }\n   14 |   } else {\n   15 |     panic!(\"libnode.dll not found in any search path\");\n   16 |   }\n   17 | }","lines":14,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/build/src/windows.rs#L4-L17"},{"ref":"crates/build/src/windows.rs:19-44","code":"   19 | fn search_libnode_path() -> Option<PathBuf> {\n   20 |   if let Ok(path) = env::var(\"LIBNODE_PATH\") {\n   21 |     let libnode_dir = PathBuf::from(path);\n   22 |     if libnode_dir.exists() {\n   23 |       return Some(libnode_dir);\n   24 |     }\n   25 |   }\n   26 | \n   27 |   if let Ok(paths) = env::var(\"LIBPATH\") {\n   28 |     for path in env::split_paths(&paths) {\n   29 |       if path.join(\"libnode.dll\").exists() {\n   30 |         return Some(path);\n   31 |       }\n   32 |     }\n   33 |   }\n   34 | \n   35 |   if let Ok(paths) = env::var(\"PATH\") {\n   36 |     for path in env::split_paths(&paths) {\n   37 |       if path.join(\"libnode.dll\").exists() {\n   38 |         return Some(path);\n   39 |       }\n   40 |     }\n   41 |   }\n   42 | \n   43 |   None\n   44 | }","lines":26,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/build/src/windows.rs#L19-L44"}]},
{"id":"ERR_16","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`output_type_def` and `remove_existed_def_file` swallow filesystem errors: write failures are printed via `println!` (and only in debug for the remove case) but never fail the build. A failed type-def write produces a silently incomplete/missing `.d.ts` with a successful compile, which is hard to diagnose. The `println!` also pollutes build stdout.","fix":"At minimum emit `cargo:warning=...` (recognized by cargo) instead of `println!`, and consider surfacing persistent write failures more loudly so missing type defs are noticed.","locations":[{"ref":"crates/macro/src/expand/typedef/type_def.rs:33-44","code":"   33 | fn remove_existed_def_file() {\n   34 |   if let Some(file) = get_type_def_file() {\n   35 |     if file.exists() {\n   36 |       if let Err(_e) = fs::remove_file(&file) {\n   37 |         #[cfg(debug_assertions)]\n   38 |         {\n   39 |           println!(\"Failed to manipulate type def file {file:?}: {_e:?}\");\n   40 |         }\n   41 |       }\n   42 |     }\n   43 |   }\n   44 | }","lines":12,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/macro/src/expand/typedef/type_def.rs#L33-L44"},{"ref":"crates/macro/src/expand/typedef/type_def.rs:46-63","code":"   46 | pub fn output_type_def(napi: &Napi) {\n   47 |   if let Some(file) = get_type_def_file() {\n   48 |     if let Some(type_def) = napi.to_type_def() {\n   49 |       fs::OpenOptions::new()\n   50 |         .append(true)\n   51 |         .create(true)\n   52 |         .open(&file)\n   53 |         .and_then(|file| {\n   54 |           let mut writer = BufWriter::<fs::File>::new(file);\n   55 |           writer.write_all(type_def.to_string().as_bytes())?;\n   56 |           writer.write_all(\"\\n\".as_bytes())?;\n   57 |           writer.flush()\n   58 |         })\n   59 |         .unwrap_or_else(|e| {\n   60 |           println!(\"Failed to write type def file: {e:?}\");\n   61 |         });\n   62 |     }\n   63 |   }","lines":18,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/macro/src/expand/typedef/type_def.rs#L46-L63"}]},
{"id":"ERR_17","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`throw_error` in promise_raw.rs ignores the status of every Node-API call it makes\n(`napi_create_string_latin1`, `napi_create_string_utf8`, `napi_create_error`, `napi_throw`). If\ncreating the code/message strings or the error object fails (e.g. pending exception, OOM), it still\ncalls `napi_throw` with a potentially null `err`, and returns null. A failed `napi_throw` leaves no\nexception pending while the Rust side believes it threw, which can lead to the promise callback\nsilently swallowing the error.","fix":"Check each status; if string/error creation fails, fall back to throwing a minimal known-good error and avoid `napi_throw(env, null)`.","locations":[{"ref":"crates/napi/src/bindgen_runtime/js_values/promise_raw.rs:568-601","code":"  568 | #[inline(never)]\n  569 | fn throw_error(env: sys::napi_env, err: Error, default_msg: &str) -> sys::napi_value {\n  570 |   const GENERIC_FAILURE: &str = \"GenericFailure\\0\";\n  571 |   let code = if err.status.as_ref().is_empty() {\n  572 |     GENERIC_FAILURE\n  573 |   } else {\n  574 |     err.status.as_ref()\n  575 |   };\n  576 |   let mut code_string = ptr::null_mut();\n  577 |   let msg = if err.reason.is_empty() {\n  578 |     default_msg\n  579 |   } else {\n  580 |     err.reason.as_ref()\n  581 |   };\n  582 |   let mut msg_string = ptr::null_mut();\n  583 |   let mut err = ptr::null_mut();\n  584 |   unsafe {\n  585 |     sys::napi_create_string_latin1(\n  586 |       env,\n  587 |       code.as_ptr().cast(),\n  588 |       code.len() as isize,\n  589 |       &mut code_string,\n  590 |     );\n  591 |     sys::napi_create_string_utf8(\n  592 |       env,\n  593 |       msg.as_ptr().cast(),\n  594 |       msg.len() as isize,\n  595 |       &mut msg_string,\n  596 |     );\n  597 |     sys::napi_create_error(env, code_string, msg_string, &mut err);\n  598 |     sys::napi_throw(env, err);\n  599 |   };\n  600 |   ptr::null_mut()\n  601 | }","lines":34,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/js_values/promise_raw.rs#L568-L601"}]},
{"id":"ERR_18","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`NODE_VERSION` node version `release` field is built with `CStr::from_ptr(node_version.release).to_str().unwrap()`. If a runtime ever supplied a non-UTF8 release string, this `.unwrap()` panics during module registration (during `napi_register_module_v1`), aborting module load with an opaque panic across the FFI boundary.","fix":"Use `.to_str().unwrap_or(\"\")` or `to_string_lossy()` and store an owned/lossy string.","locations":[{"ref":"crates/napi/src/bindgen_runtime/module_register.rs:502","code":"  502 |         release: unsafe { CStr::from_ptr(node_version.release).to_str().unwrap() },","lines":1,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/module_register.rs#L502"}]},
{"id":"ERR_19","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`get_words` reserves `Vec::with_capacity(self.word_count)` then passes `words.as_mut_ptr()` with `word_count = &mut self.word_count` (initially self.word_count) to napi_get_value_bigint_words, then unconditionally `words.set_len(self.word_count)`. If napi writes fewer words than capacity (it updates word_count to the actual count), set_len to the (possibly updated) self.word_count is correct only if napi reduced it; but if napi were to report MORE words than the pre-reserved capacity, the pointer write would overflow the allocation (buffer overflow). Since word_count was obtained earlier via the count query this matches, but there is no re-check that the post-call word_count does not exceed the reserved capacity before set_len, so a BigInt that grows between the count query and this call (not possible for immutable BigInt, but the invariant is undocumented) would corrupt memory.","fix":"Assert `self.word_count <= capacity` after the call before `set_len`, or reserve based on the count returned by a fresh query. Document the immutability invariant.","locations":[{"ref":"crates/napi/src/js_values/bigint.rs:155-173","code":"  155 |   pub fn get_words(&mut self) -> Result<(bool, Vec<u64>)> {\n  156 |     let mut words: Vec<u64> = Vec::with_capacity(self.word_count);\n  157 |     let word_count = &mut self.word_count;\n  158 |     let mut sign_bit = 0;\n  159 |     check_status!(unsafe {\n  160 |       sys::napi_get_value_bigint_words(\n  161 |         self.raw.env,\n  162 |         self.raw.value,\n  163 |         &mut sign_bit,\n  164 |         word_count,\n  165 |         words.as_mut_ptr(),\n  166 |       )\n  167 |     })?;\n  168 | \n  169 |     unsafe {\n  170 |       words.set_len(self.word_count);\n  171 |     };\n  172 | \n  173 |     Ok((sign_bit == 1, words))","lines":19,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/js_values/bigint.rs#L155-L173"}]},
{"id":"ERR_20","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `napi_resolve_deferred`, when rejection fails on the non-debug build, nothing happens (the deferred is never settled and the promise hangs). On debug it creates a generic 'Rejection failed' error with `napi_create_string_utf8(..., 0, ...)` - passing length 0 means an empty string is created from the `c\"Rejection failed\"` literal, so the error message is empty rather than 'Rejection failed'. The length arg should be the byte length of the literal (or NAPI_AUTO_LENGTH).","fix":"Pass the correct length (16) or `sys::NAPI_AUTO_LENGTH` so the diagnostic message is non-empty; consider settling the promise even on release builds to avoid a hung promise.","locations":[{"ref":"crates/napi/src/js_values/deferred.rs:746-755","code":"  746 |         if cfg!(debug_assertions) {\n  747 |           eprintln!(\"Failed to reject deferred: {err:?}\");\n  748 |           let mut err = ptr::null_mut();\n  749 |           let mut err_msg = ptr::null_mut();\n  750 |           unsafe {\n  751 |             sys::napi_create_string_utf8(env, c\"Rejection failed\".as_ptr().cast(), 0, &mut err_msg);\n  752 |             sys::napi_create_error(env, ptr::null_mut(), err_msg, &mut err);\n  753 |             sys::napi_reject_deferred(env, deferred, err);\n  754 |           }\n  755 |         }","lines":10,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/js_values/deferred.rs#L746-L755"}]},
{"id":"ERR_21","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"negligible","difficulty":"medium","description":"`ObjectRef`'s `Drop` (with `LEAK_CHECK = true`) only `eprintln!`s a warning when the ref was not\nunref'd; it never actually deletes the reference, so a forgotten `ObjectRef` leaks a `napi_ref`\nsilently apart from a stderr line. The doc comment says \"the object under the hood will be leaked\nforever\" which is accurate, but relying on a printed warning rather than RAII cleanup is unusual and\nthe message goes to stderr unconditionally (noisy in production).","fix":"Consider deleting the reference in Drop when an Env is recoverable, or gate the eprintln behind a debug/feature flag.","locations":[{"ref":"crates/napi/src/bindgen_runtime/js_values/object.rs:934-946","code":"  934 | pub struct ObjectRef<const LEAK_CHECK: bool = true> {\n  935 |   pub(crate) inner: sys::napi_ref,\n  936 | }\n  937 | \n  938 | unsafe impl<const LEAK_CHECK: bool> Send for ObjectRef<LEAK_CHECK> {}\n  939 | \n  940 | impl<const LEAK_CHECK: bool> Drop for ObjectRef<LEAK_CHECK> {\n  941 |   fn drop(&mut self) {\n  942 |     if LEAK_CHECK && !self.inner.is_null() {\n  943 |       eprintln!(\"ObjectRef is not unref, it considered as a memory leak\");\n  944 |     }\n  945 |   }\n  946 | }","lines":13,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/js_values/object.rs#L934-L946"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`getLatestWasmRuntimeVersion` builds the registry URL by concatenating `npmRegistryBase` with the package name `@napi-rs/wasm-runtime` without URL-encoding the scope slash. Most registries accept `@napi-rs/wasm-runtime`, but the official metadata endpoint expects the scoped name URL-encoded (`@napi-rs%2Fwasm-runtime`) for the package document; relying on the un-encoded form is registry-dependent and can 404 against stricter/proxy registries configured via `npm_config_registry`.","fix":"Use `encodeURIComponent(WASM_RUNTIME_PACKAGE_NAME)` when constructing the metadata URL.","locations":[{"ref":"cli/src/api/create-npm-dirs.ts:68-88","code":"   68 | async function getLatestWasmRuntimeVersion() {\n   69 |   const npmRegistryBase =\n   70 |     process.env.npm_config_registry?.replace(/\\/?$/, '/') ??\n   71 |     'https://registry.npmjs.org/'\n   72 |   const packageMetadataUrl = `${npmRegistryBase}${WASM_RUNTIME_PACKAGE_NAME}`\n   73 |   let response: Response\n   74 | \n   75 |   try {\n   76 |     response = await fetch(packageMetadataUrl)\n   77 |   } catch (error) {\n   78 |     throw new Error(\n   79 |       `Failed to fetch ${packageMetadataUrl} while resolving ${WASM_RUNTIME_PACKAGE_NAME}. Check your network connection and npm registry availability.`,\n   80 |       { cause: error },\n   81 |     )\n   82 |   }\n   83 | \n   84 |   if (!response.ok) {\n   85 |     throw new Error(\n   86 |       `Failed to fetch ${packageMetadataUrl} while resolving ${WASM_RUNTIME_PACKAGE_NAME}: npm registry responded with ${response.status} ${response.statusText || 'Unknown Status'}`,\n   87 |     )\n   88 |   }","lines":21,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/cli/src/api/create-npm-dirs.ts#L68-L88"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`Env::get_global` returns `JsGlobal<'static>` built from `self.0` (the raw env). Hardcoding `'static` for a value tied to a borrowed `&self` Env detaches the returned global object's lifetime from the env it came from, allowing the `napi_value` to be held past the validity of the originating scope/env (e.g. across an await point or after the env is torn down), a dangling-value hazard. Other `Env` accessors in this codebase tie returned values to `&self`.","fix":"Return `JsGlobal<'_>` borrowing `&self` rather than `'static`, so the global cannot outlive the env borrow.","locations":[{"ref":"crates/napi/src/bindgen_runtime/env.rs:12-26","code":"   12 |   pub fn get_global(&self) -> Result<JsGlobal<'static>> {\n   13 |     let mut global = std::ptr::null_mut();\n   14 |     crate::check_status!(\n   15 |       unsafe { sys::napi_get_global(self.0, &mut global) },\n   16 |       \"Get global object from Env failed\"\n   17 |     )?;\n   18 |     Ok(JsGlobal(\n   19 |       crate::Value {\n   20 |         value: global,\n   21 |         env: self.0,\n   22 |         value_type: crate::ValueType::Object,\n   23 |       },\n   24 |       std::marker::PhantomData,\n   25 |     ))\n   26 |   }","lines":15,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/env.rs#L12-L26"}]},
{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`Symbol::from_napi_value` ignores the incoming napi value entirely and returns a fresh\n`Symbol { desc: None, for_desc: None }`. A `Symbol` round-tripped from JS therefore loses its\ndescription and its `for`/registry identity, and re-emitting it via `to_napi_value` creates a brand\nnew, unrelated symbol rather than the original. For a value-conversion type this is silently\nincorrect: `fn(s: Symbol) -> Symbol` does not preserve identity.","fix":"Either store the original napi_value/ref inside `Symbol` so `to_napi_value` can return the same\nsymbol, or document loudly that `Symbol` is write-only and use `JsSymbol` for round-tripping.","locations":[{"ref":"crates/napi/src/bindgen_runtime/js_values/symbol.rs:100-111","code":"  100 | impl FromNapiValue for Symbol {\n  101 |   unsafe fn from_napi_value(\n  102 |     _env: sys::napi_env,\n  103 |     _napi_val: sys::napi_value,\n  104 |   ) -> crate::Result<Self> {\n  105 |     Ok(Self {\n  106 |       desc: None,\n  107 |       #[cfg(feature = \"napi9\")]\n  108 |       for_desc: None,\n  109 |     })\n  110 |   }\n  111 | }","lines":12,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/js_values/symbol.rs#L100-L111"}]},
{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"Mutable statics `NODE_VERSION_MAJOR/MINOR/PATCH` are plain `pub static mut u32` written inside `napi_register_module_v1` (unsynchronized) and readable from any thread. With multiple worker threads registering concurrently these are unsynchronized writes/reads to shared mutable statics — a data race (UB under Rust's memory model), and triggers `static_mut_refs` lint on modern compilers if referenced.","fix":"Replace with `AtomicU32`s (or fold into the existing `OnceLock<NodeVersion>`), and read via atomic loads.","locations":[{"ref":"crates/napi/src/bindgen_runtime/module_register.rs:38-43","code":"   38 | #[cfg(feature = \"node_version_detect\")]\n   39 | pub static mut NODE_VERSION_MAJOR: u32 = 0;\n   40 | #[cfg(feature = \"node_version_detect\")]\n   41 | pub static mut NODE_VERSION_MINOR: u32 = 0;\n   42 | #[cfg(feature = \"node_version_detect\")]\n   43 | pub static mut NODE_VERSION_PATCH: u32 = 0;","lines":6,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/module_register.rs#L38-L43"},{"ref":"crates/napi/src/bindgen_runtime/module_register.rs:493-497","code":"  493 |       unsafe {\n  494 |         NODE_VERSION_MAJOR = node_version.major;\n  495 |         NODE_VERSION_MINOR = node_version.minor;\n  496 |         NODE_VERSION_PATCH = node_version.patch;\n  497 |       }","lines":5,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/module_register.rs#L493-L497"}]},
{"id":"API_5","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`create_symbol` silently discards errors from creating the description string:\n`description.and_then(|desc| self.create_string(desc).ok())`. If\n`create_string` fails (e.g. pending exception, OOM), the `.ok()` turns the error\ninto `None` and a symbol is created with no description rather than propagating\nthe failure. This masks real errors and produces a symbol that differs from what\nthe caller requested.","fix":"Propagate the error: build the description string with `?` before the napi_create_symbol call instead of swallowing it via `.ok()`.","locations":[{"ref":"crates/napi/src/env.rs:240-251","code":"  240 |   pub fn create_symbol(&self, description: Option<&str>) -> Result<JsSymbol<'_>> {\n  241 |     let mut result = ptr::null_mut();\n  242 |     check_status!(unsafe {\n  243 |       sys::napi_create_symbol(\n  244 |         self.0,\n  245 |         description\n  246 |           .and_then(|desc| self.create_string(desc).ok())\n  247 |           .map(|string| string.0.value)\n  248 |           .unwrap_or(ptr::null_mut()),\n  249 |         &mut result,\n  250 |       )\n  251 |     })?;","lines":12,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/env.rs#L240-L251"}]},
{"id":"API_6","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`checkGitCommand` uses `exec('git --version')` and resolves on the 'exit' event with `code === 0`, but never consumes or limits stdout. For `git --version` output is tiny so harmless, but the pattern of leaving an exec'd child without reading its piped stdout/stderr can deadlock for commands with large output. Same applies to `downloadTemplate`'s `exec('git fetch origin')` which can produce substantial progress output on stderr that is never drained while only 'exit'/'error' are awaited.","fix":"Use spawn with stdio configured (or read/ignore the streams) for commands that may emit large output, or pass maxBuffer and ensure streams are consumed.","locations":[{"ref":"cli/src/api/new.ts:158-168","code":"  158 | async function checkGitCommand(): Promise<boolean> {\n  159 |   return new Promise<boolean>((resolve) => {\n  160 |     const cp = exec('git --version')\n  161 |     cp.on('error', () => {\n  162 |       resolve(false)\n  163 |     })\n  164 |     cp.on('exit', (code) => {\n  165 |       resolve(code === 0)\n  166 |     })\n  167 |   })\n  168 | }","lines":11,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/cli/src/api/new.ts#L158-L168"},{"ref":"cli/src/api/new.ts:189-203","code":"  189 |       await new Promise<void>((resolve, reject) => {\n  190 |         const cp = exec('git fetch origin', { cwd: templatePath })\n  191 |         cp.on('error', reject)\n  192 |         cp.on('exit', (code) => {\n  193 |           if (code === 0) {\n  194 |             resolve()\n  195 |           } else {\n  196 |             reject(\n  197 |               new Error(\n  198 |                 `Failed to fetch latest changes, git process exited with code ${code}`,\n  199 |               ),\n  200 |             )\n  201 |           }\n  202 |         })\n  203 |       })","lines":15,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/cli/src/api/new.ts#L189-L203"}]},
{"id":"API_7","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`JsObject::add_finalizer` uses `Box::leak` to allocate the `(native, finalize_cb, ptr::null_mut())` wrap_context and the `finalize_hint` box, relying on `finalize_callback` to reconstruct and drop them via `Box::from_raw`. If `napi_add_finalizer` returns an error (propagated by `?`), both leaked Boxes (the wrap_context and the finalize_hint) are permanently leaked because the finalizer that would free them is never registered. Memory leak on the error path.","fix":"On the error path of `napi_add_finalizer`, reconstruct and drop both Boxes (`Box::from_raw`) before returning the error, instead of using `Box::leak` which strands them on failure.","locations":[{"ref":"crates/napi/src/js_values/object.rs:55-87","code":"   55 |   pub fn add_finalizer<T, Hint, F>(\n   56 |     &mut self,\n   57 |     native: T,\n   58 |     finalize_hint: Hint,\n   59 |     finalize_cb: F,\n   60 |   ) -> Result<()>\n   61 |   where\n   62 |     T: 'static,\n   63 |     Hint: 'static,\n   64 |     F: FnOnce(FinalizeContext<T, Hint>) + 'static,\n   65 |   {\n   66 |     let mut maybe_ref = ptr::null_mut();\n   67 |     let wrap_context = Box::leak(Box::new((native, finalize_cb, ptr::null_mut())));\n   68 |     check_status!(unsafe {\n   69 |       sys::napi_add_finalizer(\n   70 |         self.0.env,\n   71 |         self.0.value,\n   72 |         wrap_context as *mut _ as *mut c_void,\n   73 |         Some(\n   74 |           finalize_callback::<T, Hint, F>\n   75 |             as unsafe extern \"C\" fn(\n   76 |               env: sys::napi_env,\n   77 |               finalize_data: *mut c_void,\n   78 |               finalize_hint: *mut c_void,\n   79 |             ),\n   80 |         ),\n   81 |         Box::leak(Box::new(finalize_hint)) as *mut _ as *mut c_void,\n   82 |         &mut maybe_ref, // Note: this does not point to the boxed one…\n   83 |       )\n   84 |     })?;\n   85 |     wrap_context.2 = maybe_ref;\n   86 |     Ok(())\n   87 |   }","lines":33,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/js_values/object.rs#L55-L87"}]},
{"id":"API_8","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`UnknownRef::unref` calls `napi_reference_unref` with `&mut 0` (a temporary) for the out ref-count, ignoring whether the count reached zero, then unconditionally `napi_delete_reference`. Deleting the reference regardless of remaining count is intended here (the type owns one ref), but discarding the count via `&mut 0` to a temporary is a code smell repeated in `Ref::unref` and `SymbolRef`. More notably, `SymbolRef::unref` (symbol.rs:89) only deletes the reference and never calls `napi_reference_unref` first, inconsistent with `UnknownRef::unref` and `Ref::unref` which unref then delete. The inconsistency suggests one of them is wrong about the intended refcount handling.","fix":"Make the unref/delete sequence consistent across `UnknownRef`, `SymbolRef`, and `Ref`. If a single owned ref-count is the model, `napi_delete_reference` alone suffices (it drops the strong count); the extra `napi_reference_unref` in two of three impls is either redundant or the symbol impl is missing it. Pick one and apply uniformly.","locations":[{"ref":"crates/napi/src/js_values/unknown.rs:131-142","code":"  131 |   pub fn unref(mut self, env: &Env) -> Result<()> {\n  132 |     check_status!(\n  133 |       unsafe { sys::napi_reference_unref(env.0, self.inner, &mut 0) },\n  134 |       \"unref Ref failed\"\n  135 |     )?;\n  136 |     check_status!(\n  137 |       unsafe { sys::napi_delete_reference(env.0, self.inner) },\n  138 |       \"delete Ref failed\"\n  139 |     )?;\n  140 |     self.inner = ptr::null_mut();\n  141 |     Ok(())\n  142 |   }","lines":12,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/js_values/unknown.rs#L131-L142"},{"ref":"crates/napi/src/js_values/symbol.rs:89-96","code":"   89 |   pub fn unref(mut self, env: &Env) -> Result<()> {\n   90 |     check_status!(\n   91 |       unsafe { sys::napi_delete_reference(env.0, self.inner) },\n   92 |       \"delete Ref failed\"\n   93 |     )?;\n   94 |     self.inner = ptr::null_mut();\n   95 |     Ok(())\n   96 |   }","lines":8,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/js_values/symbol.rs#L89-L96"},{"ref":"crates/napi/src/js_values/value_ref.rs:33-45","code":"   33 |   pub fn unref(&mut self, env: &Env) -> Result<()> {\n   34 |     check_status!(\n   35 |       unsafe { sys::napi_reference_unref(env.0, self.raw_ref, &mut 0) },\n   36 |       \"unref Ref failed\"\n   37 |     )?;\n   38 | \n   39 |     check_status!(\n   40 |       unsafe { sys::napi_delete_reference(env.0, self.raw_ref) },\n   41 |       \"delete Ref failed\"\n   42 |     )?;\n   43 |     self.taken = true;\n   44 |     Ok(())\n   45 |   }","lines":13,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/js_values/value_ref.rs#L33-L45"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`get_napi_version` walks the JS object graph on every call: it fetches the\nglobal object, then `process`, then `process.versions`, then parses\n`process.versions.napi` from a String. This is an expensive path (multiple\nN-API calls + string allocation + parse) for what is effectively a constant for\nthe lifetime of the process. There is also a dedicated N-API\n`napi_get_version` that returns the supported version directly without touching\nJS, which would be far cheaper and not subject to `process` being shimmed.","fix":"Use `sys::napi_get_version` to read the N-API version directly, or cache the parsed value. Note `napi_get_version` returns the highest N-API version supported which matches `process.versions.napi`.","locations":[{"ref":"crates/napi/src/env.rs:1097-1105","code":" 1097 |   pub fn get_napi_version(&self) -> Result<u32> {\n 1098 |     let global = self.get_global()?;\n 1099 |     let process: Object = global.get_named_property(\"process\")?;\n 1100 |     let versions: Object = process.get_named_property(\"versions\")?;\n 1101 |     let napi_version: String = versions.get_named_property(\"napi\")?;\n 1102 |     napi_version\n 1103 |       .parse()\n 1104 |       .map_err(|e| Error::new(Status::InvalidArg, format!(\"{e}\")))\n 1105 |   }","lines":9,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/env.rs#L1097-L1105"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`KNOWN_TYPES` is built with ~15 separate `map.extend([...])` calls, but more\nnotably `handle_known_type`'s `Either` branch does an O(n^2) dedup with\n`Vec::contains` inside a `fold`:\n\n    let union_args = args.fold(vec![], |mut acc, cur| {\n      if !acc.contains(&cur) { acc.push(cur); }\n      acc\n    });\n\nFor the larger `EitherN` (up to `Either26`) this is quadratic in the number of\narguments. This is build-time only and N is small, so impact is negligible, but\nworth noting alongside the repeated `format!`/`clone` allocations in\n`process_generic_arguments` and `gen_ts_func_args` where strings are rebuilt per\nargument.","fix":"Acceptable as-is given small N; if desired, dedup via a small `IndexSet`/`HashSet`-backed pass to make it linear.","locations":[{"ref":"crates/backend/src/typegen.rs:640-652","code":"  640 |   if rust_ty.starts_with(\"Either\") {\n  641 |     let union_args = args.fold(vec![], |mut acc, cur| {\n  642 |       if !acc.contains(&cur) {\n  643 |         acc.push(cur);\n  644 |       }\n  645 |       acc\n  646 |     });\n  647 |     // EitherN has the same ts types, like Either<f64, u32> -> number\n  648 |     if union_args.len() == 1 {\n  649 |       Some((union_args[0].to_owned(), false))\n  650 |     } else {\n  651 |       Some((fill_ty(known_ty, union_args), false))\n  652 |     }","lines":13,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/backend/src/typegen.rs#L640-L652"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In `napi_fn_from_decl` the per-argument callback lookup builds the argument type string with `p.ty.to_token_stream().to_string()` and then does a HashMap lookup keyed by that string, for every argument of every function. Stringifying token streams per arg is allocation-heavy and is the kind of work multiplied across a large codebase's macro expansions. Same stringify-as-key pattern is used to build `callback_traits` in `extract_fn_closure_generics`.","fix":"This is inherent to matching where-clause bounds to args by spelling; acceptable, but could be reduced by interning or comparing idents directly when the bound is a single type param. Low priority.","locations":[{"ref":"crates/macro/src/parser/mod.rs:606-607","code":"  606 |         let ty_str = p.ty.to_token_stream().to_string();\n  607 |         if let Some(path_arguments) = callback_traits.get(&ty_str) {","lines":2,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/macro/src/parser/mod.rs#L606-L607"},{"ref":"crates/macro/src/parser/mod.rs:502-504","code":"  502 |                       map.insert(\n  503 |                         bounded_ty.to_token_stream().to_string(),\n  504 |                         segment.arguments.clone(),","lines":3,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/macro/src/parser/mod.rs#L502-L504"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`From<Buffer> for Vec<u8>` does `buf.as_ref().to_vec()`, always copying the bytes, even though when\n`Buffer` was created from a `Vec<u8>` (`raw == None`) it already owns a heap allocation with\n`inner`/`len`/`capacity` that could be moved out via `Vec::from_raw_parts` + `mem::forget` without\ncopying. On the hot path of returning buffer data back to Rust this forces an extra allocation+copy.","fix":"When `buf.raw.is_none()`, reconstruct and move the owned Vec (`Vec::from_raw_parts(inner, len,\ncapacity)` + `mem::forget(buf)`) instead of copying; only copy when the data is JS-owned (`raw`\nis Some).","locations":[{"ref":"crates/napi/src/bindgen_runtime/js_values/buffer.rs:535-539","code":"  535 | impl From<Buffer> for Vec<u8> {\n  536 |   fn from(buf: Buffer) -> Self {\n  537 |     buf.as_ref().to_vec()\n  538 |   }\n  539 | }","lines":5,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/js_values/buffer.rs#L535-L539"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`wait_first_thread_registered` busy-spins with `spin_loop()` on `FIRST_MODULE_REGISTERED` with no yield or backoff. If the first module's registration is slow (large export table, blocking work in a register hook), every other thread burns a full core spinning. SeqCst load in a tight loop also adds memory-bus traffic.","fix":"Use a `std::sync::Once`/`Condvar`/park-based wait, or at least `std::thread::yield_now()` with exponential backoff after a few spins.","locations":[{"ref":"crates/napi/src/bindgen_runtime/module_register.rs:211-217","code":"  211 | #[cfg(not(feature = \"noop\"))]\n  212 | #[inline]\n  213 | fn wait_first_thread_registered() {\n  214 |   while !FIRST_MODULE_REGISTERED.load(Ordering::SeqCst) {\n  215 |     std::hint::spin_loop();\n  216 |   }\n  217 | }","lines":7,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/module_register.rs#L211-L217"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`JsStringLatin1::take` clones via `self.as_slice().to_vec()` even though `self` is taken by value. For the native non-copied case `buf` points into `_inner_buf` (which is empty `vec![]`) or external memory, so a copy is needed there, but for the WASM/owned case `_inner_buf` already owns the bytes and could be moved. More importantly the data-source asymmetry means `take()`/`From<_> for Vec<u8>` always copy.","fix":"Where `_inner_buf` owns the data (WASM / from_data path), move it out instead of copying. At minimum document that this always copies for external strings.","locations":[{"ref":"crates/napi/src/js_values/string/latin1.rs:409-411","code":"  409 |   pub fn take(self) -> Vec<u8> {\n  410 |     self.as_slice().to_vec()\n  411 |   }","lines":3,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/js_values/string/latin1.rs#L409-L411"},{"ref":"crates/napi/src/js_values/string/utf16.rs:444-448","code":"  444 | impl From<JsStringUtf16<'_>> for Vec<u16> {\n  445 |   fn from(value: JsStringUtf16) -> Self {\n  446 |     value.as_slice().to_vec()\n  447 |   }\n  448 | }","lines":5,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/js_values/string/utf16.rs#L444-L448"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`JsStringUtf8::into_owned` does `String::from_utf8_unchecked(self.buf.to_vec())` - it clones the buffer into a new Vec even though `self` is consumed by value and already owns `self.buf`. The copy is unnecessary; the owned Vec can be moved directly. Same wasteful `.to_vec()` in `take()` which also clones a buffer it owns by value.","fix":"Use `String::from_utf8_unchecked(self.buf)` and `self.buf` directly (move out of `self`) instead of `self.buf.to_vec()`.","locations":[{"ref":"crates/napi/src/js_values/string/utf8.rs:29-35","code":"   29 |   pub fn into_owned(self) -> Result<String> {\n   30 |     Ok(unsafe { String::from_utf8_unchecked(self.buf.to_vec()) })\n   31 |   }\n   32 | \n   33 |   pub fn take(self) -> Vec<u8> {\n   34 |     self.buf.to_vec()\n   35 |   }","lines":7,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/js_values/string/utf8.rs#L29-L35"}]},
{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`Status::Display` and `ValueType::Display` allocate a `String` via\n`format!(\"{self:?}\")` just to write it, on every Display call. Since both\nalready have an `as_ref()`/Debug-derived name, Display could write the static\nstr directly without allocating.","fix":"For Status, `write!(f, \"{}\", self.as_ref())`. For ValueType, write the variant name directly with `f.write_str(...)` instead of allocating a String.","locations":[{"ref":"crates/napi/src/status.rs:36-41","code":"   36 | impl Display for Status {\n   37 |   fn fmt(&self, f: &mut Formatter<'_>) -> Result {\n   38 |     let status_string = format!(\"{self:?}\");\n   39 |     write!(f, \"{status_string}\")\n   40 |   }\n   41 | }","lines":6,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/status.rs#L36-L41"},{"ref":"crates/napi/src/value_type.rs:22-27","code":"   22 | impl Display for ValueType {\n   23 |   fn fmt(&self, f: &mut Formatter<'_>) -> Result {\n   24 |     let status_string = format!(\"{self:?}\");\n   25 |     write!(f, \"{status_string}\")\n   26 |   }\n   27 | }","lines":6,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/value_type.rs#L22-L27"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`unescape_unicode` contains a duplicated `if i == 0 { return None; }` block back-to-back. The second copy is unreachable/dead because the first already returned for the `i == 0` case in the same branch.","fix":"Delete the duplicated `if i == 0 { return None; }` (lines 464-466).","locations":[{"ref":"crates/macro/src/parser/mod.rs:459-466","code":"  459 |       _ => {\n  460 |         if i == 0 {\n  461 |           return None;\n  462 |         }\n  463 | \n  464 |         if i == 0 {\n  465 |           return None;\n  466 |         }","lines":8,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/macro/src/parser/mod.rs#L459-L466"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"`GenerateTypeDefOptions` declares a top-level `dtsHeaderFile?: string` field (line 1051) that is never read by `generateTypeDef`; the function only consults `configDtsHeaderFile`, `dtsHeader`, and `configDtsHeader`. The `dtsHeaderFile` option is dead and misleading to API consumers who may set it expecting it to take effect.","fix":"Either honor `options.dtsHeaderFile` in the header resolution, or remove the unused field from the interface.","locations":[{"ref":"cli/src/api/build.ts:2571-2581","code":" 2571 | export interface GenerateTypeDefOptions {\n 2572 |   typeDefDir: string\n 2573 |   noDtsHeader?: boolean\n 2574 |   dtsHeader?: string\n 2575 |   dtsHeaderFile?: string\n 2576 |   configDtsHeader?: string\n 2577 |   configDtsHeaderFile?: string\n 2578 |   constEnum?: boolean\n 2579 |   runtimeStringEnum?: boolean\n 2580 |   cwd: string\n 2581 | }","lines":11,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/cli/src/api/build.ts#L2571-L2581"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"`handle_async_block_type` takes a `rust_ty: String` parameter used only in the\n`else` (no-arg) branch as a passthrough fallback, and `handle_reference_type`\ntakes `rust_ty: String` for the same fallback. These by-value `String`\nparameters force a clone of `rust_ty` at the call site (`handle_type_path` passes\n`rust_ty` which is later still referenced), even on the common path where the\nargument exists and `rust_ty` is unused. Minor: the by-value String is only\nneeded on the rare fallback branch.","fix":"Take `rust_ty: &str` and only allocate (`.to_owned()`) in the fallback branch that actually needs an owned String.","locations":[{"ref":"crates/backend/src/typegen.rs:557-583","code":"  557 | /// Handles conversion of Reference<T> and WeakReference<T>\n  558 | fn handle_reference_type(args: &[(String, bool)], rust_ty: String) -> Option<(String, bool)> {\n  559 |   r#struct::TASK_STRUCTS.with(|t| {\n  560 |     // Reference<T> => T\n  561 |     if let Some(arg) = args.first() {\n  562 |       let (output_type, _) = arg.to_owned();\n  563 |       if let Some(o) = t.borrow().get(&output_type) {\n  564 |         Some((o.to_owned(), false))\n  565 |       } else {\n  566 |         Some((output_type, false))\n  567 |       }\n  568 |     } else {\n  569 |       // Not NAPI-RS `Reference`\n  570 |       Some((rust_ty, false))\n  571 |     }\n  572 |   })\n  573 | }\n  574 | \n  575 | /// Handles conversion of AsyncBlock<T> to Promise<T>\n  576 | fn handle_async_block_type(args: &[(String, bool)], rust_ty: String) -> Option<(String, bool)> {\n  577 |   if let Some(arg) = args.first() {\n  578 |     Some((format!(\"Promise<{}>\", arg.0), false))\n  579 |   } else {\n  580 |     // Not NAPI-RS `AsyncBlock`\n  581 |     Some((rust_ty, false))\n  582 |   }\n  583 | }","lines":27,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/backend/src/typegen.rs#L557-L583"},{"ref":"crates/backend/src/typegen.rs:810-812","code":"  810 |     } else if rust_ty == \"Reference\" || rust_ty == \"WeakReference\" {\n  811 |       handle_reference_type(&args, rust_ty)\n  812 |     } else if rust_ty == \"AsyncBlock\" {","lines":3,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/backend/src/typegen.rs#L810-L812"}]},
{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"In `setup_iterator_class` and `create_async_iterator`/`symbol_async_generator`/sync `create_iterator`, a `generator_state` boolean is created via `napi_get_boolean(env, false, ...)` but in `symbol_async_generator` (line 221-226) and `setup_iterator_class` is never used afterward (no property is set from it in those spots), making the napi call and variable dead work.","fix":"Remove the unused `generator_state` creation in `symbol_async_generator`.","locations":[{"ref":"crates/napi/src/bindgen_runtime/async_iterator.rs:224-229","code":"  224 |   let mut generator_state = ptr::null_mut();\n  225 |   check_status_or_throw!(\n  226 |     env,\n  227 |     unsafe { sys::napi_get_boolean(env, false, &mut generator_state) },\n  228 |     \"Create generator state failed\"\n  229 |   );","lines":6,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/async_iterator.rs#L224-L229"}]},
{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"`JsDataViewValue` field `_data` and `JsTypedArrayValue` field `data` are stored from napi_get_*_info but `_data` is never read (underscore-prefixed). For `JsTypedArrayValue` the `data` field IS used by the as_ref macro, but `JsDataViewValue` exposes no accessor to its underlying bytes at all - the `_data` pointer and the arraybuffer/offset/length are stored but there is no method to read the DataView contents, making `JsDataViewValue` close to useless as a value wrapper.","fix":"Either add accessors (as_ref/as_slice) to JsDataViewValue using `_data`+`length`, or remove the dead field. Confirm intended public surface for this deprecated type.","locations":[{"ref":"crates/napi/src/js_values/arraybuffer.rs:125-130","code":"  125 | pub struct JsDataViewValue {\n  126 |   pub arraybuffer: JsArrayBuffer,\n  127 |   _data: *mut c_void,\n  128 |   pub byte_offset: u64,\n  129 |   pub length: u64,\n  130 | }","lines":6,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/js_values/arraybuffer.rs#L125-L130"},{"ref":"crates/napi/src/js_values/arraybuffer.rs:339-363","code":"  339 | impl JsDataView {\n  340 |   pub fn into_value(self) -> Result<JsDataViewValue> {\n  341 |     let mut length = 0u64;\n  342 |     let mut byte_offset = 0u64;\n  343 |     let mut arraybuffer_value = ptr::null_mut();\n  344 |     let mut data = ptr::null_mut();\n  345 | \n  346 |     check_status!(unsafe {\n  347 |       sys::napi_get_dataview_info(\n  348 |         self.0.env,\n  349 |         self.0.value,\n  350 |         &mut length as *mut u64 as *mut _,\n  351 |         &mut data,\n  352 |         &mut arraybuffer_value,\n  353 |         &mut byte_offset as *mut u64 as *mut _,\n  354 |       )\n  355 |     })?;\n  356 |     Ok(JsDataViewValue {\n  357 |       arraybuffer: unsafe { JsArrayBuffer::from_raw_unchecked(self.0.env, arraybuffer_value) },\n  358 |       byte_offset,\n  359 |       length,\n  360 |       _data: data,\n  361 |     })\n  362 |   }\n  363 | }","lines":25,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/js_values/arraybuffer.rs#L339-L363"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The comment on the `is_function_with_lifetime` override claims a specific\nargument layout but the code comment text is stale/misleading relative to what\nthe surrounding code actually does. The comment says \"if Type is Function,\nfirst argument is lifetime and second is params, third is return type\" and then\nsets `is_return_type = index != 1`. With a leading lifetime the args are\n(lifetime@0, params@1, return@2); `index != 1` is true for both index 0 and\nindex 2. Index 0 is the lifetime, which is handled by the separate\n`Lifetime(_)` arm and never reaches this `Type` arm, so the effective result is\ncorrect - but the comment's phrasing (\"third is return type\") obscures that\n`index != 1` also matches index 0, making the invariant non-obvious and easy for\na future reader to break.","fix":"Reword the comment to state the actual invariant: for fn-like types with a leading lifetime, index 1 is the params slot and every other Type arg is treated as a return-type slot (only index 2 occurs in practice).","locations":[{"ref":"crates/backend/src/typegen.rs:716-721","code":"  716 |           // if Type is Function, first argument is lifetime and second is params, third is return type\n  717 |           // so we need to judge is_function_with_lifetime and set is_return_type\n  718 |           // if not and just keep the origin's logic\n  719 |           if is_function_with_lifetime {\n  720 |             is_return_type = index != 1;\n  721 |           }","lines":6,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/backend/src/typegen.rs#L716-L721"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"The `BUILT_FLAG` doc comment in expand/napi.rs describes a `compare_exchange(false, true, Acquire, Relaxed)` pattern whose `if ... .is_ok()` body is the first-expansion logic. The actual code at lines 22-27 nests `if !built` inside the `Ok(built)` arm, but `compare_exchange` returns `Ok` only when the prior value equalled `false`, so `built` is always `false` in that arm and the inner `if !built` is always true (dead guard). The comment shows the simpler/correct intended form; the code has a redundant always-true check.","fix":"Drop the inner `if !built` (it is always true on the success arm), matching the documented pattern: `if BUILT_FLAG.compare_exchange(...).is_ok() { typedef::prepare_type_def_file(); }`.","locations":[{"ref":"crates/macro/src/expand/napi.rs:9-27","code":"    9 | /// a flag indicate whether or never at least one `napi` macro has been expanded.\n   10 | /// ```ignore\n   11 | /// if BUILT_FLAG\n   12 | ///  .compare_exchange(false, true, Ordering::Acquire, Ordering::Relaxed)\n   13 | ///  .is_ok() {\n   14 | ///   // logic on first macro expansion\n   15 | /// }\n   16 | ///\n   17 | /// ```\n   18 | static BUILT_FLAG: AtomicBool = AtomicBool::new(false);\n   19 | \n   20 | pub fn expand(attr: TokenStream, input: TokenStream) -> BindgenResult<TokenStream> {\n   21 |   // logic on first macro expansion\n   22 |   if let Ok(built) = BUILT_FLAG.compare_exchange(false, true, Ordering::Acquire, Ordering::Relaxed)\n   23 |   {\n   24 |     if !built {\n   25 |       typedef::prepare_type_def_file();\n   26 |     }\n   27 |   }","lines":19,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/macro/src/expand/napi.rs#L9-L27"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The doctest/example for `ThreadsafeFunction` is broken and misleading. The\nfunction signature takes `callback: Arc<ThreadsafeFunction<...>>` but the body\nreferences an undefined variable `tsfn` (not `callback`), calls\n`tsfn.call(Ok((1, false, ...)), ...)` then later `tsfn.call((3, false, ...))`\nwith inconsistent argument shapes (one wraps in `Ok`, one does not), declares an\nunused `let output: Vec<u32>`, and imports `ThreadsafeFunctionReleaseMode`\nwithout using it. It also names the type `ThreadSafeCallContext` in the use\nblock. This will not compile and confuses users about the actual API.","fix":"Rewrite the example so it compiles: bind the parameter to `tsfn`, clone it correctly, use a single consistent `call(Ok(...), mode)` signature, and remove the unused imports/locals. Mark it `ignore` or `no_run` if it cannot be fully compiled in doctest context.","locations":[{"ref":"crates/napi/src/threadsafe_function.rs:161-187","code":"  161 | /// ```rust\n  162 | /// use std::thread;\n  163 | /// use std::sync::Arc;\n  164 | ///\n  165 | /// use napi::{\n  166 | ///     threadsafe_function::{\n  167 | ///         ThreadSafeCallContext, ThreadsafeFunctionCallMode, ThreadsafeFunctionReleaseMode,\n  168 | ///     },\n  169 | /// };\n  170 | /// use napi_derive::napi;\n  171 | ///\n  172 | /// #[napi]\n  173 | /// pub fn call_threadsafe_function(callback: Arc<ThreadsafeFunction<(u32, bool, String), ()>>) {\n  174 | ///   let tsfn_cloned = tsfn.clone();\n  175 | ///\n  176 | ///   thread::spawn(move || {\n  177 | ///       let output: Vec<u32> = vec![0, 1, 2, 3];\n  178 | ///       // It's okay to call a threadsafe function multiple times.\n  179 | ///       tsfn.call(Ok((1, false, \"NAPI-RS\".into())), ThreadsafeFunctionCallMode::Blocking);\n  180 | ///       tsfn.call(Ok((2, true, \"NAPI-RS\".into())), ThreadsafeFunctionCallMode::NonBlocking);\n  181 | ///   });\n  182 | ///\n  183 | ///   thread::spawn(move || {\n  184 | ///       tsfn_cloned.call((3, false, \"NAPI-RS\".into())), ThreadsafeFunctionCallMode::NonBlocking);\n  185 | ///   });\n  186 | /// }\n  187 | /// ```","lines":27,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/threadsafe_function.rs#L161-L187"}]},

{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"Comment in attrs.rs states `// some of them may useless in #[napi] macro` (grammar) and the `attrgen!` table is annotated `// NOTE: borrowed from wasm-bindgen`. The leftover wasm-bindgen provenance leaks into user-facing error messages elsewhere (see the #[wasm_bindgen] enum messages finding). Noting the source comment as the root cause of those stale messages.","fix":"Audit all borrowed messages/strings for wasm-bindgen references after porting; fix grammar of the note.","locations":[{"ref":"crates/macro/src/parser/attrs.rs:48-49","code":"   48 | // NOTE: borrowed from wasm-bindgen\n   49 | // some of them may useless in #[napi] macro","lines":2,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/macro/src/parser/attrs.rs#L48-L49"}]},
