<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`CallbackInfo::get_arg` indexes `self.args[index]` directly. `args` is a fixed `[napi_value; N]` where `N` is the declared arg count, but `napi_get_cb_info` only fills as many slots as JS actually passed (the rest stay null) and `index` comes from generated call sites. With `required_argc` set to `Some(N)` callers are protected, but `get_arg` is `pub` and any path that constructs `CallbackInfo` with `required_argc = None` (optional/variadic args) and then reads `get_arg(i)` for `i >= N` will panic with an out-of-bounds index. The bounds are not validated against the declared array length here.","fix":"Use `self.args.get(index).copied().unwrap_or(ptr::null_mut())` so an out-of-range index yields a JS `undefined`-equivalent null rather than panicking across the FFI boundary.","locations":[{"ref":"crates/napi/src/bindgen_runtime/callback_info.rs:79-81","code":"   79 |   pub fn get_arg(&self, index: usize) -> sys::napi_value {\n   80 |     self.args[index]\n   81 |   }","lines":3,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/callback_info.rs#L79-L81"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`handle_threadsafe_function_type` unwraps the result of building the `fn_args`\nstring:\n\n    let fn_args = args\n      .get(2)\n      .or_else(|| args.first())\n      .map(|(arg, _)| { ... })\n      .unwrap();\n\nIf `args` is empty (a `ThreadsafeFunction` path whose generic arguments were all\nfiltered out by `process_generic_arguments`, e.g. only lifetimes), both\n`args.get(2)` and `args.first()` are `None` and the `.unwrap()` panics, breaking\nthe build. ThreadsafeFunction signatures with unusual generic forms are exactly\nthe kind of input that reaches here.","fix":"Provide a default when no args exist, e.g. fall back to `\"arg: unknown\".to_owned()` instead of unwrapping.","locations":[{"ref":"crates/backend/src/typegen.rs:586-606","code":"  586 | fn handle_threadsafe_function_type(args: &[(String, bool)]) -> Option<(String, bool)> {\n  587 |   let handled_tsfn = match args.get(4) {\n  588 |     Some((arg, _)) => arg == \"true\",\n  589 |     _ => true,\n  590 |   };\n  591 | \n  592 |   let fn_args = args\n  593 |     .get(2)\n  594 |     .or_else(|| args.first())\n  595 |     .map(|(arg, _)| {\n  596 |       // If the argument is just a type without parameter names (e.g., \"string\"),\n  597 |       // we need to add a parameter name for function signatures\n  598 |       if arg.contains(':') || arg.is_empty() {\n  599 |         // Already has parameter names or is empty\n  600 |         arg.clone()\n  601 |       } else {\n  602 |         // Single type without parameter name, add one\n  603 |         format!(\"arg: {arg}\")\n  604 |       }\n  605 |     })\n  606 |     .unwrap();","lines":21,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/backend/src/typegen.rs#L586-L606"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`handle_type_path` calls `.unwrap()` on `args.first()` for `Result` (when it is\na return type) and for `FnArgs`:\n\n    if rust_ty == \"Result\" && is_return_ty {\n      Some(args.first().unwrap().to_owned())\n    } ...\n    } else if rust_ty == \"FnArgs\" {\n      is_passthrough_type = true;\n      Some(args.first().unwrap().to_owned())\n    }\n\n`args` comes from `process_generic_arguments`, which only collects entries for\ngeneric arguments it recognizes (Type / const-bool / etc.). A `Result` or\n`FnArgs` path whose generic argument list is empty, or contains only arguments\nthat `process_generic_arguments` filters out (e.g. only a lifetime), yields an\nempty `args`, and the `.unwrap()` panics, aborting the build with no useful\ndiagnostic. A bare `Result` (no angle brackets) hits the same path.","fix":"Replace `.unwrap()` with a graceful fallback, e.g. `args.first().cloned().unwrap_or_else(|| (\"any\".to_owned(), false))`.","locations":[{"ref":"crates/backend/src/typegen.rs:804-816","code":"  804 |     if rust_ty == \"Result\" && is_return_ty {\n  805 |       Some(args.first().unwrap().to_owned())\n  806 |     } else if rust_ty == \"Option\" {\n  807 |       handle_option_type(&args, is_struct_field, is_return_ty)\n  808 |     } else if rust_ty == \"AsyncTask\" {\n  809 |       handle_async_task_type(&args)\n  810 |     } else if rust_ty == \"Reference\" || rust_ty == \"WeakReference\" {\n  811 |       handle_reference_type(&args, rust_ty)\n  812 |     } else if rust_ty == \"AsyncBlock\" {\n  813 |       handle_async_block_type(&args, rust_ty)\n  814 |     } else if rust_ty == \"FnArgs\" {\n  815 |       is_passthrough_type = true;\n  816 |       Some(args.first().unwrap().to_owned())","lines":13,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/backend/src/typegen.rs#L804-L816"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`extract_result_ty` calls `path.segments.last().unwrap()` on an arbitrary user type path, and `args.first().unwrap()` on the angle-bracketed args of a `Result`. A path can technically be empty, and `Result<>` with zero generic args (e.g. a user type alias `type Result = ...;` used bare, or `Result` with empty `<>`) would make `args.first()` return None and panic. Proc-macro parsing of user types should bail with a span error, not unwrap.","fix":"Replace `path.segments.last().unwrap()` with a match that `bail_span!`s on an empty path, and replace `args.first().unwrap()` with a check that `bail_span!`s when `Result` has no type argument.","locations":[{"ref":"crates/macro/src/parser/mod.rs:334-359","code":"  334 | fn extract_result_ty(ty: &syn::Type) -> BindgenResult<Option<syn::Type>> {\n  335 |   match ty {\n  336 |     syn::Type::Path(syn::TypePath { qself: None, path }) => {\n  337 |       let segment = path.segments.last().unwrap();\n  338 |       if segment.ident != \"Result\" {\n  339 |         Ok(None)\n  340 |       } else {\n  341 |         match &segment.arguments {\n  342 |           syn::PathArguments::AngleBracketed(syn::AngleBracketedGenericArguments {\n  343 |             args, ..\n  344 |           }) => {\n  345 |             let ok_arg = args.first().unwrap();\n  346 |             match ok_arg {\n  347 |               syn::GenericArgument::Type(ty) => Ok(Some(ty.clone())),\n  348 |               _ => bail_span!(ok_arg, \"unsupported generic type\"),\n  349 |             }\n  350 |           }\n  351 |           _ => {\n  352 |             bail_span!(segment, \"unsupported generic type\")\n  353 |           }\n  354 |         }\n  355 |       }\n  356 |     }\n  357 |     _ => Ok(None),\n  358 |   }\n  359 | }","lines":26,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/macro/src/parser/mod.rs#L334-L359"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`BigInt::from_napi_value` calls `words.set_len(word_count)` after `napi_get_value_bigint_words`,\nrelying on the second call writing exactly `word_count` words into the `Vec` reserved with\n`Vec::with_capacity(word_count)`. If the Node-API implementation writes fewer words than the\nrequested `word_count` (the API may clamp/return a different count), `set_len(word_count)` exposes\nuninitialized memory as initialized `u64`s. More directly, `get_u64`/`get_i64`/`get_i128`/`get_u128`\nindex `self.words[0]` and `self.words[1]` without bounds checks; while `from_napi_value` pushes\n`vec![0]` when `word_count == 0`, a `BigInt` constructed directly by a user with an empty `words`\nvec will panic on `self.words[0]` in `get_u64`/`get_i64`. These accessors are public API.","fix":"Use `words.get(0).copied().unwrap_or(0)` (and same for index 1) in the accessors so an empty\n`words` vec cannot panic. In `from_napi_value`, `set_len` to the count actually returned by the\nsecond call rather than assuming it equals the first `word_count`.","locations":[{"ref":"crates/napi/src/bindgen_runtime/js_values/bigint.rs:66-87","code":"   66 |     let mut words: Vec<u64> = Vec::with_capacity(word_count);\n   67 |     let mut sign_bit = 0;\n   68 | \n   69 |     unsafe {\n   70 |       check_status!(sys::napi_get_value_bigint_words(\n   71 |         env,\n   72 |         napi_val,\n   73 |         &mut sign_bit,\n   74 |         &mut word_count,\n   75 |         words.as_mut_ptr(),\n   76 |       ))?;\n   77 | \n   78 |       words.set_len(word_count);\n   79 |     }\n   80 |     if word_count == 0 {\n   81 |       words = vec![0];\n   82 |     }\n   83 |     Ok(BigInt {\n   84 |       sign_bit: sign_bit == 1,\n   85 |       words,\n   86 |     })\n   87 |   }","lines":22,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/js_values/bigint.rs#L66-L87"},{"ref":"crates/napi/src/bindgen_runtime/js_values/bigint.rs:95-152","code":"   95 |   pub fn get_u64(&self) -> (bool, u64, bool) {\n   96 |     (\n   97 |       self.sign_bit,\n   98 |       self.words[0],\n   99 |       !self.sign_bit && self.words.len() == 1,\n  100 |     )\n  101 |   }\n  102 | \n  103 |   /// (value, lossless)\n  104 |   /// get the first word of the BigInt as `i64` with the sign applied\n  105 |   /// return true if the value is lossless\n  106 |   /// or the value is truncated\n  107 |   pub fn get_i64(&self) -> (i64, bool) {\n  108 |     if self.sign_bit && self.words[0] == i64::MIN.unsigned_abs() {\n  109 |       return (i64::MIN, self.words.len() == 1);\n  110 |     }\n  111 |     (\n  112 |       self.words[0] as i64 * if self.sign_bit { -1 } else { 1 },\n  113 |       self.words.len() == 1 && self.words[0] as i64 >= 0,\n  114 |     )\n  115 |   }\n  116 | \n  117 |   /// (value, lossless)\n  118 |   /// get the first two words of the BigInt as `i128` with the sign applied\n  119 |   /// return true if the value is lossless\n  120 |   /// or the value is truncated\n  121 |   pub fn get_i128(&self) -> (i128, bool) {\n  122 |     let len = self.words.len();\n  123 |     if len == 1 {\n  124 |       (\n  125 |         self.words[0] as i128 * if self.sign_bit { -1 } else { 1 },\n  126 |         true,\n  127 |       )\n  128 |     } else {\n  129 |       let val = self.words[0] as u128 + ((self.words[1] as u128) << 64);\n  130 |       if self.sign_bit && val == i128::MIN.unsigned_abs() {\n  131 |         return (i128::MIN, len > 2);\n  132 |       }\n  133 |       (\n  134 |         val as i128 * if self.sign_bit { -1 } else { 1 },\n  135 |         len == 2 && self.words[1] as i64 >= 0,\n  136 |       )\n  137 |     }\n  138 |   }\n  139 | \n  140 |   /// (signed, value, lossless)\n  141 |   /// get the first two words of the BigInt as `u128`\n  142 |   /// return true if the value is lossless\n  143 |   /// or the value is truncated\n  144 |   pub fn get_u128(&self) -> (bool, u128, bool) {\n  145 |     let len = self.words.len();\n  146 |     if len == 1 {\n  147 |       (self.sign_bit, self.words[0] as u128, true)\n  148 |     } else {\n  149 |       let val = self.words[0] as u128 + ((self.words[1] as u128) << 64);\n  150 |       (self.sign_bit, val, len == 2)\n  151 |     }\n  152 |   }","lines":58,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/js_values/bigint.rs#L95-L152"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`JsTypedArrayValue`'s `AsRef`/`AsMut` impls call `is_valid_as_ref` which `panic!`s when the typedarray's runtime element type does not match the Rust slice type requested (e.g. dereferencing a JS `Float64Array` as `&[u8]`). This panic is reachable from safe application code that received an arbitrary typed array from JS and deref'd it as the wrong type; panicking across the FFI boundary is undefined behavior unless caught.","fix":"These are deprecated APIs, but the panic is still reachable. Consider returning a Result-based accessor, or at minimum document that mismatched access aborts. If kept, ensure the panic cannot unwind across the C boundary (it is invoked from Rust-side `as_ref`, so generally caught, but mismatch is a runtime footgun).","locations":[{"ref":"crates/napi/src/js_values/arraybuffer.rs:286-322","code":"  286 | impl JsTypedArrayValue {\n  287 |   #[inline]\n  288 |   fn is_valid_as_ref(&self, dest_type: TypedArrayType) {\n  289 |     // deref `Uint8ClampedArray` as `&[u8]` is valid\n  290 |     if self.typedarray_type == TypedArrayType::Uint8Clamped && dest_type == TypedArrayType::Uint8 {\n  291 |       return;\n  292 |     }\n  293 |     if self.typedarray_type != dest_type {\n  294 |       panic!(\n  295 |         \"invalid typedarray type: expected {:?}, got {:?}\",\n  296 |         dest_type, self.typedarray_type\n  297 |       );\n  298 |     }\n  299 |   }\n  300 | }\n  301 | \n  302 | macro_rules! impl_as_ref {\n  303 |   ($ref_type:ident, $expect_type:expr) => {\n  304 |     impl AsRef<[$ref_type]> for JsTypedArrayValue {\n  305 |       fn as_ref(&self) -> &[$ref_type] {\n  306 |         self.is_valid_as_ref($expect_type);\n  307 |         if self.data.is_null() {\n  308 |           return &[];\n  309 |         }\n  310 |         unsafe { slice::from_raw_parts(self.data as *const $ref_type, self.length) }\n  311 |       }\n  312 |     }\n  313 | \n  314 |     impl AsMut<[$ref_type]> for JsTypedArrayValue {\n  315 |       fn as_mut(&mut self) -> &mut [$ref_type] {\n  316 |         self.is_valid_as_ref($expect_type);\n  317 |         if self.data.is_null() {\n  318 |           return &mut [];\n  319 |         }\n  320 |         unsafe { slice::from_raw_parts_mut(self.data as *mut $ref_type, self.length) }\n  321 |       }\n  322 |     }","lines":37,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/js_values/arraybuffer.rs#L286-L322"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`handle_generic_type` unwraps `split_once('<')`:\n\n    ty = alias.split_once('<').map(|(t, _)| t).unwrap();\n\nThis branch is only entered when `alias.contains('<')` is implied? No - it is\nentered whenever a type alias exists AND `!args.is_empty()`. The `.unwrap()`\nassumes the alias string contains a `<`. If a user registers a type alias\n(`#[napi]` `type` whose js_name has no `<`) and that aliased name is then used\nwith generic arguments, `split_once('<')` returns `None` and the `.unwrap()`\npanics. The surrounding comment even claims \"If alias contains '<'\", but the\nguard does not actually check that.","fix":"Guard the split: `ty = alias.split_once('<').map(|(t, _)| t).unwrap_or(alias.as_str());` (taking the whole alias when it has no generic brackets).","locations":[{"ref":"crates/backend/src/typegen.rs:682-688","code":"  682 |       .join(\", \");\n  683 |     let mut ty = rust_ty;\n  684 |     if let Some((alias, _)) = type_alias {\n  685 |       // If alias contains '<', take the base type as &str, then convert to String for formatting\n  686 |       ty = alias.split_once('<').map(|(t, _)| t).unwrap();\n  687 |       return Some((format!(\"{}<{}>\", ty, arg_str), false));\n  688 |     }","lines":7,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/backend/src/typegen.rs#L682-L688"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In the noop typedef expansion, `find_and_remove_napi_attr` indexes `m.path().segments[0]` directly. An attribute with an empty path segment list would panic. Other code in this crate (attrs.rs) uses `.segments.last()`/`.first()` with `map` to avoid this; this raw index is inconsistent and panic-prone.","fix":"Use `m.path().segments.first().map(|s| s.ident == \"napi\").unwrap_or(false)` (or `m.path().is_ident(\"napi\")`) instead of indexing `[0]`.","locations":[{"ref":"crates/macro/src/expand/noop.rs:24-27","code":"   24 |     let napi_attr = attrs\n   25 |       .iter()\n   26 |       .enumerate()\n   27 |       .find(|&(_, m)| m.path().segments[0].ident == \"napi\");","lines":4,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/macro/src/expand/noop.rs#L24-L27"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`fatal_error` is documented as taking ownership (`self`) and terminating the\nprocess, but the `#[allow(clippy::expect_fun_call)]` attribute is stale — the\nfunction body contains no `expect`/panic at all (it just calls\n`sys::napi_fatal_error`). The allow is dead/misleading and the doc comment\nimplies a panic-like behavior that the napi_fatal_error C call provides, not\nRust. Minor: the unused allow attribute should be removed.","fix":"Remove the stale `#[allow(clippy::expect_fun_call)]` attribute on `fatal_error`.","locations":[{"ref":"crates/napi/src/env.rs:785-801","code":"  785 |   #[allow(clippy::expect_fun_call)]\n  786 |   /// In the event of an unrecoverable error in a native module\n  787 |   ///\n  788 |   /// A fatal error can be thrown to immediately terminate the process.\n  789 |   pub fn fatal_error(self, location: &str, message: &str) {\n  790 |     let location_len = location.len();\n  791 |     let message_len = message.len();\n  792 | \n  793 |     unsafe {\n  794 |       sys::napi_fatal_error(\n  795 |         location.as_ptr().cast(),\n  796 |         location_len as isize,\n  797 |         message.as_ptr().cast(),\n  798 |         message_len as isize,\n  799 |       )\n  800 |     }\n  801 |   }","lines":17,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/env.rs#L785-L801"}]},
{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`set_instance_finalize_callback` calls `value.object.unwrap()` on the\n`TaggedObject`'s `Option<T>`. If the object was somehow already taken (None),\nthis panics inside an N-API finalizer callback, which runs during GC/teardown\nwhere unwinding across the FFI boundary is undefined behavior.","fix":"Handle the None case gracefully (skip the callback or log) instead of unwrap inside the extern \"C\" finalizer.","locations":[{"ref":"crates/napi/src/env.rs:1596-1603","code":" 1596 |   let (value, callback) = unsafe { *Box::from_raw(finalize_data as *mut (TaggedObject<T>, F)) };\n 1597 |   let hint = unsafe { *Box::from_raw(finalize_hint as *mut Hint) };\n 1598 |   let env = Env::from_raw(raw_env);\n 1599 |   callback(FinalizeContext {\n 1600 |     value: value.object.unwrap(),\n 1601 |     hint,\n 1602 |     env,\n 1603 |   });","lines":8,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/env.rs#L1596-L1603"}]},
{"id":"UAF_1","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"medium","description":"`generator_next`/`generator_return`/`generator_throw` and the async equivalents reconstruct the user generator via `Box::leak(Box::from_raw(generator_ptr as *mut T))`. `Box::from_raw` followed by `Box::leak` is sound only because the pointer is never actually freed here, but the same `generator_ptr` is the wrapped instance data; if the underlying instance was already finalized/dropped (GC of the class instance before the iterator function is invoked), `generator_ptr` dangles and `Box::from_raw` produces a reference to freed memory. For the sync iterator there is no reference keeping the instance alive (only the async path adds an `[[InstanceRef]]`), so a sync generator whose owning instance is collected mid-iteration is a use-after-free.","fix":"Mirror the async iterator fix (issue #3119): attach a strong reference to the instance on the iterator/generator object (or on the functions' data) so the wrapped Rust value cannot be finalized while iteration is in progress.","locations":[{"ref":"crates/napi/src/bindgen_runtime/iterator.rs:413","code":"  413 |     let g = unsafe { Box::leak(Box::from_raw(generator_ptr as *mut T)) };","lines":1,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/iterator.rs#L413"},{"ref":"crates/napi/src/bindgen_runtime/iterator.rs:484","code":"  484 |   let g = unsafe { Box::leak(Box::from_raw(generator_ptr as *mut T)) };","lines":1,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/iterator.rs#L484"},{"ref":"crates/napi/src/bindgen_runtime/iterator.rs:574","code":"  574 |   let g = unsafe { Box::leak(Box::from_raw(generator_ptr as *mut T)) };","lines":1,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/iterator.rs#L574"}]},
{"id":"UAF_2","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"medium","description":"`get_last_error_info` does `ptr::read(raw_extended_error)` to copy the\n`napi_extended_error_info` out of N-API, then runs the `TryFrom` conversion\n(which calls `CStr::from_ptr(value.error_message)`). The `error_message` field\nis a borrowed pointer owned by N-API whose contents, per the N-API contract and\nthe doc comment right above this method (\"only valid up until an n-api function\nis called on the same env\"), may be invalidated by any subsequent N-API call.\nMore importantly `ptr::read` makes a bitwise copy of the struct including the\nraw `error_message`/`engine_reserved` pointers; the struct itself is never\nowned by Rust so this is benign, but the resulting `ExtendedErrorInfo` then\ndereferences `error_message` which is only guaranteed valid transiently. It is\neasy for callers to hold the returned struct and read a dangling string.","fix":"Document that the string must be copied immediately (it already is copied to an owned String in TryFrom, which is fine) but ensure no N-API call happens between napi_get_last_error_info and the CStr read; currently the read happens inside try_into() with no intervening calls, so the real risk is the engine_reserved/engine_error_code pointer being exposed. Consider not exposing the raw engine_reserved pointer in the public struct.","locations":[{"ref":"crates/napi/src/env.rs:718-722","code":"  718 |   pub fn get_last_error_info(&self) -> Result<ExtendedErrorInfo> {\n  719 |     let mut raw_extended_error = ptr::null();\n  720 |     check_status!(unsafe { sys::napi_get_last_error_info(self.0, &mut raw_extended_error) })?;\n  721 |     unsafe { ptr::read(raw_extended_error) }.try_into()\n  722 |   }","lines":5,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/env.rs#L718-L722"},{"ref":"crates/napi/src/error.rs:1506-1526","code":" 1506 | impl TryFrom<sys::napi_extended_error_info> for ExtendedErrorInfo {\n 1507 |   type Error = Error;\n 1508 | \n 1509 |   fn try_from(value: sys::napi_extended_error_info) -> Result<Self> {\n 1510 |     Ok(Self {\n 1511 |       message: if value.error_message.is_null() {\n 1512 |         String::new()\n 1513 |       } else {\n 1514 |         unsafe {\n 1515 |           CStr::from_ptr(value.error_message.cast())\n 1516 |             .to_str()\n 1517 |             .map_err(|e| Error::new(Status::GenericFailure, format!(\"{e}\")))?\n 1518 |             .to_owned()\n 1519 |         }\n 1520 |       },\n 1521 |       engine_error_code: value.engine_error_code,\n 1522 |       engine_reserved: value.engine_reserved,\n 1523 |       error_code: Status::from(value.error_code),\n 1524 |     })\n 1525 |   }\n 1526 | }","lines":21,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/error.rs#L1506-L1526"}]},
{"id":"UAF_3","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"medium","description":"`into_utf16` allocates `result` of length `len` (= utf16_len + 1), captures `buf_ptr` from it, then moves `result` into the `_inner_buf` field while `buf` is built via `slice::from_raw_parts(buf_ptr, len)`. Unlike `into_utf8`/`into_latin1` which `mem::forget` the Vec and rebuild it, here the same Vec is both kept alive in `_inner_buf` AND aliased by the raw `buf` slice pointing at its data via `buf_ptr`. The pointer is captured before the move; a Vec move does not reallocate so it currently happens to stay valid, but this is fragile aliasing of an owned Vec's buffer through a separate raw slice (mutable owner + shared raw slice to same allocation). It is undefined-behavior-adjacent and differs from the documented pattern used by the other two conversions.","fix":"Build the `buf` slice from `_inner_buf.as_ptr()` after the move (i.e. `self._inner_buf` once stored), or store only the Vec and expose `buf` as a method returning `_inner_buf.as_slice()`. Do not keep a raw `from_raw_parts` slice aliasing a Vec you also retain ownership of.","locations":[{"ref":"crates/napi/src/js_values/string/mod.rs:120-140","code":"  120 |   pub fn into_utf16(self) -> Result<JsStringUtf16<'env>> {\n  121 |     let mut written_char_count = 0usize;\n  122 |     let len = self.utf16_len()? + 1;\n  123 |     let mut result = vec![0; len];\n  124 |     let buf_ptr = result.as_mut_ptr();\n  125 |     check_status!(unsafe {\n  126 |       sys::napi_get_value_string_utf16(\n  127 |         self.0.env,\n  128 |         self.0.value,\n  129 |         buf_ptr,\n  130 |         len,\n  131 |         &mut written_char_count,\n  132 |       )\n  133 |     })?;\n  134 | \n  135 |     Ok(JsStringUtf16 {\n  136 |       inner: self,\n  137 |       buf: unsafe { std::slice::from_raw_parts(buf_ptr.cast(), len) },\n  138 |       _inner_buf: result,\n  139 |     })\n  140 |   }","lines":21,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/js_values/string/mod.rs#L120-L140"}]},
{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"`ArrayBuffer::from_data` (the non-`from_external` constructor) leaks the `(len, cap)` finalize-hint\nBox and the underlying `Vec` allocation when `napi_create_external_arraybuffer` returns an error\nstatus other than `napi_no_external_buffers_allowed`. On the success path the data Vec is\n`mem::forget`-ed and freed later by `finalize_slice`; on the `napi_no_external_buffers_allowed`\npath the hint Box is reclaimed. But if `status` is some other error, control flows to\n`check_status!(status, ...)?` in the `else` branch which returns `Err` -- by that point neither the\n`finalize_hint` Box (created at line 173 via `Box::into_raw`) nor the original `data` Vec has been\nreclaimed (the Vec was about to be `mem::forget`-ed but that only runs on Ok). The hint Box leaks\nunconditionally; `data` is dropped normally (so the Vec itself is freed) but the external-arraybuffer\nfinalizer will never run, so the `Box::into_raw(Box::new((len, cap)))` allocation leaks. The same\npattern exists in `impl_from_slice!`'s `from_data` and in `Uint8ClampedSlice::from_data`.","fix":"In the `else` branch (non-`no_external_buffers_allowed`), reclaim the `finalize_hint` Box before\npropagating the error, e.g. `if let Err(e) = check_status!(status, ...) { unsafe { let _ =\nBox::from_raw(finalize_hint); } return Err(e); }`. Only `mem::forget(data)` on the genuine success\npath.","locations":[{"ref":"crates/napi/src/bindgen_runtime/js_values/arraybuffer.rs:171-201","code":"  171 |     let len = data.len();\n  172 |     let cap = data.capacity();\n  173 |     let finalize_hint = Box::into_raw(Box::new((len, cap)));\n  174 |     let mut status = unsafe {\n  175 |       sys::napi_create_external_arraybuffer(\n  176 |         env.0,\n  177 |         inner_ptr.cast(),\n  178 |         data.len(),\n  179 |         Some(finalize_slice::<u8>),\n  180 |         finalize_hint.cast(),\n  181 |         &mut buf,\n  182 |       )\n  183 |     };\n  184 |     if status == napi_sys::Status::napi_no_external_buffers_allowed {\n  185 |       unsafe {\n  186 |         let _ = Box::from_raw(finalize_hint);\n  187 |       }\n  188 |       let mut underlying_data = ptr::null_mut();\n  189 |       status =\n  190 |         unsafe { sys::napi_create_arraybuffer(env.0, data.len(), &mut underlying_data, &mut buf) };\n  191 |       check_status!(status, \"Failed to create arraybuffer\")?;\n  192 |       if len > 0 {\n  193 |         let underlying_slice: &mut [u8] =\n  194 |           unsafe { std::slice::from_raw_parts_mut(underlying_data.cast(), len) };\n  195 |         underlying_slice.copy_from_slice(data.as_slice());\n  196 |       }\n  197 |       inner_ptr = underlying_data.cast();\n  198 |     } else {\n  199 |       check_status!(status, \"Failed to create arraybuffer\")?;\n  200 |       mem::forget(data);\n  201 |     }","lines":31,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/js_values/arraybuffer.rs#L171-L201"},{"ref":"crates/napi/src/bindgen_runtime/js_values/arraybuffer.rs:1004-1041","code":" 1004 |         let len = data.len();\n 1005 |         let array_buffer_len = len * mem::size_of::<$rust_type>();\n 1006 |         let cap = data.capacity();\n 1007 |         let finalize_hint = Box::into_raw(Box::new((len, cap)));\n 1008 |         let mut status = unsafe {\n 1009 |           sys::napi_create_external_arraybuffer(\n 1010 |             env.0,\n 1011 |             inner_ptr.cast(),\n 1012 |             array_buffer_len,\n 1013 |             Some(finalize_slice::<$rust_type>),\n 1014 |             finalize_hint.cast(),\n 1015 |             &mut buf,\n 1016 |           )\n 1017 |         };\n 1018 |         if status == napi_sys::Status::napi_no_external_buffers_allowed {\n 1019 |           unsafe {\n 1020 |             let _ = Box::from_raw(finalize_hint);\n 1021 |           }\n 1022 |           let mut underlying_data = ptr::null_mut();\n 1023 |           status = unsafe {\n 1024 |             sys::napi_create_arraybuffer(\n 1025 |               env.0,\n 1026 |               array_buffer_len,\n 1027 |               &mut underlying_data,\n 1028 |               &mut buf,\n 1029 |             )\n 1030 |           };\n 1031 |           check_status!(status, \"Failed to create buffer slice from data\")?;\n 1032 |           if array_buffer_len > 0 {\n 1033 |             let underlying_slice: &mut [u8] =\n 1034 |               unsafe { std::slice::from_raw_parts_mut(underlying_data.cast(), array_buffer_len) };\n 1035 |             underlying_slice.copy_from_slice(unsafe { core::slice::from_raw_parts(inner_ptr.cast(), array_buffer_len) });\n 1036 |           }\n 1037 |           inner_ptr = underlying_data.cast();\n 1038 |         } else {\n 1039 |           check_status!(status, \"Failed to create buffer slice from data\")?;\n 1040 |           mem::forget(data);\n 1041 |         }","lines":38,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/js_values/arraybuffer.rs#L1004-L1041"},{"ref":"crates/napi/src/bindgen_runtime/js_values/arraybuffer.rs:1734-1763","code":" 1734 |     let len = data.len();\n 1735 |     let cap = data.capacity();\n 1736 |     let finalize_hint = Box::into_raw(Box::new((len, cap)));\n 1737 |     let mut status = unsafe {\n 1738 |       sys::napi_create_external_arraybuffer(\n 1739 |         env.0,\n 1740 |         inner_ptr.cast(),\n 1741 |         data.len(),\n 1742 |         Some(finalize_slice::<u8>),\n 1743 |         finalize_hint.cast(),\n 1744 |         &mut buf,\n 1745 |       )\n 1746 |     };\n 1747 |     if status == napi_sys::Status::napi_no_external_buffers_allowed {\n 1748 |       unsafe {\n 1749 |         let _ = Box::from_raw(finalize_hint);\n 1750 |       }\n 1751 |       let mut underlying_data = ptr::null_mut();\n 1752 |       status = u {"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"`Result<T> as ToNapiValue` computes `error_code` via `String::to_napi_value(env, format!(\"{:?}\", e.status))` but never NUL/length concerns aside, the created `error_code` and `reason` napi strings plus the error object are fine; however the original `Result::Err` branch drops `e` (consuming `e.reason.clone()` rather than moving) — `clone()` allocates a throwaway `String` on every error conversion path even though `e` is owned and could be moved. Minor avoidable allocation on the error path.","fix":"Move `e.reason` instead of cloning (`String::to_napi_value(env, e.reason)`), since `e` is owned by value here.","locations":[{"ref":"crates/napi/src/bindgen_runtime/js_values.rs:270-280","code":"  270 |       Err(e) => {\n  271 |         let error_code = unsafe { String::to_napi_value(env, format!(\"{:?}\", e.status))? };\n  272 |         let reason = unsafe { String::to_napi_value(env, e.reason.clone())? };\n  273 |         let mut error = ptr::null_mut();\n  274 |         check_status!(\n  275 |           unsafe { sys::napi_create_error(env, error_code, reason, &mut error) },\n  276 |           \"Failed to create napi error\"\n  277 |         )?;\n  278 | \n  279 |         Ok(error)\n  280 |       }","lines":11,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/js_values.rs#L270-L280"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"`deserialize_any` casts `js_number as i64` for any double it deems integral. For an integral double outside the i64 range (e.g. 1e30, which is integral as a double), `f64 as i64` saturates to `i64::MAX` in Rust, silently corrupting the deserialized value with no error. JS numbers can be far larger than i64.","fix":"Range-check before casting: only `visit_i64` when the value is within `[i64::MIN, i64::MAX]`, otherwise fall back to `visit_f64` (or `visit_u64`/error).","locations":[{"ref":"crates/napi/src/js_values/de.rs:35-38","code":"   35 |         if (js_number.trunc() - js_number).abs() < f64::EPSILON {\n   36 |           visitor.visit_i64(js_number as i64)\n   37 |         } else {\n   38 |           visitor.visit_f64(js_number)","lines":4,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/js_values/de.rs#L35-L38"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"In `impl_typed_array!`'s `ToNapiValue` (both for owned and `&mut`), `let length = val_length *\nratio;` multiplies the element count by `mem::size_of::<$rust_type>()` (e.g. 8 for\n`BigInt64Array`/`Float64Array`) as a plain `usize`, with no overflow check, to compute the byte\nlength passed to `napi_create_external_arraybuffer`/`napi_create_arraybuffer`. The same\nunchecked `len * mem::size_of::<$rust_type>()` appears in `impl_from_slice!`'s `from_data`\n(`array_buffer_len`) and `from_external`. On 32-bit/wasm targets a large element count can wrap,\nproducing a smaller byte length than the actual backing store; combined with `napi_create_typedarray`\nusing the element `len`, this yields a TypedArray whose declared element length exceeds the\nArrayBuffer byte length, or an undersized copy in the `no_external_buffers_allowed` fallback.","fix":"Use `val_length.checked_mul(ratio)` / `len.checked_mul(mem::size_of::<$rust_type>())` and return an\n`Error` on overflow instead of wrapping.","locations":[{"ref":"crates/napi/src/bindgen_runtime/js_values/arraybuffer.rs:791-793","code":"  791 |         let ratio = mem::size_of::<$rust_type>();\n  792 |         let val_length = val.length;\n  793 |         let length = val_length * ratio;","lines":3,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/js_values/arraybuffer.rs#L791-L793"},{"ref":"crates/napi/src/bindgen_runtime/js_values/arraybuffer.rs:865-867","code":"  865 |         let ratio = mem::size_of::<$rust_type>();\n  866 |         let val_length = val.length;\n  867 |         let length = val_length * ratio;","lines":3,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/js_values/arraybuffer.rs#L865-L867"},{"ref":"crates/napi/src/bindgen_runtime/js_values/arraybuffer.rs:1004-1005","code":" 1004 |         let len = data.len();\n 1005 |         let array_buffer_len = len * mem::size_of::<$rust_type>();","lines":2,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/js_values/arraybuffer.rs#L1004-L1005"},{"ref":"crates/napi/src/bindgen_runtime/js_values/arraybuffer.rs:1117","code":" 1117 |         let array_buffer_len = data_len * mem::size_of::<$rust_type>();","lines":1,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/js_values/arraybuffer.rs#L1117"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`js_name.len() as isize - 1` is passed as the class-name length to `napi_define_class`. `js_name` is a NUL-terminated `&'static str`, so `len()` includes the trailing NUL and `- 1` strips it. If a malformed registration ever passed an empty string (len 0), this becomes `-1` (i.e. NAPI_AUTO_LENGTH), which silently changes semantics rather than erroring. Minor, since macro-generated names are always non-empty NUL-terminated, but the cast/subtraction is fragile.","fix":"Compute the length defensively (`js_name.len().saturating_sub(1) as isize`) or assert the name is NUL-terminated and non-empty.","locations":[{"ref":"crates/napi/src/bindgen_runtime/module_register.rs:678","code":"  678 |               raw_props.len(),","lines":1,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/module_register.rs#L678"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"Numerous string/length conversions cast `usize`/`len()` to `isize` with `as`\n(e.g. `s.len() as isize`, `name.len() as isize`, `chars.len() as isize`). On a\n64-bit platform a string longer than isize::MAX would wrap to a negative length;\nN-API would then interpret a negative length as NAPI_AUTO_LENGTH (-1) or reject\nit. In practice such lengths are unreachable for real strings, but the casts are\nunchecked truncations on external/user data. The hardcoded literal `27` for the\nlength of the async-resource-name string in threadsafe_function is also a magic\nnumber that must stay in sync with the constant (it is the byte length of\n\"napi_rs_threadsafe_function\").","fix":"Use `.try_into()` with explicit error handling for the length casts, or at minimum document the invariant. For the `27` literal use `THREAD_SAFE_FUNCTION_ASYNC_RESOURCE_NAME.len() as isize` so it cannot drift.","locations":[{"ref":"crates/napi/src/env.rs:188","code":"  188 |     unsafe { self.create_string_from_c_char(s.as_ptr().cast(), s.len() as isize) }","lines":1,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/env.rs#L188"},{"ref":"crates/napi/src/env.rs:188","code":"  188 |     unsafe { self.create_string_from_c_char(s.as_ptr().cast(), s.len() as isize) }","lines":1,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/env.rs#L188"},{"ref":"crates/napi/src/threadsafe_function.rs:324-327","code":"  324 |           27,\n  325 |           None,\n  326 |           ptr::null_mut(),\n  327 |           &mut async_resource_name,","lines":4,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/threadsafe_function.rs#L324-L327"},{"ref":"crates/napi/src/threadsafe_function.rs:341-344","code":"  341 |           THREAD_SAFE_FUNCTION_ASYNC_RESOURCE_NAME.as_ptr().cast(),\n  342 |           27,\n  343 |           &mut async_resource_name,\n  344 |         )","lines":4,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/threadsafe_function.rs#L341-L344"}]},
{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`len*2 + 1` in `into_latin1_string` can overflow `usize` (panic in debug, wraparound in release leading to an undersized allocation and out-of-bounds write inside `convert_latin1_to_str`) for an extremely large latin1 string (len > usize::MAX/2). Reachable only for absurdly large strings but unguarded.","fix":"Use checked arithmetic or `encoding_rs::mem::convert_latin1_to_str` requires dst at least 2x src; allocate with `self.len().checked_mul(2).and_then(|v| v.checked_add(1))` and error on overflow.","locations":[{"ref":"crates/napi/src/js_values/string/latin1.rs:419","code":"  419 |     let mut dst_str = unsafe { String::from_utf8_unchecked(vec![0; self.len() * 2 + 1]) };","lines":1,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/js_values/string/latin1.rs#L419"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`NapiConst::gen_module_register` registers the exported constant under the Rust\nidentifier `self.name` instead of the JavaScript name `self.js_name`. The\nnull-terminated literal that is passed to `register_module_export` as the export\nkey is built from `self.name`:\n\n    let js_name_lit = Literal::string(&format!(\"{}\\0\", self.name));\n\nEvery other code generator uses `js_name` for the export key (e.g.\n`codegen/enum.rs:223` `format!(\"{}\\0\", &self.js_name)`, `codegen/fn.rs:776`\n`format!(\"{}\\0\", &self.js_name)`). Meanwhile the TypeScript `.d.ts` produced by\n`typegen/const.rs` emits `export const {js_name}: ...`. So when a const is\nrenamed via `#[napi(js_name = \"...\")]`, the runtime registers the export under\nthe Rust name while the type definition declares the JS name, producing a name\nmismatch (the declared constant is missing at runtime).","fix":"Use `self.js_name` when building `js_name_lit`: `Literal::string(&format!(\"{}\\0\", self.js_name))`, matching enum/fn codegen.","locations":[{"ref":"crates/backend/src/codegen/const.rs:25","code":"   25 |     let js_name_lit = Literal::string(&format!(\"{}\\0\", self.name));","lines":1,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/backend/src/codegen/const.rs#L25"},{"ref":"crates/backend/src/typegen/const.rs:24-29","code":"   24 |       original_name: Some(self.name.to_string()),\n   25 |       def: format!(\n   26 |         \"export const {}: {}\",\n   27 |         &self.js_name,\n   28 |         ty_to_ts_type(&self.type_name, false, false, false).0\n   29 |       ),","lines":6,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/backend/src/typegen/const.rs#L24-L29"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"Duplicate-constructor detection in `check_recorded_struct_for_impl` is gated behind `!cfg!(debug_assertions)`, so in debug builds (the default `cargo build`) defining two `#[napi(constructor)]` methods for the same struct is silently allowed and never flagged. The guard appears intended to avoid false positives from rust-analyzer / multiple expansions, but it disables a real correctness check for the most common build profile, deferring the error to release builds only.","fix":"Reassess the `!cfg!(debug_assertions)` guard. If the goal is to avoid double-counting from re-expansion, track expansion identity instead of disabling the check entirely; at minimum document why duplicate constructors are only rejected in release builds.","locations":[{"ref":"crates/macro/src/parser/attrs.rs:375-388","code":"  375 |   if let Some(parsed) = map.get_mut(&struct_name) {\n  376 |     if opts.constructor().is_some() && !cfg!(debug_assertions) {\n  377 |       if parsed.ctor_defined {\n  378 |         bail_span!(\n  379 |           ident,\n  380 |           \"Constructor has already been defined for struct `{}`\",\n  381 |           &struct_name\n  382 |         );\n  383 |       } else {\n  384 |         parsed.ctor_defined = true;\n  385 |       }\n  386 |     }\n  387 | \n  388 |     Ok(parsed.js_name.clone())","lines":14,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/macro/src/parser/attrs.rs#L375-L388"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`NaiveDateTime::from_napi_value` allocates `String::with_capacity(iso_string_length + 1)` but then\npasses `iso_string_length` (NOT `iso_string_length + 1`) as the buffer size to the second\n`napi_get_value_string_utf8` call. Node-API needs room for the trailing NUL, so with a buffer size\nof exactly `iso_string_length` it writes only `iso_string_length - 1` characters plus a NUL\nterminator, and reports `written_char_count` accordingly. The code then does\n`set_len(iso_string_length)`, which (a) is larger than the bytes actually written and (b) includes\nthe NUL byte. The resulting string is one character short and contains a trailing NUL, so\n`NaiveDateTime::from_str` will almost always fail (or parse a corrupted string). Compare with the\ncorrect pattern in `string.rs` (`String::from_napi_value`) which does `len += 1` and passes the\nincremented `len` as the buffer size. Here `set_len` uses the SECOND `iso_string_length` value\nreturned by the call, which compounds the issue.","fix":"Allocate with `iso_string_length + 1` capacity AND pass `iso_string_length + 1` as the buffer-size\nargument, then `set_len(written_char_count)` using the count returned by the call (not the original\nlength). Mirror the implementation in `string.rs::String::from_napi_value`.","locations":[{"ref":"crates/napi/src/bindgen_runtime/js_values/date.rs:80-117","code":"   80 |     let mut iso_string_length = 0;\n   81 |     check_status!(\n   82 |       unsafe {\n   83 |         sys::napi_get_value_string_utf8(\n   84 |           env,\n   85 |           iso_string_value,\n   86 |           ptr::null_mut(),\n   87 |           0,\n   88 |           &mut iso_string_length,\n   89 |         )\n   90 |       },\n   91 |       \"Get ISOString length failed\"\n   92 |     )?;\n   93 |     let mut iso_string = String::with_capacity(iso_string_length + 1);\n   94 |     check_status!(\n   95 |       unsafe {\n   96 |         sys::napi_get_value_string_utf8(\n   97 |           env,\n   98 |           iso_string_value,\n   99 |           iso_string.as_mut_ptr().cast(),\n  100 |           iso_string_length,\n  101 |           &mut iso_string_length,\n  102 |         )\n  103 |       },\n  104 |       \"Get ISOString length failed\"\n  105 |     )?;\n  106 | \n  107 |     unsafe { iso_string.as_mut_vec().set_len(iso_string_length) };\n  108 | \n  109 |     let naive = NaiveDateTime::from_str(iso_string.as_str()).map_err(|err| {\n  110 |       Error::new(\n  111 |         Status::InvalidArg,\n  112 |         format!(\"Failed to convert napi value into rust type `NaiveDateTime` {err} {iso_string}\"),\n  113 |       )\n  114 |     })?;\n  115 | \n  116 |     Ok(naive)\n  117 |   }","lines":38,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/js_values/date.rs#L80-L117"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`ReadableStream::cancel` documents and intends to call the stream's `cancel()` method but actually fetches and invokes the `abort` named property (`c\"abort\"`). The `ReadableStream` Web API has no `abort` method (that belongs to `WritableStream`); the correct method is `cancel`. As written, `napi_get_named_property` returns `undefined` for `abort`, and the subsequent `napi_call_function` on a non-function will fail, so `cancel(reason)` never cancels the readable stream.","fix":"Fetch `c\"cancel\".as_ptr()` instead of `c\"abort\"` and update the error messages accordingly.","locations":[{"ref":"crates/napi/src/bindgen_runtime/js_values/stream/read.rs:104-133","code":"  104 |   pub fn cancel(&mut self, reason: Option<String>) -> Result<PromiseRaw<'_, ()>> {\n  105 |     let mut cancel_fn = ptr::null_mut();\n  106 |     check_status!(\n  107 |       unsafe {\n  108 |         sys::napi_get_named_property(\n  109 |           self.env,\n  110 |           self.value,\n  111 |           c\"abort\".as_ptr().cast(),\n  112 |           &mut cancel_fn,\n  113 |         )\n  114 |       },\n  115 |       \"Get abort property failed\"\n  116 |     )?;\n  117 |     let reason_value = unsafe { ToNapiValue::to_napi_value(self.env, reason)? };\n  118 |     let mut promise = ptr::null_mut();\n  119 |     check_status!(\n  120 |       unsafe {\n  121 |         sys::napi_call_function(\n  122 |           self.env,\n  123 |           self.value,\n  124 |           cancel_fn,\n  125 |           1,\n  126 |           [reason_value].as_ptr(),\n  127 |           &mut promise,\n  128 |         )\n  129 |       },\n  130 |       \"Call abort function failed\"\n  131 |     )?;\n  132 |     Ok(PromiseRaw::new(self.env, promise))\n  133 |   }","lines":30,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/js_values/stream/read.rs#L104-L133"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`serialize_struct_variant` builds an `outer` object, attaches the inner object under the variant name, but then discards `outer` entirely and returns a StructSerializer wrapping a brand-new empty `Object`. The result is that struct-variant enums serialize to a plain object of the fields WITHOUT the variant wrapper, and the `inner` object that was attached to `outer` is never populated (the StructSerializer writes into the third, unrelated object). This produces incorrect JSON for externally-tagged struct-variant enums (e.g. `{ \"Variant\": { ...fields } }` is expected, but the produced value is `{ ...fields }` with no variant key).","fix":"Return `Ok(StructSerializer { obj: inner })` and return the `outer` object from `end()`. Restructure StructSerializer so the variant case keeps a reference to `outer` and serializes fields into `inner`; `end()` for the variant must return `outer.0`, not `inner`/the discarded object.","locations":[{"ref":"crates/napi/src/js_values/ser.rs:348-371","code":"  348 |   fn serialize_struct_variant(\n  349 |     self,\n  350 |     _name: &'static str,\n  351 |     _variant_index: u32,\n  352 |     variant: &'static str,\n  353 |     _len: usize,\n  354 |   ) -> Result<Self::SerializeStructVariant> {\n  355 |     let mut outer = Object::new(self.0)?;\n  356 |     let inner = Object::new(self.0)?;\n  357 |     outer.set_named_property(\n  358 |       variant,\n  359 |       Object(\n  360 |         Value {\n  361 |           env: inner.0.env,\n  362 |           value: inner.0.value,\n  363 |           value_type: ValueType::Object,\n  364 |         },\n  365 |         PhantomData,\n  366 |       ),\n  367 |     )?;\n  368 |     Ok(StructSerializer {\n  369 |       obj: Object::new(self.0)?,\n  370 |     })\n  371 |   }","lines":24,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/js_values/ser.rs#L348-L371"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`fetchNapiVersion` sets the inquirer select default to `this.minNodeApiVersion - 1` with the comment `// choice index`, assuming the napi-version values map 1:1 onto choice indices (NapiVersion 1 -> index 0, etc). But `getNapiVersionChoices` returns choices whose `value` is the NapiVersion number and inquirer `select` `default` is matched against the choice VALUE, not an index. Passing `minNodeApiVersion - 1` therefore preselects the wrong entry (off by one): e.g. default minNodeApiVersion=4 preselects value 3 (Napi3) instead of Napi4. The 'choice index' comment is also wrong since select compares by value.","fix":"Pass the value directly as the default: `default: this.minNodeApiVersion` (remove the `- 1` and the misleading comment), since inquirer matches `default` against choice `value`.","locations":[{"ref":"cli/src/commands/new.ts:85-94","code":"   85 |   private async fetchNapiVersion(): Promise<number> {\n   86 |     return select({\n   87 |       message: 'Minimum node-api version (with node version requirement)',\n   88 |       loop: false,\n   89 |       pageSize: 10,\n   90 |       choices: getNapiVersionChoices(),\n   91 |       // choice index\n   92 |       default: this.minNodeApiVersion - 1,\n   93 |     })\n   94 |   }","lines":10,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/cli/src/commands/new.ts#L85-L94"},{"ref":"cli/src/commands/new.ts:21-26","code":"   21 | export function getNapiVersionChoices() {\n   22 |   return SUPPORTED_NAPI_VERSIONS.map((version) => ({\n   23 |     name: `napi${version} (${napiEngineRequirement(version)})`,\n   24 |     value: version,\n   25 |   }))\n   26 | }","lines":6,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/cli/src/commands/new.ts#L21-L26"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`readNapiConfig` merges config via es-toolkit `merge` and then handles targets separately, but when both a `napi` field in package.json AND a separate config file exist it does `Object.assign(userNapiConfig, separatedConfig)`. Object.assign is a shallow merge, so nested objects like `wasm.browser` from the package.json napi field are entirely replaced (not deep-merged) by the separate config's `wasm`, even if the separate config only sets `wasm.initialMemory`. This can silently drop browser wasm settings when a user splits config across both locations.","fix":"Deep-merge separatedConfig over the package.json napi field (use the same `merge` helper) instead of shallow Object.assign, or document that the separate config fully replaces the napi field.","locations":[{"ref":"cli/src/utils/config.ts:257-279","code":"  257 |   const userNapiConfig = pkgJson.napi ?? {}\n  258 |   if (pkgJson.napi && separatedConfig) {\n  259 |     const pkgJsonPath = underline(path)\n  260 |     const configPathUnderline = underline(configPath!)\n  261 |     console.warn(\n  262 |       yellow(\n  263 |         `Both napi field in ${pkgJsonPath} and [NAPI-RS config](${configPathUnderline}) file are found, the NAPI-RS config file will be used.`,\n  264 |       ),\n  265 |     )\n  266 |   }\n  267 |   if (separatedConfig) {\n  268 |     Object.assign(userNapiConfig, separatedConfig)\n  269 |   }\n  270 |   const napiConfig: NapiConfig = merge(\n  271 |     {\n  272 |       binaryName: 'index',\n  273 |       packageName: pkgJson.name,\n  274 |       targets: [],\n  275 |       packageJson: pkgJson,\n  276 |       npmClient: 'npm',\n  277 |     },\n  278 |     omit(userNapiConfig, ['targets']),\n  279 |   )","lines":23,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/cli/src/utils/config.ts#L257-L279"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"String-enum union generation uses an overly broad regex. For the type-only union branch, `line.def.replaceAll(/.*=/g, '').replaceAll(',', '|')` strips everything up to the LAST `=` on each line because `.*` is greedy and the regex is multiline-unaware/global. If an enum variant's value text contains an `=` (or the def spans constructs with `=`), the wrong portion is removed. It also turns commas inside the resulting text into `|` indiscriminately, which can corrupt values that legitimately contain commas.","fix":"Parse the def line-by-line and extract the right-hand string literal of each `name = 'value'` pair explicitly, rather than a single global greedy `.*=` strip; build the union from the parsed literals.","locations":[{"ref":"cli/src/utils/typegen.ts:219-227","code":"  219 |     case TypeDefKind.StringEnum: {\n  220 |       if (constEnum) {\n  221 |         s += `${exportDeclare(ambient)} const enum ${line.name} {\\n${line.def}\\n}`\n  222 |       } else if (runtimeStringEnum) {\n  223 |         s += `${exportDeclare(ambient)} enum ${line.name} {\\n${line.def}\\n}`\n  224 |       } else {\n  225 |         s += `export type ${line.name} = ${line.def.replaceAll(/.*=/g, '').replaceAll(',', '|')};`\n  226 |       }\n  227 |       break","lines":9,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/cli/src/utils/typegen.ts#L219-L227"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`parseNodeVersion` requires a full `major.minor.patch`, but the NAPI_VERSION_MATRIX entries are split on `'|'` while the matrix strings use `' | '` (spaces around the pipe). `requirement.split('|')` yields entries with leading/trailing spaces like ` 9.0.0 `; the regex `/v?([0-9]+)\\.([0-9]+)\\.([0-9]+)/i` tolerates surrounding whitespace so it works, but `toEngineRequirement` then emits `>= 9.0.0` etc. This is fragile: any matrix entry without all three version components (none currently) would throw. Lower risk, but the split delimiter not matching the literal separator is a latent bug if the matrix format changes.","fix":"Split on /\\s*\\|\\s*/ and/or validate entries explicitly; keep the separator handling robust to spacing.","locations":[{"ref":"cli/src/utils/version.ts:62-70","code":"   62 | function requiredNodeVersions(napiVersion: NapiVersion): NodeVersion[] {\n   63 |   const requirement = NAPI_VERSION_MATRIX.get(napiVersion)\n   64 | \n   65 |   if (!requirement) {\n   66 |     return [parseNodeVersion('10.0.0')]\n   67 |   }\n   68 | \n   69 |   return requirement.split('|').map(parseNodeVersion)\n   70 | }","lines":9,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/cli/src/utils/version.ts#L62-L70"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`Diagnostic::panic` recurses into itself for the `Multi` case while annotated\n`#[allow(unconditional_recursion)]`:\n\n    pub fn panic(&self) -> ! {\n      match &self.inner {\n        ...\n        Repr::Multi { diagnostics } => diagnostics[0].panic(),\n      }\n    }\n\nIf a `Multi` diagnostic is ever constructed with an empty `diagnostics` vector,\n`diagnostics[0]` panics with an index-out-of-bounds instead of reporting the\nintended error message. `Diagnostic::from_vec` guards against the empty case,\nbut `Repr::Multi` is a plain enum variant that can be built elsewhere; the\nindexing is an unguarded assumption.","fix":"Use `if let Some(first) = diagnostics.first() { first.panic() } else { panic!(\"empty diagnostic\") }` to avoid a misleading index panic.","locations":[{"ref":"crates/backend/src/error.rs:84-92","code":"   84 |   /// Immediately trigger a panic from this `Diagnostic`\n   85 |   #[allow(unconditional_recursion)]\n   86 |   pub fn panic(&self) -> ! {\n   87 |     match &self.inner {\n   88 |       Repr::Single { text, .. } => panic!(\"{}\", text),\n   89 |       Repr::SynError(error) => panic!(\"{}\", error),\n   90 |       Repr::Multi { diagnostics } => diagnostics[0].panic(),\n   91 |     }\n   92 |   }","lines":9,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/backend/src/error.rs#L84-L92"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`handle_option_type` adds `| undefined | null` for non-return positions but only\n`| null` for return positions, and for struct fields it returns the bare type\nwith `is_optional = true` (so the `?:`/`| null` is added later in `gen_field`).\nHowever, `gen_field` in `typegen/struct.rs` applies the override `f.ts_type`\nAFTER computing `is_optional` from `ty_to_ts_type`:\n\n    let (arg, is_optional) = ty_to_ts_type(&f.ty, false, true, false);\n    let arg = f.ts_type.as_ref().map(|ty| ty.to_string()).unwrap_or(arg);\n    ...\n    let arg = match is_optional { false => ..., true => ... };\n\nWhen a field has an explicit `#[napi(ts_type = \"Foo\")]` override but the\nunderlying Rust type is `Option<...>`, `is_optional` is still `true`, so the\ngenerated field becomes `name?: Foo` / `name: Foo | null` even though the user\nexplicitly supplied the full type string `Foo`. The override cannot suppress the\nappended optionality, which is surprising and may emit a doubled\n`Foo | null | null` if the user wrote `Foo | null`.","fix":"When `f.ts_type` is an explicit override, treat the field as already-complete: skip the optional/nullable wrapping (set a local `is_optional = false` when the override is present).","locations":[{"ref":"crates/backend/src/typegen/struct.rs:214-225","code":"  214 |     let (arg, is_optional) = ty_to_ts_type(&f.ty, false, true, false);\n  215 |     let arg = f.ts_type.as_ref().map(|ty| ty.to_string()).unwrap_or(arg);\n  216 |     let js_name = format_js_property_name(&f.js_name);\n  217 | \n  218 |     let arg = match is_optional {\n  219 |       false => format!(\"{}: {}\", &js_name, arg),\n  220 |       true => match self.use_nullable {\n  221 |         false => format!(\"{}?: {}\", &js_name, arg),\n  222 |         true => format!(\"{}: {} | null\", &js_name, arg),\n  223 |       },\n  224 |     };\n  225 |     field_str.push_str(&arg);","lines":12,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/backend/src/typegen/struct.rs#L214-L225"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"Redundant / suspect target_env check inside the windows arm. The outer match is on `target_os`, and the windows arm then re-reads `CARGO_CFG_TARGET_ENV` and only calls `setup_gnu()` when it is `gnu`. But `target_env` was already read into a variable at line 25; this re-reads the env var via a second `env::var(...).as_deref()` call instead of reusing `target_env`. Minor inconsistency / duplicate env read that can drift.","fix":"Reuse the already-bound `target_env` variable: `if target_env == \"gnu\" { windows::setup_gnu(); }`.","locations":[{"ref":"crates/build/src/lib.rs:25","code":"   25 |   let target_env = env::var(\"CARGO_CFG_TARGET_ENV\").expect(\"CARGO_CFG_TARGET_ENV is not set\");","lines":1,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/build/src/lib.rs#L25"},{"ref":"crates/build/src/lib.rs:39-43","code":"   39 |     \"windows\" => {\n   40 |       if let Ok(\"gnu\") = env::var(\"CARGO_CFG_TARGET_ENV\").as_deref() {\n   41 |         windows::setup_gnu();\n   42 |       }\n   43 |     }","lines":5,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/build/src/lib.rs#L39-L43"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`replace_napi_attr_in_mod` unwraps `BindgenAttrs::try_from(&new_attr).unwrap()`. `new_attr` is constructed from user attribute tokens via `parse_quote!` and re-parsed; if the user's existing `#[napi(...)]` contents combine with the injected `namespace = ...` in a way that fails `BindgenAttrs` parsing, this panics inside the proc-macro instead of producing a span diagnostic. The error path is reachable from malformed user attributes inside a `#[napi] mod`.","fix":"Propagate the error: change the helper to return `BindgenResult<Option<BindgenAttrs>>` and `?` the `try_from`, surfacing a proper diagnostic to the user.","locations":[{"ref":"crates/macro/src/expand.rs:107-123","code":"","lines":17,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/macro/src/expand.rs#L107-L123"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"When merging a pre-existing `#[napi]` whose meta is a `NameValue` (e.g. someone wrote `#[napi = something]`) inside a module, the code reconstructs the attr as `#[napi(#existing, namespace = ...)]`, silently turning a NameValue form into a list form using only the value expression and dropping the original key. This mishandles the NameValue edge case and can produce surprising/incorrect attribute contents rather than rejecting the invalid `#[napi = ...]` form.","fix":"Reject `Meta::NameValue` for `#[napi]` with a span error (the supported forms are `#[napi]` and `#[napi(...)]`), rather than splicing its value expression into a generated list.","locations":[{"ref":"crates/macro/src/expand.rs:115-118","code":"","lines":4,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/macro/src/expand.rs#L115-L118"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"Wrong error-message product name in enum discriminant parsing: errors reference `#[wasm_bindgen]` (\"enums with #[wasm_bindgen] can only support numbers... / may only have number literal values\"). This is napi-rs, not wasm-bindgen (the code was borrowed from wasm-bindgen per the attrs.rs note). Users get a confusing diagnostic naming the wrong macro.","fix":"Change the two `bail_span!` messages to reference `#[napi]` instead of `#[wasm_bindgen]`.","locations":[{"ref":"crates/macro/src/parser/mod.rs:1700-1712","code":" 1700 |                       bail_span!(\n 1701 |                         int_lit,\n 1702 |                         \"enums with #[wasm_bindgen] can only support \\\n 1703 |                       numbers that can be represented as i32\",\n 1704 |                       );\n 1705 |                     }\n 1706 |                   },\n 1707 |                   _ => bail_span!(\n 1708 |                     expr,\n 1709 |                     \"enums with #[wasm_bindgen] may only have \\\n 1710 |                   number literal values\",\n 1711 |                   ),\n 1712 |                 }","lines":13,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/macro/src/parser/mod.rs#L1700-L1712"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`execute` writes the computed value into `work.value` (a `MaybeUninit`) but if a\ntask is cancelled, `execute` may never run while `complete` still takes the\nnon-cancelled `else` branch in some races (e.g. status != napi_cancelled but\nstatus.get() logic). The `complete_impl` reads `work.value.assume_init()`\nunconditionally in the `else` branch. If `execute` never ran (work was queued\nthen the env torn down delivering a non-cancelled status), `assume_init` reads\nuninitialized memory -> UB. The safety relies entirely on N-API always\ndelivering `napi_cancelled` when execute was skipped, which is the documented\ncontract but is not defended in code.","fix":"Track whether execute ran (e.g. a flag in AsyncWork or use Option) and only assume_init when it did; otherwise reject the deferred. This removes reliance on N-API never delivering a non-cancelled status without running execute.","locations":[{"ref":"crates/napi/src/async_work.rs:109-113","code":"  109 | unsafe extern \"C\" fn execute<'task, T: ScopedTask<'task>>(_env: sys::napi_env, data: *mut c_void) {\n  110 |   let work = Box::leak(unsafe { Box::from_raw(data as *mut AsyncWork<T>) });\n  111 |   let value = work.inner_task.compute();\n  112 |   work.value.write(value);\n  113 | }","lines":5,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/async_work.rs#L109-L113"},{"ref":"crates/napi/src/async_work.rs:144-145","code":"  144 |   } else {\n  145 |     let value_ptr = unsafe { work.value.assume_init() };","lines":2,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/async_work.rs#L144-L145"}]},
