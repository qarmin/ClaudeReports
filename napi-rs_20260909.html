{"id":"LOGIC_48","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`get_all` on `CallContext` iterates `self.args` (length == arg_len) rather than\n`self.length` (the actual JS arguments count). The struct's own doc explains\narg_len is the macro-declared count and `.length` is the real arguments count,\nand that when `length < arg_len` the extra slots are JsUndefined. So `get_all`\nreturns trailing JsUndefined padding instead of the actual arguments the caller\npassed. The commented-out alternative directly above also iterates arg_len, so\nthis may be intentional, but it contradicts the documented meaning of \"all\narguments\".","fix":"If the intent is the real JS args, iterate `self.args[..self.length.min(self.args.len())]`. Otherwise document that get_all includes undefined padding up to arg_len.","locations":[{"ref":"crates/napi/src/call_context.rs:76-83","code":"   76 |   pub fn get_all(&self) -> Vec<crate::Unknown<'_>> {\n   77 |     /* (0 .. self.arg_len()).map(|i| self.get(i).unwrap()).collect() */\n   78 |     self\n   79 |       .args\n   80 |       .iter()\n   81 |       .map(|&raw| unsafe { crate::Unknown::from_raw_unchecked(self.env.0, raw) })\n   82 |       .collect()\n   83 |   }","lines":8,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/call_context.rs#L76-L83"},{"ref":"crates/napi/src/call_context.rs:17-31","code":"   17 | impl<'env> CallContext<'env> {\n   18 |   /// The number of N-api obtained values. In practice this is the numeric\n   19 |   /// parameter provided to the `#[js_function(arg_len)]` macro.\n   20 |   ///\n   21 |   /// As a comparison, the (arguments) `.length` represents the actual number\n   22 |   /// of arguments given at a specific function call.\n   23 |   ///\n   24 |   /// If `.length < .arg_len`, then the elements in the `length .. arg_len`\n   25 |   /// range are just `JsUndefined`s.\n   26 |   ///\n   27 |   /// If `.length > .arg_len`, then truncation has happened and some args have\n   28 |   /// been lost.\n   29 |   fn arg_len(&self) -> usize {\n   30 |     self.args.len()\n   31 |   }","lines":15,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/call_context.rs#L17-L31"}]},
{"id":"LOGIC_49","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`create_buffer_with_borrowed_data` rejects when `data` equals the pointer of the\nshared `EMPTY_VEC` static (`std::ptr::eq(data, EMPTY_VEC.as_ptr())`). This is a\nheuristic to detect Rust's dangling-but-nonnull empty-slice pointer (0x1) /\nthe shared empty static, but it is unreliable: a legitimately borrowed buffer\ncould coincidentally share an address with EMPTY_VEC after the static is\noptimized, and conversely a real empty Rust slice typically has pointer 0x1 (or\nthe type's alignment), not EMPTY_VEC's address, so the intended guard often will\nnot fire. The check conflates \"empty\" with a specific static's address.","fix":"Guard on `length == 0` (the actual empty condition) rather than comparing against EMPTY_VEC's address, and reject only genuinely null pointers.","locations":[{"ref":"crates/napi/src/env.rs:391-396","code":"  391 |     if data.is_null() || std::ptr::eq(data, EMPTY_VEC.as_ptr()) {\n  392 |       return Err(Error::new(\n  393 |         Status::InvalidArg,\n  394 |         \"Borrowed data should not be null\".to_owned(),\n  395 |       ));\n  396 |     }","lines":6,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/env.rs#L391-L396"}]},
{"id":"LOGIC_50","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `trampoline` (the napi5 closure callback), `raw_args` is created with\n`Vec::with_capacity(4)` but `napi_get_cb_info` is called with\n`raw_args.as_mut_ptr()` while the Vec's len is still 0. N-API writes up to `argc`\n(initially 4) elements into the backing storage. Only afterward, in the `argc <=\n4` branch, is `set_len(argc)` called. This relies on capacity-4 backing being\nwritable (it is), but if `argc` came back as e.g. 4 and the first call wrote 4\nslots, that is exactly capacity — fine. The subtle risk: the initial `argc = 4`\nis passed and N-API may write up to 4 values into uninitialized capacity, which\nis sound only because capacity >= 4. It is correct but fragile and undocumented;\na reviewer cannot easily confirm the capacity invariant matches the `argc=4`\nliteral.","fix":"Add an assertion/comment tying the `with_capacity(4)` to the `argc = 4` literal, or use a fixed `[ptr::null_mut(); 4]` array for the fast path to make the bound self-evident.","locations":[{"ref":"crates/napi/src/env.rs:1665-1703","code":" 1665 |   // Fast path for 4 arguments or less.\n 1666 |   let mut argc = 4;\n 1667 |   let mut raw_args = Vec::with_capacity(4);\n 1668 |   let mut raw_this = ptr::null_mut();\n 1669 |   let mut closure_data_ptr = ptr::null_mut();\n 1670 | \n 1671 |   check_status!(\n 1672 |     unsafe {\n 1673 |       sys::napi_get_cb_info(\n 1674 |         raw_env,\n 1675 |         cb_info,\n 1676 |         &mut argc,\n 1677 |         raw_args.as_mut_ptr(),\n 1678 |         &mut raw_this,\n 1679 |         &mut closure_data_ptr,\n 1680 |       )\n 1681 |     },\n 1682 |     \"napi_get_cb_info failed\"\n 1683 |   )\n 1684 |   .and_then(|_| {\n 1685 |     // Arguments length greater than 4, resize the vector.\n 1686 |     if argc > 4 {\n 1687 |       raw_args = vec![ptr::null_mut(); argc];\n 1688 |       check_status!(\n 1689 |         unsafe {\n 1690 |           sys::napi_get_cb_info(\n 1691 |             raw_env,\n 1692 |             cb_info,\n 1693 |             &mut argc,\n 1694 |             raw_args.as_mut_ptr(),\n 1695 |             &mut raw_this,\n 1696 |             &mut closure_data_ptr,\n 1697 |           )\n 1698 |         },\n 1699 |         \"napi_get_cb_info failed\"\n 1700 |       )?;\n 1701 |     } else {\n 1702 |       unsafe { raw_args.set_len(argc) };\n 1703 |     }","lines":39,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/env.rs#L1665-L1703"}]},
{"id":"LOGIC_51","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`de.rs` bigint deserialization classifies word size by `words.len() < 2` (word_sized) and then for the signed+word_sized case calls `get_i64()`, for signed+!word_sized `get_i128()`, etc. A BigInt that needs exactly 2 words but whose signed value fits in i64 still goes through i128; conversely a value with 1 word but representing 2^63..2^64 with sign_bit=false correctly goes u64. The bigger issue: `sign_bit` from `BigInt` indicates negativity, but `word_sized = words.len() < 2` uses raw 64-bit word count, so a positive value in [2^63, 2^64) (1 word, sign_bit false) is sent to `get_u64()` (fine), but a value exactly needing 2 words that fits i128 may lose precision if it exceeds i128 (loss flag ignored). The `lossless`/`loss` return flags from get_i64/get_u64/get_i128/get_u128 are all discarded, so silent precision loss on out-of-range BigInts is possible.","fix":"Inspect and honor the lossless/loss flags returned by the BigInt getters; on loss, fall back to a wider type or return an error rather than silently truncating.","locations":[{"ref":"crates/napi/src/js_values/de.rs:65-78","code":"   65 |       #[cfg(feature = \"napi6\")]\n   66 |       ValueType::BigInt => {\n   67 |         let js_bigint = unsafe { BigInt::from_napi_value(self.0.env, self.0.value)? };\n   68 | \n   69 |         let BigInt { sign_bit, words } = &js_bigint;\n   70 |         let word_sized = words.len() < 2;\n   71 | \n   72 |         match (sign_bit, word_sized) {\n   73 |           (true, true) => visitor.visit_i64(js_bigint.get_i64().0),\n   74 |           (true, false) => visitor.visit_i128(js_bigint.get_i128().0),\n   75 |           (false, true) => visitor.visit_u64(js_bigint.get_u64().1),\n   76 |           (false, false) => visitor.visit_u128(js_bigint.get_u128().1),\n   77 |         }\n   78 |       }","lines":14,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/js_values/de.rs#L65-L78"}]},
{"id":"LOGIC_52","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`JsFunction::call`/`new_instance` map args via `arg.raw()` into a `raw_args` Vec, but pass `args.len()` / `length` (the original slice length) as the count to `napi_call_function`/`napi_new_instance` while passing `raw_args.as_ptr()`. These lengths always match here, so correct, but `call` uses `args.len()` directly rather than `raw_args.len()`; if the map ever filtered (it cannot here) this would desync. Minor robustness note. More relevant: `call`/`call_without_args` synthesize `this` from `ToNapiValue::to_napi_value(env, ())` via `.ok()`, discarding the actual error and substituting a generic 'Get raw this failed' message, losing the underlying N-API failure reason.","fix":"Propagate the real error from `to_napi_value(env, ())` instead of `.ok().ok_or_else(...)`. Use `raw_args.len()` for the count for self-consistency.","locations":[{"ref":"crates/napi/src/js_values/function.rs:46-93","code":"   46 |   pub fn call<V>(&self, this: Option<&JsObject>, args: &[V]) -> Result<Unknown<'_>>\n   47 |   where\n   48 |     V: NapiRaw,\n   49 |   {\n   50 |     let raw_this = this\n   51 |       .map(|v| unsafe { v.raw() })\n   52 |       .or_else(|| unsafe { ToNapiValue::to_napi_value(self.0.env, ()) }.ok())\n   53 |       .ok_or_else(|| Error::new(Status::GenericFailure, \"Get raw this failed\".to_owned()))?;\n   54 |     let raw_args = args\n   55 |       .iter()\n   56 |       .map(|arg| unsafe { arg.raw() })\n   57 |       .collect::<Vec<sys::napi_value>>();\n   58 |     let mut return_value = ptr::null_mut();\n   59 |     check_pending_exception!(self.0.env, unsafe {\n   60 |       sys::napi_call_function(\n   61 |         self.0.env,\n   62 |         raw_this,\n   63 |         self.0.value,\n   64 |         args.len(),\n   65 |         raw_args.as_ptr(),\n   66 |         &mut return_value,\n   67 |       )\n   68 |     })?;\n   69 | \n   70 |     Ok(unsafe { Unknown::from_raw_unchecked(self.0.env, return_value) })\n   71 |   }\n   72 | \n   73 |   /// [napi_call_function](https://nodejs.org/api/n-api.html#n_api_napi_call_function)\n   74 |   /// The same with `call`, but without arguments\n   75 |   pub fn call_without_args(&self, this: Option<&JsObject>) -> Result<Unknown<'_>> {\n   76 |     let raw_this = this\n   77 |       .map(|v| unsafe { v.raw() })\n   78 |       .or_else(|| unsafe { ToNapiValue::to_napi_value(self.0.env, ()) }.ok())\n   79 |       .ok_or_else(|| Error::new(Status::GenericFailure, \"Get raw this failed\".to_owned()))?;\n   80 |     let mut return_value = ptr::null_mut();\n   81 |     check_pending_exception!(self.0.env, unsafe {\n   82 |       sys::napi_call_function(\n   83 |         self.0.env,\n   84 |         raw_this,\n   85 |         self.0.value,\n   86 |         0,\n   87 |         ptr::null_mut(),\n   88 |         &mut return_value,\n   89 |       )\n   90 |     })?;\n   91 | \n   92 |     Ok(unsafe { Unknown::from_raw_unchecked(self.0.env, return_value) })\n   93 |   }","lines":48,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/js_values/function.rs#L46-L93"}]},
{"id":"LOGIC_53","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"Several `is_*` predicate helpers initialize their out-param to `true` before the N-API call: `is_date` and `is_promise` in both the macro (`impl_js_value_methods`) and the `JsValue` trait default `mut is_date = true` / `mut is_promise = true`. If the underlying napi call were ever to leave the out-param untouched on a non-error early return, the function would report `true`. The N-API contract writes the value, so currently benign, but the inconsistent initialization (others use `false`) is a latent bug and misleading.","fix":"Initialize all `is_*` out-params to `false` for consistency and safety.","locations":[{"ref":"crates/napi/src/js_values/mod.rs:212-223","code":"  212 |       #[cfg(feature = \"napi5\")]\n  213 |       pub fn is_date(&self) -> Result<bool> {\n  214 |         let mut is_date = true;\n  215 |         check_status!(unsafe { sys::napi_is_date(self.0.env, self.0.value, &mut is_date) })?;\n  216 |         Ok(is_date)\n  217 |       }\n  218 | \n  219 |       pub fn is_promise(&self) -> Result<bool> {\n  220 |         let mut is_promise = true;\n  221 |         check_status!(unsafe { sys::napi_is_promise(self.0.env, self.0.value, &mut is_promise) })?;\n  222 |         Ok(is_promise)\n  223 |       }","lines":12,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/js_values/mod.rs#L212-L223"},{"ref":"crates/napi/src/js_values/value.rs:93-106","code":"   93 |   #[cfg(feature = \"napi5\")]\n   94 |   fn is_date(&self) -> Result<bool> {\n   95 |     let mut is_date = true;\n   96 |     let env = self.value().env;\n   97 |     check_status!(unsafe { sys::napi_is_date(env, self.value().value, &mut is_date) })?;\n   98 |     Ok(is_date)\n   99 |   }\n  100 | \n  101 |   fn is_promise(&self) -> Result<bool> {\n  102 |     let mut is_promise = true;\n  103 |     let env = self.value().env;\n  104 |     check_status!(unsafe { sys::napi_is_promise(env, self.value().value, &mut is_promise) })?;\n  105 |     Ok(is_promise)\n  106 |   }","lines":14,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/js_values/value.rs#L93-L106"}]},
{"id":"LOGIC_54","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`MapSerializer::serialize_key` stores the serialized key into `self.key` via `JsString(key.serialize(...)?, PhantomData)` (asserting it is a String Value), and `serialize_value` then reconstructs a JsString from `self.key.0` to use as the property key. If a map key serializes to a non-string JS value (numbers, etc. - serde maps can have non-string keys), wrapping the resulting Value in `JsString` and using it as a property name is incorrect; `set_property` will coerce it, but the type tag in `Value` is a lie. `serialize_entry` similarly force-wraps the key as `JsString`. Non-string map keys are mishandled / mislabeled.","fix":"Use `Unknown`/`Object::set_property` with the raw serialized key Value rather than forcing it into a `JsString` wrapper, or coerce keys to string explicitly and document the limitation.","locations":[{"ref":"crates/napi/src/js_values/ser.rs:480-512","code":"  480 |   fn serialize_key<T>(&mut self, key: &T) -> StdResult<(), Self::Error>\n  481 |   where\n  482 |     T: ?Sized + Serialize,\n  483 |   {\n  484 |     let env = Env::from_raw(self.obj.0.env);\n  485 |     self.key = JsString(key.serialize(Ser::new(&env))?, std::marker::PhantomData);\n  486 |     Ok(())\n  487 |   }\n  488 | \n  489 |   fn serialize_value<T>(&mut self, value: &T) -> StdResult<(), Self::Error>\n  490 |   where\n  491 |     T: ?Sized + Serialize,\n  492 |   {\n  493 |     let env = Env::from_raw(self.obj.0.env);\n  494 |     self.obj.set_property(\n  495 |       JsString::from_raw(self.key.0.env, self.key.0.value),\n  496 |       Unknown(value.serialize(Ser::new(&env))?, std::marker::PhantomData),\n  497 |     )?;\n  498 |     Ok(())\n  499 |   }\n  500 | \n  501 |   fn serialize_entry<K, V>(&mut self, key: &K, value: &V) -> StdResult<(), Self::Error>\n  502 |   where\n  503 |     K: ?Sized + Serialize,\n  504 |     V: ?Sized + Serialize,\n  505 |   {\n  506 |     let env = Env::from_raw(self.obj.0.env);\n  507 |     self.obj.set_property(\n  508 |       JsString(key.serialize(Ser::new(&env))?, std::marker::PhantomData),\n  509 |       Unknown(value.serialize(Ser::new(&env))?, std::marker::PhantomData),\n  510 |     )?;\n  511 |     Ok(())\n  512 |   }","lines":33,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/js_values/ser.rs#L480-L512"}]},
{"id":"LOGIC_55","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`NodeVersion::TryFrom` stores `release: &'static str` borrowed from\n`CStr::from_ptr(value.release)`. The lifetime is claimed `'static`, but the\nrelease string pointer comes from the napi_node_version struct returned by\n`napi_get_node_version`; nothing guarantees it lives for `'static`. In practice\nNode's version release string is a static C literal, so this happens to be\nsound, but the `'static` annotation is an unchecked assumption baked into a\npublic struct field type.","fix":"Either copy the release into an owned String, or document the invariant that Node guarantees the release string is a process-lifetime static.","locations":[{"ref":"crates/napi/src/version.rs:5-26","code":"    5 | pub struct NodeVersion {\n    6 |   pub major: u32,\n    7 |   pub minor: u32,\n    8 |   pub patch: u32,\n    9 |   pub release: &'static str,\n   10 | }\n   11 | \n   12 | impl TryFrom<sys::napi_node_version> for NodeVersion {\n   13 |   type Error = Error;\n   14 | \n   15 |   fn try_from(value: sys::napi_node_version) -> Result<NodeVersion, Error> {\n   16 |     Ok(NodeVersion {\n   17 |       major: value.major,\n   18 |       minor: value.minor,\n   19 |       patch: value.patch,\n   20 |       release: unsafe {\n   21 |         CStr::from_ptr(value.release)\n   22 |           .to_str()\n   23 |           .map_err(|_| Error::new(Status::StringExpected, \"Invalid release name\".to_owned()))?\n   24 |       },\n   25 |     })\n   26 |   }","lines":22,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/version.rs#L5-L26"},{"ref":"crates/napi/src/env.rs:1534-1539","code":" 1534 |   pub fn get_node_version(&self) -> Result<NodeVersion> {\n 1535 |     let mut result = ptr::null();\n 1536 |     check_status!(unsafe { sys::napi_get_node_version(self.0, &mut result) })?;\n 1537 |     let version = unsafe { *result };\n 1538 |     version.try_into()\n 1539 |   }","lines":6,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/env.rs#L1534-L1539"}]},
{"id":"LOGIC_56","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"medium","description":"`gen_field` builds `field_str` then unconditionally also returns `arg` (the same\ntrailing typed-name fragment without the JSDoc/`readonly` prefix). Callers in\n`gen_ts_class` for the `Class` kind push `arg` into `ctor_args` to build the\nconstructor signature. Because `arg` is recomputed for the constructor params,\nthe constructor parameter list never includes `readonly`/JSDoc - which is\ncorrect - but the function returns a 2-tuple where the second element is a\nsubstring of the first, an easy-to-misuse API: an Object/Array caller that\naccidentally used `.1` instead of `.0` would silently drop the `readonly`\nmodifier and doc comment. Minor maintainability smell.","fix":"Return a small struct with named fields (`full` / `ctor_arg`) instead of a positional tuple of two near-identical strings.","locations":[{"ref":"crates/backend/src/typegen/struct.rs:199-227","code":"  199 |   fn gen_field(&self, f: &NapiStructField) -> Option<(String, String)> {\n  200 |     if f.skip_typescript {\n  201 |       return None;\n  202 |     }\n  203 | \n  204 |     let mut field_str = String::from(\"\");\n  205 | \n  206 |     if !f.comments.is_empty() {\n  207 |       field_str.push_str(&format!(\"{}\", JSDoc::new(&f.comments)))\n  208 |     }\n  209 | \n  210 |     if !f.setter {\n  211 |       field_str.push_str(\"readonly \")\n  212 |     }\n  213 | \n  214 |     let (arg, is_optional) = ty_to_ts_type(&f.ty, false, true, false);\n  215 |     let arg = f.ts_type.as_ref().map(|ty| ty.to_string()).unwrap_or(arg);\n  216 |     let js_name = format_js_property_name(&f.js_name);\n  217 | \n  218 |     let arg = match is_optional {\n  219 |       false => format!(\"{}: {}\", &js_name, arg),\n  220 |       true => match self.use_nullable {\n  221 |         false => format!(\"{}?: {}\", &js_name, arg),\n  222 |         true => format!(\"{}: {} | null\", &js_name, arg),\n  223 |       },\n  224 |     };\n  225 |     field_str.push_str(&arg);\n  226 |     Some((field_str, arg))\n  227 |   }","lines":29,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/backend/src/typegen/struct.rs#L199-L227"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"medium","description":"`SymbolRef::unref` (symbol.rs) and `UnknownRef::unref` (unknown.rs) and `Ref::unref` (value_ref.rs) are near-identical, as are the `FromNapiValue`/`ToNapiValue` impls and Drop impls for `SymbolRef` and `UnknownRef`. The two ref types are essentially duplicated with only the inner JS-value type differing, plus the divergence noted in the unref-sequence finding. This is significant duplicate code that has already drifted (symbol unref differs from unknown unref).","fix":"Extract a generic `JsRef<T, const LEAK_CHECK: bool>` and parameterize by the wrapped value type, eliminating the duplicated Send/Drop/FromNapiValue/ToNapiValue/unref code.","locations":[{"ref":"crates/napi/src/js_values/symbol.rs:63-136","code":"   63 | pub struct SymbolRef<const LEAK_CHECK: bool = true> {\n   64 |   pub(crate) inner: sys::napi_ref,\n   65 | }\n   66 | \n   67 | unsafe impl<const LEAK_CHECK: bool> Send for SymbolRef<LEAK_CHECK> {}\n   68 | \n   69 | impl<const LEAK_CHECK: bool> Drop for SymbolRef<LEAK_CHECK> {\n   70 |   fn drop(&mut self) {\n   71 |     if LEAK_CHECK && !self.inner.is_null() {\n   72 |       eprintln!(\"ObjectRef is not unref, it considered as a memory leak\");\n   73 |     }\n   74 |   }\n   75 | }\n   76 | \n   77 | impl<const LEAK_CHECK: bool> SymbolRef<LEAK_CHECK> {\n   78 |   /// Get the object from the reference\n   79 |   pub fn get_value<'env>(&self, env: &'env Env) -> Result<JsSymbol<'env>> {\n   80 |     let mut result = ptr::null_mut();\n   81 |     check_status!(\n   82 |       unsafe { sys::napi_get_reference_value(env.0, self.inner, &mut result) },\n   83 |       \"Failed to get reference value\"\n   84 |     )?;\n   85 |     unsafe { JsSymbol::from_napi_value(env.0, result) }\n   86 |   }\n   87 | \n   88 |   /// Unref the reference\n   89 |   pub fn unref(mut self, env: &Env) -> Result<()> {\n   90 |     check_status!(\n   91 |       unsafe { sys::napi_delete_reference(env.0, self.inner) },\n   92 |       \"delete Ref failed\"\n   93 |     )?;\n   94 |     self.inner = ptr::null_mut();\n   95 |     Ok(())\n   96 |   }\n   97 | }\n   98 | \n   99 | impl<const LEAK_CHECK: bool> FromNapiValue for SymbolRef<LEAK_CHECK> {\n  100 |   unsafe fn from_napi_value(env: sys::napi_env, napi_val: sys::napi_value) -> Result<Self> {\n  101 |     let mut ref_ = ptr::null_mut();\n  102 |     check_status!(\n  103 |       unsafe { sys::napi_create_reference(env, napi_val, 1, &mut ref_) },\n  104 |       \"Failed to create reference\"\n  105 |     )?;\n  106 |     Ok(Self { inner: ref_ })\n  107 |   }\n  108 | }\n  109 | \n  110 | impl<const LEAK_CHECK: bool> ToNapiValue for &SymbolRef<LEAK_CHECK> {\n  111 |   unsafe fn to_napi_value(env: sys::napi_env, val: Self) -> Result<sys::napi_value> {\n  112 |     let mut result = ptr::null_mut();\n  113 |     check_status!(\n  114 |       unsafe { sys::napi_get_reference_value(env, val.inner, &mut result) },\n  115 |       \"Failed to get reference value\"\n  116 |     )?;\n  117 |     Ok(result)\n  118 |   }\n  119 | }\n  120 | \n  121 | impl<const LEAK_CHECK: bool> ToNapiValue for SymbolRef<LEAK_CHECK> {\n  122 |   unsafe fn to_napi_value(env: sys::napi_env, mut val: Self) -> Result<sys::napi_value> {\n  123 |     let mut result = ptr::null_mut();\n  124 |     check_status!(\n  125 |       unsafe { sys::napi_get_reference_value(env, val.inner, &mut result) },\n  126 |       \"Failed to get reference value\"\n  127 |     )?;\n  128 |     check_status!(\n  129 |       unsafe { sys::napi_delete_reference(env, val.inner) },\n  130 |       \"delete Ref failed\"\n  131 |     )?;\n  132 |     val.inner = ptr::null_mut();\n  133 |     drop(val);\n  134 |     Ok(result)\n  135 |   }\n  136 | }","lines":74,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/js_values/symbol.rs#L63-L136"},{"ref":"crates/napi/src/js_values/unknown.rs:1
