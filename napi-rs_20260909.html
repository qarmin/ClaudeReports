{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`generator_next_fn` (async iterator) converts `T::Next::from_napi_value` and on conversion error throws a JS error via `napi_throw_error`, then continues with `None` and proceeds to `spawn_future_with_callback`. After scheduling a JS error to be thrown, the function still builds and returns a promise, so a JS exception is left pending while a normal value is returned. The sync `generator_next` has the same pattern. This produces undefined behavior in the JS engine (returning a value with a pending exception).","fix":"On `from_napi_value` error, return early (`return Err(e)` / `return ptr::null_mut()`) instead of swallowing the error and continuing with `None`.","locations":[{"ref":"crates/napi/src/bindgen_runtime/async_iterator.rs:332-345","code":"  332 |     g.next(match unsafe { T::Next::from_napi_value(env, argv[0]) } {\n  333 |       Ok(input) => Some(input),\n  334 |       Err(e) => {\n  335 |         unsafe {\n  336 |           sys::napi_throw_error(\n  337 |             env,\n  338 |             format!(\"{}\", e.status).as_ptr().cast(),\n  339 |             e.reason.as_ptr().cast(),\n  340 |           )\n  341 |         };\n  342 |         None\n  343 |       }\n  344 |     })\n  345 |   };","lines":14,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/async_iterator.rs#L332-L345"},{"ref":"crates/napi/src/bindgen_runtime/iterator.rs:424-436","code":"  424 |         match unsafe { T::Next::from_napi_value(env, argv[0]) } {\n  425 |           Ok(input) => Some(input),\n  426 |           Err(e) => {\n  427 |             unsafe {\n  428 |               sys::napi_throw_error(\n  429 |                 env,\n  430 |                 format!(\"{}\", e.status).as_ptr().cast(),\n  431 |                 e.reason.as_ptr().cast(),\n  432 |               )\n  433 |             };\n  434 |             None\n  435 |           }\n  436 |         },","lines":13,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/iterator.rs#L424-L436"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In the async `generator_throw`, the `catch` future result is mapped with `obj.set(\"done\", false)` unconditionally, but per the async iterator protocol `AsyncGenerator.throw()` that resolves should generally surface the yielded value with `done` reflecting completion. More concretely, `generator_throw` always produces `{ value, done: false }` even when the user `catch` returns `Ok(None)` (which should signal completion / `done: true`). Compare with the sync `generator_throw` which correctly sets `done: true` for the `Ok(None)` case (line 647-649).","fix":"In the async `generator_throw` callback, set `done` based on whether `value` is `Some`/`None` (mirror the sync implementation), instead of hardcoding `false`.","locations":[{"ref":"crates/napi/src/bindgen_runtime/async_iterator.rs:488-493","code":"  488 |   match Env::from_raw(env).spawn_future_with_callback(caught, |env, value| {\n  489 |     let mut obj = Object::new(env)?;\n  490 |     obj.set(\"value\", value)?;\n  491 |     obj.set(\"done\", false)?;\n  492 |     Ok(obj)\n  493 |   }) {","lines":6,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/async_iterator.rs#L488-L493"},{"ref":"crates/napi/src/bindgen_runtime/iterator.rs:644-650","code":"  644 |     Ok(Some(v)) => {\n  645 |       set_generator_value(env, result, v);\n  646 |     }\n  647 |     Ok(None) => {\n  648 |       generator_state_value = true;\n  649 |     }\n  650 |   }","lines":7,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/iterator.rs#L644-L650"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`FunctionCallContext::try_get` has dead/contradictory branches. After `if index >= len { return\nErr(...) }`, the `else if index < len` is always true (since `index < len` is the negation of\n`index >= len`), so the final `else { Ok(Either::B(())) }` branch is unreachable. The method is\ndocumented/named as a fallible getter that should return `Either::B(())` when the argument is\nmissing, but it actually returns an `Err` for out-of-range indices and never yields `Either::B`.\nThis makes `try_get` behave identically to `get` (wrapped in `Either::A`) and never produce the\n\"absent\" case it was designed for.","fix":"Return `Ok(Either::B(()))` when `index >= len` instead of erroring, so the \"missing optional\nargument\" case is actually reachable; drop the redundant `else if`.","locations":[{"ref":"crates/napi/src/bindgen_runtime/js_values/function.rs:595-610","code":"  595 |   pub fn try_get<ArgType: TypeName + FromNapiValue>(\n  596 |     &self,\n  597 |     index: usize,\n  598 |   ) -> Result<Either<ArgType, ()>> {\n  599 |     let len = self.length();\n  600 |     if index >= len {\n  601 |       Err(crate::Error::new(\n  602 |         crate::Status::GenericFailure,\n  603 |         \"Arguments index out of range\".to_owned(),\n  604 |       ))\n  605 |     } else if index < len {\n  606 |       unsafe { ArgType::from_napi_value(self.env.0, self.args[index]) }.map(Either::A)\n  607 |     } else {\n  608 |       Ok(Either::B(()))\n  609 |     }\n  610 |   }","lines":16,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/js_values/function.rs#L595-L610"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The `IndexMap` `ToNapiValue` impl gates its `obj.set` fallback on\n`#[cfg(not(all(feature = \"experimental\", feature = \"node_version_detect\", feature = \"dyn-symbols\")))]`\nwhile the fast-path `if`/`else` block above it is gated on\n`#[cfg(all(feature = \"napi10\", feature = \"node_version_detect\", feature = \"dyn-symbols\", ...))]`.\nThe `experimental` feature in the `not(...)` no longer matches the `napi10` feature used by the\npositive branch (the HashMap/BTreeMap variants correctly use `napi10` in both). As a result, with\nthe `napi10`+`node_version_detect`+`dyn-symbols` feature set enabled, BOTH branches compile and each\nkey/value is inserted twice (fast path then the `not(experimental...)` fallback), or with other\nfeature combinations a key may be inserted zero times -- a copy-paste mismatch from the\nHashMap/BTreeMap impls.","fix":"Replace `feature = \"experimental\"` with `feature = \"napi10\"` in the `not(all(...))` cfg so it mirrors the HashMap/BTreeMap impls and the two branches are mutually exclusive.","locations":[{"ref":"crates/napi/src/bindgen_runtime/js_values/map.rs:200-220","code":"  200 |     for (k, v) in val.into_iter() {\n  201 |       #[cfg(all(\n  202 |         feature = \"napi10\",\n  203 |         feature = \"node_version_detect\",\n  204 |         feature = \"dyn-symbols\",\n  205 |         not(feature = \"noop\"),\n  206 |       ))]\n  207 |       {\n  208 |         if node_version.major >= 20 && node_version.minor >= 18 {\n  209 |           fast_set_property(raw_env, obj.0.value, k, v)?;\n  210 |         } else {\n  211 |           obj.set(k.as_ref(), v)?;\n  212 |         }\n  213 |       }\n  214 |       #[cfg(not(all(\n  215 |         feature = \"experimental\",\n  216 |         feature = \"node_version_detect\",\n  217 |         feature = \"dyn-symbols\"\n  218 |       )))]\n  219 |       obj.set(k.as_ref(), v)?;\n  220 |     }","lines":21,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/js_values/map.rs#L200-L220"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`IteratorValue::from_napi_value` reads `value` BEFORE checking `done`. When the JS reader yields `{ done: true, value: undefined }`, it still calls `T::from_napi_value(env, value)` on `undefined`, which for many `T` (e.g. non-Option, primitives) returns an `InvalidArg` error and turns a normal stream end into a spurious error. The struct keeps `done` separately, so `value` should only be converted when `!done`.","fix":"Short-circuit: if `done` is true, set `value: None` without attempting `T::from_napi_value`; only convert `value` when `done` is false.","locations":[{"ref":"crates/napi/src/bindgen_runtime/js_values/stream/read.rs:544-564","code":"  544 | impl<T: FromNapiValue> FromNapiValue for IteratorValue<'_, T> {\n  545 |   unsafe fn from_napi_value(env: sys::napi_env, napi_val: sys::napi_value) -> Result<Self> {\n  546 |     let mut done = ptr::null_mut();\n  547 |     check_status!(\n  548 |       unsafe { sys::napi_get_named_property(env, napi_val, c\"done\".as_ptr().cast(), &mut done) },\n  549 |       \"Get done property failed\"\n  550 |     )?;\n  551 |     let done = unsafe { FromNapiValue::from_napi_value(env, done)? };\n  552 |     let mut value = ptr::null_mut();\n  553 |     check_status!(\n  554 |       unsafe { sys::napi_get_named_property(env, napi_val, c\"value\".as_ptr().cast(), &mut value) },\n  555 |       \"Get value property failed\"\n  556 |     )?;\n  557 |     let value = unsafe { FromNapiValue::from_napi_value(env, value)? };\n  558 |     Ok(Self {\n  559 |       value,\n  560 |       done,\n  561 |       _marker: PhantomData,\n  562 |     })\n  563 |   }\n  564 | }","lines":21,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/js_values/stream/read.rs#L544-L564"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`JsBigInt::from_raw_unchecked` sets `value_type: ValueType::Object` instead of `ValueType::BigInt`, unlike `from_raw` and `from_napi_value` which both correctly use `ValueType::BigInt`. Any code relying on the cached `value_type` of a BigInt obtained via the unchecked path will observe `Object`.","fix":"Set `value_type: ValueType::BigInt` in `from_raw_unchecked` to match the other two constructors.","locations":[{"ref":"crates/napi/src/js_values/bigint.rs:59-72","code":"   59 |   pub(crate) fn from_raw_unchecked(\n   60 |     env: sys::napi_env,\n   61 |     value: sys::napi_value,\n   62 |     word_count: usize,\n   63 |   ) -> Self {\n   64 |     Self {\n   65 |       raw: Value {\n   66 |         env,\n   67 |         value,\n   68 |         value_type: ValueType::Object,\n   69 |       },\n   70 |       word_count,\n   71 |     }\n   72 |   }","lines":14,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/js_values/bigint.rs#L59-L72"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `deserialize_any`, the integer detection `(js_number.trunc() - js_number).abs() < f64::EPSILON` is incorrect for large magnitudes. `f64::EPSILON` (~2.2e-16) is the gap near 1.0; for numbers with magnitude >= 2^52 the spacing between representable doubles exceeds 1, so `trunc()-x` is exactly 0 and the branch is fine there - but for moderately large fractional numbers (e.g. 1e15 + 0.5 is not representable distinctly, while values like 4503599627370497.0 are), and more importantly for any non-integer with magnitude > ~4.5 the absolute difference can exceed EPSILON correctly, yet for fractional values just above 1.0 the comparison against a fixed tiny EPSILON misclassifies. The robust check is `js_number.fract() == 0.0`. Current code can misclassify fractional doubles as i64 (truncating data) or vice versa.","fix":"Replace with `if js_number.fract() == 0.0 && js_number >= i64::MIN as f64 && js_number <= i64::MAX as f64 { visit_i64 } else { visit_f64 }` to avoid both misclassification and the lossy `as i64` cast on out-of-range values.","locations":[{"ref":"crates/napi/src/js_values/de.rs:33-40","code":"   33 |       ValueType::Number => {\n   34 |         let js_number: f64 = unsafe { FromNapiValue::from_napi_value(self.0.env, self.0.value)? };\n   35 |         if (js_number.trunc() - js_number).abs() < f64::EPSILON {\n   36 |           visitor.visit_i64(js_number as i64)\n   37 |         } else {\n   38 |           visitor.visit_f64(js_number)\n   39 |         }\n   40 |       }","lines":8,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/js_values/de.rs#L33-L40"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`JsObjectAccess::next_value_seed` error message has the index and range swapped: `format!(\"Index:{} out of range: {}\", self.property_len, self.idx)` prints the length where the index should be and vice versa. Misleading diagnostic. (The guard `self.idx >= self.property_len` is also logically unreachable because `next_key_seed` returns `None` first, but if reached the message is backwards.)","fix":"Swap the arguments: `format!(\"Index:{} out of range: {}\", self.idx, self.property_len)`.","locations":[{"ref":"crates/napi/src/js_values/de.rs:390-394","code":"  390 |     if self.idx >= self.property_len {\n  391 |       return Err(Error::new(\n  392 |         Status::InvalidArg,\n  393 |         format!(\"Index:{} out of range: {}\", self.property_len, self.idx),\n  394 |       ));","lines":5,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/js_values/de.rs#L390-L394"}]},
{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`JsStringLatin1::into_latin1_string` allocates `vec![0; self.len()*2 + 1]` and converts via `encoding_rs::mem::convert_latin1_to_str`, but then returns the String with its full padded length (capacity `len*2+1`), never truncating to the number of bytes actually written by `convert_latin1_to_str` (its return value, the written length, is discarded). The resulting String contains trailing NUL bytes for any latin1 input whose UTF-8 expansion is shorter than `len*2`, i.e. essentially all ASCII inputs (which expand 1:1, leaving ~len trailing NULs).","fix":"Capture the written length returned by `convert_latin1_to_str` and `dst_str.truncate(written)` (or build the String from the written prefix) before returning.","locations":[{"ref":"crates/napi/src/js_values/string/latin1.rs:417-422","code":"  417 |   #[cfg(feature = \"latin1\")]\n  418 |   pub fn into_latin1_string(self) -> Result<String> {\n  419 |     let mut dst_str = unsafe { String::from_utf8_unchecked(vec![0; self.len() * 2 + 1]) };\n  420 |     encoding_rs::mem::convert_latin1_to_str(self.buf, dst_str.as_mut_str());\n  421 |     Ok(dst_str)\n  422 |   }","lines":6,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/js_values/string/latin1.rs#L417-L422"}]},
{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`into_utf16` slices the result buffer with length `len` (= utf16_len + 1), which INCLUDES the trailing NUL terminator code unit written by napi, whereas `into_utf8` and `into_latin1` correctly slice with `written_char_count` (excluding the terminator). Consequently `JsStringUtf16::as_slice()`/`len()`/`Deref`/`AsRef`/`From<_> for Vec<u16>` all expose an extra trailing 0 code unit. `as_str()` happens to compensate via `split_last()`, but raw consumers of the slice get a spurious NUL and an off-by-one length.","fix":"Use `written_char_count` (not `len`) as the slice length in `into_utf16`, mirroring `into_utf8`/`into_latin1`, and drop the `split_last` compensation in `as_str` (or keep but make slice length match the actual character count).","locations":[{"ref":"crates/napi/src/js_values/string/mod.rs:120-140","code":"  120 |   pub fn into_utf16(self) -> Result<JsStringUtf16<'env>> {\n  121 |     let mut written_char_count = 0usize;\n  122 |     let len = self.utf16_len()? + 1;\n  123 |     let mut result = vec![0; len];\n  124 |     let buf_ptr = result.as_mut_ptr();\n  125 |     check_status!(unsafe {\n  126 |       sys::napi_get_value_string_utf16(\n  127 |         self.0.env,\n  128 |         self.0.value,\n  129 |         buf_ptr,\n  130 |         len,\n  131 |         &mut written_char_count,\n  132 |       )\n  133 |     })?;\n  134 | \n  135 |     Ok(JsStringUtf16 {\n  136 |       inner: self,\n  137 |       buf: unsafe { std::slice::from_raw_parts(buf_ptr.cast(), len) },\n  138 |       _inner_buf: result,\n  139 |     })\n  140 |   }","lines":21,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/js_values/string/mod.rs#L120-L140"},{"ref":"crates/napi/src/js_values/string/utf16.rs:405-415","code":"  405 |   pub fn as_slice(&self) -> &[u16] {\n  406 |     self.buf\n  407 |   }\n  408 | \n  409 |   pub fn len(&self) -> usize {\n  410 |     self.buf.len()\n  411 |   }\n  412 | \n  413 |   pub fn is_empty(&self) -> bool {\n  414 |     self.buf.is_empty()\n  415 |   }","lines":11,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/js_values/string/utf16.rs#L405-L415"}]},
{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"On the WASM path of `JsStringUtf16::from_data`/`from_external` (and latin1 equivalents), `buf` is built with `std::slice::from_raw_parts(data_ptr/buf_ptr, len)` pointing into `buffer`/`data` which is then moved into `_inner_buf`. Same owned-Vec-aliased-by-raw-slice pattern as the into_utf16 finding: the wrapper holds both an owning Vec (`_inner_buf`) and a raw slice (`buf`) into the same allocation. Moving the Vec into the struct field keeps the pointer valid (no realloc), but it is fragile aliasing; any future code that mutates `_inner_buf` would invalidate `buf`.","fix":"Avoid storing a raw `from_raw_parts` slice aliasing an owned Vec field; instead store only the Vec and provide `as_slice()` returning `_inner_buf.as_slice()`, eliminating the self-referential raw pointer.","locations":[{"ref":"crates/napi/src/js_values/string/utf16.rs:96-107","code":"   96 |       Ok(Self {\n   97 |         inner: JsString(\n   98 |           Value {\n   99 |             env: env.0,\n  100 |             value: raw_value,\n  101 |             value_type: ValueType::String,\n  102 |           },\n  103 |           std::marker::PhantomData,\n  104 |         ),\n  105 |         buf: unsafe { std::slice::from_raw_parts(data_ptr, len) },\n  106 |         _inner_buf: data,\n  107 |       })","lines":12,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/js_values/string/utf16.rs#L96-L107"},{"ref":"crates/napi/src/js_values/string/utf16.rs:284-295","code":"  284 |       Ok(Self {\n  285 |         inner: JsString(\n  286 |           Value {\n  287 |             env: env.0,\n  288 |             value: raw_value,\n  289 |             value_type: ValueType::String,\n  290 |           },\n  291 |           std::marker::PhantomData,\n  292 |         ),\n  293 |         buf: unsafe { std::slice::from_raw_parts(buf_ptr, buf_len) },\n  294 |         _inner_buf: buffer,\n  295 |       })","lines":12,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/js_values/string/utf16.rs#L284-L295"},{"ref":"crates/napi/src/js_values/string/latin1.rs:96-107","code":"   96 |       Ok(Self {\n   97 |         inner: JsString(\n   98 |           Value {\n   99 |             env: env.0,\n  100 |             value: raw_value,\n  101 |             value_type: ValueType::String,\n  102 |           },\n  103 |           std::marker::PhantomData,\n  104 |         ),\n  105 |         buf: unsafe { std::slice::from_raw_parts(data_ptr, len) },\n  106 |         _inner_buf: data,\n  107 |       })","lines":12,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/js_values/string/latin1.rs#L96-L107"},{"ref":"crates/napi/src/js_values/string/latin1.rs:284-295","code":"  284 |       Ok(Self {\n  285 |         inner: JsString(\n  286 |           Value {\n  287 |             env: env.0,\n  288 |             value: raw_value,\n  289 |             value_type: ValueType::String,\n  290 |           },\n  291 |           std::marker::PhantomData,\n  292 |         ),\n  293 |         buf: unsafe { std::slice::from_raw_parts(buf_ptr, buf_len) },\n  294 |         _inner_buf: buffer,\n  295 |       })","lines":12,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/js_values/string/latin1.rs#L284-L295"}]},
{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`thread_finalize_cb` upgrades the `Weak<ThreadsafeFunctionHandle>` and, if the\nupgrade succeeds, sets `aborted = true`. But it unconditionally drops the boxed\nuser callback (`finalize_hint`). If the upgrade FAILS (handle already dropped),\nthat is fine. The subtle issue: the `if !*aborted_guard { *aborted_guard = true }`\nblock is pointless — it always just sets aborted to true and the inner `if` is\nredundant (it sets true only when already false, but the net effect is identical\nto an unconditional `*aborted_guard = true`). Minor, but it obscures intent and\nsuggests the author intended to do something conditionally that was lost.","fix":"Replace the redundant `if !*aborted_guard { *aborted_guard = true; }` with a plain `*aborted_guard = true;`.","locations":[{"ref":"crates/napi/src/threadsafe_function.rs:793-799","code":"  793 |   if let Some(handle) = handle_option {\n  794 |     handle.with_write_aborted(|mut aborted_guard| {\n  795 |       if !*aborted_guard {\n  796 |         *aborted_guard = true;\n  797 |       }\n  798 |     });\n  799 |   }","lines":7,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/threadsafe_function.rs#L793-L799"}]},
{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`ensurePath` checks `dryRun` twice redundantly: the outer `if (!dryRun)` already guards, then inside it re-checks `if (!dryRun)` before mkdir. The inner check is dead (always true). Harmless but indicates copy/paste; also the `statAsync(path, {})` passes an empty options object unnecessarily.","fix":"Remove the redundant inner `if (!dryRun)` guard.","locations":[{"ref":"cli/src/api/new.ts:868-899","code":"  868 | async function ensurePath(path: string, dryRun = false) {\n  869 |   const stat = await statAsync(path, {}).catch(() => undefined)\n  870 | \n  871 |   // file descriptor exists\n  872 |   if (stat) {\n  873 |     if (stat.isFile()) {\n  874 |       throw new Error(\n  875 |         `Path ${path} for creating new napi-rs project already exists and it's not a directory.`,\n  876 |       )\n  877 |     } else if (stat.isDirectory()) {\n  878 |       const files = await readdirAsync(path)\n  879 |       if (files.length) {\n  880 |         throw new Error(\n  881 |           `Path ${path} for creating new napi-rs project already exists and it's not empty.`,\n  882 |         )\n  883 |       }\n  884 |     }\n  885 |   }\n  886 | \n  887 |   if (!dryRun) {\n  888 |     try {\n  889 |       debug(`Try to create target directory: ${path}`)\n  890 |       if (!dryRun) {\n  891 |         await mkdirAsync(path, { recursive: true })\n  892 |       }\n  893 |     } catch (e) {\n  894 |       throw new Error(`Failed to create target directory: ${path}`, {\n  895 |         cause: e,\n  896 |       })\n  897 |     }\n  898 |   }\n  899 | }","lines":32,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/cli/src/api/new.ts#L868-L899"}]},
{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`getRepoInfo` calls `execSync('git log -1 --pretty=%B')` at the top unconditionally, even when `tagStyle` is 'npm' (the non-lerna path) where `headCommit` is never used. This runs git on every pre-publish invocation including non-lerna repos, and will throw if not in a git repo even though the npm tag style does not need git history.","fix":"Only invoke `git log` inside the `tagStyle === 'lerna'` branch where headCommit is actually consumed.","locations":[{"ref":"cli/src/api/pre-publish.ts:568-613","code":"  568 |   function getRepoInfo(packageName: string, version: string) {\n  569 |     const headCommit = execSync('git log -1 --pretty=%B', {\n  570 |       cwd: options.cwd,\n  571 |       encoding: 'utf-8',\n  572 |     }).trim()\n  573 | \n  574 |     const { GITHUB_REPOSITORY } = process.env\n  575 |     if (!GITHUB_REPOSITORY) {\n  576 |       return {\n  577 |         owner: null,\n  578 |         repo: null,\n  579 |         pkgInfo: { name: null, version: null, tag: null },\n  580 |       }\n  581 |     }\n  582 |     debug(`Github repository: ${GITHUB_REPOSITORY}`)\n  583 |     const [owner, repo] = GITHUB_REPOSITORY.split('/')\n  584 |     const octokit = new Octokit({\n  585 |       auth: process.env.GITHUB_TOKEN,\n  586 |     })\n  587 |     let pkgInfo: PackageInfo | undefined\n  588 |     if (options.tagStyle === 'lerna') {\n  589 |       const packagesToPublish = headCommit\n  590 |         .split('\\n')\n  591 |         .map((line) => line.trim())\n  592 |         .filter((line, index) => line.length && index)\n  593 |         .map((line) => line.substring(2))\n  594 |         .map(parseTag)\n  595 | \n  596 |       pkgInfo = packagesToPublish.find(\n  597 |         (pkgInfo) => pkgInfo.name === packageName,\n  598 |       )\n  599 | \n  600 |       if (!pkgInfo) {\n  601 |         throw new TypeError(\n  602 |           `No release commit found with ${packageName}, original commit info: ${headCommit}`,\n  603 |         )\n  604 |       }\n  605 |     } else {\n  606 |       pkgInfo = {\n  607 |         tag: `v${version}`,\n  608 |         version,\n  609 |         name: packageName,\n  610 |       }\n  611 |     }\n  612 |     return { owner, repo, pkgInfo, octokit }\n  613 |   }","lines":46,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/cli/src/api/pre-publish.ts#L568-L613"}]},
{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"Lerna tag parsing in `getRepoInfo` filters commit body lines with `.filter((line, index) => line.length && index)` which drops the first line (index 0) of the commit body, then `.map((line) => line.substring(2))` blindly strips the first two characters of every remaining line (assuming a `- ` markdown bullet prefix). Any release-commit body line that is non-empty but does not start with a 2-char bullet (e.g. wrapped lines, differently formatted changelogs) will be mis-parsed into a wrong package name/version, silently failing to find the package and throwing `No release commit found`.","fix":"Parse only lines matching an explicit bullet pattern (e.g. /^[-*] (.+)/) rather than assuming index>0 and a fixed 2-char prefix.","locations":[{"ref":"cli/src/api/pre-publish.ts:588-604","code":"  588 |     if (options.tagStyle === 'lerna') {\n  589 |       const packagesToPublish = headCommit\n  590 |         .split('\\n')\n  591 |         .map((line) => line.trim())\n  592 |         .filter((line, index) => line.length && index)\n  593 |         .map((line) => line.substring(2))\n  594 |         .map(parseTag)\n  595 | \n  596 |       pkgInfo = packagesToPublish.find(\n  597 |         (pkgInfo) => pkgInfo.name === packageName,\n  598 |       )\n  599 | \n  600 |       if (!pkgInfo) {\n  601 |         throw new TypeError(\n  602 |           `No release commit found with ${packageName}, original commit info: ${headCommit}`,\n  603 |         )\n  604 |       }","lines":17,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/cli/src/api/pre-publish.ts#L588-L604"}]},
{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`pick` is typed `Pick<O, K>` but its accumulator is initialized as `{} as O` and indiscriminately copies `o[key]` for every requested key even when the key is absent on `o` (sets `acc[key] = undefined`). Callers like create-npm-dirs spread the result into a package.json object, so absent fields become explicit `undefined` properties; after `JSON.stringify` they vanish (acceptable), but `pick(packageJson.publishConfig, 'registry', 'access')` can yield `{ registry: undefined, access: undefined }` which is then assigned to `publishConfig`, emitting an empty object rather than omitting it.","fix":"Only copy keys that exist (`if (key in o) acc[key] = o[key]`), or skip undefined values, so absent fields are omitted rather than set to undefined.","locations":[{"ref":"cli/src/utils/misc.ts:6118-6123","code":" 6118 | export function pick<O, K extends keyof O>(o: O, ...keys: K[]): Pick<O, K> {\n 6119 |   return keys.reduce((acc, key) => {\n 6120 |     acc[key] = o[key]\n 6121 |     return acc\n 6122 |   }, {} as O)\n 6123 | }","lines":6,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/cli/src/utils/misc.ts#L6118-L6123"},{"ref":"cli/src/api/create-npm-dirs.ts:488-494","code":"  488 |     if (packageJson.publishConfig) {\n  489 |       scopedPackageJson.publishConfig = pick(\n  490 |         packageJson.publishConfig,\n  491 |         'registry',\n  492 |         'access',\n  493 |       )\n  494 |     }","lines":7,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/cli/src/api/create-npm-dirs.ts#L488-L494"}]},
{"id":"LOGIC_33","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`parseTriple` for arm/eabi targets does `rawTriple.endsWith('eabi') ? \\`${rawTriple.slice(0, -4)}-eabi\\` : rawTriple` to force a separate abi segment, but for triples ending in `eabihf` (e.g. `armv7-unknown-linux-gnueabihf`, `armv7-unknown-linux-musleabihf`, which are in AVAILABLE_TARGETS) `endsWith('eabi')` is false, so they fall through to the normal split where abi becomes `gnueabihf`/`musleabihf`. This is inconsistent handling versus `armv7-linux-androideabi` (ends with `eabi`) which gets split into `...-eabi` and then SUB_SYSTEMS reclassifies. The slice(-4) assumes exactly 'eabi' length; any future 'eabi'-suffixed-with-more triple is mishandled.","fix":"Handle the eabi/eabihf family explicitly rather than a fixed slice(-4); verify androideabi vs gnueabihf produce the intended platformArchABI.","locations":[{"ref":"cli/src/utils/target.ts:334-356","code":"  334 |   const triple = rawTriple.endsWith('eabi')\n  335 |     ? `${rawTriple.slice(0, -4)}-eabi`\n  336 |     : rawTriple\n  337 |   const triples = triple.split('-')\n  338 |   let cpu: string\n  339 |   let sys: string\n  340 |   let abi: string | null = null\n  341 |   if (triples.length === 2) {\n  342 |     // aarch64-fuchsia\n  343 |     // ^ cpu   ^ sys\n  344 |     ;[cpu, sys] = triples\n  345 |   } else {\n  346 |     // aarch64-unknown-linux-musl\n  347 |     // ^ cpu   ^vendor ^ sys ^ abi\n  348 |     // aarch64-apple-darwin\n  349 |     // ^ cpu         ^ sys  (abi is None)\n  350 |     ;[cpu, , sys, abi = null] = triples\n  351 |   }\n  352 | \n  353 |   if (abi && SUB_SYSTEMS.has(abi)) {\n  354 |     sys = abi\n  355 |     abi = null\n  356 |   }","lines":23,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/cli/src/utils/target.ts#L334-L356"}]},
{"id":"LOGIC_34","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`correctStringIdent` treats any line ending with `=` as opening a new indentation block (`isTypeDeclaration`) and increments bracketDepth, but never decrements for that case (only `}`-terminated lines decrement). A `type X =\\n  | A\\n  | B` declaration thus permanently increases bracketDepth for the remainder of the file's rendering pass within that string, over-indenting everything that follows. Because prettyPrint calls it per-entry the blast radius is limited to one entry, but multi-line type aliases within a single entry will mis-indent subsequent lines.","fix":"Track when a `=`-opened block ends (e.g. on a terminating line without a trailing operator) and decrement bracketDepth accordingly, or handle type-alias continuation lines explicitly.","locations":[{"ref":"cli/src/utils/typegen.ts:1423-1466","code":" 1423 | export function correctStringIdent(src: string, ident: number): string {\n 1424 |   let bracketDepth = 0\n 1425 |   const result = src\n 1426 |     .split('\\n')\n 1427 |     .map((line) => {\n 1428 |       line = line.trim()\n 1429 |       if (line === '') {\n 1430 |         return ''\n 1431 |       }\n 1432 | \n 1433 |       const isInMultilineComment = line.startsWith('*')\n 1434 |       const isClosingBracket = line.endsWith('}')\n 1435 |       const isOpeningBracket = line.endsWith('{')\n 1436 |       const isTypeDeclaration = line.endsWith('=')\n 1437 |       const isTypeVariant = line.startsWith('|')\n 1438 | \n 1439 |       let rightIndent = ident\n 1440 |       if ((isOpeningBracket || isTypeDeclaration) && !isInMultilineComment) {\n 1441 |         bracketDepth += 1\n 1442 |         rightIndent += (bracketDepth - 1) * 2\n 1443 |       } else {\n 1444 |         if (\n 1445 |           isClosingBracket &&\n 1446 |           bracketDepth > 0 &&\n 1447 |           !isInMultilineComment &&\n 1448 |           !isTypeVariant\n 1449 |         ) {\n 1450 |           bracketDepth -= 1\n 1451 |         }\n 1452 |         rightIndent += bracketDepth * 2\n 1453 |       }\n 1454 | \n 1455 |       if (isInMultilineComment) {\n 1456 |         rightIndent += 1\n 1457 |       }\n 1458 | \n 1459 |       const s = `${' '.repeat(rightIndent)}${line}`\n 1460 | \n 1461 |       return s\n 1462 |     })\n 1463 |     .join('\\n')\n 1464 | \n 1465 |   return result\n 1466 | }","lines":44,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/cli/src/utils/typegen.ts#L1423-L1466"}]},
{"id":"LOGIC_35","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`format_js_property_name` only quotes a property name when it starts with a\ndigit or contains one of an explicit blacklist of punctuation chars. Control\ncharacters (e.g. newline `\\n`, tab `\\t`, NUL) and the Unicode line/paragraph\nseparators are NOT in the blacklist and do not start with a digit, so a field\nwhose `js_name` contains a control character is emitted unquoted into the\n`.d.ts`, producing syntactically invalid TypeScript. The doc comment frames the\nblacklist approach as deliberately permissive for Unicode letters, but it also\nsilently permits invalid control chars.","fix":"Also force quoting when the name contains any ASCII control char / Unicode separator (e.g. `c.is_control()`), in addition to the punctuation blacklist.","locations":[{"ref":"crates/backend/src/typegen.rs:92-143","code":"   92 | pub fn format_js_property_name(js_name: &str) -> String {\n   93 |   // Check if first character is a digit\n   94 |   let starts_with_digit = js_name.chars().next().is_some_and(|c| c.is_ascii_digit());\n   95 | \n   96 |   // Check for specific characters that are known to be invalid in JS identifiers\n   97 |   // We explicitly check for invalid characters rather than trying to enumerate all\n   98 |   // valid ones, which allows Unicode letters while catching common problematic chars.\n   99 |   let has_invalid_chars = js_name.chars().any(|c| {\n  100 |     matches!(\n  101 |       c,\n  102 |       '-' | ':'\n  103 |         | ' '\n  104 |         | '.'\n  105 |         | '['\n  106 |         | ']'\n  107 |         | '@'\n  108 |         | '#'\n  109 |         | '$'  // Maintaining backward compatibility: $ was quoted in original implementation\n  110 |         | '%'\n  111 |         | '^'\n  112 |         | '&'\n  113 |         | '*'\n  114 |         | '('\n  115 |         | ')'\n  116 |         | '+'\n  117 |         | '='\n  118 |         | '{'\n  119 |         | '}'\n  120 |         | '|'\n  121 |         | '\\\\'\n  122 |         | ';'\n  123 |         | '\\''\n  124 |         | '\"'\n  125 |         | '<'\n  126 |         | '>'\n  127 |         | ','\n  128 |         | '?'\n  129 |         | '/'\n  130 |         | '~'\n  131 |         | '`'\n  132 |         | '!'\n  133 |     )\n  134 |   });\n  135 | \n  136 |   let needs_quotes = starts_with_digit || has_invalid_chars;\n  137 | \n  138 |   if needs_quotes {\n  139 |     format!(\"'{js_name}'\")\n  140 |   } else {\n  141 |     js_name.to_string()\n  142 |   }\n  143 | }","lines":52,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/backend/src/typegen.rs#L92-L143"}]},
{"id":"LOGIC_36","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`handle_async_task_type` and `handle_reference_type` both look up the resolved\ntype in `TASK_STRUCTS`, but `TASK_STRUCTS` is only populated by\n`NapiImpl::to_type_def` when an impl with `task_output_type` is processed. Type\ngeneration order across files is not guaranteed: if a function returning\n`AsyncTask<MyTask>` is processed before the `impl Task for MyTask` block's\n`to_type_def` runs, the lookup misses and the type degrades to\n`Promise<unknown>` (async task) instead of the correct `Promise<Output>`. This is\nan order-dependent correctness issue in the thread-local registry approach.\nSimilarly `CLASS_STRUCTS` / `ALIAS` are populated as a side effect of\n`to_type_def`, so cross-references depend on processing order.","fix":"Run type generation in two passes: first populate all registries (TASK_STRUCTS / CLASS_STRUCTS / ALIAS), then resolve types; or document/enforce the ordering invariant.","locations":[{"ref":"crates/backend/src/typegen.rs:546-573","code":"  546 | fn handle_async_task_type(args: &[(String, bool)]) -> Option<(String, bool)> {\n  547 |   r#struct::TASK_STRUCTS.with(|t| {\n  548 |     let (output_type, _) = args.first()?.to_owned();\n  549 |     if let Some(o) = t.borrow().get(&output_type) {\n  550 |       Some((format!(\"Promise<{o}>\"), false))\n  551 |     } else {\n  552 |       Some((\"Promise<unknown>\".to_owned(), false))\n  553 |     }\n  554 |   })\n  555 | }\n  556 | \n  557 | /// Handles conversion of Reference<T> and WeakReference<T>\n  558 | fn handle_reference_type(args: &[(String, bool)], rust_ty: String) -> Option<(String, bool)> {\n  559 |   r#struct::TASK_STRUCTS.with(|t| {\n  560 |     // Reference<T> => T\n  561 |     if let Some(arg) = args.first() {\n  562 |       let (output_type, _) = arg.to_owned();\n  563 |       if let Some(o) = t.borrow().get(&output_type) {\n  564 |         Some((o.to_owned(), false))\n  565 |       } else {\n  566 |         Some((output_type, false))\n  567 |       }\n  568 |     } else {\n  569 |       // Not NAPI-RS `Reference`\n  570 |       Some((rust_ty, false))\n  571 |     }\n  572 |   })\n  573 | }","lines":28,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/backend/src/typegen.rs#L546-L573"},{"ref":"crates/backend/src/typegen/struct.rs:89-105","code":"   89 | impl ToTypeDef for NapiImpl {\n   90 |   fn to_type_def(&self) -> Option<TypeDef> {\n   91 |     if let Some(output_type) = &self.task_output_type {\n   92 |       TASK_STRUCTS.with(|t| {\n   93 |         let (resolved_type, is_optional) = ty_to_ts_type(output_type, false, true, false);\n   94 |         t.borrow_mut().insert(\n   95 |           self.name.to_string(),\n   96 |           if resolved_type == \"undefined\" {\n   97 |             \"void\".to_owned()\n   98 |           } else if is_optional {\n   99 |             format!(\"{resolved_type} | null\")\n  100 |           } else {\n  101 |             resolved_type\n  102 |           },\n  103 |         );\n  104 |       });\n  105 |     }","lines":17,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/backend/src/typegen/struct.rs#L89-L105"}]},
{"id":"LOGIC_37","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`ty_to_ts_type` for an empty tuple `()` returns `\"undefined\"` when\n`convert_tuple_to_variadic` is false (line 823), but for `Type::Reference` to a\n`()` and several other positions the `is_return_ty` flag that would map `()` to\n`void` is only honored inside `handle_known_type` (`rust_ty == \"()\"`), not in\nthe `Type::Tuple` arm. So a return type written as the tuple literal `()`\n(rather than the path `()`/`Undefined`) yields `undefined` in non-variadic\ncontext even when `is_return_ty` is true, whereas a unit return via the\nprimitive table maps to `void`. The two spellings of \"unit\" produce different\nTS (`undefined` vs `void`).","fix":"In the empty-tuple branch, honor `is_return_ty` (return `void`) for consistency with the `()` path handling in `handle_known_type`.","locations":[{"ref":"crates/backend/src/typegen.rs:854-864","code":"  854 |     Type::Tuple(tuple) => {\n  855 |       if tuple.elems.is_empty() {\n  856 |         if convert_tuple_to_variadic {\n  857 |           if is_return_ty {\n  858 |             (\"void\".to_owned(), false)\n  859 |           } else {\n  860 |             (\"\".to_owned(), false)\n  861 |           }\n  862 |         } else {\n  863 |           (\"undefined\".to_owned(), false)\n  864 |         }","lines":11,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/backend/src/typegen.rs#L854-L864"},{"ref":"crates/backend/src/typegen.rs:630-632","code":"  630 |   if rust_ty == \"()\" && is_return_ty {\n  631 |     return Some((\"void\".to_owned(), false));\n  632 |   }","lines":3,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/backend/src/typegen.rs#L630-L632"}]},
{"id":"LOGIC_38","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`gen_ts_variants` (enum) interpolates the string value directly with single\nquotes and no escaping:\n\n    NapiEnumValue::String(string) => format!(\"'{string}'\"),\n\nIf a string-enum variant value contains a single quote or backslash, the\ngenerated TypeScript literal is malformed. Similarly `typegen/struct.rs`\nstructured-enum discriminant values are emitted as `'{...}'` without escaping.\nUnlike `escape_json`/`format_js_property_name`, there is no escaping pass for\nthese embedded string literals.","fix":"Escape the value (at minimum backslash and single-quote) before wrapping in quotes, or reuse a shared JS-string-literal escaper.","locations":[{"ref":"crates/backend/src/typegen/enum.rs:37-41","code":"   37 |         let val = match &v.val {\n   38 |           NapiEnumValue::Number(num) => format!(\"{num}\"),\n   39 |           NapiEnumValue::String(string) => format!(\"'{string}'\"),\n   40 |         };\n   41 |         format!(\"{}{} = {}\", JSDoc::new(&v.comments), v.name, val)","lines":5,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/backend/src/typegen/enum.rs#L37-L41"},{"ref":"crates/backend/src/typegen/struct.rs:274-282","code":"  274 |           let def = iter::once(format!(\n  275 |             \"{}: '{}'\",\n  276 |             structured_enum.discriminant,\n  277 |             if let Some(case) = structured_enum.discriminant_case {\n  278 |               to_case(variant.name.to_string(), case)\n  279 |             } else {\n  280 |               variant.name.to_string()\n  281 |             }\n  282 |           ))","lines":9,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/backend/src/typegen/struct.rs#L274-L282"}]},
{"id":"LOGIC_39","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`gen_callback_type` passes callback argument types through `FnArgList`, which\ntreats an arg literally named `this` specially (pulls it out as a TS `this:`\nparameter). Callback args are auto-named `arg0`, `arg1`, ... so this never\ntriggers for them, but `FnArgList`'s `from_iter` also recomputes\n`last_required` to drop trailing-optional `?` markers based on argument order.\nFor a synthesized callback type like `(arg0: A, arg1?: B) => R`, if a later\nnon-optional arg follows an optional one, the optional marker is silently\ndropped - which is correct for TS call signatures, but the callback return type\nis computed with `ty_to_ts_type(ty, true, ...)` (is_return_ty=true) whereas the\nargs use `false`; an `Option<T>` return becomes `T | null` while an `Option<T>`\narg becomes `T | undefined | null`, an asymmetry that is easy to overlook but\nintentional. Flagging the `this`-name coupling as a latent footgun: a callback\nwhose first param is destructured/named `this` via `ts_arg_type` override would\nbe mis-handled.","fix":"Document that `FnArgList`'s `this` extraction is keyed purely on the literal arg name `\"this\"`; consider a dedicated flag instead of a magic string to avoid accidental matches.","locations":[{"ref":"crates/backend/src/typegen/fn.rs:120-141","code":"  120 | fn gen_callback_type(callback: &CallbackArg) -> String {\n  121 |   format!(\n  122 |     \"({args}) => {ret}\",\n  123 |     args = &callback\n  124 |       .args\n  125 |       .iter()\n  126 |       .enumerate()\n  127 |       .map(|(i, arg)| {\n  128 |         let (ts_type, is_optional) = ty_to_ts_type(arg, false, false, false);\n  129 |         FnArg {\n  130 |           arg: format!(\"arg{i}\"),\n  131 |           ts_type,\n  132 |           is_optional,\n  133 |         }\n  134 |       })\n  135 |       .collect::<FnArgList>(),\n  136 |     ret = match &callback.ret {\n  137 |       Some(ty) => ty_to_ts_type(ty, true, false, false).0,\n  138 |       None => \"void\".to_owned(),\n  139 |     }\n  140 |   )\n  141 | }","lines":22,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/backend/src/typegen/fn.rs#L120-L141"},{"ref":"crates/backend/src/typegen/fn.rs:55-78","code":"   55 | impl FromIterator<FnArg> for FnArgList {\n   56 |   fn from_iter<T: IntoIterator<Item = FnArg>>(iter: T) -> Self {\n   57 |     let mut args = Vec::new();\n   58 |     let mut this = None;\n   59 |     for arg in iter.into_iter() {\n   60 |       if arg.arg != \"this\" {\n   61 |         args.push(arg);\n   62 |       } else {\n   63 |         this = Some(arg);\n   64 |       }\n   65 |     }\n   66 |     let last_required = args\n   67 |       .iter()\n   68 |       .enumerate()\n   69 |       .rfind(|(_, arg)| !arg.is_optional)\n   70 |       .map(|(i, _)| i);\n   71 |     FnArgList {\n   72 |       this,\n   73 |       args,\n   74 |       last_required,\n   75 |       is_setter: false,\n   76 |     }\n   77 |   }\n   78 | }","lines":24,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/backend/src/typegen/fn.rs#L55-L78"}]},
{"id":"LOGIC_40","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"Silent error suppression: in `setup()`, android setup is invoked as `if android::setup().is_ok() {}` - the empty body and discarded `Err` mean any failure from `android::setup()` (which returns `io::Result`) is completely ignored, with no warning emitted. A failure to set up the android link search would produce a confusing later link error rather than a clear build-script diagnostic.","fix":"Handle the error, e.g. `if let Err(e) = android::setup() { println!(\"cargo:warning=android setup failed: {e}\"); }`.","locations":[{"ref":"crates/build/src/lib.rs:28-29","code":"   28 |   match target_os.as_str() {\n   29 |     \"android\" => if android::setup().is_ok() {},","lines":2,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/build/src/lib.rs#L28-L29"}]},
{"id":"LOGIC_41","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`use_nullable` defaults to `false` while `enumerable`/`writable`/`configurable`/`object_from_js`/`object_to_js` default to `true` (attrs.rs:62-80). The bare-flag form `#[napi(use_nullable)]` (no `= true`) goes through the Option<bool> parser which, with no `=`, returns `Some($default_value)` = `Some(false)`. So writing `#[napi(use_nullable)]` as a bare flag yields `false`, i.e. the flag does nothing when written bare - a surprising footgun where presence of the flag does not enable it.","fix":"Either make bare presence of `use_nullable` mean `true` (special-case the no-`=` branch for flags whose default is false), or document that `use_nullable` must be written as `use_nullable = true`.","locations":[{"ref":"crates/macro/src/parser/attrs.rs:81","code":"   81 |       (use_nullable, UseNullable(Span, Option<bool>), false),","lines":1,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/macro/src/parser/attrs.rs#L81"},{"ref":"crates/macro/src/parser/attrs.rs:498-500","code":"  498 |           } else {\n  499 |             return Ok(BindgenAttr::$variant(attr_span, Some($default_value)))\n  500 |           }","lines":3,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/macro/src/parser/attrs.rs#L498-L500"}]},
{"id":"LOGIC_42","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The Option<bool> attribute parser treats a non-bool RHS after `=` as `true` rather than an error: `match input.parse::<syn::LitBool>() { Ok -> value, Err(_) -> (true, ...) }` parses any non-bool ident (e.g. `writable = yes`, `enumerable = foo`) and silently records `true`. A typo'd value is accepted and inverted-from-intent rather than rejected with a diagnostic. This affects `enumerable`, `writable`, `configurable`, `object_from_js`, `object_to_js`.","fix":"On the `Err(_)` branch, return a `syn::Error` (\"expected a boolean literal\") instead of defaulting the value to `true`.","locations":[{"ref":"crates/macro/src/parser/attrs.rs:488-501","code":"  488 |         (@parser $variant:ident(Span, Option<bool>), $default_value:literal) => ({\n  489 |           if let Ok(_) = input.parse::<Token![=]>() {\n  490 |             let (val, _) = match input.parse::<syn::LitBool>() {\n  491 |               Ok(str) => (str.value(), str.span()),\n  492 |               Err(_) => {\n  493 |                 let ident = input.parse::<AnyIdent>()?.0;\n  494 |                 (true, ident.span())\n  495 |               }\n  496 |             };\n  497 |             return Ok::<BindgenAttr, syn::Error>(BindgenAttr::$variant(attr_span, Some(val)))\n  498 |           } else {\n  499 |             return Ok(BindgenAttr::$variant(attr_span, Some($default_value)))\n  500 |           }\n  501 |         });","lines":14,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/macro/src/parser/attrs.rs#L488-L501"}]},
{"id":"LOGIC_43","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `generator_throw` (sync), when the user `catch` returns `Err(e)`, it sets the generator state and then `napi_throw(env, e.0.value)` and returns null. But `e.0.value` is the `Unknown` originally passed in (the thrown value) re-thrown; if the user `catch` constructed a *different* error to propagate, there is no way for it to do so because `catch` only returns the original `Unknown` on the `Err` path (the `Err` variant always carries the input `Unknown`). This restricts `catch` to re-throwing the same value, which the trait signature (`Result<Option<Yield>, Unknown>`) superficially suggests can be any Unknown but in practice the only Unknown available is the input.","fix":"Document that the `Err(Unknown)` returned is re-thrown as-is, or allow `catch` to return an owned error type that can be converted to a thrown value.","locations":[{"ref":"crates/napi/src/bindgen_runtime/iterator.rs:636-642","code":"  636 |       let throw_status = unsafe { sys::napi_throw(env, e.0.value) };\n  637 |       debug_assert!(\n  638 |         throw_status == sys::Status::napi_ok,\n  639 |         \"Failed to throw error {}\",\n  640 |         crate::Status::from(throw_status)\n  641 |       );\n  642 |       return ptr::null_mut();","lines":7,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/iterator.rs#L636-L642"},{"ref":"crates/napi/src/bindgen_runtime/iterator.rs:82-88","code":"   82 |   fn catch(\n   83 |     &'env mut self,\n   84 |     env: &'env Env,\n   85 |     value: Unknown<'env>,\n   86 |   ) -> Result<Option<Self::Yield>, Unknown<'env>> {\n   87 |     Err(value)\n   88 |   }","lines":7,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/iterator.rs#L82-L88"}]},
{"id":"LOGIC_44","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`Array::set` updates the cached length with `self.len = index + 1` where `index: u32`. If a caller\nsets element at `u32::MAX`, `index + 1` overflows and panics in debug / wraps to 0 in release,\nsilently corrupting the cached length. `insert` calls `set(self.len(), val)` so repeated inserts up\nto u32::MAX hit the same issue.","fix":"Use `self.len = index.saturating_add(1);` or `index.checked_add(1)` with an error on overflow.","locations":[{"ref":"crates/napi/src/bindgen_runtime/js_values/array.rs:68-89","code":"   68 |   pub fn set<T: ToNapiValue>(&mut self, index: u32, val: T) -> Result<()> {\n   69 |     unsafe {\n   70 |       let napi_val = T::to_napi_value(self.env, val)?;\n   71 | \n   72 |       check_status!(\n   73 |         sys::napi_set_element(self.env, self.inner, index, napi_val),\n   74 |         \"Failed to set element with index `{}`\",\n   75 |         index,\n   76 |       )?;\n   77 | \n   78 |       if index >= self.len() {\n   79 |         self.len = index + 1;\n   80 |       }\n   81 | \n   82 |       Ok(())\n   83 |     }\n   84 |   }\n   85 | \n   86 |   pub fn insert<T: ToNapiValue>(&mut self, val: T) -> Result<()> {\n   87 |     self.set(self.len(), val)?;\n   88 |     Ok(())\n   89 |   }","lines":22,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/js_values/array.rs#L68-L89"}]},
{"id":"LOGIC_45","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`BigInt::get_i128` returns the `lossless` flag for the 2-word case as `len == 2 && self.words[1] as\ni64 >= 0`. This treats the value as lossless only when the high word's top bit is clear, but the\ncombined magnitude `words[0] + (words[1] << 64)` can still exceed `i128::MAX` whenever\n`words[1] >= 0x8000_0000_0000_0000` -- which the `as i64 >= 0` check does catch -- yet for positive\nvalues exactly at the boundary (`words[1] == 0x8000... `, magnitude == i128::MIN.unsigned_abs())\nonly the negative branch is special-cased, so a positive BigInt of that magnitude is reported as a\nwrapped negative `i128` value with `lossless == false` instead of being flagged distinctly. The\n\"lossless or the value is truncated\" doc wording is also self-contradictory (it returns whether the\nvalue is lossless, not whether it was truncated).","fix":"Compute losslessness by checking that the magnitude fits in `i128` for the given sign\n(`val <= i128::MAX as u128` for positive, `val <= i128::MIN.unsigned_abs()` for negative) rather than\ninspecting only the high word's sign bit; fix the doc comment.","locations":[{"ref":"crates/napi/src/bindgen_runtime/js_values/bigint.rs:117-138","code":"  117 |   /// (value, lossless)\n  118 |   /// get the first two words of the BigInt as `i128` with the sign applied\n  119 |   /// return true if the value is lossless\n  120 |   /// or the value is truncated\n  121 |   pub fn get_i128(&self) -> (i128, bool) {\n  122 |     let len = self.words.len();\n  123 |     if len == 1 {\n  124 |       (\n  125 |         self.words[0] as i128 * if self.sign_bit { -1 } else { 1 },\n  126 |         true,\n  127 |       )\n  128 |     } else {\n  129 |       let val = self.words[0] as u128 + ((self.words[1] as u128) << 64);\n  130 |       if self.sign_bit && val == i128::MIN.unsigned_abs() {\n  131 |         return (i128::MIN, len > 2);\n  132 |       }\n  133 |       (\n  134 |         val as i128 * if self.sign_bit { -1 } else { 1 },\n  135 |         len == 2 && self.words[1] as i64 >= 0,\n  136 |       )\n  137 |     }\n  138 |   }","lines":22,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/js_values/bigint.rs#L117-L138"}]},
{"id":"LOGIC_46","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`HashMap`/`BTreeMap`/`IndexMap` `FromNapiValue` use `Object::keys` which calls\n`napi_get_property_names` -- that returns only enumerable string keys including inherited prototype\nproperties (the default mode of `napi_get_property_names` is `include_prototypes` + `enumerable`).\nThis means deserializing a JS object into a Rust map can pick up inherited enumerable properties,\nnot just own properties, which is surprising for a \"to map\" conversion and differs from typical\nJSON-object semantics (own enumerable only). `serde.rs`'s `Map` impl shares this via `Object::keys`.","fix":"Use `napi_get_all_property_names` with `own_only` + `enumerable` + `skip_symbols` (napi6+) for map\ndeserialization, or document that inherited enumerable keys are included.","locations":[{"ref":"crates/napi/src/bindgen_runtime/js_values/map.rs:75-87","code":"   75 |   unsafe fn from_napi_value(env: sys::napi_env, napi_val: sys::napi_value) -> Result<Self> {\n   76 |     let obj = unsafe { Object::from_napi_value(env, napi_val)? };\n   77 |     let keys = Object::keys(&obj)?;\n   78 |     let mut map: HashMap<K, V, S> = HashMap::with_capacity_and_hasher(keys.len(), S::default());\n   79 |     for key in keys.into_iter() {\n   80 |       if let Some(val) = obj.get(&key)? {\n   81 |         map.insert(K::from(key), val);\n   82 |       }\n   83 |     }\n   84 | \n   85 |     Ok(map)\n   86 |   }\n   87 | }","lines":13,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/js_values/map.rs#L75-L87"},{"ref":"crates/napi/src/bindgen_runtime/js_values/object.rs:897-914","code":"  897 |   pub fn keys(obj: &Object) -> Result<Vec<String>> {\n  898 |     let mut names = ptr::null_mut();\n  899 |     unsafe {\n  900 |       check_status!(\n  901 |         sys::napi_get_property_names(obj.0.env, obj.0.value, &mut names),\n  902 |         \"Failed to get property names of given object\"\n  903 |       )?;\n  904 |     }\n  905 | \n  906 |     let names = unsafe { Array::from_napi_value(obj.0.env, names)? };\n  907 |     let mut ret = vec![];\n  908 | \n  909 |     for i in 0..names.len() {\n  910 |       ret.push(names.get_element::<String>(i)?);\n  911 |     }\n  912 | \n  913 |     Ok(ret)\n  914 |   }","lines":18,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/js_values/object.rs#L897-L914"}]},
{"id":"LOGIC_47","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`serde.rs`'s `ToNapiValue for &Number` has dead-code / fall-through issues in the `is_u64` branch\nwhen `n > u32::MAX`: under `feature = \"napi6\"` it evaluates `unsafe { BigInt::to_napi_value(...) }`\nas the block's tail expression but there is no `return`, and the following\n`#[cfg(not(feature = \"napi6\"))] return ...;` is the alternative -- with napi6 the BigInt expression\nis the value of the `{ }` block which is then the value of the `else` arm, OK; but the structure\nrelies on exactly one cfg being active and is brittle. More concretely, `FromNapiValue for Number`\nconverts any integral f64 in `[0, u32::MAX]` to `u32` and `[i32::MIN, 0)` to `i32`, but integral\nvalues in `(u32::MAX, 2^53]` (safely representable, e.g. 5_000_000_000.0) fall to `Number::from_f64`\nand are stored as floats, losing the integer typing that a JS `Number` of that magnitude logically\nhas.","fix":"Add explicit `return` to the napi6 BigInt branch; in `from_napi_value`, map integral f64 in i64/u64 safe-integer range to `Number::from(i64/u64)` before falling back to float.","locations":[{"ref":"crates/napi/src/bindgen_runtime/js_values/serde.rs:163-230","code":"  163 | impl ToNapiValue for &Number {\n  164 |   unsafe fn to_napi_value(env: sys::napi_env, n: Self) -> Result<sys::napi_value> {\n  165 |     #[cfg(feature = \"napi6\")]\n  166 |     const MAX_SAFE_INT: i64 = 9007199254740991i64; // 2 ^ 53 - 1\n  167 |     if n.is_i64() {\n  168 |       let n = n.as_i64().unwrap();\n  169 |       #[cfg(feature = \"napi6\")]\n  170 |       {\n  171 |         if !(-MAX_SAFE_INT..=MAX_SAFE_INT).contains(&n) {\n  172 |           return unsafe { BigInt::to_napi_value(env, BigInt::from(n)) };\n  173 |         }\n  174 |       }\n  175 | \n  176 |       unsafe { i64::to_napi_value(env, n) }\n  177 |     } else if n.is_f64() {\n  178 |       unsafe { f64::to_napi_value(env, n.as_f64().unwrap()) }\n  179 |     } else {\n  180 |       let n = n.as_u64().unwrap();\n  181 |       if n > u32::MAX as u64 {\n  182 |         #[cfg(feature = \"napi6\")]\n  183 |         {\n  184 |           unsafe { BigInt::to_napi_value(env, BigInt::from(n)) }\n  185 |         }\n  186 | \n  187 |         #[cfg(not(feature = \"napi6\"))]\n  188 |         return unsafe { String::to_napi_value(env, n.to_string()) };\n  189 |       } else {\n  190 |         unsafe { u32::to_napi_value(env, n as u32) }\n  191 |       }\n  192 |     }\n  193 |   }\n  194 | }\n  195 | \n  196 | impl ToNapiValue for Number {\n  197 |   unsafe fn to_napi_value(env: sys::napi_env, n: Self) -> Result<sys::napi_value> {\n  198 |     ToNapiValue::to_napi_value(env, &n)\n  199 |   }\n  200 | }\n  201 | \n  202 | impl FromNapiValue for Number {\n  203 |   unsafe fn from_napi_value(env: sys::napi_env, napi_val: sys::napi_value) -> Result<Self> {\n  204 |     let n = unsafe { f64::from_napi_value(env, napi_val)? };\n  205 |     // Try to auto-convert to integers\n  206 |     let n = if n.trunc() == n {\n  207 |       if n >= 0.0f64 && n <= u32::MAX as f64 {\n  208 |         // This can be represented as u32\n  209 |         Some(Number::from(n as u32))\n  210 |       } else if n < 0.0f64 && n >= i32::MIN as f64 {\n  211 |         Some(Number::from(n as i32))\n  212 |       } else {\n  213 |         // must be a float\n  214 |         Number::from_f64(n)\n  215 |       }\n  216 |     } else {\n  217 |       // must be a float\n  218 |       Number::from_f64(n)\n  219 |     };\n  220 | \n  221 |     let n = n.ok_or_else(|| {\n  222 |       Error::new(\n  223 |         Status::InvalidArg,\n  224 |         \"Failed to convert js number to serde_json::Number\".to_owned(),\n  225 |       )\n  226 |     })?;\n  227 | \n  228 |     Ok(n)\n  229 |   }\n  230 | }","lines":68,"link":"https://github.com/napi-rs/napi-rs/blob/58fb862e4e8d46aa2b32ca5caea23706edc76904/crates/napi/src/bindgen_runtime/js_values/serde.rs#
