<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

<script type="application/json" id="D">[{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"In `dfa::Builder::build_from_noncontiguous`, the transition-table length `trans_len` is computed via `state_len.checked_shl(byte_classes.stride2().as_u32())`. `usize::checked_shl` only returns `None` when the shift amount is greater than or equal to the bit width of `usize`; it does NOT detect that the shifted value has overflowed and been truncated. In other words, `checked_shl` guards against an invalid *shift amount*, not against the *result* wrapping. Since `stride2` is always small (at most around 8, derived from the byte-class alphabet size), the shift amount is never out of range, so this check can never trigger its `None`/`BuildError::state_id_overflow` branch through overflow, even when `state_len << stride2` truly overflows `usize` and silently wraps to a much smaller value. This has been verified empirically: `0xFFFF_FFFFu32.checked_shl(4)` returns `Some(4294967280)` (a wrapped, truncated value), not `None`. On 32-bit targets (`usize` = 32 bits, which this `#![no_std]` crate explicitly supports), a `noncontiguous::NFA` with a state count approaching `SmallIndex::LIMIT` (~2^31) combined with even a small `stride2` will overflow the 32-bit `usize` multiplication that the shift represents, wrap `trans_len` down to a small value, allocate an undersized `dfa.trans` vector via `vec![DFA::DEAD; trans_len]`, and then later panic with an out-of-bounds index inside `finish_build_one_start`/`finish_build_both_starts` when writing transitions for legitimate (large) state IDs — instead of returning the intended graceful `Err(BuildError::state_id_overflow(..))`. The subsequent `StateID::new(trans_len.checked_sub(byte_classes.stride()).unwrap())` check does not catch this either, since it only validates that the (already wrapped-small) `trans_len` fits within `StateID::LIMIT`, which it spuriously will after wraparound.","fix":"Replace the shift-based overflow check with an actual overflow-checked multiplication, e.g. compute the stride as `1usize << stride2` (safe, since `stride2` is always small) and then use `state_len.checked_mul(stride)` to detect genuine overflow of the product:\n```rust\nlet stride = 1usize << byte_classes.stride2();\nlet trans_len = match state_len.checked_mul(stride) {\n    Some(trans_len) => trans_len,\n    None => {\n        return Err(BuildError::state_id_overflow(\n            StateID::MAX.as_u64(),\n            usize::MAX.as_u64(),\n        ))\n    }\n};\n```\nThis correctly returns `BuildError::state_id_overflow` instead of silently wrapping and later panicking with an out-of-bounds index.","locations":[{"ref":"src/dfa.rs:462-478","code":"  462 |         let trans_len =\n  463 |             match state_len.checked_shl(byte_classes.stride2().as_u32()) {\n  464 |                 Some(trans_len) => trans_len,\n  465 |                 None => {\n  466 |                     return Err(BuildError::state_id_overflow(\n  467 |                         StateID::MAX.as_u64(),\n  468 |                         usize::MAX.as_u64(),\n  469 |                     ))\n  470 |                 }\n  471 |             };\n  472 |         StateID::new(trans_len.checked_sub(byte_classes.stride()).unwrap())\n  473 |             .map_err(|e| {\n  474 |                 BuildError::state_id_overflow(\n  475 |                     StateID::MAX.as_u64(),\n  476 |                     e.attempted(),\n  477 |                 )\n  478 |             })?;","lines":17,"link":"https://github.com/BurntSushi/aho-corasick/blob/c82178696b9ddc18b56c3c74853529e7926ff329/src/dfa.rs#L462-L478"}]},{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"hard","description":"In `Buffer::new` (`src/util/buffer.rs:62`), `let capacity = core::cmp::max(min * 8, DEFAULT_BUFFER_CAPACITY);` computes `min * 8` with an unchecked `usize` multiplication, where `min` is derived directly from the caller-supplied `min_buffer_len` (documented as `the maximum possible match length`). On 32-bit targets (`usize` = `u32`), a sufficiently large `min` (still within `SmallIndex::MAX`, which is close to `i32::MAX` even on 32-bit targets per `src/util/primitives.rs`) causes `min * 8` to overflow: this panics in debug builds and silently wraps in release builds. A wrapped, too-small `capacity` breaks the invariant relied on later by `Buffer::roll` (`src/util/buffer.rs:113-123`), whose `self.end.checked_sub(self.min).expect(...)` would then panic once the (too-small) buffer is filled and rolled, turning a quiet integer overflow into a later, harder-to-diagnose panic.","fix":"Use a saturating or checked multiplication so a huge `min_buffer_len` degrades gracefully instead of overflowing, e.g.:\n```rust\nlet capacity = core::cmp::max(min.saturating_mul(8), DEFAULT_BUFFER_CAPACITY);\n```","locations":[{"ref":"src/util/buffer.rs:49-63","code":"   49 |     pub(crate) fn new(min_buffer_len: usize) -> Buffer {\n   50 |         let min = core::cmp::max(1, min_buffer_len);\n   51 |         // The minimum buffer amount is also the amount that we roll our\n   52 |         // buffer in order to support incremental searching. To this end,\n   53 |         // our actual capacity needs to be at least 1 byte bigger than our\n   54 |         // minimum amount, otherwise we won't have any overlap. In actuality,\n   55 |         // we want our buffer to be a bit bigger than that for performance\n   56 |         // reasons, so we set a lower bound of `8 * min`.\n   57 |         //\n   58 |         // TODO: It would be good to find a way to test the streaming\n   59 |         // implementation with the minimal buffer size. For now, we just\n   60 |         // uncomment out the next line and comment out the subsequent line.\n   61 |         // let capacity = 1 + min;\n   62 |         let capacity = core::cmp::max(min * 8, DEFAULT_BUFFER_CAPACITY);\n   63 |         Buffer { buf: vec![0; capacity], min, end: 0 }","lines":15,"link":"https://github.com/BurntSushi/aho-corasick/blob/c82178696b9ddc18b56c3c74853529e7926ff329/src/util/buffer.rs#L49-L63"}]},{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `Builder::build_imp` (aarch64 branch) in `src/packed/teddy/builder.rs`, when `self.only_fat == Some(true)` the code logs a `debug!(\"skipping Teddy because fat was demanded but unavailable\")` message but does not actually `return None;`. Execution falls through and still builds a `SlimNeon` (non-fat) searcher, silently ignoring the caller's forced request for Fat Teddy. This is inconsistent with the equivalent `x86_64` branch (see `Some(true) if !use_avx2 => { debug!(...); return None; }` a few lines above), which correctly returns `None` when a forced configuration is unavailable.","fix":"Add the missing early return so the forced `only_fat` request is honored, mirroring the `x86_64` branch:\n```rust\nif self.only_fat == Some(true) {\n    debug!(\n        \"skipping Teddy because fat was demanded but unavailable\"\n    );\n    return None;\n}\n```","locations":[{"ref":"src/packed/teddy/builder.rs:249-253","code":"  249 |             if self.only_fat == Some(true) {\n  250 |                 debug!(\n  251 |                     \"skipping Teddy because fat was demanded but unavailable\"\n  252 |                 );\n  253 |             }","lines":5,"link":"https://github.com/BurntSushi/aho-corasick/blob/c82178696b9ddc18b56c3c74853529e7926ff329/src/packed/teddy/builder.rs#L249-L253"}]},{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `Builder::build_imp` (aarch64 branch) in `src/packed/teddy/builder.rs`, the `match mask_len` arms for `1`, `2`, and `3` each contain a heuristic pattern-count check (e.g. `if patlimit && patterns.len() > 16 { debug!(\"skipping Teddy ...\"); }`) that logs a message claiming Teddy construction will be skipped, but never actually `return None`. Execution always falls through to `SlimNeon::<N>::new(&patterns)` regardless of the pattern count. This defeats the purpose of `heuristic_pattern_limits` (documented as refusing construction when there are too many patterns) on `aarch64`, and is inconsistent with the equivalent `x86_64` branch a few lines above, which does `return None;` when `mask_len == 1 && patterns.len() > 16`.","fix":"Add `return None;` after each debug log so the heuristic actually takes effect, e.g.:\n```rust\n1 => {\n    if patlimit && patterns.len() > 16 {\n        debug!(\n            \"skipping Teddy (mask len: 1) because there are \\\n             too many patterns\",\n        );\n        return None;\n    }\n    debug!(\"Teddy choice: 128-bit slim, 1 byte\");\n    SlimNeon::<1>::new(&patterns)\n}\n```\nand similarly for the `2` and `3` arms.","locations":[{"ref":"src/packed/teddy/builder.rs:265-304","code":"  265 |             match mask_len {\n  266 |                 1 => {\n  267 |                     if patlimit && patterns.len() > 16 {\n  268 |                         debug!(\n  269 |                             \"skipping Teddy (mask len: 1) because there are \\\n  270 |                              too many patterns\",\n  271 |                         );\n  272 |                     }\n  273 |                     debug!(\"Teddy choice: 128-bit slim, 1 byte\");\n  274 |                     SlimNeon::<1>::new(&patterns)\n  275 |                 }\n  276 |                 2 => {\n  277 |                     if patlimit && patterns.len() > 32 {\n  278 |                         debug!(\n  279 |                             \"skipping Teddy (mask len: 2) because there are \\\n  280 |                              too many patterns\",\n  281 |                         );\n  282 |                     }\n  283 |                     debug!(\"Teddy choice: 128-bit slim, 2 bytes\");\n  284 |                     SlimNeon::<2>::new(&patterns)\n  285 |                 }\n  286 |                 3 => {\n  287 |                     if patlimit && patterns.len() > 48 {\n  288 |                         debug!(\n  289 |                             \"skipping Teddy (mask len: 3) because there are \\\n  290 |                              too many patterns\",\n  291 |                         );\n  292 |                     }\n  293 |                     debug!(\"Teddy choice: 128-bit slim, 3 bytes\");\n  294 |                     SlimNeon::<3>::new(&patterns)\n  295 |                 }\n  296 |                 4 => {\n  297 |                     debug!(\"Teddy choice: 128-bit slim, 4 bytes\");\n  298 |                     SlimNeon::<4>::new(&patterns)\n  299 |                 }\n  300 |                 _ => {\n  301 |                     debug!(\"no supported Teddy configuration found\");\n  302 |                     None\n  303 |                 }\n  304 |             }","lines":40,"link":"https://github.com/BurntSushi/aho-corasick/blob/c82178696b9ddc18b56c3c74853529e7926ff329/src/packed/teddy/builder.rs#L265-L304"}]},{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`Patterns::reset` in `src/packed/pattern.rs` is documented as clearing `all heap memory associated with this collection of patterns and resets all state such that it is a valid empty collection`, but it never resets `total_pattern_bytes` back to `0`. It resets `kind`, `by_id`, `order`, and `minimum_len`, but leaves `total_pattern_bytes` at its stale pre-reset value. Since `Patterns::memory_usage` reads `total_pattern_bytes` directly, a `Patterns` value that has been `reset` (currently only reachable via `packed::Builder::add` when the pattern limit is exceeded or an empty pattern is added, which also marks the builder `inert`) would report incorrect (stale, non-zero) memory usage for an otherwise-empty collection if it were ever queried, contradicting the `reset` doc comment's claim of producing 'a valid empty collection'.","fix":"Reset `total_pattern_bytes` along with the other fields:\n```rust\npub(crate) fn reset(&mut self) {\n    self.kind = MatchKind::default();\n    self.by_id.clear();\n    self.order.clear();\n    self.minimum_len = usize::MAX;\n    self.total_pattern_bytes = 0;\n}\n```","locations":[{"ref":"src/packed/pattern.rs:119-126","code":"  119 |     /// Clears all heap memory associated with this collection of patterns and\n  120 |     /// resets all state such that it is a valid empty collection.\n  121 |     pub(crate) fn reset(&mut self) {\n  122 |         self.kind = MatchKind::default();\n  123 |         self.by_id.clear();\n  124 |         self.order.clear();\n  125 |         self.minimum_len = usize::MAX;\n  126 |     }","lines":8,"link":"https://github.com/BurntSushi/aho-corasick/blob/c82178696b9ddc18b56c3c74853529e7926ff329/src/packed/pattern.rs#L119-L126"}]},{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`Match::offset` at `src/util/search.rs:966-974` computes `self.start() + offset` and `self.end() + offset` using plain unchecked `+`, unlike its sibling `Span::offset` (lines 717-726 in the same file) which uses `checked_add(...).expect(...)` with a descriptive panic message. This is a copy-paste-style divergence: in a release build (where overflow checks are disabled) `Match::offset` will silently wrap around on overflow and produce a corrupted `Match` with a nonsensical span instead of panicking, whereas `Span::offset` always panics deterministically with a clear message regardless of build profile. `Match::offset` is also missing the `# Panics` doc section that `Span::offset` has, so its actual behavior (implicit debug-only panic, silent wraparound in release) is undocumented and inconsistent with the rest of the module.","fix":"Reuse the already-correct `Span::offset` implementation instead of re-deriving the arithmetic, which fixes both the inconsistency and the missing documentation in one change:\n```rust\npub fn offset(&self, offset: usize) -> Match {\n    Match { pattern: self.pattern, span: self.span().offset(offset) }\n}\n```\nThis makes `Match::offset` panic deterministically via `Span::offset`'s `checked_add(...).expect(...)` in all build profiles, and inherits its `# Panics` documentation.","locations":[{"ref":"src/util/search.rs:966-974","code":"  966 |     pub fn offset(&self, offset: usize) -> Match {\n  967 |         Match {\n  968 |             pattern: self.pattern,\n  969 |             span: Span {\n  970 |                 start: self.start() + offset,\n  971 |                 end: self.end() + offset,\n  972 |             },\n  973 |         }\n  974 |     }","lines":9,"link":"https://github.com/BurntSushi/aho-corasick/blob/c82178696b9ddc18b56c3c74853529e7926ff329/src/util/search.rs#L966-L974"}]},{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`Builder::add` in `src/util/prefilter.rs:308-322` unconditionally forwards every added pattern to `self.packed` (`pbuilder.add(bytes)`) regardless of `self.ascii_case_insensitive`. But `Builder::build` (`src/util/prefilter.rs:181-198`) always discards the packed prefilter when `self.ascii_case_insensitive` is `true` (`let (packed, patlen, minlen) = if self.ascii_case_insensitive { (None, usize::MAX, 0) } else { ... }`), because `packed::Builder` has no notion of ASCII case insensitivity. Since callers normally call `.ascii_case_insensitive(yes)` once up front before adding any patterns, every subsequent `pbuilder.add(bytes)` call does real work (updating Teddy bucket/mask-building state) that is guaranteed to be thrown away, wasting CPU time and memory proportional to the number and length of patterns added.","fix":"Skip forwarding to the packed builder once ASCII case-insensitivity is enabled, since it will never be used:\n```rust\nif !self.ascii_case_insensitive {\n    if let Some(ref mut pbuilder) = self.packed {\n        pbuilder.add(bytes);\n    }\n}\n```","locations":[{"ref":"src/util/prefilter.rs:308-322","code":"  308 |     pub(crate) fn add(&mut self, bytes: &[u8]) {\n  309 |         if bytes.is_empty() {\n  310 |             self.enabled = false;\n  311 |         }\n  312 |         if !self.enabled {\n  313 |             return;\n  314 |         }\n  315 |         self.count += 1;\n  316 |         self.start_bytes.add(bytes);\n  317 |         self.rare_bytes.add(bytes);\n  318 |         self.memmem.add(bytes);\n  319 |         if let Some(ref mut pbuilder) = self.packed {\n  320 |             pbuilder.add(bytes);\n  321 |         }\n  322 |     }","lines":15,"link":"https://github.com/BurntSushi/aho-corasick/blob/c82178696b9ddc18b56c3c74853529e7926ff329/src/util/prefilter.rs#L308-L322"},{"ref":"src/util/prefilter.rs:181-198","code":"  181 |         let (packed, patlen, minlen) = if self.ascii_case_insensitive {\n  182 |             (None, usize::MAX, 0)\n  183 |         } else {\n  184 |             let patlen = self.packed.as_ref().map_or(usize::MAX, |p| p.len());\n  185 |             let minlen = self.packed.as_ref().map_or(0, |p| p.minimum_len());\n  186 |             let packed =\n  187 |                 self.packed.as_ref().and_then(|b| b.build()).map(|s| {\n  188 |                     let memory_usage = s.memory_usage();\n  189 |                     debug!(\n  190 |                         \"built packed prefilter (len: {}, \\\n  191 |                          minimum pattern len: {}, memory usage: {}) \\\n  192 |                          for consideration\",\n  193 |                         patlen, minlen, memory_usage,\n  194 |                     );\n  195 |                     Prefilter { finder: Arc::new(Packed(s)), memory_usage }\n  196 |                 });\n  197 |             (packed, patlen, minlen)\n  198 |         };","lines":18,"link":"https://github.com/BurntSushi/aho-corasick/blob/c82178696b9ddc18b56c3c74853529e7926ff329/src/util/prefilter.rs#L181-L198"}]},{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"`try_find_overlapping_fwd` calls `aut.prefilter()` twice in a row: once inside the `if aut.prefilter().is_some() && ...` condition and again via `aut.prefilter().unwrap()` in the branch body. Since `aut` here is a `&A` where `A: Automaton + ?Sized` (and in practice frequently a `dyn Automaton`/`Arc<dyn AcAutomaton>` trait object via `AhoCorasick`), each call goes through a virtual dispatch. The second call and the `unwrap()` are entirely avoidable.","fix":"Use `if let` to call `prefilter()` only once:\n```rust\nif !input.get_anchored().is_anchored() {\n    if let Some(pre) = aut.prefilter() {\n        return try_find_overlapping_fwd_imp(aut, input, Some(pre), state);\n    }\n}\ntry_find_overlapping_fwd_imp(aut, input, None, state)\n```","locations":[{"ref":"src/automaton.rs:1433-1439","code":" 1433 |     // use a prefilter when no pattern ID is given.\n 1434 |     if aut.prefilter().is_some() && !input.get_anchored().is_anchored() {\n 1435 |         let pre = aut.prefilter().unwrap();\n 1436 |         try_find_overlapping_fwd_imp(aut, input, Some(pre), state)\n 1437 |     } else {\n 1438 |         try_find_overlapping_fwd_imp(aut, input, None, state)\n 1439 |     }","lines":7,"link":"https://github.com/BurntSushi/aho-corasick/blob/c82178696b9ddc18b56c3c74853529e7926ff329/src/automaton.rs#L1433-L1439"}]},{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"medium","difficulty":"very_easy","description":"The `# Safety` doc comment on `Teddy::verify_bucket` in `src/packed/teddy/generic.rs:847` states that `The bucket index must be less than or equal to `self.buckets.len()``, but the actual invariant enforced by the `debug_assert!(bucket < self.buckets.len())` on the very next line (and required by the subsequent `self.buckets.get_unchecked(bucket)` call) is that `bucket` must be strictly less than `self.buckets.len()`. If `bucket == self.buckets.len()` were ever passed (as the doc comment currently permits), `get_unchecked` would read out of bounds, which is undefined behavior. This is a safety-critical doc/code mismatch for an `unsafe fn` that future maintainers could rely on when reasoning about correct call sites.","fix":"Correct the safety doc to match the actual invariant, e.g. change the comment to read: `/// The bucket index must be less than `self.buckets.len()`.`","locations":[{"ref":"src/packed/teddy/generic.rs:839-857","code":"  839 |     /// Verify whether there are any matches starting at `at` in the given\n  840 |     /// `haystack` corresponding only to patterns in the given bucket.\n  841 |     ///\n  842 |     /// # Safety\n  843 |     ///\n  844 |     /// The given pointers representing the haystack must be valid to read\n  845 |     /// from.\n  846 |     ///\n  847 |     /// The bucket index must be less than or equal to `self.buckets.len()`.\n  848 |     #[inline(always)]\n  849 |     unsafe fn verify_bucket(\n  850 |         &self,\n  851 |         cur: *const u8,\n  852 |         end: *const u8,\n  853 |         bucket: usize,\n  854 |     ) -> Option<Match> {\n  855 |         debug_assert!(bucket < self.buckets.len());\n  856 |         // SAFETY: The caller must ensure that the bucket index is correct.\n  857 |         for pid in self.buckets.get_unchecked(bucket).iter().copied() {","lines":19,"link":"https://github.com/BurntSushi/aho-corasick/blob/c82178696b9ddc18b56c3c74853529e7926ff329/src/packed/teddy/generic.rs#L839-L857"}]},{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The `Automaton::min_pattern_len` trait method doc comment (`/// Returns the length, in bytes, of the shortest pattern in this automaton.`) does not document the edge case where the automaton has zero patterns. Empirically, building a `DFA`/`AhoCorasick` from an empty pattern iterator yields `min_pattern_len() == usize::MAX` (there being no pattern to take a minimum over), which is a reasonable sentinel but a surprising value for a caller who might naively use it in arithmetic (e.g. `haystack.len() - ac.min_pattern_len()`) expecting a small number. `AhoCorasick::min_pattern_len` in `ahocorasick.rs` documents the `0`-length (empty-string-pattern) case but likewise omits the zero-total-patterns/`usize::MAX` case.","fix":"Add a short note to both doc comments, e.g.: \"If this automaton has no patterns at all, this returns `usize::MAX`.\" This makes the sentinel behavior of `min_pattern_len` explicit and discoverable without reading the implementation.","locations":[{"ref":"src/automaton.rs:326-328","code":"  326 |     /// Returns the length, in bytes, of the shortest pattern in this\n  327 |     /// automaton.\n  328 |     fn min_pattern_len(&self) -> usize;","lines":3,"link":"https://github.com/BurntSushi/aho-corasick/blob/c82178696b9ddc18b56c3c74853529e7926ff329/src/automaton.rs#L326-L328"},{"ref":"src/ahocorasick.rs:1905-1929","code":" 1905 |     /// Returns the length of the shortest pattern matched by this automaton.\n 1906 |     ///\n 1907 |     /// # Examples\n 1908 |     ///\n 1909 |     /// Basic usage:\n 1910 |     ///\n 1911 |     /// ```\n 1912 |     /// use aho_corasick::AhoCorasick;\n 1913 |     ///\n 1914 |     /// let ac = AhoCorasick::new(&[\"foo\", \"bar\", \"quux\", \"baz\"]).unwrap();\n 1915 |     /// assert_eq!(3, ac.min_pattern_len());\n 1916 |     /// ```\n 1917 |     ///\n 1918 |     /// Note that an `AhoCorasick` automaton has a minimum length of `0` if\n 1919 |     /// and only if it can match the empty string:\n 1920 |     ///\n 1921 |     /// ```\n 1922 |     /// use aho_corasick::AhoCorasick;\n 1923 |     ///\n 1924 |     /// let ac = AhoCorasick::new(&[\"foo\", \"\", \"quux\", \"baz\"]).unwrap();\n 1925 |     /// assert_eq!(0, ac.min_pattern_len());\n 1926 |     /// ```\n 1927 |     pub fn min_pattern_len(&self) -> usize {\n 1928 |         self.aut.min_pattern_len()\n 1929 |     }","lines":25,"link":"https://github.com/BurntSushi/aho-corasick/blob/c82178696b9ddc18b56c3c74853529e7926ff329/src/ahocorasick.rs#L1905-L1929"}]},{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment on `Patterns::new()` in `src/packed/pattern.rs` states `If any of the patterns in the slice given are empty, then this panics. Similarly, if the number of patterns given is zero, then this also panics.` However, `Patterns::new()` takes no arguments at all and constructs an empty `Patterns` value unconditionally, without panicking. This doc text appears to be a stale leftover from an earlier constructor signature that took a slice of patterns; it describes behavior that belongs to `Patterns::add` (which does assert `!bytes.is_empty()`), not `Patterns::new`.","fix":"Update the doc comment on `Patterns::new` to describe its actual (argument-less, non-panicking) behavior, e.g.:\n```rust\n/// Create a new, empty collection of patterns using the default match\n/// semantics. Patterns are added later via `Patterns::add`, which panics\n/// if an empty pattern is given.\npub(crate) fn new() -> Patterns {\n```","locations":[{"ref":"src/packed/pattern.rs:50-57","code":"   50 |     /// Create a new collection of patterns for the given match semantics. The\n   51 |     /// ID of each pattern is the index of the pattern at which it occurs in\n   52 |     /// the `by_id` slice.\n   53 |     ///\n   54 |     /// If any of the patterns in the slice given are empty, then this panics.\n   55 |     /// Similarly, if the number of patterns given is zero, then this also\n   56 |     /// panics.\n   57 |     pub(crate) fn new() -> Patterns {","lines":8,"link":"https://github.com/BurntSushi/aho-corasick/blob/c82178696b9ddc18b56c3c74853529e7926ff329/src/packed/pattern.rs#L50-L57"}]},{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment on `Pattern::low_nybbles` in `src/packed/pattern.rs` says 'If this pattern is shorter than `len`, then this panics.' But the implementation uses `self.bytes().iter().take(len)`, which simply stops early and leaves the remaining entries of `nybs` as `0` when the pattern is shorter than `len` -- it never panics. Currently this is unreachable in practice because callers only ever pass `len <= patterns.minimum_len()` (see `mask_len` computation in `src/packed/teddy/builder.rs`), but the comment misrepresents the actual, silently-padding behavior of the function.","fix":"Either make the code match the doc by asserting the length, or fix the doc to describe the real zero-padding behavior, e.g.:\n```rust\n/// Returns the first `len` low nybbles from this pattern. If this pattern\n/// is shorter than `len`, the remaining nybbles are zero-padded.\npub(crate) fn low_nybbles(&self, len: usize) -> Box<[u8]> {\n```","locations":[{"ref":"src/packed/pattern.rs:230-232","code":"  230 |     /// Returns the first `len` low nybbles from this pattern. If this pattern\n  231 |     /// is shorter than `len`, then this panics.\n  232 |     pub(crate) fn low_nybbles(&self, len: usize) -> Box<[u8]> {","lines":3,"link":"https://github.com/BurntSushi/aho-corasick/blob/c82178696b9ddc18b56c3c74853529e7926ff329/src/packed/pattern.rs#L230-L232"}]},{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment for `FatVector::half_shift_in_three_bytes` in `src/packed/vector.rs:266-267` says `Like `Vector::shift_in_two_bytes`, except this is done for each half of the vector instead.` — it was clearly copy-pasted from the `half_shift_in_two_bytes` method immediately above it (lines 257-264) and never updated to reference `Vector::shift_in_three_bytes`. This is misleading documentation for an `unsafe` SIMD trait method.","fix":"Update the doc comment to reference the correct method:\n```rust\n/// Like `Vector::shift_in_three_bytes`, except this is done for each half\n/// of the vector instead.\n```","locations":[{"ref":"src/packed/vector.rs:266-273","code":"  266 |     /// Like `Vector::shift_in_two_bytes`, except this is done for each half\n  267 |     /// of the vector instead.\n  268 |     ///\n  269 |     /// # Safety\n  270 |     ///\n  271 |     /// Callers must ensure that this is okay to call in the current target for\n  272 |     /// the current CPU.\n  273 |     unsafe fn half_shift_in_three_bytes(self, vector2: Self) -> Self;","lines":8,"link":"https://github.com/BurntSushi/aho-corasick/blob/c82178696b9ddc18b56c3c74853529e7926ff329/src/packed/vector.rs#L266-L273"}]},{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment on `RareByteOffsets::set` in `src/util/prefilter.rs:457-460` says `If the offset is greater than the existing offset, then it overwrites the previous value and returns false. If there is no previous value set, then this sets it and returns true.`, but the function signature is `pub(crate) fn set(&mut self, byte: u8, off: RareByteOffset)` which returns `()`. The described boolean return-value behavior does not exist in the implementation (`self.set[byte as usize].max = cmp::max(...)`), so the comment is stale/incorrect and describes behavior the function never had.","fix":"Rewrite the doc comment to match the actual unit-returning implementation, e.g.:\n```rust\n/// Add the given offset for the given byte to this set. If the offset is\n/// greater than the existing offset for `byte`, the maximum is kept.\n```","locations":[{"ref":"src/util/prefilter.rs:457-464","code":"  457 |     /// Add the given offset for the given byte to this set. If the offset is\n  458 |     /// greater than the existing offset, then it overwrites the previous\n  459 |     /// value and returns false. If there is no previous value set, then this\n  460 |     /// sets it and returns true.\n  461 |     pub(crate) fn set(&mut self, byte: u8, off: RareByteOffset) {\n  462 |         self.set[byte as usize].max =\n  463 |             cmp::max(self.set[byte as usize].max, off.max);\n  464 |     }","lines":8,"link":"https://github.com/BurntSushi/aho-corasick/blob/c82178696b9ddc18b56c3c74853529e7926ff329/src/util/prefilter.rs#L457-L464"}]},{"id":"CMT_7","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The `Span` type doc comment at `src/util/search.rs:653-671` explicitly states `Span` is a half-open interval: \"The starting offset is inclusive while the ending offset is exclusive.\" However, `Span::contains` at `src/util/search.rs:701-708` implements the check as `self.start <= offset && offset <= self.end`, i.e. treating `end` as an *inclusive* upper bound (`<=` rather than `<`). So `contains` returns `true` for `offset == self.end`, which contradicts the type-level documentation of `end` being exclusive. Even if this inclusive-end behavior is intentional (e.g. to support checking valid cursor/boundary positions rather than valid byte indices), the local doc comment on `contains` (\"Returns true when the given offset is contained within this span\") does not explain or justify this deviation from the type's own stated half-open convention, which can mislead API consumers who rely on the type-level doc.","fix":"Either tighten the comparison to `offset < self.end` to match the documented half-open semantics of `Span`, or, if the inclusive-end behavior is intentional (e.g. for boundary/cursor checks), update the doc comment on `contains` to explicitly call out that `end` is treated as an inclusive boundary here, e.g.: `/// Note: unlike the half-open range this span represents, \\`contains\\` treats \\`end\\` as an inclusive boundary position (so \\`contains(span.end)\\` is true).`","locations":[{"ref":"src/util/search.rs:701-708","code":"  701 |     /// Returns true when the given offset is contained within this span.\n  702 |     ///\n  703 |     /// Note that an empty span contains no offsets and will always return\n  704 |     /// false.\n  705 |     #[inline]\n  706 |     pub fn contains(&self, offset: usize) -> bool {\n  707 |         !self.is_empty() && self.start <= offset && offset <= self.end\n  708 |     }","lines":8,"link":"https://github.com/BurntSushi/aho-corasick/blob/c82178696b9ddc18b56c3c74853529e7926ff329/src/util/search.rs#L701-L708"}]},{"id":"CMT_8","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The doc comment on `NFA::init_full_state` in `src/nfa/noncontiguous.rs` says `This sets every possible transition (all 255 of them) for the given state`, but the loop below actually iterates `for byte in 0..=255`, i.e. 256 distinct byte values (0 through 255 inclusive), not 255.","fix":"Correct the count in the comment:\n```rust\n/// This sets every possible transition (all 256 of them) for the given\n/// state to the given `next` value.\n```","locations":[{"ref":"src/nfa/noncontiguous.rs:425-426","code":"  425 |     /// This sets every possible transition (all 255 of them) for the given\n  426 |     /// state to the name `next` value.","lines":2,"link":"https://github.com/BurntSushi/aho-corasick/blob/c82178696b9ddc18b56c3c74853529e7926ff329/src/nfa/noncontiguous.rs#L425-L426"}]},{"id":"CMT_9","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The comment directly above the `fat_avx2!` macro definition in `src/packed/teddy/builder.rs` reads `// Defines SlimAVX2 wrapper functions for 1, 2, 3 and 4 bytes.`, but the macro actually defines `FatAVX2` (not `SlimAVX2`) wrapper functions. This is a copy-paste leftover from the `slim_avx2!` macro comment above it.","fix":"Update the comment to reflect what the macro actually defines:\n```rust\n// Defines FatAVX2 wrapper functions for 1, 2, 3 and 4 bytes.\nmacro_rules! fat_avx2 {\n```","locations":[{"ref":"src/packed/teddy/builder.rs:605-606","code":"  605 |     // Defines SlimAVX2 wrapper functions for 1, 2, 3 and 4 bytes.\n  606 |     macro_rules! fat_avx2 {","lines":2,"link":"https://github.com/BurntSushi/aho-corasick/blob/c82178696b9ddc18b56c3c74853529e7926ff329/src/packed/teddy/builder.rs#L605-L606"}]},{"id":"OTHER_1","type":"other","type_label":"Other","severity":"low","difficulty":"very_easy","description":"`DFA::memory_usage` computes the size of the `trans` buffer using `size_of::<u32>()` even though `self.trans` is typed as `Vec<StateID>`, not `Vec<u32>`. This happens to produce the correct numeric result today only because `StateID` is currently a thin newtype wrapper around `SmallIndex(u32)` with no extra fields, but nothing enforces that relationship at the call site. Notably, the very next field's accounting in the same function, `self.pattern_lens.len() * size_of::<SmallIndex>()`, correctly uses the wrapper type `SmallIndex` rather than the primitive `u32` it wraps, making the `size_of::<u32>()` usage for `trans` an inconsistent, fragile shortcut that would silently miscalculate `memory_usage()` if `StateID`'s internal representation ever grows (e.g. an extra field added for debugging/niche optimization changes).","fix":"Use `size_of::<StateID>()` instead of `size_of::<u32>()` for consistency with how `pattern_lens` is measured, and so the computation stays correct if `StateID`'s representation ever changes:\n```rust\n(self.trans.len() * size_of::<StateID>())\n    + (self.matches.len() * size_of::<Vec<PatternID>>())\n    + self.matches_memory_usage\n    + (self.pattern_lens.len() * size_of::<SmallIndex>())\n    + self.prefilter.as_ref().map_or(0, |p| p.memory_usage())\n```","locations":[{"ref":"src/dfa.rs:288-297","code":"  288 |     #[inline(always)]\n  289 |     fn memory_usage(&self) -> usize {\n  290 |         use core::mem::size_of;\n  291 | \n  292 |         (self.trans.len() * size_of::<u32>())\n  293 |             + (self.matches.len() * size_of::<Vec<PatternID>>())\n  294 |             + self.matches_memory_usage\n  295 |             + (self.pattern_lens.len() * size_of::<SmallIndex>())\n  296 |             + self.prefilter.as_ref().map_or(0, |p| p.memory_usage())\n  297 |     }","lines":10,"link":"https://github.com/BurntSushi/aho-corasick/blob/c82178696b9ddc18b56c3c74853529e7926ff329/src/dfa.rs#L288-L297"}]}]</script>

  <button class="action-btn" data-action="collapse-all">⊟ Collapse all</button>
  <button class="action-btn" data-action="expand-all">⊞ Expand all</button>
  <button class="action-btn" data-action="download-md">&#11015; MD</button>
  <button class="action-btn" data-action="download-md-short">&#11015; MD Short</button>
  <button class="action-btn" data-action="download-toml">&#11015; TOML</button>
</div>
<div id="hidden-bar"></div>
<div id="content"></div>
</div>
<script>
(function(){
'use strict';

// Data
const FINDINGS     = JSON.parse(document.getElementById('D').textContent);
const PROJECT_INFO = JSON.parse(document.getElementById('PI').textContent);
const SEVS     = ['critical','high','medium','low','negligible'];
const STATUSES = ['open','fixed','wont-fix','false-positive'];
const ALL_TYPES = [...new Set(FINDINGS.map(f => f.type))].sort();
// Build lookup map for O(1) access
const FINDING_BY_ID = new Map(FINDINGS.map(f => [f.id, f]));
// Only severities actually present in the report — the filter bar hides the rest.
const PRESENT_SEVS = SEVS.filter(s => FINDINGS.some(f => (f.severity || 'medium') === s));
// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.
const DIFFICULTY_ORDER = ['very_easy','easy','medium','hard'];
const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};
const PRESENT_DIFFS = DIFFICULTY_ORDER.filter(d => FINDINGS.some(f => f.difficulty === d));
const HAS_DIFFICULTY = PRESENT_DIFFS.length > 0;
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State
const S = {
  search: '', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenDiff: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(),
};
const statuses = {};

// Persistence
function loadStatuses() {
  try { Object.assign(statuses, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch {}
}
function saveStatuses() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(statuses)); } catch {}
}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;
function syncHash() {
  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));
    if (S.search)            p.set('q',   S.search);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += '**Description:** ' + (f.description || '') + '\n\n';
      if (f.locations.length) {
        out += '**Locations:**\n\n';
        for (const l of f.locations) {
          if (l.code != null) out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
          else                out += '- `' + l.ref + '` _(file not found)_\n\n';
        }
      }
      out += '**Fix:** ' + (f.fix || '') + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return chunks.join('\n\n') + '\n';
}

// Build project-info.toml from embedded PROJECT_INFO (same format as gen_project_info.py).
function buildProjectInfoToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = Object.assign({}, PROJECT_INFO);
  if (!('description' in pi)) pi.description = '';
  const lines = [
    '# Project metadata for the code audit report (all fields optional).',
    '# Hand-edit freely (e.g. fill in description); re-run the audit without --force to keep edits.',
    '', '[project]'
  ];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += '**Description:** ' + (f.description || '') + '\n\n';
  if (f.locations.length) {
    out += '**Locations:**\n\n';
    for (const l of f.locations) {
      if (l.code != null) out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
      else                out += '- `' + l.ref + '` _(file not found)_\n\n';
    }
  }
  out += '**Fix:** ' + (f.fix || '') + '\n';
  const links = f.locations.map(l => l.link).filter(Boolean);
  if (links.length) out += '\n' + links.join('\n') + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystack per finding (cleared on full re-render)
const _hay = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (!hayOf(f).includes(q) && !st.includes(q)) return false;
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    downloadText(buildFindingsToml(),    'findings.toml',     'application/toml');
    downloadText(buildProjectInfoToml(), 'project-info.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
