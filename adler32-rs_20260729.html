<!DOCTYPE html>
<html lang="en">
<head>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}

.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}

.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}

.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}

.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}

.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}

.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}

<script type="application/json" id="D">[{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"critical","difficulty":"medium","description":"`RollingAdler32::remove()` computes the `b` accumulator with u32 *wrapping* arithmetic: `BASE.wrapping_sub(size as u32).wrapping_mul(byte)`. When `size > BASE` (65521) the term `BASE - size` underflows to `2^32 - (size - BASE)`, and the code silently relies on the later `wrapping_add` wrapping back exactly once so the two `2^32` terms cancel. That cancellation only holds while `(size - BASE) * byte <= self.b + BASE - 1`. Beyond that the multiplication wraps an extra time and the leftover `2^32` term does **not** vanish under `% BASE`, because `2^32 % 65521 == 225`. The resulting hash's high half (`b`) is off by a multiple of `225 (mod BASE)`.\n\nVerified empirically against a reference Adler32 over sliding windows: window sizes up to `65536` are correct, the first mismatch appears at window size `65798`, and every larger window tested (`66000`, `70000`, `200000`, `1000000`) is wrong. Example at window `200000`: the crate returns `0x77ca326c` where the true rolling hash is `0x76e9326c` - exactly `0x0e1 = 225` too high in `b`.\n\nThis is a silent data-integrity bug: any consumer using `remove()` for a rolling window larger than ~64 KiB (rsync-style delta sync, dedup chunkers, `RollingAdler32`-based content-defined chunking) produces hashes that disagree with `adler32()` over the same window, so matches are missed or mismatches accepted.\n\nThe existing test `long_window_remove` deliberately exercises a window with `w = 65536` and asserts `w as u32 > BASE`, which reads as coverage for this case - but `65536` is just below the failure threshold, so the test passes and gives false confidence.","fix":"Reduce `size` modulo `BASE` before negating it. Then no intermediate can exceed `(BASE-1) + (BASE-1) + BASE*255 = 16_838_895`, so plain (non-wrapping) arithmetic is sufficient and the `wrapping_*` calls can be dropped entirely - which also removes the `size as u32` truncation problem.\n\nBefore:\n\n```rust\npub fn remove(&mut self, size: usize, byte: u8) {\n    let byte = u32::from(byte);\n    self.a = (self.a + BASE - byte) % BASE;\n    self.b = ((self.b + BASE - 1)\n        .wrapping_add(BASE.wrapping_sub(size as u32).wrapping_mul(byte)))\n        % BASE;\n}\n```\n\nAfter:\n\n```rust\npub fn remove(&mut self, size: usize, byte: u8) {\n    let byte = u32::from(byte);\n    let size = (size % BASE as usize) as u32;\n    self.a = (self.a + BASE - byte) % BASE;\n    self.b = (self.b + BASE - 1 + (BASE - size) * byte) % BASE;\n}\n```\n\nAlso extend `long_window_remove` past the threshold (e.g. `w = 70000`) and add a test that cross-checks `remove()`-driven rolling hashes against `adler32()` over the same window for several window sizes, including one above `65798`.","locations":[{"ref":"src/lib.rs:124-130","code":"  124 |     pub fn remove(&mut self, size: usize, byte: u8) {\n  125 |         let byte = u32::from(byte);\n  126 |         self.a = (self.a + BASE - byte) % BASE;\n  127 |         self.b = ((self.b + BASE - 1)\n  128 |             .wrapping_add(BASE.wrapping_sub(size as u32).wrapping_mul(byte)))\n  129 |             % BASE;\n  130 |     }","lines":7,"link":"https://github.com/remram44/adler32-rs/blob/3ab7df27540f9a9cbd9d6270067d7070dfd18ff4/src/lib.rs#L124-L130"},{"ref":"src/lib.rs:303-323","code":"  303 |     fn long_window_remove() {\n  304 |         let mut hash = RollingAdler32::new();\n  305 |         let w = 65536;\n  306 |         assert!(w as u32 > BASE);\n  307 | \n  308 |         let mut bytes = vec![0; w * 3];\n  309 |         for (i, b) in bytes.iter_mut().enumerate() {\n  310 |             *b = i as u8;\n  311 |         }\n  312 | \n  313 |         for (i, b) in bytes.iter().enumerate() {\n  314 |             if i >= w {\n  315 |                 hash.remove(w, bytes[i - w]);\n  316 |             }\n  317 |             hash.update(*b);\n  318 |             if i > 0 && i % w == 0 {\n  319 |                 assert_eq!(hash.hash(), 0x433a8772);\n  320 |             }\n  321 |         }\n  322 |         assert_eq!(hash.hash(), 0xbbba8772);\n  323 |     }","lines":21,"link":"https://github.com/remram44/adler32-rs/blob/3ab7df27540f9a9cbd9d6270067d7070dfd18ff4/src/lib.rs#L303-L323"}]},{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`from_value` splits the supplied `u32` into `a = adler32 & 0xFFFF` and `b = adler32 >> 16` without reducing either half modulo `BASE`. Both halves can therefore be up to `65535`, i.e. larger than `BASE - 1 == 65520`, leaving the context in a non-canonical state that no other constructor can produce. The consequence is an observable inconsistency: `RollingAdler32::from_value(0xFFFFFFFF).hash()` returns `0xFFFFFFFF`, but feeding it an *empty* buffer - `update_buffer(&[])`, which should be a no-op - takes the `len < 16` branch and runs the trailing reduction, so `hash()` then returns `0x000E000E`. A hash function whose value changes when zero bytes are added is surprising, and the discrepancy also shows up when a non-canonical context is compared against one built with `from_buffer`.","fix":"Canonicalize both halves in the constructor:\n\n```rust\npub fn from_value(adler32: u32) -> RollingAdler32 {\n    let a = (adler32 & 0xFFFF) % BASE;\n    let b = (adler32 >> 16) % BASE;\n    RollingAdler32 { a, b }\n}\n```\n\nAlternatively, make `update_buffer` return early on `buffer.is_empty()` so an empty update is unconditionally a no-op - but reducing in `from_value` is the more complete fix, since it also keeps `hash()` self-consistent.","locations":[{"ref":"src/lib.rs:105-109","code":"  105 |     pub fn from_value(adler32: u32) -> RollingAdler32 {\n  106 |         let a = adler32 & 0xFFFF;\n  107 |         let b = adler32 >> 16;\n  108 |         RollingAdler32 { a, b }\n  109 |     }","lines":5,"link":"https://github.com/remram44/adler32-rs/blob/3ab7df27540f9a9cbd9d6270067d7070dfd18ff4/src/lib.rs#L105-L109"},{"ref":"src/lib.rs:140-160","code":"  140 |     pub fn update_buffer(&mut self, buffer: &[u8]) {\n  141 |         let len = buffer.len();\n  142 | \n  143 |         // in case user likes doing a byte at a time, keep it fast\n  144 |         if len == 1 {\n  145 |             self.update(buffer[0]);\n  146 |             return;\n  147 |         }\n  148 | \n  149 |         // in case short lengths are provided, keep it somewhat fast\n  150 |         if len < 16 {\n  151 |             for byte in buffer.iter().take(len) {\n  152 |                 self.a += u32::from(*byte);\n  153 |                 self.b += self.a;\n  154 |             }\n  155 |             if self.a >= BASE {\n  156 |                 self.a -= BASE;\n  157 |             }\n  158 |             self.b %= BASE;\n  159 |             return;\n  160 |         }","lines":21,"link":"https://github.com/remram44/adler32-rs/blob/3ab7df27540f9a9cbd9d6270067d7070dfd18ff4/src/lib.rs#L140-L160"}]},{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`remove()` casts the `usize` window length with `size as u32`, which truncates silently on 64-bit targets. A window of exactly `2^32` bytes yields `size as u32 == 0`, so `BASE.wrapping_sub(0) == BASE ≡ 0 (mod BASE)` and the `size * byte` correction term disappears completely - `b` is then only decremented by `1` instead of by `size * byte`. Any `size >= 2^32` produces a wrong hash with no diagnostic. This is a distinct trigger from the wrapping defect in the same expression: it misbehaves even for `byte == 0` boundaries where the wrapping issue would not fire.","fix":"Reduce in `usize` width *before* narrowing, so no information is lost: replace `size as u32` with `(size % BASE as usize) as u32`. This is the same one-line change described in the `remove()` wrapping finding and fixes both issues at once.","locations":[{"ref":"src/lib.rs:127-129","code":"  127 |         self.b = ((self.b + BASE - 1)\n  128 |             .wrapping_add(BASE.wrapping_sub(size as u32).wrapping_mul(byte)))\n  129 |             % BASE;","lines":3,"link":"https://github.com/remram44/adler32-rs/blob/3ab7df27540f9a9cbd9d6270067d7070dfd18ff4/src/lib.rs#L127-L129"}]},{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`adler32()` calls `reader.read(&mut buffer)?` and propagates every error, including `std::io::ErrorKind::Interrupted`. The `std::io::Read` contract explicitly states that `Interrupted` is not a real failure and that callers are expected to retry, which is why `Read::read_exact` and `io::copy` loop on it internally. As written, a signal delivered mid-read (common when hashing a large file or socket in a process using `SIGALRM`, `SIGCHLD`, `SIGWINCH`, or a profiler) aborts the whole hash computation with a spurious `Err`, discarding all work done so far. The failure is nondeterministic and load-dependent, so it is unlikely to be caught in testing.","fix":"Retry on `Interrupted` instead of propagating it:\n\n```rust\n#[cfg(feature = \"std\")]\npub fn adler32<R: std::io::Read>(mut reader: R) -> std::io::Result<u32> {\n    use std::io::ErrorKind;\n\n    let mut hash = RollingAdler32::new();\n    let mut buffer = [0u8; 64 * 1024];\n    loop {\n        match reader.read(&mut buffer) {\n            Ok(0) => return Ok(hash.hash()),\n            Ok(read) => hash.update_buffer(&buffer[..read]),\n            Err(ref e) if e.kind() == ErrorKind::Interrupted => continue,\n            Err(e) => return Err(e),\n        }\n    }\n}\n```\n\nThis also removes the duplicated `reader.read(...)` call (once before the loop, once at the end of the body).","locations":[{"ref":"src/lib.rs:196-205","code":"  196 | pub fn adler32<R: std::io::Read>(mut reader: R) -> std::io::Result<u32> {\n  197 |     let mut hash = RollingAdler32::new();\n  198 |     let mut buffer = [0u8; NMAX];\n  199 |     let mut read = reader.read(&mut buffer)?;\n  200 |     while read > 0 {\n  201 |         hash.update_buffer(&buffer[..read]);\n  202 |         read = reader.read(&mut buffer)?;\n  203 |     }\n  204 |     Ok(hash.hash())\n  205 | }","lines":10,"link":"https://github.com/remram44/adler32-rs/blob/3ab7df27540f9a9cbd9d6270067d7070dfd18ff4/src/lib.rs#L196-L205"}]},{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"high","difficulty":"hard","description":"`update_buffer` is a literal transcription of zlib's scalar loop: `a += buf[i]; b += a;`. The carried dependency `b` depends on the just-updated `a`, which is a serial chain the auto-vectorizer cannot break, so the hot loop runs at roughly one byte per cycle regardless of target features. The `do1`/`do2`/`do4`/`do8`/`do16` unrolling ladder only hides loop overhead - it does not remove the dependency.\n\nAdler32 can be reassociated so that each accumulator is an independent reduction over the block: for a block of `n` bytes, `a += Σ buf[i]` and `b += n*a_prev + Σ (n - i) * buf[i]`. Both sums are plain weighted reductions that LLVM vectorizes, and the technique is what makes the `adler` crate ~4x and `simd-adler32` more than 10x faster than this implementation on the same input. Since this crate sits on the `flate2`/`png` decode path for many users, sustained throughput on multi-megabyte buffers is the dominant cost of the whole crate.","fix":"Rewrite the NMAX block loop as two independent reductions over `chunks_exact(16)` (or larger) so LLVM can vectorize them, keeping the `% BASE` cadence at `NMAX` bytes:\n\n```rust\n// per NMAX-sized block, with `chunk` a &[u8] of length n <= NMAX\nlet n = chunk.len() as u32;\nlet mut sum_bytes = 0u32;      // Σ buf[i]\nlet mut sum_weighted = 0u32;   // Σ (n - i) * buf[i]\nfor (i, &byte) in chunk.iter().enumerate() {\n    sum_bytes += u32::from(byte);\n    sum_weighted += (n - i as u32) * u32::from(byte);\n}\nself.b = self.b + n * self.a + sum_weighted;\nself.a += sum_bytes;\nself.a %= BASE;\nself.b %= BASE;\n```\n\nRecheck the overflow bound for the chosen block size (the `sum_weighted` term grows faster than zlib's `sum2`, so `NMAX` may need lowering) and keep the existing `testvectors` / `compare` tests as the correctness gate. If maximum throughput matters more than `#![forbid(unsafe_code)]` and `no_std` portability, consider delegating to `simd-adler32` behind a feature flag instead of hand-rolling SIMD.","locations":[{"ref":"src/lib.rs:162-191","code":"  162 |         let mut pos = 0;\n  163 | \n  164 |         // do length NMAX blocks -- requires just one modulo operation;\n  165 |         while pos + NMAX <= len {\n  166 |             let end = pos + NMAX;\n  167 |             while pos < end {\n  168 |                 // 16 sums unrolled\n  169 |                 do16(&mut self.a, &mut self.b, &buffer[pos..pos + 16]);\n  170 |                 pos += 16;\n  171 |             }\n  172 |             self.a %= BASE;\n  173 |             self.b %= BASE;\n  174 |         }\n  175 | \n  176 |         // do remaining bytes (less than NMAX, still just one modulo)\n  177 |         if pos < len {\n  178 |             // avoid modulos if none remaining\n  179 |             while len - pos >= 16 {\n  180 |                 do16(&mut self.a, &mut self.b, &buffer[pos..pos + 16]);\n  181 |                 pos += 16;\n  182 |             }\n  183 |             while len - pos > 0 {\n  184 |                 self.a += u32::from(buffer[pos]);\n  185 |                 self.b += self.a;\n  186 |                 pos += 1;\n  187 |             }\n  188 |             self.a %= BASE;\n  189 |             self.b %= BASE;\n  190 |         }\n  191 |     }","lines":30,"link":"https://github.com/remram44/adler32-rs/blob/3ab7df27540f9a9cbd9d6270067d7070dfd18ff4/src/lib.rs#L162-L191"},{"ref":"src/lib.rs:51-79","code":"   51 | #[inline(always)]\n   52 | fn do1(adler: &mut u32, sum2: &mut u32, buf: &[u8]) {\n   53 |     *adler += u32::from(buf[0]);\n   54 |     *sum2 += *adler;\n   55 | }\n   56 | \n   57 | #[inline(always)]\n   58 | fn do2(adler: &mut u32, sum2: &mut u32, buf: &[u8]) {\n   59 |     do1(adler, sum2, &buf[0..1]);\n   60 |     do1(adler, sum2, &buf[1..2]);\n   61 | }\n   62 | \n   63 | #[inline(always)]\n   64 | fn do4(adler: &mut u32, sum2: &mut u32, buf: &[u8]) {\n   65 |     do2(adler, sum2, &buf[0..2]);\n   66 |     do2(adler, sum2, &buf[2..4]);\n   67 | }\n   68 | \n   69 | #[inline(always)]\n   70 | fn do8(adler: &mut u32, sum2: &mut u32, buf: &[u8]) {\n   71 |     do4(adler, sum2, &buf[0..4]);\n   72 |     do4(adler, sum2, &buf[4..8]);\n   73 | }\n   74 | \n   75 | #[inline(always)]\n   76 | fn do16(adler: &mut u32, sum2: &mut u32, buf: &[u8]) {\n   77 |     do8(adler, sum2, &buf[0..8]);\n   78 |     do8(adler, sum2, &buf[8..16]);\n   79 | }","lines":29,"link":"https://github.com/remram44/adler32-rs/blob/3ab7df27540f9a9cbd9d6270067d7070dfd18ff4/src/lib.rs#L51-L79"}]},{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"medium","difficulty":"very_easy","description":"`adler32()` sizes its I/O buffer with `NMAX` (5552), the constant that controls how often the accumulators are reduced modulo `BASE`. Those are unrelated concerns, and 5552 bytes is far too small for an I/O buffer: hashing a 1 GiB file issues about 193,000 `read` syscalls instead of the ~16,000 a 64 KiB buffer would need. `update_buffer` already handles arbitrary lengths and does its own `NMAX` blocking internally, so a larger buffer costs nothing in correctness.","fix":"Change\n\n```rust\nlet mut buffer = [0u8; NMAX];\n```\n\nto\n\n```rust\nlet mut buffer = [0u8; 64 * 1024];\n```","locations":[{"ref":"src/lib.rs:198","code":"  198 |     let mut buffer = [0u8; NMAX];","lines":1,"link":"https://github.com/remram44/adler32-rs/blob/3ab7df27540f9a9cbd9d6270067d7070dfd18ff4/src/lib.rs#L198"}]},{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`.take(len)` is a no-op: `len` was just bound to `buffer.len()` on the line above, so the iterator is already limited to exactly `len` items. It adds a `Take` adapter for no reason and misleadingly suggests `buffer` might be longer than `len`.","fix":"Change\n\n```rust\nfor byte in buffer.iter().take(len) {\n```\n\nto\n\n```rust\nfor byte in buffer.iter() {\n```","locations":[{"ref":"src/lib.rs:140-151","code":"  140 |     pub fn update_buffer(&mut self, buffer: &[u8]) {\n  141 |         let len = buffer.len();\n  142 | \n  143 |         // in case user likes doing a byte at a time, keep it fast\n  144 |         if len == 1 {\n  145 |             self.update(buffer[0]);\n  146 |             return;\n  147 |         }\n  148 | \n  149 |         // in case short lengths are provided, keep it somewhat fast\n  150 |         if len < 16 {\n  151 |             for byte in buffer.iter().take(len) {","lines":12,"link":"https://github.com/remram44/adler32-rs/blob/3ab7df27540f9a9cbd9d6270067d7070dfd18ff4/src/lib.rs#L140-L151"}]},{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"The `len == 1` special case is redundant: the `len < 16` branch immediately below already handles a single byte, and does so with *less* work - one `%` plus a conditional subtract, versus the two `%` operations that `update` performs. The comment \"in case user likes doing a byte at a time, keep it fast\" describes an optimization the branch does not actually deliver; it exists in zlib only because C's loop setup was more expensive there.","fix":"Delete the branch:\n\n```rust\n// in case user likes doing a byte at a time, keep it fast\nif len == 1 {\n    self.update(buffer[0]);\n    return;\n}\n```\n\nThe `len < 16` path below produces identical results for `len == 1`; the `testvectors` test (`b\"a\"`) already covers it.","locations":[{"ref":"src/lib.rs:143-147","code":"  143 |         // in case user likes doing a byte at a time, keep it fast\n  144 |         if len == 1 {\n  145 |             self.update(buffer[0]);\n  146 |             return;\n  147 |         }","lines":5,"link":"https://github.com/remram44/adler32-rs/blob/3ab7df27540f9a9cbd9d6270067d7070dfd18ff4/src/lib.rs#L143-L147"}]},{"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"`do1` through `do16` are a mechanical transcription of zlib's `DO1`/`DO2`/`DO4`/`DO8`/`DO16` C preprocessor macros, spread over 29 lines of five mutually recursive `#[inline(always)]` functions that thread `&mut u32` out-parameters and re-slice the input at every level (`&buf[0..1]`, `&buf[0..2]`, ...). The manual unrolling exists in zlib to help 1990s C compilers; rustc/LLVM unroll and reassociate the equivalent `for` loop themselves, so the ladder buys nothing while making the hot path much harder to read, harder to verify against the algorithm, and harder to replace with a vectorized version. The nested re-slicing also means the compiler has to prove away up to 15 redundant slice bounds checks per 16 bytes.\n\nSecondary structural issue: `do1` indexes `buf[0]` with no length guard, so the whole ladder is panic-safe only by virtue of every caller passing exactly-sized slices - an invariant enforced nowhere and documented nowhere.","fix":"Replace the five functions with a single loop over fixed-size chunks, which encodes the length invariant in the type system and lets the optimizer handle unrolling:\n\n```rust\nfor chunk in buffer[pos..end].chunks_exact(16) {\n    for &byte in chunk {\n        self.a += u32::from(byte);\n        self.b += self.a;\n    }\n}\n```\n\nIf explicit 16-wide unrolling is still wanted, take `&[u8; 16]` instead of `&[u8]` so indexing is statically in bounds:\n\n```rust\n#[inline(always)]\nfn do16(adler: &mut u32, sum2: &mut u32, buf: &[u8; 16]) { /* ... */ }\n```\n\nBenchmark with `src/bench.rs` before and after to confirm no regression.","locations":[{"ref":"src/lib.rs:51-79","code":"   51 | #[inline(always)]\n   52 | fn do1(adler: &mut u32, sum2: &mut u32, buf: &[u8]) {\n   53 |     *adler += u32::from(buf[0]);\n   54 |     *sum2 += *adler;\n   55 | }\n   56 | \n   57 | #[inline(always)]\n   58 | fn do2(adler: &mut u32, sum2: &mut u32, buf: &[u8]) {\n   59 |     do1(adler, sum2, &buf[0..1]);\n   60 |     do1(adler, sum2, &buf[1..2]);\n   61 | }\n   62 | \n   63 | #[inline(always)]\n   64 | fn do4(adler: &mut u32, sum2: &mut u32, buf: &[u8]) {\n   65 |     do2(adler, sum2, &buf[0..2]);\n   66 |     do2(adler, sum2, &buf[2..4]);\n   67 | }\n   68 | \n   69 | #[inline(always)]\n   70 | fn do8(adler: &mut u32, sum2: &mut u32, buf: &[u8]) {\n   71 |     do4(adler, sum2, &buf[0..4]);\n   72 |     do4(adler, sum2, &buf[4..8]);\n   73 | }\n   74 | \n   75 | #[inline(always)]\n   76 | fn do16(adler: &mut u32, sum2: &mut u32, buf: &[u8]) {\n   77 |     do8(adler, sum2, &buf[0..8]);\n   78 |     do8(adler, sum2, &buf[8..16]);\n   79 | }","lines":29,"link":"https://github.com/remram44/adler32-rs/blob/3ab7df27540f9a9cbd9d6270067d7070dfd18ff4/src/lib.rs#L51-L79"},{"ref":"src/lib.rs:165-190","code":"  165 |         while pos + NMAX <= len {\n  166 |             let end = pos + NMAX;\n  167 |             while pos < end {\n  168 |                 // 16 sums unrolled\n  169 |                 do16(&mut self.a, &mut self.b, &buffer[pos..pos + 16]);\n  170 |                 pos += 16;\n  171 |             }\n  172 |             self.a %= BASE;\n  173 |             self.b %= BASE;\n  174 |         }\n  175 | \n  176 |         // do remaining bytes (less than NMAX, still just one modulo)\n  177 |         if pos < len {\n  178 |             // avoid modulos if none remaining\n  179 |             while len - pos >= 16 {\n  180 |                 do16(&mut self.a, &mut self.b, &buffer[pos..pos + 16]);\n  181 |                 pos += 16;\n  182 |             }\n  183 |             while len - pos > 0 {\n  184 |                 self.a += u32::from(buffer[pos]);\n  185 |                 self.b += self.a;\n  186 |                 pos += 1;\n  187 |             }\n  188 |             self.a %= BASE;\n  189 |             self.b %= BASE;\n  190 |         }","lines":26,"link":"https://github.com/remram44/adler32-rs/blob/3ab7df27540f9a9cbd9d6270067d7070dfd18ff4/src/lib.rs#L165-L190"}]},{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment for `remove()` states only that the byte was fed `size` bytes ago, with no mention that the implementation's modular arithmetic is only valid for a bounded range of `size`. Given that the current implementation silently returns wrong results for windows above ~65.8 KiB (see the `remove()` wrapping finding), the documentation actively misleads callers into believing arbitrary window sizes are supported. It also does not say what happens if `size` does not match the number of `update()` calls since that byte was added.","fix":"After fixing the arithmetic, document the contract explicitly:\n\n```rust\n/// Removes the given `byte` that was fed to the algorithm `size` bytes ago.\n///\n/// `size` must be the number of bytes fed since (and including) `byte`, i.e.\n/// the length of the rolling window. Any window size is supported; the value\n/// is reduced modulo `BASE` internally.\n///\n/// Passing a `size` that does not match the actual window, or a `byte` that\n/// was not the one fed `size` bytes ago, yields a meaningless hash.\n```","locations":[{"ref":"src/lib.rs:123-124","code":"  123 |     /// Removes the given `byte` that was fed to the algorithm `size` bytes ago.\n  124 |     pub fn remove(&mut self, size: usize, byte: u8) {","lines":2,"link":"https://github.com/remram44/adler32-rs/blob/3ab7df27540f9a9cbd9d6270067d7070dfd18ff4/src/lib.rs#L123-L124"}]},{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The comment `// avoid modulos if none remaining` sits between the `if pos < len {` guard and the `while len - pos >= 16` loop, so it reads as an explanation of the loop. It actually explains the enclosing `if`, whose purpose is to skip the two trailing `% BASE` operations when no bytes remain. As placed it is confusing - the loop it precedes has nothing to do with avoiding modulos.","fix":"Move the comment above the `if` it describes:\n\n```rust\n// do remaining bytes (less than NMAX, still just one modulo)\n// the `if` avoids the two modulos when nothing remains\nif pos < len {\n    while len - pos >= 16 {\n```","locations":[{"ref":"src/lib.rs:176-179","code":"  176 |         // do remaining bytes (less than NMAX, still just one modulo)\n  177 |         if pos < len {\n  178 |             // avoid modulos if none remaining\n  179 |             while len - pos >= 16 {","lines":4,"link":"https://github.com/remram44/adler32-rs/blob/3ab7df27540f9a9cbd9d6270067d7070dfd18ff4/src/lib.rs#L176-L179"}]},{"id":"OTHER_1","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"`src/bench.rs` creates `adler` once per input size and reuses it across every `b.iter()` iteration, so `update_buffer` is always measured against a warm, already-reduced accumulator state and never against a freshly constructed context. More importantly the benchmark covers only the `len >= 16` bulk path at two sizes (512 B and 100 KiB): the `len == 1` branch, the `len < 16` branch, the exact `NMAX` block boundary, `remove()`, and the `adler32()` reader path are all unmeasured. Any optimization work guided by this benchmark - notably the vectorization rewrite - would land blind on the paths most likely to regress.","fix":"Add sizes that straddle the branch boundaries (`1`, `15`, `16`, `5551`, `5552`, `5553`) and separate benchmark groups for `remove` and `adler32`. Construct the hasher inside the closure, or use `iter_batched` with `RollingAdler32::new` as the setup routine, so per-call state is not carried between iterations:\n\n```rust\ngroup.bench_with_input(BenchmarkId::from_parameter(formatted_size), &in_bytes, |b, data| {\n    b.iter_batched(\n        RollingAdler32::new,\n        |mut adler| adler.update_buffer(data),\n        criterion::BatchSize::SmallInput,\n    );\n});\n```","locations":[{"ref":"src/bench.rs:6-27","code":"    6 | fn bench_update_buffer(c: &mut Criterion) {\n    7 |     let mut rng = rand::thread_rng();\n    8 |     let mut group = c.benchmark_group(\"update_buffer\");\n    9 |     for &size in [512, 100 * 1024].iter() {\n   10 |         let mut adler = RollingAdler32::new();\n   11 |         let formatted_size = size.file_size(file_size_opts::BINARY).unwrap();\n   12 |         let in_bytes = {\n   13 |             let mut in_bytes = vec![0u8; size];\n   14 |             rng.fill(&mut in_bytes[..]);\n   15 |             in_bytes\n   16 |         };\n   17 | \n   18 |         group.throughput(Throughput::Bytes(size as u64));\n   19 |         group.bench_with_input(\n   20 |             BenchmarkId::from_parameter(formatted_size),\n   21 |             &in_bytes,\n   22 |             |b, data| {\n   23 |                 b.iter(|| adler.update_buffer(data));\n   24 |             },\n   25 |         );\n   26 |     }\n   27 | }","lines":22,"link":"https://github.com/remram44/adler32-rs/blob/3ab7df27540f9a9cbd9d6270067d7070dfd18ff4/src/bench.rs#L6-L27"}]}]</script>

function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += '**Description:** ' + (f.description || '') + '\n\n';
      if (f.locations.length) {
        out += '**Locations:**\n\n';
        for (const l of f.locations) {
          if (l.code != null) out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
          else                out += '- `' + l.ref + '` _(file not found)_\n\n';
        }
      }
      out += '**Fix:** ' + (f.fix || '') + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return chunks.join('\n\n') + '\n';
}

// Build project-info.toml from embedded PROJECT_INFO (same format as gen_project_info.py).
function buildProjectInfoToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = Object.assign({}, PROJECT_INFO);
  if (!('description' in pi)) pi.description = '';
  const lines = [
    '# Project metadata for the code audit report (all fields optional).',
    '# Hand-edit freely (e.g. fill in description); re-run the audit without --force to keep edits.',
    '', '[project]'
  ];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += '**Description:** ' + (f.description || '') + '\n\n';
  if (f.locations.length) {
    out += '**Locations:**\n\n';
    for (const l of f.locations) {
      if (l.code != null) out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
      else                out += '- `' + l.ref + '` _(file not found)_\n\n';
    }
  }
  out += '**Fix:** ' + (f.fix || '') + '\n';
  const links = f.locations.map(l => l.link).filter(Boolean);
  if (links.length) out += '\n' + links.join('\n') + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystack per finding (cleared on full re-render)
const _hay = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (!hayOf(f).includes(q) && !st.includes(q)) return false;
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    downloadText(buildFindingsToml(),    'findings.toml',     'application/toml');
    downloadText(buildProjectInfoToml(), 'project-info.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
