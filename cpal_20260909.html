<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`buffer_size()` calls `.expect(\"ASIO stream has neither input nor output\")` on the result of `streams.output.or(streams.input)`. While normally one of them is set, the event callback handling `kAsioBufferSizeChange` (and the stream-rollback paths on error) can set `streams.input`/`streams.output` to `None`, and a buffer-size-change race or a teardown sequence can transiently leave both empty. A user calling `buffer_size()` then panics. A public API method should never panic on driver-controlled state.","fix":"Return `Err(Error::with_message(ErrorKind::StreamInvalidated, ...))` instead of `.expect(...)` when both streams are `None`.","locations":[{"ref":"src/host/asio/stream.rs:102-112","code":"  102 |     pub fn buffer_size(&self) -> Result<FrameCount, Error> {\n  103 |         let streams = self.asio_streams.lock().map_err(|_| {\n  104 |             Error::with_message(ErrorKind::StreamInvalidated, \"Stream lock poisoned\")\n  105 |         })?;\n  106 |         Ok(streams\n  107 |             .output\n  108 |             .as_ref()\n  109 |             .or(streams.input.as_ref())\n  110 |             .expect(\"ASIO stream has neither input nor output\")\n  111 |             .buffer_size as FrameCount)\n  112 |     }","lines":11,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/asio/stream.rs#L102-L112"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"very_easy","description":"`Stream::play` calls `web_sys::window().unwrap()`. In a Web Worker / AudioWorklet-less context (or any environment where `window` is undefined, e.g. running cpal under a worker), `window()` returns `None` and this panics across the FFI boundary inside a WASM module, which is undefined-behaviour-adjacent and at minimum aborts the stream start. `play()` returns `Result<(), Error>`, so this should be a recoverable error.","fix":"Replace `.unwrap()` with `ok_or_else(|| Error::with_message(ErrorKind::DeviceNotAvailable, \"no window available\"))?` and propagate the error.","locations":[{"ref":"src/host/webaudio/mod.rs:901","code":"  901 |                 let window = web_sys::window().unwrap();","lines":1,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/webaudio/mod.rs#L901"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"`create_buffers` calls `panic!(\"ASIOGetBufferSize produced unusable preferred buffer size of {}\")` when `buffer_sizes.pref <= 0`. A misbehaving driver reporting a non-positive preferred buffer size will crash the application from within stream construction rather than returning a recoverable error.","fix":"Return `Err(AsioError::InvalidBufferSize)` instead of panicking.","locations":[{"ref":"asio-sys/src/bindings/mod.rs:696-701","code":"  696 |         if buffer_sizes.pref <= 0 {\n  697 |             panic!(\n  698 |                 \"`ASIOGetBufferSize` produced unusable preferred buffer size of {}\",\n  699 |                 buffer_sizes.pref,\n  700 |             );\n  701 |         }","lines":6,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/asio-sys/src/bindings/mod.rs#L696-L701"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`stream_data_type` does `FromPrimitive::from_i32(channel_info.type_).expect(\"unknown ASIOSampletype value\")`. The driver fully controls `type_`; ASIO defines sample-type values (e.g. DSD variants, the MSB16/18/20/24 variants) that are valid per the SDK but absent from many drivers, and a non-conformant or future driver can return any i32. This is reachable during device enumeration (`input_data_type`/`output_data_type`) and during stream build, so a single odd driver panics the whole process instead of being skipped.","fix":"Return `Err(AsioError::UnknownError)` (or a dedicated error) instead of `.expect(...)` so the caller can skip the device.","locations":[{"ref":"asio-sys/src/bindings/mod.rs:1131-1134","code":" 1131 | fn stream_data_type(is_input: bool) -> Result<AsioSampleType, AsioError> {\n 1132 |     let channel_info = asio_channel_info(0, is_input)?;\n 1133 |     Ok(FromPrimitive::from_i32(channel_info.type_).expect(\"unknown `ASIOSampletype` value\"))\n 1134 | }","lines":4,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/asio-sys/src/bindings/mod.rs#L1131-L1134"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"JACK process callback writes input data with `self.temp_input_buffer[ch_ix + i * num_in_channels]` where `i` runs `0..current_frame_count` and `current_frame_count = process_scope.n_frames()`. The temp buffer is sized `in_ports.len() * self.buffer_size`. The `buffer_size` callback resizes the temp buffers, but JACK does not guarantee the `buffer_size` callback fires before the first `process` call with a larger n_frames in all reconfiguration races; if `n_frames > buffer_size` the indexing panics in the real-time thread (and `temp_buffer_to_data` also panics, as its own comment on line 419 admits). A panic in the JACK process thread is undefined/abortive.","fix":"Clamp `current_frame_count` to `self.buffer_size` (or `min` of the two) before indexing, or grow the temp buffers on demand at the top of `process` if `n_frames` exceeds the current capacity.","locations":[{"ref":"src/host/jack/stream.rs:460-470","code":"  460 |             for ch_ix in 0..num_in_channels {\n  461 |                 let input_channel = &self.in_ports[ch_ix].as_slice(process_scope);\n  462 |                 for i in 0..current_frame_count {\n  463 |                     self.temp_input_buffer[ch_ix + i * num_in_channels] = input_channel[i];\n  464 |                 }\n  465 |             }\n  466 |             // Create a slice of exactly current_frame_count frames\n  467 |             let data = temp_buffer_to_data(\n  468 |                 &mut self.temp_input_buffer,\n  469 |                 current_frame_count * num_in_channels,\n  470 |             );","lines":11,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/jack/stream.rs#L460-L470"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`Device::description` calls `device.OpenPropertyStore(STGM_READ).expect(\"could not open property store\")`. OpenPropertyStore can fail at runtime (device invalidated/disconnected, access denied), and this is reachable from the public `DeviceTrait::description` and from the `Display`/`Debug` impls, so a disconnected device panics the caller instead of returning an Error.","fix":"Propagate the failure as an `Error` via `?`/`map_err(Error::from)` instead of `.expect`.","locations":[{"ref":"src/host/wasapi/device.rs:421-423","code":"  421 |             let property_store = device\n  422 |                 .OpenPropertyStore(STGM_READ)\n  423 |                 .expect(\"could not open property store\");","lines":3,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/wasapi/device.rs#L421-L423"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`Devices::next` calls `self.collection.Item(self.next_item).unwrap()`. IMMDeviceCollection::Item can fail (E_INVALIDARG, or a device removed between GetCount and iteration in a TOCTOU window), which would panic during a plain iteration over devices in user code.","fix":"Map the error: on `Err`, either skip the item (advance next_item and recurse/continue) or terminate iteration by returning None. Do not unwrap inside Iterator::next.","locations":[{"ref":"src/host/wasapi/device.rs:1306-1316","code":" 1306 |     fn next(&mut self) -> Option<Self::Item> {\n 1307 |         if self.next_item >= self.total_count {\n 1308 |             return None;\n 1309 |         }\n 1310 | \n 1311 |         unsafe {\n 1312 |             let device = self.collection.Item(self.next_item).unwrap();\n 1313 |             self.next_item += 1;\n 1314 |             Some(Self::Item::from_immdevice(device))\n 1315 |         }\n 1316 |     }","lines":11,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/wasapi/device.rs#L1306-L1316"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"Several `.read().unwrap()` / `.write().unwrap()` calls on the `ClosureHandle` RwLock and the time-cursor RwLock will panic if the lock is poisoned. While WASM is single-threaded so poisoning is unlikely, a panic inside the JS `ended` callback (e.g. from `from_secs_f64` on a bad time) unwinds into JS as an abort. The `.expect(\"Unable to get a read lock on the time cursor\")` at line 381 is the same pattern. These run in the audio scheduling hot path.","fix":"Use `unwrap_or_else(|e| e.into_inner())` for lock recovery (as is already done for the data/error callback mutexes) instead of `.unwrap()`/`.expect()`.","locations":[{"ref":"src/host/webaudio/mod.rs:684-686","code":"  684 |             on_ended_closure\n  685 |                 .write()\n  686 |                 .unwrap()","lines":3,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/webaudio/mod.rs#L684-L686"},{"ref":"src/host/webaudio/mod.rs:695-697","code":"  695 |                         let time_at_start_of_buffer = time_handle\n  696 |                             .read()\n  697 |                             .expect(\"Unable to get a read lock on the time cursor\");","lines":3,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/webaudio/mod.rs#L695-L697"},{"ref":"src/host/webaudio/mod.rs:844-849","code":"  844 |                                 .read()\n  845 |                                 .unwrap()\n  846 |                                 .as_ref()\n  847 |                                 .unwrap()\n  848 |                                 .as_ref()\n  849 |                                 .unchecked_ref(),","lines":6,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/webaudio/mod.rs#L844-L849"},{"ref":"src/host/webaudio/mod.rs:878","code":"  878 |                     *time_handle.write().unwrap() = time_at_start_of_buffer + buffer_time_step_secs;","lines":1,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/webaudio/mod.rs#L878"},{"ref":"src/host/webaudio/mod.rs:1564-1573","code":" 1564 |                 on_ended_closure\n 1565 |                     .read()\n 1566 |                     .unwrap()\n 1567 |                     .as_ref()\n 1568 |                     .unwrap()\n 1569 |                     .as_ref()\n 1570 |                     .unchecked_ref(),\n 1571 |                 offset_ms,\n 1572 |             )\n 1573 |             .unwrap();","lines":10,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/webaudio/mod.rs#L1564-L1573"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`set_timeout_with_callback_and_timeout_and_arguments_0(...).unwrap()` in `play()` panics if the browser refuses to schedule the timeout (e.g. throws). Since `play()` is fallible, a thrown JS exception should be converted to an `Error`, not unwrapped.","fix":"Match on the result and return an Error (ErrorKind::DeviceNotAvailable / BackendError) instead of `.unwrap()`.","locations":[{"ref":"src/host/webaudio/mod.rs:1562-1573","code":" 1562 |         window\n 1563 |             .set_timeout_with_callback_and_timeout_and_arguments_0(\n 1564 |                 on_ended_closure\n 1565 |                     .read()\n 1566 |                     .unwrap()\n 1567 |                     .as_ref()\n 1568 |                     .unwrap()\n 1569 |                     .as_ref()\n 1570 |                     .unchecked_ref(),\n 1571 |                 offset_ms,\n 1572 |             )\n 1573 |             .unwrap();","lines":12,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/webaudio/mod.rs#L1562-L1573"}]},
{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`build_input_stream`/`build_output_stream` wrap the raw stream callback with `.expect(\"host supplied incorrect sample type\")` on `data.as_slice()`/`as_slice_mut()`. This expect runs inside the realtime audio callback on every buffer. If a backend ever delivers a `Data` whose `sample_format` does not match `T::FORMAT` (a backend bug, or a config the backend silently changed), the audio thread panics, which on many platforms aborts the process or unwinds across an FFI boundary (UB). A realtime callback should not contain a panic path.","fix":"Route the mismatch through the user error_callback (or document it as a hard invariant verified at stream-build time) rather than panicking inside the per-buffer realtime callback.","locations":[{"ref":"src/traits.rs:406-412","code":"  406 |             move |data, info| {\n  407 |                 data_callback(\n  408 |                     data.as_slice()\n  409 |                         .expect(\"host supplied incorrect sample type\"),\n  410 |                     info,\n  411 |                 )\n  412 |             },","lines":7,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/traits.rs#L406-L412"},{"ref":"src/traits.rs:464-470","code":"  464 |             move |data, info| {\n  465 |                 data_callback(\n  466 |                     data.as_slice_mut()\n  467 |                         .expect(\"host supplied incorrect sample type\"),\n  468 |                     info,\n  469 |                 )\n  470 |             },","lines":7,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/traits.rs#L464-L470"}]},
{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`now_stream_instant` asserts `clock_gettime(CLOCK_MONOTONIC) == 0`. This runs on the realtime audio callback thread for every callback (both input and output). On the astronomically unlikely failure of clock_gettime it panics inside the AAudio callback thread, aborting the process rather than degrading gracefully.","fix":"On failure, fall back to a best-effort instant (e.g. return StreamInstant::from_nanos(0) or the previous value) instead of asserting in the audio hot path.","locations":[{"ref":"src/host/aaudio/convert.rs:8-16","code":"    8 | pub fn now_stream_instant() -> StreamInstant {\n    9 |     let mut ts = libc::timespec {\n   10 |         tv_sec: 0,\n   11 |         tv_nsec: 0,\n   12 |     };\n   13 |     let res = unsafe { libc::clock_gettime(libc::CLOCK_MONOTONIC, &mut ts) };\n   14 |     assert_eq!(res, 0, \"clock_gettime(CLOCK_MONOTONIC) failed\");\n   15 |     StreamInstant::new(ts.tv_sec as u64, ts.tv_nsec as u32)\n   16 | }","lines":9,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/aaudio/convert.rs#L8-L16"}]},
{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"`process_input_callback_i24` calls `I24::new(sample).unwrap()` inside the realtime buffer callback. `i24_bytes_to_i32` sign-extends a 24-bit value into the range [-8388608, 8388607], which `I24::new` should accept, so this is normally safe; but if the ASIO buffer ever contains an unexpected byte layout the unwrap would panic on the audio thread. Panicking across the C ABI ASIO callback boundary is UB.","fix":"Mask to 24 bits before constructing (`I24::new(sample).unwrap_or_default()`), or construct via a method that cannot fail given the guaranteed range.","locations":[{"ref":"src/host/asio/stream.rs:1433-1437","code":" 1433 |             let sample = i24_bytes_to_i32(\n 1434 |                 &[channel_sample[0], channel_sample[1], channel_sample[2]],\n 1435 |                 little_endian,\n 1436 |             );\n 1437 |             *sample_in_buffer = I24::new(sample).unwrap();","lines":5,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/asio/stream.rs#L1433-L1437"}]},
{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"In the render/input callbacks `buffer_frames = len / channels as usize` divides by `mNumberChannels` taken directly from the CoreAudio-supplied AudioBuffer. If a buffer reports zero channels this panics (divide by zero) on the realtime audio thread, which aborts the process. The macOS paths divide unconditionally.","fix":"Guard against zero, e.g. `len.checked_div(channels as usize).unwrap_or(0)`, matching the defensive pattern already used in the iOS callbacks (ios/mod.rs:546,591).","locations":[{"ref":"src/host/coreaudio/macos/device.rs:876","code":"  876 |                 let buffer_frames = len / channels as usize;","lines":1,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/coreaudio/macos/device.rs#L876"},{"ref":"src/host/coreaudio/macos/device.rs:876","code":"  876 |                 let buffer_frames = len / channels as usize;","lines":1,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/coreaudio/macos/device.rs#L876"}]},
{"id":"PANIC_14","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"Stream::now() unwraps host_time_to_stream_instant with .expect(\"mach_timebase_info failed\"). now() is part of the public StreamTrait API; although mach_timebase_info essentially never fails, an error path is reachable and would panic in user code rather than returning an error.","fix":"Either change the trait to return Result, or fall back to StreamInstant::ZERO / a cached timebase instead of panicking.","locations":[{"ref":"src/host/coreaudio/macos/mod.rs:479-482","code":"  479 |     fn now(&self) -> StreamInstant {\n  480 |         let m_host_time = unsafe { mach2::mach_time::mach_absolute_time() };\n  481 |         host_time_to_stream_instant(m_host_time).expect(\"mach_timebase_info failed\")\n  482 |     }","lines":4,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/coreaudio/macos/mod.rs#L479-L482"},{"ref":"src/host/coreaudio/ios/mod.rs:403-406","code":"  403 |     fn now(&self) -> StreamInstant {\n  404 |         let m_host_time = unsafe { mach2::mach_time::mach_absolute_time() };\n  405 |         host_time_to_stream_instant(m_host_time).expect(\"mach_timebase_info failed\")\n  406 |     }","lines":4,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/coreaudio/ios/mod.rs#L403-L406"}]},
{"id":"PANIC_15","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"The null backend's `DeviceTrait`, `StreamTrait`, and the supported-config accessors are implemented with `unimplemented!()`, which panics if called. The null host is the fallback for unsupported platforms; `HostTrait::is_available()` returns false but `devices()` returns `Ok(Devices)` and `Device::description()`/`id()` succeed, so a downstream crate that enumerates the null device and then calls `supported_output_configs()`, `default_output_config()`, `build_*_stream_raw()`, `play()`, `pause()`, `now()`, or `buffer_size()` gets a hard panic rather than a recoverable `Err`. `Device`'s `Display` impl calls `description()` (which is fine), but the rest are panics on an otherwise-usable-looking handle.","fix":"Return `Err(Error::new(ErrorKind::DeviceNotAvailable))` (or `BackendSpecific`) from these methods instead of `unimplemented!()`. For the iterator-returning config methods, return an empty `SupportedInputConfigs`/`SupportedOutputConfigs` (they already yield `None`), and for `now()`/`buffer_size()` return an error or a zero instant rather than panicking.","locations":[{"ref":"src/host/null/mod.rs:56-62","code":"   56 |     fn supported_input_configs(&self) -> Result<SupportedInputConfigs, Error> {\n   57 |         unimplemented!()\n   58 |     }\n   59 | \n   60 |     fn supported_output_configs(&self) -> Result<SupportedOutputConfigs, Error> {\n   61 |         unimplemented!()\n   62 |     }","lines":7,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/null/mod.rs#L56-L62"},{"ref":"src/host/null/mod.rs:64-70","code":"   64 |     fn default_input_config(&self) -> Result<SupportedStreamConfig, Error> {\n   65 |         unimplemented!()\n   66 |     }\n   67 | \n   68 |     fn default_output_config(&self) -> Result<SupportedStreamConfig, Error> {\n   69 |         unimplemented!()\n   70 |     }","lines":7,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/null/mod.rs#L64-L70"}]},
{"id":"PANIC_16","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"PipeWire `connect_output`/`connect_input` call `PodSerializer::serialize(...).unwrap()` and `Pod::from_bytes(&values).unwrap()` on the serialized format object. These run during stream connection (worker thread). While the inputs are constructed locally and serialization \"should not\" fail, an `unwrap` on a fallible serialize/parse of an external-library POD is a panic waiting on any libspa/POD-format change; it would crash the spawned stream thread rather than returning an Err.","fix":"Propagate these as `pw::Error` (the function already returns `Result<_, pw::Error>`) via `?` / a mapped error instead of `unwrap()`.","locations":[{"ref":"src/host/pipewire/stream.rs:876-882","code":"  876 |     let values: Vec<u8> =\n  877 |         PodSerializer::serialize(std::io::Cursor::new(Vec::new()), &Value::Object(obj))\n  878 |             .unwrap()\n  879 |             .0\n  880 |             .into_inner();\n  881 | \n  882 |     let mut params = [Pod::from_bytes(&values).unwrap()];","lines":7,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/pipewire/stream.rs#L876-L882"},{"ref":"src/host/pipewire/stream.rs:876-882","code":"  876 |     let values: Vec<u8> =\n  877 |         PodSerializer::serialize(std::io::Cursor::new(Vec::new()), &Value::Object(obj))\n  878 |             .unwrap()\n  879 |             .0\n  880 |             .into_inner();\n  881 | \n  882 |     let mut params = [Pod::from_bytes(&values).unwrap()];","lines":7,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/pipewire/stream.rs#L876-L882"}]},
{"id":"UAF_1","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"hard","description":"Undefined behavior from creating a misaligned slice. `fill_typed!` casts `buffer.as_mut_ptr()` (a `*mut u8`, alignment 1) to `*mut $sample_type` (u16/u32/u64, alignment 2/4/8) and calls `std::slice::from_raw_parts_mut`. Creating a slice from a pointer that is not properly aligned for the element type is immediate UB in Rust, independent of whether the subsequent writes are torn. The `debug_assert_eq!` only checks that the length is a multiple of the sample size, never alignment. The ALSA caller in src/host/alsa/mod.rs:673 passes a `vec![0u8; ...].into_boxed_slice()` whose backing allocation is only 1-byte aligned, so the U16/U24/U32/U64 paths can construct a misaligned `*mut u16`/`*mut u32`/`*mut u64` slice. WASAPI/pipewire buffers come from the OS and happen to be aligned in practice, but nothing in this API guarantees it.","fix":"Do not transmute the byte buffer. Write the equilibrium value byte-pattern instead: compute the little-/native-endian bytes of `EQUILIBRIUM` once and use `chunks_exact_mut(sample_size)` + `copy_from_slice`, or use `ptr::write_unaligned` in a loop over byte offsets. Alternatively assert alignment with `debug_assert_eq!(buffer.as_ptr() as usize % align_of::<$sample_type>(), 0)` and document/guarantee the contract at every call site (the ALSA boxed `Vec<u8>` would still violate it).","locations":[{"ref":"src/host/equilibrium.rs:24-29","code":"   24 |             let samples = unsafe {\n   25 |                 std::slice::from_raw_parts_mut(\n   26 |                     buffer.as_mut_ptr() as *mut $sample_type,\n   27 |                     num_samples,\n   28 |                 )\n   29 |             };","lines":6,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/equilibrium.rs#L24-L29"}]},
{"id":"RACE_1","type":"race_condition","type_label":"Race Condition","severity":"high","difficulty":"hard","description":"`CURRENT_SAMPLE_RATE`, `CALL_OUTPUT_READY`, and `CALLBACK_FLAG` are process-global statics, and `BUFFER_CALLBACK`/`DRIVER_EVENT_CALLBACKS` are global registries shared by every `Driver`/`Stream`. The buffer-switch callback iterates ALL registered buffer callbacks (`bcs.iter_mut()`), and `dispatch_event` invokes ALL event callbacks. With the host's single-global-driver model this is usually one stream, but two streams built from the same driver (one input, one output) register two buffer callbacks and the ASIO callback fans out to both; each closure only services its own direction but still pays the global lock and dispatch cost, and `CALLBACK_FLAG`/output-ready state is shared across them, coupling unrelated streams.","fix":"Associate callbacks/flags with a specific driver/stream rather than process-global statics, or document and enforce the single-stream invariant.","locations":[{"ref":"asio-sys/src/bindings/mod.rs:368-375","code":"  368 | static BUFFER_CALLBACK: Mutex<Vec<(BufferCallbackId, BufferCallback)>> = Mutex::new(Vec::new());\n  369 | \n  370 | /// Used to identify when to clear buffers.\n  371 | static CALLBACK_FLAG: AtomicU32 = AtomicU32::new(0);\n  372 | \n  373 | /// Indicates that ASIOOutputReady should be called\n  374 | static CALL_OUTPUT_READY: AtomicBool = AtomicBool::new(false);\n  375 | static CURRENT_SAMPLE_RATE: AtomicU64 = AtomicU64::new(0);","lines":8,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/asio-sys/src/bindings/mod.rs#L368-L375"},{"ref":"asio-sys/src/bindings/mod.rs:1164-1172","code":" 1164 | fn dispatch_event(event: AsioDriverEvent) -> bool {\n 1165 |     let callbacks: Vec<_> = {\n 1166 |         let lock = DRIVER_EVENT_CALLBACKS.lock().unwrap();\n 1167 |         lock.iter().map(|(_, cb)| cb.0.clone()).collect()\n 1168 |     };\n 1169 |     callbacks\n 1170 |         .iter()\n 1171 |         .fold(false, |handled, cb| cb(event) || handled)\n 1172 | }","lines":9,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/asio-sys/src/bindings/mod.rs#L1164-L1172"},{"ref":"asio-sys/src/bindings/mod.rs:1275-1277","code":" 1275 |     for &mut (_, ref mut bc) in bcs.iter_mut() {\n 1276 |         bc.run(&callback_info);\n 1277 |     }","lines":3,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/asio-sys/src/bindings/mod.rs#L1275-L1277"}]},
{"id":"RACE_2","type":"race_condition","type_label":"Race Condition","severity":"high","difficulty":"hard","description":"The same ALSA `snd_pcm_t` handle (`StreamInner.handle`) is mutated concurrently from two threads with no synchronization. The audio worker thread calls `handle.prepare()`/`handle.start()` during xrun and resume recovery (lines 945-947, 1003, 1039, 1398) while the user's control thread calls `play()`/`pause()` which invoke `handle.state()`, `handle.start()`, `handle.pause()` (lines 1395-1418). `unsafe impl Sync for StreamInner` at line 747 merely asserts ALSA was built thread-safe, but even a thread-safe libasound does not make racing PCM state transitions (e.g. worker `prepare()` racing control-thread `pause()`) well-defined; it only protects internal locking. This can corrupt PCM state or cause spurious errors.","fix":"Serialize all PCM state transitions through a Mutex (or route play/pause requests to the worker thread via the existing self-pipe trigger) so prepare/start/pause/state are never invoked concurrently on the same handle.","locations":[{"ref":"src/host/alsa/stream.rs:699-700","code":"  699 | // Assume that the ALSA library is built with thread safe option.\n  700 | unsafe impl Sync for StreamInner {}","lines":2,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/alsa/stream.rs#L699-L700"}]},
{"id":"RACE_3","type":"race_condition","type_label":"Race Condition","severity":"medium","difficulty":"hard","description":"The `kAsioBufferSizeChange` event handler mutates `s.buffer_size` on the (driver/event) thread while the realtime buffer callback reads `asio_stream.buffer_size` and uses it to size channel slices, both guarded by `asio_streams` mutex - but the realtime callback also caches `current_buffer_size` and resizes `interleaved` on mismatch. There is a window where `buffer_size` was changed but ASIO has not yet reallocated the buffers (kAsioBufferSizeChange per the SDK is a request that should normally go through reset), so the callback computes slice lengths from a size the underlying ASIO buffers do not have.","fix":"Do not honor kAsioBufferSizeChange by mutating the live size in place; route true buffer-size changes through a full stream re-create (stop/dispose/create) so pointers and size stay consistent.","locations":[{"ref":"src/host/asio/stream.rs:1090-1105","code":" 1090 |                     sys::AsioMessageSelectors::kAsioBufferSizeChange => {\n 1091 |                         if value > 0 {\n 1092 |                             let mut streams = asio_streams_for_event\n 1093 |                                 .lock()\n 1094 |                                 .unwrap_or_else(|e| e.into_inner());\n 1095 |                             let stream = if is_input {\n 1096 |                                 streams.input.as_mut()\n 1097 |                             } else {\n 1098 |                                 streams.output.as_mut()\n 1099 |                             };\n 1100 |                             if let Some(s) = stream {\n 1101 |                                 s.buffer_size = value;\n 1102 |                             }\n 1103 |                         }\n 1104 |                         true\n 1105 |                     }","lines":16,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/asio/stream.rs#L1090-L1105"},{"ref":"src/host/asio/stream.rs:234-244","code":"  234 |             // Resize the buffer only when the driver issues a buffer size change request.\n  235 |             // In normal operation this branch is never taken.\n  236 |             if asio_stream.buffer_size != current_buffer_size {\n  237 |                 current_buffer_size = asio_stream.buffer_size;\n  238 |                 interleaved.resize(\n  239 |                     current_buffer_size as usize\n  240 |                         * num_channels as usize\n  241 |                         * sample_format.sample_size(),\n  242 |                     0,\n  243 |                 );\n  244 |             }","lines":11,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/asio/stream.rs#L234-L244"},{"ref":"src/host/asio/stream.rs:589-599","code":"  589 |             // Resize the buffer only when the driver issues a buffer size change request.\n  590 |             // In normal operation this branch is never taken.\n  591 |             if asio_stream.buffer_size != current_buffer_size {\n  592 |                 current_buffer_size = asio_stream.buffer_size;\n  593 |                 interleaved.resize(\n  594 |                     current_buffer_size as usize\n  595 |                         * num_channels as usize\n  596 |                         * sample_format.sample_size(),\n  597 |                     0,\n  598 |                 );\n  599 |             }","lines":11,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/asio/stream.rs#L589-L599"}]},
{"id":"RACE_4","type":"race_condition","type_label":"Race Condition","severity":"medium","difficulty":"very_easy","description":"When a device disconnect / default-output change is detected, the monitor threads attempt to pause the stream with `arc.try_lock()`. If the user is concurrently holding the StreamInner lock (e.g. a play()/pause()/buffer_size() call in flight), try_lock fails and the pause is silently skipped, so the AudioUnit keeps running on a dead device while the error callback claims the stream was paused. The failed lock is ignored with no retry.","fix":"Use a blocking lock() (the monitor thread can afford to block) or retry, so the pause actually happens; the realtime callback never takes this lock so deadlock is not a concern.","locations":[{"ref":"src/host/coreaudio/macos/mod.rs:208-212","code":"  208 |                     if let Some(stream_arc) = stream_weak.upgrade() {\n  209 |                         if let Ok(mut stream_inner) = stream_arc.try_lock() {\n  210 |                             let _ = stream_inner.pause();\n  211 |                         }\n  212 |                         emit_error(&error_callback, err);","lines":5,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/coreaudio/macos/mod.rs#L208-L212"}]},
{"id":"RACE_5","type":"race_condition","type_label":"Race Condition","severity":"medium","difficulty":"medium","description":"`try_emit_error` treats a poisoned mutex as success: it calls `into_inner()` and invokes the user callback. A poisoned mutex means the callback's previous invocation panicked while holding the lock, so the callback (and any state it closes over) may be in an inconsistent or partially-mutated state. Re-entering a callback that already panicked once can compound the corruption or panic again. `emit_error` has the same recover-from-poison behavior (`unwrap_or_else(|e| e.into_inner())`). For a synchronization/error-delivery primitive this \"recover and keep calling\" policy is undocumented and arguably wrong; at minimum it silently hides that the user's error callback panicked.","fix":"Decide and document the poison policy. Safer options: drop the error (do not re-invoke a callback known to have panicked) and/or surface that the callback panicked. If recovery is intentional, add a comment explaining why re-entering a poisoned callback is safe here.","locations":[{"ref":"src/host/error_emit.rs:16","code":"   16 |     let mut cb = callback.lock().unwrap_or_else(|e| e.into_inner());","lines":1,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/error_emit.rs#L16"},{"ref":"src/host/error_emit.rs:34-37","code":"   34 |         Err(TryLockError::Poisoned(e)) => {\n   35 |             (*e.into_inner())(error);\n   36 |             Ok(())\n   37 |         }","lines":4,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/error_emit.rs#L34-L37"}]},
{"id":"RACE_6","type":"race_condition","type_label":"Race Condition","severity":"low","difficulty":"easy","description":"In the AudioWorklet backend, `buffer_size_frames` (Arc<AtomicU64>) is written from the worklet callback (mod.rs:391, on the audio render thread) and read from `Stream::buffer_size` (mod.rs:440, on the main thread) using Ordering::Relaxed. With cross-origin isolation and real threads (the whole point of the audioworklet/atomics feature), Relaxed is acceptable for a single scalar, but the value can be read before the worklet has ever run (it is seeded with initial_quantum), and there is no synchronization indicating the worklet has started. A caller may observe the seed value indefinitely if the worklet failed to initialize (the async setup error only goes to error_callback). Low impact but worth noting given this backend genuinely crosses a thread boundary.","fix":"Document that buffer_size() returns the requested/initial quantum until the worklet first runs; the Relaxed ordering is fine for a single atomic scalar.","locations":[{"ref":"src/host/audioworklet/mod.rs:385-386","code":"  385 |         let buffer_size_frames = Arc::new(AtomicU64::new(initial_quantum));\n  386 |         let buffer_size_frames_cb = buffer_size_frames.clone();","lines":2,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/audioworklet/mod.rs#L385-L386"},{"ref":"src/host/audioworklet/mod.rs:440","code":"  440 |                             buffer_size_frames_cb.store(frame_size as u64, Ordering::Relaxed);","lines":1,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/audioworklet/mod.rs#L440"},{"ref":"src/host/audioworklet/mod.rs:1081-1084","code":" 1081 | impl StreamTrait for Stream {\n 1082 |     fn buffer_size(&self) -> Result<FrameCount, Error> {\n 1083 |         Ok(self.buffer_size_frames.load(Ordering::Relaxed) as FrameCount)\n 1084 |     }","lines":4,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/audioworklet/mod.rs#L1081-L1084"}]},
{"id":"RACE_7","type":"race_condition","type_label":"Race Condition","severity":"low","difficulty":"medium","description":"In the IMMNotificationClient callbacks, `SetEvent` failure falls back to `pending_device_changed.store(true, Relaxed)`. The audio run loop reads this flag with `swap(false, Relaxed)` only at the top of each iteration, *before* the WaitForMultipleObjectsEx blocking wait. If the flag is set after the swap but the SetEvent path failed (so no handle wakeup), the loop blocks on INFINITE wait and the pending DeviceChanged is not delivered until the next unrelated wakeup. The whole flag mechanism exists for the SetEvent-failed case yet relies on a wakeup it just failed to produce.","fix":"Also signal `pending_scheduled_event` (which is always in the handle set) when setting the flag, so the run loop is guaranteed to wake and observe it; or use a timed wait.","locations":[{"ref":"src/host/wasapi/stream.rs:127-131","code":"  127 |             unsafe {\n  128 |                 if Threading::SetEvent(self.event).is_err() {\n  129 |                     self.pending_device_changed.store(true, Ordering::Relaxed);\n  130 |                 }\n  131 |             }","lines":5,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/wasapi/stream.rs#L127-L131"}]},
{"id":"RES_1","type":"resource_leak","type_label":"Resource Leak","severity":"high","difficulty":"hard","description":"If `set_sample_rate` fails partway through the fallback reconfiguration cycle (e.g. `start()`, `stop()`, `dispose_buffers()`, the `ASIOExit`/reload, or the final rate check all use `?`/early returns), the driver can be left in `Prepared` or `Running` state with buffers allocated, or fully torn down via `ASIOExit`+`remove_current_driver` while `DriverInner.state` still says `Initialized`/`Prepared`. The cached `DriverState` then no longer matches the real driver state, so later `create_buffers`/`start`/`Drop` issue out-of-sequence ASIO calls. Notably the dummy buffers created at line 592 are not disposed on the early-error paths between create and the later dispose.","fix":"Wrap the reconfiguration in a guard that always disposes dummy buffers and resynchronizes `DriverState` with the actual driver state on every error path before returning.","locations":[{"ref":"asio-sys/src/bindings/mod.rs:611-659","code":"  611 |         let mut dummy_infos = prepare_buffer_infos(false, 1);\n  612 |         let buffer_size = self.create_buffers(&mut dummy_infos, None)?;\n  613 | \n  614 |         // Start briefly so the driver reconfigures its hardware clock.\n  615 |         self.start()?;\n  616 | \n  617 |         // Wait for one full buffer to be processed: this guarantees the driver has\n  618 |         // applied the rate change to the hardware clock before we stop it.\n  619 |         let buffer_duration = Duration::from_secs_f64(buffer_size as f64 / sample_rate);\n  620 |         std::thread::sleep(buffer_duration);\n  621 | \n  622 |         self.stop()?;\n  623 |         self.dispose_buffers()?;\n  624 | \n  625 |         // Full teardown so the driver is reset to a clean state. Some drivers\n  626 |         // (e.g. Steinberg) return errors from ASIOGetChannels after DisposeBuffers\n  627 |         // unless the driver is fully exited and reloaded.\n  628 |         {\n  629 |             let mut state = self.inner.lock_state();\n  630 |             unsafe {\n  631 |                 let _ = asio_result!(ai::ASIOExit());\n  632 |                 ai::remove_current_driver();\n  633 |             }\n  634 |             std::thread::sleep(buffer_duration);\n  635 | \n  636 |             // Safety: the name was validated as null-free when the driver was first loaded.\n  637 |             let name_cstring = CString::new(self.inner.name.as_str())\n  638 |                 .expect(\"driver name already stored must not contain null bytes\");\n  639 |             unsafe {\n  640 |                 if !ai::load_asio_driver(name_cstring.as_ptr() as *mut c_char) {\n  641 |                     return Err(AsioError::NoDrivers);\n  642 |                 }\n  643 |                 let mut driver_info = std::mem::MaybeUninit::<ai::ASIODriverInfo>::uninit();\n  644 |                 asio_result!(ai::ASIOInit(driver_info.as_mut_ptr()))?;\n  645 |             }\n  646 |             *state = DriverState::Initialized;\n  647 | \n  648 |             // Set the rate again on the freshly initialized driver.\n  649 |             unsafe { asio_result!(ai::set_sample_rate(sample_rate))? };\n  650 | \n  651 |             let mut actual: c_double = 0.0;\n  652 |             unsafe { asio_result!(ai::get_sample_rate(&mut actual))? };\n  653 |             if (actual - sample_rate).abs() >= 1.0 {\n  654 |                 return Err(AsioError::NoRate);\n  655 |             }\n  656 | \n  657 |             CURRENT_SAMPLE_RATE.store(actual.to_bits(), Ordering::Release);\n  658 |         }\n  659 |         Ok(())","lines":49,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/asio-sys/src/bindings/mod.rs#L611-L659"}]},
{"id":"RES_2","type":"resource_leak","type_label":"Resource Leak","severity":"medium","difficulty":"medium","description":"The JNI helpers create many local references (every `call_method ... .l()`, `new_string`, `from_raw` JObject/JString/JIntArray/JObjectArray, plus `get_element` per device) inside a loop over all audio devices (devices_info.rs:55-92) without deleting them. Local references accumulate within the current JNI frame; with many devices and several string/array refs each, this can exceed the default local reference table capacity (commonly 512) and abort. `with_attached` does not push a local frame (`with_local_frame`) to bound the lifetime of these refs.","fix":"Wrap the per-device work in `env.with_local_frame(...)` (or explicitly delete local refs) so each iteration's local references are released, bounding peak local-ref usage.","locations":[{"ref":"src/host/aaudio/java_interface/devices_info.rs:54-91","code":"   54 |     (0..length)\n   55 |         .map(|index| {\n   56 |             let device = devices.get_element(env, index)?;\n   57 |             let id = call_method_no_args_ret_int(env, &device, \"getId\")?;\n   58 |             let address = call_method_no_args_ret_string(env, &device, \"getAddress\")?;\n   59 |             let address = String::from(address.mutf8_chars(env)?);\n   60 |             let product_name =\n   61 |                 call_method_no_args_ret_char_sequence(env, &device, \"getProductName\")?;\n   62 |             let product_name = String::from(product_name.mutf8_chars(env)?);\n   63 |             let device_type =\n   64 |                 FromPrimitive::from_i32(call_method_no_args_ret_int(env, &device, \"getType\")?)\n   65 |                     .unwrap_or(AudioDeviceType::Unsupported);\n   66 | \n   67 |             let is_source = call_method_no_args_ret_bool(env, &device, \"isSource\")?;\n   68 |             let is_sink = call_method_no_args_ret_bool(env, &device, \"isSink\")?;\n   69 |             let direction =
