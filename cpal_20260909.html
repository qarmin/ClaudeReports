{"id":"RES_3","type":"resource_leak","type_label":"Resource Leak","severity":"low","difficulty":"easy","description":"`DefaultDeviceMonitor::drop` only calls `CloseHandle(self.event)` when `UnregisterEndpointNotificationCallback` succeeds. The reasoning (avoid SetEvent on a reused handle) is sound, but if unregister fails the event HANDLE is leaked for the remaining process lifetime, and the registered notification client is never unregistered, leaking the COM callback registration too. For a long-running app that repeatedly creates default-device streams this accumulates.","fix":"Log/track the rare unregister failure; consider retrying unregister, and at minimum document that this path leaks. If unregister truly cannot succeed, the COM object will keep the Arc alive anyway, but the raw event handle should be tracked for eventual closure.","locations":[{"ref":"src/host/wasapi/stream.rs:85-108","code":"   85 | impl Drop for DefaultDeviceMonitor {\n   86 |     fn drop(&mut self) {\n   87 |         // Ensure COM is initialised on this thread before making COM calls. Drop can run on\n   88 |         // any thread (e.g. the audio run thread), which may not have called CoInitialize.\n   89 |         crate::host::com::com_initialized();\n   90 |         unsafe {\n   91 |             // Synchronous: waits for any in-progress IMMNotificationClient callback to finish\n   92 |             // before returning. Notification callbacks must not invoke the user error callback:\n   93 |             // if the user dropped the Stream in response, this call would deadlock waiting for\n   94 |             // the in-progress callback. Instead, callbacks set `pending_device_changed` and\n   95 |             // the audio thread delivers the error on its next iteration.\n   96 |             //\n   97 |             // Only close the event handle on success; if unregister fails the callback may\n   98 |             // still hold a reference and could later call SetEvent on a closed/reused handle.\n   99 |             if self\n  100 |                 .enumerator\n  101 |                 .UnregisterEndpointNotificationCallback(&self.client)\n  102 |                 .is_ok()\n  103 |             {\n  104 |                 let _ = Foundation::CloseHandle(self.event);\n  105 |             }\n  106 |         }\n  107 |     }\n  108 | }","lines":24,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/wasapi/stream.rs#L85-L108"}]},
{"id":"RES_4","type":"resource_leak","type_label":"Resource Leak","severity":"negligible","difficulty":"easy","description":"AGGREGATE_INSTANCE_COUNTER only ever increments (fetch_add, never reset). It is used solely to build unique aggregate-device names so wraparound is harmless, but over an extremely long-lived process creating many loopback devices the names lose uniqueness guarantees after a u32 wrap. Minor.","fix":"Acceptable as-is; if uniqueness must be guaranteed, also incorporate a timestamp or random suffix into the device UID.","locations":[{"ref":"src/host/coreaudio/macos/loopback.rs:10","code":"   10 | static AGGREGATE_INSTANCE_COUNTER: AtomicU32 = AtomicU32::new(0);","lines":1,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/coreaudio/macos/loopback.rs#L10"},{"ref":"src/host/coreaudio/macos/loopback.rs:88","code":"   88 |         let instance = AGGREGATE_INSTANCE_COUNTER.fetch_add(1, Ordering::Relaxed);","lines":1,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/coreaudio/macos/loopback.rs#L88"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"Buffer length is computed as `cpal_num_samples = buffer_size * num_channels as usize` then `len_bytes = cpal_num_samples * sample_format.sample_size()` with plain `*` (no checked/saturating). `buffer_size` is a driver-reported value cast from i32 and `num_channels` is user-supplied; on overflow in release this wraps and produces an undersized `Vec`, then the callback's `cast_slice_mut` reinterprets it and reads/writes ASIO channel slices sized from `buffer_size`, causing out-of-bounds access. While realistic sizes are small, the values are externally influenced and unchecked.","fix":"Use checked multiplication and return an error on overflow, or validate `buffer_size`/`num_channels` bounds before allocating.","locations":[{"ref":"src/host/asio/stream.rs:167-171","code":"  167 |         let cpal_num_samples = buffer_size * num_channels as usize;\n  168 | \n  169 |         // Create the buffer depending on the size of the data type.\n  170 |         let len_bytes = cpal_num_samples * sample_format.sample_size();\n  171 |         let mut interleaved = vec![0u8; len_bytes];","lines":5,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/asio/stream.rs#L167-L171"},{"ref":"src/host/asio/stream.rs:523-527","code":"  523 |         let cpal_num_samples = buffer_size * num_channels as usize;\n  524 | \n  525 |         // Create the buffer depending on data type.\n  526 |         let len_bytes = cpal_num_samples * sample_format.sample_size();\n  527 |         let mut interleaved = vec![0u8; len_bytes];","lines":5,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/asio/stream.rs#L523-L527"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"very_easy","description":"`get_available_frames` computes `stream.max_frames_in_buffer - padding` and `output_timestamp` computes `stream.max_frames_in_buffer - frames_available`, both unchecked u32 subtractions. GetCurrentPadding is documented to never exceed the buffer size, but if a buggy/virtual driver reports padding > max_frames_in_buffer the subtraction underflows: it panics in debug builds and wraps to a huge FrameCount in release, which then drives a GetBuffer request for billions of frames and a slice of that size in process_output -> immediate UB / crash.","fix":"Use `saturating_sub` (or checked_sub returning an error) for both subtractions so a misbehaving driver yields 0 available frames instead of underflowing.","locations":[{"ref":"src/host/wasapi/stream.rs:673-681","code":"  673 | fn get_available_frames(stream: &StreamInner) -> Result<FrameCount, Error> {\n  674 |     unsafe {\n  675 |         let padding = stream\n  676 |             .audio_client\n  677 |             .GetCurrentPadding()\n  678 |             .context(\"Failed to get current padding\")?;\n  679 |         Ok(stream.max_frames_in_buffer - padding)\n  680 |     }\n  681 | }","lines":9,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/wasapi/stream.rs#L673-L681"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"In the AAudio output dynamic-tuning path, `let mut buffer_size = burst_size * new_mixer_bursts;` multiplies two i32 values without overflow protection (line 496). burst_size is bounded small (>=16, fallback 256), and new_mixer_bursts is saturating_add(1) starting from a value that could be a parsed system property (audio_manager parses arbitrary i32). A maliciously large `aaudio.mixer_bursts` property could make this multiply overflow in debug (panic) or wrap in release, then get clamped to capacity. Low severity because capacity clamp follows, but the multiply itself can wrap/panic before the clamp.","fix":"Use `burst_size.saturating_mul(new_mixer_bursts)` (or checked_mul with fallback).","locations":[{"ref":"src/host/aaudio/mod.rs:514","code":"  514 |                     let mut buffer_size = burst_size * new_mixer_bursts;","lines":1,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/aaudio/mod.rs#L514"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"Several i32->usize/u32 and f64->u32 casts of driver-reported values use `as` without range checks: `channels.ins as ChannelCount`/`channels.outs as ChannelCount` (i32 truncated to u16 ChannelCount), `buffer_size_range.min/max as FrameCount` (i32 to u32, negative becomes huge), `sample_rate as SampleRate`. A driver reporting >65535 channels truncates silently, and a negative or huge buffer size becomes a bogus FrameCount that then drives allocations.","fix":"Use `try_into()` with explicit error handling (skip the device) rather than truncating `as` casts on externally-provided values.","locations":[{"ref":"src/host/asio/device.rs:216-220","code":"  216 |                         channels_in: channels.ins as ChannelCount,\n  217 |                         channels_out: channels.outs as ChannelCount,\n  218 |                         sample_rate: sample_rate as SampleRate,\n  219 |                         buffer_size_min: buffer_size_range.min as FrameCount,\n  220 |                         buffer_size_max: buffer_size_range.max as FrameCount,","lines":5,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/asio/device.rs#L216-L220"}]},
{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`config_to_waveformatextensible` computes `nAvgBytesPerSec = channels * sample_rate * sample_bytes` as a `u32` and `nBlockAlign = channels * sample_bytes` as a `u16`. For high channel counts / sample rates / 64-bit samples these can overflow: e.g. nBlockAlign for 8 channels * 8 bytes (I64/F64) = 64 fits, but block_align is u16 so channels*sample_bytes overflows above 8192 bytes; nAvgBytesPerSec overflows u32 around channels*rate*bytes > 4.29e9 (e.g. 64ch * 384000 * 8 = 1.97e8 ok, but very wide configs can exceed). Overflow wraps silently producing a malformed WAVEFORMATEX.","fix":"Validate that channels*sample_bytes fits in u16 and channels*sample_rate*sample_bytes fits in u32 (use checked_mul) and return None on overflow, so an invalid config is rejected rather than corrupted.","locations":[{"ref":"src/host/wasapi/device.rs:1381-1407","code":" 1381 |     let channels = config.channels;\n 1382 |     let sample_rate = config.sample_rate;\n 1383 |     let sample_bytes = sample_format.sample_size() as u16;\n 1384 |     let avg_bytes_per_sec = u32::from(channels) * sample_rate * u32::from(sample_bytes);\n 1385 |     let block_align = channels * sample_bytes;\n 1386 |     // wBitsPerSample is the container word size; wValidBitsPerSample is the actual bit depth.\n 1387 |     // For I24 the container is 32 bits (sample_size() == 4) but only 24 bits are significant.\n 1388 |     let container_bits = 8 * sample_bytes;\n 1389 |     let valid_bits = sample_format.bits_per_sample() as u16;\n 1390 | \n 1391 |     let cb_size = if format_tag == Audio::WAVE_FORMAT_PCM {\n 1392 |         0\n 1393 |     } else {\n 1394 |         let extensible_size = mem::size_of::<Audio::WAVEFORMATEXTENSIBLE>();\n 1395 |         let ex_size = mem::size_of::<Audio::WAVEFORMATEX>();\n 1396 |         (extensible_size - ex_size) as u16\n 1397 |     };\n 1398 | \n 1399 |     let waveformatex = Audio::WAVEFORMATEX {\n 1400 |         wFormatTag: format_tag as u16,\n 1401 |         nChannels: channels,\n 1402 |         nSamplesPerSec: sample_rate,\n 1403 |         nAvgBytesPerSec: avg_bytes_per_sec,\n 1404 |         nBlockAlign: block_align,\n 1405 |         wBitsPerSample: container_bits,\n 1406 |         cbSize: cb_size,\n 1407 |     };","lines":27,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/wasapi/device.rs#L1381-L1407"}]},
{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`Data::bytes` and `bytes_mut` compute `self.len * self.sample_format.sample_size()` with a plain `usize` multiply. `len` is supplied by backend code via the unsafe `from_parts` constructor. For a very large `len` (close to `usize::MAX / sample_size`) the multiplication can wrap in release builds, producing a byte length smaller than the real buffer; this is then handed to `slice::from_raw_parts`. While `len` is normally a sane audio buffer size, the function is the public byte view used by raw callbacks and silently truncates rather than failing.","fix":"Use `self.len.checked_mul(self.sample_format.sample_size())` and document/handle the overflow case (debug_assert or saturating), consistent with the safety contract.","locations":[{"ref":"src/lib.rs:640-655","code":"  640 |     pub fn bytes(&self) -> &[u8] {\n  641 |         let len = self.len * self.sample_format.sample_size();\n  642 |         // The safety of this block relies on correct construction of the `Data` instance.\n  643 |         // See the unsafe `from_parts` constructor for these requirements.\n  644 |         unsafe { std::slice::from_raw_parts(self.data as *const u8, len) }\n  645 |     }\n  646 | \n  647 |     /// The raw slice of memory representing the underlying audio data as a slice of bytes.\n  648 |     ///\n  649 |     /// It is up to the user to interpret the slice of memory based on [`Data::sample_format`].\n  650 |     pub fn bytes_mut(&mut self) -> &mut [u8] {\n  651 |         let len = self.len * self.sample_format.sample_size();\n  652 |         // The safety of this block relies on correct construction of the `Data` instance. See\n  653 |         // the unsafe `from_parts` constructor for these requirements.\n  654 |         unsafe { std::slice::from_raw_parts_mut(self.data as *mut u8, len) }\n  655 |     }","lines":16,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/lib.rs#L640-L655"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"JACK `Host::input_device_with_name` / `output_device_with_name` mutate `self.name` to the requested name and then call `default_input_device` / `default_output_device`, which iterate over `self.devices_created` - a Vec populated once in `Host::new()` from the ORIGINAL name. They never re-create devices with the new name, so the supplied `name` argument is silently ignored: the caller always gets back the default device built at construction time (or `None`). The `self.name = ...` assignment has no effect on the returned device.","fix":"Either build a fresh `Device` from the requested name inside `input_device_with_name`/`output_device_with_name` (calling `Device::default_input_device(name, ...)`), or remove these name-based methods if per-name lookup is unsupported. The dead `self.name = ...` write should go.","locations":[{"ref":"src/host/jack/mod.rs:80-88","code":"   80 |     pub fn input_device_with_name(&mut self, name: &str) -> Option<Device> {\n   81 |         self.name = name.to_owned();\n   82 |         self.default_input_device()\n   83 |     }\n   84 | \n   85 |     pub fn output_device_with_name(&mut self, name: &str) -> Option<Device> {\n   86 |         self.name = name.to_owned();\n   87 |         self.default_output_device()\n   88 |     }","lines":9,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/jack/mod.rs#L80-L88"},{"ref":"src/host/jack/mod.rs:135-151","code":"  135 |     fn default_input_device(&self) -> Option<Self::Device> {\n  136 |         for device in &self.devices_created {\n  137 |             if device.is_input() {\n  138 |                 return Some(device.clone());\n  139 |             }\n  140 |         }\n  141 |         None\n  142 |     }\n  143 | \n  144 |     fn default_output_device(&self) -> Option<Self::Device> {\n  145 |         for device in &self.devices_created {\n  146 |             if device.is_output() {\n  147 |                 return Some(device.clone());\n  148 |             }\n  149 |         }\n  150 |         None\n  151 |     }","lines":17,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/jack/mod.rs#L135-L151"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`driver_names` builds `MAX_DRIVERS` name buffers of `MAX_DRIVER_NAME_LEN = 32` bytes and passes their pointers to `get_driver_names`. ASIO driver names can exceed 31 chars; the SDK writes a NUL-terminated string into each buffer assuming a caller-defined capacity (the SDK convention is 32), but if a driver name is exactly 32+ bytes the C side may write without a guaranteed NUL within the 32-byte buffer, and `CStr::from_ptr` then reads past the buffer end (out-of-bounds) until it finds a NUL. The fixed 32-byte assumption is an unchecked contract.","fix":"Ensure each buffer is force-NUL-terminated at index 31 before reading, or read at most MAX_DRIVER_NAME_LEN-1 bytes with a bounded conversion.","locations":[{"ref":"asio-sys/src/bindings/mod.rs:396-418","code":"  396 |     pub fn driver_names(&self) -> Vec<String> {\n  397 |         // The most drivers we can take\n  398 |         const MAX_DRIVERS: usize = 100;\n  399 |         // Max length for divers name\n  400 |         const MAX_DRIVER_NAME_LEN: usize = 32;\n  401 | \n  402 |         // 2D array of driver names set to 0.\n  403 |         let mut driver_names: [[c_char; MAX_DRIVER_NAME_LEN]; MAX_DRIVERS] =\n  404 |             [[0; MAX_DRIVER_NAME_LEN]; MAX_DRIVERS];\n  405 |         // Pointer to each driver name.\n  406 |         let mut driver_name_ptrs: [*mut c_char; MAX_DRIVERS] = [null_mut(); MAX_DRIVERS];\n  407 |         for (ptr, name) in driver_name_ptrs.iter_mut().zip(&mut driver_names[..]) {\n  408 |             *ptr = (*name).as_mut_ptr();\n  409 |         }\n  410 | \n  411 |         unsafe {\n  412 |             let num_drivers =\n  413 |                 ai::get_driver_names(driver_name_ptrs.as_mut_ptr(), MAX_DRIVERS as i32);\n  414 |             (0..num_drivers)\n  415 |                 .map(|i| driver_name_to_utf8(&driver_names[i as usize]).to_string())\n  416 |                 .collect()\n  417 |         }\n  418 |     }","lines":23,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/asio-sys/src/bindings/mod.rs#L396-L418"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`create_buffers` only checks `buffer_size > buffer_sizes.max` (returns `InvalidBufferSize`) and never checks against `buffer_sizes.min`. The comment in `check_config` (stream.rs) acknowledges ASIO does not validate the lower bound, but `create_buffers` is also reachable from `set_sample_rate`'s internal path and from any other caller without going through `check_config`, so an in-sys caller can pass a sub-minimum size that the driver silently mishandles.","fix":"Reject `buffer_size < buffer_sizes.min` in `create_buffers` as well.","locations":[{"ref":"asio-sys/src/bindings/mod.rs:703-712","code":"  703 |         let buffer_size = match buffer_size {\n  704 |             Some(v) => {\n  705 |                 if v <= buffer_sizes.max {\n  706 |                     v\n  707 |                 } else {\n  708 |                     return Err(AsioError::InvalidBufferSize);\n  709 |                 }\n  710 |             }\n  711 |             None => buffer_sizes.pref,\n  712 |         };","lines":10,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/asio-sys/src/bindings/mod.rs#L703-L712"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"The default device is created with `DeviceDirection::Unknown` (line 145), but `supports_input` and `supports_output` (lines 226-238) only return true for `Input`/`Duplex` and `Output`/`Duplex` respectively. Consequently the device returned by `default_input_device()`/`default_output_device()` reports `supports_input() == false` and `supports_output() == false`, which is contradictory: callers that filter or check capability via these methods will conclude the default device supports neither direction even though it is the system default for both.","fix":"Treat `DeviceDirection::Unknown` as potentially supporting both directions in `supports_input`/`supports_output` (return true), or give the default device `Duplex`, since its true direction cannot be known without opening it.","locations":[{"ref":"src/host/alsa/mod.rs:52-61","code":"   52 |     // \"default\" is a virtual ALSA device that redirects to the configured default. We cannot\n   53 |     // determine its actual capabilities without opening it, so we return Unknown direction.\n   54 |     fn default_device(&self) -> Device {\n   55 |         Device {\n   56 |             pcm_id: DEFAULT_DEVICE.to_owned(),\n   57 |             desc: Some(\"Default Audio Device\".to_owned()),\n   58 |             direction: DeviceDirection::Unknown,\n   59 |             _context: self.inner.clone(),\n   60 |         }\n   61 |     }","lines":10,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/alsa/mod.rs#L52-L61"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The output buffer callback's silence/mix scheme relies on `current_callback_flag` (per-Device `AtomicU32`) compared to `callback_info.callback_flag` which is `CALLBACK_FLAG.fetch_xor(1)` (alternates 0/1). The comment says the flag 'is updated once per buffer switch' and is used so the first callback to see a new flag silences the buffer. But `current_callback_flag` is stored on the Device and cloned into the closure; if the Device builds a new output stream later, the stale flag persists. More importantly, with only values {0,1} and a single output stream the silence decision degenerates: each buffer switch flips the flag so `silence` is true every cycle, which is the intended 'clear before mixing' behavior - but the elaborate multi-callback coordination comment is misleading because output mixing across multiple callbacks for the same buffer index cannot actually happen with the dedup guard at line 554.","fix":"Simplify: since each buffer switch should clear-then-write once, silence unconditionally per callback and drop the cross-callback flag coordination, and fix/remove the misleading comment.","locations":[{"ref":"src/host/asio/stream.rs:606-615","code":"  606 |             // Silence the ASIO buffer that is about to be used.\n  607 |             //\n  608 |             // Check if any other callbacks have already silenced the buffer associated with\n  609 |             // the current callback. The flag is updated once per buffer switch.\n  610 |             let silence =\n  611 |                 current_callback_flag.load(Ordering::Acquire) != callback_info.callback_flag;\n  612 | \n  613 |             if silence {\n  614 |                 current_callback_flag.store(callback_info.callback_flag, Ordering::Release);\n  615 |             }","lines":10,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/asio/stream.rs#L606-L615"},{"ref":"src/host/asio/stream.rs:528","code":"  528 |         let current_callback_flag = self.current_callback_flag.clone();","lines":1,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/asio/stream.rs#L528"},{"ref":"asio-sys/src/bindings/mod.rs:1268","code":" 1268 |     let callback_flag = CALLBACK_FLAG.fetch_xor(1, Ordering::Relaxed);","lines":1,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/asio-sys/src/bindings/mod.rs#L1268"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`check_config` validates a `Fixed` buffer size against `range.min..=range.max` and against `Stepped` granularity, but does NOT validate it for the `Only` and `Preferred` granularity cases (where ASIO granularity 0 means only pref is guaranteed, or `-1`/power-of-two). Combined with the granularity misinterpretation above, a user-supplied size that the driver cannot honor passes validation and is sent to `ASIOCreateBuffers`, whose behavior for an unsupported-but-in-range size is unspecified.","fix":"Validate the fixed size against the actual granularity model for every `BufferPreference` variant (exact match for `Only`, power-of-two for the SDK's -1 case, multiples for `Stepped`).","locations":[{"ref":"src/host/asio/stream.rs:1159-1184","code":" 1159 |     if let BufferSize::Fixed(requested_size) = buffer_size {\n 1160 |         let range = driver.buffersize_range().map_err(build_stream_err)?;\n 1161 |         let requested_size_i32 = requested_size as i32;\n 1162 |         if !(range.min..=range.max).contains(&requested_size_i32) {\n 1163 |             return Err(Error::with_message(\n 1164 |                 ErrorKind::UnsupportedConfig,\n 1165 |                 format!(\n 1166 |                     \"Buffer size {requested_size} is not in the supported range {min}..={max}\",\n 1167 |                     min = range.min,\n 1168 |                     max = range.max\n 1169 |                 ),\n 1170 |             ));\n 1171 |         }\n 1172 |         if let sys::BufferPreference::Stepped { step, .. } = range.preferred {\n 1173 |             let offset = requested_size_i32 - range.min;\n 1174 |             if offset % step as i32 != 0 {\n 1175 |                 return Err(Error::with_message(\n 1176 |                     ErrorKind::UnsupportedConfig,\n 1177 |                     format!(\n 1178 |                         \"Buffer size {requested_size} is not valid; sizes must start at {min} and increment by {step}\",\n 1179 |                         min = range.min\n 1180 |                     ),\n 1181 |                 ));\n 1182 |             }\n 1183 |         }\n 1184 |     }","lines":26,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/asio/stream.rs#L1159-L1184"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The two scheduling closures (front/back buffer) share a single `time` cursor RwLock. The first time each fires it checks `if *time_at_start_of_buffer > 0.0` to decide whether to anchor to `now + base + step` or use the stored value. Because both closures are kicked off via separate `setTimeout`s in `play()` (offset_ms staggered), there is an inherent assumption about ordering: whichever fires first initializes the cursor. If the second closure fires before the first writes the cursor (both see 0.0), both schedule their first buffer at `now + base + step`, producing two sources starting at the same time (overlap/double playback) rather than back-to-back. The stagger in `play()` (offset_ms += time_step_ms) mitigates but does not guarantee this under timer coalescing/jitter.","fix":"Initialize the time cursor deterministically before scheduling (e.g. set it once in play() to now + base + step) and have each closure unconditionally consume-and-advance it, instead of relying on the 0.0 sentinel plus timer ordering.","locations":[{"ref":"src/host/webaudio/mod.rs:694-708","code":"  694 |                     let time_at_start_of_buffer = {\n  695 |                         let time_at_start_of_buffer = time_handle\n  696 |                             .read()\n  697 |                             .expect(\"Unable to get a read lock on the time cursor\");\n  698 |                         // Synchronise first buffer as necessary (eg. keep the time value\n  699 |                         // referenced to the context clock).\n  700 |                         if *time_at_start_of_buffer > 0.0 {\n  701 |                             *time_at_start_of_buffer\n  702 |                         } else {\n  703 |                             // Schedule the first buffer far enough ahead for the browser's\n  704 |                             // internal audio pipeline (baseLatency) plus one full buffer of\n  705 |                             // data, so playback starts underrun-free at any buffer size.\n  706 |                             now + base_latency_secs + buffer_time_step_secs\n  707 |                         }\n  708 |                     };","lines":15,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/webaudio/mod.rs#L694-L708"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"The doc comment for `cmp_default_heuristics` claims the sample-format priority is \"F32 is ranked highest ... followed by F64. Standard integer widths descend by bit depth (I32 > I24 > I16); 64-bit integers are deprioritised below I16\". But the `format_rank` table ranks U8 (3) and I8 (4) BELOW U64 (5) and I64 (6), i.e. 8-bit integers are the lowest non-DSD formats and 64-bit integers sit between 8-bit and 16-bit. The documented \"below I16\" claim is true for 64-bit ints, but the doc never mentions that 8-bit ints rank even lower than 64-bit ints, which is surprising and undocumented. A backend exposing only U8 and I64 would pick I64 as the default, contradicting a naive reading of the heuristic.","fix":"Either reorder format_rank so 8-bit ints are not below 64-bit ints, or expand the doc comment to state the full ordering explicitly (DSD < 8-bit < 64-bit < 16-bit < 24-bit < 32-bit < F64 < F32).","locations":[{"ref":"src/lib.rs:825-830","code":"  825 |     /// **Sample format** (most preferred first):\n  826 |     ///\n  827 |     /// F32 is ranked highest as the universal realtime audio format, followed by F64. Standard\n  828 |     /// integer widths descend by bit depth (I32 > I24 > I16); 64-bit integers are deprioritised\n  829 |     /// below I16 as accumulator types rather than native stream formats. Signed beats unsigned\n  830 |     /// at the same width. DSD ranks last as non-PCM.","lines":6,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/lib.rs#L825-L830"},{"ref":"src/lib.rs:855-874","code":"  855 |         fn format_rank(fmt: SampleFormat) -> u8 {\n  856 |             match fmt {\n  857 |                 SampleFormat::DsdU8 => 0,\n  858 |                 SampleFormat::DsdU16 => 1,\n  859 |                 SampleFormat::DsdU32 => 2,\n  860 |                 SampleFormat::U8 => 3,\n  861 |                 SampleFormat::I8 => 4,\n  862 |                 // 64-bit integers: deprioritised below standard audio widths.\n  863 |                 SampleFormat::U64 => 5,\n  864 |                 SampleFormat::I64 => 6,\n  865 |                 SampleFormat::U16 => 7,\n  866 |                 SampleFormat::I16 => 8,\n  867 |                 SampleFormat::U24 => 9,\n  868 |                 SampleFormat::I24 => 10,\n  869 |                 SampleFormat::U32 => 11,\n  870 |                 SampleFormat::I32 => 12,\n  871 |                 SampleFormat::F64 => 13,\n  872 |                 SampleFormat::F32 => 14,\n  873 |             }\n  874 |         }","lines":20,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/lib.rs#L855-L874"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `default_host()` for the Linux family, PipeWire and PulseAudio are tried, but if `is_available()` returns true yet `new()` returns `Err`, the code silently falls through to ALSA. That is intended fallback behaviour, however the final `AlsaHost::new().expect(\"the default host should always be available\")` will panic if ALSA initialization fails (e.g. no `/dev/snd`, container without ALSA). `default_host()` returns `Host` (not `Result`), so a system without a working ALSA cannot obtain any host without panicking, even when PipeWire/Pulse exist but failed to construct.","fix":"Fall back to a Null host (or return the successfully constructed PipeWire/Pulse host) instead of unconditionally `expect`-ing on ALSA; at minimum document that default_host can panic on misconfigured Linux systems.","locations":[{"ref":"src/platform/mod.rs:886-902","code":"  886 |     pub fn default_host() -> Host {\n  887 |         #[cfg(feature = \"pipewire\")]\n  888 |         if <PipeWireHost as crate::traits::HostTrait>::is_available() {\n  889 |             if let Ok(host) = PipeWireHost::new() {\n  890 |                 return host.into();\n  891 |             }\n  892 |         }\n  893 |         #[cfg(feature = \"pulseaudio\")]\n  894 |         if <PulseAudioHost as crate::traits::HostTrait>::is_available() {\n  895 |             if let Ok(host) = PulseAudioHost::new() {\n  896 |                 return host.into();\n  897 |             }\n  898 |         }\n  899 |         AlsaHost::new()\n  900 |             .expect(\"the default host should always be available\")\n  901 |             .into()\n  902 |     }","lines":17,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/platform/mod.rs#L886-L902"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`AsioErrorWrapper` defines both `ASE_OK = 0` and `ASE_SUCCESS = 0x3f4847a0`, but the `asio_result!` macro tests `r == ASE_OK as i32` then `r == ASE_SUCCESS as i32`. `0x3f4847a0` fits in i32 so that's fine, but enum has two variants with overlapping intent and the discriminant after `ASE_SUCCESS` (`ASE_NotPresent = -1000`) resets the auto-counter; subsequent variants (`ASE_HWMalfunction` = -999, etc.) rely on this. This is fragile: any reordering silently changes the numeric mapping used to interpret ASIO return codes. The mapping is also duplicated conceptually between the enum and the macro arms.","fix":"Use explicit discriminants for every variant and/or match on a single source of truth to avoid drift between the enum and the macro.","locations":[{"ref":"asio-sys/src/bindings/errors.rs:25-37","code":"   25 | #[derive(Debug)]\n   26 | pub enum AsioErrorWrapper {\n   27 |     ASE_OK = 0,               // This value will be returned whenever the call succeeded\n   28 |     ASE_SUCCESS = 0x3f4847a0, // unique success return value for ASIOFuture calls\n   29 |     ASE_NotPresent = -1000,   // hardware input or output is not present or available\n   30 |     ASE_HWMalfunction,        // hardware is malfunctioning (can be returned by any ASIO function)\n   31 |     ASE_InvalidParameter,     // input parameter invalid\n   32 |     ASE_InvalidMode,          // hardware is in a bad mode or used in a bad mode\n   33 |     ASE_SPNotAdvancing,       // hardware is not running when sample position is inquired\n   34 |     ASE_NoClock,              // sample clock or rate cannot be determined or is not present\n   35 |     ASE_NoMemory,             // not enough memory for completing the request\n   36 |     Invalid,\n   37 | }","lines":13,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/asio-sys/src/bindings/errors.rs#L25-L37"},{"ref":"asio-sys/src/bindings/errors.rs:94-112","code":"   94 | macro_rules! asio_result {\n   95 |     ($e:expr) => {{\n   96 |         let res = { $e };\n   97 |         match res {\n   98 |             r if r == AsioErrorWrapper::ASE_OK as i32 => Ok(()),\n   99 |             r if r == AsioErrorWrapper::ASE_SUCCESS as i32 => Ok(()),\n  100 |             r if r == AsioErrorWrapper::ASE_NotPresent as i32 => Err(AsioError::NoDrivers),\n  101 |             r if r == AsioErrorWrapper::ASE_HWMalfunction as i32 => {\n  102 |                 Err(AsioError::HardwareMalfunction)\n  103 |             }\n  104 |             r if r == AsioErrorWrapper::ASE_InvalidParameter as i32 => Err(AsioError::InvalidInput),\n  105 |             r if r == AsioErrorWrapper::ASE_InvalidMode as i32 => Err(AsioError::BadMode),\n  106 |             r if r == AsioErrorWrapper::ASE_SPNotAdvancing as i32 => Err(AsioError::HardwareStuck),\n  107 |             r if r == AsioErrorWrapper::ASE_NoClock as i32 => Err(AsioError::NoRate),\n  108 |             r if r == AsioErrorWrapper::ASE_NoMemory as i32 => Err(AsioError::NoMemory),\n  109 |             _ => Err(AsioError::UnknownError),\n  110 |         }\n  111 |     }};\n  112 | }","lines":19,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/asio-sys/src/bindings/errors.rs#L94-L112"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`can_sample_rate` maps `Err(AsioError::NoRate)` to `Ok(false)`. ASIO's `ASIOCanSampleRate` returns ASE_NoClock for unsupported rates, which `asio_result!` maps to `NoRate`, so this is correct for that path. However `ASIOCanSampleRate` may also return ASE_NotPresent/ASE_InvalidMode for unsupported rates on some drivers; those become hard errors here, so during enumeration `supported_sample_rates` filtering (`.unwrap_or(false)`) hides them but `check_config` (`.map_err(build_stream_err)?`) turns them into a stream-build failure instead of 'unsupported rate'.","fix":"Treat any error from `can_sample_rate` as 'rate not supported' for config validation, or explicitly map the relevant ASIO error codes to `Ok(false)`.","locations":[{"ref":"asio-sys/src/bindings/mod.rs:581-590","code":"  581 |     pub fn can_sample_rate(&self, sample_rate: f64) -> Result<bool, AsioError> {\n  582 |         let _guard = self.inner.lock_state();\n  583 |         unsafe {\n  584 |             match asio_result!(ai::can_sample_rate(sample_rate)) {\n  585 |                 Ok(()) => Ok(true),\n  586 |                 Err(AsioError::NoRate) => Ok(false),\n  587 |                 Err(err) => Err(err),\n  588 |             }\n  589 |         }\n  590 |     }","lines":10,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/asio-sys/src/bindings/mod.rs#L581-L590"},{"ref":"src/host/asio/stream.rs:1189-1195","code":" 1189 |         if driver\n 1190 |             .can_sample_rate(sample_rate)\n 1191 |             .map_err(build_stream_err)?\n 1192 |         {\n 1193 |             driver\n 1194 |                 .set_sample_rate(sample_rate)\n 1195 |                 .map_err(build_stream_err)?;","lines":7,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/asio/stream.rs#L1189-L1195"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`DeviceDescription::Display` formats name, manufacturer, device_type and interface_type, but silently omits `driver`, `address`, `direction`, and `extended` fields even when present. A user printing a device for diagnostics loses the direction (input/output/duplex) and address, which are often the most useful disambiguators (e.g. two identical-named USB mics). This is easy to mistake for the description being incomplete.","fix":"Include direction/address in the Display output, or document explicitly that Display is a short label and that callers should inspect the struct for full detail.","locations":[{"ref":"src/device_description.rs:220-238","code":"  220 | impl fmt::Display for DeviceDescription {\n  221 |     fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {\n  222 |         write!(f, \"{}\", self.name)?;\n  223 | \n  224 |         if let Some(mfr) = &self.manufacturer {\n  225 |             write!(f, \" ({})\", mfr)?;\n  226 |         }\n  227 | \n  228 |         if self.device_type != DeviceType::Unknown {\n  229 |             write!(f, \" [{}]\", self.device_type)?;\n  230 |         }\n  231 | \n  232 |         if self.interface_type != InterfaceType::Unknown {\n  233 |             write!(f, \" via {}\", self.interface_type)?;\n  234 |         }\n  235 | \n  236 |         Ok(())\n  237 |     }\n  238 | }","lines":19,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/device_description.rs#L220-L238"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`get_mixer_bursts` reads the system property `aaudio.mixer_bursts` with default `\"2\"` and parses it as i32. The parsed value is later used in build_output_stream as `tuning.mixer_bursts` and clamped with `.max(0)` at mod.rs:527. However a value of 0 (a legitimate possibility) combined with the dynamic-tuning path produces `buffer_size = burst_size * new_mixer_bursts` only after an underrun. The bigger issue: the property is a global hint, not per-stream, and using it as the starting mixer-burst count for an arbitrary stream's buffer can over/under-size the buffer. Minor, but worth noting the property semantics.","fix":"Prefer deriving the initial mixer-burst count from the opened stream (buffer_size_in_frames / frames_per_burst) and treat the system property only as a last-resort hint; document the units.","locations":[{"ref":"src/host/aaudio/java_interface/audio_manager.rs:16-24","code":"   16 | fn get_mixer_bursts<'j>(env: &mut Env<'j>) -> JResult<i32> {\n   17 |     let mixer_bursts = get_system_property(env, \"aaudio.mixer_bursts\", \"2\")?;\n   18 | \n   19 |     let mixer_bursts_string = String::from(mixer_bursts.mutf8_chars(env)?);\n   20 | \n   21 |     mixer_bursts_string\n   22 |         .parse::<i32>()\n   23 |         .map_err(|e| jni::errors::Error::ParseFailed(e.to_string()))\n   24 | }","lines":9,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/aaudio/java_interface/audio_manager.rs#L16-L24"},{"ref":"src/host/aaudio/mod.rs:544-555","code":"  544 |     let mixer_bursts = match AudioManager::get_mixer_bursts() {\n  545 |         Ok(bursts) => bursts.max(0),\n  546 |         Err(_) => {\n  547 |             let burst_size = stream.frames_per_burst();\n  548 |             if burst_size > 0 {\n  549 |                 stream.buffer_size_in_frames() / burst_size\n  550 |             } else {\n  551 |                 0 // defer to dynamic tuning\n  552 |             }\n  553 |         }\n  554 |     };\n  555 |     tuning.mixer_bursts.store(mixer_bursts, Ordering::Relaxed);","lines":12,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/aaudio/mod.rs#L544-L555"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`AudioDeviceInfo::request` is hard-coded to require SDK_INT >= 23 and otherwise returns a synthetic MethodNotFound error with empty name/sig (devices_info.rs:33-38). On API < 23, callers (HostTrait::devices) swallow the error and return a single default `Device(None)` (mod.rs:181-189), which is fine, but the fabricated `MethodNotFound { name: \"\", sig: \"\" }` is a misleading error type for \"SDK too old\" and will produce a confusing message string if it ever surfaces.","fix":"Return a descriptive error (e.g. jni::errors::Error::Other / a custom message indicating the minimum SDK), not a fake MethodNotFound with empty fields.","locations":[{"ref":"src/host/aaudio/java_interface/devices_info.rs:32-37","code":"   32 |             } else {\n   33 |                 Err(jni::errors::Error::MethodNotFound {\n   34 |                     name: \"\".into(),\n   35 |                     sig: \"\".into(),\n   36 |                 })\n   37 |             }","lines":6,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/aaudio/java_interface/devices_info.rs#L32-L37"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`device_supported_configs` skips channel counts that fail `ChannelCount::try_from` or equal 0, but it does NOT validate sample rates: `*sample_rate as SampleRate` casts an i32 from the device (or the SAMPLE_RATES table) directly. If a device reports a negative or zero sample rate via getSampleRates(), the `as u32` cast turns a negative i32 into a huge u32 and 0 stays 0, producing invalid SupportedStreamConfigRange entries that later fail validation only at build time.","fix":"Filter sample rates to positive values (and reasonable bounds) the same way channel counts are filtered, before building the config range.","locations":[{"ref":"src/host/aaudio/mod.rs:247-263","code":"  247 |     for sample_rate in sample_rates {\n  248 |         for channel_count in channel_counts {\n  249 |             let Ok(channels) = ChannelCount::try_from(*channel_count) else {\n  250 |                 continue;\n  251 |             };\n  252 |             if channels == 0 {\n  253 |                 continue;\n  254 |             }\n  255 |             for format in formats {\n  256 |                 output.push(SupportedStreamConfigRange {\n  257 |                     channels,\n  258 |                     min_sample_rate: *sample_rate as SampleRate,\n  259 |                     max_sample_rate: *sample_rate as SampleRate,\n  260 |                     buffer_size,\n  261 |                     sample_format: *format,\n  262 |                 });\n  263 |             }","lines":17,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/aaudio/mod.rs#L247-L263"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`configure_for_device` sets buffer_capacity_in_frames to `size.saturating_mul(2)` for fixed buffer sizes, but frames_per_data_callback is set to `size`. AAudio requires buffer capacity >= frames_per_burst and the callback size, but a capacity of exactly 2*callback may be smaller than the device's burst-aligned minimum for some sizes, or the device may silently clamp. More importantly, the capacity multiplier of 2 is a magic heuristic with no documented rationale and is applied regardless of how many bursts the device actually needs to avoid underruns.","fix":"Document the 2x rationale, and consider deriving capacity from frames_per_burst after open rather than from the requested callback size.","locations":[{"ref":"src/host/aaudio/mod.rs:286-291","code":"  286 |     if let BufferSize::Fixed(size) = config.buffer_size {\n  287 |         // For fixed sizes, the user explicitly wants control over the callback size.\n  288 |         builder = builder\n  289 |             .frames_per_data_callback(size.min(i32::MAX as FrameCount) as i32)\n  290 |             .buffer_capacity_in_frames(size.saturating_mul(2).min(i32::MAX as FrameCount) as i32);\n  291 |     }","lines":6,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/aaudio/mod.rs#L286-L291"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`Devices::next` reads `driver.sample_rate().unwrap_or(0.0)` and stores `sample_rate as SampleRate` into the Device; a driver that reports 0 (common before a stream is active, per the comment) yields a Device with `sample_rate == 0`. `default_config` does not reject a zero sample rate, so `default_input_config`/`default_output_config` can return a `SupportedStreamConfig` with `sample_rate: 0`, which is an invalid config that downstream code (frames_to_duration, validate_stream_config) may divide by or reject inconsistently.","fix":"Reject or substitute a sensible default when `sample_rate == 0` in `default_config`, or defer rate reporting until known.","locations":[{"ref":"src/host/asio/device.rs:191","code":"  191 |                     let sample_rate = driver.sample_rate().unwrap_or(0.0);","lines":1,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/asio/device.rs#L191"},{"ref":"src/host/asio/device.rs:100-108","code":"  100 |         Ok(SupportedStreamConfig {\n  101 |             channels,\n  102 |             sample_rate: self.sample_rate,\n  103 |             buffer_size: SupportedBufferSize::Range {\n  104 |                 min: self.buffer_size_min,\n  105 |                 max: self.buffer_size_max,\n  106 |             },\n  107 |             sample_format,\n  108 |         })","lines":9,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/asio/device.rs#L100-L108"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`Devices::next` returns `None` immediately on `LoadDriverError::DriverAlreadyExists`, stopping enumeration entirely. If a stream is active on driver A, enumeration cannot list any subsequent driver - but it also cannot list driver A's metadata via this path. More subtly, the iterator silently truncates the device list whenever any driver is currently loaded, which the caller cannot distinguish from 'no more devices'. This can make `default_input_device`/`default_output_device` return `None` or the wrong device while a stream is open.","fix":"When a driver is already loaded, surface the currently-loaded driver's metadata (or skip just that name) rather than ending enumeration; document the limitation.","locations":[{"ref":"src/host/asio/device.rs:228-230","code":"  228 |                 // A different driver is already loaded (e.g. an active Stream holds it). Stop\n  229 |                 // cleanly rather than spinning through the rest of the list.\n  230 |                 Err(sys::LoadDriverError::DriverAlreadyExists) => return None,","lines":3,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/asio/device.rs#L228-L230"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"hard","description":"`TimeBase::to_stream_instant` detects timer wrap via `ns < prev` using `Relaxed` ordering and a single shared `last_ns`. Because callbacks and `now()` both call this and swap `last_ns`, a `now()` call interleaved between two callback timestamps can record a smaller `ns` (timeGetTime ms granularity vs the callback's ns), falsely triggering a wrap and adding ~49.7 days to the epoch, permanently corrupting all subsequent StreamInstants. The comment claims races only matter at true wrap (~every 49.7 days), but ms-vs-ns granularity differences make spurious `ns < prev` likely far more often.","fix":"Maintain separate monotonic bases for `now()` and the callback path, or only run wrap detection on the callback (single-thread) timestamps; do not let the coarse `now()` value feed wrap detection.","locations":[{"ref":"src/host/asio/stream.rs:32-47","code":"   32 | impl TimeBase {\n   33 |     /// Convert a nanosecond timestamp to a monotonic `StreamInstant`.\n   34 |     fn to_stream_instant(&self, ns: u64) -> StreamInstant {\n   35 |         // `Relaxed` is sufficient: callbacks run on a single ASIO thread. The only\n   36 |         // cross-thread caller is `now()`, which may race at wrap time (~1µs every 49.7 days).\n   37 |         let prev = self.last_ns.swap(ns, Ordering::Relaxed);\n   38 |         let epoch = if ns < prev {\n   39 |             self.epoch_ns\n   40 |                 .fetch_add(TIMEGETIME_WRAP_NS, Ordering::Relaxed)\n   41 |                 + TIMEGETIME_WRAP_NS\n   42 |         } else {\n   43 |             self.epoch_ns.load(Ordering::Relaxed)\n   44 |         };\n   45 |         StreamInstant::from_nanos(epoch + ns)\n   46 |     }\n   47 | }","lines":16,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/asio/stream.rs#L32-L47"},{"ref":"src/host/asio/stream.rs:84-90","code":"   84 |     pub fn now(&self) -> StreamInstant {\n   85 |         // `ASIOTimeInfo::systemTime` is specified by the ASIO SDK as nanoseconds\n   86 |         // derived from `timeGetTime()`, so calling it here gives a value on the\n   87 |         // same clock as the `system_time` field delivered to every callback.\n   88 |         let ms = unsafe { windows::Win32::Media::timeGetTime() };\n   89 |         self.time_base.to_stream_instant(ms as u64 * 1_000_000)\n   90 |     }","lines":7,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/asio/stream.rs#L84-L90"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`Device::description()` returns `Ok(... \"Null Device\")` and `id()` returns `Ok(...)`, yet every other operation on the same device panics via `unimplemented!()`. This is internally inconsistent: the device advertises itself as a real, named, identifiable device but cannot actually do anything. Combined with `devices()` returning `Ok(Devices)` (an iterator that yields nothing) and `default_*_device()` returning `None`, the API surface is contradictory about whether a null device exists.","fix":"Make the null device either fully absent (no enumeration, errors everywhere) or fully inert-but-non-panicking. Pick one model and apply it consistently so callers can rely on either \"no devices\" or \"devices that always return Err\".","locations":[{"ref":"src/host/null/mod.rs:48-54","code":"   48 |     fn description(&self) -> Result<DeviceDescription, Error> {\n   49 |         Ok(DeviceDescriptionBuilder::new(\"Null Device\").build())\n   50 |     }\n   51 | \n   52 |     fn id(&self) -> Result<DeviceId, Error> {\n   53 |         Ok(DeviceId::new(crate::platform::HostId::Null, \"\"))\n   54 |     }","lines":7,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/null/mod.rs#L48-L54"},{"ref":"src/host/null/mod.rs:112-122","code":"  112 |     fn devices(&self) -> Result<Self::Devices, Error> {\n  113 |         Ok(Devices)\n  114 |     }\n  115 | \n  116 |     fn default_input_device(&self) -> Option<Self::Device> {\n  117 |         None\n  118 |     }\n  119 | \n  120 |     fn default_output_device(&self) -> Option<Self::Device> {\n  121 |         None\n  122 |     }","lines":11,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/null/mod.rs#L112-L122"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"PipeWire `Device` buffer-size validation (`build_*_stream_raw`) rejects `BufferSize::Fixed(n)` outside `min_quantum..=max_quantum` only when `max_quantum > 0`. But `min_quantum` can be nonzero while `max_quantum` is 0 (partial metadata), in which case validation is fully skipped and an arbitrary `n` is accepted and forwarded to PipeWire as `NODE_LATENCY = n/rate`, which the server may clamp or reject opaquely. The 0-check guards only the upper-bound case.","fix":"Skip validation only when the full quantum range is unknown (both bounds 0), and otherwise validate against whatever bounds are available.","locations":[{"ref":"src/host/pipewire/device.rs:357-369","code":"  357 |         if let BufferSize::Fixed(n) = config.buffer_size {\n  358 |             // When max_quantum is 0 the server clock metadata has not been received yet.\n  359 |             if self.max_quantum > 0 && !(self.min_quantum..=self.max_quantum).contains(&n) {\n  360 |                 return Err(Error::with_message(\n  361 |                     ErrorKind::UnsupportedConfig,\n  362 |                     format!(\n  363 |                         \"Buffer size {n} is not in the supported quantum range {min}..={max}\",\n  364 |                         min = self.min_quantum,\n  365 |                         max = self.max_quantum\n  366 |                     ),\n  367 |                 ));\n  368 |             }\n  369 |         }","lines":13,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/pipewire/device.rs#L357-L369"},{"ref":"src/host/pipewire/device.rs:549-561","code":"  549 |         if let BufferSize::Fixed(n) = config.buffer_size {\n  550 |             // When max_quantum is 0 the server clock metadata has not been received yet.\n  551 |             if self.max_quantum > 0 && !(self.min_quantum..=self.max_quantum).contains(&n) {\n {"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"PulseAudio `supported_config_ranges` iterates `for channel_count in 1..protocol::sample_spec::MAX_CHANNELS`, an exclusive upper bound, so the maximum supported channel count is never advertised (off-by-one). `make_channel_map` supports up to that count, and `default_config_from_spec` happily reports `channel_map.num_channels()` which can equal MAX_CHANNELS, so the advertised supported-config list is inconsistent with what the device can actually report/accept.","fix":"Use `1..=protocol::sample_spec::MAX_CHANNELS` (inclusive) if MAX_CHANNELS is a valid count, or clarify the intended exclusive semantics.","locations":[{"ref":"src/host/pulseaudio/mod.rs:228","code":"  228 |         for channel_count in 1..protocol::sample_spec::MAX_CHANNELS {","lines":1,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/pulseaudio/mod.rs#L228"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`format_rank` in `cmp_default_heuristics` is an inner `fn` (not const/static) redefined and used twice per comparison call. During a sort over N config ranges, this runs O(N log N) times. While each call is cheap, the heuristic is the chosen mechanism for picking defaults and the function is re-evaluated for both operands on every comparison; a match-on-enum is fine but the doc-vs-code priority drift (see separate finding) makes it the kind of code that should be a single shared, tested mapping rather than an inline closure-like fn.","fix":"Hoist `format_rank` to a module-level (or associated) function with its own unit test so the priority order is defined once and verified independently.","locations":[{"ref":"src/lib.rs:855-876","code":"  855 |         fn format_rank(fmt: SampleFormat) -> u8 {\n  856 |             match fmt {\n  857 |                 SampleFormat::DsdU8 => 0,\n  858 |                 SampleFormat::DsdU16 => 1,\n  859 |                 SampleFormat::DsdU32 => 2,\n  860 |                 SampleFormat::U8 => 3,\n  861 |                 SampleFormat::I8 => 4,\n  862 |                 // 64-bit integers: deprioritised below standard audio widths.\n  863 |                 SampleFormat::U64 => 5,\n  864 |                 SampleFormat::I64 => 6,\n  865 |                 SampleFormat::U16 => 7,\n  866 |                 SampleFormat::I16 => 8,\n  867 |                 SampleFormat::U24 => 9,\n  868 |                 SampleFormat::I24 => 10,\n  869 |                 SampleFormat::U32 => 11,\n  870 |                 SampleFormat::I32 => 12,\n  871 |                 SampleFormat::F64 => 13,\n  872 |                 SampleFormat::F32 => 14,\n  873 |             }\n  874 |         }\n  875 | \n  876 |         let cmp_format = format_rank(self.sample_format).cmp(&format_rank(other.sample_format));","lines":22,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/lib.rs#L855-L876"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`SampleFormat` derives `PartialOrd, Ord` from its declaration order (I8, I16, I24, I32, I64, U8, ...). This ordering is unrelated to the audio-priority ordering used by `cmp_default_heuristics` (which uses an explicit `format_rank`). Two competing orderings for the same type are a foot-gun: any code that sorts or compares `SampleFormat` directly (e.g. `<`, `.max()`, BTreeMap keys) silently uses declaration order, which is meaningless for audio and easy to confuse with the heuristic order.","fix":"Drop the derived `Ord`/`PartialOrd` on `SampleFormat` unless a meaningful total order is intended; if ordering is needed, document precisely what the derived order means and that it is NOT the priority order.","locations":[{"ref":"src/sample_format.rs:64-65","code":"   64 | #[derive(Clone, Copy, Debug, PartialEq, Eq, PartialOrd, Ord, Hash)]\n   65 | #[non_exhaustive]","lines":2,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/sample_format.rs#L64-L65"},{"ref":"src/lib.rs:855-874","code":"  855 |         fn format_rank(fmt: SampleFormat) -> u8 {\n  856 |             match fmt {\n  857 |                 SampleFormat::DsdU8 => 0,\n  858 |                 SampleFormat::DsdU16 => 1,\n  859 |                 SampleFormat::DsdU32 => 2,\n  860 |                 SampleFormat::U8 => 3,\n  861 |                 SampleFormat::I8 => 4,\n  862 |                 // 64-bit integers: deprioritised below standard audio widths.\n  863 |                 SampleFormat::U64 => 5,\n  864 |                 SampleFormat::I64 => 6,\n  865 |                 SampleFormat::U16 => 7,\n  866 |                 SampleFormat::I16 => 8,\n  867 |                 SampleFormat::U24 => 9,\n  868 |                 SampleFormat::I24 => 10,\n  869 |                 SampleFormat::U32 => 11,\n  870 |                 SampleFormat::I32 => 12,\n  871 |                 SampleFormat::F64 => 13,\n  872 |                 SampleFormat::F32 => 14,\n  873 |             }\n  874 |         }","lines":20,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/lib.rs#L855-L874"}]},
{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"`supported_output_configs` in webaudio sets `buffer_size: SupportedBufferSize::Range { min: 1, max: FrameCount::MAX }`, but the actual implementation uses a ScriptProcessor-style scheduling with DEFAULT_BUFFER_SIZE=2048 and only honors BufferSize::Fixed by casting `v as usize` with no range check against any real limit (mod.rs:271-274). Advertising a max of FrameCount::MAX (4 billion frames) is misleading; an enormous fixed buffer would allocate `buffer_size_frames * channels` f32s and likely OOM or fail at create_buffer. The advertised range does not reflect a usable range.","fix":"Advertise a realistic max buffer size (e.g. a few seconds of frames) rather than FrameCount::MAX, or validate Fixed sizes against a sane upper bound.","locations":[{"ref":"src/host/webaudio/mod.rs:229-232","code":"  229 |         let buffer_size = SupportedBufferSize::Range {\n  230 |             min: 1,\n  231 |             max: FrameCount::MAX,\n  232 |         };","lines":4,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/webaudio/mod.rs#L229-L232"},{"ref":"src/host/webaudio/mod.rs:567-579","code":"  567 |         let buffer_size_frames = match config.buffer_size {\n  568 |             BufferSize::Fixed(v) => v as usize,\n  569 |             BufferSize::Default => DEFAULT_BUFFER_SIZE,\n  570 |         };\n  571 |         let buffer_size_samples = buffer_size_frames.checked_mul(n_channels).ok_or_else(|| {\n  572 |             Error::with_message(\n  573 |                 ErrorKind::UnsupportedConfig,\n  574 |                 format!(\n  575 |                     \"Buffer size {} * channel count {} overflows on this platform\",\n  576 |                     buffer_size_frames, config.channels\n  577 |                 ),\n  578 |             )\n  579 |         })?;","lines":13,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/webaudio/mod.rs#L567-L579"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"hard","description":"`asio_get_buffer_sizes`/`buffersize_range` map ASIO granularity values: `-1 => Only`, `0 => Preferred`, `n>0 => Stepped{step:n}`. Per the ASIO SDK, `ASIOGetBufferSize`'s granularity is `-1` meaning 'power of 2' (sizes are powers of two between min and max), not 'only the preferred size'. Treating `-1` as `Only(pref)` makes `check_config` reject every fixed buffer size except exactly `pref`, even though the driver supports a range of power-of-two sizes.","fix":"Model `-1` granularity as 'power-of-two sizes between min and max' and validate fixed sizes accordingly, rather than as a single allowed size.","locations":[{"ref":"asio-sys/src/bindings/mod.rs:553-568","code":"  553 |     pub fn buffersize_range(&self) -> Result<BufferSizeRange, AsioError> {\n  554 |         let _guard = self.inner.lock_state();\n  555 |         let buffer_sizes = asio_get_buffer_sizes()?;\n  556 |         Ok(BufferSizeRange {\n  557 |             min: buffer_sizes.min,\n  558 |             max: buffer_sizes.max,\n  559 |             preferred: match buffer_sizes.grans {\n  560 |                 -1 => BufferPreference::Only(buffer_sizes.pref as u32),\n  561 |                 0 => BufferPreference::Preferred(buffer_sizes.pref as u32),\n  562 |                 granularity => BufferPreference::Stepped {\n  563 |                     preferred: buffer_sizes.pref as u32,\n  564 |                     step: granularity as u32,\n  565 |                 },\n  566 |             },\n  567 |         })\n  568 |     }","lines":16,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/asio-sys/src/bindings/mod.rs#L553-L568"},{"ref":"src/host/asio/stream.rs:1172-1183","code":" 1172 |         if let sys::BufferPreference::Stepped { step, .. } = range.preferred {\n 1173 |             let offset = requested_size_i32 - range.min;\n 1174 |             if offset % step as i32 != 0 {\n 1175 |                 return Err(Error::with_message(\n 1176 |                     ErrorKind::UnsupportedConfig,\n 1177 |                     format!(\n 1178 |                         \"Buffer size {requested_size} is not valid; sizes must start at {min} and increment by {step}\",\n 1179 |                         min = range.min\n 1180 |                     ),\n 1181 |                 ));\n 1182 |             }\n 1183 |         }","lines":12,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/asio/stream.rs#L1172-L1183"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"hard","description":"In `try_request_devices_info`, every per-device JNI call (`getId`, `getAddress`, `getProductName`, `getType`, `isSource`, `isSink`, `getChannelCounts`, `getSampleRates`, `getEncodings`) is invoked without checking for pending Java exceptions between calls. The jni crate's `call_method` will surface a Java exception as an Err only if it detects it; but `JObjectArray::get_element` / array `len`/`get_region` and chained calls assume no exception is pending. If any Java method throws (e.g. a SecurityException, or an AudioDeviceInfo method behaving unexpectedly on a vendor ROM), a pending exception left on the JNI env causes subsequent JNI calls to abort the VM (\"JNI called with pending exception\"). There is no `ExceptionCheck`/`ExceptionClear` anywhere in the java_interface code.","fix":"After fallible JNI calls (or at minimum at the boundaries in with_attached), check `env.exception_check()` and clear/convert pending exceptions to a JResult error so a thrown Java exception does not poison the env and abort the process.","locations":[{"ref":"src/host/aaudio/java_interface/devices_info.rs:54-91","code":"   54 |     (0..length)\n   55 |         .map(|index| {\n   56 |             let device = devices.get_element(env, index)?;\n   57 |             let id = call_method_no_args_ret_int(env, &device, \"getId\")?;\n   58 |             let address = call_method_no_args_ret_string(env, &device, \"getAddress\")?;\n   59 |             let address = String::from(address.mutf8_chars(env)?);\n   60 |             let product_name =\n   61 |                 call_method_no_args_ret_char_sequence(env, &device, \"getProductName\")?;\n   62 |             let product_name = String::from(product_name.mutf8_chars(env)?);\n   63 |             let device_type =\n   64 |                 FromPrimitive::from_i32(call_method_no_args_ret_int(env, &device, \"getType\")?)\n   65 |                     .unwrap_or(AudioDeviceType::Unsupported);\n   66 | \n   67 |             let is_source = call_method_no_args_ret_bool(env, &device, \"isSource\")?;\n   68 |             let is_sink = call_method_no_args_ret_bool(env, &device, \"isSink\")?;\n   69 |             let direction = crate::device_description::direction_from_caps(is_source, is_sink);\n   70 |             let channel_counts =\n   71 |                 call_method_no_args_ret_int_array(env, &device, \"getChannelCounts\")?\n   72 |                     .into_boxed_slice();\n   73 |             let sample_rates = call_method_no_args_ret_int_array(env, &device, \"getSampleRates\")?\n   74 |                 .into_boxed_slice();\n   75 |             let formats = call_method_no_args_ret_int_array(env, &device, \"getEncodings\")?\n   76 |                 .into_iter()\n   77 |                 .filter_map(SampleFormat::from_encoding)\n   78 |                 .collect::<Box<[_]>>();\n   79 | \n   80 |             Ok(AudioDeviceInfo {\n   81 |                 id,\n   82 |                 address,\n   83 |                 product_name,\n   84 |                 device_type,\n   85 |                 direction,\n   86 |                 channel_counts,\n   87 |                 sample_rates,\n   88 |                 formats,\n   89 |             })\n   90 |         })\n   91 |         .collect::<Result<Vec<_>, _>>()","lines":38,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/aaudio/java_interface/devices_info.rs#L54-L91"},{"ref":"src/host/aaudio/java_interface/utils.rs:28-194","code":"   28 | pub fn call_method_no_args_ret_int_array<'j>(\n   29 |     env: &mut Env<'j>,\n   30 |     subject: &JObject<'j>,\n   31 |     method: &str,\n   32 | ) -> JResult<Vec<i32>> {\n   33 |     let obj = env\n   34 |         .call_method(subject, JNIString::new(method), jni::jni_sig!(\"()[I\"), &[])?\n   35 |         .l()?;\n   36 |     let array: JIntAr
