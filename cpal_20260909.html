{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"set_sample_rate and supported_configs compute `n_ranges` from the data size reported by AudioObjectGetPropertyDataSize, allocate a Vec with that capacity, call AudioObjectGetPropertyData (which may write back a smaller actual size into data_size), then unconditionally `set_len(n_ranges)`. The updated data_size returned by the second call is ignored, so if the device returns fewer ranges than the first query indicated, the Vec exposes uninitialized AudioValueRange entries.","fix":"After the second AudioObjectGetPropertyData, recompute the length from the (possibly updated) data_size value and set_len to that, not the count from the size query.","locations":[{"ref":"src/host/coreaudio/macos/device.rs:141-156","code":"  141 |         let n_ranges = data_size as usize / mem::size_of::<AudioValueRange>();\n  142 |         let mut ranges: Vec<AudioValueRange> = Vec::with_capacity(n_ranges);\n  143 |         let status = unsafe {\n  144 |             AudioObjectGetPropertyData(\n  145 |                 audio_device_id,\n  146 |                 NonNull::from(&property_address),\n  147 |                 0,\n  148 |                 null(),\n  149 |                 NonNull::from(&mut data_size),\n  150 |                 NonNull::new(ranges.as_mut_ptr()).unwrap().cast(),\n  151 |             )\n  152 |         };\n  153 |         coreaudio::Error::from_os_status(status)?;\n  154 |         unsafe {\n  155 |             ranges.set_len(n_ranges);\n  156 |         }","lines":16,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/coreaudio/macos/device.rs#L141-L156"},{"ref":"src/host/coreaudio/macos/device.rs:600-612","code":"  600 |             let n_ranges = data_size as usize / mem::size_of::<AudioValueRange>();\n  601 |             let mut ranges: Vec<AudioValueRange> = Vec::with_capacity(n_ranges);\n  602 |             let status = AudioObjectGetPropertyData(\n  603 |                 self.audio_device_id,\n  604 |                 NonNull::from(&property_address),\n  605 |                 0,\n  606 |                 null(),\n  607 |                 NonNull::from(&mut data_size),\n  608 |                 NonNull::new(ranges.as_mut_ptr()).unwrap().cast(),\n  609 |             );\n  610 |             check_os_status(status)?;\n  611 | \n  612 |             ranges.set_len(n_ranges);","lines":13,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/coreaudio/macos/device.rs#L600-L612"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"PulseAudio `Host::new` spawns a thread that calls `Client::from_env` and on timeout returns an error while the spawned thread keeps running (the comment acknowledges \"leak the thread\"). If `from_env` later succeeds, the resulting `Client` is dropped, but the thread leak is permanent per failed host probe. Since host probing may be retried, this can accumulate stuck threads each holding a half-open socket/auth handshake. Also `CString::new(...).unwrap()` (line 139) will panic if the process id formatting ever contains a NUL, which it cannot today, but the unwrap is a latent panic.","fix":"Bound the handshake with a connect/socket timeout inside the worker so the thread terminates, or use a cancellation mechanism. Replace the `unwrap()` with a mapped error.","locations":[{"ref":"src/host/pulseaudio/mod.rs:132-155","code":"  132 |     pub fn new() -> Result<Self, Error> {\n  133 |         // `Client::from_env` does a blocking auth handshake with no socket timeout. If this never\n  134 |         // returns, fall through to the next host with no other option than to leak the thread.\n  135 |         let (tx, rx) = mpsc::channel();\n  136 |         std::thread::spawn(move || {\n  137 |             let name = CString::new(format!(\"cpal-pulseaudio-{}\", std::process::id())).unwrap();\n  138 |             let _ = tx.send(pulseaudio::Client::from_env(&name));\n  139 |         });\n  140 |         let client = rx\n  141 |             .recv_timeout(INIT_TIMEOUT)\n  142 |             .map_err(|err| match err {\n  143 |                 mpsc::RecvTimeoutError::Timeout => Error::with_message(\n  144 |                     ErrorKind::HostUnavailable,\n  145 |                     \"PulseAudio is not available: connection timed out\",\n  146 |                 ),\n  147 |                 mpsc::RecvTimeoutError::Disconnected => Error::with_message(\n  148 |                     ErrorKind::HostUnavailable,\n  149 |                     \"PulseAudio is not available: initialization failed\",\n  150 |                 ),\n  151 |             })\n  152 |             .and_then(|r| r.map_err(Error::from))?;\n  153 | \n  154 |         Ok(Self { client })\n  155 |     }","lines":24,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/pulseaudio/mod.rs#L132-L155"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In `set_sw_params_from_format`, if the first `pcm_handle.sw_params(&sw_params)` fails for any reason other than the unsupported tstamp_type (e.g. an invalid start_threshold or avail_min), the fallback path (lines 1678-1681) only changes the timestamp type and retries, masking and discarding the real underlying error. The comment assumes the only possible failure is the tstamp_type, which is not guaranteed.","fix":"Only fall back when the error is specifically due to the tstamp type (e.g. check errno), and otherwise propagate the original error instead of silently retrying with a different parameter.","locations":[{"ref":"src/host/alsa/hw_params.rs:138-147","code":"  138 |     sw_params.set_tstamp_mode(true)?;\n  139 |     sw_params.set_tstamp_type(alsa::pcm::TstampType::MonotonicRaw)?;\n  140 | \n  141 |     // tstamp_type param cannot be changed after the device is opened.\n  142 |     // The default tstamp_type value on most Linux systems is \"monotonic\",\n  143 |     // let's try to use it if setting the tstamp_type fails.\n  144 |     if pcm_handle.sw_params(&sw_params).is_err() {\n  145 |         sw_params.set_tstamp_type(alsa::pcm::TstampType::Monotonic)?;\n  146 |         pcm_handle.sw_params(&sw_params)?;\n  147 |     }","lines":10,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/alsa/hw_params.rs#L138-L147"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"LoopbackDevice::drop ignores the OSStatus from AudioHardwareDestroyAggregateDevice and AudioHardwareDestroyProcessTap (assigned to _status, never inspected). The comment says this avoids panicking in drop, which is reasonable, but a failed destroy leaks the aggregate device / process tap with no diagnostic at all.","fix":"Log (e.g. via the crate's error/trace facility) when the destroy calls return a non-zero status so leaks are observable, while still not panicking.","locations":[{"ref":"src/host/coreaudio/macos/loopback.rs:141-150","code":"  141 | impl Drop for LoopbackDevice {\n  142 |     fn drop(&mut self) {\n  143 |         unsafe {\n  144 |             // We don't check status to avoid panic during `drop`\n  145 |             let _status =\n  146 |                 AudioHardwareDestroyAggregateDevice(self.aggregate_device.audio_device_id);\n  147 |             let _status = AudioHardwareDestroyProcessTap(self.tap_id);\n  148 |         }\n  149 |     }\n  150 | }","lines":10,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/coreaudio/macos/loopback.rs#L141-L150"}]},
{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"The `else` branch (multi-byte unsigned formats) guards correctness only with `debug_assert!(sample_format.is_uint())` and then a `match` that falls through to `unimplemented!()` for any unsigned format not explicitly listed. If a new unsigned `SampleFormat` variant is ever added (e.g. a hypothetical U48) without updating this match, release builds will hit `unimplemented!()` and panic from inside an audio render path. The panic message is also slightly misleading: by construction the format is unsigned, so \"unsupported unsigned format\" is the only case, but the surrounding `is_uint()` check is a debug-only guard so in release a non-uint format reaching here would also land on the catch-all with a wrong message.","fix":"Match exhaustively on `SampleFormat` (no `_` arm) so the compiler forces an update when a new variant is added, or return/fill zero as a safe fallback instead of panicking inside a real-time callback path.","locations":[{"ref":"src/host/equilibrium.rs:43-55","code":"   43 |     } else {\n   44 |         // Multi-byte unsigned integer formats require a fill equal to the midpoint of their range.\n   45 |         debug_assert!(sample_format.is_uint());\n   46 |         match sample_format {\n   47 |             SampleFormat::U16 => fill_typed!(u16),\n   48 |             SampleFormat::U24 => fill_typed!(U24),\n   49 |             SampleFormat::U32 => fill_typed!(u32),\n   50 |             SampleFormat::U64 => fill_typed!(u64),\n   51 |             _ => unimplemented!(\n   52 |                 \"failed to fill equilibrium for unsupported unsigned format {sample_format:?}\"\n   53 |             ),\n   54 |         }\n   55 |     }","lines":13,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/equilibrium.rs#L43-L55"}]},
{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"PipeWire `init_devices` registry/metadata bind failures are silently swallowed with `return;` and TODO comments (\"do something about this error\", \"maybe we should add a log\"). A failed `core.sync(0)` inside a `global` callback also silently returns, which can leave `pending_events` unbalanced so the done-listener may quit the loop early or never, relying on the `INIT_TIMEOUT` watchdog. No diagnostic is surfaced to the user.","fix":"Surface bind/sync failures via a log or by aborting enumeration with a meaningful error, and ensure `pending_events` stays balanced when a sync cannot be issued.","locations":[{"ref":"src/host/pipewire/device.rs:849-857","code":"  849 |                     let meta_settings: Metadata = match registry.bind(global) {\n  850 |                         Ok(meta_settings) => meta_settings,\n  851 |                         Err(_) => {\n  852 |                             // TODO: do something about this error\n  853 |                             // Though it is already checked, but maybe something happened with\n  854 |                             // pipewire?\n  855 |                             return;\n  856 |                         }\n  857 |                     };","lines":9,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/pipewire/device.rs#L849-L857"},{"ref":"src/host/pipewire/device.rs:900-904","code":"  900 |                     let Ok(pending) = core.sync(0) else {\n  901 |                         // TODO: maybe we should add a log?\n  902 |                         return;\n  903 |                     };\n  904 |                     pending_events.borrow_mut().push(pending);","lines":5,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/pipewire/device.rs#L900-L904"},{"ref":"src/host/pipewire/device.rs:930-938","code":"  930 |                     let node: Node = match registry.bind(global) {\n  931 |                         Ok(node) => node,\n  932 |                         Err(_) => {\n  933 |                             // TODO: do something about this error\n  934 |                             // Though it is already checked, but maybe something happened with\n  935 |                             // pipewire?\n  936 |                             return;\n  937 |                         }\n  938 |                     };","lines":9,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/pipewire/device.rs#L930-L938"},{"ref":"src/host/pipewire/device.rs:1058-1062","code":" 1058 |                     let Ok(pending) = core.sync(0) else {\n 1059 |                         // TODO: maybe we should add a log?\n 1060 |                         return;\n 1061 |                     };\n 1062 |                     pending_events.borrow_mut().push(pending);","lines":5,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/pipewire/device.rs#L1058-L1062"}]},
{"id":"ERR_9","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`DeviceId::from_str` accepts an empty host portion: `split_once(':')` on `\":dev\"` yields `host_str == \"\"`, which is then passed to `HostId::from_str` and rejected with `UnsupportedOperation`. It also accepts an empty device portion (`\"alsa:\"` -> device == \"\") without complaint, producing a `DeviceId` with an empty backend identifier. The doc advertises validation of `\"host:device\"` format but does not reject an empty device id, which can later fail opaquely in `device_by_id`.","fix":"Reject empty device_str (and clarify behaviour for empty host) with ErrorKind::InvalidInput so malformed IDs fail fast with a clear message.","locations":[{"ref":"src/lib.rs:349-360","code":"  349 |     fn from_str(s: &str) -> Result<Self, Self::Err> {\n  350 |         let (host_str, device_str) = s.split_once(':').ok_or_else(|| {\n  351 |             Error::with_message(\n  352 |                 ErrorKind::InvalidInput,\n  353 |                 format!(\"failed to parse device ID \\\"{s}\\\": expected \\\"host:device_id\\\" format\"),\n  354 |             )\n  355 |         })?;\n  356 | \n  357 |         let host_id = crate::platform::HostId::from_str(host_str)?;\n  358 | \n  359 |         Ok(Self::new(host_id, device_str))\n  360 |     }","lines":12,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/lib.rs#L349-L360"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"high","difficulty":"hard","description":"In `set_sample_rate`, the fallback reconfiguration cycle creates dummy buffers with `prepare_buffer_infos(false, 1)` - i.e. exactly one OUTPUT channel. For an input-only ASIO device (no output channels) `ASIOCreateBuffers` will fail, so `set_sample_rate` returns an error and configuring an input stream at a non-default rate becomes impossible on output-less devices. The channel direction/count is hardcoded rather than derived from the device.","fix":"Query `ASIOGetChannels` and create a single buffer on whichever direction (input or output) actually has at least one channel.","locations":[{"ref":"asio-sys/src/bindings/mod.rs:611-612","code":"  611 |         let mut dummy_infos = prepare_buffer_infos(false, 1);\n  612 |         let buffer_size = self.create_buffers(&mut dummy_infos, None)?;","lines":2,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/asio-sys/src/bindings/mod.rs#L611-L612"},{"ref":"asio-sys/src/bindings/mod.rs:1084-1094","code":" 1084 | fn prepare_buffer_infos(is_input: bool, n_channels: usize) -> Vec<AsioBufferInfo> {\n 1085 |     let is_input = if is_input { 1 } else { 0 };\n 1086 |     (0..n_channels)\n 1087 |         .map(|ch| AsioBufferInfo {\n 1088 |             is_input,\n 1089 |             channel_num: ch as i32,\n 1090 |             // To be filled by ASIOCreateBuffers.\n 1091 |             buffers: [std::ptr::null_mut(); 2],\n 1092 |         })\n 1093 |         .collect()\n 1094 | }","lines":11,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/asio-sys/src/bindings/mod.rs#L1084-L1094"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"negligible","difficulty":"medium","description":"`Latch::waiter` uses `.expect(\"waiter called on a dropped Latch\")`. Since `flag` is only `None` after `Drop` has run, this can never panic in safe code (you cannot call a method on a dropped value), making the `Option` and the expect a defensive construct whose failure mode is unreachable. This is acceptable, but the `Option<Arc<...>>` adds indirection and an unreachable panic site to a hot-path-adjacent primitive purely to let `Drop` distinguish itself from `release`. The same effect (drop the Arc before unparking) could be achieved without making `waiter()` fallible.","fix":"Document that `waiter()` is infallible in practice, or restructure so `Drop` drops the Arc without requiring `flag` to be an `Option` in the live struct (e.g. keep the Arc non-optional and rely on `Drop` decrementing the strong count, since waiters already hold only a `Weak`).","locations":[{"ref":"src/host/latch.rs:19","code":"   19 |     flag: Option<Arc<AtomicBool>>,","lines":1,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/latch.rs#L19"},{"ref":"src/host/latch.rs:37-43","code":"   37 |     pub(crate) fn waiter(&self) -> LatchWaiter {\n   38 |         LatchWaiter(Arc::downgrade(\n   39 |             self.flag\n   40 |                 .as_ref()\n   41 |                 .expect(\"waiter called on a dropped Latch\"),\n   42 |         ))\n   43 |     }","lines":7,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/latch.rs#L37-L43"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"high","difficulty":"easy","description":"host_time_to_stream_instant() calls mach_timebase_info() via a syscall on every invocation, and it is invoked from inside the realtime render/input callbacks (device.rs:774 and 885, ios/mod.rs:536 and 581) once per audio buffer. The timebase ratio is constant for the lifetime of the process, so this repeated syscall adds avoidable latency and jitter to the audio hot path.","fix":"Query mach_timebase_info() once (e.g. via a std::sync::OnceLock cache) and reuse the cached numer/denom for all subsequent conversions instead of calling the syscall in the render callback.","locations":[{"ref":"src/host/coreaudio/mod.rs:75-85","code":"   75 | #[inline]\n   76 | fn host_time_to_stream_instant(m_host_time: u64) -> Result<StreamInstant, Error> {\n   77 |     let mut info: mach2::mach_time::mach_timebase_info = Default::default();\n   78 |     let res = unsafe { mach2::mach_time::mach_timebase_info(&mut info) };\n   79 |     check_os_status(res)?;\n   80 |     let nanos = m_host_time as u128 * info.numer as u128 / info.denom as u128;\n   81 |     let secs = u64::try_from(nanos / 1_000_000_000)\n   82 |         .map_err(|_| Error::with_message(ErrorKind::Other, \"Timestamp conversion overflowed\"))?;\n   83 |     let subsec_nanos = (nanos % 1_000_000_000) as u32;\n   84 |     Ok(StreamInstant::new(secs, subsec_nanos))\n   85 | }","lines":11,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/coreaudio/mod.rs#L75-L85"},{"ref":"src/host/coreaudio/macos/device.rs:869","code":"  869 |                 let callback = match host_time_to_stream_instant(args.time_stamp.mHostTime) {","lines":1,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/coreaudio/macos/device.rs#L869"},{"ref":"src/host/coreaudio/macos/device.rs:869","code":"  869 |                 let callback = match host_time_to_stream_instant(args.time_stamp.mHostTime) {","lines":1,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/coreaudio/macos/device.rs#L869"},{"ref":"src/host/coreaudio/ios/mod.rs:651","code":"  651 |             let callback = match host_time_to_stream_instant(args.time_stamp.mHostTime) {","lines":1,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/coreaudio/ios/mod.rs#L651"},{"ref":"src/host/coreaudio/ios/mod.rs:651","code":"  651 |             let callback = match host_time_to_stream_instant(args.time_stamp.mHostTime) {","lines":1,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/coreaudio/ios/mod.rs#L651"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"medium","difficulty":"easy","description":"`dispatch_event` allocates a `Vec` and clones every registered `Arc<dyn Fn>` callback on every dispatch, just to release the lock before invoking. While event dispatch is not the buffer hot path, `asio_message`/`sample_rate_did_change` can be called frequently by some drivers, and the per-call heap allocation + Arc clone churn is avoidable.","fix":"Invoke callbacks while holding the lock, or reuse a thread-local/preallocated buffer; cloning Arcs each call is unnecessary.","locations":[{"ref":"asio-sys/src/bindings/mod.rs:1164-1172","code":" 1164 | fn dispatch_event(event: AsioDriverEvent) -> bool {\n 1165 |     let callbacks: Vec<_> = {\n 1166 |         let lock = DRIVER_EVENT_CALLBACKS.lock().unwrap();\n 1167 |         lock.iter().map(|(_, cb)| cb.0.clone()).collect()\n 1168 |     };\n 1169 |     callbacks\n 1170 |         .iter()\n 1171 |         .fold(false, |handled, cb| cb(event) || handled)\n 1172 | }","lines":9,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/asio-sys/src/bindings/mod.rs#L1164-L1172"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"medium","difficulty":"hard","description":"In the realtime buffer-switch path, `buffer_switch` calls `ASIOGetSamplePosition` via FFI on every callback and `buffer_switch_time_info` takes the global `BUFFER_CALLBACK` mutex for the entire iteration. Holding a process-global lock during the user data callback on the audio thread means any control-thread operation that also locks `BUFFER_CALLBACK` (e.g. `add_callback`/`remove_callback` during stream build/teardown) can block the realtime thread, risking xruns.","fix":"Use a lock-free or RCU-style snapshot of the callback list for the audio thread, or hold the lock only long enough to grab a reference; avoid blocking the realtime callback on a control-path mutex.","locations":[{"ref":"asio-sys/src/bindings/mod.rs:1265","code":" 1265 |     let mut bcs = BUFFER_CALLBACK.lock().unwrap();","lines":1,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/asio-sys/src/bindings/mod.rs#L1265"},{"ref":"asio-sys/src/bindings/mod.rs:1275-1277","code":" 1275 |     for &mut (_, ref mut bc) in bcs.iter_mut() {\n 1276 |         bc.run(&callback_info);\n 1277 |     }","lines":3,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/asio-sys/src/bindings/mod.rs#L1275-L1277"},{"ref":"asio-sys/src/bindings/mod.rs:1294-1299","code":" 1294 |     let mut time = unsafe {\n 1295 |         let mut time: AsioTime = std::mem::zeroed();\n 1296 |         let res = ai::ASIOGetSamplePosition(\n 1297 |             &mut time.time_info.sample_position,\n 1298 |             &mut time.time_info.system_time,\n 1299 |         );","lines":6,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/asio-sys/src/bindings/mod.rs#L1294-L1299"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"JACK input/output deinterleave loops iterate sample-by-sample with a scalar inner loop (`for i in 0..current_frame_count { buf[ch_ix + i * num_in_channels] = input_channel[i] }`). This strided scatter/gather defeats auto-vectorization and is the hottest path in the backend. For multi-channel high-rate streams this is a measurable per-cycle cost in the RT thread.","fix":"Use chunked interleaving (e.g. iterate frames in the outer loop and channels in the inner, writing contiguous frame slices) or a dedicated interleave helper that the optimizer can vectorize; consider `itertools`-style zip over per-channel slices.","locations":[{"ref":"src/host/jack/stream.rs:460-465","code":"  460 |             for ch_ix in 0..num_in_channels {\n  461 |                 let input_channel = &self.in_ports[ch_ix].as_slice(process_scope);\n  462 |                 for i in 0..current_frame_count {\n  463 |                     self.temp_input_buffer[ch_ix + i * num_in_channels] = input_channel[i];\n  464 |                 }\n  465 |             }","lines":6,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/jack/stream.rs#L460-L465"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"In the WebAudio output scheduling closure, deinterleaving is done with a manual nested scalar loop (`temporary_channel_buffer[i] = temporary_buffer[n_channels * i + channel]`) for every channel of every buffer. This runs on the audio scheduling path. With many channels/large buffers this is a hot, non-vectorizable strided gather in a tight per-callback loop. The interleaved buffer is also fully re-walked once per channel (O(channels * frames) with poor cache locality on the source side).","fix":"Consider deinterleaving all channels in a single pass over the interleaved buffer (write into per-channel slices as you stride once), or document why per-channel passes are required. At minimum hoist `n_channels` and use iterators to enable autovectorization.","locations":[{"ref":"src/host/webaudio/mod.rs:758-762","code":"  758 |                     for channel in 0..n_channels {\n  759 |                         for i in 0..buffer_size_frames {\n  760 |                             temporary_channel_buffer[i] =\n  761 |                                 temporary_buffer[n_channels * i + channel];\n  762 |                         }","lines":5,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/webaudio/mod.rs#L758-L762"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`process_input`/`process_output` call `stream.handle.io_bytes()` inside the per-period write/read loop (lines 1167-1169 and 1234-1236), each call constructing a fresh IO wrapper. While cheap, this is in the audio hot path and is re-created on every loop iteration; for partial transfers it is reconstructed multiple times per period.","fix":"Construct the `io_bytes()` accessor once before the loop and reuse it across iterations.","locations":[{"ref":"src/host/alsa/worker.rs:337-340","code":"  337 |         match stream\n  338 |             .handle\n  339 |             .io_bytes()\n  340 |             .readi(&mut buffer[frames_read * stream.frame_size..])","lines":4,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/alsa/worker.rs#L337-L340"},{"ref":"src/host/alsa/worker.rs:422-425","code":"  422 |         match stream\n  423 |             .handle\n  424 |             .io_bytes()\n  425 |             .writei(&buffer[frames_written * stream.frame_size..])","lines":4,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/alsa/worker.rs#L422-L425"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`HostId::Display` calls `self.name().to_ascii_lowercase()`, allocating a new `String` every time a `HostId` is formatted. `DeviceId::Display` (`write!(f, \"{}:{}\", self.host(), self.id())`) goes through this path, so every `DeviceId.to_string()` (used for serialization and in `device_by_id` round-trips) allocates an intermediate lowercase String. Host names are static and could be lowercased once or written char-by-char without allocation.","fix":"Write the lowercased name directly to the formatter (iterate chars with `to_ascii_lowercase()` per char) or store/return a pre-lowercased static string for each host.","locations":[{"ref":"src/platform/mod.rs:228-232","code":"  228 |         impl std::fmt::Display for HostId {\n  229 |             fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {\n  230 |                 write!(f, \"{}\", self.name().to_ascii_lowercase())\n  231 |             }\n  232 |         }","lines":5,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/platform/mod.rs#L228-L232"},{"ref":"src/lib.rs:327-331","code":"  327 | impl std::fmt::Display for DeviceId {\n  328 |     fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {\n  329 |         write!(f, \"{}:{}\", self.host(), self.id())\n  330 |     }\n  331 | }","lines":5,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/lib.rs#L327-L331"}]},
{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"`fill_equilibrium`'s int/float fast path uses `buffer.fill(0)` which is fine, but the multi-byte unsigned path constructs a temporary slice and writes element-by-element in a scalar loop (`for sample in samples { *sample = equilibrium; }`). For large period buffers this is slower than a `memset`-style fill. The ALSA caller already mitigates this by building a template once and `copy_from_slice`-ing it (src/host/alsa/mod.rs:679-685), but the WASAPI and pipewire callers call `fill_equilibrium` on every buffer, so each silent buffer pays the scalar-loop cost.","fix":"Build the equilibrium byte pattern once and use `chunks_exact_mut(sample_size).for_each(|c| c.copy_from_slice(&pattern))`, or precompute a fill template at stream setup (as ALSA does) and reuse it in the WASAPI/pipewire callbacks instead of recomputing per buffer.","locations":[{"ref":"src/host/equilibrium.rs:31-33","code":"   31 |             for sample in samples {\n   32 |                 *sample = equilibrium;\n   33 |             }","lines":3,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/equilibrium.rs#L31-L33"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"`Driver::destroy` (public) and `DriverState::destroy`/`destroy_inner` provide a manual-destroy path with the `destroyed` flag, but cpal's host layer never calls `destroy()`; it relies entirely on `Drop`. The `destroyed` bookkeeping and the `Arc::try_unwrap` path are effectively unused by the crate itself. `is_available()` in mod.rs also contains a commented-out `unimplemented!` line. `BufferPreference::Only`/`Preferred` carry a `u32 pref` that is only read in the `Stepped` arm of check_config.","fix":"Either exercise/destroy via the public API or remove the unused manual-destroy machinery; drop the commented-out line.","locations":[{"ref":"asio-sys/src/bindings/mod.rs:931-940","code":"  931 |     pub fn destroy(self) -> Result<bool, AsioError> {\n  932 |         let Driver { inner } = self;\n  933 |         match Arc::try_unwrap(inner) {\n  934 |             Err(_) => Ok(false),\n  935 |             Ok(mut inner) => {\n  936 |                 inner.destroy_inner()?;\n  937 |                 Ok(true)\n  938 |             }\n  939 |         }\n  940 |     }","lines":10,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/asio-sys/src/bindings/mod.rs#L931-L940"},{"ref":"src/host/asio/mod.rs:54-57","code":"   54 |     fn is_available() -> bool {\n   55 |         true\n   56 |         //unimplemented!(\"check how to do this using asio-sys\")\n   57 |     }","lines":4,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/asio/mod.rs#L54-L57"},{"ref":"src/host/asio/stream.rs:1172-1183","code":" 1172 |         if let sys::BufferPreference::Stepped { step, .. } = range.preferred {\n 1173 |             let offset = requested_size_i32 - range.min;\n 1174 |             if offset % step as i32 != 0 {\n 1175 |                 return Err(Error::with_message(\n 1176 |                     ErrorKind::UnsupportedConfig,\n 1177 |                     format!(\n 1178 |                         \"Buffer size {requested_size} is not valid; sizes must start at {min} and increment by {step}\",\n 1179 |                         min = range.min\n 1180 |                     ),\n 1181 |                 ));\n 1182 |             }\n 1183 |         }","lines":12,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/asio/stream.rs#L1172-L1183"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"In devices_info.rs the loop variable shadows `direction` (the function parameter is `direction: DeviceDirection` used to compute flags at line 51, then a new per-device `direction` is computed at line 70 from is_source/is_sink). The parameter `direction` is unused after line 51. Not a bug, but the shadowing of a same-typed binding with a different meaning is a readability trap. Also the commented-out `ENCODING_PCM_8BIT` constant in definitions.rs:127 is dead.","fix":"Rename the per-device binding (e.g. device_direction) to avoid shadowing, and remove the commented-out constant or document why it is retained.","locations":[{"ref":"src/host/aaudio/java_interface/devices_info.rs:47-69","code":"   47 | ) -> JResult<Vec<AudioDeviceInfo>> {\n   48 |     let audio_manager = get_system_service(env, context, Context::AUDIO_SERVICE)?;\n   49 | \n   50 |     let devices = get_devices(env, &audio_manager, android_device_flags(direction))?;\n   51 | \n   52 |     let length = devices.len(env)?;\n   53 | \n   54 |     (0..length)\n   55 |         .map(|index| {\n   56 |             let device = devices.get_element(env, index)?;\n   57 |             let id = call_method_no_args_ret_int(env, &device, \"getId\")?;\n   58 |             let address = call_method_no_args_ret_string(env, &device, \"getAddress\")?;\n   59 |             let address = String::from(address.mutf8_chars(env)?);\n   60 |             let product_name =\n   61 |                 call_method_no_args_ret_char_sequence(env, &device, \"getProductName\")?;\n   62 |             let product_name = String::from(product_name.mutf8_chars(env)?);\n   63 |             let device_type =\n   64 |                 FromPrimitive::from_i32(call_method_no_args_ret_int(env, &device, \"getType\")?)\n   65 |                     .unwrap_or(AudioDeviceType::Unsupported);\n   66 | \n   67 |             let is_source = call_method_no_args_ret_bool(env, &device, \"isSource\")?;\n   68 |             let is_sink = call_method_no_args_ret_bool(env, &device, \"isSink\")?;\n   69 |             let direction = crate::device_description::direction_from_caps(is_source, is_sink);","lines":23,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/aaudio/java_interface/devices_info.rs#L47-L69"},{"ref":"src/host/aaudio/java_interface/definitions.rs:127","code":"  127 |     //pub(crate) const ENCODING_PCM_8BIT: i32 = 3;","lines":1,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/aaudio/java_interface/definitions.rs#L127"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"`StreamInstant::duration_since` is an exact alias of `saturating_duration_since` (it just forwards), yet its doc is a verbatim copy of `saturating_duration_since`'s doc. The two methods are indistinguishable in behaviour and documentation, which is confusing API surface; a caller cannot tell why both exist.","fix":"Either remove `duration_since`, or give it distinct documented semantics (std's `Instant::duration_since` panics on earlier; this one saturates - call that out explicitly).","locations":[{"ref":"src/timestamp.rs:86-96","code":"   86 |     /// Returns the amount of time elapsed from `earlier` to `self`, saturating to\n   87 |     /// [`Duration::ZERO`] if `earlier` is later than `self`.\n   88 |     pub fn saturating_duration_since(&self, earlier: StreamInstant) -> Duration {\n   89 |         self.checked_duration_since(earlier).unwrap_or_default()\n   90 |     }\n   91 | \n   92 |     /// Returns the amount of time elapsed from `earlier` to `self`, saturating to\n   93 |     /// [`Duration::ZERO`] if `earlier` is later than `self`.\n   94 |     pub fn duration_since(&self, earlier: StreamInstant) -> Duration {\n   95 |         self.saturating_duration_since(earlier)\n   96 |     }","lines":11,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/timestamp.rs#L86-L96"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"Comment in `asio_message` for `kAsioResyncRequest` says 'The driver encountered non-fatal data loss (e.g. a timestamp discontinuity). Notify the host so it can handle the gap appropriately.' But the cpal stream layer treats kAsioResyncRequest as a full stream-invalidation requiring stop/reinit/start (stream.rs:1013-1024 and its own comment explicitly contradicts this, citing the ASIO spec/JUCE: it is NOT a simple xrun). The two comments give opposite descriptions of the same selector.","fix":"Correct the asio-sys comment to state that kAsioResyncRequest means the driver needs a full restart/reinit, matching the stream-layer handling and the SDK.","locations":[{"ref":"asio-sys/src/bindings/mod.rs:1211-1219","code":" 1211 |         Some(AsioMessageSelectors::kAsioResyncRequest) => {\n 1212 |             // The driver encountered non-fatal data loss (e.g. a timestamp discontinuity).\n 1213 |             // Notify the host so it can handle the gap appropriately.\n 1214 |             dispatch_event(AsioDriverEvent::Message {\n 1215 |                 selector: AsioMessageSelectors::kAsioResyncRequest,\n 1216 |                 value,\n 1217 |             });\n 1218 |             true as c_long\n 1219 |         }","lines":9,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/asio-sys/src/bindings/mod.rs#L1211-L1219"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The comment for DEFAULT_CHANNEL_COUNTS claims these are \"ITU-R BS.2051 standard surround channel counts\". The values [1, 2, 4, 6, 8] are generic mono/stereo/quad/5.1/7.1 layouts; BS.2051 defines specific advanced sound-system layouts (e.g. up to 24 channels) and is not the source of this simple list. The citation is misleading.","fix":"Reword to describe them as common channel-count fallbacks (mono/stereo/quad/5.1/7.1) without the inaccurate ITU-R BS.2051 attribution.","locations":[{"ref":"src/host/aaudio/mod.rs:103-105","code":"  103 | // ITU-R BS.2051 standard surround channel counts; used as fallback when the device does not\n  104 | // report its own via AudioDeviceInfo.getChannelCounts().\n  105 | const DEFAULT_CHANNEL_COUNTS: [i32; 5] = [1, 2, 4, 6, 8];","lines":3,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/aaudio/mod.rs#L103-L105"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"Doc comments on `process_input_callback` (and the numbered steps) use `///` (outer doc comments) on statements/nested functions inside the closure body. These are not valid doc-comment positions; rustc warns about doc comments not attached to items in some contexts, and they document nothing. They should be `//` line comments. Same pattern for the `/// 1. Render ...` block on the output side.","fix":"Change `///` to `//` for these inline explanatory comments.","locations":[{"ref":"src/host/asio/stream.rs:251-252","code":"  251 |             /// 1. Write from the ASIO buffer to the interleaved CPAL buffer.\n  252 |             /// 2. Deliver the CPAL buffer to the user callback.","lines":2,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/asio/stream.rs#L251-L252"},{"ref":"src/host/asio/stream.rs:617-620","code":"  617 |             /// 1. Render the given callback to the given buffer of interleaved samples.\n  618 |             /// 2. If required, silence the ASIO buffer.\n  619 |             /// 3. Finally, write the interleaved data to the non-interleaved ASIO buffer,\n  620 |             ///    performing endianness conversions as necessary.","lines":4,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/asio/stream.rs#L617-L620"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The variable `bytes_per_channel` in the render/input callbacks is actually bytes-per-sample (sample_format.sample_size()), and `len = data_byte_size / bytes_per_channel` yields the total interleaved sample count, not a per-channel count. The name is misleading: for multi-channel interleaved data it is not bytes per channel-frame. setup_callback_vars returns it under the same misleading name.","fix":"Rename to bytes_per_sample to reflect that it is the size of one sample, not one channel-frame.","locations":[{"ref":"src/host/coreaudio/macos/device.rs:865","code":"  865 |             let len = data_byte_size as usize / bytes_per_channel;","lines":1,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/coreaudio/macos/device.rs#L865"},{"ref":"src/host/coreaudio/macos/device.rs:865","code":"  865 |             let len = data_byte_size as usize / bytes_per_channel;","lines":1,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/coreaudio/macos/device.rs#L865"},{"ref":"src/host/coreaudio/macos/device.rs:1175","code":" 1175 |     let bytes_per_channel = sample_format.sample_size();","lines":1,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/coreaudio/macos/device.rs#L1175"}]},
{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"PipeWire output `process` comment on line 702 says \"frames = samples / channels or frames = data_len / stride\", but the code computes `frames = requested.min(maxsize / stride)` - it uses PipeWire's `requested()` count, not a division of available samples. The comment describes a different (record-path) formula and is misleading for this branch.","fix":"Update the comment to describe the requested-vs-capacity clamp actually performed.","locations":[{"ref":"src/host/pipewire/stream.rs:832-835","code":"  832 |                 // frames = samples / channels or frames = data_len / stride\n  833 |                 // Honor the frame count PipeWire requests this cycle, capped by the\n  834 |                 // mapped buffer capacity to guard against any mismatch.\n  835 |                 let frames = requested.min(buf_data.as_raw().maxsize as usize / stride);","lines":4,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/pipewire/stream.rs#L832-L835"}]},
{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The doc comment on `Device::future_audio_client` (and the type-level comment) says the uninitialized IAudioClient is cached \"so that we can call functions from it without having to create/destroy audio clients all the time\". But `build_audioclient` does `lock.take().unwrap()`, removing the client from the cache on every stream build, so the cache is emptied whenever a stream is constructed and a fresh client is activated next time. The comment overstates the caching behaviour.","fix":"Reword the comment to reflect that the cache is used for format-probing reuse but is consumed when a stream is built.","locations":[{"ref":"src/host/wasapi/device.rs:78-81","code":"   78 |     /// We cache an uninitialized `IAudioClient` so that we can call functions from it without\n   79 |     /// having to create/destroy audio clients all the time.\n   80 |     future_audio_client: Arc<Mutex<Option<IAudioClientWrapper>>>, // TODO: add NonZero around the ptr\n   81 | }","lines":4,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/wasapi/device.rs#L78-L81"},{"ref":"src/host/wasapi/device.rs:605-613","code":"  605 |     /// Returns an uninitialized `IAudioClient`.\n  606 |     pub(crate) fn build_audioclient(\n  607 |         &self,\n  608 |         activation_timeout: Option<Duration>,\n  609 |     ) -> Result<Audio::IAudioClient, Error> {\n  610 |         let mut lock = self.ensure_future_audio_client(activation_timeout)?;\n  611 |         // ensure_future_audio_client always sets the Option to Some before returning Ok.\n  612 |         Ok(lock.take().unwrap().0)\n  613 |     }","lines":9,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/wasapi/device.rs#L605-L613"}]},
{"id":"CMT_7","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc for `FrameCount` (`pub type FrameCount = u32`) describes what a *frame* is (\"one sample for each channel\"), but `FrameCount` is a count of frames, not the definition of a frame. The prose is attached to the wrong item and reads as if `FrameCount` were a frame rather than a number of frames.","fix":"Reword to describe the count, e.g. \"A number of frames, where one frame is one sample per channel.\"","locations":[{"ref":"src/lib.rs:264-266","code":"  264 | /// A frame represents one sample for each channel. For example, with stereo audio,\n  265 | /// one frame contains two samples (left and right channels).\n  266 | pub type FrameCount = u32;","lines":3,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/lib.rs#L264-L266"}]},
{"id":"CMT_8","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"Typos and stale comments: 'Either create a stream if thers none or had back the size' (twice), 'Max length for divers name', 'c_uint (flags)' cast note references MinGW-w64 which is no longer the build path (build.rs uses MSVC/cc), and the `kAsioBufferSizeChange` enum doc says 'not yet supported, will currently always return 0L' yet the code now actively handles it.","fix":"Fix typos and update stale comments to match current behavior.","locations":[{"ref":"src/host/asio/stream.rs:903-904","code":"  903 |         // Either create a stream if thers none or had back the\n  904 |         // size of the current one.","lines":2,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/asio/stream.rs#L903-L904"},{"ref":"src/host/asio/stream.rs:903-904","code":"  903 |         // Either create a stream if thers none or had back the\n  904 |         // size of the current one.","lines":2,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/asio/stream.rs#L903-L904"},{"ref":"asio-sys/src/bindings/mod.rs:400","code":"  400 |         const MAX_DRIVER_NAME_LEN: usize = 32;","lines":1,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/asio-sys/src/bindings/mod.rs#L400"},{"ref":"asio-sys/src/bindings/mod.rs:253-256","code":"  253 |     kAsioBufferSizeChange,      // not yet supported, will currently always return 0L.\n  254 |                                 // for now, use kAsioResetRequest instead.\n  255 |                                 // once implemented, the new buffer size is expected\n  256 |                                 // in <value>, and on success returns 1L","lines":4,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/asio-sys/src/bindings/mod.rs#L253-L256"}]},
{"id":"CMT_9","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"The doc on `LatchWaiter::wait` says it \"Parks the calling thread until the latch is released or dropped without releasing.\" In fact the function spins-and-parks: on each loop iteration it upgrades the `Weak`, checks the flag, and only parks when the latch is still alive and the flag is false. This is correct (park tokens make the missed-wakeup window safe), but the phrasing implies a single blocking park rather than a loop. Minor, but for a sync primitive the exact semantics matter to future readers.","fix":"Reword the doc to note that it loops, re-checking the flag and the liveness of the latch on each spurious or real wakeup, and only returns when the flag is set (true) or the latch's `Arc` has been dropped (false).","locations":[{"ref":"src/host/latch.rs:81-83","code":"   81 |     /// Parks the calling thread until the latch is released or dropped without releasing.\n   82 |     ///\n   83 |     /// Returns `true` if the stream is ready, `false` if the [`Latch`] was dropped before release.","lines":3,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/latch.rs#L81-L83"},{"ref":"src/host/latch.rs:92-103","code":"   92 |     pub(crate) fn wait(&self) -> bool {\n   93 |         loop {\n   94 |             match self.0.upgrade() {\n   95 |                 None => return false,\n   96 |                 Some(flag) if flag.load(Ordering::Acquire) => return true,\n   97 |                 Some(flag) => {\n   98 |                     drop(flag); // release strong ref before parking\n   99 |                     std::thread::park();\n  100 |                 }\n  101 |             }\n  102 |         }\n  103 |     }","lines":12,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/latch.rs#L92-L103"}]},
{"id":"CMT_10","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"PulseAudio `make_playback_buffer_attr` comment block (lines 619-622) has a run-on / mismatched sentence: \"Double-buffer: total buffer = 2 callback periods. With adjust_latency this becomes the end-to-end latency target, Minimum request = one callback period, ...\" - the comma after \"target\" should be a period, and the description mixes two fields awkwardly, making the intent hard to follow.","fix":"Rewrite as separate sentences per field; fix the stray comma.","locations":[{"ref":"src/host/pulseaudio/mod.rs:622-631","code":"  622 |             protocol::stream::BufferAttr {\n  623 |                 // Double-buffer: total buffer = 2 callback periods. With\n  624 |                 // adjust_latency this becomes the end-to-end latency target,\n  625 |                 // Minimum request = one callback period, ensuring the server\n  626 |                 // always asks for exactly frame_count frames per call.\n  627 |                 max_length: double_len,\n  628 |                 target_length: double_len,\n  629 |                 minimum_request_length: len,\n  630 |                 ..Default::default()\n  631 |             }","lines":10,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/pulseaudio/mod.rs#L622-L631"}]},
{"id":"CMT_11","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"The module doc for `sample_format.rs` states \"All multi-byte sample formats use the native endianness of the target platform. CPAL handles any necessary conversions when interfacing with hardware that uses a different byte order.\" This is an overbroad guarantee: cpal generally hands raw native-endian buffers to/from the backend and does NOT perform byte-order conversion in the core; the claim that \"CPAL handles any necessary conversions\" is misleading for users relying on it.","fix":"Soften the wording to state that samples are interpreted in native endianness and that endianness conversion, if any, is the responsibility of the backend/hardware layer.","locations":[{"ref":"src/sample_format.rs:3-7","code":"    3 | //! # Byte Order\n    4 | //!\n    5 | //! All multi-byte sample formats use the native endianness of the target platform.\n    6 | //! CPAL handles any necessary conversions when interfacing with hardware that uses\n    7 | //! a different byte order.","lines":5,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/sample_format.rs#L3-L7"}]},
{"id":"CMT_12","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"In `sample_format.rs` the U48 variant is commented out, but its doc comment `/// `U48` with a valid range ...` is left as an active doc comment immediately above the (active) `U64` variant. Combined with the stray `// U48,` further down, this doc line now documents `U64` incorrectly: it describes the U48 range while attached to the U64 variant declaration.","fix":"Turn the U48 description into a plain `//` comment (like the I48 block) so it does not become the doc comment for `U64`.","locations":[{"ref":"src/sample_format.rs:100-104","code":"  100 |     /// `U48` with a valid range of '0..(1 << 48)' with `1 << 47` being the origin\n  101 |     // U48,\n  102 | \n  103 |     /// `u64` with a valid range of `u64::MIN..=u64::MAX` with `1 << 63` being the origin.\n  104 |     U64,","lines":5,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/sample_format.rs#L100-L104"}]},

{"id":"DUP_2","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"The WebAudio and AudioWorklet backends duplicate near-identical config validation (channel-count vs MAX_CHANNELS, sample-format vs SUPPORTED_SAMPLE_FORMAT, sample-rate range check), supported_output_configs construction, default_output_config, the Devices iterator, default_input_device, and the latency-summation helper (`base + output, finite, max(0)`). The two files share the same constants (MIN/MAX_CHANNELS, MIN/MAX_SAMPLE_RATE, SUPPORTED_SAMPLE_FORMAT) defined twice.","fix":"Factor the shared web-audio constants and validation/latency helpers into a common module imported by both backends.","locations":[{"ref":"src/host/webaudio/mod.rs:138-146","code":"  138 | const MIN_CHANNELS: ChannelCount = 1;\n  139 | const MAX_CHANNELS: ChannelCount = 32;\n  140 | \n  141 | // https://webaudio.github.io/web-audio-api/#supported-sample-rates\n  142 | const MIN_SAMPLE_RATE: SampleRate = 3_000;\n  143 | const MAX_SAMPLE_RATE: SampleRate = 768_000;\n  144 | \n  145 | // https://webaudio.github.io/web-audio-api/#audio-processing-model\n  146 | const SUPPORTED_SAMPLE_FORMAT: SampleFormat = SampleFormat::F32;","lines":9,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/webaudio/mod.rs#L138-L146"},{"ref":"src/host/audioworklet/mod.rs:64-72","code":"   64 | const MIN_CHANNELS: ChannelCount = 1;\n   65 | const MAX_CHANNELS: ChannelCount = 32;\n   66 | \n   67 | // https://webaudio.github.io/web-audio-api/#supported-sample-rates\n   68 | const MIN_SAMPLE_RATE: SampleRate = 3_000;\n   69 | const MAX_SAMPLE_RATE: SampleRate = 768_000;\n   70 | \n   71 | // https://webaudio.github.io/web-audio-api/#audio-processing-model\n   72 | const SUPPORTED_SAMPLE_FORMAT: SampleFormat = SampleFormat::F32;","lines":9,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/audioworklet/mod.rs#L6 {"id":"DUP_3","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"easy","description":"`StreamInstant::checked_add` and `checked_sub` are near-identical: both compute a u128 total via checked add/sub, then `u64::try_from(total / 1e9)` and `(total % 1e9) as u32` and build `Self`. The split-into-secs/nanos logic is duplicated three times (checked_add, checked_sub, and the tail of from_secs_f64), inviting divergent bugs if one is changed.","fix":"Extract a private `fn from_total_nanos(total: u128) -> Option<Self>` helper and call it from checked_add, checked_sub, and from_secs_f64.","locations":[{"ref":"src/timestamp.rs:100-114","code":"  100 |     pub fn checked_add(&self, duration: Duration) -> Option<Self> {\n  101 |         let total = self.as_nanos().checked_add(duration.as_nanos())?;\n  102 |         let secs = u64::try_from(total / 1_000_000_000).ok()?;\n  103 |         let nanos = (total % 1_000_000_000) as u32;\n  104 |         Some(Self { secs, nanos })\n  105 |     }\n  106 | \n  107 |     /// Returns `Some(t)` where `t` is `self - duration`, or `None` if the result cannot be\n  108 |     /// represented as a `StreamInstant` (i.e. would be negative).\n  109 |     pub fn checked_sub(&self, duration: Duration) -> Option<Self> {\n  110 |         let total = self.as_nanos().checked_sub(duration.as_nanos())?;\n  111 |         let secs = u64::try_from(total / 1_000_000_000).ok()?;\n  112 |         let nanos = (total % 1_000_000_000) as u32;\n  113 |         Some(Self { secs, nanos })\n  114 |     }","lines":15,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/timestamp.rs#L100-L114"}]},
{"id":"OTHER_1","type":"other","type_label":"Other","severity":"high","difficulty":"very_easy","description":"AudioObjectGetPropertyData takes io_data_size as NonNull<u32> (an in/out parameter that CoreAudio writes the actual byte count back into) and the out_data pointer. Several call sites pass `NonNull::from(&data_size)` where `data_size` is bound with an immutable `let`, so CoreAudio mutates a u32 through a pointer derived from a shared reference to a non-interior-mutable value. That is undefined behavior in Rust. Affected: is_aggregate_device (device.rs:386 `let data_size`, used at 396) and default_input_device / default_output_device (enumerate.rs:91/98 and 121/128).","fix":"Bind these as `let mut data_size = ...` and pass `NonNull::from(&mut data_size)` so the write-back goes through a unique mutable reference, matching the other call sites in this file.","locations":[{"ref":"src/host/coreaudio/macos/device.rs:396-409","code":"  396 |         let data_size = size_of::<AudioClassID>() as u32;\n  397 | \n  398 |         // SAFETY: AudioObjectGetPropertyData is documented to write an AudioClassID\n  399 |         // for kAudioObjectPropertyClass. We check the status before using the value.\n  400 |         let status = unsafe {\n  401 |             AudioObjectGetPropertyData(\n  402 |                 self.audio_device_id,\n  403 |                 NonNull::from(&property_address),\n  404 |                 0,\n  405 |                 null(),\n  406 |                 NonNull::from(&data_size),\n  407 |                 NonNull::from(&mut class_id).cast(),\n  408 |             )\n  409 |         };","lines":14,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/coreaudio/macos/device.rs#L396-L409"},{"ref":"src/host/coreaudio/macos/enumerate.rs:94-104","code":"   94 |     let data_size = mem::size_of::<AudioDeviceID>() as u32;\n   95 |     let status = unsafe {\n   96 |         AudioObjectGetPropertyData(\n   97 |             kAudioObjectSystemObject as AudioObjectID,\n   98 |             NonNull::from(&property_address),\n   99 |             0,\n  100 |             null(),\n  101 |             NonNull::from(&data_size),\n  102 |             NonNull::from(&mut audio_device_id).cast(),\n  103 |         )\n  104 |     };","lines":11,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/coreaudio/macos/enumerate.rs#L94-L104"},{"ref":"src/host/coreaudio/macos/enumerate.rs:124-134","code":"  124 |     let data_size = mem::size_of::<AudioDeviceID>() as u32;\n  125 |     let status = unsafe {\n  126 |         AudioObjectGetPropertyData(\n  127 |             kAudioObjectSystemObject as AudioObjectID,\n  128 |             NonNull::from(&property_address),\n  129 |             0,\n  130 |             null(),\n  131 |             NonNull::from(&data_size),\n  132 |             NonNull::from(&mut audio_device_id).cast(),\n  133 |         )\n  134 |     };","lines":11,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/src/host/coreaudio/macos/enumerate.rs#L124-L134"}]},
{"id":"OTHER_2","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"build.rs `download_asio_sdk_to_temp_dir` downloads the ASIO SDK from a hardcoded URL over the network with no checksum/signature verification, then compiles and statically links whatever it extracted. A network MITM or a changed upstream archive results in arbitrary C++ being compiled into the build. Also `host_os_is_windows()` uses `std::env::consts::OS` (the build-host OS) while the rest of main() keys off `CARGO_CFG_TARGET_OS`, so the download branch logic and the target-gating can disagree under cross-compilation.","fix":"Pin and verify a checksum of the downloaded SDK; prefer requiring CPAL_ASIO_DIR. Make host/target OS handling consistent.","locations":[{"ref":"asio-sys/build.rs:300-370","code":"  300 | fn download_asio_sdk_to_temp_dir(temp_dir: &Path) {\n  301 |     let asio_zip_path = temp_dir.join(\"asio_sdk.zip\");\n  302 |     if host_os_is_windows() {\n  303 |         let status = Command::new(\"powershell\")\n  304 |             .args([\n  305 |                 \"-NoProfile\",\n  306 |                 \"-Command\",\n  307 |                 &format!(\n  308 |                     \"Invoke-WebRequest -Uri {ASIO_SDK_URL} -OutFile {}\",\n  309 |                     asio_zip_path.display()\n  310 |                 ),\n  311 |             ])\n  312 |             .status()\n  313 |             .expect(\"Failed to execute PowerShell command\");\n  314 | \n  315 |         if !status.success() {\n  316 |             panic!(\"Failed to download ASIO SDK\");\n  317 |         }\n  318 |         println!(\"Downloaded ASIO SDK successfully\");\n  319 | \n  320 |         // Unzip using PowerShell's Expand-Archive\n  321 |         println!(\"Extracting ASIO SDK..\");\n  322 |         let status = Command::new(\"powershell\")\n  323 |             .args([\n  324 |                 \"-NoProfile\",\n  325 |                 \"-Command\",\n  326 |                 &format!(\n  327 |                     \"Expand-Archive -Path {} -DestinationPath {} -Force\",\n  328 |                     asio_zip_path.display(),\n  329 |                     temp_dir.display()\n  330 |                 ),\n  331 |             ])\n  332 |             .status()\n  333 |             .expect(\"Failed to execute PowerShell command for extracting ASIO SDK\");\n  334 | \n  335 |         if !status.success() {\n  336 |             panic!(\"Failed to extract ASIO SDK\");\n  337 |         }\n  338 |     } else {\n  339 |         let status = Command::new(\"sh\")\n  340 |             .arg(\"-c\")\n  341 |             .arg(&format!(\n  342 |                 \"curl -L --fail --output {} {}\",\n  343 |                 asio_zip_path.display(),\n  344 |                 \"https://www.steinberg.net/asiosdk\" // Replace with the actual ASIO SDK URL\n  345 |             ))\n  346 |             .status()\n  347 |             .expect(\"Failed to execute curl command\");\n  348 | \n  349 |         if !status.success() {\n  350 |             panic!(\"Failed to download ASIO SDK\");\n  351 |         }\n  352 |         println!(\"Downloaded ASIO SDK successfully\");\n  353 | \n  354 |         // Extract using `unzip`\n  355 |         println!(\"Extracting ASIO SDK..\");\n  356 |         let status = Command::new(\"unzip\")\n  357 |             .args([\n  358 |                 \"-o\",\n  359 |                 asio_zip_path.to_str().unwrap(),\n  360 |                 \"-d\",\n  361 |                 temp_dir.to_str().unwrap(),\n  362 |             ])\n  363 |             .status()\n  364 |             .expect(\"Failed to execute unzip command for extracting ASIO SDK\");\n  365 | \n  366 |         if !status.success() {\n  367 |             panic!(\"Failed to extract ASIO SDK\");\n  368 |         }\n  369 |     }\n  370 | }","lines":71,"link":"https://github.com/RustAudio/cpal/blob/01b18940f58fc60df51533d415f14afcadd76da1/asio-sys/build.rs#L300-L370"},{"ref":"asio-sys/build.rs:20-23",
