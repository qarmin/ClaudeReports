<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

<script type="application/json" id="D">[{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`init_android_main_thread` in `android-activity/src/init.rs` performs its one-time global setup inside an `APP_ONCE.get_or_init(|| unsafe { ... })` closure that contains several `.expect(...)` calls and an `assert_ne!(...)` around JNI operations: `get_application(...).expect(...)`, `get_assets(...).expect(...)`, two `env.new_global_ref(...).expect(...)` calls, and `assert_ne!(asset_manager_ptr, null, ...)`. Any of these JNI calls can legitimately fail (e.g. `new_global_ref` can throw `OutOfMemoryError` under JNI reference-table pressure, or a customized `Application`/`getAssets()` override could throw), and any such failure panics inside this closure. This function is invoked from `_rust_glue_entry`, which is wrapped in `abort_on_panic` (see `game_activity/mod.rs`), so the failure mode is a full process abort rather than a graceful, recoverable error - even though `init_android_main_thread`'s own signature returns `jni::errors::Result<...>` and the call site already has a `match ... Err(err) => { ...; return Err(err); }` path ready to handle a real `Result::Err`.","fix":"Propagate JNI failures as `Err` instead of panicking, so the existing error path in `_rust_glue_entry` can handle them:\n```rust\nlet application = get_application(env, jni_activity)?;\nlet app_asset_manager = get_assets(env, &application)?;\nlet app_global = env.new_global_ref(application)?;\n...\nif asset_manager_ptr.is_null() {\n    return Err(jni::errors::Error::NullPtr(\"Failed to get Application AAssetManager\"));\n}\n```\nSince this all runs inside `OnceLock::get_or_init`, propagating an error out of the closure (rather than `get_or_init` itself, which doesn't support fallible init) will require restructuring to something like `OnceLock<OnceCell<Result<AppState, ...>>>` or performing the fallible steps before the `get_or_init` call and only storing the already-validated `AppState` inside it.","locations":[{"ref":"android-activity/src/init.rs:274-310","code":"  274 |     vm.with_local_frame(10, |env| -> jni::errors::Result<_> {\n  275 |         let app_state = APP_ONCE.get_or_init(|| unsafe {\n  276 |             let application =\n  277 |                 get_application(env, jni_activity).expect(\"Failed to get Application instance\");\n  278 |             let app_asset_manager =\n  279 |                 get_assets(env, &application).expect(\"Failed to get AssetManager\");\n  280 |             let app_global = env\n  281 |                 .new_global_ref(application)\n  282 |                 .expect(\"Failed to create global ref for Application\");\n  283 |             // Make sure we don't delete the global reference via Drop\n  284 |             let app_global = app_global.into_raw();\n  285 |             ndk_context::initialize_android_context(vm.get_raw().cast(), app_global.cast());\n  286 | \n  287 |             let asset_manager_global = env\n  288 |                 .new_global_ref(app_asset_manager)\n  289 |                 .expect(\"Failed to create global ref for AssetManager\");\n  290 |             // Make sure we don't delete the global reference via Drop because\n  291 |             // the AAssetManager pointer will only be valid while we can\n  292 |             // guarantee that the Java AssetManager is not garbage collected\n  293 |             let asset_manager_global = asset_manager_global.into_raw();\n  294 |             let asset_manager_ptr =\n  295 |                 ndk_sys::AAssetManager_fromJava(env.get_raw() as _, asset_manager_global as _);\n  296 |             assert_ne!(\n  297 |                 asset_manager_ptr,\n  298 |                 std::ptr::null_mut(),\n  299 |                 \"Failed to get Application AAssetManager\"\n  300 |             );\n  301 |             let app_asset_manager =\n  302 |                 AssetManager::from_ptr(std::ptr::NonNull::new(asset_manager_ptr).unwrap());\n  303 | \n  304 |             let main_callbacks = MainCallbacks::new(java_main_looper);\n  305 | \n  306 |             AppState {\n  307 |                 main_callbacks,\n  308 |                 app_asset_manager,\n  309 |             }\n  310 |         });","lines":37,"link":"https://github.com/rust-mobile/android-activity/blob/b4ddf059b77be12cdb955d394e65a92e7568d936/android-activity/src/init.rs#L274-L310"}]},{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`PointerImpl::axis_value` in `android-activity/src/game_activity/input.rs` indexes the fixed-size C array `pointer.axisValues[axis as usize]`, where `axisValues: [f32; 48]` (see `GameActivityPointerAxes` in the bindgen output). `Axis` is documented as an extensible enum with a catch-all `__Unknown(u32)` variant specifically intended to round-trip arbitrary SDK integer values that the crate doesn't recognize at compile time. If application code constructs an `Axis` from an arbitrary/unexpected `u32` (e.g. obtained from some other source, or simply a caller passing back a value in the `__Unknown` variant that happens to be `>= 48`) and then calls `pointer.axis_value(axis)`, the array index is out of bounds and Rust's bounds check will panic instead of returning a graceful error/`None`.","fix":"Bounds-check before indexing and return a safe default (or `Option<f32>`) for out-of-range axis values:\n```rust\npub fn axis_value(&self, axis: Axis) -> f32 {\n    let pointer = &self.event.ga_event.pointers[self.index];\n    let axis: u32 = axis.into();\n    pointer.axisValues.get(axis as usize).copied().unwrap_or(0.0)\n}\n```","locations":[{"ref":"android-activity/src/game_activity/input.rs:259-264","code":"  259 |     #[inline]\n  260 |     pub fn axis_value(&self, axis: Axis) -> f32 {\n  261 |         let pointer = &self.event.ga_event.pointers[self.index];\n  262 |         let axis: u32 = axis.into();\n  263 |         pointer.axisValues[axis as usize]\n  264 |     }","lines":6,"link":"https://github.com/rust-mobile/android-activity/blob/b4ddf059b77be12cdb955d394e65a92e7568d936/android-activity/src/game_activity/input.rs#L259-L264"}]},{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`StateSaver::store` in `android-activity/src/game_activity/mod.rs` calls `libc::malloc(state.len())` and treats a `null` return as a fatal error via `panic!(\"Failed to allocate save_state buffer\")`. When `state` is an empty slice (a legitimate call, e.g. an application explicitly saving \"no state\"), `malloc(0)` is permitted by the C standard to return either `NULL` or a valid unique pointer - the behavior is implementation-defined, not guaranteed non-null. While Android's Bionic libc happens to return a valid pointer for `malloc(0)` in current practice, the code as written will panic on this fully legitimate zero-length save if that libc behavior ever changes, rather than treating a zero-length save specially.","fix":"Special-case the empty state so no allocation is attempted:\n```rust\nif state.is_empty() {\n    (*app_ptr).savedState = ptr::null_mut();\n    (*app_ptr).savedStateSize = 0;\n    return;\n}\nlet buf = libc::malloc(state.len());\nif buf.is_null() {\n    panic!(\"Failed to allocate save_state buffer\");\n}\n```","locations":[{"ref":"android-activity/src/game_activity/mod.rs:61-86","code":"   61 |             unsafe {\n   62 |                 // In case the application calls store() multiple times for some reason we\n   63 |                 // make sure to free any pre-existing state...\n   64 |                 if !(*app_ptr).savedState.is_null() {\n   65 |                     libc::free((*app_ptr).savedState);\n   66 |                     (*app_ptr).savedState = ptr::null_mut();\n   67 |                     (*app_ptr).savedStateSize = 0;\n   68 |                 }\n   69 | \n   70 |                 let buf = libc::malloc(state.len());\n   71 |                 if buf.is_null() {\n   72 |                     panic!(\"Failed to allocate save_state buffer\");\n   73 |                 }\n   74 | \n   75 |                 // Since it's a byte array there's no special alignment requirement here.\n   76 |                 //\n   77 |                 // Since we re-define `buf` we ensure it's not possible to access the buffer\n   78 |                 // via its original pointer for the lifetime of the slice.\n   79 |                 {\n   80 |                     let buf: &mut [u8] = std::slice::from_raw_parts_mut(buf.cast(), state.len());\n   81 |                     buf.copy_from_slice(state);\n   82 |                 }\n   83 | \n   84 |                 (*app_ptr).savedState = buf;\n   85 |                 (*app_ptr).savedStateSize = state.len() as _;\n   86 |             }","lines":26,"link":"https://github.com/rust-mobile/android-activity/blob/b4ddf059b77be12cdb955d394e65a92e7568d936/android-activity/src/game_activity/mod.rs#L61-L86"}]},{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`clear_and_map_exception_to_err` in `android-activity/src/jni_utils.rs` calls `env.exception_catch().expect_err(\"Spurious JavaException error with no exception to catch\")` whenever the wrapped JNI call returned `jni::errors::Error::JavaException`. This assumes it is always guaranteed that a pending exception exists at this point; if that invariant is ever violated (e.g. because of a JNI/threading edge case where the exception was already cleared, or a behavioral change in the `jni` crate this code depends on), this `.expect_err(...)` panics instead of degrading gracefully, and this helper is invoked from virtually every JNI call site in the crate (`sdk.rs`, `game_activity/mod.rs`, etc.), so the blast radius of the assumption being wrong is broad.","fix":"Fall back to a generic internal error instead of panicking if, unexpectedly, no exception was pending:\n```rust\npub(crate) fn clear_and_map_exception_to_err(\n    env: &mut jni::Env<'_>,\n    err: jni::errors::Error,\n) -> InternalAppError {\n    if matches!(err, jni::errors::Error::JavaException) {\n        match env.exception_catch() {\n            Ok(()) => InternalAppError::JniBadArgument(\n                \"Spurious JavaException error with no exception to catch\".into(),\n            ),\n            Err(caught) => caught.into(),\n        }\n    } else {\n        err.into()\n    }\n}","locations":[{"ref":"android-activity/src/jni_utils.rs:17-28","code":"   17 | pub(crate) fn clear_and_map_exception_to_err(\n   18 |     env: &mut jni::Env<'_>,\n   19 |     err: jni::errors::Error,\n   20 | ) -> InternalAppError {\n   21 |     if matches!(err, jni::errors::Error::JavaException) {\n   22 |         env.exception_catch()\n   23 |             .expect_err(\"Spurious JavaException error with no exception to catch\")\n   24 |     } else {\n   25 |         err\n   26 |     }\n   27 |     .into()\n   28 | }","lines":12,"link":"https://github.com/rust-mobile/android-activity/blob/b4ddf059b77be12cdb955d394e65a92e7568d936/android-activity/src/jni_utils.rs#L17-L28"}]},{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`AndroidApp::sdk_version()` in `android-activity/src/lib.rs` panics (via `.expect(...)` or an explicit `panic!`) if the `ro.build.version.sdk` system property is absent or fails to parse as `i32`. This is a public, safe function with no `# Panics` section in its doc comment, so callers have no signal that it can panic. System properties are OS/vendor-controlled and could plausibly be missing, empty, or non-numeric on non-standard Android forks/emulators, which would surface as an uncaught panic in application code that merely wanted to query the SDK version.","fix":"Either document the panic explicitly with a `# Panics` section, or change the API to return an `Option<i32>`/`Result` so callers can handle a missing/malformed property gracefully:\n```rust\npub fn sdk_version() -> Option<i32> {\n    android_properties::getprop(\"ro.build.version.sdk\").value()?.parse::<i32>().ok()\n}\n```","locations":[{"ref":"android-activity/src/lib.rs:1258-1269","code":" 1258 |     /// The user-visible SDK version of the framework\n 1259 |     ///\n 1260 |     /// Also referred to as [`Build.VERSION_CODES`](https://developer.android.com/reference/android/os/Build.VERSION_CODES)\n 1261 |     pub fn sdk_version() -> i32 {\n 1262 |         let mut prop = android_properties::getprop(\"ro.build.version.sdk\");\n 1263 |         if let Some(val) = prop.value() {\n 1264 |             val.parse::<i32>()\n 1265 |                 .expect(\"Failed to parse ro.build.version.sdk property\")\n 1266 |         } else {\n 1267 |             panic!(\"Couldn't read ro.build.version.sdk system property\");\n 1268 |         }\n 1269 |     }","lines":12,"link":"https://github.com/rust-mobile/android-activity/blob/b4ddf059b77be12cdb955d394e65a92e7568d936/android-activity/src/lib.rs#L1258-L1269"}]},{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`MainCallbacks::new` in `android-activity/src/main_callbacks.rs` calls `libc::eventfd(...)` and then `assert_ne!(java_main_callbacks_event_fd, -1, \"Failed to create Java main looper event fd\")`. `eventfd(2)` can fail with `EMFILE`/`ENFILE` when the process or system file-descriptor table is exhausted, which is a real (if uncommon) resource-exhaustion condition rather than a programming error, yet it's handled with an `assert!` that aborts/panics the whole `android_main` startup instead of surfacing a recoverable error.","fix":"Propagate the failure instead of asserting, e.g. have `MainCallbacks::new` return a `Result` and let callers in `init.rs` decide how to react (log and retry, or fail the `Activity` startup cleanly) rather than aborting the process outright.","locations":[{"ref":"android-activity/src/main_callbacks.rs:68-75","code":"   68 |     pub fn new(java_main_looper: &ndk::looper::ForeignLooper) -> Self {\n   69 |         let java_main_callbacks_event_fd =\n   70 |             unsafe { libc::eventfd(0, libc::EFD_NONBLOCK | libc::EFD_CLOEXEC) };\n   71 |         assert_ne!(\n   72 |             java_main_callbacks_event_fd, -1,\n   73 |             \"Failed to create Java main looper event fd\"\n   74 |         );\n   75 | ","lines":8,"link":"https://github.com/rust-mobile/android-activity/blob/b4ddf059b77be12cdb955d394e65a92e7568d936/android-activity/src/main_callbacks.rs#L68-L75"}]},{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"`notify_window_resized` and `notify_window_redraw_needed` in `glue.rs:441-459` each contain `debug_assert_eq!(guard.window.as_ref().unwrap().ptr().as_ptr(), native_window);`. The `.unwrap()` runs unconditionally as part of evaluating the assert's left-hand side, so if `guard.window` is ever `None` when this callback fires (e.g. the invariant described in the comment - windows only resize between create/destroy - is violated by a future Android quirk or a race), a debug build panics on the `unwrap()` with a generic \"called `Option::unwrap()` on a `None` value\" message instead of a clear assertion failure describing what went wrong. Combined with the missing `abort_on_panic` on these two functions (see related finding), this panic risks unwinding across the FFI boundary.","fix":"```rust\ndebug_assert_eq!(\n    guard.window.as_ref().map(|w| w.ptr().as_ptr()),\n    Some(native_window),\n    \"onNativeWindowResized fired without a matching current window\"\n);\n```\nThis keeps the same debug-only check but avoids panicking with an opaque `unwrap()` message when the invariant doesn't hold, and never panics at all in release builds.","locations":[{"ref":"android-activity/src/native_activity/glue.rs:441-459","code":"  441 |     pub fn notify_window_resized(&self, native_window: *mut ndk_sys::ANativeWindow) {\n  442 |         let mut guard = self.mutex.lock().unwrap();\n  443 |         // set_window always syncs .pending_window back to .window before returning. This callback\n  444 |         // from Android can never arrive at an interim state, and validates that Android:\n  445 |         // 1. Only provides resizes in between onNativeWindowCreated and onNativeWindowDestroyed;\n  446 |         // 2. Doesn't call it on a bogus window pointer that we don't know about.\n  447 |         debug_assert_eq!(guard.window.as_ref().unwrap().ptr().as_ptr(), native_window);\n  448 |         guard.write_cmd(AppCmd::WindowResized);\n  449 |     }\n  450 | \n  451 |     pub fn notify_window_redraw_needed(&self, native_window: *mut ndk_sys::ANativeWindow) {\n  452 |         let mut guard = self.mutex.lock().unwrap();\n  453 |         // set_window always syncs .pending_window back to .window before returning. This callback\n  454 |         // from Android can never arrive at an interim state, and validates that Android:\n  455 |         // 1. Only provides resizes in between onNativeWindowCreated and onNativeWindowDestroyed;\n  456 |         // 2. Doesn't call it on a bogus window pointer that we don't know about.\n  457 |         debug_assert_eq!(guard.window.as_ref().unwrap().ptr().as_ptr(), native_window);\n  458 |         guard.write_cmd(AppCmd::WindowRedrawNeeded);\n  459 |     }","lines":19,"link":"https://github.com/rust-mobile/android-activity/blob/b4ddf059b77be12cdb955d394e65a92e7568d936/android-activity/src/native_activity/glue.rs#L441-L459"}]},{"id":"UAF_1","type":"use_after_free","type_label":"Use After Free","severity":"high","difficulty":"hard","description":"`NativeActivityState.input_queue` is only ever updated to match `pending_input_queue` inside `WaitableNativeActivityState::pre_exec_cmd`'s `AppCmd::InputQueueChanged` arm (`glue.rs:604-612`), which runs on the Rust `android_main` thread while polling. `unsafe fn set_input` (`glue.rs:461-480`), which runs on the JVM thread from `on_input_queue_created`/`on_input_queue_destroyed`, only *waits* for that update via `while guard.thread_state == NativeThreadState::Running && guard.input_queue != guard.pending_input_queue`. If `thread_state` is not `Running` (the `android_main` thread already returned, e.g. it was stored in a `'static` and outlived the initial call as the struct's own doc at `glue.rs:227-232` anticipates, or it simply finished before `onInputQueueDestroyed`/`onDestroy` fire), the wait is skipped entirely and `input_queue` is never updated - it keeps pointing at whatever `AInputQueue*` was current before the thread stopped, even though Android's `onInputQueueDestroyed` contract means that queue is about to be torn down/freed. Later, `Drop for WaitableNativeActivityState` (`glue.rs:330-338`) unconditionally calls `guard.detach_input_queue_from_looper()`, which dereferences that now-stale `self.input_queue` pointer via `AInputQueue_detachLooper` - a use-after-free. The same stale pointer can also be reused by `AndroidAppInner::input_events_receiver`/`NativeActivityGlue::looper_attached_input_queue` (`android-activity/src/native_activity/mod.rs:481-505`, `glue.rs:158-177`) if a background thread holding a cloned `AndroidApp` calls it after `android_main` has already returned, handing the caller a live-looking `InputQueue` wrapper around a freed `AInputQueue`.","fix":"When the ack-wait loop is skipped because the Rust thread is no longer `Running`, still synchronize the bookkeeping state directly instead of leaving it stale, e.g. in `set_input`:\n```rust\nunsafe fn set_input(&self, input_queue: *mut ndk_sys::AInputQueue) {\n    let mut guard = self.mutex.lock().unwrap();\n    debug_assert!(guard.pending_input_queue.is_null(), \"InputQueue update clash\");\n\n    guard.pending_input_queue = input_queue;\n    guard.write_cmd(AppCmd::InputQueueChanged);\n    while guard.thread_state == NativeThreadState::Running\n        && guard.input_queue != guard.pending_input_queue\n    {\n        guard = self.cond.wait(guard).unwrap();\n    }\n    // The Rust thread has already stopped and will never process\n    // `AppCmd::InputQueueChanged`, so update the bookkeeping ourselves to\n    // avoid leaving a dangling `input_queue` pointer behind.\n    if guard.thread_state != NativeThreadState::Running {\n        guard.detach_input_queue_from_looper();\n        guard.input_queue = guard.pending_input_queue;\n    }\n    guard.pending_input_queue = ptr::null_mut();\n}\n```\nThis ensures `input_queue` is always kept in sync with the last `onInputQueueCreated`/`onInputQueueDestroyed` notification, so `Drop` and `looper_attached_input_queue` never operate on a freed `AInputQueue*`.","locations":[{"ref":"android-activity/src/native_activity/glue.rs:322-327","code":"  322 |     pub unsafe fn detach_input_queue_from_looper(&mut self) {\n  323 |         if !self.input_queue.is_null() {\n  324 |             log::trace!(\"Detaching input queue from looper\");\n  325 |             ndk_sys::AInputQueue_detachLooper(self.input_queue);\n  326 |         }\n  327 |     }","lines":6,"link":"https://github.com/rust-mobile/android-activity/blob/b4ddf059b77be12cdb955d394e65a92e7568d936/android-activity/src/native_activity/glue.rs#L322-L327"},{"ref":"android-activity/src/native_activity/glue.rs:330-338","code":"  330 | impl Drop for WaitableNativeActivityState {\n  331 |     fn drop(&mut self) {\n  332 |         log::info!(\"WaitableNativeActivityState::drop!\");\n  333 |         unsafe {\n  334 |             let mut guard = self.mutex.lock().unwrap();\n  335 |             guard.detach_input_queue_from_looper();\n  336 |         }\n  337 |     }\n  338 | }","lines":9,"link":"https://github.com/rust-mobile/android-activity/blob/b4ddf059b77be12cdb955d394e65a92e7568d936/android-activity/src/native_activity/glue.rs#L330-L338"},{"ref":"android-activity/src/native_activity/glue.rs:461-480","code":"  461 |     unsafe fn set_input(&self, input_queue: *mut ndk_sys::AInputQueue) {\n  462 |         let mut guard = self.mutex.lock().unwrap();\n  463 | \n  464 |         // The pending_input_queue state should only be set while in this method, and since\n  465 |         // it doesn't allow re-entrance and is cleared before returning then we expect\n  466 |         // this to be null\n  467 |         debug_assert!(\n  468 |             guard.pending_input_queue.is_null(),\n  469 |             \"InputQueue update clash\"\n  470 |         );\n  471 | \n  472 |         guard.pending_input_queue = input_queue;\n  473 |         guard.write_cmd(AppCmd::InputQueueChanged);\n  474 |         while guard.thread_state == NativeThreadState::Running\n  475 |             && guard.input_queue != guard.pending_input_queue\n  476 |         {\n  477 |             guard = self.cond.wait(guard).unwrap();\n  478 |         }\n  479 |         guard.pending_input_queue = ptr::null_mut();\n  480 |     }","lines":20,"link":"https://github.com/rust-mobile/android-activity/blob/b4ddf059b77be12cdb955d394e65a92e7568d936/android-activity/src/native_activity/glue.rs#L461-L480"}]},{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`MotionEvent::pointer_at_index` in `android-activity/src/native_activity/input.rs` is documented as \"Panics if the pointer index is out of bounds,\" but the implementation never validates `index` against `self.ndk_event.pointer_count()`. It simply stores `index` into `PointerImpl { pointer_index: index, .. }` and returns a `Pointer`. Any accessor called on that `Pointer` (e.g. `pointer_id()`, `axis_value()`, `raw_x()`, `raw_y()`, `tool_type()`, `history()`) forwards `pointer_index` straight into NDK C functions such as `AMotionEvent_getPointerId`/`AMotionEvent_getAxisValue`/`AMotionEvent_getRawX`, none of which bounds-check the index either (the NDK docs state the result is undefined for an invalid index). So instead of the documented panic, an out-of-range `index` silently causes an out-of-bounds read inside the native NDK/Android input code - a real memory-safety hole reachable from ordinary (safe) application code, not just a doc mismatch.","fix":"Validate the index (and update/keep the doc honest) before constructing the `Pointer`:\n```rust\npub fn pointer_at_index(&self, index: usize) -> Pointer<'_> {\n    assert!(\n        index < self.pointer_count(),\n        \"pointer index {index} out of bounds (pointer_count = {})\",\n        self.pointer_count()\n    );\n    Pointer {\n        inner: PointerImpl {\n            event: self.ndk_event.ptr(),\n            pointer_index: index,\n            _marker: std::marker::PhantomData,\n        },\n    }\n}\n```\nThis makes the actual behavior match the documented \"Panics if the pointer index is out of bounds\" contract, and prevents an out-of-bounds native read reaching `AMotionEvent_getPointerId`/`AMotionEvent_getAxisValue`/etc.","locations":[{"ref":"android-activity/src/native_activity/input.rs:122-134","code":"  122 |     /// The pointer at a given pointer index. Panics if the pointer index is out of bounds.\n  123 |     ///\n  124 |     /// If you need to loop over all the pointers, prefer the [`pointers()`](Self::pointers) method.\n  125 |     #[inline]\n  126 |     pub fn pointer_at_index(&self, index: usize) -> Pointer<'_> {\n  127 |         Pointer {\n  128 |             inner: PointerImpl {\n  129 |                 event: self.ndk_event.ptr(),\n  130 |                 pointer_index: index,\n  131 |                 _marker: std::marker::PhantomData,\n  132 |             },\n  133 |         }\n  134 |     }","lines":13,"link":"https://github.com/rust-mobile/android-activity/blob/b4ddf059b77be12cdb955d394e65a92e7568d936/android-activity/src/native_activity/input.rs#L122-L134"}]},{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Within `game_activity::input::MotionEvent` the two timestamp accessors are documented identically (both say \"in the `java.lang.System.nanoTime()` time base\") but are implemented inconsistently: `event_time()` multiplies the raw field by `1_000_000` with a comment \"Convert from milliseconds to nanoseconds\", while `down_time()` returns the raw field completely unconverted:\n```rust\npub fn down_time(&self) -> i64 {\n    self.ga_event.downTime\n}\n...\npub fn event_time(&self) -> i64 {\n    self.ga_event.eventTime * 1_000_000 // Convert from milliseconds to nanoseconds\n}\n```\nIf `ga_event.downTime` and `ga_event.eventTime` are populated from the same underlying Java source units (as their symmetric naming/semantics in `android.view.MotionEvent` strongly suggests), then `down_time()` is missing the same `* 1_000_000` scaling `event_time()` applies, so any application computing gesture duration as `event_time() - down_time()` (or comparing the two) gets a result that is off by a factor of roughly 1e6. This is also inconsistent with `HistoricalPointerImpl::event_time()` in the same file, which reads `historicalEventTimesNanos` with no extra scaling (field name implies it is already nanoseconds), reinforcing that the *current* event's `downTime`/`eventTime` fields are likely both in the same (millisecond) unit and only one of the two accessors is being converted.","fix":"Verify against the GameActivity native source what unit `GameActivityMotionEvent::downTime` is actually stored in, and make the two accessors consistent, e.g. if it is milliseconds like `eventTime`:\n```rust\n#[inline]\npub fn down_time(&self) -> i64 {\n    self.ga_event.downTime * 1_000_000 // Convert from milliseconds to nanoseconds\n}\n```\n(or, if `downTime` is already nanoseconds, remove the scaling from `event_time()` instead and correct the doc comment/behavior accordingly).","locations":[{"ref":"android-activity/src/game_activity/input.rs:163-172","code":"  163 | \n  164 |     /// Returns the time of the start of this gesture, in the `java.lang.System.nanoTime()` time\n  165 |     /// base\n  166 |     ///\n  167 |     /// See [the NDK\n  168 |     /// docs](https://developer.android.com/ndk/reference/group/input#amotionevent_getdowntime)\n  169 |     #[inline]\n  170 |     pub fn down_time(&self) -> i64 {\n  171 |         self.ga_event.downTime\n  172 |     }","lines":10,"link":"https://github.com/rust-mobile/android-activity/blob/b4ddf059b77be12cdb955d394e65a92e7568d936/android-activity/src/game_activity/input.rs#L163-L172"},{"ref":"android-activity/src/game_activity/input.rs:182-190","code":"  182 | \n  183 |     /// Returns the time of this event, in the `java.lang.System.nanoTime()` time base\n  184 |     ///\n  185 |     /// See [the NDK\n  186 |     /// docs](https://developer.android.com/ndk/reference/group/input#amotionevent_geteventtime)\n  187 |     #[inline]\n  188 |     pub fn event_time(&self) -> i64 {\n  189 |         self.ga_event.eventTime * 1_000_000 // Convert from milliseconds to nanoseconds\n  190 |     }","lines":9,"link":"https://github.com/rust-mobile/android-activity/blob/b4ddf059b77be12cdb955d394e65a92e7568d936/android-activity/src/game_activity/input.rs#L182-L190"}]},{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`AndroidAppInner::map_input_state_to_text_event_callback` in `android-activity/src/game_activity/mod.rs` clamps the incoming selection bounds with `(*state).selection.start.clamp(0, len as i32 + 1)` and `.selection.end.clamp(0, len as i32 + 1)`. Since `TextSpan`'s own documentation defines `end` as exclusive and valid indices for a string of byte length `len` only range over `0..=len`, the upper clamp bound should be `len as i32`, not `len as i32 + 1` - as written, a stale/out-of-range value reported by the IME can be clamped to exactly `len + 1`, one past the end of the `text` that is returned in the same `TextInputState`. Any application code that trusts the documented invariant and slices `text[selection.start..selection.end]` can then panic on an out-of-bounds index. Separately, in the same function, `compose_region` is not clamped to `len` at all (only checked for being negative), so an out-of-range `composingRegion` from Java is passed straight through unclamped, which is a strictly larger version of the same problem.","fix":"Clamp to `len`, not `len + 1`, and apply the same clamping to `compose_region`:\n```rust\nlet selection_start = (*state).selection.start.clamp(0, len as i32);\nlet selection_end = (*state).selection.end.clamp(0, len as i32);\n...\n} else {\n    (*out_ptr).compose_region = Some(TextSpan {\n        start: ((*state).composingRegion.start.clamp(0, len as i32)) as usize,\n        end: ((*state).composingRegion.end.clamp(0, len as i32)) as usize,\n    });\n}\n```","locations":[{"ref":"android-activity/src/game_activity/mod.rs:709-742","code":"  709 |     unsafe extern \"C\" fn map_input_state_to_text_event_callback(\n  710 |         context: *mut c_void,\n  711 |         state: *const ffi::GameTextInputState,\n  712 |     ) {\n  713 |         // Java uses a modified UTF-8 format, which is a modified cesu8 format\n  714 |         let out_ptr: *mut TextInputState = context.cast();\n  715 |         let text_modified_utf8: *const u8 = (*state).text_UTF8.cast();\n  716 |         let text_modified_utf8 =\n  717 |             std::slice::from_raw_parts(text_modified_utf8, (*state).text_length as usize);\n  718 |         match simd_cesu8::mutf8::decode(text_modified_utf8) {\n  719 |             Ok(str) => {\n  720 |                 let len = str.len();\n  721 |                 (*out_ptr).text = String::from(str);\n  722 | \n  723 |                 let selection_start = (*state).selection.start.clamp(0, len as i32 + 1);\n  724 |                 let selection_end = (*state).selection.end.clamp(0, len as i32 + 1);\n  725 |                 (*out_ptr).selection = TextSpan {\n  726 |                     start: selection_start as usize,\n  727 |                     end: selection_end as usize,\n  728 |                 };\n  729 |                 if (*state).composingRegion.start < 0 || (*state).composingRegion.end < 0 {\n  730 |                     (*out_ptr).compose_region = None;\n  731 |                 } else {\n  732 |                     (*out_ptr).compose_region = Some(TextSpan {\n  733 |                         start: (*state).composingRegion.start as usize,\n  734 |                         end: (*state).composingRegion.end as usize,\n  735 |                     });\n  736 |                 }\n  737 |             }\n  738 |             Err(err) => {\n  739 |                 log::error!(\"Invalid UTF8 text in TextEvent: {}\", err);\n  740 |             }\n  741 |         }\n  742 |     }","lines":34,"link":"https://github.com/rust-mobile/android-activity/blob/b4ddf059b77be12cdb955d394e65a92e7568d936/android-activity/src/game_activity/mod.rs#L709-L742"}]},{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"medium","description":"`KeyEvent::action_button()` in `android-activity/src/game_activity/input.rs` is defined as:\n```rust\npub fn action_button(&self) -> KeyAction {\n    let action = self.ga_event.action as u32;\n    action.into()\n}\n```\nThis is byte-for-byte identical to `KeyEvent::action()` a few lines above (same field, same cast, same return type `KeyAction`), so calling it can never yield anything different from `action()`. This looks like a copy-paste of `MotionEvent::action_button()` (which legitimately reads `self.ga_event.actionButton` and returns a `Button`), but `GameActivityKeyEvent` (see the bindgen struct in `game_activity/ffi_aarch64.rs`) has no `actionButton` field at all - key events don't have an \"action button\" concept. Confirming this is backend-specific: the `native_activity` backend (`android-activity/src/native_activity/input.rs`) only implements `action_button()` on `MotionEvent`, never on `KeyEvent`. So this is a public API method on `game_activity::input::KeyEvent` that is dead weight at best and actively misleading at worst (a caller might reasonably expect it to expose distinct information, as it does for `MotionEvent`).","fix":"Remove the bogus `action_button()` method from `KeyEvent` (there is no underlying `GameActivityKeyEvent` field to back it, and the `native_activity` backend correctly has no equivalent), keeping only `action()`:\n```rust\n#[inline]\npub fn action(&self) -> KeyAction {\n    let action = self.ga_event.action as u32;\n    action.into()\n}\n\n// action_button() removed - not applicable to KeyEvent, was a copy/paste of MotionEvent::action_button()\n```\nThis is a semver-breaking removal, so if strict API compatibility must be preserved consider deprecating it first with a doc comment explaining it is a no-op alias for `action()` and should not be used.","locations":[{"ref":"android-activity/src/game_activity/input.rs:463-472","code":"  463 |     pub fn action(&self) -> KeyAction {\n  464 |         let action = self.ga_event.action as u32;\n  465 |         action.into()\n  466 |     }\n  467 | \n  468 |     #[inline]\n  469 |     pub fn action_button(&self) -> KeyAction {\n  470 |         let action = self.ga_event.action as u32;\n  471 |         action.into()\n  472 |     }","lines":10,"link":"https://github.com/rust-mobile/android-activity/blob/b4ddf059b77be12cdb955d394e65a92e7568d936/android-activity/src/game_activity/input.rs#L463-L472"}]},{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`device_key_character_map_with_env` in `android-activity/src/input/sdk.rs` returns `Err(jni::errors::Error::WrongObjectType)` when `AInputDevice::get_device` returns a null device for an invalid/non-physical `device_id`, with a comment admitting \"This isn't really an error from a JNI perspective...\". `WrongObjectType` is meant to signal a JNI type-cast mismatch, not \"no such input device\" - repurposing it here means any caller (or future maintainer) inspecting the error variant to decide how to react will be misled about the actual failure cause, and it's inconsistent with the crate's own more descriptive internal error variants (e.g. `InternalAppError::JniBadArgument`, already used a few lines below for the `device_id == 0` case in `device_key_character_map`).","fix":"Use a descriptive internal error instead of repurposing an unrelated JNI error variant, mirroring the existing `JniBadArgument` handling used just below for `device_id == 0`:\n```rust\nif device.is_null() {\n    log::error!(\"No input device with id {}\", device_id);\n    return Err(InternalAppError::JniBadArgument(format!(\n        \"No input device with id {device_id}\"\n    )));\n}\n```\n(this requires changing the function's return type from `jni::errors::Result<KeyCharacterMap>` to `InternalResult<KeyCharacterMap>`, adjusting the `?` conversions at the call site accordingly).","locations":[{"ref":"android-activity/src/input/sdk.rs:245-260","code":"  245 | fn device_key_character_map_with_env(\n  246 |     env: &mut jni::Env<'_>,\n  247 |     device_id: i32,\n  248 | ) -> jni::errors::Result<KeyCharacterMap> {\n  249 |     let device = AInputDevice::get_device(env, device_id)?;\n  250 |     if device.is_null() {\n  251 |         // This isn't really an error from a JNI perspective but we would only expect\n  252 |         // this to return null for a device ID of zero or an invalid device ID.\n  253 |         log::error!(\"No input device with id {}\", device_id);\n  254 |         return Err(jni::errors::Error::WrongObjectType);\n  255 |     }\n  256 |     let character_map = device.get_key_character_map(env)?;\n  257 |     let character_map = env.new_global_ref(character_map)?;\n  258 |     let jvm = JavaVM::singleton().expect(\"Failed to get singleton JavaVM\");\n  259 |     Ok(KeyCharacterMap::new(jvm, character_map))\n  260 | }","lines":16,"link":"https://github.com/rust-mobile/android-activity/blob/b4ddf059b77be12cdb955d394e65a92e7568d936/android-activity/src/input/sdk.rs#L245-L260"}]},{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `AndroidApp::new` (`android-activity/src/native_activity/mod.rs:108-123`), the return value of `ndk_sys::ALooper_addFd` is discarded. `ALooper_addFd` returns `-1` on error (e.g. invalid looper or `fd`), which would mean the command pipe is never actually registered with the Rust-thread looper, silently breaking all lifecycle/command delivery (`poll_events` would then only ever see `ALOOPER_POLL_TIMEOUT`/`WAKE`, never `LOOPER_ID_MAIN`) with no diagnostic at all.","fix":"```rust\nlet res = ndk_sys::ALooper_addFd(\n    guard.looper.ptr().as_ptr(),\n    main_fd,\n    LOOPER_ID_MAIN,\n    ndk_sys::ALOOPER_EVENT_INPUT as libc::c_int,\n    None,\n    ptr::null_mut(),\n);\nassert_ne!(res, -1, \"Failed to add NativeActivity command fd to the Rust main thread looper\");\n```","locations":[{"ref":"android-activity/src/native_activity/mod.rs:108-123","code":"  108 |             {\n  109 |                 let guard = app.inner.write().unwrap();\n  110 | \n  111 |                 let main_fd = guard.native_activity.cmd_read_fd();\n  112 |                 unsafe {\n  113 |                     ndk_sys::ALooper_addFd(\n  114 |                         guard.looper.ptr().as_ptr(),\n  115 |                         main_fd,\n  116 |                         LOOPER_ID_MAIN,\n  117 |                         ndk_sys::ALOOPER_EVENT_INPUT as libc::c_int,\n  118 |                         None,\n  119 |                         //&mut guard.cmd_poll_source as *mut _ as *mut _);\n  120 |                         ptr::null_mut(),\n  121 |                     );\n  122 |                 }\n  123 |             }","lines":16,"link":"https://github.com/rust-mobile/android-activity/blob/b4ddf059b77be12cdb955d394e65a92e7568d936/android-activity/src/native_activity/mod.rs#L108-L123"}]},{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`init_java_main_thread_on_create` in `android-activity/src/init.rs` unconditionally calls `forward_stdio_to_logcat()` every time it runs, which creates a brand new `pipe2`, redirects `STDOUT_FILENO`/`STDERR_FILENO` onto it via `dup2`, and spawns a new `\"stdio-to-logcat\"` thread. Per this crate's own documentation (see `lib.rs`), `android_on_create`/this init path can run multiple times over the life of the process, once per `Activity` re-creation (e.g. on configuration changes). Each re-creation therefore leaks a new redundant forwarder thread and briefly races the old one (writes made in between the old `dup2` calls and the new ones can end up interleaved across two different pipes), even though redirecting `stdout`/`stderr` only needs to happen once per process.","fix":"Guard the redirection so it only happens once per process, e.g.:\n```rust\nstatic LOGCAT_FORWARDER: std::sync::OnceLock<std::thread::JoinHandle<std::io::Result<()>>> = std::sync::OnceLock::new();\n...\npub(crate) unsafe fn init_java_main_thread_on_create(...) {\n    LOGCAT_FORWARDER.get_or_init(forward_stdio_to_logcat);\n    ...\n}\n```","locations":[{"ref":"android-activity/src/init.rs:20-63","code":"   20 | fn forward_stdio_to_logcat() -> std::thread::JoinHandle<std::io::Result<()>> {\n   21 |     // XXX: make this stdout/stderr redirection an optional / opt-in feature?...\n   22 | \n   23 |     let file = unsafe {\n   24 |         let mut logpipe: [RawFd; 2] = Default::default();\n   25 |         libc::pipe2(logpipe.as_mut_ptr(), libc::O_CLOEXEC);\n   26 |         libc::dup2(logpipe[1], libc::STDOUT_FILENO);\n   27 |         libc::dup2(logpipe[1], libc::STDERR_FILENO);\n   28 |         libc::close(logpipe[1]);\n   29 | \n   30 |         File::from_raw_fd(logpipe[0])\n   31 |     };\n   32 | \n   33 |     std::thread::Builder::new()\n   34 |         .name(\"stdio-to-logcat\".to_string())\n   35 |         .spawn(move || -> std::io::Result<()> {\n   36 |             let tag = c\"RustStdoutStderr\";\n   37 |             let mut reader = BufReader::new(file);\n   38 |             let mut buffer = String::new();\n   39 |             loop {\n   40 |                 buffer.clear();\n   41 |                 let len = match reader.read_line(&mut buffer) {\n   42 |                     Ok(len) => len,\n   43 |                     Err(e) => {\n   44 |                         android_log(\n   45 |                             Level::Error,\n   46 |                             ANDROID_ACTIVITY_TAG,\n   47 |                             &CString::new(format!(\n   48 |                                 \"Logcat forwarder failed to read stdin/stderr: {e:?}\"\n   49 |                             ))\n   50 |                             .unwrap(),\n   51 |                         );\n   52 |                         break Err(e);\n   53 |                     }\n   54 |                 };\n   55 |                 if len == 0 {\n   56 |                     break Ok(());\n   57 |                 } else if let Ok(msg) = CString::new(buffer.clone()) {\n   58 |                     android_log(Level::Info, tag, &msg);\n   59 |                 }\n   60 |             }\n   61 |         })\n   62 |         .expect(\"Failed to start stdout/stderr to logcat forwarder thread\")\n   63 | }","lines":44,"link":"https://github.com/rust-mobile/android-activity/blob/b4ddf059b77be12cdb955d394e65a92e7568d936/android-activity/src/init.rs#L20-L63"},{"ref":"android-activity/src/init.rs:169-209","code":"  169 | pub(crate) unsafe fn init_java_main_thread_on_create(\n  170 |     jvm: JavaVM,\n  171 |     jni_activity: *mut c_void,\n  172 |     saved_state: &[u8],\n  173 | ) {\n  174 |     let _join_log_forwarder = forward_stdio_to_logcat();\n  175 | \n  176 |     let msg = CString::new(format!(\n  177 |         \"Creating: Activity = {:p}, saved state size = {}\",\n  178 |         jni_activity,\n  179 |         saved_state.len()\n  180 |     ))\n  181 |     .unwrap();\n  182 |     android_log(Level::Info, ANDROID_ACTIVITY_TAG, &msg);\n  183 | \n  184 |     // SAFETY: It's the application's responsibility to declare any `android_on_create`\n  185 |     // function with the correct signature and ABI.\n  186 |     let android_on_create: extern \"Rust\" fn(state: &OnCreateState) = unsafe {\n  187 |         let Some(symbol) = lookup_self_symbol(c\"android_on_create\") else {\n  188 |             // android_on_create is optional, so simply return if not found\n  189 |             return;\n  190 |         };\n  191 |         std::mem::transmute(symbol)\n  192 |     };\n  193 | \n  194 |     let state = OnCreateState::new(jvm.clone(), jni_activity, saved_state);\n  195 |     // Catch any exceptions from the callback and log them instead of allowing any\n  196 |     // exception to propagate back to the Activity.\n  197 |     let res = jvm.attach_current_thread(|_env| -> jni::errors::Result<()> {\n  198 |         android_on_create(&state);\n  199 |         Ok(())\n  200 |     });\n  201 |     if let Err(err) = res {\n  202 |         let msg = CString::new(format!(\n  203 |             \"JNI error while running android_on_create: {:?}\",\n  204 |             err\n  205 |         ))\n  206 |         .unwrap();\n  207 |         android_log(Level::Error, ANDROID_ACTIVITY_TAG, &msg);\n  208 |     }\n  209 | }","lines":41,"link":"https://github.com/rust-mobile/android-activity/blob/b4ddf059b77be12cdb955d394e65a92e7568d936/android-activity/src/init.rs#L169-L209"}]},{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`MainCallbacks::_detach_callbacks_event_fd_from_java_main_looper` in `android-activity/src/main_callbacks.rs` is never called anywhere in the crate (confirmed via a project-wide search for both the method name and the `_pending_detach` field it sets - the only other reference is the read of `_pending_detach` inside `run_java_main_callbacks`, which will therefore also never observe `true` in practice). It additionally takes `&mut self` on `MainCallbacks`, a `Clone`-able, `Arc`-backed handle that is always shared by value throughout the codebase (e.g. `main_callbacks.clone()` in `init.rs`), so obtaining the required unique/mutable borrow to call it would not even be possible given how the type is used elsewhere. The intended \"asynchronous detach on shutdown\" functionality this method exists to support is effectively unreachable dead code.","fix":"Either wire this into an actual shutdown path (e.g. call it when the last `AndroidApp`/`MainCallbacks` for a destroyed `Activity` is dropped), or remove the unused method, the `_pending_detach` field, and the dead-detach branch in `run_java_main_callbacks` if the \"leak on process exit\" behavior documented just above it is considered acceptable long-term and no caller is ever expected to invoke it.","locations":[{"ref":"android-activity/src/main_callbacks.rs:148-152","code":"  148 |     pub fn _detach_callbacks_event_fd_from_java_main_looper(&mut self) {\n  149 |         self._pending_detach\n  150 |             .store(true, std::sync::atomic::Ordering::SeqCst);\n  151 |         self.wake_java_main_for_callbacks();\n  152 |     }","lines":5,"link":"https://github.com/rust-mobile/android-activity/blob/b4ddf059b77be12cdb955d394e65a92e7568d936/android-activity/src/main_callbacks.rs#L148-L152"}]},{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`Drop for MainCallbacksState` in `android-activity/src/main_callbacks.rs` logs the same message twice through two different channels: `eprintln!(\"Dropping MainCallbacksState\");` followed immediately by `log::warn!(\"Dropping MainCallbacksState\");`. The `eprintln!` looks like leftover ad-hoc debug output that was never cleaned up once the proper `log::warn!` call was added (writing directly to stderr bypasses the app ecomes a one-line call into `dispatch_activity_callback`, eliminating the possibility of a future callback forgetting the panic guard.","locations":[{"ref":"android-activity/src/native_activity/glue.rs:689-872","code":"  689 | unsafe extern \"C\" fn on_destroy(activity: *mut ndk_sys::ANativeActivity) {\n  690 |     abort_on_panic(|| {\n  691 |         log::debug!(\"Destroy: {:p}\\n\", activity);\n  692 |         try_with_waitable_activity_ref(activity, |waitable_activity| {\n  693 |             waitable_activity.notify_destroyed()\n  694 |         });\n  695 | \n  696 |         // Once we return from here the `ANativeActivity` will be deleted via an\n  697 |         // `unloadNativeCode` native method and so we can't get any more\n  698 |         // callbacks and we can release the `Weak<WaitableNativeActivityState>`\n  699 |         // reference we have associated with `activity->instance`\n  700 | \n  701 |         assert!(!(*activity).instance.is_null());\n  702 |         let weak_ptr: *const WaitableNativeActivityState = (*activity).instance.cast();\n  703 |         let _drop_weak_ref = Weak::from_raw(weak_ptr);\n  704 |         (*activity).instance = std::ptr::null_mut();\n  705 |     })\n  706 | }\n  707 | \n  708 | unsafe extern \"C\" fn on_start(activity: *mut ndk_sys::ANativeActivity) {\n  709 |     abort_on_panic(|| {\n  710 |         log::debug!(\"Start: {:p}\\n\", activity);\n  711 |         try_with_waitable_activity_ref(activity, |waitable_activity| {\n  712 |             waitable_activity.set_activity_state(State::Start);\n  713 |         });\n  714 |     })\n  715 | }\n  716 | \n  717 | unsafe extern \"C\" fn on_resume(activity: *mut ndk_sys::ANativeActivity) {\n  718 |     abort_on_panic(|| {\n  719 |         log::debug!(\"Resume: {:p}\\n\", activity);\n  720 |         try_with_waitable_activity_ref(activity, |waitable_activity| {\n  721 |             waitable_activity.set_activity_state(State::Resume);\n  722 |         });\n  723 |     })\n  724 | rn \"C\" fn on_content_rect_changed(\n  865 |     activity: *mut ndk_sys::ANativeActivity,\n  866 |     rect: *const ndk_sys::ARect,\n  867 | ) {\n  868 |     log::debug!(\"ContentRectChanged: {:p} -- {:p}\\n\", activity, rect);\n  869 |     try_with_waitable_activity_ref(activity, |waitable_activity| {\n  870 |         waitable_activity.set_content_rect(rect)\n  871 |     });\n  872 | }","lines":184,"link":"https://github.com/rust-mobile/android-activity/blob/b4ddf059b77be12cdb955d394e65a92e7568d936/android-activity/src/native_activity/glue.rs#L689-L872"}]},{"id":"OTHER_1","type":"other","type_label":"Other","severity":"high","difficulty":"very_easy","description":"`android-activity/src/config.rs` imports a specific list of types from `ndk::configuration` at the top of the file (`Configuration, Keyboard, KeysHidden, LayoutDir, NavHidden, Navigation, Orientation, ScreenLong, ScreenSize, Touchscreen, UiModeNight, UiModeType`), but `ScreenRound` is not among them. `ConfigurationRef::screen_round()` (gated behind `#[cfg(feature = \"api-level-30\")]`) references the bare name `ScreenRound` as its return type. `ndk::configuration::ScreenRound` does exist (confirmed in the `ndk` 0.9.0 source this crate depends on), so this is simply a missing `use` import, meaning the crate fails to compile as soon as anyone enables the `api-level-30` feature (which is a real, documented Cargo feature in `android-activity/Cargo.toml`).","fix":"Add `ScreenRound` to the existing `use` block:\n```rust\nuse ndk::configuration::{\n    Configuration, Keyboard, KeysHidden, LayoutDir, NavHidden, Navigation, Orientation, ScreenLong,\n    ScreenRound, ScreenSize, Touchscreen, UiModeNight, UiModeType,\n};\n```","locations":[{"ref":"android-activity/src/config.rs:1-7","code":"    1 | use core::fmt;\n    2 | use std::sync::{Arc, RwLock};\n    3 | \n    4 | use ndk::configuration::{\n    5 |     Configuration, Keyboard, KeysHidden, LayoutDir, NavHidden, Navigation, Orientation, ScreenLong,\n    6 |     ScreenSize, Touchscreen, UiModeNight, UiModeType,\n    7 | };","lines":7,"link":"https://github.com/rust-mobile/android-activity/blob/b4ddf059b77be12cdb955d394e65a92e7568d936/android-activity/src/config.rs#L1-L7"},{"ref":"android-activity/src/config.rs:122-125","code":"  122 |     #[cfg(feature = \"api-level-30\")]\n  123 |     pub fn screen_round(&self) -> ScreenRound {\n  124 |         self.config.read().unwrap().screen_round()\n  125 |     }","lines":4,"link":"https://github.com/rust-mobile/android-activity/blob/b4ddf059b77be12cdb955d394e65a92e7568d936/android-activity/src/config.rs#L122-L125"}]},{"id":"OTHER_2","type":"other","type_label":"Other","severity":"high","difficulty":"easy","description":"`KeyCharacterMap::get()` and `KeyCharacterMap::get_dead_char()` in `android-activity/src/input/sdk.rs` convert `jint` values that come back from a JNI call into `android.view.KeyCharacterMap.get()` / the native dead-char lookup into a Rust `char` using `char::from_u32_unchecked`, guarded only by a comment: \"Safety: assumes Android key maps don't contain invalid unicode characters\". `char::from_u32_unchecked` is documented UB if the value is not a valid Unicode scalar value (i.e. a surrogate code point in `0xD800..=0xDFFF`, or `> 0x10FFFF`). The input comes from a JNI call into framework code that is influenced by device/vendor key character map (`.kcm`) files, which can be supplied by third-party/vendor keyboard layouts or attached USB/Bluetooth input devices - this is not data the crate itself controls or has validated. A malformed or malicious key map returning an out-of-range code point turns into instant undefined behavior (an invalid `char` value) rather than a recoverable error.","fix":"Use the checked `char::from_u32` and handle the `None` case gracefully instead of assuming validity:\n```rust\nlet accent = unicode & COMBINING_ACCENT_MASK;\nmatch char::from_u32(accent) {\n    Some(c) => Ok(KeyMapChar::CombiningAccent(c)),\n    None => {\n        log::error!(\"KeyCharacterMap returned invalid unicode combining accent: {accent:#x}\");\n        Ok(KeyMapChar::None)\n    }\n}\n```\nApply the same pattern to the plain `Unicode(...)` branch in `get()` and to `get_dead_char()`.","locations":[{"ref":"android-activity/src/input/sdk.rs:160-181","code":"  160 |         vm.attach_current_thread(|env| -> InternalResult<_> {\n  161 |             let unicode = self.key_map.get(env, key_code, meta_state)?;\n  162 |             let unicode = unicode as u32;\n  163 | \n  164 |             const COMBINING_ACCENT: u32 = 0x80000000;\n  165 |             const COMBINING_ACCENT_MASK: u32 = !COMBINING_ACCENT;\n  166 | \n  167 |             if unicode == 0 {\n  168 |                 Ok(KeyMapChar::None)\n  169 |             } else if unicode & COMBINING_ACCENT == COMBINING_ACCENT {\n  170 |                 let accent = unicode & COMBINING_ACCENT_MASK;\n  171 |                 // Safety: assumes Android key maps don't contain invalid unicode characters\n  172 |                 Ok(KeyMapChar::CombiningAccent(unsafe {\n  173 |                     char::from_u32_unchecked(accent)\n  174 |                 }))\n  175 |             } else {\n  176 |                 // Safety: assumes Android key maps don't contain invalid unicode characters\n  177 |                 Ok(KeyMapChar::Unicode(unsafe {\n  178 |                     char::from_u32_unchecked(unicode)\n  179 |                 }))\n  180 |             }\n  181 |         })","lines":22,"link":"https://github.com/rust-mobile/android-activity/blob/b4ddf059b77be12cdb955d394e65a92e7568d936/android-activity/src/input/sdk.rs#L160-L181"},{"ref":"android-activity/src/input/sdk.rs:204-215","code":"  204 |         let vm = self.jvm.clone();\n  205 |         vm.attach_current_thread(|env| -> InternalResult<_> {\n  206 |             let unicode = AKeyCharacterMap::get_dead_char(env, accent_char, base_char)?;\n  207 |             let unicode = unicode as u32;\n  208 | \n  209 |             // Safety: assumes _ref(activity, |waitable_activity| {\n            waitable_activity.notify_window_resized(window);\n        });\n    })\n}\n```\nApply the same pattern to `on_native_window_redraw_needed` and `on_content_rect_changed`.","locations":[{"ref":"android-activity/src/native_activity/glue.rs:808-816","code":"  808 | unsafe extern \"C\" fn on_native_window_resized(\n  809 |     activity: *mut ndk_sys::ANativeActivity,\n  810 |     window: *mut ndk_sys::ANativeWindow,\n  811 | ) {\n  812 |     log::debug!(\"NativeWindowResized: {:p} -- {:p}\\n\", activity, window);\n  813 |     try_with_waitable_activity_ref(activity, |waitable_activity| {\n  814 |         waitable_activity.notify_window_resized(window);\n  815 |     });\n  816 | }","lines":9,"link":"https://github.com/rust-mobile/android-activity/blob/b4ddf059b77be12cdb955d394e65a92e7568d936/android-activity/src/native_activity/glue.rs#L808-L816"},{"ref":"android-activity/src/native_activity/glue.rs:818-826","code":"  818 | unsafe extern \"C\" fn on_native_window_redraw_needed(\n  819 |     activity: *mut ndk_sys::ANativeActivity,\n  820 |     window: *mut ndk_sys::ANativeWindow,\n  821 | ) {\n  822 |     log::debug!(\"NativeWindowRedrawNeeded: {:p} -- {:p}\\n\", activity, window);\n  823 |     try_with_waitable_activity_ref(activity, |waitable_activity| {\n  824 |         waitable_activity.notify_window_redraw_needed(window)\n  825 |     });\n  826 | }","lines":9,"link":"https://github.com/rust-mobile/android-activity/blob/b4ddf059b77be12cdb955d394e65a92e7568d936/android-activity/src/native_activity/glue.rs#L818-L826"},{"ref":"android-activity/src/native_activity/glue.rs:864-872","code":"  864 | unsafe extern \"C\" fn on_content_rect_changed(\n  865 |     activity: *mut ndk_sys::ANativeActivity,\n  866 |     rect: *const ndk_sys::ARect,\n  867 | ) {\n  868 |     log::debug!(\"ContentRectChanged: {:p} -- {:p}\\n\", activity, rect);\n  869 |     try_with_waitable_activity_ref(activity, |waitable_activity| {\n  870 |         waitable_activity.set_content_rect(rect)\n  871 |     });\n  872 | }","lines":9,"link":"https://github.com/rust-mobile/android-activity/blob/b4ddf059b77be12cdb955d394e65a92e7568d936/android-activity/src/native_activity/glue.rs#L864-L872"}]},{"id":"OTHER_4","type":"other","type_label":"Other","severity":"medium","difficulty":"hard","description":"`GameActivityGlue::text_input_state` in `android-activity/src/game_activity/mod.rs` reads and clears the `(*app_ptr).textInputState` flag with plain (non-atomic) field accesses, and the code's own comment acknowledges this: \"The GameActivity implementation should be using atomic ops to set this flag... We currently just hope that with the lack of atomic ops that the compiler isn't reordering code so this gets flagged before the java main thread really updates the state,\" and separately notes that `GameActivity_getTextInputState`'s underlying `GameTextInput` library \"appears to have no lock to guard access from multiple threads\" and is likely not thread-safe (linking a tracked upstream issue). This is a genuine, currently-unmitigated data race between the Java main thread (which updates `textInputState`/the underlying `GameTextInput` state) and the `android_main` thread (which reads/clears it here), which can manifest as stale, torn, or missed text-input updates. It is already documented in-code but is not actually fixed or guarded against from the Rust side.","fix":"As a partial, crate-side mitigation, treat `textInputState` as an atomic from the Rust side (it is a plain `i32` field in the C struct, so its address can be reinterpreted as `&AtomicI32` for the read-and-clear here) to at least prevent compiler-level reordering/tearing on the Rust side:\n```rust\nuse std::sync::atomic::{AtomicI32, Ordering};\nlet flag = &*((&mut (*app_ptr).textInputState) as *mut i32 as *mut AtomicI32);\nif flag.swap(0, Ordering::AcqRel) == 0 {\n    return None;\n}\n```\nA full fix still requires the upstream GameActivity/GameTextInput native library to use atomics/locking on its side (tracked at https://issuetracker.google.com/issues/294112477), so this should also be called out prominently in this crate's own docs as a known caveat for `text_input_state()`/`take_text_input_state()` callers.","locations":[{"ref":"android-activity/src/game_activity/mod.rs:239-297","code":"  239 |     pub fn text_input_state(&self, take: bool) -> Option<TextInputState> {\n  240 |         self.with_locked_app(|app_ptr| {\n  241 |             if app_ptr.is_null() {\n  242 |                 log::error!(\"Attempted to get text input state after GameActivity was destroyed\");\n  243 |                 return if take {\n  244 |                     None\n  245 |                 } else {\n  246 |                     Some(TextInputState::default())\n  247 |                 };\n  248 |             }\n  249 |             unsafe {\n  250 |                 if take {\n  251 |                     // XXX: The GameActivity implementation should be using\n  252 |                     // atomic ops to set this flag, and require us to use\n  253 |                     // atomics to check and clear it too.\n  254 |                     //\n  255 |                     // We currently just hope that with the lack of atomic ops that\n  256 |                     // the compiler isn't reordering code so this gets flagged\n  257 |                     // before the java main thread really updates the state.\n  258 |                     if (*app_ptr).textInputState == 0 {\n  259 |                         return None;\n  260 |                     }\n  261 |                     (*app_ptr).textInputState = 0;\n  262 |                 }\n  263 |                 let activity = (*app_ptr).activity;\n  264 |                 let mut out_state = TextInputState {\n  265 |                     text: String::new(),\n  266 |                     selection: TextSpan { start: 0, end: 0 },\n  267 |                     compose_region: None,\n  268 |                 };\n  269 |                 let out_ptr = &mut out_state as *mut TextInputState;\n  270 | \n  271 |                 // NEON WARNING:\n  272 |                 //\n  273 |                 // It's not clearly documented but the GameActivity API over the\n  274 |                 // GameTextInput library directly exposes _modified_ UTF8 text\n  275 |                 // from Java so we need to be careful to convert text to and\n  276 |                 // from UTF8\n  277 |                 //\n  278 |                 // GameTextInput also uses a pre-allocated, fixed-sized buffer for\n  279 |                 // the current text state and has shared `currentState_` that\n  280 |                 // appears to have no lock to guard access from multiple threads.\n  281 |                 //\n  282 |                 // There's also no locking at the GameActivity level, so I'm fairly\n  283 |                 // certain that `GameActivity_getTextInputState` isn't thread\n  284 |                 // safe: https://issuetracker.google.com/issues/294112477\n  285 |                 //\n  286 |                 // Overall this is all quite gnarly - and probably a good reminder\n  287 |                 // of why we want to use Rust instead of C/C++.\n  288 |                 ffi::GameActivity_getTextInputState(\n  289 |                     activity,\n  290 |                     Some(AndroidAppInner::map_input_state_to_text_event_callback),\n  291 |                     out_ptr.cast(),\n  292 |                 );\n  293 | \n  294 |                 Some(out_state)\n  295 |             }\n  296 |         })\n  297 |     }","lines":59,"link":"https://github.com/rust-mobile/android-activity/blob/b4ddf059b77be12cdb955d394e65a92e7568d936/android-activity/src/game_activity/mod.rs#L239-L297"}]},{"id":"OTHER_5","type":"other","type_label":"Other","severity":"medium","difficulty":"very_easy","description":"`WaitableNativeActivityState::set_content_rect` (`glue.rs:505-509`) dereferences the `rect` pointer (`guard.content_rect = *rect;`) with no null check, and its only caller, `on_content_rect_changed` (`glue.rs:864-872`), passes through whatever `rect` the JVM/NDK supplies without checking either. Every other pointer coming from a native callback in this file that gets dereferenced (e.g. `activity`) is at least implicitly assumed valid by the platform contract, but adding a defensive null check is cheap and avoids a guaranteed crash (UB, not even a catchable panic) if that assumption is ever violated.","fix":"```rust\nunsafe fn set_content_rect(&self, rect: *const ndk_sys::ARect) {\n    if rect.is_null() {\n        log::error!(\"Ignoring NativeActivity ContentRectChanged callback with null rect\");\n        return;\n    }\n    let mut guard = self.mutex.lock().unwrap();\n    guard.content_rect = *rect;\n    guard.write_cmd(AppCmd::ContentRectChanged);\n}\n```","locations":[{"ref":"android-activity/src/native_activity/glue.rs:505-509","code":"  505 |     unsafe fn set_content_rect(&self, rect: *const ndk_sys::ARect) {\n  506 |         let mut guard = self.mutex.lock().unwrap();\n  507 |         guard.content_rect = *rect;\n  508 |         guard.write_cmd(AppCmd::ContentRectChanged);\n  509 |     }","lines":5,"link":"https://github.com/rust-mobile/android-activity/blob/b4ddf059b77be12cdb955d394e65a92e7568d936/android-activity/src/native_activity/glue.rs#L505-L509"}]},{"id":"OTHER_6","type":"other","type_label":"Other","severity":"medium","difficulty":"easy","description":"`on_native_window_created` (`glue.rs:793-806`) calls `NonNull::new_unchecked(window)` on the `window` pointer supplied by the JVM callback without first checking it for null. `NonNull::new_unchecked` is UB if the pointer is null, so if Android were ever to invoke `onNativeWindowCreated` with a null window (contract violation, driver bug, or a future Android change), this would be undefined behaviour rather than a clean, loggable error.","fix":"```rust\nunsafe extern \"C\" fn on_native_window_created(\n    activity: *mut ndk_sys::ANativeActivity,\n    window: *mut ndk_sys::ANativeWindow,\n) {\n    abort_on_panic(|| {\n        log::debug!(\"NativeWindowCreated: {:p} -- {:p}\\n\", activity, window);\n        let Some(window_ptr) = NonNull::new(window) else {\n            log::error!(\"Ignoring NativeWindowCreated callback with null window\");\n            return;\n        };\n        try_with_waitable_activity_ref(activity, |waitable_activity| {\n            let window = NativeWindow::clone_from_ptr(window_ptr);\n            waitable_activity.set_window(Some(window));\n        });\n    })\n}\n```","locations":[{"ref":"android-activity/src/native_activity/glue.rs:793-806","code":"  793 | unsafe extern \"C\" fn on_native_window_created(\n  794 |     activity: *mut ndk_sys::ANativeActivity,\n  795 |     window: *mut ndk_sys::ANativeWindow,\n  796 | ) {\n  797 |     abort_on_panic(|| {\n  798 |         log::debug!(\"NativeWindowCreated: {:p} -- {:p}\\n\", activity, window);\n  799 |         try_with_waitable_activity_ref(activity, |waitable_activity| {\n  800 |             // Use clone_from_ptr to acquire additional ownership on the NativeWindow,\n  801 |             // which will unconditionally be _release()'d on Drop.\n  802 |             let window = NativeWindow::clone_from_ptr(NonNull::new_unchecked(window));\n  803 |             waitable_activity.set_window(Some(window));\n  804 |         });\n  805 |     })\n  806 | }","lines":14,"link":"https://github.com/rust-mobile/android-activity/blob/b4ddf059b77be12cdb955d394e65a92e7568d936/android-activity/src/native_activity/glue.rs#L793-L806"}]},{"id":"OTHER_7","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"Both places that build a `Configuration` from `ndk_sys::AConfiguration_new()` call `NonNull::new_unchecked(config)` without checking whether the allocation returned null (out-of-memory), which is UB rather than a clean error/panic if it ever happens.","fix":"```rust\nlet config
