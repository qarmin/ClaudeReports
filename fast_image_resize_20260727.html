<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}

#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}

.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}

<script type="application/json" id="D">[{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`Normalizer16::new` and `Normalizer32::new` in `src/convolution/optimisations.rs` compute the maximum filter weight with `coefficients.values.iter().max_by(|&x, &y| x.partial_cmp(y).unwrap())`. `f64::partial_cmp` returns `None` when either operand is `NaN`, so `unwrap()` panics. Filter weights ultimately come from the `filter` function passed to `precompute_coefficients` (`src/convolution/mod.rs`), which for `FilterType::Custom` is an arbitrary user-supplied `fn(f64) -> f64` (see the public API `Filter::new` in `src/convolution/filters.rs`). A custom filter that produces `NaN` for any sample point (e.g. an unguarded division that hits `0.0/0.0` at the kernel center) will make the whole resize call panic deep inside coefficient normalization instead of returning a `Result`-style error, even though `Filter::new` only validates the `support` argument and never validates the function's output range.","fix":"Use a NaN-tolerant reduction, e.g. replace:\n```rust\nlet max_weight = coefficients\n    .values\n    .iter()\n    .max_by(|&x, &y| x.partial_cmp(y).unwrap())\n    .unwrap_or(&0.0)\n    .to_owned();\n```\nwith:\n```rust\nlet max_weight = coefficients\n    .values\n    .iter()\n    .copied()\n    .fold(0.0_f64, |acc, v| if v.is_finite() && v > acc { v } else { acc });\n```\nThis treats a `NaN`/non-finite weight the same as `0.0` instead of panicking, so a broken custom `FilterType::Custom` function degrades gracefully rather than crashing the whole resize call.","locations":[{"ref":"src/convolution/optimisations.rs:52-58","code":"   52 |     pub fn new(coefficients: Coefficients) -> Self {\n   53 |         let max_weight = coefficients\n   54 |             .values\n   55 |             .iter()\n   56 |             .max_by(|&x, &y| x.partial_cmp(y).unwrap())\n   57 |             .unwrap_or(&0.0)\n   58 |             .to_owned();","lines":7,"link":"https://github.com/Cykooz/fast_image_resize/blob/6dc1fe2750a3f41a047ee69ca6fa4517d752d017/src/convolution/optimisations.rs#L52-L58"},{"ref":"src/convolution/optimisations.rs:147-153","code":"  147 |     pub fn new(coefficients: Coefficients) -> Self {\n  148 |         let max_weight = coefficients\n  149 |             .values\n  150 |             .iter()\n  151 |             .max_by(|&x, &y| x.partial_cmp(y).unwrap())\n  152 |             .unwrap_or(&0.0)\n  153 |             .to_owned();","lines":7,"link":"https://github.com/Cykooz/fast_image_resize/blob/6dc1fe2750a3f41a047ee69ca6fa4517d752d017/src/convolution/optimisations.rs#L147-L153"}]},{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`TypedCroppedImage::iter_rows` and `TypedCroppedImageMut::iter_rows_mut` (generated by the `image_view_impl!` macro) compute `.take((self.height - start_row) as usize)` with a plain `u32` subtraction and no bounds check on the caller-supplied `start_row`. Both `ImageView`/`ImageViewMut` are public traits and `TypedCroppedImage`/`TypedCroppedImageMut` are public types, so any caller invoking `iter_rows(start_row)` with `start_row > self.height()` triggers an arithmetic-overflow panic in debug builds (and, in release, wraps to a huge `usize` passed to `.take(...)`). This is inconsistent with the base implementations (`TypedImageRef::iter_rows`, `TypedImage::iter_rows`), which handle an out-of-range `start_row` gracefully by using `self.pixels.get(start..).unwrap_or_default()` and simply yielding an empty iterator.","fix":"Clamp/guard the subtraction the same way the underlying views already do, e.g.:\n\n```rust\nfn iter_rows(&self, start_row: u32) -> impl Iterator<Item = &[Self::Pixel]> {\n    let left = self.left as usize;\n    let right = left + self.width as usize;\n    let remaining = self.height.saturating_sub(start_row) as usize;\n    self.image_view\n        .get_ref()\n        .iter_rows(self.top + start_row)\n        .take(remaining)\n        .map(move |row| unsafe { row.get_unchecked(left..right) })\n}\n```\n\nUse `saturating_sub` (or an explicit `if start_row >= self.height { return empty iterator }` guard) in both `iter_rows` and `iter_rows_mut`.","locations":[{"ref":"src/images/typed_cropped_image.rs:157-167","code":"  157 |             fn iter_rows(&self, start_row: u32) -> impl Iterator<Item = &[Self::Pixel]> {\n  158 |                 let left = self.left as usize;\n  159 |                 let right = left + self.width as usize;\n  160 |                 self.image_view\n  161 |                     .get_ref()\n  162 |                     .iter_rows(self.top + start_row)\n  163 |                     .take((self.height - start_row) as usize)\n  164 |                     // SAFETY: correct values of the left and the right\n  165 |                     // are guaranteed by new() method.\n  166 |                     .map(move |row| unsafe { row.get_unchecked(left..right) })\n  167 |             }","lines":11,"link":"https://github.com/Cykooz/fast_image_resize/blob/6dc1fe2750a3f41a047ee69ca6fa4517d752d017/src/images/typed_cropped_image.rs#L157-L167"},{"ref":"src/images/typed_cropped_image.rs:228-239","code":"  228 | unsafe impl<'a, V: ImageViewMut> ImageViewMut for TypedCroppedImageMut<'a, V> {\n  229 |     fn iter_rows_mut(&mut self, start_row: u32) -> impl Iterator<Item = &mut [Self::Pixel]> {\n  230 |         let left = self.left as usize;\n  231 |         let right = left + self.width as usize;\n  232 |         self.image_view\n  233 |             .get_mut()\n  234 |             .iter_rows_mut(self.top + start_row)\n  235 |             .take((self.height - start_row) as usize)\n  236 |             // SAFETY: correct values of the left and the right\n  237 |             // are guaranteed by new() method.\n  238 |             .map(move |row| unsafe { row.get_unchecked_mut(left..right) })\n  239 |     }","lines":12,"link":"https://github.com/Cykooz/fast_image_resize/blob/6dc1fe2750a3f41a047ee69ca6fa4517d752d017/src/images/typed_cropped_image.rs#L228-L239"}]},{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"In `split_v_two_images_for_threading`, `NonZeroU32::new(dst_width).unwrap()` panics if `dst_width` is `0`. The sibling function `split_h_two_images_for_threading` handles the analogous case safely with `NonZeroU32::new(dst_height)?`, propagating `None` instead of panicking. Currently the call sites in `convolution/optimisations.rs` appear to only invoke this after `dst_width > 0` has already been checked upstream (in `resizer.rs`'s `do_convolution`), so this is not known to be reachable today, but the inconsistency is a latent panic waiting for a future caller that doesn't uphold that invariant.","fix":"Make it consistent with the sibling function by propagating `None` instead of panicking:\n\n```rust\n// before\nlet dst_width = NonZeroU32::new(dst_width).unwrap();\n\n// after\nlet dst_width = NonZeroU32::new(dst_width)?;\n```","locations":[{"ref":"src/threading.rs:88","code":"   88 |         let dst_width = NonZeroU32::new(dst_width).unwrap();","lines":1,"link":"https://github.com/Cykooz/fast_image_resize/blob/6dc1fe2750a3f41a047ee69ca6fa4517d752d017/src/threading.rs#L88"}]},{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"Every image-buffer constructor computes the required buffer size as `width as usize * height as usize * pixel_type.size()` (or `width as usize * height as usize` alone for typed pixel containers) with plain, unchecked arithmetic. On a 32-bit target such as `wasm32` (explicitly supported by this crate, which ships dedicated `wasm32.rs` SIMD kernels), `usize` is 32 bits, so this multiplication overflows for images that are far from absurd: e.g. `width = height = 65536` already makes `width as usize * height as usize` wrap to `0` in `TypedImageRef::new`/`TypedImage::new`, and any image whose `width * height * pixel_size` exceeds `2^32` (e.g. a `16384x16384` `F32x4` image, `pixel_size = 16`) wraps in `Image::new`/`ImageRef::new`/`TypedImage::from_buffer`. Because the checks `buffer.len() < size` / `pixels.len() < pixels_count` compare against the wrapped (small) value, an undersized buffer/slice is accepted even though `width`/`height` metadata still claim the full (large) dimensions. Any later code that trusts `width`/`height` to index the buffer (e.g. `TypedImageRef::iter_rows`, which computes `start_row as usize * width`) can then read/write past the end of the undersized allocation. Even on 64-bit targets the same unchecked multiplication can overflow `u64` for sufficiently large (attacker-controlled) `u32::MAX`-scale dimensions.","fix":"Use checked/saturating arithmetic in every one of these constructors and return the existing `ImageBufferError::InvalidBufferSize` / `InvalidPixelsSize` error on overflow instead of silently wrapping, e.g.:\n\n```rust\n// before\nlet size = width as usize * height as usize * pixel_type.size();\nif buffer.len() < size {\n    return Err(ImageBufferError::InvalidBufferSize);\n}\n\n// after\nlet size = (width as usize)\n    .checked_mul(height as usize)\n    .and_then(|n| n.checked_mul(pixel_type.size()))\n    .ok_or(ImageBufferError::InvalidBufferSize)?;\nif buffer.len() < size {\n    return Err(ImageBufferError::InvalidBufferSize);\n}\n```\n\nApply the same `checked_mul`-based pattern to the plain `width as usize * height as usize` computations in `TypedImageRef::new`/`TypedImage::new`/`from_pixels`/`from_pixels_slice`, returning `InvalidPixelsSize` on overflow.","locations":[{"ref":"src/images/image.rs:26-26","code":"   26 |         let size = width as usize * height as usize * pixel_type.size();","lines":1,"link":"https://github.com/Cykooz/fast_image_resize/blob/6dc1fe2750a3f41a047ee69ca6fa4517d752d017/src/images/image.rs#L26"},{"ref":"src/images/image.rs:118-119","code":"  118 |     pub fn new(width: u32, height: u32, pixel_type: PixelType) -> Self {\n  119 |         let pixels_count = width as usize * height as usize;","lines":2,"link":"https://github.com/Cykooz/fast_image_resize/blob/6dc1fe2750a3f41a047ee69ca6fa4517d752d017/src/images/image.rs#L118-L119"},{"ref":"src/images/image.rs:136-136","code":"  136 |         let size = width as usize * height as usize * pixel_type.size();","lines":1,"link":"https://github.com/Cykooz/fast_image_resize/blob/6dc1fe2750a3f41a047ee69ca6fa4517d752d017/src/images/image.rs#L136"},{"ref":"src/images/image.rs:160-160","code":"  160 |         let size = width as usize * height as usize * pixel_type.size();","lines":1,"link":"https://github.com/Cykooz/fast_image_resize/blob/6dc1fe2750a3f41a047ee69ca6fa4517d752d017/src/images/image.rs#L160"},{"ref":"src/images/typed_image.rs:19-19","code":"   19 |         let pixels_count = width as usize * height as usize;","lines":1,"link":"https://github.com/Cykooz/fast_image_resize/blob/6dc1fe2750a3f41a047ee69ca6fa4517d752d017/src/images/typed_image.rs#L19"},{"ref":"src/images/typed_image.rs:134-134","code":"  134 |         let pixels_count = width as usize * height as usize;","lines":1,"link":"https://github.com/Cykooz/fast_image_resize/blob/6dc1fe2750a3f41a047ee69ca6fa4517d752d017/src/images/typed_image.rs#L134"},{"ref":"src/images/typed_image.rs:145-145","code":"  145 |         let pixels_count = width as usize * height as usize;","lines":1,"link":"https://github.com/Cykooz/fast_image_resize/blob/6dc1fe2750a3f41a047ee69ca6fa4517d752d017/src/images/typed_image.rs#L145"},{"ref":"src/images/typed_image.rs:161-161","code":"  161 |         let pixels_count = width as usize * height as usize;","lines":1,"link":"https://github.com/Cykooz/fast_image_resize/blob/6dc1fe2750a3f41a047ee69ca6fa4517d752d017/src/images/typed_image.rs#L161"},{"ref":"src/images/typed_image.rs:177-177","code":"  177 |         let size = width as usize * height as usize * P::size();","lines":1,"link":"https://github.com/Cykooz/fast_image_resize/blob/6dc1fe2750a3f41a047ee69ca6fa4517d752d017/src/images/typed_image.rs#L177"}]},{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"`Normalizer16::new`/`Normalizer32::new` (`src/convolution/optimisations.rs`) derive `precision` from the maximum filter weight and only guard the \"SIMD requires `precision >= 4`\" invariant with `debug_assert!(precision >= 4)`, which is compiled out in release builds. If a `FilterType::Custom` function (a public, user-supplied `fn(f64) -> f64`, see `src/convolution/filters.rs`) returns an unusually large weight (roughly `>= 2^30` for `Normalizer32`, reachable e.g. from a filter with a division bug), the precision-search loop breaks on its very first iteration and `precision` ends up `0..3`. Every horizontal-convolution backend then computes an unchecked `precision - 1` (or `PRECISION - 2` for the NEON path) on a `u8`/`i32`, e.g. `let initial = 1i64 << (precision - 1);` in `src/convolution/u16x1/native.rs:14`. When `precision == 0` this `u8` subtraction underflows, which panics in debug builds and silently wraps in release builds, after which the resulting huge/negative shift amount produces meaningless pixel data (or a shift-amount panic, since `1i64 << (huge value)` is also checked in debug builds). The invariant that downstream SIMD code relies on is therefore not actually enforced outside of debug assertions.","fix":"Make the precision floor a real invariant instead of a debug-only assertion, e.g. in `src/convolution/optimisations.rs` clamp after the search loop:\n```rust\ndebug_assert!(precision >= 4); // required for some SIMD optimisations\n```\nto:\n```rust\nprecision = precision.max(4); // required for some SIMD optimisations; enforce in release too\n```\n(applied to both `Normalizer16::new` and `Normalizer32::new`). This keeps the documented lower bound valid even when a custom filter function returns pathological weights, avoiding the unsigned-subtraction underflow in every downstream `precision - 1` computation.","locations":[{"ref":"src/convolution/optimisations.rs:60-69","code":"   60 |         let mut precision = 0u8;\n   61 |         for cur_precision in 0..PRECISION_BITS {\n   62 |             precision = cur_precision;\n   63 |             let next_value: i32 = (max_weight * (1 << (precision + 1)) as f64).round() as i32;\n   64 |             if next_value >= (1 << MAX_COEFFS_PRECISION) {\n   65 |                 // The next value will be outside the range, so stop\n   66 |                 break;\n   67 |             }\n   68 |         }\n   69 |         debug_assert!(precision >= 4); // required for some SIMD optimisations","lines":10,"link":"https://github.com/Cykooz/fast_image_resize/blob/6dc1fe2750a3f41a047ee69ca6fa4517d752d017/src/convolution/optimisations.rs#L60-L69"},{"ref":"src/convolution/optimisations.rs:155-164","code":"  155 |         let mut precision = 0u8;\n  156 |         for cur_precision in 0..PRECISION16_BITS {\n  157 |             precision = cur_precision;\n  158 |             let next_value: i64 = (max_weight * (1i64 << (precision + 1)) as f64).round() as i64;\n  159 |             // The next value will be outside the range, so just stop\n  160 |             if next_value >= (1i64 << MAX_COEFFS_PRECISION16) {\n  161 |                 break;\n  162 |             }\n  163 |         }\n  164 |         debug_assert!(precision >= 4); // required for some SIMD optimisations","lines":10,"link":"https://github.com/Cykooz/fast_image_resize/blob/6dc1fe2750a3f41a047ee69ca6fa4517d752d017/src/convolution/optimisations.rs#L155-L164"},{"ref":"src/convolution/u16x1/native.rs:12-14","code":"   12 |     let precision = normalizer.precision();\n   13 |     let coefficients_chunks = normalizer.chunks();\n   14 |     let initial = 1i64 << (precision - 1);","lines":3,"link":"https://github.com/Cykooz/fast_image_resize/blob/6dc1fe2750a3f41a047ee69ca6fa4517d752d017/src/convolution/u16x1/native.rs#L12-L14"}]},{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`Normalizer16::precision()`/`Normalizer32::precision()` return a `u8`, and the crate only guarantees `precision >= 4` via a debug-only `debug_assert!(precision >= 4)` in `src/convolution/optimisations.rs` (outside this file set). Several kernels in this audited set subtract more than 4 from `precision` as a plain `u8`/`i32` arithmetic op to compute a rounding-bias shift amount, e.g. `` _mm256_set1_epi32(1 << (normalizer.precision() - 4)) `` in `src/convolution/u8x1/avx2.rs:50` and `:113`, and `` vdupq_n_s32(1 << (precision - 3)) `` in `src/convolution/u8x1/neon.rs:47` and `:151`. In a release build (`debug-assertions = false`, the crate's default profile), if `precision` were ever less than 4 (or less than 3 for the `neon` file), the subtraction silently wraps (`u8` wraparound, e.g. `2u8 - 4 = 254`), and the subsequent `1 << N` shift amount gets masked modulo the register width, producing a bogus bias constant and silently wrong pixel values instead of a panic. Today this is unreachable because `Coefficients` is only ever built internally from the crate's own bounded filter kernels, but the invariant is enforced only by a debug-only assertion in a different file, with no defensive check in the SIMD kernels themselves that actually consume the subtraction result.","fix":"Either promote the invariant to a real, non-debug-only guard where `precision()` is computed (so it can never legally return `< 4`), or make the SIMD kernels defensive, e.g. use `precision.max(4) - 4` / `precision.saturating_sub(4)` instead of a bare `precision - 4`:\n\n```rust\n// before\nlet initial = _mm256_set1_epi32(1 << (normalizer.precision() - 4));\n\n// after\nlet initial = _mm256_set1_epi32(1 << (normalizer.precision().max(4) - 4));\n```\n\nThis keeps the fast path unchanged for all realistic inputs while turning a silent-wraparound/wrong-output failure mode into a well-defined clamp.","locations":[{"ref":"src/convolution/u8x1/avx2.rs:50","code":"   50 |     let initial = _mm256_set1_epi32(1 << (normalizer.precision() - 4));","lines":1,"link":"https://github.com/Cykooz/fast_image_resize/blob/6dc1fe2750a3f41a047ee69ca6fa4517d752d017/src/convolution/u8x1/avx2.rs#L50"},{"ref":"src/convolution/u8x1/avx2.rs:113","code":"  113 |     let initial = _mm256_set1_epi32(1 << (normalizer.precision() - 4));","lines":1,"link":"https://github.com/Cykooz/fast_image_resize/blob/6dc1fe2750a3f41a047ee69ca6fa4517d752d017/src/convolution/u8x1/avx2.rs#L113"},{"ref":"src/convolution/u8x1/neon.rs:47","code":"   47 |     let initial = vdupq_n_s32(1 << (precision - 3));","lines":1,"link":"https://github.com/Cykooz/fast_image_resize/blob/6dc1fe2750a3f41a047ee69ca6fa4517d752d017/src/convolution/u8x1/neon.rs#L47"},{"ref":"src/convolution/u8x1/neon.rs:151","code":"  151 |     let initial = vdupq_n_s32(1 << (precision - 3));","lines":1,"link":"https://github.com/Cykooz/fast_image_resize/blob/6dc1fe2750a3f41a047ee69ca6fa4517d752d017/src/convolution/u8x1/neon.rs#L151"}]},{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`impl IntoPixelComponent<u8> for u16` converts by simply taking the high byte, `self.to_le_bytes()[1]`, which is equivalent to `self >> 8` - a plain truncation with no rounding. This is inconsistent with every other down-scaling conversion in the same file (e.g. `i32::into_component::<u8>` and `i32::into_component::<u16>` both round via `saturating_add(1 << N) >> N`, and `f32`'s conversions use `.round()`), and also inconsistent with the rounding technique used elsewhere in the crate for 16-to-8-bit narrowing (`src/alpha/common.rs:4`: `(((tmp >> 8) + tmp) >> 8) as u8`). The truncation introduces a systematic downward bias: e.g. `511_u16` (which should round to `2` when scaled to 8 bits, since `511/257 ≈ 1.99`) instead converts to `1`. This conversion is reachable from the public API through `change_components_type.rs`, so any 16-bit-to-8-bit image conversion via this path is systematically slightly too dark/low.","fix":"Round instead of truncating, e.g.:\n\n```rust\n// before\nimpl IntoPixelComponent<u8> for u16 {\n    fn into_component(self) -> u8 {\n        self.to_le_bytes()[1]\n    }\n}\n\n// after\nimpl IntoPixelComponent<u8> for u16 {\n    fn into_component(self) -> u8 {\n        (((self as u32) + 128) >> 8).min(u8::MAX as u32) as u8\n    }\n}\n```","locations":[{"ref":"src/pixels.rs:398-402","code":"  398 | impl IntoPixelComponent<u8> for u16 {\n  399 |     fn into_component(self) -> u8 {\n  400 |         self.to_le_bytes()[1]\n  401 |     }\n  402 | }","lines":5,"link":"https://github.com/Cykooz/fast_image_resize/blob/6dc1fe2750a3f41a047ee69ca6fa4517d752d017/src/pixels.rs#L398-L402"}]},{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"The `i32 <-> f32` pixel-component conversions in `IntoPixelComponent` have a sign bug for negative values. `impl IntoPixelComponent<f32> for i32` divides by `i32::MIN as f32` (a negative number) whenever `self < 0`, and `impl IntoPixelComponent<i32> for f32` multiplies by `i32::MIN as f32` whenever `self < 0.`. Since both operands are negative in the `self < 0` branch, the result is always positive - i.e. a negative input produces a positive output. For example, `(-1_i32 as f32) / (i32::MIN as f32)` (using `self = i32::MIN`) evaluates to `+1.0` instead of the intended `-1.0`, and `f32::into_component::<i32>(-0.5)` evaluates to `+1_073_741_824` instead of `-1_073_741_824`. The special-casing of `i32::MIN` (instead of just always using `i32::MAX`) shows the intent was to use the full negative range of `i32`, but the implementation forgot that `i32::MIN` itself is negative, so the two negatives cancel out. This silently flips the sign of any negative `i32`/`f32` pixel component processed through `change_components_type.rs`'s generic component conversion (which is re-exported as part of the crate's public API via `pub use change_components_type::*;` in `lib.rs`).","fix":"Use the absolute value (i.e. negate `i32::MIN as f32`) so the sign of the input is preserved:\n\n```rust\nimpl IntoPixelComponent<f32> for i32 {\n    fn into_component(self) -> f32 {\n        if self < 0 {\n            (self as f32) / -(i32::MIN as f32)\n        } else {\n            (self as f32) / i32::MAX as f32\n        }\n    }\n}\n\nimpl IntoPixelComponent<i32> for f32 {\n    fn into_component(self) -> i32 {\n        let max = if self < 0. {\n            -(i32::MIN as f32)\n        } else {\n            i32::MAX as f32\n        };\n        (self.clamp(-1., 1.) * max).round() as i32\n    }\n}\n```","locations":[{"ref":"src/pixels.rs:430-438","code":"  430 | impl IntoPixelComponent<f32> for i32 {\n  431 |     fn into_component(self) -> f32 {\n  432 |         if self < 0 {\n  433 |             (self as f32) / i32::MIN as f32\n  434 |         } else {\n  435 |             (self as f32) / i32::MAX as f32\n  436 |         }\n  437 |     }\n  438 | }","lines":9,"link":"https://github.com/Cykooz/fast_image_resize/blob/6dc1fe2750a3f41a047ee69ca6fa4517d752d017/src/pixels.rs#L430-L438"},{"ref":"src/pixels.rs:454-463","code":"  454 | impl IntoPixelComponent<i32> for f32 {\n  455 |     fn into_component(self) -> i32 {\n  456 |         let max = if self < 0. {\n  457 |             i32::MIN as f32\n  458 |         } else {\n  459 |             i32::MAX as f32\n  460 |         };\n  461 |         (self.clamp(-1., 1.) * max).round() as i32\n  462 |     }\n  463 | }","lines":10,"link":"https://github.com/Cykooz/fast_image_resize/blob/6dc1fe2750a3f41a047ee69ca6fa4517d752d017/src/pixels.rs#L454-L463"}]},{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `resample_nearest`, the precomputed table of source-column indices `x_in_tab` clamps each computed index with `.min(max_src_x)` where `max_src_x = src_view.width() as usize`. The valid index range for a row slice of width `max_src_x` is `0..max_src_x-1`, so the clamp should be `max_src_x - 1`, not `max_src_x`. The clamp exists specifically to guard against floating-point overshoot of `x_in_start + x_scale * x` for the last destination column, but because it clamps to the wrong bound it still allows `x_in == max_src_x`, which is then used in `unsafe { *in_row.get_unchecked(x_in) }` - a one-past-the-end unchecked read (undefined behavior, not a panic). This has been verified numerically: for example with a source width of `10_000_000`, a 1-pixel-wide crop at the right edge (`crop_box.left = 9_999_999.0`, `crop_box.width = 1.0`), and a destination width of `4_294_967_295`, the computed value for the last output column rounds in `f64` to exactly `10_000_000.0`, i.e. `idx = 10_000_000` while the maximum valid index is `9_999_999` - an out-of-bounds `get_unchecked` read. Triggering this in practice requires an extreme destination width (hundreds of millions of pixels or more) relative to the crop, so it is unlikely to be hit with typical image sizes, but it is a genuine soundness bug in code that already exists specifically to prevent this class of failure.","fix":"Clamp to the last valid index, not the width, e.g.:\n\n```rust\nlet max_src_x = src_view.width() as usize - 1;\nlet x_in_tab: Vec<usize> = (0..dst_width)\n    .map(|x| ((x_in_start + x_scale * x as f64) as usize).min(max_src_x))\n    .collect();\n```\n\n(`src_view.width()` is already known to be `> 0` at this point because of the earlier `crop_box.width <= 0.` guard, so the subtraction cannot underflow.)","locations":[{"ref":"src/resizer.rs:569-573","code":"  569 |     let x_in_start = crop_box.left + x_scale * 0.5;\n  570 |     let max_src_x = src_view.width() as usize;\n  571 |     let x_in_tab: Vec<usize> = (0..dst_width)\n  572 |         .map(|x| ((x_in_start + x_scale * x as f64) as usize).min(max_src_x))\n  573 |         .collect();","lines":5,"link":"https://github.com/Cykooz/fast_image_resize/blob/6dc1fe2750a3f41a047ee69ca6fa4517d752d017/src/resizer.rs#L569-L573"}]},{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"hard","description":"`divide_alpha` for 16-bit-per-channel pixel formats (`U16x2`, `U16x4`) is computed very differently on the native scalar path than on every SIMD path, and the two are not numerically identical.\n\nThe native/scalar implementation (`src/alpha/common.rs:25-50`, used from `src/alpha/u16x2/native.rs:64-74` and `src/alpha/u16x4/native.rs:73-89`) computes the reciprocal of alpha with a 33-bit-precision (`PRECISION16 = 33`) fixed-point table (`RECIP_ALPHA16`, a `u64` table) and rounds with integer arithmetic (`div_and_clip16`).\n\nThe SIMD paths (e.g. `src/alpha/u16x2/avx2.rs:179-207`, `src/alpha/u16x2/sse4.rs:198-218`, and the analogous `u16x4/avx2.rs:207-244`, `u16x4/sse4.rs:193-222`, plus the NEON/WASM32 equivalents) instead compute `luma * 65535.0 / alpha` using single-precision `f32` arithmetic (`_mm256_div_ps`/`_mm_div_ps`/`vdivq_f32`/`f32x4_div`) and then convert back with `cvtps_epi32`/`vcvtaq_u32_f32`/`trunc_sat`.\n\n`f32` only has a 24-bit mantissa, but the numerator `luma * 65535` can reach roughly 2^32 (65535*65535), so it cannot always be represented exactly; the reciprocal `65535.0 / alpha` is likewise only approximate. I verified with an independent reference implementation of both formulas (native fixed-point vs. the `f32` SIMD formula) that they disagree by ±1 out of 65535 for a non-trivial fraction of `(luma, alpha)` inputs (e.g. `luma=176, alpha=352` gives `32767` on the native/fixed-point path and `32768` on the `f32` SIMD path). This means the exact same source image can produce slightly different `divide_alpha` output depending on which `CpuExtensions` variant is selected at runtime (e.g. `Avx2` vs `None`/native), which is a correctness/determinism inconsistency between code paths that are supposed to implement the same operation. The 8-bit pixel types (`U8x2`/`U8x4`) do not have this problem because their equivalent products fit exactly within `f32`'s 24-bit mantissa.","fix":"Either accept the discrepancy explicitly (document it, and make sure any bit-exactness tests use a tolerance of at least 1 for 16-bit `divide_alpha`), or make the SIMD paths match the native path's precision, e.g. by using the same `u64`/fixed-point `RECIP_ALPHA16` table (gathered via scalar lookups) instead of a per-lane `f32` division, or by doing the reciprocal computation in `f64` (which has enough mantissa bits to represent the ~2^32 intermediate products exactly) before narrowing to the final integer result.","locations":[{"ref":"src/alpha/common.rs:25-50","code":"   25 | const fn recip_alpha16_array(precision: u64) -> [u64; 65536] {\n   26 |     let mut res = [0; 65536];\n   27 |     let scale = 1 << (precision + 1);\n   28 |     let scaled_max = 0xffff * scale;\n   29 |     let mut i: usize = 1;\n   30 |     while i < 65536 {\n   31 |         res[i] = ((scaled_max / i as u64) + 1) >> 1;\n   32 |         i += 1;\n   33 |     }\n   34 |     res\n   35 | }\n   36 | \n   37 | const PRECISION: u32 = 8;\n   38 | const ROUND_CORRECTION: u32 = 1 << (PRECISION - 1);\n   39 | const PRECISION16: u64 = 33;\n   40 | const ROUND_CORRECTION16: u64 = 1 << (PRECISION16 - 1);\n   41 | \n   42 | #[inline(always)]\n   43 | pub(crate) fn div_and_clip(v: u8, recip_alpha: u32) -> u8 {\n   44 |     ((v as u32 * recip_alpha + ROUND_CORRECTION) >> PRECISION).min(0xff) as u8\n   45 | }\n   46 | \n   47 | #[inline(always)]\n   48 | pub(crate) fn div_and_clip16(v: u16, recip_alpha: u64) -> u16 {\n   49 |     ((v as u64 * recip_alpha + ROUND_CORRECTION16) >> PRECISION16).min(0xffff) as u16\n   50 | }","lines":26,"link":"https://github.com/Cykooz/fast_image_resize/blob/6dc1fe2750a3f41a047ee69ca6fa4517d752d017/src/alpha/common.rs#L25-L50"},{"ref":"src/alpha/u16x2/native.rs:64-74","code":"   64 | pub(crate) fn divide_alpha_row(src_row: &[U16x2], dst_row: &mut [U16x2]) {\n   65 |     src_row\n   66 |         .iter()\n   67 |         .zip(dst_row)\n   68 |         .for_each(|(src_pixel, dst_pixel)| {\n   69 |             let components: [u16; 2] = src_pixel.0;\n   70 |             let alpha = components[1];\n   71 |             let recip_alpha = RECIP_ALPHA16[alpha as usize];\n   72 |             dst_pixel.0 = [div_and_clip16(components[0], recip_alpha), alpha];\n   73 |         });\n   74 | }","lines":11,"link":"https://github.com/Cykooz/fast_image_resize/blob/6dc1fe2750a3f41a047ee69ca6fa4517d752d017/src/alpha/u16x2/native.rs#L64-L74"},{"ref":"src/alpha/u16x2/avx2.rs:201-228","code":"  201 | #[inline]\n  202 | #[target_feature(enable = \"avx2\")]\n  203 | unsafe fn divide_alpha_8_pixels(pixels: __m256i) -> __m256i {\n  204 |     let alpha_mask = _mm256_set1_epi32(0xffff0000u32 as i32);\n  205 |     let luma_mask = _mm256_set1_epi32(0xffff);\n  206 |     let alpha_max = _mm256_set1_ps(65535.0);\n  207 |     /*\n  208 |        |L0   A0  | |L1   A1  | |L2   A2  | |L3   A3  |\n  209 |        |0001 0203| |0405 0607| |0809 1011| |1213 1415|\n  210 |     */\n  211 |     #[rustfmt::skip]\n  212 |     let alpha32_sh = _mm256_set_epi8(\n  213 |         -1, -1, 15, 14, -1, -1, 11, 10, -1, -1, 7, 6, -1, -1, 3, 2,\n  214 |         -1, -1, 15, 14, -1, -1, 11, 10, -1, -1, 7, 6, -1, -1, 3, 2,\n  215 |     );\n  216 | \n  217 |     let alpha_f32x8 = _mm256_cvtepi32_ps(_mm256_shuffle_epi8(pixels, alpha32_sh));\n  218 |     let luma_i32x8 = _mm256_and_si256(pixels, luma_mask);\n  219 |     let luma_f32x8 = _mm256_cvtepi32_ps(luma_i32x8);\n  220 |     let scaled_luma_f32x8 = _mm256_mul_ps(luma_f32x8, alpha_max);\n  221 |     let divided_luma_f32x8 = _mm256_div_ps(scaled_luma_f32x8, alpha_f32x8);\n  222 |     let mut divided_luma_i32x8 = _mm256_cvtps_epi32(divided_luma_f32x8);\n  223 |     // Clamp result to [0..0xffff]\n  224 |     divid          && core::ptr::fn_addr_eq(self.func, other.func)\n    }\n}\n```","locations":[{"ref":"src/convolution/filters.rs:23-27","code":"   23 | impl PartialEq for Filter {\n   24 |     fn eq(&self, other: &Self) -> bool {\n   25 |         self.support == other.support && self.name == other.name\n   26 |     }\n   27 | }","lines":5,"link":"https://github.com/Cykooz/fast_image_resize/blob/6dc1fe2750a3f41a047ee69ca6fa4517d752d017/src/convolution/filters.rs#L23-L27"}]},{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`CroppedSrcImageView::crop` (in `crop_box.rs`) validates the crop rectangle with plain floating-point comparisons: `crop_box.left >= img_width`, `crop_box.top >= img_height`, and `right > img_width || bottom > img_height`. If any field of the caller-supplied `CropBox` (`left`, `top`, `width`, `height`, all public `f64` fields) is `NaN`, every one of these comparisons evaluates to `false` (per IEEE-754, any comparison with `NaN` is `false`), so the malformed crop box passes validation and `Ok(Self { image_view, crop_box })` is returned instead of an error. The same applies to `f64::INFINITY`/`f64::NEG_INFINITY`, which are silently accepted (e.g. `right > img_width` is only correctly rejected for `+inf`, but a `NEG_INFINITY` `left` slips past `crop_box.left >= img_width`... `-inf >= img_width` is `false`, so it passes both checks). Downstream consumers that convert these float bounds to pixel offsets can end up with unexpected/garbage crop parameters instead of a clear `CropBoxError`.","fix":"Reject non-finite crop-box fields explicitly before the boundary comparisons:\n\n```rust\npub fn crop(image_view: &'a T, crop_box: CropBox) -> Result<Self, CropBoxError> {\n    if !crop_box.left.is_finite()\n        || !crop_box.top.is_finite()\n        || !crop_box.width.is_finite()\n        || !crop_box.height.is_finite()\n        || crop_box.width < 0.\n        || crop_box.height < 0.\n    {\n        return Err(CropBoxError::WidthOrHeightLessThanZero);\n    }\n    // ...existing boundary checks...\n}\n```","locations":[{"ref":"src/crop_box.rs:103-123","code":"  103 |     pub fn crop(image_view: &'a T, crop_box: CropBox) -> Result<Self, CropBoxError> {\n  104 |         if crop_box.width < 0. || crop_box.height < 0. {\n  105 |             return Err(CropBoxError::WidthOrHeightLessThanZero);\n  106 |         }\n  107 | \n  108 |         let img_width = image_view.width() as _;\n  109 |         let img_height = image_view.height() as _;\n  110 | \n  111 |         if crop_box.left >= img_width || crop_box.top >= img_height {\n  112 |             return Err(CropBoxError::PositionIsOutOfImageBoundaries);\n  113 |         }\n  114 |         let right = crop_box.left + crop_box.width;\n  115 |         let bottom = crop_box.top + crop_box.height;\n  116 |         if right > img_width || bottom > img_height {\n  117 |             return Err(CropBoxError::SizeIsOutOfImageBoundaries);\n  118 |         }\n  119 |         Ok(Self {\n  120 |             image_view,\n  121 |             crop_box,\n  122 |         })\n  123 |     }","lines":21,"link":"https://github.com/Cykooz/fast_image_resize/blob/6dc1fe2750a3f41a047ee69ca6fa4517d752d017/src/crop_box.rs#L103-L123"}]},{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"negligible","difficulty":"very_easy","description":"In `src/alpha/f32x2/avx2.rs`, `multiply_alpha_row_inplace` and `divide_alpha_row_inplace` process 8-wide `__m256` chunks (i.e. 4 `F32x2` pixels per register, since each pixel is 2 `f32`s), but the local variables are named `src_pixels01`/`src_pixels23`, which is the naming convention used in the *SSE4* (`__m128`, 2-pixel) sibling file `src/alpha/f32x2/sse4.rs:52-54`. The AVX2 `multiply_alpha_row`/`divide_alpha_row` functions defined just above/below in the very same file correctly use `src_pixels03`/`src_pixels47` for the same 4-pixel grouping. This looks like the `_inplace` variants were copy-pasted from `sse4.rs` without updating the variable names to match the wider AVX2 registers. It has no functional effect (the names are purely local), but it is misleading to future maintainers reading/modifying this SIMD code, since `pixels01`/`pixels23` suggests each register holds only 2 pixels when it actually holds 4.","fix":"Rename to match the 4-pixel-per-register convention already used by `multiply_alpha_row`/`divide_alpha_row` in the same file:\n\nBefore:\n```rust\nlet src_pixels01 = _mm256_loadu_ps(src_ptr);\nlet src_pixels23 = _mm256_loadu_ps(src_ptr.add(8));\nmultiply_alpha_8_pixels(src_pixels01, src_pixels23, chunk);\n```\n\nAfter:\n```rust\nlet src_pixels03 = _mm256_loadu_ps(src_ptr);\nlet src_pixels47 = _mm256_loadu_ps(src_ptr.add(8));\nmultiply_alpha_8_pixels(src_pixels03, src_pixels47, chunk);\n```\n(and the analogous rename for `divide_alpha_row_inplace`'s `src_pixels01`/`src_pixels23`).","locations":[{"ref":"src/alpha/f32x2/avx2.rs:48-61","code":"   48 | pub(crate) unsafe fn multiply_alpha_row_inplace(row: &mut [F32x2]) {\n   49 |     let mut chunks = row.chunks_exact_mut(8);\n   50 |     for chunk in &mut chunks {\n   51 |         let src_ptr = chunk.as_ptr() as *const f32;\n   52 |         let src_pixels01 = _mm256_loadu_ps(src_ptr);\n   53 |         let src_pixels23 = _mm256_loadu_ps(src_ptr.add(8));\n   54 |         multiply_alpha_8_pixels(src_pixels01, src_pixels23, chunk);\n   55 |     }\n   56 | \n   57 |     let reminder = chunks.into_remainder();\n   58 |     if !reminder.is_empty() {\n   59 |         sse4::multiply_alpha_row_inplace(reminder);\n   60 |     }\n   61 | }","lines":14,"link":"https://github.com/Cykooz/fast_image_resize/blob/6dc1fe2750a3f41a047ee69ca6fa4517d752d017/src/alpha/f32x2/avx2.rs#L48-L61"},{"ref":"src/alpha/f32x2/avx2.rs:118-131","code":"  118 | pub(crate) unsafe fn divide_alpha_row_inplace(row: &mut [F32x2]) {\n  119 |     let mut chunks = row.chunks_exact_mut(8);\n  120 |     for chunk in &mut chunks {\n  121 |         let src_ptr = chunk.as_ptr() as *const f32;\n  122 |         let src_pixels01 = _mm256_loadu_ps(src_ptr);\n  123 |         let src_pixels23 = _mm256_loadu_ps(src_ptr.add(8));\n  124 |         divide_alpha_8_pixels(src_pixels01, src_pixels23, chunk);\n  125 |     }\n  126 | \n  127 |     let reminder = chunks.into_remainder();\n  128 |     if !reminder.is_empty() {\n  129 |         sse4::divide_alpha_row_inplace(reminder);\n  130 |     }\n  131 | }","lines":14,"link":"https://github.com/Cykooz/fast_image_resize/blob/6dc1fe2750a3f41a047ee69ca6fa4517d752d017/src/alpha/f32x2/avx2.rs#L118-L131"}]},{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","difficulty":"hard","description":"Unlike `vertical_u8` and `vertical_u16`, the `vertical_f32` convolution module has no `neon.rs` or `wasm32.rs` implementation at all (only `avx2.rs`/`sse4.rs` for `x86_64`, plus `native.rs`). `src/convolution/vertical_f32/mod.rs` even has the `neon`/`wasm32` module declarations and their dispatch arms commented out (`// #[cfg(target_arch = \"aarch64\")] // mod neon;` and `// #[cfg(target_arch = \"wasm32\")] // pub mod wasm32;`), so on `aarch64` and `wasm32` targets `vert_convolution_f32` always falls back to the scalar-ish `native::vert_convolution`, while `vertical_u8`/`vertical_u16` get fully vectorized `neon.rs`/`wasm32.rs` kernels on those same targets. This is a real performance asymmetry for any pipeline resizing `F32x2`/`F32x4` images (e.g. HDR/linear-light workflows) on ARM64 or WebAssembly.","fix":"Add `neon.rs` and `wasm32.rs` vertical-convolution kernels for `f32` components (mirroring the structure already used in `src/convolution/vertical_u16/neon.rs` and `src/convolution/vertical_u16/wasm32.rs`), then re-enable the commented-out module declarations and dispatch arms in `vertical_f32/mod.rs`:\n\n```rust\n#[cfg(target_arch = \"aarch64\")]\nmod neon;\n#[cfg(target_arch = \"wasm32\")]\npub mod wasm32;\n...\n#[cfg(target_arch = \"aarch64\")]\nCpuExtensions::Neon => neon::vert_convolution(src_view, dst_view, offset, coeffs),\n#[cfg(target_arch = \"wasm32\")]\nCpuExtensions::Simd128 => wasm32::vert_convolution(src_view, dst_view, offset, coeffs),\n```\n\nIf SIMD kernels are not yet planned, at minimum leave a `// TODO` note explaining the gap is intentional rather than commented-out dead scaffolding.","locations":[{"ref":"src/convolution/vertical_f32/mod.rs:1-37","code":"    1 | use crate::convolution::Coefficients;\n    2 | use crate::pixels::InnerPixel;\n    3 | use crate::{CpuExtensions, ImageView, ImageViewMut};\n    4 | \n    5 | #[cfg(target_arch = \"x86_64\")]\n    6 | pub(crate) mod avx2;\n    7 | pub(crate) mod native;\n    8 | // #[cfg(target_arch = \"aarch64\")]\n    9 | // mod neon;\n   10 | #[cfg(target_arch = \"x86_64\")]\n   11 | pub(crate) mod sse4;\n   12 | // #[cfg(target_arch = \"wasm32\")]\n   13 | // pub mod wasm32;\n   14 | \n   15 | pub(crate) fn vert_convolution_f32<T: InnerPixel<Component = f32>>(\n   16 |     src_view: &impl ImageView<Pixel = T>,\n   17 |     dst_view: &mut impl ImageViewMut<Pixel = T>,\n   18 |     offset: u32,\n   19 |     coeffs: &Coefficients,\n   20 |     cpu_extensions: CpuExtensions,\n   21 | ) {\n   22 |     // Check safety conditions\n   23 |     debug_assert!(src_view.width() - offset >= dst_view.width());\n   24 |     debug_assert_eq!(coeffs.bounds.len(), dst_view.height() as usize);\n   25 | \n   26 |     match cpu_extensions {\n   27 |         #[cfg(target_arch = \"x86_64\")]\n   28 |         CpuExtensions::Avx2 => avx2::vert_convolution(src_view, dst_view, offset, coeffs),\n   29 |         #[cfg(target_arch = \"x86_64\")]\n   30 |         CpuExtensions::Sse4_1 => sse4::vert_convolution(src_view, dst_view, offset, coeffs),\n   31 |         // #[cfg(target_arch = \"aarch64\")]\n   32 |         // CpuExtensions::Neon => neon::vert_convolution(src_view, dst_view, offset, coeffs),\n   33 |         // #[cfg(target_arch = \"wasm32\")]\n   34 |         // CpuExtensions::Simd128 => wasm32::vert_convolution(src_view, dst_view, offset, coeffs),\n   35 |         _ => native::vert_convolution(src_view, dst_view, offset, coeffs),\n   36 |     }\n   37 | }","lines":37,"link":"https://github.com/Cykooz/fast_image_resize/blob/6dc1fe2750a3f41a047ee69ca6fa4517d752d017/src/convolution/vertical_f32/mod.rs#L1-L37"}]},{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`src/convolution/f32x1/native.rs` unrolls its inner accumulation loop through `convolution_by_chunks::<8>` (processing 8 coefficients/pixels per iteration before falling back to a scalar tail loop), which helps the compiler auto-vectorize the pure-Rust fallback path. The sibling native implementations for the wider pixel types (`src/convolution/f32x2/native.rs`, `src/convolution/f32x3/native.rs`, `src/convolution/f32x4/native.rs`) all use a plain `zip` over `coeffs_chunk.values.iter()` and `src_pixels` with no chunking at all, so they don't benefit from the same optimization and are likely to auto-vectorize worse (or not at all) on the non-SIMD fallback path used whenever `CpuExtensions::None` is selected (no AVX2/SSE4.1 available, e.g. non-x86_64 targets or explicitly disabled features).","fix":"Generalize `convolution_by_chunks` in `src/convolution/f32x1/native.rs` to operate over `[f64; N]` accumulators (one lane per pixel component) and reuse it from `f32x2`/`f32x3`/`f32x4` native `horiz_convolution`, so all native fallbacks benefit from the same chunked-accumulation strategy instead of only `f32x1`.","locations":[{"ref":"src/convolution/f32x1/native.rs:5-48","code":"    5 | pub(crate) fn horiz_convolution(\n    6 |     src_view: &impl ImageView<Pixel = F32>,\n    7 |     dst_view: &mut impl ImageViewMut<Pixel = F32>,\n    8 |     offset: u32,\n    9 |     coeffs: &Coefficients,\n   10 | ) {\n   11 |     let coefficients_chunks = coeffs.get_chunks();\n   12 |     let src_rows = src_view.iter_rows(offset); m32, native)`) invoked once per pixel type. The macro would generate the `impl Convolution for P` block and the `horiz_convolution` dispatcher, keeping only the per-type substitutions (pixel type, normalizer type, vertical-convolution function) as macro arguments. This removes ~500 lines of duplicated boilerplate and guarantees all pixel types stay in lockstep when the dispatch logic changes.","locations":[{"ref":"src/convolution/u8x1/mod.rs:1-85","code":"    1 | use super::{Coefficients, Convolution};\n    2 | use crate::convolution::optimisations::Normalizer16;\n    3 | use crate::convolution::vertical_u8::vert_convolution_u8;\n    4 | use crate::pixels::U8;\n    5 | use crate::{CpuExtensions, ImageView, ImageViewMut};\n    6 | \n    7 | #[cfg(target_arch = \"x86_64\")]\n    8 | mod avx2;\n    9 | mod native;\n   10 | #[cfg(target_arch = \"aarch64\")]\n   11 | mod neon;\n   12 | #[cfg(target_arch = \"x86_64\")]\n   13 | mod sse4;\n   14 | #[cfg(target_arch = \"wasm32\")]\n   15 | mod wasm32;\n   16 | \n   17 | type P = U8;\n   18 | \n   19 | impl Convolution for P {\n   20 |     fn horiz_convolution(\n   21 |         src_view: &impl ImageView<Pixel = Self>,\n   22 |         dst_view: &mut impl ImageViewMut<Pixel = Self>,\n   23 |         offset: u32,\n   24 |         coeffs: Coefficients,\n   25 |         cpu_extensions: CpuExtensions,\n   26 |     ) {\n   27 |         debug_assert!(src_view.height() - offset >= dst_view.height());\n   28 | \n   29 |         let normalizer = Normalizer16::new(coeffs);\n   30 |         let normalizer_ref = &normalizer;\n   31 | \n   32 |         try_process_in_threads_h! {\n   33 |             horiz_convolution(\n   34 |                 src_view,\n   35 |                 dst_view,\n   36 |                 offset,\n   37 |                 normalizer_ref,\n   38 |                 cpu_extensions,\n   39 |             );\n   40 |         }\n   41 |     }\n   42 | \n   43 |     fn vert_convolution(\n   44 |         src_view: &impl Image    cpu_extensions: CpuExtensions,\n   49 |     ) {\n   50 |         debug_assert!(src_view.width() - offset >= dst_view.width());\n   51 | \n   52 |         let normalizer = Normalizer32::new(coeffs);\n   53 |         let normalizer_ref = &normalizer;\n   54 | \n   55 |         try_process_in_threads_v! {\n   56 |             vert_convolution_u16(\n   57 |                 src_view,\n   58 |                 dst_view,\n   59 |                 offset,\n   60 |                 normalizer_ref,\n   61 |                 cpu_extensions,\n   62 |             );\n   63 |         }\n   64 |     }\n   65 | }\n   66 | \n   67 | fn horiz_convolution(\n   68 |     src_view: &impl ImageView<Pixel = P>,\n   69 |     dst_view: &mut impl ImageViewMut<Pixel = P>,\n   70 |     offset: u32,\n   71 |     normalizer: &Normalizer32,\n   72 |     cpu_extensions: CpuExtensions,\n   73 | ) {\n   74 |     match cpu_extensions {\n   75 |         #[cfg(target_arch = \"x86_64\")]\n   76 |         CpuExtensions::Avx2 => avx2::horiz_convolution(src_view, dst_view, offset, normalizer),\n   77 |         #[cfg(target_arch = \"x86_64\")]\n   78 |         CpuExtensions::Sse4_1 => sse4::horiz_convolution(src_view, dst_view, offset, normalizer),\n   79 |         #[cfg(target_arch = \"aarch64\")]\n   80 |         CpuExtensions::Neon => neon::horiz_convolution(src_view, dst_view, offset, normalizer),\n   81 |         #[cfg(target_arch = \"wasm32\")]\n   82 |         CpuExtensions::Simd128 => wasm32::horiz_convolution(src_view, dst_view, offset, normalizer),\n   83 |         _ => native::horiz_convolution(src_view, dst_view, offset, normalizer),\n   84 |     }\n   85 | }","lines":85,"link":"https://github.com/Cykooz/fast_image_resize/blob/6dc1fe2750a3f41a047ee69ca6fa4517d752d017/src/convolution/u16x4/mod.rs#L1-L85"}]},{"id":"DUP_2","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"The `pub(crate) fn horiz_convolution` dispatcher (the function that runs the 4-row SIMD batch loop then the scalar-row tail loop) is copy-pasted verbatim, line for line, across nearly every per-backend convolution file in scope, differing only in the pixel/normalizer type names. The same ~20-25 line body appears in `src/convolution/u8x1/sse4.rs`, `src/convolution/u8x1/avx2.rs`, `src/convolution/u8x1/wasm32.rs`, `src/convolution/u8x2/sse4.rs`, `src/convolution/u8x2/avx2.rs`, `src/convolution/u8x2/wasm32.rs`, `src/convolution/u16x3/sse4.rs`, `src/convolution/u16x3/wasm32.rs`, `src/convolution/u16x4/avx2.rs`, `src/convolution/u16x4/sse4.rs`, and `src/convolution/u16x4/wasm32.rs` (and the same pattern recurs in the sibling `u8x3`/`u8x4` files outside this file list). Because the loop structure (`iter_4_rows` batch + `dst_height - dst_height % 4` scalar tail) is hand-duplicated 11+ times, any future fix to the batching logic (e.g. an off-by-one in the tail-row computation) has to be manually propagated to every copy, and it is easy for one copy to be fixed while siblings are silently left behind.","fix":"Extract the shared dispatcher body into one generic helper, parameterized over the pixel type and the two per-backend kernel functions, e.g.:\n\n```rust\n#[inline]\npub(crate) unsafe fn run_batched_horiz_convolution<P: Pixel, N>(\n    src_view: &impl ImageView<Pixel = P>,\n    dst_view: &mut impl ImageViewMut<Pixel = P>,\n    offset: u32,\n    normalizer: &N,\n    four_rows: unsafe fn([&[P]; 4], [&mut [P]; 4], &N),\n    one_row: unsafe fn(&[P], &mut [P], &N),\n) {\n    let dst_height = dst_view.height();\n    let src_iter = src_view.iter_4_rows(offset, dst_height + offset);\n    let dst_iter = dst_view.iter_4_rows_mut();\n    for (src_rows, dst_rows) in src_iter.zip(dst_iter) {\n        four_rows(src_rows, dst_rows, normalizer);\n    }\n    let yy = dst_height - dst_height % 4;\n    let src_rows = src_view.iter_rows(yy + offset);\n    let dst_rows = dst_view.iter_rows_mut(yy);\n    for (src_row, dst_row) in src_rows.zip(dst_rows) {\n        one_row(src_row, dst_row, normalizer);\n    }\n}\n```\n\nEach backend file then only needs a 2-3 line `horiz_convolution` that calls this helper with its own `horiz_convolution_four_rows`/`horiz_convolution_one_row` function pointers, eliminating the duplicated batching logic while keeping the `#[target_feature]`-annotated kernels separate.","locations":[{"ref":"src/convolution/u8x1/sse4.rs:9-33","code":"    9 | pub(crate) fn horiz_convolution(\n   10 |     src_view: &impl ImageView<Pixel = U8>,\n   11 |     dst_view: &mut impl ImageViewMut<Pixel = U8>,\n   12 |     offset: u32,\n   13 |     normalizer: &Normalizer16,\n   14 | ) {\n   15 |     let dst_height = dst_view.height();\n   16 | \n   17 |     let src_iter = src_view.iter_4_rows(offset, dst_height + offset);\n   18 |     let dst_iter = dst_view.iter_4_rows_mut();\n   19 |     for (src_rows, dst_rows) in src_iter.zip(dst_iter) {\n   20 |         unsafe {\n   21 |             horiz_convolution_four_rows(src_rows, dst_rows, normalizer);\n   22 |         }\n   23 |     }\n   24 | \n   25 |     let yy = dst_height - dst_height % 4;\n   26 |     let src_rows = src_view.iter_rows(yy + offset);\n   27 |     let dst_rows = dst_view.iter_rows_mut(yy);\n   28 |     for (src_row, dst_row) in src_rows.zip(dst_rows) {\n   29 |         unsafe {\n   30 |             horiz_convolution_one_row(src_row, dst_row, normalizer);\n   31 |         }\n   32 |     }\n   33 | }","lines":25,"link":"https://github.com/Cykooz/fast_image_resize/blob/6dc1fe2750a3f41a047ee69ca6fa4517d752d017/src/convolution/u8x1/sse4.rs#L9-L33"},{"ref":"src/convolution/u8x1/avx2.rs:9-33","code":"    9 | pub(crate) fn horiz_convolution(\n   10 |     src_view: &impl ImageView<Pixel = U8>,\n   11 |     dst_view: &mut impl ImageViewMut<Pixel = U8>,\n   12 |     offset: u32,\n   13 |     normalizer: &Normalizer16,\n   14 | ) {\n   15 |     let dst_height = dst_view.height();\n   16 | \n   17 |     let src_iter = src_view.iter_4_rows(offset, dst_height + offset);\ /u8x2/native.rs`, `divide_alpha_inplace` builds an aliasing shared slice from a live `&mut` slice using `core::slice::from_raw_parts`:\n\n```rust\npub(crate) fn divide_alpha_inplace(image_view: &mut impl ImageViewMut<Pixel = U8x2>) {\n    for dst_row in image_view.iter_rows_mut(0) {\n        let src_row = unsafe { core::slice::from_raw_parts(dst_row.as_ptr(), dst_row.len()) };\n        divide_alpha_row(src_row, dst_row);\n    }\n}\n```\n\n`dst_row: &mut [U8x2]` is still alive (it is used again on the same line as the second argument to `divide_alpha_row`), while `src_row: &[U8x2]` is a fresh shared reference created from a raw pointer into the *same* allocation. Having a live `&mut` and a live `&` reference to the same memory at the same time is undefined behavior under Rust's aliasing rules (Stacked/Tree Borrows), even though the code never has a real read/write hazard (each `U8x2` element is read from `src_row` and then written to the identical offset in `dst_row`). Because `&mut` parameters are commonly annotated `noalias` in the emitted LLVM IR, an optimizer is in principle free to assume `src_row` and `dst_row` do not overlap and mis-vectorize/reorder the loop in `divide_alpha_row` (a `chunks`/zip loop, i.e. exactly the shape LLVM likes to auto-vectorize under a non-aliasing assumption).\n\nThis pattern is unique to `U8x2`: every sibling pixel type (`U8x4`, `U16x2`, `U16x4`, `F32x2`, `F32x4`) implements a dedicated, alias-free `divide_alpha_row_inplace`/`divide_alpha_pixel` that mutates each element in place without ever materializing a second reference to the same buffer. For example `src/alpha/u16x2/native.rs` has a proper `divide_alpha_row_inplace` that simply iterates `for pixel in row { ... }`. `U8x2`'s `native.rs` has no such function; `multiply_alpha_inplace`/`multiply_alpha_row_inplace` for the very same pixel type are implemented correctly (in-place, no aliasing), which shows the `divide` path was special-cased incorrectly.","fix":"Add a real `divide_alpha_row_inplace` (mirroring `multiply_alpha_row_inplace` in the same file and `divide_alpha_row_inplace` in `u16x2/native.rs`) and stop round-tripping through a raw pointer:\n\n```rust\npub(crate) fn divide_alpha_inplace(image_view: &mut impl ImageViewMut<Pixel = U8x2>) {\n    for row in image_view.iter_rows_mut(0) {\n        divide_alpha_row_inplace(row);\n    }\n}\n\n#[inline(always)]\npub(crate) fn divide_alpha_row_inplace(row: &mut [U8x2]) {\n    for pixel in row {\n        let components: [u8; 2] = pixel.0;\n        let alpha = components[1];\n        let recip_alpha = RECIP_ALPHA[alpha as usize];\n        pixel.0 = [div_and_clip(components[0], recip_alpha), alpha];\n    }\n}\n```","locations":[{"ref":"src/alpha/u8x2/native.rs:56-62","code":"   56 | #[inline]\n   57 | pub(crate) fn divide_alpha_inplace(image_view: &mut impl ImageViewMut<Pixel = U8x2>) {\n   58 |     for dst_row in image_view.iter_rows_mut(0) {\n   59 |         let src_row = unsafe { core::slice::from_raw_parts(dst_row.as_ptr(), dst_row.len()) };\n   60 |         divide_alpha_row(src_row, dst_row);\n   61 |     }\n   62 | }","lines":7,"link":"https://github.com/Cykooz/fast_image_resize/blob/6dc1fe2750a3f41a047ee69ca6fa4517d752d017/src/alpha/u8x2/native.rs#L56-L62"},{"ref":"src/alpha/u16x2/native.rs:76-84","code":"   76 | #[inline(always)]\n   77 | pub(crate) fn divide_alpha_row_inplace(row: &mut [U16x2]) {\n   78 |     for pixel in row {\n   79 |         let components: [u16; 2] = pixel.0;\n   80 |         let alpha = components[1];\n   81 |         let recip_alpha = RECIP_ALPHA16[alpha as usize];\n   82 |         pixel.0 = [div_and_clip16(components[0], recip_alpha), alpha];\n   83 |     }\n   84 | }","lines":9,"link":"https://github.com/Cykooz/fast_image_resize/blob/6dc1fe2750a3f41a047ee69ca6fa4517d752d017/src/alpha/u16x2/native.rs#L76-L84"},{"ref":"src/alpha/u8x4/native.rs:68-76","code":"   68 | #[inline]\n   69 | pub(crate) fn divide_alpha_inplace(image_view: &mut impl ImageViewMut<Pixel = U8x4>) {\n   70 |     let rows = image_view.iter_rows_mut(0);\n   71 |     for row in rows {\n   72 |         row.iter_mut().for_each(|pixel| {\n   73 |             *pixel = divide_alpha_pixel(*pixel);\n   74 |         });\n   75 |     }\n   76 | }","lines":9,"link":"https://github.com/Cykooz/fast_image_resize/blob/6dc1fe2750a3f41a047ee69ca6fa4517d752d017/src/alpha/u8x4/native.rs#L68-L76"}]},{"id":"OTHER_2","type":"other","type_label":"Other","severity":"medium","difficulty":"hard","description":"`vert_convolution_u8`, `vert_convolution_u16` and `vert_convolution_f32` each guard the single safety invariant that makes the unsafe SIMD/native row-pointer arithmetic downstream sound - `src_view.width() - offset >= dst_view.width()` and `coeffs/normalizer.chunks_len() == dst_view.height()` - with `debug_assert!`/`debug_assert_eq!` only. These checks are compiled out entirely in release builds. All three dispatch functions then hand off to code that does raw, unchecked pointer arithmetic on source rows (e.g. `*src_ptr.add(x_src)` in `vertical_u8::native::convolution_by_u8`, `ptr.read_unaligned()` in the `convolution_by_chunks` helpers, and the SIMD `loadu_si128`/`loadu_si256`/NEON/wasm loads keyed off `src_x`), trusting that `offset + dst_width <= src_width` always holds. If any caller elsewhere in the resize pipeline ever violates that invariant, a debug build panics immediately (safe), but a release build silently reads out of bounds of the source row with no diagnostic at all.","fix":"Promote the width/height invariant checks from `debug_assert!`/`debug_assert_eq!` to a real, always-on check that returns an error (or at least `assert!`/`assert_eq!`, which is not compiled out in release) before dispatching into the unsafe SIMD/native paths, e.g.:\n\n```rust\nassert!(src_view.width() - offset >= dst_view.width(), \"vertical convolution: src row too short for dst width\");\nassert_eq!(normalizer.chunks_len(), dst_view.height() as usize);\n```\n\nThis keeps the fast path branch-free inside the hot per-row loops while ensuring release builds cannot silently read past the end of a source row if the invariant is ever violated by a future change to the scheduling logic in `resizer.rs`.","locations":[{"ref":"src/convolution/vertical_u8/mod.rs:22-24","code":"   22 |     // Check safety conditions\n   23 |     debug_assert!(src_view.width() - offset >= dst_view.width());\n   24 |     debug_assert_eq!(normalizer.chunks_len(), dst_view.height() as usize);","lines":3,"link":"https://github.com/Cykooz/fast_image_resize/blob/6dc1fe2750a3f41a047ee69ca6fa4517d752d017/src/convolution/vertical_u8/mod.rs#L22-L24"},{"ref":"src/convolution/vertical_u16/mod.rs:22-24","code":"   22 |     // Check safety conditions\n   23 |     debug_assert!(src_view.width() - offset >= dst_view.width());\n   24 |     debug_assert_eq!(normalizer.chunks_len(), dst_view.height() as usize);","lines":3,"link":"https://github.com/Cykooz/fast_image_resize/blob/6dc1fe2750a3f41a047ee69ca6fa4517d752d017/src/convolution/vertical_u16/mod.rs#L22-L24"},{"ref":"src/convolution/vertical_f32/mod.rs:22-24","code":"   22 |     // Check safety conditions\n   23 |     debug_assert!(src_view.width() - offset >= dst_view.width());\n   24 |     debug_assert_eq!(coeffs.bounds.len(), dst_view.height() as usize);","lines":3,"link":"https://github.com/Cykooz/fast_image_resize/blob/6dc1fe2750a3f41a047ee69ca6fa4517d752d017/src/convolution/vertical_f32/mod.rs#L22-L24"}]},{"id":"OTHER_3","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"`PixelType::size()` lists explicit byte sizes for `U8`, `U8x2`, `U8x3`, `U16`, `U16x2`, `U16x3`, `U16x4`, `F32x2`, `F32x3`, `F32x4`, and falls back to a bare `_ => 4` for the remaining variants (`U8x4`, `I32`, `F32`). This is correct today only because those three remaining variants all happen to be 4 bytes, but the wildcard arm means the compiler's exhaustiveness check can no longer catch a mistake: if a new `PixelType` variant of
