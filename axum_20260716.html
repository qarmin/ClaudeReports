<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e2e8f0;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#64748b;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#cbd5e1;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#94a3b8}
.project-info .pi-row .pi-k{color:#64748b}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#94a3b8;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#475569;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e2e8f0;border-color:#475569}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#64748b;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#94a3b8;border-color:#475569}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#475569;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#64748b;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#94a3b8;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e2e8f0}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#475569}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#94a3b8;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e2e8f0}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#cbd5e1}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#475569;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#64748b}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#64748b}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#64748b;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#64748b;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e2e8f0}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#cbd5e1;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#475569;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e2e8f0;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

<script type="application/json" id="D">[{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"hard","description":"`ValueDeserializer::deserialize_tuple` in the hand-written `Path` deserializer contains a reachable `unreachable!()`. It is hit whenever a path-capture value itself needs to be deserialized as a 2-tuple while `self.key` is `None` - which happens when deserializing something like `Path<Vec<(String, (String, String))>>` (a \"capture all as pairs\" `Vec<(K, V)>` whose value type `V` is itself a 2-tuple). The inner `PairDeserializer::next_element_seed` yields the pair's value via `ValueDeserializer { key: None, value }` (extract/path/de.rs:465-469); if that value type also requires `deserialize_tuple` with `len == 2`, execution reaches the `None => unreachable!()` arm at line 480 and the request-handling task panics. This was confirmed by direct reproduction: deserializing `Vec<(String, (String, String))>` from two ordinary url params panics with \"internal error: entered unreachable code\" at axum/src/extract/path/de.rs:480, for every request that matches such a route - it does not depend on the specific/malicious values of the path segments, only on the route's declared extractor type. The comment above the `unreachable!()` (\"`self.key` is only `None` when deserializing maps so `deserialize_seq` wouldn't be called for that\") is also inaccurate: it ignores this nested-tuple-value code path.","fix":"Do not assume `self.key` is always `Some` in `ValueDeserializer::deserialize_tuple`. When `self.key` is `None`, return a proper (non-panicking) error consistent with the other unsupported-shape branches in this impl, e.g.:\n```rust\nif len == 2 {\n    match self.key {\n        Some(key) => visitor.visit_seq(PairDeserializer {\n            key: Some(key),\n            value: Some(self.value),\n        }),\n        None => Err(PathDeserializationError::unsupported_type(type_name::<V::Value>())),\n    }\n} else {\n    Err(PathDeserializationError::unsupported_type(type_name::<V::Value>()))\n}\n```\nAlso update/remove the now-inaccurate comment about `self.key` only being `None` for maps.","locations":[{"ref":"axum/src/extract/path/de.rs:437-487","code":"  437 |     fn deserialize_tuple<V>(self, len: usize, visitor: V) -> Result<V::Value, Self::Error>\n  438 |     where\n  439 |         V: Visitor<'de>,\n  440 |     {\n  441 |         struct PairDeserializer<'de> {\n  442 |             key: Option<KeyOrIdx<'de>>,\n  443 |             value: Option<&'de PercentDecodedStr>,\n  444 |         }\n  445 | \n  446 |         impl<'de> SeqAccess<'de> for PairDeserializer<'de> {\n  447 |             type Error = PathDeserializationError;\n  448 | \n  449 |             fn next_element_seed<T>(&mut self, seed: T) -> Result<Option<T::Value>, Self::Error>\n  450 |             where\n  451 |                 T: DeserializeSeed<'de>,\n  452 |             {\n  453 |                 match self.key.take() {\n  454 |                     Some(KeyOrIdx::Idx { idx: _, key }) => {\n  455 |                         return seed.deserialize(KeyDeserializer { key }).map(Some);\n  456 |                     }\n  457 |                     Some(KeyOrIdx::Key(_)) => {\n  458 |                         return Err(PathDeserializationError::custom(\n  459 |                             \"array types are not supported\",\n  460 |                         ));\n  461 |                     }\n  462 |                     None => {}\n  463 |                 };\n  464 | \n  465 |                 self.value\n  466 |                     .take()\n  467 |                     .map(|value| seed.deserialize(ValueDeserializer { key: None, value }))\n  468 |                     .transpose()\n  469 |             }\n  470 |         }\n  471 | \n  472 |         if len == 2 {\n  473 |             match self.key {\n  474 |                 Some(key) => visitor.visit_seq(PairDeserializer {\n  475 |                     key: Some(key),\n  476 |                     value: Some(self.value),\n  477 |                 }),\n  478 |                 // `self.key` is only `None` when deserializing maps so `deserialize_seq`\n  479 |                 // wouldn't be called for that\n  480 |                 None => unreachable!(),\n  481 |             }\n  482 |         } else {\n  483 |             Err(PathDeserializationError::unsupported_type(type_name::<\n  484 |                 V::Value,\n  485 |             >()))\n  486 |         }\n  487 |     }","lines":51,"link":"https://github.com/tokio-rs/axum/blob/98aea470f9190fad1915897166ac0f149522011a/axum/src/extract/path/de.rs#L437-L487"}]},{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`Attachment::filename` accepts any `H: TryInto<HeaderValue>`, including a `HeaderValue` passed directly (there is a reflexive `TryFrom<HeaderValue> for HeaderValue` blanket impl). `HeaderValue` construction only rejects control characters; it does not require the bytes to be valid UTF-8. If a caller forwards a `HeaderValue` obtained from an inbound request header (which may legally contain non-UTF-8 obs-text bytes, e.g. Latin-1 encoded filenames), or one built via `HeaderValue::from_bytes` with a byte like `0xFF`, then `Attachment::filename(...)` will accept and store it (the `try_into()` succeeds). Later, in `into_response`, `filename.to_str()` will return `Err` for such a value, and the code does `.expect(\"This was a HeaderValue so this can not fail\")`, which panics. The comment is factually wrong: a `HeaderValue` can be valid while still failing `to_str()`.","fix":"Do not assume `to_str()` succeeds. Fall back gracefully instead of panicking, e.g.:\n```rust\nlet content_disposition = if let Some(filename) = self.filename {\n    match filename.to_str() {\n        Ok(filename_str) => {\n            let value = format!(\n                \"attachment; filename=\\\"{}\\\"\",\n                EscapedQuotedString(filename_str)\n            );\n            HeaderValue::try_from(value).unwrap_or_else(|_| HeaderValue::from_static(\"attachment\"))\n        }\n        Err(_) => HeaderValue::from_static(\"attachment\"),\n    }\n} else {\n    HeaderValue::from_static(\"attachment\")\n};\n```\nAlso correct/remove the misleading comment claiming this conversion \"can not fail\".","locations":[{"ref":"axum-extra/src/response/attachment.rs:90-98","code":"   90 |         let content_disposition = if let Some(filename) = self.filename {\n   91 |             let filename_str = filename\n   92 |                 .to_str()\n   93 |                 .expect(\"This was a HeaderValue so this can not fail\");\n   94 |             let value = format!(\n   95 |                 \"attachment; filename=\\\"{}\\\"\",\n   96 |                 EscapedQuotedString(filename_str)\n   97 |             );\n   98 |             HeaderValue::try_from(value).expect(\"This was a HeaderValue so this can not fail\")","lines":9,"link":"https://github.com/tokio-rs/axum/blob/98aea470f9190fad1915897166ac0f149522011a/axum-extra/src/response/attachment.rs#L90-L98"}]},{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`#[derive(TypedPath)]` (axum-macros/src/typed_path.rs) does not validate that a path capture's name is a syntactically valid Rust identifier before feeding it to `format_ident!`. In `parse_path`, the only check performed on a capture's content is `capture.is_empty() || capture.contains('{')` (line 403), which is checked on the *raw* capture text before the leading `*` (wildcard marker) is stripped. This lets clearly malformed but plausible input through, such as an unnamed wildcard capture `{*}` (after stripping `*` the identifier becomes the empty string), or a capture containing spaces/hyphens/other invalid identifier characters (e.g. `{foo-bar}`, `{foo bar}`, `{123abc}`). These strings are later passed straight into `format_ident!` in `captures_from_path` (line 372) and in `expand_unnamed_fields`'s `destructure_self` closure (line 207). `format_ident!`/`Ident::new` panics on empty or invalid identifiers rather than returning a `syn::Result`, so a user writing e.g. `#[typed_path(\"/{*}\")]` or `#[typed_path(\"/{foo bar}\")]` gets a raw proc-macro panic (confusing, ICE-like output with a backtrace notice) instead of a clean `syn::Error` compile message. Verified experimentally: calling `format_ident!(\"{}\", \"\", span)` panics with \"Ident is not allowed to be empty; use Option<Ident>\", and `format_ident!(\"{}\", \"foo bar\", span)` panics with \"\"foo bar\" is not a valid Ident\".","fix":"Validate that each capture name is a legal Rust identifier (and non-empty after stripping the `*` wildcard marker) inside `parse_path`, returning a `syn::Error` instead of letting the bad string reach `format_ident!`. For example, right after computing the capture text:\n```rust\nlet ident_candidate = capture.strip_prefix('*').unwrap_or(capture);\nif ident_candidate.is_empty() || syn::parse_str::<syn::Ident>(ident_candidate).is_err() {\n    return Err(syn::Error::new_spanned(\n        path,\n        format!(\"`{{{capture}}}` is not a valid capture name\"),\n    ));\n}\n```\nThis turns the panic into a normal, actionable compile error.","locations":[{"ref":"axum-macros/src/typed_path.rs:394-424","code":"  394 |     while let Some(start) = find_first_not_double(b'{', rest.as_bytes()) {\n  395 |         if start > 0 {\n  396 |             segments.push(Segment::Static(rest[..start].to_owned()));\n  397 |         }\n  398 | \n  399 |         rest = &rest[start + 1..];\n  400 | \n  401 |         if let Some(end) = rest.find('}') {\n  402 |             let capture = &rest[..end];\n  403 |             if capture.is_empty() || capture.contains('{') {\n  404 |                 return Err(syn::Error::new_spanned(path, \"invalid capture in path\"));\n  405 |             }\n  406 | \n  407 |             segments.push(Segment::Capture(\n  408 |                 capture.strip_prefix('*').unwrap_or(capture).to_owned(),\n  409 |                 path.span(),\n  410 |             ));\n  411 | \n  412 |             rest = &rest[end + 1..];\n  413 |         } else {\n  414 |             segments.push(Segment::Static(format!(\"{{{rest}\")));\n  415 |             rest = \"\";\n  416 |         }\n  417 |     }\n  418 | \n  419 |     if !rest.is_empty() {\n  420 |         segments.push(Segment::Static(rest.to_owned()));\n  421 |     }\n  422 | \n  423 |     Ok(segments)\n  424 | }","lines":31,"link":"https://github.com/tokio-rs/axum/blob/98aea470f9190fad1915897166ac0f149522011a/axum-macros/src/typed_path.rs#L394-L424"},{"ref":"axum-macros/src/typed_path.rs:368-376","code":"  368 | fn captures_from_path(segments: &[Segment]) -> Vec<syn::Ident> {\n  369 |     segments\n  370 |         .iter()\n  371 |         .filter_map(|segment| match segment {\n  372 |             Segment::Capture(capture, span) => Some(format_ident!(\"{}\", capture, span = *span)),\n  373 |             Segment::Static(_) => None,\n  374 |         })\n  375 |         .collect::<Vec<_>>()\n  376 | }","lines":9,"link":"https://github.com/tokio-rs/axum/blob/98aea470f9190fad1915897166ac0f149522011a/axum-macros/src/typed_path.rs#L368-L376"},{"ref":"axum-macros/src/typed_path.rs:201-211","code":"  201 |         .enumerate()\n  202 |         .map(|(idx, capture)| {\n  203 |             let idx = syn::Index {\n  204 |                 index: idx as _,\n  205 |                 span: Span::call_site(),\n  206 |             };\n  207 |             let capture = format_ident!(\"{}\", capture, span = path.span());\n  208 |             quote_spanned! {path.span()=>\n  209 |                 #idx: #capture,\n  210 |             }\n  211 |         });","lines":11,"link":"https://github.com/tokio-rs/axum/blob/98aea470f9190fad1915897166ac0f149522011a/axum-macros/src/typed_path.rs#L201-L211"}]},{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`MethodRouter::method_filter()` panics instead of returning a sensible value when called on a `MethodRouter` that has no method handlers set and still has its default fallback (e.g. a freshly-constructed `MethodRouter::new()`, or the result of `MethodRouter::default()`). The function first checks `fallback.is_default()` (true for a fresh router) and then builds an iterator over the configured method endpoints, `.filter_map`-ing to the methods that are `Some`. If no method has been configured yet, that iterator is empty, so `.reduce(MethodFilter::or)` returns `None`, and the subsequent `.expect(\"can't create a MethodRouter with all-default handlers\")` panics. This was verified with a temporary unit test: calling `MethodRouter::<()>::new().method_filter()` panics with \"can't create a MethodRouter with all-default handlers\" at method_routing.rs:706. This function is public API and is also called by `axum-extra`'s `route_with_tsr`/`route_service_with_tsr` helpers (`axum-extra/src/routing/mod.rs`), so passing an as-yet-unconfigured `MethodRouter` there (e.g. built up conditionally before any `.get(..)`/`.post(..)` call) will crash instead of producing a `None`/405-style result as the doc comment implies (\"Returns `None` if the `MethodRouter` was constructed with `any` or has had a fallback set\" - it does not mention this panicking case).","fix":"Don't `.expect()` on the `reduce` result; treat \"no methods configured and default fallback\" the same as \"no filter available\" and return `None`, e.g.:\n```rust\nlet filter = [\n    (get, MethodFilter::GET),\n    (head, MethodFilter::HEAD),\n    (delete, MethodFilter::DELETE),\n    (options, MethodFilter::OPTIONS),\n    (patch, MethodFilter::PATCH),\n    (post, MethodFilter::POST),\n    (put, MethodFilter::PUT),\n    (trace, MethodFilter::TRACE),\n    (connect, MethodFilter::CONNECT),\n]\n.into_iter()\n.filter_map(|(ep, f)| ep.is_some().then_some(f))\n.reduce(MethodFilter::or);\n\nfilter\n```\ni.e. return the `Option` produced by `reduce` directly instead of unwrapping it with `.expect(..)`.","locations":[{"ref":"axum/src/routing/method_routing.rs:673-709","code":"  673 |     pub fn method_filter(&self) -> Option<MethodFilter> {\n  674 |         let Self {\n  675 |             get,\n  676 |             head,\n  677 |             delete,\n  678 |             options,\n  679 |             patch,\n  680 |             post,\n  681 |             put,\n  682 |             trace,\n  683 |             connect,\n  684 |             fallback,\n  685 |             allow_header: _,\n  686 |         } = self;\n  687 | \n  688 |         if !fallback.is_default() {\n  689 |             return None;\n  690 |         }\n  691 | \n  692 |         let filter = [\n  693 |             (get, MethodFilter::GET),\n  694 |             (head, MethodFilter::HEAD),\n  695 |             (delete, MethodFilter::DELETE),\n  696 |             (options, MethodFilter::OPTIONS),\n  697 |             (patch, MethodFilter::PATCH),\n  698 |             (post, MethodFilter::POST),\n  699 |             (put, MethodFilter::PUT),\n  700 |             (trace, MethodFilter::TRACE),\n  701 |             (connect, MethodFilter::CONNECT),\n  702 |         ]\n  703 |         .into_iter()\n  704 |         .filter_map(|(ep, f)| ep.is_some().then_some(f))\n  705 |         .reduce(MethodFilter::or)\n  706 |         .expect(\"can't create a MethodRouter with all-default handlers\");\n  707 | \n  708 |         Some(filter)\n  709 |     }","lines":37,"link":"https://github.com/tokio-rs/axum/blob/98aea470f9190fad1915897166ac0f149522011a/axum/src/routing/method_routing.rs#L673-L709"}]},{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"easy","description":"`test_helpers::test_client::spawn_service` binds a fresh TCP listener and does `tokio::spawn(async move { serve(listener, Shared::new(svc)).await; })` without ever keeping the `JoinHandle`. Since `axum::serve(..)`'s future never completes (`Serve::run` returns `-> !` / `Infallible`), every `TestClient::new(..)` call permanently leaks a background task plus its bound listening socket for the remainder of the process's life - `TestClient` has no `Drop` impl to abort the task or close the listener early. `test_helpers` is compiled whenever `cfg(any(test, feature = \"__private\"))` is active (not just under `#[cfg(test)]`), and `TestClient::new` is called from a very large number of tests across the crate and `axum-extra`, so a single test-binary process accumulates one live listening socket and tokio task per test that uses `TestClient`, for the duration of that test binary's run. This is contained by the test process eventually exiting, but can contribute to file-descriptor pressure/flakiness on machines running many test binaries concurrently (e.g. `cargo nextest` with high parallelism), and is inconsistent with `TestClient` otherwise looking like a disposable, scoped test fixture.","fix":"Store the `JoinHandle` returned by `tokio::spawn` in `TestClient` and abort it (and drop the listener) in a `Drop` impl, e.g.:\n```rust\npub struct TestClient {\n    client: reqwest::Client,\n    addr: SocketAddr,\n    server_task: tokio::task::JoinHandle<()>,\n}\n\nimpl Drop for TestClient {\n    fn drop(&mut self) {\n        self.server_task.abort();\n    }\n}\n```","locations":[{"ref":"axum/src/test_helpers/test_client.rs:11-28","code":"   11 | pub(crate) fn spawn_service<S>(svc: S) -> SocketAddr\n   12 | where\n   13 |     S: Service<Request, Response = Response, Error = Infallible> + Clone + Send + 'static,\n   14 |     S::Future: Send,\n   15 | {\n   16 |     let std_listener = std::net::TcpListener::bind(\"127.0.0.1:0\").unwrap();\n   17 |     std_listener.set_nonblocking(true).unwrap();\n   18 |     let listener = TcpListener::from_std(std_listener).unwrap();\n   19 | \n   20 |     let addr = listener.local_addr().unwrap();\n   21 |     println!(\"Listening on {addr}\");\n   22 | \n   23 |     tokio::spawn(async move {\n   24 |         serve(listener, Shared::new(svc)).await;\n   25 |     });\n   26 | \n   27 |     addr\n   28 | }","lines":18,"link":"https://github.com/tokio-rs/axum/blob/98aea470f9190fad1915897166ac0f149522011a/axum/src/test_helpers/test_client.rs#L11-L28"},{"ref":"axum/src/test_helpers/test_client.rs:35-49","code":"   35 | impl TestClient {\n   36 |     pub fn new<S>(svc: S) -> Self\n   37 |     where\n   38 |         S: Service<Request, Response = Response, Error = Infallible> + Clone + Send + 'static,\n   39 |         S::Future: Send,\n   40 |     {\n   41 |         let addr = spawn_service(svc);\n   42 | \n   43 |         let client = reqwest::Client::builder()\n   44 |             .redirect(reqwest::redirect::Policy::none())\n   45 |             .build()\n   46 |             .unwrap();\n   47 | \n   48 |         Self { client, addr }\n   49 |     }","lines":15,"link":"https://github.com/tokio-rs/axum/blob/98aea470f9190fad1915897166ac0f149522011a/axum/src/test_helpers/test_client.rs#L35-L49"}]},{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`RouteFuture::poll` detects a response to a `CONNECT` request that violates RFC 9110 (a 2xx response must not carry `Content-Length` or `Transfer-Encoding`), logs an `error!`, and replaces the body with `Body::empty()` - but it never removes the offending `Content-Length` / `Transfer-Encoding` headers from the response. The headers stay in `res.headers()` even though the body is now empty. This \"fix\" does not just leave a cosmetically wrong header: hyper's HTTP/1 server encoder (`hyper::proto::h1::role::Server::encode_headers`) sets `wrote_len = true` before encoding headers for any successful response to `CONNECT`, and then, on encountering a `Content-Length` or `Transfer-Encoding` header with `wrote_len` already true, does `warn!(\"unexpected content-length found, canceling\"); rewind(dst); return Err(crate::Error::new_user_header())` (same for `Transfer-Encoding`, see hyper-1.10.1/src/proto/h1/role.rs lines ~688-813). So instead of silently sending a technically non-compliant but working response, axum's current handling causes hyper to abort encoding the response entirely, which surfaces as `\"failed to serve connection\"` in axum's own connection loop (axum/src/serve/mod.rs) and drops the connection. Any handler or middleware that sets `Content-Length` (very common - many response-building helpers/middleware add it automatically, even for empty bodies) on a successful `CONNECT` response (e.g. WebSocket-over-HTTP/2 or a CONNECT-based proxy handler, both explicitly supported use cases in axum) will have the entire response fail to encode instead of just working.","fix":"Actually strip the forbidden headers in addition to emptying the body, e.g.:\n```rust\nif res.headers().contains_key(&CONTENT_LENGTH)\n    || res.headers().contains_key(&header::TRANSFER_ENCODING)\n    || res.size_hint().lower() != 0\n{\n    error!(\"response to CONNECT with nonempty body\");\n    res.headers_mut().remove(CONTENT_LENGTH);\n    res.headers_mut().remove(header::TRANSFER_ENCODING);\n    res = res.map(|_| Body::empty());\n}\n```","locations":[{"ref":"axum/src/routing/route.rs:151-162","code":"  151 |         if *this.method == Method::CONNECT && res.status().is_success() {\n  152 |             // From https://httpwg.org/specs/rfc9110.html#CONNECT:\n  153 |             // > A server MUST NOT send any Transfer-Encoding or\n  154 |             // > Content-Length header fields in a 2xx (Successful)\n  155 |             // > response to CONNECT.\n  156 |             if res.headers().contains_key(&CONTENT_LENGTH)\n  157 |                 || res.headers().contains_key(&header::TRANSFER_ENCODING)\n  158 |                 || res.size_hint().lower() != 0\n  159 |             {\n  160 |                 error!(\"response to CONNECT with nonempty body\");\n  161 |                 res = res.map(|_| Body::empty());\n  162 |             }","lines":12,"link":"https://github.com/tokio-rs/axum/blob/98aea470f9190fad1915897166ac0f149522011a/axum/src/routing/route.rs#L151-L162"}]},{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`FileStream::try_range_response` uses `end == 0` as a sentinel meaning \"unspecified, use file_size - 1\". This collides with a legitimate HTTP range request for exactly the first byte (`Range: bytes=0-0`), which is a valid range meaning \"just byte 0\". When such a request is translated into `start = 0, end = 0`, the function silently treats `end` as \"not specified\" and expands it to `total_size - 1`, returning the entire file instead of the single requested byte. This is a functional/logic bug baked into the API's use of `0` as a magic value instead of an `Option<u64>`.","fix":"Change the `end` parameter to `Option<u64>` so \"unspecified\" and \"explicitly 0\" can be distinguished:\n```rust\npub async fn try_range_response(\n    file_path: impl AsRef<Path>,\n    start: u64,\n    end: Option<u64>,\n) -> io::Result<Response> {\n    ...\n    let end = end.unwrap_or(total_size - 1);\n    ...\n}\n```\nThis requires updating callers (including the doc examples and the `range_stream` test helper) to pass `None` instead of `0` when no explicit end is given.","locations":[{"ref":"axum-extra/src/response/file_stream.rs:184-217","code":"  184 |     pub async fn try_range_response(\n  185 |         file_path: impl AsRef<Path>,\n  186 |         start: u64,\n  187 |         mut end: u64,\n  188 |     ) -> io::Result<Response> {\n  189 |         let mut file = File::open(file_path).await?;\n  190 | \n  191 |         let metadata = file.metadata().await?;\n  192 |         let total_size = metadata.len();\n  193 | \n  194 |         if total_size == 0 {\n  195 |             return Ok((StatusCode::RANGE_NOT_SATISFIABLE, \"Range Not Satisfiable\").into_response());\n  196 |         }\n  197 | \n  198 |         if end == 0 {\n  199 |             end = total_size - 1;\n  200 |         }\n  201 | \n  202 |         if start > total_size {\n  203 |             return Ok((StatusCode::RANGE_NOT_SATISFIABLE, \"Range Not Satisfiable\").into_response());\n  204 |         }\n  205 |         if start > end {\n  206 |             return Ok((StatusCode::RANGE_NOT_SATISFIABLE, \"Range Not Satisfiable\").into_response());\n  207 |         }\n  208 |         if end >= total_size {\n  209 |             return Ok((StatusCode::RANGE_NOT_SATISFIABLE, \"Range Not Satisfiable\").into_response());\n  210 |         }\n  211 | \n  212 |         file.seek(std::io::SeekFrom::Start(start)).await?;\n  213 | \n  214 |         let stream = ReaderStream::new(file.take(end - start + 1));\n  215 | \n  216 |         Ok(FileStream::new(stream).into_range_response(start, end, total_size))\n  217 |     }","lines":34,"link":"https://github.com/tokio-rs/axum/blob/98aea470f9190fad1915897166ac0f149522011a/axum-extra/src/response/file_stream.rs#L184-L217"}]},{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`Form`'s documentation and its own `from_request` (axum/src/form.rs:80-96) treat `GET` and `HEAD` requests identically for the purpose of choosing \"read from query string\" vs \"read from body\" (`is_get_or_head = method == GET || method == HEAD`), matching the documented behavior: \"If the request has a method of `GET` or `HEAD`, the form data will be read from the query string\". However the actual data-source decision is delegated to `RawForm::from_request` (axum/src/extract/raw_form.rs:38-52), which only special-cases `Method::GET`:\n```rust\nif req.method() == Method::GET {\n    ... read from query ...\n} else {\n    ... require `application/x-www-form-urlencoded` content-type and read the body ...\n}\n```\nFor a `HEAD` request, this falls into the `else` branch: it now requires an\n`application/x-www-form-urlencoded` `Content-Type` header and attempts to read the request body (which is\ntypically absent for HEAD requests), incorrectly returning `InvalidFormContentType` (415) instead of\nreading the query string as documented. Since axum keeps `req.method()` as `HEAD` all the way through\nhandler execution (the method is only used to zero out the response body afterwards in\n`routing/route.rs`), a `Form<T>` extractor used on a route that also serves `HEAD` (e.g. via `get(...)`,\nwhich tower/axum auto-services `HEAD` for) will misbehave for `HEAD` requests.","fix":"Make `RawForm::from_request` treat `GET` and `HEAD` the same way `Form::from_request` assumes it does:\n```rust\nif req.method() == Method::GET || req.method() == Method::HEAD {\n    if let Some(query) = req.uri().query() {\n        return Ok(Self(Bytes::copy_from_slice(query.as_bytes())));\n    }\n    Ok(Self(Bytes::new()))\n} else {\n    ...\n}\n```\nAlso update `RawForm`'s doc comment (\"For `GET` requests it will extract the raw query...\") to mention\n`HEAD` as well, so the two extractors stay consistent.","locations":[{"ref":"axum/src/extract/raw_form.rs:38-52","code":"   38 |     async fn from_request(req: Request, state: &S) -> Result<Self, Self::Rejection> {\n   39 |         if req.method() == Method::GET {\n   40 |             if let Some(query) = req.uri().query() {\n   41 |                 return Ok(Self(Bytes::copy_from_slice(query.as_bytes())));\n   42 |             }\n   43 | \n   44 |             Ok(Self(Bytes::new()))\n   45 |         } else {\n   46 |             if !has_content_type(req.headers(), &mime::APPLICATION_WWW_FORM_URLENCODED) {\n   47 |                 return Err(InvalidFormContentType.into());\n   48 |             }\n   49 | \n   50 |             Ok(Self(Bytes::from_request(req, state).await?))\n   51 |         }\n   52 |     }","lines":15,"link":"https://github.com/tokio-rs/axum/blob/98aea470f9190fad1915897166ac0f149522011a/axum/src/extract/raw_form.rs#L38-L52"},{"ref":"axum/src/form.rs:80-96","code":"   80 |     async fn from_request(req: Request, _state: &S) -> Result<Self, Self::Rejection> {\n   81 |         let is_get_or_head =\n   82 |             req.method() == http::Method::GET || req.method() == http::Method::HEAD;\n   83 | \n   84 |         match req.extract().await {\n   85 |             Ok(RawForm(bytes)) => {\n   86 |                 let deserializer =\n   87 |                     serde_html_form::Deserializer::new(form_urlencoded::parse(&bytes));\n   88 |                 let value = serde_path_to_error::deserialize(deserializer).map_err(\n   89 |                     |err| -> FormRejection {\n   90 |                         if is_get_or_head {\n   91 |                             FailedToDeserializeForm::from_err(err).into()\n   92 |                         } else {\n   93 |                             FailedToDeserializeFormBody::from_err(err).into()\n   94 |                         }\n   95 |                     },\n   96 |                 )?;","lines":17,"link":"https://github.com/tokio-rs/axum/blob/98aea470f9190fad1915897166ac0f149522011a/axum/src/form.rs#L80-L96"}]},{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`body_to_bytes_mut` (used by the `BytesMut` extractor) stops buffering as soon as it encounters the first non-data frame, silently returning `Ok(())` and discarding any subsequent frames. This differs from `Bytes::from_request` (which uses `BodyExt::collect`, aggregating all data frames regardless of interleaved non-data frames) and from `BodyDataStream::poll_next` in axum-core/src/body.rs, which explicitly skips non-data frames with `Err(_frame) => {}` and keeps polling. For well-behaved HTTP bodies where trailers only ever appear last this is harmless, but the `http_body::Body` trait does not guarantee that ordering, so a custom `Body` impl that interleaves a non-data frame before all data has been produced would cause `BytesMut::from_request` to silently truncate the body, unlike the `Bytes` extractor which would still collect everything.","fix":"Continue the loop instead of returning early on a non-data frame, mirroring `BodyDataStream::poll_next`:\n```rust\nlet Ok(data) = frame.into_data() else {\n    continue;\n};\nbytes.put(data);\n```","locations":[{"ref":"axum-core/src/extract/request_parts.rs:84-98","code":"   84 | async fn body_to_bytes_mut(body: &mut Body, bytes: &mut BytesMut) -> Result<(), BytesRejection> {\n   85 |     while let Some(frame) = body\n   86 |         .frame()\n   87 |         .await\n   88 |         .transpose()\n   89 |         .map_err(FailedToBufferBody::from_err)?\n   90 |     {\n   91 |         let Ok(data) = frame.into_data() else {\n   92 |             return Ok(());\n   93 |         };\n   94 |         bytes.put(data);\n   95 |     }\n   96 | \n   97 |     Ok(())\n   98 | }","lines":15,"link":"https://github.com/tokio-rs/axum/blob/98aea470f9190fad1915897166ac0f149522011a/axum-core/src/extract/request_parts.rs#L84-L98"}]},{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`Event::data()`/`Event::json_data()` (via `EventDataWriter::write_buf`) are documented as \"Panics if any `data` has already been written before\" (see the doc comments on `Event::data` and `Event::json_data`), but `write_buf` short-circuits on an empty input buffer before the `HAS_DATA` re-entry check runs:\n```rust\nfn write_buf(&mut self, buf: &[u8]) -> usize {\n    if buf.is_empty() {\n        return 0;\n    }\n    ...\n    if !std::mem::replace(&mut self.data_written, true) {\n        if self.event.flags.contains(EventFlags::HAS_DATA) {\n            panic!(\"Called `Event::data*` multiple times\");\n        }\n        ...\n    }\n```\nAs a result, `Event::default().data(\"first\").data(\"\")` does **not** panic even though data was already written, silently violating the documented invariant (verified with a temporary `#[should_panic]` test that failed because no panic occurred). Any caller relying on the documented panic-on-reuse behavior to catch accidental double-writes of `data` can be fooled by passing/receiving an empty string on the second call.","fix":"Move the empty-buffer fast path after the `HAS_DATA`/`data_written` invariant check (or perform the check unconditionally before the early return), e.g.:\n```rust\nfn write_buf(&mut self, buf: &[u8]) -> usize {\n    if !std::mem::replace(&mut self.data_written, true) {\n        if self.event.flags.contains(EventFlags::HAS_DATA) {\n            panic!(\"Called `Event::data*` multiple times\");\n        }\n        if buf.is_empty() {\n            return 0;\n        }\n        let buffer = self.event.buffer.as_mut();\n        let _ = buffer.write_str(\"data: \");\n        self.event.flags.insert(EventFlags::HAS_DATA);\n    } else if buf.is_empty() {\n        return 0;\n    }\n    ...\n}\n```\n(adjust so the `HAS_DATA`/reuse panic always fires on the first write attempt of a new writer, regardless of whether that first write happens to be empty).","locations":[{"ref":"axum/src/response/sse.rs:237-244","code":"  237 |     pub fn data<T>(self, data: T) -> Self\n  238 |     where\n  239 |         T: AsRef<str>,\n  240 |     {\n  241 |         let mut writer = self.into_data_writer();\n  242 |         let _ = writer.write_str(data.as_ref());\n  243 |         writer.into_event()\n  244 |     }","lines":8,"link":"https://github.com/tokio-rs/axum/blob/98aea470f9190fad1915897166ac0f149522011a/axum/src/response/sse.rs#L237-L244"},{"ref":"axum/src/response/sse.rs:442-456","code":"  442 |     fn write_buf(&mut self, buf: &[u8]) -> usize {\n  443 |         if buf.is_empty() {\n  444 |             return 0;\n  445 |         }\n  446 | \n  447 |         let buffer = self.event.buffer.as_mut();\n  448 | \n  449 |         if !std::mem::replace(&mut self.data_written, true) {\n  450 |             if self.event.flags.contains(EventFlags::HAS_DATA) {\n  451 |                 panic!(\"Called `Event::data*` multiple times\");\n  452 |             }\n  453 | \n  454 |             let _ = buffer.write_str(\"data: \");\n  455 |             self.event.flags.insert(EventFlags::HAS_DATA);\n  456 |         }","lines":15,"link":"https://github.com/tokio-rs/axum/blob/98aea470f9190fad1915897166ac0f149522011a/axum/src/response/sse.rs#L442-L456"}]},{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"`append_allow_header` avoids adding a duplicate method name to the `Allow` header by checking `s.contains(method)`, i.e. a plain substring search over the whole accumulated header value rather than a token-aware match:\n```rust\nAllowHeader::Bytes(allow_header) => {\n    if let Ok(s) = std::str::from_utf8(allow_header) {\n        if !s.contains(method) {\n            allow_header.extend_from_slice(b\",\");\n            allow_header.extend_from_slice(method.as_bytes());\n        }\n    } else { ... }\n}\n```\nThis happens to be safe today only because none of the nine fixed `MethodFilter` method name strings (\"CONNECT\", \"DELETE\", \"GET\", \"HEAD\", \"OPTIONS\", \"PATCH\", \"POST\", \"PUT\", \"TRACE\") is a substring of another. It is a fragile invariant tied to the current fixed set of constants rather than an explicit, robust \"is this token already present\" check (e.g. split on `,` and compare exactly), so it would silently start producing incorrect/duplicated `Allow` headers if a method name were ever added or changed such that one name became a substring of another (or of a combination like an already-joined \"GET,HEAD\").","fix":"Compare against comma-separated tokens instead of doing a raw substring search, e.g.:\n```rust\nAllowHeader::Bytes(allow_header) => {\n    if let Ok(s) = std::str::from_utf8(allow_header) {\n        if !s.split(',').any(|existing| existing == method) {\n            allow_header.extend_from_slice(b\",\");\n            allow_header.extend_from_slice(method.as_bytes());\n        }\n    } else {\n        #[cfg(debug_assertions)]\n        panic!(\"`allow_header` contained invalid utf-8. This should never happen\")\n    }\n}\n```","locations":[{"ref":"axum/src/routing/method_routing.rs:1225-1243","code":" 1225 | fn append_allow_header(allow_header: &mut AllowHeader, method: &'static str) {\n 1226 |     match allow_header {\n 1227 |         AllowHeader::None => {\n 1228 |             *allow_header = AllowHeader::Bytes(BytesMut::from(method));\n 1229 |         }\n 1230 |         AllowHeader::Skip => {}\n 1231 |         AllowHeader::Bytes(allow_header) => {\n 1232 |             if let Ok(s) = std::str::from_utf8(allow_header) {\n 1233 |                 if !s.contains(method) {\n 1234 |                     allow_header.extend_from_slice(b\",\");\n 1235 |                     allow_header.extend_from_slice(method.as_bytes());\n 1236 |                 }\n 1237 |             } else {\n 1238 |                 #[cfg(debug_assertions)]\n 1239 |                 panic!(\"`allow_header` contained invalid utf-8. This should never happen\")\n 1240 |             }\n 1241 |         }\n 1242 |     }\n 1243 | }","lines":19,"link":"https://github.com/tokio-rs/axum/blob/98aea470f9190fad1915897166ac0f149522011a/axum/src/routing/method_routing.rs#L1225-L1243"}]},{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"The error message generated by `check_extractor_count` in axum-macros/src/debug_handler.rs suggests nesting extractors with `(a, b): (ExtractorA, ExtractorA)` - the second element of the example tuple repeats `ExtractorA` instead of using a distinct placeholder name like `ExtractorB`. This is a copy-paste typo in the compiler-facing error message shown to users when a handler/middleware takes more than 16 extractor arguments, making the example slightly confusing (it looks like both extractor types must be the same).","fix":"Rename the second placeholder in the example, e.g.:\n```rust\nlet error_message = format!(\n    \"{} cannot take more than {max_extractors} arguments. \\\n    Use `(a, b): (ExtractorA, ExtractorB)` to further nest extractors\",\n    kind.name_uppercase_plural(),\n);\n```","locations":[{"ref":"axum-macros/src/debug_handler.rs:153-161","code":"  153 |     } else {\n  154 |         let error_message = format!(\n  155 |             \"{} cannot take more than {max_extractors} arguments. \\\n  156 |             Use `(a, b): (ExtractorA, ExtractorA)` to further nest extractors\",\n  157 |             kind.name_uppercase_plural(),\n  158 |         );\n  159 |         let error = syn::Error::new_spanned(&item_fn.sig.inputs, error_message).to_compile_error();\n  160 |         Some(error)\n  161 |     }","lines":9,"link":"https://github.com/tokio-rs/axum/blob/98aea470f9190fad1915897166ac0f149522011a/axum-macros/src/debug_handler.rs#L153-L161"}]},{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`set_cookies` silently drops any cookie whose `encoded()` representation fails to parse into a valid `HeaderValue` (e.g. a name/value containing characters that are illegal in an HTTP header). Because `IntoResponseParts::into_response_parts` for the cookie jars uses `Infallible` as its error type, there is no way for the caller to learn that one of the cookies they added via `.add(...)` was never actually sent in the response - it just vanishes from the `Set-Cookie` headers with no error, log, or panic.","fix":"At minimum, emit a `tracing::warn!` (or similar) when a cookie fails to encode into a header value so the failure isn't completely silent, e.g.:\n```rust\nfor cookie in jar.delta() {\n    match cookie.encoded().to_string().parse() {\n        Ok(header_value) => headers.append(SET_COOKIE, header_value),\n        Err(_) => tracing::warn!(\"failed to encode cookie {:?} as a header value\", cookie.name()),\n    }\n}\n```","locations":[{"ref":"axum-extra/src/extract/cookie/mod.rs:231-240","code":"  231 | fn set_cookies(jar: &cookie::CookieJar, headers: &mut HeaderMap) {\n  232 |     for cookie in jar.delta() {\n  233 |         if let Ok(header_value) = cookie.encoded().to_string().parse() {\n  234 |             headers.append(SET_COOKIE, header_value);\n  235 |         }\n  236 |     }\n  237 | \n  238 |     // we don't need to call `jar.reset_delta()` because `into_response_parts` consumes the cookie\n  239 |     // jar so it cannot be called multiple times.\n  240 | }","lines":10,"link":"https://github.com/tokio-rs/axum/blob/98aea470f9190fad1915897166ac0f149522011a/axum-extra/src/extract/cookie/mod.rs#L231-L240"}]},{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"Path deserialization errors that indicate a route/type-definition problem (a programmer error) are\ninconsistently classified. `ErrorKind::UnsupportedType` (e.g. nested `Vec<Vec<T>>`) is correctly treated\nas `500 Internal Server Error` in `FailedToDeserializePathParams::status` (axum/src/extract/path/mod.rs:\n436-450), since it stems from how the handler declared its extractor type, not from user input. However\nthe \"array types are not supported\" error, raised via `PathDeserializationError::custom(...)` in\n`ValueDeserializer`'s tuple `PairDeserializer::next_element_seed` (axum/src/extract/path/de.rs:456-461)\nfor the exact same class of problem (an unsupported shape for `Path<...>`, as shown by the\n`regression_3038` test with `[char; 2]` fields), is wrapped in `ErrorKind::Message` and is therefore\nclassified as `400 Bad Request` (axum/src/extract/path/mod.rs:439-450). This misleads API clients into\nthinking their request was malformed when the actual cause is the handler's extractor type definition.","fix":"Give this failure its own `ErrorKind` variant (or reuse `UnsupportedType`) instead of routing it through\nthe generic `custom()`/`Message` path, so `FailedToDeserializePathParams::status` classifies it as `500\nInternal Server Error` like other type-shape errors, e.g.:\n```rust\nSome(KeyOrIdx::Key(_)) => {\n    return Err(PathDeserializationError::unsupported_type(\"array (nested tuple value)\"));\n}\n```","locations":[{"ref":"axum/src/extract/path/de.rs:453-461","code":"  453 |                 match self.key.take() {\n  454 |                     Some(KeyOrIdx::Idx { idx: _, key }) => {\n  455 |                         return seed.deserialize(KeyDeserializer { key }).map(Some);\n  456 |                     }\n  457 |                     Some(KeyOrIdx::Key(_)) => {\n  458 |                         return Err(PathDeserializationError::custom(\n  459 |                             \"array types are not supported\",\n  460 |                         ));\n  461 |                     }","lines":9,"link":"https://github.com/tokio-rs/axum/blob/98aea470f9190fad1915897166ac0f149522011a/axum/src/extract/path/de.rs#L453-L461"},{"ref":"axum/src/extract/path/mod.rs:436-450","code":"  436 |     /// Get the status code used for this rejection.\n  437 |     #[must_use]\n  438 |     pub fn status(&self) -> StatusCode {\n  439 |         match self.0.kind {\n  440 |             ErrorKind::Message(_)\n  441 |             | ErrorKind::DeserializeError { .. }\n  442 |             | ErrorKind::InvalidUtf8InPathParam { .. }\n  443 |             | ErrorKind::ParseError { .. }\n  444 |             | ErrorKind::ParseErrorAtIndex { .. }\n  445 |             | ErrorKind::ParseErrorAtKey { .. } => StatusCode::BAD_REQUEST,\n  446 |             ErrorKind::WrongNumberOfParameters { .. } | ErrorKind::UnsupportedType { .. } => {\n  447 |                 StatusCode::INTERNAL_SERVER_ERROR\n  448 |             }\n  449 |         }\n  450 |     }","lines":15,"link":"https://github.com/tokio-rs/axum/blob/98aea470f9190fad1915897166ac0f149522011a/axum/src/extract/path/mod.rs#L436-L450"}]},{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`BytesMut::from_request` builds up the buffer by repeatedly calling `BytesMut::put` starting from `BytesMut::new()` (zero capacity), so for large request bodies the buffer will be reallocated/copied several times as it grows. `Bytes::from_request`, by contrast, uses `http_body_util::BodyExt::collect`, which can size its buffer more efficiently. Since this extractor is meant to buffer whole request bodies (potentially multiple MB, up to the configured body limit), the missing capacity reservation is an avoidable performance cost.","fix":"Reserve capacity up front using the body's size hint before looping, e.g. `let mut bytes = BytesMut::with_capacity(body.size_hint().lower() as usize);` (or call `bytes.reserve(data.len())` per frame if an upfront hint isn't available).","locations":[{"ref":"axum-core/src/extract/request_parts.rs:69-98","code":"   69 | impl<S> FromRequest<S> for BytesMut\n   70 | where\n   71 |     S: Send + Sync,\n   72 | {\n   73 |     type Rejection = BytesRejection;\n   74 | \n   75 |     async fn from_request(req: Request, _: &S) -> Result<Self, Self::Rejection> {\n   76 |         let mut body = req.into_limited_body();\n   77 |         #[allow(clippy::use_self)]\n   78 |         let mut bytes = BytesMut::new();\n   79 |         body_to_bytes_mut(&mut body, &mut bytes).await?;\n   80 |         Ok(bytes)\n   81 |     }\n   82 | }\n   83 | \n   84 | async fn body_to_bytes_mut(body: &mut Body, bytes: &mut BytesMut) -> Result<(), BytesRejection> {\n   85 |     while let Some(frame) = body\n   86 |         .frame()\n   87 |         .await\n   88 |         .transpose()\n   89 |         .map_err(FailedToBufferBody::from_err)?\n   90 |     {\n   91 |         let Ok(data) = frame.into_data() else {\n   92 |             return Ok(());\n   93 |         };\n   94 |         bytes.put(data);\n   95 |     }\n   96 | \n   97 |     Ok(())\n   98 | }","lines":30,"link":"https://github.com/tokio-rs/axum/blob/98aea470f9190fad1915897166ac0f149522011a/axum-core/src/extract/request_parts.rs#L69-L98"}]},{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"`util::Either<A, B>` (a `pin_project!`-generated enum with `#[project = EitherProj]`) is defined but never constructed or referenced anywhere else in the `axum` crate (verified with a repo-wide grep for `Either` and `EitherProj` outside of `util.rs`; the only other `Either` types in the workspace live in the unrelated `axum-extra` crate's `axum_extra::either` module). It is `pub(crate)`, so it cannot be used from outside the crate either. This is leftover/dead code that adds an unused pin-projected type (with its own generated `EitherProj` and `Unpin` impls) to the compiled crate for no benefit, and can confuse future readers into thinking it's used somewhere.","fix":"Remove the unused `Either`/`EitherProj` type from `axum/src/util.rs` (or, if it was added in preparation for a future use, wire it up or move it behind `#[cfg(test)]`/leave a tracking comment).","locations":[{"ref":"axum/src/util.rs:40-46","code":"   40 | pin_project! {\n   41 |     #[project = EitherProj]\n   42 |     pub(crate) enum Either<A, B> {\n   43 |         A { #[pin] inner: A },\n   44 |         B { #[pin] inner: B },\n   45 |     }\n   46 | }","lines":7,"link":"https://github.com/tokio-rs/axum/blob/98aea470f9190fad1915897166ac0f149522011a/axum/src/util.rs#L40-L46"}]},{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The `# Return Value` doc sections for `serve()`/`Serve` and `WithGracefulShutdown` both still say \"this future resolves to `io::Result<()>`\" (and that it \"will never actually complete or return an error\" / \"returns `Ok(())`\"), but the actual `IntoFuture::Output` types are `Infallible` (for plain `Serve`) and `()` (for `WithGracefulShutdown`) - there is no `Result` involved at all any more. This became stale in commit f3a95d78 (\"Fix return types of serve futures\", #3601), which changed `type Output = io::Result<()>` to `Infallible`/`()` and removed the `.unwrap()` calls from every doctest/example in this file, but left the prose in the two `# Return Value` sections unchanged, so the documentation now contradicts the actual API (callers reading the docs would expect to be able to call `.unwrap()` or match on `Ok`/`Err`, which no longer compiles).","fix":"Update both doc blocks to match the real return types, e.g.:\n```rust\n/// # Return Value\n///\n/// This future's output type is `Infallible`; it never actually completes or returns. Errors on /// the TCP socket will be handled by sleeping for a short while (currently, one second).\n```\nand for `with_graceful_shutdown`:\n```rust\n/// # Return Value\n///\n/// Similarly to [`serve`], this future never returns an error. It resolves to `()` only after /// the `signal` future completes and all in-flight connections have finished.\n```","locations":[{"ref":"axum/src/serve/mod.rs:88-92","code":"   88 | /// # Return Value\n   89 | ///\n   90 | /// Although this future resolves to `io::Result<()>`, it will never actually complete or return an\n   91 | /// error. Errors on the TCP socket will be handled by sleeping for a short while (currently, one\n   92 | /// second).","lines":5,"link":"https://github.com/tokio-rs/axum/blob/98aea470f9190fad1915897166ac0f149522011a/axum/src/serve/mod.rs#L88-L92"},{"ref":"axum/src/serve/mod.rs:233-236","code":"  233 |     /// # Return Value\n  234 |     ///\n  235 |     /// Similarly to [`serve`], although this future resolves to `io::Result<()>`, it will never\n  236 |     /// error. It returns `Ok(())` only after the `signal` future completes.","lines":4,"link":"https://github.com/tokio-rs/axum/blob/98aea470f9190fad1915897166ac0f149522011a/axum/src/serve/mod.rs#L233-L236"}]},{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"hard","description":"`PrivateCookieJar` and `SignedCookieJar` are near-identical implementations (struct definition, `Debug` impl, `FromRequestParts` impl, `from_headers`/`new` constructors, `get`/`remove`/`add` methods, private iterator type, and `Clone` impl) differing only in `decrypt`/`private_jar` vs `verify`/`signed_jar` naming and which `cookie` crate wrapper (`PrivateJar` vs `SignedJar`) is used. This is well over 150 lines of duplicated structure/logic maintained in two places; any bug fix or behavioral change (e.g. to `from_headers`, the constructors, or the iterator) has to be applied twice and can easily drift out of sync between the two files.","fix":"Factor the shared jar logic (encode/decode-agnostic parts: struct shape, FromRequestParts impl, get/remove/add, iterator, Clone) into a small generic helper/trait parameterized over the `cookie` crate's `PrivateJar`/`SignedJar` wrapper (or a local trait with `fn verify_or_decrypt`), and have `PrivateCookieJar`/`SignedCookieJar` be thin wrappers over it.","locations":[{"ref":"axum-extra/src/extract/cookie/private.rs:108-316","code":"  108 | pub struct PrivateCookieJar<K = Key> {\n  109 |     jar: cookie::CookieJar,\n  110 |     key: Key,\n  111 |     // The key used to extract the key. Allows users to use multiple keys for different\n  112 |     // jars. Maybe a library wants its own key.\n  113 |     _marker: PhantomData<K>,\n  114 | }\n  115 | \n  116 | impl<K> fmt::Debug for PrivateCookieJar<K> {\n  117 |     fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {\n  118 |         f.debug_struct(\"PrivateCookieJar\")\n  119 |             .field(\"jar\", &self.jar)\n  120 |             .field(\"key\", &\"REDACTED\")\n  121 |             .finish()\n  122 |     }\n  123 | }\n  124 | \n  125 | impl<S, K> FromRequestParts<S> for PrivateCookieJar<K>\n  126 | where\n  127 |     S: Send + Sync,\n  128 |     K: FromRef<S> + Into<Key>,\n  129 | {\n  130 |     type Rejection = Infallible;\n  131 | \n  132 |     async fn from_request_parts(parts: &mut Parts, state: &S) -> Result<Self, Self::Rejection> {\n  133 |         let k = K::from_ref(state);\n  134 |         let key = k.into();\n  135 |         let PrivateCookieJar {\n  136 |             jar,\n  137 |             key,\n  138 |             _marker: _,\n  139 |         } = PrivateCookieJar::from_headers(&parts.headers, key);\n  140 |         Ok(Self {\n  141 |             jar,\n  142 |             key,\n  143 |             _marker: PhantomData,\n  144 |         })\n  145 |     }\n  146 | }\n  147 | \n  148 | impl PrivateCookieJar {\n  149 |     /// Create a new `PrivateCookieJar` from a map of request headers.\n  150 |     ///\n  151 |     /// The valid cookies in `headers` will be added to the jar.\n  152 |     ///\n  153 |     /// This is intended to be used in middleware and other places where it might be difficult to\n  154 |     /// run extractors. Normally you should create `PrivateCookieJar`s through [`FromRequestParts`].\n  155 |     ///\n  156 |     /// [`FromRequestParts`]: axum::extract::FromRequestParts\n  157 |     pub fn from_headers(headers: &HeaderMap, key: Key) -> Self {\n  158 |         let mut jar = cookie::CookieJar::new();\n  159 |         let mut private_jar = jar.private_mut(&key);\n  160 |         for cookie in cookies_from_request(headers) {\n  161 |             if let Some(cookie) = private_jar.decrypt(cookie) {\n  162 |                 private_jar.add_original(cookie);\n  163 |             }\n  164 |         }\n  165 | \n  166 |         Self {\n  167 |             jar,\n  168 |             key,\n  169 |             _marker: PhantomData,\n  170 |         }\n  171 |     }\n  172 | \n  173 |     /// Create a new empty `PrivateCookieJarIter`.\n  174 |     ///\n  175 |     /// This is intended to be used in middleware and other places where it might be difficult to\n  176 |     /// run extractors. Normally you should create `PrivateCookieJar`s through [`FromRequestParts`].\n  177 |     ///\n  178 |     /// [`FromRequestParts`]
