<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

<script type="application/json" id="D">[{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`print_loc` calls `Path::new(file).file_name().unwrap()` when `--basenames`/`-s` is\ngiven. `Path::file_name` returns `None` for an empty path, for `/`, and for any path whose last\ncomponent is `..`, so the `.unwrap()` panics instead of printing something. All three shapes are\nreachable from ordinary DWARF: `render_file` in `src/line.rs` starts with an empty `String` when the\nunit has no `DW_AT_comp_dir` and appends the file-table entry verbatim, so a file entry with an empty\n`DW_AT_name` yields `\"\"`. In addition `Lines::parse` pushes `String::from(\"\")` as `files[0]` whenever\n`header.file(0)` is `None` (DWARF <= 4), and a line program that executes `DW_LNS_set_file 0` then\nmakes `Location::file` be `Some(\"\")`. Result: `addr2line -e <file> -s <addr>` aborts with a panic on a\nmalformed or merely unusual binary.","fix":"Fall back to the full path when there is no final component:\n\n```\nlet path = if basenames {\n    Path::new(file).file_name().map_or_else(|| Path::new(file.as_ref()), Path::new)\n} else {\n    Path::new(file)\n};\n```\n\nSeparately, `Lines::parse` should keep the \"no file 0\" case distinguishable from a real empty name\n(e.g. store `Option<String>`) so that `row_location` reports `file: None` rather than `Some(\"\")`.","locations":[{"ref":"src/bin/addr2line.rs:49-60","code":"   49 | fn print_loc(loc: Option<&Location<'_>>, basenames: bool, llvm: bool) {\n   50 |     if let Some(loc) = loc {\n   51 |         if let Some(ref file) = loc.file.as_ref() {\n   52 |             let path = if basenames {\n   53 |                 Path::new(Path::new(file).file_name().unwrap())\n   54 |             } else {\n   55 |                 Path::new(file)\n   56 |             };\n   57 |             print!(\"{}:\", path.display());\n   58 |         } else {\n   59 |             print!(\"??:\");\n   60 |         }","lines":12,"link":"https://github.com/gimli-rs/addr2line/blob/3f879946d8818d91079b5d19d5b4f0a130a17758/src/bin/addr2line.rs#L49-L60"},{"ref":"src/line.rs:101-111","code":"  101 |         let mut files = Vec::new();\n  102 |         let header = rows.header();\n  103 |         match header.file(0) {\n  104 |             Some(file) => files.push(render_file(dw_unit, file, header)?),\n  105 |             None => files.push(String::from(\"\")), // DWARF version <= 4 may not have 0th index\n  106 |         }\n  107 |         let mut index = 1;\n  108 |         while let Some(file) = header.file(index) {\n  109 |             files.push(render_file(dw_unit, file, header)?);\n  110 |             index += 1;\n  111 |         }","lines":11,"link":"https://github.com/gimli-rs/addr2line/blob/3f879946d8818d91079b5d19d5b4f0a130a17758/src/line.rs#L101-L111"},{"ref":"src/line.rs:258-288","code":"  258 | fn render_file<R: gimli::Reader>(\n  259 |     dw_unit: gimli::UnitRef<R>,\n  260 |     file: &gimli::FileEntry<R, R::Offset>,\n  261 |     header: &gimli::LineProgramHeader<R, R::Offset>,\n  262 | ) -> Result<String, gimli::Error> {\n  263 |     let mut path = if let Some(ref comp_dir) = dw_unit.comp_dir {\n  264 |         comp_dir.to_string_lossy()?.into_owned()\n  265 |     } else {\n  266 |         String::new()\n  267 |     };\n  268 | \n  269 |     // The directory index 0 is defined to correspond to the compilation unit directory.\n  270 |     if file.directory_index() != 0 {\n  271 |         if let Some(directory) = file.directory(header) {\n  272 |             path_push(\n  273 |                 &mut path,\n  274 |                 dw_unit.attr_string(directory)?.to_string_lossy()?.as_ref(),\n  275 |             );\n  276 |         }\n  277 |     }\n  278 | \n  279 |     path_push(\n  280 |         &mut path,\n  281 |         dw_unit\n  282 |             .attr_string(file.path_name())?\n  283 |             .to_string_lossy()?\n  284 |             .as_ref(),\n  285 |     );\n  286 | \n  287 |     Ok(path)\n  288 | }","lines":31,"link":"https://github.com/gimli-rs/addr2line/blob/3f879946d8818d91079b5d19d5b4f0a130a17758/src/line.rs#L258-L288"}]},{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`Function::parse` does `entries.read_abbreviation()?.unwrap()`. `read_abbreviation`\nreturns `Ok(None)` for a null DIE (abbreviation code 0). Today this cannot fire because\n`dw_die_offset` always comes from `Functions::parse`, which only records offsets where\n`read_abbreviation` already returned `Some` - but that invariant is undocumented and spans two\nfunctions in two different lazily-evaluated caches. The neighbouring `debug_assert_eq!` on the tag is\nlikewise compiled out in release, so a mismatch silently parses a non-subprogram DIE as a function.","fix":"Return an error instead of panicking, and check the tag unconditionally:\n\n```\nlet Some(abbrev) = entries.read_abbreviation()? else {\n    return Err(gimli::Error::NoEntryAtGivenOffset(dw_die_offset.0.into_u64()));\n};\nif abbrev.tag() != gimli::DW_TAG_subprogram {\n    return Err(gimli::Error::UnexpectedNull);\n}\n```","locations":[{"ref":"src/function.rs:205-208","code":"  205 |         let mut entries = unit.entries_raw(Some(dw_die_offset))?;\n  206 |         let depth = entries.next_depth();\n  207 |         let abbrev = entries.read_abbreviation()?.unwrap();\n  208 |         debug_assert_eq!(abbrev.tag(), gimli::DW_TAG_subprogram);","lines":4,"link":"https://github.com/gimli-rs/addr2line/blob/3f879946d8818d91079b5d19d5b4f0a130a17758/src/function.rs#L205-L208"}]},{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"`LoaderRelocationMap::add` prints a diagnostic when a relocation cannot be added, and\nthat diagnostic calls `section.name().unwrap()`. `object::Section::name` returns a `Result` and fails\nfor a section whose name is not valid UTF-8 or whose name string offset is out of range. So a\nmalformed object file that has both a bad relocation and a bad section name turns a warning into a\npanic - inside code whose whole purpose is to degrade gracefully.","fix":"Replace\n\n```\nsection.name().unwrap(),\n```\n\nwith\n\n```\nsection.name().unwrap_or(\"<invalid>\"),\n```","locations":[{"ref":"src/loader.rs:486-501","code":"  486 |     fn add(&mut self, file: &object::File, section: &object::Section) {\n  487 |         let mut warned = false;\n  488 |         for (offset, relocation) in section.relocations() {\n  489 |             if let Err(e) = self.0.add(file, offset, relocation) {\n  490 |                 if !warned {\n  491 |                     warned = true;\n  492 |                     std::eprintln!(\n  493 |                         \"Relocation error for section {} at offset 0x{:08x}: {}\",\n  494 |                         section.name().unwrap(),\n  495 |                         offset,\n  496 |                         e\n  497 |                     );\n  498 |                 }\n  499 |             }\n  500 |         }\n  501 |     }","lines":16,"link":"https://github.com/gimli-rs/addr2line/blob/3f879946d8818d91079b5d19d5b4f0a130a17758/src/loader.rs#L486-L501"}]},{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`LineLocationRangeIter::next` computes the length of an instruction range as\n`nextaddr - row.address`, where `nextaddr` is either the next row's address or `seq.end`. Nothing in\n`Lines::parse` enforces that row addresses inside a sequence are monotonically increasing - rows are\npushed in line-program execution order, and a `DW_LNE_set_address` that moves backwards is accepted\nwithout complaint. The same holds for `seq.end`, which is taken from the `end_sequence` row and is only\ncompared against the *first* row's address. A non-monotonic sequence therefore underflows: panic in a\ndebug build, an absurd multi-exabyte range length in release.","fix":"Use a saturating subtraction and skip degenerate rows:\n\n```\nlet nextaddr = seq\n    .rows\n    .get(self.row_idx + 1)\n    .map(|row| row.address)\n    .unwrap_or(seq.end);\nlet len = nextaddr.saturating_sub(row.address);\n```\n\nBetter still, enforce the invariant once at parse time (see the related finding about the unsorted\n`rows` array) so that the binary search in `find_location` is also correct.","locations":[{"ref":"src/line.rs:233-243","code":"  233 |                     let nextaddr = seq\n  234 |                         .rows\n  235 |                         .get(self.row_idx + 1)\n  236 |                         .map(|row| row.address)\n  237 |                         .unwrap_or(seq.end);\n  238 | \n  239 |                     let item = (\n  240 |                         row.address,\n  241 |                         nextaddr - row.address,\n  242 |                         self.lines.row_location(row),\n  243 |                     );","lines":11,"link":"https://github.com/gimli-rs/addr2line/blob/3f879946d8818d91079b5d19d5b4f0a130a17758/src/line.rs#L233-L243"},{"ref":"src/line.rs:55-70","code":"   55 |         while let Some((_, row)) = rows.next_row()? {\n   56 |             if row.end_sequence() {\n   57 |                 if let Some(start) = sequence_rows.first().map(|x| x.address) {\n   58 |                     let end = row.address();\n   59 |                     let mut rows = Vec::new();\n   60 |                     mem::swap(&mut rows, &mut sequence_rows);\n   61 |                     if start < end {\n   62 |                         sequences.push(LineSequence {\n   63 |                             start,\n   64 |                             end,\n   65 |                             rows: rows.into_boxed_slice(),\n   66 |                         });\n   67 |                     }\n   68 |                 }\n   69 |                 continue;\n   70 |             }","lines":16,"link":"https://github.com/gimli-rs/addr2line/blob/3f879946d8818d91079b5d19d5b4f0a130a17758/src/line.rs#L55-L70"}]},{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`LoaderInternal::find_location_range` recomputes the upper bound as\n`probe + (probe_high - probe_low)`. `Loader::find_location_range` is public and does not validate its\narguments, so `probe_high < probe_low` underflows. Independently, when `self.ctx()` remaps the probe\nthrough the Mach-O object map, `probe != probe_low` and `probe + (probe_high - probe_low)` can overflow\n- the CLI's `--all` path passes `probe_high = u64::MAX`, so any non-zero remapped `probe` overflows.","fix":"Guard the input and use saturating arithmetic:\n\n```\nlet (ctx, probe) = self.ctx(probe_low, arena);\n// TODO: handle ranges that cover multiple objects\nlet probe_high = probe.saturating_add(probe_high.saturating_sub(probe_low));\n```","locations":[{"ref":"src/loader.rs:305-315","code":"  305 |     fn find_location_range(\n  306 |         &self,\n  307 |         probe_low: u64,\n  308 |         probe_high: u64,\n  309 |         arena: &'a LoaderArena,\n  310 |     ) -> Result<LocationRangeIter<'_, LoaderReader<'a>>> {\n  311 |         let (ctx, probe) = self.ctx(probe_low, arena);\n  312 |         // TODO: handle ranges that cover multiple objects\n  313 |         let probe_high = probe + (probe_high - probe_low);\n  314 |         Ok(ctx.find_location_range(probe, probe_high)?)\n  315 |     }","lines":11,"link":"https://github.com/gimli-rs/addr2line/blob/3f879946d8818d91079b5d19d5b4f0a130a17758/src/loader.rs#L305-L315"}]},{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"very_easy","description":"`ResUnits::find` builds a half-open probe range with `probe + 1`. `probe` comes\nstraight from user input (`addr2line -e exe ffffffffffffffff`) or from an API caller, so\n`probe == u64::MAX` overflows: a debug build panics with `attempt to add with overflow`, and a release\nbuild wraps to `probe_high == 0`, which makes the `probe_high > i.min_begin` guard in `find_range`\nfalse for the very first candidate and silently returns an empty iterator. Every public entry point\nthat takes a single address (`Context::find_location`, `Context::find_frames`,\n`Context::find_dwarf_and_unit`) goes through this function.","fix":"Saturate instead of wrapping:\n\n```\npub(crate) fn find(&self, probe: u64) -> impl Iterator<Item = &ResUnit<R>> {\n    self.find_range(probe, probe.saturating_add(1)).map(|(unit, _range)| unit)\n}\n```","locations":[{"ref":"src/unit.rs:413-415","code":"  413 |     pub(crate) fn find(&self, probe: u64) -> impl Iterator<Item = &ResUnit<R>> {\n  414 |         self.find_range(probe, probe + 1).map(|(unit, _range)| unit)\n  415 |     }","lines":3,"link":"https://github.com/gimli-rs/addr2line/blob/3f879946d8818d91079b5d19d5b4f0a130a17758/src/unit.rs#L413-L415"}]},{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"In the CLI's `--all` mode, `Addrs::next` advances the dedup watermark with\n`*max = addr + 1`. `addr` is a row address read from the binary's line program, so an entry at\n`u64::MAX` panics in a debug build and wraps to `0` in release - after which every remaining address\npasses the `addr >= *max` test and duplicates are printed.","fix":"Replace\n\n```\n*max = addr + 1;\n```\n\nwith\n\n```\n*max = addr.saturating_add(1);\n```","locations":[{"ref":"src/bin/addr2line.rs:35-43","code":"   35 |             Addrs::All { iter, max } => {\n   36 |                 for (addr, _len, _loc) in iter {\n   37 |                     if addr >= *max {\n   38 |                         *max = addr + 1;\n   39 |                         return Some(Some(addr));\n   40 |                     }\n   41 |                 }\n   42 |                 return None;\n   43 |             }","lines":9,"link":"https://github.com/gimli-rs/addr2line/blob/3f879946d8818d91079b5d19d5b4f0a130a17758/src/bin/addr2line.rs#L35-L43"}]},{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"Line and column numbers are truncated from `u64` to `u32` with `as` casts in three\nplaces. A `DW_AT_decl_line`/`DW_AT_call_line` or line-program row above `u32::MAX` therefore reports a\nwrong-but-plausible number rather than being rejected, and - worse - a value that is a non-zero\nmultiple of `2^32` truncates to `0`, which the code treats as \"no line information\" (`row.line != 0`\nin `row_location`, `func.call_line != 0` in `FrameIter::next`).","fix":"Clamp rather than truncate so a huge value never aliases to the \"absent\" sentinel:\n\n```\nlet line = row.line().map(NonZeroU64::get).unwrap_or(0).try_into().unwrap_or(u32::MAX);\n```\n\nand likewise\n\n```\ncall_line = attr.udata_value().unwrap_or(0).try_into().unwrap_or(u32::MAX);\n```","locations":[{"ref":"src/line.rs:74-81","code":"   74 |             // Convert line and column to u32 to save a little memory.\n   75 |             // We'll handle the special case of line 0 later,\n   76 |             // and return left edge as column 0 in the public API.\n   77 |             let line = row.line().map(NonZeroU64::get).unwrap_or(0) as u32;\n   78 |             let column = match row.column() {\n   79 |                 gimli::ColumnType::LeftEdge => 0,\n   80 |                 gimli::ColumnType::Column(x) => x.get() as u32,\n   81 |             };","lines":8,"link":"https://github.com/gimli-rs/addr2line/blob/3f879946d8818d91079b5d19d5b4f0a130a17758/src/line.rs#L74-L81"},{"ref":"src/function.rs:432-437","code":"  432 |                     gimli::DW_AT_call_line => {\n  433 |                         call_line = attr.udata_value().unwrap_or(0) as u32;\n  434 |                     }\n  435 |                     gimli::DW_AT_call_column => {\n  436 |                         call_column = attr.udata_value().unwrap_or(0) as u32;\n  437 |                     }","lines":6,"link":"https://github.com/gimli-rs/addr2line/blob/3f879946d8818d91079b5d19d5b4f0a130a17758/src/function.rs#L432-L437"}]},{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"The Mach-O object-map path converts addresses with unchecked arithmetic:\n`LoaderInternal::object_ctx` does `probe - symbol.address()` and `ObjectContext::ctx` does\n`probe + symbol.address()`. Both operands come from the object map and the per-object symbol table of\nan untrusted file, and the two symbols are looked up in *different* files (the outer one by address in\nthe object map, the inner one by name in the `.o`), so nothing guarantees\n`probe >= symbol.address()` or that the re-addition stays in range.","fix":"Use `checked_sub` / `checked_add` and return `None` on failure, e.g.\n\n```\nlet offset = probe.checked_sub(symbol.address())?;\nobject_context.ctx(symbol.name(), offset)\n```\n\nand in `ObjectContext::ctx`:\n\n```\n.and_then(|symbol| Some((&self.ctx, probe.checked_add(symbol.address())?)))\n```","locations":[{"ref":"src/loader.rs:271-281","code":"  271 |     fn object_ctx(\n  272 |         &self,\n  273 |         probe: u64,\n  274 |         arena: &'a LoaderArena,\n  275 |     ) -> Option<(&Context<LoaderReader<'a>>, u64)> {\n  276 |         let symbol = self.object_map.get(probe)?;\n  277 |         let object_context = self.objects[symbol.object_index()]\n  278 |             .get_or_init(|| ObjectContext::new(symbol.object(&self.object_map), arena))\n  279 |             .as_ref()?;\n  280 |         object_context.ctx(symbol.name(), probe - symbol.address())\n  281 |     }","lines":11,"link":"https://github.com/gimli-rs/addr2line/blob/3f879946d8818d91079b5d19d5b4f0a130a17758/src/loader.rs#L271-L281"},{"ref":"src/loader.rs:418-424","code":"  418 |     fn ctx(&self, symbol_name: &[u8], probe: u64) -> Option<(&Context<LoaderReader<'a>>, u64)> {\n  419 |         self.symbols\n  420 |             .symbols()\n  421 |             .iter()\n  422 |             .find(|symbol| symbol.name().as_bytes() == symbol_name)\n  423 |             .map(|symbol| (&self.ctx, probe + symbol.address()))\n  424 |     }","lines":7,"link":"https://github.com/gimli-rs/addr2line/blob/3f879946d8818d91079b5d19d5b4f0a130a17758/src/loader.rs#L418-L424"}]},{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`LoaderInternal::get_section_range` computes `begin + section.size()` without a\ncheck. Both values come unvalidated from the object file's section header, so a crafted or corrupt\nsection table overflows the addition. The result feeds `--section`/`-j` handling in the CLI, where\n`section_range.end - section_range.begin` is then computed, so a wrapped `end` also underflows\nthere.","fix":"Reject the section instead of wrapping:\n\n```\nself.object\n    .section_by_name_bytes(section_name)\n    .and_then(|section| {\n        let begin = section.address();\n        let end = begin.checked_add(section.size())?;\n        Some(gimli::Range { begin, end })\n    })\n```","locations":[{"ref":"src/loader.rs:290-298","code":"  290 |     fn get_section_range(&self, section_name: &[u8]) -> Option<gimli::Range> {\n  291 |         self.object\n  292 |             .section_by_name_bytes(section_name)\n  293 |             .map(|section| {\n  294 |                 let begin = section.address();\n  295 |                 let end = begin + section.size();\n  296 |                 gimli::Range { begin, end }\n  297 |             })\n  298 |     }","lines":9,"link":"https://github.com/gimli-rs/addr2line/blob/3f879946d8818d91079b5d19d5b4f0a130a17758/src/loader.rs#L290-L298"},{"ref":"src/bin/addr2line.rs:246-258","code":"  246 |         // If --section is given, add the section address to probe.\n  247 |         let probe = probe.and_then(|probe| {\n  248 |             if let Some(section_range) = section_range {\n  249 |                 if probe < (section_range.end - section_range.begin) {\n  250 |                     Some(probe + section_range.begin)\n  251 |                 } else {\n  252 |                     // If addr >= section size, treat it as if no line number information was found.\n  253 |                     None\n  254 |                 }\n  255 |             } else {\n  256 |                 Some(probe)\n  257 |             }\n  258 |         });","lines":13,"link":"https://github.com/gimli-rs/addr2line/blob/3f879946d8818d91079b5d19d5b4f0a130a17758/src/bin/addr2line.rs#L246-L258"}]},{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`--all` and `--section`/`-j` are not mutually exclusive, and combining them produces\ngarbage. `Addrs::All` yields *absolute* addresses obtained from `ctx.find_location_range(0, !0)`, but\nthe post-processing closure unconditionally treats every probe as a section-relative offset and adds\n`section_range.begin` to it. So `addr2line -e exe --all -j .text` shifts every address by the section\nbase and then looks up the shifted address, reporting wrong locations (or dropping the address\nentirely, because addresses at or above the section size are mapped to `None`). Note that `--all`\nalready declares `conflicts_with(\"addrs\")`, so the conflict machinery is there but `section` was\nmissed.","fix":"Declare the conflict in the argument definition:\n\n```\nArg::new(\"all\")\n    .long(\"all\")\n    .action(ArgAction::SetTrue)\n    .conflicts_with(\"addrs\")\n    .conflicts_with(\"section\")\n    .help(\"Display all addresses that have line number information.\"),\n```","locations":[{"ref":"src/bin/addr2line.rs:137-141","code":"  137 |             Arg::new(\"all\")\n  138 |                 .long(\"all\")\n  139 |                 .action(ArgAction::SetTrue)\n  140 |                 .conflicts_with(\"addrs\")\n  141 |                 .help(\"Display all addresses that have line number information.\"),","lines":5,"link":"https://github.com/gimli-rs/addr2line/blob/3f879946d8818d91079b5d19d5b4f0a130a17758/src/bin/addr2line.rs#L137-L141"},{"ref":"src/bin/addr2line.rs:246-258","code":"  246 |         // If --section is given, add the section address to probe.\n  247 |         let probe = probe.and_then(|probe| {\n  248 |             if let Some(section_range) = section_range {\n  249 |                 if probe < (section_range.end - section_range.begin) {\n  250 |                     Some(probe + section_range.begin)\n  251 |                 } else {\n  252 |                     // If addr >= section size, treat it as if no line number information was found.\n  253 |                     None\n  254 |                 }\n  255 |             } else {\n  256 |                 Some(probe)\n  257 |             }\n  258 |         });","lines":13,"link":"https://github.com/gimli-rs/addr2line/blob/3f879946d8818d91079b5d19d5b4f0a130a17758/src/bin/addr2line.rs#L246-L258"}]},{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`Lines::find_location` and `Lines::find_location_range` binary-search\n`sequence.rows` by `row.address`, but `Lines::parse` never sorts `rows` - it pushes them in\nline-program execution order and only sorts the outer `sequences` array by `start`. The dedup step\nthat merges rows with an identical address also only compares against `sequence_rows.last_mut()`, so\nit relies on the same unverified assumption. A line program whose addresses are not monotonically\nincreasing within a sequence (legal bytecode via `DW_LNE_set_address`, and observed in the wild from\nbuggy producers/linkers that fail to relocate a row) therefore makes the binary search return an\narbitrary row, so `addr2line` reports a confidently wrong file and line. This is also the root cause\nof the `nextaddr - row.address` underflow reported separately.","fix":"Sort each sequence's rows before boxing them, and re-run the adjacent-duplicate merge\nafterwards:\n\n```\nlet mut rows = Vec::new();\nmem::swap(&mut rows, &mut sequence_rows);\nrows.sort_by_key(|r| r.address);\nrows.dedup_by_key(|r| r.address);   // keeps the first row at each address\nif start < end {\n    sequences.push(LineSequence { start, end, rows: rows.into_boxed_slice() });\n}\n```\n\nNote `start` should then be `rows.first()`'s address *after* sorting, not before. If the extra sort\ncost is unacceptable on the hot path, at least detect non-monotonicity while pushing rows and only\nsort when the flag is set.","locations":[{"ref":"src/line.rs:83-99","code":"   83 |             if let Some(last_row) = sequence_rows.last_mut() {\n   84 |                 if last_row.address == address {\n   85 |                     last_row.file_index = file_index;\n   86 |                     last_row.line = line;\n   87 |                     last_row.column = column;\n   88 |                     continue;\n   89 |                 }\n   90 |             }\n   91 | \n   92 |             sequence_rows.push(LineRow {\n   93 |                 address,\n   94 |                 file_index,\n   95 |                 line,\n   96 |                 column,\n   97 |             });\n   98 |         }\n   99 |         sequences.sort_unstable_by_key(|x| x.start);","lines":17,"link":"https://github.com/gimli-rs/addr2line/blob/3f879946d8818d91079b5d19d5b4f0a130a17758/src/line.rs#L83-L99"},{"ref":"src/line.rs:144-169","code":"  144 |     pub(crate) fn find_location(&self, probe: u64) -> Result<Option<Location<'_>>, Error> {\n  145 |         let seq_idx = self.sequences.binary_search_by(|sequence| {\n  146 |             if probe < sequence.start {\n  147 |                 Ordering::Greater\n  148 |             } else if probe >= sequence.end {\n  149 |                 Ordering::Less\n  150 |             } else {\n  151 |                 Ordering::Equal\n  152 |             }\n  153 |         });\n  154 |         let seq_idx = match seq_idx {\n  155 |             Ok(x) => x,\n  156 |             Err(_) => return Ok(None),\n  157 |         };\n  158 |         let sequence = &self.sequences[seq_idx];\n  159 | \n  160 |         let idx = sequence\n  161 |             .rows\n  162 |             .binary_search_by(|row| row.address.cmp(&probe));\n  163 |         let idx = match idx {\n  164 |             Ok(x) => x,\n  165 |             Err(0) => return Ok(None),\n  166 |             Err(x) => x - 1,\n  167 |         };\n  168 |         Ok(Some(self.row_location(&sequence.rows[idx])))\n  169 |     }","lines":26,"link":"https://github.com/gimli-rs/addr2line/blob/3f879946d8818d91079b5d19d5b4f0a130a17758/src/line.rs#L144-L169"}]},{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"The bar groups are drawn at x offsets `width * (i + 1)` for `i` in\n`0..len(commands)`, so the centre of a group is at `width * (len(commands) + 1) / 2`. The tick labels\nare hard-coded to `x + 0.5`, which only coincides with that centre when `width == 0.2` and there are\nexactly four commands. Benchmarking any other number of tools leaves every x label visibly\nmisaligned with the bars it describes.","fix":"Derive the offset from the data instead of hard-coding it:\n\n```\nax.set_xticks(x + width * (len(commands) + 1) / 2, inputs)\n```","locations":[{"ref":"scripts/benchmark-plot.py:31-39","code":"   31 | x = np.arange(len(inputs))  # the label locations\n   32 | width = 0.2  # the width of the bars\n   33 | \n   34 | fig, ax = plt.subplots(layout=\"constrained\")\n   35 | for i, command in enumerate(commands):\n   36 |     offset = width * (i + 1)\n   37 |     rects = ax.bar(x + offset, data[i], width, label=command)\n   38 | \n   39 | ax.set_xticks(x + 0.5, inputs)","lines":9,"link":"https://github.com/gimli-rs/addr2line/blob/3f879946d8818d91079b5d19d5b4f0a130a17758/scripts/benchmark-plot.py#L31-L39"}]},{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`parse_uint_from_hex_string` only recognises a lowercase `0x` prefix. GNU\n`addr2line` and `llvm-symbolizer` both accept `0X`, and `0X` is what many tools (and C's `%#X`) emit.\nWith `0X1234` the `starts_with(\"0x\")` test fails, `u64::from_str_radix(\"0X1234\", 16)` then also fails\nbecause of the `X`, and the address is silently reported as unresolvable (`??:0`) instead of being\nparsed.","fix":"Strip either spelling of the prefix:\n\n```\nfn parse_uint_from_hex_string(string: &str) -> Option<u64> {\n    let digits = string\n        .strip_prefix(\"0x\")\n        .or_else(|| string.strip_prefix(\"0X\"))\n        .unwrap_or(string);\n    u64::from_str_radix(digits, 16).ok()\n}\n```","locations":[{"ref":"src/bin/addr2line.rs:10-16","code":"   10 | fn parse_uint_from_hex_string(string: &str) -> Option<u64> {\n   11 |     if string.len() > 2 && string.starts_with(\"0x\") {\n   12 |         u64::from_str_radix(&string[2..], 16).ok()\n   13 |     } else {\n   14 |         u64::from_str_radix(string, 16).ok()\n   15 |     }\n   16 | }","lines":7,"link":"https://github.com/gimli-rs/addr2line/blob/3f879946d8818d91079b5d19d5b4f0a130a17758/src/bin/addr2line.rs#L10-L16"}]},{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`Location::column` is documented as \"A value of `Some(0)` indicates the left edge\",\nand `Lines::row_location` honours that: it returns `Some(row.column)` including `Some(0)`. But\n`FrameIter::next`, which synthesises the `Location` for an inlined caller, maps a `call_column` of `0`\nto `None` instead. So the same \"left edge\" position is reported as `Some(0)` for the innermost frame\nand `None` for its inline callers, and the CLI prints `0` in one case and nothing in the other for\n`--llvm` output.","fix":"Treat a missing `DW_AT_call_column` the same way the line table treats a missing\ncolumn - i.e. distinguish \"attribute absent\" from \"column 0\". Store `call_column: Option<u32>` in\n`InlinedFunction` (set only when the attribute is present) and then use it directly:\n\n```\ncolumn: func.call_column,\n```","locations":[{"ref":"src/frame.rs:117-129","code":"  117 |         let mut next = Location {\n  118 |             file: None,\n  119 |             line: if func.call_line != 0 {\n  120 |                 Some(func.call_line)\n  121 |             } else {\n  122 |                 None\n  123 |             },\n  124 |             column: if func.call_column != 0 {\n  125 |                 Some(func.call_column)\n  126 |             } else {\n  127 |                 None\n  128 |             },\n  129 |         };","lines":13,"link":"https://github.com/gimli-rs/addr2line/blob/3f879946d8818d91079b5d19d5b4f0a130a17758/src/frame.rs#L117-L129"},{"ref":"src/line.rs:130-142","code":"  130 |     fn row_location(&self, row: &LineRow) -> Location<'_> {\n  131 |         let file = self.files.get(row.file_index as usize).map(String::as_str);\n  132 |         Location {\n  133 |             file,\n  134 |             line: if row.line != 0 { Some(row.line) } else { None },\n  135 |             // If row.line is specified then row.column always has meaning.\n  136 |             column: if row.line != 0 {\n  137 |                 Some(row.column)\n  138 |             } else {\n  139 |                 None\n  140 |             },\n  141 |         }\n  142 |     }","lines":13,"link":"https://github.com/gimli-rs/addr2line/blob/3f879946d8818d91079b5d19d5b4f0a130a17758/src/line.rs#L130-L142"},{"ref":"src/frame.rs:12-17","code":"   12 |     pub line: Option<u32>,\n   13 |     /// The column number.\n   14 |     ///\n   15 |     /// A value of `Some(0)` indicates the left edge.\n   16 |     pub column: Option<u32>,\n   17 | }","lines":6,"link":"https://github.com/gimli-rs/addr2line/blob/3f879946d8818d91079b5d19d5b4f0a130a17758/src/frame.rs#L12-L17"}]},{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`ResUnits::parse` reads `DW_AT_language` inside the `if need_unit_range { ... }`\nblock. `need_unit_range` is set to `false` up front for `gimli::UnitType::Partial` units, so the\nattribute loop never runs for them and `ResUnit::lang` stays `None`. Language is orthogonal to\nwhether a unit contributes address ranges: it is used only by `FrameIter::next` to pick a demangling\nscheme. As a result, every function attributed to a partial unit (DWARF with `DW_TAG_partial_unit`,\ni.e. anything processed by `dwz`) is demangled with the language-agnostic heuristics instead of the\ncorrect scheme.","fix":"Read the unit DIE's attributes unconditionally and use `need_unit_range` only to\ndecide whether to collect ranges. Concretely, move the `let mut entries = ...` /\n`read_abbreviation` / attribute loop out of the `if need_unit_range` block and keep only the\nrange-selection logic (the `.debug_aranges` lookup and `for_each_range` call) guarded by it.","locations":[{"ref":"src/unit.rs:226-245","code":"  226 |             // We mainly want compile units, but we may need to follow references to entries\n  227 |             // within other units for function names.  We don't need anything from type units.\n  228 |             let mut need_unit_range = match header.type_() {\n  229 |                 gimli::UnitType::Type { .. } | gimli::UnitType::SplitType { .. } => continue,\n  230 |                 gimli::UnitType::Partial => {\n  231 |                     // Partial units are only needed for references from other units.\n  232 |                     // They shouldn't have any address ranges.\n  233 |                     false\n  234 |                 }\n  235 |                 _ => true,\n  236 |             };\n  237 |             let dw_unit = match sections.unit(header) {\n  238 |                 Ok(dw_unit) => dw_unit,\n  239 |                 Err(_) => continue,\n  240 | eported:\n\n```\nAddrs::All { iter, max } => {\n    while let Some((addr, _len, _loc)) = match iter.next() {\n        Ok(v) => v,\n        Err(e) => { eprintln!(\"failed to iterate addresses: {e}\"); return None; }\n    } {\n        if addr >= *max {\n            *max = addr.saturating_add(1);\n            return Some(Some(addr));\n        }\n    }\n    return None;\n}\n```\n\n(`iter.next()` here is `fallible_iterator::FallibleIterator::next`, which the crate already\nimplements for `LocationRangeIter`.)","locations":[{"ref":"src/unit.rs:578-588","code":"  578 | impl<'ctx, R> Iterator for LocationRangeIter<'ctx, R>\n  579 | where\n  580 |     R: gimli::Reader + 'ctx,\n  581 | {\n  582 |     type Item = (u64, u64, Location<'ctx>);\n  583 | \n  584 |     #[inline]\n  585 |     fn next(&mut self) -> Option<Self::Item> {\n  586 |         self.next_loc().unwrap_or_default()\n  587 |     }\n  588 | }","lines":11,"link":"https://github.com/gimli-rs/addr2line/blob/3f879946d8818d91079b5d19d5b4f0a130a17758/src/unit.rs#L578-L588"},{"ref":"src/bin/addr2line.rs:35-43","code":"   35 |             Addrs::All { iter, max } => {\n   36 |                 for (addr, _len, _loc) in iter {\n   37 |                     if addr >= *max {\n   38 |                         *max = addr + 1;\n   39 |                         return Some(Some(addr));\n   40 |                     }\n   41 |                 }\n   42 |                 return None;\n   43 |             }","lines":9,"link":"https://github.com/gimli-rs/addr2line/blob/3f879946d8818d91079b5d19d5b4f0a130a17758/src/bin/addr2line.rs#L35-L43"}]},{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"If `scripts/tmp/benchmark-*.json` matches nothing (wrong working directory, or the\nbenchmark script was never run), `commands` stays `None` and `data` stays `[]`. The script then fails\nat `for i, command in enumerate(commands)` with `TypeError: 'NoneType' object is not iterable`, which\ngives no hint about the real problem. `results[0][\"parameters\"]` on line 24 fails just as opaquely\nwith `IndexError`/`KeyError` when a JSON file has no results or was produced without hyperfine\nparameters.","fix":"Fail fast with a readable message:\n\n```\nfilenames = sorted(glob.glob(\"scripts/tmp/benchmark-*.json\"))\nif not filenames:\n    parser.error(\"no scripts/tmp/benchmark-*.json files found; run scripts/benchmark-addr2line.sh first\")\n```","locations":[{"ref":"scripts/benchmark-plot.py:14-27","code":"   14 | commands = None\n   15 | data = []\n   16 | inputs = []\n   17 | \n   18 | for filename in sorted(glob.glob(\"scripts/tmp/benchmark-*.json\")):\n   19 |     with open(filename) as f:\n   20 |         results = json.load(f)[\"results\"]\n   21 |     commands = [b[\"command\"] for b in results]\n   22 |     data.append([b[\"mean\"] for b in results])\n   23 | \n   24 |     input = results[0][\"parameters\"][\"input\"]\n   25 |     binary_size = results[0][\"parameters\"][\"size\"]\n   26 |     symbol_queries = results[0][\"parameters\"][\"symbol_queries\"]\n   27 |     inputs.append(f\"{input}\\n({binary_size}B,\\n{symbol_queries} queries)\")","lines":14,"link":"https://github.com/gimli-rs/addr2line/blob/3f879946d8818d91079b5d19d5b4f0a130a17758/scripts/benchmark-plot.py#L14-L27"}]},{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`LoaderInternal::load_dwo` propagates an error from `dwp.find_cu(...)` with `?`,\nwhich aborts the whole `find_frames` call. Every other split-DWARF source in this function is\nbest-effort: the filesystem DWO lookup is wrapped in a closure that maps all failures to `None`, and\n`dwarf_package` itself is built with `.ok()`. A single corrupt CU index entry in an otherwise usable\n`.dwp` therefore fails the lookup outright instead of falling through to the `.dwo` file on disk or to\nthe skeleton unit.","fix":"                    name = Some(val);\n  545 |                     }\n  546 |                 }\n  547 |                 gimli::DW_AT_abstract_origin | gimli::DW_AT_specification => {\n  548 |                     next = Some(attr.value());\n  549 |                 }\n  550 |                 _ => {}\n  551 |             },\n  552 |             Err(e) => return Err(e),\n  553 |         }","lines":19,"link":"https://github.com/gimli-rs/addr2line/blob/3f879946d8818d91079b5d19d5b4f0a130a17758/src/function.rs#L535-L553"}]},{"id":"OTHER_2","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"`ResUnit::dwo` is a `LazyResult` (a `OnceCell`) that memoises the outcome of split\nDWARF loading, and `LookupResult::skip_all_loads` resumes the continuation with `None`. The\ncontinuation writes that `None` into the cell via `self.dwo.get_or_init(...)`, so the *first* caller\nthat gives up on split DWARF permanently pins the unit to its skeleton data: every later\n`find_frames`/`find_location` for that unit takes the `if let Some(dwo) = self.dwo.get()` early return\nand never asks for the DWO again, even if the caller now drives the `LookupResult::Load` loop\nproperly. Mixing `skip_all_loads()` with proper split-DWARF handling on one `Context` therefore\ndegrades results in a way that depends on call order and is not mentioned in the docs - and the\n`#[doc(hidden)]` `parse_functions`/`parse_inlined_functions` helpers do exactly that.","fix":"Either document the caching side effect on `skip_all_loads` (\"calling this for a\n`Context` permanently disables split DWARF loading for the units it touched\"), or do not poison the\ncache on the abandon path - e.g. have the continuation return the mapped result without calling\n`get_or_init` when `dwo_dwarf` is `None`, so a later, properly-driven lookup can still load it:\n\n```\nmove |dwo_dwarf| match dwo_dwarf {\n    None => Ok((DebugFile::Primary, self.unit_ref(&*ctx.sections))),\n    some => map_dwo(self.dwo.get_or_init(|| process_dwo(some))),\n}\n```","locations":[{"ref":"src/unit.rs:55-66","code":"   55 |         let complete = |dwo| SimpleLookup::new_complete(map_dwo(dwo));\n   56 | \n   57 |         if let Some(dwo) = self.dwo.get() {\n   58 |             return complete(dwo);\n   59 |         }\n   60 | \n   61 |         let dwo_id = match self.dw_unit.dwo_id {\n   62 |             None => {\n   63 |                 return complete(self.dwo.get_or_init(|| Ok(None)));\n   64 |             }\n   65 |             Some(dwo_id) => dwo_id,\n   66 |         };","lines":12,"link":"https://github.com/gimli-rs/addr2line/blob/3f879946d8818d91079b5d19d5b4f0a130a17758/src/unit.rs#L55-L66"},{"ref":"src/lookup.rs:79-92","code":"   79 | impl<L: LookupContinuation> LookupResult<L> {\n   80 |     /// Callers that do not handle split DWARF can call `skip_all_loads`\n   81 |     /// to fast-forward to the end result. This result is produced with\n   82 |     /// the data that is available and may be less accurate than the\n   83 |     /// the results that would be produced if the caller did properly\n   84 |     /// support split DWARF.\n   85 |     pub fn skip_all_loads(mut self) -> L::Output {\n   86 |         loop {\n   87 |             self = match self {\n   88 |                 LookupResult::Output(t) => return t,\n   89 |                 LookupResult::Load { continuation, .. } => continuation.resume(None),\n   90 |             };\n   91 |         }\n   92 |     }","lines":14,"link":"https://github.com/gimli-rs/addr2line/blob/3f879946d8818d91079b5d19d5b4f0a130a17758/src/lookup.rs#L79-L92"},{"ref":"src/lib.rs:328-344","code":"  328 |     /// Initialize all function data structures. This is used for benchmarks.\n  329 |     #[doc(hidden)]\n  330 |     pub fn parse_functions(&self) -> Result<(), Error> {\n  331 |         for unit in self.units.iter() {\n  332 |             unit.parse_functions(self).skip_all_loads()?;\n  333 |         }\n  334 |         Ok(())\n  335 |     }\n <Self, Error> {\n  207 |         // Find all the references to compilation units in .debug_aranges.\n  208 |         // Note that we always also iterate through all of .debug_info to\n  209 |         // find compilation units, because .debug_aranges may be missing some.\n  210 |         let mut aranges = Vec::new();\n  211 |         let mut headers = sections.debug_aranges.headers();\n  212 |         while let Some(header) = headers.next()? {\n  213 |             aranges.push((header.debug_info_offset(), header.offset()));\n  214 |         }\n  215 |         aranges.sort_unstable_by_key(|i| i.0);\n  216 | \n  217 |         let mut unit_ranges = Vec::new();\n  218 |         let mut res_units = Vec::new();\n  219 |         let mut units = sections.units();\n  220 |         while let Some(header) = units.next()? {\n  221 |             let unit_id = res_units.len();\n  222 |             let offset = match header.debug_info_offset() {\n  223 |                 Some(offset) => offset,\n  224 |                 None => continue,\n  225 |             };\n  226 |             // We mainly want compile units, but we may need to follow references to entries\n  227 |             // within other units for function names.  We don't need anything from type units.\n  228 |             let mut need_unit_range = match header.type_() {\n  229 |                 gimli::UnitType::Type { .. } | gimli::UnitType::SplitType { .. } => continue,\n  230 |                 gimli::UnitType::Partial => {\n  231 |                     // Partial units are only needed for references from other units.\n  232 |                     // They shouldn't have any address ranges.\n  233 |                     false\n  234 |                 }\n  235 |                 _ => true,\n  236 |             };\n  237 |             let dw_unit = match sections.unit(header) {\n  238 |                 Ok(dw_unit) => dw_unit,\n  239 |                 Err(_) => continue,\n  240 |             };\n  241 |             let dw_unit_ref = gimli::UnitRef::new(sections, &dw_unit);\n  242 | \n  243 |             let mut lang = None;\n  244 |             if need_unit_range {\n  245 |                 let mut entries = dw_unit_ref.entries_raw(None)?;\n  246 | \n  247 |                 let abbrev = match entries.read_abbreviation()? {\n  248 |                     Some(abbrev) => abbrev,\n  249 |                     None => continue,\n  250 |                 };\n  251 | \n  252 |                 let mut ranges = RangeAttributes::default();\n  253 |                 for spec in abbrev.attributes() {\n  254 |                     let attr = entries.read_attribute(*spec)?;\n  255 |                     match attr.name() {\n  256 |                         gimli::DW_AT_low_pc => match attr.value() {\n  257 |                             gimli::AttributeValue::Addr(val) => ranges.low_pc = Some(val),\n  258 |                             gimli::AttributeValue::DebugAddrIndex(index) => {\n  259 |                                 ranges.low_pc = Some(dw_unit_ref.address(index)?);\n  260 |                             }\n  261 |                             _ => {}\n  262 |                         },\n  263 |                         gimli::DW_AT_high_pc => match attr.value() {\n  264 |                             gimli::AttributeValue::Addr(val) => ranges.high_pc = Some(val),\n  265 |                             gimli::AttributeValue::DebugAddrIndex(index) => {\n  266 |                                 ranges.high_pc = Some(dw_unit_ref.address(index)?);\n  267 |                             }\n  268 |                             gimli::AttributeValue::Udata(val) => ranges.size = Some(val),\n  269 |                             _ => {}\n  270 |                         },\n  271 |                         gimli::DW_AT_ranges => {\n  272 |                             ranges.ranges_offset = dw_unit_ref.attr_ranges_offset(attr.value())?;\n  273 |                         }\n  274 |                         gimli::DW_AT_language => {\n  275 |                             if let gimli::AttributeValue::Language(val) = attr.value() {\n  276 |                                 lang = Some(val);\n  277 |                             }\n  278 |                         }\n  279 |                         _ => {}\n  280 |                     }\n  281 |                 }\n  282 | \n  283 |                 // Find the address ranges for the CU, using in order of preference:\n  284 |                 // - DW_AT_ranges\n  285 |                 // - .debug_aranges\n  286 |                 // - DW_AT_low_pc/DW_AT_high_pc\n  287 |                 //\n  288 |                 // Using DW_AT_ranges before .debug_aranges is possibly an arbitrary choice,\n  289 |                 // but the feeling is that DW_AT_ranges is more likely to be reliable or complete\n  290 |                 // if it is present.\n  291 |                 //\n  292 |                 // .debug_aranges must be used before DW_AT_low_pc/DW_AT_high_pc because\n  293 |                 // it has been observed on macOS that DW_AT_ranges was not emitted even for\n  294 |                 // discontiguous CUs.\n  295 |                 let i = match ranges.ranges_offset {\n  296 |                     Some(_) => None,\n  297 |                     None => aranges.binary_search_by_key(&offset, |x| x.0).ok(),\n  298 |                 };\n  299 |                 if let Some(mut i) = i {\n  300 |                     // There should be only one set per CU, but in practice multiple\n  301 |                     // sets have been observed. This is probably a compiler bug, but\n  302 |                     // either way we need to handle it.\n  303 |                     while i > 0 && aranges[i - 1].0 == offset {\n  304 |                         i -= 1;\n  305 |                     }\n  306 |                     for (_, aranges_offset) in aranges[i..].iter().take_while(|x| x.0 == offset) {\n  307 |                         let aranges_header = sections.debug_aranges.hea 10-line constructor that performs five independent I/O\nand discovery tasks inline: mapping and parsing the main object, mapping and parsing the supplementary\nobject, scanning sibling directories for a matching Mach-O dSYM bundle, loading all DWARF sections,\nand probing for a `.dwp` package. Two of them are written as immediately-invoked closures\n(`(|| { ... })()`) purely to get `?`/`None` short-circuiting, which is a strong signal they want to be\nnamed functions. Each task has its own error policy (propagate vs. ignore), and the mixture is what\nproduced the \"ignoring errors\" comment mismatch reported separately.","fix":"Promote each IIFE to a private free function with an explicit signature and error\npolicy, e.g. `fn find_dsym<'a>(path: &Path, object: &object::File, arena: &'a LoaderArena) ->\nOption<object::File<'a>>` and `fn find_dwarf_package<'a>(path: &Path, arena: &'a LoaderArena) ->\nOption<gimli::DwarfPackage<LoaderReader<'a>>>`. `LoaderInternal::new` then becomes a linear sequence of\nnamed steps whose best-effort vs. fatal behaviour is visible from the return types.","locations":[{"ref":"src/loader.rs:156-265","code":"  156 | impl<'a> LoaderInternal<'a> {\n  157 |     fn new(path: &Path, sup_path: Option<&Path>, arena: &'a LoaderArena) -> Result<Self> {\n  158 |         let file = File::open(path)?;\n  159 |         let map = arena.mmap.alloc(unsafe { Mmap::map(&file)? });\n  160 |         let object = object::File::parse(&**map)?;\n  161 | \n  162 |         let relative_address_base = object.relative_address_base();\n  163 |         let symbols = object.symbol_map();\n  164 |         let object_map = object.object_map();\n  165 |         let mut objects = Vec::new();\n  166 |         objects.resize_with(object_map.objects().len(), OnceCell::new);\n  167 | \n  168 |         // Load supplementary object file.\n  169 |         // TODO: use debuglink and debugaltlink\n  170 |         let sup_map;\n  171 |         let sup_object = if let Some(sup_path)
