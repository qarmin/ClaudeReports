{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"very_easy","description":"`HalfBlockGrid::paint` indexes the pixel buffer directly with `self.pixels[y][x]`, unlike every other `Grid` implementation (`PatternGrid::paint`, `CharGrid::paint`) which deliberately use `get_mut` and carry a comment stating \"we want to make sure we don't panic if the index is out of bounds\". `Painter::paint` is a public API and `Shape::draw` implementations call it with arbitrary `(x, y)` values. When the canvas marker is `Marker::HalfBlock`, any out-of-range point (e.g. a custom `Shape` that paints near the resolution edge, or any direct `painter.paint(x, y, ..)` call as shown in the doc example for `Painter::paint`) will panic with an out-of-bounds index. The overflow regression tests (`check_canvas_paint_overflow`) only cover `PatternGrid` and `CharGrid`, so this gap is untested.","fix":"Bounds-check like the other grids, e.g.:\n`if let Some(row) = self.pixels.get_mut(y) { if let Some(cell) = row.get_mut(x) { *cell = Some(color); } }`","locations":[{"ref":"ratatui-widgets/src/canvas.rs:395-397","code":"  395 |     fn paint(&mut self, x: usize, y: usize, color: Color) {\n  396 |         self.pixels[y][x] = Some(color);\n  397 |     }","lines":3,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-widgets/src/canvas.rs#L395-L397"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"In the render loop, the number of items to draw is computed as\n`.take(last_visible_index - first_visible_index)` using plain (non-saturating) subtraction. This\nrelies on the invariant `last_visible_index >= first_visible_index` always holding after\n`get_items_bounds`. Because `get_items_bounds` can produce `last_visible_index < first_visible_index`\nin the oversized-item edge case described in the related finding (the inner loops decrement\n`last_visible_index` independently), this subtraction can underflow to a huge `usize` and attempt to\ntake far more items than exist, leading to incorrect rendering or a panic when combined with the\nindexing in `get_items_bounds`.","fix":"Use `last_visible_index.saturating_sub(first_visible_index)`, and ensure `get_items_bounds` always returns `last >= first`.","locations":[{"ref":"ratatui-widgets/src/list/rendering.rs:72-78","code":"   72 |         for (i, item) in self\n   73 |             .items\n   74 |             .iter()\n   75 |             .enumerate()\n   76 |             .skip(state.offset)\n   77 |             .take(last_visible_index - first_visible_index)\n   78 |         {","lines":7,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-widgets/src/list/rendering.rs#L72-L78"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`List::get_items_bounds` performs non-saturating index arithmetic in the \"scroll up\" branch that\ncan index out of bounds and/or underflow when an item is taller than the available viewport.\n\nWhen `index_to_display < first_visible_index` (selected item is above the current visible range),\nthe outer loop decrements `first_visible_index` and adds that item's height. If a single item's\nheight exceeds `max_height`, the inner `while height_from_offset > max_height` loop never brings the\nheight back under the limit, so it keeps executing `last_visible_index -= 1` (line 199, NOT\nsaturating) and then indexes `self.items[last_visible_index]` (line 202). With enough oversized\nitems this drives `last_visible_index` to 0 and then to `usize::MAX` (underflow), causing a panic\nor out-of-bounds index. The symmetric forward loop at 180-186 increments `first_visible_index`\nwithout an upper-bound guard for the same oversized-item case.","fix":"Guard the inner loops so indices cannot cross: only decrement `last_visible_index` while\n`last_visible_index > first_visible_index` (and `first_visible_index` while\n`first_visible_index < last_visible_index`), and stop subtracting once the range is empty even if\nthe single remaining oversized item still exceeds `max_height`. Use `saturating_sub` for the index\ndecrements as defense in depth.","locations":[{"ref":"ratatui-widgets/src/list/rendering.rs:191-204","code":"  191 |         while index_to_display < first_visible_index {\n  192 |             first_visible_index -= 1;\n  193 | \n  194 |             height_from_offset =\n  195 |                 height_from_offset.saturating_add(self.items[first_visible_index].height());\n  196 | \n  197 |             // Don't show an item if it is beyond our viewable height\n  198 |             while height_from_offset > max_height {\n  199 |                 last_visible_index -= 1;\n  200 | \n  201 |                 height_from_offset =\n  202 |                     height_from_offset.saturating_sub(self.items[last_visible_index].height());\n  203 |             }\n  204 |         }","lines":14,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-widgets/src/list/rendering.rs#L191-L204"},{"ref":"ratatui-widgets/src/list/rendering.rs:180-186","code":"  180 |             while height_from_offset > max_height {\n  181 |                 height_from_offset =\n  182 |                     height_from_offset.saturating_sub(self.items[first_visible_index].height());\n  183 | \n  184 |                 // Remove this item to view by starting at the next item index\n  185 |                 first_visible_index += 1;\n  186 |             }","lines":7,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-widgets/src/list/rendering.rs#L180-L186"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`From<Color> for anstyle::Color` panics on `Color::Reset` (documented). Because this conversion is invoked unconditionally inside `From<Style> for anstyle::Style` for any `fg`, `bg`, or `underline_color` that is `Some`, converting an otherwise-valid `Style` whose color is set to `Color::Reset` will panic rather than returning an error or skipping the color. A `Style` with `fg: Some(Color::Reset)` is a perfectly normal value (it is exactly what `Style::reset()` produces), so this is an easy-to-hit panic when interoperating with anstyle.","fix":"Make the `Style -> anstyle::Style` conversion treat `Color::Reset` as \"no color\" (skip setting it) instead of unconditionally converting, or provide a `TryFrom`-based path so a Reset color cannot trigger a panic.","locations":[{"ref":"ratatui-core/src/style/anstyle.rs:118-126","code":"  118 |     fn from(color: Color) -> Self {\n  119 |         match color {\n  120 |             Color::Reset => panic!(\"Color::Reset has no equivalent in anstyle\"),\n  121 |             Color::Rgb(_, _, _) => Self::Rgb(RgbColor::try_from(color).unwrap()),\n  122 |             Color::Indexed(_) => Self::Ansi256(Ansi256Color::try_from(color).unwrap()),\n  123 |             _ => Self::Ansi(AnsiColor::try_from(color).unwrap()),\n  124 |         }\n  125 |     }\n  126 | }","lines":9,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-core/src/style/anstyle.rs#L118-L126"},{"ref":"ratatui-core/src/style/anstyle.rs:208-227","code":"  208 | impl From<Style> for anstyle::Style {\n  209 |     fn from(style: Style) -> Self {\n  210 |         let mut anstyle_style = Self::new();\n  211 |         if let Some(fg) = style.fg {\n  212 |             let fg = anstyle::Color::from(fg);\n  213 |             anstyle_style = anstyle_style.fg_color(Some(fg));\n  214 |         }\n  215 |         if let Some(bg) = style.bg {\n  216 |             let bg = anstyle::Color::from(bg);\n  217 |             anstyle_style = anstyle_style.bg_color(Some(bg));\n  218 |         }\n  219 |         #[cfg(feature = \"underline-color\")]\n  220 |         if let Some(underline) = style.underline_color {\n  221 |             let underline = anstyle::Color::from(underline);\n  222 |             anstyle_style = anstyle_style.underline_color(Some(underline));\n  223 |         }\n  224 |         anstyle_style = anstyle_style.effects(style.add_modifier.into());\n  225 |         anstyle_style\n  226 |     }\n  227 | }","lines":20,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-core/src/style/anstyle.rs#L208-L227"}]},
{"id":"RES_1","type":"resource_leak","type_label":"Resource Leak","severity":"low","difficulty":"easy","description":"`Terminal::drop` attempts to restore cursor visibility by calling `self.show_cursor()` (which calls\n`backend.show_cursor()`), but never calls `backend.flush()` afterwards. For backends that buffer\ntheir output (e.g. a buffered stdout writer), the show-cursor escape sequence may sit unflushed in\nthe backend's buffer; whether it actually reaches the terminal then depends entirely on the\nbackend's own `Drop` flushing. If the backend does not flush on drop, the user can be left with a\nhidden cursor after the program exits.","fix":"After `show_cursor()` succeeds in `Drop`, also call `self.backend.flush()` (ignoring/logging the\nerror) so the cursor-restore sequence is actually emitted before the backend is dropped.","locations":[{"ref":"ratatui-core/src/terminal.rs:477-486","code":"  477 |     fn drop(&mut self) {\n  478 |         // Attempt to restore the cursor state\n  479 |         if self.hidden_cursor {\n  480 |             #[allow(unused_variables)]\n  481 |             if let Err(err) = self.show_cursor() {\n  482 |                 #[cfg(feature = \"std\")]\n  483 |                 std::eprintln!(\"Failed to show the cursor: {err}\");\n  484 |             }\n  485 |         }\n  486 |     }","lines":10,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-core/src/terminal.rs#L477-L486"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"very_easy","description":"`Buffer::merge` computes the destination index `k` entirely in `u16` arithmetic:\n`((y - area.y) * area.width + x - area.x) as usize`. For a merged area whose\nwidth*height exceeds 65535 (e.g. merging buffers that span a 256x256 region),\n`(y - area.y) * area.width` overflows `u16`. In debug builds this panics\n('attempt to multiply with overflow'); in release builds it silently wraps,\nproducing a wrong index that either corrupts cell data or causes an\nout-of-bounds panic on `self.content[k]`. This is the same class of bug that was\nfixed for `pos_of` in issue #1441, but it was not fixed here.","fix":"Perform the index math in `usize`, e.g.\n`let k = (y as usize - area.y as usize) * area.width as usize + (x as usize - area.x as usize);`\nfor both the relocation loop and the other-buffer copy loop.","locations":[{"ref":"ratatui-core/src/buffer/buffer.rs:441-459","code":"  441 |         for i in (0..size).rev() {\n  442 |             let (x, y) = self.pos_of(i);\n  443 |             // New index in content\n  444 |             let k = ((y - area.y) * area.width + x - area.x) as usize;\n  445 |             if i != k {\n  446 |                 self.content[k] = self.content[i].clone();\n  447 |                 self.content[i].reset();\n  448 |             }\n  449 |         }\n  450 | \n  451 |         // Push content of the other buffer into this one (may erase previous\n  452 |         // data)\n  453 |         let size = other.area.area() as usize;\n  454 |         for i in 0..size {\n  455 |             let (x, y) = other.pos_of(i);\n  456 |             // New index in content\n  457 |             let k = ((y - area.y) * area.width + x - area.x) as usize;\n  458 |             self.content[k] = other.content[i].clone();\n  459 |         }","lines":19,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-core/src/buffer/buffer.rs#L441-L459"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"`BarChart::group_ticks` computes the group width with unchecked `u16` arithmetic:\n`let n_bars = group.bars.len() as u16;` and\n`let group_width = n_bars * self.bar_width + n_bars.saturating_sub(1) * self.bar_gap;`.\n\nTwo problems:\n1. `group.bars.len() as u16` truncates the bar count when a group has more than 65535 bars,\n   producing a wrong `n_bars` and silently dropping/duplicating layout.\n2. `n_bars * self.bar_width` and `... * self.bar_gap` are plain `u16` multiplications. With a\n   large bar count and/or a large `bar_width`/`bar_gap` these overflow, which panics in debug\n   builds and wraps to a tiny `group_width` in release builds (corrupting the bar layout). All\n   other width math here uses saturating ops, so this is inconsistent and unsafe.","fix":"Do the width computation in a wider type and saturate back to `u16`, e.g.\n`let n_bars = u32::try_from(group.bars.len()).unwrap_or(u32::MAX);`\nthen compute `group_width` as a `u32` with `saturating_mul`/`saturating_add` and\n`u16::try_from(group_width).unwrap_or(u16::MAX)`, or clamp `n_bars` to `available_space`\nbefore multiplying.","locations":[{"ref":"ratatui-widgets/src/barchart.rs:443-444","code":"  443 |                 let n_bars = group.bars.len() as u16;\n  444 |                 let group_width = n_bars * self.bar_width + n_bars.saturating_sub(1) * self.bar_gap;","lines":2,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-widgets/src/barchart.rs#L443-L444"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"`TestBackend::scroll_region_up` / `scroll_region_down` compute\n`cell_region_len = cell_region_end - cell_region_start` after independently clamping\n`region.start` and `region.end` to the buffer height. If a caller passes a reversed range\n(`region.end < region.start`), this is an unchecked `usize` subtraction that panics (debug) or\nwraps to a huge value and then panics on the subsequent slice index (release). The `Backend` trait\ndocuments these as half-open ranges but does not require `start <= end`, so a misbehaving caller of\nthe public trait method can trigger a panic. This is test-backend logic, but it is real\n(non-test-cfg) code reachable through the public `Backend` API.","fix":"Guard against reversed/empty ranges, e.g. compute\n`let cell_region_len = cell_region_end.saturating_sub(cell_region_start);` and early-return when it\nis zero, or clamp `cell_region_end` to be `>= cell_region_start`.","locations":[{"ref":"ratatui-core/src/backend/test.rs:410-412","code":"  410 |         let cell_region_start = width * region.start.min(self.buffer.area.height) as usize;\n  411 |         let cell_region_end = width * region.end.min(self.buffer.area.height) as usize;\n  412 |         let cell_region_len = cell_region_end - cell_region_start;","lines":3,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-core/src/backend/test.rs#L410-L412"},{"ref":"ratatui-core/src/backend/test.rs:410-412","code":"  410 |         let cell_region_start = width * region.start.min(self.buffer.area.height) as usize;\n  411 |         let cell_region_end = width * region.end.min(self.buffer.area.height) as usize;\n  412 |         let cell_region_len = cell_region_end - cell_region_start;","lines":3,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-core/src/backend/test.rs#L410-L412"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"`TermwizBackend::get_cursor_position` casts the terminal's `usize` cursor coordinates with a raw `as u16` (`Position::new(x as u16, y as u16)`), which silently truncates values above 65535. Every other place in this file that narrows a `usize` terminal dimension to `u16` uses the dedicated `u16_max` saturating helper (see `size`, line 265, and `window_size`, lines 281-287). This is an inconsistency that drops the saturating behavior for cursor position.","fix":"Use `Ok(Position::new(u16_max(x), u16_max(y)))` to match the rest of the backend.","locations":[{"ref":"ratatui-termwiz/src/lib.rs:236-239","code":"  236 |     fn get_cursor_position(&mut self) -> io::Result<Position> {\n  237 |         let (x, y) = self.buffered_terminal.cursor_position();\n  238 |         Ok(Position::new(x as u16, y as u16))\n  239 |     }","lines":4,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-termwiz/src/lib.rs#L236-L239"}]},
{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"`apply_scroll_padding_to_selected_index` returns `selected + scroll_padding` and `selected + scroll_padding`\nwith plain (non-saturating) addition before clamping with `.min(last_valid_index)`. `scroll_padding`\nis a user-supplied `usize` (`List::scroll_padding`), so a large padding value combined with a large\nselected index can overflow `usize` in a debug build and panic before the `.min` clamp is applied.","fix":"Use `selected.saturating_add(scroll_padding)` in both the condition and the returned value.","locations":[{"ref":"ratatui-widgets/src/list/rendering.rs:243-252","code":"  243 |         Some(\n  244 |             if (selected + scroll_padding).min(last_valid_index) >= last_visible_index {\n  245 |                 selected + scroll_padding\n  246 |             } else if selected.saturating_sub(scroll_padding) < first_visible_index {\n  247 |                 selected.saturating_sub(scroll_padding)\n  248 |             } else {\n  249 |                 selected\n  250 |             }\n  251 |             .min(last_valid_index),\n  252 |         )","lines":10,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-widgets/src/list/rendering.rs#L243-L252"}]},
{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"In `get_column_widths`, the equal-width fallback computes\n`Constraint::Length(max_width / col_count.max(1) as u16)`. `col_count` is a `usize` derived from the\nmaximum number of cells in any row/header/footer; casting it to `u16` truncates when a row has more\nthan 65535 cells, which would yield a wrong (possibly zero) divisor-derived width. Practically rare,\nbut it is a silent truncating cast on user-controlled data.","fix":"Clamp before casting, e.g. `col_count.clamp(1, u16::MAX as usize) as u16`, or do the division in usize and clamp the result to u16.","locations":[{"ref":"ratatui-widgets/src/table.rs:1145-1147","code":" 1145 |         let widths = if self.widths.is_empty() {\n 1146 |             // Divide the space between each column equally\n 1147 |             vec![Constraint::Length(max_width / col_count.max(1) as u16); col_count]","lines":3,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-widgets/src/table.rs#L1145-L1147"}]},
{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"`selection_width` returns `self.highlight_symbol.width() as u16`, a truncating cast from `usize`.\nA highlight symbol whose total text width exceeds u16::MAX would wrap to a small value, producing a\nwrong selection column width. Edge case, but an unchecked truncating cast feeding rendering layout.","fix":"Saturate the cast: `u16::try_from(self.highlight_symbol.width()).unwrap_or(u16::MAX)`.","locations":[{"ref":"ratatui-widgets/src/table.rs:1177-1184","code":" 1177 |     fn selection_width(&self, state: &TableState) -> u16 {\n 1178 |         let has_selection = state.selected.is_some();\n 1179 |         if self.highlight_spacing.should_add(has_selection) {\n 1180 |             self.highlight_symbol.width() as u16\n 1181 |         } else {\n 1182 |             0\n 1183 |         }\n 1184 |     }","lines":8,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-widgets/src/table.rs#L1177-L1184"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`Style::from_crossterm` does not handle the `NormalIntensity` crossterm attribute, so the DIM-removal round-trip is broken and asymmetric with `Style::into_crossterm`.\n\n`into_crossterm` (line 471) maps `sub_modifier` containing `DIM` to `CrosstermAttribute::NormalIntensity` (SGR 22), and `sub_modifier` containing `BOLD` to `NoBold` (SGR 21). These are distinct crossterm discriminants (verified: `NoBold = 21`, `NormalIntensity = 22`).\n\n`from_crossterm` for `Style` (lines 662-695) only inspects `NoBold`, `NoItalic`, `NotCrossedOut`, `NoUnderline`, `NoHidden`, `NoBlink`, and `NoReverse`. It never checks `NormalIntensity`, so a `ContentStyle` produced from `Style::default().remove_modifier(Modifier::DIM)` converts back to a `Style` with an empty `sub_modifier` — the DIM removal is silently lost. `NormalIntensity` (which a terminal/crossterm uses to reset both bold and dim) is also not surfaced into `sub_modifier` at all.","fix":"In `FromCrossterm<ContentStyle> for Style`, also test `value.attributes.has(CrosstermAttribute::NormalIntensity)` and set `sub_modifier |= Modifier::DIM` (and arguably `Modifier::BOLD` as well, since NormalIntensity resets both intensities). This restores symmetry with `into_crossterm`.","locations":[{"ref":"ratatui-crossterm/src/lib.rs:676-699","code":"  676 | impl FromCrossterm<ContentStyle> for Style {\n  677 |     fn from_crossterm(value: ContentStyle) -> Self {\n  678 |         let mut sub_modifier = Modifier::empty();\n  679 |         if value.attributes.has(CrosstermAttribute::NoBold) {\n  680 |             sub_modifier |= Modifier::BOLD;\n  681 |         }\n  682 |         if value.attributes.has(CrosstermAttribute::NoItalic) {\n  683 |             sub_modifier |= Modifier::ITALIC;\n  684 |         }\n  685 |         if value.attributes.has(CrosstermAttribute::NotCrossedOut) {\n  686 |             sub_modifier |= Modifier::CROSSED_OUT;\n  687 |         }\n  688 |         if value.attributes.has(CrosstermAttribute::NoUnderline) {\n  689 |             sub_modifier |= Modifier::UNDERLINED;\n  690 |         }\n  691 |         if value.attributes.has(CrosstermAttribute::NoHidden) {\n  692 |             sub_modifier |= Modifier::HIDDEN;\n  693 |         }\n  694 |         if value.attributes.has(CrosstermAttribute::NoBlink) {\n  695 |             sub_modifier |= Modifier::RAPID_BLINK | Modifier::SLOW_BLINK;\n  696 |         }\n  697 |         if value.attributes.has(CrosstermAttribute::NoReverse) {\n  698 |             sub_modifier |= Modifier::REVERSED;\n  699 |         }","lines":24,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-crossterm/src/lib.rs#L676-L699"},{"ref":"ratatui-crossterm/src/lib.rs:484-486","code":"  484 |         if self.sub_modifier.contains(Modifier::DIM) {\n  485 |             attributes.set(CrosstermAttribute::NormalIntensity);\n  486 |         }","lines":3,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-crossterm/src/lib.rs#L484-L486"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"hard","description":"`Bar::render_value_with_different_styles` compares and slices byte counts against a cell-based\nbar length, and then subtracts a byte length from a cell-based width.\n\n- Line 218 `if text.len() > bar_length` compares UTF-8 byte count (`text.len()`) against\n  `bar_length`, which is the bar length in cells. For multi-byte text this is the wrong test.\n- Line 234 `area.width as usize - first.len()` subtracts a byte count (`first.len()`) from the\n  cell width `area.width`. If `first` contains multi-byte characters, `first.len()` can exceed\n  `area.width`, causing an integer underflow panic (`usize` subtraction) in this render path.","fix":"Work consistently in display cells: split the text by display width (not byte index) and use\n`saturating_sub` for the remaining width, e.g.\n`area.width as usize - first part's display width`, computed with `unicode_width`, and guard the\nsecond-part render so the width never underflows.","locations":[{"ref":"ratatui-widgets/src/barchart/bar.rs:216-235","code":"  216 |             buf.set_stringn(area.x, area.y, text, bar_length, style);\n  217 |             // render the second part with the bar_style\n  218 |             if text.len() > bar_length {\n  219 |                 // Find the last character boundary at or before bar_length\n  220 |                 let bar_length = text\n  221 |                     .char_indices()\n  222 |                     .take_while(|(i, _)| *i < bar_length)\n  223 |                     .last()\n  224 |                     .map_or(0, |(i, c)| i + c.len_utf8());\n  225 | \n  226 |                 let (first, second) = text.split_at(bar_length);\n  227 | \n  228 |                 let style = bar_style.patch(self.style);\n  229 |                 buf.set_stringn(\n  230 |                     area.x + first.len() as u16,\n  231 |                     area.y,\n  232 |                     second,\n  233 |                     area.width as usize - first.len(),\n  234 |                     style,\n  235 |                 );","lines":20,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-widgets/src/barchart/bar.rs#L216-L235"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `Table::visible_rows`, the loop that fills the initial visible window breaks based on\n`height + item.height > area.height` (raw row height, excluding margins), but then accumulates\n`height += item.height_with_margin()` (height + top_margin + bottom_margin). The break test and the\naccumulator use two different quantities for the same row. When rows have non-zero top/bottom\nmargins this makes the visible-row computation inconsistent: a row whose content height fits but\nwhose total height-with-margin overflows the area is still counted as visible, and `height` can be\ndriven past `area.height` while the loop keeps thinking there is room. This produces wrong\nstart/end indices (rows partially clipped or an extra/missing row) when margins are used.","fix":"Use a single consistent metric. Either test `height + item.height_with_margin() > area.height`\nbefore adding, or compute `next = height.saturating_add(item.height_with_margin())` and break when\n`next > area.height`, then assign `height = next`. Match this against how `render_rows` advances\n`y_offset` by `height_with_margin()`.","locations":[{"ref":"ratatui-widgets/src/table.rs:1037-1043","code":" 1037 |         for item in self.rows.iter().skip(start) {\n 1038 |             if height + item.height > area.height {\n 1039 |                 break;\n 1040 |             }\n 1041 |             height += item.height_with_margin();\n 1042 |             end += 1;\n 1043 |         }","lines":7,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-widgets/src/table.rs#L1037-L1043"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`Buffer::with_lines` casts `lines.len() as u16` and the max line width\n`... as u16` without saturation. A buffer built from more than 65535 lines (or\nlines wider than 65535 cells) silently truncates the height/width, producing a\nbuffer that does not contain all the supplied content, and later iteration over\n`lines` writes to rows beyond `height` via `set_line` (which is clamped, so the\nextra lines are silently dropped). This is an edge case but the truncation is\nsilent.","fix":"Use saturating conversions (e.g. `u16::try_from(lines.len()).unwrap_or(u16::MAX)`)\nand document the limit, or debug_assert that the dimensions fit in u16.","locations":[{"ref":"ratatui-core/src/buffer/buffer.rs:97-104","code":"   97 |         let lines = lines.into_iter().map(Into::into).collect::<Vec<_>>();\n   98 |         let height = lines.len() as u16;\n   99 |         let width = lines.iter().map(Line::width).max().unwrap_or_default() as u16;\n  100 |         let mut buffer = Self::empty(Rect::new(0, 0, width, height));\n  101 |         for (y, line) in lines.iter().enumerate() {\n  102 |             buffer.set_line(0, y as u16, line, width);\n  103 |         }\n  104 |         buffer","lines":8,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-core/src/buffer/buffer.rs#L97-L104"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`str::cell_width` treats any single-byte string as width 1 via the fast ASCII\npath (`if self.len() == 1`), guarded only by a `debug_assert!` against control\ncharacters. In release builds a single-byte control character (e.g. a stray\n\"\\n\" or \"\\t\" that bypassed filtering through the low-level `Cell::set_symbol`/\n`set_char`) is silently reported as width 1 instead of 0, which can desynchronize\ncursor/cell accounting in diffing. The doc acknowledges this but it is a real\ncorrectness gap for callers using the low-level cell APIs.","fix":"Either keep the debug_assert and document clearly that control chars are UB for\nwidth, or handle control characters in release too (return 0) to be robust\nagainst callers of the low-level Cell APIs.","locations":[{"ref":"ratatui-core/src/buffer/cell_width.rs:34-45","code":"   34 |     fn cell_width(&self) -> u16 {\n   35 |         if self.len() == 1 {\n   36 |             debug_assert!(\n   37 |                 !self.as_bytes()[0].is_ascii_control(),\n   38 |                 \"control character passed to cell_width without filtering\"\n   39 |             );\n   40 |             1\n   41 |         } else {\n   42 |             let width = self.width() as u16;\n   43 |             width.saturating_add(count_halfwidth_sound_marks(self))\n   44 |         }\n   45 |     }","lines":12,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-core/src/buffer/cell_width.rs#L34-L45"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `draw_lines_over_cleared`, the temporary `Rect` is built with an incorrect `height`:\n`Rect::new(0, y_offset, width as u16, y_offset + lines_to_draw)`. The 4th argument to\n`Rect::new` is the height, but `y_offset + lines_to_draw` is passed, which is the bottom row,\nnot the number of rows. This makes `old = Buffer::empty(area)` over-allocate `width * y_offset`\nempty cells, while the `new` Buffer is given the SAME (wrong) area but only `width * lines_to_draw`\ncells of content, so `new.content.len()` is inconsistent with `new.area`. It happens to still\nproduce correct draw positions only because `BufferDiff` caps iteration at the shorter content\nlength and `pos_of` adds `area.y` (= `y_offset`). The height should be `lines_to_draw`. As written\nit is fragile (relies on a content/area mismatch) and wastes an allocation proportional to\n`y_offset` on every inserted chunk when the viewport is not at the top of the screen.","fix":"Build the rect with the correct height and matching content, e.g.\n`let area = Rect::new(0, y_offset, width as u16, lines_to_draw);` so that both `old` and `new`\nhave `width * lines_to_draw` cells and the Rect height matches the content.","locations":[{"ref":"ratatui-core/src/terminal/inline.rs:337-342","code":"  337 |             let area = Rect::new(0, y_offset, width as u16, y_offset + lines_to_draw);\n  338 |             let old = Buffer::empty(area);\n  339 |             let new = Buffer {\n  340 |                 area,\n  341 |                 content: to_draw.to_vec(),\n  342 |             };","lines":6,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-core/src/terminal/inline.rs#L337-L342"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`Line`'s `Debug` impl writes the span content unescaped for the common single-span/default-style case. It uses `f.write_str(&self.spans[0].content)` wrapped in literal quotes instead of debug formatting (`{:?}`). This means content containing quotes, backslashes, or newlines produces invalid/misleading debug output, and is inconsistent with both the single-styled-span branch (which calls `Span::fmt`, using `{:?}`) and the `Span` Debug impl itself.","fix":"Format the content with debug escaping, e.g. `write!(f, \"Line::from({:?})\", self.spans[0].content)?;` instead of writing the raw string between literal quote characters.","locations":[{"ref":"ratatui-core/src/text/line.rs:199-202","code":"  199 |         } else if self.spans.len() == 1 && self.spans[0].style == Style::default() {\n  200 |             f.write_str(r#\"Line::from(\"\"#)?;\n  201 |             f.write_str(&self.spans[0].content)?;\n  202 |             f.write_str(r#\"\")\"#)?;","lines":4,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-core/src/text/line.rs#L199-L202"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"hard","description":"The `render_right_titles` doc comment documents a known bug: when the block is too small to fit all\nright-aligned titles, the right side of the leftmost title is cut off instead of the left side, due\nto incorrect line truncation (references issue 932). This is a real rendering correctness issue in\nthe audited slice, left unfixed.","fix":"Truncate the left side (not the right) of the leftmost right-aligned title when space is insufficient, mirroring the offset-based left truncation used for centered titles in `render_centered_titles_with_truncation`.","locations":[{"ref":"ratatui-widgets/src/block.rs:932-966","code":"  932 |     /// Render titles aligned to the right of the block\n  933 |     ///\n  934 |     /// Currently (due to the way lines are truncated), the right side of the leftmost title will\n  935 |     /// be cut off if the block is too small to fit all titles. This is not ideal and should be\n  936 |     /// the left side of that leftmost that is cut off. This is due to the line being truncated\n  937 |     /// incorrectly. See <https://github.com/ratatui/ratatui/issues/932>\n  938 |     #[expect(clippy::similar_names)]\n  939 |     fn render_right_titles(&self, position: TitlePosition, area: Rect, buf: &mut Buffer) {\n  940 |         let titles = self.filtered_titles(position, Alignment::Right);\n  941 |         let mut titles_area = self.titles_area(area, position);\n  942 | \n  943 |         // render titles in reverse order to align them to the right\n  944 |         for title in titles.rev() {\n  945 |             if titles_area.is_empty() {\n  946 |                 break;\n  947 |             }\n  948 |             let title_width = Self::line_width_u16(title);\n  949 |             let title_area = Rect {\n  950 |                 x: titles_area\n  951 |                     .right()\n  952 |                     .saturating_sub(title_width)\n  953 |                     .max(titles_area.left()),\n  954 |                 width: title_width.min(titles_area.width),\n  955 |                 ..titles_area\n  956 |             };\n  957 |             buf.set_style(title_area, self.titles_style);\n  958 |             title.render(title_area, buf);\n  959 | \n  960 |             // bump the width of the titles area to the left\n  961 |             titles_area.width = titles_area\n  962 |                 .width\n  963 |                 .saturating_sub(title_width)\n  964 |                 .saturating_sub(1); // space between titles\n  965 |         }\n  966 |     }","lines":35,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-widgets/src/block.rs#L932-L966"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"The vertical bounds guard before writing a calendar week row compares the absolute row coordinate `y` against `buf.area.height` rather than against `buf.area.bottom()`. `y` starts at `days_area.y`, which is an absolute buffer coordinate that includes the buffer's `area.y` origin, while `buf.area.height` is just the height (origin-independent). For a buffer whose area has a non-zero `y` origin this comparison is wrong: it can reject rows that are actually in bounds (when the origin is large) or, more generally, mismatch the valid range `[area.y, area.y+height)`. It happens not to panic only because `set_stringn` clamps `x` (but not `y`); the guard is the only thing standing between this code and an out-of-bounds `y`, and it is computed incorrectly.","fix":"Compare against `buf.area.bottom()` instead of `buf.area.height` (and ideally also check `y >= buf.area.top()`).","locations":[{"ref":"ratatui-widgets/src/calendar.rs:225","code":"  225 |             if buf.area.height > y {","lines":1,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-widgets/src/calendar.rs#L225"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"When rendering canvas labels, the horizontal and vertical scale factors are computed as `(label.x - left) * resolution.0 / width` and `(top - label.y) * resolution.1 / height`, where `width = (x_bounds[1] - x_bounds[0]).abs()` and `height = (y_bounds[1] - y_bounds[0]).abs()`. If the x or y bounds are equal (a zero-width or zero-height viewport, which is the default `[0.0, 0.0]`), these divisions are by `0.0`, yielding `NaN`/`Inf`, which `as u16` then converts to 0. The label is placed at the canvas origin instead of being skipped. The label filter on the preceding lines does not exclude this degenerate case.","fix":"Guard against `width <= 0.0` / `height <= 0.0` (skip label rendering or the whole label loop) before dividing.","locations":[{"ref":"ratatui-widgets/src/canvas.rs:919-933","code":"  919 |         let width = (self.x_bounds[1] - self.x_bounds[0]).abs();\n  920 |         let height = (self.y_bounds[1] - self.y_bounds[0]).abs();\n  921 |         let resolution = {\n  922 |             let width = f64::from(canvas_area.width - 1);\n  923 |             let height = f64::from(canvas_area.height - 1);\n  924 |             (width, height)\n  925 |         };\n  926 |         for label in ctx\n  927 |             .labels\n  928 |             .iter()\n  929 |             .filter(|l| l.x >= left && l.x <= right && l.y <= top && l.y >= bottom)\n  930 |         {\n  931 |             let x = ((label.x - left) * resolution.0 / width) as u16 + canvas_area.left();\n  932 |             let y = ((top - label.y) * resolution.1 / height) as u16 + canvas_area.top();\n  933 |             buf.set_line(x, y, &label.line, canvas_area.right() - x);","lines":15,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-widgets/src/canvas.rs#L919-L933"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `Chart::render_y_labels` the visibility guard `if dy < graph_area.bottom()` compares a\nrelative vertical offset (`dy`, range `0..=graph_area.height-1`) against an absolute buffer\ncoordinate (`graph_area.bottom()`). The intent appears to be ensuring the label stays inside the\ngraph, but mixing a relative offset with an absolute coordinate is meaningless: when the graph\narea does not start at y=0 the test never excludes anything (it is always true because\n`dy <= height-1 < bottom`), and the real clamping is silently done by `saturating_sub` on the\nnext line. The guard is effectively dead/incorrect.","fix":"Compare against the relative height instead, e.g. `if dy < graph_area.height`, or remove the redundant check since the y position is already computed safely.","locations":[{"ref":"ratatui-widgets/src/chart.rs:980-981","code":"  980 |             let dy = i as u16 * (graph_area.height - 1) / (labels_len - 1);\n  981 |             if dy < graph_area.bottom() {","lines":2,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-widgets/src/chart.rs#L980-L981"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`restore`/`try_restore` unconditionally executes `LeaveAlternateScreen`, but `init_with_options` / `try_init_with_options` intentionally never enter the alternate screen (only raw mode is enabled). After an inline-viewport app initialized via `init_with_options`, calling `restore()` emits a `LeaveAlternateScreen` sequence that was never matched by an `EnterAlternateScreen`. On most terminals this is a harmless no-op, but it is an asymmetry between init and restore and can produce spurious escape sequences / unexpected screen-buffer switches on some terminals.","fix":"Either track whether the alternate screen was entered (so restore only leaves it when it was entered), or document that `restore` is intended for the full-screen `init` path and inline apps should restore manually. At minimum the asymmetry should be made explicit.","locations":[{"ref":"ratatui/src/init.rs:622-628","code":"  622 | pub fn try_restore() -> io::Result<()> {\n  623 |     // disabling raw mode first is important as it has more side effects than leaving the alternate\n  624 |     // screen buffer\n  625 |     disable_raw_mode()?;\n  626 |     execute!(stdout(), LeaveAlternateScreen)?;\n  627 |     Ok(())\n  628 | }","lines":7,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui/src/init.rs#L622-L628"},{"ref":"ratatui/src/init.rs:560-565","code":"  560 | pub fn try_init_with_options(options: TerminalOptions) -> io::Result<DefaultTerminal> {\n  561 |     set_panic_hook();\n  562 |     enable_raw_mode()?;\n  563 |     let backend = CrosstermBackend::new(stdout());\n  564 |     Terminal::with_options(backend, options)\n  565 | }","lines":6,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui/src/init.rs#L560-L565"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"`Buffer::set_stringn` resets trailing cells of a multi-width grapheme by writing\ndefault cells, but does not copy the style onto them, while the diff logic in\n`diff.rs` deliberately ignores style-only changes in trailing cells. This is\nconsistent today, but the reset trailing cells get `Cell::EMPTY` styling rather\nthan the grapheme's style; if a future change makes trailing-cell style visible\nthis will produce inconsistent backgrounds under wide graphemes. Noting as a\nlatent coupling between `set_stringn` and `diff` rather than an active bug.","fix":"Document the invariant that trailing cells of wide graphemes are reset and their\nstyle is not considered visible, in both `set_stringn` and the diff iterator, to\nkeep the two in sync.","locations":[{"ref":"ratatui-core/src/buffer/buffer.rs:359-368","code":"  359 |         for (symbol, width) in graphemes {\n  360 |             self[(x, y)].set_symbol(symbol).set_style(style);\n  361 |             let next_symbol = x + width;\n  362 |             x += 1;\n  363 |             // Reset following cells if multi-width (they would be hidden by the grapheme),\n  364 |             while x < next_symbol {\n  365 |                 self[(x, y)].reset();\n  366 |                 x += 1;\n  367 |             }\n  368 |         }","lines":10,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-core/src/buffer/buffer.rs#L359-L368"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`Layout::spacers` uses `.expect(\"invalid number of rects\")` while the sibling\n`Layout::areas` produces a richer panic message including expected vs found\ncounts. The terse message makes debugging a wrong const-generic length harder\nfor `spacers`, which is an easy off-by-one to hit (spacers count = segments + 1).","fix":"Mirror the `areas` implementation: use `unwrap_or_else` with a panic message\nthat reports the expected `N` and the actual `spacers.len()`.","locations":[{"ref":"ratatui-core/src/layout/layout.rs:648-654","code":"  648 |     pub fn spacers<const N: usize>(&self, area: Rect) -> [Rect; N] {\n  649 |         let (_, spacers) = self.split_with_spacers(area);\n  650 |         spacers\n  651 |             .as_ref()\n  652 |             .try_into()\n  653 |             .expect(\"invalid number of rects\")\n  654 |     }","lines":7,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-core/src/layout/layout.rs#L648-L654"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","difficulty":"hard","description":"`cached_split` builds the cache key as `(area, self.clone())` on every call,\nwhich clones the entire `Layout` (including its `Vec<Constraint>`) even on a\ncache hit. `split`/`areas` are called on every widget render, so this is a\nheap allocation per layout lookup in the hot render path, defeating part of the\nbenefit of caching. The no_std variant clones twice (once for the lookup, once\nfor insertion).","fix":"Use a borrowed/hashable key for lookup (e.g. implement a Borrow-based key or\nhash the (area, layout) without owning a clone), and only clone the Layout when\nactually inserting a new entry on a cache miss.","locations":[{"ref":"ratatui-core/src/layout/layout.rs:753-793","code":"  753 |     #[cfg(all(feature = \"layout-cache\", feature = \"std\"))]\n  754 |     fn cached_split(&self, area: Rect) -> (Segments, Spacers) {\n  755 |         LAYOUT_CACHE.with_borrow_mut(|cache| {\n  756 |             let key = (area, self.clone());\n  757 |             cache.get_or_insert(key, || self.split_layout(area)).clone()\n  758 |         })\n  759 |     }\n  760 | \n  761 |     // no_std builds: use a critical-section cache and compute layouts outside locks.\n  762 |     #[cfg(all(feature = \"layout-cache\", not(feature = \"std\")))]\n  763 |     fn cached_split(&self, area: Rect) -> (Segments, Spacers) {\n  764 |         // Check cache inside critical section, but compute outside to avoid\n  765 |         // blocking interrupts during the (expensive) constraint solver.\n  766 |         let cached = critical_section::with(|cs| {\n  767 |             let mut cache = LAYOUT_CACHE.borrow(cs).borrow_mut();\n  768 |             let cache = cache.get_or_insert_with(|| {\n  769 |                 Cache::new(NonZeroUsize::new(Self::DEFAULT_CACHE_SIZE).unwrap())\n  770 |             });\n  771 |             let key = (area, self.clone());\n  772 |             cache\n  773 |                 .get(&key)\n  774 |                 .map(|(s, sp)| (Rc::from(s.as_slice()), Rc::from(sp.as_slice())))\n  775 |         });\n  776 | \n  777 |         match cached {\n  778 |             Some(result) => result,\n  779 |             None => {\n  780 |                 let result = self.split_layout(area);\n  781 | \n  782 |                 critical_section::with(|cs| {\n  783 |                     let mut cache = LAYOUT_CACHE.borrow(cs).borrow_mut();\n  784 |                     if let Some(cache) = cache.as_mut() {\n  785 |                         let key = (area, self.clone());\n  786 |                         cache.put(key, (result.0.to_vec(), result.1.to_vec()));\n  787 |                     }\n  788 |                 });\n  789 | \n  790 |                 result\n  791 |             }\n  792 |         }\n  793 |     }","lines":41,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-core/src/layout/layout.rs#L753-L793"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`Buffer::merge` relocates existing content cell-by-cell using `pos_of` (which\nperforms a div and mod per cell) and clones each `Cell` individually, then does\nthe same for the other buffer. For large buffers this is O(n) div/mod plus n\nclones with per-cell `reset`. When the area does not actually change\n(`self.area == area` and offsets align), the entire relocation loop still runs\nand clones cells onto themselves-only the `if i != k` guard avoids the copy.","fix":"Short-circuit when `self.area == area` (no relocation needed). Consider\nrow-wise copying using slice operations instead of per-cell `pos_of`/clone.","locations":[{"ref":"ratatui-core/src/buffer/buffer.rs:435-461","code":"  435 |     pub fn merge(&mut self, other: &Self) {\n  436 |         let area = self.area.union(other.area);\n  437 |         self.content.resize(area.area() as usize, Cell::EMPTY);\n  438 | \n  439 |         // Move original content to the appropriate space\n  440 |         let size = self.area.area() as usize;\n  441 |         for i in (0..size).rev() {\n  442 |             let (x, y) = self.pos_of(i);\n  443 |             // New index in content\n  444 |             let k = ((y - area.y) * area.width + x - area.x) as usize;\n  445 |             if i != k {\n  446 |                 self.content[k] = self.content[i].clone();\n  447 |                 self.content[i].reset();\n  448 |             }\n  449 |         }\n  450 | \n  451 |         // Push content of the other buffer into this one (may erase previous\n  452 |         // data)\n  453 |         let size = other.area.area() as usize;\n  454 |         for i in 0..size {\n  455 |             let (x, y) = other.pos_of(i);\n  456 |             // New index in content\n  457 |             let k = ((y - area.y) * area.width + x - area.x) as usize;\n  458 |             self.content[k] = other.content[i].clone();\n  459 |         }\n  460 |         self.area = area;\n  461 |     }","lines":27,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-core/src/buffer/buffer.rs#L435-L461"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`Color::from_str` performs `to_lowercase()` followed by seven chained `String::replace` calls. Each of these allocates a new `String`, so parsing any color string allocates roughly eight intermediate heap strings even for the trivial cases (e.g. \"red\"). While color parsing is not usually a hot path, this is wasteful for code that parses many colors (e.g. loading large themes).","fix":"Normalize once into a single buffer (e.g. build a lowercased, separator-stripped string in one pass) and match on the small set of known names, applying the bright/grey/silver aliasing without repeated full-string `replace` allocations.","locations":[{"ref":"ratatui-core/src/style/color.rs:293-303","code":"  293 |             match s\n  294 |                 .to_lowercase()\n  295 |                 .replace([' ', '-', '_'], \"\")\n  296 |                 .replace(\"bright\", \"light\")\n  297 |                 .replace(\"grey\", \"gray\")\n  298 |                 .replace(\"silver\", \"gray\")\n  299 |                 .replace(\"lightblack\", \"darkgray\")\n  300 |                 .replace(\"lightwhite\", \"white\")\n  301 |                 .replace(\"lightgray\", \"white\")\n  302 |                 .as_ref()\n  303 |             {","lines":11,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-core/src/style/color.rs#L293-L303"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`List` rendering allocates a fresh highlight/empty-symbol buffer on every render: `\" \".repeat(width)`\nbuilds a new `String` and `.to_line()` builds a new `Line` each frame, even when no item is selected\nand `selection_spacing` would be false. This allocation is done unconditionally before the spacing\ndecision and runs on every render call.","fix":"Compute `empty_symbol` lazily only when `selection_spacing` is true, and avoid the intermediate `String`/`Line` allocation (e.g. render spaces directly).","locations":[{"ref":"ratatui-widgets/src/list/rendering.rs:66-71","code":"   66 |         let highlight_symbol_width = highlight_symbol.width() as u16;\n   67 |         let empty_symbol = \" \".repeat(highlight_symbol_width as usize);\n   68 |         let empty_symbol = empty_symbol.to_line();\n   69 | \n   70 |         let mut current_height = 0;\n   71 |         let selection_spacing = self.highlight_spacing.should_add(state.selected.is_some());","lines":6,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-widgets/src/list/rendering.rs#L66-L71"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In the hot `WordWrapper::next_line` path, every emitted wrapped line recomputes its display width by\niterating all of its graphemes and summing `symbol.cell_width()`. The width of each line is already\nfully known inside `process_input` (it is tracked in the `line_width` accumulator) but is discarded\nwhen the line is pushed into `wrapped_lines`. For large/wrapped paragraphs this doubles the\nper-grapheme width computation work on the rendering hot path.","fix":"Store the computed width alongside each line (e.g. push `(Vec<StyledGrapheme>, u16)` into `wrapped_lines`) so `next_line` can return it directly instead of recomputing.","locations":[{"ref":"ratatui-widgets/src/reflow.rs:214-218","code":"  214 |             if let Some(line) = self.wrapped_lines.pop_front() {\n  215 |                 let line_width = line\n  216 |                     .iter()\n  217 |                     .map(|grapheme| grapheme.symbol.cell_width())\n  218 |                     .sum();","lines":5,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-widgets/src/reflow.rs#L214-L218"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`render_rows` calls `columns_widths.iter().collect()` to build a fresh `Vec<&Rect>` for every\nvisible row before passing it to `render_row_cells`, which immediately turns it back into an\niterator. This allocates one temporary Vec per rendered row on every frame, in the hot render loop,\nfor no functional reason.","fix":"Change `render_row_cells` to accept `&[Rect]` (or an `impl Iterator<Item = &Rect>`) instead of\n`Vec<&Rect>`, and pass `columns_widths` directly (`columns_widths.iter()`), avoiding the per-row\nallocation.","locations":[{"ref":"ratatui-widgets/src/table.rs:904","code":"  904 |             self.render_row_cells(buf, columns_widths.iter().collect(), &row.cells, row_area);","lines":1,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-widgets/src/table.rs#L904"},{"ref":"ratatui-widgets/src/table.rs:943-950","code":"  943 |     fn render_row_cells(\n  944 |         &self,\n  945 |         buf: &mut Buffer,\n  946 |         column_widths: Vec<&Rect>,\n  947 |         cells: &Vec<Cell>,\n  948 |         row_area: Rect,\n  949 |     ) {\n  950 |         let mut column_widths_iterator = column_widths.into_iter();","lines":8,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-widgets/src/table.rs#L943-L950"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"medium","difficulty":"very_easy","description":"The `Layout::spacing` doc states: \"spacing will not be applied for\n[`Flex::SpaceAround`], [`Flex::SpaceEvenly`] and [`Flex::SpaceBetween`]\". This\ncontradicts `configure_flex_constraints`, which for exactly those three flex\nmodes adds `spacer.has_min_size(spacing, SPACER_SIZE_EQ)` constraints, so the\nuser-provided spacing IS applied as a minimum gap between segments. Either the\ndocumentation is wrong or the constraint application is. The behavior (spacing\napplied) appears intended, so the comment is misleading.","fix":"Update the `spacing` doc comment to describe the actual behavior (spacing acts\nas a minimum spacer size for SpaceAround/SpaceEvenly/SpaceBetween), or remove\nthe `has_min_size(spacing, ...)` calls if no spacing is truly desired there.","locations":[{"ref":"ratatui-core/src/layout/layout.rs:524-526","code":"  524 |     /// Note that if the layout has only one segment, the spacing will not be applied.\n  525 |     /// Also, spacing will not be applied for [`Flex::SpaceAround`], [`Flex::SpaceEvenly`] and\n  526 |     /// [`Flex::SpaceBetween`]","lines":3,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-core/src/layout/layout.rs#L524-L526"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"medium","difficulty":"very_easy","description":"The per-constant rustfmt::skip doc comment for the Tailwind `TEAL` palette contains the wrong hex values. The HTML swatches on that doc line list `#f5fdf4 #e7f9e7 #c6f6d5 #9ae6b4 #68d391 #48bb78 #38a169 #2f855a #276749 #22543d #0d3321` (these are a green/Chakra-style ramp), whereas the actual `TEAL` constant (and the module-level doc table at lines 157-163) correctly use the teal ramp (`#f0fdfa` ... `#042f2e`). The rendered rustdoc swatch for TEAL is therefore completely wrong.","fix":"Replace the hex values in the doc comment on line 496 with the correct teal ramp matching the constant: f0fdfa, ccfbf1, 99f6e4, 5eead4, 2dd4bf, 14b8a6, 0d9488, 0f766e, 115e59, 134e4a, 042f2e.","locations":[{"ref":"ratatui-core/src/style/palette/tailwind.rs:541-542","code":"  541 | #[rustfmt::skip]\n  542 | /// <style>.palette div{width:2rem;height:2rem}<\/style><div class=\"palette\" style=\"display:flex;flex-direction:row\"><div style=\"background-color: #f5fdf4\"><\/div><div style=\"background-color: #e7f9e7\"><\/div><div style=\"background-color: #c6f6d5\"><\/div><div style=\"background-color: #9ae6b4\"><\/div><div style=\"background-color: #68d391\"><\/div><div style=\"background-color: #48bb78\"><\/div><div style=\"background-color: #38a169\"><\/div><div style=\"background-color: #2f855a\"><\/div><div style=\"background-color: #276749\"><\/div><div style=\"background-color: #22543d\"><\/div><div style=\"background-color: #0d3321\"><\/div><\/div>","lines":2,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-core/src/style/palette/tailwind.rs#L541-L542"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment for `Backend::scroll_region_down` tells the reader to \"See the documentation for\n[`Self::scroll_region_down`] for more information\" — it references itself instead of\n`scroll_region_up`. The intent is clearly to point at the up-scroll variant (which carries the\ndetailed ANSI explanation); the self-reference is a copy/paste mistake.","fix":"Change the cross-reference to `[`Self::scroll_region_up`]`.","locations":[{"ref":"ratatui-core/src/backend.rs:409-411","code":"  409 |     /// See the documentation for [`Self::scroll_region_down`] for more information about how this\n  410 |     /// is expected to be implemented for ANSI terminals. All of that applies, except the ANSI\n  411 |     /// sequence to scroll down is \"^[[NT\".","lines":3,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-core/src/backend.rs#L409-L411"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The Tailwind module doc says \"There are 22 palettes\" (line 5) but the documentation table only lists 21 palettes (SLATE through PINK). The `ROSE` palette is exported as a constant (line 641) but is entirely missing from the doc table, so the count and the table are inconsistent.","fix":"Add a ROSE row to the module-level doc table so it matches the 22-palette count and the exported constants.","locations":[{"ref":"ratatui-core/src/style/palette/tailwind.rs:5-7","code":"    5 | //! There are 22 palettes. Each palette has 11 colors, with variants from 50 to 950. Black and White\n    6 | //! are also included for completeness and to avoid being affected by any terminal theme that might\n    7 | //! be in use.","lines":3,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-core/src/style/palette/tailwind.rs#L5-L7"},{"ref":"ratatui-core/src/style/palette/tailwind.rs:685-699","code":"  685 | #[rustfmt::skip]\n  686 | /// <style>.palette div{width:22rem;height:2rem}<\/style><div class=\"palette\" style=\"display:flex;flex-direction:row\"><div style=\"background-color: #fff1f2\"><\/div><div style=\"background-color: #ffe4e6\"><\/div><div style=\"background-color: #fecdd3\"><\/div><div style=\"background-color: #fda4af\"><\/div><div style=\"background-color: #fb7185\"><\/div><div style=\"background-color: #f43f5e\"><\/div><div style=\"background-color: #e11d48\"><\/div><div style=\"background-color: #be123c\"><\/div><div style=\"background-color: #9f1239\"><\/div><div style=\"background-color: #881337\"><\/div><div style=\"background-color: #4c0519\"><\/div><\/div>\n  687 | pub const ROSE: Palette = Palette {\n  688 |     c50: Color::from_u32(0xfff1f2),\n  689 |     c100: Color::from_u32(0xffe4e6),\n  690 |     c200: Color::from_u32(0xfecdd3),\n  691 |     c300: Color::from_u32(0xfda4af),\n  692 |     c400: Color::from_u32(0xfb7185),\n  693 |     c500: Color::from_u32(0xf43f5e),\n  694 |     c600: Color::from_u32(0xe11d48),\n  695 |     c700: Color::from_u32(0xbe123c),\n  696 |     c800: Color::from_u32(0x9f1239),\n  697 |     c900: Color::from_u32(0x881337),\n  698 |     c950: Color::from_u32(0x4c0519),\n  699 | };","lines":15,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-core/src/style/palette/tailwind.rs#L685-L699"}]},
{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The module-level Tailwind color table contains several transcription errors where the documented swatch hex values disagree with the actual exported constants (the constants are correct):\n- `GRAY` c950: table shows `#0a0a0a` (line 42) but the constant is `0x030712`.\n- `ZINC` row (lines 48-53): the table reproduces the NEUTRAL ramp (`#f5f5f5 #e5e5e5 #d4d4d4 ... #404040 #262626 #171717 #0a0a0a`) instead of zinc's actual values (`f4f4f5 e4e4e7 d4d4d8 ... 3f3f46 27272a 18181b 09090b`).\n- `PURPLE` c950: table shows `#4c136e` (line 229) but constant is `0x3b0764`.\n- `FUCHSIA` c950: table shows `#4e145b` (line 240) but constant is `0x4a044e`.\n- `PINK` c950: table shows `#5f0b37` (line 251) but constant is `0x500724`.\nThese produce misleading rustdoc swatches.","fix":"Correct the documented swatch hex values to match the exported constants (and the official Tailwind palette).","locations":[{"ref":"ratatui-core/src/style/palette/tailwind.rs:46","code":"   46 | //!     <div style=\"background-color: #0a0a0a\"><\/div>","lines":1,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-core/src/style/palette/tailwind.rs#L46"},{"ref":"ratatui-core/src/style/palette/tailwind.rs:54-59","code":"   54 | //!     <div style=\"background-color: #fafafa\"><\/div> <div style=\"background-color: #f5f5f5\"><\/div>\n   55 | //!     <div style=\"background-color: #e5e5e5\"><\/div> <div style=\"background-color: #d4d4d4\"><\/div>\n   56 | //!     <div style=\"background-color: #a1a1aa\"><\/div> <div style=\"background-color: #71717a\"><\/div>\n   57 | //!     <div style=\"background-color: #52525b\"><\/div> <div style=\"background-color: #404040\"><\/div>\n   58 | //!     <div style=\"background-color: #262626\"><\/div> <div style=\"background-color: #171717\"><\/div>\n   59 | //!     <div style=\"background-color: #0a0a0a\"><\/div>","lines":6,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-core/src/style/palette/tailwind.rs#L54-L59"},{"ref":"ratatui-core/src/style/palette/tailwind.rs:267","code":"  267 | //!     <div style=\"background-color: #4c136e\"><\/div>","lines":1,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-core/src/style/palette/tailwind.rs#L267"},{"ref":"ratatui-core/src/style/palette/tailwind.rs:280","code":"  280 | //!     <div style=\"background-color: #4e145b\"><\/div>","lines":1,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-core/src/style/palette/tailwind.rs#L280"},{"ref":"ratatui-core/src/style/palette/tailwind.rs:293","code":"  293 | //!     <div style=\"background-color: #5f0b37\"><\/div>","lines":1,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-core/src/style/palette/tailwind.rs#L293"}]},
{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"`try_draw`'s doc states: \"If the render callback returns an error, Ratatui leaves the backend,\nbuffers, cursor state, and frame count unchanged.\" This is not strictly true: `autoresize()` runs\nBEFORE the render callback, and on a size change it resizes both buffers, clears the affected\nregion of the backend, and updates `last_known_area`/`viewport_area`. If the callback then returns\nan error, those resize/clear side effects on the backend and buffers persist. The more accurate\ndescription in `terminal.rs` (\"Ratatui may have already resized internal buffers, written part of\nthe diff, or left cursor state unapplied\") contradicts this claim.","fix":"Reword to clarify that buffers/backend may already have been resized/cleared by the pre-render\nautoresize step, and only the render diff, cursor application, buffer swap, and frame-count\nincrement are skipped on a callback error.","locations":[{"ref":"ratatui-core/src/terminal/render.rs:124-125","code":"  124 |     /// If the render callback returns an error, Ratatui leaves the backend, buffers, cursor state,\n  125 |     /// and frame count unchanged.","lines":2,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-core/src/terminal/render.rs#L124-L125"}]},
{"id":"CMT_7","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment for `get_cell_area` states it returns `Some(Rect{x, y = 0, width, height = 0})`,\nbut the implementation returns `Rect::new(first.x, first.y, width, 1)` — `y` is `first.y` (not 0)\nand `height` is `1` (not 0). The documented contract does not match the code.","fix":"Update the doc comment to describe the actual return value (x = first.x, y = first.y, height = 1).","locations":[{"ref":"ratatui-widgets/src/table.rs:983-986","code":"  983 |     /// Returns `None` when there are no more columns for the [`Cell`] to occupy.\n  984 |     ///\n  985 |     /// Otherwise, returns `Some(Rect{x, y = 0, width, height = 0})`, representing the start\n  986 |     /// x-coordinate and width of the [`Cell`].","lines":4,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-widgets/src/table.rs#L983-L986"},{"ref":"ratatui-widgets/src/table.rs:1012","code":" 1012 |         Some(Rect::new(first.x, first.y, width, 1))","lines":1,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-widgets/src/table.rs#L1012"}]},
{"id":"CMT_8","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The inline comment on the `--ignore-private` cargo-hack flag claims it excludes \"packages that are libraries\". `--ignore-private` actually skips packages marked `publish = false` (private packages), which has nothing to do with whether a package is a library vs a binary. The comment is misleading.","fix":"Reword the comment to: `// skip packages marked publish = false`.","locations":[{"ref":"xtask/src/commands.rs:186","code":"  186 |         \"--ignore-private\", // exclude packages that are libraries","lines":1,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/xtask/src/commands.rs#L186"}]},
{"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"hard","description":"`table.rs` is ~2718 lines and `block.rs` ~2372 lines. Beyond size, the title-rendering logic in\nblock.rs is spread across `render_title_position`, `render_left_titles`, `render_center_titles`,\n`render_centered_titles_without_truncation`, `render_centered_titles_with_truncation`, and\n`render_right_titles`, with subtle interdependent truncation/offset arithmetic and a known-incorrect\ntruncation behavior acknowledged in the code (see issue 932 reference). This concentration of\nfiddly Rect math in many private helpers with shared invariants makes the rendering path hard to\nreason about and is a maintainability risk for the off-by-one / clipping bugs noted elsewhere.","fix":"Consider extracting the title layout computation (producing a list of (Rect, &Line) to render) into a single pure function that can be unit-tested independently of buffer mutation, and similarly isolate Table's column/row geometry computation.","locations":[{"ref":"ratatui-widgets/src/block.rs:920-1069","code":"  920 |     fn render_titles(&self, area: Rect, buf: &mut Buffer) {\n  921 |         self.render_title_position(TitlePosition::Top, area, buf);\n  922 |         self.render_title_position(TitlePosition::Bottom, area, buf);\n  923 |     }\n  924 | \n  925 |     fn render_title_position(&self, position: TitlePosition, area: Rect, buf: &mut Buffer) {\n  926 |         // NOTE: the order in which these functions are called defines the overlapping behavior\n  927 |         self.render_left_titles(position, area, buf);\n  928 |         self.render_center_titles(position, area, buf);\n  929 |         self.render_right_titles(position, area, buf);\n  930 |     }\n  931 | \n  932 |     /// Render titles aligned to the right of the block\n  933 |     ///\n  934 |     /// Currently (due to the way lines are truncated), the right side of the leftmost title will\n  935 |     /// be cut off if the block is too small to fit all titles. This is not ideal and should be\n  936 |     /// the left side of that leftmost that is cut off. This is due to the line being truncated\n  937 |     /// incorrectly. See <https://github.com/ratatui/ratatui/issues/932>\n  938 |     #[expect(clippy::similar_names)]\n  939 |     fn render_right_titles(&self, position: TitlePosition, area: Rect, buf: &mut Buffer) {\n  940 |         let titles = self.filtered_titles(position, Alignment::Right);\n  941 |         let mut titles_area = self.titles_area(area, position);\n  942 | \n  943 |         // render titles in reverse order to align them to the right\n  944 |         for title in titles.rev() {\n  945 |             if titles_area.is_empty() {\n  946 |                 break;\n  947 |             }\n  948 |             let title_width = Self::line_width_u16(title);\n  949 |             let title_area = Rect {\n  950 |                 x: titles_area\n  951 |                     .right()\n  952 |                     .saturating_sub(title_width)\n  953 |                     .max(titles_area.left()),\n  954 |                 width: title_width.min(titles_area.width),\n  955 |                 ..titles_area\n  956 |             };\n  957 |             buf.set_style(title_area, self.titles_style);\n  958 |             title.render(title_area, buf);\n  959 | \n  960 |             // bump the width of the titles area to the left\n  961 |             titles_area.width = titles_area\n  962 |                 .width\n  963 |                 .saturating_sub(title_width)\n  964 |                 .saturating_sub(1); // space between titles\n  965 |         }\n  966 |     }\n  967 | \n  968 |     /// Render titles in the center of the block\n  969 |     fn render_center_titles(&self, position: TitlePosition, area: Rect, buf: &mut Buffer) {\n  970 |         let area = self.titles_area(area, position);\n  971 |         let titles = self\n  972 |             .filtered_titles(position, Alignment::Center)\n  973 |             .collect_vec();\n  974 |         // titles are rendered with a space after each title except the last one\n  975 |         let total_width = titles\n  976 |             .iter()\n  977 |             .map(|title| Self::line_width_u16(title).saturating_add(1))\n  978 |             .fold(0, u16::saturating_add)\n  979 |             .saturating_sub(1);\n  980 | \n  981 |         if total_width <= area.width {\n  982 |             self.render_centered_titles_without_truncation(titles, total_width, area, buf);\n  983 |         } else {\n  984 |             self.render_centered_titles_with_truncation(titles, total_width, area, buf);\n  985 |         }\n  986 |     }\n  987 | \n  988 |     fn render_centered_titles_without_truncation(\n  989 |         &self,\n  990 |         titles: Vec<&Line<'_>>,\n  991 |         total_width: u16,\n  992 |         area: Rect,\n  993 |         buf: &mut Buffer,\n  994 |     ) {\n  995 |         // titles fit in the area, center them\n  996 |         let x = area\n  997 |             .left()\n  998 |             .saturating_add(area.width.saturating_sub(total_width) / 2);\n  999 |         let mut area = Rect { x, ..area };\n 1000 |         for title in titles {\n 1001 |             let width = Self::line_width_u16(title);\n 1002 |             let title_area = Rect { width, ..area };\n 1003 |             buf.set_style(title_area, self.titles_style);\n 1004 |             title.render(title_area, buf);\n 1005 |             // Move the rendering cursor to the right, leaving 1 column space.\n 1006 |             let advance = width.saturating_add(1);\n 1007 |             area.x = area.x.saturating_add(advance);\n 1008 |             area.width = area.width.saturating_sub(advance);\n 1009 |         }\n 1010 |     }\n 1011 | \n 1012 |     fn render_centered_titles_with_truncation(\n 1013 |         &self,\n 1014 |         titles: Vec<&Line<'_>>,\n 1015 |         total_width: u16,\n 1016 |         mut area: Rect,\n 1017 |         buf: &mut Buffer,\n 1018 |     ) {\n 1019 |         // titles do not fit in the area, truncate the left side using an offset. The right side\n 1020 |         // is truncated by the area width.\n 1021 |         let mut offset = total_width.saturating_sub(area.width) / 2;\n 1022 |         for title in titles {\n 1023 |             if area.is_empty() {\n 1024 |                 break;\n 1025 |             }\n 1026 |             let width = area\n 1027 |                 .width\n 1028 |                 .min(Self::line_width_u16(title))\n 1029 |                 .saturating_sub(offset);\n 1030 |             let title_area = Rect { width, ..area };\n 1031 |             buf.set_style(title_area, self.titles_style);\n 1032 |             if offset > 0 {\n 1033 |                 // truncate the left side of the title to fit the area\n 1034 |                 title.clone().right_aligned().render(title_area, buf);\n 1035 |                 offset = offset.saturating_sub(width).saturating_sub(1);\n 1036 |             } else {\n 1037 |                 // truncate the right side of the title to fit the area if needed\n 1038 |                 title.clone().left_aligned().render(title_area, buf);\n 1039 |             }\n 1040 |             // Leave 1 column of spacing between titles.\n 1041 |             let advance = width.saturating_add(1);\n 1042 |             area.x = area.x.saturating_add(advance);\n 1043 |             area.width = area.width.saturating_sub(advance);\n 1044 |         }\n 1045 |     }\n 1046 | \n 1047 |     /// Render titles aligned to the left of the block\n 1048 |     #[expect(clippy::similar_names)]\n 1049 |     fn render_left_titles(&self, position: TitlePosition, area: Rect, buf: &mut Buffer) {\n 1050 |         let titles = self.filtered_titles(position, Alignment::Left);\n 1051 |         let mut titles_area = self.titles_area(area, position);\n 1052 |         for title in titles {\n 1053 |             if titles_area.is_empty() {\n 1054 |                 break;\n 1055 |             }\n 1056 |             let title_width = Self::line_width_u16(title);\n 1057 |             let title_area = Rect {\n 1058 |                 width: title_width.min(titles_area.width),\n 1059 |                 ..titles_area\n 1060 |             };\n 1061 |             buf.set_style(title_area, self.titles_style);\n 1062 |             title.render(title_area, buf);\n 1063 | \n 1064 |             // bump the titles area to the right and reduce its width\n 1065 |             let advance = title_width.saturating_add(1);\n 1066 |             titles_area.x = titles_area.x.saturating_add(advance);\n 1067 |             titles_area.width = titles_area.width.saturating_sub(advance);\n 1068 |         }\n 1069 |     }","lines":150,"link":"https://github.com/ratatui/ratatui/blob/99168f8afa2d75f89beeee17f0d15835010177c4/ratatui-widgets/src/block.rs#L920-L1069"}]},
