<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"In the `VariableList` rendering path, `render_single_table_row` is unwrapped with an explicit\n`unwrap_or_else(|| panic!(\"Expected to render a table row\"))`, whereas the `UniformList` path just\ndrops `None` results via `filter_map`. `render_single_table_row` returns `None` whenever\n`this.engine.d2d_mapping().get_data_row(display_row)` yields a row that no longer exists or\n`this.engine.contents.get_row(data_row)` returns `None`.\n\nThis is reachable because content updates and the display-to-data mapping are updated on different\nschedules. When the CSV buffer is edited to have fewer rows, `parse_csv_from_active_editor` ->\n`from_buffer` synchronously swaps `view.engine.contents` (fewer rows) and then calls\n`apply_filter_sort`, which recomputes the mapping and resets `list_state` only in a *background*\ntask (`cx.background_spawn(...).await` in `apply_filter_sort`). Between the synchronous content swap\nand the async mapping/`list_state` reset, a render can occur where `list_state` still reports the\nold (larger) row count and the stale `d2d_mapping` maps a `DisplayRow` to a `DataRow` index that is\nnow out of bounds for the shrunken `contents.rows`. `get_row(data_row)` then returns `None` and the\nwhole editor panics. `VariableList` is the default (`RowRenderMechanism::default() == VariableList`).","fix":"Handle `None` gracefully in the `VariableList` closure the same way the `UniformList` path does,\ninstead of panicking. For example render an empty placeholder row when the mapping is stale:\n```rust\nSelf::render_single_table_row(this, cols, display_row, row_identifier_text_color, this.row_height, cx)\n    .unwrap_or_else(|| (0..cols).map(|_| div().into_any_element()).collect())\n```\nso a transient mismatch between `list_state`, `d2d_mapping`, and `contents` cannot crash the UI.","locations":[{"ref":"crates/tabular_data_preview/src/renderer/render_table.rs:63-77","code":"   63 |                             cx.processor(move |this, display_row: usize, _window, cx| {\n   64 |                                 this.performance_metrics.rendered_indices.push(display_row);\n   65 | \n   66 |                                 let display_row = DisplayRow(display_row);\n   67 |                                 Self::render_single_table_row(\n   68 |                                     this,\n   69 |                                     cols,\n   70 |                                     display_row,\n   71 |                                     row_identifier_text_color,\n   72 |                                     this.row_height,\n   73 |                                     cx,\n   74 |                                 )\n   75 |                                 .unwrap_or_else(|| panic!(\"Expected to render a table row\"))\n   76 |                             })\n   77 |                         })","lines":15,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/tabular_data_preview/src/renderer/render_table.rs#L63-L77"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"In `find_path_tool.rs` the pagination slice computes its end bound with an unchecked addition of a model-supplied value: `input.offset + RESULTS_PER_PAGE`. `offset` is a `usize` deserialized directly from the model's tool arguments (`#[serde(default)] pub offset: usize`), so the model can pass a value near `usize::MAX`. `input.offset + RESULTS_PER_PAGE` then overflows: in debug builds this panics on the add itself; in release builds it wraps to a small number, after which `&matches[start..end]` panics because `start` (clamped to `matches.len()`) is greater than the wrapped `end` (`slice index starts at N but ends at M`). Either way a single crafted `offset` crashes the tool call.","fix":"Use a saturating add so the end bound can never wrap below the start:\n\nBefore:\n```rust\nlet paginated_matches: &[PathBuf] = &matches[cmp::min(input.offset, matches.len())\n    ..cmp::min(input.offset + RESULTS_PER_PAGE, matches.len())];\n```\n\nAfter:\n```rust\nlet start = cmp::min(input.offset, matches.len());\nlet end = cmp::min(input.offset.saturating_add(RESULTS_PER_PAGE), matches.len());\nlet paginated_matches: &[PathBuf] = &matches[start..end];\n```","locations":[{"ref":"crates/agent/src/tools/find_path_tool.rs:143-144","code":"  143 |             let paginated_matches: &[PathBuf] = &matches[cmp::min(input.offset, matches.len())\n  144 |                 ..cmp::min(input.offset + RESULTS_PER_PAGE, matches.len())];","lines":2,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent/src/tools/find_path_tool.rs#L143-L144"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`aws_document_to_value` converts an AWS `Document::Number(AwsNumber::Float(value))` with `Number::from_f64(value).unwrap()` at `crates/bedrock/src/bedrock.rs:170`. `serde_json::Number::from_f64` returns `None` for `NaN` and `±Infinity`, so any AWS `Document` float that is `NaN`/`Inf` (these can appear in model-produced tool-use inputs or `additional_model_response_fields`) will panic the process rather than producing an error.","fix":"Handle the non-finite case instead of `unwrap()`, e.g.\n```rust\nAwsNumber::Float(value) => Number::from_f64(value)\n    .map(Value::Number)\n    .unwrap_or(Value::Null),\n```\n(or serialize non-finite values as a string), so a `NaN`/`Inf` document cannot panic.","locations":[{"ref":"crates/bedrock/src/bedrock.rs:141-158","code":"  141 | pub fn aws_document_to_value(document: &Document) -> Value {\n  142 |     match document {\n  143 |         Document::Null => Value::Null,\n  144 |         Document::Bool(value) => Value::Bool(*value),\n  145 |         Document::Number(value) => match *value {\n  146 |             AwsNumber::PosInt(value) => Value::Number(Number::from(value)),\n  147 |             AwsNumber::NegInt(value) => Value::Number(Number::from(value)),\n  148 |             AwsNumber::Float(value) => Value::Number(Number::from_f64(value).unwrap()),\n  149 |         },\n  150 |         Document::String(value) => Value::String(value.clone()),\n  151 |         Document::Array(array) => Value::Array(array.iter().map(aws_document_to_value).collect()),\n  152 |         Document::Object(map) => Value::Object(\n  153 |             map.iter()\n  154 |                 .map(|(key, value)| (key.clone(), aws_document_to_value(value)))\n  155 |                 .collect(),\n  156 |         ),\n  157 |     }\n  158 | }","lines":18,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/bedrock/src/bedrock.rs#L141-L158"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`EventCoalescer::log_event` computes `let within_timeout = log_time - period_end < COALESCE_TIMEOUT;`\nusing a plain `Instant - Instant` subtraction. `period_end` can be `state.start + SIMULATED_DURATION_FOR_SINGLE_EVENT`\n(i.e. `start + 1ms`) whenever `state.end` is `None`, which is the case immediately after a period\nstarts. If a second event arrives less than `1ms` after the period start, then `log_time < period_end`\nand `log_time - period_end` panics (`Instant` subtraction panics when the right-hand side is later\nthan the left-hand side). `log_event` is called on every edit via `Telemetry::log_edit_event` before\nthe throttle, so two edits within `1ms` (paste, multi-cursor, programmatic edits) can reach this path.","fix":"Use a saturating subtraction, which correctly treats a `log_time` earlier than `period_end` as\nwithin the timeout:\n```rust\nlet within_timeout = log_time.saturating_duration_since(period_end) < COALESCE_TIMEOUT;\n```","locations":[{"ref":"crates/client/src/telemetry/event_coalescer.rs:41-44","code":"   41 |         let period_end = state\n   42 |             .end\n   43 |             .unwrap_or(state.start + SIMULATED_DURATION_FOR_SINGLE_EVENT);\n   44 |         let within_timeout = log_time - period_end < COALESCE_TIMEOUT;","lines":4,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/client/src/telemetry/event_coalescer.rs#L41-L44"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"`parse_www_authenticate` slices the header with `header[..6]` after only checking `header.len() >= 6`. String range indexing panics if the byte offset is not a UTF-8 char boundary. A malicious or buggy MCP server can send a `WWW-Authenticate` response header whose first bytes place a multibyte character across byte index 6 (e.g. `aaaa€...`, where the 3-byte `€` occupies bytes 4-6), causing a panic. This input is untrusted: it comes straight from the server's `401` response in `send_message`, where the call is wrapped only in `.unwrap_or(...)` which catches `Err` but NOT a panic. The panic occurs inside the client's background output task, disrupting/aborting the connection.","fix":"Compare the prefix on bytes so a non-ASCII lead can never break the slice boundary. Before:\n```rust\nlet params_str = if header.len() >= 6 && header[..6].eq_ignore_ascii_case(\"bearer\") {\n    header[6..].trim()\n```\nAfter:\n```rust\nlet params_str = if header.as_bytes().get(..6).is_some_and(|p| p.eq_ignore_ascii_case(b\"bearer\")) {\n    header[6..].trim()\n```\nOnce the first 6 bytes are confirmed to be ASCII `bearer`, byte index 6 is guaranteed to be a char boundary, so `header[6..]` is safe.","locations":[{"ref":"crates/context_server/src/oauth.rs:278","code":"  278 |     let params_str = if header.len() >= 6 && header[..6].eq_ignore_ascii_case(\"bearer\") {","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/context_server/src/oauth.rs#L278"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"`dap_types::ScopePresentationHint::to_proto` maps the five known variants and then falls through to\n`_ => unreachable!()`. Elsewhere in this same file the pattern for these non-exhaustive `dap_types`\nenums is to handle the catch-all gracefully (e.g. `OutputEventCategory::to_proto` uses\n`_ => Self::ProtoType::Unknown`, and `EvaluateArgumentsContext::to_proto` uses\n`_ => Self::ProtoType::EvaluateUnknown`). The presence of an explicit `Self::Unknown` arm *plus* a\n`_` arm indicates the source enum carries variants beyond the mapped set, so a presentation hint\nreturned by a debug adapter that is not one of the five mapped variants will hit `unreachable!()` and\npanic when the host serializes scope data for collab guests.","fix":"Mirror the graceful handling used by the other conversions in this file:\n```rust\n_ => Self::ProtoType::ScopeUnknown,\n```\ninstead of `_ => unreachable!()`.","locations":[{"ref":"crates/dap/src/proto_conversions.rs:113-122","code":"  113 |     fn to_proto(self) -> Self::ProtoType {\n  114 |         match self {\n  115 |             Self::Locals => Self::ProtoType::Locals,\n  116 |             Self::Arguments => Self::ProtoType::Arguments,\n  117 |             Self::Registers => Self::ProtoType::Registers,\n  118 |             Self::ReturnValue => Self::ProtoType::ReturnValue,\n  119 |             Self::Unknown => Self::ProtoType::ScopeUnknown,\n  120 |             _ => unreachable!(),\n  121 |         }\n  122 |     }","lines":10,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/dap/src/proto_conversions.rs#L113-L122"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"`dap_types::ChecksumAlgorithm::from_proto` matches `Self::ProtoType::ChecksumAlgorithmUnspecified =>\nunreachable!()`. `ChecksumAlgorithmUnspecified` is the protobuf default (tag 0), and\n`payload.algorithm()` (used at the call site) returns exactly this variant when the field is unset or\nholds an unknown value. A collaborating peer that sends a `DapChecksum` with an unset/invalid\n`algorithm` therefore triggers `unreachable!()` and panics the process. Remote-peer-controlled proto\ninput must not be able to panic the host.","fix":"Replace the panicking arm with a real error path. Since `from_proto` here returns `Self`, either\nchange the signature to return `Result<Self>` and `bail!` on `ChecksumAlgorithmUnspecified`, or map\nit to a sensible default:\n```rust\nSelf::ProtoType::ChecksumAlgorithmUnspecified => Self::Md5,\n```\nis not correct semantically; prefer returning an error so an unspecified algorithm is rejected rather\nthan silently mislabeled.","locations":[{"ref":"crates/dap/src/proto_conversions.rs:190-198","code":"  190 |     fn from_proto(payload: Self::ProtoType) -> Self {\n  191 |         match payload {\n  192 |             Self::ProtoType::Md5 => Self::Md5,\n  193 |             Self::ProtoType::Sha1 => Self::Sha1,\n  194 |             Self::ProtoType::Sha256 => Self::Sha256,\n  195 |             Self::ProtoType::Timestamp => Self::Timestamp,\n  196 |             Self::ProtoType::ChecksumAlgorithmUnspecified => unreachable!(),\n  197 |         }\n  198 |     }","lines":9,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/dap/src/proto_conversions.rs#L190-L198"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`receive_server_message` reads a `Content-Length` header supplied by the debug adapter and then does\n`let mut content = vec![0; content_length];` with no upper bound. `content_length` is parsed straight\nfrom the untrusted adapter stream (`value.parse()`). A malformed or malicious adapter can send a\nheader such as `Content-Length: 999999999999`, causing an enormous allocation that aborts the process\n(OOM) or panics on allocation failure. This is a DAP framing hardening issue explicitly in scope.","fix":"Validate `content_length` against a sane maximum before allocating, returning a\n`ConnectionResult::Result(Err(...))` when it is exceeded, e.g.:\n```rust\nconst MAX_MESSAGE_LEN: usize = 64 * 1024 * 1024;\nif content_length > MAX_MESSAGE_LEN {\n    return ConnectionResult::Result(Err(anyhow!(\"content length {content_length} exceeds maximum\")));\n}\n```\nOptionally grow the buffer incrementally instead of a single up-front `vec![0; content_length]`.","locations":[{"ref":"crates/dap/src/transport.rs:412-432","code":"  412 |             if let Some((\"Content-Length\", value)) = buffer.trim().split_once(\": \") {\n  413 |                 match value.parse().context(\"invalid content length\") {\n  414 |                     Ok(length) => content_length = Some(length),\n  415 |                     Err(e) => return ConnectionResult::Result(Err(e)),\n  416 |                 }\n  417 |             }\n  418 |         }\n  419 | \n  420 |         let content_length = match content_length.context(\"missing content length\") {\n  421 |             Ok(length) => length,\n  422 |             Err(e) => return ConnectionResult::Result(Err(e)),\n  423 |         };\n  424 | \n  425 |         let mut content = vec![0; content_length];\n  426 |         if let Err(e) = reader\n  427 |             .read_exact(&mut content)\n  428 |             .await\n  429 |             .with_context(|| \"reading after a loop\")\n  430 |         {\n  431 |             return ConnectionResult::Result(Err(e));\n  432 |         }","lines":21,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/dap/src/transport.rs#L412-L432"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`handle_restart_request` calls `curr_session.read(cx).binary().cloned().unwrap()` on the session's binary. If the (root) session has no binary set (e.g. it never finished booting), this panics. The sibling method `handle_start_debugging_request` handles the same `Option` gracefully with `let Some(mut binary) = ... else { log::error!(...); return; }`, so this `unwrap` is an inconsistent, reachable panic.","fix":"Mirror the guard used in `handle_start_debugging_request`:\n```\nlet Some(binary) = curr_session.read(cx).binary().cloned() else {\n    log::error!(\"Attempted to restart a session without a binary\");\n    return;\n};\n```","locations":[{"ref":"crates/debugger_ui/src/debugger_panel.rs:393","code":"  393 |         let binary = curr_session.read(cx).binary().cloned().unwrap();","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/debugger_ui/src/debugger_panel.rs#L393"}]},
{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"In `handle_run_in_terminal`, the fallback working directory is computed with `session.binary().unwrap().cwd.clone()`. `Session::binary()` returns `Option<&DebugAdapterBinary>` (see `crates/project/src/debugger/session.rs:1066`), so the `unwrap()` panics whenever the adapter issues a `runInTerminal` reverse request while `request.cwd` is empty and the session has no resolved binary yet (e.g. the binary is still being established / booting). This is driven by adapter-controlled input, so it is reachable.","fix":"Avoid the `unwrap()` and propagate the `None` instead:\n```rust\nlet cwd = (!request.cwd.is_empty())\n    .then(|| PathBuf::from(&request.cwd))\n    .or_else(|| session.binary().and_then(|binary| binary.cwd.clone()));\n```","locations":[{"ref":"crates/debugger_ui/src/session/running.rs:1298","code":" 1298 |         let cwd = (!request.cwd.is_empty())","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/debugger_ui/src/session/running.rs#L1298"}]},
{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"In debug builds, `TokenUsage::ratio` reads `ZED_THREAD_WARNING_THRESHOLD` and\ndoes `.parse().unwrap()`, which panics if the env var is set to a value that is\nnot a valid `f32`. Additionally `.unwrap_or(TOKEN_USAGE_WARNING_THRESHOLD.to_string())`\neagerly allocates the fallback `String` on every call even when the env var is\npresent.","fix":"Avoid the panic and the eager allocation. Before:\n```\nlet warning_threshold: f32 = std::env::var(\"ZED_THREAD_WARNING_THRESHOLD\")\n    .unwrap_or(TOKEN_USAGE_WARNING_THRESHOLD.to_string())\n    .parse()\n    .unwrap();\n```\nAfter:\n```\nlet warning_threshold: f32 = std::env::var(\"ZED_THREAD_WARNING_THRESHOLD\")\n    .ok()\n    .and_then(|value| value.parse().ok())\n    .unwrap_or(TOKEN_USAGE_WARNING_THRESHOLD);\n```","locations":[{"ref":"crates/acp_thread/src/acp_thread.rs:2034-2038","code":" 2034 |         #[cfg(debug_assertions)]\n 2035 |         let warning_threshold: f32 = std::env::var(\"ZED_THREAD_WARNING_THRESHOLD\")\n 2036 |             .unwrap_or(TOKEN_USAGE_WARNING_THRESHOLD.to_string())\n 2037 |             .parse()\n 2038 |             .unwrap();","lines":5,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/acp_thread/src/acp_thread.rs#L2034-L2038"}]},
{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"The git-job check computes elapsed time with `Instant::now() - job_info.start`, whereas the fs-job check just below uses the safe `Instant::now().duration_since(fs_job.start)`. `Instant - Instant` panics if the right-hand instant is later than the left-hand one (e.g. clock/monotonic edge cases). The two nearly identical checks should use the same non-panicking form for consistency and safety.","fix":"Use `duration_since` (or `saturating_duration_since`) in the git-job branch as well:\n```rust\nif let Some(job_info) = current_job\n    && Instant::now().duration_since(job_info.start) >= GIT_OPERATION_DELAY\n```","locations":[{"ref":"crates/activity_indicator/src/activity_indicator.rs:464-466","code":"  464 |         if let Some(job_info) = current_job\n  465 |             && Instant::now() - job_info.start >= GIT_OPERATION_DELAY\n  466 |         {","lines":3,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/activity_indicator/src/activity_indicator.rs#L464-L466"},{"ref":"crates/activity_indicator/src/activity_indicator.rs:476-477","code":"  476 |         for fs_job in &self.fs_jobs {\n  477 |             if Instant::now().duration_since(fs_job.start) >= GIT_OPERATION_DELAY {","lines":2,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/activity_indicator/src/activity_indicator.rs#L476-L477"}]},
{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`context_server_input` calls `serde_json::to_string(&cmd.path).unwrap()` (and `.unwrap()` on\n`cmd.args` / `cmd.env`) while building the editor text. `ContextServerCommand::path` is a\n`PathBuf` (see `settings_content/src/project.rs`), and `serde_json` serialization of a\n`PathBuf` fails for a path that is not valid UTF-8, which would panic the whole configure-modal\nflow. In practice these commands originate from JSON settings (so paths are usually UTF-8), but\nserializing back with `.unwrap()` is still an avoidable panic on fallible I/O-derived data.","fix":"Avoid `.unwrap()` on serialization. Either use `serde_json::to_string(...).unwrap_or_default()`\n/ `.unwrap_or_else(|_| \"\\\"\\\"\".into())` for the individual fields, or serialize the whole\n`ContextServerCommand` object once with `.log_err()` and fall back to a placeholder template\nwhen it fails, rather than panicking.","locations":[{"ref":"crates/agent_ui/src/agent_configuration/configure_context_server_modal.rs:223-253","code":"  223 | fn context_server_input(existing: Option<(ContextServerId, ContextServerCommand)>) -> String {\n  224 |     let (name, command, args, env) = match existing {\n  225 |         Some((id, cmd)) => {\n  226 |             let args = serde_json::to_string(&cmd.args).unwrap();\n  227 |             let env = serde_json::to_string(&cmd.env.unwrap_or_default()).unwrap();\n  228 |             let cmd_path = serde_json::to_string(&cmd.path).unwrap();\n  229 |             (id.0.to_string(), cmd_path, args, env)\n  230 |         }\n  231 |         None => (\n  232 |             \"some-mcp-server\".to_string(),\n  233 |             \"\".to_string(),\n  234 |             \"[]\".to_string(),\n  235 |             \"{}\".to_string(),\n  236 |         ),\n  237 |     };\n  238 | \n  239 |     format!(\n  240 |         r#\"{{\n  241 |   /// Configure an MCP server that runs locally via stdin/stdout\n  242 |   ///\n  243 |   /// The name of your MCP server\n  244 |   \"{name}\": {{\n  245 |     /// The command which runs the MCP server\n  246 |     \"command\": {command},\n  247 |     /// The arguments to pass to the MCP server\n  248 |     \"args\": {args},\n  249 |     /// The environment variables to set\n  250 |     \"env\": {env}\n  251 |   }}\n  252 | }}\"#\n  253 |     )","lines":31,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/agent_configuration/configure_context_server_modal.rs#L223-L253"}]},
{"id":"PANIC_14","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`AgentDiffPane::new` calls `workspace.upgrade().expect(\"workspace must exist\")` on a `WeakEntity<Workspace>`. If the workspace has been dropped, this panics instead of failing gracefully. `new` is reachable from `clone_on_split` (line 609-611) which passes `self.workspace.clone()`; if the workspace were gone this would crash the app rather than degrade.\n```rust\nlet workspace_entity = workspace.upgrade().expect(\"workspace must exist\");\n```","fix":"Return early / propagate instead of panicking. Since `new` currently returns `Self`, consider having callers guard against a dead workspace, or change the signature to return `Option`/`Result`. At minimum, avoid `expect`:\n```rust\nlet Some(workspace_entity) = workspace.upgrade() else {\n    // handle gracefully, e.g. build an empty pane state\n};\n```","locations":[{"ref":"crates/agent_ui/src/agent_diff.rs:93-94","code":"   93 |         let editor = cx.new(|cx| {\n   94 |             let workspace_entity = workspace.upgrade().expect(\"workspace must exist\");","lines":2,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/agent_diff.rs#L93-L94"}]},
{"id":"PANIC_15","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`CodegenAlternative::new` does `snapshot.range_to_buffer_ranges(range.start..range.end).pop().unwrap()`\nand then `buffer.read(cx).buffer(old_buffer.remote_id()).unwrap()`. Both `unwrap()`s\npanic if the range does not resolve to any underlying buffer range (for example an empty\nor otherwise invalid range in the multibuffer) or if the buffer for that remote id is\nabsent. Since this runs while setting up the inline assistant on user-provided\nselections, a malformed/degenerate range would crash rather than fail gracefully.","fix":"Handle the empty/absent cases instead of `unwrap()`ing. E.g. change `new` to return a\n`Result`/`Option` and use `let Some((old_buffer, _, _)) = ....pop() else { ... }` and\n`buffer.read(cx).buffer(old_buffer.remote_id()).map(...)`, propagating the failure to the\ncaller (which already builds `CodegenAlternative` inside a fallible flow) rather than\npanicking.","locations":[{"ref":"crates/agent_ui/src/buffer_codegen.rs:307-320","code":"  307 |         let (old_buffer, _, _) = snapshot\n  308 |             .range_to_buffer_ranges(range.start..range.end)\n  309 |             .pop()\n  310 |             .unwrap();\n  311 |         let old_buffer = cx.new(|cx| {\n  312 |             let text = old_buffer.as_rope().clone();\n  313 |             let line_ending = old_buffer.line_ending();\n  314 |             let language = old_buffer.language().cloned();\n  315 |             let language_registry = buffer\n  316 |                 .read(cx)\n  317 |                 .buffer(old_buffer.remote_id())\n  318 |                 .unwrap()\n  319 |                 .read(cx)\n  320 |                 .language_registry();","lines":14,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/buffer_codegen.rs#L307-L320"}]},
{"id":"PANIC_16","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`spawn_external_agent_login` unwraps the login command with `expect`:\n```rust\ntask.shell = task::Shell::WithArguments {\n    program: task.command.take().expect(\"login command should be set\"),\n    ...\n};\n```\n`task.command` is an `Option` (it is matched with `if let Some(cmd) = &task.command` a few lines above at line 2108), so if a `terminal_auth_task` ever yields a `SpawnInTerminal` without a command set, this panics the app instead of surfacing an error. The project guidelines explicitly discourage `expect`/`unwrap` on fallible values; this should propagate an error via the returned `Task<Result<()>>`.","fix":"Return an error instead of panicking when the login command is missing:\n```rust\nlet Some(program) = task.command.take() else {\n    return Err(anyhow!(\"login command should be set\"));\n};\ntask.shell = task::Shell::WithArguments {\n    program,\n    args: std::mem::take(&mut task.args),\n    title_override: None,\n};\n```","locations":[{"ref":"crates/agent_ui/src/conversation_view.rs:2136-2160","code":" 2136 |             let mut task = login.clone();\n 2137 |             if let Some(cmd) = &task.command {\n 2138 |                 // Have \"node\" command use Zed's managed Node runtime by default\n 2139 |                 if cmd == \"node\" {\n 2140 |                     let resolved_node_runtime = project.update(cx, |project, cx| {\n 2141 |                         let agent_server_store = project.agent_server_store().clone();\n 2142 |                         agent_server_store.update(cx, |store, cx| {\n 2143 |                             store.node_runtime().map(|node_runtime| {\n 2144 |                                 cx.background_spawn(async move { node_runtime.binary_path().await })\n 2145 |                             })\n 2146 |                         })\n 2147 |                     });\n 2148 | \n 2149 |                     if let Some(resolve_task) = resolved_node_runtime {\n 2150 |                         if let Ok(node_path) = resolve_task.await {\n 2151 |                             task.command = Some(node_path.to_string_lossy().to_string());\n 2152 |                         }\n 2153 |                     }\n 2154 |                 }\n 2155 |             }\n 2156 |             task.shell = task::Shell::WithArguments {\n 2157 |                 program: task.command.take().expect(\"login command should be set\"),\n 2158 |                 args: std::mem::take(&mut task.args),\n 2159 |                 title_override: None,\n 2160 |             };","lines":25,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/conversation_view.rs#L2136-L2160"}]},
{"id":"PANIC_17","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In `render_permission_buttons_flat`, `seen_kinds.push(option.kind).unwrap()` pushes onto a fixed-capacity `ArrayVec<acp::PermissionOptionKind, 3, u8>`. This is currently safe only because of a non-obvious invariant: the `.contains(&option.kind)` guard dedups by kind, and of the four `PermissionOptionKind` variants only three (`AllowOnce`, `AllowAlways`, `RejectOnce`) reach the push (`RejectAlways`, retry, and `AllowThread` produce `action = None` and return early). If a future refactor adds a fourth pushable kind, or removes one of the early-return guards, this `unwrap()` panics on the render path. Using `unwrap()` on a fallible push in `render` contravenes the repo guideline to avoid panicking calls.","fix":"Make the push non-panicking, e.g. `if seen_kinds.push(option.kind).is_err() { return this; }`, or bump the `ArrayVec` capacity to cover all `PermissionOptionKind` variants (4) so the invariant is enforced by the type rather than by reasoning about the surrounding early-returns.","locations":[{"ref":"crates/agent_ui/src/conversation_view/thread_view.rs:9832","code":" 9832 |         let mut seen_kinds: ArrayVec<acp::PermissionOptionKind, 3, u8> = ArrayVec::new();","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/conversation_view/thread_view.rs#L9832"},{"ref":"crates/agent_ui/src/conversation_view/thread_view.rs:9908-9912","code":" 9908 |                         if !is_first || disabled || seen_kinds.contains(&option.kind) {\n 9909 |                             return this;\n 9910 |                         }\n 9911 | \n 9912 |                         seen_kinds.push(option.kind).unwrap();","lines":5,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/conversation_view/thread_view.rs#L9908-L9912"}]},
{"id":"PANIC_18","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`confirm_mention_for_thread` downcasts the resolved agent connection with `.unwrap()`:\n```rust\nlet agent = agent.downcast::<agent::NativeAgentConnection>().unwrap();\n```\nIf the connection returned by `server.connect(...)` is ever not a `NativeAgentConnection`, this panics instead of surfacing an error. Every other fallible step in this function propagates via `?`, so the `unwrap` is the only hard crash point. It is currently guarded only by the invariant that `thread_store` is `Some`, which is fragile.","fix":"Replace the `unwrap` with error propagation, e.g. `let agent = agent.downcast::<agent::NativeAgentConnection>().map_err(|_| anyhow!(\"expected native agent connection\"))?;` (or `.context(...)?` depending on the returned type) so a mismatched connection type becomes a recoverable error.","locations":[{"ref":"crates/agent_ui/src/mention_set.rs:631","code":"  631 |             let agent = agent.downcast::<agent::NativeAgentConnection>().unwrap();","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/mention_set.rs#L631"}]},
{"id":"PANIC_19","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"Several sites in `MessageEditor` assume the editor buffer is a singleton and call `.unwrap()` on `as_singleton()` / `anchor_to_buffer_anchor()`, while other sites that do the exact same thing handle failure gracefully with `?`. The unwrapping sites will panic if the buffer is ever not a singleton, whereas the graceful sites (`insert_mention_for_project_path` at line 282, `insert_skill_crease` at line 1548) just bail out. This inconsistency means some code paths crash where equivalent ones recover:\n```rust\nlet buffer_snapshot = snapshot.as_singleton().unwrap();          // paste_item\nlet buffer_snapshot = snapshot.as_singleton().unwrap();          // insert_branch_diff_crease\nsnapshot.anchor_to_buffer_anchor(anchor).unwrap().0              // paste_item mention links\nsnapshot.anchor_to_buffer_anchor(anchor).unwrap().0              // insert_message_blocks\n```","fix":"Make these consistent with the graceful sites: use `let Some(buffer_snapshot) = snapshot.as_singleton() else { continue; };` (or `return`) and `let Some((anchor, _)) = snapshot.anchor_to_buffer_anchor(anchor) else { continue; };` instead of `.unwrap()`, so a non-singleton buffer degrades instead of panicking.","locations":[{"ref":"crates/agent_ui/src/message_editor.rs:1133","code":" 1133 |                         let buffer_snapshot = snapshot.as_singleton().unwrap();","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/message_editor.rs#L1133"},{"ref":"crates/agent_ui/src/message_editor.rs:1260","code":" 1260 |                             snapshot.anchor_to_buffer_anchor(anchor).unwrap().0,","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/message_editor.rs#L1260"},{"ref":"crates/agent_ui/src/message_editor.rs:1473","code":" 1473 |                         let buffer_snapshot = snapshot.as_singleton().unwrap();","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/message_editor.rs#L1473"},{"ref":"crates/agent_ui/src/message_editor.rs:1835","code":" 1835 |                 snapshot.anchor_to_buffer_anchor(anchor).unwrap().0,","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/message_editor.rs#L1835"}]},
{"id":"PANIC_20","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`EchoCanceller::process_reverse_stream` calls `.expect(\"Audio input and output threads should not panic\")` on the result of the WebRTC APM. This method is invoked from the realtime output callback registered in `open_output_stream` (`crates/audio/src/audio_pipeline.rs:191-196`), so any error returned by the APM (e.g. an unexpected sample-rate/channel/buffer-size mismatch) will panic the audio rendering thread rather than being handled. Note the sibling `process_stream` deliberately returns a `Result` instead of panicking, so the asymmetry is likely unintentional.","fix":"Return/propagate or log the error instead of panicking on the audio thread. For example have `process_reverse_stream` return `anyhow::Result<()>` like `process_stream`, or log-and-ignore the error (`.context(\"livekit reverse stream error\").log_err();`) so a transient APM error cannot crash audio output.","locations":[{"ref":"crates/audio/src/audio_pipeline/echo_canceller.rs:25-30","code":"   25 |         pub fn process_reverse_stream(&mut self, buf: &mut [i16]) {\n   26 |             self.0\n   27 |                 .lock()\n   28 |                 .process_reverse_stream(buf, SAMPLE_RATE.get() as i32, CHANNEL_COUNT.get().into())\n   29 |                 .expect(\"Audio input and output threads should not panic\");\n   30 |         }","lines":6,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/audio/src/audio_pipeline/echo_canceller.rs#L25-L30"}]},
{"id":"PANIC_21","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`AutoUpdateSetting::from_settings` does `Self(content.auto_update.unwrap())` at `crates/auto_update/src/auto_update.rs:252`. `content.auto_update` is an `Option<bool>`; the code relies entirely on the default settings populating it (they do). If the merged settings content ever lacks this field, the app panics at startup. This is the standard Zed defaulted-settings pattern, so severity is low, but the unwrap is nonetheless a latent panic and violates the repository guideline against `unwrap()`.","fix":"Fall back to the documented default instead of panicking: `Self(content.auto_update.unwrap_or(true))`.","locations":[{"ref":"crates/auto_update/src/auto_update.rs:251-255","code":"  251 | impl Settings for AutoUpdateSetting {\n  252 |     fn from_settings(content: &settings::SettingsContent) -> Self {\n  253 |         Self(content.auto_update.unwrap())\n  254 |     }\n  255 | }","lines":5,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/auto_update/src/auto_update.rs#L251-L255"}]},
{"id":"PANIC_22","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In `AwsHttpConnector::call`, the upstream response status is converted with `StatusCode::try_from(parts.status.as_u16()).unwrap()` at `crates/aws_http_client/src/aws_http_client.rs:50`. `http::StatusCode` permits codes up to 999, while `aws_smithy_types::StatusCode::try_from` rejects out-of-range values; a server (or proxy) returning a nonstandard status code above the accepted range would panic the connector task instead of surfacing a `ConnectorError`.","fix":"Replace the `unwrap()` with error propagation, mirroring the other fallible conversions in this function:\n```rust\nlet status = match StatusCode::try_from(parts.status.as_u16()) {\n    Ok(status) => status,\n    Err(err) => return Err(ConnectorError::other(err.into(), None)),\n};\nlet mut response = HttpResponse::new(status, convert_to_sdk_body(body));\n```","locations":[{"ref":"crates/aws_http_client/src/aws_http_client.rs:42-62","code":"   42 |         HttpConnectorFuture::new(async move {\n   43 |             let response = match response.await {\n   44 |                 Ok(response) => response,\n   45 |                 Err(err) => return Err(ConnectorError::other(err.into(), None)),\n   46 |             };\n   47 |             let (parts, body) = response.into_parts();\n   48 | \n   49 |             let mut response = HttpResponse::new(\n   50 |                 StatusCode::try_from(parts.status.as_u16()).unwrap(),\n   51 |                 convert_to_sdk_body(body),\n   52 |             );\n   53 | \n   54 |             let headers = match Headers::try_from(parts.headers) {\n   55 |                 Ok(headers) => headers,\n   56 |                 Err(err) => return Err(ConnectorError::other(err.into(), None)),\n   57 |             };\n   58 | \n   59 |             *response.headers_mut() = headers;\n   60 | \n   61 |             Ok(response)\n   62 |         })","lines":21,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/aws_http_client/src/aws_http_client.rs#L42-L62"}]},
{"id":"PANIC_23","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`CommandPaletteDelegate::confirm` indexes `self.matches[self.selected_ix]` directly, whereas the sibling method `selected_command` deliberately uses `self.matches.get(self.selected_ix)` (its comment even notes headless tests where indices may not line up). `set_selected_index` stores `ix` without any bounds check, so the only thing preventing an out-of-bounds panic here is the picker always clamping the index. This is a latent panic and is inconsistent with the defensive access used elsewhere in the same delegate.","fix":"Use a checked access consistent with `selected_command`.\n\nBefore:\n```rust\nlet action_ix = self.matches[self.selected_ix].candidate_id;\nlet command = self.commands.swap_remove(action_ix);\n```\n\nAfter:\n```rust\nlet Some(action_ix) = self.matches.get(self.selected_ix).map(|m| m.candidate_id) else {\n    return;\n};\nlet command = self.commands.swap_remove(action_ix);\n```","locations":[{"ref":"crates/command_palette/src/command_palette.rs:628","code":"  628 |         let action_ix = self.matches[self.selected_ix].candidate_id;","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/command_palette/src/command_palette.rs#L628"}]},
{"id":"PANIC_24","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`CrashServer::on_minidump_created` uses several `unwrap()` calls on fallible filesystem/serialization operations while producing the crash report: `File::open(&path).unwrap()`, `File::create(&compressed_path).unwrap()`, `fs::rename(&compressed_path, path).unwrap()`, and `serde_json::to_vec(&crash_info).unwrap()`. These run inside the crash-handler server process during crash reporting; if any of them fails (permissions, disk full, transient IO error) the crash server itself panics, so no crash report (`.json`) is written at all. This is exactly the path where robustness matters most, and the surrounding code already prefers `.ok()` for other fallible steps (e.g. `file.flush().ok()`, `zstd::stream::copy_encode(...).ok()`, `fs::write(...).ok()`).","fix":"Replace the `unwrap()`s with graceful handling so a failure in the zstd compression/rename step still lets the report proceed (or is logged), and so serialization/write failures degrade to a logged warning instead of a panic. For example, use `let Ok(original_file) = File::open(&path) else { ... }` style guards or `.log_err()`/`.ok()` consistently, and handle `serde_json::to_vec(&crash_info)` with a `match`/`log::warn!` rather than `unwrap()`.","locations":[{"ref":"crates/crashes/src/crashes.rs:447","code":"  447 |                 let original_file = File::open(&path).unwrap();","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/crashes/src/crashes.rs#L447"},{"ref":"crates/crashes/src/crashes.rs:449","code":"  449 |                 let compressed_file = File::create(&compressed_path).unwrap();","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/crashes/src/crashes.rs#L449"},{"ref":"crates/crashes/src/crashes.rs:451","code":"  451 |                 fs::rename(&compressed_path, path).unwrap();","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/crashes/src/crashes.rs#L451"},{"ref":"crates/crashes/src/crashes.rs:496","code":"  496 |         fs::write(crash_data_path, serde_json::to_vec(&crash_info).unwrap()).ok();","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/crashes/src/crashes.rs#L496"}]},
{"id":"PANIC_25","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In `TcpTransport::connect`, the retry loop inspects the child process across three separate lock\nacquisitions on the shared `Arc<Mutex<Option<Child>>>`: `process.lock().is_some()`, then\n`process.lock().as_mut().unwrap()`, then `process.lock().take().unwrap()`. `TcpTransport::drop` (and\n`kill`) also acquire this lock and can `take()` the process. If the transport is dropped concurrently\nwith the connect task, the process can become `None` between the `is_some()` check and the following\n`.unwrap()` calls, panicking. The check-then-unwrap is a TOCTOU on shared mutable state.","fix":"Acquire the lock once and operate on the guard without re-locking, and avoid `unwrap()`:\n```rust\nlet mut guard = process.lock();\nif let Some(child) = guard.as_mut() {\n    if let Ok(Some(_)) = child.try_status() {\n        let child = guard.take().expect(\"just checked\");\n        drop(guard);\n        let output = child.output().await?;\n        ...\n    }\n}\n```\nso the presence check and the take happen under a single lock and stale `None` cannot cause a panic.","locations":[{"ref":"crates/dap/src/transport.rs:614-629","code":"  614 |                             },\n  615 |                             Err(_) => {\n  616 |                                 let has_process = process.lock().is_some();\n  617 |                                 if has_process {\n  618 |                                     let status = process.lock().as_mut().unwrap().try_status();\n  619 |                                     if let Ok(Some(_)) = status {\n  620 |                                         let child = process.lock().take().unwrap();\n  621 |                                         let output = child.output().await?;\n  622 |                                         let output = if output.stderr.is_empty() {\n  623 |                                             String::from_utf8_lossy(&output.stdout).to_string()\n  624 |                                         } else {\n  625 |                                             String::from_utf8_lossy(&output.stderr).to_string()\n  626 |                                         };\n  627 |                                         anyhow::bail!(\"{output}\\nerror: process exited before debugger attached.\");\n  628 |                                     }\n  629 |                                 }","lines":16,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/dap/src/transport.rs#L614-L629"}]},
{"id":"PANIC_26","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`topological_sort` marks a node as `visited` only after recursing into its dependencies, and there is no separate \"currently visiting\" set to detect cycles. If two domain migrations declare a cyclic dependency (`A` depends on `B`, `B` depends on `A`), `visit` recurses `A -> B -> A -> B ...` without ever finding the node in `visited`, causing unbounded recursion and a stack-overflow abort at startup. Dependencies are registered at link time so this is a programming error, but it fails with an opaque crash rather than a clear diagnostic.","fix":"Track an in-progress set (nodes on the current DFS stack) in addition to `visited`. When `visit` encounters a name already in the in-progress set, return an error (or log and skip) indicating a dependency cycle instead of recursing again.","locations":[{"ref":"crates/db/src/db.rs:97","code":"   97 |     fn visit<'a>(","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/db/src/db.rs#L97"}]},
{"id":"PANIC_27","type":"panic","type_label":"Panic","severity":"negligible","difficulty":"easy","description":"`CallSettings::from_settings` unwraps `content.calls` and both of its fields (`content.calls.clone().unwrap()`, `.mute_on_join.unwrap()`, `.share_on_join.unwrap()`). If the merged settings content ever lacks the `calls` object or either field, this panics at startup. In practice `assets/settings/default.json` always defines `calls.mute_on_join` and `calls.share_on_join`, so the unwraps are currently safe and match the established settings idiom; flagged only as a latent panic that depends on the default-settings file staying in sync.","fix":"Fall back to defaults instead of unwrapping, e.g. `let call = content.calls.clone().unwrap_or_default();` and `call.mute_on_join.unwrap_or(false)` / `call.share_on_join.unwrap_or(false)`, so a missing settings key degrades gracefully rather than panicking.","locations":[{"ref":"crates/call/src/call_settings.rs:9-17","code":"    9 | impl Settings for CallSettings {\n   10 |     fn from_settings(content: &settings::SettingsContent) -> Self {\n   11 |         let call = content.calls.clone().unwrap();\n   12 |         CallSettings {\n   13 |             mute_on_join: call.mute_on_join.unwrap(),\n   14 |             share_on_join: call.share_on_join.unwrap(),\n   15 |         }\n   16 |     }\n   17 | }","lines":9,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/call/src/call_settings.rs#L9-L17"}]},
{"id":"PANIC_28","type":"panic","type_label":"Panic","severity":"negligible","difficulty":"easy","description":"`ConnectionPool::remove_connection` uses `unwrap()` on\n`self.connected_users.get_mut(&user_id)` (and again on `self.connections.remove(...)`).\nThese are protected by the pool invariant (every `Connection` has a matching\n`ConnectedPrincipal`), so they are not reachable under normal operation, but this code runs\non the network-triggered disconnect path (`connection_lost`) and a panic here would take\ndown the connection-handling task. The project guidelines also discourage `unwrap()` on\npaths reachable from network input.","fix":"Replace the `unwrap()`s with graceful handling, e.g.:\n```rust\nif let Some(connected_user) = self.connected_users.get_mut(&user_id) {\n    connected_user.connection_ids.remove(&connection_id);\n    if connected_user.connection_ids.is_empty() {\n        self.connected_users.remove(&user_id);\n        self.channels.remove_user(&user_id);\n    }\n}\nself.connections.remove(&connection_id);\n```","locations":[{"ref":"crates/collab/src/rpc/connection_pool.rs:90-96","code":"   90 |         let connected_user = self.connected_users.get_mut(&user_id).unwrap();\n   91 |         connected_user.connection_ids.remove(&connection_id);\n   92 |         if connected_user.connection_ids.is_empty() {\n   93 |             self.connected_users.remove(&user_id);\n   94 |             self.channels.remove_user(&user_id);\n   95 |         };\n   96 |         self.connections.remove(&connection_id).unwrap();","lines":7,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/collab/src/rpc/connection_pool.rs#L90-L96"}]},
{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"`shared_buffers` holds a strong `Entity<Buffer>` (plus a `BufferSnapshot`) for\nevery file touched by tool-call location resolution, `read_text_file`, and\n`write_text_file`, but it is only ever inserted into - never cleared. `rewind`\nand the refusal-truncation path remove entries but leave `shared_buffers`\nuntouched, so a long-lived thread that reads/edits many files keeps strong\nreferences to all of their buffers and snapshots for the thread's entire\nlifetime, growing memory without bound.","fix":"Evict entries from `shared_buffers` when the corresponding entries are removed\n(in `rewind`/truncate), or periodically drop snapshots for buffers no longer\nreferenced by any live entry. At minimum, clear it when the thread's entries are\ntruncated.","locations":[{"ref":"crates/acp_thread/src/acp_thread.rs:2104","code":" 2104 |     shared_buffers: HashMap<Entity<Buffer>, BufferSnapshot>,","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/acp_thread/src/acp_thread.rs#L2104"},{"ref":"crates/acp_thread/src/acp_thread.rs:3388-3391","code":" 3388 |                 for location in resolved_locations.iter().flatten() {\n 3389 |                     this.shared_buffers\n 3390 |                         .insert(location.buffer.clone(), location.buffer.read(cx).snapshot());\n 3391 |                 }","lines":4,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/acp_thread/src/acp_thread.rs#L3388-L3391"},{"ref":"crates/acp_thread/src/acp_thread.rs:4355","code":" 4355 |                     this.shared_buffers.insert(buffer.clone(), snapshot.clone());","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/acp_thread/src/acp_thread.rs#L4355"}]},
{"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"When a turn ends in `acp::StopReason::Refusal` for the user prompt, the entries\nafter the last user message are truncated, but unlike `rewind` (which collects\n`entry.terminals()`, removes them from `self.terminals`, and calls\n`terminal.kill(cx)`), this path leaves any terminals spawned during the refused\nturn running and still present in `self.terminals`. Those processes and entities\nleak.","fix":"Before truncating on refusal, gather the terminals from the entries being\nremoved and kill/remove them from `self.terminals`, mirroring the cleanup logic\nin `rewind`.","locations":[{"ref":"crates/acp_thread/src/acp_thread.rs:3914-3921","code":" 3914 |                                     // User prompt was refused - truncate back to before the user message\n 3915 |                                     let range = user_msg_ix..this.entries.len();\n 3916 |                                     if range.start < range.end {\n 3917 |                                         this.entries.truncate(user_msg_ix);\n 3918 |                                         cx.emit(AcpThreadEvent::EntriesRemoved(range));\n 3919 |                                     }\n 3920 |                                     cx.emit(AcpThreadEvent::Refusal);\n 3921 |                                 }","lines":8,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/acp_thread/src/acp_thread.rs#L3914-L3921"}]},
{"id":"MEM_3","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"`push_stream_message_for_connection` inserts an entry into `incoming_request_methods` / `outgoing_request_methods` for every `Request`, and only removes it when a matching `Response` arrives (`method_map.remove(&id)`). Requests that never receive a response (cancelled, dropped, or agent crash) leave their entry in the map forever. Over a long-lived connection these maps grow without bound; they are only cleared by `clear_messages`.","fix":"Bound the request-method maps (e.g. evict oldest entries past a cap) or clear stale entries when messages are trimmed, so unmatched request IDs cannot accumulate indefinitely.","locations":[{"ref":"crates/acp_tools/src/acp_tools.rs:532-559","code":"  532 |     let (request_id, method, message_type, params) = match stream_message.message {\n  533 |         AcpDebugMessageContent::Request { id, method, params } => {\n  534 |             let method_map = match stream_message.direction {\n  535 |                 AcpDebugMessageDirection::Incoming => &mut connection.incoming_request_methods,\n  536 |                 AcpDebugMessageDirection::Outgoing => &mut connection.outgoing_request_methods,\n  537 |                 AcpDebugMessageDirection::Stderr => return,\n  538 |             };\n  539 | \n  540 |             method_map.insert(id.clone(), method.clone());\n  541 |             (Some(id), method.into(), MessageType::Request, Ok(params))\n  542 |         }\n  543 |         AcpDebugMessageContent::Response { id, result } => {\n  544 |             let method_map = match stream_message.direction {\n  545 |                 AcpDebugMessageDirection::Incoming => &mut connection.outgoing_request_methods,\n  546 |                 AcpDebugMessageDirection::Outgoing => &mut connection.incoming_request_methods,\n  547 |                 AcpDebugMessageDirection::Stderr => return,\n  548 |             };\n  549 | \n  550 |             if let Some(method) = method_map.remove(&id) {\n  551 |                 (Some(id), method.into(), MessageType::Response, result)\n  552 |             } else {\n  553 |                 (\n  554 |                     Some(id),\n  555 |                     \"[unrecognized response]\".into(),\n  556 |                     MessageType::Response,\n  557 |                     result,\n  558 |                 )\n  559 |             }","lines":28,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/acp_tools/src/acp_tools.rs#L532-L559"},{"ref":"crates/acp_tools/src/acp_tools.rs:63-71","code":"   63 | struct WatchedConnection {\n   64 |     agent_id: AgentId,\n   65 |     connection: Rc<agent_servers::AcpConnection>,\n   66 |     messages: Vec<WatchedConnectionMessage>,\n   67 |     list_state: ListState,\n   68 |     incoming_request_methods: HashMap<acp::RequestId, Arc<str>>,\n   69 |     outgoing_request_methods: HashMap<acp::RequestId, Arc<str>>,\n   70 |     _task: Task<()>,\n   71 | }","lines":9,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/acp_tools/src/acp_tools.rs#L63-L71"}]},
{"id":"MEM_4","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"`Database` holds two per-id lock maps, `rooms: DashMap<RoomId, Arc<Mutex<()>>>` and `projects: DashMap<ProjectId, Arc<Mutex<()>>>`. Entries are inserted lazily via `.entry(...).or_default()` in `optional_room_transaction`, `project_transaction`, and `room_transaction`. Room entries are removed elsewhere (`crates/collab/src/db/queries/rooms.rs` calls `self.rooms.remove(&room_id)`), but there is no corresponding removal for the `projects` map anywhere in the codebase (only the test-only `reset()` clears it). Because project ids are monotonically increasing, every distinct project id that ever goes through `project_transaction` while not associated with a room leaves behind a permanent `Arc<Mutex<()>>` entry, so the `projects` map grows unbounded over the lifetime of a long-running server process.","fix":"Remove the `projects` lock entry once the corresponding project is deleted / fully unshared, analogous to how `rooms` entries are removed in `queries/rooms.rs` (`self.projects.remove(&project_id)`). Alternatively, switch to a scheme that reclaims idle mutexes (e.g. removing the entry when its `Arc` strong count drops to 1), so the map cannot grow without bound.","locations":[{"ref":"crates/collab/src/db.rs:54-55","code":"   54 |     rooms: DashMap<RoomId, Arc<Mutex<()>>>,\n   55 |     projects: DashMap<ProjectId, Arc<Mutex<()>>>,","lines":2,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/collab/src/db.rs#L54-L55"},{"ref":"crates/collab/src/db.rs:164","code":"  164 |                 self.projects.entry(project_id).or_default().clone()","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/collab/src/db.rs#L164"}]},
{"id":"MEM_5","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"very_easy","description":"`pane_close_subscriptions` maps a pane `EntityId` to its close `Subscription`. Entries are inserted when a pane is created (`handle_drop` at line 346, `default_pane_layout`, `deserialize_pane_layout`) but the `Event::Remove` branch of `handle_pane_event` only calls `this.panes.remove(source_pane, cx)` and never removes the corresponding entry from `pane_close_subscriptions`. Repeated split/close cycles within a single debug session therefore accumulate dead `Subscription` entries (and their captured closures) for panes that no longer exist, growing the map unboundedly for the lifetime of the `RunningState`.","fix":"Remove the stale subscription when the pane is removed:\n```rust\nEvent::Remove { .. } => {\n    let _did_find_pane = this.panes.remove(source_pane, cx).is_ok();\n    debug_assert!(_did_find_pane);\n    this.pane_close_subscriptions.remove(&source_pane.entity_id());\n    cx.notify();\n}\n```","locations":[{"ref":"crates/debugger_ui/src/session/running.rs:1587","code":" 1587 |             Event::Remove { .. } => {","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/debugger_ui/src/session/running.rs#L1587"}]},
{"id":"MEM_6","type":"memory_leak","type_label":"Memory Leak","severity":"negligible","difficulty":"medium","description":"The dialog stores its `Box<RefCell<DialogInfo>>` (which owns the `Receiver<Result<()>>`) in `GWLP_USERDATA` during `WM_NCCREATE` (`crates/auto_update_helper/src/dialog.rs:115`-`121`), but `WM_DESTROY` (`:200`-`203`) only calls `PostQuitMessage` and never reclaims/drops it, so the boxed `DialogInfo` is leaked. This is inconsequential in practice because the helper process exits immediately afterward, but the allocation (and the channel it holds) is never freed.","fix":"In the `WM_DESTROY` arm, reclaim and drop the box before quitting, e.g. read `GWLP_USERDATA`, `Box::from_raw` it, `SetWindowLongPtrW(hwnd, GWLP_USERDATA, 0)`, and let the box drop.","locations":[{"ref":"crates/auto_update_helper/src/dialog.rs:200-203","code":"  200 |         WM_DESTROY => {\n  201 |             unsafe { PostQuitMessage(0) };\n  202 |             LRESULT(0)\n  203 |         }","lines":4,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/auto_update_helper/src/dialog.rs#L200-L203"}]},
{"id":"RES_1","type":"resource_leak","type_label":"Resource Leak","severity":"medium","difficulty":"medium","description":"`AcpConnection::stdio` spawns the external agent process with `Child::spawn` and only\narranges for it to be killed once the `Child` is stored in `self.child`, since\ntermination relies solely on `impl Drop for AcpConnection` (see `drop` at\n`crates/agent_servers/src/acp.rs:1509-1515`, which calls `child.kill()`).\n`util::process::Child` itself has **no** `Drop` implementation that kills the process\n(only the Windows `JobObject` does), and the underlying `smol::process::Child` does not\nkill on drop by default. As a result, every early `return Err(...)` between the\nsuccessful `Child::spawn(...)?` and the construction of `Self` leaks the spawned OS\nprocess (node/gemini/codex/etc.), leaving it running indefinitely.\n\nReachable leak paths after a successful spawn:\n- `return Err(error.into())` when the `initialize` request fails and the process has\n  not exited (the `Either::Left((Err(error), ...))` arm).\n- `return Err(UnsupportedVersion.into())` when the negotiated protocol version is below\n  `MINIMUM_SUPPORTED_VERSION`.\n- The `?` operators taking `stdout`/`stdin`/`stderr` (`child.stdout.take().context(...)?`\n  etc.) also drop `child` without killing it.\n\nRepeated failed connection attempts (e.g. an incompatible agent binary) will accumulate\norphaned processes.","fix":"Ensure the spawned child is killed on every error path before `Self` is constructed.\nOptions:\n- Wrap `child` in a guard whose `Drop` calls `kill()` unless disarmed once ownership is\n  transferred into `Self`, or\n- Convert the early returns into a fallible inner block and `child.kill().log_err()` on\n  error, or\n- Set `kill_on_drop(true)` on the command / add a killing `Drop` to `util::process::Child`\n  on non-Windows so any dropped `Child` reaps its process.\n\nFor example, replace the direct `return Err(UnsupportedVersion.into())` with something\nlike:\n```rust\nif response.protocol_version < MINIMUM_SUPPORTED_VERSION {\n    child.kill().log_err();\n    return Err(UnsupportedVersion.into());\n}\n```\nand apply the same treatment to the `initialize` failure and stdio-take paths (a guard\ntype is cleaner than repeating this).","locations":[{"ref":"crates/agent_servers/src/acp.rs:846-851","code":"  846 |         let mut child = Child::spawn(child, Stdio::piped(), Stdio::piped(), Stdio::piped())?;\n  847 | \n  848 |         let stdout = child.stdout.take().context(\"Failed to take stdout\")?;\n  849 |         let stdin = child.stdin.take().context(\"Failed to take stdin\")?;\n  850 |         let stderr = child.stderr.take().context(\"Failed to take stderr\")?;\n  851 |         log::debug!(\"Spawning external agent server: {:?}, {:?}\", path, args);","lines":6,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_servers/src/acp.rs#L846-L851"},{"ref":"crates/agent_servers/src/acp.rs:975-998","code":"  975 |         let (response, status_fut) =\n  976 |             match futures::future::select(initialize_response, status_fut).await {\n  977 |                 futures::future::Either::Left((Ok(response), status_fut)) => (response, status_fut),\n  978 |                 futures::future::Either::Left((Err(error), status_fut)) => {\n  979 |                     let timer = cx\n  980 |                         .background_executor()\n  981 |                         .timer(std::time::Duration::from_millis(250))\n  982 |                         .boxed_local();\n  983 |                     if let futures::future::Either::Left((load_error, _timer)) =\n  984 |                         futures::future::select(status_fut, timer).await\n  985 |                     {\n  986 |                         return Err(load_error?.into());\n  987 |                     }\n  988 | \n  989 |                     return Err(error.into());\n  990 |                 }\n  991 |                 futures::future::Either::Right((load_error, _initialize_response)) => {\n  992 |                     return Err(load_error?.into());\n  993 |                 }\n  994 |             };\n  995 | \n  996 |         if response.protocol_version < MINIMUM_SUPPORTED_VERSION {\n  997 |             return Err(UnsupportedVersion.into());\n  998 |         }","lines":24,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_servers/src/acp.rs#L975-L998"},{"ref":"crates/agent_servers/src/acp.rs:1538-1544","code":" 1538 | impl Drop for AcpConnection {\n 1539 |     fn drop(&mut self) {\n 1540 |         if let Some(ref mut child) = self.child {\n 1541 |             child.kill().log_err();\n 1542 |         }\n 1543 |     }\n 1544 | }","lines":7,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_servers/src/acp.rs#L1538-L1544"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"hard","description":"In `keep_committed_edits`, offsets into `new_agent_diff_base` are computed as `(unreviewed.old.start as i32 + row_delta) as u32` and `(unreviewed.old.end as i32 + row_delta) as u32` with `row_delta: i32` accumulating negative deltas. Unlike the `end` computation, the `start` computation is not clamped with `cmp::min(..., max_point())`, and if `row_delta` drives the value negative the `as u32` cast wraps to a huge row number that is then passed to `Rope::point_to_offset`. Depending on `Rope`'s clamping behavior this yields a wrong replacement range or a panic. The reachability depends on git-committed vs unreviewed edit alignment, so it is an edge case rather than a routine path.","fix":"Guard the arithmetic against underflow, e.g. compute the shifted row with `saturating_add_signed` / an explicit `max(0)` before the `as u32` cast, and clamp the start point to `new_agent_diff_base.max_point()` the same way the end point already is, so a negative `row_delta` cannot wrap into an out-of-range row.","locations":[{"ref":"crates/action_log/src/action_log.rs:426-438","code":"  426 |                                     let old_byte_start =\n  427 |                                         new_agent_diff_base.point_to_offset(Point::new(\n  428 |                                             (unreviewed.old.start as i32 + row_delta) as u32,\n  429 |                                             0,\n  430 |                                         ));\n  431 |                                     let old_byte_end =\n  432 |                                         new_agent_diff_base.point_to_offset(cmp::min(\n  433 |                                             Point::new(\n  434 |                                                 (unreviewed.old.end as i32 + row_delta) as u32,\n  435 |                                                 0,\n  436 |                                             ),\n  437 |                                             new_agent_diff_base.max_point(),\n  438 |                                         ));","lines":13,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/action_log/src/action_log.rs#L426-L438"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"In the fuzzy-match dynamic-programming inner loop, the \"replacement\" diagonal\ncost is computed with a plain non-saturating `+`, while every neighbouring cost\ncombination uses `saturating_add`. The three other transitions use\n`.cost.saturating_add(DELETION_COST)`, `.cost.saturating_add(INSERTION_COST)`,\nand `.cost.saturating_add(DELETION_COST + INSERTION_COST)`, but the\n`fuzzy_eq` branch uses `self.matrix.get(row, col).cost + REPLACEMENT_COST`.\nIf any predecessor cost has already saturated to `u32::MAX` (via one of the\nsaturating adds), adding `REPLACEMENT_COST` overflows: this panics in debug\nbuilds and, worse, silently *wraps to a tiny value* in release builds, which\nwould corrupt the DP and make a garbage cell look like the cheapest (best)\nmatch. Reaching `u32::MAX` requires an absurd input size, so this is a\nrobustness/consistency nit rather than a practical crash, but the inconsistency\nshould be removed.","fix":"Use `saturating_add` like the surrounding transitions:\n```rust\n} else if fuzzy_eq(query_line, buffer_line) {\n    self.matrix.get(row, col).cost.saturating_add(REPLACEMENT_COST)\n} else {\n```","locations":[{"ref":"crates/agent/src/tools/edit_session/streaming_fuzzy_matcher.rs:184-196","code":"  184 |                 let diagonal = SearchState::new(\n  185 |                     if query_line == buffer_line {\n  186 |                         self.matrix.get(row, col).cost\n  187 |                     } else if fuzzy_eq(query_line, buffer_line) {\n  188 |                         self.matrix.get(row, col).cost + REPLACEMENT_COST\n  189 |                     } else {\n  190 |                         self.matrix\n  191 |                             .get(row, col)\n  192 |                             .cost\n  193 |                             .saturating_add(DELETION_COST + INSERTION_COST)\n  194 |
