{"id":"PERF_18","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`ProfilePickerDelegate::search_blocking` calls `self.foreground.block_on(match_strings(...))`,\nwhich blocks the foreground thread until the fuzzy match completes. This is reached\nfrom the render path: `ProfileSelector::render` -> `ensure_picker` (when\n`pending_refresh` is set) -> `refresh_profiles` -> `search_blocking` whenever the\nstored query is non-empty. Blocking the UI thread during render is undesirable; the\nasync `update_matches` path already does the same work off-thread via `cx.spawn_in`,\nso the blocking variant is a UI-thread stall. In practice the profile list is small,\nso the impact is limited, but the pattern blocks render on background work.","fix":"Avoid blocking during render. When `pending_refresh` fires with a non-empty query,\ndrive the refresh through the existing async `update_matches`/`refresh` machinery\n(spawning the match on a background executor and updating filtered entries on\ncompletion) instead of `foreground.block_on`. If a synchronous filter is truly\nrequired, filter the tiny candidate set directly without hopping to the background\nexecutor and back.","locations":[{"ref":"crates/agent_ui/src/profile_selector.rs:464","code":"  464 |         self.foreground.block_on(match_strings(","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/profile_selector.rs#L464"},{"ref":"crates/agent_ui/src/profile_selector.rs:344","code":"  344 |             let matches = self.search_blocking(&self.query);","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/profile_selector.rs#L344"},{"ref":"crates/agent_ui/src/profile_selector.rs:153","code":"  153 |                 picker.update(cx, |picker, cx| {","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/profile_selector.rs#L153"}]},
{"id":"PERF_19","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"In `to_anthropic_content`, the trailing-whitespace check uses `text.chars().last()`, which walks the entire string from the front (`Iterator::last` is O(n)) just to inspect the final character. This runs for every text content block converted on every request. `str::ends_with` with a `char` predicate inspects only the tail.","fix":"Replace the O(n) scan with a tail-only check. Before:\n```rust\n            let text = if text.chars().last().is_some_and(|c| c.is_whitespace()) {\n```\nAfter:\n```rust\n            let text = if text.ends_with(char::is_whitespace) {\n```","locations":[{"ref":"crates/anthropic/src/completion.rs:176","code":"  176 |             let text = if text.chars().last().is_some_and(|c| c.is_whitespace()) {","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/anthropic/src/completion.rs#L176"}]},
{"id":"PERF_20","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"In `BufferDiffSnapshot::hunks_intersecting_range_impl` (a hot iteration path), `base_word_diffs` and `buffer_word_diffs` are cloned for every hunk at lines 1028-1029, before the code decides whether the hunk is actually yielded. Hunks are subsequently skipped via `continue` when `!start_anchor.is_valid(buffer)` (line 1031) and when the matched pending hunk has `PendingSense::Suppress` (line 1073). For those skipped hunks the two `Vec<Range<...>>` clones are wasted allocations.","fix":"Defer the two clones (`let base_word_diffs = hunk.base_word_diffs.clone();` / `let buffer_word_diffs = hunk.buffer_word_diffs.clone();`) until after the `is_valid` check and the `PendingSense::Suppress` `continue`, i.e. move them down to just before constructing the returned `DiffHunk` at line 1104.","locations":[{"ref":"crates/buffer_diff/src/buffer_diff.rs:1080-1170","code":" 1080 |         iter::from_fn(move || {\n 1081 |             loop {\n 1082 |                 let (start_point, (start_anchor, start_base, hunk)) = summaries.next()?;\n 1083 |                 let (mut end_point, (mut end_anchor, end_base, _)) = summaries.next()?;\n 1084 | \n 1085 |                 let base_word_diffs = hunk.base_word_diffs.clone();\n 1086 |                 let buffer_word_diffs = hunk.buffer_word_diffs.clone();\n 1087 | \n 1088 |                 if !start_anchor.is_valid(buffer) {\n 1089 |                     continue;\n 1090 |                 }\n 1091 | \n 1092 |                 if end_point.column > 0 && end_point < max_point {\n 1093 |                     end_point.row += 1;\n 1094 |                     end_point.column = 0;\n 1095 |                     end_anchor = buffer.anchor_before(end_point);\n 1096 |                 }\n 1097 | \n 1098 |                 let mut secondary_status = DiffHunkSecondaryStatus::NoSecondaryHunk;\n 1099 | \n 1100 |                 let mut has_pending = false;\n 1101 |                 if start_anchor\n 1102 |                     .cmp(&pending_hunks_cursor.start().buffer_range.start, buffer)\n 1103 |                     .is_gt()\n 1104 |                 {\n 1105 |                     pending_hunks_cursor.seek_forward(&start_anchor, Bias::Left);\n 1106 |                 }\n 1107 | \n 1108 |                 if let Some(pending_hunk) = pending_hunks_cursor.item() {\n 1109 |                     let mut pending_range = pending_hunk.buffer_range.to_point(buffer);\n 1110 |                     if pending_range.end.column > 0 {\n 1111 |                         pending_range.end.row += 1;\n 1112 |                         pending_range.end.column = 0;\n 1113 |                     }\n 1114 | \n 1115 |                     if pending_range == (start_point..end_point)\n 1116 |                         && !buffer.has_edits_since_in_range(\n 1117 |                             &pending_hunk.buffer_version,\n 1118 |                             start_anchor..end_anchor,\n 1119 |                         )\n 1120 |                     {\n 1121 |                         match pending_hunk.sense {\n 1122 |                             PendingSense::SetSecondaryStatus { stage } => {\n 1123 |                                 has_pending = true;\n 1124 |                                 secondary_status = if stage {\n 1125 |                                     DiffHunkSecondaryStatus::SecondaryHunkRemovalPending\n 1126 |                                 } else {\n 1127 |                                     DiffHunkSecondaryStatus::SecondaryHunkAdditionPending\n 1128 |                                 };\n 1129 |                             }\n 1130 |                             PendingSense::Suppress => continue,\n 1131 |                         }\n 1132 |                     }\n 1133 |                 }\n 1134 | \n 1135 |                 if let (Some(secondary_cursor), false) = (secondary_cursor.as_mut(), has_pending) {\n 1136 |                     if start_anchor\n 1137 |                         .cmp(&secondary_cursor.start().buffer_range.start, buffer)\n 1138 |                         .is_gt()\n 1139 |                     {\n 1140 |                         secondary_cursor.seek_forward(&start_anchor, Bias::Left);\n 1141 |                     }\n 1142 | \n 1143 |                     if let Some(secondary_hunk) = secondary_cursor.item() {\n 1144 |                         let mut secondary_range = secondary_hunk.buffer_range.to_point(buffer);\n 1145 |                         if secondary_range.end.column > 0 {\n 1146 |                             secondary_range.end.row += 1;\n 1147 |                             secondary_range.end.column = 0;\n 1148 |                         }\n 1149 |                         if secondary_range.is_empty()\n 1150 |                             && secondary_hunk.diff_base_byte_range.is_empty()\n 1151 |                         {\n 1152 |                             // ignore\n 1153 |                         } else if secondary_range == (start_point..end_point) {\n 1154 |                             secondary_status = DiffHunkSecondaryStatus::HasSecondaryHunk;\n 1155 |                         } else if secondary_range.start <= end_point {\n 1156 |                             secondary_status = DiffHunkSecondaryStatus::OverlapsWithSecondaryHunk;\n 1157 |                         }\n 1158 |                     }\n 1159 |                 }\n 1160 | \n 1161 |                 return Some(DiffHunk {\n 1162 |                     range: start_point..end_point,\n 1163 |                     diff_base_byte_range: start_base..end_base,\n 1164 |                     buffer_range: start_anchor..end_anchor,\n 1165 |                     base_word_diffs,\n 1166 |                     buffer_word_diffs,\n 1167 |                     secondary_status,\n 1168 |                 });\n 1169 |             }\n 1170 |         })","lines":91,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e9 {"id":"PERF_21","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`ComponentPreview::render` calls `self.scope_ordered_entries()` (for `sidebar_entries`) on every frame, and `render_all_components` calls `self.filtered_components()` (and again inside the empty-check). Both methods clone every `ComponentMetadata`, lowercase name/scope/description for every component, group into a `HashMap`, and sort. In addition `update_component_list` already builds the same entries into `self.entries`, so the work is duplicated between the cached field and the per-render recomputation. For a large component registry this is avoidable per-frame allocation and sorting.","fix":"Reuse the already-cached `self.entries` (rebuilt only in `update_component_list` when `filter_text` changes) in `render` instead of recomputing `scope_ordered_entries()`, and cache the filtered-component result rather than recomputing it (twice) each render.","locations":[{"ref":"crates/component_preview/src/component_preview.rs:589","code":"  589 |         let sidebar_entries = self.scope_ordered_entries();","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/component_preview/src/component_preview.rs#L589"},{"ref":"crates/component_preview/src/component_preview.rs:491","code":"  491 |                 if self.filtered_components().is_empty() && !self.filter_text.is_empty() {","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/component_preview/src/component_preview.rs#L491"}]},
{"id":"PERF_22","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"`read_text_file` looks up `shared_buffers` with `.get(&buffer.clone())`, which\nclones the `Entity<Buffer>` (an `Arc` refcount bump) only to take a reference to\nit and immediately drop it. `buffer` is still owned and usable, so the clone is\npointless.","fix":"Before:\n```\nthis.shared_buffers.get(&buffer.clone()).cloned()\n```\nAfter:\n```\nthis.shared_buffers.get(&buffer).cloned()\n```","locations":[{"ref":"crates/acp_thread/src/acp_thread.rs:4338","code":" 4338 |                     this.shared_buffers.get(&buffer.clone()).cloned()","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/acp_thread/src/acp_thread.rs#L4338"}]},
{"id":"PERF_23","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"`DiagnosticsTool::run` opens the target buffer twice for the file path case. `pull_diagnostics` already resolves the project path and calls `project.open_buffer(...)` to pull diagnostics, and then `run` immediately repeats `project.find_project_path(path, cx)` plus `project.open_buffer(project_path, cx)` to read the snapshot. `open_buffer` is idempotent so this is not a correctness bug, but it is a redundant resolve + round-trip on every file-scoped diagnostics call.","fix":"Have `pull_diagnostics` return the opened `buffer` (for the `Some(path)` case) alongside the `refreshed` boolean, and reuse it in `run` instead of re-resolving the path and reopening the buffer.","locations":[{"ref":"crates/agent/src/tools/diagnostics_tool.rs:98-120","code":"   98 |     match path {\n   99 |         Some(path) => {\n  100 |             let open_buffer_task = project.update(cx, |project, cx| {\n  101 |                 let Some(project_path) = project.find_project_path(path, cx) else {\n  102 |                     return Err(format!(\"Could not find path {} in project\", path.display()));\n  103 |                 };\n  104 |                 Ok(project.open_buffer(project_path, cx))\n  105 |             })?;\n  106 | \n  107 |             let buffer = with_cancellation(open_buffer_task, event_stream)\n  108 |                 .await?\n  109 |                 .map_err(|e| e.to_string())?;\n  110 | \n  111 |             let lsp_store = project.read_with(cx, |project, _cx| project.lsp_store());\n  112 |             let pull_task = lsp_store.update(cx, |lsp_store, cx| {\n  113 |                 lsp_store.pull_diagnostics_for_buffer(buffer, cx)\n  114 |             });\n  115 |             let pull_result = with_cancellation(pull_task, event_stream).await?;\n  116 |             if let Err(error) = &pull_result {\n  117 |                 log::warn!(\"Failed to pull diagnostics, using cached: {error:#}\");\n  118 |             }\n  119 |             Ok(pull_result.is_ok())\n  120 |         }","lines":23,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent/src/tools/diagnostics_tool.rs#L98-L120"},{"ref":"crates/agent/src/tools/diagnostics_tool.rs:170-185","code":"  170 |             match input.path {\n  171 |                 Some(ref path) if !path.is_empty() => {\n  172 |                     let refreshed =\n  173 |                         pull_diagnostics(&project, Some(Path::new(path)), &event_stream, cx)\n  174 |                             .await?;\n  175 | \n  176 |                     let open_buffer_task = project.update(cx, |project, cx| {\n  177 |                         let Some(project_path) = project.find_project_path(path, cx) else {\n  178 |                             return Err(format!(\"Could not find path {path} in project\"));\n  179 |                         };\n  180 |                         Ok(project.open_buffer(project_path, cx))\n  181 |                     })?;\n  182 | \n  183 |                     let buffer = with_cancellation(open_buffer_task, &event_stream)\n  184 |                         .await?\n  185 |                         .map_err(|e| e.to_string())?;","lines":16,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent/src/tools/diagnostics_tool.rs#L170-L185"}]},
{"id":"PERF_24","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"Needless double-borrow in `render_toolbar`. In the `Agent::Custom { id, .. }` arm, `id` is already `&AgentId`, yet it is passed as `&id` (`&&AgentId`) to `agent_server_store.agent_icon` and `agent_server_store.agent_display_name`, both of which take `&AgentId`. It compiles via deref coercion but is a `clippy::needless_borrow` lint.","fix":"Pass `id` directly:\n```rust\nlet icon = store.agent_icon(id);\nlet label = store\n    .agent_display_name(id)\n    .unwrap_or_else(|| self.selected_agent.label());\n```\ninstead of:\n```rust\nlet icon = store.agent_icon(&id);\nlet label = store\n    .agent_display_name(&id)\n    .unwrap_or_else(|| self.selected_agent.label());\n```","locations":[{"ref":"crates/agent_ui/src/agent_panel.rs:5854-5860","code":" 5854 |         } else if let Agent::Custom { id, .. } = &self.selected_agent {\n 5855 |             let store = agent_server_store.read(cx);\n 5856 |             let icon = store.agent_icon(&id);\n 5857 | \n 5858 |             let label = store\n 5859 |                 .agent_display_name(&id)\n 5860 |                 .unwrap_or_else(|| self.selected_agent.label());","lines":7,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/agent_panel.rs#L5854-L5860"}]},
{"id":"PERF_25","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`AgentRegistryPage` subscribes to `observe_global::<SettingsStore>` and, on every global settings change anywhere in the app, runs `filter_registry_agents`, which calls `refresh_installed_statuses` (reading `AllAgentServersSettings` and rebuilding the `installed_statuses` map by cloning each id `String`) and then re-filters all registry agents. Combined with the redundant map clone (see the separate finding), this is a full O(n) recompute triggered by unrelated settings mutations while the page is open. For typical registry sizes this is minor, but it is avoidable churn on a hot global observer.","fix":"Consider narrowing the reaction, e.g. only recompute `installed_statuses`/filtering when the relevant `AllAgentServersSettings` slice actually changed (compare against the previously observed value before rebuilding), rather than rebuilding on every `SettingsStore` notification.","locations":[{"ref":"crates/agent_ui/src/agent_registry_ui.rs:106-108","code":"  106 |             subscriptions.push(cx.observe_global::<SettingsStore>(|this, cx| {\n  107 |                 this.filter_registry_agents(cx);\n  108 |             }));","lines":3,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/agent_registry_ui.rs#L106-L108"},{"ref":"crates/agent_ui/src/agent_registry_ui.rs:146-160","code":"  146 |     fn refresh_installed_statuses(&mut self, cx: &mut Context<Self>) {\n  147 |         let settings = cx\n  148 |             .global::<SettingsStore>()\n  149 |             .get::<AllAgentServersSettings>(None);\n  150 |         self.installed_statuses.clear();\n  151 |         for (id, settings) in settings.iter() {\n  152 |             let status = match settings {\n  153 |                 CustomAgentServerSettings::Registry { .. } => {\n  154 |                     RegistryInstallStatus::InstalledRegistry\n  155 |                 }\n  156 |                 CustomAgentServerSettings::Custom { .. } => RegistryInstallStatus::InstalledCustom,\n  157 |             };\n  158 |             self.installed_statuses.insert(id.clone(), status);\n  159 |         }\n  160 |     }","lines":15,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/agent_registry_ui.rs#L146-L160"}]},
{"id":"PERF_26","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"very_easy","description":"In `ThreadSearchBar::update_matches`, the query editor's text is read (and a new `String` allocated) twice per rescan. `self.build_query(cx)` already reads it internally via `self.current_query(cx)`, and then the very next line reads it again just to test emptiness: `self.query_error = !self.current_query(cx).is_empty() && query.is_none();`. Since `build_query` returns `(None, None)` only for an empty query, `(None, Some(err))` for an unparsable non-empty query, and `(Some(_), None)` otherwise, the error state can be derived from the already-computed `query`/`err_msg` without re-reading the editor.","fix":"Reuse the already-computed values instead of re-reading the editor text. Before:\n```rust\nlet (query, err_msg) = self.build_query(cx);\nself.query_error = !self.current_query(cx).is_empty() && query.is_none();\nself.query_error_message = err_msg;\n```\nAfter:\n```rust\nlet (query, err_msg) = self.build_query(cx);\nself.query_error = query.is_none() && err_msg.is_some();\nself.query_error_message = err_msg;\n```\n(An unparsable non-empty query is exactly the case where `query` is `None` and `err_msg` is `Some`.)","locations":[{"ref":"crates/agent_ui/src/conversation_view/thread_search_bar.rs:317-319","code":"  317 |         let (query, err_msg) = self.build_query(cx);\n  318 |         self.query_error = !self.current_query(cx).is_empty() && query.is_none();\n  319 |         self.query_error_message = err_msg;","lines":3,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/conversation_view/thread_search_bar.rs#L317-L319"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"medium","difficulty":"easy","description":"`ThreadMetadataStore::complete_worktree_restore` (lines 946-972) is a public method that is never\ncalled from production code - only from its own tests (`test_complete_worktree_restore_multiple_paths`\nand `test_complete_worktree_restore_preserves_unmatched_paths`). The only production caller of the\nrestore-path-replacement logic is `update_restored_worktree_paths` (used at\n`crates/sidebar/src/sidebar.rs:4238`). The two methods are near-identical duplicates that both walk\n`thread.folder_paths()` applying `path_replacements` and rebuild `WorktreePaths`; they differ only in\nthat `update_restored_worktree_paths` replaces the first matching path\n(`if let Some(pos) = paths.iter().position(...)`) while `complete_worktree_restore` replaces every\nmatching path (`for path in &mut paths { if path == old_path { ... } }`). Shipping both invites the two\ncopies to drift apart, and the unused one is tested in isolation so the discrepancy is never caught.","fix":"Delete `complete_worktree_restore` and its two dedicated tests, or, if the \"replace all matches\"\nbehavior is the intended one, wire it into the `sidebar.rs:4238` call site and delete\n`update_restored_worktree_paths` instead. Keep a single implementation so the path-replacement logic\ncannot diverge between a tested-but-unused copy and the production copy.","locations":[{"ref":"crates/agent_ui/src/thread_metadata_store.rs:946-972","code":"  946 |     pub fn complete_worktree_restore(\n  947 |         &mut self,\n  948 |         thread_id: ThreadId,\n  949 |         path_replacements: &[(PathBuf, PathBuf)],\n  950 |         cx: &mut Context<Self>,\n  951 |     ) {\n  952 |         if let Some(thread) = self.threads.get(&thread_id).cloned() {\n  953 |             let mut paths: Vec<PathBuf> = thread.folder_paths().paths().to_vec();\n  954 |             for (old_path, new_path) in path_replacements {\n  955 |                 for path in &mut paths {\n  956 |                     if path == old_path {\n  957 |                         *path = new_path.clone();\n  958 |                     }\n  959 |                 }\n  960 |             }\n  961 |             let new_folder_paths = PathList::new(&paths);\n  962 |             self.save_internal(ThreadMetadata {\n  963 |                 worktree_paths: WorktreePaths::from_path_lists(\n  964 |                     thread.main_worktree_paths().clone(),\n  965 |                     new_folder_paths.clone(),\n  966 |                 )\n  967 |                 .unwrap_or_else(|_| WorktreePaths::from_folder_paths(&new_folder_paths)),\n  968 |                 ..thread\n  969 |             });\n  970 |             cx.notify();\n  971 |         }\n  972 |     }","lines":27,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/thread_metadata_store.rs#L946-L972"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`update_visible_ranges` runs `let end = multibuffer.len(cx); Some(multibuffer.snapshot(cx).offset_to_point(end).row + 1)` as the last expression of the `multibuffer.update` closure. The returned `Some(..)` is discarded by the caller, so this allocates a fresh multibuffer snapshot and performs an `offset_to_point` conversion on every diff update purely to throw the result away.","fix":"Drop the trailing `let end = ...; Some(...)` and let the closure return `()`; the `set_excerpts_for_path` call is the only needed side effect.","locations":[{"ref":"crates/acp_thread/src/diff.rs:321-334","code":"  321 |     fn update_visible_ranges(&mut self, cx: &mut Context<Diff>) {\n  322 |         let ranges = self.excerpt_ranges(cx);\n  323 |         self.multibuffer.update(cx, |multibuffer, cx| {\n  324 |             multibuffer.set_excerpts_for_path(\n  325 |                 PathKey::for_buffer(&self.new_buffer, cx),\n  326 |                 self.new_buffer.clone(),\n  327 |                 ranges,\n  328 |                 excerpt_context_lines(cx),\n  329 |                 cx,\n  330 |             );\n  331 |             let end = multibuffer.len(cx);\n  332 |             Some(multibuffer.snapshot(cx).offset_to_point(end).row + 1)\n  333 |         });\n  334 |         cx.notify();","lines":14,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/acp_thread/src/diff.rs#L321-L334"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`SandboxWrap::is_local` is populated by the caller (`terminal_tool.rs` sets `is_local: is_local_project`) and documented as gating the network proxy (\"it can only confine local commands; a remote terminal can't reach it\"), but `SandboxWrap::to_policy` never reads it and no other code reads the field. The documented invariant - that a remote terminal should not get a `Restricted` network policy relying on a loopback proxy it cannot reach - is therefore not actually enforced by this type.","fix":"Either consume `is_local` in `to_policy` (e.g. refuse/adjust `SandboxNetworkAccess::Restricted` when `!is_local`) so the documented guarantee holds, or remove the unused field if the check is genuinely enforced upstream.","locations":[{"ref":"crates/acp_thread/src/terminal.rs:61-63","code":"   61 |     /// enforcing proxy binds a loopback port on this host, so it can only\n   62 |     /// confine local commands; a remote terminal can't reach it.\n   63 |     pub is_local: bool,","lines":3,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/acp_thread/src/terminal.rs#L61-L63"}]},
{"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"The `AgentPanel::is_active` field is write-only dead state. It is initialized to `false` in `new` (line 1591) and assigned in `Panel::set_active` (line 5018), but it is never read anywhere in product code (the other `is_active` occurrences in the file are unrelated local variables). Storing it serves no purpose and misleads readers into thinking panel activity is tracked/consulted on `self`.","fix":"Either remove the `is_active` field entirely (and the `self.is_active = active;` assignment in `set_active`), or actually consult it where activity matters. If it is kept for future use, add a doc comment explaining why it exists unread. The simplest correct fix is deletion of the field and its assignment.","locations":[{"ref":"crates/agent_ui/src/agent_panel.rs:1190","code":" 1190 |     is_active: bool,","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/agent_panel.rs#L1190"},{"ref":"crates/agent_ui/src/agent_panel.rs:1603","code":" 1603 |             is_active: false,","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/agent_panel.rs#L1603"},{"ref":"crates/agent_ui/src/agent_panel.rs:5073-5078","code":" 5073 |     fn set_active(&mut self, active: bool, window: &mut Window, cx: &mut Context<Self>) {\n 5074 |         self.is_active = active;\n 5075 |         if active {\n 5076 |             self.ensure_thread_initialized(window, cx);\n 5077 |         }\n 5078 |     }","lines":6,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/agent_panel.rs#L5073-L5078"}]},
{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"Redundant always-true condition in `should_render_new_user_onboarding`. The function returns early at the top when `new_user_onboarding_upsell_dismissed` is `true` (lines 6187-6193), so by the time execution reaches line 6203 the flag is guaranteed to be `false`, making `!self.new_user_onboarding_upsell_dismissed.load(...)` always `true`. The inner `if` guard around `self.dismiss_ai_onboarding(cx)` is therefore dead and can never be skipped.","fix":"Drop the redundant guard and call `dismiss_ai_onboarding` directly:\n```rust\nself.dismiss_ai_onboarding(cx);\nreturn false;\n```\ninstead of:\n```rust\nif !self\n    .new_user_onboarding_upsell_dismissed\n    .load(Ordering::Acquire)\n{\n    self.dismiss_ai_onboarding(cx);\n}\nreturn false;\n```","locations":[{"ref":"crates/agent_ui/src/agent_panel.rs:6269-6274","code":" 6269 |             if !self\n 6270 |                 .new_user_onboarding_upsell_dismissed\n 6271 |                 .load(Ordering::Acquire)\n 6272 |             {\n 6273 |                 self.dismiss_ai_onboarding(cx);\n 6274 |             }","lines":6,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/agent_panel.rs#L6269-L6274"}]},
{"id":"DEAD_6","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`ConfigOptionSelector` has a field `setting_value: bool` that is initialized to `false`\nin `new` and never assigned `true` anywhere in the codebase. It is only ever read in the\ntwo `.disabled(self.setting_value)` calls in `render` (the Select trigger button and the\nBoolean switch). Because it is always `false`, those `disabled(...)` calls are inert -\nthe intended \"disable the control while a set-config-option task is in flight\" behavior\nnever actually happens. Either the field should be toggled around the async\n`set_config_option` tasks or removed along with the dead `disabled` calls.","fix":"Make the field live: set `self.setting_value = true` (with `cx.notify()`) before spawning\neach `config_options.set_config_option(...)` task and reset it to `false` when the task\ncompletes, so the control is actually disabled during the in-flight update. Otherwise\ndelete the `setting_value` field and the two `.disabled(self.setting_value)` calls.","locations":[{"ref":"crates/agent_ui/src/config_options.rs:297","code":"  297 |     setting_value: bool,","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/config_options.rs#L297"},{"ref":"crates/agent_ui/src/config_options.rs:358","code":"  358 |             setting_value: false,","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/config_options.rs#L358"},{"ref":"crates/agent_ui/src/config_options.rs:441","code":"  441 |         .disabled(self.setting_value)","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/config_options.rs#L441"},{"ref":"crates/agent_ui/src/config_options.rs:587","code":"  587 |                         .disabled(self.setting_value)","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/config_options.rs#L587"}]},
{"id":"DEAD_7","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"`pending_edits` is hardcoded to `false` (see the comment at 3052-3057) and then threaded as a parameter through `render_activity_bar` -> `render_edits_summary` -> `render_edited_files` -> `render_edited_files_buttons`. Because it is always `false`, every `.disabled(pending_edits)`, every `.when(pending_edits, ...)` tooltip, and the entire `if pending_edits { ... }` animated \"Editing N files…\" branch in `render_edits_summary` (lines 4032-4052) are unreachable. This is documented as a temporary workaround, but it leaves a substantial amount of dead branch code and a plumbed-through parameter that is always constant.","fix":"Once the underlying edit-controls bug referenced in the comment is fixed, either restore the real `pending_edits` computation or, if the always-enabled behavior is permanent, drop the `pending_edits` parameter from `render_activity_bar`/`render_edits_summary`/`render_edited_files`/`render_edited_files_buttons` and delete the now-unreachable `if pending_edits` / `.when(pending_edits, ...)` / `.disabled(pending_edits)` branches.","locations":[{"ref":"crates/agent_ui/src/conversation_view/thread_view.rs:3114","code":" 3114 |         let pending_edits = false;","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/conversation_view/thread_view.rs#L3114"},{"ref":"crates/agent_ui/src/conversation_view/thread_view.rs:4104-4124","code":" 4104 |                         if pending_edits {\n 4105 |                             this.child(\n 4106 |                                 Label::new(format!(\n 4107 |                                     \"Editing {} {}…\",\n 4108 |                                     changed_buffers.len(),\n 4109 |                                     if changed_buffers.len() == 1 {\n 4110 |                                         \"file\"\n 4111 | {"id":"DEAD_8","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"In `render_fast_mode_control`, `model_identity` is computed from the thread's model but never used: the only other reference is the `let _ = model_identity;` statement that explicitly discards it. The pending-confirmation branch uses `provider_id`/`model_id` from `pending_confirmation`, not from `model_identity`. The binding calls `thread.model().map(|model| (model.provider_id(), model.id()))` and throws the result away, which is pure dead work on the render path.","fix":"Delete both the binding and the discard. Remove:\n```\n        let model_identity = thread\n            .model()\n            .map(|model| (model.provider_id(), model.id()));\n```\nand remove the later line `let _ = model_identity;`.","locations":[{"ref":"crates/agent_ui/src/conversation_view/thread_view.rs:4996-4998","code":" 4996 |         let model_identity = thread\n 4997 |             .model()\n 4998 |             .map(|model| (model.provider_id(), model.id()));","lines":3,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/conversation_view/thread_view.rs#L4996-L4998"},{"ref":"crates/agent_ui/src/conversation_view/thread_view.rs:5092","code":" 5092 |         let _ = model_identity;","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/conversation_view/thread_view.rs#L5092"}]},
{"id":"DEAD_9","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"In `render_thinking_control`, the guard `if !model.supported_effort_levels().is_empty() && !thinking` is reached only after the immediately preceding `if model.supported_effort_levels().is_empty() { return ... }`, so `!model.supported_effort_levels().is_empty()` is always `true` here. The extra call is redundant (and re-allocates the effort-levels `Vec` on the render path). Only the `!thinking` part is meaningful.","fix":"Simplify the second guard to just the meaningful condition:\n```\n        if !thinking {\n            return Some(thinking_toggle.into_any_element());\n        }\n```\nreplacing:\n```\n        if !model.supported_effort_levels().is_empty() && !thinking {\n            return Some(thinking_toggle.into_any_element());\n        }\n```","locations":[{"ref":"crates/agent_ui/src/conversation_view/thread_view.rs:5206-5212","code":" 5206 |         if model.supported_effort_levels().is_empty() {\n 5207 |             return Some(thinking_toggle.into_any_element());\n 5208 |         }\n 5209 | \n 5210 |         if !model.supported_effort_levels().is_empty() && !thinking {\n 5211 |             return Some(thinking_toggle.into_any_element());\n 5212 |         }","lines":7,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/conversation_view/thread_view.rs#L5206-L5212"}]},
{"id":"DEAD_10","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"In the askpass socket task, the `ControlFlow::Break(())` arm awaits `std::future::pending::<()>()`, which never resolves, so the following `drop(stream)` is unreachable dead code. Keeping the stream alive forever is intentional (the comment says the caller drops the task), but the `drop(stream)` line can never run and is misleading.","fix":"Remove the unreachable `drop(stream);` (and, if desired, keep the `pending` await with just a clarifying comment). Before:\n```rust\n                            std::future::pending::<()>().await;\n                            drop(stream);\n```\nAfter:\n```rust\n                            std::future::pending::<()>().await;\n```","locations":[{"ref":"crates/askpass/src/askpass.rs:336-338","code":"  336 |                             std::future::pending::<()>().await;\n  337 |                             drop(stream);\n  338 |                         }","lines":3,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/askpass/src/askpass.rs#L336-L338"}]},
{"id":"DEAD_11","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`Breadcrumbs::pane_focused` is written in `pane_focus_update` (`crates/breadcrumbs/src/breadcrumbs.rs:125`) and initialized in `new` (`:39`) but never read anywhere. `render` (`:48`-`81`) passes a hardcoded `false` to the `RenderBreadcrumbText` function; note that this `false` is actually the `multibuffer_header` parameter (see `render_breadcrumb_text` in `crates/editor/src/element.rs:6731`), which is legitimately `false` here, so the field is genuinely unused rather than mis-passed. The tracked focus state has no effect.","fix":"Either remove the `pane_focused` field and the `pane_focus_update` bookkeeping entirely, or actually consume the value (e.g. to adjust breadcrumb styling when the pane is unfocused) if the intent was to reflect focus in the rendered breadcrumbs.","locations":[{"ref":"crates/breadcrumbs/src/breadcrumbs.rs:25","code":"   25 |     pane_focused: bool,","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/breadcrumbs/src/breadcrumbs.rs#L25"},{"ref":"crates/breadcrumbs/src/breadcrumbs.rs:119-127","code":"  119 |     fn pane_focus_update(\n  120 |         &mut self,\n  121 |         pane_focused: bool,\n  122 |         _window: &mut Window,\n  123 |         _: &mut Context<Self>,\n  124 |     ) {\n  125 |         self.pane_focused = pane_focused;\n  126 |     }\n  127 | }","lines":9,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/breadcrumbs/src/breadcrumbs.rs#L119-L127"}]},
{"id":"DEAD_12","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`scope_ordered_entries` computes a `Vec<usize>` of highlight `positions` for each matching component (the `for i in index..end` loop that checks `scopeless_name.is_char_boundary(i)`) and stores it in `PreviewEntry::Component(component, Some(positions))`. But `render_sidebar_entry` never uses the stored value: it binds it as `if let Some(_positions) = highlight_positions` (underscore, discarded) and then recomputes the highlight ranges from scratch via `name_lower.find(&filter_lower)`. The per-component position computation is therefore wasted work on every list rebuild, and the two computations can silently diverge.","fix":"Either use the precomputed `positions` in `render_sidebar_entry` (pass them into `HighlightedLabel::new`) instead of recomputing, or stop computing them in `scope_ordered_entries` and store only the boolean \"is a match\" state that the renderer actually consumes.","locations":[{"ref":"crates/component_preview/src/component_preview.rs:244","code":"  244 | ","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/component_preview/src/component_preview.rs#L244"},{"ref":"crates/component_preview/src/component_preview.rs:373","code":"  373 |                     .child(if let Some(_positions) = highlight_positions {","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/component_preview/src/component_preview.rs#L373"}]},
{"id":"DEAD_13","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"very_easy","description":"The `query!` macro arm intended to handle an async single-row query with arguments returning a bare `Result<$return_type>` is written with the matcher tokens `fn async` instead of `async fn` (`($vis:vis fn async $id:ident(...)`). No caller can ever write `fn async name(...)`, so this arm is unreachable dead code, and there is consequently no working arm for `async fn foo(arg: T) -> Result<ReturnType>` (non-`Option`, non-`Vec`); such a declaration would fail to compile.","fix":"Change the matcher `fn async` to `async fn` so the arm actually matches and covers the async-with-args single-row case:\n```\n($vis:vis async fn $id:ident($($arg:ident: $arg_type:ty),+) ->  Result<$return_type:ty> { $($sql:tt)+ }) => {\n```","locations":[{"ref":"crates/db/src/query.rs:292","code":"  292 |     ($vis:vis fn async $id:ident($($arg:ident: $arg_type:ty),+) ->  Result<$return_type:ty> { $($sql:tt)+ }) => {","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/db/src/query.rs#L292"}]},
{"id":"DEAD_14","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"The fallback `return await fetch(\"https://zed.dev/404\")` uses `await` on a value that is returned immediately. `await` inside a `return` has no functional effect here (the caller already awaits the returned promise) and only adds an extra microtask hop. It is misleading noise; note that this line should be reworked anyway per the status-code finding above.","fix":"Before:\n```\nreturn await fetch(\"https://zed.dev/404\");\n```\n\nAfter (if the line is kept as-is rather than rewritten for the status-code fix):\n```\nreturn fetch(\"https://zed.dev/404\");\n```","locations":[{"ref":".cloudflare/open-source-website-assets/src/worker.js:8","code":"    8 |       return await fetch(\"https://zed.dev/404\");","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/.cloudflare/open-source-website-assets/src/worker.js#L8"}]},
{"id":"DEAD_15","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In the subagent `send` result mapping, the match arm uses `acp::StopReason::EndTurn | _`.\nThe `_` alternative already matches every remaining variant including `EndTurn`, so naming\n`EndTurn` explicitly is redundant and misleading (it suggests only those two are handled\nwhen in fact all non-listed variants fall through).","fix":"Before:\n```rust\nacp::StopReason::EndTurn | _ => SubagentPromptResult::Completed,\n```\nAfter:\n```rust\n_ => SubagentPromptResult::Completed,\n```","locations":[{"ref":"crates/agent/src/agent.rs:3538","code":" 3538 |                                         acp::StopReason::EndTurn | _ => SubagentPromptResult::Completed,","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent/src/agent.rs#L3538"}]},
{"id":"DEAD_16","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`session_modes` clones the `Rc` before borrowing it, which is unnecessary. The sibling\nmethod `session_config_options` (`crates/agent_servers/src/acp.rs:2032`) borrows\n`self.sessions` directly. The clone here adds an atomic-free `Rc` refcount bump and an\nextra local for no benefit.","fix":"Borrow directly, matching `session_config_options`:\n```rust\nlet sessions_ref = self.sessions.borrow();\nlet Some(session) = sessions_ref.get(session_id) else {\n    return None;\n};\n```\ninstead of:\n```rust\nlet sessions = self.sessions.clone();\nlet sessions_ref = sessions.borrow();\n```","locations":[{"ref":"crates/agent_servers/src/acp.rs:1963-1967","code":" 1963 |         let sessions = self.sessions.clone();\n 1964 |         let sessions_ref = sessions.borrow();\n 1965 |         let Some(session) = sessions_ref.get(session_id) else {\n 1966 |             return None;\n 1967 |         };","lines":5,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_servers/src/acp.rs#L1963-L1967"}]},
{"id":"DEAD_17","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `AgentDiff::review_in_active_editor`, after `keys.find(|k| *k == curr_buffer)` advances the iterator past the current buffer, the subsequent `.filter(|k| *k != curr_buffer)` can never be `false` (the iterator is already positioned after `curr_buffer`), so the filter is dead.\n```rust\nlet mut keys = changed_buffers.map(|(buffer, _)| buffer);\nkeys.find(|k| *k == curr_buffer);\nlet next_project_path = keys\n    .next()\n    .filter(|k| *k != curr_buffer)\n    .and_then(|after| after.read(cx).project_path(cx));\n```","fix":"Remove the redundant filter:\n```rust\nlet next_project_path = keys\n    .next()\n    .and_then(|after| after.read(cx).project_path(cx));\n```","locations":[{"ref":"crates/agent_ui/src/agent_diff.rs:1813-1819","code":" 1813 |             let mut keys = changed_buffers.map(|(buffer, _)| buffer);\n 1814 |             keys.find(|k| *k == curr_buffer);\n 1815 |             let next_project_path = keys\n 1816 |                 .next()\n 1817 |                 .filter(|k| *k != curr_buffer)\n 1818 |                 .and_then(|after| after.read(cx).project_path(cx));\n 1819 |             drop(keys);","lines":7,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/agent_diff.rs#L1813-L1819"}]},
{"id":"DEAD_18","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"`ConfigOptionsView` stores a `config_option_ids: Vec<acp::SessionConfigId>` field that is\ncomputed and assigned in `new` (line 51/71) and recomputed in `rebuild_selectors` (line\n235), but the stored value is never read anywhere in the module's logic - it is only ever\nwritten. The associated helper `Self::config_option_ids` is used to populate it, but the\nfield itself carries no behavior (selectors are rebuilt unconditionally on refresh), so\nit is dead state.","fix":"Either remove the `config_option_ids` field (and stop assigning it) if it serves no\npurpose, or actually use it - e.g. in `rebuild_selectors` compare the freshly computed\nids against the stored ones and skip the (expensive) selector rebuild when they are\nunchanged.","locations":[{"ref":"crates/agent_ui/src/config_options.rs:38","code":"   38 |     config_option_ids: Vec<acp::SessionConfigId>,","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/config_options.rs#L38"},{"ref":"crates/agent_ui/src/config_options.rs:51","code":"   51 |         let config_option_ids = Self::config_option_ids(&config_options);","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/config_options.rs#L51"},{"ref":"crates/agent_ui/src/config_options.rs:235","code":"  235 |         self.config_option_ids = Self::config_option_ids(&self.config_options);","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/config_options.rs#L235"}]},
{"id":"DEAD_19","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"`defer` is imported from `util` but never used in the file. The only occurrences of `defer` are `cx.defer(...)` (line 2952) and `window.defer(...)` (line 3171), which are inherent methods on the GPUI context/window types, not the free `util::defer` function. Because `use` imports are not re-exported through the submodules' `use super::*`, this glob import is genuinely dead.","fix":"Remove the unused `defer` from the `util` import list:\n\nBefore:\n```rust\nuse util::{\n    ResultExt, debug_panic, defer,\n    paths::{PathStyle, PathWithPosition},\n    rel_path::RelPath,\n    size::format_file_size,\n    time::duration_alt_display,\n};\n```\n\nAfter:\n```rust\nuse util::{\n    ResultExt, debug_panic,\n    paths::{PathStyle, PathWithPosition},\n    rel_path::RelPath,\n    size::format_file_size,\n    time::duration_alt_display,\n};\n```","locations":[{"ref":"crates/agent_ui/src/conversation_view.rs:68-74","code":"   68 | use util::{\n   69 |     ResultExt, debug_panic, defer,\n   70 |     paths::{PathStyle, PathWithPosition},\n   71 |     rel_path::RelPath,\n   72 |     size::format_file_size,\n   73 |     time::duration_alt_display,\n   74 | };","lines":7,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/conversation_view.rs#L68-L74"}]},
{"id":"DEAD_20","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `nav_button`, the local binding `let action_for_dispatch = action;` is redundant. `action` is a `&'static dyn Action`, i.e. a reference, which is `Copy`, so both the `on_click` closure and the `tooltip` closure can capture `action` directly. The extra rebinding adds no value.","fix":"Drop the redundant binding and capture `action` directly. Before:\n```rust\nlet action_for_dispatch = action;\nIconButton::new(id, icon)\n    ...\n    .on_click({\n        let focus_handle = focus_handle.clone();\n        move |_, window, cx| {\n            if !focus_handle.is_focused(window) {\n                window.focus(&focus_handle, cx);\n            }\n            window.dispatch_action(action_for_dispatch.boxed_clone(), cx);\n        }\n    })\n```\nAfter:\n```rust\nIconButton::new(id, icon)\n    ...\n    .on_click({\n        let focus_handle = focus_handle.clone();\n        move |_, window, cx| {\n            if !focus_handle.is_focused(window) {\n                window.focus(&focus_handle, cx);\n            }\n            window.dispatch_action(action.boxed_clone(), cx);\n        }\n    })\n```","locations":[{"ref":"crates/agent_ui/src/conversation_view/thread_search_bar.rs:866-877","code":"  866 |     let action_for_dispatch = action;\n  867 |     IconButton::new(id, icon)\n  868 |         .shape(IconButtonShape::Square)\n  869 |         .disabled(disabled)\n  870 |         .on_click({\n  871 |             let focus_handle = focus_handle.clone();\n  872 |             move |_, window, cx| {\n  873 |                 if !focus_handle.is_focused(window) {\n  874 |                     window.focus(&focus_handle, cx);\n  875 |                 }\n  876 |                 window.dispatch_action(action_for_dispatch.boxed_clone(), cx);\n  877 |             }","lines":12,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/conversation_view/thread_search_bar.rs#L866-L877"}]},
{"id":"DEAD_21","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"In `LanguageModelPickerDelegate::confirm`, after invoking `on_model_changed`, the code reads the current selected index and immediately re-sets it to the same value, which is a no-op aside from an extra `cx.notify()`.","fix":"Remove the redundant re-selection.\n\nBefore:\n```rust\nlet current_index = self.selected_index;\nself.set_selected_index(current_index, window, cx);\n\ncx.emit(DismissEvent);\n```\n\nAfter:\n```rust\ncx.emit(DismissEvent);\n```","locations":[{"ref":"crates/agent_ui/src/language_model_selector.rs:489-490","code":"  489 |             let current_index = self.selected_index;\n  490 |             self.set_selected_index(current_index, window, cx);","lines":2,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/language_model_selector.rs#L489-L490"}]},
{"id":"DEAD_22","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"The `use std::{... usize};` import brings the deprecated `std::usize` primitive module into scope. The only usage is `usize::MAX` (line 486), which resolves to the primitive type's associated constant and does not require the import. The import is redundant and triggers a `deprecated` clippy/rustc warning.","fix":"Remove `usize` from the `use std::{...}` list. Change:\n```rust\nuse std::{\n    borrow::Cow,\n    path::{Path, PathBuf},\n    sync::Arc,\n    usize,\n};\n```\nto:\n```rust\nuse std::{\n    borrow::Cow,\n    path::{Path, PathBuf},\n    sync::Arc,\n};\n```","locations":[{"ref":"crates/debugger_ui/src/new_process_modal.rs:8","code":"    8 |     usize,","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/debugger_ui/src/new_process_modal.rs#L8"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"medium","difficulty":"easy","description":"The doc comment on `open_db` claims: \"This will retry a couple times if there are failures. If opening fails once, the db directory is moved to a backup folder and a new one is created.\" The implementation does neither - there is no retry loop and no move-to-backup logic. On failure it simply sets `ALL_FILE_DB_FAILED` and falls back to an in-memory DB via `open_fallback_db`. The comment describes behavior that no longer exists and misleads readers about corruption recovery.","fix":"Update the doc comment on `open_db` to match the real behavior: it attempts to open the file-backed DB once, and on failure sets `ALL_FILE_DB_FAILED` and returns a shared in-memory fallback DB. Remove the claims about retrying and moving the directory to a backup folder (or restore that logic if it is actually intended).","locations":[{"ref":"crates/db/src/db.rs:170","code":"  170 | /// Open or create a database at the given directory path.","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/db/src/db.rs#L170"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The doc comment on `Diff::buffer` states it returns \"the snapshot buffer (for finalized diffs)\". This is only true for the `Diff::finalized` constructor, which builds a fresh `Buffer::local(new_text)`. When a pending diff is finalized via `PendingDiff::finalize`, `FinalizedDiff.new_buffer` is set to `self.new_buffer.clone()`, i.e. the *live, still-mutable* buffer, not a frozen snapshot. So for that path `buffer()` returns a buffer that keeps changing while the multibuffer shows a frozen snapshot, contradicting the comment and diverging between the two finalized-diff paths.","fix":"Either store the frozen snapshot `buffer` (already built at lines 268-279) in `FinalizedDiff.new_buffer` so both paths are consistent, or correct the doc comment to say that for finalized-from-pending diffs `buffer()` returns the live buffer.","locations":[{"ref":"crates/acp_thread/src/diff.rs:139-145","code":"  139 |     /// Returns the buffer being edited (for pending diffs) or the snapshot buffer (for finalized diffs).\n  140 |     pub fn buffer(&self) -> &Entity<Buffer> {\n  141 |         match self {\n  142 |             Self::Pending(PendingDiff { new_buffer, .. }) => new_buffer,\n  143 |             Self::Finalized(FinalizedDiff { new_buffer, .. }) => new_buffer,\n  144 |         }\n  145 |     }","lines":7,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/acp_thread/src/diff.rs#L139-L145"},{"ref":"crates/acp_thread/src/diff.rs:312-318","code":"  312 |         FinalizedDiff {\n  313 |             path,\n  314 |             base_text: self.base_text.clone(),\n  315 |             multibuffer: self.multibuffer.clone(),\n  316 |             new_buffer: self.new_buffer.clone(),\n  317 |             _update_diff: update_diff,\n  318 |         }","lines":7,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/acp_thread/src/diff.rs#L312-L318"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The comment in `render_entries` claims two spaces of indentation per depth level (`\"\" for level 0, \"  \" for level 1, etc.`), but the loop pushes exactly one space per depth level, so level 1 is indented with a single space, not two. The comment describes behavior the code does not implement.","fix":"Either fix the comment to match the code:\n```rust\n// Indent based on depth (one space per level).\nfor _ in 0..item.depth {\n    output.push(' ');\n}\n```\nor, if two-space indentation was intended, push two spaces per level:\n```rust\nfor _ in 0..item.depth {\n    output.push_str(\"  \");\n}\n```","locations":[{"ref":"crates/agent/src/outline.rs:148-152","code":"  148 |         // Indent based on depth (\"\" for level 0, \"  \" for level 1, etc.)\n  149 |         for _ in 0..item.depth {\n  150 |             output.push(' ');\n  151 |         }\n  152 |         output.push_str(&item.text);","lines":5,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent/src/outline.rs#L148-L152"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment describing `scope_prefix` is attached to the wrong method. The long block\nstarting `Scope prefix used in the /<prefix>:<name> slash-command syntax ...` sits immediately\nabove `display_label` (its last two lines `Human-readable label for this source ...` are the\nonly ones that actually describe `display_label`), while `scope_prefix` itself has no doc\ncomment. A reader hovering `display_label` sees a description of a different method, and\n`scope_prefix` appears undocumented.","fix":"Move the `Scope prefix used in the /<prefix>:<name> ...` paragraph down so it documents\n`scope_prefix`, and leave only the `Human-readable label ...` lines above `display_label`:\n\n```rust\n    /// Human-readable label for this source, used in the UI to\n    /// distinguish skills from different origins.\n    pub fn display_label(&self) -> &str { ... }\n\n    /// Scope prefix used in the `/<prefix>:<name>` slash-command\n    /// syntax that the autocomplete popup inserts. ...\n    pub fn scope_prefix(&self) -> &str { ... }\n```","locations":[{"ref":"crates/agent_skills/agent_skills.rs:129-160","code":"  129 |     /// Scope prefix used in the `/<prefix>:<name>` slash-command\n  130 |     /// syntax that the autocomplete popup inserts. Global skills use\n  131 |     /// an empty prefix (so the inserted text is `/:<name>`), and\n  132 |     /// project-local skills use their worktree root name (so the\n  133 |     /// inserted text is `/<worktree>:<name>`).\n  134 |     ///\n  135 |     /// Using an empty prefix for globals rather than a literal\n  136 |     /// `global` means a worktree literally named `global` is no\n  137 |     /// longer ambiguous with the global source: the global skill is\n  138 |     /// invoked as `/:<name>`, and the worktree's skill is invoked as\n  139 |     /// `/global:<name>`. The two grammars never collide on the\n  140 |     /// inserted text.\n  141 |     /// Human-readable label for this source, used in the UI to\n  142 |     /// distinguish skills from different origins.\n  143 |     pub fn display_label(&self) -> &str {\n  144 |         match self {\n  145 |             Self::BuiltIn => \"built-in\",\n  146 |             Self::Global => \"global\",\n  147 |             Self::ProjectLocal {\n  148 |                 worktree_root_name, ..\n  149 |             } => worktree_root_name.as_ref(),\n  150 |         }\n  151 |     }\n  152 | \n  153 |     pub fn scope_prefix(&self) -> &str {\n  154 |         match self {\n  155 |             Self::BuiltIn | Self::Global => \"\",\n  156 |             Self::ProjectLocal {\n  157 |                 worktree_root_name, ..\n  158 |             } => worktree_root_name.as_ref(),\n  159 |         }\n  160 |     }","lines":32,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_skills/agent_skills.rs#L129-L160"}]},
{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The doc comment on `ThreadMetadataDb::list` claims `Only returns threads that have a session_id.`, but\n`LIST_QUERY` (lines 1479-1483) has no `WHERE` clause filtering on `session_id`\n(`SELECT ... FROM sidebar_threads ORDER BY updated_at DESC`). Drafts are deliberately persisted with\n`session_id = None` (see the `save` doc: `Drafts are persisted with session_id = None`), and the\n`Column for ThreadMetadata` impl loads `session_id` as `Option<...>`, so draft rows with a NULL\n`session_id` are returned by `list()` and cached (`cache_thread_metadata` explicitly handles the\ndraft case). The comment is therefore misleading and could lead a future reader to assume drafts are\nexcluded from `list()`.","fix":"Remove or correct the stale line. Replace:\n```\n    /// List all sidebar thread metadata, ordered by updated_at descending.\n    ///\n    /// Only returns threads that have a `session_id`.\n```\nwith:\n```\n    /// List all sidebar thread metadata, ordered by updated_at descending.\n    ///\n    /// Includes drafts (rows with a NULL `session_id`).\n```","locations":[{"ref":"crates/agent_ui/src/thread_metadata_store.rs:1487","code":" 1487 |     /// Only returns threads that have a `session_id`.","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/thread_metadata_store.rs#L1487"},{"ref":"crates/agent_ui/src/thread_metadata_store.rs:1479-1483","code":" 1479 |     const LIST_QUERY: &str = \"SELECT thread_id, session_id, agent_id, title, updated_at, \\\n 1480 |         created_at, interacted_at, folder_paths, folder_paths_order, archived, main_worktree_paths, \\\n 1481 |         main_worktree_paths_order, remote_connection, title_override \\\n 1482 |         FROM sidebar_threads \\\n 1483 |         ORDER BY updated_at DESC\";","lines":5,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/thread_metadata_store.rs#L1479-L1483"}]},
{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"The `SystemClock` trait's `utc_now` method is documented as returning \"the current date and time in UTC\", but it returns `std::time::Instant`. `Instant` is an opaque *monotonic* clock reading that has no relationship to wall-clock time and cannot represent a UTC date/time (it is explicitly not comparable across processes and has no calendar meaning). Both the method name `utc_now` and the doc comment are misleading: `RealSystemClock` returns `Instant::now()`, which is monotonic, not UTC. A caller trusting the comment could believe they can derive a calendar timestamp from the result.","fix":"Fix the comment (and ideally the method name) to describe what is actually returned, e.g. change\n```rust\npub trait SystemClock: Send + Sync {\n    /// Returns the current date and time in UTC.\n    fn utc_now(&self) -> Instant;\n}\n```\nto\n```rust\npub trait SystemClock: Send + Sync {\n    /// Returns the current monotonic instant.\n    fn now(&self) -> Instant;\n}\n```\nIf actual UTC wall-clock time is intended by callers, the return type should be changed to `chrono::DateTime<Utc>` (or similar) rather than `Instant`.","locations":[{"ref":"crates/clock/src/system_clock.rs:3-6","code":"    3 | pub trait SystemClock: Send + Sync {\n    4 |     /// Returns the current date and time in UTC.\n    5 |     fn utc_now(&self) -> Instant;\n    6 | }","lines":4,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/clock/src/system_clock.rs#L3-L6"}]},

{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"medium","difficulty":"medium","description":"`MentionSet::confirm_mention_for_uri` and the large `match mention_uri.clone()` block inside `MentionSet::confirm_mention_completion` are two nearly-identical dispatch tables over `MentionUri`, both routing `Fetch`/`Directory`/`Thread`/`File`/`Symbol`/`Skill`/`Diagnostics`/`GitDiff` to the same `confirm_mention_for_*` helpers. The only real difference is how the unsupported/`Selection` variants are handled (one returns `anyhow` errors, the other uses `debug_panic!`). Keeping two copies means any new `MentionUri` variant or change in resolution logic must be edited in both places, and they can drift (they already differ in `Selection` handling).","fix":"Factor the shared variant-to-helper routing into a single private method (e.g. `fn resolve_mention(&mut self, uri: MentionUri, supports_images: bool, http_client, cx) -> Task<Result<Mention>>`) and have both `confirm_mention_for_uri` and `confirm_mention_completion` call it, passing a flag or handling only the variant-specific error/`debug_panic!` cases at the call sites.","locations":[{"ref":"crates/agent_ui/src/mention_set.rs:130-174","code":"  130 |     pub fn confirm_mention_for_uri(\n  131 |         &mut self,\n  132 |         mention_uri: MentionUri,\n  133 |         supports_images: bool,\n  134 |         http_client: Arc<HttpClientWithUrl>,\n  135 |         cx: &mut Context<Self>,\n  136 |     ) -> Task<Result<Mention>> {\n  137 |         match mention_uri {\n  138 |             MentionUri::Fetch { url } => self.confirm_mention_for_fetch(url, http_client, cx),\n  139 |             MentionUri::Directory { .. } => Task::ready(Ok(Mention::Link)),\n  140 |             MentionUri::Thread { id, .. } => self.confirm_mention_for_thread(id, cx),\n  141 |             MentionUri::File { abs_path } => {\n  142 |                 self.confirm_mention_for_file(abs_path, supports_images, cx)\n  143 | {"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"very_easy","description":"`AgentMessage::to_markdown` uses `.unwrap()` on fallible operations, violating the\nrepo guideline against `unwrap()`:\n\n```rust\nserde_json::to_string_pretty(output).unwrap()\n...\n.unwrap();\n```\n\nIn practice neither panics (`serde_json::Value` always serializes, and `writeln!`\nto a `String` never returns `Err`), so this is not a live crash, but it is exactly\nthe pattern `CLAUDE.md` asks to avoid, and a future change to `output`'s type could\nmake it reachable.","fix":"Use the infallible/ignoring forms already used elsewhere in this function:\n\n```rust\nif let Some(output) = tool_result.output.as_ref() {\n    if let Ok(json) = serde_json::to_string_pretty(output) {\n        writeln!(markdown, \"**Debug Output**:\\n\\n```json\\n{json}\\n```\\n\").ok();\n    }\n}\n```","locations":[{"ref":"crates/agent/src/thread.rs:658-665","code":"  658 |             if let Some(output) = tool_result.output.as_ref() {\n  659 |                 writeln!(\n  660 |                     markdown,\n  661 |                     \"**Debug Output**:\\n\\n```json\\n{}\\n```\\n\",\n  662 |                     serde_json::to_string_pretty(output).unwrap()\n  663 |                 )\n  664 |                 .unwrap();\n  665 |             }","lines":8,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent/src/thread.rs#L658-L665"}]},

{"id":"ARCH_4","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"The `ConnectionGuard` / `MAX_CONCURRENT_CONNECTIONS` mechanism does not bound the number\nof live connections despite its name. In `handle_connection` the guard is dropped early,\nimmediately after `send_initial_client_update`:\n```rust\ndrop(connection_guard);\n```\nso the guard only limits connections that are still in their handshake phase, not\nestablished ones. A client can hold far more than `MAX_CONCURRENT_CONNECTIONS` (512) open\nconnections at once, so the intended DoS protection is much weaker than the constant name\nsuggests. Additionally, `try_acquire` does `fetch_add` first and only `fetch_sub`s on\nrejection, so the counter is transiently inflated while at capacity, which can spuriously\nreject other concurrent handshakes.","fix":"If the intent is to cap live connections, hold the `connection_guard` for the entire\nlifetime of the connection loop (move the `drop(connection_guard)` to after the loop /\ninto `connection_lost`) rather than dropping it right after the initial update. If the\nintent is only to throttle concurrent handshakes, rename the constant/guard to reflect\nthat (e.g. `MAX_CONCURRENT_HANDSHAKES`) so the protection is not misread. Consider a\ncompare-and-swap style acquire to avoid the transient over-count.","locations":[{"ref":"crates/collab/src/rpc.rs:83","code":"   83 | const MAX_CONCURRENT_CONNECTIONS: usize = 512;","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/collab/src/rpc.rs#L83"},{"ref":"crates/collab/src/rpc.rs:97-116","code":"   97 | impl ConnectionGuard {\n   98 |     pub fn try_acquire() -> Result<Self, ()> {\n   99 |         let current_connections = CONCURRENT_CONNECTIONS.fetch_add(1, SeqCst);\n  100 |         if current_connections >= MAX_CONCURRENT_CONNECTIONS {\n  101 |             CONCURRENT_CONNECTIONS.fetch_sub(1, SeqCst);\n  102 |             tracing::error!(\n  103 |                 \"too many concurrent connections: {}\",\n  104 |                 current_connections + 1\n  105 |             );\n  106 |             return Err(());\n  107 |         }\n  108 |         Ok(ConnectionGuard)\n  109 |     }\n  110 | }\n  111 | \n  112 | impl Drop for ConnectionGuard {\n  113 |     fn drop(&mut self) {\n  114 |         CONCURRENT_CONNECTIONS.fetch_sub(1, SeqCst);\n  115 |     }\n  116 | }","lines":20,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/collab/src/rpc.rs#L97-L116"},{"ref":"crates/collab/src/rpc.rs:950","code":"  950 |             drop(connection_guard);","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/collab/src/rpc.rs#L950"}]},
{"id":"ARCH_5","type":"architecture","type_label":"Architecture","severity":"negligible","difficulty":"easy","description":"The comma-joined name-list building via `iter().map(|name| name.as_ref()).fold(String::new(), |mut acc, s| { ... })` is copy-pasted verbatim three times (for `downloading`, `checking_for_update`, and `failed`). This is duplicated logic that could drift out of sync and is more error-prone than a single helper (or `itertools::join` / `slice::join`).","fix":"Extract a small helper such as `fn join_names(names: &[LanguageServerName]) -> String` (or use `names.iter().map(|n| n.as_ref()).collect::<Vec<_>>().join(\", \")`) and call it in all three places.","locations":[{"ref":"crates/activity_indicator/src/activity_indicator.rs:535-544","code":"  535 |                     downloading.iter().map(|name| name.as_ref()).fold(\n  536 |                         String::new(),\n  537 |                         |mut acc, s| {\n  538 |                             if !acc.is_empty() {\n  539 |                                 acc.push_str(\", \");\n  540 |                             }\n  541 |                             acc.push_str(s);\n  542 |                             acc\n  543 |                         }\n  544 |                     )","lines":10,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/activity_indicator/src/activity_indicator.rs#L535-L544"},{"ref":"crates/activity_indicator/src/activity_indicator.rs:560-569","code":"  560 |                     checking_for_update.iter().map(|name| name.as_ref()).fold(\n  561 |                         String::new(),\n  562 |                         |mut acc, s| {\n  563 |                             if !acc.is_empty() {\n  564 |                                 acc.push_str(\", \");\n  565 |                             }\n  566 |                             acc.push_str(s);\n  567 |                             acc\n  568 |                         }\n  569 |
