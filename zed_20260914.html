fd57a/crates/agent_settings/src/agent_profile.rs#L82-L89"},{"ref":"crates/agent_settings/src/agent_profile.rs:152-190","code":"  152 |     pub fn save_to_settings(\n  153 |         &self,\n  154 |         profile_id: AgentProfileId,\n  155 |         content: &mut SettingsContent,\n  156 |     ) -> Result<()> {\n  157 |         let profiles = content\n  158 |             .agent\n  159 |             .get_or_insert_default()\n  160 |             .profiles\n  161 |             .get_or_insert_default();\n  162 |         if profiles.contains_key(&profile_id.0) {\n  163 |             bail!(\"profile with ID '{profile_id}' already exists\");\n  164 |         }\n  165 | \n  166 |         profiles.insert(\n  167 |             profile_id.0,\n  168 |             AgentProfileContent {\n  169 |                 name: self.name.clone().into(),\n  170 |                 tools: self.tools.clone(),\n  171 |                 enable_all_context_servers: Some(self.enable_all_context_servers),\n  172 |                 context_servers: self\n  173 |                     .context_servers\n  174 |                     .clone()\n  175 |                     .into_iter()\n  176 |                     .map(|(server_id, preset)| {\n  177 |                         (\n  178 |                             server_id,\n  179 |                             ContextServerPresetContent {\n  180 |                                 tools: preset.tools,\n  181 |                             },\n  182 |                         )\n  183 |                     })\n  184 |                     .collect(),\n  185 |                 default_model: self.default_model.clone(),\n  186 |             },\n  187 |         );\n  188 | \n  189 |         Ok(())\n  190 |     }","lines":39,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_settings/src/agent_profile.rs#L152-L190"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"The asset worker performs `env.OPEN_SOURCE_WEBSITE_ASSETS_BUCKET.get(key)` and the fallback `fetch(...)` with no error handling. If the R2 binding throws (transient R2 error, throttling) or the fallback `fetch` to `zed.dev/404` fails, the exception propagates out of `fetch()` and Cloudflare returns a generic `1101`/`500` worker error with no controlled response. A `try/catch` returning a deterministic error response would give users meaningful feedback instead of an opaque worker exception page.","fix":"Wrap the body in a `try/catch` and return a controlled `502`/`500` response on failure, for example:\n```\ntry {\n  const object = await env.OPEN_SOURCE_WEBSITE_ASSETS_BUCKET.get(key);\n  // ... existing logic ...\n} catch (err) {\n  return new Response(\"Asset backend unavailable\", { status: 502 });\n}\n```","locations":[{"ref":".cloudflare/open-source-website-assets/src/worker.js:6-18","code":"    6 |     const object = await env.OPEN_SOURCE_WEBSITE_ASSETS_BUCKET.get(key);\n    7 |     if (!object) {\n    8 |       return await fetch(\"https://zed.dev/404\");\n    9 |     }\n   10 | \n   11 |     const headers = new Headers();\n   12 |     object.writeHttpMetadata(headers);\n   13 |     headers.set(\"etag\", object.httpEtag);\n   14 | \n   15 |     return new Response(object.body, {\n   16 |       headers,\n   17 |     });\n   18 |   },","lines":13,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/.cloudflare/open-source-website-assets/src/worker.js#L6-L18"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"The diff-building background tasks stored in `_update_diff` return `Result<()>` and propagate failures with `?` (e.g. `build_buffer_diff(...).await?`), but the task result is never awaited or inspected. If diff construction fails, the error is silently swallowed and the diff simply never populates, with no log entry to aid debugging.","fix":"Log failures inside the spawned task (e.g. wrap the fallible body and call `.log_err()` on the result), so a failed diff build is visible instead of vanishing.","locations":[{"ref":"crates/acp_thread/src/diff.rs:29-84","code":"   29 |         let task = cx.spawn({\n   30 |             let multibuffer = multibuffer.clone();\n   31 |             let path = path.clone();\n   32 |             let buffer = new_buffer.clone();\n   33 |             async move |_, cx| {\n   34 |                 let language = language_registry\n   35 |                     .load_language_for_file_path(Path::new(&path))\n   36 |                     .await\n   37 |                     .log_err();\n   38 | \n   39 |                 buffer.update(cx, |buffer, cx| buffer.set_language(language.clone(), cx));\n   40 |                 buffer.update(cx, |buffer, _| buffer.parsing_idle()).await;\n   41 | \n   42 |                 let diff = build_buffer_diff(\n   43 |                     old_text.unwrap_or(\"\".into()).into(),\n   44 |                     base_text_exists,\n   45 |                     &buffer,\n   46 |                     cx,\n   47 |                 )\n   48 |                 .await?;\n   49 | \n   50 |                 multibuffer.update(cx, |multibuffer, cx| {\n   51 |                     let hunk_ranges = {\n   52 |                         let buffer = buffer.read(cx);\n   53 |                         diff.read(cx)\n   54 |                             .snapshot(cx)\n   55 |                             .hunks_intersecting_range(\n   56 |                                 Anchor::min_for_buffer(buffer.remote_id())\n   57 |                                     ..Anchor::max_for_buffer(buffer.remote_id()),\n   58 |                                 buffer,\n   59 |                             )\n   60 |                             .map(|diff_hunk| diff_hunk.buffer_range.to_point(buffer))\n   61 |                             .collect::<Vec<_>>()\n   62 |                     };\n   63 | \n   64 |                     multibuffer.set_excerpts_for_path(\n   65 |                         PathKey::for_buffer(&buffer, cx),\n   66 |                         buffer.clone(),\n   67 |                         hunk_ranges,\n   68 |                         excerpt_context_lines(cx),\n   69 |                         cx,\n   70 |                     );\n   71 |                     multibuffer.add_diff(diff, cx);\n   72 |                 });\n   73 | \n   74 |                 anyhow::Ok(())\n   75 |             }\n   76 |         });\n   77 | \n   78 |         Self::Finalized(FinalizedDiff {\n   79 |             multibuffer,\n   80 |             path,\n   81 |             base_text,\n   82 |             new_buffer,\n   83 |             _update_diff: task,\n   84 |         })","lines":56,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/acp_thread/src/diff.rs#L29-L84"},{"ref":"crates/acp_thread/src/diff.rs:292-310","code":"  292 |         let update_diff = cx.spawn(async move |this, cx| {\n  293 |             let buffer_diff = buffer_diff.await?;\n  294 |             this.update(cx, |this, cx| {\n  295 |                 this.multibuffer().update(cx, |multibuffer, cx| {\n  296 |                     let path_key = PathKey::for_buffer(&buffer, cx);\n  297 |                     multibuffer.clear(cx);\n  298 |                     multibuffer.set_excerpts_for_path(\n  299 |                         path_key,\n  300 |                         buffer,\n  301 |                         ranges,\n  302 |                         excerpt_context_lines(cx),\n  303 |                         cx,\n  304 |                     );\n  305 |                     multibuffer.add_diff(buffer_diff.clone(), cx);\n  306 |                 });\n  307 | \n  308 |                 cx.notify();\n  309 |             })\n  310 |         });","lines":19,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/acp_thread/src/diff.rs#L292-L310"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`load_worktree_info_for_system_prompt` computes a `RulesLoadingError` whenever a worktree's\nrules file (`.rules`/`AGENTS.md`/etc.) fails to load, and returns it as the second tuple\nelement. But `build_project_context` discards it: the `.map(|(worktree, _rules_error)| ...)`\nthrows the error away with only a commented-out TODO. As a result, the entire\n`RulesLoadingError` path is dead - a user whose rules file fails to read gets no feedback,\nand the error value is computed only to be dropped. This is a silently-discarded fallible\nresult.","fix":"Surface the `RulesLoadingError` to the user instead of dropping it. Since\n`build_project_context` no longer has a `this` handle in that closure, either thread the\nerrors out of the returned `Task` tuple (alongside `ProjectContext`) so\n`maintain_project_context` can emit them, or emit them from within the task via a captured\n`WeakEntity<Self>` as the TODO suggests. Remove the commented-out block once implemented.","locations":[{"ref":"crates/agent/src/agent.rs:1225-1237","code":" 1225 |         cx.spawn(async move |_cx| {\n 1226 |             let worktrees = future::join_all(worktree_tasks).await;\n 1227 | \n 1228 |             let worktrees = worktrees\n 1229 |                 .into_iter()\n 1230 |                 .map(|(worktree, _rules_error)| {\n 1231 |                     // TODO: show error message\n 1232 |                     // if let Some(rules_error) = rules_error {\n 1233 |                     //     this.update(cx, |_, cx| cx.emit(rules_error)).ok();\n 1234 |                     // }\n 1235 |                     worktree\n 1236 |                 })\n 1237 |                 .collect::<Vec<_>>();","lines":13,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent/src/agent.rs#L1225-L1237"},{"ref":"crates/agent/src/agent.rs:1279-1317","code":" 1279 |     fn load_worktree_info_for_system_prompt(\n 1280 |         worktree: Entity<Worktree>,\n 1281 |         project: Entity<Project>,\n 1282 |         cx: &mut App,\n 1283 |     ) -> Task<(WorktreeContext, Option<RulesLoadingError>)> {\n 1284 |         let tree = worktree.read(cx);\n 1285 |         let root_name = tree.root_name_str().into();\n 1286 |         let abs_path = tree.abs_path();\n 1287 |         let scan_complete = tree.as_local().map(|local| local.scan_complete());\n 1288 | \n 1289 |         let mut context = WorktreeContext {\n 1290 |             root_name,\n 1291 |             abs_path,\n 1292 |             rules_file: None,\n 1293 |         };\n 1294 | \n 1295 |         cx.spawn(async move |cx| {\n 1296 |             if let Some(scan_complete) = scan_complete {\n 1297 |                 scan_complete.await;\n 1298 |             }\n 1299 | \n 1300 |             let rules_task = cx.update(|cx| Self::load_worktree_rules_file(worktree, project, cx));\n 1301 | \n 1302 |             let (rules_file, rules_file_error) = match rules_task {\n 1303 |                 Some(rules_task) => match rules_task.await {\n 1304 |                     Ok(rules_file) => (Some(rules_file), None),\n 1305 |                     Err(err) => (\n 1306 |                         None,\n 1307 |                         Some(RulesLoadingError {\n 1308 |                             message: format!(\"{err}\").into(),\n 1309 |                         }),\n 1310 |                     ),\n 1311 |                 },\n 1312 |                 None => (None, None),\n 1313 |             };\n 1314 |             context.rules_file = rules_file;\n 1315 |             (context, rules_file_error)\n 1316 |         })\n 1317 |     }","lines":39,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent/src/agent.rs#L1279-L1317"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`Templates::new` calls `.unwrap()` on `register_embed_templates::<Assets>()`. With `set_strict_mode(true)`, any handlebars parse error in an embedded `*.hbs` template panics at runtime (the function is called on every `NativeAgentServer::connect`). Although the templates are compiled-in assets, the project guidelines forbid `unwrap()` on fallible operations; a template edit that introduces a syntax error would crash the agent connection instead of surfacing a handled error. `Templates::new` also already returns `Arc<Self>` from an infallible signature, so the failure has nowhere to go.","fix":"Return a `Result` from `Templates::new` and propagate the registration error so the connect path can report it, e.g.:\n```rust\npub fn new() -> Result<Arc<Self>> {\n    let mut handlebars = Handlebars::new();\n    handlebars.set_strict_mode(true);\n    handlebars.register_helper(\"contains\", Box::new(contains));\n    handlebars.register_embed_templates::<Assets>()?;\n    Ok(Arc::new(Self(handlebars)))\n}\n```\nand handle the `Result` at the call site in `native_agent_server.rs`.","locations":[{"ref":"crates/agent/src/templates.rs:19-25","code":"   19 |     pub fn new() -> Arc<Self> {\n   20 |         let mut handlebars = Handlebars::new();\n   21 |         handlebars.set_strict_mode(true);\n   22 |         handlebars.register_helper(\"contains\", Box::new(contains));\n   23 |         handlebars.register_embed_templates::<Assets>().unwrap();\n   24 |         Arc::new(Self(handlebars))\n   25 |     }","lines":7,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent/src/templates.rs#L19-L25"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"In `ApplyCodeActionTool::run`, the per-file `writeln!` into the output string discards its `Result` with `.ok()`. Writing to a `String` never fails, so this is harmless, but the `.ok()` masks the intent and is inconsistent with the rest of the codebase. More notably, the enclosing `buffer.read_with(cx, ...)` result is used purely for its side effect of appending to `output`; if the entity read were ever fallible in this context the appended line would be silently skipped without any log. This is a readability/robustness nit rather than a live bug.","fix":"Drop the `.ok()` on the infallible `String` write (it can never error):\n```rust\nwriteln!(output, \"- {path}\").ok();\n```\nbecomes\n```rust\nlet _ = writeln!(output, \"- {path}\");\n```\nor better, since writes to `String` are infallible, use `write!`-into-`String` helpers, and `log_err()` the `read_with` if it can fail so a dropped file line is at least visible.","locations":[{"ref":"crates/agent/src/tools/apply_code_action_tool.rs:132-140","code":"  132 |             for (buffer, _) in &transaction.0 {\n  133 |                 buffer.read_with(cx, |buffer, cx| {\n  134 |                     let path = buffer\n  135 |                         .file()\n  136 |                         .map(|f| f.full_path(cx).display().to_string())\n  137 |                         .unwrap_or_else(|| \"<untitled>\".to_string());\n  138 |                     writeln!(output, \"- {path}\").ok();\n  139 |                 });\n  140 |             }","lines":9,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent/src/tools/apply_code_action_tool.rs#L132-L140"}]},
{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"`FetchTool::fetch_step` only treats HTTP client errors (`4xx`) as failures via `status.is_client_error()`. Server errors (`5xx`) fall straight through to the body-parsing path, so a `500`/`502`/`503` response's error page (often an HTML or JSON error document) is converted to Markdown and returned to the model as if it were the requested content, with no indication that the fetch failed. The redirect (`3xx`) and success (`2xx`) cases are handled, but the `5xx` range is not.","fix":"Treat server errors as errors too:\n\nBefore:\n```rust\nif status.is_client_error() {\n    let text = String::from_utf8_lossy(body.as_slice());\n    bail!(\"status error {}, response: {text:?}\", status.as_u16());\n}\n```\n\nAfter:\n```rust\nif status.is_client_error() || status.is_server_error() {\n    let text = String::from_utf8_lossy(body.as_slice());\n    bail!(\"status error {}, response: {text:?}\", status.as_u16());\n}\n```","locations":[{"ref":"crates/agent/src/tools/fetch_tool.rs:113-116","code":"  113 |         if status.is_client_error() {\n  114 |             let text = String::from_utf8_lossy(body.as_slice());\n  115 |             bail!(\"status error {}, response: {text:?}\", status.as_u16());\n  116 |         }","lines":4,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent/src/tools/fetch_tool.rs#L113-L116"}]},
{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"In `refresh_skills`, the `AsyncApp::update` call inside the spawned task silently discards its `Result`. `cx.update(...)` returns a `Result` (it fails if the app is gone), and here the value is dropped as a bare statement rather than propagated or logged. This violates the project rule against silently discarding errors on fallible operations: if the update fails the caller gets no visibility, and the surrounding task's `-> Result<()>` return type is not leveraged.","fix":"Propagate the error with `?` so it flows through the task's `Result` (or use `.log_err()`):\n```rust\ncx.update(|cx| native_connection.refresh_skills_for_project(project, cx))?;\n```\ninstead of:\n```rust\ncx.update(|cx| native_connection.refresh_skills_for_project(project, cx));\n```","locations":[{"ref":"crates/agent_ui/src/agent_panel.rs:3578-3588","code":" 3578 |         cx.spawn(async move |_this, cx| -> Result<()> {\n 3579 |             let connected = connect_task.await?;\n 3580 |             if let Some(native_connection) = connected\n 3581 |                 .connection\n 3582 |                 .downcast::<agent::NativeAgentConnection>()\n 3583 |             {\n 3584 |                 cx.update(|cx| native_connection.refresh_skills_for_project(project, cx));\n 3585 |             }\n 3586 |             Ok(())\n 3587 |         })\n 3588 |         .detach_and_log_err(cx);","lines":11,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/agent_panel.rs#L3578-L3588"}]},
{"id":"ERR_9","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `open_abs_path_at_point`, the final `editor.update_in(...)` result is silently discarded with `.ok()`. Per the project guideline against silently dropping fallible results, an entity that has gone away here (the only error path) will be swallowed without any visibility. The surrounding task is already wrapped in `detach_and_log_err`, so propagating with `?` would surface the failure while keeping the same best-effort behavior for the caller.","fix":"Either propagate the error so it is logged by `detach_and_log_err`, e.g. change `.ok();` to `?;` on the `editor.update_in(...)` call, or if a failed cursor move should genuinely be ignored, use `.log_err();` instead of `.ok();` so the failure remains visible.","locations":[{"ref":"crates/agent_ui/src/agent_ui.rs:171-181","code":"  171 |             editor\n  172 |                 .update_in(cx, |editor, window, cx| {\n  173 |                     editor.change_selections(\n  174 |                         SelectionEffects::scroll(Autoscroll::center()),\n  175 |                         window,\n  176 |                         cx,\n  177 |                         |selections| selections.select_ranges([point..point]),\n  178 |                     );\n  179 |                 })\n  180 |                 .ok();\n  181 |             anyhow::Ok(())","lines":11,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/agent_ui.rs#L171-L181"}]},
{"id":"ERR_10","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"Several async cleanup steps discard their `Result` with `let _ = cx.update(...)` / `let _ = this.update(...)` instead of `.ok()`/`.log_err()`. The repo guideline explicitly calls out avoiding `let _ =` on fallible operations. The most user-visible one is in `send_impl`: `let _ = cx.update(|window, cx| { message_editor.update(cx, |message_editor, cx| { message_editor.clear(window, cx); }); });` — if this update fails, the message editor is silently not cleared after send and the failure is swallowed.","fix":"Replace `let _ = cx.update(...)` / `let _ = this.update(...)` with `.ok()` (matching the surrounding style, e.g. the `.ok()` used at line 1798) or `.log_err()` so the failure is at least visible, rather than silently dropped with `let _ =`.","locations":[{"ref":"crates/agent_ui/src/conversation_view/thread_view.rs:1646-1650","code":" 1646 |             let _ = cx.update(|window, cx| {\n 1647 |                 message_editor.update(cx, |message_editor, cx| {\n 1648 |                     message_editor.clear(window, cx);\n 1649 |                 });\n 1650 |             });","lines":5,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/conversation_view/thread_view.rs#L1646-L1650"},{"ref":"crates/agent_ui/src/conversation_view/thread_view.rs:1070","code":" 1070 |                     let _ = thread_view.update(cx, |this, cx| {","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/conversation_view/thread_view.rs#L1070"},{"ref":"crates/agent_ui/src/conversation_view/thread_view.rs:1700","code":" 1700 |             let _ = this.update(cx, |this, cx| {","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/conversation_view/thread_view.rs#L1700"},{"ref":"crates/agent_ui/src/conversation_view/thread_view.rs:1763","code":" 1763 |             let _ = this.update(cx, |this, cx| {","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/conversation_view/thread_view.rs#L1763"}]},
{"id":"ERR_11","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"In `migrate_thread_metadata`, the result of `store.update(...)` is silently discarded with\n`let _ = ...`. Because `store` is an `Entity` used through an `AsyncApp`, `update` returns an\n`anyhow::Result`, and the project guidelines explicitly forbid `let _ =` on fallible operations\n(`Never silently discard errors with let _ =`). Every other call site in this file handles the same\npattern (`reload` uses `.ok()` at line 682; `migrate_thread_remote_connections` binds the result at\nline 259), so this line is both an inconsistency and a guideline violation. If the entity has been\ndropped the reload silently fails to run with no visibility.","fix":"Replace:\n```\n        let _ = store.update(cx, |store, cx| store.reload(cx));\n```\nwith:\n```\n        store.update(cx, |store, cx| store.reload(cx)).ok();\n```\n(or `.log_err()` to surface the failure).","locations":[{"ref":"crates/agent_ui/src/thread_metadata_store.rs:187","code":"  187 |         let _ = store.update(cx, |store, cx| store.reload(cx));","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/thread_metadata_store.rs#L187"}]},
{"id":"ERR_12","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In `perform_update`, after a job's `apply` succeeds the code does `unsafe { PostMessageW(hwnd, WM_JOB_UPDATED, WPARAM(0), LPARAM(0))? }` at `crates/auto_update_helper/src/updater.rs:385`. The `?` returns early from `perform_update` on a `PostMessageW` failure, bypassing the rollback loop below entirely. If posting the progress message ever fails mid-update, the partially applied file moves (already-renamed `Zed.exe`, `bin\\Zed.exe`, etc.) are left in place with no rollback, leaving the installation in an inconsistent state.","fix":"Do not abort the update on a progress-notification failure. Log and ignore the `PostMessageW` result (the dialog is cosmetic) rather than propagating it with `?`, e.g. `let _ = unsafe { PostMessageW(hwnd, WM_JOB_UPDATED, WPARAM(0), LPARAM(0)) };` with a `.log_err()`-style note.","locations":[{"ref":"crates/auto_update_helper/src/updater.rs:394-399","code":"  394 |             match (job.apply)(app_dir) {\n  395 |                 Ok(_) => {\n  396 |                     last_successful_job = Some(i);\n  397 |                     unsafe { PostMessageW(hwnd, WM_JOB_UPDATED, WPARAM(0), LPARAM(0))? };\n  398 |                     break;\n  399 |                 }","lines":6,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/auto_update_helper/src/updater.rs#L394-L399"}]},
{"id":"ERR_13","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`ChannelStore::handle_update_channels` calls `self.update_channels_tx.unbounded_send(message.payload).unwrap()`.\nIf the receiving `_update_channels` task has terminated (e.g. its `maybe!` future returned early), the\nunbounded channel is closed and `unbounded_send` returns `Err`, panicking the RPC message handler.\nAdditionally the surrounding `this.read_with(&cx, ...)` return value is discarded, so a dropped entity\nis silently ignored rather than propagated. Prefer logging over panicking on a send failure.","fix":"Replace the `.unwrap()` with error logging, and propagate the `read_with` result:\n```rust\nthis.read_with(&cx, |this, _| {\n    this.update_channels_tx.unbounded_send(message.payload).log_err();\n})?;\n```","locations":[{"ref":"crates/channel/src/channel_store.rs:837-848","code":"  837 |     async fn handle_update_channels(\n  838 |         this: Entity<Self>,\n  839 |         message: TypedEnvelope<proto::UpdateChannels>,\n  840 |         cx: AsyncApp,\n  841 |     ) -> Result<()> {\n  842 |         this.read_with(&cx, |this, _| {\n  843 |             this.update_channels_tx\n  844 |                 .unbounded_send(message.payload)\n  845 |                 .unwrap();\n  846 |         });\n  847 |         Ok(())\n  848 |     }","lines":12,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/channel/src/channel_store.rs#L837-L848"}]},
{"id":"ERR_14","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In the authentication middleware `validate_header`, the optional `http_client` field of `AppState` is unwrapped with `.expect(\"no HTTP client\")`. This runs on every authenticated request, so if a `collab` instance is ever started with `http_client` set to `None`, the middleware panics inside the request handler instead of returning an error response. Panicking in a request path is worse than a clean `500`: it aborts the task and produces no controlled response. The same function also uses `req.extensions().get::<Arc<AppState>>().unwrap()` on line 30.","fix":"Return a proper error instead of panicking, e.g. replace\n```rust\nlet http_client = state.http_client.clone().expect(\"no HTTP client\");\n```\nwith\n```rust\nlet http_client = state.http_client.clone().ok_or_else(|| {\n    Error::http(\n        StatusCode::INTERNAL_SERVER_ERROR,\n        \"authentication is not available\".to_string(),\n    )\n})?;\n```","locations":[{"ref":"crates/collab/src/auth.rs:54","code":"   54 |     let http_client = state.http_client.clone().expect(\"no HTTP client\");","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/collab/src/auth.rs#L54"}]},
{"id":"ERR_15","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`request_with` and `notify` serialize outgoing JSON-RPC messages with `serde_json::to_string(...).unwrap()`. `params` is a generic `impl Serialize`, so a serializer that returns an error (or a type whose `Serialize` impl can fail, e.g. a map with non-string keys) would panic instead of surfacing a recoverable error. The project guidelines explicitly discourage `unwrap()` on fallible operations.","fix":"Propagate the serialization error with `?` (both functions already return `Result`), e.g. `let request = serde_json::to_string(&Request { ... })?;` and `let notification = serde_json::to_string(&Notification { ... })?;`.","locations":[{"ref":"crates/context_server/src/client.rs:404","code":"  404 |         .unwrap();","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/context_server/src/client.rs#L404"},{"ref":"crates/context_server/src/client.rs:496","code":"  496 |         .unwrap();","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/context_server/src/client.rs#L496"}]},
{"id":"ERR_16","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"negligible","difficulty":"very_easy","description":"`AcpDebugLog::trailing_stderr` handles a poisoned mutex differently from every other\nlock site in the type. `record_message` and `subscribe` recover with\n`.lock().unwrap_or_else(|poisoned| poisoned.into_inner())`, but `trailing_stderr` uses\n`self.state.lock().ok()?`, which silently returns `None` on poisoning. `trailing_stderr`\nfeeds `LoadError::Exited { stderr, .. }`, so if the lock were ever poisoned the crash\ndiagnostics (the agent's stderr) would be dropped exactly when they matter most. In\npractice no lock site panics while holding the lock, so poisoning cannot currently occur;\nthe issue is the inconsistency, which is a trap for future edits.","fix":"Use the same poison-recovery pattern as the other methods:\n```rust\nlet state = self\n    .state\n    .lock()\n    .unwrap_or_else(|poisoned| poisoned.into_inner());\n```\ninstead of:\n```rust\nlet state = self.state.lock().ok()?;\n```","locations":[{"ref":"crates/agent_servers/src/acp.rs:219-221","code":"  219 |     fn trailing_stderr(&self) -> Option<String> {\n  220 |         let state = self.state.lock().ok()?;\n  221 |         let mut lines = state","lines":3,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_servers/src/acp.rs#L219-L221"},{"ref":"crates/agent_servers/src/acp.rs:182-185","code":"  182 |         let mut state = self\n  183 |             .state\n  184 |             .lock()\n  185 |             .unwrap_or_else(|poisoned| poisoned.into_inner());","lines":4,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_servers/src/acp.rs#L182-L185"},{"ref":"crates/agent_servers/src/acp.rs:182-185","code":"  182 |         let mut state = self\n  183 |             .state\n  184 |             .lock()\n  185 |             .unwrap_or_else(|poisoned| poisoned.into_inner());","lines":4,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_servers/src/acp.rs#L182-L185"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"`Copilot::shutdown_language_server` (registered via `cx.on_app_quit`) never drives the actual language-server shutdown future to completion. `LanguageServer::shutdown()` returns `Option<impl Future<Output = Option<()>>>`; that inner future is what waits for the server's shutdown response and then sends the `Exit` notification and closes the IO channels. Here the call is wrapped in an extra `async move { server.lsp.shutdown() }` block:\n\n```rust\nlet shutdown = match mem::replace(&mut self.server, CopilotServer::Disabled) {\n    CopilotServer::Running(server) => Some(Box::pin(async move { server.lsp.shutdown() })),\n    _ => None,\n};\n\nasync move {\n    if let Some(shutdown) = shutdown {\n        shutdown.await;\n    }\n}\n```\n\nAwaiting the outer block yields the `Option<Future>` from `shutdown()` and immediately drops it, so the real shutdown/`Exit`/channel-cleanup future is discarded and never awaited. The `on_app_quit` handler therefore returns essentially instantly and Zed does not gracefully shut down the Copilot LSP on quit. Compare with the correct pattern used in the `SettingsStore` observer in `Copilot::new` (which binds `let shutdown_future = server.lsp.shutdown();` and then `if let Some(fut) = shutdown_future { fut.await; }`).","fix":"Call `server.lsp.shutdown()` directly (its synchronous part enqueues the request) and await the returned future, mirroring the settings-observer path:\n\n```rust\nlet shutdown = match mem::replace(&mut self.server, CopilotServer::Disabled) {\n    CopilotServer::Running(server) => server.lsp.shutdown(),\n    _ => None,\n};\n\nasync move {\n    if let Some(shutdown) = shutdown {\n        shutdown.await;\n    }\n}\n```","locations":[{"ref":"crates/copilot/src/copilot.rs:426","code":"  426 |     fn shutdown_language_server(","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/copilot/src/copilot.rs#L426"},{"ref":"crates/copilot/src/copilot.rs:431","code":"  431 |             CopilotServer::Running(server) => Some(Box::pin(async move { server.lsp.shutdown() })),","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/copilot/src/copilot.rs#L431"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"very_easy","description":"`update_followers` acquires the database lock directly with `session.db.lock().await`\ninstead of the `Session::db()` helper used by every other handler. `Session::db()` wraps\nthe lock with `tokio::task::yield_now().await` calls under `#[cfg(feature = \"test-support\")]`\nthat deterministically interleave tasks during tests. Bypassing it makes this handler's\nlocking behavior inconsistent with the rest of the file and can hide ordering/interleaving\nbugs from the collab test suite.","fix":"Before:\n```rust\nlet database = session.db.lock().await;\n```\nAfter:\n```rust\nlet database = session.db().await;\n```","locations":[{"ref":"crates/collab/src/rpc.rs:2689","code":" 2689 |     let database = session.db.lock().await;","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/collab/src/rpc.rs#L2689"}]},
{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"negligible","difficulty":"easy","description":"`ListDirectoryTool` uses `.unwrap()` on the `writeln!` calls that build the output string (`writeln!(output, ...).unwrap()`), both in `list_global_skill_directory` and `build_directory_output`. Writing to a `String` is infallible so these cannot actually panic, but the project guidelines call for avoiding `unwrap()`, and every other tool in this directory (e.g. `grep_tool.rs`, `find_path_tool.rs`) consistently uses `.ok()` for the identical pattern. This is an inconsistency worth aligning rather than a live bug.","fix":"Replace the infallible-write `.unwrap()`s with `.ok()` to match the rest of the tools, e.g.:\n\nBefore:\n```rust\nwriteln!(output, \"# Folders:\\n{}\", folders.join(\"\\n\")).unwrap();\n```\n\nAfter:\n```rust\nwriteln!(output, \"# Folders:\\n{}\", folders.join(\"\\n\")).ok();\n```","locations":[{"ref":"crates/agent/src/tools/list_directory_tool.rs:99-105","code":"   99 |             writeln!(output, \"# Folders:\\n{}\", folders.join(\"\\n\")).unwrap();\n  100 |         }\n  101 |         if !files.is_empty() {\n  102 |             writeln!(output, \"\\n# Files:\\n{}\", files.join(\"\\n\")).unwrap();\n  103 |         }\n  104 |         if output.is_empty() {\n  105 |             writeln!(output, \"{input_path} is empty.\").unwrap();","lines":7,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent/src/tools/list_directory_tool.rs#L99-L105"},{"ref":"crates/agent/src/tools/list_directory_tool.rs:166-174","code":"  166 |             writeln!(output, \"# Folders:\\n{}\", folders.join(\"\\n\")).unwrap();\n  167 |         }\n  168 | \n  169 |         if !files.is_empty() {\n  170 |             writeln!(output, \"\\n# Files:\\n{}\", files.join(\"\\n\")).unwrap();\n  171 |         }\n  172 | \n  173 |         if output.is_empty() {\n  174 |             writeln!(output, \"{input_path} is empty.\").unwrap();","lines":9,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent/src/tools/list_directory_tool.rs#L166-L174"}]},
{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"negligible","difficulty":"very_easy","description":"`AgentSettings::set_message_editor_max_lines` is a pure getter (returns\n`self.message_editor_min_lines * 2`) but its name uses the `set_` prefix, which conventionally\ndenotes a mutating setter. The misleading name invites callers to expect a side effect.","fix":"Rename it to reflect that it computes a value, e.g.:\n\n```rust\npub fn message_editor_max_lines(&self) -> usize {\n    self.message_editor_min_lines * 2\n}\n```","locations":[{"ref":"crates/agent_settings/src/agent_settings.rs:278-280","code":"  278 |     pub fn set_message_editor_max_lines(&self) -> usize {\n  279 |         self.message_editor_min_lines * 2\n  280 |     }","lines":3,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_settings/src/agent_settings.rs#L278-L280"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`AcpTools::render` calls `self.serialize_observed_messages().unwrap_or_default()` on *every* frame, and `serialize_observed_messages` walks the entire message log, builds a `serde_json::Value` per message and runs `serde_json::to_string_pretty` over the whole collection. This pretty-printed JSON blob is only ever needed when the user clicks the `CopyButton`, yet it is recomputed on each render (including hover redraws, scroll, etc.). With a long ACP session the log can contain thousands of messages, so serializing all of them every frame is a real per-frame cost.","fix":"Compute the serialized string lazily only when the copy action fires (e.g. give `CopyButton` a closure/`on_click` that calls `serialize_observed_messages`), or cache the serialized value and invalidate it when `messages` changes, instead of recomputing it in `render`.","locations":[{"ref":"crates/acp_tools/src/acp_tools.rs:696-705","code":"  696 | impl Render for AcpTools {\n  697 |     fn render(&mut self, window: &mut Window, cx: &mut Context<Self>) -> impl IntoElement {\n  698 |         let has_messages = self\n  699 |             .selected_watched_connection()\n  700 |             .is_some_and(|connection| !connection.messages.is_empty());\n  701 |         let can_restart = matches!(\n  702 |             self.selected_connection_status(cx),\n  703 |             Some(status) if status != AgentConnectionStatus::Connecting\n  704 |         );\n  705 |         let copied_messages = self.serialize_observed_messages().unwrap_or_default();","lines":10,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/acp_tools/src/acp_tools.rs#L696-L705"},{"ref":"crates/acp_tools/src/acp_tools.rs:344-371","code":"  344 |     fn serialize_observed_messages(&self) -> Option<String> {\n  345 |         let connection = self.selected_watched_connection()?;\n  346 | \n  347 |         let messages: Vec<serde_json::Value> = connection\n  348 |             .messages\n  349 |             .iter()\n  350 |             .filter_map(|message| {\n  351 |                 let params = match &message.params {\n  352 |                     Ok(Some(params)) => params.clone(),\n  353 |                     Ok(None) => serde_json::Value::Null,\n  354 |                     Err(err) => serde_json::to_value(err).ok()?,\n  355 |                 };\n  356 |                 Some(serde_json::json!({\n  357 |                     \"_direction\": match message.direction {\n  358 |                         AcpDebugMessageDirection::Incoming => \"incoming\",\n  359 |                         AcpDebugMessageDirection::Outgoing => \"outgoing\",\n  360 |                         AcpDebugMessageDirection::Stderr => \"stderr\",\n  361 |                     },\n  362 |                     \"_type\": message.message_type.to_string().to_lowercase(),\n  363 |                     \"id\": message.request_id,\n  364 |                     \"method\": message.name.to_string(),\n  365 |                     \"params\": params,\n  366 |                 }))\n  367 |             })\n  368 |             .collect();\n  369 | \n  370 |         serde_json::to_string_pretty(&messages).ok()\n  371 |     }","lines":28,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/acp_tools/src/acp_tools.rs#L344-L371"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"medium","difficulty":"easy","description":"`import_threads_from_other_channels_in` performs blocking SQLite I/O on the\nforeground (UI) thread. The task is created with `cx.spawn(async move |_this, cx| ...)`\n(foreground executor), and inside the loop it calls `read_threads_from_channel(&database_dir, *channel)`\nsynchronously for every release channel. `read_threads_from_channel` opens a SQLite\ndatabase file (`sqlez::connection::Connection::open_file`) and runs a query, all\nwithout yielding to a background thread. This blocks the UI while several channel\ndatabases are opened and read. Compare with the sibling function `channels_with_threads`\nin the same file, which correctly wraps the equivalent DB probing in `cx.background_spawn`.","fix":"Move the blocking DB reads off the foreground thread. Read the threads inside a\n`cx.background_spawn(...)` block and only hop back to the foreground (via `cx.update`)\nto write them into the store and show the toast. For example, gather\n`imported_threads` inside `cx.background_spawn(async move { ... })`, `await` it, then\ncall `cx.update(|cx| { ThreadMetadataStore::global(cx).update(...); show_cross_channel_import_toast(...) })`.","locations":[{"ref":"crates/agent_ui/src/thread_import.rs:909","code":"  909 |     cx.spawn(async move |_this, cx| {","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/thread_import.rs#L909"},{"ref":"crates/agent_ui/src/thread_import.rs:917","code":"  917 |             match read_threads_from_channel(&database_dir, *channel) {","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/thread_import.rs#L917"},{"ref":"crates/agent_ui/src/thread_import.rs:946","code":"  946 | fn read_threads_from_channel(","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/thread_import.rs#L946"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"medium","difficulty":"easy","description":"In `Telemetry::new`, the expensive `os_version()` call and the state mutation are executed\n*eagerly* in the block that builds the future passed to `cx.background_spawn`, not inside the\n`async move` body. Because `let os_version = os_version();` and `state.lock().os_version = Some(os_version);`\nsit above `async move { ... }`, they run synchronously on the calling (foreground) thread when\n`Telemetry::new` is invoked. `os_version()` is explicitly documented as `Note: This might do\nblocking IO! Only call from background threads` (it reads `/etc/os-release` on Linux/FreeBSD and\nqueries `NSProcessInfo` on macOS), so this performs blocking IO on the main thread during startup.\nThe clear intent was to run it on the background executor.","fix":"Move the blocking work inside the `async move` block so it runs on the background executor:\n```rust\ncx.background_spawn({\n    let state = state.clone();\n    async move {\n        let os_version = os_version();\n        state.lock().os_version = Some(os_version);\n        if let Ok(tempfile) = File::create(Self::log_file_path()) {\n            state.lock().log_file = Some(tempfile);\n        }\n    }\n})\n.detach();\n```","locations":[{"ref":"crates/client/src/telemetry.rs:214-224","code":"  214 |         cx.background_spawn({\n  215 |             let state = state.clone();\n  216 |             let os_version = os_version();\n  217 |             state.lock().os_version = Some(os_version);\n  218 |             async move {\n  219 |                 if let Some(tempfile) = File::create(Self::log_file_path()).ok() {\n  220 |                     state.lock().log_file = Some(tempfile);\n  221 |                 }\n  222 |             }\n  223 |         })\n  224 |         .detach();","lines":11,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/client/src/telemetry.rs#L214-L224"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"The asset worker sets an `etag` header (`headers.set(\"etag\", object.httpEtag)`) but never honors the client's conditional-request headers. Because `env...BUCKET.get(key)` is always called without an `onlyIf` option and the response is always built from `object.body`, a client that sends `If-None-Match` still receives the full object body with a `200` instead of a `304 Not Modified`. This wastes bandwidth and subrequest work on every repeat fetch even though the ETag machinery is already half-wired.","fix":"Pass the request's conditional headers to R2 and return `304` when the object is unmodified, e.g.:\n```\nconst object = await env.OPEN_SOURCE_WEBSITE_ASSETS_BUCKET.get(key, {\n  onlyIf: request.headers,\n});\nif (!object) { /* ... existing 404 handling ... */ }\n\nconst headers = new Headers();\nobject.writeHttpMetadata(headers);\nheaders.set(\"etag\", object.httpEtag);\n\n// R2 returns an object without a `body` when the precondition fails.\nif (!(\"body\" in object) || object.body === undefined) {\n  return new Response(null, { status: 304, headers });\n}\nreturn new Response(object.body, { headers });\n```","locations":[{"ref":".cloudflare/open-source-website-assets/src/worker.js:6-17","code":"    6 |     const object = await env.OPEN_SOURCE_WEBSITE_ASSETS_BUCKET.get(key);\n    7 |     if (!object) {\n    8 |       return await fetch(\"https://zed.dev/404\");\n    9 |     }\n   10 | \n   11 |     const headers = new Headers();\n   12 |     object.writeHttpMetadata(headers);\n   13 |     headers.set(\"etag\", object.httpEtag);\n   14 | \n   15 |     return new Response(object.body, {\n   16 |       headers,\n   17 |     });","lines":12,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/.cloudflare/open-source-website-assets/src/worker.js#L6-L17"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`progress.title.clone().unwrap_or(progress_token.to_string())` eagerly calls `progress_token.to_string()` on every render even when `title` is `Some`, allocating a `String` that is immediately discarded. `unwrap_or` evaluates its argument unconditionally; `unwrap_or_else` should be used so the fallback allocation only happens when `title` is `None`.","fix":"Use the lazy variant:\n```rust\nlet mut message = progress\n    .title\n    .clone()\n    .unwrap_or_else(|| progress_token.to_string());\n```","locations":[{"ref":"crates/activity_indicator/src/activity_indicator.rs:416","code":"  416 |                 let mut message = progress.title.clone().unwrap_or(progress_token.to_string());","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/activity_indicator/src/activity_indicator.rs#L416"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"Same eager-allocation issue as in `content_to_render`: inside the context-menu builder, `work.progress.title.clone().unwrap_or(work.progress_token.to_string())` allocates `work.progress_token.to_string()` for every menu entry even when the title is present.","fix":"Replace `.unwrap_or(work.progress_token.to_string())` with:\n```rust\n.unwrap_or_else(|| work.progress_token.to_string())\n```","locations":[{"ref":"crates/activity_indicator/src/activity_indicator.rs:793-797","code":"  793 |                                 let mut title = work\n  794 |                                     .progress\n  795 |                                     .title\n  796 |                                     .clone()\n  797 |                                     .unwrap_or(work.progress_token.to_string());","lines":5,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/activity_indicator/src/activity_indicator.rs#L793-L797"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`get_buffer_content_or_outline` measures the buffer size by allocating a full copy of the buffer's text and then discarding it: `buffer.read_with(cx, |buffer, _| buffer.text().len())`. `buffer.text()` materializes the entire rope into a `String` just to read its byte length. This is wasteful precisely for the large files this function targets (the `AUTO_OUTLINE_SIZE` path). The buffer exposes a cheap `len()` (used later at line 59 via `snapshot.len()`).","fix":"Read the length directly instead of allocating the whole text:\n```rust\nlet file_size = buffer.read_with(cx, |buffer, _| buffer.len());\n```","locations":[{"ref":"crates/agent/src/outline.rs:33","code":"   33 |     let file_size = buffer.read_with(cx, |buffer, _| buffer.text().len());","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent/src/outline.rs#L33"}]},
{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`DeletePathTool::run` opens a real buffer for *every* entry under the directory being deleted (via `project.open_buffer(path, cx).await` inside the loop) solely so it can call `action_log.will_delete_buffer(...)`. For a large directory this materializes and holds a buffer per descendant file, which is both slow and memory-heavy, even though most of those files were never touched by the agent and don't need edit tracking. The traversal streams paths through a `mpsc::channel(256)` but the per-path `open_buffer` is the real cost.","fix":"Only mark buffers that are already open for edit tracking, rather than force-opening every descendant. For example, query the project's already-open buffers for paths under `project_path.path` and call `will_delete_buffer` on those, instead of calling `project.open_buffer(path, cx)` for every traversed entry.","locations":[{"ref":"crates/agent/src/tools/delete_path_tool.rs:207-247","code":"  207 |             let (mut paths_tx, mut paths_rx) = mpsc::channel(256);\n  208 |             cx.background_spawn({\n  209 |                 let project_path = project_path.clone();\n  210 |                 async move {\n  211 |                     for entry in\n  212 |                         worktree_snapshot.traverse_from_path(true, false, false, &project_path.path)\n  213 |                     {\n  214 |                         if !entry.path.starts_with(&project_path.path) {\n  215 |                             break;\n  216 |                         }\n  217 |                         paths_tx\n  218 |                             .send(ProjectPath {\n  219 |                                 worktree_id: project_path.worktree_id,\n  220 |                                 path: entry.path.clone(),\n  221 |                             })\n  222 |                             .await?;\n  223 |                     }\n  224 |                     anyhow::Ok(())\n  225 |                 }\n  226 |             })\n  227 |             .detach();\n  228 | \n  229 |             loop {\n  230 |                 let path_result = futures::select! {\n  231 |                     path = paths_rx.next().fuse() => path,\n  232 |                     _ = event_stream.cancelled_by_user().fuse() => {\n  233 |                         return Err(\"Delete cancelled by user\".to_string());\n  234 |                     }\n  235 |                 };\n  236 |                 let Some(path) = path_result else {\n  237 |                     break;\n  238 |                 };\n  239 |                 if let Ok(buffer) = project\n  240 |                     .update(cx, |project, cx| project.open_buffer(path, cx))\n  241 |                     .await\n  242 |                 {\n  243 |                     action_log.update(cx, |action_log, cx| {\n  244 |                         action_log.will_delete_buffer(buffer.clone(), cx)\n  245 |                     });\n  246 |                 }\n  247 |             }","lines":41,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent/src/tools/delete_path_tool.rs#L207-L247"}]},
{"id":"PERF_9","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`StreamingFuzzyMatcher::push` calls `resolve_location_fuzzy` every time a query\nline is completed, and `resolve_location_fuzzy` re-runs the *entire* match\nextraction pass over the whole buffer on each call: the best-cost column scan\n(`for col in 1..=buffer_line_count`) plus a full backtrace for every equal-cost\ncolumn. During streaming, the returned range is only used for a UI preview\n(`diff.reveal_range` / `set_agent_location`); the authoritative resolution\nhappens later in `finish`. So for an `old_text` of `N` lines against a buffer of\n`B` lines the extraction work is repeated `N` times, i.e. `O(N * B)` extra scans\nplus backtraces, purely to update a preview. Additionally `fuzzy_eq` runs\n`strsim::normalized_levenshtein` (which is `O(line_len^2)`) against every buffer\nline whose length is within threshold, for each newly-completed query line.\nFor large files this makes each streamed line noticeably expensive.","fix":"The incremental DP row-fill is fine and must stay per line, but the full\nmatch-extraction (best-cost scan + backtrace) is only needed when a caller\nactually consumes the result. Consider computing the preview range lazily\n(only when `push` will return it / when the diff is actually revealed) or\ncaching `matches_with_best_cost` and only re-extracting when the new rows\nchanged the final-row costs, so the whole-buffer scan is not repeated on every\nstreamed line.","locations":[{"ref":"crates/agent/src/tools/edit_session/streaming_fuzzy_matcher.rs:81-90","code":"   81 |             self.matches = self.resolve_location_fuzzy();\n   82 |         }\n   83 | \n   84 |         let best_match = self.select_best_match();\n   85 |         best_match.or_else(|| {\n   86 |             self.matches\n   87 |                 .first()\n   88 |                 .map(|search_match| search_match.range.clone())\n   89 |         })\n   90 |     }","lines":10,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent/src/tools/edit_session/streaming_fuzzy_matcher.rs#L81-L90"},{"ref":"crates/agent/src/tools/edit_session/streaming_fuzzy_matcher.rs:203-261","code":"  203 |         // Find all matches with the best cost\n  204 |         let buffer_line_count = self.snapshot.max_point().row as usize + 1;\n  205 |         let mut best_cost = u32::MAX;\n  206 |         let mut matches_with_best_cost = Vec::new();\n  207 | \n  208 |         for col in 1..=buffer_line_count {\n  209 |             let cost = self.matrix.get(new_query_line_count, col).cost;\n  210 |             if cost < best_cost {\n  211 |                 best_cost = cost;\n  212 |                 matches_with_best_cost.clear();\n  213 |                 matches_with_best_cost.push(col as u32);\n  214 |             } else if cost == best_cost {\n  215 |                 matches_with_best_cost.push(col as u32);\n  216 |             }\n  217 |         }\n  218 | \n  219 |         // Find ranges for the matches\n  220 |         let mut valid_matches = Vec::new();\n  221 |         for &buffer_row_end in &matches_with_best_cost {\n  222 |             let mut line_pairs = Vec::new();\n  223 |             let mut query_row = new_query_line_count;\n  224 |             let mut buffer_row_start = buffer_row_end;\n  225 |             while query_row > 0 && buffer_row_start > 0 {\n  226 |                 let current = self.matrix.get(query_row, buffer_row_start as usize);\n  227 |                 match current.direction {\n  228 |                     SearchDirection::Diagonal => {\n  229 |                         query_row -= 1;\n  230 |                         buffer_row_start -= 1;\n  231 |                         line_pairs.push((query_row as u32, buffer_row_start));\n  232 |                     }\n  233 |                     SearchDirection::Up => {\n  234 |                         query_row -= 1;\n  235 |                     }\n  236 |                     SearchDirection::Left => {\n  237 |                         buffer_row_start -= 1;\n  238 |                     }\n  239 |                 }\n  240 |             }\n  241 |             line_pairs.reverse();\n  242 | \n  243 |             let matched_buffer_row_count = buffer_row_end - buffer_row_start;\n  244 |             let matched_ratio = line_pairs.len() as f32\n  245 |                 / (matched_buffer_row_count as f32).max(new_query_line_count as f32);\n  246 |             if matched_ratio >= 0.8 {\n  247 |                 let buffer_start_ix = self\n  248 |                     .snapshot\n  249 |                     .point_to_offset(Point::new(buffer_row_start, 0));\n  250 |                 let buffer_end_ix = self.snapshot.point_to_offset(Point::new(\n  251 |                     buffer_row_end - 1,\n  252 |                     self.snapshot.line_len(buffer_row_end - 1),\n  253 |                 ));\n  254 |                 valid_matches.push(SearchMatch {\n  255 |                     range: buffer_start_ix..buffer_end_ix,\n  256 |                     line_pairs,\n  257 |                 });\n  258 |             }\n  259 |         }\n  260 | \n  261 |         valid_matches","lines":59,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent/src/tools/edit_session/streaming_fuzzy_matcher.rs#L203-L261"},{"ref":"crates/agent/src/tools/edit_session/streaming_fuzzy_matcher.rs:358-369","code":"  358 | fn fuzzy_eq(left: &str, right: &str) -> bool {\n  359 |     const THRESHOLD: f64 = 0.8;\n  360 | \n  361 |     let min_levenshtein = left.len().abs_diff(right.len());\n  362 |     let min_normalized_levenshtein =\n  363 |         1. - (min_levenshtein as f64 / cmp::max(left.len(), right.len()) as f64);\n  364 |     if min_normalized_levenshtein < THRESHOLD {\n  365 |         return false;\n  366 |     }\n  367 | \n  368 |     strsim::normalized_levenshtein(left, right) >= THRESHOLD\n  369 | }","lines":12,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent/src/tools/edit_session/streaming_fuzzy_matcher.rs#L358-L369"}]},
{"id":"PERF_10","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`ManageProfilesModal::render` clones the full `Mode` sub-state for the choose/new/view arms on every frame: `self.render_choose_profile(mode.clone(), ...)`, `self.render_new_profile(mode.clone(), ...)`, `self.render_view_profile(mode.clone(), ...)`. `ChooseProfileMode` in particular owns `Vec<ProfileEntry>` (built-in and custom profiles, each holding a `NavigableEntry`/`FocusHandle`), so the whole profile list is deep-cloned on each render pass.","fix":"Refactor the `render_*` helpers to take the mode by reference (`&ChooseProfileMode`, etc.) instead of by value, avoiding the per-frame clone of the profile vectors.","locations":[{"ref":"crates/agent_ui/src/agent_configuration/manage_profiles_modal.rs:997-1006","code":"  997 |             .child(match &self.mode {\n  998 |                 Mode::ChooseProfile(mode) => self\n  999 |                     .render_choose_profile(mode.clone(), window, cx)\n 1000 |                     .into_any_element(),\n 1001 |                 Mode::NewProfile(mode) => self\n 1002 |                     .render_new_profile(mode.clone(), window, cx)\n 1003 |                     .into_any_element(),\n 1004 |                 Mode::ViewProfile(mode) => self\n 1005 |                     .render_view_profile(mode.clone(), window, cx)\n 1006 |                     .into_any_element(),","lines":10,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/agent_configuration/manage_profiles_modal.rs#L997-L1006"}]},
{"id":"PERF_11","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`AgentDiff::update_reviewing_editors` clones the entire `reviewing_editors` map on every invocation (`let mut unaffected = self.reviewing_editors.clone();`). This method is called very frequently (on every action-log change, thread event, settings change, and editor registration), so the clone is repeated work proportional to the number of tracked editors.","fix":"Track the set of still-affected editors with a lightweight structure (e.g. collect a `HashSet<WeakEntity<Editor>>` of keys to retain, or drain/rebuild) instead of cloning the whole `EditorState` map each call.","locations":[{"ref":"crates/agent_ui/src/agent_diff.rs:1582","code":" 1582 |         let mut unaffected = self.reviewing_editors.clone();","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/agent_diff.rs#L1582"}]},
{"id":"PERF_12","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`filter_registry_agents` clones the entire `installed_statuses` map on every invocation purely to reference it inside the filter closure. Because Rust 2024 (this crate's edition) uses disjoint closure captures, the closure only needs a shared borrow of `self.installed_statuses`, which does not conflict with the shared borrow of `self.registry_agents` taken by `self.registry_agents.iter()`. The clone is therefore unnecessary allocation/copy work, and this method runs on every global `SettingsStore` change and on every keystroke in the search box.","fix":"Replace the owned clone with a shared borrow.\n\nBefore:\n```rust\n        let filter = self.filter;\n        let installed_statuses = self.installed_statuses.clone();\n\n        let filtered_indices = self\n```\n\nAfter:\n```rust\n        let filter = self.filter;\n        let installed_statuses = &self.installed_statuses;\n\n        let filtered_indices = self\n```\nThe closure body already only calls `installed_statuses.get(...).copied()`, which works unchanged against a borrow.","locations":[{"ref":"crates/agent_ui/src/agent_registry_ui.rs:178-213","code":"  178 |     fn filter_registry_agents(&mut self, cx: &mut Context<Self>) {\n  179 |         self.refresh_installed_statuses(cx);\n  180 |         let search = self.search_query(cx).map(|search| search.to_lowercase());\n  181 |         let filter = self.filter;\n  182 |         let installed_statuses = self.installed_statuses.clone();\n  183 | \n  184 |         let filtered_indices = self\n  185 |             .registry_agents\n  186 |             .iter()\n  187 |             .enumerate()\n  188 |             .filter(|(_, agent)| {\n  189 |                 let matches_search = search.as_ref().is_none_or(|query| {\n  190 |                     let query = query.as_str();\n  191 |                     agent.id().as_ref().to_lowercase().contains(query)\n  192 |                         || agent.name().as_ref().to_lowercase().contains(query)\n  193 |                         || agent.description().as_ref().to_lowercase().contains(query)\n  194 |                 });\n  195 | \n  196 |                 let install_status = installed_statuses\n  197 |                     .get(agent.id().as_ref())\n  198 |                     .copied()\n  199 |                     .unwrap_or(RegistryInstallStatus::NotInstalled);\n  200 |                 let matches_filter = match filter {\n  201 |                     RegistryFilter::All => true,\n  202 |                     RegistryFilter::Installed => {\n  203 |                         install_status != RegistryInstallStatus::NotInstalled\n  204 |                     }\n  205 |                     RegistryFilter::NotInstalled => {\n  206 |                         install_status == RegistryInstallStatus::NotInstalled\n  207 |                     }\n  208 |                 };\n  209 | \n  210 |                 matches_search && matches_filter\n  211 |             })\n  212 |             .map(|(index, _)| index)\n  213 |             .collect();","lines":36,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/agent_registry_ui.rs#L178-L213"}]},
{"id":"PERF_13","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`render` unconditionally calls `sync_request_elicitation_states` on every frame. When any request-elicitation store is present, that method allocates a fresh `Vec` of `(id, is_pending, schema)` tuples and a `HashSet` of ids, and iterates all elicitations each frame, even when nothing has changed. This is redundant work on the hot render path; the state only needs to be resynced when the elicitation store actually changes (which is already observed via `request_elicitation_subscription`).","fix":"Drive `sync_request_elicitation_states` from the elicitation-store observer (and state transitions) rather than from `render`, or cache a version/last-seen count so `render` can early-out when nothing changed. At minimum, avoid the per-frame `Vec`/`HashSet` allocations when the store is empty or unchanged.","locations":[{"ref":"crates/agent_ui/src/conversation_view.rs:3402-3404","code":" 3402 |     fn render(&mut self, window: &mut Window, cx: &mut Context<Self>) -> impl IntoElement {\n 3403 |         self.sync_request_elicitation_states(window, cx);\n 3404 |         let request_elicitation_connection = self.request_elicitation_connection();","lines":3,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/conversation_view.rs#L3402-L3404"},{"ref":"crates/agent_ui/src/conversation_view.rs:2369-2407","code":" 2369 |     fn sync_request_elicitation_states(&mut self, window: &mut Window, cx: &mut Context<Self>) {\n 2370 |         let Some(store) = self.request_elicitation_store() else {\n 2371 |             self.request_elicitation_form_states.clear();\n 2372 |             return;\n 2373 |         };\n 2374 | \n 2375 |         let elicitations = store\n 2376 |             .read(cx)\n 2377 |             .elicitations()\n 2378 |             .iter()\n 2379 |             .map(|elicitation| {\n 2380 |                 let is_pending = matches!(elicitation.status, ElicitationStatus::Pending { .. });\n 2381 |                 let schema = match &elicitation.request.mode {\n 2382 |                     acp::ElicitationMode::Form(mode) => Some(mode.requested_schema.clone()),\n 2383 |                     _ => None,\n 2384 |                 };\n 2385 |                 (elicitation.id.clone(), is_pending, schema)\n 2386 |             })\n 2387 |             .collect::<Vec<_>>();\n 2388 | \n 2389 |         let known_ids = elicitations\n 2390 |             .iter()\n 2391 |             .map(|(id, _, _)| id.clone())\n 2392 |             .collect::<HashSet<_>>();\n 2393 |         self.request_elicitation_form_states\n 2394 |             .retain(|id, _| known_ids.contains(id));\n 2395 | \n 2396 |         for (id, is_pending, schema) in elicitations {\n 2397 |             if is_pending\n 2398 |                 && let Some(schema) = schema\n 2399 |                 && !self.request_elicitation_form_states.contains_key(&id)\n 2400 |             {\n 2401 |                 self.request_elicitation_form_states\n 2402 |                     .insert(id, ElicitationFormState::new(&schema, window, cx));\n 2403 |             } else if !is_pending {\n 2404 |                 self.request_elicitation_form_states.remove(&id);\n 2405 |             }\n 2406 |         }\n 2407 |     }","lines":39,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/conversation_view.rs#L2369-L2407"}]},
{"id":"PERF_14","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`ThreadView::render` calls `self.sync_local_commands(cx)` on every frame. That reads `AgentSettings`, checks organization configuration and connection telemetry (`is_thread_feedback_enabled`), allocates a `Vec<PromptLocalCommand>`, and calls `message_editor.read(cx).set_local_commands(commands)` each render. The comment acknowledges this is to keep commands in sync, but running it unconditionally on every render (including scroll-driven redraws) is wasteful side-effecting work on the hot path.","fix":"Compute the command set only when its inputs change (e.g. on the settings/connection/feedback-availability change events that already flow through subscriptions) and store it, or have `set_local_commands` early-out when the command list is unchanged, instead of recomputing and re-setting it every `render`.","locations":[{"ref":"crates/agent_ui/src/conversation_view/thread_view.rs:12151","code":"12151 |         self.sync_local_commands(cx);","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/conversation_view/thread_view.rs#L12151"},{"ref":"crates/agent_ui/src/conversation_view/thread_view.rs:6975-6978","code":" 6975 |     pub(crate) fn sync_local_commands(&self, cx: &App) {\n 6976 |         let commands = self.available_local_commands(cx);\n 6977 |         self.message_editor.read(cx).set_local_commands(commands);\n 6978 |     }","lines":4,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/conversation_view/thread_view.rs#L6975-L6978"}]},
{"id":"PERF_15","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"In `PromptEditor::render`, `explanation_label` is always built via `self.render_markdown(...).into_any_element()` on every render, but it is only attached to the element tree inside the `.when_some(explanation, ...)` branch. When there is no explanation (the common case for terminal mode and idle buffer mode) the markdown element is constructed and then discarded, and the `markdown` state entity is still created via `window.use_state` unconditionally.","fix":"Only create the `markdown` state and build `explanation_label` when `explanation.is_some()`, e.g. compute it inside the `.when_some(explanation, |this, explanation| { ... })` closure so nothing is allocated/built when there is no explanation to show.","locations":[{"ref":"crates/agent_ui/src/inline_prompt_editor.rs:139-149","code":"  139 |         let markdown = window.use_state(cx, |_, cx| Markdown::new(\"\".into(), None, None, cx));\n  140 | \n  141 |         if let Some(explanation) = &explanation {\n  142 |             markdown.update(cx, |markdown, cx| {\n  143 |                 markdown.reset(SharedString::from(explanation), cx);\n  144 |             });\n  145 |         }\n  146 | \n  147 |         let explanation_label = self\n  148 |             .render_markdown(markdown, markdown_style(window, cx))\n  149 |             .into_any_element();","lines":11,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/inline_prompt_editor.rs#L139-L149"}]},
{"id":"PERF_16","type":"performance","type_label":"Performance","severity":"low","difficulty":"very_easy","description":"`ModelMatcher::exact_search` recomputes `query.to_lowercase()` on every iteration of the filter closure (once per candidate model) instead of computing it a single time before the loop. `query` is constant for the whole search, so this allocates and lowercases the query string N times.","fix":"Hoist the lowercased query out of the closure.\n\nBefore:\n```rust\npub fn exact_search(&self, query: &str) -> Vec<ModelInfo> {\n    self.models\n        .iter()\n        .filter(|m| {\n            m.model\n                .name()\n                .0\n                .to_lowercase()\n                .contains(&query.to_lowercase())\n        })\n        .cloned()\n        .collect::<Vec<_>>()\n}\n```\n\nAfter:\n```rust\npub fn exact_search(&self, query: &str) -> Vec<ModelInfo> {\n    let query = query.to_lowercase();\n    self.models\n        .iter()\n        .filter(|m| m.model.name().0.to_lowercase().contains(&query))\n        .cloned()\n        .collect::<Vec<_>>()\n}\n```","locations":[{"ref":"crates/agent_ui/src/language_model_selector.rs:360-372","code":"  360 |     pub fn exact_search(&self, query: &str) -> Vec<ModelInfo> {\n  361 |         self.models\n  362 |             .iter()\n  363 |             .filter(|m| {\n  364 |                 m.model\n  365 |                     .name()\n  366 |                     .0\n  367 |                     .to_lowercase()\n  368 |                     .contains(&query.to_lowercase())\n  369 |             })\n  370 |             .cloned()\n  371 |             .collect::<Vec<_>>()\n  372 |     }","lines":13,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/language_model_selector.rs#L360-L372"}]},
{"id":"PERF_17","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`LanguageModelPickerDelegate::update_matches` performs the entire filtering and fuzzy-matching work synchronously on the calling (foreground) thread before spawning: `matcher_all.fuzzy_search(&query)` calls `self.fg_executor.block_on(match_strings(...))`, and `GroupedModels::new` runs, all before `cx.spawn_in`. The spawned task only assigns the already-computed `filtered_models.entries()` to `self.filtered_entries`. This makes the comment at the subscription site (\"Update matches will automatically drop the previous task if we get a provider event again\") misleading, because the expensive matching is not part of the returned `Task` and therefore is not cancellable - it blocks the UI thread on every keystroke/provider event.","fix":"Move the candidate construction and matching (`ModelMatcher::new`, `exact_search`/`fuzzy_search`, `GroupedModels::new`) inside the `cx.spawn_in` closure and run the fuzzy match on the background executor (awaiting `match_strings` instead of `block_on`) so the work lives in the returned `Task` and is genuinely dropped/cancelled when a newer `update_matches` supersedes it.","locations":[{"ref":"crates/agent_ui/src/language_model_selector.rs:419-480","code":"  419 |     fn update_matches(\n  420 |         &mut self,\n  421 |         query: String,\n  422 |         window: &mut Window,\n  423 |         cx: &mut Context<Picker<Self>>,\n  424 |     ) -> Task<()> {\n  425 |         let all_models = self.all_models.clone();\n  426 |         let active_model = (self.get_active_model)(cx);\n  427 |         let fg_executor = cx.foreground_executor();\n  428 |         let bg_executor = cx.background_executor();\n  429 | \n  430 |         let language_model_registry = LanguageModelRegistry::global(cx);\n  431 | \n  432 |         let configured_providers = language_model_registry\n  433 |             .read(cx)\n  434 |             .visible_providers()\n  435 |             .into_iter()\n  436 |             .filter(|provider| provider.is_authenticated(cx))\n  437 |             .collect::<Vec<_>>();\n  438 | \n  439 |         let configured_provider_ids = configured_providers\n  440 |             .iter()\n  441 |             .map(|provider| provider.id())\n  442 |             .collect::<Vec<_>>();\n  443 | \n  444 |         let recommended_models = all_models\n  445 |             .recommended\n  446 |             .iter()\n  447 |             .filter(|m| configured_provider_ids.contains(&m.model.provider_id()))\n  448 |             .cloned()\n  449 |             .collect::<Vec<_>>();\n  450 | \n  451 |         let available_models = all_models\n  452 |             .all\n  453 |             .values()\n  454 |             .flat_map(|models| models.iter())\n  455 |             .filter(|m| configured_provider_ids.contains(&m.model.provider_id()))\n  456 |             .cloned()\n  457 |             .collect::<Vec<_>>();\n  458 | \n  459 |         let matcher_rec =\n  460 |             ModelMatcher::new(recommended_models, fg_executor.clone(), bg_executor.clone());\n  461 |         let matcher_all =\n  462 |             ModelMatcher::new(available_models, fg_executor.clone(), bg_executor.clone());\n  463 | \n  464 |         let recommended = matcher_rec.exact_search(&query);\n  465 |         let all = matcher_all.fuzzy_search(&query);\n  466 | \n  467 |         let filtered_models = GroupedModels::new(all, recommended);\n  468 | \n  469 |         cx.spawn_in(window, async move |this, cx| {\n  470 |             this.update_in(cx, |this, window, cx| {\n  471 |                 this.delegate.filtered_entries = filtered_models.entries();\n  472 |                 // Finds the currently selected model in the list\n  473 |                 let new_index =\n  474 |                     Self::get_active_model_index(&this.delegate.filtered_entries, active_model);\n  475 |                 this.set_selected_index(new_index, Some(picker::Direction::Down), true, window, cx);\n  476 |                 cx.notify();\n  477 |             })\n  478 |             .ok();\n  479 |         })\n  480 |     }","lines":62,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/language_model_selector.rs#L419-L480"},{"ref":"crates/agent_ui/src/language_model_selector.rs:163-167","code":"  163 |                             let query = picker.query(cx);\n  164 |                             picker.delegate.all_models = Arc::new(all_models(cx));\n  165 |                             // Update matches will automatically drop the previous task\n  166 |                             // if we get a provider event again\n  167 |                             picker.update_matches(query, window, cx)","lines":5,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/language_model_selector.rs#L163-L167"}]},
