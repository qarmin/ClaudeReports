{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`content_to_render` mutates `self.statuses` (removing `Stopped` / empty-`Health` servers via `self.statuses.retain(...)`) only after all the earlier early-return branches (environment error, pending language-server work, debug session, git job, fs job) have been passed. While any of those higher-priority conditions holds, stale `Stopped`/cleared statuses are never pruned and keep accumulating in the `statuses` vector across renders. This is a minor unbounded-growth / stale-state issue driven by call ordering inside a render path.","fix":"Perform the `servers_to_clear_statuses` collection and `self.statuses.retain(...)` cleanup unconditionally near the start of `content_to_render` (or in the status-update subscriptions), independent of which content branch ultimately returns, so cleared statuses are pruned even when higher-priority content is shown.","locations":[{"ref":"crates/activity_indicator/src/activity_indicator.rs:492-522","code":"  492 |         let mut servers_to_clear_statuses = HashSet::<LanguageServerName>::default();\n  493 |         for status in &self.statuses {\n  494 |             match &status.status {\n  495 |                 LanguageServerStatusUpdate::Binary(\n  496 |                     BinaryStatus::Starting | BinaryStatus::Stopping,\n  497 |                 ) => {}\n  498 |                 LanguageServerStatusUpdate::Binary(BinaryStatus::Stopped) => {\n  499 |                     servers_to_clear_statuses.insert(status.name.clone());\n  500 |                 }\n  501 |                 LanguageServerStatusUpdate::Binary(BinaryStatus::CheckingForUpdate) => {\n  502 |                     checking_for_update.push(status.name.clone());\n  503 |                 }\n  504 |                 LanguageServerStatusUpdate::Binary(BinaryStatus::Downloading) => {\n  505 |                     downloading.push(status.name.clone());\n  506 |                 }\n  507 |                 LanguageServerStatusUpdate::Binary(BinaryStatus::Failed { .. }) => {\n  508 |                     failed.push(status.name.clone());\n  509 |                 }\n  510 |                 LanguageServerStatusUpdate::Binary(BinaryStatus::None) => {}\n  511 |                 LanguageServerStatusUpdate::Health(health, server_status) => match server_status {\n  512 |                     Some(server_status) => {\n  513 |                         health_messages.push((status.name.clone(), *health, server_status.clone()));\n  514 |                     }\n  515 |                     None => {\n  516 |                         servers_to_clear_statuses.insert(status.name.clone());\n  517 |                     }\n  518 |                 },\n  519 |             }\n  520 |         }\n  521 |         self.statuses\n  522 |             .retain(|status| !servers_to_clear_statuses.contains(&status.name));","lines":31,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/activity_indicator/src/activity_indicator.rs#L492-L522"}]},
{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`health_messages` collects an entry for *any* health update that has a `Some` message string, including `ServerHealth::Ok`. When such an `Ok` entry is later popped and rendered, it is displayed with `ActivityIcon::Icon(IconName::Warning)` (the same warning triangle used for real errors/warnings) and the message prefix `format!(\"({server_name}) \")`. An informational `Ok` health message thus surfaces in the status bar as a warning, which is misleading to users.","fix":"Either skip `ServerHealth::Ok` health messages when building `health_messages`, or choose a non-warning icon for the `ServerHealth::Ok` case in the render branch (e.g. an informational icon) rather than always using `IconName::Warning`.","locations":[{"ref":"crates/activity_indicator/src/activity_indicator.rs:511-518","code":"  511 |                 LanguageServerStatusUpdate::Health(health, server_status) => match server_status {\n  512 |                     Some(server_status) => {\n  513 |                         health_messages.push((status.name.clone(), *health, server_status.clone()));\n  514 |                     }\n  515 |                     None => {\n  516 |                         servers_to_clear_statuses.insert(status.name.clone());\n  517 |                     }\n  518 |                 },","lines":8,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/activity_indicator/src/activity_indicator.rs#L511-L518"},{"ref":"crates/activity_indicator/src/activity_indicator.rs:619-661","code":"  619 |         if let Some((server_name, health, message)) = health_messages.pop() {\n  620 |             let health_str = match health {\n  621 |                 ServerHealth::Ok => format!(\"({server_name}) \"),\n  622 |                 ServerHealth::Warning => format!(\"({server_name}) Warning: \"),\n  623 |                 ServerHealth::Err b/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/activity_indicator/src/activity_indicator.rs#L619-L661"}]},
{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`Thread::send` pushes the user message into `self.messages` and calls `cx.notify()`\n*before* verifying a model is configured:\n\n```rust\nself.messages.push(Arc::new(Message::User(UserMessage { id, content })));\ncx.notify();\nself.send_existing(cx)   // errors with NoModelConfiguredError if no model\n```\n\n`send_existing` returns `Err(NoModelConfiguredError)` when `self.model()` is `None`,\nbut by then the user message is already appended and observers notified, leaving a\ndangling user message with no response in the thread on the error path. `compact`,\nby contrast, validates the model up front before mutating state. If the intent is to\nkeep the message for a later retry this is fine, but the inconsistency between the\ntwo entry points is a latent trap.","fix":"Validate the model before mutating `self.messages` in `send` (mirroring `compact`),\ne.g. check `self.model().is_some()` / resolve the model first and return the error\nbefore pushing the message and calling `cx.notify()`; or document explicitly that\nthe message is intentionally retained for retry.","locations":[{"ref":"crates/agent/src/thread.rs:2524-2556","code":" 2524 |     pub fn send<T>(\n 2525 |         &mut self,\n 2526 |         id: ClientUserMessageId,\n 2527 |         content: impl IntoIterator<Item = T>,\n 2528 |         cx: &mut Context<Self>,\n 2529 |     ) -> Result<mpsc::UnboundedReceiver<Result<ThreadEvent>>>\n 2530 |     where\n 2531 |         T: Into<UserMessageContent>,\n 2532 |     {\n 2533 |         let content = content.into_iter().map(Into::into).collect::<Arc<_>>();\n 2534 |         log::debug!(\"Thread::send content: {:?}\", content);\n 2535 | \n 2536 |         self.messages\n 2537 |             .push(Arc::new(Message::User(UserMessage { id, content })));\n 2538 |         cx.notify();\n 2539 | \n 2540 |         self.send_existing(cx)\n 2541 |     }\n 2542 | \n 2543 |     pub fn send_existing(\n 2544 |         &mut self,\n 2545 |         cx: &mut Context<Self>,\n 2546 |     ) -> Result<mpsc::UnboundedReceiver<Result<ThreadEvent>>> {\n 2547 |         let model = self\n 2548 |             .model()\n 2549 |             .ok_or_else(|| anyhow!(NoModelConfiguredError))?;\n 2550 | \n 2551 |         log::info!(\"Thread::send called with model: {}\", model.name().0);\n 2552 |         self.advance_prompt_id();\n 2553 | \n 2554 |         log::debug!(\"Total messages in thread: {}\", self.messages.len());\n 2555 |         self.run_turn(cx)\n 2556 |     }","lines":33,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent/src/thread.rs#L2524-L2556"}]},
{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`ThreadStore::save_thread` / `delete_thread` / `delete_threads` return a `Task` that resolves as soon as the DB write finishes and the reload is *spawned* - not when the reload completes. The final expression `this.update(cx, |this, cx| this.reload(cx))` only replaces `self.reload_task` with a freshly spawned task and returns `()`; it does not await it. As a result, a caller that does `store.save_thread(...).await` and then immediately reads `store.entries()` will observe stale data (the just-saved thread is not yet present). The doc comment on `reload_task()` hints callers should await it, but the fact that awaiting `save_thread` is *not* sufficient is an easy footgun. The in-crate tests only pass because they additionally call `cx.run_until_parked()` after awaiting.","fix":"Await the reload before the returned task resolves, e.g. in `save_thread`:\n```rust\ndatabase.save_thread(id, thread, folder_paths).await?;\nlet reload = this.update(cx, |this, cx| {\n    this.reload(cx);\n    this.reload_task.clone()\n})?;\nreload.await;\nOk(())\n```\nAlternatively, document explicitly that `entries()` is only guaranteed up-to-date after awaiting `reload_task()`, not after awaiting the mutation task.","locations":[{"ref":"crates/agent/src/thread_store.rs:62-97","code":"   62 |     pub fn save_thread(\n   63 |         &mut self,\n   64 |         id: acp::SessionId,\n   65 |         thread: crate::DbThread,\n   66 |         folder_paths: PathList,\n   67 |         cx: &mut Context<Self>,\n   68 |     ) -> Task<Result<()>> {\n   69 |         let database_future = ThreadsDatabase::connect(cx);\n   70 |         cx.spawn(async move |this, cx| {\n   71 |             let database = database_future.await.map_err(|err| anyhow!(err))?;\n   72 |             database.save_thread(id, thread, folder_paths).await?;\n   73 |             this.update(cx, |this, cx| this.reload(cx))\n   74 |         })\n   75 |     }\n   76 | \n   77 |     pub fn delete_thread(\n   78 |         &mut self,\n   79 |         id: acp::SessionId,\n   80 |         cx: &mut Context<Self>,\n   81 |     ) -> Task<Result<()>> {\n   82 |         let database_future = ThreadsDatabase::connect(cx);\n   83 |         cx.spawn(async move |this, cx| {\n   84 |             let database = database_future.await.map_err(|err| anyhow!(err))?;\n   85 |             database.delete_thread(id.clone()).await?;\n   86 |             this.update(cx, |this, cx| this.reload(cx))\n   87 |         })\n   88 |     }\n   89 | \n   90 |     pub fn delete_threads(&mut self, cx: &mut Context<Self>) -> Task<Result<()>> {\n   91 |         let database_future = ThreadsDatabase::connect(cx);\n   92 |         cx.spawn(async move |this, cx| {\n   93 |             let database = database_future.await.map_err(|err| anyhow!(err))?;\n   94 |             database.delete_threads().await?;\n   95 |             this.update(cx, |this, cx| this.reload(cx))\n   96 |         })\n   97 |     }","lines":36,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent/src/thread_store.rs#L62-L97"},{"ref":"crates/agent/src/thread_store.rs:99-125","code":"   99 |     pub fn reload(&mut self, cx: &mut Context<Self>) {\n  100 |         self.reload_task = Self::spawn_reload(cx);\n  101 |     }\n  102 | \n  103 |     fn spawn_reload(cx: &mut Context<Self>) -> Shared<Task<()>> {\n  104 |         let database_connection = ThreadsDatabase::connect(cx);\n  105 |         cx.spawn(async move |this, cx| {\n  106 |             let Ok(database) = database_connection.await.map_err(|err| anyhow!(err)) else {\n  107 |                 return;\n  108 |             };\n  109 |             let Ok(all_threads) = database.list_threads().await else {\n  110 |                 return;\n  111 |             };\n  112 |             this.update(cx, |this, cx| {\n  113 |                 this.threads.clear {"id":"LOGIC_33","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The reindenter only recognizes leading whitespace that is *equal to the delta's\nown character*. `line.find(|c| delta.character() != c)` returns the first\ncharacter not matching the indent character, so for `IndentDelta::Spaces` a line\nthat is actually indented with tabs (a tab is `!= ' '`) is treated as having\n*zero* leading indentation, and the delta's spaces are then prepended in front\nof the tab, producing mixed `spaces + tabs + content` indentation. The same\nhappens in reverse for `IndentDelta::Tabs` against a space-indented line. In a\nfile that mixes indentation styles (or where `compute_indent_delta` picked tabs\nbecause the matched buffer line had `tabs > 0` while the new lines use spaces),\nthe streamed `new_text` can be re-indented into a corrupted mixture rather than\nbeing left alone.","fix":"Only count/replace whitespace characters that match the delta character, and\nleave any leading whitespace of the *other* kind untouched (or detect it and\nskip re-indentation for that line). At minimum, treat the boundary as \"first\nnon-whitespace character\" (`!c.is_whitespace()`) when deciding what counts as\nthe indent prefix, rather than \"first char that is not `delta.character()`\", so\nthat foreign-whitespace-indented lines are not mistaken for un-indented content.","locations":[{"ref":"crates/agent/src/tools/edit_session/reindent.rs:119-127","code":"  119 |             if self.in_leading_whitespace {\n  120 |                 if let Some(non_whitespace_ix) = line.find(|c| delta.character() != c) {\n  121 |                     // We found a non-whitespace character, adjust indentation\n  122 |                     // based on the delta.\n  123 |                     let new_indent_len =\n  124 |                         cmp::max(0, non_whitespace_ix as isize + delta.len()) as usize;\n  125 |                     indented.extend(iter::repeat(delta.character()).take(new_indent_len));\n  126 |                     indented.push_str(&line[non_whitespace_ix..]);\n  127 |                     self.in_leading_whitespace = false;","lines":9,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent/src/tools/edit_session/reindent.rs#L119-L127"}]},
{"id":"LOGIC_34","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`select_terminal_output_lines` in the `(Some(head_lines), Some(tail_lines))` arm computes `tail_start = lines.len().saturating_sub(tail_lines)` independently of `head_lines`. When `head_lines + tail_lines` exceeds the total number of lines, the head and tail ranges overlap and the same lines are emitted twice. For input `one\\ntwo\\nthree` with `head=2, tail=2` the result is `one\\ntwo\\n\\ntwo\\nthree` (\"two\" duplicated). The model then receives duplicated/overlapping content that misrepresents the real output. (This is currently asserted as intended in a test, but it is a genuine model-facing quirk.)","fix":"Clamp the tail start so it never precedes the head, e.g.:\n```rust\n(Some(head_lines), Some(tail_lines)) => {\n    let lines = output.lines().collect::<Vec<_>>();\n    let head_end = head_lines.min(lines.len());\n    let head = lines[..head_end].join(\"\\n\");\n    let tail_start = lines.len().saturating_sub(tail_lines).max(head_end);\n    let tail = lines[tail_start..].join(\"\\n\");\n    format!(\"{head}\\n\\n{tail}\")\n}\n```","locations":[{"ref":"crates/agent/src/tools/terminal_tool.rs:1216-1227","code":" 1216 |         (Some(head_lines), Some(tail_lines)) => {\n 1217 |             let lines = output.lines().collect::<Vec<_>>();\n 1218 |             let head = lines\n 1219 |                 .iter()\n 1220 |                 .take(head_lines)\n 1221 |                 .copied()\n 1222 |                 .collect::<Vec<_>>()\n 1223 |                 .join(\"\\n\");\n 1224 |             let tail_start = lines.len().saturating_sub(tail_lines);\n 1225 |             let tail = lines[tail_start..].join(\"\\n\");\n 1226 |             format!(\"{head}\\n\\n{tail}\")\n 1227 |         }","lines":12,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent/src/tools/terminal_tool.rs#L1216-L1227"}]},
{"id":"LOGIC_35","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"When terminal output was truncated, `process_content` reports the byte count using `content.len()` *after* the content has already been wrapped in a Markdown code fence (`` format!(\"```\\n{content}\\n```\") ``) and after it was `trim`med and line-selected. The reported number therefore includes the 8 bytes of fence markup and reflects the post-trim length rather than the actual number of bytes captured (the real cap is `COMMAND_OUTPUT_LIMIT` = 16 KiB), so the message \"The first N bytes\" misinforms the model about how much output was cut.","fix":"Capture the byte length of the actual (pre-fence) content and report that. Before:\n```rust\nlet content = format!(\"```\\n{content}\\n```\");\nlet content = if output.truncated {\n    format!(\n        \"Command output too long. The first {} bytes:\\n\\n{content}\",\n        content.len(),\n    )\n} else {\n    content\n};\n```\nAfter:\n```rust\nlet content_bytes = content.len();\nlet content = format!(\"```\\n{content}\\n```\");\nlet content = if output.truncated {\n    format!(\"Command output too long. The first {content_bytes} bytes:\\n\\n{content}\")\n} else {\n    content\n};\n```","locations":[{"ref":"crates/agent/src/tools/terminal_tool.rs:1269-1277","code":" 1269 |     let content = format!(\"```\\n{content}\\n```\");\n 1270 |     let content = if output.truncated {\n 1271 |         format!(\n 1272 |             \"Command output too long. The first {} bytes:\\n\\n{content}\",\n 1273 |             content.len(),\n 1274 |         )\n 1275 |     } else {\n 1276 |         content\n 1277 |     };","lines":9,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent/src/tools/terminal_tool.rs#L1269-L1277"}]},
{"id":"LOGIC_36","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`load_proxy_env` sets only one of `HTTP_PROXY` / `HTTPS_PROXY`, chosen by the scheme of\nthe proxy URL itself:\n```rust\nlet env_var = if proxy_url.scheme() == \"https\" {\n    \"HTTPS_PROXY\"\n} else {\n    \"HTTP_PROXY\"\n};\nenv.insert(env_var.to_owned(), proxy_url.to_string());\n```\nThe proxy URL's scheme describes how to *reach* the proxy, not which traffic to route\nthrough it. Agent servers overwhelmingly make outbound **HTTPS** calls. If the user\nconfigures an `http://...` or `socks5://...` proxy (a common setup), only `HTTP_PROXY`\nis exported and the agent's HTTPS requests bypass the proxy entirely. Conversely an\n`https://` proxy leaves `HTTP_PROXY` unset.","fix":"Export both variables so the single configured proxy applies to both protocols, e.g.:\n```rust\nif let Some(proxy_url) = &proxy_url {\n    let value = proxy_url.to_string();\n    env.insert(\"HTTP_PROXY\".to_owned(), value.clone());\n    env.insert(\"HTTPS_PROXY\".to_owned(), value.clone());\n    // and their lowercase variants if agents expect them\n    env.insert(\"http_proxy\".to_owned(), value.clone());\n    env.insert(\"https_proxy\".to_owned(), value);\n}\n```\n(Confirm against how Zed itself consumes `ProxySettings`, but the current single-variable\nbehavior is almost certainly not what's wanted for agent traffic.)","locations":[{"ref":"crates/agent_servers/src/agent_servers.rs:113-135","code":"  113 | pub fn load_proxy_env(cx: &mut App) -> HashMap<String, String> {\n  114 |     let proxy_url = cx\n  115 |         .read_global(|settings: &SettingsStore, _| settings.get::<ProxySettings>(None).proxy_url());\n  116 |     let mut env = HashMap::default();\n  117 | \n  118 |     if let Some(proxy_url) = &proxy_url {\n  119 |         let env_var = if proxy_url.scheme() == \"https\" {\n  120 |             \"HTTPS_PROXY\"\n  121 |         } else {\n  122 |             \"HTTP_PROXY\"\n  123 |         };\n  124 |         env.insert(env_var.to_owned(), proxy_url.to_string());\n  125 |     }\n  126 | \n  127 |     if let Some(no_proxy) = read_no_proxy_from_env() {\n  128 |         env.insert(\"NO_PROXY\".to_owned(), no_proxy);\n  129 |     } else if proxy_url.is_some() {\n  130 |         // We sometimes need local MCP servers that we don't want to proxy\n  131 |         env.insert(\"NO_PROXY\".to_owned(), \"localhost,127.0.0.1\".to_owned());\n  132 |     }\n  133 | \n  134 |     env\n  135 | }","lines":23,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_servers/src/agent_servers.rs#L113-L135"}]},
{"id":"LOGIC_37","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `ConfigureContextServerModal::confirm`, `wait_for_context_server_task` is spawned\nunconditionally before deciding whether anything will actually (re)start the server. If\n`settings_changed` is `false` AND `existing_server` is `None` (config already matches project\nsettings but no server instance is currently running, e.g. a previously stopped/crashed\nserver), neither the `if settings_changed` branch nor the `else if let Some(existing_server)`\nbranch runs, so nothing ever transitions the server to `Running`. The spawned wait task then\nblocks until the 120s `WAIT_TIMEOUT` and shows a `Timed out waiting for context server ... to\nstart` error toast even though the user did nothing wrong.","fix":"Only start the wait task when a start/restart is actually going to happen. Compute the\nstart/restart decision first, and if neither a settings write nor a `start_server` call is\nissued, either start the server explicitly or skip spawning `wait_for_context_server` and\ndismiss the modal immediately instead of waiting 120s for a transition that will never occur.","locations":[{"ref":"crates/agent_ui/src/agent_configuration/configure_context_server_modal.rs:603-668","code":"  603 |         self.state = State::Waiting;\n  604 | \n  605 |         let existing_server = self.context_server_store.read(cx).get_server(&id);\n  606 |         if existing_server.is_some() {\n  607 |             self.context_server_store.update(cx, |store, cx| {\n  608 |                 store.stop_server(&id, cx).log_err();\n  609 |             });\n  610 |         }\n  611 | \n  612 |         let wait_for_context_server_task =\n  613 |             wait_for_context_server(&self.context_server_store, id.clone(), cx);\n  614 |         cx.spawn({\n  615 |             let id = id.clone();\n  616 |             async move |this, cx| {\n  617 |                 let result = wait_for_context_server_task.await;\n  618 |                 this.update(cx, |this, cx| match result {\n  619 |                     Ok(ContextServerStatus::Running) => {\n  620 |                         this.state = State::Idle;\n  621 |                         this.show_configured_context_server_toast(id, cx);\n  622 |                         cx.emit(DismissEvent);\n  623 |                     }\n  624 |                     Ok(ContextServerStatus::AuthRequired) => {\n  625 |                         this.state = State::AuthRequired { server_id: id };\n  626 |                         cx.notify();\n  627 |                     }\n  628 |                     Ok(ContextServerStatus::ClientSecretRequired { error }) => {\n  629 |                         this.state = State::ClientSecretRequired {\n  630 |                             server_id: id,\n  631 |                             error: error.map(SharedString::from),\n  632 |                         };\n  633 |                         cx.notify();\n  634 |                     }\n  635 |                     Err(err) => {\n  636 |                         this.set_error(err, cx);\n  637 |                     }\n  638 |                     Ok(_) => {}\n  639 |                 })\n  640 |             }\n  641 |         })\n  642 |         .detach();\n  643 | \n  644 |         let settings_changed =\n  645 |             ProjectSettings::get_global(cx).context_servers.get(&id.0) != Some(&settings);\n  646 | \n  647 |         if settings_changed {\n  648 |             // When we write the settings to the file, the context server will be restarted.\n  649 |             workspace.update(cx, |workspace, cx| {\n  650 |                 let fs = workspace.app_state().fs.clone();\n  651 |                 let original_server_id = self.original_server_id.clone();\n  652 |                 update_settings_file(fs.clone(), cx, move |current, _| {\n  653 |                     if let Some(original_id) = original_server_id {\n  654 |                         if original_id != id {\n  655 |                             current.project.context_servers.remove(&original_id.0);\n  656 |                         }\n  657 |                     }\n  658 |                     current\n  659 |                         .project\n  660 |                         .context_servers\n  661 |                         .insert(id.0, settings.into());\n  662 |                 });\n  663 |             });\n  664 |         } else if let Some(existing_server) = existing_server {\n  665 |             self.context_server_store\n  666 |                 .update(cx, |store, cx| store.start_server(existing_server, cx));\n  667 |         }\n  668 |     }","lines":66,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/agent_configuration/configure_context_server_modal.rs#L603-L668"},{"ref":"crates/agent_ui/src/agent_configuration/configure_context_server_modal.rs:1176-1233","code":" 1176 | fn wait_for_context_server(\n 1177 |     context_server_store: &Entity<ContextServerStore>,\n 1178 |     context_server_id: ContextServerId,\n 1179 |     cx: &mut App,\n 1180 | ) -> Task<Result<ContextServerStatus, Arc<str>>> {\n 1181 |     use std::time::Duration;\n 1182 | \n 1183 |     const WAIT_TIMEOUT: Duration = Duration::from_secs(120);\n 1184 | \n 1185 |     let (tx, rx) = futures::channel::oneshot::channel();\n 1186 |     let tx = Arc::new(Mutex::new(Some(tx)));\n 1187 | \n 1188 |     let context_server_id_for_timeout = context_server_id.clone();\n 1189 |     let subscription = cx.subscribe(context_server_store, move |_, event, _cx| {\n 1190 |         let ServerStatusChangedEvent { server_id, status } = event;\n 1191 | \n 1192 |         if server_id != &context_server_id {\n 1193 |             return;\n 1194 |         }\n 1195 | \n 1196 |         match status {\n 1197 |             ContextServerStatus::Running\n 1198 |             | ContextServerStatus::AuthRequired\n 1199 |             | ContextServe {"id":"LOGIC_38","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `resolve_pasted_context_items`, when a pasted `ClipboardEntry::ExternalPaths` entry points at a file that `load_external_image_from_path` recognizes as an image, the code unconditionally `continue`s after attempting to add it as an image mention:\n```rust\nif let Some((image, name)) = cx.background_spawn(...).await {\n    if supports_images {\n        items.push(ResolvedPastedContextItem::Image(image, name));\n    }\n    continue;\n}\n```\nWhen `supports_images` is `false` (a non-vision model) but the project is local, `handle_pasted_context` does not early-return (its guard only bails on `!project_is_local && !supports_images`), so this branch is reached. The image is neither pushed as an image mention nor falls through to be resolved as a `ResolvedPastedContextItem::ProjectPath`, so pasting an image file silently does nothing. Additionally, `load_external_image_from_path` reads the entire file into memory even when `supports_images` is `false`, so the bytes are read only to be discarded.","fix":"Only attempt image loading when `supports_images` is true, and let non-image (or unsupported-image) paths fall through to project-path resolution. For example, gate the `load_external_image_from_path` call on `supports_images`, and when it returns `None` (or images are unsupported) continue to the `Workspace::project_path_for_path` branch so the file is still added as a `ProjectPath` reference instead of being dropped.","locations":[{"ref":"crates/agent_ui/src/message_editor.rs:336-373","code":"  336 |             ClipboardEntry::ExternalPaths(paths) => {\n  337 |                 for path in paths.paths().iter() {\n  338 |                     if let Some((image, name)) = cx\n  339 |                         .background_spawn({\n  340 |                             let path = path.clone();\n  341 |                             let default_image_name = default_image_name.clone();\n  342 |                             async move {\n  343 |                                 crate::mention_set::load_external_image_from_path(\n  344 |                                     &path,\n  345 |                                     &default_image_name,\n  346 |                                 )\n  347 |                             }\n  348 |                         })\n  349 |                         .await\n  350 |                     {\n  351 |                         if supports_images {\n  352 |                             items.push(ResolvedPastedContextItem::Image(image, name));\n  353 |                         }\n  354 |                         continue;\n  355 |                     }\n  356 | \n  357 |                     if !project_is_local {\n  358 |                         continue;\n  359 |                     }\n  360 | \n  361 |                     let path = path.clone();\n  362 |                     let Ok(resolve_task) = cx.update({\n  363 |                         let project = project.clone();\n  364 |                         move |_, cx| Workspace::project_path_for_path(project, &path, false, cx)\n  365 |                     }) else {\n  366 |                         continue;\n  367 |                     };\n  368 | \n  369 |                     if let Some((worktree, project_path)) = resolve_task.await.log_err() {\n  370 |                         added_worktrees.push(worktree);\n  371 |                         items.push(ResolvedPastedContextItem::ProjectPath(project_path));\n  372 |                     }\n  373 |                 }","lines":38,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/message_editor.rs#L336-L373"}]},
{"id":"LOGIC_39","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`insert_message_blocks` computes `insertion_start` as the current text length when appending:\n```rust\nlet insertion_start = if append_to_existing {\n    self.editor.read(cx).text(cx).len()\n} else {\n    0\n};\n```\nbut the actual insertion is done with `editor.insert(&text, ...)`, which inserts at the current selection/cursor, not necessarily at the end of the buffer. The subsequent crease anchors are then computed as `insertion_start + range.start`, which is only correct if the cursor is at the end of the buffer. If `append_message` is ever called while the cursor is not at the buffer end, the mention creases are placed at wrong offsets (pointing into pre-existing text rather than the freshly inserted block).","fix":"Capture the actual insertion offset from the insertion itself rather than assuming the buffer end. For example, record the cursor anchor before inserting and resolve it to an offset in the post-insert snapshot, or move the selection to the buffer end before `editor.insert` when `append_to_existing` is true, so `insertion_start` matches where `text` was actually inserted.","locations":[{"ref":"crates/agent_ui/src/message_editor.rs:1812-1836","code":" 1812 |         let insertion_start = if append_to_existing {\n 1813 |             self.editor.read(cx).text(cx).len()\n 1814 |         } else {\n 1815 |             0\n 1816 |         };\n 1817 | \n 1818 |         let snapshot = if append_to_existing {\n 1819 |             self.editor.update(cx, |editor, cx| {\n 1820 |                 editor.insert(&text, window, cx);\n 1821 |                 editor.buffer().read(cx).snapshot(cx)\n 1822 |             })\n 1823 |         } else {\n 1824 |             self.editor.update(cx, |editor, cx| {\n 1825 |                 editor.set_text(text, window, cx);\n 1826 |                 editor.buffer().read(cx).snapshot(cx)\n 1827 |             })\n 1828 |         };\n 1829 | \n 1830 |         for (range, mention_uri, mention) in mentions {\n 1831 |             let adjusted_start = insertion_start + range.start;\n 1832 |             let anchor = snapshot.anchor_before(MultiBufferOffset(adjusted_start));\n 1833 |             let image_preview = image_preview_task_for_mention(&mention);\n 1834 |             let Some((crease_id, tx, crease_entity)) = insert_crease_for_mention(\n 1835 |                 snapshot.anchor_to_buffer_anchor(anchor).unwrap().0,\n 1836 |                 range.end - range.start,","lines":25,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/message_editor.rs#L1812-L1836"}]},
{"id":"LOGIC_40","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"The importable-thread count shown per agent can exceed the number of threads\nactually imported. `count_importable_threads_by_agent` gives each agent its own\n`seen_sessions` set seeded from `existing_sessions`, so a session id that appears\nunder two different agents is counted once for *each* agent. In contrast,\n`collect_importable_threads` uses a single accumulating `existing_sessions` set\nshared across all agents, so the same session id is imported only once (the first\nagent wins). As a result, when a session id is shared across agents, the sum of the\ndisplayed `Ready { importable_count }` values (rendered as `\"{count} threads\"`) is\nlarger than the count actually imported. The tests `test_count_importable_threads_by_agent_counts_each_agent_independently`\n(counts `agent-a` = 1 and `agent-b` = 1 for a shared session) and\n`test_collect_deduplicates_across_agents` (collect yields 1) directly encode this\ndivergence.","fix":"Make the count logic match the import logic. Either dedup the count across agents\nusing a single shared `seen`/`existing` set (so a session shared across agents is\ncounted once, matching `collect_importable_threads`), or document that per-agent\ncounts are intentionally independent and reconcile the discrepancy in the UI. The\nstraightforward fix is to have `count_importable_threads_by_agent` use one\n`let mut seen = existing_sessions.clone();` shared across all agents instead of a\nper-agent `seen_sessions_by_agent` map.","locations":[{"ref":"crates/agent_ui/src/thread_import.rs:829","code":"  829 | fn count_importable_threads_by_agent(","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/thread_import.rs#L829"},{"ref":"crates/agent_ui/src/thread_import.rs:855","code":"  855 | fn collect_importable_threads(","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/thread_import.rs#L855"}]},
{"id":"LOGIC_41","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`ToMono` clamps its channel count to `MAX_CHANNELS` (8) in `new`, but for a source with more than 8 channels this desyncs frame alignment rather than dropping the extra channels. `ToMono::next` reads only `input_channel_count` (== clamped 8) samples per output sample via `self.inner.next()`, leaving the remaining channels of each interleaved frame unconsumed; the next call then starts mid-frame, permanently scrambling the channel interleaving for the rest of the stream. The `warn!(\"Ignoring input channels {}..\", channels.get())` message is also misleading: it prints the clamped count (8) and claims the channels are ignored, but they are in fact left in the stream and mis-read.","fix":"When the input has more channels than `MAX_CHANNELS`, still consume (and discard) the extra channels each frame so interleaving stays aligned: iterate over the true `input.channels()` count, summing only the first `MAX_CHANNELS` and calling `self.inner.next()` for the rest to drain them. Alternatively, store the real input channel count separately from the clamped `means`-index bound and drain the surplus per frame.","locations":[{"ref":"crates/audio/src/audio_pipeline/rodio_ext.rs:195-211","code":"  195 | impl<S: Source> ToMono<S> {\n  196 |     fn new(input: S) -> Self {\n  197 |         let channels = input\n  198 |             .channels()\n  199 |             .min(const { NonZero::<u16>::new(MAX_CHANNELS as u16).unwrap() });\n  200 |         if channels < input.channels() {\n  201 |             warn!(\"Ignoring input channels {}..\", channels.get());\n  202 |         }\n  203 | \n  204 |         Self {\n  205 |             connected_channels: channels,\n  206 |             input_channel_count: channels,\n  207 |             inner: input,\n  208 |             means: [TYPICAL_NOISE_FLOOR; MAX_CHANNELS],\n  209 |         }\n  210 |     }\n  211 | }","lines":17,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/audio/src/audio_pipeline/rodio_ext.rs#L195-L211"},{"ref":"crates/audio/src/audio_pipeline/rodio_ext.rs:243-251","code":"  243 |         for channel in 0..self.input_channel_count.get() as usize {\n  244 |             let sample = self.inner.next()?;\n  245 |             mono_sample += sample;\n  246 | \n  247 |             update_mean(&mut self.means[channel], sample);\n  248 |             if self.means[channel] > TYPICAL_NOISE_FLOOR / 10.0 {\n  249 |                 active_channels += 1;\n  250 |             }\n  251 |         }","lines":9,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/audio/src/audio_pipeline/rodio_ext.rs#L243-L251"}]},
{"id":"LOGIC_42","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`ReplayQueue::len` (used by `Replay::samples_ready`/`duration_ready`) relies on the invariant stated in the `last_chunk` doc comment (\"This is always equal to the size of the last element in the queue\"), but that invariant is never maintained during streaming: `push_normal` pushes full chunks into `inner` and never touches `last_chunk`, and `last_chunk` is only ever written by `push_last`, which fires once at end-of-stream. Consequently, while the source is active, `last_chunk` is empty and `len()` computes `inner.len().saturating_sub(1) * normal_chunk_len`, under-reporting the actually-poppable sample count by one full chunk (~100ms). Additionally, the samples stored in `last_chunk` are never returned by `Replay::next` (which only `pop`s from `inner`), so counting them in `len()` at end-of-stream mixes unreadable samples into the \"ready\" count.","fix":"Make the doc comment and the computation consistent with the actual data flow: either maintain the stated invariant (have `push_normal` also record the size of the last enqueued chunk) so `len()` is exact, or drop the `saturating_sub(1)` and the `last_chunk` term and compute the poppable count directly as `self.inner.len() * self.normal_chunk_len` (last chunk is not `pop`-able and should not be counted as ready).","locations":[{"ref":"crates/audio/src/audio_pipeline/rodio_ext.rs:305-332","code":"  305 | #[derive(Debug)]\n  306 | struct ReplayQueue {\n  307 |     inner: ArrayQueue<Vec<Sample>>,\n  308 |     normal_chunk_len: usize,\n  309 |     /// The last chunk in the queue may be smaller than\n  310 |     /// the normal chunk size. This is always equal to the\n  311 |     /// size of the last element in the queue.\n  312 |     /// (so normally chunk_size)\n  313 |     last_chunk: Mutex<Vec<Sample>>,\n  314 | }\n  315 | \n  316 | impl ReplayQueue {\n  317 |     fn new(queue_len: usize, chunk_size: usize) -> Self {\n  318 |         Self {\n  319 |             inner: ArrayQueue::new(queue_len),\n  320 |             normal_chunk_len: chunk_size,\n  321 |             last_chunk: Mutex::new(Vec::new()),\n  322 |         }\n  323 |     }\n  324 |     /// Returns the length in samples\n  325 |     fn len(&self) -> usize {\n  326 |         self.inner.len().saturating_sub(1) * self.normal_chunk_len\n  327 |             + self\n  328 |                 .last_chunk\n  329 |                 .lock()\n  330 |                 .expect(\"Self::push_last can not poison this lock\")\n  331 |                 .len()\n  332 |     }","lines":28,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/audio/src/audio_pipeline/rodio_ext.rs#L305-L332"}]},
{"id":"LOGIC_43","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"Several `with_context` closures pass a plain string literal that contains an unexpanded `{cmd}` placeholder, so the error message literally reads `... {cmd}` instead of any command detail (a `&str` literal is not a `format!`, and `cmd` is a `Command` which is not `Display`). Occurs at `crates/auto_update/src/auto_update.rs:1111` (`\"failed to extract: {cmd}\"`), `:1145` (`\"failed to rsync: {cmd}\"`), `:1180` (`\"failed to mount: {cmd}\"`), and `:1203` (`\"failed to rsync: {cmd}\"`).","fix":"Drop the bogus placeholder (or interpolate a real value). For example change\n`.with_context(|| \"failed to extract: {cmd}\")`\nto\n`.with_context(|| \"failed to run tar to extract the update\")`\nand similarly for the rsync/mount messages.","locations":[{"ref":"crates/auto_update/src/auto_update.rs:1139","code":" 1139 |         .with_context(|| \"failed to extract: {cmd}\")?;","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/auto_update/src/auto_update.rs#L1139"},{"ref":"crates/auto_update/src/auto_update.rs:1173","code":" 1173 |         .with_context(|| \"failed to rsync: {cmd}\")?;","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/auto_update/src/auto_update.rs#L1173"},{"ref":"crates/auto_update/src/auto_update.rs:1208","code":" 1208 |         .with_context(|| \"failed to mount: {cmd}\")?;","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/auto_update/src/auto_update.rs#L1208"},{"ref":"crates/auto_update/src/auto_update.rs:1231","code":" 1231 |     let output = rsync_output.with_context(|| \"failed to rsync: {cmd}\")?;","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/auto_update/src/auto_update.rs#L1231"}]},
{"id":"LOGIC_44","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`ActiveCall::accept_incoming` consumes the incoming call with `self.incoming_call.0.borrow_mut().take()` (lines 588-592) and only afterward checks `if self.pending_room_creation.is_some()` (line 594), returning `Task::ready(Ok(()))` without joining. Because the call was already `take`n, the pending incoming-call notification is discarded and cannot be retried once the in-flight room creation finishes; the user's incoming call silently disappears. The related guard in `join_channel` performs its `pending_room_creation` check before consuming any state.","fix":"Move the `pending_room_creation.is_some()` check before the `take()` of `incoming_call`, so the call is only consumed when it is actually being accepted. Alternatively, restore the taken call into `self.incoming_call` before the early `return Task::ready(Ok(()))`.","locations":[{"ref":"crates/call/src/call_impl/mod.rs:609-629","code":"  609 |     pub fn accept_incoming(&mut self, cx: &mut Context<Self>) -> Task<Result<()>> {\n  610 |         if self.room.is_some() {\n  611 |             return Task::ready(Err(anyhow!(\"cannot join while on another call\")));\n  612 |         }\n  613 | \n  614 |         let call = if let Some(call) = self.incoming_call.0.borrow_mut().take() {\n  615 |             call\n  616 |         } else {\n  617 |             return Task::ready(Err(anyhow!(\"no incoming call\")));\n  618 |         };\n  619 | \n  620 |         if self.pending_room_creation.is_some() {\n  621 |             return Task::ready(Ok(()));\n  622 |         }\n  623 | \n  624 |         let room_id = call.room_id;\n  625 |         let client = self.client.clone();\n  626 |         let user_store = self.user_store.clone();\n  627 |         let join = self\n  628 |             ._join_debouncer\n  629 |             .spawn(cx, move |cx| Room::join(room_id, client, user_store, cx));","lines":21,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/call/src/call_impl/mod.rs#L609-L629"}]},
{"id":"LOGIC_45","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`ChannelStore::handle_disconnect` schedules the buffer-disconnect task with\n`self.disconnect_channel_buffers_task.get_or_insert_with(...)`. If a transient disconnect\n(`wait_for_reconnect = true`) runs first, it installs a task that waits `RECONNECT_TIMEOUT` (30s)\nbefore disconnecting buffers. If a hard `SignedOut`/`UpgradeRequired` (`wait_for_reconnect = false`)\narrives afterwards, `get_or_insert_with` sees the existing task and does nothing, so buffers stay in\nthe connected state for up to the remaining 30s instead of disconnecting immediately as the\n`wait_for_reconnect = false` branch intends.","fix":"When `wait_for_reconnect` is `false`, replace any pending delayed task rather than deferring to it,\ne.g. take/reset `self.disconnect_channel_buffers_task` before inserting, or only use\n`get_or_insert_with` for the `wait_for_reconnect == true` case and always (re)install an immediate\ntask otherwise.","locations":[{"ref":"crates/channel/src/channel_store.rs:1024-1042","code":" 1024 |         self.disconnect_channel_buffers_task.get_or_insert_with(|| {\n 1025 |             cx.spawn(async move |this, cx| {\n 1026 |                 if wait_for_reconnect {\n 1027 |                     cx.background_executor().timer(RECONNECT_TIMEOUT).await;\n 1028 |                 }\n 1029 | \n 1030 |                 if let Some(this) = this.upgrade() {\n 1031 |                     this.update(cx, |this, cx| {\n 1032 |                         for buffer in this.opened_buffers.values() {\n 1033 |                             if let OpenEntityHandle::Open(buffer) = &buffer\n 1034 |                                 && let Some(buffer) = buffer.upgrade()\n 1035 |                             {\n 1036 |                                 buffer.update(cx, |buffer, cx| buffer.disconnect(cx));\n 1037 |                             }\n 1038 |                         }\n 1039 |                     });\n 1040 |                 }\n 1041 |             })\n 1042 |         });","lines":19,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/channel/src/channel_store.rs#L1024-L1042"}]},
{"id":"LOGIC_46","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`Telemetry::log_edit_event` throttles reporting to at most once per 10 minutes, but it computes the\ncoalesced `period_data` on *every* call and then, when inside the throttle window, `return`s early and\ndiscards it. Because `event_coalescer.log_event` mutates its internal state (it starts a new period\nwhen the environment changes or the timeout elapses and returns the just-completed period as\n`period_data`), a completed edit period that resolves during the throttle window is silently dropped\nand never reported, systematically losing `Editor Edited` telemetry rather than merely rate-limiting it.","fix":"Report `period_data` whenever it is `Some` (that is what represents a completed period), and apply the\n10-minute throttle only to the rate of emission, rather than dropping already-completed periods. For\nexample, evaluate `period_data` and send the event before the early `return`, or accumulate dropped\nperiods so they are not lost.","locations":[{"ref":"crates/client/src/telemetry.rs:418-449","code":"  418 |     pub fn log_edit_event(self: &Arc<Self>, environment: &'static str, is_via_ssh: bool) {\n  419 |         static LAST_EVENT_TIME: Mutex<Option<Instant>> = Mutex::new(None);\n  420 | \n  421 |         let mut state = self.state.lock();\n  422 |         let period_data = state.event_coalescer.log_event(environment);\n  423 |         drop(state);\n  424 | \n  425 |         if let Some(mut last_event) = LAST_EVENT_TIME.try_lock() {\n  426 |             let current_time = std::time::Instant::now();\n  427 |             let last_time = last_event.get_or_insert(current_time);\n  428 | \n  429 |             if current_time.duration_since(*last_time) > Duration::from_secs(60 * 10) {\n  430 |                 *last_time = current_time;\n  431 |             } else {\n  432 |                 return;\n  433 |             }\n  434 | \n  435 |             if let Some((start, end, environment)) = period_data {\n  436 |                 let duration = end\n  437 |                     .saturating_duration_since(start)\n  438 |                     .min(Duration::from_secs(60 * 60 * 24))\n  439 |                     .as_millis() as i64;\n  440 | \n  441 |                 telemetry::event!(\n  442 |                     \"Editor Edited\",\n  443 |                     duration = duration,\n  444 |                     environment = environment,\n  445 |                     is_via_ssh = is_via_ssh\n  446 |                 );\n  447 |             }\n  448 |         }\n  449 |     }","lines":32,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/client/src/telemetry.rs#L418-L449"}]},
{"id":"LOGIC_47","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"When recording the last observed operation in `join_channel_buffer`, the `on_conflict` clause only updates `Epoch` and `LamportTimestamp`, but not `ReplicaId`. The row is inserted with `replica_id`, `epoch`, and `lamport_timestamp` all taken from `max_operation`, so on a fresh insert the tuple is consistent. However, when a row for `(user_id, buffer_id)` already exists, the update leaves the stale `replica_id` in place while advancing `epoch`/`lamport_timestamp`, producing an inconsistent `(epoch, lamport_timestamp, replica_id)` tuple for the observed version. The canonical writer `save_max_operation` (same file) correctly updates all three columns. This can desynchronize the per-user \"observed\" marker used for channel-buffer unread indicators.","fix":"Include `ReplicaId` in the updated columns so the whole tuple stays consistent on conflict:\n```rust\n.update_columns([\n    observed_buffer_edits::Column::Epoch,\n    observed_buffer_edits::Column::LamportTimestamp,\n    observed_buffer_edits::Column::ReplicaId,\n])\n```\n(Consider also mirroring the `action_cond_where` guard from `save_max_operation` so the marker is only advanced, never moved backward.)","locations":[{"ref":"crates/collab/src/db/queries/buffers.rs:93-105","code":"   93 |                 .on_conflict(\n   94 |                     OnConflict::columns([\n   95 |                         observed_buffer_edits::Column::UserId,\n   96 |                         observed_buffer_edits::Column::BufferId,\n   97 |                     ])\n   98 |                     .update_columns([\n   99 |                         observed_buffer_edits::Column::Epoch,\n  100 |                         observed_buffer_edits::Column::LamportTimestamp,\n  101 |                     ])\n  102 |                     .to_owned(),\n  103 |                 )\n  104 |                 .exec(&*tx)\n  105 |                 .await?;","lines":13,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/collab/src/db/queries/buffers.rs#L93-L105"}]},
{"id":"LOGIC_48","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`record_extension_download` looks up the extension by external id, then runs an `update_many` on `extension_version` incrementing `download_count` filtered by `(ExtensionId, Version)`. If the supplied `version` does not exist that update affects zero rows, but the code unconditionally proceeds to increment `extension::Column::TotalDownloadCount` (filtered only by extension id) and returns `Ok(true)`. As a result a client can inflate an extension's aggregate `total_download_count` by requesting downloads of non-existent version strings, and the `true` return value misreports success even though no concrete version was recorded.","fix":"Capture `rows_affected` from the `extension_version` update and only increment `TotalDownloadCount` / return `true` when a matching version row was actually updated; otherwise return `Ok(false)` (or an error) without bumping the total.","locations":[{"ref":"crates/collab/src/db/queries/extensions.rs:341-363","code":"  341 |             extension_version::Entity::update_many()\n  342 |                 .col_expr(\n  343 |                     extension_version::Column::DownloadCount,\n  344 |                     extension_version::Column::DownloadCount.into_expr().add(1),\n  345 |                 )\n  346 |                 .filter(\n  347 |                     extension_version::Column::ExtensionId\n  348 |                         .eq(extension_id)\n  349 |                         .and(extension_version::Column::Version.eq(version)),\n  350 |                 )\n  351 |                 .exec(&*tx)\n  352 |                 .await?;\n  353 | \n  354 |             extension::Entity::update_many()\n  355 |                 .col_expr(\n  356 |                     extension::Column::TotalDownloadCount,\n  357 |                     extension::Column::TotalDownloadCount.into_expr().add(1),\n  358 |                 )\n  359 |                 .filter(extension::Column::Id.eq(extension_id))\n  360 |                 .exec(&*tx)\n  361 |                 .await?;\n  362 | \n  363 |             Ok(true)","lines":23,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/collab/src/db/queries/extensions.rs#L341-L363"}]},
{"id":"LOGIC_49","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `CollabPanel::update_entries`, the `has_children` flag for each rendered channel is computed with `channel_store.channel_at_index(idx + 1)`, but `idx` is the enumeration index over the *filtered* `channels` vector, not the channel store's ordered index. Earlier the vector is filtered via `channels.retain(|chan| channel_ids_of_matches_or_parents.contains(&chan.id))` and, when `self.filter_occupied_channels` is enabled, a second `channels.retain(...)`. After a `retain` removes elements, `idx` no longer aligns with the store's ordered index, so `channel_at_index(idx + 1)` looks up the wrong channel and `has_children` (used to draw the disclosure arrow and to gate collapse/expand) becomes incorrect. In the common case (empty query, `filter_occupied_channels` off) `match_strings` with an empty query matches everything and nothing is retained away, so `idx` happens to align; the bug manifests once the list is filtered (notably with the \"Show Occupied Channels\" toggle).","fix":"Compute `has_children` from the same filtered/ordered data used to build the entries rather than from `channel_store.channel_at_index(idx + 1)`. For example, capture the full ordered channel list and look up the channel's real store index by `channel.id` (or precompute a `has_children` map over the unfiltered ordered channels keyed by `ChannelId`), then index that map with `channel.id` inside the loop.","locations":[{"ref":"crates/collab_ui/src/collab_panel.rs:887","code":"  887 |                 let has_children = channel_store","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/collab_ui/src/collab_panel.rs#L887"}]},
{"id":"LOGIC_50","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`fetch_auth_server_metadata` guards against an issuer-substitution attack by rejecting a response whose `issuer` differs from the requested one, but it derives the compared value with `response.issuer.unwrap_or_else(|| issuer.clone())`. When a server omits the `issuer` field entirely, the code substitutes the requested issuer, so the `reported_issuer != *issuer` check can never fail and the validation is bypassed. RFC 8414 requires `issuer` to be present in authorization-server metadata, so a missing field should be rejected rather than silently accepted.","fix":"Treat a missing `issuer` as an error instead of defaulting to the requested value: `let reported_issuer = response.issuer.ok_or_else(|| anyhow!(\"auth server metadata missing issuer\"))?;` before performing the mismatch comparison.","locations":[{"ref":"crates/context_server/src/oauth.rs:824","code":"  824 |                 let reported_issuer = response.issuer.unwrap_or_else(|| issuer.clone());","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/context_server/src/oauth.rs#L824"}]},
{"id":"LOGIC_51","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`JsDebugAdapter::get_binary` gates the version check/download behind `if self.checked.set(()).is_ok()`,\nwhich succeeds only once for the lifetime of the adapter instance. If that single attempt fails to\ndownload (network error), `checked` is already set, so no later `get_binary` call will retry the\ndownload; every subsequent session then fails in `get_installed_binary` with \"Couldn't find\nJavaScript dap directory\" until Zed is restarted. A transient failure is turned into a persistent one.","fix":"Only mark `checked` as done after a successful download, so failures allow a retry. For example set\nthe `OnceLock` inside the success branch (after `download_adapter_from_github(...).await?` succeeds),\nor track success/failure explicitly rather than \"attempted\".","locations":[{"ref":"crates/dap_adapters/src/javascript.rs:511-524","code":"  511 |         if self.checked.set(()).is_ok() {\n  512 |             delegate.output_to_console(format!(\"Checking latest version of {}...\", self.name()));\n  513 |             if let Some(version) = self.fetch_latest_adapter_version(delegate).await.log_err() {\n  514 |                 adapters::download_adapter_from_github(\n  515 |                     self.name(),\n  516 |                     version,\n  517 |                     adapters::DownloadedFileType::GzipTar,\n  518 |                     delegate.as_ref(),\n  519 |                 )\n  520 |                 .await?;\n  521 |             } else {\n  522 |                 delegate.output_to_console(format!(\"{} debug adapter is up to date\", self.name()));\n  523 |             }\n  524 |         }","lines":14,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/dap_adapters/src/javascript.rs#L511-L524"}]},
{"id":"LOGIC_52","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`base_venv_path` and `fetch_debugpy_whl` cache their result in a `OnceCell` via `get_or_init`, and the closures return `Result<..., String>`. `get_or_init` stores whatever the closure returns, including an `Err`. A transient failure (for example no Python interpreter found on first use, or a failed venv creation) is therefore cached for the lifetime of the process, and every subsequent debug attempt returns the same stale error even after the user installs Python or fixes the environment - the adapter never retries.","fix":"Only cache successful results. For example, do not populate the `OnceCell` on error (compute the value manually and store it only on `Ok`), or wrap the value so failures can be re-attempted, so a later debug session can recover once the environment is fixed.","locations":[{"ref":"crates/dap_adapters/src/python.rs:258","code":"  258 |         let result = self.base_venv_path","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/dap_adapters/src/python.rs#L258"},{"ref":"crates/dap_adapters/src/python.rs:225","code":"  225 |         self.debugpy_whl_base_path","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/dap_adapters/src/python.rs#L225"}]},
{"id":"LOGIC_53","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`clean_sessions` intends to keep up to 10 terminated sessions per project but has two problems. (1) Off-by-one: starting `allowed_terminated_sessions` at `10` and decrementing before the `> 0` check keeps only 9 terminated sessions, not 10. (2) Wrong end kept: `debug_sessions` is a `BTreeMap<SessionId, _>` so `retain` visits sessions in ascending id order (oldest first); the first terminated sessions encountered (the oldest) are kept and newer terminated sessions are dropped. A session the user just terminated can be evicted while stale older ones remain, which is the opposite of what a log/history view wants.","fix":"Iterate terminated sessions newest-first (e.g. reverse iteration over the BTreeMap keys, or collect and drop the oldest above the cap) and fix the off-by-one so exactly 10 are retained. For example decrement after the check, or initialize the counter to keep the intended count and retain the most recent terminated sessions rather than the oldest.","locations":[{"ref":"crates/debugger_tools/src/dap_log.rs:454","code":"  454 |     fn clean_sessions(&mut self, cx: &mut Context<Self>) {","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/debugger_tools/src/dap_log.rs#L454"}]},
{"id":"LOGIC_54","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"The `SessionEvent::CapabilitiesLoaded` handler removes the `Modules` and `LoadedSources` pane items when the adapter does not advertise `supports_modules_request` / `supports_loaded_sources_request`, but it does not remove the `MemoryView` item even though `DebuggerPaneItem::is_supported` gates `MemoryView` on `supports_read_memory_request` (`crates/debugger_ui/src/persistence.rs:48`). A `MemoryView` tab restored from a serialized layout (`deserialize_pane_layout` does not filter by capabilities) can therefore persist against an adapter that does not support memory reads, leaving a non-functional tab. This looks like a missed case relative to the two kinds already handled.","fix":"Add a `MemoryView` removal branch mirroring the existing ones:\n```rust\nif !capabilities.supports_read_memory_request.unwrap_or(false) {\n    this.remove_pane_item(DebuggerPaneItem::MemoryView, window, cx);\n}\n```","locations":[{"ref":"crates/debugger_ui/src/session/running.rs:917","code":"  917 |                     SessionEvent::CapabilitiesLoaded => {","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/debugger_ui/src/session/running.rs#L917"}]},
{"id":"LOGIC_55","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"During streaming, when the accumulated query resolves to multiple equally-good\nambiguous matches and there is no line hint (`line_hint` is always `None` in\nproduction), `select_best_match` returns `None`, but `push` then falls back to\n`self.matches.first()` and returns that range anyway. Downstream in\n`EditPipeline::process_event` this preview range drives `diff.reveal_range` and\n`set_agent_location`, so the editor view can jump to an arbitrary (the first)\nof several unrelated candidate locations mid-stream, even though the edit will\nultimately fail with a \"matched multiple locations\" error. Cosmetic, but it can\nscroll the user to a misleading spot.","fix":"For the streaming preview, prefer not to reveal/relocate when the match is\nambiguous (i.e. propagate `select_best_match()`'s `None` instead of\n`.or_else(|| self.matches.first()...)`), or only fall back to `first()` when\nthere is exactly one match.","locations":[{"ref":"crates/agent/src/tools/edit_session/streaming_fuzzy_matcher.rs:84-90","code":"   84 |         let best_match = self.select_best_match();\n   85 |         best_match.or_else(|| {\n   86 |             self.matches\n   87 |                 .first()\n   88 |                 .map(|search_match| search_match.range.clone())\n   89 |         })\n   90 |     }","lines":7,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent/src/tools/edit_session/streaming_fuzzy_matcher.rs#L84-L90"},{"ref":"crates/agent/src/tools/edit_session.rs:480-490","code":"  480 |                     if let Some(match_range) = matcher.push(chunk, None) {\n  481 |                         let anchor_range = buffer.read_with(cx, |buffer, _cx| {\n  482 |                             buffer.anchor_range_outside(match_range.clone())\n  483 |                         });\n  484 |                         diff.update(cx, |diff, cx| diff.reveal_range(anchor_range, cx));\n  485 | \n  486 |                         cx.update(|cx| {\n  487 |                             let position = buffer.read(cx).anchor_before(match_range.end);\n  488 |                             context.set_agent_location(buffer.downgrade(), position, cx);\n  489 |                         });\n  490 |                     }","lines":11,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent/src/tools/edit_session.rs#L480-L490"}]},
{"id":"LOGIC_56","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"Both `LocationDisplay::from_location` and `SymbolLocator::resolve` derive the `truncated` flag from the raw line length (`line_len as usize > MAX_LINE_DISPLAY_LEN`), but the displayed snippet is produced by first `skip_while`ing leading whitespace and then `take(MAX_LINE_DISPLAY_LEN)` characters and `trim_end`ing. A line whose length exceeds `MAX_LINE_DISPLAY_LEN` only because of leading/trailing whitespace (with fewer than `MAX_LINE_DISPLAY_LEN` non-whitespace chars) will be labeled `(truncated)` even though the snippet actually shows the entire meaningful content, mislabeling the output.","fix":"Base `truncated` on whether the post-skip content actually exceeds the limit rather than on the raw `line_len`. For example, collect the trimmed/limited snippet first and set `truncated` by peeking one extra char, or compute the count of non-whitespace-prefixed characters and compare that to `MAX_LINE_DISPLAY_LEN`, so the flag matches what is really shown.","locations":[{"ref":"crates/agent/src/tools/symbol_locator.rs:66-74","code":"   66 |         let line_len = snapshot.line_len(range.start.row);\n   67 |         let truncated = line_len as usize > MAX_LINE_DISPLAY_LEN;\n   68 |         let snippet: String = snapshot\n   69 |             .text_for_range(Point::new(range.start.row, 0)..Point::new(range.start.row, line_len))\n   70 |             .flat_map(|chunk| chunk.chars())\n   71 |             .skip_while(|c| c.is_whitespace())\n   72 |             .take(MAX_LINE_DISPLAY_LEN)\n   73 |             .collect::<String>();\n   74 |         let snippet = snippet.trim_end().to_string();","lines":9,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent/src/tools/symbol_locator.rs#L66-L74"},{"ref":"crates/agent/src/tools/symbol_locator.rs:179-206","code":"  179 |             let line_len = snapshot.line_len(row);\n  180 |             let truncated = line_len as usize > MAX_LINE_DISPLAY_LEN;\n  181 |             let line_start = Point::new(row, 0);\n  182 |             let line_end = Point::new(row, line_len);\n  183 |             let line_chars = || {\n  184 |                 snapshot\n  185 |                     .text_for_range(line_start..line_end)\n  186 |                     .flat_map(|chunk| chunk.chars())\n  187 |             };\n  188 | \n  189 |             let byte_offset = find_in_char_iter(line_chars(), symbol_name).ok_or_else(|| {\n  190 |                 let preview: String = line_chars()\n  191 |                     .skip_while(|c| c.is_whitespace())\n  192 |                     .take(MAX_LINE_DISPLAY_LEN)\n  193 |                     .collect();\n  194 |                 format!(\n  195 |                     \"Symbol '{symbol_name}' not found on line {line} of '{file_path}'. \\\n  196 |                      Line content: '{}'\",\n  197 |                     preview.trim_end()\n  198 |                 )\n  199 |             })?;\n  200 | \n  201 |             let position = snapshot.anchor_before(Point::new(row, byte_offset as u32));\n  202 |             let display_text: String = line_chars()\n  203 |                 .skip_while(|c| c.is_whitespace())\n  204 |                 .take(MAX_LINE_DISPLAY_LEN)\n  205 |                 .collect::<String>();\n  206 |             let display_text = display_text.trim_end().to_string();","lines":28,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent/src/tools/symbol_locator.rs#L179-L206"}]},
{"id":"LOGIC_57","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"In `ToolPickerDelegate::render_match`, the top-border separator for context-server headers is gated on `.when(ix > 1, ...)`. The intent appears to be \"draw a divider above every server header except the first\". Using `ix > 1` is a fragile positional heuristic tied to the assumption that the first header is at index 0 and headers never appear at index 1; a header rendered at filtered index 1 would silently lose its divider. It should key off whether this is the first server group, not a hardcoded index.","fix":"Compute whether this is the first `ContextServer` item (e.g. compare `ix` to the index of the first `ContextServer` in `filtered_items`, or `ix > 0`) rather than the magic `ix > 1`.","locations":[{"ref":"crates/agent_ui/src/agent_configuration/tool_picker.rs:342-351","code":"  342 |             PickerItem::ContextServer { server_id, .. } => Some(\n  343 |                 div()\n  344 |                     .px_2()\n  345 |                     .pb_1()\n  346 |                     .when(ix > 1, |this| {\n  347 |                         this.mt_1()\n  348 |                             .pt_2()\n  349 |                             .border_t_1()\n  350 |                             .border_color(cx.theme().colors().border_variant)\n  351 |                     })","lines":10,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/agent_configuration/tool_picker.rs#L342-L351"}]},
{"id":"LOGIC_58","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"`humanize_token_count` renders values just under one million into the `k` bucket without rolling over to `M`. For `count == 999_999`, the branch `10_000..=999_999` computes `(count + 500) / 1000 == 1000`, producing `1000k` instead of `1M`. The `M` buckets handle their own rollover (via the `hundred_thousands == 10` check), but the `k` bucket does not, so the top of the `k` range yields an inconsistent `1000k` string.","fix":"Guard the rollover in the `k` bucket, e.g. compute `let rounded = (count + 500) / 1000;` and if `rounded >= 1000` format as `1M` (`format!(\"{}M\", rounded / 1000)`), otherwise `format!(\"{}k\", rounded)`. Alternatively lower the upper bound of this arm to `998_999` and let the millions arm handle the remainder.","locations":[{"ref":"crates/agent_ui/src/agent_ui.rs:564","code":"  564 |         10_000..=999_999 => format!(\"{}k\", (count + 500) / 1000),","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/agent_ui.rs#L564"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"Two arms of the `query!` macro capture a `$vis:vis` visibility specifier but then hardcode `pub` in the generated function instead of expanding `$vis`. Every other arm of the macro correctly forwards `$vis`. As a result, a query declared without `pub` (i.e. intended to be private, as `write_kvp_inner` is elsewhere) that happens to match one of these two shapes is silently promoted to `pub`, leaking it into the public API.\nThe affected shapes are:\n- `async fn $id() -> Result<Vec<$return_type>>` (line 91-92)\n- `fn $id($arg: $arg_type) -> Result<$return_type>` (line 254-255)","fix":"Replace the hardcoded `pub` with `$vis` in both arms.\nAt line 92:\n```\npub async fn $id(&self) -> $crate::anyhow::Result<Vec<$return_type>> {\n```\nbecomes\n```\n$vis async fn $id(&self) -> $crate::anyhow::Result<Vec<$return_type>> {\n```\nAt line 255:\n```\npub fn $id(&self, $arg: $arg_type) ->  $crate::anyhow::Result<$return_type>  {\n```\nbecomes\n```\n$vis fn $id(&self, $arg: $arg_type) ->  $crate::anyhow::Result<$return_type>  {\n```","locations":[{"ref":"crates/db/src/query.rs:91","code":"   91 |     ($vis:vis async fn $id:ident() -> Result<Vec<$return_type:ty>> { $($sql:tt)+ }) => {","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/db/src/query.rs#L91"},{"ref":"crates/db/src/query.rs:254","code":"  254 |     ($vis:vis fn $id:ident($arg:ident: $arg_type:ty) ->  Result<$return_type:ty> { $($sql:tt)+ }) => {","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/db/src/query.rs#L254"}]},
{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"The Moonshot models use inconsistent vendor prefixes in `request_id`: `KimiK2Thinking => \"moonshot.kimi-k2-thinking\"` (`crates/bedrock/src/models.rs:360`) versus `KimiK2_5 => \"moonshotai.kimi-k2.5\"` (`:361`). Every other model family uses a single consistent vendor prefix (e.g. `minimax.`, `zai.`, `deepseek.`). This looks like a copy/paste typo in one of the two prefixes; if the Bedrock model id is wrong, requests for that model will fail. The correct AWS id should be confirmed against the Bedrock model catalog.","fix":"Make the Moonshot vendor prefix consistent once the correct Bedrock id is confirmed (either `moonshot.kimi-k2.5` or `moonshotai.kimi-k2-thinking`), so both Kimi entries use the same vendor namespace.","locations":[{"ref":"crates/bedrock/src/models.rs:371-372","code":"  371 |             Self::KimiK2Thinking => \"moonshot.kimi-k2-thinking\",\n  372 |             Self::KimiK2_5 => \"moonshotai.kimi-k2.5\",","lines":2,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/bedrock/src/models.rs#L371-L372"}]},
{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"`ChannelStore::handle_connect` calls `self.channel_index.clear();` twice: once at the start of the\nfunction and again three lines later. The second call is redundant dead code (the index was already\ncleared and nothing in between repopulates it).","fix":"Remove the duplicate call. Change:\n```rust\n        self.channel_index.clear();\n        self.channel_invitations.clear();\n        self.channel_participants.clear();\n        self.channel_index.clear();\n        self.outgoing_invites.clear();\n```\nto:\n```rust\n        self.channel_index.clear();\n        self.channel_invitations.clear();\n        self.channel_participants.clear();\n        self.outgoing_invites.clear();\n```","locations":[{"ref":"crates/channel/src/channel_store.rs:878-882","code":"  878 |         self.channel_index.clear();\n  879 |         self.channel_invitations.clear();\n  880 |         self.channel_participants.clear();\n  881 |         self.channel_index.clear();\n  882 |         self.outgoing_invites.clear();","lines":5,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/channel/src/channel_store.rs#L878-L882"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`AgentProfile::create` reports success even when the underlying settings write fails.\nIt calls `save_to_settings(id, settings).log_err()` inside `update_settings_file` and then\nunconditionally returns `id` to the caller. `save_to_settings` `bail!`s with `profile with ID\n'{profile_id}' already exists` whenever a profile with the slugified id is already present, so\nif the user picks a name that kebab-cases to an existing profile id (e.g. `Write` -> `write`,\nor two names that both slug to `my-profile`), the new profile is silently NOT created, the\nerror is only logged, and `create` still hands back an `AgentProfileId` that actually points at\nthe pre-existing, differently-configured profile. The UI then treats creation as successful and\nmay switch the active profile to one with unexpected contents. This violates the project rule\nthat async/settings failures should surface to the UI.","fix":"Propagate the collision/failure to the caller instead of swallowing it. For example have\n`create` return `anyhow::Result<AgentProfileId>` (or detect the collision up front against\n`AgentSettings::get_global(cx).profiles`) and only return the id after confirming the write\nwill succeed, so the UI can show an error like `a profile named X already exists`. At minimum,\ndo not `.log_err()` and return `id` as if creation succeeded when\n`profiles.contains_key(&profile_id.0)`.","locations":[{"ref":"crates/agent_settings/src/agent_profile.rs:82-89","code":"   82 |         update_settings_file(fs, cx, {\n   83 |             let id = id.clone();\n   84 |             move |settings, _cx| {\n   85 |                 profile_settings.save_to_settings(id, settings).log_err();\n   86 |             }\n   87 |         });\n   88 | \n   89 |         id","lines":8,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5
