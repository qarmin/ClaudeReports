{"id":"ARCH_6","type":"architecture","type_label":"Architecture","severity":"negligible","difficulty":"easy","description":"There are two different functions named `ensure_buffer_saved` in the same\nmodule with different signatures and semantics: a method on\n`EditSessionContext` (formats-on-save then saves the buffer and logs the edit,\ncalled from `run_session`) and a free function (checks the dirty/mtime state and\nresolves a dirty buffer before an edit session starts, called from\n`EditSession::new`). The identical name obscures which one is meant at each call\nsite and invites confusion during maintenance.","fix":"Rename one of them to reflect its role, e.g. the free function to\n`prepare_buffer_for_edit` / `resolve_stale_or_dirty_buffer` and keep\n`ensure_buffer_saved` only for the \"format + save\" method (or vice versa).","locations":[{"ref":"crates/agent/src/tools/edit_session.rs:186-215","code":"  186 |     async fn ensure_buffer_saved(&self, buffer: &Entity<Buffer>, cx: &mut AsyncApp) {\n  187 |         let format_on_save_enabled = buffer.read_with(cx, |buffer, cx| {\n  188 |             let settings = language_settings::LanguageSettings::for_buffer(buffer, cx);\n  189 |             settings.format_on_save != FormatOnSave::Off\n  190 |         });\n  191 | \n  192 |         if format_on_save_enabled {\n  193 |             self.project\n  194 |                 .update(cx, |project, cx| {\n  195 |                     project.format(\n  196 |                         HashSet::from_iter([buffer.clone()]),\n  197 |                         LspFormatTarget::Buffers,\n  198 |                         false,\n  199 |                         FormatTrigger::Save,\n  200 |                         cx,\n  201 |                     )\n  202 |                 })\n  203 |                 .await\n  204 |                 .log_err();\n  205 |         }\n  206 | \n  207 |         self.project\n  208 |             .update(cx, |project, cx| project.save_buffer(buffer.clone(), cx))\n  209 |             .await\n  210 |             .log_err();\n  211 | \n  212 |         self.action_log.update(cx, |log, cx| {\n  213 |             log.buffer_edited(buffer.clone(), cx);\n  214 |         });\n  215 |     }","lines":30,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent/src/tools/edit_session.rs#L186-L215"},{"ref":"crates/agent/src/tools/edit_session.rs:1028-1056","code":" 1028 | async fn ensure_buffer_saved(\n 1029 |     buffer: &Entity<Buffer>,\n 1030 |     abs_path: &PathBuf,\n 1031 |     mode: EditSessionMode,\n 1032 |     context: &EditSessionContext,\n 1033 |     event_stream: &ToolCallEventStream,\n 1034 |     cx: &mut AsyncApp,\n 1035 | ) -> Result<bool, String> {\n 1036 |     let last_read_mtime = context\n 1037 |         .action_log\n 1038 |         .read_with(cx, |log, _| log.file_read_time(abs_path));\n 1039 |     let (current_mtime, is_dirty) = buffer.read_with(cx, |buffer, _cx| {\n 1040 |         let current = buffer.file().and_then(|file| file.disk_state().mtime());\n 1041 |         let dirty = buffer.is_dirty();\n 1042 |         (current, dirty)\n 1043 |     });\n 1044 | \n 1045 |     if is_dirty {\n 1046 |         resolve_dirty_buffer(buffer, mode, context, event_stream, cx).await?;\n 1047 |     }\n 1048 | \n 1049 |     if let (Some(last_read), Some(current)) = (last_read_mtime, current_mtime)\n 1050 |         && current != last_read\n 1051 |     {\n 1052 |         return Ok(true);\n 1053 |     }\n 1054 | \n 1055 |     Ok(false)\n 1056 | }","lines":29,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent/src/tools/edit_session.rs#L1028-L1056"}]},
{"id":"OTHER_1","type":"other","type_label":"Other","severity":"high","difficulty":"easy","description":"`extract_url_pattern` builds an unanchored regex prefix for the FetchTool \"always allow\" permission rule, so an approved domain also matches any attacker-controlled domain that merely *starts with* the approved string. For `https://github.com/...` the generated pattern is `^https?://github\\.com` with no terminating delimiter. Because it is later matched with `is_match` (see `tool_permissions.rs` `rules.always_allow.iter().any(|r| r.is_match(&command))`), it matches every one of these hostile URLs:\n- `https://github.com.evil.com/...` (suffix appended)\n- `https://github.company.io/...` (the literal `com` in the pattern matches the `com` prefix of `company`)\nSo approving fetches to `github.com` silently authorizes fetches to `github.company.io` and `github.com.evil.com`, defeating the network permission control. The path-pattern generator avoids this by appending a trailing `/`, but the URL generator has no such delimiter.","fix":"Anchor the end of the host with a delimiter (path separator, port, or end-of-string) so a prefix of a longer host can't match. For example:\n```rust\npub fn extract_url_pattern(url: &str) -> Option<String> {\n    let parsed = Url::parse(url).ok()?;\n    let domain = parsed.host_str()?;\n    Some(format!(\"^https?://{}(?:[:/]|$)\", escape_for_pattern(domain)))\n}\n```\nThis keeps `https://github.com/user/repo` matching while rejecting `https://github.com.evil.com` and `https://github.company.io`.","locations":[{"ref":"crates/agent/src/pattern_extraction.rs:181-185","code":"  181 | pub fn extract_url_pattern(url: &str) -> Option<String> {\n  182 |     let parsed = Url::parse(url).ok()?;\n  183 |     let domain = parsed.host_str()?;\n  184 |     Some(format!(\"^https?://{}\", escape_for_pattern(domain)))\n  185 | }","lines":5,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent/src/pattern_extraction.rs#L181-L185"}]},
{"id":"OTHER_2","type":"other","type_label":"Other","severity":"high","difficulty":"hard","description":"The auto-updater downloads the update payload from a server-supplied URL and installs it with no cryptographic integrity check (no SHA/checksum comparison, no detached signature verification). `download_release` (`crates/auto_update/src/auto_update.rs:1037`-`1088`) and `download_remote_server_binary` (`crates/auto_update/src/auto_update.rs:960`-`978`) fetch `release.url` (which itself comes from the JSON returned by the asset API in `get_release_asset`) and only assert `response.status().is_success()`. The bytes are then handed straight to the platform installer: on Linux `install_release_linux` runs `tar -xzf` and `rsync -av --delete` into the user's install dir (`crates/auto_update/src/auto_update.rs:1090`-`1156`); on Windows `install_release_windows` executes the downloaded `.exe` with `/verysilent` (`crates/auto_update/src/auto_update.rs:1274`-`1294`); on macOS the DMG is mounted and rsync'd. The only defense is TLS trust of the download URL plus whatever OS-level code signing exists for the payload (Authenticode on Windows, Gatekeeper on the `.app`); the Linux `tar.gz` path in particular has no signature verification at all, so a compromised CDN, a malicious/hijacked asset URL, or any TLS-bypass results in arbitrary code being installed and executed as the user.","fix":"Verify the downloaded payload before installing: fetch an expected SHA-256 (or, preferably, a detached signature over the artifact) from the release metadata and compare it against the hash of the downloaded file, failing the update if it does not match. On Linux especially, gate `install_release_linux` behind such a check since the extracted archive is not otherwise verified. Do the same for `download_remote_server_binary`.","locations":[{"ref":"crates/auto_update/src/auto_update.rs:1065-1116","code":" 1065 | async fn download_release(\n 1066 |     target_path: &Path,\n 1067 |     release: ReleaseAsset,\n 1068 |     client: Arc<HttpClientWithUrl>,\n 1069 |     mut on_progress: impl FnMut(Option<f32>),\n 1070 | ) -> Result<()> {\n 1071 |     let mut target_file = File::create(&target_path).await?;\n 1072 | \n 1073 |     let mut response = client.get(&release.url, Default::default(), true).await?;\n 1074 |     anyhow::ensure!(\n 1075 |         response.status().is_success(),\n 1076 |         \"failed to download update: {:?}\",\n 1077 |         response.status()\n 1078 |     );\n 1079 | \n 1080 |     let total_bytes = response\n 1081 |         .headers()\n 1082 |         .get(http_client::http::header::CONTENT_LENGTH)\n 1083 |         .and_then(|value| value.to_str().ok())\n 1084 |         .and_then(|value| value.parse::<u64>().ok())\n 1085 |         .filter(|total_bytes| *total_bytes > 0);\n 1086 | \n 1087 |     let mut downloaded_bytes: u64 = 0;\n 1088 |     let mut last_reported_percent: Option<u8> = None;\n 1089 |     let mut buffer = [0u8; 8192];\n 1090 |     let body = response.body_mut();\n 1091 |     loop {\n 1092 |         let bytes_read = body.read(&mut buffer).await?;\n 1093 |         if bytes_read == 0 {\n 1094 |             break;\n 1095 |         }\n 1096 |         target_file.write_all(&buffer[..bytes_read]).await?;\n 1097 |         downloaded_bytes += bytes_read as u64;\n 1098 | \n 1099 |         if let Some(total_bytes) = total_bytes {\n 1100 |             let fraction = (downloaded_bytes as f32 / total_bytes as f32).clamp(0.0, 1.0);\n 1101 |             // Only report when the whole-number percentage changes to avoid notifying the UI on every chunk.\n 1102 |             let percent = (fraction * 100.0) as u8;\n 1103 |             if last_reported_percent != Some(percent) {\n 1104 |                 last_reported_percent = Some(percent);\n 1105 |                 on_progress(Some(fraction));\n 1106 |             }\n 1107 |         }\n 1108 |     }\n 1109 |     target_file.flush().await?;\n 1110 |     if total_bytes.is_some() && last_reported_percent != Some(100) {\n 1111 |         on_progress(Some(1.0));\n 1112 |     }\n 1113 |     log::info!(\"downloaded update. path:{:?}\", target_path);\n 1114 | \n 1115 |     Ok(())\n 1116 | }","lines":52,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/auto_update/src/auto_update.rs#L1065-L1116"},{"ref":"crates/auto_update/src/auto_update.rs:988-1006","code":"  988 | async fn download_remote_server_binary(\n  989 |     target_path: &PathBuf,\n  990 |     release: ReleaseAsset,\n  991 |     client: Arc<HttpClientWithUrl>,\n  992 | ) -> Result<()> {\n  993 |     let temp = tempfile::Builder::new().tempfile_in(remote_servers_dir())?;\n  994 |     let mut temp_file = File::create(&temp).await?;\n  995 | \n  996 |     let mut response = client.get(&release.url, Default::default(), true).await?;\n  997 |     anyhow::ensure!(\n  998 |         response.status().is_success(),\n  999 |         \"failed to download remote server release: {:?}\",\n 1000 |         response.status()\n 1001 |     );\n 1002 |     smol::io::copy(response.body_mut(), &mut temp_file).await?;\n 1003 |     smol::fs::rename(&temp, &target_path).await?;\n 1004 | \n 1005 |     Ok(())\n 1006 | }","lines":19,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/auto_update/src/auto_update.rs#L988-L1006"},{"ref":"crates/auto_update/src/auto_update.rs:1118-1184","code":" 1118 | async fn install_release_linux(\n 1119 |     temp_dir: &InstallerDir,\n 1120 |     downloaded_tar_gz: &Path,\n 1121 |     channel: &str,\n 1122 |     running_app_path: PathBuf,\n 1123 | ) -> Result<Option<PathBuf>> {\n 1124 |     let home_dir = PathBuf::from(env::var(\"HOME\").context(\"no HOME env var set\")?);\n 1125 | \n 1126 |     let extracted = temp_dir.path().join(\"zed\");\n 1127 |     fs::create_dir_all(&extracted)\n 1128 |         .await\n 1129 |         .context(\"failed to create directory into which to extract update\")?;\n 113 {"id":"OTHER_3","type":"other","type_label":"Other","severity":"medium","difficulty":"medium","description":"`delete_thread` walks the subagent tree with a `frontier` worklist but keeps no set of already-visited ids. `parent_id` is populated from `subagent_context.parent_thread_id`, and nothing in the deletion path guarantees the persisted rows form an acyclic graph (a corrupted or hand-edited DB, or a thread whose `parent_thread_id` equals its own id, is enough). A cycle - including the trivial self-parent case where `select_children(id)` returns `id` - makes the `while let Some(parent) = frontier.pop()` loop push the same ids forever, so `ids_to_delete` and `frontier` grow without bound: an infinite loop / OOM that hangs the background executor.","fix":"Track visited ids and skip ones already seen before recursing, e.g.:\n```rust\nlet mut ids_to_delete = vec![id.0.clone()];\nlet mut seen: collections::HashSet<Arc<str>> =\n    collections::HashSet::from_iter([id.0.clone()]);\nlet mut frontier = vec![id.0.clone()];\nwhile let Some(parent) = frontier.pop() {\n    for child in select_children(parent)? {\n        if seen.insert(child.clone()) {\n            ids_to_delete.push(child.clone());\n            frontier.push(child);\n        }\n    }\n}\n```","locations":[{"ref":"crates/agent/src/db.rs:703-731","code":"  703 |                 // Collect target thread together with all of its transitive\n  704 |                 // subagent threads\n  705 |                 let mut ids_to_delete = vec![id.0.clone()];\n  706 |                 let mut frontier = vec![id.0.clone()];\n  707 |                 while let Some(parent) = frontier.pop() {\n  708 |                     for child in select_children(parent)? {\n  709 |                         ids_to_delete.push(child.clone());\n  710 |                         frontier.push(child);\n  711 |                     }\n  712 |                 }\n  713 | \n  714 |                 let mut select =\n  715 |                     connection.select_bound::<Arc<str>, (DataType, Vec<u8>)>(indoc! {\"\n  716 |                     SELECT data_type, data FROM threads WHERE id = ? LIMIT 1\n  717 |                 \"})?;\n  718 | \n  719 |                 let mut delete = connection.exec_bound::<Arc<str>>(indoc! {\"\n  720 |                     DELETE FROM threads WHERE id = ?\n  721 |                 \"})?;\n  722 | \n  723 |                 let mut sandboxed_terminal_temp_dirs = Vec::new();\n  724 |                 for thread_id in ids_to_delete {\n  725 |                     if let Some(temp_dir) = select(thread_id.clone())?.into_iter().next().and_then(\n  726 |                         |(data_type, data)| Self::sandboxed_terminal_temp_dir(data_type, data),\n  727 |                     ) {\n  728 |                         sandboxed_terminal_temp_dirs.push(temp_dir);\n  729 |                     }\n  730 |                     delete(thread_id)?;\n  731 |                 }","lines":29,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent/src/db.rs#L703-L731"}]},
{"id":"OTHER_4","type":"other","type_label":"Other","severity":"medium","difficulty":"very_easy","description":"`extract_terminal_pattern` uses a bare `\\b` word boundary for single-token commands, which is too loose and allows a *different* hyphenated command to match. Approving a bare command like `git` produces `^git\\b`; because `-` is a non-word character, `\\b` matches between `git` and `-`, so the pattern also matches `git-secret ...`, `git-foo ...`, etc. (all separate executables). This is the same class of bug the multi-token branch deliberately guards against with `(\\s|$)` (the tests assert `cargo build` must not match `cargo build-foo`), but the single-token branch was left with `\\b`, so the protection is inconsistent and a permission for `npm`/`git`/`cat` leaks to `npm-*`/`git-*`/`cat-*` sibling commands.","fix":"Terminate the single-token pattern with the same `(\\s|$)` guard used for the multi-token case so a hyphenated sibling command can't match:\n```rust\n    match tokens.as_slice() {\n        [] => None,\n        [single] => Some(format!(\"^{}(\\s|$)\", escape_for_pattern(single))),\n        [rest @ .., last] => Some(format!(\n            \"^{}\\s+{}(\\s|$)\",\n            rest.iter()\n                .map(|token| escape_for_pattern(token))\n                .collect::<Vec<_>>()\n                .join(\"\\s+\"),\n            escape_for_pattern(last)\n        )),\n    }\n```\n(Update the corresponding `^ls\\b` test expectations to `^ls(\\s|$)`.)","locations":[{"ref":"crates/agent/src/pattern_extraction.rs:74-86","code":"   74 |     match tokens.as_slice() {\n   75 |         [] => None,\n   76 |         [single] => Some(format!(\"^{}\\\\b\", escape_for_pattern(single))),\n   77 |         [rest @ .., last] => Some(format!(\n   78 |             \"^{}\\\\s+{}(\\\\s|$)\",\n   79 |             rest.iter()\n   80 |                 .map(|token| escape_for_pattern(token))\n   81 |                 .collect::<Vec<_>>()\n   82 |                 .join(\"\\\\s+\"),\n   83 |             escape_for_pattern(last)\n   84 |         )),\n   85 |     }\n   86 | }","lines":13,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent/src/pattern_extraction.rs#L74-L86"}]},
{"id":"OTHER_5","type":"other","type_label":"Other","severity":"medium","difficulty":"very_easy","description":"Leftover debugging `println!` calls in the `ShareProject` action handler print `project` and `room` debug representations to stdout on every share/unshare. These are stray debug artifacts that pollute stdout in release builds.","fix":"Remove the debug prints.\n\nBefore:\n```rust\nlet project = workspace.project().clone();\nprintln!(\"{project:?}\");\nwindow.defer(cx, move |_window, cx| {\n    ActiveCall::global(cx).update(cx, move |call, cx| {\n        if let Some(room) = call.room() {\n            println!(\"{room:?}\");\n            if room.read(cx).is_sharing_project() {\n```\n\nAfter:\n```rust\nlet project = workspace.project().clone();\nwindow.defer(cx, move |_window, cx| {\n    ActiveCall::global(cx).update(cx, move |call, cx| {\n        if let Some(room) = call.room() {\n            if room.read(cx).is_sharing_project() {\n```","locations":[{"ref":"crates/collab_ui/src/collab_panel.rs:182","code":"  182 |             println!(\"{project:?}\");","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/collab_ui/src/collab_panel.rs#L182"},{"ref":"crates/collab_ui/src/collab_panel.rs:186","code":"  186 |                         println!(\"{room:?}\");","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/collab_ui/src/collab_panel.rs#L186"}]},
{"id":"OTHER_6","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"In `ContextServerTool::run` the authorization prompt title is computed from a hardcoded `serde_json::Value::Null` input (`let initial_title = self.initial_title(serde_json::Value::Null, cx);`) because the real tool input is only obtained later via `input.recv().await`. This means the third-party (MCP) tool authorization prompt built by `authorize_third_party_tool` never shows the primary argument (URL/path/query) that `format_mcp_initial_title` is specifically designed to inline - the user always sees the bare tool name. Built-in tools show the argument; MCP tools do not, despite the machinery existing for it.","fix":"Await `input.recv()` first, then compute the title from the resolved input before creating the authorization, e.g.:\n```rust\ncx.spawn(async move |cx| {\n    let input = input.recv().await.map_err(|e| anyhow::anyhow!(e.to_string()))?;\n    let initial_title = cx.update(|cx| self.initial_title(input.clone(), cx))?;\n    let authorize = cx.update(|cx| {\n        event_stream.authorize_third_party_tool(initial_title, tool_id, display_name, cx)\n    })?;\n    authorize.await.map_err(|e| anyhow::anyhow!(e.to_string()))?;\n    // ...\n})\n```","locations":[{"ref":"crates/agent/src/tools/context_server_registry.rs:348-350","code":"  348 |         let initial_title = self.initial_title(serde_json::Value::Null, cx);\n  349 |         let authorize =\n  350 |             event_stream.authorize_third_party_tool(initial_title, tool_id, display_name, cx);","lines":3,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent/src/tools/context_server_registry.rs#L348-L350"},{"ref":"crates/agent/src/tools/context_server_registry.rs:352-360","code":"  352 |         cx.spawn(async move |cx| {\n  353 |             let input = input\n  354 |                 .recv()\n  355 |                 .await\n  356 |                 .map_err(|e| anyhow::anyhow!(e.to_string()))?;\n  357 | \n  358 |             authorize\n  359 |                 .await\n  360 |                 .map_err(|e| anyhow::anyhow!(e.to_string()))?;","lines":9,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent/src/tools/context_server_registry.rs#L352-L360"}]},
{"id":"OTHER_7","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"`SpawnAgentTool::run` sets `session_info.message_end_index = cx.update(|cx| Some(subagent.num_entries(cx).saturating_sub(1)))` while `message_start_index` was captured as the entry *count* before sending (`subagent.num_entries(cx)`). `message_start_index` is an exclusive count (the index of the first new entry) while `message_end_index` is the inclusive index of the last entry. If the send adds no entries (`num_entries` unchanged), `message_end_index` becomes `start - 1`, i.e. an inverted/empty range, which any consumer computing `start..=end` would mishandle. The `saturating_sub` only prevents an underflow panic, not the semantic inversion.","fix":"Make the two indices use consistent semantics. Either treat `message_end_index` as an exclusive end (`Some(subagent.num_entries(cx))`) matching the exclusive `message_start_index`, or guard the inclusive form so it never precedes the start (e.g. `Some(num_entries.max(start + 1) - 1)`), so an empty message set does not produce an inverted range.","locations":[{"ref":"crates/agent/src/tools/spawn_agent_tool.rs:206-207","code":"  206 |             session_info.message_end_index =\n  207 |                 cx.update(|cx| Some(subagent.num_entries(cx).saturating_sub(1)));","lines":2,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent/src/tools/spawn_agent_tool.rs#L206-L207"}]},
{"id":"OTHER_8","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"The decrypted plaintext password produced by `password.decrypt(...)` is held in a plain `String` and dropped normally after being written to the askpass socket, without being zeroized. The whole purpose of `EncryptedPassword` (see `crates/askpass/src/encrypted_password.rs`) is to minimize how long plaintext secrets linger in memory, but here the transiently-decrypted secret leaves its bytes in freed heap memory. Since this is the one place the secret is decrypted for transmission, it is a good candidate for explicit zeroization.","fix":"Bind the decrypted value mutably and zeroize it after writing, e.g.:\n```rust\nif let Ok(password) = password\n    && let Ok(mut decrypted) = password.decrypt(IKnowWhatIAmDoingAndIHaveReadTheDocs)\n{\n    stream.write_all(decrypted.as_bytes()).await.log_err();\n    decrypted.zeroize();\n}\n```\n(using `zeroize::Zeroize`, already a dependency of the crate).","locations":[{"ref":"crates/askpass/src/askpass.rs:325-330","code":"  325 |                             if let Ok(password) = password\n  326 |                                 && let Ok(decrypted) =\n  327 |                                     password.decrypt(IKnowWhatIAmDoingAndIHaveReadTheDocs)\n  328 |                             {\n  329 |                                 stream.write_all(decrypted.as_bytes()).await.log_err();\n  330 |                             }","lines":6,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/askpass/src/askpass.rs#L325-L330"}]},
{"id":"OTHER_9","type":"other","type_label":"Other","severity":"low","difficulty":"very_easy","description":"`authenticate_with_browser` prints the admin API token in cleartext to stderr on the impersonation\npath: `eprintln!(\"authenticate as admin {login}, {token}\");`. Even though this path is gated behind\n`ZED_IMPERSONATE` + `ZED_ADMIN_API_TOKEN` (a staff/dev feature), logging a long-lived bearer credential\nto a terminal/log stream is a credential-leak hazard (the token is subsequently used as\n`Authorization: Bearer {api_token}`).","fix":"Do not print the token. Either drop the value or log only the login, e.g.:\n```rust\neprintln!(\"authenticate as admin {login}\");\n```","locations":[{"ref":"crates/client/src/client.rs:1461","code":" 1461 |                             eprintln!(\"authenticate as admin {login}, {token}\");","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/client/src/client.rs#L1461"}]},
{"id":"OTHER_10","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"Several public `new()` constructors take no arguments and return `Self` without a corresponding `Default` impl, which trips clippy's `new_without_default` lint (the repo runs clippy via `./script/clippy`). Examples: `ClientUserMessageId::new`, `AuthRequired::new`, `AcpToolsToolbarItemView::new`.","fix":"Add `Default` impls, e.g.:\n```rust\nimpl Default for AuthRequired {\n    fn default() -> Self {\n        Self::new()\n    }\n}\n```","locations":[{"ref":"crates/acp_thread/src/connection.rs:20-24","code":"   20 | impl ClientUserMessageId {\n   21 |     pub fn new() -> Self {\n   22 |         Self(Uuid::new_v4().to_string().into())\n   23 |     }\n   24 | }","lines":5,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/acp_thread/src/connection.rs#L20-L24"},{"ref":"crates/acp_thread/src/connection.rs:426-435","code":"  426 | impl AuthRequired {\n  427 |     pub fn new() -> Self {\n  428 |         Self { description: None }\n  429 |     }\n  430 | \n  431 |     pub fn with_description(mut self, description: String) -> Self {\n  432 |         self.description = Some(description);\n  433 |         self\n  434 |     }\n  435 | }","lines":10,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/acp_thread/src/connection.rs#L426-L435"},{"ref":"crates/acp_tools/src/acp_tools.rs:808-812","code":"  808 | impl AcpToolsToolbarItemView {\n  809 |     pub fn new() -> Self {\n  810 |         Self { acp_tools: None }\n  811 |     }\n  812 | }","lines":5,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/acp_tools/src/acp_tools.rs#L808-L812"}]},

{"id":"OTHER_12","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"`EditSessionOutput`'s `Display` impl writes a trailing newline with `write!`\nplus an explicit `\\n` instead of `writeln!`. This is a `clippy::write_with_newline`\nlint and is slightly less clear.","fix":"Replace:\n```rust\nwrite!(f, \"{error}\\n\")?;\n```\nwith:\n```rust\nwriteln!(f, \"{error}\")?;\n```","locations":[{"ref":"crates/agent/src/tools/edit_session.rs:113","code":"  113 |                 write!(f, \"{error}\\n\")?;","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent/src/tools/edit_session.rs#L113"}]},
{"id":"OTHER_13","type":"other","type_label":"Other","severity":"negligible","difficulty":"very_easy","description":"The inline-assist placeholder/help strings use inconsistent non-ASCII dash characters. The buffer-edit placeholder in `entry_view_state.rs` uses a fullwidth hyphen `－` (U+FF0D), while the prompt-editor placeholder mixes a horizontal bar `―` (U+2015) and an em dash `—` (U+2014) in a single string. This is visually inconsistent between the two separators in the same sentence.","fix":"Use a consistent plain dash. For example, in `inline_prompt_editor.rs:406`:\n\nBefore:\n```rust\nformat!(\"{action}… ({agent_panel_keybinding} ― ↓↑ for history — @ to include context)\")\n```\n\nAfter:\n```rust\nformat!(\"{action}… ({agent_panel_keybinding} - ↓↑ for history - @ to include context)\")\n```\n\nand in `entry_view_state.rs:260` replace the `－` in `\"Edit message － @ to include context\"` with a plain `-`.","locations":[{"ref":"crates/agent_ui/src/inline_prompt_editor.rs:406","code":"  406 |         format!(\"{action}… ({agent_panel_keybinding} ― ↓↑ for history — @ to include context)\")","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/inline_prompt_editor.rs#L406"},{"ref":"crates/agent_ui/src/entry_view_state.rs:260","code":"  260 |                             \"Edit message － @ to include context\",","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/entry_view_state.rs#L260"}]},

  <div id="progress-bar"><div id="progress-fill"></div></div>
  <span id="progress-text"></span>
  <button class="action-btn" data-action="collapse-all">⊟ Collapse all</button>
  <button class="action-btn" data-action="expand-all">⊞ Expand all</button>
  <button class="action-btn" data-action="download-md">&#11015; MD</button>
  <button class="action-btn" data-action="download-md-short">&#11015; MD Short</button>
  <button class="action-btn" data-action="download-toml">&#11015; TOML</button>
</div>
<div id="hidden-bar"></div>
<div id="content"></div>
</div>
<script>
(function(){
'use strict';

// Data
const FINDINGS     = JSON.parse(document.getElementById('D').textContent);
const PROJECT_INFO = JSON.parse(document.getElementById('PI').textContent);
const SEVS     = ['critical','high','medium','low','negligible'];
const STATUSES = ['open','fixed','wont-fix','false-positive'];
const ALL_TYPES = [...new Set(FINDINGS.map(f => f.type))].sort(cmpTypes);
// Build lookup map for O(1) access
const FINDING_BY_ID = new Map(FINDINGS.map(f => [f.id, f]));
// Only severities actually present in the report — the filter bar hides the rest.
const PRESENT_SEVS = SEVS.filter(s => FINDINGS.some(f => (f.severity || 'medium') === s));
// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.
const DIFFICULTY_ORDER = ['very_easy','easy','medium','hard'];
const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};
const PRESENT_DIFFS = DIFFICULTY_ORDER.filter(d => FINDINGS.some(f => f.difficulty === d));
const HAS_DIFFICULTY = PRESENT_DIFFS.length > 0;
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State
const S = {
  search: '', searchScope: 'all', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenDiff: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(),
};
const statuses = {};

// Persistence
function loadStatuses() {
  try { Object.assign(statuses, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch {}
}
function saveStatuses() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(statuses)); } catch {}
}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;
function syncHash() {
  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));
    if (S.search)            p.set('q',   S.search);
    if (S.searchScope !== 'all') p.set('qs', S.searchScope);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('qs'))  { S.searchScope = p.get('qs'); }
  document.getElementById('search-scope').classList.toggle('active', S.searchScope === 'locations');
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }
function isCustom(t)  { return String(t).toLowerCase() === 'custom'; }
function typeCls(t)   { return 'type-badge' + (isCustom(t) ? ' custom-type' : ''); }
// 'custom' findings are the user's own externally-sourced ones; pin them first
// everywhere types are listed so they never blend into the audit's own categories.
function cmpTypes(a, b) {
  if (isCustom(a) !== isCustom(b)) return isCustom(a) ? -1 : 1;
  return String(a).localeCompare(String(b));
}

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Render a "**Label:** value" line. GitHub/CommonMark only recognizes a
// ``` fence when it starts at the beginning of a line, so if the value
// itself opens with a fence, put it on its own line instead of right
// after the inline label - otherwise the fence marker gets glued onto
// "**Label:** ```" and never renders as a code block.
function mdField(label, value) {
  value = value || '';
  return /^```/.test(value.trim())
    ? '**' + label + ':**\n\n' + value
    : '**' + label + ':** ' + value;
}

// Render the "**Locations:**" block. When a location has a commit-pinned
// permalink (GitHub/GitLab), just paste the bare URL on its own line -
// GitHub/GitLab auto-expand a line-range blob link into an inline code
// preview, so re-pasting the snippet as a fenced block would duplicate it.
// Forges without a detected permalink shape (or missing commit/repo info)
// fall back to the fenced ref+snippet so the location is still readable.
function mdLocations(locations) {
  if (!locations.length) return '';
  let out = '**Locations:**\n\n';
  for (const l of locations) {
    if (l.link)               out += l.link + '\n\n';
    else if (l.code != null)  out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
    else                      out += '- `' + l.ref + '` _(file not found)_\n\n';
  }
  return out;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort(cmpTypes);

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += mdField('Description', f.description) + '\n\n';
      out += mdLocations(f.locations);
      out += mdField('Fix', f.fix) + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build a [project] header block from embedded PROJECT_INFO, so the exported
// findings.toml is self-contained (doesn't depend on a sibling project-info.toml
// that a second, separately-triggered download could silently fail to save).
// '' when there is no project info at all.
function buildProjectToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = PROJECT_INFO || {};
  if (!Object.keys(pi).length) return '';
  const lines = ['[project]'];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n\n';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    // Pin the id so re-rendering this export - or filtering it down later - can't
    // renumber findings that were already referenced by id elsewhere.
    if (f.id && f.id !== '?') lns.push(pad('id') + '= ' + tomlStr(f.id));
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return buildProjectToml() + chunks.join('\n\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += mdField('Description', f.description) + '\n\n';
  out += mdLocations(f.locations);
  out += mdField('Fix', f.fix) + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'folder') {
    if (!f.locations.length) return '(no location)';
    const path = f.locations[0].ref.replace(/:.*/,'');
    const idx = path.lastIndexOf('/');
    return idx === -1 ? '(root)' : path.slice(0, idx);
  }
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystacks per finding (cleared on full re-render).
// Two variants: everything (default), and file/folder paths only - for when a
// search term (e.g. a directory name like 'dlls/abc') also happens to appear
// inside description/fix prose and you only want path matches.
const _hay = new Map();
const _hayLoc = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}
function hayLocOf(f) {
  if (!_hayLoc.has(f.id)) {
    _hayLoc.set(f.id, f.locations.map(l => l.ref).join(' ').toLowerCase());
  }
  return _hayLoc.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (S.searchScope === 'locations') {
      if (!hayLocOf(f).includes(q)) return false;
    } else if (!hayOf(f).includes(q) && !st.includes(q)) {
      return false;
    }
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  if (S.groupBy === 'type') return [...keys].sort(cmpTypes);
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge ' + typeCls(f.type) + '" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge ' + typeCls(t) + '" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  _hayLoc.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    // Single download (was two) - a second auto-triggered download is commonly
    // blocked by the browser unless the user explicitly allows it, which silently
    // drops project-info.toml. Embedding [project] in findings.toml itself avoids
    // that failure mode entirely.
    downloadText(buildFindingsToml(), 'findings.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});
document.getElementById('search-scope').addEventListener('click', e => {
  S.searchScope = S.searchScope === 'locations' ? 'all' : 'locations';
  e.currentTarget.classList.toggle('active', S.searchScope === 'locations');
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
