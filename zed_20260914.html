     },\n  195 |                     SearchDirection::Diagonal,\n  196 |                 );","lines":13,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent/src/tools/edit_session/streaming_fuzzy_matcher.rs#L184-L196"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"In the `AcpThreadEvent::NewEntry` handler, the last-entry index is computed with an unchecked subtraction:\n```rust\nlet len = thread.read(cx).entries().len();\nlet index = len - 1;\n```\nIf `entries()` is empty when a `NewEntry` event is delivered, `len - 1` underflows: it panics in debug builds and wraps to `usize::MAX` in release, which is then passed to `view_state.sync_entry(index, ...)` and `list_state.splice_focusable(index..index, ...)`. While a `NewEntry` event normally implies at least one entry, nothing in this function defends against a spurious or racing event, so this is a latent panic/UB path.","fix":"Guard against an empty entry list before computing the index, e.g.:\n```rust\nAcpThreadEvent::NewEntry => {\n    let len = thread.read(cx).entries().len();\n    let Some(index) = len.checked_sub(1) else {\n        return;\n    };\n    // ... existing body using `index`\n}\n```","locations":[{"ref":"crates/agent_ui/src/conversation_view.rs:1621-1642","code":" 1621 |             AcpThreadEvent::NewEntry => {\n 1622 |                 let len = thread.read(cx).entries().len();\n 1623 |                 let index = len - 1;\n 1624 |                 if let Some(active) = self.thread_view(&session_id) {\n 1625 |                     let entry_view_state = active.read(cx).entry_view_state.clone();\n 1626 |                     let list_state = active.read(cx).list_state.clone();\n 1627 |                     entry_view_state.update(cx, |view_state, cx| {\n 1628 |                         view_state.sync_entry(index, thread, window, cx);\n 1629 |                         list_state.splice_focusable(\n 1630 |                             index..index,\n 1631 |                             [view_state\n 1632 |                                 .entry(index)\n 1633 |                                 .and_then(|entry| entry.focus_handle(cx))],\n 1634 |                         );\n 1635 |                     });\n 1636 |                     active.update(cx, |active, cx| {\n 1637 |                         active.sync_elicitation_state_for_entry(index, window, cx);\n 1638 |                         active.sync_editor_mode(cx);\n 1639 |                         active.sync_generating_indicator(cx);\n 1640 |                     });\n 1641 |                 }\n 1642 |             }","lines":22,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/conversation_view.rs#L1621-L1642"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"`stream_completion` casts the requested token budget with `.max_tokens(request.max_tokens as i32)` at `crates/bedrock/src/bedrock.rs:82`. `request.max_tokens` is a `u64` (ultimately sourced from model config, including `ConverseModel::Custom { max_tokens }` / `max_output_tokens` which are user-configurable `u64`). A value above `i32::MAX` wraps to a negative `i32`, silently sending a nonsensical/negative `max_tokens` to Bedrock.","fix":"Clamp before narrowing, e.g.\n```rust\n.max_tokens(request.max_tokens.min(i32::MAX as u64) as i32)\n```","locations":[{"ref":"crates/bedrock/src/bedrock.rs:58-62","code":"   58 |     let inference_config = InferenceConfiguration::builder()\n   59 |         .max_tokens(request.max_tokens as i32)\n   60 |         .set_temperature(request.temperature)\n   61 |         .set_top_p(request.top_p)\n   62 |         .build();","lines":5,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/bedrock/src/bedrock.rs#L58-L62"}]},
{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`get_channel_members` computes `limit` as a `u64` and then narrows it with `limit as u32`\nwhen calling `search_channel_members`. A client-supplied `request.limit` that is nonzero\nbut larger than `u32::MAX` (e.g. exactly `2^32`) truncates to a small or zero value,\nproducing surprising results (a request for a huge limit can silently return zero rows).\n```rust\nlet limit = if request.limit == 0 { u16::MAX as u64 } else { request.limit };\n...\n.search_channel_members(&channel, &request.query, limit as u32)\n```","fix":"Clamp instead of truncating, e.g.:\n```rust\nlet limit = if request.limit == 0 {\n    u16::MAX as u32\n} else {\n    request.limit.min(u32::MAX as u64) as u32\n};\n```","locations":[{"ref":"crates/collab/src/rpc.rs:3353-3364","code":" 3353 |     let limit = if request.limit == 0 {\n 3354 |         u16::MAX as u64\n 3355 |     } else {\n 3356 |         request.limit\n 3357 |     };\n 3358 | \n 3359 |     let channel = db.get_channel(channel_id, session.user_id()).await?;\n 3360 | \n 3361 |     let (members, users) = session\n 3362 |         .app_state\n 3363 |         .user_service\n 3364 |         .search_channel_members(&channel, &request.query, limit as u32)","lines":12,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/collab/src/rpc.rs#L3353-L3364"}]},
{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`acknowledge_buffer_version` casts the client-supplied `request.epoch` (a `u64`) to `i32`\nwith `request.epoch as i32`. A client sending an epoch greater than `i32::MAX` wraps to a\nnegative or truncated value that is then passed to `observe_buffer_version`. This is\nnetwork-reachable input and results in the wrong epoch being recorded (silently) rather\nthan a clean rejection.","fix":"Validate the range before casting, e.g.:\n```rust\nlet epoch = i32::try_from(request.epoch).context(\"invalid epoch\")?;\n```\nand pass `epoch` to `observe_buffer_version` instead of `request.epoch as i32`.","locations":[{"ref":"crates/collab/src/rpc.rs:3757","code":" 3757 |             request.epoch as i32,","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/collab/src/rpc.rs#L3757"}]},
{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"Port values from the debug config are parsed with `val.as_u64().map(|p| p as u16)`. Casting `u64` to `u16` truncates silently, so a malformed port like `70000` becomes `4464` and the debugger connects to the wrong port with no error surfaced to the user. This happens in both the `connect` branch and the top-level branch of `get_installed_binary`.","fix":"Use a checked conversion, e.g. `val.as_u64().and_then(|p| u16::try_from(p).ok())`, and report/log an error for out-of-range port values instead of silently truncating.","locations":[{"ref":"crates/dap_adapters/src/python.rs:357","code":"  357 |                         .and_then(|val| val.as_u64().map(|p| p as u16)),","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/dap_adapters/src/python.rs#L357"},{"ref":"crates/dap_adapters/src/python.rs:366","code":"  366 |                         .and_then(|port| port.as_u64().map(|p| p as u16)),","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/dap_adapters/src/python.rs#L366"}]},
{"id":"OVF_8","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"negligible","difficulty":"easy","description":"When forwarding a terminal exit reported via `ToolCallUpdate` meta, the exit code is\nparsed as `u64` and truncated with `as u32`:\n```rust\n.exit_code(\n    term_exit\n        .get(\"exit_code\")\n        .and_then(|v| v.as_u64())\n        .map(|i| i as u32),\n)\n```\nA value above `u32::MAX` would wrap silently rather than being rejected. Real process\nexit codes are small so this is only a theoretical/robustness issue with attacker- or\nbug-supplied JSON.","fix":"Use a checked conversion and drop out-of-range values, e.g.:\n```rust\n.exit_code(\n    term_exit\n        .get(\"exit_code\")\n        .and_then(|v| v.as_u64())\n        .and_then(|i| u32::try_from(i).ok()),\n)\n```","locations":[{"ref":"crates/agent_servers/src/acp.rs:4896-4902","code":" 4896 |                     let status = acp::TerminalExitStatus::new()\n 4897 |                         .exit_code(\n 4898 |                             term_exit\n 4899 |                                 .get(\"exit_code\")\n 4900 |                                 .and_then(|v| v.as_u64())\n 4901 |                                 .map(|i| i as u32),\n 4902 |                         )","lines":7,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_servers/src/acp.rs#L4896-L4902"}]},
{"id":"OVF_9","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"negligible","difficulty":"very_easy","description":"`prefixes` computes `0..text.len() - 1`, which underflows (panicking in debug) if called\nwith an empty string. It is currently only invoked with the non-empty constants\n`CODE_BLOCK_DELIMITER` (`\"```\"`) and `CURSOR_SPAN` (`\"<|CURSOR|>\"`), so it is not\nreachable today, but the helper is a latent panic hazard for any future caller.","fix":"Guard against empty input, e.g.:\n```rust\nfn prefixes(text: &str) -> impl Iterator<Item = &str> {\n    (1..text.len()).map(|ix| &text[..ix])\n}\n```\n`1..text.len()` is empty (no panic) when `text` is empty or a single char, and yields the\nsame proper prefixes for longer strings.","locations":[{"ref":"crates/agent_ui/src/buffer_codegen.rs:1619-1621","code":" 1619 | fn prefixes(text: &str) -> impl Iterator<Item = &str> {\n 1620 |     (0..text.len() - 1).map(|ix| &text[..ix + 1])\n 1621 | }","lines":3,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/buffer_codegen.rs#L1619-L1621"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"`Thread::summary` builds the persisted *detailed* thread summary but keeps only the\nfirst line of every streamed text chunk:\n\n```rust\nlet mut lines = text.lines();\nsummary.extend(lines.next());\n```\n\n`text.lines().next()` yields only the text up to the first `\\n` in that chunk, so\nanything after a newline in a streamed chunk is silently dropped (and all newlines\nare stripped). For a single-line thread *title* (`stream_thread_title`) that is\ncorrect, but here the request uses `SUMMARIZE_THREAD_DETAILED_PROMPT`, whose output\nis inherently multi-line. The result is a garbled/truncated summary that is then\nstored (`this.summary = Some(summary)`), persisted to the DB as `detailed_summary`,\nand reused as conversation context. This looks like copy-paste from the title path.","fix":"Accumulate the full streamed text instead of only the first line of each chunk:\n\n```rust\nLanguageModelCompletionEvent::Text(text) => text,\n_ => continue,\n};\n\nsummary.push_str(&text);\n```\n\nRemove the `let mut lines = text.lines(); summary.extend(lines.next());` lines.","locations":[{"ref":"crates/agent/src/thread.rs:3868-3879","code":" 3868 |                 let mut summary = String::new();\n 3869 |                 let mut messages = model.stream_completion(request, cx).await.log_err()?;\n 3870 |                 while let Some(event) = messages.next().await {\n 3871 |                     let event = event.log_err()?;\n 3872 |                     let text = match event {\n 3873 |                         LanguageModelCompletionEvent::Text(text) => text,\n 3874 |                         _ => continue,\n 3875 |                     };\n 3876 | \n 3877 |                     let mut lines = text.lines();\n 3878 |                     summary.extend(lines.next());\n 3879 |                 }","lines":12,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent/src/thread.rs#L3868-L3879"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`ToolPickerDelegate::confirm` toggles an MCP tool based on the stored per-tool boolean (`or_default()` == `false`) instead of the *effective* displayed state, which for MCP tools falls back to `enable_all_context_servers`.\nIn `render_match` the enabled state shown to the user is:\n```rust\nself.profile_settings\n    .context_servers\n    .get(server_id.as_ref())\n    .and_then(|preset| preset.tools.get(name))\n    .copied()\n    .unwrap_or(self.profile_settings.enable_all_context_servers)\n```\nBut `confirm` computes `is_currently_enabled` via `or_default()`, which inserts/reads `false` when the tool is not yet present:\n```rust\nlet preset = self.profile_settings.context_servers.entry(server_id).or_default();\nlet is_enabled = *preset.tools.entry(tool_name.clone()).or_default();\n*preset.tools.entry(tool_name.clone()).or_default() = !is_enabled;\n```\nWhen `enable_all_context_servers` is `true` and the tool has no explicit entry, the UI shows it as enabled (check icon), but the first click reads `is_enabled = false` and writes `true`, so the tool stays enabled (and the settings file is written `true`). The user must click twice to actually disable a tool that is enabled-by-default. The same wrong value (`is_currently_enabled`) is then propagated into the persisted settings at lines 317-322.","fix":"Compute the current effective state the same way `render_match` does (honoring `enable_all_context_servers` for the MCP case) before flipping it. For example, for the `server_id` branch:\n```rust\nlet preset = self.profile_settings.context_servers.entry(server_id).or_default();\nlet is_enabled = preset\n    .tools\n    .get(tool_name.as_ref())\n    .copied()\n    .unwrap_or(self.profile_settings.enable_all_context_servers);\npreset.tools.insert(tool_name.clone(), !is_enabled);\nis_enabled\n```\nand use that consistent value when writing settings.","locations":[{"ref":"crates/agent_ui/src/agent_configuration/tool_picker.rs:260-281","code":"  260 |         let is_currently_enabled = if let Some(server_id) = server_id.clone() {\n  261 |             let preset = self\n  262 |                 .profile_settings\n  263 |                 .context_servers\n  264 |                 .entry(server_id)\n  265 |                 .or_default();\n  266 |             let is_enabled = *preset.tools.entry(tool_name.clone()).or_default();\n  267 |             *preset.tools.entry(tool_name.clone()).or_default() = !is_enabled;\n  268 |             is_enabled\n  269 |         } else {\n  270 |             let is_enabled = *self\n  271 |                 .profile_settings\n  272 |                 .tools\n  273 |                 .entry(tool_name.clone())\n  274 |                 .or_default();\n  275 |             *self\n  276 |                 .profile_settings\n  277 |                 .tools\n  278 |                 .entry(tool_name.clone())\n  279 |                 .or_default() = !is_enabled;\n  280 |             is_enabled\n  281 |         };","lines":22,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/agent_configuration/tool_picker.rs#L260-L281"},{"ref":"crates/agent_ui/src/agent_configuration/tool_picker.rs:359-373","code":"  359 |             PickerItem::Tool { name, server_id } => {\n  360 |                 let is_enabled = if let Some(server_id) = server_id {\n  361 |                     self.profile_settings\n  362 |                         .context_servers\n  363 |                         .get(server_id.as_ref())\n  364 |                         .and_then(|preset| preset.tools.get(name))\n  365 |                         .copied()\n  366 |                         .unwrap_or(self.profile_settings.enable_all_context_servers)\n  367 |                 } else {\n  368 |                     self.profile_settings\n  369 |                         .tools\n  370 |                         .get(name)\n  371 |                         .copied()\n  372 |                         .unwrap_or(false)\n  373 |                 };","lines":15,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/agent_configuration/tool_picker.rs#L359-L373"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`AgentConnectionStore::request_connection` removes a live connection entry from `self.entries` when a *new version becomes available*, silently disconnecting a working agent.\nIn the `new_version_rx` spawn the handler emits `AgentConnectionEntryEvent::NewVersionAvailable` and then calls `this.entries.remove(&key)`:\n```rust\nentry\n    .update(cx, move |_entry, cx| {\n        cx.emit(AgentConnectionEntryEvent::NewVersionAvailable(version.into()));\n    })\n    .ok();\nthis.entries.remove(&key);\ncx.notify();\n```\nThe consumer of this event (`conversation_view.rs`, around lines 1053-1059) only shows a \"new version available\" banner; it does **not** restart the connection. Because the still-`Connected` entry is dropped from the map, `connection_status` now returns `Disconnected`, `agent_version` returns `None`, and `active_acp_connections` no longer lists the connection, even though the underlying session is still live and in use. Compare with the sibling `loading_status_rx` spawn (lines 240-263) which correctly does *not* remove the entry. This `remove` looks copy-pasted from the error branch (line 200) where removal is intentional.","fix":"Do not remove the entry when merely announcing a new version. Emit the event (and `cx.notify()`), but drop the `this.entries.remove(&key);` line so the connection remains tracked:\n```rust\nentry\n    .update(cx, move |_entry, cx| {\n        cx.emit(AgentConnectionEntryEvent::NewVersionAvailable(version.into()));\n    })\n    .ok();\ncx.notify();\n```","locations":[{"ref":"crates/agent_ui/src/agent_connection_store.rs:209-238","code":"  209 |         cx.spawn({\n  210 |             let key = key.clone();\n  211 |             let entry = entry.downgrade();\n  212 |             async move |this, cx| {\n  213 |                 while let Ok(version) = new_version_rx.recv().await {\n  214 |                     let Some(version) = version else {\n  215 |                         continue;\n  216 |                     };\n  217 | \n  218 |                     this.update(cx, move |this, cx| {\n  219 |                         if this.entries.get(&key) != entry.upgrade().as_ref() {\n  220 |                             return;\n  221 |                         }\n  222 | \n  223 |                         entry\n  224 |                             .update(cx, move |_entry, cx| {\n  225 |                                 cx.emit(AgentConnectionEntryEvent::NewVersionAvailable(\n  226 |                                     version.into(),\n  227 |                                 ));\n  228 |                             })\n  229 |                             .ok();\n  230 |                         this.entries.remove(&key);\n  231 |                         cx.notify();\n  232 |                     })\n  233 |                     .ok();\n  234 |                     break;\n  235 |                 }\n  236 |             }\n  237 |         })\n  238 |         .detach();","lines":30,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/agent_connection_store.rs#L209-L238"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"`mark_notification_as_read_by_id` performs an authorization-less update that lets any client mark and read another user's notification. It calls `notification::Entity::update(notification::ActiveModel { id: ActiveValue::Unchanged(notification_id), recipient_id: ActiveValue::Unchanged(recipient_id), is_read: ActiveValue::Set(true), .. })`. In sea-orm, `Entity::update(active_model)` builds its `WHERE` clause **only from primary-key columns**; `notification`'s primary key is just `id` (see `db/tables/notification.rs`). A non-PK column set to `ActiveValue::Unchanged` is neither written nor added to the filter, so `recipient_id` provides no scoping and the generated SQL is effectively `UPDATE notifications SET is_read = true WHERE id = $notification_id`.\n\nThe rpc handler `mark_notification_as_read` (`crates/collab/src/rpc.rs:3786`) calls this with `session.user_id()` (the caller) and the fully client-controlled `request.notification_id`. Since the row is fetched purely by `id`, a malicious client can pass any other user's notification id: it gets marked read, and the returned batch built via `model_to_proto(self, row)` is paired with the caller's `recipient_id` and sent back to the caller through `send_notifications`, leaking the notification's `content` (e.g. contact-request sender ids, channel invites). The sibling `mark_notification_as_read_internal` avoids this because it derives the id from `find_notification`, which is already scoped by `recipient_id`; only the `_by_id` variant trusts a client id directly.","fix":"Scope the update by `recipient_id` instead of relying on the ignored `Unchanged` value, and verify a row was actually updated. For example use `update_many` with an explicit filter:\n```rust\nlet result = notification::Entity::update_many()\n    .filter(notification::Column::Id.eq(notification_id))\n    .filter(notification::Column::RecipientId.eq(recipient_id))\n    .set(notification::ActiveModel {\n        is_read: ActiveValue::Set(true),\n        ..Default::default()\n    })\n    .exec(&*tx)\n    .await?;\nif result.rows_affected == 0 {\n    return Ok(NotificationBatch::default());\n}\n```\nthen re-read the row (scoped by both `id` and `recipient_id`) to build the proto for the batch.","locations":[{"ref":"crates/collab/src/db/queries/notifications.rs:167-187","code":"  167 |     pub async fn mark_notification_as_read_by_id(\n  168 |         &self,\n  169 |         recipient_id: UserId,\n  170 |         notification_id: NotificationId,\n  171 |     ) -> Result<NotificationBatch> {\n  172 |         self.transaction(|tx| async move {\n  173 |             let row = notification::Entity::update(notification::ActiveModel {\n  174 |                 id: ActiveValue::Unchanged(notification_id),\n  175 |                 recipient_id: ActiveValue::Unchanged(recipient_id),\n  176 |                 is_read: ActiveValue::Set(true),\n  177 |                 ..Default::default()\n  178 |             })\n  179 |             .exec(&*tx)\n  180 |             .await?;\n  181 |             Ok(model_to_proto(self, row)\n  182 |                 .map(|notification| (recipient_id, notification))\n  183 |                 .into_iter()\n  184 |                 .collect())\n  185 |         })\n  186 |         .await\n  187 |     }","lines":21,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/collab/src/db/queries/notifications.rs#L167-L187"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"When the upstream proxy request returns a `404`, the worker replaces the response by fetching `https://zed.dev/404` and returns that response object verbatim: `res = await fetch(\"https://zed.dev/404\")`. The returned `Response` carries the status code of the fallback page (the `zed.dev/404` route almost certainly serves its custom 404 page with an HTTP `200 OK` status), so the original `404` status is discarded and clients / crawlers receive a success status for a missing document. The correct not-found status is silently swallowed.","fix":"Preserve the `404` status while serving the fallback body, e.g.:\n```\nif (res.status === 404) {\n  const fallback = await fetch(\"https://zed.dev/404\");\n  res = new Response(fallback.body, {\n    status: 404,\n    headers: fallback.headers,\n  });\n}\n```","locations":[{"ref":".cloudflare/docs-proxy/src/worker.js:36-40","code":"   36 |     if (res.status === 404) {\n   37 |       res = await fetch(\"https://zed.dev/404\");\n   38 |     }\n   39 | \n   40 |     return res;","lines":5,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/.cloudflare/docs-proxy/src/worker.js#L36-L40"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"The R2 object key is derived from `url.pathname.slice(1)`, but `URL.pathname` is percent-encoded. Any object whose key contains characters that get URL-encoded (spaces, `+`, non-ASCII, `#`, etc.) will be looked up under its encoded form. For example a request for a file named `my file.svg` produces `key = \"my%20file.svg\"`, which will not match the actual R2 key `my file.svg`, causing a spurious `404`. The pathname must be decoded before being used as a key.","fix":"Decode the path segment before using it as the R2 key.\n\nBefore:\n```\nconst key = url.pathname.slice(1);\n```\n\nAfter:\n```\nconst key = decodeURIComponent(url.pathname.slice(1));\n```","locations":[{"ref":".cloudflare/open-source-website-assets/src/worker.js:4","code":"    4 |     const key = url.pathname.slice(1);","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/.cloudflare/open-source-website-assets/src/worker.js#L4"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"For a missing asset the worker returns `await fetch(\"https://zed.dev/404\")` directly. As with the docs proxy, the returned `Response` inherits the status of the `zed.dev/404` page (typically `200`), so a request for a non-existent bucket object is answered with a success status instead of `404`. This defeats browser / CDN not-found handling and can cause missing assets to be treated as valid.","fix":"Serve the fallback body under an explicit `404` status:\n```\nif (!object) {\n  const fallback = await fetch(\"https://zed.dev/404\");\n  return new Response(fallback.body, {\n    status: 404,\n    headers: fallback.headers,\n  });\n}\n```","locations":[{"ref":".cloudflare/open-source-website-assets/src/worker.js:7-9","code":"    7 |     if (!object) {\n    8 |       return await fetch(\"https://zed.dev/404\");\n    9 |     }","lines":3,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/.cloudflare/open-source-website-assets/src/worker.js#L7-L9"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`on_terminal_provider_event` discards the exit status of externally-provided\nterminals. In the `TerminalProviderEvent::Exit` arm, when the terminal entity\nalready exists the handler only calls `inner.shrink_to_used()` and never records\n`status`; when it does not yet exist, `status` is stashed in\n`pending_terminal_exit`, but the later `TerminalProviderEvent::Created` arm\nremoves it and binds it to `_status` (dropped). Because the display-only\n`::terminal::Terminal` used by external providers is never marked completed, the\nacp `Terminal` wrapper's `_output_task` / `wait_for_exit()` never resolves with\nthe real exit code, and `current_output()` reports `None` for `exit_status`. The\nexit code the provider sent is therefore lost for every external-provider\nterminal.","fix":"Propagate the provider-supplied `acp::TerminalExitStatus` into the `Terminal`\nentity (e.g. add a method on `Terminal` that finalizes `output`/completes the\n`_output_task`) instead of dropping `status`. Apply it both when the terminal\nalready exists (Exit arm) and when a buffered exit is replayed in the Created arm\n(replace `if let Some(_status) = self.pending_terminal_exit.remove(&terminal_id)`\nwith code that actually applies `status`).","locations":[{"ref":"crates/acp_thread/src/acp_thread.rs:4769-4774","code":" 4769 |                 if let Some(_status) = self.pending_terminal_exit.remove(&terminal_id) {\n 4770 |                     entity.update(cx, |term, cx| {\n 4771 |                         term.inner().update(cx, |inner, _| inner.shrink_to_used());\n 4772 |                         cx.notify();\n 4773 |                     });\n 4774 |                 }","lines":6,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/acp_thread/src/acp_thread.rs#L4769-L4774"},{"ref":"crates/acp_thread/src/acp_thread.rs:4802-4814","code":" 4802 |             TerminalProviderEvent::Exit {\n 4803 |                 terminal_id,\n 4804 |                 status,\n 4805 |             } => {\n 4806 |                 if let Some(entity) = self.terminals.get(&terminal_id) {\n 4807 |                     entity.update(cx, |term, cx| {\n 4808 |                         term.inner().update(cx, |inner, _| inner.shrink_to_used());\n 4809 |                         cx.notify();\n 4810 |                     });\n 4811 |                 } else {\n 4812 |                     self.pending_terminal_exit.insert(terminal_id, status);\n 4813 |                 }\n 4814 |             }","lines":13,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/acp_thread/src/acp_thread.rs#L4802-L4814"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`build_request_messages_until` renders the system prompt and `.expect(\"Invalid template\")`s\nthe result:\n\n```rust\n.render(&self.templates)\n.context(\"failed to build system prompt\")\n.expect(\"Invalid template\");\n```\n\nThis is a fallible operation on the hot request-building path (invoked for every\ncompletion, compaction, and title request). The template render pulls in runtime\ndata (`user_agents_md` from user-editable `AGENTS.md`, project context, model name),\nso a render failure crashes the whole app instead of surfacing an error. The direct\ncaller `build_completion_request` already returns `Result`, so the error can be\npropagated cleanly rather than panicking.","fix":"Change `build_request_messages_until` (and `build_request_messages`) to return\n`Result<Vec<LanguageModelRequestMessage>>` and replace `.expect(\"Invalid template\")`\nwith `?`, propagating up through `build_completion_request`/`build_compaction_request`\n(which already return / can return `Result`). Callers such as `run_turn_internal`\nalready handle a `Result` from `build_completion_request`.","locations":[{"ref":"crates/agent/src/thread.rs:4314-4353","code":" 4314 |     fn build_request_messages_until(\n 4315 |         &self,\n 4316 |         available_tools: Vec<SharedString>,\n 4317 |         end_ix: usize,\n 4318 |         cx: &App,\n 4319 |     ) -> Vec<LanguageModelRequestMessage> {\n 4320 |         let end_ix = end_ix.min(self.messages.len());\n 4321 |         log::trace!(\"Building request messages from {} thread messages\", end_ix);\n 4322 | \n 4323 |         let user_agents_md = UserAgentsMd::global(cx).and_then(|s| s.content().cloned());\n 4324 |         let system_prompt = SystemPromptTemplate {\n 4325 |             project: self.project_context.read(cx),\n 4326 |             available_tools,\n 4327 |             model_name: self.model().map(|m| m.name().0.to_string()),\n 4328 |             date: Local::now().format(\"%Y-%m-%d\").to_string(),\n 4329 |             user_agents_md,\n 4330 |             sandboxing: crate::sandboxing::sandboxing_enabled_for_project(\n 4331 |                 self.project.read(cx),\n 4332 |                 cx,\n 4333 |             ),\n 4334 |             is_linux: cfg!(target_os = \"linux\"),\n 4335 |             is_windows: cfg!(target_os = \"windows\"),\n 4336 |         }\n 4337 |         .render(&self.templates)\n 4338 |         .context(\"failed to build system prompt\")\n 4339 |         .expect(\"Invalid template\");\n 4340 |         let mut messages = vec![LanguageModelRequestMessage {\n 4341 |             role: Role::System,\n 4342 |             content: vec![system_prompt.into()],\n 4343 |             cache: false,\n 4344 |             reasoning_details: None,\n 4345 |         }];\n 4346 |         self.extend_request_history_until(&mut messages, end_ix);\n 4347 | \n 4348 |         if let Some(last_message) = messages.last_mut() {\n 4349 |             last_message.cache = true;\n 4350 |         }\n 4351 | \n 4352 |         messages\n 4353 |     }","lines":40,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent/src/thread.rs#L4314-L4353"},{"ref":"crates/agent/src/thread.rs:4337-4339","code":" 4337 |         .render(&self.templates)\n 4338 |         .context(\"failed to build system prompt\")\n 4339 |         .expect(\"Invalid template\");","lines":3,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent/src/thread.rs#L4337-L4339"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `ContextServerRegistry::reload_tools_for_server`, the tools map is cleared unconditionally with `registered_server.tools.clear()` *before* checking whether the `ListTools` request succeeded. The repopulation, `cx.emit(ContextServerRegistryEvent::ToolsChanged)`, and `cx.notify()` all live inside the `if let Some(response) = response.log_err()` block. So when the request fails (e.g. a transient timeout, or a `notifications/tools/list_changed` that races a server hiccup), every tool for that server is silently dropped from the registry, and *no* `ToolsChanged`/`notify` event is emitted. Consumers keep showing tools that no longer exist in the registry, and the tools do not come back until a later successful reload. The identical pattern exists in `reload_prompts_for_server` (clears `prompts` before checking the `PromptsList` response). The safer behavior is to only clear once a successful response is in hand, and to still notify when clearing.","fix":"Build the new map from the successful response and only then swap it in, and always notify. For example:\n```rust\nthis.update(cx, |this, cx| {\n    let Some(registered_server) = this.registered_servers.get_mut(&server_id) else {\n        return;\n    };\n    if let Some(response) = response.log_err() {\n        registered_server.tools.clear();\n        for tool in response.tools {\n            let tool = Arc::new(ContextServerTool::new(\n                this.server_store.clone(),\n                server.id(),\n                tool,\n            ));\n            registered_server.tools.insert(tool.name(), tool);\n        }\n        cx.emit(ContextServerRegistryEvent::ToolsChanged);\n        cx.notify();\n    }\n    // On failure, leave the previously loaded tools in place.\n})\n```","locations":[{"ref":"crates/agent/src/tools/context_server_registry.rs:188-207","code":"  188 |             this.update(cx, |this, cx| {\n  189 |                 let Some(registered_server) = this.registered_servers.get_mut(&server_id) else {\n  190 |                     return;\n  191 |                 };\n  192 | \n  193 |                 registered_server.tools.clear();\n  194 |                 if let Some(response) = response.log_err() {\n  195 |                     for tool in response.tools {\n  196 |                         let tool = Arc::new(ContextServerTool::new(\n  197 |                             this.server_store.clone(),\n  198 |                             server.id(),\n  199 |                             tool,\n  200 |                         ));\n  201 |                         registered_server.tools.insert(tool.name(), tool);\n  202 |                     }\n  203 |                     cx.emit(ContextServerRegistryEvent::ToolsChanged);\n  204 |                     cx.notify();\n  205 |                 }\n  206 |             })\n  207 |         });","lines":20,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent/src/tools/context_server_registry.rs#L188-L207"},{"ref":"crates/agent/src/tools/context_server_registry.rs:228-249","code":"  228 |             this.update(cx, |this, cx| {\n  229 |                 let Some(registered_server) = this.registered_servers.get_mut(&server_id) else {\n  230 |                     return;\n  231 |                 };\n  232 | \n  233 |                 registered_server.prompts.clear();\n  234 |                 if let Some(response) = response.log_err() {\n  235 |                     for prompt in response.prompts {\n  236 |                         let name: SharedString = prompt.name.clone().into();\n  237 |                         registered_server.prompts.insert(\n  238 |                             name,\n  239 |                             ContextServerPrompt {\n  240 |                                 server_id: server_id.clone(),\n  241 |                                 prompt,\n  242 |                             },\n  243 |                         );\n  244 |                     }\n  245 |                     cx.emit(ContextServerRegistryEvent::PromptsChanged);\n  246 |                     cx.notify();\n  247 |                 }\n  248 |             })\n  249 |         });","lines":22,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent/src/tools/context_server_registry.rs#L228-L249"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"The grep result range-merging loop shrinks the displayed snippet when it merges an overlapping neighbor whose end is earlier than the current range's end. It assigns `range.end = next_range.end` unconditionally whenever `range.end.row >= next_range.start.row`. Because the transformed ranges are not guaranteed to have monotonically non-decreasing ends (an earlier match can expand to a large capped ancestor node, e.g. rows `0..11`, while the next match's own syntax ancestor is a small nested node, e.g. rows `6..6`), the merge can move `range.end` *backwards* (from row `11` to row `6`), silently dropping the trailing lines of the already-selected range from the emitted snippet. The merge should extend the range, never contract it.","fix":"Take the maximum of the two ends when merging (`cmp` is already imported):\n\nBefore:\n```rust\nif range.end.row >= next_range.start.row {\n    range.end = next_range.end;\n    ranges.next();\n}\n```\n\nAfter:\n```rust\nif range.end.row >= next_range.start.row {\n    range.end = cmp::max(range.end, next_range.end);\n    ranges.next();\n}\n```","locations":[{"ref":"crates/agent/src/tools/grep_tool.rs:295-302","code":"  295 |                     while let Some((next_range, _, _)) = ranges.peek() {\n  296 |                         if range.end.row >= next_range.start.row {\n  297 |                             range.end = next_range.end;\n  298 |                             ranges.next();\n  299 |                         } else {\n  300 |                             break;\n  301 |                         }\n  302 |                     }","lines":8,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent/src/tools/grep_tool.rs#L295-L302"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`join_write_paths` documents (in its own doc comment, lines 968-978) that \"Each path is lexically normalized (resolving `.`/`..`) so that later subtree-containment checks and the user-facing approval prompt operate on the same path the sandbox will ultimately enforce.\" However, on Windows the two WSL-form branches return **before** `normalize_lexically` is ever applied: `wsl_drive_mount_path_to_windows_path` and `wsl_absolute_path` both do `return Some(path)` early. `wsl_drive_mount_path_to_windows_path` merely does string replacement (so `/mnt/c/a/../b` becomes `C:\\a\\..\\b`) and `wsl_absolute_path` returns the path untouched (so `/home/user/../../etc` is kept verbatim). These un-normalized `..`-containing paths then flow into the approval prompt and the sandbox `write_paths`, contradicting the doc comment and making the approved/enforced path differ from what the user reviewed.","fix":"Apply `util::paths::normalize_lexically` to the results of the WSL conversion branches too, instead of returning them early un-normalized. For example, map the branch outputs through normalization:\n```rust\n.filter_map(|raw| {\n    let candidate = if windows_paths {\n        wsl_drive_mount_path_to_windows_path(raw)\n            .or_else(|| wsl_absolute_path(raw))\n    } else {\n        None\n    };\n    let absolute = match candidate {\n        Some(path) => path,\n        None => {\n            let path = Path::new(raw);\n            if path.is_absolute() { path.to_path_buf() } else { base?.join(path) }\n        }\n    };\n    util::paths::normalize_lexically(&absolute).ok()\n})\n```","locations":[{"ref":"crates/agent/src/tools/terminal_tool.rs:1092-1110","code":" 1092 |         .filter_map(|raw| {\n 1093 |             if windows_paths {\n 1094 |                 if let Some(path) = wsl_drive_mount_path_to_windows_path(raw) {\n 1095 |                     return Some(path);\n 1096 |                 }\n 1097 |                 if let Some(path) = wsl_absolute_path(raw) {\n 1098 |                     return Some(path);\n 1099 |                 }\n 1100 |             }\n 1101 | \n 1102 |             let path = Path::new(raw);\n 1103 |             let absolute = if path.is_absolute() {\n 1104 |                 path.to_path_buf()\n 1105 |             } else {\n 1106 |                 base?.join(path)\n 1107 |             };\n 1108 |             util::paths::normalize_lexically(&absolute).ok()\n 1109 |         })\n 1110 |         .collect()","lines":19,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent/src/tools/terminal_tool.rs#L1092-L1110"},{"ref":"crates/agent/src/tools/terminal_tool.rs:1113-1139","code":" 1113 | fn wsl_drive_mount_path_to_windows_path(raw: &str) -> Option<PathBuf> {\n 1114 |     let raw = raw.replace('\\\\', \"/\");\n 1115 |     let remainder = raw.strip_prefix(\"/mnt/\")?;\n 1116 |     let (drive, rest) = remainder\n 1117 |         .split_once('/')\n 1118 |         .map_or((remainder, \"\"), |(drive, rest)| (drive, rest));\n 1119 |     let mut drive_chars = drive.chars();\n 1120 |     let drive = drive_chars.next()?.to_ascii_uppercase();\n 1121 |     if !drive.is_ascii_alphabetic() || drive_chars.next().is_some() {\n 1122 |         return None;\n 1123 |     }\n 1124 | \n 1125 |     let mut windows_path = format!(\"{drive}:\\\\\");\n 1126 |     if !rest.is_empty() {\n 1127 |         windows_path.push_str(&rest.replace('/', \"\\\\\"));\n 1128 |     }\n 1129 |     Some(PathBuf::from(windows_path))\n 1130 | }\n 1131 | \n 1132 | fn wsl_absolute_path(raw: &str) -> Option<PathBuf> {\n 1133 |     let raw = raw.replace('\\\\', \"/\");\n 1134 |     if raw.starts_with('/') && !raw.starts_with(\"//\") {\n 1135 |         Some(PathBuf::from(raw))\n 1136 |     } else {\n 1137 |         None\n 1138 |     }\n 1139 | }","lines":27,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent/src/tools/terminal_tool.rs#L1113-L1139"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`config_state` silently discards the agent-reported session `modes` whenever\n`config_options` is also present:\n```rust\nfn config_state(\n    modes: Option<acp::SessionModeState>,\n    config_options: Option<Vec<acp::SessionConfigOption>>,\n) -> (Option<Rc<RefCell<acp::SessionModeState>>>, Option<Rc<RefCell<Vec<acp::SessionConfigOption>>>>) {\n    if let Some(opts) = config_options {\n        return (None, Some(Rc::new(RefCell::new(opts)))); // modes dropped here\n    }\n    let modes = modes.map(|modes| Rc::new(RefCell::new(modes)));\n    (modes, None)\n}\n```\nThe ACP schema permits a `NewSessionResponse`/`LoadSessionResponse` to carry **both**\n`modes` and `config_options`. When both are present this function returns `None` for\nmodes, so:\n- `AcpConnection::session_modes` returns `None` (the mode picker disappears), and\n- the configured `default_mode` is never applied, because `new_session` only applies it\n  inside `if let Some(modes) = modes.as_ref()` (`crates/agent_servers/src/acp.rs:1605-1653`).\n\nThis is used from both `new_session` and the load/resume path via\n`open_or_create_session` (`crates/agent_servers/src/acp.rs:1237-1264`).","fix":"Preserve both fields instead of treating them as mutually exclusive:\n```rust\nfn config_state(\n    modes: Option<acp::SessionModeState>,\n    config_options: Option<Vec<acp::SessionConfigOption>>,\n) -> (Option<Rc<RefCell<acp::SessionModeState>>>, Option<Rc<RefCell<Vec<acp::SessionConfigOption>>>>) {\n    (\n        modes.map(|modes| Rc::new(RefCell::new(modes))),\n        config_options.map(|opts| Rc::new(RefCell::new(opts))),\n    )\n}\n```\nIf the intent really is that `config_options` supersedes `modes`, add a comment and an\nexplicit assertion/log, but the current silent drop of a valid, advertised capability is\na latent UX bug.","locations":[{"ref":"crates/agent_servers/src/acp.rs:4399-4412","code":" 4399 | fn config_state(\n 4400 |     modes: Option<acp::SessionModeState>,\n 4401 |     config_options: Option<Vec<acp::SessionConfigOption>>,\n 4402 | ) -> (\n 4403 |     Option<Rc<RefCell<acp::SessionModeState>>>,\n 4404 |     Option<Rc<RefCell<Vec<acp::SessionConfigOption>>>>,\n 4405 | ) {\n 4406 |     if let Some(opts) = config_options {\n 4407 |         return (None, Some(Rc::new(RefCell::new(opts))));\n 4408 |     }\n 4409 | \n 4410 |     let modes = modes.map(|modes| Rc::new(RefCell::new(modes)));\n 4411 |     (modes, None)\n 4412 | }","lines":14,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_servers/src/acp.rs#L4399-L4412"},{"ref":"crates/agent_servers/src/acp.rs:1627-1677","code":" 1627 |             let (modes, config_options) = config_state(response.modes, response.config_options);\n 1628 | \n 1629 |             let default_mode = self.defaults.mode();\n 1630 |             if let Some(default_mode) = default_mode {\n 1631 |                 if let Some(modes) = modes.as_ref() {\n 1632 |                     let mut modes_ref = modes.borrow_mut();\n 1633 |                     let has_mode = modes_ref\n 1634 |                         .available_modes\n 1635 |                         .iter()\n 1636 |                         .any(|mode| mode.id == default_mode);\n 1637 | \n 1638 |                     if has_mode {\n 1639 |                         let initial_mode_id = modes_ref.current_mode_id.clone();\n 1640 | \n 1641 |                         cx.spawn({\n 1642 |                             let default_mode = default_mode.clone();\n 1643 |                             let session_id = response.session_id.clone();\n 1644 |                             let modes = modes.clone();\n 1645 |                             let conn = self.connection.clone();\n 1646 |                             async move |_| {\n 1647 |                                 let result = conn\n 1648 |                                     .send_request(acp::SetSessionModeRequest::new(\n 1649 |                                         session_id,\n 1650 |                                         default_mode,\n 1651 |                                     ))\n 1652 |                                     .block_task()\n 1653 |                                 .await\n 1654 |                                 .log_err();\n 1655 | \n 1656 |                                 if result.is_none() {\n 1657 |                                     modes.borrow_mut().current_mode_id = initial_mode_id;\n 1658 |                                 }\n 1659 |                             }\n 1660 |                         })\n 1661 |                         .detach();\n 1662 | \n 1663 |                         modes_ref.current_mode_id = default_mode;\n 1664 |                     } else {\n 1665 |                         let available_modes = modes_ref\n 1666 |                             .available_modes\n 1667 |                             .iter()\n 1668 |                             .map(|mode| format!(\"- `{}`: {}\", mode.id, mode.name))\n 1669 |                             .collect::<Vec<_>>()\n 1670 |                             .join(\"\\n\");\n 1671 | \n 1672 |                         log::warn!(\n 1673 |                             \"`{default_mode}` is not valid {name} mode. Available options:\\n{available_modes}\",\n 1674 |                         );\n 1675 |                     }\n 1676 |                 }\n 1677 |             }","lines":51,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_servers/src/acp.rs#L1627-L1677"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`InlineAssistant::cancel_all_active_completions` is documented as \"Hides all active inline assists when AI is disabled\" and is invoked from the `SettingsStore` observer when `disable_ai` becomes true. However, its body does not dismiss or finish any inline assist. It iterates `self.assists_by_editor`, and for each editor only calls `editor.cancel(...)` when `editor.has_active_edit_prediction()` is true. `has_active_edit_prediction()` reports Copilot-style edit predictions, which are unrelated to inline assist blocks/decorations, so editors that have inline assists but no edit prediction are skipped entirely, and even for those that pass the check `editor.cancel(...)` does not remove the inline assist decorations (the registered `Cancel` handler `handle_editor_cancel` merely focuses the nearest assist). Additionally the code only ever uses `cx.windows()[0]`, so any editor living in a window other than the first one is updated in the wrong window context. Net effect: disabling AI does not actually hide active inline assist UI.","fix":"Actually dismiss/finish the inline assists rather than gating on edit predictions and a single window. Collect the assist ids from `self.assists_by_editor` and call `self.finish_assist(assist_id, true, window, cx)` (or `dismiss_assist`) for each, using the correct window for each editor instead of `cx.windows()[0]`. The `has_active_edit_prediction()` guard should be removed since it is unrelated to inline assist state.","locations":[{"ref":"crates/agent_ui/src/inline_assistant.rs:162-179","code":"  162 |     pub fn cancel_all_active_completions(&mut self, cx: &mut App) {\n  163 |         // Cancel all active completions in editors\n  164 |         for (editor_handle, _) in self.assists_by_editor.iter() {\n  165 |             if let Some(editor) = editor_handle.upgrade() {\n  166 |                 let windows = cx.windows();\n  167 |                 if !windows.is_empty() {\n  168 |                     let window = windows[0];\n  169 |                     let _ = window.update(cx, |_, window, cx| {\n  170 |                         editor.update(cx, |editor, cx| {\n  171 |                             if editor.has_active_edit_prediction() {\n  172 |                                 editor.cancel(&Default::default(), window, cx);\n  173 |                             }\n  174 |                         });\n  175 |                     });\n  176 |                 }\n  177 |             }\n  178 |         }\n  179 |     }","lines":18,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/agent_ui/src/inline_assistant.rs#L162-L179"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"`into_anthropic` silently drops the caller's stop sequences. `LanguageModelRequest` has a `stop: Vec<String>` field (see `crates/language_model_core/src/request.rs:429`), and the Anthropic `Request` has a matching `stop_sequences: Vec<String>` field, but the conversion hard-codes `stop_sequences: Vec::new()` and never reads `request.stop`. Any user-configured or caller-provided stop sequences are therefore never forwarded to the Anthropic API, so generation is not stopped where the caller asked.","fix":"Forward the request's stop sequences. `request.stop` is still available at this point (only other fields have been moved). Before:\n```rust\n        stop_sequences: Vec::new(),\n```\nAfter:\n```rust\n        stop_sequences: request.stop,\n```","locations":[{"ref":"crates/anthropic/src/completion.rs:471","code":"  471 |         stop_sequences: Vec::new(),","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/anthropic/src/completion.rs#L471"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`convert_to_async_body` in `crates/aws_http_client/src/aws_http_client.rs:99`-`104` converts an `SdkBody` to `AsyncBody` by calling `body.bytes()` and, when it returns `None`, substitutes an empty body. `SdkBody::bytes()` only returns `Some` for bodies that are fully buffered in memory; for any streaming `SdkBody` it returns `None`, so a streaming request body would be silently replaced with an empty body and the request sent with no payload. This is a silent data-loss path: it produces no error and would manifest only as malformed/empty requests to Bedrock.","fix":"Do not silently drop non-buffered bodies. Either bridge the streaming `SdkBody` to `AsyncBody` without buffering, or if only buffered bodies are ever expected here, return an explicit error (or log) when `body.bytes()` is `None` instead of substituting `AsyncBody::empty()`.","locations":[{"ref":"crates/aws_http_client/src/aws_http_client.rs:99-104","code":"   99 | pub fn convert_to_async_body(body: SdkBody) -> AsyncBody {\n  100 |     match body.bytes() {\n  101 |         Some(bytes) => AsyncBody::from((*bytes).to_vec()),\n  102 |         None => AsyncBody::empty(),\n  103 |     }\n  104 | }","lines":6,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/aws_http_client/src/aws_http_client.rs#L99-L104"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `ActiveCall::invite`, the called user is inserted into `self.pending_invites` (line 466) and then, if the join debouncer is currently running, the function returns early with `Task::ready(Ok(()))` (lines 471-473). The cleanup that removes the user from `pending_invites` lives only in the final `cx.spawn` closure (`this.pending_invites.remove(&called_user_id)` around line 549), which is never reached on this early-return path. As a result:\n- the invite is silently never sent (no request, no room work), yet the caller sees `Ok(())`, and\n- `called_user_id` stays in `pending_invites` forever, so the UI keeps showing the user as \"invited\" and any later attempt to invite the same user is rejected at line 466 with `\"user was already invited\"`.\nContrast this with `join_channel`/`accept_incoming`, which check the pending state *before* mutating any state.","fix":"Either check `self._join_debouncer.running()` before inserting into `pending_invites`, or undo the insert on the early-return path. For example, move the debouncer guard above the insert:\n```rust\nif self._join_debouncer.running() {\n    return Task::ready(Ok(()));\n}\nif !self.pending_invites.insert(called_user_id) {\n    return Task::ready(Err(anyhow!(\"user was already invited\")));\n}\ncx.notify();\n```\nso `pending_invites` is only populated when the invite actually proceeds.","locations":[{"ref":"crates/call/src/call_impl/mod.rs:486-499","code":"  486 |     pub fn invite(\n  487 |         &mut self,\n  488 |         called_user_id: u64,\n  489 |         initial_project: Option<Entity<Project>>,\n  490 |         cx: &mut Context<Self>,\n  491 |     ) -> Task<Result<()>> {\n  492 |         if !self.pending_invites.insert(called_user_id) {\n  493 |             return Task::ready(Err(anyhow!(\"user was already invited\")));\n  494 |         }\n  495 |         cx.notify();\n  496 | \n  497 |         if self._join_debouncer.running() {\n  498 |             return Task::ready(Ok(()));\n  499 |         }","lines":14,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/call/src/call_impl/mod.rs#L486-L499"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`access_project` resolves the caller's `ChannelRole` by matching `room_participant` on `RoomId` and `AnsweringConnectionId` only, omitting `AnsweringConnectionServerId`. Connection ids are unique only per server (the `server_id`/epoch mechanism exists precisely because a numeric connection id can repeat across servers), so during rolling deploys or reconnections two participants in the same room can share the same numeric `AnsweringConnectionId` on different servers. `.one(tx)` then returns an arbitrary matching row, so the caller can be granted another participant's role (e.g. `Admin`/`ReadWrite`) - an authorization bypass. Every other participant lookup in this crate filters on both id and server id (compare `share_project` at `crates/collab/src/db/queries/projects.rs:42-51`, and `check_room_participants`, `room_connection_lost`, `leave_room`).","fix":"Add the server-id predicate (and cast the id like the rest of the file does):\n```rust\nroom_participant::Entity::find()\n    .filter(room_participant::Column::RoomId.eq(room_id))\n    .filter(room_participant::Column::AnsweringConnectionId.eq(connection_id.id as i32))\n    .filter(room_participant::Column::AnsweringConnectionServerId.eq(connection_id.owner_id as i32))\n    .one(tx)\n    .await?\n    .and_then(|participant| participant.role)\n```","locations":[{"ref":"crates/collab/src/db/queries/projects.rs:1122-1131","code":" 1122 |         let role_from_room = if let Some(room_id) = project.room_id {\n 1123 |             room_participant::Entity::find()\n 1124 |                 .filter(room_participant::Column::RoomId.eq(room_id))\n 1125 |                 .filter(room_participant::Column::AnsweringConnectionId.eq(connection_id.id))\n 1126 |                 .one(tx)\n 1127 |                 .await?\n 1128 |                 .and_then(|participant| participant.role)\n 1129 |         } else {\n 1130 |             None\n 1131 |         };","lines":10,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/collab/src/db/queries/projects.rs#L1122-L1131"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"In `leave_room` the follower cleanup deletes rows matching only `follower::Column::FollowerConnectionId.eq(connection.id as i32)`, without also filtering on `follower::Column::FollowerConnectionServerId`. Because connection ids collide across servers, this can delete follower rows belonging to a *different* live connection that happens to share the same numeric id on another server, silently breaking that user's following. Contrast `leave_project` in the same crate (`crates/collab/src/db/queries/projects.rs:1038-1061`), which scopes follower deletion by both connection id and server id (and by leader/follower).","fix":"Include the server id in the filter:\n```rust\nfollower::Entity::delete_many()\n    .filter(\n        Condition::all()\n            .add(follower::Column::FollowerConnectionId.eq(connection.id as i32))\n            .add(follower::Column::FollowerConnectionServerId.eq(connection.owner_id as i32)),\n    )\n    .exec(&*tx)\n    .await?;\n```","locations":[{"ref":"crates/collab/src/db/queries/rooms.rs:1018-1024","code":" 1018 |                 follower::Entity::delete_many()\n 1019 |                     .filter(\n 1020 |                         Condition::all()\n 1021 |                             .add(follower::Column::FollowerConnectionId.eq(connection.id as i32)),\n 1022 |                     )\n 1023 |                     .exec(&*tx)\n 1024 |                     .await?;","lines":7,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/collab/src/db/queries/rooms.rs#L1018-L1024"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`forward_project_search_chunk` forwards a client-supplied message to an arbitrary\n`peer_id` with no authorization check, unlike every sibling handler that forwards to a\nclient-named peer. `create_buffer_for_peer` and `create_image_for_peer` both call\n`check_user_is_project_host(project_id, session.connection_id)` before forwarding, and\n`forward_read_only_project_request` / `forward_mutating_project_request` /\n`broadcast_project_message_from_host` all resolve the target through the database\n(`host_for_*_project_request`, `project_connection_ids`) which validates that the sender\nactually participates in the project. `forward_project_search_chunk` instead does:\n```rust\nlet peer_id = message.peer_id.context(\"missing peer_id\")?;\nlet payload = session\n    .peer\n    .forward_request(session.connection_id, peer_id.into(), message)\n    .await?;\n```\nThe `project_id` field carried in `proto::FindSearchCandidatesChunk` is never used to\nverify membership, and `peer_id` is fully client-controlled. Any authenticated user can\ntherefore inject `FindSearchCandidatesChunk` requests (forged `buffer_ids` / `Done`\nmarkers) into an arbitrary connected peer's search flow without sharing any project or\nroom with that peer.","fix":"Validate that the sender is a legitimate host for `message.project_id` and that the\ntarget `peer_id` is a collaborator, mirroring `create_buffer_for_peer`. For example,\nresolve/authorize the target via the database before forwarding, e.g. call\n`session.db().await.check_user_is_project_host(ProjectId::from_proto(message.project_id), session.connection_id).await?`\n(or the equivalent membership check for the guest->host direction) and confirm `peer_id`\nbelongs to that project before `forward_request`.","locations":[{"ref":"crates/collab/src/rpc.rs:2587-2599","code":" 2587 | async fn forward_project_search_chunk(\n 2588 |     message: proto::FindSearchCandidatesChunk,\n 2589 |     response: Response<proto::FindSearchCandidatesChunk>,\n 2590 |     session: MessageContext,\n 2591 | ) -> Result<()> {\n 2592 |     let peer_id = message.peer_id.context(\"missing peer_id\")?;\n 2593 |     let payload = session\n 2594 |         .peer\n 2595 |         .forward_request(session.connection_id, peer_id.into(), message)\n 2596 |         .await?;\n 2597 |     response.send(payload)?;\n 2598 |     Ok(())\n 2599 | }","lines":13,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/collab/src/rpc.rs#L2587-L2599"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `go_to_scenario_definition`, the comment states the code searches for the matching `\"label\"` line \"from the end rather than the start so we bias towards more recently\" created scenarios. However the code uses `editor.text(cx).lines().enumerate().find_map(...)`, which iterates from the first line and returns the first match. Since newly created scenarios are appended to the end of the JSON array, this jumps to the oldest matching label rather than the most recent one, contradicting both the comment and the stated intent.","fix":"Search from the end so the last (most recently appended) matching line wins, e.g. collect the enumerated lines and use `.rev().find_map(...)`, or replace `find_map` with a filter that keeps the last match:\n```\nlet row = editor.text(cx).lines().enumerate()\n    .filter(|(_, text)| text.contains(scenario.label.as_ref()) && text.contains(\"\\\"label\\\": \"))\n    .last()\n    .map(|(row, _)| row);\n```","locations":[{"ref":"crates/debugger_ui/src/debugger_panel.rs:1160","code":" 1160 |                 let row = editor.text(cx).lines().enumerate().find_map(|(row, text)| {","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/debugger_ui/src/debugger_panel.rs#L1160"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`ContentBlock::append` on an existing `ContentBlock::Image` replaces the whole\nblock with a markdown block whose text is ``\"`Image`\\n{new_content}\"``, silently\ndiscarding the decoded image (`Arc<gpui::Image>` and dimensions). Any content\nappended after an image chunk loses the image entirely, leaving only the literal\ntext `` `Image` ``.","fix":"Preserve the image when appending: either keep the `Image` block and ignore the\nappended text, or model multi-part content so the image and subsequent text can\ncoexist, rather than converting the image into a placeholder markdown string.","locations":[{"ref":"crates/acp_thread/src/acp_thread.rs:1454-1458","code":" 1454 |             (ContentBlock::Image { .. }, _) => {\n 1455 |                 let new_content = Self::block_string_contents(&block, path_style);\n 1456 |                 let combined = format!(\"`Image`\\n{}\", new_content);\n 1457 |                 *self = Self::create_markdown_block(combined, language_registry, cx);\n 1458 |             }","lines":5,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/acp_thread/src/acp_thread.rs#L1454-L1458"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`authorize_tool_call` maps `outcome.option_kind` to a new status. For any\n`PermissionOptionKind` other than the explicit reject/allow variants (the `_`\narms), it falls through to `status_after_permission_grant` / `InProgress`, i.e. an\nunrecognized permission option is treated as *granting* the tool call. Defaulting\nan unknown authorization outcome to \"allow\" is an unsafe posture; it should\ndefault to reject.","fix":"Make the `_` arms default to `ToolCallStatus::Rejected` (deny) rather than to a\ngrant, so only the explicit allow variants proceed.","locations":[{"ref":"crates/acp_thread/src/acp_thread.rs:3500-3516","code":" 3500 |                     match outcome.option_kind {\n 3501 |                         acp::PermissionOptionKind::RejectOnce\n 3502 |                         | acp::PermissionOptionKind::RejectAlways => ToolCallStatus::Rejected,\n 3503 |                         acp::PermissionOptionKind::AllowOnce\n 3504 |                         | acp::PermissionOptionKind::AllowAlways => {\n 3505 |                             ToolCallStatus::status_after_permission_grant(*current_status)\n 3506 |                         }\n 3507 |                         _ => ToolCallStatus::status_after_permission_grant(*current_status),\n 3508 |                     }\n 3509 |                 }\n 3510 |                 _ => match outcome.option_kind {\n 3511 |                     acp::PermissionOptionKind::RejectOnce\n 3512 |                     | acp::PermissionOptionKind::RejectAlways => ToolCallStatus::Rejected,\n 3513 |                     acp::PermissionOptionKind::AllowOnce\n 3514 |                     | acp::PermissionOptionKind::AllowAlways => ToolCallStatus::InProgress,\n 3515 |                     _ => ToolCallStatus::InProgress,\n 3516 |                 },","lines":17,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/acp_thread/src/acp_thread.rs#L3500-L3516"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"On `acp::StopReason::MaxTokens` the turn always fails with\n`anyhow!(MaxOutputTokensError)`, whose `Display` is `\"output token limit\nreached\"`. `MaxTokens` is also emitted when the *context window* (input tokens)\nis exhausted, not only when the model's output budget is hit; the code even\ncomputes `exceeded_max_output_tokens` but ignores it when choosing the error.\nUsers hitting a context-window limit are told they hit the output token limit,\nwhich is misleading.","fix":"Return an error variant that reflects the actual cause: use\n`MaxOutputTokensError` only when `exceeded_max_output_tokens` is true, otherwise\nreturn a distinct max-context/`MaxTokens` error with an accurate message.","locations":[{"ref":"crates/acp_thread/src/acp_thread.rs:3855-3880","code":" 3855 |                         if r.stop_reason == acp::StopReason::MaxTokens {\n 3856 |                             if is_same_turn {\n 3857 |                                 cx.emit(AcpThreadEvent::StatusChanged);\n 3858 |                             }\n 3859 |                             this.had_error = true;\n 3860 |                             cx.emit(AcpThreadEvent::Error);\n 3861 |                             log::error!(\"Max tokens reached. Usage: {:?}\", this.token_usage);\n 3862 | \n 3863 |                             let exceeded_max_output_tokens =\n 3864 |                                 this.token_usage.as_ref().is_some_and(|u| {\n 3865 |                                     u.max_output_tokens\n 3866 |                                         .is_some_and(|max| u.output_tokens >= max)\n 3867 |                                 });\n 3868 | \n 3869 |                             if exceeded_max_output_tokens {\n 3870 |                                 log::error!(\n 3871 |                                     \"Max output tokens reached. Usage: {:?}\",\n 3872 |                                     this.token_usage\n 3873 |                                 );\n 3874 |                             } else {\n 3875 |                                 log::error!(\"Max tokens reached. Usage: {:?}\", this.token_usage);\n 3876 |                             }\n 3877 |                             if is_same_turn {\n 3878 |                                 this.cancel_pending_turn_entries(cx);\n 3879 |                             }\n 3880 |                             return Err(anyhow!(MaxOutputTokensError));","lines":26,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/acp_thread/src/acp_thread.rs#L3855-L3880"}]},
{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`refresh_connections` calls `self.expanded.clear()` unconditionally at the end. This method is invoked from the `cx.observe(connection_store)` subscription, so it runs on *any* notify from the connection store (a new connection appearing, a status change, etc.), not just when the selected connection changes. As a result, every unrelated connection-store update collapses all log entries the user has manually expanded in the ACP log view.","fix":"Only clear `expanded` when the selected connection actually changes (as `select_connection` already does), not on every `refresh_connections`. Track the previously selected `AgentId` and clear only when it differs.","locations":[{"ref":"crates/acp_tools/src/acp_tools.rs:198-204","code":"  198 |         self.selected_connection = self\n  199 |             .selected_connection\n  200 |             .clone()\n  201 |             .filter(|agent_id| self.should_keep_selected_connection(agent_id, cx))\n  202 |             .or_else(|| self.watched_connections.keys().next().cloned());\n  203 |         self.expanded.clear();\n  204 |         cx.notify();","lines":7,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/acp_tools/src/acp_tools.rs#L198-L204"},{"ref":"crates/acp_tools/src/acp_tools.rs:111-116","code":"  111 |         self._connection_store_subscription = connection_store.as_ref().map(|connection_store| {\n  112 |             cx.observe(connection_store, |this, _, cx| {\n  113 |                 this.refresh_connections(cx);\n  114 |             })\n  115 |         });\n  116 |         self.refresh_connections(cx);","lines":6,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/acp_tools/src/acp_tools.rs#L111-L116"}]},
{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`collapsed_params_md` \"spaces out\" JSON by iterating characters and inserting spaces after `{`, `}`, `:` and `,`. This runs over the raw serialized JSON without tracking string context, so any `{`, `}`, `:` or `,` that appears *inside* a JSON string value (file paths, commit messages, code snippets, URLs, etc.) is also rewritten. The collapsed preview then displays corrupted string content that no longer matches the actual message.","fix":"Either only insert spacing while outside a JSON string (track quote/escape state while iterating), or drop the hand-rolled spacer entirely and render the compact `serde_json` output (the expanded view already uses `to_string_pretty`).","locations":[{"ref":"crates/acp_tools/src/acp_tools.rs:619-639","code":"  619 | fn collapsed_params_md(\n  620 |     params: &serde_json::Value,\n  621 |     language_registry: &Arc<LanguageRegistry>,\n  622 |     cx: &mut App,\n  623 | ) -> Entity<Markdown> {\n  624 |     let params_json = serde_json::to_string(params).unwrap_or_default();\n  625 |     let mut spaced_out_json = String::with_capacity(params_json.len() + params_json.len() / 4);\n  626 | \n  627 |     for ch in params_json.chars() {\n  628 |         match ch {\n  629 |             '{' => spaced_out_json.push_str(\"{ \"),\n  630 |             '}' => spaced_out_json.push_str(\" }\"),\n  631 |             ':' => spaced_out_json.push_str(\": \"),\n  632 |             ',' => spaced_out_json.push_str(\", \"),\n  633 |             c => spaced_out_json.push(c),\n  634 |         }\n  635 |     }\n  636 | \n  637 |     let params_md = format!(\"```json\\n{}\\n```\", spaced_out_json);\n  638 |     cx.new(|cx| Markdown::new(params_md.into(), Some(language_registry.clone()), None, cx))\n  639 | }","lines":21,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/acp_tools/src/acp_tools.rs#L619-L639"}]},
{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`GIT_OPERATION_DELAY` is `Duration::from_millis(0)`, but it is used as a threshold to decide whether to show \"long-running\" git and fs jobs (`Instant::now() - job_info.start >= GIT_OPERATION_DELAY`). With a zero threshold the comparison is always true, so *every* git/fs job is displayed immediately and the constant plus the surrounding \"Show any long-running ...\" comments are misleading - there is effectively no delay/debounce at all. Either the constant should carry a real delay or the comments/name should be corrected.","fix":"Either restore a meaningful debounce, e.g. `const GIT_OPERATION_DELAY: Duration = Duration::from_millis(250);`, or, if instant display is intended, remove the now-vacuous `Instant::now() ... >= GIT_OPERATION_DELAY` guards and update the comments so they no longer claim to filter for \"long-running\" jobs.","locations":[{"ref":"crates/activity_indicator/src/activity_indicator.rs:28","code":"   28 | const GIT_OPERATION_DELAY: Duration = Duration::from_millis(0);","lines":1,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/activity_indicator/src/activity_indicator.rs#L28"},{"ref":"crates/activity_indicator/src/activity_indicator.rs:463-485","code":"  463 |         // Show any long-running git command\n  464 |         if let Some(job_info) = current_job\n  465 |             && Instant::now() - job_info.start >= GIT_OPERATION_DELAY\n  466 |         {\n  467 |             return Some(Content {\n  468 |                 icon: ActivityIcon::LoadingSpinner,\n  469 |                 message: job_info.message.into(),\n  470 |                 on_click: None,\n  471 |                 tooltip_message: None,\n  472 |             });\n  473 |         }\n  474 | \n  475 |         // Show any long-running fs command\n  476 |         for fs_job in &self.fs_jobs {\n  477 |             if Instant::now().duration_since(fs_job.start) >= GIT_OPERATION_DELAY {\n  478 |                 return Some(Content {\n  479 |                     icon: ActivityIcon::LoadingSpinner,\n  480 |                     message: fs_job.message.clone().into(),\n  481 |                     on_click: None,\n  482 |                     tooltip_message: None,\n  483 |                 });\n  484 |             }\n  485 |         }","lines":23,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/activity_indicator/src/activity_indicator.rs#L463-L485"}]},
{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`show_error_message` silently drops a `Health(Error | Warning, None)` status: the `None => false` arm removes the status from `self.statuses` without emitting any `Event::ShowStatus` and without setting `status_message_shown`. A user clicking \"show error\" on such a server sees nothing and the status disappears, which can look like the click did nothing. The intent (drop empty messages) is plausible but the silent removal of a user-visible error/warning entry is surprising.","fix":"Either keep the status (`None => true`) so it remains visible, or surface a fallback message instead of silently discarding it, e.g. emit `Event::ShowStatus` with a generic \"no details available\" body when `status_string` is `None`.","locations":[{"ref":"crates/activity_indicator/src/activity_indicator.rs:298-311","code":"  298 |             LanguageServerStatusUpdate::Health(\n  299 |                 ServerHealth::Error | ServerHealth::Warning,\n  300 |                 status_string,\n  301 |             ) if !status_message_shown => match status_string {\n  302 |                 Some(error) => {\n  303 |                     cx.emit(Event::ShowStatus {\n  304 |                         server_name: status.name.clone(),\n  305 |                         status: error.clone(),\n  306 |                     });\n  307 |                     status_message_shown = true;\n  308 |                     false\n  309 |                 }\n  310 |                 None => false,\n  311 |             },","lines":14,"link":"https://github.com/zed-industries/zed/blob/7960b2a7c9568e90fbe0727332149e5b2a5fd57a/crates/activity_indicator/src/activity_indicator.rs#L298-L311"}]},
