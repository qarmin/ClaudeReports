{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"critical","difficulty":"medium","description":"Gaussian blur with decimation panics (index out of bounds) on images whose dimensions are not divisible by 2^n_decimations. In `apply_blur`, the upscale loop calls `upscale(pixmap, w, h, ...)` with the *current logical* dimensions, and `upscale` internally computes the physical write extent as `dst_width = src_width * 2` (gaussian_blur.rs:334-335), writing pixels at columns/rows up to `2*w-1`. But the physical `Pixmap` is only the *original* size. For odd dimensions the upsampled logical size (clamped in `DecimationSizer::upscale`) is smaller than `2*w` (e.g. width 5 -> 3 after one downscale, then upscale writes column index 5 into a 5-wide buffer). `Pixmap::set_pixel` indexes `width*y + x` with the physical width and panics on the OOB index. Verified by adding a test (Pixmap::new(5,5), plan_decimated_blur(5.0) => n_decimations>=1): panics with 'index out of bounds: the len is 25 but the index is 25' at pixmap.rs:343. Any blur with std_deviation roughly >= 2.2 on an image with an odd width or height (or any size not a clean power-of-two multiple) triggers this.","fix":"Do not let `upscale` write `2*src_width` pixels unconditionally. Pass the target (parent) logical dimensions into the upscale step and clamp the physical write extent to them, mirroring `DecimationSizer::upscale`'s clamp. Concretely: have `upscale`/`upscale_x`/`upscale_y` take a `dst_width`/`dst_height` (the pre-downscale logical size popped from the sizer) and only write `dst_x`/`dst_y` indices that are `< dst_width`/`< dst_height`. Drive the loop off `sizer.upscale()`'s returned target dims rather than the current dims.","locations":[{"ref":"vello_cpu/src/filter/gaussian_blur.rs:93-98","code":"   93 |     // Upsample back to original resolution (each step doubles resolution by 2×)\n   94 |     for _ in 0..n_decimations {\n   95 |         let (w, h) = sizer.current();\n   96 |         upscale(pixmap, w, h, edge_mode);\n   97 |         sizer.upscale();\n   98 |     }","lines":6,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/vello_cpu/src/filter/gaussian_blur.rs#L93-L98"},{"ref":"vello_cpu/src/filter/gaussian_blur.rs:328-339","code":"  328 | pub(crate) fn upscale(\n  329 |     src: &mut Pixmap,\n  330 |     src_width: u16,\n  331 |     src_height: u16,\n  332 |     edge_mode: EdgeMode,\n  333 | ) -> (u16, u16) {\n  334 |     let dst_width = src_width * 2;\n  335 |     let dst_height = src_height * 2;\n  336 |     upscale_x(src, src_width, src_height, edge_mode);\n  337 |     upscale_y(src, dst_width, src_height, edge_mode);\n  338 |     (dst_width, dst_height)\n  339 | }","lines":12,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/vello_cpu/src/filter/gaussian_blur.rs#L328-L339"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`palette_index_to_color` indexes the CPAL color-records array with `palette_index as usize` without any bounds check. A malformed or hostile COLR/CPAL font can specify a palette index that is >= the array length, producing an index-out-of-bounds panic while painting a COLR glyph. Font data is untrusted input, so this is a denial-of-service panic on bad fonts.","fix":"Use `.get(palette_index as usize)` and return `None` (or fall back to context color / black) when the index is out of range, instead of indexing directly.","locations":[{"ref":"glifo/src/colr.rs:130-138","code":"  130 |     fn palette_index_to_color(&self, palette_index: u16, alpha: f32) -> Option<AlphaColor<Srgb>> {\n  131 |         if palette_index != u16::MAX {\n  132 |             let color = self\n  133 |                 .colr_glyph\n  134 |                 .font_ref\n  135 |                 .cpal()\n  136 |                 .ok()?\n  137 |                 .color_records_array()?\n  138 |                 .ok()?[palette_index as usize];","lines":9,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/glifo/src/colr.rs#L130-L138"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`convert_stops` assumes the color-stop slice is non-empty: it reads `stops[0]` and `stops.last().unwrap()` after collecting. For a malformed font whose gradient brush carries zero color stops, `stops` will be empty and both accesses panic. (`fill` only guards `stops.len() == 1`, never the empty case before calling/using the result.)","fix":"Early-return a sane default (e.g. a single black stop, or skip the fill) when `stops.is_empty()` before indexing.","locations":[{"ref":"glifo/src/colr.rs:166-167","code":"  166 |         let first_stop = stops[0];\n  167 |         let last_stop = *stops.last().unwrap();","lines":2,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/glifo/src/colr.rs#L166-L167"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`FontDataExt::as_skrifa` calls `FontRef::from_index(...).unwrap()`, and `prepare_glyph_run` calls `.head()...unwrap()` for units_per_em. These run on caller-supplied font data; a font that parsed earlier in the pipeline but fails re-parse here (or lacks a `head` table) will panic instead of being handled gracefully. `as_skrifa` is called on every glyph run.","fix":"Propagate the error (return an empty/no-op run) or document that the font is validated before reaching this point; avoid `unwrap` on untrusted font parsing.","locations":[{"ref":"glifo/src/glyph.rs:1418-1420","code":" 1418 |     fn as_skrifa(&self) -> FontRef<'_> {\n 1419 |         FontRef::from_index(self.data.data(), self.index).unwrap()\n 1420 |     }","lines":3,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/glifo/src/glyph.rs#L1418-L1420"},{"ref":"glifo/src/glyph.rs:1624-1630","code":" 1624 |     let upem = run\n 1625 |         .font\n 1626 |         .as_skrifa()\n 1627 |         .head()\n 1628 |         .map(|h| h.units_per_em())\n 1629 |         .unwrap()\n 1630 |         .into();","lines":7,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/glifo/src/glyph.rs#L1624-L1630"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`RowIterator::new` advances `*cur_idx` with `while input.strips[*cur_idx].strip_y() < strip_y { *cur_idx += 1; }` with no bound check. If `strip_y` is greater than every strip's `strip_y` in the slice (e.g. due to inconsistent state between the two paths in `intersect`), this walks off the end of the `strips` slice and panics with an index-out-of-bounds. The loop relies entirely on the invariant that a sentinel strip with a large enough y always exists at the tail.","fix":"Bound the loop on `*cur_idx < input.strips.len()` (or assert the sentinel invariant explicitly) so malformed input cannot cause an OOB read.","locations":[{"ref":"vello_common/src/clip.rs:609-622","code":"  609 | impl<'a> RowIterator<'a> {\n  610 |     fn new(input: PathDataRef<'a>, cur_idx: &'a mut usize, strip_y: u16) -> Self {\n  611 |         // Forward the index until we have found the right strip.\n  612 |         while input.strips[*cur_idx].strip_y() < strip_y {\n  613 |             *cur_idx += 1;\n  614 |         }\n  615 | \n  616 |         Self {\n  617 |             input,\n  618 |             cur_idx,\n  619 |             strip_y,\n  620 |             on_strip: true,\n  621 |         }\n  622 |     }","lines":14,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/vello_common/src/clip.rs#L609-L622"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`RenderSettings::default()` calls `std::thread::available_parallelism().unwrap()`. `available_parallelism` returns an `Err` on platforms/sandboxes where the parallelism cannot be determined, so constructing default render settings (and therefore `RenderContext::new`) panics there. The `level` field right above correctly uses `unwrap_or`, showing the intended fallback style.","fix":"Use `available_parallelism().map(|p| p.get()).unwrap_or(1).saturating_sub(1)` or similar so a failure falls back to a sensible thread count instead of panicking.","locations":[{"ref":"vello_cpu/src/render.rs:182-187","code":"  182 |             #[cfg(feature = \"multithreading\")]\n  183 |             num_threads: (std::thread::available_parallelism()\n  184 |                 .unwrap()\n  185 |                 .get()\n  186 |                 .saturating_sub(1) as u16)\n  187 |                 .min(8),","lines":6,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/vello_cpu/src/render.rs#L182-L187"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"MultiAtlasManager::new calls create_atlas().expect(\"Failed to create initial atlas\") in a loop over config.initial_atlas_count. If a caller supplies a config where initial_atlas_count > max_atlases, create_atlas returns AtlasError::AtlasLimitReached and the constructor panics. This is reachable purely from public configuration values (e.g. ImageCache::new_with_config) rather than an internal invariant.","fix":"Validate that initial_atlas_count <= max_atlases (clamp or return a constructor error), instead of panicking deep inside the loop.","locations":[{"ref":"vello_common/src/multi_atlas.rs:119-133","code":"  119 |     pub fn new(config: AtlasConfig) -> Self {\n  120 |         let mut manager = Self {\n  121 |             atlases: Vec::new(),\n  122 |             config,\n  123 |             round_robin_counter: 0,\n  124 |         };\n  125 | \n  126 |         for _ in 0..config.initial_atlas_count {\n  127 |             manager\n  128 |                 .create_atlas()\n  129 |                 .expect(\"Failed to create initial atlas\");\n  130 |         }\n  131 | \n  132 |         manager\n  133 |     }","lines":15,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/vello_common/src/multi_atlas.rs#L119-L133"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`DimensionConstraints::convert_dimension` computes `value.ceil() as i32` then `try_into::<u16>().expect(...)`. The `as i32` cast saturates, so a value above `i32::MAX` saturates to `i32::MAX` (still rejected by `try_into`), but a NaN input casts to 0 (silently accepted as dimension 0) and a negative input panics with a message (\"Dimensions are clamped into a reasonable range\") that is misleading when the caller passed a custom/raw value rather than the output of `calculate_dimensions`. The doc only promises infallibility for default-constraint outputs, but NaN passing through as 0 is a silent correctness hole.","fix":"Explicitly handle NaN/negative (e.g. `if !value.is_finite() || value < 0.0 { panic or clamp }`) before the cast, and consider returning a `Result` for the custom-constraint case rather than panicking.","locations":[{"ref":"vello_gpu/src/util.rs:82-86","code":"   82 |     pub fn convert_dimension(value: f64) -> u16 {\n   83 |         (value.ceil() as i32)\n   84 |             .try_into()\n   85 |             .expect(\"Dimensions are clamped into a reasonable range\")\n   86 |     }","lines":5,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/vello_gpu/src/util.rs#L82-L86"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"negligible","difficulty":"medium","description":"`Encoding::swap_last_path_tags` does `self.path_tags.swap(len - 1, len - 2)` with no length check; if called when fewer than two path tags have been encoded it underflows the index computation and panics with an out-of-bounds slice swap. All current callers (e.g. `Scene::fill`/`stroke` after `encode_shape` returned true, `draw_blurred_rounded_rect_in`) guarantee at least two tags, but the public `pub` method has no documented precondition guarding against misuse.","fix":"Document the precondition and/or debug_assert that `self.path_tags.len() >= 2` before the swap.","locations":[{"ref":"research/vello_encoding/src/encoding.rs:510-513","code":"  510 |     pub fn swap_last_path_tags(&mut self) {\n  511 |         let len = self.path_tags.len();\n  512 |         self.path_tags.swap(len - 1, len - 2);\n  513 |     }","lines":4,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/research/vello_encoding/src/encoding.rs#L510-L513"}]},
{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"`insert_entry` unconditionally does `entries.insert(key, entry)` and `self.entry_count += 1`. If a key that already exists is re-inserted, `HashMap::insert` overwrites the old entry whose `image_id` is then never `deallocate`d in the ImageCache (atlas-space leak), and `entry_count` is incremented past the true number of map entries (it counts inserts, not live entries). Callers normally probe `get` first so this is an edge case (e.g. duplicate inserts within a frame, or a logic change upstream), but the function offers no protection.","fix":"Check for an existing entry before inserting; if present, deallocate the old `image_id` first, or skip the `entry_count += 1`. Alternatively assert the key is absent.","locations":[{"ref":"glifo/src/atlas/cache.rs:246-262","code":"  246 |         let entries = if key.var_coords.is_empty() {\n  247 |             &mut self.static_entries\n  248 |         } else {\n  249 |             match self\n  250 |                 .variable_entries\n  251 |                 .raw_entry_mut()\n  252 |                 .from_key(&VarLookupKey(&key.var_coords))\n  253 |             {\n  254 |                 RawEntryMut::Occupied(e) => e.into_mut(),\n  255 |                 RawEntryMut::Vacant(e) => e.insert(key.var_coords.clone(), EMPTY_GLYPH_MAP).1,\n  256 |             }\n  257 |         };\n  258 | \n  259 |         entries.insert(key, entry);\n  260 |         self.entry_count += 1;\n  261 | \n  262 |         Some(atlas_slot)","lines":17,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/glifo/src/atlas/cache.rs#L246-L262"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"`should_create_new_strip` computes `strip_end < overlap_start - 1` where `overlap_start` is a `u16`. When `overlap_start == 0` (a region/overlap that starts at x=0, which is common for paths touching the left edge), `overlap_start - 1` underflows: panic in debug builds, wrap to 65535 in release builds. A wrap to 65535 makes the comparison `strip_end < 65535` almost always true, forcing creation of a new strip incorrectly and corrupting clip output near x=0.","fix":"Use a saturating/widened comparison, e.g. `(strip_end as u32) + 1 < overlap_start as u32` or `strip_end + 1 < overlap_start` after widening, avoiding the `- 1` on a u16.","locations":[{"ref":"vello_common/src/clip.rs:752-763","code":"  752 | fn should_create_new_strip(\n  753 |     strip_state: &Option<StripState>,\n  754 |     alphas: &[u8],\n  755 |     overlap_start: u16,\n  756 | ) -> bool {\n  757 |     // Returns false in case we can append to the currently built strip.\n  758 |     strip_state.as_ref().is_none_or(|state| {\n  759 |         let width = ((alphas.len() as u32 - state.alpha_idx) / Tile::HEIGHT as u32) as u16;\n  760 |         let strip_end = state.x + width;\n  761 | \n  762 |         strip_end < overlap_start - 1\n  763 |     })","lines":12,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/vello_common/src/clip.rs#L752-L763"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"`calculate_raster_metrics` computes `width`/`height` as `i32` and casts to `u16` with `as`. For very large glyphs (large ppem or large scale factor) the dimension can exceed 65535 and silently truncate, producing a tiny/garbage atlas allocation that does not match the glyph. There is no clamp or rejection of oversized glyphs. Likewise a degenerate bbox where `x1 < x0` would make `max_x - min_x` negative and wrap to a huge u16.","fix":"Clamp/validate the i32 dimensions before casting (e.g. reject or skip caching when width/height exceed the atlas page size or u16::MAX, and guard against negative extents).","locations":[{"ref":"glifo/src/renderer.rs:591-614","code":"  591 | pub(crate) fn calculate_raster_metrics(bounds: &Rect) -> RasterMetrics {\n  592 |     // Floor/ceil round outward from the fractional bounding box. Width gets an\n  593 |     // extra pixel to accommodate the horizontal subpixel offset (up to 0.75 px)\n  594 |     // applied when rasterising into the atlas; the Y axis has no subpixel shift\n  595 |     // so floor/ceil alone is sufficient. GLYPH_PADDING in the atlas allocator\n  596 |     // provides the guard band needed by the hybrid renderer's Extend::Pad sampling.\n  597 |     let min_x = bounds.x0.floor() as i32;\n  598 |     let max_x = bounds.x1.ceil() as i32 + 1;\n  599 | \n  600 |     // For Y, we flip the coordinate system: font Y up -> screen Y down\n  601 |     // After flipping Y, min_y becomes -max_y and max_y becomes -min_y\n  602 |     let flipped_min_y = (-bounds.y1).floor() as i32;\n  603 |     let flipped_max_y = (-bounds.y0).ceil() as i32;\n  604 | \n  605 |     let width = (max_x - min_x) as u16;\n  606 |     let height = (flipped_max_y - flipped_min_y) as u16;\n  607 | \n  608 |     RasterMetrics {\n  609 |         width,\n  610 |         height,\n  611 |         bearing_x: min_x as i16,\n  612 |         bearing_y: flipped_min_y as i16,\n  613 |     }\n  614 | }","lines":24,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/glifo/src/renderer.rs#L591-L614"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"DecimationSizer::upscale computes `self.width * 2` and `self.height * 2` on u16 values. While decimation depth is normally small, width/height come from layer/atlas sizes that can approach u16::MAX; `width * 2` overflows and panics in debug or wraps in release. The downscale path uses div_ceil so the stored value can be up to the original dimension, so doubling a value > 32767 overflows.","fix":"Use checked/saturating arithmetic or widen to u32 before multiplying: `((self.width as u32 * 2).min(target_w as u32)) as u16`.","locations":[{"ref":"vello_common/src/filter/gaussian_blur.rs:210-216","code":"  210 |     pub fn upscale(&mut self) -> (u16, u16) {\n  211 |         let (target_w, target_h) = self.dim_stack.pop().unwrap();\n  212 |         // Clamp because upscale can exceed target on odd dimensions (e.g., 5→3→6 > 5)\n  213 |         self.width = (self.width * 2).min(target_w);\n  214 |         self.height = (self.height * 2).min(target_h);\n  215 |         (self.width, self.height)\n  216 |     }","lines":7,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/vello_common/src/filter/gaussian_blur.rs#L210-L216"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`push_clear_rect_for_slot` does u16 arithmetic: `slot.x - GLYPH_PADDING`, `slot.y - GLYPH_PADDING`, `slot.width + 2*GLYPH_PADDING`, `slot.height + 2*GLYPH_PADDING`. The subtractions assume `slot.x >= GLYPH_PADDING` (true for normally-allocated slots), and the additions assume width/height + padding fit in u16. Both hold for valid slots, but in debug builds a malformed/oversized slot would panic, and in release would wrap silently. No defensive bound.","fix":"Use `saturating_sub`/`saturating_add` (or compute in u32 then clamp) so a malformed slot cannot underflow/overflow the clear rect.","locations":[{"ref":"glifo/src/atlas/cache.rs:442-450","code":"  442 | fn push_clear_rect_for_slot(pending: &mut Vec<PendingClearRect>, slot: &AtlasSlot) {\n  443 |     pending.push(PendingClearRect {\n  444 |         page_index: slot.page_index,\n  445 |         x: slot.x - GLYPH_PADDING,\n  446 |         y: slot.y - GLYPH_PADDING,\n  447 |         width: slot.width + 2 * GLYPH_PADDING,\n  448 |         height: slot.height + 2 * GLYPH_PADDING,\n  449 |     });\n  450 | }","lines":9,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/glifo/src/atlas/cache.rs#L442-L450"}]},
{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`Tile::prev_loc` computes `self.x + 1` which overflows (panics in debug builds) when `self.x == u16::MAX`. In practice regular tiles are clamped by `new_clamped` to `u16::MAX/WIDTH`, and the `same_row` short-circuit guards most sentinel cases, so this is not currently reachable, but it is a latent footgun if a non-clamped tile with x near u16::MAX is ever constructed via `Tile::new`.","fix":"Use `self.x.checked_add(1) == Some(other.x)` or `self.same_row(other) && other.x > self.x && other.x - self.x == 1`.","locations":[{"ref":"vello_common/src/tile.rs:315-317","code":"  315 |     pub const fn prev_loc(&self, other: &Self) -> bool {\n  316 |         self.same_row(other) && self.x + 1 == other.x\n  317 |     }","lines":3,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/vello_common/src/tile.rs#L315-L317"}]},
{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"In `make_tiles_analytic_aa_impl`, `push_row_extents` computes `x_end = (row_right_x as u16).min(tile_columns - 1)` using `tile_columns - 1` (plain subtraction), whereas the MSAA path and the culled branch use `tile_columns.saturating_sub(1)`. If `tile_columns == 0` this underflows. `tile_columns` is `width.div_ceil(Tile::WIDTH)` and the function early-returns when `width == 0`, so `tile_columns >= 1` here and it is not currently reachable, but it is inconsistent with the saturating form used elsewhere and is fragile.","fix":"Use `tile_columns.saturating_sub(1)` for consistency and defense in depth.","locations":[{"ref":"vello_common/src/tile.rs:736-737","code":"  736 |                             let x_start = row_left_x as u16;\n  737 |                             let x_end = (row_right_x as u16).min(tile_columns - 1);","lines":2,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/vello_common/src/tile.rs#L736-L737"}]},
{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`task_idx` (u32) is incremented on every `send_pending_tasks` via `bump_task_idx` with no wraparound handling, and it is cast `as usize` when used as the ordered-channel sequence number in the worker (`result_sender.send(task_idx as usize, task)`). For an extremely long-lived, never-reset context this wraps at 2^32, breaking the ordered-channel sequencing (out-of-order/duplicate sequence) and silently corrupting draw order. On a 32-bit target the `as usize` is also a no-widening cast so wrap happens at exactly the same point.","fix":"Document/assert the 2^32 task limit, or use a u64 sequence for the ordered channel, or reset/checkpoint `task_idx` periodically.","locations":[{"ref":"vello_cpu/src/dispatch/multi_threaded.rs:257-261","code":"  257 |     fn bump_task_idx(&mut self) -> u32 {\n  258 |         let idx = self.task_idx;\n  259 |         self.task_idx += 1;\n  260 |         idx\n  261 |     }","lines":5,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/vello_cpu/src/dispatch/multi_threaded.rs#L257-L261"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Filter::from_function maps `FilterFunction::Blur { radius }` directly to `GaussianBlur { std_deviation: radius }`. The doc comments repeatedly stress that the CSS `radius` is actually the standard deviation, so this is intentional, but `bounds_expansion`/`expansion_rect` then treat std_deviation as 3*sigma extent. Any caller that interprets the CSS `blur(r)` radius as a visual radius (the conventional CSS meaning is also sigma, so this is correct) - the real risk is the unimplemented `_ => unimplemented!()` arm: calling from_function with any non-Blur variant panics. This is a hard panic reachable from a public constructor.","fix":"Return a Result or clearly document that from_function panics for unimplemented functions; avoid `unimplemented!` in a public API that takes a runtime-chosen enum.","locations":[{"ref":"vello_common/src/filter_effects.rs:77-88","code":"   77 |     pub fn from_function(function: FilterFunction) -> Self {\n   78 |         // Convert function to primitive\n   79 |         let primitive = match function {\n   80 |             FilterFunction::Blur { radius } => FilterPrimitive::GaussianBlur {\n   81 |                 std_deviation: radius,\n   82 |                 edge_mode: EdgeMode::default(),\n   83 |             },\n   84 |             _ => unimplemented!(\"Filter function {:?} not supported\", function),\n   85 |         };\n   86 | \n   87 |         Self::from_primitive(primitive)\n   88 |     }","lines":12,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/vello_common/src/filter_effects.rs#L77-L88"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In the quadratic Bézier culling, the early-out branches are mutually exclusive `if / else if / else`, but the first branch (`MoveTo(p2)`) only emits a MoveTo without updating `last_pt` inside the branch (it is updated after). That is fine, but the bigger issue is the structure: when a curve is fully right/top/bottom (first branch) it emits a `MoveTo(p2)` which breaks the subpath, yet a curve that is fully left (second branch) emits a `LineTo`. These two conditions are checked in separate branches with `else if`, so a curve that is BOTH fully-left AND tolerance-collapsible is handled, but a curve fully to the right is short-circuited before the left/tolerance check. This matches the cubic logic, so the structure is intentional; however note the comment block at lines 132-151 describes the cubic derivation (3/4, 16/9) inside the QUADRATIC branch is correct (1/2, 4*TOL_2) - verify the quad branch comment is not copy-pasted incorrectly. The numbers used (4.*TOL_2) are correct for the quad case.","fix":"Confirm the quad-branch derivation comment matches the quad math; no code change if intentional. Consider documenting that the right/top/bottom branch deliberately discards exact shape via MoveTo.","locations":[{"ref":"vello_common/src/flatten_simd.rs:119-170","code":"  119 |             PathEl::QuadTo(p1, p2) => {\n  120 |                 let p0 = last_pt;\n  121 |                 let line = Line::new(p0, p2);\n  122 |                 // If the quadratic Bézier is fully to the right, top, or bottom of the culling\n  123 |                 // bbox, it does not impact pixel coverage or winding. We can ignore it. The\n  124 |                 // following checks that conservatively by checking whether the bounding box of the\n  125 |                 // Bézier's control points is fully outside the culling bbox.\n  126 |                 if [p0, p1, p2].into_iter().all(|p| p.x > right)\n  127 |                     || [p0, p1, p2].into_iter().all(|p| p.y < top)\n  128 |                     || [p0, p1, p2].into_iter().all(|p| p.y > bottom)\n  129 |                 {\n  130 |                     callback.callback(LinePathEl::MoveTo(p2));\n  131 |                 }\n  132 |                 // The following checks two things. First, if the quadratic Bézier is fully to the\n  133 |                 // left of the culling bbox, it may affect pixel coverage and winding, but its\n  134 |                 // exact shape does not matter. It can be emitted as a line segment [p0, p2].\n  135 |                 //\n  136 |                 // Second, an upper bound on the shortest distance of any point on the quadratic\n  137 |                 // Bézier curve to the line segment [p0, p2] is 1/2 of the control-point-to-line-segment\n  138 |                 // distance.\n  139 |                 //\n  140 |                 // The derivation is similar to that for the cubic Bézier (see below). In\n  141 |                 // short:\n  142 |                 //\n  143 |                 // q(t) = B0(t) p0 + B1(t) p1 + B2(t) p2\n  144 |                 // dist(q(t), [p0, p1]) <= B1(t) dist(p1, [p0, p1])\n  145 |                 //                       = 2 (1-t)t dist(p1, [p0, p1]).\n  146 |                 //\n  147 |                 // The maximum occurs at t=1/2, hence\n  148 |                 // max(dist(q(t), [p0, p1] <= 1/2 dist(p1, [p0, p1])).\n  149 |                 //\n  150 |                 // The following takes the square to elide the square root of the Euclidean\n  151 |                 // distance.\n  152 |                 else if [p0, p1, p2].into_iter().all(|p| p.x < left)\n  153 |                     || line.nearest(p1, 0.).distance_sq <= 4. * TOL_2\n  154 |                 {\n  155 |                     callback.callback(LinePathEl::LineTo(p2));\n  156 |                 } else {\n  157 |                     let q = QuadBez::new(p0, p1, p2);\n  158 |                     let params = q.estimate_subdiv(SQRT_TOL);\n  159 |                     let n = ((0.5 / SQRT_TOL * params.val).ceil() as usize).max(1);\n  160 |                     let step = 1.0 / (n as f64);\n  161 |                     for i in 1..n {\n  162 |                         let u = (i as f64) * step;\n  163 |                         let t = q.determine_subdiv_t(&params, u);\n  164 |                         let p = q.eval(t);\n  165 |                         callback.callback(LinePathEl::LineTo(p));\n  166 |                     }\n  167 |                     callback.callback(LinePathEl::LineTo(p2));\n  168 |                 }\n  169 |                 last_pt = p2;\n  170 |             }","lines":52,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/vello_common/src/flatten_simd.rs#L119-L170"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The NaN handling in `fill_impl` detects NaN only at MoveTo/LineTo callback points (FlattenerCallback sets `is_nan` from the post-affine endpoints). Curve control points that are NaN but get culled, or intermediate flattened points produced from NaN inputs, may already have caused `flatten_cubic_simd`/`estimate_num_quads` to compute `n` from NaN/inf (e.g. `(0.5 * sum / sqrt_tol).ceil() as usize`), where `NaN as usize == 0` and `inf as usize == usize::MAX`. A huge `n` triggers a `Vec::resize` of `n + 4` Point32 (potential OOM / very large allocation) before the NaN is ever observed by the callback. So NaN in curve coordinates can cause an enormous allocation prior to the post-hoc NaN check.","fix":"Guard `n` against non-finite values before resizing (e.g. clamp/bail if `!sum.is_finite()`), or check the cubic control points for NaN/inf before flattening, instead of relying only on the endpoint check after flattening.","locations":[{"ref":"vello_common/src/flatten_simd.rs:587-598","code":"  587 | fn flatten_cubic_simd<S: Simd>(simd: S, c: CubicBez, ctx: &mut FlattenCtx) -> usize {\n  588 |     let n_quads = estimate_num_quads(c, TOL as f32);\n  589 |     eval_cubics_simd(simd, &c, n_quads, ctx);\n  590 |     let tol = (TOL as f32) * (1.0 - TO_QUAD_TOL);\n  591 |     let sqrt_tol = tol.sqrt();\n  592 |     estimate_subdiv_simd(simd, sqrt_tol, ctx);\n  593 |     let sum: f32 = ctx.val[..n_quads].iter().sum();\n  594 |     let n = ((0.5 * sum / sqrt_tol).ceil() as usize).max(1);\n  595 |     let target_len = n + 4;\n  596 |     if target_len > ctx.flattened_cubics.len() {\n  597 |         ctx.flattened_cubics.resize(target_len, Point32::default());\n  598 |     }","lines":12,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/vello_common/src/flatten_simd.rs#L587-L598"},{"ref":"vello_common/src/flatten.rs:211-216","code":"  211 |     // A path that contains NaN is ill-defined, so ignore it.\n  212 |     if lb.is_nan {\n  213 |         warn!(\"A path contains NaN, ignoring it.\");\n  214 | \n  215 |         line_buf.clear();\n  216 |     }","lines":6,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/vello_common/src/flatten.rs#L211-L216"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In strip.rs `render_impl`, the debug_assert at lines 309-313 computes `(prev_tile.x as u32 + 1) * Tile::WIDTH as u32 - strip.x as u32`. If `prev_tile` is somehow the SENTINEL (x = u16::MAX) this is a huge multiply that can overflow u32 (panic in debug). The loop chains `[Tile::SENTINEL]` so the final iteration sets `tile` to the sentinel, but `prev_tile` at that point is the last real tile, so this is normally safe. However the assertion is only validating the non-sentinel path and silently relies on prev_tile never being the sentinel; combined with the captive/culled paths that set `prev_tile = Tile::SENTINEL` (line 197) when the tile buffer is empty, the empty-but-culled case must `return` before reaching this assert (it does at line 222-224), which is a non-obvious coupling.","fix":"Add a debug_assert!(!prev_tile.is_sentinel()) before the arithmetic, or perform the width check using the actual column count rather than reconstructing it from prev_tile.x, to make the invariant explicit.","locations":[{"ref":"vello_common/src/strip.rs:509-515","code":"  509 |         if !prev_tile.same_loc(&tile) && !prev_tile.prev_loc(&tile) {\n  510 |             debug_assert_eq!(\n  511 |                 (prev_tile.x as u32 + 1) * Tile::WIDTH as u32 - strip.x as u32,\n  512 |                 ((alpha_buf.len() - strip.alpha_idx() as usize) / usize::from(Tile::HEIGHT)) as u32,\n  513 |                 \"The number of columns written to the alpha buffer should equal the number of columns spanned by this strip.\"\n  514 |             );\n  515 |             strip_buf.push(strip);","lines":7,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/vello_common/src/strip.rs#L509-L515"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In the single-tile fast paths, x is clamped with `(line_left_x as u16).min(tile_columns + 1)`, allowing a tile x of `tile_columns` or `tile_columns + 1`, i.e. one or two columns PAST the last valid column index (`tile_columns - 1`). Everywhere else in this function the clamp is `tile_columns.saturating_sub(1)`. A line fully contained in a single tile at the far right could thus emit a tile at an out-of-range column, which downstream code multiplies by `Tile::WIDTH` for the strip x. `tile_columns + 1` can also overflow u16 if width is near u16::MAX. Both the analytic-AA and MSAA paths share this bug.","fix":"Replace `.min(tile_columns + 1)` with `.min(tile_columns.saturating_sub(1))` to match the rest of the function and avoid emitting out-of-range / overflowing column indices.","locations":[{"ref":"vello_common/src/tile.rs:922-927","code":"  922 |                 let tile = Tile::new_clamped(\n  923 |                     (line_left_x as u16).min(tile_columns + 1),\n  924 |                     y_top_tiles,\n  925 |                     line_idx,\n  926 |                     ((f32::from(y_top_tiles) >= line_top_y) as u32) << WINDING_SHIFT,\n  927 |                 );","lines":6,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/vello_common/src/tile.rs#L922-L927"},{"ref":"vello_common/src/tile.rs:922-927","code":"  922 |                 let tile = Tile::new_clamped(\n  923 |                     (line_left_x as u16).min(tile_columns + 1),\n  924 |                     y_top_tiles,\n  925 |                     line_idx,\n  926 |                     ((f32::from(y_top_tiles) >= line_top_y) as u32) << WINDING_SHIFT,\n  927 |                 );","lines":6,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/vello_common/src/tile.rs#L922-L927"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`estimate_path_cost` applies the path-length contribution with `cost += cost * (path_length / 1024.0)` (line 77), where `cost` already includes the curve-multiplied term. Because the multiplier is applied to the running `cost` rather than a fixed base, longer paths scale the *entire* cost (including the 2.5x curve weighting) multiplicatively. The doc comment claims path length should only apply 'a very small fractional value' that grows slower than render time, but for a path with length ~1024px the cost is effectively doubled, and it grows without bound for long paths - contradicting the stated intent and skewing batch sizing for large geometry.","fix":"Clamp or saturate the length factor (e.g. `cost += base_cost * (path_length / SCALE).min(K)`), and/or apply it to a fixed base rather than the running total, so length cannot unboundedly dominate the estimate.","locations":[{"ref":"vello_cpu/src/dispatch/multi_threaded/cost.rs:75-79","code":"   75 |     let mut cost = cost_data.num_line_segments as f32;\n   76 |     cost += cost_data.num_curve_segments as f32 * CURVE_MULTIPLIER;\n   77 |     cost += cost * (cost_data.path_length as f32 / 1024.0);\n   78 | \n   79 |     cost *= if is_stroke { STROKE_MULTIPLIER } else { 1.0 };","lines":5,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/vello_cpu/src/dispatch/multi_threaded/cost.rs#L75-L79"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`convert_stops` removes superfluous trailing stops at offset 1.0 via `stops.get(stops.len() - 2)`. When `stops.len()` is 1, `stops.len() - 2` underflows usize; `.get` is used so it returns None rather than panicking, so it is safe today only because `get` tolerates the wrapped index. This relies on `slice::get` saturating on an absurd index and is fragile/unclear. (After padding, len is normally >= 2, but the single-stop padding branches may not both fire.)","fix":"Guard with `while stops.len() >= 2` and index `stops.len() - 2` only then, making the intent explicit and avoiding reliance on usize-wrap + `get` returning None.","locations":[{"ref":"glifo/src/colr.rs:184-190","code":"  184 |         while let Some(stop) = stops.get(stops.len() - 2).map(|s| s.offset) {\n  185 |             if (stop - 1.0).is_nearly_zero() {\n  186 |                 stops.remove(stops.len() - 2);\n  187 |             } else {\n  188 |                 break;\n  189 |             }\n  190 |         }","lines":7,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/glifo/src/colr.rs#L184-L190"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`OutlineCache::maintain` decrements `cached_count` with `-= 1` (not saturating) inside the retain closures. `cached_count` is a plain usize incremented only on insert. The accounting looks balanced today, but unlike `GlyphAtlas` (which uses `saturating_sub`), any future divergence (double prune, count desync) would underflow to a huge usize in release or panic in debug, then force pruning every frame via the `CACHED_COUNT_THRESHOLD` check.","fix":"Use `cached_count = cached_count.saturating_sub(1)` for consistency and robustness, matching `GlyphAtlas::evict_old_entries`.","locations":[{"ref":"glifo/src/glyph.rs:1878","code":" 1878 |                 self.cached_count -= 1;","lines":1,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/glifo/src/glyph.rs#L1878"},{"ref":"glifo/src/glyph.rs:1878","code":" 1878 |                 self.cached_count -= 1;","lines":1,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/glifo/src/glyph.rs#L1878"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`quality_for_scale` inspects only the diagonal coefficients `a` and `d` of the transform to decide downscale quality. For a transform with rotation/skew (off-diagonal terms), the effective scale is not captured by `a`/`d` alone, so a rotated downscaled glyph may be judged as not needing High quality and alias. Cached glyphs reject skewed transforms upstream, but the uncached bitmap path (`render_uncached_bitmap_glyph`) and direct draws can still pass skewed transforms here.","fix":"Derive the per-axis scale from the full linear part (e.g. column lengths via `x_y_advances`) rather than `a`/`d` directly when deciding sampling quality.","locations":[{"ref":"glifo/src/renderer.rs:621-628","code":"  621 | pub fn quality_for_scale(transform: &Affine) -> ImageQuality {\n  622 |     let [a, _, _, d, _, _] = transform.as_coeffs();\n  623 |     if a < 0.5 || d < 0.5 {\n  624 |         ImageQuality::High\n  625 |     } else {\n  626 |         ImageQuality::Medium\n  627 |     }\n  628 | }","lines":8,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/glifo/src/renderer.rs#L621-L628"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`RampCache::add` reuses a slot only when `*epoch + 2 < self.epoch`. `maintain` increments `epoch` by 1 per resolve and `add` stamps entries with the current epoch. When the cache is full (RETAINED_COUNT entries) and no entry is older than 2 epochs, the else-branch falls through to allocating a brand new slot via `self.data.extend(...)`, growing `data` unboundedly past `RETAINED_COUNT * N_SAMPLES` until the next `maintain` truncation. Between maintains, a frame that introduces many (>RETAINED_COUNT) distinct gradients all freshly used can grow `data` without bound, and `ramps()` reports `height = data.len()/N_SAMPLES` which can exceed RETAINED_COUNT, uploading an oversized gradient texture.","fix":"Bound growth in the full-cache fallback (e.g. evict the least-recently-used entry unconditionally rather than only when older than 2 epochs), or document and cap the gradient texture height.","locations":[{"ref":"research/vello_encoding/src/ramp_cache.rs:81-107","code":"   81 |         } else {\n   82 |             let mut reuse = None;\n   83 |             for (stops, (id, epoch)) in &self.map {\n   84 |                 if *epoch + 2 < self.epoch {\n   85 |                     reuse = Some((stops.to_owned(), *id));\n   86 |                     break;\n   87 |                 }\n   88 |             }\n   89 |             if let Some((old_stops, id)) = reuse {\n   90 |                 self.map.remove(&old_stops);\n   91 |                 let start = id as usize * N_SAMPLES;\n   92 |                 for (dst, src) in self.data[start..start + N_SAMPLES]\n   93 |                     .iter_mut()\n   94 |                     .zip(make_ramp(stops, interpolation_alpha_space))\n   95 |                 {\n   96 |                     *dst = src;\n   97 |                 }\n   98 |                 self.map.insert(key, (id, self.epoch));\n   99 |                 id\n  100 |             } else {\n  101 |                 let id = (self.data.len() / N_SAMPLES) as u32;\n  102 |                 self.data\n  103 |                     .extend(make_ramp(stops, interpolation_alpha_space));\n  104 |                 self.map.insert(key, (id, self.epoch));\n  105 |                 id\n  106 |             }\n  107 |         }","lines":27,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/research/vello_encoding/src/ramp_cache.rs#L81-L107"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `Resolver::resolve`, the image-allocation-failure branch writes 8 zero bytes (`[0_u8; 8]`) and advances `pos = *draw_data_offset + 2`, i.e. it overwrites both the `xy` and `width_height` u32 words of the encoded `DrawImage`. The success branch writes only the `xy` word and advances by 1. The comment says it zeroes 'the dimensions so we don't attempt to render anything', but the encoded layout of `DrawImage` is `{xy, width_height, sample_alpha}` - this zeroes `xy` and `width_height` (correct) yet the asymmetry between advancing by 1 vs 2 is subtle and entirely dependent on the in-memory field order matching this assumption. A reorder of `DrawImage` fields would silently corrupt the draw stream.","fix":"Add a comment/assert tying the `+2` advance and 8-byte zero to `DrawImage`'s `xy`+`width_height` layout, or zero by explicitly constructing a `DrawImage` with zero dimensions to make the dependency explicit.","locations":[{"ref":"research/vello_encoding/src/resolve.rs:301-312","code":"  301 |                         if let Some((x, y)) = self.pending_images[*index].xy {\n  302 |                             let xy = (x << 16) | y;\n  303 |                             data.extend_from_slice(bytemuck::bytes_of(&xy));\n  304 |                             pos = *draw_data_offset + 1;\n  305 |                         } else {\n  306 |                             // If we get here, we failed to allocate a slot for this image in the atlas.\n  307 |                             // In this case, let's zero out the dimensions so we don't attempt to render\n  308 |                             // anything.\n  309 |                             // TODO: a better strategy: texture array? downsample large images?\n  310 |                             data.extend_from_slice(&[0_u8; 8]);\n  311 |                             pos = *draw_data_offset + 2;\n  312 |                         }","lines":12,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/research/vello_encoding/src/resolve.rs#L301-L312"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"Sweep gradient validation has a redundant/overlapping pair of checks: `degenerate_val(start_angle, end_angle)` (returns fallback if nearly equal) followed by `end_angle <= start_angle` (returns fallback if not strictly increasing). The first check is fully subsumed by/redundant with the second for the equal case, and the `degenerate_val` threshold (1e-6) can reject valid very-narrow sweeps that the `<=` check would accept. The two checks express slightly different intents which is confusing.","fix":"Keep a single clear condition: reject only when `end_angle <= start_angle` (and optionally a documented minimum delta), removing the overlapping `degenerate_val` check or merging them with a comment explaining the threshold.","locations":[{"ref":"vello_common/src/encode.rs:311-324","code":"  311 |         GradientKind::Sweep(SweepGradientPosition {\n  312 |             start_angle,\n  313 |             end_angle,\n  314 |             ..\n  315 |         }) => {\n  316 |             // The end angle must be larger than the start angle.\n  317 |             if degenerate_val(*start_angle, *end_angle) {\n  318 |                 return first;\n  319 |             }\n  320 | \n  321 |             if end_angle <= start_angle {\n  322 |                 return first;\n  323 |             }\n  324 |         }","lines":14,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/vello_common/src/encode.rs#L311-L324"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"compute_gaussian_kernel computes `radius = ceil(3*std_deviation)` then `kernel_size = (1 + radius*2).min(MAX_KERNEL_SIZE)`. When called with a large sigma (the function is `pub`), the size is silently clamped to 13 while the Gaussian weights are still computed for the true (wider) distribution, yielding a truncated, re-normalized kernel that does not match the requested blur. The internal decimation path keeps sigma <= 2 so it is safe, but a direct caller gets a silently wrong result with no error.","fix":"Either document that callers must pass sigma <= 2.0, debug_assert that the unclamped size fits, or clamp sigma itself so the produced kernel remains a faithful (if capped) Gaussian.","locations":[{"ref":"vello_common/src/filter/gaussian_blur.rs:136-164","code":"  136 | pub fn compute_gaussian_kernel(std_deviation: f32) -> ([f32; MAX_KERNEL_SIZE], u8) {\n  137 |     // Use radius = 3σ to capture 99.7% of the Gaussian distribution.\n  138 |     // Beyond ±3σ, the Gaussian values are negligible (<0.3%).\n  139 |     let radius = (3.0 * std_deviation).ceil() as usize;\n  140 |     let kernel_size = (1 + radius * 2).min(MAX_KERNEL_SIZE) as u8;\n  141 | \n  142 |     let mut kernel = [0.0; MAX_KERNEL_SIZE];\n  143 |     // Compute Gaussian weights using the formula: G(x) = exp(-x² / (2σ²))\n  144 |     // This creates a symmetric bell curve centered at the middle of the kernel.\n  145 |     let gaussian_denominator = 2.0 * std_deviation * std_deviation;\n  146 |     let mut sum = 0.0;\n  147 |     let kernel_center = (kernel_size / 2) as f32;\n  148 |     for (i, weight) in kernel.iter_mut().enumerate().take(usize::from(kernel_size)) {\n  149 |         // Compute distance from center (0 at center, increases outward)\n  150 |         let x = (i as f32) - kernel_center;\n  151 |         // Apply Gaussian formula: weight decreases exponentially with squared distance\n  152 |         *weight = E.powf(-x * x / gaussian_denominator);\n  153 |         sum += *weight;\n  154 |     }\n  155 | \n  156 |     // Normalize weights to sum to 1.0, ensuring the blur doesn't change overall brightness.\n  157 |     // Without normalization, blurring a uniform gray area could make it brighter/darker.\n  158 |     let scale = 1.0 / sum;\n  159 |     for weight in kernel.iter_mut().take(usize::from(kernel_size)) {\n  160 |         *weight *= scale;\n  161 |     }\n  162 | \n  163 |     (kernel, kernel_size)\n  164 | }","lines":29,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/vello_common/src/filter/gaussian_blur.rs#L136-L164"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`RectU16::union` is documented (lines 88-90) such that 'The union of `self` with a [`Self::INVERTED`] returns `self`', but `union` takes `&mut self` and returns `()`, so it does not 'return' anything. The doc wording is misleading about the API shape. More importantly, union of an arbitrary `self` with `INVERTED` only yields `self` when `self` is non-empty/normalized; for `self == ZERO`, the result min(0, MAX)=0, max(0,0)=0 stays ZERO, which is fine, but the prose 'returns self' for a mutating method is confusing.","fix":"Reword the doc comment to describe the in-place mutation, e.g. 'Unioning with `INVERTED` leaves `self` unchanged.'","locations":[{"ref":"vello_common/src/geometry.rs:253-262","code":"  253 |     /// Expand this rectangle to also cover `other` (union in place).\n  254 |     ///\n  255 |     /// The union of `self` with a [`Self::INVERTED`] returns `self`.\n  256 |     #[inline(always)]\n  257 |     pub const fn union(&mut self, other: Self) {\n  258 |         self.x0 = const_min(self.x0, other.x0);\n  259 |         self.y0 = const_min(self.y0, other.y0);\n  260 |         self.x1 = const_max(self.x1, other.x1);\n  261 |         self.y1 = const_max(self.y1, other.y1);\n  262 |     }","lines":10,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/vello_common/src/geometry.rs#L253-L262"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"Pixmap::resize only sets `may_have_transparency = true` when the buffer grows (new_len > buf.len()). When shrinking, the flag is left unchanged, which is conservative (true stays true). But growing from a buffer that previously was fully opaque correctly flips it to true; the subtle issue is that when new_len == buf.len() (same total pixel count, different w/h) the flag is left as-is, which is correct only because no new pixels are added. This is acceptable, but the width/height are updated before potential truncation semantics and the doc says reserved capacity is unchanged on shrink - consistent. No fix strictly required; flagged as a place where the staleness contract is subtle.","fix":"Optionally document that resize never clears may_have_transparency (only sets it), so callers know shrinking does not re-tighten the flag.","locations":[{"ref":"vello_common/src/pixmap.rs:161-170","code":"  161 |     pub fn resize(&mut self, width: u16, height: u16) {\n  162 |         let new_len = usize::from(width) * usize::from(height);\n  163 |         // If we're growing, new pixels are transparent black\n  164 |         if new_len > self.buf.len() {\n  165 |             self.may_have_transparency = true;\n  166 |         }\n  167 |         self.width = width;\n  168 |         self.height = height;\n  169 |         self.buf.resize(new_len, PremulRgba8::from_u32(0));\n  170 |     }","lines":10,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/vello_common/src/pixmap.rs#L161-L170"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`compose_shadow_direct` clamps the shadow's *alpha* to <= 1.0 via `.min(1.0)`, but the shadow RGB components (`color.components[0..2] * 255.0`) are not clamped before `round() as u8`. For wide-gamut / extended-range colors with components > 1.0 this silently saturates to 255 via the float->int cast rather than being handled deliberately, and the premultiply uses plain integer `/ 255` (truncating) instead of rounded division, introducing a small bias.","fix":"Clamp color components to [0,1] before converting to u8, and consider using the project's rounded div-by-255 (see util::scalar::div_255) for premultiplication to avoid truncation bias.","locations":[{"ref":"vello_cpu/src/filter/drop_shadow.rs:107-122","code":"  107 |     let shadow_r = (color.components[0] * 255.0).round() as u8;\n  108 |     let shadow_g = (color.components[1] * 255.0).round() as u8;\n  109 |     let shadow_b = (color.components[2] * 255.0).round() as u8;\n  110 | \n  111 |     for y in 0..height {\n  112 |         for x in 0..width {\n  113 |             // Sample alpha directly (shadow is already offset)\n  114 |             let alpha = shadow.sample(x, y).a;\n  115 | \n  116 |             // Apply shadow color to alpha\n  117 |             let shadow_alpha = (u8_to_norm(alpha) * color.components[3]).min(1.0);\n  118 |             let final_alpha = norm_to_u8(shadow_alpha);\n  119 | \n  120 |             // Premultiply RGB by alpha as required by PremulRgba8\n  121 |             let alpha_u16 = u16::from(final_alpha);\n  122 |             let premultiply = |channel: u8| ((u16::from(channel) * alpha_u16) / 255) as u8;","lines":16,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/vello_cpu/src/filter/drop_shadow.rs#L107-L122"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `GradientRampCache::compact_luts`, LUT offset adjustment relies on `partition_point(|(_, r)| r.lut_start < ramp.lut_start)`. When width-zero ramps exist (an empty gradient LUT), multiple removed ramps can share the same `lut_start`, and a kept ramp can share a `lut_start` with a removed one. The strict `<` comparison then counts only the removed ramps strictly before it, which is the intended behavior, but the code never asserts/guards that LUT widths are non-zero, so a zero-width ramp would also yield `lut_start == previous lut_start` for the kept entry and could mis-map if compaction ever removed a zero-width ramp at the same offset. This is fragile; worth an invariant check that widths are > 0.","fix":"Add a `debug_assert!(ramp.width > 0)` where ramps are created (or document that gradient LUT widths are always >= 1), making the partition-point reasoning robust.","locations":[{"ref":"vello_gpu/src/gradient_cache.rs:231-239","code":"  231 |         // For each entry that is still in the cache, find the correct index in the prefix sum\n  232 |         // and adjust the start position.\n  233 |         for (_, (ramp, _)) in self.cache.iter_mut() {\n  234 |             // This partition point will yield the position of the first entry where `r.lut_start >= ramp.lut_start`,\n  235 |             // so that entry shouldn't be included anymore. However, since `prefix_sum` starts with\n  236 |             // a `0` entry, this index is shifted by one and thus the correct one.\n  237 |             let pos = ramps_to_remove.partition_point(|(_, r)| r.lut_start < ramp.lut_start);\n  238 |             ramp.lut_start -= prefix_sum[pos];\n  239 |         }","lines":9,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/vello_gpu/src/gradient_cache.rs#L231-L239"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"`test_interpolation_symmetry` asserts `(a - b).abs() <= 0`, which is equivalent to `== 0` but written in a misleading way that suggests a tolerance is intended. The `<= 0` reads as a no-op tolerance and obscures that an exact-equality check is wanted.","fix":"Replace the four `assert!((... ).abs() <= 0)` with `assert_eq!(r1.r, r2.r)` etc. for clarity.","locations":[{"ref":"vello_cpu/src/filter/gaussian_blur.rs:730-733","code":"  730 |         assert!((r1.r as i32 - r2.r as i32).abs() <= 0);\n  731 |         assert!((r1.g as i32 - r2.g as i32).abs() <= 0);\n  732 |         assert!((r1.b as i32 - r2.b as i32).abs() <= 0);\n  733 |         assert!((r1.a as i32 - r2.a as i32).abs() <= 0);","lines":4,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/vello_cpu/src/filter/gaussian_blur.rs#L730-L733"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In `OutlineCacheSession::get_or_insert`, `outline_glyph.draw(draw_settings, &mut drawing_buf).unwrap()` will panic if skrifa fails to draw the outline (e.g. corrupt glyf data). Unlike the COLR path which uses `let _ = ...paint(...)` to ignore errors, this outline path unwraps, so a single bad outline glyph panics the whole render.","fix":"Handle the draw error gracefully (skip/cache an empty path) instead of `unwrap()`, consistent with the error-tolerant COLR handling.","locations":[{"ref":"glifo/src/glyph.rs:1985","code":" 1985 |                 outline_glyph.draw(draw_settings, &mut drawing_buf).unwrap();","lines":1,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/glifo/src/glyph.rs#L1985"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`copy_pixmap_to_atlas` computes source row offsets using the destination-provided `width` parameter (`copy_width = width`) against the source's own stride. If `width` (the atlas slot width) ever exceeds `src.width()`, `src_row_end = src_row_start + copy_width*4` runs past the source row and panics on slice indexing. Similarly the destination indexing assumes `dst_x + width <= dst.width()` and `dst_y + height <= dst.height()` with no validation. These rely entirely on the atlas allocator always producing slots that fit; a mismatch is an unchecked panic rather than a handled error.","fix":"Assert (debug_assert! at minimum) that width <= src.width(), height <= src.height(), dst_x+width <= dst.width(), dst_y+height <= dst.height() at the top of copy_pixmap_to_atlas/clear_pixmap_region, or clamp the copy region to the available source/destination extents.","locations":[{"ref":"vello_cpu/src/text.rs:319-344","code":"  319 | /// Copy bitmap glyph pixels into a rectangular region of an atlas page.\n  320 | fn copy_pixmap_to_atlas(\n  321 |     src: &Pixmap,\n  322 |     dst: &mut Pixmap,\n  323 |     dst_x: u16,\n  324 |     dst_y: u16,\n  325 |     width: u16,\n  326 |     height: u16,\n  327 | ) {\n  328 |     let copy_width = width as usize;\n  329 |     let copy_height = height as usize;\n  330 |     let src_stride = src.width() as usize;\n  331 |     let dst_stride = dst.width() as usize;\n  332 | \n  333 |     let src_data = src.data_as_u8_slice();\n  334 |     let dst_data = dst.data_as_u8_slice_mut();\n  335 | \n  336 |     for y in 0..copy_height {\n  337 |         let src_row_start = y * src_stride * 4;\n  338 |         let src_row_end = src_row_start + copy_width * 4;\n  339 |         let dst_row_start = ((dst_y as usize + y) * dst_stride + dst_x as usize) * 4;\n  340 |         let dst_row_end = dst_row_start + copy_width * 4;\n  341 | \n  342 |         dst_data[dst_row_start..dst_row_end].copy_from_slice(&src_data[src_row_start..src_row_end]);\n  343 |     }\n  344 | }","lines":26,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/vello_cpu/src/text.rs#L319-L344"},{"ref":"vello_cpu/src/text.rs:306-317","code":"  306 | fn clear_pixmap_region(dst: &mut Pixmap, rect: PendingClearRect) {\n  307 |     let dst_stride = dst.width() as usize;\n  308 |     let dst_data = dst.data_as_u8_slice_mut();\n  309 |     let clear_width = rect.width as usize;\n  310 |     let clear_height = rect.height as usize;\n  311 | \n  312 |     for y in 0..clear_height {\n  313 |         let row_start = ((rect.y as usize + y) * dst_stride + rect.x as usize) * 4;\n  314 |         let row_end = row_start + clear_width * 4;\n  315 |         dst_data[row_start..row_end].fill(0);\n  316 |     }\n  317 | }","lines":12,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/vello_cpu/src/text.rs#L306-L317"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"Image/atlas allocation uses `.unwrap()` on `image_cache.allocate(...)` in `upload_image_with` for both backends, turning an atlas-full / allocation-failure condition into a panic rather than a recoverable error. `RenderError` already has an `AtlasError` variant, so allocation failures could be surfaced instead of aborting the process.","fix":"Return `Result<ImageId, RenderError>` from the upload methods and propagate `AtlasError` instead of unwrapping.","locations":[{"ref":"vello_gpu/src/render/wgpu/mod.rs:537-541","code":"  537 |         let width = writer.width();\n  538 |         let height = writer.height();\n  539 |         let image_id = image_cache.allocate(width, height, padding).unwrap();\n  540 |         self.write_to_atlas(image_cache, device, queue, encoder, image_id, writer, None);\n  541 |         image_id","lines":5,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/vello_gpu/src/render/wgpu/mod.rs#L537-L541"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`Resources::atlas_count` does `u32::try_from(self.image_cache.atlas_count()).unwrap()`. While atlas counts are realistically tiny, this is an unguarded panic point reachable from the public render path. The surrounding code already uses `#[expect(cast_possible_truncation)]` elsewhere; an `as u32` (or a documented invariant) would be more consistent and panic-free.","fix":"Use a checked-but-non-panicking conversion or document/justify the unwrap; given atlas counts are bounded, `as u32` with an `#[expect]` is consistent with the rest of the file.","locations":[{"ref":"vello_gpu/src/text.rs:71-73","code":"   71 |     fn atlas_count(&self) -> u32 {\n   72 |         u32::try_from(self.image_cache.atlas_count()).unwrap()\n   73 |     }","lines":3,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/vello_gpu/src/text.rs#L71-L73"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"negligible","difficulty":"medium","description":"`conv_extend` and `push_layer` (CompositeMode) silently map unknown skrifa enum variants to `Extend::Pad` / `Compose::SrcOver` with only a `// TODO` comment, so malformed or future color-font data is rendered incorrectly with no warning. Several adjacent cases in this file do log warnings for analogous fallbacks, making this inconsistent.","fix":"Log a warning (once) when an unknown extend/composite variant is encountered, matching the logging done elsewhere in this module.","locations":[{"ref":"research/vello_research/src/scene.rs:1198-1206","code":" 1198 | fn conv_extend(extend: skrifa::color::Extend) -> Extend {\n 1199 |     match extend {\n 1200 |         skrifa::color::Extend::Pad => Extend::Pad,\n 1201 |         skrifa::color::Extend::Repeat => Extend::Repeat,\n 1202 |         skrifa::color::Extend::Reflect => Extend::Reflect,\n 1203 |         // TODO: Error reporting on unknown variant?\n 1204 |         _ => Extend::Pad,\n 1205 |     }\n 1206 | }","lines":9,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/research/vello_research/src/scene.rs#L1198-L1206"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`GlyphCache::session` performs up to three hashmap operations on the variable-font path: `var_map.contains_key(coords)` followed by `var_map.get_mut(coords)` (two lookups) when the key exists, or `entry(coords.into())` when it doesn't. The comment acknowledges this is a deliberately chosen 'bad option'. For variable-font-heavy text this is an avoidable extra hash+probe per glyph run.","fix":"Use the raw-entry API or a single `entry` with a borrowed-key abstraction once available, or restructure so only one lookup is performed in the hot (key-present) case.","locations":[{"ref":"research/vello_encoding/src/glyph_cache.rs:41-54","code":"   41 |         let map = if !coords.is_empty() {\n   42 |             // This is still ugly in rust. Choices are:\n   43 |             // 1. multiple lookups in the hashmap (implemented here)\n   44 |             // 2. always allocate and copy the key\n   45 |             // 3. use unsafe\n   46 |             // Pick 1 bad option :(\n   47 |             if self.var_map.contains_key(coords) {\n   48 |                 self.var_map.get_mut(coords).unwrap()\n   49 |             } else {\n   50 |                 self.var_map.entry(coords.into()).or_default()\n   51 |             }\n   52 |         } else {\n   53 |             &mut self.map\n   54 |         };","lines":14,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/research/vello_encoding/src/glyph_cache.rs#L41-L54"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`make_mask_lut_16` builds a `Vec<u16>` and then calls `bytemuck::cast_slice(&v16).into()` to produce a `Vec<u8>`, which copies the entire buffer a second time. The code even acknowledges this in a comment. For an MSAA16 mask LUT (64*64 u16 = 8 KiB) this is a redundant allocation+copy on the first MSAA16 render.","fix":"Build the `Vec<u8>` directly by pushing the two bytes of each `u16` per iteration (as the comment suggests), avoiding the intermediate `Vec<u16>` and the extra copy.","locations":[{"ref":"research/vello_encoding/src/mask.rs:83-98","code":"   83 | pub fn make_mask_lut_16() -> Vec<u8> {\n   84 |     let v16 = (0..MASK16_WIDTH * MASK16_HEIGHT)\n   85 |         .map(|i| {\n   86 |             const HALF_HEIGHT: usize = MASK16_HEIGHT / 2;\n   87 |             let u = i % MASK16_WIDTH;\n   88 |             let v = i / MASK16_WIDTH;\n   89 |             let is_pos = v >= HALF_HEIGHT;\n   90 |             let y = ((v % HALF_HEIGHT) as f64 + 0.5) * (1.0 / HALF_HEIGHT as f64);\n   91 |             let x = (u as f64 + 0.5) * (1.0 / MASK16_WIDTH as f64);\n   92 |             one_mask_16(y, x, is_pos)\n   93 |         })\n   94 |         .collect::<Vec<_>>();\n   95 |     // This annoyingly makes another copy. We can avoid that by pushing two\n   96 |     // bytes per iteration of the above loop.\n   97 |     bytemuck::cast_slice(&v16).into()\n   98 | }","lines":16,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/research/vello_encoding/src/mask.rs#L83-L98"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`GradientRampCache::get_or_create_ramp` increments `self.epoch` on every call including pure cache hits, and the cache is only ever bounded in `maintain()` (called once per frame). This is fine for correctness, but the cache grows without bound within a single frame: a frame referencing far more than `retained_count` unique gradients will inflate both `cache` and `luts` until the end-of-frame `maintain`, and the eviction work (a full `select_nth` + LUT compaction copy of the entire `luts` buffer) is O(luts size). For pathological scenes this is a notable per-frame cost with no intra-frame backpressure.","fix":"Consider an optional soft cap that triggers compaction mid-frame, or document the unbounded intra-frame growth explicitly. At minimum, avoid bumping `epoch` semantics in a way that complicates reasoning; the current behavior is acceptable but the cost characteristics should be noted.","locations":[{"ref":"vello_gpu/src/gradient_cache.rs:75-94","code":"   75 |     pub(crate) fn get_or_create_ramp(&mut self, gradient: &EncodedGradient) -> (u32, u32) {\n   76 |         self.epoch += 1;\n   77 | \n   78 |         // Check if we already have this gradient cached.\n   79 |         if let Some((cached_ramp, last_used)) = self.cache.get_mut(&gradient.cache_key) {\n   80 |             *last_used = self.epoch;\n   81 |             return (cached_ramp.lut_start, cached_ramp.width);\n   82 |         }\n   83 | \n   84 |         // Generate new gradient LUT.\n   85 |         let lut_start = self.luts.len() as u32 / BYTES_PER_TEXEL;\n   86 |         let width = dispatch!(self.level, simd => generate_gradient_lut_impl(simd, gradient, &mut self.luts))\n   87 |             as u32;\n   88 |         let cached_ramp = CachedRamp { width, lut_start };\n   89 |         self.has_changed = true;\n   90 |         self.cache\n   91 |             .insert(gradient.cache_key.clone(), (cached_ramp, self.epoch));\n   92 | \n   93 |         (lut_start, width)\n   94 |     }","lines":20,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/vello_gpu/src/gradient_cache.rs#L75-L94"},{"ref":"vello_gpu/src/gradient_cache.rs:96-103","code":"   96 |     /// Maintain the gradient cache by evicting old entries.\n   97 |     pub(crate) fn maintain(&mut self) {\n   98 |         let entries_to_remove_count = self\n   99 |             .cache\n  100 |             .len()\n  101 |             .saturating_sub(self.retained_count as usize);\n  102 |         self.evict(entries_to_remove_count);\n  103 |     }","lines":8,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/vello_gpu/src/gradient_cache.rs#L96-L103"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"In flatten_simd `flatten`, each Bézier culling test constructs three/four temporary arrays via `[p0, p1, p2].into_iter().all(...)` repeatedly (up to three times for the right/top/bottom tests, plus once for the left test). These build small arrays and iterators per element in the hot flattening loop. For paths with many curves this adds avoidable per-element overhead vs. inlined boolean comparisons.","fix":"Replace the `[..].into_iter().all(|p| ...)` patterns with explicit `&&` chains on the individual point coordinates to avoid array/iterator construction per curve.","locations":[{"ref":"vello_common/src/flatten_simd.rs:126-128","code":"  126 |                 if [p0, p1, p2].into_iter().all(|p| p.x > right)\n  127 |                     || [p0, p1, p2].into_iter().all(|p| p.y < top)\n  128 |                     || [p0, p1, p2].into_iter().all(|p| p.y > bottom)","lines":3,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/vello_common/src/flatten_simd.rs#L126-L128"},{"ref":"vello_common/src/flatten_simd.rs:178-180","code":"  178 |                 if [p0, p1, p2, p3].into_iter().all(|p| p.x > right)\n  179 |                     || [p0, p1, p2, p3].into_iter().all(|p| p.y < top)\n  180 |                     || [p0, p1, p2, p3].into_iter().all(|p| p.y > bottom)","lines":3,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/vello_common/src/flatten_simd.rs#L178-L180"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`Splat4thExt for u8x16` and `element_wise_splat` build temporary `[T; N]` arrays and call `simd_into`, with TODOs noting they should be SIMDified ('TODO: SIMDify'). These run per-pixel-group in color/alpha splatting paths; the scalar array round-trip defeats vectorization for those lanes.","fix":"Implement the u8x16 4th-element splat using SIMD shuffle/zip intrinsics analogous to the f32 implementations, removing the scalar array materialization.","locations":[{"ref":"vello_common/src/simd.rs:46-56","code":"   46 | impl<S: Simd> Splat4thExt<S> for u8x16<S> {\n   47 |     #[inline(always)]\n   48 |     fn splat_4th(self) -> Self {\n   49 |         // TODO: SIMDify\n   50 |         [\n   51 |             self[3], self[3], self[3], self[3], self[7], self[7], self[7], self[7], self[11],\n   52 |             self[11], self[11], self[11], self[15], self[15], self[15], self[15],\n   53 |         ]\n   54 |         .simd_into(self.simd)\n   55 |     }\n   56 | }","lines":11,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/vello_common/src/simd.rs#L46-L56"},{"ref":"vello_common/src/simd.rs:69-76","code":"   69 | /// Splat each single element in the vector to 4 lanes.\n   70 | #[inline(always)]\n   71 | pub fn element_wise_splat<S: Simd>(simd: S, input: f32x4<S>) -> f32x16<S> {\n   72 |     simd.combine_f32x8(\n   73 |         simd.combine_f32x4(f32x4::splat(simd, input[0]), f32x4::splat(simd, input[1])),\n   74 |         simd.combine_f32x4(f32x4::splat(simd, input[2]), f32x4::splat(simd, input[3])),\n   75 |     )\n   76 | }","lines":8,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/vello_common/src/simd.rs#L69-L76"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The doc comment on `set_alpha_idx` states 'the largest value that can be stored in the alpha index is `u32::MAX << 1`'. That is wrong: bit 31 is reserved for `fill_gap`, so the largest storable alpha index is `u32::MAX >> 1` (i.e. `0x7FFF_FFFF`), not `u32::MAX << 1` (which equals `0xFFFF_FFFE` and would actually set the reserved high bit, failing the assert).","fix":"Change the comment to `u32::MAX >> 1` (`0x7FFF_FFFF`).","locations":[{"ref":"vello_common/src/strip.rs:250-251","code":"  250 |     /// Note that the largest value that can be stored in the alpha index is `u32::MAX << 1`, as the\n  251 |     /// highest bit is reserved for `fill_gap`.","lines":2,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/vello_common/src/strip.rs#L250-L251"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The doc comment for `COST_THRESHOLD` is an incomplete sentence: 'finding a constant that seems to strike a reasonable trade-off between not causing too big batch sizes' - the clause is cut off ('...and not causing too small batches' or similar was clearly intended). It dangles and never states the second half of the trade-off.","fix":"Complete the sentence to describe both ends of the trade-off (large batches reduce parallelism / small batches add per-task overhead).","locations":[{"ref":"vello_cpu/src/dispatch/multi_threaded/cost.rs:4-7","code":"    4 | /// There is not much science behind this constant. It was instead determined by doing profiling\n    5 | /// and finding a constant that seems to strike a reasonable trade-off between not causing too\n    6 | /// big batch sizes\n    7 | pub(crate) const COST_THRESHOLD: f32 = 250.0;","lines":4,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/vello_cpu/src/dispatch/multi_threaded/cost.rs#L4-L7"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"Doc comment for `SUBPIXEL_BUCKETS` states 'valid range: 1-253', but `SUBPIXEL_COLR = SUBPIXEL_BUCKETS` and `SUBPIXEL_BITMAP = SUBPIXEL_BUCKETS + 1` are derived as sentinels. If `SUBPIXEL_BUCKETS` were set to 254, `SUBPIXEL_BITMAP` (255) is still representable, but at 255 it overflows u8. The stated upper bound 253 is correct but the reasoning (two sentinels above the range) is not spelled out where the constant is defined, making the magic 253 easy to break.","fix":"Add a const assertion (e.g. `const _: () = assert!(SUBPIXEL_BUCKETS <= 253);`) tying the documented bound to the two-sentinel requirement.","locations":[{"ref":"glifo/src/atlas/key.rs:20-36","code":"   20 | /// Number of horizontal subpixel quantization buckets (valid range: 1–253).\n   21 | ///\n   22 | /// Higher values improve rendering quality at the cost of more atlas entries\n   23 | /// per glyph. Common values: 1 (disabled), 2, 4 (default), 8.\n   24 | pub(crate) const SUBPIXEL_BUCKETS: u8 = 4;\n   25 | \n   26 | /// Sentinel `subpixel_x` for COLR glyph cache entries.\n   27 | ///\n   28 | /// `quantize_subpixel` returns values in `0..SUBPIXEL_BUCKETS`, so values\n   29 | /// above that range can never appear in an outline key. Using distinct\n   30 | /// sentinels for COLR and bitmap entries prevents cache collisions between\n   31 | /// glyph types that would otherwise produce identical keys (same font, glyph\n   32 | /// id, size, and color).\n   33 | pub(crate) const SUBPIXEL_COLR: u8 = SUBPIXEL_BUCKETS;\n   34 | \n   35 | /// Sentinel `subpixel_x` for bitmap glyph cache entries. See [`SUBPIXEL_COLR`].\n   36 | pub(crate) const SUBPIXEL_BITMAP: u8 = SUBPIXEL_BUCKETS + 1;","lines":17,"link":"https://github.com/linebender/vello/blob/22e4dabec3fcc94d7d237b27a60a576a096d5c50/glifo/src/atlas/key.rs#L20-L36"}]},
