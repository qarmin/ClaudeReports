{"id":"DEAD_6","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"A large block-commented-out unsafe implementation of insert_multiple_at (about 70 lines) is left at the end of util.rs. Dead commented code rots, and this version contains a known bug it references (move_count computed before the offset check). It should be removed; git history preserves it.","fix":"Delete the commented-out block.","locations":[{"ref":"src/util.rs:300-373","code":"  300 | /*\n  301 | /// Inserts a slice into a vector at a given offset, shifting elements \n  302 | /// starting at the offset towards the end.\n  303 | /// Returns 0 (zero) if the operation was successful, non-zero if the offset \n  304 | /// is larger than the current length of the destination vector. In the latter \n  305 | /// case, everything stays untouched.\n  306 | pub(crate) fn insert_multiple_at<T>\n  307 | (\n  308 |     vec_dst: &mut Vec<T>, \n  309 |     offset:  usize, \n  310 |     vec_src: &mut [T]\n  311 | )\n  312 | -> usize\n  313 | where T: Copy \n  314 | {\n  315 |     match (vec_dst.len(), vec_src.len()) \n  316 |     {\n  317 |         (_, 0)           => 0,\n  318 |         (current_len, _) => {\n  319 | \n  320 |             // Elements that need to be moved to make way for the new ones\n  321 |             let move_count = current_len - offset;\n  322 | \n  323 |             // If this is less than 0 we return at this point as this would\n  324 |             // cause a \"gap\" between existing and new vector contents\n  325 |             // (move_count is usize and thus can't be less than 0)\n  326 |             if current_len < offset\n  327 |             {\n  328 |                 return std::cmp::max(1, current_len);\n  329 |             }\n  330 | \n  331 |             // Reserve without over-allocation space needed for new elements\n  332 |             vec_dst.reserve_exact(vec_src.len());\n  333 | \n  334 |             unsafe\n  335 |             {\n  336 |                 // Pointer to the first location where vec_src elements will\n  337 |                 // be placed. \n  338 |                 // Called `src` at this stage as previously it has to serve\n  339 |                 // as source for elements that require to be copied to the\n  340 |                 // right to make way \n  341 |                 let src = vec_dst.as_mut_ptr().offset(offset as isize);\n  342 | \n  343 |                 // Set the new length of the vector after the operation\n  344 |                 vec_dst.set_len(current_len + vec_src.len());\n  345 | \n  346 |                 // Check if there are any elements that require to be moved\n  347 |                 if move_count > 0 \n  348 |                 {\n  349 |                     let dst = src.offset(vec_src.len() as isize);\n  350 |                     std::ptr::copy(\n  351 |                         src,                                                    // Source pointer\n  352 |                         dst,                                                    // Destination pointer\n  353 |                         move_count                                              // How many elements to copy\n  354 |                     );\n  355 |                 }\n  356 | \n  357 |                 // Copy the new elements at the new \"free\" locations\n  358 |                 // The previous source pointer `src` becomes the destination of\n  359 |                 // the new elements to be inserted\n  360 |                 // In contrast to the previous copy we can here be sure that\n  361 |                 // the source and destination don't overlap\n  362 |                 std::ptr::copy_nonoverlapping(\n  363 |                     vec_src.as_mut_ptr(),                                       // Source pointer\n  364 |                     src,                                                        // Destination pointer\n  365 |                     vec_src.len()                                               // How many elements to copy (here: ALL)\n  366 |                 );\n  367 |             }\n  368 | \n  369 |             return 0;\n  370 |         },\n  371 |     }\n  372 | }\n  373 | */","lines":74,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/util.rs#L300-L373"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"The doc comment for get_tag_type ends mid-sentence: 'This offset position is either in the data' with no continuation, leaving the explanation incomplete.","fix":"Complete the sentence describing where data-offset positions reside.","locations":[{"ref":"src/exif_tag/mod.rs:704-706","code":"  704 | \t/// - Data Offsets: They are somewhat similar to the case of value tags\n  705 | \t///   where the value is stored at an offset position. This offset position\n  706 | \t///   is either in the data ","lines":3,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/exif_tag/mod.rs#L704-L706"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"Comment at item_info.rs line 80 says `string len + null terminator` and adds `+ 1`, which is correct, but the surrounding data_read_so_far uses item_name.len() (UTF-8 byte length). read_null_terminated_string returns a String, and item_name.len() is byte length so the arithmetic happens to be right; however the comment block at lines 18-30 documents only the simple case and states content_type/content_encoding strings are 'not present in practice' - any infe entry that DOES contain them is folded into additional_data, which is fine for round-tripping but the comment understates that these are silently treated as opaque.","fix":"Clarify the comment that trailing optional strings are preserved opaquely in additional_data rather than implying they don't exist.","locations":[{"ref":"src/heif/boxes/item_info.rs:19-29","code":"   19 | // - infe\n   20 | // 00000015:   size of 0x15 bytes (including the 0x04 bytes of the size field itself) \n   21 | // 696E6665:   byte representation of `infe` \n   22 | // 02:         version 2\n   23 | // 000001:     24 bits of flags\n   24 | // 0019:       item ID (16 bits)\n   25 | // 0000:       item protection index (16 bits)\n   26 | // 6876633100: item name, a null terminated string, here: \"hvc1\"\n   27 | // theoretically, after this point there would be two other strings, the\n   28 | // content_type and the optional content_encoding, however, the practical\n   29 | // examples did *not* have any of this","lines":11,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/heif/boxes/item_info.rs#L19-L29"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"In jpg::clear_segment the cutoff_index is computed as `0 + backup_position as usize + temp_buffer.len()`. The leading `0 +` is dead arithmetic with no purpose and obscures intent.","fix":"Remove the `0 +` term: `let cutoff_index = backup_position as usize + temp_buffer.len();`.","locations":[{"ref":"src/jpg.rs:200-202","code":"  200 |                     let cutoff_index = 0\n  201 |                         + backup_position as usize \n  202 |                         + temp_buffer.len();","lines":3,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/jpg.rs#L200-L202"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"Module-level doc in lib.rs lists supported WebP as 'only lossless and extended'. The auto_detect only recognizes the RIFF/WEBP container generically; this is a documentation nuance but the list also omits NAKED_JXL handling described elsewhere. Minor: the lib.rs usage example calls `metadata.write_to_file(...)` and ignores the returned Result (it returns Result), which in a doctest is `no_run` so harmless but models ignoring an error in user-facing docs.","fix":"Handle/`?` or `let _ =` the Result in the doc example and keep the supported-format list in sync with actual capabilities.","locations":[{"ref":"src/lib.rs:18","code":"   18 | //! - WebP (only lossless and extended)","lines":1,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/lib.rs#L18"},{"ref":"src/lib.rs:34","code":"   34 | //! metadata.write_to_file(std::path::Path::new(\"image.png\"));","lines":1,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/lib.rs#L34"}]},
{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"Comment for the zTXt data_start says 'add 2 for the NUL byte and the byte representing the compression method', which is correct, but the adjacent tEXt comment and the iTXt code comment '+3 // NUL, compression flag & method' lump three distinct bytes (NUL after keyword, compression flag, compression method) which is fine, yet the get_data_from_text_chunk zTXt branch checks chunk_data[keyword_length + 1] != 0x00 calling it the 'compression method' while in PNG zTXt the byte immediately after the keyword's NUL IS the compression method - the index keyword_length+1 points at the compression method byte (keyword..NUL at keyword_length), so the +1 actually points one past the NUL = compression method, which is correct; the confusion is that there is no separate compression-flag byte in zTXt (unlike iTXt) but the comments do not make this distinction clear.","fix":"Clarify in the comment that zTXt has no compression-flag byte (only a compression-method byte) unlike iTXt, to prevent a future edit from copying the iTXt offset logic.","locations":[{"ref":"src/png/text.rs:50-63","code":"   50 |         \"zTXt\" => {\n   51 |             // Find start of data\n   52 |             // For this we take the keyword length and add 2 for the NUL byte\n   53 |             // and the byte representing the compression method\n   54 |             let data_start = keyword_length + 2;\n   55 | \n   56 |             // Check compression method\n   57 |             if chunk_data[keyword_length + 1] != 0x00\n   58 |             {\n   59 |                 return io_error!(\n   60 |                     Other,\n   61 |                     \"Unknown compression method for zTXt!\"\n   62 |                 );\n   63 |             }","lines":14,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/png/text.rs#L50-L63"}]},
{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"Doc comments on read_1_bytes etc. say 'Reads in the next 1 bytes' / 'advances the cursor by 1 bytes' (plural 'bytes' for the 1-byte case) - minor but the templated wording reads wrong for the singular cases.","fix":"Fix grammar for the 1-byte variants (or accept as trivial).","locations":[{"ref":"src/util.rs:9-10","code":"    9 | /// Reads in the next 1 bytes, starting at the current position of the cursor.\n   10 | /// The function call advances the cursor by 1 bytes.","lines":2,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/util.rs#L9-L10"},{"ref":"src/util.rs:55-56","code":"   55 | /// Reads in the next 3 bytes, starting at the current position of the cursor.\n   56 | /// The function call advances the cursor by 3 bytes.","lines":2,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/util.rs#L55-L56"}]},
{"id":"CMT_7","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"Comment in check_exif_in_file says 'Check the 5th bit of the 32 bit flag_buffer' but the code checks flag_buffer[0] & 0x08, which is the 4th bit (bit index 3, value 0x08) of the first byte. The comment's bit numbering is misleading.","fix":"Correct the comment to reference the EXIF flag bit (0x08 in the first flags byte) accurately.","locations":[{"ref":"src/webp/file.rs:244-247","code":"  244 |     // Check the 5th bit of the 32 bit flag_buffer. \n  245 |     // For further details see the Extended File Format section at\n  246 |     // https://developers.google.com/speed/webp/docs/riff_container#extended_file_format\n  247 |     if flag_buffer[0] & 0x08 != 0x08","lines":4,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/webp/file.rs#L244-L247"},{"ref":"src/webp/vec.rs:234-237","code":"  234 |     // Check the 5th bit of the 32 bit flag_buffer. \n  235 |     // For further details see the Extended File Format section at\n  236 |     // https://developers.google.com/speed/webp/docs/riff_container#extended_file_format\n  237 |     if flag_buffer[0] & 0x08 != 0x08","lines":4,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/webp/vec.rs#L234-L237"}]},
{"id":"CMT_8","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"encode_metadata_webp comment block labels the size info as fourCC and refers to 'EXIF chunk' fields in clear_metadata's parsed_chunk_byte_count comments ('fourCC section of EXIF chunk', 'size information of EXIF chunk') even though that block runs for every chunk type, not just EXIF. Misleading for maintainers.","fix":"Generalize the comments to 'fourCC section of chunk' / 'size information of chunk'.","locations":[{"ref":"src/webp/file.rs:597-602","code":"  597 |         let parsed_chunk_byte_count = \n  598 |             4u64                            // fourCC section of EXIF chunk\n  599 |             + 4u64                          // size information of EXIF chunk\n  600 |             + parsed_chunk.len() as u64     // actual size of EXIF chunk data\n  601 |             + parsed_chunk.len() as u64 % 2 // accounting for possible padding byte\n  602 |         ;","lines":6,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/webp/file.rs#L597-L602"},{"ref":"src/webp/vec.rs:554-559","code":"  554 |         let parsed_chunk_byte_count = \n  555 |             4u64                            // fourCC section of EXIF chunk\n  556 |             + 4u64                          // size information of EXIF chunk\n  557 |             + parsed_chunk.len() as u64     // actual size of EXIF chunk data\n  558 |             + parsed_chunk.len() as u64 % 2 // accounting for possible padding byte\n  559 |         ;","lines":6,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/webp/vec.rs#L554-L559"}]},
{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"medium","difficulty":"medium","description":"file.rs and vec.rs are near-identical parallel implementations differing only in File vs Cursor<&Vec<u8>>. get_next_chunk, get_next_chunk_descriptor, parse_webp, check_exif_in_file, read_metadata, set_exif_flag, clear_metadata and write_metadata are all duplicated logic (well over 25 lines each, ~400 lines total). Bugs must be fixed twice and the two copies already diverge (see VP8 copy_paste finding).","fix":"Abstract over the storage via the Read+Seek trait (Cursor already implements both, and the get_next_chunk family in file.rs is already generic over T: Seek+Read). Drive parse/read logic through one generic implementation and keep only thin File/Vec wrappers.","locations":[{"ref":"src/webp/file.rs:60-352","code":"   60 | fn\n   61 | get_next_chunk\n   62 | <T: Seek + Read>\n   63 | (\n   64 |     file: &mut T\n   65 | )\n   66 | -> Result<RiffChunk, std::io::Error>\n   67 | {\n   68 |     // Read the start of the chunk\n   69 |     let mut chunk_start = [0u8; 8];\n   70 |     let mut bytes_read = file.read(&mut chunk_start)?;\n   71 | \n   72 |     // Check that indeed 8 bytes were read\n   73 |     if bytes_read != 8\n   74 |     {\n   75 |         return io_error!(UnexpectedEof, \"Could not read start of chunk\");\n   76 |     }\n   77 | \n   78 |     // Construct name of chunk and its length\n   79 |     let chunk_name = String::from_utf8(chunk_start[0..4].to_vec());\n   80 |     let mut chunk_length = from_u8_vec_res_macro!(u32, &chunk_start[4..8], &Endian::Little)?;\n   81 | \n   82 |     // Account for the possible padding byte\n   83 |     chunk_length += chunk_length % 2;\n   84 | \n   85 |     // Read RIFF chunk data\n   86 |     let mut chunk_data_buffer = vec![0u8; chunk_length as usize];\n   87 |     bytes_read = file.read(&mut chunk_data_buffer)?;\n   88 |     if bytes_read != chunk_length as usize\n   89 |     {\n   90 |         return io_error!(\n   91 |             Other, \n   92 |             format!(\"Could not read RIFF chunk data! Expected {chunk_length} bytes but read {bytes_read}\")\n   93 |         );\n   94 |     }\n   95 | \n   96 |     if let Ok(parsed_chunk_name) = chunk_name\n   97 |     {\n   98 |         return Ok(RiffChunk::new(\n   99 |             parsed_chunk_name as String, \n  100 |             chunk_length      as usize,\n  101 |             chunk_data_buffer as Vec<u8>\n  102 |         ));\n  103 |     }\n  104 |     else\n  105 |     {\n  106 |         return io_error!(Other, \"Could not parse RIFF fourCC chunk name!\");\n  107 |     }\n  108 | }\n  109 | \n  110 | \n  111 | \n  112 | /// Gets a descriptor of the next RIFF chunk, starting at the current file\n  113 | /// cursor position. Advances the cursor to the start of the next chunk\n  114 | /// Relies on `get_next_chunk` by basically calling that function and throwing\n  115 | /// away the actual payload\n  116 | fn\n  117 | get_next_chunk_descriptor\n  118 | <T: Seek + Read>\n  119 | (\n  120 |     file: &mut T\n  121 | )\n  122 | -> Result<RiffChunkDescriptor, std::io::Error>\n  123 | {\n  124 |     let next_chunk_result = get_next_chunk(file)?;\n  125 |     return Ok(next_chunk_result.descriptor());\n  126 | }\n  127 | \n  128 | \n  129 | \n  130 | /// \"Parses\" the WebP file by checking various properties:\n  131 | /// - Can the file be opened and is the signature valid, including the file size?\n  132 | /// - Are the chunks and their size descriptions OK? Relies on the local subroutine `get_next_chunk_descriptor`\n  133 | pub(crate) fn\n  134 | parse_webp\n  135 | (\n  136 |     path: &Path\n  137 | )\n  138 | -> Result<Vec<RiffChunkDescriptor>, std::io::Error>\n  139 | {\n  140 |     let mut file   = check_signature(path)?;\n  141 |     let mut chunks = Vec::new();\n  142 | \n  143 |     // The amount of data we expect to read while parsing the chunks\n  144 |     let expected_length = file.metadat {"id":"DUP_3","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"tiff/file.rs and tiff/vec.rs are near-identical: each provides read_metadata, clear_metadata, and write_metadata that differ only in the cursor source (BufReader/BufWriter over a file path vs. Cursor over a Vec). The clear_metadata bodies in particular duplicate the same read -> general_decoding_wrapper -> reduce_to_a_minimum -> generic_write_metadata sequence. This duplication invites divergence (one already differs: vec.rs preserves and restores cursor_start_pos while file.rs reopens the file).","fix":"Factor the shared clear/read/write sequence into generic helpers in tiff/mod.rs parameterized over a Seek+Read+Write cursor, leaving file.rs/vec.rs as thin adapters that only construct the cursor.","locations":[{"ref":"src/tiff/file.rs:26-44","code":"   26 | pub(crate) fn\n   27 | clear_metadata\n   28 | (\n   29 | \tpath: &Path\n   30 | )\n   31 | -> Result<(), std::io::Error>\n   32 | {\n   33 | \t// Read in the data\n   34 | \tlet     raw_data = generic_read_metadata(&mut BufReader::new(open_read_file(path)?));\n   35 | \tlet mut data     = Metadata::general_decoding_wrapper(raw_data)?;\n   36 | \n   37 | \t// Remove all IFDs that aren't required\n   38 | \tdata.reduce_to_a_minimum();\n   39 | \n   40 | \t// Write the reduced data back to the backup cursor\n   41 | \tgeneric_write_metadata(&mut BufWriter::new(open_write_file(path)?), &data)?;\n   42 | \n   43 | \treturn Ok(());\n   44 | }","lines":19,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/tiff/file.rs#L26-L44"},{"ref":"src/tiff/vec.rs:22-43","code":"   22 | pub(crate) fn\n   23 | clear_metadata\n   24 | (\n   25 | \tfile_buffer: &mut Vec<u8>\n   26 | )\n   27 | -> Result<(), std::io::Error>\n   28 | {\n   29 | \t// Create cursor\n   30 | \tlet mut cursor           = Cursor::new(file_buffer);\n   31 | \tlet     cursor_start_pos = cursor.position();\n   32 | \n   33 | \t// Read in the data\n   34 | \tlet     raw_data = generic_read_metadata(&mut cursor);\n   35 | \tlet mut data     = Metadata::general_decoding_wrapper(raw_data)?;\n   36 | \n   37 | \t// Remove all IFDs that aren't required\n   38 | \tdata.reduce_to_a_minimum();\n   39 | \n   40 | \t// Write the reduced data back to the backup cursor\n   41 | \tcursor.set_position(cursor_start_pos);\n   42 | \treturn generic_write_metadata(&mut cursor, &data);\n   43 | }","lines":22,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/tiff/vec.rs#L22-L43"}]},

{"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"`metadata_io.rs` contains a large amount of near-identical match dispatch boilerplate repeated across `new_from_vec`, `new_from_path`, `clear_metadata`, `file_clear_metadata`, `write_to_vec`, `write_to_file` (each a big match over `FileExtension` to per-format functions). Several error messages are also copy-paste wrong: e.g. `write_to_vec` uses the message 'Function 'file_clear_metadata' not yet implemented' (should be 'write_to_vec').","fix":"Fix the copy-pasted error string in write_to_vec, and consider a macro or trait-based dispatch table keyed by FileExtension to remove the repeated match arms.","locations":[{"ref":"src/metadata/metadata_io.rs:435-442","code":"  435 |             _\n  436 |                 => return io_error!(\n  437 |                     Other, \n  438 |                     format!(\n  439 |                         \"Function 'file_clear_metadata' not yet implemented for {:?}\", \n  440 |                         file_type\n  441 |                     )\n  442 |                 ),","lines":8,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/metadata/metadata_io.rs#L435-L442"},{"ref":"src/metadata/metadata_io.rs:64-218","code":"   64 |         let raw_pre_decode_general = match file_type\n   65 |         {\n   66 |             FileExtension::HEIF\n   67 |                 => heif::read_metadata(file_buffer),\n   68 |             FileExtension::JPEG \n   69 |                 =>  jpg::read_metadata(file_buffer),\n   70 |             FileExtension::JXL\n   71 |                 =>  jxl::read_metadata(file_buffer),\n   72 |             FileExtension::PNG { as_zTXt_chunk: _ }\n   73 |                 =>  png::read_metadata(file_buffer),\n   74 |             FileExtension::TIFF\n   75 |                 => tiff::vec::read_metadata(file_buffer),\n   76 |             FileExtension::WEBP\n {"id":"ARCH_2","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"src/png/mod.rs mixes many responsibilities in one ~975-line file: signature checking, generic parsing, reading, clearing, writing, chunk insertion, EXIF<->PNG hex encode/decode, and zTXt construction. decode_metadata_png alone (~150 lines) combines hex decoding, marker scanning, and size validation. This makes the untrusted-input paths hard to audit and test in isolation.","fix":"Split encode/decode of the PNG EXIF hex container into its own module and break decode_metadata_png into hex-decode, header-locate, and size-validate functions.","locations":[{"ref":"src/png/mod.rs:740-897","code":"  740 | fn\n  741 | decode_metadata_png\n  742 | (\n  743 |     encoded_data: &Vec<u8>\n  744 | )\n  745 | -> Result<Vec<u8>, std::io::Error>\n  746 | {\n  747 | \n  748 |     let mut exif_all:       VecDeque<u8> = VecDeque::new();\n  749 |     let mut opt_other_byte: Option<u8>   = None;\n  750 | \n  751 |     // This performs the reverse operation to encode_byte:\n  752 |     // Two succeeding bytes represent the ASCII values of the digits of \n  753 |     // a hex value, e.g. 0x31, 0x32 represent '1' and '2', so the resulting\n  754 |     // hex value is 0x12, which gets pushed onto exif_all\n  755 |     for byte in encoded_data\n  756 |     {\n  757 |         // Ignore newline characters\n  758 |         if *byte == b'\\n'\n  759 |         {\n  760 |             continue;\n  761 |         }\n  762 | \n  763 |         if opt_other_byte.is_none()\n  764 |         {\n  765 |             opt_other_byte = Some(*byte);\n  766 |             continue;\n  767 |         }\n  768 | \n  769 |         let Some(other_byte) = opt_other_byte else {\n  770 |             return io_error!(Other, \"Mangled PNG EXIF data encountered during decoding!\");\n  771 |         };\n  772 | \n  773 |         let value_string = \"\".to_owned()\n  774 |             + &(other_byte as char).to_string()\n  775 |             + &(*byte as char).to_string();\n  776 | \n  777 |         if let Ok(value) = u8::from_str_radix(value_string.trim(), 16)\n  778 |         {\n  779 |             exif_all.push_back(value);\n  780 |         }\n  781 | \n  782 |         opt_other_byte = None;\n  783 |     }\n  784 | \n  785 |     // Now remove the first element until the exif header or endian information \n  786 |     // is found.\n  787 |     // Store the popped elements to get the size information\n  788 |     let mut exif_header_found = false;\n  789 |     let mut endian_info_found = false;\n  790 |     let mut pop_storage: Vec<u8> = Vec::new();\n  791 | \n  792 |     while !exif_header_found && !endian_info_found\n  793 |     {\n  794 |         let mut counter = 0;\n  795 |         for header_value in &EXIF_HEADER\n  796 |         {\n  797 |             if *header_value != exif_all[counter]\n  798 |             {\n  799 |                 break;\n  800 |             }\n  801 |             counter += 1;\n  802 |         }\n  803 | \n  804 |         exif_header_found = counter == EXIF_HEADER.len();\n  805 | \n  806 |         if exif_header_found\n  807 |         {\n  808 |             break;\n  809 |         }\n  810 | \n  811 |         counter = 0;\n  812 | \n  813 |         // But what if the EXIF_HEADER is missing and we are directly starting\n  814 |         // with the endian information? See issue #54\n  815 |         for endian_info in &LITTLE_ENDIAN_INFO\n  816 |         {\n  817 |             if *endian_info != exif_all[counter]\n  818 |             {\n  819 |                 break;\n  820 |             }\n  821 |             counter += 1;\n  822 |         }\n  823 | \n  824 |         endian_info_found = counter == LITTLE_ENDIAN_INFO.len();\n  825 | \n  826 |         if endian_info_found\n  827 |         {\n  828 |             break;\n  829 |         }\n  830 | \n  831 |         // And the same check for big endian\n  832 |         for endian_info in &BIG_ENDIAN_INFO\n  833 |         {\n  834 |             if *endian_info != exif_all[counter]\n  835 |             {\n  836 |                 break;\n  837 |             }\n  838 |             counter += 1;\n  839 |         }\n  840 | \n  841 |         endian_info_found = counter == BIG_ENDIAN_INFO.len();\n  842 | \n  843 |         if endian_info_found\n  844 |         {\n  845 |             break;\n  846 |         }\n  847 | \n  848 |         if let Some(next_byte) = exif_all.pop_front()\n  849 |         {\n  850 |             pop_storage.push(next_byte);\n  851 |         }\n  852 |         else\n  853 |         {\n  854 |             return io_error!(\n  855 |                 InvalidData, \n  856 |                 \"Can't decode PNG EXIF data - No EXIF header or endian information found!\"\n  857 |             );\n  858 |         }\n  859 |     }\n  860 | \n  861 |     // The exif header has been found\n  862 |     // -> exif_all now starts with the exif header information\n  863 |     // -> pop_storage has in its last 4 elements the size information\n  864 |     //    that will now get extracted\n  865 |     // Consider this part optional as it might be removed in the future and\n  866 |     // isn't strictly necessary and just for validating the data we get\n  867 |     assert!(!pop_storage.is_empty());\n  868 | \n  869 |     // Using the encode_byte function re-encode the bytes regarding the size\n  870 |     // information and construct its value using decimal based shifting\n  871 |     // Example: 153 = 0\n  872 |     // + 5*10*10^(2*0) + 3*1*10^(2*0) \n  873 |     // + 0*10*10^(2*1) + 1*1*10^(2*1)\n  874 |     let mut given_exif_len = 0u64;\n  875 |     for i in 0..std::cmp::min(4, pop_storage.len())\n  876 |     {\n  877 |         let re_encoded_byte = encode_byte(&pop_storage[pop_storage.len() -1 -i]);\n  878 |         let tens_place = match (re_encoded_byte[0] as char).to_string().parse::<u64>()\n  879 |         {\n  880 |             Ok(value) => value,\n  881 | const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State
const S = {
  search: '', searchScope: 'all', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenDiff: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(),
};
const statuses = {};

// Persistence
function loadStatuses() {
  try { Object.assign(statuses, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch {}
}
function saveStatuses() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(statuses)); } catch {}
}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;
function syncHash() {
  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));
    if (S.search)            p.set('q',   S.search);
    if (S.searchScope !== 'all') p.set('qs', S.searchScope);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('qs'))  { S.searchScope = p.get('qs'); }
  document.getElementById('search-scope').classList.toggle('active', S.searchScope === 'locations');
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Render a "**Label:** value" line. GitHub/CommonMark only recognizes a
// ``` fence when it starts at the beginning of a line, so if the value
// itself opens with a fence, put it on its own line instead of right
// after the inline label - otherwise the fence marker gets glued onto
// "**Label:** ```" and never renders as a code block.
function mdField(label, value) {
  value = value || '';
  return /^```/.test(value.trim())
    ? '**' + label + ':**\n\n' + value
    : '**' + label + ':** ' + value;
}

// Render the "**Locations:**" block. When a location has a commit-pinned
// permalink (GitHub/GitLab), just paste the bare URL on its own line -
// GitHub/GitLab auto-expand a line-range blob link into an inline code
// preview, so re-pasting the snippet as a fenced block would duplicate it.
// Forges without a detected permalink shape (or missing commit/repo info)
// fall back to the fenced ref+snippet so the location is still readable.
function mdLocations(locations) {
  if (!locations.length) return '';
  let out = '**Locations:**\n\n';
  for (const l of locations) {
    if (l.link)               out += l.link + '\n\n';
    else if (l.code != null)  out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
    else                      out += '- `' + l.ref + '` _(file not found)_\n\n';
  }
  return out;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += mdField('Description', f.description) + '\n\n';
      out += mdLocations(f.locations);
      out += mdField('Fix', f.fix) + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build a [project] header block from embedded PROJECT_INFO, so the exported
// findings.toml is self-contained (doesn't depend on a sibling project-info.toml
// that a second, separately-triggered download could silently fail to save).
// '' when there is no project info at all.
function buildProjectToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = PROJECT_INFO || {};
  if (!Object.keys(pi).length) return '';
  const lines = ['[project]'];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n\n';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return buildProjectToml() + chunks.join('\n\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += mdField('Description', f.description) + '\n\n';
  out += mdLocations(f.locations);
  out += mdField('Fix', f.fix) + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystacks per finding (cleared on full re-render).
// Two variants: everything (default), and file/folder paths only - for when a
// search term (e.g. a directory name like 'dlls/abc') also happens to appear
// inside description/fix prose and you only want path matches.
const _hay = new Map();
const _hayLoc = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}
function hayLocOf(f) {
  if (!_hayLoc.has(f.id)) {
    _hayLoc.set(f.id, f.locations.map(l => l.ref).join(' ').toLowerCase());
  }
  return _hayLoc.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (S.searchScope === 'locations') {
      if (!hayLocOf(f).includes(q)) return false;
    } else if (!hayOf(f).includes(q) && !st.includes(q)) {
      return false;
    }
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  _hayLoc.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    // Single download (was two) - a second auto-triggered download is commonly
    // blocked by the browser unless the user explicitly allows it, which silently
    // drops project-info.toml. Embedding [project] in findings.toml itself avoids
    // that failure mode entirely.
    downloadText(buildFindingsToml(), 'findings.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});
document.getElementById('search-scope').addEventListener('click', e => {
  S.searchScope = S.searchScope === 'locations' ? 'all' : 'locations';
  e.currentTarget.classList.toggle('active', S.searchScope === 'locations');
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
