{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"create_new_single_item_reference_box uses new_simple_box_header() (8-byte header, no version/flags) for the inner SingleItemTypeReference box, which is correct per spec, but sets is_large from the PARENT iref version (>=1). For a freshly created iref (new() sets version 1), is_large is true so IDs are written as u32. However when an EXISTING version-0 iref is reused, the new reference is written with u16 IDs while its size was computed with ID_size=2 - consistent. The latent risk: box_size uses `to_item_ID.len() as u64 * ID_size` and reference_count is `to_item_ID.len() as u16`, truncating silently if more than 65535 references are passed.","fix":"Guard against to_item_ID.len() > u16::MAX before the `as u16` cast.","locations":[{"ref":"src/heif/boxes/item_reference.rs:166-196","code":"  166 |         // Determine is_large and the box size\n  167 |         let is_large = self.header.get_version() >= 1;\n  168 |         let ID_size  = if is_large { 4 } else { 2 };\n  169 |         let box_size = 0\n  170 |             + 8                                 // header\n  171 |             + ID_size                           // from_item_id\n  172 |             + 2                                 // reference_count\n  173 |             + to_item_ID.len() as u64 * ID_size // to_item_id\n  174 |             ; \n  175 | \n  176 |         let mut new_reference_header = BoxHeader::new_simple_box_header();\n  177 |         new_reference_header.set_box_type_via_string(reference_type);\n  178 |         new_reference_header.set_box_size(box_size);\n  179 | \n  180 |         let singe_item_reference_box = SingleItemTypeReferenceBox\n  181 |         {\n  182 |             header:          new_reference_header,\n  183 |             is_large,\n  184 |             from_item_ID,\n  185 |             reference_count: to_item_ID.len() as u16,\n  186 |             to_item_ID,\n  187 |         };\n  188 | \n  189 |         self.references.push(singe_item_reference_box);\n  190 | \n  191 |         let old_iref_box_size = self.header.get_box_size();\n  192 |         let new_iref_box_size = old_iref_box_size + box_size;\n  193 |         self.header.set_box_size(new_iref_box_size);\n  194 | \n  195 |         return box_size;\n  196 |     }","lines":31,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/heif/boxes/item_reference.rs#L166-L196"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In construct_new_exif_data_area the local cursor is built from `exif_buffer[0..4].to_vec()` but the surrounding `if length > 0` branch does not guarantee at least 4 bytes (see the related slicing panic). Even when not panicking, when exif_tiff_header_offset+4 exceeds the read exif_buffer the new_exif_buffer slice at line 285 silently produces wrong data. The function is annotated `#[allow(unused_assignments)]` masking that new_exif_buffer is always assigned in both branches - the allow is unnecessary and hides intent.","fix":"Validate buffer length, drop the unnecessary #[allow(unused_assignments)], and bound-check exif_tiff_header_offset against exif_buffer.len().","locations":[{"ref":"src/heif/container.rs:247-293","code":"  247 |     #[allow(unused_assignments)]\n  248 |     fn\n  249 |     construct_new_exif_data_area\n  250 |     <T: Seek + Read>\n  251 |     (\n  252 |         &self,\n  253 |         cursor:   &mut T,\n  254 |         metadata: &Metadata,\n  255 |     )\n  256 |     -> Result<(Vec<u8>, i64), std::io::Error>\n  257 |     {\n  258 |         // The buffer containing the new metadata that gets returned\n  259 |         let mut new_exif_buffer;\n  260 | \n  261 |         // Try to locate the old exif data. \n  262 |         let exif_item_id = self.get_item_id_exif_data()?;\n  263 | \n  264 |         // Determine the start and length of the previous exif data area\n  265 |         let (start, length) = self.get_exif_data_pos_and_len(exif_item_id)?;\n  266 | \n  267 |         // If the length is zero, we assume that this is a previously newly \n  268 |         // created exif data area, which requires special handling.\n  269 |         // If the length is non-zero, there has been exif data before:\n  270 |         if length > 0\n  271 |         {\n  272 |             // Reset cursor to start of exif data\n  273 |             cursor.seek(std::io::SeekFrom::Start(start))?;\n  274 | \n  275 |             // Read in all of this area\n  276 |             let mut exif_buffer = vec![0u8; length as usize];\n  277 |             cursor.read_exact(&mut exif_buffer)?;\n  278 | \n  279 |             // Decode the first 4 bytes, which tells us where to cut off the old \n  280 |             // data and replace with the new one\n  281 |             let mut local_cursor            = Cursor::new(exif_buffer[0..4].to_vec());\n  282 |             let     exif_tiff_header_offset = read_be_u32(&mut local_cursor)?;\n  283 | \n  284 |             // Cut off data, starting at the old TIFF header and replace with new\n  285 |             new_exif_buffer = exif_buffer[0..exif_tiff_header_offset as usize + 4].to_vec();\n  286 |         }\n  287 |         else\n  288 |         {\n  289 |             // Create a new exif header, starting with an empty TIFF header.\n  290 |             // new_exif_buffer = 0_u32.to_be_bytes().to_vec();\n  291 |             new_exif_buffer = [0x00, 0x00, 0x00, 0x06].to_vec();\n  292 |             new_exif_buffer.extend(EXIF_HEADER.to_vec());\n  293 |         }","lines":47,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/heif/container.rs#L247-L293"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"decode_ifd's enough-data check at the top uses 6 bytes (2 for entry count + 4 for the link), but reading the entry count only requires 2 bytes; more importantly the later `required` check (mod.rs:129-140) recomputes available as `len - entry_position` and compares to `2 + 12*n + 4`. This is correct, but note that data_begin_position based seeks (set_position(data_begin_position) + seek Current(offset)) use unvalidated `offset as i64` from untrusted data; an offset that lands past EOF is only caught by the subsequent read_exact error, while a huge offset producing a negative/overflowing i64 position is possible. Worth bounds-checking offsets explicitly.","fix":"Validate that data_begin_position + offset stays within the buffer length before seeking/reading, returning an io_error otherwise, rather than relying on read_exact failures.","locations":[{"ref":"src/ifd/mod.rs:202-207","code":"  202 |                 data_cursor.set_position(data_begin_position);\n  203 |                 data_cursor.seek(std::io::SeekFrom::Current(hex_offset as i64))?;\n  204 | \n  205 |                 // Read the raw data\n  206 |                 let mut raw_data_buffer = vec![0u8; byte_count as usize];\n  207 |                 data_cursor.read_exact(&mut raw_data_buffer)?;","lines":6,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/ifd/mod.rs#L202-L207"},{"ref":"src/ifd/mod.rs:266-267","code":"  266 |                 data_cursor.set_position(data_begin_position);\n  267 |                 data_cursor.seek(std::io::SeekFrom::Current(offset as i64))?;","lines":2,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/ifd/mod.rs#L266-L267"},{"ref":"src/ifd/mod.rs:382-383","code":"  382 |                     data_cursor.set_position(data_begin_position);\n  383 |                     data_cursor.seek(std::io::SeekFrom::Current(*offset as i64))?;","lines":2,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/ifd/mod.rs#L382-L383"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In set_tag the warning compares input_tag.get_group() to self.ifd_type, but several writable tags hardcode their group (e.g. GPSInfo, ExifOffset, GPSInfo report GENERIC via get_group) so a legitimately placed offset tag may produce spurious warnings, and conversely tags whose get_group is GENERIC can be silently inserted into any IFD. The check is advisory only (just logs) so impact is low, but it can mislead.","fix":"Consider checking against TagType/allowed groups rather than the single hardcoded get_group(), or drop the warning for tags whose group is inherently GENERIC.","locations":[{"ref":"src/ifd/set.rs:23-26","code":"   23 |         if input_tag.get_group() != self.ifd_type\n   24 |         {\n   25 |             log::warn!(\"The tag {input_tag:?} is set in an IFD that has not a matching group.\");\n   26 |         }","lines":4,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/ifd/set.rs#L23-L26"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"jxl::file_check_signature opens the file with open_write_file (read+write) merely to validate the 12-byte signature for what callers may expect to be a read-only operation. read_metadata's file path (file_read_metadata) correctly uses open_read_file, but file_check_signature (used by clearing) acquires write access. This is inconsistent and can fail on read-only files even when only a signature check is needed at that step.","fix":"Use open_read_file when only reading/validating; open for write only where the file is actually modified.","locations":[{"ref":"src/jxl.rs:104-124","code":"  104 | fn\n  105 | file_check_signature\n  106 | (\n  107 |     path: &Path\n  108 | )\n  109 | -> Result<File, std::io::Error>\n  110 | {\n  111 |     let mut file = open_write_file(path)?;\n  112 | \n  113 |     let mut signature_buffer = [0u8; 12];\n  114 |     let bytes_read = file.read(&mut signature_buffer)?;\n  115 | \n  116 |     if bytes_read != 12\n  117 |     {\n  118 |         return io_error!(InvalidData, \"Can't open JXL file - Can't read signature!\");\n  119 |     }\n  120 | \n  121 |     check_signature(&signature_buffer)?;\n  122 | \n  123 |     return Ok(file);\n  124 | }","lines":21,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/jxl.rs#L104-L124"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In get_next_chunk_descriptor, when PngChunk::from_string returns Err (unknown chunk), the Err value e is itself a PngChunk::UNKNOWN and is returned as Ok(e). This silently treats every unknown chunk as valid, which is intended, but the function name from_string returning Result<PngChunk, PngChunk> where both variants are PngChunk is confusing API design and the log::warn fires for every ancillary chunk little_exif does not model, producing noisy warnings on normal files.","fix":"Return a single PngChunk (Unknown variant for unrecognized names) rather than Result<PngChunk, PngChunk>, and downgrade or remove the warn-level log for expected unknown chunks.","locations":[{"ref":"src/png/mod.rs:212-226","code":"  212 |     let png_chunk_result = PngChunk::from_string(\n  213 |         &chunk_name.clone(),\n  214 |         chunk_length\n  215 |     );\n  216 | \n  217 |     match png_chunk_result\n  218 |     {\n  219 |         Ok(png_chunk) => {\n  220 |             return Ok(png_chunk)\n  221 |         },\n  222 |         Err(e) => {\n  223 |             log::warn!(\"Unknown PNG chunk name: {chunk_name}\");\n  224 |             return Ok(e)\n  225 |         }\n  226 |     };","lines":15,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/png/mod.rs#L212-L226"},{"ref":"src/png/chunk.rs:74-89","code":"   74 |             pub(crate) fn\n   75 |             from_string\n   76 |             (\n   77 |                 string_name: &str,\n   78 |                 length:       u32\n   79 |             )\n   80 |             -> Result<PngChunk, PngChunk>\n   81 |             {\n   82 |                 match string_name\n   83 |                 {\n   84 |                     $(\n   85 |                         stringify!($tag) => Ok(PngChunk::$tag(length)),\n   86 |                     )*\n   87 |                     _ => Err(PngChunk::UNKNOWN(string_name.to_string(), length)),\n   88 |                 }\n   89 |             }","lines":16,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/png/chunk.rs#L74-L89"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"String::from_u8_vec_res has a fallback path (when UTF-8 decoding fails) that pushes `*byte as char` for every non-zero byte. Casting a u8 directly to char maps bytes 0x80-0xFF to the corresponding Unicode code points (Latin-1), which is almost never the intended encoding for EXIF strings and silently produces wrong characters rather than reporting bad data. It also drops all interior NUL bytes, not just trailing ones, changing string length semantics versus the UTF-8 path which only trims trailing NULs.","fix":"Decide on one defined behavior: either return an error on non-UTF-8, or use a documented encoding (e.g. from_utf8_lossy) consistently, rather than the ad-hoc Latin-1-ish byte-to-char cast that also alters NUL handling.","locations":[{"ref":"src/u8conversion.rs:158-168","code":"  158 |         let mut result = String::new();\n  159 | \n  160 |         for byte in u8_vec\n  161 |         {\n  162 |             if *byte > 0\n  163 |             {\n  164 |                 result.push(*byte as char);\n  165 |             }\n  166 |         }\n  167 | \n  168 |         Ok(result)","lines":11,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/u8conversion.rs#L158-L168"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"medium","description":"Inconsistency between file.rs and vec.rs convert_to_extended_format: file.rs handles the 'VP8 ' case by actually computing dimensions via get_dimension_info_from_vp8_chunk, while vec.rs returns an error 'Conversion ... not yet implemented!' for 'VP8 '. The two backends therefore behave differently for the same input file (one converts, one fails), a copy-paste divergence in otherwise parallel code.","fix":"Make both paths consistent: either implement VP8 handling in vec.rs (sharing the mod.rs helper) or align error behavior; factor the dispatch into a shared helper.","locations":[{"ref":"src/webp/file.rs:412-420","code":"  412 |     let (width, height) = match first_chunk.descriptor().header().as_str()\n  413 |     {\n  414 |         \"VP8 \" \n  415 |             => get_dimension_info_from_vp8_chunk(first_chunk.payload()),\n  416 |         \"VP8L\"\n  417 |             => get_dimension_info_from_vp8l_chunk(first_chunk.payload()),\n  418 |         _ \n  419 |             => io_error!(Other, \"Expected either 'VP8 ' or 'VP8L' chunk for conversion!\")\n  420 |     }?;","lines":9,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/webp/file.rs#L412-L420"},{"ref":"src/webp/vec.rs:397-405","code":"  397 |     let (width, height) = match first_chunk.descriptor().header().as_str()\n  398 |     {\n  399 |         \"VP8 \"\n  400 |             => {log::debug!(\"VP8 !\"); io_error!(Other, \"Conversion from Simple File Format with 'VP8' chunk to Extended File Format not yet implemented!\") },\n  401 |         \"VP8L\"\n  402 |             => get_dimension_info_from_vp8l_chunk(first_chunk.payload()),\n  403 |         _ \n  404 |             => io_error!(Other, format!(\"Expected either 'VP8 ' or 'VP8L' chunk for conversion but got {:?}!\", first_chunk.descriptor().header().as_str()))\n  405 |     }?;","lines":9,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/webp/vec.rs#L397-L405"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"medium","description":"read_chunk_data uses a single cursor.read() and only errors if bytes_read != chunk_length. std::io::Read::read is permitted to return fewer bytes than requested even when more data is available (common for File and other readers). On a valid large chunk read from a File this can spuriously fail, and the result is treated as a hard error. read_4_bytes/read_8_bytes in util.rs share the same flaw.","fix":"Use cursor.read_exact(&mut chunk_data_buffer) and map UnexpectedEof to the desired io_error, rather than a single read() plus a length comparison.","locations":[{"ref":"src/png/read.rs:53-59","code":"   53 |     let mut chunk_data_buffer = vec![0u8; chunk_length];\n   54 |     let     bytes_read        = cursor.read(&mut chunk_data_buffer)?;\n   55 |     \n   56 |     if bytes_read != chunk_length\n   57 |     {\n   58 |         return io_error!(Other, \"Could not read chunk data\");\n   59 |     }","lines":7,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/png/read.rs#L53-L59"},{"ref":"src/util.rs:88-98","code":"   88 |     // Read in the 4 bytes\n   89 |     let mut field = [0u8; 4];\n   90 |     let bytes_read = cursor.read(&mut field)?;\n   91 | \n   92 |     // Check that indeed 4 bytes were read\n   93 |     if bytes_read != 4\n   94 |     {\n   95 |         return io_error!(Other, \"Could not read the next 4 bytes!\");\n   96 |     }\n   97 | \n   98 |     return Ok(field);","lines":11,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/util.rs#L88-L98"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"medium","description":"All read_N_bytes helpers use cursor.read(&mut field) and then check bytes_read != N. Read::read is allowed to return fewer bytes than requested even when more data is available (short reads are legal for File, pipes, and other readers, and are common for non-Cursor sources). These helpers are called with a generic Seek+Read and are used directly on std::fs::File (e.g. src/heif/box_header.rs:98-101). A legal short read makes valid files spuriously fail to parse, and a short read that happens to equal N-? could mis-position the cursor. read_null_terminated_string and the read_be_* helpers inherit the bug.","fix":"Use cursor.read_exact(&mut field)? which loops until the buffer is full or a real EOF/error occurs, and drop the manual bytes_read comparison.","locations":[{"ref":"src/util.rs:21-27","code":"   21 |     let bytes_read = cursor.read(&mut field)?;\n   22 | \n   23 |     // Check that indeed 1 bytes were read\n   24 |     if bytes_read != 1\n   25 |     {\n   26 |         return io_error!(Other, \"Could not read the next 1 bytes!\");\n   27 |     }","lines":7,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/util.rs#L21-L27"},{"ref":"src/util.rs:44-50","code":"   44 |     let bytes_read = cursor.read(&mut field)?;\n   45 | \n   46 |     // Check that indeed 2 bytes were read\n   47 |     if bytes_read != 2\n   48 |     {\n   49 |         return io_error!(Other, \"Could not read the next 2 bytes!\");\n   50 |     }","lines":7,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/util.rs#L44-L50"},{"ref":"src/util.rs:67-73","code":"   67 |     let bytes_read = cursor.read(&mut field)?;\n   68 | \n   69 |     // Check that indeed 3 bytes were read\n   70 |     if bytes_read != 3\n   71 |     {\n   72 |         return io_error!(Other, \"Could not read the next 3 bytes!\");\n   73 |     }","lines":7,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/util.rs#L67-L73"},{"ref":"src/util.rs:90-96","code":"   90 |     let bytes_read = cursor.read(&mut field)?;\n   91 | \n   92 |     // Check that indeed 4 bytes were read\n   93 |     if bytes_read != 4\n   94 |     {\n   95 |         return io_error!(Other, \"Could not read the next 4 bytes!\");\n   96 |     }","lines":7,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/util.rs#L90-L96"},{"ref":"src/util.rs:113-119","code":"  113 |     let bytes_read = cursor.read(&mut field)?;\n  114 | \n  115 |     // Check that indeed 8 bytes were read\n  116 |     if bytes_read != 8\n  117 |     {\n  118 |         return io_error!(Other, \"Could not read the next 8 bytes!\");\n  119 |     }","lines":7,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/util.rs#L113-L119"},{"ref":"src/util.rs:136-142","code":"  136 |     let bytes_read = cursor.read(&mut field)?;\n  137 | \n  138 |     // Check that indeed 16 bytes were read\n  139 |     if bytes_read != 16\n  140 |     {\n  141 |         return io_error!(Other, \"Could not read the next 16 bytes!\");\n  142 |     }","lines":7,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/util.rs#L136-L142"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"construct_from_cursor_unboxed swallows all errors from read_next_box: `while let Ok(next_box) = read_next_box(cursor)` stops the loop on ANY error (including a genuine InvalidData/Unsupported error from a malformed box) and silently returns the boxes read so far as a successful container. Truncated or corrupt files therefore parse as 'valid' with missing boxes, leading to confusing downstream 'No meta box found' errors instead of the real parse error.","fix":"Distinguish a clean EOF (UnexpectedEof at a box boundary) from real parse errors; propagate real errors instead of treating every Err as end-of-stream.","locations":[{"ref":"src/heif/container.rs:85-92","code":"   85 |         let mut boxes = Vec::new();\n   86 | \n   87 |         while let Ok(next_box) = read_next_box(cursor)\n   88 |         {\n   89 |             boxes.push(next_box);\n   90 |         }\n   91 | \n   92 |         return Ok(Self { boxes })","lines":8,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/heif/container.rs#L85-L92"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"After a successful IFD_OFFSET (SubIFD) recursive decode, decode_ifd does `continue`, skipping the call to decode_tag_with_format_exceptions and never pushing the offset tag (ExifOffset/GPSInfo/InteropOffset) into `tags`. The SubIFD content is captured via insert_into, but the parent IFD loses the offset tag entirely. On a subsequent re-encode the offset linkage relies on ifds_with_offset_info_only being repopulated elsewhere; if that path is not exercised the offset tag is dropped, which is fragile/implicit behavior worth documenting or fixing.","fix":"Either push a placeholder offset tag into `tags` for the parent IFD, or add a comment/assertion documenting that offset tags are intentionally reconstructed during encode and must not be relied upon to round-trip from `tags`.","locations":[{"ref":"src/ifd/mod.rs:259-309","code":"  259 |             if let TagType::IFD_OFFSET(subifd_group) = tag.get_tag_type()\n  260 |             {\n  261 |                 // Compute the offset to the SubIFD and save the current position\n  262 |                 let offset          = from_u8_vec_res_macro!(u32, &raw_data, endian)? as usize;\n  263 |                 let backup_position = data_cursor.position();\n  264 | \n  265 |                 // Go to the SubIFD offset and decode that\n  266 |                 data_cursor.set_position(data_begin_position);\n  267 |                 data_cursor.seek(std::io::SeekFrom::Current(offset as i64))?;\n  268 | \n  269 |                 let subifd_decode_result = Self::decode_ifd(\n  270 |                     data_cursor,\n  271 |                     data_begin_position,\n  272 |                     endian,\n  273 |                     &subifd_group,\n  274 |                     generic_ifd_nr,\n  275 |                     insert_into,\n  276 |                 );\n  277 | \n  278 |                 // Check that this actually worked\n  279 |                 if let Ok(_subifd_result) = subifd_decode_result\n  280 |                 {\n  281 |                     // Assert result, restore old cursor position & continue\n  282 | \n  283 |                     // Disabled assert as of issue #31\n  284 |                     // The idea behind this assert was that, as we are decoding\n  285 |                     // a SubIFD, there shouldn't be a link after the last entry\n  286 |                     // to another IFD and those 4 bytes are expected to be zero\n  287 |                     // and we get a Ok(None) from the recursive call back.\n  288 |                     \n  289 |                     // assert_eq!(subifd_result, None);\n  290 | \n  291 |                     // However, it is possible that those 4 bytes don't exist\n  292 |                     // at all and they are part of some offset data, possibly\n  293 |                     // even from another IFD! \n  294 |                     // So, for now we just assume that `subifd_result` is not\n  295 |                     // of relevance until evidence suggests otherwise.\n  296 |                     \n  297 |                     data_cursor.set_position(backup_position);\n  298 |                     continue;\n  299 |                 }\n  300 |                 else if let Err(decode_err) = subifd_decode_result\n  301 |                 {\n  302 |                     return io_error!(\n  303 |                         Other, \n  304 |                         format!(\n  305 |                             \"Could not decode SubIFD {subifd_group:?}:\\n {decode_err:?}\"\n  306 |                         )\n  307 |                     );\n  308 |                 }\n  309 |             }","lines":51,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/ifd/mod.rs#L259-L309"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"jxl::clear_metadata uses fragile box parsing that assumes every box is exactly 8 bytes header + data, but box_contains_exif for a BROB box only inspects bytes position+8..position+12 via a throwaway Cursor; if that 4-byte slice is short it has already panicked above. More importantly, after range_remove the loop does not re-validate that `position` still points at a valid box header, so a removed-then-stale position can read past the (now shorter) buffer. The streaming variant (file_clear_metadata) and the in-memory variant diverge in behavior, increasing the chance of inconsistent results between Metadata::clear_metadata and file-based clears.","fix":"Unify the two clear_metadata implementations on a single validated box-walking helper that bounds-checks every read and rejects malformed boxes.","locations":[{"ref":"src/jxl.rs:139-166","code":"  139 |     loop\n  140 |     {\n  141 |         if position >= file_buffer.len() { return Ok(()); }\n  142 | \n  143 |         // Get the first 4 bytes at the current cursor position to determine\n  144 |         // the length of the current box \n  145 |         let length_buffer = file_buffer[position..position+4].to_vec();\n  146 |         let length        = from_u8_vec_res_macro!(u32, &length_buffer, &Endian::Big)? as usize;\n  147 | \n  148 |         // Next, read the box type\n  149 |         let type_buffer = file_buffer[position+4..position+8].to_vec();\n  150 | \n  151 |         if box_contains_exif(\n  152 |             &mut Cursor::new(\n  153 |                 file_buffer[position+8..position+12].to_vec()\n  154 |             ), \n  155 |             [type_buffer[0], type_buffer[1], type_buffer[2], type_buffer[3]]\n  156 |         )?\n  157 |         {\n  158 |             range_remove(file_buffer, position, position+length);\n  159 |         }\n  160 |         else\n  161 |         {\n  162 |             // Not an EXIF box so skip it\n  163 |             position += length;\n  164 |         }\n  165 |     }\n  166 | }","lines":28,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/jxl.rs#L139-L166"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"Doc comments on `new_from_vec` and `new_from_path` state 'If unable to decode the metadata, a new, empty object gets created and returned' and 'If unable to handle the file vector ... this (currently) panics.' Neither is true: the functions return `Result` and propagate a decode error via `general_decoding_wrapper` (which returns `Err`, not an empty Metadata), and unsupported types return an `io_error!` rather than panicking. The documentation describes behavior that does not match the code, misleading API users about error semantics.","fix":"Update the doc comments to state that an `Err` is returned for unsupported file types and for decode failures; remove the obsolete 'panics' / 'empty object' claims.","locations":[{"ref":"src/metadata/metadata_io.rs:24-26","code":"   24 |     /// Constructs a new `Metadata` object with the metadata from an image that is stored as a `Vec<u8>`\n   25 |     /// - If unable to handle the file vector (e.g. unsupported file type, etc.), this (currently) panics.\n   26 |     /// - If unable to decode the metadata, a new, empty object gets created and returned.","lines":3,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/metadata/metadata_io.rs#L24-L26"},{"ref":"src/metadata/metadata_io.rs:91-93","code":"   91 |     /// Constructs a new `Metadata` object with the metadata from the image at the specified path.\n   92 |     /// - If unable to read the file (e.g. does not exist, unsupported file type, etc.), this (currently) panics.\n   93 |     /// - If unable to decode the metadata, a new, empty object gets created and returned.","lines":3,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/metadata/metadata_io.rs#L91-L93"}]},
{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"generic_read_metadata, the 'tEXt'|'zTXt'|'iTXt' arm skips only 4 bytes (chunk length) then calls read_chunk_name, but read_chunk_data is given chunk.length(). The cursor is now positioned right after the name (start of data), which is correct, yet the parallel 'eXIf' arm skips 4+4 and the default arm skips length+12. These hand-computed seek offsets are duplicated and easy to desync from each other; any chunk whose declared length disagrees with the parsed descriptor will mis-seek and corrupt subsequent parsing. The code relies on read_chunk_data's exact-length check to catch this, but a short read just errors out the whole read.","fix":"Compute seek offsets from a single helper using the chunk descriptor's length consistently, and assert cursor position matches expectations after each chunk.","locations":[{"ref":"src/png/mod.rs:295-341","code":"  295 |             \"tEXt\" | \"zTXt\" | \"iTXt\" => {\n  296 |                 // More common & expected case\n  297 | \n  298 |                 // Skip chunk length and type (4+4 Bytes)\n  299 |                 cursor.seek(std::io::SeekFrom::Current(4))?;\n  300 | \n  301 |                 let chunk_name = read_chunk_name(cursor)?;\n  302 | \n  303 |                 // Read chunk data into buffer\n  304 |                 // No need to verify this using CRC as already done by \n  305 |                 // previously calling parse_png(path)\n  306 |                 let chunk_data = read_chunk_data(\n  307 |                     cursor, \n  308 |                     chunk.length() as usize\n  309 |                 )?;\n  310 | \n  311 |                 // Check that this chunk contains raw profile EXIF data\n  312 |                 let keyword = get_keyword_from_text_chunk(&chunk_data);\n  313 |                 let mut has_raw_profile_type_exif = false;\n  314 |                 if keyword.len() == RAW_PROFILE_TYPE_EXIF.len()\n  315 |                 {\n  316 |                     has_raw_profile_type_exif = keyword\n  317 |                         .bytes()\n  318 |                         .zip(RAW_PROFILE_TYPE_EXIF.iter())\n  319 |                         .all(|(a,b)| a == *b);\n  320 |                 }\n  321 | \n  322 |                 if !has_raw_profile_type_exif\n  323 |                 {\n  324 |                     // Skip CRC from current (wrong) chunk and continue\n  325 |                     cursor.seek(std::io::SeekFrom::Current(4))?;\n  326 |                     continue;\n  327 |                 }\n  328 | \n  329 |                 let decompressed_data = get_data_from_text_chunk(\n  330 |                     chunk_name.as_str(), \n  331 |                     &chunk_data\n  332 |                 )?;\n  333 |                 \n  334 |                 return decode_metadata_png(&decompressed_data);\n  335 |             }\n  336 | \n  337 |             _ => {\n  338 |                 cursor.seek(std::io::SeekFrom::Current(chunk.length() as i64 + 12))?;\n  339 |                 continue;\n  340 |             }\n  341 |         };","lines":47,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/png/mod.rs#L295-L341"}]},

|             parse_webp_result\n  526 |         ),\n  527 |         Err(e) => {\n  528 |             match e.to_string().as_str()\n  529 |             {\n  530 |                 \"No EXIF chunk according to VP8X flags!\"\n  531 |                     => return Ok(()),\n  532 |                 \"Expected first chunk of WebP file to be of type 'VP8X' but instead got VP8L!\"\n  533 |                     => return Ok(()),\n  534 |                 \"Expected first chunk of WebP file to be of type 'VP8X' but instead got VP8 !\"\n  535 |                     => return Ok(()),\n  536 |                 _\n  537 |                     => return Err(e)\n  538 |             }\n  539 |         }\n  540 |     };","lines":20,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/webp/vec.rs#L521-L540"}]},
{"id":"ERR_9","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In decode_tag_with_format_exceptions the INT16U-from-INT32U conversion truncates each u32 to u16 with `x as u16` silently (the comment even says 'Not sure how to be more cautious'). Values > 65535 are silently corrupted rather than rejected, unlike the INT8U-from-INT16U path which (over-aggressively) asserts.","fix":"Reject (return io_error) when any u32 element exceeds u16::MAX instead of silently truncating, for consistency and data integrity.","locations":[{"ref":"src/exif_tag/decode.rs:54-61","code":"   54 | \t\t\t(ExifTagFormat::INT16U, ExifTagFormat::INT32U) => {\n   55 | \t\t\t\t// Not sure how to be more cautious in this case...\n   56 | \t\t\t\tlet int32u_data = <INT32U as U8conversion<INT32U>>::from_u8_vec(raw_data, endian);\n   57 | \t\t\t\tlet int16u_data = int32u_data.into_iter().map(|x| x as u16).collect::<Vec<u16>>();\n   58 | \t\t\t\treturn raw_tag.set_value_to_int16u_vec(int16u_data).map_err(\n   59 | \t\t\t\t\t|e| io_error_plain!(Other, format!(\"Could not decode tag {:?}: {}\", raw_tag, e))\n   60 | \t\t\t\t);\n   61 | \t\t\t},","lines":8,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/exif_tag/decode.rs#L54-L61"}]},
{"id":"ERR_10","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`get_file_type` uses `ErrorKind::Other` for 'File does not exist!' and 'Can't get file extension!' / 'Can't convert extension!', while the not-found case would be better surfaced as `NotFound` and the unsupported-type path as `Unsupported`. Callers (new_from_path) special-case only `ErrorKind::Unsupported`; a genuinely missing file returns `Other` and is treated as 'no extension info', causing fallback to content detection on a file that was opened separately - masking the real not-found error.","fix":"Return `ErrorKind::NotFound` when the file does not exist and propagate it distinctly; reserve `Other` for truly unclassifiable failures.","locations":[{"ref":"src/filetype.rs:150-159","code":"  150 |     if !path.try_exists()? \n  151 |     {\n  152 |         return io_error!(Other, \"File does not exist!\");\n  153 |     }\n  154 | \n  155 |     let raw_file_type_str = path.extension()\n  156 |         .ok_or(io::Error::new(ErrorKind::Other, \"Can't get file extension!\"))?;\n  157 | \n  158 |     let file_type_str = raw_file_type_str.to_str()\n  159 |         .ok_or(io::Error::new(ErrorKind::Other, \"Can't convert extension!\"))?;","lines":10,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/filetype.rs#L150-L159"}]},
{"id":"ERR_11","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"ItemReferenceBox::construct_from_cursor_unboxed advances `bytes_read` by each inner reference's box_size, but if an inner SingleItemTypeReferenceBox reports box_size 0 (or smaller than what was actually consumed), the while loop never makes progress (box_size 0) and spins, or over/undercounts, mis-parsing the rest. There is no check that the inner box_size matches the bytes actually consumed.","fix":"Reject inner reference boxes with box_size==0 and verify consumed bytes equal the declared box_size; bail out on a mismatch.","locations":[{"ref":"src/heif/boxes/item_reference.rs:131-153","code":"  131 |         let mut bytes_read = 0;\n  132 | \n  133 |         let mut references = Vec::new();\n  134 | \n  135 |         if header.get_box_size() < header.get_header_size()\n  136 |         {\n  137 |             return io_error!(InvalidData, \"Box size is smaller than header size for iref box\");\n  138 |         }\n  139 | \n  140 |         while bytes_read < header.get_box_size() - header.get_header_size()\n  141 |         {\n  142 |             let next_reference = SingleItemTypeReferenceBox::construct_from_cursor_unboxed(\n  143 |                 cursor, \n  144 |                 &header\n  145 |             )?;\n  146 | \n  147 |             bytes_read += next_reference.get_header().get_box_size();\n  148 | \n  149 |             references.push(next_reference);\n  150 |         }\n  151 | \n  152 |         return Ok(ItemReferenceBox { header, references });\n  153 |     }","lines":23,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/heif/boxes/item_reference.rs#L131-L153"}]},
{"id":"ERR_12","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"jpg::file_check_signature and read_metadata paths treat a short read of the 2-byte signature as an error, but check_signature uses starts_with which would also be safe; however file_read_metadata via generic_read_metadata relies on read_exact for length and segment data, so a JPG whose final marker has a truncated length or payload yields an io::Error rather than the graceful EOF handling that clear_segment added for issue #93. Read and clear paths thus disagree on tolerating truncated files.","fix":"Apply the same UnexpectedEof tolerance in generic_read_metadata that clear_segment uses, so truncated-but-otherwise-valid files are handled consistently.","locations":[{"ref":"src/jpg.rs:456-499","code":"  456 |             let mut length_buffer = [0u8; 2];\n  457 |             cursor.read_exact(&mut length_buffer)?;\n  458 | \n  459 |             // Decode the length to determine how much more data there is\n  460 |             let length = from_u8_vec_res_macro!(u16, &length_buffer, &Endian::Big)?;\n  461 |             if length < 2\n  462 |             {\n  463 |                 return io_error!(InvalidData, \"Mangled JPG data encountered!\");\n  464 |             }\n  465 | \n  466 |             let remaining_length = (length - 2) as usize;\n  467 | \n  468 |             match byte_buffer[0]\n  469 |             {\n  470 |                 0xe1 => {                                                       // APP1 marker\n  471 |                     // Read in & return the remaining data\n  472 |                     let mut app1_buffer = vec![0u8; remaining_length];\n  473 |                     cursor.read_exact(&mut app1_buffer)?;\n  474 | \n  475 |                     return Ok(app1_buffer);\n  476 |                 },\n  477 | \n  478 |                 0xda => {                                                       // SOS marker\n  479 |                     // The start of scan (SOS) segment is followed by a blob of\n  480 |                     // image data, the entropy-coded segment (ECS), which has no\n  481 |                     // information regarding its length (as it may easily be \n  482 |                     // bigger than the max segment length of 64kb)\n  483 | \n  484 |                     // So, we have to scan byte-for-byte at this point until\n  485 |                     // a marker prefix comes up that is NOT\n  486 |                     // - followed by a restart marker (D0 - D7) or \n  487 |                     // - a data FF (followed by 00)\n  488 | \n  489 |                     // So, start by skipping the SOS segment\n  490 |                     cursor.seek(SeekFrom::Current(remaining_length as i64))?;\n  491 | \n  492 |                     // And skip the ECS\n  493 |                     skip_ecs(cursor)?;\n  494 |                 }\n  495 | \n  496 |                 _ => {                                                          // Every other marker\n  497 |                     // Skip this segment\n  498 |                     cursor.seek(SeekFrom::Current(remaining_length as i64))?;\n  499 |                 },","lines":44,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/jpg.rs#L456-L499"},{"ref":"src/jpg.rs:122-242","code":"  122 |     loop\n  123 |     {\n  124 |         // Read next byte into buffer\n  125 |         if let Err(e) = cursor.read_exact(&mut byte_buffer)\n  126 |         {\n  127 |             if e.kind() == std::io::ErrorKind::UnexpectedEof\n  128 |             {\n  129 |                 // Reached end of file without encountering EOI marker 0xd9\n  130 |                 // See issue #93 for examples where this happens\n  131 |                 return Ok(());\n  132 |             }\n  133 |             else\n  134 |             {\n  135 |                 return Err(e);\n  136 |             }\n  137 |         }\n  138 | \n  139 |         if previous_byte_was_marker_prefix\n  140 |         {\n  141 |             // Check if this is the end of the file. In that case, the length\n  142 |             // data can't be read and we need to return prematurely. \n  143 |             if byte_buffer[0] == 0xd9                                           // EOI marker\n  144 |             {\n  145 |                 // No more data to read in\n  146 |                 return Ok(());\n  147 |             }\n  148 | \n  149 |             // Read in the length of the segment\n  150 |             // (which follows immediately after the marker)\n  151 |             let mut length_buffer = [0u8; 2];\n  152 |             cursor.read_exact(&mut length_buffer)?;\n  153 | \n  154 |             // Decode the length to determine how much more data there is\n  155 |             let length = from_u8_vec_res_macro!(u16, &length_buffer, &Endian::Big)?;\n  156 |             let remaining_length = (length - 2) as usize;\n  157 | \n  158 |             if byte_buffer[0] == segment_marker                                 // Given marker, e.g. for APP1\n  159 |             {\n  160 |                 // Backup current position, account for the 4 bytes already read\n  161 |                 let backup_position = cursor.position() - 4;\n  162 | \n  163 |                 let mut do_not_delete_segment_override = false;\n  164 | \n  165 |                 // If we are given prefix bytes to check for, read them in\n  166 |                 if let Some(prefix) = prefix_bytes\n  167 |                 {\n  168 |                     let mut prefix_buffer = vec![0u8; prefix.len()];\n  169 |                     cursor.read_exact(&mut prefix_buffer)?;\n  170 |                     cursor.seek(SeekFrom::Current(-(prefix_buffer.len() as i64)))?;\n  171 | \n  172 |                     // We are given a prefix but don't know yet if it matches\n  173 |                     // So set the override to true for now as we mi {"id":"ERR_13","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"read_chunk_name does String::from_utf8(field).unwrap_or_default(), turning a non-UTF8 / non-ASCII chunk name into an empty string instead of an error. The empty name then flows into CRC input and chunk matching; a chunk with a non-ASCII name silently becomes the UNKNOWN(\"\") chunk and the as_string()==\"IEND\" loop-termination check can never match it, but more subtly two distinct malformed chunk names both collapse to \"\".","fix":"PNG chunk type codes are restricted to ASCII letters; validate the 4 bytes are in [A-Za-z] and return an io_error otherwise rather than silently producing an empty name.","locations":[{"ref":"src/png/read.rs:37-39","code":"   37 |     let field = read_4_bytes(cursor)?;\n   38 |     let name  = String::from_utf8(field.to_vec()).unwrap_or_default();\n   39 |     return Ok(name);","lines":3,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/png/read.rs#L37-L39"}]},
{"id":"ERR_14","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"get_next_chunk distinguishes 'could not read 8 bytes' (UnexpectedEof, used by callers to detect end-of-chunks) from a successful read, but read() may return a short read without being EOF for some Read implementations; the code treats any bytes_read != 8 as UnexpectedEof and any bytes_read != chunk_length as a generic Other error. Using read instead of read_exact means a partial read of the payload that is not at true EOF yields a confusing 'Could not read RIFF chunk data' error and aborts parsing.","fix":"Use read_exact for the fixed 8-byte header and the known-length payload, mapping its UnexpectedEof to the end-of-chunks signal explicitly.","locations":[{"ref":"src/webp/file.rs:69-94","code":"   69 |     let mut chunk_start = [0u8; 8];\n   70 |     let mut bytes_read = file.read(&mut chunk_start)?;\n   71 | \n   72 |     // Check that indeed 8 bytes were read\n   73 |     if bytes_read != 8\n   74 |     {\n   75 |         return io_error!(UnexpectedEof, \"Could not read start of chunk\");\n   76 |     }\n   77 | \n   78 |     // Construct name of chunk and its length\n   79 |     let chunk_name = String::from_utf8(chunk_start[0..4].to_vec());\n   80 |     let mut chunk_length = from_u8_vec_res_macro!(u32, &chunk_start[4..8], &Endian::Little)?;\n   81 | \n   82 |     // Account for the possible padding byte\n   83 |     chunk_length += chunk_length % 2;\n   84 | \n   85 |     // Read RIFF chunk data\n   86 |     let mut chunk_data_buffer = vec![0u8; chunk_length as usize];\n   87 |     bytes_read = file.read(&mut chunk_data_buffer)?;\n   88 |     if bytes_read != chunk_length as usize\n   89 |     {\n   90 |         return io_error!(\n   91 |             Other, \n   92 |             format!(\"Could not read RIFF chunk data! Expected {chunk_length} bytes but read {bytes_read}\")\n   93 |         );\n   94 |     }","lines":26,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/webp/file.rs#L69-L94"},{"ref":"src/webp/vec.rs:57-84","code":"   57 |     // Read the start of the chunk\n   58 |     let mut chunk_start = [0u8; 8];\n   59 | \n   60 |     let mut bytes_read = cursor.read(&mut chunk_start)?;\n   61 | \n   62 |     // Check that indeed 8 bytes were read\n   63 |     if bytes_read != 8\n   64 |     {\n   65 |         return io_error!(UnexpectedEof, \"Could not read start of chunk\");\n   66 |     }\n   67 | \n   68 |     // Construct name of chunk and its length\n   69 |     let chunk_name = String::from_utf8(chunk_start[0..4].to_vec());\n   70 |     let mut chunk_length = from_u8_vec_res_macro!(u32, &chunk_start[4..8], &Endian::Little)?;\n   71 | \n   72 |     // Account for the possible padding byte\n   73 |     chunk_length += chunk_length % 2;\n   74 | \n   75 |     // Read RIFF chunk data\n   76 |     let mut chunk_data_buffer = vec![0u8; chunk_length as usize];\n   77 |     bytes_read = cursor.read(&mut chunk_data_buffer)?;\n   78 |     if bytes_read != chunk_length as usize\n   79 |     {\n   80 |         return io_error!(\n   81 |             Other, \n   82 |             format!(\"Could not read RIFF chunk data! Expected {chunk_length} bytes but read {bytes_read}\")\n   83 |         );\n   84 |     }","lines":28,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/webp/vec.rs#L57-L84"}]},
{"id":"ERR_15","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In remove_exif_from_xmp the Err(error_message) arm logs the error and breaks the loop, then the function still returns Ok(writer....). Thus a genuine XML parse error is swallowed and the caller receives a (likely truncated) success result with no indication that parsing failed. For a function operating on untrusted data this hides corruption.","fix":"Return Err on a parse error (propagate error_message) instead of break + Ok, or at minimum surface a distinct error to the caller.","locations":[{"ref":"src/xmp.rs:104-117","code":"  104 |             Err(error_message) => {\n  105 |                 log::error!(\n  106 |                     \"Error at position {}: {:?}\", \n  107 |                     reader.buffer_position(), \n  108 |                     error_message\n  109 |                 );\n  110 |                 break;\n  111 |             }\n  112 |         };\n  113 | \n  114 |         read_buffer.clear();\n  115 |     }\n  116 | \n  117 |     return Ok(writer.into_inner().into_inner());","lines":14,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/xmp.rs#L104-L117"}]},

{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"`create_ifd` calls `self.sort_data()` after every push, and `set_tag` -> `get_ifd_mut` -> `create_ifd` is the common write path. Each `sort_data` is an O(n log n) sort of all IFDs and is triggered per IFD creation; setting many tags that create IFDs repeatedly re-sorts. Additionally `get_ifd_mut` performs a linear `any` scan then a second linear `find` scan for the same predicate.","fix":"Sort lazily (once before encode) or insert in sorted position. In `get_ifd_mut`, avoid the double scan by using `position`/`iter_mut().find` once, creating only if not found.","locations":[{"ref":"src/metadata/mod.rs:76-78","code":"   76 |         self.image_file_directories.push(new_ifd);\n   77 |         self.sort_data();\n   78 |     }","lines":3,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/metadata/mod.rs#L76-L78"},{"ref":"src/metadata/get.rs:92-104","code":"   92 |         if !self.image_file_directories.iter().any(|ifd| \n   93 |             ifd.get_generic_ifd_nr() == generic_ifd_nr &&\n   94 |             ifd.get_ifd_type()       == group\n   95 |         )\n   96 |         {\n   97 |             self.create_ifd(group, generic_ifd_nr);\n   98 |         }\n   99 | \n  100 |         return self.image_file_directories.iter_mut().find(|ifd| \n  101 |             ifd.get_generic_ifd_nr() == generic_ifd_nr &&\n  102 |             ifd.get_ifd_type()       == group\n  103 |         ).expect(\"Item should be already created above\");\n  104 |     }","lines":13,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/metadata/get.rs#L92-L104"}]},

{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"create_new_item_location_entry and create_new_item_info_entry compute the box size delta by fully serializing the box (allocating a throwaway Vec) just to read its length. For large iloc/iinf boxes this is an O(n) allocation per insert. The code itself flags this with a TODO.","fix":"Compute the byte size of the single added entry directly from field sizes instead of serializing the entire box.","locations":[{"ref":"src/heif/boxes/item_location.rs:409-417","code":"  409 |         // needed, not by actually serializing (and thus, allocating memory)\n  410 |         let old_box_size = self.header.get_box_size();\n  411 |         let new_box_size = self.serialize().len() as u64;\n  412 |         self.header.set_box_size(new_box_size);\n  413 | \n  414 |         return (\n  415 |             self.items.last_mut().expect(\"No items present after insertion\").item_id,\n  416 |             new_box_size - old_box_size\n  417 |         );","lines":9,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/heif/boxes/item_location.rs#L409-L417"},{"ref":"src/heif/boxes/item_info.rs:172-179","code":"  172 |         // be adjusted as well\n  173 |         // TODO: make this more efficient by only computing how much memory is\n  174 |         // needed, not by actually serializing (and thus, allocating memory)\n  175 |         let old_box_size = self.header.get_box_size();\n  176 |         let new_box_size = self.serialize().len() as u64;\n  177 |         self.header.set_box_size(new_box_size);\n  178 | \n  179 |         return new_box_size - old_box_size;","lines":8,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/heif/boxes/item_info.rs#L172-L179"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"jxl::clear_metadata allocates three short Vecs per box iteration via `.to_vec()` (length_buffer, type_buffer, and the 4-byte BROB probe wrapped in a Cursor) purely to feed from_u8_vec_res_macro and box_contains_exif. These copies are unnecessary; the bytes can be read directly from fixed-size arrays / slices.","fix":"Decode length from a &[u8;4] slice without allocating, and pass type bytes by reference; avoid the per-iteration Cursor::new(...to_vec()).","locations":[{"ref":"src/jxl.rs:145-155","code":"  145 |         let length_buffer = file_buffer[position..position+4].to_vec();\n  146 |         let length        = from_u8_vec_res_macro!(u32, &length_buffer, &Endian::Big)? as usize;\n  147 | \n  148 |         // Next, read the box type\n  149 |         let type_buffer = file_buffer[position+4..position+8].to_vec();\n  150 | \n  151 |         if box_contains_exif(\n  152 |             &mut Cursor::new(\n  153 |                 file_buffer[position+8..position+12].to_vec()\n  154 |             ), \n  155 |             [type_buffer[0], type_buffer[1], type_buffer[2], type_buffer[3]]","lines":11,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/jxl.rs#L145-L155"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`remove_tag_by_hex_group` iterates `0..=get_max_generic_ifd_number()` and for each number calls `get_ifd` (linear scan) then `get_ifd_mut` (which itself does two more linear scans, and would CREATE the IFD if it were missing - though here guarded by the prior `is_some`). This is O(max_ifd_nr * ifds) with redundant lookups. `removed_count` counts IFDs touched, not tags actually removed, so the documented 'count of removals' is misleading (it increments even if the tag was not present in that IFD).","fix":"Iterate `image_file_directories` directly filtering by group, call `remove_tag` and accumulate the actual removed count returned by it (if available). Fix the doc to match what is counted.","locations":[{"ref":"src/metadata/set.rs:64-81","code":"   64 | \t\tlet mut removed_count = 0;\n   65 | \n   66 | \t\t// Traverse all IFD numbers up to the max. known one\n   67 | \t\tfor ifd_number in 0..=self.get_max_generic_ifd_number()\n   68 | \t\t{\n   69 | \t\t\t// Does this IFD exist?\n   70 | \t\t\tif self.get_ifd(tag_group, ifd_number).is_some()\n   71 | \t\t\t{\n   72 | \t\t\t\t// If so, get it as mutable and call remove_tag on it\n   73 | \t\t\t\tself.get_ifd_mut(\n   74 | \t\t\t\t\ttag_group, ifd_number\n   75 | \t\t\t\t).remove_tag(tag_hex);\n   76 | \n   77 | \t\t\t\tremoved_count += 1;\n   78 | \t\t\t}\n   79 | \t\t}\n   80 | \n   81 | \t\treturn removed_count;","lines":18,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/metadata/set.rs#L64-L81"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"Both generic_parse_png and clear_metadata/generic_read_metadata are called in sequence over the same buffer: read/clear/write each call vec_parse_png (full parse + per-chunk CRC computation) and then re-scan the chunks. write_metadata calls clear_metadata (which parses) and then generic_write_metadata calls generic_parse_png again - the PNG is fully parsed and CRC-checked at least twice per write. For large files this doubles the CRC work.","fix":"Reuse the parse result from clear_metadata in generic_write_metadata instead of re-parsing, or pass the already-parsed chunk list through.","locations":[{"ref":"src/png/mod.rs:556-574","code":"  556 | pub(crate) fn\n  557 | write_metadata\n  558 | (\n  559 |     file_buffer: &mut Vec<u8>,\n  560 |     metadata:    &Metadata\n  561 | )\n  562 | -> Result<(), std::io::Error>\n  563 | {\n  564 |     // First clear the existing metadata\n  565 |     // This also parses the PNG and checks its validity, so it is safe to\n  566 |     // assume that is, in fact, a usable PNG file\n  567 |     clear_metadata(file_buffer)?;\n  568 | \n  569 |     // Parsed PNG is Ok to use - Create a cursor for writing\n  570 |     let mut cursor = Cursor::new(file_buffer);\n  571 | \n  572 |     // Call the generic write function\n  573 |     return generic_write_metadata(&mut cursor, metadata);\n  574 | }","lines":19,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/png/mod.rs#L556-L574"},{"ref":"src/png/mod.rs:656-673","code":"  656 | #[allow(non_snake_case)]\n  657 | fn\n  658 | generic_write_metadata\n  659 | <T: Seek + Read + Write>\n  660 | (\n  661 |     cursor:     &mut T,\n  662 |     metadata:   &Metadata\n  663 | )\n  664 | -> Result<(), std::io::Error>\n  665 | {\n  666 |     cursor.seek(SeekFrom::Start(8))?;\n  667 | \n  668 |     let mut IHDR_length = 0u32;\n  669 | \n {"id":"PERF_7","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"decode_metadata_png builds a 2-char String per byte via \"\".to_owned() + &(char).to_string() + ... then u8::from_str_radix on it, for every byte of the (potentially large) decoded EXIF blob. This allocates several Strings per input byte. The same pattern reappears for the size info. encode_byte already produces hex nibbles directly.","fix":"Convert the two ASCII hex digits to a nibble arithmetically (e.g. match on b'0'..=b'9' / b'a'..=b'f') without allocating Strings.","locations":[{"ref":"src/png/mod.rs:773-783","code":"  773 |         let value_string = \"\".to_owned()\n  774 |             + &(other_byte as char).to_string()\n  775 |             + &(*byte as char).to_string();\n  776 | \n  777 |         if let Ok(value) = u8::from_str_radix(value_string.trim(), 16)\n  778 |         {\n  779 |             exif_all.push_back(value);\n  780 |         }\n  781 | \n  782 |         opt_other_byte = None;\n  783 |     }","lines":11,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/png/mod.rs#L773-L783"},{"ref":"src/png/mod.rs:877-891","code":"  877 |         let re_encoded_byte = encode_byte(&pop_storage[pop_storage.len() -1 -i]);\n  878 |         let tens_place = match (re_encoded_byte[0] as char).to_string().parse::<u64>()\n  879 |         {\n  880 |             Ok(value) => value,\n  881 |             Err(_)    => return io_error!(Other, \"Mangled EXIF size info\"),\n  882 |         };\n  883 |         let ones_place = match (re_encoded_byte[1] as char).to_string().parse::<u64>()\n  884 |         {\n  885 |             Ok(value) => value,\n  886 |             Err(_)    => return io_error!(Other, \"Mangled EXIF size info\"),\n  887 |         };\n  888 |         // (2*i) is small and fits into u32 safely\n  889 |         given_exif_len += tens_place * 10 * 10_u64.pow((2 * i) as u32);\n  890 |         given_exif_len += ones_place *  1 * 10_u64.pow((2 * i) as u32);\n  891 |     }","lines":15,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/png/mod.rs#L877-L891"}]},
{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"build_vec_u8conversion's from_u8_vec_res allocates an intermediate Vec for every element via &u8_vec[..].to_vec() before passing it to the conversion, and from_u8_vec then re-borrows it as a slice. For a tag with many array elements this is one heap allocation per element, entirely avoidable since from_u8_vec_res already takes &[u8].","fix":"Pass the slice directly: <$type>::from_u8_vec_res(&u8_vec[i*N..(i+1)*N], endian)? without .to_vec().","locations":[{"ref":"src/u8conversion.rs:291-296","code":"  291 |                     result.push(\n  292 |                         <$type>::from_u8_vec(\n  293 |                             &u8_vec[(0 + i*$number_of_bytes)..((i+1)*$number_of_bytes)].to_vec(), \n  294 |                             endian\n  295 |                     ) as $type);\n  296 |                 }","lines":6,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/u8conversion.rs#L291-L296"}]},
{"id":"PERF_9","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"Throughout both files, chunk type comparisons repeatedly allocate via header().to_lowercase() and constant .to_lowercase() on every loop iteration (e.g. EXIF_CHUNK_HEADER.to_lowercase() and VP8X_HEADER.to_lowercase() recomputed each iteration). header() itself clones the String each call. These allocations occur per-chunk in hot parse/clear/write loops.","fix":"fourCC values are ASCII and case is fixed by the spec; compare bytes case-insensitively without allocating, precompute lowercase constants once, and avoid cloning the String in header() (return &str).","locations":[{"ref":"src/webp/file.rs:605","code":"  605 |         if parsed_chunk.header().to_lowercase() != EXIF_CHUNK_HEADER.to_lowercase()","lines":1,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/webp/file.rs#L605"},{"ref":"src/webp/vec.rs:562","code":"  562 |         if parsed_chunk.header().to_lowercase() != EXIF_CHUNK_HEADER.to_lowercase()","lines":1,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/webp/vec.rs#L562"},{"ref":"src/webp/riff_chunk.rs:42-50","code":"   42 |     pub fn\n   43 |     header\n   44 |     (\n   45 |         &self\n   46 |     )\n   47 |     -> String\n   48 |     {\n   49 |         self.fourCC.clone()\n   50 |     }","lines":9,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/webp/riff_chunk.rs#L42-L50"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"`general_decoding_wrapper` contains unreachable `else` branches that return 'Unreachable code reached' errors. The preceding `if let Ok(...)` / `else if let Err(...)` already exhaustively cover a `Result`, so the trailing `else` arms (lines 103-106 and 113-116) are dead and the compiler-required exhaustiveness is already satisfied by the two Result arms. This is misleading dead code.","fix":"Replace the nested if-let/else-if-let/else with a plain `match raw_pre_decode_general { Ok(...) => ..., Err(...) => ... }`, removing the impossible else arms.","locations":[{"ref":"src/metadata/mod.rs:88-117","code":"   88 |         if let Ok(pre_decode_general) = raw_pre_decode_general\n   89 |         {\n   90 |             let mut pre_decode_cursor = Cursor::new(&pre_decode_general);\n   91 |             let     decoding_result   = Self::decode(&mut pre_decode_cursor);\n   92 |             if let Ok((endian, image_file_directories)) = decoding_result\n   93 |             {\n   94 |                 let mut data = Metadata { endian, image_file_directories };\n   95 |                 data.sort_data();\n   96 |                 return Ok(data);\n   97 |             }\n   98 |             else if let Err(decode_error) = decoding_result\n   99 |             {\n  100 |                 log::error!(\"Error during decoding (1): {decode_error}\");\n  101 |                 return Err(decode_error);\n  102 |             }\n  103 |             else\n  104 |             {\n  105 |                 return io_error!(Other, \"Unreachable code reached in Metadata::general_decoding_wrapper (1)\");\n  106 |             }\n  107 |         }\n  108 |         else if let Err(decode_error) = raw_pre_decode_general\n  109 |         {\n  110 |             log::error!(\"Error during decoding (2): {decode_error:?}\");\n  111 |             return Err(decode_error);\n  112 |         }\n  113 |
