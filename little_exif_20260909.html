{"id":"OVF_14","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"In encode_ifd the entry-count and offset advancement `*current_offset += 2 + IFD_ENTRY_LENGTH * count_entries as u32 + ...` and the per-strip/thumbnail `*current_offset += strip.len() as u32 / thumbnail_data.len() as u32` are all unchecked u32 arithmetic. With many/large tags or large strip/thumbnail data these can overflow u32, silently producing wrong offsets (corrupt EXIF) in release builds or panicking in debug.","fix":"Use checked_add/checked_mul on current_offset updates and return an io_error when the total EXIF size would exceed u32 range.","locations":[{"ref":"src/ifd/mod.rs:525-529","code":"  525 |         *current_offset += 0\n  526 |             + 2                                                                 // length of entry count section\n  527 |             + IFD_ENTRY_LENGTH * count_entries as u32\n  528 |             + IFD_END_NO_LINK.len()            as u32\n  529 |         ;","lines":5,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/ifd/mod.rs#L525-L529"},{"ref":"src/ifd/mod.rs:572","code":"  572 |                                 *current_offset += strip.len() as u32;","lines":1,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/ifd/mod.rs#L572"},{"ref":"src/ifd/mod.rs:580","code":"  580 |                             *current_offset += thumbnail_data.len() as u32;","lines":1,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/ifd/mod.rs#L580"},{"ref":"src/ifd/mod.rs:655","code":"  655 |                 *current_offset += byte_count;","lines":1,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/ifd/mod.rs#L655"}]},
{"id":"OVF_15","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"encode_metadata_jpg computes the APP1 length as `2u16 + EXIF_HEADER.len() as u16 + exif_vec.len() as u16`. Both the cast to u16 and the addition silently truncate/overflow when the EXIF payload approaches or exceeds 64 KiB (the JPEG segment limit). Large metadata thus produces a bogus length field and a structurally corrupt JPG instead of a clear error. JPEG cannot store EXIF larger than ~65533 bytes; this should be detected and rejected.","fix":"Compute the length in usize, verify it fits in u16 (<= 0xFFFF), and return an io_error if the EXIF data is too large for a single APP1 segment.","locations":[{"ref":"src/jpg.rs:37","code":"   37 |     let length = 2u16 + (EXIF_HEADER.len() as u16) + (exif_vec.len() as u16);","lines":1,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/jpg.rs#L37"}]},
{"id":"OVF_16","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"jxl::write_metadata computes `jxlc_box_length = file_buffer.len() as u32 + 8`. For codestreams >= 4 GiB - 8 the `as u32` cast truncates and the `+ 8` can overflow, writing a wrong box size into the new ISO BMFF container and silently corrupting output. Box sizes that don't fit in 32 bits require the 64-bit largesize form, which is not handled.","fix":"Compute the length in u64, verify it fits in u32 (or emit the 64-bit largesize box form), and error out / handle the large case explicitly.","locations":[{"ref":"src/jxl.rs:473-474","code":"  473 |         let jxlc_box_length = file_buffer.len() as u32 + 8;\n  474 |         new_file_buffer.extend(to_u8_vec_macro!(u32, &jxlc_box_length, &Endian::Big));","lines":2,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/jxl.rs#L473-L474"}]},
{"id":"OVF_17","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"add_next_fraction_term computes term * convergent.nominator + previous_convergent.nominator (and same for denominator) on u32 with no overflow protection. f64_to_rational64u feeds it continued_fraction_term as u32 and convergent values; the loop's n-clamping at lines 142-149 is intended to keep products in range, but the semiconvergent branch at line 170 calls add_next_fraction_term(&n, ...) after n may have been reassigned to continued_fraction_term as u32 (line 167) without re-checking the multiplication bound, so term*nominator can overflow. In debug builds this panics; in release it silently wraps and yields a garbage rational. Reachable from public From<f64>/From<u32> conversions with crafted input values.","fix":"Use checked_mul/checked_add (or saturating_*) in add_next_fraction_term and bail out / clamp when an overflow would occur, including in the semiconvergent path.","locations":[{"ref":"src/rational.rs:43-55","code":"   43 | fn add_next_fraction_term\n   44 | (\n   45 |     term:                &u32,\n   46 |     convergent:          &uR64,\n   47 |     previous_convergent: &uR64,\n   48 | )\n   49 | -> uR64\n   50 | {\n   51 |     return uR64 {\n   52 |         nominator:   term * convergent.nominator   + previous_convergent.nominator,\n   53 |         denominator: term * convergent.denominator + previous_convergent.denominator\n   54 |     };\n   55 | }","lines":13,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/rational.rs#L43-L55"},{"ref":"src/rational.rs:163-181","code":"  163 |     if n as f64 >= lower_bound\n  164 |     {\n  165 |         if n as f64 > continued_fraction_term \n  166 |         { \n  167 |             n = continued_fraction_term as u32; \n  168 |         }\n  169 | \n  170 |         let semiconvergent = add_next_fraction_term(&n, &convergent, &previous_convergent);\n  171 | \n  172 |         if \n  173 |             (n as f64 > lower_bound)\n  174 |             || \n  175 |             (\n  176 |                 (real_number - rational64u_to_f64(&semiconvergent)).abs()\n  177 |                 < (real_number - rational64u_to_f64(&convergent)).abs()\n  178 |             )\n  179 |         {\n  180 |             best_approximation = semiconvergent;\n  181 |         }","lines":19,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/rational.rs#L163-L181"}]},
{"id":"OVF_18","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"f64_to_rational64u casts continued_fraction_term (a finite but possibly very large f64 from reciprocal_residual.floor()) to u32 at line 122 and line 153/167. Float-to-int `as` casts saturate in Rust, but combined with the multiplication in add_next_fraction_term this still produces wrong rationals. Separately, line 89 in f64_to_rational64s does `0 - best_approximation.nominator as i32`: if nominator exceeds i32::MAX (it is a u32 and the large-value guard at line 113-116 stores i32::MAX as u32, which is fine, but a gcd-reduced value from the loop could in principle exceed i32::MAX), the cast wraps to negative and the negation overflows. The negative-number handling is fragile.","fix":"Compute the magnitude as u32, validate it fits in i32::MAX, then apply the sign with checked arithmetic; e.g. let mag = best_approximation.nominator.min(i32::MAX as u32) as i32; nominator = if real_number < 0.0 { -mag } else { mag }.","locations":[{"ref":"src/rational.rs:86-94","code":"   86 |     let best_approximation = f64_to_rational64u(real_number);\n   87 |     return iR64 {\n   88 |         nominator: if real_number < 0.0 \n   89 |             { 0-best_approximation.nominator as i32 } \n   90 |         else \n   91 |             { best_approximation.nominator as i32 },\n   92 |         denominator: best_approximation.denominator as i32\n   93 |     };\n   94 | }","lines":9,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/rational.rs#L86-L94"},{"ref":"src/rational.rs:113-122","code":"  113 |     if real_number > u32::MAX as f64 - 0.5\n  114 |     {\n  115 |         return uR64 { nominator: i32::MAX as u32, denominator: 1};\n  116 |     }\n  117 | \n  118 |     let mut reciprocal_residual     = real_number;\n  119 |     let mut continued_fraction_term = real_number.floor();\n  120 | \n  121 |     let mut previous_convergent = uR64 { nominator: 1u32,                           denominator: 0u32 };\n  122 |     let mut convergent          = uR64 { nominator: continued_fraction_term as u32, denominator: 1u32 };","lines":10,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/rational.rs#L113-L122"}]},
{"id":"OVF_19","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"Multiple `(x as i64 + delta) as u64` casts assume the result is non-negative. If delta (which derives from new metadata length minus old length) is sufficiently negative relative to extent_offset/base_offset/box_size, the i64 result is negative and the `as u64` cast wraps to a huge value, silently corrupting offsets/sizes rather than erroring.","fix":"Compute with checked/try_from conversions and return an error if a value would go negative.","locations":[{"ref":"src/heif/container.rs:481-484","code":"  481 |                 let new_ext_len = (\n  482 |                     first_extent.extent_length as i64\n  483 |                     + delta\n  484 |                 ) as u64;","lines":4,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/heif/container.rs#L481-L484"},{"ref":"src/heif/container.rs:527","code":"  527 |                     item.base_offset = (item.base_offset as i64 + delta) as u64;","lines":1,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/heif/container.rs#L527"},{"ref":"src/heif/container.rs:540","code":"  540 |                     extent.extent_offset = (extent.extent_offset as i64 + delta) as u64;","lines":1,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/heif/container.rs#L540"},{"ref":"src/heif/container.rs:570","code":"  570 |                 let new_size = (iso_box.get_header().get_box_size() as i64 + delta) as u64;","lines":1,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/heif/container.rs#L570"},{"ref":"src/heif/boxes/item_location.rs:458","code":"  458 |                 extent.extent_offset = (extent.extent_offset as i64 + value) as u64;","lines":1,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/heif/boxes/item_location.rs#L458"}]},
{"id":"OVF_20","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"The small-value (<=4 bytes) branch pads to 4 bytes with `for _ in 0..(4-(post_length - pre_length))`. This relies on byte_count <= 4 and on value+string_padding never exceeding 4 bytes. If those invariants are violated (e.g. via the string padding path or a mismatched number_of_components vs value length) the subtraction underflows usize and the loop count becomes enormous, hanging/panicking.","fix":"Compute the written length explicitly and use saturating_sub, or assert the area is <= 4 and return an error otherwise rather than relying on an unchecked subtraction.","locations":[{"ref":"src/ifd/mod.rs:672-674","code":"  672 |                 for _ in 0..(4-(post_length - pre_length) ) {\n  673 |                     encode_vec.push(0x00);\n  674 |                 }","lines":3,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/ifd/mod.rs#L672-L674"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"read_box_header reads the FullBox version/flags (4 bytes) BEFORE reading the 64-bit largesize, but in ISO BMFF the largesize field immediately follows the type field and precedes the box body (version/flags are part of the body). For any full box that uses size==1 largesize encoding (e.g. a large meta/iloc), the 4 version/flags bytes are taken from the wrong position and the largesize is then read from body bytes, corrupting all subsequent parsing.","fix":"Read the largesize (the `box_size == 1` branch) immediately after reading box_type, then read version/flags for full boxes after that.","locations":[{"ref":"src/heif/box_header.rs:112-145","code":"  112 |         if box_type.extends_fullbox()\n  113 |         {\n  114 |             header.version = Some(read_1_bytes(cursor)?[0]);\n  115 |             header.flags   = Some(read_3_bytes(cursor)?);\n  116 | \n  117 |             // Adjust header size information\n  118 |             header.header_size += 4;\n  119 |         }\n  120 | \n  121 |         // Uses largesize box size\n  122 |         if header.box_size == 1\n  123 |         { \n  124 |             header.box_size  = read_be_u64(cursor)?;\n  125 |             header.largesize = true;\n  126 | \n  127 |             // Can't process boxes that are truly larger than u32::MAX on \n  128 |             // 32-bit systems\n  129 |             if usize::BITS == u32::BITS && header.box_size > u32::MAX as u64\n  130 |             {\n  131 |                 return io_error!(\n  132 |                     Unsupported,\n  133 |                     format!(\n  134 |                         \"Box size {} exceeds maximum supported size on 32-bit systems\",\n  135 |                         header.box_size\n  136 |                     )\n  137 |                 );\n  138 |             }\n  139 |             {\n  140 | \n  141 |             }\n  142 | \n  143 |             // Adjust header size information\n  144 |             header.header_size += 8;\n  145 |         }","lines":34,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/heif/box_header.rs#L112-L145"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`GetTagIterator::next` only advances `current_ifd_index` (skipping to the next IFD) when the group filter does not match the CURRENT ifd. But when the group matches, it iterates that IFD's tags; once exhausted it resets and increments the IFD index - and on the next IFD, if the group filter does not match, it does `continue` WITHOUT resetting `current_tag_index`. Because `current_tag_index` was just reset to 0 in the else branch this happens to be fine, but the group check at the top runs every iteration including mid-tag-scan: if `group` is Some and matches, fine; if a later same-numbered IFD of a different group appears, the index bookkeeping relies on the reset path. More concretely: when the group check fails it increments the ifd index but leaves `current_tag_index` at its current (possibly non-zero) value from a prior matching IFD, so the first tags of the newly selected IFD can be skipped. Tags can be silently missed when a non-matching-group IFD follows a matching one mid-scan.","fix":"When skipping an IFD due to group mismatch, also reset `current_tag_index = 0` before `continue`, mirroring the else branch.","locations":[{"ref":"src/metadata/get.rs:168-197","code":"  168 |         while self.current_ifd_index < self.metadata.image_file_directories.len()\n  169 |         {\n  170 |             // First: Check the group, assuming it is provided\n  171 |             if let Some(given_group) = self.group\n  172 |             {\n  173 |                 if given_group != self.metadata.image_file_directories[self.current_ifd_index].get_ifd_type()\n  174 |                 {\n  175 |                     self.current_ifd_index += 1;\n  176 |                     continue;\n  177 |                 }\n  178 |             }\n  179 | \n  180 |             // Check the current tag\n  181 |             // - If it is wrong, increment the tag index\n  182 |             // - If we can't access that tag, increment IFD index and reset tag index\n  183 |             if self.current_tag_index < self.metadata.image_file_directories[self.current_ifd_index].get_tags().len()\n  184 |             {\n  185 |                 self.current_tag_index += 1;\n  186 | \n  187 |                 if self.metadata.image_file_directories[self.current_ifd_index].get_tags()[self.current_tag_index-1].as_u16() == self.tag_hex_value\n  188 |                 {\n  189 |                     return Some(&self.metadata.image_file_directories[self.current_ifd_index].get_tags()[self.current_tag_index-1]);\n  190 |                 }\n  191 |             }\n  192 |             else\n  193 |             {\n  194 |                 self.current_tag_index  = 0;\n  195 |                 self.current_ifd_index += 1;\n  196 |             }\n  197 |         }","lines":30,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/metadata/get.rs#L168-L197"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"parse_webp termination relies on parsed_length == expected_length to break the loop (exact equality). The chunk_descriptor.len() used to increment parsed_length is the padded length (padding already folded in at get_next_chunk), but the increment adds 4 + 4 + len without itself re-adding padding, so accounting may drift; more importantly, exact-equality means if the chunks never sum to exactly expected_length (trailing/garbage bytes, or off-by-padding), the loop never breaks via this condition and instead keeps reading until get_next_chunk hits EOF. Combined with attacker-chosen sizes this can cause silent mis-parse rather than a clean error.","fix":"Break when parsed_length >= expected_length and return an error if it overshoots, rather than requiring exact equality.","locations":[{"ref":"src/webp/file.rs:162-171","code":"  162 |             parsed_length += 4u64 + 4u64 + chunk_descriptor.len() as u64;\n  163 | \n  164 |             // Add the chunk descriptor\n  165 |             chunks.push(chunk_descriptor);\n  166 |             \n  167 |             if parsed_length == expected_length\n  168 |             {\n  169 |                 // In this case we don't expect any more data to be in the file\n  170 |                 break;\n  171 |             }","lines":10,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/webp/file.rs#L162-L171"},{"ref":"src/webp/vec.rs:152-161","code":"  152 |             parsed_length += 4 + 4 + chunk_descriptor.len();\n  153 | \n  154 |             // Add the chunk descriptor\n  155 |             chunks.push(chunk_descriptor);\n  156 |             \n  157 |             if parsed_length == expected_length\n  158 |             {\n  159 |                 // In this case we don't expect any more data to be in the file\n  160 |                 break;\n  161 |             }\t\t\t","lines":10,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/webp/vec.rs#L152-L161"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`FileExtension::auto_detect` reads up to 32 bytes with a single `cursor.read` and matches fixed prefixes, but `read` may return fewer bytes than requested even when more data exists (short reads are legal for any Reader, and the cursor is later reused). For HEIF/JXL/WebP signatures that need up to 12 bytes, a short read filling only e.g. 8 bytes leaves the tail of `buffer` as zeros from initialization, which could both miss a real signature and (because the buffer is zero-padded) accidentally match a pattern that uses `_` wildcards for the unread region. Also, after `auto_detect` consumes bytes from a file handle in `new_from_path`, the same handle position is advanced and the subsequent format reader re-opens the path, so it works there - but callers passing a non-seeking-reset cursor get a consumed stream.","fix":"Use `read_exact` into a sized buffer guarded by available length, or loop to fill the buffer; only match patterns whose required length is <= bytes actually read (n).","locations":[{"ref":"src/filetype.rs:38-47","code":"   38 |         // Read first few bytes (32 bytes because I don't know any better)\n   39 |         let mut buffer = [0; 32];\n   40 |         let Ok(n) = cursor.read(&mut buffer) else {\n   41 |             return None;\n   42 |         };\n   43 | \n   44 |         if n < 4\n   45 |         {\n   46 |             return None;\n   47 |         }","lines":10,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/filetype.rs#L38-L47"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"get_exif_data_pos_and_len requires exactly one extent (`exif_extents.len() != 1` -> error) but reads only `exif_extents.first()`. For a valid EXIF item legitimately split across multiple extents the function errors out; more importantly the FILE-method branch ignores extents beyond the first while having already rejected multi-extent, so the single-extent assumption is duplicated and brittle across get_exif_data_pos_and_len, generic_write_metadata, and the assert at line 473.","fix":"Centralize the single-extent EXIF assumption in one validated helper returning a Result, and reuse it instead of repeating ad-hoc checks/asserts.","locations":[{"ref":"src/heif/container.rs:166-193","code":"  166 |         let exif_extents = &exif_item.extents;\n  167 |         if exif_extents.len() != 1 \n  168 |         {\n  169 |             return io_error!(Other, \"Expected exactly one EXIF extent info entry\");\n  170 |         }\n  171 | \n  172 |         match exif_item.get_construction_method()\n  173 |         {\n  174 |             super::boxes::item_location::ItemConstructionMethod::FILE => {\n  175 |                 if let Some(first) = exif_extents.first() {\n  176 |                     return Ok((\n  177 |                         first.extent_offset + exif_item.base_offset,\n  178 |                         first.extent_length\n  179 |                     ));\n  180 |                 } else {\n  181 |                     return io_error!(Other, \"Expected one EXIF extent\");\n  182 |                 }\n  183 |             },\n  184 | \n  185 |             super::boxes::item_location::ItemConstructionMethod::IDAT => {\n  186 |                 return io_error!(Other, \"HEIF: item constr. method 'IDAT' currently not supported. Please create a new ticket at https://github.com/TechnikTobi/little_exif with an example image file\");\n  187 |             },\n  188 | \n  189 |             super::boxes::item_location::ItemConstructionMethod::ITEM => {\n  190 |                 return io_error!(Other, \"HEIF: item constr. method 'ITEM' currently not supported. Please create a new ticket at https://github.com/TechnikTobi/little_exif with an example image file\");\n  191 |             },\n  192 |         }\n  193 |     }","lines":28,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/heif/container.rs#L166-L193"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"get_exif_data seeks by exif_tiff_header_offset (line 215) BEFORE validating that `length >= 4 + offset` (line 217). The seek with an attacker-controlled offset is performed first; only afterwards is the bounds check done. The order should be: validate, then seek. As written, an invalid offset still moves the cursor (harmless for Cursor but wrong for real files) before the guard fires.","fix":"Move the `length < 4 + exif_tiff_header_offset` validation before the seek call.","locations":[{"ref":"src/heif/container.rs:213-227","code":"  213 |         let exif_tiff_header_offset = read_be_u32(cursor)? as usize;\n  214 | \n  215 |         cursor.seek(std::io::SeekFrom::Current(exif_tiff_header_offset as i64))?;\n  216 | \n  217 |         if length < 4 + exif_tiff_header_offset as u64\n  218 |         {\n  219 |             return io_error!(\n  220 |                 InvalidData,\n  221 |                 format!(\n  222 |                     \"EXIF data length ({}) is smaller than expected minimum size ({})\",\n  223 |                     length,\n  224 |                     4 + exif_tiff_header_offset as u64\n  225 |                 )\n  226 |             );\n  227 |         }","lines":15,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/heif/container.rs#L213-L227"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"decode_ifd reads StripOffsets/StripByteCounts via `offsets.iter().zip(byte_counts.iter())`. zip silently truncates to the shorter of the two, so a malformed file where the counts differ (more offsets than byte counts or vice versa) decodes only part of the strip data without any warning or error, silently dropping/mis-pairing image strips.","fix":"Validate offsets.len() == byte_counts.len() before iterating and emit a warning/error on mismatch, as is already done for the thumbnail case below.","locations":[{"ref":"src/ifd/mod.rs:380-388","code":"  380 |                 for (offset, byte_count) in offsets.iter().zip(byte_counts.iter())\n  381 |                 {\n  382 |                     data_cursor.set_position(data_begin_position);\n  383 |                     data_cursor.seek(std::io::SeekFrom::Current(*offset as i64))?;\n  384 | \n  385 |                     let mut data_buffer = vec![0u8; *byte_count as usize];\n  386 |                     data_cursor.read_exact(&mut data_buffer)?;\n  387 |                     strip_data.push(data_buffer);\n  388 |                 }","lines":9,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/ifd/mod.rs#L380-L388"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"jxl::find_insert_position loops reading boxes and only returns when it hits a box that is neither JXL nor FTYP; it calls read_exact for length and type with no EOF handling. A valid JXL file consisting solely of signature + ftyp + jxlc-walked-as-JXL boxes (or any file that ends right after the last skipped box) hits EOF in read_exact and returns an io::Error instead of a sensible insert position at end-of-buffer. Combined with the unchecked `length as i64` seek, a malformed length can also seek past EOF then error on the next read.","fix":"Handle UnexpectedEof from read_exact by returning the current end-of-buffer position as the insert point, and bounds-check the seek length against the buffer.","locations":[{"ref":"src/jxl.rs:411-450","code":"  411 | fn\n  412 | find_insert_position\n  413 | (\n  414 |     file_buffer: &Vec<u8>\n  415 | )\n  416 | -> Result<usize, std::io::Error>\n  417 | {\n  418 |     let mut cursor = Cursor::new(file_buffer);\n  419 | \n  420 |     loop\n  421 |     {\n  422 |         // Get the first 4 bytes at the current cursor position to determine\n  423 |         // the length of the current box (and account for the 8 bytes of length\n  424 |         // and box type)\n  425 |         let mut length_buffer = [0u8; 4];\n  426 |         cursor.read_exact(&mut length_buffer)?;\n  427 |         let length = from_u8_vec_res_macro!(u32, &length_buffer, &Endian::Big)?.checked_sub(8).ok_or(\n  428 |             std::io::Error::new(\n  429 |                 std::io::ErrorKind::InvalidData,\n  430 |                 \"Invalid box length found when reading JXL metadata!\"\n  431 |             )\n  432 |         )? as usize;\n  433 | \n  434 |         // Next, read the box type\n  435 |         let mut type_buffer = [0u8; 4];\n  436 |         cursor.read_exact(&mut type_buffer)?;\n  437 | \n  438 |         match type_buffer\n  439 |         {\n  440 |             IsoBmffBoxType::JXL |\n  441 |             IsoBmffBoxType::FTYP => {\n  442 |                 // Place exif box after these boxes\n  443 |                 cursor.seek(SeekFrom::Current(length as i64))?;\n  444 |             }\n  445 |             _ => {\n  446 |                 return Ok(cursor.position() as usize - 8);\n  447 |             }\n  448 |         }\n  449 |     }\n  450 | }","lines":40,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/jxl.rs#L411-L450"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`reduce_to_a_minimum` clones every kept tag into `tags_to_be_removed` (it pushes `tag.clone()` for non-whitelisted tags) only to immediately look them up again by `tag.as_u16()` and remove them. Besides the needless clone of potentially large tag values (e.g. strip/thumbnail byte arrays are whitelisted but other large tags are cloned), removing by hex `as_u16()` removes ALL tags with that hex in the IFD, which can delete a whitelisted tag that shares a hex value with a removed one (tag-number collisions across groups exist per the project's own get_tag_by_hex note). It also iterates and removes in two passes unnecessarily.","fix":"Use `ifd.get_tags_mut().retain(...)` (or equivalent) to keep only whitelisted tags in a single pass without cloning and without hex-based collateral removal.","locations":[{"ref":"src/metadata/edit.rs:28-60","code":"   28 | \t\t\tlet mut tags_to_be_removed = Vec::new();\n   29 | \n   30 | \t\t\tfor tag in ifd.get_tags()\n   31 | \t\t\t{\n   32 | \t\t\t\tmatch tag\n   33 | \t\t\t\t{\n   34 | \t\t\t\t\tExifTag::StripOffsets(_, _)\n   35 | \t\t\t\t\t| ExifTag::StripByteCounts(_)\n   36 | \t\t\t\t\t| ExifTag::ThumbnailOffset(_, _)\n   37 | \t\t\t\t\t| ExifTag::ThumbnailLength(_)\n   38 | \t\t\t\t\t| ExifTag::ImageWidth(_)\n   39 | \t\t\t\t\t| ExifTag::ImageHeight(_)\n   40 | \t\t\t\t\t| ExifTag::BitsPerSample(_)\n   41 | \t\t\t\t\t| ExifTag::Compression(_)\n   42 | \t\t\t\t\t| ExifTag::PhotometricInterpretation(_)\n   43 | \t\t\t\t\t| ExifTag::SamplesPerPixel(_)\n   44 | \t\t\t\t\t| ExifTag::RowsPerStrip(_)\n   45 | \t\t\t\t\t| ExifTag::XResolution(_)\n   46 | \t\t\t\t\t| ExifTag::YResolution(_)\n   47 | \t\t\t\t\t| ExifTag::ResolutionUnit(_)\n   48 | \t\t\t\t\t| ExifTag::ColorMap(_)\n   49 | \t\t\t\t\t=> (),\n   50 | \n   51 | \t\t\t\t\t_ \n   52 | \t\t\t\t\t=> tags_to_be_removed.push(tag.clone()),\n   53 | \t\t\t\t}\n   54 | \t\t\t}\n   55 | \n   56 | \t\t\tfor tag in tags_to_be_removed\n   57 | \t\t\t{\n   58 | \t\t\t\tifd.remove_tag(tag.as_u16());\n   59 | \t\t\t}\n   60 | \t\t}","lines":33,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/metadata/edit.rs#L28-L60"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `new_from_path`, `extension_based_file_type` is declared `mut` and assigned in every branch, but when the extension yields no type and content detection succeeds the variable is named `content_based_file_type` (shadowed) and assigned; later (lines 142-149) `content_based_file_type` is matched again as `Some` and used to overwrite. The flow is convoluted and the early branch at 132-139 already consumed the Option semantics. The net effect duplicates the content-vs-extension reconciliation and makes the precedence logic hard to verify; in the path where extension was absent, content precedence is applied twice. This is an architecture/clarity defect that risks subtle wrong file-type selection.","fix":"Restructure: compute `extension_opt` and `content_opt`, then choose with a single clear precedence rule (content overrides extension; fall back to whichever exists; error if neither). Avoid re-matching `content_based_file_type` twice.","locations":[{"ref":"src/metadata/metadata_io.rs:122-155","code":"  122 |         // Next, try to use auto detect\n  123 |         let mut file = open_read_file(path)?;\n  124 |         let content_based_file_type = FileExtension::auto_detect(&mut file);\n  125 | \n  126 |         let mut extension_based_file_type: FileExtension;\n  127 |         if let Some(extension_based) = extension_based_file_type_opt {\n  128 |             extension_based_file_type = extension_based;\n  129 |         }\n  130 |         else\n  131 |         {\n  132 |             if let Some(content_based_file_type) = content_based_file_type {\n  133 |                 extension_based_file_type = content_based_file_type;\n  134 |             } else {\n  135 |                 return io_error!(\n  136 |                     Other,\n  137 |                     \"Could not determine file type when reading file!\"\n  138 |                 );\n  139 |             }\n  140 |         }\n  141 | \n  142 |         if let Some(content_based_file_type) = content_based_file_type\n  143 |         {\n  144 |             if extension_based_file_type != content_based_file_type\n  145 |             {\n  146 |                 log::warn!(\"File extension and file content yield different file type, content takes precedence\");\n  147 |                 extension_based_file_type = content_based_file_type;\n  148 |             }\n  149 |         }\n  150 |         else\n  151 |         {\n  152 |             log::warn!(\"Could not determine file type based on content, fall back on file extension\");\n  153 |         }\n  154 | \n  155 |         let file_type = extension_based_file_type;","lines":34,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/metadata/metadata_io.rs#L122-L155"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"decode_metadata_png loop condition is `while !exif_header_found && !endian_info_found`. With De Morgan this loops while neither is found, which is the intended behavior, but the per-iteration logic re-runs all three marker comparisons from counter=0 against the front of the deque after each pop_front, an O(n*m) rescan. More importantly, when the EXIF header is absent but endian info is present and located at a non-zero offset, the byte-by-byte pop only ever compares at offset 0, so a marker not at the current front is found only after enough leading bytes are popped - correct but quadratic and fragile.","fix":"Search for the marker offset once (e.g. windows().position()) then split the deque, instead of re-scanning from the front on every pop.","locations":[{"ref":"src/png/mod.rs:792-859","code":"  792 |     while !exif_header_found && !endian_info_found\n  793 |     {\n  794 |         let mut counter = 0;\n  795 |         for header_value in &EXIF_HEADER\n  796 |         {\n  797 |             if *header_value != exif_all[counter]\n  798 |             {\n  799 |                 break;\n  800 |             }\n  801 |             counter += 1;\n  802 |         }\n  803 | \n  804 |         exif_header_found = counter == EXIF_HEADER.len();\n  805 | \n  806 |         if exif_header_found\n  807 |         {\n  808 |             break;\n  809 |         }\n  810 | \n  811 |         counter = 0;\n  812 | \n  813 |         // But what if the EXIF_HEADER is missing and we are directly starting\n  814 |         // with the endian information? See issue #54\n  815 |         for endian_info in &LITTLE_ENDIAN_INFO\n  816 |         {\n  817 |             if *endian_info != exif_all[counter]\n  818 |             {\n  819 |                 break;\n  820 |             }\n  821 |             counter += 1;\n  822 |         }\n  823 | \n  824 |         endian_info_found = counter == LITTLE_ENDIAN_INFO.len();\n  825 | \n  826 |         if endian_info_found\n  827 |         {\n  828 |             break;\n  829 |         }\n  830 | \n  831 |         // And the same check for big endian\n  832 |         for endian_info in &BIG_ENDIAN_INFO\n  833 |         {\n  834 |             if *endian_info != exif_all[counter]\n  835 |             {\n  836 |                 break;\n  837 |             }\n  838 |             counter += 1;\n  839 |         }\n  840 | \n  841 |         endian_info_found = counter == BIG_ENDIAN_INFO.len();\n  842 | \n  843 |         if endian_info_found\n  844 |         {\n  845 |             break;\n  846 |         }\n  847 | \n  848 |         if let Some(next_byte) = exif_all.pop_front()\n  849 |         {\n  850 |             pop_storage.push(next_byte);\n  851 |         }\n  852 |         else\n  853 |         {\n  854 |             return io_error!(\n  855 |                 InvalidData, \n  856 |                 \"Can't decode PNG EXIF data - No EXIF header or endian information found!\"\n  857 |             );\n  858 |         }\n  859 |     }","lines":68,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/png/mod.rs#L792-L859"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"tiff/file.rs::clear_metadata opens the file for reading, reads/decodes the metadata, then separately calls open_write_file on the same path and writes via generic_write_metadata (which writes only metadata.encode() at the cursor start). Because open_write_file does not truncate to the new length here, if the reduced TIFF is shorter than the original the trailing bytes of the old file remain, producing a corrupt TIFF. The vec.rs variant has the analogous issue: generic_write_metadata writes at cursor_start_pos but never truncates the Vec, leaving stale trailing bytes when the reduced data is smaller.","fix":"After writing, truncate the file/Vec to the number of bytes written (file.set_len / vec.truncate), or open the write file with .truncate(true).","locations":[{"ref":"src/tiff/file.rs:33-43","code":"   33 | \t// Read in the data\n   34 | \tlet     raw_data = generic_read_metadata(&mut BufReader::new(open_read_file(path)?));\n   35 | \tlet mut data     = Metadata::general_decoding_wrapper(raw_data)?;\n   36 | \n   37 | \t// Remove all IFDs that aren't required\n   38 | \tdata.reduce_to_a_minimum();\n   39 | \n   40 | \t// Write the reduced data back to the backup cursor\n   41 | \tgeneric_write_metadata(&mut BufWriter::new(open_write_file(path)?), &data)?;\n   42 | \n   43 | \treturn Ok(());","lines":11,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/tiff/file.rs#L33-L43"},{"ref":"src/tiff/vec.rs:29-42","code":"   29 | \t// Create cursor\n   30 | \tlet mut cursor           = Cursor::new(file_buffer);\n   31 | \tlet     cursor_start_pos = cursor.position();\n   32 | \n   33 | \t// Read in the data\n   34 | \tlet     raw_data = generic_read_metadata(&mut cursor);\n   35 | \tlet mut data     = Metadata::general_decoding_wrapper(raw_data)?;\n   36 | \n   37 | \t// Remove all IFDs that aren't required\n   38 | \tdata.reduce_to_a_minimum();\n   39 | \n   40 | \t// Write the reduced data back to the backup cursor\n   41 | \tcursor.set_position(cursor_start_pos);\n   42 | \treturn generic_write_metadata(&mut cursor, &data);","lines":14,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/tiff/vec.rs#L29-L42"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"insert_multiple_at returns std::cmp::max(1, current_len) as its non-zero error code when offset > current_len. The doc comment says it returns 0 on success and non-zero on failure, but if the destination vector is empty (current_len == 0) and offset > 0, it returns max(1,0)=1 (non-zero, ok). However when current_len > 0 it returns current_len, which is a valid length value that a caller using `!= 0` works for, but the API conflates an error code with a length. Any caller that interprets the return as a meaningful count or offset (rather than just zero/non-zero) gets a misleading value. The return contract is muddled.","fix":"Return a clear sentinel or, better, return Result<(), ()> / Option so the error case is unambiguous and cannot be confused with a length.","locations":[{"ref":"src/util.rs:235-267","code":"  235 | pub(crate) fn \n  236 | insert_multiple_at<T>\n  237 | (\n  238 |     vec_dst: &mut Vec<T>,\n  239 |     offset:  usize,\n  240 |     vec_src: &mut Vec<T>,\n  241 | )\n  242 | -> usize\n  243 | where T: Copy \n  244 | {\n  245 |     match (vec_dst.len(), vec_src.len()) \n  246 |     {\n  247 |         (_, 0)           => 0,\n  248 |         (current_len, _) => {\n  249 | \n  250 |             // If this is true we return at this point as this would cause a\n  251 |             // \"gap\" between existing and new vector contents\n  252 |             if current_len < offset\n  253 |             {\n  254 |                 return std::cmp::max(1, current_len);\n  255 |             }\n  256 | \n  257 |             // Reserve without over-allocation space needed for new elements\n  258 |             vec_dst.reserve_exact(vec_src.len());\n  259 | \n  260 |             let mut temp = vec_dst.split_off(offset);\n  261 |             vec_dst.append(vec_src);\n  262 |             vec_dst.append(&mut temp);\n  263 | \n  264 |             return 0;\n  265 |         },\n  266 |     }\n  267 | }","lines":33,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/util.rs#L235-L267"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"read_metadata seeks past the EXIF payload using chunk_size from the descriptor, but for skipped non-EXIF chunks it seeks chunk_size then an extra chunk_size % 2 padding byte (file.rs:342-346, vec.rs:329-333). However the descriptor's len() is already the padded length (padding folded in at get_next_chunk), so for odd original chunks this double-counts the padding and the cursor desynchronizes from the chunk_index check, causing 'Got unexpected chunk type' errors on otherwise valid files containing an odd-sized non-EXIF chunk before the EXIF chunk.","fix":"Use the descriptor length consistently: since len() is already padded, do not add an extra padding seek; or store the raw (unpadded) length in the descriptor and pad explicitly in exactly one place.","locations":[{"ref":"src/webp/file.rs:340-347","code":"  340 |         {\n  341 |             // Skip the entire chunk\n  342 |             file.seek(std::io::SeekFrom::Current(chunk_size as i64))?;\n  343 | \n  344 |             // Note that we have to seek another byte in case the chunk is of \n  345 |             // uneven size to account for the padding byte that must be included\n  346 |             file.seek(std::io::SeekFrom::Current(chunk_size as i64 % 2))?;\n  347 |         }","lines":8,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/webp/file.rs#L340-L347"},{"ref":"src/webp/vec.rs:326-334","code":"  326 |         else\n  327 |         {\n  328 |             // Skip the entire chunk\n  329 |             cursor.seek(std::io::SeekFrom::Current(chunk_size as i64))?;\n  330 | \n  331 |             // Note that we have to seek another byte in case the chunk is of \n  332 |             // uneven size to account for the padding byte that must be included\n  333 |             cursor.seek(std::io::SeekFrom::Current(chunk_size as i64 % 2))?;\n  334 |         }","lines":9,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/webp/vec.rs#L326-L334"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"write_metadata (file.rs) and clear_metadata operate on the file directly but the EXIF location search loop in write_metadata reads chunk descriptors via get_next_chunk (which reads full payloads) to find the insertion point, then does file.read_to_end and re-writes. If a 'pre-exif' chunk type list is missing a legitimate chunk type (e.g. it lists 'VP8' but real fourCC is 'VP8 ' with trailing space, and 'ALPH'), the EXIF chunk may be inserted at the wrong position. Notably 'VP8 ' (with space) will not match the entry \"VP8\" except via the to_lowercase comparison of differing-length strings, so 'VP8 ' is treated as NOT a pre-exif chunk and the loop breaks immediately, inserting EXIF before the image data.","fix":"Match fourCC exactly including the trailing space ('VP8 '), and include all spec chunks that precede EXIF (ALPH, ANMF, etc.). Compare against canonical 4-char fourCCs.","locations":[{"ref":"src/webp/file.rs:673-714","code":"  673 |     let pre_exif_chunks = [\n  674 |         \"VP8X\",\n  675 |         \"VP8\",\n  676 |         \"VP8L\",\n  677 |         \"ICCP\",\n  678 |         \"ANIM\"\n  679 |     ];\n  680 | \n  681 |     loop\n  682 |     {\n  683 |         // Request a chunk descriptor. If this fails, check the error \n  684 |         // Depending on its type, either continue normally or return it\n  685 |         let chunk_descriptor_result = get_next_chunk_descriptor(&mut file);\n  686 | \n  687 |         match chunk_descriptor_result\n  688 |         {\n  689 |             Ok(chunk_descriptor) => {\n  690 |                 let mut chunk_type_found_in_pre_exif_chunks = false;\n  691 | \n  692 |                 // Check header of chunk descriptor against any of the known chunks\n  693 |                 // that should come before the EXIF chunk\n  694 |                 for pre_exif_chunk in &pre_exif_chunks\n  695 |                 {\n  696 |                     chunk_type_found_in_pre_exif_chunks |= pre_exif_chunk.to_lowercase() == chunk_descriptor.header().to_lowercase();\n  697 |                 }\n  698 | \n  699 |                 if !chunk_type_found_in_pre_exif_chunks\n  700 |                 {\n  701 |                     break;\n  702 |                 }\n  703 |             },\n  704 |             Err(e) => {\n  705 |                 match e.kind()\n  706 |                 {\n  707 |                     std::io::ErrorKind::UnexpectedEof\n  708 |                         => break, // No further chunks, place EXIF chunk here\n  709 |                     _\n  710 |                         => return Err(e)\n  711 |                 }\n  712 |             }\n  713 |         }\n  714 |     }","lines":42,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/webp/file.rs#L673-L714"},{"ref":"src/webp/vec.rs:611-661","code":"  611 |     let pre_exif_chunks = [\n  612 |         \"VP8X\",\n  613 |         \"VP8\",\n  614 |         \"VP8L\",\n  615 |         \"ICCP\",\n  616 |         \"ANIM\"\n  617 |     ];\n  618 | \n  619 |     // Clippy wrongly needs this allowance, otherwise it states that this call\n  620 |     // to as_ref does nothing. However, it *does* something, mainly \n  621 |     // creating an immutable reference that gets passed as a copy to the\n  622 |     // constructor of the cursor, so file_buffer is later on still available\n  623 |     // when calling insert_multiple_at.\n  624 |     // I guess there is a less messy solution to this?\n  625 |     #[allow(clippy::useless_asref)]\n  626 |     let mut read_cursor = Cursor::new(file_buffer.as_ref());\n  627 | \n  628 |     loop\n  629 |     {\n  630 |         // Request a chunk descriptor. If this fails, check the error \n  631 |         // Depending on its type, either continue normally or return it\n  632 |         let chunk_descriptor_result = get_next_chunk_descriptor(&mut read {"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"convert_to_extended_format builds the VP8X chunk with hard-coded size 0x0A (10) and writes width/height as the lower 24 bits of u32 via take(3). Because get_dimension_info_from_vp8_chunk returns width-1/height-1 but get_dimension_info_from_vp8l_chunk returns width/height (not minus one), the VP8X canvas dimensions written differ in their off-by-one convention between the two source chunk types. VP8X canvas size fields are defined as (value - 1), so the VP8L path writes a value one too large.","fix":"Make both dimension extractors return the same convention (the actual width/height), then subtract 1 once when writing the VP8X canvas fields, per the WebP spec.","locations":[{"ref":"src/webp/mod.rs:177","code":"  177 |     return Ok((width as u32 -1, height as u32 -1));","lines":1,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/webp/mod.rs#L177"},{"ref":"src/webp/file.rs:432-433","code":"  432 |     for byte in  width_vec.iter().take(3) { vp8x_chunk.push(*byte); }\n  433 |     for byte in height_vec.iter().take(3) { vp8x_chunk.push(*byte); }","lines":2,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/webp/file.rs#L432-L433"},{"ref":"src/webp/file.rs:462-493","code":"  462 | fn\n  463 | get_dimension_info_from_vp8l_chunk\n  464 | (\n  465 |     payload: &[u8],\n  466 | )\n  467 | -> Result<(u32, u32), std::io::Error>\n  468 | {\n  469 |     // Get the 4 bytes containing the dimension information\n  470 |     // (although we only need 28 bits)\n  471 |     // Starting at byte 1 instead of 0 due to the 0x2F byte\n  472 |     // See: https://developers.google.com/speed/webp/docs/webp_lossless_bitstream_specification#3_riff_header\n  473 |     let width_height_info_buffer = payload[1..5].to_vec();\n  474 |     \n  475 |     // Convert to a single u32 number for bit-mask operations\n  476 |     let width_height_info = from_u8_vec_res_macro!(u32, &width_height_info_buffer, &Endian::Little)?;\n  477 |     \n  478 |     let mut width  = 0;\n  479 |     let mut height = 0;\n  480 | \n  481 |     // Get the first 14 bit to construct the width\n  482 |     for bit_index in 0..14\n  483 |     {\n  484 |         width  |= ((width_height_info >> (27 - bit_index)) & 0x01) << (13 - (bit_index % 14));\n  485 |     }\n  486 | \n  487 |     // Get the next 14 bit to construct the height\n  488 |     for bit_index in 14..28\n  489 |     {\n  490 |         height |= ((width_height_info >> (27 - bit_index)) & 0x01) << (13 - (bit_index % 14));\n  491 |     }\n  492 | \n  493 |     return Ok((width, height));","lines":32,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/webp/file.rs#L462-L493"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"create_new_item_location_entry hardcodes `extent_index: Some(0)`. On serialize, the extent_index is only written when index_size > 0; but a newly created entry with Some(0) in a box whose index_size is 0 silently drops the index, and conversely if index_size>0 it writes a spurious zero index. The created entry's offset/length sizing also implicitly relies on the existing box's offset_size/length_size being 4 or 8 (not 0), which is never validated, so writing into a box with offset_size==0 would emit no offset bytes and lose the new EXIF location.","fix":"Set extent_index based on the box's index_size, and validate/ensure offset_size and length_size are non-zero (or upgrade them) when inserting a new EXIF extent.","locations":[{"ref":"src/heif/boxes/item_location.rs:370-418","code":"  370 |     pub(crate) fn\n  371 |     create_new_item_location_entry\n  372 |     (\n  373 |         &mut self,\n  374 |         data_start:  u64,\n  375 |         data_length: u64\n  376 |     )\n  377 |     -> (u32, u64)\n  378 |     {\n  379 |         // Determine largest iloc ID so far\n  380 |         let old_largest_id = self.items\n  381 |             .iter()\n  382 |             .map(|x| x.item_id)\n  383 |             .max()\n  384 |             .unwrap_or(0);\n  385 | \n  386 |         self.items.push(ItemLocationEntry \n  387 |             {\n  388 |                 item_id:                          old_largest_id + 1, \n  389 |                 reserved_and_construction_method: 0, \n  390 |                 data_reference_index:             0, \n  391 |                 base_offset:                      0,\n  392 |                 extent_count:                     1, \n  393 |                 extents:                          vec![\n  394 |                     ItemLocationEntryExtentEntry \n  395 |                     {\n  396 |                         extent_index:  Some(0),\n  397 |                         extent_offset: data_start,\n  398 |                         extent_length: data_length,\n  399 |                     }\n  400 |                 ]\n  401 |             }\n  402 |         );\n  403 | \n  404 |         self.item_count += 1;\n  405 | \n  406 |         // Due to the addition of a new item, the size in the header needs to \n  407 |         // be adjusted as well\n  408 |         // TODO: make this more efficient by only computing how much memory is\n  409 |         // needed, not by actually serializing (and thus, allocating memory)\n  410 |         let old_box_size = self.header.get_box_size();\n  411 |         let new_box_size = self.serialize().len() as u64;\n  412 |         self.header.set_box_size(new_box_size);\n  413 | \n  414 |         return (\n  415 |             self.items.last_mut().expect(\"No items present after insertion\").item_id,\n  416 |             new_box_size - old_box_size\n  417 |         );\n  418 |     }","lines":49,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/heif/boxes/item_location.rs#L370-L418"},{"ref":"src/heif/boxes/item_location.rs:546-582","code":"  546 |             for extent in &item.extents\n  547 |             {\n  548 |                 if \n  549 |                     (self.header.get_version() == 1 || self.header.get_version() == 2)\n  550 |                     &&\n  551 |                     self.index_size > 0\n  552 |                 {\n  553 |                     match self.index_size\n  554 |                     {\n  555 |                         4 => {\n  556 |                             let idx: u32 = extent.extent_index.expect(\"Extent index missing\") as u32;\n  557 |                             serialized.extend(to_u8_vec_macro!(u32, &idx, &Endian::Big).iter());\n  558 |                         },\n  559 |                         8 => {\n  560 |                             let idx: u64 = extent.extent_
