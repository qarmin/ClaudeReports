<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"decode_tag_with_format_exceptions asserts that INT16U values fit in u8 with `assert_eq!(*element_u16, *element_u8 as u16)` on data parsed from an untrusted file. A tag declared INT8U but encoded as INT16U with any value > 255 will panic (assertion failure) instead of returning an error. (Issue #74 path.)","fix":"Replace the assert with a checked conversion that returns an io_error when any element exceeds u8::MAX, e.g. `if int16u_data.iter().any(|x| *x > u8::MAX as u16) { return io_error!(InvalidData, ...); }`.","locations":[{"ref":"src/exif_tag/decode.rs:72-83","code":"   72 | \t\t\t(ExifTagFormat::INT8U, ExifTagFormat::INT16U) => {\n   73 | \t\t\t\tlet int16u_data = <INT16U as U8conversion<INT16U>>::from_u8_vec(raw_data, endian);\n   74 | \t\t\t\tlet int8u_data  = int16u_data.clone().into_iter().map(|x| x as u8).collect::<Vec<u8>>();\n   75 | \t\t\t\tfor (element_u16, element_u8) in int16u_data.iter().zip(int8u_data.iter())\n   76 | \t\t\t\t{\n   77 | \t\t\t\t\t// Assert that the int16u data is within int8u range\n   78 | \t\t\t\t\tassert_eq!(*element_u16, *element_u8 as u16);\n   79 | \t\t\t\t}\n   80 | \t\t\t\treturn raw_tag.set_value_to_int8u_vec(int8u_data).map_err(\n   81 | \t\t\t\t\t|e| io_error_plain!(Other, format!(\"Could not decode tag {:?}: {}\", raw_tag, e))\n   82 | \t\t\t\t);\n   83 | \t\t\t},","lines":12,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/exif_tag/decode.rs#L72-L83"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"In decode_ifd, when byte_count is 0 (e.g. an entry with hex_component_number == 0) the small-data branch produces an empty raw_data via `entry_buffer[8..8]`. If that tag is GPSAltitudeRef (0x0005, group GPS) stored as STRING, decode_tag_with_format_exceptions reaches `let first_char = raw_data[0];` which indexes an empty slice and panics. Untrusted input can trigger this.","fix":"Guard against empty raw_data before indexing: `let Some(&first_char) = raw_data.first() else { return io_error!(InvalidData, \"GPSAltitudeRef has no data\"); };`.","locations":[{"ref":"src/exif_tag/decode.rs:99","code":"   99 | \t\t\t\t\tlet first_char = raw_data[0];","lines":1,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/exif_tag/decode.rs#L99"},{"ref":"src/ifd/mod.rs:217","code":"  217 |                 raw_data = entry_buffer[8..(8+byte_count as usize)].to_vec();","lines":1,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/ifd/mod.rs#L217"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"get_construction_method panics on malformed input. The lower 4 bits of `reserved_and_construction_method` are read directly from an untrusted file; any value of 3..=15 hits the `panic!`. A crafted iloc entry with construction method nibble >= 3 crashes the whole library. This is reached during normal read/write/clear paths via add_to_extents and generic_write_metadata.","fix":"Return an io_error!(InvalidData, ...) for unknown construction methods instead of panicking, and propagate the Result up through get_construction_method's callers.","locations":[{"ref":"src/heif/boxes/item_location.rs:232-238","code":"  232 |         return match self.reserved_and_construction_method as u8 & 0x0f\n  233 |         {\n  234 |             0 => ItemConstructionMethod::FILE,\n  235 |             1 => ItemConstructionMethod::IDAT,\n  236 |             2 => ItemConstructionMethod::ITEM,\n  237 |             _ => panic!(\"Unknown item construction method!\")\n  238 |         };","lines":7,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/heif/boxes/item_location.rs#L232-L238"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"Slicing `exif_buffer[0..4]` panics when the exif area length is 1, 2 or 3. The branch is entered whenever `length > 0`, but the buffer is only `length` bytes long, so `[0..4]` is out of bounds for any length in 1..=3, panicking on a malformed iloc extent length.","fix":"Before slicing, verify `exif_buffer.len() >= 4` and return an InvalidData error otherwise.","locations":[{"ref":"src/heif/container.rs:270-282","code":"  270 |         if length > 0\n  271 |         {\n  272 |             // Reset cursor to start of exif data\n  273 |             cursor.seek(std::io::SeekFrom::Start(start))?;\n  274 | \n  275 |             // Read in all of this area\n  276 |             let mut exif_buffer = vec![0u8; length as usize];\n  277 |             cursor.read_exact(&mut exif_buffer)?;\n  278 | \n  279 |             // Decode the first 4 bytes, which tells us where to cut off the old \n  280 |             // data and replace with the new one\n  281 |             let mut local_cursor            = Cursor::new(exif_buffer[0..4].to_vec());\n  282 |             let     exif_tiff_header_offset = read_be_u32(&mut local_cursor)?;","lines":13,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/heif/container.rs#L270-L282"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"Slicing `exif_buffer[0..exif_tiff_header_offset as usize + 4]` panics with out-of-bounds when the decoded TIFF header offset (read from file bytes) exceeds the buffer length minus 4. `exif_tiff_header_offset` is a fully attacker-controlled u32, so a value larger than the exif area length causes an immediate panic during write/clear.","fix":"Bounds-check: ensure `(exif_tiff_header_offset as usize).checked_add(4)` is Some and <= exif_buffer.len() before slicing; return InvalidData otherwise.","locations":[{"ref":"src/heif/container.rs:284-285","code":"  284 |             // Cut off data, starting at the old TIFF header and replace with new\n  285 |             new_exif_buffer = exif_buffer[0..exif_tiff_header_offset as usize + 4].to_vec();","lines":2,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/heif/container.rs#L284-L285"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"jxl::clear_metadata indexes file_buffer with fixed offsets `position..position+4`, `position+4..position+8`, and `position+8..position+12` after only checking `position >= file_buffer.len()`. A truncated/malformed JXL box near EOF (fewer than 12 bytes remaining) causes an out-of-bounds slice panic on untrusted input.","fix":"Before slicing, verify `position + 12 <= file_buffer.len()` (and that the box length is consistent) and return an io_error otherwise.","locations":[{"ref":"src/jxl.rs:141-153","code":"  141 |         if position >= file_buffer.len() { return Ok(()); }\n  142 | \n  143 |         // Get the first 4 bytes at the current cursor position to determine\n  144 |         // the length of the current box \n  145 |         let length_buffer = file_buffer[position..position+4].to_vec();\n  146 |         let length        = from_u8_vec_res_macro!(u32, &length_buffer, &Endian::Big)? as usize;\n  147 | \n  148 |         // Next, read the box type\n  149 |         let type_buffer = file_buffer[position+4..position+8].to_vec();\n  150 | \n  151 |         if box_contains_exif(\n  152 |             &mut Cursor::new(\n  153 |                 file_buffer[position+8..position+12].to_vec()","lines":13,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/jxl.rs#L141-L153"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"jxl::clear_metadata never validates the decoded box `length`. If `length == 0`, the else branch `position += length` loops forever (DoS). If `length` overflows when computing `position + length` for range_remove, or if the box claims a length extending past EOF, the subsequent iteration's slice `file_buffer[position..position+4]` panics. The non-vec variant file_clear_metadata has the same class of problem via `(length-8) as i64`.","fix":"Validate `length >= 8` and `position + length <= file_buffer.len()` (using checked arithmetic) on each iteration; reject length 0 / out-of-range boxes with an io_error.","locations":[{"ref":"src/jxl.rs:146-164","code":"  146 |         let length        = from_u8_vec_res_macro!(u32, &length_buffer, &Endian::Big)? as usize;\n  147 | \n  148 |         // Next, read the box type\n  149 |         let type_buffer = file_buffer[position+4..position+8].to_vec();\n  150 | \n  151 |         if box_contains_exif(\n  152 |             &mut Cursor::new(\n  153 |                 file_buffer[position+8..position+12].to_vec()\n  154 |             ), \n  155 |             [type_buffer[0], type_buffer[1], type_buffer[2], type_buffer[3]]\n  156 |         )?\n  157 |         {\n  158 |             range_remove(file_buffer, position, position+length);\n  159 |         }\n  160 |         else\n  161 |         {\n  162 |             // Not an EXIF box so skip it\n  163 |             position += length;\n  164 |         }","lines":19,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/jxl.rs#L146-L164"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"In jxl::generic_read_metadata the EXIF and BROB branches read `vec![0u8; (length-4) as usize]` after subtracting only 8 from the raw box length. A box with declared length between 8 and 11 (so `length` after checked_sub(8) is < 4) underflows `length-4`, producing a panic (debug) or an enormous allocation (release). The minor-version skip of 4 bytes is also not validated against the box length.","fix":"Validate that the post-checked_sub length is >= 4 before computing `length-4`; return an io_error for boxes too small to contain the minor-version field plus payload.","locations":[{"ref":"src/jxl.rs:331-355","code":"  331 |             EXIF => {\n  332 |                 // Skip the next 4 bytes (which contain the minor version???)\n  333 |                 cursor.seek(SeekFrom::Current(4))?;\n  334 | \n  335 |                 // `length-4` because of the previous relative seek operation\n  336 |                 let mut exif_buffer = vec![0u8; (length-4) as usize];\n  337 |                 cursor.read_exact(&mut exif_buffer)?;\n  338 | \n  339 |                 return Ok(exif_buffer);\n  340 |             },\n  341 | \n  342 |             BROB_BOX => { // -> Brotli encoded data\n  343 | \n  344 |                 let position = cursor.stream_position()? as usize;\n  345 | \n  346 |                 if check_brob_type_for_exif(cursor)?\n  347 |                 {\n  348 |                     // Skip the next 4 bytes (which contain the minor version???)\n  349 |                     cursor.seek(SeekFrom::Current(4))?;\n  350 | \n  351 |                     let mut compressed_exif_buffer = vec![\n  352 |                         0u8; \n  353 |                         (length-4) as usize\n  354 |                     ];\n  355 |                     cursor.read_exact(&mut compressed_exif_buffer)?;","lines":25,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/jxl.rs#L331-L355"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"jxl::generic_read_metadata returns `decompressed_exif_buffer[4..].to_vec()` after Brotli-decompressing untrusted data. If the decompressed output is shorter than 4 bytes, the slice `[4..]` panics. Attacker-controlled compressed input can trivially decompress to 0-3 bytes.","fix":"Check `decompressed_exif_buffer.len() >= 4` and return an io_error otherwise before slicing `[4..]`.","locations":[{"ref":"src/jxl.rs:357-370","code":"  357 |                     let mut decompressed_exif_buffer = Vec::new();\n  358 | \n  359 |                     match brotli::BrotliDecompress(\n  360 |                         &mut Cursor::new(compressed_exif_buffer), \n  361 |                         &mut decompressed_exif_buffer\n  362 |                     ) \n  363 |                     {\n  364 |                         Ok(_)  => (),\n  365 |                         Err(e) => return Err(e)\n  366 |                     };\n  367 | \n  368 |                     // Ignore the next 4 bytes (I guess for the same reason \n  369 |                     // as above - some sort of minor version?)\n  370 |                     return Ok(decompressed_exif_buffer[4..].to_vec());","lines":14,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/jxl.rs#L357-L370"}]},
{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`sort_data` calls `panic!` if two IFDs share the same group and generic IFD number. `sort_data` is invoked by `general_decoding_wrapper` on freshly decoded, attacker-controlled metadata. A malformed/crafted file whose IFD chain decodes into two GENERIC IFDs at the same generic_ifd_nr (or any duplicated group+number) would abort the whole process, turning a parse of untrusted input into a crash.","fix":"Do not panic inside a comparator on data derived from untrusted input. Either de-duplicate IFDs during decode and return a recoverable `io_error!`, or make the comparator total (treat equal group+number as Ordering::Equal) and reject duplicates with an error before sorting.","locations":[{"ref":"src/metadata/mod.rs:230-233","code":"  230 |                 if a.get_ifd_type() == b.get_ifd_type()\n  231 |                 {\n  232 |                     panic!(\"Should not have two different IFDs with same group & number!\");\n  233 |                 }","lines":4,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/metadata/mod.rs#L230-L233"},{"ref":"src/metadata/mod.rs:94-96","code":"   94 |                 let mut data = Metadata { endian, image_file_directories };\n   95 |                 data.sort_data();\n   96 |                 return Ok(data);","lines":3,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/metadata/mod.rs#L94-L96"}]},
{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"decode_metadata_png indexes the exif_all VecDeque by counter (exif_all[counter]) while scanning for EXIF_HEADER / endian markers. If exif_all is shorter than EXIF_HEADER/endian-info length (small or empty decoded payload from a crafted chunk), the index panics. The pop_front guard only fires after the indexing loop already ran.","fix":"Use exif_all.get(counter) and break/return an error when the index is out of range, or check exif_all.len() before each comparison loop.","locations":[{"ref":"src/png/mod.rs:792-859","code":"  792 |     while !exif_header_found && !endian_info_found\n  793 |     {\n  794 |         let mut counter = 0;\n  795 |         for header_value in &EXIF_HEADER\n  796 |         {\n  797 |             if *header_value != exif_all[counter]\n  798 |             {\n  799 |                 break;\n  800 |             }\n  801 |             counter += 1;\n  802 |         }\n  803 | \n  804 |         exif_header_found = counter == EXIF_HEADER.len();\n  805 | \n  806 |         if exif_header_found\n  807 |         {\n  808 |             break;\n  809 |         }\n  810 | \n  811 |         counter = 0;\n  812 | \n  813 |         // But what if the EXIF_HEADER is missing and we are directly starting\n  814 |         // with the endian information? See issue #54\n  815 |         for endian_info in &LITTLE_ENDIAN_INFO\n  816 |         {\n  817 |             if *endian_info != exif_all[counter]\n  818 |             {\n  819 |                 break;\n  820 |             }\n  821 |             counter += 1;\n  822 |         }\n  823 | \n  824 |         endian_info_found = counter == LITTLE_ENDIAN_INFO.len();\n  825 | \n  826 |         if endian_info_found\n  827 |         {\n  828 |             break;\n  829 |         }\n  830 | \n  831 |         // And the same check for big endian\n  832 |         for endian_info in &BIG_ENDIAN_INFO\n  833 |         {\n  834 |             if *endian_info != exif_all[counter]\n  835 |             {\n  836 |                 break;\n  837 |             }\n  838 |             counter += 1;\n  839 |         }\n  840 | \n  841 |         endian_info_found = counter == BIG_ENDIAN_INFO.len();\n  842 | \n  843 |         if endian_info_found\n  844 |         {\n  845 |             break;\n  846 |         }\n  847 | \n  848 |         if let Some(next_byte) = exif_all.pop_front()\n  849 |         {\n  850 |             pop_storage.push(next_byte);\n  851 |         }\n  852 |         else\n  853 |         {\n  854 |             return io_error!(\n  855 |                 InvalidData, \n  856 |                 \"Can't decode PNG EXIF data - No EXIF header or endian information found!\"\n  857 |             );\n  858 |         }\n  859 |     }","lines":68,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/png/mod.rs#L792-L859"}]},
{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"decode_metadata_png uses assert!(!pop_storage.is_empty()) and assert_eq!(given_exif_len, exif_all.len() ...) on data derived entirely from the (untrusted) chunk. A malformed but CRC-valid chunk (or one re-compressed by an attacker) where the size info does not match the payload length will panic the whole process instead of returning an error.","fix":"Replace the asserts with graceful io_error returns (or drop the optional validation entirely as the comment suggests).","locations":[{"ref":"src/png/mod.rs:867","code":"  867 |     assert!(!pop_storage.is_empty());","lines":1,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/png/mod.rs#L867"},{"ref":"src/png/mod.rs:893","code":"  893 |     assert_eq!(given_exif_len, exif_all.len() as u64);","lines":1,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/png/mod.rs#L893"}]},
{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"get_data_from_text_chunk slices/indexes chunk_data at offsets derived from keyword_length without verifying the chunk is long enough. For 'zTXt' it reads chunk_data[keyword_length + 1] and slices chunk_data[data_start..] (data_start = keyword_length + 2); for 'tEXt' chunk_data[data_start..] (keyword_length + 1); for 'iTXt' chunk_data[data_start..]. A chunk consisting only of a keyword + NUL (or shorter) panics with index/slice out of bounds on untrusted input.","fix":"Validate that chunk_data.len() >= the computed data_start (and >= keyword_length + 1 before reading the compression-method byte) and return an io_error otherwise; use chunk_data.get(idx) / get(range) instead of direct indexing.","locations":[{"ref":"src/png/text.rs:42-126","code":"   42 |         \"tEXt\" => {\n   43 |             // Find start of data\n   44 |             // For this we take the keyword length and add 1 for the NUL byte\n   45 |             let data_start = keyword_length + 1;\n   46 |             \n   47 |             return Ok(chunk_data[data_start..].to_vec());\n   48 |         },\n   49 | \n   50 |         \"zTXt\" => {\n   51 |             // Find start of data\n   52 |             // For this we take the keyword length and add 2 for the NUL byte\n   53 |             // and the byte representing the compression method\n   54 |             let data_start = keyword_length + 2;\n   55 | \n   56 |             // Check compression method\n   57 |             if chunk_data[keyword_length + 1] != 0x00\n   58 |             {\n   59 |                 return io_error!(\n   60 |                     Other,\n   61 |                     \"Unknown compression method for zTXt!\"\n   62 |                 );\n   63 |             }\n   64 | \n   65 |             // Decode zlib data\n   66 |             if let Ok(decompressed_data) = decompress_to_vec_zlib(\n   67 |                 &chunk_data     {\n  117 |                 return Ok(decompressed_data);\n  118 |             }\n  119 |             else\n  120 |             {\n  121 |                 return io_error!(\n  122 |                     Other, \n  123 |                     \"Could not inflate compressed chunk data!\"\n  124 |                 );\n  125 |             }\n  126 |         },","lines":85,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/png/text.rs#L42-L126"}]},
{"id":"PANIC_14","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"construct_similar_with_new_data reads old_chunk_data[keyword.len() + 1] for the zTXt compression-method check without a bounds check. If the old chunk is just a keyword + NUL this panics. Reached from the XMP-clearing path in clear_metadata on untrusted files.","fix":"Bounds-check old_chunk_data.len() > keyword.len() + 1 before indexing and return an io_error otherwise.","locations":[{"ref":"src/png/text.rs:162","code":"  162 |             if old_chunk_data[keyword.len() + 1] != 0x00","lines":1,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/png/text.rs#L162"}]},
{"id":"PANIC_15","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"get_info_about_iTXt_chunk indexes chunk_data via chunk_counter inside three unbounded loops and at fixed offsets (chunk_counter + 0/1/2) with no length checks. A truncated or malformed iTXt chunk (e.g. a keyword with no terminating NUL, or a NUL with fewer than 2 trailing bytes) causes an out-of-bounds index panic. The chunk comes straight from untrusted file bytes via read_chunk_data.","fix":"Use bounds-checked iteration (e.g. iterate with .get()/find NUL positions) and return an io_error on any chunk that ends before the expected NULs/flags are found, instead of indexing directly.","locations":[{"ref":"src/png/text.rs:254-301","code":"  254 |     loop\n  255 |     {\n  256 |         if chunk_data[chunk_counter] != 0x00\n  257 |         {\n  258 |             keyword_buffer.push(chunk_data[chunk_counter]);\n  259 |             chunk_counter += 1;\n  260 |         }\n  261 |         else\n  262 |         {\n  263 |             break;\n  264 |         }\n  265 |     }\n  266 | \n  267 |     let _null_separator_1  = chunk_data[chunk_counter + 0];\n  268 |     let compression_flag   = chunk_data[chunk_counter + 1];\n  269 |     let compression_method = chunk_data[chunk_counter + 2];\n  270 | \n  271 |     chunk_counter += 3;\n  272 |     let mut language_tag_buffer = Vec::new();\n  273 | \n  274 |     loop \n  275 |     {\n  276 |         if chunk_data[chunk_counter] != 0x00\n  277 |         {\n  278 |             language_tag_buffer.push(chunk_data[chunk_counter]);\n  279 |             chunk_counter += 1;\n  280 |         }\n  281 |         else\n  282 |         {\n  283 |             break;\n  284 |         }\n  285 |     }\n  286 | \n  287 |     chunk_counter += 1;\n  288 |     let mut translated_keyword_buffer = Vec::new();\n  289 | \n  290 |     loop \n  291 |     {\n  292 |         if chunk_data[chunk_counter] != 0x00\n  293 |         {\n  294 |             translated_keyword_buffer.push(chunk_data[chunk_counter]);\n  295 |             chunk_counter += 1;\n  296 |         }\n  297 |         else\n  298 |         {\n  299 |             break;\n  300 |         }\n  301 |     }","lines":48,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/png/text.rs#L254-L301"}]},
{"id":"PANIC_16","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"from_u8_vec (the panicking convenience wrapper of the U8conversion trait) calls panic! on any conversion error. It is invoked all over the EXIF/WebP decoders (exif_tag/mod.rs, exif_tag/decode.rs, webp/vec.rs, webp/file.rs) on raw_data extracted from untrusted image files. Any malformed length / data that makes from_u8_vec_res return Err turns into a process panic instead of a recoverable io::Error, defeating the whole point of the _res variant. A library parsing untrusted files must never panic on bad input.","fix":"Make from_u8_vec return Result, or have all decode call sites use from_u8_vec_res and propagate the error. Do not panic on attacker-controlled data.","locations":[{"ref":"src/u8conversion.rs:21-34","code":"   21 |     fn\n   22 |     from_u8_vec\n   23 |     (\n   24 |         u8_vec: &[u8],\n   25 |         endian: &Endian\n   26 |     )\n   27 |     -> T \n   28 |     {\n   29 |         match Self::from_u8_vec_res(u8_vec, endian)\n   30 |         {\n   31 |             Ok(value) => value,\n   32 |             Err(_)    => panic!(\"from_u8_vec: Mangled EXIF data encountered!\")\n   33 |         }\n   34 |     }","lines":14,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/u8conversion.rs#L21-L34"}]},
{"id":"PANIC_17","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"The Vec<T> from_u8_vec_res implementation calls the panicking from_u8_vec (not from_u8_vec_res) for each element. Although the slice it passes is exactly $number_of_bytes long for the fixed-width numeric types (so they will not error), for uR64/iR64 (build_vec_u8conversion![uR64,8] / [iR64,8]) the per-element length is 8 which matches, but for the String/composite element types the inner conversion can still fail and would panic. More importantly the function is itself reached as from_u8_vec for Vec types via the trait default, so the panic propagates. The error path is silently converted to a panic instead of being returned via the surrounding Result<Vec<_>>.","fix":"Call <$type>::from_u8_vec_res(...)? inside the loop and propagate the error instead of calling the panicking from_u8_vec.","locations":[{"ref":"src/u8conversion.rs:289-298","code":"  289 |                 for i in 0..(u8_vec.len() / $number_of_bytes)\n  290 |                 {\n  291 |                     result.push(\n  292 |                         <$type>::from_u8_vec(\n  293 |                             &u8_vec[(0 + i*$number_of_bytes)..((i+1)*$number_of_bytes)].to_vec(), \n  294 |                             endian\n  295 |                     ) as $type);\n  296 |                 }\n  297 | \n  298 |                 Ok(result)","lines":10,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/u8conversion.rs#L289-L298"}]},
{"id":"PANIC_18","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"update_file_size_information uses assert! macros on values derived from untrusted file content. assert!(old_file_size as i32 > delta) for negative delta, assert!(old_file_size % 2 == 0), and assert!(new_file_size % 2 == 0) will panic the whole process if the on-disk RIFF size field is odd or smaller than the delta. A malicious WebP with an odd size field crashes clear_metadata/write_metadata.","fix":"Replace assert! with graceful io_error! returns. Also note old_file_size as i32 truncates sizes > 2GiB into a negative number (see separate finding).","locations":[{"ref":"src/webp/file.rs:382-389","code":"  382 |     if delta < 0\n  383 |     {\n  384 |         assert!(old_file_size as i32 > delta);\n  385 |     }\n  386 |     let new_file_size = (old_file_size as i32 + delta) as u32;\n  387 | \n  388 |     assert!(old_file_size % 2 == 0);\n  389 |     assert!(new_file_size % 2 == 0);","lines":8,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/webp/file.rs#L382-L389"},{"ref":"src/webp/vec.rs:361-368","code":"  361 |     if delta < 0\n  362 |     {\n  363 |         assert!(old_file_size as i32 > delta);\n  364 |     }\n  365 |     let new_file_size = (old_file_size as i32 + delta) as u32;\n  366 | \n  367 |     assert!(old_file_size % 2 == 0);\n  368 |     assert!(new_file_size % 2 == 0);","lines":8,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/webp/vec.rs#L361-L368"}]},
{"id":"PANIC_19","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"get_dimension_info_from_vp8l_chunk slices payload[1..5] without checking the payload length. A truncated 'VP8L' chunk (payload < 5 bytes) causes an out-of-bounds slice panic. Reachable from convert_to_extended_format in both file.rs and vec.rs when the first chunk is a small/malformed VP8L chunk.","fix":"Verify payload.len() >= 5 before slicing and return an InvalidData error otherwise, or use payload.get(1..5).","locations":[{"ref":"src/webp/file.rs:473","code":"  473 |     let width_height_info_buffer = payload[1..5].to_vec();","lines":1,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/webp/file.rs#L473"},{"ref":"src/webp/vec.rs:442","code":"  442 |     let width_height_info_buffer = payload[1..5].to_vec();","lines":1,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/webp/vec.rs#L442"}]},
{"id":"PANIC_20","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"check_byte_count reads file_buffer[4..8] with a direct index. It is called from vec.rs::check_signature which only guarantees len >= 12, so this is safe there, but check_riff_signature (mod.rs:30) already only uses .get for the first 4 bytes; the [4..8] direct slice here will panic if any caller passes a buffer shorter than 8 bytes. The function takes a raw &[u8] with no length guard of its own, so the safety depends entirely on callers.","fix":"Use file_buffer.get(4..8) and return an InvalidData error if None, making the function self-guarding rather than relying on caller invariants.","locations":[{"ref":"src/webp/mod.rs:78-84","code":"   78 |     let byte_count = from_u8_vec_res_macro!(\n   79 |         u32, \n   80 |         &file_buffer[4..8], \n   81 |         &Endian::Little\n   82 |     )?.checked_add(8).ok_or(\n   83 |         io_error_plain!(InvalidData, \"Can't open WebP file - Byte count in RIFF header is too large!\")\n   84 |     )?;","lines":7,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/webp/mod.rs#L78-L84"}]},
{"id":"PANIC_21","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"get_dimension_info_from_vp8_chunk indexes the payload slice directly (payload[3..=5], payload[6..=7], payload[8..=9]) without verifying the payload length first. A malformed/truncated 'VP8 ' chunk shorter than 10 bytes causes an out-of-bounds slice panic on untrusted input. This is reachable from set_exif_flag -> convert_to_extended_format in file.rs which dispatches a 'VP8 ' chunk's payload straight into this function.","fix":"Check payload.len() >= 10 up front and return io_error!(InvalidData, ...) if too short; use .get(..) returning a proper error instead of panicking index ranges.","locations":[{"ref":"src/webp/mod.rs:158-167","code":"  158 |     let header_magic = payload[3..=5].to_vec();\n  159 |     if \n  160 |         header_magic.len() != 3 || \n  161 |         !matches!(header_magic.as_slice(), &[0x9d, 0x01, 0x2a]) \n  162 |     {\n  163 |         return io_error!(Other, \"Invalid VP8 Frame Header Magic\");\n  164 |     }\n  165 | \n  166 |     let header_width_bytes  = payload[6..=7].to_vec();\n  167 |     let header_height_bytes = payload[8..=9].to_vec();","lines":10,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/webp/mod.rs#L158-L167"},{"ref":"src/webp/file.rs:414-415","code":"  414 |         \"VP8 \" \n  415 |             => get_dimension_info_from_vp8_chunk(first_chunk.payload()),","lines":2,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/webp/file.rs#L414-L415"}]},
{"id":"PANIC_22","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"bytes_per_component panics via `panic!` on an unrecognized format value. It is only reachable from a valid ExifTagFormat today, but it is a public method and the panic arm is a latent crash if the enum ever gains a variant without updating this match; returning a Result or being exhaustive over the enum would be safer for a library that processes untrusted data.","fix":"Match directly on the ExifTagFormat variants (exhaustively, no wildcard) instead of round-tripping through as_u16(), eliminating the unreachable panic arm.","locations":[{"ref":"src/exif_tag_format.rs:91-114","code":"   91 | \tpub fn\n   92 | \tbytes_per_component\n   93 | \t(\n   94 | \t\t&self\n   95 | \t)\n   96 | \t-> u32\n   97 | \t{\n   98 | \t\tmatch self.as_u16()\n   99 | \t\t{\n  100 | \t\t\t0x0001  => 1,\n  101 | \t\t\t0x0002  => 1,\n  102 | \t\t\t0x0003  => 2,\n  103 | \t\t\t0x0004  => 4,\n  104 | \t\t\t0x0005  => 8,\n  105 | \t\t\t0x0006  => 1,\n  106 | \t\t\t0x0007  => 1,\n  107 | \t\t\t0x0008  => 2,\n  108 | \t\t\t0x0009  => 4,\n  109 | \t\t\t0x000a  => 8,\n  110 | \t\t\t0x000b  => 4,\n  111 | \t\t\t0x000c  => 8,\n  112 | \t\t\t_       => panic!(\"Invalid format value for ExifTagFormat!\"),\n  113 | \t\t}\n  114 | \t}","lines":24,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/exif_tag_format.rs#L91-L114"}]},
{"id":"PANIC_23","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"set_box_type_via_string panics with `panic!(\"Invalid box type string length\")` if the provided type string is not exactly 4 bytes. Although current callers pass 4-char literals, this is a panic path on a string argument and a foot-gun; create_new_single_item_reference_box forwards a `reference_type: &str` here.","fix":"Return a Result instead of panicking, or assert/validate length at the caller; for an internal-only helper, document and debug_assert the 4-byte invariant.","locations":[{"ref":"src/heif/box_header.rs:199-212","code":"  199 |     pub(super) fn\n  200 |     set_box_type_via_string\n  201 |     (\n  202 |         &mut self,\n  203 |         new_type: &str\n  204 |     )\n  205 |     {\n  206 |         self.box_type = BoxType::from_4_bytes(\n  207 |             match new_type.as_bytes().try_into() {\n  208 |                 Ok(arr) => arr,\n  209 |                 Err(_) => panic!(\"Invalid box type string length\"),\n  210 |             }\n  211 |         );\n  212 |     }","lines":14,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/heif/box_header.rs#L199-L212"}]},
{"id":"PANIC_24","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"get_version() calls `self.version.expect(...)`, panicking if version is None. read_from_cursor in item_location.rs calls header.get_version() for every iloc entry; iloc always extends fullbox so version is Some, but other_boxes inside a meta box are dispatched generically and any non-fullbox header passed to a code path calling get_version would panic. The serialize paths also expect() version/flags.","fix":"Have get_version return Result/Option and handle the None case at call sites instead of expect().","locations":[{"ref":"src/heif/box_header.rs:214-222","code":"  214 |     pub(super) fn\n  215 |     get_version\n  216 |     (\n  217 |         &self\n  218 |     )\n  219 |     -> u8\n  220 |     {\n  221 |         return self.version.expect(\"BoxHeader: version is not set\");\n  222 |     }","lines":9,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/heif/box_header.rs#L214-L222"},{"ref":"src/heif/box_header.rs:259-260","code":"  259 |             serialized.push(self.version.expect(\"BoxHeader: version is not set when serializing\"));\n  260 |             for flag in self.flags.expect(\"BoxHeader: flags not set when serializing\")","lines":2,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/heif/box_header.rs#L259-L260"}]},
{"id":"PANIC_25","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"create_new_item_reference_box_if_none_exists_yet uses `.expect(\"Could not find iinf box to insert iref before\")`. This runs during write when adding a new EXIF area to a file that has a meta box but no iinf box (a malformed but parseable HEIF). The expect panics instead of returning an error.","fix":"Return a Result and propagate an InvalidData error when no iinf box is present, or insert the iref at a sensible default position.","locations":[{"ref":"src/heif/boxes/meta.rs:141-144","code":"  141 |         let index = self.other_boxes\n  142 |             .iter()\n  143 |             .position(|x| x.get_header().get_box_type() == BoxType::iinf)\n  144 |             .expect(\"Could not find iinf box to insert iref before\");","lines":4,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/heif/boxes/meta.rs#L141-L144"}]},
{"id":"PANIC_26","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"assert!(item.extents.len() == 1, ...) in generic_write_metadata panics on a malformed file where the EXIF item has more than one extent. The preceding `.any()` check only requires one matching extent, so a file with multiple extents (one matching old_exif_pos) aborts via assert! during write.","fix":"Replace the assert! with a returned io_error!(InvalidData/Unsupported, ...).","locations":[{"ref":"src/heif/container.rs:468-473","code":"  468 |             if item.extents.iter()\n  469 |                 .any(|extent| {\n  470 |                     item.base_offset + extent.extent_offset == old_exif_pos\n  471 |                 })\n  472 |             {\n  473 |                 assert!(item.extents.len() == 1, \"Expect to have exactly one extent info for EXIF!\");","lines":6,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/heif/container.rs#L468-L473"}]},
{"id":"PANIC_27","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"In encode_ifd, when a tag is a string the padding length is `number_of_components as usize - value.len()`. number_of_components for a string is `value.len() + 1`, so this is normally fine, but if a tag's number_of_components is ever smaller than value.len() (e.g. a fixed-component STRING tag like ModifyDate/DateTimeOriginal whose user-set value is longer than the predefined component count) the subtraction underflows usize and panics on `vec![0x00; ...]`.","fix":"Use saturating_sub or compute padding as `number_of_components.saturating_sub(value.len() as u32) as usize`, and/or validate that fixed-length string tags are not longer than their component count.","locations":[{"ref":"src/ifd/mod.rs:639-643","code":"  639 |                 string_padding = vec![\n  640 |                     0x00; \n  641 |                     number_of_components as usize - value.len()\n  642 |                 ];\n  643 |             }","lines":5,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/ifd/mod.rs#L639-L643"}]},
{"id":"PANIC_28","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"generic_write_metadata indexes chunks[0].length() to obtain the IHDR length. If generic_parse_png returns Ok with an empty Vec (it cannot today because it loops until IEND, but the code does not assert IHDR is first), chunks[0] would panic. More concretely, IHDR_length is taken from chunks[0] without verifying chunks[0] is actually the IHDR chunk; a PNG whose first chunk is not IHDR yields a wrong insert offset.","fix":"Verify chunks is non-empty and chunks[0].as_string() == \"IHDR\" before using its length; return an io_error otherwise.","locations":[{"ref":"src/png/mod.rs:668-680","code":"  668 |     let mut IHDR_length = 0u32;\n  669 | \n  670 |     if let Ok(chunks) = generic_parse_png(cursor)\n  671 |     {\n  672 |         IHDR_length = chunks[0].length();\n  673 |     }\n  674 | \n  675 |     // Encode the data specifically for PNG and open the image file\n  676 |     let encoded_metadata = encode_metadata_png(&metadata.encode()?);\n  677 |     let seek_start = 0u64         // Skip ...\n  678 |     + PNG_SIGNATURE.len() as u64  // PNG Signature\n  679 |     + IHDR_length         as u64  // IHDR data section\n  680 |     + 12                        ; // rest of IHDR chunk (length, type, CRC)","lines":13,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/png/mod.rs#L668-L680"}]},
{"id":"PANIC_29","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"encode_metadata_png builds vec![SPACE; 8 - ssss.len()]. ssss is the decimal length of (EXIF_HEADER + exif_vec + 1). If the EXIF payload is large enough that this decimal string reaches 8+ digits (>= 10 MB), 8 - ssss.len() underflows usize and panics. This is on the write path with user-supplied metadata, not file parsing, but still a crash on legitimately large metadata.","fix":"Use saturating_sub or explicitly handle ssss.len() >= 8; PNG/this encoding cannot represent such sizes in 8 chars, so return an error for oversized metadata.","locations":[{"ref":"src/png/mod.rs:706-718","code":"  706 |     let ssss = (\n  707 |         EXIF_HEADER.len() as u32 \n  708 |         + exif_vec.len()  as u32 \n  709 |         + 1\n  710 |     ).to_string();\n  711 | \n  712 |     // Construct final vector with the bytes as they will be sent to the encoder\n  713 |     //                               \\n       e     x     i     f     \\n\n  714 |     let mut png_exif: Vec<u8> = vec![NEWLINE, 0x65, 0x78, 0x69, 0x66, NEWLINE];\n  715 | \n  716 |     // Write ssss, padded to 8 bytes with leading spaces\n  717 |     png_exif.extend(vec![SPACE; 8 - ssss.len()]);\n  718 |     png_exif.extend(ssss.as_bytes().to_vec().iter());","lines":13,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/png/mod.rs#L706-L718"}]},
{"id":"PANIC_30","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"clear_metadata in file.rs computes file.set_len(old_file_byte_count - parsed_chunk_byte_count). old_file_byte_count is the live file length and parsed_chunk_byte_count is derived from untrusted descriptor sizes; if the descriptor sizes (attacker-controlled) sum larger than the actual file, this usize subtraction underflows and panics in debug / wraps to a huge length in release.","fix":"Use checked_sub and return an error if the chunk byte count exceeds the current file size.","locations":[{"ref":"src/webp/file.rs:612-631","code":"  612 |         let old_file_byte_count = file.metadata()?.len();\n  613 | \n  614 |         // Get a backup of the current cursor position\n  615 |         let exif_chunk_start_cursor_position = SeekFrom::Start(file.stream_position()?);\n  616 | \n  617 |         // Skip the EXIF chunk ...\n  618 |         file.seek(std::io::SeekFrom::Current(parsed_chunk_byte_count as i64))?;\n  619 | \n  620 |         // ...and copy everything afterwards into a buffer...\n  621 |         let mut buffer = Vec::new();\n  622 |         file.read_to_end(&mut buffer)?;\n  623 | \n  624 |         // ...and seek back to where the EXIF chunk is located...\n  625 |         file.seek(exif_chunk_start_cursor_position)?;\n  626 | \n  627 |         // ...and overwrite the EXIF chunk...\n  628 |         file.write_all(&buffer)?;\n  629 | \n  630 |         // ...and finally update the size of the file\n  631 |         file.set_len(old_file_byte_count - parsed_chunk_byte_count)?;","lines":20,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/webp/file.rs#L612-L631"}]},
{"id":"PANIC_31","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"vec.rs set_exif_flag writes cursor.get_mut()[20] and reads cursor.get_ref()[20] with direct indexing. The buffer is only guaranteed to be >= 12 bytes by check_signature; if the file has a VP8X header chunk descriptor present in parse but the underlying buffer is shorter than 21 bytes (e.g. truncated after the header), this indexes out of bounds and panics. Index 20 is the flag byte (12 + 4 + 4).","fix":"Bounds-check buffer length >= 21 before indexing byte 20, returning an error otherwise.","locations":[{"ref":"src/webp/vec.rs:498-505","code":"  498 |     cursor.get_mut()[20] = if exif_flag_value\n  499 |     {\n  500 |         cursor.get_ref()[20] | 0x08\n  501 |     }\n  502 |     else\n  503 |     {\n  504 |         cursor.get_ref()[20] & 0b11110111\n  505 |     };","lines":8,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/webp/vec.rs#L498-L505"}]},
{"id":"PANIC_32","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"remove_exif_from_xmp asserts assert_eq!(skip_depth, 0) when reaching Eof. XMP data comes from untrusted image files; a malformed XMP packet with unbalanced exif: start/end tags (more starts than ends) reaches Eof with skip_depth > 0 and panics the whole process. A parser of untrusted metadata must not assert on input shape.","fix":"Replace the assert with graceful handling: log a warning / return an error, or simply break without asserting.","locations":[{"ref":"src/xmp.rs:78-81","code":"   78 |             Ok(Event::Eof) => {\n   79 |                 assert_eq!(skip_depth, 0);\n   80 |                 break;\n   81 |             }","lines":4,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/xmp.rs#L78-L81"}]},
{"id":"PANIC_33","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`get_ifd_mut` uses `.expect(\"Item should be already created above\")`. The invariant holds today, but it relies on `create_ifd` always producing the requested (group, number) IFD. `create_ifd` early-returns if `get_ifd` already finds it and otherwise pushes a new one, so the expect should hold; however it is a panic path in a public API on internally mutable state. Library lint `#![warn(clippy::unwrap_used)]` signals intent to avoid such patterns, yet expect bypasses it.","fix":"Return the freshly pushed IFD directly from `create_ifd` (e.g. have it return `&mut ImageFileDirectory`) so no fallible re-lookup/expect is needed.","locations":[{"ref":"src/metadata/get.rs:100-104","code":"  100 |         return self.image_file_directories.iter_mut().find(|ifd| \n  101 |             ifd.get_generic_ifd_nr() == generic_ifd_nr &&\n  102 |             ifd.get_ifd_type()       == group\n  103 |         ).expect(\"Item should be already created above\");\n  104 |     }","lines":5,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/metadata/get.rs#L100-L104"}]},
{"id":"PANIC_34","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"range_remove indexes vec[start + dst_offset] and vec[src_index] in the shifting loop without validating start <= old_vec_len. The guards only cover start > end (return) and end >= old_vec_len (truncate). If a caller passes start <= end < old_vec_len but start > old_vec_len is impossible given those, yet start can equal a value up to end; if end < old_vec_len then start < old_vec_len too, so indices are in range. The real risk: this function takes raw usize start/end with no relation to the data and silently does nothing on start>end. A caller computing start/end from untrusted offsets that are swapped or out of range gets silent data loss rather than an error.","fix":"Validate the indices against vec.len() and return a Result (or document explicitly that out-of-range/swapped inputs are silently ignored), so callers cannot silently corrupt the buffer.","locations":[{"ref":"src/util.rs:272-298","code":"  272 | pub(crate) fn\n  273 | range_remove<T>\n  274 | (\n  275 |     vec:   &mut Vec<T>,\n  276 |     start: usize,\n  277 |     end:   usize\n  278 | )\n  279 | where T: Copy\n  280 | {\n  281 |     // Invalid input, nothing to do here\n  282 |     if start > end { return; }\n  283 | \n  284 |     let old_vec_len = vec.len();\n  285 | \n  286 |     // Simply truncating is sufficient in this case\n  287 |     if end >= old_vec_len { vec.truncate(start); return; }\n  288 | \n  289 |     // Otherwise, move the elements starting at end over to the left\n  290 |     for (dst_offset, src_index) in (end..old_vec_len).enumerate()\n  291 |     {\n  292 |         vec[start + dst_offset] = vec[src_index];\n  293 |     }\n  294 | \n  295 |     // Resize the vector to cut off any residue from the shifting operations\n  296 |     let new_vec_len = old_vec_len - (end - start);\n  297 |     vec.truncate(new_vec_len);\n  298 | }","lines":27,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/util.rs#L272-L298"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"`first.extent_offset + exif_item.base_offset` can overflow u64 in debug builds (panic) or wrap in release. Both summands come straight from untrusted iloc fields (base_offset up to 8 bytes, extent_offset up to 8 bytes), so a malformed file with large values triggers the overflow.","fix":"Use checked_add and return an InvalidData error on overflow.","locations":[{"ref":"src/heif/container.rs:176-179","code":"  176 |                     return Ok((\n  177 |                         first.extent_offset + exif_item.base_offset,\n  178 |                         first.extent_length\n  179 |                     ));","lines":4,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/heif/container.rs#L176-L179"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"`item.base_offset + extent.extent_offset` is computed in multiple places on untrusted u64 offsets without overflow protection; overflows panic in debug and wrap in release, and the wrapped value can then equal old_exif_pos and mis-trigger the EXIF-extent update logic. Same unchecked addition recurs at lines 524 and 536.","fix":"Use checked_add (or saturating_add with an explicit validity check) for combining base_offset and extent_offset everywhere.","locations":[{"ref":"src/heif/container.rs:470","code":"  470 |                     item.base_offset + extent.extent_offset == old_exif_pos","lines":1,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/heif/container.rs#L470"},{"ref":"src/heif/container.rs:524","code":"  524 |                         item.base_offset + extent.extent_offset >= old_exif_pos","lines":1,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/heif/container.rs#L524"},{"ref":"src/heif/container.rs:536","code":"  536 |                 let complete_offset = item.base_offset + extent.extent_offset;","lines":1,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/heif/container.rs#L536"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"encode_ifd computes `byte_count: u32 = number_of_components * tag.format().bytes_per_component()` with an unchecked multiplication. number_of_components is derived from value vector lengths (which can come from decoded untrusted data, e.g. a large UNDEF/STRING). For large component counts this multiply can overflow u32 and wrap, producing a wrong byte_count and corrupt/short output (in debug builds it panics).","fix":"Use checked_mul and propagate an io_error on overflow, mirroring the decode-side check at decode.rs/mod.rs:190.","locations":[{"ref":"src/ifd/mod.rs:648","code":"  648 |             let byte_count: u32 = number_of_components * tag.format().bytes_per_component();","lines":1,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/ifd/mod.rs#L648"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"In clear_segment the segment length is decoded and `(length - 2)` is computed with no check that `length >= 2`, unlike generic_read_metadata which guards this exact case (see lines 461-464). A malformed JPG with an APP segment declaring length 0 or 1 underflows: in debug builds this panics, in release it wraps to a huge usize that is then used as `cursor.seek(SeekFrom::Current(remaining_length as i64))` and for slice arithmetic, corrupting the clear operation.","fix":"Mirror generic_read_metadata: after decoding `length`, return io_error!(InvalidData, \"Mangled JPG data encountered!\") if length < 2 before computing remaining_length.","locations":[{"ref":"src/jpg.rs:155-156","code":"  155 |             let length = from_u8_vec_res_macro!(u16, &length_buffer, &Endian::Big)?;\n  156 |             let remaining_length = (length - 2) as usize;","lines":2,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/jpg.rs#L155-L156"}]},
{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"easy","description":"jxl::file_clear_metadata decodes box `length` with no lower-bound check and then computes `(length-8) as i64` (lines 194 and 216) and `old_file_length - length as u64` (line 210). A box claiming length < 8 underflows `length-8` (panic in debug / huge seek in release); a length larger than the remaining file underflows `old_file_length - length` causing a panic. These derive directly from untrusted file bytes.","fix":"After decoding length, return an io_error unless `length >= 8` and `length as u64 <= old_file_length - position`. Use checked_sub for old_file_length - length.","locations":[{"ref":"src/jxl.rs:189-216","code":"  189 |         let length = from_u8_vec_res_macro!(u32, &length_buffer, &Endian::Big)? as usize;\n  190 | \n  191 |         if box_contains_exif(&mut file, type_buffer)?\n  192 |         {\n  193 |             // Seek past the EXIF box ...\n  194 |             file.seek(SeekFrom::Current((length-8) as i64))?;\n  195 | \n  196 | \n  197 |             // ... copy everything from here onwards into a buffer ...\n  198 |             let mut buffer = Vec::new();\n  199 |             file.read_to_end(&mut buffer)?;\n  200 | \n  201 |             // ... seek back to the start of the EXIF box ...\n  202 |             file.seek(std::io::SeekFrom::Start(position))?;\n  203 | \n  204 |             // ... overwrite everything from here onward ...\n  205 |             file.write_all(&buffer)?;\n  206 |             file.seek(std::io::SeekFrom::Start(position))?;\n  207 | \n  208 |             // ... and finally update the file size - otherwise there will be\n  209 |             // duplicate bytes at the end!\n  210 |             file.set_len(old_file_length - length as u64)?;\n  211 |         }\n  212 |         else\n  213 |         {\n  214 |             // Not an EXIF box so skip it\n  215 |             assert_eq!(position+8, file.stream_position()?);\n  216 |             file.seek(SeekFrom::Current((length-8) as i64))?;","lines":28,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/jxl.rs#L189-L216"}]},
{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"IFD offsets read from the file are 32-bit unsigned values but are cast to `i64` and applied via `SeekFrom::Current(ifd_offset as i64)` relative to `data_start_position`. While the i64 cast itself is lossless, there is no bound check that the resulting absolute position lies within the buffer. More importantly the offset is fully attacker controlled and combined with repeated seeks; a crafted chain can drive the cursor to arbitrary positions. The loop also has no cap on the number of IFDs followed, so a file with a self-referential/cyclic or very long IFD0->next chain causes effectively unbounded iteration (`generic_ifd_nr += 1` each pass) - a denial-of-service. There is no visited-offset tracking to detect cycles.","fix":"Track already-visited IFD offsets in a HashSet and bail out (or return an error) on revisit to break cycles. Add an upper bound on the number of IFDs decoded. Validate that `data_start_position + ifd_offset` is within the buffer length before seeking.","locations":[{"ref":"src/metadata/mod.rs:307-324","code":"  307 |         while let Some(ifd_offset) = ifd_offset_option\n  308 |         {\n  309 |             data_cursor.set_position(data_start_position);\n  310 |             data_cursor.seek(std::io::SeekFrom::Current(ifd_offset as i64))?;\n  311 | \n  312 |             let decode_result = ImageFileDirectory::decode_ifd(\n  313 |                 data_cursor,\n  314 |                 data_start_position,\n  315 |                 &endian,\n  316 |                 &ExifTagGroup::GENERIC,\n  317 |                 generic_ifd_nr,\n  318 |                 &mut ifds\n  319 |             );\n  320 | \n  321 |             ifd_offset_option = decode_result?;\n  322 | \n  323 |             generic_ifd_nr += 1;\n  324 |         }","lines":18,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/metadata/mod.rs#L307-L324"}]},
{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"read_chunk_data allocates vec![0u8; chunk_length] where chunk_length is the attacker-controlled 32-bit PNG chunk length (up to ~4 GiB). A malformed PNG declaring a huge chunk length triggers a multi-gigabyte allocation (memory-exhaustion DoS) before the short-read check can fire. PNG also caps chunk length at 2^31-1, which is not enforced.","fix":"Reject chunk_length above the PNG limit (2^31-1) and/or above the remaining stream length before allocating; consider reading incrementally.","locations":[{"ref":"src/png/read.rs:44-62","code":"   44 | pub(super) fn\n   45 | read_chunk_data\n   46 | <T: Seek + Read>\n   47 | (\n   48 |     cursor:       &mut T,\n   49 |     chunk_length: usize,\n   50 | )\n   51 | -> Result<Vec<u8>, std::io::Error>\n   52 | {\n   53 |     let mut chunk_data_buffer = vec![0u8; chunk_length];\n   54 |     let     bytes_read        = cursor.read(&mut chunk_data_buffer)?;\n   55 |     \n   56 |     if bytes_read != chunk_length\n   57 |     {\n   58 |         return io_error!(Other, \"Could not read chunk data\");\n   59 |     }\n   60 | \n   61 |     return Ok(chunk_data_buffer);\n   62 | }","lines":19,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/png/read.rs#L44-L62"}]},
{"id":"OVF_8","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"Chunk length padding can overflow: chunk_length += chunk_length % 2 where chunk_length is a u32 read from untrusted input. If chunk_length == u32::MAX (odd), adding 1 overflows and panics in debug builds (wraps to 0 in release, causing a zero-length read and mis-parse). The value comes directly from the file's 4-byte little-endian size field.","fix":"Use chunk_length = chunk_length.checked_add(chunk_length % 2) and return an error on overflow, or compute on u64.","locations":[{"ref":"src/webp/file.rs:80-83","code":"   80 |     let mut chunk_length = from_u8_vec_res_macro!(u32, &chunk_start[4..8], &Endian::Little)?;\n   81 | \n   82 |     // Account for the possible padding byte\n   83 |     chunk_length += chunk_length % 2;","lines":4,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/webp/file.rs#L80-L83"},{"ref":"src/webp/vec.rs:70-73","code":"   70 |     let mut chunk_length = from_u8_vec_res_macro!(u32, &chunk_start[4..8], &Endian::Little)?;\n   71 | \n   72 |     // Account for the possible padding byte\n   73 |     chunk_length += chunk_length % 2;","lines":4,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/webp/vec.rs#L70-L73"}]},
{"id":"OVF_9","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"update_file_size_information casts old_file_size (u32) to i32 and computes (old_file_size as i32 + delta) as u32. For files where the RIFF size field exceeds i32::MAX (> ~2GiB, valid u32 range), `old_file_size as i32` becomes negative, the comparison and arithmetic are wrong, and the resulting size is corrupted. The intermediate i32 add can also overflow and panic in debug.","fix":"Do the arithmetic in i64/u64: new_size = old_file_size as i64 + delta as i64, validate it is non-negative and even and fits in u32, then cast back.","locations":[{"ref":"src/webp/file.rs:379-389","code":"  379 |     let old_file_size = from_u8_vec_res_macro!(u32, &file_size_buffer, &Endian::Little)?;\n  380 | \n  381 |     // ...adding the delta byte count (and performing some checks)...\n  382 |     if delta < 0\n  383 |     {\n  384 |         assert!(old_file_size as i32 > delta);\n  385 |     }\n  386 |     let new_file_size = (old_file_size as i32 + delta) as u32;\n  387 | \n  388 |     assert!(old_file_size % 2 == 0);\n  389 |     assert!(new_file_size % 2 == 0);","lines":11,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/webp/file.rs#L379-L389"},{"ref":"src/webp/vec.rs:358-368","code":"  358 |     let old_file_size = from_u8_vec_res_macro!(u32, &file_size_buffer, &Endian::Little)?;\n  359 | \n  360 |     // ...adding the delta byte count (and performing some checks)...\n  361 |     if delta < 0\n  362 |     {\n  363 |         assert!(old_file_size as i32 > delta);\n  364 |     }\n  365 |     let new_file_size = (old_file_size as i32 + delta) as u32;\n  366 | \n  367 |     assert!(old_file_size % 2 == 0);\n  368 |     assert!(new_file_size % 2 == 0);","lines":11,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/webp/vec.rs#L358-L368"}]},
{"id":"OVF_10","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","difficulty":"medium","description":"vec.rs get_next_chunk allocates vec![0u8; chunk_length as usize] from the untrusted, attacker-controlled 32-bit chunk_length with no sanity bound against the remaining buffer length. A small file claiming a multi-GB chunk forces a huge allocation (potential OOM / DoS). The subsequent read only reads what is available and then errors, but the allocation already happened. file.rs has the same pattern (file.rs:86) though a File read is bounded by EOF.","fix":"Clamp chunk_length to the remaining bytes (buffer length / file size) before allocating, returning an error if it exceeds the data actually available.","locations":[{"ref":"src/webp/vec.rs:76","code":"   76 |     let mut chunk_data_buffer = vec![0u8; chunk_length as usize];","lines":1,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/webp/vec.rs#L76"},{"ref":"src/webp/file.rs:86","code":"   86 |     let mut chunk_data_buffer = vec![0u8; chunk_length as usize];","lines":1,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/webp/file.rs#L86"}]},
{"id":"OVF_11","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"ItemInfoBox::construct_from_cursor reads item_count as u16/u32 from the file then loops `for _ in 0..item_count` pushing into a Vec with no upper bound or try_reserve. A version!=0 iinf box can declare item_count up to u32::MAX, causing a huge pre-allocation/loop before the underlying cursor returns EOF.","fix":"Bound item_count against the remaining bytes of the iinf box (each entry is at least a header) before iterating.","locations":[{"ref":"src/heif/boxes/item_info.rs:198-215","code":"  198 |         let item_count = if header.get_version() == 0\n  199 |         {\n  200 |             read_be_u16(cursor)? as usize\n  201 |         }\n  202 |         else\n  203 |         {\n  204 |             read_be_u32(cursor)? as usize\n  205 |         };\n  206 | \n  207 |         let mut items = Vec::new();\n  208 |         for _ in 0..item_count\n  209 |         {\n  210 |             let header = BoxHeader::read_box_header(cursor)?;\n  211 |             items.push(ItemInfoEntryBox::construct_from_cursor_unboxed(\n  212 |                 cursor, \n  213 |                 header\n  214 |             )?);\n  215 |         }","lines":18,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/heif/boxes/item_info.rs#L198-L215"}]},
{"id":"OVF_12","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"extent_count is read as u16 but the spec allows version-dependent 16-bit count; the loop `for _ in 0..extent_count` allocates one ItemLocationEntryExtentEntry per count with no cross-check against the box size. A crafted iloc with item_count and extent_count maxima forces many small reads; each read is bounded by cursor EOF so it errors eventually, but item_count (up to u32::MAX for version 2) drives an unbounded `Vec::push` loop with no try_reserve, risking large allocation before EOF is hit.","fix":"Validate item_count/extent_count against remaining box bytes before looping, or grow the vec via try_reserve and bail on allocation failure.","locations":[{"ref":"src/heif/boxes/item_location.rs:327-338","code":"  327 |         let mut items = Vec::new();\n  328 |         for _ in 0..item_count\n  329 |         {\n  330 |             items.push(ItemLocationEntry::read_from_cursor(\n  331 |                 cursor, \n  332 |                 &header, \n  333 |                 offset_size, \n  334 |                 length_size, \n  335 |                 base_offset_size, \n  336 |                 index_size\n  337 |             )?);\n  338 |         }","lines":12,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/heif/boxes/item_location.rs#L327-L338"},{"ref":"src/heif/boxes/item_location.rs:196-209","code":"  196 |         let extent_count = read_be_u16(cursor)?;\n  197 | \n  198 |         let mut extents = Vec::new();\n  199 | \n  200 |         for _ in 0..extent_count\n  201 |         {\n  202 |             extents.push(ItemLocationEntryExtentEntry::read_from_cursor(\n  203 |                 cursor, \n  204 |                 header, \n  205 |                 offset_size, \n  206 |                 length_size, \n  207 |                 index_size\n  208 |             )?);\n  209 |         }","lines":14,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/heif/boxes/item_location.rs#L196-L209"}]},
{"id":"OVF_13","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"`old_largest_id + 1` can overflow u32 if an existing item already has item_id u32::MAX. Item IDs are read from untrusted files, so a file containing an item with id 0xFFFFFFFF makes create_new_item_location_entry overflow (panic in debug). The resulting id is also later truncated to u16 in the iinf entry, which is a separate silent-truncation concern.","fix":"Use checked_add and return an error if no free id is available; reconcile u32 item_id vs u16 truncation used by create_new_item_info_entry.","locations":[{"ref":"src/heif/boxes/item_location.rs:380-388","code":"  380 |         let old_largest_id = self.items\n  381 |             .iter()\n  382 |             .map(|x| x.item_id)\n  383 |             .max()\n  384 |             .unwrap_or(0);\n  385 | \n  386 |         self.items.push(ItemLocationEntry \n  387 |             {\n  388 |                 item_id:                          old_largest_id + 1, ","lines":9,"link":"https://github.com/TechnikTobi/little_exif/blob/2c86b66d2feeb1498180ec33cca5aab60239dfbd/src/heif/boxes/item_location.rs#L380-L388"}]},
