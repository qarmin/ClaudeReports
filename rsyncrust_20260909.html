{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`KqueueLoop::wait_with_capacity` decodes every returned `libc::kevent` via\n`decode_kevent` and never inspects `EV_ERROR`. When the kernel reports an error\non a registered filter it sets `EV_ERROR` in `flags` and stuffs the errno into\nthe `data` field; the event is still returned by `kevent(2)`. The decode path\nturns this into a normal `KEvent` whose `data` (the errno) is misinterpreted as\n\"bytes available / writable\" per the `KEvent::data` doc. A consumer that reads\n`ev.data` as a byte count after an EV_ERROR event would act on a bogus value\n(e.g. treat an errno like EBADF=9 as 9 readable bytes). `KEvent::is_error()`\nexists but is never consulted internally, and nothing surfaces the error to the\ncaller.","fix":"In the wait decode path, check `ev.flags & libc::EV_ERROR`; when set, either\nsurface it as an `io::Error::from_raw_os_error(ev.data as i32)` or filter the\nevent out / flag it so consumers do not read `data` as a byte count. At minimum\ndocument that `data` is an errno when `is_error()` is true.","locations":[{"ref":"crates/fast_io/src/kqueue/mod.rs:245-263","code":"  245 |     pub fn wait_with_capacity(\n  246 |         &self,\n  247 |         timeout: Option<Duration>,\n  248 |         max_events: usize,\n  249 |     ) -> io::Result<Vec<KEvent>> {\n  250 |         let max_events = max_events.max(1);\n  251 |         let mut events: Vec<libc::kevent> = (0..max_events).map(|_| empty_kevent()).collect();\n  252 |         let ts = timeout.map(duration_to_timespec);\n  253 |         let returned = match self.kevent_call(None, Some(&mut events), ts.as_ref()) {\n  254 |             Ok(n) => n,\n  255 |             Err(err) if err.kind() == io::ErrorKind::Interrupted => return Ok(Vec::new()),\n  256 |             Err(err) => return Err(err),\n  257 |         };\n  258 |         Ok(events\n  259 |             .into_iter()\n  260 |             .take(returned as usize)\n  261 |             .filter_map(decode_kevent)\n  262 |             .collect())\n  263 |     }","lines":19,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/fast_io/src/kqueue/mod.rs#L245-L263"},{"ref":"crates/fast_io/src/kqueue/mod.rs:348-357","code":"  348 | fn decode_kevent(ev: libc::kevent) -> Option<KEvent> {\n  349 |     let filter = KEventFilter::from_raw(ev.filter)?;\n  350 |     Some(KEvent {\n  351 |         fd: ev.ident as RawFd,\n  352 |         filter,\n  353 |         user_data: ev.udata as u64,\n  354 |         data: ev.data as i64,\n  355 |         flags: ev.flags,\n  356 |     })\n  357 | }","lines":10,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/fast_io/src/kqueue/mod.rs#L348-L357"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`delete_on_close_available` has the same single-global-atomic cache problem as\nthe O_TMPFILE probe: `STATUS` is process-wide but delete-on-close\n(`FileDispositionInfo`) support varies by filesystem/share (e.g. SMB, WebDAV,\nsome network redirectors). The first directory probed fixes the answer for all\nlater directories. A misleading verdict here makes the writer either skip the\ncrash-safe temp path on a capable volume or attempt it on an incapable one.","fix":"Key the cache by volume (e.g. volume serial number from\n`GetVolumeInformationByHandleW`/`GetFileInformationByHandle`) or probe per\ndirectory, mirroring whatever fix the O_TMPFILE probe adopts.","locations":[{"ref":"crates/fast_io/src/win_tmpfile/low_level.rs:326-345","code":"  326 |     pub fn delete_on_close_available(dir: &Path) -> bool {\n  327 |         use std::sync::atomic::AtomicU8;\n  328 | \n  329 |         static STATUS: AtomicU8 = AtomicU8::new(0);\n  330 |         const UNKNOWN: u8 = 0;\n  331 |         const AVAILABLE: u8 = 1;\n  332 |         const UNAVAILABLE: u8 = 2;\n  333 | \n  334 |         let status = STATUS.load(Ordering::Relaxed);\n  335 |         if status != UNKNOWN {\n  336 |             return status == AVAILABLE;\n  337 |         }\n  338 | \n  339 |         let available = probe_delete_on_close(dir);\n  340 |         STATUS.store(\n  341 |             if available { AVAILABLE } else { UNAVAILABLE },\n  342 |             Ordering::Relaxed,\n  343 |         );\n  344 |         available\n  345 |     }","lines":20,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/fast_io/src/win_tmpfile/low_level.rs#L326-L345"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The `C` rule modifier (cvs_mode) is parsed in `parse_modifiers` and stored on\n`RuleModifiers.cvs_mode`, but it is never read anywhere in the crate\n(`RuleModifiers::apply` ignores it and no other code references the field).\nIn upstream rsync the per-rule `C` modifier sets `FILTRULE_CVS_IGNORE`, which\nchanges how a merge/dir-merge file is interpreted (CVS-style: word-split,\nexclude-only, no modifier parsing) and, for a standalone rule, pulls in the\ndefault CVS exclusion list. Here a rule such as `:C .cvsignore` or `-C ...`\nparses without error but silently behaves like a plain rule, so CVS-ignore\nsemantics are dropped. Confirmed via grep: the only references to `cvs_mode`\nare the doc table, the field declaration, and the assignment.","fix":"Either honour the modifier (when `cvs_mode` is set on a merge/dir-merge rule,\nmark the resulting merge rule so its contents are parsed in CVS-ignore mode and\nappend the default CVS patterns; for a non-merge rule, treat it as\n`--cvs-exclude`), or, if CVS-per-rule mode is intentionally unsupported, reject\nthe `C` modifier with a parse error instead of silently accepting and dropping\nit. Add a regression test that a `C`-modified rule changes behaviour.","locations":[{"ref":"crates/filters/src/merge/parse.rs:202","code":"  202 |     pub(crate) cvs_mode: bool,","lines":1,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/filters/src/merge/parse.rs#L202"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"hard","description":"The convenience entry point `read_entry`/`read_file_entry` silently produces a\ncorrupt entry for abbreviated hardlink followers. `read_entry` calls\n`read_entry_with_flist(reader, &[])` with an empty segment slice. When the entry is\nan abbreviated follower (`is_abbreviated_follower` true), the leader lookup\n`segment_entries.get(leader_local_idx)` always returns `None`, so the code takes the\nfallback branch that fabricates zeroed metadata (size 0, mode 0, mtime 0,\ncontent_dir true) WITHOUT updating compression state. Because the compression state\nis not advanced to match the sender's statics, every subsequent entry in the stream\ncan then be decoded with the wrong same_* baseline, cascading into corrupt or\nmis-parsed entries. The fallback comment acknowledges this. The public single-entry\nAPI is thus unsafe to use whenever hardlinks are preserved.","fix":"Either return an explicit error when an abbreviated follower is encountered with no segment_entries available, or document `read_entry`/`read_file_entry` as unusable with preserve_hard_links and steer callers to `read_entry_with_flist`. Do not silently fabricate zeroed metadata and skip the compression-state update.","locations":[{"ref":"crates/protocol/src/flist/read/mod.rs:544-549","code":"  544 |     pub fn read_entry<R: Read + ?Sized>(\n  545 |         &mut self,\n  546 |         reader: &mut R,\n  547 |     ) -> io::Result<Option<FileEntry>> {\n  548 |         self.read_entry_with_flist(reader, &[])\n  549 |     }","lines":6,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/protocol/src/flist/read/mod.rs#L544-L549"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`parse_remote_operand` always returns `port: None`. `validate_same_host` then compares ports across\nmultiple remote sources, but since every parsed operand reports `None`, a real port mismatch (e.g.\n`host:2222:/a` style differences expressed via SSH operand syntax, or genuinely differing user@host\nforms) is never detected here. Port consistency is in practice only enforced later in the SSH\ntransport layer's own parser, so the validation in `validate_same_host` for ports is dead and the\n\"remote sources must use the same port\" error path is unreachable from this function.","fix":"Either parse the port here (reusing the SSH operand parser) so the same-host/port validation is\nmeaningful, or drop the port comparison and its comment to avoid implying a check that never runs.","locations":[{"ref":"crates/core/src/client/remote/invocation/transfer_role.rs:38-67","code":"   38 | fn parse_remote_operand(operand: &str) -> Result<RemoteOperandParsed, ClientError> {\n   39 |     let operand_str = operand.to_owned();\n   40 | \n   41 |     let colon_pos = operand.rfind(':').ok_or_else(|| {\n   42 |         invalid_argument_error(\n   43 |             &format!(\"invalid remote operand: missing ':' in {operand}\"),\n   44 |             1,\n   45 |         )\n   46 |     })?;\n   47 | \n   48 |     let host_part = &operand[..colon_pos];\n   49 | \n   50 |     let (user, host_with_port) = if let Some(at_pos) = host_part.find('@') {\n   51 |         let user = host_part[..at_pos].to_string();\n   52 |         let host = &host_part[at_pos + 1..];\n   53 |         (Some(user), host)\n   54 |     } else {\n   55 |         (None, host_part)\n   56 |     };\n   57 | \n   58 |     let host = host_with_port.to_owned();\n   59 |     let port = None;\n   60 | \n   61 |     Ok(RemoteOperandParsed {\n   62 |         operand: operand_str,\n   63 |         host,\n   64 |         user,\n   65 |         port,\n   66 |     })\n   67 | }","lines":30,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/core/src/client/remote/invocation/transfer_role.rs#L38-L67"},{"ref":"crates/core/src/client/remote/invocation/transfer_role.rs:111-116","code":"  111 |         if operand.port != first.port {\n  112 |             return Err(invalid_argument_error(\n  113 |                 \"remote sources must use the same port\",\n  114 |                 1,\n  115 |             ));\n  116 |         }","lines":6,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/core/src/client/remote/invocation/transfer_role.rs#L111-L116"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`parse_ssh_uri` detects rsync daemon syntax by searching for the first `::` anywhere in the string.\nAn IPv6 literal host such as `user@[2001:db8::1]:/path` contains `::` inside the bracketed address,\nso the function classifies the whole input as daemon syntax and returns\n`(\"user\", \"[2001:db8\", \":1]:/path\")` instead of splitting at the trailing `:` for the path. Plain\nIPv6 SSH targets are likewise mis-split by the later single-colon search. Hostnames with bracketed\nIPv6 are silently parsed into garbage user/host/path components.","fix":"Handle a leading `[...]` bracketed IPv6 literal before scanning for `::`/`:`: find the closing `]`\nand only look for separators after it, mirroring how rsync/ssh parse bracketed IPv6 hosts.","locations":[{"ref":"crates/core/src/remote_shell.rs:311-336","code":"  311 | pub fn parse_ssh_uri(uri: &str) -> Option<(Option<&str>, &str, &str)> {\n  312 |     if let Some(double_colon_pos) = uri.find(\"::\") {\n  313 |         let host_part = &uri[..double_colon_pos];\n  314 |         let path_part = &uri[double_colon_pos..];\n  315 | \n  316 |         if let Some(at_pos) = host_part.find('@') {\n  317 |             let user = &host_part[..at_pos];\n  318 |             let host = &host_part[at_pos + 1..];\n  319 |             return Some((Some(user), host, path_part));\n  320 |         } else {\n  321 |             return Some((None, host_part, path_part));\n  322 |         }\n  323 |     }\n  324 | \n  325 |     let colon_pos = uri.find(':')?;\n  326 |     let host_part = &uri[..colon_pos];\n  327 |     let path_part = &uri[colon_pos + 1..];\n  328 | \n  329 |     if let Some(at_pos) = host_part.find('@') {\n  330 |         let user = &host_part[..at_pos];\n  331 |         let host = &host_part[at_pos + 1..];\n  332 |         Some((Some(user), host, path_part))\n  333 |     } else {\n  334 |         Some((None, host_part, path_part))\n  335 |     }\n  336 | }","lines":26,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/core/src/remote_shell.rs#L311-L336"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"The module-level doc example in signal/mod.rs calls `SignalHandler::install()?`, but no such\nassociated function exists - the public installer is the free function `install_signal_handlers()`\n(unix.rs:203 / stub.rs:105). The example is a ```no_run``` block, which is still compiled by\n`cargo test --doc`, so it fails to compile as written (the body also calls\n`std::process::exit(20)`, fine, but the constructor call is invalid).","fix":"Replace `let handler = SignalHandler::install()?;` with\n`let handler = core::signal::install_signal_handlers()?;` (and import accordingly), matching the\nactual API.","locations":[{"ref":"crates/core/src/signal/mod.rs:34-56","code":"   34 | //! ```no_run\n   35 | //! use core::signal::{SignalHandler, CleanupManager};\n   36 | //! use std::path::PathBuf;\n   37 | //!\n   38 | //! # fn main() -> Result<(), Box<dyn std::error::Error>> {\n   39 | //! // Install signal handlers at program start\n   40 | //! let handler = SignalHandler::install()?;\n   41 | //!\n   42 | //! // Register temp file for cleanup\n   43 | //! CleanupManager::global().register_temp_file(PathBuf::from(\"/tmp/file.tmp\"));\n   44 | //!\n   45 | //! // Check for shutdown during operations\n   46 | //! if handler.is_shutdown_requested() {\n   47 | //!     println!(\"Shutdown requested, cleaning up...\");\n   48 | //!     CleanupManager::global().cleanup();\n   49 | //!     std::process::exit(20); // ExitCode::Signal\n   50 | //! }\n   51 | //!\n   52 | //! // Unregister temp file when successfully completed\n   53 | //! CleanupManager::global().unregister_temp_file(\"/tmp/file.tmp\");\n   54 | //! # Ok(())\n   55 | //! # }\n   56 | //! ```","lines":23,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/core/src/signal/mod.rs#L34-L56"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`ReorderBuffer::take` decrements `count` but never decrements\n`high_water_offset`, unlike `next_in_order` which does\n`high_water_offset = high_water_offset.saturating_sub(1)` and resets it to 0\nwhen the buffer empties. The spill layer's `spill_excess` calls `take` to\nremove items for serialization. After items are taken so the buffer empties\n(count == 0), `high_water_offset` can remain non-zero. Subsequent adaptive\nshrink uses `floor = gap_window.max(min)` where `gap_window` is the stale\n`high_water_offset`, preventing the ring from shrinking back toward `min`\n(wasted memory). The `resize_to` debug_assert (`new_capacity >= high_water_offset`)\nis also keyed off the stale value. Functionally non-fatal (it only blocks a\nshrink and inflates the assert floor), but it makes the adaptive policy\nunder-shrink after spill extraction.","fix":"In `take`, recompute or decrement `high_water_offset` consistently with\n`next_in_order` (e.g. reset to 0 when `count` reaches 0, or scan the ring to\nrecompute the highest occupied offset), so the adaptive shrink floor reflects\nthe true live window after extraction.","locations":[{"ref":"crates/engine/src/concurrent_delta/reorder/mod.rs:566-578","code":"  566 |     pub fn take(&mut self, sequence: u64) -> Option<T> {\n  567 |         if self.bypass {\n  568 |             // Bypass mode does not support indexed extraction.\n  569 |             return None;\n  570 |         }\n  571 |         let idx = self.slot_index(sequence)?;\n  572 |         let item = self.slots[idx].take()?;\n  573 |         self.count -= 1;\n  574 |         // Do not adjust high_water_offset here - it remains valid as an\n  575 |         // upper bound. The adaptive policy will naturally recalibrate.\n  576 |         self.refresh_stall_state();\n  577 |         Some(item)\n  578 |     }","lines":13,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/engine/src/concurrent_delta/reorder/mod.rs#L566-L578"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"hard","description":"`IoUringReader::read_all_batched` can spin forever if the file is truncated between\n`File::metadata()` (captured as `self.size` at open) and the batched read. A slot's\n`len` is derived from the captured `size`, but the per-round read clamps requests to\n`file_size - file_off` and `continue`s any SQE whose `file_off >= file_size`. If the\nreal file is now shorter, the trailing slot's `done` never reaches `len`, no SQE is\never submitted for it (`continue`d), `submitted == 0` returns `Ok(())`, yet\n`all_done` stays false because `done < len` -> the `while !all_done` loop never\nterminates. Reads returning 0 (EOF mid-slot) hit the same trap.","fix":"Track whether any forward progress (submitted > 0 AND at least one CQE advanced a\nslot) was made in each round; if a full round makes no progress, break out and return\nthe bytes read so far (treating it as EOF/truncation) instead of looping. Also clamp\neach slot's `len` against the live read results rather than the stale `size`.","locations":[{"ref":"crates/fast_io/src/io_uring/file_reader.rs:193-258","code":"  193 |             let mut all_done = false;\n  194 |             while !all_done {\n  195 |                 with_ring(|ring| -> io::Result<()> {\n  196 |                     let mut submitted = 0u32;\n  197 | \n  198 |                     for (idx, &(out_start, len, done)) in slots.iter().enumerate() {\n  199 |                         let want = len - done;\n  200 |                         if want == 0 {\n  201 |                             continue;\n  202 |                         }\n  203 |                         let file_off = base_offset + (idx * chunk_size) as u64 + done as u64;\n  204 |                         if file_off >= file_size {\n  205 |                             continue;\n  206 |                         }\n  207 |                         let clamped = want.min((file_size - file_off) as usize);\n  208 |                         if clamped == 0 {\n  209 |                             continue;\n  210 |                         }\n  211 | \n  212 |                         let ptr = output[out_start + done..].as_mut_ptr();\n  213 |                         let entry = opcode::Read::new(fd, ptr, clamped as u32)\n  214 |                             .offset(file_off)\n  215 |                             .build()\n  216 |                             .user_data(idx as u64);\n  217 |                         let entry = maybe_fixed_file(entry, NO_FIXED_FD);\n  218 | \n  219 |                         // SAFETY: `entry` references `output` (held across the\n  220 |                         // whole batched read) and the file fd; the pointer\n  221 |                         // remains valid until `submit_and_wait` returns.\n  222 |                         unsafe {\n  223 |                             ring.submission()\n  224 |                                 .push(&entry)\n  225 |                                 .map_err(|_| io::Error::other(\"submission queue full\"))?;\n  226 |                         }\n  227 |                         submitted += 1;\n  228 |                     }\n  229 | \n  230 |                     if submitted == 0 {\n  231 |                         return Ok(());\n  232 |                     }\n  233 | \n  234 |                     ring.submit_and_wait(submitted as usize)?;\n  235 | \n  236 |                     let mut completed = 0u32;\n  237 |                     while completed < submitted {\n  238 |                         let cqe = ring\n  239 |                             .completion()\n  240 |                             .next()\n  241 |                             .ok_or_else(|| io::Error::other(\"missing CQE\"))?;\n  242 | \n  243 |                         let idx = cqe.user_data() as usize;\n  244 |                         let result = cqe.result();\n  245 | \n  246 |                         if result < 0 {\n  247 |                             return Err(io::Error::from_raw_os_error(-result));\n  248 |                         }\n  249 | \n  250 |                         slots[idx].2 += result as usize;\n  251 |                         completed += 1;\n  252 |                     }\n  253 | \n  254 |                     Ok(())\n  255 |                 })?;\n  256 | \n  257 |                 all_done = slots.iter().all(|&(_, len, done)| done >= len);\n  258 |             }","lines":66,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/fast_io/src/io_uring/file_reader.rs#L193-L258"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`apply_crtime_from_source_metadata` silently discards creation times at or before the\nUnix epoch: it only calls `set_crtime` when `secs > 0`, so a birth time of exactly\n1970-01-01 00:00:00 UTC (secs == 0) or any pre-1970 birth time\n(`duration_since(UNIX_EPOCH)` returns `Err`, also skipped) is never applied. The\n`FileEntry` path (`apply_crtime_from_entry`) calls `set_crtime` unconditionally with\nthe raw value, so the two crtime paths disagree on epoch/negative handling. On macOS\n`setattrlist` accepts a zero or negative `tv_sec`, so the guard needlessly drops valid\ncrtimes.","fix":"Drop the `secs > 0` gate (use `>= 0` only if negative crtimes are genuinely\nunsupported on the target), and handle the pre-epoch `Err` from `duration_since` by\ncomputing a negative `tv_sec` via `UNIX_EPOCH.duration_since(created)` so the two\ncrtime paths behave identically.","locations":[{"ref":"crates/metadata/src/apply/timestamps.rs:577-590","code":"  577 | pub(super) fn apply_crtime_from_source_metadata(\n  578 |     destination: &Path,\n  579 |     metadata: &fs::Metadata,\n  580 | ) -> Result<(), MetadataError> {\n  581 |     if let Ok(created) = metadata.created() {\n  582 |         if let Ok(duration) = created.duration_since(std::time::UNIX_EPOCH) {\n  583 |             let secs = duration.as_secs() as i64;\n  584 |             if secs > 0 {\n  585 |                 set_crtime(destination, secs)?;\n  586 |             }\n  587 |         }\n  588 |     }\n  589 |     Ok(())\n  590 | }","lines":14,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/metadata/src/apply/timestamps.rs#L577-L590"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`DeferredSync::flush_files` syncs only the first pending file's filesystem when more than 10 files are queued and `syncfs()` succeeds, then returns Ok and skips all other files. If the queued files span multiple filesystems/mount points (a transfer can write across bind mounts, subvolumes, or different `--link-dest`/temp-dir devices), files on every filesystem other than the first one are never fsynced even though the user requested `--fsync`. The durability guarantee is silently broken for those files.","fix":"Group pending files by device id (statx/dev) and call syncfs once per distinct filesystem, or fall back to per-file fsync for files not on the synced filesystem. Do not early-return after syncing a single fd.","locations":[{"ref":"crates/engine/src/local_copy/deferred_sync.rs:183-205","code":"  183 |     fn flush_files(&self) -> io::Result<()> {\n  184 |         // For large batches, syncfs() amortises the syscall cost across the\n  185 |         // entire filesystem in one call. Fall back to per-file fsync on\n  186 |         // platforms without syncfs or when the call fails.\n  187 |         #[cfg(target_os = \"linux\")]\n  188 |         if self.pending_files.len() > 10 {\n  189 |             if let Some(first) = self.pending_files.first() {\n  190 |                 if sync_filesystem(first).is_ok() {\n  191 |                     return Ok(());\n  192 |                 }\n  193 |             }\n  194 |         }\n  195 | \n  196 |         for path in &self.pending_files {\n  197 |             if let Err(e) = sync_file(path) {\n  198 |                 // A vanished file is not a fatal sync error; skip and continue.\n  199 |                 if e.kind() != io::ErrorKind::NotFound {\n  200 |                     return Err(e);\n  201 |                 }\n  202 |             }\n  203 |         }\n  204 |         Ok(())\n  205 |     }","lines":23,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/engine/src/local_copy/deferred_sync.rs#L183-L205"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`sync_file` opens the destination read+write to satisfy Windows `FlushFileBuffers`, but on Unix a read-only destination file (e.g. mode 0444, common when `--perms` copies read-only sources, or when running as a non-owner) cannot be opened with `write(true)` and returns `PermissionDenied`. In `flush_files` only `NotFound` is tolerated, so any read-only file in the pending batch makes the whole `--fsync` flush return an error and aborts the transfer's sync stage. A read-only file should still be syncable via a read-only handle on Unix.","fix":"On Unix, open the file read-only for fsync (sync_all works on an O_RDONLY fd); only Windows needs the write handle. Alternatively, tolerate PermissionDenied in flush_files the same way NotFound is tolerated, or fsync via the still-open write fd before the guard closes it.","locations":[{"ref":"crates/engine/src/local_copy/deferred_sync.rs:253-259","code":"  253 | fn sync_file(path: &Path) -> io::Result<()> {\n  254 |     let file = std::fs::OpenOptions::new()\n  255 |         .read(true)\n  256 |         .write(true)\n  257 |         .open(path)?;\n  258 |     file.sync_all()\n  259 | }","lines":7,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/engine/src/local_copy/deferred_sync.rs#L253-L259"},{"ref":"crates/engine/src/local_copy/deferred_sync.rs:196-203","code":"  196 |         for path in &self.pending_files {\n  197 |             if let Err(e) = sync_file(path) {\n  198 |                 // A vanished file is not a fatal sync error; skip and continue.\n  199 |                 if e.kind() != io::ErrorKind::NotFound {\n  200 |                     return Err(e);\n  201 |                 }\n  202 |             }\n  203 |         }","lines":8,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/engine/src/local_copy/deferred_sync.rs#L196-L203"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `punch_hole` (Linux), Strategy 1 (PUNCH_HOLE) and Strategy 2 (ZERO_RANGE) both have a catch-all `Err(_) => {}` arm identical to the expected-fallback arm, so a genuine I/O failure (EIO, ENOSPC, EBADF) is silently swallowed and the code falls through to writing explicit zeros. A real error during hole punching is thereby masked and may surface only later (or never, masking ENOSPC by allocating instead of deallocating). Currently low impact because the function is dead in production (see the hole-punch dead-code finding).","fix":"Match only the genuine unsupported errnos (OPNOTSUPP/NOSYS/INVAL) for fallthrough and propagate other errnos as errors before falling back to the next strategy.","locations":[{"ref":"crates/engine/src/local_copy/executor/file/sparse/hole_punch.rs:64-87","code":"   64 |     match fallocate(fd, punch_flags, pos, len) {\n   65 |         Ok(()) => {\n   66 |             file.seek(SeekFrom::Start(pos + len))\n   67 |                 .map_err(|e| LocalCopyError::io(\"seek after hole punch\", path, e))?;\n   68 |             return Ok(());\n   69 |         }\n   70 |         Err(Errno::OPNOTSUPP | Errno::NOSYS | Errno::INVAL) => {}\n   71 |         Err(_) => {}\n   72 |     }\n   73 | \n   74 |     // Strategy 2: ZERO_RANGE zeroes the range without allocation on some\n   75 |     // filesystems.\n   76 |     match fallocate(fd, FallocateFlags::ZERO_RANGE, pos, len) {\n   77 |         Ok(()) => {\n   78 |             file.seek(SeekFrom::Start(pos + len))\n   79 |                 .map_err(|e| LocalCopyError::io(\"seek after zero range\", path, e))?;\n   80 |             return Ok(());\n   81 |         }\n   82 |         Err(Errno::OPNOTSUPP | Errno::NOSYS | Errno::INVAL) => {}\n   83 |         Err(_) => {}\n   84 |     }\n   85 | \n   86 |     // Strategy 3: write zeros - universal but allocates disk space.\n   87 |     write_zeros_fallback(file, path, len)","lines":24,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/engine/src/local_copy/executor/file/sparse/hole_punch.rs#L64-L87"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`IocpWriter::open_with_disposition` calls\n`SetFileCompletionNotificationModes(handle, FILE_SKIP_COMPLETION_PORT_ON_SUCCESS)`\nand discards the return value entirely (no `let _ =`, no check). The SAFETY\ncomment claims failures are \"non-fatal because the writer also handles sync\ncompletions explicitly below\", but `write_at` does NOT drain on synchronous\nTRUE - it returns `Ok(bytes_written)` inline assuming the skip flag took effect.\nIf `SetFileCompletionNotificationModes` silently failed (e.g. a downlevel\nkernel or an underlying object that rejects it), a synchronous WriteFile would\nqueue a completion packet that `write_at` never drains, leaving a stale packet\nfor the next op's `GetQueuedCompletionStatus` - the same stale-completion class\nas the reader bug, just gated on the flag-set failing.","fix":"Check the `SetFileCompletionNotificationModes` return; if it fails, either\npropagate the error or have `write_at` fall back to draining the port on\nsynchronous TRUE so correctness does not silently depend on the flag.","locations":[{"ref":"crates/fast_io/src/iocp/file_writer.rs:104-117","code":"  104 |         // completion that the next overlapped submission would dequeue out\n  105 |         // of order, freeing the previous op's pinned buffer while the kernel\n  106 |         // is still draining bytes from it. The skip flag is supported on\n  107 |         // Vista+; failures here are non-fatal because the writer also handles\n  108 |         // sync completions explicitly below, so we ignore the return value\n  109 |         // rather than block downlevel kernels.\n  110 |         //\n  111 |         // SAFETY: `handle` is a freshly opened overlapped file handle owned\n  112 |         // by this writer; the call only mutates the kernel's notification\n  113 |         // flag for that handle and does not retain the pointer.\n  114 |         #[allow(unsafe_code)]\n  115 |         unsafe {\n  116 |             SetFileCompletionNotificationModes(handle, FILE_SKIP_COMPLETION_PORT_ON_SUCCESS as u8);\n  117 |         }","lines":14,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/fast_io/src/iocp/file_writer.rs#L104-L117"},{"ref":"crates/fast_io/src/iocp/file_writer.rs:181-183","code":"  181 |         if success == TRUE {\n  182 |             return Ok(bytes_written as usize);\n  183 |         }","lines":3,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/fast_io/src/iocp/file_writer.rs#L181-L183"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"In `try_vmsplice_to_file` / `SplicePipe::vmsplice_to_file`, a `vmsplice` that returns\na positive value less than the requested chunk is accepted as `vspliced` and then\nfully drained, but the loop never detects the case where `vmsplice` returns short\nbecause the pipe filled. That is handled by looping, which is fine - however the\nSAFETY note (\"buffer must remain valid until the function returns\") is the only thing\nguaranteeing soundness, and the `drain_pipe_to_fd` is what holds the buffer pages\nreferenced. This is correct ONLY because no `SPLICE_F_GIFT` is used; if a future edit\nadds `SPLICE_F_GIFT` the kernel would take ownership of the pages and the borrowed\n`&[u8]` contract would become unsound. Worth a guard comment / assertion that GIFT is\nnever set.","fix":"Add an explicit comment/`const` asserting the vmsplice flags never include\n`SPLICE_F_GIFT`, since the whole borrowed-slice soundness argument depends on the\nkernel not retaining the user pages past the synchronous drain.","locations":[{"ref":"crates/fast_io/src/splice/syscalls.rs:229-268","code":"  229 |     while remaining > 0 {\n  230 |         let offset = total;\n  231 |         let chunk = remaining.min(SPLICE_CHUNK_SIZE);\n  232 | \n  233 |         // Phase 1: vmsplice the buffer slice into the pipe write end.\n  234 |         // SAFETY: The iovec points to buf[offset..offset+chunk], which is valid\n  235 |         // for the duration of this call. pipe.write_fd is valid (owned by SplicePipe).\n  236 |         // SPLICE_F_MORE hints that more data follows within this transfer.\n  237 |         let iov = libc::iovec {\n  238 |             iov_base: buf[offset..].as_ptr() as *mut libc::c_void,\n  239 |             iov_len: chunk,\n  240 |         };\n  241 | \n  242 |         let vspliced = loop {\n  243 |             let result = unsafe { libc::vmsplice(pipe.write_fd(), &iov, 1, libc::SPLICE_F_MORE) };\n  244 |             if result < 0 {\n  245 |                 let err = io::Error::last_os_error();\n  246 |                 if err.kind() == io::ErrorKind::Interrupted {\n  247 |                     continue; // Retry on EINTR\n  248 |                 }\n  249 |                 return Err(err);\n  250 |             }\n  251 |             break result as usize;\n  252 |         };\n  253 | \n  254 |         if vspliced == 0 {\n  255 |             break;\n  256 |         }\n  257 | \n  258 |         // Phase 2: splice from the pipe read end into the file.\n  259 |         // Must drain exactly vspliced bytes - the kernel holds a reference to\n  260 |         // the buffer pages until the pipe consumer reads them.\n  261 |         drain_pipe_to_fd(&pipe, file_fd, vspliced)?;\n  262 | \n  263 |         total += vspliced;\n  264 |         remaining -= vspliced;\n  265 |     }\n  266 | \n  267 |     Ok(total)\n  268 | }","lines":40,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/fast_io/src/splice/syscalls.rs#L229-L268"},{"ref":"crates/fast_io/src/splice/mod.rs:274-309","code":"  274 |         while remaining > 0 {\n  275 |             let offset = total;\n  276 |             let chunk = remaining.min(SPLICE_CHUNK_SIZE);\n  277 | \n  278 |             let iov = libc::iovec {\n  279 |                 iov_base: buf[offset..].as_ptr() as *mut libc::c_void,\n  280 |                 iov_len: chunk,\n  281 |             };\n  282 | \n  283 |             // SAFETY: The iovec points to buf[offset..offset+chunk], which is\n  284 |             // valid for the duration of this call. self.write_fd is a valid pipe\n  285 |             // fd owned by this SplicePipe.\n  286 |             let vspliced = loop {\n  287 |                 let result = unsafe { libc::vmsplice(self.write_fd, &iov, 1, libc::SPLICE_F_MORE) };\n  288 |                 if result < 0 {\n  289 |                     let err = io::Error::last_os_error();\n  290 |                     if err.kind() == io::ErrorKind::Interrupted {\n  291 |                         continue;\n  292 |                     }\n  293 |                     return Err(err);\n  294 |                 }\n  295 |                 break result as usize;\n  296 |             };\n  297 | \n  298 |             if vspliced == 0 {\n  299 |                 break;\n  300 |             }\n  301 | \n  302 |             drain_pipe_to_fd(self, dest_fd, vspliced)?;\n  303 | \n  304 |             total += vspliced;\n  305 |             remaining -= vspliced;\n  306 |         }\n  307 | \n  308 |         Ok(total)\n  309 |     }","lines":36,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/fast_io/src/splice/mod.rs#L274-L309"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"During binary negotiation, the remote compatibility-flags byte is read via\n`stream.read(&mut first)?` and a result of `Ok(0)` (EOF) is silently mapped to\n`CompatibilityFlags::EMPTY` rather than being treated as a truncated handshake.\nUpstream rsync reads the compat-flags byte as a mandatory field (read_byte errors\non EOF). Treating a premature EOF as \"no flags\" can mask a peer that closed the\nconnection mid-handshake and let the session proceed with an incorrect (empty)\nflag set instead of surfacing an `UnexpectedEof`.","fix":"Decide explicitly whether an EOF here is acceptable; if upstream requires the byte, return `io::ErrorKind::UnexpectedEof` for the `0` arm instead of defaulting to `CompatibilityFlags::EMPTY`. If lenient behaviour is intentional, document it.","locations":[{"ref":"crates/rsync_io/src/binary/negotiate.rs:131-143","code":"  131 |     let remote_compatibility_flags = if negotiated_protocol.uses_binary_negotiation() {\n  132 |         let mut first = [0u8; 1];\n  133 |         match stream.read(&mut first)? {\n  134 |             0 => CompatibilityFlags::EMPTY,\n  135 |             read @ 1 => {\n  136 |                 let mut chained = (&first[..read]).chain(&mut stream);\n  137 |                 CompatibilityFlags::read_from(&mut chained)?\n  138 |             }\n  139 |             _ => unreachable!(\"single-byte buffer limits read results to 0 or 1\"),\n  140 |         }\n  141 |     } else {\n  142 |         CompatibilityFlags::EMPTY\n  143 |     };","lines":13,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/rsync_io/src/binary/negotiate.rs#L131-L143"}]},
{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"On the permission-error branch of `drain_ready_results` / `drain_all_results`,\nthe pending `expected_checksums` entry is popped but `collect_delayed_update` is\nnot consulted, and more importantly the popped entry is the wrong one relative to\n`verify_checksum`'s FIFO assumption only when a delayed-update peek happened on a\nprior successful result. In the normal flow this is consistent, but the two drain\nmethods diverge: `drain_ready_results` uses `pending_commits.saturating_sub(1)`\nwhile `drain_all_results` uses `pending_commits -= 1`. The bare `-=` is only safe\nbecause the loop guard is `> 0`; if a future refactor calls the body outside that\nguard it underflows-panics. The divergence between the two near-identical methods\nis an easy copy-paste hazard.","fix":"Use `saturating_sub(1)` consistently in both methods (or factor the shared\nresult-handling body into one helper) so the two drain paths cannot drift.","locations":[{"ref":"crates/transfer/src/pipeline/receiver.rs:498-501","code":"  498 |                     self.pending_commits = self.pending_commits.saturating_sub(1);\n  499 |                 }\n  500 |                 Ok(Err(e)) => {\n  501 |                     self.pending_commits = self.pending_commits.saturating_sub(1);","lines":4,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/transfer/src/pipeline/receiver.rs#L498-L501"},{"ref":"crates/transfer/src/pipeline/receiver.rs:550-553","code":"  550 |                     self.pending_commits -= 1;\n  551 |                 }\n  552 |                 Ok(Err(e)) => {\n  553 |                     self.pending_commits -= 1;","lines":4,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/transfer/src/pipeline/receiver.rs#L550-L553"}]},
{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"negligible","difficulty":"very_easy","description":"`SplicePipe::Drop` ignores the return value of both `libc::close` calls. A close()\nfailure on the pipe fds (e.g. EINTR on some kernels, or a previously-closed fd) is\nswallowed. This is conventional for Drop and harmless here since the fds are\nsingle-owned, but on Linux a close() that returns EINTR may leave the fd in an\nunspecified state; the existing comment already acknowledges this. Noted for\ncompleteness, not actionable beyond the existing single-ownership invariant.","fix":"No change required; optionally log on close() error in debug builds.","locations":[{"ref":"crates/fast_io/src/splice/mod.rs:312-324","code":"  312 | #[cfg(target_os = \"linux\")]\n  313 | impl Drop for SplicePipe {\n  314 |     fn drop(&mut self) {\n  315 |         // SAFETY: fds were created by pipe2 and are still valid (not closed elsewhere).\n  316 |         // close() on an already-closed fd is harmless in practice but we ensure\n  317 |         // single-ownership by making SplicePipe the sole owner.\n  318 |         #[allow(unsafe_code)]\n  319 |         unsafe {\n  320 |             libc::close(self.read_fd);\n  321 |             libc::close(self.write_fd);\n  322 |         }\n  323 |     }\n  324 | }","lines":13,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/fast_io/src/splice/mod.rs#L312-L324"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"very_easy","description":"The embedded transport's `ChannelReader::read` has the same empty-buffer hazard\nas `SyncReader`: with an empty `buf` and no `partial` data it blocks on\n`self.rx.recv()` instead of returning `Ok(0)`. Additionally, if `buf` is empty\nbut a chunk arrives, `n = min(data.len(), buf.len()) == 0`, so the whole chunk is\nstored as `partial` and `Ok(0)` is returned - a zero-length read that needlessly\npulled a chunk off the channel. A zero-length read should be a cheap no-op.","fix":"Add `if buf.is_empty() { return Ok(0); }` at the start of `read` before draining `partial` or calling `recv()`.","locations":[{"ref":"crates/rsync_io/src/ssh/embedded/connect.rs:55-80","code":"   55 |     fn read(&mut self, buf: &mut [u8]) -> std::io::Result<usize> {\n   56 |         // Drain any leftover data from a previous read.\n   57 |         if let Some(ref mut rb) = self.partial {\n   58 |             let remaining = &rb.data[rb.offset..];\n   59 |             let n = std::cmp::min(remaining.len(), buf.len());\n   60 |             buf[..n].copy_from_slice(&remaining[..n]);\n   61 |             rb.offset += n;\n   62 |             if rb.offset >= rb.data.len() {\n   63 |                 self.partial = None;\n   64 |             }\n   65 |             return Ok(n);\n   66 |         }\n   67 | \n   68 |         // Wait for next chunk from the channel.\n   69 |         match self.rx.recv() {\n   70 |             Ok(data) => {\n   71 |                 let n = std::cmp::min(data.len(), buf.len());\n   72 |                 buf[..n].copy_from_slice(&data[..n]);\n   73 |                 if n < data.len() {\n   74 |                     self.partial = Some(ReadBuffer { data, offset: n });\n   75 |                 }\n   76 |                 Ok(n)\n   77 |             }\n   78 |             Err(_) => Ok(0), // Channel closed = EOF\n   79 |         }\n   80 |     }","lines":26,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/rsync_io/src/ssh/embedded/connect.rs#L55-L80"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"very_easy","description":"`SyncReader::read` does not handle an empty destination buffer. When called with\n`buf.len() == 0` and no buffered data (`self.offset >= self.buffered.len()`), it\nfalls through to `self.rx.recv()` and blocks indefinitely waiting for a chunk\nfrom the channel, even though the `std::io::Read` contract permits a zero-length\nread and expects it to return `Ok(0)` without side effects. A caller probing with\nan empty buffer (or a generic adapter that passes a zero-length slice) will hang\nthe bridging thread instead of returning immediately. The subsequent\n`buf[..n].copy_from_slice(&remaining[..n])` works for n==0 but only after a chunk\nhas been (needlessly) consumed and stashed in `self.buffered`.","fix":"Add `if buf.is_empty() { return Ok(0); }` at the top of `read`, before the `recv()` call, matching the guard already present in `SyncWriter::write` and in `ChannelReader::poll_read`.","locations":[{"ref":"crates/rsync_io/src/ssh/embedded/sync_bridge.rs:247-269","code":"  247 |     fn read(&mut self, buf: &mut [u8]) -> io::Result<usize> {\n  248 |         if self.offset >= self.buffered.len() {\n  249 |             match self.rx.recv() {\n  250 |                 Ok(chunk) => {\n  251 |                     if chunk.is_empty() {\n  252 |                         return Ok(0);\n  253 |                     }\n  254 |                     self.buffered = chunk;\n  255 |                     self.offset = 0;\n  256 |                 }\n  257 |                 Err(_) => return Ok(0),\n  258 |             }\n  259 |         }\n  260 |         let remaining = &self.buffered[self.offset..];\n  261 |         let n = remaining.len().min(buf.len());\n  262 |         buf[..n].copy_from_slice(&remaining[..n]);\n  263 |         self.offset += n;\n  264 |         if self.offset >= self.buffered.len() {\n  265 |             self.buffered.clear();\n  266 |             self.offset = 0;\n  267 |         }\n  268 |         Ok(n)\n  269 |     }","lines":23,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/rsync_io/src/ssh/embedded/sync_bridge.rs#L247-L269"}]},
{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`SharedRing` registers a `RegisteredBufferGroup` (via `RegisteredBufferGroup::try_new`\nin `new_inner`) but never exposes it or uses READ_FIXED/WRITE_FIXED - all submit paths\nuse the unregistered `Read`/`Send` opcodes. The registered buffers therefore pin\n`registered_buffer_count * buffer_size` bytes of memory (default 8 * 64KiB = 512KiB)\nin the kernel for the life of every SharedRing with no functional benefit, and the\ngroup is only released on Drop. This is wasted pinned memory / dead registration.","fix":"Either wire the registered buffer group into a READ_FIXED submit path, or stop\nregistering buffers in SharedRing until that path exists (set\n`registered_buffers = None`) to avoid pinning unused memory.","locations":[{"ref":"crates/fast_io/src/io_uring/shared_ring.rs:171-204","code":"  171 |         let registered_buffers = if config.ring.register_buffers {\n  172 |             RegisteredBufferGroup::try_new(\n  173 |                 &ring,\n  174 |                 config.ring.buffer_size,\n  175 |                 config.ring.registered_buffer_count,\n  176 |             )\n  177 |         } else {\n  178 |             None\n  179 |         };\n  180 | \n  181 |         Ok(Self {\n  182 |             ring,\n  183 |             reader_slot,\n  184 |             writer_slot,\n  185 |             reader_fd,\n  186 |             writer_fd,\n  187 |             poll_add_supported,\n  188 |             registered_buffers,\n  189 |         })\n  190 |     }\n  191 | \n  192 |     /// Returns whether `IORING_OP_POLL_ADD` was probed as supported when this\n  193 |     /// ring was constructed. Always `true` for a successfully constructed\n  194 |     /// ring; exposed for diagnostics and tests.\n  195 |     #[must_use]\n  196 |     pub fn poll_add_supported(&self) -> bool {\n  197 |         self.poll_add_supported\n  198 |     }\n  199 | \n  200 |     /// Returns whether the optional registered buffer pool is active.\n  201 |     #[must_use]\n  202 |     pub fn has_registered_buffers(&self) -> bool {\n  203 |         self.registered_buffers.is_some()\n  204 |     }","lines":34,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/fast_io/src/io_uring/shared_ring.rs#L171-L204"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`RegisteredBufferGroup::available()` and the bgid allocator's `current_in_flight()` /\n`remaining()` take the global free-list `Mutex` (or iterate every bitset word) on\nevery call, and `BgidAllocator::deallocate` / `deallocate_batch` do an O(n)\n`free_list.contains()` scan per id under the lock to enforce no-duplicates. For a\ndaemon recycling many bgids this is quadratic in the free-list length while holding\nthe process-wide mutex, serialising all allocation. The free list could use a\n`HashSet`/bitset for O(1) membership.","fix":"Back the bgid free-list with a bitset or `HashSet<u16>` so `deallocate` membership\nchecks are O(1) instead of O(n) under the global mutex. The 16-bit namespace fits a\nsingle 8 KiB bitset.","locations":[{"ref":"crates/fast_io/src/io_uring/buffer_ring/allocator.rs:380-421","code":"  380 |     pub fn deallocate_batch(bgids: &[u16]) {\n  381 |         if bgids.is_empty() {\n  382 |             return;\n  383 |         }\n  384 |         let mut free_list = bgid_free_list().lock().expect(\"bgid free-list poisoned\");\n  385 |         for &bgid in bgids {\n  386 |             if !free_list.contains(&bgid) {\n  387 |                 free_list.push(bgid);\n  388 |             }\n  389 |         }\n  390 |     }\n  391 | \n  392 |     /// Returns a previously-allocated bgid to the free-list for reuse.\n  393 |     ///\n  394 |     /// Wired into [`super::BufferRing`]'s `Drop` implementation when the\n  395 |     /// ring's bgid was issued by [`allocate`](Self::allocate); callers\n  396 |     /// should not normally invoke this directly. The next call to\n  397 |     /// [`allocate`](Self::allocate) will return this id before advancing\n  398 |     /// the monotonic counter.\n  399 |     ///\n  400 |     /// # Idempotence\n  401 |     ///\n  402 |     /// Calling `deallocate` more than once for the same bgid is a no-op\n  403 |     /// after the first call - the duplicate is silently dropped so the\n  404 |     /// free-list never contains the same id twice. This defends against\n  405 |     /// double-drop scenarios where, e.g., a buffer ring is moved out of an\n  406 |     /// `Option` and the original holder is also dropped.\n  407 |     ///\n  408 |     /// # Assumption\n  409 |     ///\n  410 |     /// The caller must own `bgid`: it must have been returned by a prior\n  411 |     /// [`allocate`](Self::allocate) call and not handed back through this\n  412 |     /// method since. Returning a caller-provided constant (a bgid that was\n  413 |     /// never issued by this allocator) pollutes the free-list and causes a\n  414 |     /// later [`allocate`](Self::allocate) to issue an id that may collide\n  415 |     /// with a ring active elsewhere in the process.\n  416 |     pub fn deallocate(bgid: u16) {\n  417 |         let mut free_list = bgid_free_list().lock().expect(\"bgid free-list poisoned\");\n  418 |         if !free_list.contains(&bgid) {\n  419 |             free_list.push(bgid);\n  420 |         }\n  421 |     }","lines":42,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/fast_io/src/io_uring/buffer_ring/allocator.rs#L380-L421"},{"ref":"crates/fast_io/src/io_uring/registered_buffers/registry.rs:316-323","code":"  316 |     /// Returns the number of currently available (free) buffer slots.\n  317 |     #[must_use]\n  318 |     pub fn available(&self) -> usize {\n  319 |         self.free_bitset\n  320 |             .iter()\n  321 |             .map(|word| word.load(Ordering::Relaxed).count_ones() as usize)\n  322 |             .sum()\n  323 |     }","lines":8,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/fast_io/src/io_uring/registered_buffers/registry.rs#L316-L323"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"In `submit_one_write` the `BOUNCE_COPIES_AVOIDED` telemetry counter is\nincremented BEFORE the `WriteFile` call, and is not decremented when the\nsubmission fails (synchronous error other than ERROR_IO_PENDING returns `Err`\nwithout touching the counter). The counter therefore over-reports \"bounce copies\navoided\" by the number of failed aligned submissions. Pure telemetry, no\ncorrectness impact, but the count is wrong under any write-error path.","fix":"Increment `BOUNCE_COPIES_AVOIDED` only after `WriteFile` reports success\n(TRUE or ERROR_IO_PENDING), i.e. move the `fetch_add` past the success check.","locations":[{"ref":"crates/fast_io/src/iocp/disk_batch/writer.rs:313-339","code":"  313 |     if use_aligned {\n  314 |         BOUNCE_COPIES_AVOIDED.fetch_add(1, Ordering::Relaxed);\n  315 |     }\n  316 |     #[allow(unsafe_code)]\n  317 |     let success = unsafe {\n  318 |         WriteFile(\n  319 |             handle,\n  320 |             op.buffer.as_ptr().cast(),\n  321 |             op.buffer.len() as u32,\n  322 |             &mut bytes_written,\n  323 |             overlapped_ptr,\n  324 |         )\n  325 |     };\n  326 | \n  327 |     if success == TRUE {\n  328 |         // Synchronous success still queues a completion packet because we\n  329 |         // do not opt into FILE_SKIP_COMPLETION_PORT_ON_SUCCESS; drop into\n  330 |         // the drain loop just like an ERROR_IO_PENDING.\n  331 |         return Ok(op);\n  332 |     }\n  333 | \n  334 |     let err = io::Error::last_os_error();\n  335 |     // ERROR_IO_PENDING (997) is the documented \"queued\" code; any other\n  336 |     // error is fatal for this submission.\n  337 |     if err.raw_os_error() != Some(997) {\n  338 |         return Err(err);\n  339 |     }","lines":27,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/fast_io/src/iocp/disk_batch/writer.rs#L313-L339"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`FileListWalker::push_directory` calls `fs::canonicalize` for every directory\nentered, purely to populate the `visited` loop-detection set. On large trees\nwithout symlinks this doubles path-resolution syscalls (canonicalize resolves\nevery component). The cost is incurred unconditionally even when\n`follow_symlinks` is false and cycles are impossible.","fix":"Only canonicalize (and consult `visited`) when `follow_symlinks` is enabled,\nsince plain directory trees cannot form cycles without followed symlinks. For\nthe non-follow case, use the device+inode pair from already-fetched metadata\nwhere available instead of a full canonicalize.","locations":[{"ref":"crates/flist/src/file_list_walker.rs:77-95","code":"   77 |     fn push_directory(\n   78 |         &mut self,\n   79 |         fs_path: PathBuf,\n   80 |         relative_prefix: PathBuf,\n   81 |         depth: usize,\n   82 |     ) -> Result<(), FileListError> {\n   83 |         let canonical = fs::canonicalize(&fs_path)\n   84 |             .map_err(|error| FileListError::canonicalize(fs_path.clone(), error))?;\n   85 | \n   86 |         if !self.visited.insert(canonical) {\n   87 |             debug_log!(Dup, 1, \"skipping already visited directory: {:?}\", fs_path);\n   88 |             return Ok(());\n   89 |         }\n   90 | \n   91 |         debug_log!(Flist, 2, \"entering directory: {:?}\", fs_path);\n   92 |         let state = DirectoryState::new(fs_path, relative_prefix, depth)?;\n   93 |         self.stack.push(state);\n   94 |         Ok(())\n   95 |     }","lines":19,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/flist/src/file_list_walker.rs#L77-L95"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"`DeltaResult::estimated_size` (SpillCodec) adds a fixed `+ 16` \"struct\noverhead (padding, enum discriminant)\" and counts a `String` as `24 + len`\non top of the 36 fixed bytes. The on-disk encoded size is actually\n36 + (tag 1 byte) + optional (4 + reason_len), so the estimate is a loose\nheap+struct heuristic rather than the encoded byte count it gates spilling\non. This over-counts every Success result by ~16 bytes, making the spill\nthreshold trigger slightly earlier than the configured byte budget implies.\nDiagnostic-grade only; memory accounting stays bounded.","fix":"If the threshold is meant to track on-disk bytes, return the encoded size\n(36 + 1 + optional(4 + reason.len())); if it is meant to track in-memory\nfootprint, document that explicitly so the constant offsets are not mistaken\nfor the wire size.","locations":[{"ref":"crates/engine/src/concurrent_delta/types.rs:517-529","code":"  517 |     fn estimated_size(&self) -> usize {\n  518 |         // Fixed fields: 4 + 8 + 8 + 8 + 8 = 36 bytes.\n  519 |         // Status: 1 byte tag + optional string.\n  520 |         let status_size = match &self.status {\n  521 |             DeltaResultStatus::Success => 0,\n  522 |             DeltaResultStatus::NeedsRedo { reason } | DeltaResultStatus::Failed { reason } => {\n  523 |                 // String: 24 bytes (String struct) + heap data.\n  524 |                 24 + reason.len()\n  525 |             }\n  526 |         };\n  527 |         // Include struct overhead (padding, enum discriminant).\n  528 |         36 + status_size + 16\n  529 |     }","lines":13,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/engine/src/concurrent_delta/types.rs#L517-L529"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`IncrementalFileList::release_pending_children` is recursive over directory nesting\ndepth. A malicious or pathological sender that delivers a very deeply nested chain of\npending directories (each released triggering release of its child) could recurse\nonce per nesting level when the chain is finally unblocked, risking stack growth for\nextreme depths. Directory paths are already implicitly bounded by the name-length cap\nonce that is enforced, so impact is minor.","fix":"Convert the recursion to an explicit work-stack (push children to a Vec/VecDeque and loop) to make it depth-independent, mirroring the iterative `collect_missing_ancestors`.","locations":[{"ref":"crates/protocol/src/flist/incremental/mod.rs:179-191","code":"  179 |     fn release_pending_children(&mut self, dir_name: &str) {\n  180 |         if let Some(children) = self.pending.remove(dir_name) {\n  181 |             let released_count = children.len();\n  182 |             for child in children {\n  183 |                 if child.is_dir() {\n  184 |                     self.created_dirs.insert(child.name().to_string());\n  185 |                     self.release_pending_children(child.name());\n  186 |                 }\n  187 |                 self.ready.push_back(child);\n  188 |             }\n  189 |             self.entries_pending = self.entries_pending.saturating_sub(released_count);\n  190 |         }\n  191 |     }","lines":13,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/protocol/src/flist/incremental/mod.rs#L179-L191"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"`copy_bytes_into_vec` reserves `bytes.len().saturating_sub(target.len())` extra\ncapacity and then immediately `target.clear()`s the vector before extending with\n`bytes`. When `target` already had more elements than `bytes.len()`, the reserve\nis a no-op (saturating_sub yields 0) and after clear the existing capacity covers\nthe copy, so the result is correct; but the intent (\"reserve room for bytes.len()\nafter clearing\") is obscured and relies on the pre-clear length still being valid\nfor the reserve math. This is fragile to future edits even though it is currently\ncorrect.","fix":"Clear first, then `target.try_reserve(bytes.len())?`, then extend. The reserve amount then directly expresses the required capacity and does not depend on the stale pre-clear length.","locations":[{"ref":"crates/rsync_io/src/negotiation/buffer/storage.rs:299-310","code":"  299 |     fn copy_bytes_into_vec(target: &mut Vec<u8>, bytes: &[u8]) -> Result<usize, TryReserveError> {\n  300 |         let len = target.len();\n  301 |         target.try_reserve(bytes.len().saturating_sub(len))?;\n  302 |         target.clear();\n  303 | \n  304 |         if bytes.is_empty() {\n  305 |             return Ok(0);\n  306 |         }\n  307 | \n  308 |         target.extend_from_slice(bytes);\n  309 |         Ok(bytes.len())\n  310 |     }","lines":12,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/rsync_io/src/negotiation/buffer/storage.rs#L299-L310"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"`deletion/strategy.rs` (DeletionContext, should_delete_entry, is_extraneous_entry, build_keep_set, DeletionError) is re-exported via `deletion/mod.rs` but never consumed by production code. The real extraneous-entry deletion logic lives in the executor (`executor/directory/recursive/deletion.rs`, out of scope). The strategy module duplicates that decision logic and is only exercised by `deletion/tests.rs`.","fix":"Remove the dead module, or make the executor's deletion path actually use should_delete_entry/build_keep_set so a single deletion-decision implementation is shared.","locations":[{"ref":"crates/engine/src/local_copy/deletion/strategy.rs:125-159","code":"  125 | /// Returns `true` if `entry_name` does not appear in `source_entries`.\n  126 | pub fn is_extraneous_entry<S: AsRef<OsStr>>(entry_name: &OsStr, source_entries: &[S]) -> bool {\n  127 |     !source_entries.iter().any(|s| s.as_ref() == entry_name)\n  128 | }\n  129 | \n  130 | /// Determines if an entry should be deleted based on context and filters.\n  131 | ///\n  132 | /// Checks deletion-enabled state, `--max-delete` limits, extraneous\n  133 | /// membership, and filter rules before returning `true`.\n  134 | pub fn should_delete_entry<S, F>(\n  135 |     entry_name: &OsStr,\n  136 |     source_entries: &[S],\n  137 |     context: &DeletionContext<'_>,\n  138 |     filter_allows_deletion: F,\n  139 | ) -> bool\n  140 | where\n  141 |     S: AsRef<OsStr>,\n  142 |     F: FnOnce(&Path, bool) -> bool,\n  143 | {\n  144 |     if !context.delete_enabled {\n  145 |         return false;\n  146 |     }\n  147 |     if !context.can_delete() {\n  148 |         return false;\n  149 |     }\n  150 |     if !is_extraneous_entry(entry_name, source_entries) {\n  151 |         return false;\n  152 |     }\n  153 | \n  154 |     if let Some(relative) = context.relative_path {\n  155 |         filter_allows_deletion(relative, false)\n  156 |     } else {\n  157 |         true\n  158 |     }\n  159 | }","lines":35,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/engine/src/local_copy/deletion/strategy.rs#L125-L159"},{"ref":"crates/engine/src/local_copy/deletion/mod.rs:15-20","code":"   15 | mod strategy;\n   16 | \n   17 | pub use strategy::{\n   18 |     DeletionContext, DeletionError, DeletionResult, build_keep_set, is_extraneous_entry,\n   19 |     should_delete_entry,\n   20 | };","lines":6,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/engine/src/local_copy/deletion/mod.rs#L15-L20"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"hard","description":"The entire hole-punch machinery for in-place sparse updates is dead in production. `punch_hole`, `flush_with_punch_hole`, `finish_with_punch_hole`, `set_zero_run_start`, and `pending_zeros` are all `#[cfg_attr(not(test), allow(dead_code))]`; the production `write_sparse_chunk` only ever calls the seek-based `flush`. As a result `--sparse` with in-place updates never deallocates blocks via `fallocate(PUNCH_HOLE)` as the module docs and upstream parity claim - it can only create holes in fresh files via seek-past-EOF. The comments reference an unfinished task (#677).","fix":"Either wire the punch-hole path into the in-place sparse writer or remove the dead code and adjust the module documentation to reflect seek-only sparse support.","locations":[{"ref":"crates/engine/src/local_copy/executor/file/sparse/hole_punch.rs:42-115","code":"   42 | #[cfg(target_os = \"linux\")]\n   43 | #[cfg_attr(not(test), allow(dead_code))]\n   44 | pub(crate) fn punch_hole(\n   45 |     file: &mut fs::File,\n   46 |     path: &Path,\n   47 |     pos: u64,\n   48 |     len: u64,\n   49 | ) -> Result<(), LocalCopyError> {\n   50 |     if len == 0 {\n   51 |         return Ok(());\n   52 |     }\n   53 | \n   54 |     // fallocate's offset/length args are signed; fall back when either would\n   55 |     // overflow i64.\n   56 |     if pos > i64::MAX as u64 || len > i64::MAX as u64 {\n   57 |         return write_zeros_fallback(file, path, len);\n   58 |     }\n   59 | \n   60 |     let fd = file.as_fd();\n   61 | \n   62 |     // Strategy 1: PUNCH_HOLE | KEEP_SIZE creates an actual filesystem hole.\n   63 |     let punch_flags = FallocateFlags::PUNCH_HOLE | FallocateFlags::KEEP_SIZE;\n   64 |     match fallocate(fd, punch_flags, pos, len) {\n   65 |         Ok(()) => {\n   66 |             file.seek(SeekFrom::Start(pos + len))\n   67 |                 .map_err(|e| LocalCopyError::io(\"seek after hole punch\", path, e))?;\n   68 |             return Ok(());\n   69 |         }\n   70 |         Err(Errno::OPNOTSUPP | Errno::NOSYS | Errno::INVAL) => {}\n   71 |         Err(_) => {}\n   72 |     }\n   73 | \n   74 |     // Strategy 2: ZERO_RANGE zeroes the range without allocation on some\n   75 |     // filesystems.\n   76 |     match fallocate(fd, FallocateFlags::ZERO_RANGE, pos, len) {\n   77 |         Ok(()) => {\n   78 |             file.seek(SeekFrom::Start(pos + len))\n   79 |                 .map_err(|e| LocalCopyError::io(\"seek after zero range\", path, e))?;\n   80 |             return Ok(());\n   81 |         }\n   82 |         Err(Errno::OPNOTSUPP | Errno::NOSYS | Errno::INVAL) => {}\n   83 |         Err(_) => {}\n   84 |     }\n   85 | \n   86 |     // Strategy 3: write zeros - universal but allocates disk space.\n   87 |     write_zeros_fallback(file, path, len)\n   88 | }\n   89 | \n   90 | /// Non-Linux platforms fall back to writing zeros directly.\n   91 | /// This includes macOS, BSD, and Windows which don't support Linux's\n   92 | /// fallocate PUNCH_HOLE/ZERO_RANGE flags.\n   93 | ///\n   94 | /// After a successful call, the file position will be at `pos + len`,\n   95 | /// matching the Linux implementation's behavior.\n   96 | ///\n   97 | /// Not yet wired into the production delta transfer path (test-only).\n   98 | /// See task #677 for in-place update integration.\n   99 | #[cfg(not(target_os = \"linux\"))]\n  100 | #[cfg_attr(not(test), allow(dead_code))]\n  101 | pub(crate) fn punch_hole(\n  102 |     file: &mut fs::File,\n  103 |     path: &Path,\n  104 |     pos: u64,\n  105 |     len: u64,\n  106 | ) -> Result<(), LocalCopyError> {\n  107 |     if len == 0 {\n  108 |         return Ok(());\n  109 |     }\n  110 | \n  111 |     file.seek(SeekFrom::Start(pos))\n  112 |         .map_err(|e| LocalCopyError::io(\"seek before writing zeros\", path, e))?;\n  113 | \n  114 |     write_zeros_fallback(file, path, len)\n  115 | }","lines":74,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/engine/src/local_copy/executor/file/sparse/hole_punch.rs#L42-L115"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"The entire `pipelined_state` module (PipelineController / PipelinePriority / PipelineState / PipelineStats, ~290 lines plus ~390 lines of unit/integration tests) is a 4-priority streaming state machine that is never wired into the real `run_pipelined()` path. The doc comment claims it is \"used by run_pipelined()\" but the only references in the whole workspace are the `pub mod` declaration and test files (`tests/incremental_flist.rs`). It is unused production scaffolding whose doc comment is also misleading.","fix":"Either wire PipelineController into the actual pipelined receive loop, or remove the module (and its tests) and the misleading doc claim that it is used by run_pipelined().","locations":[{"ref":"crates/engine/src/local_copy/pipelined_state.rs:1-290","code":"    1 | //! State machine for 4-priority streaming file list processing pipeline.\n    2 | //!\n    3 | //! This module implements a priority-driven main loop controller used by\n    4 | //! `run_pipelined()` to coordinate concurrent file list reception, pipeline\n    5 | //! filling, entry processing, and response handling.\n    6 | //!\n    7 | //! # Priority Model\n    8 | //!\n    9 | //! The state machine enforces a 4-level priority hierarchy:\n   10 | //!\n   11 | //! 1. **Process Ready Entries** (highest) - Process entries that are ready\n   12 | //! 2. **Fill Pipeline** - Add new entries to the pipeline\n   13 | //! 3. **Read More Entries** - Read additional entries from wire\n   14 | //! 4. **Process One Response** (lowest) - Process completed responses\n   15 | //!\n   16 | //! # State Machine\n   17 | //!\n   18 | //! ```text\n   19 | //! Idle → FillingPipeline → ProcessingEntry\n   20 | //!     ↓                   ↓              ↓\n   21 | //!     → ReadingWire ----→ ProcessingResponse\n   22 | //!                         ↓\n   23 | //!                       Completed\n   24 | //! ```\n   25 | //!\n   26 | //! # Examples\n   27 | //!\n   28 | //! ```ignore\n   29 | //! // Internal module - this example shows usage for run_pipelined()\n   30 | //! use engine::local_copy::pipelined_state::{PipelineController, PipelinePriority};\n   31 | //!\n   32 | //! let mut controller = PipelineController::new(8);\n   33 | //!\n   34 | //! // Main loop\n   35 | //! while !controller.is_complete() {\n   36 | //!     match controller.next_priority() {\n   37 | //!         Some(PipelinePriority::ProcessReadyEntries) => {\n   38 | //!             if let Some(entry_id) = controller.dequeue_ready() {\n   39 | //!                 // Process entry...\n   40 | //!                 controller.submit_response(entry_id);\n   41 | //!             }\n   42 | //!         }\n   43 | //!         Some(PipelinePriority::FillPipeline) => {\n   44 | //!             let entry_id = 1; // Get next entry\n   45 | //!             controller.enqueue_entry(entry_id);\n   46 | //!         }\n   47 | //!         Some(PipelinePriority::ReadMoreEntries) => {\n   48 | //!             // Read from wire...\n   49 | //!             controller.mark_wire_exhausted();\n   50 | //!         }\n   51 | //!         Some(PipelinePriority::ProcessOneResponse) => {\n   52 | //!             if let Some(entry_id) = controller.dequeue_response() {\n   53 | //!                 // Process response...\n   54 | //!             }\n   55 | //!         }\n   56 | //!         None => break,\n   57 | //!     }\n   58 | //! }\n   59 | //! ```\n   60 | \n   61 | use std::collections::VecDeque;\n   62 | \n   63 | /// State of the pipeline processing system.\n   64 | #[derive(Clone, Debug, PartialEq, Eq)]\n   65 | pub enum PipelineState {\n   66 |     /// Waiting for work to begin.\n   67 |     Idle,\n   68 |     /// Currently filling the pipeline with new entries.\n   69 |     FillingPipeline,\n   70 |     /// Processing a ready entry.\n   71 |     ProcessingEntry,\n   72 |     /// Reading more entries from the wire.\n   73 |     ReadingWire,\n   74 |     /// Processing one response.\n   75 |     ProcessingResponse,\n   76 |     /// All entries have been processed.\n   77 |     Completed,\n   78 |     /// Terminal error state with description.\n   79 |     Error(String),\n   80 | }\n   81 | \n   82 | /// Priority levels for pipeline operations, ordered from highest to lowest.\n   83 | #[derive(Clone, Copy, Debug, PartialEq, Eq, PartialOrd, Ord)]\n   84 | pub enum PipelinePriority {\n   85 |     /// Highest priority: process entries that are ready.\n   86 |     ProcessReadyEntries = 1,\n   87 |     /// Fill the pipeline with new entries.\n   88 |     FillPipeline = 2,\n   89 |     /// Read more entries from the wire.\n   90 |     ReadMoreEntries = 3,\n   91 |     /// Lowest priority: process one response.\n   92 |     ProcessOneResponse = 4,\n   93 | }\n   94 | \n   95 | /// Statistics about pipeline activity.\n   96 | #[derive(Clone, Debug, Default, PartialEq, Eq)]\n   97 | pub struct PipelineStats {\n   98 |     /// Total entries enqueued to the pipeline.\n   99 |     pub entries_enqueued: usize,\n  100 |     /// Total entries processed.\n  101 |     pub entries_processed: usize,\n  102 |     /// Total responses processed.\n  103 |     pub responses_processed: usize,\n  104 |     /// Current pipeline depth.\n  105 |     pub pipeline_depth: usize,\n  106 |     /// Maximum pipeline depth reached.\n  107 |     pub max_pipeline_depth: usize,\n  108 | }\n  109 | \n  110 | /// Controller for the pipelined file list processing state machine.\n  111 | ///\n  112 | /// Manages the lifecycle of entries through the pipeline: enqueuing, marking\n  113 | /// ready, dequeuing for processing, submitting responses, and processing responses.\n  114 | pub struct PipelineController {\n  115 |     state: PipelineState,\n  116 |     capacity: usize,\n  117 |     pending_entries: VecDeque<usize>,\n  118 |     ready_entries: VecDeque<usize>,\n  119 |     pending_responses: VecDeque<usize>,\n  120 |     wire_exhausted: bool,\n  121 |     stats: PipelineStats,\n  122 | }\n  123 | \n  124 | impl PipelineController {\n  125 |     /// Creates a new pipeline controller with the specified capacity.\n  126 |     #[must_use]\n  127 |     pub fn new(capacity: usize) -> Self {\n  128 |         Self {\n  129 |             state: PipelineState::Idle,\n  130 |             capacity,\n  131 |             pending_entries: VecDeque::new(),\n  132 |             ready_entries: VecDeque::new(),\n  133 |             pending_responses: VecDeque::new(),\n  134 |             wire_exhausted: false,\n  135 |             stats: PipelineStats::default(),\n  136 |         }\n  137 |     }\n  138 | \n  139 |     /// Returns the current pipeline state.\n  140 |     #[must_use]\n  141 |     pub const fn state(&self) -> &PipelineState {\n  142 |         &self.state\n  143 |     }\n  144 | \n  145 |     /// Returns the pipeline capacity.\n  146 |     #[must_use]\n  147 |     pub const fn capacity(&self) -> usize {\n  148 |         self.capacity\n  149 |     }\n  150 | \n  151 |     /// Returns the highest priority action available, or `None` if no action is possible.\n  152 |     ///\n  153 |     /// Priority ordering:\n  154 |     /// 1. Process ready entries\n  155 |     /// 2. Fill pipeline\n  156 |     /// 3. Read more entries\n  157 |     /// 4. Process responses\n  158 |     pub fn next_priority(&self) -> Option<PipelinePriority> {\n  159 |         if matches!(self.state, PipelineState::Error(_)) {\n  160 |             return None;\n  161 |         }\n  162 | \n  163 |         if self.is_complete() {\n  164 |             return None;\n  165 |         }\n  166 | \n  167 |         if self.has_ready_entries() {\n  168 |             return Some(PipelinePriority::ProcessReadyEntries);\n  169 |         }\n  170 | \n  171 |         if self.can_fill() {\n  172 |             return Some(PipelinePriority::FillPipeline);\n  173 |         }\n  174 | \n  175 |         if !self.wire_exhausted && !self.pending_entries.is_empty() {\n  176 |             return Some(PipelinePriority::ReadMoreEntries);\n  177 |         }\n  178 | \n  179 |         if self.has_pending_responses() {\n  180 |             return Some(PipelinePriority::ProcessOneResponse);\n  181 |         }\n  182 | \n  183 |         None\n  184 |     }\n  185 | \n  186 |     /// Returns `true` if the pipeline can accept more entries.\n  187 |     #[must_use]\n  188 |     pub fn can_fill(&self) -> bool {\n  189 |         let current_depth = self.pending_entries.len() + self.ready_entries.len();\n  190 |         current_depth < self.capacity && !self.wire_exhausted\n  191 |     }\n  192 | \n  193 |     /// Returns `true` if there are entries ready to process.\n  194 |     #[must_use]\n  195 |     pub fn has_ready_entries(&self) -> bool {\n  196 |         !self.ready_entries.is_empty()\n  197 |     }\n  198 | \n  199 |     /// Returns `true` if there are pending responses to process.\n  200 |     #[must_use]\n  201 |     pub fn has_pending_responses(&self) -> bool {\n  202 |         !self.pending_responses.is_empty()\n  203 |     }\n  204 | \n  205 |     /// Enqueues a new entry into the pipeline.\n  206 |     ///\n  207 |     /// # Panics\n  208 |     ///\n  209 |     /// Panics if the pipeline is at capacity.\n  210 |     pub fn enqueue_entry(&mut self, entry_id: usize) {\n  211 |         assert!(self.can_fill(), \"Pipeline is at capacity\");\n  212 | \n  213 |         self.pending_entries.push_back(entry_id);\n  214 |         self.stats.entries_enqueued += 1;\n  215 | \n  216 |         let current_depth = self.pending_entries.len() + self.ready_entries.len();\n  217 |         self.stats.pipeline_depth = current_depth;\n  218 |         self.stats.max_pipeline_depth = self.stats.max_pipeline_depth.max(current_depth);\n  219 |     }\n  220 | \n  221 |     /// Marks an entry as ready to process.\n  222 |     ///\n  223 |     /// The entry must currently be in the pending queue.\n  224 |     pub fn mark_re
