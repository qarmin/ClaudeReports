ady(&mut self, entry_id: usize) {\n  225 |         if let Some(pos) = self.pending_entries.iter().position(|&id| id == entry_id) {\n  226 |             self.pending_entries.remove(pos);\n  227 |             self.ready_entries.push_back(entry_id);\n  228 |         }\n  229 |     }\n  230 | \n  231 |     /// Dequeues the next ready entry for processing.\n  232 |     ///\n  233 |     /// Returns `None` if no entries are ready.\n  234 |     pub fn dequeue_ready(&mut self) -> Option<usize> {\n  235 |         let entry_id = self.ready_entries.pop_front();\n  236 |         if entry_id.is_some() {\n  237 |             self.stats.entries_processed += 1;\n  238 |             let current_depth = self.pending_entries.len() + self.ready_entries.len();\n  239 |             self.stats.pipeline_depth = current_depth;\n  240 |         }\n  241 |         entry_id\n  242 |     }\n  243 | \n  244 |     /// Submits a processed response.\n  245 |     pub fn submit_response(&mut self, entry_id: usize) {\n  246 |         self.pending_responses.push_back(entry_id);\n  247 |     }\n  248 | \n  249 |     /// Dequeues the next response for processing.\n  250 |     ///\n  251 |     /// Returns `None` if no responses are pending.\n  252 |     pub fn dequeue_response(&mut self) -> Option<usize> {\n  253 |         let response = self.pending_responses.pop_front();\n  254 |         if response.is_some() {\n  255 |             self.stats.responses_processed += 1;\n  256 |         }\n  257 |         response\n  258 |     }\n  259 | \n  260 |     /// Marks the wire as exhausted (no more entries available).\n  261 |     pub fn mark_wire_exhausted(&mut self) {\n  262 |         self.wire_exhausted = true;\n  263 |     }\n  264 | \n  265 |     /// Returns `true` if all processing is complete.\n  266 |     ///\n  267 |     /// Complete means:\n  268 |     /// - Wire is exhausted\n  269 |     /// - No pending entries\n  270 |     /// - No ready entries\n  271 |     /// - No pending responses\n  272 |     #[ {"id":"DEAD_4","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"`FileListStats.num_acls` and `FileListStats.num_xattrs` are public counters that are\nnever incremented anywhere in production code; `update_stats` (read/extras.rs) tracks\nfiles/dirs/symlinks/devices/specials but never ACL or xattr counts even though\nread_entry reads ACLs and xattrs from the wire. Callers reading these fields will\nalways see 0, which is misleading.","fix":"Either increment num_acls/num_xattrs in read_entry when ACL/xattr indices are read (entry.acl_ndx().is_some() / entry.xattr_ndx().is_some()), or remove the unused fields if no consumer needs them.","locations":[{"ref":"crates/protocol/src/flist/state.rs:96-100","code":"   96 |     pub num_specials: u64,\n   97 |     /// Number of entries with ACLs.\n   98 |     pub num_acls: u64,\n   99 |     /// Number of entries with extended attributes.\n  100 |     pub num_xattrs: u64,","lines":5,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/protocol/src/flist/state.rs#L96-L100"}]},
{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"In `windows_gnu_eh`'s `ensure_function`, the `loop` already returns/breaks for\nall states (`UNRESOLVED` recomputes then breaks, `MISSING` returns `None`, any\nresolved value returns `Some`). The post-loop `if state == MISSING || state ==\nUNRESOLVED { None } else { Some(...) }` is unreachable for the `MISSING`/\n`UNRESOLVED` arms (those paths already returned) and only the resolved case can\nfall through. The redundant re-check is dead/confusing logic.","fix":"After the loop, `state` is always a resolved pointer value, so simply\n`Some(state as *mut ())`. Remove the redundant `MISSING`/`UNRESOLVED` branch.","locations":[{"ref":"crates/windows-gnu-eh/src/lib.rs:100-130","code":"  100 |         let mut state = cache.load(Ordering::Acquire);\n  101 |         loop {\n  102 |             match state {\n  103 |                 UNRESOLVED => {\n  104 |                     // SAFETY: `symbol` is a static NUL-terminated byte literal (see SYM_REGISTER/SYM_DEREGISTER); resolve_symbol's contract is satisfied.\n  105 |                     let resolved = unsafe { resolve_symbol(symbol) } as usize;\n  106 |                     let new_state = if resolved == 0 { MISSING } else { resolved };\n  107 |                     match cache.compare_exchange(\n  108 |                         UNRESOLVED,\n  109 |                         new_state,\n  110 |                         Ordering::AcqRel,\n  111 |                         Ordering::Acquire,\n  112 |                     ) {\n  113 |                         Ok(_) => {\n  114 |                             state = new_state;\n  115 |                             break;\n  116 |                         }\n  117 |                         Err(actual) => state = actual,\n  118 |                     }\n  119 |                 }\n  120 |                 MISSING => return None,\n  121 |                 value => return Some(value as *mut ()),\n  122 |             }\n  123 |         }\n  124 | \n  125 |         if state == MISSING || state == UNRESOLVED {\n  126 |             None\n  127 |         } else {\n  128 |             Some(state as *mut ())\n  129 |         }\n  130 |     }","lines":31,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/windows-gnu-eh/src/lib.rs#L100-L130"}]},
{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"medium","difficulty":"medium","description":"The `--max-delete` handling claims \"upstream allows -1 to mean 'no limit after\nreporting'\" and accepts any `i64` (including negative values) at parse time, but the\nauthoritative downstream parser `parse_max_delete_argument` (numeric.rs:79-122) rejects\nany value beginning with '-' as \"deletion limit must be non-negative\". So `--max-delete=-1`\npasses the early check then fails later, and the documented upstream \"-1 = unlimited\"\nsemantics are never actually implemented. The comment is misleading and the two\nvalidators disagree on the accepted domain.","fix":"Decide on one behavior and make both layers agree. Either implement the documented\n`-1 = unlimited` semantics end to end (e.g. map -1 to an unlimited sentinel and accept\nit in `parse_max_delete_argument`), or drop the misleading comment and reject negatives\nconsistently at the first validation point so the diagnostic is emitted once with the\ncorrect message.","locations":[{"ref":"crates/cli/src/frontend/arguments/parser/entry.rs:385-398","code":"  385 |     let max_delete = match matches.remove_one::<OsString>(\"max-delete\") {\n  386 |         Some(value) => {\n  387 |             let s = value.to_string_lossy();\n  388 |             // upstream allows -1 to mean \"no limit after reporting\"\n  389 |             if s.parse::<i64>().is_err() {\n  390 |                 return Err(clap::Error::raw(\n  391 |                     clap::error::ErrorKind::ValueValidation,\n  392 |                     format!(\"invalid --max-delete value '{s}': must be an integer\\n\"),\n  393 |                 ));\n  394 |             }\n  395 |             Some(value)\n  396 |         }\n  397 |         None => None,\n  398 |     };","lines":14,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/cli/src/frontend/arguments/parser/entry.rs#L385-L398"}]},
{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"`ErrorCodification::error_code_name` is documented (lines 102-106) to \"Provide the symbolic name as\ndefined in upstream rsync's errcode.h (e.g., \\\"RERR_SYNTAX\\\", \\\"RERR_PARTIAL\\\")\", but the default\nimplementation returns `self.exit_code().description()` - the human-readable error text, not the\nsymbolic RERR_* name. Any caller relying on the documented contract for logging/metrics gets the\nwrong string.","fix":"Either change the implementation to return the symbolic RERR_* name (add a `const fn rerr_name()`\nto ExitCode), or fix the doc comment to state it returns the human-readable description.","locations":[{"ref":"crates/core/src/exit_code/traits.rs:102-109","code":"  102 |     /// Returns the upstream rsync error code name for debugging.\n  103 |     ///\n  104 |     /// Provides the symbolic name as defined in upstream rsync's `errcode.h`\n  105 |     /// (e.g., \"RERR_SYNTAX\", \"RERR_PARTIAL\"). The default implementation\n  106 |     /// maps the exit code to its description.\n  107 |     fn error_code_name(&self) -> &'static str {\n  108 |         self.exit_code().description()\n  109 |     }","lines":8,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/core/src/exit_code/traits.rs#L102-L109"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"very_easy","description":"`WalkEntry::metadata` documents that \"The metadata is obtained via\n`symlink_metadata`, so symlinks report their own metadata rather than their\ntarget's.\" That is only true when `WalkConfig::follow_symlinks` is false. The\nmetadata is sourced from jwalk's `dir_entry.metadata()`, which follows\nsymlinks (returns target metadata) when the walker is built with\n`follow_links(true)` (see `WalkdirWalker::new` -> `builder.follow_links(config.follow_symlinks)`).\nWith `--copy-links`-style follow enabled, `is_symlink()` and `len()` will\nreflect the target, contradicting the doc's absolute claim.","fix":"Qualify the doc: metadata is symlink (own) metadata only when the walker was\nconfigured with `follow_symlinks(false)`; with following enabled it reflects\nthe target. Or document that the metadata source tracks the walker's\nfollow-symlinks configuration.","locations":[{"ref":"crates/engine/src/walk/entry.rs:61-68","code":"   61 |     /// Returns the metadata for this entry.\n   62 |     ///\n   63 |     /// The metadata is obtained via `symlink_metadata`, so symlinks\n   64 |     /// report their own metadata rather than their target's.\n   65 |     #[must_use]\n   66 |     pub fn metadata(&self) -> &Metadata {\n   67 |         &self.metadata\n   68 |     }","lines":8,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/engine/src/walk/entry.rs#L61-L68"}]},
{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"The `BufferRing::new` comment at lines 204-207 states the mmap region is sized as\n\"sizeof(io_uring_buf) * ring_entries, plus space for the 16-bit tail at the end\" and\nthe SAFETY comment at 290-293 claims `ring_mmap_size = ring_entries * entry_size +\nsize_of::<u16>()`. Neither is true: the code computes `ring_region_size.\nnext_multiple_of(page_size)` with no explicit tail reservation. The comment masks the\nOOB bug reported separately; even after that fix the comment text should be corrected.","fix":"Update the comments to describe the actual sizing once the tail reservation is added.","locations":[{"ref":"crates/fast_io/src/io_uring/buffer_ring/mod.rs:204-207","code":"  204 |         // Calculate the mmap region size: ring entries + tail u16 (at the end,\n  205 |         // aligned to the struct size).\n  206 |         // The kernel expects: sizeof(io_uring_buf) * ring_entries, plus space\n  207 |         // for the 16-bit tail at the end of the ring page.","lines":4,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/fast_io/src/io_uring/buffer_ring/mod.rs#L204-L207"}]},
{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"medium","difficulty":"hard","description":"Two independent, near-identical `CleanupManager` global temp-file registries\nexist: `crates/engine/src/cleanup.rs` (exported as `engine::cleanup`) and\n`crates/engine/src/util/cleanup.rs` (re-exported at crate root as\n`engine::CleanupManager` via lib.rs). Each defines its own\n`static CLEANUP_MANAGER: OnceLock<Mutex<CleanupManagerState>>` and its own\n`CleanupManager` unit struct with the same method surface\n(`register_temp_file`, `unregister_temp_file`, `cleanup`, etc.). They are two\ndistinct process-global registries: a temp file registered through one is\ninvisible to the other. A caller using `engine::CleanupManager::global()`\n(util) and a signal handler that sweeps `engine::cleanup::CleanupManager`\n(or vice versa) will silently miss each other's files, leaking temp files on\nabnormal exit. This is a real correctness footgun, not just dead code.","fix":"Collapse to a single `CleanupManager` (one global `OnceLock`) and have the\nother module re-export it, or delete the unused duplicate. Ensure lib.rs\nexposes exactly one canonical path so all registrations land in one registry.","locations":[{"ref":"crates/engine/src/cleanup.rs:1-163","code":"    1 | //! Global cleanup registry for temporary files.\n    2 | //!\n    3 | //! Tracks temporary file paths so they can be removed on abnormal termination\n    4 | //! (e.g., SIGKILL). Normal exits clean up via RAII (`TempFileGuard::drop`),\n    5 | //! but `Drop` is not invoked on SIGKILL. This registry provides a process-wide\n    6 | //! list that a signal handler or atexit hook can sweep.\n    7 | //!\n    8 | //! # Thread Safety\n    9 | //!\n   10 | //! All methods are thread-safe. The internal state is protected by a mutex.\n   11 | \n   12 | use std::collections::HashSet;\n   13 | use std::path::{Path, PathBuf};\n   14 | use std::sync::{Mutex, OnceLock};\n   15 | \n   16 | /// Global cleanup manager instance.\n   17 | static CLEANUP_MANAGER: OnceLock<Mutex<CleanupManagerState>> = OnceLock::new();\n   18 | \n   19 | /// Singleton instance returned by [`CleanupManager::global`].\n   20 | static CLEANUP_MANAGER_INSTANCE: CleanupManager = CleanupManager;\n   21 | \n   22 | /// Global registry for temporary files awaiting cleanup.\n   23 | ///\n   24 | /// Register a temp file path after creation and unregister it after a\n   25 | /// successful commit (rename to final destination). On abnormal shutdown\n   26 | /// the signal handler calls [`cleanup`](Self::cleanup) to sweep any paths\n   27 | /// still registered.\n   28 | ///\n   29 | /// # Examples\n   30 | ///\n   31 | /// ```\n   32 | /// use engine::CleanupManager;\n   33 | /// use std::path::PathBuf;\n   34 | ///\n   35 | /// let temp = PathBuf::from(\"/tmp/rsync.12345.tmp\");\n   36 | /// CleanupManager::global().register_temp_file(temp.clone());\n   37 | ///\n   38 | /// // ... write data, commit ...\n   39 | ///\n   40 | /// CleanupManager::global().unregister_temp_file(&temp);\n   41 | /// ```\n   42 | #[derive(Debug)]\n   43 | pub struct CleanupManager;\n   44 | \n   45 | impl CleanupManager {\n   46 |     /// Returns a reference to the global cleanup manager.\n   47 |     #[must_use]\n   48 |     pub fn global() -> &'static Self {\n   49 |         let _ = CLEANUP_MANAGER.get_or_init(|| Mutex::new(CleanupManagerState::new()));\n   50 |         &CLEANUP_MANAGER_INSTANCE\n   51 |     }\n   52 | \n   53 |     /// Registers a temporary file for cleanup.\n   54 |     ///\n   55 |     /// The file will be deleted when [`cleanup`](Self::cleanup) or\n   56 |     /// [`cleanup_temp_files`](Self::cleanup_temp_files) is called,\n   57 |     /// unless it is unregistered first.\n   58 |     pub fn register_temp_file(&self, path: PathBuf) {\n   59 |         if let Some(state) = CLEANUP_MANAGER.get() {\n   60 |             if let Ok(mut state) = state.lock() {\n   61 |                 state.temp_files.insert(path);\n   62 |             }\n   63 |         }\n   64 |     }\n   65 | \n   66 |     /// Unregisters a temporary file from cleanup.\n   67 |     ///\n   68 |     /// Call this after a successful commit so the file is not deleted\n   69 |     /// during shutdown cleanup.\n   70 |     pub fn unregister_temp_file(&self, path: &Path) {\n   71 |         if let Some(state) = CLEANUP_MANAGER.get() {\n   72 |             if let Ok(mut state) = state.lock() {\n   73 |                 state.temp_files.remove(path);\n   74 |             }\n   75 |         }\n   76 |     }\n   77 | \n   78 |     /// Registers a cleanup callback to run on shutdown.\n   79 |     ///\n   80 |     /// Callbacks execute in reverse registration order (LIFO).\n   81 |     pub fn register_cleanup(&self, callback: Box<dyn FnOnce() + Send>) {\n   82 |         if let Some(state) = CLEANUP_MANAGER.get() {\n   83 |             if let Ok(mut state) = state.lock() {\n   84 |                 state.cleanup_callbacks.push(callback);\n   85 |             }\n   86 |         }\n   87 |     }\n   88 | \n   89 |     /// Performs cleanup of all registered resources.\n   90 |     ///\n   91 |     /// Runs cleanup callbacks in reverse order, then deletes all registered\n   92 |     /// temporary files. Errors are silently ignored to avoid cascading\n   93 |     /// failures during shutdown.\n   94 |     pub fn cleanup(&self) {\n   95 |         if let Some(state) = CLEANUP_MANAGER.get() {\n   96 |             if let Ok(mut state) = state.lock() {\n   97 |                 state.cleanup();\n   98 |             }\n   99 |         }\n  100 |     }\n  101 | \n  102 |     /// Cleans up only the registered temporary files.\n  103 |     pub fn cleanup_temp_files(&self) {\n  104 |         if let Some(state) = CLEANUP_MANAGER.get() {\n  105 |             if let Ok(mut state) = state.lock() {\n  106 |                 state.cleanup_temp_files();\n  107 |             }\n  108 |         }\n  109 |     }\n  110 | \n  111 |     / {"id":"DUP_2","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"`win_copy.rs` and `clonefile.rs` are near-identical thin wrappers over `fast_io::PlatformCopy`. Both expose a public `copy_file_standard` that is byte-for-byte identical (`std::fs::copy`), and both implement the same dispatch/zero-copy-accounting logic with different result enums (WinCopyResult vs CloneResult). Neither module's public copy entry points (`copy_file_optimized*`, `clone_or_copy*`, `try_win_copy`, `try_clonefile`) are called from any production code in the workspace; they are exercised only by their own in-module tests.","fix":"Consolidate into a single platform-copy facade (or drop the unused public wrappers) and have one `copy_file_standard`. If kept as public API, route the engine's real copy path through them so they are not dead.","locations":[{"ref":"crates/engine/src/local_copy/win_copy.rs:119-228","code":"  119 | pub fn copy_file_optimized(src: &Path, dst: &Path) -> io::Result<WinCopyResult> {\n  120 |     copy_file_optimized_with(&DefaultPlatformCopy::new(), src, dst)\n  121 | }\n  122 | \n  123 | /// Variant of [`copy_file_optimized`] that uses a caller-supplied [`PlatformCopy`].\n  124 | ///\n  125 | /// Allows injecting a fake strategy in tests or wiring the strategy stored in\n  126 | /// `LocalCopyOptions` so engine paths share a single copy backend.\n  127 | ///\n  128 | /// # Errors\n  129 | ///\n  130 | /// Returns an error if every mechanism in the supplied strategy fails.\n  131 | pub fn copy_file_optimized_with(\n  132 |     platform_copy: &dyn PlatformCopy,\n  133 |     src: &Path,\n  134 |     dst: &Path,\n  135 | ) -> io::Result<WinCopyResult> {\n  136 |     let size_hint = std::fs::metadata(src).map(|m| m.len()).unwrap_or(0);\n  137 |     let result = platform_copy.copy_file(src, dst, size_hint)?;\n  138 |     // Zero-copy reflink methods (clonefile/FICLONE/ReFS) return\n  139 |     // bytes_copied=0 because n {"id":"OTHER_1","type":"other","type_label":"Other","severity":"medium","difficulty":"medium","description":"`MemoryCap::wait_and_reserve` loops forever when `requested > limit`: the condition `current.saturating_add(requested) <= self.limit` can never become true, so the thread blocks on the condvar indefinitely (no timeout, no error). `acquire_adaptive_from` / `acquire_controlled_from` reserve `adaptive_buffer_size(file_size)` (up to 1 MiB) or the controller's recommended size, neither of which is clamped to the memory cap. A pool configured via `with_memory_cap`/`init_global_buffer_pool` with a cap below the per-buffer adaptive size therefore deadlocks the worker thread on the first large-file acquire.","fix":"Detect `requested > limit` in `wait_and_reserve`/`try_reserve` and either reserve the full limit (single-buffer override) or return an error; alternatively clamp the adaptive/controller buffer size to `memory_cap` in the acquire paths as `recommended_buffer_size` already does.","locations":[{"ref":"crates/engine/src/local_copy/buffer_pool/memory_cap.rs:56-109","code":"   56 |     pub(super) fn wait_and_reserve(&self, requested: usize) {\n   57 |         // Fast path: try to reserve with CAS, no locking needed.\n   58 |         loop {\n   59 |             let current = self.outstanding.load(Ordering::Acquire);\n   60 |             if current.saturating_add(requested) > self.limit {\n   61 |                 break; // Fall through to slow path.\n   62 |             }\n   63 |             if self\n   64 |                 .outstanding\n   65 |                 .compare_exchange_weak(\n   66 |                     current,\n   67 |                     current + requested,\n   68 |                     Ordering::AcqRel,\n   69 |                     Ordering::Acquire,\n   70 |                 )\n   71 |                 .is_ok()\n   72 |             {\n   73 |                 return;\n   74 |             }\n   75 |             // CAS failed due to concurrent modification, retry.\n   76 |         }\n   77 | \n   78 |         // Slow path: wait on the condvar and reserve with CAS.\n   79 |         // The mutex serializes waiters against each other, but the fast path\n   80 |         // can still succeed concurrently (lockless), so we must use CAS here\n   81 |         // too - a plain store would clobber a concurrent fast-path increment.\n   82 |         let mut guard = self\n   83 |             .backpressure\n   84 |             .lock()\n   85 |             .expect(\"backpressure mutex poisoned\");\n   86 |         loop {\n   87 |             let current = self.outstanding.load(Ordering::Acquire);\n   88 |             if current.saturating_add(requested) <= self.limit {\n   89 |                 if self\n   90 |                     .outstanding\n   91 |                     .compare_exchange(\n   92 |                         current,\n   93 |                         current + requested,\n   94 |                         Ordering::AcqRel,\n   95 |                         Ordering::Acquire,\n   96 |                     )\n   97 |                     .is_ok()\n   98 |                 {\n   99 |                     return;\n  100 |                 }\n  101 |                 // CAS failed - fast path grabbed it; re-check without waiting.\n  102 |                 continue;\n  103 |             }\n  104 |             guard = self\n  105 |                 .returned\n  106 |                 .wait(guard)\n  107 |                 .expect(\"backpressure condvar poisoned\");\n  108 |         }\n  109 |     }","lines":54,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/engine/src/local_copy/buffer_pool/memory_cap.rs#L56-L109"},{"ref":"crates/engine/src/local_copy/buffer_pool/pool/acquire.rs:103-120","code":"  103 |     pub fn acquire_adaptive_from(pool: Arc<Self>, file_size: u64) -> BufferGuard<A> {\n  104 |         let desired = adaptive_buffer_size(file_size);\n  105 | \n  106 |         if desired == <script>
(function(){
'use strict';

// Data
const FINDINGS     = JSON.parse(document.getElementById('D').textContent);
const PROJECT_INFO = JSON.parse(document.getElementById('PI').textContent);
const SEVS     = ['critical','high','medium','low','negligible'];
const STATUSES = ['open','fixed','wont-fix','false-positive'];
const ALL_TYPES = [...new Set(FINDINGS.map(f => f.type))].sort();
// Build lookup map for O(1) access
const FINDING_BY_ID = new Map(FINDINGS.map(f => [f.id, f]));
// Only severities actually present in the report — the filter bar hides the rest.
const PRESENT_SEVS = SEVS.filter(s => FINDINGS.some(f => (f.severity || 'medium') === s));
// Whether any finding is flagged easy — the "Quick wins" filter row is hidden otherwise.
const DIFFICULTY_ORDER = ['very_easy','easy','medium','hard'];
const DIFFICULTY_LBL = {very_easy:'⚡ Very Easy', easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFFICULTY_CLS = {very_easy:'diff-very-easy', easy:'diff-easy', medium:'diff-medium', hard:'diff-hard'};
const PRESENT_DIFFS = DIFFICULTY_ORDER.filter(d => FINDINGS.some(f => f.difficulty === d));
const HAS_DIFFICULTY = PRESENT_DIFFS.length > 0;
const STORE_KEY = 'audit-status:' + location.href;

const STATUS_CLS = {open:'st-open', fixed:'st-fixed', 'wont-fix':'st-wont', 'false-positive':'st-fp'};
const STATUS_LBL = {open:'● open', fixed:'✓ fixed', 'wont-fix':"— won't fix", 'false-positive':'✗ false pos.'};
const STATUS_NEXT = {open:'fixed', fixed:'wont-fix', 'wont-fix':'false-positive', 'false-positive':'open'};

// State
const S = {
  search: '', searchScope: 'all', groupBy: 'type',
  hiddenSev: new Set(), hiddenType: new Set(),
  hiddenStatus: new Set(), hiddenDiff: new Set(), hiddenGroup: new Set(),
  collapsed: new Set(),
};
const statuses = {};

// Persistence
function loadStatuses() {
  try { Object.assign(statuses, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch {}
}
function saveStatuses() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(statuses)); } catch {}
}
function statusOf(id) { return statuses[id] || 'open'; }

// URL hash — debounced so rapid filter changes don't thrash history
let _hashTimer = 0;
function syncHash() {
  clearTimeout(_hashTimer);
  _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.hiddenDiff.size)   p.set('hd',  [...S.hiddenDiff].join(','));
    if (S.search)            p.set('q',   S.search);
    if (S.searchScope !== 'all') p.set('qs', S.searchScope);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('qs'))  { S.searchScope = p.get('qs'); }
  document.getElementById('search-scope').classList.toggle('active', S.searchScope === 'locations');
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('hd'))  p.get('hd') .split(',').filter(Boolean).forEach(v => S.hiddenDiff.add(v));
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Render a "**Label:** value" line. GitHub/CommonMark only recognizes a
// ``` fence when it starts at the beginning of a line, so if the value
// itself opens with a fence, put it on its own line instead of right
// after the inline label - otherwise the fence marker gets glued onto
// "**Label:** ```" and never renders as a code block.
function mdField(label, value) {
  value = value || '';
  return /^```/.test(value.trim())
    ? '**' + label + ':**\n\n' + value
    : '**' + label + ':** ' + value;
}

// Render the "**Locations:**" block. When a location has a commit-pinned
// permalink (GitHub/GitLab), just paste the bare URL on its own line -
// GitHub/GitLab auto-expand a line-range blob link into an inline code
// preview, so re-pasting the snippet as a fenced block would duplicate it.
// Forges without a detected permalink shape (or missing commit/repo info)
// fall back to the fenced ref+snippet so the location is still readable.
function mdLocations(locations) {
  if (!locations.length) return '';
  let out = '**Locations:**\n\n';
  for (const l of locations) {
    if (l.link)               out += l.link + '\n\n';
    else if (l.code != null)  out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
    else                      out += '- `' + l.ref + '` _(file not found)_\n\n';
  }
  return out;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      out += '### ' + f.id + sevStr + '\n\n';
      out += mdField('Description', f.description) + '\n\n';
      out += mdLocations(f.locations);
      out += mdField('Fix', f.fix) + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    lines.push('- [ ] - ' + f.id + sevStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build a [project] header block from embedded PROJECT_INFO, so the exported
// findings.toml is self-contained (doesn't depend on a sibling project-info.toml
// that a second, separately-triggered download could silently fail to save).
// '' when there is no project info at all.
function buildProjectToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = PROJECT_INFO || {};
  if (!Object.keys(pi).length) return '';
  const lines = ['[project]'];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n\n';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.difficulty) lns.push(pad('difficulty')  + '= ' + tomlStr(f.difficulty));
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return buildProjectToml() + chunks.join('\n\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + '\n\n';
  out += mdField('Description', f.description) + '\n\n';
  out += mdLocations(f.locations);
  out += mdField('Fix', f.fix) + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystacks per finding (cleared on full re-render).
// Two variants: everything (default), and file/folder paths only - for when a
// search term (e.g. a directory name like 'dlls/abc') also happens to appear
// inside description/fix prose and you only want path matches.
const _hay = new Map();
const _hayLoc = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.difficulty ? (DIFFICULTY_LBL[f.difficulty] || f.difficulty) : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}
function hayLocOf(f) {
  if (!_hayLoc.has(f.id)) {
    _hayLoc.set(f.id, f.locations.map(l => l.ref).join(' ').toLowerCase());
  }
  return _hayLoc.get(f.id);
}

function matches(f) {
  if (S.hiddenDiff.size > 0 && f.difficulty && S.hiddenDiff.has(f.difficulty)) return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (S.searchScope === 'locations') {
      if (!hayLocOf(f).includes(q)) return false;
    } else if (!hayOf(f).includes(q) && !st.includes(q)) {
      return false;
    }
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.difficulty ? '<span class="badge ' + (DIFFICULTY_CLS[f.difficulty]||'') + '" style="cursor:default" title="Difficulty: ' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '">' + esc(DIFFICULTY_LBL[f.difficulty]||f.difficulty) + '</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_DIFFICULTY) {
    h += '<div class="filter-row"><span class="filter-lbl">Difficulty:</span>';
    for (const d of PRESENT_DIFFS)
      h += '<button class="badge ' + (DIFFICULTY_CLS[d]||'') + '" data-diff="' + d + '">' + esc(DIFFICULTY_LBL[d]||d) + '</button>';
    h += '<button class="filter-toggle" data-toggle-all="diff"></button></div>';
  }

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-diff]'))   b.classList.toggle('off', S.hiddenDiff.has(b.dataset.diff));
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    if (set) b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  _hayLoc.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Long-press solo: hold a filter badge 450 ms to isolate that value (hide all others in the group).
let _soloTimer = 0;
let _soloFired = false;

function _applySolo(b) {
  _soloFired = true;
  const sev = b.dataset.sev, typ = b.dataset.type, sta = b.dataset.status, dif = b.dataset.diff;
  if      (sev) { S.hiddenSev.clear();    PRESENT_SEVS.filter(v => v !== sev).forEach(v => S.hiddenSev.add(v)); }
  else if (typ) { S.hiddenType.clear();   ALL_TYPES.filter(v => v !== typ).forEach(v => S.hiddenType.add(v)); }
  else if (sta) { S.hiddenStatus.clear(); STATUSES.filter(v => v !== sta).forEach(v => S.hiddenStatus.add(v)); }
  else if (dif) { S.hiddenDiff.clear();   PRESENT_DIFFS.filter(v => v !== dif).forEach(v => S.hiddenDiff.add(v)); }
  scheduleRender();
}

const _fb = document.getElementById('filterbar');

_fb.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-diff]');
  if (!b) return;
  _soloFired = false;
  clearTimeout(_soloTimer);
  _soloTimer = setTimeout(() => _applySolo(b), 450);
}, {passive: true});
_fb.addEventListener('pointerup',     () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointercancel', () => clearTimeout(_soloTimer), {passive: true});
_fb.addEventListener('pointermove', e => {
  if (!_soloTimer) return;
  if (!e.target.closest('[data-sev],[data-type],[data-status],[data-diff]')) clearTimeout(_soloTimer);
}, {passive: true});

// Event delegation
_fb.addEventListener('click', e => {
  if (_soloFired) { _soloFired = false; return; }
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-diff]');
  if (!b) return;
  if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : k === 'status' ? S.hiddenStatus : k === 'diff' ? S.hiddenDiff : null;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES : k === 'status' ? STATUSES : k === 'diff' ? PRESENT_DIFFS : [];
    if (!set) return;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  else if (b.dataset.diff)   { const s = S.hiddenDiff;   s.has(b.dataset.diff)   ? s.delete(b.dataset.diff)   : s.add(b.dataset.diff); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    // Single download (was two) - a second auto-triggered download is commonly
    // blocked by the browser unless the user explicitly allows it, which silently
    // drops project-info.toml. Embedding [project] in findings.toml itself avoids
    // that failure mode entirely.
    downloadText(buildFindingsToml(), 'findings.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});
document.getElementById('search-scope').addEventListener('click', e => {
  S.searchScope = S.searchScope === 'locations' ? 'all' : 'locations';
  e.currentTarget.classList.toggle('active', S.searchScope === 'locations');
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
