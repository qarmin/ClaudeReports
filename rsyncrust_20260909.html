<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`collect_paths_recursive` (used by `collect_paths_then_metadata_parallel`,\n`collect_lazy_parallel`, `collect_with_batched_stats`, and\n`collect_paths_chunked_parallel`) recurses into symlinked directories whenever\n`follow_symlinks` is true, but unlike the sequential `FileListWalker` it keeps\nno `visited`/canonicalized set and performs no loop detection. A symlink cycle\n(e.g. `a -> .` or two dirs linking to each other) under `follow_symlinks=true`\ncauses unbounded recursion and a stack-overflow abort. The sequential walker\nguards against exactly this via `fs::canonicalize` + a `visited` HashSet\n(file_list_walker.rs:81-87), so the parallel paths are an inconsistent and\ncrash-prone alternative.","fix":"Track canonicalized directory paths in a `HashSet` (as `FileListWalker` does)\nand skip recursion into an already-visited directory; or only descend into\nreal directories and refuse to follow directory symlinks without cycle\ndetection. Mirror the sequential walker's `push_directory` guard.","locations":[{"ref":"crates/flist/src/parallel.rs:416-452","code":"  416 | fn collect_paths_recursive(\n  417 |     root: &PathBuf,\n  418 |     current: &PathBuf,\n  419 |     follow_symlinks: bool,\n  420 | ) -> Vec<(PathBuf, PathBuf, usize, bool)> {\n  421 |     let mut paths = Vec::new();\n  422 |     let is_root = current == root;\n  423 | \n  424 |     let relative_path = if is_root {\n  425 |         PathBuf::new()\n  426 |     } else {\n  427 |         current.strip_prefix(root).unwrap_or(current).to_path_buf()\n  428 |     };\n  429 |     let depth = relative_path.components().count();\n  430 | \n  431 |     paths.push((current.clone(), relative_path, depth, is_root));\n  432 | \n  433 |     let should_recurse = if let Ok(metadata) = fs::symlink_metadata(current) {\n  434 |         metadata.is_dir() || (follow_symlinks && metadata.is_symlink())\n  435 |     } else {\n  436 |         false\n  437 |     };\n  438 | \n  439 |     if should_recurse {\n  440 |         if let Ok(entries) = fs::read_dir(current) {\n  441 |             let mut child_entries: Vec<_> = entries.filter_map(|e| e.ok()).collect();\n  442 |             crate::sort::sort_dir_entries(&mut child_entries);\n  443 | \n  444 |             for entry in child_entries {\n  445 |                 let child_path = entry.path();\n  446 |                 paths.extend(collect_paths_recursive(root, &child_path, follow_symlinks));\n  447 |             }\n  448 |         }\n  449 |     }\n  450 | \n  451 |     paths\n  452 | }","lines":37,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/flist/src/parallel.rs#L416-L452"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`read_signature` pre-allocates `Vec::with_capacity(block_count as usize)` where\n`block_count` is read from the wire via `read_varint(reader)? as u32` and is fully\nattacker controlled (up to ~2^31). `SignatureBlock` is 32 bytes (u32 + u32 +\nVec<u8> header), so a block count near `i32::MAX` requests a ~64 GiB allocation up\nfront, before any block bytes are read. This aborts the process (allocation\nfailure) and is a trivial remote DoS: the peer only needs to send a few varint\nbytes. The per-iteration `read_exact` would naturally hit EOF, but the eager\n`with_capacity` happens first.","fix":"Do not pre-size from the wire-supplied count. Either cap the reservation\n(`Vec::with_capacity(block_count.min(SOME_SANE_CAP) as usize)`) as is done in\n`internal::read_delta`, or use `Vec::new()` and grow as blocks are read. Also\nreject obviously-impossible counts relative to the remaining input.","locations":[{"ref":"crates/protocol/src/wire/signature.rs:166-189","code":"  166 | pub fn read_signature<R: Read>(reader: &mut R) -> io::Result<(u32, u32, u8, Vec<SignatureBlock>)> {\n  167 |     let block_count = read_varint(reader)? as u32;\n  168 |     let block_length = read_varint(reader)? as u32;\n  169 |     let strong_sum_length = read_varint(reader)? as u8;\n  170 | \n  171 |     let mut blocks = Vec::with_capacity(block_count as usize);\n  172 | \n  173 |     for index in 0..block_count {\n  174 |         let mut rolling_sum_bytes = [0u8; 4];\n  175 |         reader.read_exact(&mut rolling_sum_bytes)?;\n  176 |         let rolling_sum = u32::from_le_bytes(rolling_sum_bytes);\n  177 | \n  178 |         let mut strong_sum = vec![0u8; strong_sum_length as usize];\n  179 |         reader.read_exact(&mut strong_sum)?;\n  180 | \n  181 |         blocks.push(SignatureBlock {\n  182 |             index,\n  183 |             rolling_sum,\n  184 |             strong_sum,\n  185 |         });\n  186 |     }\n  187 | \n  188 |     Ok((block_length, block_count, strong_sum_length, blocks))\n  189 | }","lines":24,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/protocol/src/wire/signature.rs#L166-L189"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`Message::render_prefix` writes the program name, a space, the severity label, and \": \" into the\nfixed 48-byte `MessageScratch::prefix_buffer` using `copy_from_slice` and raw index writes with no\nbounds check (buffer[len] = ...). The program name comes from workspace metadata (Cargo.toml). Today\nthe longest combination (\"oc-rsyncd\" + \" warning: \") fits comfortably, but there is no compile-time\nassertion tying the buffer size to the maximum possible program-name+severity length. If the brand\nprogram name is ever renamed to something long (>~38 bytes), every message render panics with an\nout-of-bounds slice/index. A latent landmine with no guard.","fix":"Add a `const _: () = assert!(MAX_PROGRAM_NAME_LEN + MAX_SEVERITY_LEN + 4 <= 48);` style static\nguard (or size the buffer from those constants), or bounds-check and fall back gracefully so a long\nprogram name cannot turn diagnostics into panics.","locations":[{"ref":"crates/core/src/message/message_impl/mod.rs:135-159","code":"  135 |     fn render_prefix(&self, brand: Brand, scratch: &mut MessageScratch) -> usize {\n  136 |         let program_name = match brand {\n  137 |             Brand::Oc => match self.role {\n  138 |                 Some(Role::Daemon | Role::Server) => Brand::Oc.daemon_program_name(),\n  139 |                 _ => Brand::Oc.client_program_name(),\n  140 |             },\n  141 |             Brand::Upstream => Brand::Upstream.client_program_name(),\n  142 |         };\n  143 |         let severity = self.severity.as_str();\n  144 |         let buffer = scratch.prefix_buffer_mut();\n  145 |         let mut len = 0usize;\n  146 | \n  147 |         buffer[..program_name.len()].copy_from_slice(program_name.as_bytes());\n  148 |         len += program_name.len();\n  149 |         buffer[len] = b' ';\n  150 |         len += 1;\n  151 |         buffer[len..len + severity.len()].copy_from_slice(severity.as_bytes());\n  152 |         len += severity.len();\n  153 |         buffer[len] = b':';\n  154 |         len += 1;\n  155 |         buffer[len] = b' ';\n  156 |         len += 1;\n  157 | \n  158 |         len\n  159 |     }","lines":25,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/core/src/message/message_impl/mod.rs#L135-L159"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"`IoUringWriter::write` and `IoUringSocketWriter::write` compute\n`self.buffer_pos + buf.len()` (an unchecked `usize + usize`) in the buffering branch.\nFor a writer whose internal buffer is near `usize::MAX` and a pathologically large\n`buf`, this overflows and in debug builds panics; in release it wraps and could make\nthe `<= self.buffer_size` test spuriously pass, leading to an out-of-bounds slice\ncopy on the next line. Not reachable with normal buffer sizes, but it is an unchecked\narithmetic on attacker/peer-influenced `buf.len()`.","fix":"Use `self.buffer_pos.checked_add(buf.len()).map_or(false, |t| t <= self.buffer_size)`\nor compare via `buf.len() <= self.buffer_size - self.buffer_pos` (buffer_pos is always\n<= buffer_size) to avoid the overflow entirely.","locations":[{"ref":"crates/fast_io/src/io_uring/file_writer.rs:259-263","code":"  259 |         if self.buffer_pos + buf.len() <= self.buffer_size {\n  260 |             self.buffer[self.buffer_pos..self.buffer_pos + buf.len()].copy_from_slice(buf);\n  261 |             self.buffer_pos += buf.len();\n  262 |             return Ok(buf.len());\n  263 |         }","lines":5,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/fast_io/src/io_uring/file_writer.rs#L259-L263"},{"ref":"crates/fast_io/src/io_uring/socket_writer.rs:271-275","code":"  271 |         if self.buffer_pos + buf.len() <= self.buffer_size {\n  272 |             self.buffer[self.buffer_pos..self.buffer_pos + buf.len()].copy_from_slice(buf);\n  273 |             self.buffer_pos += buf.len();\n  274 |             return Ok(buf.len());\n  275 |         }","lines":5,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/fast_io/src/io_uring/socket_writer.rs#L271-L275"}]},
{"id":"UAF_1","type":"use_after_free","type_label":"Use After Free","severity":"critical","difficulty":"hard","description":"`BufferRing::new` writes the ring tail u16 one-past the end of the mmap when the\nentry array exactly fills an integral number of pages, producing an out-of-bounds\nwrite into unmapped (or adjacent) memory.\n\nThe mmap is sized as:\n  ring_region_size = size_of::<IoUringBuf>() * ring_entries   (entry_size = 16)\n  ring_mmap_size   = ring_region_size.next_multiple_of(page_size)\nThe tail word is then written at `tail_offset = ring_entries * entry_size`\n(= ring_region_size). The doc comment claims `ring_mmap_size = ring_entries *\nentry_size + size_of::<u16>()`, but the code never reserves the extra tail bytes.\nWhenever `ring_region_size` is already a multiple of page_size,\n`next_multiple_of` returns `ring_region_size` unchanged, so `tail_offset ==\nring_mmap_size` and the `ptr::write(tail_ptr, ring_entries as u16)` at line 297-299\n(and the later `recycle_buffer` tail store at line 510-520) write 2 bytes starting\nat the first byte past the mapping.\n\nThis is reachable with legitimate, validator-accepted configs: ring_size must be a\npower of two, so e.g. ring_size = 256 -> 256*16 = 4096 (one page), ring_size = 512\n-> 8192, etc. all hit the bug. Result is a SIGSEGV or silent corruption of whatever\nfollows the mapping, plus the kernel reading a bogus tail from the registered ring.","fix":"Reserve space for the tail explicitly before rounding to page size, e.g.\n`let ring_mmap_size = (ring_region_size + std::mem::size_of::<u16>())\n.next_multiple_of(page_size);`. Add a debug_assert that\n`tail_offset + size_of::<u16>() <= ring_mmap_size`. (Separately, verify against the\nio_uring `struct io_uring_buf_ring` ABI: the modern PBUF_RING layout stores the tail\nin the resv field of the first entry, not in a trailing word - the current\ntrailing-word scheme may also be an ABI mismatch.)","locations":[{"ref":"crates/fast_io/src/io_uring/buffer_ring/mod.rs:206-212","code":"  206 |         // The kernel expects: sizeof(io_uring_buf) * ring_entries, plus space\n  207 |         // for the 16-bit tail at the end of the ring page.\n  208 |         let entry_size = std::mem::size_of::<IoUringBuf>();\n  209 |         let ring_region_size = entry_size * ring_entries;\n  210 |         // Round up to page size for mmap.\n  211 |         let page_size = page_size();\n  212 |         let ring_mmap_size = ring_region_size.next_multiple_of(page_size);","lines":7,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/fast_io/src/io_uring/buffer_ring/mod.rs#L206-L212"},{"ref":"crates/fast_io/src/io_uring/buffer_ring/mod.rs:287-299","code":"  287 |         // Set the initial tail to ring_entries (all buffers available).\n  288 |         // The tail pointer is at offset `ring_entries * entry_size` from the base\n  289 |         // in the mmap'd region (the kernel reads it from there).\n  290 |         let tail_offset = ring_entries * entry_size;\n  291 |         // SAFETY: the mmap reserves space for the tail word at this offset\n  292 |         // (see `ring_mmap_size = ring_entries * entry_size + size_of::<u16>()`)\n  293 |         // and is `u16`-aligned because `entry_size` is a multiple of 2.\n  294 |         let tail_ptr = unsafe { ring_ptr.add(tail_offset).cast::<u16>() };\n  295 |         // SAFETY: `tail_ptr` is valid and aligned per the comment above; no\n  296 |         // other thread has access to the mapping yet.\n  297 |         unsafe {\n  298 |             ptr::write(tail_ptr, ring_entries as u16);\n  299 |         }","lines":13,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/fast_io/src/io_uring/buffer_ring/mod.rs#L287-L299"},{"ref":"crates/fast_io/src/io_uring/buffer_ring/mod.rs:509-520","code":"  509 |         // Write the updated tail to the shared memory location that the kernel reads.\n  510 |         let tail_offset = self.config.ring_size as usize * entry_size;\n  511 |         // SAFETY: `tail_offset` points at the kernel-shared tail word that\n  512 |         // sits immediately after the entry array (sized into the mmap at\n  513 |         // construction). The pointer is `u16`-aligned because `entry_size`\n  514 |         // is a multiple of 2 and the mapping is page-aligned.\n  515 |         let tail_ptr = unsafe { self.ring_ptr.add(tail_offset).cast::<AtomicU16>() };\n  516 |         let new_tail = tail.wrapping_add(1);\n  517 |         // SAFETY: `tail_ptr` references the shared tail word; reborrowing as\n  518 |         // an `AtomicU16` is sound because the kernel uses single-word loads\n  519 |         // with matching alignment per the io_uring buffer-ring ABI.\n  520 |         unsafe { &*tail_ptr }.store(new_tail, Ordering::Release);","lines":12,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/fast_io/src/io_uring/buffer_ring/mod.rs#L509-L520"}]},
{"id":"RACE_1","type":"race_condition","type_label":"Race Condition","severity":"medium","difficulty":"hard","description":"`try_send_zc` permanently discards CQEs that belong to other in-flight operations on\nthe same ring. The drain loop calls `ring.completion().next()` (which *pops* the\nCQE) and, when `cqe.user_data() != tagged`, `continue`s - dropping that completion on\nthe floor. The doc says \"Real callers route those through their own demux\", but the\nCQE has already been consumed and cannot be re-observed, so the operation that\nsubmitted it will block forever / lose its result. With `ZeroCopySender::send_zc`\nthis is mostly masked because the `Arc<Mutex<IoUring>>` serialises submissions, but a\nring shared via `from_shared_ring` can carry queued CQEs from a previous lock holder\n(e.g. an op that errored without being fully reaped), and those are silently eaten\nhere.","fix":"Do not pop CQEs that do not belong to this submission. Either require that\n`try_send_zc` owns the ring exclusively (document and assert the CQ is empty on\nentry), or buffer foreign CQEs and re-post / hand them back to the caller's demux\nrather than discarding them. At minimum, return an error instead of silently dropping\nan unexpected `user_data`.","locations":[{"ref":"crates/fast_io/src/io_uring/send_zc.rs:220-235","code":"  220 |         while let Some(cqe) = ring.completion().next() {\n  221 |             if cqe.user_data() != tagged {\n  222 |                 // CQE belongs to an unrelated SQE on the same ring; ignore\n  223 |                 // it. Real callers route those through their own demux.\n  224 |                 continue;\n  225 |             }\n  226 |             classify_cqe(\n  227 |                 cqe.result(),\n  228 |                 cqe.flags(),\n  229 |                 &mut transfer_result,\n  230 |                 &mut saw_notification,\n  231 |             );\n  232 |             if transfer_result.is_some() && saw_notification {\n  233 |                 break;\n  234 |             }\n  235 |         }","lines":16,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/fast_io/src/io_uring/send_zc.rs#L220-L235"}]},
{"id":"RACE_2","type":"race_condition","type_label":"Race Condition","severity":"negligible","difficulty":"easy","description":"`rss::store_cached` writes the cached RSS bytes and the cache deadline under\ntwo separate operations (a relaxed atomic store for the value, then a\n`Mutex`-guarded store for the deadline). Concurrent refreshers can interleave\nso the published `RSS_CACHE_BYTES` value and the `RSS_CACHE_DEADLINE`\ntimestamp come from different probes. The values are purely diagnostic\n(RSS-pressure spill heuristic) and both are bounded valid readings, so the\nworst case is using a slightly stale-but-valid RSS for one TTL window. Noted\nfor completeness; not a correctness bug.","fix":"If exactness ever matters, store the (bytes, deadline) pair under the same\nmutex (or pack both into one atomic) so a reader never pairs a value from one\nprobe with a deadline from another.","locations":[{"ref":"crates/engine/src/concurrent_delta/spill/rss.rs:107-112","code":"  107 | fn store_cached(bytes: u64) {\n  108 |     RSS_CACHE_BYTES.store(bytes, Ordering::Relaxed);\n  109 |     if let Ok(mut guard) = RSS_CACHE_DEADLINE.lock() {\n  110 |         *guard = Some(Instant::now() + RSS_CACHE_TTL);\n  111 |     }\n  112 | }","lines":6,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/engine/src/concurrent_delta/spill/rss.rs#L107-L112"}]},
{"id":"RES_1","type":"resource_leak","type_label":"Resource Leak","severity":"medium","difficulty":"medium","description":"Unbounded line reads on network input. `read_trimmed_line` uses `BufRead::read_line` with no\nlength cap, and the protocol-30 client-argument reader uses `read_until(b'\\0', ...)` likewise\nuncapped (client_args.rs:31). A connected peer can stream an arbitrarily long line / argument\nwith no terminator, forcing the daemon to grow a single `String`/`Vec` until memory is\nexhausted. The 10s `SOCKET_TIMEOUT` (daemon.rs:115) bounds slow-loris but a fast peer can push\nmany gigabytes within the window; with concurrent connections this is a memory-exhaustion DoS.\nUpstream rsync caps such reads (BIGPATHBUFLEN).","fix":"Impose a maximum line/argument length (e.g. take(MAX) over the reader, or a manual byte loop\nwith a cap) and abort the connection with an error once exceeded, mirroring upstream's bounded\nbuffers. Apply to handshake lines, module name, auth response, and per-argument reads.","locations":[{"ref":"crates/daemon/src/daemon/sections/greeting.rs:96-109","code":"   96 | pub(crate) fn read_trimmed_line<R: BufRead>(reader: &mut R) -> io::Result<Option<String>> {\n   97 |     let mut line = String::new();\n   98 |     let bytes = reader.read_line(&mut line)?;\n   99 | \n  100 |     if bytes == 0 {\n  101 |         return Ok(None);\n  102 |     }\n  103 | \n  104 |     while line.ends_with('\\n') || line.ends_with('\\r') {\n  105 |         line.pop();\n  106 |     }\n  107 | \n  108 |     Ok(Some(line))\n  109 | }","lines":14,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/daemon/src/daemon/sections/greeting.rs#L96-L109"}]},
{"id":"RES_2","type":"resource_leak","type_label":"Resource Leak","severity":"low","difficulty":"easy","description":"In `try_refs_reflink_impl`, after the destination handle is wrapped in a `File`\n(`dst_file`) and `dst_file.set_len(file_size)` is called at the end, the success\npath returns `Ok(())` and `dst_file` drops, closing the handle - fine. But on the\n`set_len(aligned_size)` early-error branch (line ~419) the code closes\n`src_handle` and returns the error; `dst_file` drops and closes its handle too,\nyet the partially-created (CREATE_ALWAYS, possibly zero/aligned-sized)\ndestination file is left on disk. The Linux/macOS dispatch arms remove the\ndestination on failure (`std::fs::remove_file(dst)`), but this Windows reflink\nhelper leaves a stale, wrongly-sized destination behind on the set_len failure\nand on the ioctl failure path (it only `drop`s the file, never unlinks it).","fix":"On the `set_len` and ioctl failure branches, remove the destination file\n(`std::fs::remove_file(dst)`) before returning, matching the cleanup the\nLinux/macOS `platform_copy_impl` arms perform, or document that the caller in\n`platform_copy_impl` already does the `remove_file(dst)` cleanup (it does for the\ntop-level call, but `try_refs_reflink` is also a public stand-alone API where no\nsuch cleanup exists).","locations":[{"ref":"crates/fast_io/src/platform_copy/dispatch.rs:430-475","code":"  430 |     let dst_file = unsafe { std::fs::File::from_raw_handle(dst_raw_handle) };\n  431 | \n  432 |     // Pre-size to the cluster-aligned size required by the ioctl.\n  433 |     if let Err(e) = dst_file.set_len(aligned_size) {\n  434 |         // SAFETY: src_handle is a valid open handle.\n  435 |         unsafe { CloseHandle(src_handle) };\n  436 |         return Err(e);\n  437 |     }\n  438 | \n  439 |     let dst_handle = dst_file.as_raw_handle();\n  440 | \n  441 |     let dup_data = DuplicateExtentsData {\n  442 |         file_handle: src_handle as isize,\n  443 |         source_file_offset: 0,\n  444 |         target_file_offset: 0,\n  445 |         byte_count: aligned_size as i64,\n  446 |     };\n  447 | \n  448 |     let mut bytes_returned: u32 = 0;\n  449 | \n  450 |     // SAFETY: dst_handle is a valid open file handle with read/write access.\n  451 |     // src_handle (inside dup_data.file_handle) is a valid open handle with read access.\n  452 |     // dup_data is a properly initialized DuplicateExtentsData struct with\n  453 |     // cluster-aligned offsets. bytes_returned is a valid output pointer.\n  454 |     let ioctl_result = unsafe {\n  455 |         DeviceIoControl(\n  456 |             dst_handle as HANDLE,\n  457 |             FSCTL_DUPLICATE_EXTENTS_TO_FILE,\n  458 |             &dup_data as *const DuplicateExtentsData as *const std::ffi::c_void,\n  459 |             std::mem::size_of::<DuplicateExtentsData>() as u32,\n  460 |             std::ptr::null_mut(),\n  461 |             0,\n  462 |             &mut bytes_returned,\n  463 |             std::ptr::null_mut(),\n  464 |         )\n  465 |     };\n  466 | \n  467 |     // SAFETY: src_handle is a valid open handle; dst_file will close\n  468 |     // dst_handle on drop.\n  469 |     unsafe { CloseHandle(src_handle) };\n  470 | \n  471 |     if ioctl_result == 0 {\n  472 |         let err = io::Error::last_os_error();\n  473 |         drop(dst_file);\n  474 |         return Err(err);\n  475 |     }","lines":46,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/fast_io/src/platform_copy/dispatch.rs#L430-L475"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"very_easy","description":"`AsyncRateLimiter::consume` computes the sleep in `u128` nanoseconds but then\ncasts to `u64` (`Duration::from_nanos(sleep_nanos as u64)`). For a very large\nsingle request (`deficit` near `u64::MAX`) at a low rate, `sleep_nanos` exceeds\n`u64::MAX` and the cast truncates (wraps), producing a far-too-short sleep that\ndefeats the rate limit for that call. The token replenish path is similarly\nclamped only via `.min(u64::MAX)` for `earned`, but the sleep duration has no\nsaturating clamp.","fix":"Saturate before the cast: `let sleep_nanos = u64::try_from(sleep_nanos).unwrap_or(u64::MAX);`\nthen `Duration::from_nanos(sleep_nanos)`.","locations":[{"ref":"crates/bandwidth/src/async_limiter.rs:88-91","code":"   88 |         let sleep_nanos = (deficit as u128) * 1_000_000_000 / (self.rate.get() as u128);\n   89 |         let sleep_duration = Duration::from_nanos(sleep_nanos as u64);\n   90 | \n   91 |         tokio::time::sleep(sleep_duration).await;","lines":4,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/bandwidth/src/async_limiter.rs#L88-L91"}]},
{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`FileEntry::write_to` truncates the `i64` `mtime` to `i32`\n(`write_i32(writer, self.mtime as i32)`) and `read_from` sign-extends it back\nto `i64`. Any modification time outside the signed-32-bit range (after\n2038-01-19 or before 1901) is silently corrupted on round-trip. The type is\ndocumented as an internal/local encoding (not upstream-compatible), so impact\nis limited, but the truncation is a latent data-loss bug if this encoding is\never used for real metadata.","fix":"Serialize the full `i64` mtime with `write_u64`/`read_u64` (or `write_i64`),\nmatching the `size` field which already uses 64-bit width.","locations":[{"ref":"crates/batch/src/format/file_entry.rs:53-54","code":"   53 |         write_u64(writer, self.size)?;\n   54 |         write_i32(writer, self.mtime as i32)?;","lines":2,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/batch/src/format/file_entry.rs#L53-L54"},{"ref":"crates/batch/src/format/file_entry.rs:77-78","code":"   77 |         let size = read_u64(reader)?;\n   78 |         let mtime = read_i32(reader)? as i64;","lines":2,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/batch/src/format/file_entry.rs#L77-L78"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"In `start_compressor` the adaptive controller's recommended level (an i32) is converted with `recommended as u8`. The `== 0` case is handled, but a negative or >255 recommendation would silently wrap to an unexpected u8 and be wrapped in `CompressionLevel::Precise`. The code relies entirely on the controller clamping to valid bounds; there is no defensive clamp at the cast site, so a future controller change (or a codec with a level outside 1..=255) would produce a wrong compression level rather than an error or a clean fallback.","fix":"Clamp `recommended` into the codec's valid range before the cast (e.g. `recommended.clamp(0, 9)` for zlib) or match on out-of-range values and fall back to `self.compression_level()`.","locations":[{"ref":"crates/engine/src/local_copy/context_impl/transfer.rs:30-43","code":"   30 |         let level = if let Some(ctrl) = &self.adaptive_level {\n   31 |             // Convert the adaptive strategy's recommended i32 level to a\n   32 |             // CompressionLevel. The controller clamps to codec-valid bounds.\n   33 |             let recommended = ctrl.current_level();\n   34 |             if recommended == 0 {\n   35 |                 CompressionLevel::None\n   36 |             } else if let Some(nz) = std::num::NonZeroU8::new(recommended as u8) {\n   37 |                 CompressionLevel::Precise(nz)\n   38 |             } else {\n   39 |                 self.compression_level()\n   40 |             }\n   41 |         } else {\n   42 |             self.compression_level()\n   43 |         };","lines":14,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/engine/src/local_copy/context_impl/transfer.rs#L30-L43"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`read_all_batched` computes `(file_size - offset + buf_size - 1) / buf_size` and\n`offset += batch_count * buf_size` using `usize` arithmetic with no checked ops.\n`batch_count * buf_size` is bounded by the config so the increment is fine in\npractice, but `file_size - offset + buf_size - 1` adds `buf_size - 1` to a value\nthat may already be near `usize::MAX` on a 32-bit target with a huge file_size\ncast from u64; the file_size is `self.size as usize`, which already truncates a\n>4 GiB file on 32-bit Windows, leading to a short read rather than an error.","fix":"On 32-bit targets guard `self.size as usize` truncation (reject or chunk files\nlarger than `usize::MAX`), and use `div_ceil` / checked arithmetic for the\nbatch-count and offset math.","locations":[{"ref":"crates/fast_io/src/iocp/file_reader.rs:165-180","code":"  165 |     pub fn read_all_batched(&mut self) -> io::Result<Vec<u8>> {\n  166 |         let file_size = self.size as usize;\n  167 |         if file_size == 0 {\n  168 |             return Ok(Vec::new());\n  169 |         }\n  170 | \n  171 |         let mut result = vec![0u8; file_size];\n  172 |         let buf_size = self.config.buffer_size;\n  173 |         let max_concurrent = self.config.concurrent_ops as usize;\n  174 |         let mut offset: usize = 0;\n  175 | \n  176 |         while offset < file_size {\n  177 |             let batch_count = std::cmp::min(\n  178 |                 max_concurrent,\n  179 |                 (file_size - offset + buf_size - 1) / buf_size,\n  180 |             );","lines":16,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/fast_io/src/iocp/file_reader.rs#L165-L180"}]},
{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`recv_fd_to_file` truncates the `u64` length to `usize` when calling\n`try_splice_to_file(source_fd, dest_fd, length as usize)`. On a 32-bit target a\n`length >= 4 GiB` silently wraps to a much smaller transfer; the splice path then\nreports far fewer bytes than requested and the loop in the high-level caller may treat\nthe short result as EOF. The fallback `copy_fd_to_fd` correctly keeps the `u64`, so\nonly the splice fast path is affected.","fix":"Clamp per call instead of truncating: pass `length.min(usize::MAX as u64) as usize`\nand loop on the splice path until the full u64 length is drained, or document/guard\nthat `recv_fd_to_file` is 64-bit-only.","locations":[{"ref":"crates/fast_io/src/splice/syscalls.rs:330-343","code":"  330 | #[cfg(target_os = \"linux\")]\n  331 | pub fn recv_fd_to_file(\n  332 |     source_fd: std::os::fd::RawFd,\n  333 |     dest_fd: std::os::fd::RawFd,\n  334 |     length: u64,\n  335 | ) -> std::io::Result<u64> {\n  336 |     if length >= SPLICE_THRESHOLD {\n  337 |         if let Ok(n) = try_splice_to_file(source_fd, dest_fd, length as usize) {\n  338 |             return Ok(n as u64);\n  339 |         }\n  340 |         // Fall through to read/write fallback\n  341 |     }\n  342 |     copy_fd_to_fd(source_fd, dest_fd, length)\n  343 | }","lines":14,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/fast_io/src/splice/syscalls.rs#L330-L343"}]},
{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`Nfs4Acl::from_bytes` computes `offset + who_len` where `who_len` is an attacker/\nfilesystem-controlled `u32` widened to `usize`. On 32-bit targets this addition can\nwrap, defeating the `offset + who_len > data.len()` truncation check and causing the\nsubsequent `&data[offset..offset + who_len]` slice to panic (or, in the worst case,\nread past the validated bound). The data originates from the `system.nfs4_acl` xattr,\nwhich on an untrusted/NFS-mounted filesystem is not fully trusted input.","fix":"Use checked arithmetic for the bounds test, e.g.\n`offset.checked_add(who_len).map_or(true, |end| end > data.len())` returning the\ntruncated-ACE error, before slicing.","locations":[{"ref":"crates/metadata/src/nfsv4_acl.rs:373-390","code":"  373 |             let who_len = u32::from_be_bytes(\n  374 |                 data[offset..offset + 4]\n  375 |                     .try_into()\n  376 |                     .map_err(|_| io::Error::new(io::ErrorKind::InvalidData, \"truncated ACE\"))?,\n  377 |             ) as usize;\n  378 |             offset += 4;\n  379 | \n  380 |             if offset + who_len > data.len() {\n  381 |                 return Err(io::Error::new(\n  382 |                     io::ErrorKind::InvalidData,\n  383 |                     \"truncated ACE who field\",\n  384 |                 ));\n  385 |             }\n  386 | \n  387 |             let who = std::str::from_utf8(&data[offset..offset + who_len])\n  388 |                 .map_err(|_| io::Error::new(io::ErrorKind::InvalidData, \"invalid UTF-8 in ACE\"))?\n  389 |                 .to_owned();\n  390 |             offset += who_len;","lines":18,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/metadata/src/nfsv4_acl.rs#L373-L390"}]},
{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`decode_symlink_target` casts the wire length via `read_varint30_int(...)? as\nusize`. A negative `i32` length (e.g. -1) becomes `usize::MAX`. The guard\n`if len > MAX_SYMLINK_TARGET_LEN` does catch this (usize::MAX > 4096) and returns\nan error, so there is no allocation/panic here. Flagged only as defense-in-depth /\nconsistency: unlike `decode_name`, this path is safe today purely because the cap\ncheck happens to reject the huge value. A reviewer changing the cap to a\n`saturating`/relative form could reintroduce a vulnerability.","fix":"Reject negative lengths explicitly before the `as usize` cast (read into i32,\ncheck `< 0`) so the safety does not depend on the magnitude relationship between\n`usize::MAX` and the cap constant.","locations":[{"ref":"crates/protocol/src/wire/file_entry_decode/symlink.rs:28-39","code":"   28 | pub fn decode_symlink_target<R: Read>(reader: &mut R, protocol_version: u8) -> io::Result<Vec<u8>> {\n   29 |     let len = read_varint30_int(reader, protocol_version)? as usize;\n   30 |     if len > MAX_SYMLINK_TARGET_LEN {\n   31 |         return Err(io::Error::new(\n   32 |             io::ErrorKind::InvalidData,\n   33 |             format!(\"symlink target length {len} exceeds maximum {MAX_SYMLINK_TARGET_LEN}\"),\n   34 |         ));\n   35 |     }\n   36 |     let mut target = vec![0u8; len];\n   37 |     reader.read_exact(&mut target)?;\n   38 |     Ok(target)\n   39 | }","lines":12,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/protocol/src/wire/file_entry_decode/symlink.rs#L28-L39"}]},
{"id":"OVF_8","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`recv_xattr_request` accumulates `let num = prior_req + rel;` where both\noperands are `i32` read from / derived from the wire, and `rel` is an\nunbounded `read_varint` value. A hostile sequence of large positive `rel`\ndeltas overflows the `i32` addition, panicking in debug builds. The\nsubsequent `(num - 1) as usize` can also underflow/produce a bogus index,\nthough the `idx < list.len()` guard prevents an out-of-bounds access.","fix":"Use `prior_req.checked_add(rel)` and reject overflow with `InvalidData`;\nlikewise validate `num >= 1` before computing the 0-based index.","locations":[{"ref":"crates/protocol/src/xattr/wire/decode.rs:238-257","code":"  238 | pub fn recv_xattr_request<R: Read>(reader: &mut R, list: &mut XattrList) -> io::Result<Vec<usize>> {\n  239 |     let mut indices = Vec::new();\n  240 |     let mut prior_req = 0i32;\n  241 | \n  242 |     loop {\n  243 |         let rel = read_varint(reader)?;\n  244 |         if rel == 0 {\n  245 |             // upstream: 0 terminates the request list\n  246 |             break;\n  247 |         }\n  248 | \n  249 |         // upstream: ndx = read_varint(f) + prior_req (1-based)\n  250 |         let num = prior_req + rel;\n  251 |         let idx = (num - 1) as usize;\n  252 |         if idx < list.len() {\n  253 |             list.mark_todo(idx);\n  254 |             indices.push(idx);\n  255 |         }\n  256 |         prior_req = num;\n  257 |     }","lines":20,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/protocol/src/xattr/wire/decode.rs#L238-L257"}]},
{"id":"OVF_9","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"negligible","difficulty":"easy","description":"`compute_duplicate_extents_params` computes `let end = src_offset + byte_count;`\nand `aligned_end = end.div_ceil(cluster_size) * cluster_size` with unchecked u64\narithmetic. For pathological caller inputs near `u64::MAX` this overflows and\npanics in debug / wraps in release, yielding a bogus (tiny) byte_count for the\nFSCTL. Reachable only via `try_refs_reflink_range` with attacker/caller-supplied\noffsets, which are normally cluster-bounded file offsets, so impact is minimal.","fix":"Use `checked_add` / `saturating` arithmetic for `end` and the round-up, and\nreturn `io::ErrorKind::InvalidInput` on overflow rather than panicking/wrapping.","locations":[{"ref":"crates/fast_io/src/platform_copy/dispatch.rs:809-827","code":"  809 | pub(super) fn compute_duplicate_extents_params(\n  810 |     src_offset: u64,\n  811 |     dst_offset: u64,\n  812 |     byte_count: u64,\n  813 |     cluster_size: u64,\n  814 | ) -> DuplicateExtentsParams {\n  815 |     debug_assert!(cluster_size > 0, \"cluster_size must be positive\");\n  816 | \n  817 |     let aligned_src = (src_offset / cluster_size) * cluster_size;\n  818 |     let aligned_dst = (dst_offset / cluster_size) * cluster_size;\n  819 |     let end = src_offset + byte_count;\n  820 |     let aligned_end = end.div_ceil(cluster_size) * cluster_size;\n  821 | \n  822 |     DuplicateExtentsParams {\n  823 |         source_offset: aligned_src,\n  824 |         target_offset: aligned_dst,\n  825 |         byte_count: aligned_end - aligned_src,\n  826 |     }\n  827 | }","lines":19,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/fast_io/src/platform_copy/dispatch.rs#L809-L827"}]},
{"id":"OVF_10","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"negligible","difficulty":"easy","description":"`MmapStrategy::map_ptr` computes `let start = offset as usize; let end = start\n+ len;`. On a 32-bit target, `offset as usize` truncates a 64-bit offset to 32\nbits, so an offset above 4 GiB could wrap and index a wrong region of the\nmmap. The preceding bounds check at line 56 compares in u64\n(`offset.saturating_add(len as u64) > size`) and would reject out-of-range\noffsets, so this is only reachable if `size` itself exceeds usize on a 32-bit\nbuild (i.e. a >4 GiB mmap, which `MmapReader` could not create on 32-bit\nanyway). Practically unreachable on supported targets; flagged for\ncompleteness given the audit's off-by-one/offset focus.","fix":"Convert via `usize::try_from(offset)` and return `UnexpectedEof`/`InvalidData` on failure, making the truncation impossible by construction.","locations":[{"ref":"crates/transfer/src/map_file/mmap.rs:50-65","code":"   50 |     fn map_ptr(&mut self, offset: u64, len: usize) -> io::Result<&[u8]> {\n   51 |         if len == 0 {\n   52 |             return Ok(&[]);\n   53 |         }\n   54 | \n   55 |         let size = self.mmap.size();\n   56 |         if offset.saturating_add(len as u64) > size {\n   57 |             return Err(io::Error::new(\n   58 |                 io::ErrorKind::UnexpectedEof,\n   59 |                 \"requested range extends past end of file\",\n   60 |             ));\n   61 |         }\n   62 | \n   63 |         let start = offset as usize;\n   64 |         let end = start + len;\n   65 |         Ok(&self.mmap.as_slice()[start..end])","lines":16,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/transfer/src/map_file/mmap.rs#L50-L65"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"very_easy","description":"`--copy-unsafe-links` incorrectly enables `safe_links`. `copy_unsafe_links_option`\nis `Some(true)` for `--copy-unsafe-links` and `Some(false)` for `--safe-links`. The\nfinal `safe_links` flag is then computed as\n`matches.get_flag(\"safe-links\") || copy_unsafe_links_option == Some(true)`, so passing\nonly `--copy-unsafe-links` turns `safe_links` on. `safe_links` and `copy_unsafe_links`\nare passed as independent engine settings (config.rs:263-265, run.rs:780-782), and in\nupstream rsync `--copy-unsafe-links` does NOT imply `--safe-links` - the two are\ndistinct (copy the referent of unsafe links vs. silently skip unsafe links). The bug\nmakes unsafe symlinks get filtered out instead of copied as their referents, the exact\nopposite of what `--copy-unsafe-links` requests.","fix":"Set `safe_links` from `--safe-links` only:\n`let safe_links = matches.get_flag(\"safe-links\");`\nDo not OR in `copy_unsafe_links_option == Some(true)`. The two flags are independent and\nalready forwarded separately to the engine.","locations":[{"ref":"crates/cli/src/frontend/arguments/parser/entry.rs:629-641","code":"  629 |     let copy_unsafe_links_option = if matches.get_flag(\"copy-unsafe-links\") {\n  630 |         Some(true)\n  631 |     } else if matches.get_flag(\"safe-links\") {\n  632 |         Some(false)\n  633 |     } else {\n  634 |         None\n  635 |     };\n  636 |     let keep_dirlinks = if matches.get_flag(\"keep-dirlinks\") {\n  637 |         Some(true)\n  638 |     } else {\n  639 |         None\n  640 |     };\n  641 |     let safe_links = matches.get_flag(\"safe-links\") || copy_unsafe_links_option == Some(true);","lines":13,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/cli/src/frontend/arguments/parser/entry.rs#L629-L641"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"Remote-to-remote (proxy) transfers abort after 30 seconds of wall-clock time, even when the\ntransfer is progressing normally. `run_bidirectional_relay` spawns two relay threads that each run\n`relay_data` until the underlying stream reaches EOF, and they only report their result on an mpsc\nchannel when that loop finishes. The main thread then waits for the result with\n`s2d_rx.recv_timeout(RELAY_THREAD_TIMEOUT)` where `RELAY_THREAD_TIMEOUT = Duration::from_secs(30)`.\nFor any proxy transfer whose total duration exceeds 30 seconds (i.e. any non-trivial amount of\ndata), the `recv_timeout` fires `RecvTimeoutError::Timeout`, the code sets the shutdown flag and\nreturns \"source->dest relay thread timed out\" with exit code 23, killing a perfectly healthy\ntransfer mid-stream. The constant is meant to bound the *post-completion* drain, but it is applied\nto the entire transfer because the threads do not signal until completion.","fix":"Do not bound the whole transfer with a fixed timeout. Use blocking `recv()` (or `join` the thread\nhandles) so the relay runs to completion, and only apply a short drain timeout after one direction\nhas already signalled EOF. Alternatively join the threads directly and rely on the per-stream I/O\ntimeouts already configured on the SSH connections.","locations":[{"ref":"crates/core/src/client/remote/remote_to_remote.rs:230-302","code":"  230 | /// Timeout for waiting on relay threads to complete after the transfer is done.\n  231 | const RELAY_THREAD_TIMEOUT: Duration = Duration::from_secs(30);\n  232 | \n  233 | /// Runs bidirectional relay between two SSH connections using threads.\n  234 | ///\n  235 | /// Spawns two threads for deadlock-free bidirectional relay:\n  236 | /// - Thread 1: source stdout → destination stdin (file data, protocol messages)\n  237 | /// - Thread 2: destination stdout → source stdin (checksums, acks)\n  238 | ///\n  239 | /// Both threads run concurrently until EOF or error. This mirrors upstream rsync's\n  240 | /// approach of using non-blocking I/O for proxy transfers.\n  241 | ///\n  242 | /// # Arguments\n  243 | ///\n  244 | /// * `source` - SSH connection to the source host (sender/generator)\n  245 | /// * `dest` - SSH connection to the destination host (receiver)\n  246 | ///\n  247 | /// # Returns\n  248 | ///\n  249 | /// Statistics on bytes relayed in each direction on success.\n  250 | fn run_bidirectional_relay(\n  251 |     source: SshConnection,\n  252 |     dest: SshConnection,\n  253 | ) -> Result<ProxyStats, ClientError> {\n  254 |     let (source_reader, source_writer, source_handle) = source.split().map_err(|e| {\n  255 |         invalid_argument_error(&format!(\"failed to split source connection: {e}\"), 23)\n  256 |     })?;\n  257 |     let (dest_reader, dest_writer, dest_handle) = dest.split().map_err(|e| {\n  258 |         invalid_argument_error(&format!(\"failed to split destination connection: {e}\"), 23)\n  259 |     })?;\n  260 | \n  261 |     let shutdown = Arc::new(AtomicBool::new(false));\n  262 | \n  263 |     let (s2d_tx, s2d_rx) = mpsc::channel();\n  264 |     let (d2s_tx, d2s_rx) = mpsc::channel();\n  265 | \n  266 |     let shutdown_s2d = Arc::clone(&shutdown);\n  267 |     thread::spawn(move || {\n  268 |         let result =\n  269 |             run_relay_with_panic_guard(source_reader, dest_writer, shutdown_s2d, \"source→dest\");\n  270 |         let _ = s2d_tx.send(result);\n  271 |     });\n  272 | \n  273 |     let shutdown_d2s = Arc::clone(&shutdown);\n  274 |     thread::spawn(move || {\n  275 |         let result =\n  276 |             run_relay_with_panic_guard(dest_reader, source_writer, shutdown_d2s, \"dest→source\");\n  277 |         let _ = d2s_tx.send(result);\n  278 |     });\n  279 | \n  280 |     let s2d_result = s2d_rx\n  281 |         .recv_timeout(RELAY_THREAD_TIMEOUT)\n  282 |         .map_err(|e| match e {\n  283 |             mpsc::RecvTimeoutError::Timeout => {\n  284 |                 shutdown.store(true, Ordering::SeqCst);\n  285 |                 invalid_argument_error(\"source→dest relay thread timed out\", 23)\n  286 |             }\n  287 |             mpsc::RecvTimeoutError::Disconnected => {\n  288 |                 invalid_argument_error(\"source→dest relay thread terminated unexpectedly\", 23)\n  289 |             }\n  290 |         })??;\n  291 | \n  292 |     let d2s_result = d2s_rx\n  293 |         .recv_timeout(RELAY_THREAD_TIMEOUT)\n  294 |         .map_err(|e| match e {\n  295 |             mpsc::RecvTimeoutError::Timeout => {\n  296 |                 shutdown.store(true, Ordering::SeqCst);\n  297 |                 invalid_argument_error(\"dest→source relay thread timed out\", 23)\n  298 |             }\n  299 |             mpsc::RecvTimeoutError::Disconnected => {\n  300 |                 invalid_argument_error(\"dest→source relay thread terminated unexpectedly\", 23)\n  301 |             }\n  302 |         })??;","lines":73,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/core/src/client/remote/remote_to_remote.rs#L230-L302"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"Async sparse copy truncates files that end in a zero run. In\n`copy_file_with_progress`, a chunk detected as all-zeros is handled by\nseeking the destination writer forward (`SeekFrom::Current(n)`) instead of\nwriting. After the read loop, the code only `flush`es and never extends the\nfile to `total_bytes`. On a regular file, seeking past the current end\nwithout a subsequent write does NOT grow the file, so if the source's final\nchunk(s) are all zeros, the destination ends up shorter than the source\n(the trailing hole is lost). The existing `test_sparse_detection` masks this\nbecause its payload ends in a non-zero \"TAIL\" marker. rsync semantics require\nthe output file to match the source length. Fix: after the loop, when sparse\ndetection is enabled, `set_len(total_bytes)` (or seek-back-one and write a\nsingle zero byte) so a trailing hole materialises.","fix":"After the read loop (and before/after flush), when `self.sparse_detection`\nis on and `bytes_copied < total_bytes`-equivalent trailing seek occurred,\ncall `writer.get_mut().set_len(bytes_copied).await` (or, after flush, seek to\nend-1 and write a single `\\0`) so the destination length always equals the\nsource length even when it ends in a zero run.","locations":[{"ref":"crates/engine/src/async_io/copier.rs:141-177","code":"  141 |         loop {\n  142 |             let n = reader.read(&mut buffer).await.with_path(source)?;\n  143 | \n  144 |             if n == 0 {\n  145 |                 break;\n  146 |             }\n  147 | \n  148 |             let chunk = &buffer[..n];\n  149 | \n  150 |             if self.sparse_detection && SparseDetector::is_all_zeros(chunk) {\n  151 |                 writer\n  152 |                     .seek(SeekFrom::Current(n as i64))\n  153 |                     .await\n  154 |                     .with_path(destination)?;\n  155 |             } else {\n  156 |                 writer.write_all(chunk).await.with_path(destination)?;\n  157 |             }\n  158 | \n  159 |             bytes_copied += n as u64;\n  160 | \n  161 |             if last_progress.elapsed() >= Duration::from_millis(100) {\n  162 |                 progress(CopyProgress {\n  163 |                     bytes_copied,\n  164 |                     total_bytes,\n  165 |                     elapsed: start.elapsed(),\n  166 |                     source: source.to_path_buf(),\n  167 |                     destination: destination.to_path_buf(),\n  168 |                 });\n  169 |                 last_progress = Instant::now();\n  170 |             }\n  171 |         }\n  172 | \n  173 |         writer.flush().await.with_path(destination)?;\n  174 | \n  175 |         if self.fsync {\n  176 |             writer.get_mut().sync_all().await.with_path(destination)?;\n  177 |         }","lines":37,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/engine/src/async_io/copier.rs#L141-L177"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"hard","description":"`IocpReader::read_at` (and the batched `read_all_batched`) submit overlapped\n`ReadFile` against a handle opened with `FILE_FLAG_OVERLAPPED`, but the reader\nnever calls `SetFileCompletionNotificationModes(FILE_SKIP_COMPLETION_PORT_ON_SUCCESS)`\nthe way `IocpWriter::open_with_disposition` does. When `ReadFile` completes\nsynchronously and returns TRUE, Windows STILL queues a completion packet to the\nassociated completion port. `read_at` takes the inline `if success == TRUE`\nbranch and returns `Ok(n)` without draining that packet. The next `read_at` /\nbatched read then calls `GetQueuedCompletionStatus`, which dequeues the stale\ncompletion from the previous synchronous read instead of the current operation -\nreturning the wrong `transferred` count and copying the wrong buffer. This\ncorrupts read results whenever cached reads complete inline (the common case on\nwarm files). The disk_batch writer documents and handles exactly this (it always\ndrains even on synchronous TRUE); the reader does not.","fix":"Either call `SetFileCompletionNotificationModes(handle,\nFILE_SKIP_COMPLETION_PORT_ON_SUCCESS)` in `IocpReader::open` (matching the\nwriter), in which case the inline TRUE branch is correct and no packet is\nqueued; or, if the skip flag is not set, drain the queued completion via\n`GetQueuedCompletionStatus` even on synchronous TRUE before returning so the\nport never accumulates a stale packet.","locations":[{"ref":"crates/fast_io/src/iocp/file_reader.rs:39-85","code":"   39 |     pub fn open<P: AsRef<Path>>(path: P, config: &IocpConfig) -> io::Result<Self> {\n   40 |         let wide_path = to_wide_path(path.as_ref())?;\n   41 | \n   42 |         // SAFETY: CreateFileW with valid path and standard flags.\n   43 |         // FILE_FLAG_OVERLAPPED enables async I/O.\n   44 |         #[allow(unsafe_code)]\n   45 |         let handle = unsafe {\n   46 |             CreateFileW(\n   47 |                 wide_path.as_ptr(),\n   48 |                 FILE_GENERIC_READ,\n   49 |                 FILE_SHARE_READ,\n   50 |                 std::ptr::null(),\n   51 |                 OPEN_EXISTING,\n   52 |                 FILE_ATTRIBUTE_NORMAL | FILE_FLAG_OVERLAPPED,\n   53 |                 std::ptr::null_mut(),\n   54 |             )\n   55 |         };\n   56 | \n   57 |         if handle == windows_sys::Win32::Foundation::INVALID_HANDLE_VALUE {\n   58 |             return Err(io::Error::last_os_error());\n   59 |         }\n   60 | \n   61 |         let port = CompletionPort::new(1)?;\n   62 |         port.associate(handle, 0)?;\n   63 | \n   64 |         let size = {\n   65 |             // SAFETY: FromRawHandle borrows the handle; mem::forget below\n   66 |             // prevents File from closing it because Drop closes it manually.\n   67 |             #[allow(unsafe_code)]\n   68 |             let file = unsafe {\n   69 |                 use std::os::windows::io::FromRawHandle;\n   70 |                 File::from_raw_handle(handle as *mut std::ffi::c_void)\n   71 |             };\n   72 |             let metadata = file.metadata()?;\n   73 |             let len = metadata.len();\n   74 |             std::mem::forget(file);\n   75 |             len\n   76 |         };\n   77 | \n   78 |         Ok(Self {\n   79 |             handle,\n   80 |             port,\n   81 |             config: config.clone(),\n   82 |             size,\n   83 |             position: 0,\n   84 |         })\n   85 |     }","lines":47,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/fast_io/src/iocp/file_reader.rs#L39-L85"},{"ref":"crates/fast_io/src/iocp/file_reader.rs:113-119","code":"  113 |         if success == TRUE {\n  114 |             // ReadFile may complete synchronously even with FILE_FLAG_OVERLAPPED;\n  115 |             // when it does, no completion will be queued so handle it inline.\n  116 |             let n = bytes_read as usize;\n  117 |             buf[..n].copy_from_slice(&op.buffer[..n]);\n  118 |             return Ok(n);\n  119 |         }","lines":7,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/fast_io/src/iocp/file_reader.rs#L113-L119"},{"ref":"crates/fast_io/src/iocp/file_reader.rs:210-216","code":"  210 |                 if success != TRUE {\n  211 |                     let err = io::Error::last_os_error();\n  212 |                     if err.raw_os_error() != Some(997) {\n  213 |                         return Err(classify_overlapped_error(err, \"ReadFile(batched)\"));\n  214 |                     }\n  215 |                 }\n  216 |             }","lines":7,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/fast_io/src/iocp/file_reader.rs#L210-L216"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"The MD4 batch dispatcher ignores the process-global `--simd` override\n(`cpu_features::feature_allowed`). The module documentation in\n`cpu_features.rs:18-24` explicitly states the override \"is read by every\nchecksum dispatcher (rolling x86/neon, MD5 batch dispatcher)\", and indeed the\nMD5 batch dispatcher (`md5_dispatcher.rs:126-210`) and the rolling-checksum\ndispatcher (`rolling/checksum/x86.rs:99-113`, `neon.rs:80-89`) all gate feature\ndetection through `feature_allowed`. The MD4 dispatcher's `has_avx512`,\n`has_avx2`, `has_sse2`, `has_neon`, and `has_wasm_simd` functions do NOT call\n`feature_allowed`, so they always select the widest SIMD backend the host CPU\nadvertises. Consequence: `--simd=none`, `--simd=sse4`, etc. silently do NOT\ntake effect for MD4 batch hashing, which is rsync's default strong checksum for\nprotocol < 30. Output is still correct (SIMD parity is tested), but the CLI\noverride is broken for this path - defeating its intended use for debugging,\nreproducibility, and working around faulty SIMD on a given host.","fix":"Mirror the MD5 dispatcher: import `crate::cpu_features::{SimdFeature,\nfeature_allowed}` and add `if !feature_allowed(SimdFeature::Avx512) { return\nfalse; }` (and the Avx2/Sse2/Neon analogues) at the top of each `has_*` helper\nso MD4 batch dispatch honours the same override as every other dispatcher.","locations":[{"ref":"crates/checksums/src/simd_batch/md4/mod.rs:92-145","code":"   92 |     fn has_avx512() -> bool {\n   93 |         #[cfg(target_arch = \"x86_64\")]\n   94 |         {\n   95 |             is_x86_feature_detected!(\"avx512f\") && is_x86_feature_detected!(\"avx512bw\")\n   96 |         }\n   97 |         #[cfg(not(target_arch = \"x86_64\"))]\n   98 |         {\n   99 |             false\n  100 |         }\n  101 |     }\n  102 | \n  103 |     fn has_avx2() -> bool {\n  104 |         #[cfg(target_arch = \"x86_64\")]\n  105 |         {\n  106 |             is_x86_feature_detected!(\"avx2\")\n  107 |         }\n  108 |         #[cfg(not(target_arch = \"x86_64\"))]\n  109 |         {\n  110 |             false\n  111 |         }\n  112 |     }\n  113 | \n  114 |     fn has_sse2() -> bool {\n  115 |         #[cfg(target_arch = \"x86_64\")]\n  116 |         {\n  117 |             true\n  118 |         }\n  119 |         #[cfg(not(target_arch = \"x86_64\"))]\n  120 |         {\n  121 |             false\n  122 |         }\n  123 |     }\n  124 | \n  125 |     fn has_neon() -> bool {\n  126 |         #[cfg(target_arch = \"aarch64\")]\n  127 |         {\n  128 |             true\n  129 |         }\n  130 |         #[cfg(not(target_arch = \"aarch64\"))]\n  131 |         {\n  132 |             false\n  133 |         }\n  134 |     }\n  135 | \n  136 |     fn has_wasm_simd() -> bool {\n  137 |         #[cfg(all(target_arch = \"wasm32\", target_feature = \"simd128\"))]\n  138 |         {\n  139 |             true\n  140 |         }\n  141 |         #[cfg(not(all(target_arch = \"wasm32\", target_feature = \"simd128\")))]\n  142 |         {\n  143 |             false\n  144 |         }\n  145 |     }","lines":54,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/checksums/src/simd_batch/md4/mod.rs#L92-L145"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`verify_append_prefix` treats any short `read()` as a prefix mismatch: it issues one `read` per chunk for source and destination and bails with `Ok(false)` whenever `source_read != destination_read` or either is 0 before `remaining` reaches 0. `Read::read` is allowed to return fewer bytes than requested even when more data exists, so two byte-identical files can spuriously fail verification, disabling `--append` and forcing a full retransfer of the file. Data is never corrupted, but the append optimization is defeated non-deterministically.","fix":"Use `read_exact` (or a fill loop) for each `chunk`-sized read on both files instead of treating a partial read as a mismatch.","locations":[{"ref":"crates/engine/src/local_copy/executor/file/append.rs:124-148","code":"  124 |     while remaining > 0 {\n  125 |         let chunk = remaining.min(half_size as u64) as usize;\n  126 |         let source_read = reader\n  127 |             .read(&mut source_buffer[..chunk])\n  128 |             .map_err(|error| LocalCopyError::io(\"copy file\", source, error))?;\n  129 |         let destination_read = destination_file\n  130 |             .read(&mut destination_buffer[..chunk])\n  131 |             .map_err(|error| {\n  132 |                 LocalCopyError::io(\n  133 |                     \"read existing destination\",\n  134 |                     destination.to_path_buf(),\n  135 |                     error,\n  136 |                 )\n  137 |             })?;\n  138 | \n  139 |         if source_read == 0 || destination_read == 0 || source_read != destination_read {\n  140 |             return Ok(false);\n  141 |         }\n  142 | \n  143 |         if source_buffer[..source_read] != destination_buffer[..destination_read] {\n  144 |             return Ok(false);\n  145 |         }\n  146 | \n  147 |         remaining = remaining.saturating_sub(source_read as u64);\n  148 |     }","lines":25,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/engine/src/local_copy/executor/file/append.rs#L124-L148"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`compare_files_lockstep` (used by `files_checksum_match` for `--checksum` and backup content verification) returns `Ok(false)` whenever a single `read()` on the source and destination return different byte counts, even though the sizes were already verified equal by the caller. Because `read` may legitimately return short reads (different filesystems, EOF boundaries), two identical files can be reported as differing, causing `--checksum` mode to needlessly re-copy in-sync files. Safe direction (extra copy, no data loss) but defeats the skip optimization.","fix":"Read both files with `read_exact` into equal-size chunks driven by the known file length, or fill each buffer fully before comparing, rather than equating raw per-call read counts.","locations":[{"ref":"crates/engine/src/local_copy/executor/file/comparison.rs:381-412","code":"  381 | fn compare_files_lockstep<F>(source: &Path, destination: &Path, mut on_chunk: F) -> io::Result<bool>\n  382 | where\n  383 |     F: FnMut(&[u8], &[u8]) -> LockstepCheck,\n  384 | {\n  385 |     let mut source_file = fs::File::open(source)?;\n  386 |     let mut destination_file = fs::File::open(destination)?;\n  387 |     let mut source_buffer = vec![0u8; COPY_BUFFER_SIZE];\n  388 |     let mut destination_buffer = vec![0u8; COPY_BUFFER_SIZE];\n  389 | \n  390 |     loop {\n  391 |         let source_read = source_file.read(&mut source_buffer)?;\n  392 |         let destination_read = destination_file.read(&mut destination_buffer)?;\n  393 | \n  394 |         if source_read != destination_read {\n  395 |             return Ok(false);\n  396 |         }\n  397 | \n  398 |         if source_read == 0 {\n  399 |             break;\n  400 |         }\n  401 | \n  402 |         match on_chunk(\n  403 |             &source_buffer[..source_read],\n  404 |             &destination_buffer[..destination_read],\n  405 |         ) {\n  406 |             LockstepCheck::Continue => {}\n  407 |             LockstepCheck::Diverged => return Ok(false),\n  408 |         }\n  409 |     }\n  410 | \n  411 |     Ok(true)\n  412 | }","lines":32,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/engine/src/local_copy/executor/file/comparison.rs#L381-L412"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"hard","description":"`read_then_write` (and `LinkedChain` generally) silently turns any short read into a\nhard error and discards the partially-read data. With `IOSQE_IO_LINK`, the kernel\nbreaks the chain on the FIRST short or failed completion: a `read` that returns fewer\nbytes than requested (routine for pipes, sockets, NFS, and even regular files near\nEOF) causes the linked `write` SQE to be cancelled with `ECANCELED`. `read_then_write`\nthen surfaces the write CQE's `ECANCELED` via `into_io_result()` as an `io::Error`,\neven though the read succeeded partially and wrote real data into `buf` that is now\nthrown away. Callers treating this as a fatal copy failure will mis-handle the common\nshort-read case.","fix":"Inspect the read CQE (results[0]) before treating the write cancellation as an error:\nif the read returned a non-negative short count, return that count (or re-issue the\nwrite for the bytes actually read) rather than propagating ECANCELED. Document that\nthe IO_LINK fast path only succeeds end-to-end on a full read, and provide a\nfallback so the caller can retry the residual without losing the bytes already in\n`buf`.","locations":[{"ref":"crates/fast_io/src/io_uring/linked_chain.rs:307-357","code":"  307 | pub fn read_then_write(\n  308 |     mut lease: RingLease<'_>,\n  309 |     src_fd: RawFd,\n  310 |     src_offset: u64,\n  311 |     dst_fd: RawFd,\n  312 |     dst_offset: u64,\n  313 |     buf: &mut [u8],\n  314 | ) -> io::Result<u32> {\n  315 |     let len = u32::try_from(buf.len()).unwrap_or(u32::MAX);\n  316 |     let ptr = buf.as_mut_ptr();\n  317 | \n  318 |     let read_entry = opcode::Read::new(types::Fd(src_fd), ptr, len)\n  319 |         .offset(src_offset)\n  320 |         .build()\n  321 |         .user_data(0)\n  322 |         .flags(squeue::Flags::IO_LINK);\n  323 |     let write_entry = opcode::Write::new(types::Fd(dst_fd), ptr.cast_const(), len)\n  324 |         .offset(dst_offset)\n  325 |         .build()\n  326 |         .user_data(1);\n  327 | \n  328 |     // SAFETY: `buf` is borrowed for the entire call, so the pointer remains\n  329 |     // valid until both CQEs are drained below. The fds are caller-owned and\n  330 |     // outlive the call. The read and write reference the same memory but the\n  331 |     // kernel runs them strictly in order thanks to IOSQE_IO_LINK; only one\n  332 |     // op touches the buffer at a time.\n  333 |     unsafe {\n  334 |         let mut sq = lease.submission();\n  335 |         sq.push(&read_entry)\n  336 |             .map_err(|_| io::Error::other(\"submission queue full\"))?;\n  337 |         sq.push(&write_entry)\n  338 |             .map_err(|_| io::Error::other(\"submission queue full\"))?;\n  339 |     }\n  340 |     lease.submit_and_wait(2)?;\n  341 | \n  342 |     let mut results: [Option<CqeResult>; 2] = [None, None];\n  343 |     while let Some(cqe) = lease.completion().next() {\n  344 |         let idx = cqe.user_data() as usize;\n  345 |         if idx < results.len() {\n  346 |             results[idx] = Some(CqeResult {\n  347 |                 index: idx as u32,\n  348 |                 result: cqe.result(),\n  349 |             });\n  350 |         }\n  351 |     }\n  352 |     // The write CQE carries the bytes-transferred we care about. A failed\n  353 |     // read cancels the write with ECANCELED, which we surface as an error.\n  354 |     results[1]\n  355 |         .ok_or_else(|| io::Error::other(\"missing write CQE in read_then_write chain\"))?\n  356 |         .into_io_result()\n  357 | }","lines":51,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/fast_io/src/io_uring/linked_chain.rs#L307-L357"},{"ref":"crates/fast_io/src/io_uring/linked_chain.rs:216-264","code":"  216 |     pub fn submit_and_wait(mut self) -> io::Result<Vec<CqeResult>> {\n  217 |         if self.ops.is_empty() {\n  218 |             return Ok(Vec::new());\n  219 |         }\n  220 | \n  221 |         let n = self.ops.len();\n  222 |         let last = n - 1;\n  223 | \n  224 |         // SAFETY: Each SQE references a buffer that is borrowed by the\n  225 |         // chain (via the `'r` lifetime captured in `StagedOp`). The chain\n  226 |         // holds those borrows for the entire submit-and-wait cycle, so the\n  227 |         // kernel cannot access a freed or reused buffer. The fd is\n  228 |         // owned/borrowed by the caller and outlives the call. The\n  229 |         // `user_data` we attach is the chain index, which lets us attribute\n  230 |         // CQEs back to their originating SQE when the completion queue\n  231 |         // reorders them.\n  232 |         unsafe {\n  233 |             let mut sq = self.lease.submission();\n  234 |             for (idx, op) in self.ops.iter().enumerate() {\n  235 |                 let entry = build_entry(op, idx as u64);\n  236 |                 let flags = if idx == last {\n  237 |                     squeue::Flags::empty()\n  238 |                 } else {\n  239 |                     squeue::Flags::IO_LINK\n  240 |                 };\n  241 |                 let entry = entry.flags(flags);\n  242 |                 sq.push(&entry)\n  243 |                     .map_err(|_| io::Error::other(\"submission queue full\"))?;\n  244 |             }\n  245 |         }\n  246 | \n  247 |         self.lease.submit_and_wait(n)?;\n  248 | \n  249 |         let mut out = Vec::with_capacity(n);\n  250 |         while let Some(cqe) = self.lease.completion().next() {\n  251 |             out.push(CqeResult {\n  252 |                 index: cqe.user_data() as u32,\n  253 |                 result: cqe.result(),\n  254 |             });\n  255 |         }\n  256 |         if out.len() < n {\n  257 |             return Err(io::Error::other(format!(\n  258 |                 \"io_uring linked chain: expected {n} CQEs, got {}\",\n  259 |                 out.len()\n  260 |             )));\n  261 |         }\n  262 |         out.sort_by_key(|c| c.index);\n  263 |         Ok(out)\n  264 |     }","lines":49,"link":"https://github.com/oferchen/rsync/blob/201705aae01c218f1eaf67391af0ac32d945bb17/crates/fast_io/src/io_uring/linked_chain.rs#L216-L264"}]},
