<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`file::Index::from_bytes` is a public API that slices the input with `&data[toc_offset..]` without first validating that `toc_offset <= data.len()`. If a caller passes (or computes from untrusted chunk-file header data) a `toc_offset` past the end of the mapped buffer, this panics with an out-of-bounds index instead of returning the `ValidationError` the function is designed to produce. The `data_len` value is read on the line just above but never used to guard this slice.","fix":"Bounds-check before slicing, e.g.:\n`let toc_entry = data.get(toc_offset..).ok_or_else(|| ValidationError::new(\"toc_offset is past the end of the chunk file\"))?;`","locations":[{"ref":"gix-chunk/src/file/decode.rs:17-19","code":"   17 |         let data_len: u64 = data.len() as u64;\n   18 |         let mut chunks = Vec::with_capacity(num_chunks as usize);\n   19 |         let mut toc_entry = &data[toc_offset..];","lines":3,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-chunk/src/file/decode.rs#L17-L19"}]},
{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"Unbounded recursion in the TREE extension decoder. `one_recursive` calls itself once per\ndeclared subtree (`subtree_count`) with no depth limit. Each nesting level consumes only a\nfew bytes (a NUL-terminated path needs >=2 bytes plus two separators), so a crafted TREE\nextension whose every block declares exactly one child reaches a recursion depth roughly\nproportional to extension_size / few-bytes. The extension size field is a u32, so depth can\nreach hundreds of thousands, overflowing the stack and aborting the process. The\n`alloc_limit_bytes` guard only bounds the per-node `Vec<Tree>` reservation (line 19), not\nrecursion depth. Reachable from untrusted `.git/index` data.","fix":"Thread an explicit depth counter through `one_recursive` and return `None` past a sane cap,\nor rewrite the parse iteratively with an explicit work stack.","locations":[{"ref":"gix-index/src/extension/tree/decode.rs:11","code":"   11 | fn one_recursive(data: &[u8], hash_len: usize, alloc_limit_bytes: Option<usize>) -> Option<(Tree, &[u8])> {","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-index/src/extension/tree/decode.rs#L11"},{"ref":"gix-index/src/extension/tree/decode.rs:35-39","code":"   35 |     for _ in 0..subtree_count {\n   36 |         let (tree, rest) = one_recursive(data, hash_len, alloc_limit_bytes)?;\n   37 |         subtrees.push(tree);\n   38 |         data = rest;\n   39 |     }","lines":5,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-index/src/extension/tree/decode.rs#L35-L39"}]},
{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"Unbounded recursion in the UNTR (untracked cache) extension decoder.\n`decode_directory_block` recurses once per declared subdirectory (`num_dirs`) with no depth\nlimit. While `num_directory_blocks > data.len()` (line 165) and the per-block\n`max_entries_from_remaining_data` checks bound total node count and per-node allocations,\nneither bounds nesting depth. A chain of blocks each declaring exactly one subdirectory\nyields recursion depth proportional to the byte count and can overflow the stack / abort.\nSame root cause as the TREE recursion. Reachable from untrusted `.git/index` data.","fix":"Pass and enforce a maximum recursion depth in `decode_directory_block`, or rewrite iteratively.","locations":[{"ref":"gix-index/src/extension/untracked_cache.rs:218","code":"  218 | fn decode_directory_block<'a>(","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-index/src/extension/untracked_cache.rs#L218"},{"ref":"gix-index/src/extension/untracked_cache.rs:263-268","code":"  263 |     for _ in 0..num_dirs {\n  264 |         let subdir_index = directories.len();\n  265 |         let rest = decode_directory_block(data, directories, alloc_limit_bytes)?;\n  266 |         data = rest;\n  267 |         directories[index].sub_directories.push(subdir_index);\n  268 |     }","lines":6,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-index/src/extension/untracked_cache.rs#L263-L268"}]},
{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"In `File::at`, when `skip_hash` is false the trailing checksum is read with\n`&data[data.len() - object_hash.len_in_bytes()..]` BEFORE any size validation of the\nmmapped file (header decode happens later in `State::from_bytes`). `data` is an\nmmap of an attacker-controlled file. If the file is smaller than the hash length\n(e.g. an empty `.git/index`, or a 1-39 byte truncated file with SHA-1), the usize\nsubtraction underflows and the slice index panics. Likewise `meta.len() -\nobject_hash.len_in_bytes() as u64` on line 77 underflows for a too-small file.\nA truncated/corrupt index thus aborts the process instead of producing a decode error.","fix":"Guard the length first, e.g. `if data.len() < object_hash.len_in_bytes() { return\nErr(...) }` (or `data.len().checked_sub(hash_len)`), and only then read the trailing\nhash. Same for `meta.len()`.","locations":[{"ref":"gix-index/src/file/init.rs:73","code":"   73 |                     gix_hash::ObjectId::from_bytes_or_panic(&data[data.len() - object_hash.len_in_bytes()..]);","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-index/src/file/init.rs#L73"},{"ref":"gix-index/src/file/init.rs:77","code":"   77 |                     let num_bytes_to_hash = meta.len() - object_hash.len_in_bytes() as u64;","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-index/src/file/init.rs#L77"}]},
{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`pack_id_and_pack_offset_at_index()` reads a large 64-bit offset from the large-offsets chunk using an index taken directly from untrusted on-disk data (`(ofs32 ^ HIGH_BIT)`), without any bounds check that the index lies within the large-offsets table. `multi_index::chunk::large_offsets::is_valid` only checks that the chunk size is a multiple of 8, not that it is large enough for the referenced indices. A corrupt multi-index can therefore make `read_u64(&self.data[from..][..8])` index out of bounds and panic. The single-pack index does validate this (`index/init.rs` lines 156-181: `max_large_offset_index >= large_offsets`), but the multi-index path does not.","fix":"During `multi_index::File::from_data()`, scan the offsets chunk for the maximum referenced large-offset index and reject the file if it is >= the number of entries in the large-offsets chunk, mirroring the validation done in `index/init.rs::validate_size`. Alternatively use `data.get(from..from+8)` and return a corruption error.","locations":[{"ref":"gix-pack/src/multi_index/access.rs:123-134","code":"  123 |         let pack_offset = if (ofs32 & HIGH_BIT) == HIGH_BIT {\n  124 |             // We determine if large offsets are actually larger than 4GB and if not, we don't use the high-bit to signal anything\n  125 |             // but allow the presence of the large-offset chunk to signal what's happening.\n  126 |             if let Some(offsets_64) = self.large_offsets_ofs {\n  127 |                 let from = offsets_64 + (ofs32 ^ HIGH_BIT) as usize * 8;\n  128 |                 crate::read_u64(&self.data[from..][..8])\n  129 |             } else {\n  130 |                 u64::from(ofs32)\n  131 |             }\n  132 |         } else {\n  133 |             u64::from(ofs32)\n  134 |         };","lines":12,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-pack/src/multi_index/access.rs#L123-L134"}]},
{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"`name_partial_or_sanitize` is documented as infallible (\"instead of failing, alters `path` and returns it to be a valid partial name\") and the doc even states \"an empty `path` is replaced with a `-`\". But for slash-only inputs it panics with index out of bounds. In Sanitize mode `out` is Some; after the main loop, lines 170-177 strip all leading/trailing `/`, which can leave `out` EMPTY. Line 178 then does `out.as_ref().map_or(input, |b| b.as_bstr())[0]` which indexes `[0]` on the now-empty buffer and panics. Confirmed by running `reference::name_partial_or_sanitize` on inputs \"/\", \"//\", \"///\" -> panic at tag.rs:178:51 \"index out of bounds: the len is 0 but the index is 0\". This is reachable from the public, supposedly-infallible sanitization API.","fix":"After stripping leading/trailing slashes (lines 170-177), in Sanitize mode handle the now-empty buffer before the `[0]`/`[last]` indexing: if `out` is Some and empty, push b'-' and return early (mirroring the empty-input handling at lines 72-79). Alternatively guard both the StartsWithDot (line 178) and EndsWithDot (line 185) checks with an emptiness test in Sanitize mode.","locations":[{"ref":"gix-validate/src/tag.rs:174-198","code":"  174 |     if let Some(out) = out.as_mut() {\n  175 |         while out.last() == Some(&b'/') {\n  176 |             out.pop();\n  177 |         }\n  178 |         while out.first() == Some(&b'/') {\n  179 |             out.remove(0);\n  180 |         }\n  181 |     }\n  182 |     if out.as_ref().map_or(input, |b| b.as_bstr())[0] == b'.' {\n  183 |         if let Some(out) = out.as_mut() {\n  184 |             out[0] = b'-';\n  185 |         } else {\n  186 |             return Err(name::Error::StartsWithDot);\n  187 |         }\n  188 |     }\n  189 |     let last = out.as_ref().map_or(input, |b| b.as_bstr()).len() - 1;\n  190 |     if out.as_ref().map_or(input, |b| b.as_bstr())[last] == b'.' {\n  191 |         if let Some(out) = out.as_mut() {\n  192 |             let last = out.len() - 1;\n  193 |             out[last] = b'-';\n  194 |         } else {\n  195 |             return Err(name::Error::EndsWithDot);\n  196 |         }\n  197 |     }\n  198 |     Ok(out)","lines":25,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-validate/src/tag.rs#L174-L198"},{"ref":"gix-validate/src/reference.rs:112-116","code":"  112 | pub fn name_partial_or_sanitize(path: &BStr) -> BString {\n  113 |     validate(path, Mode::PartialSanitize)\n  114 |         .expect(\"BUG: errors cannot happen as any issue is fixed instantly\")\n  115 |         .expect(\"we always rebuild the path\")\n  116 | }","lines":5,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-validate/src/reference.rs#L112-L116"}]},
{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`write_raw_refs` asserts `assert!(!path.starts_with_str(\"/\"), ...)` and `path.parent().expect(...)`\non ref names that come from the remote server over the network. A malformed or malicious remote could\nsend a ref name starting with `/` or with a single path component and crash the client with a panic\nrather than a clean error.","fix":"Replace the assert!/expect with a proper `io::Error` return so malformed remote refs are rejected gracefully.","locations":[{"ref":"gitoxide-core/src/pack/receive.rs:245-248","code":"  245 |         assert!(!path.starts_with_str(\"/\"), \"no ref start with a /, they are relative\");\n  246 |         let path = directory.join(gix::path::from_byte_slice(path));\n  247 |         std::fs::create_dir_all(path.parent().expect(\"multi-component path\")).map(|_| path)\n  248 |     };","lines":4,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/pack/receive.rs#L245-L248"}]},
{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"The fsck `on_missing` callback does `writeln!(out, \"{oid}: {kind}\").expect(\"failed to write output\")`.\nIf stdout is a closed pipe (e.g. output piped to `head`, which exits early - a very common CLI case),\nthe write fails with BrokenPipe and the process panics instead of exiting cleanly.","fix":"Capture the IO error in a cell/Option checked after traversal (the closure signature is fixed by\n`gix_fsck::Connectivity`), or otherwise propagate it instead of `.expect()`.","locations":[{"ref":"gitoxide-core/src/repository/fsck.rs:22-24","code":"   22 |     let on_missing = |oid: &ObjectId, kind: Kind| {\n   23 |         writeln!(out, \"{oid}: {kind}\").expect(\"failed to write output\");\n   24 |     };","lines":3,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/repository/fsck.rs#L22-L24"}]},
{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`let commit = repo.find_commit(info.id).unwrap();` panics if the commit cannot be found/decoded\n(corrupt or partially-pruned ODB, or a race where the object is removed during the walk). `write_info`\ncould propagate the error instead, so the unwrap is gratuitous.","fix":"Make `write_info` return a Result and use `repo.find_commit(info.id)?`.","locations":[{"ref":"gitoxide-core/src/repository/log.rs:37","code":"   37 |     let commit = repo.find_commit(info.id).unwrap();","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/repository/log.rs#L37"}]},
{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`verify_integrity` computes `self.path.metadata().len() - checksum.as_bytes().len() as u64`\nwithout checking that the on-disk file is at least as large as the hash. If the index\nfile was truncated/replaced on disk to be smaller than the checksum length after it was\nloaded, this u64 subtraction underflows (panic in debug; in release it wraps to a huge\n`num_bytes_to_hash` passed to the hasher).","fix":"Use `checked_sub` and return a descriptive error if the file is too small.","locations":[{"ref":"gix-index/src/file/verify.rs:23-24","code":"   23 |             let num_bytes_to_hash =\n   24 |                 self.path.metadata().map_err(gix_hash::io::Error::from)?.len() - checksum.as_bytes().len() as u64;","lines":2,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-index/src/file/verify.rs#L23-L24"}]},
{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`in_common_with_remote` in the skipping algorithm asserts `was_seen` and panics with\n`Cannot receive ACK for commit we didn't send a HAVE for: {id}` if the commit isn't already SEEN.\nThis makes the algorithm panic in response to remote-controlled input: a malicious or buggy server\ncan ACK a commit id we never sent a HAVE for, taking down the client process. Negotiation responses\ncome from the network and should be handled as recoverable errors, not assertions.","fix":"Return a recoverable error (extend the Error type) instead of `assert!` when an ACK arrives for an unseen commit.","locations":[{"ref":"gix-negotiate/src/skipping.rs:168-177","code":"  168 |     fn in_common_with_remote(&mut self, id: ObjectId, graph: &mut crate::Graph<'_, '_>) -> Result<bool, Error> {\n  169 |         let mut was_seen = false;\n  170 |         let known_to_be_common = graph.get(&id).is_some_and(|commit| {\n  171 |             was_seen = commit.data.flags.contains(Flags::SEEN);\n  172 |             commit.data.flags.contains(Flags::COMMON)\n  173 |         });\n  174 |         assert!(\n  175 |             was_seen,\n  176 |             \"Cannot receive ACK for commit we didn't send a HAVE for: {id}\"\n  177 |         );","lines":10,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-negotiate/src/skipping.rs#L168-L177"}]},
{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`digest_statistics` divides the accumulated averages by `num_nodes = roots.len() + children.len()` without guarding against zero. For a pack with zero objects (an empty but otherwise valid pack/index), the traverse outcome yields empty roots and children, so all four divisions (`/= num_nodes as u64`, `/= num_nodes`, etc.) divide by zero and panic.","fix":"Return `Statistics::default()` (or otherwise skip the average computation) when `num_nodes == 0` before performing the divisions.","locations":[{"ref":"gix-pack/src/index/traverse/with_index.rs:232-236","code":"  232 |     let num_nodes = roots.len() + children.len();\n  233 |     average.decompressed_size /= num_nodes as u64;\n  234 |     average.compressed_size /= num_nodes;\n  235 |     average.object_size /= num_nodes as u64;\n  236 |     average.num_deltas /= num_nodes as u32;","lines":5,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-pack/src/index/traverse/with_index.rs#L232-L236"}]},
{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"`to_native_path_on_windows` calls `crate::from_bstr(...)` (the panicking variant) on its result. `from_bstr` does `try_from_bstr(input).expect(\"prefix path doesn't contain ill-formed UTF-8\")`. On Windows, input bytes that are not valid UTF-8 (unpaired surrogates) panic rather than returning an error. While the function's own doc mentions a possible panic, the `expect` message is copy-pasted from a prefix-path context and is misleading here. No fallible variant is offered for this commonly used conversion.","fix":"Provide a `try_` variant for native-path conversion, and fix the misleading copy-pasted `expect` message.","locations":[{"ref":"gix-path/src/convert.rs:189-198","code":"  189 | pub fn to_native_path_on_windows<'a>(path: impl Into<Cow<'a, BStr>>) -> Cow<'a, std::path::Path> {\n  190 |     #[cfg(not(windows))]\n  191 |     {\n  192 |         crate::from_bstr(path)\n  193 |     }\n  194 |     #[cfg(windows)]\n  195 |     {\n  196 |         crate::from_bstr(to_windows_separators(path))\n  197 |     }\n  198 | }","lines":10,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-path/src/convert.rs#L189-L198"},{"ref":"gix-path/src/convert.rs:119-121","code":"  119 | pub fn from_bstr<'a>(input: impl Into<Cow<'a, BStr>>) -> Cow<'a, Path> {\n  120 |     try_from_bstr(input).expect(\"prefix path doesn't contain ill-formed UTF-8\")\n  121 | }","lines":3,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-path/src/convert.rs#L119-L121"}]},
{"id":"PANIC_14","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`Needle::Glob` matching computes the matched range as\n`asterisk_pos..(full_ref_name.len() - tail.len())`. The head is verified via\n`get(..asterisk_pos)` and the tail via `ends_with(tail)`, but there is no check\nthat the head and tail regions do not overlap when `full_ref_name` is shorter\nthan `asterisk_pos + tail.len()`. For a needle like `aaaa*aaaa` matching item\n`aaaa` (len 4, asterisk_pos 4, tail `aaaa`): head `get(..4)`=\"aaaa\" matches,\n`ends_with(\"aaaa\")` is true, `end = 4 - 4 = 0`, producing range `4..0`. A\nreversed `Range` later used to slice `item.full_ref_name[range]` in\n`to_bstr_replace` panics (\"slice index starts at 4 but ends at 0\").","fix":"After computing `end`, guard with `if end < *asterisk_pos { return Match::None; }`\n(equivalently require `full_ref_name.len() >= asterisk_pos + tail.len()`) so\nhead and tail cannot overlap before constructing the `GlobRange`.","locations":[{"ref":"gix-refspec/src/match_group/util.rs:91-105","code":"   91 |             Needle::Glob { name, asterisk_pos } => {\n   92 |                 match item.full_ref_name.get(..*asterisk_pos) {\n   93 |                     Some(full_name_portion) if full_name_portion != name[..*asterisk_pos] => {\n   94 |                         return Match::None;\n   95 |                     }\n   96 |                     None => return Match::None,\n   97 |                     _ => {}\n   98 |                 }\n   99 |                 let tail = &name[*asterisk_pos + 1..];\n  100 |                 if !item.full_ref_name.ends_with(tail) {\n  101 |                     return Match::None;\n  102 |                 }\n  103 |                 let end = item.full_ref_name.len() - tail.len();\n  104 |                 Match::GlobRange(*asterisk_pos..end)\n  105 |             }","lines":15,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-refspec/src/match_group/util.rs#L91-L105"},{"ref":"gix-refspec/src/match_group/util.rs:129-134","code":"  129 |             (Needle::Glob { name, asterisk_pos }, Some((range, item))) => {\n  130 |                 let mut buf = Vec::with_capacity(name.len() + range.len() - 1);\n  131 |                 buf.push_str(&name[..asterisk_pos]);\n  132 |                 buf.push_str(&item.full_ref_name[range]);\n  133 |                 buf.push_str(&name[asterisk_pos + 1..]);\n  134 |                 Cow::Owned(buf.into())","lines":6,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-refspec/src/match_group/util.rs#L129-L134"}]},
{"id":"PANIC_15","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"The git-daemon connector resolves the host with `to_socket_addrs()` and then calls `.next().expect(\"after successful resolution there is an IP address\")`. `ToSocketAddrs` is allowed to return an empty iterator even when name resolution itself \"succeeds\" (e.g. a hostname that resolves to zero usable addresses, or platform-specific resolver behavior). When that happens this panics instead of returning a connection error, taking down the caller.","fix":"Replace the `.expect(...)` with a proper error, e.g. map an empty iterator to `Error::Io(io::Error::new(ErrorKind::NotFound, \"name resolved to no addresses\"))`.","locations":[{"ref":"gix-transport/src/client/git/blocking_io.rs:223-229","code":"  223 |         let read = TcpStream::connect_timeout(\n  224 |             &(host, port.unwrap_or(9418))\n  225 |                 .to_socket_addrs()?\n  226 |                 .next()\n  227 |                 .expect(\"after successful resolution there is an IP address\"),\n  228 |             std::time::Duration::from_secs(5),\n  229 |         )?;","lines":7,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-transport/src/client/git/blocking_io.rs#L223-L229"}]},
{"id":"PANIC_16","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`Object::peel_to_kind()` and `peel_tags_to_end()` use `.expect(\"valid commit\")` / `.expect(\"valid tag\")`\non `tree_id()` / `target_id()` of the decoded object. A corrupt-but-present commit/tag object (truncated\nor with a malformed header) will pass the `kind` check yet fail decoding, causing a panic in a library API\nthat otherwise returns `Result`. These are reachable from `peel_to_tree`/`peel_to_commit` and rev-spec parsing.","fix":"Propagate a decode error instead of `expect()`, e.g. add a Decode variant to the peel error and `?` the result.","locations":[{"ref":"gix/src/object/peel.rs:43-58","code":"   43 |                 Kind::Commit => {\n   44 |                     let tree_id = self\n   45 |                         .try_to_commit_ref_iter()\n   46 |                         .expect(\"commit\")\n   47 |                         .tree_id()\n   48 |                         .expect(\"valid commit\");\n   49 |                     let repo = self.repo;\n   50 |                     drop(self);\n   51 |                     self = repo.find_object(tree_id)?;\n   52 |                 }\n   53 |                 Kind::Tag => {\n   54 |                     let target_id = self.to_tag_ref_iter().target_id().expect(\"valid tag\");\n   55 |                     let repo = self.repo;\n   56 |                     drop(self);\n   57 |                     self = repo.find_object(target_id)?;\n   58 |                 }","lines":16,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix/src/object/peel.rs#L43-L58"},{"ref":"gix/src/object/peel.rs:89-101","code":"   89 |     pub fn peel_tags_to_end(mut self) -> Result<Self, object::find::existing::Error> {\n   90 |         loop {\n   91 |             match self.kind {\n   92 |                 Kind::Commit | Kind::Tree | Kind::Blob => break Ok(self),\n   93 |                 Kind::Tag => {\n   94 |                     let target_id = self.to_tag_ref_iter().target_id().expect(\"valid tag\");\n   95 |                     let repo = self.repo;\n   96 |                     drop(self);\n   97 |                     self = repo.find_object(target_id)?;\n   98 |                 }\n   99 |             }\n  100 |         }\n  101 |     }","lines":13,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix/src/object/peel.rs#L89-L101"}]},
{"id":"PANIC_17","type":"panic","type_label":"Panic","severity":"medium","difficulty":"medium","description":"`impl From<BString> for Name<'static>` calls `Self::try_from(Cow::Owned(name)).expect(\"String is never illformed\")`.\nHowever `try_from` returns `Err` for an owned, non-UTF-8 `BString` that does not contain `/` and is not `\".\"`:\nit routes to the `Cow::Owned(n)` arm which calls `Vec::from(n).into_string()`, which fails on invalid UTF-8 and\nyields `Err`. A remote name read from configuration that is invalid UTF-8 without a slash will therefore panic\nthrough this `expect`, contradicting the message \"String is never illformed\".","fix":"Make `From<BString>` fall back to `Name::Url` (or `Name::Symbol` via lossy conversion) instead of `expect`, or change the bound to `TryFrom` so the failure is propagated.","locations":[{"ref":"gix/src/remote/name.rs:82-86","code":"   82 | impl From<BString> for Name<'static> {\n   83 |     fn from(name: BString) -> Self {\n   84 |         Self::try_from(Cow::Owned(name)).expect(\"String is never illformed\")\n   85 |     }\n   86 | }","lines":5,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix/src/remote/name.rs#L82-L86"},{"ref":"gix/src/remote/name.rs:63-80","code":"   63 | impl<'a> TryFrom<Cow<'a, BStr>> for Name<'a> {\n   64 |     type Error = Cow<'a, BStr>;\n   65 | \n   66 |     fn try_from(name: Cow<'a, BStr>) -> Result<Self, Self::Error> {\n   67 |         if name.contains(&b'/') || name.as_ref() == \".\" {\n   68 |             Ok(Name::Url(name))\n   69 |         } else {\n   70 |             match name {\n   71 |                 Cow::Borrowed(n) => n.to_str().ok().map(Cow::Borrowed).ok_or(name),\n   72 |                 Cow::Owned(n) => Vec::from(n)\n   73 |                     .into_string()\n   74 |                     .map_err(|err| Cow::Owned(err.into_vec().into()))\n   75 |                     .map(Cow::Owned),\n   76 |             }\n   77 |             .map(Name::Symbol)\n   78 |         }\n   79 |     }\n   80 | }","lines":18,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix/src/remote/name.rs#L63-L80"}]},
{"id":"PANIC_18","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`runner_id_or_insert` indexes `sys.cpus()[0]`. `RefreshKind::nothing().with_cpu(...)` refreshes CPU\nfrequency, not the CPU list, so on some platforms/containers/sysinfo versions the list may be empty,\ncausing an index panic.","fix":"Use `sys.cpus().first()` and handle `None` (fall back to empty vendor/brand).","locations":[{"ref":"gitoxide-core/src/corpus/db.rs:156","code":"  156 |         let cpu = &sys.cpus()[0];","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/corpus/db.rs#L156"}]},
{"id":"PANIC_19","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`StoreTreeToDb::fmt` unwraps trace serialization with `serde_json::to_string_pretty(...).expect(...)`.\nSerializing arbitrary tracing span data is not guaranteed infallible; a serialization error would\npanic inside the tracing layer mid-run.","fix":"Handle the serialization error gracefully (log/skip the DB update) instead of `.expect()`.","locations":[{"ref":"gitoxide-core/src/corpus/trace.rs:63","code":"   63 |         let json = serde_json::to_string_pretty(&tree).expect(\"serialization to string always works\");","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/corpus/trace.rs#L63"}]},
{"id":"PANIC_20","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`thread_count` from `optimize_chunk_size_and_thread_limit` is used as a divisor for cache sizes. If it\nwere ever 0, this is an integer division-by-zero panic. The helper is documented to return >= 1, so\nlow likelihood, but the code does not defend against it.","fix":"Use `thread_count.max(1)` as the divisor or assert `thread_count > 0`.","locations":[{"ref":"gitoxide-core/src/pack/create.rs:176","code":"  176 |         let (_, _, thread_count) = gix::parallel::optimize_chunk_size_and_thread_limit(50, None, thread_limit, None);","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/pack/create.rs#L176"},{"ref":"gitoxide-core/src/pack/create.rs:180","code":"  180 |             let per_thread_object_pack_size = pack_cache_size_in_bytes / thread_count;","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/pack/create.rs#L180"},{"ref":"gitoxide-core/src/pack/create.rs:188","code":"  188 |                     let per_thread_object_cache_size = object_cache_size_in_bytes / thread_count;","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/pack/create.rs#L188"}]},
{"id":"PANIC_21","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`Info::write_to` indexes the `path_by_id` HashMap with `path_by_id[&source_id]` and\n`path_by_id[&self.file_id]`. The map (`seen`) is only populated for the start file id and for\nsource ids encountered during traversal; a row whose `file_id` was never inserted panics via `Index`.\nThe coupling between which ids get inserted into `seen` and which are indexed here is fragile.","fix":"Use `.get(&id)` with a `<unknown>` fallback, or guarantee insertion before indexing.","locations":[{"ref":"gitoxide-core/src/query/engine/command.rs:181","code":"  181 |                         path_by_id[&source_id],","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/query/engine/command.rs#L181"},{"ref":"gitoxide-core/src/query/engine/command.rs:182","code":"  182 |                         path_by_id[&self.file_id],","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/query/engine/command.rs#L182"},{"ref":"gitoxide-core/src/query/engine/command.rs:193","code":"  193 |                         path_by_id[&self.file_id]","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/query/engine/command.rs#L193"}]},
{"id":"PANIC_22","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`map.remote_refs.len() - map.mappings.len()` is computed as a raw subtraction in both the `if` guard\nand the printed value. If mappings ever exceeds remote_refs (extra/implicit refspecs, object-id\nsources), this underflows and panics in debug. The analogous code in fetch.rs uses `saturating_sub`\nfor the printed value (line 323) but a raw subtraction in the guard (line 318), so the codebase is\ninternally inconsistent about this risk.","fix":"Compute `let filtered = remote_refs.len().saturating_sub(mappings.len());` once and use it for both the guard and the message.","locations":[{"ref":"gitoxide-core/src/repository/remote.rs:242","code":"  242 |         if map.remote_refs.len() - map.mappings.len() != 0 {","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/repository/remote.rs#L242"},{"ref":"gitoxide-core/src/repository/remote.rs:247","code":"  247 |                 map.remote_refs.len() - map.mappings.len(),","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/repository/remote.rs#L247"},{"ref":"gitoxide-core/src/repository/fetch.rs:318","code":"  318 |         if map.remote_refs.len() - map.mappings.len() != 0 {","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/repository/fetch.rs#L318"}]},
{"id":"PANIC_23","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"The debug-only invariant block indexes `source_lines_as_tokens[i as usize]` and `blamed_lines_as_tokens[i as usize]`\ndirectly from `range_in_suspect`/`range_in_blamed_file`. If blame bookkeeping ever lets a range exceed the actual token\ncount of the source or blamed blob (which is exactly the kind of corruption finding #1 can cause), this panics with an\nout-of-bounds index in debug builds. It is debug-only, but it means a logic error elsewhere surfaces as an opaque index\npanic instead of a descriptive assertion.","fix":"Bounds-check the indices (use `.get()`), or assert the ranges fit within the token vectors before indexing, with a descriptive message.","locations":[{"ref":"gix-blame/src/file/function.rs:228-237","code":"  228 |                     let source_lines = range_in_suspect\n  229 |                         .clone()\n  230 |                         .map(|i| BString::new(source_interner[source_lines_as_tokens[i as usize]].into()))\n  231 |                         .collect::<Vec<_>>();\n  232 |                     let blamed_lines = range_in_blamed_file\n  233 |                         .clone()\n  234 |                         .map(|i| BString::new(blamed_interner[blamed_lines_as_tokens[i as usize]].into()))\n  235 |                         .collect::<Vec<_>>();\n  236 | \n  237 |                     assert_eq!(source_lines, blamed_lines);","lines":10,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-blame/src/file/function.rs#L228-L237"}]},
{"id":"PANIC_24","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`prepare_diff` and `find_match` rely on `unreachable!(\"we have disabled this possibility with an option\")`\nfor the `Operation::ExternalCommand` case, the safety of which depends on `emit()` having set\n`skip_internal_diff_if_external_is_configured = false` (tracker.rs:231). This coupling is implicit: any future\ncaller that constructs the similarity path without going through `emit()` (or a refactor that reorders the\noption reset) would turn a configuration mismatch into a hard panic instead of an error. The invariant is real\nbut undocumented at the `unreachable!` site.","fix":"Document the cross-module invariant at the `unreachable!` and/or replace it with a returned\n`emit::Error`/`debug_assert!` so a broken invariant degrades gracefully rather than aborting.","locations":[{"ref":"gix-diff/src/rewrites/tracker.rs:809-811","code":"  809 |                 Operation::ExternalCommand { .. } => {\n  810 |                     unreachable!(\"we have disabled this possibility with an option\")\n  811 |                 }","lines":3,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-diff/src/rewrites/tracker.rs#L809-L811"}]},
{"id":"PANIC_25","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`path.rfind_byte(b'/').expect(\"dir\")` assumes the index entry path returned by\n`entry_closest_to_directory_or_directory_icase` always contains a `/`. If that invariant is\never violated (a top-level directory entry without a trailing-component slash, e.g. a\nsubmodule/sparse entry at the repo root), this panics during a directory walk on\nattacker-influenceable index contents.","fix":"Use `unwrap_or(path.len())` or treat the no-slash case as 'no exact match' instead of panicking.","locations":[{"ref":"gix-dir/src/walk/classify.rs:410","code":"  410 |                         let slash_idx = path.rfind_byte(b'/').expect(\"dir\");","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-dir/src/walk/classify.rs#L410"}]},
{"id":"PANIC_26","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"Several release-build invariant assertions run on the directory-walk hot path\n(`assert_eq!` on `state.on_hold` emptiness, `assert_ne!` that an empty dir isn't a\nRepository, and `unreachable!` for pruned-held entries). These encode internal invariants\nwith 'BUG:' messages; if any classification edge case violates them they convert a logic\nerror into a hard panic mid-walk rather than a recoverable result.","fix":"Consider `debug_assert!` for those that are pure internal invariants, or return an error for cases reachable from filesystem state.","locations":[{"ref":"gix-dir/src/walk/function.rs:122","code":"  122 |         assert_eq!(state.on_hold.len(), 0, \"BUG: after emission, on hold must be empty\");","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-dir/src/walk/function.rs#L122"},{"ref":"gix-dir/src/walk/readdir.rs:235-239","code":"  235 |                     assert_ne!(\n  236 |                         dir_info.disk_kind,\n  237 |                         Some(entry::Kind::Repository),\n  238 |                         \"BUG: it shouldn't be possible to classify an empty dir as repository\"\n  239 |                     );","lines":5,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-dir/src/walk/readdir.rs#L235-L239"},{"ref":"gix-dir/src/walk/readdir.rs:318-319","code":"  318 |                 Status::Pruned => {\n  319 |                     unreachable!(\"BUG: pruned aren't ever held, check `should_hold()`\")","lines":2,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-dir/src/walk/readdir.rs#L318-L319"}]},
{"id":"PANIC_27","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`encode_to_git` constructs a `&str` from the decoder output via `std::str::from_utf8_unchecked` and only\nafterward, for `RoundTripCheck::Fail`, re-encodes and compares. The unsafe is justified by trusting\n`encoding_rs` to emit valid UTF-8. However the two debug/`assert!` invariants in the `InputEmpty` arm\n(`buf_len >= written` and `read == src.len()`) are compiled in release too (they are `assert!`, not\n`debug_assert!`) and would `panic` rather than return an error if `encoding_rs` ever violated the\ndocumented contract; combined with the `unreachable!` on `OutputFull`. This is defensive but means a\nlibrary consumer can be panicked by encoder-behavior assumptions instead of receiving a recoverable error.\nSame pattern in `encode_to_worktree`.","fix":"Consider converting the `assert!`/`unreachable!` contract checks into returned errors (or `debug_assert!`) so malformed/edge encoder behavior cannot abort the process.","locations":[{"ref":"gix-filter/src/worktree/encode_to_git.rs:44-56","code":"   44 |         let (res, read, written) = decoder.decode_to_utf8_without_replacement(src, buf, true);\n   45 |         match res {\n   46 |             DecoderResult::InputEmpty => {\n   47 |                 assert!(\n   48 |                     buf_len >= written,\n   49 |                     \"encoding_rs estimates the maximum amount of bytes written correctly\"\n   50 |                 );\n   51 |                 assert_eq!(read, src.len(), \"input buffer should be fully consumed\");\n   52 |                 buf.truncate(written);\n   53 |             }\n   54 |             DecoderResult::OutputFull => {\n   55 |                 unreachable!(\"we assure that the output buffer is big enough as per the encoder's estimate\")\n   56 |             }","lines":13,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-filter/src/worktree/encode_to_git.rs#L44-L56"},{"ref":"gix-filter/src/worktree/encode_to_worktree.rs:38-50","code":"   38 |         let (res, read, written) = encoder.encode_from_utf8_without_replacement(src, buf, true);\n   39 |         match res {\n   40 |             EncoderResult::InputEmpty => {\n   41 |                 assert!(\n   42 |                     buf_len >= written,\n   43 |                     \"encoding_rs estimates the maximum amount of bytes written correctly\"\n   44 |                 );\n   45 |                 assert_eq!(read, src_utf8.len(), \"input buffer should be fully consumed\");\n   46 |                 buf.truncate(written);\n   47 |             }\n   48 |             EncoderResult::OutputFull => {\n   49 |                 unreachable!(\"we assure that the output buffer is big enough as per the encoder's estimate\")\n   50 |             }","lines":13,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-filter/src/worktree/encode_to_worktree.rs#L38-L50"}]},
{"id":"PANIC_28","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`State::take_path_backing` asserts `self.entries.is_empty() == self.path_backing.is_empty()`.\nThis invariant can legitimately be violated by a decoded index that has entries which all\nhave empty paths (e.g. a split-index whose entries are replacement placeholders with empty\npaths, as handled in link.rs where split entries deliberately have empty paths), or after\n`remove_entries` removed all entries while leaving the append-only path backing populated.\nIn such states this public method aborts with an assertion failure.","fix":"Relax the assertion or replace it with a graceful no-op/return when the invariant does not strictly hold.","locations":[{"ref":"gix-index/src/access/mod.rs:523-529","code":"  523 |     pub fn take_path_backing(&mut self) -> PathStorage {\n  524 |         assert_eq!(\n  525 |             self.entries.is_empty(),\n  526 |             self.path_backing.is_empty(),\n  527 |             \"BUG: cannot take out backing multiple times\"\n  528 |         );\n  529 |         std::mem::take(&mut self.path_backing)","lines":7,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-index/src/access/mod.rs#L523-L529"}]},
{"id":"PANIC_29","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`From<FileTime> for Time` uses `value.unix_seconds().try_into().expect(\"can't represent\nnon-unix times\")`. `unix_seconds()` is an `i64`; converting to `u32` panics for any\ntimestamp before 1970 or after 2106. `Time` from filesystem metadata is built defensively\nelsewhere (`try_into().unwrap_or_default()` in stat.rs), but this `From` impl will panic on\nout-of-range times, which can occur with unusual mtimes on disk.","fix":"Use a saturating/truncating conversion (e.g. `as u32`, matching the documented 'only compare low bits' behavior) instead of `expect`.","locations":[{"ref":"gix-index/src/entry/stat.rs:150-156","code":"  150 | impl From<FileTime> for Time {\n  151 |     fn from(value: FileTime) -> Self {\n  152 |         Time {\n  153 |             secs: value.unix_seconds().try_into().expect(\"can't represent non-unix times\"),\n  154 |             nsecs: value.nanoseconds(),\n  155 |         }\n  156 |     }","lines":7,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-index/src/entry/stat.rs#L150-L156"}]},
{"id":"PANIC_30","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`TreeRefIter::offset_to_next_entry` computes `after as usize - before as usize` from raw pointers, where `before` is `buf.as_ptr()` and `after` is `self.data.as_ptr()`. The required invariant `before <= after` is only checked with `debug_assert!`. In release builds, if the function is called with a `buf` that is not the original backing buffer this iterator was created from (the documented but unenforced contract), the unsigned subtraction underflows and yields a nonsensical, huge offset that callers will likely use for slicing, leading to a panic or logic error far from the cause.","fix":"Use `usize::checked_sub` on the pointer addresses and return a `Result`/`Option`, or at least `saturating_sub`, instead of relying on a `debug_assert!` that is compiled out in release.","locations":[{"ref":"gix-object/src/tree/ref_iter.rs:157-166","code":"  157 |     pub fn offset_to_next_entry(&self, buf: &[u8]) -> usize {\n  158 |         let before = (*buf).as_ptr();\n  159 |         let after = (*self.data).as_ptr();\n  160 | \n  161 |         debug_assert!(\n  162 |             before <= after,\n  163 |             \"`TreeRefIter::offset_to_next_entry(): {after:?} <= {before:?}) violated\"\n  164 |         );\n  165 |         (after as usize - before as usize) / std::mem::size_of::<u8>()\n  166 |     }","lines":10,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-object/src/tree/ref_iter.rs#L157-L166"}]},
{"id":"PANIC_31","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"After resolving a ref-delta base object for a thin pack, the code re-looks-up the original object id in all\nsnapshot indices and `panic!`s if it can no longer be found. While the comment argues this shouldn't happen\nbecause the object was just found in this snapshot, the lookup loop reborrows `snapshot.indices` and relies\non the snapshot remaining consistent across a recursive `try_find_cached_inner`/`try_header_inner` call that\nitself may replace `*snapshot` (e.g. via `load_one_index` on a missing pack). If the snapshot was swapped out\nduring the recursive base lookup, the original id may genuinely be absent from the new snapshot, turning a\nrecoverable miss into a process-aborting panic when decoding crafted/thin pack data.","fix":"Return a recoverable error (e.g. `Error::DeltaBaseMissing` or a dedicated variant) instead of `panic!` when the original id cannot be re-located after the recursive base lookup.","locations":[{"ref":"gix-odb/src/store_impls/dynamic/find.rs:217-231","code":"  217 |                                 } = match snapshot.indices[idx].lookup(id) {\n  218 |                                     Some(res) => res,\n  219 |                                     None => {\n  220 |                                         let mut out = None;\n  221 |                                         for index in &mut snapshot.indices {\n  222 |                                             out = index.lookup(id);\n  223 |                                             if out.is_some() {\n  224 |                                                 break;\n  225 |                                             }\n  226 |                                         }\n  227 | \n  228 |                                         out.unwrap_or_else(|| {\n  229 |                                            panic!(\"could not find object {id} in any index after looking up one of its base objects {base_id}\" )\n  230 |                                        })\n  231 |                                     }","lines":15,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-odb/src/store_impls/dynamic/find.rs#L217-L231"},{"ref":"gix-odb/src/store_impls/dynamic/header.rs:113-127","code":"  113 |                                 } = match snapshot.indices[idx].lookup(id) {\n  114 |                                     Some(res) => res,\n  115 |                                     None => {\n  116 |                                         let mut out = None;\n  117 |                                         for index in &mut snapshot.indices {\n  118 |                                             out = index.lookup(id);\n  119 |                                             if out.is_some() {\n  120 |                                                 break;\n  121 |                                             }\n  122 |                                         }\n  123 | \n  124 |                                         out.unwrap_or_else(|| {\n  125 |                                             panic!(\"could not find object {id} in any index after looking up one of its base objects {base_id}\")\n  126 |                                         })\n  127 |                                     }","lines":15,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-odb/src/store_impls/dynamic/header.rs#L113-L127"}]},
{"id":"PANIC_32","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`entry_crc32` indexes `self.data[pack_offset..pack_offset + size]` with no bounds check (only documented as panicking). It is called during traversal with `entry_len`/sizes derived from decode results. While current callers pass verified ranges, an off-by-one in any future caller (or a size computed from a corrupt entry header before validation) would index out of bounds and panic, whereas the sibling `entry_slice` safely returns `Option` via `.get()`.","fix":"Use `self.data.get(pack_offset..pack_offset + size)` and return a `Result`/`Option`, or at minimum assert the range against `self.data.len()` with a clear corruption error at the call sites that handle untrusted sizes.","locations":[{"ref":"gix-pack/src/data/mod.rs:154-157","code":"  154 |     pub fn entry_crc32(&self, pack_offset: Offset, size: usize) -> u32 {\n  155 |         let pack_offset: usize = pack_offset.try_into().expect(\"pack_size fits into usize\");\n  156 |         gix_features::hash::crc32(&self.data[pack_offset..pack_offset + size])\n  157 |     }","lines":4,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-pack/src/data/mod.rs#L154-L157"}]},
{"id":"PANIC_33","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`iter_v1`/`iter_v2` and `decode_header_size`-adjacent code aside, several public index accessors (`oid_at_index`, `pack_offset_at_index`, `crc32_at_index`) index `self.data` directly using an `EntryIndex` argument with only a doc-comment `# Panics` contract and no internal bounds check. If a caller passes an out-of-range index (e.g. derived from a separate, mismatched index/multi-index), these panic via slice indexing rather than returning an error. This is by-contract but fragile given the crate parses untrusted data.","fix":"Consider debug_assert!-ing the index against `self.num_objects` (as `multi_index/access.rs::oid_at_index` already does), and/or providing checked variants for callers handling untrusted indices.","locations":[{"ref":"gix-pack/src/index/access.rs:84-110","code":"   84 |     pub fn oid_at_index(&self, index: EntryIndex) -> &gix_hash::oid {\n   85 |         let index = index as usize;\n   86 |         let start = match self.version {\n   87 |             index::Version::V2 => V2_HEADER_SIZE + index * self.hash_len,\n   88 |             index::Version::V1 => V1_HEADER_SIZE + index * (N32_SIZE + self.hash_len) + N32_SIZE,\n   89 |         };\n   90 |         gix_hash::oid::from_bytes_unchecked(&self.data[start..][..self.hash_len])\n   91 |     }\n   92 | \n   93 |     /// Returns the offset into our pack data file at which to start reading the object at `index`.\n   94 |     ///\n   95 |     /// # Panics\n   96 |     ///\n   97 |     /// If `index` is out of bounds.\n   98 |     pub fn pack_offset_at_index(&self, index: EntryIndex) -> data::Offset {\n   99 |         let index = index as usize;\n  100 |         match self.version {\n  101 |             index::Version::V2 => {\n  102 |                 let start = self.offset_pack_offset_v2() + index * N32_SIZE;\n  103 |                 self.pack_offset_from_offset_v2(&self.data[start..][..N32_SIZE], self.offset_pack_offset64_v2())\n  104 |             }\n  105 |             index::Version::V1 => {\n  106 |                 let start = V1_HEADER_SIZE + index * (N32_SIZE + self.hash_len);\n  107 |                 u64::from(crate::read_u32(&self.data[start..][..N32_SIZE]))\n  108 |             }\n  109 |         }\n  110 |     }","lines":27,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-pack/src/index/access.rs#L84-L110"}]},
{"id":"PANIC_34","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`peek_buffer_replace_and_truncate` indexes `self.peek_buf` directly (`self.peek_buf[position]` and\n`self.peek_buf[..4]`) after adding `U16_HEX_BYTES` to `position`. This is a public method with no\nbounds checking, so a caller passing a `position` beyond the current peeked line length (or calling it\nwhen `peek_buf` is shorter than 4 bytes) triggers an out-of-bounds index panic. Internal callers in\ngix-transport compute `position` from a found delimiter so they are safe in practice, but the public\ncontract offers no protection.","fix":"Validate `position + U16_HEX_BYTES < self.peek_buf.len()` (and that `peek_buf.len() >= 4`) before\nindexing, returning a `Result`/`Option` or documenting/asserting the precondition with a clear message\nrather than panicking via raw indexing.","locations":[{"ref":"gix-packetline/src/read.rs:79-86","code":"   79 |     pub fn peek_buffer_replace_and_truncate(&mut self, position: usize, replace_with: u8) {\n   80 |         let position = position + U16_HEX_BYTES;\n   81 |         self.peek_buf[position] = replace_with;\n   82 | \n   83 |         let new_len = position + 1;\n   84 |         self.peek_buf.truncate(new_len);\n   85 |         self.peek_buf[..4].copy_from_slice(&crate::encode::u16_to_hex((new_len) as u16));\n   86 |     }","lines":8,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-packetline/src/read.rs#L79-L86"}]},
{"id":"PANIC_35","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`config_to_base_path` does `config_path.parent().expect(\"config file paths always have a file name to pop\")`. `Path::parent()` returns `None` for a root-only path (e.g. `/`). The value originates from `first_file_from_config_with_origin`, which extracts everything between `file:` and the first NUL with no validation that the path has a file-name component. Degenerate git output such as `file:/\\0` yields path `/`, whose `.parent()` is None, panicking inside `installation_config_prefix()`.","fix":"Return `Option`/`Result` and propagate `None` instead of `expect`, and reject empty/root extracted paths.","locations":[{"ref":"gix-path/src/env/git/mod.rs:291-295","code":"  291 | pub(super) fn config_to_base_path(config_path: &Path) -> &Path {\n  292 |     config_path\n  293 |         .parent()\n  294 |         .expect(\"config file paths always have a file name to pop\")\n  295 | }","lines":5,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-path/src/env/git/mod.rs#L291-L295"},{"ref":"gix-path/src/env/git/mod.rs:229-233","code":"  229 | fn first_file_from_config_with_origin(source: &BStr) -> Option<&BStr> {\n  230 |     let file = source.strip_prefix(b\"file:\")?;\n  231 |     let end_pos = file.find_byte(b'\\0')?;\n  232 |     file[..end_pos].as_bstr().into()\n  233 | }","lines":5,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-path/src/env/git/mod.rs#L229-L233"}]},
{"id":"PANIC_36","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`LineRef::previous_oid()` / `new_oid()` call `ObjectId::from_hex(...).expect(\"parse validation\")`.\nThe reflog parser validates hashes with `hex_hash_any`, which accepts any\nlength matching a supported hash kind, but `ObjectId::from_hex` is the\nauthority on what is parseable. These accessors are public API; if a caller\nconstructs a `LineRef` directly (the struct fields are reachable within the\ncrate, and `from_bytes` is the only guard) or a future hash kind diverges, the\n`expect` panics. The invariant is real today but fragile and relies on two\nindependent validators agreeing.","fix":"Return `Result` from these accessors, or make `from_bytes` the sole\nconstructor and assert the hash parses there once, storing the parsed\n`ObjectId` instead of re-parsing on each accessor call.","locations":[{"ref":"gix-ref/src/store/file/log/line.rs:53-59","code":"   53 |     pub fn previous_oid(&self) -> ObjectId {\n   54 |         ObjectId::from_hex(self.previous_oid).expect(\"parse validation\")\n   55 |     }\n   56 |     /// The new object id of the ref, or a null hash if it is removed.\n   57 |     pub fn new_oid(&self) -> ObjectId {\n   58 |         ObjectId::from_hex(self.new_oid).expect(\"parse validation\")\n   59 |     }","lines":7,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-ref/src/store/file/log/line.rs#L53-L59"}]},
{"id":"PANIC_37","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`base_url` uses `url.strip_prefix(base_url).expect(\"BUG: caller assures base_url is subset of url\")`, and `swap_tails` uses `url.replace_range(..base_url.len(), effective_base)`. Both rely on the invariant that `base_url` is a byte-prefix of `url`. `swap_tails` in particular runs before any validation and will panic (out-of-range index) if that invariant is ever violated by a future caller, e.g. if `base_url.len() > url.len()`. These are caller-trusted invariants with no defensive check.","fix":"Guard with `if let Some(tail) = url.strip_prefix(base_url)` / check `base_url.len() <= url.len()` and return the `redirect::Error` (or pass through unchanged) instead of relying on `expect`/`replace_range` panicking.","locations":[{"ref":"gix-transport/src/client/blocking_io/http/redirect.rs:73-76","code":"   73 | pub(crate) fn base_url(redirect_url: &str, base_url: &str, url: String) -> Result<String, Error> {\n   74 |     let tail = url\n   75 |         .strip_prefix(base_url)\n   76 |         .expect(\"BUG: caller assures `base_url` is subset of `url`\");","lines":4,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-transport/src/client/blocking_io/http/redirect.rs#L73-L76"},{"ref":"gix-transport/src/client/blocking_io/http/redirect.rs:92-100","code":"   92 | pub(crate) fn swap_tails(effective_base_url: Option<&str>, base_url: &str, mut url: String) -> String {\n   93 |     match effective_base_url {\n   94 |         Some(effective_base) => {\n   95 |             url.replace_range(..base_url.len(), effective_base);\n   96 |             url\n   97 |         }\n   98 |         None => url,\n   99 |     }\n  100 | }","lines":9,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-transport/src/client/blocking_io/http/redirect.rs#L92-L100"}]},
{"id":"PANIC_38","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"`Recorder::pop_front_tracked_path_and_set_current` calls `self.path_deque.pop_front().expect(...)`.\nThis is reachable from the breadth-first tree traversal: it is invoked once per dequeued sub-tree\n(breadthfirst.rs:95). The matching `push_back_tracked_path_component` only pushes when the location\nis `Location::Path`. If a custom `Visit` implementation (or a future change) pushes a tree onto\n`state.next` without a corresponding tracked-path push, this `expect` panics. It is a fragile\nexpect on state shared across two methods rather than a guaranteed-by-construction invariant.","fix":"Use `unwrap_or_default()` (as the back variant already does) to avoid panicking on an empty deque.","locations":[{"ref":"gix-traverse/src/tree/recorder.rs:104-111","code":"  104 |     fn pop_front_tracked_path_and_set_current(&mut self) {\n  105 |         if let Some(Location::Path) = self.location {\n  106 |             self.path = self\n  107 |                 .path_deque\n  108 |                 .pop_front()\n  109 |                 .expect(\"every call is matched with push_tracked_path_component\");\n  110 |         }\n  111 |     }","lines":8,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-traverse/src/tree/recorder.rs#L104-L111"},{"ref":"gix-traverse/src/tree/breadthfirst.rs:93-99","code":"   93 |             match state.next.pop_front() {\n   94 |                 Some(oid) => {\n   95 |                     delegate.pop_front_tracked_path_and_set_current();\n   96 |                     tree = objects.find_tree_iter(&oid, &mut state.buf)?;\n   97 |                 }\n   98 |                 None => break Ok(()),\n   99 |             }","lines":7,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-traverse/src/tree/breadthfirst.rs#L93-L99"}]},
{"id":"PANIC_39","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"from_tree run() spawns a background thread (from_tree/mod.rs:50) whose panic is never observed by the consumer.\nMore directly, next_entry() and the Read impl rely on a fixed-size buffer (`buf` sized u16::MAX) in protocol /\nentry.rs. In entry::fill_buf (entry.rs:113-114) the length prefix `nb` read from the stream is used directly to\nindex `self.parent.buf[..nb]`. Although the writer (write_stream) never emits chunks larger than u16::MAX, the\ndecoder trusts the on-wire length completely; if `from_read()` is fed a stream not produced by this crate (the\npublic Stream::from_read accepts arbitrary `impl Read`), a crafted/truncated `nb` cannot exceed buf len (it is a\nu16), so OOB is not reachable, but read_exact on a short stream will surface as an io error rather than a clean\n\"corrupt stream\" diagnostic. The bigger risk is the several `expect()`/`assert!` calls (e.g. next_entry assert at\nentry.rs:17, path_buf expects) that turn protocol misuse into panics rather than errors.","fix":"For untrusted input via from_read(), consider validating chunk lengths and returning an Error instead of relying on\nread_exact panics being impossible; and document that from_read must only consume streams produced by into_read().\nLower priority since the wire `nb` is a u16 and cannot exceed the buffer.","locations":[{"ref":"gix-worktree-stream/src/entry.rs:17-20","code":"   17 |         assert!(\n   18 |             self.path_buf.is_some(),\n   19 |             \"BUG: must consume and drop entry before getting the next one\"\n   20 |         );","lines":4,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-worktree-stream/src/entry.rs#L17-L20"},{"ref":"gix-worktree-stream/src/entry.rs:107-120","code":"  107 |     fn fill_buf(&mut self) -> std::io::Result<&[u8]> {\n  108 |         if self.parent.pos >= self.parent.filled {\n  109 |             let mut u16_buf = [0; 2];\n  110 |             self.parent.read.read_exact(&mut u16_buf)?;\n  111 |             let nb = u16::from_le_bytes(u16_buf) as usize;\n  112 | \n  113 |             if nb != 0 {\n  114 |                 self.parent.read.read_exact(&mut self.parent.buf[..nb])?;\n  115 |             }\n  116 |             self.parent.filled = nb;\n  117 |             self.parent.pos = 0;\n  118 |         }\n  119 |         Ok(&self.parent.buf[self.parent.pos..self.parent.filled])\n  120 |     }","lines":14,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-worktree-stream/src/entry.rs#L107-L120"},{"ref":"gix-worktree-stream/src/lib.rs:95-105","code":"   95 |     pub fn from_read(read: impl std::io::Read + 'static) -> Self {\n   96 |         Self {\n   97 |             read: utils::Read::Unknown(Box::new(read)),\n   98 |             extra_entries: None,\n   99 |             path_buf: Some(Vec::with_capacity(1024).into()),\n  100 |             err: Default::default(),\n  101 |             buf: std::iter::repeat_n(0, u16::MAX as usize).collect(),\n  102 |             pos: 0,\n  103 |             filled: 0,\n  104 |         }\n  105 |     }","lines":11,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-worktree-stream/src/lib.rs#L95-L105"}]},
{"id":"PANIC_40","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In the ambiguity error formatter, `obj.to_tag_ref()` and `obj.to_commit_ref()` are called after only\nchecking `obj.kind`. Both internally `.expect(\"BUG: ...\")` on decode. A present-but-corrupt tag/commit\nobject that has the right kind byte but fails to decode will panic while merely formatting an\n\"ambiguous short id\" error message, turning a diagnostic into a crash.","fix":"Use the fallible `try_to_tag_ref()` / `try_to_commit_ref()` and fall back to `CandidateInfo::Object { kind }` on error.","locations":[{"ref":"gix/src/revision/spec/parse/error.rs:87-93","code":"   87 |                     gix_object::Kind::Tag => {\n   88 |                         let tag = obj.to_tag_ref();\n   89 |                         CandidateInfo::Tag { name: tag.name.into() }\n   90 |                     }\n   91 |                     gix_object::Kind::Commit => {\n   92 |                         use bstr::ByteSlice;\n   93 |                         let commit = obj.to_commit_ref();","lines":7,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix/src/revision/spec/parse/error.rs#L87-L93"}]},
{"id":"PANIC_41","type":"panic","type_label":"Panic","severity":"negligible","difficulty":"easy","description":"`hash::Hasher::write` does `bytes[..8].try_into().unwrap()`, which panics if it is ever fed fewer than 8 bytes. It is documented as only-for-verified-types and in practice only sees object ids (>= 20 bytes), but it is a latent panic if misused via the public `BuildHasher`.","fix":"Guard the length or document the precondition as a debug assertion; not a correctness issue under current usage.","locations":[{"ref":"gix-hashtable/src/lib.rs:74-76","code":"   74 |         fn write(&mut self, bytes: &[u8]) {\n   75 |             self.0 = u64::from_ne_bytes(bytes[..8].try_into().unwrap());\n   76 |         }","lines":3,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-hashtable/src/lib.rs#L74-L76"}]},
{"id":"PANIC_42","type":"panic","type_label":"Panic","severity":"negligible","difficulty":"easy","description":"`Object::into_blob/into_commit/into_tree/into_tag` panic with `panic!(\"BUG: not a ...\")` when the variant does not match. These are public API entry points; while documented as panicking, the existing `try_into_*` variants are the safe form. Callers that pass attacker-influenced object kinds (e.g. after a `find` whose object turned out to be a different kind than expected) can trigger a process abort. Listed for completeness as the panics are intentional but easy to misuse.","fix":"No code change strictly required; ensure call sites use `try_into_*`/`as_*` when the kind is not guaranteed. Optionally document the panic precondition more prominently.","locations":[{"ref":"gix-object/src/object/mod.rs:69-96","code":"   69 |     /// Turns this instance into a [`Blob`], panic otherwise.\n   70 |     pub fn into_blob(self) -> Blob {\n   71 |         match self {\n   72 |             Object::Blob(v) => v,\n   73 |             _ => panic!(\"BUG: not a blob\"),\n   74 |         }\n   75 |     }\n   76 |     /// Turns this instance into a [`Commit`] panic otherwise.\n   77 |     pub fn into_commit(self) -> Commit {\n   78 |         match self {\n   79 |             Object::Commit(v) => v,\n   80 |             _ => panic!(\"BUG: not a commit\"),\n   81 |         }\n   82 |     }\n   83 |     /// Turns this instance into a [`Tree`] panic otherwise.\n   84 |     pub fn into_tree(self) -> Tree {\n   85 |         match self {\n   86 |             Object::Tree(v) => v,\n   87 |             _ => panic!(\"BUG: not a tree\"),\n   88 |         }\n   89 |     }\n   90 |     /// Turns this instance into a [`Tag`] panic otherwise.\n   91 |     pub fn into_tag(self) -> Tag {\n   92 |         match self {\n   93 |             Object::Tag(v) => v,\n   94 |             _ => panic!(\"BUG: not a tag\"),\n   95 |         }\n   96 |     }","lines":28,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-object/src/object/mod.rs#L69-L96"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`num_objects` (a usize from `counts.len()`) is cast to `u32` for the pack header. A count exceeding\nu32::MAX silently truncates, producing a corrupt pack header rather than a hard error. Git packs are\nlimited to a u32 object count by format, so an over-large count should be rejected explicitly.","fix":"Use `u32::try_from(num_objects)?` and return an error if it does not fit.","locations":[{"ref":"gitoxide-core/src/pack/create.rs:269","code":"  269 |             num_objects as u32,","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/pack/create.rs#L269"}]},
