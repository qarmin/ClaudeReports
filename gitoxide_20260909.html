{"id":"PERF_12","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`paint_down_to_common` (merge-base) checks its loop condition with\n`queue.iter_unordered().any(|id| graph.get(id)...)` on every iteration. This is an O(n) scan of the\nwhole priority queue per popped commit, making the merge-base painting O(n^2) in the number of queued\ncommits. The same O(n) full-queue scan per step appears in `compute_hidden_frontier`\n(simple.rs:200-204) and in `finish_depth_computation` for describe (describe.rs:328-331). For wide\nhistories this dominates runtime. Git tracks a counter of non-stale queued entries to make this O(1).","fix":"Maintain a running count of non-stale (or not-yet-common) queued commits and test that counter instead of rescanning the entire queue each iteration.","locations":[{"ref":"gix-revision/src/merge_base/function.rs:174-177","code":"  174 |     while queue\n  175 |         .iter_unordered()\n  176 |         .any(|id| graph.get(id).is_some_and(|commit| !commit.data.contains(Flags::STALE)))\n  177 |     {","lines":4,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-revision/src/merge_base/function.rs#L174-L177"},{"ref":"gix-traverse/src/commit/simple.rs:200-204","code":"  200 |     while queue.iter_unordered().any(|id| {\n  201 |         graph\n  202 |             .get(id)\n  203 |             .is_some_and(|commit| !commit.data.contains(PaintFlags::STALE))\n  204 |     }) {","lines":5,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-traverse/src/commit/simple.rs#L200-L204"},{"ref":"gix-revision/src/describe.rs:328-331","code":"  328 |                 if queue\n  329 |                     .iter_unordered()\n  330 |                     .all(|id| (graph[id] & best_candidate.identity_bit) == best_candidate.identity_bit)\n  331 |                 {","lines":4,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-revision/src/describe.rs#L328-L331"}]},
{"id":"PERF_13","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"Stream::from_read() and Stream::new() always allocate a u16::MAX (65535-byte) zero-filled buffer via\n`std::iter::repeat_n(0, u16::MAX as usize).collect()` for every Stream, even when the stream will be consumed via\nas_read_mut()/into_read() (raw byte access) and the per-entry buffered reader is never used. For workloads that\ncreate many short-lived streams this is wasteful. The buffer could be lazily allocated on first fill_buf() use.","fix":"Allocate `buf` lazily (e.g. keep it empty and grow/resize to u16::MAX on first fill_buf), or use\n`vec![0u8; u16::MAX as usize]` which is clearer and may compile to a faster zero-fill than repeat_n().collect().","locations":[{"ref":"gix-worktree-stream/src/lib.rs:101","code":"  101 |             buf: std::iter::repeat_n(0, u16::MAX as usize).collect(),","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-worktree-stream/src/lib.rs#L101"},{"ref":"gix-worktree-stream/src/lib.rs:191","code":"  191 |                 buf: std::iter::repeat_n(0, u16::MAX as usize).collect(),","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-worktree-stream/src/lib.rs#L191"}]},
{"id":"PERF_14","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`from_env()` constructs an `EnvironmentOverrides` and returns `Result<Self, ...>` but never actually returns an error - it reads env vars infallibly and always returns Ok. The `Result` wrapper and the `?` at the call site are dead error-handling, and the doc/signature implies a fallibility that doesn't exist.","fix":"Change the return type to `Self` (non-fallible) and drop the `?` at the call site, or actually perform the permission check that the Result type suggests.","locations":[{"ref":"gix/src/open/repository.rs:38-50","code":"   38 | impl EnvironmentOverrides {\n   39 |     fn from_env() -> Result<Self, gix_sec::permission::Error<std::path::PathBuf>> {\n   40 |         let mut worktree_dir = None;\n   41 |         if let Some(path) = std::env::var_os(Core::WORKTREE.the_environment_override()) {\n   42 |             worktree_dir = PathBuf::from(path).into();\n   43 |         }\n   44 |         let mut git_dir = None;\n   45 |         if let Some(path) = std::env::var_os(\"GIT_DIR\") {\n   46 |             git_dir = PathBuf::from(path).into();\n   47 |         }\n   48 |         Ok(EnvironmentOverrides { worktree_dir, git_dir })\n   49 |     }\n   50 | }","lines":13,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix/src/open/repository.rs#L38-L50"}]},
{"id":"PERF_15","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`NthAncestor` out-of-range error construction re-runs the entire first-parent ancestor walk a second time\n(`id.ancestors().first_parent_only().all()....skip(1).count()`) just to report how many ancestors exist.\nFor deep histories this doubles the traversal cost on the error path. Same pattern (re-walking to count)\nappears for the reflog/checkout out-of-range messages.","fix":"Count ancestors once during the first walk, or accept an approximate/omitted count in the error message.","locations":[{"ref":"gix/src/revision/spec/parse/delegate/navigate.rs:78-88","code":"   78 |                                 message!(\"Commit {oid} has {available} ancestors along the first parent and ancestor number {num} is out of range\",\n   79 |                                     oid = id.shorten_or_id(),\n   80 |                                     available = id\n   81 |                                         .ancestors()\n   82 |                                         .first_parent_only()\n   83 |                                         .all()\n   84 |                                         .expect(\"cannot fail without sorting\")\n   85 |                                         .skip(1)\n   86 |                                         .count()\n   87 |                                 ).raise_erased()\n   88 |                         )),","lines":11,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix/src/revision/spec/parse/delegate/navigate.rs#L78-L88"}]},
{"id":"PERF_16","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"`parse_flexible_offset` does `let rest = rest.replace(':', \"\");`, allocating a new String just to strip an optional single colon from a max-5-char offset, and `parse_time_component` allocates a `Vec<&str>` to read at most 3 elements. Minor per-call allocations on the parse path.","fix":"Handle the small fixed shapes without allocating (match on `&str`, iterate `split` lazily).","locations":[{"ref":"gix-date/src/parse/git.rs:208","code":"  208 |         let parts: Vec<&str> = time.split(':').collect();","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-date/src/parse/git.rs#L208"},{"ref":"gix-date/src/parse/git.rs:270","code":"  270 |     let rest = rest.replace(':', \"\");","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-date/src/parse/git.rs#L270"}]},
{"id":"PERF_17","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"In the bracket character-class scanner, when a `[` inside a class is not a valid `[:name:]` POSIX class,\nthe parser rebuilds the pattern iterator from scratch with\n`p = pattern[p_idx..].iter().map(possibly_lowercase).enumerate().peekable();` and accumulates `p_idx_ofs`.\nRe-creating the iterator (rather than continuing from the current position) is an unusual control-flow that\nre-walks already-consumed bytes for offset bookkeeping. It is correct (verified by extensive fuzzing with no\npanics or OOB), but it is a subtle and costly construct for malformed/adversarial class patterns.","fix":"Consider restructuring the class parser to advance the existing iterator instead of rebuilding it, removing the need for `p_idx_ofs` offset accounting.","locations":[{"ref":"gix-glob/src/wildmatch.rs:280-300","code":"  280 |                             BRACKET_OPEN if matches!(p.peek(), Some((_, COLON))) => {\n  281 |                                 p.next();\n  282 |                                 while p.peek().is_some_and(|t| t.1 != BRACKET_CLOSE) {\n  283 |                                     p.next();\n  284 |                                 }\n  285 |                                 let closing_bracket_idx = match p.next() {\n  286 |                                     Some((idx, _)) => idx,\n  287 |                                     None => return AbortAll,\n  288 |                                 };\n  289 |                                 const BRACKET__COLON__BRACKET: usize = 3;\n  290 |                                 if closing_bracket_idx.saturating_sub(p_idx) < BRACKET__COLON__BRACKET\n  291 |                                     || pattern[closing_bracket_idx - 1] != COLON\n  292 |                                 {\n  293 |                                     if t_ch == BRACKET_OPEN {\n  294 |                                         matched = true;\n  295 |                                     }\n  296 |                                     if p_idx > pattern.len() {\n  297 |                                         return AbortAll;\n  298 |                                     }\n  299 |                                     p = pattern[p_idx..].iter().map(possibly_lowercase).enumerate().peekable();\n  300 |                                     p_idx_ofs += p_idx;","lines":21,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-glob/src/wildmatch.rs#L280-L300"}]},
{"id":"PERF_18","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`icase_hash` recomputes the FNV hash of a path byte-by-byte (lowercasing each byte) and is\ncalled repeatedly for the same entry during `prepare_icase_backing` (once for the entry, and\nagain inside each `insert_unique`/`find` closure for every directory-prefix iteration). For\ndeep paths this rehashes overlapping prefixes many times. For very large indexes this is\nmeasurable. Minor / by-design tradeoff.","fix":"Consider caching the per-entry hash, or computing directory-prefix hashes incrementally.","locations":[{"ref":"gix-index/src/access/mod.rs:164-189","code":"  164 |             let mut last_pos = entry_path.len();\n  165 |             while let Some(slash_idx) = entry_path[..last_pos].rfind_byte(b'/') {\n  166 |                 let dir = entry_path[..slash_idx].as_bstr();\n  167 |                 last_pos = slash_idx;\n  168 |                 let dir_range = entry.path.start..(entry.path.start + dir.len());\n  169 | \n  170 |                 let hash = AccelerateLookup::icase_hash(dir);\n  171 |                 if out\n  172 |                     .icase_dirs\n  173 |                     .find(hash, |dir| {\n  174 |                         dir.path(self) == self.path_backing[dir_range.clone()].as_bstr()\n  175 |                     })\n  176 |                     .is_none()\n  177 |                 {\n  178 |                     out.icase_dirs.insert_unique(\n  179 |                         hash,\n  180 |                         crate::DirEntry {\n  181 |                             entry,\n  182 |                             dir_end: dir_range.end,\n  183 |                         },\n  184 |                         |dir| AccelerateLookup::icase_hash(dir.path(self)),\n  185 |                     );\n  186 |                 } else {\n  187 |                     break;\n  188 |                 }\n  189 |             }","lines":26,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-index/src/access/mod.rs#L164-L189"},{"ref":"gix-index/src/access/mod.rs:473-480","code":"  473 |     fn icase_hash(data: &BStr) -> u64 {\n  474 |         use std::hash::Hasher;\n  475 |         let mut hasher = fnv::FnvHasher::default();\n  476 |         for b in data.as_bytes() {\n  477 |             hasher.write_u8(b.to_ascii_lowercase());\n  478 |         }\n  479 |         hasher.finish()\n  480 |     }","lines":8,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-index/src/access/mod.rs#L473-L480"}]},
{"id":"PERF_19","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"`Tree`/`TreeRef` `WriteTo::size()` and `write_to()` both clone the entire `entries` vector just to run a `debug_assert_eq!` that they are sorted. In debug builds this is an O(n log n) allocation plus sort on every serialization; in release the clone is compiled out, but the readability cost remains. More importantly `size()` recomputes `mode.as_bytes(&mut buf)` per entry only to take its length, which is also done in `write_to`, duplicating work whenever both are called.","fix":"Replace the clone-and-sort `debug_assert_eq!` with an in-place `debug_assert!(entries.is_sorted())` (or windows()-based ordering check) to avoid the allocation even in debug builds.","locations":[{"ref":"gix-object/src/tree/write.rs:29-37","code":"   29 |         debug_assert_eq!(\n   30 |             &self.entries,\n   31 |             &{\n   32 |                 let mut entries_sorted = self.entries.clone();\n   33 |                 entries_sorted.sort();\n   34 |                 entries_sorted\n   35 |             },\n   36 |             \"entries for serialization must be sorted by filename\"\n   37 |         );","lines":9,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-object/src/tree/write.rs#L29-L37"},{"ref":"gix-object/src/tree/write.rs:76-84","code":"   76 |         debug_assert_eq!(\n   77 |             &{\n   78 |                 let mut entries_sorted = self.entries.clone();\n   79 |                 entries_sorted.sort();\n   80 |                 entries_sorted\n   81 |             },\n   82 |             &self.entries,\n   83 |             \"entries for serialization must be sorted by filename\"\n   84 |         );","lines":9,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-object/src/tree/write.rs#L76-L84"}]},
{"id":"PERF_20","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"`Arguments::is_empty` calls `self.args.iter().rev().any(|arg| arg.starts_with_str(\"want \"))`. The\n`.rev()` has no effect on `any()` (it still scans until the first match) and only adds a needless\nreverse-iterator wrapper. It is harmless but misleading - it suggests an intent (find the last/most\nrecent want) that `any` does not honor.","fix":"Drop the `.rev()`: `!self.args.iter().any(|arg| arg.starts_with_str(\"want \"))`.","locations":[{"ref":"gix-protocol/src/fetch/arguments/mod.rs:36-38","code":"   36 |     pub fn is_empty(&self) -> bool {\n   37 |         self.haves.is_empty() && !self.args.iter().rev().any(|arg| arg.starts_with_str(\"want \"))\n   38 |     }","lines":3,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-protocol/src/fetch/arguments/mod.rs#L36-L38"}]},
{"id":"PERF_21","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`PriorityQueue::from_iter` builds a `BinaryHeap` by repeated `insert` (push) calls rather than using\n`BinaryHeap::from`/`from_iter`, which can build the heap in O(n) instead of O(n log n). For the small\nseed queues used here (often 1-2 items) the impact is negligible, but the implementation is\nneedlessly suboptimal and the lib.rs comment already notes the queue is ~6% slower than alternatives.","fix":"Collect into a Vec and use `BinaryHeap::from(vec)` for O(n) heap construction.","locations":[{"ref":"gix-revwalk/src/queue.rs:116-124","code":"  116 | impl<K: Ord, T> FromIterator<(K, T)> for PriorityQueue<K, T> {\n  117 |     fn from_iter<I: IntoIterator<Item = (K, T)>>(iter: I) -> Self {\n  118 |         let mut q = PriorityQueue(BinaryHeap::new());\n  119 |         for (k, v) in iter {\n  120 |             q.insert(k, v);\n  121 |         }\n  122 |         q\n  123 |     }\n  124 | }","lines":9,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-revwalk/src/queue.rs#L116-L124"}]},
{"id":"PERF_22","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`check_content_type` collects all header lines into a `Vec` via `headers.lines().collect::<Result<Vec<_>, _>>()?` before scanning for the content-type, instead of iterating lazily and short-circuiting on the first match. For responses with many headers this materializes the entire header set unnecessarily.","fix":"Iterate `headers.lines()` lazily with `.any(...)` over `Result` items (e.g. using `try_fold` / a manual loop) and stop at the first matching content-type line.","locations":[{"ref":"gix-transport/src/client/blocking_io/http/mod.rs:289-304","code":"  289 |     fn check_content_type(service: Service, kind: &str, headers: <H as Http>::Headers) -> Result<(), client::Error> {\n  290 |         let wanted_content_type = format!(\"application/x-{}-{}\", service.as_str(), kind);\n  291 |         if !headers.lines().collect::<Result<Vec<_>, _>>()?.iter().any(|l| {\n  292 |             let mut tokens = l.split(':');\n  293 |             tokens.next().zip(tokens.next()).is_some_and(|(name, value)| {\n  294 |                 name.eq_ignore_ascii_case(\"content-type\") && value.trim() == wanted_content_type\n  295 |             })\n  296 |         }) {\n  297 |             return Err(client::Error::Http(Error::Detail {\n  298 |                 description: format!(\n  299 |                     \"Didn't find '{wanted_content_type}' header to indicate 'smart' protocol, and 'dumb' protocol is not supported.\"\n  300 |                 ),\n  301 |             }));\n  302 |         }\n  303 |         Ok(())\n  304 |     }","lines":16,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-transport/src/client/blocking_io/http/mod.rs#L289-L304"}]},
{"id":"PERF_23","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`host_matches` (credential helper section matching) calls `.clone().count()` on both split iterators just to compare field counts, then re-splits and zips. For each credential section this walks both strings an extra time. Minor, but on configs with many `credential.<url>` sections it is avoidable work.","fix":"Collect once or compare via a single zip that also detects length mismatch, avoiding the redundant count-walk of both iterators.","locations":[{"ref":"gix/src/config/snapshot/credential_helpers.rs:235-250","code":"  235 |     fn host_matches(pattern: Option<&str>, host: Option<&str>) -> bool {\n  236 |         match (pattern, host) {\n  237 |             (Some(pattern), Some(host)) => {\n  238 |                 let lfields = pattern.split('.');\n  239 |                 let rfields = host.split('.');\n  240 |                 if lfields.clone().count() != rfields.clone().count() {\n  241 |                     return false;\n  242 |                 }\n  243 |                 lfields.zip(rfields).all(|(pat, value)| {\n  244 |                     gix_glob::wildmatch(pat.into(), value.into(), gix_glob::wildmatch::Mode::empty())\n  245 |                 })\n  246 |             }\n  247 |             (None, None) => true,\n  248 |             (Some(_), None) | (None, Some(_)) => false,\n  249 |         }\n  250 |     }","lines":16,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix/src/config/snapshot/credential_helpers.rs#L235-L250"}]},
{"id":"PERF_24","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`rewrite_url_in_place` recomputes `replace.find.len()` and re-wraps `replace.with.as_slice().into()` on every\nmatching prefix while folding, and uses a fold to find the longest match instead of `max_by_key`. Minor, but the\ninner `if *bytes_matched < replace.find.len()` after `get_or_insert((replace.find.len(), ...))` is redundant on\nthe first insertion (the just-inserted value already equals `replace.find.len()`), making the longest-match\nselection harder to read than a direct `filter(starts_with).max_by_key(|r| r.find.len())`.","fix":"Replace the fold with `replacements.iter().filter(|r| url.starts_with(&r.find)).max_by_key(|r| r.find.len())` then a single replace_range.","locations":[{"ref":"gix/src/remote/url/rewrite.rs:78-96","code":"   78 |     pub fn rewrite_url_in_place(&self, url: &mut BString, direction: Direction) -> bool {\n   79 |         self.replacements_for(direction)\n   80 |             .iter()\n   81 |             .fold(None::<(usize, &BStr)>, |mut acc, replace| {\n   82 |                 if url.starts_with(replace.find.as_ref()) {\n   83 |                     let (bytes_matched, prev_rewrite_with) =\n   84 |                         acc.get_or_insert((replace.find.len(), replace.with.as_slice().into()));\n   85 |                     if *bytes_matched < replace.find.len() {\n   86 |                         *bytes_matched = replace.find.len();\n   87 |                         *prev_rewrite_with = replace.with.as_slice().into();\n   88 |                     }\n   89 |                 }\n   90 |                 acc\n   91 |             })\n   92 |             .map(|(bytes_matched, replace_with)| {\n   93 |                 url.replace_range(..bytes_matched, replace_with);\n   94 |             })\n   95 |             .is_some()\n   96 |     }","lines":19,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix/src/remote/url/rewrite.rs#L78-L96"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"In process_delayed_filter_results(), the early-return branch `if !keep_going && !unknown_paths.is_empty()` can never\nfire. `unknown_paths` is only ever pushed to inside the `Err(_)` arm of the binary_search, and that arm only pushes\nwhen `keep_going` is true (when `keep_going` is false it returns Error::FilterPathUnknown immediately). Therefore\nwhen control reaches line 246, `!keep_going` implies `unknown_paths` is empty, so the condition is always false and\nthe branch is dead. Additionally, even if it could fire, the error variant is `FilterPathsUnprocessed` populated with\n`unprocessed_paths`, which is inconsistent with the `unknown_paths` it tests, making the intent unclear.","fix":"Remove the dead `if !keep_going && !unknown_paths.is_empty()` block, or, if a non-keep-going error path for\nunprocessed paths is actually intended, base it on `unprocessed_paths` (and check `!keep_going` against the right set)\nand return the matching error variant.","locations":[{"ref":"gix-worktree-state/src/checkout/chunk.rs:246-250","code":"  246 |     if !keep_going && !unknown_paths.is_empty() {\n  247 |         return Err(checkout::Error::FilterPathsUnprocessed {\n  248 |             rela_paths: unprocessed_paths,\n  249 |         });\n  250 |     }","lines":5,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-worktree-state/src/checkout/chunk.rs#L246-L250"},{"ref":"gix-worktree-state/src/checkout/chunk.rs:188-198","code":"  188 |                 let delayed = match delayed_filter_results.binary_search_by(|d| d.entry_path.cmp(rela_path.as_ref())) {\n  189 |                     Ok(idx) => &mut delayed_filter_results[idx],\n  190 |                     Err(_) => {\n  191 |                         if keep_going {\n  192 |                             unknown_paths.push(rela_path);\n  193 |                             continue;\n  194 |                         } else {\n  195 |                             return Err(checkout::Error::FilterPathUnknown { rela_path });\n  196 |                         }\n  197 |                     }\n  198 |                 };","lines":11,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-worktree-state/src/checkout/chunk.rs#L188-L198"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"On non-serde builds, `mailmap entries()` writes only a \"Defaulting to JSON...\" note to stderr (Human\nmode) and otherwise produces no entries while still returning `Ok(())`, so a user gets a silent no-op\nsuccess with empty output.","fix":"On non-serde builds `bail!` that mailmap listing is unavailable instead of returning Ok with no output.","locations":[{"ref":"gitoxide-core/src/repository/mailmap.rs:32-51","code":"   32 | pub fn entries(\n   33 |     repo: gix::Repository,\n   34 |     format: OutputFormat,\n   35 |     #[cfg_attr(not(feature = \"serde\"), allow(unused_variables))] out: impl io::Write,\n   36 |     mut err: impl io::Write,\n   37 | ) -> anyhow::Result<()> {\n   38 |     if format == OutputFormat::Human {\n   39 |         writeln!(err, \"Defaulting to JSON as human format isn't implemented\").ok();\n   40 |     }\n   41 | \n   42 |     let mut mailmap = gix::mailmap::Snapshot::default();\n   43 |     if let Err(e) = repo.open_mailmap_into(&mut mailmap) {\n   44 |         writeln!(err, \"Error while loading mailmap, the first error is: {e}\").ok();\n   45 |     }\n   46 | \n   47 |     #[cfg(feature = \"serde\")]\n   48 |     serde_json::to_writer_pretty(out, &mailmap.iter().map(JsonEntry::from).collect::<Vec<_>>())?;\n   49 | \n   50 |     Ok(())\n   51 | }","lines":20,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/repository/mailmap.rs#L32-L51"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"`tar_entry_type` maps `EntryKind::Link` to `tar::EntryType::Link` (a *hard* link). For links, `append_tar_entry` immediately overrides the entry type to `EntryType::Symlink` at line 310, so the `Link` arm's value is never actually used and is misleading (a symlink is not a hard link).","fix":"Have `tar_entry_type` return `EntryType::Symlink` for `Link`, or document that the type is unconditionally overridden for links.","locations":[{"ref":"gix-archive/src/write.rs:328-337","code":"  328 | fn tar_entry_type(mode: gix_object::tree::EntryMode) -> tar::EntryType {\n  329 |     use gix_object::tree::EntryKind;\n  330 |     use tar::EntryType;\n  331 |     match mode.kind() {\n  332 |         EntryKind::Tree | EntryKind::Commit => EntryType::Directory,\n  333 |         EntryKind::Blob => EntryType::Regular,\n  334 |         EntryKind::BlobExecutable => EntryType::Regular,\n  335 |         EntryKind::Link => EntryType::Link,\n  336 |     }\n  337 | }","lines":10,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-archive/src/write.rs#L328-L337"},{"ref":"gix-archive/src/write.rs:313-319","code":"  313 |     if entry.mode.is_link() {\n  314 |         use bstr::ByteSlice;\n  315 |         let target = gix_path::from_bstr(buf.as_bstr());\n  316 |         header.set_entry_type(tar::EntryType::Symlink);\n  317 |         header.set_size(0);\n  318 |         ar.append_link(&mut header, path, target)\n  319 |             .or_raise(|| message(\"Could not append symlink to tar archive\"))?;","lines":7,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-archive/src/write.rs#L313-L319"}]},

_)| graph.get_mut(id).expect(\"added previously\").data.remove(Flags::STALE));\n   82 |     let mut count_still_independent = commits.len();\n   83 | \n   84 |     let mut stack = Vec::new();\n   85 |     while let Some((commit_id, commit_info)) = walk_start.pop().filter(|_| count_still_independent > 1) {\n   86 |         stack.clear();\n   87 |         graph.get_mut(&commit_id).expect(\"added\").data |= Flags::STALE;\n   88 |         stack.push((commit_id, commit_info));\n   89 | \n   90 |         while let Some((commit_id, commit_info)) = stack.last().copied() {\n   91 |             let commit = graph.get_mut(&commit_id).expect(\"all commits have been added\");\n   92 |             let commit_parents = commit.parents.clone();\n   93 |             if commit.data.contains(Flags::RESULT) {\n   94 |                 commit.data.remove(Flags::RESULT);\n   95 |                 count_still_independent -= 1;\n   96 |                 if count_still_independent <= 1 {\n   97 |                     break;\n   98 |                 }\n   99 |                 if *commit_id == *sorted_commits[min_gen_pos].0 {\n  100 |                     while min_gen_pos < commits.len() - 1\n  101 |                         && graph\n  102 |                             .get(&sorted_commits[min_gen_pos].0)\n  103 |                             .expect(\"already added\")\n  104 |                             .data\n  105 |                             .contains(Flags::STALE)\n  106 |                     {\n  107 |                         min_gen_pos += 1;\n  108 |                     }\n  109 |                     min_gen = sorted_commits[min_gen_pos].1.generation;\n  110 |                 }","lines":53,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-revision/src/merge_base/function.rs#L58-L110"}]},

{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The delete-failure error message has an unbalanced quote: `\"Failed to delete pack index file at '{}\nor data file at '{}'\"` - the closing quote after the first path is missing, so it renders as\n`...at 'foo.idx or data file at 'foo.pack'`. Because the two removals are chained with `.and_then`, a\ndata-file removal failure still blames the \"pack index file\".","fix":"Fix quoting (`\"...at '{}' or data file at '{}'\"`) and, ideally, report which file actually failed.","locations":[{"ref":"gitoxide-core/src/pack/explode.rs:278-284","code":"  278 |             .with_context(|| {\n  279 |                 format!(\n  280 |                     \"Failed to delete pack index file at '{} or data file at '{}'\",\n  281 |                     index_path.display(),\n  282 |                     data_path.display()\n  283 |                 )\n  284 |             })?;","lines":7,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/pack/explode.rs#L278-L284"}]},
{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"medium","description":"The doc comment claims \"String parts always sort before numeric parts when compared directly\", but\nthis is purely an artifact of the `VersionPart` variant declaration order (String declared before\nNumber) under derived Ord, not a guaranteed semantic. Reordering the variants would silently falsify\nthe comment, and no test locks the String-before-Number invariant.","fix":"Either drop the sentence or state explicitly that ordering relies on variant declaration order, and add a test.","locations":[{"ref":"gitoxide-core/src/repository/tag.rs:5-9","code":"    5 | #[derive(Eq, PartialEq, PartialOrd, Ord)]\n    6 | enum VersionPart {\n    7 |     String(BString),\n    8 |     Number(usize),\n    9 | }","lines":5,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/repository/tag.rs#L5-L9"},{"ref":"gitoxide-core/src/repository/tag.rs:21-22","code":"   21 | /// When comparing versions of different lengths, shorter versions sort before longer ones (e.g.,\n   22 | /// `v1.0` < `v1.0.1`). String parts always sort before numeric parts when compared directly.","lines":2,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/repository/tag.rs#L21-L22"}]},

{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"Error variant doc/message claims section names may only be \"ascii, '-'\" but `validated_name` actually\naccepts ASCII alphanumeric OR `-`. The message omits the alphanumeric part and is grammatically broken\n(\"can only be ascii, '-'\"), which is misleading for users diagnosing a rejected section name.","fix":"Reword to e.g. \"section names can only contain ASCII alphanumeric characters and '-'\" to match the\n`validated_name` predicate.","locations":[{"ref":"gix-config/src/parse/section/header.rs:9","code":"    9 |     #[error(\"section names can only be ascii, '-'\")]","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-config/src/parse/section/header.rs#L9"}]},
{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"The doc comment on `Connectivity::check_commit` states \"Missing commits or trees will cause an error to be returned.\" This is only true for commits (the missing commit propagates a `Result` error). Missing *trees* do NOT return an error: `check_tree` invokes `missing_cb(oid, Kind::Tree)` and returns normally. The documented behavior contradicts the implementation.","fix":"Correct the comment to state that missing trees trigger `missing_cb` (only missing commits return an error), or change the code to match the documented behavior.","locations":[{"ref":"gix-fsck/src/lib.rs:48","code":"   48 |     /// Missing commits or trees will cause an error to be returned.","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-fsck/src/lib.rs#L48"},{"ref":"gix-fsck/src/lib.rs:73-77","code":"   73 |     fn check_tree(&mut self, oid: &ObjectId, tree_ids: &mut VecDeque<ObjectId>) {\n   74 |         let Ok(tree) = self.db.find_tree(oid, &mut self.buf) else {\n   75 |             (self.missing_cb)(oid, Kind::Tree);\n   76 |             return;\n   77 |         };","lines":5,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-fsck/src/lib.rs#L73-L77"}]},
{"id":"CMT_7","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"In `ListHandle::push`, the `len == 1` arm carries the comment \"This is an empty list. Allocate a block and set\nlength=1.\" but the list is not empty (it already holds one inline element in `self.index`), and the code in fact\nsets the length to 2 after moving the previously-inline element plus the new one into a freshly allocated block.\nThe comment is a left-over from the `len == 0` case and is misleading for a future reader of this subtle\npool-allocation code.","fix":"Replace with something like: \"List had a single inline element; allocate a 2-slot block and store both.\"","locations":[{"ref":"gix-imara-diff/src/histogram/list_pool.rs:229-236","code":"  229 |             1 => {\n  230 |                 // This is an empty list. Allocate a block and set length=1.\n  231 |                 let block = pool.alloc(0);\n  232 |                 pool.data[block] = self.index;\n  233 |                 pool.data[block + 1] = element;\n  234 |                 self.index = block as u32;\n  235 |                 self.len = 2;\n  236 |             }","lines":8,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-imara-diff/src/histogram/list_pool.rs#L229-L236"}]},

{"id":"CMT_9","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","difficulty":"easy","description":"Doc comment for `Worktree::id()` is self-contradictory: \"...if it is a linked worktree, or `None` if it's\na linked worktree.\" Both branches say \"linked worktree\". The `None` case is the main worktree (see the\nimplementation `id()` which returns `None` when there is no common dir).","fix":"Change the second clause to \"...or `None` if it is the main worktree\".","locations":[{"ref":"gix/src/worktree/mod.rs:92-95","code":"   92 |     /// Return the ID of the repository worktree, if it is a linked worktree, or `None` if it's a linked worktree.\n   93 |     pub fn id(&self) -> Option<&BStr> {\n   94 |         id(self.parent.git_dir(), self.parent.common_dir.is_some())\n   95 |     }","lines":4,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix/src/worktree/mod.rs#L92-L95"}]},
{"id":"CMT_10","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"The doc comment on `process_change`'s helper says \"The first line that is `range_with_end.end - 1`.\" which is an\nincomplete/garbled sentence (likely meant \"The last line is `range_with_end.end - 1`.\"). Minor but misleading for a\nfunction whose off-by-one semantics are central to correctness.","fix":"Reword to: \"The last included line is `range_with_end.end - 1`.\"","locations":[{"ref":"gix-blame/src/file/mod.rs:25-30","code":"   25 |     /// Since `range_with_end` is a range that is not inclusive at the end,\n   26 |     /// `range_with_end.end` is not part of `range_with_end`.\n   27 |     /// The first line that is `range_with_end.end - 1`.\n   28 |     fn actual_end_in_range(test: &Range<u32>, containing_range: &Range<u32>) -> bool {\n   29 |         (test.end - 1) >= containing_range.start && test.end <= containing_range.end\n   30 |     }","lines":6,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-blame/src/file/mod.rs#L25-L30"}]},
{"id":"CMT_11","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"The doc comment for `File::commit_at` and `File::id_at` states the position 'must range from 0 to `self.num_commits()`' / 'ranges from 0 to `self.num_commits()`', but the actual valid range is `0..num_commits()` (exclusive of `num_commits()`), as the `assert!(pos.0 < self.num_commits())` checks confirm. The inclusive phrasing is off-by-one and could mislead a caller into passing `num_commits()` and hitting the panic.","fix":"Reword the docs to 'from 0 to `num_commits() - 1`' or 'in range `0..num_commits()`', consistent with the `Position`/`num_commits()` docs elsewhere in the crate.","locations":[{"ref":"gix-commitgraph/src/file/access.rs:18-27","code":"   18 |     /// Returns the commit data for the commit located at the given lexicographical position.\n   19 |     ///\n   20 |     /// `pos` must range from 0 to `self.num_commits()`.\n   21 |     ///\n   22 |     /// # Panics\n   23 |     ///\n   24 |     /// Panics if `pos` is out of bounds.\n   25 |     pub fn commit_at(&self, pos: file::Position) -> Commit<'_> {\n   26 |         Commit::new(self, pos)\n   27 |     }","lines":10,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-commitgraph/src/file/access.rs#L18-L27"},{"ref":"gix-commitgraph/src/file/access.rs:36-52","code":"   36 |     /// Returns an object id at the given index in our list of (sorted) hashes.\n   37 |     /// The position ranges from 0 to `self.num_commits()`\n   38 |     // copied from gix-odb/src/pack/index/ext\n   39 |     pub fn id_at(&self, pos: file::Position) -> &gix_hash::oid {\n   40 |         assert!(\n   41 |             pos.0 < self.num_commits(),\n   42 |             \"expected lexicographical position less than {}, got {}\",\n   43 |             self.num_commits(),\n   44 |             pos.0\n   45 |         );\n   46 |         let pos: usize = pos\n   47 |             .0\n   48 |             .try_into()\n   49 |             .expect(\"an architecture able to hold 32 bits of integer\");\n   50 |         let start = self.oid_lookup_offset + (pos * self.hash_len);\n   51 |         gix_hash::oid::from_bytes_unchecked(&self.data[start..][..self.hash_len])\n   52 |     }","lines":17,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-commitgraph/src/file/access.rs#L36-L52"}]},

{"id":"CMT_13","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"The doc comment for `path()` states it 'Returns (status, file_kind, pathspec_matches_how)',\na 3-tuple, but the function actually returns an `Outcome` struct with five fields (status,\nproperty, disk_kind, index_kind, pathspec_match). The documented return shape is stale.","fix":"Update the doc comment to describe the `Outcome` struct and its fields.","locations":[{"ref":"gix-dir/src/walk/classify.rs:128-129","code":"  128 | /// Returns `(status, file_kind, pathspec_matches_how)` to identify the `status` on disk, along with a classification `file_kind`,\n  129 | /// and if `file_kind` is not a directory, the way the pathspec matched with `pathspec_matches_how`.","lines":2,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-dir/src/walk/classify.rs#L128-L129"}]},
{"id":"CMT_14","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"Doc comment typo/garbled text: 'A function that writes a buffer like `fn(&mut buf)` with by tes of an\nobject...' - 'by tes' should be 'bytes'. Minor but it is in a public-facing type alias doc.","fix":"Fix 'by tes' -> 'bytes'.","locations":[{"ref":"gix-filter/src/eol/convert_to_git.rs:41","code":"   41 | /// A function that writes a buffer like `fn(&mut buf)` with by tes of an object in the index that is the one that should be converted.","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-filter/src/eol/convert_to_git.rs#L41"}]},
{"id":"CMT_15","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"Stale/garbled doc comments: `lib.rs` field `current` is \"the most recent known cached that we know is valid\" (broken phrasing), and `current_relative` is \"The relative portion of `valid`\" but there is no field named `valid` (renamed to `current`). Other typos: create.rs:91 / remove.rs:6 \"once or more success\", lib.rs \"most be set\", symlink.rs \"symlnk\".","fix":"Fix the wording and stale field reference.","locations":[{"ref":"gix-fs/src/lib.rs:167-171","code":"  167 |     /// the most recent known cached that we know is valid.\n  168 |     current: PathBuf,\n  169 |     /// The relative portion of `valid` that was added previously.\n  170 |     current_relative: PathBuf,\n  171 |     /// The amount of path components of 'current' beyond the roots components.","lines":5,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-fs/src/lib.rs#L167-L171"},{"ref":"gix-fs/src/dir/create.rs:91","code":"   91 | /// * `Some(Ok(created_directory))` is yielded once or more success, followed by `None`","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-fs/src/dir/create.rs#L91"},{"ref":"gix-fs/src/symlink.rs:86","code":"   86 |             || err.raw_os_error() == Some(62) // no-follow on symlnk on mac-os","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-fs/src/symlink.rs#L86"}]},
{"id":"CMT_16","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"The doc comment for `nsecs` says it ranges 'from 0 to 999.999.999' but the field is a plain\n`u32` with no enforcement, and `system_time_from_secs_nanos`/decode paths accept any u32.\nThe comment overstates a guarantee the type does not provide. Minor doc inaccuracy.","fix":"Reword to 'typically 0..1_000_000_000' or note the value is not validated.","locations":[{"ref":"gix-index/src/entry/stat.rs:146-147","code":"  146 |     /// The amount of nanoseconds elapsed in the current second, ranging from 0 to 999.999.999 .\n  147 |     pub nsecs: u32,","lines":2,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-index/src/entry/stat.rs#L146-L147"}]},
{"id":"CMT_17","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"A stray doc comment `/// An object database equivalent to `/dev/null`, dropping all objects stored into it.`\nis attached to the `mod traits;` declaration, but `traits` contains the `Header`/`HeaderExt` traits, not the\nsink/`/dev/null` database. The `/dev/null`-like database is the `Sink` type defined elsewhere. The comment is\nmisplaced and misleading.","fix":"Remove or correct the comment on `mod traits;`; the `/dev/null`-style description belongs to `Sink`.","locations":[{"ref":"gix-odb/src/lib.rs:112-113","code":"  112 | /// An object database equivalent to `/dev/null`, dropping all objects stored into it.\n  113 | mod traits;","lines":2,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-odb/src/lib.rs#L112-L113"}]},
{"id":"CMT_18","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"The doc comment on `load_one_index` reads \"If `None` is returned, there is new indices and the caller should\ngive up.\" This is grammatically broken and semantically inverted: `Ok(None)` means there are *no* new indices\n(nothing more to load), which is exactly when the caller should give up. The comment as written says the\nopposite of the intent.","fix":"Reword to: \"If `Ok(None)` is returned, there are no new indices and the caller should give up.\"","locations":[{"ref":"gix-odb/src/store_impls/dynamic/load_index.rs:78-79","code":"   78 |     /// If `None` is returned, there is new indices and the caller should give up. This is a possibility even if it's allowed to refresh\n   79 |     /// as here might be no change to pick up.","lines":2,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-odb/src/store_impls/dynamic/load_index.rs#L78-L79"}]},
{"id":"CMT_19","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"`into_bstr` (line 80) and `from_bstr` (line 120) both use the copy-pasted `expect` message \"prefix path doesn't contain ill-formed UTF-8\", but neither is about a prefix path. The sibling `from_bstring`/`from_byte_slice` use the accurate \"well-formed UTF-8 on windows\". The misleading messages would confuse anyone reading a panic backtrace.","fix":"Replace with an accurate message matching the sibling functions, e.g. \"well-formed UTF-8 on windows\".","locations":[{"ref":"gix-path/src/convert.rs:80","code":"   80 |     try_into_bstr(path).expect(\"prefix path doesn't contain ill-formed UTF-8\")","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-path/src/convert.rs#L80"},{"ref":"gix-path/src/convert.rs:120","code":"  120 |     try_from_bstr(input).expect(\"prefix path doesn't contain ill-formed UTF-8\")","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-path/src/convert.rs#L120"}]},
{"id":"CMT_20","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"Several doc comments are truncated/incomplete, ending mid-sentence with 'Note that the' or 'Note that':\n`gix-pathspec` `Pattern::to_bstring` ('Note that the'), and `gix-glob::parse` top-level fn ('Note that').\nThese look like unfinished documentation.","fix":"Complete or remove the dangling sentences.","locations":[{"ref":"gix-pathspec/src/pattern.rs:154","code":"  154 |     /// Note that the","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-pathspec/src/pattern.rs#L154"},{"ref":"gix-glob/src/lib.rs:64","code":"   64 | /// Note that","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-glob/src/lib.rs#L64"}]},
{"id":"CMT_21","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"Doc comment on `Options::max_candidates` says \"If the number is exceeded, it will be capped at 32 and\ndefaults to 10.\" This is misleading/contradictory: the code caps it at `MAX_CANDIDATES` (32) via\n`max_candidates.min(MAX_CANDIDATES)` but there is no \"defaults to 10\" behavior when the value is\nexceeded - the 10 default only applies via `Options::default()`. The phrase conflates capping with\ndefaulting.","fix":"Reword to: \"Values above 32 are capped to 32. The default (via Options::default) is 10.\"","locations":[{"ref":"gix-revision/src/describe.rs:108-110","code":"  108 |     ///\n  109 |     /// If the number is exceeded, it will be capped at 32 and defaults to 10.\n  110 |     pub max_candidates: usize,","lines":3,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-revision/src/describe.rs#L108-L110"},{"ref":"gix-revision/src/describe.rs:168","code":"  168 |         max_candidates = max_candidates.min(MAX_CANDIDATES);","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-revision/src/describe.rs#L168"}]},
{"id":"CMT_22","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"Doc comment for `ProgramKind::Putty` says \"The `putty.exe` binary\", duplicating the description style but the field above (`Plink`) already says \"The `(plink|putty).exe` binaries\". More importantly, `restore_thread_after_failure` in the reqwest backend has an error message that mentions curl: `.expect_err(\"something should have gone wrong with curl (we join on error only)\")` - this is a copy-paste from the curl backend and is misleading in the reqwest module.","fix":"Update the reqwest `expect_err` message to refer to reqwest rather than curl.","locations":[{"ref":"gix-transport/src/client/blocking_io/http/reqwest/remote.rs:255-267","code":"  255 |     fn restore_thread_after_failure(&mut self) -> http::Error {\n  256 |         let err_that_brought_thread_down = self\n  257 |             .handle\n  258 |             .take()\n  259 |             .expect(\"thread handle present\")\n  260 |             .join()\n  261 |             .expect(\"handler thread should never panic\")\n  262 |             .expect_err(\"something should have gone wrong with curl (we join on error only)\");\n  263 |         *self = Remote::default();\n  264 |         http::Error::InitHttpClient {\n  265 |             source: Box::new(err_that_brought_thread_down),\n  266 |         }\n  267 |     }","lines":13,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-transport/src/client/blocking_io/http/reqwest/remote.rs#L255-L267"}]},
{"id":"CMT_23","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"Doc comment for `ProgramKind::Simple` reads \"A minimal ssh client that supports on options.\" - this is a typo; it should read \"supports no options\" (the variant explicitly errors when a port is requested and provides no exe name).","fix":"Fix the typo: \"A minimal ssh client that supports no options.\"","locations":[{"ref":"gix-transport/src/client/blocking_io/ssh/mod.rs:35-36","code":"   35 |     /// A minimal ssh client that supports on options.\n   36 |     Simple,","lines":2,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-transport/src/client/blocking_io/ssh/mod.rs#L35-L36"}]},
{"id":"CMT_24","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"easy","description":"Misleading variable name in attributes::push_directory: `let no_follow_symlinks = false;` with the comment \"Git does\nnot follow symbolic links as per documentation.\" A value named `no_follow_symlinks` set to `false` reads as \"do\nfollow symlinks\", contradicting both the comment and the intent. The value is passed as the `follow_symlinks`\nparameter of add_patterns_file, so `false` means \"do not follow\" - correct behavior, wrong name. This is confusing\nand error-prone for maintainers.","fix":"Rename to `let follow_symlinks = false;` to match the parameter it feeds and the documented behavior.","locations":[{"ref":"gix-worktree/src/stack/state/attributes.rs:99-100","code":"   99 |         // Git does not follow symbolic links as per documentation.\n  100 |         let no_follow_symlinks = false;","lines":2,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-worktree/src/stack/state/attributes.rs#L99-L100"}]},
{"id":"CMT_25","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"Doc comment typos in `submodule/mod.rs`: 'retunred' (should be 'returned') and the doc on\n`Repository::submodules()` reference at line 24 has an unterminated bracket `[Repository::submodules()]`\n(missing closing `]` before the period in the rustdoc link). Minor doc-quality issues in public API docs.","fix":"Fix the 'retunred' typo and close the intra-doc link bracket.","locations":[{"ref":"gix/src/submodule/mod.rs:207","code":"  207 |     /// The retunred directory might not exist yet.","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix/src/submodule/mod.rs#L207"},{"ref":"gix/src/submodule/mod.rs:28","code":"   28 | /// A platform maintaining state needed to interact with submodules, created by [`Repository::submodules()].","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix/src/submodule/mod.rs#L28"}]},

{"id":"DUP_2","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"`write_object_inner` and `write_blob`/`write_blob_stream_inner` repeat the same pattern: compute_hash, `if self.objects.exists(&oid) { return Ok(oid.attach(self)) }`, then `write_buf_with_known_id(...).map(attach)`. Three near-identical bodies. The same exists-then-write pattern is also duplicated in `impls.rs` `write_buf`/`write_buf_with_known_id`.","fix":"Extract a single private helper that takes (kind, bytes, oid) and performs the exists-check-then-write, and call it from all sites.","locations":[{"ref":"gix/src/repository/object.rs:256-324","code":"  256 |     fn write_object_inner(&self, buf: &[u8], kind: gix_object::Kind) -> Result<Id<'_>, object::write::Error> {\n  257 |         let oid = gix_object::compute_hash(self.object_hash(), kind, buf)\n  258 |             .map_err(|err| Box::new(err) as Box<dyn std::error::Error + Send + Sync>)?;\n  259 |         if self.objects.exists(&oid) {\n  260 |             return Ok(oid.attach(self));\n  261 |         }\n  262 | \n  263 |         self.objects\n  264 |             .write_buf_with_known_id(kind, buf, oid)\n  265 |             .map(|oid| oid.attach(self))\n  266 |             .map_err(Into::into)\n  267 |     }\n  268 | \n  269 |     /// Write a blob from the given `bytes`.\n  270 |     ///\n  271 |     /// We avoid writing duplicate objects to slow disks that will eventually have to be garbage collected by\n  272 |     /// pre-hashing the data, and checking if the object is already present.\n  273 |     ///\n  274 |     /// # Examples\n  275 |     ///\n  276 |     /// ```\n  277 |     /// # fn main() -> Result<(), Box<dyn std::error::Error + Send + Sync>> {\n  278 |     /// # mod doctest { include!(concat!(env!(\"CARGO_MANIFEST_DIR\"), \"/tests/doctest.rs\")); }\n  279 |     /// # let dir = doctest::tempdir()?;\n  280 |     /// let repo = gix::init_bare(dir.path())?;\n  281 |     /// let blob_id = repo.write_blob(b\"hello world\")?;\n  282 |     ///\n  283 |     /// assert_eq!(repo.find_blob(blob_id)?.data, b\"hello world\");\n  284 |     /// # Ok(()) }\n  285 |     /// ```\n  286 |     pub fn write_blob(&self, bytes: impl AsRef<[u8]>) -> Result<Id<'_>, object::write::Error> {\n  287 |         let bytes = bytes.as_ref();\n  288 |         let oid = gix_object::compute_hash(self.object_hash(), gix_object::Kind::Blob, bytes)\n  289 |             .map_err(|err| Box::new(err) as Box<dyn std::error::Error + Send + Sync>)?;\n  290 |         if self.objects.exists(&oid) {\n  291 |             return Ok(oid.attach(self));\n  292 |         }\n  293 |         self.objects\n  294 |             .write_buf_with_known_id(gix_object::Kind::Blob, bytes, oid)\n  295 |             .map_err(Into::into)\n  296 |             .map(|oid| oid.attach(self))\n  297 |     }\n  298 | \n  299 |     /// Write a blob from the given `Read` implementation.\n  300 |     ///\n  301 |     /// Note that we hash the object in memory to avoid storing objects that are already present. That way,\n  302 |     /// we avoid writing duplicate objects using slow disks that will eventually have to be garbage collected.\n  303 |     ///\n  304 |     /// If that is prohibitive, use the object database directly.\n  305 |     pub fn write_blob_stream(&self, mut bytes: impl std::io::Read) -> Result<Id<'_>, object::write::Error> {\n  306 |         let mut buf = self.empty_reusable_buffer();\n  307 |         std::io::copy(&mut bytes, buf.deref_mut())\n  308 |             .map_err(|err| Box::new(err) as Box<dyn std::error::Error + Send + Sync>)?;\n  309 | \n  310 |         self.write_blob_stream_inner(&buf)\n  311 |     }\n  312 | \n  313 |     fn write_blob_stream_inner(&self, buf: &[u8]) -> Result<Id<'_>, object::write::Error> {\n  314 |         let oid = gix_object::compute_hash(self.object_hash(), gix_object::Kind::Blob, buf)\n  315 |             .map_err(|err| Box::new(err) as Box<dyn std::error::Erro {"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"`pack_or_pack_index` mixes extension dispatch, pack/index/multi-index verification, and three distinct\nstatistics-output formats in one ~125-line function. The multi-index arm prints stats and returns\ninline (early `return Ok(())`), while the other arms fall through to a shared stats block at the bottom\n- asymmetric control flow that is easy to misread and a maintenance hazard.","fix":"Extract per-extension handlers (verify_pack/verify_idx/verify_multi_index) plus a single stats-printing helper to unify output handling.","locations":[{"ref":"gitoxide-core/src/pack/verify.rs:87-211","code":"   87 | pub fn pack_or_pack_index<W1, W2>(\n   88 |     path: impl AsRef<Path>,\n   89 |     mut progress: impl NestedProgress + 'static,\n   90 |     Context {\n   91 |         mut out,\n   92 |         mut err,\n   93 |         mode,\n   94 |         output_statistics,\n   95 |         thread_limit,\n   96 |         algorithm,\n   97 |         should_interrupt,\n   98 |         object_hash,\n   99 |     }: Context<'_, W1, W2>,\n  100 | ) -> Result<()>\n  101 | where\n  102 |     W1: io::Write,\n  103 |     W2: io::Write,\n  104 | {\n  105 |     let path = path.as_ref();\n  106 |     let ext = path.extension().and_then(OsStr::to_str).unwrap_or(\"\");\n  107 |     const CACHE_SIZE: usize = 64;\n  108 |     let cache = || -> EitherCache<CACHE_SIZE> {\n  109 |         if matches!(algorithm, Algorithm::LessMemory) {\n  110 |             if output_statistics.is_some() {\n  111 |                 // turn off acceleration as we need to see entire chains all the time\n  112 |                 EitherCache::Left(pack::cache::Never)\n  113 |             } else {\n  114 |                 EitherCache::Right(pack::cache::lru::StaticLinkedList::<CACHE_SIZE>::default())\n  115 |             }\n  116 |         } else {\n  117 |             EitherCache::Left(pack::cache::Never)\n  118 |         }\n  119 |     };\n  120 |     let res = match ext {\n  121 |         \"pack\" => {\n  122 |             let pack = odb::pack::data::File::at(path, object_hash).with_context(|| \"Could not open pack file\")?;\n  123 |             pack.verify_checksum(&mut progress.add_child(\"Sha1 of pack\"), should_interrupt)\n  124 |                 .map(|id| (id, None))?\n  125 |         }\n  126 |         \"idx\" => {\n  127 |             let idx =\n  128 |                 odb::pack::index::File::at(path, object_hash).with_context(|| \"Could not open pack index file\")?;\n  129 |             let packfile_path = path.with_extension(\"pack\");\n  130 |             let pack = odb::pack::data::File::at(&packfile_path, object_hash)\n  131 |                 .map_err(|e| {\n  132 |                     writeln!(\n  133 |                         err,\n  134 |                         \"Could not find matching pack file at '{}' - only index file will be verified, error was: {}\",\n  135 |                         packfile_path.display(),\n  136 |                         e\n  137 |                     )\n  138 |                     .ok();\n  139 |                     e\n  140 |                 })\n  141 |                 .ok();\n  142 | \n  143 |             idx.verify_integrity(\n  144 |                 pack.as_ref().map(|p| gix::odb::pack::index::verify::PackContext {\n  145 |                     data: p,\n  146 |                     options: gix::odb::pack::index::verify::integrity::Options {\n  147 |                         verify_mode: mode,\n  148 |                         traversal: algorithm.into(),\n  149 |                         make_pack_lookup_cache: cache,\n  150 |                         thread_limit,\n  151 |                     },\n  152 |                 }),\n  153 |                 &mut progress,\n  154 |                 should_interrupt,\n  155 |             )\n  156 |             .map(|o| (o.actual_index_checksum, o.pack_traverse_statistics))\n  157 |             .with_context(|| \"Verification failure\")?\n  158 |         }\n  159 |         \"\" => match path.file_name() {\n  160 |             Some(file_name) if file_name == \"multi-pack-index\" => {\n  161 |                 let multi_index = gix::odb::pack::multi_index::File::at(path, None)?;\n  162 |                 let res = multi_index.verify_integrity(\n  163 |                     &mut progress,\n  164 |                     should_interrupt,\n  165 |                     gix::odb::pack::index::verify::integrity::Options {\n  166 |                         verify_mode: mode,\n  167 |                         traversal: algorithm.into(),\n  168 |                         thread_limit,\n  169 |                         make_pack_lookup_cache: cache,\n  170 |                     },\n  171 |                 )?;\n  172 |                 match output_statistics {\n  173 |                     Some(OutputFormat::Human) => {\n  174 |                         for (index_name, stats) in multi_index.index_names().iter().zip(res.pack_traverse_statistics) {\n  175 |                             writeln!(out, \"{}\", index_name.display()).ok();\n  176 |                             drop(print_statistics(&mut out, &stats));\n  177 |                         }\n  178 |                     }\n  179 |                     #[cfg(feature = \"serde\")]\n  180 |                     Some(OutputFormat::Json) => serde_json::to_writer_pretty(\n  181 |                         out,\n  182 |                         &multi_index\n  183 |                             .index_names()\n  184 |                             .iter()\n  185 |                             .zip(res.pack_traverse_statistics)\n  186 |                             .collect::<Vec<_>>(),\n  187 |                     )?,\n  188 |                     _ => {}\n  189 |                 }\n  190 |                 return Ok(());\n  191 |             }\n  192 |             _ => {\n  193 |                 return Err(anyhow!(\n  194 | {"id":"ARCH_2","type":"architecture","type_label":"Architecture","severity":"negligible","difficulty":"medium","description":"`prepare_merge` reads the `merge` and `conflict-marker-size` attributes positionally via\n`attrs.next().expect(\"pre-initialized with 'merge'\")`, relying on the exact selection order configured far away in\n`Platform::new` (`[\"merge\", \"conflict-marker-size\"]`). Reordering or extending that selection array would either panic\nor silently read the wrong attribute. This is a brittle cross-module coupling enforced only by an `expect`.","fix":"Fetch attributes by name explicitly instead of by positional iteration order, or assert the names match.","locations":[{"ref":"gix-merge/src/blob/platform/prepare_merge.rs:54-56","code":"   54 |         let mut attrs = self.attrs.iter_selected();\n   55 |         let merge_attr = attrs.next().expect(\"pre-initialized with 'merge'\");\n   56 |         let marker_size_attr = attrs.next().expect(\"pre-initialized with 'conflict-marker-size'\");","lines":3,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-merge/src/blob/platform/prepare_merge.rs#L54-L56"},{"ref":"gix-merge/src/blob/platform/mod.rs:97-100","code":"   97 |             attrs: {\n   98 |                 let mut out = attributes::search::Outcome::default();\n   99 |                 out.initialize_with_selection(&Default::default(), [\"merge\", \"conflict-marker-size\"]);\n  100 |                 out","lines":4,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-merge/src/blob/platform/mod.rs#L97-L100"}]},
{"id":"OTHER_1","type":"other","type_label":"Other","severity":"low","difficulty":"medium","description":"TOCTOU window in ignore push_directory for Source::WorktreeThenIdMappingIfNotSkipped: when the .gitignore file is not\npresent in the index (`ignore_file_in_index.is_err()`), `follow_symlinks` is set to true and the worktree .gitignore\nis read while following symlinks (ignore.rs:199-207). This means a .gitignore that is a symlink (or whose parent\ncomponent is swapped to a symlink between the symlink-check stack pass and this read) can cause reading attacker-\ncontrolled content outside the worktree. The SymlinkCheck stack in gix-status guards lstat paths, but this read in\ngix-worktree's ignore loading is a separate file open that opts into following symlinks. Git has similar behavior, so\nthis may be intentional, but it is worth flagging as a data-integrity/exfiltration consideration.","fix":"Consider reading worktree .gitignore with no-follow semantics (as is done for .gitattributes at attributes.rs:100\nwhere `no_follow_symlinks = false` is actually 'do not follow' per the variable's negated naming) and documenting the\nchosen policy explicitly, or verify the directory path is symlink-free before opening.","locations":[{"ref":"gix-worktree/src/stack/state/ignore.rs:198-207","code":"  198 |             Source::WorktreeThenIdMappingIfNotSkipped => {\n  199 |                 let follow_symlinks = ignore_file_in_index.is_err();\n  200 |                 let added = gix_glob::search::add_patterns_file(\n  201 |                     &mut self.stack.patterns,\n  202 |                     dir.join(\".gitignore\"),\n  203 |                     follow_symlinks,\n  204 |                     Some(root),\n  205 |                     buf,\n  206 |                     self.parse,\n  207 |                 )?;","lines":10,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-worktree/src/stack/state/ignore.rs#L198-L207"}]},
