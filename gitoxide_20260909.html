{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`is::bare()` reports a directory as bare unless it contains an `index` file or\nis named `.git`. A freshly `git init`ed non-bare worktree before any add/commit\nhas no `index` and (when probed as the git_dir itself rather than `.git`) will\nbe misclassified as bare. The doc comment notes \"repositories without an index\ngenerally look bare\", acknowledging the heuristic is unreliable; the final\nclassification in `git_with_metadata` partly compensates, but `bare()` is also\npublic and used directly elsewhere, propagating the ambiguity.","fix":"Document clearly that this is a best-effort heuristic that can yield false\npositives for uninitialized worktrees, and prefer config-based bareness\ndetection (core.bare) where available, as git does.","locations":[{"ref":"gix-discover/src/is.rs:9-11","code":"    9 | pub fn bare(git_dir_candidate: &Path) -> bool {\n   10 |     !(git_dir_candidate.join(\"index\").exists() || (git_dir_candidate.file_name() == Some(OsStr::new(DOT_GIT_DIR))))\n   11 | }","lines":3,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-discover/src/is.rs#L9-L11"}]},
{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"The Interrupted branch in the create retry loop does `self.retries.on_interrupt -= 1;` then `if self.retries.on_interrupt <= 1 { return self.permanent_failure(...) }`. The `<= 1` (instead of `< 1`/`== 0` used by the two sibling branches) gives up one retry early: with the default `on_interrupt: 10` only ~8 actual retries happen, contradicting the documented retry count and the sibling branches' behavior.","fix":"Change `<= 1` to `< 1` to match the other branches and the documented retry count.","locations":[{"ref":"gix-fs/src/dir/create.rs:180-184","code":"  180 |                     Interrupted => {\n  181 |                         self.retries.on_interrupt -= 1;\n  182 |                         if self.retries.on_interrupt <= 1 {\n  183 |                             return self.permanent_failure(dir, Interrupted);\n  184 |                         }","lines":5,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-fs/src/dir/create.rs#L180-L184"}]},
{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`recent_snapshot` uses double-checked locking, but in the `(Some(snapshot), Some(modified_time))` arm, after acquiring the write lock it re-reads `current_modification_time()` and reloads without re-comparing against the existing snapshot's `modified`. If another thread already reloaded to a newer mtime between read-lock release and write-lock acquire, this thread reloads again (redundant `open()`), and can overwrite a fresher snapshot with one stamped at a possibly older time. The `(None, Some)` arm does the correct re-check.","fix":"After acquiring the write lock, re-check `snapshot.modified < modified_time` before reopening.","locations":[{"ref":"gix-fs/src/snapshot.rs:124-138","code":"  124 |             (Some(snapshot), Some(modified_time)) => {\n  125 |                 if snapshot.modified < modified_time {\n  126 |                     drop(state);\n  127 |                     let mut state = get_mut(self);\n  128 | \n  129 |                     if let (Some(_snapshot), Some(modified_time)) = (&*state, current_modification_time()) {\n  130 |                         *state = open()?.map(|value| {\n  131 |                             OwnShared::new(FileSnapshot {\n  132 |                                 value,\n  133 |                                 modified: modified_time,\n  134 |                             })\n  135 |                         });\n  136 |                     }\n  137 | \n  138 |                     (*state).clone()","lines":15,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-fs/src/snapshot.rs#L124-L138"}]},
{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`ToNormalPathComponents for &str`/`&[u8]` does `let component = component.components().next()?;` inside a `filter_map`, so a path segment that produces no component is silently dropped rather than raising an error. This can turn an input like `a/<weird>/b` into `a/b` - a path-confusion concern in stack traversal. Only intentional empty segments (already handled earlier) should be dropped.","fix":"Raise a `NotANormalComponent`-style error when `components().next()` is None instead of silently skipping.","locations":[{"ref":"gix-fs/src/stack.rs:89-93","code":"   89 |     let component = component.components().next()?;\n   90 |     Some(component_to_os_str(\n   91 |         component,\n   92 |         gix_path::try_from_byte_slice(path.as_ref()).ok()?,\n   93 |     ))","lines":5,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-fs/src/stack.rs#L89-L93"}]},
{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In the histogram LCS search, the final loop that advances `occurrences_iter` past the occurrences contained in\nthe just-matched run compares a *before*-sequence index against an *after*-sequence index:\n`next_token_idx` is yielded from `histogram.token_occurrences(token)` (positions in `before`/file1), while\n`end2` is an index into `after`/file2. The matched run spans `start1..end1` in `before`, so the guard should be\nexpressed in terms of `end1` (a before-index). Because `end1` and `end2` are not generally equal (they share a\nlength but have different bases), this can skip too few or too many candidate occurrences, leading to a\nsub-optimal LCS choice. This is vendored algorithm code and the effect is on diff quality rather than safety, so\nconfidence is moderate.","fix":"Verify against upstream imara-diff: the candidate-skipping guard should compare the next occurrence (a before\nindex) against `end1` rather than `end2`.","locations":[{"ref":"gix-imara-diff/src/histogram/lcs.rs:95-134","code":"   95 |             let mut end1 = token_idx1 + 1;\n   96 |             let mut end2 = after_pos + 1;\n   97 |             loop {\n   98 |                 let token1 = before.get(end1 as usize);\n   99 |                 let token2 = after.get(end2 as usize);\n  100 |                 if matches!((token1, token2), (Some(token1), Some(token2)) if token1 == token2) {\n  101 |                     let new_occurrences = histogram.num_token_occurrences(before[end1 as usize]);\n  102 |                     occurrences = occurrences.min(new_occurrences);\n  103 |                     end1 += 1;\n  104 |                     end2 += 1;\n  105 |                 } else {\n  106 |                     break;\n  107 |                 }\n  108 |             }\n  109 | \n  110 |             if next_token_idx2 < end2 {\n  111 |                 next_token_idx2 = end2;\n  112 |             }\n  113 | \n  114 |             let len = end2 - start2;\n  115 |             debug_assert_eq!(len, end1 - start1);\n  116 |             if self.lcs.len < len || self.min_occurrences > occurrences {\n  117 |                 self.min_occurrences = occurrences;\n  118 |                 self.lcs = Lcs {\n  119 |                     before_start: start1,\n  120 |                     after_start: start2,\n  121 |                     len,\n  122 |                 };\n  123 |             }\n  124 | \n  125 |             loop {\n  126 |                 if let Some(next_token_idx) = occurrences_iter.next() {\n  127 |                     if next_token_idx > end2 {\n  128 |                         token_idx1 = next_token_idx;\n  129 |                         break;\n  130 |                     }\n  131 |                 } else {\n  132 |                     break 'occurrences_iter;\n  133 |                 }\n  134 |             }","lines":40,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-imara-diff/src/histogram/lcs.rs#L95-L134"}]},
{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`Vec::with_capacity(entry_size)` reserves `entry_size` (the constant 8) slots, but the loop\npushes `num_offsets` elements. The intent was clearly `Vec::with_capacity(num_offsets)`.\n`num_offsets` is already validated (`data.len() % entry_size == 0`, non-zero) and is bounded\nby `data.len()/8`, so using it directly is safe. As written the Vec reallocates repeatedly\nfor any index with more than 8 offset chunks.","fix":"Use `Vec::with_capacity(num_offsets)`.","locations":[{"ref":"gix-index/src/extension/index_entry_offset_table.rs:24","code":"   24 |     let mut out = Vec::with_capacity(entry_size);","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-index/src/extension/index_entry_offset_table.rs#L24"}]},
{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`Snapshot::merge` and `try_resolve_ref` rely on `binary_search_by` over `entries_by_old_email` ordered by `EncodedString::cmp_ref`. That comparator is not a consistent total order across encodings: two UTF-8 strings are compared with ASCII case-folding, but as soon as either side is the `Unknown` (non-UTF-8) variant, comparison is done byte-wise with no case folding. Mixing UTF-8 and non-UTF-8 old-emails can therefore violate the sortedness invariant binary search requires, leading to missed merges (duplicate entries) or failed lookups. Practically rare since emails are usually ASCII, but it is a latent correctness bug.","fix":"Define `cmp_ref` as a single consistent ordering (e.g. always compare ASCII-case-folded bytes regardless of UTF-8 validity) so the binary-search ordering is total and stable.","locations":[{"ref":"gix-mailmap/src/snapshot/mod.rs:41-49","code":"   41 |             match self\n   42 |                 .entries_by_old_email\n   43 |                 .binary_search_by(|e| e.old_email.cmp_ref(old_email))\n   44 |             {\n   45 |                 Ok(pos) => self.entries_by_old_email[pos].merge(entry),\n   46 |                 Err(insert_pos) => {\n   47 |                     self.entries_by_old_email.insert(insert_pos, entry.into());\n   48 |                 }\n   49 |             }","lines":9,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-mailmap/src/snapshot/mod.rs#L41-L49"},{"ref":"gix-mailmap/src/snapshot/util.rs:18-29","code":"   18 |     pub fn cmp_ref(&self, other: EncodedStringRef<'_>) -> Ordering {\n   19 |         match (self, other) {\n   20 |             (EncodedString::Utf8(a), EncodedStringRef::Utf8(b)) => {\n   21 |                 let a = a.chars().map(|c| c.to_ascii_lowercase());\n   22 |                 let b = b.chars().map(|c| c.to_ascii_lowercase());\n   23 |                 a.cmp(b)\n   24 |             }\n   25 |             (EncodedString::Unknown(a), EncodedStringRef::Unknown(b)) => a.deref().as_bstr().cmp(b),\n   26 |             (EncodedString::Utf8(a), EncodedStringRef::Unknown(b)) => a.as_bytes().cmp(b.as_ref()),\n   27 |             (EncodedString::Unknown(a), EncodedStringRef::Utf8(b)) => a.deref().as_bytes().cmp(b.as_bytes()),\n   28 |         }\n   29 |     }","lines":12,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-mailmap/src/snapshot/util.rs#L18-L29"}]},
{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`add_to_queue` in the skipping algorithm inserts into the queue and increments `non_common_revs`\nwhenever `get_or_insert_commit` returns Some, with no SEEN check. The closure unconditionally sets\n`mark | SEEN` (line 23-25). But `add_to_queue` is also called from `push_parent` (line 93) for a\nparent that the surrounding code already verified is not SEEN, and from `known_common`/`add_tip`\nwhich guard on SEEN. Because the closure runs even for an already-present (already-SEEN) commit when\ncalled directly, calling `add_to_queue` twice for the same id (e.g. if a commit is both a tip and a\nknown_common in different rounds) double-counts `non_common_revs` and double-inserts into the queue,\nsince there is no `was_already_seen` short-circuit inside `add_to_queue` itself (unlike the\nconsecutive version which checks `has_mark`).","fix":"Mirror the consecutive algorithm: detect whether SEEN was already set inside the closure and skip the queue insertion / counter increment if so.","locations":[{"ref":"gix-negotiate/src/skipping.rs:20-33","code":"   20 | impl Algorithm {\n   21 |     /// Add `id` to our priority queue and *add* `flags` to it.\n   22 |     fn add_to_queue(&mut self, id: ObjectId, mark: Flags, graph: &mut crate::Graph<'_, '_>) -> Result<(), Error> {\n   23 |         let commit = graph.get_or_insert_commit(id, |entry| {\n   24 |             entry.flags |= mark | Flags::SEEN;\n   25 |         })?;\n   26 |         if let Some(timestamp) = commit.map(|c| c.commit_time) {\n   27 |             self.revs.insert(timestamp, id);\n   28 |             if !mark.contains(Flags::COMMON) {\n   29 |                 self.non_common_revs += 1;\n   30 |             }\n   31 |         }\n   32 |         Ok(())\n   33 |     }","lines":14,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-negotiate/src/skipping.rs#L20-L33"},{"ref":"gix-negotiate/src/consecutive.rs:20-39","code":"   20 | impl Algorithm {\n   21 |     /// Add `id` to our priority queue and *add* `flags` to it.\n   22 |     fn add_to_queue(&mut self, id: ObjectId, mark: Flags, graph: &mut crate::Graph<'_, '_>) -> Result<(), Error> {\n   23 |         let mut is_common = false;\n   24 |         let mut has_mark = false;\n   25 |         if let Some(commit) = graph\n   26 |             .get_or_insert_commit(id, |data| {\n   27 |                 has_mark = data.flags.intersects(mark);\n   28 |                 data.flags |= mark;\n   29 |                 is_common = data.flags.contains(Flags::COMMON);\n   30 |             })?\n   31 |             .filter(|_| !has_mark)\n   32 |         {\n   33 |             self.revs.insert(commit.commit_time, id);\n   34 |             if !is_common {\n   35 |                 self.non_common_revs += 1;\n   36 |             }\n   37 |         }\n   38 |         Ok(())\n   39 |     }","lines":20,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-negotiate/src/consecutive.rs#L20-L39"}]},
{"id":"LOGIC_33","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`EntryMode::extract_from_bytes` slow path (when the space delimiter is not at index 6) does not handle the case where no space byte is found at all. If the loop walks the whole input without encountering a space (e.g. malformed mode bytes that are pure octal and shorter than the input, with no following space), `space_pos` keeps its initial value of `0`. The function then returns `&i[(space_pos + 1)..]` == `&i[1..]`, i.e. it silently treats index 0 as the delimiter and returns a bogus remainder slice plus a mode parsed from the entire input. A correct parser should fail (return `None`) when no delimiter exists. In practice tree parsing always has a trailing space before the filename so this is only reachable with already-malformed data, but the parser is documented as the place that detects malformed modes.","fix":"Track whether a space was actually found in the slow path and return `None` if the loop completes without finding one, e.g. use `Option<usize>` for `space_pos` and `?` it before computing the remainder slice.","locations":[{"ref":"gix-object/src/tree/mod.rs:141-173","code":"  141 |         else {\n  142 |             let mut idx = 0;\n  143 |             let mut space_pos = 0;\n  144 | \n  145 |             // const fn, this is why we can't have nice things (like `.iter().any()`).\n  146 |             while idx < i.len() {\n  147 |                 let b = i[idx].wrapping_sub(b'0') as u16;\n  148 |                 // Delimiter, return what we got\n  149 |                 if b == b' '.wrapping_sub(b'0') as u16 {\n  150 |                     space_pos = idx;\n  151 |                     break;\n  152 |                 }\n  153 |                 // Not a pure octal input.\n  154 |                 // Performance matters here, so `!(b'0'..=b'7').contains(&b)` won't do.\n  155 |                 if b > 7 {\n  156 |                     return None;\n  157 |                 }\n  158 |                 // More than 6 octal digits we must have hit the delimiter or the input was malformed.\n  159 |                 if idx > 6 {\n  160 |                     return None;\n  161 |                 }\n  162 |                 mode = (mode << 3) + b;\n  163 |                 idx += 1;\n  164 |             }\n  165 | \n  166 |             space_pos\n  167 |         };\n  168 | \n  169 |         // Hack: `0o140000` represents `\"040000\"`, `0o40000` represents `\"40000\"`.\n  170 |         if mode == 0o040000 && i[0] == b'0' {\n  171 |             mode += 0o100000;\n  172 |         }\n  173 |         Some((Self { internal: mode }, &i[(space_pos + 1)..]))","lines":33,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-object/src/tree/mod.rs#L141-L173"}]},
{"id":"LOGIC_34","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`OnDiskFile::load_strict` treats a previously-`Missing` file as reloadable (it matches `Unloaded | Missing`\nand attempts the load again), but on failure it stores the original `err` without distinguishing the\nnot-found case, whereas the sibling `load_with_recovery` carefully maps `NotFound` to `Ok(None)` and only\npropagates other errors. The asymmetry means `load_strict` reports a hard error for a file that merely went\nmissing, while `load_with_recovery` treats the same situation as recoverable. The strict variant is used by\n`load_index`, so a pack index that disappeared between directory scan and load surfaces as a fatal error\ninstead of triggering a clean reload, even though the surrounding machinery is designed to tolerate\ndisappearing files.","fix":"Consider whether `load_strict` should also special-case `ErrorKind::NotFound` (or document why strict callers must treat a vanished index as fatal); align behavior with `load_with_recovery` where a clean reload is expected.","locations":[{"ref":"gix-odb/src/store_impls/dynamic/types.rs:168-184","code":"  168 |     pub(crate) fn load_strict(&mut self, load: impl FnOnce(&Path) -> std::io::Result<T>) -> std::io::Result<()> {\n  169 |         use OnDiskFileState::*;\n  170 |         match self.state {\n  171 |             Unloaded | Missing => match load(&self.path) {\n  172 |                 Ok(v) => {\n  173 |                     self.state = Loaded(v);\n  174 |                     Ok(())\n  175 |                 }\n  176 |                 Err(err) => {\n  177 |                     // TODO: Should be provide more information? We don't even know what exactly failed right now, degenerating information.\n  178 |                     self.state = Missing;\n  179 |                     Err(err)\n  180 |                 }\n  181 |             },\n  182 |             Loaded(_) | Garbage(_) => Ok(()),\n  183 |         }\n  184 |     }","lines":17,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-odb/src/store_impls/dynamic/types.rs#L168-L184"}]},
{"id":"LOGIC_35","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In the static LRU cache `put`, memory bookkeeping tracks `Vec::capacity()` (see `mem_used += v.capacity()`), but when freeing the free-list it subtracts `free_list_cap = self.last_evicted.len()` instead of its capacity. Since `len() <= capacity()`, `mem_used` is under-decremented, so the tracked memory usage drifts upward over time and the cache can evict/clear more aggressively than the configured limit requires. Not a safety issue (no underflow), but it degrades cache effectiveness.","fix":"Use `self.last_evicted.capacity()` for `free_list_cap` so the accounting matches how memory is added.","locations":[{"ref":"gix-pack/src/cache/lru.rs:142-150","code":"  142 |                 let free_list_cap = self.last_evicted.len();\n  143 |                 self.last_evicted = Vec::new();\n  144 |                 // still not enough? clear everything\n  145 |                 if data.len() > mem_free + free_list_cap {\n  146 |                     self.inner.clear();\n  147 |                     self.mem_used = 0;\n  148 |                 } else {\n  149 |                     self.mem_used -= free_list_cap;\n  150 |                 }","lines":9,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-pack/src/cache/lru.rs#L142-L150"}]},
{"id":"LOGIC_36","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`realpath_opts` increments and checks the `MAX_SYMLINK_CHECKS = 2048` guard (`symlink_checks += 1`) only inside the `Component::Normal` arm. A crafted symlink chain whose expansions consist mostly of `ParentDir`/`CurDir`/`RootDir` components (which re-enter the loop via `link_destination.extend(components)`) advances the loop without incrementing `symlink_checks`. The actual `read_link` count is still bounded by `max_symlinks`, but the component-iteration bound that `ExcessiveComponentCount` claims to enforce (\"takes too long\") does not actually bound total iterations.","fix":"Increment and check `symlink_checks` once per loop iteration for every component, not only `Normal`.","locations":[{"ref":"gix-path/src/realpath.rs:62-63","code":"   62 |         const MAX_SYMLINK_CHECKS: usize = 2048;\n   63 |         let mut symlink_checks = 0;","lines":2,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-path/src/realpath.rs#L62-L63"},{"ref":"gix-path/src/realpath.rs:73-95","code":"   73 |                 Normal(part) => {\n   74 |                     real_path.push(part);\n   75 |                     symlink_checks += 1;\n   76 |                     if real_path.is_symlink() {\n   77 |                         num_symlinks += 1;\n   78 |                         if num_symlinks > max_symlinks {\n   79 |                             return Err(Error::MaxSymlinksExceeded { max_symlinks });\n   80 |                         }\n   81 |                         let mut link_destination = std::fs::read_link(real_path.as_path()).map_err(Error::ReadLink)?;\n   82 |                         if link_destination.is_absolute() {\n   83 |                             // pushing absolute path to real_path resets it to the pushed absolute path\n   84 |                         } else {\n   85 |                             assert!(real_path.pop(), \"we just pushed a component\");\n   86 |                         }\n   87 |                         link_destination.extend(components);\n   88 |                         path_backing = link_destination;\n   89 |                         components = path_backing.components();\n   90 |                     }\n   91 |                     if symlink_checks > MAX_SYMLINK_CHECKS {\n   92 |                         return Err(Error::ExcessiveComponentCount {\n   93 |                             max_symlink_checks: MAX_SYMLINK_CHECKS,\n   94 |                         });\n   95 |                     }","lines":23,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-path/src/realpath.rs#L73-L95"}]},
{"id":"LOGIC_37","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`is_absolute` checks `path.to_str().and_then(|s| s.chars().next()) == Some('/')`. On a non-UTF-8 byte path that conceptually starts with `/` (e.g. `/\\xff`), `to_str()` returns None and the slash clause is skipped. The intent (\"always true if it starts with a slash\") is not robust for non-UTF-8 input, which the crate explicitly supports.","fix":"Inspect the first raw byte via `into_bstr`/`OsStrExt::as_bytes` for `b'/'` rather than going through `to_str()`.","locations":[{"ref":"gix-path/src/util.rs:5-8","code":"    5 | pub fn is_absolute(path: impl AsRef<Path>) -> bool {\n    6 |     let path = path.as_ref();\n    7 |     path.is_absolute() || path.to_str().and_then(|s| s.chars().next()) == Some('/')\n    8 | }","lines":4,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-path/src/util.rs#L5-L8"}]},
{"id":"LOGIC_38","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"V1 capability validation uses `feature.starts_with(c.name())`, i.e. it accepts a client feature if the\nfeature string *starts with* a server capability name. This prefix match is too loose: a feature like\n`side-band-64k` would be considered valid by a server that only advertises `side-band`, and any feature\nsharing a prefix with an advertised capability passes. The check should compare the feature's *name\nportion* (before any `=value`) for equality against advertised capability names, not test string\nprefixes. This weakens the validation that is meant to prevent sending unsupported features that can\nmake a server terminate the connection.","fix":"Compare the feature name (split off the `=value` part) for equality against each advertised capability\nname, mirroring the V2 branch (`allowed.iter().any(|allowed| feature == allowed)`), instead of\n`feature.starts_with(c.name())`.","locations":[{"ref":"gix-protocol/src/command.rs:191-204","code":"  191 |                 gix_transport::Protocol::V0 | gix_transport::Protocol::V1 => {\n  192 |                     for (feature, _) in features {\n  193 |                         if server\n  194 |                             .iter()\n  195 |                             .any(|c| feature.starts_with(c.name().to_str_lossy().as_ref()))\n  196 |                         {\n  197 |                             continue;\n  198 |                         }\n  199 |                         return Err(Error::UnsupportedCapability {\n  200 |                             command: self.as_str(),\n  201 |                             feature: feature.to_string(),\n  202 |                         });\n  203 |                     }\n  204 |                 }","lines":14,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-protocol/src/command.rs#L191-L204"}]},
{"id":"LOGIC_39","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `from_capabilities`, a symref value of the form `NAME:` (colon as the last byte) passes the\n`right.is_empty()` guard because `right` is the slice starting at the colon (`\":\"`, non-empty). The code\nthen takes `&right[1..]`, which is an empty target, producing `SymbolicForLookup { target: Some(\"\") }`\ninstead of treating it as malformed or `None`. An empty symref target is not a valid ref name and\nshould be rejected or normalized.","fix":"After stripping the leading colon, reject an empty target (or map it like `(null)` to `None`):\ncheck `right[1..].is_empty()` and return `Error::MalformedSymref` (or `target: None`).","locations":[{"ref":"gix-protocol/src/handshake/refs/shared.rs:106-122","code":"  106 |     for symref in symref_values {\n  107 |         let (left, right) = symref.split_at(symref.find_byte(b':').ok_or_else(|| Error::MalformedSymref {\n  108 |             symref: symref.to_owned(),\n  109 |         })?);\n  110 |         if left.is_empty() || right.is_empty() {\n  111 |             return Err(Error::MalformedSymref {\n  112 |                 symref: symref.to_owned(),\n  113 |             });\n  114 |         }\n  115 |         out_refs.push(InternalRef::SymbolicForLookup {\n  116 |             path: left.into(),\n  117 |             target: match &right[1..] {\n  118 |                 b\"(null)\" => None,\n  119 |                 name => Some(name.into()),\n  120 |             },\n  121 |         });\n  122 |     }","lines":17,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-protocol/src/handshake/refs/shared.rs#L106-L122"}]},
{"id":"LOGIC_40","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`parse_number` parses a non-negative decimal field (used for `step`/`max`/percentage, all of type\n`usize`/`u32`) but converts via `gix_utils::btoi::to_signed`. `to_signed` targets a signed\nrepresentation, so any digit run whose value exceeds `isize::MAX` is rejected and the field is dropped\neven though it fits in `usize`. `to_unsigned` exists and is the correct choice for these unsigned\nprogress counters. Practical impact is small (servers rarely report counts above `isize::MAX`) but it\nis semantically wrong for the documented unsigned fields.","fix":"Use `gix_utils::btoi::to_unsigned(number).ok()` instead of `to_signed`.","locations":[{"ref":"gix-protocol/src/remote_progress.rs:71-79","code":"   71 | fn parse_number(i: &mut &[u8]) -> Option<usize> {\n   72 |     let len = i.iter().take_while(|b| b.is_ascii_digit()).count();\n   73 |     if len == 0 {\n   74 |         return None;\n   75 |     }\n   76 |     let (number, rest) = i.split_at(len);\n   77 |     *i = rest;\n   78 |     gix_utils::btoi::to_signed(number).ok()\n   79 | }","lines":9,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-protocol/src/remote_progress.rs#L71-L79"}]},
{"id":"LOGIC_41","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`single` claims in its doc to escape `!` as `'\\!'`, and the lib.rs example asserts `\"'hello it'\\''s git'\\!''\"`. For `!` it emits `'\\!'` (close-quote, backslash, bang). Inside single quotes a backslash is literal in POSIX sh, so this is specifically a workaround for interactive bash history expansion, not general Bourne-shell quoting; in a plain POSIX sh the produced `\\!` is two literal characters. This is git-compatible behavior but the doc framing (\"suitable for use as an argument for Bourne shells\") is misleading for the `!` case, and the escaping differs from the standard single-quote rule applied to `'`.","fix":"Clarify in the doc that `!` escaping targets bash history expansion (matching git's `sq_quote_buf`), not POSIX sh, so callers understand the non-standard handling.","locations":[{"ref":"gix-quote/src/single.rs:3-22","code":"    3 | /// Transforms the given `value` to be suitable for use as an argument for Bourne shells by wrapping it into single quotes.\n    4 | ///\n    5 | /// Every single-quote `'` is escaped as `'\\''`, every exclamation mark `!` is escaped as `'\\!'`,\n    6 | /// and the entire string is enclosed in single quotes.\n    7 | pub fn single(mut value: &BStr) -> BString {\n    8 |     let mut quoted = BString::new(b\"'\".to_vec());\n    9 | \n   10 |     while let Some(pos) = value.find_byteset(b\"'!\") {\n   11 |         quoted.extend_from_slice(&value[..pos]);\n   12 |         quoted.push_str(br\"'\\\");\n   13 |         quoted.push(value[pos]);\n   14 |         quoted.push(b'\\'');\n   15 | \n   16 |         value = &value[pos + 1..];\n   17 |     }\n   18 | \n   19 |     quoted.extend_from_slice(value);\n   20 |     quoted.push(b'\\'');\n   21 |     quoted\n   22 | }","lines":20,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-quote/src/single.rs#L3-L22"}]},
{"id":"LOGIC_42","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`remove_redundant` updates `min_gen` from `sorted_commits[min_gen_pos].1.generation` as it advances\n`min_gen_pos`, but `min_gen` is read at line 113 (`commit_info.generation < min_gen`) to prune the\nwalk. When no commit-graph is available, `generation` is set to `GENERATION_NUMBER_INFINITY` for all\ncommits (see GenThenTime::from), so `min_gen` is always INFINITY and the `< min_gen` pruning never\nfires - the optimization silently degrades to a full walk. Worse, `min_gen` is assigned at line 109\nbut its prior value at line 59 is the smallest generation; the variable is only meaningful with a\ncommit-graph. This isn't a correctness bug but the pruning is dead/ineffective without a graph and the\nreliance on INFINITY as a sentinel is undocumented at the comparison site.","fix":"Document that generation-based pruning only applies with a commit-graph, and consider skipping the min_gen bookkeeping entirely when generations are INFINITY.","locations":[{"ref":"gix-revision/src/merge_base/function.rs:58-116","code":"   58 |     let mut min_gen_pos = 0;\n   59 |     let mut min_gen = sorted_commits[min_gen_pos].1.generation;\n   60 | \n   61 |     let mut walk_start = Vec::with_capacity(commits.len());\n   62 |     for (id, _) in commits {\n   63 |         let commit = graph.get_mut(id).expect(\"previously added\");\n   64 |         commit.data |= Flags::RESULT;\n   65 |         for parent_id in commit.parents.clone() {\n   66 |             graph\n   67 |                 .get_or_insert_full_commit(parent_id, |parent| {\n   68 |                     // prevent double-addition\n   69 |                     if !parent.data.contains(Flags::STALE) {\n   70 |                         parent.data |= Flags::STALE;\n   71 |                         walk_start.push((parent_id, GenThenTime::from(&*parent)));\n   72 |                     }\n   73 |                 })\n   74 |                 .map_err(|_| Simple(\"could not insert parent commit into graph\"))?;\n   75 |         }\n   76 |     }\n   77 |     walk_start.sort_by_key(|a| a.0);\n   78 |     // allow walking everything at first.\n   79 |     walk_start\n   80 |         .iter_mut()\n   81 |         .for_each(|(id, _)| graph.get_mut(id).expect(\"added previously\").data.remove(Flags::STALE));\n   82 |     let mut count_still_independent = commits.len();\n   83 | \n   84 |     let mut stack = Vec::new();\n   85 |     while let Some((commit_id, commit_info)) = walk_start.pop().filter(|_| count_still_independent > 1) {\n   86 |         stack.clear();\n   87 |         graph.get_mut(&commit_id).expect(\"added\").data |= Flags::STALE;\n   88 |         stack.push((commit_id, commit_info));\n   89 | \n   90 |         while let Some((commit_id, commit_info)) = stack.last().copied() {\n   91 |             let commit = graph.get_mut(&commit_id).expect(\"all commits have been added\");\n   92 |             let commit_parents = commit.parents.clone();\n   93 |             if commit.data.contains(Flags::RESULT) {\n   94 |                 commit.data.remove(Flags::RESULT);\n   95 |                 count_still_independent -= 1;\n   96 |                 if count_still_independent <= 1 {\n   97 |                     break;\n   98 |                 }\n   99 |                 if *commit_id == *sorted_commits[min_gen_pos].0 {\n  100 |                     while min_gen_pos < commits.len() - 1\n  101 |                         && graph\n  102 |                             .get(&sorted_commits[min_gen_pos].0)\n  103 |                             .expect(\"already added\")\n  104 |                             .data\n  105 |                             .contains(Flags::STALE)\n  106 |                     {\n  107 |                         min_gen_pos += 1;\n  108 |                     }\n  109 |                     min_gen = sorted_commits[min_gen_pos].1.generation;\n  110 |                 }\n  111 |             }\n  112 | \n  113 |             if commit_info.generation < min_gen {\n  114 |                 stack.pop();\n  115 |                 continue;\n  116 |             }","lines":59,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-revision/src/merge_base/function.rs#L58-L116"},{"ref":"gix-revision/src/merge_base/function.rs:213-219","code":"  213 | impl From<&graph::Commit<Flags>> for GenThenTime {\n  214 |     fn from(commit: &graph::Commit<Flags>) -> Self {\n  215 |         GenThenTime {\n  216 |             generation: commit.generation.unwrap_or(gix_commitgraph::GENERATION_NUMBER_INFINITY),\n  217 |             time: commit.commit_time,\n  218 |         }\n  219 |     }","lines":7,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-revision/src/merge_base/function.rs#L213-L219"}]},
{"id":"LOGIC_43","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`write()` appends `Update::Shallow(id)` to `shallow_commits` with `push` and never deduplicates. If the same commit id is added via an update while already present in the existing shallow set (or added twice), the id is written to the `shallow` file twice. Git treats the shallow file as a set; duplicate boundary entries are not expected and waste space / can confuse readers.","fix":"Deduplicate after sorting (e.g. `shallow_commits.sort(); shallow_commits.dedup();`) before writing.","locations":[{"ref":"gix-shallow/src/lib.rs:82-89","code":"   82 |             for update in updates {\n   83 |                 match update {\n   84 |                     Update::Shallow(id) => {\n   85 |                         shallow_commits.push(*id);\n   86 |                     }\n   87 |                     Update::Unshallow(id) => shallow_commits.retain(|oid| oid != id),\n   88 |                 }\n   89 |             }","lines":8,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-shallow/src/lib.rs#L82-L89"},{"ref":"gix-shallow/src/lib.rs:99-104","code":"   99 |             shallow_commits.sort();\n  100 |             let mut buf = Vec::<u8>::new();\n  101 |             for commit in shallow_commits {\n  102 |                 commit.write_hex_to(&mut buf).map_err(Error::Io)?;\n  103 |                 buf.push(b'\\n');\n  104 |             }","lines":6,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-shallow/src/lib.rs#L99-L104"}]},
{"id":"LOGIC_44","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In the non-`hp-hashmap` build, `cleanup_tempfiles()` (the NON-signal variant) routes through `Concurrent::for_each`, which uses `self.inner.try_lock()` and silently does nothing on contention. So a normal shutdown call to `cleanup_tempfiles()` can leave tempfiles behind purely due to transient lock contention with no retry, whereas the `hp-hashmap` variant uses blocking iteration. Behavior diverges between feature configs.","fix":"Give the non-signal cleanup a blocking `lock()` path so it is not subject to spurious `try_lock` failures.","locations":[{"ref":"gix-tempfile/src/lib.rs:103-112","code":"  103 |         pub fn for_each<F>(&self, cb: F)\n  104 |         where\n  105 |             Self: Sized,\n  106 |             F: FnMut(&mut V),\n  107 |         {\n  108 |             if let Some(mut guard) = self.inner.try_lock() {\n  109 |                 guard.values_mut().for_each(cb);\n  110 |             }\n  111 |         }\n  112 |     }","lines":10,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-tempfile/src/lib.rs#L103-L112"},{"ref":"gix-tempfile/src/registry.rs:51-65","code":"   51 | pub fn cleanup_tempfiles() {\n   52 |     let current_pid = std::process::id();\n   53 |     #[cfg(feature = \"hp-hashmap\")]\n   54 |     REGISTRY.iter_mut().for_each(|mut tf| {\n   55 |         if tf.as_ref().is_some_and(|tf| tf.owning_process_id == current_pid) {\n   56 |             tf.take();\n   57 |         }\n   58 |     });\n   59 |     #[cfg(not(feature = \"hp-hashmap\"))]\n   60 |     REGISTRY.for_each(|tf| {\n   61 |         if tf.as_ref().is_some_and(|tf| tf.owning_process_id == current_pid) {\n   62 |             tf.take();\n   63 |         }\n   64 |     });\n   65 | }","lines":15,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-tempfile/src/registry.rs#L51-L65"}]},
{"id":"LOGIC_45","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`ProxyAuthMethod::Negotiate` is mapped to `auth.digest_ie(true)` rather than `auth.gssnegotiate(true)`. `digest_ie` is the IE-flavored HTTP Digest workaround, not GSS-Negotiate. So configuring `http.proxyAuthMethod = negotiate` actually selects a Digest variant, not Negotiate authentication, contradicting the option's documented meaning (\"GSS negotiate authentication\").","fix":"Map `ProxyAuthMethod::Negotiate` to `auth.gssnegotiate(true)`.","locations":[{"ref":"gix-transport/src/client/blocking_io/http/curl/remote.rs:439-453","code":"  439 |                 let mut auth = Auth::new();\n  440 |                 match proxy_auth_method {\n  441 |                     ProxyAuthMethod::AnyAuth => auth\n  442 |                         .basic(true)\n  443 |                         .digest(true)\n  444 |                         .digest_ie(true)\n  445 |                         .gssnegotiate(true)\n  446 |                         .ntlm(true)\n  447 |                         .aws_sigv4(true),\n  448 |                     ProxyAuthMethod::Basic => auth.basic(true),\n  449 |                     ProxyAuthMethod::Digest => auth.digest(true),\n  450 |                     ProxyAuthMethod::Negotiate => auth.digest_ie(true),\n  451 |                     ProxyAuthMethod::Ntlm => auth.ntlm(true),\n  452 |                 };\n  453 |                 handle.proxy_auth(&auth)?;","lines":15,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-transport/src/client/blocking_io/http/curl/remote.rs#L439-L453"},{"ref":"gix-transport/src/client/blocking_io/http/mod.rs:66-69","code":"   66 |         /// Http digest authentication to prevent a password to be passed in clear text.\n   67 |         Digest,\n   68 |         /// GSS negotiate authentication.\n   69 |         Negotiate,","lines":4,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-transport/src/client/blocking_io/http/mod.rs#L66-L69"}]},
{"id":"LOGIC_46","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`check_content_type` (used to detect the 'smart' HTTP protocol) only matches the content type when `value.trim()` is exactly equal to `application/x-<service>-<kind>`. Real servers frequently append parameters such as `; charset=utf-8` to the Content-Type header. Such a response would be misclassified as 'dumb protocol not supported' and rejected, even though it is a valid smart-protocol response.","fix":"Compare only the media-type portion before any `;` parameter, e.g. `value.split(';').next().unwrap_or(value).trim().eq_ignore_ascii_case(&wanted_content_type)`.","locations":[{"ref":"gix-transport/src/client/blocking_io/http/mod.rs:289-304","code":"  289 |     fn check_content_type(service: Service, kind: &str, headers: <H as Http>::Headers) -> Result<(), client::Error> {\n  290 |         let wanted_content_type = format!(\"application/x-{}-{}\", service.as_str(), kind);\n  291 |         if !headers.lines().collect::<Result<Vec<_>, _>>()?.iter().any(|l| {\n  292 |             let mut tokens = l.split(':');\n  293 |             tokens.next().zip(tokens.next()).is_some_and(|(name, value)| {\n  294 |                 name.eq_ignore_ascii_case(\"content-type\") && value.trim() == wanted_content_type\n  295 |             })\n  296 |         }) {\n  297 |             return Err(client::Error::Http(Error::Detail {\n  298 |                 description: format!(\n  299 |                     \"Didn't find '{wanted_content_type}' header to indicate 'smart' protocol, and 'dumb' protocol is not supported.\"\n  300 |                 ),\n  301 |             }));\n  302 |         }\n  303 |         Ok(())\n  304 |     }","lines":16,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-transport/src/client/blocking_io/http/mod.rs#L289-L304"}]},
{"id":"LOGIC_47","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`add_basic_auth_if_present` decides whether to refuse sending Basic credentials by checking `self.url.starts_with(\"http://\")`. `self.url` is the original configured URL only; after a redirect has been recorded the effective request URL can differ (the redirect machinery rewrites the base via `redirected_base_url`). The plaintext-http guard is thus evaluated against the pre-redirect URL, not the URL the credentials will actually be sent to. The redirect validator forbids https->http downgrades, which mitigates the worst case, but the guard is nominally checking the wrong URL.","fix":"Evaluate the cleartext check against the effective (post-redirect) URL the request will actually target, or document that the https->http downgrade prohibition in `shares_authority_or_upgrades_scheme` is the real guarantee being relied on.","locations":[{"ref":"gix-transport/src/client/blocking_io/http/mod.rs:306-325","code":"  306 |     fn add_basic_auth_if_present(&self, headers: &mut Vec<Cow<'_, str>>) -> Result<(), client::Error> {\n  307 |         if let Some(gix_sec::identity::Account {\n  308 |             username,\n  309 |             password,\n  310 |             oauth_refresh_token: _,\n  311 |         }) = &self.identity\n  312 |         {\n  313 |             #[cfg(not(feature = \"http-client-insecure-credentials\"))]\n  314 |             if self.url.starts_with(\"http://\") {\n  315 |                 return Err(client::Error::AuthenticationRefused(\n  316 |                     \"Will not send credentials in clear text over http\",\n  317 |                 ));\n  318 |             }\n  319 |             headers.push(Cow::Owned(format!(\n  320 |                 \"Authorization: Basic {}\",\n  321 |                 base64::engine::general_purpose::STANDARD.encode(format!(\"{username}:{password}\"))\n  322 |             )));\n  323 |         }\n  324 |         Ok(())\n  325 |     }","lines":20,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-transport/src/client/blocking_io/http/mod.rs#L306-L325"}]},
{"id":"LOGIC_48","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`expand_path::parse` rebuilds the path with `iter.map(|s| s.as_bstr().to_str_lossy()).collect::<Vec<_>>().join(\"/\")`. `to_str_lossy()` replaces invalid UTF-8 with U+FFFD, corrupting non-UTF-8 path segments - even though the crate explicitly documents that file paths are not expected to be UTF-8.","fix":"Rebuild the path with byte operations (push `b'/'` and raw segments into a `BString`) instead of `to_str_lossy()`/`join`.","locations":[{"ref":"gix-url/src/expand_path.rs:62-67","code":"   62 |                         format!(\n   63 |                             \"/{}\",\n   64 |                             iter.map(|s| s.as_bstr().to_str_lossy()).collect::<Vec<_>>().join(\"/\")\n   65 |                         )\n   66 |                         .into(),\n   67 |                     )","lines":6,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-url/src/expand_path.rs#L62-L67"}]},
{"id":"LOGIC_49","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `name_inner` the trailing `.lock` check at the loop's last byte uses `input[component_end + 1..]` where `component_end` is only updated when a `/` is seen (line 137). For a name with no slash at all, `component_end` stays 0, so the check examines `input[1..]` rather than the whole final component `input[0..]`. It happens to still work for `.lock` suffix detection because `.lock` is shorter than typical names and `ends_with_str` only needs the suffix, but the index base is conceptually wrong: it skips the first byte of the only component. The intent (\"does the final component end with .lock\") would be clearer and correct with `input[component_end..]` when no slash was seen, or by tracking the start of the last component explicitly.","fix":"Track the start index of the current component explicitly (set it after each `/`, default 0) and use it for both the mid-string component check (line 139) and the final-component check (line 155), instead of reusing `component_end` and `component_end + 1`.","locations":[{"ref":"gix-validate/src/tag.rs:138-169","code":"  138 |             c => {\n  139 |                 if *c == b'/' {\n  140 |                     component_start = component_end;\n  141 |                     component_end = byte_pos;\n  142 | \n  143 |                     if input[component_start..component_end].ends_with_str(\".lock\") {\n  144 |                         if let Some(out) = out.as_mut() {\n  145 |                             while out.ends_with(b\".lock\") {\n  146 |                                 let len_without_suffix = out.len() - b\".lock\".len();\n  147 |                                 out.truncate(len_without_suffix);\n  148 |                             }\n  149 |                         } else {\n  150 |                             return Err(name::Error::LockFileSuffix);\n  151 |                         }\n  152 |                     }\n  153 |                 }\n  154 | \n  155 |                 if let Some(out) = out.as_mut() {\n  156 |                     out.push(*c);\n  157 |                 }\n  158 | \n  159 |                 if byte_pos == last && input[component_end + 1..].ends_with_str(\".lock\") {\n  160 |                     if let Some(out) = out.as_mut() {\n  161 |                         while out.ends_with(b\".lock\") {\n  162 |                             let len_without_suffix = out.len() - b\".lock\".len();\n  163 |                             out.truncate(len_without_suffix);\n  164 |                         }\n  165 |                     } else {\n  166 |                         return Err(name::Error::LockFileSuffix);\n  167 |                     }\n  168 |                 }\n  169 |             }","lines":32,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-validate/src/tag.rs#L138-L169"}]},
{"id":"LOGIC_50","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`Editor::set_root()` rebuilds the inner editor and repo from `root` via `Editor::new(root)`, but discards the\nfreshly-computed `validate` options (it keeps `self.validate`). If `root` belongs to a repository with different\n`core` protection settings than the original, subsequent writes will validate path components with stale options.","fix":"Also assign `self.validate = new_editor.validate;` in `set_root`.","locations":[{"ref":"gix/src/object/tree/editor.rs:212-217","code":"  212 |     pub fn set_root(&mut self, root: &crate::Tree<'repo>) -> Result<&mut Self, init::Error> {\n  213 |         let new_editor = super::Editor::new(root)?;\n  214 |         self.inner = new_editor.inner;\n  215 |         self.repo = new_editor.repo;\n  216 |         Ok(self)\n  217 |     }","lines":6,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix/src/object/tree/editor.rs#L212-L217"}]},
{"id":"LOGIC_51","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In the fast-forward check, the local object is converted with `try_into_commit().map_err(|_| ())` and on any\nfailure (e.g. the local ref points to a tag or non-commit object, or its committer time can't be parsed) the\ncode sets `force = true` and treats the update as a forced update rather than a non-fast-forward rejection.\nThis means a non-commit local target gets silently force-overwritten even without `+`/force in the refspec.\nWhile partially intended per the 'Deviation' docs, the `force = true` on the *error* branch (line 178) is\nbroader than 'force only applies to refs pointing to commits' and can mask genuinely unexpected ODB/parse errors\nas a forced update.","fix":"On a real find/parse error, propagate it (or reject) rather than collapsing it into `force = true`; only treat 'local is not a commit' as force.","locations":[{"ref":"gix/src/remote/connection/fetch/update_refs/mod.rs:163-188","code":"  163 |                                             let ancestors = repo\n  164 |                                                 .find_object(local_id)?\n  165 |                                                 .try_into_commit()\n  166 |                                                 .map_err(|_| ())\n  167 |                                                 .and_then(|c| c.committer().map(|a| a.seconds()).map_err(|_| ()))\n  168 |                                                 .and_then(|local_commit_time| {\n  169 |                                                     remote_id\n  170 |                                                         .to_owned()\n  171 |                                                         .ancestors(&repo.objects)\n  172 |                                                         .sorting(\n  173 |                                                             gix_traverse::commit::simple::Sorting::ByCommitTimeCutoff {\n  174 |                                                                 order: Default::default(),\n  175 |                                                                 seconds: local_commit_time,\n  176 |                                                             },\n  177 |                                                         )\n  178 |                                                         .map_err(|_| ())\n  179 |                                                 });\n  180 |                                             match ancestors {\n  181 |                                                 Ok(mut ancestors) => {\n  182 |                                                     ancestors.any(|cid| cid.is_ok_and(|c| c.id == local_id))\n  183 |                                                 }\n  184 |                                                 Err(_) => {\n  185 |                                                     force = true;\n  186 |                                                     false\n  187 |                                                 }\n  188 |                                             }","lines":26,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix/src/remote/connection/fetch/update_refs/mod.rs#L163-L188"}]},
{"id":"LOGIC_52","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In `index_lookup`, when the requested stage isn't present, the \"stage hint\" only searches the candidate\nset `[Unconflicted, Base, Ours]`, omitting `Theirs` (stage 3). If a path exists only at stage `Theirs`,\nthe error message will not mention that the entry exists at another stage, giving a misleading diagnostic.","fix":"Include `Stage::Theirs` in the candidate list (filtering out the desired stage as already done).","locations":[{"ref":"gix/src/revision/spec/parse/delegate/navigate.rs:355-358","code":"  355 |                 let stage_hint = [Stage::Unconflicted, Stage::Base, Stage::Ours]\n  356 |                     .iter()\n  357 |                     .filter(|our_stage| **our_stage != stage)\n  358 |                     .find_map(|stage| index.entry_index_by_path_and_stage(path, *stage).map(|_| *stage));","lines":4,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix/src/revision/spec/parse/delegate/navigate.rs#L355-L358"}]},
{"id":"LOGIC_53","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"`parse_time_component` colon branch does `let parts: Vec<&str> = time.split(':').collect();` and reads only `parts.first()`, `parts.get(1)`, `parts.get(2)`. Input like `12:30:45:99` parses successfully with the trailing `:99` silently ignored, making the parser looser than ISO8601.","fix":"Reject when `parts.len() > 3`, and avoid the `Vec` collect by iterating `split(':')` directly.","locations":[{"ref":"gix-date/src/parse/git.rs:206-212","code":"  206 |     let (hour, minute, second) = if time.contains(':') {\n  207 |         // Colon-separated: HH:MM:SS or HH:MM\n  208 |         let parts: Vec<&str> = time.split(':').collect();\n  209 |         let hour: u32 = parts.first()?.parse().ok()?;\n  210 |         let minute: u32 = parts.get(1).unwrap_or(&\"0\").parse().ok()?;\n  211 |         let second: u32 = parts.get(2).unwrap_or(&\"0\").parse().ok()?;\n  212 |         Some((hour, minute, second))","lines":7,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-date/src/parse/git.rs#L206-L212"}]},
{"id":"LOGIC_54","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"medium","description":"`is_binary` uses `(self.printable >> 7) < self.non_printable`. Note that `Stats::from_bytes` classifies a\nlone form-feed (0x0C) and ESC (0x1B) and BS (0x08) and TAB as 'printable'. This matches Git's\n`convert.c` heuristic, so it is not itself a bug; however the `printable >> 7` integer right-shift silently\ntruncates the threshold (floor of printable/128). For inputs whose printable count is not a multiple of 128\nthis is intentionally equal to Git, but worth noting that the comparison is asymmetric vs. a naive\n`non_printable * 128 > printable` and any future refactor that 'simplifies' it could change behavior.","fix":"No change required; if refactoring, keep the exact `(printable >> 7) < non_printable` equivalence to Git to avoid behavioral drift, and add a comment citing convert.c.","locations":[{"ref":"gix-filter/src/eol/utils.rs:99-101","code":"   99 |     pub fn is_binary(&self) -> bool {\n  100 |         self.lone_cr > 0 || self.null > 0 || (self.printable >> 7) < self.non_printable\n  101 |     }","lines":3,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-filter/src/eol/utils.rs#L99-L101"}]},
{"id":"LOGIC_55","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"medium","description":"`compute_with` asserts `before.len() < i32::MAX` / `after.len() < i32::MAX`, but the Myers k-vector allocation\nin `Myers::new` computes `ndiags = len1 + len2 + 3` and `2 * ndiags + 2` as `usize`, then later casts file\nlengths to `i32` throughout the snake search. Two inputs that each individually satisfy `< i32::MAX` can sum to\nmore than `i32::MAX`, so `dmin`/`dmax` (`-(file2.len() as i32)`, `file1.len() as i32`) and the diagonal index\nmath can wrap to negative/garbage `i32` values used for pointer offsets in `write_xpos_at_diagonal`. The\npractical reachability requires ~2 billion tokens combined (huge memory), so impact is low, but the assertion\nguards the wrong quantity (per-file rather than combined diagonal range).","fix":"Assert on the combined size that actually bounds the i32 diagonal arithmetic, e.g.\n`before.len() + after.len() < i32::MAX as usize`.","locations":[{"ref":"gix-imara-diff/src/lib.rs:259-269","code":"  259 |     pub fn compute_with(&mut self, algorithm: Algorithm, mut before: &[Token], mut after: &[Token], num_tokens: u32) {\n  260 |         assert!(\n  261 |             before.len() < i32::MAX as usize,\n  262 |             \"imara-diff only supports up to {} tokens\",\n  263 |             i32::MAX\n  264 |         );\n  265 |         assert!(\n  266 |             after.len() < i32::MAX as usize,\n  267 |             \"imara-diff only supports up to {} tokens\",\n  268 |             i32::MAX\n  269 |         );","lines":11,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-imara-diff/src/lib.rs#L259-L269"},{"ref":"gix-imara-diff/src/myers.rs:64-79","code":"   64 |     fn new(len1: usize, len2: usize) -> Self {\n   65 |         let ndiags = len1 + len2 + 3;\n   66 |         let kvec: *mut [i32] = Box::into_raw(vec![0; 2 * ndiags + 2].into_boxed_slice());\n   67 |         let (kforward, kbackward) = unsafe {\n   68 |             (\n   69 |                 NonNull::new_unchecked((kvec as *mut i32).add(len2 + 1)),\n   70 |                 NonNull::new_unchecked((kvec as *mut i32).add(ndiags + len2 + 1)),\n   71 |             )\n   72 |         };\n   73 |         Self {\n   74 |             kvec: unsafe { NonNull::new_unchecked(kvec) },\n   75 |             kforward,\n   76 |             kbackward,\n   77 |             max_cost: sqrt(ndiags).max(MAX_COST_MIN),\n   78 |         }\n   79 |     }","lines":16,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-imara-diff/src/myers.rs#L64-L79"}]},
{"id":"LOGIC_56","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"medium","description":"`assure_one_name_has_one_edit` detects duplicate edits by sorting names and\nscanning adjacent pairs for equality, returning only the first duplicate. With\nthree or more edits to the same name only one collision is reported; more\nimportantly, names are compared as raw bytes without normalization, so a\ncaller passing both a precomposed and decomposed unicode form of the same ref\n(which map to the same file on macOS) is not flagged as a duplicate and both\nedits proceed, last-writer-wins.","fix":"If unicode-equivalent ref names must be unique, normalize before the\nduplicate check (consistent with the precompose handling elsewhere in the\ncrate), or document that the uniqueness check is byte-exact only.","locations":[{"ref":"gix-ref/src/transaction/ext.rs:47-54","code":"   47 |     fn assure_one_name_has_one_edit(&self) -> Result<(), BString> {\n   48 |         let mut names: Vec<_> = self.iter().map(|e| &e.borrow().name).collect();\n   49 |         names.sort();\n   50 |         match names.windows(2).find(|v| v[0] == v[1]) {\n   51 |             Some(name) => Err(name[0].as_bstr().to_owned()),\n   52 |             None => Ok(()),\n   53 |         }\n   54 |     }","lines":8,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-ref/src/transaction/ext.rs#L47-L54"}]},
{"id":"LOGIC_57","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"medium","description":"`Spec::single()` returns `Some(id)` for `gix_revision::Spec::ExcludeParents(id)` (the `id^@` form, meaning\n\"the parents of id\"), treating it like a plain included single object. Callers using `single()` to get the\none object a spec refers to will receive `id` itself, not its parents, which can be surprising for an\nexclude-parents spec. `Include` and `ExcludeParents` are grouped together here.","fix":"Consider only returning `Some` for `Include`, or document precisely that ExcludeParents yields the anchor id.","locations":[{"ref":"gix/src/revision/spec/mod.rs:87-97","code":"   87 |     pub fn single(&self) -> Option<Id<'repo>> {\n   88 |         match self.inner {\n   89 |             gix_revision::Spec::Include(id) | gix_revision::Spec::ExcludeParents(id) => {\n   90 |                 Id::from_id(id, self.repo).into()\n   91 |             }\n   92 |             gix_revision::Spec::Exclude(_)\n   93 |             | gix_revision::Spec::Range { .. }\n   94 |             | gix_revision::Spec::Merge { .. }\n   95 |             | gix_revision::Spec::IncludeOnlyParents { .. } => None,\n   96 |         }\n   97 |     }","lines":11,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix/src/revision/spec/mod.rs#L87-L97"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"high","difficulty":"easy","description":"In the exhaustive copy-detection callback (`CopySource::FromSetOfModifiedFilesAndAllSources`), the closure\niterates over the *left-hand-side* (`lhs`) index entries but resolves each entry's path against the\n*right-hand-side* state (`rhs`). `Entry::path(state)` indexes `state.path_backing[self.path.clone()]`, so an\n`lhs` entry's path range is used to index `rhs.path_backing`. Since `lhs` and `rhs` are distinct\n`gix_index::State`s with independent path-backing buffers, this returns a wrong path at best and panics with an\nout-of-bounds slice when `rhs.path_backing` is shorter than the `lhs` entry's path range. Both the `location`\nfield and the `push(...)` location argument use the wrong state.","fix":"Resolve the path against the state the entries belong to, i.e. `entry.path(lhs)` instead of `entry.path(rhs)`\non both line 195 and the `push(..., path)` argument.","locations":[{"ref":"gix-diff/src/index/function.rs:194-207","code":"  194 |                 for (index, entry) in lhs.entries().iter().enumerate() {\n  195 |                     let path = entry.path(rhs);\n  196 |                     push(\n  197 |                         ChangeRef::Modification {\n  198 |                             location: Cow::Borrowed(path),\n  199 |                             previous_index: 0, /* does not matter */\n  200 |                             previous_entry_mode: entry.mode,\n  201 |                             previous_id: Cow::Owned(entry.id.kind().null()),\n  202 |                             index,\n  203 |                             entry_mode: entry.mode,\n  204 |                             id: Cow::Borrowed(entry.id.as_ref()),\n  205 |                         },\n  206 |                         path,\n  207 |                     );","lines":14,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-diff/src/index/function.rs#L194-L207"}]},
{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"`has_conflicts` is assigned `res.conflicts.is_empty()` - true when there are NO conflicts, the inverse\nof its name and the inverse of the sibling implementation in merge/tree.rs (`!res.conflicts.is_empty()`).\nThe current output happens to be correct because line 77 double-inverts with `if !has_conflicts`, but\nthe variable is semantically wrong and any future reader trusting the name will introduce a bug.","fix":"Set `let has_conflicts = !res.conflicts.is_empty();` and change the guard at line 77 to `if has_conflicts`.","locations":[{"ref":"gitoxide-core/src/repository/merge/commit.rs:57","code":"   57 |     let has_conflicts = res.conflicts.is_empty();","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/repository/merge/commit.rs#L57"},{"ref":"gitoxide-core/src/repository/merge/commit.rs:76","code":"   76 |     if !has_conflicts {","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/repository/merge/commit.rs#L76"},{"ref":"gitoxide-core/src/repository/merge/tree.rs:83","code":"   83 |         let has_conflicts = !res.conflicts.is_empty();","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/repository/merge/tree.rs#L83"}]},
{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"easy","description":"`Object::try_into_tag()` sets `expected: gix_object::Kind::Commit` in the returned `try_into::Error`,\nbut it is converting to a Tag. This is a copy-paste error from `try_into_commit()` just above it.\nA caller inspecting the error to learn what kind was expected will be told `Commit` instead of `Tag`.\nThe doc comment is also wrong (\"...if it is no commit\") for a tag conversion.","fix":"Change `expected: gix_object::Kind::Commit` to `gix_object::Kind::Tag` in `try_into_tag`.","locations":[{"ref":"gix/src/object/mod.rs:117-124","code":"  117 |     /// Transform this object into a tag, or return it as part of the `Err` if it is no commit.\n  118 |     pub fn try_into_tag(self) -> Result<Tag<'repo>, try_into::Error> {\n  119 |         self.try_into().map_err(|this: Self| try_into::Error {\n  120 |             id: this.id,\n  121 |             actual: this.kind,\n  122 |             expected: gix_object::Kind::Commit,\n  123 |         })\n  124 |     }","lines":8,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix/src/object/mod.rs#L117-L124"}]},
{"id":"CPY_4","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"Two distinct child progress bars are both created with the name \"find changes\"; the second one actually\ntracks \"diff lines\". The label was copy-pasted and not updated, producing two identically-named bars.","fix":"Rename the second child to e.g. \"count diff lines\".","locations":[{"ref":"gitoxide-core/src/query/engine/update.rs:51","code":"   51 |         let mut p = progress.add_child(\"find changes\");","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/query/engine/update.rs#L51"},{"ref":"gitoxide-core/src/query/engine/update.rs:58","code":"   58 |         let mut p = progress.add_child(\"find changes\");","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/query/engine/update.rs#L58"}]},
{"id":"CPY_5","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"The `unimplemented_chars` byte literal for short pathspec magic contains a duplicated single-quote (`'`)\nand the sequence `'-'` embedded mid-string: `b\"\\\"#%&'-',;<=>@_`~\"`. Decoded this is the bytes\n`\" # % & ' - ' , ; < = > @ _ ` ~`, i.e. the `'` byte appears twice. Because this is only used in a\n`contains()` membership test the duplicate is harmless functionally, but it is a clear copy-paste/typo\n(most likely a stray quote, or a `,` was intended) and obscures the intended set of unimplemented magic\ncharacters.","fix":"Remove the duplicate quote / correct the literal to the intended distinct set of characters.","locations":[{"ref":"gix-pathspec/src/parse.rs:97","code":"   97 |     let unimplemented_chars = b\"\\\"#%&'-',;<=>@_`~\";","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-pathspec/src/parse.rs#L97"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","difficulty":"medium","description":"`Repository::is_dirty()` computes the worktree part as\n`.into_index_worktree_iter(...)?.take_while(Result::is_ok).next().is_some()`.\nIf the very first produced item is an `Err`, `take_while(Result::is_ok)` stops immediately and `next()`\nyields `None`, so `is_some()` is `false`. A status error is therefore silently reported as \"not dirty\",\nand the iterator's error is discarded entirely. Errors during the status scan should surface, not be\nswallowed into a clean result.","fix":"Inspect the first item without `take_while`, propagating `Err` as an error and only mapping `Ok(Some(_))` to dirty.","locations":[{"ref":"gix/src/status/mod.rs:198-209","code":"  198 |             let is_dirty = self\n  199 |                 .status(gix_features::progress::Discard)?\n  200 |                 .index_worktree_rewrites(None)\n  201 |                 .index_worktree_submodules(crate::status::Submodule::AsConfigured { check_dirty: true })\n  202 |                 .index_worktree_options_mut(|opts| {\n  203 |                     opts.dirwalk_options = None;\n  204 |                 })\n  205 |                 .into_index_worktree_iter(Vec::new())?\n  206 |                 .take_while(Result::is_ok)\n  207 |                 .next()\n  208 |                 .is_some();\n  209 |             Ok(is_dirty)","lines":12,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix/src/status/mod.rs#L198-L209"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`find_repos_or_insert` calls `refresh_repos(...)` and binds the result to `res` without `?`. When\n`sql_suffix.is_some()`, it ignores `res` entirely (including a possible `Err`) and re-runs\n`find_repos`, so a refresh failure is swallowed and the subsequent query runs against a DB that may\nnot have been populated.","fix":"Use `self.refresh_repos(...)?;` then branch on whether to re-query with the suffix.","locations":[{"ref":"gitoxide-core/src/corpus/engine.rs:353-359","code":"  353 |         if repos.is_empty() {\n  354 |             let res = self.refresh_repos(corpus_path, corpus_id);\n  355 |             if sql_suffix.is_some() {\n  356 |                 self.find_repos(corpus_path, corpus_id, sql_suffix.as_deref())\n  357 |             } else {\n  358 |                 res\n  359 |             }","lines":7,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/corpus/engine.rs#L353-L359"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`find_parent_repo` does `std::fs::read_dir(parent).ok()?`, which returns `None` from the whole\nfunction whenever ANY ancestor directory cannot be read (e.g. permission denied). This aborts the\nupward nesting scan and reports \"no parent repo found\", so a repository actually nested inside a parent\nrepo (behind an unreadable intermediate directory) is wrongly treated as un-nested and then becomes a\ncandidate for the destructive `std::fs::rename` in Execute mode.","fix":"On a read_dir error, continue scanning the next parent instead of bailing out of the function:\n`let Ok(rd) = std::fs::read_dir(parent) else { git_workdir = parent; continue; };`","locations":[{"ref":"gitoxide-core/src/organize.rs:161","code":"  161 |             let has_contained_git_folder_or_file = std::fs::read_dir(parent).ok()?.any(|e| {","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/organize.rs#L161"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"When loading existing commit hashes from the corpus/query DB, a hash that fails `ObjectId::try_from`\nis silently replaced with `ObjectId::null(Sha1)` via `unwrap_or_else`. This corrupts `all_commits`/\n`known_commits`: a single bad/truncated blob in the `commits` table produces a null OID that then\nparticipates in `binary_search` and is extended into the returned \"known commits\" list, yielding wrong\nincremental-update logic instead of a surfaced error.","fix":"Propagate the error (`item?`) instead of substituting `ObjectId::null`.","locations":[{"ref":"gitoxide-core/src/query/engine/update.rs:81-82","code":"   81 |                 Ok(gix::ObjectId::try_from(r.get_ref(0)?.as_bytes()?)\n   82 |                     .unwrap_or_else(|_| gix::ObjectId::null(gix::hash::Kind::Sha1)))","lines":2,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/query/engine/update.rs#L81-L82"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"`.send(...).ok()` silently discards channel-send failures when flushing stat chunks to the DB writer.\nIf the receiver (a stat worker / DB thread) has died, queued commits are silently lost and never\nwritten, yet traversal completes \"successfully\" with an incomplete database and no error surfaced.","fix":"Detect the dropped receiver (set a shared error flag / bail) instead of swallowing with `.ok()`.","locations":[{"ref":"gitoxide-core/src/query/engine/update.rs:380","code":"  380 |                 self.tx.send((self.chunk_id.into_inner(), self.chunk.into_inner())).ok();","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/query/engine/update.rs#L380"},{"ref":"gitoxide-core/src/query/engine/update.rs:419-424","code":"  419 |                         self.tx\n  420 |                             .send((\n  421 |                                 *self.chunk_id.borrow(),\n  422 |                                 std::mem::replace(&mut self.chunk.borrow_mut(), Vec::with_capacity(self.chunk_size)),\n  423 |                             ))\n  424 |                             .ok();","lines":6,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/query/engine/update.rs#L419-L424"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"In the credential helper, `outcome.and_then(|outcome| (&outcome.next).try_into().ok())` discards a\nconversion failure with `.ok()`, turning it into `None`. The credential protocol treats `None` as\n\"no credentials found\", so a malformed context (genuine error) becomes indistinguishable from a\nlegitimate cache miss, hiding why authentication produced nothing.","fix":"Map the conversion error into the function's error type and propagate it instead of `.ok()`.","locations":[{"ref":"gitoxide-core/src/repository/credential.rs:51","code":"   51 |                 .map(|outcome| outcome.and_then(|outcome| (&outcome.next).try_into().ok()))","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/repository/credential.rs#L51"}]},
{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"In the parallel entry-loading path, per-thread results are joined with\n`thread.join().unwrap()` (lines 176 and 215). A panic inside any spawned entry/extension\nworker thread (for example a future bug in `load_one`, or `from_bytes_or_panic`) is\nre-raised by `unwrap()` and propagates out of `State::from_bytes`, turning what should be a\nrecoverable decode error into a process-level panic. The single-threaded path returns\nerrors gracefully; the threaded path does not for thread panics.","fix":"Handle the `Result` from `join()` and convert a thread panic into a decode error\n(e.g. map the `Box<dyn Any>` to `Error::Entry`/a dedicated variant) rather than `unwrap()`.","locations":[{"ref":"gix-index/src/decode/mod.rs:176","code":"  176 |                                 InOrderIter::from(threads.into_iter().map(|thread| thread.join().unwrap()));","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-index/src/decode/mod.rs#L176"},{"ref":"gix-index/src/decode/mod.rs:215","code":"  215 |                         |thread| thread.join().unwrap(),","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-index/src/decode/mod.rs#L215"}]},
