{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"The packed-refs binary-search comparator returns an empty name slice (`&[]`)\non a record that fails to parse and merely sets a side-channel\n`encountered_parse_failure` flag. Because `&[]` sorts before every real name,\na single malformed record in a file declared `sorted` violates the\nmonotonic-key invariant `binary_search_by_key` requires, so the search can\nconverge to the wrong half and miss an existing, well-formed reference even\nthough only an unrelated line was corrupt. The flag is only meaningful when the\nprobed record happens to be the malformed one; corruption elsewhere silently\nyields `Ok(None)` (ref not found) rather than a parse error. git, by contrast,\ntreats a corrupt packed-refs file as a hard error.","fix":"Treat any parse failure encountered during the search as a definite error\nregardless of which probe hit it (the flag already exists; surface it on every\nnon-Ok outcome), or validate the buffer's sortedness/record shape once at open\ntime so the comparator can rely on well-formed records.","locations":[{"ref":"gix-ref/src/store/packed/find.rs:72-97","code":"   72 |     pub(in crate::store_impl::packed) fn binary_search_by(&self, full_name: &BStr) -> Result<usize, (bool, usize)> {\n   73 |         let a = self.as_ref();\n   74 |         let mut encountered_parse_failure = false;\n   75 |         a.binary_search_by_key(&full_name.as_ref(), |b: &u8| {\n   76 |             let ofs = std::ptr::from_ref::<u8>(b) as usize - a.as_ptr() as usize;\n   77 |             let line = packed::decode::record_at_offset(a, ofs);\n   78 |             // The binary search only needs the name bytes for ordered\n   79 |             // comparison; skip ref-name and hex-hash validation here and let\n   80 |             // the final match site re-parse the record via `decode::reference`\n   81 |             // (which validates fully). This saves the `log₂(n)` per-query.\n   82 |             match packed::decode::name_at_record_start(line, self.object_hash) {\n   83 |                 Some(name) => name,\n   84 |                 None => {\n   85 |                     encountered_parse_failure = true;\n   86 |                     &[]\n   87 |                 }\n   88 |             }\n   89 |         })\n   90 |         .map(|pos| packed::decode::record_start_at_offset(a, pos))\n   91 |         .map_err(|pos| {\n   92 |             (\n   93 |                 encountered_parse_failure,\n   94 |                 packed::decode::record_start_at_offset(a, pos),\n   95 |             )\n   96 |         })\n   97 |     }","lines":26,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-ref/src/store/packed/find.rs#L72-L97"},{"ref":"gix-ref/src/store/packed/decode/mod.rs:109-123","code":"  109 | pub(crate) fn name_at_record_start(input: &[u8], object_hash: gix_hash::Kind) -> Option<&[u8]> {\n  110 |     let hex_len = object_hash.len_in_hex();\n  111 |     if input.get(hex_len) != Some(&b' ') {\n  112 |         return None;\n  113 |     }\n  114 |     let after = &input[hex_len + 1..];\n  115 |     let end = after.iter().position(|&b| b == b'\\r' || b == b'\\n')?;\n  116 |     if end == 0 {\n  117 |         return None;\n  118 |     }\n  119 |     if after[end] == b'\\r' && after.get(end + 1) != Some(&b'\\n') {\n  120 |         return None;\n  121 |     }\n  122 |     Some(&after[..end])\n  123 | }","lines":15,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-ref/src/store/packed/decode/mod.rs#L109-L123"}]},
{"id":"ERR_9","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`Platform::stats()` silently swallows per-file errors: `change.diff(...).ok().and_then(|p| p.line_counts().ok()).flatten()`.\nA blob-diff or line-count failure (e.g. missing object after a `--filter=blob:none` clone, or a decode error)\nresults in the file simply not being counted, producing silently wrong `files_changed`/`lines_added`/`lines_removed`\nstatistics with no indication that anything went wrong.","fix":"Propagate the diff/line-count errors via the function's `stats::Error` instead of discarding them with `.ok()`.","locations":[{"ref":"gix/src/object/tree/diff/mod.rs:194-220","code":"  194 |     pub fn stats(&mut self, other: &Tree<'_>) -> Result<Stats, stats::Error> {\n  195 |         // let (mut number_of_files, mut lines_added, mut lines_removed) = (0, 0, 0);\n  196 |         let mut resource_cache = self.lhs.repo.diff_resource_cache_for_tree_diff()?;\n  197 | \n  198 |         let (mut files_changed, mut lines_added, mut lines_removed) = (0, 0, 0);\n  199 |         self.for_each_to_obtain_tree(other, |change| {\n  200 |             if let Some(counts) = change\n  201 |                 .diff(&mut resource_cache)\n  202 |                 .ok()\n  203 |                 .and_then(|mut platform| platform.line_counts().ok())\n  204 |                 .flatten()\n  205 |             {\n  206 |                 files_changed += 1;\n  207 |                 lines_added += u64::from(counts.insertions);\n  208 |                 lines_removed += u64::from(counts.removals);\n  209 |             }\n  210 | \n  211 |             resource_cache.clear_resource_cache_keep_allocation();\n  212 |             Ok::<_, std::convert::Infallible>(std::ops::ControlFlow::Continue(()))\n  213 |         })?;\n  214 | \n  215 |         Ok(Stats {\n  216 |             files_changed,\n  217 |             lines_added,\n  218 |             lines_removed,\n  219 |         })\n  220 |     }","lines":27,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix/src/object/tree/diff/mod.rs#L194-L220"}]},
{"id":"ERR_10","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`find_fetch_remote(Some(name))` uses `self.try_find_remote(name).and_then(Result::ok)`, which discards a configuration error. If `name` matches a configured remote whose config is invalid (e.g. malformed `remote.<name>.url` or refspec), the real error is silently dropped and the code falls through to treating `name` as a URL via `remote_at(gix_url::parse(name)?)`. The user gets a confusing URL-parse error (or unexpected remote) instead of the real remote-config error.","fix":"Distinguish `None` (not found) from `Some(Err)` (found but invalid): on `Some(Err(e))` propagate `e` rather than falling through to URL parsing.","locations":[{"ref":"gix/src/repository/remote.rs:150-164","code":"  150 |     pub fn find_fetch_remote(&self, name_or_url: Option<&BStr>) -> Result<Remote<'_>, find::for_fetch::Error> {\n  151 |         Ok(match name_or_url {\n  152 |             Some(name) => match self.try_find_remote(name).and_then(Result::ok) {\n  153 |                 Some(remote) => remote,\n  154 |                 None => self.remote_at(gix_url::parse(name)?)?,\n  155 |             },\n  156 |             None => self\n  157 |                 .head()?\n  158 |                 .into_remote(remote::Direction::Fetch)\n  159 |                 .transpose()?\n  160 |                 .map(Ok)\n  161 |                 .or_else(|| self.find_default_remote(remote::Direction::Fetch))\n  162 |                 .ok_or(find::for_fetch::Error::ExactlyOneRemoteNotAvailable)??,\n  163 |         })\n  164 |     }","lines":15,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix/src/repository/remote.rs#L150-L164"}]},
{"id":"ERR_11","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"Human-readable output writers discard their `io::Result` via `drop(...)`/`.ok()`, while the JSON\nbranches in the same `match` arms propagate errors with `?`. Genuine write failures (e.g. disk full\nwhen redirected to a file) are silently lost for the human path, and the inconsistency within one\ncommand is a maintenance hazard.","fix":"Propagate the io::Result with `?` for the human-output writers, consistent with the JSON branch.","locations":[{"ref":"gitoxide-core/src/pack/index.rs:117","code":"  117 |         OutputFormat::Human => drop(human_output(out, res)),","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/pack/index.rs#L117"},{"ref":"gitoxide-core/src/pack/receive.rs:310","code":"  310 |         OutputFormat::Human => drop(print(&mut out, outcome, refs)),","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/pack/receive.rs#L310"},{"ref":"gitoxide-core/src/pack/verify.rs:176","code":"  176 |                             drop(print_statistics(&mut out, &stats));","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/pack/verify.rs#L176"},{"ref":"gitoxide-core/src/pack/verify.rs:204","code":"  204 |             Some(OutputFormat::Human) => drop(print_statistics(&mut out, stats)),","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/pack/verify.rs#L204"},{"ref":"gitoxide-core/src/pack/multi_index.rs:64","code":"   64 |         writeln!(err, \"Defaulting to JSON as human format isn't implemented\").ok();","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/pack/multi_index.rs#L64"}]},
{"id":"ERR_12","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`platform.local_branches()?.flatten()` and `remote_branches()?.flatten()` use `.flatten()` on an\niterator of `Result`, silently discarding any per-reference error (e.g. a malformed/unparseable ref).\nThe user sees a truncated branch list with no indication that some refs failed to be read.","fix":"Collect with `.collect::<Result<Vec<_>, _>>()?`, or log skipped errors to stderr.","locations":[{"ref":"gitoxide-core/src/repository/branch.rs:33-36","code":"   33 |             .local_branches()?\n   34 |             .flatten()\n   35 |             .map(|branch| branch.name().shorten().to_string())\n   36 |             .collect();","lines":4,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/repository/branch.rs#L33-L36"},{"ref":"gitoxide-core/src/repository/branch.rs:47-50","code":"   47 |             .remote_branches()?\n   48 |             .flatten()\n   49 |             .map(|branch| branch.name().shorten().to_string())\n   50 |             .collect();","lines":4,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/repository/branch.rs#L47-L50"}]},
{"id":"ERR_13","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`collect_parents` for the `CommitRefIter` path swallows errors: `odb.find_commit_iter(...).ok()` and\n`committer().ok()` discard failures and fall back to `committer_timestamp = 0` via `unwrap_or_default()`. A parent whose\ncommit object fails to load (or has an undecodable committer) is silently inserted into the priority queue with timestamp\n0, which both hides real DB/decoding errors and skews the date-priority traversal order, potentially affecting blame\nresults. Note the `CachedCommit` path (just above) does propagate the error via `parent_pos?`, so behavior is inconsistent\nbetween the two paths.","fix":"Propagate the find/decode error (as in the cached path) instead of defaulting the timestamp to 0, or at least trace it.","locations":[{"ref":"gix-blame/src/file/function.rs:879-887","code":"  879 |         gix_traverse::commit::Either::CommitRefIter(commit_ref_iter) => {\n  880 |             for id in commit_ref_iter.parent_ids() {\n  881 |                 let parent = odb.find_commit_iter(id.as_ref(), buf).ok();\n  882 |                 let parent_commit_time = parent\n  883 |                     .and_then(|parent| parent.committer().ok().map(|committer| committer.seconds()))\n  884 |                     .unwrap_or_default();\n  885 |                 parent_ids.push((id, parent_commit_time));\n  886 |             }\n  887 |         }","lines":9,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-blame/src/file/function.rs#L879-L887"}]},
{"id":"ERR_14","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`Graph::lookup_by_id` accumulates `current_file_start += file.num_commits()` as a `u32`. The sum across all files is bounded to `MAX_COMMITS` only inside `Graph::new`. Any code path that constructs a `Graph` while bypassing `new` (none exist publicly today, but the field is reachable within the crate) could overflow this `u32` in debug or wrap in release, producing wrong global positions. The safety here relies entirely on the `new` invariant rather than on a local check.","fix":"Use `checked_add` for `current_file_start` (and `lookup_by_pos`'s implicit cumulative position) or keep the running offset as `u64`, so a malformed/oversized graph cannot silently produce wrong positions even if the `MAX_COMMITS` invariant is ever violated.","locations":[{"ref":"gix-commitgraph/src/access.rs:59-72","code":"   59 |     fn lookup_by_id(&self, id: &gix_hash::oid) -> Option<LookupByIdResult<'_>> {\n   60 |         let mut current_file_start = 0;\n   61 |         for file in &self.files {\n   62 |             if let Some(lex_pos) = file.lookup(id) {\n   63 |                 return Some(LookupByIdResult {\n   64 |                     file,\n   65 |                     file_pos: lex_pos,\n   66 |                     graph_pos: Position(current_file_start + lex_pos.0),\n   67 |                 });\n   68 |             }\n   69 |             current_file_start += file.num_commits();\n   70 |         }\n   71 |         None\n   72 |     }","lines":14,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-commitgraph/src/access.rs#L59-L72"},{"ref":"gix-commitgraph/src/init.rs:58-83","code":"   58 |     pub fn new(files: Vec<File>) -> Result<Self, Message> {\n   59 |         let files = nonempty::NonEmpty::from_vec(files)\n   60 |             .ok_or_else(|| message!(\"Commit-graph must contain at least one file\"))?;\n   61 |         let num_commits: u64 = files.iter().map(|f| u64::from(f.num_commits())).sum();\n   62 |         if num_commits > u64::from(MAX_COMMITS) {\n   63 |             return Err(message!(\n   64 |                 \"Commit-graph files contain {num_commits} commits altogether, but only {MAX_COMMITS} commits are allowed\"\n   65 |             ));\n   66 |         }\n   67 | \n   68 |         let mut f1 = files.first();\n   69 |         for f2 in files.tail() {\n   70 |             if f1.object_hash() != f2.object_hash() {\n   71 |                 return Err(message!(\n   72 |                     \"Commit-graph files mismatch: '{path1}' uses hash {hash1:?}, but '{path2}' uses hash {hash2:?}\",\n   73 |                     path1 = f1.path().display(),\n   74 |                     hash1 = f1.object_hash(),\n   75 |                     path2 = f2.path().display(),\n   76 |                     hash2 = f2.object_hash(),\n   77 |                 ));\n   78 |             }\n   79 |             f1 = f2;\n   80 |         }\n   81 | \n   82 |         Ok(Self { files })\n   83 |     }","lines":26,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-commitgraph/src/init.rs#L58-L83"}]},
{"id":"ERR_15","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`AsKey::as_key` (and its blanket/impl forms) panics via `panic!(\"'{self}' is not a valid configuration\nkey\")` when the key cannot be parsed. Comfort accessors correctly use `try_as_key`, but the raw value API\n(`raw_value`, `raw_value_filter`, `raw_value_mut`, etc.) call `key.as_key()` directly, so passing a\nmalformed key string (e.g. one without a `.`) panics instead of returning a lookup error. For an API parsing\nuser-influenced keys this is an avoidable panic surface.","fix":"Document the panic clearly on the raw API, or provide/route through fallible `try_*` variants for the raw\nvalue lookups so callers with dynamic keys don't have to risk a panic.","locations":[{"ref":"gix-config/src/key.rs:25-67","code":"   25 |     impl AsKey for &String {\n   26 |         fn as_key(&self) -> KeyRef<'_> {\n   27 |             self.try_as_key()\n   28 |                 .unwrap_or_else(|| panic!(\"'{self}' is not a valid configuration key\"))\n   29 |         }\n   30 | \n   31 |         fn try_as_key(&self) -> Option<KeyRef<'_>> {\n   32 |             KeyRef::parse_unvalidated(self.as_str().into())\n   33 |         }\n   34 |     }\n   35 | \n   36 |     impl AsKey for &str {\n   37 |         fn as_key(&self) -> KeyRef<'_> {\n   38 |             self.try_as_key()\n   39 |                 .unwrap_or_else(|| panic!(\"'{self}' is not a valid configuration key\"))\n   40 |         }\n   41 | \n   42 |         fn try_as_key(&self) -> Option<KeyRef<'_>> {\n   43 |             KeyRef::parse_unvalidated((*self).into())\n   44 |         }\n   45 |     }\n   46 | \n   47 |     impl AsKey for &BString {\n   48 |         fn as_key(&self) -> KeyRef<'_> {\n   49 |             self.try_as_key()\n   50 |                 .unwrap_or_else(|| panic!(\"'{self}' is not a valid configuration key\"))\n   51 |         }\n   52 | \n   53 |         fn try_as_key(&self) -> Option<KeyRef<'_>> {\n   54 |             KeyRef::parse_unvalidated(self.as_bstr())\n   55 |         }\n   56 |     }\n   57 | \n   58 |     impl AsKey for &BStr {\n   59 |         fn as_key(&self) -> KeyRef<'_> {\n   60 |             self.try_as_key()\n   61 |                 .unwrap_or_else(|| panic!(\"'{self}' is not a valid configuration key\"))\n   62 |         }\n   63 | \n   64 |         fn try_as_key(&self) -> Option<KeyRef<'_>> {\n   65 |             KeyRef::parse_unvalidated(self)\n   66 |         }\n   67 |     }","lines":43,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-config/src/key.rs#L25-L67"}]},
{"id":"ERR_16","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`parse_header` does `parse_offset(offset).unwrap_or_default()`, turning any malformed offset into 0 instead of signaling it, and falls back on only the leading ASCII digits of a malformed seconds token. Callers that do not re-serialize to detect \"wonky\" results will silently get a wrong `Time` (e.g. offset defaulted to 0). Documented as intentional leniency, but a foot-gun worth flagging.","fix":"If stricter behavior is desired, return None when `parse_offset` fails rather than defaulting to 0.","locations":[{"ref":"gix-date/src/parse/function.rs:173-194","code":"  173 |     let mut split = input.split_whitespace();\n  174 |     let seconds = split.next()?;\n  175 |     let seconds = match seconds.parse::<SecondsSinceUnixEpoch>() {\n  176 |         Ok(s) => s,\n  177 |         Err(_err) => {\n  178 |             // Inefficient, but it's not the common case.\n  179 |             let first_digits: String = seconds.chars().take_while(char::is_ascii_digit).collect();\n  180 |             first_digits.parse().ok()?\n  181 |         }\n  182 |     };\n  183 |     let offset = match split.next() {\n  184 |         None => 0,\n  185 |         Some(offset) => {\n  186 |             if split.next().is_some() {\n  187 |                 0\n  188 |             } else {\n  189 |                 parse_offset(offset).unwrap_or_default()\n  190 |             }\n  191 |         }\n  192 |     };\n  193 |     let time = Time { seconds, offset };\n  194 |     Some(time)","lines":22,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-date/src/parse/function.rs#L173-L194"}]},
{"id":"ERR_17","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"`probe_file_mode` computes the meaningful probe result `res`, then does `std::fs::remove_file(test_path)?;` and only afterwards returns `res`. The `?` propagates a cleanup error and discards the actual probe outcome. If the file removal fails (e.g. permissions), the real answer is lost; if the earlier open failed, it still tries to remove a nonexistent file and returns that NotFound error instead of the original. The sibling `probe_ignore_case` uses best-effort `.ok()` cleanup.","fix":"Use `let _ = std::fs::remove_file(test_path);` (best-effort) then return `res`.","locations":[{"ref":"gix-fs/src/capabilities.rs:104-106","code":"  104 |             });\n  105 |         std::fs::remove_file(test_path)?;\n  106 |         res","lines":3,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-fs/src/capabilities.rs#L104-L106"}]},
{"id":"ERR_18","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"Same pattern as the file-mode probe: `probe_precompose_unicode` computes the meaningful result `res`, then `std::fs::remove_file(precomposed)?;` propagates a cleanup failure and discards `res`, so a successful probe with a failed cleanup loses the real answer.","fix":"Make cleanup best-effort (`let _ = std::fs::remove_file(...);`) and return `res`.","locations":[{"ref":"gix-fs/src/capabilities.rs:176-178","code":"  176 |         let res = root.join(decomposed).symlink_metadata().map(|_| true);\n  177 |         std::fs::remove_file(precomposed)?;\n  178 |         res","lines":3,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-fs/src/capabilities.rs#L176-L178"}]},
{"id":"ERR_19","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`detect_required_version` only ever returns V2 or V3 (it never returns V4). As a result\n`State::write_to` can never serialize a V4 index even if the in-memory state was decoded\nfrom a V4 file, silently downgrading the on-disk format and discarding the path\ndelta-compression. This is a (documented-by-omission) loss of information on write and means\nthe V4 write/padding code path is effectively unreachable.","fix":"Either preserve `self.version` (write V4 when the state is V4 and V4 writing is implemented),\nor document explicitly that writing always downgrades to V2/V3.","locations":[{"ref":"gix-index/src/write.rs:145-150","code":"  145 |     fn detect_required_version(&self) -> Version {\n  146 |         self.entries\n  147 |             .iter()\n  148 |             .find_map(|e| e.flags.contains(entry::Flags::EXTENDED).then_some(Version::V3))\n  149 |             .unwrap_or(Version::V2)\n  150 |     }","lines":6,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-index/src/write.rs#L145-L150"}]},
{"id":"ERR_20","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`Response::from` (the `From<std::io::Error>` impl) matches on `err.kind() == ErrorKind::Other` and, in\nthe `None` inner-error case, discards the original error entirely, reconstructing a bare\n`std::io::ErrorKind::Other.into()`. Any message/context attached to an `Other` error with no boxed inner\nerror is silently lost. While `io::Error::other(..)` always carries an inner error in practice, an\n`ErrorKind::Other` produced via `ErrorKind::Other.into()` elsewhere would be flattened to a generic,\nmessage-less error here, harming diagnosability of fetch-response failures.","fix":"In the `None` branch, preserve the original error (e.g. `Error::Io(err)` using the moved value via\nmatching before `into_inner`, or reconstruct from `err.to_string()`), rather than fabricating a fresh\n`ErrorKind::Other` with no payload.","locations":[{"ref":"gix-protocol/src/fetch/response/mod.rs:24-38","code":"   24 | impl From<std::io::Error> for Error {\n   25 |     fn from(err: std::io::Error) -> Self {\n   26 |         if err.kind() == std::io::ErrorKind::Other {\n   27 |             match err.into_inner() {\n   28 |                 Some(err) => match err.downcast::<gix_transport::packetline::read::Error>() {\n   29 |                     Ok(err) => Error::UploadPack(*err),\n   30 |                     Err(err) => Error::Io(std::io::Error::other(err)),\n   31 |                 },\n   32 |                 None => Error::Io(std::io::ErrorKind::Other.into()),\n   33 |             }\n   34 |         } else {\n   35 |             Error::Io(err)\n   36 |         }\n   37 |     }\n   38 | }","lines":15,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-protocol/src/fetch/response/mod.rs#L24-L38"}]},
{"id":"ERR_21","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`ref_contents` returns `Ok(None)` (treated as \"ref does not exist\") when\n`File::open` succeeds but `read_to_end` fails and the path turns out to be a\ndirectory (line 298-299). A transient read error on a regular file is correctly\npropagated, but the `is_dir()` recovery races: a path that was a file at open\ntime but is reported as a dir at the error check (or vice-versa) collapses a\ngenuine I/O error into \"not found\", masking real failures.","fix":"Capture the file type from the already-open file handle (`file.metadata()`)\nrather than re-stat'ing the path, so the error/none decision is based on the\nsame inode that was opened.","locations":[{"ref":"gix-ref/src/store/file/find.rs:305-311","code":"  305 |         match std::fs::File::open(&ref_path) {\n  306 |             Ok(mut file) => {\n  307 |                 let mut buf = Vec::with_capacity(128);\n  308 |                 if let Err(err) = file.read_to_end(&mut buf) {\n  309 |                     return if ref_path.is_dir() { Ok(None) } else { Err(err) };\n  310 |                 }\n  311 |                 Ok(buf.into())","lines":7,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-ref/src/store/file/find.rs#L305-L311"}]},
{"id":"ERR_22","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`LazyCommit::committer_timestamp` and `generation_and_timestamp` cast the commit-graph timestamp with\n`cache.commit_at(*pos).committer_timestamp() as SecondsSinceUnixEpoch` (u64 -> i64), with a comment\n\"a cast as we cannot represent the error and trying seems overkill\". This silently produces a\nnegative/garbage timestamp for u64 values > i64::MAX, in contrast to `to_owned()` which properly\nreturns `to_owned::Error::CommitGraphTime` via `try_into()` for the same conversion. The two code\npaths disagree on how to handle an out-of-range commit-graph time.","fix":"Be consistent: either use try_into() and surface an error in both places, or document why truncation is acceptable for the timestamp accessors.","locations":[{"ref":"gix-revwalk/src/graph/commit.rs:21-28","code":"   21 |     pub fn committer_timestamp(&self) -> Result<SecondsSinceUnixEpoch, gix_object::decode::Error> {\n   22 |         Ok(match &self.backing {\n   23 |             Either::Left(buf) => gix_object::CommitRefIter::from_bytes(buf, self.object_hash)\n   24 |                 .committer()?\n   25 |                 .seconds(),\n   26 |             Either::Right((cache, pos)) => cache.commit_at(*pos).committer_timestamp() as SecondsSinceUnixEpoch, // a cast as we cannot represent the error and trying seems overkill\n   27 |         })\n   28 |     }","lines":8,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-revwalk/src/graph/commit.rs#L21-L28"},{"ref":"gix-revwalk/src/graph/commit.rs:38-58","code":"   38 |     /// Returns the generation of the commit and its commit-time, either from cache if available, or parsed from the object buffer.\n   39 |     pub fn generation_and_timestamp(\n   40 |         &self,\n   41 |     ) -> Result<(Option<Generation>, SecondsSinceUnixEpoch), gix_object::decode::Error> {\n   42 |         Ok(match &self.backing {\n   43 |             Either::Left(buf) => (\n   44 |                 None,\n   45 |                 gix_object::CommitRefIter::from_bytes(buf, self.object_hash)\n   46 |                     .committer()?\n   47 |                     .seconds(),\n   48 |             ),\n   49 |             Either::Right((cache, pos)) => {\n   50 |                 let commit = cache.commit_at(*pos);\n   51 |                 (\n   52 |                     commit.generation().into(),\n   53 |                     // a cast as we cannot represent the error and trying seems overkill\n   54 |                     cache.commit_at(*pos).committer_timestamp() as SecondsSinceUnixEpoch,\n   55 |                 )\n   56 |             }\n   57 |         })\n   58 |     }","lines":21,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-revwalk/src/graph/commit.rs#L38-L58"},{"ref":"gix-revwalk/src/graph/commit.rs:100-106","code":"  100 |                 Commit {\n  101 |                     parents,\n  102 |                     commit_time: commit.committer_timestamp().try_into().map_err(|_| {\n  103 |                         to_owned::Error::CommitGraphTime {\n  104 |                             actual: commit.committer_timestamp(),\n  105 |                         }\n  106 |                     })?,","lines":7,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-revwalk/src/graph/commit.rs#L100-L106"}]},
{"id":"ERR_23","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`parse_status` returns error kind 500 for any failure of `parse_status_inner` (e.g. a header line that isn't the status line, or a non-UTF8 / non-numeric status). The header callback is invoked for the very first header line which is expected to be the status line, but if curl's first delivered header is not parseable as `HTTP/<ver> <status>`, the code fabricates a synthetic '500' status and an error, masking the real cause. Combined with `checked_status` being flipped on the first header unconditionally, a single unexpected first header poisons the whole request.","fix":"Distinguish 'not a status line' from 'bad status': only treat the line as the status line if it starts with `HTTP/`, otherwise forward it as a normal header rather than synthesizing a 500.","locations":[{"ref":"gix-transport/src/client/blocking_io/http/curl/remote.rs:85-105","code":"   85 |     fn parse_status_inner(data: &[u8]) -> Result<usize, Box<dyn std::error::Error + Send + Sync>> {\n   86 |         let code = data\n   87 |             .split(|b| *b == b' ')\n   88 |             .nth(1)\n   89 |             .ok_or(\"Expected HTTP/<VERSION> STATUS\")?;\n   90 |         let code = std::str::from_utf8(code)?;\n   91 |         code.parse().map_err(Into::into)\n   92 |     }\n   93 |     fn parse_status(data: &[u8], follow: FollowRedirects) -> Option<(usize, Box<dyn std::error::Error + Send + Sync>)> {\n   94 |         let valid_end = match follow {\n   95 |             FollowRedirects::Initial | FollowRedirects::All => 308,\n   96 |             FollowRedirects::None => 299,\n   97 |         };\n   98 |         match Self::parse_status_inner(data) {\n   99 |             Ok(status) if !(200..=valid_end).contains(&status) => {\n  100 |                 Some((status, format!(\"Received HTTP status {status}\").into()))\n  101 |             }\n  102 |             Ok(_) => None,\n  103 |             Err(err) => Some((500, err)),\n  104 |         }\n  105 |     }","lines":21,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-transport/src/client/blocking_io/http/curl/remote.rs#L85-L105"}]},
{"id":"ERR_24","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"The error message for Error::FilterPathsUnprocessed ends with a colon but never interpolates the offending paths:\n\"The following paths were delayed and apparently forgotten to be processed by the filter driver: \". The\n`rela_paths` field is carried in the variant but not shown, so users get a truncated, uninformative message.","fix":"Include the paths in the message, e.g.\n#[error(\"The following paths were delayed and apparently forgotten to be processed by the filter driver: {rela_paths:?}\")]\nFilterPathsUnprocessed { rela_paths: Vec<BString> },","locations":[{"ref":"gix-worktree-state/src/checkout/mod.rs:103-104","code":"  103 |     #[error(\"The following paths were delayed and apparently forgotten to be processed by the filter driver: \")]\n  104 |     FilterPathsUnprocessed { rela_paths: Vec<BString> },","lines":2,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-worktree-state/src/checkout/mod.rs#L103-L104"}]},
{"id":"ERR_25","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `create::into`, `fs::File::create(config_path)?` relies on the `#[from] std::io::Error` impl which maps to\n`Error::CurrentDir` (\"Could not obtain the current directory\"). A failure to create the repository's\n`config` file will thus be reported as a current-directory error, which is misleading.","fix":"Map the error explicitly to `Error::IoOpen { source, path: config_path }` instead of using `?` with the `From` impl.","locations":[{"ref":"gix/src/create.rs:259-263","code":"  259 |         let (mut config_file, config_path) = {\n  260 |             let mut cursor = PathCursor(&mut dot_git);\n  261 |             let config_path = cursor.at(\"config\");\n  262 |             (fs::File::create(config_path)?, config_path.to_owned())\n  263 |         };","lines":5,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix/src/create.rs#L259-L263"},{"ref":"gix/src/create.rs:12-14","code":"   12 | pub enum Error {\n   13 |     #[error(\"Could not obtain the current directory\")]\n   14 |     CurrentDir(#[from] std::io::Error),","lines":3,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix/src/create.rs#L12-L14"}]},
{"id":"ERR_26","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In the parallel status iterator, when the tree-index producer thread returns an error, the code does\n`break Some(Err(err.into()))` after having already taken `rx_and_join`, so the index-worktree producer\nthread handle is dropped without being joined and without `should_interrupt` being set. The worktree\nscan thread may keep running unnecessarily until it finishes on its own.","fix":"Set the interrupt flag (or otherwise signal/join the worktree handle) before returning the tree-index error.","locations":[{"ref":"gix/src/status/iter/mod.rs:254-272","code":"  254 |                 Err(std::sync::mpsc::RecvTimeoutError::Disconnected) => {\n  255 |                     let (_rx, worktree_handle, tree_handle) = self.rx_and_join.take()?;\n  256 |                     let tree_index = if let Some(handle) = tree_handle {\n  257 |                         match handle.join().expect(\"no panic\") {\n  258 |                             Ok(out) => Some(out),\n  259 |                             Err(err) => break Some(Err(err.into())),\n  260 |                         }\n  261 |                     } else {\n  262 |                         None\n  263 |                     };\n  264 |                     break match worktree_handle.join().expect(\"no panic\") {\n  265 |                         Ok(mut out) => {\n  266 |                             out.changes = Some(std::mem::take(&mut self.index_changes));\n  267 |                             out.tree_index = tree_index;\n  268 |                             self.out = Some(out);\n  269 |                             None\n  270 |                         }\n  271 |                         Err(err) => Some(Err(err.into())),\n  272 |                     };","lines":19,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix/src/status/iter/mod.rs#L254-L272"}]},
{"id":"ERR_27","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"negligible","difficulty":"easy","description":"`decode::loose_header` parses the object size with `gix_utils::btoi::to_signed::<u64>` even though size is unsigned and the function returns it as a `u64`. Using the signed parser means a leading `+`/`-` is accepted at the byte-parsing layer; a value like `+5` would parse where git only writes plain digits, and the intent (an unsigned, non-negative size) is obscured. The returned size then feeds directly into a `data[offset..][..size]` slice in `ObjectRef::from_loose`.","fix":"Use an unsigned byte-to-integer parser (e.g. `to_unsigned`/`to_decimal` equivalent) so only plain digit sequences are accepted for the object size, matching git's serialization.","locations":[{"ref":"gix-object/src/lib.rs:360-376","code":"  360 |     pub fn loose_header(input: &[u8]) -> Result<(super::Kind, u64, usize), LooseHeaderDecodeError> {\n  361 |         use LooseHeaderDecodeError::*;\n  362 |         let kind_end = input.find_byte(0x20).ok_or(InvalidHeader {\n  363 |             message: \"Expected '<type> <size>'\",\n  364 |         })?;\n  365 |         let kind = super::Kind::from_bytes(&input[..kind_end])?;\n  366 |         let size_end = input.find_byte(0x0).ok_or(InvalidHeader {\n  367 |             message: \"Did not find 0 byte in header\",\n  368 |         })?;\n  369 |         let size_bytes = &input[kind_end + 1..size_end];\n  370 |         let size = gix_utils::btoi::to_signed(size_bytes).map_err(|source| ParseIntegerError {\n  371 |             source,\n  372 |             message: \"Object size in header could not be parsed\",\n  373 |             number: size_bytes.into(),\n  374 |         })?;\n  375 |         Ok((kind, size, size_end + 1))\n  376 |     }","lines":17,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-object/src/lib.rs#L360-L376"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"Inside the spawned excludes worker thread, a parse failure is reported via `eprintln!` directly to\nprocess stderr, bypassing the `err` writer threaded through the rest of the function (used for all\nother diagnostics). This breaks output redirection/capture consistency.","fix":"Route the message through a shared/cloned error sink rather than direct stderr.","locations":[{"ref":"gitoxide-core/src/repository/attributes/validate_baseline.rs:167","code":"  167 |                             eprintln!(\"Failed to parse line {line:?} - ignored\");","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/repository/attributes/validate_baseline.rs#L167"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`SignatureRef::seconds()` parses the timestamp with `self.time.trim().split(' ').next()` and `unwrap_or_default()` (0 on failure). Because the `time` field is parsed leniently (it may contain arbitrary bytes that passed `is_time_byte`, e.g. `--700`, multiple spaces, or a lone `-`), `seconds()` will silently return 0 for many malformed-but-accepted signatures while `time()` would have produced a different (or error) result. This divergence between the fast `seconds()` and the full `time()` parse is documented but is an easy source of subtle bugs where two code paths disagree about a commit's time.","fix":"Where exactness matters, prefer `time()`; consider having `seconds()` reject a leading sign-only or empty first token rather than defaulting to 0 so the two parsers agree on validity.","locations":[{"ref":"gix-actor/src/signature/mod.rs:57-70","code":"   57 |         pub fn seconds(&self) -> gix_date::SecondsSinceUnixEpoch {\n   58 |             self.time\n   59 |                 .trim()\n   60 |                 .split(' ')\n   61 |                 .next()\n   62 |                 .and_then(|i| i.parse().ok())\n   63 |                 .unwrap_or_default()\n   64 |         }\n   65 | \n   66 |         /// Parse the `time` field for access to the passed time since unix epoch, and the time offset.\n   67 |         /// The format is expected to be [raw](gix_date::parse_header()).\n   68 |         pub fn time(&self) -> Result<gix_date::Time, gix_date::Error> {\n   69 |             self.time.parse()\n   70 |         }","lines":14,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-actor/src/signature/mod.rs#L57-L70"}]},
{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`RefMap` (used by attributes `Outcome` to deduplicate matched patterns/assignments/paths) keys entries\nsolely by the 64-bit output of `DefaultHasher`, with no collision handling: `insert` treats any\n`Entry::Occupied` as 'already the same value' and returns the existing key without comparing the actual\nvalues. The module doc acknowledges hash collisions are 'designed to be less likely' than pointer aliasing,\nbut a genuine 64-bit collision between two *different* patterns/assignments would cause `resolve()` to\nsilently return the wrong value, yielding an incorrect attribute/assignment in a search result rather than\na panic. There is no equality check to detect or avoid this.","fix":"On `Entry::Occupied`, compare the stored value against the new one (require `T: PartialEq`) and fall back to probing/a secondary key on mismatch, or store a `Vec<T>` per bucket, to make collisions correct rather than silently wrong.","locations":[{"ref":"gix-attributes/src/search/refmap.rs:27-51","code":"   27 |     pub(crate) fn insert(&mut self, value: &T) -> RefMapKey {\n   28 |         let mut s = DefaultHasher::new();\n   29 |         value.hash(&mut s);\n   30 |         let key = s.finish();\n   31 |         match self.0.entry(key) {\n   32 |             Entry::Vacant(e) => {\n   33 |                 e.insert(value.clone());\n   34 |                 key\n   35 |             }\n   36 |             Entry::Occupied(_) => key,\n   37 |         }\n   38 |     }\n   39 | \n   40 |     pub(crate) fn insert_owned(&mut self, value: T) -> RefMapKey {\n   41 |         let mut s = DefaultHasher::new();\n   42 |         value.hash(&mut s);\n   43 |         let key = s.finish();\n   44 |         match self.0.entry(key) {\n   45 |             Entry::Vacant(e) => {\n   46 |                 e.insert(value);\n   47 |                 key\n   48 |             }\n   49 |             Entry::Occupied(_) => key,\n   50 |         }\n   51 |     }","lines":25,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-attributes/src/search/refmap.rs#L27-L51"}]},
{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`Sink::write_stream` (and `write_stream_with_known_id`) call `from.read_exact` for `size` bytes but never\nverify there is no trailing data, and more importantly trust the caller-provided `size`. If `size` is larger\nthan the stream, `read_exact` errors (fine); but if `size` is smaller than the real object, the extra bytes\nare silently ignored and a hash is produced over truncated content. While `write_stream` is inherently\nsize-driven, there is no guard that `size` is consistent with the declared object, so a wrong `size` yields a\nplausible-but-wrong object id with no error.","fix":"Document the invariant that `size` must exactly match the stream length, or read one extra byte after `size` to assert the stream is exhausted, returning an error on mismatch.","locations":[{"ref":"gix-odb/src/sink.rs:28-62","code":"   28 |     fn write_stream(\n   29 |         &self,\n   30 |         kind: gix_object::Kind,\n   31 |         mut size: u64,\n   32 |         from: &mut dyn io::Read,\n   33 |     ) -> Result<gix_hash::ObjectId, gix_object::write::Error> {\n   34 |         let mut buf = [0u8; u16::MAX as usize];\n   35 |         let header = gix_object::encode::loose_header(kind, size);\n   36 | \n   37 |         let possibly_compress = |buf: &[u8]| -> io::Result<()> {\n   38 |             if let Some(compressor) = self.compressor.as_ref() {\n   39 |                 compressor.try_borrow_mut().expect(\"no recursion\").write_all(buf)?;\n   40 |             }\n   41 |             Ok(())\n   42 |         };\n   43 | \n   44 |         let mut hasher = gix_hash::hasher(self.object_hash);\n   45 |         hasher.update(&header);\n   46 |         possibly_compress(&header).map_err(Box::new)?;\n   47 | \n   48 |         while size != 0 {\n   49 |             let bytes = (size as usize).min(buf.len());\n   50 |             from.read_exact(&mut buf[..bytes]).map_err(Box::new)?;\n   51 |             hasher.update(&buf[..bytes]);\n   52 |             possibly_compress(&buf[..bytes]).map_err(Box::new)?;\n   53 |             size -= bytes as u64;\n   54 |         }\n   55 |         if let Some(compressor) = self.compressor.as_ref() {\n   56 |             let mut c = compressor.borrow_mut();\n   57 |             c.flush().map_err(Box::new)?;\n   58 |             c.reset();\n   59 |         }\n   60 | \n   61 |         Ok(hasher.try_finalize()?)\n   62 |     }","lines":35,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-odb/src/sink.rs#L28-L62"}]},
{"id":"API_5","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`File::entry()` rejects offsets with `if pack_offset > self.data.len()` (strictly greater), while the closely related `decompress_entry_from_data_offset_unchecked` uses `>= self.data.len()`. The `>` form allows `pack_offset == data.len()`, producing an empty slice that then fails one layer deeper in `from_bytes`. The behavior is safe but the inconsistent boundary condition is a latent trap for future edits and is harder to reason about than a uniform `>=` check.","fix":"Make both checks use `>=` (rejecting an offset equal to the data length) for consistency, since no valid entry can start at exactly `data.len()`.","locations":[{"ref":"gix-pack/src/data/file/decode/entry.rs:105-109","code":"  105 |         if pack_offset > self.data.len() {\n  106 |             return Err(data::entry::decode::Error::Corrupt {\n  107 |                 message: \"an entry offset pointing beyond pack data\",\n  108 |             });\n  109 |         }","lines":5,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-pack/src/data/file/decode/entry.rs#L105-L109"},{"ref":"gix-pack/src/data/file/decode/entry.rs:166-171","code":"  166 |         if offset >= self.data.len() {\n  167 |             return Err(data::entry::decode::Error::Corrupt {\n  168 |                 message: \"an entry data offset pointing beyond pack data\",\n  169 |             }\n  170 |             .into());\n  171 |         }","lines":6,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-pack/src/data/file/decode/entry.rs#L166-L171"}]},
{"id":"API_6","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"`Arguments::shallow`, `deepen`, `deepen_since`, `deepen_relative`, `deepen_not`, `filter`,\n`use_include_tag` all `debug_assert!(self.<feature>, ...)` and then silently no-op in release builds\nwhen the feature is not enabled (`if self.<feature> { ... }`). This means a caller invoking, e.g.,\n`args.shallow(id)` without server support gets a panic in debug but a silent drop in release - the\nrequested argument simply vanishes with no error, which can lead to a confusingly different\n(non-shallow) fetch result in production builds versus tests.","fix":"Either make these methods return a `Result`/error when the feature is unsupported, or document the\nsilent no-op behavior explicitly and ensure callers check the corresponding `can_use_*` predicate\nfirst. A consistent strategy (error vs. documented no-op) across all of them would remove the\ndebug/release behavioral divergence.","locations":[{"ref":"gix-protocol/src/fetch/arguments/mod.rs:122-164","code":"  122 |     pub fn shallow(&mut self, id: impl AsRef<gix_hash::oid>) {\n  123 |         debug_assert!(self.shallow, \"'shallow' feature required for 'shallow <id>'\");\n  124 |         if self.shallow {\n  125 |             self.prefixed(\"shallow \", id.as_ref());\n  126 |         }\n  127 |     }\n  128 |     /// Deepen the commit history by `depth` amount of commits.\n  129 |     pub fn deepen(&mut self, depth: usize) {\n  130 |         debug_assert!(self.shallow, \"'shallow' feature required for deepen\");\n  131 |         if self.shallow {\n  132 |             self.prefixed(\"deepen \", depth);\n  133 |         }\n  134 |     }\n  135 |     /// Deepen the commit history to include all commits from now to (and including) `seconds` as passed since UNIX epoch.\n  136 |     pub fn deepen_since(&mut self, seconds: gix_date::SecondsSinceUnixEpoch) {\n  137 |         debug_assert!(self.deepen_since, \"'deepen-since' feature required\");\n  138 |         if self.deepen_since {\n  139 |             self.prefixed(\"deepen-since \", seconds);\n  140 |         }\n  141 |     }\n  142 |     /// Deepen the commit history in a relative instead of absolute fashion.\n  143 |     pub fn deepen_relative(&mut self) {\n  144 |         debug_assert!(self.deepen_relative, \"'deepen-relative' feature required\");\n  145 |         if self.deepen_relative {\n  146 |             self.args.push(\"deepen-relative\".into());\n  147 |         }\n  148 |     }\n  149 |     /// Do not include commits reachable by the given `ref_path` when deepening the history.\n  150 |     pub fn deepen_not(&mut self, ref_path: &BStr) {\n  151 |         debug_assert!(self.deepen_not, \"'deepen-not' feature required\");\n  152 |         if self.deepen_not {\n  153 |             let mut line = BString::from(\"deepen-not \");\n  154 |             line.extend_from_slice(ref_path);\n  155 |             self.args.push(line);\n  156 |         }\n  157 |     }\n  158 |     /// Set the given filter `spec` when listing references.\n  159 |     pub fn filter(&mut self, spec: &str) {\n  160 |         debug_assert!(self.filter, \"'filter' feature required\");\n  161 |         if self.filter {\n  162 |             self.prefixed(\"filter \", spec);\n  163 |         }\n  164 |     }","lines":43,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-protocol/src/fetch/arguments/mod.rs#L122-L164"},{"ref":"gix-protocol/src/fetch/arguments/mod.rs:168-174","code":"  168 |     #[cfg(any(feature = \"async-client\", feature = \"blocking-client\"))]\n  169 |     pub fn use_include_tag(&mut self) {\n  170 |         debug_assert!(self.supports_include_tag, \"'include-tag' feature required\");\n  171 |         if self.supports_include_tag {\n  172 |             self.add_feature(\"include-tag\");\n  173 |         }\n  174 |     }","lines":7,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-protocol/src/fetch/arguments/mod.rs#L168-L174"}]},
{"id":"API_7","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"`collect_parents` in simple.rs calls `cache.as_ref().expect(\"parents iter is available, backed by\n`cache`\")`. This couples the function's correctness to the caller always passing a Some cache when\nthe parents iterator was obtained from the cache. The caller (next_by_commit_date / next_by_topology)\nsets `self.cache = None` on corruption and retries, but if any future caller passes a\ncache-backed `Parents` iter together with a None cache, this panics. The invariant is enforced only\nby an expect rather than the type system.","fix":"Pass the &Graph cache reference directly into collect_parents as a non-Option parameter so the invariant is encoded in the signature.","locations":[{"ref":"gix-traverse/src/commit/simple.rs:707-727","code":"  707 | fn collect_parents(\n  708 |     dest: &mut SmallVec<[(gix_hash::ObjectId, gix_date::SecondsSinceUnixEpoch); 2]>,\n  709 |     cache: Option<&gix_commitgraph::Graph>,\n  710 |     parents: gix_commitgraph::file::commit::Parents<'_>,\n  711 | ) -> bool {\n  712 |     dest.clear();\n  713 |     let cache = cache.as_ref().expect(\"parents iter is available, backed by `cache`\");\n  714 |     for parent_id in parents {\n  715 |         match parent_id {\n  716 |             Ok(pos) => dest.push({\n  717 |                 let parent = cache.commit_at(pos);\n  718 |                 (\n  719 |                     parent.id().to_owned(),\n  720 |                     parent.committer_timestamp() as gix_date::SecondsSinceUnixEpoch,\n  721 |                 )\n  722 |             }),\n  723 |             Err(_err) => return false,\n  724 |         }\n  725 |     }\n  726 |     true\n  727 | }","lines":21,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-traverse/src/commit/simple.rs#L707-L727"}]},
{"id":"API_8","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"add_entry() unwraps both the Option (extra_entries) and the channel send() with expect(). The send() expect message\nclaims \"Failure is impossible as thread blocks on the receiving end\", but the receiver lives on the background thread\nspawned in from_tree::run(); if that thread has already returned/panicked (e.g. due to a tree traversal error stored\nin the error slot), the receiver is dropped and send() returns Err, turning a recoverable producer error into a hard\npanic in caller code. add_entry_from_path() forwards to add_entry() and inherits this.","fix":"Handle a closed channel gracefully: ignore the send error (the consumer will observe the stored error / EOF) instead\nof expect(), or surface it as a returned Result so callers can react.","locations":[{"ref":"gix-worktree-stream/src/lib.rs:115-122","code":"  115 |     pub fn add_entry(&mut self, entry: AdditionalEntry) -> &mut Self {\n  116 |         self.extra_entries\n  117 |             .as_ref()\n  118 |             .expect(\"BUG: must not add entries after the start of entries traversal\")\n  119 |             .send(entry)\n  120 |             .expect(\"Failure is impossible as thread blocks on the receiving end\");\n  121 |         self\n  122 |     }","lines":8,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-worktree-stream/src/lib.rs#L115-L122"}]},
{"id":"API_9","type":"api_misuse","type_label":"Api Misuse","severity":"negligible","difficulty":"medium","description":"`prepare_external_driver` builds the command by string-splitting on `%` and concatenating quoted/raw substituted paths\ninto a single `BString`, then runs it via `command_may_be_shell_script()`. Paths are inserted with `gix_path::into_bstr`\nwithout shell quoting for `%O`/`%A`/`%B` (only `%P/%S/%X/%Y` use `gix_quote::single`). Tempfile paths are derived from the\nworktree dir, so the practical risk is low, but unquoted path interpolation into a shell-evaluated command line is a\nfragile pattern (spaces or special characters in the tempfile directory path could break the command).","fix":"Shell-quote the substituted `%O`/`%A`/`%B` paths as well, consistent with the other placeholders.","locations":[{"ref":"gix-merge/src/blob/platform/merge.rs:173-227","code":"  173 |                 let mut cmd = BString::from(Vec::with_capacity(merge_command.len()));\n  174 |                 let mut count = 0;\n  175 |                 for token in merge_command.split(|b| *b == b'%') {\n  176 |                     count += 1;\n  177 |                     let token = if count > 1 {\n  178 |                         match token.first() {\n  179 |                             Some(&b'O') => {\n  180 |                                 cmd.push_str(gix_path::into_bstr(&base_path).as_ref());\n  181 |                                 &token[1..]\n  182 |                             }\n  183 |                             Some(&b'A') => {\n  184 |                                 cmd.push_str(gix_path::into_bstr(&ours_path).as_ref());\n  185 |                                 &token[1..]\n  186 |                             }\n  187 |                             Some(&b'B') => {\n  188 |                                 cmd.push_str(gix_path::into_bstr(&theirs_path).as_ref());\n  189 |                                 &token[1..]\n  190 |                             }\n  191 |                             Some(&b'L') => {\n  192 |                                 let marker_size = self\n  193 |                                     .options\n  194 |                                     .text\n  195 |                                     .conflict\n  196 |                                     .marker_size()\n  197 |                                     .unwrap_or(Conflict::DEFAULT_MARKER_SIZE);\n  198 |                                 cmd.push_str(format!(\"{marker_size}\"));\n  199 |                                 &token[1..]\n  200 |                             }\n  201 |                             Some(&b'P') => {\n  202 |                                 cmd.push_str(gix_quote::single(self.current.rela_path));\n  203 |                                 &token[1..]\n  204 |                             }\n  205 |                             Some(&b'S') => {\n  206 |                                 cmd.push_str(gix_quote::single(ancestor.unwrap_or_default()));\n  207 |                                 &token[1..]\n  208 |                             }\n  209 |                             Some(&b'X') => {\n  210 |                                 cmd.push_str(gix_quote::single(current.unwrap_or_default()));\n  211 |                                 &token[1..]\n  212 |                             }\n  213 |                             Some(&b'Y') => {\n  214 |                                 cmd.push_str(gix_quote::single(other.unwrap_or_default()));\n  215 |                                 &token[1..]\n  216 |                             }\n  217 |                             Some(_other) => {\n  218 |                                 cmd.push(b'%');\n  219 |                                 token\n  220 |                             }\n  221 |                             None => b\"%\",\n  222 |                         }\n  223 |                     } else {\n  224 |                         token\n  225 |                     };\n  226 |                     cmd.extend_from_slice(token);\n  227 |                 }","lines":55,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-merge/src/blob/platform/merge.rs#L173-L227"}]},
{"id":"API_10","type":"api_misuse","type_label":"Api Misuse","severity":"negligible","difficulty":"medium","description":"`from_data` (output entry) and `compress_data` (input entry) match `std::io::ErrorKind::Other` to detect zlib errors and `unreachable!()` on any other error kind. This couples correctness to the exact error kind produced by the deflate writer; if the underlying zlib stream implementation ever surfaces a different `ErrorKind`, these become reachable panics. Since the writes are to in-memory `Vec`s this is unlikely, but the `unreachable!` is more brittle than necessary.","fix":"Treat any error from the in-memory deflate copy as a zlib/deflate error and return it, instead of asserting the error kind is `Other`.","locations":[{"ref":"gix-pack/src/data/output/entry/mod.rs:154-159","code":"  154 |                 if let Err(err) = std::io::copy(&mut &*obj.data, &mut out) {\n  155 |                     match err.kind() {\n  156 |                         std::io::ErrorKind::Other => return Err(Error::ZlibDeflate(err)),\n  157 |                         err => unreachable!(\"Should never see other errors than zlib, but got {:?}\", err),\n  158 |                     }\n  159 |                 }","lines":6,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-pack/src/data/output/entry/mod.rs#L154-L159"},{"ref":"gix-pack/src/data/input/entry.rs:60-67","code":"   60 |     if let Err(err) = std::io::copy(&mut &*obj.data, &mut out) {\n   61 |         match err.kind() {\n   62 |             std::io::ErrorKind::Other => return Err(input::Error::Io(err.into())),\n   63 |             err => {\n   64 |                 unreachable!(\"Should never see other errors than zlib, but got {:?}\", err)\n   65 |             }\n   66 |         }\n   67 |     }","lines":8,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-pack/src/data/input/entry.rs#L60-L67"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`gix::mailmap::parse(&buf)` is invoked three separate times over the same buffer: once to collect\nerrors, once to detect overwrites, and once more solely to `.count()` lines for the \"N lines OK\"\nmessage. The whole mailmap is re-parsed up to three times when a single pass with counters would\nsuffice.","fix":"Parse once (collect into a Vec) and reuse it for error counting, overwrite detection, and the line count.","locations":[{"ref":"gitoxide-core/src/mailmap.rs:16","code":"   16 |     for err in gix::mailmap::parse(&buf).filter_map(Result::err) {","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/mailmap.rs#L16"},{"ref":"gitoxide-core/src/mailmap.rs:22","code":"   22 |     for entry in gix::mailmap::parse(&buf).filter_map(Result::ok) {","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/mailmap.rs#L22"},{"ref":"gitoxide-core/src/mailmap.rs:36","code":"   36 |         writeln!(out, \"{} lines OK\", gix::mailmap::parse(&buf).count())?;","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/mailmap.rs#L36"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`Commit` (file::Commit) eagerly parses `root_tree_id`, `parent1`, `parent2`, `generation`, and `commit_timestamp` in `Commit::new`, despite the field comment stating 'We can parse the below fields lazily if needed.' Every `iter_commits()`/`commit_at()` constructs and fully decodes a commit even when the caller only wants, e.g., the id. For full-graph traversals (verify, traverse) this is fine, but for point lookups that only need a subset it does redundant work. The comment also misleads readers into thinking parsing is lazy when it is not.","fix":"Either implement the lazy parsing the comment promises (store the raw `&[u8]` slice and decode on demand) or update the comment to reflect that parsing is eager.","locations":[{"ref":"gix-commitgraph/src/file/commit.rs:16-46","code":"   16 |     pos: file::Position,\n   17 |     // We can parse the below fields lazily if needed.\n   18 |     commit_timestamp: u64,\n   19 |     generation: u32,\n   20 |     parent1: ParentEdge,\n   21 |     parent2: ParentEdge,\n   22 |     root_tree_id: &'a gix_hash::oid,\n   23 | }\n   24 | \n   25 | #[inline]\n   26 | fn read_u32(b: &[u8]) -> u32 {\n   27 |     u32::from_be_bytes(b.try_into().unwrap())\n   28 | }\n   29 | \n   30 | impl<'a> Commit<'a> {\n   31 |     pub(crate) fn new(file: &'a File, pos: file::Position) -> Self {\n   32 |         let bytes = file.commit_data_bytes(pos);\n   33 |         Commit {\n   34 |             file,\n   35 |             pos,\n   36 |             root_tree_id: gix_hash::oid::from_bytes_unchecked(&bytes[..file.hash_len]),\n   37 |             parent1: ParentEdge::from_raw(read_u32(&bytes[file.hash_len..][..4])),\n   38 |             parent2: ParentEdge::from_raw(read_u32(&bytes[file.hash_len + 4..][..4])),\n   39 |             // TODO: Add support for corrected commit date offset overflow.\n   40 |             //      See https://github.com/git/git/commit/e8b63005c48696a26f976f5f9b0ccaf1983e439d and\n   41 |             //          https://github.com/git/git/commit/f90fca638e99a031dce8e3aca72427b2f9b4bb38 for more details and hints at a test.\n   42 |             generation: read_u32(&bytes[file.hash_len + 8..][..4]) >> 2,\n   43 |             commit_timestamp: u64::from_be_bytes(bytes[file.hash_len + 8..][..8].try_into().unwrap())\n   44 |                 & 0x0003_ffff_ffff,\n   45 |         }\n   46 |     }","lines":31,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-commitgraph/src/file/commit.rs#L16-L46"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`resolve_includes_recursive` clones the entire `section_order` deque on every recursion level\n(`target_config.section_order.clone().into_iter()`) just to iterate it while the body may mutate\n`target_config`. For configs with many sections and includes this allocates a fresh Vec/deque at each\nnesting level. The clone is only needed to avoid borrow conflicts; an index-based loop over a snapshot\nof ids, or collecting ids into a reused buffer, would avoid repeated full clones.","fix":"Snapshot the section ids once into a reusable `Vec<SectionId>` (or iterate by index against a stable\nlength captured up front) instead of cloning the whole `section_order` collection on every recursive call.","locations":[{"ref":"gix-config/src/file/includes/mod.rs:63","code":"   63 |     for id in target_config.section_order.clone().into_iter() {","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-config/src/file/includes/mod.rs#L63"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"On every call to `Pipeline::convert_to_git`, an EOL-conversion probe is run unconditionally against the\n2-byte literal `b\"\\r\\n\"` purely to decide `would_convert_eol`, before it is even known whether a driver,\nencoding, or ident filter is involved. This recomputes `Stats::from_bytes` and the full digest/eol decision\nlogic for every single file even when the result is never needed (e.g. a path with no relevant attributes\nand no driver). The cost is small per call but it is on the hot path of converting every file to git.","fix":"Compute `would_convert_eol` lazily, only when the driver/encoding/ident branch actually needs it, or derive it directly from `digest`/config without running a conversion probe.","locations":[{"ref":"gix-filter/src/pipeline/convert.rs:118-129","code":"  118 |         let mut in_src_buffer = false;\n  119 |         // this is just an approximation, but it's as good as it gets without reading the actual input.\n  120 |         let would_convert_eol = eol::convert_to_git(\n  121 |             b\"\\r\\n\",\n  122 |             digest,\n  123 |             &mut self.bufs.dest,\n  124 |             &mut |_| Ok(None),\n  125 |             eol::convert_to_git::Options {\n  126 |                 round_trip_check: None,\n  127 |                 config: self.options.eol_config,\n  128 |             },\n  129 |         )?;","lines":12,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-filter/src/pipeline/convert.rs#L118-L129"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`empty_depth_first` re-reads directories repeatedly: when a directory has subdir entries it pushes the dir back on the stack and appends children on top; when the parent is popped again it re-runs `read_dir` to recount, reopening the directory handle. For deep/wide trees each directory is re-scanned once per level beneath it, giving near-quadratic I/O.","fix":"Push a sentinel/marker after children so the parent is finalized once without re-reading, or collect entries once and delete bottom-up.","locations":[{"ref":"gix-fs/src/dir/remove.rs:95-111","code":"   95 |     while let Some(dir_to_delete) = stack.pop() {\n   96 |         let mut num_entries = 0;\n   97 |         for entry in std::fs::read_dir(&dir_to_delete)? {\n   98 |             num_entries += 1;\n   99 |             let entry = entry?;\n  100 |             if entry.file_type()?.is_dir() {\n  101 |                 next_to_push.push(entry.path());\n  102 |             } else {\n  103 |                 return Err(std::io::Error::other(\"Directory not empty\"));\n  104 |             }\n  105 |         }\n  106 |         if num_entries == 0 {\n  107 |             std::fs::remove_dir(&dir_to_delete)?;\n  108 |         } else {\n  109 |             stack.push(dir_to_delete);\n  110 |             stack.append(&mut next_to_push);\n  111 |         }","lines":17,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-fs/src/dir/remove.rs#L95-L111"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`prev_path = entries.last().map(|e| (e.path.clone(), &mut delta_buf))` is recomputed every\niteration by re-reading `entries.last()`, even though `entry.path` is already known before\nit is pushed (it is the just-built `path_range`). Re-borrowing `entries.last()` each loop is\nslightly wasteful in the per-entry hot loop. Minor.","fix":"Carry the just-decoded path range forward directly instead of re-reading `entries.last()`.","locations":[{"ref":"gix-index/src/decode/entries.rs:122","code":"  122 |         prev_path = entries.last().map(|e| (e.path.clone(), &mut delta_buf));","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-index/src/decode/entries.rs#L122"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"In the V4 delta-path decode, `load_one` reconstructs the shared prefix via a temporary\n`buf`: it resizes `buf`, copies the prefix from `path_backing` into `buf`, then appends\n`buf` back into `path_backing`. This double copy (path_backing -> buf -> path_backing) is\nunnecessary; the prefix bytes already live in `path_backing` and could be copied within it\n(e.g. `extend_from_within(prev_path.start..end)`), avoiding the intermediate buffer and an\nextra memcpy per V4 entry on the hot decode path.","fix":"Use `path_backing.extend_from_within(prev_path.start..end)` instead of round-tripping through `buf`.","locations":[{"ref":"gix-index/src/decode/entries.rs:162-169","code":"  162 |         if let Some((prev_path, buf)) = prev_path_and_buf {\n  163 |             let end = prev_path.end.checked_sub(strip_len.try_into().ok()?)?;\n  164 |             let copy_len = end.checked_sub(prev_path.start)?;\n  165 |             if copy_len > 0 {\n  166 |                 buf.resize(copy_len, 0);\n  167 |                 buf.copy_from_slice(&path_backing[prev_path.start..end]);\n  168 |                 path_backing.extend_from_slice(buf);\n  169 |             }","lines":8,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-index/src/decode/entries.rs#L162-L169"}]},
{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`match merge_bases.clone()` clones the entire `Option<NonEmpty<ObjectId>>` only to read `.len()`/`.first()` in the\nread-only arms; `merge_bases` is still owned and later returned in the `Outcome`. The clone is avoidable by matching on\na reference and only taking ownership in the branch that actually needs it.","fix":"Match on `merge_bases.as_ref()`/`&merge_bases` for the read-only arms; convert to owned only in the multi-base branch.","locations":[{"ref":"gix-merge/src/commit/function.rs:62","code":"   62 |     let (merge_base_tree_id, ancestor_name): (_, Cow<'_, str>) = match merge_bases.clone() {","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-merge/src/commit/function.rs#L62"}]},
{"id":"PERF_9","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"`Sink::write_stream` and `write_stream_with_known_id` allocate a fixed 64 KiB (`[0u8; u16::MAX as usize]`)\nbuffer on the stack on every call. This enlarges the stack frame considerably for every object written to the\nsink (used during integrity verification of every loose object) and is zero-initialized each time. A smaller\nbuffer (e.g. 8-16 KiB) or a reused heap buffer would be friendlier to the stack and to cache.","fix":"Use a smaller fixed buffer (e.g. `[0u8; 8 * 1024]`) or a reusable heap-allocated buffer instead of a 64 KiB stack array zero-initialized per call.","locations":[{"ref":"gix-odb/src/sink.rs:34","code":"   34 |         let mut buf = [0u8; u16::MAX as usize];","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-odb/src/sink.rs#L34"},{"ref":"gix-odb/src/sink.rs:71","code":"   71 |         let mut buf = [0u8; u16::MAX as usize];","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-odb/src/sink.rs#L71"}]},
{"id":"PERF_10","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`collect_snapshot` and the `Err(_nothing_more_to_load)` arm of `load_next_index` spin with bare\n`std::thread::yield_now()` loops while waiting for `num_indices_currently_being_loaded` to reach zero. Under\ncontention (many threads opening a repo at once) this is a busy-wait that burns CPU rather than parking the\nthread. The code itself flags this with `TODO: potentially hot loop - could this be a condition variable?`.","fix":"Replace the yield-spin loops with a condition variable / parking primitive that is notified when the in-flight index load count is decremented, to avoid burning a core while waiting.","locations":[{"ref":"gix-odb/src/store_impls/dynamic/load_index.rs:163-177","code":"  163 |                     Err(_nothing_more_to_load) => {\n  164 |                         // There can be contention as many threads start working at the same time and take all the\n  165 |                         // slots to load indices for. Some threads might just be left-over and have to wait for something\n  166 |                         // to change.\n  167 |                         // TODO: potentially hot loop - could this be a condition variable?\n  168 |                         // This is a timing-based fix for the case that the `num_indices_being_loaded` isn't yet incremented,\n  169 |                         // and we might break out here without actually waiting for the loading operation. Then we'd fail to\n  170 |                         // observe a change and the underlying handler would not have all the indices it needs at its disposal.\n  171 |                         // Yielding means we will definitely loose enough time to observe the ongoing operation,\n  172 |                         // or its effects.\n  173 |                         std::thread::yield_now();\n  174 |                         while index.num_indices_currently_being_loaded.load(Ordering::SeqCst) != 0 {\n  175 |                             std::thread::yield_now();\n  176 |                         }\n  177 |                         break 'retry_with_next_slot_index;","lines":15,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-odb/src/store_impls/dynamic/load_index.rs#L163-L177"},{"ref":"gix-odb/src/store_impls/dynamic/load_index.rs:676-680","code":"  676 |         loop {\n  677 |             if index.num_indices_currently_being_loaded.deref().load(Ordering::SeqCst) != 0 {\n  678 |                 std::thread::yield_now();\n  679 |                 continue;\n  680 |             }","lines":5,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-odb/src/store_impls/dynamic/load_index.rs#L676-L680"}]},
{"id":"PERF_11","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"`MatchGroup::match_lhs` / `match_rhs` deduplicate output by hashing each\n`Mapping` with the default SipHash hasher and storing only the 64-bit hash in a\n`BTreeSet<u64>`. This relies on hash collisions never occurring to avoid\ndropping distinct mappings (a correctness hazard, not just performance), and\nre-hashes every mapping. For large remote ref lists this is both a silent\ncollision risk and slower than necessary.","fix":"Deduplicate on the actual `Mapping` value (e.g. a `HashSet<Mapping>` or sort +\ndedup) so collisions cannot silently discard distinct results; if memory is the\nconcern, store a stronger digest. Either way avoid relying on truncated\nSipHash equality for correctness.","locations":[{"ref":"gix-refspec/src/match_group/mod.rs:44-49","code":"   44 |         let mut seen = BTreeSet::default();\n   45 |         let mut push_unique = |mapping| {\n   46 |             if seen.insert(calculate_hash(&mapping)) {\n   47 |                 out.push(mapping);\n   48 |             }\n   49 |         };","lines":6,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-refspec/src/match_group/mod.rs#L44-L49"},{"ref":"gix-refspec/src/match_group/mod.rs:135-139","code":"  135 |         let mut push_unique = |mapping| {\n  136 |             if seen.insert(calculate_hash(&mapping)) {\n  137 |                 out.push(mapping);\n  138 |             }\n  139 |         };","lines":5,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-refspec/src/match_group/mod.rs#L135-L139"},{"ref":"gix-refspec/src/match_group/mod.rs:189-194","code":"  189 | fn calculate_hash<T: std::hash::Hash>(t: &T) -> u64 {\n  190 |     use std::hash::Hasher;\n  191 |     let mut s = std::collections::hash_map::DefaultHasher::new();\n  192 |     t.hash(&mut s);\n  193 |     s.finish()\n  194 | }","lines":6,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-refspec/src/match_group/mod.rs#L189-L194"}]},
