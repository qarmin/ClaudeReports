{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`Offset::shifted_range` for the `Added` case computes `range.start - added` and `range.end - added` on `u32`.\nThis is only guarded by a `debug_assert!(range.start >= *added)`. In release builds (assertions stripped), if the\naccumulated `Added` offset exceeds a hunk's start line, this subtraction underflows and produces a garbage range\n(huge u32), corrupting subsequent blame line mapping and very likely causing OOB token indexing / panics downstream\n(e.g. in `Outcome::entries_with_lines` / the debug source-vs-blamed assertion). `shift_by` is invoked throughout\n`process_change` with offsets accumulated from prior added/deleted changes, so a hunk close to the start of the file\nwith a large preceding net-addition offset can trigger it.","fix":"Use checked/saturating subtraction and treat underflow as a real error rather than relying on a debug_assert; e.g. `range.start.checked_sub(*added)` and propagate/clamp instead of wrapping.","locations":[{"ref":"gix-blame/src/types.rs:302-316","code":"  302 |     pub fn shifted_range(&self, range: &Range<u32>) -> Range<u32> {\n  303 |         match self {\n  304 |             Offset::Added(added) => {\n  305 |                 debug_assert!(range.start >= *added, \"{self:?} {range:?}\");\n  306 |                 Range {\n  307 |                     start: range.start - added,\n  308 |                     end: range.end - added,\n  309 |                 }\n  310 |             }\n  311 |             Offset::Deleted(deleted) => Range {\n  312 |                 start: range.start + deleted,\n  313 |                 end: range.end + deleted,\n  314 |             },\n  315 |         }\n  316 |     }","lines":15,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-blame/src/types.rs#L302-L316"}]},
{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`serde::Serialize for Integer` shifts the raw value left by the suffix bit-offset (10/20/30) with an\nunchecked `<<`. For large user-supplied integers with a `k`/`m`/`g` suffix (e.g. a value near `i64::MAX`\nfollowed by `g`), this overflows: panic in debug builds, silently wrong/truncated number in release.\nThis is inconsistent with the normal access path `Integer::to_decimal()`, which uses `checked_mul` and\nreports an overflow error. Serializing a parsed-but-overflowing config integer should not panic.","fix":"Use the checked path: `self.to_decimal().ok_or_else(|| serde::ser::Error::custom(\"integer overflow\"))?`\nand serialize that, or at minimum `self.value.checked_shl(suffix.bitwise_offset() as u32)` with error\nhandling. Do not use a raw `<<`.","locations":[{"ref":"gix-config-value/src/integer.rs:42-46","code":"   42 |         if let Some(suffix) = self.suffix {\n   43 |             serializer.serialize_i64(self.value << suffix.bitwise_offset())\n   44 |         } else {\n   45 |             serializer.serialize_i64(self.value)\n   46 |         }","lines":5,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-config-value/src/integer.rs#L42-L46"}]},
{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"The directory-create retry loop subtracts from public `usize` retry fields without guarding against zero: `self.retries.on_create_directory_failure -= 1;` (line 157), `self.retries.to_create_entire_directory -= 1;` (line 160), `self.retries.on_interrupt -= 1;` (line 178). `Iter::new_with_retries` accepts an arbitrary `Retries` struct with public fields, so a caller passing any field as 0 triggers an arithmetic underflow panic in debug builds, and in release wraps to `usize::MAX`, defeating the retry limit entirely (a release-mode logic error / effectively unbounded retries).","fix":"Use `checked_sub` and treat `None` as permanent failure, or validate/clamp `Retries` at construction.","locations":[{"ref":"gix-fs/src/dir/create.rs:159-184","code":"  159 |                     NotFound => {\n  160 |                         self.retries.on_create_directory_failure -= 1;\n  161 |                         if let State::CurrentlyCreatingDirectories = self.state {\n  162 |                             self.state = State::SearchingUpwardsForExistingDirectory;\n  163 |                             self.retries.to_create_entire_directory -= 1;\n  164 |                             if self.retries.to_create_entire_directory < 1 {\n  165 |                                 return self.permanent_failure(dir, NotFound);\n  166 |                             }\n  167 |                             self.retries.on_create_directory_failure =\n  168 |                                 self.original_retries.on_create_directory_failure;\n  169 |                         }\n  170 |                         if self.retries.on_create_directory_failure < 1 {\n  171 |                             return self.permanent_failure(dir, NotFound);\n  172 |                         }\n  173 |                         self.cursors.push(dir);\n  174 |                         self.cursors.push(match dir.parent() {\n  175 |                             None => return self.permanent_failure(dir, InvalidInput),\n  176 |                             Some(parent) => parent,\n  177 |                         });\n  178 |                         self.intermediate_failure(dir, err)\n  179 |                     }\n  180 |                     Interrupted => {\n  181 |                         self.retries.on_interrupt -= 1;\n  182 |                         if self.retries.on_interrupt <= 1 {\n  183 |                             return self.permanent_failure(dir, Interrupted);\n  184 |                         }","lines":26,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-fs/src/dir/create.rs#L159-L184"}]},
{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"`non_common_revs` is a `usize` that is decremented in several places without a guarantee that it is\nnon-zero. In `mark_common` the seed commit is first marked COMMON (line 56-58 decrements once if it\nwas SEEN && !POPPED), and then the same id is pushed into the local queue and popped in the loop;\nparents are decremented again at line 77-79. The various `self.non_common_revs -= 1` operations\nrely on subtle invariants (SEEN set, POPPED unset, etc.). If any of those invariants is broken by\nout-of-order or duplicated input (e.g. the same id supplied both as known_common and as a tip, or\nACKs for commits in unexpected states), the `usize` underflows, panicking in debug and wrapping to a\nhuge value in release, which then makes `next_have` loop far longer than intended (it stops only when\n`non_common_revs == 0`). The same decrement-without-floor pattern exists in `skipping.rs`.","fix":"Use saturating_sub or assert the invariant before decrementing, e.g. `self.non_common_revs = self.non_common_revs.saturating_sub(1);` to avoid wrap/panic on unexpected input.","locations":[{"ref":"gix-negotiate/src/consecutive.rs:56-58","code":"   56 |                 if commit.data.flags.contains(Flags::SEEN) && !commit.data.flags.contains(Flags::POPPED) {\n   57 |                     self.non_common_revs -= 1;\n   58 |                 }","lines":3,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-negotiate/src/consecutive.rs#L56-L58"},{"ref":"gix-negotiate/src/consecutive.rs:78-80","code":"   78 |                             if prev_flags.contains(Flags::SEEN) && !prev_flags.contains(Flags::POPPED) {\n   79 |                                 self.non_common_revs -= 1;\n   80 |                             }","lines":3,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-negotiate/src/consecutive.rs#L78-L80"},{"ref":"gix-negotiate/src/skipping.rs:46-49","code":"   46 |                 if let Some(commit) = graph.get_or_insert_commit(id, |entry| {\n   47 |                     if !entry.flags.contains(Flags::POPPED) {\n   48 |                         self.non_common_revs -= 1;\n   49 |                     }","lines":4,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-negotiate/src/skipping.rs#L46-L49"}]},
{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"medium","description":"In the `skipping` negotiation algorithm, the TTL (time-to-live) of a commit grows multiplicatively\nas `entry.original_ttl * 3 / 2 + 1` on every generation that is not COMMON/ADVERTISED. `original_ttl`\nand `ttl` are `u16` (see `Metadata` in lib.rs). For a sufficiently deep, single-line history the\nrepeated `* 3 / 2 + 1` growth overflows `u16` (it crosses 65535 after roughly 27 hops because each\nstep multiplies by ~1.5). On overflow this panics in debug builds and wraps to a small/garbage value\nin release builds, corrupting the skip schedule. The multiplication `entry.original_ttl * 3` itself\ncan also overflow `u16` before the division. Git uses `int` here, so it never hits this limit in\npractice. A saturating/widening computation (e.g. compute in `u32`/`usize` and clamp) is needed.","fix":"Compute the new TTL in a wider integer type and saturate into u16, e.g. `let nt = (entry.original_ttl as u32 * 3 / 2 + 1).min(u16::MAX as u32) as u16;`.","locations":[{"ref":"gix-negotiate/src/skipping.rs:98-103","code":"   98 |             let new_original_ttl = if entry.ttl > 0 {\n   99 |                 entry.original_ttl\n  100 |             } else {\n  101 |                 entry.original_ttl * 3 / 2 + 1\n  102 |             };\n  103 |             let new_ttl = if entry.ttl > 0 { entry.ttl - 1 } else { new_original_ttl };","lines":6,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-negotiate/src/skipping.rs#L98-L103"},{"ref":"gix-negotiate/src/lib.rs:50-58","code":"   50 | pub struct Metadata {\n   51 |     /// Used by `skipping`.\n   52 |     /// Only used if commit is not COMMON\n   53 |     pub original_ttl: u16,\n   54 |     /// Used by `skipping`.\n   55 |     pub ttl: u16,\n   56 |     /// Additional information about each commit\n   57 |     pub flags: Flags,\n   58 | }","lines":9,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-negotiate/src/lib.rs#L50-L58"}]},
{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"Pack statistics divide by `total_compressed_entries_size` and `pack_size` (compression_ratio,\ndelta_compression_ratio, delta gain, pack overhead). For an empty/degenerate pack these denominators\ncan be 0, yielding NaN/inf in the printed statistics. Float division so no panic, but the output is\nmisleading.","fix":"Guard against zero denominators and print 0 / n/a when no data is present.","locations":[{"ref":"gitoxide-core/src/pack/verify.rs:265-266","code":"  265 |     let compression_ratio = stats.total_decompressed_entries_size as f64 / stats.total_compressed_entries_size as f64;\n  266 |     let delta_compression_ratio = stats.total_object_size as f64 / stats.total_compressed_entries_size as f64;","lines":2,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/pack/verify.rs#L265-L266"},{"ref":"gitoxide-core/src/pack/verify.rs:273-274","code":"  273 |         \"delta gain\", delta_compression_ratio / compression_ratio,\n  274 |         \"pack overhead\", (1.0 - (stats.total_compressed_entries_size as f64 / stats.pack_size as f64)) * 100.0,","lines":2,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/pack/verify.rs#L273-L274"}]},
{"id":"OVF_8","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"The gzip header mtime is written as `mtime as u32` where `mtime` is an `i64` (`SecondsSinceUnixEpoch`). For timestamps after 2106-02-07 (or negative pre-1970 values) this silently truncates/wraps, embedding a wrong modification time into the produced `.tar.gz` archive.","fix":"Clamp/validate the value into `u32` range (e.g. `mtime.clamp(0, u32::MAX as i64) as u32`) or surface an error for out-of-range timestamps.","locations":[{"ref":"gix-archive/src/write.rs:70","code":"   70 |                                     let gz = flate2::GzBuilder::new().mtime(mtime as u32).write(","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-archive/src/write.rs#L70"}]},
{"id":"OVF_9","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`header.set_mtime(mtime_seconds_since_epoch as u64)` casts an `i64` to `u64`. A negative modification time (pre-1970) becomes an enormous positive u64 in the tar header rather than being clamped or rejected, producing a corrupt/nonsensical mtime field.","fix":"Clamp negative values to 0 (`mtime_seconds_since_epoch.max(0) as u64`) or validate the range.","locations":[{"ref":"gix-archive/src/write.rs:304","code":"  304 |     header.set_mtime(mtime_seconds_since_epoch as u64);","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-archive/src/write.rs#L304"}]},
{"id":"OVF_10","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`out.seen_entries` (a `u32`, defined in walk/mod.rs Outcome) is incremented with\n`removed_without_emitting as u32`, where `removed_without_emitting` is a `usize`. For a\ndirectory with more than u32::MAX collapsed-but-not-emitted entries this silently wraps.\nThis is inconsistent with the rest of the counting (`seen_entries += 1` elsewhere) and is a\nlossy cast on a filesystem-derived count. 4 billion entries in one directory is unrealistic,\nhence low severity.","fix":"Make `seen_entries` a usize, or use saturating add / `u32::try_from(...).unwrap_or(u32::MAX)`.","locations":[{"ref":"gix-dir/src/walk/readdir.rs:406","code":"  406 |         out.seen_entries += removed_without_emitting as u32;","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-dir/src/walk/readdir.rs#L406"}]},
{"id":"OVF_11","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`strip_base_handle_recompute_basename_pos` computes `let pos = pos - base.len();` without a checked\nsubtraction. It relies on the invariant that, once the base has been confirmed to be a prefix of\n`relative_path` (the `strip_prefix`/`eq_ignore_ascii_case` checks just above), any provided `basename_pos`\n(the position just after the last `/`) is `>= base.len()` because `base` always ends in `/`. The invariant\nholds for all current callers, but the raw subtraction will silently wrap in release builds (and panic in\ndebug) if a caller ever passes a `basename_pos` that points inside the base, e.g. via the public\n`gix_glob::search::pattern::strip_base_handle_recompute_basename_pos` free function which performs no such\nvalidation of the caller-supplied `basename_pos`.","fix":"Use `pos.checked_sub(base.len())` and handle/`debug_assert!` the under-base case explicitly.","locations":[{"ref":"gix-glob/src/search/pattern.rs:172-175","code":"  172 |         basename_pos.and_then(|pos| {\n  173 |             let pos = pos - base.len();\n  174 |             (pos != 0).then_some(pos)\n  175 |         }),","lines":4,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-glob/src/search/pattern.rs#L172-L175"}]},
{"id":"OVF_12","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`IndentHeuristic::best_slider_end` computes `hunk.start - 1` on a `u32` without guarding against\n`hunk.start == 0`. If a pure-insertion hunk can ever reach this code path with `start == 0`, the subtraction\nunderflows (panic in debug builds, wrap to `u32::MAX` in release, which then makes `top_slider_end` huge and\ncorrupts the subsequent `top_slider_end - group_size` / range computations). The surrounding postprocessor\ncurrently appears to avoid passing `start == 0` here (a `continue` guards the equal-earliest-end case), but the\narithmetic itself is unguarded and the `// TODO: why is this needed` comment shows the invariant is not\nunderstood by the maintainers. This is vendored algorithm code but the modification removed the original safety\ncontext.","fix":"Use saturating arithmetic, e.g. `top_slider_end = top_slider_end.max(hunk.start.saturating_sub(1))`, and add a\ndebug assertion documenting that `hunk.start > 0` is expected here.","locations":[{"ref":"gix-imara-diff/src/slider_heuristic.rs:79-84","code":"   79 |         if top_slider_end < hunk.start - 1 {\n   80 |             top_slider_end = hunk.start - 1;\n   81 |         }\n   82 |         if hunk.end > top_slider_end + MAX_SLIDING {\n   83 |             top_slider_end = hunk.end - MAX_SLIDING;\n   84 |         }","lines":6,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-imara-diff/src/slider_heuristic.rs#L79-L84"}]},
{"id":"OVF_13","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`marker_size_multiplier` is a `u8` and is incremented with `options.marker_size_multiplier += 1` once per merge-base\nprocessed in the `while let Some(next_commit_id) = others.pop()` loop (and the routine recurses via `crate::commit`).\nWith more than 255 merge-bases (attacker-influenceable via crafted history) this overflows: debug builds panic, release\nbuilds wrap to 0, silently changing conflict-marker sizing.","fix":"Use `options.marker_size_multiplier = options.marker_size_multiplier.saturating_add(1);`.","locations":[{"ref":"gix-merge/src/commit/virtual_merge_base.rs:77","code":"   77 |             options.marker_size_multiplier += 1;","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-merge/src/commit/virtual_merge_base.rs#L77"}]},
{"id":"OVF_14","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`EntryMode::extract_from_bytes` slow path accumulates octal digits into a `u16` with `mode = (mode << 3) + b` and only bails with `if idx > 6 { return None; }` *after* the shift for index 6 has already executed. This allows up to 7 octal digits (indices 0..=6) to be folded into `mode` before the 8th digit triggers the error. Seven octal digits need 21 bits, so `mode << 3` silently truncates the high bits in a `u16`, producing a wrong mode instead of rejecting the input. The happy path correctly takes exactly 6 digits, so the two paths disagree on what is a valid mode length.","fix":"Reject when more than 6 octal digits are seen before the shift, i.e. move/adjust the `if idx >= 6` (not `> 6`) check to run before `mode = (mode << 3) + b`, mirroring the 6-digit limit enforced by the happy path.","locations":[{"ref":"gix-object/src/tree/mod.rs:146-164","code":"  146 |             while idx < i.len() {\n  147 |                 let b = i[idx].wrapping_sub(b'0') as u16;\n  148 |                 // Delimiter, return what we got\n  149 |                 if b == b' '.wrapping_sub(b'0') as u16 {\n  150 |                     space_pos = idx;\n  151 |                     break;\n  152 |                 }\n  153 |                 // Not a pure octal input.\n  154 |                 // Performance matters here, so `!(b'0'..=b'7').contains(&b)` won't do.\n  155 |                 if b > 7 {\n  156 |                     return None;\n  157 |                 }\n  158 |                 // More than 6 octal digits we must have hit the delimiter or the input was malformed.\n  159 |                 if idx > 6 {\n  160 |                     return None;\n  161 |                 }\n  162 |                 mode = (mode << 3) + b;\n  163 |                 idx += 1;\n  164 |             }","lines":19,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-object/src/tree/mod.rs#L146-L164"}]},
{"id":"OVF_15","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`describe()` casts the committer timestamp to `u32` for use as the priority-queue key\n(`parent_commit_date as u32` and `CommitTime = u32`). `committer_timestamp` is a signed seconds\nvalue (`SecondsSinceUnixEpoch`, i64). Commits with timestamps before the unix epoch (negative) or\nbeyond year 2106 (> u32::MAX) silently wrap to a wrong u32 key, reordering the date-priority queue\nand producing an incorrect `depth`/candidate selection. The `as u32` cast is lossy and unchecked.","fix":"Use the native i64 commit time for the queue key (as the merge_base and simple traversals do) instead of truncating to u32.","locations":[{"ref":"gix-revision/src/describe.rs:296-315","code":"  296 |     fn parents_by_date_onto_queue_and_track_names(\n  297 |         graph: &mut Graph<'_, '_, Flags>,\n  298 |         queue: &mut PriorityQueue<CommitTime, gix_hash::ObjectId>,\n  299 |         commit: gix_hash::ObjectId,\n  300 |         commit_flags: Flags,\n  301 |         first_parent: bool,\n  302 |     ) -> Result<(), Exn<Error>> {\n  303 |         graph\n  304 |             .insert_parents(\n  305 |                 &commit,\n  306 |                 &mut |parent_id, parent_commit_date| {\n  307 |                     queue.insert(parent_commit_date as u32, parent_id);\n  308 |                     commit_flags\n  309 |                 },\n  310 |                 &mut |_parent_id, flags| *flags |= commit_flags,\n  311 |                 first_parent,\n  312 |             )\n  313 |             .or_raise(|| message!(\"could not insert parents of commit {} into graph\", commit.to_hex()))?;\n  314 |         Ok(())\n  315 |     }","lines":20,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-revision/src/describe.rs#L296-L315"},{"ref":"gix-revision/src/describe.rs:354-355","code":"  354 | /// The timestamp for the creation date of a commit in seconds since unix epoch.\n  355 | type CommitTime = u32;","lines":2,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-revision/src/describe.rs#L354-L355"}]},
{"id":"OVF_16","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"`compute_indegrees_to_depth`/`expand_topo_walk` decrement the indegree with `*i -= 1` where `i: i32`.\nThe indegree is initialized to 1 for tips/ends and to 2 in `indegree_walk_step` (or_insert(2)), then\ndecremented in `expand_topo_walk`. If the topological state is inconsistent (e.g. a commit reached\nmore times via expand than its computed indegree, which can happen with corrupt commit-graphs or\ncycles), `*i` can go negative without bound; the loop only special-cases `*i != 1`, so a value that\nskips past 1 (e.g. from 1 to 0 to -1) never re-enters the queue and the commit is silently dropped\nfrom the output. There is no guard that indegree stays >= 0.","fix":"Add a sanity check that `*i >= 1` before decrementing (returning MissingIndegreeUnexpected or similar) to detect inconsistent graph state instead of silently dropping commits.","locations":[{"ref":"gix-traverse/src/commit/topo/iter.rs:128-132","code":"  128 |             let i = self.indegrees.get_mut(&pid).ok_or(Error::MissingIndegreeUnexpected)?;\n  129 |             *i -= 1;\n  130 |             if *i != 1 {\n  131 |                 continue;\n  132 |             }","lines":5,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-traverse/src/commit/topo/iter.rs#L128-L132"},{"ref":"gix-traverse/src/commit/topo/iter.rs:72-73","code":"   72 |             for (id, gen_time) in parents {\n   73 |                 self.indegrees.entry(id).and_modify(|e| *e += 1).or_insert(2);","lines":2,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-traverse/src/commit/topo/iter.rs#L72-L73"}]},
{"id":"OVF_17","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"negligible","difficulty":"easy","description":"`bytes_written` (u64) is cast to usize for a throughput display string, truncating on 32-bit targets\nfor checkouts exceeding 4 GiB. Cosmetic only.","fix":"Format bytes via a u64-aware path instead of casting to usize.","locations":[{"ref":"gitoxide-core/src/index/checkout.rs:132","code":"  132 |             .display(bytes_written as usize, None, None)","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/index/checkout.rs#L132"}]},
{"id":"OVF_18","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"negligible","difficulty":"easy","description":"`d.as_secs()` (u64) is cast to `SecondsSinceUnixEpoch` (i64) with `as`, which wraps for absurdly large\ntimestamps. Practically unreachable, but it is a lossy cast masking the conversion.","fix":"Use `i64::try_from(d.as_secs()).unwrap_or_default()`.","locations":[{"ref":"gitoxide-core/src/repository/archive.rs:70","code":"   70 |                     .unwrap_or_default() as gix::date::SecondsSinceUnixEpoch","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/repository/archive.rs#L70"}]},
{"id":"OVF_19","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"negligible","difficulty":"easy","description":"`estimate_tokens` for byte/bstr/str line sources computes `self.0.len() * 20` in `usize` before dividing by the\nsampled line length. For very large inputs (>~922 PB on 64-bit, but already >107 MB on 32-bit targets) this\nmultiplication overflows. The result is only an allocation-size estimate, so the impact is a bad pre-allocation\n(panic on overflow in debug, wrap in release), not a correctness bug, but it is unnecessarily fragile.","fix":"Use `self.0.len().saturating_mul(20)` or compute the ratio with `u64`/`saturating_*` arithmetic.","locations":[{"ref":"gix-imara-diff/src/sources.rs:194-196","code":"  194 |         let len: usize = self.take(20).map(|line| line.len()).sum();\n  195 |         (self.0.len() * 20).checked_div(len).unwrap_or(100) as u32\n  196 |     }","lines":3,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-imara-diff/src/sources.rs#L194-L196"},{"ref":"gix-imara-diff/src/sources.rs:229-231","code":"  229 |         let len: usize = self.take(20).map(|line| line.len()).sum();\n  230 |         (self.0.len() * 20).checked_div(len).unwrap_or(100) as u32\n  231 |     }","lines":3,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-imara-diff/src/sources.rs#L229-L231"},{"ref":"gix-diff/src/blob/platform.rs:149-152","code":"  149 |         fn estimate_tokens(&self) -> u32 {\n  150 |             let len: usize = self.take(20).map(<[u8]>::len).sum();\n  151 |             (self.0.len() * 20).checked_div(len).unwrap_or(100) as u32\n  152 |         }","lines":4,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-diff/src/blob/platform.rs#L149-L152"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"Chunk send logic drops one commit's tree-delta work per chunk. When `chunk.len() == CHUNK_SIZE`,\nthe code sends the full chunk but does NOT push the current `(commit_idx, first_parent, commit)`\ninto the (now-empty) replacement chunk, so that commit's file/line statistics are silently lost.\nThe `else` branch only pushes when the chunk is not yet full. The result is that roughly 1 in every\nCHUNK_SIZE (50) commits is omitted from `gix hours --file-stats/--line-stats`, undercounting stats.","fix":"Always push the current item; flush first when full:\n```\nif let Some((tx_tree, first_parent, commit)) = tree_delta_info {\n    chunk.push((commit_idx, first_parent, commit));\n    if chunk.len() == CHUNK_SIZE {\n        tx_tree.send(std::mem::replace(&mut chunk, Vec::with_capacity(CHUNK_SIZE))).ok();\n    }\n}\n```","locations":[{"ref":"gitoxide-core/src/hours/mod.rs:246-254","code":"  246 |                         if let Some((tx_tree, first_parent, commit)) = tree_delta_info {\n  247 |                             if chunk.len() == CHUNK_SIZE {\n  248 |                                 tx_tree\n  249 |                                     .send(std::mem::replace(&mut chunk, Vec::with_capacity(CHUNK_SIZE)))\n  250 |                                     .ok();\n  251 |                             } else {\n  252 |                                 chunk.push((commit_idx, first_parent, commit));\n  253 |                             }\n  254 |                         }","lines":9,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/hours/mod.rs#L246-L254"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"SKIP_WORKTREE filter only ever matches COMMIT (gitlink) entries, never DIR or SYMLINK entries, so the\nprogress message \"Skipping N DIR/SYMLINK/COMMIT entries\" is wrong and the intended skipping does not\nhappen. `gix::index::entry::Mode` is a bitflags over octal file modes (DIR=0o040000, SYMLINK=0o120000,\nCOMMIT=0o160000), not independent single-bit flags. `maybe_symlink_mode | DIR | COMMIT` collapses to\n0o160000, and `Mode::contains` requires ALL those bits, so only entries whose mode is exactly COMMIT\n(0o160000) match - DIR and SYMLINK entries lack the required bits.","fix":"Compare each mode explicitly rather than OR-ing modes into one `contains` mask, e.g.\n`let m = e.mode; m == maybe_symlink_mode || m == Mode::DIR || m == Mode::COMMIT` (include SYMLINK\nas needed), and update the progress message to match what is actually skipped.","locations":[{"ref":"gitoxide-core/src/index/checkout.rs:42-56","code":"   42 |     let maybe_symlink_mode = if !empty_files && repo.is_some() {\n   43 |         gix::index::entry::Mode::DIR\n   44 |     } else {\n   45 |         gix::index::entry::Mode::SYMLINK\n   46 |     };\n   47 |     for entry in index.entries_mut().iter_mut().filter(|e| {\n   48 |         e.mode\n   49 |             .contains(maybe_symlink_mode | gix::index::entry::Mode::DIR | gix::index::entry::Mode::COMMIT)\n   50 |     }) {\n   51 |         entry.flags.insert(gix::index::entry::Flags::SKIP_WORKTREE);\n   52 |         num_skipped += 1;\n   53 |     }\n   54 |     if num_skipped > 0 {\n   55 |         progress.info(format!(\"Skipping {num_skipped} DIR/SYMLINK/COMMIT entries\"));\n   56 |     }","lines":15,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/index/checkout.rs#L42-L56"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"SCP-like URL parsing splits at the colon found by `find_scheme`, but `find_scheme` only skips a bracketed IPv6 host when the input STARTS with `[`. For `user@[::1]:path`, the input does not start with `[`, so `find_scheme` returns the first `:` inside the IPv6 literal, and `scp()` then splits host/path at the wrong colon, mis-parsing the URL. The code itself flags this: \"// TODO: this incorrectly splits at IPv6 addresses, check for `[]` before splitting\".","fix":"In `find_scheme`, when `@` precedes `[`, locate the `[` and skip to its matching `]` before searching for the SCP colon.","locations":[{"ref":"gix-url/src/parse.rs:97-110","code":"   97 |     let colon = if input.starts_with(b\"[\") {\n   98 |         // IPv6 address, find the closing bracket first\n   99 |         if let Some(bracket_end) = input.find_byte(b']') {\n  100 |             // Look for colon after the bracket\n  101 |             input[bracket_end + 1..]\n  102 |                 .find_byte(b':')\n  103 |                 .map(|pos| bracket_end + 1 + pos)\n  104 |         } else {\n  105 |             // No closing bracket, treat as regular search\n  106 |             input.find_byte(b':')\n  107 |         }\n  108 |     } else {\n  109 |         input.find_byte(b':')\n  110 |     };","lines":14,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-url/src/parse.rs#L97-L110"},{"ref":"gix-url/src/parse.rs:252-253","code":"  252 |     // TODO: this incorrectly splits at IPv6 addresses, check for `[]` before splitting\n  253 |     let (host, path) = input.split_at(colon);","lines":2,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-url/src/parse.rs#L252-L253"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`write_to_local_config` opens the local config file for `WriteMode::Overwrite` with `.write(true)`\nbut never sets `.truncate(true)`. The function then writes the entire local config from offset 0\n(`write_to_filter` rewrites all local sections). If the new serialized config is shorter than the\nfile already on disk, the trailing bytes of the previous content are left in place, producing a\ncorrupt config file (stale duplicate/partial sections). This path is reached from\n`setup_branch_config` (the `Overwrite` caller) which rewrites the whole `[branch ...]`/local config\nafter committing in-memory changes, so any shrink in size corrupts `.git/config`.","fix":"Add `.truncate(true)` to the OpenOptions when in `WriteMode::Overwrite`, or open with create/truncate semantics for full rewrites.","locations":[{"ref":"gix/src/clone/fetch/util.rs:99-105","code":"   99 |     let mut local_config = std::fs::OpenOptions::new()\n  100 |         .create(false)\n  101 |         .write(matches!(mode, WriteMode::Overwrite))\n  102 |         .append(matches!(mode, WriteMode::Append))\n  103 |         .open(config.meta().path.as_deref().expect(\"local config with path set\"))?;\n  104 |     local_config.write_all(config.detect_newline_style())?;\n  105 |     config.write_to_filter(&mut local_config, |s| s.meta().source == gix_config::Source::Local)","lines":7,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix/src/clone/fetch/util.rs#L99-L105"},{"ref":"gix/src/clone/fetch/util.rs:369","code":"  369 |         write_to_local_config(&config, WriteMode::Overwrite)?;","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix/src/clone/fetch/util.rs#L369"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In `transport_options`, the `gitoxide.http.sslVersionMin`/`sslVersionMax` override logic only applies when BOTH min and max are configured (the inner `ssl_version(...).and_then(|min| ssl_version(...).map(|max| min.zip(max)))` produces `Some((min,max))` only if both are Some). If only one of min/max is set, it is silently ignored. The doc note says 'Min and Max must be set to become effective', so this matches intent - but when only `http.sslVersion` (the single value) is also set, the partial min/max are dropped without any warning, which can silently leave SSL at an unintended version. Lower confidence: this is the documented behavior, flagged as a usability/footgun.","fix":"Consider warning (gix_trace) when exactly one of sslVersionMin/sslVersionMax is set but ignored, so users aren't silently surprised that their single bound had no effect.","locations":[{"ref":"gix/src/repository/config/transport.rs:339-364","code":"  339 |                         let min_max = ssl_version(\n  340 |                             config,\n  341 |                             \"gitoxide.http.sslVersionMin\",\n  342 |                             &gitoxide::Http::SSL_VERSION_MIN,\n  343 |                             trusted_only,\n  344 |                             lenient,\n  345 |                         )\n  346 |                         .and_then(|min| {\n  347 |                             ssl_version(\n  348 |                                 config,\n  349 |                                 \"gitoxide.http.sslVersionMax\",\n  350 |                                 &gitoxide::Http::SSL_VERSION_MAX,\n  351 |                                 trusted_only,\n  352 |                                 lenient,\n  353 |                             )\n  354 |                             .map(|max| min.zip(max))\n  355 |                         })?;\n  356 |                         if let Some((min, max)) = min_max {\n  357 |                             let v = opts.ssl_version.get_or_insert(SslVersionRangeInclusive {\n  358 |                                 min: SslVersion::TlsV1_3,\n  359 |                                 max: SslVersion::TlsV1_3,\n  360 |                             });\n  361 |                             v.min = min;\n  362 |                             v.max = max;\n  363 |                         }\n  364 |                     }","lines":26,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix/src/repository/config/transport.rs#L339-L364"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`hasconfig` conditional include matching only supports the exact key glob `remote.*.url`; any other\n`hasconfig:<key>:<value>` condition silently returns `false` (no error, no warning). This is acknowledged in\nthe module deviation note, but the silent `Ok(false)` for unsupported `hasconfig` keys means configs that\nrely on other hasconfig conditions will quietly not apply their includes, which can produce subtly wrong\neffective configuration with no diagnostic.","fix":"At minimum document this limitation at the public `resolve_includes` API, and consider surfacing unsupported\n`hasconfig` keys via a tracing/log warning so silent divergence from git is observable.","locations":[{"ref":"gix-config/src/file/includes/mod.rs:178-203","code":"  178 |         b\"hasconfig\" => {\n  179 |             let mut tokens = condition.splitn(2, |b| *b == b':');\n  180 |             let (key_glob, value_glob) = match (tokens.next(), tokens.next()) {\n  181 |                 (Some(a), Some(b)) => (a, b),\n  182 |                 _ => return Ok(false),\n  183 |             };\n  184 |             if key_glob.as_bstr() != \"remote.*.url\" {\n  185 |                 return Ok(false);\n  186 |             }\n  187 |             let Some(sections) = search_config.sections_by_name(\"remote\") else {\n  188 |                 return Ok(false);\n  189 |             };\n  190 |             for remote in sections {\n  191 |                 for url in remote.values(\"url\") {\n  192 |                     let glob_matches = gix_glob::wildmatch(\n  193 |                         value_glob.as_bstr(),\n  194 |                         url.as_ref(),\n  195 |                         gix_glob::wildmatch::Mode::NO_MATCH_SLASH_LITERAL,\n  196 |                     );\n  197 |                     if glob_matches {\n  198 |                         return Ok(true);\n  199 |                     }\n  200 |                 }\n  201 |             }\n  202 |             Ok(false)\n  203 |         }","lines":26,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-config/src/file/includes/mod.rs#L178-L203"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Windows `symlink::remove` uses `std::fs::metadata(path)` (which FOLLOWS the symlink) to decide between `remove_file` and `remove_dir`, so `meta` describes the link target, not the link itself. The code even admits this with the inline comment \"however, this sees the destination directory, which isn't the right thing actually\". Removal decisions based on target type rather than link type are fragile for directory symlinks and dangling links.","fix":"Use `std::fs::symlink_metadata(path)` (no follow) to inspect the link's own type, then pick `remove_file`/`remove_dir` accordingly.","locations":[{"ref":"gix-fs/src/symlink.rs:50-60","code":"   50 | pub fn remove(path: &Path) -> io::Result<()> {\n   51 |     if let Ok(meta) = std::fs::metadata(path) {\n   52 |         if meta.is_file() {\n   53 |             std::fs::remove_file(path) // this removes the link itself\n   54 |         } else {\n   55 |             std::fs::remove_dir(path) // however, this sees the destination directory, which isn't the right thing actually\n   56 |         }\n   57 |     } else {\n   58 |         std::fs::remove_file(path).or_else(|_| std::fs::remove_dir(path))\n   59 |     }\n   60 | }","lines":11,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-fs/src/symlink.rs#L50-L60"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"POSIX character classes `[:space:]` and `[:blank:]` are implemented incorrectly and effectively swapped.\nGit's wildmatch.c uses `isspace()` for `[:space:]` (matches space, tab, \\n, \\v, \\f, \\r) and `isblank()`\nfor `[:blank:]` (matches only space and tab). Here, `[:blank:]` uses `t_ch.is_ascii_whitespace()` which\nmatches space/tab/\\n/\\f/\\r (too broad, behaves like isspace), while `[:space:]` only checks `t_ch == b' '`\n(too narrow, missing tab and the other whitespace). As a result `[:blank:]` wrongly matches newlines/CR/FF\nand `[:space:]` wrongly fails to match a tab, diverging from Git and from POSIX semantics.","fix":"Use `matches!(t_ch, b' ' | b'\\t')` for `[:blank:]`, and use `t_ch.is_ascii_whitespace()` (or the explicit\nset space/tab/\\n/\\v/\\f/\\r) for `[:space:]`. Note that Rust's `is_ascii_whitespace` excludes vertical tab\n(0x0B), so to fully match Git/`isspace` you may want `matches!(t_ch, b' ' | b'\\t' | b'\\n' | 0x0B | 0x0C | b'\\r')`.","locations":[{"ref":"gix-glob/src/wildmatch.rs:314-318","code":"  314 |                                         b\"blank\" => {\n  315 |                                             if t_ch.is_ascii_whitespace() {\n  316 |                                                 matched = true;\n  317 |                                             }\n  318 |                                         }","lines":5,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-glob/src/wildmatch.rs#L314-L318"},{"ref":"gix-glob/src/wildmatch.rs:350-354","code":"  350 |                                         b\"space\" => {\n  351 |                                             if t_ch == b' ' {\n  352 |                                                 matched = true;\n  353 |                                             }\n  354 |                                         }","lines":5,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-glob/src/wildmatch.rs#L350-L354"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Known/documented `from_tree` correctness hole: tree shape is trusted beyond per-component\nvalidation. Malicious trees with file/directory conflicts (e.g. `a` and `a/x`, or\n`a`,`a.`,`a/x` where `cmp_filepaths` orders an unrelated entry between a file and its\nconflicting child) can produce an index `State` with inconsistent paths that may panic or\nconfuse downstream checkout/index consumers. This is acknowledged in the doc comment but\nremains an unfixed exploitable inconsistency reachable from untrusted tree objects.","fix":"Add a post-traversal global consistency pass that rejects any path which is both a file and a\ndirectory prefix of another entry (not just adjacent-entry checks), or reject the tree during\ntraversal when a name collides with an existing directory/file prefix.","locations":[{"ref":"gix-index/src/init.rs:52-62","code":"   52 |         /// # Security\n   53 |         ///\n   54 |         /// This currently trusts tree shape beyond individual path-component validation, and is exploitable with\n   55 |         /// malicious trees that contain file/directory conflicts like `a` and `a/x`. Such trees can produce an\n   56 |         /// index [`State`] with inconsistent paths, which may panic or confuse downstream checkout/index consumers.\n   57 |         ///\n   58 |         /// A previous normalization pass tried to remove these conflicts after traversal, but only checked adjacent\n   59 |         /// entries. That was incomplete because [`Entry::cmp_filepaths()`] can order unrelated paths between a file\n   60 |         /// and its conflicting child, for example `a`, `a.`, `a/x`.\n   61 |         ///\n   62 |         /// **No extension data is currently produced**.","lines":11,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-index/src/init.rs#L52-L62"},{"ref":"gix-index/src/init.rs:63-114","code":"   63 |         pub fn from_tree<Find>(\n   64 |             tree: &gix_hash::oid,\n   65 |             objects: Find,\n   66 |             validate: gix_validate::path::component::Options,\n   67 |         ) -> Result<Self, Error>\n   68 |         where\n   69 |             Find: gix_object::Find,\n   70 |         {\n   71 |             let _span = gix_features::trace::coarse!(\"gix_index::State::from_tree()\");\n   72 |             let mut delegate = CollectEntries::new(validate);\n   73 |             match depthfirst(tree.to_owned(), depthfirst::State::default(), &objects, &mut delegate) {\n   74 |                 Ok(()) => {}\n   75 |                 Err(gix_traverse::tree::breadthfirst::Error::Cancelled) => {\n   76 |                     let (path, err) = delegate\n   77 |                         .invalid_path\n   78 |                         .take()\n   79 |                         .expect(\"cancellation only happens on validation error\");\n   80 |                     return Err(Error::InvalidComponent { path, source: err });\n   81 |                 }\n   82 |                 Err(err) => return Err(err.into()),\n   83 |             }\n   84 | \n   85 |             let CollectEntries {\n   86 |                 entries,\n   87 |                 path_backing,\n   88 |                 path: _,\n   89 |                 path_deque: _,\n   90 |                 validate: _,\n   91 |                 invalid_path,\n   92 |             } = delegate;\n   93 | \n   94 |             if let Some((path, err)) = invalid_path {\n   95 |                 return Err(Error::InvalidComponent { path, source: err });\n   96 |             }\n   97 | \n   98 |             Ok(State {\n   99 |                 object_hash: tree.kind(),\n  100 |                 timestamp: filetime::FileTime::now(),\n  101 |                 version: Version::V2,\n  102 |                 entries,\n  103 |                 path_backing,\n  104 |                 is_sparse: false,\n  105 |                 tree: None,\n  106 |                 link: None,\n  107 |                 resolve_undo: None,\n  108 |                 untracked: None,\n  109 |                 fs_monitor: None,\n  110 |                 offset_table_at_decode_time: false,\n  111 |                 end_of_index_at_decode_time: false,\n  112 |             })\n  113 |         }\n  114 |     }","lines":52,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-index/src/init.rs#L63-L114"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Same off-by-one as the blocking writer, in the async `Writer::poll_write`. It chunks the input at\n`MAX_DATA_LEN` (line 75), but the inner `LineWriter` has `suffix = b\"\\n\"` in text mode and rejects any\nchunk whose `prefix.len()+data.len()+suffix.len() > MAX_DATA_LEN`. So a full `MAX_DATA_LEN` text-mode\nchunk fails with `DataLengthLimitExceeded`. The chunk size must account for the newline suffix length.","fix":"Reduce the per-chunk limit by `self.inner.suffix.len()`, i.e. chunk at\n`(buf.len() - *written).min(MAX_DATA_LEN - self.inner.suffix.len())`.","locations":[{"ref":"gix-packetline/src/async_io/write.rs:73-82","code":"   73 |                 State::WriteData(written) => {\n   74 |                     while *written != buf.len() {\n   75 |                         let data = &buf[*written..*written + (buf.len() - *written).min(MAX_DATA_LEN)];\n   76 |                         let n = ready!(this.inner.as_mut().poll_write(cx, data))?;\n   77 |                         if n == 0 {\n   78 |                             return Poll::Ready(Err(io::ErrorKind::WriteZero.into()));\n   79 |                         }\n   80 |                         *written += n;\n   81 |                         *written -= U16_HEX_BYTES + this.inner.suffix.len();\n   82 |                     }","lines":10,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-packetline/src/async_io/write.rs#L73-L82"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Text-mode chunking in the blocking `Writer::write` is off-by-one: it splits the input into chunks of\n`MAX_DATA_LEN` bytes, but in text mode `encode::text_to_write` appends a trailing newline, so the\neffective data length becomes `MAX_DATA_LEN + 1`. `prefixed_and_suffixed_data_to_write` then computes\n`data_len = 0 + MAX_DATA_LEN + 1 (suffix) > MAX_DATA_LEN` and returns\n`Error::DataLengthLimitExceeded`. As a result, writing a chunk of exactly `MAX_DATA_LEN` (or any larger\ninput that produces a full final/whole chunk) in text mode always fails. Only binary mode is tested\n(`huge_writes_are_split_into_lines`), so this is uncovered. In text mode the chunk size must be\n`MAX_DATA_LEN - 1` to leave room for the newline.","fix":"When in text mode, limit each chunk to `MAX_DATA_LEN - 1` so the appended newline keeps the encoded\nline within `MAX_DATA_LEN`, e.g. `let max = if self.binary { MAX_DATA_LEN } else { MAX_DATA_LEN - 1 };`\nthen split at `buf.len().min(max)`.","locations":[{"ref":"gix-packetline/src/blocking_io/write.rs:53-63","code":"   53 |         while !buf.is_empty() {\n   54 |             let (data, rest) = buf.split_at(buf.len().min(MAX_DATA_LEN));\n   55 |             written += if self.binary {\n   56 |                 encode::data_to_write(data, &mut self.inner)\n   57 |             } else {\n   58 |                 encode::text_to_write(data, &mut self.inner)\n   59 |             }?;\n   60 |             // subtract header (and trailing NL) because write-all can't handle writing more than it passes in\n   61 |             written -= U16_HEX_BYTES + usize::from(!self.binary);\n   62 |             buf = rest;\n   63 |         }","lines":11,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-packetline/src/blocking_io/write.rs#L53-L63"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `normalize`, `was_relative` is captured once from the original input (convert.rs:269). When a relative path with leading `..` consumes `current_dir` (via `path.push(current_dir_opt.take()?)`), the resulting `path` becomes absolute. The final check `if (path.as_os_str().is_empty() || path == current_dir) && was_relative` then returns `Cow::Borrowed(Path::new(\".\"))` even though the resolved path is an absolute path equal to current_dir. E.g. input \"../cwd\" with current_dir \"/cwd\" normalizes to \"/cwd\" but is rewritten to \".\", which downstream resolves against a different cwd - a path-confusion correctness bug.","fix":"Only collapse to \".\" when the produced path is still relative (i.e. current_dir was never consumed). Track whether `current_dir_opt` was taken and require `path.is_relative()` before returning \".\".","locations":[{"ref":"gix-path/src/convert.rs:278","code":"  278 |     let was_relative = path.is_relative();","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-path/src/convert.rs#L278"},{"ref":"gix-path/src/convert.rs:297-302","code":"  297 |     if (path.as_os_str().is_empty() || path == current_dir) && was_relative {\n  298 |         Cow::Borrowed(Path::new(\".\"))\n  299 |     } else {\n  300 |         path.into()\n  301 |     }\n  302 |     .into()","lines":6,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-path/src/convert.rs#L297-L302"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In `parse()` (revspec), after parsing the first revision the code computes\n`found_revision = rest != input` by pointer/slice comparison. `revision()` returns the remaining\ninput slice; equality is checked with `!=` on `&BStr`. This compares slice *contents*, not whether\nprogress was made - two distinct slices with equal bytes compare equal. For an input like `..` (range\nwith empty both sides) the logic for `found_revision` can misfire: if `revision()` returns a slice\nequal in content to its input despite having consumed/transformed via the delegate (e.g. implicit\nHEAD), `found_revision` is computed as `false` and a spurious `find_ref(\"HEAD\")` is issued, or vice\nversa. The intent appears to be \"did we consume bytes\", which should be a length comparison, not a\ncontent comparison.","fix":"Determine progress by comparing lengths/positions (e.g. `rest.len() != input.len()`) rather than `&BStr` content equality.","locations":[{"ref":"gix-revision/src/spec/parse/function.rs:29-65","code":"   29 |     let mut found_revision;\n   30 |     (input, found_revision) = {\n   31 |         let rest = revision(input, &mut delegate)?;\n   32 |         (rest, rest != input)\n   33 |     };\n   34 |     if delegate.done {\n   35 |         return if input.is_empty() {\n   36 |             Ok(())\n   37 |         } else {\n   38 |             Err(Error::new_with_input(\"unconsumed input\", input).raise())\n   39 |         };\n   40 |     }\n   41 |     if let Some((rest, kind)) = try_range(input) {\n   42 |         if let Some(prev_kind) = prev_kind {\n   43 |             return Err(Error::new(format!(\n   44 |                 \"cannot set spec kind more than once (was {prev_kind:?}, now {kind:?})\"\n   45 |             ))\n   46 |             .raise());\n   47 |         }\n   48 |         if !found_revision {\n   49 |             delegate\n   50 |                 .find_ref(\"HEAD\".into())\n   51 |                 .or_raise(|| Error::new(\"delegate did not find the HEAD reference\"))?;\n   52 |         }\n   53 |         delegate\n   54 |             .kind(kind)\n   55 |             .or_raise(|| Error::new(format!(\"delegate.kind({kind:?}) failed\")))?;\n   56 |         (input, found_revision) = {\n   57 |             let remainder = revision(rest.as_bstr(), &mut delegate)?;\n   58 |             (remainder, remainder != rest)\n   59 |         };\n   60 |         if !found_revision {\n   61 |             delegate\n   62 |                 .find_ref(\"HEAD\".into())\n   63 |                 .or_raise(|| Error::new(\"delegate did not find the HEAD reference\"))?;\n   64 |         }\n   65 |     }","lines":37,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-revision/src/spec/parse/function.rs#L29-L65"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`Handle::<Writable>::with_mut` does `REGISTRY.remove(&self.id)`, runs the user closure, then re-inserts. For the entire duration of every write/read/seek/flush (and gix-lock's `File::with_mut`), the tempfile is absent from the registry. If a termination signal fires during that window, the signal handler will not find the tempfile and leaves it on disk - for lock files this means a permanently stale lock. Documented as a tradeoff, but a real leak hazard.","fix":"Operate on the entry in place (e.g. via the map's `get_mut`/entry API) instead of remove+insert so the tempfile stays registered during the callback.","locations":[{"ref":"gix-tempfile/src/handle.rs:209-221","code":"  209 |     pub fn with_mut<T>(&mut self, once: impl FnOnce(&mut NamedTempFile) -> T) -> std::io::Result<T> {\n  210 |         match REGISTRY.remove(&self.id) {\n  211 |             Some((id, Some(mut t))) => {\n  212 |                 let res = once(t.as_mut_tempfile().expect(\"correct runtime typing\"));\n  213 |                 expect_none(REGISTRY.insert(id, Some(t)));\n  214 |                 Ok(res)\n  215 |             }\n  216 |             None | Some((_, None)) => Err(std::io::Error::new(\n  217 |                 std::io::ErrorKind::NotFound,\n  218 |                 format!(\"The tempfile with id {} wasn't available anymore\", self.id),\n  219 |             )),\n  220 |         }\n  221 |     }","lines":13,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-tempfile/src/handle.rs#L209-L221"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`Handler::parse_status` treats any HTTP status in the inclusive range `200..=valid_end` as success, where `valid_end` is 308 for `FollowRedirects::Initial`/`All`. That means a redirect-class response (300-308) that curl did NOT auto-follow - e.g. 300 Multiple Choices, 304 Not Modified, or a redirect curl declined - is reported as a successful response and its (non-advertisement) body is fed into the packetline parser, yielding a confusing downstream error instead of a clear HTTP-status error. Only the actually-followed final status should be accepted; unfollowed 3xx should be surfaced as an error.","fix":"Accept only `200..=299` as success regardless of `follow`; rely on curl's `follow_location` to leave the final (followed) status in range, and report any remaining 3xx as an error.","locations":[{"ref":"gix-transport/src/client/blocking_io/http/curl/remote.rs:93-105","code":"   93 |     fn parse_status(data: &[u8], follow: FollowRedirects) -> Option<(usize, Box<dyn std::error::Error + Send + Sync>)> {\n   94 |         let valid_end = match follow {\n   95 |             FollowRedirects::Initial | FollowRedirects::All => 308,\n   96 |             FollowRedirects::None => 299,\n   97 |         };\n   98 |         match Self::parse_status_inner(data) {\n   99 |             Ok(status) if !(200..=valid_end).contains(&status) => {\n  100 |                 Some((status, format!(\"Received HTTP status {status}\").into()))\n  101 |             }\n  102 |             Ok(_) => None,\n  103 |             Err(err) => Some((500, err)),\n  104 |         }\n  105 |     }","lines":13,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-transport/src/client/blocking_io/http/curl/remote.rs#L93-L105"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In the depth-first tree traversal, `pop_back_tracked_path_and_set_current()` is called every time an\n`Iterate` machine state is resumed (line 76), including when resuming the *continuation* of a parent\ntree after descending into a subtree. The `Recorder` implementation of this method pops a path from\nthe back of `path_deque` and makes it current. However, the resumed continuation pushes two path\ncomponents (an empty marker plus the subtree filename) only when *descending* (lines 89-90), so the\nnumber of `push_back_tracked_path_component` calls and `pop_back` calls must stay perfectly balanced.\nIf `track_location` is set to `FileName` or `None`, the Recorder's pop/push are no-ops, but the\nbreadthfirst path uses `pop_front` with an `expect(...)` that will panic on imbalance. The coupling\nbetween the state machine's push/pop discipline and the delegate is implicit and easy to break.","fix":"Document and assert the push/pop balance invariant, or have the traversal own the path stack rather than depending on the delegate keeping a perfectly mirrored deque.","locations":[{"ref":"gix-traverse/src/tree/depthfirst.rs:71-98","code":"   71 |                 Machine::Iterate {\n   72 |                     tree_buf: buf,\n   73 |                     byte_offset_to_next_entry,\n   74 |                 } => {\n   75 |                     let mut iter = TreeRefIter::from_bytes(&buf[byte_offset_to_next_entry..], root.kind());\n   76 |                     delegate.pop_back_tracked_path_and_set_current();\n   77 |                     while let Some(entry) = iter.next() {\n   78 |                         let entry = entry?;\n   79 |                         if entry.mode.is_tree() {\n   80 |                             delegate.push_path_component(entry.filename);\n   81 |                             let res = delegate.visit_tree(&entry);\n   82 |                             delegate.pop_path_component();\n   83 |                             match res {\n   84 |                                 std::ops::ControlFlow::Continue(true) => {}\n   85 |                                 std::ops::ControlFlow::Break(()) => break 'outer,\n   86 |                                 std::ops::ControlFlow::Continue(false) => continue,\n   87 |                             }\n   88 | \n   89 |                             delegate.push_back_tracked_path_component(\"\".into());\n   90 |                             delegate.push_back_tracked_path_component(entry.filename);\n   91 |                             let recurse_tree = Machine::GetTree(entry.oid.to_owned());\n   92 |                             let continue_at_next_entry = Machine::Iterate {\n   93 |                                 byte_offset_to_next_entry: iter.offset_to_next_entry(&buf),\n   94 |                                 tree_buf: buf,\n   95 |                             };\n   96 |                             stack.push(continue_at_next_entry);\n   97 |                             stack.push(recurse_tree);\n   98 |                             continue 'outer;","lines":28,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-traverse/src/tree/depthfirst.rs#L71-L98"},{"ref":"gix-traverse/src/tree/recorder.rs:98-118","code":"   98 |     fn pop_back_tracked_path_and_set_current(&mut self) {\n   99 |         if let Some(Location::Path) = self.location {\n  100 |             self.path = self.path_deque.pop_back().unwrap_or_default();\n  101 |         }\n  102 |     }\n  103 | \n  104 |     fn pop_front_tracked_path_and_set_current(&mut self) {\n  105 |         if let Some(Location::Path) = self.location {\n  106 |             self.path = self\n  107 |                 .path_deque\n  108 |                 .pop_front()\n  109 |                 .expect(\"every call is matched with push_tracked_path_component\");\n  110 |         }\n  111 |     }\n  112 | \n  113 |     fn push_back_tracked_path_component(&mut self, component: &BStr) {\n  114 |         if let Some(Location::Path) = self.location {\n  115 |             self.push_element(component);\n  116 |             self.path_deque.push_back(self.path.clone());\n  117 |         }\n  118 |     }","lines":21,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-traverse/src/tree/recorder.rs#L98-L118"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In matching_exclude_pattern() the directory-match short-circuit is knowingly incorrect per the inline comment: if a\npositive directory pattern is found in matched_directory_patterns_stack, it is returned immediately (line 123),\nignoring the possibility that a preceding negative pattern that didn't match the directory would match the full path.\nThe comment acknowledges \"Git does it similarly so we do too even though it's incorrect.\" This produces wrong\nignore/exclude results for paths under a directory that is excluded by a positive pattern but should be re-included\nby a more specific negative pattern. Documented as a known deviation, but it is a real correctness gap that can cause\nfiles to be wrongly reported as ignored (affecting status/untracked detection).","fix":"When a positive directory pattern matches, do not return immediately; instead also run the full-path matching across\nall groups and prefer a more specific (later) match, only falling back to the directory match when nothing else\nmatches. This requires tracking whether a preceding negative pattern existed, as the comment outlines.","locations":[{"ref":"gix-worktree/src/stack/state/ignore.rs:114-131","code":"  114 |             if mapping.pattern.is_negative() {\n  115 |                 dir_match = Some(match_);\n  116 |             } else {\n  117 |                 // Note that returning here is wrong if this pattern _was_ preceded by a negative pattern that\n  118 |                 // didn't match the directory, but would match now.\n  119 |                 // Git does it similarly so we do too even though it's incorrect.\n  120 |                 // To fix this, one would probably keep track of whether there was a preceding negative pattern, and\n  121 |                 // if so we check the path in full and only use the dir match if there was no match, similar to the negative\n  122 |                 // case above whose fix fortunately won't change the overall result.\n  123 |                 return match_.into();\n  124 |             }\n  125 |         }\n  126 |         groups\n  127 |             .iter()\n  128 |             .rev()\n  129 |             .find_map(|group| group.pattern_matching_relative_path(relative_path, is_dir, case))\n  130 |             .or(dir_match)\n  131 |     }","lines":18,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-worktree/src/stack/state/ignore.rs#L114-L131"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`commit_file.file_id` is declared `text` in the schema, but `files.file_id` is `integer PRIMARY KEY`\nand the foreign key / inserts come from a subquery selecting that integer. SQLite's dynamic typing\ntolerates this, but the column affinity is wrong/misleading and breaks any strict-mode use; likely a\ncopy-paste from a text column.","fix":"Change the column type to `file_id integer`.","locations":[{"ref":"gitoxide-core/src/query/db.rs:56","code":"   56 |             file_id text,","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/query/db.rs#L56"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`Diff::format` scales `num_plus` with `.ceil()` and `num_minus` with truncation, each up to NUM_CHARS\n(10). Their sum can exceed 10 (e.g. ceil contributes up to 10 plus another near-10), so the trailing\npad loop `(buf.len()..NUM_CHARS)` becomes an empty range and the column is wider than the intended\nfixed 10 chars, misaligning output. No panic, but the fixed-width invariant is not met.","fix":"Clamp `num_plus + num_minus <= NUM_CHARS` (scale both together against the combined total).","locations":[{"ref":"gitoxide-core/src/query/engine/command.rs:139-149","code":"  139 |         fn format(&self, max_diff_lines: usize) -> String {\n  140 |             const NUM_CHARS: f32 = 10.0;\n  141 |             let mut buf = String::with_capacity(NUM_CHARS as usize);\n  142 |             if max_diff_lines != 0 {\n  143 |                 let num_plus = ((self.lines_added as f32 / max_diff_lines as f32) * NUM_CHARS).ceil() as usize;\n  144 |                 let num_minus = ((self.lines_removed as f32 / max_diff_lines as f32) * NUM_CHARS) as usize;\n  145 |                 buf.extend((0..num_plus).map(|_| '+'));\n  146 |                 buf.extend((0..num_minus).map(|_| '-'));\n  147 |             }\n  148 |             buf.extend((buf.len()..NUM_CHARS as usize).map(|_| ' '));\n  149 |             buf","lines":11,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/query/engine/command.rs#L139-L149"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `status::show`, TreeIndex change rows use field width 2 (`{status: >2}`) while IndexWorktree rows\nand `print_index_entry_status` use width 3 (`{status: >3}`). Output columns from the two status sources\ndo not line up; the two-char conflict codes (e.g. \"UU\"/\"DD\") rely on the width-3 path, making the\nwidth-2 TreeIndex rows the inconsistent ones.","fix":"Use a single consistent width (3) for all status columns, or a shared width constant.","locations":[{"ref":"gitoxide-core/src/repository/status.rs:139","code":"  139 |                             \"{status: >2}  {source_rela_path} → {dest_rela_path}\",","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/repository/status.rs#L139"},{"ref":"gitoxide-core/src/repository/status.rs:150","code":"  150 |                     \"{status: >2}  {rela_path}\",","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/repository/status.rs#L150"},{"ref":"gitoxide-core/src/repository/status.rs:167","code":"  167 |                         \"{status: >3} {rela_path}{slash}\",","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/repository/status.rs#L167"},{"ref":"gitoxide-core/src/repository/status.rs:185","code":"  185 |                     \"{status: >3} {source_rela_path} → {dest_rela_path}\",","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/repository/status.rs#L185"},{"ref":"gitoxide-core/src/repository/status.rs:239","code":"  239 |     writeln!(out, \"{status: >3} {}\", display_path.display())","lines":1,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gitoxide-core/src/repository/status.rs#L239"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`merge_zero_based_exclusive_range` partitions ranges as overlapping when `!(new_range.end < range.start || range.end < new_range.start)`.\nBecause these are end-exclusive ranges, two strictly adjacent ranges (e.g. `0..5` and `5..10`, which share no lines) are\ntreated as overlapping and merged into `0..10`. This silently coalesces user-specified disjoint blame ranges that merely\ntouch. Depending on intent this may surprise callers passing adjacent 1-based inclusive ranges that map to touching\nexclusive ranges.","fix":"If only true overlaps should merge, use strict comparison that excludes adjacency (e.g. `new_range.end <= range.start || range.end <= new_range.start` as the non-overlap predicate).","locations":[{"ref":"gix-blame/src/types.rs:107-126","code":"  107 |     fn merge_zero_based_exclusive_range(&mut self, new_range: Range<u32>) {\n  108 |         match self {\n  109 |             Self::PartialFile(ranges) => {\n  110 |                 // Partition ranges into those that don't overlap and those that do.\n  111 |                 let (mut non_overlapping, overlapping): (Vec<_>, Vec<_>) = ranges\n  112 |                     .drain(..)\n  113 |                     .partition(|range| new_range.end < range.start || range.end < new_range.start);\n  114 | \n  115 |                 let merged_range = overlapping.into_iter().fold(new_range, |acc, range| {\n  116 |                     acc.start.min(range.start)..acc.end.max(range.end)\n  117 |                 });\n  118 | \n  119 |                 non_overlapping.push(merged_range);\n  120 | \n  121 |                 *ranges = non_overlapping;\n  122 |                 ranges.sort_by_key(|a| a.start);\n  123 |             }\n  124 |             Self::WholeFile => *self = Self::PartialFile(vec![new_range]),\n  125 |         }\n  126 |     }","lines":20,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-blame/src/types.rs#L107-L126"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`Attribute::from_str` strips the negation prefix with `s.strip_prefix(\"no-\").or_else(|| s.strip_prefix(\"no\"))`.\nThe bare `no` arm means inputs like `nobold` parse as inverted `bold` (intended), but it also means a\nhypothetical attribute name starting with `no` could be misparsed, and more concretely the ordering makes\n`no-` and `no` both viable so `no-bold` and `nobold` are accepted (matching git), but `noreset`/`no-reset`\nsilently map to \"reset if inverted -> Err\" rather than an unknown-attribute error path that distinguishes\nthem. Behavior matches git closely; flag is that the prefix stripping is order-dependent and fragile if new\nattributes are added whose names begin with `no`.","fix":"Consider matching full tokens (including their `no`/`no-` forms) explicitly, or guard that no attribute name\nbegins with `no`, so the prefix-stripping heuristic cannot collide with a real attribute name.","locations":[{"ref":"gix-config-value/src/color.rs:389-394","code":"  389 |         let inverted = if let Some(rest) = s.strip_prefix(\"no-\").or_else(|| s.strip_prefix(\"no\")) {\n  390 |             s = rest;\n  391 |             true\n  392 |         } else {\n  393 |             false\n  394 |         };","lines":6,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-config-value/src/color.rs#L389-L394"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`key_and_value_range_by` uses `value_range.end == 0` as a sentinel meaning \"end not yet set\" while scanning\nevents in reverse for `ValueNotDone`/`ValueDone`. Index 0 is also a legal event index. A `ValueDone`/\n`ValueNotDone` can never legitimately be at index 0 (a `SectionValueName` must precede it), so this is\ncurrently safe, but the overloaded sentinel is fragile: any future change that can place a value event at\nindex 0, or reorder the scan, would silently corrupt the computed range.","fix":"Use `Option<usize>` for `value_range.end`/`start` instead of overloading `0` as 'unset', making the\n'not yet seen' state explicit and robust.","locations":[{"ref":"gix-config/src/file/section/body.rs:201-207","code":"  201 |                 Event::ValueNotDone(_) | Event::ValueDone(_) => {\n  202 |                     if value_range.end == 0 {\n  203 |                         value_range.end = i;\n  204 |                     } else {\n  205 |                         value_range.start = i;\n  206 |                     }\n  207 |                 }","lines":7,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-config/src/file/section/body.rs#L201-L207"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"`Time::MAX`/`Time::MIN` declare offsets of `+-(99*60*60 + 59*60 + 59) = +-359999` seconds, i.e. they include 59 offset-seconds. But `write_to` only serializes hours and minutes (`let minutes = (offset - (hours * SECONDS_PER_HOUR)) / 60;`) and never writes the seconds component. So any `Time` whose offset has non-zero seconds (including MIN/MAX themselves) serializes lossily and does not round-trip; the type advertises an offset range it cannot faithfully serialize.","fix":"Either normalize offsets to whole minutes on construction, or make MIN/MAX offsets multiples of 60 so the declared bounds match what `write_to` can produce.","locations":[{"ref":"gix-date/src/time/write.rs:20-44","code":"   20 |         const SECONDS_PER_HOUR: u32 = 60 * 60;\n   21 |         let offset = self.offset.unsigned_abs();\n   22 |         let hours = offset / SECONDS_PER_HOUR;\n   23 |         let minutes = (offset - (hours * SECONDS_PER_HOUR)) / 60;\n   24 | \n   25 |         if hours > 99 {\n   26 |             return Err(std::io::Error::other(\"Cannot represent offsets larger than +-9900\"));\n   27 |         }\n   28 | \n   29 |         let mut itoa = itoa::Buffer::new();\n   30 |         out.write_all(itoa.format(self.seconds).as_bytes())?;\n   31 |         out.write_all(b\" \")?;\n   32 |         out.write_all(if self.offset < 0 { b\"-\" } else { b\"+\" })?;\n   33 | \n   34 |         const ZERO: &[u8; 1] = b\"0\";\n   35 | \n   36 |         if hours < 10 {\n   37 |             out.write_all(ZERO)?;\n   38 |         }\n   39 |         out.write_all(itoa.format(hours).as_bytes())?;\n   40 | \n   41 |         if minutes < 10 {\n   42 |             out.write_all(ZERO)?;\n   43 |         }\n   44 |         out.write_all(itoa.format(minutes).as_bytes()).map(|_| ())","lines":25,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-date/src/time/write.rs#L20-L44"},{"ref":"gix-date/src/time/write.rs:88-98","code":"   88 |     /// The numerically largest possible time instance.\n   89 |     pub const MAX: Time = Time {\n   90 |         seconds: SecondsSinceUnixEpoch::MAX,\n   91 |         offset: 99 * 60 * 60 + 59 * 60 + 59,\n   92 |     };\n   93 | \n   94 |     /// The numerically smallest possible time instance.\n   95 |     pub const MIN: Time = Time {\n   96 |         seconds: SecondsSinceUnixEpoch::MIN,\n   97 |         offset: -(99 * 60 * 60 + 59 * 60 + 59),\n   98 |     };","lines":11,"link":"https://github.com/GitoxideLabs/gitoxide/blob/4278d183285bb0b2f8f3cc74d1432d3e77c4dc38/gix-date/src/time/write.rs#L88-L98"}]},
