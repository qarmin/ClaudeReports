t microseconds = duration.as_micros() as usize;","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/boot.rs#L1591"}]},{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","easy":false,"description":"In `FileSystem::read()`, `info.file_size()` is `u64` but is cast to `usize` with `as usize` when allocating the read buffer. On 32-bit systems a file larger than `usize::MAX` bytes silently truncates the allocation. The subsequent `read()` fills only the truncated buffer while the returned `Vec` has the wrong length, causing silent data corruption or a short-read that only triggers a log message rather than an error.","fix":"Use `usize::try_from(info.file_size()).map_err(|_| Error::Io(...))` and propagate the error. Similarly turn the short-read log error into a returned error so callers can detect truncation.","locations":[{"ref":"uefi/src/fs/file_system/fs.rs:223","code":"  223 |         let mut vec = vec![0; info.file_size() as usize];","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/fs/file_system/fs.rs#L223"},{"ref":"uefi/src/fs/file_system/fs.rs:233-235","code":"  233 |         if read_bytes != info.file_size() as usize {\n  234 |             log::error!(\"Did only read {}/{} bytes\", info.file_size(), read_bytes);\n  235 |         }","lines":3,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/fs/file_system/fs.rs#L233-L235"}]},{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","easy":false,"description":"`DevicePathNode::from_ffi_ptr` computes `data_len` by subtracting\n`size_of::<DevicePathHeader>()` (4 bytes) from `header.length()` without checking\nthat `header.length() >= 4`. If firmware provides a malformed node with\n`length < 4`, the arithmetic wraps to a huge `usize` on 64-bit systems\n(underflow in checked-by-default debug builds causes a panic; in release builds\nit wraps silently), and the subsequent `from_raw_parts` constructs a fat pointer\ninto garbage memory. Because `from_ffi_ptr` is `unsafe`, its callers (including\n`DevicePathNodeIterator::next`) inherit this hazard.","fix":"Add a check: if `header.length() < size_of::<DevicePathHeader>() as u16`, treat it as a fatal error or return a zero-length data slice.","locations":[{"ref":"uefi/src/proto/device_path/mod.rs:258-265","code":"  258 |     pub unsafe fn from_ffi_ptr<'a>(ptr: *const FfiDevicePath) -> &'a Self {\n  259 |         // SAFETY: The memory is valid.\n  260 |         let header = unsafe { *ptr.cast::<DevicePathHeader>() };\n  261 | \n  262 |         let data_len = usize::from(header.length()) - size_of::<DevicePathHeader>();\n  263 |         // SAFETY: The memory is valid.\n  264 |         unsafe { &*ptr_meta::from_raw_parts(ptr.cast(), data_len) }\n  265 |     }","lines":8,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/device_path/mod.rs#L258-L265"}]},{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","easy":false,"description":"Buffer lengths computed by `AlignedBuffer::size()` (which returns `usize`) are silently\nnarrowed to `u32` before being stored in `NvmExpressPassThruCommandPacket::transfer_length`,\n`meta_data_length` and `ScsiIoScsiRequestPacket::in_transfer_length`, `out_transfer_length`.\nOn 64-bit targets, a buffer larger than 4 GiB would have its length silently truncated, causing\nthe firmware to transfer a different number of bytes than the buffer can hold, leading to memory\ncorruption.","fix":"Replace `bfr.size() as u32` with `u32::try_from(bfr.size()).expect(\"buffer too large for NVMe/SCSI transfer\")` or return a layout error when size exceeds `u32::MAX`.","locations":[{"ref":"uefi/src/proto/nvme/mod.rs:162","code":"  162 |         self.req.packet.transfer_length = bfr.size() as u32;","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/nvme/mod.rs#L162"},{"ref":"uefi/src/proto/nvme/mod.rs:176","code":"  176 |         self.req.packet.transfer_length = bfr.size() as u32;","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/nvme/mod.rs#L176"},{"ref":"uefi/src/proto/nvme/mod.rs:203","code":"  203 |         self.req.packet.meta_data_length = bfr.size() as u32;","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/nvme/mod.rs#L203"},{"ref":"uefi/src/proto/nvme/mod.rs:217","code":"  217 |         self.req.packet.meta_data_length = bfr.size() as u32;","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/nvme/mod.rs#L217"},{"ref":"uefi/src/proto/scsi/mod.rs:156","code":"  156 |         self.req.packet.in_transfer_length = bfr.size() as u32;","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/scsi/mod.rs#L156"},{"ref":"uefi/src/proto/scsi/mod.rs:170","code":"  170 |         self.req.packet.in_transfer_length = bfr.size() as u32;","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/scsi/mod.rs#L170"},{"ref":"uefi/src/proto/scsi/mod.rs:212","code":"  212 |         self.req.packet.out_transfer_length = bfr.size() as u32;","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/scsi/mod.rs#L212"},{"ref":"uefi/src/proto/scsi/mod.rs:228","code":"  228 |         self.req.packet.out_transfer_length = bfr.size() as u32;","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/scsi/mod.rs#L228"}]},{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","easy":false,"description":"`PciRootBridgeIo::enumerate()` iterates over bus numbers by casting `descriptor.address_min`\nand `descriptor.address_max` (both `u64`) to `u8`. PCI bus numbers are spec-limited to 0-255,\nbut if firmware supplies a malformed ACPI Bus descriptor with values above 255, the silent\ntruncation produces a wrong or inverted range. For example, `address_min = 256` becomes `0`\nand the loop iterates unexpected bus numbers.","fix":"Validate that both values fit in `u8` before casting, e.g., using `u8::try_from(descriptor.address_min)` and skipping or returning an error on invalid values.","locations":[{"ref":"uefi/src/proto/pci/root_bridge.rs:193","code":"  193 |                 for bus in (descriptor.address_min as u8)..=(descriptor.address_max as u8) {","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/pci/root_bridge.rs#L193"}]},{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","easy":true,"description":"`MpServices::startup_all_aps()` and `MpServices::startup_this_ap()` convert the timeout\n`Duration` to microseconds via `timeout.as_micros().try_into().unwrap()`. `as_micros()`\nreturns `u128`; the target type is `usize`. On 32-bit UEFI targets (x86, ARM), `usize` is\n32 bits, so any timeout above ~4295 seconds (~71 minutes) overflows the conversion and\n`.unwrap()` panics. Timeouts in that range are plausible for long-running AP workloads.","fix":"Cap the value at `usize::MAX` before the conversion: `timeout.as_micros().min(usize::MAX as u128) as usize`, or return an error on overflow.","locations":[{"ref":"uefi/src/proto/pi/mp.rs:174","code":"  174 |             Some(timeout) => timeout.as_micros().try_into().unwrap(),","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/pi/mp.rs#L174"},{"ref":"uefi/src/proto/pi/mp.rs:205","code":"  205 |             Some(timeout) => timeout.as_micros().try_into().unwrap(),","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/pi/mp.rs#L205"}]},{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","easy":true,"description":"In `UsbIo::control_transfer`, the buffer length is silently truncated from `usize` to `u16` when\npopulating the `DeviceRequest.length` field. If a caller passes a `ControlTransfer::DataIn` or\n`ControlTransfer::DataOut` buffer whose length exceeds 65535, the firmware receives a truncated\nlength, causing it to transfer fewer bytes than the caller expects with no error returned.","fix":"Replace `length as u16` with `u16::try_from(length).map_err(|_| Error::from(Status::BAD_BUFFER_SIZE))?`\nand propagate the error from `control_transfer`. The USB spec does cap control transfer data at\n65535 bytes, so rejecting oversized buffers is the correct behavior.","locations":[{"ref":"uefi/src/proto/usb/io.rs:61","code":"   61 |             length: length as u16,","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/usb/io.rs#L61"}]},{"id":"OVF_8","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","easy":false,"description":"In `FileSystem::copy()`, `remaining_size -= u64::try_from(num_bytes_read).unwrap()` at line 138 will underflow (panic in debug builds, wrap in release builds) if the firmware returns more bytes in a single read than the reported `file_size`. Although this violates the UEFI spec, non-conforming firmware could trigger this path.","fix":"Use `remaining_size = remaining_size.saturating_sub(u64::try_from(num_bytes_read).unwrap_or(u64::MAX))` and break out of the loop when `remaining_size` reaches zero, or add an explicit check: `if bytes_read_u64 > remaining_size { break; }`.","locations":[{"ref":"uefi/src/fs/file_system/fs.rs:138","code":"  138 |             remaining_size -= u64::try_from(num_bytes_read).unwrap();","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/fs/file_system/fs.rs#L138"}]},{"id":"OVF_9","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","easy":false,"description":"In AtaRequestBuilder::with_timeout, `(timeout.as_nanos() / 100) as u64` casts from `u128` to `u64`. For durations exceeding roughly 58,000 years, this silently overflows and wraps, producing a much smaller timeout value than intended. While this is a theoretical edge case, the cast is still a silent truncation from a wider type.","fix":"Use `u64::try_from(timeout.as_nanos() / 100).unwrap_or(u64::MAX)` to cap at the maximum representable timeout rather than wrapping.","locations":[{"ref":"uefi/src/proto/ata/mod.rs:159-159","code":"  159 |         self.req.packet.timeout = (timeout.as_nanos() / 100) as u64;","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/ata/mod.rs#L159"}]},{"id":"OVF_10","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","easy":false,"description":"In AtaRequestBuilder, `bfr.size() as u32` silently truncates if the buffer size exceeds 4 GiB. `AlignedBuffer::size()` returns `usize` (64-bit on most UEFI platforms), but `in_transfer_length` and `out_transfer_length` in `AtaPassThruCommandPacket` are `u32`. A buffer larger than 4 GiB would have its size silently truncated, causing the firmware to use only part of the intended buffer without any error.","fix":"Use `u32::try_from(bfr.size()).expect(\"ATA buffer too large for u32 transfer length\")` or return a `LayoutError`-compatible error. In practice ATA buffers are small, but the cast should be explicit.","locations":[{"ref":"uefi/src/proto/ata/mod.rs:258-258","code":"  258 |         self.req.packet.in_transfer_length = bfr.size() as u32;","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/ata/mod.rs#L258"},{"ref":"uefi/src/proto/ata/mod.rs:272-272","code":"  272 |         self.req.packet.in_transfer_length = bfr.size() as u32;","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/ata/mod.rs#L272"},{"ref":"uefi/src/proto/ata/mod.rs:296-296","code":"  296 |         self.req.packet.out_transfer_length = bfr.size() as u32;","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/ata/mod.rs#L296"},{"ref":"uefi/src/proto/ata/mod.rs:312-312","code":"  312 |         self.req.packet.out_transfer_length = bfr.size() as u32;","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/ata/mod.rs#L312"}]},{"id":"OVF_11","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","easy":false,"description":"`build::acpi::Expanded::size_in_bytes` sums three `size_of_val` results with unchecked `usize`\naddition before feeding the total to `u16::try_from`.  On 32-bit platforms, three slices each\napproaching `isize::MAX` bytes (2 GB) would wrap the `usize` sum to a small value, making the\n`u16::try_from` check succeed with a truncated result.  The buffer allocated by\n`DevicePathBuilder::push` would then be far too small, causing `write_data` to write out of bounds\n(UB via `copy_to_nonoverlapping`).  The same pattern - constant + size_of_val(slice) using\nunchecked addition - appears in every variable-length `size_in_bytes` implementation across the\nfile.","fix":"Use `usize::checked_add` (or `.saturating_add`) for every step in the size calculation and\npropagate overflow as `BuildError::NodeTooBig`.  For ACPI Expanded specifically:\n  let size = 16usize\n      .checked_add(size_of_val(self.hid_str))\n      .and_then(|s| s.checked_add(size_of_val(self.uid_str)))\n      .and_then(|s| s.checked_add(size_of_val(self.cid_str)))\n      .ok_or(BuildError::NodeTooBig)?;\nApply the same pattern to all other variable-length size_in_bytes methods.","locations":[{"ref":"uefi/src/proto/device_path/device_path_gen.rs:4133-4139","code":" 4133 |             fn size_in_bytes(&self) -> Result<u16, BuildError> {\n 4134 |                 let size = 16usize\n 4135 |                     + size_of_val(self.hid_str)\n 4136 |                     + size_of_val(self.uid_str)\n 4137 |                     + size_of_val(self.cid_str);\n 4138 |                 u16::try_from(size).map_err(|_| BuildError::NodeTooBig)\n 4139 |             }","lines":7,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/device_path/device_path_gen.rs#L4133-L4139"},{"ref":"uefi/src/proto/device_path/device_path_gen.rs:3953-3956","code":" 3953 |             fn size_in_bytes(&self) -> Result<u16, BuildError> {\n 3954 |                 let size = 20usize + size_of_val(self.vendor_defined_data);\n 3955 |                 u16::try_from(size).map_err(|_| BuildError::NodeTooBig)\n 3956 |             }","lines":4,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/device_path/device_path_gen.rs#L3953-L3956"},{"ref":"uefi/src/proto/device_path/device_path_gen.rs:4583-4585","code":" 4583 |                 let size = 10usize + size_of_val(self.serial_number);\n 4584 |                 u16::try_from(size).map_err(|_| BuildError::NodeTooBig)\n 4585 |             }","lines":3,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/device_path/device_path_gen.rs#L4583-L4585"},{"ref":"uefi/src/proto/device_path/device_path_gen.rs:5219-5222","code":" 5219 |             fn size_in_bytes(&self) -> Result<u16, BuildError> {\n 5220 |                 let size = 18usize + size_of_val(self.iscsi_target_name);\n 5221 |                 u16::try_from(size).map_err(|_| BuildError::NodeTooBig)\n 5222 |             }","lines":4,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/device_path/device_path_gen.rs#L5219-L5222"},{"ref":"uefi/src/proto/device_path/device_path_gen.rs:5575-5578","code":" 5575 |             fn size_in_bytes(&self) -> Result<u16, BuildError> {\n 5576 |                 let size = 5usize + size_of_val(self.addresses);\n 5577 |                 u16::try_from(size).map_err(|_| BuildError::NodeTooBig)\n 5578 |             }","lines":4,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/device_path/device_path_gen.rs#L5575-L5578"},{"ref":"uefi/src/proto/device_path/device_path_gen.rs:5700-5703","code":" 5700 |             fn size_in_bytes(&self) -> Result<u16, BuildError> {\n 5701 |                 let size = 21usize + size_of_val(self.subsystem_nqn);\n 5702 |                 u16::try_from(size).map_err(|_| BuildError::NodeTooBig)\n 5703 |             }","lines":4,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/device_path/device_path_gen.rs#L5700-L5703"}]},{"id":"OVF_12","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","easy":true,"description":"`DiskInfo::inquiry`, `DiskInfo::identify`, and `DiskInfo::sense_data` cast\n`bfr.len()` (a `usize`) to `u32` with `as u32`, silently truncating if the\nbuffer is larger than 4 GiB. On 64-bit systems a caller can trivially pass a\nmulti-GiB buffer; the firmware will then be told a smaller size, read only that\nportion, and return a truncated result with no error indication.","fix":"Use `u32::try_from(bfr.len()).map_err(|_| Status::BAD_BUFFER_SIZE.into())?` to propagate oversized buffers as errors.","locations":[{"ref":"uefi/src/proto/media/disk_info.rs:110","code":"  110 |         let mut len: u32 = bfr.len() as u32;","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/media/disk_info.rs#L110"},{"ref":"uefi/src/proto/media/disk_info.rs:132","code":"  132 |         let mut len: u32 = bfr.len() as u32;","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/media/disk_info.rs#L132"},{"ref":"uefi/src/proto/media/disk_info.rs:154","code":"  154 |         let mut len: u32 = bfr.len() as u32;","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/media/disk_info.rs#L154"}]},{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","easy":false,"description":"In AtaDeviceIterator, when transitioning to a new port after the previous port's last device had pmp == 0xFFFF (direct connection, set by the SUCCESS branch at line 261), `prev_pmp` is left as 0xFFFF and is NOT reset before calling `get_next_device` on the new port. Then `was_first = self.prev_pmp == 0xFFFF` evaluates to true. If the new port's `get_next_device` returns NOT_FOUND immediately (no multiplier and no device), the iterator incorrectly yields a spurious `AtaDevice { port: new_port, pmp: 0xFFFF }`. This can cause callers to probe non-existent devices and misinterpret results.","fix":"After `end_of_port` is set to true (both in the NOT_FOUND branch and in the SUCCESS with pmp==0xFFFF branch), ensure `prev_pmp` is reset to 0xFFFF consistently. More importantly, set `was_first` based on whether the current `get_next_device` call is the very first one for the new port, not based on the stale `prev_pmp` from the previous port. One approach: add a separate boolean `is_first_device_query` that is set to true whenever a new port is obtained and cleared after the first `get_next_device` call.","locations":[{"ref":"uefi/src/proto/ata/pass_thru.rs:229-285","code":"  229 |     fn next(&mut self) -> Option<Self::Item> {\n  230 |         loop {\n  231 |             if self.end_of_port {\n  232 |                 // SAFETY: The memory is valid.\n  233 |                 let result = unsafe {\n  234 |                     ((*self.proto.get()).get_next_port)(self.proto.get(), &mut self.prev_port)\n  235 |                 };\n  236 |                 match result {\n  237 |                     Status::SUCCESS => self.end_of_port = false,\n  238 |                     Status::NOT_FOUND => return None, // no more ports / devices. End of list\n  239 |                     _ => panic!(\"Must not happen according to spec!\"),\n  240 |                 }\n  241 |             }\n  242 |             // get next device on port\n  243 |             // The UEFI spec states, that:\n  244 |             //   If there is no port multiplier detected on the given port, the initial query of get_next_device()\n  245 |             //   is allowed to return either of:\n  246 |             //      - EFI_SUCCESS & PMP = 0xFFFF\n  247 |             //      - EFI_NOT_FOUND\n  248 |             //   But even when there is no detected port multiplier, there might be a device directly connected\n  249 |             //   to the port! A port where the device is directly connected uses a pmp-value of 0xFFFF.\n  250 |             let was_first = self.prev_pmp == 0xFFFF;\n  251 |             // SAFETY: The memory is valid.\n  252 |             let result = unsafe {\n  253 |                 ((*self.proto.get()).get_next_device)(\n  254 |                     self.proto.get(),\n  255 |                     self.prev_port,\n  256 |                     &mut self.prev_pmp,\n  257 |                 )\n  258 |             };\n  259 |             match result {\n  260 |                 Status::SUCCESS => {\n  261 |                     if self.prev_pmp == 0xFFFF {\n  262 |                         self.end_of_port = true;\n  263 |                     }\n  264 |                     return Some(AtaDevice {\n  265 |                         proto: self.proto,\n  266 |                         port: self.prev_port,\n  267 |                         pmp: self.prev_pmp,\n  268 |                     });\n  269 |                 }\n  270 |                 Status::NOT_FOUND => {\n  271 |                     self.end_of_port = true;\n  272 |                     self.prev_pmp = 0xFFFF;\n  273 |                     if was_first {\n  274 |                         // no port multiplier on port, return valid device anyway.\n  275 |                         return Some(AtaDevice {\n  276 |                             proto: self.proto,\n  277 |                             port: self.prev_port,\n  278 |                             pmp: 0xFFFF,\n  279 |                         });\n  280 |                     }\n  281 |                 }\n  282 |                 _ => panic!(\"Must not happen according to spec!\"),\n  283 |             }\n  284 |         }\n  285 |     }","lines":57,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/ata/pass_thru.rs#L229-L285"}]},{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","easy":true,"description":"`open_utility_protocol` searches for handles by `DevicePathToText::GUID` instead of\n`DevicePathUtilities::GUID`. As a result, calling `DevicePath::to_pool`,\n`DevicePath::append_path`, or `DevicePath::append_node` will attempt to open\n`DevicePathUtilities` on a handle that was located by the wrong GUID. On any\nsystem where the two protocols live on different handles (which is the common\ncase), this will return an error or silently open the wrong protocol.","fix":"Change `&DevicePathToText::GUID` to `&DevicePathUtilities::GUID` in `open_utility_protocol`.","locations":[{"ref":"uefi/src/proto/device_path/mod.rs:989","code":"  989 |     let &handle = boot::locate_handle_buffer(SearchType::ByProtocol(&DevicePathToText::GUID))","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/device_path/mod.rs#L989"}]},{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","easy":true,"description":"`UnicodeCollation::str_lwr()` and `str_upr()` are both broken for empty `CStr16` input.\n`CStr16::iter()` yields zero items for an empty string. The loop therefore never executes and\n`last_index` stays at its initial value of `0`. The code then writes a NUL terminator to\n`buf[last_index + 1]` = `buf[1]`, leaving `buf[0]` uninitialised. The call to\n`CStr16::from_u16_with_nul_unchecked(buf)` wraps the full buffer, which starts with a\ngarbage value followed by a NUL, making the returned string appear to be a one-character\nstring with undefined content instead of an empty string.","fix":"Initialise `last_index` to `usize::MAX` and use saturating arithmetic, OR detect the empty-string case and write NUL at index 0 directly before the loop.","locations":[{"ref":"uefi/src/proto/string/unicode_collation.rs:68-80","code":"   68 |         let mut last_index = 0;\n   69 |         for (i, c) in s.iter().enumerate() {\n   70 |             *buf.get_mut(i).ok_or(StrConversionError::BufferTooSmall)? = (*c).into();\n   71 |             last_index = i;\n   72 |         }\n   73 |         *buf.get_mut(last_index + 1)\n   74 |             .ok_or(StrConversionError::BufferTooSmall)? = 0;\n   75 | \n   76 |         // SAFETY: The memory is valid.\n   77 |         unsafe { (self.0.str_lwr)(&self.0, buf.as_mut_ptr()) };\n   78 | \n   79 |         // SAFETY: The input was validated to be NUL-terminated with no interior NULs.\n   80 |         Ok(unsafe { CStr16::from_u16_with_nul_unchecked(buf) })","lines":13,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/string/unicode_collation.rs#L68-L80"},{"ref":"uefi/src/proto/string/unicode_collation.rs:89-101","code":"   89 |         let mut last_index = 0;\n   90 |         for (i, c) in s.iter().enumerate() {\n   91 |             *buf.get_mut(i).ok_or(StrConversionError::BufferTooSmall)? = (*c).into();\n   92 |             last_index = i;\n   93 |         }\n   94 |         *buf.get_mut(last_index + 1)\n   95 |             .ok_or(StrConversionError::BufferTooSmall)? = 0;\n   96 | \n   97 |         // SAFETY: The memory is valid.\n   98 |         unsafe { (self.0.str_upr)(&self.0, buf.as_mut_ptr()) };\n   99 | \n  100 |         // SAFETY: The input was validated to be NUL-terminated with no interior NULs.\n  101 |         Ok(unsafe { CStr16::from_u16_with_nul_unchecked(buf) })","lines":13,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/string/unicode_collation.rs#L89-L101"}]},{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"The `rename()` function is implemented as `copy() + remove_file()`. This means renaming is non-atomic: if the operation is interrupted between the copy and the delete (e.g. power loss), both source and destination exist. More critically, `rename()` only calls `remove_file()` on the source, so if the source is a directory the copy silently fails (copy only handles regular files) and the remove fails, with an error that identifies it as a copy failure rather than a rename failure. The function doc says it renames files or directories but the implementation only works for files.","fix":"Document that `rename()` only supports regular files, or add a directory rename path using UEFI `SetInfo` to change the file name in-place (which is atomic within UEFI).","locations":[{"ref":"uefi/src/fs/file_system/fs.rs:350-357","code":"  350 |     pub fn rename(\n  351 |         &mut self,\n  352 |         src_path: impl AsRef<Path>,\n  353 |         dest_path: impl AsRef<Path>,\n  354 |     ) -> FileSystemResult<()> {\n  355 |         self.copy(&src_path, dest_path)?;\n  356 |         self.remove_file(src_path)\n  357 |     }","lines":8,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/fs/file_system/fs.rs#L350-L357"}]},{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"MemoryMap::is_sorted() uses a strict less-than check (`next.phys_start < curr.phys_start`) to detect an out-of-order map. Entries with equal phys_start (duplicate physical addresses) are not flagged, but they represent an invalid UEFI memory map - two descriptors cannot cover the same physical address. Callers relying on is_sorted() to validate map correctness will silently accept a map with duplicate/overlapping entries.","fix":"Change the condition to `next.phys_start <= curr.phys_start` to also detect duplicate physical addresses. Update the debug log message accordingly.","locations":[{"ref":"uefi/src/mem/memory_map/api.rs:81-92","code":"   81 |     fn is_sorted(&self) -> bool {\n   82 |         let iter = self.entries();\n   83 |         let iter = iter.clone().zip(iter.skip(1));\n   84 | \n   85 |         for (curr, next) in iter {\n   86 |             if next.phys_start < curr.phys_start {\n   87 |                 log::debug!(\"next.phys_start < curr.phys_start: curr={curr:?}, next={next:?}\");\n   88 |                 return false;\n   89 |             }\n   90 |         }\n   91 |         true\n   92 |     }","lines":12,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/mem/memory_map/api.rs#L81-L92"}]},{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"`get_maximum_processor_index` silently discards the firmware call's return status (`let _ = ...`),\nand initialises `max_processor_index` to `usize::MAX` as a canary. If the firmware call fails\n(non-compliant firmware, boot-phase timing, etc.) and does not write to the output parameter, the\ncanary value `usize::MAX` stays in place. The guard in every caller then evaluates\n`processor_index > usize::MAX`, which is always false for any `usize`, so the pre-call validation\npasses unconditionally. The actual firmware call will then reject an invalid index with\n`INVALID_PARAMETER`, but the wrapper's explicit guard becomes useless and gives callers a false sense\nof pre-validation. A safer canary would be `0` (most restrictive) and/or the error should be\npropagated when the call fails.","fix":"Propagate the status: `(self.get_maximum_processor_index)(self, &mut max_processor_index).to_result()?;` and return `Result<usize>`. Alternatively use `0` as the canary so a failed call produces the tightest bound rather than the loosest one.","locations":[{"ref":"uefi/src/proto/debug/mod.rs:75-83","code":"   75 |     pub fn get_maximum_processor_index(&mut self) -> usize {\n   76 |         // initially set to a canary value for testing purposes\n   77 |         let mut max_processor_index: usize = usize::MAX;\n   78 | \n   79 |         // per the UEFI spec, this call should only return EFI_SUCCESS\n   80 |         let _ = (self.get_maximum_processor_index)(self, &mut max_processor_index);\n   81 | \n   82 |         max_processor_index\n   83 |     }","lines":9,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/debug/mod.rs#L75-L83"}]},{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"`DevicePathBuilder::push()` is documented to return `BuildError::UnexpectedEndEntire` when an\n`end::Entire` (END_ENTIRE) node is passed to it, and `BuildError::UnexpectedEndEntire` exists as\nan error variant with a `Display` impl. However, `push()` contains no check for this condition and\nthe variant is never constructed anywhere in the codebase. A caller who pushes `end::Entire`\nmanually (or accidentally, e.g. when copying nodes from a raw byte slice that includes the\nterminator) will silently embed an END_ENTIRE node mid-path. `finalize()` then appends a second\nEND_ENTIRE node. Consumers of the resulting path will see a truncated path ending at the first\nembedded terminator, silently discarding all nodes added afterwards.","fix":"Add a check in `push()` (or in `BuildNode::size_in_bytes()` for the `end::Entire` impl) that detects END_ENTIRE and returns `Err(BuildError::UnexpectedEndEntire)`. The `end::Entire` build node's `size_in_bytes()` is the natural place: return `Err(BuildError::UnexpectedEndEntire)` there so the error propagates automatically.","locations":[{"ref":"uefi/src/proto/device_path/build.rs:99-131","code":"   99 |     /// Add a node to the device path.\n  100 |     ///\n  101 |     /// An error will be returned if an [`END_ENTIRE`] node is passed to\n  102 |     /// this function, as that node will be added when [`Self::finalize`] is\n  103 |     /// called.\n  104 |     ///\n  105 |     /// [`END_ENTIRE`]: uefi::proto::device_path::DeviceSubType::END_ENTIRE\n  106 |     pub fn push(mut self, node: &dyn BuildNode) -> Result<Self, BuildError> {\n  107 |         let node_size = usize::from(node.size_in_bytes()?);\n  108 | \n  109 |         match &mut self.storage {\n  110 |             BuilderStorage::Buf { buf, offset } => {\n  111 |                 node.write_data(\n  112 |                     buf.get_mut(*offset..*offset + node_size)\n  113 |                         .ok_or(BuildError::BufferTooSmall)?,\n  114 |                 );\n  115 |                 *offset += node_size;\n  116 |             }\n  117 |             #[cfg(feature = \"alloc\")]\n  118 |             BuilderStorage::Vec(vec) => {\n  119 |                 let old_size = vec.len();\n  120 |                 vec.reserve(node_size);\n  121 |                 let buf = &mut vec.spare_capacity_mut()[..node_size];\n  122 |                 node.write_data(buf);\n  123 |                 // SAFETY: The memory is valid.\n  124 |                 unsafe {\n  125 |                     vec.set_len(old_size + node_size);\n  126 |                 }\n  127 |             }\n  128 |         }\n  129 | \n  130 |         Ok(self)\n  131 |     }","lines":33,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/device_path/build.rs#L99-L131"},{"ref":"uefi/src/proto/device_path/build.rs:169-181","code":"  169 | #[derive(Clone, Copy, Debug)]\n  170 | pub enum BuildError {\n  171 |     /// A node was too big to fit in the remaining buffer space.\n  172 |     BufferTooSmall,\n  173 | \n  174 |     /// An individual node's length is too big to fit in a [`u16`].\n  175 |     NodeTooBig,\n  176 | \n  177 |     /// An [`END_ENTIRE`] node was passed to the builder. Use\n  178 |     /// [`DevicePathBuilder::finalize`] instead.\n  179 |     ///\n  180 |     /// [`END_ENTIRE`]: uefi::proto::device_path::DeviceSubType::END_ENTIRE\n  181 |     UnexpectedEndEntire,","lines":13,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/device_path/build.rs#L169-L181"}]},{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":true,"description":"`GptPartitionAttributes::TYPE_SPECIFIC_BIT_0` is defined as `1 << 47` (bit 47),\nbut `RESERVED_FOR_PARTITION_TYPE` covers bits 48-63 (`0xffff_0000_0000_0000`),\nand the subsequent named bits start at `TYPE_SPECIFIC_BIT_1 = 1 << 48`.\nAccording to the UEFI spec, bits 48-63 are reserved for the partition type;\nbit 47 is in the \"reserved for future use\" range (bits 3-47). So\n`TYPE_SPECIFIC_BIT_0` is misplaced by one bit, making it inconsistent with\nthe mask and with the `type_specific_bits()` accessor, which only extracts\nbits 48-63 (its result never reflects `TYPE_SPECIFIC_BIT_0`).","fix":"Change `TYPE_SPECIFIC_BIT_0 = 1 << 47` to `TYPE_SPECIFIC_BIT_0 = 1 << 48` and shift all subsequent `TYPE_SPECIFIC_BIT_N` values up by one.","locations":[{"ref":"uefi/src/proto/media/partition.rs:100-104","code":"  100 |         /// The meaning of this bit depends on the partition type.\n  101 |         const TYPE_SPECIFIC_BIT_0 = 1 << 47;\n  102 | \n  103 |         /// The meaning of this bit depends on the partition type.\n  104 |         const TYPE_SPECIFIC_BIT_1 = 1 << 48;","lines":5,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/media/partition.rs#L100-L104"}]},{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"`EventLogIter` for the TCG v1 event log detects the last entry by testing\n`self.location == self.log.last_entry` (pointer equality). If a malformed or\ndeliberately crafted event log causes the iterator to advance `self.location` past\n`self.log.last_entry` without ever landing exactly on it (e.g., because the variable-length event\nat the last-entry pointer has a `event_data_size` that puts the next cursor beyond the last-entry\npointer), the equality check never fires and the iterator reads indefinitely past the end of the\nlog region, causing out-of-bounds memory access. The same structural issue exists in the TCG v2\niterator via `event.next`.","fix":"Track a strict upper-bound pointer (`end_ptr = last_entry + size_of_val(last_event)`) and stop\niteration when `self.location >= end_ptr` rather than relying on exact equality. At minimum, add a\ncheck `self.location <= self.log.last_entry` before advancing, and set location to null if the\ncondition fails.","locations":[{"ref":"uefi/src/proto/tcg/v1.rs:300-323","code":"  300 |     fn next(&mut self) -> Option<Self::Item> {\n  301 |         // The spec says that `last_entry` will be null if there are no\n  302 |         // events. Presumably `location` will be null as well, but check\n  303 |         // both just to be safe.\n  304 |         if self.location.is_null() || self.log.last_entry.is_null() {\n  305 |             return None;\n  306 |         }\n  307 | \n  308 |         // Safety: we trust that the protocol has given us a valid range\n  309 |         // of memory to read from.\n  310 |         // SAFETY: The memory is valid.\n  311 |         let event = unsafe { PcrEvent::from_ptr(self.location) };\n  312 | \n  313 |         // If this is the last entry, set the location to null so that\n  314 |         // future calls to `next()` return `None`.\n  315 |         if self.location == self.log.last_entry {\n  316 |             self.location = ptr::null();\n  317 |         } else {\n  318 |             // SAFETY: The memory is valid.\n  319 |             self.location = unsafe { self.location.add(size_of_val(event)) };\n  320 |         }\n  321 | \n  322 |         Some(event)\n  323 |     }","lines":24,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/tcg/v1.rs#L300-L323"},{"ref":"uefi/src/proto/tcg/v2.rs:539-564","code":"  539 | impl<'a> Iterator for EventLogIter<'a> {\n  540 |     type Item = PcrEvent<'a>;\n  541 | \n  542 |     fn next(&mut self) -> Option<Self::Item> {\n  543 |         // The spec says that `last_entry` will be null if there are no\n  544 |         // events. Presumably `location` will be null as well, but check\n  545 |         // both just to be safe.\n  546 |         if self.location.is_null() || self.log.last_entry.is_null() {\n  547 |             return None;\n  548 |         }\n  549 | \n  550 |         // Safety: we trust that the protocol has given us a valid range\n  551 |         // of memory to read from.\n  552 |         // SAFETY: The memory is valid.\n  553 |         let event = unsafe { PcrEvent::from_ptr(self.location, self.header.clone()?)? };\n  554 | \n  555 |         // If this is the last entry, set the location to null so that\n  556 |         // future calls to `next()` return `None`.\n  557 |         if self.location == self.log.last_entry {\n  558 |             self.location = ptr::null();\n  559 |         } else {\n  560 |             self.location = event.next;\n  561 |         }\n  562 | \n  563 |         Some(event)\n  564 |     }","lines":26,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/tcg/v2.rs#L539-L564"}]},{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","easy":false,"description":"In device_path/node.rs, gen_packed_struct_try_from_impl() for DST-group nodes (nodes\nwith more than one slice field) uses the elem type of the LAST spec field to determine\nhow to split the combined `data: [u8]` region in the packed struct. This works correctly\ntoday because all slice fields in the only DST-group node (acpi::Expanded) are `[u8]`.\nIf a future node is added with a DST group where the last field is `[u16]` or `[u32]`,\nthe generated TryFrom code would call `ptr_meta::from_raw_parts(ptr, dst_size / size_of::<T>())`\nwith the wrong element size against a `data: [u8]` Pointee whose metadata represents byte count,\nsilently producing a pointer with a wrong length metadata.","fix":"For DST-group nodes, always use `u8` as the elem type (since the packed struct\nalways uses `data: [u8]` for such nodes), rather than deriving it from `self.fields.last()`:\n```\nlet slice_elem_ty = if self.has_dst_group() {\n    quote!(u8)\n} else {\n    let ty = &self.fields.last().unwrap().slice_elem_ty().unwrap();\n    quote!(#ty)\n};\n```","locations":[{"ref":"xtask/src/device_path/node.rs:247-262","code":"  247 |         let try_from_body = if self.is_dst() {\n  248 |             let slice_elem_ty = &self.fields.last().unwrap().slice_elem_ty().unwrap();\n  249 | \n  250 |             let struct_ident = &self.struct_ident;\n  251 |             let static_size = self.static_size;\n  252 | \n  253 |             quote!(\n  254 |                 let static_size = #static_size;\n  255 |                 let dst_size = size_of_val(node).checked_sub(static_size).ok_or(\n  256 |                     NodeConversionError::InvalidLength)?;\n  257 |                 let elem_size = size_of::<#slice_elem_ty>();\n  258 |                 if dst_size % elem_size != 0 {\n  259 |                     return Err(NodeConversionError::InvalidLength);\n  260 |                 }\n  261 |                 let node: *const DevicePathNode = node;\n  262 |                 let node: *const #struct_ident = ptr_meta::from_raw_parts(node.cast(), dst_size / elem_size);","lines":16,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/xtask/src/device_path/node.rs#L247-L262"}]},{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"In time.rs Display impl, the float equality comparison fraction_part == 0.0 is used to decide whether to print a fractional component for the UTC offset. While this works for all time zones defined in standard use (multiples of 60 minutes result in exact f32 values), direct floating-point equality is generally fragile. For unusual but spec-valid time_zone values that are not multiples of 30 minutes (e.g., time_zone=37), the comparison still works correctly, but the approach is brittle and could silently produce incorrect output if the f32 arithmetic were to introduce rounding for any value.","fix":"Replace the float-based logic with integer arithmetic: compute offset_minutes = self.time_zone.unsigned_abs() as u32, then hours = offset_minutes / 60 and mins = offset_minutes % 60. Print the UTC offset using these integer values to avoid any float precision concerns entirely.","locations":[{"ref":"uefi-raw/src/time.rs:96-108","code":"   96 |             let sign = if self.time_zone < 0 { '-' } else { '+' };\n   97 |             let offset_in_hours = self.time_zone.unsigned_abs() as f32 / 60.0;\n   98 |             let integer_part = offset_in_hours as i16;\n   99 |             // We can't use \"offset_in_hours.fract()\" because it is part of `std`.\n  100 |             let fraction_part = offset_in_hours - (integer_part as f32);\n  101 |             // most time zones\n  102 |             if fraction_part == 0.0 {\n  103 |                 write!(f, \"UTC{sign}{offset_in_hours}\")?;\n  104 |             }\n  105 |             // time zones with 30min offset (and perhaps other special time zones)\n  106 |             else {\n  107 |                 write!(f, \"UTC{sign}{offset_in_hours:.1}\")?;\n  108 |             }","lines":13,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi-raw/src/time.rs#L96-L108"}]},{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"In the sierpinski example, the draw_sierpinski() function contains an infinite loop { ... } with no break or return path. The call site at line 150 is draw_sierpinski().unwrap() followed by Status::SUCCESS, but those lines are unreachable because the function never returns. While this may be intentional for a demo, the .unwrap() and return value are dead code that could mislead readers into thinking the function can terminate normally.","fix":"Change the return type of draw_sierpinski() to -> ! to express that it never returns, and remove the unreachable .unwrap() and Status::SUCCESS from main().","locations":[{"ref":"uefi-test-runner/examples/sierpinski.rs:128-145","code":"  128 |     loop {\n  129 |         // Choose one of the triangle's vertices at random.\n  130 |         let v = triangle[get_random_usize(&mut rng) % 3];\n  131 | \n  132 |         // Move `p` halfway to the chosen vertex.\n  133 |         p.x = (p.x + v.x) * 0.5;\n  134 |         p.y = (p.y + v.y) * 0.5;\n  135 | \n  136 |         // Set `p` to black.\n  137 |         let pixel = buffer.pixel(p.x as usize, p.y as usize).unwrap();\n  138 |         pixel.red = 0;\n  139 |         pixel.green = 100;\n  140 |         pixel.blue = 0;\n  141 | \n  142 |         // Draw the buffer to the screen.\n  143 |         buffer.blit_pixel(&mut gop, (p.x as usize, p.y as usize))?;\n  144 |     }\n  145 | }","lines":18,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi-test-runner/examples/sierpinski.rs#L128-L145"},{"ref":"uefi-test-runner/examples/sierpinski.rs:147-153","code":"  147 | #[entry]\n  148 | fn main() -> Status {\n  149 |     uefi::helpers::init().unwrap();\n  150 |     draw_sierpinski().unwrap();\n  151 |     Status::SUCCESS\n  152 | }\n  153 | // ANCHOR_END: all","lines":7,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi-test-runner/examples/sierpinski.rs#L147-L153"}]},{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"The `Path::parent()` implementation returns `None` for paths without any separator (e.g. `\"abc\"`), treating them as top-level. However, `create_dir_all()` relies on `parent()` returning `None` as the loop termination condition. If a path like `\"a\\b\"` is passed, `parent()` correctly returns `Some(\"a\")`, then calling `parent()` on `\"a\"` returns `None` (because `sep_count == 0`). This is correct but the returned parent path `\"a\"` is relative (no leading separator), and when passed to `create_dir()` it becomes `\"a\"` which UEFI may interpret as relative to the volume root. There is no enforcement that paths must be absolute before entering this code path.","fix":"Add a check in `create_dir_all()` (or in `validate_path()`) that the path is absolute (starts with the separator), or document that relative paths are supported and tested.","locations":[{"ref":"uefi/src/fs/path/path.rs:52-82","code":"   52 |     pub fn parent(&self) -> Option<PathBuf> {\n   53 |         let components_count = self.components().count();\n   54 |         if components_count == 0 {\n   55 |             return None;\n   56 |         }\n   57 | \n   58 |         // Return None, as we do not treat \"\\\\\" as dedicated component.\n   59 |         let sep_count = self\n   60 |             .0\n   61 |             .as_slice()\n   62 |             .iter()\n   63 | ile_system/fs.rs#L161-L181"}]},{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"The RISC-V `ExceptionType` constants mix synchronous exception codes and asynchronous interrupt\ncodes in the same flat namespace with identical numeric values:\n  `EXCEPT_RISCV_INST_ACCESS_FAULT = 1`  (exception)\n  `EXCEPT_RISCV_SUPERVISOR_SOFTWARE_INT = 1`  (interrupt)\n  `EXCEPT_RISCV_BREAKPOINT = 3` vs `EXCEPT_RISCV_MACHINE_SOFTWARE_INT = 3`, etc.\n\nA caller passing `EXCEPT_RISCV_SUPERVISOR_SOFTWARE_INT` to `register_exception_callback` passes\nthe numeric value `1`, which is indistinguishable from `EXCEPT_RISCV_INST_ACCESS_FAULT = 1`.\nThe firmware will register the callback for whichever trap the ISA interprets value `1` to mean in\nthat call path. There is no type-level distinction between the two sets.","fix":"Add documentation that makes the dual-namespace explicit, explaining that interrupt codes are distinguished by the hardware cause-register MSB and the firmware's own trap routing, not by numeric value. If the UEFI spec mandates different values for interrupt types on RISC-V (e.g. negative `isize` values with the sign bit set to mirror the hardware cause register), correct the constants accordingly.","locations":[{"ref":"uefi/src/proto/debug/exception.rs:145-188","code":"  145 | #[cfg(any(target_arch = \"riscv32\", target_arch = \"riscv64\"))]\n  146 | impl ExceptionType {\n  147 |     /// Instruction misaligned\n  148 |     pub const EXCEPT_RISCV_INST_MISALIGNED: Self = Self(0);\n  149 |     /// Instruction access fault\n  150 |     pub const EXCEPT_RISCV_INST_ACCESS_FAULT: Self = Self(1);\n  151 |     /// Illegal instruction\n  152 |     pub const EXCEPT_RISCV_ILLEGAL_INST: Self = Self(2);\n  153 |     /// Breakpoint\n  154 |     pub const EXCEPT_RISCV_BREAKPOINT: Self = Self(3);\n  155 |     /// Load address misaligned\n  156 |     pub const EXCEPT_RISCV_LOAD_ADDRESS_MISALIGNED: Self = Self(4);\n  157 |     /// Load accept fault\n  158 |     pub const EXCEPT_RISCV_LOAD_ACCESS_FAULT: Self = Self(5);\n  159 |     /// Store AMO address misaligned\n  160 |     pub const EXCEPT_RISCV_STORE_AMO_ADDRESS_MISALIGNED: Self = Self(6);\n  161 |     /// Store AMO access fault\n  162 |     pub const EXCEPT_RISCV_STORE_AMO_ACCESS_FAULT: Self = Self(7);\n  163 |     /// ECALL from User mode\n  164 |     pub const EXCEPT_RISCV_ENV_CALL_FROM_UMODE: Self = Self(8);\n  165 |     /// ECALL from Supervisor mode\n  166 |     pub const EXCEPT_RISCV_ENV_CALL_FROM_SMODE: Self = Self(9);\n  167 |     /// ECALL from Machine mode\n  168 |     pub const EXCEPT_RISCV_ENV_CALL_FROM_MMODE: Self = Self(11);\n  169 |     /// Instruction page fault\n  170 |     pub const EXCEPT_RISCV_INST_PAGE_FAULT: Self = Self(12);\n  171 |     /// Load page fault\n  172 |     pub const EXCEPT_RISCV_LOAD_PAGE_FAULT: Self = Self(13);\n  173 |     /// Store AMO page fault\n  174 |     pub const EXCEPT_RISCV_STORE_AMO_PAGE_FAULT: Self = Self(15);\n  175 |     // RISC-V interrupt types\n  176 |     /// Supervisor software interrupt\n  177 |     pub const EXCEPT_RISCV_SUPERVISOR_SOFTWARE_INT: Self = Self(1);\n  178 |     /// Machine software interrupt\n  179 |     pub const EXCEPT_RISCV_MACHINE_SOFTWARE_INT: Self = Self(3);\n  180 |     /// Supervisor timer interrupt\n  181 |     pub const EXCEPT_RISCV_SUPERVISOR_TIMER_INT: Self = Self(5);\n  182 |     /// Machine timer interrupt\n  183 |     pub const EXCEPT_RISCV_MACHINE_TIMER_INT: Self = Self(7);\n  184 |     /// Supervisor external interrupt\n  185 |     pub const EXCEPT_RISCV_SUPERVISOR_EXTERNAL_INT: Self = Self(9);\n  186 |     /// Machine external interrupt\n  187 |     pub const EXCEPT_RISCV_MACHINE_EXTERNAL_INT: Self = Self(11);\n  188 | }","lines":44,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/debug/exception.rs#L145-L188"}]},{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"`ConfigurationString::parse_bytes_from_hex` silently maps invalid hex bytes to\n`0x00` via `unwrap_or_default()`. When the NAME or VALUE field in a UEFI\nconfiguration string contains non-hex characters (e.g. due to firmware bugs or\nfuzzing), the parser proceeds with zeros rather than returning a parse error.\nThis can cause follow-on logic to silently interpret incorrect values as valid.","fix":"Return an error iterator item (e.g. by changing the return type to `impl Iterator<Item = Result<u8, ParseError>>`) or reject the input up-front by checking that all characters are valid hex.","locations":[{"ref":"uefi/src/proto/hii/config_str.rs:147-152","code":"  147 |     pub fn parse_bytes_from_hex(hex: &str) -> impl DoubleEndedIterator<Item = u8> {\n  148 |         hex.as_bytes().chunks(2).map(|chunk| {\n  149 |             let chunk = str::from_utf8(chunk).unwrap_or_default();\n  150 |             u8::from_str_radix(chunk, 16).unwrap_or_default()\n  151 |         })\n  152 |     }","lines":6,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/hii/config_str.rs#L147-L152"}]},{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"low","easy":false,"description":"In `runtime/mod.rs`, `variable_exists` detects the existence of a UEFI variable by calling\n`GetVariable` with a zero-length data buffer and treating `BUFFER_TOO_SMALL` as \"variable found\"\nand `NOT_FOUND` as \"variable absent\". All other status codes are returned as errors.\n\nHowever, the UEFI specification does not guarantee that every firmware returns `BUFFER_TOO_SMALL`\nwhen the buffer is too small; some firmware implementations return `SUCCESS` when the requested\ndata length is 0, even for non-empty variables. In that case the function would incorrectly return\n`Err` (from the `_` arm converting `SUCCESS` into an error via `Error::from(status)`, which would\npanic because `Error::new` asserts the status is not `SUCCESS`).\n\nActually the `_ =>` branch calls `Error::from(status)` via the `From<Status> for Error` impl, but\n`Error::new` asserts `status != SUCCESS`. So if firmware returns `SUCCESS` here, this code panics.","fix":"Add `Status::SUCCESS => Ok(true)` before the `_` arm to handle firmware that returns success for a\nzero-length query, treating it as \"variable exists\". This avoids the panic and handles a wider range\nof firmware behaviors.","locations":[{"ref":"uefi/src/runtime/mod.rs:122-130","code":"  122 |     match status {\n  123 |         // If the variable exists, the status will be BUFFER_TOO_SMALL because\n  124 |         // data_size is 0. Empty variables do not exist, because setting a\n  125 |         // variable with empty data deletes the variable. In other words, the\n  126 |         // status will never be SUCCESS.\n  127 |         Status::BUFFER_TOO_SMALL => Ok(true),\n  128 |         Status::NOT_FOUND => Ok(false),\n  129 |         _ => Err(Error::from(status)),\n  130 |     }","lines":9,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/runtime/mod.rs#L122-L130"}]},{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"high","easy":false,"description":"In `FileSystem::read()`, when `read_bytes != info.file_size() as usize` only a `log::error!` is emitted and `Ok(vec)` is still returned. The returned `Vec` has `file_size()` bytes allocated but only the first `read_bytes` are valid file content (the rest are zeros from the `vec![0; ...]` initialisation). Callers receive a silently truncated result with no indication of failure.","fix":"Return an `Err(Error::Io(IoError { context: IoErrorContext::ReadFailure, ... }))` when the number of bytes read does not match the file size, consistent with how `copy()` handles zero-byte reads.","locations":[{"ref":"uefi/src/fs/file_system/fs.rs:232-237","code":"  232 |         // we read the whole file at once!\n  233 |         if read_bytes != info.file_size() as usize {\n  234 |             log::error!(\"Did only read {}/{} bytes\", info.file_size(), read_bytes);\n  235 |         }\n  236 | \n  237 |         Ok(vec)","lines":6,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/fs/file_system/fs.rs#L232-L237"}]},{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","easy":false,"description":"In `FileSystem::remove_dir_all()`, directory entry errors are silently discarded via `.filter_map(|r| r.ok())`. If iterating directory entries fails (e.g. an IO error mid-iteration), the error is swallowed and the loop continues with incomplete data, potentially leaving the directory in a partially-deleted state and returning `Ok(())`.","fix":"Replace `filter_map(|r| r.ok())` with a `for` loop that returns the error: `for file_info_result in self.read_dir(path)? { let file_info = file_info_result.map_err(|_| Error::Io(...))?; ... }`.","locations":[{"ref":"uefi/src/fs/file_system/fs.rs:296-299","code":"  296 |         for file_info in self\n  297 |             .read_dir(path)?\n  298 |             .filter_map(|file_info_result| file_info_result.ok())\n  299 |         {","lines":4,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/fs/file_system/fs.rs#L296-L299"}]},{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"low","easy":false,"description":"SimpleNetworkProtocol declares all function pointer fields (start, stop, initialize, reset, shutdown, receive_filters, station_address, statistics, multicast_ip_to_mac, non_volatile_data, get_status, transmit, receive) as taking *const Self. However, the UEFI specification defines all EFI_SIMPLE_NETWORK_PROTOCOL functions with a mutable IN EFI_SIMPLE_NETWORK_PROTOCOL *This pointer, because they update the protocol's state. Using *const obscures the mutability contract and could mislead higher-level wrappers, though it does not cause an ABI incompatibility in practice.","fix":"Change *const Self to *mut Self for all SNP function pointer fields that modify state (start, stop, initialize, reset, shutdown, receive_filters, station_address, non_volatile_data), consistent with the UEFI spec. Read-only queries like get_status may remain *const.","locations":[{"ref":"uefi-raw/src/protocol/network/snp.rs:11-80","code":"   11 | pub struct SimpleNetworkProtocol {\n   12 |     pub revision: u64,\n   13 |     pub start: unsafe extern \"efiapi\" fn(this: *const Self) -> Status,\n   14 |     pub stop: unsafe extern \"efiapi\" fn(this: *const Self) -> Status,\n   15 |     pub initialize: unsafe extern \"efiapi\" fn(\n   16 |         this: *const Self,\n   17 |         extra_receive_buffer_size: usize,\n   18 |         extra_transmit_buffer_size: usize,\n   19 |     ) -> Status,\n   20 |     pub reset:\n   21 |         unsafe extern \"efiapi\" fn(this: *const Self, extended_verification: Boolean) -> Status,\n   22 |     pub shutdown: unsafe extern \"efiapi\" fn(this: *const Self) -> Status,\n   23 |     pub receive_filters: unsafe extern \"efiapi\" fn(\n   24 |         this: *const Self,\n   25 |         enable: ReceiveFlags,\n   26 |         disable: ReceiveFlags,\n   27 |         reset_multicast_filter: Boolean,\n   28 |         multicast_filter_count: usize,\n   29 |         multicast_filter: *const MacAddress,\n   30 |     ) -> Status,\n   31 |     pub station_address: unsafe extern \"efiapi\" fn(\n   32 |         this: *const Self,\n   33 |         reset: Boolean,\n   34 |         new: *const MacAddress,\n   35 |     ) -> Status,\n   36 |     pub statistics: unsafe extern \"efiapi\" fn(\n   37 |         this: *const Self,\n   38 |         reset: Boolean,\n   39 |         statistics_size: *mut usize,\n   40 |         statistics_table: *mut NetworkStatistics,\n   41 |     ) -> Status,\n   42 |     pub multicast_ip_to_mac: unsafe extern \"efiapi\" fn(\n   43 |         this: *const Self,\n   44 |         ipv6: Boolean,\n   45 |         ip: *const IpAddress,\n   46 |         mac: *mut MacAddress,\n   47 |     ) -> Status,\n   48 |     pub non_volatile_data: unsafe extern \"efiapi\" fn(\n   49 |         this: *const Self,\n   50 |         read: Boolean,\n   51 |         offset: usize,\n   52 |         buffer_size: usize,\n   53 |         buffer: *mut ffi::c_void,\n   54 |     ) -> Status,\n   55 |     pub get_status: unsafe extern \"efiapi\" fn(\n   56 |         this: *const Self,\n   57 |         interrupt_status: *mut InterruptStatus,\n   58 |         transmit_buffer: *mut *mut ffi::c_void,\n   59 |     ) -> Status,\n   60 |     pub transmit: unsafe extern \"efiapi\" fn(\n   61 |         this: *const Self,\n   62 |         header_size: usize,\n   63 |         buffer_size: usize,\n   64 |         buffer: *const ffi::c_void,\n   65 |         source_address: *const MacAddress,\n   66 |         dest_address: *const MacAddress,\n   67 |         protocol: *const u16,\n   68 |     ) -> Status,\n   69 |     pub receive: unsafe extern \"efiapi\" fn(\n   70 |         this: *const Self,\n   71 |         header_size: *mut usize,\n   72 |         buffer_size: *mut usize,\n   73 |         buffer: *mut ffi::c_void,\n   74 |         source_address: *mut MacAddress,\n   75 |         dest_address: *mut MacAddress,\n   76 |         protocol: *mut u16,\n   77 |     ) -> Status,\n   78 |     pub wait_for_packet: Event,\n   79 |     pub mode: *mut NetworkMode,\n   80 | }","lines":70,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi-raw/src/protocol/network/snp.rs#L11-L80"}]},{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","easy":false,"description":"The `Components` iterator in `path.rs` allocates a `CString16` for each path component on every call to `next()`. `Path::parent()` itself calls `components().count()` (full traversal) followed by `
