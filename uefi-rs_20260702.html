<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e2e8f0;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#64748b;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#cbd5e1;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#94a3b8}
.project-info .pi-row .pi-k{color:#64748b}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#94a3b8;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#475569;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e2e8f0;border-color:#475569}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#64748b;border-color:#334155}
.sev-info    {background:#0c2a2a;color:#5eead4;border-color:#0f766e}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.easy-badge{background:#052e16;color:#86efac;border-color:#16a34a}
.st-open{background:#1e293b;color:#475569;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#64748b;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#94a3b8;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e2e8f0}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#475569}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#94a3b8;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e2e8f0}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#cbd5e1}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#475569;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#64748b}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#64748b}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#64748b;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#64748b;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e2e8f0}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#cbd5e1;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#475569;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e2e8f0;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

<script type="application/json" id="D">[{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","easy":true,"description":"In CustomLoadFile2Protocol::load_file(), buf_len is a raw pointer but is never checked for null before being dereferenced. The condition `buf.is_null() || unsafe { *buf_len } < ...` only null-checks buf; if buf_len is null (permitted by nothing in this unsafe callback), the dereference at line 47 is UB. The same pointer is unconditionally written at line 49, also without a null check.","fix":"Add `if buf_len.is_null() { return Status::INVALID_PARAMETER; }` before accessing *buf_len.","locations":[{"ref":"uefi-test-runner/src/proto/load.rs:46-50","code":"   46 |     fn load_file(&self, buf_len: *mut usize, buf: *mut c_void) -> Status {\n   47 |         if buf.is_null() || unsafe { *buf_len } < self.file_data.len() {\n   48 |             log::debug!(\"Returning buffer size\");\n   49 |             unsafe { *buf_len = self.file_data.len() };\n   50 |             Status::BUFFER_TOO_SMALL","lines":5,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi-test-runner/src/proto/load.rs#L46-L50"}]},{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","easy":false,"description":"In `FileSystem::remove_dir()` and `FileSystem::remove_file()`, `into_type()` returns `Result<FileType>` but is called with `.unwrap()`. If `is_regular_file()` returns a UEFI error, the unwrap panics instead of propagating the error to the caller. Both functions return `FileSystemResult<()>` so the error can be propagated cleanly.","fix":"Replace `.unwrap()` with `map_err(|err| Error::Io(IoError { path: path.to_path_buf(), context: IoErrorContext::OpenError, uefi_error: err }))?`.","locations":[{"ref":"uefi/src/fs/file_system/fs.rs:269-270","code":"  269 |             .into_type()\n  270 |             .unwrap();","lines":2,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/fs/file_system/fs.rs#L269-L270"},{"ref":"uefi/src/fs/file_system/fs.rs:327-328","code":"  327 |             .into_type()\n  328 |             .unwrap();","lines":2,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/fs/file_system/fs.rs#L327-L328"}]},{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"high","easy":false,"description":"In `FileSystem::write()`, after creating the file with `CreateReadWrite`, `into_regular_file().unwrap()` panics if the UEFI firmware returns a handle to a directory (e.g. due to a race or firmware quirk) or if `into_type()` itself fails internally. The function signature returns `FileSystemResult<()>` so the error should be propagated.","fix":"Replace `.unwrap()` with `.ok_or_else(|| Error::Io(IoError { path: path.to_path_buf(), context: IoErrorContext::NotAFile, uefi_error: Status::INVALID_PARAMETER.into() }))?`.","locations":[{"ref":"uefi/src/fs/file_system/fs.rs:375-378","code":"  375 |         let mut handle = self\n  376 |             .open(path, UefiFileMode::CreateReadWrite, false)?\n  377 |             .into_regular_file()\n  378 |             .unwrap();","lines":4,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/fs/file_system/fs.rs#L375-L378"}]},{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"high","easy":false,"description":"The default panic handler calls `println!()` which internally calls `stdout.write_fmt(args).expect(\"Failed to write to stdout\")`. If the stdout write fails (e.g. device error, buffer full), `expect()` triggers a second panic, which re-invokes the `#[panic_handler]`, which calls `println!()` again - causing unbounded recursion until a stack overflow. In a no_std environment there is typically no protection against recursive panics.","fix":"In `_print`, replace `.expect(...)` with a silent ignore (e.g. `let _ = stdout.write_fmt(args);`), or provide a separate low-level write path for the panic handler that does not call back into the panic machinery. Alternatively, use a flag to detect re-entrant panic and skip the println on the second entry.","locations":[{"ref":"uefi/src/helpers/panic_handler.rs:9-10","code":"    9 | fn panic_handler(info: &core::panic::PanicInfo) -> ! {\n   10 |     println!(\"[PANIC]: {}\", info);","lines":2,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/helpers/panic_handler.rs#L9-L10"},{"ref":"uefi/src/helpers/println.rs:11","code":"   11 |             stdout.write_fmt(args).expect(\"Failed to write to stdout\");","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/helpers/println.rs#L11"}]},{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"high","easy":true,"description":"`RestService::build_size_vendor_guid_and_data` and `build_vendor_guid_and_data` both contain\n`assert!(self.service_type == RestServiceType::VENDOR)` inside the `if let Some(src) = &self.vendor_guid_and_data`\nbranch. A caller who sets `vendor_guid_and_data: Some(...)` with any service type other than\n`VENDOR` (e.g. `REDFISH` or `ODATA`) will trigger a panic at runtime - first from inside\n`size_in_bytes()` (called by `push()`), which is supposed to be infallible aside from returning\n`Err(BuildError::NodeTooBig)`. This panic is directly reachable by safe Rust code via the public\n`push()` API.","fix":"Replace the `assert!` calls with a proper validation that returns `BuildError`. Add a new `BuildError::InvalidData` variant (or reuse `NodeTooBig`), and in `size_in_bytes()` return `Err(...)` instead of panicking. The generator in `xtask/src/device_path/spec.rs` should be updated to emit a `?` / `return Err(...)` pattern instead of `assert!`.","locations":[{"ref":"uefi/src/proto/device_path/device_path_gen.rs:5746-5753","code":" 5746 |             fn build_size_vendor_guid_and_data(&self) -> usize {\n 5747 |                 if let Some(src) = &self.vendor_guid_and_data {\n 5748 |                     assert!(self.service_type == device_path::messaging::RestServiceType::VENDOR);\n 5749 |                     size_of::<Guid>() + size_of_val(src.vendor_defined_data)\n 5750 |                 } else {\n 5751 |                     0\n 5752 |                 }\n 5753 |             }","lines":8,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/device_path/device_path_gen.rs#L5746-L5753"},{"ref":"uefi/src/proto/device_path/device_path_gen.rs:5755-5773","code":" 5755 |             fn build_vendor_guid_and_data(&self, out: &mut [MaybeUninit<u8>]) {\n 5756 |                 if let Some(src) = &self.vendor_guid_and_data {\n 5757 |                     assert!(self.service_type == device_path::messaging::RestServiceType::VENDOR);\n 5758 |                     let (guid_out, data_out) = out.split_at_mut(size_of::<Guid>());\n 5759 |                     let guid_out_ptr: *mut Guid = maybe_uninit_slice_as_mut_ptr(guid_out).cast();\n 5760 |                     #[expect(clippy::undocumented_unsafe_blocks)]\n 5761 |                     unsafe {\n 5762 |                         guid_out_ptr.write_unaligned(src.vendor_guid);\n 5763 |                     }\n 5764 | \n 5765 |                     let data_out_ptr = maybe_uninit_slice_as_mut_ptr(data_out);\n 5766 |                     #[expect(clippy::undocumented_unsafe_blocks)]\n 5767 |                     unsafe {\n 5768 |                         src.vendor_defined_data\n 5769 |                             .as_ptr()\n 5770 |                             .copy_to_nonoverlapping(data_out_ptr, data_out.len());\n 5771 |                     }\n 5772 |                 }\n 5773 |             }","lines":19,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/device_path/device_path_gen.rs#L5755-L5773"},{"ref":"xtask/src/device_path/spec.rs:975-983","code":"  975 |         fn build_size_vendor_guid_and_data(&self) -> usize {\n  976 |             if let Some(src) = &self.vendor_guid_and_data {\n  977 |                 assert!(self.service_type == device_path::messaging::RestServiceType::VENDOR);\n  978 | \n  979 |                 size_of::<Guid>() + size_of_val(src.vendor_defined_data)\n  980 |             } else {\n  981 |                 0\n  982 |             }\n  983 |         }","lines":9,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/xtask/src/device_path/spec.rs#L975-L983"},{"ref":"xtask/src/device_path/spec.rs:985-1007","code":"  985 |         fn build_vendor_guid_and_data(&self, out: &mut [MaybeUninit<u8>]) {\n  986 |             if let Some(src) = &self.vendor_guid_and_data {\n  987 |                 assert!(self.service_type == device_path::messaging::RestServiceType::VENDOR);\n  988 | \n  989 |                 let (guid_out, data_out) = out.split_at_mut(size_of::<Guid>());\n  990 | \n  991 |                 let guid_out_ptr: *mut Guid = maybe_uninit_slice_as_mut_ptr(guid_out).cast();\n  992 |                 // SAFETY: The memory is valid.\n  993 |                 #[expect(clippy::undocumented_unsafe_blocks)] // quote!() is removing comments\n  994 |                 unsafe {\n  995 |                     guid_out_ptr.write_unaligned(src.vendor_guid);\n  996 |                 }\n  997 | \n  998 |                 let data_out_ptr = maybe_uninit_slice_as_mut_ptr(data_out);\n  999 |                 // SAFETY: The memory is valid.\n 1000 |                 #[expect(clippy::undocumented_unsafe_blocks)] // quote!() is removing comments\n 1001 |                 unsafe {\n 1002 |                     src.vendor_defined_data\n 1003 |                         .as_ptr()\n 1004 |                         .copy_to_nonoverlapping(data_out_ptr, data_out.len());\n 1005 |                 }\n 1006 |             }\n 1007 |         }","lines":23,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/xtask/src/device_path/spec.rs#L985-L1007"}]},{"id":"PANIC_6","type":"panic","type_label":"Panic","severity":"high","easy":true,"description":"`uefi/src/proto/network/http.rs` `HttpHelper::request()` panics if the URL contains any character\nthat cannot be encoded in UCS-2 (i.e., code points above U+FFFF). `CString16::try_from(url)`\nreturns `Err` for such characters, and the immediately following `.unwrap()` panics. This is a\npublic API entry point, so callers cannot prevent the panic.","fix":"Replace `.unwrap()` with `?` and change the return type of `request()` to propagate the error, or return `Status::INVALID_PARAMETER` on conversion failure.","locations":[{"ref":"uefi/src/proto/network/http.rs:237","code":"  237 |         let url16 = uefi::CString16::try_from(url).unwrap();","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/network/http.rs#L237"}]},{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"high","easy":false,"description":"Three unbounded busy-wait loops spin calling `poll()` until a token's status changes from\n`NOT_READY` (lines 281-287, 344-349, 405-410). If the firmware never changes the status\n(e.g., a firmware bug or a lost interrupt), the loop runs forever and hangs the system with\nno timeout. This is the same class of defect as the one found in\n`uefi-test-runner/src/proto/network/snp.rs:216-222`.","fix":"Add a poll-count limit or a wall-clock timeout and return `Status::TIMEOUT` when exceeded.","locations":[{"ref":"uefi/src/proto/network/http.rs:281-287","code":"  281 |         loop {\n  282 |             if tx_token.status != Status::NOT_READY {\n  283 |                 break;\n  284 |             }\n  285 |             polls += 1;\n  286 |             p.poll()?;\n  287 |         }","lines":7,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/network/http.rs#L281-L287"},{"ref":"uefi/src/proto/network/http.rs:344-349","code":"  344 |         loop {\n  345 |             if rx_token.status != Status::NOT_READY {\n  346 |                 break;\n  347 |             }\n  348 |             p.poll()?;\n  349 |         }","lines":6,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/network/http.rs#L344-L349"},{"ref":"uefi/src/proto/network/http.rs:405-410","code":"  405 |         loop {\n  406 |             if rx_token.status != Status::NOT_READY {\n  407 |                 break;\n  408 |             }\n  409 |             p.poll()?;\n  410 |         }","lines":6,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/network/http.rs#L405-L410"}]},{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"high","easy":true,"description":"`HttpHelper::response_first()` and `HttpHelper::response_more()` index a fixed-size body buffer\nusing `rx_msg.body_length` returned by the firmware after the call. If a misbehaving firmware\nreports a `body_length` larger than the 16 KiB buffer that was passed in, the slice indexing\n`body[0..rx_msg.body_length]` (line 381) and `body_recv_buffer[0..rx_msg.body_length]`\n(line 424) will panic with an out-of-bounds index.","fix":"Clamp `rx_msg.body_length` to `body.len()` before indexing: `rx_msg.body_length.min(body.len())`.","locations":[{"ref":"uefi/src/proto/network/http.rs:381","code":"  381 |             body: body[0..rx_msg.body_length].to_vec(),","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/network/http.rs#L381"},{"ref":"uefi/src/proto/network/http.rs:424","code":"  424 |         let new_data = &body_recv_buffer[0..rx_msg.body_length];","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/network/http.rs#L424"}]},{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"high","easy":true,"description":"In net.rs, the UDP echo service panics if a zero-length datagram is received.\nrecv_from() can return len == 0 for empty UDP packets. The code then does\n`buffer = &mut buffer[..0]` and immediately calls `split_first_mut().unwrap()` on an\nempty slice, which returns None - causing a panic.\nThe thread panic propagates to the Drop of EchoService, where\n`.expect(\"failed to join echo service thread\")` triggers a second panic (double-panic == abort).","fix":"Guard against zero-length packets with `if len == 0 { continue; }` before the split_first_mut call.","locations":[{"ref":"xtask/src/net.rs:68-71","code":"   68 |         let buffer = &mut buffer[..len];\n   69 | \n   70 |         // Extract header information.\n   71 |         let (payload_len, payload) = buffer.split_first_mut().unwrap();","lines":4,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/xtask/src/net.rs#L68-L71"}]},{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"high","easy":true,"description":"In net.rs, if a UDP packet is received where the first byte (payload_len) does not match\nthe actual remaining payload length, the assert_eq! on line 72 panics the echo thread.\nAny peer (including a buggy UEFI test implementation) can send a malformed packet and\nkill the echo service. The subsequent Drop invocation then hits `.expect()` on the failed join,\ncausing an abort.","fix":"Replace the assert_eq! with a checked condition that discards malformed packets: `if usize::from(*payload_len) != payload.len() { continue; }`","locations":[{"ref":"xtask/src/net.rs:71-72","code":"   71 |         let (payload_len, payload) = buffer.split_first_mut().unwrap();\n   72 |         assert_eq!(usize::from(*payload_len), payload.len());","lines":2,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/xtask/src/net.rs#L71-L72"}]},{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"medium","easy":false,"description":"PxeBaseCodeIpFilter::ip_list() slices ip_list with the ip_cnt field value: &self.ip_list[..usize::from(self.ip_cnt)]. The ip_list array has a fixed size of 8, but ip_cnt is a u8 field populated from firmware data. If firmware provides an ip_cnt > 8 (due to a firmware bug or data corruption), the slice operation will panic. This struct is received from the PXE protocol's mode pointer, not constructed by user code alone.","fix":"Clamp ip_cnt before slicing: &self.ip_list[..usize::from(self.ip_cnt).min(self.ip_list.len())]","locations":[{"ref":"uefi-raw/src/protocol/network/pxe.rs:469-471","code":"  469 |     pub fn ip_list(&self) -> &[IpAddress] {\n  470 |         &self.ip_list[..usize::from(self.ip_cnt)]\n  471 |     }","lines":3,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi-raw/src/protocol/network/pxe.rs#L469-L471"}]},{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"medium","easy":true,"description":"In test_debug_port(), a Vec is created with `Vec::with_capacity(4096)` and then passed directly to `DebugPort::read`. Vec::with_capacity sets capacity but leaves len at 0, so the slice dereferenced via DerefMut has length 0. The firmware is asked to read into a 0-byte buffer, meaning no data is ever actually read. The test silently passes without validating any read data.","fix":"Use `vec![0u8; 4096]` to create a Vec with both capacity and length set to 4096, so the slice passed to read() has the intended size.","locations":[{"ref":"uefi-test-runner/src/proto/debug.rs:61-65","code":"   61 |                 let mut data = Vec::with_capacity(4096);\n   62 | \n   63 |                 debug_port\n   64 |                     .read(timeout, &mut data)\n   65 |                     .expect(\"Error while reading from debug port\");","lines":5,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi-test-runner/src/proto/debug.rs#L61-L65"}]},{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"medium","easy":false,"description":"In test_debug_support() inside debug.rs, the match on debug_support.arch() contains architecture-gated arms for EBC, x86_64, and aarch64, then falls through to `_ => unreachable!()`. If a DebugSupport protocol instance reports a ProcessorArch value that is neither EBC nor the compiled target arch (e.g., a bare-metal RISC-V or IA-32 host, or firmware that exposes multiple DebugSupport handles with mixed architectures), the unreachable! panics and aborts the test.","fix":"Replace `_ => unreachable!()` with `_ => { info!(\"Skipping unsupported arch: {:?}\", debug_support.arch()); continue; }` to skip gracefully rather than panic.","locations":[{"ref":"uefi-test-runner/src/proto/debug.rs:90-151","code":"   90 | \n   91 |             match debug_support.arch() {\n   92 |                 // This arm is the only match when testing on QEMU w/ OVMF, regardless of the machine arch.\n   93 |                 // The released OVMF builds don't implement the Debug Support Protocol Interface for the\n   94 |                 // machine arch, only EBC.\n   95 |                 ProcessorArch::EBC => unsafe {\n   96 |                     info!(\"Registering periodic callback\");\n   97 |                     debug_support\n   98 |                         .register_periodic_callback(0, Some(periodic_callback))\n   99 |                         .expect(\"Error while registering periodic callback\");\n  100 |                     info!(\"Deregistering periodic callback\");\n  101 |                     debug_support\n  102 |                         .register_periodic_callback(0, None)\n  103 |                         .expect(\"Error while deregistering periodic callback\");\n  104 |                     // for the EBC virtual CPU, there are already exception callbacks registered\n  105 |                     info!(\"Deregistering exception callback\");\n  106 |                     debug_support\n  107 |                         .register_exception_callback(0, None, ExceptionType::EXCEPT_EBC_DEBUG)\n  108 |                         .expect(\"Error while deregistering exception callback\");\n  109 |                     info!(\"Registering exception callback\");\n  110 |                     debug_support\n  111 |                         .register_exception_callback(\n  112 |                             0,\n  113 |                             Some(exception_callback),\n  114 |                             ExceptionType::EXCEPT_EBC_DEBUG,\n  115 |                         )\n  116 |                         .expect(\"Error while registering exception callback\");\n  117 |                 },\n  118 |                 #[cfg(target_arch = \"x86_64\")]\n  119 |                 ProcessorArch::X86_64 => unsafe {\n  120 |                     info!(\"Registering exception callback\");\n  121 |                     debug_support\n  122 |                         .register_exception_callback(\n  123 |                             0,\n  124 |                             Some(exception_callback),\n  125 |                             ExceptionType::EXCEPT_X64_DEBUG,\n  126 |                         )\n  127 |                         .expect(\"Error while registering exception callback\");\n  128 |                     info!(\"Deregistering exception callback\");\n  129 |                     debug_support\n  130 |                         .register_exception_callback(0, None, ExceptionType::EXCEPT_X64_DEBUG)\n  131 |                         .expect(\"Error while deregistering exception callback\");\n  132 |                 },\n  133 |                 #[cfg(target_arch = \"aarch64\")]\n  134 |                 ProcessorArch::AARCH_64 => unsafe {\n  135 |                     info!(\"Registering exception callback\");\n  136 |                     debug_support\n  137 |                         .register_exception_callback(\n  138 |                             0,\n  139 |                             Some(exception_callback),\n  140 |                             ExceptionType::EXCEPT_AARCH64_SERROR,\n  141 |                         )\n  142 |                         .expect(\"Error while registering exception callback\");\n  143 |                     info!(\"Deregistering exception callback\");\n  144 |                     debug_support\n  145 |                         .register_exception_callback(0, None, ExceptionType::EXCEPT_AARCH64_SERROR)\n  146 |                         .expect(\"Error while deregistering exception callback\");\n  147 |                 },\n  148 |                 // if we reach this, we're running on an arch that `cargo xtask run` doesn't support\n  149 |                 // TODO: Add match arms as we support testing on more archs\n  150 |                 _ => unreachable!(),\n  151 |             }","lines":62,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi-test-runner/src/proto/debug.rs#L90-L151"}]},{"id":"PANIC_14","type":"panic","type_label":"Panic","severity":"medium","easy":false,"description":"In driver.rs::test_component_name(), an `assert!` is placed inside a `find_map` closure. If a handle's supported_languages() call succeeds but returns an iterator that does not contain the expected language string, the assert! panics instead of returning None from find_map and trying the next handle. This causes a hard test abort rather than skipping non-matching handles, which would be the correct behavior for find_map discovery logic.","fix":"Replace the assert! with a filter: `component_name.supported_languages().ok()?.any(|lang| lang == english).then_some(component_name)?`. This returns None for handles that don't support the language instead of panicking.","locations":[{"ref":"uefi-test-runner/src/proto/driver.rs:102-120","code":"  102 |     let component_name: C = all_handles\n  103 |         .iter()\n  104 |         .find_map(|handle| {\n  105 |             let component_name = C::open(*handle).ok()?;\n  106 | \n  107 |             assert!(\n  108 |                 component_name\n  109 |                     .supported_languages()\n  110 |                     .ok()?\n  111 |                     .any(|lang| lang == english)\n  112 |             );\n  113 | \n  114 |             let driver_name = component_name.driver_name(english).ok()?;\n  115 |             if driver_name == fat_driver_name {\n  116 |                 Some(component_name)\n  117 |             } else {\n  118 |                 None\n  119 |             }\n  120 |         })","lines":19,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi-test-runner/src/proto/driver.rs#L102-L120"}]},{"id":"PANIC_15","type":"panic","type_label":"Panic","severity":"medium","easy":true,"description":"In rng.rs, `list[0]` is accessed without checking whether the slice returned by get_info is non-empty. If the RNG protocol reports zero algorithms, this is an out-of-bounds index panic.","fix":"Use `list.first().copied().unwrap_or(RngAlgorithmType::EMPTY_ALGORITHM)` or assert the list is non-empty before indexing.","locations":[{"ref":"uefi-test-runner/src/proto/rng.rs:16-21","code":"   16 |     let list = rng.get_info(&mut list).unwrap();\n   17 |     info!(\"Supported rng algorithms : {list:?}\");\n   18 | \n   19 |     let mut buf = [0u8; 4];\n   20 | \n   21 |     rng.get_rng(Some(list[0]), &mut buf).unwrap();","lines":6,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi-test-runner/src/proto/rng.rs#L16-L21"}]},{"id":"PANIC_16","type":"panic","type_label":"Panic","severity":"medium","easy":false,"description":"In usb/io.rs, supported_languages()[0] is indexed without first checking that the returned slice is non-empty. If a USB device reports zero supported languages (or the firmware returns an empty list), this is an out-of-bounds index panic.","fix":"Check that supported_languages is non-empty before indexing: `let test_language = supported_languages.first().expect(\"no supported languages\")`.","locations":[{"ref":"uefi-test-runner/src/proto/usb/io.rs:46-49","code":"   46 |         let supported_languages = io\n   47 |             .supported_languages()\n   48 |             .expect(\"failed to acquire supported language list\");\n   49 |         let test_language = supported_languages[0];","lines":4,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi-test-runner/src/proto/usb/io.rs#L46-L49"}]},{"id":"PANIC_17","type":"panic","type_label":"Panic","severity":"medium","easy":false,"description":"In `connect_controller()`, a user-visible `assert!` panics if the `driver_image` slice is non-empty but not terminated with `None`. Since this is a public API that accepts external input, the panic is not appropriate - the error should be returned as `Err(Status::INVALID_PARAMETER)` to let callers handle it.","fix":"Replace the `assert!` with `if !last.is_none() { return Err(Status::INVALID_PARAMETER.into()); }` so callers receive a recoverable error.","locations":[{"ref":"uefi/src/boot.rs:720-724","code":"  720 |     let driver_image: *const uefi_raw::Handle = if let Some(last) = driver_image.last() {\n  721 |         assert!(\n  722 |             last.is_none(),\n  723 |             \"driver_image parameter must be terminated with None\"\n  724 |         );","lines":5,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/boot.rs#L720-L724"}]},{"id":"PANIC_18","type":"panic","type_label":"Panic","severity":"medium","easy":false,"description":"In `find_handles()`, if `locate_handle` returns `BUFFER_TOO_SMALL` but with no error data (e.g. non-conforming firmware), the `.expect(\"error data is missing\")` at line 1070 panics instead of returning an error. Similarly, the `panic!` at line 1077 is reached when firmware returns `SUCCESS` with an empty buffer, which non-conforming firmware might do.","fix":"Replace `.expect()` with `ok_or_else(|| Status::UNSUPPORTED.into())?` and replace the `panic!` with `return Err(Status::UNSUPPORTED.into())` to handle non-conforming firmware gracefully.","locations":[{"ref":"uefi/src/boot.rs:1070","code":" 1070 |                 err.data().expect(\"error data is missing\")","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/boot.rs#L1070"},{"ref":"uefi/src/boot.rs:1077","code":" 1077 |         Ok(_) => panic!(\"locate_handle should not return success with empty buffer\"),","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/boot.rs#L1077"}]},{"id":"PANIC_19","type":"panic","type_label":"Panic","severity":"medium","easy":false,"description":"`ScopedProtocol::drop()` calls `assert_eq!(status, Status::SUCCESS)` which panics in a drop implementation. If a `ScopedProtocol` is dropped while panicking (e.g. during stack unwinding), this triggers a double-panic and immediately aborts the process. In UEFI environments this means a hard reset with no diagnostic information.","fix":"Replace `assert_eq!` with a debug-only assertion or log an error message instead. For example: `if cfg!(debug_assertions) { assert_eq!(status, Status::SUCCESS); } else { log::error!(\"close_protocol failed: {:?}\", status); }`.","locations":[{"ref":"uefi/src/boot.rs:1763","code":" 1763 |         assert_eq!(status, Status::SUCCESS);","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/boot.rs#L1763"}]},{"id":"PANIC_20","type":"panic","type_label":"Panic","severity":"medium","easy":false,"description":"In `Key::from(InputKey)`, when the scan code is NULL (indicating a printable character), the code calls `Char16::try_from(k.unicode_char).unwrap()`. If the UEFI firmware returns an invalid UCS-2 code point (e.g. a surrogate pair value 0xD800-0xDFFF, or another value that Char16 rejects), this panics. Buggy firmware exists in practice, and a panic during keyboard input is unnecessarily severe.","fix":"Replace the unwrap with a fallback: `Char16::try_from(k.unicode_char).unwrap_or(Char16::try_from(u16::from(b'?')).unwrap())` or return a `Result` from the `From` impl (changing it to `TryFrom`). At minimum, use `unwrap_or_else` with a reasonable replacement character.","locations":[{"ref":"uefi/src/proto/console/text/input.rs:112","code":"  112 |             Self::Printable(Char16::try_from(k.unicode_char).unwrap())","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/console/text/input.rs#L112"}]},{"id":"PANIC_21","type":"panic","type_label":"Panic","severity":"medium","easy":true,"description":"`build::messaging::RestService::size_in_bytes` panics instead of returning an error when\n`vendor_guid_and_data` is `Some(...)` but `service_type` is not `VENDOR`.  The helper\n`build_size_vendor_guid_and_data` (and `build_vendor_guid_and_data`) calls\n`assert!(self.service_type == RestServiceType::VENDOR)`.  Because `size_in_bytes` is supposed to\nreturn `Result<u16, BuildError>` for all invalid inputs, a panic here breaks the expected error\npropagation contract.  A caller that accidentally sets `service_type = REDFISH` with\n`vendor_guid_and_data = Some(...)` will get an unrecoverable abort instead of a `BuildError`.","fix":"Replace the `assert!` calls with a proper validation that returns early (or propagates an error).\nFor `build_size_vendor_guid_and_data` return `Option<usize>` or add a `validate()` method that\n`size_in_bytes` calls first and maps to `BuildError`.  Alternatively add a new\n`BuildError::VendorDataWithoutVendorType` variant and return `Err(...)` instead of asserting.","locations":[{"ref":"uefi/src/proto/device_path/device_path_gen.rs:5746-5753","code":" 5746 |             fn build_size_vendor_guid_and_data(&self) -> usize {\n 5747 |                 if let Some(src) = &self.vendor_guid_and_data {\n 5748 |                     assert!(self.service_type == device_path::messaging::RestServiceType::VENDOR);\n 5749 |                     size_of::<Guid>() + size_of_val(src.vendor_defined_data)\n 5750 |                 } else {\n 5751 |                     0\n 5752 |                 }\n 5753 |             }","lines":8,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/device_path/device_path_gen.rs#L5746-L5753"},{"ref":"uefi/src/proto/device_path/device_path_gen.rs:5755-5773","code":" 5755 |             fn build_vendor_guid_and_data(&self, out: &mut [MaybeUninit<u8>]) {\n 5756 |                 if let Some(src) = &self.vendor_guid_and_data {\n 5757 |                     assert!(self.service_type == device_path::messaging::RestServiceType::VENDOR);\n 5758 |                     let (guid_out, data_out) = out.split_at_mut(size_of::<Guid>());\n 5759 |                     let guid_out_ptr: *mut Guid = maybe_uninit_slice_as_mut_ptr(guid_out).cast();\n 5760 |                     #[expect(clippy::undocumented_unsafe_blocks)]\n 5761 |                     unsafe {\n 5762 |                         guid_out_ptr.write_unaligned(src.vendor_guid);\n 5763 |                     }\n 5764 | \n 5765 |                     let data_out_ptr = maybe_uninit_slice_as_mut_ptr(data_out);\n 5766 |                     #[expect(clippy::undocumented_unsafe_blocks)]\n 5767 |                     unsafe {\n 5768 |                         src.vendor_defined_data\n 5769 |                             .as_ptr()\n 5770 |                             .copy_to_nonoverlapping(data_out_ptr, data_out.len());\n 5771 |                     }\n 5772 |                 }\n 5773 |             }","lines":19,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/device_path/device_path_gen.rs#L5755-L5773"}]},{"id":"PANIC_22","type":"panic","type_label":"Panic","severity":"medium","easy":false,"description":"Both `Display` implementations for `DevicePathNode` and `DevicePath` call\n`.unwrap()` on `to_string16(...)` when boot services are active. If the\n`DevicePathToText` protocol is absent or returns an out-of-memory error,\n`.unwrap()` panics. This can happen inside any debug-printing or logging\nstatement that uses `Display`.","fix":"Return a fallback string on error instead of unwrapping, e.g. `write!(f, \"<device path (text unavailable)>\")`.","locations":[{"ref":"uefi/src/proto/device_path/mod.rs:339-349","code":"  339 | impl Display for DevicePathNode {\n  340 |     fn fmt(&self, f: &mut Formatter<'_>) -> fmt::Result {\n  341 |         if boot::are_boot_services_active() {\n  342 |             let cstring16 = self\n  343 |                 .to_string16(DisplayOnly(true), AllowShortcuts(true))\n  344 |                 .unwrap();\n  345 |             write!(f, \"{}\", cstring16)\n  346 |         } else {\n  347 |             write!(f, \"<device path node: {} bytes>\", self.data.len())\n  348 |         }\n  349 |     }","lines":11,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/device_path/mod.rs#L339-L349"},{"ref":"uefi/src/proto/device_path/mod.rs:683-693","code":"  683 | impl Display for DevicePath {\n  684 |     fn fmt(&self, f: &mut Formatter<'_>) -> fmt::Result {\n  685 |         if boot::are_boot_services_active() {\n  686 |             let cstring16 = self\n  687 |                 .to_string16(DisplayOnly(true), AllowShortcuts(true))\n  688 |                 .unwrap();\n  689 |             write!(f, \"{}\", cstring16)\n  690 |         } else {\n  691 |             write!(f, \"<device path: {} bytes>\", self.data.len())\n  692 |         }\n  693 |     }","lines":11,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/device_path/mod.rs#L683-L693"}]},{"id":"PANIC_23","type":"panic","type_label":"Panic","severity":"medium","easy":false,"description":"`DevicePathNodeIterator::next` indexes the `self.nodes` slice with\n`&self.nodes[node_size..]` where `node_size` comes from `node.length()` obtained\nvia the unsafe `from_ffi_ptr`. If `node_size > self.nodes.len()` (which can occur\nwith malformed firmware data), this panics with an index-out-of-bounds. The\niterator is used in safe public APIs (`DevicePath::node_iter`,\n`DevicePathInstance::node_iter`) so callers have no way to prevent the panic.","fix":"Check `node_size <= self.nodes.len()` before slicing; if the check fails, treat it as end-of-path or return an error.","locations":[{"ref":"uefi/src/proto/device_path/mod.rs:824-828","code":"  824 |         } else {\n  825 |             // Advance to next node.\n  826 |             let node_size = usize::from(node.length());\n  827 |             self.nodes = &self.nodes[node_size..];\n  828 |             Some(node)","lines":5,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/device_path/mod.rs#L824-L828"}]},{"id":"PANIC_24","type":"panic","type_label":"Panic","severity":"medium","easy":false,"description":"`FileHandle::Drop` calls `result.expect(\"Failed to close file\")`, which panics if\nthe firmware's close function returns a non-SUCCESS status. Although the UEFI spec\nsays `EFI_FILE_PROTOCOL.Close()` always succeeds, real firmware can violate this\n(e.g., on media removal or a corrupted handle). Panicking in a `Drop` is\nparticularly harmful because it can abort the program or cause a double-panic if\nthe drop fires during stack unwinding.","fix":"Log the error instead of panicking (e.g., `if let Err(e) = result { log::error!(...) }`).","locations":[{"ref":"uefi/src/proto/media/file/mod.rs:313-319","code":"  313 | impl Drop for FileHandle {\n  314 |     fn drop(&mut self) {\n  315 |         // SAFETY: The memory is valid.\n  316 |         let result: Result = unsafe { (self.imp().close)(self.imp()) }.to_result();\n  317 |         // The spec says this always succeeds.\n  318 |         result.expect(\"Failed to close file\");\n  319 |     }","lines":7,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/media/file/mod.rs#L313-L319"}]},{"id":"PANIC_25","type":"panic","type_label":"Panic","severity":"medium","easy":true,"description":"`HttpHelper::response_first()` calls `.to_str().unwrap()` on the raw C-string bytes of every\nHTTP response header name and header value returned by the firmware (lines 371-372). If the\nfirmware returns non-UTF-8 bytes in any header field, `to_str()` returns `Err` and `.unwrap()`\npanics. HTTP headers are supposed to be ASCII, but defensive handling is expected in a firmware\nabstraction layer.","fix":"Replace `.unwrap()` with `.unwrap_or_default()` or `.map_err(|_| Status::PROTOCOL_ERROR.into())?` to propagate or tolerate non-UTF-8 firmware output.","locations":[{"ref":"uefi/src/proto/network/http.rs:371-372","code":"  371 |                 n.to_str().unwrap().to_lowercase(),\n  372 |                 String::from(v.to_str().unwrap()),","lines":2,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/network/http.rs#L371-L372"}]},{"id":"PANIC_26","type":"panic","type_label":"Panic","severity":"medium","easy":false,"description":"`DiscoverInfo::new_in_buffer()` calculates `required_size` as\n`4 * size_of::<bool>() + size_of::<EfiIpAddr>() + size_of::<u16>() + size_of_val(srv_list)`.\nHowever, after writing the `u16` field, `ptr.add(2)` unconditionally advances by 2 bytes to\nalign the server list to a 4-byte boundary. These 2 padding bytes are NOT included in\n`required_size`. If the caller supplies a buffer that is exactly `required_size` bytes, the\nfunction writes 2 bytes past the end of the buffer, producing a heap buffer overrun (undefined\nbehaviour via `ptr::copy`).","fix":"Add `+ 2` (or `+ core::mem::align_of::<Server>() - size_of::<u16>()`) to `required_size` to account for the alignment padding.","locations":[{"ref":"uefi/src/proto/network/pxe.rs:693-711","code":"  693 |             + size_of::<EfiIpAddr>()\n  694 |             + size_of::<u16>()\n  695 |             + size_of_val(srv_list);\n  696 | \n  697 |         if buffer.len() < required_size {\n  698 |             return Err(Status::BUFFER_TOO_SMALL.into());\n  699 |         }\n  700 | \n  701 |         let mut ptr: *mut u8 = maybe_uninit_slice_as_mut_ptr(buffer);\n  702 |         // SAFETY: The memory is valid.\n  703 |         unsafe {\n  704 |             ptr_write_unaligned_and_add(&mut ptr, use_m_cast);\n  705 |             ptr_write_unaligned_and_add(&mut ptr, use_b_cast);\n  706 |             ptr_write_unaligned_and_add(&mut ptr, use_u_cast);\n  707 |             ptr_write_unaligned_and_add(&mut ptr, must_use_list);\n  708 |             ptr_write_unaligned_and_add(&mut ptr, server_m_cast_ip);\n  709 |             ptr_write_unaligned_and_add(&mut ptr, server_count as u16);\n  710 | \n  711 |             ptr = ptr.add(2); // Align server list (4-byte alignment).","lines":19,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/network/pxe.rs#L693-L711"}]},{"id":"PANIC_27","type":"panic","type_label":"Panic","severity":"medium","easy":false,"description":"`pci::configuration::parse()` panics with `panic!(\"{tag}\")` when it encounters any ACPI\nresource descriptor tag that is not `QWORD_ADDR_SPACE` (0x8A) or `END_TAG` (0x79). This\nfunction is called from the safe `PciRootBridgeIo::configuration()` and `PciRootBridgeIo::enumerate()`\nAPIs. Firmware that includes any other valid ACPI large resource descriptor tag (e.g.,\n`0x86` for 32-bit address space) will trigger an unrecoverable panic in the application.","fix":"Return an error instead of panicking on unknown tags, or skip unknown records gracefully (advancing the offset by the record length from bytes [1..2] per the ACPI spec for large resource types).","locations":[{"ref":"uefi/src/proto/pci/configuration.rs:85","code":"   85 |             _ => panic!(\"{tag}\"), // Unknown tag - bailing","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/pci/configuration.rs#L85"}]},{"id":"PANIC_28","type":"panic","type_label":"Panic","severity":"medium","easy":false,"description":"`UnicodeCollation::str_to_fat()` searches backwards through `buf` for the last non-NUL byte\nand sets `last_null_index = i + 1`. If the firmware's `StrToFat` implementation writes a\nconversion result with no NUL terminator (i.e., the final byte `buf[buf.len()-1]` is non-zero),\n`last_null_index` is set to `buf.len()`, and the subsequent\n`core::slice::from_raw_parts(buf.as_ptr(), last_null_index + 1)` call requests\n`buf.len() + 1` bytes, which is one element past the end of the allocation.","fix":"Clamp `last_null_index` to `buf.len() - 1` before computing `last_null_index + 1`, or verify the invariant that the firmware always NUL-terminates and return an error if it does not.","locations":[{"ref":"uefi/src/proto/string/unicode_collation.rs:152-160","code":"  152 |             let mut last_null_index = buf.len() - 1;\n  153 |             for i in (0..buf.len()).rev() {\n  154 |                 if buf[i] != 0 {\n  155 |                     last_null_index = i + 1;\n  156 |                     break;\n  157 |                 }\n  158 |             }\n  159 |             // SAFETY: The pointer is valid for the requested slice length.\n  160 |             let buf = unsafe { core::slice::from_raw_parts(buf.as_ptr(), last_null_index + 1) };","lines":9,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/string/unicode_collation.rs#L152-L160"}]},{"id":"PANIC_29","type":"panic","type_label":"Panic","severity":"medium","easy":true,"description":"In qemu.rs, process_qemu_io() uses assert! and assert_eq! for the QMP handshake and\nscreenshot verification (lines 212, 214, 240, 253) instead of returning proper errors.\nIf QEMU starts but sends unexpected QMP output (e.g., an error banner), the process\npanics with an unformatted message instead of returning an anyhow::Error with context.\nSimilarly, String::from_utf8(...).expect(\"line is not utf8\") at line 220 panics on\nnon-UTF-8 serial output (plausible from UEFI firmware writing raw bytes).","fix":"Replace assert!/assert_eq!/expect() with bail!() or .context() chains:\n- `if !monitor_io.read_line()?.starts_with(...)  { bail!(\"unexpected QMP banner\"); }`\n- `if monitor_io.read_json()? != json!(...) { bail!(\"unexpected QMP response\"); }`\n- Use `String::from_utf8_lossy(...)` or return an error for non-UTF-8 serial lines.","locations":[{"ref":"xtask/src/qemu.rs:209-256","code":"  209 |     let ansi_escape = Regex::new(r\"(\\x9b|\\x1b\\[)[0-?]*[ -/]*[@-~]\").expect(\"invalid regex\");\n  210 | \n  211 |     // Execute the QEMU monitor handshake, doing basic sanity checks.\n  212 |     assert!(monitor_io.read_line()?.starts_with(r#\"{\"QMP\":\"#));\n  213 |     monitor_io.write_json(json!({\"execute\": \"qmp_capabilities\"}))?;\n  214 |     assert_eq!(monitor_io.read_json()?, json!({\"return\": {}}));\n  215 | \n  216 |     while let Ok(line) = serial_io.read_line() {\n  217 |         // Strip whitespace and ANSI escape codes.\n  218 |         let line = line.trim_end();\n  219 |         let line = ansi_escape.replace_all(line.as_bytes(), &b\"\"[..]);\n  220 |         let line = String::from_utf8(line.into()).expect(\"line is not utf8\");\n  221 | \n  222 |         // Send an \"OK\" response to the app.\n  223 |         let mut reply_ok = || serial_io.write_all(\"OK\\n\");\n  224 | \n  225 |         // If the app requests a screenshot, take it.\n  226 |         if let Some(reference_name) = line.strip_prefix(\"SCREENSHOT: \") {\n  227 |             let screenshot_path = tmp_dir.join(\"screenshot.ppm\");\n  228 | \n  229 |             // Ask QEMU to take a screenshot.\n  230 |             monitor_io.write_json(json!({\n  231 |                 \"execute\": \"screendump\",\n  232 |                 \"arguments\": {\"filename\": screenshot_path}}\n  233 |             ))?;\n  234 | \n  235 |             // Wait for QEMU's acknowledgement, ignoring events.\n  236 |             let mut reply = monitor_io.read_json()?;\n  237 |             while reply.as_object().unwrap().contains_key(\"event\") {\n  238 |                 reply = monitor_io.read_json()?;\n  239 |             }\n  240 |             assert_eq!(reply, json!({\"return\": {}}));\n  241 | \n  242 |             // Tell the VM that the screenshot was taken\n  243 |             reply_ok()?;\n  244 | \n  245 |             // Compare screenshot to the reference file specified by the user.\n  246 |             // TODO: Add an operating mode where the reference is created if it doesn't exist.\n  247 |             let reference_file =\n  248 |                 Path::new(\"uefi-test-runner/screenshots\").join(format!(\"{reference_name}.ppm\"));\n  249 |             let expected = fs_err::read(reference_file)?;\n  250 |             let actual = fs_err::read(&screenshot_path)?;\n  251 |             // Use `assert` rather than `assert_eq` here to avoid\n  252 |             // dumping a huge amount of raw pixel data on failure.\n  253 |             assert!(\n  254 |                 expected == actual,\n  255 |                 \"screenshot does not match reference image\"\n  256 |             )","lines":48,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/xtask/src/qemu.rs#L209-L256"}]},{"id":"PANIC_30","type":"panic","type_label":"Panic","severity":"medium","easy":false,"description":"In qemu.rs, `as_object().unwrap()` at line 237 panics if the QMP reply is not a JSON\nobject (e.g., a JSON array or null). Under normal operation this is fine, but if QEMU\nsends an unexpected response format the process panics instead of returning an error.","fix":"Use `.as_object().ok_or_else(|| anyhow::anyhow!(\"unexpected QMP reply format: {reply}\"))?` to propagate an error.","locations":[{"ref":"xtask/src/qemu.rs:237","code":"  237 |             while reply.as_object().unwrap().contains_key(\"event\") {","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/xtask/src/qemu.rs#L237"}]},{"id":"PANIC_31","type":"panic","type_label":"Panic","severity":"low","easy":false,"description":"In the ATA pass-through test, assert_eq!(ata_ctrl_handles.len(), 1) at line 18 hardcodes the assumption that exactly one ATA controller exists. If the test environment has more than one controller (or zero after a device enumeration change), the test panics unconditionally rather than searching all controllers for the test drive. The surrounding loop already iterates over all handles, so the assertion is overly strict.","fix":"Remove the assert_eq!(ata_ctrl_handles.len(), 1) line. The function already returns false if the test drive is not found among all enumerated controllers, and a single controller count check is an environment-specific assumption that breaks on multi-controller setups.","locations":[{"ref":"uefi-test-runner/src/proto/ata/pass_thru.rs:17-19","code":"   17 |     let ata_ctrl_handles = boot::find_handles::<AtaPassThru>().unwrap();\n   18 |     assert_eq!(ata_ctrl_handles.len(), 1);\n   19 | ","lines":3,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi-test-runner/src/proto/ata/pass_thru.rs#L17-L19"}]},{"id":"PANIC_32","type":"panic","type_label":"Panic","severity":"low","easy":false,"description":"In pci/root_bridge.rs, decode_bar() handles the PCI BAR type field (bits [2:1]) but the `_ => unimplemented!()` arm is reachable for the reserved value 0b01 (below-1MB memory). Real PCI hardware from some older devices or emulators can emit this value; hitting it panics the test runner instead of skipping gracefully.","fix":"Replace `_ => unimplemented!()` with a return of a sentinel Bar variant or log and skip the BAR, since reserved values should not abort the test.","locations":[{"ref":"uefi-test-runner/src/proto/pci/root_bridge.rs:191-213","code":"  191 | fn decode_bar(bar: u32, next_bar: Option<u32>) -> Bar {\n  192 |     if bar & 0b1 == 0b0 {\n  193 |         match (bar & 0b110) >> 1 {\n  194 |             0b00 => Bar::Mem32 {\n  195 |                 base: bar & !0b1111,\n  196 |                 prefetchable: bar & 0b1000 != 0,\n  197 |             },\n  198 |             0b10 => {\n  199 |                 if let Some(next_bar) = next_bar {\n  200 |                     Bar::Mem64 {\n  201 |                         base: u64::from(bar & !0b1111) | (u64::from(next_bar) << 32),\n  202 |                         prefetchable: bar & 0b1000 != 0,\n  203 |                     }\n  204 |                 } else {\n  205 |                     unreachable!(\"PCI hardware error\")\n  206 |                 }\n  207 |             }\n  208 |             _ => unimplemented!(),\n  209 |         }\n  210 |     } else {\n  211 |         Bar::Io(bar & !0b11)\n  212 |     }\n  213 | }","lines":23,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi-test-runner/src/proto/pci/root_bridge.rs#L191-L213"}]},{"id":"PANIC_33","type":"panic","type_label":"Panic","severity":"low","easy":true,"description":"`messaging::RestService::vendor_guid_and_data` (the read-side accessor) calls `.unwrap()` on\n`guid.try_into()` at line 2793 to convert a 16-byte `&[u8]` into `[u8; 16]`.  While this\nconversion cannot fail in practice (the preceding length check guarantees the slice is exactly 16\nbytes), an infallible `unwrap()` in a public API is a latent maintainability hazard: if the\nsurrounding logic is ever refactored and the guard is weakened, the unwrap becomes a silent panic\nsite.","fix":"Replace with a compile-time-safe approach:\n  let guid = Guid::from_bytes(self.vendor_guid_and_data[..size_of::<Guid>()].try_into().expect(\"slice length checked above\"));\nor restructure to avoid the conversion entirely by reading the bytes directly.\nA cleaner alternative that cannot panic:\n  let guid_bytes: [u8; 16] = guid[..16].try_into().unwrap_or([0u8; 16]);\nbut ideally use an inline length assertion or a direct array copy.","locations":[{"ref":"uefi/src/proto/device_path/device_path_gen.rs:2793","code":" 2793 |                 let guid: [u8; 16] = guid.try_into().unwrap();","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/device_path/device_path_gen.rs#L2793"}]},{"id":"PANIC_34","type":"panic","type_label":"Panic","severity":"low","easy":false,"description":"`NvmeNamespaceIterator::next()` and `ScsiTargetLunIterator::next()` both call\n`panic!(\"Must not happen according to spec!\")` for any firmware status code other than\n`SUCCESS` or `NOT_FOUND`. The UEFI spec is the expected-case contract, but misbehaving or\nbuggy firmware can return other status codes (e.g., `DEVICE_ERROR`). Panicking inside an\n`Iterator::next()` implementation leaves the caller with no recovery path.","fix":"Return `None` from the iterator (stopping iteration) on unexpected status codes, or change the iterator to yield `Result<Item>` so the error can be surfaced to the caller.","locations":[{"ref":"uefi/src/proto/nvme/pass_thru.rs:231","code":"  231 |             _ => panic!(\"Must not happen according to spec!\"),","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/nvme/pass_thru.rs#L231"},{"ref":"uefi/src/proto/scsi/pass_thru.rs:279","code":"  279 |             _ => panic!(\"Must not happen according to spec!\"),","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/scsi/pass_thru.rs#L279"}]},{"id":"PANIC_35","type":"panic","type_label":"Panic","severity":"low","easy":true,"description":"`MemoryProtection::get_memory_attributes()`, `set_memory_attributes()`, and\n`clear_memory_attributes()` all call `range_to_base_and_len()`, which uses\n`r.end.checked_sub(r.start).unwrap()`. If a caller passes an inverted range (end < start),\n`checked_sub` returns `None` and `.unwrap()` panics with an opaque message. The API\ndocumentation does not mention this constraint or its consequence.","fix":"Replace `.unwrap()` with explicit error handling: add a precondition check that returns `Err(Status::INVALID_PARAMETER.into())` when `end < start`, and document the requirement.","locations":[{"ref":"uefi/src/proto/security/memory_protection.rs:104-106","code":"  104 | const fn range_to_base_and_len(r: Range<PhysicalAddress>) -> (PhysicalAddress, PhysicalAddress) {\n  105 |     (r.start, r.end.checked_sub(r.start).unwrap())\n  106 | }","lines":3,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/security/memory_protection.rs#L104-L106"}]},{"id":"PANIC_36","type":"panic","type_label":"Panic","severity":"low","easy":false,"description":"In device_path/mod.rs, `parse_spec()` calls `syn::parse_str(spec_str).unwrap()` and\n`panic!(\"unexpected item\")`. If spec.rs is ever syntactically invalid or contains a\nnon-module top-level item, the tool panics with a minimal message instead of a clean\nanyhow error. Since spec.rs is compiled into the binary via `include_str!`, this would\nonly trigger when the binary is run (not at compile time of xtask itself).","fix":"Use `syn::parse_str(spec_str).context(\"failed to parse spec.rs\")?` and `bail!(\"unexpected item in spec.rs: ...\")` to produce actionable error messages.","locations":[{"ref":"xtask/src/device_path/mod.rs:108-119","code":"  108 |     let ast: File = syn::parse_str(spec_str).unwrap();\n  109 | \n  110 |     ast.items\n  111 |         .iter()\n  112 |         .map(|item| {\n  113 |             if let Item::Mod(module) = item {\n  114 |                 NodeGroup::parse(module)\n  115 |             } else {\n  116 |                 panic!(\"unexpected item\")\n  117 |             }\n  118 |         })\n  119 |         .collect()","lines":12,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/xtask/src/device_path/mod.rs#L108-L119"}]},{"id":"PANIC_37","type":"panic","type_label":"Panic","severity":"low","easy":false,"description":"In disk.rs, `get_partition_byte_range()` computes byte offsets from MBR fields without\noverflow checks: `mbr[1].starting_lba as usize * SECTOR_SIZE` and\n`mbr[1].sectors as usize * SECTOR_SIZE`. While xtask runs on 64-bit hosts where\noverflow is essentially impossible, in `check_mbr_test_disk()` these values come from\nthe guest-modified disk image, meaning a misbehaving UEFI test could write a malformed\nMBR with extreme sector counts that causes `disk[partition_byte_range]` to panic with\nan out-of-bounds index.","fix":"In check_mbr_test_disk, validate that partition_byte_range is within the disk bounds before indexing, returning an error rather than panicking.","locations":[{"ref":"xtask/src/disk.rs:12-15","code":"   12 | fn get_partition_byte_range(mbr: &MBR) -> Range<usize> {\n   13 |     let partition_start_byte = mbr[1].starting_lba as usize * SECTOR_SIZE;\n   14 |     let partition_num_bytes = mbr[1].sectors as usize * SECTOR_SIZE;\n   15 |     partition_start_byte..partition_start_byte + partition_num_bytes","lines":4,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/xtask/src/disk.rs#L12-L15"},{"ref":"xtask/src/disk.rs:119-127","code":"  119 | \n  120 |     let partition_byte_range;\n  121 |     {\n  122 |         let mut cursor = Cursor::new(&disk);\n  123 |         let mbr = MBR::read_from(&mut cursor, SECTOR_SIZE as u32)?;\n  124 |         partition_byte_range = get_partition_byte_range(&mbr);\n  125 |     }\n  126 | \n  127 |     let cursor = Cursor::new(&mut disk[partition_byte_range]);","lines":9,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/xtask/src/disk.rs#L119-L127"}]},{"id":"PANIC_38","type":"panic","type_label":"Panic","severity":"low","easy":false,"description":"In disk.rs, `check_mbr_test_disk()` iterates directory entries with\n`dir.iter().map(|e| e.unwrap().file_name())`. If any directory entry returns an I/O\nerror, `.unwrap()` panics instead of propagating an error through the Result chain.","fix":"Use `dir.iter().map(|e| e.map(|entry| entry.file_name())).collect::<Result<Vec<_>, _>>()?` to properly propagate I/O errors.","locations":[{"ref":"xtask/src/disk.rs:139","code":"  139 |     let children: Vec<_> = dir.iter().map(|e| e.unwrap().file_name()).collect();","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/xtask/src/disk.rs#L139"}]},{"id":"PANIC_39","type":"panic","type_label":"Panic","severity":"low","easy":false,"description":"In pipe.rs, `dir.join(base_name).to_str().unwrap()` at line 23 panics if the temp\ndirectory path is not valid UTF-8. On Unix, paths can be arbitrary bytes.\nWhile TempDir paths are almost always ASCII in practice, this is an unconditional unwrap\non a user-environment value.","fix":"Use `.to_string_lossy()` for the log/error message, or propagate an error with `.ok_or_else(|| anyhow::anyhow!(\"tmp dir path is not UTF-8\"))?`.","locations":[{"ref":"xtask/src/pipe.rs:23","code":"   23 |             let qemu_arg = format!(\"pipe:{}\", dir.join(base_name).to_str().unwrap());","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/xtask/src/pipe.rs#L23"}]},{"id":"PANIC_40","type":"panic","type_label":"Panic","severity":"low","easy":false,"description":"In tpm.rs, `tmp_dir.path().to_str().unwrap()` at line 25 and\n`socket_path.to_str().unwrap()` at line 57 panic if the temp directory path contains\nnon-UTF-8 bytes. As with pipe.rs, this is an unchecked assumption about the path encoding.","fix":"Return an error instead of unwrapping: `.ok_or_else(|| anyhow::anyhow!(\"swtpm path is not UTF-8\"))?`.","locations":[{"ref":"xtask/src/tpm.rs:25","code":"   25 |         let tmp_path = tmp_dir.path().to_str().unwrap();","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/xtask/src/tpm.rs#L25"},{"ref":"xtask/src/tpm.rs:57","code":"   57 |             format!(\"socket,id=chrtpm0,path={}\", socket_path.to_str().unwrap()),","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/xtask/src/tpm.rs#L57"}]},{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"high","easy":true,"description":"`HiiConfigRouting::export` calls the firmware's `export_config` function, which\nallocates the result string from UEFI pool memory. The pointer is immediately\nconverted to a Rust `String` via `CStr16::from_ptr(...).to_string()`, but the\noriginal UEFI pool allocation is never freed (no `boot::free_pool` call, no\n`PoolString` wrapper, etc.). Every call to `export()` leaks one pool allocation.","fix":"Wrap the raw pointer in a `PoolString` (or `PoolAllocation`) so the pool\nmemory is freed when the wrapper drops, then copy the contents into a `String`\nbefore returning.","locations":[{"ref":"uefi/src/proto/hii/config_routing.rs:31-38","code":"   31 |     pub fn export(&self) -> uefi::Result<String> {\n   32 |         // SAFETY: The memory is valid.\n   33 |         unsafe {\n   34 |             let mut results: *const Char16 = ptr::null();\n   35 |             (self.0.export_config)(&self.0, &mut results)\n   36 |                 .to_result_with_val(|| CStr16::from_ptr(results.cast()).to_string())\n   37 |         }\n   38 |     }","lines":8,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/hii/config_routing.rs#L31-L38"}]},{"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"medium","easy":true,"description":"In test_register_protocol_notify(), an UEFI Event is created via boot::create_event() but is never closed with boot::close_event(). uefi::Event has no Drop implementation, so the event handle leaks when the function returns. The same pattern occurs in test_callback_with_ctx() (line 86) and test_signal_event() (line 118): events are created and used but never explicitly closed.","fix":"Call boot::close_event(event).unwrap() at the end of each function (or wrap the event in a guard that closes it on drop). The test_check_event() and test_timer() functions already demonstrate the correct pattern.","locations":[{"ref":"uefi-test-runner/src/boot/misc.rs:146-158","code":"  146 | fn test_register_protocol_notify() {\n  147 |     unsafe extern \"efiapi\" fn callback(_event: Event, _context: Option<NonNull<c_void>>) {\n  148 |         info!(\"in callback for test_register_protocol_notify\")\n  149 |     }\n  150 | \n  151 |     let protocol = &TestProtocol::GUID;\n  152 |     let event = unsafe {\n  153 |         boot::create_event(EventType::NOTIFY_SIGNAL, Tpl::NOTIFY, Some(callback), None).unwrap()\n  154 |     };\n  155 | \n  156 |     boot::register_protocol_notify(protocol, &event)\n  157 |         .expect(\"Failed to register protocol notify fn\");\n  158 | }","lines":13,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi-test-runner/src/boot/misc.rs#L146-L158"},{"ref":"uefi-test-runner/src/boot/misc.rs:69-99","code":"   69 | fn test_callback_with_ctx() {\n   70 |     let mut data = 123u32;\n   71 | \n   72 |     extern \"efiapi\" fn callback(_event: Event, ctx: Option<NonNull<c_void>>) {\n   73 |         info!(\"Inside the event callback with context\");\n   74 |         // Safety: this callback is run within the parent function's\n   75 |         // scope, so the context pointer is still valid.\n   76 |         unsafe {\n   77 |             let ctx = ctx.unwrap().as_ptr().cast::<u32>();\n   78 |             *ctx = 456;\n   79 |         }\n   80 |     }\n   81 | \n   82 |     let ctx: *mut u32 = &mut data;\n   83 |     let ctx = NonNull::new(ctx.cast::<c_void>()).unwrap();\n   84 | \n   85 |     let event = unsafe {\n   86 |         boot::create_event(\n   87 |             EventType::NOTIFY_WAIT,\n   88 |             Tpl::CALLBACK,\n   89 |             Some(callback),\n   90 |             Some(ctx),\n   91 |         )\n   92 |         .expect(\"Failed to create event with context\")\n   93 |     };\n   94 | \n   95 |     boot::check_event(&event).expect(\"Failed to check event\");\n   96 | \n   97 |     // Check that `data` was updated inside the event callback.\n   98 |     assert_eq!(data, 456);\n   99 | }","lines":31,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi-test-runner/src/boot/misc.rs#L69-L99"},{"ref":"uefi-test-runner/src/boot/misc.rs:101-131","code":"  101 | fn test_signal_event() {\n  102 |     let mut data = 123u32;\n  103 | \n  104 |     extern \"efiapi\" fn callback(_event: Event, ctx: Option<NonNull<c_void>>) {\n  105 |         info!(\"Inside the signal event callback\");\n  106 |         // Safety: this callback is run within the parent function's\n  107 |         // scope, so the context pointer is still valid.\n  108 |         unsafe {\n  109 |             let ctx = ctx.unwrap().as_ptr().cast::<u32>();\n  110 |             *ctx = 456;\n  111 |         }\n  112 |     }\n  113 | \n  114 |     let ctx: *mut u32 = &mut data;\n  115 |     let ctx = NonNull::new(ctx.cast::<c_void>()).unwrap();\n  116 | \n  117 |     let event = unsafe {\n  118 |         boot::create_event(\n  119 |             EventType::NOTIFY_SIGNAL,\n  120 |             Tpl::CALLBACK,\n  121 |             Some(callback),\n  122 |             Some(ctx),\n  123 |         )\n  124 |         .expect(\"Failed to create event with context\")\n  125 |     };\n  126 | \n  127 |     boot::signal_event(&event).expect(\"Failed to signal event\");\n  128 | \n  129 |     // Check that `data` was updated inside the event callback.\n  130 |     assert_eq!(data, 456);\n  131 | }","lines":31,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi-test-runner/src/boot/misc.rs#L101-L131"}]},{"id":"MEM_3","type":"memory_leak","type_label":"Memory Leak","severity":"medium","easy":false,"description":"In `start_image()`, the UEFI spec requires the caller to free `exit_data` with `FreePool` if it is non-null after the call returns (even on failure). The current implementation passes `&mut exit_data` to `start_image` but never frees the buffer if the firmware populates it. This leaks pool memory equal to the image's exit data size.","fix":"After the UEFI call, if `exit_data` is non-null, call `free_pool(NonNull::new(exit_data.cast::<u8>()).unwrap())`. Alternatively, wrap the buffer in a RAII guard before returning.","locations":[{"ref":"uefi/src/boot.rs:1346-1359","code":" 1346 | pub fn start_image(image_handle: Handle) -> Result {\n 1347 |     let bt = boot_services_raw_panicking();\n 1348 |     // SAFETY: The pointer is not null and we assume it to be initialized.\n 1349 |     let bt = unsafe { bt.as_ref() };\n 1350 | \n 1351 |     // TODO: implement returning exit data to the caller.\n 1352 |     let mut exit_data_size: usize = 0;\n 1353 |     let mut exit_data: *mut u16 = ptr::null_mut();\n 1354 | \n 1355 |     // SAFETY: The memory is valid.\n 1356 |     unsafe {\n 1357 |         (bt.start_image)(image_handle.as_ptr(), &mut exit_data_size, &mut exit_data).to_result()\n 1358 |     }\n 1359 | }","lines":14,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/boot.rs#L1346-L1359"}]},{"id":"MEM_4","type":"memory_leak","type_label":"Memory Leak","severity":"medium","easy":false,"description":"In qemu.rs, QEMU's stdout is redirected to a pipe (`cmd.stdout(Stdio::piped())`) but\nthe pipe is never read. If QEMU writes more than the OS pipe buffer (typically 64 KiB on\nLinux) to stdout - for example due to an internal error message or unexpected output -\nQEMU will block writing to stdout, causing our process_qemu_io() call to hang indefinitely\nwhile waiting for serial output that will never arrive. This is a deadlock risk, especially\nin error/crash scenarios.","fix":"Either drop stdout (`cmd.stdout(Stdio::null())`) since the output is unused,\nor spawn a background thread that drains the pipe:\n  `let _stdout_drain = thread::spawn(move || { let _ = std::io::read_to_string(child.0.stdout.take().unwrap()); });`","locations":[{"ref":"xtask/src/qemu.rs:622-631","code":"  622 |     cmd.stdin(Stdio::piped());\n  623 |     cmd.stdout(Stdio::piped());\n  624 |     let mut child = ChildWrapper(cmd.spawn().context(\"failed to launch qemu\")?);\n  625 | \n  626 |     let monitor_io = qemu_monitor_pipe.open_io()?;\n  627 |     let serial_io = serial_pipe.open_io()?;\n  628 | \n  629 |     // Capture the result to check it, but first wait for the child to\n  630 |     // exit.\n  631 |     let res = process_qemu_io(monitor_io, serial_io, tmp_dir);","lines":10,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/xtask/src/qemu.rs#L622-L631"}]},{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"high","easy":true,"description":"In `stall()`, `Duration::as_micros()` returns `u128` but is cast to `usize` with `as usize`. On 32-bit UEFI targets (where `usize` is 32 bits), durations longer than ~4295 seconds silently truncate, causing a much shorter or zero stall than requested. No saturation or error is applied.","fix":"Use `usize::try_from(duration.as_micros()).unwrap_or(usize::MAX)` or clamp the value. Alternatively document the platform-specific limitation and add a debug assertion.","locations":[{"ref":"uefi/src/boot.rs:1591","code":" 1591 |     le
