s_slice()[self.i..self.i + len];\n  159 |             let mut string = CString16::new();\n  160 |             part.iter().for_each(|c| string.push(*c));\n  161 | \n  162 |             // +1: skip the separator\n  163 |             self.i = progress + 1;\n  164 |             Some(string)\n  165 |         }\n  166 |     }","lines":43,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/fs/path/path.rs#L124-L166"},{"ref":"uefi/src/fs/path/path.rs:52-82","code":"   52 |     pub fn parent(&self) -> Option<PathBuf> {\n   53 |         let components_count = self.components().count();\n   54 |         if components_count == 0 {\n   55 |             return None;\n   56 |         }\n   57 | \n   58 |         // Return None, as we do not treat \"\\\\\" as dedicated component.\n   59 |         let sep_count = self\n   60 |             .0\n   61 |             .as_slice()\n   62 |             .iter()\n   63 |             .filter(|char| **char == SEPARATOR)\n   64 |             .count();\n   65 |         if sep_count == 0 {\n   66 |             return None;\n   67 |         }\n   68 | \n   69 |         let path =\n   70 |             self.components()\n   71 |                 .take(components_count - 1)\n   72 |                 .fold(CString16::new(), |mut acc, next| {\n   73 |                     // Add separator, as needed.\n   74 |                     if !acc.is_empty() && *acc.as_slice().last().unwrap() != SEPARATOR {\n   75 |                         acc.push(SEPARATOR);\n   76 |                     }\n   77 |                     acc.push_str(next.as_ref());\n   78 |                     acc\n   79 |                 });\n   80 |         let path = PathBuf::from(path);\n   81 |         Some(path)\n   82 |     }","lines":31,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/fs/path/path.rs#L52-L82"}]},{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","easy":false,"description":"Each of the three public methods `register_periodic_callback`, `register_exception_callback`, and\n`invalidate_instruction_cache` calls `self.get_maximum_processor_index()` for validation, which\nitself calls the firmware function `get_maximum_processor_index`. This doubles the number of\nfirmware calls per operation (one for the guard, one for the real work). In typical UEFI\nenvironments these three operations are called rarely and the overhead is negligible, but the\npattern is still wasteful and the extra call is not documented or obvious to readers.","fix":"Cache the maximum processor index at construction time (if the value is stable) or accept the index as already-validated by the caller's invariant and remove the guard, returning the firmware's own `INVALID_PARAMETER` error directly.","locations":[{"ref":"uefi/src/proto/debug/mod.rs:100","code":"  100 |         if processor_index > self.get_maximum_processor_index() {","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/debug/mod.rs#L100"},{"ref":"uefi/src/proto/debug/mod.rs:125","code":"  125 |         if processor_index > self.get_maximum_processor_index() {","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/debug/mod.rs#L125"},{"ref":"uefi/src/proto/debug/mod.rs:149","code":"  149 |         if processor_index > self.get_maximum_processor_index() {","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/debug/mod.rs#L149"}]},{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","easy":false,"description":"`ConfigurationString::parse_number_from_hex` collects all bytes into a `Vec`\nbefore matching on the length, even though only 1, 2, 4, or 8 bytes are valid.\nFor a 16-character hex offset/width field this allocates unnecessarily. The\nfunction is called in a loop for every element in a multi-configuration string.","fix":"Parse directly from the `&str` using `u64::from_str_radix` with appropriate byte-swapping, or at least check length before collecting.","locations":[{"ref":"uefi/src/proto/hii/config_str.rs:164-173","code":"  164 |     pub fn parse_number_from_hex(data: &str) -> Option<u64> {\n  165 |         let data: Vec<_> = Self::parse_bytes_from_hex(data).collect();\n  166 |         match data.len() {\n  167 |             8 => Some(u64::from_be_bytes(data.try_into().unwrap())),\n  168 |             4 => Some(u32::from_be_bytes(data.try_into().unwrap()) as u64),\n  169 |             2 => Some(u16::from_be_bytes(data.try_into().unwrap()) as u64),\n  170 |             1 => Some(u8::from_be_bytes(data.try_into().unwrap()) as u64),\n  171 |             _ => None,\n  172 |         }\n  173 |     }","lines":10,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/hii/config_str.rs#L164-L173"}]},{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","easy":true,"description":"`EventLog::iter()` in the TCG v2 module calls `self.header()` twice: once to obtain\n`header.size_in_bytes` for advancing the location pointer, and immediately again to store a copy in\nthe `EventLogIter` struct. Each call re-parses the entire log header (signature check, algorithm\ntable walk, vendor-info bounds calculation). The second call is pure redundant work.","fix":"Extract the result of the first `self.header()` call into a binding before constructing\n`EventLogIter`, and reuse it:\n\n    let header = self.header();\n    if let Some(h) = header {\n        let location = unsafe { self.location.add(h.size_in_bytes) };\n        EventLogIter { log: self, location, header: Some(h) }\n    } else {\n        EventLogIter { log: self, location: ptr::null(), header: None }\n    }","locations":[{"ref":"uefi/src/proto/tcg/v2.rs:333-350","code":"  333 |         if let Some(header) = self.header() {\n  334 |             // Advance past the header\n  335 |             // SAFETY: The memory is valid.\n  336 |             let location = unsafe { self.location.add(header.size_in_bytes) };\n  337 | \n  338 |             EventLogIter {\n  339 |                 log: self,\n  340 |                 location,\n  341 |                 header: self.header(),\n  342 |             }\n  343 |         } else {\n  344 |             EventLogIter {\n  345 |                 log: self,\n  346 |                 location: ptr::null(),\n  347 |                 header: None,\n  348 |             }\n  349 |         }\n  350 |     }","lines":18,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/tcg/v2.rs#L333-L350"}]},{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","easy":false,"description":"In device_path/mod.rs, `code_to_string()` performs a global string replacement of `}`\nwith `}\\n\\n` over the entire serialized token stream before passing it to rustfmt.\nThis replacement is applied to every `}` character, including those inside string\nliterals that appear in the generated code. While rustfmt will re-normalize the output,\nthe extra allocations and the fragile text-munging approach could produce surprising\nintermediate states (e.g., if string literals contained `}`). A better approach would be\nto insert blank lines at the TokenStream level before serializing to a string.","fix":"Use `proc_macro2` APIs to insert blank lines between items in the token stream, or accept tightly packed rustfmt output and rely on rustfmt's own blank-line formatting.","locations":[{"ref":"xtask/src/device_path/mod.rs:26","code":"   26 |     let code = code.to_string().replace('}', \"}\\n\\n\");","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/xtask/src/device_path/mod.rs#L26"}]},{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","easy":true,"description":"`BuildError::UnexpectedEndEntire` is defined and has a `Display` arm but is never constructed or\nreturned anywhere in the library. It is a dead variant. This is a direct consequence of the missing\nEND_ENTIRE guard in `push()` described above.","fix":"Implement the END_ENTIRE guard in `push()` so this variant becomes live, as described in the logic_error finding above.","locations":[{"ref":"uefi/src/proto/device_path/build.rs:177-181","code":"  177 |     /// An [`END_ENTIRE`] node was passed to the builder. Use\n  178 |     /// [`DevicePathBuilder::finalize`] instead.\n  179 |     ///\n  180 |     /// [`END_ENTIRE`]: uefi::proto::device_path::DeviceSubType::END_ENTIRE\n  181 |     UnexpectedEndEntire,","lines":5,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/device_path/build.rs#L177-L181"},{"ref":"uefi/src/proto/device_path/build.rs:192","code":"  192 |                 Self::UnexpectedEndEntire => \"unexpected END_ENTIRE\",","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/device_path/build.rs#L192"}]},{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","easy":false,"description":"The `check_raw.rs` checker validates all top-level items in `uefi-raw` source files but silently\nskips the contents of `Item::Mod` inline modules (e.g., `mod tests { ... }`). This means Rust\nenums, free functions, or other forbidden constructs placed inside an inline module declaration\nwould pass validation undetected. Currently this only surfaces in `#[cfg(test)]` modules, but the\ngap would allow forbidden items to slip through if someone added a non-test inline module.","fix":"For `Item::Mod` with an inline body (`mod foo { ... }`), recursively call `check_item` on each\ninner item, or explicitly allow only `#[cfg(test)]` mods. Declare-only `mod foo;` can continue to\nbe unconditionally allowed.","locations":[{"ref":"xtask/src/check_raw.rs:425-426","code":"  425 |         Item::Impl(_) | Item::Mod(_) | Item::Use(_) => {\n  426 |             // Allow.","lines":2,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/xtask/src/check_raw.rs#L425-L426"}]},{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","easy":true,"description":"The doc comment for `IpAddress::new_v4` (line 139) says \"The type won't know that it is an IPv6 address\", but the function constructs an IPv4 address. This is a copy-paste error from the `new_v6` doc. A reader of this comment gets exactly the wrong information about what the type stores.","fix":"Change line 139 to: \"The type won't know that it is an IPv4 address and additional context\"","locations":[{"ref":"uefi-raw/src/net.rs:137-149","code":"  137 |     /// Construct a new IPv4 address.\n  138 |     ///\n  139 |     /// The type won't know that it is an IPv6 address and additional context\n  140 |     /// is needed.\n  141 |     ///\n  142 |     /// # Safety\n  143 |     /// The constructor only initializes the bytes needed for IPv4 addresses.\n  144 |     #[must_use]\n  145 |     pub const fn new_v4(octets: [u8; 4]) -> Self {\n  146 |         Self {\n  147 |             v4: Ipv4Address(octets),\n  148 |         }\n  149 |     }","lines":13,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi-raw/src/net.rs#L137-L149"}]},{"id":"CMT_2","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","easy":true,"description":"`IpAddress::new_v4` (a safe `pub const fn`) has a `# Safety` section in its doc comment. Safety sections are a strong Rust convention reserved for `unsafe fn`. Placing one on a safe function confuses readers and violates the standard documentation contract.","fix":"Replace the `# Safety` heading with `# Note` (or remove it and mention uninitialized bytes in the description paragraph).","locations":[{"ref":"uefi-raw/src/net.rs:142-143","code":"  142 |     /// # Safety\n  143 |     /// The constructor only initializes the bytes needed for IPv4 addresses.","lines":2,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi-raw/src/net.rs#L142-L143"}]},{"id":"CMT_3","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","easy":true,"description":"The module-level doc in `device_path.rs` contains a verbatim duplicate sentence: \"Each node represents a step in the path: PCI device, partition, filesystem, file path, etc.\" appears twice in consecutive lines (lines 20-22). This is a copy-paste artifact that makes the documentation look unprofessional and slightly confusing.","fix":"Remove the second occurrence of the duplicate sentence (lines 21-22).","locations":[{"ref":"uefi-raw/src/protocol/device_path.rs:20-22","code":"   20 | //! Each node represents a step in the path: PCI device, partition, filesystem,\n   21 | //! file path, etc. Each node represents a step in the path: PCI device,\n   22 | //! partition, filesystem, file path, etc.","lines":3,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi-raw/src/protocol/device_path.rs#L20-L22"}]},{"id":"CMT_4","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","easy":true,"description":"The doc comment for the is_64_bit_capable parameter in Usb2HostControllerProtocol::get_capability references \"Boolean::false\" which is not a valid Rust path. The correct identifier is Boolean::FALSE (or Boolean(0u8)). The comment is inside a block that also correctly references Boolean::TRUE, making the inconsistency more confusing.","fix":"Change \"Boolean::false\" to \"Boolean::FALSE\" in the comment.","locations":[{"ref":"uefi-raw/src/protocol/usb/host_controller.rs:113-120","code":"  113 |         port_number: *mut u8,\n  114 |         // [`Boolean::TRUE`] if the controller supports 64-bit memory\n  115 |         // addressing, [`Boolean::false`] otherwise.\n  116 |         //\n  117 |         // Effectively this is treated like a [`Boolean`] but the spec types it\n  118 |         // as `u8`.\n  119 |         is_64_bit_capable: *mut u8,\n  120 |     ) -> Status,","lines":8,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi-raw/src/protocol/usb/host_controller.rs#L113-L120"}]},{"id":"CMT_5","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","easy":true,"description":"The doc comment for Revision says \"the minor revision number is stored as a two-digit binary-coded decimal\" (BCD). However, the actual implementation treats the minor value as a plain decimal integer (e.g., EFI_2_31 stores minor=31 as 0x001f, not 0x31 as BCD would require), and the Display impl uses integer division by 10 rather than nibble extraction. The comment contradicts the code.","fix":"Change the comment to say \"stored as a two-digit decimal number\" (not BCD), consistent with how new(), minor(), and Display actually work.","locations":[{"ref":"uefi-raw/src/table/revision.rs:9-13","code":"    9 | /// The minor revision number is incremented on minor changes,\n   10 | /// it is stored as a two-digit binary-coded decimal.\n   11 | ///\n   12 | /// # Display format\n   13 | ///","lines":5,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi-raw/src/table/revision.rs#L9-L13"}]},{"id":"CMT_6","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","easy":true,"description":"In test_tpl(), the info! log message says \"Testing watchdog...\" but the function actually tests the Task Priority Level (TPL). This is misleading when reading test output because the watchdog test logs the same string later in test().","fix":"Change the info! message to \"Testing TPL...\" to match the function's actual purpose.","locations":[{"ref":"uefi-test-runner/src/boot/misc.rs:33-37","code":"   33 | fn test_tpl() {\n   34 |     info!(\"Testing watchdog...\");\n   35 |     // There's no way to query the TPL, so we can't assert that this does anything.\n   36 |     let _guard = unsafe { boot::raise_tpl(Tpl::NOTIFY) };\n   37 | }","lines":5,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi-test-runner/src/boot/misc.rs#L33-L37"}]},{"id":"CMT_7","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","easy":false,"description":"In allocator.rs::alloc_pool_aligned(), the SAFETY comment states the allocation is large enough for 'size + align + size_of::<*mut u8>()', but the actual allocation on line 49 is only `size + align`. The extra `size_of::<*mut u8>()` is not allocated. The code is actually correct without it (because the UEFI pool allocator returns 8-byte aligned pointers, so `offset` is always >= 8 = size_of::<*mut u8>() on 64-bit), but the comment misrepresents the allocation size and will confuse future readers.","fix":"Correct the SAFETY comment to state that the allocation is `size + align` bytes, and explain why that is sufficient: because UEFI pool allocations are 8-byte aligned, `align_offset` for any align >= 16 returns a multiple of 8 (or 0, which is promoted to `align`), so there are always at least sizeof(*mut u8) bytes before the aligned slot.","locations":[{"ref":"uefi/src/allocator.rs:65-67","code":"   65 |     // SAFETY: `full_alloc_ptr` points to a valid allocation large enough for\n   66 |     // `size + align + size_of::<*mut u8>()`. Adding `offset` keeps\n   67 |     // `aligned_ptr` within that allocation and yields the requested alignment.","lines":3,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/allocator.rs#L65-L67"}]},{"id":"CMT_8","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","easy":false,"description":"In `boot.rs`, the comment at line 144-145 says `count: Number of pages to allocate` but it's indented with `///-` (missing a space after the bullet marker). This is a minor formatting issue in the doc comment for `allocate_pages` that makes the rendered documentation slightly malformed.","fix":"Change `///- `count`` to `/// - `count`` (add space after dashes).","locations":[{"ref":"uefi/src/boot.rs:144","code":"  144 | ///- `count`: Number of pages to allocate.","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/boot.rs#L144"}]},{"id":"CMT_9","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","easy":false,"description":"In `uefi/src/helpers/mod.rs` line 10, the module-level doc comment contains a typo: \"boot services were not excited\" should be \"boot services were not exited\". This is a documentation error that may confuse readers.","fix":"Change \"excited\" to \"exited\" in the module documentation.","locations":[{"ref":"uefi/src/helpers/mod.rs:10-10","code":"   10 | //!   the stdout text protocol of UEFI (as long as boot services were not","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/helpers/mod.rs#L10"}]},{"id":"CMT_10","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","easy":true,"description":"Three consecutive unsafe blocks in `DebugSupport` methods each carry two safety comments that\ncontradict or duplicate each other:\n  `// Safety: As we've validated the processor_index, this should always be safe`\n  `// SAFETY: The memory is valid.`\nThe first comment is about argument validity; the second is a generic SAFETY tag that was pasted\nfrom a different context and is factually incorrect here (the safety obligation has nothing to do\nwith memory validity - there is no raw pointer dereference). Two styles (`Safety:` vs `SAFETY:`)\nare also mixed, which violates the project's convention.","fix":"Remove the spurious `// SAFETY: The memory is valid.` lines. Keep only the accurate `// Safety: ...` explanation (and normalise the capitalisation to `// SAFETY:` to match the rest of the codebase).","locations":[{"ref":"uefi/src/proto/debug/mod.rs:104-105","code":"  104 |         // Safety: As we've validated the `processor_index`, this should always be safe\n  105 |         // SAFETY: The memory is valid.","lines":2,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/debug/mod.rs#L104-L105"},{"ref":"uefi/src/proto/debug/mod.rs:129-130","code":"  129 |         // Safety: As we've validated the `processor_index`, this should always be safe\n  130 |         // SAFETY: The memory is valid.","lines":2,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/debug/mod.rs#L129-L130"},{"ref":"uefi/src/proto/debug/mod.rs:154-155","code":"  154 |         // Safety: As we've validated the `processor_index`, this should always be safe\n  155 |         // SAFETY: The memory is valid.","lines":2,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/debug/mod.rs#L154-L155"}]},{"id":"CMT_11","type":"invalid_comment","type_label":"Invalid Comment","severity":"low","easy":true,"description":"The documentation for `Infiniband::device_id` (read-side struct field) and its counterpart in the\nbuild-side struct both end with a double period: `\"64-bit persistent ID of remote device..\"`.\nThis is a copy-paste typo that makes the generated documentation look malformed.","fix":"Change `remote device..` to `remote device.` in both locations.","locations":[{"ref":"uefi/src/proto/device_path/device_path_gen.rs:1751","code":" 1751 |         /// 64-bit persistent ID of remote device..","lines":1,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/device_path/device_path_gen.rs#L1751"},{"ref":"uefi/src/proto/device_path/device_path_gen.rs:4998","code":" 4 trl_handles = uefi::boot::find_handles::<ExtScsiPassThru>().unwrap();\n   67 | \n   68 |     let mut found_drive = false;\n   69 |     for handle in scsi_ctrl_handles {\n   70 |         let scsi_pt = uefi::boot::open_protocol_exclusive::<ExtScsiPassThru>(handle).unwrap();\n   71 |         let mut cmd_bfr = scsi_pt.alloc_io_buffer(6).unwrap();\n   72 |         cmd_bfr.copy_from_slice(&[0x12, 0x00, 0x00, 0x00, 0xFF, 0x00]);\n   73 |         let mut read_bfr = scsi_pt.alloc_io_buffer(255).unwrap();\n   74 | \n   75 |         for mut device in scsi_pt.iter_devices() {\n   76 |             // see: https://www.seagate.com/files/staticfiles/support/docs/manual/Interface%20manuals/100293068j.pdf\n   77 |             // 3.6 INQUIRY command\n   78 |             let request = ScsiRequestBuilder::read(scsi_pt.io_align())\n   79 |                 .with_timeout(core::time::Duration::from_millis(500))\n   80 |                 .use_command_buffer(&mut cmd_bfr)\n   81 |                 .unwrap()\n   82 |                 .use_read_buffer(&mut read_bfr)\n   83 |                 .unwrap()\n   84 |                 .build();\n   85 |             let Ok(response) = device.execute_command(request) else {\n   86 |                 continue; // no device\n   87 |             };\n   88 |             let bfr = response.read_buffer().unwrap();\n   89 |             // more no device checks\n   90 |             if bfr.len() < 32 {\n   91 |                 continue;\n   92 |             }\n   93 |             if bfr[0] & 0b00011111 == 0x1F {\n   94 |                 continue;\n   95 |             }\n   96 | \n   97 |             // found device\n   98 |             let vendor_id = core::str::from_utf8(&bfr[8..16]).unwrap().trim();\n   99 |             let product_id = core::str::from_utf8(&bfr[16..32]).unwrap().trim();\n  100 |             if vendor_id == \"uefi-rs\" && product_id == \"ExtScsiPassThru\" {\n  101 |                 info!(\n  102 |                     \"Found Testdisk at: {:?} | {}\", osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/xtask/src/check_raw.rs#L441-L457"}]},{"id":"OTHER_1","type":"other","type_label":"Other","severity":"critical","easy":false,"description":"AtaResponse::status() and read_buffer() return references with lifetime 'a, but the underlying data (asb buffer for status, in_data_buffer AlignedBuffer for read_buffer via with_read_buffer) is owned inside the AtaResponse struct. When 'a is unconstrained (i.e. when no external buffers are passed and PhantomData defaults to 'static), the caller can obtain a 'static reference to memory that is freed when AtaResponse is dropped. This is a soundness hole (use-after-free). Example: `let resp: AtaResponse<'static> = device.execute_command(req).unwrap(); let s: &'static AtaStatusBlock = resp.status(); drop(resp); // s is now dangling!`. Fix: change the return type of both methods to tie the lifetime to &self (`&'_ AtaStatusBlock` and `Option<&'_ [u8]>`), so the references cannot outlive the AtaResponse.","fix":"Change `pub const fn status(&self) -> &'a AtaStatusBlock` to `pub const fn status(&self) -> &AtaStatusBlock` and `pub const fn read_buffer(&self) -> Option<&'a [u8]>` to `pub const fn read_buffer(&self) -> Option<&[u8]>`. Remove the explicit 'a lifetime annotation from both return types so the borrow checker ties the return lifetime to &self.","locations":[{"ref":"uefi/src/proto/ata/mod.rs:342-370","code":"  342 |     pub const fn status(&self) -> &'a AtaStatusBlock {\n  343 |         // SAFETY: The memory is valid.\n  344 |         unsafe {\n  345 |             self.req\n  346 |                 .asb\n  347 |                 .ptr()\n  348 |                 .cast::<AtaStatusBlock>()\n  349 |                 .as_ref()\n  350 |                 .unwrap()\n  351 |         }\n  352 |     }\n  353 | \n  354 |     /// Retrieves the buffer containing data read from the device (if available).\n  355 |     ///\n  356 |     /// # Returns\n  357 |     /// `Option<&[u8]>`: A slice of the data read from the device, or `None` if no read buffer was used.\n  358 |     #[must_use]\n  359 |     pub const fn read_buffer(&self) -> Option<&'a [u8]> {\n  360 |         if self.req.packet.in_data_buffer.is_null() {\n  361 |             return None;\n  362 |         }\n  363 |         // SAFETY: The memory is valid.\n  364 |         unsafe {\n  365 |             Some(core::slice::from_raw_parts(\n  366 |                 self.req.packet.in_data_buffer.cast(),\n  367 |                 self.req.packet.in_transfer_length as usize,\n  368 |             ))\n  369 |         }\n  370 |     }","lines":29,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi/src/proto/ata/mod.rs#L342-L370"}]},{"id":"OTHER_2","type":"other","type_label":"Other","severity":"medium","easy":false,"description":"In snp.rs, the transmit-completion poll is an unbounded busy-wait loop with no timeout or stall: `while !simple_network.get_interrupt_status().unwrap().contains(InterruptStatus::TRANSMIT) {}`. If the network device fails to raise the TRANSMIT interrupt (e.g., due to a firmware or emulator bug), the test hangs forever. The UdpRead retry loop for PXE correctly uses a bounded retry count; the same principle should apply here.","fix":"Add a retry limit with a `boot::stall()` between iterations, or use a UEFI event/timer to enforce a timeout, matching the retry pattern used in the UDP read section of the same test.","locations":[{"ref":"uefi-test-runner/src/proto/network/snp.rs:216-222","code":"  216 |     info!(\"Waiting for the transmit\");\n  217 |     while !simple_network\n  218 |         .get_interrupt_status()\n  219 |         .unwrap()\n  220 |         .contains(InterruptStatus::TRANSMIT)\n  221 |     {}\n  222 | ","lines":7,"link":"https://github.com/rust-osdev/uefi-rs/blob/edcc6c9b136e01d3c6da518cb7fd035d847d1432/uefi-test-runner/src/proto/network/snp.rs#L216-L222"}]},{"id":"OTHER_3","type":"other","type_label":"Other","severity":"lo   _hashTimer = setTimeout(() => {
    const p = new URLSearchParams();
    if (S.groupBy !== 'type') p.set('g', S.groupBy);
    if (S.hiddenSev.size)    p.set('hs',  [...S.hiddenSev].join(','));
    if (S.hiddenType.size)   p.set('ht',  [...S.hiddenType].join(','));
    if (S.hiddenStatus.size) p.set('hst', [...S.hiddenStatus].join(','));
    if (S.easyOnly)          p.set('e',   '1');
    if (S.search)            p.set('q',   S.search);
    const str = p.toString();
    history.replaceState(null, '', str ? '#' + str : location.pathname + location.search);
  }, 300);
}

function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has('g'))   { S.groupBy = p.get('g'); document.getElementById('groupby').value = S.groupBy; }
  if (p.has('q'))   { S.search  = p.get('q'); document.getElementById('search').value  = S.search;  }
  if (p.has('hs'))  p.get('hs') .split(',').filter(Boolean).forEach(v => S.hiddenSev.add(v));
  if (p.has('ht'))  p.get('ht') .split(',').filter(Boolean).forEach(v => S.hiddenType.add(v));
  if (p.has('hst')) p.get('hst').split(',').filter(Boolean).forEach(v => S.hiddenStatus.add(v));
  if (p.has('e'))   S.easyOnly = p.get('e') === '1';
}

// Helpers
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return String(text).split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}

// Render text with ```fenced``` code blocks and `inline` backticks,
// also paragraph-splitting on blank lines. Output is HTML-safe.
function renderMd(text, q) {
  const src = String(text == null ? '' : text);
  const FENCE = /```[ \t]*([A-Za-z0-9_+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
  const parts = [];
  let last = 0, m;
  while ((m = FENCE.exec(src)) !== null) {
    parts.push({kind: 'text', value: src.slice(last, m.index)});
    parts.push({kind: 'code', value: m[2].replace(/\r?\n$/, '')});
    last = m.index + m[0].length;
  }
  parts.push({kind: 'text', value: src.slice(last)});

  function renderInline(s) {
    const re = /`([^`\n]+)`/g;
    let out = '', i = 0, mm;
    while ((mm = re.exec(s)) !== null) {
      out += highlight(s.slice(i, mm.index), q);
      out += '<code class="md-inline">' + highlight(mm[1], q) + '</code>';
      i = mm.index + mm[0].length;
    }
    out += highlight(s.slice(i), q);
    return out;
  }

  function renderTextChunk(s) {
    const paragraphs = s.split(/\r?\n[ \t]*\r?\n/);
    const out = [];
    for (const p of paragraphs) {
      const trimmed = p.replace(/^\s+|\s+$/g, '');
      if (!trimmed) continue;
      out.push('<p>' + renderInline(trimmed).replace(/\r?\n/g, '<br>') + '</p>');
    }
    return out.join('');
  }

  let html = '';
  for (const p of parts) {
    if (p.kind === 'text') html += renderTextChunk(p.value);
    else html += '<pre class="md-code">' + highlight(p.value, q) + '</pre>';
  }
  return html;
}

function sevCls(s)    { return SEVS.includes(s) ? 'sev-'+s : 'sev-negligible'; }
function sevLbl(s)    { return s ? s[0].toUpperCase()+s.slice(1) : 'Medium'; }
function typeLabel(t) { return t.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

// First sentence of text (up to and including the first period).
function firstSentence(text) {
  const m = String(text).match(/\.(\s|$)/);
  return m ? text.slice(0, text.indexOf(m[0]) + 1) : text;
}

// Build full MD report for in-browser download.
function buildMdFull() {
  const SORD = ['critical','high','medium','low','negligible'];
  const today = new Date().toISOString().slice(0, 10);
  let out = '# Code Audit Report\n\n_Generated ' + today + '_\n\n';

  const typeMap = new Map();
  for (const f of FINDINGS) {
    if (!typeMap.has(f.type)) typeMap.set(f.type, []);
    typeMap.get(f.type).push(f);
  }
  const sortedTypes = [...typeMap.keys()].sort();

  out += '## Summary\n\n| Type | Severity | Count |\n|------|----------|-------|\n';
  for (const t of sortedTypes) {
    const items = typeMap.get(t);
    const topSev = items.map(f => f.severity || 'medium').reduce((best, s) => {
      const bi = SORD.indexOf(best), si = SORD.indexOf(s);
      return (si >= 0 && (bi < 0 || si < bi)) ? s : best;
    }, 'negligible');
    out += '| ' + typeLabel(t) + ' | ' + topSev + ' | ' + items.length + ' |\n';
  }

  for (const t of sortedTypes) {
    out += '\n## ' + typeLabel(t) + '\n\n';
    for (const f of typeMap.get(t)) {
      const sevStr  = f.severity ? ' `' + f.severity.toUpperCase() + '`' : '';
      const easyStr = f.easy ? ' ⚡ easy' : '';
      out += '### ' + f.id + sevStr + easyStr + '\n\n';
      out += '**Description:** ' + (f.description || '') + '\n\n';
      if (f.locations.length) {
        out += '**Locations:**\n\n';
        for (const l of f.locations) {
          if (l.code != null) out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
          else                out += '- `' + l.ref + '` _(file not found)_\n\n';
        }
      }
      out += '**Fix:** ' + (f.fix || '') + '\n\n---\n\n';
    }
  }
  return out;
}

// Build MD short checklist for in-browser download.
function buildMdShort() {
  const lines = [];
  const ids   = [];
  const sorted = [...FINDINGS].sort((a, b) => a.type.localeCompare(b.type));
  for (const f of sorted) {
    ids.push(f.id);
    const desc    = firstSentence(f.description || '');
    const locs    = f.locations.map(l => l.ref);
    const locStr  = locs.length ? ' - [' + locs.join(', ') + ']' : '';
    const sevStr  = f.severity ? ' [' + f.severity.toUpperCase() + ']' : '';
    const easyStr = f.easy ? ' ⚡' : '';
    lines.push('- [ ] - ' + f.id + sevStr + easyStr + ' - ' + desc + locStr);
  }
  lines.push('', '## IDs only', '');
  ids.forEach(id => lines.push('- [ ] - ' + id));
  return lines.join('\n') + '\n';
}

function downloadText(text, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime || 'text/plain'}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function tomlStr(s) {
  return '"' + String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t') + '"';
}

// Build TOML matching the original findings.toml format (re-parseable by toml_to_report.py).
function buildFindingsToml() {
  function pad(key) { return (key + '            ').slice(0, 12); }
  const chunks = [];
  for (const f of FINDINGS) {
    const lns = ['[[finding]]'];
    lns.push(pad('type')        + '= ' + tomlStr(f.type));
    lns.push(pad('severity')    + '= ' + tomlStr(f.severity || 'medium'));
    if (f.easy) lns.push(pad('easy') + '= true');
    lns.push(pad('description') + '= ' + tomlStr(f.description || ''));
    const refs = f.locations.map(l => tomlStr(l.ref));
    lns.push(pad('locations')   + '= [' + refs.join(', ') + ']');
    lns.push(pad('fix')         + '= ' + tomlStr(f.fix || ''));
    chunks.push(lns.join('\n'));
  }
  return chunks.join('\n\n') + '\n';
}

// Build project-info.toml from embedded PROJECT_INFO (same format as gen_project_info.py).
function buildProjectInfoToml() {
  const ORDER = ['name','description','git_url','repo_url','commit','commit_short','commit_url','branch','generated'];
  const pi = Object.assign({}, PROJECT_INFO);
  if (!('description' in pi)) pi.description = '';
  const lines = [
    '# Project metadata for the code audit report (all fields optional).',
    '# Hand-edit freely (e.g. fill in description); re-run the audit without --force to keep edits.',
    '', '[project]'
  ];
  for (const k of ORDER) {
    if (k in pi) lines.push(k + ' = ' + tomlStr(pi[k]));
  }
  return lines.join('\n') + '\n';
}

// Build the GitHub-ready Markdown for one finding (mirrors findings.md).
function findingToMd(f) {
  let out = '### ' + f.id + (f.severity ? ' `' + f.severity.toUpperCase() + '`' : '') + (f.easy ? ' ⚡ easy' : '') + '\n\n';
  out += '**Description:** ' + (f.description || '') + '\n\n';
  if (f.locations.length) {
    out += '**Locations:**\n\n';
    for (const l of f.locations) {
      if (l.code != null) out += '```\n' + l.ref + '\n' + l.code + '\n```\n\n';
      else                out += '- `' + l.ref + '` _(file not found)_\n\n';
    }
  }
  out += '**Fix:** ' + (f.fix || '') + '\n';
  return out;
}

function flashBtn(btn, msg) {
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = '⧉ Copy'; }, 1200);
}

function copyText(text, btn) {
  const ok = () => flashBtn(btn, '✓ Copied');
  const no = () => flashBtn(btn, '✗ Failed');
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.select();
      const r = document.execCommand('copy');
      document.body.removeChild(ta);
      r ? ok() : no();
    } catch { no(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

// Filter logic
function getKey(f) {
  if (S.groupBy === 'severity') return f.severity || 'medium';
  if (S.groupBy === 'file')     return f.locations.length ? f.locations[0].ref.replace(/:.*/,'') : '(no location)';
  if (S.groupBy === 'none')     return '';
  return f.type_label;
}

// Pre-compute search haystack per finding (cleared on full re-render)
const _hay = new Map();
function hayOf(f) {
  if (!_hay.has(f.id)) {
    _hay.set(f.id, [f.id, f.type_label, f.severity, f.description, f.fix,
                    f.easy ? 'easy quick win' : '',
                    ...f.locations.map(l => l.ref)].join(' ').toLowerCase());
  }
  return _hay.get(f.id);
}

function matches(f) {
  if (S.easyOnly && !f.easy)                   return false;
  if (S.hiddenSev.has(f.severity || 'medium')) return false;
  if (S.hiddenType.has(f.type))                return false;
  const st = statusOf(f.id);
  if (S.hiddenStatus.has(st))                  return false;
  if (S.search) {
    const q = S.search.toLowerCase();
    if (!hayOf(f).includes(q) && !st.includes(q)) return false;
  }
  return true;
}

function sortKeys(keys) {
  if (S.groupBy === 'severity') {
    return [...keys].sort((a, b) => {
      const ai = SEVS.indexOf(a), bi = SEVS.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }
  return [...keys].sort();
}

// Build body HTML for an expanded card (called lazily on first expand).
function renderCardBody(f, q) {
  let locs = '';
  for (const l of f.locations) {
    const lineInfo = l.lines != null
      ? ' <span class="loc-lines">(' + l.lines + ' line' + (l.lines === 1 ? '' : 's') + ')</span>'
      : '';
    const refHtml = l.link
      ? '<a class="loc-link" href="' + esc(l.link) + '" target="_blank" rel="noopener" title="Open at this commit">' + highlight(l.ref, q) + ' ↗</a>'
      : highlight(l.ref, q);
    locs += '<div class="loc-block"><div class="loc-ref">' + refHtml + lineInfo + '</div>';
    locs += l.code != null ? '<pre>' + esc(l.code) + '</pre>' : '<div class="not-found">(file not found)</div>';
    locs += '</div>';
  }
  return (
    '<div class="field-lbl">Description</div>' +
    '<div class="desc">'    + renderMd(f.description, q) + '</div>' +
    (locs ? '<div class="field-lbl">Locations</div>' + locs : '') +
    '<div class="field-lbl">Fix</div>' +
    '<div class="fix-txt">' + renderMd(f.fix, q) + '</div>'
  );
}

// Render card shell only — header + empty or populated body.
// When collapsed the body is empty (display:none) — avoids renderMd for 1800+ cards.
function renderCard(f, q) {
  const sc  = sevCls(f.severity || 'medium');
  const sl  = sevLbl(f.severity || 'medium');
  const st  = statusOf(f.id);
  const sc2 = STATUS_CLS[st] || 'st-open';
  const sl2 = STATUS_LBL[st] || '● open';
  const isCollapsed = S.collapsed.has(f.id);
  const isResolved  = st !== 'open';

  const locSummary = f.locations.length
    ? f.locations[0].ref + (f.locations.length > 1 ? ' \u2026' : '')
    : '';

  const bodyInner = isCollapsed ? '' : renderCardBody(f, q);

  return (
    '<div class="card' + (isResolved ? ' resolved' : '') + '" data-card-id="' + esc(f.id) + '">' +
    '<div class="card-header" data-action="toggle-card" data-id="' + esc(f.id) + '">' +
    '<span class="card-arrow">' + (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
    '<span class="card-id">' + esc(f.id) + '</span>' +
    '<span class="badge ' + sc + '" style="cursor:default">' + esc(sl) + '</span>' +
    '<span class="badge type-badge" style="cursor:default">' + esc(f.type_label) + '</span>' +
    (f.easy ? '<span class="badge easy-badge" style="cursor:default" title="Easy to verify &amp; fix - no deep knowledge of the code, SDK or technology required">\u26a1 Easy</span>' : '') +
    (locSummary ? '<span class="card-loc" title="' + esc(locSummary) + '">' + esc(locSummary) + '</span>' : '') +
    '<button class="status-btn ' + sc2 + '" data-action="cycle-status" data-id="' + esc(f.id) + '">' + sl2 + '</button>' +
    '<button class="copy-btn" data-action="copy-md" data-id="' + esc(f.id) + '" title="Copy as Markdown for GitHub">\u29c9 Copy</button>' +
    '</div>' +
    '<div class="card-body" data-body-id="' + esc(f.id) + '"' + (isCollapsed ? ' style="display:none"' : '') + '>' +
    bodyInner +
    '</div></div>'
  );
}

function initFilterBar() {
  const fb = document.getElementById('filterbar');
  let h = '<div class="filter-row"><span class="filter-lbl">Severity:</span>';
  for (const s of PRESENT_SEVS)
    h += '<button class="badge ' + sevCls(s) + '" data-sev="' + s + '">' + sevLbl(s) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="sev"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Type:</span>';
  for (const t of ALL_TYPES)
    h += '<button class="badge type-badge" data-type="' + esc(t) + '">' + esc(typeLabel(t)) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="type"></button></div>';

  h += '<div class="filter-row"><span class="filter-lbl">Status:</span>';
  for (const st of STATUSES)
    h += '<button class="badge ' + (STATUS_CLS[st]||'st-open') + '" data-status="' + st + '">' + (STATUS_LBL[st]||st) + '</button>';
  h += '<button class="filter-toggle" data-toggle-all="status"></button></div>';

  if (HAS_EASY)
    h += '<div class="filter-row"><span class="filter-lbl">Quick wins:</span>'
       + '<button class="badge easy-badge" data-easy="1">\u26a1 Easy only</button></div>';

  fb.innerHTML = h;
}

function updateToggles() {
  for (const b of document.querySelectorAll('[data-sev]'))    b.classList.toggle('off', S.hiddenSev.has(b.dataset.sev));
  for (const b of document.querySelectorAll('[data-type]'))   b.classList.toggle('off', S.hiddenType.has(b.dataset.type));
  for (const b of document.querySelectorAll('[data-status]')) b.classList.toggle('off', S.hiddenStatus.has(b.dataset.status));
  for (const b of document.querySelectorAll('[data-easy]'))   b.classList.toggle('off', !S.easyOnly);
  for (const b of document.querySelectorAll('[data-toggle-all]')) {
    const k = b.dataset.toggleAll;
    const set = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : S.hiddenStatus;
    b.textContent = set.size === 0 ? 'Hide all' : 'Show all';
  }
}

function updateProgress() {
  const total = FINDINGS.length;
  const done  = FINDINGS.filter(f => statusOf(f.id) !== 'open').length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total + ' resolved (' + pct + '%)';
}

// Surgical toggle: flip one card without touching the rest of the DOM.
function toggleCard(id) {
  const wasCollapsed = S.collapsed.has(id);
  if (wasCollapsed) S.collapsed.delete(id); else S.collapsed.add(id);
  const body  = document.querySelector('[data-body-id="' + id + '"]');
  const arrow = document.querySelector('[data-card-id="' + id + '"] .card-arrow');
  if (!body) { render(); return; }
  if (wasCollapsed) {
    if (!body.firstChild) {
      const f = FINDING_BY_ID.get(id);
      if (f) body.innerHTML = renderCardBody(f, S.search);
    }
    body.style.display = '';
    if (arrow) arrow.textContent = '\u25bc';
  } else {
    body.style.display = 'none';
    if (arrow) arrow.textContent = '\u25b6';
  }
}

// Surgical status update: update one card's button + resolved class.
function cycleStatus(id) {
  statuses[id] = STATUS_NEXT[statusOf(id)] || 'open';
  saveStatuses();
  const st  = statusOf(id);
  const btn = document.querySelector('.status-btn[data-id="' + id + '"]');
  if (!btn) { render(); return; }
  btn.className   = 'status-btn ' + (STATUS_CLS[st] || 'st-open');
  btn.textContent = STATUS_LBL[st] || '\u25cf open';
  const card = document.querySelector('[data-card-id="' + id + '"]');
  if (card) card.classList.toggle('resolved', st !== 'open');
  updateProgress();
}

// Surgical collapse/expand for a group: toggle all bodies in the group without full re-render.
function collapseGroup(key, collapse) {
  FINDINGS.forEach(f => {
    if (getKey(f) !== key) return;
    if (collapse) S.collapsed.add(f.id); else S.collapsed.delete(f.id);
    const body  = document.querySelector('[data-body-id="' + f.id + '"]');
    const arrow = document.querySelector('[data-card-id="' + f.id + '"] .card-arrow');
    if (!body) return;
    if (collapse) {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '\u25b6';
    } else {
      if (!body.firstChild) {
        const ff = FINDING_BY_ID.get(f.id);
        if (ff) body.innerHTML = renderCardBody(ff, S.search);
      }
      body.style.display = '';
      if (arrow) arrow.textContent = '\u25bc';
    }
  });
}

// Full re-render: used for filter/group-by/search changes.
// Batched via requestAnimationFrame.
let _rafPending = false;
function scheduleRender() {
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => { _rafPending = false; render(); });
}

function render() {
  _hay.clear();
  updateToggles();
  updateProgress();

  const q       = S.search;
  const visible = FINDINGS.filter(matches);
  document.getElementById('stats').textContent = visible.length + ' / ' + FINDINGS.length + ' findings';

  // Build groups
  const map = new Map();
  for (const f of visible) {
    const k = getKey(f);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(f);
  }

  // Hidden-groups bar
  const hbar = document.getElementById('hidden-bar');
  if (S.hiddenGroup.size > 0) {
    let hh = '<div class="hidden-inner"><span class="hidden-lbl">Hidden:</span>';
    for (const g of [...S.hiddenGroup].sort())
      hh += '<button class="show-btn" data-action="show-group" data-key="' + esc(g) + '">' + esc(g || '(all findings)') + '</button>';
    hh += '<button class="show-all-btn" data-action="show-all">Show all</button></div>';
    hbar.innerHTML = hh;
  } else {
    hbar.innerHTML = '';
  }

  // Content
  const content = document.getElementById('content');
  if (!visible.length) {
    content.innerHTML = '<div class="no-results">No findings match the current filters.</div>';
    syncHash();
    return;
  }

  let hh = '';
  for (const k of sortKeys([...map.keys()])) {
    if (S.hiddenGroup.has(k)) continue;
    const items   = map.get(k);
    const title   = k || 'All Findings';
    const done    = items.filter(f => statusOf(f.id) !== 'open').length;
    const allDone = done === items.length;
    hh += '<div class="group-section">' +
      '<div class="group-header">' +
      '<span class="group-title' + (allDone ? ' all-done' : '') + '">' + esc(title) + '</span>' +
      '<span class="group-count">' + done + '/' + items.length + '</span>' +
      '<button class="icon-btn" data-action="collapse-group" data-key="' + esc(k) + '" title="Collapse all">\u229f</button>' +
      '<button class="icon-btn" data-action="expand-group"   data-key="' + esc(k) + '" title="Expand all">\u229e</button>' +
      '<button class="hide-btn" data-action="hide-group"     data-key="' + esc(k) + '">Hide</button>' +
      '</div>';
    for (const f of items) hh += renderCard(f, q);
    hh += '</div>';
  }
  content.innerHTML = hh;
  syncHash();
}

// Event delegation
document.getElementById('filterbar').addEventListener('click', e => {
  const b = e.target.closest('[data-sev],[data-type],[data-status],[data-toggle-all],[data-easy]');
  if (!b) return;
  if (b.dataset.easy) {
    S.easyOnly = !S.easyOnly;
  }
  else if (b.dataset.toggleAll) {
    const k = b.dataset.toggleAll;
    const set  = k === 'sev' ? S.hiddenSev : k === 'type' ? S.hiddenType : S.hiddenStatus;
    const full = k === 'sev' ? PRESENT_SEVS : k === 'type' ? ALL_TYPES    : STATUSES;
    if (set.size === 0) full.forEach(v => set.add(v));
    else                set.clear();
  }
  else if (b.dataset.sev)    { const s = S.hiddenSev;    s.has(b.dataset.sev)    ? s.delete(b.dataset.sev)    : s.add(b.dataset.sev); }
  else if (b.dataset.type)   { const s = S.hiddenType;   s.has(b.dataset.type)   ? s.delete(b.dataset.type)   : s.add(b.dataset.type); }
  else if (b.dataset.status) { const s = S.hiddenStatus; s.has(b.dataset.status) ? s.delete(b.dataset.status) : s.add(b.dataset.status); }
  scheduleRender();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const { action, key, id } = b.dataset;

  if      (action === 'hide-group')     { S.hiddenGroup.add(key);    scheduleRender(); }
  else if (action === 'show-group')     { S.hiddenGroup.delete(key); scheduleRender(); }
  else if (action === 'show-all')       { S.hiddenGroup.clear();     scheduleRender(); }
  else if (action === 'collapse-all')   { FINDINGS.forEach(f => S.collapsed.add(f.id)); scheduleRender(); }
  else if (action === 'expand-all')     { S.collapsed.clear(); scheduleRender(); }
  else if (action === 'copy-md') {
    e.stopPropagation();
    const f = FINDING_BY_ID.get(id);
    if (f) copyText(findingToMd(f), b);
  }
  else if (action === 'download-md')       { downloadText(buildMdFull(),  'findings.md'); }
  else if (action === 'download-md-short') { downloadText(buildMdShort(), 'findings-short.md'); }
  else if (action === 'download-toml') {
    downloadText(buildFindingsToml(),    'findings.toml',     'application/toml');
    downloadText(buildProjectInfoToml(), 'project-info.toml', 'application/toml');
  }
  else if (action === 'cycle-status') {
    e.stopPropagation();
    cycleStatus(id);
  }
  else if (action === 'toggle-card') {
    toggleCard(id);
  }
  else if (action === 'collapse-group') {
    collapseGroup(key, true);
  }
  else if (action === 'expand-group') {
    collapseGroup(key, false);
  }
});

// Debounced search — 180 ms after last keystroke
let _searchTimer = 0;
document.getElementById('search').addEventListener('input', e => {
  S.search = e.target.value;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(scheduleRender, 180);
});
document.getElementById('groupby').addEventListener('change', e => {
  S.groupBy = e.target.value;
  S.hiddenGroup.clear();
  scheduleRender();
});

// Init
loadStatuses();
initFilterBar();
loadHash();
FINDINGS.forEach(f => S.collapsed.add(f.id));
render();
})();
</script>
</body></html>
