ata_first.data().len() {\n    self.total_size = 0;\n    Ok(Some(data_first.into_data()))\n} else {\n```\nAlternatively, clear both `self.total_size = 0;` and `self.data.clear();` in the incomplete-skip block so state is fully reset before the check.","locations":[{"ref":"crates/ironrdp-dvc/src/complete_data.rs:30-47","code":"   30 |     fn process_data_first_pdu(&mut self, data_first: DataFirstPdu) -> DecodeResult<Option<Vec<u8>>> {\n   31 |         let total_data_size: DecodeResult<_> = cast_length!(\"DataFirstPdu::length\", data_first.length());\n   32 |         let total_data_size = total_data_size?;\n   33 |         if self.total_size != 0 || !self.data.is_empty() {\n   34 |             error!(\"Incomplete DVC message, it will be skipped\");\n   35 | \n   36 |             self.data.clear();\n   37 |         }\n   38 | \n   39 |         if total_data_size == data_first.data().len() {\n   40 |             Ok(Some(data_first.into_data()))\n   41 |         } else {\n   42 |             self.total_size = total_data_size;\n   43 |             self.data = data_first.into_data();\n   44 | \n   45 |             Ok(None)\n   46 |         }\n   47 |     }","lines":18,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-dvc/src/complete_data.rs#L30-L47"}]},{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The client advertises the *intersection* of its formats and the server's formats (in nondeterministic HashSet order), but when a Wave2 PDU arrives, the `format_no` (which per MS-RDPEA 2.2.3.3 indexes the client's advertised format list) is passed straight to the backend which resolves it against its OWN full `get_formats()` list. When the advertised list differs from the full list in contents or order (the common case, e.g. a server that lacks Opus, or any HashSet reordering of [OPUS, PCM]), the backend picks the wrong `AudioFormat`. It then builds the cpal `DecodeStream` / Opus decoder with the wrong sample rate/channels/codec, producing garbled audio or feeding PCM bytes to the Opus decode path (and vice versa). This is the exact index-mismatch footgun the server side went to great lengths to avoid via `NegotiatedFormat`.","fix":"The `format_no` in incoming Wave/Wave2 PDUs indexes the list the client sent in `ClientAudioFormatPdu.formats` (the intersection), not the handler's full `get_formats()`. Persist the advertised `formats` Vec on `Rdpsnd` when building `client_formats()`, and map `pdu.format_no` through that Vec (e.g. look up the `AudioFormat`, then find its position in the handler's list, or pass the `AudioFormat` itself to `handler.wave`) before indexing. Also prefer a deterministic order (retain `get_formats()` order via `Vec::retain`/filter instead of `HashSet::intersection`) so the sent order is stable and matches what the handler expects.","locations":[{"ref":"crates/ironrdp-rdpsnd/src/client.rs:96-121","code":"   96 |     pub fn client_formats(&mut self) -> PduResult<RdpsndSvcMessages> {\n   97 |         // Windows seems to be confused if the client replies with more formats, or unknown formats (e.g.: opus).\n   98 |         // We ensure to only send supported formats in common with the server.\n   99 |         let server_format: HashSet<_> = self\n  100 |             .server_format\n  101 |             .as_ref()\n  102 |             .ok_or_else(|| pdu_other_err!(\"invalid state - no server format\"))?\n  103 |             .formats\n  104 |             .iter()\n  105 |             .collect();\n  106 |         let formats: HashSet<_> = self.handler.get_formats().iter().collect();\n  107 |         let formats = formats.intersection(&server_format).map(|&x| x.clone()).collect();\n  108 | \n  109 |         let pdu = pdu::ClientAudioFormatPdu {\n  110 |             version: self.version()?,\n  111 |             flags: self.handler.get_flags() | pdu::AudioFormatFlags::ALIVE,\n  112 |             formats,\n  113 |             volume_left: 0xFFFF,\n  114 |             volume_right: 0xFFFF,\n  115 |             pitch: 0x00010000,\n  116 |             dgram_port: 0,\n  117 |         };\n  118 |         Ok(RdpsndSvcMessages::new(vec![\n  119 |             pdu::ClientAudioOutputPdu::AudioFormat(pdu).into(),\n  120 |         ]))\n  121 |     }","lines":26,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-rdpsnd/src/client.rs#L96-L121"},{"ref":"crates/ironrdp-rdpsnd/src/client.rs:195-199","code":"  195 |                     pdu::ServerAudioOutputPdu::Wave2(pdu) => {\n  196 |                         let format_no = usize::from(pdu.format_no);\n  197 |                         let ts = pdu.audio_timestamp;\n  198 |                         self.handler.wave(format_no, ts, pdu.data);\n  199 |                         return Ok(self.wave_confirm(pdu.timestamp, pdu.block_no)?.into());","lines":5,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-rdpsnd/src/client.rs#L195-L199"},{"ref":"crates/ironrdp-rdpsnd-native/src/cpal.rs:74-89","code":"   74 |     fn wave(&mut self, format_no: usize, _ts: u32, data: Cow<'_, [u8]>) {\n   75 |         if Some(format_no) != self.format_no {\n   76 |             debug!(\"New audio format\");\n   77 |             self.close();\n   78 |         }\n   79 | \n   80 |         if self.stream_handle.is_none() {\n   81 |             let (tx, rx) = mpsc::channel();\n   82 |             self.tx = Some(tx);\n   83 | \n   84 |             self.format_no = Some(format_no);\n   85 |             let Some(format) = self.get_formats().get(format_no) else {\n   86 |                 warn!(?format_no, \"Invalid format_no\");\n   87 |                 return;\n   88 |             };\n   89 |             let format = format.clone();","lines":16,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-rdpsnd-native/src/cpal.rs#L74-L89"}]},{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`ActiveStageOutputIterator::next` pops from the back of the `Vec` with `self.0.pop()`, so outputs are delivered to the C# consumer in reverse of the order `ActiveStage::process` produced them. The Avalonia example (ffi/dotnet/.../MainWindow.axaml.cs:493-499) iterates with `while (!IsEmpty()) { Next() ... }`, sending/rendering in that reversed order. For a step that yields more than one output (e.g. multiple `ResponseFrame`s, or ResponseFrame(s) mixed with GraphicsUpdate/Terminate) this reverses the order in which response frames are written to the server and graphics updates are applied, corrupting protocol/rendering order.","fix":"Preserve production order, e.g. reverse the vector once at construction so `pop()` yields front-to-back, or use a front-draining index / `VecDeque::pop_front`. Simplest: store the outputs reversed in the constructor of `ActiveStageOutputIterator` and keep `pop()`, or change `next` to `if self.0.is_empty() { None } else { Some(Box::new(ActiveStageOutput(self.0.remove(0)))) }`.","locations":[{"ref":"ffi/src/session/mod.rs:37-39","code":"   37 |         pub fn next(&mut self) -> Option<Box<ActiveStageOutput>> {\n   38 |             self.0.pop().map(ActiveStageOutput).map(Box::new)\n   39 |         }","lines":3,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/ffi/src/session/mod.rs#L37-L39"}]},{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In the `extension_match!` macro, the diagnostic arms for `String`, `f64`, and `bool` reference `stringify!($ident)`, but `$ident` is not a metavariable bound in those arms (the bound name is `$value`). An unbound metavariable in a macro transcriber is not a compile error; it is emitted literally, so the warning always prints the literal text `$ident` instead of the extension name. I confirmed this empirically: a minimal reproduction of the same macro shape prints `bad extension name = [$ident]`. Every time the web client receives an unexpected value type for one of these extensions (e.g. `pcb`, `kdc_proxy_url`, `display_control`, `enable_credssp`, `outbound_message_size_limit` in crates/ironrdp-web/src/session.rs), the log line is useless. Separately, these arms call `warn!` unqualified while the top-level arm uses `::tracing::warn!`, so the macro only compiles at call sites that happen to import `warn`.","fix":"Replace the unbound `$ident` with the bound `$value` (and qualify the macro for portability). For each arm, change:\n```rust\nwarn!(\"Unexpected value for extension {}\", stringify!($ident));\n```\nto:\n```rust\n::tracing::warn!(\"Unexpected value for extension {}\", stringify!($value));\n```","locations":[{"ref":"crates/iron-remote-desktop/src/extension.rs:10","code":"   10 |             warn!(\"Unexpected value for extension {}\", stringify!($ident));","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/iron-remote-desktop/src/extension.rs#L10"},{"ref":"crates/iron-remote-desktop/src/extension.rs:16","code":"   16 |         } else {","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/iron-remote-desktop/src/extension.rs#L16"},{"ref":"crates/iron-remote-desktop/src/extension.rs:23","code":"   23 |         } else {","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/iron-remote-desktop/src/extension.rs#L23"}]},{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"In `PreconnectionBlob::encode`, the `cchPCB` field is computed as `v2_payload.chars().count() + 1` (Unicode scalar values), but both `size()` (via `null_terminated_utf16_encoded_len`) and the actual `wszPCB` write use `encode_utf16()` (UTF-16 code units). The decoder treats `cchPCB` as a code-unit count (`cb_pcb = cch_pcb * 2`). For strings containing supplementary-plane characters (each 1 scalar but 2 UTF-16 code units), `chars().count()` under-counts, so the encoded `cchPCB` is smaller than the true number of code units. With two or more such characters the decoder reads fewer bytes than were written, splitting a surrogate pair and causing `String::from_utf16` to fail (`read_utf16_string` returns an error), so a PDU this library itself produced fails to round-trip / decode.","fix":"Count UTF-16 code units, matching `size()` and the write below it.\n\nBefore:\n```rust\nlet utf16_character_count = v2_payload.chars().count() + 1; // +1 for null terminator\n```\n\nAfter:\n```rust\nlet utf16_character_count = v2_payload.encode_utf16().count() + 1; // +1 for null terminator\n```","locations":[{"ref":"crates/ironrdp-pdu/src/pcb.rs:133","code":"  133 |             let utf16_character_count = v2_payload.chars().count() + 1; // +1 for null terminator","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-pdu/src/pcb.rs#L133"}]},{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `LicensingErrorMessage::decode`, after reading the `error_info` blob header, the code allocates a zero-filled buffer of the declared length (`vec![0u8; error_info_blob.length]`) but never reads the actual bytes from the cursor. Consequently, whenever the server sends a non-empty bbErrorInfo blob, the decoded `error_info` field contains zeros instead of the real data, and the cursor is left unadvanced (breaking encode/decode round-trip). This decode path is reachable from the network via `LicensePdu::decode` for the `ErrorAlert` preamble type.","fix":"Read the blob payload from the cursor instead of allocating zeros. Replace:\n```rust\nlet error_info = vec![0u8; error_info_blob.length];\n```\nwith:\n```rust\nensure_size!(in: src, size: error_info_blob.length);\nlet error_info = src.read_slice(error_info_blob.length).to_vec();\n```","locations":[{"ref":"crates/ironrdp-pdu/src/rdp/server_license/licensing_error_message/mod.rs:83-88","code":"   83 |         let error_info_blob = BlobHeader::decode(src)?;\n   84 |         if error_info_blob.length != 0 && error_info_blob.blob_type != BlobType::ERROR {\n   85 |             return Err(invalid_field_err!(\"blobType\", \"invalid blob type\"));\n   86 |         }\n   87 | \n   88 |         let error_info = vec![0u8; error_info_blob.length];","lines":6,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-pdu/src/rdp/server_license/licensing_error_message/mod.rs#L83-L88"}]},{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In `rpce::Pdu<T>::encode`, the MS-RPCE Private Header `ObjectBufferLength` is set to `self.size()`, which is `StreamHeader::size() (8) + TypeHeader::size() (8) + inner.size() + padding`. Per [MS-RPCE] 2.2.6.2 the `ObjectBufferLength` field must contain only the length of the encapsulated constructed-type data, NOT the 16 bytes of the common-type header + private-type header that precede it (some readings also exclude the padding). As written every RPCE response the client emits (e.g. `LongReturn`, `EstablishContextReturn`, `ConnectReturn`, `TransmitReturn`, `StatusReturn`, `ListReadersReturn`, ...) advertises an object-buffer length that is at least 16 bytes larger than the data that actually follows the two headers. The decode side (`Pdu::decode`) ignores this field, and Windows appears lenient (smartcard redirection works in practice), so real-world impact is low, but it is a clear on-the-wire spec deviation and would break any peer that validates the length.","fix":"Compute the object-buffer length from only the encapsulated payload rather than the whole PDU. Replace:\n```rust\nlet type_header = TypeHeader::new(cast_length!(\"Pdu<T>\", \"size\", self.size())?);\n```\nwith something like:\n```rust\nlet object_buffer_length = HeaderlessEncode::size(&self.0) + padding_size(&self.0);\nlet type_header = TypeHeader::new(cast_length!(\"Pdu<T>\", \"object_buffer_length\", object_buffer_length)?);\n```\n(keeping the `ensure_size!` on `self.size()` for the destination buffer).","locations":[{"ref":"crates/ironrdp-rdpdr/src/pdu/esc/rpce.rs:107-133","code":"  107 | impl<T: HeaderlessEncode> ironrdp_core::Encode for Pdu<T> {\n  108 |     fn encode(&self, dst: &mut WriteCursor<'_>) -> EncodeResult<()> {\n  109 |         ensure_size!(ctx: self.name(), in: dst, size: self.size());\n  110 |         let stream_header = StreamHeader::default();\n  111 |         let type_header = TypeHeader::new(cast_length!(\"Pdu<T>\", \"size\", self.size())?);\n  112 | \n  113 |         stream_header.encode(dst)?;\n  114 |         type_header.encode(dst)?;\n  115 |         HeaderlessEncode::encode(&self.0, dst)?;\n  116 | \n  117 |         // Pad response to be 8-byte aligned.\n  118 |         let padding_size = padding_size(&self.0);\n  119 |         if padding_size > 0 {\n  120 |             dst.write_slice(&vec![0; padding_size]);\n  121 |         }\n  122 | \n  123 |         Ok(())\n  124 |     }\n  125 | \n  126 |     fn name(&self) -> &'static str {\n  127 |         self.0.name()\n  128 |     }\n  129 | \n  130 |     fn size(&self) -> usize {\n  131 |         StreamHeader::size() + TypeHeader::size() + HeaderlessEncode::size(&self.0) + padding_size(&self.0)\n  132 |     }\n  133 | }","lines":27,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-rdpdr/src/pdu/esc/rpce.rs#L107-L133"}]},{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"`saveImage(DecodedImage decodedImage, string v)` ignores its `v` (output path) parameter entirely and always writes to the hardcoded path `\"./output.bmp\"`, even though it is called as `saveImage(decodedImage, \"output.png\")`. The requested filename/format is silently discarded, so the caller's intent (a PNG named output.png) is never honored. This is a dev-only example, so impact is minimal.","fix":"Use the passed-in path instead of the literal. For example change line 107 from `image.Save(\"./output.bmp\");` to `image.Save(v);` (and pass a `.bmp` name at the call site, or select the encoder from the extension). The unused parameter `v` should either be used or the method renamed to reflect it always emits a bitmap.","locations":[{"ref":"ffi/dotnet/Devolutions.IronRdp.ConnectExample/Program.cs:69","code":"   69 |                 saveImage(decodedImage, \"output.png\");","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/ffi/dotnet/Devolutions.IronRdp.ConnectExample/Program.cs#L69"},{"ref":"ffi/dotnet/Devolutions.IronRdp.ConnectExample/Program.cs:78","code":"   78 |         private static void saveImage(DecodedImage decodedImage, string v)","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/ffi/dotnet/Devolutions.IronRdp.ConnectExample/Program.cs#L78"},{"ref":"ffi/dotnet/Devolutions.IronRdp.ConnectExample/Program.cs:107","code":"  107 |             image.Save(\"./output.bmp\");","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/ffi/dotnet/Devolutions.IronRdp.ConnectExample/Program.cs#L107"}]},{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`closeSession` only reassigns the current session when `sessionCounter` happens to reach exactly 1 after decrement. When more than two sessions exist and the currently-active one is closed, `currentSession`/`_currentSession` keep pointing at the removed (dangling) session instead of a surviving one. `addSession`/`closeSession` also use a monotonic-ish counter that does not track the real remaining count consistently. Demo client only, so low severity.","fix":"Track the active session explicitly: when closing, if the removed id equals the current session's id, reassign to `sessions[0]` (or clear when empty) rather than gating on `sessionCounter == 1`; base counts on `sessions.length` instead of a separate counter.","locations":[{"ref":"web-client/iron-svelte-client/src/services/session.service.ts:48-54","code":"   48 | export function closeSession(id: Guid) {\n   49 |     sessionCounter--;\n   50 |     sessions = sessions.filter((session) => !session.id.equals(id));\n   51 |     if (sessionCounter == 1) {\n   52 |         setCurrentSession(sessions[0]);\n   53 |     }\n   54 | }","lines":7,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/web-client/iron-svelte-client/src/services/session.service.ts#L48-L54"},{"ref":"web-client/iron-svelte-client/src/services/session.service.ts:39-46","code":"   39 | export function addSession(name: string) {\n   40 |     sessionCounter++;\n   41 |     const newSession = new Session(name);\n   42 |     sessions.push(newSession);\n   43 |     if (sessionCounter == 1) {\n   44 |         setCurrentSession(newSession);\n   45 |     }\n   46 | }","lines":8,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/web-client/iron-svelte-client/src/services/session.service.ts#L39-L46"}]},{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"very_easy","description":"The Vite `mode` config value is a quoted string literal `'process.env.MODE'`, not the environment variable `process.env.MODE`. The literal is always truthy, so the `|| 'development'` fallback is dead and `mode` is set to the nonsense string `\"process.env.MODE\"`. This corrupts Vite's mode resolution (which drives `.env` file selection and `import.meta.env.MODE`).","fix":"Remove the quotes so the env var is actually read.\n\nBefore:\n```ts\nmode: 'process.env.MODE' || 'development',\n```\nAfter:\n```ts\nmode: process.env.MODE || 'development',\n```","locations":[{"ref":"web-client/iron-svelte-client/vite.config.ts:7","code":"    7 |     mode: 'process.env.MODE' || 'development',","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/web-client/iron-svelte-client/vite.config.ts#L7"}]},{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In build_dynamic_lib, the native lib output directory is created with a relative path resolved against the OS process CWD, but the file is copied to a destination resolved against the shell's CWD (project root via root_dir.join(...)). xshell's Shell::change_dir / current_dir do not change the OS process CWD, and create_dir_all/fs::copy are std calls that use the process CWD. When `cargo xtask ffi build-dll` is run from any subdirectory of the repo, create_dir_all creates `dependencies/runtimes/.../native/` under the subdirectory while fs::copy targets `<root>/dependencies/runtimes/.../native/<lib>`, whose parent was never created, so the copy fails with 'No such file or directory'.","fix":"Create the directory using the same root-anchored path used for the copy destination. Before:\n```rust\nlet dotnet_native_lib_dir_path: PathBuf = DOTNET_NATIVE_LIB_PATH.parse()?;\nlet dotnet_native_lib_path = root_dir.join(&dotnet_native_lib_dir_path).join(DOTNET_NATIVE_LIB_NAME);\n\ncreate_dir_all(&dotnet_native_lib_dir_path)\n    .with_context(|| format!(\"failed to create directory {}\", dotnet_native_lib_dir_path.display()))?;\n```\nAfter:\n```rust\nlet dotnet_native_lib_dir_path: PathBuf = root_dir.join(DOTNET_NATIVE_LIB_PATH);\nlet dotnet_native_lib_path = dotnet_native_lib_dir_path.join(DOTNET_NATIVE_LIB_NAME);\n\ncreate_dir_all(&dotnet_native_lib_dir_path)\n    .with_context(|| format!(\"failed to create directory {}\", dotnet_native_lib_dir_path.display()))?;\n```","locations":[{"ref":"xtask/src/ffi.rs:56-68","code":"   56 |     let dotnet_native_lib_dir_path: PathBuf = DOTNET_NATIVE_LIB_PATH.parse()?;\n   57 |     let dotnet_native_lib_path = root_dir.join(&dotnet_native_lib_dir_path).join(DOTNET_NATIVE_LIB_NAME);\n   58 | \n   59 |     create_dir_all(&dotnet_native_lib_dir_path)\n   60 |         .with_context(|| format!(\"failed to create directory {}\", dotnet_native_lib_dir_path.display()))?;\n   61 | \n   62 |     fs::copy(&output_lib_path, &dotnet_native_lib_path).with_context(|| {\n   63 |         format!(\n   64 |             \"failed to copy {} to {}\",\n   65 |             output_lib_path.display(),\n   66 |             dotnet_native_lib_path.display()\n   67 |         )\n   68 |     })?;","lines":13,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/xtask/src/ffi.rs#L56-L68"}]},{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"In `ClientLicenseInfo::decode`, the encrypted HWID blob's type is validated against `BlobType::DATA`, but the corresponding `encode` writes `BlobType::ENCRYPTED_DATA` (line 137), and per MS-RDPELE 2.2.2.3 the EncryptedHWID field is a `BB_ENCRYPTED_DATA_BLOB` (0x0009). The check is a copy-paste of the preceding `license_info` block (which correctly uses `BlobType::DATA`). As a result, decoding spec-compliant / self-encoded CLIENT_LICENSE_INFO data is rejected with an `invalid blob type` error, and encode/decode do not round-trip.","fix":"Check against the correct blob type. Change:\n```rust\nif encrypted_hwid_blob_header.blob_type != BlobType::DATA {\n```\nto:\n```rust\nif encrypted_hwid_blob_header.blob_type != BlobType::ENCRYPTED_DATA {\n```","locations":[{"ref":"crates/ironrdp-pdu/src/rdp/server_license/client_license_info.rs:175-177","code":"  175 |         let encrypted_hwid_blob_header = BlobHeader::decode(src)?;\n  176 |         if encrypted_hwid_blob_header.blob_type != BlobType::DATA {\n  177 |             return Err(invalid_field_err!(\"blobType\", \"invalid blob type\"));","lines":3,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-pdu/src/rdp/server_license/client_license_info.rs#L175-L177"}]},{"id":"CPY_2","type":"copy_paste","type_label":"Copy Paste","severity":"medium","difficulty":"very_easy","description":"In the `From<PerformanceFlagsType> for PerformanceFlags` conversion, the `EnableFontSmoothing` variant is mapped to `PerformanceFlags::ENABLE_DESKTOP_COMPOSITION` instead of `PerformanceFlags::ENABLE_FONT_SMOOTHING`. This is a copy-paste error from the line directly above it (`EnableDesktopComposition => ENABLE_DESKTOP_COMPOSITION`). A C# caller who requests font smoothing via `PerformanceFlags.AddFlag(EnableFontSmoothing)` will silently get desktop composition enabled instead, and font smoothing is never sent to the server. Both flags exist (verified in crates/ironrdp-pdu/src/rdp/client_info.rs:673-674).","fix":"Change the mapping to the correct flag:\n```rust\n// before\nPerformanceFlagsType::EnableFontSmoothing => PerformanceFlags::ENABLE_DESKTOP_COMPOSITION,\n// after\nPerformanceFlagsType::EnableFontSmoothing => PerformanceFlags::ENABLE_FONT_SMOOTHING,\n```","locations":[{"ref":"ffi/src/connector/config.rs:285","code":"  285 |             PerformanceFlagsType::EnableFontSmoothing => PerformanceFlags::ENABLE_DESKTOP_COMPOSITION,","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/ffi/src/connector/config.rs#L285"}]},{"id":"CPY_3","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"The DVC pipe proxy worker invokes the write callback with a hard-coded channel id `0` instead of the real `ctx.channel_id`. The callback signature is `Fn(u32, Vec<SvcMessage>)` and the `u32` is meant to be the DVC channel id (the analogous COM-plugin path in `com.rs:165` correctly passes `self.channel_id`). Consumers that read this id (e.g. the FFI `DvcPipeProxyMessage::get_channel_id`, which exposes `self.0.0`) always observe 0, so any per-channel routing/identification done off this value is wrong for every channel except id 0. The encoded `SvcMessage`s themselves carry the correct id, so wire routing still works, limiting impact.","fix":"Pass the real channel id:\n```rust\nif let Err(error) = (ctx.on_write_dvc)(0, messages) {\n```\nshould be:\n```rust\nif let Err(error) = (ctx.on_write_dvc)(ctx.channel_id, messages) {\n```","locations":[{"ref":"crates/ironrdp-dvc-pipe-proxy/src/worker.rs:169","code":"  169 |                 if let Err(error) = (ctx.on_write_dvc)(0, messages) {","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-dvc-pipe-proxy/src/worker.rs#L169"}]},{"id":"CPY_4","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"very_easy","description":"The `Quant` PDU's `NAME` constant is set to `\"RfxFrameEnd\"`, copy-pasted from `FrameEndPdu`. `Quant::name()` returns this value, so any encode error context for a quantization block is mislabeled as a frame-end block, producing misleading diagnostics.","fix":"Rename the constant to reflect the type. Before:\n```rust\nimpl Quant {\n    const NAME: &'static str = \"RfxFrameEnd\";\n```\nAfter:\n```rust\nimpl Quant {\n    const NAME: &'static str = \"RfxQuant\";\n```","locations":[{"ref":"crates/ironrdp-pdu/src/codecs/rfx/data_messages.rs:511","code":"  511 |     const NAME: &'static str = \"RfxFrameEnd\";","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-pdu/src/codecs/rfx/data_messages.rs#L511"}]},{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"In `Connection.ResolveGenerator`, the CredSSP network-request response is read with a single `await stream.ReadAsync(readBuf, 0, readBuf.Length)` into a fixed 8096-byte buffer, and whatever that one call returns is passed straight to `generator.Resume`. A single TCP `ReadAsync` is not guaranteed to return a complete application message: a KDC/Kerberos response larger than 8096 bytes, or one split across packets, will be truncated or partial, causing CredSSP decoding to fail intermittently. The code assumes one read == one full message.","fix":"Frame the read properly: read the length prefix used by the KDC-proxy/TSRequest transport, then loop `ReadAsync` until the full message (that many bytes) has been accumulated before calling `generator.Resume`, instead of relying on a single 8096-byte read.","locations":[{"ref":"ffi/dotnet/Devolutions.IronRdp/src/Connection.cs:83-88","code":"   83 |                     stream.Write(Utils.VecU8ToByte(data));\n   84 |                     var readBuf = new byte[8096];\n   85 |                     var readlen = await stream.ReadAsync(readBuf, 0, readBuf.Length);\n   86 |                     var actuallyRead = new byte[readlen];\n   87 |                     Array.Copy(readBuf, actuallyRead, readlen);\n   88 |                     state = generator.Resume(actuallyRead);","lines":6,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/ffi/dotnet/Devolutions.IronRdp/src/Connection.cs#L83-L88"}]},{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"In `FinalizationSequence::step`, the `WaitSynchronize` and `WaitControlCooperate` states call `decode_share_control(input)` and bind the `ConnectorResult` to a variable that is only debug-printed; the `?` operator is dropped, so a decode error on the client-supplied Synchronize/Control-Cooperate PDU is silently swallowed and the state machine advances anyway. The sibling `WaitRequestControl` state (line 100) calls the identical helper with `?`, propagating the error. The asymmetry strongly indicates a dropped `?` rather than intentional leniency, and it means the server treats malformed finalization PDUs as valid and moves on.","fix":"Propagate the decode error like the `WaitRequestControl` arm does. Change:\n```rust\nlet synchronize = decode_share_control(input);\n```\nto:\n```rust\nlet synchronize = decode_share_control(input)?;\n```\nand likewise `let cooperate = decode_share_control(input)?;`.","locations":[{"ref":"crates/ironrdp-acceptor/src/finalization.rs:84","code":"   84 |                 let synchronize = decode_share_control(input);","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-acceptor/src/finalization.rs#L84"},{"ref":"crates/ironrdp-acceptor/src/finalization.rs:92","code":"   92 |                 let cooperate = decode_share_control(input);","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-acceptor/src/finalization.rs#L92"}]},{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In `ConfigBuilder::with_property_set`, `desktop_scale_factor`, `desktop_width`, and `desktop_height` are read with `.ok().flatten()`, silently discarding an `InvalidDesktopSize` error, whereas `full_address`, `alternate_full_address`, `server_port`, and `gateway_usage_method` in the same function propagate their parse errors via `.context(...)?`. An out-of-range desktop dimension in a `.rdp` file is silently ignored (falls back to defaults) rather than reported, which is inconsistent with the surrounding validation and can mask a malformed config.","fix":"Either propagate these errors consistently (`ps.desktop_width().context(\"invalid 'desktopwidth'\")?`) or document explicitly that invalid desktop dimensions are intentionally best-effort and ignored.","locations":[{"ref":"crates/ironrdp-client/src/config.rs:1266-1274","code":" 1266 |         if let Some(scale) = ps.desktop_scale_factor().ok().flatten() {\n 1267 |             self.desktop_scale_factor = Some(scale);\n 1268 |         }\n 1269 |         if let Some(width) = ps.desktop_width().ok().flatten() {\n 1270 |             self.desktop_width = Some(width);\n 1271 |         }\n 1272 |         if let Some(height) = ps.desktop_height().ok().flatten() {\n 1273 |             self.desktop_height = Some(height);\n 1274 |         }","lines":9,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-client/src/config.rs#L1266-L1274"}]},{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"very_easy","description":"In the excluded (non-compiling) replay client, `handle_file` opens the data file with `File::open(args.data_file).unwrap()`, panicking on any I/O error (missing file, permissions) instead of propagating the `Result<(), Error>` it already returns. `info!`/`error!` macros are also used without a `use tracing::{info, error}` import. This crate is excluded from the workspace and does not compile, so priority is low.","fix":"Replace `.unwrap()` with `?` (the function returns `Result`), and add `use tracing::{error, info};`.","locations":[{"ref":"crates/ironrdp-replay-client/src/main.rs:93","code":"   93 |     let file = File::open(args.data_file).unwrap();","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-replay-client/src/main.rs#L93"},{"ref":"crates/ironrdp-replay-client/src/main.rs:65-112","code":"   65 |         info!(\"Result: {:?}\", result);\n   66 |     });\n   67 | \n   68 |     event_loop.run(move |main_event, _, control_flow| {\n   69 |         *control_flow = ControlFlow::Wait;\n   70 | \n   71 |         match &main_event {\n   72 |             Event::LoopDestroyed => {}\n   73 |             Event::RedrawRequested(_) => {\n   74 |                 let res = renderer.repaint();\n   75 |                 if res.is_err() {\n   76 |                     error!(\"Repaint send error: {:?}\", res);\n   77 |                 }\n   78 |             }\n   79 |             Event::WindowEvent { ref event, .. } => match event {\n   80 |                 WindowEvent::CloseRequested => *control_flow = ControlFlow::Exit,\n   81 |                 WindowEvent::Resized(size) => {\n   82 |                     info!(\"Window resized {:?}\", size);\n   83 |                 }\n   84 |                 _ => {}\n   85 |             },\n   86 |             _ => (),\n   87 |         }\n   88 |     });\n   89 | }\n   90 | \n   91 | // Parse the graphics file and send it to renderer 1 event at a time\n   92 | fn handle_file(sender: std::sync::mpsc::SyncSender<ServerPdu>, args: Args) -> Result<(), Error> {\n   93 |     let file = File::open(args.data_file).unwrap();\n   94 |     let delay = 1000 / args.frame_rate as u64;\n   95 | \n   96 |     loop {\n   97 |         let packet = ServerPdu::from_buffer(&file);\n   98 |         if let Ok(packet) = packet {\n   99 |             let wait = matches!(packet, ServerPdu::WireToSurface1(..));\n  100 |             sender.send(packet)?;\n  101 |             if wait {\n  102 |                 thread::sleep(Duration::from_millis(delay));\n  103 |             }\n  104 |         } else {\n  105 |             let ignorable = if let Err(GraphicsPipelineError::IOError(e)) = packet.as_ref() {\n  106 |                 e.kind() == ErrorKind::UnexpectedEof\n  107 |             } else {\n  108 |                 false\n  109 |             };\n  110 | \n  111 |             if !ignorable {\n  112 |                 error!(\"Error: {:?}\", packet);","lines":48,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-replay-client/src/main.rs#L65-L112"}]},{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"negligible","difficulty":"easy","description":"In the three completion helpers, the pending-IO map entry is removed only after the fallible completion builder succeeds. If `build_io_control_completion` / `build_transfer_in_completion` / `build_transfer_out_completion` returns `Err` (e.g. the backend-supplied output buffer/size exceeds the request's `max_output_buf_size`), the `?` returns early and `entry.remove()` is never reached, so the request stays registered in `pending_io` even though its completion was consumed. Impact is minimal in practice because the error propagates up `process()` and normally tears down the channel, and the oversized-buffer condition requires a misbehaving local backend rather than hostile wire data.","fix":"Remove the entry before building the (fallible) completion, or restructure so removal happens regardless of build outcome. For example in `complete_io_control`:\n```rust\nlet (completion_iface, entry) = self.pending_completion(request_id, expected_kind)?;\nlet pending = *entry.get();\nentry.remove();\nlet completion = build_io_control_completion(pending, completion_iface, request_id, response)?;\nOk(completion)\n```\nApply the same reordering to `transfer_in_completion` and `transfer_out_completion`.","locations":[{"ref":"crates/ironrdp-rdpeusb/src/client.rs:361-366","code":"  361 |         let (completion_iface, entry) = self.pending_completion(request_id, expected_kind)?;\n  362 |         let pending = *entry.get();\n  363 |         let completion = build_io_control_completion(pending, completion_iface, request_id, response)?;\n  364 |         entry.remove();\n  365 | \n  366 |         Ok(completion)","lines":6,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-rdpeusb/src/client.rs#L361-L366"},{"ref":"crates/ironrdp-rdpeusb/src/client.rs:394-406","code":"  394 |         let (completion_iface, entry) = self.pending_completion(request_id, PendingKind::TransferIn)?;\n  395 |         let pending = *entry.get();\n  396 | \n  397 |         #[expect(\n  398 |             clippy::missing_panics_doc,\n  399 |             reason = \"panic is unreachable unless the pending transfer-key invariant is broken\"\n  400 |         )]\n  401 |         let req_id = RequestIdTransferInOut::try_from(request_id)\n  402 |             .expect(\"pending TransferIn request id must be a TS_URB request id\");\n  403 |         let completion = build_transfer_in_completion(pending, completion_iface, req_id, response)?;\n  404 |         entry.remove();\n  405 | \n  406 |         Ok(completion)","lines":13,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-rdpeusb/src/client.rs#L394-L406"},{"ref":"crates/ironrdp-rdpeusb/src/client.rs:414-426","code":"  414 |         let (completion_iface, entry) = self.pending_completion(request_id, PendingKind::TransferOut)?;\n  415 |         let pending = *entry.get();\n  416 | \n  417 |         #[expect(\n  418 |             clippy::missing_panics_doc,\n  419 |             reason = \"panic is unreachable unless the pending transfer-key invariant is broken\"\n  420 |         )]\n  421 |         let req_id = RequestIdTransferInOut::try_from(request_id)\n  422 |             .expect(\"pending TransferOut request id must be a TS_URB request id\");\n  423 |         let completion = build_transfer_out_completion(pending, completion_iface, req_id, response)?;\n  424 |         entry.remove();\n  425 | \n  426 |         Ok(completion)","lines":13,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-rdpeusb/src/client.rs#L414-L426"}]},{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"very_easy","description":"In `ReqwestNetworkClient::send_tcp`, the KDC request is written with `stream.write(data)`, which performs a single write and may only send part of `data` (it returns the number of bytes written, which is ignored). A short write silently truncates the Kerberos/KDC request on the wire, causing authentication failures. The response side correctly uses `read_u32` + `read_exact`, so this is an asymmetry. Use `write_all`.","fix":"Replace the partial write with a full write. Before:\n```rust\n        stream\n            .write(data)\n            .await\n```\nAfter:\n```rust\n        stream\n            .write_all(data)\n            .await\n```\n(`write_all` returns `()` instead of a byte count, which is what the surrounding `map_err` chain already discards.)","locations":[{"ref":"crates/ironrdp-tokio/src/reqwest.rs:48-52","code":"   48 |         stream\n   49 |             .write(data)\n   50 |             .await\n   51 |             .map_err(|e| Error::new(ErrorKind::NoAuthenticatingAuthority, format!(\"{e:?}\")))\n   52 |             .map_err(|e| custom_err!(\"failed to send KDC request over TCP\", e))?;","lines":5,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-tokio/src/reqwest.rs#L48-L52"}]},{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`Framed<TS>.Write` acquires a `System.Threading.Mutex` with `_writeLock.WaitOne()`, `await`s `_stream.WriteAsync(memory)`, then calls `_writeLock.ReleaseMutex()` in the finally block. A `Mutex` has thread affinity: it must be released by the same thread that acquired it. Because the code has no `SynchronizationContext` (library/console), the continuation after the `await` typically resumes on a different thread-pool thread, so `ReleaseMutex()` throws `ApplicationException` (\"Object synchronization method was called from an unsynchronized block of code\"), breaking every write on the connection.","fix":"Use an async-friendly, thread-agnostic primitive. Replace `Mutex _writeLock = new()` with `SemaphoreSlim _writeLock = new(1, 1)` and use `await _writeLock.WaitAsync(); try { ... } finally { _writeLock.Release(); }`.","locations":[{"ref":"ffi/dotnet/Devolutions.IronRdp/src/Framed.cs:89-101","code":"   89 |     public async Task Write(byte[] data)\n   90 |     {\n   91 |         _writeLock.WaitOne();\n   92 |         try\n   93 |         {\n   94 |             ReadOnlyMemory<byte> memory = data;\n   95 |             await _stream.WriteAsync(memory);\n   96 |         }\n   97 |         finally\n   98 |         {\n   99 |             _writeLock.ReleaseMutex();\n  100 |         }\n  101 |     }","lines":13,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/ffi/dotnet/Devolutions.IronRdp/src/Framed.cs#L89-L101"}]},{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"easy","description":"In `NCrushContext::compress`, `hash_table_add` (which writes `self.match_table[offset]` for `offset` up to `history_offset + src_size - 8`) is called BEFORE the `hist_end > HISTORY_BUFFER_SIZE` overflow guard. If `history_offset + src_size - 8 > 65535`, the write to `match_table[offset]` indexes out of bounds and panics. This is unreachable through the public `BulkCompressor` API (input is capped to 16383 bytes and the window-slide logic keeps `history_offset ≤ ~65528`), but the bounds check is logically placed after the operation it should protect, leaving a latent OOB if this pub(crate) fn is ever driven with larger input.","fix":"Move the `hist_end`/overflow validation above the `hash_table_add` call so the buffer-size invariant is established before any table is populated, and/or add an explicit bound in `hash_table_add` clamping `end_offset` to `MATCH_TABLE_SIZE`.","locations":[{"ref":"crates/ironrdp-bulk/src/ncrush/mod.rs:1238","code":" 1238 |         self.hash_table_add(src_data, src_size, history_offset);","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-bulk/src/ncrush/mod.rs#L1238"},{"ref":"crates/ironrdp-bulk/src/ncrush/mod.rs:1241-1244","code":" 1241 |         let hist_end = history_offset + src_size;\n 1242 |         if hist_end > HISTORY_BUFFER_SIZE {\n 1243 |             return Err(BulkError::HistoryBufferOverflow);\n 1244 |         }","lines":4,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-bulk/src/ncrush/mod.rs#L1241-L1244"},{"ref":"crates/ironrdp-bulk/src/ncrush/mod.rs:710-725","code":"  710 |     pub(crate) fn hash_table_add(&mut self, src_data: &[u8], src_size: usize, history_offset: usize) {\n  711 |         if src_size < 8 {\n  712 |             return;\n  713 |         }\n  714 |         let end_offset = history_offset + src_size - 8;\n  715 |         let mut offset = history_offset;\n  716 |         let mut src_idx = 0usize;\n  717 | \n  718 |         while offset < end_offset {\n  719 |             let hash = usize::from(u16::from_le_bytes([src_data[src_idx], src_data[src_idx + 1]]));\n  720 |             let old_entry = self.hash_table[hash];\n  721 |             self.hash_table[hash] = offset as u16;\n  722 |             self.match_table[offset] = old_entry;\n  723 |             src_idx += 1;\n  724 |             offset += 1;\n  725 |         }","lines":16,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-bulk/src/ncrush/mod.rs#L710-L725"}]},{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"easy","description":"CacheImportOfferPdu, SurfaceToSurfacePdu and CacheToSurfacePdu decode a u16 count then `iter::repeat_with(...).take(count).collect()` without a preceding `ensure_size!` guard, unlike SolidFillPdu, CacheImportReplyPdu and CapabilitiesAdvertisePdu which do guard. Because Take over repeat_with reports an exact size_hint of `count`, the collect pre-reserves `count` elements (up to 65535) even when the packet has no remaining bytes. Per-element decode still enforces bounds so there is no OOB read or unbounded allocation, but a 2-byte count on a tiny packet forces up to ~1 MB reservation (CacheImportOffer, 16-byte CacheEntryMetadata), an inconsistent allocation-amplification.","fix":"Add an `ensure_size!(in: src, size: usize::from(count) * <element fixed size>)` before the collect (matching SolidFillPdu/CacheImportReplyPdu), so a bogus count on a short buffer fails fast before reserving.","locations":[{"ref":"crates/ironrdp-egfx/src/pdu/cmd.rs:1343-1345","code":" 1343 |         let cache_entries = iter::repeat_with(|| CacheEntryMetadata::decode(src))\n 1344 |             .take(usize::from(entries_count))\n 1345 |             .collect::<Result<Vec<_>, _>>()?;","lines":3,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-egfx/src/pdu/cmd.rs#L1343-L1345"},{"ref":"crates/ironrdp-egfx/src/pdu/cmd.rs:633-635","code":"  633 |         let destination_points = iter::repeat_with(|| Point::decode(src))\n  634 |             .take(usize::from(destination_points_count))\n  635 |             .collect::<Result<_, _>>()?;","lines":3,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-egfx/src/pdu/cmd.rs#L633-L635"},{"ref":"crates/ironrdp-egfx/src/pdu/cmd.rs:753-755","code":"  753 |         let destination_points = iter::repeat_with(|| Point::decode(src))\n  754 |             .take(usize::from(destination_points_count))\n  755 |             .collect::<Result<_, _>>()?;","lines":3,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-egfx/src/pdu/cmd.rs#L753-L755"}]},{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"very_easy","description":"Two redundant/dead bounds checks in the XCRUSH L1 decode path. Line 253 `if match_length > history_buffer_size` can never be true because `match_length` is read as a `u16` (max 65535, far below the 2,000,000 history buffer). Line 327 `literals_start + remaining > src_data.len()` is always false because `remaining` is defined as `src_data.len() - literals_start`. Neither is a correctness bug, but both are unreachable checks that obscure intent.","fix":"Remove the always-false `literals_start + remaining > src_data.len()` disjunct at line 327 and the dead `match_length > history_buffer_size` check at lines 253-257 (or convert the latter to a comment explaining the u16 bound).","locations":[{"ref":"crates/ironrdp-bulk/src/xcrush/mod.rs:253-257","code":"  253 |                 if match_length > history_buffer_size {\n  254 |                     return Err(BulkError::InvalidCompressedData(\n  255 |                         \"XCRUSH L1: match length exceeds history buffer\",\n  256 |                     ));\n  257 |                 }","lines":5,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-bulk/src/xcrush/mod.rs#L253-L257"},{"ref":"crates/ironrdp-bulk/src/xcrush/mod.rs:327","code":"  327 |             if history_ptr + remaining >= history_buffer_size || literals_start + remaining > src_data.len() {","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-bulk/src/xcrush/mod.rs#L327"}]},{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"easy","description":"In `sanitizePath`, the UNC-prefix branch tests `safe[0] === '.'`, but `.` (and `..`) are already removed by the preceding `filter((c) => c.length > 0 && c !== '.' && c !== '..')`, so the `'.'` arm can never be taken. The final result is still correct (the trailing drive-letter block handles `\\\\.\\C:\\...`), so this is harmless dead code rather than a sanitization gap.","fix":"Drop the unreachable `safe[0] === '.'` alternative (keep only the `'?'` check), or move the absolute-prefix stripping before the `.`/`..` filter if stripping `\\\\.\\` device prefixes explicitly is intended.","locations":[{"ref":"web-client/iron-remote-desktop-rdp/src/RdpFileTransferProvider.ts:1377","code":" 1377 |         if (safe.length > 0 && (safe[0] === '?' || safe[0] === '.')) {","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/web-client/iron-remote-desktop-rdp/src/RdpFileTransferProvider.ts#L1377"}]},{"id":"CMT_1","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"very_easy","description":"The per-addend annotations in `PktHdr::FIXED_PART_SIZE` are swapped relative to what is actually encoded. `ty` is written with `write_u16` (2 bytes) but annotated `4`, and `length` is written with `write_u32` (4 bytes) but annotated `2`. The total (8) is coincidentally correct, so behavior is unaffected, but the comment violates the STYLE.md convention of naming each addend by its real field size and misleads readers.","fix":"Swap the addend annotations to match the wire layout. Before:\n```rust\nconst FIXED_PART_SIZE: usize = 4 /* ty */ + 2 /* _reserved */ + 2 /* length */;\n```\nAfter:\n```rust\nconst FIXED_PART_SIZE: usize = 2 /* ty */ + 2 /* _reserved */ + 4 /* length */;\n```","locations":[{"ref":"crates/ironrdp-mstsgu/src/proto.rs:84","code":"   84 |     const FIXED_PART_SIZE: usize = 4 /* ty */ + 2 /* _reserved */ + 2 /* length */;","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-mstsgu/src/proto.rs#L84"}]},{"id":"OTHER_1","type":"other","type_label":"Other","severity":"medium","difficulty":"easy","description":"read_device allocates a buffer sized directly from the server-controlled DeviceReadRequest.length field before reading. read_inner does `vec![0; length]` where `length = usize::try_from(req_inner.length).unwrap()` and req_inner.length is a u32 taken straight off the wire with no upper bound. A malicious or buggy RDP server can request a read of up to ~4 GiB regardless of the actual file size, forcing a huge eager allocation on the client (memory-exhaustion / DoS). The allocation happens before any file read, so the file's real size does not limit it.","fix":"Clamp the requested length before allocating, e.g. cap it to a sane maximum (and/or to the remaining file size) and only grow the buffer to what is actually read. For example bound `length` with `let length = length.min(MAX_READ_LEN);` before `vec![0; length]`, or read incrementally with `Read::take(length as u64)` into a `Vec` so the allocation tracks bytes actually available.","locations":[{"ref":"crates/ironrdp-rdpdr-native/src/nix/backend.rs:137","code":"  137 |         |file, request| match read_inner(file, req_inner.offset, usize::try_from(req_inner.length).unwrap()) {","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-rdpdr-native/src/nix/backend.rs#L137"},{"ref":"crates/ironrdp-rdpdr-native/src/nix/backend.rs:155-163","code":"  155 |     fn read_inner(file: &mut std::fs::File, offset: u64, length: usize) -> std::io::Result<Vec<u8>> {\n  156 |         let sf = SeekFrom::Start(offset);\n  157 |         file.seek(sf)?;\n  158 |         let mut buf = vec![0; length];\n  159 | \n  160 |         let length = file.read(&mut buf)?;\n  161 |         buf.resize(length, 0u8);\n  162 |         Ok(buf)\n  163 |     }","lines":9,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-rdpdr-native/src/nix/backend.rs#L155-L163"}]},{"id":"OTHER_2","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"The `stub` TLS backend's `upgrade` returns `io::Result<(TlsStream<S>, Vec<u8>)>`, whereas the `rustls` and `native-tls` backends (which share the same re-exported public API `pub use impl_::{TlsStream, negotiated, upgrade}` in lib.rs) return `io::Result<(TlsStream<S>, x509_cert::Certificate)>`. Any downstream code that destructures the returned certificate and uses it (e.g. via `extract_tls_server_public_key`) will fail to compile when the crate is built with the `stub` feature, defeating stub as a drop-in backend. The stub should return the same `x509_cert::Certificate` type (returning `Err` as it already does).","fix":"Change the signature to match the other backends: `pub async fn upgrade<S>(stream: S, server_name: &str) -> io::Result<(TlsStream<S>, x509_cert::Certificate)>` and keep returning `Err(io::Error::other(\"no TLS backend enabled for this build\"))` (the never-constructed `Certificate` type only needs to appear in the signature, not be produced).","locations":[{"ref":"crates/ironrdp-tls/src/stub.rs:32-39","code":"   32 | pub async fn upgrade<S>(stream: S, server_name: &str) -> io::Result<(TlsStream<S>, Vec<u8>)>\n   33 | where\n   34 |     S: Unpin + AsyncRead + AsyncWrite,\n   35 | {\n   36 |     // Do nothing and fail\n   37 |     let _ = (stream, server_name);\n   38 |     Err(io::Error::other(\"no TLS backend enabled for this build\"))\n   39 | }","lines":8,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-tls/src/stub.rs#L32-L39"}]},{"id":"OTHER_3","type":"other","type_label":"Other","severity":"low","difficulty":"easy","description":"`send_tcp` reads a 4-byte big-endian length prefix from the (potentially MITM/proxy-controlled) KDC TCP stream and immediately allocates `vec![0; len + 4]` with no upper bound. A hostile length prefix up to 0xFFFFFFFF forces a ~4 GiB allocation before any data is read, a memory-exhaustion DoS on the network-facing CredSSP/KDC path.","fix":"Bound the declared length against a sane maximum (e.g. the ~48000-byte Windows token cap already used in `send_udp`, or a few MiB) and return `general_err!` when exceeded before allocating the buffer.","locations":[{"ref":"crates/ironrdp-tokio/src/reqwest.rs:60-63","code":"   60 |         let len = usize::try_from(len)\n   61 |             .map_err(|_| general_err!(\"invalid buffer length: out of range integral type conversion\"))?;\n   62 | \n   63 |         let mut buf = vec![0; len + 4];","lines":4,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-tokio/src/reqwest.rs#L60-L63"}]}]</script>

<div class="filterbar" id="filterbar"></div>

  <div id="progress-bar"><div id="progress-fill"></div></div>
  <span id="progress-text"></span>
  <button class="action-btn" data-action="collapse-all">⊟ Collapse all</button>
  <button class="action-btn" data-action="expand-all">⊞ Expand all</button>
  <button class="action-btn" data-action="download-md">&#11015; MD</button>
  <button class="action-btn" data-action="download-md-short">&#11015; MD Short</button>

</div>
