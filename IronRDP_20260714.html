<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e2e8f0;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#64748b;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#cbd5e1;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#94a3b8}
.project-info .pi-row .pi-k{color:#64748b}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#94a3b8;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#475569;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e2e8f0;border-color:#475569}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#64748b;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#94a3b8;border-color:#475569}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#475569;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#64748b;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#94a3b8;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e2e8f0}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#475569}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#94a3b8;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e2e8f0}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#cbd5e1}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#475569;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#64748b}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#64748b}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#64748b;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#64748b;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e2e8f0}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#cbd5e1;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#475569;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e2e8f0;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>

<script type="application/json" id="D">[{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"easy","description":"`SegmentedDataPdu::from_buffer` reads a per-segment `size` (u32) directly from the wire and calls `buffer.split_at(size)` without checking `size <= buffer.len()`. A malformed multipart ZGFX PDU declaring a segment larger than the remaining buffer panics (slice split out of bounds). The preceding `read_u32` only guards EOF of the length field, not the split.","fix":"Use a checked split and return an error on overflow, e.g. `let (segment_data, new_buffer) = buffer.split_at_checked(size).ok_or(ZgfxError::InvalidSegmentedDescriptor)?;` (or explicitly `if size > buffer.len() { return Err(...) }`) before slicing.","locations":[{"ref":"crates/ironrdp-graphics/src/zgfx/control_messages.rs:32-37","code":"   32 |                     let size = usize::try_from(buffer.read_u32::<LittleEndian>()?)\n   33 |                         .map_err(|_| ZgfxError::InvalidIntegralConversion(\"segment data size\"))?;\n   34 |                     let (segment_data, new_buffer) = buffer.split_at(size);\n   35 |                     buffer = new_buffer;\n   36 | \n   37 |                     segments.push(BulkEncodedData::from_buffer(segment_data)?);","lines":6,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-graphics/src/zgfx/control_messages.rs#L32-L37"}]},{"id":"PANIC_2","type":"panic","type_label":"Panic","severity":"high","difficulty":"very_easy","description":"In `Decompressor::decompress_segment`, the usable bit window is computed as `8 * (encoded_data.len() - 1) - usize::from(*encoded_data.last())`. The trailing byte (number of unused bits) is fully attacker-controlled (server-sent EGFX/ZGFX data). When that value exceeds `8 * (len-1)` the subtraction underflows: with a 1-byte compressed segment and any non-zero trailer, or any crafted trailer, this wraps to a huge usize and the subsequent `&bits[..N]` slice panics. A tiny crafted packet (descriptor 0xE0, flags 0x24, single data byte != 0x00) reaches it.","fix":"Validate the trailer before slicing. Replace\n```rust\nbits = &bits[..8 * (encoded_data.len() - 1) - usize::from(*encoded_data.last().expect(\"encoded_data is not empty\"))];\n```\nwith a checked computation:\n```rust\nlet unused = usize::from(*encoded_data.last().expect(\"encoded_data is not empty\"));\nlet total_bits = 8 * (encoded_data.len() - 1);\nlet end = total_bits.checked_sub(unused).ok_or(ZgfxError::InvalidSegmentedDescriptor)?;\nbits = &bits[..end];\n```","locations":[{"ref":"crates/ironrdp-graphics/src/zgfx/mod.rs:88-90","code":"   88 |         // The value of the last byte indicates the number of unused bits in the final byte\n   89 |         bits = &bits\n   90 |             [..8 * (encoded_data.len() - 1) - usize::from(*encoded_data.last().expect(\"encoded_data is not empty\"))];","lines":3,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-graphics/src/zgfx/mod.rs#L88-L90"}]},{"id":"PANIC_3","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"The ZGFX token decode loop trusts the bit stream to always contain enough bits. `bits[..token.prefix.len()]` (token search), `bits.split_to(8)` (null literal), `bits.split_to(distance_value_size)`, `read_unencoded_bytes`' `bits.split_to(15)` and `bits.split_to(length * 8)` (length up to 32767 -> up to ~262136 bits requested), and `read_encoded_bytes`' `bits.split_to(...)` / `2usize.pow(length_token_size + 1)` all index/split past the end of a truncated stream. `Bits::split_to` calls `BitSlice::split_at`, which panics when `at > len`; the `pow` can also overflow. All are reachable from server-controlled compressed graphics data.","fix":"Make the bit reader bounds-safe: have `Bits::split_to` (and a checked prefix comparison) return an error / `None` when fewer than `at` bits remain, and propagate that as `ZgfxError::TokenBitsNotFound` (or a new truncation error) instead of indexing/splitting unconditionally. Also guard `length * 8` and `2usize.pow(...)` against exceeding the remaining bit count.","locations":[{"ref":"crates/ironrdp-graphics/src/zgfx/mod.rs:97","code":"   97 |                 .find(|token| token.prefix == bits[..token.prefix.len()])","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-graphics/src/zgfx/mod.rs#L97"},{"ref":"crates/ironrdp-graphics/src/zgfx/mod.rs:105","code":"  105 |                     let value = bits.split_to(8).load_be::<u8>();","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-graphics/src/zgfx/mod.rs#L105"},{"ref":"crates/ironrdp-graphics/src/zgfx/mod.rs:174","code":"  174 |     let unencoded_bits = bits.split_to(length * 8);","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-graphics/src/zgfx/mod.rs#L174"},{"ref":"crates/ironrdp-graphics/src/zgfx/mod.rs:203-208","code":"  203 |         let length = bits.split_to(length_token_size + 1).load_be::<usize>();\n  204 | \n  205 |         let length_token_size = u32::try_from(length_token_size)\n  206 |             .map_err(|_| ZgfxError::InvalidIntegralConversion(\"length of the token size\"))?;\n  207 | \n  208 |         let base = 2usize.pow(length_token_size + 1);","lines":6,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-graphics/src/zgfx/mod.rs#L203-L208"},{"ref":"crates/ironrdp-graphics/src/utils.rs:20-25","code":"   20 |     pub(crate) fn split_to(&mut self, at: usize) -> &'a BitSlice<u8, Msb0> {\n   21 |         let (value, new_bits) = self.bits_slice.split_at(at);\n   22 |         self.bits_slice = new_bits;\n   23 |         self.remaining_bits_of_last_byte = (self.remaining_bits_of_last_byte + at) % 8;\n   24 |         value\n   25 |     }","lines":6,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-graphics/src/utils.rs#L20-L25"}]},{"id":"PANIC_4","type":"panic","type_label":"Panic","severity":"high","difficulty":"very_easy","description":"In `ClientCoreOptionalData::decode`, two trailing optional fields are read with the non-fallible `src.read_u32()` instead of the `try_read_u32()`/`try_or_return!` pattern used everywhere else in the same function. `read_u32()` performs `self.inner[self.pos..self.pos + 4]` slicing (via `read_array`), which panics on out-of-bounds. Because the enclosing block is scoped to an attacker-controlled slice length (the GCC UserDataHeader `blockLen`), a malicious client can send a Client Core Data block that ends immediately after `desktopPhysicalWidth` (0..3 bytes remaining) or after `desktopScaleFactor`, making the subsequent `read_u32()` index past the end and panic. This is a network-reachable server-side DoS. The preceding fields (`desktop_physical_width` at line 463, `desktop_scale_factor` at line 468) correctly use `try_read_u32`, so reaching these lines with insufficient bytes is trivial.","fix":"Use the fallible reads consistent with the rest of the function so truncated input returns the partially-parsed struct rather than panicking.\n\nBefore (line 464-465):\n```rust\n        // physical height must be present, if the physical width is present\n        optional_data.desktop_physical_height = Some(src.read_u32());\n```\nAfter:\n```rust\n        // physical height must be present, if the physical width is present\n        optional_data.desktop_physical_height = Some(try_or_return!(src.try_read_u32(), optional_data));\n```\n\nBefore (line 469-470):\n```rust\n        // device scale factor must be present, if the desktop scale factor is present\n        optional_data.device_scale_factor = Some(src.read_u32());\n```\nAfter:\n```rust\n        // device scale factor must be present, if the desktop scale factor is present\n        optional_data.device_scale_factor = Some(try_or_return!(src.try_read_u32(), optional_data));\n```","locations":[{"ref":"crates/ironrdp-pdu/src/gcc/core_data/client.rs:465","code":"  465 |         optional_data.desktop_physical_height = Some(src.read_u32());","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-pdu/src/gcc/core_data/client.rs#L465"},{"ref":"crates/ironrdp-pdu/src/gcc/core_data/client.rs:470","code":"  470 |         optional_data.device_scale_factor = Some(src.read_u32());","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-pdu/src/gcc/core_data/client.rs#L470"}]},{"id":"PANIC_5","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"The bitmap-apply routines derive the source row count from the length of the wire-supplied pixel buffer and never clamp it to the destination rectangle's height. `rect_fits` only checks that the rectangle lies inside the image; it does NOT check the source buffer against the rectangle. Each routine does `src.chunks_exact(rectangle_width * depth).rev().enumerate()` and writes `self.data[((top + row_idx) * image_width + left + col_idx) * 4 + ..]`. In `Processor::process_bitmap_update` the uncompressed path passes `update.bitmap_data` (a raw `&[u8]` whose length comes from the u16 `bitmapLength` field, independent of `rectangle`/`width`/`height`) straight into these functions. A server can send a small rectangle (e.g. 1x1 at the top-left) together with a bitmap buffer containing many more rows than the rectangle height; `row_idx` then exceeds the image height and `dst_idx` runs past `self.data`, causing an out-of-bounds write panic (client-side DoS). The same unbounded-row issue affects the padded-strip path (which builds `buf` from `chunks(padded_row_bytes)`) and `apply_rgb24_iter`.","fix":"Bound the number of source rows to the rectangle height. Compute `let rect_height = usize::from(update_rectangle.height());` after the `rect_fits` guard and add `.take(rect_height)` to each `chunks_exact(...).rev().enumerate()` chain (before `.enumerate()`, or `.rev().take(rect_height)` — order it so the bottom-up geometry is preserved). Equivalently, up front reject buffers whose row count `src.len() / (rectangle_width * depth)` exceeds `rect_height`. Apply the same clamp in the padded-strip loop in `process_bitmap_update` and in `apply_rgb24_iter`/`apply_rgba32_iter`.","locations":[{"ref":"crates/ironrdp-session/src/image.rs:575-596","code":"  575 |         rgb16\n  576 |             .chunks_exact(rectangle_width * SRC_COLOR_DEPTH)\n  577 |             .rev()\n  578 |             .enumerate()\n  579 |             .for_each(|(row_idx, row)| {\n  580 |                 row.chunks_exact(SRC_COLOR_DEPTH)\n  581 |                     .enumerate()\n  582 |                     .for_each(|(col_idx, src_pixel)| {\n  583 |                         let rgb16_value = u16::from_le_bytes(\n  584 |                             src_pixel\n  585 |                                 .try_into()\n  586 |                                 .expect(\"src_pixel contains exactly two u8 elements\"),\n  587 |                         );\n  588 |                         let dst_idx = ((top + row_idx) * image_width + left + col_idx) * DST_COLOR_DEPTH;\n  589 | \n  590 |                         let [r, g, b] = rdp_16bit_to_rgb(rgb16_value);\n  591 |                         self.data[dst_idx + ri] = r;\n  592 |                         self.data[dst_idx + gi] = g;\n  593 |                         self.data[dst_idx + bi] = b;\n  594 |                         self.data[dst_idx + ai] = 0xff;\n  595 |                     })\n  596 |             });","lines":22,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-session/src/image.rs#L575-L596"},{"ref":"crates/ironrdp-sess })).collect()\n}\n```\nand propagate the error from `process_frame` (the `.zip(map_tiles_data(...))` call). Alternatively validate all tile indices right after `TileSetPdu::decode`.","locations":[{"ref":"crates/ironrdp-session/src/rfx.rs:269-281","code":"  269 | fn map_tiles_data<'a>(tiles: &[Tile<'a>], quants: &[Quant]) -> Vec<TileData<'a>> {\n  270 |     tiles\n  271 |         .iter()\n  272 |         .map(|t| TileData {\n  273 |             quants: [\n  274 |                 quants[usize::from(t.y_quant_index)].clone(),\n  275 |                 quants[usize::from(t.cb_quant_index)].clone(),\n  276 |                 quants[usize::from(t.cr_quant_index)].clone(),\n  277 |             ],\n  278 |             data: [t.y_data, t.cb_data, t.cr_data],\n  279 |         })\n  280 |         .collect()\n  281 | }","lines":13,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-session/src/rfx.rs#L269-L281"}]},{"id":"PANIC_7","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"`std::io::Read for ReadCursor::read` copies with `buf.copy_from_slice(to_copy)` where `to_copy` has length `n_to_copy = min(buf.len(), self.len())`. When the cursor has fewer remaining bytes than the destination buffer (`self.len() < buf.len()`), `to_copy.len() < buf.len()`, and `copy_from_slice` panics on the length mismatch instead of performing a valid short read. This violates the `io::Read` contract and panics on ordinary input (e.g. any `read_to_end`/`BufReader`/generic reader that offers a larger buffer than the bytes remaining).","fix":"Copy into only the filled prefix of the destination. Before:\n```rust\nfn read(&mut self, buf: &mut [u8]) -> std::io::Result<usize> {\n    let n_to_copy = core::cmp::min(buf.len(), self.len());\n    let to_copy = self.read_slice(n_to_copy);\n    buf.copy_from_slice(to_copy);\n    Ok(n_to_copy)\n}\n```\nAfter:\n```rust\nfn read(&mut self, buf: &mut [u8]) -> std::io::Result<usize> {\n    let n_to_copy = core::cmp::min(buf.len(), self.len());\n    let to_copy = self.read_slice(n_to_copy);\n    buf[..n_to_copy].copy_from_slice(to_copy);\n    Ok(n_to_copy)\n}\n```","locations":[{"ref":"crates/ironrdp-core/src/cursor.rs:506-511","code":"  506 |     fn read(&mut self, buf: &mut [u8]) -> std::io::Result<usize> {\n  507 |         let n_to_copy = core::cmp::min(buf.len(), self.len());\n  508 |         let to_copy = self.read_slice(n_to_copy);\n  509 |         buf.copy_from_slice(to_copy);\n  510 |         Ok(n_to_copy)\n  511 |     }","lines":6,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-core/src/cursor.rs#L506-L511"}]},{"id":"PANIC_8","type":"panic","type_label":"Panic","severity":"medium","difficulty":"very_easy","description":"In the gateway read path, `header_length` comes from the wire (`PktHdr.length`, a u32) and `hdr.size()` is the fixed 8-byte header. Both `assert!(cur.len() >= header_length - hdr.size())` (worker loop) and `if cur.len() != header_length - hdr.size()` (read_packet) subtract without checking `header_length >= hdr.size()`. A malicious/broken gateway sending `length < 8` triggers an integer-underflow panic; the `assert!` additionally panics (DoS) on any well-formed-but-short frame rather than returning an error.","fix":"Compute the body length with `checked_sub` and turn failures into `GwErrorKind::Decode`/`PacketEof` errors instead of asserting/subtracting, e.g. `let body_len = header_length.checked_sub(hdr.size()).ok_or_else(|| Error::new(\"PktHdr too small\", GwErrorKind::Decode))?;` then compare `cur.len()` to `body_len`; replace the `assert!` with the same error return.","locations":[{"ref":"crates/ironrdp-mstsgu/src/lib.rs:225-226","code":"  225 |                         let header_length = usize::try_from(hdr.length).map_err(|_| Error::new(\"PktHdr too big\", GwErrorKind::Decode))?;\n  226 |                         assert!(cur.len() >= header_length - hdr.size());","lines":2,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-mstsgu/src/lib.rs#L225-L226"},{"ref":"crates/ironrdp-mstsgu/src/lib.rs:293-297","code":"  293 |         let header_length =\n  294 |             usize::try_from(hdr.length).map_err(|_| Error::new(\"PktHdr too big\", GwErrorKind::Decode))?;\n  295 |         if cur.len() != header_length - hdr.size() {\n  296 |             return Err(Error::new(\"read_packet\", GwErrorKind::PacketEof));\n  297 |         }","lines":5,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-mstsgu/src/lib.rs#L293-L297"}]},{"id":"PANIC_9","type":"panic","type_label":"Panic","severity":"medium","difficulty":"easy","description":"query_volume_information converts filesystem statistics from statvfs (u64 counts) into u32 with `u32::try_from(...).unwrap()`. volume_serial_number is derived from `statvfs.blocks_available()`, which routinely exceeds u32::MAX on large volumes (e.g. a ~20 TB filesystem with 4 KiB blocks has >5 billion available blocks). When a redirected drive backed by such a filesystem receives a FileFsVolumeInformation query from the server, the `.unwrap()` panics and crashes the client. The trigger (the volume-information query) is server-controlled; the overflow condition is a normal large local drive.","fix":"Avoid `.unwrap()` on these conversions. Use a saturating/truncating cast for the serial number (e.g. `statvfs.blocks_available() as u32` after masking, or `u32::try_from(x).unwrap_or(u32::MAX)`), and for the alloc-unit counts return an UNSUCCESSFUL response instead of panicking when the value does not fit.","locations":[{"ref":"crates/ironrdp-rdpdr-native/src/nix/backend.rs:321","code":"  321 |                                         volume_serial_number: u32::try_from(statvfs.blocks_available()).unwrap(),","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-rdpdr-native/src/nix/backend.rs#L321"},{"ref":"crates/ironrdp-rdpdr-native/src/nix/backend.rs:272-275","code":"  272 |                         total_alloc_units: i64::try_from(statvfs.blocks()).unwrap(),\n  273 |                         caller_available_alloc_units: i64::try_from(statvfs.blocks_available()).unwrap(),\n  274 |                         actual_available_alloc_units: i64::try_from(statvfs.blocks_available()).unwrap(),\n  275 |                         sectors_per_alloc_unit: u32::try_from(statvfs.fragment_size()).unwrap(),","lines":4,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-rdpdr-native/src/nix/backend.rs#L272-L275"},{"ref":"crates/ironrdp-rdpdr-native/src/nix/backend.rs:337-339","code":"  337 |                                         total_alloc_units: i64::try_from(statvfs.blocks()).unwrap(),\n  338 |                                         available_alloc_units: i64::try_from(statvfs.blocks_free()).unwrap(),\n  339 |                                         sectors_per_alloc_unit: u32::try_from(statvfs.fragment_size()).unwrap(),","lines":3,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-rdpdr-native/src/nix/backend.rs#L337-L339"}]},{"id":"PANIC_10","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"In `find_match_length`, the quick-reject heuristic indexes `buf[chunk_offset + max_match_length + 1]` guarded only by `match_offset + max_match_length + 1 < buf_end`. When the caller (`find_all_matches`) enters via the `chunk_offset > src_size + history_offset` sub-condition (a stale chunk-table entry pointing past the current block), `chunk_offset` can be larger than `match_offset` and as high as ~2,000,000 (a leftover offset from before the 2 MB history wrapped in `compress_l1`). `chunk_offset` is only rejected when strictly greater than `history_buffer_size` (line 789, uses `>`), so `chunk_offset == history_buffer_size - k` is allowed, and `chunk_offset + max_match_length + 1` can equal or exceed `buf.len()` (2,000,000), causing an out-of-bounds slice index panic. The 8-byte fast-path loop (`fc + 8 < buf.len()`) is safe, but the single-byte quick-reject read is not bounded on the chunk side. Only reachable in the XCRUSH compression (outbound) path after the 2 MB history fills and wraps, so it is not attacker-controlled, and XCRUSH (RDP6.1) is not the default bulk codec.","fix":"Bound the chunk side of the quick-reject before indexing, e.g. require both sides in-range:\n```rust\nif match_offset + max_match_length + 1 < buf_end\n    && chunk_offset + max_match_length + 1 < buf.len()\n    && buf[match_offset + max_match_length + 1] != buf[chunk_offset + max_match_length + 1]\n{\n    return Ok(None);\n}\n```\nAlternatively reject `chunk_offset >= history_buffer_size` (use `>=` at line 789) and ensure `chunk_offset` cannot exceed `buf_end` when passed in.","locations":[{"ref":"crates/ironrdp-bulk/src/xcrush/mod.rs:800-805","code":"  800 |         // Quick-reject heuristic: if byte at max_match_length+1 doesn't match, skip\n  801 |         if match_offset + max_match_length + 1 < buf_end\n  802 |             && buf[match_offset + max_match_length + 1] != buf[chunk_offset + max_match_length + 1]\n  803 |         {\n  804 |             return Ok(None);\n  805 |         }","lines":6,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-bulk/src/xcrush/mod.rs#L800-L805"},{"ref":"crates/ironrdp-bulk/src/xcrush/mod.rs:924-934","code":"  924 |                         if chunk_offset < history_offset\n  925 |                             || chunk_offset < offset as usize\n  926 |                             || chunk_offset > src_size + history_offset\n  927 |                         {\n  928 |                             let result = self.find_match_length(\n  929 |                                 offset as usize,\n  930 |                                 chunk_offset,\n  931 |                                 history_offset,\n  932 |                                 src_size,\n  933 |                                 max_match_length,\n  934 |                             )?;","lines":11,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-bulk/src/xcrush/mod.rs#L924-L934"}]},{"id":"PANIC_11","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`handle_input_events` calls `receiver.recv().unwrap()` and `input_pdu.to_buffer(&mut data).unwrap()`. When the GUI event sender is dropped (window closed / event loop exits) `recv()` returns `Err` and the task panics instead of terminating cleanly; a serialization failure in `to_buffer` likewise aborts. This is in `ironrdp-client-glutin`, which is excluded from the workspace and does not compile, so impact is dev-only.","fix":"Break out of the loop on `recv()` error (`let Ok(event) = receiver.recv() else { break; }`) and propagate/log the `to_buffer` error instead of `unwrap()`.","locations":[{"ref":"crates/ironrdp-client-glutin/src/gui/input.rs:18","code":"   18 |         let event = receiver.recv().unwrap();","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-client-glutin/src/gui/input.rs#L18"},{"ref":"crates/ironrdp-client-glutin/src/gui/input.rs:25","code":"   25 |         input_pdu.to_buffer(&mut data).unwrap();","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-client-glutin/src/gui/input.rs#L25"}]},{"id":"PANIC_12","type":"panic","type_label":"Panic","severity":"low","difficulty":"very_easy","description":"`ClipboardPalette::encode` writes `entries.len()*4` bytes via `write_u8` without a bounds guard, unlike every other `Encode` impl in the crate (e.g. `PackedMetafile::encode` uses `ensure_size!`). `WriteCursor::write_u8`/`write_array` index the backing slice directly and panic on overflow. Internal callers presize the buffer via `size()`, so it is safe today, but the public `Encode` impl will panic (rather than return an `EncodeError`) if a caller encodes into an undersized buffer, breaking the defensive convention used elsewhere.","fix":"Add `ensure_size!(in: dst, size: self.size());` at the start of `ClipboardPalette::encode`, matching the pattern used by `PackedMetafile::encode` and the other PDU encoders.\n\nBefore:\n```rust\nfn encode(&self, dst: &mut WriteCursor<'_>) -> EncodeResult<()> {\n    for entry in &self.entries {\n```\nAfter:\n```rust\nfn encode(&self, dst: &mut WriteCursor<'_>) -> EncodeResult<()> {\n    ensure_size!(in: dst, size: self.size());\n    for entry in &self.entries {\n```\n(and import `ensure_size` from `ironrdp_core`).","locations":[{"ref":"crates/ironrdp-cliprdr/src/pdu/format_data/palette.rs:31-41","code":"   31 | impl Encode for ClipboardPalette {\n   32 |     fn encode(&self, dst: &mut WriteCursor<'_>) -> EncodeResult<()> {\n   33 |         for entry in &self.entries {\n   34 |             dst.write_u8(entry.red);\n   35 |             dst.write_u8(entry.green);\n   36 |             dst.write_u8(entry.blue);\n   37 |             dst.write_u8(entry.extra);\n   38 |         }\n   39 | \n   40 |         Ok(())\n   41 |     }","lines":11,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-cliprdr/src/pdu/format_data/palette.rs#L31-L41"}]},{"id":"PANIC_13","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`QuantQuality::encode` packs `quantization_parameter` via `data.set_bits(0..6, self.quantization_parameter)`. `bit_field::set_bits` panics if the value has any 1-bits outside the 6-bit range, i.e. when `quantization_parameter >= 64`. The field is a public `u8` (documented range 0-51 but not enforced), reachable ":[{"ref":"crates/ironrdp-egfx/src/pdu/cmd.rs:991-994","code":"  991 |         timestamp.set_bits(..10, u32::from(self.milliseconds));\n  992 |         timestamp.set_bits(10..16, u32::from(self.seconds));\n  993 |         timestamp.set_bits(16..22, u32::from(self.minutes));\n  994 |         timestamp.set_bits(22.., u32::from(self.hours));","lines":4,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-egfx/src/pdu/cmd.rs#L991-L994"}]},{"id":"PANIC_15","type":"panic","type_label":"Panic","severity":"low","difficulty":"medium","description":"DrawingTextures::bind slices the decoded YUV buffer as data[0..luma], data[luma..luma+chroma], data[luma+chroma..] where luma = stride_0 * height and chroma = stride_1 * height/2. If the decoded H.264 buffer is smaller than luma+chroma (e.g. a decoder returning fewer bytes than the surface strides imply), these slice operations panic with out-of-bounds. Excluded, non-compiling crate, so low severity.","fix":"Validate `data.len() >= luma + chroma` and return an error (or clamp) before slicing, rather than relying on the decoder output matching the expected stride layout.","locations":[{"ref":"crates/ironrdp-glutin-renderer/src/draw.rs:98-107","code":"   98 |     pub unsafe fn bind(&self, gl: &Context, data: &[u8], stride_0: usize, stride_1: usize) {\n   99 |         let luma = stride_0 * self.height as usize;\n  100 |         let chroma = stride_1 * (self.height as usize / 2);\n  101 |         let y_pixels = &data[0..luma];\n  102 |         let u_pixels = &data[luma..luma + chroma];\n  103 |         let v_pixels = &data[luma + chroma..];\n  104 | \n  105 |         self.y.bind_texture(gl, y_pixels, stride_0 as i32);\n  106 |         self.u.bind_texture(gl, u_pixels, stride_1 as i32);\n  107 |         self.v.bind_texture(gl, v_pixels, stride_1 as i32);","lines":10,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-glutin-renderer/src/draw.rs#L98-L107"}]},{"id":"PANIC_16","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"In draw_cached, when no explicit location is set the fallback rectangle uses `right: self.width - 1` and `bottom: self.height - 1`. width/height originate from a server-controlled CreateSurfacePdu (u16). A width or height of 0 causes an unsigned underflow (panic in debug, wrap to 65535 in release). This crate is excluded from the workspace and does not compile, so severity is low.","fix":"Use `self.width.saturating_sub(1)` and `self.height.saturating_sub(1)`, or reject/guard zero-sized surfaces at creation time.","locations":[{"ref":"crates/ironrdp-glutin-renderer/src/surface.rs:256-259","code":"  256 |                     right: self.width - 1,\n  257 |                     bottom: self.height - 1,\n  258 |                 }\n  259 |             };","lines":4,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-glutin-renderer/src/surface.rs#L256-L259"}]},{"id":"PANIC_17","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`Rc4::process` sizes the output with `Vec::with_capacity(message.len())` and then loops `while output.capacity() > output.len()`, indexing `message[output.len()]` each iteration. `Vec::with_capacity` only guarantees capacity is at least the requested amount and is explicitly documented as allowed to allocate more. If the allocator ever returns excess capacity, the loop runs past `message.len()` and `message[idx_msg]` panics with an out-of-bounds index. The code relies on unspecified allocator behavior for correctness. (Separately, `Rc4::new` computes `key[i % key.len()]`, which panics with a divide-by-zero on an empty key.)","fix":"Iterate over the actual message length rather than the vector capacity, e.g. iterate `for &b in message { ... output.push(k ^ b) }`, so the loop bound is `message.len()` and never depends on `Vec::capacity()`. Guard `Rc4::new` against an empty key.","locations":[{"ref":"crates/ironrdp-pdu/src/crypto/rc4.rs:28-37","code":"   28 |         let mut output = Vec::with_capacity(message.len());\n   29 |         while output.capacity() > output.len() {\n   30 |             self.i = (self.i + 1) % 256;\n   31 |             self.j = (self.j + usize::from(self.state[self.i])) % 256;\n   32 |             self.state.swap(self.i, self.j);\n   33 |             let idx_k = (usize::from(self.state[self.i]) + usize::from(self.state[self.j])) % 256;\n   34 |             let k = self.state[idx_k];\n   35 |             let idx_msg = output.len();\n   36 |             output.push(k ^ message[idx_msg]);\n   37 |         }","lines":10,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-pdu/src/crypto/rc4.rs#L28-L37"},{"ref":"crates/ironrdp-pdu/src/crypto/rc4.rs:19","code":"   19 |             j = (j + usize::from(state[i]) + usize::from(key[i % key.len()])) % 256;","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-pdu/src/crypto/rc4.rs#L19"}]},{"id":"PANIC_18","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"RsaPublicKey::encode computes `let bitlen = (keylen - RSA_KEY_PADDING_LENGTH) * 8;` and `let datalen = bitlen / 8 - 1;` where keylen = modulus.len() as u32. If modulus.len() < 8 (or == 8), the subtraction underflows (panic in debug / wrap in release) and datalen underflows when bitlen == 0. This is not reachable via the decode path (RsaPublicKey::decode enforces keylen == bitlen/8 + 8 with bitlen >= 8), but the struct derives arbitrary::Arbitrary and can be constructed with a short modulus, so encode of an attacker/fuzzer-constructed key panics.","fix":"Guard against undersized moduli before the arithmetic, e.g. return `invalid_field_err!(\"modulusLen\", \"modulus too small\")` when `self.modulus.len() < RSA_KEY_PADDING_LENGTH as usize + 1`, or use `checked_sub`/`checked_mul` and propagate an encode error instead of relying on unchecked arithmetic.","locations":[{"ref":"crates/ironrdp-pdu/src/rdp/server_license/server_license_request/cert.rs:193-195","code":"  193 |         let keylen = cast_length!(\"modulusLen\", self.modulus.len())?;\n  194 |         let bitlen = (keylen - RSA_KEY_PADDING_LENGTH) * 8;\n  195 |         let datalen = bitlen / 8 - 1;","lines":3,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-pdu/src/rdp/server_license/server_license_request/cert.rs#L193-L195"}]},{"id":"PANIC_19","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`WavePdu::encode` slices `self.data[0..4]` (and `self.data[4..]`) unconditionally. If the wave payload is shorter than 4 bytes the slice panics. This path is reachable: `RdpsndServer::wave` emits a `WavePdu` (rather than `Wave2Pdu`) whenever the negotiated version is < V8, and the negotiated version comes from the client's `ClientAudioFormatPdu`, so a client can downgrade the version; if the server application then streams a wave chunk shorter than 4 bytes the server panics during encoding.","fix":"Guard the length before slicing: if `self.data.len() < 4` return an encode error (e.g. `invalid_field_err!`/`other_err!`) instead of indexing. `data[0..4].try_into()` should only run once `data.len() >= 4` is established.","locations":[{"ref":"crates/ironrdp-rdpsnd/src/pdu/mod.rs:817-833","code":"  817 | impl Encode for WavePdu<'_> {\n  818 |     fn encode(&self, dst: &mut WriteCursor<'_>) -> EncodeResult<()> {\n  819 |         let info = WaveInfoPdu {\n  820 |             timestamp: self.timestamp,\n  821 |             format_no: self.format_no,\n  822 |             block_no: self.block_no,\n  823 |             data: self.data[0..4]\n  824 |                 .try_into()\n  825 |                 .map_err(|e| other_err!(\"invalid data\", source: e))?,\n  826 |         };\n  827 |         let wave = SndWavePdu {\n  828 |             data: self.data[4..].into(),\n  829 |         };\n  830 |         info.encode(dst)?;\n  831 |         wave.encode(dst)?;\n  832 |         Ok(())\n  833 |     }","lines":17,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-rdpsnd/src/pdu/mod.rs#L817-L833"}]},{"id":"PANIC_20","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`WriteBuf::read_into_buf` does `buf.copy_from_slice(&self.0[..buf.len()])`. `WriteBuf`'s `Index<RangeTo>` slices into `filled()` (crates/ironrdp-core/src/write_buf.rs:227-233), so if the caller-provided `buf` is longer than the currently filled bytes, the `self.0[..buf.len()]` index panics at the FFI boundary. Current C# callers size the buffer to `written.GetSize()` so it happens to match, but the API has no guard against a larger buffer.","fix":"Validate the length and copy only what is available, e.g. `let filled = self.0.filled(); if buf.len() > filled.len() { return Err(\"buffer larger than filled data\".into()); } buf.copy_from_slice(&filled[..buf.len()]);`","locations":[{"ref":"ffi/src/pdu.rs:21-24","code":"   21 |         pub fn read_into_buf(&mut self, buf: &mut [u8]) -> Result<(), Box<IronRdpError>> {\n   22 |             buf.copy_from_slice(&self.0[..buf.len()]);\n   23 |             Ok(())\n   24 |         }","lines":4,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/ffi/src/pdu.rs#L21-L24"}]},{"id":"PANIC_21","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`VecU8::fill`, `BytesSlice::fill` and `U32Slice::fill` guard only against a buffer that is too small (`if buffer.len() < self.0.len() { return Err }`) but then call `buffer.copy_from_slice(&self.0)`, which requires the destination and source to have equal length. If a caller passes a buffer strictly larger than the data (which the guard explicitly permits), `copy_from_slice` panics across the FFI boundary. The guard's message (\"buffer is too small\") shows larger buffers were intended to be acceptable.","fix":"Copy only the prefix: e.g. `buffer[..self.0.len()].copy_from_slice(&self.0);` (and the equivalent for `BytesSlice`/`U32Slice`), so an oversized buffer is filled without panicking.","locations":[{"ref":"ffi/src/utils/mod.rs:18-24","code":"   18 |         pub fn fill(&self, buffer: &mut [u8]) -> Result<(), Box<IronRdpError>> {\n   19 |             if buffer.len() < self.0.len() {\n   20 |                 return Err(\"buffer is too small\".into());\n   21 |             }\n   22 |             buffer.copy_from_slice(&self.0);\n   23 |             Ok(())\n   24 |         }","lines":7,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/ffi/src/utils/mod.rs#L18-L24"},{"ref":"ffi/src/utils/mod.rs:39-45","code":"   39 |         pub fn fill(&'a self, buffer: &'a mut [u8]) -> Result<(), Box<IronRdpError>> {\n   40 |             if buffer.len() < self.0.len() {\n   41 |                 return Err(\"buffer is too small\".into());\n   42 |             }\n   43 |             buffer.copy_from_slice(self.0);\n   44 |             Ok(())\n   45 |         }","lines":7,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/ffi/src/utils/mod.rs#L39-L45"},{"ref":"ffi/src/utils/mod.rs:56-62","code":"   56 |         pub fn fill(&'a self, buffer: &'a mut [u32]) -> Result<(), Box<IronRdpError>> {\n   57 |             if buffer.len() < self.0.len() {\n   58 |                 return Err(\"buffer is too small\".into());\n   59 |             }\n   60 |             buffer.copy_from_slice(self.0);\n   61 |             Ok(())\n   62 |         }","lines":7,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/ffi/src/utils/mod.rs#L56-L62"}]},{"id":"PANIC_22","type":"panic","type_label":"Panic","severity":"low","difficulty":"easy","description":"`scanCode` indexes `KeyCodeToScanCode[engine]` where `engine` is derived from the UA parser and cast to `EngineName`. If the browser engine is not gecko/blink/webkit (or `parsedUA.engine.name` is undefined), `map` is `undefined` and `map[code]` throws a TypeError. `scanCode` is called on every keydown/keyup in `sendKeyboard`, so keyboard input throws uncaught on any unrecognized engine. All major browsers are covered, hence low severity.","fix":"Guard the lookup: fall back to a default engine map (e.g. `blink`) when `engine` is not a known key, or return `NaN` when `map` is undefined so the existing `Number.isNaN` guards in `sendKeyboard` handle it: `const map = KeyCodeToScanCode[engine] ?? KeyCodeToScanCode.blink;`.","locations":[{"ref":"web-client/iron-remote-desktop/src/lib/scancodes.ts:214-217","code":"  214 | export const scanCode = function (code: string): number {\n  215 |     const map = KeyCodeToScanCode[engine];\n  216 |     return parseInt(map[code], 16);\n  217 | };","lines":4,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/web-client/iron-remote-desktop/src/lib/scancodes.ts#L214-L217"},{"ref":"web-client/iron-remote-desktop/src/lib/scancodes.ts:13","code":"   13 | const engine = parsedUA.engine.name?.toLowerCase() as EngineName;","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/web-client/iron-remote-desktop/src/lib/scancodes.ts#L13"}]},{"id":"PANIC_23","type":"panic","type_label":"Panic","severity":"negligible","difficulty":"very_easy","description":"`ScardAccessStartedEventCall::decode` calls `read_padding!(src, 4)` with no preceding `ensure_size!`/`ensure_fixed_part_size!`, unlike every other decoder in these modules. `read_padding` -> `ReadCursor::advance` only does `self.pos += len` with no bounds check, so on a truncated SCARD_IOCTL_ACCESSSTARTEDEVENT payload (0-3 bytes) the cursor position is pushed past the end of the buffer. No read follows inside this function, so it does not panic here, but the returned cursor is left with `pos > inner.len()`; if the caller subsequently calls `ReadCursor::len()` (which computes `self.inner.len() - self.pos`) it underflows -> subtract-overflow panic in debug builds / wildly wrong length in release. This is server-controlled input.","fix":"Guard the padding read like the other decoders, e.g.:\n```rust\npub fn decode(src: &mut ReadCursor<'_>) -> DecodeResult<Self> {\n    ensure_size!(in: src, size: 4);\n    ironrdp_pdu::read_padding!(src, 4);\n    Ok(Self)\n}\n```","locations":[{"ref":"crates/ironrdp-rdpdr/src/pdu/esc/mod.rs:389-393","code":"  389 | impl ScardAccessStartedEventCall {\n  390 |     pub fn decode(src: &mut ReadCursor<'_>) -> DecodeResult<Self> {\n  391 |         ironrdp_pdu::read_padding!(src, 4); // Unused (4 bytes)\n  392 |         Ok(Self)\n  393 |     }","lines":5,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-rdpdr/src/pdu/esc/mod.rs#L389-L393"}]},{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"`FixedCircularBuffer::read_with_offset` computes `position = (self.buffer.len() + self.position - offset) % self.buffer.len()`. `offset` is the ZGFX match distance (`distance_base + extra bits`, up to ~34M) which can far exceed `HISTORY_SIZE` (2.5M). When `offset > buffer.len() + position` the subtraction underflows: debug builds panic on the overflow; release builds wrap and the modulo yields an arbitrary in-range position, silently reading the wrong history bytes. `read_encoded_bytes` passes `distance` straight through without validating it against the history size.","fix":"Reject out-of-range distances before reading, e.g. in `read_encoded_bytes`/`handle_match` return an error when `distance > history.len()` (or the configured window), and/or make `read_with_offset` return an `io::Error` when `offset` exceeds `buffer.len()` instead of relying on wrapping arithmetic.","locations":[{"ref":"crates/ironrdp-graphics/src/zgfx/circular_buffer.rs:17-18","code":"   17 |     pub(crate) fn read_with_offset(&self, offset: usize, length: usize, output: &mut impl io::Write) -> io::Result<()> {\n   18 |         let position = (self.buffer.len() + self.position - offset) % self.buffer.len();","lines":2,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-graphics/src/zgfx/circular_buffer.rs#L17-L18"},{"ref":"crates/ironrdp-graphics/src/zgfx/mod.rs:214","code":"  214 |     history.read_with_offset(distance, length, output)?;","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-graphics/src/zgfx/mod.rs#L214"}]},{"id":"OVF_2","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"medium","difficulty":"easy","description":"In `FastPathInputHeader::decode`, `data_length` is computed as `usize::from(length) - sizeof_length - 1 - num_events_length`, where `length` comes directly from the PER-encoded wire field (`per::read_length`). There is no check that `length >= sizeof_length + 1 + num_events_length`. A crafted fast-path input header with a small `length` (e.g. 0 or 1) underflows this subtraction. The crate sets `#![allow(clippy::arithmetic_side_effects)]`, so in debug builds this panics ('attempt to subtract with overflow'), and in release builds it wraps to a huge `usize` stored in the public `data_length` field. This is reachable server-side from untrusted fast-path input.","fix":"Validate before subtracting and return a decode error on inconsistency, e.g.:\n```rust\nlet overhead = sizeof_length + 1 + num_events_length;\nlet data_length = usize::from(length)\n    .checked_sub(overhead)\n    .ok_or_else(|| invalid_field_err!(\"len\", \"fast-path length smaller than header overhead\"))?;\n```","locations":[{"ref":"crates/ironrdp-pdu/src/input/fast_path.rs:80","code":"   80 |         let data_length = usize::from(length) - sizeof_length - 1 - num_events_length;","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-pdu/src/input/fast_path.rs#L80"}]},{"id":"OVF_3","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"map_surface_to_scaled_output stores server-provided u32 output origins and target dimensions into an InclusiveRectangle whose fields are u16 via `as u16`, silently truncating values above 65535 (e.g. output_origin_x = 0x1_0000 becomes 0). Excluded, non-compiling crate, so low severity.","fix":"Use `u16::try_from(...)` and propagate an error (or saturate) instead of a lossy `as u16` cast.","locations":[{"ref":"crates/ironrdp-glutin-renderer/src/surface.rs:321-326","code":"  321 |         surface.set_location(InclusiveRectangle {\n  322 |             left: pdu.output_origin_x as u16,\n  323 |             top: pdu.output_origin_y as u16,\n  324 |             right: pdu.target_width as u16,\n  325 |             bottom: pdu.target_height as u16,\n  326 |         });","lines":6,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-glutin-renderer/src/surface.rs#L321-L326"}]},{"id":"OVF_4","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"medium","description":"Wire-derived byte-count additions are performed with unchecked `+` on `usize` values that originate from a `u32` length field, before the `ensure_size!` guard. On 64-bit targets this is harmless (the sum is a valid large number and `ensure_size!` rejects it), but on 32-bit targets (e.g. the wasm32 web-client build, where `usize` is 32-bit) a length near `u32::MAX` wraps to a tiny value, `ensure_size!` then succeeds, and the subsequent `read_slice(data_length)` / `read_slice(length_xor_mask)` indexes out of bounds and panics on attacker-controlled input. Note that `CompositePayload::decode` in the same crate uses `checked_add` for exactly this reason.","fix":"Use `checked_add` and map the `None` case to an `invalid_field_err!`, mirroring `CompositePayload::decode`. E.g. in `ExtendedBitmapDataPdu::decode`:\n```rust\nlet expected_remaining_size = if flags.contains(BitmapDataFlags::COMPRESSED_BITMAP_HEADER_PRESENT) {\n    data_length\n        .checked_add(BitmapDataHeader::ENCODED_SIZE)\n        .ok_or_else(|| invalid_field_err!(\"bitmap data length\", \"length overflow\"))?\n} else {\n    data_length\n};\n```\nand likewise `length_and_mask.checked_add(length_xor_mask)` in `LargePointerAttribute::decode`.","locations":[{"ref":"crates/ironrdp-pdu/src/basic_output/surface_commands/mod.rs:248","code":"  248 |             data_length + BitmapDataHeader::ENCODED_SIZE","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-pdu/src/basic_output/surface_commands/mod.rs#L248"},{"ref":"crates/ironrdp-pdu/src/basic_output/pointer/mod.rs:312","code":"  312 |         let expected_masks_size = length_and_mask + length_xor_mask;","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-pdu/src/basic_output/pointer/mod.rs#L312"}]},{"id":"OVF_5","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`InclusiveRectangle::width`/`height` compute `self.right - self.left + 1` and `self.bottom - self.top + 1` on `u16` fields. The `Decode` impl reads all four coordinates directly from the wire with no check that `left <= right` / `top <= bottom`, so a decoded rectangle with `right < left` (or `bottom < top`) makes these getters underflow: a debug-build panic, or a wrapped near-`u16::MAX` width in release. The doc comment asserts the INVARIANT `0 < output`, but nothing enforces it at decode time.","fix":"Use `saturating_sub` (`self.right.saturating_sub(self.left) + 1`), or enforce `left <= right && top <= bottom` in `InclusiveRectangle::decode` so the documented invariant actually holds for decoded values.","locations":[{"ref":"crates/ironrdp-pdu/src/geometry.rs:155-157","code":"  155 |     fn width(&self) -> u16 {\n  156 |         self.right - self.left + 1\n  157 |     }","lines":3,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-pdu/src/geometry.rs#L155-L157"},{"ref":"crates/ironrdp-pdu/src/geometry.rs:160-162","code":"  160 |     fn height(&self) -> u16 {\n  161 |         self.bottom - self.top + 1\n  162 |     }","lines":3,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-pdu/src/geometry.rs#L160-L162"}]},{"id":"OVF_6","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"`row_len = bitmap.width.get() * bytes_per_pixel` is computed in `u16`. With a 4-byte pixel format any width > 16383 overflows `u16`. Because the crate sets `#![allow(clippy::arithmetic_side_effects)]`, in release builds this wraps silently, making `chunk_height = u16::MAX / row_len` and the subsequent `data.chunks(...)` / `uncompressed_size` calculations wrong (mis-chunked/mis-sized bitmap data); in debug builds it panics. Realistic RDP desktop widths stay under this, so impact is limited, but the wide-desktop case is unhandled.","fix":"Compute `row_len` (and the derived `chunk_height`/`uncompressed_size`) in `usize` and only cast down with `cast_length!`/`cast_int!` where a `u16` field is actually required, so an out-of-range width yields an error instead of wrapping.","locations":[{"ref":"crates/ironrdp-server/src/encoder/bitmap.rs:38-52","code":"   38 |         let bytes_per_pixel = u16::from(bitmap.format.bytes_per_pixel());\n   39 |         let row_len = bitmap.width.get() * bytes_per_pixel;\n   40 |         let chunk_height = u16::MAX / row_len;\n   41 | \n   42 |         let mut cursor = WriteCursor::new(output);\n   43 |         let stride = bitmap.stride.get();\n   44 |         let chunks = bitmap.data.chunks(stride * usize::from(chunk_height));\n   45 | \n   46 |         let total = cast_int!(\"chunks length lower bound\", chunks.size_hint().0).map_err(BitmapEncodeError::Encode)?;\n   47 |         BitmapUpdateData::encode_header(total, &mut cursor).map_err(BitmapEncodeError::Encode)?;\n   48 | \n   49 |         for (i, chunk) in chunks.enumerate() {\n   50 |             let height = cast_int!(\"bitmap height\", chunk.len() / stride).map_err(BitmapEncodeError::Encode)?;\n   51 |             let i: u16 = cast_int!(\"chunk idx\", i).map_err(BitmapEncodeError::Encode)?;\n   52 |             let top = bitmap.y + i * chunk_height;","lines":15,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-server/src/encoder/bitmap.rs#L38-L52"},{"ref":"crates/ironrdp-server/src/encoder/bitmap.rs:81","code":"   81 |                 }),","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-server/src/encoder/bitmap.rs#L81"}]},{"id":"OVF_7","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"negligible","difficulty":"very_easy","description":"`BitStreamWriter::write_bits` panics with `attempt to shift left with overflow` if called with `nbits == 32` while the accumulator `offset` is 0 (or with `nbits == 0` and `offset == 0`). In the boundary-crossing branch, `let mask = (1u32 << (nbits - self.offset)) - 1;` evaluates to `1u32 << 32` when the new `self.offset` is 0 and `nbits` is 32. The `#[expect]` reason comment explicitly claims `nbits (u32 ≤ 32) always fits`, implying 32-bit writes are supported, but they are not. No current caller passes 32 (MPPC compression writes at most 30 bits), so this is latent only.","fix":"Either document/enforce the real limit (`nbits < 32`) with a `debug_assert!(nbits < 32)` mirroring the reader's `shift`, or make the shift safe. Before:\n```rust\nlet mask = (1u32 << (nbits - self.offset)) - 1;\n```\nAfter (guard the full-width case):\n```rust\nlet width = nbits - self.offset;\nlet mask = if width >= 32 { u32::MAX } else { (1u32 << width) - 1 };\n```","locations":[{"ref":"crates/ironrdp-bulk/src/bitstream.rs:197","code":"  197 |             let mask = (1u32 << (nbits - self.offset)) - 1;","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-bulk/src/bitstream.rs#L197"},{"ref":"crates/ironrdp-bulk/src/bitstream.rs:182","code":"  182 |     #[expect(clippy::as_conversions, reason = \"nbits (u32 ≤ 32) always fits in usize\")]","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-bulk/src/bitstream.rs#L182"}]},{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"In `decode_upgrade_pass`, SRL values are decoded per band via `srl::decode_srl(srl_data, zero_count, num_bits)`, always passing the FULL component SRL stream starting at byte 0. `encode_upgrade_pass` instead produces an INDEPENDENT byte-aligned SRL stream per band (each ending in a 0x00 sentinel) and concatenates them (`all_srl_values.extend_from_slice(&srl_encoded)` at line 415-416). Because `decode_srl` always starts at offset 0 and the caller never advances a byte offset, every refined band decodes band 0's SRL stream. `decode_srl` also returns no consumed-byte count, so the caller cannot advance. Consequently, for any upgrade pass refining >=2 bands, all bands after the first pull zero-DAS refinement values from the wrong (band-0) data, corrupting reconstruction. This is on the network-reachable progressive decode path (`ProgressiveDecoder::decode_bitmap` -> `decode_tile_block` -> `TileState::decode_upgrade`).","fix":"Track a byte offset into `srl_data` and advance it after each band's SRL is consumed. This requires `decode_srl` to report how many bytes it consumed (each per-band stream is byte-aligned and sentinel-terminated). E.g. change `decode_srl` to return `(Vec<i16>, usize /* bytes_consumed */)` and in `decode_upgrade_pass` maintain `let mut srl_off = 0;` then `let (srl_values, consumed) = srl::decode_srl(&srl_data[srl_off..], zero_count, num_bits); srl_off += consumed;`. The consumed count should be `reader.byte_idx + 1` (rounding past the current partial byte plus the sentinel) so subsequent bands read their own concatenated stream.","locations":[{"ref":"crates/ironrdp-graphics/src/progressive.rs:136","code":"  136 |         let srl_values = srl::decode_srl(srl_data, zero_count, num_bits);","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-graphics/src/progressive.rs#L136"},{"ref":"crates/ironrdp-graphics/src/progressive.rs:148-153","code":"  148 |                 let value = if srl_idx < srl_values.len() {\n  149 |                     srl_values[srl_idx]\n  150 |                 } else {\n  151 |                     0\n  152 |                 };\n  153 |                 srl_idx += 1;","lines":6,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-graphics/src/progressive.rs#L148-L153"},{"ref":"crates/ironrdp-graphics/src/progressive.rs:414-416","code":"  414 |         // Encode SRL values for this band\n  415 |         let srl_encoded = srl::encode_srl(&band_srl_values, num_bits);\n  416 |         all_srl_values.extend_from_slice(&srl_encoded);","lines":3,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-graphics/src/progressive.rs#L414-L416"}]},{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"easy","description":"In `decode_upgrade_pass`, the raw-magnitude bit reader is re-created inside the per-band loop (`let mut raw_reader = RawBitReader::new(raw_data);`), so it restarts at bit 0 for every band. The symmetric encoder `encode_upgrade_pass` uses a SINGLE continuous `RawBitWriter` across all bands (created once at line 379), producing one contiguous raw bitstream. On decode, band 0 reads its raw bits correctly, but every subsequent band with a non-zero-DAS coefficient re-reads band 0's bits instead of continuing the stream. Any progressive TILE_UPGRADE that refines two or more bands (the normal case) reconstructs corrupted coefficient magnitudes for all bands after the first. Not caught by tests: `upgrade_pass_zero_das_becomes_nonzero` only refines a single band (HL1), and there is no multi-band encode/decode round-trip test.","fix":"Hoist the reader out of the band loop so it persists across bands, matching the encoder's single continuous stream. Before:\n```rust\nfor (band_idx, band) in bands.iter().enumerate() {\n    ...\n    let mut srl_idx = 0;\n    let mut raw_reader = RawBitReader::new(raw_data);\n    for i in 0..band.count() { ... }\n}\n```\nAfter:\n```rust\nlet mut raw_reader = RawBitReader::new(raw_data);\nfor (band_idx, band) in bands.iter().enumerate() {\n    ...\n    let mut srl_idx = 0;\n    for i in 0..band.count() { ... }\n}\n```\n(the `num_bits == 0` early `continue` must not skip advancing the reader, but since no raw bits are written for those bands on the encode side, skipping is correct).","locations":[{"ref":"crates/ironrdp-graphics/src/progressive.rs:140","code":"  140 |         let mut raw_reader = RawBitReader::new(raw_data);","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-graphics/src/progressive.rs#L140"},{"ref":"crates/ironrdp-graphics/src/progressive.rs:122-179","code":"  122 |     for (band_idx, band) in bands.iter().enumerate() {\n  123 |         let prev_bit_pos = prev_prog_quant.for_band(band_idx);\n  124 |         let curr_bit_pos = curr_prog_quant.for_band(band_idx);\n  125 | \n  126 |         // Number of raw bits per coefficient in this band\n  127 |         let num_bits = prev_bit_pos.saturating_sub(curr_bit_pos);\n  128 |         if num_bits == 0 {\n  129 |             continue;\n  130 |         }\n  131 | \n  132 |         // Count zero-DAS positions in this band (for SRL decode)\n  133 |         let zero_count = band_zero_count(sign, band);\n  134 | \n  135 |         // SRL decode for zero-DAS positions\n  136 |         let srl_values = srl::decode_srl(srl_data, zero_count, num_bits);\n  137 | \n  138 |         // Apply upgrade values to this band\n  139 |         let mut srl_idx = 0;\n  140 |         let mut raw_reader = RawBitReader::new(raw_data);\n  141 | \n  142 |         for i in 0..band.count() {\n  143 |             let coeff_idx = band.offset + i;\n  144 |             let is_ll3 = band_idx == 9;\n  145 | \n  146 |             if sign[coeff_idx] == SIGN_ZERO {\n  147 |                 // Zero-DAS: get value from SRL stream\n  148 |                 let value = if srl_idx < srl_values.len() {\n  149 |                     srl_values[srl_idx]\n  150 |                 } else {\n  151 |                     0\n  152 |                 };\n  153 |                 srl_idx += 1;\n  154 | \n  155 |                 if value != 0 {\n  156 |                     // Coefficient transitions from zero to non-zero\n  157 |                     let shifted = i32::from(value) << i32::from(curr_bit_pos);\n  158 |                     coefficients[coeff_idx] = clamp_i16(shifted);\n  159 |                     sign[coeff_idx] = if value > 0 { SIGN_POSITIVE } else { SIGN_NEGATIVE };\n  160 |                 }\n  161 |             } else {\n  162 |                 // Non-zero DAS: read raw magnitude bits\n  163 |                 let raw_mag = raw_reader.read_bits(u32::from(num_bits));\n  164 | \n  165 |                 if raw_mag != 0 {\n  166 |                     // raw_mag fits in i32 (at most 2^15 from bit stream)\n  167 |                     let mag_i32 = i32::try_from(raw_mag).unwrap_or(i32::MAX);\n  168 |                     let shifted = mag_i32 << i32::from(curr_bit_pos);\n  169 |                     if is_ll3 || sign[coeff_idx] == SIGN_POSITIVE {\n  170 |                         // LL3 is always positive; positive DAS adds\n  171 |                         coefficients[coeff_idx] = clamp_i16(i32::from(coefficients[coeff_idx]) + shifted);\n  172 |                     } else {\n  173 |                         // Negative DAS subtracts\n  174 |                         coefficients[coeff_idx] = clamp_i16(i32::from(coefficients[coeff_idx]) - shifted);\n  175 |                     }\n  176 |                 }\n  177 |             }\n  178 |         }\n  179 |     }","lines":58,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-graphics/src/progressive.rs#L122-L179"},{"ref":"crates/ironrdp-graphics/src/progressive.rs:379","code":"  379 |     let mut raw_writer = RawBitWriter::new();","lines":1,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-graphics/src/progressive.rs#L379"}]},{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`decode_png` decodes a clipboard PNG with `set_transformations(ALPHA | EXPAND)` and `top_down_rgba_to_bottom_up_bgra` then hardcodes 4 bytes per source pixel (`stride = width*4`, `src_bitmap.chunks_exact(stride)`, inner `src_row.chunks_exact(4)`, and `transform` reading `src_pixel[0..=3]`). But per the png crate docs, `EXPAND` only expands *paletted* images to RGB, expands sub-8-bit grayscale to 8-bit, and expands tRNS to alpha; `ALPHA` only adds alpha to *paletted* images. Neither adds an alpha channel to truecolor RGB nor converts grayscale to RGB, and `STRIP_16` is not set so 16-bit images keep 2 bytes per sample. Consequently `info.color_type` may be `Grayscale` (1 channel), `GrayscaleAlpha` (2), or `Rgb` (3), and the bit depth may be 16. In all these cases the real row size is not `width*4`, so `chunks_exact` reverses/reads rows with the wrong stride and misinterprets pixel boundaries: the produced CF_DIB/CF_DIBV5 bitmap is color-scrambled and vertically truncated (only a fraction of rows are filled; the rest stay black). The presence of the `no_alpha` branch shows the author expected non-RGBA output but never adjusted the stride/pixel size. No panic (chunks_exact never indexes OOB), but the pasted image is corrupted for the very common case of an RGB (no-alpha) or grayscale or 16-bit PNG.","fix":"Do not assume the decoded PNG is 8-bit RGBA. Add `png::Transformations::STRIP_16` to normalize bit depth, and in `top_down_rgba_to_bottom_up_bgra` derive the source sample count from `info.color_type` (Grayscale=1, GrayscaleAlpha=2, Rgb=3, Rgba=4) instead of hardcoding 4. Compute `src_stride = width * src_samples`, chunk the source by `src_samples`, and branch the `transform` on the source channel layout (e.g. replicate the gray sample into B/G/R for grayscale, copy R/G/B with 0xFF alpha for Rgb, etc.). Alternatively, reject any `info.color_type`/`info.bit_depth` that is not 8-bit RGBA with a `BitmapError::Unsupported`, so corrupted output is never produced.","locations":[{"ref":"crates/ironrdp-cliprdr-format/src/bitmap.rs:736-755","code":"  736 | fn decode_png(mut input: &[u8]) -> Result<(png::OutputInfo, Vec<u8>), BitmapError> {\n  737 |     let mut decoder = png::Decoder::new(Cursor::new(&mut input));\n  738 | \n  739 |     // We need to produce 32-bit DIB, so we should expand the palette to 32-bit RGBA.\n  740 |     decoder.set_transformations(png::Transformations::ALPHA | png::Transformations::EXPAND);\n  741 | \n  742 |     let mut reader = decoder.read_info()?;\n  743 |     let Some(output_buffer_len) = reader.output_buffer_size() else {\n  744 |         return Err(BitmapError::BufferTooBig);\n  745 |     };\n  746 | \n  747 |     // Prevent allocation of huge buffers.\n  748 |     ensure(output_buffer_len <= MAX_BUFFER_SIZE).ok_or(BitmapError::BufferTooBig)?;\n  749 | \n  750 |     let mut buffer = vec![0; output_buffer_len];\n  751 |     let info = reader.next_frame(&mut buffer)?;\n  752 |     buffer.truncate(info.buffer_size());\n  753 | \n  754 |     Ok((info, buffer))\n  755 | }","lines":20,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-cliprdr-format/src/bitmap.rs#L736-L755"},{"ref":"crates/ironrdp-cliprdr-format/src/bitmap.rs:680-690","code":"  680 |     let no_alpha = info.color_type != png::ColorType::Rgba;\n  681 |     let width = u16::try_from(info.width).map_err(|_| BitmapError::WidthTooBig)?;\n  682 |     let height = u16::try_from(info.height).map_err(|_| BitmapError::HeightTooBig)?;\n  683 | \n  684 |     let stride = usize::from(width) * 4;\n  685 | \n  686 |     let src_rows = src_bitmap.chunks_exact(stride);\n  687 | \n  688 |     // As per invariants: stride * height <= width * 4 * height <= 10_000 * 4 * 10_000 <= u32::MAX.\n  689 |     #[expect(clippy::arithmetic_side_effects)]\n  690 |     let dst_len = stride * usize::from(height);","lines":11,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-cliprdr-format/src/bitmap.rs#L680-L690"},{"ref":"crates/ironrdp-cliprdr-format/src/bitmap.rs:711-731","code":"  711 |     let transform: fn((&mut [u8], &[u8])) = if no_alpha {\n  712 |         |(dst_pixel, src_pixel)| {\n  713 |             dst_pixel[0] = src_pixel[2];\n  714 |             dst_pixel[1] = src_pixel[1];\n  715 |             dst_pixel[2] = src_pixel[0];\n  716 |             dst_pixel[3] = 0xFF;\n  717 |         }\n  718 |     } else {\n  719 |         |(dst_pixel, src_pixel)| {\n  720 |             dst_pixel[0] = src_pixel[2];\n  721 |             dst_pixel[1] = src_pixel[1];\n  722 |             dst_pixel[2] = src_pixel[0];\n  723 |             dst_pixel[3] = src_pixel[3];\n  724 |         }\n  725 |     };\n  726 | \n  727 |     dst_rows.zip(src_rows).for_each(|(dst_row, src_row)| {\n  728 |         let dst_pixels = dst_row.chunks_exact_mut(4);\n  729 |         let src_pixels = src_row.chunks_exact(4);\n  730 |         dst_pixels.zip(src_pixels).for_each(transform);\n  731 |     });","lines":21,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-cliprdr-format/src/bitmap.rs#L711-L731"}]},{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"`DisplayControlClient::process` decodes the inbound DVC payload as a bare `DisplayControlCapabilities` (12-byte body) via `DisplayControlCapabilities::decode`, skipping the 8-byte `DISPLAYCONTROL_HEADER` (Type + Length). The DVC layer hands `process` the fully reassembled payload, which for a DISPLAYCONTROL_CAPS_PDU (MS-RDPEDISP 2.2.2.1) begins with that header - as confirmed by the encode path (`DisplayControlPdu::encode` writes the header) and the server side (`DisplayControlServer::process` correctly does `decode::<DisplayControlPdu>`). The client therefore misreads the header bytes as `max_num_monitors`/`max_monitor_area_factor_a` and the real first cap field as the next, silently yielding wrong capability values (no error is raised because the misparsed values still pass the range checks). The `on_capabilities_received` callback then fires with corrupted caps.","fix":"Decode the full `DisplayControlPdu` and extract the `Caps` variant, mirroring the server. Replace the body of `process` with something like:\n```rust\nlet caps = match ironrdp_core::decode::<DisplayControlPdu>(payload).map_err(|e| decode_err!(e))? {\n    DisplayControlPdu::Caps(caps) => caps,\n    other => return Err(pdu_other_err!(\"unexpected DisplayControl PDU while waiting for capabilities\")),\n};\ndebug!(\"Received {:?}\", caps);\nself.ready = true;\n(self.on_capabilities_received)(caps)\n```\n(Import `decode` instead of the `Decode`/`ReadCursor` items no longer needed.)","locations":[{"ref":"crates/ironrdp-displaycontrol/src/client.rs:78-83","code":"   78 |     fn process(&mut self, _channel_id: u32, payload: &[u8]) -> PduResult<Vec<DvcMessage>> {\n   79 |         let caps = DisplayControlCapabilities::decode(&mut ReadCursor::new(payload)).map_err(|e| decode_err!(e))?;\n   80 |         debug!(\"Received {:?}\", caps);\n   81 |         self.ready = true;\n   82 |         (self.on_capabilities_received)(caps)\n   83 |     }","lines":6,"link":"https://github.com/Devolutions/IronRDP/blob/079b48422b0b78d37beb76994950a2a07c442a94/crates/ironrdp-displaycontrol/src/client.rs#L78-L83"}]},{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"very_easy","description":"In `CompleteData::process_data_first_pdu`, when a previous fragmented message is still buffered (`self.total_size != 0`) and a new *complete* DataFirst arrives (`total_data_size == data.len()`), the function clears `self.data` but never resets `self.total_size`, then returns the complete data via the early `Ok(Some(..))` branch. `self.total_size` retains the stale non-zero value. A message of exactly `MAX_DATA_SIZE` (1590) bytes is emitted by `encode_dvc_messages` as a single complete DataFirst, so this path is realistic. After it, `process_data_pdu` sees `self.total_size != 0` with an empty `self.data`, so the next standalone Data PDU is misinterpreted as a fragment continuation: it is appended and swallowed (returns `None`) or mis-reassembled, corrupting/losing subsequent DVC traffic on that channel. The reset only happens in the `else` (incomplete) branch and in `process_data_pdu`'s Equal branch, not here.","fix":"Reset `total_size` on the complete-return path. Change:\n```rust\nif total_data_size == data_first.data().len() {\n    Ok(Some(data_first.into_data()))\n} else {\n```\nto:\n```rust\nif total_data_size == d
