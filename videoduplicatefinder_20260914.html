<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Code Audit — Interactive</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e5e7eb;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;color:#f1f5f9}
.meta{font-size:.8rem;color:#6b7280;margin-top:.2rem}
.top-right{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.project-info{margin-bottom:1rem;padding:.75rem .9rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.project-info .pi-name{font-size:.95rem;font-weight:700;color:#f1f5f9}
.project-info .pi-desc{font-size:.82rem;color:#d1d5db;margin-top:.25rem}
.project-info .pi-row{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.45rem;font-size:.78rem;color:#9ca3af}
.project-info .pi-row .pi-k{color:#6b7280}
.project-info a{color:#60a5fa;text-decoration:none}
.project-info a:hover{text-decoration:underline}
.project-info code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.74rem;color:#93c5fd}
.pi-repo-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;background:#0f172a;border:1px solid #3b82f6;border-radius:6px;color:#60a5fa !important;font-weight:600}
.pi-repo-btn:hover{background:#1d283a;text-decoration:none !important}
#search{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.4rem .75rem;border-radius:6px;font-size:.875rem;width:220px;outline:none}
#search:focus{border-color:#3b82f6}
.group-label{font-size:.8rem;color:#9ca3af;display:flex;align-items:center;gap:.4rem}
select{background:#1e293b;border:1px solid #334155;color:#e5e7eb;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;outline:none;cursor:pointer}
select:focus{border-color:#3b82f6}
.filterbar{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.6rem;padding:.6rem .75rem;background:#1e293b;border:1px solid #334155;border-radius:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.filter-lbl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;white-space:nowrap;margin-right:.25rem}
.filter-toggle{font-size:.65rem;font-weight:600;padding:.18rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;margin-left:auto;white-space:nowrap;letter-spacing:.04em}
.filter-toggle:hover{background:#1e293b;color:#e5e7eb;border-color:#4b5563}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;letter-spacing:.03em;transition:opacity .12s,filter .12s;user-select:none}
.badge.off{opacity:.28;filter:grayscale(.5)}
.sev-critical{background:#450a0a;color:#fca5a5;border-color:#991b1b}
.sev-high    {background:#431407;color:#fdba74;border-color:#9a3412}
.sev-medium  {background:#422006;color:#fcd34d;border-color:#854d0e}
.sev-low     {background:#0c1a3a;color:#93c5fd;border-color:#1d4ed8}
.sev-negligible{background:#1e293b;color:#6b7280;border-color:#334155}
.type-badge{background:#0c1e33;color:#7dd3fc;border-color:#0369a1}
.diff-very-easy{background:#052e16;color:#86efac;border-color:#16a34a}
.diff-easy{background:#064e3b;color:#6ee7b7;border-color:#059669}
.diff-medium{background:#1e293b;color:#9ca3af;border-color:#4b5563}
.diff-hard{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
.st-open{background:#1e293b;color:#4b5563;border-color:#334155}
.st-fixed{background:#052e16;color:#4ade80;border-color:#16a34a}
.st-wont{background:#431407;color:#fdba74;border-color:#9a3412}
.st-fp{background:#2e1065;color:#c4b5fd;border-color:#7c3aed}
#progress-wrap{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;flex-wrap:wrap}
#progress-bar{flex:1;min-width:120px;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;border:1px solid #334155}
#progress-fill{height:100%;background:#22c55e;border-radius:4px;transition:width .35s ease;width:0}
#progress-text{font-size:.75rem;color:#6b7280;white-space:nowrap}
.action-btn{font-size:.72rem;padding:.25rem .6rem;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#9ca3af;cursor:pointer;white-space:nowrap}
.action-btn:hover{background:#334155;color:#e5e7eb}
.action-btn.active{background:#1d4ed8;color:#fff;border-color:#2563eb}
.action-btn.active:hover{background:#2563eb}
.search-wrap{display:flex;align-items:center;gap:.35rem}
#hidden-bar{margin-bottom:.6rem}
.hidden-inner{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.hidden-lbl{font-size:.72rem;color:#4b5563}
.show-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#1e293b;color:#9ca3af;border:1px solid #334155;cursor:pointer}
.show-btn:hover{background:#334155;color:#e5e7eb}
.show-all-btn{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;background:#2563eb;color:#fff;border:none;cursor:pointer}
.show-all-btn:hover{background:#1d4ed8}
.group-section{margin-bottom:1.5rem}
.group-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.35rem;border-bottom:1px solid #334155}
.group-title{font-size:.95rem;font-weight:700;color:#d1d5db}
.group-title.all-done{color:#4ade80}
.group-count{font-size:.72rem;color:#4b5563;background:#1e293b;padding:.1rem .4rem;border-radius:10px;white-space:nowrap}
.icon-btn{background:transparent;border:none;color:#334155;cursor:pointer;font-size:.85rem;padding:.05rem .2rem;line-height:1}
.icon-btn:hover{color:#6b7280}
.hide-btn{margin-left:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:4px;background:transparent;color:#334155;border:1px solid #1e293b;cursor:pointer}
.hide-btn:hover{background:#1e293b;color:#6b7280}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:.6rem;overflow:hidden;transition:opacity .15s}
.card.resolved{opacity:.55;border-left:3px solid #16a34a}
.card.resolved:hover{opacity:.85}
.card-header{display:flex;align-items:center;gap:.5rem;padding:.45rem .85rem;background:#162032;border-bottom:1px solid #334155;flex-wrap:wrap;cursor:pointer;user-select:none}
.card-header:hover{background:#1a2840}
.card-arrow{font-size:.65rem;color:#334155;flex-shrink:0}
.card-id{font-size:.75rem;font-weight:700;color:#6b7280;font-family:monospace;letter-spacing:.04em}
.card-loc{font-size:.72rem;color:#6b7280;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-btn{margin-left:auto;font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:filter .1s}
.status-btn:hover{filter:brightness(1.25)}
.copy-btn{font-size:.68rem;font-weight:600;padding:.15rem .5rem;border-radius:4px;border:1px solid #334155;background:#0f172a;color:#9ca3af;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.copy-btn:hover{background:#334155;color:#e5e7eb}
.card-body{padding:.85rem .9rem}
.field-lbl{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;margin:1rem 0 .35rem;padding-bottom:.18rem;border-bottom:1px solid #1e293b}
.field-lbl:first-child{margin-top:0}
.desc,.fix-txt{font-size:.875rem;color:#d1d5db;line-height:1.55}
.desc p,.fix-txt p{margin:.4rem 0}
.desc p:first-child,.fix-txt p:first-child{margin-top:0}
.desc p:last-child,.fix-txt p:last-child{margin-bottom:0}
.loc-block{margin:.3rem 0 .6rem}
.loc-ref{font-size:.8rem;color:#38bdf8;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-weight:600;margin-bottom:.22rem}
a.loc-link{color:inherit;text-decoration:none}
a.loc-link:hover{text-decoration:underline}
.loc-lines{color:#4b5563;font-weight:400}
pre{background:#0f172a;color:#cdd6f4;border-radius:5px;padding:.6rem .8rem;overflow-x:auto;white-space:pre;font-size:.8rem;line-height:1.55;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;border:1px solid #1e293b;max-height:320px}
.desc pre.md-code,.fix-txt pre.md-code{margin:.5rem 0;font-size:.82rem;color:#e5e7eb;background:#0b1224;border:1px solid #1e293b;max-height:none}
code.md-inline{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.86em;background:#0b1224;color:#fca5a5;border:1px solid #1e293b;border-radius:3px;padding:.04rem .32rem;white-space:pre-wrap;word-break:break-word}
.not-found{font-size:.8rem;color:#334155;font-style:italic}
mark{background:#854d0e;color:#fef9c3;border-radius:2px;padding:0 .1rem}
.no-results{text-align:center;color:#334155;padding:3rem 1rem;font-size:.9rem}
</style>
</head>

{"id":"PANIC_1","type":"panic","type_label":"Panic","severity":"high","difficulty":"medium","description":"DuplicateItem constructor does fi.Extension[1..] for images. When an image file has no extension (FileInfo.Extension returns an empty string), the range operator [1..] throws ArgumentOutOfRangeException, which crashes the scan/grouping while building results. IsImage is derived from extension matching so this is unlikely for normal images, but a renamed/extensionless file that was force-added (or a path whose extension was stripped) will throw inside the duplicate-grouping path.","fix":"Guard: Format = fi.Extension.Length > 1 ? fi.Extension[1..] : fi.Extension; (or use Path.GetExtension and TrimStart('.')).","locations":[{"ref":"VDF.Core/ViewModels/DuplicateItem.cs:91-92","code":"   91 | \t\t\tif (file.IsImage)\n   92 | \t\t\t\tFormat = fi.Extension[1..];","lines":2,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Core/ViewModels/DuplicateItem.cs#L91-L92"}]},
{"id":"UAF_1","type":"use_after_free","type_label":"Use After Free","severity":"medium","difficulty":"medium","description":"VideoFrameConverter.Dispose frees _pConvertedFrame and the SwsContext but does not null them, and the class is not guarded against double-Dispose. Calling Dispose twice (e.g. the rebuild path in GetGrayFrames disposes, then the finally disposes again on the same reference if assignment is reordered) would double-free. The sibling decoder classes deliberately null pointers to prevent exactly this; VideoFrameConverter does not.","fix":"Null _pConvertContext/_pConvertedFrame after freeing and guard against re-entry (or make them non-readonly and check for null).","locations":[{"ref":"VDF.Core/FFTools/FFmpegNative/VideoFrameConverter.cs:82-86","code":"   82 | \t\tpublic void Dispose() {\n   83 | \t\t\tAVFrame* convertedFrame = _pConvertedFrame;\n   84 | \t\t\tffmpeg.av_frame_free(&convertedFrame);\n   85 | \t\t\tffmpeg.sws_freeContext(_pConvertContext);\n   86 | \t\t}","lines":5,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Core/FFTools/FFmpegNative/VideoFrameConverter.cs#L82-L86"}]},
{"id":"MEM_1","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"DatabaseViewerVM writes TempDatabaseFile in its constructor (line 42-44) but only deletes it inside Save(). Save() is invoked from DatabaseViewer_Closing. If Save() throws before reaching the File.Delete (e.g. SerializeToUtf8Bytes or ImportDataBaseFromJson fails - those calls are NOT wrapped in try/catch, only the Delete is), the temp file leaks. Opening the viewer also always creates a fresh random temp file each time, so repeated opens accumulate leaked files on any error path.","fix":"Wrap the whole Save() body in try/finally and delete the temp file in the finally; also delete it if the user closes without a successful import.","locations":[{"ref":"VDF.GUI/ViewModels/DatabaseViewerVM.cs:131-133","code":"  131 | \t\t\tTempDatabaseFile = Path.Combine(Path.GetTempPath(), Path.GetRandomFileName());\n  132 | \t\t\tScanEngine.ExportDataBaseToJson(TempDatabaseFile, serializerOptions);\n  133 | \t\t\tDbWrapper = JsonSerializer.Deserialize(File.ReadAllBytes(TempDatabaseFile), VDF.Core.Utils.CoreJsonContext.Default.DatabaseWrapper)!;","lines":3,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/ViewModels/DatabaseViewerVM.cs#L131-L133"}]},
{"id":"MEM_2","type":"memory_leak","type_label":"Memory Leak","severity":"medium","difficulty":"medium","description":"RelocateFilesDialogVM writes a temp database file (TempDatabaseFile) in its constructor via ScanEngine.ExportDataBaseToJson, but the file is only deleted at the end of ApplyImpl. If the user opens the dialog and closes/cancels it (Cancel command just calls _owner.Close()), the temp file is leaked into the OS temp directory permanently. The same file is also leaked if ApplyImpl returns early on a write exception (line 348 returns before any cleanup).","fix":"Delete TempDatabaseFile on dialog close (handle _owner.Closing) and in a finally/catch in ApplyImpl, or write to an in-memory stream instead of a temp file.","locations":[{"ref":"VDF.GUI/ViewModels/RelocateFilesDialogVM.cs:84-90","code":"   84 | \t\tpublic RelocateFilesDialogVM(Window owner) {\n   85 | \t\t\t_owner = owner;\n   86 | \t\t\tTempDatabaseFile = Path.Combine(Path.GetTempPath(), Path.GetRandomFileName());\n   87 | \t\t\tScanEngine.ExportDataBaseToJson(TempDatabaseFile, serializerOptions);\n   88 | \t\t\tDbWrapper = JsonSerializer.Deserialize(File.ReadAllBytes(TempDatabaseFile), VDF.Core.Utils.CoreJsonContext.Default.DatabaseWrapper)!;\n   89 | \t\t\t_entries = [.. DbWrapper.Entries];\n   90 | \t\t}","lines":7,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/ViewModels/RelocateFilesDialogVM.cs#L84-L90"},{"ref":"VDF.GUI/ViewModels/RelocateFilesDialogVM.cs:161","code":"  161 | \t\tpublic ReactiveCommand<Unit, Unit> Cancel => ReactiveCommand.Create(() => _owner.Close());","lines":1,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/ViewModels/RelocateFilesDialogVM.cs#L161"}]},
{"id":"MEM_3","type":"memory_leak","type_label":"Memory Leak","severity":"low","difficulty":"medium","description":"ThumbnailComparer_Loaded subscribes to BoundsProperty and IsVisibleProperty observables on the CompareCanvas/StackedCanvas grids with no disposal of the returned IDisposable subscriptions. The lambdas capture the VM. Subscriptions live for the lifetime of the control; since they are children of the window this is bounded, but each open of the comparer leaks subscriptions if the same VM/window instances were reused, and is a latent leak pattern.","fix":"Store and dispose the subscriptions on window close, or use WhenAnyValue / bind in XAML.","locations":[{"ref":"VDF.GUI/Views/ThumbnailComparer.xaml.cs:79-99","code":"   79 | \t\t\t\tvoid TrackCanvas(string name) {\n   80 | \t\t\t\t\tvar canvas = this.FindControl<Grid>(name);\n   81 | \t\t\t\t\tif (canvas != null) {\n   82 | \t\t\t\t\t\tcanvas.GetObservable(Layoutable.BoundsProperty).Subscribe(b => {\n   83 | \t\t\t\t\t\t\tif (canvas.IsVisible) {\n   84 | \t\t\t\t\t\t\t\tvm.ViewportWidth = b.Width;\n   85 | \t\t\t\t\t\t\t\tvm.ViewportHeight = b.Height;\n   86 | \t\t\t\t\t\t\t}\n   87 | \t\t\t\t\t\t});\n   88 | \t\t\t\t\t\tcanvas.GetObservable(Visual.IsVisibleProperty).Subscribe(_ => {\n   89 | \t\t\t\t\t\t\tif (canvas.IsVisible) {\n   90 | \t\t\t\t\t\t\t\tvm.ViewportWidth = canvas.Bounds.Width;\n   91 | \t\t\t\t\t\t\t\tvm.ViewportHeight = canvas.Bounds.Height;\n   92 | \t\t\t\t\t\t\t}\n   93 | \t\t\t\t\t\t});\n   94 | \t\t\t\t\t}\n   95 | \t\t\t\t}\n   96 | \n   97 | \t\t\t\tTrackCanvas(\"CompareCanvas\");\n   98 | \t\t\t\tTrackCanvas(\"StackedCanvas\");\n   99 | \t\t\t}","lines":21,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/Views/ThumbnailComparer.xaml.cs#L79-L99"}]},
{"id":"OVF_1","type":"overflow_underflow","type_label":"Overflow Underflow","severity":"low","difficulty":"easy","description":"BytesToMegaBytes converts via single-precision float: `(long)((byteCount / 1024f) / 1024f)`. float has ~7 significant decimal digits, so for byteCount above a few GB the intermediate loses precision and the returned megabyte count is wrong by potentially many MB (e.g. for tens/hundreds of GB files). Integer or double division would be exact.","fix":"Use integer math: `byteCount / (1024L * 1024L)` (or divide by 1024d/1024d as double if a rounding behavior must be preserved).","locations":[{"ref":"VDF.Core/Utils/Extensions.cs:59","code":"   59 | \t\tpublic static long BytesToMegaBytes(this long byteCount) => (long)((byteCount / 1024f) / 1024f);","lines":1,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Core/Utils/Extensions.cs#L59"}]},
{"id":"LOGIC_1","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"`mark --strategy 100-percent-only` is unusable as a deletion strategy because of the `DeletionStrategy.SelectForDeletion` design combined with the keeper choice. For HundredPercentOnly the keeper is `PickHighestQuality` (default branch of PickKeeper). When all items are exactly 100% similar, only quality differentiates them, but the documented intent of `100-percent-only` is to delete only exact duplicates. More importantly: a group of N truly-100%-identical files will delete N-1 of them keeping the highest bitrate. That is fine, but combined with the `mark --dry-run` default bug above, the strategy never executes. Lower severity on its own; flagged because the two interact and the strategy is the most dangerous one.","fix":"Verify the intended keeper for HundredPercentOnly and document it. Primarily fix the dry-run default (separate finding) so the strategy can run at all.","locations":[{"ref":"VDF.CLI/Actions/DeletionStrategy.cs:86-93","code":"   86 | \t\t\t\tif (strategy == Strategy.HundredPercentOnly) {\n   87 | \t\t\t\t\t// Skip groups that are not all 100% similar\n   88 | \t\t\t\t\tif (items.Any(i => i.Similarity < 100f))\n   89 | \t\t\t\t\t\tcontinue;\n   90 | \t\t\t\t}\n   91 | \n   92 | \t\t\t\tDuplicateItem keeper = PickKeeper(items, strategy);\n   93 | \t\t\t\ttoDelete.AddRange(items.Where(i => i != keeper));","lines":8,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.CLI/Actions/DeletionStrategy.cs#L86-L93"},{"ref":"VDF.CLI/Actions/DeletionStrategy.cs:99-106","code":"   99 | \t\tstatic DuplicateItem PickKeeper(List<DuplicateItem> items, Strategy strategy) =>\n  100 | \t\t\tstrategy switch {\n  101 | \t\t\t\tStrategy.SmallestFile => items.OrderByDescending(i => i.SizeLong).First(),\n  102 | \t\t\t\tStrategy.ShortestDuration => items.OrderByDescending(i => i.Duration).First(),\n  103 | \t\t\t\tStrategy.WorstResolution => items.OrderByDescending(i => i.FrameSizeInt).First(),\n  104 | \t\t\t\t// LowestQuality and HundredPercentOnly: keep the highest overall quality item\n  105 | \t\t\t\t_ => PickHighestQuality(items)\n  106 | \t\t\t};","lines":8,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.CLI/Actions/DeletionStrategy.cs#L99-L106"}]},
{"id":"LOGIC_2","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"The `mark` command can never actually delete files. `--dry-run` is given `DefaultValueFactory = _ => true`, and the effective dry-run flag is computed as `dryRun = !doDelete || parseResult.GetValue(dryRunOpt)`. When the user passes `--delete` (or `--delete-permanent`), `doDelete` is true so `!doDelete` is false, but `GetValue(dryRunOpt)` still returns the default `true`, so `dryRun` is `false || true == true`. The deletion branch is therefore never reached and the command only ever prints `[dry-run] would delete`. The user would have to pass an explicit `--dry-run false` to delete, which is unintuitive and undocumented. Note `scan-and-compare` does NOT have this bug because its `--dry-run` option has no default (defaults to false).","fix":"Drop the `DefaultValueFactory = _ => true` on `dryRunOpt` (matching ScanAndCompareCommand) so that an explicit `--delete`/`--delete-permanent` actually deletes, while a bare `mark` with neither flag still defaults to dry-run via `!doDelete`. Alternatively compute `dryRun = parseResult.GetValue(dryRunOpt) || !doDelete` only when the user explicitly set --dry-run; the cleanest fix is removing the default.","locations":[{"ref":"VDF.CLI/Commands/MarkCommand.cs:38-41","code":"   38 | \t\t\tvar dryRunOpt = new Option<bool>(\"--dry-run\") {\n   39 | \t\t\t\tDescription = \"Print which files would be deleted without deleting anything (default).\",\n   40 | \t\t\t\tDefaultValueFactory = _ => true\n   41 | \t\t\t};","lines":4,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.CLI/Commands/MarkCommand.cs#L38-L41"},{"ref":"VDF.CLI/Commands/MarkCommand.cs:83-85","code":"   83 | \t\t\t\tbool doPermanent = parseResult.GetValue(deletePermanentOpt);\n   84 | \t\t\t\tbool doDelete = parseResult.GetValue(deleteOpt) || doPermanent;\n   85 | \t\t\t\tbool dryRun = !doDelete || parseResult.GetValue(dryRunOpt);","lines":3,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.CLI/Commands/MarkCommand.cs#L83-L85"}]},
{"id":"LOGIC_3","type":"logic_error","type_label":"Logic Error","severity":"high","difficulty":"medium","description":"ImageUtils.JoinImages(IReadOnlyList<Bitmap>) does not validate input like the byte[] overload does. It reads images[0].PixelSize.Height as the strip height and sums widths, but never checks for zero/negative dimensions, never caps the total size against MaxCompositeBufferBytes / MaxDisplayableCompositeWidth, and creates a RenderTargetBitmap of (w, h) directly. If images have differing heights, frames taller than images[0] are clipped; if w or h is 0 the RenderTargetBitmap construction throws. Unlike the other overload there is no try/catch, so the exception propagates to the caller (DuplicateItemVM.WireThumbnailUpdates passes ItemInfo.ImageList here).","fix":"Validate count/dimensions, use max height across all images, clamp total width, and wrap in try/catch returning null on failure (mirroring the byte[] overload).","locations":[{"ref":"VDF.GUI/Utils/ImageUtils.cs:143-162","code":"  143 | \t\tpublic static unsafe Bitmap? JoinImages(IReadOnlyList<Bitmap> images, Stream? jpegOut = null) {\n  144 | \t\t\tif (images == null || images.Count == 0) return null;\n  145 | \n  146 | \t\t\tint h = images[0].PixelSize.Height;\n  147 | \t\t\tint w = 0; for (int i = 0; i < images.Count; i++) w += images[i].PixelSize.Width;\n  148 | \n  149 | \t\t\tRenderTargetBitmap rtb = new(new PixelSize(w, h));\n  150 | \n  151 | \t\t\tusing var dc = rtb.CreateDrawingContext();\n  152 | \t\t\t//dc.FillRectangle(Brushes.Transparent, new Rect(0, 0, w, h));\n  153 | \n  154 | \t\t\tdouble x = 0;\n  155 | \t\t\tforeach (var bmp in images) {\n  156 | \t\t\t\tvar src = new Rect(0, 0, bmp.PixelSize.Width, bmp.PixelSize.Height);\n  157 | \t\t\t\tvar dst = new Rect(x, 0, bmp.PixelSize.Width, bmp.PixelSize.Height);\n  158 | \t\t\t\tdc.DrawImage(bmp, src, dst);\n  159 | \t\t\t\tx += bmp.PixelSize.Width;\n  160 | \t\t\t}\n  161 | \t\t\treturn rtb;\n  162 | \t\t}","lines":20,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/Utils/ImageUtils.cs#L143-L162"}]},
{"id":"LOGIC_4","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"`CompareCommand` registers no `--include` option but `ApplyToSettings` still reads `Include` via `r.GetValue(Include)`. For an option not registered on the command, GetValue returns the option's default (an empty array for `Option<string[]>` with OneOrMore arity, or possibly null), so the loop is a no-op — the code relies on `IncludeList.Count == 0` to then set `ScanAgainstEntireDatabase = true`. This works but is fragile: `ApplyToSettings` reads many options (`Exclude`, `NoSubdirs`, `UsePhash`, `NativeFfmpeg`, `HardwareAccel`, `CustomFfArgs`, `CheckpointInterval`, partial-clip options) that `compare` never registers, silently overwriting any values loaded from a settings file with hardcoded defaults (e.g. `IncludeSubDirectories = !false = true`, `MaxDegreeOfParallelism` remapped, `HardwareAccelerationMode = none`). A user who set these in a --settings file for compare would have them clobbered.","fix":"ApplyToSettings should only overwrite a setting when the corresponding option is actually present/registered on the parse result (check `r.GetResult(option)` for an explicit token), or compare should use a dedicated apply method that only touches the options it registers.","locations":[{"ref":"VDF.CLI/Commands/CompareCommand.cs:32","code":"   32 | \t\t\t\tSharedOptions.ApplyToSettings(engine.Settings, parseResult);","lines":1,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.CLI/Commands/CompareCommand.cs#L32"}]},
{"id":"LOGIC_5","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"ChromaprintEngine.ExtractFingerprintProcess leftover-byte handling: when a read returns an odd byte count it stashes the trailing byte. But on the FINAL read where stream returns 0 (EOF) after a previous odd read left hasLeftover=true, the leftover byte is never flushed/processed - it is silently dropped. More importantly, 'source = merged ?? buf' then 'bytesRead' is mutated; if merged was allocated (hasLeftover) and the new total is still odd, it stashes again from merged. Logic is correct for interior reads but the dangling final leftover byte (half a sample) is discarded, which is benign (half-sample) but the code comments claim full handling.","fix":"Acceptable to drop a trailing half-sample; adjust the comment, or assert leftover is consumed at EOF.","locations":[{"ref":"VDF.Core/FFTools/ChromaprintEngine.cs:178-201","code":"  178 | \t\t\t\t\t// Prepend leftover byte from previous iteration if any\n  179 | \t\t\t\t\tbyte[]? merged = null;\n  180 | \t\t\t\t\tif (hasLeftover) {\n  181 | \t\t\t\t\t\tmerged = new byte[1 + bytesRead];\n  182 | \t\t\t\t\t\tmerged[0] = leftoverByte;\n  183 | \t\t\t\t\t\tBuffer.BlockCopy(buf, 0, merged, 1, bytesRead);\n  184 | \t\t\t\t\t\tbytesRead += 1;\n  185 | \t\t\t\t\t\thasLeftover = false;\n  186 | \t\t\t\t\t}\n  187 | \n  188 | \t\t\t\t\t// If odd number of bytes, save the last one for next iteration\n  189 | \t\t\t\t\tbyte[] source = merged ?? buf;\n  190 | \t\t\t\t\tif (bytesRead % 2 != 0) {\n  191 | \t\t\t\t\t\tleftoverByte = source[bytesRead - 1];\n  192 | \t\t\t\t\t\thasLeftover = true;\n  193 | \t\t\t\t\t\tbytesRead--;\n  194 | \t\t\t\t\t}\n  195 | \n  196 | \t\t\t\t\tif (bytesRead >= 2) {\n  197 | \t\t\t\t\t\tvar samples = MemoryMarshal.Cast<byte, short>(\n  198 | \t\t\t\t\t\t\tsource.AsSpan(0, bytesRead));\n  199 | \t\t\t\t\t\tctx.Feed(samples);\n  200 | \t\t\t\t\t}\n  201 | \t\t\t\t}","lines":24,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Core/FFTools/ChromaprintEngine.cs#L178-L201"}]},
{"id":"LOGIC_6","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"FFProbeJsonReader number handling: TryGetInt32 success stores the value but if a JSON number is a float (e.g. sample_rate '44100' is a string so OK, but 'duration' as number, or coordinates) and not duration_ts, it is silently dropped (only DEBUG trace). Crucially the 'duration_ts' int64 special-case is the ONLY long handled; any other large integer field (e.g. a >2^31 bit_rate emitted as a JSON number rather than string) is dropped, losing data silently in release builds.","fix":"Fall back to TryGetInt64/TryGetDouble for any numeric field, storing the widened type, not just duration_ts.","locations":[{"ref":"VDF.Core/FFTools/FFProbeJsonReader.cs:105-128","code":"  105 | \t\t\t\tcase JsonTokenType.Number:\n  106 | \t\t\t\t\tif (!json.TryGetInt32(out int valueInteger)) {\n  107 | \t\t\t\t\t\tif (lastKey == \"duration_ts\" && json.TryGetInt64(out long valueLong)) {\n  108 | \t\t\t\t\t\t\tif (currentObject == JsonObjects.Streams) {\n  109 | \t\t\t\t\t\t\t\tstreams[currentStream][lastKey] = valueLong;\n  110 | \t\t\t\t\t\t\t}\n  111 | \t\t\t\t\t\t\telse if (currentObject == JsonObjects.Format) {\n  112 | \t\t\t\t\t\t\t\tformat[lastKey] = valueLong;\n  113 | \t\t\t\t\t\t\t}\n  114 | \t\t\t\t\t\t\tbreak;\n  115 | \t\t\t\t\t\t}\n  116 | #if DEBUG\n  117 | \t\t\t\t\t\tSystem.Diagnostics.Trace.TraceWarning($\"JSON number parse error: \\\"{lastKey}\\\" = {System.Text.Encoding.UTF8.GetString(valueSpan.ToArray())}, file = {file}\");\n  118 | #endif\n  119 | \t\t\t\t\t\tbreak;\n  120 | \t\t\t\t\t}\n  121 | \n  122 | \t\t\t\t\tif (currentObject == JsonObjects.Streams && lastKey != null) {\n  123 | \t\t\t\t\t\tstreams[currentStream][lastKey] = valueInteger;\n  124 | \t\t\t\t\t}\n  125 | \t\t\t\t\telse if (currentObject == JsonObjects.Format && lastKey != null) {\n  126 | \t\t\t\t\t\tformat[lastKey] = valueInteger;\n  127 | \t\t\t\t\t}\n  128 | \t\t\t\t\tbreak;","lines":24,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Core/FFTools/FFProbeJsonReader.cs#L105-L128"}]},
{"id":"LOGIC_7","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"GetGrayBytesFromImage caches grayBytes under key 0 (imageFile.grayBytes.Add(0, grayBytes)) and TryBuildCompareSnapshot reads key 0 for images, but FileEntry.grayBytes uses a double key. If an image entry already has key 0 present (e.g. re-hash after a partial failure) Dictionary.Add throws ArgumentException (duplicate key), unlike the video path which is populated by FFmpeg with TryAdd semantics. A retry of a previously partially-hashed image can throw, which is then swallowed and the file flagged ThumbnailError.","fix":"Use grayBytes[0] = grayBytes; (indexer) instead of Add, or clear the dictionary before adding, to make re-hash idempotent.","locations":[{"ref":"VDF.Core/ScanEngine.cs:2965","code":" 2965 | \t\t\t\timageFile.grayBytes.Add(0, grayBytes);","lines":1,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Core/ScanEngine.cs#L2965"}]},
{"id":"LOGIC_8","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"PercentageDifferenceWithoutSpecificPixels divides diff by counter without guarding against counter==0. When every pixel of both frames is excluded by the active filter (e.g. a fully black frame with IgnoreBlackPixels, or fully white with IgnoreWhitePixels) counter is 0 and the return is (float)0 / 0 / 256 = NaN in BOTH the SIMD and scalar paths. That NaN then flows into the duplicate-distance comparison; NaN compared against any threshold is always false, so such frames silently never match (or, depending on caller, distort averaging). A degenerate fully-excluded frame should compare as 0 difference (identical) or be skipped, not produce NaN.","fix":"After accumulating, guard: `if (counter == 0) return 0f;` (or return a sentinel the caller treats as 'no comparable pixels') before computing `(float)diff / counter / brightnessScalePerPixel`.","locations":[{"ref":"VDF.Core/Utils/GrayBytesUtils.cs:153","code":"  153 | \t\t\treturn (float)diff / counter / brightnessScalePerPixel;","lines":1,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Core/Utils/GrayBytesUtils.cs#L153"},{"ref":"VDF.Core/Utils/GrayBytesUtils.cs:137-153","code":"  137 | \t\t\t\tcounter /= 255; // PSADBW(mask, 0) accumulated 255 per surviving byte.\n  138 | \t\t\t}\n  139 | \t\t\telse {\n  140 | \t\t\t\tfor (int i = 0; i < img1.Length; i++) {\n  141 | \t\t\t\t\tbool isValid = true;\n  142 | \t\t\t\t\tif (ignoreBlackPixels)\n  143 | \t\t\t\t\t\tisValid = img1[i] > BlackPixelLimit && img2[i] > BlackPixelLimit;\n  144 | \t\t\t\t\tif (!isValid) continue;\n  145 | \t\t\t\t\tif (ignoreWhitePixels)\n  146 | \t\t\t\t\t\tisValid = img1[i] < WhitePixelLimit && img2[i] < WhitePixelLimit;\n  147 | \t\t\t\t\tif (!isValid) continue;\n  148 | \t\t\t\t\tdiff += Math.Abs(img1[i] - img2[i]);\n  149 | \t\t\t\t\tcounter++;\n  150 | \t\t\t\t}\n  151 | \t\t\t}\n  152 | \n  153 | \t\t\treturn (float)diff / counter / brightnessScalePerPixel;","lines":17,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Core/Utils/GrayBytesUtils.cs#L137-L153"}]},
{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"DuplicateItem.Equals/GetHashCode are not overridden, so Duplicates (a HashSet<DuplicateItem>) uses reference equality. In ScanForPartialDuplicates the same source FileEntry can be added as a brand-new DuplicateItem across different groups (addedSources guards only within one assignment pass) and Duplicates.Add of a logically-equal item is never deduplicated. More importantly, building 'new HashSet<DuplicateItem>(duplicateDict.Values)' then adding partial-clip items by reference means an item can appear in two groups, since nothing enforces one-group-per-path at the Duplicates level.","fix":"Either deduplicate partial-clip additions against the already-grouped paths (the alreadyGrouped set excludes visual dups but not other partial-clip sources), or define value equality on Path so the HashSet enforces uniqueness.","locations":[{"ref":"VDF.Core/ViewModels/DuplicateItem.cs:26","code":"   26 | \tpublic class DuplicateItem : ViewModelBase {","lines":1,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Core/ViewModels/DuplicateItem.cs#L26"},{"ref":"VDF.Core/ScanEngine.cs:1997","code":" 1997 | \t\t\tDuplicates = new HashSet<DuplicateItem>(duplicateDict.Values);","lines":1,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Core/ScanEngine.cs#L1997"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"FrameSizeInt is computed as Width + Height (a sum), not Width * Height (area), and is used both as the 'frame size' ranking metric in HighlightBestMatches (IsBestFrameSize = max FrameSizeInt) and for display tie-breaking. Summing dimensions ranks resolutions incorrectly: e.g. 1920x1080 -> 3000 ranks below 100x5000 -> 5100, and 1000x2000 ties 1920x1080. The 'best frame size' highlight (which drives auto-selection of which duplicate to keep) therefore picks the wrong file in non-trivial cases.","fix":"Use the pixel area (Width * Height) for the ranking integer, keeping the WxH string for display. Watch for int overflow on very large dimensions (use long).","locations":[{"ref":"VDF.Core/ViewModels/DuplicateItem.cs:67","code":"   67 | \t\t\t\t\tFrameSizeInt = file.mediaInfo.Streams[i].Width + file.mediaInfo.Streams[i].Height;","lines":1,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Core/ViewModels/DuplicateItem.cs#L67"},{"ref":"VDF.Core/ViewModels/DuplicateItem.cs:83","code":"   83 | \t\t\t\t\tFrameSizeInt = file.mediaInfo.Streams[0].Width + file.mediaInfo.Streams[0].Height;","lines":1,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Core/ViewModels/DuplicateItem.cs#L83"},{"ref":"VDF.Core/ScanEngine.cs:3028-3030","code":" 3028 | \t\t\t\tint bestFrameSize = items.Max(d => d.FrameSizeInt);\n 3029 | \t\t\t\tforeach (DuplicateItem d in items)\n 3030 | \t\t\t\t\tif (d.FrameSizeInt == bestFrameSize) d.IsBestFrameSize = true;","lines":3,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Core/ScanEngine.cs#L3028-L3030"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"KeyboardShortcutManager.ApplyBindings builds KeyBindings from GetEffectiveGesture but does nothing to detect duplicate gestures across actions at apply time; combined with SetGesture which clears the conflicting binding only via ShortcutBindingVM.ApplyGesture (UI path). Shortcuts loaded from settings that conflict (e.g. a user hand-edits Settings.json, or defaults overlap after a future edit) are all added as KeyBindings with the same Gesture, and Avalonia will invoke whichever it matches first - silent, order-dependent behavior with no conflict resolution on the load path.","fix":"De-duplicate gestures when building _effectiveMap in Reload (last-wins or drop later duplicates) and/or skip adding a KeyBinding whose gesture was already bound in ApplyBindings.","locations":[{"ref":"VDF.GUI/Data/KeyboardShortcutManager.cs:30-45","code":"   30 | \t\tpublic void Reload() {\n   31 | \t\t\t_effectiveMap.Clear();\n   32 | \t\t\tforeach (var kvp in KeyboardShortcutDefaults.MainWindowDefaults)\n   33 | \t\t\t\t_effectiveMap[kvp.Key] = kvp.Value;\n   34 | \t\t\tforeach (var kvp in KeyboardShortcutDefaults.DatabaseViewerDefaults)\n   35 | \t\t\t\t_effectiveMap[kvp.Key] = kvp.Value;\n   36 | \n   37 | \t\t\tvar overrides = SettingsFile.Instance.KeyboardShortcuts;\n   38 | \t\t\tforeach (var kvp in overrides) {\n   39 | \t\t\t\tif (_effectiveMap.ContainsKey(kvp.Key))\n   40 | \t\t\t\t\t_effectiveMap[kvp.Key] = kvp.Value;\n   41 | \t\t\t}\n   42 | \n   43 | \t\t\tthis.RaisePropertyChanged(\"Item[]\");\n   44 | \t\t\tShortcutsChanged?.Invoke();\n   45 | \t\t}","lines":16,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/Data/KeyboardShortcutManager.cs#L30-L45"},{"ref":"VDF.GUI/Data/KeyboardShortcutManager.cs:113-120","code":"  113 | \t\tpublic void ApplyBindings(Control target, Dictionary<string, ICommand> commandMap) {\n  114 | \t\t\ttarget.KeyBindings.Clear();\n  115 | \t\t\tforeach (var kvp in commandMap) {\n  116 | \t\t\t\tvar gesture = GetEffectiveGesture(kvp.Key);\n  117 | \t\t\t\tif (gesture != null)\n  118 | \t\t\t\t\ttarget.KeyBindings.Add(new KeyBinding { Command = kvp.Value, Gesture = gesture });\n  119 | \t\t\t}\n  120 | \t\t}","lines":8,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/Data/KeyboardShortcutManager.cs#L113-L120"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"SettingsFile.SaveSettings serializes the static 'instance' field directly (JsonSerializer.Serialize(instance, ...)). If SaveSettings is called before Instance has ever been accessed (instance still null), it serializes null and writes the literal 'null' to Settings.json, corrupting the settings file. MainWindow_Exit calls SaveSettings on exit; most paths touch Instance first, but this is a latent footgun since SaveSettings does not go through the Instance accessor.","fix":"Serialize Instance (the property) instead of the instance field so it is lazily initialized, or guard against null.","locations":[{"ref":"VDF.GUI/Data/SettingsFile.cs:408-411","code":"  408 | \t\tpublic static void SaveSettings(string? path = null) {\n  409 | \t\t\tpath = ResolveSettingsPath(path);\n  410 | \t\t\tFile.WriteAllText(path, JsonSerializer.Serialize(instance, GuiJsonContext.Default.SettingsFile));\n  411 | \t\t}","lines":4,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/Data/SettingsFile.cs#L408-L411"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"FileUtils.CopyFile's collision-avoidance loop starts counter at 0 and builds 'name_0', 'name_1', ... but on File.Move/File.Copy it passes pOverwriteDest. If pOverwriteDest is true, the whole uniquifying loop is pointless work, and worse: the loop already guarantees temppath does not exist, yet still passes overwrite:true - if a concurrent process created the file between the While check and the Move, overwrite:true would clobber it. Conversely with pOverwriteDest=false the loop is correct. The overwrite flag and the dedup loop are contradictory semantics.","fix":"Decide one strategy: if overwrite requested, skip the dedup loop and target name+ext directly; otherwise keep the loop and pass overwrite:false.","locations":[{"ref":"VDF.GUI/Utils/FileUtils.cs:38-48","code":"   38 | \t\t\t\t\tstring temppath = Path.Combine(pDest, name + ext);\n   39 | \t\t\t\t\tvar counter = 0;\n   40 | \t\t\t\t\twhile (File.Exists(temppath)) {\n   41 | \t\t\t\t\t\ttemppath = Path.Combine(pDest, name + '_' + counter + ext);\n   42 | \t\t\t\t\t\tcounter++;\n   43 | \t\t\t\t\t}\n   44 | \n   45 | \t\t\t\t\tif (pMove)\n   46 | \t\t\t\t\t\tFile.Move(s.ItemInfo.Path, temppath, pOverwriteDest);\n   47 | \t\t\t\t\telse\n   48 | \t\t\t\t\t\tFile.Copy(s.ItemInfo.Path, temppath, pOverwriteDest);","lines":11,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/Utils/FileUtils.cs#L38-L48"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"ThumbCacheHelpers.InvalidateIfWidthChanged: when the marker file exists but contains a DIFFERENT width, it calls DeletePackFolder then immediately Directory.CreateDirectory and writes the new marker. But the active ThumbPack (Provider) may have the thumbs.pack/thumbs.idx file streams OPEN on that folder at this time, so the recursive delete can fail (handle in use) on Windows, leaving stale thumbs while the marker now claims the new width - serving mismatched-width thumbnails. There is no coordination with SetActiveProvider/Dispose.","fix":"Ensure the provider for that folder is disposed before invalidating, and verify the delete succeeded before writing the new marker.","locations":[{"ref":"VDF.GUI/Utils/ThumbnailStore.cs:58-72","code":"   58 | \t\tpublic static void InvalidateIfWidthChanged(string packFolder, int currentWidth) {\n   59 | \t\t\ttry {\n   60 | \t\t\t\tvar markerPath = Path.Combine(packFolder, \"thumbwidth.txt\");\n   61 | \t\t\t\tif (File.Exists(markerPath)) {\n   62 | \t\t\t\t\tvar stored = File.ReadAllText(markerPath).Trim();\n   63 | \t\t\t\t\tif (int.TryParse(stored, out var oldWidth) && oldWidth == currentWidth)\n   64 | \t\t\t\t\t\treturn; // width unchanged, cache is valid\n   65 | \t\t\t\t}\n   66 | \t\t\t\t// Width changed or marker doesn't exist — delete the pack so it regenerates\n   67 | \t\t\t\tDeletePackFolder(packFolder);\n   68 | \t\t\t\tDirectory.CreateDirectory(packFolder);\n   69 | \t\t\t\tFile.WriteAllText(Path.Combine(packFolder, \"thumbwidth.txt\"), currentWidth.ToString());\n   70 | \t\t\t}\n   71 | \t\t\tcatch { /* ignore */ }\n   72 | \t\t}","lines":15,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/Utils/ThumbnailStore.cs#L58-L72"},{"ref":"VDF.GUI/Utils/ThumbnailStore.cs:74-80","code":"   74 | \t\tpublic static void SetActiveProvider(ThumbPack? provider) {\n   75 | \t\t\tvar path = Provider?.GetDirectory();\n   76 | \t\t\ttry { Provider?.Dispose(); } catch { }\n   77 | \t\t\tDeletePackFolder(path);\n   78 | \n   79 | \t\t\tProvider = provider;\n   80 | \t\t}","lines":7,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/Utils/ThumbnailStore.cs#L74-L80"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"FilterByPath setter does NOT call view?.Refresh(); it only raises PropertyChanged. The refresh is driven indirectly by the WhenAnyValue(FilterByPath).Throttle(500ms) subscription in the constructor, which calls RebuildSearchPathIndex() + view.Refresh(). But that subscription is the ONLY thing that rebuilds _groupsWithPathHit. If a new results view is built (BuildDuplicatesView) while a path filter is active and the throttle does not re-fire (value unchanged), _groupsWithPathHit can be stale relative to the new Duplicates contents. RebuildSearchPathIndex is called in Scanner_ScanDone but NOT after import unless FilterByPath changes.","fix":"Call RebuildSearchPathIndex() in BuildDuplicatesView() (or right after import) so the path-hit group index always matches the current Duplicates list.","locations":[{"ref":"VDF.GUI/ViewModels/MainWindowVM_Filter.cs:86-94","code":"   86 | \t\tstring _FilterByPath = string.Empty;\n   87 | \t\tpublic string FilterByPath {\n   88 | \t\t\tget => _FilterByPath;\n   89 | \t\t\tset {\n   90 | \t\t\t\tif (value == _FilterByPath) return;\n   91 | \t\t\t\t_FilterByPath = value;\n   92 | \t\t\t\tthis.RaisePropertyChanged(nameof(FilterByPath));\n   93 | \t\t\t}\n   94 | \t\t}","lines":9,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/ViewModels/MainWindowVM_Filter.cs#L86-L94"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"CopyCheckedItemsCommand and MoveCheckedItemsCommand select items via Duplicates.Where(s => s.Checked), ignoring both the visibility filter and the multi-row selection scope, whereas all delete/link/blacklist commands use CheckedItemsToDelete (ScopedDuplicates + IsVisibleInFilter). A user who highlights a subset of rows and has a filter active will copy/move ALL checked items across the whole list, not the scoped/visible ones the rest of the UI operates on. Inconsistent and surprising.","fix":"Use CheckedItemsToDelete (or an equivalent scoped+visible filter) consistently for copy and move.","locations":[{"ref":"VDF.GUI/ViewModels/MainWindowVM_Selection.cs:337","code":"  337 | \t\t\tvar selectedItems = Duplicates.Where(s => s.Checked).ToList();","lines":1,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/ViewModels/MainWindowVM_Selection.cs#L337"},{"ref":"VDF.GUI/ViewModels/MainWindowVM_Selection.cs:337","code":"  337 | \t\t\tvar selectedItems = Duplicates.Where(s => s.Checked).ToList();","lines":1,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/ViewModels/MainWindowVM_Selection.cs#L337"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"BuildPreviewRescan refines candidates by modified time only when UseModifiedTime is true, but the SizeOnly-vs-SizeAndModified confidence and note at line 310-312 use UseDuration/UseModifiedTime flags rather than what actually resolved the match. When UseModifiedTime is false and UseDuration is false and there are multiple same-size candidates, 'filtered' stays equal to all candidates so filteredList.Count > 1 -> Ambiguous; fine. But when UseDuration is true yet e.mediaInfo is null, the duration refinement is skipped (line 297) and a match resolved purely by size+time is still labelled RelocateConfidence.SizeModifiedDuration with note 'Resolved with duration', misrepresenting the actual confidence.","fix":"Track which refinement actually narrowed the set (a bool durationApplied) and derive Confidence/Note from that rather than from the toggle states.","locations":[{"ref":"VDF.GUI/ViewModels/RelocateFilesDialogVM.cs:285-302","code":"  285 | \t\t\t\t// If still many and duration available, refine by duration seconds\n  286 | \t\t\t\tif (UseDuration && e.mediaInfo != null) {\n  287 | \t\t\t\t\tvar durSec = Math.Round(e.mediaInfo.Duration.TotalSeconds, 2);\n  288 | \t\t\t\t\tfiltered = filtered.Where(p => {\n  289 | \t\t\t\t\t\tvar durationSec = QuickMeta.TryRead(p);\n  290 | \t\t\t\t\t\tif (durationSec == null) return false;\n  291 | \t\t\t\t\t\treturn Math.Abs(durationSec.Value - durSec) <= 0.5; // half-second tolerance\n  292 | \t\t\t\t\t}).ToList();\n  293 | \t\t\t\t}\n  294 | \n  295 | \t\t\t\tvar filteredList = filtered.ToList();\n  296 | \t\t\t\tif (filteredList.Count == 1) {\n  297 | \t\t\t\t\tcand.NewPath = filteredList[0];\n  298 | \t\t\t\t\tcand.Selected = true;\n  299 | \t\t\t\t\tcand.Confidence = UseDuration ? RelocateConfidence.SizeModifiedDuration :\n  300 | \t\t\t\t\t\t\t\t\t  (UseModifiedTime ? RelocateConfidence.SizeAndModified : RelocateConfidence.SizeOnly);\n  301 | \t\t\t\t\tcand.Note = $\"Resolved with {(UseDuration ? \"duration\" : (UseModifiedTime ? \"modified time\" : \"size only\"))}\";\n  302 | \t\t\t\t}","lines":18,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/ViewModels/RelocateFilesDialogVM.cs#L285-L302"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"ConfirmClose deletes the backup scan-results file BEFORE awaiting SaveScanResults(). If SaveScanResults() returns false (user chose Cancel in the save prompt) the close is aborted and the window stays open, but the backup file has already been deleted, so a subsequent crash/forced-exit loses the recoverable backup that was supposed to survive. The delete should only happen once the app is actually shutting down.","fix":"Move the backup-file delete to after SaveScanResults() returns true (inside the shutdown branch).","locations":[{"ref":"VDF.GUI/Views/MainWindow.xaml.cs:268-278","code":"  268 | \t\tasync void ConfirmClose() {\n  269 | \t\t\ttry {\n  270 | \t\t\t\tif (!keepBackupFile)\n  271 | \t\t\t\t\tFile.Delete(ApplicationHelpers.MainWindowDataContext.BackupScanResultsFile);\n  272 | \t\t\t}\n  273 | \t\t\tcatch { }\n  274 | \t\t\tif (keepBackupFile = await ApplicationHelpers.MainWindowDataContext.SaveScanResults()) {\n  275 | \t\t\t\tClosing -= MainWindow_Closing;\n  276 | \t\t\t\tApplicationHelpers.CurrentApplicationLifetime.Shutdown();\n  277 | \t\t\t}\n  278 | \t\t}","lines":11,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/Views/MainWindow.xaml.cs#L268-L278"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The authentication gate whitelists any request path that starts with `/app.css` or `/app.js` using `StartsWith` (case-insensitive). `StartsWith` matches prefixes, so paths like `/app.css.secret`, `/app.js/../../something`, or `/app.cssX` are also allowed through unauthenticated. While Blazor/static routing limits practical exploitability, prefix matching on filenames is fragile and broader than intended (e.g. `/_framework` and `/_blazor` prefixes are reasonable, but file names should match exactly).","fix":"Match the exact static file paths (`path == \"/app.css\"`, `path == \"/app.js\"`) instead of `StartsWith`, or serve them from a clearly-prefixed directory.","locations":[{"ref":"VDF.Web/Program.cs:88-97","code":"   88 | \tif (!authService.AuthEnabled\n   89 | \t\t|| path.StartsWith(\"/login\", StringComparison.OrdinalIgnoreCase)\n   90 | \t\t|| path.StartsWith(\"/auth/\", StringComparison.OrdinalIgnoreCase)\n   91 | \t\t|| path.StartsWith(\"/_framework\", StringComparison.OrdinalIgnoreCase)\n   92 | \t\t|| path.StartsWith(\"/_blazor\", StringComparison.OrdinalIgnoreCase)\n   93 | \t\t|| path.StartsWith(\"/app.css\", StringComparison.OrdinalIgnoreCase)\n   94 | \t\t|| path.StartsWith(\"/app.js\", StringComparison.OrdinalIgnoreCase)) {\n   95 | \t\tawait next();\n   96 | \t\treturn;\n   97 | \t}","lines":10,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Web/Program.cs#L88-L97"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"The HQ thumbnail cache is cleared wholesale when it reaches 4096 entries (`if (scan.HqThumbCache.Count >= 4096) scan.HqThumbCache.Clear();`). Because this is a `ConcurrentDictionary` accessed concurrently by many request threads with no coordination, multiple requests can each observe Count >= 4096 and each call Clear(), and Clear() also throws away every other in-flight cache entry. This is a thundering-herd / cache-stampede pattern: at the threshold, throughput collapses as the cache is repeatedly emptied and every concurrent request re-runs FFmpeg. Same pattern with the 64-entry full-res cache.","fix":"Use a bounded LRU cache (e.g. MemoryCache with a size limit) instead of clear-on-threshold, or at minimum evict a fraction rather than Clear() the whole dictionary. Avoid recomputing on every concurrent miss.","locations":[{"ref":"VDF.Web/Program.cs:154-156","code":"  154 | \t\tif (scan.HqThumbCache.Count >= 4096)\n  155 | \t\t\tscan.HqThumbCache.Clear();\n  156 | \t\tscan.HqThumbCache.TryAdd(cacheKey, jpeg);","lines":3,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Web/Program.cs#L154-L156"},{"ref":"VDF.Web/Program.cs:183-185","code":"  183 | \t\tif (scan.FullThumbCache.Count >= 64)\n  184 | \t\t\tscan.FullThumbCache.Clear();\n  185 | \t\tscan.FullThumbCache.TryAdd(cacheKey, jpeg);","lines":3,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Web/Program.cs#L183-L185"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`StrategyParser.Parse` (the CustomParser for the required, non-nullable `mark --strategy`) returns `default` when `ParseToken` returns null on invalid input: `=> ParseToken(result) ?? default`. `default(Strategy)` is `LowestQuality` (enum value 0). `ParseToken` does call `result.AddError(...)` so System.CommandLine should fail the parse before the value is used, but if any future refactor consumes the bound value despite the error, an invalid `--strategy` would silently bind to `LowestQuality` rather than failing. The `?? default` masks the error rather than rethrowing.","fix":"Since an error is already added, the fallback value is cosmetic, but `?? default` is misleading; consider returning the parsed strategy only and relying on the framework's error handling, or document that the value is unused on error.","locations":[{"ref":"VDF.CLI/Actions/DeletionStrategy.cs:55","code":"   55 | \t\tpublic static Strategy Parse(ArgumentResult result) => ParseToken(result) ?? default;","lines":1,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.CLI/Actions/DeletionStrategy.cs#L55"},{"ref":"VDF.CLI/Actions/DeletionStrategy.cs:60-66","code":"   60 | \t\tstatic Strategy? ParseToken(ArgumentResult result) {\n   61 | \t\t\tstring? token = result.Tokens.Count > 0 ? result.Tokens[0].Value : null;\n   62 | \t\t\tif (TryParse(token, out var strategy))\n   63 | \t\t\t\treturn strategy;\n   64 | \t\t\tresult.AddError($\"Invalid strategy '{token}'. Valid values: {string.Join(\", \", Names)}.\");\n   65 | \t\t\treturn null;\n   66 | \t\t}","lines":7,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.CLI/Actions/DeletionStrategy.cs#L60-L66"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`MarkCommand.MoveToTrash` Linux/macOS branches do not implement the XDG trash `.trashinfo` metadata files, so files moved to `~/.local/share/Trash/files/` are not properly recognized/restorable by desktop trash tooling (no entry in `Trash/info/`). They also collision-rename within the trash dir but never record the original path, making 'restore' impossible. Functionally the file is removed from its location (the user's goal) but calling it 'moved to trash' overstates recoverability.","fix":"Write a corresponding `.trashinfo` file under `Trash/info/` with the original Path and DeletionDate per the XDG Trash spec, or document that CLI trashing is not desktop-restorable.","locations":[{"ref":"VDF.CLI/Commands/MarkCommand.cs:150-167","code":"  150 | \t\t\telse if (OperatingSystem.IsLinux()) {\n  151 | \t\t\t\t// XDG trash specification: move to ~/.local/share/Trash/files/\n  152 | \t\t\t\tstring trashDir = Path.Combine(\n  153 | \t\t\t\t\tEnvironment.GetFolderPath(Environment.SpecialFolder.UserProfile),\n  154 | \t\t\t\t\t\".local\", \"share\", \"Trash\", \"files\");\n  155 | \t\t\t\tDirectory.CreateDirectory(trashDir);\n  156 | \t\t\t\t// Skip trash for cross-filesystem files (e.g. network shares) to avoid downloading\n  157 | \t\t\t\tif (!VDF.Core.Utils.FileUtils.IsOnSameFileSystem(path, trashDir)) {\n  158 | \t\t\t\t\tFile.Delete(path);\n  159 | \t\t\t\t\treturn;\n  160 | \t\t\t\t}\n  161 | \t\t\t\tstring dest = Path.Combine(trashDir, Path.GetFileName(path));\n  162 | \t\t\t\t// Avoid overwriting existing trash entries\n  163 | \t\t\t\tint n = 1;\n  164 | \t\t\t\twhile (File.Exists(dest))\n  165 | \t\t\t\t\tdest = Path.Combine(trashDir, $\"{Path.GetFileNameWithoutExtension(path)}_{n++}{Path.GetExtension(path)}\");\n  166 | \t\t\t\tFile.Move(path, dest);\n  167 | \t\t\t}","lines":18,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.CLI/Commands/MarkCommand.cs#L150-L167"},{"ref":"VDF.CLI/Commands/MarkCommand.cs:168-184","code":"  168 | \t\t\telse if (OperatingSystem.IsMacOS()) {\n  169 | \t\t\t\t// macOS: move to ~/.Trash/\n  170 | \t\t\t\tstring trashDir = Path.Combine(\n  171 | \t\t\t\t\tEnvironment.GetFolderPath(Environment.SpecialFolder.UserProfile),\n  172 | \t\t\t\t\t\".Trash\");\n  173 | \t\t\t\tDirectory.CreateDirectory(trashDir);\n  174 | \t\t\t\t// Skip trash for cross-volume files to avoid cross-volume copy\n  175 | \t\t\t\tif (!VDF.Core.Utils.FileUtils.IsOnSameFileSystem(path, trashDir)) {\n  176 | \t\t\t\t\tFile.Delete(path);\n  177 | \t\t\t\t\treturn;\n  178 | \t\t\t\t}\n  179 | \t\t\t\tstring dest = Path.Combine(trashDir, Path.GetFileName(path));\n  180 | \t\t\t\tint n = 1;\n  181 | \t\t\t\twhile (File.Exists(dest))\n  182 | \t\t\t\t\tdest = Path.Combine(trashDir, $\"{Path.GetFileNameWithoutExtension(path)}_{n++}{Path.GetExtension(path)}\");\n  183 | \t\t\t\tFile.Move(path, dest);\n  184 | \t\t\t}","lines":17,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.CLI/Commands/MarkCommand.cs#L168-L184"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"`ScanRunner.RunScanAndCompareAsync` runs `RunSearchAsync` then `RunCompareAsync`, but `WireProgress` and the per-run methods both subscribe to `ScanAborted`. In `RunSearchAsync` the abort handler `OnAborted` cancels the search TCS; the same `ScanAborted` is also subscribed by `WireProgress` (printing 'Aborted'). That is intended. However, `RunSearchAsync` subscribes `ScanAborted` and unsubscribes it after the search; if an abort fires during the COMPARE phase, `RunCompareAsync` handles it. Fine — but if `engine.Stop()` is invoked via the cancellation-token Register callback during RunSearchAsync, `tcs.TrySetCanceled()` is also called directly AND the engine may later raise ScanAborted, double-signaling. The TrySet* guards make this benign, but the cancellation path both calls Stop() and cancels the TCS without waiting for the engine to actually wind down, so the engine may still be running after the await returns.","fix":"On cancellation, prefer letting the engine's ScanAborted event complete the TCS rather than also force-cancelling it, so the await does not return while the engine thread is still active (which can race the subsequent SaveDatabase).","locations":[{"ref":"VDF.CLI/Commands/ScanRunner.cs:56-75","code":"   56 | \t\tinternal static async Task RunSearchAsync(ScanEngine engine, CancellationToken ct) {\n   57 | \t\t\tvar tcs = new TaskCompletionSource(TaskCreationOptions.RunContinuationsAsynchronously);\n   58 | \n   59 | \t\t\tengine.BuildingHashesDone += OnDone;\n   60 | \t\t\tengine.ScanAborted += OnAborted;\n   61 | \t\t\tct.Register(() => { engine.Stop(); tcs.TrySetCanceled(); });\n   62 | \n   63 | \t\t\t// searchAndCompare:false — the CLI drives comparison as a separate awaitable step\n   64 | \t\t\t// (RunCompareAsync). Letting StartSearch auto-chain into StartCompare would run the\n   65 | \t\t\t// comparison twice, and the two concurrent SaveDatabase calls crash on the temp\n   66 | \t\t\t// database file (#803).\n   67 | \t\t\tengine.StartSearch(searchAndCompare: false);\n   68 | \t\t\tawait tcs.Task;\n   69 | \n   70 | \t\t\tengine.BuildingHashesDone -= OnDone;\n   71 | \t\t\tengine.ScanAborted -= OnAborted;\n   72 | \n   73 | \t\t\tvoid OnDone(object? s, EventArgs e) => tcs.TrySetResult();\n   74 | \t\t\tvoid OnAborted(object? s, EventArgs e) => tcs.TrySetCanceled();\n   75 | \t\t}","lines":20,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.CLI/Commands/ScanRunner.cs#L56-L75"},{"ref":"VDF.CLI/Commands/ScanRunner.cs:61","code":"   61 | \t\t\tct.Register(() => { engine.Stop(); tcs.TrySetCanceled(); });","lines":1,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.CLI/Commands/ScanRunner.cs#L61"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"AggregateMajorityVote uses threshold = count/2 + 1 with the condition `count >= threshold`. For an even number of frames this requires a strict majority (good), but for count==1 threshold==1 so a lone frame's bits pass (fine), and for count==2 threshold==2 so a bit must be set in BOTH frames - i.e. a 1-of-2 split yields 0. The doc comment says 'more than half', which for 2 frames means >1 = 2, so it is technically consistent, but the +1 makes it require strictly more than half rather than 'at least half', which differs from typical Chromaprint majority aggregation and can bias bits toward 0 for small buckets (the last partial second often has few frames).","fix":"Confirm the intended tie-breaking. If 'at least half' is wanted use `threshold = (count + 1) / 2` and `count >= threshold`; document the choice either way since it materially affects fingerprints of short final buckets.","locations":[{"ref":"VDF.Core/Chromaprint/Pipeline/FingerprintCalculator.cs:58-72","code":"   58 | \t\tinternal static uint AggregateMajorityVote(List<uint> fingerprints) {\n   59 | \t\t\tif (fingerprints.Count == 0) return 0u;\n   60 | \t\t\tint threshold = fingerprints.Count / 2 + 1;\n   61 | \t\t\tuint result = 0u;\n   62 | \t\t\tfor (int bit = 0; bit < 32; bit++) {\n   63 | \t\t\t\tuint mask = 1u << bit;\n   64 | \t\t\t\tint count = 0;\n   65 | \t\t\t\tfor (int i = 0; i < fingerprints.Count; i++)\n   66 | \t\t\t\t\tif ((fingerprints[i] & mask) != 0)\n   67 | \t\t\t\t\t\tcount++;\n   68 | \t\t\t\tif (count >= threshold)\n   69 | \t\t\t\t\tresult |= mask;\n   70 | \t\t\t}\n   71 | \t\t\treturn result;\n   72 | \t\t}","lines":15,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Core/Chromaprint/Pipeline/FingerprintCalculator.cs#L58-L72"}]},
{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"EntryFlagExtensions.Any uses (f & checkFlags) > 0, but EntryFlags is a signed int-backed [Flags] enum. None of the currently-defined bits set the sign bit, but if a future flag uses bit 31 the value becomes negative and '> 0' would wrongly report absence. The companion Has uses '== checkFlags' which is correct; Any should use '!= 0' for safety.","fix":"Use (f & checkFlags) != 0 instead of > 0.","locations":[{"ref":"VDF.Core/EntryFlags.cs:39","code":"   39 | \t\tpublic static bool Any(this EntryFlags f, EntryFlags checkFlags) => (f & checkFlags) > 0;","lines":1,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Core/EntryFlags.cs#L39"}]},
{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"FFProbeJsonReader treats any PropertyName equal to 'index' as the start of a new stream object and appends a new dictionary, regardless of nesting depth. A nested object (e.g. a stream's side_data, disposition, or tags) that contains a key literally named 'index' would spuriously create an extra empty stream entry, shifting subsequent stream data. The parser is depth-agnostic and relies on FFprobe never nesting an 'index' key.","fix":"Track object depth and only treat 'index' as a new stream when at the streams-array element level.","locations":[{"ref":"VDF.Core/FFTools/FFProbeJsonReader.cs:77-80","code":"   77 | \t\t\t\t\tif (valueSpan.SequenceEqual(IndexKeyword)) {\n   78 | \t\t\t\t\t\tstreams.Add(new Dictionary<string, object>());\n   79 | \t\t\t\t\t\tcurrentStream++;\n   80 | \t\t\t\t\t}","lines":4,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Core/FFTools/FFProbeJsonReader.cs#L77-L80"}]},
{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"AudioStreamDecoder constructor: when av_find_best_stream returns <0 it sets HasAudioStream=false and returns from the ctor early (line 81-84) WITHOUT allocating _pPacket/_pFrame and WITHOUT closing the already-opened _pFormatContext/_pCodecContext-not-yet-allocated. That is fine for the no-audio case since Dispose handles nulls, but the format context stays open (held file handle) until Dispose. Since the caller checks HasAudioStream and disposes via using, acceptable, but the early return leaves a fully-opened demuxer alive on a no-audio file longer than necessary.","fix":"Acceptable given Dispose; optionally close the format context immediately when no audio stream is found.","locations":[{"ref":"VDF.Core/FFTools/FFmpegNative/AudioStreamDecoder.cs:91-94","code":"   91 | \t\t\tif (streamIdx < 0) {\n   92 | \t\t\t\tHasAudioStream = false;\n   93 | \t\t\t\treturn;\n   94 | \t\t\t}","lines":4,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Core/FFTools/FFmpegNative/AudioStreamDecoder.cs#L91-L94"}]},
{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"InvalidEntry sets EntryFlags.MetadataError as a side effect when a path is not FFmpeg-safe (UTF-8 surrogate). Because CleanupDatabase removes any entry with MetadataError, and InvalidEntry is also called from the read-only diagnostic TestFilePair (ScanEngine_Diagnostic line 119), running the pair test on such a file silently stamps a persistent flag on a database entry the user did not intend to modify. TestFilePair claims it 'does not read or modify the scan database'.","fix":"Don't mutate entry flags inside InvalidEntry; return the reason and let the caller decide whether to persist. In the diagnostic path operate on a throwaway FileEntry (it already constructs new FileEntry instances, so ensure the flag isn't written back to a DB entry).","locations":[{"ref":"VDF.Core/ScanEngine.cs:849-853","code":"  849 | \t\t\tif (!FileUtils.IsPathFFmpegSafe(entry.Path)) {\n  850 | \t\t\t\tentry.Flags.Set(EntryFlags.MetadataError);\n  851 | \t\t\t\treason = \"path contains characters not encodable to UTF-8 (e.g. lone surrogate from a mangled emoji) — FFmpeg cannot open it\";\n  852 | \t\t\t\treturn true;\n  853 | \t\t\t}","lines":5,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Core/ScanEngine.cs#L849-L853"},{"ref":"VDF.Core/ScanEngine_Diagnostic.cs:120-130","code":"  120 | \t\t\tfor (int i = 0; i < 2; i++) {\n  121 | \t\t\t\tFileEntry entry = entries[i]!;\n  122 | \t\t\t\tif (InvalidEntry(entry, out _, out string? reason) && reason != null) {\n  123 | \t\t\t\t\tsb.AppendLine($\"{labels[i]}: WARNING — a real scan would skip this file: {reason}.\");\n  124 | \t\t\t\t\tscanInclusionIssues.Add($\"File {labels[i]} would be skipped by a scan: {reason}.\");\n  125 | \t\t\t\t}\n  126 | \t\t\t\telse {\n  127 | \t\t\t\t\tsb.AppendLine($\"{labels[i]}: OK — file would be included in a scan.\");\n  128 | \t\t\t\t}\n  129 | \t\t\t\tentry.invalid = false;\n  130 | \t\t\t}","lines":11,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Core/ScanEngine_Diagnostic.cs#L120-L130"},{"ref":"VDF.Core/Utils/DatabaseUtils.cs:190","code":"  190 | \t\t\t\tDatabase.RemoveWhere(a => !File.Exists(a.Path) || a.Flags.Any(EntryFlags.MetadataError | EntryFlags.ThumbnailError));","lines":1,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Core/Utils/DatabaseUtils.cs#L190"}]},
{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"In ScanForDuplicates, MergeDuplicate's group-merge branch (foundBase && foundComp, different groups) relabels the absorbed group's members and removes its representative, but does NOT add the current (entry, compItem) pair into either dictionary if both already exist — which is correct — however it never re-validates that the bridging pair actually connects; the representative-similarity check uses the two group representatives, not the actual matched pair. A genuine match between two members whose representatives happen to differ slightly is blocked (mergesBlocked++), silently dropping a valid merge. This is a heuristic with real false-negative potential.","fix":"Document the heuristic's false-negative tradeoff, or compare the actual matched pair (entry vs compItem) in addition to representatives before blocking a merge.","locations":[{"ref":"VDF.Core/ScanEngine.cs:1734-1758","code":" 1734 | \t\t\t\t\tif (foundBase && foundComp) {\n 1735 | \t\t\t\t\t\t//this happens with 4+ identical items:\n 1736 | \t\t\t\t\t\t//first, 2+ duplicate groups are found independently, they are merged in this branch\n 1737 | \t\t\t\t\t\tif (existingBase!.GroupId != existingComp!.GroupId) {\n 1738 | \t\t\t\t\t\t\t// Before merging two groups, verify that the representative\n 1739 | \t\t\t\t\t\t\t// of each group is similar to the other group's representative.\n 1740 | \t\t\t\t\t\t\t// This prevents daisy-chain merging where a single bridging\n 1741 | \t\t\t\t\t\t\t// pair pulls two unrelated groups together.\n 1742 | \t\t\t\t\t\t\tif (groupRepresentatives.TryGetValue(existingBase.GroupId, out var repBase) &&\n 1743 | \t\t\t\t\t\t\t\tgroupRepresentatives.TryGetValue(existingComp.GroupId, out var repComp) &&\n 1744 | \t\t\t\t\t\t\t\t!CheckIfDuplicate(repBase, null, null, repComp, out _)) {\n 1745 | \t\t\t\t\t\t\t\tmergesBlocked++;\n 1746 | \t\t\t\t\t\t\t\treturn; // Representatives aren't similar — don't merge.\n 1747 | \t\t\t\t\t\t\t}\n 1748 | \t\t\t\t\t\t\tGuid groupID = existingComp!.GroupId;\n 1749 | \t\t\t\t\t\t\tList<DuplicateItem> baseMembers = groupMembers[existingBase.GroupId];\n 1750 | \t\t\t\t\t\t\tforeach (DuplicateItem dup in groupMembers[groupID]) {\n 1751 | \t\t\t\t\t\t\t\tdup.GroupId = existingBase.GroupId;\n 1752 | \t\t\t\t\t\t\t\tbaseMembers.Add(dup);\n 1753 | \t\t\t\t\t\t\t}\n 1754 | \t\t\t\t\t\t\tgroupMembers.Remove(groupID);\n 1755 | \t\t\t\t\t\t\t// Keep the representative of the absorbing group; remove the merged one.\n 1756 | \t\t\t\t\t\t\tgroupRepresentatives.Remove(groupID);\n 1757 | \t\t\t\t\t\t}\n 1758 | \t\t\t\t\t}","lines":25,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Core/ScanEngine.cs#L1734-L1758"}]},
{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"VerifyGrayScaleValues computes `100d / data.Length * darkPixels` with no guard for data.Length==0, producing a divide-by-zero -> Infinity/NaN if ever called with an empty array. Current callers pass fixed 1024-byte buffers so it does not fire today, but it is an unguarded public method.","fix":"Return true (or false) early when data.Length == 0, e.g. `if (data.Length == 0) return true;`.","locations":[{"ref":"VDF.Core/Utils/GrayBytesUtils.cs:42-50","code":"   42 | \t\tpublic static bool VerifyGrayScaleValues(byte[] data, double darkProcent = 80) {\n   43 | \t\t\tint darkPixels = 0;\n   44 | \t\t\t// ReSharper disable once LoopCanBeConvertedToQuery\n   45 | \t\t\tfor (int i = 0; i < data.Length; i++) {\n   46 | \t\t\t\tif (data[i] <= BlackPixelLimit)\n   47 | \t\t\t\t\tdarkPixels++;\n   48 | \t\t\t}\n   49 | \t\t\treturn 100d / data.Length * darkPixels < darkProcent;\n   50 | \t\t}","lines":9,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Core/Utils/GrayBytesUtils.cs#L42-L50"}]},
{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"PathRelocator.RelocateByPrefix and RelocateFilesDialogVM.BuildPreviewPrefix compute suffix = full.Substring(oldPrefix.Length) then Path.Combine(newPrefix, suffix). NormalizePrefixPublic ensures oldPrefix ends in a separator, so suffix has no leading separator - good. But on Windows StartsWith uses OrdinalIgnoreCase while Substring uses the original-cased 'full'; that's fine. The real issue: if oldPrefix is a drive root like 'C:\\' GetFullPath of an entry 'C:\\a' yields 'C:\\a', StartsWith('C:\\') true, suffix 'a' - correct. However a path that merely shares a prefix string but a different directory (e.g. old 'C:\\Foo' normalized 'C:\\Foo\\' vs 'C:\\Foobar') is correctly excluded by the trailing separator. No bug in exclusion, but RelocateByPrefix mutates fe.Path to a non-full-path (Path.Combine result not GetFullPath'd) whereas the dialog's ApplyImpl does GetFullPath - inconsistent stored path normalization between the two code paths.","fix":"Normalize the resulting path consistently (GetFullPath) in both places.","locations":[{"ref":"VDF.GUI/Data/PathRelocator.cs:38-54","code":"   38 | \t\tpublic static int RelocateByPrefix(IEnumerable<FileEntry> entries, string oldPrefix, string newPrefix) {\n   39 | \t\t\tvar comparison = (CoreUtils.IsWindows ? StringComparison.OrdinalIgnoreCase : StringComparison.Ordinal);\n   40 | \t\t\toldPrefix = NormalizePrefixPublic(oldPrefix);\n   41 | \t\t\tnewPrefix = NormalizePrefixPublic(newPrefix);\n   42 | \n   43 | \t\t\tint changed = 0;\n   44 | \t\t\tforeach (var fe in entries) {\n   45 | \t\t\t\tvar full = Path.GetFullPath(fe.Path);\n   46 | \t\t\t\tif (full.StartsWith(oldPrefix, comparison)) {\n   47 | \t\t\t\t\tvar suffix = full.Substring(oldPrefix.Length);\n   48 | \t\t\t\t\tvar newPath = Path.Combine(newPrefix, suffix);\n   49 | \t\t\t\t\tfe.Path = newPath;\n   50 | \t\t\t\t\tchanged++;\n   51 | \t\t\t\t}\n   52 | \t\t\t}\n   53 | \t\t\treturn changed;\n   54 | \t\t}","lines":17,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/Data/PathRelocator.cs#L38-L54"},{"ref":"VDF.GUI/ViewModels/RelocateFilesDialogVM.cs:196-222","code":"  196 | \t\tvoid BuildPreviewPrefix() {\n  197 | \t\t\t// Normalize\n  198 | \t\t\tstring oldP = PathRelocator.NormalizePrefixPublic(OldPrefix);\n  199 | \t\t\tstring newP = PathRelocator.NormalizePrefixPublic(NewPrefix);\n  200 | \t\t\tif (string.IsNullOrWhiteSpace(oldP) || string.IsNullOrWhiteSpace(newP)) return;\n  201 | \n  202 | \t\t\tvar comparison = (CoreUtils.IsWindows ? StringComparison.OrdinalIgnoreCase : StringComparison.Ordinal);\n  203 | \n  204 | \t\t\tList<RelocateCandidate> candidates = new();\n  205 | \n  206 | \t\t\tforeach (var e in _entries) {\n  207 | \t\t\t\tvar full = Path.GetFullPath(e.Path);\n  208 | \t\t\t\tif (full.StartsWith(oldP, comparison)) {\n  209 | \t\t\t\t\tvar suffix = full.Substring(oldP.Length);\n  210 | \t\t\t\t\tvar newPath = Path.Combine(newP, suffix);\n  211 | \n  212 | \t\t\t\t\tvar cand = new RelocateCandidate(e) {\n  213 | \t\t\t\t\t\tNewPath = newPath,\n  214 | \t\t\t\t\t\tConfidence = RelocateConfidence.Prefix,\n  215 | \t\t\t\t\t\tNote = \"Prefix replace\",\n  216 | \t\t\t\t\t\tSelected = true\n  217 | \t\t\t\t\t};\n  218 | \t\t\t\t\tcandidates.Add(cand);\n  219 | \t\t\t\t}\n  220 | \t\t\t}\n  221 | \t\t\tPreview.AddRange(candidates);\n  222 | \t\t}","lines":27,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/ViewModels/RelocateFilesDialogVM.cs#L196-L222"}]},
{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"LoadOldSettings parses legacy <Percent> as int (int.TryParse) and assigns to Instance.Percent which is a float defaulting to 95. Old settings that stored a fractional percent would fail int.TryParse and be silently dropped, and the XML migration then deletes the .xml file (File.Delete at line 639) regardless of whether every value migrated, so any unparsed/legacy-only setting is lost permanently.","fix":"Use float.TryParse for Percent; only delete the legacy file after confirming the new JSON was written successfully (it currently is written first, which is fine, but consider keeping a .bak).","locations":[{"ref":"VDF.GUI/Data/SettingsFile.cs:686-688","code":"  686 | \t\t\tforeach (var n in xDoc.Descendants(\"Percent\"))\n  687 | \t\t\t\tif (int.TryParse(n.Value, out var value))\n  688 | \t\t\t\t\tInstance.Percent = value;","lines":3,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/Data/SettingsFile.cs#L686-L688"},{"ref":"VDF.GUI/Data/SettingsFile.cs:742-744","code":"  742 | \t\t\tSaveSettings(Path.ChangeExtension(path, \"json\"));\n  743 | \t\t\tFile.Delete(path);\n  744 | \t\t\treturn true;","lines":3,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/Data/SettingsFile.cs#L742-L744"}]},
{"id":"LOGIC_33","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"LanguageService.LoadLanguage on failure recurses to LoadLanguage(\"en\"); if the en.json asset is also missing/corrupt the catch sets _translations = new() and returns, but CurrentLanguage was already RaiseAndSet to the bad code, so the UI thinks the requested (non-working) language is active while showing raw keys. State (CurrentLanguage) and actual loaded translations diverge with no reset.","fix":"On fallback, also reset _currentLanguage to the language that actually loaded.","locations":[{"ref":"VDF.GUI/LanguageService.cs:42-57","code":"   42 | \t\tpublic void LoadLanguage(string langCode) {\n   43 | \t\t\ttry {\n   44 | \t\t\t\tvar uri = new Uri($\"avares://VDF.GUI/Assets/Locales/{langCode}.json\");\n   45 | \t\t\t\tusing var stream = AssetLoader.Open(uri);\n   46 | \t\t\t\tusing var reader = new StreamReader(stream);\n   47 | \t\t\t\tvar json = reader.ReadToEnd();\n   48 | \t\t\t\t_translations = JsonSerializer.Deserialize(json, Data.GuiJsonContext.Default.DictionaryStringString) ?? new();\n   49 | \t\t\t\tthis.RaisePropertyChanged(\"Item[]\");\n   50 | \t\t\t}\n   51 | \t\t\tcatch (Exception) {\n   52 | \t\t\t\tif (langCode != \"en\")\n   53 | \t\t\t\t\tLoadLanguage(\"en\");\n   54 | \t\t\t\telse\n   55 | \t\t\t\t\t_translations = new();\n   56 | \t\t\t}\n   57 | \t\t}","lines":16,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/LanguageService.cs#L42-L57"}]},
