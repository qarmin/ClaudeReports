{"id":"LOGIC_34","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"NegateBoolConverter and several converters do '!(bool)value!' / '(bool)value!' / '(DateTime)value!' with no type check. When the bound source is null or UnsetValue (common during DataGrid virtualization/teardown), the unboxing cast throws InvalidCastException/NullReferenceException inside the converter. Avalonia logs binding errors rather than crashing, but these throw on every transient null instead of returning a sensible default like the other converters that pattern-match (e.g. SimilarityToFormattedConverter).","fix":"Pattern-match (value is bool b) / (value is DateTime dt) and return a default (BindingOperations.DoNothing or AvaloniaProperty.UnsetValue) otherwise.","locations":[{"ref":"VDF.GUI/Mvvm/Converters.cs:27-31","code":"   27 | \tpublic sealed class NegateBoolConverter : IValueConverter {\n   28 | \t\tpublic object Convert(object? value, Type targetType, object? parameter, CultureInfo culture) => !(bool)value!;\n   29 | \n   30 | \t\tpublic object ConvertBack(object? value, Type targetType, object? parameter, CultureInfo culture) => !(bool)value!;\n   31 | \t}","lines":5,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/Mvvm/Converters.cs#L27-L31"},{"ref":"VDF.GUI/Mvvm/Converters.cs:84-89","code":"   84 | \tpublic sealed class ExtraShortDateTimeConverter : IValueConverter {\n   85 | \n   86 | \t\tpublic object Convert(object? value, Type targetType, object? parameter, CultureInfo culture) => ExtraShortDateTimeFormater.DateToString((DateTime)value!);\n   87 | \n   88 | \t\tpublic object ConvertBack(object? value, Type targetType, object? parameter, CultureInfo culture) => throw new NotImplementedException();\n   89 | \t}","lines":6,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/Mvvm/Converters.cs#L84-L89"}]},
{"id":"LOGIC_35","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"ConsoleAttach.EnsureConsole / Program.Main: on Windows when launched from a GUI shell, AttachConsole(PARENT) fails and AllocConsole creates a new console, but after rootCommand.Parse(args).Invoke() returns the process exits and the allocated console window vanishes immediately, so error/help text the user was meant to read disappears instantly. Also Main calls rootCommand.Parse(args) twice (line 58 and line 63) - the first parse result is only used to decide console attach; parsing twice is wasteful and the SetAction runs on the second parse only.","fix":"Parse once and reuse the ParseResult; consider a pause/keypress when a console was newly allocated for help/errors.","locations":[{"ref":"VDF.GUI/Program.cs:57-62","code":"   57 | \t\t\tvar parseResult = rootCommand.Parse(args);\n   58 | \t\t\t// If help requested OR parse errors -> we want console output\n   59 | \t\t\tif (parseResult.Errors.Count > 0 || args.Contains(\"-h\") || args.Contains(\"--help\") || args.Contains(\"-?\")) {\n   60 | \t\t\t\tConsoleAttach.EnsureConsole();\n   61 | \t\t\t}\n   62 | \t\t\treturn rootCommand.Parse(args).Invoke();","lines":6,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/Program.cs#L57-L62"},{"ref":"VDF.GUI/Utils/ConsoleAttach.cs:34-40","code":"   34 | \t\tpublic static void EnsureConsole() {\n   35 | \t\t\tif (!OperatingSystem.IsWindows())\n   36 | \t\t\t\treturn;\n   37 | \t\t\t// Try parent console first (started from cmd/terminal), otherwise create one\n   38 | \t\t\tif (!AttachConsole(ATTACH_PARENT_PROCESS))\n   39 | \t\t\t\tAllocConsole();\n   40 | \t\t}","lines":7,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/Utils/ConsoleAttach.cs#L34-L40"}]},
{"id":"LOGIC_36","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"DesktopNotificationHelper.NotifyWindows injects EscapeXml(title)/EscapeXml(message) into a PowerShell string that is base64-encoded, but the AppName is interpolated raw into a single-quoted PowerShell string ('{{AppName}}'); AppName is a constant here so safe, yet the pattern is fragile. More concretely: Process.Start results are never disposed (the returned Process objects from NotifyWindows/MacOS/Linux are leaked), accumulating Process handles if notifications fire frequently (e.g. NotifyOnScanComplete on repeated scheduled scans).","fix":"Dispose the Process returned by Process.Start (using/dispose), since these are fire-and-forget.","locations":[{"ref":"VDF.GUI/Utils/DesktopNotificationHelper.cs:59-61","code":"   59 | \t\tProcess.Start(new ProcessStartInfo(\"powershell\", $\"-NoProfile -WindowStyle Hidden -EncodedCommand {encoded}\") {\n   60 | \t\t\tCreateNoWindow = true\n   61 | \t\t});","lines":3,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/Utils/DesktopNotificationHelper.cs#L59-L61"},{"ref":"VDF.GUI/Utils/DesktopNotificationHelper.cs:70","code":"   70 | \t\tProcess.Start(psi);","lines":1,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/Utils/DesktopNotificationHelper.cs#L70"},{"ref":"VDF.GUI/Utils/DesktopNotificationHelper.cs:81","code":"   81 | \t}","lines":1,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/Utils/DesktopNotificationHelper.cs#L81"}]},
{"id":"LOGIC_37","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"StreamSlice.Read locks on the shared FileStream _fs, seeks, and reads - but multiple StreamSlice instances created by OpenKey each wrap their OWN new FileStream (OpenKey opens a fresh FileStream per call), so the lock(_fs) is per-instance and provides no cross-slice protection. That is actually safe here, but the lock is misleading and unnecessary; more importantly, the StreamSlice over the SHARED _fs used by CopyTo path is never exercised, so the lock(_fs) intent (guarding the shared append stream) is not what actually happens. Dead/misleading synchronization.","fix":"Document that each StreamSlice owns a private FileStream, or remove the now-meaningless lock; ensure leaveOpen handling (see separate finding) actually closes it.","locations":[{"ref":"VDF.GUI/Utils/ThumbnailStore.cs:248-256","code":"  248 | \t\tpublic override int Read(byte[] buffer, int offset, int count) {\n  249 | \t\t\tcount = (int)Math.Min(count, _len - _pos);\n  250 | \t\t\tif (count <= 0) return 0;\n  251 | \t\t\tlock (_fs) {\n  252 | \t\t\t\t_fs.Seek(_start + _pos, SeekOrigin.Begin);\n  253 | \t\t\t\tint n = _fs.Read(buffer, offset, count);\n  254 | \t\t\t\t_pos += n; return n;\n  255 | \t\t\t}\n  256 | \t\t}","lines":9,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/Utils/ThumbnailStore.cs#L248-L256"}]},
{"id":"LOGIC_38","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"CustomSelectionVM.RemoveFilePathContainsTextFromListCommand (and the NotContains twin) loop 'while (lbox.SelectedItems?.Count > 0) Data.PathContains.Remove((string)lbox.SelectedItems[0]!)'. If a selected string is NOT actually present in Data.PathContains (e.g. selection out of sync with the bound list), Remove returns false and does not shrink SelectedItems, producing an infinite loop. Removing from the source collection is what updates SelectedItems indirectly; relying on that as the loop terminator is fragile.","fix":"Snapshot lbox.SelectedItems to a list first, then remove each from Data.PathContains; don't loop on SelectedItems.Count.","locations":[{"ref":"VDF.GUI/ViewModels/CustomSelectionVM.cs:97-116","code":"   97 | \t\t[JsonIgnore]\n   98 | \t\tpublic ReactiveCommand<ListBox, Action> RemoveFilePathContainsTextFromListCommand => ReactiveCommand.Create<ListBox, Action>(lbox => {\n   99 | \t\t\twhile (lbox.SelectedItems?.Count > 0)\n  100 | \t\t\t\tData.PathContains.Remove((string)lbox.SelectedItems[0]!);\n  101 | \t\t\treturn null!;\n  102 | \t\t});\n  103 | \t\t[JsonIgnore]\n  104 | \t\tpublic ReactiveCommand<ListBox, Action> AddFilePathNotContainsTextToListCommand => ReactiveCommand.CreateFromTask<ListBox, Action>(async lbox => {\n  105 | \t\t\tvar result = await PromptForWildcardEntryAsync(App.Lang[\"Dialog.Add\"], string.Empty);\n  106 | \t\t\tif (string.IsNullOrEmpty(result)) return null!;\n  107 | \t\t\tif (!Data.PathNotContains.Contains(result))\n  108 | \t\t\t\tData.PathNotContains.Add(result);\n  109 | \t\t\treturn null!;\n  110 | \t\t});\n  111 | \t\t[JsonIgnore]\n  112 | \t\tpublic ReactiveCommand<ListBox, Action> RemoveFilePathNotContainsTextFromListCommand => ReactiveCommand.Create<ListBox, Action>(lbox => {\n  113 | \t\t\twhile (lbox.SelectedItems?.Count > 0)\n  114 | \t\t\t\tData.PathNotContains.Remove((string)lbox.SelectedItems[0]!);\n  115 | \t\t\treturn null!;\n  116 | \t\t});","lines":20,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/ViewModels/CustomSelectionVM.cs#L97-L116"}]},
{"id":"LOGIC_39","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"DuplicateItemVM.Thumbnail getter throws InvalidOperationException in DEBUG builds when ThumbCacheHelpers.Provider is null. This getter is bound by the DataGrid and can be evaluated on the UI thread during teardown/early init when the provider has been cleared (SafeCleanup sets Provider = null on exit/unhandled-exception). A throwing property getter on a bound property is dangerous; in DEBUG it can crash the debugger session during normal shutdown.","fix":"Return null instead of throwing even in DEBUG, or guard so it never throws from a binding evaluation.","locations":[{"ref":"VDF.GUI/ViewModels/DuplicateItemVM.cs:174-179","code":"  174 | \t\t\t\tif (ThumbCacheHelpers.Provider == null)\n  175 | #if DEBUG\n  176 | \t\t\t\t\tthrow new InvalidOperationException(\"No active thumbnail provider\");\n  177 | #else\n  178 | \t\t\t\t\treturn null;\n  179 | #endif","lines":6,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/ViewModels/DuplicateItemVM.cs#L174-L179"}]},
{"id":"LOGIC_40","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"Selection-undo recording infers the pre-change value as '!item.Checked' (RecordCheckedChangeForUndo line 249) under the assumption PropertyChanged fires AFTER the value flipped and that the value actually toggled. If any code raises PropertyChanged(Checked) without changing the value, or sets Checked to its current value, the recorded OldChecked is wrong (the inverse of the unchanged value), so Ctrl+Z will flip an item that was never changed.","fix":"Capture the old value at the actual mutation site (in DuplicateItemVM's Checked setter, passing old+new) rather than inferring it from the post-change state.","locations":[{"ref":"VDF.GUI/ViewModels/MainWindowVM.cs:316-324","code":"  316 | \t\tvoid RecordCheckedChangeForUndo(DuplicateItemVM item) {\n  317 | \t\t\tif (suppressSelectionUndoRecording) return;\n  318 | \t\t\tvar entry = (item, !item.Checked); // PropertyChanged fires after the change\n  319 | \t\t\tif (activeSelectionUndoBatch != null) {\n  320 | \t\t\t\tactiveSelectionUndoBatch.Add(entry);\n  321 | \t\t\t\treturn;\n  322 | \t\t\t}\n  323 | \t\t\tPushSelectionUndoStep(new() { entry });\n  324 | \t\t}","lines":9,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/ViewModels/MainWindowVM.cs#L316-L324"},{"ref":"VDF.GUI/ViewModels/MainWindowVM.cs:514-516","code":"  514 | \t\tvoid DuplicateItemVM_PropertyChanged(object? sender, PropertyChangedEventArgs e) {\n  515 | \t\t\tif (e.PropertyName != nameof(DuplicateItemVM.Checked) || sender == null) return;\n  516 | \t\t\tRecordCheckedChangeForUndo((DuplicateItemVM)sender);","lines":3,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/ViewModels/MainWindowVM.cs#L514-L516"}]},
{"id":"LOGIC_41","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"TryStartScheduledScan executes StartScanCommand.Execute(\"FullScan\").Subscribe() fire-and-forget. The command is gated by CanStartScan (IsBusy). Between CheckScheduledScan's guards and the posted Execute, IsBusy may have flipped (e.g. a manual operation started), in which case Execute silently no-ops but scheduledScanInProgress was already set true and lastScheduledScanDate advanced to today, so the scheduled scan is skipped for the entire day with no retry.","fix":"Set scheduledScanInProgress/lastScheduledScanDate only after the scan actually starts (e.g. in StartSearch path), or reset them if Execute did not run.","locations":[{"ref":"VDF.GUI/ViewModels/MainWindowVM.cs:682-684","code":"  682 | \t\t\tscheduledScanInProgress = true;\n  683 | \t\t\tlastScheduledScanDate = DateTime.Now.Date;\n  684 | \t\t\tDispatcher.UIThread.Post(() => StartScanCommand.Execute(\"FullScan\").Subscribe());","lines":3,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/ViewModels/MainWindowVM.cs#L682-L684"}]},
{"id":"LOGIC_42","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"EditDataBaseCommand and ImportScanResultsFromFileCommand etc. assign 'bool res = await dlg.ShowDialog<bool>(...)' and never use res (line 727). Harmless but indicates the dialog result is meant to drive behavior (e.g. refresh after DB edit) and is dropped - after editing the database via DatabaseViewer, the main grid is not refreshed.","fix":"Use the dialog result to refresh state, or discard explicitly with _ if intentionally ignored.","locations":[{"ref":"VDF.GUI/ViewModels/MainWindowVM.cs:869-872","code":"  869 | \t\tpublic static ReactiveCommand<Unit, Unit> EditDataBaseCommand => ReactiveCommand.CreateFromTask(async () => {\n  870 | \t\t\tDatabaseViewer dlg = new();\n  871 | \t\t\tbool res = await dlg.ShowDialog<bool>(ApplicationHelpers.MainWindow);\n  872 | \t\t});","lines":4,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/ViewModels/MainWindowVM.cs#L869-L872"}]},
{"id":"LOGIC_43","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"In AlternativeOpen, command quote-splitting does cmd = command.Split(command[0] + \" \", 2) then cmd[0] += command[0]. If the quoted executable path has no trailing space+arg (e.g. command is just '\"C:\\my app\\tool.exe\"'), Split returns a single element and cmd[0] += quote re-appends a quote, yielding '\"C:\\my app\\tool.exe\"\"' as FileName, which fails to start. Quoted command with no arguments is mishandled.","fix":"Parse the leading quoted token properly (find the closing quote) rather than splitting on quote+space; strip the surrounding quotes from FileName.","locations":[{"ref":"VDF.GUI/ViewModels/MainWindowVM.cs:1372-1383","code":" 1372 | \t\t\tif (!string.IsNullOrEmpty(command)) {\n 1373 | \t\t\t\tif (command[0] == '\"' || command[0] == '\\'') {\n 1374 | \t\t\t\t\tcmd = command.Split(command[0] + \" \", 2);\n 1375 | \t\t\t\t\tcmd[0] += command[0];\n 1376 | \t\t\t\t}\n 1377 | \t\t\t\telse\n 1378 | \t\t\t\t\tcmd = command.Split(' ', 2);\n 1379 | \t\t\t}\n 1380 | \t\t\tif (string.IsNullOrEmpty(cmd?[0]))\n 1381 | \t\t\t\treturn false;\n 1382 | \n 1383 | \t\t\tcommand = cmd[0];","lines":12,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/ViewModels/MainWindowVM.cs#L1372-L1383"}]},
{"id":"LOGIC_44","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"RenameFileCommand calls ScanEngine.GetFromDatabase(path, out var dbEntry) but ignores the bool return value, then unconditionally passes dbEntry! (null-forgiving) to UpdateFilePathInDatabase after the move. If the file was never in the database (GetFromDatabase returns false, dbEntry null), UpdateFilePathInDatabase receives null, risking an NRE or a no-op that desyncs the DB from the renamed file.","fix":"Only call UpdateFilePathInDatabase when GetFromDatabase returned true; otherwise skip the DB update.","locations":[{"ref":"VDF.GUI/ViewModels/MainWindowVM.cs:1438-1442","code":" 1438 | \t\t\t\tScanEngine.GetFromDatabase(currentItem.ItemInfo.Path, out var dbEntry);\n 1439 | \t\t\t\tfi.MoveTo(newName, true);\n 1440 | \t\t\t\tScanEngine.UpdateFilePathInDatabase(newName, dbEntry!);\n 1441 | \t\t\t\tcurrentItem.ItemInfo.Path = newName;\n 1442 | \t\t\t\tScanEngine.SaveDatabase();","lines":5,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/ViewModels/MainWindowVM.cs#L1438-L1442"}]},
{"id":"LOGIC_45","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"MarkGroupAsNotAMatchCommand removes group items with a nested loop over blacklist paths x Duplicates indices (O(paths * N)). After building the per-path/index removal it relies on Path equality with the platform default StringComparison via '==' (ordinal), while the blacklist HashSet was built with PathComparer.ForCurrentPlatform (case-insensitive on Windows). On Windows a path that differs only by case will be in the blacklist set but the Duplicates[i].ItemInfo.Path == path check (ordinal) will not match it, leaving the item displayed.","fix":"Remove items by GroupId membership in the blacklist set using PathComparer.ForCurrentPlatform for the path check, or simply remove all items whose GroupId == gid since the whole group is being blacklisted.","locations":[{"ref":"VDF.GUI/ViewModels/MainWindowVM.cs:1781-1798","code":" 1781 | \t\t\t\tHashSet<string> blacklist = new HashSet<string>(PathComparer.ForCurrentPlatform);\n 1782 | \t\t\t\tforeach (DuplicateItemVM duplicateItem in Duplicates.Where(d => d.ItemInfo.GroupId == gid))\n 1783 | \t\t\t\t\tblacklist.Add(duplicateItem.ItemInfo.Path);\n 1784 | \t\t\t\tGroupBlacklist.Add(blacklist);\n 1785 | \t\t\t\ttry {\n 1786 | \t\t\t\t\tawait BlacklistStore.SaveAsync(BlacklistedGroupsFile, GroupBlacklist);\n 1787 | \t\t\t\t}\n 1788 | \t\t\t\tcatch (Exception e) {\n 1789 | \t\t\t\t\tGroupBlacklist.Remove(blacklist);\n 1790 | \t\t\t\t\tawait MessageBoxService.Show(e.Message);\n 1791 | \t\t\t\t\treturn;\n 1792 | \t\t\t\t}\n 1793 | \n 1794 | \t\t\t\t// Remove all items in this group from the list\n 1795 | \t\t\t\tforeach (var path in blacklist.ToList())\n 1796 | \t\t\t\t\tfor (int i = Duplicates.Count - 1; i >= 0; i--)\n 1797 | \t\t\t\t\t\tif (Duplicates[i].ItemInfo.GroupId == gid && Duplicates[i].ItemInfo.Path == path)\n 1798 | \t\t\t\t\t\t\tDuplicates.RemoveAt(i);","lines":18,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/ViewModels/MainWindowVM.cs#L1781-L1798"}]},
{"id":"LOGIC_46","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"DeleteInternal builds keepByGroup using g.FirstOrDefault(x => !x.Checked) for link creation, but FirstOrDefault returns null when ALL items in a group are checked. The code handles null with a thrown exception per item (caught and logged), but 'keep the first unchecked' is order-dependent and arbitrary: the file kept as the link target is just whatever the AvaloniaList order happens to be, not the best-quality item, which can replace good files with links to a worse copy.","fix":"Pick the keeper deterministically (e.g. QualityRanker.PickKeeper over the unchecked items, or largest size) rather than FirstOrDefault.","locations":[{"ref":"VDF.GUI/ViewModels/MainWindowVM.cs:1928-1933","code":" 1928 | \t\t\tvar keepByGroup = Duplicates\n 1929 | \t\t\t\t   .GroupBy(d => d.ItemInfo.GroupId)\n 1930 | \t\t\t\t   .ToDictionary(\n 1931 | \t\t\t\t\t   g => g.Key,\n 1932 | \t\t\t\t\t   g => g.FirstOrDefault(x => !x.Checked)\n 1933 | \t\t\t\t   );","lines":6,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/ViewModels/MainWindowVM.cs#L1928-L1933"},{"ref":"VDF.GUI/ViewModels/MainWindowVM.cs:1997-2001","code":" 1997 | \t\t\t\t\t\t\t\t\tvar keeper = keepByGroup.TryGetValue(dub.ItemInfo.GroupId, out var k) ? k : null;\n 1998 | \t\t\t\t\t\t\t\t\tif (keeper == null)\n 1999 | \t\t\t\t\t\t\t\t\t\tthrow new Exception($\"Cannot create a link for '{dub.ItemInfo.Path}' because all items in this group are selected\");\n 2000 | \t\t\t\t\t\t\t\t\tif (!File.Exists(keeper.ItemInfo.Path))\n 2001 | \t\t\t\t\t\t\t\t\t\tthrow new Exception($\"Cannot create a link for '{dub.ItemInfo.Path}' because the file to keep ('{keeper.ItemInfo.Path}') does not exist\");","lines":5,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/ViewModels/MainWindowVM.cs#L1997-L2001"}]},
{"id":"LOGIC_47","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"ShortcutBindingVM.ApplyGesture resolves a conflict by clearing the conflicting action's gesture, but only updates the sibling VM whose ActionId matches via FirstOrDefault. If the conflicting binding belongs to a DIFFERENT window's action set (DatabaseViewer defaults share the manager) there is no sibling in _siblings, so the underlying manager is updated (gesture cleared) but no UI in the open editor reflects it - and the user silently loses a shortcut from another context with no feedback.","fix":"Surface a message when a conflict is resolved against an action not present in the current editor list.","locations":[{"ref":"VDF.GUI/ViewModels/ShortcutBindingVM.cs:67-81","code":"   67 | \t\tpublic void ApplyGesture(string gestureString) {\n   68 | \t\t\tvar conflict = KeyboardShortcutManager.Instance.GetConflict(ActionId, gestureString);\n   69 | \t\t\tif (conflict != null) {\n   70 | \t\t\t\tKeyboardShortcutManager.Instance.SetGesture(conflict, string.Empty);\n   71 | \t\t\t\tvar conflictingVm = _siblings.FirstOrDefault(s => s.ActionId == conflict);\n   72 | \t\t\t\tif (conflictingVm != null) {\n   73 | \t\t\t\t\tconflictingVm.CurrentGesture = string.Empty;\n   74 | \t\t\t\t\tconflictingVm.ConflictText = null;\n   75 | \t\t\t\t}\n   76 | \t\t\t}\n   77 | \n   78 | \t\t\tKeyboardShortcutManager.Instance.SetGesture(ActionId, gestureString);\n   79 | \t\t\tCurrentGesture = gestureString;\n   80 | \t\t\tConflictText = null;\n   81 | \t\t}","lines":15,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/ViewModels/ShortcutBindingVM.cs#L67-L81"}]},
{"id":"LOGIC_48","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"ThumbnailComparerVM.ShowMessage starts a fire-and-forget Task that, after the delay, schedules IsMessageVisible = false on the main thread. A newer ShowMessage cancels the previous CTS, but the scheduled 'hide' from a previous (non-cancelled, already-elapsed) call can still run after a new message was shown, hiding the new message early. The cancellation only covers the Task.Delay window, not the gap between delay completion and the scheduled UI action.","fix":"Capture the token in the scheduled action and check token.IsCancellationRequested before setting IsMessageVisible = false.","locations":[{"ref":"VDF.GUI/ViewModels/ThumbnailComparerVM.cs:96-110","code":"   96 | \t\tCancellationTokenSource? _messageCts;\n   97 | \t\tpublic void ShowMessage(string msg, int millis = 3000) {\n   98 | \t\t\t_messageCts?.Cancel();\n   99 | \t\t\t_messageCts = new CancellationTokenSource();\n  100 | \t\t\tUserMessage = msg;\n  101 | \t\t\tIsMessageVisible = true;\n  102 | \t\t\tvar token = _messageCts.Token;\n  103 | \t\t\t_ = Task.Run(async () => {\n  104 | \t\t\t\ttry {\n  105 | \t\t\t\t\tawait Task.Delay(millis, token);\n  106 | \t\t\t\t\tRxSchedulers.MainThreadScheduler.Schedule(() => IsMessageVisible = false);\n  107 | \t\t\t\t}\n  108 | \t\t\t\tcatch { }\n  109 | \t\t\t});\n  110 | \t\t}","lines":15,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/ViewModels/ThumbnailComparerVM.cs#L96-L110"}]},
{"id":"LOGIC_49","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"easy","description":"Recalc() uses ImageA.PixelSize for both Swipe and Stacked layout even though in those modes ImageB may differ in size from ImageA. The display frame is computed only from ImageA's aspect ratio; if ImageB has a different aspect ratio it is stretched/misaligned under the swipe/stacked clip, and the separator position (computed from ImageA's scaled frame) won't correspond to ImageB. Comparison of differently-sized duplicates is the common case here.","fix":"Either letterbox both images to a common frame or document that swipe/stacked assumes matching dimensions; consider using the max of both sizes.","locations":[{"ref":"VDF.GUI/ViewModels/ThumbnailComparerVM.cs:770-800","code":"  770 | \t\tvoid Recalc() {\n  771 | \t\t\tif ((!IsSwipe && !IsStacked) || ImageA is null || ImageB is null || ViewportWidth <= 0 || ViewportHeight <= 0) {\n  772 | \t\t\t\tSwipeClip = null;\n  773 | \t\t\t\treturn;\n  774 | \t\t\t}\n  775 | \n  776 | \t\t\tvar wa = ImageA.PixelSize.Width;\n  777 | \t\t\tvar ha = ImageA.PixelSize.Height;\n  778 | \n  779 | \t\t\tvar scale = Math.Min(ViewportWidth / wa, ViewportHeight / ha);\n  780 | \t\t\tvar frameW = wa * scale;\n  781 | \t\t\tvar frameH = ha * scale;\n  782 | \t\t\tvar frameLeft = (ViewportWidth - frameW) / 2.0;\n  783 | \t\t\tvar frameTop = (ViewportHeight - frameH) / 2.0;\n  784 | \n  785 | \t\t\tDisplayWidth = frameW;\n  786 | \t\t\tDisplayHeight = frameH;\n  787 | \t\t\tLeftOffset = frameLeft;\n  788 | \t\t\tTopOffset = frameTop;\n  789 | \n  790 | \t\t\tif (IsSwipe) {\n  791 | \t\t\t\tvar w = frameW * ModeSliderValue;\n  792 | \t\t\t\tSwipeClip = new RectangleGeometry(new Rect(0, 0, w, frameH));\n  793 | \t\t\t\tSeparatorX = frameLeft + Math.Max(0, w - 1);\n  794 | \t\t\t}\n  795 | \t\t\telse if (IsStacked) {\n  796 | \t\t\t\tvar h = frameH * ModeSliderValue;\n  797 | \t\t\t\tSwipeClip = new RectangleGeometry(new Rect(0, 0, frameW, h));\n  798 | \t\t\t\tSeparatorY = frameTop + Math.Max(0, h - 1);\n  799 | \t\t\t}\n  800 | \t\t}","lines":31,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/ViewModels/ThumbnailComparerVM.cs#L770-L800"}]},
{"id":"LOGIC_50","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"ExpressionBuilder constructor calls InitializeComponent() then sets DataContext = new ExpressionBuilderVM(this), but the InputBoxView/CustomSelectionView/others set DataContext before InitializeComponent. With compiled bindings this ordering difference means bindings in ExpressionBuilder are evaluated against a null DataContext during load and then re-evaluated; for x:CompileBindings views this can produce transient binding errors. Minor but inconsistent with the rest of the codebase.","fix":"Set DataContext before InitializeComponent for consistency (as the other dialogs do).","locations":[{"ref":"VDF.GUI/Views/ExpressionBuilder.xaml.cs:23-25","code":"   23 | \t\tpublic ExpressionBuilder() {\n   24 | \t\t\tInitializeComponent();\n   25 | \t\t\tDataContext = new ExpressionBuilderVM(this);","lines":3,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/Views/ExpressionBuilder.xaml.cs#L23-L25"}]},
{"id":"LOGIC_51","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"HotKeyBox.OnKeyDown sets e.Handled = true at the very top (line 91) before the early-return for '!_isCapturing'. So even when the box is NOT capturing focus, every key press routed to it is marked handled, swallowing keys (e.g. arrow navigation, shortcuts) whenever the HotKeyBox merely has focus context but isn't in capture mode. The Handled=true should be inside the capturing branch.","fix":"Only set e.Handled = true when _isCapturing is true (or after deciding to consume the key).","locations":[{"ref":"VDF.GUI/Views/HotKeyBox.cs:90-94","code":"   90 | \t\tprotected override void OnKeyDown(KeyEventArgs e) {\n   91 | \t\t\te.Handled = true;\n   92 | \n   93 | \t\t\tif (!_isCapturing)\n   94 | \t\t\t\treturn;","lines":5,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/Views/HotKeyBox.cs#L90-L94"}]},
{"id":"LOGIC_52","type":"logic_error","type_label":"Logic Error","severity":"low","difficulty":"medium","description":"MainWindow.ShowAlgoView is async void and awaits 'while (!this.IsVisible) await Task.Delay(200)' with no termination if the window is never shown (e.g. created then closed before becoming visible), and creates the ChooseAlgoView dialog unconditionally afterwards. If the user closes the main window during the delay loop, the dialog is still shown as a child of a closing window. No cancellation tied to window lifetime.","fix":"Bound the wait loop and bail out if the window has closed; tie to a CancellationToken cleared on close.","locations":[{"ref":"VDF.GUI/Views/MainWindow.xaml.cs:124-138","code":"  124 | \t\tasync void ShowAlgoView() {\n  125 | \n  126 | \t\t\tif (File.Exists(FileUtils.SafePathCombine(\n  127 | \t\t\t\t\tCoreUtils.ResolveDatabaseFolder(SettingsFile.Instance.CustomDatabaseFolder),\n  128 | \t\t\t\t\t\"ScannedFiles.db\")))\n  129 | \t\t\t\treturn;\n  130 | \n  131 | \t\t\twhile (!this.IsVisible) {\n  132 | \t\t\t\tawait Task.Delay(200);\n  133 | \t\t\t}\n  134 | \t\t\tvar dlg = new Views.ChooseAlgoView();\n  135 | \t\t\tawait dlg.ShowDialog(this);\n  136 | \t\t\tif (dlg.FindControl<RadioButton>(\"Cb16x16\")?.IsChecked == true)\n  137 | \t\t\t\tVDF.Core.Utils.DatabaseUtils.Create16x16Database();\n  138 | \t\t}","lines":15,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/Views/MainWindow.xaml.cs#L124-L138"}]},
{"id":"LOGIC_53","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"FFHardwareAccelerationMode.auto is a valid enum value but GetConfiguredHardwareDeviceType has no case for it, so 'auto' maps to AV_HWDEVICE_TYPE_NONE (software) in the native path, while the CLI path emits '-hwaccel auto' (line 421-424) which actually enables auto hwaccel. Native and CLI behave differently for the 'auto' setting.","fix":"Document that native ignores 'auto', or map 'auto' to a sensible default device probe.","locations":[{"ref":"VDF.Core/FFTools/FfmpegEngine.cs:161-173","code":"  161 | \t\t\treturn HardwareAccelerationMode switch {\n  162 | \t\t\t\tFFHardwareAccelerationMode.vdpau => AVHWDeviceType.AV_HWDEVICE_TYPE_VDPAU,\n  163 | \t\t\t\tFFHardwareAccelerationMode.dxva2 => AVHWDeviceType.AV_HWDEVICE_TYPE_DXVA2,\n  164 | \t\t\t\tFFHardwareAccelerationMode.vaapi => AVHWDeviceType.AV_HWDEVICE_TYPE_VAAPI,\n  165 | \t\t\t\tFFHardwareAccelerationMode.qsv => AVHWDeviceType.AV_HWDEVICE_TYPE_QSV,\n  166 | \t\t\t\tFFHardwareAccelerationMode.cuda => AVHWDeviceType.AV_HWDEVICE_TYPE_CUDA,\n  167 | \t\t\t\tFFHardwareAccelerationMode.videotoolbox => AVHWDeviceType.AV_HWDEVICE_TYPE_VIDEOTOOLBOX,\n  168 | \t\t\t\tFFHardwareAccelerationMode.d3d11va => AVHWDeviceType.AV_HWDEVICE_TYPE_D3D11VA,\n  169 | \t\t\t\tFFHardwareAccelerationMode.drm => AVHWDeviceType.AV_HWDEVICE_TYPE_DRM,\n  170 | \t\t\t\t//FFHardwareAccelerationMode.opencl => AVHWDeviceType.AV_HWDEVICE_TYPE_OPENCL, OpenCL support is irrelevant for frame extraction\n  171 | \t\t\t\tFFHardwareAccelerationMode.mediacodec => AVHWDeviceType.AV_HWDEVICE_TYPE_MEDIACODEC,\n  172 | \t\t\t\t_ => AVHWDeviceType.AV_HWDEVICE_TYPE_NONE\n  173 | \t\t\t};","lines":13,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Core/FFTools/FfmpegEngine.cs#L161-L173"},{"ref":"VDF.Core/FFTools/FfmpegEngine.cs:656-659","code":"  656 | \t\t\t\tif (HardwareAccelerationMode != FFHardwareAccelerationMode.none && !settings.SoftwareDecodeOnly) {\n  657 | \t\t\t\t\tpsi.ArgumentList.Add(\"-hwaccel\");\n  658 | \t\t\t\t\tpsi.ArgumentList.Add(HardwareAccelerationMode.ToString());\n  659 | \t\t\t\t}","lines":4,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Core/FFTools/FfmpegEngine.cs#L656-L659"}]},
{"id":"LOGIC_54","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"medium","description":"LegacyDatabaseReader.ReadFileEntry handles AudioFingerprint with O(n^2) growth in the unpacked (wire==0) case: each repeated value triggers Append() which allocates a new array and copies the whole existing array. A long unpacked fingerprint stream re-copies the array on every element. Packed (wire==2) is fine. Legacy DBs are read once at migration so impact is low, but it is quadratic.","fix":"Accumulate unpacked values into a List<uint> for the entry and materialize to an array once at the end of ReadFileEntry, as the packed branch effectively does.","locations":[{"ref":"VDF.Core/Utils/LegacyDatabaseReader.cs:102-105","code":"  102 | \t\t\t\t\tcase 10 when wire == 0: { // AudioFingerprint, unpacked\n  103 | \t\t\t\t\t\tentry.AudioFingerprint = Append(entry.AudioFingerprint, (uint)ReadVarint(data, ref pos));\n  104 | \t\t\t\t\t\tbreak;\n  105 | \t\t\t\t\t}","lines":4,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Core/Utils/LegacyDatabaseReader.cs#L102-L105"},{"ref":"VDF.Core/Utils/LegacyDatabaseReader.cs:325-331","code":"  325 | \t\tstatic uint[] Append(uint[]? array, uint value) {\n  326 | \t\t\tif (array == null) return new[] { value };\n  327 | \t\t\tvar bigger = new uint[array.Length + 1];\n  328 | \t\t\tarray.CopyTo(bigger, 0);\n  329 | \t\t\tbigger[^1] = value;\n  330 | \t\t\treturn bigger;\n  331 | \t\t}","lines":7,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Core/Utils/LegacyDatabaseReader.cs#L325-L331"}]},
{"id":"LOGIC_55","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"ExportScanResultsToFileCommand and ExportScanResultsCommand are identical (both await ExportScanResults() with defaults), so one is redundant. Likely a leftover during refactor.","fix":"Remove one of the duplicate commands or differentiate their behavior.","locations":[{"ref":"VDF.GUI/ViewModels/MainWindowVM.cs:913-915","code":"  913 | \t\tpublic ReactiveCommand<Unit, Unit> ExportScanResultsCommand => ReactiveCommand.CreateFromTask(async () => {\n  914 | \t\t\tawait ExportScanResults();\n  915 | \t\t});","lines":3,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/ViewModels/MainWindowVM.cs#L913-L915"},{"ref":"VDF.GUI/ViewModels/MainWindowVM.cs:921-923","code":"  921 | \t\tpublic ReactiveCommand<Unit, Unit> ExportScanResultsToFileCommand => ReactiveCommand.CreateFromTask(async () => {\n  922 | \t\t\tawait ExportScanResults();\n  923 | \t\t});","lines":3,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/ViewModels/MainWindowVM.cs#L921-L923"}]},
{"id":"LOGIC_56","type":"logic_error","type_label":"Logic Error","severity":"negligible","difficulty":"easy","description":"QualityOrderVM.MoveDown allows index == CriteriaOrder.Count-1 to pass the guard's lower bound but the upper check 'index < CriteriaOrder.Count - 1' correctly prevents the last item from moving; fine. However MoveUp/MoveDown set SelectedItem after Move, and MoveDown has a trailing whitespace after 'SelectedItem = item;'. Cosmetic only - flagging the inconsistent guard styling between MoveUp (early-return) and MoveDown (if-block) for maintainability.","fix":"Use the same early-return guard style in both methods; trim trailing whitespace.","locations":[{"ref":"VDF.GUI/ViewModels/QualityOrderVM.cs:58-71","code":"   58 | \t\tpublic void MoveUp(int index) {\n   59 | \t\t\tif (index <= 0) return;\n   60 | \t\t\tvar item = CriteriaOrder[index];\n   61 | \t\t\tCriteriaOrder.Move(index, index - 1);\n   62 | \t\t\tSelectedItem = item;\n   63 | \t\t}\n   64 | \n   65 | \t\tpublic void MoveDown(int index) {\n   66 | \t\t\tif (index >= 0 && index < CriteriaOrder.Count - 1) {\n   67 | \t\t\t\tvar item = CriteriaOrder[index];\n   68 | \t\t\t\tCriteriaOrder.Move(index, index + 1);\n   69 | \t\t\t\tSelectedItem = item;\n   70 | \t\t\t}\n   71 | \t\t}","lines":14,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/ViewModels/QualityOrderVM.cs#L58-L71"}]},
{"id":"CPY_1","type":"copy_paste","type_label":"Copy Paste","severity":"low","difficulty":"easy","description":"OpenHWInfoLinkCommand and OpenWikiLinkCommand both show App.Lang[\"Message.OpenHwAccelInfoFailed\"] on failure. The Wiki-link command surfaces an HW-acceleration error message when opening the wiki page fails - a copy-paste of the catch block from the HW-info command.","fix":"Use a generic 'failed to open link' message (or a wiki-specific one) in OpenWikiLinkCommand's catch.","locations":[{"ref":"VDF.GUI/ViewModels/MainWindowVM_Settings.cs:120-121","code":"  120 | \t\t\tcatch {\n  121 | \t\t\t\tawait MessageBoxService.Show(App.Lang[\"Message.OpenHwAccelInfoFailed\"]);","lines":2,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/ViewModels/MainWindowVM_Settings.cs#L120-L121"}]},
{"id":"ERR_1","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"ChromaprintEngine.ExtractFingerprintProcess calls process.WaitForExit(TimeoutMs) (line 192) but ignores the bool result. If FFmpeg does not exit within 30s the process is neither killed nor reported, leaking an orphan FFmpeg process, and ctx.Finish()/GetRawFingerprint still runs on whatever PCM was read. A hung/very-slow FFmpeg leaks a process per file.","fix":"Check the return of WaitForExit; if false, KillProcess(process) and (optionally) treat as failure.","locations":[{"ref":"VDF.Core/FFTools/ChromaprintEngine.cs:208-217","code":"  208 | \t\t\t\tprocess.WaitForExit(TimeoutMs);\n  209 | \n  210 | \t\t\t\tif (extendedLogging && errOutput.Length > 0)\n  211 | \t\t\t\t\tLogger.Instance.Info($\"[ChromaprintEngine] {Path.GetFileName(filePath)}: {errOutput}\");\n  212 | \n  213 | \t\t\t\tif (totalBytes < Chroma.FrameSize * 2) // too short to fingerprint\n  214 | \t\t\t\t\treturn null;\n  215 | \n  216 | \t\t\t\tctx.Finish();\n  217 | \t\t\t\tvar result = ctx.GetRawFingerprint();","lines":10,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Core/FFTools/ChromaprintEngine.cs#L208-L217"}]},
{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"Constructor swallows the thumbnail-cache provider setup exception with an empty catch that sets Provider=null, but TempDirectory may already be assigned (or not) - if TempExtractionManager.Register threw, TempDirectory stays null and later code (ExportScanResults line 880, StartScanCommand line 1429 reassigns) tolerates null, but InvalidateIfWidthChanged/ThumbPack.Open failures silently disable thumbnails for the whole session with no user feedback or log entry.","fix":"Log the exception (Logger.Instance.Info) inside the catch instead of swallowing it silently.","locations":[{"ref":"VDF.GUI/ViewModels/MainWindowVM.cs:401-407","code":"  401 | \t\t\ttry {\n  402 | \t\t\t\tTempDirectory = TempExtractionManager.Register(new(\"VDF-\"));\n  403 | \t\t\t\t// Invalidate thumbnail cache if the configured width has changed\n  404 | \t\t\t\tUtils.ThumbCacheHelpers.InvalidateIfWidthChanged(TempDirectory.Path, SettingsFile.Instance.ThumbnailMaxWidth);\n  405 | \t\t\t\tUtils.ThumbCacheHelpers.Provider = Utils.ThumbPack.Open(TempDirectory.Path);\n  406 | \t\t\t}\n  407 | \t\t\tcatch { Utils.ThumbCacheHelpers.Provider = null; }","lines":7,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/ViewModels/MainWindowVM.cs#L401-L407"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"BuildPreviewImpl unconditionally sets CanApply = true after building the preview, regardless of whether any rows were produced or selected. The inline comment claims 'Auto-enable apply if there is at least one selected row', but nothing checks Preview.Count or any Selected flag. The Apply button becomes enabled even when the preview is empty (e.g. prefix typo, no scan roots, or no missing files matched). Apply then iterates an empty selection and still rewrites/imports the database for no reason.","fix":"Set CanApply = Preview.Any(p => p.Selected && !string.IsNullOrWhiteSpace(p.NewPath)); after building, instead of unconditional true.","locations":[{"ref":"VDF.GUI/ViewModels/RelocateFilesDialogVM.cs:180-194","code":"  180 | \t\tasync void BuildPreviewImpl() {\n  181 | \t\t\tPreview.Clear();\n  182 | \t\t\tCanApply = false;\n  183 | \t\t\tif (IsModePrefix) {\n  184 | \t\t\t\tBuildPreviewPrefix();\n  185 | \t\t\t}\n  186 | \t\t\telse {\n  187 | \t\t\t\tIsLoading = true;\n  188 | \t\t\t\tawait Task.Run(BuildPreviewRescan);\n  189 | \t\t\t\tIsLoading = false;\n  190 | \t\t\t}\n  191 | \n  192 | \t\t\t// Auto-enable apply if there is at least one selected row\n  193 | \t\t\tCanApply = true;\n  194 | \t\t}","lines":15,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/ViewModels/RelocateFilesDialogVM.cs#L180-L194"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"Both thumbnail endpoints call `Path.GetFullPath(path)` on the raw, attacker/client-controlled `path` query string before any validation. `Path.GetFullPath` throws (ArgumentException for invalid path characters, PathTooLongException, NotSupportedException) on malformed input, producing an unhandled exception and a 500 response instead of a clean 400. A client can trivially trigger this with `?path=` containing null bytes or `|` etc.","fix":"Wrap `Path.GetFullPath(path)` in a try/catch that returns 400 on failure, or validate the path before normalizing. The subsequent whitelist check against `scan.Duplicates` is good, but it must be reached without throwing.","locations":[{"ref":"VDF.Web/Program.cs:133","code":"  133 | \tpath = Path.GetFullPath(path);","lines":1,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Web/Program.cs#L133"},{"ref":"VDF.Web/Program.cs:133","code":"  133 | \tpath = Path.GetFullPath(path);","lines":1,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Web/Program.cs#L133"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"FFProbeJsonReader casts dictionary values with hard casts: (int)streams[i]['width'], (string)streams[i]['codec_name'], (string)format['bit_rate'], etc. The dictionary stores int, long, bool, string or a placeholder 'new object()' (when a key appeared as PropertyName but its value token type was unhandled, e.g. an array/object value like 'disposition'). If FFprobe emits width as a string, or a key like 'bit_rate' arrives as a number rather than string, these casts throw InvalidCastException and the whole probe fails. e.g. long.TryParse((string)streams[i]['bit_rate']) at line 172 throws if bit_rate was parsed as a Number into an int/long.","fix":"Use pattern matching / TryGetValue with type checks (value is string s) before casting, defaulting gracefully when the stored type differs.","locations":[{"ref":"VDF.Core/FFTools/FFProbeJsonReader.cs:172-196","code":"  172 | \t\t\t\tif (streams[i].ContainsKey(\"bit_rate\") && long.TryParse((string)streams[i][\"bit_rate\"], out var bitrate)) {\n  173 | \t\t\t\t\tfoundBitRate = true;\n  174 | \t\t\t\t\tinfo.Streams[i].BitRate = bitrate;\n  175 | \t\t\t\t}\n  176 | \t\t\t\tif (streams[i].ContainsKey(\"width\"))\n  177 | \t\t\t\t\tinfo.Streams[i].Width = (int)streams[i][\"width\"];\n  178 | \t\t\t\tif (streams[i].ContainsKey(\"height\"))\n  179 | \t\t\t\t\tinfo.Streams[i].Height = (int)streams[i][\"height\"];\n  180 | \t\t\t\tif (streams[i].ContainsKey(\"codec_name\"))\n  181 | \t\t\t\t\tinfo.Streams[i].CodecName = (string)streams[i][\"codec_name\"];\n  182 | \t\t\t\tif (streams[i].ContainsKey(\"codec_long_name\"))\n  183 | \t\t\t\t\tinfo.Streams[i].CodecLongName = (string)streams[i][\"codec_long_name\"];\n  184 | \t\t\t\tif (streams[i].ContainsKey(\"codec_type\"))\n  185 | \t\t\t\t\tinfo.Streams[i].CodecType = (string)streams[i][\"codec_type\"];\n  186 | \t\t\t\tif (streams[i].ContainsKey(\"channel_layout\"))\n  187 | \t\t\t\t\tinfo.Streams[i].ChannelLayout = (string)streams[i][\"channel_layout\"];\n  188 | \t\t\t\tif (streams[i].ContainsKey(\"channels\"))\n  189 | \t\t\t\t\tinfo.Streams[i].Channels = (int)streams[i][\"channels\"];\n  190 | \n  191 | \t\t\t\tif (streams[i].ContainsKey(\"pix_fmt\"))\n  192 | \t\t\t\t\tinfo.Streams[i].PixelFormat = (string)streams[i][\"pix_fmt\"];\n  193 | \t\t\t\tif (streams[i].ContainsKey(\"sample_rate\") && int.TryParse((string)streams[i][\"sample_rate\"], out var sample_rate))\n  194 | \t\t\t\t\tinfo.Streams[i].SampleRate = sample_rate;\n  195 | \t\t\t\tif (streams[i].ContainsKey(\"index\"))\n  196 | \t\t\t\t\tinfo.Streams[i].Index = ((int)streams[i][\"index\"]).ToString();","lines":25,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Core/FFTools/FFProbeJsonReader.cs#L172-L196"},{"ref":"VDF.Core/FFTools/FFProbeJsonReader.cs:214","code":"  214 | \t\t\tif (!foundBitRate && info.Streams.Length > 0 && format.ContainsKey(\"bit_rate\") && long.TryParse((string)format[\"bit_rate\"], out var formatBitrate))","lines":1,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Core/FFTools/FFProbeJsonReader.cs#L214"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"ExifReader JPEG segment walk assumes every marker after SOI carries a 2-byte length. It does not skip JPEG fill bytes (a run of 0xFF before a marker is legal) - the `if (hdr[0] != 0xFF) return null;` aborts parsing the moment a fill byte lands in hdr[0]. It also treats standalone markers (RSTn 0xD0-0xD7, TEM 0x01) as length-prefixed. In practice these rarely appear in the APPn header region, but a conformant-but-padded JPEG can cause EXIF extraction to silently fail (date-taken lost).","fix":"Before reading marker+length, consume any run of 0xFF fill bytes; and skip the length read for standalone markers (0x01, 0xD0-0xD7) instead of treating them as segments.","locations":[{"ref":"VDF.Core/Utils/ExifReader.cs:84-102","code":"   84 | \t\t\tif (sig[0] == 0xFF && sig[1] == 0xD8) {\n   85 | \t\t\t\tfs.Position = 2;\n   86 | \t\t\t\tSpan<byte> hdr = stackalloc byte[4];\n   87 | \t\t\t\twhile (true) {\n   88 | \t\t\t\t\tif (fs.Read(hdr) < 4) return null;\n   89 | \t\t\t\t\tif (hdr[0] != 0xFF) return null;\n   90 | \t\t\t\t\tbyte marker = hdr[1];\n   91 | \t\t\t\t\tif (marker == 0xDA || marker == 0xD9) return null; // start of scan / EOI — no EXIF\n   92 | \t\t\t\t\tint segLen = (hdr[2] << 8 | hdr[3]) - 2;\n   93 | \t\t\t\t\tif (segLen < 0) return null;\n   94 | \t\t\t\t\tif (marker == 0xE1 && segLen >= 6) {\n   95 | \t\t\t\t\t\tbyte[] seg = new byte[segLen];\n   96 | \t\t\t\t\t\tfs.ReadExactly(seg, 0, segLen);\n   97 | \t\t\t\t\t\tif (seg[0] == 'E' && seg[1] == 'x' && seg[2] == 'i' && seg[3] == 'f' && seg[4] == 0 && seg[5] == 0)\n   98 | \t\t\t\t\t\t\treturn seg[6..];\n   99 | \t\t\t\t\t\tcontinue; // some encoders emit XMP in an earlier APP1 — keep scanning\n  100 | \t\t\t\t\t}\n  101 | \t\t\t\t\tfs.Position += segLen;\n  102 | \t\t\t\t}","lines":19,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Core/Utils/ExifReader.cs#L84-L102"}]},
{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"FileUtils.IsOnSameFileSystem returns true on any exception ('assume same filesystem'), and GetMountPoint falls back to '/' for unmatched paths. On a misconfigured DriveInfo enumeration this makes MoveToTrash believe a cross-volume file is local, then File.Move throws (caught) and trashing fails - acceptable - but the optimistic default could also let a genuinely cross-device move be attempted, doing a slow copy+delete via File.Move's fallback for the trash path. Behavior is safe-ish but the optimistic default partly defeats the cross-filesystem guard the function exists to provide.","fix":"On error prefer the conservative answer (return false, i.e. skip trash and fall back to permanent delete) rather than assuming same filesystem, so the cross-volume guard is not silently bypassed.","locations":[{"ref":"VDF.Core/Utils/FileUtils.cs:357-376","code":"  357 | \t\tinternal static bool IsOnSameFileSystem(string path1, string path2) {\n  358 | \t\t\ttry {\n  359 | \t\t\t\tstring fullPath1 = Path.GetFullPath(path1);\n  360 | \t\t\t\tstring fullPath2 = Path.GetFullPath(path2);\n  361 | \t\t\t\tvar drives = DriveInfo.GetDrives();\n  362 | \t\t\t\treturn GetMountPoint(fullPath1, drives) == GetMountPoint(fullPath2, drives);\n  363 | \t\t\t}\n  364 | \t\t\tcatch {\n  365 | \t\t\t\treturn true; // assume same filesystem on error — let File.Move decide\n  366 | \t\t\t}\n  367 | \t\t}\n  368 | \n  369 | \t\tstatic string GetMountPoint(string fullPath, DriveInfo[] drives) {\n  370 | \t\t\tstring bestMatch = \"/\";\n  371 | \t\t\tforeach (var drive in drives) {\n  372 | \t\t\t\tif (fullPath.StartsWith(drive.Name, StringComparison.Ordinal) && drive.Name.Length > bestMatch.Length)\n  373 | \t\t\t\t\tbestMatch = drive.Name;\n  374 | \t\t\t}\n  375 | \t\t\treturn bestMatch;\n  376 | \t\t}","lines":20,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Core/Utils/FileUtils.cs#L357-L376"}]},
{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"Constructor deletes log.txt with try { File.Delete } catch { } - an empty catch that hides any error. Combined with the empty catch at lines 337, the constructor silently ignores all early-init failures. Minor, but the empty catch on log deletion is pure noise-suppression with no logging.","fix":"Acceptable to ignore, but prefer File.Delete only if File.Exists, or log at debug level.","locations":[{"ref":"VDF.GUI/ViewModels/MainWindowVM.cs:409-412","code":"  409 | \t\t\ttry {\n  410 | \t\t\t\tFile.Delete(Path.Combine(CoreUtils.CurrentFolder, \"log.txt\"));\n  411 | \t\t\t}\n  412 | \t\t\tcatch { }","lines":4,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/ViewModels/MainWindowVM.cs#L409-L412"}]},
{"id":"ERR_9","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"MessageBoxService.Show busy-waits 'while (ApplicationHelpers.MainWindow == null) await Task.Delay(500)'. ApplicationHelpers.MainWindow force-casts Application.Current.ApplicationLifetime.MainWindow with '!' - if MainWindow is genuinely never set (headless/test/early startup) this loops forever; and the cast can throw NullReferenceException via the '!' on ApplicationLifetime before the null check on MainWindow ever helps. There is no timeout.","fix":"Add a bounded retry/timeout and null-check ApplicationLifetime; the MainWindow accessor itself can throw rather than return null.","locations":[{"ref":"VDF.GUI/Views/MessageBoxView.xaml.cs:30-32","code":"   30 | \t\t\twhile (ApplicationHelpers.MainWindow == null) {\n   31 | \t\t\t\tawait Task.Delay(500);\n   32 | \t\t\t}","lines":3,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/Views/MessageBoxView.xaml.cs#L30-L32"},{"ref":"VDF.GUI/ApplicationHelpers.cs:25-26","code":"   25 | \t\tpublic static MainWindow MainWindow =>\n   26 | \t\t\t(MainWindow)((IClassicDesktopStyleApplicationLifetime)Application.Current!.ApplicationLifetime!)!.MainWindow!;","lines":2,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/ApplicationHelpers.cs#L25-L26"}]},
{"id":"ERR_10","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`AuthService.LoadOrGeneratePassword` and `SavePassword` swallow all exceptions with empty `catch { }`. If the credentials file is corrupt, a new password is silently generated (existing sessions/expectations broken with no log). If `SavePassword` fails (e.g. read-only config dir), the generated password is used for this run but not persisted, so it silently changes on every restart with no diagnostic. At minimum these should log.","fix":"Log a warning in the catch blocks (the class already has an ILogger) so administrators can diagnose why the password keeps changing or won't persist.","locations":[{"ref":"VDF.Web/Services/AuthService.cs:121","code":"  121 | \t\t\t\tcatch { }","lines":1,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Web/Services/AuthService.cs#L121"},{"ref":"VDF.Web/Services/AuthService.cs:130-137","code":"  130 | \t\tvoid SavePassword(string password) {\n  131 | \t\t\ttry {\n  132 | \t\t\t\tDirectory.CreateDirectory(Path.GetDirectoryName(_credentialsPath)!);\n  133 | \t\t\t\tFile.WriteAllText(_credentialsPath,\n  134 | \t\t\t\t\tJsonSerializer.Serialize(new StoredCredentials { Password = password }, WebJsonContext.Default.StoredCredentials));\n  135 | \t\t\t}\n  136 | \t\t\tcatch { }\n  137 | \t\t}","lines":8,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Web/Services/AuthService.cs#L130-L137"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"AudioStreamDecoder.DecodeAll: avcodec_send_packet failure path (line 164) treats only AVERROR(EAGAIN) specially and 'continue's on any other negative result, skipping the receive loop for that packet. But a real EAGAIN from send means the decoder is full and the packet must be re-sent after draining; here the packet is dropped entirely (av_packet_unref happens at top of next iteration), silently losing audio data and corrupting the fingerprint for files that hit decoder backpressure.","fix":"On EAGAIN from send_packet, drain via receive_frame loop then re-send the same packet, rather than dropping it.","locations":[{"ref":"VDF.Core/FFTools/FFmpegNative/AudioStreamDecoder.cs:231-233","code":"  231 | \t\t\t\tint sendResult = ffmpeg.avcodec_send_packet(_pCodecContext, _pPacket);\n  232 | \t\t\t\tif (sendResult < 0 && sendResult != ffmpeg.AVERROR(ffmpeg.EAGAIN))\n  233 | \t\t\t\t\tcontinue; // skip corrupted / problematic packets instead of aborting","lines":3,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Core/FFTools/FFmpegNative/AudioStreamDecoder.cs#L231-L233"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"AudioStreamDecoder.ConvertAndDeliver sizes the output buffer as outSamples*2 bytes (line 216) assuming exactly 1 output channel (mono). This is correct for the configured mono output but is implicit and brittle: swr_get_out_samples returns per-channel samples; if TargetChannels/out layout ever changes to >1 the buffer underflows and swr_convert writes past _outBuf, corrupting memory. The '2' conflates 's16 bytes-per-sample' with 'mono channel count'.","fix":"Compute bytes as outSamples * bytesPerSample * outChannels and the short span as converted * outChannels; derive channel count from the configured out layout.","locations":[{"ref":"VDF.Core/FFTools/FFmpegNative/AudioStreamDecoder.cs:297-313","code":"  297 | \t\t\tint outSamples = ffmpeg.swr_get_out_samples(_pSwrContext, inputSamples);\n  298 | \t\t\tif (outSamples <= 0) return 0;\n  299 | \n  300 | \t\t\tint requiredBytes = outSamples * 2; // s16 = 2 bytes per sample\n  301 | \t\t\tif (_outBuf.Length < requiredBytes)\n  302 | \t\t\t\t_outBuf = new byte[requiredBytes];\n  303 | \n  304 | \t\t\tint converted;\n  305 | \t\t\tfixed (byte* outPtr = _outBuf) {\n  306 | \t\t\t\tbyte* outBuf = outPtr;\n  307 | \t\t\t\tconverted = ffmpeg.swr_convert(_pSwrContext,\n  308 | \t\t\t\t\t&outBuf, outSamples,\n  309 | \t\t\t\t\tinputData, inputSamples);\n  310 | \t\t\t}\n  311 | \t\t\tif (converted <= 0) return 0;\n  312 | \n  313 | \t\t\tvar span = MemoryMarshal.Cast<byte, short>(_outBuf.AsSpan(0, converted * 2));","lines":17,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Core/FFTools/FFmpegNative/AudioStreamDecoder.cs#L297-L313"}]},
{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"ImportScanResultsIncludingThumbnails opens the file twice: File.OpenRead(path) into 'stream' (used for nothing except stream.Close() at line 986) and ZipFile.OpenRead(path) into 'zip'. The 'stream' is opened with default sharing and held in a using for the whole method but never read; it only serves to be closed. On the JsonException/Exception catch paths 'stream' is disposed by using, but the dead handle can block other access during the import and is pure confusion.","fix":"Remove the unused File.OpenRead(path)/stream entirely; ZipFile.OpenRead already opens the file.","locations":[{"ref":"VDF.GUI/ViewModels/MainWindowVM.cs:1079","code":" 1079 | \t\t\t\tusing var stream = File.OpenRead(path);","lines":1,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/ViewModels/MainWindowVM.cs#L1079"},{"ref":"VDF.GUI/ViewModels/MainWindowVM.cs:1127","code":" 1127 | \t\t\t\tstream.Close();","lines":1,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/ViewModels/MainWindowVM.cs#L1127"}]},
{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`AppDomain.CurrentDomain.UnhandledException` and `TaskScheduler.UnobservedTaskException` are wired to a single shared singleton `ScanService.SetError`, routing ALL process-wide unhandled/unobserved exceptions into the scan UI as a scan error. An unrelated background exception (e.g. from the FFmpeg download task, or any library) will flip the scan State to Error and overwrite ErrorMessage even when no scan is running, producing misleading UI state. `UnhandledException` for a truly unhandled exception also does not prevent process termination — the handler runs but the process still crashes.","fix":"Only surface the error in the UI when a scan is actually running (guard on State), and scope the handlers more narrowly. Do not assume every unobserved task exception belongs to the scan.","locations":[{"ref":"VDF.Web/Program.cs:63-74","code":"   63 | AppDomain.CurrentDomain.UnhandledException += (_, e) => {\n   64 | \tvar ex = e.ExceptionObject as Exception\n   65 | \t\t?? new Exception(e.ExceptionObject?.ToString() ?? \"Unknown error\");\n   66 | \tapp.Logger.LogError(ex, \"Unhandled exception in background thread\");\n   67 | \tscanService.SetError(ex);\n   68 | };\n   69 | \n   70 | TaskScheduler.UnobservedTaskException += (_, e) => {\n   71 | \tapp.Logger.LogError(e.Exception, \"Unobserved task exception\");\n   72 | \tscanService.SetError(e.Exception);\n   73 | \te.SetObserved();\n   74 | };","lines":12,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Web/Program.cs#L63-L74"},{"ref":"VDF.Web/Services/ScanService.cs:141-147","code":"  141 | \t\t/// <summary>Called from global exception handlers to surface post-await async void exceptions.<\/summary>\n  142 | \t\tpublic void SetError(Exception ex) {\n  143 | \t\t\tState = ScanState.Error;\n  144 | \t\t\tErrorMessage = ex.Message;\n  145 | \t\t\tLastProgress = null;\n  146 | \t\t\tNotify();\n  147 | \t\t}","lines":7,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Web/Services/ScanService.cs#L141-L147"}]},
{"id":"API_5","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"The two thumbnail `Task.Run(() => ScanEngine.ExtractThumbnailJpeg(...))` calls have no cache stampede protection: concurrent requests for the same uncached cacheKey each spawn their own FFmpeg extraction (CPU/IO heavy) and then all `TryAdd` the same key. The scan-thread may also be mutating `scan.Duplicates` (a `HashSet`, see ScanService.Duplicates) while these endpoints enumerate it via `FirstOrDefault`; HashSet is not thread-safe for concurrent read+write and `FirstOrDefault` can throw `InvalidOperationException` (collection modified) if a thumbnail request arrives during an active scan.","fix":"Snapshot or lock around `scan.Duplicates` reads, or expose a thread-safe lookup on ScanService. Consider a per-key async lock to coalesce duplicate extractions.","locations":[{"ref":"VDF.Web/Program.cs:134","code":"  134 | \tvar item = scan.Duplicates.FirstOrDefault(d => d.Path == path);","lines":1,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Web/Program.cs#L134"},{"ref":"VDF.Web/Program.cs:152","code":"  152 | \t\tjpeg = await Task.Run(() => ScanEngine.ExtractThumbnailJpeg(path, position, width, quality));","lines":1,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Web/Program.cs#L152"},{"ref":"VDF.Web/Program.cs:134","code":"  134 | \tvar item = scan.Duplicates.FirstOrDefault(d => d.Path == path);","lines":1,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Web/Program.cs#L134"},{"ref":"VDF.Web/Program.cs:180","code":"  180 | \t\tjpeg = await Task.Run(() => ScanEngine.ExtractThumbnailJpeg(path, position, 0));","lines":1,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Web/Program.cs#L180"}]},
{"id":"API_6","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"`ScanService.RemoveFromResults`, `DropSingletonGroups`, and the file-op methods mutate `_engine.Duplicates` (a non-thread-safe `HashSet`) from background `Task.Run` threads and Blazor render threads, while the thumbnail/CSV-export HTTP endpoints read the same `HashSet` concurrently. There is no locking around the shared `HashSet`. Concurrent enumeration + mutation can throw `InvalidOperationException` or corrupt the set. The class is a registered singleton shared across all connections, so this is reachable whenever a user triggers a file operation while another tab loads thumbnails or exports CSV.","fix":"Guard all access to `_engine.Duplicates` with a lock, or expose immutable snapshots to readers. A singleton mutable HashSet read/written from multiple threads needs synchronization.","locations":[{"ref":"VDF.Web/Services/ScanService.cs:173-190","code":"  173 | \t\tpublic void RemoveFromResults(IEnumerable<DuplicateItem> items) {\n  174 | \t\t\tforeach (var item in items.ToList())\n  175 | \t\t\t\t_engine.Duplicates.Remove(item);\n  176 | \t\t\tDropSingletonGroups();\n  177 | \t\t\tNotify();\n  178 | \t\t}\n  179 | \n  180 | \t\t/// <summary>Drops groups that have shrunk to a single item — a group of one is not a duplicate.<\/summary>\n  181 | \t\tvoid DropSingletonGroups() {\n  182 | \t\t\tvar keep = _engine.Duplicates\n  183 | \t\t\t\t.GroupBy(d => d.GroupId)\n  184 | \t\t\t\t.Where(g => g.Count() > 1)\n  185 | \t\t\t\t.Select(g => g.Key)\n  186 | \t\t\t\t.ToHashSet();\n  187 | \t\t\tforeach (var d in _engine.Duplicates.ToList())\n  188 | \t\t\t\tif (!keep.Contains(d.GroupId))\n  189 | \t\t\t\t\t_engine.Duplicates.Remove(d);\n  190 | \t\t}","lines":18,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Web/Services/ScanService.cs#L173-L190"},{"ref":"VDF.Web/Services/ScanService.cs:270","code":"  270 | \t\t\t\t\t\t\t_engine.Duplicates.Remove(item);","lines":1,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Web/Services/ScanService.cs#L270"},{"ref":"VDF.Web/Services/ScanService.cs:376","code":"  376 | \t\t\t\t\t\t\t_engine.Duplicates.Remove(item);","lines":1,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Web/Services/ScanService.cs#L376"},{"ref":"VDF.Web/Program.cs:206-207","code":"  206 | \tforeach (var group in scan.Duplicates.GroupBy(i => i.GroupId))\n  207 | \t\tforeach (var item in group)","lines":2,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Web/Program.cs#L206-L207"}]},
{"id":"API_7","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"JpegFrameEncoder.Encode calls avcodec_send_frame(ctx, &localFrame) then immediately avcodec_send_frame(ctx, null) to flush, then a single avcodec_receive_packet. For MJPEG one frame yields one packet so this works, but sending the flush null before receiving means if the encoder were to need draining in two steps the second packet (and any error from the flush send, whose return is unchecked at line 69) is silently lost. The flush send return value is discarded.","fix":"Receive the packet before flushing, or loop receive until EOF; at minimum check the flush send return.","locations":[{"ref":"VDF.Core/FFTools/FFmpegNative/JpegFrameEncoder.cs:68-70","code":"   68 | \t\t\t\tffmpeg.avcodec_send_frame(ctx, &localFrame).ThrowExceptionIfError();\n   69 | \t\t\t\tffmpeg.avcodec_send_frame(ctx, null); // flush — single-frame encode\n   70 | \t\t\t\tffmpeg.avcodec_receive_packet(ctx, packet).ThrowExceptionIfError();","lines":3,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Core/FFTools/FFmpegNative/JpegFrameEncoder.cs#L68-L70"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"ChromaprintEngine.ExtractFingerprintProcess allocates a new merged byte[] (new byte[1+bytesRead]) and BlockCopy on every iteration that follows an odd-length read, in the hot PCM streaming loop. For pathological streams returning odd counts repeatedly this is a per-32KB-chunk allocation churning the GC. Could be avoided with a small carry within the existing buffer.","fix":"Keep a 1-byte carry and shift, or read into an offset within buf, avoiding the per-iteration allocation.","locations":[{"ref":"VDF.Core/FFTools/ChromaprintEngine.cs:179-189","code":"  179 | \t\t\t\t\tbyte[]? merged = null;\n  180 | \t\t\t\t\tif (hasLeftover) {\n  181 | \t\t\t\t\t\tmerged = new byte[1 + bytesRead];\n  182 | \t\t\t\t\t\tmerged[0] = leftoverByte;\n  183 | \t\t\t\t\t\tBuffer.BlockCopy(buf, 0, merged, 1, bytesRead);\n  184 | \t\t\t\t\t\tbytesRead += 1;\n  185 | \t\t\t\t\t\thasLeftover = false;\n  186 | \t\t\t\t\t}\n  187 | \n  188 | \t\t\t\t\t// If odd number of bytes, save the last one for next iteration\n  189 | \t\t\t\t\tbyte[] source = merged ?? buf;","lines":11,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Core/FFTools/ChromaprintEngine.cs#L179-L189"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"FFmpegHelper.DescribeExpectedLibraries and FindFFmpegLibraryFiles do repeated directory enumeration and File.Exists probing on every invocation of the error path; DescribeExpectedLibraries is only called on failure so acceptable, but FindFFmpegLibraryFiles' Linux /usr/ recursive enumeration (EnumerateDirectories + per-dir recursive EnumerateFiles depth 2) can be very slow on systems with large /usr trees and runs whenever DoFFmpegLibraryFilesExist is first queried; result is cached only via ffmpegLibraryFound so it runs once, acceptable, but the recursion has no overall time bound.","fix":"Bound or short-circuit the /usr recursive scan, or restrict to the standard multiarch lib dirs already enumerated in DescribeExpectedLibraries.","locations":[{"ref":"VDF.Core/FFTools/FFmpegNative/FFmpegHelper.cs:113-130","code":"  113 | \t\t\t\tif (RuntimeInformation.IsOSPlatform(OSPlatform.Linux)) {\n  114 | \t\t\t\t\tstring firstLibrary = $\"lib{ffmpeg.LibraryVersionMap.Keys.First()}.so.{ffmpeg.LibraryVersionMap.Values.First()}\";\n  115 | \t\t\t\t\tforeach (var libDir in Directory.EnumerateDirectories(\"/usr/\", \"lib*\", new EnumerationOptions {\n  116 | \t\t\t\t\t\tIgnoreInaccessible = true,\n  117 | \t\t\t\t\t\tRecurseSubdirectories = false\n  118 | \t\t\t\t\t})) {\n  119 | \n  120 | \t\t\t\t\t\tforeach (string file in Directory.EnumerateFiles(libDir, firstLibrary, new EnumerationOptions {\n  121 | \t\t\t\t\t\t\tIgnoreInaccessible = true,\n  122 | \t\t\t\t\t\t\tRecurseSubdirectories = true,\n  123 | \t\t\t\t\t\t\tMaxRecursionDepth = 2,\n  124 | \t\t\t\t\t\t})) {\n  125 | \t\t\t\t\t\t\tstring currentDirectory = Path.GetDirectoryName(file)!;\n  126 | \t\t\t\t\t\t\tif (CheckForFfmpegLibraryFilesInFolder(currentDirectory))\n  127 | \t\t\t\t\t\t\t\treturn true;\n  128 | \t\t\t\t\t\t}\n  129 | \t\t\t\t\t}\n  130 | \t\t\t\t}","lines":18,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Core/FFTools/FFmpegNative/FFmpegHelper.cs#L113-L130"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"LRUBitmapCache never disposes evicted bitmaps (eviction code at lines 288-292 explicitly leaves them for the UI). Evicted bitmaps are removed from the map and from currentBytes accounting, but their unmanaged Skia memory is only reclaimed when the UI also drops its last reference and the finalizer runs. Under heavy thumbnail churn the effective RAM/VRAM use can far exceed MaxBytes (128 MB) because the cap only governs the cache's own references, not the leaked-but-still-displayed evicted entries.","fix":"Track displayed references (e.g. weak references) so evicted bitmaps can be disposed once no UI element holds them, or lower the cap; at minimum document that real memory use can exceed MaxBytes.","locations":[{"ref":"VDF.GUI/Utils/ThumbnailStore.cs:302-312","code":"  302 | \t\tstatic void EvictIfNeeded() {\n  303 | \t\t\twhile (currentBytes > MaxBytes && lru.Last != null) {\n  304 | \t\t\t\tvar key = lru.Last.Value;\n  305 | \t\t\t\tlru.RemoveLast();\n  306 | \t\t\t\tif (map.Remove(key, out var e)) {\n  307 | \t\t\t\t\tcurrentBytes -= e.size;\n  308 | \t\t\t\t\t// Important: do not dispose – UI may still display the bitmap.\n  309 | \t\t\t\t\t//try { e.bmp.Dispose(); } catch { }\n  310 | \t\t\t\t}\n  311 | \t\t\t}\n  312 | \t\t}","lines":11,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/Utils/ThumbnailStore.cs#L302-L312"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"RefreshGroupStats, DropSingletonGroups, DropHardLinkDuplicates, BuildCleanupDryRunReport, KeepBestInGroup, CompareGroup, ShowGroupInThumbnailComparer, SetHoveredMetric/ClearHoveredMetric, and the sort comparers each independently call Duplicates.GroupBy(GroupId) or Duplicates.Where(GroupId==...) - repeated full O(N) scans/grouping of the same collection. On large result sets, hovering a single cell (SetHoveredMetric) scans all Duplicates to gather the group every time.","fix":"Maintain a Dictionary<Guid, List<DuplicateItemVM>> group index alongside checkedCountByGroup, updated on collection changes, and have these methods read from it.","locations":[{"ref":"VDF.GUI/ViewModels/MainWindowVM.cs:796-816","code":"  796 | \t\tvoid RefreshGroupStats() {\n  797 | \t\t\tTotalDuplicates = Duplicates.Count;\n  798 | \t\t\tint groupCount = 0;\n  799 | \t\t\tlong totalSize = 0;\n  800 | \t\t\tlong savings = 0;\n  801 | \t\t\tforeach (var group in Duplicates.GroupBy(x => x.ItemInfo.GroupId)) {\n  802 | \t\t\t\tgroupCount++;\n  803 | \t\t\t\tlong groupTotal = 0;\n  804 | \t\t\t\tlong largest = 0;\n  805 | \t\t\t\tforeach (var item in group) {\n  806 | \t\t\t\t\tlong size = Math.Max(0, item.ItemInfo.SizeLong);\n  807 | \t\t\t\t\tgroupTotal += size;\n  808 | \t\t\t\t\tif (size > largest) largest = size;\n  809 | \t\t\t\t}\n  810 | \t\t\t\ttotalSize += groupTotal;\n  811 | \t\t\t\tsavings += groupTotal - largest;\n  812 | \t\t\t}\n  813 | \t\t\tTotalDuplicatesSize = totalSize.BytesToString();\n  814 | \t\t\tTotalDuplicateGroups = groupCount;\n  815 | \t\t\tPotentialSavings = savings.BytesToString();\n  816 | \t\t}","lines":21,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/ViewModels/MainWindowVM.cs#L796-L816"},{"ref":"VDF.GUI/ViewModels/MainWindowVM_HoverDiff.cs:29","code":"   29 | \t\t\tvar groupItems = Duplicates.Where(d => d.ItemInfo.GroupId == groupId).ToList();","lines":1,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/ViewModels/MainWindowVM_HoverDiff.cs#L29"},{"ref":"VDF.GUI/ViewModels/MainWindowVM_HoverDiff.cs:136","code":"  136 | \t\t\tforeach (var gi in Duplicates.Where(d => d.ItemInfo.GroupId == groupId)) {","lines":1,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/ViewModels/MainWindowVM_HoverDiff.cs#L136"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"BuildPreviewRescan calls QuickMeta.TryRead (FFProbeEngine.GetMediaInfo, spawning ffprobe) for every remaining candidate of every ambiguous missing entry, inside a LINQ Where executed on a background thread. For large scan roots with many same-size collisions this can launch a very large number of ffprobe processes with no parallelism cap, cancellation, or caching of already-probed paths.","fix":"Cache probe results per path, add a cancellation token, and only probe the small post-size/time candidate set; consider bounding parallelism.","locations":[{"ref":"VDF.GUI/ViewModels/RelocateFilesDialogVM.cs:286-293","code":"  286 | \t\t\t\tif (UseDuration && e.mediaInfo != null) {\n  287 | \t\t\t\t\tvar durSec = Math.Round(e.mediaInfo.Duration.TotalSeconds, 2);\n  288 | \t\t\t\t\tfiltered = filtered.Where(p => {\n  289 | \t\t\t\t\t\tvar durationSec = QuickMeta.TryRead(p);\n  290 | \t\t\t\t\t\tif (durationSec == null) return false;\n  291 | \t\t\t\t\t\treturn Math.Abs(durationSec.Value - durSec) <= 0.5; // half-second tolerance\n  292 | \t\t\t\t\t}).ToList();\n  293 | \t\t\t\t}","lines":8,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/ViewModels/RelocateFilesDialogVM.cs#L286-L293"},{"ref":"VDF.GUI/ViewModels/RelocateFilesDialogVM.cs:351-361","code":"  351 | \tpublic static class QuickMeta {\n  352 | \t\tpublic static double? TryRead(string path) {\n  353 | \t\t\ttry {\n  354 | \t\t\t\tvar info = FFProbeEngine.GetMediaInfo(path, false);\n  355 | \t\t\t\treturn info?.Duration.TotalSeconds ?? null;\n  356 | \t\t\t}\n  357 | \t\t\tcatch {\n  358 | \t\t\t\treturn null;\n  359 | \t\t\t}\n  360 | \t\t}\n  361 | \t}","lines":11,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/ViewModels/RelocateFilesDialogVM.cs#L351-L361"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`ResultFormatter.FormatText` calls `duplicates.Count()` on the source `IEnumerable<DuplicateItem>` after it has already been grouped and materialized into `groups`. For a lazily-evaluated source this re-enumerates the entire sequence a second time. Minor since callers pass materialized collections, but the API accepts IEnumerable.","fix":"Compute the total from `groups.Sum(g => g.Count())` (already materialized) instead of re-enumerating `duplicates`.","locations":[{"ref":"VDF.CLI/Output/ResultFormatter.cs:74-81","code":"   74 | \t\tstatic string FormatText(IEnumerable<DuplicateItem> duplicates) {\n   75 | \t\t\tvar sb = new StringBuilder();\n   76 | \t\t\tvar groups = duplicates\n   77 | \t\t\t\t.GroupBy(d => d.GroupId)\n   78 | \t\t\t\t.OrderBy(g => g.Key)\n   79 | \t\t\t\t.ToList();\n   80 | \n   81 | \t\t\tsb.AppendLine($\"Found {groups.Count} duplicate group(s), {duplicates.Count()} total file(s).\");","lines":8,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.CLI/Output/ResultFormatter.cs#L74-L81"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"QualityRanker.PickKeeper sorts the full candidate list with OrderBy/OrderByDescending (O(n log n), plus LINQ allocations) for every criterion just to take .First(); it only needs the max/min element. For large duplicate groups across many criteria this is needlessly allocation-heavy.","fix":"Replace OrderBy(...).First() / OrderByDescending(...).First() with a single MinBy/MaxBy pass (no full sort, no intermediate ordered enumerable).","locations":[{"ref":"VDF.Core/Utils/QualityRanker.cs:73-75","code":"   73 | \t\t\t\tkeep = criterion.Ascending\n   74 | \t\t\t\t\t? candidates.OrderBy(criterion.Accessor).First()\n   75 | \t\t\t\t\t: candidates.OrderByDescending(criterion.Accessor).First();","lines":3,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.Core/Utils/QualityRanker.cs#L73-L75"}]},
{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"easy","description":"WriteScanResultsCsv's Escape uses up to four separate s.Contains calls per field plus a Replace; minor, runs off the UI thread on a snapshot, so impact is low. Noted for completeness only.","fix":"Use s.IndexOfAny(new[]{',','\"','\\n','\\r'}) >= 0 to decide quoting in one pass.","locations":[{"ref":"VDF.GUI/ViewModels/MainWindowVM.cs:944-949","code":"  944 | \t\t\tstatic string Escape(string? s) {\n  945 | \t\t\t\ts ??= string.Empty;\n  946 | \t\t\t\treturn s.Contains(',') || s.Contains('\"') || s.Contains('\\n') || s.Contains('\\r')\n  947 | \t\t\t\t\t? \"\\\"\" + s.Replace(\"\\\"\", \"\\\"\\\"\") + \"\\\"\"\n  948 | \t\t\t\t\t: s;\n  949 | \t\t\t}","lines":6,"link":"https://github.com/0x90d/videoduplicatefinder/blob/657605427548d37f4b49402cd57b152588671c0a/VDF.GUI/ViewModels/MainWindowVM.cs#L944-L949"}]},
