{"id":"ERR_2","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"NodesManager.aclose calls asyncio.gather over node.disconnect() tasks without return_exceptions=True. If any single node.disconnect() raises, gather propagates the first exception and the remaining disconnect tasks are abandoned/cancelled, so other nodes' connections may not be cleanly disconnected during shutdown/reinitialization. Other gather sites in this file (disconnect, disconnect_free_connections) correctly pass return_exceptions=True.","fix":"Pass return_exceptions=True to gather and optionally re-raise after all disconnects complete, matching ClusterNode.disconnect().","locations":[{"ref":"redis/asyncio/cluster.py:2496-2503","code":" 2496 |     async def aclose(self, attr: str = \"nodes_cache\") -> None:\n 2497 |         self.default_node = None\n 2498 |         await asyncio.gather(\n 2499 |             *(\n 2500 |                 asyncio.create_task(node.disconnect())\n 2501 |                 for node in getattr(self, attr).values()\n 2502 |             )\n 2503 |         )","lines":8,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/cluster.py#L2496-L2503"}]},
{"id":"ERR_3","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"AbstractConnection.disconnect() takes an early-return fast path when asyncio.current_task() is None (GC/finalizer context), doing only a synchronous _close(). On that path it skips the observability recording (record_error_count / record_connection_closed) that the normal path performs, so connection-closed and error metrics are silently dropped for any disconnect that happens outside a running task (e.g. errors surfaced during finalization, or callers invoking disconnect from a non-task context). This makes the connection-state counters drift over time.","fix":"Record the connection-closed/error metrics (using the sync recorder functions, as reset()/__del__ do) on the current_task() is None fast path as well, or document that metrics are intentionally skipped there.","locations":[{"ref":"redis/asyncio/connection.py:1170-1174","code":" 1170 |         if asyncio.current_task() is None:\n 1171 |             self._parser.on_disconnect()\n 1172 |             self.reset_should_reconnect()\n 1173 |             self._close()\n 1174 |             return","lines":5,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/connection.py#L1170-L1174"},{"ref":"redis/asyncio/connection.py:1199-1222","code":" 1199 |         if error:\n 1200 |             if health_check_failed:\n 1201 |                 close_reason = CloseReason.HEALTHCHECK_FAILED\n 1202 |             else:\n 1203 |                 close_reason = CloseReason.ERROR\n 1204 | \n 1205 |             if failure_count is not None and failure_count > self.retry.get_retries():\n 1206 |                 await record_error_count(\n 1207 |                     server_address=getattr(self, \"host\", None),\n 1208 |                     server_port=getattr(self, \"port\", None),\n 1209 |                     network_peer_address=getattr(self, \"host\", None),\n 1210 |                     network_peer_port=getattr(self, \"port\", None),\n 1211 |                     error_type=error,\n 1212 |                     retry_attempts=failure_count,\n 1213 |                 )\n 1214 | \n 1215 |             await record_connection_closed(\n 1216 |                 close_reason=close_reason,\n 1217 |                 error_type=error,\n 1218 |             )\n 1219 |         else:\n 1220 |             await record_connection_closed(\n 1221 |                 close_reason=CloseReason.APPLICATION_CLOSE,\n 1222 |             )","lines":24,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/connection.py#L1199-L1222"}]},
{"id":"ERR_4","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"_close_connection / _reconnect / _disconnect_reset_raise_on_watching / _disconnect_raise_on_watching all dereference failure_count with `failure_count <= conn.retry.get_retries()` after only checking `error`. Their signatures declare failure_count: Optional[int] = None. These are always invoked from failure_callback with an int today, but the default-None signature plus the `if error and failure_count <= ...` pattern means any future/alternate caller passing error without failure_count raises TypeError ('<=' not supported between NoneType and int). The Optional typing advertises an unsafe contract.","fix":"Either make failure_count a required int parameter, or guard with `if error and failure_count is not None and failure_count <= conn.retry.get_retries()`.","locations":[{"ref":"redis/client.py:888","code":"  888 |         if error and failure_count <= conn.retry.get_retries():","lines":1,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/client.py#L888"},{"ref":"redis/client.py:1302","code":" 1302 |         if error and failure_count <= conn.retry.get_retries():","lines":1,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/client.py#L1302"},{"ref":"redis/client.py:1968","code":" 1968 |         if error and failure_count <= conn.retry.get_retries():","lines":1,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/client.py#L1968"},{"ref":"redis/client.py:1968","code":" 1968 |         if error and failure_count <= conn.retry.get_retries():","lines":1,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/client.py#L1968"}]},
{"id":"ERR_5","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"RedisCluster._internal_execute_command never raises a final error after exhausting retries in some edge cases. The retry loop `for _ in range(execute_attempts)` returns on success and re-raises non-retryable exceptions, but if a retryable exception (in ERRORS_ALLOW_RETRY) is thrown on the final iteration when `retry_attempts` has already reached 0, the `if retry_attempts > 0` branch is false, so it falls to the `else` and re-raises - that path is fine. However if every iteration decrements retry_attempts and `continue`s, after the loop completes there is no fallback `raise`, so the function falls off the end and returns None implicitly. This can only happen if the last attempt's exception is caught by the retry branch while retry_attempts just became 0 mid-iteration; given the decrement happens inside the branch the loop body still continues. The net effect: under a precise interleaving the method can return None instead of raising, masking a hard failure.","fix":"Add an explicit `raise` (or `raise last_exception`) after the for-loop to guarantee the method never silently returns None when all attempts were consumed by retries.","locations":[{"ref":"redis/cluster.py:1707-1773","code":" 1707 |         for _ in range(execute_attempts):\n 1708 |             try:\n 1709 |                 res = {}\n 1710 |                 if not target_nodes_specified:\n 1711 |                     # Determine the nodes to execute the command on\n 1712 |                     target_nodes = self._determine_nodes(\n 1713 |                         *args,\n 1714 |                         request_policy=command_policies.request_policy,\n 1715 |                         nodes_flag=passed_targets,\n 1716 |                     )\n 1717 | \n 1718 |                     if not target_nodes:\n 1719 |                         raise RedisClusterException(\n 1720 |                             f\"No targets were found to execute {args} command on\"\n 1721 |                         )\n 1722 |                     if (\n 1723 |                         len(target_nodes) == 1\n 1724 |                         and target_nodes[0] == self.get_default_node()\n 1725 |                     ):\n 1726 |                         is_default_node = True\n 1727 |                 for node in target_nodes:\n 1728 |                     res[node.name] = self._execute_command(node, *args, **kwargs)\n 1729 | \n 1730 |                     if command_policies.response_policy == ResponsePolicy.ONE_SUCCEEDED:\n 1731 |                         break\n 1732 | \n 1733 |                 # Return the processed result\n 1734 |                 return self._process_result(\n 1735 |                     args[0],\n 1736 |                     res,\n 1737 |                     response_policy=command_policies.response_policy,\n 1738 |                     **kwargs,\n 1739 |                 )\n 1740 |             except Exception as e:\n 1741 |                 if retry_attempts > 0 and type(e) in self.__class__.ERRORS_ALLOW_RETRY:\n 1742 |                     if is_default_node:\n 1743 |                         # Replace the default cluster node\n 1744 |                         self.replace_default_node()\n 1745 |                     # The nodes and slots cache were reinitialized.\n 1746 |                     # Try again with the new cluster setup.\n 1747 |                     retry_attempts -= 1\n 1748 |                     failure_count += 1\n 1749 | \n 1750 |                     if hasattr(e, \"connection\"):\n 1751 |                         self._record_command_metric(\n 1752 |                             command_name=args[0],\n 1753 |                             duration_seconds=time.monotonic() - start_time,\n 1754 |                             connection=e.connection,\n 1755 |                             error=e,\n 1756 |                         )\n 1757 | \n 1758 |                         self._record_error_metric(\n 1759 |                             error=e,\n 1760 |                             connection=e.connection,\n 1761 |                             retry_attempts=failure_count,\n 1762 |                         )\n 1763 |                     continue\n 1764 |                 else:\n 1765 |                     # raise the exception\n 1766 |                     if hasattr(e, \"connection\"):\n 1767 |                         self._record_error_metric(\n 1768 |                             error=e,\n 1769 |                             connection=e.connection,\n 1770 |                             retry_attempts=failure_count,\n 1771 |                             is_internal=False,\n 1772 |                         )\n 1773 |                     raise e","lines":67,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/cluster.py#L1707-L1773"}]},
{"id":"ERR_6","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"AbstractBloom.append_items_and_increments and append_values_and_weights iterate `range(len(items))` and index into increments/weights without checking equal length. If the caller passes mismatched-length lists (e.g. items longer than increments), this raises an IndexError deep in arg construction; if increments is longer, extra values are silently dropped. TOPK.INCRBY and CMS.INCRBY both flow through here.","fix":"Validate `len(items) == len(increments)` (raise DataError on mismatch) before zipping, and iterate with zip() instead of index-based range(len()).","locations":[{"ref":"redis/commands/bf/__init__.py:70-82","code":"   70 |     @staticmethod\n   71 |     def append_items_and_increments(params, items, increments):\n   72 |         \"\"\"Append pairs of items and increments to params.\"\"\"\n   73 |         for i in range(len(items)):\n   74 |             params.append(items[i])\n   75 |             params.append(increments[i])\n   76 | \n   77 |     @staticmethod\n   78 |     def append_values_and_weights(params, items, weights):\n   79 |         \"\"\"Append pairs of items and weights to params.\"\"\"\n   80 |         for i in range(len(items)):\n   81 |             params.append(items[i])\n   82 |             params.append(weights[i])","lines":13,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/bf/__init__.py#L70-L82"}]},
{"id":"ERR_7","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"easy","description":"zmpop raises a bare `raise DataError` with no message when neither or both of min/max are set, whereas its blocking sibling bzmpop raises DataError('Either min or max, but not both must be set'). The user gets an empty, unhelpful exception from zmpop. Copy-paste inconsistency between the two near-identical methods.","fix":"Add the same message: raise DataError('Either min or max, but not both must be set').","locations":[{"ref":"redis/commands/core.py:8748-8750","code":" 8748 |         args = [num_keys] + keys\n 8749 |         if (min and max) or (not min and not max):\n 8750 |             raise DataError","lines":3,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/core.py#L8748-L8750"},{"ref":"redis/commands/core.py:8803-8805","code":" 8803 |         args = [timeout, numkeys, *keys]\n 8804 |         if (min and max) or (not min and not max):\n 8805 |             raise DataError(\"Either min or max, but not both must be set\")","lines":3,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/core.py#L8803-L8805"}]},
{"id":"ERR_8","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"`TextField.__init__` silently ignores an invalid `phonetic_matcher`. The PHONETIC token is only appended when `phonetic_matcher in [\"dm:en\", \"dm:fr\", \"dm:pt\", \"dm:es\"]`; any other truthy value (e.g. a typo like \"dm:de\" or \"en\") is dropped without error, so the field is created without phonetics and the user gets no feedback that their option was discarded.","fix":"Raise a DataError/ValueError when `phonetic_matcher` is set but not one of the supported values, instead of silently skipping it.","locations":[{"ref":"redis/commands/search/field.py:100-107","code":"  100 |         if phonetic_matcher and phonetic_matcher in [\n  101 |             \"dm:en\",\n  102 |             \"dm:fr\",\n  103 |             \"dm:pt\",\n  104 |             \"dm:es\",\n  105 |         ]:\n  106 |             Field.append_arg(self, self.PHONETIC)\n  107 |             Field.append_arg(self, phonetic_matcher)","lines":8,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/search/field.py#L100-L107"}]},
{"id":"ERR_9","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"add_database catches only UnhealthyDatabaseException but the health check / failover path can raise other exceptions, and on the skip-path the unhealthy database is still added and may be auto-promoted. _check_db_health -> health_check_policy.execute raises UnhealthyDatabaseException for probe exceptions, but get_client() can raise ValueError/TypeError (unsupported client type, cluster with no nodes) which are not caught, so add_database fails hard even with skip_initial_health_check=True. Additionally, when the health check is skipped due to UnhealthyDatabaseException, the database is added with whatever circuit state it has and _change_active_database may still promote it if its weight is highest and circuit happens to be CLOSED.","fix":"Broaden/clarify exception handling around the initial health check when skip_initial_health_check is True, and ensure a database that failed (or skipped) its health check is left with circuit OPEN so it cannot be auto-promoted.","locations":[{"ref":"redis/multidb/client.py:215-223","code":"  215 |         try:\n  216 |             self._bg_scheduler.run_coro_sync(self._check_db_health, database)\n  217 |         except UnhealthyDatabaseException:\n  218 |             if not skip_initial_health_check:\n  219 |                 raise\n  220 | \n  221 |         highest_weighted_db, highest_weight = self._databases.get_top_n(1)[0]\n  222 |         self._databases.add(database, database.weight)\n  223 |         self._change_active_database(database, highest_weighted_db)","lines":9,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/multidb/client.py#L215-L223"},{"ref":"redis/asyncio/multidb/client.py:220-228","code":"  220 |         try:\n  221 |             await self._check_db_health(database)\n  222 |         except UnhealthyDatabaseException:\n  223 |             if not skip_initial_health_check:\n  224 |                 raise\n  225 | \n  226 |         highest_weighted_db, highest_weight = self._databases.get_top_n(1)[0]\n  227 |         self._databases.add(database, database.weight)\n  228 |         await self._change_active_database(database, highest_weighted_db)","lines":9,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/multidb/client.py#L220-L228"}]},
{"id":"ERR_10","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"RedisMetricsCollector.init_csc_items reads self.csc_items before it is ever assigned. _init_csc_metrics() creates csc_requests/csc_evictions/csc_network_saved but never csc_items, and __init__ does not set it either. The guard 'if MetricGroup.CSC not in self.config.metric_groups and not self.csc_items' evaluates 'not self.csc_items' whenever CSC is not in metric_groups, raising AttributeError. The recorder wrapper swallows the exception, so the CSC items observable gauge is silently never created - the metric is dead.","fix":"Initialize self.csc_items = None in __init__ (or in _init_csc_metrics), and fix the guard precedence: 'if MetricGroup.CSC not in self.config.metric_groups: return' on its own line. The 'and not self.csc_items' clause is also logically wrong (short-circuit evaluation makes it never reached when CSC IS enabled).","locations":[{"ref":"redis/observability/metrics.py:401-419","code":"  401 |     def init_csc_items(\n  402 |         self,\n  403 |         callback: Callable,\n  404 |     ) -> None:\n  405 |         \"\"\"\n  406 |         Initialize observable gauge for CSC items metric.\n  407 | \n  408 |         Args:\n  409 |             callback: Callback function to retrieve CSC items count\n  410 |         \"\"\"\n  411 |         if MetricGroup.CSC not in self.config.metric_groups and not self.csc_items:\n  412 |             return\n  413 | \n  414 |         self.csc_items = self.meter.create_observable_gauge(\n  415 |             name=\"redis.client.csc.items\",\n  416 |             unit=\"{item}\",\n  417 |             description=\"The total number of cached responses currently stored\",\n  418 |             callbacks=[callback],\n  419 |         )","lines":19,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/observability/metrics.py#L401-L419"}]},
{"id":"ERR_11","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"medium","difficulty":"medium","description":"SentinelConnectionPoolProxy.rotate_slaves is a generator that always `raise SlaveNotFoundError` after yielding the master fallback. Because it is a generator, the final `raise` only executes when the consumer exhausts all yields (i.e. tries every slave and the master and none connect). discover_slaves and connect_to consume it correctly, but the master fallback yields get_master_address() even for slave pools, meaning a slave_for() client can silently connect to the master. This may be intended fallback behavior but is undocumented and can surprise users expecting read-only routing.","fix":"Document the master-fallback behavior for slave pools, or make it opt-in; ensure callers that require a true replica do not silently get the master.","locations":[{"ref":"redis/sentinel.py:130-144","code":"  130 |     def rotate_slaves(self):\n  131 |         slaves = self.sentinel_manager.discover_slaves(self.service_name)\n  132 |         if slaves:\n  133 |             if self.slave_rr_counter is None:\n  134 |                 self.slave_rr_counter = random.randint(0, len(slaves) - 1)\n  135 |             for _ in range(len(slaves)):\n  136 |                 self.slave_rr_counter = (self.slave_rr_counter + 1) % len(slaves)\n  137 |                 slave = slaves[self.slave_rr_counter]\n  138 |                 yield slave\n  139 |         # Fallback to the master connection\n  140 |         try:\n  141 |             yield self.get_master_address()\n  142 |         except MasterNotFoundError:\n  143 |             pass\n  144 |         raise SlaveNotFoundError(f\"No slave found for {self.service_name!r}\")","lines":15,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/sentinel.py#L130-L144"}]},
{"id":"ERR_12","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`parse_xpending` (non-detail branch) indexes response[0..3] unconditionally and iterates `response[3] or []`. For a malformed/short XPENDING summary reply this raises IndexError. Minor, but it is one of several response_callbacks that assume exact shape without guarding length; combined with the fact a ResponseError instance can be returned in-band by the parser, callbacks generally trust positional structure.","fix":"Validate len(response) >= 4 (or wrap) before positional access, or rely on the command layer to guarantee shape.","locations":[{"ref":"redis/_parsers/helpers.py:854-863","code":"  854 | def parse_xpending(response, **options):\n  855 |     if options.get(\"parse_detail\", False):\n  856 |         return parse_xpending_range(response)\n  857 |     consumers = [{\"name\": n, \"pending\": int(p)} for n, p in response[3] or []]\n  858 |     return {\n  859 |         \"pending\": response[0],\n  860 |         \"min\": response[1],\n  861 |         \"max\": response[2],\n  862 |         \"consumers\": consumers,\n  863 |     }","lines":10,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/_parsers/helpers.py#L854-L863"}]},
{"id":"ERR_13","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"get_random_primary_node() / get_random_node() call random.choice() on the result of get_primaries()/nodes_cache.values(). If the cluster currently has no primaries (e.g. transient state right after aclose() set default_node=None and before reinitialization, or all-replica view) random.choice([]) raises IndexError rather than a meaningful cluster exception, surfacing an opaque error from the keyless/random routing path.","fix":"Guard against an empty node list and raise RedisClusterException/SlotNotCoveredError (or trigger reinitialization) instead of letting random.choice raise IndexError.","locations":[{"ref":"redis/asyncio/cluster.py:818-820","code":"  818 |     def get_random_node(self) -> \"ClusterNode\":\n  819 |         \"\"\"Get a random node of the cluster.\"\"\"\n  820 |         return random.choice(list(self.nodes_manager.nodes_cache.values()))","lines":3,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/cluster.py#L818-L820"},{"ref":"redis/asyncio/cluster.py:883-887","code":"  883 |     def get_random_primary_node(self) -> \"ClusterNode\":\n  884 |         \"\"\"\n  885 |         Returns a random primary node\n  886 |         \"\"\"\n  887 |         return random.choice(self.get_primaries())","lines":5,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/cluster.py#L883-L887"}]},
{"id":"ERR_14","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"Connection._connect() sets self._reader/self._writer BEFORE attempting to apply TCP keepalive options. If setsockopt raises (OSError/TypeError) it calls writer.close() and re-raises, but self._reader and self._writer remain assigned, so is_connected returns True for a connection whose transport was just closed. The disconnect()/retry path may then skip reconnect or operate on a closed writer. The sync mirror builds the socket and only assigns after success.","fix":"On the keepalive setsockopt failure path, reset self._reader = self._writer = None (or assign them only after keepalive setup succeeds) so is_connected reflects the closed transport.","locations":[{"ref":"redis/asyncio/connection.py:1591-1613","code":" 1591 |     async def _connect(self):\n 1592 |         \"\"\"Create a TCP socket connection\"\"\"\n 1593 |         async with async_timeout(self.socket_connect_timeout):\n 1594 |             reader, writer = await asyncio.open_connection(\n 1595 |                 **self._connection_arguments()\n 1596 |             )\n 1597 |         self._reader = reader\n 1598 |         self._writer = writer\n 1599 |         sock = writer.transport.get_extra_info(\"socket\")\n 1600 |         if sock:\n 1601 |             sock.setsockopt(socket.IPPROTO_TCP, socket.TCP_NODELAY, 1)\n 1602 |             try:\n 1603 |                 # TCP_KEEPALIVE\n 1604 |                 if self.socket_keepalive:\n 1605 |                     sock.setsockopt(socket.SOL_SOCKET, socket.SO_KEEPALIVE, 1)\n 1606 |                     for k, v in self.socket_keepalive_options.items():\n 1607 |                         sock.setsockopt(socket.SOL_TCP, k, v)\n 1608 | \n 1609 |             except (OSError, TypeError):\n 1610 |                 # `socket_keepalive_options` might contain invalid options\n 1611 |                 # causing an error. Do not leave the connection open.\n 1612 |                 writer.close()\n 1613 |                 raise","lines":23,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/connection.py#L1591-L1613"}]},
{"id":"ERR_15","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"Async aclose() awaits health_check_policy.close() and active client aclose() after cancelling tasks but does not await the cancelled tasks, so cancellation may not have propagated. _recurring_hc_task / _half_open_state_task / _hc_tasks are .cancel()'d but never awaited; pending health-check tasks may still hold/clean up connection pools concurrently with _health_check_policy.close(), and 'Task was destroyed but it is pending' warnings can appear. The sync close() relies on BackgroundScheduler.stop() which at least signals the loops to stop.","fix":"After cancelling, await the tasks with asyncio.gather(..., return_exceptions=True) before closing the health-check policy and the active client.","locations":[{"ref":"redis/asyncio/multidb/client.py:93-107","code":"   93 |     async def aclose(self):\n   94 |         # Cancel background tasks\n   95 |         if self._recurring_hc_task:\n   96 |             self._recurring_hc_task.cancel()\n   97 |         if self._half_open_state_task:\n   98 |             self._half_open_state_task.cancel()\n   99 |         for hc_task in self._hc_tasks:\n  100 |             hc_task.cancel()\n  101 | \n  102 |         # Close health check connection pools\n  103 |         await self._health_check_policy.close()\n  104 | \n  105 |         # Close database client\n  106 |         if self.command_executor.active_database:\n  107 |             await self.command_executor.active_database.client.aclose()","lines":15,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/multidb/client.py#L93-L107"}]},
{"id":"ERR_16","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"Sentinel.execute_command gathers tasks with asyncio.gather(*tasks) without return_exceptions=True. If one sentinel raises (and the error is not one of the caught ConnectionError/TimeoutError types - e.g. any other exception), gather propagates the first exception while the other tasks are left running/un-awaited, producing 'Task was destroyed but it is pending' / 'exception was never retrieved' warnings and leaking the in-flight commands. The fan-out command path is meant to tolerate individual sentinel failures.","fix":"Either gather with return_exceptions=True and aggregate, or wrap gather in try/finally that cancels and awaits remaining tasks on failure.","locations":[{"ref":"redis/asyncio/sentinel.py:255-264","code":"  255 |         tasks = [\n  256 |             asyncio.Task(sentinel.execute_command(*args, **kwargs))\n  257 |             for sentinel in self.sentinels\n  258 |         ]\n  259 |         responses = await asyncio.gather(*tasks)\n  260 | \n  261 |         if return_responses:\n  262 |             return responses\n  263 | \n  264 |         return all(responses)","lines":10,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/sentinel.py#L255-L264"}]},
{"id":"ERR_17","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"TokenManager.__del__ calls self.stop(), but stop() accesses self._init_timer/self._next_timer. If __init__ raised before those attributes were set (e.g. partway), __del__ -> stop() would raise AttributeError during garbage collection. More practically, __del__ logging 'Token manager are disposed' (grammatically wrong) runs at interpreter shutdown when asyncio internals may already be torn down, and cancelling a timer whose loop is gone can raise. Relying on __del__ for resource cleanup of event-loop timers is fragile.","fix":"Make stop() defensive (getattr with None default) and avoid relying on __del__ for loop/timer teardown; fix the log message grammar to 'Token manager is disposed'.","locations":[{"ref":"redis/auth/token_manager.py:132-134","code":"  132 |     def __del__(self):\n  133 |         logger.info(\"Token manager are disposed\")\n  134 |         self.stop()","lines":3,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/auth/token_manager.py#L132-L134"},{"ref":"redis/auth/token_manager.py:208-212","code":"  208 |     def stop(self):\n  209 |         if self._init_timer is not None:\n  210 |             self._init_timer.cancel()\n  211 |         if self._next_timer is not None:\n  212 |             self._next_timer.cancel()","lines":5,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/auth/token_manager.py#L208-L212"}]},
{"id":"ERR_18","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"PubSub.parse_response decrements self.health_check_response_counter when a health-check response is observed, but does not floor it at zero. Combined with clean_health_check_responses (which can also decrement) and the resets to 0 in subscribe/psubscribe/ssubscribe, the counter can be driven negative or out of sync, which then makes `health_check_response_counter > 0` checks behave incorrectly (skip draining).","fix":"Clamp decrements with max(0, counter - 1) or centralize counter bookkeeping in one place.","locations":[{"ref":"redis/client.py:1439-1442","code":" 1439 |         if self.is_health_check_response(response):\n 1440 |             # ignore the health check message as user might not expect it\n 1441 |             self.health_check_response_counter -= 1\n 1442 |             return None","lines":4,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/client.py#L1439-L1442"},{"ref":"redis/client.py:1270-1286","code":" 1270 |     def clean_health_check_responses(self) -> None:\n 1271 |         \"\"\"\n 1272 |         If any health check responses are present, clean them\n 1273 |         \"\"\"\n 1274 |         ttl = 10\n 1275 |         conn = self.connection\n 1276 |         while conn and self.health_check_response_counter > 0 and ttl > 0:\n 1277 |             if self._execute(conn, conn.can_read, timeout=conn.socket_timeout):\n 1278 |                 response = self._execute(conn, conn.read_response)\n 1279 |                 if self.is_health_check_response(response):\n 1280 |                     self.health_check_response_counter -= 1\n 1281 |                 else:\n 1282 |                     raise PubSubError(\n 1283 |                         \"A non health check response was cleaned by \"\n 1284 |                         \"execute_command: {}\".format(response)\n 1285 |                     )\n 1286 |             ttl -= 1","lines":17,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/client.py#L1270-L1286"}]},
{"id":"ERR_19","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"PubSubWorkerThread.run catches BaseException (including KeyboardInterrupt/SystemExit/GeneratorExit) and routes it to exception_handler instead of letting it terminate the thread/process. If exception_handler does not re-raise, KeyboardInterrupt is swallowed and the loop continues, making the worker thread effectively un-interruptible from within.","fix":"Catch Exception rather than BaseException, or explicitly re-raise KeyboardInterrupt/SystemExit before delegating to exception_handler.","locations":[{"ref":"redis/client.py:1823-1836","code":" 1823 |         while self._running.is_set():\n 1824 |             try:\n 1825 |                 if not self.sharded_pubsub:\n 1826 |                     pubsub.get_message(\n 1827 |                         ignore_subscribe_messages=True, timeout=sleep_time\n 1828 |                     )\n 1829 |                 else:\n 1830 |                     pubsub.get_sharded_message(\n 1831 |                         ignore_subscribe_messages=True, timeout=sleep_time\n 1832 |                     )\n 1833 |             except BaseException as e:\n 1834 |                 if self.exception_handler is None:\n 1835 |                     raise\n 1836 |                 self.exception_handler(e, pubsub, self)","lines":14,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/client.py#L1823-L1836"}]},
{"id":"ERR_20","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"get_connection (module function, line 115) returns `redis_node.connection or redis_node.connection_pool.get_connection()` but the deprecated_args decorator only allows `redis_node`. Callers in this file invoke it as `get_connection(redis_node)`. When `redis_node.connection` is a falsy-but-present sentinel it would be bypassed, but more importantly the function silently returns a pooled connection that the caller is responsible for releasing; the single-connection `redis_node.connection` branch returns a connection that must NOT be released to the pool, yet _execute_command's finally block unconditionally calls `redis_node.connection_pool.release(connection)` (line 1887). If a node ever has a standalone `connection` set, that connection would be wrongly released into the pool.","fix":"Either guarantee cluster nodes never use the single `connection` attribute, or track in _execute_command whether the connection came from the pool and only release pooled connections.","locations":[{"ref":"redis/cluster.py:138-139","code":"  138 | def get_connection(redis_node: Redis, *args, **options) -> Connection:\n  139 |     return redis_node.connection or redis_node.connection_pool.get_connection()","lines":2,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/cluster.py#L138-L139"},{"ref":"redis/cluster.py:2128-2130","code":" 2128 |             finally:\n 2129 |                 if connection is not None:\n 2130 |                     redis_node.connection_pool.release(connection)","lines":3,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/cluster.py#L2128-L2130"}]},
{"id":"ERR_21","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"ClusterNode.__init__ performs a blocking DNS resolution (socket.gethostbyname) for host == 'localhost' (line 2024-2025), and NodesManager.get_node does the same (line 2181-2182). These calls happen while holding no timeout and, for get_node, can be reached on the command hot path. A slow or misconfigured resolver blocks the calling thread indefinitely, and any resolution failure raises socket.gaierror (not a RedisError), which is not caught by the cluster retry layer. This couples node identity to DNS at construction time and can surface as an unexpected, non-retryable exception.","fix":"Resolve localhost once at a well-defined point with error handling, or avoid forcing resolution of 'localhost' in the hot path; at minimum wrap gethostbyname so failures map to a RedisClusterException/ConnectionError.","locations":[{"ref":"redis/cluster.py:2252-2254","code":" 2252 |     def __init__(self, host, port, server_type=None, redis_connection=None):\n 2253 |         if host == \"localhost\":\n 2254 |             host = socket.gethostbyname(host)","lines":3,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/cluster.py#L2252-L2254"},{"ref":"redis/cluster.py:2447-2452","code":" 2447 |         if host and port:\n 2448 |             # the user passed host and port\n 2449 |             if host == \"localhost\":\n 2450 |                 host = socket.gethostbyname(host)\n 2451 |             with self._lock:\n 2452 |                 return self.nodes_cache.get(get_node_name(host=host, port=port))","lines":6,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/cluster.py#L2447-L2452"}]},
{"id":"ERR_22","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"easy","description":"In client_pause the args list (which contains str(timeout)) is built before the type validation runs. If timeout is not an int, str(timeout) has already been computed and placed into args, then the DataError is raised - but more importantly the validation is dead-weight ordering: the guard should run before constructing the command. As written str(timeout) on a non-int (e.g. a float or str) silently succeeds at list-construction time and the only thing that catches it is the isinstance check on the next line. The ordering is backwards and brittle; the str() conversion of a bad value happens before validation.","fix":"Validate `isinstance(timeout, int)` first, then build `args = ['CLIENT PAUSE', str(timeout)]`.","locations":[{"ref":"redis/commands/core.py:1238-1243","code":" 1238 |         args = [\"CLIENT PAUSE\", str(timeout)]\n 1239 |         if not isinstance(timeout, int):\n 1240 |             raise DataError(\"CLIENT PAUSE timeout must be an integer\")\n 1241 |         if not all:\n 1242 |             args.append(\"WRITE\")\n 1243 |         return self.execute_command(*args, **kwargs)","lines":6,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/core.py#L1238-L1243"}]},
{"id":"ERR_23","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In xautoclaim, the count validation reuses the wrong command name in its error: `raise DataError('XPENDING count must be a integer >= 0')` inside XAUTOCLAIM. Copy-paste leftover from xpending_range; the message should reference XAUTOCLAIM. Also both use the grammatically-off 'must be a integer'.","fix":"Change the message to reference XAUTOCLAIM (e.g. 'XAUTOCLAIM count must be an integer >= 0').","locations":[{"ref":"redis/commands/core.py:7203-7205","code":" 7203 |         try:\n 7204 |             if int(count) < 0:\n 7205 |                 raise DataError(\"XPENDING count must be a integer >= 0\")","lines":3,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/core.py#L7203-L7205"}]},
{"id":"ERR_24","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"xnack validates retrycount with `if retrycount < 0` but does not check isinstance(retrycount, int), unlike xclaim which validates `not isinstance(retrycount, int)`. A non-int, non-None retrycount (e.g. a string) would either raise an opaque TypeError on the comparison or be sent raw to the server. Inconsistent validation between sibling stream commands.","fix":"Add an isinstance(retrycount, int) check matching xclaim, raising a clear DataError.","locations":[{"ref":"redis/commands/core.py:7688-7691","code":" 7688 |         if retrycount is not None:\n 7689 |             if retrycount < 0:\n 7690 |                 raise DataError(\"XNACK retrycount must be >= 0\")\n 7691 |             pieces.extend([b\"RETRYCOUNT\", retrycount])","lines":4,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/core.py#L7688-L7691"},{"ref":"redis/commands/core.py:7312-7315","code":" 7312 |         if retrycount is not None:\n 7313 |             if not isinstance(retrycount, int):\n 7314 |                 raise DataError(\"XCLAIM retrycount must be an integer\")\n 7315 |             pieces.extend((b\"RETRYCOUNT\", str(retrycount)))","lines":4,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/core.py#L7312-L7315"}]},
{"id":"ERR_25","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"get_protocol_version returns None implicitly when the client is neither a Redis nor an AbstractRedisCluster (no else / no default), whereas the sibling get_legacy_responses explicitly returns True for the same fall-through. Callers that pair these two (the docstring says they mirror each other) get an inconsistent default: a None protocol but a True legacy flag for an unrecognized client type, which can route through apply_module_callbacks' `user_protocol is None` branch unexpectedly.","fix":"Make get_protocol_version return an explicit default for unrecognized client types to match get_legacy_responses, or document the asymmetry.","locations":[{"ref":"redis/commands/helpers.py:128-147","code":"  128 | def get_protocol_version(client):\n  129 |     if isinstance(client, redis.Redis) or isinstance(client, redis.asyncio.Redis):\n  130 |         return client.connection_pool.connection_kwargs.get(\"protocol\")\n  131 |     elif isinstance(client, redis.cluster.AbstractRedisCluster):\n  132 |         return client.nodes_manager.connection_kwargs.get(\"protocol\")\n  133 | \n  134 | \n  135 | def get_legacy_responses(client):\n  136 |     \"\"\"Return the user-supplied ``legacy_responses`` flag for ``client``.\n  137 | \n  138 |     Defaults to ``True`` when the flag is not present in the client's\n  139 |     ``connection_kwargs``. Mirrors :func:`get_protocol_version` so module\n  140 |     command bases can read both the protocol and the response-shape\n  141 |     selection from the same place.\n  142 |     \"\"\"\n  143 |     if isinstance(client, redis.Redis) or isinstance(client, redis.asyncio.Redis):\n  144 |         return client.connection_pool.connection_kwargs.get(\"legacy_responses\", True)\n  145 |     elif isinstance(client, redis.cluster.AbstractRedisCluster):\n  146 |         return client.nodes_manager.connection_kwargs.get(\"legacy_responses\", True)\n  147 |     return True","lines":20,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/helpers.py#L128-L147"}]},
{"id":"ERR_26","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"`_parse_spellcheck` (RESP2 legacy) guards with `if res == 0: return corrections`, but FT.SPELLCHECK never returns the integer 0 (it returns a list); meanwhile the inner loop also tolerates `isinstance(_correction, int) and _correction == 0`. This dead/incorrect sentinel handling does not match the actual protocol and obscures the parser's contract. If `res` is unexpectedly None it would still raise TypeError rather than be handled.","fix":"Remove the int-0 sentinel checks and handle the real empty case (`if not res: return corrections`), so None/empty responses are handled uniformly.","locations":[{"ref":"redis/commands/search/commands.py:338-345","code":"  338 |     def _parse_spellcheck(self, res, **kwargs):\n  339 |         corrections = {}\n  340 |         if res == 0:\n  341 |             return corrections\n  342 | \n  343 |         for _correction in res:\n  344 |             if isinstance(_correction, int) and _correction == 0:\n  345 |                 continue","lines":8,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/search/commands.py#L338-L345"}]},
{"id":"ERR_27","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"timeseries.utils.list_to_dict assumes every element of aList is an indexable 2-tuple/pair (`aList[i][0]`, `aList[i][1]`). It is fed TSInfo labels and m_get/m_range label lists. If the labels arrive as a flat alternating list (as TS.MGET WITHLABELS can on some wire shapes) rather than a list of pairs, this raises IndexError/TypeError instead of a clear error. The companion _pairs_to_dict has the same assumption.","fix":"Validate the element shape or document the required nested-pair input; consider handling the flat-alternating-list form defensively.","locations":[{"ref":"redis/commands/timeseries/utils.py:4-10","code":"    4 | def list_to_dict(aList):\n    5 |     return {nativestr(aList[i][0]): nativestr(aList[i][1]) for i in range(len(aList))}\n    6 | \n    7 | \n    8 | def _pairs_to_dict(pairs):\n    9 |     \"\"\"Convert a list of [key, value] pairs to a dict without forcing str.\"\"\"\n   10 |     return {pairs[i][0]: pairs[i][1] for i in range(len(pairs))}","lines":7,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/timeseries/utils.py#L4-L10"}]},
{"id":"ERR_28","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"HiredisRespSerializer.pack indexes args[0] (lines 129-131) without checking that args is non-empty. Calling pack() with no arguments raises IndexError instead of a meaningful DataError/ValueError. PythonRespSerializer.pack has the identical issue. Empty command packing is a programming error, but the exception type is misleading.","fix":"Add an explicit guard raising DataError when not args, before indexing args[0].","locations":[{"ref":"redis/connection.py:161-164","code":"  161 |         if isinstance(args[0], str):\n  162 |             args = tuple(args[0].encode().split()) + args[1:]\n  163 |         elif b\" \" in args[0]:\n  164 |             args = tuple(args[0].split()) + args[1:]","lines":4,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/connection.py#L161-L164"},{"ref":"redis/connection.py:161-164","code":"  161 |         if isinstance(args[0], str):\n  162 |             args = tuple(args[0].encode().split()) + args[1:]\n  163 |         elif b\" \" in args[0]:\n  164 |             args = tuple(args[0].split()) + args[1:]","lines":4,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/connection.py#L161-L164"}]},
{"id":"ERR_29","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In on_connect_check_health, the HELLO-with-AUTH branch reads the handshake response but the RESP-version validation is fully commented out (lines 1124-1127), while the non-auth HELLO branch (1155-1159) does validate the negotiated proto. This is an inconsistency: when authenticating via HELLO the client never verifies the server actually honored the requested protocol version, so a server downgrade goes undetected on the auth path only.","fix":"Either enable equivalent proto validation for the HELLO+AUTH branch (matching lines 1155-1159) or remove the dead commented block and document why validation is skipped for that path.","locations":[{"ref":"redis/connection.py:1252-1256","code":" 1252 |             self.handshake_metadata = self.read_response()\n 1253 |             # if response.get(b\"proto\") != self.protocol and response.get(\n 1254 |             #     \"proto\"\n 1255 |             # ) != self.protocol:\n 1256 |             #     raise ConnectionError(\"Invalid RESP version\")","lines":5,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/connection.py#L1252-L1256"}]},
{"id":"ERR_30","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"ConnectionPool.re_auth_callback builds closures inside a for-loop that capture the loop variable 'conn' by reference (late binding): 'lambda: conn.send_command(...)' and 'lambda: conn.read_response()'. Because retry.call_with_retry invokes the lambda immediately within the same iteration, this happens to work, but it is a fragile late-binding-closure pattern that breaks the moment the call is deferred. Same anti-pattern, easy to regress.","fix":"Bind conn explicitly as a default argument in the lambdas (lambda c=conn: c.send_command(...)) to avoid late-binding surprises.","locations":[{"ref":"redis/connection.py:3707-3718","code":" 3707 |     def re_auth_callback(self, token: TokenInterface):\n 3708 |         with self._lock:\n 3709 |             for conn in self._available_connections:\n 3710 |                 conn.retry.call_with_retry(\n 3711 |                     lambda: conn.send_command(\n 3712 |                         \"AUTH\", token.try_get(\"oid\"), token.get_value()\n 3713 |                     ),\n 3714 |                     lambda error: self._mock(error),\n 3715 |                 )\n 3716 |                 conn.retry.call_with_retry(\n 3717 |                     lambda: conn.read_response(), lambda error: self._mock(error)\n 3718 |                 )","lines":12,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/connection.py#L3707-L3718"}]},
{"id":"ERR_31","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"In BlockingConnectionPool.get_connection, the 'except Empty' branch (lines 3571-3574) contains a comment that is truncated mid-sentence ('If you want never to') and then raises ConnectionError. Beyond the dangling comment, the connection-readiness retry block (3613-3620) lacks the cache/maint-notifications guard that the base ConnectionPool.get_connection has (3169-3173), so for a blocking pool with client-side caching or maintenance notifications enabled, a connection legitimately holding buffered push data is wrongly treated as 'has data' and forced to reconnect.","fix":"Mirror the base pool's guard: only raise 'Connection has data' when self.cache is None and not self.maint_notifications_enabled(). Fix the truncated comment.","locations":[{"ref":"redis/connection.py:3971-3974","code":" 3971 |             except Empty:\n 3972 |                 # Note that this is not caught by the redis client and will be\n 3973 |                 # raised unless handled by application code. If you want never to\n 3974 |                 raise ConnectionError(\"No connection available.\")","lines":4,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/connection.py#L3971-L3974"}]},
{"id":"ERR_32","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"HttpClient.request: when verify_tls is False it creates a default context and disables hostname checking and verification (CERT_NONE). This is an intentional opt-out, but the default-constructed HttpClient used by auth flows relies on the caller passing verify_tls; there is no warning logged when TLS verification is disabled, making accidental insecure usage (e.g. verify_tls=False in production) silent. Tokens/credentials transit this client.","fix":"Emit a warning (logging.warning or warnings.warn) when verify_tls is False so disabling certificate verification is not silent, given this client carries auth material.","locations":[{"ref":"redis/http/http_client.py:257-277","code":"  257 |         context: Optional[ssl.SSLContext] = None\n  258 |         if url.lower().startswith(\"https\"):\n  259 |             if self.verify_tls:\n  260 |                 # Use provided CA material if any; fall back to system defaults\n  261 |                 context = ssl.create_default_context(\n  262 |                     cafile=self.ca_file,\n  263 |                     capath=self.ca_path,\n  264 |                     cadata=self.ca_data,\n  265 |                 )\n  266 |                 # Load client certificate for mTLS if configured\n  267 |                 if self.client_cert_file:\n  268 |                     context.load_cert_chain(\n  269 |                         certfile=self.client_cert_file,\n  270 |                         keyfile=self.client_key_file,\n  271 |                         password=self.client_key_password,\n  272 |                     )\n  273 |             else:\n  274 |                 # Verification disabled\n  275 |                 context = ssl.create_default_context()\n  276 |                 context.check_hostname = False\n  277 |                 context.verify_mode = ssl.CERT_NONE","lines":21,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/http/http_client.py#L257-L277"}]},
{"id":"ERR_33","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"HttpClient._json_call raises HttpError for any status outside 200-399 using resp.text() as the message, which includes the full response body. For auth endpoints this body can contain error detail including sensitive tokens or credentials, which then propagates into exception messages/logs/tracebacks. Combined with the retry layer, error bodies are read and surfaced verbatim.","fix":"Avoid embedding the raw response body in the exception message for auth flows, or truncate/redact it; expose the body via a separate attribute the caller can opt into logging.","locations":[{"ref":"redis/http/http_client.py:346-350","code":"  346 |         if not (200 <= resp.status < 400):\n  347 |             raise HttpError(resp.status, resp.url, resp.text())\n  348 |         if expect_json:\n  349 |             return resp.json()\n  350 |         return resp","lines":5,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/http/http_client.py#L346-L350"}]},
{"id":"ERR_34","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"OCSP _verify_response raises ConnectionError('failed to valid ocsp response') - grammatically broken message ('failed to valid') that will appear in user-facing connection errors during TLS/OCSP validation, making diagnosis harder.","fix":"Fix the message to e.g. 'failed to validate ocsp response signature'.","locations":[{"ref":"redis/ocsp.py:46-47","code":"   46 |     except InvalidSignature:\n   47 |         raise ConnectionError(\"failed to valid ocsp response\")","lines":2,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/ocsp.py#L46-L47"}]},
{"id":"ERR_35","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"low","difficulty":"medium","description":"extract_expire_flags uses elif chaining for ex/px/exat/pxat, so if a caller passes more than one of them only the first (in ex>px>exat>pxat priority) is honored and the others are silently ignored rather than raising. A user setting both ex and px would expect an error or both flags; instead px is dropped silently.","fix":"Validate that at most one of ex/px/exat/pxat is provided and raise DataError otherwise, or document the silent precedence.","locations":[{"ref":"redis/utils.py:358-392","code":"  358 | def extract_expire_flags(\n  359 |     ex: Optional[ExpiryT] = None,\n  360 |     px: Optional[ExpiryT] = None,\n  361 |     exat: Optional[AbsExpiryT] = None,\n  362 |     pxat: Optional[AbsExpiryT] = None,\n  363 | ) -> List[EncodableT]:\n  364 |     exp_options: list[EncodableT] = []\n  365 |     if ex is not None:\n  366 |         exp_options.append(\"EX\")\n  367 |         if isinstance(ex, datetime.timedelta):\n  368 |             exp_options.append(int(ex.total_seconds()))\n  369 |         elif isinstance(ex, int):\n  370 |             exp_options.append(ex)\n  371 |         elif isinstance(ex, str) and ex.isdigit():\n  372 |             exp_options.append(int(ex))\n  373 |         else:\n  374 |             raise DataError(\"ex must be datetime.timedelta or int\")\n  375 |     elif px is not None:\n  376 |         exp_options.append(\"PX\")\n  377 |         if isinstance(px, datetime.timedelta):\n  378 |             exp_options.append(int(px.total_seconds() * 1000))\n  379 |         elif isinstance(px, int):\n  380 |             exp_options.append(px)\n  381 |         else:\n  382 |             raise DataError(\"px must be datetime.timedelta or int\")\n  383 |     elif exat is not None:\n  384 |         if isinstance(exat, datetime.datetime):\n  385 |             exat = int(exat.timestamp())\n  386 |         exp_options.extend([\"EXAT\", exat])\n  387 |     elif pxat is not None:\n  388 |         if isinstance(pxat, datetime.datetime):\n  389 |             pxat = int(pxat.timestamp() * 1000)\n  390 |         exp_options.extend([\"PXAT\", pxat])\n  391 | \n  392 |     return exp_options","lines":35,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/utils.py#L358-L392"}]},
{"id":"ERR_36","type":"incorrect_error_handling","type_label":"Incorrect Error Handling","severity":"negligible","difficulty":"easy","description":"restore() raises DataError('idletimemust be an integer') - missing space between 'idletime' and 'must'. Cosmetic but user-facing error string typo.","fix":"Fix the message to 'idletime must be an integer'.","locations":[{"ref":"redis/commands/core.py:4279-4280","code":" 4279 |             except ValueError:\n 4280 |                 raise DataError(\"idletimemust be an integer\")","lines":2,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/core.py#L4279-L4280"}]},
{"id":"API_1","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"NodesManager.move_node_to_end_of_cached_nodes mutates shared state without holding the lock. The method pops and re-inserts entries in both self.startup_nodes and self.nodes_cache (lines 2333-2341), but, unlike most other NodesManager methods, it does not acquire self._lock. It is called from _execute_command's ConnectionError/TimeoutError handler (line 1742) concurrently with initialize() (which replaces nodes_cache/startup_nodes wholesale under the lock) and with get_nodes/get_node iterating those dicts. Mutating a dict during another thread's iteration raises `RuntimeError: dictionary changed size during iteration`, and the pop/re-insert can also race with initialize()'s assignment.","fix":"Wrap the body of move_node_to_end_of_cached_nodes in `with self._lock:` to match the locking discipline used by the other nodes_cache/startup_nodes mutators.","locations":[{"ref":"redis/cluster.py:2594-2609","code":" 2594 |     def move_node_to_end_of_cached_nodes(self, node_name: str) -> None:\n 2595 |         \"\"\"\n 2596 |         Move a failing node to the end of startup_nodes and nodes_cache so it's\n 2597 |         tried last during reinitialization and when selecting the default node.\n 2598 |         If the node is not in the respective list, nothing is done.\n 2599 |         \"\"\"\n 2600 |         # Move in startup_nodes\n 2601 |         if node_name in self.startup_nodes and len(self.startup_nodes) > 1:\n 2602 |             node = self.startup_nodes.pop(node_name)\n 2603 |             self.startup_nodes[node_name] = node  # Re-insert at end\n 2604 | \n 2605 |         # Move in nodes_cache - this affects get_nodes_by_server_type ordering\n 2606 |         # which is used to select the default_node during initialize()\n 2607 |         if node_name in self.nodes_cache and len(self.nodes_cache) > 1:\n 2608 |             node = self.nodes_cache.pop(node_name)\n 2609 |             self.nodes_cache[node_name] = node  # Re-insert at end","lines":16,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/cluster.py#L2594-L2609"}]},
{"id":"API_2","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"JSON.get wraps execute_command in `try/except TypeError` to convert a decode failure on a missing key into `None`. For the async client (AsyncJSON), execute_command is a coroutine and returns immediately without running the response callback, so the decode-time TypeError is raised only when the coroutine is awaited, outside this try block. The fallback-to-None behaviour therefore silently does not work for async, breaking sync/async parity for missing keys.","fix":"Handle the missing-key case in the response callback (_decode already returns obj unchanged when obj is None) rather than catching TypeError around execute_command, or override get() in AsyncJSON to await and catch TypeError.","locations":[{"ref":"redis/commands/json/commands.py:430-435","code":"  430 |         # Handle case where key doesn't exist. The JSONDecoder would raise a\n  431 |         # TypeError exception since it can't decode None\n  432 |         try:\n  433 |             return self.execute_command(\"JSON.GET\", *pieces, keys=[name])\n  434 |         except TypeError:\n  435 |             return None","lines":6,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/json/commands.py#L430-L435"}]},
{"id":"API_3","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"easy","description":"`IndexDefinition.__init__` uses a mutable default argument `prefix=[]`. While the current code does not append to this exact object (it rebuilds via `list_or_args`), a shared mutable default is a latent bug and a code smell; any future change that mutates `prefix` in place would leak state across instances.","fix":"Use `prefix=None` and initialise `prefix = [] if prefix is None else prefix` inside the body.","locations":[{"ref":"redis/commands/search/index_definition.py:17-19","code":"   17 |     def __init__(\n   18 |         self,\n   19 |         prefix=[],","lines":3,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/search/index_definition.py#L17-L19"}]},
{"id":"API_4","type":"api_misuse","type_label":"Api Misuse","severity":"medium","difficulty":"medium","description":"AsyncSentinelCommands.sentinel is declared `async def` but its body calls the synchronous super().sentinel(*args), which only issues a DeprecationWarning and returns None (it never returns or awaits anything). The async override therefore returns a coroutine that resolves to None and emits the warning; it does not behave like the other async sentinel_* methods (which return awaitables from execute_command). The override exists solely to change the signature to a coroutine, which is misleading since the base method does no I/O.","fix":"Either drop the async override entirely (the warning-only base method is sync and harmless) or make it consistent. As written the `async def` adds no value and produces a coroutine that must be awaited just to get a warning.","locations":[{"ref":"redis/commands/sentinel.py:255-258","code":"  255 | class AsyncSentinelCommands(SentinelCommands):\n  256 |     async def sentinel(self, *args) -> None:\n  257 |         \"\"\"Redis Sentinel's SENTINEL command.\"\"\"\n  258 |         super().sentinel(*args)","lines":4,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/sentinel.py#L255-L258"},{"ref":"redis/commands/sentinel.py:18-20","code":"   18 |     def sentinel(self, *args):\n   19 |         \"\"\"Redis Sentinel's SENTINEL command.\"\"\"\n   20 |         warnings.warn(DeprecationWarning(\"Use the individual sentinel_* methods\"))","lines":3,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/sentinel.py#L18-L20"}]},
{"id":"API_5","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"_socket_is_empty() reaches into the asyncio.StreamReader private attribute self._reader._buffer to test for buffered data. This is an undocumented CPython internal with no stability guarantee; a stdlib change to StreamReader's internals breaks process_invalidation_messages() (client-side caching invalidation draining) with an AttributeError. There is no equivalent in the sync mirror to cross-check against.","fix":"Prefer the parser's can_read() abstraction (as can_read()/ensure_connection() already do) to detect pending data instead of touching StreamReader._buffer directly.","locations":[{"ref":"redis/asyncio/connection.py:1523-1525","code":" 1523 |     def _socket_is_empty(self):\n 1524 |         \"\"\"Check if the socket is empty\"\"\"\n 1525 |         return len(self._reader._buffer) == 0","lines":3,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/connection.py#L1523-L1525"}]},
{"id":"API_6","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"asyncio.Task(...) is used to schedule sentinel commands instead of asyncio.ensure_future / loop.create_task. Direct construction of asyncio.Task is discouraged and binds the coroutine to the current loop implicitly; ensure_future/create_task is the documented API. Functionally works today but is the kind of construct that breaks across event-loop/policy changes.","fix":"Use `tasks = [asyncio.ensure_future(sentinel.execute_command(*args, **kwargs)) for sentinel in self.sentinels]` (or loop.create_task).","locations":[{"ref":"redis/asyncio/sentinel.py:255-259","code":"  255 |         tasks = [\n  256 |             asyncio.Task(sentinel.execute_command(*args, **kwargs))\n  257 |             for sentinel in self.sentinels\n  258 |         ]\n  259 |         responses = await asyncio.gather(*tasks)","lines":5,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/sentinel.py#L255-L259"}]},
{"id":"API_7","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"parse_cluster_shards assumes resp[0] exists. `parse_cluster_shards` (line 167) indexes `resp[0]` without checking for an empty response, unlike parse_cluster_shards_with_str_keys and parse_cluster_shards_unified which guard with `if not resp`. A CLUSTER SHARDS call returning an empty list (a cluster with no shards / mid-bootstrap) would raise IndexError instead of returning an empty result.","fix":"Add `if not resp: return resp` at the top of parse_cluster_shards, matching the other two parsers.","locations":[{"ref":"redis/cluster.py:186-205","code":"  186 | def parse_cluster_shards(resp, **options):\n  187 |     \"\"\"\n  188 |     Parse CLUSTER SHARDS response.\n  189 |     \"\"\"\n  190 |     if isinstance(resp[0], dict):\n  191 |         return resp\n  192 |     shards = []\n  193 |     for x in resp:\n  194 |         shard = {\"slots\": [], \"nodes\": []}\n  195 |         for i in range(0, len(x[1]), 2):\n  196 |             shard[\"slots\"].append((x[1][i], (x[1][i + 1])))\n  197 |         nodes = x[3]\n  198 |         for node in nodes:\n  199 |             dict_node = {}\n  200 |             for i in range(0, len(node), 2):\n  201 |                 dict_node[node[i]] = node[i + 1]\n  202 |             shard[\"nodes\"].append(dict_node)\n  203 |         shards.append(shard)\n  204 | \n  205 |     return shards","lines":20,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/cluster.py#L186-L205"}]},
{"id":"API_8","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"CMSCommands.merge uses a mutable default argument `weights=[]` (in both @overload stubs and the implementation). While append_weights only reads it, a shared mutable default is a latent footgun and a lint smell flagged across the codebase elsewhere.","fix":"Default to `weights=None` and treat None as empty inside the method (e.g. `weights = weights or []`).","locations":[{"ref":"redis/commands/bf/commands.py:962-972","code":"  962 |     @overload\n  963 |     def merge(\n  964 |         self: SyncClientProtocol, destKey, numKeys, srcKeys, weights=[]\n  965 |     ) -> bool: ...\n  966 | \n  967 |     @overload\n  968 |     def merge(\n  969 |         self: AsyncClientProtocol, destKey, numKeys, srcKeys, weights=[]\n  970 |     ) -> Awaitable[bool]: ...\n  971 | \n  972 |     def merge(self, destKey, numKeys, srcKeys, weights=[]) -> bool | Awaitable[bool]:","lines":11,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/bf/commands.py#L962-L972"}]},
{"id":"API_9","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"ClusterManagementCommands.readonly only sets self.read_from_replicas = True when target_nodes is the literal string 'replicas' or 'all'. If a user passes the node-flag constants (e.g. RedisCluster.REPLICAS / ALL_NODES) or a list of replica ClusterNodes, the READONLY command is still sent but read_from_replicas stays False, so subsequent reads are not actually routed to replicas. The condition relies on a stringly-typed comparison that does not cover the documented target_nodes flag forms.","fix":"Compare against the actual node-flag constants used elsewhere (PRIMARIES/REPLICAS/ALL_NODES) rather than hard-coded lowercase strings, or document that read_from_replicas auto-enable only works with the string forms.","locations":[{"ref":"redis/commands/cluster.py:1030-1042","code":" 1030 |     def readonly(self, target_nodes: \"TargetNodesT\" | None = None) -> ResponseT:\n 1031 |         \"\"\"\n 1032 |         Enables read queries.\n 1033 |         The command will be sent to the default cluster node if target_nodes is\n 1034 |         not specified.\n 1035 | \n 1036 |         For more information see https://redis.io/commands/readonly\n 1037 |         \"\"\"\n 1038 |         if target_nodes == \"replicas\" or target_nodes == \"all\":\n 1039 |             # read_from_replicas will only be enabled if the READONLY command\n 1040 |             # is sent to all replicas\n 1041 |             self.read_from_replicas = True\n 1042 |         return self.execute_command(\"READONLY\", target_nodes=target_nodes)","lines":13,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/cluster.py#L1030-L1042"}]},
{"id":"API_10","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"_georadiusgeneric and _geosearchgeneric forward the entire kwargs dict (containing unit, withdist, withcoord, withhash, count, sort, store, store_dist, any, member, longitude, latitude, radius, width, height) straight into self.execute_command(command, *pieces, **kwargs). These option keys are passed through as response-callback options; many are meaningless to the parser and rely on the callback ignoring unknown keys. This is brittle: any of these names colliding with a real execute_command/option name (e.g. 'store', 'count', 'any') could be misinterpreted. The cleaner pattern (used elsewhere) is to pass only the specific options the callback needs.","fix":"Forward only the response-relevant options (e.g. withcoord/withdist/withhash/store/keys) rather than splatting the full kwargs dict.","locations":[{"ref":"redis/commands/core.py:11775-11819","code":"11775 |     def _georadiusgeneric(\n11776 |         self, command: str, *args: EncodableT, **kwargs: Union[EncodableT, None]\n11777 |     ) -> ResponseT:\n11778 |         pieces = list(args)\n11779 |         if kwargs[\"unit\"] and kwargs[\"unit\"] not in (\"m\", \"km\", \"mi\", \"ft\"):\n11780 |             raise DataError(\"GEORADIUS invalid unit\")\n11781 |         elif kwargs[\"unit\"]:\n11782 |             pieces.append(kwargs[\"unit\"])\n11783 |         else:\n11784 |             pieces.append(\"m\")\n11785 | \n11786 |         if kwargs[\"any\"] and kwargs[\"count\"] is None:\n11787 |             raise DataError(\"``any`` can't be provided without ``count``\")\n11788 | \n11789 |         for arg_name, byte_repr in (\n11790 |             (\"withdist\", \"WITHDIST\"),\n11791 |             (\"withcoord\", \"WITHCOORD\"),\n11792 |             (\"withhash\", \"WITHHASH\"),\n11793 |         ):\n11794 |             if kwargs[arg_name]:\n11795 |                 pieces.append(byte_repr)\n11796 | \n11797 |         if kwargs[\"count\"] is not None:\n11798 |             pieces.extend([\"COUNT\", kwargs[\"count\"]])\n11799 |             if kwargs[\"any\"]:\n11800 |                 pieces.append(\"ANY\")\n11801 | \n11802 |         if kwargs[\"sort\"]:\n11803 |             if kwargs[\"sort\"] == \"ASC\":\n11804 |                 pieces.append(\"ASC\")\n11805 |             elif kwargs[\"sort\"] == \"DESC\":\n11806 |                 pieces.append(\"DESC\")\n11807 |             else:\n11808 |                 raise DataError(\"GEORADIUS invalid sort\")\n11809 | \n11810 |         if kwargs[\"store\"] and kwargs[\"store_dist\"]:\n11811 |             raise DataError(\"GEORADIUS store and store_dist can't be set together\")\n11812 | \n11813 |         if kwargs[\"store\"]:\n11814 |             pieces.extend([b\"STORE\", kwargs[\"store\"]])\n11815 | \n11816 |         if kwargs[\"store_dist\"]:\n11817 |             pieces.extend([b\"STOREDIST\", kwargs[\"store_dist\"]])\n11818 | \n11819 |         return self.execute_command(command, *pieces, **kwargs)","lines":45,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/core.py#L11775-L11819"},{"ref":"redis/commands/core.py:12023-12087","code":"12023 |     def _geosearchgeneric(\n12024 |         self, command: str, *args: EncodableT, **kwargs: Union[EncodableT, None]\n12025 |     ) -> ResponseT:\n12026 |         pieces = list(args)\n12027 | \n12028 |         # FROMMEMBER or FROMLONLAT\n12029 |         if kwargs[\"member\"] is None:\n12030 |             if kwargs[\"longitude\"] is None or kwargs[\"latitude\"] is None:\n12031 |                 raise DataError(\"GEOSEARCH must have member or longitude and latitude\")\n12032 |         if kwargs[\"member\"]:\n12033 |             if kwargs[\"longitude\"] or kwargs[\"latitude\"]:\n12034 |                 raise DataError(\n12035 |                     \"GEOSEARCH member and longitude or latitude can't be set together\"\n12036 |                 )\n12037 |             pieces.extend([b\"FROMMEMBER\", kwargs[\"member\"]])\n12038 |         if kwargs[\"longitude\"] is not None and kwargs[\"latitude\"] is not None:\n12039 |             pieces.extend([b\"FROMLONLAT\", kwargs[\"longitude\"], kwargs[\"latitude\"]])\n12040 | \n12041 |         # BYRADIUS or BYBOX\n12042 |         if kwargs[\"radius\"] is None:\n12043 |             if kwargs[\"width\"] is None or kwargs[\"height\"] is None:\n12044 |                 raise DataError(\"GEOSEARCH must have radius or width and height\")\n12045 |         if kwargs[\"unit\"] is None:\n12046 |             raise DataError(\"GEOSEARCH must have unit\")\n12047 |         if kwargs[\"unit\"].lower() not in (\"m\", \"km\", \"mi\", \"ft\"):\n12048 |             raise DataError(\"GEOSEARCH invalid unit\")\n12049 |         if kwargs[\"radius\"]:\n12050 |             if kwargs[\"width\"] or kwargs[\"height\"]:\n12051 |                 raise DataError(\n12052 |                     \"GEOSEARCH radius and width or height can't be set together\"\n12053 |                 )\n12054 |             pieces.extend([b\"BYRADIUS\", kwargs[\"radius\"], kwargs[\"unit\"]])\n12055 |         if kwargs[\"width\"] and kwargs[\"height\"]:\n12056 |             pieces.extend([b\"BYBOX\", kwargs[\"width\"], kwargs[\"height\"], kwargs[\"unit\"]])\n12057 | \n12058 |         # sort\n12059 |         if kwargs[\"sort\"]:\n12060 |             if kwargs[\"sort\"].upper() == \"ASC\":\n12061 |                 pieces.append(b\"ASC\")\n12062 |             elif kwargs[\"sort\"].upper() == \"DESC\":\n12063 |                 pieces.append(b\"DESC\")\n12064 |             else:\n12065 |                 raise DataError(\"GEOSEARCH invalid sort\")\n12066 | \n12067 |         # count any\n12068 |         if kwargs[\"count\"]:\n12069 |             pieces.extend([b\"COUNT\", kwargs[\"count\"]])\n12070 |             if kwargs[\"any\"]:\n12071 |                 pieces.append(b\"ANY\")\n12072 |         elif kwargs[\"any\"]:\n12073 |
