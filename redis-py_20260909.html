{"id":"API_11","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"RedisModuleCommands.json/ft use mutable default arguments (encoder=JSONEncoder(), decoder=JSONDecoder()). A single JSONEncoder/JSONDecoder instance is shared across every call that omits the arguments, for the lifetime of the process. JSONEncoder/JSONDecoder are effectively stateless for typical use so this is usually benign, but it is the classic mutable-default-argument anti-pattern and means custom subclasses with instance state would be silently shared. AsyncRedisModuleCommands.json repeats it.","fix":"Default to None and instantiate inside the method body (encoder = encoder or JSONEncoder()).","locations":[{"ref":"redis/commands/redismodules.py:30","code":"   30 |     def json(self, encoder=JSONEncoder(), decoder=JSONDecoder()) -> JSON:","lines":1,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/redismodules.py#L30"},{"ref":"redis/commands/redismodules.py:106","code":"  106 |     def json(self, encoder=JSONEncoder(), decoder=JSONDecoder()) -> AsyncJSON:","lines":1,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/redismodules.py#L106"}]},
{"id":"API_12","type":"api_misuse","type_label":"Api Misuse","severity":"low","difficulty":"medium","description":"SSLConnection._wrap_socket_with_ssl, in the stapled-OCSP path, opens a brand new OpenSSL socket via socket.socket(), connects, does the handshake and shuts it down (lines 2165-2169) but never closes the underlying socket created by socket.socket(). The OpenSSL.SSL.Connection wraps an unreferenced socket that is only shut down, not closed, leaking a file descriptor on every stapled-OCSP validation.","fix":"Keep a reference to the raw socket passed to OpenSSL.SSL.Connection and close it (and the OpenSSL connection) in a finally block after do_handshake/shutdown.","locations":[{"ref":"redis/connection.py:2416-2422","code":" 2416 |             #  need another socket\n 2417 |             con = OpenSSL.SSL.Connection(staple_ctx, socket.socket())\n 2418 |             con.request_ocsp()\n 2419 |             con.connect((self.host, self.port))\n 2420 |             con.do_handshake()\n 2421 |             con.shutdown()\n 2422 |             return sslsock","lines":7,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/connection.py#L2416-L2422"}]},
{"id":"PERF_1","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"CacheProxyConnection.read_response calls self._cache.get(self._current_command_cache_key) up to three times in the cache-hit fast path (once in the condition, once for .status, once for .cache_value) under the lock. Each get is a dict/structure lookup and the redundant lookups add overhead on the hot read path, plus they create a TOCTOU window where the entry could theoretically change between calls if get() is not perfectly atomic.","fix":"Fetch the entry once into a local variable and reuse it for the status check and cache_value read.","locations":[{"ref":"redis/connection.py:2010-2026","code":" 2010 |             if self._current_command_cache_key is not None:\n 2011 |                 if (\n 2012 |                     self._cache.get(self._current_command_cache_key) is not None\n 2013 |                     and self._cache.get(self._current_command_cache_key).status\n 2014 |                     != CacheEntryStatus.IN_PROGRESS\n 2015 |                 ):\n 2016 |                     res = copy.deepcopy(\n 2017 |                         self._cache.get(self._current_command_cache_key).cache_value\n 2018 |                     )\n 2019 |                     self._current_command_cache_key = None\n 2020 |                     record_csc_request(\n 2021 |                         result=CSCResult.HIT,\n 2022 |                     )\n 2023 |                     record_csc_network_saved(\n 2024 |                         bytes_saved=len(res) if hasattr(res, \"__len__\") else 0,\n 2025 |                     )\n 2026 |                     return res","lines":17,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/connection.py#L2010-L2026"}]},
{"id":"PERF_2","type":"performance","type_label":"Performance","severity":"medium","difficulty":"medium","description":"Sync recorder: when observability is disabled, _metrics_collector stays None and _get_or_create_collector() is re-invoked on EVERY record_* call (every command, pubsub message, etc.). _get_or_create_collector calls get_observability_instance().get_provider_manager() and checks config each time. The docstrings claim 'Try to initialize (only once)' and 'zero overhead', but there is no negative cache: a disabled-observability deployment pays this lookup cost per operation forever. The async recorder has the same pattern.","fix":"Cache a tri-state (uninitialized / disabled / collector) so the disabled state short-circuits without repeatedly re-querying the provider manager, or set a module-level boolean _initialized flag.","locations":[{"ref":"redis/observability/recorder.py:88-95","code":"   88 |     global _metrics_collector\n   89 | \n   90 |     # Fast path: if collector not initialized, observability is disabled\n   91 |     if _metrics_collector is None:\n   92 |         # Try to initialize (only once)\n   93 |         _metrics_collector = _get_or_create_collector()\n   94 |         if _metrics_collector is None:\n   95 |             return  # Observability not enabled","lines":8,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/observability/recorder.py#L88-L95"},{"ref":"redis/asyncio/observability/recorder.py:47-77","code":"   47 | def _get_or_create_collector() -> Optional[RedisMetricsCollector]:\n   48 |     \"\"\"\n   49 |     Get or create the global metrics collector.\n   50 | \n   51 |     Returns:\n   52 |         RedisMetricsCollector instance if observability is enabled, None otherwise\n   53 |     \"\"\"\n   54 |     global _async_metrics_collector\n   55 | \n   56 |     if _async_metrics_collector is not None:\n   57 |         return _async_metrics_collector\n   58 | \n   59 |     try:\n   60 |         manager = get_observability_instance().get_provider_manager()\n   61 |         if manager is None or not manager.config.enabled_telemetry:\n   62 |             return None\n   63 | \n   64 |         # Get meter from the global MeterProvider\n   65 |         meter = manager.get_meter_provider().get_meter(\n   66 |             RedisMetricsCollector.METER_NAME, RedisMetricsCollector.METER_VERSION\n   67 |         )\n   68 | \n   69 |         _async_metrics_collector = RedisMetricsCollector(meter, manager.config)\n   70 |         return _async_metrics_collector\n   71 | \n   72 |     except ImportError:\n   73 |         # Observability module not available\n   74 |         return None\n   75 |     except Exception:\n   76 |         # Any other error - don't break Redis operations\n   77 |         return None","lines":31,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/observability/recorder.py#L47-L77"}]},
{"id":"PERF_3","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"Async `_AsyncRESPBase._read` / `_readline` accumulate raw socket chunks in `self._chunks` and, on the next `read_response`, rebuild the whole parse buffer with `self._buffer += b''.join(self._chunks)`. For a large multi-bulk reply spread across many recv chunks this is repeated bytes concatenation/copies of the entire accumulated buffer on every response. The pure-python async parser is already the slow path, but this is a quadratic-ish allocation pattern in the hot read loop for large replies.","fix":"Prefer the hiredis parser for large payloads; if optimizing the pure-python path, accumulate into a single bytearray and track an offset rather than re-joining a chunk list each call.","locations":[{"ref":"redis/_parsers/base.py:571-607","code":"  571 |     async def _read(self, length: int) -> bytes:\n  572 |         \"\"\"\n  573 |         Read `length` bytes of data.  These are assumed to be followed\n  574 |         by a '\\r\\n' terminator which is subsequently discarded.\n  575 |         \"\"\"\n  576 |         want = length + 2\n  577 |         end = self._pos + want\n  578 |         if len(self._buffer) >= end:\n  579 |             result = self._buffer[self._pos : end - 2]\n  580 |         else:\n  581 |             tail = self._buffer[self._pos :]\n  582 |             try:\n  583 |                 data = await self._stream.readexactly(want - len(tail))\n  584 |             except IncompleteReadError as error:\n  585 |                 raise ConnectionError(SERVER_CLOSED_CONNECTION_ERROR) from error\n  586 |             result = (tail + data)[:-2]\n  587 |             self._chunks.append(data)\n  588 |         self._pos += want\n  589 |         return result\n  590 | \n  591 |     async def _readline(self) -> bytes:\n  592 |         \"\"\"\n  593 |         read an unknown number of bytes up to the next '\\r\\n'\n  594 |         line separator, which is discarded.\n  595 |         \"\"\"\n  596 |         found = self._buffer.find(b\"\\r\\n\", self._pos)\n  597 |         if found >= 0:\n  598 |             result = self._buffer[self._pos : found]\n  599 |         else:\n  600 |             tail = self._buffer[self._pos :]\n  601 |             data = await self._stream.readline()\n  602 |             if not data.endswith(b\"\\r\\n\"):\n  603 |                 raise ConnectionError(SERVER_CLOSED_CONNECTION_ERROR)\n  604 |             result = (tail + data)[:-2]\n  605 |             self._chunks.append(data)\n  606 |         self._pos += len(result) + 2\n  607 |         return result","lines":37,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/_parsers/base.py#L571-L607"},{"ref":"redis/_parsers/resp2.py:84-92","code":"   84 |         if self._chunks:\n   85 |             # augment parsing buffer with previously read data\n   86 |             self._buffer += b\"\".join(self._chunks)\n   87 |             self._chunks.clear()\n   88 |         self._pos = 0\n   89 |         response = await self._read_response(disable_decoding=disable_decoding)\n   90 |         # Successfully parsing a response allows us to clear our parsing buffer\n   91 |         self._clear()\n   92 |         return response","lines":9,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/_parsers/resp2.py#L84-L92"},{"ref":"redis/_parsers/resp3.py:188-198","code":"  188 |         if self._chunks:\n  189 |             # augment parsing buffer with previously read data\n  190 |             self._buffer += b\"\".join(self._chunks)\n  191 |             self._chunks.clear()\n  192 |         self._pos = 0\n  193 |         response = await self._read_response(\n  194 |             disable_decoding=disable_decoding, push_request=push_request\n  195 |         )\n  196 |         # Successfully parsing a response allows us to clear our parsing buffer\n  197 |         self._clear()\n  198 |         return response","lines":11,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/_parsers/resp3.py#L188-L198"}]},
{"id":"PERF_4","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"On a MovedError, _execute_command recomputes the slot via `await self._determine_slot(*args)` before retrying on the new node. _determine_slot can issue a network round-trip (COMMAND GETKEYS via commands_parser.get_keys) for commands whose keys aren't special-cased. The slot was already known when the command was first dispatched; recomputing it (potentially with a server round-trip) on every MOVED retry adds avoidable latency under MOVED storms.","fix":"Cache the slot computed on the initial dispatch and reuse it in the MOVED branch instead of re-deriving it (and possibly re-querying the server).","locations":[{"ref":"redis/asyncio/cluster.py:1287-1298","code":" 1287 |                 elif moved:\n 1288 |                     # MOVED occurred and the slots cache was updated,\n 1289 |                     # refresh the target node\n 1290 |                     slot = await self._determine_slot(*args)\n 1291 |                     target_node = self.nodes_manager.get_node_from_slot(\n 1292 |                         slot,\n 1293 |                         self.read_from_replicas and args[0] in READ_COMMANDS,\n 1294 |                         self.load_balancing_strategy\n 1295 |                         if args[0] in READ_COMMANDS\n 1296 |                         else None,\n 1297 |                     )\n 1298 |                     moved = False","lines":12,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/cluster.py#L1287-L1298"}]},
{"id":"PERF_5","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"AsyncHTTPClientWrapper.* use asyncio.get_event_loop() to obtain the loop for run_in_executor. get_event_loop() is deprecated when there is no running loop and emits DeprecationWarning on modern Python; inside an async method the correct call is asyncio.get_running_loop(), which is also faster and unambiguous.","fix":"Replace asyncio.get_event_loop() with asyncio.get_running_loop() in all six methods.","locations":[{"ref":"redis/asyncio/http/http_client.py:143","code":"  143 |         loop = asyncio.get_event_loop()","lines":1,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/http/http_client.py#L143"},{"ref":"redis/asyncio/http/http_client.py:158","code":"  158 |         loop = asyncio.get_event_loop()","lines":1,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/http/http_client.py#L158"},{"ref":"redis/asyncio/http/http_client.py:181","code":"  181 |         loop = asyncio.get_event_loop()","lines":1,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/http/http_client.py#L181"},{"ref":"redis/asyncio/http/http_client.py:206","code":"  206 |         loop = asyncio.get_event_loop()","lines":1,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/http/http_client.py#L206"},{"ref":"redis/asyncio/http/http_client.py:231","code":"  231 |         loop = asyncio.get_event_loop()","lines":1,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/http/http_client.py#L231"},{"ref":"redis/asyncio/http/http_client.py:255","code":"  255 |         loop = asyncio.get_event_loop()","lines":1,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/http/http_client.py#L255"}]},
{"id":"PERF_6","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"NodesManager.check_slots_coverage performs a full 16384-iteration Python loop on every topology refresh and on every coverage check. initialize() calls it once per startup node tried (line 2631, inside the loop over startup nodes), so under disagreements or partial coverage it can be invoked many times per reinitialization, each scanning all 16384 slots in pure Python. For a fully covered cluster this is wasted work since `len(tmp_slots) == REDIS_CLUSTER_HASH_SLOTS` already implies full coverage.","fix":"Short-circuit with `if len(slots_cache) == REDIS_CLUSTER_HASH_SLOTS: return True` (slots are a subset of [0, 16384), so equal length implies full coverage), avoiding the per-slot loop in the common case.","locations":[{"ref":"redis/cluster.py:2611-2617","code":" 2611 |     def check_slots_coverage(self, slots_cache):\n 2612 |         # Validate if all slots are covered or if we should try next\n 2613 |         # startup node\n 2614 |         for i in range(0, REDIS_CLUSTER_HASH_SLOTS):\n 2615 |             if i not in slots_cache:\n 2616 |                 return False\n 2617 |         return True","lines":7,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/cluster.py#L2611-L2617"},{"ref":"redis/cluster.py:2955","code":" 2955 |                 fully_covered = self.check_slots_coverage(tmp_slots)","lines":1,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/cluster.py#L2955"}]},
{"id":"PERF_7","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"Sync ClusterManagementCommands.cluster_delslots issues CLUSTER DELSLOTS once per slot serially in a list comprehension, while the async override (AsyncClusterManagementCommands.cluster_delslots) parallelizes the same work with asyncio.gather. For large slot counts the sync path is markedly slower with no functional reason; it could at least be pipelined.","fix":"Pipeline the per-slot DELSLOTS commands in the sync path (or note the intentional serial behavior).","locations":[{"ref":"redis/commands/cluster.py:586-595","code":"  586 |     def cluster_delslots(self, *slots: EncodableT) -> List[bool]:\n  587 |         \"\"\"\n  588 |         Set hash slots as unbound in the cluster.\n  589 |         It determines by it self what node the slot is in and sends it there\n  590 | \n  591 |         Returns a list of the results for each processed slot.\n  592 | \n  593 |         For more information see https://redis.io/commands/cluster-delslots\n  594 |         \"\"\"\n  595 |         return [self.execute_command(\"CLUSTER DELSLOTS\", slot) for slot in slots]","lines":10,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/cluster.py#L586-L595"},{"ref":"redis/commands/cluster.py:1185-1199","code":" 1185 |     async def cluster_delslots(self, *slots: EncodableT) -> List[bool]:\n 1186 |         \"\"\"\n 1187 |         Set hash slots as unbound in the cluster.\n 1188 |         It determines by it self what node the slot is in and sends it there\n 1189 | \n 1190 |         Returns a list of the results for each processed slot.\n 1191 | \n 1192 |         For more information see https://redis.io/commands/cluster-delslots\n 1193 |         \"\"\"\n 1194 |         return await asyncio.gather(\n 1195 |             *(\n 1196 |                 asyncio.create_task(self.execute_command(\"CLUSTER DELSLOTS\", slot))\n 1197 |                 for slot in slots\n 1198 |             )\n 1199 |         )","lines":15,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/cluster.py#L1185-L1199"}]},
{"id":"PERF_8","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"ConnectionPool._get_in_use_connections and BlockingConnectionPool._get_in_use_connections / _get_free_connections rebuild full sets from self.pool.queue / self._connections on every call while holding the lock. These are invoked from update_connections_settings and observability counting which can run frequently during maintenance windows, and BlockingConnectionPool._get_in_use_connections is O(n*m) due to the 'conn not in connections_in_queue' membership test being inside a comprehension over self._connections (it is a set lookup so O(1), but the queue snapshot set is rebuilt each call).","fix":"Cache the queue snapshot once per maintenance pass, or maintain in-use membership incrementally rather than recomputing set differences on every call.","locations":[{"ref":"redis/connection.py:3729-3731","code":" 3729 |     def _get_in_use_connections(self):\n 3730 |         with self._lock:\n 3731 |             return set(self._in_use_connections)","lines":3,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/connection.py#L3729-L3731"},{"ref":"redis/connection.py:4128-4140","code":" 4128 |     def _get_free_connections(self):\n 4129 |         with self._lock:\n 4130 |             return {conn for conn in self.pool.queue if conn}\n 4131 | \n 4132 |     def _get_in_use_connections(self):\n 4133 |         with self._lock:\n 4134 |             # free connections\n 4135 |             connections_in_queue = {conn for conn in self.pool.queue if conn}\n 4136 |             # in self._connections we keep all created connections\n 4137 |             # so the ones that are not in the queue are the in use ones\n 4138 |             return {\n 4139 |                 conn for conn in self._connections if conn not in connections_in_queue\n 4140 |             }","lines":13,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/connection.py#L4128-L4140"}]},
{"id":"PERF_9","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"WeightedList.get_by_weight_range scans the entire list linearly even though items are maintained in sorted (descending weight) order. For large lists a binary search to find the weight-range boundaries would be O(log n) instead of O(n). Also get_top_n returns highest-weighted first only because add() inserts in descending order; correct, but relies on that invariant implicitly.","fix":"Use bisect over the sorted weights to bound the scan for get_by_weight_range; document the descending-order invariant relied on by get_top_n.","locations":[{"ref":"redis/data_structure.py:41-50","code":"   41 |     def get_by_weight_range(\n   42 |         self, min_weight: float, max_weight: float\n   43 |     ) -> List[tuple[Any, Number]]:\n   44 |         \"\"\"Get all items within weight range\"\"\"\n   45 |         with self._lock:\n   46 |             result = []\n   47 |             for item, weight in self._items:\n   48 |                 if min_weight <= weight <= max_weight:\n   49 |                     result.append((item, weight))\n   50 |             return result","lines":10,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/data_structure.py#L41-L50"}]},
{"id":"PERF_10","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"run_in_thread / KeyspaceWorkerThread default poll_timeout is 0.0, which the docstring itself warns 'causes a CPU spin-loop'. Shipping a CPU-burning default and only warning about it in prose is a foot-gun: a user who calls run_in_thread() with no args gets a busy loop pegging a core.","fix":"Default poll_timeout to a small positive value (e.g. 0.1 or 1.0) so the out-of-the-box behavior does not spin the CPU; keep 0.0 available for advanced callers.","locations":[{"ref":"redis/keyspace_notifications.py:1461-1521","code":" 1461 |     def run_in_thread(\n 1462 |         self,\n 1463 |         poll_timeout: float = 0.0,\n 1464 |         daemon: bool = False,\n 1465 |         exception_handler: Callable[\n 1466 |             [\n 1467 |                 BaseException,\n 1468 |                 KeyspaceNotificationsInterface,\n 1469 |                 KeyspaceWorkerThread,\n 1470 |             ],\n 1471 |             None,\n 1472 |         ]\n 1473 |         | None = None,\n 1474 |     ) -> KeyspaceWorkerThread:\n 1475 |         \"\"\"\n 1476 |         Start a background thread that polls for notifications and triggers handlers.\n 1477 | \n 1478 |         This method spawns a thread that continuously calls get_message() to\n 1479 |         process incoming notifications. When a notification arrives, any\n 1480 |         registered handler for that channel/pattern is invoked automatically.\n 1481 | \n 1482 |         All subscriptions must have handlers registered before calling this method.\n 1483 | \n 1484 |         Args:\n 1485 |             poll_timeout: Timeout in seconds for get_message() calls. When no message\n 1486 |                          is available, the thread waits up to this long before checking\n 1487 |                          again. Default 0.0 (non-blocking). WARNING: the default\n 1488 |                          causes a CPU spin-loop. It is preferred to pass a positive\n 1489 |                          value (e.g. 0.1 or 1.0).\n 1490 |             daemon: If True, the thread will be a daemon thread and will be\n 1491 |                    terminated when the main program exits. Default False.\n 1492 |             exception_handler: Optional callback invoked when an exception occurs\n 1493 |                               in the worker thread. Receives (exception, notifications,\n 1494 |                               thread) as arguments. If None, exceptions are raised.\n 1495 | \n 1496 |         Returns:\n 1497 |             KeyspaceWorkerThread: The started worker thread. Call stop() on it\n 1498 |                                  to stop the thread and close the notifications.\n 1499 | \n 1500 |         Raises:\n 1501 |             RedisError: If any subscription doesn't have a handler registered.\n 1502 | \n 1503 |         Example:\n 1504 |             >>> def my_handler(notification):\n 1505 |             ...     print(f\"Got: {notification.key} - {notification.event_type}\")\n 1506 |             >>>\n 1507 |             >>> notifications.subscribe(KeyspaceChannel(\"user:*\"), handler=my_handler)\n 1508 |             >>> thread = notifications.run_in_thread(poll_timeout=0.1, daemon=True)\n 1509 |             >>> # ... handlers are called automatically ...\n 1510 |             >>> thread.stop()\n 1511 |         \"\"\"\n 1512 |         self._validate_all_handlers()\n 1513 | \n 1514 |         thread = KeyspaceWorkerThread(\n 1515 |             self,\n 1516 |             poll_timeout,\n 1517 |             daemon=daemon,\n 1518 |             exception_handler=exception_handler,\n 1519 |         )\n 1520 |         thread.start()\n 1521 |         return thread","lines":61,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/keyspace_notifications.py#L1461-L1521"},{"ref":"redis/keyspace_notifications.py:1569-1585","code":" 1569 |     def run(self) -> None:\n 1570 |         \"\"\"Main loop that polls for notifications and triggers handlers.\"\"\"\n 1571 |         if self._running.is_set():\n 1572 |             return\n 1573 |         self._running.set()\n 1574 |         notifications = self.notifications\n 1575 |         poll_timeout = self.poll_timeout\n 1576 |         while self._running.is_set():\n 1577 |             try:\n 1578 |                 notifications.get_message(\n 1579 |                     ignore_subscribe_messages=True, timeout=poll_timeout\n 1580 |                 )\n 1581 |             except BaseException as e:\n 1582 |                 if self.exception_handler is None:\n 1583 |                     raise\n 1584 |                 self.exception_handler(e, notifications, self)\n 1585 |         notifications.close()","lines":17,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/keyspace_notifications.py#L1569-L1585"}]},
{"id":"PERF_11","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"_check_active_database calls failover_strategy_executor.execute() on the normal path whenever auto_fallback_interval has elapsed, even when the current active database is healthy. When _auto_fallback_interval > 0 and _next_fallback_attempt has passed, the condition is true even if the active DB circuit is CLOSED, so every command after the interval triggers a full failover-strategy evaluation (iterate databases) and a set_active_database call. set_active_database is a no-op for metrics/events when the DB is unchanged (old is new), but the strategy iteration and reschedule run on the hot command path on each elapsed interval.","fix":"This is acceptable but consider short-circuiting when the active DB is healthy and the failover would select the same database, to avoid per-command work after the interval elapses.","locations":[{"ref":"redis/multidb/command_executor.py:329-345","code":"  329 |     def _check_active_database(self):\n  330 |         \"\"\"\n  331 |         Checks if active a database needs to be updated.\n  332 |         \"\"\"\n  333 |         if (\n  334 |             self._active_database is None\n  335 |             or self._active_database.circuit.state != CBState.CLOSED\n  336 |             or (\n  337 |                 self._auto_fallback_interval > 0\n  338 |                 and self._next_fallback_attempt <= datetime.now()\n  339 |             )\n  340 |         ):\n  341 |             self.active_database = (\n  342 |                 self._failover_strategy_executor.execute(),\n  343 |                 GeoFailoverReason.AUTOMATIC,\n  344 |             )\n  345 |             self._schedule_next_fallback()","lines":17,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/multidb/command_executor.py#L329-L345"},{"ref":"redis/asyncio/multidb/command_executor.py:314-330","code":"  314 |     async def _check_active_database(self):\n  315 |         \"\"\"\n  316 |         Checks if active a database needs to be updated.\n  317 |         \"\"\"\n  318 |         if (\n  319 |             self._active_database is None\n  320 |             or self._active_database.circuit.state != CBState.CLOSED\n  321 |             or (\n  322 |                 self._auto_fallback_interval > 0\n  323 |                 and self._next_fallback_attempt <= datetime.now()\n  324 |             )\n  325 |         ):\n  326 |             await self.set_active_database(\n  327 |                 await self._failover_strategy_executor.execute(),\n  328 |                 GeoFailoverReason.AUTOMATIC,\n  329 |             )\n  330 |             self._schedule_next_fallback()","lines":17,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/multidb/command_executor.py#L314-L330"}]},
{"id":"PERF_12","type":"performance","type_label":"Performance","severity":"low","difficulty":"medium","description":"OCSPVerifier.check_certificate and build_certificate_url issue synchronous blocking requests.get() calls to the issuer URL and OCSP responder with no timeout. A slow or hanging OCSP/issuer endpoint will block the connection-establishment thread indefinitely (default requests timeout is None).","fix":"Pass an explicit timeout=... to both requests.get() calls.","locations":[{"ref":"redis/ocsp.py:272-288","code":"  272 |         r = requests.get(issuer_url)\n  273 |         if not r.ok:\n  274 |             raise ConnectionError(\"failed to fetch issuer certificate\")\n  275 |         der = r.content\n  276 |         issuer_cert = self._bin2ascii(der)\n  277 | \n  278 |         ocsp_url = self.build_certificate_url(server, cert, issuer_cert)\n  279 | \n  280 |         # HTTP 1.1 mandates the addition of the Host header in ocsp responses\n  281 |         header = {\n  282 |             \"Host\": urlparse(ocsp_url).netloc,\n  283 |             \"Content-Type\": \"application/ocsp-request\",\n  284 |         }\n  285 |         r = requests.get(ocsp_url, headers=header)\n  286 |         if not r.ok:\n  287 |             raise ConnectionError(\"failed to fetch ocsp certificate\")\n  288 |         return _check_certificate(issuer_cert, r.content, True)","lines":17,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/ocsp.py#L272-L288"}]},
{"id":"PERF_13","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"`_socket_can_read` constructs a fresh `select.poll()` object (or DefaultSelector) and registers the fd on every readiness check in the poll() branch. This is the documented intent (avoid per-call fd allocation that epoll/kqueue selectors incur), and poll() allocates no fd, but the poll object + register/unregister still happens per call in the hot can_read path. For very high call rates a cached poller would avoid the per-call Python object churn.","fix":"Optional: cache a per-parser poll object and re-register lazily; current code is already a deliberate trade-off for fd-exhaustion safety.","locations":[{"ref":"redis/_parsers/hiredis.py:35-56","code":"   35 | def _socket_can_read(sock, timeout: float) -> bool:\n   36 |     # SSL sockets can have decrypted bytes buffered above the OS socket layer.\n   37 |     if hasattr(sock, \"pending\") and sock.pending():\n   38 |         return True\n   39 |     # timeout=0 must be a non-blocking readiness check only; both branches\n   40 |     # below are non-destructive and have no FD_SETSIZE limit (select.select\n   41 |     # raises ValueError for fds >= 1024).\n   42 |     if _HAS_POLL:\n   43 |         # Prefer poll() over selectors.DefaultSelector: epoll/kqueue selectors\n   44 |         # allocate a file descriptor per check and so fail with EMFILE under\n   45 |         # fd exhaustion - the very condition that pushes sockets onto high\n   46 |         # fds. poll() allocates nothing.\n   47 |         poller = select.poll()\n   48 |         poller.register(sock, select.POLLIN)\n   49 |         # poll() takes milliseconds (None blocks forever). POLLHUP/POLLERR/\n   50 |         # POLLNVAL are always reported regardless of the registered mask, so\n   51 |         # closed or errored sockets still count as readable, like select().\n   52 |         poll_timeout = None if timeout is None else timeout * 1000\n   53 |         return bool(poller.poll(poll_timeout))\n   54 |     with selectors.DefaultSelector() as selector:\n   55 |         selector.register(sock, selectors.EVENT_READ)\n   56 |         return bool(selector.select(timeout))","lines":22,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/_parsers/hiredis.py#L35-L56"}]},
{"id":"PERF_14","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"_normalize_keys builds a brand-new dict via {decode(encode(k)): v ...} on every subscribe/unsubscribe call, encoding then immediately decoding each key. For unsubscribe-all paths the keys already come from self.channels (already normalized), so the round-trip is wasted work, though typically on small channel sets.","fix":"Skip normalization when the source is already an internal normalized dict (e.g. when unsubscribing from all).","locations":[{"ref":"redis/client.py:1480-1488","code":" 1480 |     def _normalize_keys(self, data) -> Dict:\n 1481 |         \"\"\"\n 1482 |         normalize channel/pattern names to be either bytes or strings\n 1483 |         based on whether responses are automatically decoded. this saves us\n 1484 |         from coercing the value for each message coming in.\n 1485 |         \"\"\"\n 1486 |         encode = self.encoder.encode\n 1487 |         decode = self.encoder.decode\n 1488 |         return {decode(encode(k)): v for k, v in data.items()}","lines":9,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/client.py#L1480-L1488"}]},
{"id":"PERF_15","type":"performance","type_label":"Performance","severity":"negligible","difficulty":"medium","description":"json.decoders.unstring recompiles the same regexes (`^\\d+.\\d+$`, `^\\d+$`) on every call via re.findall with a string pattern, and uses `.` unescaped in the float regex so it also matches strings like `12x34`. decode_list calls this per element of a list. Both the per-call compile and the loose `.` are minor issues.","fix":"Precompile module-level compiled patterns with the dot escaped (`^\\d+\\.\\d+$`) and use match()/fullmatch() instead of findall().","locations":[{"ref":"redis/commands/json/decoders.py:31-46","code":"   31 | def unstring(obj):\n   32 |     \"\"\"\n   33 |     Attempt to parse string to native integer formats.\n   34 |     One can't simply call int/float in a try/catch because there is a\n   35 |     semantic difference between (for example) 15.0 and 15.\n   36 |     \"\"\"\n   37 |     floatreg = \"^\\\\d+.\\\\d+$\"\n   38 |     match = re.findall(floatreg, obj)\n   39 |     if match != []:\n   40 |         return float(match[0])\n   41 | \n   42 |     intreg = \"^\\\\d+$\"\n   43 |     match = re.findall(intreg, obj)\n   44 |     if match != []:\n   45 |         return int(match[0])\n   46 |     return obj","lines":16,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/json/decoders.py#L31-L46"}]},
{"id":"DEAD_1","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"RedisCluster._evaluate_all_succeeded is never called. It is documented as evaluating ResponsePolicy.ALL_SUCCEEDED results, but no code path references it (the policies callback mapping only wires DEFAULT_KEYLESS/DEFAULT_KEYED, and ONE_SUCCEEDED is handled inline). It is dead code that suggests an incomplete ALL_SUCCEEDED response-policy implementation.","fix":"Either wire _evaluate_all_succeeded into _process_result/_policies_callback_mapping for ResponsePolicy.ALL_SUCCEEDED, or remove the method.","locations":[{"ref":"redis/cluster.py:1210-1232","code":" 1210 |     def _evaluate_all_succeeded(self, res):\n 1211 |         \"\"\"\n 1212 |         Evaluate the result of a command with ResponsePolicy.ALL_SUCCEEDED\n 1213 |         \"\"\"\n 1214 |         first_successful_response = None\n 1215 | \n 1216 |         if isinstance(res, dict):\n 1217 |             for key, value in res.items():\n 1218 |                 if value:\n 1219 |                     if first_successful_response is None:\n 1220 |                         first_successful_response = {key: value}\n 1221 |                 else:\n 1222 |                     return {key: False}\n 1223 |         else:\n 1224 |             for response in res:\n 1225 |                 if response:\n 1226 |                     if first_successful_response is None:\n 1227 |                         # Dynamically resolve type\n 1228 |                         first_successful_response = type(response)(response)\n 1229 |                 else:\n 1230 |                     return type(response)(False)\n 1231 | \n 1232 |         return first_successful_response","lines":23,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/cluster.py#L1210-L1232"}]},
{"id":"DEAD_2","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"easy","description":"highest_weighted_db computed but never used in set_active_database. In both sync and async set_active_database, after the health check succeeds the code does 'highest_weighted_db, _ = self._databases.get_top_n(1)[0]' but never references highest_weighted_db before setting the active database to the requested one. Dead computation.","fix":"Remove the unused get_top_n(1) call, or use it if a weight comparison was intended.","locations":[{"ref":"redis/multidb/client.py:157-163","code":"  157 |         if database.circuit.state == CBState.CLOSED:\n  158 |             highest_weighted_db, _ = self._databases.get_top_n(1)[0]\n  159 |             self.command_executor.active_database = (\n  160 |                 database,\n  161 |                 GeoFailoverReason.MANUAL,\n  162 |             )\n  163 |             return","lines":7,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/multidb/client.py#L157-L163"},{"ref":"redis/asyncio/multidb/client.py:170-175","code":"  170 |         if database.circuit.state == CBState.CLOSED:\n  171 |             highest_weighted_db, _ = self._databases.get_top_n(1)[0]\n  172 |             await self.command_executor.set_active_database(\n  173 |                 database, GeoFailoverReason.MANUAL\n  174 |             )\n  175 |             return","lines":6,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/multidb/client.py#L170-L175"}]},
{"id":"DEAD_3","type":"dead_code","type_label":"Dead Code","severity":"low","difficulty":"medium","description":"SentinelConnectionManagedConnection._connect_retry has `raise SlaveNotFoundError  # Never be here` after the for-loop over rotate_slaves(). rotate_slaves() itself always raises SlaveNotFoundError at the end of its generator (sentinel.py:141) if no slave/master yields, so the for-loop will propagate that exception and the trailing raise is unreachable. The comment 'Never be here' confirms it is dead code.","fix":"Remove the unreachable `raise SlaveNotFoundError` line; the exception is already raised by rotate_slaves().","locations":[{"ref":"redis/sentinel.py:57-63","code":"   57 |         else:\n   58 |             for slave in self.connection_pool.rotate_slaves():\n   59 |                 try:\n   60 |                     return self.connect_to(slave)\n   61 |                 except ConnectionError:\n   62 |                     continue\n   63 |             raise SlaveNotFoundError  # Never be here","lines":7,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/sentinel.py#L57-L63"}]},

{"id":"DEAD_5","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"BasePolicyResolver and AsyncBasePolicyResolver redeclare with_fallback as @abstractmethod even though they are concrete-enough to be the resolve implementation. The abstract redeclaration is only there to force subclasses to implement with_fallback, but BasePolicyResolver inherits PolicyResolver which already declares it abstract; the redeclaration adds nothing and the class can never be instantiated directly, making the standalone Base classes effectively unused except as a mixin base for Dynamic/Static.","fix":"Drop the redundant abstract with_fallback redeclaration in the Base classes; the parent ABC already enforces it.","locations":[{"ref":"redis/commands/policies.py:302-304","code":"  302 |     @abstractmethod\n  303 |     def with_fallback(self, fallback: \"PolicyResolver\") -> \"PolicyResolver\":\n  304 |         pass","lines":3,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/policies.py#L302-L304"},{"ref":"redis/commands/policies.py:360-362","code":"  360 |     @abstractmethod\n  361 |     def with_fallback(self, fallback: \"AsyncPolicyResolver\") -> \"AsyncPolicyResolver\":\n  362 |         pass","lines":3,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/policies.py#L360-L362"}]},
{"id":"DEAD_6","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"In both `AggregateRequest.apply` and `HybridPostProcessingConfig.apply`, the loop iterates `kwexpr.items()` and then checks `if alias is not None`. `alias` is a dict key from `**kwexpr`, which is always a non-None string, so the `is not None` branch condition is always true and the guard is dead code.","fix":"Drop the always-true `if alias is not None` check (the AS clause is always emitted for keyword projections).","locations":[{"ref":"redis/commands/search/aggregation.py:172-176","code":"  172 |         for alias, expr in kwexpr.items():\n  173 |             ret = [\"APPLY\", expr]\n  174 |             if alias is not None:\n  175 |                 ret += [\"AS\", alias]\n  176 |             self._aggregateplan.extend(ret)","lines":5,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/search/aggregation.py#L172-L176"},{"ref":"redis/commands/search/hybrid_query.py:328-332","code":"  328 |         for alias, expr in kwexpr.items():\n  329 |             ret = [\"APPLY\", expr]\n  330 |             if alias is not None:\n  331 |                 ret.extend((\"AS\", alias))\n  332 |             apply_args.extend(ret)","lines":5,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/search/hybrid_query.py#L328-L332"}]},
{"id":"DEAD_7","type":"dead_code","type_label":"Dead Code","severity":"negligible","difficulty":"medium","description":"InitializeConnectionCountObservability listener is defined in event.py but is never registered in EventDispatcher's default _event_listeners_mapping (only the ReAuth* listeners are). It is decorated as deprecated; if nothing wires it up it is effectively dead within this module.","fix":"Confirm whether any external code registers this listener; if not, remove it along with the deprecated init_connection_count path.","locations":[{"ref":"redis/event.py:531-548","code":"  531 | class InitializeConnectionCountObservability(EventListenerInterface):\n  532 |     \"\"\"\n  533 |     Listener that initializes connection count observability.\n  534 |     \"\"\"\n  535 | \n  536 |     @deprecated_function(\n  537 |         reason=\"Connection count is now tracked via record_connection_count(). \"\n  538 |         \"This functionality will be removed in the next major version\",\n  539 |         version=\"7.4.0\",\n  540 |     )\n  541 |     def listen(self, event: AfterPooledConnectionsInstantiationEvent):\n  542 |         # Initialize gauge only once, subsequent calls won't have an affect.\n  543 |         # Note: init_connection_count() and register_pools_connection_count()\n  544 |         # are deprecated and will emit their own warnings.\n  545 |         init_connection_count()\n  546 | \n  547 |         # Register pools for connection count observability.\n  548 |         register_pools_connection_count(event.connection_pools)","lines":18,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/event.py#L531-L548"},{"ref":"redis/event.py:95-112","code":"   95 |         self._event_listeners_mapping: Dict[\n   96 |             Type[object], List[EventListenerInterface]\n   97 |         ] = {\n   98 |             AfterConnectionReleasedEvent: [\n   99 |                 ReAuthConnectionListener(),\n  100 | rn True\n  585 | \n  586 |     # If none of the internal patterns match, assume it's external\n  587 |     return False","lines":38,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/maint_notifications.py#L550-L587"}]},

{"id":"CMT_7","type":"invalid_comment","type_label":"Invalid Comment","severity":"negligible","difficulty":"medium","description":"make_connection() carries the comment 'We don't record IDLE here because async uses a sync make_connection but async record_connection_count. The recording is handled in get_connection.' BlockingConnectionPool.get_connection() (the other caller of get_available_connection/make_connection) performs the IDLE/USED accounting differently from ConnectionPool.get_connection(); the comment's claim that recording 'is handled in get_connection' glosses over the divergent recording paths and is misleading about where IDLE is (not) accounted for.","fix":"Clarify the comment to state that connection-count recording is performed by each get_connection() override after acquisition, not inside make_connection(), and that IDLE is deliberately not recorded at creation time.","locations":[{"ref":"redis/asyncio/connection.py:3013-3017","code":" 3013 |     def make_connection(self):\n 3014 |         \"\"\"Create a new connection.  Can be overridden by child classes.\"\"\"\n 3015 |         # Note: We don't record IDLE here because async uses a sync make_connection\n 3016 |         # but async record_connection_count. The recording is handled in get_connection.\n 3017 |         return self.connection_class(**self.connection_kwargs)","lines":5,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/connection.py#L3013-L3017"}]},

{"id":"DUP_1","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"_determine_nodes, _parse_target_nodes, _is_nodes_flag, and the command-policy resolution block are duplicated almost verbatim between RedisCluster (lines 1318-1353, 1463-1484, 1515-1544) and PipelineStrategy (lines 4304-4364, 4096-4146). The two copies have already diverged in argument naming (RedisCluster._determine_nodes pops `nodes_flag`, but PipelineStrategy calls _determine_nodes with `node_flag=passed_targets` at line 4140 - a singular-vs-plural mismatch), meaning the pipeline path's user-supplied node flag is silently ignored: _determine_nodes pops `nodes_flag` (None) and `node_flag` remains in kwargs unused.","fix":"Rename the PipelineStrategy call to pass `nodes_flag=passed_targets` (matching _determine_nodes' pop), and factor the shared node-determination logic into a single helper used by both RedisCluster and PipelineStrategy.","locations":[{"ref":"redis/cluster.py:5131-5135","code":" 5131 |                     target_nodes = self._determine_nodes(\n 5132 |                         *c.args,\n 5133 |                         request_policy=command_policies.request_policy,\n 5134 |                         node_flag=passed_targets,\n 5135 |                     )","lines":5,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/cluster.py#L5131-L5135"},{"ref":"redis/cluster.py:5331-5368","code":" 5331 |     def _determine_nodes(\n 5332 |         self, *args, request_policy: RequestPolicy, **kwargs\n 5333 |     ) -> List[\"ClusterNode\"]:\n 5334 |         # Determine which nodes should be executed the command on.\n 5335 |         # Returns a list of target nodes.\n 5336 |         command = args[0].upper()\n 5337 |         if (\n 5338 |             len(args) >= 2\n 5339 |             and f\"{args[0]} {args[1]}\".upper() in self._pipe.command_flags\n 5340 |         ):\n 5341 |             command = f\"{ar {"id":"DUP_2","type":"duplicate_code","type_label":"Duplicate Code","severity":"low","difficulty":"medium","description":"Five notification classes (NodeMigratingNotification, NodeMigratedNotification, NodeFailingOverNotification, NodeFailedOverNotification, OSSNodeMigratingNotification) have essentially identical __eq__ (compare id and type) and __hash__ (hash of class name + int(id)) implementations, plus near-identical __repr__ bodies. NodeMovingNotification and OSSNodeMigratedNotification differ only by extra fields. This is heavy copy-paste that invites the kind of divergence already seen between classes (NodeMovingNotification.__repr__ uses self.expire_at while the others recompute creation_time + ttl).","fix":"Hoist the common __eq__/__hash__/__repr__ into the MaintenanceNotification base class (parameterized by the extra fields) and let subclasses only declare their extra attributes.","locations":[{"ref":"redis/maint_notifications.py:249-266","code":"  249 |     def __eq__(self, other) -> bool:\n  250 |         \"\"\"\n  251 |         Two NodeMigratingNotification notifications are considered equal if they have the same\n  252 |         id and are of the same type.\n  253 |         \"\"\"\n  254 |         if not isinstance(other, NodeMigratingNotification):\n  255 |             return False\n  256 |         return self.id == other.id and type(self) is type(other)\n  257 | \n  258 |     def __hash__(self) -> int:\n  259 |         \"\"\"\n  260 |         Return a hash value for the notification to allow\n  261 |         instances to be used in sets and as dictionary keys.\n  262 | \n  263 |         Returns:\n  264 |             int: Hash value based on notification type and id\n  265 |         \"\"\"\n  266 |         return hash((self.__class__.__name__, int(self.id)))","lines":18,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/maint_notifications.py#L249-L266"},{"ref":"redis/maint_notifications.py:299-316","code": {"id":"ARCH_1","type":"architecture","type_label":"Architecture","severity":"high","difficulty":"medium","description":"TransactionStrategy.execute_command runs each command in a brand-new thread via `asyncio.run(self._execute_command(...))`, creating a fresh event loop per command. The transaction's pooled connection (`self._transaction_connection`, an asyncio Connection bound to a specific event loop) is acquired in one such loop and then reused by subsequent commands running in different threads/event loops. Reusing an asyncio stream/transport across event loops leads to 'attached to a different loop' errors or undefined behavior. The whole sync-over-async-via-thread bridge for cluster transactions is fragile.","fix":"Provide a genuinely async transaction API (await-able execute_command) instead of spinning a new event loop per command in a thread, or at minimum bind/recreate the transaction connection per loop. Reconsider sharing _transaction_connection across asyncio.run() invocations.","locations":[{"ref":"redis/asyncio/cluster.py:3210-3230","code":" 3210 |     def execute_command(self, *args: Union[KeyT, EncodableT], **kwargs: Any) -> \"Any\":\n 3211 |         # Given the limitation of ClusterPipeline sync API, we have to run it in thread.\n 3212 |         response = None\n 3213 |         error = None\n 3214 | \n 3215 |         def runner():\n 3216 |             nonlocal response\n 3217 |             nonlocal error\n 3218 |             try:\n 3219 |                 response = asyncio.run(self._execute_command(*args, **kwargs))\n 3220 |             except Exception as e:\n 3221 |                 error = e\n 3222 | \n 3223 |         thread = threading.Thread(target=runner)\n 3224 |         thread.start()\n 3225 |         thread.join()\n 3226 | \n 3227 |         if error:\n 3228 |             raise error\n 3229 | \n 3230 |         return response","lines":21,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/cluster.py#L3210-L3230"},{"ref":"redis/asyncio/cluster.py:3183-3208","code":" 3183 |     def _get_client_and_connection_for_transaction(\n 3184 |         self,\n 3185 |     ) -> Tuple[ClusterNode, Connection]:\n 3186 |         \"\"\"\n 3187 |         Find a connection for a pipeline transaction.\n 3188 | \n 3189 |         For running an atomic transaction, watch keys ensure that contents have not been\n 3190 |         altered as long as the watch commands for those keys were sent over the same\n 3191 |         connection. So once we start watching a key, we fetch a connection to the\n 3192 |         node that owns that slot and reuse it.\n 3193 |         \"\"\"\n 3194 |         if not self._pipeline_slots:\n 3195 |             raise RedisClusterException(\n 3196 |                 \"At least a command with a key is needed to identify a node\"\n 3197 |             )\n 3198 | \n 3199 |         node: ClusterNode = self._pipe.cluster_client.nodes_manager.get_node_from_slot(\n 3200 |             list(self._pipeline_slots)[0], False\n 3201 |         )\n 3202 |         self._transaction_node = node\n 3203 | \n 3204 |         if not self._transaction_connection:\n 3205 |             connection: Connection = self._transaction_node.acquire_connection()\n 3206 |             self._transaction_connection = connection\n 3207 | \n 3208 |         return self._transaction_node, self._transaction_connection","lines":26,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/cluster.py#L3183-L3208"}]},
{"id":"ARCH_2","type":"architecture","type_label":"Architecture","severity":"low","difficulty":"medium","description":"The async Sentinel stack folds the SentinelConnectionPoolProxy responsibilities directly into SentinelConnectionPool (state master_address/slave_rr_counter lives on the pool and connection_kwargs holds weakref.proxy(self)), whereas the sync stack uses a separate SentinelConnectionPoolProxy holding a weakref.ref to the pool. This structural divergence means fixes to one (e.g. the proxy's reset()/get_master_address disconnect logic) will not transfer to the other, contrary to the project's sync/async lockstep requirement.","fix":"Document the intentional divergence in specs/sync_async_deduplication_analysis.md or align the two designs so connection-pool/master-discovery logic stays mirrored.","locations":[{"ref":"redis/asyncio/sentinel.py:102-170","code":"  102 | class SentinelConnectionPool(ConnectionPool):\n  103 |     \"\"\"\n  104 |     Sentinel backed connection pool.\n  105 | \n  106 |     If ``check_connection`` flag is set to True, SentinelManagedConnection\n  107 |     sends a PING command right after establishing the connection.\n  108 |     \"\"\"\n  109 | \n  110 |     def __init__(self, service_name, sentinel_manager, **kwargs):\n  111 |         kwargs[\"connection_class\"] = kwargs.get(\n  112 |             \"connection_class\",\n  113 |             (\n  114 |                 SentinelManagedSSLConnection\n  115 |                 if kwargs.pop(\"ssl\", False)\n  116 |                 else SentinelManagedConnection\n  117 |             ),\n  118 |         )\n  119 |         self.is_master = kwargs.pop(\"is_master\", True)\n  120 |         self.check_connection = kwargs.pop(\"check_connection\", False)\n  121 |         super().__init__(**kwargs)\n  122 |         self.connection_kwargs[\"connection_pool\"] = weakref.proxy(self)\n  123 |         self.service_name = service_name\n  124 |         self.sentinel_manager = sentinel_manager\n  125
