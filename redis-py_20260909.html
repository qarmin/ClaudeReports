{"id":"LOGIC_9","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Async and sync push handlers diverge for the SMIGRATED (oss cluster) message. The sync handler (base.py:368-381) fires when EITHER `oss_cluster_maint_push_handler_func` OR `maintenance_push_handler_func` is set, and invokes both handlers. The async handler (base.py:464-473) only fires when `oss_cluster_maint_push_handler_func` is set and never invokes `maintenance_push_handler_func`. A user who set only the generic maintenance handler gets SMIGRATED notifications on the sync stack but silently not on the async stack. The sync/async stacks are required to stay in lockstep.","fix":"Mirror the sync condition/dispatch in the async handler (fire when either handler is set; await both that are present).","locations":[{"ref":"redis/_parsers/base.py:383-396","code":"  383 |             if msg_type == _SMIGRATED_MESSAGE and (\n  384 |                 self.oss_cluster_maint_push_handler_func\n  385 |                 or self.maintenance_push_handler_func\n  386 |             ):\n  387 |                 parser_function = MSG_TYPE_TO_MAINT_NOTIFICATION_PARSER_MAPPING[\n  388 |                     msg_type\n  389 |                 ][1]\n  390 |                 notification = parser_function(response)\n  391 | \n  392 |                 if notification is not None:\n  393 |                     if self.maintenance_push_handler_func:\n  394 |                         self.maintenance_push_handler_func(notification)\n  395 |                     if self.oss_cluster_maint_push_handler_func:\n  396 |                         self.oss_cluster_maint_push_handler_func(notification)","lines":14,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/_parsers/base.py#L383-L396"},{"ref":"redis/_parsers/base.py:479-488","code":"  479 |             if (\n  480 |                 msg_type == _SMIGRATED_MESSAGE\n  481 |                 and self.oss_cluster_maint_push_handler_func\n  482 |             ):\n  483 |                 parser_function = MSG_TYPE_TO_MAINT_NOTIFICATION_PARSER_MAPPING[\n  484 |                     msg_type\n  485 |                 ][1]\n  486 |                 notification = parser_function(response)\n  487 |                 if notification is not None:\n  488 |                     return await self.oss_cluster_maint_push_handler_func(notification)","lines":10,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/_parsers/base.py#L479-L488"}]},
{"id":"LOGIC_10","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In SocketBuffer._read_from_socket the NONBLOCKING_EXCEPTIONS handler can raise ConnectionError for what is actually a benign non-blocking 'would block' condition. When ex.errno matches the allowed errno and raise_on_timeout is True but timeout != 0, none of the inner branches return/raise, so control falls through to 'raise ConnectionError(...)'. A spurious EWOULDBLOCK (e.g. SSL renegotiation / partial read) is thus reported as a connection error instead of being retried, tearing down an otherwise healthy connection.","fix":"After confirming ex.errno == allowed, only raise ConnectionError if it is genuinely unexpected. For the matched-errno case, either retry the recv loop or return False; reserve the ConnectionError raise for the 'errno does not match allowed' case.","locations":[{"ref":"redis/_parsers/socket.py:113-124","code":"  113 |         except NONBLOCKING_EXCEPTIONS as ex:\n  114 |             # if we're in nonblocking mode and the recv raises a\n  115 |             # blocking error, simply return False indicating that\n  116 |             # there's no data to be read. otherwise raise the\n  117 |             # original exception.\n  118 |             allowed = NONBLOCKING_EXCEPTION_ERROR_NUMBERS.get(ex.__class__, -1)\n  119 |             if ex.errno == allowed:\n  120 |                 if not raise_on_timeout:\n  121 |                     return False\n  122 |                 if timeout == 0:\n  123 |                     raise TimeoutError(\"Timeout reading from socket\")\n  124 |             raise ConnectionError(f\"Error while reading from socket: {ex.args}\")","lines":12,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/_parsers/socket.py#L113-L124"}]},
{"id":"LOGIC_11","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"PubSub.get_message() computes `block=(timeout is None)` and passes the same `timeout` through to parse_response(). When timeout is None, block=True and parse_response ignores timeout (blocks forever via math.inf) - correct. But the default timeout is 0.0, giving block=False, timeout=0.0, i.e. a true non-blocking poll - correct. The latent issue: get_message documents 'Timeout should be specified as None to wait indefinitely', but a caller passing timeout=0 (int) vs 0.0 behaves as non-blocking while None blocks; there is no way to request 'block with a finite timeout' through get_message because any non-None timeout sets block=False and a finite timeout, whereas block=True path discards the finite timeout. This makes finite-timeout blocking reads impossible and is easy to misuse.","fix":"Document explicitly that get_message supports only non-blocking-with-timeout or block-forever modes, or rework parse_response so block=True honors a finite timeout (currently math.inf hard-codes 'forever').","locations":[{"ref":"redis/asyncio/client.py:1641-1654","code":" 1641 |     async def get_message(\n 1642 |         self, ignore_subscribe_messages: bool = False, timeout: Optional[float] = 0.0\n 1643 |     ):\n 1644 |         \"\"\"\n 1645 |         Get the next message if one is available, otherwise None.\n 1646 | \n 1647 |         If timeout is specified, the system will wait for `timeout` seconds\n 1648 |         before returning. Timeout should be specified as a floating point\n 1649 |         number or None to wait indefinitely.\n 1650 |         \"\"\"\n 1651 |         response = await self.parse_response(block=(timeout is None), timeout=timeout)\n 1652 |         if response:\n 1653 |             return await self.handle_message(response, ignore_subscribe_messages)\n 1654 |         return None","lines":14,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/client.py#L1641-L1654"},{"ref":"redis/asyncio/client.py:1415-1492","code":" 1415 |     async def parse_response(self, block: bool = True, timeout: float = 0):\n 1416 |         \"\"\"\n 1417 |         Parse the response from a publish/subscribe command.\n 1418 | \n 1419 |         Args:\n 1420 |             block: If True, block indefinitely until a message is available.\n 1421 |                    If False, return immediately if no message is available.\n 1422 |                    Default: True\n 1423 |             timeout: The timeout in seconds for reading a response when block=False.\n 1424 |                      This parameter is ignored when block=True.\n 1425 |                      Default: 0 (return immediately if no data available)\n 1426 | \n 1427 |         Returns:\n 1428 |             The parsed response from the server, or None if no message is available\n 1429 |             within the timeout period (when block=False).\n 1430 | \n 1431 |         Important:\n 1432 |             The block and timeout parameters work together:\n 1433 |             - When block=True: timeout is IGNORED, method blocks indefinitely\n 1434 |             - When block=False: timeout is USED, method returns after timeout expires\n 1435 | \n 1436 |             Typically, you should use get_message(timeout=X) instead of calling\n 1437 |             parse_response() directly. The get_message() method automatically sets\n 1438 |             block=False when a timeout is provided, and block=True when timeout=None.\n 1439 | \n 1440 |         Example:\n 1441 |             # Block indefinitely (timeout is ignored)\n 1442 |             response = await pubsub.parse_response(block=True, timeout=0.1)\n 1443 | \n 1444 |             # Non-blocking with 0.1 second timeout\n 1445 |             response = await pubsub.parse_response(block=False, timeout=0.1)\n 1446 | \n 1447 |             # Non-blocking, return immediately\n 1448 |             response = await pubsub.parse_response(block=False, timeout=0)\n 1449 | \n 1450 |             # Recommended: use get_message() instead\n 1451 |             msg = await pubsub.get_message(timeout=0.1)  # automatically sets block=False\n 1452 |             msg = await pubsub.get_message(timeout=None)  # automatically sets block=True\n 1453 |         \"\"\"\n 1454 |         conn = self.connection\n 1455 |         if conn is None:\n 1456 |             raise RuntimeError(\n 1457 |                 \"pubsub connection not set: \"\n 1458 |                 \"did you forget to call subscribe() or psubscribe()?\"\n 1459 |             )\n 1460 | \n 1461 |         await self.check_health()\n 1462 | \n 1463 |         if not conn.is_connected:\n 1464 |             await conn.connect()\n 1465 | \n 1466 |         # Block=True: signal \"no timeout\" to conn.read_response via\n 1467 |         # math.inf. The connection treats math.inf as the per-read\n 1468 |         # opt-in for blocking indefinitely without falling back to\n 1469 |         # self.socket_timeout. Reconnect/AUTH/HELLO/resubscribe\n 1470 |         # operations performed by the retry layer continue to honor\n 1471 |         # self.socket_timeout because they do not pass math.inf.\n 1472 |         #\n 1473 |         # TODO(next-major): when the async Connection.read_response\n 1474 |         # default for ``timeout`` is changed to SENTINEL, passing\n 1475 |         # ``timeout=None`` from this method will become the natural\n 1476 |         # \"no timeout\" signal and the math.inf hand-off can be\n 1477 |         # removed. That swap is a breaking change to the\n 1478 |         # Connection.read_response signature so it must wait for a\n 1479 |         # major release.\n 1480 |         read_timeout = math.inf if block else timeout\n 1481 |         response = await self._execute(\n 1482 |             conn,\n 1483 |             conn.read_response,\n 1484 |             timeout=read_timeout,\n 1485 |             disconnect_on_error=False,\n 1486 |             push_request=True,\n 1487 |         )\n 1488 | \n 1489 |         if conn.health_check_interval and response in self.health_check_response:\n 1490 |             # ignore the health check message as user might not expect it\n 1491 |             return None\n 1492 |         return response","lines":78,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/client.py#L1415-L1492"}]},
{"id":"LOGIC_12","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"RedisCluster.transaction() calls the blocking `time.sleep(watch_delay)` inside an async coroutine on a WatchError retry, blocking the entire event loop for the duration of watch_delay. Every other await elsewhere in the file uses `await asyncio.sleep(...)`.","fix":"Replace `time.sleep(watch_delay)` with `await asyncio.sleep(watch_delay)`.","locations":[{"ref":"redis/asyncio/cluster.py:1628-1629","code":" 1628 |                     if watch_delay is not None and watch_delay > 0:\n 1629 |                         time.sleep(watch_delay)","lines":2,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/cluster.py#L1628-L1629"}]},
{"id":"LOGIC_13","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In TransactionStrategy._reinitialize_on_error, after incrementing the cluster client's reinitialize_counter, the reset assigns `self.reinitialize_counter = 0` on the TransactionStrategy instance instead of the cluster client (`self._pipe.cluster_client.reinitialize_counter`). The counter that was incremented (cluster_client.reinitialize_counter) is therefore never reset, so once it first crosses a multiple of reinitialize_steps it keeps satisfying the modulo condition on subsequent errors (and creates a stray attribute on the strategy). This mirrors the same bug in the sync version (redis/cluster.py:4593), i.e. a copy-paste of an existing defect.","fix":"Reset the correct counter: `self._pipe.cluster_client.reinitialize_counter = 0`.","locations":[{"ref":"redis/asyncio/cluster.py:3381-3389","code":" 3381 |             self._pipe.cluster_client.reinitialize_counter += 1\n 3382 |             if (\n 3383 |                 self._pipe.cluster_client.reinitialize_steps\n 3384 |                 and self._pipe.cluster_client.reinitialize_counter\n 3385 |                 % self._pipe.cluster_client.reinitialize_steps\n 3386 |                 == 0\n 3387 |             ):\n 3388 |                 await self._pipe.cluster_client.nodes_manager.initialize()\n 3389 |                 self.reinitialize_counter = 0","lines":9,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/cluster.py#L3381-L3389"}]},
{"id":"LOGIC_14","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"move_slot() permanently rewrites the slots cache for AskError just like for MovedError. _reinitialize_on_error (transaction path) calls `await ...nodes_manager.move_slot(error)` for AskError, and move_slot sets the redirected node's server_type to PRIMARY and reassigns slots_cache[slot_id] to it. An ASK redirect is meant to be temporary (single-command redirect during slot migration) and should not durably change slot ownership or promote the target to PRIMARY. This corrupts the topology view until the next full refresh. The behavior mirrors the sync version, but is still incorrect.","fix":"Do not call move_slot for AskError; ASK should result in an ASKING redirect to the target node for that command only, without mutating slots_cache/server_type. Reserve move_slot for MovedError.","locations":[{"ref":"redis/asyncio/cluster.py:3391-3392","code":" 3391 |                 if isinstance(error, AskError):\n 3392 |                     await self._pipe.cluster_client.nodes_manager.move_slot(error)","lines":2,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/cluster.py#L3391-L3392"},{"ref":"redis/asyncio/cluster.py:2163-2200","code":" 2163 |     async def move_slot(self, e: AskError | MovedError):\n 2164 |         node_changed = False\n 2165 |         redirected_node = self.get_node(host=e.host, port=e.port)\n 2166 |         if redirected_node:\n 2167 |             # The node already exists\n 2168 |             if redirected_node.server_type != PRIMARY:\n 2169 |                 # Update the node's server type\n 2170 |                 redirected_node.server_type = PRIMARY\n 2171 |         else:\n 2172 |             # This is a new node, we will add it to the nodes cache\n 2173 |             redirected_node = ClusterNode(\n 2174 |                 e.host, e.port, PRIMARY, **self.connection_kwargs\n 2175 |             )\n 2176 |             self.set_nodes(self.nodes_cache, {redirected_node.name: redirected_node})\n 2177 |         slot_nodes = self.slots_cache[e.slot_id]\n 2178 |         if redirected_node not in slot_nodes:\n 2179 |             # The new slot owner is a new server, or a server from a different\n 2180 |             # shard. We need to remove all current nodes from the slot's list\n 2181 |             # (including replications) and add just the new node.\n 2182 |             self.slots_cache[e.slot_id] = [redirected_node]\n 2183 |             node_changed = True\n 2184 |         elif redirected_node is not slot_nodes[0]:\n 2185 |             # The MOVED error resulted from a failover, and the new slot owner\n 2186 |             # had previously been a replica.\n 2187 |             old_primary = slot_nodes[0]\n 2188 |             # Update the old primary to be a replica and add it to the end of\n 2189 |             # the slot's node list\n 2190 |             old_primary.server_type = REPLICA\n 2191 |             slot_nodes.append(old_primary)\n 2192 |             # Remove the old replica, which is now a primary, from the slot's\n 2193 |             # node list\n 2194 |             slot_nodes.remove(redirected_node)\n 2195 |             # Override the old primary with the new one\n 2196 |             slot_nodes[0] = redirected_node\n 2197 |             if self.default_node == old_primary:\n 2198 |                 # Update the default node with the new primary\n 2199 |                 self.default_node = redirected_node\n 2200 |             node_changed = True","lines":38,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/cluster.py#L2163-L2200"}]},
{"id":"LOGIC_15","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In on_connect_check_health(), the RESP3 HELLO-without-auth branch has its protocol-verification commented out (lines 525-528), while the HELLO-with-auth branch (lines 494-497) does verify response proto. So when no credentials are configured but protocol=3 is requested, a server that responds with a different/older proto is silently accepted, and the client proceeds believing it is on RESP3. This is dead commented-out code masking a real verification gap and diverges in behavior from the authenticated path.","fix":"Either restore the proto verification for the no-auth HELLO branch (mirroring lines 494-497, handling both b'proto' and 'proto' keys) or remove the misleading commented block and document why verification is intentionally skipped.","locations":[{"ref":"redis/asyncio/connection.py:1091-1096","code":" 1091 |             await self.send_command(\"HELLO\", self.protocol, check_health=check_health)\n 1092 |             response = await self.read_response()\n 1093 |             # if response.get(b\"proto\") != self.protocol and response.get(\n 1094 |             #     \"proto\"\n 1095 |             # ) != self.protocol:\n 1096 |             #     raise ConnectionError(\"Invalid RESP version\")","lines":6,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/connection.py#L1091-L1096"}]},
{"id":"LOGIC_16","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"AsyncClusterKeyspaceNotifications.get_message never (re)discovers nodes on its own; it only polls self._node_pubsubs, which is populated by subscribe()/refresh_subscriptions(). If the cluster starts with subscriptions tracked (_subscribed_patterns non-empty) but _node_pubsubs has been fully cleaned up after errors, get_message with total_nodes==0 just sleeps and returns None forever - it does not call refresh_subscriptions to rebuild the node pubsubs. The 'subscribed' property is based on tracked patterns, so listen()/run() will spin (sleep+return None) indefinitely without ever attempting to re-establish connections.","fix":"When total_nodes == 0 but there are tracked subscriptions and not closed, attempt self._refresh_subscriptions_on_error() (or refresh_subscriptions) before sleeping so the node pubsubs can be rebuilt after a full cleanup.","locations":[{"ref":"redis/asyncio/keyspace_notifications.py:826-836","code":"  826 |         if self._closed:\n  827 |             return None\n  828 | \n  829 |         total_nodes = len(self._node_pubsubs)\n  830 |         if total_nodes == 0:\n  831 |             # Sleep for the requested timeout so callers that loop\n  832 |             # (run(), listen) don't spin the CPU when all node\n  833 |             # connections have been cleaned up.\n  834 |             if timeout > 0:\n  835 |                 await asyncio.sleep(timeout)\n  836 |             return None","lines":11,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/keyspace_notifications.py#L826-L836"},{"ref":"redis/asyncio/keyspace_notifications.py:656-660","code":"  656 |     def subscribed(self) -> bool:\n  657 |         \"\"\"Check if there are any active subscriptions and not closed.\"\"\"\n  658 |         return not self._closed and bool(\n  659 |             self._subscribed_patterns or self._subscribed_channels\n  660 |         )","lines":5,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/keyspace_notifications.py#L656-L660"}]},
{"id":"LOGIC_17","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Async _check_db_health reads self._health_checks without holding _hc_lock, racing with add_health_check. add_health_check acquires self._hc_lock before appending to self._health_checks, and the sync _check_db_health snapshots the list under self._hc_lock (client.py:321-322). The async _check_db_health passes self._health_checks directly to the policy without taking the lock, so a concurrent add_health_check append can mutate the list while the policy iterates it (RuntimeError: list changed size during iteration, or a check being skipped). Divergence from the sync implementation which deliberately snapshots under lock.","fix":"In async _check_db_health, snapshot under the lock: async with self._hc_lock: health_checks = list(self._health_checks), then pass the snapshot to the policy, matching the sync version.","locations":[{"ref":"redis/asyncio/multidb/client.py:417-424","code":"  417 |     async def _check_db_health(self, database: AsyncDatabase) -> bool:\n  418 |         \"\"\"\n  419 |         Runs health checks on the given database until first failure.\n  420 |         \"\"\"\n  421 |         # Health check will setup circuit state\n  422 |         is_healthy = await self._health_check_policy.execute(\n  423 |             self._health_checks, database\n  424 |         )","lines":8,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/multidb/client.py#L417-L424"},{"ref":"redis/asyncio/multidb/client.py:281-286","code":"  281 |     async def add_health_check(self, healthcheck: HealthCheck):\n  282 |         \"\"\"\n  283 |         Adds a new health check to the database.\n  284 |         \"\"\"\n  285 |         async with self._hc_lock:\n  286 |             self._health_checks.append(healthcheck)","lines":6,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/multidb/client.py#L281-L286"},{"ref":"redis/multidb/client.py:343-351","code":"  343 |     async def _check_db_health(self, database: SyncDatabase) -> bool:\n  344 |         \"\"\"\n  345 |         Runs health checks on the given database until first failure.\n  346 |         \"\"\"\n  347 |         with self._hc_lock:\n  348 |             health_checks = list(self._health_checks)\n  349 | \n  350 |         # Health check will setup circuit state\n  351 |         is_healthy = await self._health_check_policy.execute(health_checks, database)","lines":9,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/multidb/client.py#L343-L351"}]},
{"id":"LOGIC_18","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Async _half_open_state_task is a single attribute overwritten on every HALF_OPEN transition, losing references to concurrent recovery tasks. _on_circuit_state_change_callback assigns self._half_open_state_task = asyncio.create_task(...) each time any circuit goes HALF_OPEN. With multiple databases, a second HALF_OPEN transition overwrites the previous task handle before it completes; aclose() then only cancels the last one, and earlier tasks are neither tracked nor awaited (orphaned task, and 'Task was destroyed but it is pending' warnings on shutdown). Sync side uses run_coro_fire_and_forget which tracks completion via done-callback, so this is also a sync/async divergence.","fix":"Keep a set of half-open tasks and discard each on completion (task.add_done_callback(self._half_open_tasks.discard)); cancel all of them in aclose().","locations":[{"ref":"redis/asyncio/multidb/client.py:440-444","code":"  440 |         if new_state == CBState.HALF_OPEN:\n  441 |             self._half_open_state_task = asyncio.create_task(\n  442 |                 self._check_db_health(circuit.database)\n  443 |             )\n  444 |             return","lines":5,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/multidb/client.py#L440-L444"},{"ref":"redis/asyncio/multidb/client.py:93-100","code":"   93 |     async def aclose(self):\n   94 |         # Cancel background tasks\n   95 |         if self._recurring_hc_task:\n   96 |             self._recurring_hc_task.cancel()\n   97 |         if self._half_open_state_task:\n   98 |             self._half_open_state_task.cancel()\n   99 |         for hc_task in self._hc_tasks:\n  100 |             hc_task.cancel()","lines":8,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/asyncio/multidb/client.py#L93-L100"}]},
{"id":"LOGIC_19","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"is_expired() / ttl() off-by-semantics for the sentinel value. SimpleToken treats expires_at == -1 as 'never expires', but JWToken.is_expired/ttl check self._decoded['exp'] == -1. A real JWT 'exp' is a Unix timestamp and will never be -1, so the sentinel branch is dead for JWToken; more importantly get_expires_at_ms() returns exp*1000 unconditionally, so a JWToken constructed from a token whose intent is 'no expiry' is not handled consistently with SimpleToken. The -1 check on JWToken is effectively dead code that suggests an intended feature that does not work.","fix":"Remove the dead exp == -1 checks from JWToken or document that JWTs always carry a numeric exp; keep the sentinel handling only in SimpleToken where it is meaningful.","locations":[{"ref":"redis/auth/token.py:96-112","code":"   96 |     def is_expired(self) -> bool:\n   97 |         exp = self._decoded[\"exp\"]\n   98 |         if exp == -1:\n   99 |             return False\n  100 | \n  101 |         return (\n  102 |             self._decoded[\"exp\"] * 1000 <= datetime.now(timezone.utc).timestamp() * 1000\n  103 |         )\n  104 | \n  105 |     def ttl(self) -> float:\n  106 |         exp = self._decoded[\"exp\"]\n  107 |         if exp == -1:\n  108 |             return -1\n  109 | \n  110 |         return (\n  111 |             self._decoded[\"exp\"] * 1000 - datetime.now(timezone.utc).timestamp() * 1000\n  112 |         )","lines":17,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/auth/token.py#L96-L112"},{"ref":"redis/auth/token.py:53-63","code":"   53 |     def ttl(self) -> float:\n   54 |         if self.expires_at == -1:\n   55 |             return -1\n   56 | \n   57 |         return self.expires_at - (datetime.now(timezone.utc).timestamp() * 1000)\n   58 | \n   59 |     def is_expired(self) -> bool:\n   60 |         if self.expires_at == -1:\n   61 |             return False\n   62 | \n   63 |         return self.ttl() <= 0","lines":11,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/auth/token.py#L53-L63"}]},
{"id":"LOGIC_20","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"TokenManager.start() schedules renew_with_callback via loop.call_soon_threadsafe and stores its return value in self._init_timer. call_soon_threadsafe returns a Handle, but the more important issue: _renew_token runs synchronously inside the loop thread and itself calls asyncio.get_running_loop() to schedule the next renewal. If start() is invoked when a loop is already running in the *current* thread (the try/except at 143-147 takes the get_running_loop branch), the work is scheduled with call_soon_threadsafe onto that same running loop, but init_done.wait() then blocks that very thread, deadlocking if the loop cannot make progress because the calling thread is blocked. The sync start() is only safe when no loop runs in the calling thread.","fix":"Document/enforce that synchronous start() must not be called from a thread running an asyncio loop, or detect that case and use start_async instead of blocking on init_done.wait().","locations":[{"ref":"redis/auth/token_manager.py:136-182","code":"  136 |     def start(\n  137 |         self,\n  138 |         listener: CredentialsListener,\n  139 |         skip_initial: bool = False,\n  140 |     ) -> Callable[[], None]:\n  141 |         self._listener = listener\n  142 | \n  143 |         try:\n  144 |             loop = asyncio.get_running_loop()\n  145 |         except RuntimeError:\n  146 |             # Run loop in a separate thread to unblock main thread.\n  147 |             loop = asyncio.new_event_loop()\n  148 | \n  149 |             # Use threading.Event to signal when loop is ready\n  150 |             loop_ready = threading.Event()\n  151 | \n  152 |             def start_loop():\n  153 |                 # This runs in the background thread. First, bind the event loop to\n  154 |                 # this thread, then signal that the loop is ready so the calling\n  155 |                 # thread can safely schedule work (via call_soon_threadsafe) before\n  156 |                 # we block in run_forever().\n  157 |                 asyncio.set_event_loop(loop)\n  158 |                 loop_ready.set()  # Signal that loop is ready for cross-thread use\n  159 |                 loop.run_forever()\n  160 | \n  161 |             thread = threading.Thread(target=start_loop, daemon=True)\n  162 |             thread.start()\n  163 | \n  164 |             # Wait for the loop to be ready before scheduling\n  165 |             loop_ready.wait()\n  166 | \n  167 |         # Use thread-safe Event for cross-thread synchronization\n  168 |         init_done = threading.Event()\n  169 | \n  170 |         def renew_with_callback():\n  171 |             try:\n  172 |                 self._renew_token(skip_initial)\n  173 |             finally:\n  174 |                 init_done.set()\n  175 | \n  176 |         # Schedule using call_soon_threadsafe for thread-safe scheduling\n  177 |         self._init_timer = loop.call_soon_threadsafe(renew_with_callback)\n  178 |         logger.info(\"Token manager started\")\n  179 | \n  180 |         # Blocks using thread-safe Event\n  181 |         init_done.wait()\n  182 |         return self.stop","lines":47,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/auth/token_manager.py#L136-L182"}]},
{"id":"LOGIC_21","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"Race/TOCTOU in _renew_token: it computes the renewal delay and checks is_expired() AFTER acquire_token already succeeded, but acquire_token is called with force_refresh=True every renewal. If on_next callback (which propagates the new token to the connection) raises, it is wrapped in TokenRenewalErr and routed to on_error, but the next renewal timer is NOT scheduled (the exception aborts before loop.call_later at 302). A single transient callback failure therefore permanently stops the renewal loop, leaving the client with a token that will eventually expire and never refresh. Same in async path (337-347).","fix":"Schedule the next renewal before invoking the user callback, or schedule it in a finally block so a failing on_next does not terminate the periodic refresh chain.","locations":[{"ref":"redis/auth/token_manager.py:270-309","code":"  270 |     def _renew_token(self, skip_initial: bool = False):\n  271 |         \"\"\"\n  272 |         Task to renew token from identity provider.\n  273 |         Schedules renewal tasks based on token TTL.\n  274 |         \"\"\"\n  275 | \n  276 |         try:\n  277 |             token_res = self.acquire_token(force_refresh=True)\n  278 |             delay = self._calculate_renewal_delay(\n  279 |                 token_res.get_token().get_expires_at_ms(),\n  280 |                 token_res.get_token().get_received_at_ms(),\n  281 |             )\n  282 | \n  283 |             if token_res.get_token().is_expired():\n  284 |                 raise TokenRenewalErr(\"Requested token is expired\")\n  285 | \n  286 |             if self._listener.on_next is None:\n  287 |                 logger.warning(\n  288 |                     \"No registered callback for token renewal task. Renewal cancelled\"\n  289 |                 )\n  290 |                 return\n  291 | \n  292 |             if not skip_initial:\n  293 |                 try:\n  294 |                     self._listener.on_next(token_res.get_token())\n  295 |                 except Exception as e:\n  296 |                     raise TokenRenewalErr(e)\n  297 | \n  298 |             if delay <= 0:\n  299 |                 return\n  300 | \n  301 |             loop = asyncio.get_running_loop()\n  302 |             self._next_timer = loop.call_later(delay, self._renew_token)\n  303 |             logger.info(f\"Next token renewal scheduled in {delay} seconds\")\n  304 |             return token_res\n  305 |         except Exception as e:\n  306 |             if self._listener.on_error is None:\n  307 |                 raise e\n  308 | \n  309 |             self._listener.on_error(e)","lines":40,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/auth/token_manager.py#L270-L309"},{"ref":"redis/auth/token_manager.py:311-352","code":"  311 |     async def _renew_token_async(\n  312 |         self, skip_initial: bool = False, init_event: asyncio.Event = None\n  313 |     ):\n  314 |         \"\"\"\n  315 |         Async task to renew tokens from identity provider.\n  316 |         Schedules renewal tasks based on token TTL.\n  317 |         \"\"\"\n  318 | \n  319 |         try:\n  320 |             token_res = await self.acquire_token_async(force_refresh=True)\n  321 |             delay = self._calculate_renewal_delay(\n  322 |                 token_res.get_token().get_expires_at_ms(),\n  323 |                 token_res.get_token().get_received_at_ms(),\n  324 |             )\n  325 | \n  326 |             if token_res.get_token().is_expired():\n  327 |                 raise TokenRenewalErr(\"Requested token is expired\")\n  328 | \n  329 |             if self._listener.on_next is None:\n  330 |                 logger.warning(\n  331 |                     \"No registered callback for token renewal task. Renewal cancelled\"\n  332 |                 )\n  333 |                 return\n  334 | \n  335 |             if not skip_initial:\n  336 |                 try:\n  337 |                     await self._listener.on_next(token_res.get_token())\n  338 |                 except Exception as e:\n  339 |                     raise TokenRenewalErr(e)\n  340 | \n  341 |             if delay <= 0:\n  342 |                 return\n  343 | \n  344 |             loop = asyncio.get_running_loop()\n  345 |             wrapped = _async_to_sync_wrapper(loop, self._renew_token_async)\n  346 |             logger.info(f\"Next token renewal scheduled in {delay} seconds\")\n  347 |             loop.call_later(delay, wrapped)\n  348 |         except Exception as e:\n  349 |             if self._listener.on_error is None:\n  350 |                 raise e\n  351 | \n  352 |             await self._listener.on_error(e)","lines":42,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/auth/token_manager.py#L311-L352"}]},
{"id":"LOGIC_22","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"BackgroundScheduler.run_recurring_coro / run_coro_sync read self._health_check_loop under the lock into a local `loop`, but _ensure_health_check_loop can set self._health_check_loop = None on a start timeout (raising). In run_coro_fire_and_forget and run_recurring_coro the loop variable is captured after _ensure_health_check_loop returns successfully, which is fine, but there is no re-check that loop is not None and is_running before call_soon_threadsafe / run_coroutine_threadsafe; if the loop was stopped between the lock release and the schedule call (e.g. stop() racing), run_coroutine_threadsafe will raise RuntimeError('Event loop is closed') with no handling, surfacing as an unexpected error to the caller.","fix":"Hold the operation under the lock or re-validate loop.is_running() and handle the closed-loop race (catch RuntimeError) before scheduling.","locations":[{"ref":"redis/background.py:104-110","code":"  104 |         with self._lock:\n  105 |             loop = self._health_check_loop\n  106 | \n  107 |         # Schedule recurring execution in the shared loop\n  108 |         loop.call_soon_threadsafe(\n  109 |             self._call_later_recurring_coro, loop, interval, coro, *args\n  110 |         )","lines":7,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/background.py#L104-L110"},{"ref":"redis/background.py:148-158","code":"  148 |         with self._lock:\n  149 |             loop = self._health_check_loop\n  150 | \n  151 |         # Submit the coroutine to the shared loop and wait for result\n  152 |         future = asyncio.run_coroutine_threadsafe(coro(*args), loop)\n  153 |         try:\n  154 |             return future.result(timeout=timeout)\n  155 |         except TimeoutError:\n  156 |             # Cancel the future to avoid leaving orphaned tasks\n  157 |             future.cancel()\n  158 |             raise","lines":11,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/background.py#L148-L158"},{"ref":"redis/background.py:181-196","code":"  181 |         with self._lock:\n  182 |             loop = self._health_check_loop\n  183 | \n  184 |         def on_complete(future: asyncio.Future):\n  185 |             \"\"\"Log any exceptions from the coroutine.\"\"\"\n  186 |             if future.cancelled():\n  187 |                 logging.getLogger(__name__).debug(\"Fire-and-forget coroutine cancelled\")\n  188 |             elif future.exception() is not None:\n  189 |                 logging.getLogger(__name__).debug(\n  190 |                     \"Fire-and-forget coroutine raised exception\",\n  191 |                     exc_info=future.exception(),\n  192 |                 )\n  193 | \n  194 |         # Schedule on the shared loop without waiting\n  195 |         future = asyncio.run_coroutine_threadsafe(coro(*args), loop)\n  196 |         future.add_done_callback(on_complete)","lines":16,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/background.py#L181-L196"}]},
{"id":"LOGIC_23","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"CacheEntry.__eq__ compares by hash equality (`hash(self) == hash(other)`) instead of comparing field values. Two distinct entries that happen to collide on the 64-bit hash will be considered equal, and __eq__ does not even check that `other` is a CacheEntry, so any object whose hash collides compares equal. This is a latent correctness bug for any set/dict membership or equality test on CacheEntry.","fix":"Implement __eq__ by comparing the actual fields (cache_key, cache_value, status, connection_ref) and return NotImplemented for non-CacheEntry operands.","locations":[{"ref":"redis/cache.py:53-59","code":"   53 |     def __hash__(self):\n   54 |         return hash(\n   55 |             (self.cache_key, self.cache_value, self.status, self.connection_ref)\n   56 |         )\n   57 | \n   58 |     def __eq__(self, other):\n   59 |         return hash(self) == hash(other)","lines":7,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/cache.py#L53-L59"}]},
{"id":"LOGIC_24","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"CacheProxy.set evicts at most one entry after an insertion, so the cache can permanently exceed max_size. is_exceeds_max_size uses `count > max_size` and only a single evict_next() is performed per set(). If the cache is somehow over capacity by more than one (e.g. max_size lowered at runtime, or concurrent inserts), it will never shrink back to the limit because each set() removes exactly one item while potentially adding one. Eviction should loop until size <= max_size.","fix":"Loop while self.config.is_exceeds_max_size(self.size): evict_next(), recording the eviction count, instead of a single conditional evict_next().","locations":[{"ref":"redis/cache.py:278-291","code":"  278 |     def set(self, entry: CacheEntry) -> bool:\n  279 |         is_set = self._cache.set(entry)\n  280 | \n  281 |         if self.config.is_exceeds_max_size(self.size):\n  282 |             # Lazy import to avoid circular dependency\n  283 |             from redis.observability.recorder import record_csc_eviction\n  284 | \n  285 |             record_csc_eviction(\n  286 |                 count=1,\n  287 |                 reason=CSCReason.FULL,\n  288 |             )\n  289 |             self.eviction_policy.evict_next()\n  290 | \n  291 |         return is_set","lines":14,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/cache.py#L278-L291"},{"ref":"redis/cache.py:501-502","code":"  501 |     def is_exceeds_max_size(self, count: int) -> bool:\n  502 |         return count > self._max_size","lines":2,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/cache.py#L501-L502"}]},
{"id":"LOGIC_25","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"_execute_transaction releases via self.connection.disconnect() on a length-mismatch error (line 1928), but uses the parameter `connection` everywhere else in the method. If self.connection was reassigned or differs from the passed-in connection, the wrong connection is disconnected; more importantly self.connection could be None here in some call paths (the method receives connection explicitly), causing AttributeError instead of the intended ResponseError.","fix":"Use the local `connection` parameter consistently: `connection.disconnect()`.","locations":[{"ref":"redis/client.py:2116-2120","code":" 2116 |         if len(response) != len(commands):\n 2117 |             self.connection.disconnect()\n 2118 |             raise ResponseError(\n 2119 |                 \"Wrong number of response items from pipeline execution\"\n 2120 |             )","lines":5,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/client.py#L2116-L2120"}]},
{"id":"LOGIC_26","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"determine_slot returns a random slot for EVAL/EVALSHA/FCALL with zero keys, which is non-deterministic and can route to a node that does not have the script loaded. For EVALSHA in particular, picking `random.randrange(0, REDIS_CLUSTER_HASH_SLOTS)` (lines 1422, 1430) sends the command to an arbitrary node; if the script was loaded only on some nodes (e.g. via SCRIPT LOAD which is broadcast to PRIMARIES), a keyless EVALSHA may still hit a node missing the SHA on retry randomness, producing intermittent NOSCRIPT errors that are not deterministically reproducible.","fix":"For keyless scripts, prefer a stable default node (or broadcast/replicate as appropriate) rather than a fresh random slot per call, so behavior is deterministic and consistent with where scripts are loaded.","locations":[{"ref":"redis/cluster.py:1567-1578","code":" 1567 |             # if there are 0 keys, that means the script can be run on any node\n 1568 |             # so we can just return a random slot\n 1569 |             if len(eval_keys) == 0:\n 1570 |                 return random.randrange(0, REDIS_CLUSTER_HASH_SLOTS)\n 1571 |             keys = eval_keys\n 1572 |         else:\n 1573 |             keys = self._get_command_keys(*args)\n 1574 |             if keys is None or len(keys) == 0:\n 1575 |                 # FCALL can call a function with 0 keys, that means the function\n 1576 |                 #  can be run on any node so we can just return a random slot\n 1577 |                 if command.upper() in (\"FCALL\", \"FCALL_RO\"):\n 1578 |                     return random.randrange(0, REDIS_CLUSTER_HASH_SLOTS)","lines":12,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/cluster.py#L1567-L1578"}]},
{"id":"LOGIC_27","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"PipelineStrategy._determine_nodes stores FT.AGGREGATE target nodes on the wrong object. At line 4362 it assigns `self._aggregate_nodes = nodes` where `self` is the PipelineStrategy, but the SPECIAL-policy callback get_special_nodes (used for FT.CURSOR) is bound to `self._pipe.get_special_nodes` and reads `self._pipe._aggregate_nodes`. The strategy never sets the attribute on the pipe (and the pipe never initializes `_aggregate_nodes`), so a pipelined FT.AGGREGATE followed by FT.CURSOR will fail with `Cannot execute FT.CURSOR commands without FT.AGGREGATE` or AttributeError, even though FT.AGGREGATE ran.","fix":"Assign to the pipe (e.g. `self._pipe._aggregate_nodes = nodes`) and ensure ClusterPipeline initializes `_aggregate_nodes = None`.","locations":[{"ref":"redis/cluster.py:5365-5366","code":" 5365 |         if args[0].lower() == \"ft.aggregate\":\n 5366 |             self._aggregate_nodes = nodes","lines":2,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/cluster.py#L5365-L5366"},{"ref":"redis/cluster.py:1193-1202","code":" 1193 |     def get_special_nodes(self) -> Optional[list[\"ClusterNode\"]]:\n 1194 |         \"\"\"\n 1195 |         Returns a list of nodes for commands with a special policy.\n 1196 |         \"\"\"\n 1197 |         if not self._aggregate_nodes:\n 1198 |             raise RedisClusterException(\n 1199 |                 \"Cannot execute FT.CURSOR commands without FT.AGGREGATE\"\n 1200 |             )\n 1201 | \n 1202 |         return self._aggregate_nodes","lines":10,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/cluster.py#L1193-L1202"}]},
{"id":"LOGIC_28","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"TransactionStrategy._reinitialize_on_error resets the wrong attribute. After incrementing `self._pipe.reinitialize_counter` (line 4590) and conditionally reinitializing, it sets `self.reinitialize_counter = 0` (line 4593) which creates/mutates a brand-new attribute on the TransactionStrategy object instead of resetting `self._pipe.reinitialize_counter`. Consequently the pipe's reinitialize counter is never reset after a forced reinitialization, so `_should_reinitialized()` (which computes `reinitialize_counter % reinitialize_steps == 0`) drifts and the topology will be force-reinitialized on a different cadence than intended. Compare with RedisCluster._execute_command (line 1778) and PipelineStrategy which correctly reset the counter on the pipe.","fix":"Change line 4593 to `self._pipe.reinitialize_counter = 0` to reset the same counter that was incremented.","locations":[{"ref":"redis/cluster.py:5641-5644","code":" 5641 |             self._pipe.reinitialize_counter += 1\n 5642 |             if self._pipe._should_reinitialized():\n 5643 |                 self._nodes_manager.initialize()\n 5644 |                 self.reinitialize_counter = 0","lines":4,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/cluster.py#L5641-L5644"}]},
{"id":"LOGIC_29","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"TransactionStrategy._execute_transaction mixes bare exceptions and (index, exception) tuples in the `errors` list, then unpacks all of them as tuples. Lines 4670, 4684, 4690 append bare exception objects (`errors.append(e)` / `errors.append(slot_error)`), while line 4678 appends a tuple `(i, command.options[EMPTY_RESPONSE])`. Later, line 4718 does `for i, e in errors: response.insert(i, e)`, which unpacks every element as a 2-tuple. If a bare exception object (e.g. a ResponseError from parsing MULTI at line 4670) is present while EXEC still returns a non-None response, the unpack raises TypeError (or silently iterates the exception's args), corrupting error reporting for the transaction.","fix":"Make the `errors` list homogeneous: always append `(index, exception)` tuples (e.g. `errors.append((0, e))` for MULTI and `errors.append((i + 1, e))` for per-command errors), or separate the two error categories into distinct lists and handle each appropriately before inserting into the response.","locations":[{"ref":"redis/cluster.py:5726-5748","code":" 5726 |         except ResponseError as e:\n 5727 |             self.annotate_exception(e, 0, \"MULTI\")\n 5728 |             errors.append(e)\n 5729 |         except self.CONNECTION_ERRORS as cluster_error:\n 5730 |             self.annotate_exception(cluster_error, 0, \"MULTI\")\n 5731 |             raise\n 5732 | \n 5733 |         # and all the other commands\n 5734 |         for i, command in enumerate(self._command_queue):\n 5735 |             if EMPTY_RESPONSE in command.options:\n 5736 |                 errors.append((i, command.options[EMPTY_RESPONSE]))\n 5737 |             else:\n 5738 |                 try:\n 5739 |                     _ = redis_node.parse_response(connection, \"_\")\n 5740 |                 except self.SLOT_REDIRECT_ERRORS as slot_error:\n 5741 |                     self.annotate_exception(slot_error, i + 1, command.args)\n 5742 |                     errors.append(slot_error)\n 5743 |                 except self.CONNECTION_ERRORS as cluster_error:\n 5744 |                     self.annotate_exception(cluster_error, i + 1, command.args)\n 5745 |                     raise\n 5746 |                 except ResponseError as e:\n 5747 |                     self.annotate_exception(e, i + 1, command.args)\n 5748 |                     errors.append(e)","lines":23,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/cluster.py#L5726-L5748"},{"ref":"redis/cluster.py:5775-5777","code":" 5775 |         # put any parse errors into the response\n 5776 |         for i, e in errors:\n 5777 |             response.insert(i, e)","lines":3,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/cluster.py#L5775-L5777"}]},
{"id":"LOGIC_30","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"mget_nonatomic collapses duplicate keys via a dict in _reorder_keys_by_command, but the partitioning de-duplicates inconsistently. _partition_keys_by_slot appends every occurrence of a key (including duplicates) to its slot list, so MGET is sent the key twice and the response has two values; _reorder_keys_by_command then builds `results` as a dict keyed by key, so the last value wins and the per-key value is still correct. However if the same key appears in the user's list and the MGET response order is positional, the zip(slot_values, response) still aligns. The real defect is subtler: when the SAME key is requested multiple times, the second occurrence's value silently overwrites the first in the dict, which is fine for MGET (same value) but for `_split_command_across_slots`-style summing semantics duplicate keys are NOT de-duplicated, so EXISTS/TOUCH/DEL count a duplicated key more than once - matching server EXISTS semantics but DEL/UNLINK/TOUCH would double-count if a key appears twice in a single slot batch (server returns count of distinct deleted keys per call, so summing is correct; but a key duplicated across the SAME slot is sent twice in one command and counted once by the server, while the user passed it twice). This is an edge inconsistency between the two reorder/sum paths.","fix":"Document that duplicate keys are not well-defined for these helpers, or de-duplicate keys per slot before issuing commands so behavior is deterministic across mget/exists/delete.","locations":[{"ref":"redis/commands/cluster.py:221-232","code":"  221 |     def _reorder_keys_by_command(\n  222 |         self,\n  223 |         keys: Iterable[KeyT],\n  224 |         slots_to_args: Mapping[int, Iterable[EncodableT]],\n  225 |         responses: Iterable[Any],\n  226 |     ) -> List[Any]:\n  227 |         results = {\n  228 |             k: v\n  229 |             for slot_values, response in zip(slots_to_args.values(), responses)\n  230 |             for k, v in zip(slot_values, response)\n  231 |         }\n  232 |         return [results[key] for key in keys]","lines":12,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/cluster.py#L221-L232"},{"ref":"redis/commands/cluster.py:182-190","code":"  182 |     def _partition_keys_by_slot(self, keys: Iterable[KeyT]) -> Dict[int, List[KeyT]]:\n  183 |         \"\"\"Split keys into a dictionary that maps a slot to a list of keys.\"\"\"\n  184 | \n  185 |         slots_to_keys = {}\n  186 |         for key in keys:\n  187 |             slot = key_slot(self.encoder.encode(key))\n  188 |             slots_to_keys.setdefault(slot, []).append(key)\n  189 | \n  190 |         return slots_to_keys","lines":9,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/cluster.py#L182-L190"}]},
{"id":"LOGIC_31","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"hscan passes NOVALUES to the server only when `no_values is not None` (i.e. when it is True OR False). Passing no_values=False explicitly will still append b'NOVALUES' to the wire command, because the guard tests `is not None` rather than truthiness, turning an explicit 'I want values' into 'no values'. The response-parsing path receives no_values=False but the server was told NOVALUES, so values are dropped. Should test `if no_values:`.","fix":"Change `if no_values is not None:` to `if no_values:` so NOVALUES is only sent when truthy.","locations":[{"ref":"redis/commands/core.py:6247-6249","code":" 6247 |         if no_values is not None:\n 6248 |             pieces.extend([b\"NOVALUES\"])\n 6249 |         return self.execute_command(\"HSCAN\", *pieces, no_values=no_values)","lines":3,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/core.py#L6247-L6249"}]},
{"id":"LOGIC_32","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"geosearch / _geosearchgeneric build the BYBOX clause with `if kwargs['width'] and kwargs['height']`, and the FROMLONLAT validation uses truthiness too. A width or height of 0 (a degenerate but representable box edge) is falsy, so BYBOX is silently dropped and the earlier guard `if kwargs['radius'] is None: if kwargs['width'] is None or kwargs['height'] is None` does NOT catch width=0/height=0 (0 is not None), producing a malformed GEOSEARCH command with no shape clause. Same truthiness pitfall affects longitude/latitude == 0 in FROMLONLAT: `if kwargs['longitude'] or kwargs['latitude']` and `if kwargs['member']` paths, though the FROMLONLAT add uses `is not None` correctly, the member/lonlat conflict check uses truthiness so a longitude of 0.0 with a member set would not be detected as a conflict.","fix":"Use explicit `is not None` checks for width/height/longitude/latitude instead of truthiness when deciding whether the user supplied them.","locations":[{"ref":"redis/commands/core.py:12032-12056","code":"12032 |         if kwargs[\"member\"]:\n12033 |             if kwargs[\"longitude\"] or kwargs[\"latitude\"]:\n12034 |                 raise DataError(\n12035 |                     \"GEOSEARCH member and longitude or latitude can't be set together\"\n12036 |                 )\n12037 |             pieces.extend([b\"FROMMEMBER\", kwargs[\"member\"]])\n12038 |         if kwargs[\"longitude\"] is not None and kwargs[\"latitude\"] is not None:\n12039 |             pieces.extend([b\"FROMLONLAT\", kwargs[\"longitude\"], kwargs[\"latitude\"]])\n12040 | \n12041 |         # BYRADIUS or BYBOX\n12042 |         if kwargs[\"radius\"] is None:\n12043 |             if kwargs[\"width\"] is None or kwargs[\"height\"] is None:\n12044 |                 raise DataError(\"GEOSEARCH must have radius or width and height\")\n12045 |         if kwargs[\"unit\"] is None:\n12046 |             raise DataError(\"GEOSEARCH must have unit\")\n12047 |         if kwargs[\"unit\"].lower() not in (\"m\", \"km\", \"mi\", \"ft\"):\n12048 |             raise DataError(\"GEOSEARCH invalid unit\")\n12049 |         if kwargs[\"radius\"]:\n12050 |             if kwargs[\"width\"] or kwargs[\"height\"]:\n12051 |                 raise DataError(\n12052 |                     \"GEOSEARCH radius and width or height can't be set together\"\n12053 |                 )\n12054 |             pieces.extend([b\"BYRADIUS\", kwargs[\"radius\"], kwargs[\"unit\"]])\n12055 |         if kwargs[\"width\"] and kwargs[\"height\"]:\n12056 |             pieces.extend([b\"BYBOX\", kwargs[\"width\"], kwargs[\"height\"], kwargs[\"unit\"]])","lines":25,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/core.py#L12032-L12056"}]},
{"id":"LOGIC_33","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"function_list always sends `LIBRARYNAME <library>` because library defaults to '*' and the code unconditionally does `args = ['LIBRARYNAME', library]`. The FUNCTION LIST command's LIBRARYNAME filter expects a specific library name, not a glob pattern; sending `LIBRARYNAME *` filters for a library literally named '*' on servers that do not treat it as a wildcard, so the default call may return nothing instead of listing all libraries. The optional filter should be omitted entirely when no library is requested.","fix":"Only append `['LIBRARYNAME', library]` when `library` is not None / not the sentinel '*'; otherwise send FUNCTION LIST with no LIBRARYNAME clause.","locations":[{"ref":"redis/commands/core.py:12352-12367","code":"12352 |     def function_list(\n12353 |         self, library: str | None = \"*\", withcode: bool | None = False\n12354 |     ) -> list[Any] | Awaitable[list[Any]]:\n12355 |         \"\"\"\n12356 |         Return information about the functions and libraries.\n12357 | \n12358 |         Args:\n12359 | \n12360 |             library: specify a pattern for matching library names\n12361 |             withcode: cause the server to include the libraries source implementation\n12362 |                 in the reply\n12363 |         \"\"\"\n12364 |         args = [\"LIBRARYNAME\", library]\n12365 |         if withcode:\n12366 |             args.append(\"WITHCODE\")\n12367 |         return self.execute_command(\"FUNCTION LIST\", *args)","lines":16,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/core.py#L12352-L12367"}]},
{"id":"LOGIC_34","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"nativestr() silently converts the literal string/bytes value \"null\" into Python None. Any genuine field whose value is the text \"null\" (e.g. a JSON string field, a tag value, a stored value that happens to be \"null\") is destroyed and indistinguishable from a real missing value. This is used widely by module response parsing (search/json) and delist()/parse_to_list build on it.","fix":"Do not special-case the string \"null\" inside the generic decoder. Handle JSON-null conversion only where the protocol actually represents null as the literal \"null\", not in a shared string-decoding utility.","locations":[{"ref":"redis/commands/helpers.py:58-63","code":"   58 | def nativestr(x):\n   59 |     \"\"\"Return the decoded binary string, or a string, depending on type.\"\"\"\n   60 |     r = x.decode(\"utf-8\", \"replace\") if isinstance(x, bytes) else x\n   61 |     if r == \"null\":\n   62 |         return\n   63 |     return r","lines":6,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/helpers.py#L58-L63"}]},
{"id":"LOGIC_35","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"JSON.set_path / async set_path derive the stored key with `file_path.rsplit(\".\")[0]`, which splits on every dot, so a path like `/data/v1.2/report.json` yields the key `/data/v1` instead of `/data/v1.2/report`. The TODO comment acknowledges this but the bug ships. Files in dotted directories get wrong (and colliding) keys.","fix":"Use `file_path.rsplit(\".\", 1)[0]` (or os.path.splitext) to strip only the final extension. Apply to both the sync and async copies.","locations":[{"ref":"redis/commands/json/commands.py:707-710","code":"  707 |                     # TODO: rsplit(\".\") splits on all dots, mishandling paths\n  708 |                     # with dots in directories (e.g. /data/v1.2/file.json).\n  709 |                     # Should be rsplit(\".\", 1) — fix in a separate PR.\n  710 |                     file_name = file_path.rsplit(\".\")[0]","lines":4,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/json/commands.py#L707-L710"},{"ref":"redis/commands/json/__init__.py:349-352","code":"  349 |                 # TODO: rsplit(\".\") splits on all dots, mishandling paths\n  350 |                 # with dots in directories (e.g. /data/v1.2/file.json).\n  351 |                 # Should be rsplit(\".\", 1) — fix in a separate PR.\n  352 |                 file_name = file_path.rsplit(\".\")[0]","lines":4,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/json/__init__.py#L349-L352"}]},
{"id":"LOGIC_36","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"easy","description":"TSInfo declares class-level default attributes `last_time_stamp` and `first_time_stamp` (note the extra underscore/word split), but __init__ sets the instance attributes `last_timestamp` and `first_timestamp`. The misspelled class defaults are therefore dead, and worse: if a TS.INFO response omits `lastTimestamp`/`firstTimestamp`, `info.last_timestamp` raises AttributeError (no instance attr and no correctly-named class default) instead of returning the intended `None`. Also note `source_key` has no class default at all, unlike the other fields.","fix":"Rename the class-level defaults to `last_timestamp = None` and `first_timestamp = None` (matching what __init__ assigns), and add `source_key = None`. Remove the misspelled `last_time_stamp`/`first_time_stamp` attributes.","locations":[{"ref":"redis/commands/timeseries/info.py:37-38","code":"   37 |     last_time_stamp = None\n   38 |     first_time_stamp = None","lines":2,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/timeseries/info.py#L37-L38"},{"ref":"redis/commands/timeseries/info.py:90-96","code":"   90 |         self.source_key = response.get(\"sourceKey\")\n   91 |         self.chunk_count = response.get(\"chunkCount\")\n   92 |         self.memory_usage = response.get(\"memoryUsage\")\n   93 |         self.total_samples = response.get(\"totalSamples\")\n   94 |         self.retention_msecs = response.get(\"retentionTime\")\n   95 |         self.last_timestamp = response.get(\"lastTimestamp\")\n   96 |         self.first_timestamp = response.get(\"firstTimestamp\")","lines":7,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/timeseries/info.py#L90-L96"}]},
{"id":"LOGIC_37","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"In timeseries TSInfo RESP2 parsing, `self.rules = response.get('rules')` returns the raw nested list while the RESP3 branch returns a dict/`{}` fallback. More importantly, RESP2 labels go through list_to_dict but RESP3 labels are returned raw (response.get('labels') or {}). The two wire formats produce different `rules`/`labels` shapes from the same TSInfo, so callers cannot rely on a consistent structure across protocols.","fix":"Normalise both branches to the same shape (e.g. convert RESP3 rules/labels into the same dict/list structures the RESP2 branch produces, or vice versa) so TSInfo.rules and TSInfo.labels are protocol-independent.","locations":[{"ref":"redis/commands/timeseries/info.py:80-89","code":"   80 |         if isinstance(args, dict):\n   81 |             # RESP3 wire: response is a native map.\n   82 |             response = args\n   83 |             self.rules = response.get(\"rules\") or {}\n   84 |             self.labels = response.get(\"labels\") or {}\n   85 |         else:\n   86 |             # RESP2 wire: flat list of alternating key-value pairs.\n   87 |             response = dict(zip(map(nativestr, args[::2]), args[1::2]))\n   88 |             self.rules = response.get(\"rules\")\n   89 |             self.labels = list_to_dict(response.get(\"labels\"))","lines":10,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/commands/timeseries/info.py#L80-L89"}]},
{"id":"LOGIC_38","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"AbstractConnection.can_read() calls self.connect() when there is no socket but does not assign or re-check the result, then immediately calls self._parser.can_read(timeout). connect() establishes self._sock and wires the parser via on_connect, but if connect() somehow leaves the parser without a socket buffer this dereferences a parser with no _sock. More importantly, after connecting, the method proceeds to poll a freshly connected socket for readable data which is conceptually the right behavior, but the 'if not sock: self.connect()' branch silently reconnects inside a readiness probe, which can mask logic errors and surprise callers expecting can_read on a closed connection to be cheap/non-reconnecting.","fix":"After self.connect(), refresh the local 'sock' reference and guard the subsequent parser.can_read call; or document/limit the implicit reconnect. At minimum, avoid relying on the stale 'sock' local after connecting.","locations":[{"ref":"redis/connection.py:1493-1508","code":" 1493 |     def can_read(self, timeout: float = 0) -> bool:\n 1494 |         \"\"\"Poll the socket to see if there's data that can be read.\"\"\"\n 1495 |         # TODO: Rename this API; it detects pending data or dirty/closed\n 1496 |         # connection state, not only whether application data can be read.\n 1497 |         sock = self._sock\n 1498 |         if not sock:\n 1499 |             self.connect()\n 1500 | \n 1501 |         host_error = self._host_error()\n 1502 | \n 1503 |         try:\n 1504 |             return self._parser.can_read(timeout)\n 1505 | \n 1506 |         except OSError as e:\n 1507 |             self.disconnect()\n 1508 |             raise ConnectionError(f\"Error while reading from {host_error}: {e.args}\")","lines":16,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/connection.py#L1493-L1508"}]},
{"id":"LOGIC_39","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"BlockingConnectionPool uses a single shared self._locked boolean flag across the reset/make_connection/get_connection/release/disconnect methods to track whether _lock was acquired for maintenance. Because _locked is instance-level (not per-call) and these methods can be entered concurrently from multiple threads (the pool is advertised as thread-safe), one thread's finally-block can observe and clear another thread's _locked flag, leading to a lock acquired by thread A being released by thread B (or not released at all). The _lock is an RLock, compounding the confusion. This is a genuine race on the maintenance fast-path.","fix":"Use a local boolean per method (acquired = False) instead of the shared self._locked attribute, or use 'with self._lock:' context managers guarded by self._in_maintenance. Never store lock-ownership state on the shared instance when the pool is concurrently accessed.","locations":[{"ref":"redis/connection.py:3806-3807","code":" 3806 |         self._in_maintenance = False\n 3807 |         self._locked = False","lines":2,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/connection.py#L3806-L3807"},{"ref":"redis/connection.py:3858-3864","code":" 3858 |         finally:\n 3859 |             if self._locked:\n 3860 |                 try:\n 3861 |                     self._lock.release()\n 3862 |                 except Exception:\n 3863 |                     pass\n 3864 |                 self._locked = False","lines":7,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/connection.py#L3858-L3864"},{"ref":"redis/connection.py:3858-3864","code":" 3858 |         finally:\n 3859 |             if self._locked:\n 3860 |                 try:\n 3861 |                     self._lock.release()\n 3862 |                 except Exception:\n 3863 |                     pass\n 3864 |                 self._locked = False","lines":7,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/connection.py#L3858-L3864"},{"ref":"redis/connection.py:3858-3864","code":" 3858 |         finally:\n 3859 |             if self._locked:\n 3860 |                 try:\n 3861 |                     self._lock.release()\n 3862 |                 except Exception:\n 3863 |                     pass\n 3864 |                 self._locked = False","lines":7,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/connection.py#L3858-L3864"},{"ref":"redis/connection.py:3858-3864","code":" 3858 |         finally:\n 3859 |             if self._locked:\n 3860 |                 try:\n 3861 |                     self._lock.release()\n 3862 |                 except Exception:\n 3863 |                     pass\n 3864 |                 self._locked = False","lines":7,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/connection.py#L3858-L3864"}]},
{"id":"LOGIC_40","type":"logic_error","type_label":"Logic Error","severity":"medium","difficulty":"medium","description":"ClusterKeyspaceNotifications.get_message resets self._poll_index to 0 inside _refresh_subscriptions_on_error (line 2089) and also uses self._poll_index across calls without any lock, while refresh_subscriptions / _execute_subscribe / _cleanup_node mutate self._node_pubsubs from potentially other threads (e.g. a user calling subscribe()/refresh_subscriptions() while a worker thread polls). The round-robin index is taken modulo len(pubsubs) (line 1996) so an out-of-range index is tolerated, but concurrent mutation of _node_pubsubs during iteration in get_message/_poll_all_nodes_once is only partially mitigated by snapshotting via list(...). Unlike the maint_notifications handlers, ClusterKeyspaceNotifications has only a _refresh_lock that guards refresh_subscriptions but not subscribe/get_message, so concurrent subscribe() + polling can interleave dict mutations on _node_pubsubs and _subscribed_* without protection.","fix":"Document the single-consumer-thread assumption explicitly, or guard mutations of _node_pubsubs/_subscribed_patterns/_subscribed_channels with the existing lock (or a dedicated lock) across subscribe/unsubscribe/get_message, not only refresh_subscriptions.","locations":[{"ref":"redis/keyspace_notifications.py:1842-1851","code":" 1842 |     def _ensure_node_pubsub(self, node) -> Any:\n 1843 |         \"\"\"Get or create a PubSub instance for a node.\"\"\"\n 1844 |         if node.name not in self._node_pubsubs:\n 1845 |             redis_conn = self.cluster.get_redis_connection(node)\n 1846 |             # Always create PubSub with ignore_subscribe_messages=False\n 1847 |             # so that the per-call argument in get_message() can control\n 1848 |             # the behavior reliably\n 1849 |             pubsub = redis_conn.pubsub(ignore_subscribe_messages=False)\n 1850 |             self._node_pubsubs[node.name] = pubsub\n 18 elf._poll_index = self._poll_index % len(pubsubs)\n 1997 |             pubsub = pubsubs[self._poll_index]\n 1998 |             self._poll_index += 1\n 1999 | \n 2000 |             try:\n 2001 |                 message = pubsub.get_message(\n 2002 |                     ignore_subscribe_messages=ignore_subscribe_messages,\n 2003 |                     timeout=per_node_timeout,\n 2004 |                 )\n 2005 |             except (ConnectionError, TimeoutError, RedisError):\n 2006 |                 # Connection error - refresh subscriptions and continue\n 2007 |                 self._refresh_subscriptions_on_error()\n 2008 |                 continue\n 2009 | \n 2010 |             if message is not None:\n 2011 |                 # Note: If a handler was registered, PubSub already invoked it\n 2012 |                 # and returned None, so we only reach here for handler-less subscriptions\n 2013 |                 notification = KeyNotification.from_message(\n 2014 |                     message, key_prefix=self.key_prefix\n 2015 |                 )\n 2016 |                 if notification is not None:\n 2017 |                     return notification\n 2018 |                 # If not a keyspace notification, continue checking other nodes","lines":61,"link":"https://github.com/redis/redis-py/blob/e7ac8be260036bd868e8783a00129b332684a8e4/redis/keyspace_notifications.py#L1958-L2018"},{"ref":"redis/keyspace_notifications.py:2082-2097","code":" 2082 |     def _refresh_subscriptions_on_error(self):\n 2083 |         \"\"\"\n 2084 |         Refresh subscriptions after a connection error.\n 2085 | \n 2086 |         This is called automatically when a connection error occurs during\n 2087 |         get_message(). It checks if nodes changed before refreshing.\n 2088 |         \"\"\"\n 2089 |         self._poll_index = 0  # Reset round-robin index\n 2090 | \n 2091 |         try:\n 2092 |             self.refresh_subscriptions()\n 2093 |         except Exception:\n 2094 |
